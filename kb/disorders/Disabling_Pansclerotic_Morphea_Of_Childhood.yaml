- name: Fibroblast Interleukin-6 Autoinflammatory Loop
  description: >-
    Unstimulated dermal fibroblasts from patients secrete about 12 times as much interleukin-6 as fibroblasts
    from healthy donors. Variant-transfected cells also express more interleukin-6 and SOCS genes.
    Interleukin-6 itself reproduces the patient fibroblast defects in healthy-donor fibroblasts, which
    supports a self-sustaining autoinflammatory loop in the stroma. Anti-interleukin-6 treatment produced
    only a modest improvement in vitro, whereas upstream JAK inhibition with ruxolitinib reduced
    interleukin-6 secretion.
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED

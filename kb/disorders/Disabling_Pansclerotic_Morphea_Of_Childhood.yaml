- category: Dermatological
  name: Morphea
  frequency: OBLIGATE
  phenotype_term:
    preferred_term: Pansclerotic morphea
    term:
      id: HP:0012344
      label: Morphea
  description: >-
    Sclerotic skin lesions that spread rapidly and become generalized and full-thickness, often with
    circumferential limb involvement. Biopsies are consistent with morphea, with thickened, hyalinized
    collagen bundles in the reticular dermis. The HPO term is defined as isolated patches of hardened skin,
    which understates the pansclerotic extent; it is used as the closest available morphea term.
  evidence:

- name: Type II Interferon-Driven Fibroblast-Dendritic Cell Crosstalk
  description: >-
    Single-cell and spatial transcriptomics of lesional skin from one patient with pansclerotic morphea
    showed a dominant type II interferon response, with T cells as the main IFN-gamma source.
    IFN-gamma-responsive CXCL9+ fibroblasts lay near the T cells and were related to profibrotic, TGF-beta-responsive
    COL8A1+ myofibroblasts, with cDC2B dendritic cells as a predicted communication hub. TGF-beta and
    IFN-gamma synergistically induced CXCL9 and CXCL10 in fibroblasts, and serum CXCL9 tracked disease
    activity in a separate pansclerotic morphea cohort. The patient's STAT4 genotype was not reported, so this
    node is a tissue-level model of pansclerotic morphea that has not been tied to the STAT4 lesion.

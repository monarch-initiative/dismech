diagnosis:
- name: Skin biopsy
  description: >-
    The clinical diagnosis of DPM rests on skin histology showing deep sclerosis with an inflammatory
    infiltrate; in the STAT4 families the diagnosis had been made this way before genetic testing.
  presence: PRESENT
  evidence:
  - reference: PMID:37256972
    reference_title: "Variant STAT4 and Response to Ruxolitinib in an Autoinflammatory Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "both had received diagnoses of DPM by means of skin biopsy"
    explanation: Skin biopsy established the clinical diagnosis in the index patients.
- name: Musculoskeletal imaging
  description: >-
    Imaging shows how deep the inflammation and sclerosis extend, from subcutis to muscle, which is what
    separates the pansclerotic form from superficial morphea.
  presence: PRESENT
  evidence:
  - reference: PMID:37256972
    reference_title: "Variant STAT4 and Response to Ruxolitinib in an Autoinflammatory Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Musculoskeletal imaging showed deep-tissue inflammation and sclerosis of several levels from subcutis to muscle, findings consistent with DPM."
    explanation: Imaging documented the depth of tissue involvement characteristic of DPM.
- name: Genome sequencing for STAT4 variants
  description: >-
    Sequencing identifies the heterozygous STAT4 gain-of-function variant that defines the genetic form
    and points to JAK inhibition as a treatment.
  presence: PRESENT
  evidence:
  - reference: PMID:37256972
    reference_title: "Variant STAT4 and Response to Ruxolitinib in an Autoinflammatory Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genome sequencing revealed three novel heterozygous missense gain-of-function variants in STAT4."
    explanation: Genome sequencing identified the causal STAT4 variants.
mappings:
  icd10cm_mappings:
  - term:
      id: ICD10CM:L94.0
      label: Localized scleroderma [morphea]
    mapping_predicate: skos:broadMatch
    mapping_source: dismech
    mapping_justification: >-
      ICD-10-CM has no code for disabling pansclerotic morphea or for STAT4-related disease; L94.0 covers
      all localized scleroderma (morphea) and is broader than this entry.
notes: >-
  The MONDO term is cross-referenced to OMIM 620443, the STAT4-related genetic form, whereas
  most of the clinical literature on disabling pansclerotic morphea predates the 2023 gene discovery and
  describes clinically diagnosed, ungenotyped patients. Claims taken from that literature (ulcer-associated
  squamous cell carcinoma, contractures, treatments other than ruxolitinib) are about clinically defined
  DPM, and some (hypergammaglobulinemia and eosinophilia in the 1980 series) differ from the STAT4 cases.
  The type II interferon tissue mechanism comes from one patient with pansclerotic morphea whose genotype
  was not reported. A GeneReviews chapter for this disease was not found.

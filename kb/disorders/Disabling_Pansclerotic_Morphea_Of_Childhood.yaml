treatments:
- name: Ruxolitinib
  description: >-
    Oral JAK1/2 inhibitor. In patient fibroblasts it reduced interleukin-6 secretion, phosphorylated STAT4
    and its nuclear localization, and restored scratch-wound closure. In two treated STAT4-variant patients
    it cleared rash and oral ulcers, normalized inflammatory markers, resolved neutropenia and improved
    pulmonary hypertension without reported adverse events. JAK inhibitors are not approved for DPM; the
    authors propose this approach for refractory disease.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ruxolitinib
      term:
        id: CHEBI:66919
        label: ruxolitinib
  evidence:
  - reference: PMID:37256972
    reference_title: "Variant STAT4 and Response to Ruxolitinib in an Autoinflammatory Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Inhibition of Janus kinase (JAK)-STAT signaling with ruxolitinib led to improvement in the hyperinflammatory fibroblast phenotype in vitro and resolution of inflammatory markers and clinical symptoms in treated patients, without adverse effects."
    explanation: Clinical and in vitro response to ruxolitinib in STAT4-variant DPM.
  - reference: PMID:37256972
    reference_title: "Variant STAT4 and Response to Ruxolitinib in an Autoinflammatory Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patient 2 has since begun therapy with ruxolitinib, with improvement in his pulmonary hypertension."
    explanation: Improvement in pulmonary hypertension on ruxolitinib.
  - reference: PMID:40518164
    reference_title: "[A case of autoinflammatory disease with STAT4 variant and localized scleroderma]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "经激素及芦可替尼（早5.0 mg+晚2.5 mg）治疗后明显缓解"
    explanation: >-
      Chinese-language abstract: after glucocorticoids and ruxolitinib (5.0 mg morning, 2.5 mg evening)
      the STAT4 p.His623Tyr patient improved markedly, an independent report of response to JAK
      inhibition.
  target_mechanisms:

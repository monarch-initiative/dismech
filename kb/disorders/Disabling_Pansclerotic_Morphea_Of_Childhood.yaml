- name: Lymphocyte Inflammatory Transcriptional Program
  description: >-
    Single-cell RNA sequencing of patient peripheral-blood cells showed an immunodysregulatory profile in
    NK cells and T cells, which express STAT4 highly. Ruxolitinib reduced the inferred activity of
    inflammatory regulators including IFNG, IFNA, TNF, IL6 and STAT1. Th1 skewing was not observed, but
    T-cell subsets showed evidence of exhaustion. Skin biopsies show a subepidermal inflammatory infiltrate
    composed mostly of CD3-positive T cells. How STAT4 gain of function produces the systemic cytopenias
    and hypogammaglobulinemia is not established.
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL

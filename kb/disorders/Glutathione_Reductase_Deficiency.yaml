    Diagnosis rests on demonstrating markedly reduced or absent erythrocyte GR
    activity that is not corrected by FAD, distinguishing hereditary deficiency
    from acquired riboflavin-related FAD undersaturation, with molecular
    confirmation of biallelic GSR variants.
  evidence:
  - reference: PMID:947404

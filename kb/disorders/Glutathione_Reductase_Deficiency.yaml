      label: erythrocyte clearance
    modifier: INCREASED
  evidence:
  - reference: PMID:8813716
    reference_title: "Hemolytic anemias due to erythrocyte enzyme deficiencies."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: "If an enzyme deficiency of one of these metabolic pathways limits the ATP and/or NADPH production, distinct membrane alterations result causing a removal of the damaged cells by the monocyte-macrophage system."
    explanation: >-
      Review of red-cell enzymopathies states the general route from a redox
      enzyme defect to membrane damage and macrophage removal of erythrocytes;
      applied here to the glutathione cycle defect.
  - reference: PMID:947404
    reference_title: "Familial deficiency of glutathione reductase in human blood cells."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "this deficiency was manifested by hemolytic crises after eating fava beans in the eldest daughter (patient)"
    explanation: >-
      Documents fava-bean-triggered hemolytic crises as the clinical
      manifestation of the enzyme defect.
  downstream:
  - target: Hemolytic anemia
    causal_link_type: DIRECT
    description: >-
      Premature destruction of oxidatively vulnerable erythrocytes produces
      hemolytic anemia.
  - target: Fava bean-induced hemolytic anemia
    causal_link_type: DIRECT
    description: >-
      Fava bean ingestion is the documented oxidant trigger of acute hemolysis
      in this disorder.
  - target: Neonatal hyperbilirubinemia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Severe neonatal jaundice was the presenting feature of a GR-deficient
      patient; that it results from hemolysis in the newborn period is inferred
      from the enzyme defect, since the report states only the jaundice.
    evidence:
    - reference: PMID:17185460

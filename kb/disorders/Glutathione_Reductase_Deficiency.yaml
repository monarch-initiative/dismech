name: Glutathione Reductase Deficiency
creation_date: "2026-10-15T01:36:48Z"
category: Mendelian
synonyms:
- Hemolytic anemia due to glutathione reductase deficiency
- Hemolytic anemia due to glutathione reductase (GSR) deficiency
- GSR deficiency
- Hereditary glutathione reductase deficiency
- Inherited glutathione reductase deficiency
description: >-
  Glutathione reductase deficiency is a very rare autosomal recessive disorder
  of erythrocyte antioxidant defense caused by biallelic loss-of-function
  variants in GSR, which encodes glutathione-disulfide reductase (GR, EC
  1.8.1.7). GR is the FAD- and NADPH-dependent flavoenzyme that regenerates
  reduced glutathione (GSH) from oxidized glutathione disulfide (GSSG). When GR
  activity is essentially absent, erythrocytes cannot restore GSH after an
  oxidant load, so hemoglobin and membrane proteins are left unprotected against
  reactive oxygen species. The clinical picture of hereditary GR deficiency is
  dominated by oxidant-triggered (including favism) hemolysis and severe
  neonatal jaundice, with cataract tentatively attributed to the deficiency in
  the original family; because
  the enzyme is also deficient in leukocytes, the propositus family showed
  reduced phagocyte glutathione-dependent defense. The disorder is defined
  genetically and is exceptionally rare: GSR variants abolishing red-cell GR
  activity have been characterized in two families, the originally described
  family and an unrelated patient presenting with severe neonatal jaundice. It
  must be distinguished from the common acquired low red-cell GR
  activity caused by dietary riboflavin (vitamin B2) insufficiency, which reduces
  the FAD saturation of the apoenzyme and is reversible with riboflavin; that
  non-genetic state is not a subtype of this Mendelian disorder.

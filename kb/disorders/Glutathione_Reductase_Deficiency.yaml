    snippet: "Patient 2 was found to be a compound heterozygote, with a premature stop codon on one allele and a substitution of glycine 330, a highly conserved residue in the superfamily of NAD(P)H-dependent disulfide reductases, into alanine on the other allele."
    explanation: >-
      DNA analysis identified the biallelic GSR variants in the second patient.
treatments:
- name: Avoidance of oxidant triggers
  description: >-
    Avoidance of fava beans and other oxidant stressors is the mainstay of
    preventing acute hemolytic crises, by analogy with the management of oxidant
    hemolysis in G6PD deficiency and consistent with the fava-bean-triggered
    crises documented in this disorder.
  treatment_term:
    preferred_term: Supportive care, avoidance of oxidant triggers
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:947404
    reference_title: "Familial deficiency of glutathione reductase in human blood cells."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "this deficiency was manifested by hemolytic crises after eating fava beans in the eldest daughter (patient)"
    explanation: >-
      Documents the fava bean trigger whose avoidance is the rationale for this
      supportive measure; the source does not itself report avoidance as a
      treatment.
- name: Phototherapy for neonatal jaundice
  description: >-
    Severe neonatal jaundice is managed with standard phototherapy, with
    exchange transfusion for severe hyperbilirubinemia, as for other hemolytic
    causes of neonatal jaundice.
  treatment_term:
    preferred_term: Phototherapy
    term:
      id: NCIT:C15301
      label: Phototherapy
  evidence:
  - reference: PMID:17185460
    reference_title: "Molecular basis of glutathione reductase deficiency in human blood cells."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "a novel patient (2) presenting with severe neonatal jaundice"
    explanation: >-
      The documented severe neonatal jaundice is the indication for
      phototherapy; the source does not report the treatment given.
- name: Blood transfusion
  description: >-
    Red cell transfusion is used to support severe hemolytic anemia and
    hemolytic crises, as for other red-cell enzyme deficiency states.
  treatment_term:
    preferred_term: Blood transfusion
    term:
      id: NCIT:C15192
      label: Blood Transfusion
  evidence:
  - reference: PMID:145206
    reference_title: "Transfusion requirements of patients with enzyme deficient red blood cells."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: "Red cell enzyme deficiency disease states are reviewed to outline the requirements for transfusion therapy in the neonatal period, during spontaneous crises, drug or infection-induced crises and chronic anemia."
    explanation: >-
      Review of red-cell enzyme deficiency states establishes transfusion as
      supportive therapy for hemolytic crises in these enzymopathies, a class
      that includes GR deficiency; it does not report GR-deficient patients.
differential_diagnoses:
- name: Acquired (riboflavin-deficiency) low erythrocyte glutathione reductase activity
  description: >-
    Low red-cell GR activity is far more commonly acquired, resulting from
    dietary riboflavin (vitamin B2) insufficiency that leaves the GR apoenzyme
    undersaturated with its FAD cofactor. Unlike the hereditary defect, this
    activity is restored in vitro by FAD and in vivo by riboflavin
    supplementation, and it is not a genetic subtype of this disorder.
  distinguishing_features:
  - Restoration of GR activity by FAD in vitro or riboflavin in vivo indicates acquired FAD undersaturation rather than a structural GSR defect; hereditary deficiency is non-restorable.
  evidence:
  - reference: PMID:5794396
    reference_title: "Glutathione reductase: stimulation in normal subjects by riboflavin supplementation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Stimulation of glutathione reductase activity of red cells of normal subjects occurred when they were given 5 milligrams of riboflavin daily for 8 days."
    explanation: >-
      Demonstrates that acquired low GR activity reflects riboflavin/FAD status
      and is corrected by riboflavin, distinguishing it from the hereditary
      defect.
  - reference: PMID:11924113
    reference_title: "Glutathione reductase deficiency in Saudi Arabia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "17.8% of males and 22.4% of females suffered from GR deficiency due to riboflavin deficiency. This could be easily corrected by dietary supplementation with riboflavin. No cases of severe GR deficiency were identified."
    explanation: >-
      In 1,691 Saudi individuals, riboflavin-related low GR activity was common
      and correctable, while no severe (hereditary-range) deficiency was found.
- name: Glucose-6-phosphate dehydrogenase (G6PD) deficiency
  description: >-
    G6PD deficiency is the common cause of oxidant-triggered (including favism)
    nonspherocytic hemolytic anemia and shares the biochemical endpoint of
    impaired NADPH-dependent glutathione protection. Inhibition of GR produces a
    phenocopy of G6PD-deficient cells.
  distinguishing_features:
  - G6PD deficiency is X-linked and reflects deficient NADPH generation, whereas GR deficiency is autosomal recessive and reflects failure to regenerate GSH from GSSG downstream of NADPH.
  evidence:
  - reference: PMID:3572207
    reference_title: "Consequences of erythrocytic glutathione reductase deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Only erythrocytes that had been rendered almost totally GSSG-R deficient, that is, had lost greater than 90% of baseline activity, became functionally equivalent to GdA- glucose-6-phosphate dehydrogenase-deficient cells."
    explanation: >-
      Establishes that near-complete GR loss produces a functional phenocopy of
      G6PD deficiency, the key differential.
animal_models:
- name: Gsr-null mouse (neutrophil host defense)
  species: Mouse
  genotype: Gsr homozygous null
  publication: PMID:22279102
  description: >-
    Gsr-deficient mice have impaired neutrophil oxidative burst, phagocytosis
    and bacterial killing, reduced neutrophil extracellular trap formation, and
    increased susceptibility to Escherichia coli and Staphylococcus aureus
    challenge.
  genes:
  - preferred_term: Gsr
    term:
      id: hgnc:4623
      label: GSR
  evidence:
  - reference: PMID:22279102
    reference_title: "Glutathione reductase facilitates host defense by sustaining phagocytic oxidative burst and promoting the development of neutrophil extracellular traps."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Gsr-null mice exhibited enhanced susceptibility to Escherichia coli challenge, indicated by dramatically increased bacterial burden, cytokine storm, striking histological abnormalities, and substantially elevated mortality."
    explanation: >-
      Establishes the knockout as a model of the phagocyte branch of GR
      deficiency.
  modeled_mechanisms:
  - target: Phagocyte Glutathione-Dependent Defense Impairment
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    limitations: >-
      The mouse shows a clear host-defense defect after massive bacterial
      challenge, whereas clinically significant immunodeficiency has not been
      reported in GR-deficient patients; only abnormal neutrophil oxygen
      consumption was described in the index family.
    evidence:
    - reference: PMID:22279102
      reference_title: "Glutathione reductase facilitates host defense by sustaining phagocytic oxidative burst and promoting the development of neutrophil extracellular traps."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Unlike wild-type neutrophils that exhibited a sustained oxidative burst upon stimulation with phorbol ester and fMLP, Gsr-deficient neutrophils displayed a very transient oxidative burst that abruptly ceased shortly after stimulation."
      explanation: >-
        The knockout neutrophil reproduces a glutathione-reductase-dependent
        defect in the phagocyte oxidative burst.
- name: Gr1a1Neu mouse (chemically induced GR mutant)
  species: Mouse
  genotype: Gr1a1Neu homozygous (about 2% residual GR activity)
  publication: PMID:10218442
  description: >-
    A chemically induced glutathione reductase mutant at the Gr1 structural
    locus on mouse chromosome 8. Homozygotes retain about 2% of normal blood GR
    activity, with the loss present in blood and other tissues. Without an
    oxidant challenge their erythrocyte indices are normal, as baseline red-cell
    GSH is normal in GR-deficient patients; triggered hemolysis was not tested.
  genes:
  - preferred_term: Gsr
    term:
      id: hgnc:4623
      label: GSR
  evidence:
  - reference: PMID:10218442
    reference_title: "Glutathione reductase activity deficiency in homozygous Gr1a1Neu mice does not cause haemolytic anaemia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Homozygous mutants with only 2% residual enzyme activity were recovered in progeny of inter se matings of heterozygotes."
    explanation: >-
      Documents a near-null GR mutant mouse.
  modeled_mechanisms:
  - target: GSR Loss-of-Function and Absent Glutathione Reductase Activity
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    limitations: >-
      The mouse allele is a chemically induced mutation at the Gr1 locus, not a
      human GSR variant, and leaves about 2% residual activity where the human
      enzyme-null patients have essentially none. The study measured erythrocyte
      indices only without an oxidant challenge, so it says nothing about
      oxidant-triggered hemolysis.
    evidence:
    - reference: PMID:10218442
      reference_title: "Glutathione reductase activity deficiency in homozygous Gr1a1Neu mice does not cause haemolytic anaemia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The loss of GR activity was evident both in blood and in other tissue extracts."
      explanation: >-
        The mutant reproduces the generalized near-absence of GR activity that
        defines the human enzyme defect.
notes: >-
  Hereditary glutathione reductase deficiency is defined by near-absent
  erythrocyte GR activity caused by biallelic GSR variants. Kamerbeek et al.
  (2007) characterized the variants in two families: a homozygous 2246-bp
  deletion in the family originally described by Loos et al. (1976), and
  compound heterozygosity for a nonsense allele and G330A in an unrelated
  patient with severe neonatal jaundice. A 2026 case report from India
  (PMID:41984322) has no abstract and is not cited. The much more common finding of low red-cell GR
  activity is acquired, reflecting dietary riboflavin insufficiency and
  undersaturation of the apoenzyme with FAD; it is reversible with riboflavin and
  is recorded here as a differential diagnosis, not a subtype. The leukocyte GR
  defect and its possible effect on phagocyte bactericidal function rest on a
  single family. Two pathophysiology nodes conform to the
  hemolytic_anemia_erythrocyte_destruction module. Cataract was attributed to
  the deficiency only tentatively in the original family, and the lens step is
  inferred from general cataract biology rather than studied in GR-deficient
  lenses. No GeneReviews chapter exists for this disorder.

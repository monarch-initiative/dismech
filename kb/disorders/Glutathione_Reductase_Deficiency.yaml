      supportive therapy during crises and chronic anemia, the class to which
      GR deficiency belongs.
differential_diagnoses:
- name: Acquired (riboflavin-deficiency) low erythrocyte glutathione reductase activity
  description: >-
    Low red-cell GR activity is far more commonly acquired, resulting from
    dietary riboflavin (vitamin B2) insufficiency that leaves the GR apoenzyme
    undersaturated with its FAD cofactor. Unlike the hereditary defect, this
    activity is restored in vitro by FAD and in vivo by riboflavin
    supplementation, and it is not a genetic subtype of this disorder.
  distinguishing_features:
  - Restoration of GR activity by FAD in vitro or riboflavin in vivo indicates acquired FAD undersaturation rather than a structural GSR defect; hereditary deficiency is non-restorable.
  evidence:
  - reference: PMID:5794396
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Stimulation of glutathione reductase activity of red cells of normal subjects occurred when they were given 5 milligrams of riboflavin daily for 8 days."
    explanation: >-
      Demonstrates that acquired low GR activity reflects riboflavin/FAD status
      and is corrected by riboflavin, distinguishing it from the hereditary
      defect.
  - reference: PMID:11924113
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "17.8% of males and 22.4% of females suffered from GR deficiency due to riboflavin deficiency. This could be easily corrected by dietary supplementation with riboflavin. No cases of severe GR deficiency were identified."
    explanation: >-
      In 1,691 Saudi individuals, riboflavin-related low GR activity was common
      and correctable, while no severe (hereditary-range) deficiency was found.
- name: Glucose-6-phosphate dehydrogenase (G6PD) deficiency
  description: >-
    G6PD deficiency is the common cause of oxidant-triggered (including favism)
    nonspherocytic hemolytic anemia and shares the biochemical endpoint of
    impaired NADPH-dependent glutathione protection. Inhibition of GR produces a
    phenocopy of G6PD-deficient cells.
  distinguishing_features:
  - G6PD deficiency is X-linked and reflects deficient NADPH generation, whereas GR deficiency is autosomal recessive and reflects failure to regenerate GSH from GSSG downstream of NADPH.
  evidence:
  - reference: PMID:3572207
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Only erythrocytes that had been rendered almost totally GSSG-R deficient, that is, had lost greater than 90% of baseline activity, became functionally equivalent to GdA- glucose-6-phosphate dehydrogenase-deficient cells."
    explanation: >-
      Establishes that near-complete GR loss produces a functional phenocopy of
      G6PD deficiency, the key differential.
animal_models:
- name: Gsr-null mouse (neutrophil host defense)
  species: Mouse
  genotype: Gsr homozygous null
  publication: PMID:22279102
  description: >-
    Gsr-deficient mice have impaired neutrophil oxidative burst, phagocytosis
    and bacterial killing, reduced neutrophil extracellular trap formation, and
    increased susceptibility to Escherichia coli and Staphylococcus aureus
    challenge.
  genes:
  - preferred_term: Gsr
    term:
      id: hgnc:4623
      label: GSR
  evidence:
  - reference: PMID:22279102
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Gsr-null mice exhibited enhanced susceptibility to Escherichia coli challenge, indicated by dramatically increased bacterial burden, cytokine storm, striking histological abnormalities, and substantially elevated mortality."
    explanation: >-
      Establishes the knockout as a model of the phagocyte branch of GR
      deficiency.
  modeled_mechanisms:
  - target: Phagocyte Glutathione-Dependent Defense Impairment
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    limitations: >-
      The mouse shows a clear host-defense defect after massive bacterial
      challenge, whereas clinically significant immunodeficiency has not been
      reported in GR-deficient patients; only abnormal neutrophil oxygen
      consumption was described in the index family.
    evidence:
    - reference: PMID:22279102
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Unlike wild-type neutrophils that exhibited a sustained oxidative burst upon stimulation with phorbol ester and fMLP, Gsr-deficient neutrophils displayed a very transient oxidative burst that abruptly ceased shortly after stimulation."
      explanation: >-
        The knockout neutrophil reproduces a glutathione-reductase-dependent
        defect in the phagocyte oxidative burst.
- name: Gr1a1Neu mouse (chemically induced GR mutant)
  species: Mouse
  genotype: Gr1a1Neu homozygous (about 2% residual GR activity)
  publication: PMID:10218442
  description: >-
    A chemically induced glutathione reductase mutant at the Gr1 structural
    locus on mouse chromosome 8. Homozygotes retain about 2% of normal blood GR
    activity but show no hemolytic anemia.
  genes:
  - preferred_term: Gsr
    term:
      id: hgnc:4623
      label: GSR
  evidence:
  - reference: PMID:10218442
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Homozygous mutants with only 2% residual enzyme activity were recovered in progeny of inter se matings of heterozygotes."
    explanation: >-
      Documents a near-null GR mutant mouse.
  modeled_mechanisms:
  - target: Oxidant-Triggered Hemolysis
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: ORGANISM
    limitations: >-
      Without an oxidant challenge, near-complete GR loss in the mouse does not
      produce hemolytic anemia, consistent with the trigger-dependent human
      phenotype; the study did not test fava-bean-type or drug oxidant
      challenge, so it cannot show whether triggered hemolysis is reproduced.
    evidence:
    - reference: PMID:10218442
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Erythrocyte and organo-somatic indices did not show differences between wild-types and homozygous mutants, indicating no association between the GR deficiency and haemolytic anaemia in this potential animal model."
      explanation: >-
        The unchallenged mutant shows no hemolytic anemia despite near-absent GR.
notes: >-
  Hereditary glutathione reductase deficiency is defined by near-absent
  erythrocyte GR activity caused by biallelic GSR variants; complete deficiency
  has been molecularly characterized in only a single consanguineous family
  (originally described by Loos et al., 1976), with a second patient reported by
  Kamerbeek et al., 2007. The much more common finding of low red-cell GR
  activity is acquired, reflecting dietary riboflavin insufficiency and
  undersaturation of the apoenzyme with FAD; it is reversible with riboflavin and
  is recorded here as a differential diagnosis, not a subtype. The leukocyte GR
  defect and its possible effect on phagocyte bactericidal function rest on a
  single family. Two pathophysiology nodes conform to the
  hemolytic_anemia_erythrocyte_destruction module. The lens step leading to
  cataract is inferred from general cataract biology rather than studied in
  GR-deficient lenses. No GeneReviews chapter exists for this disorder.

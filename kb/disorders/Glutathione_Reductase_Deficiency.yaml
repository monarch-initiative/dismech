    snippet: "this deficiency was manifested by hemolytic crises after eating fava beans in the eldest daughter (patient)"
    explanation: >-
      Documents the fava bean trigger whose avoidance is the rationale for this
      supportive measure.
- name: Phototherapy for neonatal jaundice
  description: >-
    Neonatal unconjugated hyperbilirubinemia is managed with standard
    phototherapy, with exchange transfusion for severe hyperbilirubinemia, as
    for other hemolytic causes of neonatal jaundice.
  treatment_term:

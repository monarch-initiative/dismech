  description: >-
    Avoidance of fava beans and other oxidant stressors is the mainstay of
    preventing acute hemolytic crises, by analogy with the management of oxidant
    hemolysis in G6PD deficiency and consistent with the fava-bean-triggered
    crises documented in this disorder.
  treatment_term:
    preferred_term: Supportive care, avoidance of oxidant triggers
    term:

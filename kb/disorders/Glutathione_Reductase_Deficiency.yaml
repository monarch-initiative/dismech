prevalence:
- population: Worldwide
  measure_type: POINT_PREVALENCE
  prevalence_class: BELOW_1_IN_1000000
  rate_per_100000: 0.1
  notes: >-
    Orphanet records the worldwide point prevalence of hereditary glutathione
    reductase deficiency as below 1 per 1,000,000, documented only at the level
    of individual cases/families. Complete hereditary GR deficiency has been
    molecularly characterized in a single consanguineous family, and the enzyme
    defect was found in only 2 of more than 15,000 blood samples tested.
  evidence:
  - reference: ORPHA:90030
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "<1 / 1 000 000 | Worldwide | Point prevalence | PMID:947404"
    explanation: >-
      Orphanet epidemiology table reports a worldwide point prevalence of less
      than 1 per 1,000,000 for this disorder.
  - reference: PMID:17185460
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hereditary glutathione reductase (GR) deficiency was found in only 2 cases when testing more than 15 000 blood samples."
    explanation: >-
      Documents the extreme rarity of hereditary GR deficiency in a large
      screened sample.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Hereditary glutathione reductase deficiency is inherited in an autosomal
    recessive manner. In the originally described family the affected children
    of a consanguineous marriage had virtually absent erythrocyte GR activity
    while both parents had intermediate (heterozygous-range) values.
  evidence:
  - reference: PMID:947404
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A virtually complete absence of glutathione reductase activity was found in the erythrocytes of all three children (one male, two females) from a consanguineous marriage. Intermediate values were found in the erythrocytes of both parents."
    explanation: >-
      The affected sibship from a consanguineous union with heterozygous-range
      parental values establishes autosomal recessive inheritance.
genetic:
- name: GSR biallelic loss-of-function variants
  gene_term:
    preferred_term: GSR
    term:
      id: hgnc:4623
      label: GSR
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    GSR encodes glutathione-disulfide reductase. Complete hereditary GR
    deficiency was shown to result from loss-of-function mutations in the GSR
    apoprotein: a homozygous large deletion removing the dimerization domain in
    the originally described family, and compound heterozygosity for a premature
    stop codon and a destabilizing G330A missense substitution in a second
    patient. These are the first identified GSR mutations causing clinical GR
    deficiency.
  evidence:
  - reference: PMID:17185460
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This is the first identification of mutations in the GR gene causing clinical GR deficiency."
    explanation: >-
      Establishes GSR as the causative gene for hereditary glutathione
      reductase deficiency.
  - reference: PMID:17185460
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Owing to a 2246-bp deletion in the patients' DNA, translated GR is expected to lack almost the complete dimerization domain, which results in unstable and inactive enzyme."
    explanation: >-
      Documents a loss-of-function GSR deletion producing an inactive enzyme.
  - reference: PMID:17185460
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patient 2 was found to be a compound heterozygote, with a premature stop codon on one allele and a substitution of glycine 330, a highly conserved residue in the superfamily of NAD(P)H-dependent disulfide reductases, into alanine on the other allele."
    explanation: >-
      Documents biallelic (compound heterozygous) GSR variants in a second
      patient, consistent with recessive loss of function.
pathophysiology:
- name: GSR Loss-of-Function and Absent Glutathione Reductase Activity
  description: >-
    Biallelic GSR variants abolish glutathione-disulfide reductase activity. GR
    is the NADPH- and FAD-dependent flavoenzyme that reduces oxidized
    glutathione disulfide (GSSG) back to reduced glutathione (GSH). In affected
    erythrocytes and leukocytes the enzyme protein is unstable or undetectable
    and GR activity is essentially absent and cannot be restored by FAD in vitro
    or by riboflavin in vivo, distinguishing the genetic defect from acquired
    FAD-undersaturation.
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: glutathione-disulfide reductase (NADPH) activity
    term:
      id: GO:0004362
      label: glutathione-disulfide reductase (NADPH) activity
    modifier: DECREASED
  chemical_entities:
  - preferred_term: FAD
    term:
      id: CHEBI:16238
      label: FAD
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:947404
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The enzyme activity could not be restored either by addition of FAD in vitro or by administration of riboflavin in vivo."
    explanation: >-
      The non-restorable loss of activity marks a structural apoenzyme defect
      rather than reversible FAD undersaturation.
  downstream:
  - target: Failure to Regenerate Reduced Glutathione
    causal_link_type: DIRECT
    description: >-
      Absent GR activity leaves the cell unable to convert GSSG back to GSH
      following an oxidant load.
  - target: Lens Oxidative Injury
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      GR deficiency extends to the lens, where loss of glutathione-dependent
      antioxidant protection is associated with cataract.
  - target: Phagocyte Glutathione-Dependent Defense Impairment
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      GR is also deficient in leukocytes, impairing glutathione-dependent
      phagocyte defense.
  - target: Thioredoxin System Compensation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Loss of GR is followed by increased thioredoxin and thioredoxin reductase
      activity in Gsr-knockout mouse tissue, an alternative route for GSSG
      reduction.
- name: Thioredoxin System Compensation
  description: >-
    The thioredoxin/thioredoxin reductase system can reduce GSSG to GSH and
    acts as a functional backup for GR. In Gsr-knockout mice, inner-ear
    thioredoxin and thioredoxin reductase activities rose and no oxidative
    damage or hearing deficit developed. This compensation is a candidate
    explanation for why the human disorder is episodic and trigger-dependent
    rather than a chronic hemolytic state, but it has not been measured in
    GR-deficient patients.
  biological_scale: MOLECULAR
  role: compensation
  molecular_functions:
  - preferred_term: thioredoxin-disulfide reductase (NADPH) activity
    term:
      id: GO:0004791
      label: thioredoxin-disulfide reductase (NADPH) activity
    modifier: INCREASED
  evidence:
  - reference: PMID:28686716
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Gsr deficiency resulted in increased activities of cytosolic thioredoxin and thioredoxin reductase in the inner ears."
    explanation: >-
      Gsr-knockout mice upregulate the thioredoxin system, the proposed
      compensating route for GSSG reduction.
  - reference: PMID:28686716
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "the thioredoxin system can support GSSG reduction in the mouse peripheral auditory system"
    explanation: >-
      The authors conclude the thioredoxin system can substitute for GR in GSSG
      reduction in this tissue.
- name: Failure to Regenerate Reduced Glutathione
  description: >-
    Without GR, erythrocytes cannot reduce GSSG back to GSH after an oxidant
    challenge, so the reduced-glutathione pool collapses under oxidative stress.
    Baseline GSH may appear near-normal because little is consumed at rest, but
    glutathione stability during an oxidant challenge is severely diminished.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: glutathione metabolic process
    term:
      id: GO:0006749
      label: glutathione metabolic process
    modifier: DYSREGULATED
  chemical_entities:
  - preferred_term: glutathione disulfide
    term:
      id: CHEBI:17858
      label: glutathione disulfide
    modifier: INCREASED
  - preferred_term: glutathione
    term:
      id: CHEBI:16856
      label: glutathione
    modifier: DECREASED
  evidence:
  - reference: PMID:947404
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Severely diminished glutathione stability during incubation with acetylphenylhydrazine was observed in the erythrocytes of the siblings"
    explanation: >-
      An oxidant challenge in vitro shows the GSH pool cannot be sustained,
      the direct consequence of absent GR activity.
  downstream:
  - target: Erythrocyte Oxidative and Membrane Injury
    causal_link_type: DIRECT
    description: >-
      The loss of regenerable GSH leaves hemoglobin and membrane proteins
      undefended against reactive oxygen species.
- name: Erythrocyte Oxidative and Membrane Injury
  conforms_to: "hemolytic_anemia_erythrocyte_destruction#Oxidative and Membrane Injury"
  description: >-
    With the GSH antioxidant buffer depleted, oxidant exposure denatures
    hemoglobin and damages the erythrocyte membrane, reducing cell integrity and
    marking the cell for removal. The reserve capacity of GR in normal red cells
    is large, so impaired GSH recovery under oxidant stress emerges only when
    enzyme activity is almost completely lost.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: erythrocyte
    term:
      id: CL:0000232
      label: erythrocyte
  biological_processes:
  - preferred_term: response to oxidative stress
    term:
      id: GO:0006979
      label: response to oxidative stress
    modifier: INCREASED
  evidence:
  - reference: PMID:3572207
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In red cells stressed by these reagents, GSSG-R deficiency began to impair the regeneration of GSH only after greater than 80% of the normal enzyme activity had been abolished."
    explanation: >-
      Establishes that only near-complete GR loss impairs GSH recovery under
      oxidant stress, the step that leaves red cells vulnerable to injury.
  downstream:
  - target: Oxidant-Triggered Hemolysis
    causal_link_type: DIRECT
    description: >-
      Oxidatively injured, poorly deformable erythrocytes are hemolyzed,
      especially after an oxidant trigger such as fava bean ingestion.
- name: Oxidant-Triggered Hemolysis
  conforms_to: "hemolytic_anemia_erythrocyte_destruction#Premature Erythrocyte Destruction"
  description: >-
    Oxidatively damaged erythrocytes are destroyed prematurely, producing
    hemolytic anemia. In the index family, hemolytic crises followed fava bean
    ingestion, mirroring the oxidant-triggered hemolysis of G6PD deficiency.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: erythrocyte
    term:
      id: CL:0000232
      label: erythrocyte
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: erythrocyte clearance
    term:
      id: GO:0034102
      label: erythrocyte clearance
    modifier: INCREASED
  evidence:
  - reference: PMID:8813716
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: "If an enzyme deficiency of one of these metabolic pathways limits the ATP and/or NADPH production, distinct membrane alterations result causing a removal of the damaged cells by the monocyte-macrophage system."
    explanation: >-
      Review of red-cell enzymopathies states the general route from a redox
      enzyme defect to membrane damage and macrophage removal of erythrocytes;
      applied here to the glutathione cycle defect.
  - reference: PMID:947404
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "this deficiency was manifested by hemolytic crises after eating fava beans in the eldest daughter (patient)"
    explanation: >-
      Documents fava-bean-triggered hemolytic crises as the clinical
      manifestation of the enzyme defect.
  downstream:
  - target: Hemolytic anemia
    causal_link_type: DIRECT
    description: >-
      Premature destruction of oxidatively vulnerable erythrocytes produces
      hemolytic anemia.
  - target: Fava bean-induced hemolytic anemia
    causal_link_type: DIRECT
    description: >-
      Fava bean ingestion is the documented oxidant trigger of acute hemolysis
      in this disorder.
  - target: Neonatal hyperbilirubinemia
    causal_link_type: DIRECT
    description: >-
      Hemolysis in the newborn period produces unconjugated hyperbilirubinemia
      and jaundice.
- name: Lens Oxidative Injury
  description: >-
    Depletion of glutathione-dependent antioxidant defense in the lens is
    associated with early-onset cataract in affected individuals. The lens
    relies heavily on glutathione to protect against oxidative damage, and
    cataract was observed in members of the originally described family.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: lens fiber cell
    term:
      id: CL:0011004
      label: lens fiber cell
  biological_processes:
  - preferred_term: response to oxidative stress
    term:
      id: GO:0006979
      label: response to oxidative stress
    modifier: INCREASED
  evidence:
  - reference: PMID:947404
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "possibly by cataracts in her own and in her brother's eyes"
    explanation: >-
      Reports cataract in affected family members, linked to the loss of
      glutathione-dependent antioxidant protection of the lens.
  - reference: PMID:1737065
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "The findings indicated an impairment in peroxide metabolism of the mature cataractous lenses compared to normal lenses to be resulted from a deficiency of GSH."
    explanation: >-
      Ex vivo lens study links GSH deficiency to impaired peroxide handling in
      cataractous lenses. It concerns cataract generally, not GR-deficient
      patients, so the lens step in this disorder remains inferred.
  downstream:
  - target: Cataract
    causal_link_type: DIRECT
    description: >-
      Oxidative injury to lens fiber cells manifests as cataract.
- name: Phagocyte Glutathione-Dependent Defense Impairment
  description: >-
    Because GR is also deficient in leukocytes, glutathione-dependent
    antioxidant and bactericidal function of phagocytes is impaired. In the
    propositus, polymorphonuclear cells showed abnormal oxygen consumption after
    phagocytosis, suggesting a role for the GR reaction in the bactericidal
    capacity of these cells. This is an observation in a single family and the
    clinical significance of the leukocyte defect is not established.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  biological_processes:
  - preferred_term: response to oxidative stress
    term:
      id: GO:0006979
      label: response to oxidative stress
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:947404
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we found an abnormal oxygen consumption of the propositus' PMNs after phagocytosis of zymosan particles, suggesting that the glutathione reductase reaction was involved in the bactericidal capacity of these cells"
    explanation: >-
      Documents the leukocyte GR defect and its possible effect on phagocyte
      bactericidal function.
  - reference: PMID:22279102
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Unlike wild-type neutrophils that exhibited a sustained oxidative burst upon stimulation with phorbol ester and fMLP, Gsr-deficient neutrophils displayed a very transient oxidative burst that abruptly ceased shortly after stimulation."
    explanation: >-
      In Gsr-null mice, neutrophils cannot sustain the oxidative burst, the
      model counterpart of the abnormal oxygen consumption seen in the
      propositus' neutrophils.
  downstream:
  - target: Abnormal neutrophil physiology
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Impaired glutathione-dependent defense is reflected in abnormal phagocyte
      oxidative physiology.

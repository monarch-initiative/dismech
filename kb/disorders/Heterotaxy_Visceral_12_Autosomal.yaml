differential_diagnoses:
- name: Ciliopathic heterotaxy
  description: >-
    Heterotaxy from motile ciliary defects, including primary ciliary dyskinesia genes such as
    CCDC39, DNAAF3, DNAH5, DNAH9 and MNS1, where the cilia and the leftward flow are themselves
    abnormal. CIROP acts downstream of the flow, so the mechanisms differ even though the situs
    phenotype overlaps.
  distinguishing_features:
  - Variants in a motile-cilia gene rather than CIROP.
  - Airway disease from defective motile cilia, which CIROP loss does not predict.
  evidence:
  - reference: PMID:39513328
    reference_title: Genetic Analysis of Heterotaxy in a Consanguineous Cohort.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genetic analysis, with exome sequencing, genome sequencing, or multigene panel, detected 9
      unique variants, 7 of which were novel, in 8 genes known to be implicated in autosomal
      recessive form of HTX (C1orf127, CCDC39, CIROP, DNAAF3, DNAH5, DNAH9, MMP21, and MNS1)
      providing a yield of 42.1%.
    explanation: Lists the motile-cilia genes that cause clinically similar heterotaxy.
- name: CIROZ-related heterotaxy
  description: >-
    CIROZ, previously C1orf127, is a different gene in the same left-right organizer module, and
    biallelic inactivating variants in it also cause heterotaxy. The two are easily confused by name
    and by publication lineage, and a consanguineous heterotaxy cohort lists them separately.
  distinguishing_features:
  - Biallelic variants in CIROZ (C1orf127) rather than CIROP (LMLN2).
  evidence:
  - reference: PMID:39753129
    reference_title: CIROZ is dispensable in ancestral vertebrates but essential for left-right patterning in humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report 16 individuals from 10 families with bi-allelic CIROZ inactivation variants, which
      cause heterotaxy with congenital heart defects.
    explanation: >-
      Establishes that CIROZ is a separate cause of recessive heterotaxy, which is what makes it a
      differential rather than a synonym. Cited here only to anchor the differential; nothing from
      this report is used in the mechanism above.
notes: >-
  The gene for this disease is CIROP, formerly LMLN2, and MONDO records it against OMIM 619702.
  That identification was checked against MONDO rather than taken from the literature search,
  because a 2025 report on a neighbouring gene, CIROZ (formerly C1orf127), describes bi-allelic
  inactivation causing heterotaxy with congenital heart defects and is easy to mistake for this
  disease. Both genes belong to the same left-right organizer module and were reported by the same
  group. A consanguineous heterotaxy cohort lists C1orf127 and CIROP as separate autosomal recessive
  heterotaxy genes, which is the clearest published statement that they are distinct. Nothing from
  the CIROZ report is used in this entry.

  No organ-level phenotypes are recorded. The CIROP report describes its 21 patients as presenting
  with recessive situs anomalies and does not break that down by organ in the text available here.
  just fetch-reference PMID:34903892 --force was run to try to obtain the full text, and it returned
  abstract_only again, so the per-patient situs table is not reachable from this repository's cache.
  Adding dextrocardia, asplenia or specific heart defects would therefore go beyond the source.
  For the same reason zygosity is left unset on the lesion node: the entry can say the variants are
  biallelic, which the source states, but not that every patient is homozygous rather than compound
  heterozygous.

  An earlier version of this entry said the CIROP protein carries a signal peptide. The CIROP report
  says only that the five genes its screen found encode extracellular proteins. The signal-peptide
  description belongs to CIROZ, whose own report describes a signal peptide followed by three zona
  pellucida N domains, so the claim was most likely carried across from the neighbouring gene that
  the rest of this note warns about. It has been removed.

  The molecular-function binding on the lesion node, GO:0004222 metalloendopeptidase activity, is
  UniProt's InterPro-derived electronic annotation for CIROP (A0A1B0GTW7) rather than a demonstrated
  activity. That matches the CIROP report, which calls the protein a putative protease with hitherto
  unknown functions. No proteolytic substrate is known, so the binding records the predicted
  activity the gene is named for and claims nothing about what it cleaves.

  No GeneReviews chapter covers this disease, by disease name or through CIROP.

  No ClinGen gene-disease validity record exists for CIROP and this MONDO term, so
  gene_disease_validity is absent.

  The deep-research report for this entry is
  research/Heterotaxy_Visceral_12_Autosomal-deep-research-claude_code.md. It was produced by the
  claude_code provider rather than OpenScientist, which failed on every attempt in this batch, first
  on client-side timeouts and then on a server-side stream idle timeout (dismech#10387,
  dismech#18386); --fallback does not engage on a runtime failure, so the provider was switched by
  hand. Read that report's gene identifiers with care: it prints HGNC:53647 beside the symbol REST
  in places, where hgnc:53647 is CIROP, so the identifiers in this entry were read from HGNC and
  MONDO directly rather than copied from the report.

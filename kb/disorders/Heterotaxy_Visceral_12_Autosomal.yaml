    term:
      id: hgnc:53647
      label: CIROP
  notes: >-
    CIROP, previously LMLN2, encodes a putative extracellular protease named by the study that found
    it, ciliated left-right organizer metallopeptide. It was identified by a comparative-genomics
    screen for genes lost in the vertebrate lineages whose left-right organizer has no motile cilia.
    Do not confuse CIROP with CIROZ, previously C1orf127. They are different genes, both members of
    the same left-right organizer module described by the same group, and both cause recessive
    heterotaxy, but only CIROP is the gene MONDO records for this disease (OMIM 619702). A
    consanguineous heterotaxy cohort lists C1orf127 and CIROP as separate entries in the same list of
    autosomal recessive heterotaxy genes.
  evidence:
  - reference: PMID:34903892
    reference_title: Discovery of a genetic module essential for assigning left-right asymmetry in humans and ancestral vertebrates.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      We searched for genes whose loss during vertebrate evolution follows this pattern and
      identified five genes encoding extracellular proteins, including a putative protease with
      hitherto unknown functions that we named ciliated left-right organizer metallopeptide (CIROP).
    explanation: >-
      Identifies CIROP and names it. The sentence describes an in-silico comparative-genomics screen
      for genes lost in lineages without a ciliated left-right organizer, so it is graded
      COMPUTATIONAL; the gene-disease claim itself rests on the 21-patient sentence below.
  - reference: PMID:39513328
    reference_title: Genetic Analysis of Heterotaxy in a Consanguineous Cohort.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genetic analysis, with exome sequencing, genome sequencing, or multigene panel, detected 9
      unique variants, 7 of which were novel, in 8 genes known to be implicated in autosomal
      recessive form of HTX (C1orf127, CCDC39, CIROP, DNAAF3, DNAH5, DNAH9, MMP21, and MNS1)
      providing a yield of 42.1%.
    explanation: >-
      Independent cohort listing CIROP among established autosomal recessive heterotaxy genes, and
      listing C1orf127 separately, which is the distinction the gene notes record.

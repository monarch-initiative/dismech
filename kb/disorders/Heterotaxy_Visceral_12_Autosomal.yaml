- name: Loss of CIROP Activity at the Ciliated Left-Right Organizer
  biological_scale: TISSUE
  description: >-
    CIROP is expressed specifically in left-right organizers that carry motile cilia, so the loss is
    confined to the transient embryonic structure that sets the body axis. This node records where
    the protease acts, not a process outcome, so it carries no biological-process binding; the
    left-right determination terms sit on the nodes that record the failing process.
  evidence:
  - reference: PMID:34903892
    reference_title: Discovery of a genetic module essential for assigning left-right asymmetry in humans and ancestral vertebrates.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Here, we show that CIROP is specifically expressed in ciliated LROs.
    explanation: Places the gene's activity at the ciliated left-right organizer.
  downstream:
  - target: Failure of Left-Sided Signal Transduction Downstream of Leftward Flow
    causal_link_type: DIRECT
- name: Failure of Left-Sided Signal Transduction Downstream of Leftward Flow
  biological_scale: TISSUE
  description: >-
    The defect sits between the cilia and the first asymmetric gene. In zebrafish and Xenopus CIROP
    is required only on the left, downstream of the leftward flow and upstream of DAND5. So the
    cilia and the flow they generate are intact, and what fails is the conversion of that flow into
    a side-specific signal. This separates CIROP-related heterotaxy from the ciliopathic laterality
    disorders, where the cilia themselves are at fault.
  biological_processes:
  - preferred_term: detection of nodal flow
    term:
      id: GO:0003127
      label: detection of nodal flow
    modifier: DECREASED
  evidence:
  - reference: PMID:34903892
    reference_title: Discovery of a genetic module essential for assigning left-right asymmetry in humans and ancestral vertebrates.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In zebrafish and Xenopus, CIROP is required solely on the left side, downstream of the leftward
      flow, but upstream of DAND5, the first asymmetrically expressed gene.
    explanation: >-
      Places CIROP precisely in the pathway: after the flow, before the first asymmetric gene, and on
      the left side only.
  downstream:
  - target: Failure to Establish Asymmetric Nodal Signalling
    causal_link_type: DIRECT
- name: Failure to Establish Asymmetric Nodal Signalling
  biological_scale: TISSUE
  description: >-
    DAND5 is the first asymmetrically expressed gene, and its Xenopus ortholog Coco is a Nodal
    inhibitor whose left-sided downregulation is the direct readout of the leftward flow. A defect
    upstream of DAND5 therefore leaves the Nodal cascade without the side-specific release of
    repression that normally orients it. The Nodal-antagonist step is carried by work on the
    ortholog rather than by the CIROP report itself, which is why its evidence item is INDIRECT.
  biological_processes:
  - preferred_term: nodal signaling pathway
    term:
      id: GO:0038092
      label: nodal signaling pathway
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:34903892
    reference_title: Discovery of a genetic module essential for assigning left-right asymmetry in humans and ancestral vertebrates.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In zebrafish and Xenopus, CIROP is required solely on the left side, downstream of the leftward
      flow, but upstream of DAND5, the first asymmetrically expressed gene.
    explanation: >-
      The same placement read forward: the step CIROP is upstream of is the first asymmetric gene
      expression, which is what fails.
  - reference: PMID:20381352
    reference_title: The nodal inhibitor Coco is a critical target of leftward flow in Xenopus.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Coco thus acts as a critical target of flow, suggesting that symmetry is broken by
      flow-mediated left-asymmetric release of Nodal repression at the midline.
    explanation: >-
      Sources the Nodal-antagonist role this node depends on, and the fact that the step between
      flow and Nodal is the release of that repression. INDIRECT because the work is on Coco, the
      Xenopus ortholog of DAND5, so applying it to DAND5 is an orthology inference.
  downstream:
  - target: Failure of Left-Right Axis Determination
    causal_link_type: DIRECT
- name: Failure of Left-Right Axis Determination
  biological_scale: ORGANISM
  description: >-
    Without a reliable asymmetric signal the embryo cannot distinguish left from right, and organ
    situs is assigned inconsistently across the body, which is what heterotaxy is.
  biological_processes:
  - preferred_term: determination of left/right symmetry
    term:
      id: GO:0007368
      label: determination of left/right symmetry
    modifier: DECREASED
  evidence:
  - reference: PMID:34903892
    reference_title: Discovery of a genetic module essential for assigning left-right asymmetry in humans and ancestral vertebrates.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings posit the existence of an ancestral genetic module that has twice disappeared
      during vertebrate evolution but remains essential for distinguishing left from right in humans.
    explanation: States that the module is required for left-right determination in humans.
  downstream:

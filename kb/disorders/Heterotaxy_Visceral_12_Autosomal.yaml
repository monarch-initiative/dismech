- name: Failure of Left-Sided Signal Transduction Downstream of Leftward Flow
  biological_scale: TISSUE
  description: >-
    The defect sits between the cilia and the first asymmetric gene. In zebrafish and Xenopus CIROP
    is required only on the left, downstream of the leftward flow and upstream of DAND5. So the
    cilia and the flow they generate are intact, and what fails is the conversion of that flow into
    a side-specific signal. This separates CIROP-related heterotaxy from the ciliopathic laterality
    disorders, where the cilia themselves are at fault.

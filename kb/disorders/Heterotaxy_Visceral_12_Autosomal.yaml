name: Heterotaxy Visceral 12 Autosomal
creation_date: "2026-11-18T11:48:17Z"
category: Mendelian
description: >-
  Visceral heterotaxy 12 is an autosomal recessive laterality disorder caused by biallelic
  loss-of-function variants in CIROP, which encodes a putative extracellular protease named ciliated
  left-right organizer metallopeptide. CIROP was found by asking which genes disappeared from the
  vertebrate lineages whose left-right organizer lacks motile cilia, and it is expressed specifically
  in ciliated left-right organizers. In zebrafish and Xenopus it is required on the left side only,
  downstream of the leftward cilia-driven flow but upstream of DAND5, the first gene to be expressed
  asymmetrically. Losing it therefore leaves the flow intact but breaks the step that converts the
  flow into an asymmetric signal, and the embryo cannot reliably tell left from right. Twenty-one
  patients with recessive situs anomalies have been reported.

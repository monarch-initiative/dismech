    reference_title: Discovery of a genetic module essential for assigning left-right asymmetry in humans and ancestral vertebrates.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In zebrafish and Xenopus, CIROP is required solely on the left side, downstream of the leftward
      flow, but upstream of DAND5, the first asymmetrically expressed gene.
    explanation: >-
      Places CIROP precisely in the pathway: after the flow, before the first asymmetric gene, and on
      the left side only.
  downstream:

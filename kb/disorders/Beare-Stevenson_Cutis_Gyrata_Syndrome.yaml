name: Beare-Stevenson Cutis Gyrata Syndrome
synonyms:
- BSS
- Beare-Stevenson syndrome
- cutis gyrata-acanthosis nigricans-craniosynostosis syndrome
- BSTVS
creation_date: "2026-08-20T00:00:00Z"
category: Mendelian
description: >
  Beare-Stevenson cutis gyrata syndrome (BSS) is an ultra-rare autosomal dominant
  craniosynostosis syndrome caused by heterozygous cysteine-creating gain-of-function
  variants in FGFR2 — most often p.Tyr375Cys in the transmembrane domain or
  p.Ser372Cys in the juxtamembrane linker. It combines multisuture craniosynostosis
  (frequently cloverleaf skull) and midface hypoplasia with a distinctive skin
  phenotype that no other FGFR2 craniosynostosis syndrome shares: cutis gyrata,
  furrowed corrugated skin of the scalp, face, palms and soles, together with
  acanthosis nigricans, skin tags and a prominent umbilical stump. Anogenital
  anomalies, choanal stenosis, ear defects and dental anomalies complete the picture.

  BSS occupies a specific position in the FGFR-related skeletal dysplasia family.
  Mechanistically it belongs with the craniosynostosis arm, but its causal alleles are
  cysteine substitutions of the kind that produce ligand-independent, disulfide-mediated
  receptor dimerization — the same activation class that drives thanatophoric dysplasia
  type 1 on the FGFR3 chondrodysplasia side. It is therefore the member that links the
  two arms of the group at the level of how the receptor is switched on, rather than
  by which tissue responds.

  Clinically the defining fact is prognosis. BSS carries a substantially higher rate of
  sudden unexplained death than Apert, Pfeiffer or Crouzon syndrome, and roughly half of
  reported patients die in the first year of life. A tracheal cartilaginous sleeve — a
  continuous cartilage tube replacing the normal tracheal rings, difficult to detect
  without direct visualization of the airway and frequently found only at autopsy — is
  reported in BSS and in other FGFR2 craniosynostosis syndromes, and carries about a 90%
  risk of death by two years of age without tracheostomy. Because BSS overlaps
  phenotypically with Crouzon syndrome but has a markedly worse prognosis, distinguishing
  the two is a consequential diagnostic act rather than a nosological one.

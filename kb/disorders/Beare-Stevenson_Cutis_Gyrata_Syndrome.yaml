    reference_title: p38 Inhibition ameliorates skin and skull abnormalities in Fgfr2 Beare-Stevenson mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: These data indicated increased osteogenic differentiation as well as abnormal bone growth at the coronal suture in Fgfr2+/Y394 mice.
    explanation: ALP, Runx2 and osteonectin observations support increased differentiation; the source omits the final C in this genotype occurrence.
  - reference: PMID:22585574
    reference_title: p38 Inhibition ameliorates skin and skull abnormalities in Fgfr2 Beare-Stevenson mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Cell proliferation was analyzed by calculating the ratios of the number of BrdU-positive cells to total cells between and including the osteogenic fronts in mutants and littermate controls. At E17.5, the ratio was obviously decreased in mutants as compared with controls
    explanation: The osteogenic phenotype involves decreased proliferation, distinct from epidermal hyperproliferation.
  downstream:

genetic:
- name: FGFR2 cysteine-creating gain-of-function variants
  gene_term:
    preferred_term: FGFR2
    term:
      id: hgnc:3689
      label: FGFR2
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Heterozygous de novo missense variants introducing an unpaired cysteine. The two
    recurrent alleles, p.Tyr375Cys (transmembrane) and p.Ser372Cys (Ig-III/transmembrane
    linker), account for most molecularly confirmed cases; p.Ser372Tyr and p.Phe276Cys
    have each been reported once. A subset of clinically typical patients carry neither
    recurrent allele.
  variants:
  - name: c.1124A>G (p.Tyr375Cys)
    description: >-
      The commonest allele, in the transmembrane domain. Reported repeatedly across
      independent series and populations, and the allele modeled in the Fgfr2 Y394C
      mouse.
    evidence:
    - reference: PMID:12900900
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The molecular analysis of these patients identified the mutation Tyr375Cys in the FGFR2 gene."
      explanation: Molecular confirmation of the recurrent transmembrane allele.
  - name: p.Ser372Cys
    description: >-
      The second recurrent allele, at the carboxyl-terminal end of the Ig-III to
      transmembrane linker.
    evidence:
    - reference: PMID:18247426
      reference_title: "Second case of Beare-Stevenson syndrome with an FGFR2 Ser372Cys mutation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Reported causes are an FGFR2 Tyr375Cys mutation in nine cases and an FGFR2 Ser372Cys mutation in one case. Here, we report on a second patient with the FGFR2 Ser372Cys mutation."
      explanation: >-
        A second independent report of the p.Ser372Cys allele, establishing it as
        recurrent rather than private, and quantifying the relative frequency of the two
        recurrent alleles at the time: nine p.Tyr375Cys to two p.Ser372Cys.
  evidence:
  - reference: PMID:8696350
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We now describe the detection of FGFR2 mutations in the Beare-Stevenson cutis gyrata syndrome."
    explanation: The original assignment of the syndrome to FGFR2.
  - reference: PMID:25706251
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we report on two additional patients with molecularly confirmed BSS, one each with p.Ser372Tyr and p.Tyr375Cys mutations in FGFR2."
    explanation: >-
      Extends the allelic series with p.Ser372Tyr, a non-cysteine substitution at the
      same codon as the recurrent p.Ser372Cys.
progression:
- phase: Infancy
  age_range: Birth through the first year
  notes: >-
    The period in which the syndrome's excess mortality is concentrated. Roughly half of
    reported patients die in the first year from cardiorespiratory arrest or unexpected
    sudden death, and reported deaths have occurred within weeks of birth from
    respiratory complications requiring mechanical ventilation from birth. A tracheal
    cartilaginous sleeve is the leading candidate mechanism for the sudden-death excess,
    but a causal contribution has not been demonstrated and other contributors — severe
    midface hypoplasia, choanal stenosis, micrognathia and raised intracranial pressure —
    are present in the same patients.
  evidence:
  - reference: PMID:25706251
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Beare-Stevenson syndrome (BSS) is a rare FGFR2-associated craniosynostosis syndrome with a higher rate of sudden unexplained death than related conditions such as Apert, Pfeiffer, and Crouzon syndromes."
    explanation: >-
      States the excess mortality relative to the other members of the FGFR2
      craniosynostosis group, which is the entry's central clinical claim.
  - reference: PMID:38445861
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Half of patients with BSS died within the first year of life due to cardiorespiratory arrest or unexpected sudden death."
    explanation: Quantifies first-year mortality and names the reported mechanisms of death.
  - reference: PMID:12900900
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "They were born with respiratory distress and were connected to mechanical ventilation for ventilatory support. Both of them died in 50 days after birth due to secondary complications."
    explanation: A concrete instance of the early respiratory course in two confirmed patients.
- phase: Childhood
  age_range: Beyond infancy, in survivors
  notes: >-
    Survivors face significant developmental delay and a staged surgical course —
    tracheostomy, cerebrospinal fluid diversion, cranial expansion, and later midface
    advancement — extending across the first decade. Reported patients have reached at
    least 8 years of age.
  evidence:
  - reference: PMID:25706251
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "BSS presents with craniosynostosis, cutis gyrata, and significant developmental delay in most patients who survive infancy."
    explanation: The developmental outcome that characterizes the surviving group.
  - reference: PMID:38445861
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We currently have an 8-year-old patient who is being followed up. She underwent tracheostomy, cranioplasty, and shunting."
    explanation: Documents survival beyond infancy and the staged surgical burden.
treatments:
- name: Tracheostomy and airway surveillance for tracheal cartilaginous sleeve
  action_category: THERAPEUTIC
  therapeutic_modality: SURGERY
  description: >
    The intervention with the clearest survival rationale in this syndrome. An unmanaged
    tracheal cartilaginous sleeve carries about a 90% risk of death by two years of age
    without tracheostomy, and because the lesion is difficult to detect without direct
    visualization of the trachea, the recommendation is to evaluate for it actively
    rather than await symptoms. Tracheostomy in infancy is reported as routine in
    surgically managed BSS patients.
  treatment_term:
    preferred_term: Tracheostomy
    term:
      id: NCIT:C15341
      label: Tracheotomy
  target_mechanisms:
  - target: Tracheal Cartilaginous Sleeve and Airway Compromise
    treatment_effect: INHIBITS
    description: >
      Bypasses the fixed cartilaginous segment, removing the airway obstruction that is
      the proposed route to sudden death. It does not modify the lesion itself.
    evidence:
    - reference: PMID:25706251
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Of note, tracheal cartilaginous sleeves have been reported in other FGFR2-related craniosynostosis syndromes, and are associated with 90% risk of death by two years of age without tracheostomy."
      explanation: The survival difference that motivates tracheostomy.
  evidence:
  - reference: PMID:25706251
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This association and our experience suggests that BSS patients be evaluated for tracheal cartilaginous sleeve to prevent airway compromise."
    explanation: The authors' explicit surveillance recommendation.
- name: Cranial vault expansion and cerebrospinal fluid diversion
  action_category: THERAPEUTIC
  therapeutic_modality: SURGERY
  description: >
    Staged neurosurgical management of the restricted cranial vault: ventriculoperitoneal
    shunting for hydrocephalus, then posterior or occipital cranial expansion, then
    fronto-orbital advancement. In the reported course these precede any midface
    procedure by years.
  treatment_term:
    preferred_term: Cranial vault expansion
    term:
      id: NCIT:C15214
      label: Craniotomy
  target_phenotypes:
  - preferred_term: Hydrocephalus
    term:
      id: HP:0000238
      label: Hydrocephalus
  evidence:
  - reference: PMID:42495986
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At 2 months of age, she underwent a ventriculoperitoneal shunt placement, followed by occipital cranial expansion at 1 year and fronto-orbital distraction at 2 years of age."
    explanation: Documents the staged sequence and its timing in a BSS patient.
- name: Midface advancement (Le Fort III distraction)
  action_category: THERAPEUTIC
  therapeutic_modality: SURGERY
  description: >
    Halo-type external distraction osteogenesis to advance the severely hypoplastic
    midface, correcting proptosis and occlusion. The first successful Le Fort III
    distraction in BSS was reported in 2026 in a 5-year-old, achieving roughly 25 mm of
    distraction without major complications and sustained improvement at two years.
    Reported experience with the alternative monobloc advancement is more cautionary: in
    one BSS patient the temporal fossa was too narrow for the procedure to work well, and
    unrecognized micrognathia meant decannulation remained impossible despite the
    advancement. Prior shunt tubing and skull defects constrain the operative approach.
  treatment_term:
    preferred_term: Midface advancement
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  notes: >-
    treatment_term is left at the generic Surgical Procedure deliberately. NCIT was
    searched for a midface-advancement, Le Fort or distraction-osteogenesis clinical
    action and has none; NCIT:C51903 Osteotomy names the bone cut but not the staged
    advancement, and NCIT:C15214 Craniotomy is the wrong compartment. Pfeiffer_Syndrome
    carries NCIT:C15329 for the same procedure, so this is also the consistent choice.
  target_phenotypes:
  - preferred_term: Midface retrusion
    term:
      id: HP:0011800
      label: Midface retrusion
  - preferred_term: Proptosis
    term:
      id: HP:0000520
      label: Proptosis
  evidence:
  - reference: PMID:42495986
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two uneventful years after surgery, the patient showed significant improvements in proptosis, occlusion, and facial profile, with an excellent clinical course."
    explanation: Medium-term outcome of the procedure.
  - reference: PMID:38445861
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "In addition, even though midface advancement, it was difficult to remove tracheostomy. This was because midfacial hypoplasia was so severe that it was hard to notice, but there was also micrognathia."
    explanation: >-
      The counter-case: midface advancement did not achieve decannulation, because
      coexisting micrognathia was masked by the severity of the midface hypoplasia.
discussions:
- discussion_id: gap_bss_p38_inhibition_translation
  prompt: >-
    Does p38 MAPK inhibition, which reverses the skin phenotype in the Fgfr2
    Beare-Stevenson mouse, have any prospect of translating to human BSS — and would
    treating the skin arm matter if the mortality is driven by the airway?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Sustained FGFR2 Signaling with p38 MAPK Activation
  - pathophysiology#Epidermal Hyperplasia and Cutis Gyrata
  rationale: >-
    The Fgfr2 p.Tyr394Cys mouse is an unusually faithful model: it carries the murine
    equivalent of the commonest human allele and reproduces both arms of the syndrome,
    epidermal hyperplasia and craniosynostosis. Treating those mice with a p38 kinase
    inhibitor attenuated the skin abnormalities by returning proliferation and
    differentiation toward normal, which the authors advance as a therapeutic direction
    for BSS and for acanthosis nigricans and craniosynostosis generally. Three things
    stand between that and a human therapy, and they differ in kind rather than degree.
    First, the demonstrated reversal is of skin; craniosynostosis in a human is
    established at birth rather than progressive in the way a mouse suture phenotype is,
    so the window the mouse result occupies may not exist postnatally. Second, systemic
    p38 inhibition is a broad intervention with no defined dose, route or developmental
    window for a neonate. Third, and most consequential for how this entry should be
    read: the cause of death in BSS is airway and cardiorespiratory, and nothing links
    p38 activity to the tracheal cartilaginous sleeve. A therapy that normalized the skin
    would leave the survival problem untouched. This should not be curated anywhere as an
    emerging BSS treatment.
  evidence:
  - reference: PMID:22585574
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Treating Fgfr2+/Y394C mice with a p38 kinase inhibitor attenuated skin abnormalities by reversing cell proliferation and differentiation to near normal levels."
    explanation: The rescue result, and the fact that what was reversed is the skin phenotype.
  - reference: PMID:22585574
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "The demonstration of a pathogenic role for p38 activation may lead to the development of therapeutic strategies for BSS and related conditions, such as acanthosis nigricans or craniosynostosis."
    explanation: >-
      The authors' own forward-looking claim, marked PARTIAL because it is a prospect
      rather than a result.
  - reference: PMID:38445861
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Half of patients with BSS died within the first year of life due to cardiorespiratory arrest or unexpected sudden death."
    explanation: >-
      Establishes that the outcome any BSS therapy must move is cardiorespiratory, which
      the p38 skin result does not address.
  proposed_experiments:
  - experiment_id: exp_bss_p38_airway_phenotype
    name: Airway phenotype of the Fgfr2 Y394C mouse under p38 inhibition
    description: >-
      Determine whether the BSS mouse develops a tracheal cartilage abnormality at all,
      and if so whether p38 inhibition alters it. This is the measurement that would tell
      whether the p38 axis touches the arm of the syndrome that kills, or only the arm
      that is visible.
  - experiment_id: exp_bss_p38_developmental_window
    name: Developmental window for suture rescue
    description: >-
      Establish the latest gestational or postnatal point at which p38 inhibition still
      prevents suture fusion in the model, since a window that closes before birth would
      rule out postnatal human treatment regardless of efficacy.
- discussion_id: gap_bss_tracheal_sleeve_frequency_and_causation
  prompt: >-
    How often does a tracheal cartilaginous sleeve actually occur in Beare-Stevenson
    syndrome, and is it caused by the FGFR2 variant or merely co-occurring with it?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Tracheal Cartilaginous Sleeve and Airway Compromise
  rationale: >-
    Both halves of this question are open, and the entry deliberately stops short of
    answering either. On frequency: the sleeve is described as often found only
    incidentally at autopsy because it cannot be diagnosed without direct visualization
    of the trachea, so every published frequency is a lower bound drawn from a case
    literature of fewer than thirty patients, most of whom died before any airway
    endoscopy would have been considered. On causation: the sleeve is reported across
    FGFR2-related craniosynostosis syndromes, which is consistent with an FGFR2-driven
    cartilage phenotype but equally consistent with shared ascertainment in severely
    affected, tracheostomized infants. No model system in the cited literature reproduces
    it, and the BSS mouse work characterizes skin and calvaria only. This matters
    practically rather than academically: if the sleeve is FGFR2-driven it should be
    sought in every patient with a cysteine-class allele, whereas if it tracks severity
    it should be sought in every severely affected infant regardless of genotype. The
    surveillance recommendation is the same either way, which is why the entry curates
    the recommendation as established and the mechanism as open.
  evidence:
  - reference: PMID:25706251
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Tracheal cartilaginous sleeves are often only found incidentally at autopsy as they are difficult to diagnose without direct visualization of the trachea."
    explanation: The ascertainment problem underlying the frequency half of the gap.
  - reference: PMID:25706251
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Of note, tracheal cartilaginous sleeves have been reported in other FGFR2-related craniosynostosis syndromes, and are associated with 90% risk of death by two years of age without tracheostomy."
    explanation: >-
      The cross-syndrome occurrence that is compatible with either an FGFR2-driven
      mechanism or shared ascertainment.
  proposed_experiments:
  - experiment_id: exp_bss_prospective_airway_endoscopy
    name: Prospective airway endoscopy in FGFR2 craniosynostosis
    description: >-
      Direct airway visualization in every infant with a molecularly confirmed FGFR2
      craniosynostosis syndrome, reported by genotype, to replace an autopsy-ascertained
      lower bound with a real frequency and to test whether cysteine-class alleles carry
      excess risk.
  - experiment_id: exp_fgfr2_tracheal_cartilage_model
    name: Tracheal cartilage phenotyping in the BSS mouse
    description: >-
      Characterize tracheal ring segmentation in the Fgfr2 Y394C mouse, which would
      establish whether the lesion is a direct consequence of the allele.
- discussion_id: gap_bss_versus_crouzon_prenatal_discrimination
  prompt: >-
    Can Beare-Stevenson syndrome be distinguished from Crouzon syndrome prenatally, given
    that the two overlap in appearance but differ sharply in prognosis?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Premature Cranial Suture Fusion and Cloverleaf Skull
  rationale: >-
    This is a diagnostic gap with immediate consequences for counselling and delivery
    planning. Cloverleaf skull identified prenatally in a BSS patient led to an initial
    concern for Crouzon syndrome, and in that case 3D ultrasound was performed but the
    cutis gyrata — the feature that separates the two — was visible only on retrospective
    review after the postnatal diagnosis. Since BSS carries markedly higher mortality
    than Crouzon syndrome, a prenatal misassignment is not a naming error but a
    prognostic one. The authors' proposed answer is to add molecular testing to suspected
    prenatal Crouzon cases rather than to rely on imaging, but no study has tested
    whether that changes outcomes, and the 2026 prenatal report identified BSS through a
    presentation — hydrops fetalis with increased nuchal translucency — that a
    craniofacial-led pathway would not have been triggered by.
  evidence:
  - reference: PMID:25706251
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cloverleaf skull was identified prenatally in one patient, with initial concern for Crouzon syndrome."
    explanation: A concrete instance of the prenatal misassignment this gap concerns.
  - reference: PMID:25706251
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Prenatal 3D ultrasound was performed, but cutis gyrata was only visible on retrospective examination following the clinical diagnosis of BSS after birth."
    explanation: >-
      Shows that the discriminating feature was present but not prospectively detectable,
      which is what makes this a gap rather than a training problem.
  - reference: PMID:25706251
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Due to phenotypic overlap with Crouzon syndrome, but worse prognosis, we recommend consideration of prenatal 3D ultrasound and mutation testing for patients with suspected Crouzon to allow for prenatal diagnosis of BSS and to enable appropriate genetic counseling and postnatal care."
    explanation: The proposed but untested solution.
  proposed_experiments:
  - experiment_id: exp_bss_prenatal_fgfr2_panel_yield
    name: Diagnostic yield of FGFR2 testing in prenatally suspected Crouzon syndrome
    description: >-
      Apply FGFR2 sequencing to a consecutive series of fetuses with prenatally suspected
      syndromic craniosynostosis and report how often the result reassigns the diagnosis
      to BSS, which is the measurement the recommendation currently lacks.
notes: >
  Curated de novo from primary literature during a completeness review of the
  FGFR-Related Skeletal Dysplasias grouping (issue #9257), which identified BSS as the
  only member of the classical FGFR2 craniosynostosis series with no dismech entry.

  Two curation decisions worth recording. First, the Epidermal Hyperplasia and Cutis
  Gyrata node carries no `conforms_to` anchor even though it is downstream of an anchored
  node: the FGFR module's consequence nodes cover growth plate and cranial suture only,
  and there is no epidermal arm for it to conform to. Rather than force a bad anchor or
  drop the node, it is left unanchored and the reason is stated in the node description.
  If a second FGFR disorder with a keratinocyte arm is curated — Crouzon syndrome with
  acanthosis nigricans already has one — an epidermal consequence node in the module
  would be worth proposing.

  Second, the tracheal cartilaginous sleeve is modeled as a node and a phenotype but its
  causal link to the FGFR2 variant is explicitly not asserted; see
  gap_bss_tracheal_sleeve_frequency_and_causation. It is included because it is the most
  actionable finding in the syndrome, not because the mechanism is established.

  PMID:38265560 (mosaic FGFR2 p.Asn549Lys neurocutaneous syndrome) was reviewed and
  deliberately not cited: it describes a different, postzygotic FGFR2 disorder and is a
  differential-diagnosis consideration rather than BSS evidence. PMID:31373082 (tracheal
  cartilaginous sleeve in Beare-Stevenson) is the most on-topic paper found for the
  airway arm but caches with no abstract, so the sleeve evidence is drawn from
  PMID:25706251 instead rather than quoting a title.

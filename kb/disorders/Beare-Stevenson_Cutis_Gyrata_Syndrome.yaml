name: Beare-Stevenson Cutis Gyrata Syndrome
synonyms:
- BSS
- Beare-Stevenson syndrome
- cutis gyrata-acanthosis nigricans-craniosynostosis syndrome
- BSTVS
creation_date: '2026-08-20T00:00:00Z'
category: Mendelian
description: >-
  Beare-Stevenson cutis gyrata syndrome is an FGFR2-related craniosynostosis disorder
  characterized by
  cutis gyrata, acanthosis nigricans, craniofacial abnormalities, a prominent umbilical
  stump and anogenital
  anomalies. Recurrent p.Tyr375Cys and p.Ser372Cys substitutions introduce cysteine
  residues near the
  transmembrane domain; additional alleles and a Beare-Stevenson-like presentation
  with an intragenic
  deletion have been reported. Severe multisuture craniosynostosis, hydrocephalus,
  Chiari malformation
  and multilevel airway obstruction can require early multidisciplinary intervention.
  Tracheal cartilaginous
  sleeves are an important airway complication. Published case series report substantial
  early mortality,
  but provide limited guidance for individual prognosis.

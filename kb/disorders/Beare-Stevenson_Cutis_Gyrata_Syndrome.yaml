inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >
    Autosomal dominant. Every molecularly confirmed case reported to date has been
    sporadic, arising as a de novo variant in an unaffected family, and advanced
    paternal age has been noted repeatedly — the pattern expected of a paternal-age-effect
    FGFR allele, as also seen in Apert and Crouzon syndrome. The practical consequence is
    that recurrence risk for the parents is low, while the affected individual's own
    transmission risk would be 50%; survival to reproductive age is rare enough that this
    has not been observed.
  evidence:
  - reference: PMID:8696350
    reference_title: "Fibroblast growth factor receptor 2 mutations in Beare-Stevenson cutis gyrata syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Beare-Stevenson cutis gyrata syndrome (MIM 123790) is an autosomal dominant condition characterized by the furrowed skin disorder of cutis gyrata, acanthosis nigricans, craniosynostosis, craniofacial dysmorphism, digital anomalies, umbilical and anogenital abnormalities and early death."
    explanation: The defining molecular paper states the inheritance pattern and the core phenotype.
  - reference: PMID:1519658
    reference_title: "Beare-Stevenson cutis gyrata syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All cases observed to date have been sporadic. Increased paternal age suggests the possibility of an autosomal dominant mutation."
    explanation: >-
      The original clinical delineation records the sporadic occurrence and the
      paternal-age observation that later proved characteristic of activating FGFR alleles.
  - reference: PMID:16531735
    reference_title: "A case of Beare-Stevenson syndrome with a broad spectrum of features and a review of the FGFR2 Y375C mutation phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The paternal age at the time of conception was 62 years consistent with a paternal age effect."
    explanation: A specific documented instance of the paternal age effect in a molecularly confirmed case.
prevalence:
- population: Worldwide, published-case literature
  measure_type: CASES_IN_LITERATURE
  prevalence_class: BELOW_1_IN_1000000
  notes: >-
    No population prevalence estimate exists. The entire evidence base is a few dozen
    published cases — 21 reported as of 2015, fewer than 30 as of 2024 — which is the
    practical ceiling on any frequency claim made anywhere in this entry, and the reason
    no phenotype below is given a frequency band. The authors of both counts state
    explicitly that this limits prognostication.
  evidence:
  - reference: PMID:25706251
    reference_title: "Beare-Stevenson syndrome: two new patients, including a novel finding of tracheal cartilaginous sleeve."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There have only been 21 reported patients with BSS, which limits prognostication for clinicians and likely does not capture the full extent of the phenotype."
    explanation: The 2015 published-case count, with the authors' own caveat about what it supports.
  - reference: PMID:38445861
    reference_title: "Pitfall of Monobloc Advancement in Beare-Stevenson Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In addition, there have only been fewer than 30 cases, which limits prognostication for clinicians."
    explanation: An updated 2024 count, consistent with the 2015 figure.
pathophysiology:
- name: FGFR2 Cysteine-Creating Activating Variant
  role: trigger
  biological_scale: MOLECULAR
  conforms_to: "fgfr_gain_of_function_skeletal_dysplasia#Constitutive FGFR Activation"
  description: >
    A de novo heterozygous missense variant in FGFR2 that substitutes a cysteine for the
    wild-type residue. Two recurrent alleles account for nearly all molecularly confirmed
    cases: p.Tyr375Cys in the transmembrane domain and p.Ser372Cys at the carboxyl-terminal
    end of the linker between the third immunoglobulin-like (Ig-III) domain and the
    transmembrane segment. A p.Ser372Tyr variant and, in a 2026 prenatal case, a
    p.Phe276Cys variant have also been reported, and the original series noted two
    clinically typical patients in whom neither recurrent allele was found — so genetic
    heterogeneity within the clinical syndrome is documented rather than excluded.
  gene:
    preferred_term: FGFR2
    description: >-
      Fibroblast growth factor receptor 2, constitutively activated by cysteine-creating
      substitutions in Beare-Stevenson cutis gyrata syndrome.
    modifier: GAIN_OF_FUNCTION
    term:
      id: hgnc:3689
      label: FGFR2
  molecular_functions:
  - preferred_term: transmembrane receptor protein tyrosine kinase activity
    term:
      id: GO:0004714
      label: transmembrane receptor protein tyrosine kinase activity
    modifier: INCREASED
  evidence:
  - reference: PMID:8696350
    reference_title: "Fibroblast growth factor receptor 2 mutations in Beare-Stevenson cutis gyrata syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In three sporatic cases, a novel missense mutation was found causing an amino acid to be replaced by a cysteine; two had the identical Ty375Cys mutation in the transmembrane domain and one had a Ser372Cys mutation in the carboxyl-terminal end of the linker region between the immunoglobulin III-like (Iglll) and transmembrane domains."
    explanation: >-
      The original identification of the two recurrent alleles and their domain positions.
      Quoted verbatim including the source's own typographical errors ("sporatic",
      "Ty375Cys", "Iglll"), which are in the published abstract and not introduced here.
  - reference: PMID:8696350
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "In two patients, neither of these mutations were found suggesting further genetic heterogeneity."
    explanation: >-
      Records that the two recurrent alleles do not account for every clinically
      diagnosed case, so a negative FGFR2 hotspot result does not exclude the diagnosis.
  - reference: PMID:41775672
    reference_title: "Prenatally Diagnosed Beare-Stevenson Cutis Gyrata Syndrome With a Novel FGFR2 Variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This is the first report of a variant at this position (p.Phe276Cys) in association with BSS, thus expanding the known genotype"
    explanation: >-
      A 2026 prenatal case extending the allelic spectrum with a third cysteine-creating
      substitution, consistent with the shared cysteine mechanism.
  downstream:
  - target: Ligand-Independent Disulfide-Mediated Receptor Dimerization
    description: >
      A newly introduced unpaired cysteine provides a partner for intermolecular
      disulfide bonding between receptor monomers.
    causal_link_type: DIRECT

- name: Ligand-Independent Disulfide-Mediated Receptor Dimerization
  biological_scale: MOLECULAR
  description: >
    The mechanistic step that makes BSS a cysteine-allele disorder rather than simply
    another FGFR2 craniosynostosis. A free, unpaired cysteine residue introduced by the
    variant forms an intermolecular disulfide bond between two receptor monomers,
    locking them into a covalent dimer and activating the kinase without any FGF ligand
    present. This is the same activation route used by the extracellular-cysteine alleles
    of thanatophoric dysplasia type 1 on FGFR3, and it is mechanistically distinct from
    the Ig-II/III linker alleles of Apert and Muenke syndrome, which instead increase
    FGF-ligand affinity and alter specificity while leaving the receptor
    ligand-dependent.
  molecular_functions:
  - preferred_term: protein homodimerization activity
    term:
      id: GO:0042803
      label: protein homodimerization activity
    modifier: INCREASED
  evidence:
  - reference: PMID:9539778
    reference_title: "Activating mutations in the extracellular domain of the fibroblast growth factor receptor 2 function by disruption of the disulfide bond in the third immunoglobulin-like domain."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Many of these mutations create a free cysteine residue that potentially leads to abnormal disulfide bond formation and receptor activation"
    explanation: >-
      States the cysteine-creating activation mechanism shared by this class of FGFR2
      craniosynostosis alleles.
  - reference: PMID:9539778
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This allows the unbonded cysteine residues to participate in intermolecular disulfide bonding, resulting in constitutive activation of the receptor."
    explanation: >-
      The demonstrated biochemical route from an unpaired cysteine to constitutive,
      ligand-independent receptor activation.
  downstream:
  - target: Sustained FGFR2 Signaling with p38 MAPK Activation
    description: >
      Covalently dimerized receptor autophosphorylates and drives sustained downstream
      signaling in the absence of ligand.
    causal_link_type: DIRECT

- name: Sustained FGFR2 Signaling with p38 MAPK Activation
  biological_scale: CELLULAR
  conforms_to: "fgfr_gain_of_function_skeletal_dysplasia#Sustained MAPK/STAT Signaling"
  description: >
    Constitutively dimerized FGFR2 sustains downstream signaling in both skin and
    calvarial tissue. In the Fgfr2 p.Tyr394Cys mouse — the murine equivalent of the human
    p.Tyr375Cys allele — ligand-independent receptor phosphorylation is accompanied by
    activation of the p38 MAPK branch specifically, in both mutant skin and mutant
    calvaria. p38 is the branch this module's shared MAPK/STAT effector axis is realized
    through in BSS, and it is the node at which pharmacological rescue has been
    demonstrated in the model.
  biological_processes:
  - preferred_term: p38MAPK cascade
    term:
      id: GO:0038066
      label: p38MAPK cascade
    modifier: INCREASED
  evidence:
  - reference: PMID:22585574
    reference_title: "p38 Inhibition ameliorates skin and skull abnormalities in Fgfr2 Beare-Stevenson mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We found ligand-independent phosphorylation of FGFR2 and activation of p38 signaling in mutant skin and calvarial tissues."
    explanation: >-
      Establishes ligand-independent receptor activation and identifies p38 as the
      engaged downstream branch in the two affected tissues.
  - reference: PMID:22585574
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We developed a mouse model of BSS harboring a FGFR2 Y394C mutation and identified p38 MAPK as an important signaling pathway mediating these abnormalities."
    explanation: Names p38 MAPK as the mediating pathway for both the skin and skull phenotypes.
  downstream:
  - target: Cranial Suture Osteogenic Acceleration
    description: >
      Sustained signaling in suture mesenchyme accelerates osteogenic differentiation.
    causal_link_type: DIRECT
  - target: Epidermal Hyperplasia and Cutis Gyrata
    description: >
      The same sustained signaling in skin drives keratinocyte hyperproliferation and
      abnormal differentiation, producing the furrowed skin phenotype.
    causal_link_type: DIRECT

- name: Cranial Suture Osteogenic Acceleration
  biological_scale: TISSUE
  conforms_to: "fgfr_gain_of_function_skeletal_dysplasia#Cranial Suture Osteogenic Acceleration"
  description: >
    Premature osteogenic differentiation at the suture margins, driven by abnormal
    proliferation and differentiation of suture cells rather than by a mechanical or
    secondary cause.
  cell_types:
  - preferred_term: Osteoblast
    term:
      id: CL:0000062
      label: osteoblast
  biological_processes:
  - preferred_term: osteoblast differentiation
    term:
      id: GO:0001649
      label: osteoblast differentiation
    modifier: INCREASED
  evidence:
  - reference: PMID:22585574
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Fgfr2+/Y394C mice exhibited epidermal hyperplasia and premature closure of cranial sutures (craniosynostosis) due to abnormal cell proliferation and differentiation."
    explanation: >-
      Attributes suture closure in the model to abnormal cell proliferation and
      differentiation, the cellular step this node represents.
  downstream:
  - target: Premature Cranial Suture Fusion and Cloverleaf Skull
    causal_link_type: DIRECT

- name: Premature Cranial Suture Fusion and Cloverleaf Skull
  biological_scale: TISSUE
  conforms_to: "fgfr_gain_of_function_skeletal_dysplasia#Premature Suture Fusion and Craniosynostosis"
  description: >
    Multisuture craniosynostosis, in a large fraction of cases severe enough to produce
    the cloverleaf (Kleeblattschädel) skull. The original clinical series recorded
    cloverleaf skull in three of four patients with craniosynostosis and noted that
    outcome tracked with its presence — the earliest statement of what remains the main
    prognostic split within BSS. Restricted cranial volume drives the associated
    hydrocephalus, Chiari malformation and proptosis.
  biological_processes:
  - preferred_term: cranial suture morphogenesis
    term:
      id: GO:0060363
      label: cranial suture morphogenesis
    modifier: DECREASED
  evidence:
  - reference: PMID:1519658
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Craniosynostosis is present in four cases, with cloverleaf skull in three of these."
    explanation: The original series' documentation of craniosynostosis and cloverleaf skull frequency.
  - reference: PMID:1519658
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Performance and life expectation appear to be related to the presence or absence of cloverleaf skull."
    explanation: >-
      Establishes cloverleaf skull as the prognostic discriminator within the syndrome,
      recognized before the molecular cause was known.
  - reference: PMID:12900900
    reference_title: "Beare-Stevenson syndrome: Two South American patients with FGFR2 analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The radiologic examination showed a cloverleaf-form craniosynostosis."
    explanation: Independent radiological confirmation in molecularly confirmed p.Tyr375Cys patients.
  downstream:
  - target: Craniosynostosis
  - target: Cloverleaf skull
  - target: Hydrocephalus
  - target: Chiari malformation
  - target: Midface retrusion
  - target: Proptosis
  - target: Choanal stenosis

- name: Epidermal Hyperplasia and Cutis Gyrata
  biological_scale: TISSUE
  description: >
    The skin arm, and the feature that names the syndrome. Sustained FGFR2-p38 signaling
    in the epidermis produces keratinocyte hyperplasia, expressed clinically as cutis
    gyrata — thickened skin thrown into convoluted, cerebriform folds and furrows — along
    with acanthosis nigricans and skin tags. The distribution is characteristically wide,
    involving scalp, forehead, face, preauricular area, neck, trunk, palms and soles. This
    node is deliberately not given a module `conforms_to` anchor: the FGFR module's
    consequence nodes cover growth plate and cranial suture, and an epidermal
    hyperproliferation arm is not among them. Curating it as conforming would assert
    membership in a node that does not describe it.
  cell_types:
  - preferred_term: Keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  biological_processes:
  - preferred_term: keratinocyte proliferation
    term:
      id: GO:0043616
      label: keratinocyte proliferation
    modifier: INCREASED
  evidence:
  - reference: PMID:22585574
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "This study reveals the pleiotropic effects of the FGFR2 Y394C mutation evidenced by cutis gyrata, acanthosis nigricans, and craniosynostosis and provides a useful model for investigating the molecular mechanisms of skin and skull development."
    explanation: >-
      Confirms in a model carrying the murine equivalent of the human allele that one
      variant produces both the skin and the skull phenotype.
  - reference: PMID:1519658
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cutis gyrata variably affects the scalp, forehead, face, preauricular area, neck, trunk, hands, and feet."
    explanation: The human distribution of the skin phenotype.
  downstream:
  - target: Cutis gyrata of scalp
  - target: Palmoplantar cutis gyrata
  - target: Acanthosis nigricans
  - target: Skin tags

- name: Tracheal Cartilaginous Sleeve and Airway Compromise
  biological_scale: TISSUE
  description: >
    A continuous cartilaginous tube replacing the normal segmented tracheal rings. It is
    reported in BSS and in other FGFR2-related craniosynostosis syndromes, and it is the
    leading candidate explanation for the syndrome's excess sudden unexplained death. It
    is almost impossible to diagnose without direct visualization of the airway, so it is
    frequently discovered only at autopsy — which means its true frequency in BSS is
    unknown and is likely underestimated. This node records an association with an
    identified structural lesion and a management consequence, not a demonstrated causal
    chain from the FGFR2 allele: no experiment cited here shows that the variant produces
    the sleeve.
  evidence:
  - reference: PMID:25706251
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One of our patients was noted to have a tracheal cartilaginous sleeve, which if present could explain sudden death."
    explanation: >-
      The first report of a tracheal cartilaginous sleeve in BSS, and the proposed link
      to the syndrome's sudden-death excess — phrased by the authors as a possibility.
  - reference: PMID:25706251
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of note, tracheal cartilaginous sleeves have been reported in other FGFR2-related craniosynostosis syndromes, and are associated with 90% risk of death by two years of age without tracheostomy."
    explanation: >-
      Quantifies the mortality risk of an unmanaged sleeve, which is what makes detection
      actionable rather than descriptive.
  - reference: PMID:25706251
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Tracheal cartilaginous sleeves are often only found incidentally at autopsy as they are difficult to diagnose without direct visualization of the trachea."
    explanation: >-
      The ascertainment problem that makes any frequency estimate in BSS a lower bound.
  downstream:
  - target: Tracheal cartilaginous sleeve

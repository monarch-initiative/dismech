    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1455/pdf/Bookshelf_NBK1455.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Psychosocial assessments & mental health support throughout childhood
    explanation: The shared FGFR management table supports longitudinal psychosocial care.
    quote_role: REVIEW_SYNTHESIS
  treatment_term:

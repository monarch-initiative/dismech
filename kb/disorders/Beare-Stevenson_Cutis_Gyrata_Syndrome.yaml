  description: At autopsy, one p.Tyr375Cys child had a 75 cm small intestine, shorter than age- and weight-matched reference values. The report did not establish whether impaired development, chronic illness or other factors accounted for the finding, so congenital shortened-intestine HPO binding is not asserted.
  evidence:
  - reference: PMID:41882888
    reference_title: An Autopsy Case of Beare-Stevenson Cutis Gyrata Syndrome Presenting with an Extremely Short Small Intestine.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The lengths of the total intestinal tract, small intestine, and colon were 120, 75, and 45 cm, respec- tively (Table 1B).
    explanation: The autopsy measurement supports a short small intestine but does not establish congenital origin.
- name: Ascites
  category: Gastrointestinal
  description: Progressive refractory ascites occurred in the p.Tyr375Cys autopsy case. The cause remained uncertain.
  evidence:
  - reference: PMID:41882888
    reference_title: An Autopsy Case of Beare-Stevenson Cutis Gyrata Syndrome Presenting with an Extremely Short Small Intestine.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "abdominal distention due to ascites gradually wors- ened from 12 months of age. Tragically, the patient died of severe, uncontrollable ascites and respiratory failure at 2 years and 2 months of age (Fig. 3)." # codespell:ignore-line
    explanation: The clinical course documents progressively worsening ascites before death in one patient.
  phenotype_term:
    preferred_term: Ascites
    term:
      id: HP:0001541
      label: Ascites
- name: Broad fingers
  category: Limbs
  description: Broad fingers were noted on examination in the p.Tyr375Cys autopsy case.
  evidence:
  - reference: PMID:41882888
    reference_title: An Autopsy Case of Beare-Stevenson Cutis Gyrata Syndrome Presenting with an Extremely Short Small Intestine.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Additional findings in- cluded low-set ears, a prominent umbilical stump, and broad fingers and toes (Fig. 1).
    explanation: The autopsy case examination explicitly identifies broad fingers.
  phenotype_term:
    preferred_term: Broad finger
    term:
      id: HP:0001500
      label: Broad finger
genetic:
- name: FGFR2-associated allelic spectrum
  gene_term:
    preferred_term: FGFR2
    term:
      id: hgnc:3689
      label: FGFR2
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Recurrent p.Tyr375Cys and p.Ser372Cys substitutions are accompanied by rarer reported
    alleles. The
    2015 abstract reports p.Ser372Tyr, while later case compilations list p.Ser372Cys
    for that patient;
    without the primary full-text sequence result this discrepancy should not be treated
    as a confirmed
    additional mechanism. A de novo p.Phe276Cys variant was classified as likely pathogenic
    in 2026. The
    c.859del63 deletion was reported in a Beare-Stevenson-like presentation; its proposed
    splice effect
    was not demonstrated.
  variants:
  - name: c.1124A>G (p.Tyr375Cys)
    description: >-
      Recurrent p.Tyr375Cys substitution near the membrane. The c.1124A>G notation
      is documented on NM_000141.5
      in the 2026 autopsy report; mouse p.Tyr394Cys is the corresponding experimental
      allele.
    evidence:
    - reference: PMID:12900900
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: The molecular analysis of these patients identified the mutation Tyr375Cys in the FGFR2 gene.
      explanation: Molecular confirmation of the recurrent transmembrane allele.
      reference_title: 'Beare-Stevenson syndrome: Two South American patients with FGFR2 analysis.'
    - reference: PMID:41882888
      reference_title: An Autopsy Case of Beare-Stevenson Cutis Gyrata Syndrome Presenting with an Extremely Short Small Intestine.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Trio-based whole-exome sequencing and a filtering analy- sis subsequently identified a c.1124A>G pathogenic variant in FGFR2 (NM_000141.5), resulting in a p.Tyr375Cys sub- stitution.
      explanation: The report identifies c.1124A>G on NM_000141.5 and its p.Tyr375Cys consequence; the source line-break hyphens are retained.
  - name: p.Ser372Cys
    description: >-
      The second recurrent allele, at the carboxyl-terminal end of the Ig-III to transmembrane
      linker.
    evidence:
    - reference: PMID:18247426
      reference_title: Second case of Beare-Stevenson syndrome with an FGFR2 Ser372Cys mutation.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Reported causes are an FGFR2 Tyr375Cys mutation in nine cases and an FGFR2 Ser372Cys mutation in one case. Here, we report on a second patient with the FGFR2 Ser372Cys mutation.
      explanation: >-
        A second independent report of the p.Ser372Cys allele, establishing it as
        recurrent rather than
        private, and quantifying the relative frequency of the two recurrent alleles
        at the time: nine
        p.Tyr375Cys to two p.Ser372Cys.
  - name: c.827T>G (p.Phe276Cys)
    description: Heterozygous de novo variant classified as likely pathogenic in one fetus with a postnatally concordant BSS phenotype; no functional assay was reported.
    evidence:
    - reference: PMID:41775672
      reference_title: Prenatally Diagnosed Beare-Stevenson Cutis Gyrata Syndrome With a Novel FGFR2 Variant.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: GS resulted at 30 weeks 5 days and revealed a heterozygous, de novo, likely pathogenic FGFR2 variant (c.827 T > G, p.Phe276Cys) (Table 1B).
      explanation: The prenatal variant was classified as likely pathogenic; this case report does not experimentally establish disulfide bonding or gain of function.
  - name: c.859del63 (reported nomenclature)
    description: De novo 63-nucleotide intragenic deletion predicting loss of 21 amino acids, reported in a child with Beare-Stevenson-like syndrome. The proposed altered-splicing mechanism remains unproven.
    evidence:
    - reference: PMID:19610084
      reference_title: Novel FGFR2 deletion in a patient with Beare-Stevenson-like syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: a de novo, intragenic deletion of 63 nucleotides starting in exon 8 of the gene, c.859del63, was detected (Fig. 2). This deletion predicts the loss of 21 amino acids from the FGFR2 protein.
      explanation: Direct molecular identification in the Beare-Stevenson-like case; preserve the authors’ nomenclature without inventing a normalized HGVS interval.
    - reference: PMID:19610084
      reference_title: Novel FGFR2 deletion in a patient with Beare-Stevenson-like syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: A similar activating mechanism, although unproven, could be present in this child.
      explanation: The splicing-based gain-of-function interpretation was proposed by analogy, not established by a functional assay.
  evidence:
  - reference: PMID:8696350
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We now describe the detection of FGFR2 mutations in the Beare-Stevenson cutis gyrata syndrome.
    explanation: The original assignment of the syndrome to FGFR2.
    reference_title: Fibroblast growth factor receptor 2 mutations in Beare-Stevenson cutis gyrata syndrome.
  - reference: PMID:25706251
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Here we report on two additional patients with molecularly confirmed BSS, one each with p.Ser372Tyr and p.Tyr375Cys mutations in FGFR2.
    explanation: >-
      The abstract reports p.Ser372Tyr; a later case table reports p.Ser372Cys. This
      unresolved nomenclature
      discrepancy is retained explicitly rather than interpreted as established non-cysteine
      disease biology.
    reference_title: 'Beare-Stevenson syndrome: two new patients, including a novel finding of tracheal cartilaginous sleeve.'
progression:
- phase: Infancy
  age_range: Birth through the first year
  notes: >-
    Published case literature records respiratory distress and deaths in early infancy.
    A 2024 surgical
    case report summarizes historical first-year mortality as about half, but this
    selected literature
    is not a contemporary survival cohort. Multilevel airway obstruction, tracheal
    cartilage abnormalities
    and neurologic complications require individual assessment.
  evidence:
  - reference: PMID:25706251
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Beare-Stevenson syndrome (BSS) is a rare FGFR2-associated craniosynostosis syndrome with a higher rate of sudden unexplained death than related conditions such as Apert, Pfeiffer, and Crouzon syndromes.
    explanation: >-
      States the excess mortality relative to the other members of the FGFR2 craniosynostosis
      group, which
      is the entry's central clinical claim.
    reference_title: 'Beare-Stevenson syndrome: two new patients, including a novel finding of tracheal cartilaginous sleeve.'
  - reference: PMID:38445861
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Half of patients with BSS died within the first year of life due to cardiorespiratory arrest or unexpected sudden death.
    explanation: A historical summary in a surgical case report, not a prospective BSS survival estimate.
    reference_title: Pitfall of Monobloc Advancement in Beare-Stevenson Syndrome.
  - reference: PMID:12900900
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: They were born with respiratory distress and were connected to mechanical ventilation for ventilatory support. Both of them died in 50 days after birth due to secondary complications.
    explanation: A concrete instance of the early respiratory course in two confirmed patients.
    reference_title: 'Beare-Stevenson syndrome: Two South American patients with FGFR2 analysis.'
- phase: Childhood
  age_range: Beyond infancy, in survivors
  notes: >-
    Surviving children may require staged airway, cranial and midface procedures and
    developmental support.
    An eight-year-old survivor is described in the 2024 surgical report. Airway cartilage
    deformation
    and Chiari-related tonsillar herniation can progress during childhood, as observed
    in a three-year-old
    with p.Tyr375Cys.
  evidence:
  - reference: PMID:25706251
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: BSS presents with craniosynostosis, cutis gyrata, and significant developmental delay in most patients who survive infancy.
    explanation: The developmental outcome that characterizes the surviving group.
    reference_title: 'Beare-Stevenson syndrome: two new patients, including a novel finding of tracheal cartilaginous sleeve.'
  - reference: PMID:38445861
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We currently have an 8-year-old patient who is being followed up. She underwent tracheostomy, cranioplasty, and shunting.
    explanation: Documents survival beyond infancy and the staged surgical burden.
    reference_title: Pitfall of Monobloc Advancement in Beare-Stevenson Syndrome.
  - reference: PMID:41112086
    reference_title: 'Anesthetic Management of Progressive Deformity of Tracheal Cartilaginous Sleeve in a Pediatric Patient With Beare-Stevenson Syndrome: A Case Report.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: At 3 years of age, rigid bronchoscopy revealed progressive tracheal cartilage deformity with inward protrusion.
    explanation: Serial imaging demonstrates progression in one child; it does not define the course of all BSS sleeves.
treatments:
- name: Tracheostomy for clinically significant airway obstruction
  action_category: THERAPEUTIC
  therapeutic_modality: SURGERY
  description: >-
    Airway support may require tracheostomy, with ventilation when indicated by the
    level and severity
    of obstruction. A tracheal cartilaginous sleeve remains present after tracheostomy;
    progressive deformation,
    tube malposition and granulation require continued specialist surveillance.
  treatment_term:
    preferred_term: Tracheostomy
    term:
      id: NCIT:C15341
      label: Tracheotomy
  evidence:
  - reference: PMID:25706251
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: This association and our experience suggests that BSS patients be evaluated for tracheal cartilaginous sleeve to prevent airway compromise.
    explanation: The authors' explicit surveillance recommendation.
    reference_title: 'Beare-Stevenson syndrome: two new patients, including a novel finding of tracheal cartilaginous sleeve.'
  - reference: PMID:41112086
    reference_title: 'Anesthetic Management of Progressive Deformity of Tracheal Cartilaginous Sleeve in a Pediatric Patient With Beare-Stevenson Syndrome: A Case Report.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Importantly, sudden and life-threatening airway obstruction can occur despite the presence of a tracheostomy tube due to severe deformity of the tracheal cartilage.
    explanation: Tracheostomy does not remove the structural lesion or eliminate airway risk.
- name: Cranial vault expansion
  action_category: THERAPEUTIC
  therapeutic_modality: SURGERY
  description: >-
    Cranial expansion addresses craniosynostosis and inadequate intracranial volume.
    GeneReviews recommends
    repair of multisuture synostosis generally within the first year, with timing
    and technique guided
    by anatomy, intracranial pressure and respiratory status. The sequence is individualized
    rather than
    fixed by one published surgical case.
  treatment_term:
    preferred_term: Cranial vault expansion
    term:
      id: NCIT:C15214
      label: Craniotomy
  target_phenotypes:
  - preferred_term: Craniosynostosis
    term:
      id: HP:0001363
      label: Craniosynostosis
  evidence:
  - reference: PMID:42495986
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: At 2 months of age, she underwent a ventriculoperitoneal shunt placement, followed by occipital cranial expansion at 1 year and fronto-orbital distraction at 2 years of age.
    explanation: Documents the staged sequence and its timing in a BSS patient.
    reference_title: First Successful Le Fort III Distraction in a Patient With Beare-Stevenson Cutis Gyrata Syndrome.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1455/pdf/Bookshelf_NBK1455.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1455/pdf/Bookshelf_NBK1455.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In general, multisuture craniosynostosis should be surgically repaired in 1st yr of life.
    explanation: The FGFR overview provides general timing, qualified by the individual anatomy and clinical status.
    quote_role: REVIEW_SYNTHESIS
- name: Midface advancement (Le Fort III distraction)
  action_category: THERAPEUTIC
  therapeutic_modality: SURGERY
  description: >
    Halo-type external distraction osteogenesis to advance the severely hypoplastic
    midface, correcting
    proptosis and occlusion. The first successful Le Fort III distraction in BSS was
    reported in 2026
    in a 5-year-old, achieving roughly 25 mm of distraction without major complications
    and sustained
    improvement at two years. Reported experience with the alternative monobloc advancement
    is more cautionary:
    in one BSS patient the temporal fossa was too narrow for the procedure to work
    well, and unrecognized
    micrognathia meant decannulation remained impossible despite the advancement.
    Prior shunt tubing and
    skull defects constrain the operative approach.
  treatment_term:
    preferred_term: Midface advancement
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_phenotypes:
  - preferred_term: Midface retrusion
    term:
      id: HP:0011800
      label: Midface retrusion
  - preferred_term: Proptosis
    term:
      id: HP:0000520
      label: Proptosis
  evidence:
  - reference: PMID:42495986
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Two uneventful years after surgery, the patient showed significant improvements in proptosis, occlusion, and facial profile, with an excellent clinical course.
    explanation: Medium-term outcome of the procedure.
    reference_title: First Successful Le Fort III Distraction in a Patient With Beare-Stevenson Cutis Gyrata Syndrome.
  - reference: PMID:38445861
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In addition, even though midface advancement, it was difficult to remove tracheostomy. This was because midfacial hypoplasia was so severe that it was hard to notice, but there was also micrognathia.
    explanation: >-
      The counter-case: midface advancement did not achieve decannulation, because
      coexisting micrognathia
      was masked by the severity of the midface hypoplasia.
    reference_title: Pitfall of Monobloc Advancement in Beare-Stevenson Syndrome.
- name: Cerebrospinal fluid diversion for hydrocephalus
  description: Ventriculoperitoneal shunting has been used for progressive hydrocephalus in reported patients. Indication and timing require neurosurgical assessment.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Ventriculoperitoneal shunt placement
    term:
      id: NCIT:C168483
      label: Ventriculoperitoneal Shunt Placement
  target_phenotypes:
  - preferred_term: Hydrocephalus
    term:
      id: HP:0000238
      label: Hydrocephalus
  evidence:
  - reference: PMID:41112086
    reference_title: 'Anesthetic Management of Progressive Deformity of Tracheal Cartilaginous Sleeve in a Pediatric Patient With Beare-Stevenson Syndrome: A Case Report.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: a ventriculoperitoneal shunt was placed at 6 months of age to treat hydrocephalus.
    explanation: Case-level use of CSF diversion in molecularly confirmed BSS.
- name: Airway assessment and tracheostomy surveillance
  description: Assess multilevel obstruction with otolaryngology. The FGFR overview advises operative airway evaluation at the first anesthetic, or during infancy if no procedure is planned, because a sleeve may otherwise be missed. Continued evaluation after tracheostomy should account for progressive cartilage deformation, tube position and granulation. The optimal repeat-endoscopy schedule is individualized.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1455/pdf/Bookshelf_NBK1455.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1455/pdf/Bookshelf_NBK1455.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: eval should occur in infancy because of risk of sudden death if tracheal cartilaginous sleeve is present.
    explanation: GeneReviews Table 6 supports infant airway evaluation; it does not prescribe a fixed repeat-bronchoscopy interval.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:41112086
    reference_title: 'Anesthetic Management of Progressive Deformity of Tracheal Cartilaginous Sleeve in a Pediatric Patient With Beare-Stevenson Syndrome: A Case Report.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: This case underscores the importance of thorough preoperative airway assessment and meticulous attention to tube placement in patients with BSS and TCS.
    explanation: Direct BSS case evidence for continued airway precautions.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1455/pdf/Bookshelf_NBK1455.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1455/pdf/Bookshelf_NBK1455.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: At the time of 1st anesthesia, performed by otolaryngologist. Craniofacial otolaryngologist should direct timing of operative airway eval if no sedation is planned, but eval should occur in infancy because of risk of sudden death if tracheal cartilaginous sleeve is present.
    explanation: GeneReviews Table 6 specifies the assessment and timing for FGFR craniosynostosis syndromes.
    quote_role: REVIEW_SYNTHESIS
- name: Sleep-disordered breathing surveillance
  description: Evaluate sleep-apnea symptoms at least every three months during infancy and annually thereafter under the FGFR overview, with polysomnography when indicated. Central apnea can prompt evaluation for Chiari I malformation. The choice of respiratory support is individualized; prolonged mask pressure from CPAP or BiPAP can worsen midface retrusion.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1455/pdf/Bookshelf_NBK1455.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1455/pdf/Bookshelf_NBK1455.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Avoid use of CPAP/BiPAP for long-term treatment of sleep apnea when possible, as pressure on midface exacerbates midface retrusion.
    explanation: This is an FGFR craniosynostosis precaution, not a prohibition on necessary ventilation.
    quote_role: REVIEW_SYNTHESIS
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1455/pdf/Bookshelf_NBK1455.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1455/pdf/Bookshelf_NBK1455.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Clinical eval for symptoms of sleep apnea At least every 3 mos in 1st year & annually thereafter
    explanation: GeneReviews Table 6 specifies the assessment and timing for FGFR craniosynostosis syndromes.
    quote_role: REVIEW_SYNTHESIS
  therapeutic_modality: OTHER
- name: Ocular protection and ophthalmic follow-up
  description: Assess corneal exposure, globe protection, eye alignment and optic nerves. GeneReviews recommends at least annual ophthalmic review, with urgent assessment for concerns. Inadequate lid closure can require lubrication, and severe exposure or globe subluxation may require tarsorrhaphy. Protective eyewear may be appropriate for activities posing an eye-injury risk.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1455/pdf/Bookshelf_NBK1455.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1455/pdf/Bookshelf_NBK1455.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Early initiation of topical eye lubrication if inadequate lid closure
    explanation: The FGFR management table supports ocular-surface protection in patients with proptosis.
    quote_role: REVIEW_SYNTHESIS
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1455/pdf/Bookshelf_NBK1455.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1455/pdf/Bookshelf_NBK1455.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Ophthalmologic exam of optic nerves; eval for sclerocornea, orbital protection, strabismus &/or amblyopia At least annually, & urgently if any concern arises
    explanation: GeneReviews Table 6 specifies the assessment and timing for FGFR craniosynostosis syndromes.
    quote_role: REVIEW_SYNTHESIS
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1455/pdf/Bookshelf_NBK1455.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1455/pdf/Bookshelf_NBK1455.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Individuals with exophthalmos may require protective eyewear during activities with risk of eye injury (e.g., ball sports).
    explanation: The precaution applies when proptosis increases eye-injury risk.
    quote_role: REVIEW_SYNTHESIS
- name: Audiologic surveillance and hearing support
  description: Evaluate hearing at diagnosis and at least annually. Conductive hearing loss is part of the BSS phenotype; hearing aids, bone-conduction devices or middle-ear procedures are selected according to the lesion and degree of loss. Optimizing hearing supports language development.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1455/pdf/Bookshelf_NBK1455.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1455/pdf/Bookshelf_NBK1455.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Optimization of hearing facilitates language & communication development.
    explanation: The FGFR treatment table provides the rationale for hearing support.
    quote_role: REVIEW_SYNTHESIS
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1455/pdf/Bookshelf_NBK1455.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1455/pdf/Bookshelf_NBK1455.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Hearing loss Audiology eval At least annually
    explanation: GeneReviews Table 6 specifies the assessment and timing for FGFR craniosynostosis syndromes.
    quote_role: REVIEW_SYNTHESIS
  therapeutic_modality: OTHER
- name: Developmental and speech support
  description: Arrange early-intervention and developmental assessment, with continued speech-language evaluation and individualized therapies. GeneReviews recommends developmental evaluation at least every three months in the first year and annually thereafter; speech assessment begins around 18 months and continues annually, with additional assessment around midface surgery.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1455/pdf/Bookshelf_NBK1455.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1455/pdf/Bookshelf_NBK1455.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Referral for early intervention services. Consider referral to a neurodevelopmental specialist.
    explanation: The initial-evaluation table supports developmental referral rather than assuming a fixed developmental outcome.
    quote_role: REVIEW_SYNTHESIS
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1455/pdf/Bookshelf_NBK1455.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1455/pdf/Bookshelf_NBK1455.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Neurodevelopment Early intervention &/or neurodevelopmental pediatrics eval At least every 3 mos in 1st yr & annually thereafter
    explanation: GeneReviews Table 6 specifies the assessment and timing for FGFR craniosynostosis syndromes.
    quote_role: REVIEW_SYNTHESIS
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1455/pdf/Bookshelf_NBK1455.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1455/pdf/Bookshelf_NBK1455.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Speech issues Speech pathology eval • At age ~18 mos, then annually • Additional speech assessments before & after midface surgeries
    explanation: Table 6 specifies speech surveillance beginning around 18 months and around midface surgery.
    quote_role: REVIEW_SYNTHESIS
- name: Feeding assessment and nutritional support
  description: Assess swallowing safety and growth, and provide feeding therapy and enteral support when needed. Reassess swallowing after craniofacial surgery. Persistent poor growth requires evaluation of multiple possible contributors; the short-intestine autopsy observation does not establish a universal mechanism.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1455/pdf/Bookshelf_NBK1455.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1455/pdf/Bookshelf_NBK1455.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Feeding therapy is helpful to assess swallowing safety & support eating by mouth.
    explanation: The FGFR management table supports feeding evaluation and therapy.
    quote_role: REVIEW_SYNTHESIS
  treatment_term:
    preferred_term: Feeding assessment and nutritional support
    term:
      id: NCIT:C15433
      label: Nutritional Support
- name: Dental and orthodontic care
  description: Coordinate pediatric dentistry and craniofacial orthodontics for hypodontia, natal teeth, occlusion and eruption problems. Timing of orthodontic and surgical interventions depends on anatomy and growth.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1455/pdf/Bookshelf_NBK1455.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1455/pdf/Bookshelf_NBK1455.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Pediatric dental care & eval by craniofacial orthodontist as part of coordinated craniofacial team care
    explanation: Shared FGFR craniosynostosis management is relevant to the documented BSS dental phenotype.
    quote_role: REVIEW_SYNTHESIS
- name: Cervical spine assessment and positioning precautions
  description: Assess cervical fusion and instability, particularly before surgery. If cervical anomalies are present, positioning, intubation technique and activity restrictions should minimize spinal cord injury risk.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1455/pdf/Bookshelf_NBK1455.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1455/pdf/Bookshelf_NBK1455.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Individuals with cervical spine anomalies may be at risk for spinal cord injury with hyperextension and may require fiberoptic intubation and/or sports restrictions for activities that pose a risk for head/neck injury.
    explanation: GeneReviews qualifies these precautions by the presence of cervical spine anomalies.
    quote_role: REVIEW_SYNTHESIS
- name: Intracranial pressure surveillance
  description: Monitor head growth and symptoms of raised intracranial pressure. The FGFR overview advises clinical assessment at least every three months during the first year and ophthalmic assessment for papilledema at least annually or with concerning symptoms. Imaging and neurosurgical reassessment are guided by concern for hydrocephalus or Chiari malformation.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1455/pdf/Bookshelf_NBK1455.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1455/pdf/Bookshelf_NBK1455.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Eval for signs of ↑ intracranial pressure (e.g., headaches, vomiting)
    explanation: The surveillance table supports symptom-directed reassessment in addition to head-growth monitoring.
    quote_role: REVIEW_SYNTHESIS
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1455/pdf/Bookshelf_NBK1455.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1455/pdf/Bookshelf_NBK1455.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Clinical eval at least every 3 mos in 1st year of life; can be done in conjunction w/team visits to assess for craniosynostosis Ophthalmologic exam for papilledema At least annually, & w/any concerning symptoms
    explanation: GeneReviews Table 6 specifies the assessment and timing for FGFR craniosynostosis syndromes.
    quote_role: REVIEW_SYNTHESIS
- name: Genetic counseling and reproductive testing
  description: Offer counseling with parental testing, residual mosaic recurrence risk and the 50% variant-transmission risk for an affected heterozygous individual. Once a familial pathogenic variant is identified, prenatal and preimplantation testing are possible; genotype alone cannot reliably predict individual clinical severity.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1455/pdf/Bookshelf_NBK1455.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1455/pdf/Bookshelf_NBK1455.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Once the FGFR pathogenic variant has been identified in an affected family member, prenatal and preimplantation genetic testing are possible.
    explanation: GeneReviews supports reproductive testing after variant identification.
    quote_role: REVIEW_SYNTHESIS
  treatment_term:
    preferred_term: Genetic counseling and reproductive testing
    term:
      id: NCIT:C15240
      label: Genetic Counseling
- name: Delivery planning for an affected fetus
  description: Coordinate delivery at a center with pediatric airway, craniofacial and neurosurgical expertise. A clinician skilled in neonatal intubation and resuscitation should be present because airway obstruction can require immediate intervention.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1455/pdf/Bookshelf_NBK1455.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1455/pdf/Bookshelf_NBK1455.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: a health care provider skilled in endotracheal intubation and resuscitation should be present at the delivery.
    explanation: GeneReviews recommends specialist preparedness for FGFR craniosynostosis pregnancies.
    quote_role: REVIEW_SYNTHESIS
- name: Psychosocial and family support
  description: Provide ongoing psychosocial assessment, educational support and attention to the family’s practical needs and the child’s social experience. Care goals and elective reconstruction should be individualized.
  evidence:

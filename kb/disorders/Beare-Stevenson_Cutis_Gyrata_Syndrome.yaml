inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Autosomal dominant FGFR2-related disorder, with sporadic and molecularly confirmed
    de novo cases reported.
    Advanced paternal age has been observed, but individual case observations do not
    establish a specific
    germline selection mechanism. Parental testing and genetic counseling guide recurrence-risk
    assessment.
    For an affected heterozygous individual, each child has a 50% chance of inheriting
    the variant. When
    parental blood testing is negative, sibling recurrence risk remains slightly above
    the population
    background because of possible germline mosaicism.
  evidence:
  - reference: PMID:8696350
    reference_title: Fibroblast growth factor receptor 2 mutations in Beare-Stevenson cutis gyrata syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Beare-Stevenson cutis gyrata syndrome (MIM 123790) is an autosomal dominant condition characterized by the furrowed skin disorder of cutis gyrata, acanthosis nigricans, craniosynostosis, craniofacial dysmorphism, digital anomalies, umbilical and anogenital abnormalities and early death.
    explanation: The defining molecular paper states the inheritance pattern and the core phenotype.
  - reference: PMID:1519658
    reference_title: Beare-Stevenson cutis gyrata syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: All cases observed to date have been sporadic. Increased paternal age suggests the possibility of an autosomal dominant mutation.
    explanation: >-
      The premolecular 1992 series reported sporadic cases and proposed dominant inheritance;
      it did not
      establish de novo status by parental sequencing.
  - reference: PMID:16531735
    reference_title: A case of Beare-Stevenson syndrome with a broad spectrum of features and a review of the FGFR2 Y375C mutation phenotype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The paternal age at the time of conception was 62 years consistent with a paternal age effect.
    explanation: A molecularly confirmed case had a 62-year-old father; this is a clinical observation consistent with, rather than proof of, a paternal-age mechanism.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1455/pdf/Bookshelf_NBK1455.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1455/pdf/Bookshelf_NBK1455.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Each child of an individual with an FGFR craniosynostosis syndrome has a 50% chance of inheriting the FGFR pathogenic variant.
    explanation: General autosomal dominant FGFR counseling applies to variant transmission; clinical severity is not fixed by this probability.
    quote_role: REVIEW_SYNTHESIS
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1455/pdf/Bookshelf_NBK1455.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1455/pdf/Bookshelf_NBK1455.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: the risk to sibs is slightly greater than that of the general population because of the possibility of parental germline mosaicism.
    explanation: GeneReviews retains residual recurrence risk after negative parental leukocyte testing.
    quote_role: REVIEW_SYNTHESIS
prevalence:
- population: Worldwide, published-case literature
  measure_type: CASES_IN_LITERATURE
  notes: >-
    Published-case counts are not population prevalence estimates. The 2015 report
    described 21 previously
    reported patients and the 2024 report fewer than 30. These dated literature counts
    are affected by
    ascertainment and do not establish incidence or current total case numbers.
  evidence:
  - reference: PMID:25706251
    reference_title: 'Beare-Stevenson syndrome: two new patients, including a novel finding of tracheal cartilaginous sleeve.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: There have only been 21 reported patients with BSS, which limits prognostication for clinicians and likely does not capture the full extent of the phenotype.
    explanation: The 2015 published-case count, with the authors' own caveat about what it supports.
  - reference: PMID:38445861
    reference_title: Pitfall of Monobloc Advancement in Beare-Stevenson Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In addition, there have only been fewer than 30 cases, which limits prognostication for clinicians.
    explanation: An updated 2024 count, consistent with the 2015 figure.
pathophysiology:
- name: FGFR2 Activating Variant
  role: trigger
  biological_scale: MOLECULAR
  conforms_to: fgfr_gain_of_function_skeletal_dysplasia#Constitutive FGFR Activation
  description: >-
    Heterozygous FGFR2 variants cause the syndrome. The recurrent p.Tyr375Cys and
    p.Ser372Cys substitutions
    introduce cysteine residues in the juxtamembrane/transmembrane region. Functional
    studies demonstrate
    constitutive activation for human p.Tyr375Cys and the corresponding murine p.Tyr394Cys
    allele. A de
    novo p.Phe276Cys variant was classified as likely pathogenic in a 2026 prenatal
    case; its functional
    effect was not experimentally tested. A 63-nucleotide deletion has also been reported
    in a Beare-Stevenson-like
    presentation, so a cysteine-creating missense mechanism should not be imposed
    on every reported allele.
  gene:
    preferred_term: FGFR2
    description: >-
      FGFR2 activation demonstrated for p.Tyr375Cys; functional consequences of rarer
      reported alleles
      require allele-specific interpretation.
    modifier: GAIN_OF_FUNCTION
    term:
      id: hgnc:3689
      label: FGFR2
  molecular_functions:
  - preferred_term: transmembrane receptor protein tyrosine kinase activity
    term:
      id: GO:0004714
      label: transmembrane receptor protein tyrosine kinase activity
    modifier: INCREASED
  evidence:
  - reference: PMID:8696350
    reference_title: Fibroblast growth factor receptor 2 mutations in Beare-Stevenson cutis gyrata syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In three sporatic cases, a novel missense mutation was found causing an amino acid to be replaced by a cysteine; two had the identical Ty375Cys mutation in the transmembrane domain and one had a Ser372Cys mutation in the carboxyl-terminal end of the linker region between the immunoglobulin III-like (Iglll) and transmembrane domains." # codespell:ignore-line
    explanation: "The original identification of the two recurrent alleles and their domain positions. Quoted verbatim including the source's own typographical errors (\"sporatic\", \"Ty375Cys\", \"Iglll\"), which are in the published abstract and not introduced here." # codespell:ignore-line
  - reference: PMID:8696350
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In two patients, neither of these mutations were found suggesting further genetic heterogeneity.
    explanation: >-
      Two clinically diagnosed patients lacked either recurrent variant in the original
      report; this does
      not by itself establish another causal locus.
    reference_title: Fibroblast growth factor receptor 2 mutations in Beare-Stevenson cutis gyrata syndrome.
  - reference: PMID:41775672
    reference_title: Prenatally Diagnosed Beare-Stevenson Cutis Gyrata Syndrome With a Novel FGFR2 Variant.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: GS resulted at 30 weeks 5 days and revealed a heterozygous, de novo, likely pathogenic FGFR2 variant (c.827 T > G, p.Phe276Cys) (Table 1B).
    explanation: The prenatal variant was classified as likely pathogenic; this case report does not experimentally establish disulfide bonding or gain of function.
  downstream:
  - target: Ligand-Independent FGFR2 Activation
    description: >-
      The p.Tyr375Cys allele and its murine equivalent produce ligand-independent
      receptor activation
      in experimental systems.
    causal_link_type: DIRECT

  - causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Human p.Tyr375Cys-associated BSS can include fusion of tracheal cartilage rings; the intervening developmental mechanism is unresolved and is not reproduced consistently in the corresponding mouse model.
    evidence:
    - evidence_source: HUMAN_CLINICAL
      explanation: Identifies the human disease allele in the same patient whose fused tracheal cartilage was imaged.
      reference: PMID:41112086
      reference_title: 'Anesthetic Management of Progressive Deformity of Tracheal Cartilaginous Sleeve in a Pediatric Patient With Beare-Stevenson Syndrome: A Case Report.'
      snippet: However, genetic testing conducted at the previous hospital revealed the Y375C variant of FGFR2, and the patient was diagnosed with BSS.
      supports: SUPPORT
    - evidence_source: HUMAN_CLINICAL
      explanation: The genotype-defined human case establishes the structural airway phenotype; it does not resolve the intervening signaling mechanism.
      reference: PMID:41112086
      reference_title: 'Anesthetic Management of Progressive Deformity of Tracheal Cartilaginous Sleeve in a Pediatric Patient With Beare-Stevenson Syndrome: A Case Report.'
      snippet: The upper to mid‐trachea exhibits a tracheoesophageal membrane, yet it maintains a cylindrical shape, with the fused tracheal cartilaginous rings.
      supports: SUPPORT
    target: Tracheal Cartilage Ring Fusion
  - causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: The corresponding Y394C knock-in allele produces midfacial hypoplasia in mice. The experiment does not isolate suture fusion as its mediator.
    evidence:
    - evidence_source: MODEL_ORGANISM
      explanation: Mutant-versus-littermate imaging supports an allele-to-midface effect, without identifying which cranial abnormality mediates it.
      reference: PMID:22585574
      reference_title: p38 Inhibition ameliorates skin and skull abnormalities in Fgfr2 Beare-Stevenson mice.
      snippet: High-resolution micro-CT scans of Fgfr2+/Y394C mice revealed midfacial hypoplasia, brachycephalic-shaped skull, and premature fusion of coronal and other sutures (Figure 1, E–H, and Supplemental Figure 2).
      supports: SUPPORT
    target: Midface retrusion
- name: Ligand-Independent FGFR2 Activation
  biological_scale: MOLECULAR
  description: >-
    Human FGFR2 p.Tyr375Cys increased receptor and FRS2 phosphorylation in transfected
    rat chondrosarcoma
    cells. Keratinocytes from Fgfr2+/Y394C mice also showed increased receptor phosphorylation
    without
    added FGF ligand. Intermolecular disulfide bonding is a proposed structural explanation
    for the cysteine
    substitutions. The 1998 biochemical study tested other FGFR2 variants and explicitly
    did not test
    p.Ser372Cys or p.Tyr375Cys.
  molecular_functions:
  - preferred_term: transmembrane receptor protein tyrosine kinase activity
    term:
      id: GO:0004714
      label: transmembrane receptor protein tyrosine kinase activity
    modifier: INCREASED
  evidence:
  - reference: PMID:22585574
    reference_title: p38 Inhibition ameliorates skin and skull abnormalities in Fgfr2 Beare-Stevenson mice.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Our results showed constitutive activation of FGFR2 receptor and FRS2, a major FGFR downstream mediator (52), in rat chondrosarcoma (RCS) chondrocytes transfected with human FGFR2 Y375C as compared with WT FGFR2 (Figure 4A).
    explanation: Direct receptor-signaling measurements in cells expressing the human disease allele.
  - reference: PMID:22585574
    reference_title: p38 Inhibition ameliorates skin and skull abnormalities in Fgfr2 Beare-Stevenson mice.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We confirmed this result in vivo by demonstrating increased phosphorylation of FGFR2 in epidermal keratinocytes derived from our Fgfr2+/Y394C mice without the addition of FGF ligand as compared with that of controls (Supplemental Figure 4), indicating that the Y394C mutation causes constitutive or ligand-independent activation of the receptor.
    explanation: Mouse-derived keratinocytes support ligand-independent activation.
  - reference: PMID:9539778
    reference_title: Activating mutations in the extracellular domain of the fibroblast growth factor receptor 2 function by disruption of the disulfide bond in the third immunoglobulin-like domain.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Although we have not examined these mutations in this work, we would predict that they also involve aberrant intermolecular disulfide bonding.
    explanation: The authors explicitly identify disulfide bonding for the two BSS alleles as a prediction; their direct assays concerned other FGFR2 variants.
  downstream:
  - target: p38 MAPK Activation
    description: >-
      Constitutive receptor activation is accompanied by increased p38 phosphorylation
      in mutant mouse
      epidermis and calvaria.
    causal_link_type: DIRECT

- name: p38 MAPK Activation
  biological_scale: CELLULAR
  conforms_to: fgfr_gain_of_function_skeletal_dysplasia#Sustained MAPK/STAT Signaling
  description: >-
    Phosphorylated p38 is increased in epidermis and calvarial tissue of Fgfr2+/Y394C
    mice. ERK1/2 phosphorylation
    is additionally increased in mutant skull tissue, so the response is not exclusive
    to p38. Pharmacological
    p38 inhibition improves epidermal hyperplasia and produces limited suture effects
    without a significant
    overall skull-shape or survival benefit in the tested regimen.
  biological_processes:
  - preferred_term: p38MAPK cascade
    term:
      id: GO:0038066
      label: p38MAPK cascade
    modifier: INCREASED
  evidence:
  - reference: PMID:22585574
    reference_title: p38 Inhibition ameliorates skin and skull abnormalities in Fgfr2 Beare-Stevenson mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: We found ligand-independent phosphorylation of FGFR2 and activation of p38 signaling in mutant skin and calvarial tissues.
    explanation: >-
      Establishes ligand-independent receptor activation and identifies p38 as the
      engaged downstream
      branch in the two affected tissues.
  - reference: PMID:22585574
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: We developed a mouse model of BSS harboring a FGFR2 Y394C mutation and identified p38 MAPK as an important signaling pathway mediating these abnormalities.
    explanation: Names p38 MAPK as the mediating pathway for both the skin and skull phenotypes.
    reference_title: p38 Inhibition ameliorates skin and skull abnormalities in Fgfr2 Beare-Stevenson mice.
  - reference: PMID:22585574
    reference_title: p38 Inhibition ameliorates skin and skull abnormalities in Fgfr2 Beare-Stevenson mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: None of the other pathways showed obvious changes of phosphorylation in both tissues; however, we noted phosphorylated ERK1/2 was increased in mutant skull tissues (Supplemental Figure 5).
    explanation: ERK1/2 activation in skull tissue qualifies an exclusively p38-based interpretation.
  downstream:
  - target: Cranial Suture Osteogenic Acceleration
    description: >-
      p38 contributes to the osteogenic phenotype, with increased ERK1/2 signaling
      also observed in skull
      tissue; p38 inhibition yields only limited suture improvement.
    causal_link_type: DIRECT
  - target: Epidermal Hyperplasia
    description: >-
      p38 inhibition reduces the mutant epidermal proliferation and differentiation
      abnormalities, supporting
      a functional contribution to epidermal hyperplasia.
    causal_link_type: DIRECT

- name: Cranial Suture Osteogenic Acceleration
  biological_scale: TISSUE
  conforms_to: fgfr_gain_of_function_skeletal_dysplasia#Cranial Suture Osteogenic Acceleration
  description: >-
    Fgfr2+/Y394C mouse coronal sutures show decreased cell proliferation together
    with increased osteogenic
    differentiation. Expanded alkaline phosphatase and Runx2 expression and overlapping
    osteonectin-positive
    osteogenic fronts support premature bone formation at the suture.

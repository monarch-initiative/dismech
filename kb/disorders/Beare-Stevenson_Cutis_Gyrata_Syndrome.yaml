- name: Premature Cranial Suture Fusion
  biological_scale: TISSUE
  conforms_to: fgfr_gain_of_function_skeletal_dysplasia#Premature Suture Fusion and Craniosynostosis
  description: >-
    Premature fusion of multiple cranial sutures produces craniosynostosis and can
    yield a cloverleaf
    skull. In the six-case 1992 clinical series, four had craniosynostosis and three
    of those had cloverleaf
    skull. Associated hydrocephalus, Chiari malformation and midface abnormalities
    are clinically important
    but cannot all be attributed to restricted cranial volume alone.
  biological_processes:
  - preferred_term: cranial suture morphogenesis
    term:
      id: GO:0060363
      label: cranial suture morphogenesis
    modifier: DECREASED
  evidence:
  - reference: PMID:1519658
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Craniosynostosis is present in four cases, with cloverleaf skull in three of these.
    explanation: The original series' documentation of craniosynostosis and cloverleaf skull frequency.
    reference_title: Beare-Stevenson cutis gyrata syndrome.
  - reference: PMID:1519658
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Performance and life expectation appear to be related to the presence or absence of cloverleaf skull.
    explanation: >-
      The small original clinical series suggested an association between cloverleaf
      skull and outcome;
      it does not establish an independently validated prognostic classifier.
    reference_title: Beare-Stevenson cutis gyrata syndrome.
  - reference: PMID:12900900
    reference_title: 'Beare-Stevenson syndrome: Two South American patients with FGFR2 analysis.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The radiologic examination showed a cloverleaf-form craniosynostosis.
    explanation: Independent radiological confirmation in molecularly confirmed p.Tyr375Cys patients.
  downstream:
  - target: Craniosynostosis
  - target: Cloverleaf skull
- name: Epidermal Hyperplasia
  biological_scale: TISSUE
  description: >-
    Fgfr2+/Y394C mouse epidermis shows keratinocyte hyperproliferation, acanthosis
    and papillomatosis
    with altered differentiation-marker expression. These findings model the cutaneous
    folds and acanthosis
    of human BSS. Human cutis gyrata has a variable distribution that includes scalp,
    forehead, face,
    neck, trunk, hands and feet.
  cell_types:
  - preferred_term: Keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  biological_processes:
  - preferred_term: keratinocyte proliferation
    term:
      id: GO:0043616
      label: keratinocyte proliferation
    modifier: INCREASED
  evidence:
  - reference: PMID:22585574
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: This study reveals the pleiotropic effects of the FGFR2 Y394C mutation evidenced by cutis gyrata, acanthosis nigricans, and craniosynostosis and provides a useful model for investigating the molecular mechanisms of skin and skull development.
    explanation: >-
      Confirms in a model carrying the murine equivalent of the human allele that
      one variant produces
      both the skin and the skull phenotype.
    reference_title: p38 Inhibition ameliorates skin and skull abnormalities in Fgfr2 Beare-Stevenson mice.
  - reference: PMID:1519658
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Cutis gyrata variably affects the scalp, forehead, face, preauricular area, neck, trunk, hands, and feet.
    explanation: The human distribution of the skin phenotype.
    reference_title: Beare-Stevenson cutis gyrata syndrome.
  - reference: PMID:22585574
    reference_title: p38 Inhibition ameliorates skin and skull abnormalities in Fgfr2 Beare-Stevenson mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Histologically, the skin of E16.5, P0, and P5 Fgfr2+/Y394C mice displayed cutis gyrata, epidermal acanthosis, and papillomatosis (Figure 2, A–D).
    explanation: Mouse tissue histology supports the epidermal phenotype.
  downstream:
  - target: Cutis gyrata of scalp
  - target: Palmoplantar cutis gyrata
  - target: Acanthosis nigricans
- name: Tracheal Cartilage Ring Fusion
  biological_scale: TISSUE
  description: >-
    Vertical fusion of tracheal cartilage rings can produce a rigid sleeve along the
    trachea. Human BSS
    cases demonstrate this lesion, including progressive inward cartilage deformation
    in a child followed
    to age three. The resulting airway risks include impaired clearance and obstruction
    or tube malposition;
    tracheostomy does not remove the abnormal cartilage. No sleeve was found among
    the five newborn Fgfr2+/Y394C
    mice assessed by whole-mount morphology in a later study, limiting extrapolation
    from this model to
    the human airway phenotype.
  evidence:
  - reference: PMID:41112086
    reference_title: 'Anesthetic Management of Progressive Deformity of Tracheal Cartilaginous Sleeve in a Pediatric Patient With Beare-Stevenson Syndrome: A Case Report.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The initial rigid bronchoscopy demonstrated tracheal cartilaginous sleeve, and tracheostomy was performed. At 3 years of age, rigid bronchoscopy revealed progressive tracheal cartilage deformity with inward protrusion.
    explanation: Serial human imaging documents a sleeve and later deformation in one child.
  - reference: PMID:32886384
    reference_title: Genotype-Phenotype Correlation of Tracheal Cartilaginous Sleeves and Fgfr2 Mutations in Mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Though TCS has been seen in the human FGFR2Y375C variant, our results suggest that they are not present or are present at low frequency in the mouse model.
    explanation: The negative newborn mouse result constrains the model; it does not refute the human association.
  downstream:
  - target: Tracheal cartilaginous sleeve

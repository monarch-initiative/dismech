    term:
      id: NCIT:C15747
      label: Supportive Care
discussions:
- discussion_id: gap_bss_p38_inhibition_translation
  prompt: >-
    What aspects of the p38-inhibitor response in Fgfr2+/Y394C mice could translate
    to human BSS?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#p38 MAPK Activation
  - pathophysiology#Epidermal Hyperplasia
  rationale: >-
    Prenatal systemic SB203580 and early postnatal topical treatment improved epidermal
    hyperplasia in
    mice. Systemic treatment produced slight coronal-suture improvement in a minority
    of pups, but quantitative
    skull morphology did not significantly improve and survival was unchanged. This
    is preclinical evidence
    for pathway involvement, with unresolved developmental timing, efficacy and safety
    in humans. The
    mouse model does not reliably reproduce human tracheal sleeves, so an airway benefit
    cannot be inferred
    from skin rescue.
  evidence:
  - reference: PMID:22585574
    reference_title: p38 Inhibition ameliorates skin and skull abnormalities in Fgfr2 Beare-Stevenson mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Only a small portion of drug-treated mutant pups (20% of mutants from 2 litters) showed slight improvement and increased patency in coronal sutures.
    explanation: The full paper reports limited suture benefit rather than skin-only efficacy.
  - reference: PMID:22585574
    reference_title: p38 Inhibition ameliorates skin and skull abnormalities in Fgfr2 Beare-Stevenson mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: subsequent landmark-based quantification of skull morphology did not show significant differences between treated and untreated mutants
    explanation: Qualitative head-shape observations did not translate to significant quantitative morphology improvement.
  - reference: PMID:22585574
    reference_title: p38 Inhibition ameliorates skin and skull abnormalities in Fgfr2 Beare-Stevenson mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: The SB203580 treatment did not improve the survival rate of Fgfr2+/Y394C mice
    explanation: The tested regimen did not improve survival.
  proposed_experiments:
  - experiment_id: exp_bss_p38_developmental_window
    name: Timing and tissue specificity of p38 inhibition
    description: Compare developmental treatment windows and tissue-specific delivery with prespecified skin, suture, growth and survival outcomes; evaluate toxicity and pathways that remain active despite p38 inhibition.
- discussion_id: gap_bss_tracheal_sleeve_frequency_and_causation
  prompt: >-
    Why does the newborn Fgfr2+/Y394C mouse incompletely reproduce the human tracheal
    cartilage phenotype?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Tracheal Cartilage Ring Fusion
  rationale: >-
    Human p.Tyr375Cys cases have tracheal cartilaginous sleeves, but a systematic
    study found none among
    five newborn Fgfr2+/Y394C tracheas examined by whole-mount morphology. Sleeves
    occurred in Fgfr2C342Y
    mice. The small BSS sample, single time point and genetic-background differences
    limit inference.
    This is a demonstrated model limitation, not an experiment that has yet to be
    attempted. Human frequency
    and genotype-specific longitudinal airway risks remain uncertain.
  evidence:
  - reference: PMID:32886384
    reference_title: Genotype-Phenotype Correlation of Tracheal Cartilaginous Sleeves and Fgfr2 Mutations in Mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Though TCS has been seen in the human FGFR2Y375C variant, our results suggest that they are not present or are present at low frequency in the mouse model.
    explanation: Directly states the human-model mismatch.
  - reference: PMID:32886384
    reference_title: Genotype-Phenotype Correlation of Tracheal Cartilaginous Sleeves and Fgfr2 Mutations in Mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: There were substantially fewer Fgfr2+/Y394C, Fgfr2+/S252W and Fgfr2+/P253R specimens than Fgfr2C342Y/+. It is possible that more severely affected tracheas would have been present in other groups, had greater numbers of specimens been available.
    explanation: The negative finding is limited by sample size.
  proposed_experiments:
  - experiment_id: exp_bss_longitudinal_airway_model
    name: Longitudinal tracheal morphology in larger BSS mouse cohorts
    description: Extend the existing newborn study to larger, age-stratified cohorts and controlled genetic backgrounds, and compare cartilage segmentation and airway dimensions with human serial imaging.
- discussion_id: gap_bss_versus_crouzon_prenatal_discrimination
  prompt: >-
    Can Beare-Stevenson syndrome be distinguished from Crouzon syndrome prenatally,
    given that the two
    overlap in appearance but differ sharply in prognosis?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Premature Cranial Suture Fusion
  rationale: >-
    Prenatal craniosynostosis syndromes overlap. In the 2015 report, cutis gyrata
    was recognized retrospectively
    on prenatal imaging after a postnatal BSS diagnosis. A 2026 case with hydrops
    and multiple anomalies
    used genome sequencing to identify p.Phe276Cys and inform delivery planning before
    craniosynostosis
    was confidently recognized. These cases support combined imaging and molecular
    evaluation; they do
    not establish diagnostic sensitivity or a survival benefit.
  evidence:
  - reference: PMID:25706251
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Cloverleaf skull was identified prenatally in one patient, with initial concern for Crouzon syndrome.
    explanation: A concrete instance of the prenatal misassignment this gap concerns.
    reference_title: 'Beare-Stevenson syndrome: two new patients, including a novel finding of tracheal cartilaginous sleeve.'
  - reference: PMID:25706251
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Prenatal 3D ultrasound was performed, but cutis gyrata was only visible on retrospective examination following the clinical diagnosis of BSS after birth.
    explanation: >-
      The skin finding was missed prospectively in this case; the observation does
      not establish that
      prospective detection is impossible.
    reference_title: 'Beare-Stevenson syndrome: two new patients, including a novel finding of tracheal cartilaginous sleeve.'
  - reference: PMID:25706251
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Due to phenotypic overlap with Crouzon syndrome, but worse prognosis, we recommend consideration of prenatal 3D ultrasound and mutation testing for patients with suspected Crouzon to allow for prenatal diagnosis of BSS and to enable appropriate genetic counseling and postnatal care.
    explanation: The proposed but untested solution.
    reference_title: 'Beare-Stevenson syndrome: two new patients, including a novel finding of tracheal cartilaginous sleeve.'
  proposed_experiments:
  - experiment_id: exp_bss_prenatal_fgfr2_panel_yield
    name: Diagnostic yield of FGFR2 testing in prenatally suspected Crouzon syndrome
    description: >-
      Apply FGFR2 sequencing to a consecutive series of fetuses with prenatally suspected
      syndromic craniosynostosis
      and report how often the result reassigns the diagnosis to BSS, which is the
      measurement the recommendation
      currently lacks.

diagnosis:
- name: Clinical assessment and molecular confirmation
  description: Assess cranial sutures, characteristic skin folds, umbilical and anogenital findings, and airway involvement. Because craniosynostosis syndromes overlap and no formal clinical criteria exist, confirm the suspected diagnosis with FGFR2 testing. A craniosynostosis multigene panel or genomic testing can be appropriate when the phenotype is atypical or initial testing is unrevealing. Hotspot-only testing will miss rarer alleles.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1455/pdf/Bookshelf_NBK1455.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1455/pdf/Bookshelf_NBK1455.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: As no formal clinical diagnostic criteria exist, specific diagnosis should be confirmed by genetic testing.
    explanation: The FGFR overview recommends molecular confirmation in the overlapping syndromic spectrum.
    quote_role: REVIEW_SYNTHESIS
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1455/pdf/Bookshelf_NBK1455.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1455/pdf/Bookshelf_NBK1455.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Approaches include gene-targeted testing (targeted analysis, single-gene testing, multigene panel) or comprehensive genomic testing (exome sequencing, exome array, genome sequencing).
    explanation: Provides the diagnostic options; selection depends on phenotype and prior results.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:19610084
    reference_title: Novel FGFR2 deletion in a patient with Beare-Stevenson-like syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: was performed on DNA extracted from peripheral blood lymphocytes from the propositus, and was negative.
    explanation: A deletion-associated BSS-like case illustrates the limitation of testing only the two recurrent substitutions.
  - reference: PMID:19610084
    reference_title: Novel FGFR2 deletion in a patient with Beare-Stevenson-like syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: targeted re-sequencing for the two previously known FGFR2 mutations, p.Y375 C and p.S372 C
    explanation: The preceding portion of the diagnostic passage identifies the negative assay as testing only the recurrent substitutions.
- name: Prenatal imaging with molecular evaluation
  description: Prenatal ultrasound may identify cloverleaf skull, abnormal skin folding or additional anomalies, but suggestive craniosynostosis can emerge late and imaging findings overlap other syndromes. In one 2026 case, amniocyte genome sequencing identified de novo p.Phe276Cys and informed delivery planning. Molecular results require interpretation with detailed fetal and postnatal phenotyping.
  evidence:
  - reference: PMID:41775672
    reference_title: Prenatally Diagnosed Beare-Stevenson Cutis Gyrata Syndrome With a Novel FGFR2 Variant.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: This case expands the genotype–phenotype correlation of BSS and demonstrates the clinical utility of prenatal SNV analysis available via modalities such as GS, given that the genetic diagnosis had direct implications for delivery planning.
    explanation: A single prenatal case supports clinical utility without establishing diagnostic sensitivity.
  - reference: PMID:25706251
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Prenatal 3D ultrasound was performed, but cutis gyrata was only visible on retrospective examination following the clinical diagnosis of BSS after birth.
    explanation: >-
      The skin finding was missed prospectively in this case; the observation does
      not establish that
      prospective detection is impossible.
    reference_title: 'Beare-Stevenson syndrome: two new patients, including a novel finding of tracheal cartilaginous sleeve.'
animal_models:
- name: Fgfr2 Y394C heterozygous knock-in mouse
  species: Mus musculus
  genotype: Fgfr2+/Y394C
  background: C57BL/6J
  publication: PMID:22585574
  description: Knock-in of the murine allele corresponding to human p.Tyr375Cys. The model develops epidermal hyperplasia, premature suture fusion, midface hypoplasia, reduced growth and early mortality. p38 inhibition improves skin histology, with limited suture benefit and no survival improvement under the reported regimen.
  modeled_mechanisms:
  - target: Epidermal Hyperplasia
    relationship: RECAPITULATES
    model_scale: TISSUE
    description: Reproduces epidermal acanthosis, papillomatosis and hyperproliferation.
    limitations: Pigmentation was not increased; this is not a complete reproduction of human acanthosis nigricans.
    evidence:
    - reference: PMID:22585574
      reference_title: p38 Inhibition ameliorates skin and skull abnormalities in Fgfr2 Beare-Stevenson mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Histologically, the skin of E16.5, P0, and P5 Fgfr2+/Y394C mice displayed cutis gyrata, epidermal acanthosis, and papillomatosis (Figure 2, A–D).
      explanation: Mouse tissue histology supports the epidermal phenotype.
  - target: Cranial Suture Osteogenic Acceleration
    relationship: RECAPITULATES
    model_scale: TISSUE
    description: Shows increased osteogenic differentiation at coronal sutures.
    limitations: The model carries one recurrent allele and does not establish equivalent effects for every reported FGFR2 variant.
    evidence:
    - reference: PMID:22585574
      reference_title: p38 Inhibition ameliorates skin and skull abnormalities in Fgfr2 Beare-Stevenson mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: These data indicated increased osteogenic differentiation as well as abnormal bone growth at the coronal suture in Fgfr2+/Y394 mice.
      explanation: ALP, Runx2 and osteonectin observations support increased differentiation; the source omits the final C in this genotype occurrence.
  - target: Tracheal Cartilage Ring Fusion
    relationship: FAILS_TO_RECAPITULATE
    model_scale: TISSUE
    description: No tracheal sleeves were detected in the newborn Y394C sample in the later comparative study.
    limitations: Whole-mount morphology included five newborn Y394C mice; low-frequency or later abnormalities cannot be excluded.
    evidence:
    - reference: PMID:32886384
      reference_title: Genotype-Phenotype Correlation of Tracheal Cartilaginous Sleeves and Fgfr2 Mutations in Mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Though TCS has been seen in the human FGFR2Y375C variant, our results suggest that they are not present or are present at low frequency in the mouse model.
      explanation: Directly states the human-model mismatch.
  evidence:
  - reference: PMID:22585574
    reference_title: p38 Inhibition ameliorates skin and skull abnormalities in Fgfr2 Beare-Stevenson mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: with age the mutants showed reduced growth and early death, usually within 2 weeks
    explanation: The initial model study records growth and survival limitations.
  - reference: PMID:22585574
    reference_title: p38 Inhibition ameliorates skin and skull abnormalities in Fgfr2 Beare-Stevenson mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: The SB203580 treatment did not improve the survival rate of Fgfr2+/Y394C mice
    explanation: The tested regimen did not improve survival.
experimental_models:
- name: RCS chondrocytes expressing human FGFR2 Y375C
  experimental_model_type: CELL_LINE
  publication: PMID:22585574
  description: Rat chondrosarcoma cells transfected with wild-type or mutant human FGFR2; receptor and FRS2 phosphorylation were measured.
  modeled_mechanisms:
  - target: Ligand-Independent FGFR2 Activation
    relationship: MEASURES
    model_scale: MOLECULAR
    description: Measures increased phosphorylation with the human disease allele.
    limitations: Heterologous overexpression in a tumor-derived rat cell line does not reproduce endogenous expression in human skin or cranial sutures.
    evidence:
    - reference: PMID:22585574
      reference_title: p38 Inhibition ameliorates skin and skull abnormalities in Fgfr2 Beare-Stevenson mice.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Our results showed constitutive activation of FGFR2 receptor and FRS2, a major FGFR downstream mediator (52), in rat chondrosarcoma (RCS) chondrocytes transfected with human FGFR2 Y375C as compared with WT FGFR2 (Figure 4A).
      explanation: Direct receptor-signaling measurements in cells expressing the human disease allele.
  evidence:
  - reference: PMID:22585574
    reference_title: p38 Inhibition ameliorates skin and skull abnormalities in Fgfr2 Beare-Stevenson mice.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Our results showed constitutive activation of FGFR2 receptor and FRS2, a major FGFR downstream mediator (52), in rat chondrosarcoma (RCS) chondrocytes transfected with human FGFR2 Y375C as compared with WT FGFR2 (Figure 4A).
    explanation: Direct receptor-signaling measurements in cells expressing the human disease allele.
- name: Primary keratinocytes from Fgfr2 Y394C mice
  experimental_model_type: PRIMARY_CELL_CULTURE
  publication: PMID:22585574
  description: Mouse-derived epidermal keratinocytes used to assess FGFR2 phosphorylation without added FGF ligand.
  modeled_mechanisms:
  - target: Ligand-Independent FGFR2 Activation
    relationship: MEASURES
    model_scale: MOLECULAR
    description: Measures receptor activation in cells bearing the knock-in allele.
    limitations: Mouse-derived culture is informative about ligand-independent signaling, not human clinical efficacy.
    evidence:
    - reference: PMID:22585574
      reference_title: p38 Inhibition ameliorates skin and skull abnormalities in Fgfr2 Beare-Stevenson mice.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: We confirmed this result in vivo by demonstrating increased phosphorylation of FGFR2 in epidermal keratinocytes derived from our Fgfr2+/Y394C mice without the addition of FGF ligand as compared with that of controls (Supplemental Figure 4), indicating that the Y394C mutation causes constitutive or ligand-independent activation of the receptor.
      explanation: Mouse-derived keratinocytes support ligand-independent activation.
  evidence:
  - reference: PMID:22585574
    reference_title: p38 Inhibition ameliorates skin and skull abnormalities in Fgfr2 Beare-Stevenson mice.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We confirmed this result in vivo by demonstrating increased phosphorylation of FGFR2 in epidermal keratinocytes derived from our Fgfr2+/Y394C mice without the addition of FGF ligand as compared with that of controls (Supplemental Figure 4), indicating that the Y394C mutation causes constitutive or ligand-independent activation of the receptor.
    explanation: Mouse-derived keratinocytes support ligand-independent activation.
histopathology:
- name: Intestinal fibroblast proliferation and smooth-muscle thickening
  description: In one p.Tyr375Cys autopsy case, jejunal tissue showed fibroblast proliferation from the submucosa into muscularis and thickened smooth muscle. A contribution to dysmotility was proposed, but recurrent infection, malnutrition and altered perfusion were potential secondary contributors.
  evidence:
  - reference: PMID:41882888
    reference_title: An Autopsy Case of Beare-Stevenson Cutis Gyrata Syndrome Presenting with an Extremely Short Small Intestine.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Fibroblast proliferation was observed extending from the submucosal layer to the muscularis, accompanied by marked thick- ening of the smooth muscle.
    explanation: The figure legend describes the tissue finding; causation and generalizability remain uncertain.
- name: Reduced neuronal density and thin superficial myelin
  description: The same autopsy case showed reduced neuronal density and a thin myelin sheath in the superficial brain layer. This isolated histologic observation does not establish a universal primary neurodevelopmental mechanism.
  evidence:
  - reference: PMID:41882888
    reference_title: An Autopsy Case of Beare-Stevenson Cutis Gyrata Syndrome Presenting with an Extremely Short Small Intestine.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The brain exhibited hypertrophy, characterized by a reduced neural density and a thin myelin sheath in the superficial layer.
    explanation: Direct autopsy observation in a single severely ill child.
differential_diagnoses:
- name: Crouzon syndrome
  disease_term:
    preferred_term: Crouzon syndrome
    term:
      id: MONDO:0007405
      label: Crouzon syndrome
  description: Craniosynostosis, proptosis and midface retrusion overlap with BSS, including prenatal cloverleaf presentations.
  distinguishing_features:
  - BSS characteristically combines cutis gyrata with umbilical and anogenital findings; skin redundancy can also occur in some Crouzon genotypes, so it is not an absolute discriminator.
  - Detailed phenotyping and molecular testing are needed because the craniofacial appearances overlap.
  evidence:
  - reference: PMID:25706251
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Cloverleaf skull was identified prenatally in one patient, with initial concern for Crouzon syndrome.
    explanation: A concrete instance of the prenatal misassignment this gap concerns.
    reference_title: 'Beare-Stevenson syndrome: two new patients, including a novel finding of tracheal cartilaginous sleeve.'
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1455/pdf/Bookshelf_NBK1455.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1455/pdf/Bookshelf_NBK1455.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Linear skin rugations, deep creases, and redundant scalp skin (similar to those seen in Beare-Stevenson cutis gyrata syndrome) were reported
    explanation: The Crouzon section documents skin overlap, limiting claims that skin folds alone establish BSS.
- name: Pfeiffer syndrome
  disease_term:
    preferred_term: Pfeiffer syndrome
    term:
      id: MONDO:0007043
      label: Pfeiffer syndrome
  description: Severe craniosynostosis, midface hypoplasia, airway abnormalities and broad digits can resemble BSS.
  distinguishing_features:
  - Cutis gyrata may be inconspicuous in infancy; a p.Tyr375Cys child initially suspected to have Pfeiffer syndrome was reassigned to BSS after genetic testing.
  evidence:
  - reference: PMID:41112086
    reference_title: 'Anesthetic Management of Progressive Deformity of Tracheal Cartilaginous Sleeve in a Pediatric Patient With Beare-Stevenson Syndrome: A Case Report.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: This patient was initially suspected to have Pfeiffer syndrome from her clinical features because cutis gyrata (which is indicative of BSS) was not apparent in infancy.
    explanation: A molecularly confirmed case demonstrates the clinical diagnostic overlap.

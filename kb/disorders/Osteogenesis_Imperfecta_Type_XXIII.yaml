name: Osteogenesis Imperfecta Type XXIII
synonyms:
- osteogenesis imperfecta, type 23
- OI23
- PHLDB1-related osteogenesis imperfecta
creation_date: "2026-06-30T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: Osteogenesis imperfecta, type 23
  term:
    id: MONDO:0957988
    label: osteogenesis imperfecta, type 23
description: >-
  Osteogenesis imperfecta type XXIII (OI type XXIII; OMIM 620639) is an
  ultra-rare autosomal recessive brittle bone disorder caused by biallelic
  loss-of-function frameshift variants in PHLDB1, encoding pleckstrin
  homology-like domain family B member 1. First defined in five affected
  children from two unrelated families, it manifests as a distinctive mild-type
  osteogenesis imperfecta with recurrent fractures and/or osteopenia,
  platyspondyly, short and bowed long bones, and widened metaphyses. A hallmark
  clinical feature is spontaneous regression of the metaphyseal and vertebral
  changes after early childhood and cessation of fractures under bisphosphonate
  therapy. Patient blood and dermal fibroblasts show reduced PHLDB1 transcript
  levels and complete loss of PHLDB1 protein, establishing PHLDB1 deficiency as
  the proximal molecular lesion; although PHLDB1 has a reported normal role in
  insulin-dependent Akt phosphorylation, signaling in patient bone cells has not
  been tested and the downstream pathway linking PHLDB1 loss to skeletal
  fragility remains to be defined.

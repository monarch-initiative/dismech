- name: Orthopedic Surgery and Intramedullary Rodding
  description: >-
    Intramedullary rodding and corrective orthopedic surgery are standard
    management options for fracture-prone, deformed long bones across OI; they
    may be considered in OI type XXIII for symptomatic deformity, though the
    mild, regressive course of this type often limits the need for surgery.

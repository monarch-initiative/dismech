discussions:
- discussion_id: gap_oi23_phldb1_bone_mechanism_undefined
  prompt: >-
    By what molecular mechanism does biallelic loss of PHLDB1 (pleckstrin
    homology-like domain family B member 1) produce brittle bone with regressive
    spondylometaphyseal changes? The only reported cellular role of PHLDB1 is in
    insulin-dependent Akt phosphorylation, and PHLDB1 has been localized to
    laminin-5-containing cell-adhesion sites, but neither observation has been
    causally connected to osteoblast function, type I collagen matrix production,
    or bone mineralization. Is the skeletal fragility driven by an
    osteoblast-autonomous PI3K/Akt signaling deficit, by an adhesion/matrix
    defect, by ER-stress/proteostasis dysregulation (the convergent cellular
    pathology proposed across OI subtypes), or by another pathway — and what
    explains the distinctive regression of the metaphyseal and vertebral changes
    after early childhood?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Biallelic PHLDB1 Loss-of-Function Eliminates PHLDB1 Protein
  - pathophysiology#Defective Bone Formation and Skeletal Fragility
  rationale: >-
    OI type XXIII is defined by a single report of five children from two
    unrelated families (PMID:36543534); that report establishes causation
    (biallelic PHLDB1 frameshift alleles, reduced PHLDB1 mRNA, and loss of PHLDB1
    protein in patient fibroblasts) but explicitly leaves the intervening
    mechanism open, noting only PHLDB1's reported role in insulin-dependent Akt
    phosphorylation. Consequently the entry models the pathograph with a proximal
    lesion node and a downstream bone-phenotype node but no committed
    intermediate mechanistic node. No published functional study has connected
    PHLDB1 loss to a specific osteoblast or collagen-matrix pathway, so the
    intermediate step remains an explicit open question.
  proposed_experiments:
  - experiment_id: exp_oi23_phldb1_ipsc_osteoblast_akt
    name: >-
      PHLDB1-null iPSC-derived osteoblast PI3K/Akt signaling and mineralization
      assay
    description: >-
      Differentiate osteoblasts from PHLDB1-null (patient-derived or gene-edited)
      and isogenic-control human iPSCs and quantify insulin/IGF-1-stimulated Akt
      phosphorylation, osteoblast-differentiation markers (RUNX2, SP7, ALPL),
      type I collagen (COL1A1) secretion, and in-vitro matrix mineralization.
      This tests whether the reported PHLDB1 role in insulin-dependent Akt
      phosphorylation is the osteoblast-autonomous mechanism linking PHLDB1 loss
      to defective bone formation.
    experiment_type:
      preferred_term: iPSC-derived osteoblast perturbation assay
    model_systems:
    - name: PHLDB1-null human iPSC-derived osteoblast
      description: >-
        Osteoblasts differentiated from patient-derived or CRISPR-edited human
        iPSCs lacking PHLDB1, compared to isogenic PHLDB1-intact controls.
      experimental_model_type: IPSC_DERIVED_MODEL
  - experiment_id: exp_oi23_phldb1_er_stress_proteostasis
    name: >-
      ER-stress and collagen-proteostasis profiling of PHLDB1-deficient bone
      cells
    description: >-
      Assay unfolded-protein-response activation (BiP/HSPA5, ATF4, CHOP,
      spliced XBP1), intracellular procollagen retention, and
      secreted-versus-retained type I collagen in PHLDB1-deficient
      osteoblasts/fibroblasts versus controls, to test whether OI type XXIII
      shares the ER-stress/disrupted-proteostasis convergent cellular pathology
      proposed across collagen and non-collagen OI subtypes, rather than acting
      solely through Akt signaling.
    experiment_type:
      preferred_term: ER-stress and proteostasis assay
    model_systems:
    - name: PHLDB1-deficient patient skin fibroblast
      description: >-
        Cultured dermal fibroblasts from OI type XXIII probands (in which reduced
        PHLDB1 mRNA and loss of PHLDB1 protein were already documented), used to
        profile ER-stress and collagen-secretion phenotypes.
      experimental_model_type: PRIMARY_CELL_CULTURE
  notes: >-
    Resolving this gap would clarify whether OI type XXIII acts via an
    osteoblast PI3K/Akt or focal-adhesion signaling defect or converges on the
    ER-stress and procollagen-trafficking pathways shared by other recessive OI
    subtypes.
genetic:
- name: PHLDB1 Loss-of-Function (Frameshift) Variants
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: PHLDB1 (pleckstrin homology-like domain family B member 1)
    term:
      id: hgnc:23697
      label: PHLDB1
  notes: >-
    OI type XXIII is caused by biallelic loss-of-function variants in PHLDB1.
    The defining report identified two frameshift alleles
    (NM_001144758.3:c.2392dup and NM_001144758.3:c.2690_2693del), each segregating
    as homozygous/biallelic within one of two unrelated families, with
    heterozygous unaffected parents. PHLDB1 is the only gene associated with this
    OI type to date and the molecular consequence is loss of PHLDB1 protein.
  evidence:
  - reference: PMID:36543534
    reference_title: "Biallelic frameshift variants in PHLDB1 cause mild-type osteogenesis imperfecta with regressive spondylometaphyseal changes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified biallelic NM_001144758.3:c.2392dup and
      NM_001144758.3:c.2690_2693del pathogenic variants in PHLDB1 in the
      affected patients, respectively, in the families; parents were
      heterozygous for these variants.
    explanation: >-
      Identifies the causative biallelic PHLDB1 frameshift variants and their
      recessive segregation defining OI type XXIII.

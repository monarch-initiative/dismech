pathophysiology:
- name: Biallelic PHLDB1 Loss-of-Function Eliminates PHLDB1 Protein
  description: >-
    PHLDB1 encodes pleckstrin homology-like domain family B member 1, a protein
    with a reported normal role in insulin-dependent Akt phosphorylation that
    has not yet been tested in OI type XXIII patient cells. In OI type XXIII,
    biallelic frameshift variants reduce PHLDB1 mRNA expression in blood and
    skin fibroblasts and abolish PHLDB1 protein on western blot of cultured
    patient fibroblasts. This loss of PHLDB1 is the proximal molecular lesion;
    the downstream pathway by which it impairs bone formation and matrix
    strength is not yet established.

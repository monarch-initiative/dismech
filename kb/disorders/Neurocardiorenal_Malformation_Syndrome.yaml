name: Neurocardiorenal Malformation Syndrome
category: Mendelian
creation_date: "2026-10-14T17:36:29Z"
synonyms:
- NCRMS
- TM2D3-related neurodevelopmental disorder
description: >-
  Neurocardiorenal malformation syndrome is an autosomal recessive syndromic
  neurodevelopmental disorder caused by biallelic variants in TM2D3, which encodes a
  transmembrane protein of the conserved TM2 domain family. The defining report describes
  four affected individuals from four unrelated families with microcephaly, severe global
  developmental delay with absent speech, autistic features, heart malformation and
  dysmorphic facial features. The OMIM synopsis of the same report adds renal
  malformations, which is where the name comes from.

  Two mechanistic strands are recorded, and they rest on different kinds of evidence. The
  one demonstrated in patient material is endoplasmic reticulum (ER) dysfunction: TM2D3 is an
  ER protein, and patient fibroblasts and TM2D3-knockout cells show a dysregulated ER-stress
  response, ER swelling, secondary mitochondrial ultrastructural changes, and altered
  expression of extracellular matrix genes. The second strand is Notch signaling. The fly
  orthologue almondex is a classical maternal-effect neurogenic gene required for Notch
  signaling, and Tm2d3-deficient mouse cells present less Notch1 and Notch2 at the cell
  surface. Whether reduced Notch signaling contributes to the human malformations has not
  been tested in patients, so it is carried as an emerging hypothesis rather than as the
  disease mechanism.

mechanistic_hypotheses:
- hypothesis_group_id: tm2d3_notch_surface_presentation
  hypothesis_label: >-
    Loss of TM2D3 reduces Notch receptor surface presentation and so Notch signaling during
    development
  status: EMERGING
  description: >-
    TM2D3 is the mammalian orthologue of Drosophila almondex, a neurogenic gene whose loss
    disrupts Notch-mediated lateral inhibition, and TM2D3 promotes surface expression of
    Notch1. Notch signaling is required for neural, cardiac and renal development, so reduced
    Notch signaling is a plausible contributor to the multi-organ malformations. The support
    comes entirely from fly genetics and mouse cultured cells. Notch activity has not been
    measured in patient cells, and the defining clinical report attributes the disease to ER
    dysfunction instead. Edges in this group opt in via hypothesis_groups.
  evidence:
  - reference: PMID:38016980
    reference_title: "TM2D3, a mammalian homologue of Drosophila neurogenic gene product Almondex, regulates surface presentation of Notch receptors."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These results indicate that TM2D3 is an element involved in Notch signaling through the surface presentation."
    explanation: The authors' conclusion tying TM2D3 to Notch signaling through receptor surface presentation.

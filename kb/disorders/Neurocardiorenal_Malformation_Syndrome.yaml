notes: >-
  Scope: curated as a DISEASE. One gene, one reported series, and no MONDO descendants.

  Several clinical findings are deliberately left out of phenotypes. The defining paper
  (PMID:40449487) is not open access, and both the PubMed and DOI routes return only its
  abstract, so nothing beyond the abstract can carry a verified snippet. The full text is
  readable at PMC12256896 but is not open access, so the fetcher cannot cache it. The
  deep-research report (research/Neurocardiorenal_Malformation_Syndrome-deep-research-claude_code.md)
  read the full-text Table 1 and reports the following.
  These figures are unverified here and recorded only so a curator with full-text access
  knows what to add: renal anomaly in 3 of 4 (horseshoe kidney in 2, mild pyelocaliceal
  dilatation in 1); congenital heart defect in 4 of 4 (ventricular septal defect in 3,
  patent ductus arteriosus with patent foramen ovale, polyvalvular dysplasia, and a duplicated
  vena cava); ocular findings in 3 of 4 (hypermetropia, strabismus, legal blindness in one);
  seizures in 2
  of 4; structural brain anomalies on MRI in 3 of 4 (frontal hypoplasia, abnormal gyration,
  cerebellar vermis hypoplasia); genital anomalies in both males; and prenatal growth
  restriction or polyhydramnios. The renal component, despite giving the disease its name,
  is not in the abstract; MedGen's definition of OMIM:621379 states it.

  For the same reason no frequency is given on any phenotype: the abstract lists shared
  features without saying how many of the four individuals had each.

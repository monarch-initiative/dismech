    abundant in the central nervous system, and in SNB75 cells it localizes to the
    endoplasmic reticulum. Loss of function is inferred from the similarity of patient
    fibroblasts to TM2D3-knockout cells. The missense alleles may be hypomorphic rather than
    null; that distinction is not resolved in the abstract.

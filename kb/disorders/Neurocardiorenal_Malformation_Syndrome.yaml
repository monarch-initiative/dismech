animal_models:
- name: almondex loss-of-function Drosophila
  species: Drosophila melanogaster
  genotype: amx null (and triple TM2D knockout)
  publication: PMID:34905536
  description: >-
    Embryos from amx-null mothers have the maternal-effect neurogenic phenotype of failed
    Notch signaling. Adult amx loss shortens lifespan, with progressive motor and
    electrophysiological defects.
  modeled_mechanisms:
  - target: Reduced Notch Receptor Surface Presentation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: CELLULAR
    description: >-
      The neurogenic phenotype and impaired Notch extracellular domain and Delta endocytosis
      read out the Notch defect directly.
    limitations: >-
      The fly phenotype is maternal-effect, arising in the early embryo, which has no
      counterpart in a recessive human disorder caused by zygotic loss. The model is a null,
      whereas the recurrent human allele is missense. PMID:34905536 reports no fly phenotype
      corresponding to the human cardiac or renal malformations or to microcephaly, and does
      not examine the ER and mitochondrial findings of the human disease.
    evidence:
    - reference: PMID:34905536
      reference_title: "TM2D genes regulate Notch signaling and neuronal function in Drosophila."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We knocked-out all three TM2D genes (almondex, CG11103/amaretto, CG10795/biscotti) in Drosophila and found that they share the same maternal-effect neurogenic defect."
      explanation: >-
        The loss-of-function fly shows the neurogenic phenotype that reads out failed Notch
        signaling, which is what this link claims.
discussions:
- discussion_id: ncrms_er_versus_notch_mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - "pathophysiology#Dysregulated Endoplasmic Reticulum Stress Response"
  - "pathophysiology#Reduced Notch Receptor Surface Presentation"
  prompt: >-
    Do the malformations of neurocardiorenal malformation syndrome arise from the ER-stress
    defect seen in patient fibroblasts, from reduced Notch signaling, or from both?
  rationale: >-
    The two literatures on TM2D3 have not met. The disease report measured ER stress,
    ultrastructure and transcription in patient fibroblasts and does not report Notch activity
    in its abstract. The Notch work used mouse null cells and flies and has no patient
    material. Notch receptors are themselves transmembrane proteins that pass through the ER,
    so the two explanations may be one, with reduced surface presentation a consequence of
    the ER defect, but that has not been tested. No phenotype in this entry is causally
    connected for this reason.
  proposed_experiments:
  - experiment_id: ncrms_patient_cell_notch_surface
    name: Notch surface presentation and target-gene expression in patient cells
    description: >-
      Measure surface Notch1 and Notch2 and HES/HEY target expression in p.Gly168Asp
      patient fibroblasts or iPSC-derived neural progenitors against parental controls, with
      and without ER-stress induction.
    readouts:
    - name: Surface Notch1 in patient cells
      target: "pathophysiology#Reduced Notch Receptor Surface Presentation"
      direction: DECREASED
      interpretation: >-
        A reduction in patient cells would carry the mouse finding into the human disease;
        no change would argue that the ER defect acts through other cargo.

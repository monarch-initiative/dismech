notes: >-
  Curated as part of filling ISDS Nosology group 12 (Spondylometaphyseal
  dysplasias), which had no dismech entries. This disorder is NOS 12-0060 in the 2023
  revision and was one of the two group-12 members missing from dismech's own
  description of the group. The gene-disease relationship is replicated — twelve
  patients across several families, plus an unusually complete mouse recapitulation —
  though the deep mechanistic work still rests on the founding 2014 family and its
  single G287V allele. The fit with group 12 remains imperfect, since the published
  skeletal phenotype is a generalised chondrodysplasia rather than a documented
  spondylometaphyseal pattern and MONDO gives the class no skeletal parent. The
  classification follows the nosology as a transcription, per the schema's own
  guidance that this axis is a transcription of an expert committee's placements and
  not an inference engine.

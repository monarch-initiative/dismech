synonyms:
- Nivelon-Nivelon-Mabille syndrome
- Chondrodysplasia-disorder of sex development syndrome
- Chondrodysplasia with 46,XY gonadal dysgenesis
- HHAT-related chondrodysplasia
- Syndromic 46,XY disorder of sex development with chondrodysplasia
parents:
- Skeletal Dysplasia
- 46,XY Disorder of Sex Development
classifications:
  isds_skeletal_category:
  - classification_value: spondylometaphyseal_dysplasias
    notes: >-
      ISDS Nosology of Genetic Skeletal Disorders, 2023 revision (Unger et al.,
      PMID:36779427), Table 1 group 12 "Spondylometaphyseal dysplasias (SMD)", entry
      NOS 12-0060, listed as "Chondrodysplasia-pseudohermaphroditism syndrome,
      HHAT-related" (AR, HHAT, MIM 600092), with the nosology's own note "Also known
      as Nivelon-Nivelon-Mabille syndrome (sic)". This is one of the two group-12
      members missing from dismech's own description of the group before this
      curation, the other being NOS 12-0050 (PLCB3). The committee's placement is
      followed here as a transcription, not endorsed as a radiographic judgement: the
      published skeletal description is of a generalised chondrodysplasia with
      micromelia and brachydactyly rather than of a documented
      vertebral-plus-metaphyseal pattern, and MONDO does not place MONDO:0010814
      under spondylometaphyseal dysplasia or under any skeletal dysplasia parent at
      all.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  rate_per_100000: 0.0
  notes: >-
    Twelve patients are on record: eight reported up to 2025, plus four new patients
    from two unrelated families in a 2025 series. The founding 2014 report described
    two affected siblings of one non-consanguineous Caucasian couple and noted that
    an explicit search through large skeletal-disorder and DSD cohorts had found no
    second family — a statement about ascertainment in 2014, since superseded.
    rate_per_100000 is recorded as 0.0 only to mark that the true rate is far below
    the resolution of any published survey.
  evidence:
  - reference: PMID:24784881
    reference_title: "Loss of function mutation in the palmitoyl-transferase HHAT leads to syndromic 46,XY disorder of sex development by impeding Hedgehog protein palmitoylation and signaling."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Despite an extensive search through large cohorts of patients suffering from
      skeletal disorders and/or DSD, we have not been able to identify a second
      familial case with a pathogenic mutation in the HHAT locus.
    explanation: >-
      Documents the deliberate, unsuccessful 2014 search for further cases. Recorded
      as the ascertainment state at gene discovery, not as the current caseload —
      further families were reported subsequently.
  - reference: PMID:40326711
    reference_title: Four New Patients of HHAT-Related Multiple Congenital Anomalies Syndrome (Nivelon-Nivelon-Mabille Syndrome) and a Comprehensive Literature Review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To date, only eight patients with NNMS have been reported in the literature. In
      this study, four new patients from two unrelated families were presented
    explanation: >-
      Gives the current caseload — twelve patients across multiple families — which
      supersedes the founding report's single-family framing.
inheritance:
- name: Autosomal Recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    The disorder is autosomal recessive. Two siblings of a healthy,
    non-consanguineous Caucasian couple are affected; the HHAT variant is homozygous
    in the patient and heterozygous in both parents. Recessive inheritance without
    consanguinity is unusual for an ultra-rare allele and is part of why the
    population frequency question was pursued.
  evidence:
  - reference: PMID:24784881
    reference_title: "Loss of function mutation in the palmitoyl-transferase HHAT leads to syndromic 46,XY disorder of sex development by impeding Hedgehog protein palmitoylation and signaling."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      homozygous in the patient and heterozygous in the parents
    explanation: Segregation consistent with autosomal recessive inheritance.
  - reference: PMID:24784881
    reference_title: "Loss of function mutation in the palmitoyl-transferase HHAT leads to syndromic 46,XY disorder of sex development by impeding Hedgehog protein palmitoylation and signaling."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patient familial history indicates that the patient and sibling were
      conceived by a healthy, non-consanguineous caucasian couple
    explanation: >-
      Establishes the non-consanguineous family structure, which makes the rarity of
      the allele the harder question.
genetic:
- name: Homozygous HHAT p.Gly287Val
  gene_term:
    preferred_term: HHAT
    term:
      id: hgnc:18270
      label: HHAT
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    A homozygous G287V missense variant in HHAT at 1q32. The substituted glycine is
    highly conserved and lies in the membrane bound O-acyltransferase (MBOAT) domain
    that carries the catalytic activity. The variant is absent from dbSNP and was the
    only variant surviving an autosomal recessive filtering model in the exome. Note
    that the paper's own variant table reports the same change against transcript
    NM_001170564.1 as c.449G>T p.(Gly150Val), so the residue number depends on the
    isoform numbering used.
  evidence:
  - reference: PMID:24784881
    reference_title: "Loss of function mutation in the palmitoyl-transferase HHAT leads to syndromic 46,XY disorder of sex development by impeding Hedgehog protein palmitoylation and signaling."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Analysis of WES results using an autosomal recessive model revealed a
      homozygous G287V missense mutation in the hedgehog acyl-transferase ( HHAT)
      gene.
    explanation: The gene-discovery result and the causal allele.
  - reference: PMID:24784881
    reference_title: "Loss of function mutation in the palmitoyl-transferase HHAT leads to syndromic 46,XY disorder of sex development by impeding Hedgehog protein palmitoylation and signaling."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The Gly287 residue is a highly conserved amino acid which, when mutated, leads
      to a non-functional HHAT protein that lacks the ability to palmitoylate
      hedgehog proteins.
    explanation: >-
      Establishes both the conservation of the residue and the functional consequence
      of substituting it.
  - reference: PMID:40326711
    reference_title: Four New Patients of HHAT-Related Multiple Congenital Anomalies Syndrome (Nivelon-Nivelon-Mabille Syndrome) and a Comprehensive Literature Review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      whole exome analysis revealed three novel variants of the HHAT gene
    explanation: >-
      Three further pathogenic HHAT variants beyond G287V, establishing an allelic
      series rather than a single recurrent allele.
pathophysiology:
- name: Biallelic HHAT MBOAT-Domain Variant
  biological_scale: MOLECULAR
  description: >-
    A conserved glycine in the membrane bound O-acyltransferase domain of hedgehog
    acyltransferase is replaced by valine, in the homozygous state.
  genes:
  - preferred_term: HHAT
    term:
      id: hgnc:18270
      label: HHAT
  evidence:
  - reference: PMID:24784881
    reference_title: "Loss of function mutation in the palmitoyl-transferase HHAT leads to syndromic 46,XY disorder of sex development by impeding Hedgehog protein palmitoylation and signaling."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This mutation occurred in the conserved membrane bound O-acyltransferase
      (MBOAT) domain
    explanation: Localises the variant to the catalytic domain of the enzyme.
  downstream:
  - target: Loss of Hedgehog Acyltransferase Activity
    causal_link_type: DIRECT
    description: >-
      The mutant protein cannot transfer palmitate onto hedgehog ligands. This was
      tested experimentally for both Desert hedgehog and Sonic hedgehog, the two
      ligands whose target tissues account for the syndrome.
    evidence:
    - reference: PMID:24784881
      reference_title: "Loss of function mutation in the palmitoyl-transferase HHAT leads to syndromic 46,XY disorder of sex development by impeding Hedgehog protein palmitoylation and signaling."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        experimentally disrupted the ability of HHAT to palmitoylate Hh proteins such
        as DHH and SHH
      explanation: >-
        Direct functional demonstration on both relevant ligands, not an inference
        from the domain annotation.
- name: Loss of Hedgehog Acyltransferase Activity
  biological_scale: MOLECULAR
  description: >-
    HHAT is an endoplasmic reticulum enzyme that catalyses transfer of palmitate onto
    hedgehog ligands. Loss of its activity leaves the ligands unpalmitoylated. This is
    the single molecular lesion from which every organ manifestation of the syndrome
    follows.
  molecular_functions:
  - preferred_term: palmitoyltransferase activity
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0016409
      label: palmitoyltransferase activity
  cellular_components:
  - preferred_term: endoplasmic reticulum
    term:
      id: GO:0005783
      label: endoplasmic reticulum
  evidence:
  - reference: PMID:24784881
    reference_title: "Loss of function mutation in the palmitoyl-transferase HHAT leads to syndromic 46,XY disorder of sex development by impeding Hedgehog protein palmitoylation and signaling."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      This gene encodes an endoplasmic reticulum protein, HHAT, which catalyzes the
      transfer of palmitate onto hedgehog ligands.
    explanation: Establishes the enzyme's compartment and reaction.
  downstream:
  - target: Unpalmitoylated Hedgehog Ligands with Impaired Long-Range Signaling
    causal_link_type: DIRECT
    description: >-
      Palmitate and cholesterol modification are what allow hedgehog proteins to
      multimerise and signal at a distance, so unpalmitoylated ligand is produced and
      secreted but cannot act as a long-range morphogen.
    evidence:
    - reference: PMID:24784881
      reference_title: "Loss of function mutation in the palmitoyl-transferase HHAT leads to syndromic 46,XY disorder of sex development by impeding Hedgehog protein palmitoylation and signaling."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Post-translational covalent attachment of cholesterol and palmitate to Hh
        proteins are critical for multimerization and long range signaling potency.
      explanation: >-
        States why the loss of a lipid modification, rather than of the ligand itself,
        is sufficient to disrupt patterning.
- name: Unpalmitoylated Hedgehog Ligands with Impaired Long-Range Signaling
  biological_scale: MOLECULAR
  description: >-
    Hedgehog ligands lack the palmitate needed for multimerisation and long-range
    signalling potency. Because HHAT acts on the whole hedgehog family, the deficit
    is simultaneous across Sonic hedgehog in the skeleton and central nervous system
    and Desert hedgehog in the gonad, which is what makes a single enzyme defect
    produce a syndrome spanning otherwise unrelated organs.
  biological_processes:
  - preferred_term: protein palmitoylation
    modifier: DECREASED
    term:
      id: GO:0018345
      label: protein palmitoylation
  - preferred_term: smoothened signaling pathway
    modifier: DECREASED
    term:
      id: GO:0007224
      label: smoothened signaling pathway
  evidence:
  - reference: PMID:24784881
    reference_title: "Loss of function mutation in the palmitoyl-transferase HHAT leads to syndromic 46,XY disorder of sex development by impeding Hedgehog protein palmitoylation and signaling."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Overall, these data emphasize the essential role played by post- translational
      lipid modification of Hh ligands in mediating patterning of many aspects of the
      body, including the testis, limbs, axial skeleton and the central nervous
      system.
    explanation: >-
      The sentence continues to name lipid modification of hedgehog ligands as
      mediating patterning of the testis, limbs, axial skeleton, and central nervous
      system — the four affected systems of this syndrome.
  downstream:
  - target: Testicular Dysgenesis
    causal_link_type: DIRECT
    description: >-
      Desert hedgehog from Sertoli cells is the ligand that drives fetal Leydig cell
      differentiation and proper testis cord formation. HHAT is expressed in Sertoli
      cells, the unique source of Desert hedgehog in the testis.
    evidence:
    - reference: PMID:24784881
      reference_title: "Loss of function mutation in the palmitoyl-transferase HHAT leads to syndromic 46,XY disorder of sex development by impeding Hedgehog protein palmitoylation and signaling."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In the developing testis, HHAT is not required for Sertoli cell commitment
        but plays a role in proper testis cord formation and the differentiation of
        fetal Leydig cells.
      explanation: >-
        Places the requirement precisely: Sertoli cell fate is intact, and the defect
        is in cord formation and Leydig differentiation downstream of it.
  - target: Skeletal and Neurodevelopmental Patterning Defects
    causal_link_type: DIRECT
    description: >-
      Sonic hedgehog patterns the limb, the axial skeleton, and the forebrain and
      cerebellum, so loss of its long-range activity accounts for the
      chondrodysplasia, the micromelia, the microcephaly, and the cerebellar vermis
      hypoplasia together.
    evidence:
    - reference: PMID:24784881
      reference_title: "Loss of function mutation in the palmitoyl-transferase HHAT leads to syndromic 46,XY disorder of sex development by impeding Hedgehog protein palmitoylation and signaling."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Hhat loss of function in mice recapitulates most of the testicular, skeletal,
        neuronal and growth defects observed in humans
      explanation: >-
        The mouse null reproduces the skeletal and neuronal arms, which is the
        strongest support for attributing them to the same enzymatic lesion.
- name: Testicular Dysgenesis
  biological_scale: TISSUE
  description: >-
    Complete gonadal dysgenesis in a 46,XY individual. Histology showed persistent
    Wolffian structures including epididymal remnants; the left gonad contained
    inclusions of immature testicular tissue composed of dysplastic immature
    seminiferous tubules within a dense interstitium containing markedly fewer
    CYP11A1-expressing steroidogenic cells than normal adult testis, and the right
    gonad was hypoplastic and largely fibroblastic and endothelial.
  cell_types:
  - preferred_term: Sertoli cell
    term:
      id: CL:0000216
      label: Sertoli cell
  - preferred_term: Leydig cell
    term:
      id: CL:0000178
      label: Leydig cell
  evidence:
  - reference: PMID:24784881
    reference_title: "Loss of function mutation in the palmitoyl-transferase HHAT leads to syndromic 46,XY disorder of sex development by impeding Hedgehog protein palmitoylation and signaling."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The left gonad contained large inclusions of immature testicular tissue mainly
      composed of dysplastic immature seminiferous tubules
    explanation: The histological description of the dysgenetic gonad.
  - reference: PMID:24784881
    reference_title: "Loss of function mutation in the palmitoyl-transferase HHAT leads to syndromic 46,XY disorder of sex development by impeding Hedgehog protein palmitoylation and signaling."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The right gonad was hypoplastic and largely composed of fibroblastic and
      endothelial tissues.
    explanation: Documents the contralateral gonadal histology.
  downstream:
  - target: Female External Genitalia and Absent Puberty in a 46,XY Individual
    causal_link_type: DIRECT
    description: >-
      A dysgenetic testis produces neither the androgen needed to masculinise the
      external genitalia nor the anti-Mullerian hormone needed to regress the
      Mullerian ducts, and cannot support puberty.
    evidence:
    - reference: PMID:24784881
      reference_title: "Loss of function mutation in the palmitoyl-transferase HHAT leads to syndromic 46,XY disorder of sex development by impeding Hedgehog protein palmitoylation and signaling."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        including normal external female genitalia, lack of pubertal development,
        primary amenorrhea
      explanation: The clinical consequences of the gonadal dysgenesis.
  - target: 46,XY Complete Gonadal Dysgenesis
    causal_link_type: DIRECT
    description: >-
      Failure of testis cord formation and fetal Leydig differentiation is the
      gonadal dysgenesis itself, read at the level of the organ.
- name: Female External Genitalia and Absent Puberty in a 46,XY Individual
  biological_scale: ORGANISM
  description: >-
    Normal external female genitalia with a 46,XY karyotype, absent pubertal
    development, primary amenorrhoea, and hypergonadotrophic hypogonadism. The
    disorder of sex development, not the chondrodysplasia, is what the syndrome's
    older name records.
  evidence:
  - reference: PMID:24784881
    reference_title: "Loss of function mutation in the palmitoyl-transferase HHAT leads to syndromic 46,XY disorder of sex development by impeding Hedgehog protein palmitoylation and signaling."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The karyotype was 46,XY but the patient exhibited clinical features of a 46,XY
      DSD with complete gonadal dysgenesis (CGD), including normal external female
      genitalia, lack of pubertal development, primary amenorrhea
    explanation: The full clinical description of the disorder of sex development.
  downstream:
  - target: Primary Amenorrhea
    causal_link_type: DIRECT
    description: >-
      A dysgenetic testis cannot support puberty, so menarche never occurs despite
      normal external female genitalia.
- name: Skeletal and Neurodevelopmental Patterning Defects
  biological_scale: ORGANISM
  description: >-
    Severe dwarfism with generalised chondrodysplasia, a narrow bell-shaped thorax,
    micromelia, and brachydactyly, alongside severe microcephaly with cerebellar
    vermis hypoplasia, hypoplastic irides, and coloboma of both optic discs. Follow-up
    at sixteen years added mild intellectual disability, muscular hypertrophy, and
    myopia. The eye findings are themselves a hedgehog signature: optic disc coloboma
    and iris hypoplasia are the anterior-segment and optic-fissure consequences of
    reduced Sonic hedgehog signalling in the developing eye.
  cell_types:
  - preferred_term: chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  evidence:
  - reference: PMID:24784881
    reference_title: "Loss of function mutation in the palmitoyl-transferase HHAT leads to syndromic 46,XY disorder of sex development by impeding Hedgehog protein palmitoylation and signaling."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The first sibling displayed severe dwarfism with generalized chondrodysplasia,
      a narrow, bell-shaped thorax, micromelia, brachydactyly, severe microcephaly
      with cerebellar vermis hypoplasia, facial anomalies, hypoplastic irides, and
      coloboma of both optic discs.
    explanation: >-
      The full skeletal, neurological, and ocular description, supporting this node
      and the phenotype records derived from it.
  - reference: PMID:40326711
    reference_title: Four New Patients of HHAT-Related Multiple Congenital Anomalies Syndrome (Nivelon-Nivelon-Mabille Syndrome) and a Comprehensive Literature Review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      exhibiting distinct phenotypic features including 46,XY gonadal dysgenesis,
      microcephaly, microphthalmia, ocular coloboma, skeletal dysplasia, and
      cerebellar vermis hypoplasia
    explanation: >-
      Independent confirmation of the core multi-system phenotype in four further
      patients, and the source for the microphthalmia record.
  downstream:
  - target: Generalized Chondrodysplasia with Severe Dwarfism
    causal_link_type: DIRECT
    description: >-
      Sonic hedgehog patterns the limb and axial skeleton; loss of its long-range
      activity produces the generalised chondrodysplasia and the severe dwarfism.
  - target: Micromelia
    causal_link_type: DIRECT
    description: Limb shortening, the appendicular expression of the patterning defect.
  - target: Brachydactyly
    causal_link_type: DIRECT
    description: >-
      Short digits — the distal limb field is among the most Sonic-hedgehog-dependent
      structures in the body.
  - target: Bell-Shaped Thorax
    causal_link_type: DIRECT
    description: A narrow, bell-shaped chest from the axial skeletal involvement.
  - target: Severe Microcephaly
    causal_link_type: DIRECT
    description: >-
      Sonic hedgehog patterns the forebrain, and severe microcephaly is one of the
      cardinal features across all reported patients.
  - target: Cerebellar Vermis Hypoplasia
    causal_link_type: DIRECT
    description: >-
      Hypoplasia of the cerebellar vermis, a hedgehog-dependent structure whose
      granule precursors proliferate under Sonic hedgehog control.
  - target: Mild Intellectual Disability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Identified on follow-up at sixteen years rather than in infancy. Whether it
      follows from the microcephaly, the cerebellar hypoplasia, or something else is
      not established.
  - target: Optic Disc Coloboma
    causal_link_type: DIRECT
    description: >-
      Failure of optic fissure closure, a recognised consequence of deficient Sonic
      hedgehog signalling in the developing eye.
  - target: Iris Hypoplasia
    causal_link_type: DIRECT
    description: The anterior-segment component of the same ocular hedgehog signature.
  - target: Microphthalmia
    causal_link_type: DIRECT
    description: >-
      Small globes, reported in the 2025 four-patient series alongside coloboma;
      hedgehog signalling sets eye-field size as well as optic fissure closure.
  - target: Ptosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Reported for the first time in the 2025 series. No mechanism has been proposed
      and it may reflect ascertainment rather than a distinct developmental route.
  - target: Myopia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Refractive error identified at adolescent follow-up, plausibly secondary to the
      globe and anterior-segment maldevelopment rather than an independent feature.

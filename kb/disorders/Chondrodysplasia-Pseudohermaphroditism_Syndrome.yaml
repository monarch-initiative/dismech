- name: Supportive Skeletal, Developmental and Ophthalmological Care
  description: >-
    No disease-modifying therapy exists. Management is orthopaedic for the
    chondrodysplasia, developmental and educational for the microcephaly and learning
    difficulty, and ophthalmological for the coloboma, iris hypoplasia, and myopia.

name: Chondrodysplasia-Pseudohermaphroditism Syndrome
creation_date: "2026-08-27T00:00:00Z"
category: Mendelian
description: >-
  Chondrodysplasia-pseudohermaphroditism syndrome, also known as
  Nivelon-Nivelon-Mabille syndrome (OMIM #600092), is an ultra-rare autosomal
  recessive disorder combining a generalised chondrodysplasia with 46,XY complete
  gonadal dysgenesis, severe microcephaly with cerebellar vermis hypoplasia, and eye
  anomalies. It is caused by biallelic variants in HHAT, encoding
  hedgehog acyltransferase, an endoplasmic reticulum enzyme that attaches palmitate
  to hedgehog ligands. Palmitoylation, together with cholesterol modification, is
  what allows hedgehog proteins to multimerise and signal over a distance, so the
  disorder is a failure of morphogen range rather than of morphogen production. That
  single lesion explains an otherwise incoherent combination of organs: Sonic
  hedgehog patterns the limb, axial skeleton, and forebrain, while Desert hedgehog
  from Sertoli cells drives fetal Leydig cell differentiation and testis cord
  formation. It is the only entry in ISDS group 12 whose cardinal feature is not
  skeletal, and the case for its skeletal-nosology placement rests on the
  chondrodysplasia rather than on the disorder of sex development. The disorder is no
  longer the single-family observation it was at gene discovery: twelve patients are
  now on record, and a 2025 series of four new patients from two unrelated families
  added microphthalmia, ptosis, and marked visual impairment to the phenotype along
  with three further HHAT variants. The deep functional work, however, still rests on
  the founding family's G287V allele.
disease_term:
  preferred_term: chondrodysplasia-pseudohermaphroditism syndrome

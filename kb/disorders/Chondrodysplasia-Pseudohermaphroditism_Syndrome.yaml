diagnosis:
- name: Recognising the Skeletal-Gonadal Combination
  description: >-
    A chondrodysplasia with microcephaly in a phenotypically female child should
    prompt karyotyping, because the gonadal dysgenesis may not otherwise declare
    itself until puberty fails. In the reported patient the diagnosis of a disorder of
    sex development came alongside a 46,XY karyotype in a child with normal external
    female genitalia.
  evidence:
  - reference: PMID:24784881
    reference_title: "Loss of function mutation in the palmitoyl-transferase HHAT leads to syndromic 46,XY disorder of sex development by impeding Hedgehog protein palmitoylation and signaling."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The karyotype was 46,XY but the patient exhibited clinical features of a 46,XY
      DSD with complete gonadal dysgenesis (CGD), including normal external female
      genitalia, lack of pubertal development, primary amenorrhea
    explanation: >-
      Shows that the karyotype and the external phenotype dissociate, which is why
      karyotyping is the step that reveals the diagnosis.
- name: HHAT Sequencing
  description: >-
    Biallelic HHAT variants confirm the diagnosis. With one family reported, variant
    interpretation has almost no comparative evidence base; the founding assignment
    rested on exome filtering under a recessive model plus direct enzymatic testing of
    the variant protein, and comparable functional work would be needed for any new
    allele. Chromosomal microarray was normal in the reported patient, so a copy
    number cause was excluded before sequencing.
  evidence:
  - reference: PMID:24784881
    reference_title: "Loss of function mutation in the palmitoyl-transferase HHAT leads to syndromic 46,XY disorder of sex development by impeding Hedgehog protein palmitoylation and signaling."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A 244K aCGH analysis performed on genomic DNA extracted from blood cells of the
      patient did not reveal any chromosomal rearrangements that could account for the
      pathology.
    explanation: Documents exclusion of a structural cause before the exome analysis.
differential_diagnoses:
- name: Other Causes of 46,XY Gonadal Dysgenesis
  description: >-
    46,XY complete gonadal dysgenesis is genetically heterogeneous — SRY, NR5A1, MAP3K1,
    DHH and others — and in many cases the cause is unknown. What separates this
    disorder is that the gonadal dysgenesis comes with a generalised chondrodysplasia
    and microcephaly, which no isolated gonadal-dysgenesis gene produces. DHH
    deficiency is the instructive near-neighbour: it removes the same ligand from the
    testis, so it produces gonadal dysgenesis without the skeletal and neural
    involvement that HHAT loss adds by also disabling Sonic hedgehog.
  evidence:
  - reference: PMID:24784881
    reference_title: "Loss of function mutation in the palmitoyl-transferase HHAT leads to syndromic 46,XY disorder of sex development by impeding Hedgehog protein palmitoylation and signaling."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Unfortunately, in many cases the genetic aetiology of DSD is unknown, indicating
      that our knowledge of the factors mediating sex determination is limited.
    explanation: >-
      Establishes the heterogeneous and often unsolved background against which this
      syndromic form has to be distinguished.
- name: Other Spondylometaphyseal Dysplasias
  description: >-
    The other five members of ISDS group 12 — spondyloenchondrodysplasia (ACP5),
    odontochondrodysplasia (TRIP11), SMD Sutcliffe or corner fracture type (FN1), SMD
    with cone-rod dystrophy (PCYT1A), and SMD with corneal dystrophy (PLCB3) — all
    have a documented vertebral-plus-metaphyseal radiographic pattern. None involves
    the gonad, and none produces 46,XY sex reversal, so the combination is
    unambiguous once a karyotype is available.
  notes: >-
    Recorded without an evidence item because it is a statement about ISDS group-12
    membership, whose per-disorder placements are not quotable from the nosology
    abstract; the provenance is recorded in the classifications block.
treatments:
- name: Hormone Replacement Therapy
  description: >-
    Complete gonadal dysgenesis with hypergonadotrophic hypogonadism requires sex
    hormone replacement to induce and maintain secondary sexual characteristics and to
    protect bone, in line with standard management of 46,XY complete gonadal
    dysgenesis. The reported patient's course — absent pubertal development and
    primary amenorrhoea — establishes the need.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  therapeutic_modality: SMALL_MOLECULE
  evidence:
  - reference: PMID:24784881
    reference_title: "Loss of function mutation in the palmitoyl-transferase HHAT leads to syndromic 46,XY disorder of sex development by impeding Hedgehog protein palmitoylation and signaling."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      including normal external female genitalia, lack of pubertal development,
      primary amenorrhea
    explanation: >-
      Establishes the hypogonadism that makes hormone replacement the standard
      indication; it evidences the need rather than a trialled protocol in this
      disorder, hence PARTIAL.
- name: Gonadectomy and Gonadal Surveillance
  description: >-
    Dysgenetic gonadal tissue in a 46,XY individual carries a recognised risk of germ
    cell tumour, and the reported patient's gonads were removed and examined
    histologically. Surveillance or gonadectomy is a standing consideration in 46,XY
    complete gonadal dysgenesis, decided with the individual concerned.
  treatment_term:

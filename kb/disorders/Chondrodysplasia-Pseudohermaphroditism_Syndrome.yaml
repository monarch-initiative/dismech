animal_models:
- name: Hhat loss-of-function mouse
  species: Mouse
  genotype: Hhat loss of function
  publication: PMID:24784881
  description: >-
    Mice lacking functional Hhat, used to test whether the human syndrome follows from
    loss of hedgehog palmitoylation. The model reproduces most of the human
    phenotype across all four affected systems, which is unusually strong support for
    a single-family gene-disease assertion.
  modeled_mechanisms:
  - target: Skeletal and Neurodevelopmental Patterning Defects
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Hhat loss of function in mice reproduces the testicular, skeletal, neuronal, and
      growth defects seen in the patient, which is what allows the human phenotype to
      be attributed to the enzymatic lesion rather than to a coincidental second
      variant in a single reported family.
    limitations: >-
      The recapitulation is stated as covering most, not all, of the human defects,
      and the mouse model is a loss of function rather than a knock-in of the human
      G287V allele, so it does not test the specific variant. The mouse gonadal
      phenotype also cannot model the 46,XY sex-reversal presentation directly.
    readouts:
    - name: Testis cord formation and fetal Leydig cell differentiation
      target: Skeletal and Neurodevelopmental Patterning Defects
      direction: DECREASED
      interpretation: >-
        Sertoli cell commitment is preserved while cord formation and fetal Leydig
        differentiation fail, localising the requirement for palmitoylated Desert
        hedgehog to a specific step of testis morphogenesis.
      evidence:
      - reference: PMID:24784881
        reference_title: "Loss of function mutation in the palmitoyl-transferase HHAT leads to syndromic 46,XY disorder of sex development by impeding Hedgehog protein palmitoylation and signaling."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          In the developing testis, HHAT is not required for Sertoli cell commitment
          but plays a role in proper testis cord formation and the differentiation of
          fetal Leydig cells.
        explanation: Reports the developmental readout behind this measurement.
    evidence:
    - reference: PMID:24784881
      reference_title: "Loss of function mutation in the palmitoyl-transferase HHAT leads to syndromic 46,XY disorder of sex development by impeding Hedgehog protein palmitoylation and signaling."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Hhat loss of function in mice recapitulates most of the testicular, skeletal,
        neuronal and growth defects observed in humans
      explanation: >-
        States the scope of the recapitulation across all four affected organ systems.
discussions:
- discussion_id: hhat_single_family_and_allele_frequency
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - disease#Chondrodysplasia-Pseudohermaphroditism Syndrome
  prompt: >-
    How wide is the HHAT phenotype, and is a complete null ever compatible with live
    birth?
  rationale: >-
    The replication question this entry originally recorded has been answered. The
    2014 authors searched large skeletal-disorder and DSD cohorts without finding a
    second family; eight patients were on record by 2025 and a further four were then
    reported from two unrelated families, so the gene-disease relationship is
    replicated and the single-family framing no longer holds. What the newer series
    changes is the phenotype rather than the genotype — ptosis and marked visual
    impairment appeared for the first time, and microphthalmia joined coloboma in the
    ocular spectrum, which is the signature of a boundary still being set by who
    happens to be looked at. Two things stay open. The original search was framed by
    chondrodysplasia-plus-DSD and would have missed a milder or differently weighted
    presentation. And because hedgehog signalling is required across so many systems,
    a complete null may be embryonic-lethal and so never ascertained as a syndrome at
    all — every reported allele is missense or otherwise partial.
  evidence:
  - reference: PMID:24784881
    reference_title: "Loss of function mutation in the palmitoyl-transferase HHAT leads to syndromic 46,XY disorder of sex development by impeding Hedgehog protein palmitoylation and signaling."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This suggests that the frequency of pathogenic variants of HHAT is extremely low
      within the general population, which would explain the absence of other listed
      cases of Nivelon-Nivelon-Mabille syndrome.
    explanation: >-
      The founding authors' reading of their failed search. Later reports found the
      additional families this inference argued against, so it is retained as the 2014
      position rather than the current one.
  - reference: PMID:40326711
    reference_title: Four New Patients of HHAT-Related Multiple Congenital Anomalies Syndrome (Nivelon-Nivelon-Mabille Syndrome) and a Comprehensive Literature Review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ptosis and marked visual impairment were present only in the current study.
    explanation: >-
      Features appearing for the first time in the ninth-to-twelfth patients is the
      signature of a phenotype whose boundary is still being drawn by ascertainment.
  - reference: PMID:24784881
    reference_title: "Loss of function mutation in the palmitoyl-transferase HHAT leads to syndromic 46,XY disorder of sex development by impeding Hedgehog protein palmitoylation and signaling."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It is possible that other mutations in the HHAT locus may lead to severe defects
      in HHAT
    explanation: >-
      The authors raise the possibility of a broader allelic spectrum, which is the
      alternative to simple rarity recorded in this gap.
  proposed_experiments:
  - experiment_id: exp_hhat_phenotype_agnostic_variant_search
    name: Phenotype-agnostic search for biallelic HHAT variants
    description: >-
      Query large aggregated sequencing datasets and matchmaking services for
      biallelic HHAT variants without conditioning on chondrodysplasia or DSD, and
      separately assess whether HHAT is depleted of biallelic loss-of-function in
      population reference data to the degree expected of an embryonic-lethal gene.
    would_support:
    - pathophysiology#Biallelic HHAT MBOAT-Domain Variant
    supporting_outcome:
    - >-
      A second unrelated family with biallelic HHAT variants and an overlapping
      phenotype would replicate the gene-disease relationship.
    would_refute:
    - disease#Chondrodysplasia-Pseudohermaphroditism Syndrome
    refuting_outcome:
    - >-
      Biallelic HHAT carriers with no chondrodysplasia and no DSD would argue that the
      reported syndrome requires something beyond the HHAT genotype alone.
- discussion_id: hhat_isds_group12_placement
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Skeletal and Neurodevelopmental Patterning Defects
  prompt: >-
    Is a generalised hedgehog-patterning chondrodysplasia correctly placed in the
    spondylometaphyseal dysplasia group?
  rationale: >-
    The ISDS 2023 nosology lists this disorder as NOS 12-0060, so the classification
    in this entry follows it as a transcription. The fit is worth flagging rather than
    smoothing over. The published skeletal phenotype is a generalised chondrodysplasia
    with micromelia, brachydactyly, and a bell-shaped thorax; the report does not
    describe the vertebral-plus-metaphyseal pattern that defines the other five
    members of the group, and MONDO gives MONDO:0010814 no skeletal dysplasia parent
    at all, placing it under syndromic disease, hereditary disease, and 46,XY disorder
    of sex development. Mechanistically the disorder also sits apart: the other five
    group-12 disorders act through matrix, secretion, or growth-plate metabolism,
    while this one is a morphogen-range defect that happens to include cartilage among
    its targets. Recording the mismatch matters because a curator using group 12 as a
    proxy for a radiographic phenotype will be misled by this member.
  evidence:
  - reference: PMID:24784881
    reference_title: "Loss of function mutation in the palmitoyl-transferase HHAT leads to syndromic 46,XY disorder of sex development by impeding Hedgehog protein palmitoylation and signaling."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The first sibling displayed severe dwarfism with generalized chondrodysplasia,
      a narrow, bell-shaped thorax, micromelia, brachydactyly, severe microcephaly
      with cerebellar vermis hypoplasia, facial anomalies, hypoplastic irides, and
      coloboma of both optic discs.
    explanation: >-
      The published skeletal description is generalised rather than specifically
      spondylometaphyseal, which is the basis of the question.
  proposed_experiments:
  - experiment_id: exp_hhat_radiographic_reappraisal
    name: Radiographic reappraisal of the reported HHAT skeletal phenotype
    description: >-
      Obtain and re-read the original skeletal surveys of the two affected siblings,
      scoring specifically for vertebral and metaphyseal involvement against the
      criteria used for the other group-12 disorders, and refer the finding to the
      ISDS Nosology Committee.
    would_support:
    - pathophysiology#Skeletal and Neurodevelopmental Patterning Defects
    supporting_outcome:
    - >-
      Documented platyspondyly with metaphyseal irregularity would confirm the
      committee's placement on radiographic grounds and close the question.
    would_refute:
    - pathophysiology#Skeletal and Neurodevelopmental Patterning Defects
    refuting_outcome:
    - >-
      Absence of a vertebral-plus-metaphyseal pattern would make this a placement of
      convenience for a syndromic chondrodysplasia and a candidate for regrouping in a
      future revision.

environmental:
- name: Strenuous exercise
  description: >-
    Intense or anaerobic exercise, especially with heat exposure, is the principal
    trigger: it raises lactate and proton production beyond the reduced transport
    capacity. Heat and dehydration amplify the metabolic and renal stress.
  exposure_term:
    preferred_term: exposure to physical activity
    term:
      id: ECTO:6000039
      label: exposure to Physical Activity
  evidence:
  - reference: ORPHA:171690
    reference_title: "Metabolic myopathy due to lactate transporter defect"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: muscle cramping and/or stiffness after exercise (especially during heat exposure)
    explanation: Orphanet identifies exercise and heat exposure as the triggering exposures.
  influences_mechanisms:
  - target: Impaired Lactate and Proton Efflux During Exercise
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Exercise raises glycolytic lactate/H+ production, driving the mismatch between
      production and the reduced efflux capacity.
    evidence:
    - reference: PMID:10590411
      reference_title: "Mutations in MCT1 cDNA in patients with symptomatic deficiency in lactate transport."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: symptoms and signs of muscle injury on exercise and heat exposure
      explanation: Muscle injury is reported specifically on exercise and heat exposure.
treatments:
- name: Avoidance of Exercise and Heat Triggers
  therapeutic_modality: BEHAVIORAL
  description: >-
    Trigger avoidance is the mainstay: limit exhaustive activity and exercise in
    high heat, maintain hydration and cooling, condition gradually below the
    symptom threshold, and stop activity at cramps, stiffness, marked fatigue or
    dark urine. Based on the documented triggers and general rhabdomyolysis
    practice, not on disease-specific trial evidence.
  treatment_term:
    preferred_term: exercise and heat trigger avoidance
- name: Supportive Care for Rhabdomyolysis
  description: >-
    Clinically significant exertional rhabdomyolysis is managed with standard
    supportive care: intravenous isotonic fluids, electrolyte and renal
    monitoring, and nephrology/critical-care support with renal replacement
    therapy when conventionally indicated. No disease-specific pharmacotherapy,
    gene, RNA or cell therapy exists.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
- name: Genetic Counseling
  description: >-
    Counseling should explain the uncertain gene-disease validity and variant
    pathogenicity, recurrence risk under an autosomal dominant model, and the two
    distinct allelic SLC16A1 disorders.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
notes: >-
  Scope: this entry covers the muscle/erythrocyte lactate-transport phenotype
  (MONDO:0009501, OMIM:245340, ORPHA:171690) only. SLC16A1/MCT1 causes two other,
  distinct allelic diseases that are deliberately NOT modeled here: (1) MCT1
  deficiency with recurrent ketoacidosis (biallelic loss-of-function variants,
  OMIM:616095), and (2) autosomal dominant exercise-induced hyperinsulinism
  (activating promoter variants causing inappropriate MCT1 expression in
  pancreatic beta cells, OMIM:610021). Their mechanisms (ketone-utilization
  failure; promoter gain of expression) and triggers (fasting/infection;
  exercise-associated hypoglycemia) differ and should not be imported here.
  The gene-disease relationship for this myopathy is rated Limited by GenCC and
  the historical missense variants are of disputed pathogenicity (see Genetic
  notes). Curated from a Perplexity deep-research report; only mechanism and
  muscle-specific sources were used, and the report's misattributed
  variant-refutation citation (PMID:25371203, in fact a 5-oxoproline transport
  paper) was not used. No GeneReviews chapter exists for this disorder.

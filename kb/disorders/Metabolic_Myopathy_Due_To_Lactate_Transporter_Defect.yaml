    rhabdomyolysis-panel sequencing as part of the work-up.
  evidence:
  - reference: PMID:10590411
    reference_title: "Mutations in MCT1 cDNA in patients with symptomatic deficiency in lactate transport."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: All had transport rates below the 95% envelope for normals.
    explanation: >-
      The cases were identified by erythrocyte lactate transport rates below the

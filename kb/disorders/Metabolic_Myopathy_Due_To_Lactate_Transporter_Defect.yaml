- name: Impaired Lactate and Proton Efflux During Exercise
  biological_scale: CELLULAR
  description: >-
    During high glycolytic demand, residual transport cannot clear the lactate and
    protons produced, so post-exercise muscle lactate declines abnormally slowly.
    Intense exercise, especially with heat, is the principal trigger.

genetic:
- name: SLC16A1
  gene_term:
    preferred_term: SLC16A1
    term:
      id: hgnc:10922
      label: SLC16A1
  relationship_type: CAUSATIVE
  notes: >-
    relationship_type is CAUSATIVE because OMIM (245340) and Orphanet
    (ORPHA:171690) still list SLC16A1 as the disease-causing gene for this
    disorder; that is a stronger reading than the evidence alone supports.
    Gene-disease validity is Limited (GenCC). The two historically reported
    heterozygous missense variants (p.Lys204Glu, p.Gly472Arg) are of disputed
    pathogenicity: later heterologous assays did not reproduce reduced lactate
    uptake and p.Gly472Arg carries benign/VUS ClinVar submissions and appreciable
    population frequency. The reproducible finding is the subnormal
    erythrocyte/muscle lactate-transport phenotype; specific causal variants
    should be interpreted with current ACMG evidence rather than inherited from
    the historical OMIM labels. Two distinct allelic SLC16A1 disorders are out of
    scope here: MCT1 deficiency with recurrent ketoacidosis (biallelic
    loss-of-function, OMIM:616095) and autosomal dominant exercise-induced
    hyperinsulinism (promoter gain-of-expression, OMIM:610021).
  evidence:
  - reference: PMID:10590411
    reference_title: "Mutations in MCT1 cDNA in patients with symptomatic deficiency in lactate transport."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: All 3 patients were heterozygotes.
    explanation: Reports heterozygous SLC16A1 missense genotypes in the symptomatic patients.
  - reference: PMID:10590411
    reference_title: "Mutations in MCT1 cDNA in patients with symptomatic deficiency in lactate transport."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: We presume that these mutations are responsible for their subnormal lactate transport
    explanation: >-
      The authors attribute the subnormal lactate transport to the heterozygous
      MCT1 variants, but state it as a presumption rather than a demonstrated
      effect, so the support is indirect; the later dispute over these variants
      is recorded in notes.
biochemical:
- name: Subnormal erythrocyte lactate transport
  presence: DECREASED
  context: >-
    Case-defining laboratory finding in the molecular series: erythrocyte
    lactate transport below the normal range, at about 40-50% of the normal mean
    in the variant carriers.
  evidence:
  - reference: PMID:10590411
    reference_title: "Mutations in MCT1 cDNA in patients with symptomatic deficiency in lactate transport."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We identified 5 patients with subnormal erythrocyte lactate transport plus symptoms and signs of muscle injury on exercise and heat exposure.
    explanation: >-
      Subnormal erythrocyte lactate transport is the finding that defined the
      patients in this series.
  - reference: PMID:10590411
    reference_title: "Mutations in MCT1 cDNA in patients with symptomatic deficiency in lactate transport."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Three cases had rates 40-50% of mean normal.
    explanation: >-
      Quantifies the reduction in erythrocyte lactate transport in the cases
      later found to carry MCT1 variants.
- name: Delayed post-exercise decline of muscle lactate
  presence: INCREASED
  context: >-
    Muscle lactate stays raised after exercise instead of falling normally,
    the muscle-side counterpart of the erythrocyte transport defect.
  evidence:
  - reference: PMID:3775384
    reference_title: "Lactate transporter defect: a new disease of muscle."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: the lactate content of the patient's skeletal muscle does not decline normally after exercise
    explanation: >-
      Reports the abnormally slow post-exercise fall in muscle lactate in the
      index patient.

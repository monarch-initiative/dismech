pathophysiology:
- name: SLC16A1/MCT1 Loss-of-Function Variant
  biological_scale: MOLECULAR
  description: >-
    A heterozygous germline SLC16A1 variant is proposed to reduce the lactate/proton
    transport capacity of monocarboxylate transporter 1 (MCT1) in erythrocyte and
    skeletal-muscle membranes. Reported carriers had erythrocyte lactate transport
    rates of roughly 40-50% of normal. Attribution to the specific historical
    missense variants is uncertain (see Genetic notes); the measured transport
    phenotype itself is reproducible.

name: Metabolic Myopathy Due To Lactate Transporter Defect
creation_date: "2026-10-30T10:56:10Z"
category: Mendelian
synonyms:
- Erythrocyte lactate transporter defect
- Lactate transporter defect, myopathy due to
- Symptomatic deficiency in lactate transport
- MCT1 deficiency, myopathic
description: >-
  Metabolic myopathy due to lactate transporter defect is a rare, exertion-triggered
  metabolic myopathy attributed to heterozygous variants in SLC16A1 (MCT1), the
  proton-coupled monocarboxylate (lactate/pyruvate) transporter shared by
  erythrocyte and skeletal-muscle membranes. Affected individuals have subnormal
  erythrocyte and muscle lactate transport and develop muscle cramping, stiffness,
  fatigue, hyperCKemia and sometimes post-exertional rhabdomyolysis with
  myoglobinuria after intense exercise, especially with heat exposure. The
  gene-disease relationship rests on a very small historical cohort and the
  pathogenicity of the originally reported missense variants is disputed by later
  functional and population data (GenCC Limited); see notes. This entry is scoped
  to the muscle/erythrocyte lactate-transport phenotype (OMIM:245340) and does not
  cover the two distinct allelic SLC16A1 disorders (see notes).

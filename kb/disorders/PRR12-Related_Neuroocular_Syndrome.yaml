    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Additional common features included hypotonia (61%), heart defects (52%), growth failure (54%), and kidney anomalies (35%)."
    explanation: Quantifies cardiac malformation in the delineating cohort.

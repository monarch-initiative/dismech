- name: Impaired NIPBL-Cohesin Cooperation and Genomic Instability
  biological_scale: CELLULAR
  description: >-
    A co-essentiality screen identified PRR12 as a cohesin-associated factor.
    PRR12 physically interacts with the NIPBL/MAU2 cohesin loader and with the
    cohesin complex itself; its loss reduces cohesin localization and produces
    a substantial increase in DNA double-strand breaks, and PRR12 is recruited
    with NIPBL to sites of DNA damage in a NIPBL- and cohesin-dependent manner.
    Because NIPBL haploinsufficiency causes Cornelia de Lange syndrome, this
    places PRR12 adjacent to the cohesinopathies. Its curated explanatory scope
    here is deliberately limited to the neurodevelopmental arm, which is the
    only downstream edge this node asserts: impaired cohesin function and
    accumulating DNA damage in proliferating neural progenitors is a plausible
    route to developmental impairment, whereas no evidence connects this
    mechanism to the ocular, cardiac, or renal malformations, so those edges
    are not drawn. The evidence is cell-biological, comes principally from
    mouse NIH-3T3 cells, and has not yet been connected to patient tissue, so
    this is an emerging rather than an established disease mechanism.
  protein_complexes:
  - preferred_term: cohesin complex
    term:
      id: GO:0008278
      label: cohesin complex
  biological_processes:
  - preferred_term: sister chromatid cohesion
    modifier: DECREASED
    term:
      id: GO:0007062
      label: sister chromatid cohesion

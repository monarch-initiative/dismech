- name: Disrupted Cardiac Organogenesis
  biological_scale: TISSUE
  description: >-
    Congenital heart defects are the commonest extra-neural, extra-ocular
    malformation, affecting about half of reported individuals; the lesions
    described are septal defects and pulmonary stenosis, that is, defects of
    septation and outflow-tract formation rather than a single anatomical
    lesion. The developmental basis is not established. Unlike the renal arm,
    the cardiac arm has no independent supporting signal beyond the case
    series, so it rests solely on the inference of a dosage-sensitive
    developmental transcriptional program.

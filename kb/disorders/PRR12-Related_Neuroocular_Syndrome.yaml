- name: Impaired Chromatin-Associated Transcriptional Regulation
  biological_scale: MOLECULAR
  description: >-
    PRR12 is a nuclear protein carrying two predicted AT-hook DNA-binding
    domains, with DNA-interacting domains that are highly conserved across
    vertebrates, and the prevailing model is that it functions as a cofactor
    in transcriptional regulation. Its coexpression neighborhood is enriched
    for chromatin regulators including SET-domain, bromodomain, zinc-finger,
    and BAH-domain proteins. Halving its dosage is proposed to perturb the
    transcriptional programs that pattern the developing forebrain and eye.
    The precise target genes, partner complexes, and DNA-binding specificity
    remain undefined, and PRR12 is still described in the primary literature
    as a gene of largely unknown function.

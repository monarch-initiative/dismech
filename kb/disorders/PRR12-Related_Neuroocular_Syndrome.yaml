- name: Disrupted Renal Organogenesis
  biological_scale: TISSUE
  description: >-
    Kidney and urinary tract anomalies affect about a third of reported
    individuals, with hydronephrosis, duplicated ureter, and vesicoureteral
    reflux reported - a collecting-system and ureteric-bud pattern rather than
    a parenchymal one. The renal arm is distinguished from the cardiac arm by

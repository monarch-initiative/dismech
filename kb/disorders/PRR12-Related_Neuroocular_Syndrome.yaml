diagnosis:
- name: Trio exome or genome sequencing
  description: >-
    Molecular diagnosis rests on identifying a heterozygous loss-of-function
    PRR12 variant or deletion by exome or genome sequencing in an appropriate
    phenotype, with parental testing to establish de novo status. Trio testing
    is efficient because the phenotype is broad and usually de novo. Genome
    sequencing better detects structural and noncoding variants, and
    chromosomal microarray is appropriate when multiple congenital anomalies
    suggest a copy-number change. Two practical points recur in the reported
    series. First, PRR12 variants have repeatedly been found only on re-review
    of previously non-diagnostic exome data, so reanalysis is worthwhile.
    Second, several reported variants showed skewed allele fractions consistent
    with mosaicism, so a low variant allele fraction should not lead to
    automatic dismissal.
  evidence:
  - reference: PMID:29556724
    reference_title: "De novo apparent loss-of-function mutations in PRR12 in three patients with intellectual disability and iris abnormalities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we report on three unrelated patients with heterozygous de novo apparent loss-of-function mutations in PRR12 detected by clinical whole exome sequencing"
    explanation: Clinical exome sequencing is the established diagnostic route.
  - reference: PMID:33314030
    reference_title: "Dominant variants in PRR12 result in unilateral or bilateral complex microphthalmia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the results from Sanger sequencing were also consistent with mosaicism, showing lower peaks for the mutant allele"
    explanation: Documents mosaicism as a recognized complication of variant interpretation in this gene.
- name: Bilateral ophthalmological assessment
  description: >-
    Detailed bilateral ophthalmological examination is essential at diagnosis.
    Because the eye phenotype is frequently unilateral with a structurally
    normal fellow eye, examining only the obviously affected side will
    misclassify the phenotype, and conversely a normal examination in one eye
    does not exclude PRR12-related disease. Anterior segment assessment should
    specifically look for Peters anomaly, stellate iris pattern, and iris
    coloboma; posterior segment and optic nerve assessment is needed because
    posterior abnormalities were under-ascertained in the reported cohort; and
    affected eyes require glaucoma surveillance.
  evidence:
  - reference: PMID:33314030
    reference_title: "Dominant variants in PRR12 result in unilateral or bilateral complex microphthalmia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Remarkably, ocular phenotypes were asymmetric in all individuals and unilateral (with structurally normal contralateral eye) in three."
    explanation: Justifies bilateral examination and the caution against inferring bilateral normality.
- name: Cardiac and renal screening
  description: >-
    Because congenital heart defects and kidney anomalies each affect a
    substantial minority of individuals, echocardiography and renal ultrasound
    are indicated at the time of molecular diagnosis, with growth and feeding
    monitoring alongside.
  evidence:
  - reference: PMID:33824499
    reference_title: "Haploinsufficiency of PRR12 causes a spectrum of neurodevelopmental, eye, and multisystem abnormalities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Additional common features included hypotonia (61%), heart defects (52%), growth failure (54%), and kidney anomalies (35%)."
    explanation: The frequency of cardiac and renal malformation justifies systematic screening.
differential_diagnoses:
- name: SOX2-related anophthalmia/microphthalmia syndrome
  disease_term:
    preferred_term: SOX2 anophthalmia syndrome
    term:
      id: MONDO:0008799
      label: anophthalmia/microphthalmia-esophageal atresia syndrome
  description: >-
    SOX2 is the single commonest cause of syndromic anophthalmia and
    microphthalmia and shares the core PRR12 combination of a severe
    MAC-spectrum eye malformation with developmental delay. Both genes appear
    side by side in the diagnostic yield of the same
    anophthalmia/microphthalmia sequencing cohorts, and both have been reported
    to produce unilateral ocular anomalies, so SOX2 is the first alternative to
    exclude.
  distinguishing_features:
  - Oesophageal atresia and tracheo-oesophageal fistula are characteristic of the SOX2 syndrome and are not features of PRR12-related disease.
  - Hypogonadotropic hypogonadism and genital anomalies point to SOX2 rather than PRR12.
  - PRR12-related eye disease is characteristically asymmetric or unilateral, whereas SOX2 anophthalmia is more often bilateral and more uniformly severe.
  - Congenital heart and kidney defects are prominent in PRR12-related disease and are not part of the SOX2 core pattern.
  evidence:
  - reference: PMID:41953648
    reference_title: "Exploring the molecular basis of microphthalmia and anophthalmia: Insights from an Egyptian cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The implicated genes were SOX2, OTX2, CHD7, HMX1, PRR12, ATOH7, ZBTB11, B3GALNT2, GCNT2, DPH1, GJA8, FRAS1 and UBE3B."
    explanation: SOX2 and PRR12 are recovered from the same anophthalmia and microphthalmia diagnostic cohort, establishing them as members of one differential.
  - reference: PMID:33314030
    reference_title: "Dominant variants in PRR12 result in unilateral or bilateral complex microphthalmia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "While genes such as SOX2 and OTX2 have been occasionally reported to cause unilateral ocular anomalies"
    explanation: Places SOX2 and OTX2 alongside PRR12 as the genes capable of producing unilateral developmental ocular anomalies, which is the specific diagnostic scenario in which PRR12 is easily missed.
- name: OTX2-related syndromic microphthalmia
  disease_term:
    preferred_term: syndromic microphthalmia type 5
    term:
      id: MONDO:0012413
      label: syndromic microphthalmia type 5
  description: >-
    OTX2 haploinsufficiency causes a dominant, largely de novo MAC-spectrum
    disorder with optic nerve involvement and developmental delay, closely
    mirroring the PRR12 presentation. As with SOX2, OTX2 is recovered from the
    same diagnostic cohorts and can produce unilateral disease.
  distinguishing_features:
  - Pituitary hormone deficiency, including combined pituitary hormone deficiency, is a recognized OTX2 feature and has not been reported as part of the PRR12 phenotype.
  - Retinal dystrophy with an abnormal electroretinogram is more characteristic of OTX2 than of PRR12.
  - Anterior segment dysgenesis with Peters anomaly and a stellate iris pattern favours PRR12.
  - Congenital heart and kidney malformations are common in PRR12-related disease and are not core OTX2 features.
  evidence:
  - reference: PMID:41953648
    reference_title: "Exploring the molecular basis of microphthalmia and anophthalmia: Insights from an Egyptian cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The implicated genes were SOX2, OTX2, CHD7, HMX1, PRR12, ATOH7, ZBTB11, B3GALNT2, GCNT2, DPH1, GJA8, FRAS1 and UBE3B."
    explanation: OTX2 and PRR12 are recovered from the same anophthalmia and microphthalmia diagnostic cohort.
  - reference: PMID:33314030
    reference_title: "Dominant variants in PRR12 result in unilateral or bilateral complex microphthalmia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "While genes such as SOX2 and OTX2 have been occasionally reported to cause unilateral ocular anomalies"
    explanation: OTX2 shares with PRR12 the capacity to cause unilateral ocular anomalies.
- name: CHARGE syndrome and the wider CHD7 disorder spectrum
  disease_term:
    preferred_term: CHARGE syndrome
    term:
      id: MONDO:0008965
      label: CHARGE syndrome
  description: >-
    The most important syndromic differential, because CHARGE syndrome
    reproduces almost the entire PRR12 multisystem pattern, namely coloboma,
    heart defect, growth and developmental delay, and renal anomalies. Both are
    dominant, typically de novo, chromatin-associated disorders, since CHD7 is
    a chromatin remodeller and PRR12 a chromatin-associated nuclear protein, so
    the mechanistic as well as the clinical overlap is real. CHD7 also appears
    with PRR12 in the same MAC diagnostic cohorts.
  distinguishing_features:
  - Choanal atresia is a cardinal CHARGE feature and is not reported in PRR12-related disease.
  - Semicircular canal hypoplasia and cranial nerve anomalies, including anosmia and facial palsy, are highly discriminating for CHD7.
  - Characteristic external ear anomalies with deafness point to CHARGE.
  - Genital hypoplasia and hypogonadotropic hypogonadism favour CHARGE.
  - Anterior segment dysgenesis with Peters anomaly favours PRR12, whereas the CHARGE ocular lesion is characteristically a chorioretinal or optic nerve coloboma.
  evidence:
  - reference: PMID:20301296
    reference_title: "CHD7 Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mnemonic CHARGE syndrome, introduced in the premolecular era, stands for coloboma, heart defect, choanal atresia, retarded growth and development, genital hypoplasia, ear anomalies (including deafness)."
    explanation: GeneReviews enumerates the CHARGE cardinal features, showing both the overlap with PRR12 in coloboma, heart defect, and growth and developmental delay, and the discriminators of choanal atresia, genital hypoplasia, and ear anomalies.
  - reference: PMID:20301296
    reference_title: "CHD7 Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the phenotypic spectrum expanded to include cranial nerve anomalies, vestibular defects, cleft lip and/or palate, hypothyroidism, tracheoesophageal anomalies, brain anomalies, seizures, and renal anomalies"
    explanation: The expanded CHD7 spectrum includes renal anomalies, completing the eye, heart, and kidney overlap with PRR12 and making cranial nerve and vestibular assessment the practical discriminator.
  - reference: PMID:41953648
    reference_title: "Exploring the molecular basis of microphthalmia and anophthalmia: Insights from an Egyptian cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The implicated genes were SOX2, OTX2, CHD7, HMX1, PRR12, ATOH7, ZBTB11, B3GALNT2, GCNT2, DPH1, GJA8, FRAS1 and UBE3B."
    explanation: CHD7 and PRR12 are recovered from the same anophthalmia and microphthalmia diagnostic cohort.
- name: PAX2-related disorder, formerly renal coloboma syndrome
  disease_term:
    preferred_term: renal coloboma syndrome
    term:
      id: MONDO:0007352
      label: renal coloboma syndrome
  description: >-
    A dominant disorder pairing renal anomalies with optic nerve anomalies,
    precisely the eye-plus-kidney combination that PRR12 produces, and
    therefore a natural differential when a child presents with coloboma and a
    structural renal anomaly. It offers an unusually clean discriminator.
  distinguishing_features:
  - Iris coloboma has not been reported in PAX2-related disorder, so an iris coloboma argues against it and towards PRR12.
  - The PAX2 ocular lesion is specifically optic nerve coloboma or dysplasia, not the globe-size and anterior-segment defects seen with PRR12.
  - Renal involvement in PAX2-related disorder is near-obligate and progresses to renal insufficiency or end-stage renal disease, whereas PRR12 renal anomalies affect a minority and are structural rather than progressive.
  - Congenital heart defects and significant developmental delay are not core PAX2 features but are common in PRR12-related disease.
  evidence:
  - reference: PMID:20301624
    reference_title: "PAX2-Related Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Iris colobomas have not been reported in any individual with PAX2–related disorder."
    explanation: GeneReviews provides a near-absolute discriminator, since iris coloboma is a recurrent PRR12 finding and argues against PAX2-related disorder.
  - reference: PMID:20301624
    reference_title: "PAX2-Related Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Abnormal renal structure or function is noted in 92% of affected individuals and ophthalmologic abnormalities in 77% of affected individuals."
    explanation: The near-obligate renal involvement in PAX2-related disorder contrasts with the roughly one-third rate in PRR12-related disease, so a child with severe progressive renal disease plus optic nerve coloboma is more likely to have PAX2-related disorder.
- name: SALL4-related disorders, including acro-renal-ocular syndrome
  disease_term:
    preferred_term: Duane-radial ray syndrome
    term:
      id: MONDO:0011812
      label: Duane-radial ray syndrome
  description: >-
    The acro-renal-ocular phenotype within the SALL4 spectrum combines ocular
    coloboma, renal anomalies, and cardiac malformation, overlapping the PRR12
    eye-heart-kidney triad, and the associated eye movement disorder can be
    mistaken for the strabismus seen in PRR12-related disease. The renal lesions
    overlap closely, including vesicoureteral reflux, which is also reported in
    PRR12-related disease.
  distinguishing_features:
  - Radial ray malformation, meaning thumb hypoplasia or aplasia, triphalangeal or duplicated thumb, and radial hypoplasia, is the defining SALL4 feature and is absent in PRR12-related disease.
  - Duane anomaly, a congenital cranial dysinnervation disorder with globe retraction on adduction, is distinct from the common comitant strabismus of PRR12-related disease.
  - Anterior segment dysgenesis with Peters anomaly and microphthalmia favours PRR12, whereas the SALL4 ocular lesion is characteristically a coloboma.
  - Significant intellectual disability is typical of PRR12-related disease and is not a core SALL4 feature.
  evidence:
  - reference: PMID:20301547
    reference_title: "SALL4-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "AROS is characterized by radial ray malformations, renal abnormalities (mild malrotation, ectopia, horseshoe kidney, renal hypoplasia, vesicoureteral reflux, bladder diverticula), ocular coloboma, and Duane anomaly."
    explanation: The acro-renal-ocular phenotype overlaps PRR12 on coloboma and renal anomaly including vesicoureteral reflux, while the radial ray malformation supplies the discriminator.
  - reference: PMID:20301547
    reference_title: "SALL4-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DRRS is characterized by uni- or bilateral Duane anomaly and radial ray malformation that can include thenar hypoplasia and/or hypoplasia or aplasia of the thumbs"
    explanation: Confirms that limb involvement is the defining SALL4 feature, which examination of the thumbs and forearms will resolve.
- name: PAX6 aniridia syndrome and the wider PAX6-related spectrum
  disease_term:
    preferred_term: isolated aniridia
    term:
      id: MONDO:0007119
      label: isolated aniridia
  description: >-
    Phenotypically the closest ocular mimic of PRR12-related disease, and
    arguably the most instructive differential in this entry, because PAX6
    reproduces nearly the whole curated PRR12 feature list, including foveal
    hypoplasia, glaucoma, cataract, optic nerve coloboma and hypoplasia,
    nystagmus, and microphthalmia, together with developmental delay or
    intellectual disability, autism, ADHD, anxiety, and disordered sleep. The
    MONDO binding used here is the aniridia term, but the intended comparator
    is the wider PAX6-related spectrum, which includes non-aniridic anterior
    segment phenotypes.
  distinguishing_features:
  - Partial or complete iris hypoplasia, that is aniridia, and corneal keratopathy with limbal stem cell failure are PAX6 hallmarks not seen in PRR12-related disease.
  - Interocular symmetry is the sharpest discriminator, because PAX6 disease is usually near-symmetric between the two eyes whereas PRR12 disease is asymmetric in essentially all reported individuals and frequently unilateral.
  - A stellate iris pattern with iris coloboma favours PRR12 over the iris hypoplasia of PAX6.
  - Congenital heart defects and kidney anomalies are part of the PRR12 phenotype and are not features of PAX6 aniridia syndrome; a WT1 deletion causing WAGR syndrome should instead be considered when aniridia occurs with renal disease.
  evidence:
  - reference: PMID:20301534
    reference_title: "PAX6 Aniridia Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Classic aniridia affects the iris (partial or full iris hypoplasia), cornea (corneal keratopathy), anterior segment (resulting in raised intraocular pressure and glaucoma), lens (cataract and lens subluxation), fovea (foveal hypoplasia), and optic nerve (optic nerve coloboma and hypoplasia)."
    explanation: The PAX6 ocular feature list overlaps the curated PRR12 ocular phenotypes almost item for item, which is why iris hypoplasia and corneal keratopathy must be sought as discriminators.
  - reference: PMID:20301534
    reference_title: "PAX6 Aniridia Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although the severity of aniridia shows interfamilial and intrafamilial variability, little variability is usually observed in the two eyes of an affected individual."
    explanation: Provides the sharpest discriminator against PRR12, whose defining ocular feature is marked asymmetry between the two eyes, often with one structurally normal eye.
  - reference: PMID:20301534
    reference_title: "PAX6 Aniridia Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "developmental delay / intellectual disability; neurobehavioral/psychiatric manifestations such as autism spectrum disorder (ASD), attention-deficit/hyperactivity disorder (ADHD), and behavioral dysregulation; and mood disorders such as depression and anxiety"
    explanation: The PAX6 neurodevelopmental and neuropsychiatric profile matches the PRR12 profile closely, so the neurobehavioural phenotype cannot be used to separate the two and discrimination must rest on ocular and visceral features.
treatments:
- name: Physical Therapy
  description: >-
    There is no disease-modifying therapy, gene therapy, RNA therapy, or
    PRR12-targeted treatment for this disorder, and no interventional trial
    has been registered. Management is supportive and multidisciplinary.
    Physical therapy addresses the hypotonia and the motor component of the
    developmental delay.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: physical therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  target_phenotypes:
  - preferred_term: Generalized hypotonia
    term:
      id: HP:0001290
      label: Generalized hypotonia
  target_mechanisms:
  - target: Neurodevelopmental Impairment
    treatment_effect: MODULATES
    description: >-
      Symptomatic support that may improve motor function without addressing
      the underlying haploinsufficiency.
  evidence:
  - reference: PMID:33824499
    reference_title: "Haploinsufficiency of PRR12 causes a spectrum of neurodevelopmental, eye, and multisystem abnormalities."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Additional common features included hypotonia (61%), heart defects (52%), growth failure (54%), and kidney anomalies (35%)."
    explanation: Hypotonia in 61 percent of the cohort establishes the indication for physical therapy; the cohort study does not itself evaluate any intervention, so this is indirect support only.
- name: Occupational Therapy
  description: >-
    Occupational therapy supports adaptive and daily-living skills. It is
    particularly relevant in this disorder because the combination of
    developmental impairment with visual impairment compounds functional
    disability, and because severity ranges up to full dependence for
    activities of daily living.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: occupational therapy
    term:
      id: NCIT:C121351
      label: Occupational Therapy
  target_mechanisms:
  - target: Neurodevelopmental Impairment
    treatment_effect: MODULATES
    description: >-
      Symptomatic support for adaptive function; does not address the
      underlying haploinsufficiency.
  evidence:
  - reference: PMID:33824499
    reference_title: "Haploinsufficiency of PRR12 causes a spectrum of neurodevelopmental, eye, and multisystem abnormalities."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients had developmental impairment."
    explanation: Universal developmental impairment establishes the indication; the cohort study evaluates no intervention, so support is indirect.
- name: Speech and Language Therapy
  description: >-
    Speech and language therapy addresses the expressive language deficit.
    This is a distinct need rather than a generic add-on: a subset of
    individuals in the delineating cohort had isolated speech-language delay
    as their only developmental impairment, and at the severe end individuals
    are non-verbal.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: speech and language therapy
    term:
      id: NCIT:C159273
      label: Speech Language Therapy
  target_mechanisms:
  - target: Neurodevelopmental Impairment
    treatment_effect: MODULATES
    description: >-
      Symptomatic support for communication; does not address the underlying
      haploinsufficiency.
  evidence:
  - reference: PMID:33824499
    reference_title: "Haploinsufficiency of PRR12 causes a spectrum of neurodevelopmental, eye, and multisystem abnormalities."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients had developmental impairment."
    explanation: Universal developmental impairment, which per the full text includes isolated speech-language delay in a subset, establishes the indication; the cohort study evaluates no intervention.
- name: Ophthalmic Surgical Management
  description: >-
    Surgical management of the structural ocular malformation: strabismus
    surgery, corneal or cataract surgery where indicated for Peters anomaly or
    lens opacity, glaucoma surgery or intraocular pressure control, and
    prosthetic or socket care for anophthalmia and severe microphthalmia. No
    intervention restores the developmental malformation itself. Because the
    disease is characteristically asymmetric, surgical planning must protect
    the function of the better-seeing eye.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: ophthalmologic surgical procedure
    term:
      id: NCIT:C15331
      label: Ophthalmologic Surgical Procedure
  target_phenotypes:
  - preferred_term: Peters anomaly
    term:
      id: HP:0000659
      label: Peters anomaly
  - preferred_term: Cataract
    term:
      id: HP:0000518
      label: Cataract
  - preferred_term: Glaucoma
    term:
      id: HP:0000501
      label: Glaucoma
  - preferred_term: Strabismus
    term:
      id: HP:0000486
      label: Strabismus
  target_mechanisms:
  - target: MAC-Spectrum and Anterior Segment Eye Malformation
    treatment_effect: MODULATES
    description: >-
      Addresses the consequences of the structural eye malformation rather
      than the morphogenetic defect.
  evidence:
  - reference: PMID:33314030
    reference_title: "Dominant variants in PRR12 result in unilateral or bilateral complex microphthalmia."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The ocular phenotypes in our cohort were more severe than previously reported, with microphthalmia (4) or coloboma (1) seen in all five individuals, Peters anomaly in three, and cataract, foveal hypoplasia, abnormal vascular development, glaucoma and hyperopia in one case each."
    explanation: The enumerated surgically and optically manageable lesions establish the indication; the report does not evaluate treatment outcomes, so support is indirect.
- name: Low Vision Rehabilitation and Refractive Management
  description: >-
    Non-surgical visual management, split out from the surgical entry because
    it is a rehabilitative rather than an operative modality: low-vision
    services and aids, refractive correction, and amblyopia therapy. Amblyopia
    therapy is especially important in this disorder because the malformation
    is frequently unilateral, so the structurally normal fellow eye is at risk
    of deprivation amblyopia if the affected eye is simply written off.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: rehabilitation
    term:
      id: NCIT:C15315
      label: Rehabilitation
  target_phenotypes:
  - preferred_term: Visual impairment
    term:
      id: HP:0000505
      label: Visual impairment
  evidence:
  - reference: PMID:29556724
    reference_title: "De novo apparent loss-of-function mutations in PRR12 in three patients with intellectual disability and iris abnormalities."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "All three patients had global developmental delay, intellectual disability, eye and vision abnormalities, dysmorphic features, and neuropsychiatric problems."
    explanation: Vision abnormalities in all three individuals of the founding series establish the indication for visual rehabilitation; no study evaluates the intervention, so support is indirect.
- name: Cardiac and Renal Surveillance and Supportive Care
  description: >-
    Standard cardiology management of septal defects and pulmonary stenosis,
    and nephrology or urology management of hydronephrosis, vesicoureteral
    reflux, and duplicated collecting systems, alongside nutritional and
    feeding support for the growth failure. No disorder-specific surveillance
    guideline exists; care follows the general standards for each individual
    malformation.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Congenital Heart Malformation
    treatment_effect: MODULATES
    description: >-
      Manages the cardiac malformation endpoint; does not alter the
      developmental cause.
  - target: Kidney and Urinary Tract Malformation
    treatment_effect: MODULATES
    description: >-
      Manages the renal malformation endpoint; does not alter the
      developmental cause.
  evidence:
  - reference: PMID:33824499
    reference_title: "Haploinsufficiency of PRR12 causes a spectrum of neurodevelopmental, eye, and multisystem abnormalities."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Additional common features included hypotonia (61%), heart defects (52%), growth failure (54%), and kidney anomalies (35%)."
    explanation: The frequency of cardiac, renal, and growth involvement establishes the indication for surveillance and supportive care; the cohort study evaluates no intervention.
- name: Genetic Counseling
  description: >-
    Counseling should cover the autosomal dominant mechanism, the predominantly
    de novo origin with correspondingly low but non-zero recurrence risk from
    parental germline mosaicism, the theoretical 50 percent transmission risk
    for an affected individual, the documented instance of parent-to-child
    transmission, and the wide and currently unpredictable phenotypic
    variability, including the possibility of an affected relative with
    isolated unilateral eye disease and normal cognition. Reproductive options
    after molecular diagnosis include prenatal diagnosis and preimplantation
    genetic testing.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:33314030
    reference_title: "Dominant variants in PRR12 result in unilateral or bilateral complex microphthalmia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Given the variability observed in reported individuals thus far, it seems likely that additional phenotypic variation will be identified as more PRR12 variants are discovered."
    explanation: The authors' explicit statement of unresolved phenotypic variability is what counseling must convey.
discussions:
- discussion_id: prr12_eye_penetrance
  prompt: >-
    Why is the PRR12 ocular malformation present in only about half of affected
    individuals, and why is it so frequently unilateral with a structurally
    normal contralateral eye?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Disrupted Ocular Morphogenesis
  - pathophysiology#MAC-Spectrum and Anterior Segment Eye Malformation
  rationale: >-
    Incomplete and markedly asymmetric penetrance of a malformation caused by a
    constitutional heterozygous null allele is mechanistically informative. A
    uniformly deterministic dosage effect would predict bilateral, roughly
    symmetric disease. Unilaterality instead implies that ocular morphogenesis
    crosses a stochastic threshold independently in each optic vesicle, or that
    a somatic second hit, modifier locus, or transcriptional noise determines
    which eye is affected. No genotype-phenotype correlation explains it: the
    most N-terminal and the most C-terminal reported variants both produce eye
    disease, and cohort ascertainment route rather than allele position
    predicts the reported eye involvement rate. Resolving this bears directly
    on counseling, since a parent with an isolated unilateral eye anomaly may
    carry the same allele as a severely affected child.
  proposed_experiments:
  - experiment_id: prr12-eye-somatic-asymmetry
    name: Somatic and allele-specific analysis of discordant fellow eyes
    description: >-
      In individuals with unilateral disease from whom ocular tissue is
      available at surgery, compare somatic variant burden and allele-specific
      PRR12 expression between the malformed and the structurally normal eye to
      test whether a somatic second hit or skewed allelic expression explains
      the laterality.
    readouts:
    - name: Difference in somatic variant burden and PRR12 allelic ratio between fellow eyes
      target: "pathophysiology#Disrupted Ocular Morphogenesis"
  - experiment_id: prr12-eye-stochastic-threshold
    name: Left-right concordance test in a bilateral eye-development model
    description: >-
      Model PRR12 haploinsufficiency in a system that forms bilateral optic
      vesicles and score left-right concordance of the malformation against the
      concordance predicted by a stochastic-threshold model versus a
      deterministic dosage model.
    readouts:
    - name: Left-right concordance rate of optic vesicle malformation
      target: "pathophysiology#Disrupted Ocular Morphogenesis"
  - experiment_id: prr12-eye-modifier-screen
    name: Modifier screen in PRR12 carriers stratified by eye involvement
    description: >-
      Test for enrichment of rare and common variants in known MAC and
      anterior-segment-dysgenesis genes in PRR12 loss-of-function carriers,
      stratified by presence, severity, and laterality of eye involvement.
    readouts:
    - name: Modifier allele burden by eye-involvement stratum
      target: "pathophysiology#MAC-Spectrum and Anterior Segment Eye Malformation"
- discussion_id: prr12_cohesin_human_relevance
  prompt: >-
    Does the PRR12-NIPBL/cohesin interaction and its DNA double-strand break
    phenotype, demonstrated principally in mouse NIH-3T3 cells, operate in the
    human developmental contexts that are affected in PRR12-related neuroocular
    syndrome?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired NIPBL-Cohesin Cooperation and Genomic Instability
  rationale: >-
    The cohesin finding is the first concrete molecular function assigned to
    PRR12 and would reclassify this disorder as a cohesinopathy adjacent to
    NIPBL-related Cornelia de Lange syndrome. But the evidence is explicitly
    context dependent: the authors report that human HeLa cells are less
    sensitive to PRR12 loss than mouse NIH-3T3 cells. Neither cell type is a
    neural progenitor, an optic vesicle cell, or a patient-derived line, and
    neither is heterozygous in the way patients are, since the experiments used
    complete loss rather than haploinsufficiency. Evidence for the mechanism
    therefore exists, but its translational validity to the human developmental
    phenotype is the open question, which is what distinguishes this from a
    plain absence of evidence. If the human requirement for PRR12 in cohesin
    loading is genuinely weak, the transcriptional-cofactor hypothesis remains
    the better explanation for the malformation pattern.
  proposed_experiments:
  - experiment_id: prr12-cohesin-patient-cells
    name: Cohesin and DNA damage phenotype in patient-derived human cells
    description: >-
      Test cohesin localization and double-strand break accumulation in PRR12
      heterozygous patient-derived iPSCs and in iPSC-derived neural progenitors
      and retinal organoids, rather than in immortalized cell lines, and at
      heterozygous rather than null dosage.
    readouts:
    - name: Cohesin chromatin occupancy and double-strand break burden in patient-derived neural and retinal cells
      target: "pathophysiology#Impaired NIPBL-Cohesin Cooperation and Genomic Instability"
  - experiment_id: prr12-vs-nipbl-comparison
    name: Direct comparison of PRR12 and NIPBL haploinsufficiency
    description: >-
      Compare the transcriptomic and chromatin-architecture consequences of
      PRR12 haploinsufficiency with those of NIPBL haploinsufficiency in the
      same human cell type to test the cohesinopathy classification directly.
    readouts:
    - name: Overlap of differentially expressed genes and altered chromatin contacts between PRR12 and NIPBL haploinsufficiency
      target: "pathophysiology#Impaired NIPBL-Cohesin Cooperation and Genomic Instability"
  - experiment_id: prr12-cdls-rephenotyping
    name: Systematic re-phenotyping for Cornelia de Lange features
    description: >-
      Assess whether individuals with PRR12-related neuroocular syndrome show
      any Cornelia de Lange-associated features such as characteristic facies,
      limb reduction defects, hirsutism, or gastroesophageal reflux on
      systematic re-phenotyping, which would clinically corroborate the
      cohesinopathy hypothesis.
    readouts:
    - name: Frequency of Cornelia de Lange-associated features in PRR12 carriers
      target: "pathophysiology#Impaired NIPBL-Cohesin Cooperation and Genomic Instability"
- discussion_id: prr12_ascertainment_bias
  prompt: >-
    What are the true population frequencies of eye involvement and cognitive
    impairment in PRR12 haploinsufficiency, once ascertainment bias is removed?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - phenotypes#Developmental delay and impaired intellectual development
  - phenotypes#Microphthalmia
  rationale: >-
    The two principal cohorts disagree sharply in a way that is fully explained
    by how they were assembled. The neurodevelopmental matchmaking cohort
    reports developmental impairment in 100 percent and structural eye defects
    in 50 percent; the ophthalmic-genetics MAC and anterior-segment cohort
    reports eye defects in 100 percent, normal development and cognition in two
    of five, and no neuropsychiatric diagnoses at all. Both sets of figures are
    conditional on the ascertaining phenotype and neither is a population
    estimate. The curated frequency bands in this entry inherit that bias and
    should be revised when an unbiased series exists.
  proposed_experiments:
  - experiment_id: prr12-unbiased-cohort
    name: Ascertainment-neutral PRR12 variant cohort
    description: >-
      Assemble a PRR12 loss-of-function carrier cohort from unselected genome
      sequencing, such as a population biobank or newborn sequencing programme,
      rather than from phenotype-driven referral, and re-derive feature
      frequencies for eye involvement, cognition, and organ malformation.
    readouts:
    - name: Ascertainment-neutral frequency of structural eye defect and of developmental impairment
      target: "phenotypes#Microphthalmia"
  - experiment_id: prr12-relative-examination
    name: Ophthalmological examination of first-degree relatives
    description: >-
      Systematically examine all first-degree relatives of probands with slit
      lamp, dilated fundoscopy, and axial length measurement to detect mildly
      or unilaterally affected transmitting carriers who would otherwise be
      classified as unaffected.
    readouts:
    - name: Proportion of clinically unaffected first-degree relatives with a detectable subclinical ocular anomaly
      target: "pathophysiology#MAC-Spectrum and Anterior Segment Eye Malformation"

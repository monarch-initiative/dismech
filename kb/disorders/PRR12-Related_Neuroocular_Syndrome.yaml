name: PRR12-Related Neuroocular Syndrome
creation_date: "2026-08-01T12:00:00Z"
description: >-
  PRR12-related neuroocular syndrome (neuroocular syndrome 1, NOC1) is a rare
  autosomal dominant neurodevelopmental disorder caused by heterozygous
  loss-of-function variants in PRR12, which encodes a proline-rich,
  chromatin-associated nuclear protein expressed in the developing brain and
  visual system. Developmental impairment is the one near-constant finding;
  the ocular phenotype is strikingly variable, spanning the
  anophthalmia-microphthalmia-coloboma (MAC) spectrum together with anterior
  segment dysgenesis (Peters anomaly, stellate iris pattern, iris coloboma)
  and optic nerve anomalies, and is present in only about half of reported
  individuals. Additional common features are hypotonia, congenital heart
  defects, growth failure or short stature, kidney anomalies, microcephaly,
  dysmorphic features, and neuropsychiatric problems including autism, ADHD,
  and anxiety. The disorder was delineated only in 2018-2021 and fewer than
  forty individuals have been reported, so the phenotypic boundaries are
  still being defined.
category: Mendelian
parents:
- hereditary disease
- syndromic microphthalmia
synonyms:
- neuroocular syndrome 1
- NOC1
- PRR12 haploinsufficiency
- PRR12-related disorder
- multiple congenital anomalies-neurodevelopmental delay-ocular abnormalities syndrome
disease_term:
  preferred_term: PRR12-related neuroocular syndrome
  term:
    id: MONDO:0971007
    label: neuroocular syndrome 1
notes: >-
  Naming. MONDO and OMIM 619539 label this entity "neuroocular syndrome 1" as
  part of a numbered series under the MONDO grouping "neuroocular syndrome"
  MONDO:0859193. This entry uses the gene-anchored clinical name
  "PRR12-related neuroocular syndrome" for three reasons. First, it matches
  the way the primary literature refers to the condition, which is
  consistently gene-first. Second, the bare phrase "neuroocular syndrome" is
  ambiguous in PubMed: the overwhelming majority of indexed hits for it are
  spaceflight-associated neuro-ocular syndrome, a mechanistically unrelated
  microgravity disorder already curated separately in dismech as
  "Spaceflight Associated Neuro-Ocular Syndrome". Third, numbered disease
  series are a documented named-entity-confusion risk for automated curation.
  The MONDO binding is unchanged, so the identifier remains authoritative
  while the display name is unambiguous. This follows the gene-anchored
  convention already used by the sibling entries
  "RARB-related syndromic microphthalmia" and
  "STRA6-related syndromic microphthalmia".

  Scope relative to other MAC entries. PRR12 is one of more than 100 genes in
  the microphthalmia/anophthalmia/coloboma and anterior-segment-dysgenesis
  spectrum. This entry covers the PRR12-specific syndromic disorder. The
  gene-agnostic isolated form is curated separately as
  "Isolated Anophthalmia-Microphthalmia Syndrome" MONDO:0016764, and the
  SOX2, OTX2, RAX, and STRA6 forms are distinct entities; those genes are not
  implicated in this disorder and were explicitly excluded during the
  named-entity-confusion preflight.

  No GeneReviews chapter exists for PRR12 or for neuroocular syndrome 1; a
  PubMed search for "PRR12 GeneReviews" returned no results on 2026-08-01, so
  no GeneReviews phenotype baseline was available.

  Full-text-only findings. The Edison/falcon deep-research run for this entry
  performed a full-text read of the delineating cohort study, PMID:33824499,
  whose PubMed record is abstract-only. Several clinically useful figures
  therefore appear in the report but cannot be snippet-verified against the
  cached abstract and are recorded here as prose rather than as evidence
  items, per the project SOP. From that full text: developmental impairment
  comprised global developmental delay in 17, isolated motor delay in 3, and
  isolated speech-language delay in 4; intellectual disability was present in
  all 11 individuals older than seven years; coloboma occurred in 7 of 24
  (iris most often, but also optic nerve, macula, chorioretina, and lens);
  anophthalmia or microphthalmia in 4 of 24; visual impairment in 17 of 22
  assessed; strabismus in 8 of 22; microcephaly in 7 of 24; cryptorchidism in
  5 of 13 males; cleft palate in 4 of 24; intestinal malrotation in 2 of 24.
  The 12 cardiac defects comprised six atrial septal defects, two ventricular
  septal defects, and three pulmonary stenoses. Renal findings included
  hydronephrosis, duplicated ureter, and vesicoureteral reflux. Facial
  features (wide-set eyes, epicanthal folds, low-set ears, upturned nasal
  tip, thin vermilion) each occurred in at least a quarter of individuals but
  the authors found no recognizable gestalt. Constraint metrics were pLI
  1.00, observed/expected loss-of-function 0.0, and LOEUF 0.051. The protein
  contains two predicted AT-hook DNA-binding domains, and candidate
  interactors USP7, SOX2, and ESR2 were nominated but explicitly described
  as experimentally unproven. Ages spanned 5 months to 36 years.

  Ascertainment bias is a live caveat. The largest cohort was assembled
  through neurodevelopmental matchmaking platforms (PMID:33824499) while the
  deepest ocular phenotyping comes from an ophthalmic-genetics MAC and
  anterior-segment-dysgenesis cohort (PMID:33314030). The two routes report
  very different rates of both eye involvement and cognitive impairment, so
  the curated feature frequencies should be read as cohort-conditional
  rather than population estimates. See the prr12_ascertainment_bias
  discussion.
inheritance:
- name: Autosomal dominant inheritance
  description: >-
    Disease results from a single heterozygous loss-of-function PRR12 allele.
    Most reported variants arose de novo, but the first dominantly
    transmitted allele, a splice-site variant segregating from an affected
    mother to her affected daughter, confirms germline transmission, and
    somatic mosaicism has been documented in at least one individual.
    Recurrence risk for unaffected parents of a de novo case is low but not
    zero because parental germline mosaicism cannot be excluded.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:29556724
    reference_title: "De novo apparent loss-of-function mutations in PRR12 in three patients with intellectual disability and iris abnormalities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we report on three unrelated patients with heterozygous de novo apparent loss-of-function mutations in PRR12 detected by clinical whole exome sequencing"
    explanation: The founding series establishes heterozygous de novo PRR12 variants as the disease mechanism, that is, dominant inheritance.
  - reference: PMID:33314030
    reference_title: "Dominant variants in PRR12 result in unilateral or bilateral complex microphthalmia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified four novel pathogenic loss-of-function alleles in PRR12 in families affected by complex microphthalmia and/or Peters anomaly, including two de novo, the first dominantly transmitted allele, as well as the first splicing variant."
    explanation: Documents the first parent-to-child transmitted PRR12 allele, confirming autosomal dominant inheritance rather than exclusively de novo occurrence.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Fewer than forty individuals have been reported since the disorder was
    delineated. The largest series brought the published total to 24
    individuals; a separate ophthalmic-genetics cohort added five more, and
    subsequent single-case reports from China, the United States, and Egypt
    have added a handful. No population-based prevalence estimate, incidence
    figure, founder effect, or ethnic enrichment has been described.
  evidence:
  - reference: PMID:33824499
    reference_title: "Haploinsufficiency of PRR12 causes a spectrum of neurodevelopmental, eye, and multisystem abnormalities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We add 21 individuals with similar PRR12 variants identified via matchmaking platforms, bringing the total number to 24."
    explanation: Establishes the published case count at the time of the delineating cohort study.
- population: Individuals with genetically unsolved microphthalmia, anophthalmia, or coloboma
  measure_type: PERIOD_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 2200.0
  notes: >-
    Diagnostic yield rather than population prevalence: PRR12 loss-of-function
    variants accounted for 2.2 percent of previously unsolved MAC cases, and
    3.5 percent of unilateral MAC cases, in a research exome cohort. Recorded
    here because it is the only quantitative occurrence figure available and
    it establishes PRR12 as a non-negligible contributor to unilateral eye
    malformation, which historically has a very low genetic diagnostic rate.
  evidence:
  - reference: PMID:33314030
    reference_title: "Dominant variants in PRR12 result in unilateral or bilateral complex microphthalmia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this cohort, the apparent loss-of-function variants in PRR12 explained 4/182 (2.2%) of unsolved MAC including 2/57 (3.5%) cases with unilateral MAC."
    explanation: Quantifies the contribution of PRR12 to genetically unsolved microphthalmia, anophthalmia, and coloboma.
pathophysiology:
- name: PRR12 Truncating Variant with Nonsense-Mediated Decay
  biological_scale: MOLECULAR
  description: >-
    Nearly all reported pathogenic PRR12 alleles are protein-truncating:
    frameshift, nonsense, and splice-site variants, plus whole-gene deletion
    and a balanced translocation that disrupts the locus. Because the
    premature termination codons fall well upstream of the final exon-exon
    junction, the mutant transcripts are predicted to be degraded by
    nonsense-mediated decay; if decay is escaped, the residual protein is
    severely truncated and functionally deficient. Either route removes one
    functional copy of the gene, so the operative lesion is allele loss
    rather than a dominant-negative or gain-of-function protein.
  genes:
  - preferred_term: PRR12
    term:
      id: hgnc:29217
      label: PRR12
  evidence:
  - reference: PMID:33824499
    reference_title: "Haploinsufficiency of PRR12 causes a spectrum of neurodevelopmental, eye, and multisystem abnormalities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We observed 12 frameshift, 6 nonsense, 1 splice-site, and 2 missense variants and one patient with a gross deletion involving PRR12."
    explanation: Documents the predominantly truncating variant spectrum, including a whole-gene deletion consistent with allele loss.
  - reference: PMID:33314030
    reference_title: "Dominant variants in PRR12 result in unilateral or bilateral complex microphthalmia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All variants reported thus far are predicted to result in protein truncation and are likely subject to nonsense mediated decay, thus haploinsufficiency represents the most likely disease mechanism."
    explanation: States the nonsense-mediated-decay route from truncating allele to haploinsufficiency.
  - reference: PMID:26163108
    reference_title: "A de novo t(10;19)(q22.3;q13.33) leads to ZMIZ1/PRR12 reciprocal fusion transcripts in a girl with intellectual disability and neuropsychiatric alterations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The resulting hybrid transcripts predict mRNA decay or, if translated, formation of truncated proteins, both due to frameshifts that introduced premature stop codons."
    explanation: A structural rearrangement disrupting PRR12 converges on the same decay-or-truncation outcome, independent of point mutation.
  downstream:
  - target: PRR12 Haploinsufficiency
    description: Loss of one functional allele halves the dose of PRR12 protein.
- name: PRR12 Haploinsufficiency
  biological_scale: MOLECULAR
  description: >-
    PRR12 is highly intolerant of loss-of-function variation in population
    databases, so a single inactivated allele is not buffered. The gene
    encodes a proline-rich nuclear protein with suspected DNA-binding
    activity whose expression in the fetal brain and visual system is
    consistent with a dosage-sensitive developmental role. Reduced predicted
    PRR12 expression is itself associated with eye and kidney phenotypes in a
    transcriptome-imputation (PrediXcan) analysis of electronic health record
    phecodes, providing human genetic support for dosage sensitivity that is
    independent of the rare-variant case series.

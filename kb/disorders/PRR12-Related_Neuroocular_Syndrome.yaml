    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "prr12a is expressed early in zygotic development, mainly in the central nervous system, while prr12b expression initiates during gastrulation, localizing later to dopaminergic telencephalic and diencephalic cell clusters."
    explanation: Zebrafish co-orthologs are expressed in the developing central nervous system, consistent with a conserved neurodevelopmental role.
  downstream:
  - target: Neurodevelopmental Impairment
    description: Abnormal brain development manifests as developmental delay and intellectual disability.
- name: Disrupted Ocular Morphogenesis
  biological_scale: TISSUE
  description: >-
    PRR12 is expressed in the developing visual system, and in zebrafish both
    co-orthologs are enriched in the ganglion cell and inner neural layers of
    the larval retina, with one also present in the ciliary marginal zone.
    Reduced PRR12 dosage during ocular morphogenesis produces a graded set of
    malformations: at the severe end failure of optic vesicle growth
    (anophthalmia and microphthalmia, in the most severe reported case with
    absent optic nerves, tracts, and chiasm), at the intermediate level failure
    of optic fissure closure (coloboma) and anterior segment dysgenesis (Peters
    anomaly, Rieger anomaly, stellate iris, microcornea), and at the mild end
    isolated iris, foveal, retinal, or optic nerve anomalies. A distinctive and
    unexplained feature is marked asymmetry: the malformation is frequently
    unilateral with a structurally normal contralateral eye, implying a
    stochastic or threshold-dependent rather than uniformly deterministic
    effect of the reduced dosage.

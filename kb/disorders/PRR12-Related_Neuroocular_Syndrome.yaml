  evidence:
  - reference: PMID:39742660
    reference_title: "Co-essentiality analysis identifies PRR12 as a cohesin interacting protein and contributor to genomic integrity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We show that PRR12 interacts with NIPBL/MAU2 and the cohesin complex, and that the loss of PRR12 results in reduced cohesin localization and a substantial increase in DNA double-strand breaks in mouse NIH-3T3 cells."
    explanation: Establishes the physical and functional link between PRR12, the NIPBL/MAU2 cohesin loader, and genome integrity.
  - reference: PMID:39742660
    reference_title: "Co-essentiality analysis identifies PRR12 as a cohesin interacting protein and contributor to genomic integrity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "PRR12 co-localizes with NIPBL to sites of DNA damage in a NIPBL and cohesin-dependent manner."
    explanation: Places PRR12 downstream of NIPBL and cohesin in the DNA damage response.
  - reference: PMID:39742660
    reference_title: "Co-essentiality analysis identifies PRR12 as a cohesin interacting protein and contributor to genomic integrity."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "We find that the requirement for PRR12 differs across cell lines, with human HeLa cells exhibiting reduced sensitivity to PRR12 loss compared with mouse NIH-3T3 cells, indicating context-specific roles."
    explanation: The authors' own caveat that PRR12 dependence is context specific and weaker in the human cell line tested, which limits direct extrapolation to human disease.
  downstream:
  - target: Disrupted Neural Development
    hypothesis_groups:
    - cohesin_nipbl_axis
    description: >-
      Impaired cohesin function and accumulating DNA damage in neural
      progenitors as a candidate route to the neurodevelopmental phenotype.
- name: Disrupted Neural Development
  biological_scale: TISSUE
  description: >-
    PRR12 is expressed in the nucleus of developing mouse and human brain, most
    strongly in fetal relative to adult brain, and in the zebrafish central
    nervous system from early development, with later expression in cerebellum,
    amygdala, and ventral telencephalon. Reduced dosage during forebrain
    development is the presumed substrate for the universal developmental
    impairment, the hypotonia, the microcephaly seen in a subset, and the
    neuropsychiatric features. Neural progenitor involvement is inferred from
    developmental expression rather than demonstrated in patient tissue.

  description: >-
    The clinical endpoint of the neural arm: developmental delay or impaired
    intellectual development, present in every individual in the delineating
    cohort, together with hypotonia and neuropsychiatric comorbidity. Severity
    ranges from mild learning difficulty to non-verbal cognitive impairment
    requiring full assistance, and a minority of individuals ascertained
    through ophthalmology have entirely normal development. The congenital
    malformations are static, but developmental capabilities may improve with
    maturation and intervention; no prospective natural-history data exist.

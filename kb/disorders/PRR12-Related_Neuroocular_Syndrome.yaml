  locations:
  - preferred_term: eye
    term:
      id: UBERON:0000970
      label: eye
  evidence:
  - reference: PMID:33824499
    reference_title: "Haploinsufficiency of PRR12 causes a spectrum of neurodevelopmental, eye, and multisystem abnormalities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Variable structural eye defects were observed in 12/24 individuals (50%) including anophthalmia, microphthalmia, colobomas, optic nerve and iris abnormalities."
    explanation: Defines the structural ocular malformation spectrum and its incomplete penetrance in the delineating cohort.
  - reference: PMID:33314030
    reference_title: "Dominant variants in PRR12 result in unilateral or bilateral complex microphthalmia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Remarkably, ocular phenotypes were asymmetric in all individuals and unilateral (with structurally normal contralateral eye) in three."
    explanation: Documents the characteristic asymmetry and unilaterality of the PRR12 eye malformation.
  - reference: PMID:38674426
    reference_title: "Shedding a Light on Dark Genes: A Comparative Expression Study of PRR12 Orthologues during Zebrafish Development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Both transcripts are enriched in the ganglion cell and inner neural layers of the 72 hpf retina, with prr12b widely distributed in the ciliary marginal zone."
    explanation: Retinal expression of the zebrafish co-orthologs supports a direct role for PRR12 in eye development.
  downstream:

mechanistic_hypotheses:
- hypothesis_group_id: transcriptional_cofactor
  hypothesis_label: PRR12 as a dosage-sensitive nuclear transcriptional cofactor
  status: CANONICAL
  description: >-
    The prevailing model: PRR12 is a nuclear, AT-hook-containing DNA-binding
    proline-rich protein acting as a transcriptional cofactor, and halving its
    dosage perturbs the developmental transcriptional programs of the brain,
    eye, heart, and kidney. It is the default explanation in every clinical
    report, but it is an inference from subcellular localization, expression
    pattern, domain prediction, and coexpression neighborhood rather than from
    demonstrated target genes or partner complexes; candidate interactors such
    as USP7, SOX2, and ESR2 have been nominated but are explicitly described by
    the delineating authors as experimentally unproven, and the primary
    literature continues to describe PRR12 as a gene of largely unknown
    function.
  evidence:
  - reference: PMID:33314030
    reference_title: "Dominant variants in PRR12 result in unilateral or bilateral complex microphthalmia."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "PRR12 encodes a Proline-Rich Protein 12 of unknown function. Current evidence suggests that PRR12 functions as a cofactor in transcriptional regulation within the nucleus"
    explanation: States the hypothesis and simultaneously flags that the protein's function is unknown.
  - reference: PMID:29556724
    reference_title: "De novo apparent loss-of-function mutations in PRR12 in three patients with intellectual disability and iris abnormalities."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "PRR12 encodes a proline-rich protein nuclear factor suspected to be involved in neural development."
    explanation: A nuclear-factor role in neural development is suspected rather than demonstrated.
- hypothesis_group_id: cohesin_nipbl_axis
  hypothesis_label: PRR12 as a NIPBL/cohesin cofactor and genome-integrity factor
  status: EMERGING
  description: >-
    A 2025 co-essentiality screen recast PRR12 as a cohesin-associated protein
    that binds the NIPBL/MAU2 loader, supports cohesin localization, and limits
    DNA double-strand break accumulation. If this is the operative mechanism in
    patients, PRR12-related neuroocular syndrome would belong mechanistically
    with the cohesinopathies such as NIPBL-related Cornelia de Lange syndrome,
    which would predict shared features (growth failure, developmental
    impairment, multisystem malformation) that the observed clinical picture is
    at least compatible with. The hypothesis has not been tested in patient
    cells or in a developmental context, and the authors themselves report that
    the requirement for PRR12 is cell-line dependent and weaker in the human
    line they tested. See the prr12_cohesin_human_relevance discussion.
  evidence:
  - reference: PMID:39742660
    reference_title: "Co-essentiality analysis identifies PRR12 as a cohesin interacting protein and contributor to genomic integrity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "by analyzing patterns of similar gene requirements across cell lines, we identify PRR12 as a mediator of cohesin and genome integrity"
    explanation: The finding that generates this hypothesis.
  - reference: PMID:39742660
    reference_title: "Co-essentiality analysis identifies PRR12 as a cohesin interacting protein and contributor to genomic integrity."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "Together, our work identifies PRR12 as a regulator of cohesin and provides insight into how genome integrity is maintained across diverse cellular contexts."
    explanation: The claim is framed as general cell biology, not as a disease mechanism, so it supports the hypothesis only partially.
genetic:
- name: PRR12
  association: Heterozygous loss-of-function variant, usually de novo
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: PRR12
    term:
      id: hgnc:29217
      label: PRR12
  notes: >-
    Reported pathogenic alleles are overwhelmingly protein-truncating -
    frameshift, nonsense, and splice-site variants distributed across the gene
    from exon 4 to exon 13 of 14 - plus one gross deletion, two missense
    variants of less certain effect, and a balanced t(10;19) translocation
    generating ZMIZ1/PRR12 fusion transcripts. Most arose de novo; one
    splice-site allele was transmitted from an affected mother, and one
    frameshift allele showed skewed allele fractions on exome, genome, and
    Sanger sequencing consistent with somatic mosaicism. Co-occurring
    independent genetic diagnoses have been reported and can confound the
    phenotype, so a PRR12 finding does not exclude a second contributing
    variant.

    Transcript and allele detail from the delineating study's full text, not
    abstract-verifiable and therefore recorded here rather than as evidence
    items. The reference transcript is NM_020719.3 / ENST00000418929.7. A
    shorter transcript, ENST00000615927.1, encodes an approximately 130 kDa
    1,215-amino-acid isoform lacking exons 1 to 3 and most of exon 4; eight of
    the reported variants were predicted to spare this short isoform, but no
    statistically significant phenotypic difference was found between the
    isoform-sparing and isoform-disrupting groups, so isoform status is not
    currently a useful genotype-phenotype axis. Twenty-one distinct sequence
    variants were reported, including the recurrent c.1521T>G p.Tyr507* and
    c.3273delC p.Lys1092Argfs*131. The two missense alleles, c.3505C>T
    p.Arg1169Trp and c.5909T>C p.Leu1970Pro, had PolyPhen-2 scores of 0.998 and
    1.000 but remain less well supported mechanistically than the truncating
    alleles, since haploinsufficiency is inferred from truncation rather than
    demonstrated for missense change. Constraint metrics are pLI 1.00, an
    observed-to-expected loss-of-function ratio of 0.0 with a 90 percent
    confidence interval of 0 to 0.05, and LOEUF 0.051, with a missense Z score
    of 2.98. The gross-deletion case is confounded by loss of 146 other
    annotated genes including PPP2R1A, so it supports the locus but not PRR12
    specifically. No validated modifier gene or methylation episignature has
    been established, and no somatic disease mechanism is reported.
  evidence:
  - reference: PMID:33824499
    reference_title: "Haploinsufficiency of PRR12 causes a spectrum of neurodevelopmental, eye, and multisystem abnormalities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We observed 12 frameshift, 6 nonsense, 1 splice-site, and 2 missense variants and one patient with a gross deletion involving PRR12."
    explanation: Defines the pathogenic allelic spectrum in the largest reported cohort.
  - reference: PMID:33824499
    reference_title: "Haploinsufficiency of PRR12 causes a spectrum of neurodevelopmental, eye, and multisystem abnormalities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three individuals had additional genetic findings, possibly confounding the phenotype."
    explanation: Documents that co-occurring genetic diagnoses complicate genotype-phenotype attribution in this disorder.
  - reference: PMID:41357555
    reference_title: "De Novo GUCY2C and PRR12 Mutations in a Patient With Chronic Diarrhea, Small Bowel Obstructions, and Developmental Delay."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A co-occurring de novo PRR12 c.768del (p.Ala257Leufs*58) frameshift mutation explained his developmental delay."
    explanation: A worked example of dual molecular diagnosis in which the PRR12 frameshift accounts specifically for the neurodevelopmental component.
  - reference: PMID:26163108
    reference_title: "A de novo t(10;19)(q22.3;q13.33) leads to ZMIZ1/PRR12 reciprocal fusion transcripts in a girl with intellectual disability and neuropsychiatric alterations."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "fine mapping of breakpoints by array painting disclosed disruptions of the zinc finger, MIZ-type containing 1 (ZMIZ1) (on chr10) and proline-rich 12 (PRR12) (on chr19) genes"
    explanation: A structural variant disrupting PRR12; marked PARTIAL because the translocation simultaneously disrupts ZMIZ1, which is itself a neurodevelopmental disease gene, so causal attribution to PRR12 alone is not clean.
  - reference: PMID:41953648
    reference_title: "Exploring the molecular basis of microphthalmia and anophthalmia: Insights from an Egyptian cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The implicated genes were SOX2, OTX2, CHD7, HMX1, PRR12, ATOH7, ZBTB11, B3GALNT2, GCNT2, DPH1, GJA8, FRAS1 and UBE3B."
    explanation: Independent replication of PRR12 as a microphthalmia and anophthalmia gene in a non-European cohort.

pathophysiology:
- name: Biallelic KITLG Variants Reducing KIT Ligand Signalling
  conforms_to: "neural_crest_melanocyte_deficiency#Neural Crest Melanocyte Program Disruption"
  biological_scale: MOLECULAR
  description: >-
    Homozygous germline KITLG variants reduce the KIT ligand signal available to
    KIT-expressing melanoblasts. This is the KITLG substitution at the module's
    trigger node, the ligand-side counterpart of KIT loss of function in
    piebaldism. The reduction is inferred from variant class rather than
    measured: the case-series authors propose that complete loss of function
    produces generalized hypomelanosis and that alleles retaining some function
    produce the Waardenburg-like and piebaldism-like presentations, and no
    functional assay of the recessive alleles has been reported.

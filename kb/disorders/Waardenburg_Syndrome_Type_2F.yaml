- name: Reduced Melanoblast Survival, Proliferation and Colonization
  conforms_to: "neural_crest_melanocyte_deficiency#Melanoblast Migration and Survival Defect"
  biological_scale: CELLULAR
  description: >-
    With too little KIT ligand, melanoblasts emerging from the neural crest
    survive and proliferate poorly, so fewer reach and persist in the skin, hair
    follicles, iris and the developing inner ear. Steel mouse studies place the
    defect at survival and proliferation, and at arrival in target tissue,
    rather than at early migration or initial differentiation. The number of
    melanoblasts that reach each tissue varies, which is the proposed basis for
    the patchy, asymmetric and variable human phenotype.

    reference_title: Waardenburg Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Although no curative treatment is available, supportive care may include
      cochlear implantation and surgical management of associated conditions,
      such as Hirschsprung disease.
    explanation: >-
      Cochlear implantation as supportive care in Waardenburg syndrome
      generally; not specific to the KITLG form.
  - reference: PMID:41450428
    reference_title: Long-Term Hearing, Language, and Educational Outcomes After Cochlear
      Implantation in Children With Waardenburg Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Early CI in children with WS contributes to substantial improvements in

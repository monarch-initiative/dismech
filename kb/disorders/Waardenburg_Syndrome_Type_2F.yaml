genetic:
- name: KITLG
  gene_term:
    preferred_term: KITLG
    term:
      id: hgnc:6343
      label: KITLG
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    KITLG encodes KIT ligand (stem cell factor), produced as a transmembrane and
    a soluble isoform. Direction of effect and zygosity sort KITLG variants into
    distinct disorders: homozygous variants cause this disease; heterozygous
    loss-of-function variants cause isolated, often unilateral or asymmetric,
    sensorineural hearing loss (autosomal dominant nonsyndromic hearing loss
    69) with reduced penetrance; and heterozygous gain-of-function variants
    clustered in the receptor-binding VTNNV motif cause familial progressive
    hyperpigmentation with or without hypopigmentation. No ClinGen gene-disease
    validity record for KITLG is present in references_cache, so
    gene_disease_validity is left unset.
  evidence:
  - reference: PMID:35543077
    reference_title: Biallelic KITLG variants lead to a distinct spectrum of hypomelanosis
      and sensorineural hearing loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We provide consolidating evidence that biallelic KITLG variants cause a
      distinct auditory-pigmentary disorder.
    explanation: >-
      Establishes KITLG as the causal gene for the recessive disorder.
  - reference: PMID:35543077
    reference_title: Biallelic KITLG variants lead to a distinct spectrum of hypomelanosis
      and sensorineural hearing loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pathogenic variants in KITLG, a crucial protein involved in pigmentation
      and neural crest cell migration, cause non-syndromic hearing loss,
      Waardenburg syndrome type 2, familial progressive hyperpigmentation and
      familial progressive hyper- and hypopigmentation, all of which are
      inherited in an autosomal dominant manner.
    explanation: >-
      The allelic series at KITLG against which this disease is delimited.
  - reference: PMID:26522471
    reference_title: Allelic Mutations of KITLG, Encoding KIT Ligand, Cause Asymmetric
      and Unilateral Hearing Loss and Waardenburg Syndrome Type 2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A heterozygous missense mutation, c.310C>G (p.Leu104Val), that segregated
      with WS2 was identified in a small family.
    explanation: >-
      The first KITLG association with Waardenburg syndrome type 2, in a single
      heterozygous family.
differential_diagnoses:
- name: Autosomal dominant nonsyndromic hearing loss 69
  disease_term:
    preferred_term: autosomal dominant nonsyndromic hearing loss 69
    term:
      id: MONDO:0014738
      label: autosomal dominant nonsyndromic hearing loss 69
  description: >-
    The heterozygous loss-of-function allelic disorder of KITLG: congenital,
    stable, unilateral, asymmetric or bilateral sensorineural hearing loss with
    reduced penetrance, where pigmentary changes are absent or nonspecific. It
    is distinguished from this disease by zygosity and by the absence of the
    Waardenburg pigmentary phenotype.
  distinguishing_features:
  - Heterozygous rather than homozygous KITLG variants
  - Hearing loss without the Waardenburg pattern of hypomelanosis
  evidence:
  - reference: PMID:26522471
    reference_title: Allelic Mutations of KITLG, Encoding KIT Ligand, Cause Asymmetric
      and Unilateral Hearing Loss and Waardenburg Syndrome Type 2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This mutation co-segregated with NS-UHL/AHL as a dominant trait with
      reduced penetrance.
    explanation: >-
      Dominant, incompletely penetrant, nonsyndromic unilateral or asymmetric
      hearing loss from a heterozygous KITLG truncating variant.
  - reference: PMID:39918572
    reference_title: Unilateral, bilateral symmetric or asymmetric isolated hearing
      loss in patients with heterozygous KITLG variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Penetrance is not complete, and unspecific pigmentation alterations were
      observed in only three patients.
    explanation: >-
      Confirms that heterozygous KITLG hearing loss is incompletely penetrant
      and largely lacks pigmentary findings.
- name: Familial progressive hyperpigmentation with or without hypopigmentation
  disease_term:
    preferred_term: familial progressive hyperpigmentation with or without hypopigmentation
    term:
      id: MONDO:0007771
      label: hyperpigmentation with or without hypopigmentation, familial progressive
  description: >-
    The gain-of-function allelic disorder of KITLG. Heterozygous substitutions
    at the receptor-binding surface increase KIT signalling and cause
    progressive diffuse hyperpigmentation, sometimes with pale macules, without
    hearing loss. It is the mirror image of this disease in both direction of
    effect and pigmentary phenotype.
  distinguishing_features:
  - Heterozygous gain-of-function rather than homozygous KITLG variants
  - Progressive hyperpigmentation rather than hypomelanosis
  - No sensorineural hearing loss
  evidence:
  - reference: PMID:35543077
    reference_title: Biallelic KITLG variants lead to a distinct spectrum of hypomelanosis
      and sensorineural hearing loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Gain-of-function variants in KITLG are also associated with familial
      progressive hyperpigmentation (FPH)
    explanation: >-
      Identifies the gain-of-function KITLG phenotype as an allelic disorder.
- name: Piebaldism
  disease_term:
    preferred_term: piebaldism
    term:
      id: MONDO:0008244
      label: piebaldism
  description: >-
    The receptor-side counterpart: heterozygous KIT loss of function causes
    congenital, stable, regional leukoderma and a white forelock, and hearing
    loss is rare. Two individuals with homozygous KITLG variants had symmetric
    lower-limb hypomelanosis reminiscent of piebaldism, so the two can overlap
    clinically.
  distinguishing_features:
  - KIT rather than KITLG variants, and autosomal dominant inheritance
  - Hearing loss is rare in piebaldism and nearly constant in this disease
  evidence:

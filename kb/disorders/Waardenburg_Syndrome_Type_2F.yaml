animal_models:
- name: Steel-dickie (Sl/Sld) mouse
  species: Mouse
  genotype: Kitl Sl/Sld compound heterozygote
  description: >-
    Steel mutations are alleles of Kitl, the mouse ortholog of KITLG. Sld
    lacks the membrane-bound form of the ligand. Sl/Sld mice are deaf with
    absent strial intermediate cells. Sld/Sld mice are viable and lack coat
    pigmentation, and in Sld/Sld embryos melanoblasts fail to survive and fewer
    reach the inner ear.
  publication: PMID:2460075
  evidence:
  - reference: PMID:2460075
    reference_title: Intermediate filaments in the cochleas of normal and mutant (w/wv,
      sl/sld) mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In contrast, vimentin was seen to stain only the basal cells in the mutant
      mice, confirming our previous findings of the absence of intermediate cells
      in these cases of hereditary deafness.
    explanation: >-
      Absent strial intermediate cells in deaf Sl/Sld mice.
  modeled_mechanisms:
  - target: Strial Intermediate Cell Deficiency
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Sl/Sld mice lack strial intermediate cells and are deaf, the cochlear
      mechanism proposed for human KITLG hearing loss.
    limitations: >-
      Sl/Sld is a compound heterozygote of a severe allele and an allele that
      removes the membrane-bound isoform, not a model of the human homozygous
      missense or truncating alleles. Steel mice also have anemia and
      sterility, which are not reported in human KITLG disease, and no human
      temporal bone pathology exists to confirm the strial lesion in people.
    evidence:
    - reference: PMID:2460075
      reference_title: Intermediate filaments in the cochleas of normal and mutant (w/wv,
        sl/sld) mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In contrast, vimentin was seen to stain only the basal cells in the
        mutant mice, confirming our previous findings of the absence of
        intermediate cells in these cases of hereditary deafness.
      explanation: >-
        Direct observation of the node in the model.
  - target: Reduced Melanoblast Survival, Proliferation and Colonization
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      In Sld/Sld embryos, melanoblasts emerge and begin to migrate normally but
      fail to survive.
    limitations: >-
      Sld removes the membrane-bound ligand isoform specifically, whereas the
      human alleles affect both isoforms to differing, unmeasured degrees.
    evidence:
    - reference: PMID:1280558
      reference_title: TRP-2/DT, a new early melanoblast marker, shows that steel growth
        factor (c-kit ligand) is a survival factor.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        the membrane-bound steel growth factor which is missing in Sld/Sld
        mutants is necessary for the survival of melanoblasts but not for their
        early migration and initial differentiation
      explanation: >-
        Melanoblast survival defect in the Sld/Sld model.
- name: Kitlg heterozygous frameshift (KitlgΔ/+) mouse
  species: Mouse
  genotype: Kitlg c.81_84del (p.E27DfsX5) heterozygous, CRISPR/Cas9
  description: >-
    A CRISPR/Cas9 heterozygous Kitlg frameshift with markedly reduced KITLG
    protein. Most animals have white hair on the belly or forehead, and some
    have unilateral or asymmetric hearing loss. The stria contains
    intermediate cells, but they are morphologically abnormal and strial
    melanin is reduced in the animals with impaired hearing; KIT
    phosphorylation and MITF are reduced.
  publication: PMID:41584853
  evidence:
  - reference: PMID:41584853
    reference_title: Kitlg dysfunction is associated with hearing and pigmentation abnormalities.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Most KitlgΔ/+ mice developed abnormal hair color, such as white hair on
      the belly and/or forehead
    explanation: >-
      The pigmentary phenotype of the model.
  modeled_mechanisms:
  - target: Strial Intermediate Cell Deficiency
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    description: >-
      Reduced strial melanin and abnormal intermediate cells with unilateral or
      asymmetric hearing loss, in the setting of a Kitlg loss-of-function
      allele.
    limitations: >-
      The model is heterozygous, so it corresponds more closely to the
      heterozygous KITLG hearing-loss disorder (DFNA69) than to this recessive
      disease. Hearing loss is incompletely penetrant in the mice, and
      endocochlear potential was not reported as measured in the cited text.
    evidence:
    - reference: PMID:41584853
      reference_title: Kitlg dysfunction is associated with hearing and pigmentation abnormalities.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Fontana-Masson staining revealed that KitlgΔ/+ mice with impaired
        hearing had reduced melanin distribution in the stria vascularis
        compared with WT mice
      explanation: >-
        The strial finding that the model reproduces.
  - target: Unilateral Sensorineural Hearing Loss
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Unilateral or asymmetric hearing loss by auditory brainstem response in
      a subset of heterozygous mice.
    limitations: >-
      Heterozygous genotype, whereas this disease is recessive, and incomplete
      penetrance in the mice.
    evidence:
    - reference: PMID:41584853
      reference_title: Kitlg dysfunction is associated with hearing and pigmentation abnormalities.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Some KitlgΔ/+ mice showed unilateral or asymmetric hearing loss
      explanation: >-
        Direct observation of the laterality phenotype in the model.
notes: >-
  Scope. This entry follows MONDO:0030983 and OMIM:619947, whose HPO annotation
  records autosomal recessive inheritance and whose phenotype annotations come
  from the biallelic case series (PMID:35543077) and an earlier report,
  Ogawa et al. 2017 (PMID:28504826). That report has no abstract in PubMed and
  no quotable text could be cached, so it is not cited as evidence. The
  heterozygous KITLG disorders are separate entities: isolated hearing loss
  (MONDO:0014738) and familial progressive hyperpigmentation with or without
  hypopigmentation (MONDO:0007771, curated as
  Familial_Progressive_Hyperpigmentation_With_Or_Without_Hypopigmentation). The
  single heterozygous Waardenburg syndrome type 2 family (p.Leu104Val,
  PMID:26522471) is recorded under a second inheritance block rather than
  excluded, because neither MONDO nor OMIM assigns it to another disease.

  Module conformance. The entry conforms to all four nodes of
  neural_crest_melanocyte_deficiency, including the stria vascularis node that
  Piebaldism deliberately omits: unlike piebaldism, sensorineural hearing loss
  is nearly constant here. KITLG is the ligand-side substitution at the
  module's trigger node, alongside KIT in Piebaldism.

  Evidence limits. The cochlear mechanism rests on mouse models: steel (Kitl)
  and dominant white spotting (Kit) mutants, in which strial intermediate
  cells are absent, and a heterozygous Kitlg frameshift mouse (PMID:41584853),
  in which they are present but functionally abnormal. The two models differ
  on whether reduced KIT ligand prevents strial colonization or impairs the
  maturation of cells that arrive, and the entry carries both routes. There
  is no human histopathology. The
  functional consequence of the recessive human alleles has not been assayed,
  and the genotype-phenotype model (complete loss of function giving
  generalized hypomelanosis, residual function giving the Waardenburg-like
  picture) is the case-series authors' stated speculation. No GeneReviews
  chapter covers KITLG Waardenburg syndrome.

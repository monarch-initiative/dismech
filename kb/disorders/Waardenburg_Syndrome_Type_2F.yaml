    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    gene:
      preferred_term: KITLG
      term:
        id: hgnc:6343
        label: KITLG
    description: >-
      Homozygous missense (p.Arg32Cys, p.Ile148Thr), frameshift
      (p.Met184ValfsTer10, p.Arg268SerfsTer29) and nonsense (p.Trp215Ter)
      KITLG variants in the defining case series.

name: Waardenburg Syndrome Type 2F
creation_date: "2026-09-30T19:45:00Z"
category: Mendelian
description: >-
  Waardenburg syndrome type 2F (WS2F) is the KITLG form of Waardenburg syndrome
  type 2: congenital or neonatal sensorineural hearing loss with hypomelanosis
  of the skin, hair and irides, and without dystopia canthorum. KITLG encodes KIT
  ligand (stem cell factor), the ligand of the KIT receptor tyrosine kinase that
  neural crest-derived melanoblasts depend on for survival, proliferation and
  movement into their target tissues. The disorder as currently defined rests on
  a small case series of individuals homozygous for rare KITLG variants, plus a
  few earlier single-family reports. Expressivity is strikingly variable, even
  between individuals carrying the same allele: hearing loss may be unilateral,
  asymmetric or bilateral, and hypomelanosis ranges from limb-restricted patches
  with islands of retained pigment, reminiscent of piebaldism, to generalized
  hypomelanosis of skin and hair. By analogy with the steel (Sl) mouse, which
  carries mutations in the orthologous Kitl gene, the hearing loss is attributed
  to failure of melanocytes to populate the cochlear stria vascularis as its
  intermediate cells, and the pigmentary findings to the same melanocyte deficit
  in skin, hair follicles and iris. KITLG is also the gene for two allelic
  disorders curated separately: heterozygous loss-of-function variants cause
  isolated, often unilateral, sensorineural hearing loss, and heterozygous
  gain-of-function variants cause familial progressive hyperpigmentation with or
  without hypopigmentation.
synonyms:
- WS2F
- KITLG-related Waardenburg syndrome type 2
- Biallelic KITLG auditory-pigmentary disorder

  description: >-
    Management is supportive and directed at the hearing loss: amplification,
    and cochlear implantation for severe to profound loss. No KITLG-specific
    therapy exists. The cited sources concern Waardenburg syndrome in general,
    where early implantation gives good hearing and language outcomes; no
    outcome data specific to WS2F have been published.
  therapeutic_modality: SURGERY
  treatment_term:

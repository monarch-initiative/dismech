inheritance:
- name: Autosomal Recessive
  description: >-
    The defining case series consists of individuals homozygous for rare KITLG
    variants, and the HPO annotation for this disease (OMIM:619947) records
    autosomal recessive inheritance. Heterozygous carrier parents are usually
    unaffected, although the parents of one individual homozygous for a nonsense
    allele were reported to have lighter skin than expected for their ethnic
    background.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:35543077
    reference_title: Biallelic KITLG variants lead to a distinct spectrum of hypomelanosis
      and sensorineural hearing loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We provide consolidating evidence that biallelic KITLG variants cause a
      distinct auditory-pigmentary disorder.
    explanation: >-
      States that biallelic KITLG variants cause the auditory-pigmentary
      disorder that this entry curates.
  - reference: PMID:35543077
    reference_title: Biallelic KITLG variants lead to a distinct spectrum of hypomelanosis
      and sensorineural hearing loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Individuals 1 and 3 each presented with a homozygous c.94C>T,
      p.(Arg32Cys) variant
    explanation: >-
      An example of the homozygous genotypes found in every member of the case
      series.
  - reference: PMID:35543077
    reference_title: Biallelic KITLG variants lead to a distinct spectrum of hypomelanosis
      and sensorineural hearing loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      His parents, who were confirmed carriers of the null variant, also
      exhibited lighter-coloured skin than expected for their ethnic background.
    explanation: >-
      Records a possible mild carrier effect in one family, which is why the
      description does not call carriers uniformly unaffected.
- name: Autosomal Dominant (single reported family)
  description: >-
    One small family with Waardenburg syndrome type 2 segregated a heterozygous
    KITLG missense variant, p.Leu104Val. The variant reached the cell membrane
    normally but its soluble isoform was reduced in culture medium, and the
    authors raised a dominant-negative or gain-of-function mechanism rather than
    simple loss of function. Whether heterozygous WS2 of this kind belongs to
    the same disease as the recessive case series is not settled by the
    published data; it is recorded here as a single dominant report.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:26522471
    reference_title: Allelic Mutations of KITLG, Encoding KIT Ligand, Cause Asymmetric
      and Unilateral Hearing Loss and Waardenburg Syndrome Type 2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A heterozygous missense mutation, c.310C>G (p.Leu104Val), that segregated
      with WS2 was identified in a small family.
    explanation: >-
      The single heterozygous Waardenburg syndrome type 2 family with a KITLG
      variant.
  - reference: PMID:26522471
    reference_title: Allelic Mutations of KITLG, Encoding KIT Ligand, Cause Asymmetric
      and Unilateral Hearing Loss and Waardenburg Syndrome Type 2.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We speculate that the mechanism of the mutation underlying WS2 and leading
      to membrane incorporation and reduced secretion of KITLG occurs via a
      dominant-negative or gain-of-function effect.
    explanation: >-
      The authors' proposed mechanism for the dominant allele, based on their
      transfection experiments; it is stated as speculation.

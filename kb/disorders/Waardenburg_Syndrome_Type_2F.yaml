diagnosis:
- name: Audiological evaluation and KITLG sequencing
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    The phenotype is recognized as Waardenburg syndrome type 2 (hearing loss and
    hypomelanosis without dystopia canthorum) and confirmed by finding biallelic
    KITLG variants, usually by exome, genome or Waardenburg and hearing-loss
    gene panel sequencing. Hearing should be assessed formally in each ear,
    because the loss may be unilateral. Because KITLG is also the gene for
    isolated hearing loss, testing is relevant in early-onset, non-sudden
    unilateral hearing loss even without pigmentary findings.
  evidence:
  - reference: PMID:39918572
    reference_title: Unilateral, bilateral symmetric or asymmetric isolated hearing
      loss in patients with heterozygous KITLG variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This confirmation indicates that genetic testing can be relevant in
      early-onset, non-sudden, isolated unilateral hearing loss.
    explanation: >-
      Supports KITLG testing in unilateral early-onset hearing loss. This
      evidence comes from the heterozygous allelic disorder.
  - reference: PMID:39338160
    reference_title: Comprehensive Approach for the Genetic Diagnosis of Patients with
      Waardenburg Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Seven genes are associated with WS: PAX3, MITF, EDNRB, EDN3, SOX10, KITLG,
      and SNAI2.
    explanation: >-
      KITLG is among the genes tested in the molecular diagnosis of Waardenburg
      syndrome.
treatments:

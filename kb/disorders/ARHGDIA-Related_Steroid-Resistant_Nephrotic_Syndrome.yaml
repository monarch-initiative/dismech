  - preferred_term: ARHGDIA
    term:
      id: hgnc:678
      label: ARHGDIA
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    gene:
      preferred_term: ARHGDIA
      term:
        id: hgnc:678
        label: ARHGDIA
  molecular_functions:
  - preferred_term: Rho GDP-dissociation inhibitor activity
    modifier: DECREASED
    term:
      id: GO:0005094
      label: Rho GDP-dissociation inhibitor activity
  evidence:
  - reference: PMID:23434736
    reference_title: "ARHGDIA: a novel gene implicated in nephrotic syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The proband's fibroblasts demonstrated mislocalisation of RhoGDIα to the nucleus,
      hyperactivation of the three Rho-GTPases, and impaired cell motility, suggesting that
      the in-frame deletion leads to a loss of function.
    explanation: >-
      Patient-derived fibroblasts carrying p.Asp185del show the functional consequence
      expected of a null allele.
  - reference: PMID:23867502
    reference_title: ARHGDIA mutations cause nephrotic syndrome via defective RHO GTPase signaling.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      ARHGDIA mutations (R120X and G173V) from individuals with SRNS abrogated interaction
      with RHO GTPases and increased active GTP-bound RAC1 and CDC42, but not RHOA,
      indicating that RAC1 and CDC42 are more relevant to the pathogenesis of this SRNS
      variant than RHOA.
    explanation: >-
      Both patient alleles from the second founding report lose GTPase binding in
      cultured human podocytes.
  downstream:
  - target: Impaired RhoGDIalpha-GTPase Interaction
    causal_link_type: DIRECT
    description: >-
      Characterized variants impair GTPase interaction or its regulatory consequences, with retained partial binding reported for G173V.
    evidence:
    - reference: PMID:23434736
      reference_title: "ARHGDIA: a novel gene implicated in nephrotic syndrome."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        When transfected in HEK293T cells, the mutant RhoGDIα was unable to bind to the
        Rho-GTPases, RhoA, Rac1, and Cdc42, unlike the wild-type construct.
      explanation: Direct binding assay for the in-frame deletion allele.

  - target: Reduced Total Rho GTPase Protein Abundance
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:26726844
      reference_title: Disease-causing mutations of RhoGDIα induce Rac1 hyperactivation in podocytes.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: The GDIα KD podocytes had decreased levels of Rac1, RhoA, and Cdc42 compared with control podocytes
      explanation: Total protein abundance was measured; loss of protection from proteasomal degradation is the authors' interpretation.
  - target: Podocyte Actin Cytoskeleton Derangement
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Actin abnormalities follow loss of RhoGDIalpha regulation, but specific contributions of the affected GTPases are unresolved.
    evidence:
    - reference: PMID:26726844
      reference_title: Disease-causing mutations of RhoGDIα induce Rac1 hyperactivation in podocytes.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        The mutant podocytes also showed impaired actin polymerization, smaller cell size,
        and increased cellular projections.
      explanation: Cytoskeletal and morphological phenotype of podocytes carrying patient alleles.

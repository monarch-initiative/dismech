pathophysiology:
- name: Biallelic ARHGDIA Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Homozygous germline ARHGDIA variants in five families: a nonsense allele
    (p.Arg120Ter), missense alleles (p.Gly173Val, p.Gly168Arg), an in-frame single-residue
    deletion at the GTPase-binding interface (p.Asp185del) and a canonical splice-acceptor
    variant (c.275-1G>A). The in-frame deletion and the nonsense allele abolish binding of
    RhoGDIalpha to its GTPases; G173V retains partial binding in one study but still fails
    to restrain RAC1, which is the proposed basis for its later onset.
  genes:
  - preferred_term: ARHGDIA
    term:
      id: hgnc:678
      label: ARHGDIA
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    gene:
      preferred_term: ARHGDIA
      term:
        id: hgnc:678
        label: ARHGDIA
  molecular_functions:
  - preferred_term: Rho GDP-dissociation inhibitor activity
    modifier: DECREASED
    term:
      id: GO:0005094
      label: Rho GDP-dissociation inhibitor activity
  evidence:
  - reference: PMID:23434736
    reference_title: "ARHGDIA: a novel gene implicated in nephrotic syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The proband's fibroblasts demonstrated mislocalisation of RhoGDIα to the nucleus,
      hyperactivation of the three Rho-GTPases, and impaired cell motility, suggesting that
      the in-frame deletion leads to a loss of function.
    explanation: >-
      Patient-derived fibroblasts carrying p.Asp185del show the functional consequence
      expected of a null allele.
  - reference: PMID:23867502
    reference_title: ARHGDIA mutations cause nephrotic syndrome via defective RHO GTPase signaling.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      ARHGDIA mutations (R120X and G173V) from individuals with SRNS abrogated interaction
      with RHO GTPases and increased active GTP-bound RAC1 and CDC42, but not RHOA,
      indicating that RAC1 and CDC42 are more relevant to the pathogenesis of this SRNS
      variant than RHOA.
    explanation: >-
      Both patient alleles from the second founding report lose GTPase binding in
      cultured human podocytes.
  downstream:
  - target: Release of Rho GTPases from RhoGDIalpha Sequestration
    causal_link_type: DIRECT
    description: >-
      The mutant protein cannot bind, and so cannot hold, the GTPases it normally
      sequesters.
    evidence:
    - reference: PMID:23434736
      reference_title: "ARHGDIA: a novel gene implicated in nephrotic syndrome."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        When transfected in HEK293T cells, the mutant RhoGDIα was unable to bind to the
        Rho-GTPases, RhoA, Rac1, and Cdc42, unlike the wild-type construct.
      explanation: Direct binding assay for the in-frame deletion allele.

- name: Release of Rho GTPases from RhoGDIalpha Sequestration
  biological_scale: MOLECULAR
  description: >-
    RhoGDIalpha normally keeps RAC1, CDC42 and RHOA GDP-bound in the cytosol and shields
    them from proteasomal degradation. Mutant RhoGDIalpha does neither, so the free GTPase
    pool is open to activation while the total GTPase pool falls.
  genes:
  - preferred_term: RAC1
    term:
      id: hgnc:9801
      label: RAC1
  - preferred_term: CDC42
    term:
      id: hgnc:1736
      label: CDC42
  - preferred_term: RHOA
    term:
      id: hgnc:667
      label: RHOA
  evidence:
  - reference: PMID:26726844
    reference_title: Disease-causing mutations of RhoGDIα induce Rac1 hyperactivation in podocytes.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      indicating that the mutant forms of GDIα fail to protect the Rho-GTPases from
      proteosomal degradation
    explanation: >-
      Mouse podocyte lines expressing each of the three patient alleles have lower total
      Rac1, RhoA and Cdc42, showing loss of the protective sequestration as well as of
      binding.
  downstream:
  - target: RAC1 Hyperactivation in Podocytes
    causal_link_type: DIRECT
    description: Released RAC1 is converted to its active GTP-bound form.
    evidence:
    - reference: PMID:26726844
      reference_title: Disease-causing mutations of RhoGDIα induce Rac1 hyperactivation in podocytes.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Among the 3 prototypical Rho-GTPases, Rac1 was markedly hyperactivated in
        podocytes with any of the 3 mutant forms of GDIα while the activation of RhoA and
        Cdc42 was modest and variable.
      explanation: Consistent RAC1 activation across all three reported alleles.
  - target: Variable CDC42 and RHOA Activation
    causal_link_type: DIRECT
    description: >-
      Activation of the other two prototypical GTPases is reported, but inconsistently
      across studies and cell systems.

- name: RAC1 Hyperactivation in Podocytes
  biological_scale: MOLECULAR
  description: >-
    The best-supported proximal effector. RAC1 activity rises in podocytes carrying any
    of the three characterized alleles, in ARHGDIA-knockdown podocytes, in patient
    lymphoblasts, and in the kidneys of Arhgdia-null mice (where RhoA did not rise).
    RhoGDIalpha expression normally increases as podocytes mature while active Rac1
    falls, so the lesion removes a maturation-linked brake on Rac1.
  genes:
  - preferred_term: RAC1
    term:
      id: hgnc:9801
      label: RAC1
  cell_types:
  - preferred_term: podocyte
    term:
      id: CL:0000653
      label: podocyte
  biological_processes:
  - preferred_term: Rac protein signal transduction
    modifier: INCREASED
    term:
      id: GO:0016601
      label: Rac protein signal transduction
  evidence:
  - reference: PMID:23867502
    reference_title: ARHGDIA mutations cause nephrotic syndrome via defective RHO GTPase signaling.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      ARHGDIA loss of function increases the active states of RAC1 and CDC42 by 168% and
      185%, respectively, but has no such effect on RHOA
    explanation: siRNA knockdown in cultured human podocytes.
  - reference: PMID:23867502
    reference_title: ARHGDIA mutations cause nephrotic syndrome via defective RHO GTPase signaling.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      we demonstrated by GST pulldown that active RAC1 is spontaneously elevated in
      EBV-transformed lymphoblasts from patient A1432-21 with an ARHGDIA mutation
    explanation: The same effect in cells from an affected individual.
  - reference: PMID:26726844
    reference_title: Disease-causing mutations of RhoGDIα induce Rac1 hyperactivation in podocytes.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In the developing kidney, GDIα expression increased as podocytes matured.
      Conversely, active Rac1 was detected only in immature, but not in mature,
      podocytes.
    explanation: >-
      Developmental expression data in mouse kidney, which place the RhoGDIalpha brake on
      Rac1 at podocyte maturation - relevant to the congenital and infantile onset.
  downstream:
  - target: Podocyte Actin Cytoskeleton and Motility Derangement
    causal_link_type: DIRECT
    description: >-
      Pharmacological RAC1 inhibition reverses the motility phenotype of
      ARHGDIA-deficient podocytes, placing RAC1 on the causal path.
    evidence:
    - reference: PMID:23867502
      reference_title: ARHGDIA mutations cause nephrotic syndrome via defective RHO GTPase signaling.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Moreover, the mutations enhanced migration of cultured human podocytes; however,
        enhanced migration was reversed by treatment with RAC1 inhibitors.
      explanation: Inhibitor reversal is what makes the RAC1 step causal rather than correlative.
  - target: Renal Mineralocorticoid Receptor Overactivation
    causal_link_type: DIRECT
    description: >-
      In the Arhgdia-null mouse kidney, active Rac1 drives mineralocorticoid-receptor
      signalling without a change in systemic aldosterone.
    evidence:
    - reference: PMID:19029984
      reference_title: "Modification of mineralocorticoid receptor function by Rac1 GTPase: implication in proteinuric kidney disease."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Pharmacological intervention with a Rac-specific small-molecule inhibitor
        diminished mineralocorticoid receptor overactivity and renal damage in this model.
      explanation: >-
        Rac inhibition lowers MR activity in the knockout, so the MR effect lies
        downstream of Rac1.
  - target: Sensitization of Podocytes to Inflammatory Injury
    causal_link_type: DIRECT
    description: >-
      In ARHGDIA-knockdown podocytes, the exaggerated p38 response to LPS is
      Rac1-dependent.
    evidence:
    - reference: PMID:25503727
      reference_title: Loss of Rho-GDIα sensitizes podocytes to lipopolysaccharide-mediated injury.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        GDIα knockdown podocytes showed more pronounced and sustained p38 phosphorylation
        in response to LPS compared with control podocytes, and this was blunted
        significantly by the Rac1 inhibitor.
      explanation: Rac1 inhibition blunts the sensitized response.

- name: Variable CDC42 and RHOA Activation
  biological_scale: MOLECULAR
  description: >-
    CDC42 activation was reported by the Gee group, and RhoA, Rac1 and Cdc42 were all
    hyperactivated in the Gupta proband's fibroblasts and knockdown podocytes; but RHOA did
    not rise in the Gee podocyte assays or in the Arhgdia-null mouse kidney, and in the
    later allele-by-allele podocyte study RhoA and Cdc42 rises were modest and
    inconsistent. RHO inhibitors had no effect in zebrafish. Kept separate from the RAC1
    node so the weaker, contested claim does not inherit RAC1's support.
  genes:
  - preferred_term: CDC42
    term:
      id: hgnc:1736
      label: CDC42
  - preferred_term: RHOA
    term:
      id: hgnc:667
      label: RHOA

- discussion_id: arhgdia_mechanism_wording
  kind: INTERPRETATION
  prompt: Is ARHGDIA disease loss of function or gain of function?
  attaches_to:
  - pathophysiology#Biallelic ARHGDIA Loss of Function
  rationale: >-
    ClinGen's evidence summary states the mechanism of pathogenicity as gain of function.
    The primary studies it cites show loss of RhoGDIalpha function (recessive, including a
    nonsense allele, with loss of GTPase binding) whose consequence is gain of RAC1
    activity. The entry records loss of function on the variant and increased activity
    on the RAC1 node, which is what the functional data show; the ClinGen wording is best
    read as describing the downstream GTPase state.
  evidence:
  - reference: CGGV:assertion_0e529f2b-21ac-44b2-981e-048e92e377a1-2022-05-24T180000.000Z
    reference_title: "ARHGDIA / nephrotic syndrome, type 8 (Moderate)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The mechanism of pathogenicity is Gain of Function.
    explanation: The ClinGen statement discussed here.

notes: >-
  ARHGDIA-related nephrotic syndrome is modeled as one recessive gene-defined disease, including congenital and early-childhood presentations. OMIM:615244 maps to the broader Orphanet hereditary SRNS record ORPHA:656. The steroid-resistant label follows the disease grouping; some congenital patients were not documented to have received a steroid trial. The genetic SRNS GeneReviews chapter supplies the general clinical, diagnostic, management and counseling baseline; rates or therapies for unrelated genetic syndromes are not transferred to ARHGDIA. The clinical series includes seven molecularly characterized patients and one additional affected sibling without available DNA in Gee Table 1.
mechanistic_hypotheses:
- hypothesis_group_id: arhgdia_cellular_glomerular_injury
  hypothesis_label: Cellular actin and motility changes produce glomerular lesions
  status: EMERGING
  description: The studies propose that disturbed actin organization and podocyte migration produce foot-process injury and developmental glomerular disease; the specific intervening steps are incompletely established.

  description: >-
    Molecularly characterized patients in the cited families are homozygous; available parental testing supports recessive segregation. For two heterozygous parents, each pregnancy has a 25% risk of an affected child, 50% probability of a carrier and 25% probability of an unaffected noncarrier. The untested deceased G173V-family sibling should not be counted as molecularly confirmed.

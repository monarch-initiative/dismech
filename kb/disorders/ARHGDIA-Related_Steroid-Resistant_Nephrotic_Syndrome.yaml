    explanation: Gee et al. (2013), PMID:23867502, Table 1 in the full PDF. The family row reports origin, consanguinity and heterozygous parental segregation; these details were absent from the cached HTML body.
  notes: >-
    The sources describe seven molecularly characterized patients in five families and an additional affected sibling in the G173V family for whom no DNA was available. Gee Table 1 identifies the G173V family as Ashkenazi Jewish and the R120X family as Moroccan and records parental consanguinity in both. Parental consanguinity is also reported in the Pakistani, Iranian and South Indian families. The small, selected series do not estimate population prevalence or penetrance. ClinGen calls the mechanism gain of function; the primary functional studies show impaired RhoGDIalpha regulation with increased downstream GTPase activity, which are distinct levels of description.


pathophysiology:
- name: Biallelic ARHGDIA Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic ARHGDIA variants are associated with recessive nephrotic syndrome. Functional studies support impaired RhoGDIalpha regulation for p.Asp185del, p.Arg120Ter and p.Gly173Val, with residual binding varying by allele and assay. The later p.Gly168Arg and c.275-1G>A variants were reported as likely pathogenic without equivalent functional testing.

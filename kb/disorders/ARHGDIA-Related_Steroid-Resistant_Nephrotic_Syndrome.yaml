diagnosis:
- name: Molecular genetic testing
  description: >-
    Diagnosis is by sequencing: whole-exome sequencing in the founding and later reports,
    clinical exome in the Indian case. Nothing biochemical distinguishes ARHGDIA disease
    from other monogenic congenital or infantile nephrotic syndrome, and the biopsy
    pattern (diffuse mesangial sclerosis) is shared with other genes.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:23867502
    reference_title: ARHGDIA mutations cause nephrotic syndrome via defective RHO GTPase signaling.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In summary, our findings of ARHGDIA mutation implicate the RHO small GTPase
      RAC1/CDC42 in the pathogenesis of human NS and permit a noninvasive,
      causation-based diagnosis.
    explanation: The founding report's framing of genetic testing as the diagnostic route.
  - reference: PMID:34436835
    reference_title: Genetic Steroid-Resistant Nephrotic Syndrome Overview.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Provide an evaluation strategy to identify the cause of genetic steroid-resistant
      nephrotic syndrome in a proband (when possible)
    explanation: >-
      The GeneReviews overview for genetic SRNS covers the evaluation strategy. Cited at
      family level only: its cached record is the purpose statement and does not name
      ARHGDIA.
- name: Kidney biopsy
  description: >-

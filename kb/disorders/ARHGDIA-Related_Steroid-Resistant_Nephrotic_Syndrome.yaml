  biological_scale: MOLECULAR
  description: >-
    In Arhgdia-null mice, Rac1 enhances mineralocorticoid receptor signalling in the kidney
    without any change in circulating aldosterone, and MR blockade suppresses the
    albuminuria. This arm is established in the mouse and in cultured cells only.
  cell_types:

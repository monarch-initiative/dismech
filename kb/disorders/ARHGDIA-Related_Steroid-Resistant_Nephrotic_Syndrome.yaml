name: ARHGDIA-Related Steroid-Resistant Nephrotic Syndrome
description: >-
  Autosomal recessive nephrotic syndrome caused by biallelic loss-of-function variants in
  ARHGDIA, which encodes Rho GDP-dissociation inhibitor alpha (RhoGDIalpha), the protein
  that holds the Rho-family GTPases RAC1, CDC42 and RHOA in their inactive, GDP-bound
  cytosolic pool. The disease is podocyte-intrinsic: without functional RhoGDIalpha, RAC1
  in particular is released and hyperactivated in podocytes, the actin cytoskeleton and
  motility of the cell are deranged, foot processes efface and the filtration barrier
  fails. Presentation in the reported families is congenital or infantile (the first three
  months of life for the truncating and in-frame-deletion alleles, around one year or later
  for the G173V missense allele), with diffuse mesangial sclerosis on biopsy, no response
  to corticosteroids, and rapid progression to kidney failure or death in infancy.
  Neurological involvement including intellectual disability was reported in one of the
  two founding series. Fewer than ten affected individuals are described in the sources
  used here, so frequencies are not assigned. A Rac1-mineralocorticoid-receptor axis is
  pharmacologically targetable in the knockout mouse and in zebrafish morphants, but no
  therapy has been tested in patients.
category: Mendelian

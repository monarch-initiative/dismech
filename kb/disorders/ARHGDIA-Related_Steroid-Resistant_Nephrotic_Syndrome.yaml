      label: Cdc42 protein signal transduction
  evidence:
  - reference: PMID:23434736
    reference_title: "ARHGDIA: a novel gene implicated in nephrotic syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      When RhoGDIα was knocked down in podocytes, RhoA, Rac1, and Cdc42 were
      hyperactivated and podocyte motility was impaired.
    explanation: Supports activation of all three GTPases, including RhoA.
  - reference: PMID:23867502
    reference_title: ARHGDIA mutations cause nephrotic syndrome via defective RHO GTPase signaling.
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: >-
      ARHGDIA loss of function increases the active states of RAC1 and CDC42 by 168% and
      185%, respectively, but has no such effect on RHOA
    explanation: >-
      Refutes the RHOA half of this node in cultured human podocytes, while supporting
      the CDC42 half.
  - reference: PMID:19029984
    reference_title: "Modification of mineralocorticoid receptor function by Rac1 GTPase: implication in proteinuric kidney disease."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: >-
      renal abnormalities, including heavy albuminuria and podocyte damage, were
      associated with increased Rac1 (but not RhoA) and mineralocorticoid receptor
      signaling in the kidney
    explanation: RhoA was not increased in the knockout mouse kidney.
  downstream:
  - target: Podocyte Actin Cytoskeleton and Motility Derangement
    causal_link_type: UNKNOWN
    description: >-
      Whether CDC42 or RHOA activation contributes independently of RAC1 is not
      established; see the RhoA discussion.

- name: Podocyte Actin Cytoskeleton and Motility Derangement
  biological_scale: CELLULAR
  conforms_to: "nephrotic_podocyte_injury#Podocyte Injury"
  description: >-
    Loss of RhoGDIalpha disturbs podocyte actin and motility, but the direction of the
    motility change depends on the experimental system: overexpression of mutant alleles
    over endogenous wild-type protein, or siRNA knockdown, enhanced migration of human
    podocytes, whereas replacing endogenous RhoGDIalpha with the mutant forms slowed mouse
    podocytes, reduced actin polymerization and cell size, and increased cellular
    projections. The studies agree that podocytes are sensitive to the balance of
    Rho-GTPase activity.
  cell_types:
  - preferred_term: podocyte
    term:
      id: CL:0000653
      label: podocyte
  biological_processes:
  - preferred_term: actin cytoskeleton organization
    modifier: ABNORMAL
    term:
      id: GO:0030036
      label: actin cytoskeleton organization
  - preferred_term: podocyte cell migration
    modifier: DYSREGULATED
    term:
      id: GO:0090521
      label: podocyte cell migration
  evidence:
  - reference: PMID:26726844
    reference_title: Disease-causing mutations of RhoGDIα induce Rac1 hyperactivation in podocytes.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The mutant podocytes also showed impaired actin polymerization, smaller cell size,
      and increased cellular projections.
    explanation: Cytoskeletal and morphological phenotype of podocytes carrying patient alleles.
  - reference: PMID:26726844
    reference_title: Disease-causing mutations of RhoGDIα induce Rac1 hyperactivation in podocytes.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      All three mutant GDIα proteins resulted in slow podocyte motility, suggesting that
      podocytes are sensitive to the relative balance of Rho-GTPase activity.
    explanation: Motility is disturbed by every reported allele (here, slowed).
  - reference: PMID:23867502
    reference_title: ARHGDIA mutations cause nephrotic syndrome via defective RHO GTPase signaling.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Podocytes transfected with ARHGDIA siRNA exhibited more active migration compared
      with those transfected with scrambled siRNA.
    explanation: Motility is disturbed in the opposite direction in human podocyte knockdown.
  downstream:
  - target: Foot Process Effacement and Slit Diaphragm Disruption
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The authors propose that aberrant projections and reduced cell size alter the slit
      diaphragm; the step from cultured-podocyte morphology to effaced foot processes in
      vivo has not been shown directly for ARHGDIA.
    evidence:
    - reference: PMID:26726844
      reference_title: Disease-causing mutations of RhoGDIα induce Rac1 hyperactivation in podocytes.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        The increased number of cellular protrusions may result in an aberrant podocyte
        morphology that alters the morphology of the slit diaphragms, thereby allowing
        protein leakage into the urine.
      explanation: >-
        The authors' proposed link, stated as a possibility; this is why the edge is
        marked as having unknown intermediates.
  - target: Diffuse Mesangial Sclerosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Impaired migration during podocyte development is proposed to contribute to disease;
      the developmental glomerular lesion seen in patients is diffuse mesangial sclerosis.
      The intermediate steps between the cellular defect and the lesion are not
      characterized.
    evidence:
    - reference: PMID:26726844
      reference_title: Disease-causing mutations of RhoGDIα induce Rac1 hyperactivation in podocytes.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        impaired cell migration during podocyte development likely contributes to the
        pathogenesis of NS in patients with GDIα mutations
      explanation: The authors' developmental framing; a hypothesis, not a demonstration.


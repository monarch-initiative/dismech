name: ARHGDIA-Related Steroid-Resistant Nephrotic Syndrome
description: >-
  Autosomal recessive nephrotic syndrome caused by biallelic ARHGDIA variants that impair Rho GDP-dissociation inhibitor alpha (RhoGDIalpha). Characterized alleles disturb regulation of Rho-family GTPases, with consistent RAC1 hyperactivation in podocyte models and model-dependent effects on CDC42, RHOA and cell motility. Podocyte injury disrupts the glomerular filtration barrier. Reported onset ranges from the neonatal period to early childhood, with diffuse mesangial sclerosis in biopsied patients and progression to kidney failure that can occur in infancy or childhood. Intellectual disability, seizures, cortical blindness and hearing impairment have been reported in selected patients. Pharmacological RAC1 and mineralocorticoid-receptor inhibition has shown preclinical effects; clinical efficacy specific to ARHGDIA disease is unestablished.
category: Mendelian

phenotypes:
- category: Renal
  name: Congenital or Infantile Nephrotic Syndrome
  description: >-
    Onset within the first weeks to months of life for the p.Asp185del and p.Arg120Ter
    alleles; the G173V siblings presented later, at one year or older, and the p.Gly168Arg
    infant was referred at 11 months after three months of anasarca. Age at onset
    therefore ranges from the neonatal period to beyond the first year, and is
    allele-dependent rather than uniformly congenital.
  phenotype_term:
    preferred_term: Congenital nephrotic syndrome
    term:
      id: HP:0008677
      label: Congenital nephrotic syndrome
  evidence:
  - reference: PMID:23434736
    reference_title: "ARHGDIA: a novel gene implicated in nephrotic syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The proband presented at 3 weeks of age with generalised oedema and was found to
      have severe hypoalbuminaemia and proteinuria and was diagnosed with congenital
      nephrotic syndrome.
    explanation: Neonatal presentation in the first sister.
  - reference: PMID:23434736
    reference_title: "ARHGDIA: a novel gene implicated in nephrotic syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The second child was diagnosed with congenital nephrotic syndrome on day 16 of life
      when her laboratory studies revealed severe hypoalbuminaemia with proteinuria
    explanation: Neonatal presentation in the second sister.
  - reference: PMID:23867502
    reference_title: ARHGDIA mutations cause nephrotic syndrome via defective RHO GTPase signaling.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we detected a homozygous mutation (c.358C>T;p.R120X) in an infant (A4578-21) with
      congenital NS
    explanation: Congenital presentation with the nonsense allele.
  - reference: PMID:26726844
    reference_title: Disease-causing mutations of RhoGDIα induce Rac1 hyperactivation in podocytes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-

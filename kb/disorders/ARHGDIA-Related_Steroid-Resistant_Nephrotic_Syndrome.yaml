animal_models:
- name: Arhgdia knockout mouse
  species: Mouse
  genotype: Arhgdia-/- (constitutive)
  publication: PMID:10498891
  description: >-
    The constitutive null developed massive proteinuria and died of renal failure within
    a year, with tubular degeneration and dilatation; males were infertile. A later study
    in the same line showed increased renal Rac1 (not RhoA) and mineralocorticoid receptor
    signalling, reduced by a Rac inhibitor, and suppression of albuminuria by
    mineralocorticoid receptor blockade.
  modeled_mechanisms:
  - target: Glomerular Filtration Barrier Failure
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Heavy proteinuria and fatal renal failure after initial viability.
    limitations: >-
      The mouse is viable at birth and progresses over months, whereas patients present
      congenitally or in infancy; the renal histology in the abstract is described as
      tubular, and diffuse mesangial sclerosis is not reported. The reproductive phenotype
      has no reported human counterpart.
    evidence:
    - reference: PMID:10498891
      reference_title: Progressive impairment of kidneys and reproductive organs in mice lacking Rho GDIalpha.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Rho GDIalpha -/- mice were initially viable but developed massive proteinuria
        mimicking nephrotic syndrome, leading to death due to renal failure within a year.
      explanation: Establishes the renal phenotype of the null.
  - target: Renal Mineralocorticoid Receptor Overactivation
    relationship: RESCUES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      A Rac-specific inhibitor and mineralocorticoid receptor blockade each reduced renal
      damage in the knockout.
    limitations: >-
      Preclinical only. No Rac1 inhibitor or mineralocorticoid receptor antagonist has
      been reported in a patient with ARHGDIA disease, and the rescue was in a model with
      a slower course than the human disease.
    evidence:
    - reference: PMID:19029984
      reference_title: "Modification of mineralocorticoid receptor function by Rac1 GTPase: implication in proteinuric kidney disease."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Furthermore, albuminuria and histological changes in Arhgdia(-/-) mice were
        suppressed by mineralocorticoid receptor blockade, confirming the pathological
        role of Rac1-mineralocorticoid receptor interaction.
      explanation: The in vivo rescue.
- name: arhgdia morphant zebrafish
  species: Zebrafish
  genotype: arhgdia morpholino knockdown (translation-blocking and splice-blocking)
  publication: PMID:23867502
  description: >-
    Knockdown produced periorbital and whole-body edema in 70% of embryos at 120 hours
    post-fertilization, with proteinuria; RAC1 inhibitors and eplerenone partly reduced
    the edema, while RHO inhibitors did not.
  modeled_mechanisms:
  - target: Glomerular Filtration Barrier Failure
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Edema and measured proteinuria in larvae.
    limitations: >-
      Transient morpholino knockdown in a pronephros; glomerular histology and podocyte
      ultrastructure are not reported in the cached text.
    evidence:
    - reference: PMID:23867502
      reference_title: ARHGDIA mutations cause nephrotic syndrome via defective RHO GTPase signaling.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Coinjection of the p53 control MO with an MO targeting the translation initiation
        site of zebrafish arhgdia caused the nephrosis phenotype of periorbital and total
        body edema in 70% of embryos at 120 hpf
      explanation: Establishes the phenotype and its penetrance.
  - target: RAC1 Hyperactivation in Podocytes
    relationship: RESCUES
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      RAC1 inhibition partly reduced edema; RHO inhibitors had no effect, supporting RAC1
      over RHOA as the effector.
    limitations: >-
      Partial effect only (70% to 47% of embryos with edema), and RAC1 activity was not
      measured in the fish. Preclinical only.
    evidence:
    - reference: PMID:23867502
      reference_title: ARHGDIA mutations cause nephrotic syndrome via defective RHO GTPase signaling.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We found that RAC1 inhibitors were partially effective in our zebrafish model in
        reducing edema from 70% in untreated arhgdia knockdown zebrafish to 47% for the
        RAC1 inhibitor-treated fish
      explanation: Quantifies the partial rescue.
    - reference: PMID:23867502
      reference_title: ARHGDIA mutations cause nephrotic syndrome via defective RHO GTPase signaling.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: whereas RHO inhibitors (RHO inhibitor 1, Y-27632, and fasudil) showed no effect
      explanation: The negative control that points to RAC1 rather than RHOA.

experimental_models:
- name: ARHGDIA-depleted or mutant-reconstituted podocyte lines
  experimental_model_type: CELL_LINE
  description: >-
    Cultured human podocytes with ARHGDIA siRNA or mutant overexpression (Gee), and mouse
    podocytes with shRNA knockdown alone or reconstituted with each patient allele
    (Gupta; Auguste).
  publication: PMID:26726844
  modeled_mechanisms:
  - target: RAC1 Hyperactivation in Podocytes
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: MOLECULAR
    description: RAC1 activation is reproduced with all three characterized alleles.
    limitations: >-
      Immortalized podocytes in two dimensions; the direction of the motility phenotype
      differs between the human-overexpression and mouse-replacement designs.
    evidence:
    - reference: PMID:26726844
      reference_title: Disease-causing mutations of RhoGDIα induce Rac1 hyperactivation in podocytes.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Among the 3 prototypical Rho-GTPases, Rac1 was markedly hyperactivated in
        podocytes with any of the 3 mutant forms of GDIα while the activation of RhoA and
        Cdc42 was modest and variable.
      explanation: Allele-by-allele reproduction of the effector step.
- name: Patient-derived fibroblasts (p.Asp185del)
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: Skin fibroblasts from the homozygous p.Asp185del proband.
  publication: PMID:23434736
  modeled_mechanisms:
  - target: Biallelic ARHGDIA Loss of Function
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Endogenous mutant protein, mislocalized, with Rho-GTPase hyperactivation.
    limitations: >-
      Fibroblasts are not podocytes, and the actin response to RhoGDIalpha loss is
      reported to differ between the two cell types.
    evidence:
    - reference: PMID:23434736
      reference_title: "ARHGDIA: a novel gene implicated in nephrotic syndrome."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        The proband's fibroblasts demonstrated mislocalisation of RhoGDIα to the nucleus,
        hyperactivation of the three Rho-GTPases, and impaired cell motility, suggesting
        that the in-frame deletion leads to a loss of function.
      explanation: The patient-cell readout.

discussions:
- discussion_id: arhgdia_motility_direction
  kind: CONTROVERSY
  prompt: >-
    Does RhoGDIalpha loss make podocytes more migratory or less?
  attaches_to:
  - pathophysiology#Podocyte Actin Cytoskeleton and Motility Derangement
  rationale: >-
    The Gee group found enhanced migration of human podocytes after ARHGDIA knockdown or
    mutant overexpression, reversible with RAC1 inhibitors. The Gupta and Auguste studies
    found impaired motility in mouse podocytes and in patient fibroblasts. Auguste et al.
    attribute the difference to design: Gee overexpressed mutants on a background of
    endogenous wild-type RhoGDIalpha, whereas they knocked down the endogenous protein
    and re-expressed the mutant. Both groups agree that RAC1 is hyperactivated and that
    podocyte motility is abnormal; the entry therefore records the process as
    dysregulated rather than increased or decreased.
  evidence:
  - reference: PMID:26726844
    reference_title: Disease-causing mutations of RhoGDIα induce Rac1 hyperactivation in podocytes.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These differences may be explained by the WT GDIα present in the human podocytes
      used by Gee et al. since they overexpressed the mutants without knocking down the
      endogenous GDIα
    explanation: The authors' explanation for the discrepancy.
- discussion_id: arhgdia_rhoa_role
  kind: CONTROVERSY
  prompt: Is RHOA activation part of the mechanism, or is the disease RAC1 (and CDC42) driven?
  attaches_to:
  - pathophysiology#Variable CDC42 and RHOA Activation
  - pathophysiology#RAC1 Hyperactivation in Podocytes
  rationale: >-
    RhoA was hyperactivated in the Gupta knockdown podocytes and patient fibroblasts, but
    not in the Gee human podocyte assays, not in the Arhgdia-null mouse kidney, and only
    modestly and inconsistently in the Auguste allele panel. RHO inhibitors had no effect
    in the zebrafish model, where RAC1 inhibitors did. The weight of evidence favors
    RAC1, but no study has measured RHOA activation in patient podocytes.
- discussion_id: arhgdia_transplant_recurrence
  kind: KNOWLEDGE_GAP
  prompt: >-
    What is the outcome of kidney transplantation, including post-transplant recurrence,
    in ARHGDIA disease?
  attaches_to:
  - treatments#Kidney Transplantation
  rationale: >-
    The single reported graft failed from venous thrombosis and never functioned. A
    podocyte-intrinsic genetic lesion would predict that the donor kidney is unaffected,
    but no ARHGDIA-specific post-transplant data exist in the sources used here, and the
    entry does not infer a recurrence rate from other forms of monogenic SRNS.
- discussion_id: arhgdia_extrarenal_phenotype
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is there an extrarenal phenotype - neurological or reproductive - in humans?
  attaches_to:
  - phenotypes#Intellectual Disability
  - animal_models#Mouse
  rationale: >-
    ARHGDIA is ubiquitously expressed. Neurological phenotypes including intellectual
    disability were reported in three of four individuals in the Gee series, but not in
    the other reports, and most affected children died or reached kidney failure in
    infancy, before cognition could be assessed. Male Arhgdia-null mice are infertile;
    whether affected humans have a reproductive phenotype is unknown, and in most
    reported cases the question could not arise.
  evidence:
  - reference: PMID:23867502
    reference_title: ARHGDIA mutations cause nephrotic syndrome via defective RHO GTPase signaling.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It is not clear whether individuals with ARHGDIA mutations also have abnormal
      reproductive phenotypes
    explanation: The founding authors state the reproductive question as open.
  - reference: PMID:10498891
    reference_title: Progressive impairment of kidneys and reproductive organs in mice lacking Rho GDIalpha.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Rho GDIalpha -/- male mice were infertile and showed impaired spermatogenesis with
      vacuolar degeneration of seminiferous tubules in their testes.
    explanation: The mouse phenotype that raises the question.
- discussion_id: arhgdia_mechanism_wording
  kind: INTERPRETATION
  prompt: Is ARHGDIA disease loss of function or gain of function?
  attaches_to:
  - pathophysiology#Biallelic ARHGDIA Loss of Function
  rationale: >-
    ClinGen's evidence summary states the mechanism of pathogenicity as gain of function.
    The primary studies it cites show loss of RhoGDIalpha function (recessive, including a
    nonsense allele, with loss of GTPase binding) whose consequence is gain of RAC1
    activity. The entry records loss of function on the variant and increased activity
    on the RAC1 node, which is what the functional data show; the ClinGen wording is best
    read as describing the downstream GTPase state.
  evidence:
  - reference: CGGV:assertion_0e529f2b-21ac-44b2-981e-048e92e377a1-2022-05-24T180000.000Z
    reference_title: "ARHGDIA / nephrotic syndrome, type 8 (Moderate)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The mechanism of pathogenicity is Gain of Function.
    explanation: The ClinGen statement discussed here.

notes: >-
  Identifiers. OMIM:615244 (NPHS8); gene OMIM:601925. MONDO:0014099 is a child of
  MONDO:0019006 familial idiopathic steroid-resistant nephrotic syndrome. Orphanet has no
  ARHGDIA-specific code; OMIM:615244 maps to ORPHA:656 (hereditary steroid-resistant
  nephrotic syndrome) as a broader term.

  Lump/split. Curated as a single disease entry: one gene, one mechanism, and one MONDO
  term. It is not a subtype of a curated parent, because the KB has no familial SRNS
  grouping entry. The "steroid-resistant" in the entry name follows the MONDO parent and
  the founding literature; most reported patients presented congenitally and were not
  reported to have had a steroid trial.

  GeneReviews. There is no ARHGDIA chapter. PMID:34436835, the genetic SRNS overview, is
  the closest; its cached record is the purpose statement only and does not name ARHGDIA,
  so it is cited only for the evaluation-strategy claim.

  Case count. The sources used here describe two Pakistani sisters (p.Asp185del), two
  Ashkenazi Jewish siblings (p.Gly173Val), one infant with p.Arg120Ter, one Iranian child
  (c.275-1G>A) and one South Indian infant (p.Gly168Arg). The Gee discussion refers to
  four individuals from its two families, one more than its text names. No prevalence
  figure exists, so no prevalence record is given.

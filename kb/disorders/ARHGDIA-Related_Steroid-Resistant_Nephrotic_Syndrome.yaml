- name: RAC1 Hyperactivation in Podocytes
  biological_scale: MOLECULAR
  description: >-
    The best-supported proximal effector. RAC1 activity rises in podocytes carrying any
    of the three characterized alleles, in ARHGDIA-knockdown podocytes, in patient
    lymphoblasts, and in the kidneys of Arhgdia-null mice (where RhoA did not rise).
    RhoGDIalpha expression normally increases as podocytes mature while active Rac1
    falls, so the lesion removes a maturation-linked brake on Rac1.

  biological_scale: MOLECULAR
  description: >-
    The p.Asp185del and p.Arg120Ter proteins fail to interact with the tested Rho-family GTPases in binding assays. G173V loses detectable interaction in one experimental system but retains partial binding in another. Binding and inhibition therefore should not be treated as interchangeable readouts, nor as uniformly absent for every allele.

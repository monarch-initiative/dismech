- name: ARHGDIA
  gene_term:
    preferred_term: ARHGDIA
    term:
      id: hgnc:678
      label: ARHGDIA
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  variants:
  - name: c.553_555del (p.Asp185del)
    description: >-
      In-frame deletion of one of three consecutive aspartate residues (183-185) at the
      GTPase-binding interface; homozygous in two Pakistani sisters with congenital
      nephrotic syndrome. The deleted residue cannot be assigned, so the variant is named
      for position 185.
    evidence:
    - reference: PMID:23434736
      reference_title: "ARHGDIA: a novel gene implicated in nephrotic syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The sisters harbour a homozygous in-frame deletion that is predicted to remove a
        highly conserved aspartic acid residue within the interface where the protein,
        RhoGDIα, interacts with the Rho family of small GTPases (c.553_555del(p.Asp185del)).
      explanation: Identifies the allele and its position.
  - name: c.518G>T (p.Gly173Val)
    description: >-
      Missense, homozygous in two Ashkenazi Jewish siblings; associated with the later
      onset. Retains partial GTPase binding in one study but still fails to restrain RAC1.
    evidence:
    - reference: PMID:23867502
      reference_title: ARHGDIA mutations cause nephrotic syndrome via defective RHO GTPase signaling.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Using WER, we detected in both siblings a homozygous missense mutation
        (c.518G>T;p.G173V) of ARHGDIA (RefSeq accession number NM_001185077.1)
      explanation: Identifies the allele and the reference transcript.
  - name: c.358C>T (p.Arg120Ter)
    description: Nonsense, homozygous in an infant with congenital nephrotic syndrome.
    evidence:
    - reference: PMID:23867502
      reference_title: ARHGDIA mutations cause nephrotic syndrome via defective RHO GTPase signaling.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        we detected a homozygous mutation (c.358C>T;p.R120X) in an infant (A4578-21) with
        congenital NS
      explanation: Identifies the allele.
  - name: p.Gly168Arg
    description: >-
      Homozygous missense in exon 6, reported as likely pathogenic by clinical exome
      sequencing in an 11-month-old South Indian girl; not functionally tested.
    evidence:
    - reference: PMID:35060086
      reference_title: Homozygous ARHGDIA Gene Mutation in an 11-Month-Old Infant with Steroid-Resistant Nephrotic Syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        exome sequencing revealed homozygous missense likely-pathogenic variation in exon
        6 of ARHGDIA gene
      explanation: Identifies the allele class and zygosity.
  - name: c.275-1G>A
    description: >-
      Canonical splice-acceptor variant, homozygous and classified likely pathogenic, in a
      child with congenital onset from an Iranian SRNS cohort; not functionally tested.
    evidence:
    - reference: PMID:36245711
      reference_title: High detection rate for disease-causing variants in a cohort of 30 Iranian pediatric steroid resistant nephrotic syndrome cases.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: one allele was a −1 canonical splice site variant in ARHGDIA
      explanation: Identifies the allele class.
    - reference: PMID:36245711
      reference_title: High detection rate for disease-causing variants in a cohort of 30 Iranian pediatric steroid resistant nephrotic syndrome cases.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: ARHGDIA NM_004309.6 | c.275-1G>A; p.(?) | Homo
      explanation: Table 1 identifies the reference transcript and splice allele; the actual splice product was not measured.

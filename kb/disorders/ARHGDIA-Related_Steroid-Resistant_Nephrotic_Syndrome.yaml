    snippet: >-
      ARHGDIA loss of function increases the active states of RAC1 and CDC42 by 168% and
      185%, respectively, but has no such effect on RHOA
    explanation: siRNA knockdown in cultured human podocytes.
  - reference: PMID:23867502
    reference_title: ARHGDIA mutations cause nephrotic syndrome via defective RHO GTPase signaling.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      we demonstrated by GST pulldown that active RAC1 is spontaneously elevated in
      EBV-transformed lymphoblasts from patient A1432-21 with an ARHGDIA mutation
    explanation: The same effect in cells from an affected individual.
  - reference: PMID:26726844
    reference_title: Disease-causing mutations of RhoGDIα induce Rac1 hyperactivation in podocytes.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In the developing kidney, GDIα expression increased as podocytes matured.
      Conversely, active Rac1 was detected only in immature, but not in mature,
      podocytes.
    explanation: >-
      Developmental expression data in mouse kidney, which place the RhoGDIalpha brake on
      Rac1 at podocyte maturation - relevant to the congenital and infantile onset.
  downstream:
  - target: Dysregulated Podocyte Motility
    causal_link_type: DIRECT
    description: >-
      Pharmacological RAC1 inhibition reverses the motility phenotype of
      ARHGDIA-deficient podocytes, placing RAC1 on the causal path.
    evidence:
    - reference: PMID:23867502
      reference_title: ARHGDIA mutations cause nephrotic syndrome via defective RHO GTPase signaling.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Moreover, the mutations enhanced migration of cultured human podocytes; however,
        enhanced migration was reversed by treatment with RAC1 inhibitors.
      explanation: Inhibitor reversal is what makes the RAC1 step causal rather than correlative.
  - target: Renal Mineralocorticoid Receptor Overactivation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Cell experiments implicate p21-activated kinase phosphorylation and mineralocorticoid-receptor nuclear accumulation; mouse Rac inhibition reduces renal receptor overactivity without a change in systemic aldosterone.
    evidence:
    - reference: PMID:19029984
      reference_title: "Modification of mineralocorticoid receptor function by Rac1 GTPase: implication in proteinuric kidney disease."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Pharmacological intervention with a Rac-specific small-molecule inhibitor
        diminished mineralocorticoid receptor overactivity and renal damage in this model.
      explanation: >-
        Rac inhibition lowers MR activity in the knockout, so the MR effect lies
        downstream of Rac1.
  - target: Sensitization of Podocytes to Inflammatory Injury
    causal_link_type: DIRECT
    description: >-
      In ARHGDIA-knockdown podocytes, the exaggerated p38 response to LPS is
      Rac1-dependent.
    evidence:
    - reference: PMID:25503727

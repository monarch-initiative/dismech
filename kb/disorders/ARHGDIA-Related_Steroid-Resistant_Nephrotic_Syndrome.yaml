discussions:
- discussion_id: arhgdia_motility_direction
  kind: CONTROVERSY
  prompt: >-
    Does RhoGDIalpha loss make podocytes more migratory or less?
  attaches_to:
  - pathophysiology#Dysregulated Podocyte Motility
  rationale: >-
    The Gee group found enhanced migration of human podocytes after ARHGDIA knockdown or mutant overexpression, reversible with RAC1 inhibitors. The Gupta and Auguste studies found impaired motility in mouse podocytes and in patient fibroblasts. Auguste et al. attribute the difference to design: Gee overexpressed mutants on a background of endogenous wild-type RhoGDIalpha, whereas they knocked down the endogenous protein and re-expressed the mutant. Both groups agree that RAC1 is hyperactivated and that podocyte motility is abnormal; the entry therefore records the process as dysregulated rather than increased or decreased. The design explanation remains incomplete because Gee also observed enhanced migration after siRNA knockdown. Species, assay and expression differences may contribute.
  evidence:
  - reference: PMID:26726844
    reference_title: Disease-causing mutations of RhoGDIα induce Rac1 hyperactivation in podocytes.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These differences may be explained by the WT GDIα present in the human podocytes
      used by Gee et al. since they overexpressed the mutants without knocking down the
      endogenous GDIα
    explanation: The authors' explanation for the discrepancy.
- discussion_id: arhgdia_rhoa_role
  kind: CONTROVERSY
  prompt: Is RHOA activation part of the mechanism, or is the disease RAC1 (and CDC42) driven?
  attaches_to:
  - pathophysiology#Variable RHOA Activation
  - pathophysiology#Variable CDC42 Activation
  - pathophysiology#RAC1 Hyperactivation in Podocytes
  rationale: >-
    RhoA was hyperactivated in the Gupta knockdown podocytes and patient fibroblasts, but
    not in the Gee human podocyte assays, not in the Arhgdia-null mouse kidney, and only
    modestly and inconsistently in the Auguste allele panel. RHO inhibitors had no effect
    in the zebrafish model, where RAC1 inhibitors did. The weight of evidence favors
    RAC1, but no study has measured RHOA activation in patient podocytes.
- discussion_id: arhgdia_transplant_recurrence
  kind: KNOWLEDGE_GAP
  prompt: >-
    What is the outcome of kidney transplantation, including post-transplant recurrence,
    in ARHGDIA disease?
  attaches_to:
  - treatments#Kidney Transplantation
  rationale: >-
    The single reported graft failed from venous thrombosis and never functioned. A
    podocyte-intrinsic genetic lesion would predict that the donor kidney is unaffected,
    but no ARHGDIA-specific post-transplant data exist in the sources used here, and the
    entry does not infer a recurrence rate from other forms of monogenic SRNS.
- discussion_id: arhgdia_extrarenal_phenotype
  kind: KNOWLEDGE_GAP
  prompt: >-
    What causes the variable neurologic phenotype, and is there reproductive involvement in humans?
  attaches_to:
  - phenotypes#Intellectual Disability
  - animal_models#Arhgdia knockout mouse
  rationale: >-
    Gee Table 1 documents intellectual disability in the two genotyped G173V siblings and the R120X infant, with hearing loss in one G173V sibling and seizures and cortical blindness in the R120X infant. The p.Gly168Arg child was described as developmentally normal at 11 months. Few patients and early deaths limit assessment of neurologic and reproductive outcomes. Infertility in male knockout mice has not been established as a human phenotype in these reports.
  evidence:
  - reference: PMID:23867502
    reference_title: ARHGDIA mutations cause nephrotic syndrome via defective RHO GTPase signaling.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It is not clear whether individuals with ARHGDIA mutations also have abnormal

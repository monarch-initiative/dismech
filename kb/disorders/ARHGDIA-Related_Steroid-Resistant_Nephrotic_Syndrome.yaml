- name: Sensitization of Podocytes to Inflammatory Injury
  biological_scale: CELLULAR
  description: >-
    RhoGDIalpha-depleted podocytes respond to lipopolysaccharide with exaggerated p38 MAPK
    phosphorylation and greater loss of synaptopodin, an actin-associated podocyte
    protein. This proposes a route by which an environmental insult could compound the
    inherited lesion; it has been shown in cultured podocytes only.
  cell_types:
  - preferred_term: podocyte
    term:
      id: CL:0000653
      label: podocyte
  evidence:
  - reference: PMID:25503727
    reference_title: Loss of Rho-GDIα sensitizes podocytes to lipopolysaccharide-mediated injury.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In GDIα knockdown podocytes, the same events were triggered, but the levels of
      synaptopodin after LPS treatment were significantly lower than in control
      podocytes.
    explanation: Greater synaptopodin loss under the same injury.
  downstream:
  - target: Podocyte Actin Cytoskeleton Derangement
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      p38-dependent, proteasome- and cathepsin L-mediated synaptopodin degradation removes
      an actin-associated podocyte protein.
    evidence:
    - reference: PMID:25503727
      reference_title: Loss of Rho-GDIα sensitizes podocytes to lipopolysaccharide-mediated injury.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        These experiments reveal a common pathway by which heritable and environmental
        risk factors converge to injure podocytes, from Rac1 hyperactivation to p38
        phosphorylation and synaptopodin degradation via the ubiquitin-proteasome pathway
        and cathepsin L.
      explanation: The authors' summary of the intermediate steps.


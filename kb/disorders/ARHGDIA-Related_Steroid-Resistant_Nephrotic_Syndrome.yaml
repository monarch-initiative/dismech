      Renal injury develops over months in this constitutive model. The 1999 abstract emphasizes tubular degeneration, while the 2013 human paper summarizes mouse glomerulosclerosis and foot-process injury from earlier work. This does not establish identity with the diffuse mesangial sclerosis of human biopsies. The reproductive phenotype has no established human counterpart in these case reports.

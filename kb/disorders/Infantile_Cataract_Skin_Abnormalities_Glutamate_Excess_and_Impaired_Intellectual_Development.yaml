classifications:
  harrisons_chapter:
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
  icimd_category:
  - classification_value: glu_gln_and_asp_asn
    notes: >-
      ICIMD (Ferreira et al. 2021, PMID:33340416): group "Disorders of
      glutamate/glutamine and aspartate/asparagine metabolism" under category
      "Disorders of amino acid metabolism". This entity is the gain-of-function
      counterpart within that group — an inborn error of glutamate metabolism
      caused by excessive rather than deficient glutaminase activity.
description: >
  An inborn error of glutamate metabolism (CASGID; OMIM 618339) caused by a de
  novo hypermorphic p.Ser482Cys variant in GLS, the gene encoding
  phosphate-activated glutaminase. This is the mechanistic mirror image of GLS
  glutaminase deficiency: instead of losing the enzyme that hydrolyzes glutamine
  to glutamate, the variant makes glutaminase intrinsically hyperactive, so
  glutamate accumulates and glutamine is depleted. In the brain, magnetic
  resonance spectroscopic imaging showed extremely high glutamate in both grey
  and white matter with glutamine almost undetectable; given the neurotoxicity
  of excess glutamate, this is the proposed explanation for the profound
  developmental delay. A second consequence is a reduced capacity to detoxify
  reactive oxygen species, offering an explanation for the infantile cataract —
  a phenotype reproduced in zebrafish expressing the hypermorphic allele and
  alleviated by pharmacological GLS inhibition. Beyond the two title features,
  the reported patient had axial hypotonia, kyphosis, agitated and self-injuring
  behaviour, cerebral white matter involvement, and mild hyperammonemia.

  The Ser482 residue is conserved across roughly 12,000 GLS protein sequences
  from more than 1,000 genera, to the same degree as the catalytic residues,
  which the original authors interpret as evolutionary selection for an optimal
  but deliberately submaximal glutaminase activity. Together with the
  loss-of-function entities — Neonatal Epileptic Encephalopathy Due to
  Glutaminase Deficiency (MONDO:0032678 / OMIM 618328) and Global Developmental
  Delay, Progressive Ataxia, and Elevated Glutamine (MONDO:0032733 / OMIM
  618412) — this disorder makes GLS an unusually clean example of one gene
  producing opposite-direction disease through opposite-direction lesions. It is
  also a documented counterexample to the assumption that mono-allelic variants
  in enzyme-encoding genes are harmless.
references:
- reference: PMID:30239721
  title: "GLS hyperactivity causes glutamate excess, infantile cataract and profound developmental delay."
- reference: PMID:31734463
  title: "Metabolic fingerprinting reveals extensive consequences of GLS hyperactivity."
- reference: PMID:31603991
  title: "Inborn errors of enzymes in glutamate metabolism."

pathophysiology:
- name: De Novo GLS p.Ser482Cys Hypermorphic Variant
  biological_scale: MOLECULAR
  description: >
    The primary lesion is a heterozygous de novo missense variant, p.Ser482Cys,
    in GLS. Ser482 is not itself a catalytic residue but is conserved to the same
    degree as the catalytic residues across roughly 12,000 GLS sequences from
    more than 1,000 genera — evidence that its identity is under strong selection
    precisely because it tunes enzyme activity downward.
  evidence:
  - reference: PMID:30239721
    reference_title: "GLS hyperactivity causes glutamate excess, infantile cataract and profound developmental delay."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report a de novo Ser482Cys gain-of-function variant in GLS encoding GLS associated with profound developmental delay and infantile cataract."
    explanation: >
      Identifies the causal de novo gain-of-function GLS variant and the core
      clinical phenotype.
  - reference: PMID:30239721
    reference_title: "GLS hyperactivity causes glutamate excess, infantile cataract and profound developmental delay."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "Alignment of +/-12.000 GLS protein sequences from >1000 genera revealed extreme conservation of Ser482 to the same degree as catalytic residues."
    explanation: >
      Comparative-sequence evidence that Ser482 is under catalytic-residue-level
      selective constraint, supporting the pathogenicity of its substitution.
  downstream:
  - target: Intrinsic Glutaminase Hyperactivity
    description: >-
      The substitution alters the catalytic site environment, intrinsically
      raising enzyme activity.
    causal_link_type: DIRECT

- name: Intrinsic Glutaminase Hyperactivity
  biological_scale: MOLECULAR
  description: >
    Ser482Cys is proposed to improve the electrostatic environment of the
    glutaminase catalytic site, intrinsically inducing hyperactivity. This is a
    qualitative change in regulation rather than a simple quantitative increase:
    the enzyme is driven above the submaximal activity that evolutionary
    constraint on Ser482 appears designed to maintain, and the cell's homeostatic
    responses (see the compensatory node) fail to restore balance.
  molecular_functions:
  - preferred_term: glutaminase activity
    term:
      id: GO:0004359
      label: glutaminase activity
    modifier: GAIN_OF_FUNCTION
  evidence:
  - reference: PMID:30239721
    reference_title: "GLS hyperactivity causes glutamate excess, infantile cataract and profound developmental delay."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Functional analysis demonstrated that this variant causes hyperactivity and compensatory downregulation of GLS expression combined with upregulation of the counteracting enzyme GS, supporting pathogenicity."
    explanation: >
      Functional assays demonstrate enzyme hyperactivity, establishing the
      gain-of-function mechanism.
  - reference: PMID:30239721
    reference_title: "GLS hyperactivity causes glutamate excess, infantile cataract and profound developmental delay."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "Ser482Cys-GLS likely improves the electrostatic environment of the GLS catalytic site, thereby intrinsically inducing hyperactivity."
    explanation: >
      Provides the structural rationale for how the substitution raises
      catalytic activity.
  downstream:
  - target: Failed Homeostatic Compensation
    description: >-
      The cell responds by downregulating GLS and upregulating glutamine
      synthetase, but the compensation is insufficient.
    causal_link_type: DIRECT
  - target: Glutamate Excess and Glutamine Depletion
    description: Hyperactive glutaminase over-converts glutamine to glutamate.
    causal_link_type: DIRECT

- name: Failed Homeostatic Compensation
  biological_scale: CELLULAR
  description: >
    Cells mount a two-armed homeostatic response to the hyperactive enzyme:
    compensatory downregulation of GLS expression, and upregulation of the
    counteracting enzyme glutamine synthetase, which runs the reverse reaction
    (glutamate to glutamine). The persistence of severe glutamate excess and
    glutamine depletion in patient tissues shows this compensation to be
    insufficient. The presence of the compensatory response is itself part of the
    evidence for pathogenicity, since it demonstrates the cell registers the
    variant as a perturbation.
  evidence:
  - reference: PMID:30239721
    reference_title: "GLS hyperactivity causes glutamate excess, infantile cataract and profound developmental delay."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "compensatory downregulation of GLS expression combined with upregulation of the counteracting enzyme GS, supporting pathogenicity"
    explanation: >
      Documents both arms of the homeostatic response and their use as evidence
      of pathogenicity.
  downstream:
  - target: Glutamate Excess and Glutamine Depletion
    description: >-
      Compensation is insufficient to prevent the amino acid imbalance.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

- name: Glutamate Excess and Glutamine Depletion
  biological_scale: MOLECULAR
  description: >
    Hyperactive glutaminase drives excessive conversion of glutamine to
    glutamate. Increased glutamate with decreased glutamine was measured in urine
    and in fibroblasts, and the imbalance is far more extreme in brain, where
    magnetic resonance spectroscopic imaging showed extremely high glutamate in
    both grey and white matter with glutamine almost undetectable. This is the
    exact biochemical inverse of the hyperglutaminemia of glutaminase deficiency.
    Notably the imbalance is compartment-dependent: cerebrospinal-fluid glutamate
    and glutamine were reported as unremarkable even while brain-tissue
    spectroscopy was grossly abnormal, so a normal CSF amino acid profile does
    not exclude the diagnosis.
  biological_processes:
  - preferred_term: L-glutamine catabolic process
    term:
      id: GO:0006543
      label: L-glutamine catabolic process
    modifier: INCREASED
  - preferred_term: L-glutamate biosynthetic process
    term:
      id: GO:0097054
      label: L-glutamate biosynthetic process
    modifier: INCREASED
  evidence:
  - reference: PMID:30239721
    reference_title: "GLS hyperactivity causes glutamate excess, infantile cataract and profound developmental delay."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In line with GLS hyperactivity, increased glutamate and decreased glutamine concentrations were measured in urine and fibroblasts."
    explanation: >
      Documents the directional amino acid imbalance in patient urine and
      fibroblasts.
  - reference: PMID:30239721
    reference_title: "GLS hyperactivity causes glutamate excess, infantile cataract and profound developmental delay."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the brain (both grey and white matter), glutamate was also extremely high and glutamine was almost undetectable"
    explanation: >
      Documents the severity of the imbalance in the target organ, measured
      non-invasively by MR spectroscopic imaging.
  - reference: PMID:31603991
    reference_title: "Inborn errors of enzymes in glutamate metabolism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CSF: =glutamate, =glutamine"
    explanation: >
      Records that cerebrospinal-fluid glutamate and glutamine were unchanged,
      establishing the compartment dissociation from the abnormal brain-tissue
      spectroscopy.
  downstream:
  - target: Glutamate Neurotoxicity
    description: Excess brain glutamate is neurotoxic.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Impaired Reactive Oxygen Species Detoxification
    description: >-
      Hypermorphic GLS expression reduces the capacity to detoxify reactive
      oxygen species.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Broad Metabolic Network Remodeling
    description: >-
      The glutamine-to-glutamate shift propagates through the TCA cycle,
      transamination, and nucleotide metabolism.
    causal_link_type: DIRECT

- name: Broad Metabolic Network Remodeling
  biological_scale: MOLECULAR
  description: >
    Because glutaminase sits at the junction of many pathways, its hyperactivity
    remodels the metabolome well beyond the glutamine/glutamate pair. In a
    HEK293 model tuning GLS activity, 109 endogenously relevant metabolite
    features were significantly affected: TCA-cycle intermediates rose with a
    truncation of the cycle at citrate; transamination products, proline and
    ornithine synthesis, and GABA metabolism increased; and asparagine and
    nucleotide metabolites — notably pyrimidine/thymine metabolites — fell in
    step with glutamine. This positions the disorder as a broad metabolic
    perturbation rather than a single-metabolite excess, and plausibly underlies
    the mild hyperammonemia and the raised brain alanine and lactate reported in
    the patient.
  biological_processes:
  - preferred_term: glutamate metabolic process
    term:
      id: GO:0006536
      label: glutamate metabolic process
    modifier: INCREASED
  evidence:
  - reference: PMID:31734463
    reference_title: "Metabolic fingerprinting reveals extensive consequences of GLS hyperactivity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "109 features corresponding to endogenously relevant metabolites were significantly affected by high GLS activity"
    explanation: >
      Quantifies the breadth of the metabolic consequences of GLS hyperactivity
      in a cell model expressing the hypermorphic variant.
  - reference: PMID:31734463
    reference_title: "Metabolic fingerprinting reveals extensive consequences of GLS hyperactivity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "increased levels of tricarboxylic acid (TCA) intermediates with a truncation of the TCA cycle at the level of citrate"
    explanation: >
      Documents the truncation of the TCA cycle at citrate under high
      glutaminase activity.
  - reference: PMID:31734463
    reference_title: "Metabolic fingerprinting reveals extensive consequences of GLS hyperactivity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "metabolites of transamination reactions, proline and ornithine synthesis and GABA metabolism"
    explanation: >
      Identifies the additional pathways remodeled by high glutaminase activity,
      including the GABA arm relevant to a neurological phenotype.

- name: Glutamate Neurotoxicity
  biological_scale: CELLULAR
  description: >
    Glutamate is neurotoxic in excess (excitotoxicity), and the brain glutamate
    concentrations measured in this patient were strikingly high. The original
    authors advance this as the explanation for the profound developmental delay.
    Note the direction of the claim: this is the same neurotransmitter whose
    deficiency is invoked in GLS loss-of-function disease, so glutaminase
    disorders damage the brain from either direction.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:30239721
    reference_title: "GLS hyperactivity causes glutamate excess, infantile cataract and profound developmental delay."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Considering the neurotoxicity of glutamate when present in excess, the strikingly high glutamate concentrations measured in the brain provide an explanation for the developmental delay."
    explanation: >
      Links the measured brain glutamate excess to the neurodevelopmental
      phenotype via excitotoxicity.
  downstream:
  - target: Profound Developmental Delay
    description: Glutamate excitotoxicity impairs neurodevelopment.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Cerebral White Matter Involvement
    description: >-
      White matter is affected, consistent with the elevated glutamate measured
      in white matter as well as grey matter.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

- name: Impaired Reactive Oxygen Species Detoxification
  biological_scale: CELLULAR
  description: >
    Expression of the hypermorphic Ser482Cys allele reduces the capacity to
    detoxify reactive oxygen species. Because cataract is a known consequence of
    oxidative stress, this provides the mechanistic route from a glutamine
    metabolism defect to a lens phenotype — a connection that is otherwise
    non-obvious.
  biological_processes:
  - preferred_term: response to oxidative stress
    term:
      id: GO:0006979
      label: response to oxidative stress
    modifier: DECREASED
  evidence:
  - reference: PMID:30239721
    reference_title: "GLS hyperactivity causes glutamate excess, infantile cataract and profound developmental delay."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The capacity to detoxify reactive oxygen species was reduced upon Ser482Cys-GLS expression, providing an explanation for cataract formation."
    explanation: >
      Establishes impaired reactive-oxygen-species handling as the proposed
      mechanism linking GLS hyperactivity to cataract.
  downstream:
  - target: Lens Opacification
    description: Oxidative stress in the lens drives crystallin damage and opacification.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

- name: Lens Opacification
  biological_scale: TISSUE
  description: >
    Loss of lens transparency producing bilateral cataract of early onset. The
    causal chain from the GLS variant was demonstrated experimentally in
    zebrafish: cataract was evoked by expressing hypermorphic Ser482Cys-GLS, and
    — importantly for therapeutic reasoning — was alleviated by inhibition of
    GLS.
  cell_types:
  - preferred_term: lens fiber cell
    term:
      id: CL:0011004
      label: lens fiber cell
  evidence:
  - reference: PMID:30239721
    reference_title: "GLS hyperactivity causes glutamate excess, infantile cataract and profound developmental delay."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Cataract, a known consequence of oxidative stress, was evoked in zebrafish expressing the hypermorphic Ser482Cys-GLS and could be alleviated by inhibition of GLS."
    explanation: >
      Establishes causality in an animal model and demonstrates reversibility on
      GLS inhibition.
  downstream:
  - target: Early-Onset Bilateral Cataract
    description: Lens opacification manifests clinically as early-onset bilateral cataract.
    causal_link_type: DIRECT

- name: Early-Onset Bilateral Cataract
  biological_scale: ORGANISM

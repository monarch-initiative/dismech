treatments:
- name: Supportive and Symptomatic Care
  description: >
    No disease-modifying therapy is established. Management is supportive, with
    developmental support, ophthalmological management of the cataract, and
    behavioural support for the agitated and self-injuring behaviour.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care

- name: Genetic Counseling
  description: >
    Genetic counseling for a de novo dominant variant, including discussion of
    the low but non-zero recurrence risk from gonadal mosaicism.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling

- name: Glutaminase Inhibition (investigational)
  description: >
    Pharmacological GLS inhibition is the mechanistically rational therapy for a
    hypermorphic GLS allele, and glutaminase inhibitors already exist in
    oncology. Proof of concept is limited to the zebrafish model, where GLS
    inhibition alleviated the cataract phenotype. This has NOT been tested in
    humans with this disorder, and no dosing, safety, or efficacy data in
    patients exist — it is recorded here as a mechanistic lead, not a treatment
    recommendation.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Intrinsic Glutaminase Hyperactivity
    treatment_effect: INHIBITS
    description: >-
      A glutaminase inhibitor would directly counter the hyperactivity of the
      Ser482Cys enzyme.
  evidence:
  - reference: PMID:30239721
    reference_title: "GLS hyperactivity causes glutamate excess, infantile cataract and profound developmental delay."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "Cataract, a known consequence of oxidative stress, was evoked in zebrafish expressing the hypermorphic Ser482Cys-GLS and could be alleviated by inhibition of GLS."
    explanation: >
      Zebrafish proof of concept that GLS inhibition reverses a disease
      phenotype. PARTIAL because the evidence is confined to an animal model and
      to the cataract phenotype, with no human data.

discussions:
- discussion_id: casgid-skin-abnormalities-in-name-unevidenced
  kind: KNOWLEDGE_GAP
  status: RESOLVED
  prompt: >-
    The OMIM/MONDO name for this entity asserts "skin abnormalities", but the
    primary report's abstract does not document any dermatological phenotype.
    What is the skin phenotype, and how frequent is it?
  rationale: >-
    The entity name (OMIM 618339, MONDO:0032685) lists four features: infantile
    cataract, skin abnormalities, glutamate excess, and impaired intellectual
    development. Three of the four are evidenced in the abstract of the original
    report (PMID:30239721); the skin abnormalities are not mentioned there at
    all, and the clinical table in PMID:31603991 itemizes this patient only under
    Development, Neurologic, Structural, and Ophthalmologic headings. The entry
    initially omitted the skin phenotype rather than curate it on the strength of
    a disease name.
  resolution_note: >-
    Resolved by the discussion prose of PMID:31603991, which does record skin
    involvement for this disorder even though its per-patient table does not:
    "Different skin abnormalities are seen in patients with GS deficiency, GLS
    hyperactivity, PSAT and TAT deficiency", reported as 2.5-3.0x more common in
    glutamate-related disorders than in other Mendelian disorders. A Skin
    abnormality phenotype bound to HP:0000951 has been added on that basis. Two
    limits remain and are deliberately not overstated: the source does not say
    which specific skin findings this patient had, so no specific lesion is
    asserted; and the statement is made at the level of the disorder class rather
    than the individual, so it substantiates the "skin abnormalities" component
    of the entity name without establishing its severity or frequency in a single
    reported case. The oxidative-stress question below remains a live mechanistic
    hypothesis rather than a documented finding.
  attaches_to:
  - "pathophysiology#Impaired Reactive Oxygen Species Detoxification"
  proposed_experiments:
  - experiment_id: exp_casgid_skin_phenotype_specificity
    name: Characterize which skin findings occur in GLS hyperactivity
    description: >-
      Retrieve the full text of PMID:30239721 (or the OMIM 618339 clinical
      synopsis) and extract the specific dermatological findings, so the
      annotation can be refined from the general HP:0000951 to a specific lesion
      term.
  - experiment_id: exp_casgid_ros_skin_mechanism
    name: Test whether the lens oxidative-stress mechanism extends to skin
    description: >-
      Assess whether the impaired reactive-oxygen-species detoxification already
      curated for the lens also operates in skin, since that defect is not
      tissue-restricted and the review links reduced redox buffer capacity to
      cataract. Patient fibroblasts are already available and showed the amino
      acid imbalance, making them the natural test system.
  posed_by: curator
  resolved_date: "2026-08-07T00:00:00Z"
  evidence:
  - reference: PMID:31603991
    reference_title: "Inborn errors of enzymes in glutamate metabolism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Different skin abnormalities are seen in patients with GS deficiency, GLS hyperactivity, PSAT and TAT deficiency"
    explanation: >-
      Documents skin abnormalities in GLS hyperactivity, resolving the gap and
      substantiating the "skin abnormalities" component of the entity name.

- discussion_id: gls-bidirectional-allelic-series
  kind: INTERPRETATION
  status: OPEN
  prompt: >-
    Should the three GLS disease entities be collected into a dismech Grouping,
    and if so where is the boundary?
  rationale: >-
    GLS produces three distinct MONDO entities by two opposite mechanisms:
    complete loss of function (MONDO:0032678, this KB's Neonatal Epileptic
    Encephalopathy Due to Glutaminase Deficiency), partial loss of function
    (MONDO:0032733, Global Developmental Delay, Progressive Ataxia, and Elevated
    Glutamine), and gain of function (MONDO:0032685, this entry). MONDO's own
    grouping class MONDO:0600001 (glutaminase deficiency) covers only the
    loss-of-function arm and therefore cannot serve as a closeMatch for a
    grouping spanning all three. A grouping over all three would capture the
    antagonistic structure — one gene, opposite-direction lesions,
    opposite-direction biochemistry (glutamine accumulation with normal ammonia
    versus glutamine depletion with mild hyperammonemia) — which is the
    scientifically interesting claim.
  notes: >-
    Implementation caution: a NECESSARY_AND_SUFFICIENT "HAS_GENE GLS" criterion
    would over-generate, because Chromosome_2q32-q33_Deletion_Syndrome binds
    hgnc:4331 as one of its deleted neighbouring genes without being a GLS
    allelic disorder. Either use NECESSARY-only semantics or add a NOT leaf
    excluding contiguous-gene-deletion syndromes.
  posed_by: curator

notes: >-
  Naming: the acronym CASGID is used for this entity. The dismech entry name
  follows the full OMIM/MONDO descriptive name for consistency with the sibling
  GLS entry Global Developmental Delay, Progressive Ataxia, and Elevated
  Glutamine, which is named the same way. Note an internal inconsistency in the
  sources on cataract timing: the original report titles the feature "infantile
  cataract" (as does the OMIM/MONDO entity name), while the review's clinical
  table records "Neonatal bilateral cataracts". Both are curated here — the
  phenotype records neonatal onset per the more specific source, and the entry
  name retains the ontology wording.

  Evidence scope: this entry rests on a single patient (PMID:30239721), that
  patient's re-tabulation and discussion in a review of inborn errors of
  glutamate metabolism (PMID:31603991), and a cell-model metabolomics follow-up
  (PMID:31734463) from the same group. Treat the phenotype list as a floor, not
  a description of the full clinical spectrum, which a single case cannot
  establish.

  On sourcing from PMID:31603991: several findings appear in that paper only as
  cells of a per-patient clinical table (mild plasma hyperammonemia; the
  bilateral, neonatal characterization of the cataract). Table cells are not
  quotable evidence in this repository — they carry no propositional content and
  do not reliably survive text extraction — so those details are recorded in
  prose here rather than carried as evidence snippets, and the corresponding
  claims are cited to the paper's discussion text instead wherever it makes the
  same point. Mild hyperammonemia is therefore noted here but not curated as a
  phenotype or biochemical record, since no sentence in the paper states it.
  Reading that discussion text also resolved the skin-abnormalities gap and
  surfaced the absence of seizures.

  Absence of seizures: the review flags as remarkable that this patient, despite
  brain glutamate excess, did not develop seizures — even though seizures are
  markedly more common across inborn errors of glutamate metabolism. This is
  carried as PARTIAL evidence on the Glutamate Neurotoxicity node, because it
  constrains the excitotoxicity model rather than supporting it, and it is the
  sharpest clinical contrast with the loss-of-function entities, whose defining
  feature is refractory epilepsy. The schema has no slot for an excluded
  phenotype, so it is not represented in the phenotypes list.

  Direction-of-effect discipline: glutamate is invoked as the damaging species
  here and as the deficient species in GLS loss-of-function disease. Both claims
  are separately evidenced in their own entries and are not in conflict — they
  are the two failure modes of a system that the conservation of Ser482 suggests
  is tuned to an optimal, submaximal glutaminase activity. The ammonia direction
  differs the same way: mild hyperammonemia here, characteristically normal
  ammonia in the deficiency entities.

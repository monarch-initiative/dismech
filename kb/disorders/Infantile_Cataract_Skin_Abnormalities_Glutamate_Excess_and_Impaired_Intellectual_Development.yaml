genetic:
- name: GLS
  gene_term:
    preferred_term: GLS
    term:
      id: hgnc:4331
      label: GLS
  relationship_type: CAUSATIVE
  variant_origin: DE_NOVO
  notes: >
    A heterozygous de novo missense variant p.Ser482Cys in GLS causes this
    disorder by a hypermorphic (gain-of-function) mechanism — the enzyme is
    intrinsically hyperactive. This is the opposite direction of effect from the
    biallelic loss-of-function alleles that cause Neonatal Epileptic
    Encephalopathy Due to Glutaminase Deficiency, and from the noncoding 5'
    untranslated region GCA-repeat expansion that causes Global Developmental
    Delay, Progressive Ataxia, and Elevated Glutamine. Inheritance is
    correspondingly different: this entity is mono-allelic and dominant, arising
    de novo, whereas both loss-of-function entities are bi-allelic and autosomal
    recessive.
  evidence:
  - reference: PMID:30239721
    reference_title: "GLS hyperactivity causes glutamate excess, infantile cataract and profound developmental delay."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report a de novo Ser482Cys gain-of-function variant in GLS"
    explanation: >
      Identifies the causal de novo gain-of-function GLS allele.
  - reference: PMID:31603991
    reference_title: "Inborn errors of enzymes in glutamate metabolism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "GLS hyperactivity illustrates that mono‐allelic, dominant enzyme defects can be harmful as well."
    explanation: >
      Classifies the GLS hyperactivity disorder as a mono-allelic, dominant
      enzyme defect, distinguishing it from the bi-allelic recessive
      glutaminase-deficiency entities.
  variants:
  - name: "GLS p.Ser482Cys"
    description: >-
      De novo heterozygous missense variant substituting cysteine for the highly
      conserved serine at position 482 of glutaminase. Not a catalytic residue,
      but conserved to the same degree as the catalytic residues; the
      substitution is proposed to improve the electrostatic environment of the
      catalytic site and thereby raise activity.
    gene:
      preferred_term: GLS
      term:
        id: hgnc:4331
        label: GLS
    evidence:
    - reference: PMID:30239721
      reference_title: "GLS hyperactivity causes glutamate excess, infantile cataract and profound developmental delay."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Ser482Cys-GLS likely improves the electrostatic environment of the GLS catalytic site, thereby intrinsically inducing hyperactivity."
      explanation: >
        Describes the structural mechanism by which the variant raises
        glutaminase activity.

inheritance:
- name: Autosomal dominant (de novo)
  description: >
    Autosomal dominant, arising de novo. A single hypermorphic allele suffices,
    in contrast to the autosomal recessive, biallelic requirement of the GLS
    loss-of-function disorders. This entity is cited as a counterexample to the
    working assumption that mono-allelic variants in enzyme-encoding genes are
    usually harmless — an assumption that can cause such variants to be filtered
    out during exome analysis.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:30239721
    reference_title: "GLS hyperactivity causes glutamate excess, infantile cataract and profound developmental delay."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report a de novo Ser482Cys gain-of-function variant in GLS"
    explanation: >
      A single de novo allele is reported as causal, consistent with dominant
      inheritance.
  - reference: PMID:31603991
    reference_title: "Inborn errors of enzymes in glutamate metabolism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The identification of disease causing variants might be hampered by the current paradigm that mono‐allelic variants in enzyme‐encoding genes are usually harmless."
    explanation: >
      Documents the diagnostic pitfall that makes a dominant, mono-allelic
      enzyme-gene variant liable to be dismissed during variant filtering.


    explanation: >
      Documents decreased glutamine in urine and fibroblasts.

- name: Brain glutamate (MR spectroscopic imaging)
  presence: INCREASED
  context: >
    Brain glutamate measured by magnetic resonance spectroscopic imaging is
    extremely high in both grey and white matter, with glutamine almost
    undetectable. Because the proposed toxic species acts in the brain, this
    non-invasive measurement is the mechanistically decisive one; it was obtained
    at clinical field strength and confirmed at ultra-high field. The same
    spectroscopy also showed reduced N-acetylaspartate with raised alanine and
    lactate.
  biomarker_term:
    preferred_term: L-glutamate(1-)
    term:

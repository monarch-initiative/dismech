pathophysiology:
- name: COLGALT1 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic COLGALT1 variants reduce or abolish ColGalT1, the endoplasmic reticulum galactosyltransferase
    that transfers galactose to hydroxylysine residues of collagens before triple-helix formation. Structural
    modelling predicts that the p.Leu151Arg and p.Ala154Pro missense variants destabilize folding, and
    patient 1 of the founding report had no detectable ColGalT1 protein or activity. The c.625-2A>C splice
    variant mainly produces a frameshifted transcript subject to nonsense-mediated decay.
  genes:
  - preferred_term: COLGALT1
    term:
      id: hgnc:26182
      label: COLGALT1
  molecular_functions:
  - preferred_term: collagen beta(1-O)galactosyltransferase activity
    term:
      id: GO:0050211
      label: procollagen galactosyltransferase activity
    modifier: DECREASED
  evidence:
  - reference: PMID:30412317
    reference_title: Biallelic COLGALT1 variants are associated with cerebral small vessel disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: "ColGalT1 protein expression and ColGalT activity in Patient 1 were undetectable."
    explanation: Loss of enzyme protein and activity in patient-derived cells.
  - reference: PMID:30412317
    reference_title: Biallelic COLGALT1 variants are associated with cerebral small vessel disease.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    snippet: "Three-dimensional model analysis suggested that p.Leu151Arg and p.Ala154Pro destabilized protein folding, which impaired enzymatic activity."
    explanation: Structural modelling predicts that two missense alleles impair folding and activity.
  - reference: PMID:19075007
    reference_title: Core glycosylation of collagen is initiated by two beta(1-O)galactosyltransferases.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: "Amino acid analysis of the products of GLT25D1 and GLT25D2 reactions confirmed the transfer of galactose to hydroxylysine residues."
    explanation: Biochemical assays establish GLT25D1 (COLGALT1) as a collagen hydroxylysine galactosyltransferase, the activity that is lost.
  - reference: PMID:20470363
    reference_title: The human collagen beta(1-O)galactosyltransferase, GLT25D1, is a soluble endoplasmic reticulum localized protein.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: "In agreement with the predictions our results show that GLT25D1 is directed to the ER lumen as a soluble protein and retained there."
    explanation: Places the enzyme in the ER lumen, where collagen chains are modified before triple-helix assembly.
  downstream:
  - target: Impaired Collagen IV Production and Secretion
    description: >-
      Reduced ColGalT1 lowers COL4A1 secretion, and wild-type but not mutant COLGALT1 restores COL4A1
      production. Hypogalactosylation of collagen IV has been inferred in mouse fibroblasts but not measured
      in patient material.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:30412317
      reference_title: Biallelic COLGALT1 variants are associated with cerebral small vessel disease.
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      snippet: "RNA interference studies demonstrated that reduced ColGalT1 altered COL4A1 secretion, and rescue experiments showed that mutant COLGALT1 insufficiently restored COL4A1 production in cells compared with wild type."
      explanation: Knockdown and rescue experiments link ColGalT1 activity to COL4A1 secretion and production.
- name: Impaired Collagen IV Production and Secretion
  biological_scale: CELLULAR
  description: >-
    Without adequate ColGalT1 activity, cells produce and secrete less of the collagen IV alpha1 chain. In
    Colgalt1 mutant mouse embryonic fibroblasts collagen IV instead accumulates inside cells and in the
    matrix with a lower molecular mass and signs of degradation, so the human and mouse cell systems
    disagree on secretion but agree that collagen IV processing and stability depend on COLGALT1.
  biological_processes:
  - preferred_term: collagen IV biosynthesis
    term:
      id: GO:0032964
      label: collagen biosynthetic process
    modifier: DECREASED
  evidence:
  - reference: PMID:30412317
    reference_title: Biallelic COLGALT1 variants are associated with cerebral small vessel disease.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: "RNA interference studies demonstrated that reduced ColGalT1 altered COL4A1 secretion, and rescue experiments showed that mutant COLGALT1 insufficiently restored COL4A1 production in cells compared with wild type."
    explanation: Reduced COL4A1 secretion and production when ColGalT1 is reduced or mutant.
  - reference: PMID:31101663
    reference_title: Loss of function of Colgalt1 disrupts collagen post-translational modification and causes musculoskeletal defects.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    snippet: "Analysis of mutant-derived embryonic fibroblasts reveals that COLGALT1 acts on collagen IV and VI, and, while collagen VI appears stable and its secretion is not affected, collagen IV accumulates inside of cells and within the extracellular matrix, possibly due to instability and increased degradation."
    explanation: >-
      Mouse fibroblasts confirm that collagen IV is a COLGALT1 substrate whose stability depends on it,
      although the direction of the secretion change differs from the human cell data.
  - reference: PMID:31101663
    reference_title: Loss of function of Colgalt1 disrupts collagen post-translational modification and causes musculoskeletal defects.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    snippet: "This shift is likely due to the loss of COLGALT1-mediated galactosylation of hydroxylysines."
    explanation: The lower molecular mass of collagen IV in mutant mouse cells is attributed to missing hydroxylysine galactosylation.
  downstream:
  - target: Cerebral Small Vessel Basement Membrane Fragility
    description: >-
      A deficit of collagen IV, the main structural collagen of vascular basement membranes, is proposed to
      weaken cerebral small vessels as in COL4A1 and COL4A2 disease. Vessel-wall pathology has not been
      examined in a COLGALT1 patient.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:30412317
      reference_title: Biallelic COLGALT1 variants are associated with cerebral small vessel disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      snippet: "Biallelic COLGALT1 variants cause cerebral small vessel abnormalities through a common molecular pathogenesis with COL4A1/COL4A2-related disorders."
      explanation: The founding authors' interpretation that the collagen IV deficit converges on the COL4A1/COL4A2 vessel pathology.
    - reference: PMID:41911597
      reference_title: "Spontaneous atraumatic pediatric basal ganglia hemorrhage in the setting of COLGALT1-related collagenopathy: illustrative case."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      quote_role: BACKGROUND
      snippet: "Loss of this enzymatic function results in underprocessed collagen and secondary basement-membrane weakness, similarly predisposing small vessels to rupture."
      explanation: Background statement of the proposed collagen-to-basement-membrane step.
- name: Cerebral Small Vessel Basement Membrane Fragility
  biological_scale: TISSUE
  description: >-
    Cerebral small vessels with a deficient collagen IV basement membrane are proposed to be fragile and
    prone to rupture before birth, in childhood or in adult life, and to cause small deep infarcts and
    white matter disease. This node is inferred from the shared collagen IV biology; no vascular
    ultrastructure from a COLGALT1 patient has been reported.
  locations:
  - preferred_term: brain
    term:
      id: UBERON:0000955
      label: brain
  biological_processes:
  - preferred_term: basement membrane organization
    term:
      id: GO:0071711
      label: basement membrane organization
    modifier: DECREASED
  evidence:
  - reference: PMID:41911597
    reference_title: "Spontaneous atraumatic pediatric basal ganglia hemorrhage in the setting of COLGALT1-related collagenopathy: illustrative case."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    quote_role: BACKGROUND
    snippet: "Loss of this enzymatic function results in underprocessed collagen and secondary basement-membrane weakness, similarly predisposing small vessels to rupture."
    explanation: Background statement of basement-membrane weakness as the substrate of vessel rupture.
  - reference: PMID:31101663
    reference_title: Loss of function of Colgalt1 disrupts collagen post-translational modification and causes musculoskeletal defects.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    snippet: "Upon dissection, the integument also feels weakened and is frequently marked with areas of hemorrhaging."
    explanation: Colgalt1 mutant mouse embryos show hemorrhage, consistent with vessel fragility; cerebral vessels were not specifically examined.
  downstream:
  - target: Cerebral Hemorrhage
    description: Fragile small vessels rupture, giving parenchymal and periventricular hemorrhage.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:33709034
      reference_title: "Biallelic Variants in the COLGALT1 Gene Causes Severe Congenital Porencephaly: A Case Report."

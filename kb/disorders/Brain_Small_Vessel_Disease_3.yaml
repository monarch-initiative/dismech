      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      quote_role: BACKGROUND
      snippet: "Because of inappropriate 3D-construction, there is an instability of the basal membrane in arteries, creating a high vulnerability to cerebrovascular incidents."
      explanation: Background statement, made for collagen IV brain small vessel disease, linking basement membrane instability to cerebrovascular events.
  - target: Lacunar Stroke
    description: >-
      Small deep infarcts are a feature of the small vessel disease shared with COL4A1 and COL4A2 disease; the
      COLGALT1-specific route to ischemia is not established.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:39785835
      reference_title: Young-Onset Cerebral Small Vessel Disease Associated with COLGALT1 Mutation.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      snippet: "Magnetic resonance imaging of the brain showed an acute lacunar infarct in the right corona radiata, with the surrounding area blooming."
      explanation: Lacunar infarct in the adult homozygous p.Gly377Arg patient, whose variant is of uncertain significance.
  - target: Leukoencephalopathy
    description: Confluent white matter disease is part of the small vessel phenotype; its mechanism in COLGALT1 disease is not established.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:33709034
      reference_title: "Biallelic Variants in the COLGALT1 Gene Causes Severe Congenital Porencephaly: A Case Report."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      snippet: "The MRI changes with porencephalic cysts, hemorrhages, leukoencephalopathy, and ischemia confirmed the clinical phenotype."
      explanation: Leukoencephalopathy accompanies hemorrhage and ischemia in the congenital form.

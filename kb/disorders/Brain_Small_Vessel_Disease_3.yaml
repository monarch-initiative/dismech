animal_models:
- name: Colgalt1 fosse ENU mutant mouse
  species: Mouse
  genotype: Colgalt1 fosse/fosse (ENU-induced)
  publication: PMID:31101663
  description: >-
    Homozygous Colgalt1 mutant embryos die perinatally with skeletal and muscle defects and areas of
    hemorrhage in the integument; mutant fibroblasts show intracellular accumulation and degradation of
    collagen IV.
  modeled_mechanisms:
  - target: Impaired Collagen IV Production and Secretion
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    limitations: >-
      Mutant fibroblasts show more, not less, collagen IV in the medium, with degradation products, unlike the
      reduced COL4A1 secretion seen in human knockdown cells. Brain vessels and cerebral hemorrhage were not
      characterized, and homozygotes do not survive birth.
    evidence:
    - reference: PMID:31101663
      reference_title: Loss of function of Colgalt1 disrupts collagen post-translational modification and causes musculoskeletal defects.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      snippet: "Analysis of mutant-derived embryonic fibroblasts reveals that COLGALT1 acts on collagen IV and VI, and, while collagen VI appears stable and its secretion is not affected, collagen IV accumulates inside of cells and within the extracellular matrix, possibly due to instability and increased degradation."
      explanation: Collagen IV processing and stability are disturbed in mutant fibroblasts.
  evidence:
  - reference: PMID:31101663
    reference_title: Loss of function of Colgalt1 disrupts collagen post-translational modification and causes musculoskeletal defects.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: "Colgalt1fosse/fosse embryos exhibit a number of defects, including perinatal lethality and a disorganization of muscle fibers."
    explanation: Perinatal lethality of the homozygous mutant.
discussions:
- discussion_id: gap_colgalt1_collagen_iv_secretion_direction
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired Collagen IV Production and Secretion
  - pathophysiology#Cerebral Small Vessel Basement Membrane Fragility
  prompt: >-
    Does COLGALT1 deficiency reduce collagen IV secretion, as in human knockdown cells, or increase
    secretion of an unstable, degraded collagen IV, as in mouse fibroblasts, and is cerebral vascular
    basement membrane collagen IV actually reduced in patients?
  rationale: >-
    The proposed causal chain rests on reduced COL4A1 secretion in cultured cells. Hypogalactosylation of
    collagen IV has not been measured in patient material, the mouse model shows the opposite direction of
    secretion change, and no patient vessel histology is available, so the basement-membrane and fragility
    nodes are inferred from COL4A1 and COL4A2 disease.
notes: >-
  No mechanism module in kb/modules covers collagen post-translational modification or collagen IV
  basement-membrane fragility, so no conforms_to is declared; congenital_disorder_of_glycosylation models
  N-glycan assembly rather than collagen hydroxylysine O-glycosylation. The adult homozygous p.Gly377Arg
  case (PMID:39785835) is reported with a variant of uncertain significance, so its later-onset lacunar
  phenotype is included provisionally. No GeneReviews chapter covers COLGALT1 or brain small vessel disease
  3; the COL4A1-Related Disorders chapter (PMID:20301768) is cited only for the generic link from
  porencephaly to epilepsy. Cerebral microbleeds (reported in the adult case) have no phenotype node
  because HPO has no microbleed term (searched l~microbleed, l~microhem and l~hemosiderin in the HP
  build); they are recorded in the description and under Cerebral Hemorrhage.

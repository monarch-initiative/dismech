name: Brain Small Vessel Disease 3 (COLGALT1)
category: Mendelian
creation_date: "2026-11-23T12:00:00Z"
synonyms:
- brain small vessel disease 3
- BSVD3
description: >-
  Brain small vessel disease 3 is an autosomal recessive cerebral small vessel disease caused by biallelic
  variants in COLGALT1, which encodes collagen beta(1-O)galactosyltransferase 1 (ColGalT1, also called
  GLT25D1), a soluble endoplasmic reticulum enzyme that adds galactose to hydroxylysine residues of collagens.
  Loss of ColGalT1 activity reduces production and secretion of the collagen IV alpha1 chain, the main
  structural collagen of vascular basement membranes, so the disease is thought to share its downstream
  pathogenesis with the dominant COL4A1 and COL4A2 brain small vessel diseases. The phenotype depends on
  the timing and site of intracranial bleeding. Onset in utero or infancy gives porencephaly,
  periventricular hemorrhage, hydrocephalus, microcephaly, severe developmental delay, epilepsy including
  infantile spasms, and spastic tetraplegia; another patient had an acute basal ganglia hemorrhage at 14
  years, and a homozygous hypomorphic allele of uncertain significance has been reported in an adult with
  recurrent lacunar strokes, leukoencephalopathy and microbleeds. About five patients have been reported.
  ClinGen classifies the COLGALT1 association as Moderate. There is no disease-specific treatment.

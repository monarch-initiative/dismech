name: Interleukin-10 Receptor Deficiency
creation_date: "2026-08-22T00:00:00Z"
category: Mendelian
synonyms:
- IL-10 receptor deficiency
- IL10R deficiency
- inflammatory bowel disease 28
- IBD28
- inflammatory bowel disease 25
- IBD25
- infantile-onset inflammatory bowel disease
description: >-
  Interleukin-10 receptor deficiency is an autosomal recessive monogenic form of
  very-early-onset inflammatory bowel disease and the archetype of the
  immune-mediated congenital enteropathies - the class that the three epithelial
  CODE mechanism modules explicitly exclude, because here the intestinal
  epithelium is intrinsically normal and is damaged secondarily by unrestrained
  immune activity. Biallelic loss-of-function variants in IL10RA or IL10RB
  disable the two chains of the interleukin-10 receptor, a heterotetramer of two
  IL10R1 (IL10RA) and two IL10R2 (IL10RB) subunits. Interleukin-10 is the
  principal brake on inflammatory cytokine output, so losing its receptor
  abolishes the negative-feedback loop that normally restrains myeloid cells:
  IL-10 fails to trigger JAK1/Tyk2-dependent STAT3 phosphorylation, and patient
  mononuclear cells secrete excess tumour necrosis factor alpha and other
  proinflammatory cytokines. In the gut - which is under continuous microbial
  stimulation and therefore most dependent on this brake - the result is severe
  enterocolitis presenting in the first months of life, with perianal disease,
  abscesses and enterocutaneous fistulas that are characteristically refractory
  to the entire conventional armamentarium including corticosteroids,
  immunosuppressants and anti-TNF antibodies. That refractoriness is
  mechanistically expected rather than incidental: blocking one downstream
  cytokine cannot substitute for a missing master regulator. Allogeneic
  haematopoietic stem-cell transplantation, which replaces the patient's myeloid
  compartment with cells carrying a functional receptor, is the definitive
  treatment and induced remission in the index case. Note that IL10R2 is shared
  by the receptors for interleukin-22 and interleukin-26, so IL10RB deficiency is
  not strictly confined to interleukin-10 signalling.
disease_term:
  preferred_term: interleukin-10 receptor deficiency
  term:
    id: MONDO:0013153
    label: inflammatory bowel disease 28
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0012941
      label: inflammatory bowel disease 25
    mapping_predicate: skos:narrowMatch
    mapping_source: OMIM:612567
    mapping_justification: >
      MONDO splits interleukin-10 receptor deficiency by receptor chain, with
      MONDO:0013153 (IBD28) for IL10RA and MONDO:0012941 (IBD25) for IL10RB, and
      provides no umbrella term for the receptor. This entry curates the receptor
      as one disease because both chains form a single heterotetramer and their
      loss produces the same clinical and functional phenotype, so IBD25 is a
      narrower concept fully covered here rather than a separate disease.
inheritance:
- name: Autosomal recessive inheritance
  description: >-
    Autosomal recessive. The two index families were consanguineous - the first
    Turkish with first-cousin parents, the second of Lebanese descent - and all
    identified variants were homozygous.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:19890111
    reference_title: "Inflammatory bowel disease and mutations affecting the interleukin-10 receptor."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In four of nine patients with early-onset colitis, we identified three
      distinct homozygous mutations in genes IL10RA and IL10RB
    explanation: >-
      Documents homozygous variants in affected children from consanguineous
      families, the expected pattern for recessive inheritance.
genetic:
- name: IL10RA loss-of-function variants
  gene_term:
    preferred_term: IL10RA
    term:
      id: hgnc:5964
      label: IL10RA
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  subtype: IL10RA deficiency
  features: >-
    Biallelic IL10RA variants abolish the IL10R1 alpha chain, which is specific
    to the interleukin-10 receptor. Because IL10R1 is not shared with any other
    cytokine receptor, IL10RA deficiency is a clean loss of interleukin-10
    signalling alone, which makes it the more mechanistically interpretable of
    the two forms.
  evidence:
  - reference: PMID:19890111
    reference_title: "Inflammatory bowel disease and mutations affecting the interleukin-10 receptor."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we identified three distinct homozygous mutations in genes IL10RA and
      IL10RB, encoding the IL10R1 and IL10R2 proteins, respectively, which form a
      heterotetramer to make up the interleukin-10 receptor
    explanation: >-
      The gene-discovery report identifying both receptor chains as disease genes
      and stating that they assemble into one heterotetrameric receptor - the
      basis for curating them as one disease here.
- name: IL10RB loss-of-function variants
  gene_term:
    preferred_term: IL10RB
    term:
      id: hgnc:5965
      label: IL10RB
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  subtype: IL10RB deficiency
  features: >-
    Biallelic IL10RB variants abolish the IL10R2 beta chain. Unlike IL10R1, this
    subunit is shared by the receptors for interleukin-22 and interleukin-26, so
    IL10RB deficiency removes signalling through those cytokines as well. This
    is a real mechanistic difference between the two forms even though they are
    clinically similar, and it should not be curated away.
  evidence:
  - reference: PMID:19890111
    reference_title: "Inflammatory bowel disease and mutations affecting the interleukin-10 receptor."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although IL10R1 is specific to the interleukin-10 receptor, IL10R2 is a
      subunit of the receptors for several additional cytokines (e.g.,
      interleukin-22 and interleukin-26).
    explanation: >-
      Establishes the asymmetry between the two chains that distinguishes the two
      genetic forms: IL10R2 is shared with the interleukin-22 and -26 receptors,
      so its loss is not confined to interleukin-10 signalling.
pathophysiology:
- name: Loss of a Functional Interleukin-10 Receptor
  description: >-
    The initiating lesion. The interleukin-10 receptor is a heterotetramer of two
    IL10R1 chains (IL10RA) and two IL10R2 chains (IL10RB); biallelic loss of
    either chain prevents assembly of a signalling-competent receptor. The two
    genotypes are not quite equivalent, and the entry preserves the difference:
    IL10R1 is specific to this receptor, whereas IL10R2 is shared with the
    interleukin-22 and interleukin-26 receptors, so IL10RB deficiency
    additionally removes those signals.
  role: trigger
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: Interleukin-10 receptor activity
    term:
      id: GO:0004920
      label: interleukin-10 receptor activity
    modifier: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:19890111
    reference_title: "Inflammatory bowel disease and mutations affecting the interleukin-10 receptor."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The receptor for interleukin-10 consists of two alpha molecules (IL10R1)
      and two beta molecules (IL10R2).
    explanation: >-
      Describes the receptor architecture whose disruption defines this node.
  downstream:
  - target: Abolished IL-10-Induced STAT3 Signaling
    causal_link_type: DIRECT
- name: Abolished IL-10-Induced STAT3 Signaling
  description: >-
    The rate-limiting step, and the one directly measured in patients. Assembly
    of the intact receptor normally activates the receptor-associated Janus
    kinases JAK1 and Tyk2, which phosphorylate STAT3 and induce STAT3-dependent
    genes. In patient peripheral-blood mononuclear cells, stimulation with
    interleukin-10 fails to produce STAT3 phosphorylation - a functional assay
    that confirms the variants are not merely present but signalling-dead, and
    that localises the block to the receptor-proximal step rather than to
    interleukin-10 production.
  role: central_effector
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: Peripheral-blood mononuclear cell
    term:
      id: CL:0000842
      label: mononuclear leukocyte
  biological_processes:
  - preferred_term: JAK-STAT signaling downstream of the IL-10 receptor
    term:
      id: GO:0007259
      label: cell surface receptor signaling pathway via JAK-STAT
    modifier: DECREASED
  evidence:
  - reference: PMID:19890111
    reference_title: "Inflammatory bowel disease and mutations affecting the interleukin-10 receptor."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The mutations abrogate interleukin-10-induced signaling, as shown by
      deficient STAT3 (signal transducer and activator of transcription 3)
      phosphorylation on stimulation with interleukin-10.
    explanation: >-
      Functional demonstration that the variants abolish receptor signalling,
      measured as absent STAT3 phosphorylation on IL-10 stimulation. Evidence
      source is IN_VITRO because the assay was performed on patients' isolated
      mononuclear cells.
  downstream:
  - target: Loss of Negative Feedback on Proinflammatory Cytokine Output
    causal_link_type: DIRECT
- name: Loss of Negative Feedback on Proinflammatory Cytokine Output
  description: >-
    The effector step. Interleukin-10 restricts excessive immune responses,
    limiting secretion of proinflammatory cytokines such as tumour necrosis
    factor alpha and interleukin-12 from myeloid and other cells. Without
    receptor signalling this brake is released, and patient mononuclear cells
    show increased secretion of TNF-alpha and other proinflammatory cytokines.
    The lesion is therefore a loss of regulation rather than a gain of a
    pathogenic signal - the immune system is not driven abnormally so much as
    left unrestrained, which is what makes the disease continuous and
    self-sustaining wherever immune stimulation is continuous.
  role: effector
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: Peripheral-blood mononuclear cell
    term:
      id: CL:0000842
      label: mononuclear leukocyte
  biological_processes:
  - preferred_term: Negative regulation of TNF production
    term:
      id: GO:0032720
      label: negative regulation of tumor necrosis factor production
    modifier: LOSS_OF_FUNCTION
  - preferred_term: Tumor necrosis factor production
    term:
      id: GO:0032640
      label: tumor necrosis factor production
    modifier: INCREASED
  evidence:
  - reference: PMID:19890111
    reference_title: "Inflammatory bowel disease and mutations affecting the interleukin-10 receptor."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Consistent with this observation was the increased secretion of tumor
      necrosis factor alpha and other proinflammatory cytokines from
      peripheral-blood mononuclear cells from patients who were deficient in
      IL10R subunit proteins, suggesting that interleukin-10-dependent "negative
      feedback" regulation is disrupted in these cells.
    explanation: >-
      Directly demonstrates the disrupted negative feedback this node models, in
      patient cells. Evidence source is IN_VITRO because cytokine secretion was
      measured in isolated mononuclear cells.
  downstream:
  - target: Hyperinflammatory Enterocolitis
    causal_link_type: DIRECT
- name: Hyperinflammatory Enterocolitis
  description: >-
    The clinical output, and the reason the gut bears the brunt of a systemic
    regulatory defect: the intestine is under continuous microbial stimulation
    and is therefore the tissue most dependent on the interleukin-10 brake. The
    result is severe enterocolitis in the first months of life with multifocal
    ulceration, polymorphic inflammatory infiltrates, intramural abscesses
    extending into submucosa and muscularis, perianal abscesses, and
    enterocutaneous and rectovaginal fistulas often requiring repeated bowel
    resection and stoma formation. The epithelium here is intrinsically normal;
    it is damaged by the unrestrained inflammatory response around it, which is
    what places this disease in the immune-mediated rather than the epithelial
    class of congenital enteropathies.
  role: consequence
  biological_scale: ORGANISM
  locations:
  - preferred_term: Colon
    term:
      id: UBERON:0001155
      label: colon
  evidence:
  - reference: PMID:19890111
    reference_title: "Inflammatory bowel disease and mutations affecting the interleukin-10 receptor."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations in genes encoding the IL10R subunit proteins were found in
      patients with early-onset enterocolitis, involving hyperinflammatory immune
      responses in the intestine.
    explanation: >-
      States the clinical output of the chain and attributes it explicitly to
      hyperinflammatory immune responses in the intestine.

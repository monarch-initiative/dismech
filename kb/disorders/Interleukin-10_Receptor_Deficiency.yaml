diagnosis:
- name: IL-10-induced STAT3 phosphorylation assay
  description: >-
    Functional testing of patient peripheral-blood mononuclear cells for STAT3
    phosphorylation on interleukin-10 stimulation distinguishes IL10R deficiency
    from other causes of very-early-onset inflammatory bowel disease and confirms
    that a candidate variant is signalling-dead.
  evidence:
  - reference: PMID:19890111
    reference_title: "Inflammatory bowel disease and mutations affecting the interleukin-10 receptor."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      as shown by deficient STAT3 (signal transducer and activator of
      transcription 3) phosphorylation on stimulation with interleukin-10
    explanation: >-
      Describes the functional readout used to confirm loss of receptor
      signalling. Evidence source is IN_VITRO because it is a cell-based assay.
- name: IL10RA and IL10RB sequencing
  description: >-
    Sequencing of both receptor chain genes. Because IL10R deficiency is
    treatable by transplantation while conventional therapy fails, establishing
    the molecular diagnosis in an infant with severe colitis changes management
    rather than merely labelling the disease.
  evidence:
  - reference: PMID:19890111
    reference_title: "Inflammatory bowel disease and mutations affecting the interleukin-10 receptor."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We performed genetic-linkage analysis and candidate-gene sequencing on
      samples from two unrelated consanguineous families with children who were
      affected by early-onset inflammatory bowel disease.
    explanation: >-
      Documents the sequencing-based approach by which the diagnosis is
      established.
treatments:
- name: Allogeneic Hematopoietic Stem-Cell Transplantation
  description: >-
    The definitive treatment, and the one that follows from the mechanism:
    replacing the haematopoietic compartment supplies myeloid cells carrying a
    functional interleukin-10 receptor, restoring the negative-feedback brake
    that the patient's own cells cannot exert. It was performed in the index
    patient and induced remission. This is a rare instance in the congenital
    enteropathies where a curative therapy targets the causal mechanism rather
    than replacing lost intestinal function.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: Hematopoietic Cell Transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_mechanisms:
  - target: Loss of Negative Feedback on Proinflammatory Cytokine Output
    treatment_effect: RESTORES
    description: >-
      Donor-derived myeloid cells express a functional interleukin-10 receptor
      and can therefore respond to interleukin-10, restoring the negative
      feedback on proinflammatory cytokine output that the patient's own cells
      have lost.
    evidence:
    - reference: PMID:19890111
      reference_title: "Inflammatory bowel disease and mutations affecting the interleukin-10 receptor."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Allogeneic stem-cell transplantation resulted in disease remission in one
        patient.
      explanation: >-
        Documents the clinical outcome of transplantation. Note this is a single
        patient in the original report, so the evidence base for this treatment
        at the time of the cited study is one case, not a series.
- name: Conventional Anti-Inflammatory and Anti-TNF Therapy
  description: >-
    Curated as a treatment that FAILS, because its failure is mechanistically
    informative rather than incidental. Corticosteroids, methotrexate,
    thalidomide, azathioprine and anti-TNF-alpha monoclonal antibodies were all
    used in the index patients and none induced remission or long-term
    improvement, even alongside total colectomy. Blocking one downstream cytokine
    cannot replace a missing master regulator of the whole inflammatory
    programme, so refractoriness to conventional therapy is a diagnostic clue to
    monogenic very-early-onset inflammatory bowel disease rather than a reason to
    escalate it.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Hyperinflammatory Enterocolitis
    treatment_effect: MODULATES
    description: >-
      Conventional immunosuppression and anti-TNF therapy act downstream of the
      receptor defect and do not restore interleukin-10 signalling; in reported
      patients they failed to induce remission.
    evidence:
    - reference: PMID:19890111
      reference_title: "Inflammatory bowel disease and mutations affecting the interleukin-10 receptor."
      supports: REFUTE
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The patient was treated with a wide spectrum of anti-inflammatory agents,
        including corticosteroids, methotrexate, thalidomide, and anti-TNF-α
        monoclonal antibodies. None of these therapies induced remission or
        long-term improvement.
      explanation: >-
        Refuting evidence for conventional therapy in this disease: a documented
        failure of the full conventional armamentarium in an index patient, which
        is the basis for curating this treatment as ineffective rather than
        omitting it.
notes: >-
  This entry is the immune-mediated counterpart to the epithelial congenital
  enteropathies, and it deliberately conforms to none of the three epithelial
  CODE mechanism modules on this branch. All three model an intrinsic defect of
  the intestinal epithelium; here the epithelium is intrinsically normal and is
  damaged secondarily by unrestrained immune activity. PMID:29654747 draws
  exactly this division, separating CODEs caused by variants directly affecting
  the intestinal epithelium from those affecting the immune system that
  secondarily impair epithelial function, and each of the three modules names
  immune-mediated enteropathy among its exclusions.
  Lump/split decision: MONDO splits this disease by receptor chain -
  MONDO:0013153 (IBD28, IL10RA) and MONDO:0012941 (IBD25, IL10RB) - and provides
  no umbrella term for the receptor. It is curated here as one Disease entry
  named for the receptor, with the two chains as has_subtypes each bound to its
  own MONDO term, and MONDO:0012941 recorded as a skos:narrowMatch so the IBD25
  concept is registered as covered. The justification is that the two chains form
  a single heterotetramer and their loss produces the same clinical and
  functional phenotype. The one real asymmetry - IL10R2 is shared with the
  interleukin-22 and interleukin-26 receptors while IL10R1 is not - is preserved
  in both the genetic blocks and the subtype descriptions rather than being
  smoothed away, and would be the grounds for splitting into two entries if
  IL-22/IL-26-attributable features are ever separated out.
  The failed conventional therapy is curated as a treatment with REFUTE evidence
  rather than omitted, because its failure is a mechanistic prediction of the
  model and a practical diagnostic clue.

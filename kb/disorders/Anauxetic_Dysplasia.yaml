treatments:
- name: Cervical spine stabilization and anaesthetic precautions
  description: >-
    Where cervical spinal instability is present, special care is required during
    general anaesthesia and surgical fusion of unstable cervical vertebrae may be
    needed. This is the highest-stakes management point in anauxetic dysplasia,
    because the risk is realized during otherwise routine procedures.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: orthopedic surgical procedure
    term:
      id: NCIT:C16186
      label: Orthopedic Surgical Procedure

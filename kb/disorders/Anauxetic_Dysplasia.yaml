    label: anauxetic dysplasia
inheritance:
- name: Autosomal recessive inheritance
  description: >-
    Anauxetic dysplasia is autosomal recessive, arising from biallelic variants
    in RMRP or, in the genetically distinct forms, POP1 or NEPRO.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:17701897
    reference_title: "Type and level of RMRP functional impairment predicts phenotype in the cartilage hair hypoplasia-anauxetic dysplasia spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in the RMRP gene lead to a wide spectrum of autosomal recessive skeletal dysplasias, ranging from the milder phenotypes metaphyseal dysplasia without hypotrichosis and cartilage hair hypoplasia (CHH) to the severe anauxetic dysplasia (AD)."
    explanation: >-
      Establishes autosomal recessive inheritance and places anauxetic dysplasia
      at the severe end of the RMRP spectrum.
  - reference: PMID:22420014
    reference_title: "Cartilage-Hair Hypoplasia - Anauxetic Dysplasia Spectrum Disorders (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "If both parents are known to be heterozygous for an RMRP pathogenic variant, each sib of an affected individual has at conception a 25% chance of being affected, a 50% chance of being an asymptomatic carrier, and a 25% chance of being unaffected and not a carrier."
    explanation: >-
      GeneReviews recurrence risks used in counselling families.
  - reference: PMID:22420014
    reference_title: "Cartilage-Hair Hypoplasia - Anauxetic Dysplasia Spectrum Disorders (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "carrier testing for at-risk relatives and molecular genetic prenatal and preimplantation genetic testing for CHH-AD spectrum disorders are possible"
    explanation: >-
      Documents the reproductive testing options available once the familial
      variants are known.

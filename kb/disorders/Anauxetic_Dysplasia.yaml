genetic:
- name: RMRP
  gene_term:
    preferred_term: RMRP
    term:
      id: hgnc:10031
      label: RMRP
  association: Pathogenic Variants
  relationship_type: CAUSATIVE
  notes: >-
    Encodes the non-coding RNA component of RNase MRP. Biallelic variants cause
    the whole CHH-AD spectrum; anauxetic dysplasia arises from combinations
    producing the greatest loss of rRNA cleavage activity, for example a null
    allele in trans with a hypomorphic allele otherwise seen in milder disease.
  evidence:
  - reference: PMID:17701897
    reference_title: "Type and level of RMRP functional impairment predicts phenotype in the cartilage hair hypoplasia-anauxetic dysplasia spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a novel patient with anauxetic dysplasia who was compound heterozygous for the null mutation g.254_263delCTCAGCGCGG and the mutation g.195C-->T, which was previously described in patients with milder phenotypes"
    explanation: >-
      Illustrates how allele combination rather than allele identity places a
      patient at the anauxetic end of the spectrum.
- name: POP1
  gene_term:
    preferred_term: POP1
    term:
      id: hgnc:30129
      label: POP1
  association: Pathogenic Variants
  relationship_type: CAUSATIVE
  notes: >-
    Encodes a protein subunit of the RNase MRP complex. Biallelic variants cause
    anauxetic dysplasia 2, so the disease can be reached by disabling either the
    RNA or the protein half of the same holoenzyme.
  evidence:
  - reference: PMID:31250547
    reference_title: "An emerging ribosomopathy affecting the skeleton due to biallelic variations in NEPRO."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cartilage hair hypoplasia (CHH), anauxetic dysplasia 1, and anauxetic dysplasia 2 are rare metaphyseal dysplasias caused by biallelic pathogenic variants in RMRP and POP1, which encode the components of RNAse-MRP endoribonuclease complex (RMRP) in ribosomal biogenesis pathway."
    explanation: >-
      Establishes POP1 as the cause of anauxetic dysplasia 2 and places both
      genes in the RNase MRP complex.
- name: NEPRO
  gene_term:
    preferred_term: NEPRO
    term:
      id: hgnc:24496
      label: NEPRO
  association: Pathogenic Variants
  relationship_type: CAUSATIVE
  notes: >-
    Nucleolus and neural progenitor protein, which interacts with multiple RNase
    MRP protein subunits. Biallelic variants cause a third, emerging form with
    the same skeletal core plus prominent skin laxity and joint dislocations.
    Reported variants cluster in one protein domain and reduce protein stability.
  evidence:
  - reference: PMID:31250547
    reference_title: "An emerging ribosomopathy affecting the skeleton due to biallelic variations in NEPRO."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nucleolus and neural progenitor protein (NEPRO), encoded by NEPRO (C3orf17), is known to interact with multiple protein subunits of RMRP."
    explanation: >-
      Establishes NEPRO as an interactor of the RNase MRP complex, explaining
      mechanistic convergence.
  - reference: PMID:31250547
    reference_title: "An emerging ribosomopathy affecting the skeleton due to biallelic variations in NEPRO."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "Protein modeling and stability prediction showed that the mutant protein has decreased stability. Both the reported variants are in the same domain of the protein."
    explanation: >-
      In silico evidence for the mechanism and domain clustering of the NEPRO
      variants.
  - reference: PMID:41982866
    reference_title: "Expanding the Phenotypic Spectrum of Anauxetic Dysplasia Type 3: Reporting an Iranian Family With Unique Systemic Features and NEPRO Gene Variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Diagnostic whole-exome sequencing, supported by Sanger validation, confirmed the autosomal recessive inheritance pattern."
    explanation: >-
      Orthogonally validated segregation evidence from three additional ANXD3 cases.

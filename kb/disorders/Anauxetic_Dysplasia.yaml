name: Anauxetic dysplasia
creation_date: "2026-08-01T05:14:29Z"
description: >-
  Anauxetic dysplasia (AD) is the most severe phenotype of the cartilage-hair
  hypoplasia to anauxetic dysplasia (CHH-AD) spectrum, a group of autosomal
  recessive ribosomopathies caused by loss of function in the RNase MRP
  endoribonuclease complex. It is defined by extreme disproportionate short-limb
  short stature recognizable at birth, with atlantoaxial instability, joint
  hypermobility and, at this end of the spectrum, possible cognitive deficiency.
  Its mechanistic interest is a clean two-substrate dissociation: RNase MRP
  cleaves both ribosomal RNA and messenger RNA, and which of those two functions
  a given variant impairs predicts which half of the syndrome the patient gets.
  Attribution rule for this entry: the extraskeletal features (immunodeficiency,
  anaemia, gastrointestinal dysfunction, malignancy risk) are curated as
  SPECTRUM-LEVEL associations. They are documented for CHH-AD as a whole and
  concentrate at the cartilage-hair-hypoplasia end; pure anauxetic dysplasia is
  generally reported without clinically significant involvement of them. They
  are included because the spectrum is one mechanistic continuum and the risks
  are consequential, not because they are assumed characteristics of every
  anauxetic case.
category: Mendelian
parents:
- osteochondrodysplasia
- autosomal recessive disease
synonyms:
- AD
- spondyloepimetaphyseal dysplasia, anauxetic type

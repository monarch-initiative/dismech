- name: Immunodeficiency and Impaired Haematopoiesis
  biological_scale: ORGANISM
  description: >-
    The extraskeletal arm: immunodeficiency that can reach severe combined
    immunodeficiency, anaemia from defective erythrogenesis, and an increased
    risk of malignancy. Severity here tracks the mRNA-cleavage defect rather than
    the skeletal severity, so it must be assessed independently rather than
    inferred from stature.
  evidence:
  - reference: PMID:22420014
    reference_title: "Cartilage-Hair Hypoplasia - Anauxetic Dysplasia Spectrum Disorders (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Other findings include joint hypermobility, fine, silky hair, immunodeficiency, anemia, increased risk for malignancy, gastrointestinal dysfunction, and impaired spermatogenesis."
    explanation: >-
      Enumerates the extraskeletal manifestations of the spectrum, including the
      malignancy risk.

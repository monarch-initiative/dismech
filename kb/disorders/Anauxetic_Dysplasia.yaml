pathophysiology:
- name: RNase MRP Complex Loss of Function
  biological_scale: MOLECULAR
  description: >-
    RMRP encodes the untranslated RNA component of RNase MRP, a
    ribonucleoprotein endoribonuclease. Pathogenic variants either alter
    evolutionarily conserved nucleotides or disrupt the secondary structure by
    mispairing within stem regions, so the lesion is one of RNA folding and
    catalysis rather than of a protein coding sequence. The genetically distinct
    forms hit protein members of the same complex (POP1) or an interacting
    nucleolar partner (NEPRO), which is why they converge on one phenotype.
  genes:
  - preferred_term: RMRP
    term:
      id: hgnc:10031
      label: RMRP
  - preferred_term: POP1
    term:
      id: hgnc:30129
      label: POP1
  evidence:
  - reference: PMID:17701897
    reference_title: "Type and level of RMRP functional impairment predicts phenotype in the cartilage hair hypoplasia-anauxetic dysplasia spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The RMRP gene encodes the untranslated RNA component of the mitochondrial RNA-processing ribonuclease, RNase MRP."
    explanation: >-
      Identifies the gene product as a non-coding RNA component of the RNase MRP
      complex.
  - reference: PMID:17701897
    reference_title: "Type and level of RMRP functional impairment predicts phenotype in the cartilage hair hypoplasia-anauxetic dysplasia spectrum."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "disease-causing mutations either affect evolutionarily conserved nucleotides or are likely to alter secondary structure through mispairing in stem regions"
    explanation: >-
      Defines the two structural mechanisms by which variants in a non-coding RNA
      gene impair function.
  downstream:
  - target: Impaired rRNA Cleavage in Ribosome Assembly
    description: >-
      Loss of RNase MRP activity on its ribosomal RNA substrate compromises
      ribosome biogenesis.
  - target: Impaired mRNA Cleavage and Cell-Cycle Dysregulation
    description: >-
      The same complex cleaves messenger RNA targets governing cell-cycle
      progression.
- name: Impaired rRNA Cleavage in Ribosome Assembly
  biological_scale: MOLECULAR
  description: >-
    The first of the two substrate arms. RNase MRP participates in ribosomal RNA
    processing during ribosome assembly, and the magnitude of the rRNA cleavage
    defect correlates directly with the degree of bone dysplasia. Anauxetic
    dysplasia sits at the severe end because its allele combinations produce the
    greatest loss of this specific activity. The ribosomopathy label is the
    conventional reading of that correlation, but it is contested; see the
    knowledge gap attached to this node.
  biological_processes:
  - preferred_term: rRNA processing
    term:
      id: GO:0006364
      label: rRNA processing
    modifier: DECREASED
  evidence:
  - reference: PMID:17701897
    reference_title: "Type and level of RMRP functional impairment predicts phenotype in the cartilage hair hypoplasia-anauxetic dysplasia spectrum."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In vitro testing of RNase MRP multiprotein-specific mRNA and rRNA cleavage of different mutations revealed a strong correlation between the decrease in rRNA cleavage in ribosomal assembly and the degree of bone dysplasia"
    explanation: >-
      Establishes the quantitative link between loss of rRNA cleavage and
      skeletal severity, the basis for the substrate dissociation.
  - reference: PMID:21396580
    reference_title: "The molecular basis of the cartilage-hair hypoplasia-anauxetic dysplasia spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This complex is involved in the ribosome assembly by cleavage of 5.8S rRNA, cell cycle control by Cyclin B2 mRNA cleavage at the end of mitosis, processing the mitochondrial RNA, and forming a complex with hTERT suggesting a possible involvement in expression regulation by siRNA synthesis."
    explanation: >-
      Names the specific substrates, 5.8S rRNA for the ribosome arm and Cyclin
      B2 mRNA for the cell-cycle arm, rather than leaving them generic.
  - reference: PMID:28067412
    reference_title: "Broadening the phenotypic spectrum of POP1-skeletal dysplasias: identification of POP1 mutations in a mild and severe skeletal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Markedly reduced abundance of RMRP and elevated levels of pre5.8s rRNA was observed."
    explanation: >-
      In-patient confirmation that the rRNA processing step is blocked, which
      the rest of this node rests on in vitro reconstitution for.
  downstream:
  - target: Growth Plate Chondrocyte Proliferation Failure
    description: >-
      Reduced ribosome biogenesis limits the biosynthetic capacity of rapidly
      proliferating growth plate chondrocytes.
- name: Impaired mRNA Cleavage and Cell-Cycle Dysregulation
  biological_scale: MOLECULAR
  description: >-
    The second substrate arm, and the one that dissociates from the skeleton.
    Reduced cleavage of RNase MRP messenger RNA targets impairs cell-cycle
    regulation, and the degree of that impairment predicts hair hypoplasia,
    immunodeficiency and haematological abnormality rather than bone severity.
    The concrete substrate is Cyclin B2 mRNA, cleaved at the end of mitosis.
    This is why a patient can have profound dwarfism with relatively preserved
    immunity, or the reverse.
  biological_processes:
  - preferred_term: regulation of cell cycle
    term:
      id: GO:0051726
      label: regulation of cell cycle
    modifier: DECREASED
  evidence:
  - reference: PMID:17701897
    reference_title: "Type and level of RMRP functional impairment predicts phenotype in the cartilage hair hypoplasia-anauxetic dysplasia spectrum."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "reduced mRNA cleavage, and thus cell-cycle impairment, predicts the presence of hair hypoplasia, immunodeficiency, and hematological abnormalities and thus increased cancer risk"
    explanation: >-
      Establishes that the mRNA-cleavage arm, not the rRNA arm, determines the
      extraskeletal phenotype including cancer risk.
  - reference: PMID:21396580
    reference_title: "The molecular basis of the cartilage-hair hypoplasia-anauxetic dysplasia spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The degree of skeletal dysplasia correlates mainly with the rRNA cleavage activity, whereas significantly diminished mRNA cleavage activity is a prerequisite for immunodeficiency."
    explanation: >-
      Independent statement of the two-substrate dissociation, and stronger than
      correlation for the immune arm: diminished mRNA cleavage is described as a
      prerequisite.
  - reference: PMID:17701897
    reference_title: "Type and level of RMRP functional impairment predicts phenotype in the cartilage hair hypoplasia-anauxetic dysplasia spectrum."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We recently demonstrated that mutations may affect both messenger RNA (mRNA) and ribosomal RNA (rRNA) cleavage and thus cell-cycle regulation and protein synthesis."
    explanation: >-
      States the dual-substrate nature of the enzyme that underlies the
      dissociation.
  downstream:
  - target: Immunodeficiency and Impaired Haematopoiesis
    description: >-
      Cell-cycle impairment in lymphoid and erythroid progenitors produces the
      immune and haematological phenotype.
- name: Growth Plate Chondrocyte Proliferation Failure
  biological_scale: TISSUE
  description: >-
    Chondrocytes in the proliferative zone of the growth plate are among the most
    biosynthetically demanding cells in the developing skeleton, which is why a
    generalized ribosome assembly defect strikes them hardest. Experimentally the
    step most affected is hypertrophic differentiation rather than proliferation
    alone, and RNase MRP is itself expressed in the growth plate with expression
    tracking chondrocyte hypertrophy. The result is
    metaphyseal dysplasia and a failure of endochondral bone elongation that is
    already evident at birth.
  cell_types:
  - preferred_term: chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  biological_processes:
  - preferred_term: cell population proliferation
    term:
      id: GO:0008283
      label: cell population proliferation
    modifier: DECREASED
  evidence:
  - reference: PMID:22420014
    reference_title: "Cartilage-Hair Hypoplasia - Anauxetic Dysplasia Spectrum Disorders (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CHH-AD spectrum disorders are characterized by severe disproportionate (short-limb) short stature that is usually recognized in the newborn, and occasionally prenatally because of the short extremities."
    explanation: >-
      Establishes the short-limb growth failure and its recognition at or before
      birth, consistent with a prenatal growth plate defect.
  - reference: PMID:28743979
    reference_title: "Expression of RMRP RNA is regulated in chondrocyte hypertrophy and determines chondrogenic differentiation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Genetic interference with Rmrp RNA expression in ATDC5 cultures caused a deregulation of chondrogenic differentiation, with a prominent impact on hypertrophy and changes in pre-rRNA processing and rRNA levels."
    explanation: >-
      Direct chondrocyte evidence: knocking down Rmrp deranges chondrogenic
      differentiation and pre-rRNA processing together, which is what this node
      otherwise had to infer from the clinical phenotype.
  - reference: PMID:28743979
    reference_title: "Expression of RMRP RNA is regulated in chondrocyte hypertrophy and determines chondrogenic differentiation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Expression of Rmrp RNA and RNase MRP protein subunits was detected in the murine growth plate and during the course of chondrogenic differentiation of ATDC5 cultures, where Rmrp RNA expression was found to be correlated with chondrocyte hypertrophy."
    explanation: >-
      Localizes RNase MRP expression to the growth plate itself and ties it to
      the hypertrophic step, supporting tissue specificity rather than a purely
      quantitative demand argument.
  downstream:
  - target: Extreme Disproportionate Short-Limb Short Stature
    description: >-
      Failure of endochondral elongation in the limbs produces disproportionate
      dwarfism.
  - target: Atlantoaxial Instability
    description: >-
      The same dysplastic process affects the upper cervical vertebrae and their
      ligamentous stabilization.
- name: Extreme Disproportionate Short-Limb Short Stature
  biological_scale: ORGANISM
  description: >-
    Anauxetic dysplasia carries the most pronounced skeletal phenotype of the
    spectrum. The name itself means without growth, and adult stature is at the
    extreme end of human short stature.
  evidence:
  - reference: PMID:22420014
    reference_title: "Cartilage-Hair Hypoplasia - Anauxetic Dysplasia Spectrum Disorders (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most severe phenotype, AD, has the most pronounced skeletal phenotype"
    explanation: >-
      Positions anauxetic dysplasia as the most skeletally severe phenotype of
      the spectrum.
- name: Atlantoaxial Instability
  biological_scale: ORGANISM
  description: >-
    Atlantoaxial subluxation may be present in the newborn and is largely
    specific to the anauxetic end of the spectrum. It is the feature with the
    most immediate clinical consequence, because it converts routine general
    anaesthesia into a cervical cord risk and may require surgical fusion.
  evidence:
  - reference: PMID:22420014
    reference_title: "Cartilage-Hair Hypoplasia - Anauxetic Dysplasia Spectrum Disorders (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "may be associated with atlantoaxial subluxation in the newborn"
    explanation: >-
      Establishes atlantoaxial subluxation as a neonatal feature specific to the
      anauxetic phenotype.
- name: Immunodeficiency and Impaired Haematopoiesis
  biological_scale: ORGANISM
  description: >-
    The extraskeletal arm: immunodeficiency that can reach severe combined
    immunodeficiency, anaemia from defective erythrogenesis, and an increased
    risk of malignancy. Severity here tracks the mRNA-cleavage defect rather than
    the skeletal severity, so it must be assessed independently rather than
    inferred from stature.
  evidence:
  - reference: PMID:22420014
    reference_title: "Cartilage-Hair Hypoplasia - Anauxetic Dysplasia Spectrum Disorders (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Other findings include joint hypermobility, fine, silky hair, immunodeficiency, anemia, increased risk for malignancy, gastrointestinal dysfunction, and impaired spermatogenesis."
    explanation: >-
      Enumerates the extraskeletal manifestations of the spectrum, including the
      malignancy risk.

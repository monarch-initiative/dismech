  association: Pathogenic Variants
  relationship_type: CAUSATIVE
  notes: >-
    Encodes the non-coding RNA component of RNase MRP. Biallelic variants cause
    the whole CHH-AD spectrum; anauxetic dysplasia arises from combinations
    producing the greatest loss of rRNA cleavage activity, for example a null
    allele in trans with a hypomorphic allele otherwise seen in milder disease.
  evidence:

discussions:
- discussion_id: gap_anauxetic_is_it_really_a_ribosomopathy
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is anauxetic dysplasia genuinely a disorder of ribosome biogenesis, or does
    the rRNA-cleavage correlation track something else that RNase MRP does?
  attaches_to:
  - pathophysiology#Impaired rRNA Cleavage in Ribosome Assembly
  - pathophysiology#RNase MRP Complex Loss of Function
  rationale: >-
    The ribosomopathy framing rests on a correlation between residual rRNA
    cleavage activity and skeletal severity, and it is how this entry and most
    of the literature describe the disorder. But that assumption has been
    questioned directly in the POP1 literature, and RNase MRP has at least four
    known activities beyond 5.8S rRNA processing: Cyclin B2 mRNA cleavage,
    mitochondrial RNA processing, and complex formation with hTERT. A
    correlation with rRNA cleavage does not establish that reduced ribosome
    output is the effector, since the same alleles may degrade a co-varying
    activity. This matters because it determines whether anauxetic dysplasia
    belongs mechanistically alongside the other ribosomopathies or forms its own
    class.
  proposed_experiments:
  - experiment_id: exp_anauxetic_ribosome_output_vs_severity
    name: Direct measurement of ribosome output against skeletal severity across CHH-AD alleles
    description: >-
      Measure ribosome biogenesis output directly, by polysome profiling and
      nascent 5.8S rRNA quantification, in patient chondrocytes or
      chondroprogenitors across an allelic series spanning CHH to anauxetic
      dysplasia, and test whether ribosome output rather than cleavage-assay
      activity predicts skeletal severity. Measure Cyclin B2 turnover and
      mitochondrial RNA processing in the same cells as co-varying candidates.
    decision_criterion: >-
      If ribosome output predicts skeletal severity better than the other
      activities do, the ribosomopathy label is earned; if a co-varying activity
      predicts it as well or better, it is not.
    supporting_outcome:
    - Reduced ribosome output is the effector and the disorder is a true ribosomopathy
    refuting_outcome:
    - A co-varying RNase MRP activity predicts skeletal severity equally well, so the ribosomopathy label is an artefact of assay choice
  evidence:
  - reference: PMID:28067412
    reference_title: "Broadening the phenotypic spectrum of POP1-skeletal dysplasias: identification of POP1 mutations in a mild and severe skeletal dysplasia."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Although CHH and other skeletal dysplasias caused by mutations in RMRP or POP1 are commonly cited as ribosomal biogenesis disorders, recent studies question this assumption."
    explanation: >-
      Direct published challenge to the ribosomopathy framing this entry
      otherwise adopts.
  - reference: PMID:21396580
    reference_title: "The molecular basis of the cartilage-hair hypoplasia-anauxetic dysplasia spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "processing the mitochondrial RNA, and forming a complex with hTERT suggesting a possible involvement in expression regulation by siRNA synthesis"
    explanation: >-
      Documents the additional RNase MRP activities that could co-vary with rRNA
      cleavage and confound the correlation.
- discussion_id: gap_anauxetic_substrate_dissociation
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    How does a single ribonucleoprotein enzyme partition its two substrates so
    that a variant can impair ribosomal RNA cleavage while largely sparing
    messenger RNA cleavage, or the reverse?
  attaches_to:
  - pathophysiology#Impaired rRNA Cleavage in Ribosome Assembly
  - pathophysiology#mRNA Cleavage-Dependent Spectrum Modulation
  rationale: >-
    The in vitro data show a clean double dissociation: rRNA cleavage loss tracks
    bone severity, mRNA cleavage loss tracks hair, immune and haematological
    involvement and cancer risk. That means the two activities are separable by
    single-nucleotide changes in one non-coding RNA, which implies substrate
    selection depends on local structural elements rather than on global enzyme
    activity. Which elements, and whether a therapeutic or prognostic assay could
    read out the two activities independently in a patient sample, is unresolved.
    A clinically useful consequence would be predicting cancer and immune risk
    from a functional assay rather than waiting for the phenotype.
  proposed_experiments:
  - experiment_id: exp_anauxetic_substrate_specificity_map
    name: Structure-function mapping of RNase MRP substrate selection across CHH-AD alleles
    description: >-
      Reconstitute RNase MRP with a panel of patient RMRP alleles spanning the
      CHH-AD spectrum plus POP1 and NEPRO variants, and measure rRNA and mRNA
      cleavage independently against solved secondary structure, to identify
      which structural elements confer substrate selection and whether the two
      activities can be predicted from sequence.
    decision_criterion: >-
      Identification of distinct structural determinants for the two substrates
      that predict the clinical dissociation would establish a prognostic assay.
    supporting_outcome:
    - Separable structural elements govern the two activities, so allele-level functional testing can predict immune and cancer risk
    refuting_outcome:
    - Both activities degrade together and the clinical dissociation reflects tissue-specific thresholds instead
- discussion_id: gap_anauxetic_chondrocyte_selectivity
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why does a defect in a ubiquitously required ribosome assembly step strike
    the growth plate so much harder than other proliferating tissues?
  attaches_to:
  - pathophysiology#Growth Plate Chondrocyte Differentiation Failure
  - pathophysiology#Extreme Disproportionate Short-Limb Short Stature
  rationale: >-
    This is the general paradox of the ribosomopathies, and anauxetic dysplasia
    is an unusually clean instance of it because the same enzyme lesion produces
    a graded skeletal phenotype across the spectrum. Whether growth plate
    chondrocytes are simply the most ribosome-hungry cells in the developing
    body, or whether there is a chondrocyte-specific client transcript whose
    translation fails first, is not established, and the answer determines
    whether any tissue-directed intervention is conceivable. The question is
    posed explicitly in the chondrocyte literature, and the observation that
    RNase MRP expression is itself regulated across chondrogenic differentiation
    raises a third possibility: that the growth plate is not merely the most
    demanding tissue but one that actively modulates this complex.
  evidence:
  - reference: PMID:28743979
    reference_title: "Expression of RMRP RNA is regulated in chondrocyte hypertrophy and determines chondrogenic differentiation."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "However, it is not clear why mutations in RMRP RNA lead to skeletal dysplasia."
    explanation: >-
      The chondrocyte literature states the question of this gap directly as
      unresolved.
  proposed_experiments:
  - experiment_id: exp_anauxetic_chondrocyte_translatome
    name: Comparative translatome profiling across tissues in an RMRP hypomorphic model
    description: >-
      Profile ribosome occupancy and nascent translation in growth plate
      chondrocytes alongside lymphoid progenitors, erythroid progenitors and hair
      follicle keratinocytes in a graded RMRP hypomorphic background, to test
      whether chondrocytes show disproportionate loss of translational output or
      selective loss of specific transcripts.
    decision_criterion: >-
      Disproportionate global translational collapse in chondrocytes supports a
      demand model; selective transcript loss supports a client-specific model.
    supporting_outcome:
    - Growth plate chondrocytes have the highest ribosome demand and fail first on a purely quantitative basis
    refuting_outcome:
    - Specific chondrocyte transcripts are selectively lost, implicating a targeted client rather than global demand
- discussion_id: gap_anauxetic_natural_history_and_therapy
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What are the subtype-specific natural history, complication rates, and
    treatment outcomes of anauxetic dysplasia?
  rationale: >-
    Published evidence consists mainly of single cases, small families, and
    mechanism studies across the broader CHH-AD spectrum. There are no reliable
    ANXD-specific prevalence, penetrance, survival, quality-of-life, or
    treatment-response estimates, and no disease-specific interventional trial
    was identified. The 2026 ANXD3 report adds three cases and new systemic
    findings but remains too small to establish frequency or causality for each
    manifestation. A longitudinal, genotype-stratified registry is needed to
    distinguish reproducible subtype features from family-specific observations
    and to evaluate orthopedic and surveillance outcomes.
  attaches_to:
  - phenotypes#Severe short stature
  - phenotypes#Atlantoaxial dislocation
  - phenotypes#Thoracolumbar kyphoscoliosis
  evidence:
  - reference: PMID:41982866
    reference_title: "Expanding the Phenotypic Spectrum of Anauxetic Dysplasia Type 3: Reporting an Iranian Family With Unique Systemic Features and NEPRO Gene Variant."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "This study reports three new ANXD3 cases from a consanguineous Iranian family"
    explanation: >-
      The latest family series illustrates both ongoing phenotype discovery and
      the very small evidence base that prevents frequency estimation.
  proposed_experiments:
  - experiment_id: exp_anauxetic_longitudinal_registry
    name: Genotype-stratified international ANXD natural-history registry
    description: >-
      Enroll molecularly confirmed RMRP-, POP1-, and NEPRO-related cases with
      harmonized skeletal imaging, cervical stability, mobility, pain,
      development, hearing, ophthalmology, renal, dental, surgical, and
      patient-reported outcomes assessed longitudinally.
    decision_criterion: >-
      Replication of each manifestation in unrelated families and stable
      subtype-specific incidence estimates would distinguish core findings from
      family-specific observations and provide endpoints for future trials.
    supporting_outcome:
    - The recently reported systemic ANXD3 findings are reproducible subtype features
    - Defined imaging and functional measures can serve as natural-history and trial endpoints
    refuting_outcome:
    - The systemic findings remain confined to single families and are not reproducible ANXD3 associations

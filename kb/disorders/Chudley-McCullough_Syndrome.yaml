  category: Ear
  frequency: VERY_FREQUENT
  description: >-
    Severe to profound sensorineural hearing loss, congenital or early onset.
    In one cochlear-implant series it was progressive and often accompanied by
    auditory neuropathy spectrum disorder, and hearing aids gave limited
    benefit.
  phenotype_term:
    preferred_term: Severe to profound sensorineural hearing loss
    term:
      id: HP:0000407
      label: Sensorineural hearing impairment
    clinical_course: PROGRESSIVE
  sequelae:
  - target: Delayed speech and language development
    description: >-
      Speech and language delay follows from the hearing loss; once hearing is
      managed early, most patients develop with little or no impairment.
    evidence:
    - reference: PMID:33016209
      reference_title: "Chudley-McCullough Syndrome: A Recognizable Clinical Entity Characterized by Deafness and Typical Brain Malformations."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "When hearing loss is managed early, most patients have minor or no impairment of motor and cognitive development, despite the presence of brain malformations."
      explanation: Ties the developmental outcome to management of the hearing loss rather than to the brain malformations; the hearing-to-speech link is an inference from this.
  evidence:
  - reference: PMID:22578326

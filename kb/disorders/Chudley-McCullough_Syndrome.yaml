name: Chudley-McCullough Syndrome
creation_date: "2026-11-02T12:00:00Z"
category: Mendelian
synonyms:
- CMCS
- CMS
- deafness, autosomal recessive 82
- DFNB82
- deafness, bilateral sensorineural, and hydrocephalus due to foramen of Monro obstruction
- deafness, sensorineural, with partial agenesis of the corpus callosum and arachnoid cysts
description: >-
  Chudley-McCullough syndrome is an autosomal recessive disorder caused by
  biallelic loss-of-function variants in GPSM2 (also called LGN). It combines
  severe to profound sensorineural hearing loss with a characteristic set of
  brain malformations: partial agenesis of the corpus callosum, frontal
  polymicrogyria and subcortical gray matter heterotopia, which are close to
  universal, together with cerebellar dysplasia, ventriculomegaly and arachnoid
  cysts in most patients. Some patients have hydrocephalus, often from
  obstruction at the foramen of Monro. Despite the brain malformations, most
  patients develop normally apart from the hearing loss, although seizures and
  developmental delay occur in a minority. Families first reported with
  nonsyndromic recessive deafness (DFNB82) were later found to have the same
  brain malformations on imaging, so DFNB82 and Chudley-McCullough syndrome are
  one disorder. GPSM2 binds inhibitory G-protein alpha subunits (GNAI). In
  cochlear and vestibular hair cells the GPSM2-GNAI complex sits at the tips of
  the tallest stereocilia and is needed for their elongation; in dividing
  progenitors it orients the mitotic spindle, which is the proposed basis of
  the brain malformations.
disease_term:
  preferred_term: Chudley-McCullough syndrome
  term:
    id: MONDO:0011411
    label: Chudley-McCullough syndrome
parents:
- Syndromic sensorineural hearing loss
- Malformation of cortical development
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Autosomal recessive inheritance of homozygous or compound heterozygous
    GPSM2 loss-of-function variants. A Dutch founder frameshift is shared by
    Mennonite families in the Netherlands and North America.
  evidence:
  - reference: PMID:22578326
    reference_title: "GPSM2 mutations cause the brain malformations and hearing loss in Chudley-McCullough syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Autosomal-recessive inheritance, severe to profound sensorineural hearing loss, and partial agenesis of the corpus callosum are hallmarks of the clinically well-established Chudley-McCullough syndrome (CMS)."
    explanation: States autosomal recessive inheritance as a hallmark of the syndrome.
  - reference: PMID:22987632
    reference_title: "GPSM2 mutations in Chudley-McCullough syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Results show compound heterozygous mutations, p.Arg498* and p.Gly249Glufs*32, in the affected members of the family which co-segregate in the family as an autosomal recessive trait"
    explanation: Compound heterozygous GPSM2 variants co-segregate with the disorder as a recessive trait.
  - reference: PMID:23494849
    reference_title: "GPSM2 and Chudley-McCullough syndrome: a Dutch founder variant brought to North America."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified one homozygous frameshift GPSM2 variants c.1473delG in all patients. We show that this variant arises from a shared, rare haplotype."
    explanation: Documents a homozygous founder variant on a shared haplotype.
pathophysiology:
- name: GPSM2 Loss of Function
  description: >-
    Biallelic truncating variants (nonsense, frameshift and canonical splice
    site) remove GPSM2 function. Most truncate the protein before or within the
    C-terminal GoLoco motifs that bind GNAI, so the GPSM2-GNAI complex cannot
    form.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: GPSM2
    term:
      id: hgnc:29501
      label: GPSM2
  molecular_functions:
  - preferred_term: G-protein alpha-subunit binding
    modifier: DECREASED
    term:
      id: GO:0001965
      label: G-protein alpha-subunit binding
  evidence:
  - reference: PMID:22578326
    reference_title: "GPSM2 mutations cause the brain malformations and hearing loss in Chudley-McCullough syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "revealed four molecular variations (two single-base deletions, a nonsense mutation, and a canonical splice-site mutation) in the G protein-signaling modulator 2 gene, GPSM2, that underlie CMS"
    explanation: Identifies truncating GPSM2 variants as the cause in eight families.
  - reference: PMID:27180139
    reference_title: "A novel nonsense GPSM2 mutation in a Yemeni family underlying Chudley-McCullough syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This mutation is predicted to abolish all four GoLoco domains in GPSM2 and this explains the bioinformatic prediction for this mutation to be functionally damaging."
    explanation: A truncating variant is predicted to remove all GoLoco motifs, the GNAI-binding domains.
  downstream:
  - target: Loss of the GPSM2-GNAI Stereocilia Tip Complex
    evidence:
    - reference: PMID:28387217
      reference_title: "Defective Gpsm2/Gα(i3) signalling disrupts stereocilia development and growth cone actin dynamics in Chudley-McCullough syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We show that Gpsm2 defines an ∼200 nm nanodomain at the tips of stereocilia and this localization requires the presence of Gαi3, myosin 15 and whirlin."
      explanation: Shows GPSM2 normally forms a tip nanodomain with GNAI3, which is lost without GPSM2.
  - target: Defective Mitotic Spindle Orientation in Neural Progenitors
    evidence:
    - reference: PMID:22578326
      reference_title: "GPSM2 mutations cause the brain malformations and hearing loss in Chudley-McCullough syndrome."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "The gene product, GPSM2, is required for orienting the mitotic spindle during cell division in multiple tissues, suggesting that the sensorineural hearing loss and characteristic brain malformations of CMS are due to defects in asymmetric cell divisions during development."
      explanation: The authors infer a spindle-orientation defect from GPSM2's known function; it was not measured in patient tissue.
  - target: Impaired Neuronal Growth Cone Actin Dynamics
    evidence:
    - reference: PMID:28387217
      reference_title: "Defective Gpsm2/Gα(i3) signalling disrupts stereocilia development and growth cone actin dynamics in Chudley-McCullough syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Using single-molecule tracking, we report that loss of Gpsm2 leads to decreased outgrowth and a disruption of actin dynamics in neuronal growth cones."
      explanation: Loss of Gpsm2 reduces neuronal growth cone outgrowth in mouse neurons.
- name: Loss of the GPSM2-GNAI Stereocilia Tip Complex
  description: >-
    In wild-type hair cells, GPSM2 and GNAI are recruited to the tips of the
    first, tallest row of stereocilia, where they join a MYO15A-whirlin-EPS8 tip
    complex and give that row its identity. Without GPSM2, the complex does not
    form and the bundle keeps an immature organization.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: GPSM2
    term:
      id: hgnc:29501
      label: GPSM2
  - preferred_term: GNAI3
    term:
      id: hgnc:4387
      label: GNAI3
  evidence:
  - reference: PMID:30827920
    reference_title: "GPSM2-GNAI Specifies the Tallest Stereocilia and Defines Hair Bundle Row Identity."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We discovered that WHRN-GPSM2-GNAI is an extra module recruited by and added to a pre-existing MYO15A-EPS8 stereocilia tip complex. This extended complex is only present in the first, tallest row"
    explanation: Defines the GPSM2-GNAI tip module at the tallest stereocilia row.
  - reference: PMID:35687681
    reference_title: "Promotion of row 1-specific tip complex condensates by Gpsm2-Gαi provides insights into row identity of the tallest stereocilia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "A deafness-associated mutation of Gpsm2 leads to impaired formation of the 5xTCD condensates and consequently reduced actin bundling, providing possible clues for etiology of hearing loss in patients with Chudley-McCullough syndrome."
    explanation: A disease-associated Gpsm2 mutation impairs formation of the tip-complex condensates and their actin bundling in vitro.
  downstream:
  - target: Defective Stereocilia Elongation and Hair Bundle Morphogenesis
    evidence:
    - reference: PMID:30827920
      reference_title: "GPSM2-GNAI Specifies the Tallest Stereocilia and Defines Hair Bundle Row Identity."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In the absence of GPSM2 or GNAI function, including in the epistatic Myo15a and Whrn mutants, bundles retain an embryonic-like organization that coincides with generic stereocilia at the molecular level."
      explanation: Without GPSM2-GNAI the hair bundle fails to mature.
- name: Defective Stereocilia Elongation and Hair Bundle Morphogenesis
  description: >-
    Stereocilia of auditory and vestibular hair cells fail to elongate, and the
    hair bundle loses its graded staircase architecture and can be misoriented,
    so mechanotransduction is impaired.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: auditory hair cell
    term:
      id: CL:0000202
      label: auditory hair cell
  - preferred_term: vestibular hair cell
    term:
      id: CL:0000609
      label: vestibular hair cell
  biological_processes:
  - preferred_term: auditory receptor cell stereocilium organization
    modifier: ABNORMAL
    term:
      id: GO:0060088
      label: auditory receptor cell stereocilium organization
  evidence:
  - reference: PMID:28387217
    reference_title: "Defective Gpsm2/Gα(i3) signalling disrupts stereocilia development and growth cone actin dynamics in Chudley-McCullough syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here, we show that mutation of the mouse orthologue of GPSM2 affects actin-rich stereocilia elongation in auditory and vestibular hair cells, causing deafness and balance defects."
    explanation: Gpsm2 mutant mice have defective stereocilia elongation in auditory and vestibular hair cells.
  - reference: PMID:26662512
    reference_title: "The GPSM2/LGN GoLoco motifs are essential for hearing."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Lgn (ΔC) mice, with a targeted deletion truncating the C-terminal GoLoco motifs, are profoundly deaf and show misorientation of the hair bundle and severe malformations in stereocilia shape that deteriorates over time."
    explanation: Truncating the GoLoco motifs causes hair bundle misorientation and stereocilia malformation.
  downstream:
  - target: Sensorineural hearing impairment
    evidence:
    - reference: PMID:26662512
      reference_title: "The GPSM2/LGN GoLoco motifs are essential for hearing."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Here, we link human and mouse truncating mutations in the GPSM2/LGN gene, both leading to hearing loss."
      explanation: Human and mouse truncating GPSM2 variants both cause hearing loss.
- name: Defective Mitotic Spindle Orientation in Neural Progenitors
  description: >-
    GPSM2 orients the mitotic spindle of dividing neural progenitors. Loss of
    spindle-orientation control changes the plane of progenitor division,
    which shifts the balance between progenitor types and alters cortical
    growth. This is the proposed basis of the cortical and callosal
    malformations; it has not been shown directly in patient brain.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: neural progenitor cell
    term:
      id: CL:0011020
      label: neural progenitor cell
  biological_processes:
  - preferred_term: establishment of mitotic spindle orientation
    modifier: ABNORMAL
    term:
      id: GO:0000132
      label: establishment of mitotic spindle orientation
  evidence:
  - reference: PMID:41637507
    reference_title: "Oriented cell divisions induce basal progenitors and regulate neural expansion across tissues and species."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "We show here that double inactivation of spindle orientation regulators GPSM2 and SAPCD2 in mice completely reorients progenitor divisions in both the neocortex and retina."
    explanation: Removing GPSM2 together with SAPCD2 reorients neocortical progenitor divisions in mice; the effect of GPSM2 loss alone is not shown here.
  downstream:
  - target: Malformation of Cortical and Callosal Development
    evidence:
    - reference: PMID:41637507
      reference_title: "Oriented cell divisions induce basal progenitors and regulate neural expansion across tissues and species."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "These findings show that division orientation is critical for regulating neural progenitor output and scaling tissue growth."
      explanation: Shows spindle orientation controls progenitor output and cortical growth in mice; the link to the specific human malformations is an inference.
- name: Impaired Neuronal Growth Cone Actin Dynamics
  description: >-
    In mouse neurons lacking Gpsm2, growth cone outgrowth is reduced and actin
    dynamics are disrupted. Its contribution to the human malformations,
    including the callosal defect, has not been established.
  biological_scale: CELLULAR
  evidence:
  - reference: PMID:28387217
    reference_title: "Defective Gpsm2/Gα(i3) signalling disrupts stereocilia development and growth cone actin dynamics in Chudley-McCullough syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Our results elucidate the aetiology of CMCS and highlight a new molecular role for Gpsm2/Gαi3 in the regulation of actin dynamics in epithelial and neuronal tissues."
    explanation: Proposes Gpsm2-Gαi3 regulation of actin dynamics in neuronal tissue as part of the disease mechanism.
- name: Malformation of Cortical and Callosal Development
  description: >-
    The brain malformations of the syndrome: frontal polymicrogyria,
    subcortical heterotopia, partial agenesis of the corpus callosum and
    cerebellar dysplasia.
  biological_scale: TISSUE
  evidence:
  - reference: PMID:22578326
    reference_title: "GPSM2 mutations cause the brain malformations and hearing loss in Chudley-McCullough syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although not always reported in the literature, frontal polymicrogyria and gray matter heterotopia are uniformly present, whereas cerebellar dysplasia, ventriculomegaly, and arachnoid cysts are nearly invariant."
    explanation: Defines the malformation pattern on imaging.
  downstream:
  - target: Frontal polymicrogyria
  - target: Subcortical heterotopia
  - target: Partial agenesis of the corpus callosum
  - target: Cerebellar dysplasia
  - target: Ventriculomegaly
  - target: Arachnoid cyst
phenotypes:

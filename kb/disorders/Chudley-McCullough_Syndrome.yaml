    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three out of six patients were diagnosed with auditory neuropathy spectrum disorder (ANSD), one patient was suspected of ANSD"
    explanation: ANSD was diagnosed or suspected in four of six patients in this series.

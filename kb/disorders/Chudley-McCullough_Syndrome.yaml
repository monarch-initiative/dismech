- name: Auditory neuropathy spectrum disorder
  category: Ear
  frequency: FREQUENT
  description: >-
    Auditory neuropathy spectrum disorder was diagnosed in three of six
    patients in a cochlear-implant series and suspected in a fourth. A neural
    or synaptic component of this kind is not explained by the hair-bundle
    defect alone, so it is left unconnected in the pathograph.
  phenotype_term:
    preferred_term: Auditory neuropathy spectrum disorder
  notes: >-
    No HPO term found: OLS searches of HP for "auditory neuropathy",
    "auditory neuropathy spectrum disorder", "auditory neuropathy spectrum"
    and "neural hearing impairment" (2026-11-03) returned no auditory
    neuropathy term, so the phenotype is left unbound.
  evidence:

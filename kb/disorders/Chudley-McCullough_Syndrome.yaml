animal_models:
- name: Gpsm2 mutant mice
  species: Mouse
  genotype: Gpsm2 loss-of-function (including the Lgn deltaC GoLoco truncation)
  publication: PMID:28387217
  description: >-
    Gpsm2 mutant mice are deaf and have balance defects, with failed
    stereocilia elongation in auditory and vestibular hair cells.
  modeled_mechanisms:
  - target: Defective Stereocilia Elongation and Hair Bundle Morphogenesis
    relationship: RECAPITULATES
    fidelity: HIGH
    description: Mutant mice reproduce the deafness and the underlying hair bundle defect.
    evidence:
    - reference: PMID:28387217
      reference_title: "Defective Gpsm2/Gα(i3) signalling disrupts stereocilia development and growth cone actin dynamics in Chudley-McCullough syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Here, we show that mutation of the mouse orthologue of GPSM2 affects actin-rich stereocilia elongation in auditory and vestibular hair cells, causing deafness and balance defects."
      explanation: The mouse model reproduces the hearing loss and its hair cell basis.
notes: >-
  Hydrocephalus and seizures have no incoming edge because no cited source
  gives a mechanism for them; hydrocephalus is often attributed to
  obstruction at the foramen of Monro, but how that obstruction arises is not
  described.

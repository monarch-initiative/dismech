  evidence:
  - reference: PMID:20602914
    reference_title: "Whole exome sequencing and homozygosity mapping identify mutation in the cell polarity protein GPSM2 as the cause of nonsyndromic hearing loss DFNB82."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The nonsense mutation leads to an early truncation of the G protein signaling modulator GPSM2, a protein that is essential for maintenance of cell polarity and spindle orientation."
    explanation: First report of a truncating GPSM2 variant, in a family then described as nonsyndromic deafness DFNB82.
  - reference: PMID:22578326
    reference_title: "GPSM2 mutations cause the brain malformations and hearing loss in Chudley-McCullough syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Subsequent brain imaging of these individuals revealed frontal polymicrogyria, abnormal corpus callosum, and gray matter heterotopia, consistent with a CMS diagnosis, but no ventriculomegaly."
    explanation: Individuals first reported with nonsyndromic GPSM2 deafness had the syndrome's brain malformations on imaging.
diagnosis:
- name: GPSM2 molecular testing
  diagnosis_term:
    preferred_term: GPSM2 genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    Sequencing of GPSM2 in a patient with sensorineural hearing loss and the
    characteristic brain malformations.
  results: Biallelic loss-of-function GPSM2 variants.
  evidence:
  - reference: PMID:27064331
    reference_title: "Chudley-McCullough Syndrome: Variable Clinical Picture in Twins with a Novel GPSM2 Mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The combination of sensorineural hearing loss and partial agenesis of the corpus callosum is a highly recognizable clinico-radiological entity that should prompt mutational analysis of the GPSM2 gene."
    explanation: Recommends GPSM2 testing when hearing loss and partial callosal agenesis occur together.
- name: Brain MRI
  diagnosis_term:
    preferred_term: Brain magnetic resonance imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  description: >-
    Brain imaging shows the characteristic malformations, including in
    patients who present with apparently nonsyndromic hearing loss.
  evidence:
  - reference: PMID:22578326
    reference_title: "GPSM2 mutations cause the brain malformations and hearing loss in Chudley-McCullough syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Subsequent brain imaging of these individuals revealed frontal polymicrogyria, abnormal corpus callosum, and gray matter heterotopia, consistent with a CMS diagnosis, but no ventriculomegaly."
    explanation: Imaging revealed the syndrome in patients first diagnosed with nonsyndromic hearing loss.
  - reference: PMID:27312216
    reference_title: "Prenatal diagnosis of Chudley-McCullough syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report prenatal imaging features that help distinguish CMS from other disorders, including slit-like frontal horns, agenesis of the corpus callosum, frontal subcortical heterotopia, arachnoid cysts, and cerebellar dysplasia."
    explanation: Fetal MRI features allow prenatal recognition of the syndrome.

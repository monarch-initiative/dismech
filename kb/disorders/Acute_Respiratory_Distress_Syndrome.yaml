- name: Increased Glycolytic Programming
  biological_scale: CELLULAR
  description: Inflammatory activation can shift cellular metabolism toward glycolysis. Its magnitude and persistence vary by cell type and compartment; a uniform glycolysis-dominant state is not established in every patient with ARDS.
  role: modifier
  evidence:
  - reference: PMID:42432720
    reference_title: 'Immunometabolic reprogramming and mitochondrial dysfunction in acute respiratory distress syndrome: mechanisms, metabolic resilience, and therapeutic perspectives- a narrative review.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: When macrophages encounter inflammatory stimuli, they shift from mitochondrial oxidative phosphorylation to aerobic glycolysis, a phenomenon called as the “Warburg effect.” This metabolic transition enables rapid ATP generation and provides biosynthetic intermediates required for cytokine production and effector functions.
    explanation: A narrative review summarizes experimental immunometabolic mechanisms; this does not measure glycolytic flux in a representative ARDS cohort.

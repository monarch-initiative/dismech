- name: Diffuse Alveolar Damage with Hyaline Membrane Formation
  description: >-
    ARDS histology can show intraalveolar edema, inflammation, hyaline membrane
    formation, and alveolar hemorrhage in a diffuse-alveolar-damage pattern.
    These findings are variable and are neither universal nor required for the
    clinical diagnosis.
  evidence:
  - reference: PMID:37487152
    reference_title: A New Global Definition of Acute Respiratory Distress Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Histological findings vary and often include intraalveolar edema,
      inflammation, hyaline membrane formation, and alveolar hemorrhage, often
      termed diffuse alveolar damage; however, these histological features are
      not always present and are not necessary for a clinical diagnosis of ARDS
      (26).
    explanation: >-
      The consensus document supports the characteristic diffuse-alveolar-damage
      pattern and directly supplies the non-universality and diagnostic caveat.

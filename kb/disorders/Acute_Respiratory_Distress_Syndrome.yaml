- name: clinicaltrials:NCT00527813
  description: PROSEVA randomized 466 adults with severe ARDS to prolonged prone sessions or supine care with protective ventilation. The trial reported lower 28-day and 90-day mortality in the prone group; its protocol and eligibility are distinct from pediatric guidance.
  evidence:
  - reference: PMID:23688302
    reference_title: Prone positioning in severe acute respiratory distress syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: In this multicenter, prospective, randomized, controlled trial, we randomly assigned 466 patients with severe ARDS to undergo prone-positioning sessions of at least 16 hours or to be left in the supine position.
    explanation: The primary trial specifies the adult intervention, comparator and study population.
  - reference: PMID:23688302
    reference_title: Prone positioning in severe acute respiratory distress syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: The 28-day mortality was 16.0% in the prone group and 32.8% in the supine group (P<0.001).
    explanation: The primary publication reports the trial outcome, rather than relying on the registry protocol for efficacy.

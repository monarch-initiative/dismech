- name: Smoke inhalation
  description: Smoke inhalation exposes the respiratory tract to toxic gases and particles that can injure distal lung and impair surfactant. Thermal injury primarily affects the upper airway; it is not treated as the alveolar mechanism. ARDS may coexist with cutaneous burns and other fire-related injuries.
  exposure_term:
    preferred_term: inhalation of combustion smoke
    term:
      id: ECTO:7000059
      label: exposure to smoke
  exposure_classifications:
    hazard_agent_type:
    - classification_value: CHEMICAL
      notes: Recorded as CHEMICAL for the toxic gases and fine particulates that dominate the alveolar injury, though fire smoke also delivers a PHYSICAL thermal component to the upper airway.
    exposure_route:
    - classification_value: INHALATION
    exposure_duration:
    - classification_value: ACUTE
  influences_mechanisms:
  - target: Direct Pulmonary or Indirect Systemic Insult
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: Smoke inhalation acts as a direct pulmonary insult at the trigger node.
    evidence:

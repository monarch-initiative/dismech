experimental_models:
- name: Human airway-on-a-chip chlorine gas exposure model
  description: >-
    A microfluidic human airway chip with pseudostratified mucociliary
    epithelium, a biomimetic extracellular matrix hydrogel, an endothelial
    compartment, and integrated electrodes for transepithelial electrical
    resistance, coupled to a chlorine generation and delivery platform that
    controls concentration and exposure duration precisely. Transcriptomics and
    metabolomics were run across post-exposure timepoints. It addresses a gap
    that is unusually hard to fill any other way: human clinical data on acute
    chlorine exposure are scarce for obvious reasons, and animal models translate
    poorly.
  experimental_model_type: ORGAN_ON_CHIP
  namo_type: namo:OrganOnChip
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  tissue_term:
    preferred_term: epithelium of bronchus
    term:
      id: UBERON:0002031
      label: epithelium of bronchus
  cell_types:
  - preferred_term: Bronchial epithelial cell
    term:
      id: CL:0002328
      label: bronchial epithelial cell
  - preferred_term: Pulmonary capillary endothelial cell
    term:
      id: CL:4028001
      label: pulmonary capillary endothelial cell
  conditions:
  - chlorine gas 10, 20, and 30 ppm for 10 to 30 minutes
  - medical air exposure control
  culture_system: Microfluidic airway-on-a-chip at air-liquid interface with integrated TEER electrodes
    and controlled gas exposure
  publication: PMID:41442163
  modeled_mechanisms:
  - target: Direct Pulmonary or Indirect Systemic Insult
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Delivers a graded, precisely metered inhalational chemical insult to human
      airway tissue, with a dose-response spanning recoverable injury at 10 ppm
      through irreversible barrier loss at 30 ppm.
    limitations: >-
      Chlorine is one specific inhalational insult and the chip is bronchial
      rather than alveolar, so it models the direct pulmonary insult category
      only for inhaled oxidant gases and not for aspiration, pneumonia, or the
      indirect systemic insults that cause most ARDS.
    readouts:
    - name: Transepithelial electrical resistance across chlorine dose and duration
      target: Direct Pulmonary or Indirect Systemic Insult
      direction: DECREASED
      interpretation: >-
        A recoverable-to-irreversible dose-response identifies the threshold at
        which an inhalational insult becomes an established barrier lesion.
      evidence:
      - reference: PMID:41442163
        reference_title: A human airway-on-a-chip microphysiological system for modeling chlorine gas toxicity.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: Transepithelial electrical resistance (TEER) measurements of barrier function also showed
          recoverable function at 10 ppm Cl2, progressing to a critical loss of barrier function at higher
          concentrations or exposure durations.
        explanation: Reports the graded barrier response to the insult this node describes.
    evidence:
    - reference: PMID:41442163
      reference_title: A human airway-on-a-chip microphysiological system for modeling chlorine gas toxicity.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Epithelial barrier disruption, characterized by gap formation, was evident immediately post-Cl2
        exposure and persisted through 24 h
      explanation: Supports the chip as a model of a direct pulmonary chemical insult producing sustained
        injury.
  - target: Alveolar-Capillary Barrier Disruption
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Epithelial junctional gaps appeared immediately after exposure, and
      endothelial junctional disruption followed only at 72 hours despite the
      endothelium never being directly exposed. The delay is the point: it
      establishes that barrier injury propagates from the epithelial to the
      endothelial layer rather than both being independently damaged.
    limitations: >-
      The chip has no neutrophils or macrophages, so the inflammatory
      amplification and resolution phases that dominate barrier disruption in
      clinical ARDS are represented only indirectly through early
      epithelial-endothelial signalling. It is also airway rather than alveolar
      epithelium.
    readouts:
    - name: Endothelial VE-cadherin junction integrity at 72 hours post-exposure
      target: Alveolar-Capillary Barrier Disruption
      direction: DECREASED
      interpretation: >-
        Delayed endothelial junctional loss after an exclusively epithelial
        exposure is evidence of trans-barrier propagation.
      evidence:
      - reference: PMID:41442163
        reference_title: A human airway-on-a-chip microphysiological system for modeling chlorine gas toxicity.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: In contrast, endothelial junction disruption emerged at 72 h, supporting secondary endothelial
          dysfunction following epithelial oxidative injury.
        explanation: Directly reports the delayed, secondary endothelial injury this readout measures.
    evidence:
    - reference: PMID:41442163
      reference_title: A human airway-on-a-chip microphysiological system for modeling chlorine gas toxicity.
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: A primary constraint is the absence of innate immune system components, limiting evaluation
        of inflammatory responses to early epithelial/endothelial signaling that would typically recruit
        neutrophils and macrophages.
      explanation: The authors' own statement of the model's key limitation for a node whose clinical
        form is inflammation-driven; PARTIAL records informative but bounded relevance.
- name: Organoid-derived Pseudomonas pneumonia-on-a-chip (VAP) model
  description: >-
    An alveolus chip lined with organoid-derived alveolar epithelial cells that
    differentiate into both type 2 and type 1-like cells, plus primary pulmonary
    microvascular endothelium, cycled at a respiratory-like 0.25 Hz at either
    physiological (5%) or hyperphysiological (10%) strain and infected with
    Pseudomonas aeruginosa. Comparing the two strain levels under an otherwise
    identical infection isolates the contribution of ventilation-associated
    stretch, which is the central question in ventilator-associated pneumonia and
    ventilator-induced lung injury.
  experimental_model_type: ORGAN_ON_CHIP
  namo_type: namo:OrganOnChip
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  tissue_term:
    preferred_term: alveolus of lung
    term:
      id: UBERON:0002299
      label: alveolus of lung
  cell_types:
  - preferred_term: Pulmonary alveolar type 2 cell
    term:
      id: CL:0002063
      label: pulmonary alveolar type 2 cell
  - preferred_term: Pulmonary alveolar type 1 cell
    term:
      id: CL:0002062
      label: pulmonary alveolar type 1 cell
  - preferred_term: Pulmonary capillary endothelial cell
    term:
      id: CL:4028001
      label: pulmonary capillary endothelial cell
  conditions:
  - physiological cyclic strain (5%, 0.25 Hz)
  - hyperphysiological cyclic strain (10%, 0.25 Hz)
  - Pseudomonas aeruginosa PAO1 infection
  cell_source: Human alveolar organoid-derived epithelial cells and primary pulmonary microvascular
    endothelial cells
  culture_system: Alveolus-on-a-chip with air-liquid interface, vascular flow, and controlled cyclic strain
  publication: PMID:41252215
  modeled_mechanisms:
  - target: Ventilator-Induced Lung Injury
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Raising cyclic strain from physiological to hyperphysiological levels
      increased apparent permeability and, under infection, increased bacterial
      counts in the vascular channel. This reproduces the clinical interaction in
      which ventilation-associated overdistension worsens an infectious insult
      rather than merely coexisting with it.
    limitations: >-
      Uniform cyclic strain across a chip membrane is not the regionally
      heterogeneous overdistension and cyclic recruitment-derecruitment of an
      injured ventilated lung, and the model has no immune cells, so the
      leukocyte-mediated component of ventilator-induced injury is absent.
      Readouts are at 12 hours post-infection only.
    readouts:
    - name: Apparent permeability under hyperphysiological versus physiological strain
      target: Ventilator-Induced Lung Injury
      direction: INCREASED
      interpretation: >-
        Strain-dependent permeability increase is the barrier readout for
        stretch injury.
      evidence:
      - reference: PMID:41252215
        reference_title: Mechanical strain exacerbates Pseudomonas infection in an organoid-based pneumonia-on-a-chip
          model.
        supports: PARTIAL
        evidence_source: IN_VITRO
        snippet: "Yet, Papp was slightly increased in 10% stretched ODAECs, suggesting barrier impairment
          by hyperphysiological stretch."
        explanation: Reports the permeability effect of strain alone; PARTIAL preserves the authors'
          description of the effect as slight.
    - name: Bacterial translocation to the vascular channel under increased strain
      target: Ventilator-Induced Lung Injury
      direction: INCREASED
      interpretation: >-
        Higher vascular-channel colony counts under greater strain quantify the
        strain-infection interaction.
      evidence:
      - reference: PMID:41252215
        reference_title: Mechanical strain exacerbates Pseudomonas infection in an organoid-based pneumonia-on-a-chip
          model.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: Notably, increased cellular stretch intensified Pseudomonas infection, leading to greater
          barrier disruption and bacterial translocation
        explanation: Directly reports increased barrier disruption and translocation under greater
          strain.
    evidence:
    - reference: PMID:41252215
      reference_title: Mechanical strain exacerbates Pseudomonas infection in an organoid-based pneumonia-on-a-chip
        model.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: We hereby present what we believe to be the first functional Pseudomonas POC and VAP-on-a-chip
        model that replicates key features of disease, including enhanced mechanical strain.
      explanation: Supports the chip as a model of ventilator-associated infectious lung injury, the
        clinical setting this node describes.
  - target: Alveolar-Capillary Barrier Disruption
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Infection combined with hyperphysiological strain disrupted the
      alveolar-capillary barrier and allowed bacteria to cross into the vascular
      compartment, reproducing the permeability lesion together with its
      functional consequence.
    limitations: >-
      Barrier failure is measured as apparent permeability and bacterial
      translocation over 12 hours, without the protein-rich alveolar flooding,
      coagulation, or leukocyte transmigration that accompany the lesion
      clinically.
    readouts:
    - name: Barrier disruption with bacterial translocation
      target: Alveolar-Capillary Barrier Disruption
      direction: INCREASED
      interpretation: >-
        Passage of bacteria from the alveolar to the vascular channel is a
        functional demonstration that the barrier has failed.
      evidence:
      - reference: PMID:41252215
        reference_title: Mechanical strain exacerbates Pseudomonas infection in an organoid-based pneumonia-on-a-chip
          model.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: Notably, increased cellular stretch intensified Pseudomonas infection, leading to greater
          barrier disruption and bacterial translocation
        explanation: Reports barrier disruption with translocation as a combined functional readout.
    evidence:
    - reference: PMID:41252215
      reference_title: Mechanical strain exacerbates Pseudomonas infection in an organoid-based pneumonia-on-a-chip
        model.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: We hereby present what we believe to be the first functional Pseudomonas POC and VAP-on-a-chip
        model that replicates key features of disease, including enhanced mechanical strain.
      explanation: Supports the chip as informative for the alveolar-capillary barrier lesion under
        combined infectious and mechanical insult.

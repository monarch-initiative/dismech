diagnosis:
- name: Adult global consensus clinical diagnosis
  diagnosis_term:
    preferred_term: clinical assessment
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  description: Diagnose ARDS when acute or worsening hypoxemic respiratory failure occurs within one week of a predisposing insult or new respiratory symptoms, with bilateral loss of lung aeration on radiography, CT, or qualified ultrasound, and edema not primarily explained by cardiac failure, fluid overload, collapse, effusion, or embolism. Hypoxemia can be identified by PaO2:FiO2 at or below 300 mm Hg or by SpO2:FiO2 at or below 315 when SpO2 is at or below 97%; the global definition includes specified nonintubated and resource-limited pathways. Nonintubated criteria require HFNO at least 30 L/min or NIV/CPAP with at least 5 cm H2O end-expiratory pressure. Intubated criteria require PEEP at least 5 cm H2O. A separate resource-limited category does not require a specific oxygen-delivery device, flow or PEEP. Cardiogenic edema and chronic lung disease can coexist when they do not primarily explain the acute hypoxemia.
  results: Acute bilateral noncardiogenic inflammatory lung injury with qualifying hypoxemia supports the diagnosis; severity and respiratory-support category should be recorded separately.
  evidence:
  - reference: PMID:37487152
    reference_title: A New Global Definition of Acute Respiratory Distress Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: 'The committee agreed that the current time frame for the diagnosis of ARDS should be retained: acute onset or worsening of hypoxemic respiratory failure is defined as occurring within 1 week of the onset of the predisposing risk factor or within 1 week of new or worsening respiratory symptoms.'
    explanation: This establishes the acute diagnostic time window.
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:37487152
    reference_title: A New Global Definition of Acute Respiratory Distress Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: 'The committee made four main recommendations: 1) include high-flow nasal oxygen with a minimum flow rate of ⩾30 L/min; 2) use PaO2:FiO2 ⩽ 300 mm Hg or oxygen saturation as measured by pulse oximetry SpO2:FiO2 ⩽ 315 (if oxygen saturation as measured by pulse oximetry is ⩽97%) to identify hypoxemia; 3) retain bilateral opacities for imaging criteria but add ultrasound as an imaging modality, especially in resource-limited areas; and 4) in resource-limited settings, do not require positive end-expiratory pressure, oxygen flow rate, or specific respiratory support devices.'
    explanation: The global definition supplies the oxygenation, imaging, and respiratory-support criteria represented in the diagnostic description.
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:37487152
    reference_title: A New Global Definition of Acute Respiratory Distress Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: The committee agreed on a threshold of oxygen delivery of 30 L/min with HFNO because 30 L/min can provide low levels of PEEP (56).
    explanation: The global definition specifies the nonintubated support threshold.
- name: PALICC-2 pediatric scope and timing
  description: Use for children younger than 18 without active perinatal lung disease, within seven days of a known insult. New unilateral or bilateral parenchymal opacity is sufficient; edema must not be fully cardiac or fluid-overload related. Definitions are ungraded consensus statements.
  evidence:
  - reference: PMID:36661420
    reference_title: Executive Summary of the Second International Guidelines for the Diagnosis and Management of Pediatric Acute Respiratory Distress Syndrome (PALICC-2).
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: All patients less than 18 years old without active perinatal lung disease should be diagnosed with PARDS using PALICC-2 criteria.
    explanation: Guideline recommendation; this is evidence synthesis, not a new patient-outcome experiment.
  - reference: PMID:36661420
    reference_title: Executive Summary of the Second International Guidelines for the Diagnosis and Management of Pediatric Acute Respiratory Distress Syndrome (PALICC-2).
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Symptoms of hypoxemia and radiographic changes must occur within 7 days of a known insult to qualify for PARDS.
    explanation: Timing criterion.
  - reference: PMID:36661420
    reference_title: Executive Summary of the Second International Guidelines for the Diagnosis and Management of Pediatric Acute Respiratory Distress Syndrome (PALICC-2).
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Chest imaging findings of new opacity (or opacities) consistent with acute pulmonary parenchymal disease not explained by atelectasis or effusion are necessary to diagnose PARDS.

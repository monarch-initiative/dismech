  - target: Pulmonary Cytokine and Chemokine Release
    relationship: PERTURBS
    fidelity: MODERATE
    description: >-
      Increasing cyclic strain from 5% to 10% modulates IL-6 and IL-8 release in the infected chip. Cytokine
      levels decrease under greater strain despite increased barrier injury.
    limitations: >-

    treatment_effect: INHIBITS
    description: >-
      Lower tidal volume and plateau-pressure limitation reduce injurious
      mechanical stretch during invasive ventilation.
    evidence:
    - reference: PMID:10793162
      reference_title: Ventilation with lower tidal volumes as compared with traditional tidal volumes for acute lung injury and the acute respiratory distress syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Traditional approaches to mechanical ventilation use tidal volumes of
        10 to 15 ml per kilogram of body weight and may cause stretch-induced
        lung injury in patients with acute lung injury and the acute respiratory
        distress syndrome.
      explanation: >-
        The trial directly motivates lower-volume ventilation as prevention of
        stretch-induced lung injury.
  evidence:
  - reference: PMID:10793162
    reference_title: Ventilation with lower tidal volumes as compared with traditional tidal volumes for acute lung injury and the acute respiratory distress syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In patients with acute lung injury and the acute respiratory distress
      syndrome, mechanical ventilation with a lower tidal volume than is
      traditionally used results in decreased mortality and increases the
      number of days without ventilator use.
    explanation: >-
      The multicenter randomized trial directly supports lung-protective

  description: >-
    Identify and treat the precipitating cause while providing oxygenation,
    hemodynamic support, infection management when indicated, prevention of
    secondary injury, and organ support. ARDS has no single etiology-specific
    pharmacologic cure, so supportive strategies are selected by severity and
    patient context.

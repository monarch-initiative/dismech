treatments:
- name: Etiology-Directed and Intensive Supportive Care
  description: Identify and treat the precipitating cause while providing oxygenation, hemodynamic support, infection management when indicated, prevention of secondary injury, and organ support. ARDS has no single etiology-specific pharmacologic cure, so supportive strategies are selected by severity and patient context.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_phenotypes:
  - preferred_term: Respiratory failure
    term:
      id: HP:0002878
      label: Respiratory failure
  evidence:
  - reference: PMID:39866839
    reference_title: 'Acute respiratory distress syndrome (ARDS): from mechanistic insights to therapeutic strategies.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Given the complexity of the underlying disease, treatment needs to be tailored to the problem.
    explanation: The review supports etiology- and context-specific management of this heterogeneous syndrome.
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
- name: Adult lung-protective mechanical ventilation
  description: 'Strong recommendation, moderate certainty: 4–8 mL/kg predicted body weight with plateau pressure <30 cm H2O. This retained recommendation is broader than the pivotal 6 mL/kg trial protocol.'
  treatment_term:
    preferred_term: mechanical ventilation
    term:
      id: NCIT:C70909
      label: Mechanical Ventilation
  target_phenotypes:
  - preferred_term: Respiratory failure
    term:
      id: HP:0002878
      label: Respiratory failure
  target_mechanisms:
  - target: Ventilator-Induced Lung Injury
    treatment_effect: INHIBITS
    description: Lower tidal volume and plateau-pressure limitation reduce injurious mechanical stretch during invasive ventilation.
    evidence:
    - reference: PMID:10793162
      reference_title: Ventilation with lower tidal volumes as compared with traditional tidal volumes for acute lung injury and the acute respiratory distress syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Traditional approaches to mechanical ventilation use tidal volumes of 10 to 15 ml per kilogram of body weight and may cause stretch-induced lung injury in patients with acute lung injury and the acute respiratory distress syndrome.
      explanation: The trial directly motivates lower-volume ventilation as prevention of stretch-induced lung injury.
      directness: DIRECT
      quote_role: PRIMARY_RESULT
  evidence:
  - reference: PMID:38032683
    reference_title: 'An Update on Management of Adult Patients with Acute Respiratory Distress Syndrome: An Official American Thoracic Society Clinical Practice Guideline.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: We recommend using mechanical ventilation strategies that limit tidal volume (4–8 mL/kg predicted body weight) and inspiratory pressures (plateau pressure <30 cm H2O) in patients with ARDS (strong recommendation, moderate certainty of evidence).
    explanation: Guideline recommendation; this is evidence synthesis, not a new patient-outcome experiment.
- name: Adult prone positioning
  description: For severe adult ARDS, >12 hours daily is strongly recommended with moderate certainty. Individual primary trials may use a longer protocol. ESICM recommends starting after stabilization and optimized ventilation when PaO2/FiO2 remains below 150 mm Hg, with sessions of at least 16 consecutive hours. PROSEVA used this prolonged protocol; its trial outcome applies to the selected study population.
  treatment_term:
    preferred_term: Prone Ventilation
    term:
      id: NCIT:C173751
      label: Prone Ventilation
  target_phenotypes:
  - preferred_term: Hypoxemia
    term:
      id: HP:0012418
      label: Hypoxemia
  target_mechanisms:
  - target: Intrapulmonary Shunting
    treatment_effect: MODULATES
    description: Proning redistributes ventilation and perfusion and recruits dependent lung, thereby improving oxygenation across the shunt-dominated physiology.
    evidence:
    - reference: PMID:39866839
      reference_title: 'Acute respiratory distress syndrome (ARDS): from mechanistic insights to therapeutic strategies.'
      supports: SUPPORT
      evidence_source: OTHER
      snippet: The prone position is a readily implementable intervention associated with improved oxygenation due to an increased ventilator–blood flow ratio, more uniform ventilation distribution, increased lung volume, and improved perfusion redistribution during partial alveolar re-expansion in the respiratory-dependent area of the lung.
      explanation: The review directly links prone positioning to redistribution of ventilation and perfusion and improved oxygenation.
      directness: DIRECT
      quote_role: REVIEW_SYNTHESIS
  evidence:
  - reference: PMID:38032683
    reference_title: 'An Update on Management of Adult Patients with Acute Respiratory Distress Syndrome: An Official American Thoracic Society Clinical Practice Guideline.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: We recommend prone positioning for >12 hours per day in patients with severe ARDS (strong recommendation, moderate certainty of evidence).
    explanation: Guideline recommendation; this is evidence synthesis, not a new patient-outcome experiment.
  - reference: PMID:37326646
    reference_title: 'ESICM guidelines on acute respiratory distress syndrome: definition, phenotyping and respiratory support strategies.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Therefore, the evidence used for this question is the same as that for previous the question.Recommendation 7.2We recommend starting prone position in patients with ARDS receiving invasive mechanical ventilation early after intubation, after a period of stabilization during which low tidal volume is applied and PEEP adjusted and at the end of which the PaO2/FiO2 remains < 150 mmHg; and proning should be applied for prolonged sessions (16 consecutive hours or more) to reduce mortality.Strong recommendation; high level of evidence in favor.This recommendation applies also to ARDS from COVID-19.Strong recommendation; moderate level of evidence in favor for indirectness.
    explanation: The ESICM recommendation specifies timing, oxygenation and session duration.
- name: Conservative Fluid Management After Hemodynamic Stabilization
  description: 'In adults after shock and tissue hypoperfusion have resolved, conservative fluid management can limit superimposed hydrostatic loading. FACTT randomized 1000 patients for seven days: ventilator-free days improved, but 60-day mortality did not differ significantly. This is not fluid restriction during active shock.'
  treatment_term:
    preferred_term: fluid therapy
    term:
      id: NCIT:C116537
      label: Fluid Therapy
  target_phenotypes:
  - preferred_term: Pulmonary edema
    term:
      id: HP:0100598
      label: Pulmonary edema
  target_mechanisms:
  - target: Protein-Rich Alveolar Edema
    treatment_effect: INHIBITS
    description: After hemodynamic stabilization, conservative fluid management limits the fluid burden superimposed on permeability edema and improves lung function.
    evidence:
    - reference: PMID:16714767
      reference_title: Comparison of two fluid-management strategies in acute lung injury.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Although there was no significant difference in the primary outcome of 60-day mortality, the conservative strategy of fluid management improved lung function and shortened the duration of mechanical ventilation and intensive care without increasing nonpulmonary-organ failures.
      explanation: FACTT directly demonstrates improved lung function from the conservative strategy while retaining its neutral mortality result.
      directness: DIRECT
      quote_role: PRIMARY_RESULT
  evidence:
  - reference: PMID:16714767
    reference_title: Comparison of two fluid-management strategies in acute lung injury.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Although there was no significant difference in the primary outcome of 60-day mortality, the conservative strategy of fluid management improved lung function and shortened the duration of mechanical ventilation and intensive care without increasing nonpulmonary-organ failures.
    explanation: The randomized FACTT trial supports conservative management for pulmonary and support-duration outcomes while preserving its neutral mortality result.
    directness: DIRECT
    quote_role: PRIMARY_RESULT
  - reference: PMID:30872586

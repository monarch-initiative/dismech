diagnosis:
- name: Global Consensus Clinical Diagnosis
  diagnosis_term:
    preferred_term: clinical assessment
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  description: >-
    Diagnose ARDS when acute or worsening hypoxemic respiratory failure occurs
    within one week of a predisposing insult or new respiratory symptoms, with
    bilateral loss of lung aeration on radiography, CT, or qualified ultrasound,
    and edema not primarily explained by cardiac failure, fluid overload,
    collapse, effusion, or embolism. Hypoxemia can be identified by
    PaO2:FiO2 at or below 300 mm Hg or by SpO2:FiO2 at or below 315 when SpO2 is
    at or below 97%; the global definition includes specified nonintubated and
    resource-limited pathways.
  results: >-
    Acute bilateral noncardiogenic inflammatory lung injury with qualifying
    hypoxemia supports the diagnosis; severity and respiratory-support category
    should be recorded separately.
  evidence:
  - reference: PMID:37487152
    reference_title: A New Global Definition of Acute Respiratory Distress Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The committee agreed that the current time frame for the diagnosis of ARDS
      should be retained: acute onset or worsening of hypoxemic respiratory
      failure is defined as occurring within 1 week of the onset of the
      predisposing risk factor or within 1 week of new or worsening respiratory
      symptoms.
    explanation: This establishes the acute diagnostic time window.
  - reference: PMID:37487152
    reference_title: A New Global Definition of Acute Respiratory Distress Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The committee made four main recommendations: 1) include high-flow nasal
      oxygen with a minimum flow rate of ⩾30 L/min; 2) use PaO2:FiO2 ⩽ 300 mm Hg
      or oxygen saturation as measured by pulse oximetry SpO2:FiO2 ⩽ 315 (if
      oxygen saturation as measured by pulse oximetry is ⩽97%) to identify
      hypoxemia; 3) retain bilateral opacities for imaging criteria but add
      ultrasound as an imaging modality, especially in resource-limited areas;
      and 4) in resource-limited settings, do not require positive
      end-expiratory pressure, oxygen flow rate, or specific respiratory support
      devices.
    explanation: >-
      The global definition supplies the oxygenation, imaging, and
      respiratory-support criteria represented in the diagnostic description.

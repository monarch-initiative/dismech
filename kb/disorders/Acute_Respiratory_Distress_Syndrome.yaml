    quote_role: PRIMARY_RESULT
histopathology:
- name: Diffuse Alveolar Damage with Hyaline Membrane Formation
  description: ARDS histology can show intraalveolar edema, inflammation, hyaline membrane formation, and alveolar hemorrhage in a diffuse-alveolar-damage pattern. These findings are variable and are neither universal nor required for the clinical diagnosis.
  evidence:
  - reference: PMID:37487152
    reference_title: A New Global Definition of Acute Respiratory Distress Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Histological findings vary and often include intraalveolar edema, inflammation, hyaline membrane formation, and alveolar hemorrhage, often termed diffuse alveolar damage; however, these histological features are not always present and are not necessary for a clinical diagnosis of ARDS (26).
    explanation: The consensus document supports the characteristic diffuse-alveolar-damage pattern and directly supplies the non-universality and diagnostic caveat.
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
biochemical:
- name: Bronchoalveolar lavage L-lactate
  presence: INCREASED
  biomarker_term:
    preferred_term: lactate
    term:
      id: CHEBI:24996
      label: lactate
  context: Untargeted LC-MS of convenience BAL samples from 18 ARDS patients and eight healthy controls found higher L-lactate; the RPLC estimate was 4.35-fold. Sampling was early and cross-sectional, with heterogeneous disease, ventilation and medication exposure. This is an exploratory compartment-specific association, not a diagnostic threshold or proof of intracellular glycolytic flux.
  evidence:
  - reference: PMID:24289193
    reference_title: Untargeted LC-MS metabolomics of bronchoalveolar lavage fluid differentiates acute respiratory distress syndrome from health.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Despite the certain technical limitations of our analytical approach, we identified potential differentiating metabolites of ARDS as evidenced by the over four-fold increase in L-lactate and changes in other metabolites associated with energy metabolism (e.g., citrate, creatine, creatinine).32 Citrate, creatine and creatinine are three metabolites that were also found to be increased in ARDS plasma samples by 1D-1H-NMR.9, 26 The remainder of the identified metabolites were specific to BALF.
    explanation: The primary study measures higher BAL lactate, without validating an ARDS-specific clinical assay.

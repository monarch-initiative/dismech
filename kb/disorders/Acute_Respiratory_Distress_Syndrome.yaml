experimental_models:
- name: Human airway-on-a-chip chlorine gas exposure model
  description: Human bronchial airway-on-chip with mucociliary epithelium, stromal extracellular matrix and a microvascular endothelial compartment, exposed to controlled chlorine gas. Integrated TEER, imaging and omics characterize chemical injury. This is an airway model, not an alveolar ARDS model or a clinical exposure-threshold study.
  experimental_model_type: ORGAN_ON_CHIP
  namo_type: namo:OrganOnChip
  organism:
    preferred_term: human

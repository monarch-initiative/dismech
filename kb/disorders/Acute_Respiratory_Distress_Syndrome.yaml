name: Acute Respiratory Distress Syndrome
creation_date: "2026-08-08T19:10:07Z"
category: Complex
categories:
- Respiratory Disease
synonyms:
- ARDS
description: >-
  Acute respiratory distress syndrome is an acute, diffuse inflammatory lung
  injury that follows a direct pulmonary or indirect systemic insult. Increased
  permeability of the pulmonary microvascular endothelium and alveolar
  epithelium produces noncardiogenic pulmonary edema and loss of aerated lung,
  causing bilateral opacities, shunt physiology, reduced compliance, and acute
  hypoxemic respiratory failure. ARDS is a clinically and biologically
  heterogeneous syndrome rather than a single etiology or invariant histologic
  lesion.

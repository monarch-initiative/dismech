discussions:
- discussion_id: disc_ards_metabolic_endotype_validation
  prompt: Do longitudinal immunometabolic states causally define reproducible ARDS endotypes that predict recovery and treatment response, and can metabolic resilience be measured prospectively well enough to guide therapy?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Increased Glycolytic Programming
  - pathophysiology#Impaired Mitochondrial Respiration
  rationale: The immunometabolic framework remains a hypothesis spanning experimental lung injury, sepsis and associative human omics. The cited BAL primary study measured early cross-sectional metabolites in 18 ARDS patients and eight healthy controls; it did not measure succinate or longitudinal persistence. The peripheral-blood single-cell study analyzed three ARDS patients and one healthy control, and pathway enrichment is not a direct measurement of oxidative stress or lung-cell respiration. Prospective compartment-specific functional and clinical validation is needed.
  evidence:
  - reference: PMID:42432720
    reference_title: 'Immunometabolic reprogramming and mitochondrial dysfunction in acute respiratory distress syndrome: mechanisms, metabolic resilience, and therapeutic perspectives- a narrative review.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: 'However, the actual clinical translational value of this framework faces a major practical hurdle: no prospective randomized clinical trial has yet successfully implemented real-time metabolic endotyping at the bedside.'
    explanation: The review acknowledges the absence of prospective bedside metabolic-endotyping trials.
  - reference: PMID:24289193
    reference_title: Untargeted LC-MS metabolomics of bronchoalveolar lavage fluid differentiates acute respiratory distress syndrome from health.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Ultimately, it is our goal to construct a longitudinal metabolomics strategy to more fully characterize the ARDS metabolome that will drive biomarker discovery and the identification of drug target opportunities to improve the outcome of patients with ARDS.
    explanation: Longitudinal profiling was a future goal of the BAL primary, not its design.
  - reference: PMID:37283946
    reference_title: Single-cell analysis reveals dysregulated inflammatory response in peripheral blood immunity in patients with acute respiratory distress syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: To this end, we performed scRNA-seq (10× Genomics) of peripheral blood single nuclei from one PNE-ARDS patient, two sep-ARDS patients, and one healthy volunteer (Figure 1A).
    explanation: The study contained three ARDS patients and one healthy control; blood-cell enrichment analyses cannot establish a universal lung mechanism.

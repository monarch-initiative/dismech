  - target: Ventilator-Induced Lung Injury
    treatment_effect: INHIBITS
    description: >-
      In selected early severe ARDS, blockade can reduce patient-ventilator
      dyssynchrony and thereby limit ventilator-induced injury.
    evidence:
    - reference: PMID:38032683
      reference_title: "An Update on Management of Adult Patients with Acute Respiratory Distress Syndrome: An Official American Thoracic Society Clinical Practice Guideline."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        NMBAs are a commonly used adjunctive therapy for patients with ARDS (16,
        56). The mechanism of benefit is unclear, but likely involves decreasing
        ventilator-induced lung injury via a reduction in patient–ventilator
        dyssynchrony in addition to reducing oxygen consumption, inflammation,
        and alveolar fluid (57–59).
      explanation: >-
        The guideline explicitly links neuromuscular blockade to reduced
        dyssynchrony and likely reduction of ventilator-induced injury.
  evidence:
  - reference: PMID:38032683
    reference_title: "An Update on Management of Adult Patients with Acute Respiratory Distress Syndrome: An Official American Thoracic Society Clinical Practice Guideline."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      We suggest using neuromuscular blockade in patients with early severe ARDS
      (conditional recommendation, low certainty)
    explanation: >-
      The official guideline limits neuromuscular blockade to early severe ARDS
      and explicitly grades the recommendation as conditional and low certainty.
  - reference: PMID:38032683
    reference_title: "An Update on Management of Adult Patients with Acute Respiratory Distress Syndrome: An Official American Thoracic Society Clinical Practice Guideline."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Although this guideline does not recommend a specific NMBA, cisatracurium
      was used in the two largest RCTs (60, 64) and may be associated with
      pleiotropic effects, including a decrease in inflammatory cytokines (68,
      69), suggesting that it may be a preferable NMBA for patients with ARDS.
    explanation: >-
      The guideline supports cisatracurium as the best-studied representative
      agent while explicitly retaining that no specific NMBA is mandated.
- name: Venovenous Extracorporeal Membrane Oxygenation
  description: >-
    VV-ECMO is rescue organ support for carefully selected patients with severe,
    refractory ARDS after optimization of conventional lung-protective care.
    Patient selection, center expertise, reversibility, duration of ventilation,
    and complication risk are essential because certainty of benefit remains low.
  treatment_term:
    preferred_term: extracorporeal membrane oxygenation
    term:
      id: NCIT:C171507
      label: Extracorporeal Membrane Oxygenation
  target_phenotypes:
  - preferred_term: Respiratory failure
    term:
      id: HP:0002878
      label: Respiratory failure
  target_mechanisms:
  - target: Shunt Physiology and Hypoxemic Respiratory Failure
    treatment_effect: MODULATES
    description: >-
      VV-ECMO provides extracorporeal gas exchange while the injured lung is
      supported, improving blood oxygen exchange in refractory respiratory
      failure without claiming to repair the upstream alveolar lesion.
    evidence:
    - reference: PMID:39866839
      reference_title: "Acute respiratory distress syndrome (ARDS): from mechanistic insights to therapeutic strategies."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        ECMO directly provides conditional support for patients, improves the
        blood oxygen exchange rate, and has an important impact on the
        adjustment of body hemodynamics.
      explanation: >-
        The review directly links ECMO support to improved blood oxygen exchange,
        supporting a conservative MODULATES edge to terminal shunt physiology.
  evidence:
  - reference: PMID:38032683
    reference_title: "An Update on Management of Adult Patients with Acute Respiratory Distress Syndrome: An Official American Thoracic Society Clinical Practice Guideline."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      We suggest using venovenous extracorporeal membrane oxygenation (VV-ECMO)
      in selected patients with severe ARDS (conditional recommendation, low
      certainty of evidence).
    explanation: >-
      The official guideline supports VV-ECMO only for selected severe cases and
      explicitly grades the evidence as low certainty.
discussions:
- discussion_id: disc_ards_metabolic_endotype_validation
  prompt: >-
    Do longitudinal immunometabolic states causally define reproducible ARDS
    endotypes that predict recovery and treatment response, and can metabolic
    resilience be measured prospectively well enough to guide therapy?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Immunometabolic Reprogramming and Mitochondrial Dysfunction
  rationale: >-
    PMID:42432720 synthesizes glycolytic shifts, impaired oxidative
    phosphorylation, metabolite signaling, and mitochondrial dysfunction into a
    metabolic-resilience framework. However, it is a narrative review, human
    multi-omic studies are largely associative and compartment-dependent, and
    some longitudinal claims are extrapolated from sepsis or experimental acute
    lung injury. Prospective ARDS-specific validation is needed to establish
    whether these metabolic states are causal, stable enough for bedside
    classification, and predictive of benefit from a metabolism-targeted
    intervention rather than merely markers of severity.
  evidence:
  - reference: PMID:42432720
    reference_title: "Immunometabolic reprogramming and mitochondrial dysfunction in acute respiratory distress syndrome: mechanisms, metabolic resilience, and therapeutic perspectives- a narrative review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Multi-omic studies further demonstrate that distinct metabolic signatures
      are associated with ARDS phenotypes, disease severity, and treatment
      responsiveness.
    explanation: >-
      The association of metabolic signatures with phenotype and response is the
      evidence base that motivates, but does not resolve, the prospective causal
      and treatment-selection question.

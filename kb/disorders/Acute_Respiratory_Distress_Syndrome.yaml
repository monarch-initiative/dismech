      label: pediatric acute respiratory distress syndrome
  description: ARDS in patients younger than 18 years without active perinatal lung disease. PALICC-2 uses pediatric oxygenation criteria and permits unilateral or bilateral parenchymal opacities; nasal noninvasive support or HFNC can qualify as possible PARDS rather than confirmed NIV-PARDS.
  evidence:

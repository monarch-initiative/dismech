- name: Avoid prolonged high-pressure recruitment maneuvers in adult ARDS
  description: Prolonged high-pressure recruitment is strongly discouraged because potential harms include hemodynamic collapse and barotrauma. ESICM defines airway pressure at least 35 cm H2O for at least one minute; the ATS definition uses PEEP at least 35 cm H2O for more than 60 seconds.

- name: Immunometabolic Reprogramming and Mitochondrial Dysfunction
  description: >-
    Immune and structural lung cells can shift toward glycolysis while
    mitochondrial oxidative phosphorylation and redox control deteriorate.
    Lactate, succinate, extracellular ATP, and mitochondrial danger signals may
    then act as signaling mediators that sustain inflammatory activation and
    impair energetically demanding barrier repair. This is modeled as an
    emerging modifier rather than a required step in every patient.

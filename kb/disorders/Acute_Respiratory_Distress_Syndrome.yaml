    Pneumonia, aspiration, inhalational injury, or lung contusion can directly
    injure the lung, whereas sepsis, pancreatitis, major trauma, shock, burns,
    and transfusion can initiate systemic inflammation and endothelial injury.
    These heterogeneous triggers converge on acute diffuse lung injury.

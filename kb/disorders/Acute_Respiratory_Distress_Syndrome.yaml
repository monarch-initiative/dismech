environmental:
- name: Inhalation of chlorine gas
  description: Chlorine is among the commonest chemical causes of acute lung injury, encountered through transport accidents, industrial spills, water treatment and swimming-pool exposures, and deliberate release. Inhaled chlorine reacts in the airway to form oxidative products, so the insult delivered to the alveolar-capillary interface is chemical and oxidative rather than infectious or mechanical.
  exposure_term:
    preferred_term: inhalation of chlorine gas
    term:
      id: ECTO:9000077
      label: exposure to chlorine
  exposure_classifications:
    hazard_agent_type:
    - classification_value: CHEMICAL
    exposure_route:
    - classification_value: INHALATION
      notes: Inhalation is the route by which chlorine reaches the alveolar-capillary interface; dermal and ocular contact cause local irritation without this mechanism.
    exposure_duration:
    - classification_value: ACUTE
      notes: The ARDS-producing exposures are short, high-concentration events (spills, accidents, release), not the chronic low-level occupational and swimming-pool exposures that produce airway hyperreactivity.
  influences_mechanisms:
  - target: Direct Pulmonary or Indirect Systemic Insult
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: Halogen inhalation is a direct pulmonary insult, entering the mechanism at the trigger node alongside pneumonia, aspiration and contusion.
    evidence:
    - reference: PMID:29722341
      reference_title: Halogen Inhalation-Induced Lung Injury and Acute Respiratory Distress Syndrome.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: Chlorine is highly toxic by inhalation, leading to dyspnea, hypoxemia, airway obstruction, pneumonitis, pulmonary edema, and acute respiratory distress syndrome (ARDS).
      explanation: States the causal path from inhalational chlorine exposure to ARDS, supporting the exposure acting on the trigger node.
      directness: DIRECT
      quote_role: REVIEW_SYNTHESIS
  notes: Bound to ECTO:9000077 (exposure to chlorine), confirmed against the ontology service. This entry was originally scoped to "irritant halogen gases" and bound to the substance-level ECTO:0000231 while the service was unreachable; it is now narrowed to chlorine so the binding, the name and the quoted evidence all describe the same agent. Bromine is curated as a separate entry because ECTO has no bromine exposure class, and binding the chlorine term to an entry that also asserted bromine would have manufactured a narrower match than the claim.
  evidence:
  - reference: PMID:20601629
    reference_title: 'Chlorine gas inhalation: human clinical evidence of toxicity and experience in animal models.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: More severely affected individuals may suffer acute lung injury (ALI) and/or acute respiratory distress syndrome (ARDS).
    explanation: Human clinical evidence that chlorine exposure reaches ARDS at the severe end of its dose-response, rather than causing airway irritation alone.
    directness: DIRECT
    quote_role: PRIMARY_RESULT
  - reference: PMID:20601629
    reference_title: 'Chlorine gas inhalation: human clinical evidence of toxicity and experience in animal models.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Humans can come into contact with chlorine gas during short-term, high-level exposures due to traffic or rail accidents, spills, or other disasters.
    explanation: Documents the exposure scenarios, which is what makes this an environmental entry rather than a purely clinical trigger.
    directness: DIRECT
    quote_role: PRIMARY_RESULT
- name: Inhalation of bromine gas
  description: Acute bromine inhalation can cause bronchospasm, airway hyperresponsiveness and severe acute lung injury including ARDS. Concentration, duration and species affect toxicity; experimental mouse mechanisms and rescue studies do not establish a human antidote.
  exposure_classifications:
    hazard_agent_type:
    - classification_value: CHEMICAL
    exposure_route:
    - classification_value: INHALATION
    exposure_duration:
    - classification_value: ACUTE
  influences_mechanisms:
  - target: Direct Pulmonary or Indirect Systemic Insult
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: Bromine inhalation is a direct pulmonary insult acting at the trigger node.
    evidence:
    - reference: PMID:29722341
      reference_title: Halogen Inhalation-Induced Lung Injury and Acute Respiratory Distress Syndrome.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: Although bromine is less reactive and oxidative than chlorine, inhalation also results in bronchospasm, airway hyperresponsiveness, ARDS, and even death.

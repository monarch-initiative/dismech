    term:
      id: CL:4028001
      label: pulmonary capillary endothelial cell
  conditions:
  - chlorine gas 10, 20, and 30 ppm for 10 to 30 minutes
  - medical air exposure control
  culture_system: Microfluidic airway-on-a-chip at air-liquid interface with integrated TEER electrodes and controlled gas exposure
  publication: PMID:41442163
  modeled_mechanisms:
  - target: Direct Pulmonary or Indirect Systemic Insult
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: Dose and duration jointly determine the measured barrier response. TEER recovered by 24 hours after 10 ppm for 10 minutes, whereas 30 ppm exposures caused nearly complete TEER reduction sustained through 24 hours. These data do not establish irreversible injury or recovery after every 10 ppm exposure.
    limitations: Chlorine is one specific inhalational insult and the chip is bronchial rather than alveolar, so it models the direct pulmonary insult category only for inhaled oxidant gases and not for aspiration, pneumonia, or the indirect systemic insults that cause most ARDS. Each dataset used a single donor set with independently fabricated chip replicates; these are not independent patient replicates.
    readouts:
    - name: Transepithelial electrical resistance across chlorine dose and duration
      target: Direct Pulmonary or Indirect Systemic Insult
      direction: DECREASED
      interpretation: TEER quantifies dose- and duration-dependent barrier function within the observed recovery period; it is not a proven irreversible-injury threshold.
      evidence:
      - reference: PMID:41442163
        reference_title: A human airway-on-a-chip microphysiological system for modeling chlorine gas toxicity.
        supports: SUPPORT
        evidence_source: IN_VITRO
        quote_role: PRIMARY_RESULT
        directness: DIRECT
        snippet: The lowest dose (10 ppm, 10 min) showed maximal TEER reduction at 6 h with complete recovery by 24 h (Fig. 3D).
        explanation: The lowest dose-duration condition recovered within 24 hours.
      - reference: PMID:41442163
        reference_title: A human airway-on-a-chip microphysiological system for modeling chlorine gas toxicity.
        supports: SUPPORT
        evidence_source: IN_VITRO
        quote_role: PRIMARY_RESULT
        directness: DIRECT
        snippet: All 30 ppm exposures resulted in nearly complete TEER reduction (approximately 100%) sustained through 24 h (Fig. 3F).
        explanation: The higher-concentration response persisted through the measured 24-hour interval.
    evidence:
    - reference: PMID:41442163
      reference_title: A human airway-on-a-chip microphysiological system for modeling chlorine gas toxicity.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Epithelial barrier disruption, characterized by gap formation, was evident immediately post-Cl2 exposure and persisted through 24 h
      explanation: Supports the chip as a model of a direct pulmonary chemical insult producing sustained injury.
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
  - target: Alveolar-Capillary Barrier Disruption
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: Immediate epithelial gaps and endothelial junction disruption detected at 72 hours are consistent with secondary endothelial injury. The timing does not establish the intervening signal or exclude an independent delayed chemical effect.
    limitations: The chip has no neutrophils or macrophages, so the inflammatory amplification and resolution phases that dominate barrier disruption in clinical ARDS are represented only indirectly through early epithelial-endothelial signalling. It is also airway rather than alveolar epithelium. Each dataset used a single donor set with independently fabricated chip replicates; these are not independent patient replicates.
    readouts:
    - name: Endothelial VE-cadherin junction integrity at 72 hours post-exposure
      target: Alveolar-Capillary Barrier Disruption
      direction: DECREASED
      interpretation: Delayed loss of endothelial junctional integrity is an observed readout; epithelial-to-endothelial mediation remains inferred.
      evidence:
      - reference: PMID:41442163
        reference_title: A human airway-on-a-chip microphysiological system for modeling chlorine gas toxicity.
        supports: SUPPORT
        evidence_source: IN_VITRO
        quote_role: PRIMARY_RESULT
        directness: DIRECT
        snippet: Endothelial barrier integrity, assessed at 0-, 24-, 48-, and 72-h post-exposure, showed significant disruption only at 72 h in Cl2-exposed airway-chips (0- and 72-h shown in Fig. 3H).
        explanation: The actual time-course observation supports a delayed endothelial effect.
    evidence:
    - reference: PMID:41442163
      reference_title: A human airway-on-a-chip microphysiological system for modeling chlorine gas toxicity.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: A primary constraint is the absence of innate immune system components, limiting evaluation of inflammatory responses to early epithelial/endothelial signaling that would typically recruit neutrophils and macrophages.
      explanation: The absence of innate immune cells limits the chip to early structural-cell signaling and barrier responses.
      directness: INDIRECT
      quote_role: PRIMARY_RESULT

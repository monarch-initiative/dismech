genetic:
- name: 12p13.2 susceptibility locus (rs7967111)
  association: Population association with ARDS susceptibility; not a Mendelian cause or clinical diagnostic test
  notes: In 1250 European-ancestry cases and 1583 controls, the primary GWAS meta-analysis was just above conventional genome-wide significance; a sensitivity model additionally adjusting for cohort and pneumonia produced OR 1.38 (95% CI 1.23–1.55), P=2.15×10−8. The trans-ancestry analysis did not identify a genome-wide significant locus. BORCS5 and DUSP16 are nearby annotated candidate genes; eQTL, expression and in-silico evidence do not resolve a causal gene or molecular route. The African-American analysis included 387 cases and 387 controls. Mendelian-randomization treatment associations do not establish clinical efficacy.

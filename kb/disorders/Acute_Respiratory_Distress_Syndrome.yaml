- name: High-flow nasal oxygen in adult acute hypoxemic respiratory failure
  description: ESICM strongly recommends HFNO over conventional oxygen for nonventilated adult acute hypoxemic respiratory failure not due to cardiogenic edema or COPD exacerbation, to reduce intubation risk. Mortality benefit was not established. Close monitoring and timely escalation are necessary; this evidence is broader than Berlin-defined ARDS.

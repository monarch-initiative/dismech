    term:
      id: HP:0002878
      label: Respiratory failure
  target_mechanisms:
  - target: Ventilator-Induced Lung Injury
    treatment_effect: INHIBITS
    description: In selected early severe ARDS, blockade can reduce patient-ventilator dyssynchrony and thereby limit ventilator-induced injury.
    evidence:
    - reference: PMID:38032683
      reference_title: 'An Update on Management of Adult Patients with Acute Respiratory Distress Syndrome: An Official American Thoracic Society Clinical Practice Guideline.'
      supports: SUPPORT
      evidence_source: OTHER
      snippet: NMBAs are a commonly used adjunctive therapy for patients with ARDS (16, 56). The mechanism of benefit is unclear, but likely involves decreasing ventilator-induced lung injury via a reduction in patient–ventilator dyssynchrony in addition to reducing oxygen consumption, inflammation, and alveolar fluid (57–59).
      explanation: The guideline explicitly links neuromuscular blockade to reduced dyssynchrony and likely reduction of ventilator-induced injury.
      directness: DIRECT

mechanistic_hypotheses:
- hypothesis_group_id: alveolar_capillary_injury_model
  hypothesis_label: Alveolar-Capillary Permeability Injury Model
  status: CANONICAL
  description: A direct pulmonary or indirect systemic insult initiates dysregulated innate inflammation and coagulation. Macrophage activation and recruited neutrophils injure the alveolar epithelium and pulmonary endothelium, increasing barrier permeability. Protein-rich edema, loss of aerated lung, and atelectasis then produce shunt physiology, reduced compliance, and hypoxemic respiratory failure.
  evidence:
  - reference: PMID:37487152
    reference_title: A New Global Definition of Acute Respiratory Distress Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: ARDS is an acute, diffuse, inflammatory lung injury precipitated by a risk factor such as pneumonia, nonpulmonary infection, trauma, transfusion, burn, aspiration, or shock. The resulting injury leads to pulmonary edema from an increase in pulmonary vascular and alveolar epithelial permeability.
    explanation: The global consensus definition states the canonical insult-to-barrier-leak framework used by the main causal graph.
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
- hypothesis_group_id: immunometabolic_resilience_model
  hypothesis_label: Immunometabolic Persistence and Metabolic Resilience Model
  status: EMERGING
  description: Sustained glycolytic programming, impaired mitochondrial oxidative phosphorylation, redox imbalance, and bioactive metabolite signaling in immune and structural lung cells may amplify inflammation and delay alveolar-capillary repair. The related concept of metabolic resilience proposes that recovery depends partly on restoring coordinated mitochondrial function, substrate use, and redox balance. These mechanisms may help explain clinical heterogeneity, but they are not yet validated as a diagnostic endotype or treatment-selection framework.
  evidence:
  - reference: PMID:42432720
    reference_title: 'Immunometabolic reprogramming and mitochondrial dysfunction in acute respiratory distress syndrome: mechanisms, metabolic resilience, and therapeutic perspectives- a narrative review.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Emerging evidence suggests that immunometabolic reprogramming, characterized by increased glycolysis, impaired mitochondrial oxidative phosphorylation, and altered metabolite signalling, plays a critical role in shaping immune-cell activation, inflammatory persistence, and tissue repair during critical illness.
    explanation: The issue's narrative review directly advances the immunometabolic model, while its wording and study design justify EMERGING rather than CANONICAL status.
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
  notes: Much of the pathway-level causality and therapeutic rationale is derived from experimental systems, sepsis extrapolation, or associative human multi-omics. No metabolism-targeted ARDS therapy or bedside metabolic-resilience assay has established prospective clinical utility.
progression:
- phase: Exudative inflammatory phase
  notes: The early injury phase features proinflammatory alveolar-macrophage activation, neutrophil recruitment, epithelial injury, endothelial activation, and permeability edema. Diffuse alveolar damage may occur but is not required for the clinical diagnosis.
  evidence:
  - reference: PMID:39866839
    reference_title: 'Acute respiratory distress syndrome (ARDS): from mechanistic insights to therapeutic strategies.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: During the exudative phase of ARDS, macrophages are activated by pathogens through pattern recognition receptors (PRRs), including Toll-like receptors (TLRs), leucine-rich repeat sequence receptors (NLRs), transmembrane C-type lectin receptors (CLRs), and retinoic acid-induced gene-like receptors (RLRs), which promote the transition of resident AM cells to the predominant proinflammatory phenotype.
    explanation: The review defines macrophage activation as a central feature of the exudative phase.
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
- phase: Reparative and proliferative phase
  notes: If injury control and clearance succeed, pulmonary alveolar type 2 cells proliferate and macrophage programs shift toward inflammation resolution, epithelial regeneration, edema clearance, and structural repair. Pro-resolving macrophages also clear dead cells and debris during recovery; the temporal association with epithelial regeneration is not treated as a demonstrated causal trigger.
  evidence:
  - reference: PMID:39866839
    reference_title: 'Acute respiratory distress syndrome (ARDS): from mechanistic insights to therapeutic strategies.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: In the late stage of ARDS, anti-inflammatory cytokines secreted by selectively activated macrophages inhibit the inflammatory response, thereby promoting epithelial regeneration and alveolar structural remodeling.
    explanation: The review describes the macrophage and epithelial transition toward repair and remodeling.
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:30872586
    reference_title: Acute respiratory distress syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Once the alveolar epithelium is regenerated, pro-resolving macrophages clear dead cells and debris and ATII and ATI epithelial cells reabsorb oedematous fluid.
    explanation: Review synthesis describes macrophage debris clearance during resolution.
- phase: Persistent fibroproliferative or fibrotic phase
  notes: In a subset with nonresolving injury, aberrant remodeling progresses to traction bronchiectasis, reduced lung volume, and fibrotic structural change, prolonging ventilatory and functional impairment.
  evidence:
  - reference: PMID:39866839
    reference_title: 'Acute respiratory distress syndrome (ARDS): from mechanistic insights to therapeutic strategies.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: By the time fibrosis occurs, in addition to traction bronchiectasis, large grid-like and small cystic changes may be observed in the lungs.
    explanation: The review describes the radiologic structural changes of the fibrotic phase; the entry limits this course to a subset rather than implying that all ARDS becomes fibrotic.
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
- phase: Post-intensive-care recovery
  notes: Some survivors have persistent physical and psychological impairment for years despite near-normal pulmonary function. In the five-year follow-up study, the original cohort comprised 109 survivors; survivor selection and incomplete causal attribution to ARDS limit generalization.
  evidence:
  - reference: PMID:21470008
    reference_title: Functional disability 5 years after acute respiratory distress syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: 'CONCLUSIONS: Exercise limitation, physical and psychological sequelae, decreased physical quality of life, and increased costs and use of health care services are important legacies of severe lung injury.'
    explanation: The longitudinal survivor study reports persistent limitations rather than a universal course.
- phase: Acute mortality risk
  notes: In the 2014 LUNG SAFE cohort, hospital mortality was 34.9%, 40.3% and 46.1% in mild, moderate and severe Berlin ARDS respectively. These are cohort-, definition- and era-specific outcomes, not current individual prognoses.
  evidence:
  - reference: PMID:26903337
    reference_title: Epidemiology, Patterns of Care, and Mortality for Patients With Acute Respiratory Distress Syndrome in Intensive Care Units in 50 Countries.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Hospital mortality was 34.9% (95% CI, 31.4%-38.5%) for those with mild, 40.3% (95% CI, 37.4%-43.3%) for those with moderate, and 46.1% (95% CI, 41.9%-50.4%) for those with severe ARDS.
    explanation: The observational cohort reports severity-associated hospital mortality.

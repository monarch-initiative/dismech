      reference_title: 'Preclinical and clinical studies of smoke-inhalation-induced acute lung injury: update on both pathogenesis and innovative therapy.'
      supports: SUPPORT
      evidence_source: OTHER
      snippet: Smoke-inhalation-induced acute lung injury (SI-ALI) is a leading cause of morbidity and mortality in victims of fire tragedies.
      explanation: Establishes smoke inhalation as a cause of acute lung injury acting at the trigger node.
      directness: DIRECT
      quote_role: REVIEW_SYNTHESIS
  notes: 'Bound to ECTO:7000059 (exposure to smoke), confirmed against the ontology service. This entry was originally bound to ECTO:0000231 (exposure to chemical) while the service was unreachable, which was not merely broad but in the wrong branch: ECTO classifies exposure to smoke under exposure to environmental material, not under exposure to chemical, which matches the fact that fire smoke is a mixture of combustion products rather than a single chemical agent. ECTO:6000029 (exposure to tobacco smoking) remains deliberately unused: it denotes tobacco smoking, a different exposure from inhaling combustion products in a fire, and reusing it would misclassify the exposure while validating cleanly.'

    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: 'METHODS: Meta-analyses of ARDS genome-wide association studies were performed with 1250 cases and 1583 controls in Europeans, and 387 cases and 387 controls in African Americans.'
    explanation: The primary study states ancestry-specific GWAS sample sizes.

      quote_role: REVIEW_SYNTHESIS
  notes: Deliberately left without an exposure_term. ECTO was searched via the ontology service and has no bromine exposure class - the nearest hit, ECTO:9002162 (exposure to brominated flame retardant), is a different agent and binding it would misclassify the exposure. Falling back to the generic ECTO:0000231 was also rejected, because that is the binding this PR is narrowing away from. `just environmental-term-audit` will report this entry as UNBOUND and that is the correct outcome, not a gap to close.
  evidence:

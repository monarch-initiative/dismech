    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: We are unable to make a recommendation for or against routine PEEP titration with a higher PEEP/FiO2 strategy versus a lower PEEP/FiO2 strategy to reduce mortality in patients with ARDS.
    explanation: The broader ESICM population and analysis should not be conflated with the ATS conditional recommendation.
- name: Adult neuromuscular blockade
  description: Conditional recommendation, low certainty, for early (<48 hours) severe ARDS (PaO2/FiO2 ≤100). Use selectively when deep sedation is already required or persistent dyssynchrony compromises protection. Limit duration to 48 hours when possible; mortality advantage was not established against light sedation. ESICM 2023 recommends against routine continuous infusions for mortality reduction in unselected moderate-to-severe non-COVID ARDS; this differs in scope from ATS selective early severe use. ICU-acquired weakness and sedation harms matter.
  treatment_term:
    preferred_term: neuromuscular blockade
    term:
      id: NCIT:C158070
      label: Neuromuscular Blockade
    therapeutic_agent:
    - preferred_term: cisatracurium
      term:
        id: CHEBI:140621
        label: cisatracurium
  target_phenotypes:

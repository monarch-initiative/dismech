        explanation: Vascular bacterial counts and permeability increased under greater stretch; this does not establish increased apical bacterial growth.
    evidence:
    - reference: PMID:41252215
      reference_title: Mechanical strain exacerbates Pseudomonas infection in an organoid-based pneumonia-on-a-chip model.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: We hereby present what we believe to be the first functional Pseudomonas POC and VAP-on-a-chip model that replicates key features of disease, including enhanced mechanical strain.

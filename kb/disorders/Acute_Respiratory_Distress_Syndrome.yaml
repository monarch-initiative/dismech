  modeled_mechanisms:
  - target: Ventilator-Induced Lung Injury
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: Increasing chip strain raised baseline apparent permeability slightly and, after infection, increased vascular bacterial counts and permeability. This demonstrates a mechanical-infectious interaction in this cell system without establishing the size of a clinical ventilation effect.
    limitations: The uniform chip deformation does not reproduce regional overdistension and recruitment-derecruitment in an injured lung. There are no seeded immune cells. Infection outcomes were assessed at 12 hours; baseline permeability was measured before infection. The organoid system is not a clinical ARDS cohort.
    readouts:
    - name: Apparent permeability under hyperphysiological versus physiological strain
      target: Ventilator-Induced Lung Injury
      direction: INCREASED
      interpretation: Strain-dependent permeability increase is the barrier readout for stretch injury.
      evidence:
      - reference: PMID:41252215
        reference_title: Mechanical strain exacerbates Pseudomonas infection in an organoid-based pneumonia-on-a-chip model.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: Yet, Papp was slightly increased in 10% stretched ODAECs, suggesting barrier impairment by hyperphysiological stretch.
        explanation: The source describes the baseline permeability increase as slight.
        directness: DIRECT
        quote_role: PRIMARY_RESULT
    - name: Bacterial translocation to the vascular channel under increased strain
      target: Ventilator-Induced Lung Injury
      direction: INCREASED
      interpretation: Higher vascular-channel colony counts under greater strain quantify the strain-infection interaction.
      evidence:
      - reference: PMID:41252215
        reference_title: Mechanical strain exacerbates Pseudomonas infection in an organoid-based pneumonia-on-a-chip model.
        supports: SUPPORT
        evidence_source: IN_VITRO
        quote_role: PRIMARY_RESULT
        directness: DIRECT
        snippet: CFUs in the vascular channel and Papp were higher in 10% compared with 5% stretched ODAEC chips (Figure 1, H and I, and Supplemental Figure 4, A and B), indicating that mechanical strain exacerbates Pseudomonas infection in the alveolus.
        explanation: Vascular bacterial counts and permeability increased under greater stretch; this does not establish increased apical bacterial growth.
    evidence:

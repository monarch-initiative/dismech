      heterogeneous syndrome.
- name: Lung-Protective Low-Tidal-Volume Mechanical Ventilation
  description: >-
    For invasively ventilated ARDS, use low tidal volumes based on predicted
    body weight and limit plateau pressure to reduce ventilator-induced stretch
    injury. The pivotal trial compared an initial 6 mL/kg predicted body weight
    and plateau pressure at or below 30 cm H2O with traditional larger volumes.
  treatment_term:
    preferred_term: mechanical ventilation
    term:
      id: NCIT:C70909
      label: Mechanical Ventilation
  target_phenotypes:

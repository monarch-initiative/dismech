- name: Alveolar-Capillary Barrier Disruption
  biological_scale: TISSUE
  description: Increased endothelial and epithelial permeability permits protein-rich fluid to cross into the interstitium and alveoli. Functional junctional changes can occur without endothelial cell death or dramatic endothelial morphological damage. Reduced epithelial fluid transport is represented separately.
  role: mediator
  evidence:

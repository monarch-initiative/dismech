- name: Adult higher PEEP without prolonged recruitment
  description: Conditional recommendation for higher PEEP without recruitment maneuvers in moderate-to-severe adult ARDS. Prolonged recruitment (PEEP ≥35 cm H2O for >60 seconds) is strongly discouraged. Titrate with respiratory and hemodynamic monitoring; mild ARDS does not inherit this recommendation. ESICM found insufficient evidence to recommend routine higher versus lower PEEP/FiO2 titration for mortality across all ARDS. The ATS conditional recommendation is restricted to moderate-to-severe disease.
  treatment_term:
    preferred_term: mechanical ventilation
    term:
      id: NCIT:C70909
      label: Mechanical Ventilation

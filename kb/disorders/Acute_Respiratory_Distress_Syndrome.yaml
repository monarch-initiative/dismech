- name: Ventilator-Induced Lung Injury
  conforms_to: "alveolar_capillary_barrier_failure#Cyclic Mechanical Strain Amplification"
  description: >-
    Positive-pressure ventilation can amplify established ARDS through
    overdistension, cyclic opening and closing, and patient-ventilator
    dyssynchrony. Lung-protective tidal volumes and, in selected early severe
    disease, neuromuscular blockade limit this iatrogenic stretch-injury loop.
  role: modifier
  locations:
  - preferred_term: Alveolus of lung
    term:
      id: UBERON:0002299
      label: alveolus of lung
  downstream:
  - target: Alveolar-Capillary Barrier Disruption
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    hypothesis_groups:
    - alveolar_capillary_injury_model
    description: >-
      Excessive mechanical stress adds epithelial and endothelial injury to the
      pre-existing inflammatory permeability lesion.
    evidence:
    - reference: PMID:10793162
      reference_title: Ventilation with lower tidal volumes as compared with traditional tidal volumes for acute lung injury and the acute respiratory distress syndrome.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Traditional approaches to mechanical ventilation use tidal volumes of
        10 to 15 ml per kilogram of body weight and may cause stretch-induced
        lung injury in patients with acute lung injury and the acute respiratory
        distress syndrome.
      explanation: >-
        The hedged ARMA trial rationale supports large-tidal-volume ventilation
        as a contributor to stretch-induced injury; PARTIAL avoids treating the
        background statement as definitive causal proof.
  evidence:
  - reference: PMID:38032683
    reference_title: "An Update on Management of Adult Patients with Acute Respiratory Distress Syndrome: An Official American Thoracic Society Clinical Practice Guideline."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      NMBAs are a commonly used adjunctive therapy for patients with ARDS (16,

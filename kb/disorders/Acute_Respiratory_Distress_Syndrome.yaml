      strain.
    readouts:
    - name: IL-6 and IL-8 release under greater strain
      direction: DECREASED
      interpretation: Lower cytokine levels at 10% than at 5% strain prevent interpreting barrier injury as uniformly stronger inflammatory output.
      evidence:
      - reference: PMID:41252215
        reference_title: Mechanical strain exacerbates Pseudomonas infection in an organoid-based pneumonia-on-a-chip model.
        supports: SUPPORT
        evidence_source: IN_VITRO

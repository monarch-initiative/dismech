    directness: DIRECT
    snippet: Increased alveolar–capillary permeability to fluid, proteins, neutrophils and red blood cells (resulting in their accumulation into the alveolar space) is the hallmark of ARDS36–38.
    explanation: Permeability to fluid and protein is the defining functional barrier abnormality.
  - reference: PMID:30872586

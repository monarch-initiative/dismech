      child-specific form and describes its distinct evidence base.
- name: Hyperinflammatory ARDS subphenotype
  classification: biological_subphenotype
  description: >-
    A latent-class-analysis phenotype enriched for inflammatory biomarkers,
    vasopressor use, metabolic acidosis, fewer ventilator-free days, and higher
    mortality. This is a research subphenotype rather than part of the clinical
    ARDS definition or a validated bedside diagnosis.
  review_notes: >-
    Prospective point-of-care validation and evidence that this phenotype is
    specific to ARDS rather than critical illness or sepsis remain necessary.
  evidence:
  - reference: PMID:37487152
    reference_title: A New Global Definition of Acute Respiratory Distress Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Last, developments in ARDS subphenotyping, specifically latent class
      analysis–based hyper- and hypo-inflammatory phenotypes based on plasma
      biomarkers and clinical data, were not integrated into the current
      definition (33, 72–78).
    explanation: >-
      The global consensus document recognizes these reproducible research
      phenotypes but explicitly excludes them from the clinical definition.
  - reference: PMID:42432720
    reference_title: "Immunometabolic reprogramming and mitochondrial dysfunction in acute respiratory distress syndrome: mechanisms, metabolic resilience, and therapeutic perspectives- a narrative review."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Clinical phenotyping studies have identified a hyperinflammatory ARDS
      subphenotype characterized by markedly elevated inflammatory biomarkers,
      greater vasopressor use, metabolic acidosis, fewer ventilator-free days,
      and substantially higher mortality compared with hypo inflammatory
      phenotypes [9].
    explanation: >-
      The narrative review describes the clinical and biomarker enrichment of
      the hyperinflammatory phenotype; PARTIAL preserves its secondary and
      investigational status.
- name: Hypoinflammatory ARDS subphenotype
  classification: biological_subphenotype
  description: >-
    A lower-inflammatory latent-class-analysis phenotype used in retrospective
    research stratification. A proposed metabolically exhausted state with
    reduced mitochondrial reserve is emerging and should not be treated as an
    established mechanism or a validated bedside diagnosis.
  review_notes: >-
    Prospective point-of-care validation and longitudinal stability of the
    phenotype are not established.
  evidence:
  - reference: PMID:37487152
    reference_title: A New Global Definition of Acute Respiratory Distress Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Although these phenotypes have been demonstrated across multiple clinical
      trial populations and observational cohorts (79), prospective validation
      with point-of-care biomarker platforms is needed to determine if these
      phenotypes are unique to ARDS or have broader applicability to sepsis, and
      how they may affect management.
    explanation: >-
      The consensus document supports cross-cohort reproducibility while
      retaining the unresolved specificity, validation, and management gaps.
  - reference: PMID:42432720
    reference_title: "Immunometabolic reprogramming and mitochondrial dysfunction in acute respiratory distress syndrome: mechanisms, metabolic resilience, and therapeutic perspectives- a narrative review."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      In contrast, hypo inflammatory phenotypes may represent states of
      metabolic exhaustion with reduced mitochondrial reserve capacity and
      impaired ability to sustain reparative responses [9, 37].
    explanation: >-
      The review proposes a metabolic interpretation of the hypoinflammatory
      phenotype; the hedged wording and secondary evidence warrant PARTIAL.
mechanistic_hypotheses:
- hypothesis_group_id: alveolar_capillary_injury_model
  hypothesis_label: Alveolar-Capillary Permeability Injury Model
  status: CANONICAL
  description: >-
    A direct pulmonary or indirect systemic insult initiates dysregulated innate
    inflammation and coagulation. Macrophage activation and recruited
    neutrophils injure the alveolar epithelium and pulmonary endothelium,
    increasing barrier permeability. Protein-rich edema, loss of aerated lung,
    and atelectasis then produce shunt physiology, reduced compliance, and
    hypoxemic respiratory failure.
  evidence:
  - reference: PMID:37487152
    reference_title: A New Global Definition of Acute Respiratory Distress Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      ARDS is an acute, diffuse, inflammatory lung injury precipitated by a risk
      factor such as pneumonia, nonpulmonary infection, trauma, transfusion,
      burn, aspiration, or shock. The resulting injury leads to pulmonary edema
      from an increase in pulmonary vascular and alveolar epithelial
      permeability.
    explanation: >-
      The global consensus definition states the canonical
      insult-to-barrier-leak framework used by the main causal graph.
- hypothesis_group_id: immunometabolic_resilience_model
  hypothesis_label: Immunometabolic Persistence and Metabolic Resilience Model
  status: EMERGING
  description: >-
    Sustained glycolytic programming, impaired mitochondrial oxidative
    phosphorylation, redox imbalance, and bioactive metabolite signaling in
    immune and structural lung cells may amplify inflammation and delay
    alveolar-capillary repair. The related concept of metabolic resilience
    proposes that recovery depends partly on restoring coordinated
    mitochondrial function, substrate use, and redox balance. These mechanisms
    may help explain clinical heterogeneity, but they are not yet validated as
    a diagnostic endotype or treatment-selection framework.
  evidence:
  - reference: PMID:42432720
    reference_title: "Immunometabolic reprogramming and mitochondrial dysfunction in acute respiratory distress syndrome: mechanisms, metabolic resilience, and therapeutic perspectives- a narrative review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Emerging evidence suggests that immunometabolic reprogramming,
      characterized by increased glycolysis, impaired mitochondrial oxidative
      phosphorylation, and altered metabolite signalling, plays a critical role
      in shaping immune-cell activation, inflammatory persistence, and tissue
      repair during critical illness.
    explanation: >-
      The issue's narrative review directly advances the immunometabolic model,
      while its wording and study design justify EMERGING rather than CANONICAL
      status.
  notes: >-
    Much of the pathway-level causality and therapeutic rationale is derived
    from experimental systems, sepsis extrapolation, or associative human
    multi-omics. No metabolism-targeted ARDS therapy or bedside
    metabolic-resilience assay has established prospective clinical utility.
progression:
- phase: Exudative inflammatory phase
  notes: >-
    The early injury phase features proinflammatory alveolar-macrophage
    activation, neutrophil recruitment, epithelial injury, endothelial
    activation, and permeability edema. Diffuse alveolar damage may occur but is
    not required for the clinical diagnosis.
  evidence:
  - reference: PMID:39866839
    reference_title: "Acute respiratory distress syndrome (ARDS): from mechanistic insights to therapeutic strategies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      During the exudative phase of ARDS, macrophages are activated by pathogens
      through pattern recognition receptors (PRRs), including Toll-like
      receptors (TLRs), leucine-rich repeat sequence receptors (NLRs),
      transmembrane C-type lectin receptors (CLRs), and retinoic acid-induced
      gene-like receptors (RLRs), which promote the transition of resident AM
      cells to the predominant proinflammatory phenotype.
    explanation: >-
      The review defines macrophage activation as a central feature of the
      exudative phase.
- phase: Reparative and proliferative phase
  notes: >-
    If injury control and clearance succeed, pulmonary alveolar type 2 cells
    proliferate and macrophage programs shift toward inflammation resolution,
    epithelial regeneration, edema clearance, and structural repair.
  evidence:
  - reference: PMID:39866839
    reference_title: "Acute respiratory distress syndrome (ARDS): from mechanistic insights to therapeutic strategies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In the late stage of ARDS, anti-inflammatory cytokines secreted by
      selectively activated macrophages inhibit the inflammatory response,
      thereby promoting epithelial regeneration and alveolar structural
      remodeling.
    explanation: >-
      The review describes the macrophage and epithelial transition toward
      repair and remodeling.
- phase: Persistent fibroproliferative or fibrotic phase
  notes: >-
    In a subset with nonresolving injury, aberrant remodeling progresses to
    traction bronchiectasis, reduced lung volume, and fibrotic structural
    change, prolonging ventilatory and functional impairment.
  evidence:
  - reference: PMID:39866839
    reference_title: "Acute respiratory distress syndrome (ARDS): from mechanistic insights to therapeutic strategies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      By the time fibrosis occurs, in addition to traction bronchiectasis, large
      grid-like and small cystic changes may be observed in the lungs.
    explanation: >-
      The review describes the radiologic structural changes of the fibrotic
      phase; the entry limits this course to a subset rather than implying that
      all ARDS becomes fibrotic.

    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: All patients less than 18 years old without active perinatal lung disease should be diagnosed with PARDS using PALICC-2 criteria.
    explanation: PALICC-2 specifies pediatric scope and exclusions.
- name: Hyperinflammatory ARDS subphenotype
  classification: biological_subphenotype
  description: A latent-class-analysis phenotype enriched for inflammatory biomarkers, vasopressor use, metabolic acidosis, fewer ventilator-free days, and higher mortality. This is a research subphenotype rather than part of the clinical ARDS definition or a validated bedside diagnosis.
  review_notes: Derived research classes are not diagnostic criteria or prospectively validated treatment-selection rules. No single clinical variable identifies a class.
  evidence:
  - reference: PMID:24853585
    reference_title: 'Subphenotypes in acute respiratory distress syndrome: latent class analysis of data from two randomised controlled trials.'
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: 'FINDINGS: We analysed data for 1022 patients: 473 in the ARMA cohort and 549 in the ALVEOLI cohort.'
    explanation: Latent-class modeling was applied to 473 lower-tidal-volume ARMA participants and 549 ALVEOLI participants; this is retrospective research stratification.
  - reference: PMID:24853585
    reference_title: 'Subphenotypes in acute respiratory distress syndrome: latent class analysis of data from two randomised controlled trials.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: It is important to emphasize that while the interactions identified between PEEP and clinical outcomes are potentially provocative, we are reticent to make any recommendations for clinical care on the basis of a subgroup analysis.
    explanation: The investigators explicitly treat subgroup treatment findings as hypothesis-generating.
- name: Hypoinflammatory ARDS subphenotype
  classification: biological_subphenotype
  description: A research latent-class group with less systemic inflammation and shock than the hyperinflammatory group. Lower biomarker concentrations do not establish mitochondrial exhaustion, a uniform molecular mechanism, or a bedside treatment indication.

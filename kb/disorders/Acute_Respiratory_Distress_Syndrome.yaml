- name: clinicaltrials:NCT00281268
  description: FACTT compared conservative and liberal fluid strategies for seven days in 1000 patients with acute lung injury. Ventilator-free days and lung physiology improved with conservative management, without a statistically significant 60-day mortality difference.
  evidence:
  - reference: PMID:16714767
    reference_title: Comparison of two fluid-management strategies in acute lung injury.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: In a randomized study, we compared a conservative and a liberal strategy of fluid management using explicit protocols applied for seven days in 1000 patients with acute lung injury.
    explanation: The primary trial defines the randomized comparison.
  - reference: PMID:16714767
    reference_title: Comparison of two fluid-management strategies in acute lung injury.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Although there was no significant difference in the primary outcome of 60-day mortality, the conservative strategy of fluid management improved lung function and shortened the duration of mechanical ventilation and intensive care without increasing nonpulmonary-organ failures.
    explanation: Efficacy is tied to the published endpoints.

inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    LMPHM6 is inherited in an autosomal recessive manner; affected individuals
    carry biallelic (homozygous or compound heterozygous) loss-of-function PIEZO1
    variants that co-segregate with disease in reported families. Heterozygous
    carriers are unaffected by the lymphatic phenotype. A pedigree may
    nonetheless look dominant: in family GLD08 a homozygous I2270T genotype
    segregating through consanguinity produced affected individuals in
    consecutive generations (the proband and his father), a pseudo-dominant
    pattern that should not be mistaken for a dominant PIEZO1 disorder.
  evidence:
  - reference: PMID:26333996
    reference_title: Novel mutations in PIEZO1 cause an autosomal recessive generalized lymphatic dysplasia with non-immune hydrops fetalis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we report homozygous and compound heterozygous mutations in PIEZO1,
      resulting in an autosomal recessive form of GLD with a high incidence of
      non-immune hydrops fetalis and childhood onset of facial and four limb
      lymphoedema.
    explanation: >-
      Homozygous and compound heterozygous PIEZO1 genotypes establish autosomal
      recessive inheritance for LMPHM6.
  - reference: PMID:26387913
    reference_title: Impaired PIEZO1 function in patients with a novel autosomal recessive congenital lymphatic dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Through whole-exome sequencing, we identify biallelic mutations in PIEZO1 (a
      splicing variant leading to early truncation and a non-synonymous missense
      variant) in a pair of siblings affected with persistent lymphoedema caused
      by congenital lymphatic dysplasia.
    explanation: >-
      Independently confirms biallelic (compound heterozygous) PIEZO1 inheritance
      in an affected sibship.
  - reference: PMID:40792030
    reference_title: PIEZO1 mechanical insensitivity in generalized lymphatic dysplasia with the potential for pharmacological rescue.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In GLD08, homozygosity of a single variant encoding Ile2270Thr (I2270T)
      associated with disease in 3 family members
    explanation: >-
      A single homozygous PIEZO1 variant accounts for disease in three members of
      one consanguineous family, the genotype underlying the apparently dominant
      vertical transmission in that pedigree.
  - reference: PMID:40792030
    reference_title: PIEZO1 mechanical insensitivity in generalized lymphatic dysplasia with the potential for pharmacological rescue.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      GLD08 I.2 is the proband’s father. His parents are not known to be
      consanguineous. He was diagnosed with spontaneous bilateral chylous
      effusions at the age of 30 years.
    explanation: >-
      Documents an affected parent and affected child in the same pedigree - the
      pseudo-dominant pattern that arises when a recessive allele is common in a
      consanguineous kindred.
pathophysiology:
- name: PIEZO1 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic nonsense, frameshift, splice-site, and missense variants in PIEZO1
    abolish or severely reduce the activity of a mechanically activated,
    calcium-permeable cation channel. Two mechanistically distinct routes to loss
    of function are documented: reduced or absent PIEZO1 protein (truncating and
    splice variants, shown by western blot to eliminate or reduce PIEZO1
    expression) and reduced channel mechanical sensitivity despite surface
    expression (cap and sub-cap missense variants that are mechanically
    insensitive yet partly rescuable with the chemical agonist Yoda1).
  genes:
  - preferred_term: PIEZO1
    term:
      id: hgnc:28993
      label: PIEZO1
  molecular_functions:
  - preferred_term: mechanically activated cation channel activity
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0008381
      label: mechanosensitive monoatomic ion channel activity
  evidence:
  - reference: PMID:26333996
    reference_title: Novel mutations in PIEZO1 cause an autosomal recessive generalized lymphatic dysplasia with non-immune hydrops fetalis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations in PIEZO1, which encodes a mechanically activated ion channel,
      have been reported with autosomal dominant dehydrated hereditary
      stomatocytosis and non-immune hydrops of unknown aetiology.
    explanation: >-
      Identifies PIEZO1 as a mechanically activated ion channel and the causal
      gene locus for this disorder.
  - reference: PMID:26333996
    reference_title: Novel mutations in PIEZO1 cause an autosomal recessive generalized lymphatic dysplasia with non-immune hydrops fetalis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No truncated PIEZO1 protein products were identified in western blot
      analysis in GLD1:II.3 and GLD2:II.2
    explanation: >-
      Direct protein-level demonstration that truncating alleles yield no stable
      PIEZO1 protein, i.e. loss of function.
  - reference: PMID:26387913
    reference_title: Impaired PIEZO1 function in patients with a novel autosomal recessive congenital lymphatic dysplasia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Patch-clamp analysis of the missense PIEZO1 channel in a heterologous system
      (a mammalian cell line derived from HEK293T cells) indicated strongly
      diminished current amplitudes as compared with wild type, likely due to
      reduced cell surface expression.
    explanation: >-
      Electrophysiological confirmation that the patient missense allele is
      hypomorphic/loss-of-function.
  - reference: PMID:40792030
    reference_title: PIEZO1 mechanical insensitivity in generalized lymphatic dysplasia with the potential for pharmacological rescue.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      PIEZO1 variants have been associated with generalized lymphatic dysplasia
      (GLD) through mechanisms involving reduced PIEZO1 expression. Here, we
      report variants where the mechanism involves reduced channel mechanical
      sensitivity.
    explanation: >-
      Establishes the second loss-of-function route: mechanical insensitivity of
      an expressed channel, distinct from reduced expression.
  downstream:
  - target: Impaired Lymphatic Endothelial Mechanotransduction
    causal_link_type: DIRECT
    description: >-
      Loss of PIEZO1 channel function removes the principal mechanosensor by which
      lymphatic endothelial cells convert flow and stretch into calcium influx.
- name: Impaired Lymphatic Endothelial Mechanotransduction
  biological_scale: CELLULAR
  description: >-
    PIEZO1 is abundantly expressed in lymphatic endothelial cells, where it
    transduces oscillatory shear stress and membrane stretch into calcium entry.
    Loss of PIEZO1 abrogates flow-induced calcium influx and the downstream
    ORAI1/KLF2/Notch transcriptional programme that drives lymphatic sprouting,
    and it removes the mechanical cue required for valve-forming cell behaviour.
  cell_types:
  - preferred_term: lymphatic endothelial cell
    term:
      id: CL:0002138
      label: endothelial cell of lymphatic vessel
  biological_processes:
  - preferred_term: cellular response to fluid shear stress
    modifier: DECREASED
    term:
      id: GO:0071498
      label: cellular response to fluid shear stress
  - preferred_term: response to mechanical stimulus
    modifier: DECREASED
    term:
      id: GO:0009612
      label: response to mechanical stimulus
  evidence:
  - reference: PMID:35701867
    reference_title: Piezo1-Regulated Mechanotransduction Controls Flow-Activated Lymphatic Expansion.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Piezo1 knockdown in cultured lymphatic endothelial cells inhibited the
      laminar flow-induced calcium influx
    explanation: >-
      Demonstrates that PIEZO1 is required for flow-induced calcium signalling in
      lymphatic endothelial cells.
  - reference: PMID:38747287
    reference_title: The mechanosensory channel PIEZO1 functions upstream of angiopoietin/TIE/FOXO1 signaling in lymphatic development.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Yoda1 rapidly triggered nuclear FOXO1 extrusion in WT mesenteries but not in
      Piezo1LEC–/– mesenteries, confirming the PIEZO1/FOXO1 axis in mesenteric
      lymphatics
    explanation: >-
      Ex vivo mouse mesenteric lymphatics lacking endothelial PIEZO1 fail to
      transduce channel activation into a downstream signalling response,
      demonstrating that PIEZO1 loss abolishes lymphatic endothelial
      mechanosignalling.
  downstream:
  - target: Disrupted ANGPT2-TIE-FOXO1 Signaling
    causal_link_type: DIRECT
    description: >-
      PIEZO1 activation is the upstream trigger for ANGPT2 exocytosis and TIE
      pathway engagement in lymphatic endothelial cells.
  - target: Defective Lymphatic Valve Formation and Lymphangiogenesis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Loss of flow-triggered mechanotransduction removes the signal driving
      valve-leaflet protrusion and flow-activated lymphatic sprouting.
- name: Disrupted ANGPT2-TIE-FOXO1 Signaling
  biological_scale: MOLECULAR
  description: >-
    PIEZO1 activation in lymphatic endothelial cells triggers rapid exocytosis of
    the TIE ligand ANGPT2, ADAM17-mediated ectodomain shedding of TIE1, increased
    TIE/PI3K/AKT signaling, and nuclear export of the transcription factor FOXO1.
    Loss of PIEZO1 function therefore silences a signaling network whose other
    members (ANGPT2, TIE1) are themselves mutated in primary lymphedema, providing
    a molecular bridge between channel function and lymphatic gene expression.
  biological_processes:
  - preferred_term: Tie signaling pathway
    modifier: DECREASED
    term:
      id: GO:0048014
      label: Tie signaling pathway
  - preferred_term: PI3K/AKT signal transduction
    modifier: DECREASED
    term:
      id: GO:0043491
      label: phosphatidylinositol 3-kinase/protein kinase B signal transduction
  - preferred_term: FOXO1 nuclear export
    modifier: DECREASED
    term:
      id: GO:0006611
      label: protein export from nucleus
  cell_types:
  - preferred_term: lymphatic endothelial cell
    term:
      id: CL:0002138
      label: endothelial cell of lymphatic vessel
  evidence:
  - reference: PMID:38747287
    reference_title: The mechanosensory channel PIEZO1 functions upstream of angiopoietin/TIE/FOXO1 signaling in lymphatic development.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      activation of the mechanosensory channel PIEZO1 in lymphatic endothelial
      cells (LECs) caused rapid exocytosis of the TIE ligand ANGPT2, ectodomain
      shedding of TIE1 by disintegrin and metalloproteinase domain-containing
      protein 17 (ADAM17), and increased TIE/PI3K/AKT signaling, followed by
      nuclear export of the transcription factor FOXO1
    explanation: >-
      Establishes the PIEZO1 to ANGPT2/TIE/PI3K-AKT/FOXO1 signaling axis in
      lymphatic endothelial cells.
  downstream:
  - target: Defective Lymphatic Valve Formation and Lymphangiogenesis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Loss of this transcriptional output contributes to defective lymphatic
      vessel and valve development.
- name: Defective Lymphatic Valve Formation and Lymphangiogenesis
  biological_scale: TISSUE
  description: >-
    Endothelial-specific Piezo1 deletion in mice dramatically reduces the number
    of lymphatic valves and impairs the collective cell migration, actin
    polymerization, and cell-cell junction remodeling that produce the valve
    leaflet, while lymphatic-specific deletion phenocopies the sprouting defects
    of Orai1 and Klf2 knockouts and postnatal deletion causes lymphatic
    regression. Lymphatic valves are essential for unidirectional lymph flow, so
    their loss renders the collecting lymphatics incompetent.
  cell_types:
  - preferred_term: lymphatic endothelial cell
    term:
      id: CL:0002138
      label: endothelial cell of lymphatic vessel
  biological_processes:
  - preferred_term: lymph vessel development
    modifier: DECREASED
    term:
      id: GO:0001945
      label: lymph vessel development
  - preferred_term: lymphangiogenesis
    modifier: DECREASED
    term:
      id: GO:0001946
      label: lymphangiogenesis
  - preferred_term: lymph vessel morphogenesis
    modifier: DECREASED
    term:
      id: GO:0036303
      label: lymph vessel morphogenesis
  evidence:
  - reference: PMID:30482854
    reference_title: Mechanically activated ion channel PIEZO1 is required for lymphatic valve formation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      we analyzed two mouse lines lacking PIEZO1 in endothelial cells (via Tie2Cre
      or Lyve1Cre) and found that they exhibited pleural effusion and died
      postnatally. Strikingly, the number of lymphatic valves was dramatically
      reduced in these mice.
    explanation: >-
      Endothelial Piezo1 loss reduces lymphatic valve number and reproduces
      pleural effusion in mice.
  - reference: PMID:30482854
    reference_title: Mechanically activated ion channel PIEZO1 is required for lymphatic valve formation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      the process of protrusion in the valve leaflets, which is associated with
      collective cell migration, actin polymerization, and remodeling of cell-cell
      junctions, was impaired in Tie2Cre;Piezo1cKO mice
    explanation: >-
      Identifies the specific cellular step of valve morphogenesis that requires
      PIEZO1.
  - reference: PMID:35701867
    reference_title: Piezo1-Regulated Mechanotransduction Controls Flow-Activated Lymphatic Expansion.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Lymphatic-specific conditional Piezo1 knockout largely phenocopied sprouting
      defects shown in Orai1- or Klf2- knockout lymphatics during embryo
      development. Postnatal deletion of Piezo1 induced lymphatic regression in
      adults.
    explanation: >-
      Shows PIEZO1 is required both for developmental lymphatic sprouting and for
      maintenance of adult lymphatics.
  - reference: PMID:37159433
    reference_title: Persistent chylothorax associated with lymphatic malformation type 6 due to biallelic pathogenic variants in PIEZO1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PIEZO1 is required for lymphatic valve formation, and several lymphatic
      abnormalities have been reported to be associated with autosomal recessive
      PIEZO1 pathogenic variants including neonatal hydrops, lymphedema involving
      various body regions, and chylothorax.
    explanation: >-
      Connects the valve-formation requirement to the human autosomal recessive
      PIEZO1 clinical spectrum.
  downstream:
  - target: Generalized Lymphatic Dysplasia and Lymph Transport Failure
    causal_link_type: DIRECT
    description: >-
      Incompetent, hypoplastic lymphatic collectors cannot clear interstitial
      fluid and chyle.
- name: Generalized Lymphatic Dysplasia and Lymph Transport Failure
  biological_scale: ORGANISM
  description: >-
    The resulting disorder is a uniform, widespread lymphatic dysplasia affecting
    all body segments, with systemic involvement of the thoracic, pericardial, and
    intestinal lymphatics. Lymphoscintigraphy in affected individuals shows a
    strikingly consistent and symmetric pattern of deep and superficial rerouting,
    indicating failure of superficial lymphatic collector function rather than
    simple aplasia.
  evidence:
  - reference: PMID:26333996
    reference_title: Novel mutations in PIEZO1 cause an autosomal recessive generalized lymphatic dysplasia with non-immune hydrops fetalis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Generalized lymphatic dysplasia (GLD) is a rare form of primary lymphoedema
      characterized by a uniform, widespread lymphoedema affecting all segments of
      the body, with systemic involvement such as intestinal and/or pulmonary
      lymphangiectasia, pleural effusions, chylothoraces and/or pericardial
      effusions.
    explanation: >-
      Defines the generalized, multi-compartment lymphatic dysplasia phenotype
      that PIEZO1 loss produces.
  - reference: PMID:26333996
    reference_title: Novel mutations in PIEZO1 cause an autosomal recessive generalized lymphatic dysplasia with non-immune hydrops fetalis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The rerouting suggests failure of superficial lymphatic collector function.
    explanation: >-
      Lymphoscintigraphic evidence that the functional lesion is collector
      failure, consistent with the valve defect.
  downstream:
  - target: Chylous Effusion and Fetal Fluid Accumulation
    causal_link_type: DIRECT
    description: >-
      Failure of thoracic and abdominal lymph drainage causes chyle and serous
      fluid to accumulate in body cavities, presenting in utero as hydrops.
  - target: Chronic Peripheral and Facial Lymphedema
    causal_link_type: DIRECT
    description: >-
      Failure of superficial collector function causes interstitial protein-rich
      fluid to accumulate in the limbs, face, and genitalia.
- name: Chylous Effusion and Fetal Fluid Accumulation
  biological_scale: ORGANISM
  description: >-
    In utero, lymphatic transport failure produces non-immune hydrops fetalis with
    pleural and pericardial effusions and ascites. This may be lethal in the
    perinatal period; in survivors the neonatal edema often resolves completely,
    but chylothorax may persist or recur.
  evidence:
  - reference: PMID:36453701
    reference_title: "Perinatal presentations of non-immune hydrops fetalis due to recessive PIEZO1 disease: A challenging fetal diagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One cause of NIHF is lymphatic malformation 6 (LMPHM6) due to biallelic
      loss-of-function (LoF) variants in PIEZO1.
    explanation: >-
      Directly attributes non-immune hydrops fetalis to biallelic loss-of-function
      PIEZO1 (LMPHM6).
  - reference: PMID:26333996
    reference_title: Novel mutations in PIEZO1 cause an autosomal recessive generalized lymphatic dysplasia with non-immune hydrops fetalis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      biallelic variants have a high incidence of NIHF (7 of the 10 affected
      cases). This may be lethal in the perinatal period (n=2).
    explanation: >-
      Quantifies the frequency and perinatal lethality of hydrops in the founding
      cohort.
- name: Chronic Peripheral and Facial Lymphedema
  biological_scale: ORGANISM
  description: >-
    Survivors typically re-present in childhood with lymphedema of the lower
    limbs, arms, face, and genitalia, with or without chylothoraces and intestinal
    lymphangiectasia. Recurrent severe facial cellulitis complicates the facial
    lymphedema and is a major source of morbidity.
  evidence:
  - reference: PMID:26333996
    reference_title: Novel mutations in PIEZO1 cause an autosomal recessive generalized lymphatic dysplasia with non-immune hydrops fetalis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Survivors may present later with lymphoedema of the peripheries (mainly
      lower limbs but also arms (n=4), face (n=3) and genitalia (n=1)), with or
      without chylothoraces (n=2) and intestinal lymphangiectasia (n=1).
    explanation: >-
      Documents the postnatal distribution of lymphedema and its systemic
      complications.
progression:
- phase: Prenatal and early-childhood onset
  age_range: Fetal to early childhood
  notes: >-
    The classically reported course: non-immune fetal hydrops detected in the
    second trimester, often resolving spontaneously after birth, followed by
    facial and four-limb lymphedema appearing in infancy or early childhood.
  evidence:
  - reference: PMID:26333996
    reference_title: Novel mutations in PIEZO1 cause an autosomal recessive generalized lymphatic dysplasia with non-immune hydrops fetalis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we report homozygous and compound heterozygous mutations in PIEZO1,
      resulting in an autosomal recessive form of GLD with a high incidence of
      non-immune hydrops fetalis and childhood onset of facial and four limb
      lymphoedema.
    explanation: >-
      Defines the prenatal-hydrops-then-childhood-lymphedema course of the
      founding cohort.
- phase: Adolescent and adult onset
  age_range: 11-30 years
  notes: >-
    A later-onset arm exists and is easily missed if LMPHM6 is treated as a
    uniformly congenital disorder. In family GLD08 (homozygous I2270T) there was
    no antenatal or neonatal disease at all; presentation began in adolescence
    with chylous pleural and pericardial effusions, with lower-limb and scrotal
    edema following years later and no facial edema. The affected father of that
    proband presented at 30 years.
  evidence:
  - reference: PMID:40792030
    reference_title: PIEZO1 mechanical insensitivity in generalized lymphatic dysplasia with the potential for pharmacological rescue.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      in GLD08, there was disease only from adolescence that was characterized
      first by pleural and pericardial effusions and then lower limb and scrotal
      edema without facial edema
    explanation: >-
      Directly states an adolescent-onset presentation with a different
      phenotype ordering from the congenital arm.
  - reference: PMID:40792030
    reference_title: PIEZO1 mechanical insensitivity in generalized lymphatic dysplasia with the potential for pharmacological rescue.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      From age 11 years he developed progressive breathlessness and reduced
      exercise tolerance and was found to have bilateral chylous pleural
      effusions
    explanation: >-
      Case-level detail of the adolescent onset in the GLD08 proband, whose
      antenatal and neonatal period was uneventful.

name: Lymphatic malformation 6
creation_date: "2026-08-18T00:00:00Z"
description: >-
  Lymphatic malformation 6 (LMPHM6; hereditary lymphedema type III), also known as
  generalized lymphatic dysplasia of Fotiou, is an autosomal recessive generalized
  lymphatic dysplasia caused by biallelic loss-of-function variants in PIEZO1,
  which encodes a mechanically activated, calcium-permeable cation channel. Loss
  of PIEZO1 mechanotransduction in lymphatic endothelial cells impairs lymphatic
  valve morphogenesis and flow-driven lymphatic sprouting, producing widespread
  lymphatic dysfunction. The condition most often presents prenatally as
  non-immune hydrops fetalis with pleural and pericardial effusions and ascites,
  which may be lethal in the perinatal period; survivors frequently have complete
  resolution of the neonatal edema and re-present in childhood with peripheral,
  facial, and genital lymphedema, with or without persistent chylothorax or
  intestinal lymphangiectasia. Recurrent severe facial cellulitis is a
  characteristic and serious complication. Unlike Hennekam syndrome, the
  dysmorphic features, seizures, and intellectual disability are absent. Because
  monoallelic gain-of-function PIEZO1 variants cause dehydrated hereditary
  stomatocytosis, affected individuals and carriers may show subtle red-cell
  abnormalities (stomatocytes, spherocytes) without clinically significant
  hemolysis. Management is supportive; no PIEZO1-directed disease-modifying
  therapy is approved, although pharmacological rescue of mechanically insensitive
  mutant channels with the PIEZO1 agonist Yoda1 has been demonstrated in vitro.
category: Mendelian
parents:
- lymphatic malformation
- hereditary disease
synonyms:
- LMPHM6
- generalized lymphatic dysplasia of Fotiou
- hereditary lymphedema type III
- LMPH3
- PIEZO1-related generalized lymphatic dysplasia with non-immune hydrops fetalis
- PIEZO1-related lymphatic-related hydrops fetalis

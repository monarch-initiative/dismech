name: Lymphatic malformation 6
creation_date: "2026-08-18T00:00:00Z"
description: >-
  Lymphatic malformation 6 (LMPHM6), also called generalized lymphatic dysplasia
  of Fotiou, is an autosomal recessive generalized lymphatic dysplasia caused by
  biallelic loss-of-function variants in PIEZO1. It presents with non-immune
  hydrops fetalis, chylothorax, pericardial effusion, intestinal
  lymphangiectasia, and persistent lymphedema.
category: Mendelian
parents:
- lymphatic malformation
- hereditary disease
synonyms:
- LMPHM6
- generalized lymphatic dysplasia of Fotiou
- PIEZO1-related generalized lymphatic dysplasia with non-immune hydrops fetalis
disease_term:
  preferred_term: lymphatic malformation 6
  term:
    id: MONDO:0014797
    label: lymphatic malformation 6
pathophysiology:
- name: PIEZO1 loss of function
  biological_scale: MOLECULAR
  description: >-
    Biallelic loss-of-function variants in PIEZO1 abolish mechanically activated
    cation channel function required for lymphatic vessel development.
phenotypes:
- category: Clinical
  name: Lymphedema
  description: Persistent lymphedema.

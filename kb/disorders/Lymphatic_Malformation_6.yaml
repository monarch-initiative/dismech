genetic:
- name: PIEZO1
  association: Causal biallelic loss-of-function variants
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: PIEZO1
    term:
      id: hgnc:28993
      label: PIEZO1
  evidence:
  - reference: PMID:26333996
    reference_title: Novel mutations in PIEZO1 cause an autosomal recessive generalized lymphatic dysplasia with non-immune hydrops fetalis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we report homozygous and compound heterozygous mutations in PIEZO1,
      resulting in an autosomal recessive form of GLD with a high incidence of
      non-immune hydrops fetalis and childhood onset of facial and four limb
      lymphoedema.
    explanation: >-
      Establishes PIEZO1 as the causal gene, with biallelic variants, for this
      form of generalized lymphatic dysplasia.
  - reference: PMID:26387913
    reference_title: Impaired PIEZO1 function in patients with a novel autosomal recessive congenital lymphatic dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our results delineate a novel clinical category of PIEZO1-associated
      hereditary lymphoedema.
    explanation: >-
      Independent contemporaneous report establishing PIEZO1-associated hereditary
      lymphedema as a distinct entity.
  - reference: PMID:37902181
    reference_title: PIEZO1 is the most common monogenic etiology of non-immune hydrops fetalis detected by prenatal exome sequencing.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PIEZO1 variants causing AR NIHF were characterized by loss of function and
      isolated NIHF phenotype.
    explanation: >-
      Confirms that the recessive (LMPHM6) mechanism is loss of function, in
      contrast to the dominant gain-of-function red-cell disease.
  variants:
  - name: p.Glu1630Ter (c.4888G>T)
    type: nonsense
    clinical_significance: PATHOGENIC
    description: >-
      Recurrent nonsense PIEZO1 allele observed in two unrelated families in the
      founding cohort; no truncated protein is detectable by western blot,
      consistent with a null allele.
    evidence:
    - reference: PMID:26333996
      reference_title: Novel mutations in PIEZO1 cause an autosomal recessive generalized lymphatic dysplasia with non-immune hydrops fetalis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        one of which was the nonsense mutation (c.G4888T; p.E1630X) also observed
        in family GLD1
      explanation: >-
        Identifies the recurrent nonsense allele shared between families.
  - name: c.3796+1G>A
    type: splice donor site
    clinical_significance: PATHOGENIC
    description: >-
      Canonical splice-donor variant causing skipping of exon 26 and a measurable
      reduction in PIEZO1 protein.
    evidence:
    - reference: PMID:26333996
      reference_title: Novel mutations in PIEZO1 cause an autosomal recessive generalized lymphatic dysplasia with non-immune hydrops fetalis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The c.3796+1G>A variant in GLD3 causes skipping of exon 26
      explanation: >-
        Establishes the splicing consequence of this allele.
    - reference: PMID:26333996
      reference_title: Novel mutations in PIEZO1 cause an autosomal recessive generalized lymphatic dysplasia with non-immune hydrops fetalis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Western blot results of the c.3796+1G>A variant in GLD3 showed a reduction
        in PIEZO1 expression levels
      explanation: >-
        Protein-level confirmation of reduced PIEZO1 expression for this allele.
  - name: p.Ser1721Trp (c.5162C>G)
    type: missense
    clinical_significance: PATHOGENIC
    description: >-
      Homozygous missense PIEZO1 variant reported as a cause of LMPHM6 in a family
      with three adverse pregnancy outcomes from non-immune fetal hydrops.
    evidence:
    - reference: PMID:35646098
      reference_title: A Novel Homozygous Missense Mutation of PIEZO1 Leading to Lymphatic Malformation-6 Identified in a Family With Three Adverse Pregnancy Outcomes due to Nonimmune Fetal Hydrops.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        we detected one rare and previously unobserved homozygous missense variant
        in PIEZO1 (c.5162C>G, p.Ser1721Trp) as a novel genetic cause of autosomal
        recessive LMPHM6, in a family with three adverse pregnancy outcomes due to
        nonimmune fetal hydrops
      explanation: >-
        A specific homozygous missense allele established as causal for LMPHM6.
  - name: p.Trp1287Ter (c.3860G>A)
    type: nonsense
    clinical_significance: LIKELY_PATHOGENIC
    description: >-
      Nonsense PIEZO1 allele reported in trans with a splice-acceptor deletion in a
      child with persistent chylothorax; both were classified as likely pathogenic.
    evidence:
    - reference: PMID:37159433
      reference_title: Persistent chylothorax associated with lymphatic malformation type 6 due to biallelic pathogenic variants in PIEZO1.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Genetic testing revealed two deleterious variants in PIEZO1:
        c.2330-2_2330-1del and c.3860G > A (p.Trp1287*), both of which were
        classified as likely pathogenic.
      explanation: >-
        Documents the biallelic genotype in a patient with persistent chylothorax.
  - name: p.Ile2270Thr (I2270T)
    type: missense
    description: >-
      Missense PIEZO1 allele reported homozygously in family GLD08 - the
      adolescent-onset pedigree - and in trans with E829V in GLD09. The reporting
      authors interpreted the GLD07-09 variants collectively as likely pathogenic
      or of uncertain significance, so no per-variant classification is asserted
      here; the functional work in the same paper shows reduced channel
      mechanical sensitivity rather than reduced expression.
    evidence:
    - reference: PMID:40792030
      reference_title: PIEZO1 mechanical insensitivity in generalized lymphatic dysplasia with the potential for pharmacological rescue.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In GLD08, homozygosity of a single variant encoding Ile2270Thr (I2270T)
        associated with disease in 3 family members
      explanation: >-
        Segregation of the homozygous missense allele with disease in three
        members of one family.
    - reference: PMID:40792030
      reference_title: PIEZO1 mechanical insensitivity in generalized lymphatic dysplasia with the potential for pharmacological rescue.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        PIEZO1 variants have been associated with generalized lymphatic dysplasia
        (GLD) through mechanisms involving reduced PIEZO1 expression. Here, we
        report variants where the mechanism involves reduced channel mechanical
        sensitivity.
      explanation: >-
        Establishes the loss-of-function mechanism for this class of variant as
        mechanical insensitivity of an expressed channel.
diagnosis:
- name: Molecular genetic testing of PIEZO1
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    Identification of biallelic pathogenic PIEZO1 variants, typically by exome or
    a primary-lymphedema/generalized-lymphatic-anomaly gene panel, confirms the
    diagnosis. In prenatal exome series, PIEZO1 is the single most frequently
    implicated gene in non-immune hydrops fetalis, so it should be prioritized
    when hydrops is otherwise unexplained.
  results: >-
    Biallelic (homozygous or compound heterozygous) loss-of-function PIEZO1
    variants confirm LMPHM6.
  evidence:
  - reference: PMID:37902181
    reference_title: PIEZO1 is the most common monogenic etiology of non-immune hydrops fetalis detected by prenatal exome sequencing.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PIEZO1 variants were reported in 10% of NIHF cases diagnosed by prenatal
      exome, making PIEZO1 the most common single gene reported in NIHF.
    explanation: >-
      Supports prioritizing PIEZO1 in the molecular workup of unexplained
      non-immune hydrops fetalis.
  - reference: PMID:26387913
    reference_title: Impaired PIEZO1 function in patients with a novel autosomal recessive congenital lymphatic dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Through whole-exome sequencing, we identify biallelic mutations in PIEZO1 (a
      splicing variant leading to early truncation and a non-synonymous missense
      variant) in a pair of siblings affected with persistent lymphoedema caused
      by congenital lymphatic dysplasia.
    explanation: >-
      Exome sequencing is the demonstrated route to molecular diagnosis in this
      disorder.
- name: Lymphoscintigraphy
  diagnosis_term:
    preferred_term: lymphoscintigraphy
    term:
      id: NCIT:C67262
      label: Lymphoscintigraphy
  description: >-
    Radionuclide lymphoscintigraphy demonstrates the functional lymphatic lesion,
    showing symmetric deep rerouting with popliteal nodal uptake and superficial
    rerouting through the skin, indicating failure of superficial lymphatic
    collector function rather than aplasia.
  results: >-
    Symmetric deep and superficial rerouting consistent with collector failure;
    lymphangiectasia with chylothorax may also be demonstrated.
  evidence:
  - reference: PMID:26333996
    reference_title: Novel mutations in PIEZO1 cause an autosomal recessive generalized lymphatic dysplasia with non-immune hydrops fetalis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the lower limbs, all the patients have deep rerouting as demonstrated by
      the popliteal lymph node uptake
    explanation: >-
      Describes the characteristic lymphoscintigraphic finding in affected
      individuals.
  - reference: PMID:37274623
    reference_title: Case report of generalized lymphatic dysplasia with PIEZO1 mutation and review of the literature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Lymphoscintigraphy showed lymphangiectasia with chylothorax.
    explanation: >-
      Independent case confirming the diagnostic utility of lymphoscintigraphy.
treatments:
- name: Dietary fat restriction and medium-chain triglyceride feeding
  description: >-
    Restriction of long-chain dietary fat, with medium-chain triglyceride
    substitution, reduces chyle production and thoracic-duct lymph flow and is
    first-line conservative management of chylothorax and enteric lymph loss in
    LMPHM6.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: dietary intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  target_mechanisms:
  - target: Chylous Effusion and Fetal Fluid Accumulation
    treatment_effect: MODULATES
    description: >-
      Reducing long-chain fat intake lowers chyle flow into the incompetent
      thoracic lymphatics, reducing effusion volume.
  evidence:
  - reference: PMID:37159433
    reference_title: Persistent chylothorax associated with lymphatic malformation type 6 due to biallelic pathogenic variants in PIEZO1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      She subsequently had recurrent pleural effusions involving both pleural
      cavities, which tended to improve with restriction of her fat intake, and,
      one occasion, subcutaneous octreotide.
    explanation: >-
      Documents clinical improvement of the recurrent effusions with dietary fat
      restriction in a molecularly confirmed LMPHM6 patient.
- name: Octreotide
  description: >-
    Subcutaneous octreotide, a somatostatin analogue that reduces splanchnic blood
    flow and lymph production, has been used as adjunctive therapy for refractory
    chylothorax in LMPHM6. Evidence is limited to single-patient experience.
  therapeutic_modality: PEPTIDE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: octreotide
      term:
        id: CHEBI:7726
        label: octreotide
  target_mechanisms:
  - target: Chylous Effusion and Fetal Fluid Accumulation
    treatment_effect: MODULATES
    description: >-
      Somatostatin-analogue reduction of lymph production decreases chyle
      accumulation in the pleural space.
  evidence:
  - reference: PMID:37159433
    reference_title: Persistent chylothorax associated with lymphatic malformation type 6 due to biallelic pathogenic variants in PIEZO1.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      She subsequently had recurrent pleural effusions involving both pleural
      cavities, which tended to improve with restriction of her fat intake, and,
      one occasion, subcutaneous octreotide.
    explanation: >-
      Single-patient use of subcutaneous octreotide alongside dietary fat
      restriction; the report does not isolate the octreotide effect, so support
      is partial.
- name: Lymphedema supportive care
  description: >-
    Complete decongestive therapy - compression garments or bandaging, manual
    lymphatic drainage, exercise, and meticulous skin care - is the mainstay of
    chronic lymphedema management, together with prompt antibiotic treatment of
    cellulitis, which is a major source of morbidity in this disorder.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: physical therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  target_mechanisms:
  - target: Chronic Peripheral and Facial Lymphedema
    treatment_effect: MODULATES
    description: >-
      Decongestive therapy mechanically compensates for failed lymphatic collector
      function.
  evidence:
  - reference: PMID:26333996
    reference_title: Novel mutations in PIEZO1 cause an autosomal recessive generalized lymphatic dysplasia with non-immune hydrops fetalis.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Four patients of our cohort had severe, recurrent facial cellulitis with
      significant morbidity (high pyrexia and frequent admission to intensive
      care).
    explanation: >-
      Establishes the clinical burden (recurrent severe cellulitis complicating
      lymphedema) that skin care and prompt antibiotic treatment address; the
      paper does not itself report a supportive-care trial, so support is partial.
- name: Genetic counseling
  description: >-
    Counseling covers autosomal recessive inheritance and the 25% sibling
    recurrence risk, carrier testing, and prenatal or preimplantation genetic
    testing options once the familial biallelic PIEZO1 genotype is known.
    Recurrent adverse pregnancy outcomes are a recognized presentation.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:35646098
    reference_title: A Novel Homozygous Missense Mutation of PIEZO1 Leading to Lymphatic Malformation-6 Identified in a Family With Three Adverse Pregnancy Outcomes due to Nonimmune Fetal Hydrops.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we detected one rare and previously unobserved homozygous missense variant
      in PIEZO1 (c.5162C>G, p.Ser1721Trp) as a novel genetic cause of autosomal
      recessive LMPHM6, in a family with three adverse pregnancy outcomes due to
      nonimmune fetal hydrops
    explanation: >-
      Recurrent pregnancy loss in a single family illustrates the recurrence risk
      that counseling and molecular diagnosis address.
- name: PIEZO1 agonism (investigational)
  description: >-
    The small-molecule PIEZO1 agonist Yoda1 partly rescues the mechanical
    sensitivity of mechanically insensitive LMPHM6 missense channels in vitro, and
    an analogue with improved potency has been synthesized. This is a preclinical,
    genotype-restricted concept - it cannot rescue null alleles, and systemic
    PIEZO1 activation would also act on erythrocytes and the blood vasculature. No
    PIEZO1-directed therapy is approved.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: PIEZO1 Loss of Function
    treatment_effect: RESTORES
    description: >-
      Chemical agonism partly restores mechanical activation of variant channels
      that are expressed but mechanically insensitive.
  evidence:
  - reference: PMID:40792030
    reference_title: PIEZO1 mechanical insensitivity in generalized lymphatic dysplasia with the potential for pharmacological rescue.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      Patch-clamp studies of the cap and sub-cap variant channels revealed
      abolished or reduced channel mechanical sensitivity with the possibility to
      activate the channels and partly rescue mechanical sensitivity by the small
      molecule Yoda1.
    explanation: >-
      In vitro pharmacological rescue of variant channels; no clinical evidence
      exists, so support for this as a treatment is partial.
  - reference: PMID:35701867
    reference_title: Piezo1-Regulated Mechanotransduction Controls Flow-Activated Lymphatic Expansion.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      we assessed a potential therapeutic value of Piezo1 activation in lymphatic
      regeneration and found that a Piezo1 agonist, Yoda1, effectively suppressed
      postsurgical lymphedema development.
    explanation: >-
      Mouse proof of concept that PIEZO1 agonism can reduce lymphedema; the model
      is acquired postsurgical lymphedema, not biallelic PIEZO1 disease.
- name: Pleurodesis and other interventional management of refractory chylous effusion
  description: >-
    Pleurodesis, thoracic-duct ligation, and pleuro-peritoneal shunting are the
    standard escalation options when chylous pleural effusion recurs despite
    dietary fat restriction and octreotide. In LMPHM6 they are documented as
    used, not as effective: in the one reported adolescent-onset family, effusion
    control proved very difficult despite all three, and the proband's father had
    persistent effusions and a restrictive lung defect after pleurodesis. No
    LMPHM6-specific response rate has been established for any of these
    procedures, and none targets the underlying lymphatic mechanism.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: therapeutic procedure
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  target_mechanisms:
  - target: Chylous Effusion and Fetal Fluid Accumulation
    treatment_effect: MODULATES
    description: >-
      Obliterating the pleural space or diverting/interrupting thoracic-duct flow
      limits accumulation of chyle in the pleural cavity; the incompetent
      lymphatic network itself is unaltered.
  evidence:
  - reference: PMID:40792030
    reference_title: PIEZO1 mechanical insensitivity in generalized lymphatic dysplasia with the potential for pharmacological rescue.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatment has proved very difficult and has involved pleurodesis, ligation
      of the thoracic duct and pleuro-peritoneal shunting.
    explanation: >-
      Documents the interventional options actually used in a molecularly
      confirmed LMPHM6 patient, while explicitly recording that control was
      difficult - so this supports use, not efficacy.
  - reference: PMID:40792030
    reference_title: PIEZO1 mechanical insensitivity in generalized lymphatic dysplasia with the potential for pharmacological rescue.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Despite pleurodesis, his effusions are persistent resulting in a restrictive
      lung defect and nocturnal hypoventilation requiring non-invasive
      ventilation (NIV).
    explanation: >-
      A second affected individual in whom pleurodesis failed to control chylous
      effusion, recording the limits of the intervention.
animal_models:
- name: Endothelial Piezo1 conditional knockout mouse (Tie2Cre or Lyve1Cre)
  species: Mouse
  genotype: Piezo1 conditional knockout (Tie2Cre;Piezo1fl/fl or Lyve1Cre;Piezo1fl/fl)
  publication: PMID:30482854
  modeled_mechanisms:
  - target: Defective Lymphatic Valve Formation and Lymphangiogenesis
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Endothelial-specific Piezo1 deletion dramatically reduces lymphatic valve
      number and impairs valve-leaflet protrusion, and the mice develop pleural
      effusion - the murine counterpart of the human chylothorax/effusion
      phenotype.
    limitations: >-
      The mice die postnatally, so the chronic childhood-onset peripheral
      lymphedema of the human disorder cannot be assessed; conditional deletion is
      a complete null in the endothelium, whereas human alleles include hypomorphic
      missense variants with residual function.
    readouts:
    - name: Lymphatic valve number
      target: Defective Lymphatic Valve Formation and Lymphangiogenesis
      direction: DECREASED
      interpretation: >-
        Structural correlate of the valve-formation node in this model.
      evidence:
      - reference: PMID:30482854
        reference_title: Mechanically activated ion channel PIEZO1 is required for lymphatic valve formation.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Strikingly, the number of lymphatic valves was dramatically reduced in
          these mice.
        explanation: >-
          Reports the histological measurement behind this readout.
    evidence:
    - reference: PMID:30482854
      reference_title: Mechanically activated ion channel PIEZO1 is required for lymphatic valve formation.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Our analysis provides evidence that mechanically activated ion channel
        PIEZO1 is a key regulator of lymphatic valve formation.
      explanation: >-
        Supports treating this model as informative for the valve-formation node.
- name: Lymphatic-specific Piezo1 conditional knockout mouse
  species: Mouse
  genotype: Lymphatic endothelial-specific conditional Piezo1 knockout; postnatal inducible deletion
  publication: PMID:35701867
  modeled_mechanisms:
  - target: Impaired Lymphatic Endothelial Mechanotransduction
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Loss of Piezo1 in lymphatic endothelium abolishes flow-induced calcium
      influx and the ORAI1/KLF2/Notch programme, phenocopying Orai1 and Klf2
      knockout sprouting defects; postnatal deletion causes lymphatic regression.
    limitations: >-
      Mechanistic dissection relies on knockdown in cultured lymphatic endothelial
      cells and on conditional nulls, whereas human LMPHM6 alleles are germline and
      often hypomorphic; the therapeutic Yoda1 arm was tested in acquired
      postsurgical lymphedema rather than in a Piezo1-mutant background.
    readouts:
    - name: Flow-induced calcium influx in lymphatic endothelial cells
      target: Impaired Lymphatic Endothelial Mechanotransduction
      direction: DECREASED
      interpretation: >-
        Functional correlate of the mechanotransduction node.
      evidence:
      - reference: PMID:35701867
        reference_title: Piezo1-Regulated Mechanotransduction Controls Flow-Activated Lymphatic Expansion.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Piezo1 knockdown in cultured lymphatic endothelial cells inhibited the
          laminar flow-induced calcium influx
        explanation: >-
          Reports the calcium-imaging measurement behind this readout.
    evidence:
    - reference: PMID:35701867
      reference_title: Piezo1-Regulated Mechanotransduction Controls Flow-Activated Lymphatic Expansion.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Piezo1 is an upstream mechanosensor for the lymphatic mechanotransduction
        pathway and regulates lymphatic growth in response to external physical
        stimuli.
      explanation: >-
        Supports treating this model as informative for the mechanotransduction
        node.
differential_diagnoses:
- name: Hennekam lymphangiectasia-lymphedema syndrome 1
  disease_term:
    preferred_term: Hennekam lymphangiectasia-lymphedema syndrome 1
    term:
      id: MONDO:0009337
      label: Hennekam lymphangiectasia-lymphedema syndrome 1
  description: >-
    The other major autosomal recessive generalized lymphatic dysplasia. Hennekam
    syndrome is distinguished by characteristic facial dysmorphism (periorbital
    edema, retrognathia, flat facial profile, gingival hypertrophy, microstomia),
    seizures, and intellectual disability, none of which occur in LMPHM6.
  evidence:
  - reference: PMID:26333996
    reference_title: Novel mutations in PIEZO1 cause an autosomal recessive generalized lymphatic dysplasia with non-immune hydrops fetalis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The phenotype is distinct from Hennekam syndrome as none of our GLD patients
      had the dysmorphic features associated with HS, nor the learning
      disabilities or seizures, nor was the swelling severe
    explanation: >-
      States the clinical basis for separating LMPHM6 from Hennekam syndrome.
- name: Dehydrated hereditary stomatocytosis
  disease_term:
    preferred_term: dehydrated hereditary stomatocytosis
    term:
      id: MONDO:0008689
      label: dehydrated hereditary stomatocytosis with or without pseudohyperkalemia and/or perinatal edema
  description: >-
    The allelic autosomal dominant disorder caused by monoallelic gain-of-function
    PIEZO1 variants, presenting with mild-to-moderate hemolytic anemia,
    pseudohyperkalemia, and transient perinatal edema. The mechanism is opposite in
    direction (gain versus loss of channel function), and the two entities overlap
    only in the perinatal-edema phenotype.
  evidence:
  - reference: PMID:37902181
    reference_title: PIEZO1 is the most common monogenic etiology of non-immune hydrops fetalis detected by prenatal exome sequencing.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PIEZO1 variants causing AD NIHF were characterized by gain of function in
      red blood cells, scarcity in databases, and sporadic inheritance.
    explanation: >-
      Contrasts the dominant gain-of-function red-cell mechanism with the recessive
      loss-of-function lymphatic mechanism of LMPHM6.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No disease-specific prevalence or incidence estimate exists. The founding
    cohort comprised 10 affected individuals from 6 families, and subsequent
    reports have been single families or small series. A widely quoted figure of
    approximately 1 in 6,000 for generalized lymphatic dysplasia should not be
    used as an LMPHM6 prevalence, as its denominator and molecular ascertainment
    are not disease-specific.
  evidence:
  - reference: PMID:26333996
    reference_title: Novel mutations in PIEZO1 cause an autosomal recessive generalized lymphatic dysplasia with non-immune hydrops fetalis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In total, we identified 10 PIEZO1 variants in 6 families
    explanation: >-
      Supports the ultra-rare, literature-case-count basis for the occurrence
      estimate.
- population: Fetuses with non-immune hydrops undergoing prenatal exome sequencing
  measure_type: UNKNOWN
  prevalence_class: UNKNOWN
  notes: >-
    Not a population prevalence: this records the diagnostic yield of PIEZO1
    (both the recessive LMPHM6 and dominant gain-of-function forms) within an
    ascertained NIHF cohort - 19 of 191 cases, i.e. 10%.
  evidence:
  - reference: PMID:37902181
    reference_title: PIEZO1 is the most common monogenic etiology of non-immune hydrops fetalis detected by prenatal exome sequencing.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In total, 19 of 191 NIHF cases diagnosed by prenatal exome were attributed
      to PIEZO1.
    explanation: >-
      Quantifies the PIEZO1 contribution within an ascertained NIHF cohort.
notes: >-
  No GeneReviews chapter exists for lymphatic malformation 6 / PIEZO1-related
  generalized lymphatic dysplasia (PubMed searched 2026-08-18 for
  "(lymphedema[TI] OR lymphatic[TI]) AND GeneReviews[TI]" and for the disease
  name; the retrieved lymphatic GeneReviews chapters are Milroy disease (FLT4)
  and lymphedema-distichiasis syndrome (FOXC2), which are different disorders).
  MONDO:0014797 carries no textual definition, so disease identity was anchored on
  the OMIM:616843 and Orphanet:568062 xrefs and on the MONDO RO:0004003 causal-gene
  relationship to hgnc:28993 PIEZO1, verified with OAK. An Orphanet structured
  reference (ORPHA:568062) could not be cited because that record is absent from
  the committed references_cache and the Orphadata bulk refresh failed on a network
  error at curation time.

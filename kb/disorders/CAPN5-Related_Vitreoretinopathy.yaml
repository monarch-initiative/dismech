prevalence:
- population: Reported kindreds worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    ADNIV is extremely rare; the founding report described three kindreds,
    and fewer than a dozen distinct pathogenic-variant families have been
    published to date worldwide. No population-based prevalence or incidence
    study (Orphanet/GBD) was identified; pathogenic variants are essentially
    absent from population reference databases (gnomAD/1000 Genomes/dbSNP).
  evidence:
  - reference: PMID:23055945
    reference_title: Calpain-5 mutations cause autoimmune uveitis, retinal neovascularization, and photoreceptor degeneration.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified two different missense mutations in the CAPN5 gene in
      three ADNIV kindreds.
    explanation: >-
      Establishes the extreme rarity of ADNIV via the founding kindred
      count.

diagnosis:
- name: CAPN5 single-gene sequencing
  description: >-
    Single-gene CAPN5 sequencing (Sanger or targeted NGS), or inclusion of
    CAPN5 in inherited-retinal-dystrophy gene panels, is the recommended
    diagnostic approach in patients with atypical uveitis, atypical
    retinitis pigmentosa, or a family history of progressive
    vitreoretinopathy. Electroretinography (reduced/absent b-wave amplitude)
    is the characteristic early functional finding supporting the diagnosis.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  results: "Identification of a heterozygous pathogenic CAPN5 missense variant confirms the diagnosis."
  evidence:
  - reference: PMID:29040051
    reference_title: Two Novel CAPN5 Variants Associated with Mild and Severe Autosomal Dominant Neovascular Inflammatory Vitreoretinopathy Phenotypes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Next-generation sequencing identified that the patient was
      heterozygous for CAPN5 c.799G>A, p.(Gly267Ser).
    explanation: >-
      Demonstrates NGS-based CAPN5 sequencing as the diagnostic method that
      identified a novel pathogenic variant.

differential_diagnoses:
- name: Idiopathic non-infectious posterior uveitis
  distinguishing_features:
  - Family history of progressive vitreoretinopathy and CAPN5 genetic testing distinguish ADNIV from truly idiopathic uveitis
  - ADNIV additionally shows reduced ERG b-wave at presentation, not typical of isolated idiopathic uveitis
  evidence:
  - reference: PMID:23055945
    reference_title: Calpain-5 mutations cause autoimmune uveitis, retinal neovascularization, and photoreceptor degeneration.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Autosomal dominant neovascular inflammatory vitreoretinopathy (ADNIV)
      is an autoimmune condition of the eye that sequentially mimics
      uveitis, retinitis pigmentosa, and proliferative diabetic retinopathy
      as it progresses to complete blindness.
    explanation: >-
      States explicitly that ADNIV mimics idiopathic uveitis as its earliest
      presentation.
- name: Autosomal dominant retinitis pigmentosa
  distinguishing_features:
  - ADNIV shows pigment clumps rather than the classic bone-spicule pigmentation of typical retinitis pigmentosa
  - A preceding history of uveitis and subsequent neovascularization/fibrosis stages are not features of isolated ADRP
  evidence:
  - reference: PMID:32274441
    reference_title: Phenotypic variance in Calpain-5 retinal degeneration.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with pigmentary retinal dystrophy may consider CAPN5 gene
      testing.
    explanation: >-
      Recommends CAPN5 testing in patients presenting with a pigmentary
      retinal dystrophy phenotype that could otherwise be mistaken for ADRP.
- name: Familial exudative vitreoretinopathy
  distinguishing_features:
  - FEVR lacks the prominent chronic autoimmune uveitis and CD3+ T-cell infiltration characteristic of ADNIV
  - FEVR is caused by distinct Norrin/Wnt-pathway genes (FZD4, LRP5, TSPAN12, NDP), not CAPN5
  evidence:
  - reference: PMID:23861576
    reference_title: Lymphocyte infiltration in CAPN5 autosomal dominant neovascular inflammatory vitreoretinopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Chronic inflammatory CD3-positive cell infiltrates were identified
      throughout the uvea, vitreous and retina, consistent with chronic
      uveitis.
    explanation: >-
      Documents the CD3+ T-cell-mediated chronic uveitis that distinguishes
      ADNIV from the non-inflammatory vascular pathology of FEVR.

treatments:
- name: Corticosteroid Therapy
  description: >-
    Topical, periocular, intravitreal, or oral corticosteroids are the
    mainstay for controlling active intraocular inflammation, though the
    response is often incomplete and does not halt the degenerative
    component of disease.
  treatment_term:
    preferred_term: corticosteroid agent therapy
    term:
      id: NCIT:C15370
      label: Steroid Therapy
  evidence:
  - reference: PMID:23861576
    reference_title: Lymphocyte infiltration in CAPN5 autosomal dominant neovascular inflammatory vitreoretinopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations in CAPN5 trigger autoimmune uveitis characterized by
      inflammatory T-cells and severe neovascularization.
    explanation: >-
      Establishes the T-cell-mediated autoimmune uveitis that
      corticosteroid therapy targets.
- name: Anti-VEGF Therapy (Bevacizumab)
  description: >-
    Intravitreal bevacizumab, an anti-VEGF monoclonal antibody, was
    repositioned based on proteomic evidence of elevated vitreous VEGF and
    successfully mitigated neovascularization in CAPN5-NIV patients.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: bevacizumab
      term:
        id: NCIT:C2039
        label: Bevacizumab
  evidence:
  - reference: PMID:31110225
    reference_title: Proteomic insight into the pathogenesis of CAPN5-vitreoretinopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Based on this, we repositioned bevacizumab (anti-VEGF monoclonal
      antibody), intravitreal methotrexate (T-cell inhibi-
    explanation: >-
      Documents the proteomics-guided repositioning of bevacizumab as an
      anti-VEGF treatment for CAPN5-NIV neovascularization.
- name: Cryotherapy
  description: >-
    Ablative cryotherapy is used for peripheral retinal non-perfusion and to
    reduce the drive for neovascularization in the proliferative (Stage III)
    phase.
  treatment_term:
    preferred_term: Cryotherapy
    term:
      id: NCIT:C40030
      label: Cryotherapy
  evidence:
  - reference: PMID:29040051
    reference_title: Two Novel CAPN5 Variants Associated with Mild and Severe Autosomal Dominant Neovascular Inflammatory Vitreoretinopathy Phenotypes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      He had multiple cryotherapy treatments, left eye ruthenium plaque
      brachytherapy and underwent bilateral pars plana vitrectomies.
    explanation: >-
      Documents multiple cryotherapy treatments used to manage progressive
      vasoproliferative CAPN5-NIV disease.
- name: Ruthenium Plaque Brachytherapy
  description: >-
    Episcleral ruthenium plaque brachytherapy has been used unilaterally for
    progressive vasoproliferative disease in advanced CAPN5-NIV.
  treatment_term:
    preferred_term: Brachytherapy
    term:

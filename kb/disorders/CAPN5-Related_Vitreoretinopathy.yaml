  evidence:
  - reference: PMID:31110225
    reference_title: Proteomic insight into the pathogenesis of CAPN5-vitreoretinopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we observed a significant fraction of proteins localized to the
      synapse in controls that decreased in CAPN5-NIV vitreous. Among these
      proteins were: neurexin-2 (NRXN2), glutamate receptor 4 (GluR4),
      neurofascin (NFASC)
    explanation: >-
      Vitreous proteomics documents decreased synaptic proteins in
      CAPN5-NIV patients, consistent with aberrant calpain-mediated
      synaptic proteolysis, though the study could not attribute the losses
      to a specific retinal cell type.
  - reference: PMID:31110225
    reference_title: Proteomic insight into the pathogenesis of CAPN5-vitreoretinopathy.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, our proteomic analysis could not differentiate which retinal
      cells are affected by loss of these proteins in CAPN5-NIV
    explanation: >-
      Explicit caveat from the same proteomic study: the retinal cell
      type(s) losing these synaptic proteins could not be determined, so a
      photoreceptor-specific attribution is not established.
  - reference: PMID:25994508
    reference_title: "CAPN5 mutation in hereditary uveitis: the R243L mutation increases calpain catalytic activity and triggers intraocular inflammation in a mouse model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Electroretinography showed mutant mouse eyes had a selective loss of
      the b-wave indicating an inner-retina signaling defect.
    explanation: >-
      Mouse model evidence linking mutant CAPN5 expression to the reduced
      ERG b-wave, the earliest clinical/electrophysiological correlate of
      synaptic dysfunction.
  downstream:
  - target: Innate and Adaptive Autoimmune Uveitis

- name: Innate and Adaptive Autoimmune Uveitis
  description: >-
    Aberrant proteolysis and the resulting cellular stress may trigger
    local innate immune activation (Toll-like receptor pathway genes,
    chemokines, cytokines, complement components) accompanied by dense CD3+
    T-lymphocyte infiltration of the uvea, vitreous, and retina, driving
    chronic autoimmune uveitis; how the innate and adaptive arms interact
    in CAPN5-NIV pathogenesis remains under investigation. Vitreous
    TNF-alpha levels are normal, explaining why patients fail conventional
    anti-TNF immunosuppression (e.g. infliximab).
  role: central_effector
  locations:

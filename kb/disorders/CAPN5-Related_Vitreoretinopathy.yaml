      intraocular fibrosis, and features of phthisis bulbi.
    explanation: >-
      Human histopathology of a Stage V ADNIV eye documenting the terminal
      fibrotic/phthisical outcome.

mechanistic_hypotheses:
- hypothesis_group_id: canonical_gain_of_function_model
  hypothesis_label: Canonical Gain-of-Function Protease Hyperactivation Model
  status: CANONICAL
  description: >-
    ADNIV-causing CAPN5 variants act through gain-of-function protease
    hyperactivation and mislocalization rather than loss of normal calpain-5
    function. This is the predominant model, supported by Capn5 knockout mice
    lacking a retinal phenotype and by direct biochemical demonstration of
    increased calcium sensitivity and mislocalization in all tested disease
    variants.
  evidence:
  - reference: PMID:23055945
    reference_title: "Calpain-5 mutations cause autoimmune uveitis, retinal neovascularization, and photoreceptor degeneration."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Capn5 knockout mice have no observable phenotype
    explanation: >-
      Knockout mice lacking a phenotype argues against haploinsufficiency,
      supporting the gain-of-function model.
- hypothesis_group_id: refuted_haploinsufficiency_model
  hypothesis_label: Refuted Haploinsufficiency Model
  status: DEPRECATED
  description: >-
    An initially plausible alternative hypothesis was that ADNIV variants
    act through simple loss of calpain-5 function (haploinsufficiency),
    analogous to CAPN3 loss-of-function causing limb-girdle muscular
    dystrophy. The founding paper left the question open but judged gain of
    function more likely; the model is disfavored by the normal phenotype of
    Capn5-null mice and by subsequent in vitro data showing tested disease
    variants are catalytically hyperactive, not hypoactive.
  evidence:
  - reference: PMID:23055945
    reference_title: "Calpain-5 mutations cause autoimmune uveitis, retinal neovascularization, and photoreceptor degeneration."
    supports: REFUTE
    evidence_source: OTHER
    snippet: >-
      Although these mutations could cause disease through
      haploinsufficiency, it seems more likely that they result in a gain
      of function of calpain-5 that causes harm to the photoreceptor cells.
    explanation: >-
      The founding paper's own discussion weighs haploinsufficiency against
      gain of function and judges gain of function more likely; this is
      authors' reasoning rather than primary clinical data, and the paper
      does not definitively exclude a loss-of-function contribution.
  - reference: PMID:25994508
    reference_title: "CAPN5 mutation in hereditary uveitis: the R243L mutation increases calpain catalytic activity and triggers intraocular inflammation in a mouse model."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: >-
      In in vitro activity assays, the mutation increased calpain protease
      activity and made it far more active at low concentrations of calcium.
    explanation: >-
      Direct biochemical demonstration that the R243L disease variant is
      catalytically hyperactive, not hypoactive, arguing against the
      haploinsufficiency model.

phenotypes:
- category: Ophthalmologic
  name: Non-infectious posterior uveitis
  subtype: Classic
  description: >-
    Stage I disease presents as non-infectious posterior uveitis with
    vitreous cells and reduced ERG b-wave amplitude, clinically
    indistinguishable from idiopathic uveitis.
  phenotype_term:
    preferred_term: Uveitis
    term:
      id: HP:0000554
      label: Uveitis
    temporality: CHRONIC
  evidence:
  - reference: PMID:23055945
    reference_title: Calpain-5 mutations cause autoimmune uveitis, retinal neovascularization, and photoreceptor degeneration.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Autosomal dominant neovascular inflammatory vitreoretinopathy (ADNIV)
      is an autoimmune condition of the eye that sequentially mimics
      uveitis, retinitis pigmentosa, and proliferative diabetic retinopathy
      as it progresses to complete blindness.
    explanation: >-
      Establishes uveitis as the earliest clinical presentation in the
      canonical staged disease course.
- category: Ophthalmologic
  name: Abnormal electroretinogram
  subtype: Classic
  description: >-
    Reduced or absent ERG b-wave is often the earliest objective
    abnormality, reflecting an inner-retina synaptic signaling defect

prevalence:
- population: Reported kindreds worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    ADNIV is extremely rare; the founding report described three kindreds,
    and fewer than a dozen distinct pathogenic-variant families have been
    published to date worldwide. No population-based prevalence or incidence
    study (Orphanet/GBD) was identified. The variants reported in the
    founding kindreds were absent from dbSNP and 1000 Genomes, but
    later-reported variants appear at low allele frequencies in population
    reference databases: G267S at 0.023% (European) and 0.047% (Finnish) in
    ExAC, and G376S at 0.017% (South Asian) in ExAC -- the latter equating
    to a carrier rate of about 1 in 6,000 in that population, most of whom
    would be expected to have subclinical or differently diagnosed disease.
  evidence:
  - reference: PMID:23055945
    reference_title: Calpain-5 mutations cause autoimmune uveitis, retinal neovascularization, and photoreceptor degeneration.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified two different missense mutations in the CAPN5 gene in
      three ADNIV kindreds.
    explanation: >-
      Establishes the extreme rarity of ADNIV via the founding kindred
      count.
  - reference: PMID:23055945
    reference_title: Calpain-5 mutations cause autoimmune uveitis, retinal neovascularization, and photoreceptor degeneration.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      None of the three variants were listed in the dbSNP or 1000 Genome
      databases.
    explanation: >-
      Documents that the variants in the founding kindreds were absent from
      population reference databases; this absence claim is specific to
      those founding variants.
  - reference: PMID:29040051
    reference_title: Two Novel CAPN5 Variants Associated with Mild and Severe Autosomal Dominant Neovascular Inflammatory Vitreoretinopathy Phenotypes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This variant has been identified at an allele frequency of 0.023% and
      0.047% in European and Finnish populations respectively within the
      Exome Aggregate Consortium (ExAC) database
    explanation: >-
      Documents ExAC population allele frequencies for the G267S variant,
      showing later-reported pathogenic variants are present in population
      reference databases.
  - reference: PMID:29040051
    reference_title: Two Novel CAPN5 Variants Associated with Mild and Severe Autosomal Dominant Neovascular Inflammatory Vitreoretinopathy Phenotypes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The prevalence of 0.017% on the ExAc database would equate to a
      carrier rate of about 1 in 6,000 in the South Asian population, but it
      is likely that many of these patients would have subclinical disease,
      or other broad clinical diagnoses
    explanation: >-
      Source of the G376S carrier-rate estimate and its subclinical-disease
      caveat quoted in the notes.

diagnosis:
- name: CAPN5 single-gene sequencing
  description: >-
    Single-gene CAPN5 sequencing (Sanger or targeted NGS), or inclusion of
    CAPN5 in inherited-retinal-dystrophy gene panels, is the recommended
    diagnostic approach in patients with atypical uveitis, atypical
    retinitis pigmentosa, or a family history of progressive
    vitreoretinopathy. Electroretinography (reduced/absent b-wave amplitude)
    is the characteristic early functional finding supporting the diagnosis.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  results: "Identification of a heterozygous pathogenic CAPN5 missense variant confirms the diagnosis."
  evidence:
  - reference: PMID:29040051
    reference_title: Two Novel CAPN5 Variants Associated with Mild and Severe Autosomal Dominant Neovascular Inflammatory Vitreoretinopathy Phenotypes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Next-generation sequencing identified that the patient was
      heterozygous for CAPN5 c.799G>A, p.(Gly267Ser).
    explanation: >-
      Demonstrates NGS-based CAPN5 sequencing as the diagnostic method that
      identified a novel pathogenic variant.

differential_diagnoses:
- name: Idiopathic non-infectious posterior uveitis
  distinguishing_features:
  - Family history of progressive vitreoretinopathy and CAPN5 genetic testing distinguish ADNIV from truly idiopathic uveitis
  - ADNIV additionally shows reduced ERG b-wave at presentation, not typical of isolated idiopathic uveitis
  evidence:
  - reference: PMID:23055945
    reference_title: Calpain-5 mutations cause autoimmune uveitis, retinal neovascularization, and photoreceptor degeneration.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Autosomal dominant neovascular inflammatory vitreoretinopathy (ADNIV)
      is an autoimmune condition of the eye that sequentially mimics
      uveitis, retinitis pigmentosa, and proliferative diabetic retinopathy
      as it progresses to complete blindness.
    explanation: >-
      States explicitly that ADNIV mimics idiopathic uveitis as its earliest
      presentation.
- name: Autosomal dominant retinitis pigmentosa
  distinguishing_features:
  - ADNIV shows pigment clumps rather than the classic bone-spicule pigmentation of typical retinitis pigmentosa
  - A preceding history of uveitis and subsequent neovascularization/fibrosis stages are not features of isolated ADRP
  evidence:
  - reference: PMID:32274441
    reference_title: Phenotypic variance in Calpain-5 retinal degeneration.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with pigmentary retinal dystrophy may consider CAPN5 gene
      testing.
    explanation: >-
      Recommends CAPN5 testing in patients presenting with a pigmentary
      retinal dystrophy phenotype that could otherwise be mistaken for ADRP.
- name: Familial exudative vitreoretinopathy
  distinguishing_features:
  - FEVR lacks the prominent chronic autoimmune uveitis and CD3+ T-cell infiltration characteristic of ADNIV
  - A FEVR-like phenotype with negative genetic testing for the typical FEVR genes should prompt CAPN5 testing
  evidence:
  - reference: PMID:23861576
    reference_title: Lymphocyte infiltration in CAPN5 autosomal dominant neovascular inflammatory vitreoretinopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Chronic inflammatory CD3-positive cell infiltrates were identified
      throughout the uvea, vitreous and retina, consistent with chronic
      uveitis.
    explanation: >-
      Documents the CD3+ T-cell-mediated chronic uveitis that distinguishes
      ADNIV from the non-inflammatory vascular pathology of FEVR.
  - reference: PMID:29040051
    reference_title: Two Novel CAPN5 Variants Associated with Mild and Severe Autosomal Dominant Neovascular Inflammatory Vitreoretinopathy Phenotypes.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      This may also include patients who have a phenotype of familial
      exudative vitreoretinopathy (FEVR) in which genetic testing for the
      typical FEVR genes is negative.
    explanation: >-
      Authors' recommendation that FEVR-phenotype patients negative for the
      typical FEVR genes be considered for CAPN5 testing, supporting FEVR
      as a differential diagnosis.

treatments:
- name: Corticosteroid Therapy
  description: >-
    Corticosteroids are used to control active intraocular inflammation;
    intraocular steroids suppress inflammatory cells and neovascularization
    but not the retinal fibrosis or degenerative component of disease.
  treatment_term:
    preferred_term: corticosteroid agent therapy
    term:
      id: NCIT:C15370
      label: Steroid Therapy
  evidence:
  - reference: PMID:23861576
    reference_title: Lymphocyte infiltration in CAPN5 autosomal dominant neovascular inflammatory vitreoretinopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations in CAPN5 trigger autoimmune uveitis characterized by
      inflammatory T-cells and severe neovascularization.
    explanation: >-
      Establishes the T-cell-mediated autoimmune uveitis that
      corticosteroid therapy targets.
  - reference: PMID:29040051
    reference_title: Two Novel CAPN5 Variants Associated with Mild and Severe Autosomal Dominant Neovascular Inflammatory Vitreoretinopathy Phenotypes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This is supported by studies which found that intraocular steroids
      suppress inflammatory cells and neovascularisation but not retinal
      fibrosis or degeneration in ADNIV patients
    explanation: >-
      Directly supports the incomplete steroid response: inflammation and
      neovascularization are suppressed but the fibrotic/degenerative
      component is not.
- name: Anti-VEGF Therapy (Bevacizumab)
  description: >-
    Intravitreal bevacizumab, an anti-VEGF monoclonal antibody, was
    repositioned based on proteomic evidence of elevated vitreous VEGF and
    successfully mitigated neovascularization in CAPN5-NIV patients.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: bevacizumab
      term:
        id: NCIT:C2039
        label: Bevacizumab
  evidence:
  - reference: PMID:31110225
    reference_title: Proteomic insight into the pathogenesis of CAPN5-vitreoretinopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Based on this, we repositioned bevacizumab (anti-VEGF monoclonal
      antibody), intravitreal methotrexate (T-cell inhibi-tor), and
      tocilizumab (anti-IL-6 monoclonal antibody) and successfully mitigated
      neovascularization, inflamma-tory cell infiltration, and persistent
      fibrosis in these patients
    explanation: >-
      Documents the proteomics-guided repositioning of bevacizumab and its
      successful mitigation of neovascularization in CAPN5-NIV patients.
      (The quoted text preserves the source PDF's line-break hyphenation in
      "inhibi-tor" and "inflamma-tory".)
- name: Cryotherapy
  description: >-
    Retinal cryotherapy has been used in CAPN5-NIV: a severely affected
    patient with progressive vitreoretinopathy and recurrent vitreous
    hemorrhages received multiple cryotherapy treatments. Disease-specific
    indication and outcome data are limited to single-case experience.
  treatment_term:
    preferred_term: Cryotherapy
    term:
      id: NCIT:C40030
      label: Cryotherapy
  evidence:
  - reference: PMID:29040051
    reference_title: Two Novel CAPN5 Variants Associated with Mild and Severe Autosomal Dominant Neovascular Inflammatory Vitreoretinopathy Phenotypes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      He had multiple cryotherapy treatments, left eye ruthenium plaque
      brachytherapy and underwent bilateral pars plana vitrectomies.
    explanation: >-
      Documents multiple cryotherapy treatments used to manage progressive
      vasoproliferative CAPN5-NIV disease.

    label: CAPN5-related vitreoretinopathy
synonyms:
- Autosomal Dominant Neovascular Inflammatory Vitreoretinopathy
- ADNIV
- Neovascular Inflammatory Vitreoretinopathy
- NIV
- CAPN5-NIV
- VRNI

- Proliferative vitreoretinopathy

has_subtypes:
- name: Classic
  display_name: Classic Catalytic-Domain ADNIV (R243L/L244P/K250N/G267S)
  description: >-
    The originally described, most extensively studied form, caused by
    missense variants clustered in the catalytic protease core near the
    calcium-sensitive gating loop. Onset typically in the second to third
    decade, with relentless progression over roughly 40 years through the
    five classic ADNIV stages to blindness.
- name: Mild Regulatory-Domain
  display_name: Mild Regulatory-Domain Variant (G376S)
  description: >-
    A single reported variant (p.Gly376Ser) outside the catalytic domain, in
    the C2/regulatory domain. Presents as an incidental, non-progressive or
    slowly progressive peripheral pigmentary degeneration with preserved
    visual acuity, without uveitis or neovascularization.
- name: Syndromic Severe
  display_name: Syndromic Severe De Novo Variant (R289W)
  description: >-
    The most severe reported variant (p.Arg289Trp), showing the greatest
    calpain hyperactivation of any tested variant. Causes childhood-onset
    blindness by age five, accompanied by extraocular features not seen in
    other CAPN5 variants -- progressive sensorineural hearing loss and
    developmental delay.

inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    All reported pathogenic CAPN5 variants are heterozygous and autosomal
    dominant. Founding pedigrees showed complete penetrance, though
    later-identified mild, late-onset carriers (age 45 and 69) indicate
    penetrance and expressivity are more variable across the broader mutation
    spectrum than initially appreciated. The R289W syndromic variant arose
    de novo.
  evidence:
  - reference: PMID:23055945
    reference_title: Calpain-5 mutations cause autoimmune uveitis, retinal neovascularization, and photoreceptor degeneration.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified two different missense mutations in the CAPN5 gene in
      three ADNIV kindreds.
    explanation: >-
      Establishes the autosomal dominant, heterozygous missense basis of
      ADNIV in the founding kindreds.
  - reference: PMID:29472286
    reference_title: A novel de novo CAPN5 mutation in a patient with inflammatory vitreoretinopathy, hearing loss, and developmental delay.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe a pediatric patient with severe inflammatory
      vitreoretinopathy accompanied by hearing loss and developmental delay
      associated with a novel, de novo CAPN5 missense mutation
      (c.865C>T, p.Arg289Trp) that shows greater hyperactivation of the
      calpain protease
    explanation: >-
      Documents the de novo origin of the most severe reported CAPN5
      variant, confirming autosomal dominant transmission is not obligatory
      (new mutation can arise directly in the proband).

genetic:
- name: CAPN5
  gene_term:
    preferred_term: CAPN5
    term:
      id: hgnc:1482
      label: CAPN5
  relationship_type: CAUSATIVE
  notes: >-
    Encodes calpain-5, a 640-amino-acid calcium-activated cysteine protease
    expressed in retinal photoreceptor cells. All known pathogenic variants
    are heterozygous, germline, missense, and gain-of-function -- clustering
    either in the catalytic protease core near the calcium-sensitive gating
    loop (R243L, L244P, K250N, G267S, R289W) or in the C2/regulatory domain
    (G376S). Capn5 knockout mice show no retinal phenotype, arguing against
    haploinsufficiency as the disease mechanism.
  variants:
  - name: p.Arg243Leu (c.728G>T)
    description: Catalytic core, gating loop. Classic ADNIV, onset ~20s; also reported with late-onset mild presentation at ages 45 and 69.
    type: missense
    clinical_significance: PATHOGENIC
  - name: p.Leu244Pro (c.731T>C)
    description: Catalytic core, gating loop. Classic ADNIV.
    type: missense
    clinical_significance: PATHOGENIC
  - name: p.Lys250Asn (c.750G>T)
    description: Catalytic core, gating loop. Severe uveitis, retinal neovascularization/detachment.
    type: missense
    clinical_significance: PATHOGENIC
  - name: p.Gly267Ser (c.799G>A)
    description: Catalytic domain (exon 6). Severe, congenital nystagmus, early vitreoretinopathy.
    type: missense
    clinical_significance: PATHOGENIC
  - name: p.Gly376Ser (c.1126G>A)
    description: C2/regulatory domain. Mild, incidental, near-normal vision at age 19.
    type: missense
    clinical_significance: PATHOGENIC
  - name: p.Arg289Trp (c.865C>T)
    description: Catalytic domain, de novo. Most severe/syndromic variant -- childhood blindness, hearing loss, developmental delay.
    type: missense
    clinical_significance: PATHOGENIC
  evidence:
  - reference: PMID:23055945
    reference_title: Calpain-5 mutations cause autoimmune uveitis, retinal neovascularization, and photoreceptor degeneration.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CAPN5 encodes calpain-5, a calcium-activated cysteine protease that is
      expressed in retinal photoreceptor cells. Both mutations cause
      mislocalization from the cell membrane to the cytosol, and structural
      modeling reveals that both mutations lie within a calcium-sensitive
      domain near the active site.
    explanation: >-
      Establishes CAPN5 as the causal gene and describes the shared
      mislocalization/calcium-sensitivity mechanism of the founding variants.
  - reference: PMID:29040051
    reference_title: Two Novel CAPN5 Variants Associated with Mild and Severe Autosomal Dominant Neovascular Inflammatory Vitreoretinopathy Phenotypes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Next-generation sequencing identified that the patient was
      heterozygous for CAPN5 c.799G>A, p.(Gly267Ser).
    explanation: >-
      Documents the severe catalytic-domain G267S variant and its
      genotype-phenotype correlation with disease severity.
  - reference: PMID:29040051
    reference_title: Two Novel CAPN5 Variants Associated with Mild and Severe Autosomal Dominant Neovascular Inflammatory Vitreoretinopathy Phenotypes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The CAPN5 variant c.1126G>A, p.(Gly376Ser) was identified in this
      patient. This variant is present at an allele frequency of 0.017% in
      the South Asian population within the Exome Aggregate Consortium
      (ExAC) database13.
    explanation: >-
      Documents the mild regulatory-domain G376S variant, the first
      reported outside the catalytic domain.

pathophysiology:
- name: CAPN5 Gain-of-Function Protease Hyperactivation
  description: >-
    Heterozygous missense mutations near the calcium-sensitive gating loop of
    the calpain-5 catalytic core (or, for G376S, the C2/regulatory domain)
    increase calcium sensitivity and catalytic activity of the enzyme and
    cause its mislocalization from the photoreceptor plasma membrane to the
    cytosol. Capn5 knockout mice show no retinal phenotype, indicating the
    disease mechanism is gain-of-function rather than haploinsufficiency.
  role: trigger
  locations:
  - preferred_term: retina
    term:
      id: UBERON:0000966
      label: retina
  cell_types:
  - preferred_term: Photoreceptor Cell
    term:
      id: CL:0000210
      label: photoreceptor cell
  molecular_functions:
  - preferred_term: Calcium-Dependent Cysteine-Type Endopeptidase Activity
    term:
      id: GO:0004198
      label: calcium-dependent cysteine-type endopeptidase activity
    modifier: INCREASED
  evidence:
  - reference: PMID:23055945
    reference_title: Calpain-5 mutations cause autoimmune uveitis, retinal neovascularization, and photoreceptor degeneration.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both mutations cause mislocalization from the cell membrane to the
      cytosol, and structural modeling reveals that both mutations lie
      within a calcium-sensitive domain near the active site.
    explanation: >-
      Directly demonstrates the mislocalization and calcium-sensitization
      mechanism of the founding ADNIV variants.
  - reference: PMID:23055945
    reference_title: Calpain-5 mutations cause autoimmune uveitis, retinal neovascularization, and photoreceptor degeneration.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Capn5 knockout mice have no observable phenotype
    explanation: >-
      Knockout-mouse evidence arguing against haploinsufficiency and
      supporting a gain-of-function mechanism for ADNIV.
  downstream:
  - target: Aberrant Photoreceptor Synaptic Proteolysis

- name: Aberrant Photoreceptor Synaptic Proteolysis
  description: >-
    Hyperactive, mislocalized calpain-5 promiscuously proteolyzes normal
    substrates at the photoreceptor ribbon synapse in the retina's naturally
    high-calcium phototransduction environment. Vitreous proteomics of
    CAPN5-NIV patients shows early loss of synaptic proteins including
    neurexin-2, glutamate receptor 4, and neurofascin, correlating with the
    earliest clinical finding -- reduced ERG b-wave amplitude.
  role: central_effector
  locations:
  - preferred_term: retina
    term:
      id: UBERON:0000966
      label: retina
  cell_types:
  - preferred_term: Photoreceptor Cell
    term:
      id: CL:0000210
      label: photoreceptor cell
  biological_processes:
  - preferred_term: Proteolysis
    term:
      id: GO:0006508
      label: proteolysis
    modifier: INCREASED
  evidence:
  - reference: PMID:31110225
    reference_title: Proteomic insight into the pathogenesis of CAPN5-vitreoretinopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we observed a significant fraction of proteins localized to the
      synapse in controls that decreased in CAPN5-NIV vitreous. Among these
      proteins were: neurexin-2 (NRXN2), glutamate receptor 4 (GluR4),
      neurofascin (NFASC)
    explanation: >-
      Vitreous proteomics directly demonstrates loss of photoreceptor
      synaptic proteins in CAPN5-NIV patients, consistent with aberrant
      calpain-mediated synaptic proteolysis.
  - reference: PMID:25994508
    reference_title: "CAPN5 mutation in hereditary uveitis: the R243L mutation increases calpain catalytic activity and triggers intraocular inflammation in a mouse model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Electroretinography showed mutant mouse eyes had a selective loss of
      the b-wave indicating an inner-retina signaling defect.
    explanation: >-
      Mouse model evidence linking mutant CAPN5 expression to the reduced
      ERG b-wave, the earliest clinical/electrophysiological correlate of
      synaptic dysfunction.
  downstream:
  - target: Innate and Adaptive Autoimmune Uveitis

- name: Innate and Adaptive Autoimmune Uveitis
  description: >-
    Aberrant synaptic proteolysis and the resulting cellular stress trigger
    local innate immune activation (Toll-like receptor pathway genes,
    chemokines, cytokines, complement components) followed by dense CD3+
    T-lymphocyte infiltration of the uvea, vitreous, and retina, driving
    chronic autoimmune uveitis. Vitreous TNF-alpha levels are normal,
    explaining why patients fail conventional anti-TNF immunosuppression
    (e.g. infliximab).
  role: central_effector
  locations:
  - preferred_term: uvea
    term:
      id: UBERON:0001768
      label: uvea
  - preferred_term: vitreous body
    term:
      id: UBERON:0001798
      label: vitreous body
  cell_types:
  - preferred_term: T Cell
    term:
      id: CL:0000084
      label: T cell
  biological_processes:
  - preferred_term: Innate Immune Response
    term:
      id: GO:0045087
      label: innate immune response
    modifier: INCREASED
  - preferred_term: Adaptive Immune Response
    term:
      id: GO:0002250
      label: adaptive immune response
    modifier: INCREASED
  evidence:
  - reference: PMID:25994508
    reference_title: "CAPN5 mutation in hereditary uveitis: the R243L mutation increases calpain catalytic activity and triggers intraocular inflammation in a mouse model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Analysis of gene expression changes in the hCAPN5(R243L) mouse retina
      showed upregulation of several markers, including members of the
      Toll-like receptor pathway, chemokines and cytokines, indicative of
      both an innate and adaptive immune response.
    explanation: >-
      Mouse model transcriptomic evidence for innate and adaptive immune
      pathway activation downstream of mutant CAPN5 expression.
  - reference: PMID:23861576
    reference_title: Lymphocyte infiltration in CAPN5 autosomal dominant neovascular inflammatory vitreoretinopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Chronic inflammatory CD3-positive cell infiltrates were identified
      throughout the uvea, vitreous and retina, consistent with chronic
      uveitis.
    explanation: >-
      Human histopathology directly demonstrating CD3+ T-cell infiltration
      of the uvea, vitreous, and retina in an enucleated ADNIV eye.
  downstream:
  - target: Oxidative Stress-Driven Photoreceptor Degeneration
  - target: Opticin Loss and Pathologic Retinal Neovascularization

- name: Oxidative Stress-Driven Photoreceptor Degeneration
  description: >-
    Chronic inflammation is accompanied by loss of vitreous antioxidant
    defenses (superoxide dismutase, peroxiredoxins, catalase, clusterin),
    leaving photoreceptors vulnerable to oxidative injury. This drives a
    retinitis-pigmentosa-like pigmentary photoreceptor degeneration (ADNIV
    Stage II), distinguished from classic RP by pigment clumping rather than
    bone-spicule pigmentation.
  role: central_effector
  conforms_to: "photoreceptor_degeneration#Photoreceptor Metabolic and Oxidative Stress"
  locations:
  - preferred_term: retina
    term:
      id: UBERON:0000966
      label: retina
  cell_types:
  - preferred_term: Photoreceptor Cell
    term:
      id: CL:0000210
      label: photoreceptor cell
  biological_processes:
  - preferred_term: Response to Oxidative Stress
    term:
      id: GO:0006979
      label: response to oxidative stress
    modifier: INCREASED
  evidence:
  - reference: PMID:31110225
    reference_title: Proteomic insight into the pathogenesis of CAPN5-vitreoretinopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There were proteins with known antioxidant activity present in
      controls that were absent in CAPN5-NIV vitreous: superoxide dismutase
      (SOD1 and SOD3), peroxiredoxin (PRDX2 and PRDX6), catalase (CAT),
      clusterin, and glutathione peroxidase 3 (GPX3).
    explanation: >-
      Vitreous proteomics documents loss of multiple antioxidant defense
      proteins, supporting oxidative stress as a driver of photoreceptor
      degeneration.
  downstream:
  - target: Fibrotic Proliferative Vitreoretinopathy and Progressive Blindness

- name: Opticin Loss and Pathologic Retinal Neovascularization
  description: >-
    Downregulation of the anti-angiogenic vitreous matrix protein opticin,
    together with elevated vascular endothelial growth factor (VEGF),
    promotes pathologic retinal and iris neovascularization mimicking
    proliferative diabetic retinopathy (ADNIV Stage III). Anti-VEGF therapy
    (bevacizumab) has been repositioned to suppress this neovascularization.
  role: central_effector
  locations:
  - preferred_term: retina
    term:
      id: UBERON:0000966
      label: retina
  cell_types:
  - preferred_term: Retinal Blood Vessel Endothelial Cell
    term:
      id: CL:0002585
      label: retinal blood vessel endothelial cell
  biological_processes:
  - preferred_term: Angiogenesis
    term:
      id: GO:0001525
      label: angiogenesis
    modifier: INCREASED
  evidence:
  - reference: PMID:31110225
    reference_title: Proteomic insight into the pathogenesis of CAPN5-vitreoretinopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Opticin is an extracellular matrix glycoprotein associated with the
      collagen-integrin matrix in the vitreous.
    explanation: >-
      Identifies opticin, an anti-angiogenic vitreous protein, as
      downregulated in CAPN5-NIV.
  - reference: PMID:31110225
    reference_title: Proteomic insight into the pathogenesis of CAPN5-vitreoretinopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It was further revealed that the CAPN5-NIV vitreous contained
      abundant levels of vascular endothelial growth factor (VEGF), T-cell
      proliferative markers, and interleukin-6 (IL-6).
    explanation: >-
      Documents elevated vitreous VEGF as the angiogenic driver of
      CAPN5-NIV retinal/iris neovascularization.
  downstream:
  - target: Fibrotic Proliferative Vitreoretinopathy and Progressive Blindness

- name: Fibrotic Proliferative Vitreoretinopathy and Progressive Blindness
  description: >-
    Downregulation of the vitreous structural proteoglycan versican disrupts
    normal vitreous architecture, contributing to intraocular fibrosis,
    epiretinal membrane formation, and tractional retinal detachment (ADNIV
    Stage IV). Structural damage is generally irreversible; the disease
    culminates in phthisis bulbi and complete blindness (Stage V) despite
    corticosteroid control of active inflammation.
  role: outcome
  conforms_to: "fibrotic_response#Architectural Distortion and Organ Dysfunction"
  locations:
  - preferred_term: vitreous body
    term:
      id: UBERON:0001798
      label: vitreous body
  - preferred_term: retina
    term:
      id: UBERON:0000966
      label: retina
  evidence:
  - reference: PMID:31110225
    reference_title: Proteomic insight into the pathogenesis of CAPN5-vitreoretinopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Versican is a chondroitin sulfate proteoglycan involved in maintaining
      the physiologic structure of the vitreous.
    explanation: >-
      Identifies versican loss as the proteomic correlate of vitreous
      structural breakdown underlying fibrotic proliferative
      vitreoretinopathy.
  - reference: PMID:23861576
    reference_title: Lymphocyte infiltration in CAPN5 autosomal dominant neovascular inflammatory vitreoretinopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The eye showed exudative retinal detachment and neovascularization,
      intraocular fibrosis, and features of phthisis bulbi.
    explanation: >-
      Human histopathology of a Stage V ADNIV eye documenting the terminal
      fibrotic/phthisical outcome.

mechanistic_hypotheses:
- hypothesis_group_id: canonical_gain_of_function_model
  hypothesis_label: Canonical Gain-of-Function Protease Hyperactivation Model
  status: CANONICAL
  description: >-
    ADNIV-causing CAPN5 variants act through gain-of-function protease
    hyperactivation and mislocalization rather than loss of normal calpain-5
    function. This is the predominant model, supported by Capn5 knockout mice
    lacking a retinal phenotype and by direct biochemical demonstration of
    increased calcium sensitivity and mislocalization in all tested disease
    variants.
  evidence:
  - reference: PMID:23055945
    reference_title: "Calpain-5 mutations cause autoimmune uveitis, retinal neovascularization, and photoreceptor degeneration."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Capn5 knockout mice have no observable phenotype
    explanation: >-
      Knockout mice lacking a phenotype argues against haploinsufficiency,
      supporting the gain-of-function model.
- hypothesis_group_id: refuted_haploinsufficiency_model
  hypothesis_label: Refuted Haploinsufficiency Model
  status: DEPRECATED
  description: >-
    An initially plausible alternative hypothesis was that ADNIV variants
    act through simple loss of calpain-5 function (haploinsufficiency),
    analogous to CAPN3 loss-of-function causing limb-girdle muscular
    dystrophy. This is refuted by the normal phenotype of Capn5-null mice and
    by biochemical data showing the disease variants are catalytically
    hyperactive, not hypoactive.
  evidence:
  - reference: PMID:23055945
    reference_title: "Calpain-5 mutations cause autoimmune uveitis, retinal neovascularization, and photoreceptor degeneration."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although these mutations could cause disease through
      haploinsufficiency, it seems more likely that they result in a gain
      of function of calpain-5 that causes harm to the photoreceptor cells.
    explanation: >-
      The founding paper's own discussion weighs and rejects
      haploinsufficiency in favor of gain-of-function as the disease
      mechanism.


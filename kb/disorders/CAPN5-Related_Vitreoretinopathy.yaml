    snippet: >-
      It was further revealed that the CAPN5-NIV vitreous contained
      abundant levels of vascular endothelial growth factor (VEGF), T-cell
      proliferative markers, and interleukin-6 (IL-6).
    explanation: >-
      Documents elevated vitreous VEGF as the angiogenic driver of
      CAPN5-NIV retinal/iris neovascularization.
  downstream:
  - target: Fibrotic Proliferative Vitreoretinopathy and Progressive Blindness

- name: Fibrotic Proliferative Vitreoretinopathy and Progressive Blindness
  description: >-
    Downregulation of the vitreous structural proteoglycan versican may
    disrupt normal vitreous architecture, contributing to intraocular
    fibrosis, epiretinal membrane formation, and tractional retinal
    detachment (ADNIV Stage IV). Structural damage is generally
    irreversible; the disease culminates in phthisis bulbi and complete
    blindness (Stage V) despite corticosteroid control of active
    inflammation.

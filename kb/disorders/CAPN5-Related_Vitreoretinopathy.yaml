    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Both mutations cause mislocalization from the cell membrane to the
      cytosol, and structural modeling reveals that both mutations lie
      within a calcium-sensitive domain near the active site.
    explanation: >-
      Shows mislocalization of the founding ADNIV mutants in transfected
      HEK293T cells, which the source interprets as suggesting the mutations
      may alter a membrane-binding property of the protein.
  - reference: PMID:23055945
    reference_title: Calpain-5 mutations cause autoimmune uveitis, retinal neovascularization, and photoreceptor degeneration.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Capn5 knockout mice have no observable phenotype
    explanation: >-
      Knockout-mouse evidence arguing against haploinsufficiency and
      supporting a gain-of-function mechanism for ADNIV.
  downstream:
  - target: Aberrant Photoreceptor Synaptic Proteolysis

- name: Aberrant Photoreceptor Synaptic Proteolysis
  description: >-
    Hyperactive, mislocalized calpain-5 is hypothesized to aberrantly
    proteolyze substrates at the retinal ribbon synapse in the retina's
    naturally high-calcium phototransduction environment; the specific
    protein substrates of calpain-5 have not been identified. Vitreous
    proteomics of CAPN5-NIV patients shows early loss of synaptic proteins
    including neurexin-2, glutamate receptor 4 (a receptor expressed in rod
    bipolar cells), and neurofascin. The proteomic analysis could not
    differentiate which retinal cells are affected by these losses, which
    may contribute to the synaptic signaling defect -- reduced ERG b-wave
    amplitude -- seen in early disease.
  role: central_effector
  locations:
  - preferred_term: retina
    term:
      id: UBERON:0000966
      label: retina

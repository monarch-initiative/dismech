- name: Steroid-Sparing Immunosuppression
  description: >-
    Systemic immunosuppression is used for substantial vascular
    leakage/inflammation, but CAPN5-NIV patients characteristically fail
    conventional agents including anti-TNF-alpha therapy (infliximab),
    consistent with normal vitreous TNF-alpha levels and a treatment-resistant
    biology distinct from classic autoimmune uveitis.
  treatment_term:
    preferred_term: immune suppressant agent therapy
    term:
      id: NCIT:C15261
      label: Immunosuppressive Therapy
  evidence:
  - reference: PMID:31110225
    reference_title: Proteomic insight into the pathogenesis of CAPN5-vitreoretinopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      these patients are left with few treatment options and fail
      conventional immunosuppressive therapy, such as oral corticosteroids
      and infliximab
    explanation: >-
      Documents the treatment-resistance to conventional immunosuppression,
      including anti-TNF therapy (infliximab), that distinguishes CAPN5-NIV
      biology.

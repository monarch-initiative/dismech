name: CAPN5-Related Vitreoretinopathy
creation_date: "2026-07-17T00:00:00Z"
category: Mendelian
description: >-
  CAPN5-related vitreoretinopathy -- most commonly termed Autosomal Dominant
  Neovascular Inflammatory Vitreoretinopathy (ADNIV) -- is a rare, progressive,
  autosomal dominant autoinflammatory eye disease caused by heterozygous
  gain-of-function missense variants in CAPN5, which encodes the
  calcium-activated cysteine protease calpain-5. Mutant calpain-5 is
  hypersensitized to calcium and mislocalizes from the photoreceptor plasma
  membrane to the cytosol, where it promiscuously proteolyzes synaptic
  proteins, triggering an innate and CD3+ T-cell-mediated adaptive autoimmune
  response, oxidative stress-driven photoreceptor degeneration, pathologic
  retinal/iris neovascularization, and end-stage intraocular fibrosis. The
  disease is notable for sequentially mimicking three common causes of
  blindness as it progresses through five roughly decade-long stages --
  posterior uveitis, retinitis-pigmentosa-like degeneration, proliferative
  diabetic-retinopathy-like neovascularization, fibrotic
  vitreoretinopathy/tractional detachment, and phthisis bulbi. Severity
  correlates with the degree of protease hyperactivation conferred by the
  causal variant, ranging from mild, incidentally-discovered peripheral
  pigmentary change to a severe childhood-onset syndromic form with
  sensorineural hearing loss and developmental delay. No proven
  disease-modifying treatment exists; management is stage-based
  (anti-inflammatory, anti-VEGF, laser, and surgical) and often only partially
  effective.
disease_term:
  preferred_term: CAPN5-related vitreoretinopathy
  term:

- name: Steroid-Sparing Immunosuppression
  description: >-
    Systemic immunosuppression is used for substantial vascular
    leakage/inflammation, but CAPN5-NIV patients characteristically fail
    conventional agents including anti-TNF-alpha therapy (infliximab),
    consistent with normal vitreous TNF-alpha levels and a treatment-resistant
    biology distinct from classic autoimmune uveitis.
  treatment_term:
    preferred_term: immune suppressant agent therapy

  - reference: PMID:31110225
    reference_title: Proteomic insight into the pathogenesis of CAPN5-vitreoretinopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      these patients are left with few treatment options and fail
      conventional immunosuppressive therapy, such as oral corticosteroids
      and infliximab
    explanation: >-
      Documents the treatment-resistance to conventional immunosuppression,
      including anti-TNF therapy (infliximab), that distinguishes CAPN5-NIV

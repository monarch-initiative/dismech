diagnosis:
- name: Transferrin isoelectric focusing screening
  description: >-
    Transferrin isoelectric focusing can detect a type I protein
    N-glycosylation pattern, but that pattern is shared across multiple CDG
    subtypes and does not identify ALG12-CDG by itself.
  diagnosis_term:
    preferred_term: clinical laboratory procedure
    term:
      id: MAXO:0000006
      label: clinical laboratory procedure
  results: >-
    A type I transferrin hypoglycosylation pattern supports a disorder of early
    protein N-glycosylation and should prompt molecular subtype evaluation; it
    is not specific for ALG12-CDG.
  evidence:
  - reference: PMID:34467644
    reference_title: A novel homozygous mutation in the human ALG12 gene results in an aberrant profile of oligomannose N-glycans in patient's serum.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Due to a newborn Slovak patient's clinical and biochemical abnormalities,
      the isoelectric focusing of transferrin was performed with observed
      significant hypoglycosylation typical of CDG I.
    explanation: >-
      This patient result supports transferrin isoelectric focusing as a
      biochemical screen for a type I CDG pattern.
  - reference: PMID:31529350
    reference_title: "ALG12-CDG: novel glycophenotype insights endorse the molecular defect."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We analyzed serum native transferrin, as first line test for CDG
    explanation: >-
      This directly supports serum transferrin testing as a first-line CDG
      screen, without implying ALG12 specificity.
- name: Serum N-glycan profiling
  description: >-
    Mass-spectrometric serum N-glycan profiling identified an oligomannose
    pattern consistent with impaired ALG12 activity in one reported patient;
    its sensitivity and specificity as an ALG12-CDG diagnostic test are not
    established.
  diagnosis_term:
    preferred_term: clinical laboratory procedure
    term:
      id: MAXO:0000006
      label: clinical laboratory procedure
  results: >-
    Accumulation of GlcNAc2Man5-7 with decreased GlcNAc2Man8-9 can provide
    supporting biochemical evidence for impaired ALG12 activity, but molecular
    confirmation is required.
  evidence:
  - reference: PMID:34467644
    reference_title: A novel homozygous mutation in the human ALG12 gene results in an aberrant profile of oligomannose N-glycans in patient's serum.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Furthermore, analysis of neutral serum N-glycans by mass spectrometry
      revealed the accumulation of GlcNAc2Man5-7 and decreased levels of
      GlcNAc2Man8-9, which indicated impaired ALG12 enzymatic activity.
    explanation: >-
      This single-patient result supports the reported ALG12-associated glycomic
      signature without establishing population-level diagnostic performance.
- name: ALG12 molecular genetic testing
  description: >-
    Molecular diagnosis is established by identifying biallelic pathogenic or
    likely pathogenic ALG12 variants; compound-heterozygous alleles should be
    shown or inferred to be in trans. Compatible glycosylation findings can
    support variant interpretation but are not themselves ALG12-specific.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: MAXO:0000533
      label: molecular genetic testing
  results: >-
    Homozygous or in-trans compound-heterozygous pathogenic or likely pathogenic
    ALG12 variants establish the molecular diagnosis; biochemical findings
    provide supporting pathway evidence.
  evidence:
  - reference: PMID:34467644
    reference_title: A novel homozygous mutation in the human ALG12 gene results in an aberrant profile of oligomannose N-glycans in patient's serum.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This comprehensive genomic and glycomic approach led to the confirmation
      of the ALG12 pathogenic variant responsible for the clinical manifestation
      of the disorder in the patient described.
    explanation: >-
      The case report directly supports combined genomic and glycomic
      confirmation of the diagnosis.
  - reference: PMID:37644541
    reference_title: "Congenital disorders of glycosylation: narration of a story through its patents."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      CDG diagnosis has been at a rapid pace since the introduction of
      whole-exome/whole-genome sequencing as a diagnostic tool.
    explanation: >-
      This CDG-wide review supports genome-scale sequencing as a modern
      diagnostic approach for CDG; it is broader than ALG12-CDG alone.

      underoccupancy of N-glycosylation sites.
    explanation: >-
      This supports protein N-glycosylation underoccupancy as a downstream
      biochemical consequence.
  downstream:
  - target: Abnormal serum and IgG N-glycosylation
    description: >-
      The precursor-assembly defect alters N-glycosylation-site occupancy and
      downstream glycan processing, producing abnormal total-serum and IgG
      N-glycan profiles; the intervening transfer and processing steps make
      this an indirect biochemical link.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Transfer of incomplete lipid-linked oligosaccharides, reduced protein N-glycosylation-site occupancy, and downstream glycan processing.
    hypothesis_groups:

prevalence:
- population: Global published literature
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    As of 2021, the cited report stated that 15 patients had been diagnosed
    globally. This is a time-bounded diagnosed-case count from the literature,
    not a population prevalence estimate.
  evidence:
  - reference: PMID:34467644
    reference_title: A novel homozygous mutation in the human ALG12 gene results in an aberrant profile of oligomannose N-glycans in patient's serum.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To date, only 15 patients have been diagnosed with ALG12-CDG globally.
    explanation: >-
      The 2021 case report provides a direct published patient-count estimate.
progression:
- phase: Variable severity
  notes: >-
    ALG12-CDG severity ranges from mild adult presentations to fatal
    multisystem infantile disease.
  evidence:
  - reference: PMID:31481313
    reference_title: "Complex phenotypes in ALG12-congenital disorder of glycosylation (ALG12-CDG): Case series and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report a unique family with three affected individuals, including two
      older brothers with only cognitive and coagulation defects and a younger
      brother who died from a severe multisystem disease at age 18 months. The
      two living brothers are the oldest and mildest cases of ALG12-CDG
      described thus far.
    explanation: >-
      The within-family case series directly contrasts the mildest and oldest
      reported survivors with a sibling who died from severe multisystem disease
      at 18 months.
mechanistic_hypotheses:
- hypothesis_group_id: canonical_alg12_cdg_model
  hypothesis_label: Canonical ALG12-CDG Glycoprotein Hypoglycosylation Model
  status: CANONICAL
  description: >-
    Biallelic loss of ALG12 function reduces the ER alpha1,6-mannosyltransferase
    step in lipid-linked oligosaccharide assembly. The resulting precursor
    defect causes underoccupancy and abnormal N-glycosylation of multiple
    proteins and a multisystem CDG phenotype. The biochemical sequence is
    canonical, while the tissue-specific intermediates connecting systemic
    glycoprotein dysfunction to individual clinical findings remain unresolved.
  evidence:
  - reference: PMID:12217961
    reference_title: ALG12 mannosyltransferase defect in congenital disorder of glycosylation type lg.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In the patient's fibroblasts, the biosynthetic intermediate
      GlcNAc(2)Man(7) oligosaccharide was detected both on the lipid carrier
      dolichyl pyrophosphate and on newly synthesized glycoproteins, thus
      pointing to a defect in the dolichyl pyrophosphate-GlcNAc(2)Man(7)-dependent
      ALG12 alpha1,6 mannosyltransferase.
    explanation: >-
      Patient-fibroblast measurements directly support the ALG12
      precursor-assembly defect at the center of the canonical model.
- hypothesis_group_id: severe_prenatal_renal_skeletal_model
  hypothesis_label: Severe Prenatal Renal-Skeletal Extension Model
  status: EMERGING
  description: >-
    A rare severe prenatal or neonatal branch may extend ALG12-CDG to
    multicystic renal malformation and skeletal-dysplasia-like abnormalities.
    This branch is kept separate from the canonical clinical spectrum because
    it is supported by limited severe-case evidence and its organ-specific
    intermediates are unknown.
  evidence:
  - reference: PMID:38717015
    reference_title: Expanded prenatal phenotype of ALG12-associated congenital disorder of glycosylation including bilateral multicystic kidneys.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report on a case expanding the phenotype of ALG12-CDG to include
      bilateral, multicystic kidneys in a neonatal demise identified with
      homozygous pathogenic variants in the ALG12 gene at c.1001del
      (p.N334Tfs*15) through clinical trio exome sequencing.
    explanation: >-
      The report explicitly presents multicystic kidneys as an expanded severe
      prenatal phenotype rather than a universal ALG12-CDG manifestation.
  - reference: PMID:38717015
    reference_title: Expanded prenatal phenotype of ALG12-associated congenital disorder of glycosylation including bilateral multicystic kidneys.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In addition, skeletal abnormalities resembling a skeletal dysplasia
      including shortened long bones and talipes equinovarus have been seen in
      more severe neonatal presentation of this disorder.
    explanation: >-
      The same report supports skeletal-dysplasia-like abnormalities as a
      limited severe neonatal extension of the phenotype.
- hypothesis_group_id: exceptional_adult_cardioskeletal_model
  hypothesis_label: Exceptional Adult Cardioskeletal Association Model
  status: EMERGING
  description: >-
    Ventricular septal defect and severe scoliosis were reported together in a
    single unusually mild adult. Coexisting ALG6 and KMT2D variants confound
    attribution, so this group records a bounded clinical association rather
    than a demonstrated causal consequence of ALG12 deficiency.
  evidence:
  - reference: PMID:32530140
    reference_title: "ALG12-CDG: An unusual patient without intellectual disability and facial dysmorphism, and with a novel variant."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We here present an intriguing patient with an exceptional phenotype:
      25-year-old women with a ventricular septal defect and severe idiopathic
      scoliosis but no facial dysmorphism, who dances as a professional, and
      has a University degree.
    explanation: >-
      The single-patient co-occurrence only partially supports this branch
      because the report discusses possible contributions from other variants.

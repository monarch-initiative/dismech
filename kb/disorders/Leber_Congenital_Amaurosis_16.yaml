    reference_title: "Gene Augmentation and Readthrough Rescue Channelopathy in an iPSC-RPE Model of Congenital Blindness."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "After readthrough drug treatment, the LCA16 hiPSC cells were hyperpolarized by 30 mV, and the Kir7.1 current was restored."

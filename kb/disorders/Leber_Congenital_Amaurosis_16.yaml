animal_models:
- name: Kcnj13 RPE-conditional knockout mouse
  species: Mouse
  genotype: Kcnj13 flox/flox; Best1-cre
  publication: PMID:30009826
  description: >-
    RPE-specific deletion, used because constitutive Kcnj13-null mice die on
    postnatal day 1.
  modeled_mechanisms:
  - target: Loss of RPE Support for Photoreceptor Survival
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      RPE-restricted loss of Kcnj13 causes progressive outer nuclear layer
      thinning and reduced light responses.
    limitations: >-
      A null allele in mouse; human alleles include missense variants with
      residual protein. Mouse retina has no macula, so the macular atrophy and
      posterior-pole pigment clumping seen in patients cannot be modelled.
    evidence:
    - reference: PMID:30009826
      reference_title: "Conditional loss of Kcnj13 in the retinal pigment epithelium causes photoreceptor degeneration."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Furthermore, our findings show that widespread loss of Kcnj13 in the RPE leads to severe and progressive thinning of the outer nuclear layer and a reduced response to light."
      explanation: Photoreceptor degeneration after RPE-specific deletion.
- name: kcnj13 obelix zebrafish
  species: Zebrafish
  genotype: kcnj13 obelix td15 (c.502T>C, p.Phe168Leu)
  publication: PMID:30846767
  description: >-
    ENU mutant with a non-conducting M2-domain missense allele and late-onset
    retinal degeneration.
  modeled_mechanisms:
  - target: Impaired RPE Phagocytosis of Photoreceptor Outer Segments
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Reduced phagosome clearance precedes degeneration.
    limitations: >-
      Degeneration begins only at 12 months, much later than the infantile
      human disease, and zebrafish retina differs from human retina.
    evidence:
    - reference: PMID:30846767
      reference_title: "Phagosomal and mitochondrial alterations in RPE may contribute to KCNJ13 retinopathy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Detailed phenotyping of obelixtd15 fish revealed a late onset retinal degeneration at 12 months."
      explanation: Late-onset degeneration in the mutant.

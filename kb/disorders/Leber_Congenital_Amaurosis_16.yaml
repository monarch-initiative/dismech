name: Leber Congenital Amaurosis 16
creation_date: "2026-10-15T00:00:00Z"
category: Mendelian
description: >-
  Leber congenital amaurosis 16 (LCA16) is an autosomal recessive early-onset
  severe retinal dystrophy caused by biallelic loss-of-function variants in
  KCNJ13, which encodes Kir7.1, an inwardly rectifying potassium channel subunit
  that sits in the apical membrane of the retinal pigment epithelium (RPE). Unlike
  most forms of LCA, the primary lesion is in the RPE rather than in the
  photoreceptors. Loss of Kir7.1 conductance leaves the RPE unable to set its
  membrane potential and to buffer subretinal potassium, and patient-derived and
  knockout RPE show reduced phagocytosis of photoreceptor outer segments,
  secondary mitochondrial changes, and vulnerability to oxidative stress. The
  overlying rods and cones then degenerate. Affected individuals have nystagmus
  and severe visual loss from infancy, night blindness, and a distinctive fundus
  with dense clumped or nummular pigment at the level of the RPE, macular atrophy,
  optic disc pallor and vessel attenuation. Juvenile or early-adult cataract is
  common, and two siblings homozygous for an M2-domain missense allele developed
  retinal neovascularization and vitreous hemorrhage in adolescence. Heterozygous
  carriers are clinically unaffected. Specific dominant KCNJ13 alleles cause a
  different disorder, snowflake vitreoretinal degeneration. No disease-specific
  therapy exists; gene augmentation, base editing and nonsense-suppression
  approaches have rescued channel function in patient-derived RPE and in mouse
  models.
notes: >-
  The entry is anchored on MONDO:0013613 (OMIM 614186) and KCNJ13 (hgnc:6259).
  KCNJ13-LCA accounts for an unknown or less than 1% share of LCA/EOSRD
  (PMID:40294858), and the published literature consists of fewer than a dozen
  families, so no phenotype carries a frequency band.

  ClinGen classifies KCNJ13 as Definitive for autosomal recessive "inherited
  retinal dystrophy" (MONDO:0019118) and Moderate for autosomal dominant snowflake
  vitreoretinal degeneration (MONDO:0008663). Neither assertion is for
  MONDO:0013613, so no gene_disease_validity tier is recorded on the genetic
  block.

  The mouse and human RPE data disagree on whether Kir7.1-deficient RPE cells
  survive. In CRISPR mosaic mice the Kcnj13-null RPE cells survived while the
  photoreceptors above them degenerated (PMID:25666713); in human iPSC-RPE the
  knockout cells died under oxidative stress (PMID:36413373). Both observations
  are curated, on the RPE oxidative-stress node.

  The GeneReviews chapter that covers this disease is the nonsyndromic LCA/EOSRD
  overview (PMID:30285347). Its PubMed record has no clinical abstract, so it is
  tagged in references but no phenotype quotes it.

- name: RPE Oxidative Stress and Cell Death
  biological_scale: CELLULAR
  description: >-
    KCNJ13-knockout human iPSC-RPE shows raised oxidative-stress gene
    expression and glutathione, increased cell death, and dying cells that
    aggregate and protrude from the epithelial sheet. In mosaic mice, by
    contrast, Kcnj13-null RPE cells survived, so whether RPE death occurs in
    patients is not settled.

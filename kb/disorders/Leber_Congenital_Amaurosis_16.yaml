genetic:
- name: KCNJ13
  gene_term:
    preferred_term: KCNJ13
    term:
      id: hgnc:6259
      label: KCNJ13
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    KCNJ13 (2q37) encodes Kir7.1, a weakly rectifying potassium channel subunit
    that forms tetramers in the apical RPE membrane. Recessive loss-of-function
    alleles cause LCA16. Specific heterozygous alleles, such as p.Arg162Trp,
    cause autosomal dominant snowflake vitreoretinal degeneration instead.
  notes: >-
    ClinGen rates KCNJ13 Definitive for autosomal recessive inherited retinal
    dystrophy (MONDO:0019118), a broader concept than this entry, so the tier
    is not copied here.
  evidence:
  - reference: PMID:21763485
    reference_title: "Recessive mutations in KCNJ13, encoding an inwardly rectifying potassium channel subunit, cause leber congenital amaurosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A screen of a further 333 unrelated individuals with recessive retinal degeneration identified an additional proband, homozygous for a missense mutation, c.722T>C (p.Leu241Pro), in the same gene."
    explanation: A second unrelated family with a homozygous KCNJ13 allele.
  - reference: PMID:25921210
    reference_title: "A Novel KCNJ13 Nonsense Mutation and Loss of Kir7.1 Channel Function Causes Leber Congenital Amaurosis (LCA16)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Herein, we report the identification of a novel nonsense mutation in the second exon of the KCNJ13 gene that leads to a premature stop codon in association with LCA16."
    explanation: Independent family with a KCNJ13 nonsense allele.
  variants:
  - name: NM_002242.4:c.496C>T (p.Arg166Ter)
    type: NONSENSE
    clinical_significance: PATHOGENIC
    description: Homozygous in the first reported family.
    evidence:
    - reference: PMID:21763485
      reference_title: "Recessive mutations in KCNJ13, encoding an inwardly rectifying potassium channel subunit, cause leber congenital amaurosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A combination of homozygosity mapping and exome sequencing identifies a homozygous nonsense mutation, c.496C>T (p.Arg166X), in a gene, KCNJ13, encoding a potassium channel subunit Kir7.1."
      explanation: Discovery of the allele in homozygous form.
  - name: NM_002242.4:c.722T>C (p.Leu241Pro)
    type: MISSENSE
    clinical_significance: PATHOGENIC
    description: Homozygous in a second unrelated proband.
    evidence:
    - reference: PMID:21763485
      reference_title: "Recessive mutations in KCNJ13, encoding an inwardly rectifying potassium channel subunit, cause leber congenital amaurosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "homozygous for a missense mutation, c.722T>C (p.Leu241Pro), in the same gene"
      explanation: Reports the homozygous missense allele.
  - name: NM_002242.4:c.359T>C (p.Ile120Thr)
    type: MISSENSE
    description: >-
      Homozygous in two unrelated Saudi patients with early cataract and fibrosis
      over the disc. No clinical-significance call is recorded here.
    evidence:
    - reference: PMID:25475713
      reference_title: "A distinct vitreo-retinal dystrophy with early-onset cataract from recessive KCNJ13 mutations."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Next-generation sequencing of retinal dystrophy genes revealed homozygosity for a novel missense mutation in KCNJ13"
      explanation: Allele co-segregates with disease.
  - name: NM_002242.4:c.458C>T (p.Thr153Ile)
    type: MISSENSE
    description: >-
      M2-domain allele, homozygous in two families. The protein reaches the
      membrane but has negligible potassium conductance. The older siblings of
      one family developed retinal neovascularization.
    evidence:
    - reference: PMID:35584325
      reference_title: "Kir7.1 disease mutant T153I within the inner pore affects K(+) conduction."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We showed that the T153I mutation yielded a full-length protein localized to the cell membrane."
      explanation: The allele is not a trafficking defect.
  - name: c.314G>T (p.Ser105Ile) and c.655C>T (p.Gln219Ter)
    type: COMPOUND_HETEROZYGOUS
    description: Compound heterozygous in a 31-year-old man with large pigment clumps.
    evidence:
    - reference: PMID:27203561
      reference_title: "LEBER CONGENITAL AMAUROSIS WITH LARGE RETINAL PIGMENT CLUMPS CAUSED BY COMPOUND HETEROZYGOUS MUTATIONS IN KCNJ13."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The patient was compound heterozygous for new mutations in KCNJ13 which encodes the Kir 7.1 potassium channel, c.314G>T (p.Ser105Ile) in exon 2 and c.655C>T (p.Gln219*) in exon 3."
      explanation: Reports the two alleles in trans.
  - name: c.158G>A (p.Trp53Ter)
    type: NONSENSE
    description: >-
      Homozygous allele used for patient-derived iPSC-RPE and for the base
      editing and suppressor-tRNA studies.
    evidence:
    - reference: PMID:30686507
      reference_title: "Gene Augmentation and Readthrough Rescue Channelopathy in an iPSC-RPE Model of Congenital Blindness."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We derived human induced pluripotent stem cell (hiPSC)-RPE cells from an individual carrying a homozygous c.158G>A (p.Trp53∗) pathogenic variant of KCNJ13."
      explanation: Identifies the patient genotype.

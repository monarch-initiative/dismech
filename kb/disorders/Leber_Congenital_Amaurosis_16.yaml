  evidence:
  - reference: PMID:30686507
    reference_title: "Gene Augmentation and Readthrough Rescue Channelopathy in an iPSC-RPE Model of Congenital Blindness."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We found that the LCA16 hiPSC-RPE cells had normal morphology but did not express a functional Kir7.1 channel and were unable to demonstrate normal physiology."
    explanation: >-
      RPE derived from a patient with LCA16 lacks a working Kir7.1 channel.
  - reference: PMID:30686507
    reference_title: "Gene Augmentation and Readthrough Rescue Channelopathy in an iPSC-RPE Model of Congenital Blindness."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "After readthrough drug treatment, the LCA16 hiPSC cells were hyperpolarized by 30 mV, and the Kir7.1 current was restored."
    explanation: >-
      Restoring the channel hyperpolarizes the cells by 30 mV, which implies
      that the untreated patient RPE is depolarized because Kir7.1 is missing.
  downstream:
  - target: Impaired RPE Phagocytosis of Photoreceptor Outer Segments
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Kir7.1-null RPE takes up and clears fewer photoreceptor outer segments.
      How the loss of potassium conductance impairs phagocytosis is not known.
    evidence:
    - reference: PMID:32437550
      reference_title: "KCNJ13 Gene Deletion Impairs Cell Alignment and Phagocytosis in Retinal Pigment Epithelium Derived from Human-Induced Pluripotent Stem Cells."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We suggest that Kir7.1 is required for phagocytosis of POSs by RPE cells and that impaired phagocytosis in the absence of Kir7.1 would be involved in the retinal degeneration found in LCA16."
      explanation: >-
        Links absence of Kir7.1 to impaired outer-segment phagocytosis in
        human RPE.
  - target: RPE Oxidative Stress and Cell Death
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Kir7.1-knockout human RPE is more vulnerable to oxidative stress and
      dies.
    evidence:
    - reference: PMID:36413373
      reference_title: "Protrusion of KCNJ13 Gene Knockout Retinal Pigment Epithelium Due to Oxidative Stress-Induced Cell Death."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We suggest that in the absence of the Kir.7.1 potassium channel, human RPE cells are vulnerable to oxidative stress and ultimately die."
      explanation: >-
        Connects loss of Kir7.1 to oxidative-stress vulnerability and death of
        human RPE.
  - target: Loss of RPE Support for Photoreceptor Survival
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Mosaic mice show that photoreceptors degenerate only above RPE cells
      lacking Kir7.1, so the requirement is RPE-autonomous.
    evidence:
    - reference: PMID:25666713
      reference_title: "CRISPR-engineered mosaicism rapidly reveals that loss of Kcnj13 function in mice mimics human disease phenotypes."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These results suggest that KCNJ13 expression is required for RPE cells to maintain photoreceptor survival."
      explanation: >-
        Mosaic Kcnj13 loss in mouse RPE shows that the channel is needed in
        the RPE for photoreceptor survival.

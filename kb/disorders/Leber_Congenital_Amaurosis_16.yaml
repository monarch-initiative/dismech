inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Disease requires two loss-of-function KCNJ13 alleles, either homozygous
    (often in consanguineous families) or compound heterozygous. Heterozygous
    carriers have no ocular disease, and a truncating allele does not suppress
    wild-type channel function when the two are co-expressed.
  evidence:
  - reference: PMID:21763485
    reference_title: "Recessive mutations in KCNJ13, encoding an inwardly rectifying potassium channel subunit, cause leber congenital amaurosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Examination of heterozygotes revealed no ocular disease."
    explanation: >-
      Heterozygous relatives of the homozygous probands are unaffected, as
      expected for recessive inheritance.
  - reference: PMID:25921210
    reference_title: "A Novel KCNJ13 Nonsense Mutation and Loss of Kir7.1 Channel Function Causes Leber Congenital Amaurosis (LCA16)."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Coexpression of the mutant and wild-type channel has no negative influence on the wild-type channel function, consistent with the normal clinical phenotype of carrier individuals."
    explanation: >-
      The truncated channel is not dominant negative, which explains why one
      wild-type allele is enough.
  - reference: PMID:27203561
    reference_title: "LEBER CONGENITAL AMAUROSIS WITH LARGE RETINAL PIGMENT CLUMPS CAUSED BY COMPOUND HETEROZYGOUS MUTATIONS IN KCNJ13."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient was compound heterozygous for new mutations in KCNJ13 which encodes the Kir 7.1 potassium channel, c.314G>T (p.Ser105Ile) in exon 2 and c.655C>T (p.Gln219*) in exon 3."
    explanation: >-
      Compound heterozygosity, as well as homozygosity, causes the disease.
prevalence:
- population: Worldwide reported literature
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population prevalence estimate exists. A tertiary-centre series groups
    KCNJ13 with genes that account for an unknown or less than 1% of all
    LCA/EOSRD cases.
  evidence:
  - reference: PMID:40294858
    reference_title: "Clinical Characteristics of Patients With Less Common Causes of Leber Congenital Amaurosis/Early-Onset Severe Retinal Dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Review of clinical notes, ophthalmic images, and genetic testing results of 19 patients with disease-causing variants in genes that represent an unknown or <1% of all LCA/EOSRD cases: ALMS1, CABP4, KCNJ13, and OTX2."
    explanation: >-
      Places KCNJ13 among the genes that account for less than 1% of LCA/EOSRD,
      supporting an ultra-rare classification.
pathophysiology:
- name: Biallelic KCNJ13 Loss-of-Function Variants
  biological_scale: MOLECULAR
  description: >-
    Two damaging KCNJ13 alleles are inherited. The published alleles include
    nonsense variants (p.Trp53Ter, p.Arg166Ter, p.Gln219Ter) and missense
    variants (p.Ser105Ile, p.Ile120Thr, p.Thr153Ile, p.Leu241Pro). Truncating
    alleles mislocalize the channel; the M2-domain missense allele p.Thr153Ile
    reaches the membrane but conducts almost no potassium.
  genes:
  - preferred_term: KCNJ13
    term:
      id: hgnc:6259
      label: KCNJ13
  molecular_functions:
  - preferred_term: inward rectifier potassium channel activity
    term:
      id: GO:0005242
      label: inward rectifier potassium channel activity
    modifier: DECREASED
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:21763485
    reference_title: "Recessive mutations in KCNJ13, encoding an inwardly rectifying potassium channel subunit, cause leber congenital amaurosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A combination of homozygosity mapping and exome sequencing identifies a homozygous nonsense mutation, c.496C>T (p.Arg166X), in a gene, KCNJ13, encoding a potassium channel subunit Kir7.1."
    explanation: >-
      Discovery of a homozygous KCNJ13 nonsense allele as the cause of LCA.
  - reference: PMID:25921210
    reference_title: "A Novel KCNJ13 Nonsense Mutation and Loss of Kir7.1 Channel Function Causes Leber Congenital Amaurosis (LCA16)."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We have determined that the mutation results in a severe truncation of the Kir7.1 C-terminus, alters protein localization, and disrupts potassium currents."
    explanation: >-
      Shows that a patient nonsense allele abolishes channel function.
  downstream:
  - target: Loss of Kir7.1 Potassium Conductance in the RPE
    causal_link_type: DIRECT
    description: >-
      Truncated, mislocalized or non-conducting Kir7.1 subunits leave the RPE
      apical membrane without the channel.
    evidence:
    - reference: PMID:35584325
      reference_title: "Kir7.1 disease mutant T153I within the inner pore affects K(+) conduction."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Whole cell patch-clamp recordings and chord conductance analyses revealed that the T153I mutant channel had negligible K+ conductance and failed to hyperpolarize the membrane potential."
      explanation: >-
        A missense patient allele that is correctly localized still abolishes
        potassium conductance.
- name: Loss of Kir7.1 Potassium Conductance in the RPE
  biological_scale: CELLULAR
  description: >-
    Kir7.1 is the main potassium conductance of the RPE apical membrane facing
    the photoreceptors. Patient-derived RPE carrying p.Trp53Ter lacks a
    functional Kir7.1 current and has a depolarized membrane potential, which
    impairs potassium recycling into the subretinal space.

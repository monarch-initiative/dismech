  rationale: >-
    The mechanisms converting an injured hippocampus into a chronically
    epileptic network remain unresolved. Transcriptomic profiling of the
    epileptic hippocampus reveals many reactive changes in glia and neurons, but
    whether inflammatory activation and synaptic remodeling drive epileptogenesis
    or merely accompany it is unknown. Separating drivers from bystanders is
    prerequisite to any disease-modifying (antiepileptogenic) intervention and to
    weighting the causal edge from the sclerotic focus to network reorganization.
  evidence:
  - reference: DOI:10.1186/s40364-024-00636-3
    reference_title: "Single-cell, single-nucleus and xenium-based spatial transcriptomics analyses reveal inflammatory activation and altered cell interactions in the hippocampus in mice with temporal lobe epilepsy"
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: >-
      The mechanisms underlying TLE-HS development remain unclear, but the
      reactive transcriptomic changes in glial cells and neurons of the
      hippocampus post-epileptogenesis may provide insights.
    explanation: >-
      Explicitly states that TLE-HS mechanisms are unclear and frames reactive
      glial and neuronal changes as candidate, not yet causally established,
      contributors to epileptogenesis.
  proposed_experiments:
  - experiment_id: exp_mtlehs_latent_period_causal_perturbation
    name: Latent-period causal perturbation of candidate epileptogenic drivers
    description: >-
      In a post-status-epilepticus model, selectively suppress individual
      candidate mechanisms (e.g., neuroinflammatory signaling, reactive
      astrogliosis, mossy fiber sprouting) during the latent period and measure
      whether spontaneous recurrent seizures are prevented or delayed, thereby
      classifying each change as driver versus bystander.
    experiment_type:
      preferred_term: targeted mechanism perturbation experiment
    readouts:
    - name: Spontaneous recurrent seizure emergence
      target: pathophysiology#Large-Scale Network Reorganization
      biological_processes:
      - preferred_term: transmission of nerve impulse
        term:
          id: GO:0019226
          label: transmission of nerve impulse
        modifier: DYSREGULATED
      assays:
      - preferred_term: electroencephalography
      direction: NEGATIVE
    controls:
    - name: Vehicle/untargeted controls
      description: >-
        Model animals receiving inactive or non-targeting intervention over the
        same latent-period window.
    decision_criterion: >-
      A mechanism is classified as a causal driver if its latent-period
      suppression reproducibly prevents or substantially delays spontaneous
      recurrent seizures; changes without such effect are reclassified as
      reactive bystanders.
    would_support:
    - pathophysiology#Large-Scale Network Reorganization
- discussion_id: gap_mtlehs_rodent_post_se_model_fidelity
  prompt: >-
    Do rodent post-status-epilepticus models (kainate, pilocarpine) faithfully
    recapitulate human MTLE-HS, including the years-long human latent period, the
    febrile-status-epilepticus etiology, and the characteristic pattern and
    laterality of hippocampal sclerosis?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Hippocampal Sclerosis
  rationale: >-
    Rodent chemoconvulsant models reproduce HS-like neuronal loss and gliosis
    and generate spontaneous seizures, and are the workhorse for mechanistic and
    antiepileptogenesis studies. However, their fidelity to human MTLE-HS is
    debated: the human latent period spans years rather than days to weeks, the
    common human antecedent of febrile status epilepticus is not modeled by
    direct intracerebral excitotoxin injection, and the acute, bilateral, and
    often severe sclerosis induced in rodents may not match the typically
    unilateral, subfield-specific human sclerosis pattern. This is a
    model-evidence-exists-but-human-validity-uncertain gap rather than a missing
    assertion.
  evidence:
  - reference: DOI:10.1186/s40364-024-00636-3
    reference_title: "Single-cell, single-nucleus and xenium-based spatial transcriptomics analyses reveal inflammatory activation and altered cell interactions in the hippocampus in mice with temporal lobe epilepsy"
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      kainic acid (KA) was stereotactically injected into the hippocampal CA1
      region of mice, followed by a 7-day postinjection period.
    explanation: >-
      Describes the intracerebral kainate injection paradigm whose short
      time-course and induction route differ from the human febrile-SE etiology
      and years-long latent period, framing the translational-fidelity question.
  - reference: DOI:10.1186/s40364-024-00636-3
    reference_title: "Single-cell, single-nucleus and xenium-based spatial transcriptomics analyses reveal inflammatory activation and altered cell interactions in the hippocampus in mice with temporal lobe epilepsy"
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: >-
      A notable pathological change related to TLE is hippocampal sclerosis
      (HS), which is characterized by neuronal loss, gliosis, and an increased
      neuron fibre density.
    explanation: >-
      Confirms the rodent model reproduces HS-like neuronal loss and gliosis,
      establishing that model evidence exists while its match to the human
      sclerosis pattern and laterality remains the open question.
  proposed_experiments:
  - experiment_id: exp_mtlehs_cross_species_sclerosis_concordance
    name: Cross-species concordance of sclerosis pattern and latent-period biology
    description: >-
      Systematically compare rodent post-status-epilepticus hippocampi with
      resected human MTLE-HS tissue for subfield-specific neuronal loss pattern,
      laterality, gliosis, and mossy fiber sprouting, and map the temporal
      dynamics of epileptogenesis onto the human latent-period timescale.
    experiment_type:
      preferred_term: cross-species histopathological concordance study
    readouts:
    - name: Sclerosis pattern and laterality concordance
      target: pathophysiology#Hippocampal Sclerosis
      biological_processes:
      - preferred_term: chemical synaptic transmission
        term:
          id: GO:0007268
          label: chemical synaptic transmission
        modifier: DYSREGULATED
      assays:
      - preferred_term: histopathology
      - preferred_term: immunohistochemistry
      direction: POSITIVE
    controls:
    - name: Non-epileptic autopsy and naive rodent hippocampus
      description: >-
        Non-epileptic human autopsy hippocampus and naive rodent hippocampus as
        baselines for the sclerosis-pattern comparison.
    decision_criterion: >-
      Rodent post-SE models are supported as faithful when their subfield
      sclerosis pattern, laterality, and epileptogenic time-course scale
      concordantly to human MTLE-HS; systematic divergence flags a
      human-model mismatch requiring cautious extrapolation.
    would_support:
    - pathophysiology#Hippocampal Sclerosis

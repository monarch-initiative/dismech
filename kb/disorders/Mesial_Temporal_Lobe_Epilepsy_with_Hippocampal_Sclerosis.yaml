- accession: geo:GSE186334
  title: Compartment-specific total RNA profile of Hippocampal and Cortical cells from Mesial Temporal Lobe Epilepsy tissue
  description: Mesial temporal lobe epilepsy (mTLE) is a chronic neurological disease characterized by recurrent seizures. The pathogenic mechanisms underlying TLE involve defects in post-transcriptional regulation of gene expression. So far, transcriptome profiles from epileptic tissue have been performed using whole cells, thereby lacking information on RNA localization and function at a subcellular level. In this project, we set out to understand the compartment-specific total RNA profile of human mTLE tissue samples. For this, we had established a protocol to isolate cytoplasmic and nuclear compartments from human hippocampal tissue.

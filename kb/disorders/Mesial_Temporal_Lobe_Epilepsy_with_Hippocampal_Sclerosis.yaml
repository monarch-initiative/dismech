- accession: geo:GSE245228
  title: Compartment-specific small RNA sequencing profile of Hippocampal and Cortical cells from Mesial Temporal Lobe Epilepsy tissue
  description: Mesial temporal lobe epilepsy (mTLE) is a chronic neurological disease characterized by recurrent seizures. The pathogenic mechanisms underlying TLE involve defects in post-transcriptional regulation of gene expression. Previously we have shown the differences in cell compartment specific differential expression of coding transcripts in mTLE hippocampal and cortical samples compared to post-mortem controls (Vangoor et al., MedRxiv. 2021).

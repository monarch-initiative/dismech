    term:
      id: UBERON:0001885
      label: dentate gyrus of hippocampal formation
  evidence:
  - reference: PMID:38383054
    reference_title: "Radiologic Classification of Hippocampal Sclerosis in Epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Ongoing seizure activity and neuronal loss in CA4 also leads to mossy
      fiber sprouting into the granule cell layer in the DG.
    explanation: >-
      Documents structural mossy fiber collateral sprouting into the dentate
      granule cell layer following CA4 neuronal loss.
  - reference: PMID:38383054
    reference_title: "Radiologic Classification of Hippocampal Sclerosis in Epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The presence of mossy fiber sprouting is typically absent in the
      pathologic specimens of patients with TLE without HS.
    explanation: >-
      Establishes dentate mossy fiber sprouting as a structural histopathologic
      hallmark specific to hippocampal sclerosis in TLE.
  downstream:
  - target: Hippocampal Circuit Hyperexcitability
    causal_link_type: DIRECT
    description: >-
      Recurrent excitatory mossy-fiber collaterals amplify dentate granule cell
      and downstream hippocampal circuit hyperexcitability in proportion to the
      extent of sprouting.
    evidence:
    - reference: PMID:38383054
      reference_title: "Radiologic Classification of Hippocampal Sclerosis in Epilepsy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Hyperexcitability of neurons in the granule cell layer seems to be
        directly linked to the extent of mossy fiber sprouting.
      explanation: >-
        Directly links the anatomical extent of dentate mossy fiber sprouting to
        granule-cell neuronal hyperexcitability.

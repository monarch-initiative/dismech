  title: Gene expression profiling in dentate granule cells from patients with mesial temporal lobe epilepsy with or without hippocampal sclerosis
  description: Hippocampal sclerosis (HS) is the most common neuropathological finding of medically intractable cases of mesial temporal lobe epilepsy (MTLE), the most common form of partial epilepsy. Within the dentate gyrus, HS may be associated with granule cell dispersion and aberrant mossy fiber sprouting, and these pathological changes are accompanied by a range of molecular changes.

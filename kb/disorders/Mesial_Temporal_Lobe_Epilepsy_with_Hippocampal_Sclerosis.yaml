    term:
      id: GO:0007268
      label: chemical synaptic transmission
    modifier: DECREASED
  - preferred_term: reactive gliosis
    term:
      id: GO:0150103
      label: reactive gliosis
    modifier: INCREASED
  locations:
  - preferred_term: Ammon's horn
    term:
      id: UBERON:0001954
      label: Ammon's horn
  downstream:
  - target: Mossy Fiber Sprouting
    causal_link_type: DIRECT
    description: >-
      Neuronal loss in CA4 within the sclerotic hippocampus triggers aberrant
      collateral sprouting of dentate granule cell mossy fibers into the dentate
      granule cell layer.
    evidence:
    - reference: PMID:38383054
      reference_title: "Radiologic Classification of Hippocampal Sclerosis in Epilepsy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Ongoing seizure activity and neuronal loss in CA4 also leads to mossy fiber sprouting into the granule cell layer in the DG."
      explanation: CA4 neuronal loss in hippocampal sclerosis drives aberrant mossy fiber sprouting into the dentate granule cell layer.
  - target: Hippocampal Circuit Hyperexcitability
    causal_link_type: DIRECT
    description: >-
      Subfield neuronal loss and reorganization in CA1 disrupt the trisynaptic
      pathway and produce subicular disinhibition and synchronized spontaneous
      excitability.
    evidence:
    - reference: PMID:38383054
      reference_title: "Radiologic Classification of Hippocampal Sclerosis in Epilepsy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Disruption of the trisynaptic pathway, along with neuronal loss and
        reorganization in CA1, leads to simultaneous disinhibition and
        synchronization of spontaneous excitability in the subiculum, driving
        epileptogenesis in HS.
      explanation: Connects CA1 neuronal loss and trisynaptic pathway disruption in hippocampal sclerosis directly to subicular disinhibition and synchronized circuit hyperexcitability.
  - target: Large-Scale Network Reorganization
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Structural injury and gliotic remodeling in the sclerotic hippocampus can
      drive broader extrahippocampal hub reorganization in MTLE-HS.
    evidence:
    - reference: PMID:25809843
      reference_title: "Mesial temporal lobe epilepsy with hippocampal sclerosis is a network disorder with altered cortical hubs."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Our analysis of resting-state MEG signals shows that altered electrophysiologic functional hubs in mTLE patients reflect pathophysiologic brain network reorganization."
      explanation: Patients with MTLE-HS exhibit altered functional network hubs reflecting pathophysiologic brain network reorganization.
  - target: Hippocampal Atrophy
    causal_link_type: DIRECT
    description: >-
      Subfield neuronal depletion and astrogliosis manifest radiologically as
      hippocampal subfield and whole-hippocampal volume loss on MRI.
    evidence:
    - reference: PMID:38383054
      reference_title: "Radiologic Classification of Hippocampal Sclerosis in Epilepsy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Type 1 (classic HS): severe volume loss across all hippocampal subfields or, less commonly, severe volume loss of CA1 and the hilum with sparing of CA2/CA3."
      explanation: Directly connects histopathologic hippocampal sclerosis to hippocampal subfield volume loss on MRI.
  - target: Refractory Drug Response
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Progressive hippocampal damage and synaptic reorganization underlie
      pharmacoresistance to anti-seizure medications in MTLE-HS.
    evidence:
    - reference: PMID:38383054
      reference_title: "Radiologic Classification of Hippocampal Sclerosis in Epilepsy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "TLE tends to become more resistant to treatment over time due to the progression of seizure-induced damage in the hippocampus and synaptic reorganization."
      explanation: Links progressive hippocampal sclerosis and synaptic reorganization to drug resistance.
  evidence:
  - reference: PMID:33197783
    reference_title: "Proteomic profile differentiating between mesial temporal lobe epilepsy with and without hippocampal sclerosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We confirmed histologically that all MTLE-HS cases examined exhibited
      severe neuronal cell loss and remarkable astrocytic gliosis in the
      hippocampi.
    explanation: >-
      Directly supports hippocampal sclerosis as a core lesion characterized by
      neuronal loss and astroglial remodeling.
  - reference: PMID:33197783
    reference_title: "Proteomic profile differentiating between mesial temporal lobe epilepsy with and without hippocampal sclerosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the sclerotic hippocampus, the expression levels of several synaptic
      proteins were decreased, and those of some glia-associated proteins
      increased.
    explanation: >-
      Supports synaptic and glial remodeling within sclerotic hippocampal
      tissue in MTLE-HS.
- name: Mossy Fiber Sprouting
  biological_scale: CELLULAR
  description: >-
    Aberrant collateral sprouting of dentate gyrus granule cell mossy-fiber
    axons back into the dentate granule cell layer following hilar (CA4)
    neuronal loss, forming recurrent excitatory synaptic collaterals that are
    characteristic of hippocampal sclerosis and typically absent in TLE without
    hippocampal sclerosis.
  cell_types:
  - preferred_term: dentate gyrus granule cell
    term:
      id: CL:2000089
      label: dentate gyrus granule cell

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Seizures in mesial temporal lobe epilepsy with hippocampal sclerosis are
      typically drug-resistant, and mesial temporal lobe epilepsy with
      hippocampal sclerosis is frequently associated with important
      co-morbidities, mandating the search for better understanding and
      treatment.
    explanation: Establishes pharmacoresistance to anti-seizure medications as typical of MTLE-HS.
genetic:
- name: SCN1A
  gene_term:
    preferred_term: SCN1A
    term:
      id: hgnc:10585
      label: SCN1A
  relationship_type: SUSCEPTIBILITY
  variant_origin: GERMLINE
  association: Common intronic variant rs7587026 associated with MTLE-HS with childhood febrile seizures
  notes: >-
    Genome-wide association meta-analysis (1,977 MTLE-HS cases and 11,143
    controls across discovery and replication) identified a genome-wide
    significant susceptibility signal at SCN1A intron variant rs7587026
    specifically in MTLE-HS with a history of childhood febrile seizures, but
    not in febrile seizures without subsequent epilepsy.
  evidence:
  - reference: PMID:24014518
    reference_title: "Epilepsy, hippocampal sclerosis and febrile seizures linked by common genetic variation around SCN1A."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Meta-analysis revealed a genome-wide significant association for mesial
      temporal lobe epilepsy with hippocampal sclerosis with febrile seizures at
      the sodium channel gene cluster on chromosome 2q24.3 [rs7587026, within an
      intron of the SCN1A gene, P = 3.36 × 10(-9), odds ratio (A) = 1.42, 95%
      confidence interval: 1.26-1.59].
    explanation: Replicated GWAS meta-analysis establishes common SCN1A variation as a genetic susceptibility factor for MTLE-HS with febrile seizures.
diagnosis:
- name: High-Resolution Brain MRI
  description: >-
    High-resolution oblique coronal 2D T2 turbo spin-echo (TSE) brain MRI
    orthogonal to the hippocampal long axis is the primary sequence for
    assessing subfield-level hippocampal volume loss (CA1, CA2/CA3, and
    CA4/dentate hilum), increased T2 signal, and loss of internal hippocampal
    architecture; T2-FLAIR can provide supportive evidence when paired with
    volume loss but is not suitable as a primary hippocampal screening sequence.
  diagnosis_term:
    preferred_term: brain magnetic resonance imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging

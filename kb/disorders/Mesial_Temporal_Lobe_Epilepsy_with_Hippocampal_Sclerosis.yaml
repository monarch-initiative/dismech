name: Mesial Temporal Lobe Epilepsy with Hippocampal Sclerosis
creation_date: '2026-04-05T20:02:37Z'
description: >-
  Mesial temporal lobe epilepsy with hippocampal sclerosis is a rare epilepsy
  syndrome in which seizures arise from mesial temporal limbic structures and
  are associated with unilateral or asymmetric hippocampal sclerosis, memory
  deficits, and a high likelihood of later drug resistance.
category: Complex
parents:
- Temporal Lobe Epilepsy
synonyms:
- MTLE-HS
- MTLEHS
- mTLE-HS
classifications:
  harrisons_chapter:
  - classification_value: NEUROLOGIC
    evidence:
    - reference: PMID:24014518
      reference_title: "Epilepsy, hippocampal sclerosis and febrile seizures linked by common genetic variation around SCN1A."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: "Mesial temporal lobe epilepsy with hippocampal sclerosis (MTLEHS) is typically a serious epilepsy syndrome and the most common drug-resistant epilepsy"
      explanation: MTLE-HS is a chronic focal epilepsy syndrome within clinical neurology.
disease_term:
  preferred_term: mesial temporal lobe epilepsy with hippocampal sclerosis
  term:
    id: MONDO:0020476
    label: mesial temporal lobe epilepsy with hippocampal sclerosis
has_subtypes:
- name: ILAE Type 1 Hippocampal Sclerosis
  description: >-
    Classic hippocampal sclerosis (accounting for 60%-80% of surgical TLE
    series), defined by severe neuronal loss and gliosis across hippocampal
    subfields, predominantly in CA1 and CA4. Strongly associated with initial
    precipitating injuries before age 5 years, earlier seizure onset, and higher
    postsurgical seizure-freedom rates than types 2 and 3.
  evidence:
  - reference: DOI:10.1111/epi.12220
    reference_title: "International consensus classification of hippocampal sclerosis in temporal lobe epilepsy: A Task Force report from the <scp>ILAE</scp> Commission on Diagnostic Methods"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      HS International League Against Epilepsy ( ILAE ) type 1 refers always to
      severe neuronal cell loss and gliosis predominantly in CA 1 and CA 4
      regions, compared to CA 1 predominant neuronal cell loss and gliosis ( HS
      ILAE type 2), or CA 4 predominant neuronal cell loss and gliosis ( HS ILAE
      type 3).
    explanation: Defines ILAE type 1 hippocampal sclerosis by severe CA1 and CA4 neuronal loss and gliosis.
  - reference: PMID:38383054
    reference_title: "Radiologic Classification of Hippocampal Sclerosis in Epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The most common HS type, affecting 60%–80% of surgical patients with TLE,
      is ILAE type 1. Type 1 is classified by the involvement of all hippocampal
      subfields, with CA1 often the most affected, but also with moderate or
      severe involvement of other subfields (Fig 5).
    explanation: Quantifies the surgical-series frequency and pan-subfield pathology of ILAE type 1 HS.
- name: ILAE Type 2 Hippocampal Sclerosis
  description: >-
    CA1-predominant hippocampal sclerosis (accounting for 5%-10% of surgical TLE
    series), characterized by isolated or disproportionately severe neuronal
    loss and gliosis in CA1 with relative preservation of CA2, CA3, and the
    hilar CA4/dentate region, and a median initial precipitating event age of
    approximately 6 years.
  evidence:
  - reference: PMID:38383054
    reference_title: "Radiologic Classification of Hippocampal Sclerosis in Epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Type 2 HS, on the other hand, exhibits predominant CA1 cell loss, but with
      minimal involvement of other subfields (Fig 6). This “CA1-predominant”
      pattern is less common, affecting 5%–10% of surgical patients with TLE.
    explanation: Defines CA1-predominant ILAE type 2 hippocampal sclerosis and its surgical-series frequency.
- name: ILAE Type 3 Hippocampal Sclerosis
  description: >-
    CA4/hilar-predominant hippocampal sclerosis (historical end folium sclerosis,
    accounting for 4%-7% of surgical TLE series), characterized by predominant
    neuronal loss and gliosis in CA4 and the dentate gyrus with minimal
    involvement of CA1-CA3, a later median initial precipitating event age
    (approximately 13 years), and more frequent dual pathology.
  evidence:
  - reference: PMID:38383054
    reference_title: "Radiologic Classification of Hippocampal Sclerosis in Epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Type 3 HS is the least common, affecting 4%–7% of surgical patients with
      TLE. It is characterized by predominant cell loss in CA4 and DG, with
      minimal involvement of CA1, CA2, and CA3 (historical “end folium
      sclerosis”) (Fig 7).
    explanation: Defines CA4/dentate-predominant ILAE type 3 hippocampal sclerosis and its surgical-series frequency.
pathophysiology:
- name: Hippocampal Sclerosis
  biological_scale: TISSUE
  description: >-
    The sclerotic hippocampus in MTLE-HS shows severe subfield-selective
    neuronal loss (classically CA1 and CA4 in ILAE type 1 HS), prominent
    reactive astrocytic gliosis, and reduced synaptic protein abundance,
    forming the core structural lesion of the epileptogenic mesial temporal focus.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  - preferred_term: astrocyte
    term:
      id: CL:0000127
      label: astrocyte

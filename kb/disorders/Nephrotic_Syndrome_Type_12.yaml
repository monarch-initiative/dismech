      evidence_source: IN_VITRO
      snippet: >-
        NUP93 mutations either disrupt NPC integrity (Fig. 3a–c) (mutations p.del ex13, p.Arg388Trp, and
        p.Lys442Asnfs*14) or abrogate the interaction of NUP93 with SMAD4 (Fig. 4c) or importin7 (Fig. 4g) (mutations
        p.Lys442Asnfs*14, p.Gly591Val, p.Tyr629Cys)
      explanation: Two classes of patient allele, one of which acts on SMAD signalling without disrupting the pore.
- name: Disrupted Nuclear Pore Complex Assembly
  biological_scale: CELLULAR
  description: >-
    NUP93 is a scaffold of the inner ring of the nuclear pore complex and recruits its partner NUP205. Truncating and
    exon-skipping alleles fail to localize to the nuclear envelope and fail to rebuild pores in depleted Xenopus egg
    extracts. In a patient biopsy NUP93 staining was reduced in the nuclei of glomerular and tubular cells, and deleting
    Nup93 in mouse podocytes lowers nuclear pore density.

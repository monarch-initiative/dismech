genetic:
- name: NUP93
  gene_term:
    preferred_term: NUP93
    term:
      id: hgnc:28958
      label: NUP93
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    The founding report introduced the symbol NPHS12 (OMIM 616892). Biallelic NUP93 variants have also been reported in
    two brothers with non-progressive congenital ataxia and no reported kidney disease (PMID:30741391); that phenotype is
    not part of this entry.
  variants:
  - name: c.1772G>T p.Gly591Val
    description: >-
      European founder allele and the most common NUP93 variant. Homozygous in one founding family (A1626, Turkish) and
      compound heterozygous in three, and in later reports including the collapsing-FSGS brothers and the first patient
      with post-transplant recurrence. Abolishes binding to SMAD4 and
      importin-7 but supports pore assembly.
    evidence:
    - reference: PMID:26878725
      reference_title: Mutations in nuclear pore genes NUP93, NUP205 and XPO5 cause steroid-resistant nephrotic syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The variants p.Gly591Val and p.Tyr629Cys apparently represent European and Turkish founder alleles,
        respectively (Table 1).
      explanation: Founder status.
    - reference: PMID:35211795
      reference_title: Exploring the relevance of NUP93 variants in steroid-resistant nephrotic syndrome using next
        generation sequencing and a fly kidney model.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        To date, 15 different NUP93 mutations are reported in 16 SRNS patients with the most common variant,
        p.(Gly591Val), found in 9/16 cases
      explanation: Frequency of the founder allele in the published cases.
  - name: p.Tyr629Cys
    description: >-
      Turkish founder allele; homozygous in founding families and compound heterozygous with p.Arg525Trp in a Japanese
      patient. Abolishes binding to SMAD4 and importin-7.
    evidence:
    - reference: PMID:26878725
      reference_title: Mutations in nuclear pore genes NUP93, NUP205 and XPO5 cause steroid-resistant nephrotic syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The variants p.Gly591Val and p.Tyr629Cys apparently represent European and Turkish founder alleles,
        respectively (Table 1).
      explanation: Founder status.
    - reference: PMID:31517150
      reference_title: In Vivo Expression of NUP93 and Its Alteration by NUP93 Mutations Causing Focal Segmental
        Glomerulosclerosis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Whole-exome sequencing identified a compound heterozygous NUP93 mutation comprising a novel missense mutation
        p.Arg525Trp, and a previously reported mutation, p.Tyr629Cys, in a patient with FSGS that developed ESRD at the
        age of 6 years.
      explanation: The Japanese compound heterozygous patient.
  - name: c.1537+1G>A (exon 13 skipping)
    description: >-
      Canonical splice-donor variant causing in-frame skipping of exon 13; the product fails to reach the nuclear envelope
      and fails to rebuild pores.
    evidence:
    - reference: PMID:26878725
      reference_title: Mutations in nuclear pore genes NUP93, NUP205 and XPO5 cause steroid-resistant nephrotic syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We show that the splice site mutation (c.1537+1G>A) detected in family A1394 (Table 1, Fig. 1d) leads to aberrant
        splicing with in-frame skipping of exon 13
      explanation: Patient RNA shows exon skipping.
  - name: c.2137-18G>A
    description: >-
      Deep intronic variant causing exon 20 skipping, in trans with the nonsense variant p.Lys243* in a 9-year-old boy
      with FSGS. Also found, in trans with the splice-acceptor variant c.565-2A>G, in the adult-onset patient.
    evidence:
    - reference: PMID:31015583
      reference_title: Molecular assay for an intronic variant in NUP93 that causes steroid resistant nephrotic syndrome.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Both RNA sequencing and in vitro splicing assay showed exon 20-skipping by the intronic variant.
      explanation: Splicing defect confirmed by RNA sequencing and minigene assay.
    - reference: PMID:41209161
      reference_title: Adult-Onset Nephrotic Syndrome and Optic Nerve Atrophy Associated With NUP93 Mutation.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        This showed the presence of 2 heterozygous NUP93 variants predicted to alter splicing in silico:
        NM_014669.5:c.565-2A>G(;)c.2137-18G>A.
      explanation: Second patient carrying the intronic variant.
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_bbef3f71-5ee5-434e-a14c-c05c1cc2569b-2022-07-26T060000.000Z
    evidence:
    - reference: CGGV:assertion_bbef3f71-5ee5-434e-a14c-c05c1cc2569b-2022-07-26T060000.000Z
      reference_title: NUP93 / nephrotic syndrome, type 12 (Definitive)
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: In summary, NUP93 is definitively associated with AR nephrotic syndrome.
      explanation: ClinGen Glomerulopathy GCEP classification, approved 26 July 2022.
  evidence:
  - reference: PMID:26878725
    reference_title: Mutations in nuclear pore genes NUP93, NUP205 and XPO5 cause steroid-resistant nephrotic syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we here demonstrate that specific mutations of NUP93, NUP205, or XPO5 cause a distinct entity of SRNS and we
      introduce the terms “NPHS11”, “NPHS12”, and “NPHS13”, respectively.
    explanation: Names NUP93 disease NPHS12.

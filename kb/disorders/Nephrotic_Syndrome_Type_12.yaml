phenotypes:
- category: Renal
  name: Nephrotic Syndrome
  description: >-
    Steroid-resistant nephrotic syndrome, usually beginning in early childhood. In the founding cohort onset was between
    1 and 6 years; a 2025 review gives a median onset of 3 years. Onset in the first year and in adulthood (one patient
    at 25 years) are both reported.
  phenotype_term:
    preferred_term: Steroid-resistant nephrotic syndrome
    term:
      id: HP:0012588
      label: Steroid-resistant nephrotic syndrome
    onset:

  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:26878725
    reference_title: Mutations in nuclear pore genes NUP93, NUP205 and XPO5 cause steroid-resistant nephrotic syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Phenotypically, all 7 individuals of 6 families with recessive NUP93 mutations had SRNS that manifested early, i.e.
      between 1 and 6 years of age, and caused ESKD between ages 1 and 11 years (Table 1).
    explanation: SRNS in every patient of the founding cohort, onset 1-6 years.
  - reference: PMID:39331077
    reference_title: Nucleoporin-associated steroid-resistant nephrotic syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The median ages at onset of NUP85-, NUP93-, NUP107-, NUP133-, NUP160-, and NUP205-associated SRNS are 7, 3, 4.1, 9,
      7, and 2 years, respectively.
    explanation: Pooled literature review; median onset 3 years for NUP93.
  - reference: PMID:41209161
    reference_title: Adult-Onset Nephrotic Syndrome and Optic Nerve Atrophy Associated With NUP93 Mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this report, we present the case of a 25-year-old White patient who presented with rapidly progressive chronic
      kidney disease, congenital bilateral optic nerve atrophy and steroid-resistant nephrotic syndrome.
    explanation: Adult-onset case, extending the age range.

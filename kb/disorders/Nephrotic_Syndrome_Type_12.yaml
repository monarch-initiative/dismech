- name: Impaired BMP7-SMAD Nuclear Signaling
  biological_scale: CELLULAR
  description: >-
    NUP93 binds SMAD4, phosphorylated SMAD1/5 and the importer importin-7. NUP93 knockdown blocks BMP7-induced nuclear
    accumulation of SMAD4 and SMAD reporter activity in podocytes and HEK293 cells, and none of the five patient alleles
    tested rescues either. The founding report proposed this as the shared pathogenic pathway. It is a cell-line finding
    and has not been tested in an animal model or patient tissue.

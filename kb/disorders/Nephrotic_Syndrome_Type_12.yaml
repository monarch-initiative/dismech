  notes: >-
    The founding report found three families among about 1,800 screened by exon sequencing and three among 160 studied
    by homozygosity mapping and exome sequencing. The UK NephroS study found five among 337 sequenced children.
    GeneReviews lists NUP93 as accounting for under 1% of genetic SRNS. Further single families have been reported from
    China, India, Japan, Poland, the Czech Republic and the USA, and in an adult of Moldovan origin.
  evidence:
  - reference: PMID:26878725
    reference_title: Mutations in nuclear pore genes NUP93, NUP205 and XPO5 cause steroid-resistant nephrotic syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      By high-throughput exon sequencing11,14,15 in a worldwide cohort of 1,800 families with SRNS we detected 3
      additional families (A2403, A3256, and A1394) with compound heterozygous truncating mutations or highly conserved
      missense mutations of NUP93
    explanation: Founding cohort; three further families came from homozygosity mapping and exome sequencing.
  - reference: PMID:35211795
    reference_title: Exploring the relevance of NUP93 variants in steroid-resistant nephrotic syndrome using next generation
      sequencing and a fly kidney model.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Six novel homozygous and compound heterozygous NUP93 variants were detected in 3 sporadic and 2 familial paediatric
      onset SRNS
    explanation: Five NUP93 cases in the UK national SRNS cohort.
  - reference: PMID:35211795
    reference_title: Exploring the relevance of NUP93 variants in steroid-resistant nephrotic syndrome using next generation
      sequencing and a fly kidney model.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Exome sequencing was performed on the first 187 patients, with an additional 150 patients also whole genome sequenced.
    explanation: Size of the sequenced cohort (187 + 150 = 337).
pathophysiology:
- name: Biallelic NUP93 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Homozygous or compound heterozygous NUP93 variants: missense alleles (including the European founder p.Gly591Val and
    the Turkish founder p.Tyr629Cys), truncating alleles, and splice variants that skip an exon. ClinGen records loss of
    function as the mechanism. Deleting Nup93 during mouse kidney development is embryonic lethal; that disease alleles
    must therefore leave residual function is a curator inference, not a published finding.

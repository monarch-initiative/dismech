treatments:
- name: Kidney Transplantation
  description: >-
    The definitive treatment for kidney failure. Most reported recipients have had no recurrence, but post-transplant
    nephrotic syndrome has been reported in two patients, both responding to plasma exchange; a review puts the recurrence
    rate at 12.5%, which is unusual for a monogenic SRNS. The second recurrence (UK patient S013682) is in a patient
    homozygous for p.Lys637Glu, which its authors classify as a variant of uncertain significance.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: kidney transplantation
    term:
      id: NCIT:C15265
      label: Kidney Transplantation
  target_mechanisms:
  - target: Kidney Failure
    treatment_effect: BYPASSES
    description: Replaces the kidney carrying the podocyte lesion.

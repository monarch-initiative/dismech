discussions:
- discussion_id: nup93_smad_versus_transport
  kind: OPEN_QUESTION
  prompt: Is impaired BMP7-SMAD signalling or general loss of nuclear transport the main cause of podocyte injury?
  rationale: >-
    The founding report proposed SMAD signalling as the shared pathway, from cell-line assays. The 2026 podocyte knockout
    mouse instead shows reduced pore density, mislocalized podocyte transcription factors and DNA damage, and its abstract
    does not report SMAD signalling. Two further routes are shown only for other nucleoporins: CDC42 dysregulation after
    loss of NUP85, NUP107, NUP133 or NUP160, and YAP/TAZ nuclear import that depends on NUP205, NUP93's inner-ring
    partner. None of these accounts is exclusive, and none has been tested with a NUP93 patient allele in vivo.
  attaches_to:
  - pathophysiology#Impaired BMP7-SMAD Nuclear Signaling
  - pathophysiology#Reduced Nuclear Localization of Podocyte Transcription Factors
  evidence:
  - reference: PMID:26878725
    reference_title: Mutations in nuclear pore genes NUP93, NUP205 and XPO5 cause steroid-resistant nephrotic syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In all individuals with mutations in NUP93 there was a defect in SMAD signaling, suggesting SMAD signaling as the
      relevant pathogenic pathway shared by these mutations.
    explanation: The SMAD account.
  - reference: PMID:41563289
    reference_title: Mechanisms of Podocyte Injury Due to Loss of the Nucleoporin NUP93.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      At this stage, immunofluorescence staining revealed reduced nuclear abundance of podocyte-specific transcription
      factors, which was due to cytoplasmic redistribution.
    explanation: The transcription factor account.
  - reference: PMID:40298220
    reference_title: Loss of Nup160 dysregulates Cdc42 in the podocytes of podocyte-specific Nup160 knockout mice.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In conclusion, loss of Nup160 dysregulated Cdc42 in the podocytes of the Nup160podo-/- mice with proteinuria and
      fusion of podocyte foot processes.
    explanation: CDC42 route, shown for the outer-ring nucleoporin NUP160, not for NUP93.
  - reference: PMID:37565816
    reference_title: The role of the FSGS disease gene product and nuclear pore protein NUP205 in regulating nuclear localization
      and activity of transcriptional regulators YAP and TAZ.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: Moreover, we demonstrate that NUP205 is essential for YAP/TAZ nuclear import.
    explanation: YAP/TAZ route, shown for NUP205, the inner-ring partner of NUP93, not for NUP93 itself.
- discussion_id: nup93_post_transplant_recurrence
  kind: KNOWLEDGE_GAP
  prompt: Why does nephrotic syndrome recur after transplantation in some NUP93 patients?
  rationale: >-
    Recurrence is rare in monogenic SRNS, yet two NUP93 patients relapsed after transplantation and both responded to
    plasma exchange, which suggests a circulating factor. The mechanism is unknown, and the second patient's
    homozygous p.Lys637Glu is a variant of uncertain significance, so that case may not be NUP93 disease.
  attaches_to:
  - treatments#Kidney Transplantation
  evidence:
  - reference: PMID:30577294
    reference_title: 'First Report of Recurrent Nephrotic Syndrome After Kidney Transplantation in a Patient With NUP93
      Gene Mutations: A Case Report.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This is the first case of recurrent NS in a patient with NUP93 gene mutations, suggesting a new pathomechanism
      possibly involving the nucleoporins.
    explanation: The authors raise an unexplained mechanism.
  - reference: PMID:35211795
    reference_title: Exploring the relevance of NUP93 variants in steroid-resistant nephrotic syndrome using next generation
      sequencing and a fly kidney model.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: A homozygous novel p.(Lys637Glu) variant was detected in a second consanguineous case, S013682.
    explanation: Genotype of the second recurrence; Table 1 of the same paper classes it as a VUS.
  - reference: PMID:35211795
    reference_title: Exploring the relevance of NUP93 variants in steroid-resistant nephrotic syndrome using next generation
      sequencing and a fly kidney model.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Post-transplant recurrence observed in patient S013682 remains unexplained
    explanation: The authors leave the recurrence unexplained.
  - reference: PMID:34031708
    reference_title: A critical re-analysis of cases of post-transplantation recurrence in genetic nephrotic syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      We also identified a number of plausible reported cases of post-transplantation recurrence involving pathogenic
      variants in NPHS2 (8 patients, biallelic), one in WT1 (monoallelic) and one in NUP93 (biallelic).
    explanation: >-
      A 2021 re-analysis, before the UK report, accepted one NUP93 recurrence (the Czech compound heterozygous patient)
      as plausible.
notes: >-
  No dedicated GeneReviews chapter exists for this disorder; it is covered as one row of the Genetic Steroid-Resistant
  Nephrotic Syndrome Overview (PMID:34436835), which lists NUP93 as autosomal recessive, under 1% of genetic SRNS, with
  childhood onset. Extrarenal features (developmental delay, short stature, cardiomyopathy, optic atrophy, bicuspid
  aortic valve) each come from a single patient and are recorded with that caveat. Marcus Gunn syndrome in founding
  patient A1394 appears only in a table cell and is not recorded. GO has no term for podocyte proliferation, so the
  migration and proliferation node carries only the migration term.

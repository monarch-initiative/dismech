animal_models:
- name: Podocyte-specific Nup93 knockout mouse
  species: Mouse
  genotype: Nup93 conditional knockout (NPHS2-Cre)
  publication: PMID:41563289
  description: >-
    Deleting Nup93 in mature podocytes gives minimal change glomerulopathy at about 4 months, then progressive CKD with
    FSGS, podocyte loss and uremia by 6 months. Deletion during kidney development is embryonic lethal.
  modeled_mechanisms:
  - target: Disrupted Nuclear Pore Complex Assembly
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    limitations: Complete deletion, whereas patients carry hypomorphic alleles.
    evidence:
    - reference: PMID:41563289
      reference_title: Mechanisms of Podocyte Injury Due to Loss of the Nucleoporin NUP93.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Knockout of Nup93 reduced NPC density in podocyte nuclei.
      explanation: Pore loss in vivo.
  - target: Podocyte Injury and Glomerular Filtration Barrier Failure
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: ORGANISM
    limitations: >-
      Onset in adult mice after podocyte-restricted deletion; patients carry the variants in every cell from conception.
    evidence:
    - reference: PMID:41563289
      reference_title: Mechanisms of Podocyte Injury Due to Loss of the Nucleoporin NUP93.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Until 6 months of age, knockout mice developed progressive CKD with FSGS, podocyte loss, and uremia.
      explanation: Reproduces the human FSGS course.
- name: Drosophila nephrocyte Nup93 knockdown
  species: Drosophila melanogaster
  genotype: Nephrocyte-restricted RNAi of Nup93-1 or Nup93-2
  publication: PMID:35211795
  description: >-
    Silencing either fly ortholog in pericardial nephrocytes, which are podocyte-like, cuts nephrocyte number by up to 82%
    and disrupts nuclear pore staining.
  modeled_mechanisms:
  - target: Disrupted Nuclear Pore Complex Assembly
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    limitations: Knockdown rather than patient alleles; nephrocytes are an analogue of podocytes, not a glomerulus.
    evidence:
    - reference: PMID:35211795
      reference_title: Exploring the relevance of NUP93 variants in steroid-resistant nephrotic syndrome using next
        generation sequencing and a fly kidney model.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Antibody staining against the nuclear pore complex proteins was robust in wild type and parent lines but grossly
        disrupted, with loss of nuclear membrane localisation, in Nup93-1 or Nup93-2 silenced nephrocytes.
      explanation: NPC disruption in the fly podocyte analogue.

        wildtype protein or most mutants found in individuals with SRNS, but not by mutants del ex13, Arg388Trp, or
        Lys442Asnfs*14
      explanation: Xenopus egg extract depletion-addback assay; three patient alleles fail to rebuild pores.
  - target: Impaired BMP7-SMAD Nuclear Signaling
    causal_link_type: DIRECT
    description: >-
      Some alleles that leave pore assembly intact (p.Gly591Val, p.Tyr629Cys) still abolish NUP93 binding to SMAD4 and
      importin-7, so this branch does not depend on the pore assembly defect.
    evidence:
    - reference: PMID:26878725

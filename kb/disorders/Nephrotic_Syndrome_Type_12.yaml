name: Nephrotic Syndrome Type 12
description: >-
  Autosomal recessive steroid-resistant nephrotic syndrome caused by biallelic loss-of-function variants in NUP93, which
  encodes a scaffold nucleoporin of the inner ring of the nuclear pore complex. The founding report found NUP93 variants
  in six families; onset was between 1 and 6 years and kidney failure followed between 1 and 11 years. Biopsy usually
  shows focal segmental glomerulosclerosis, occasionally collapsing, and less often diffuse mesangial sclerosis. In
  cell-based and Xenopus egg-extract assays, patient alleles either disrupt nuclear pore assembly or abolish binding to
  SMAD4 and importin-7, and every allele tested fails to rescue BMP7-induced SMAD signalling. A podocyte-specific Nup93 knockout mouse loses
  nuclear pores, mislocalizes podocyte transcription factors, and develops progressive FSGS. ClinGen classifies the
  gene-disease relationship as Definitive.
category: Mendelian

    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      NUP93 tightly interacts with NUP20531 and, consistently, shRNA knockdown of NUP93 in podocytes caused depletion of
      NUP205 (Fig. 3e).
    explanation: Loss of NUP93 removes its inner-ring partner from the pore.

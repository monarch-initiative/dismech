name: Bone Fragility With Contractures Arterial Rupture And Deafness
category: Mendelian
creation_date: "2026-09-14T00:00:00Z"
synonyms:
- BCARD syndrome
- lysyl hydroxylase 3 deficiency
- LH3 deficiency
- PLOD3-related connective tissue disorder
description: >-
  BCARD is an ultra-rare autosomal recessive multisystem connective tissue disorder caused by
  biallelic loss-of-function variants in PLOD3, which encodes lysyl hydroxylase 3 (LH3).
  About eleven patients across seven reports are on record.

  **It is a collagen glycosylation disease, not a collagen hydroxylation disease, and that
  is the single most important thing about it.** LH3 is bifunctional: it hydroxylates
  collagen lysines and then glycosylates the resulting hydroxylysines. The obvious reading,
  given its name and its family, is that the lysyl hydroxylase activity is what matters.
  Mouse genetics say otherwise. A mouse carrying a mutation that blocks *only* the lysyl
  hydroxylase activity develops normally. Reducing the glucosyltransferase activity instead
  kills embryos between E9.5 and E14.5 from failed basement membrane formation, and survival
  tracks the residual glucosyltransferase level directly. The essential function is the
  sugar, not the hydroxyl.

  **The mechanism is a secretion failure, which is why the phenotype is so widely
  distributed.** Hydroxylysine-linked sugars are needed for type VI collagen to
  tetramerise inside the cell and for types IV and VI to be secreted at all. Without them
  the collagens are not merely abnormal once deposited; they do not leave the cell properly.
  Basement membranes fail wherever those collagens are needed, which is nearly everywhere,
  and the clinical picture follows the expression pattern of the enzyme: cochlea, eye, skin,
  limb, heart and cartilage.

  **The resulting phenotype is a composite of three recognised disorders.** It overlaps most
  with Stickler syndrome, with variable features of Ehlers-Danlos syndrome and of
  epidermolysis bullosa; one patient had sub-lamina-densa blistering with reduced type VII
  collagen and no COL7A1 mutation at all. A curator meeting this disease through any one of
  those three doors will see a partial picture, which is what the proposed BCARD label was
  introduced to fix.

  The vascular risk is what makes recognition urgent rather than academic: aneurysm and
  arterial dissection are part of the syndrome, and early identification changes
  surveillance.

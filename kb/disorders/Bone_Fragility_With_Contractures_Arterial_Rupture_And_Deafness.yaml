  description: LH3-deficient mice show abnormal basement membrane structure and type IV collagen distribution. The human blistering case had fragmented lamina densa but preserved type IV staining, indicating that matrix integrity cannot be inferred from staining abundance alone.
  biological_scale: TISSUE
  evidence:
  - &id008
    reference: PMID:16467571
    reference_title: Glycosylation catalyzed by lysyl hydroxylase 3 is essential for basement membranes.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: the reduction of the GGT activity of LH3 disrupts the localization of type IV collagen, and thus the formation of basement membranes during mouse embryogenesis leading to lethality at embryonic day (E) 9.5-14.5
    explanation: Hypomorphic mice connect residual glucosyltransferase activity to collagen IV localization, basement membrane formation and embryonic survival.

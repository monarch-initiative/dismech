name: Bone Fragility With Contractures Arterial Rupture And Deafness
category: Mendelian
creation_date: "2026-09-14T00:00:00Z"
synonyms:
- BCARD syndrome
- lysyl hydroxylase 3 deficiency
- LH3 deficiency
- PLOD3-related connective tissue disorder
description: >-
  BCARD is an autosomal recessive multisystem connective tissue disorder caused by biallelic pathogenic PLOD3
  variants affecting lysyl hydroxylase 3 (LH3). Skeletal fragility and contractures, cataracts or other ocular
  abnormalities, sensorineural hearing loss, and arterial complications occur in variable combinations. Skin
  blistering, developmental delay, and neurologic or visceral abnormalities broaden the phenotype. LH3 contributes
  both collagen lysine hydroxylation and hydroxylysine glucosylation, working with the galactosyltransferase
  COLGALT1. Patient studies demonstrate reduced LH3 abundance or activity and abnormal urinary collagen glycosylation
  products. Experimental loss of LH3 impairs collagen assembly, secretion, and extracellular matrix organization
  in a collagen- and model-dependent manner. Selective mouse experiments establish an essential developmental
  role for glucosyltransferase activity, while also showing structural defects after loss of hydroxylase activity.
  Human alleles can affect both functions. Management addresses documented complications and includes ocular
  and vascular monitoring; the small case literature does not establish phenotype frequencies or treatment-effect
  estimates.

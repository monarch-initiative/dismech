diagnosis:
- name: Exome or genome sequencing with glycosylated hydroxylysine assay
  description: >-
    Molecular diagnosis by exome or genome sequencing, supported by the biochemical
    signature of markedly reduced glycosylated hydroxylysine and reduced LH3 protein in skin.
    The clinical picture alone is unlikely to make the diagnosis, because it presents as a
    partial version of three better-known disorders.
  evidence:
  - reference: PMID:30463024
    reference_title: "Mutations in PLOD3, encoding lysyl hydroxylase 3, cause a complex connective tissue disorder including recessive dystrophic epidermolysis bullosa-like blistering phenotype with abnormal anchoring fibrils and type VII collagen deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole exome sequencing, combined with genome-wide homozygosity mapping, identified a homozygous missense mutation in PLOD3 encoding lysyl hydroxylase 3 (LH3)."
    explanation: Establishes the molecular route to diagnosis in a patient whose clinical picture pointed elsewhere.

    explanation: The original establishment of recessive inheritance, in the index compound heterozygote.
  - reference: PMID:40289369
    reference_title: Expanding the Clinical Spectrum of BCARD Syndrome Caused by Novel Biallelic Variants in the PLOD3 Gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "BCARD, linked to biallelic pathogenic variants in the PLOD3 gene, was characterized in 10 cases across six reports."
    explanation: Confirms biallelic inheritance across the accumulated case literature.
genetic:
- name: PLOD3
  gene_term:
    preferred_term: PLOD3
    term:
      id: hgnc:9083
      label: PLOD3
  relationship_type: CAUSATIVE
  notes: >-
    Encodes lysyl hydroxylase 3 (LH3), an endoplasmic-reticulum-resident enzyme with two
    catalytic sites at opposite ends of an elongated homodimer: an N-terminal
    glycosyltransferase domain and a C-terminal lysyl hydroxylase domain, separated by an
    accessory domain. Reported disease variants map close to the catalytic sites and can
    selectively abolish one activity or the other. Reported alleles include the index
    compound heterozygote's pair, homozygous c.809C>T p.(Pro270Leu), a homozygous missense in
    the blistering patient, and c.335A>G plus c.2158G>T in the 2025 expansion.
  evidence:
  - reference: PMID:18834968
    reference_title: A connective tissue disorder caused by mutations of the lysyl hydroxylase 3 gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One mutation dramatically reduced the sugar-transfer activity of LH3, whereas another abrogated lysyl hydroxylase activity; these changes were accompanied by reduced LH3 protein levels in cells."
    explanation: >-
      Shows the two activities are separately targetable by disease alleles, and that the
      index patient carried one of each. This is the human counterpart of the mouse
      dissection of the two functions.
  - reference: PMID:30089812
    reference_title: Molecular architecture of the multifunctional collagen lysyl hydroxylase and glycosyltransferase LH3.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Known disease-related mutations map in close proximity to the catalytic sites."
    explanation: Gives the structural interpretation of where pathogenic variants sit.
pathophysiology:
- name: PLOD3 Biallelic Loss of Function
  description: >-
    Biallelic PLOD3 variants reduce LH3 enzyme activity and, in reported patients, LH3
    protein levels in cells and skin. Individual alleles can selectively knock out either the
    glycosyltransferase or the lysyl hydroxylase site, which is what makes the separation of
    the two activities clinically as well as experimentally meaningful.
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  molecular_functions:
  - preferred_term: procollagen glucosyltransferase activity
    term:
      id: GO:0033823
      label: procollagen glucosyltransferase activity
    modifier: DECREASED
  - preferred_term: procollagen-lysine 5-dioxygenase activity
    term:
      id: GO:0008475
      label: procollagen-lysine 5-dioxygenase activity
    modifier: DECREASED
  downstream:
  - target: Loss of Hydroxylysine-Linked Glycosylation
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:30463024
    reference_title: "Mutations in PLOD3, encoding lysyl hydroxylase 3, cause a complex connective tissue disorder including recessive dystrophic epidermolysis bullosa-like blistering phenotype with abnormal anchoring fibrils and type VII collagen deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The level of LH3 was dramatically reduced in the skin and fibroblast cultures from the patient."
    explanation: Direct measurement of reduced LH3 protein in patient tissue and cultured cells.
- name: Loss of Hydroxylysine-Linked Glycosylation
  description: >-
    Collagen hydroxylysines are left without their galactosyl and glucosylgalactosyl sugars.
    This is the step that matters: a mouse blocked only in the lysyl hydroxylase activity
    develops normally, while reducing the glucosyltransferase activity is embryonic-lethal in
    proportion to how much activity is lost. In patients the deficit is measurable, as
    markedly reduced glycosylated hydroxylysine in tissue.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: peptidyl-lysine hydroxylation
    term:
      id: GO:0017185
      label: peptidyl-lysine hydroxylation
    modifier: DECREASED
  downstream:
  - target: Failure of Type IV and VI Collagen Assembly and Secretion
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:17873278
      reference_title: Secretion and assembly of type IV and VI collagens depend on glycosylation of hydroxylysines.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "loss of glycosylated hydroxylysines prevents the intracellular tetramerization of type VI collagen and leads to impaired secretion of type IV and VI collagens"
      explanation: >-
        States the causal step from missing sugars to failed assembly and secretion, which is
        exactly this edge rather than either node alone.
  evidence:
  - reference: PMID:16467571
    reference_title: Glycosylation catalyzed by lysyl hydroxylase 3 is essential for basement membranes.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mice with a mutation that blocked only the LH activity of LH3 developed normally, but showed defects in the structure of the basement membrane and in collagen fibril organization in newborn skin and lung."
    explanation: >-
      The controlled comparison that identifies which activity matters: blocking the lysyl
      hydroxylase activity alone is compatible with normal development.
  - reference: PMID:16467571
    reference_title: Glycosylation catalyzed by lysyl hydroxylase 3 is essential for basement membranes.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "survival of hypomorphic embryos and the formation of the basement membrane were directly correlated with the level of GGT activity"
    explanation: >-
      A dose-response relationship between residual glucosyltransferase activity and both
      survival and basement membrane formation, which is the strongest form this argument
      could take.
  - reference: PMID:30463024
    reference_title: "Mutations in PLOD3, encoding lysyl hydroxylase 3, cause a complex connective tissue disorder including recessive dystrophic epidermolysis bullosa-like blistering phenotype with abnormal anchoring fibrils and type VII collagen deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Analysis of hydroxylysine and its glycosylated derivatives (galactosyl-hydroxylysine and glucosyl-galactosyl-hydroxylysine) revealed marked reduction in glycosylated hydroxylysine."
    explanation: Confirms the glycosylation deficit in a patient rather than only in the mouse.
- name: Failure of Type IV and VI Collagen Assembly and Secretion
  description: >-
    Type VI collagen fails to tetramerise inside the cell, and both type IV and type VI
    collagen are secreted poorly. The defect is therefore in getting the collagen out, not
    only in how it behaves once outside. Mice retaining glycosylation but lacking the lysyl
    hydroxylase activity make slightly underglycosylated type IV and VI collagens with
    abnormal distribution, and their muscle ultrastructure resembles collagen VI knockouts
    and some Ullrich congenital muscular dystrophy patients.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: protein secretion
    term:
      id: GO:0009306
      label: protein secretion
    modifier: DECREASED
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  downstream:
  - target: Basement Membrane and Extracellular Matrix Failure
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:17873278
    reference_title: Secretion and assembly of type IV and VI collagens depend on glycosylation of hydroxylysines.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The altered distribution and aggregation of type VI collagen led to similar ultrastructural alterations in muscle to those detected in collagen VI knockout and some Ullrich congenital muscular dystrophy patients."
    explanation: >-
      Ties the collagen VI handling defect to a recognisable muscle pathology, which is part
      of why this disorder's phenotype reads as a composite of other collagen diseases.
- name: Basement Membrane and Extracellular Matrix Failure
  description: >-
    Basement membranes fail to form or are structurally abnormal. In the mouse this is
    lethal in embryogenesis when glucosyltransferase activity is low enough; in surviving
    humans it is the substrate of the multisystem phenotype. In one patient the failure
    extended to the dermal-epidermal junction, with sub-lamina-densa blistering, abnormal
    anchoring fibrils and markedly reduced type VII collagen despite a normal COL7A1.
  biological_scale: TISSUE
  cellular_components:
  - preferred_term: basement membrane
    term:
      id: GO:0005604
      label: basement membrane
  biological_processes:
  - preferred_term: collagen fibril organization
    term:
      id: GO:0030199
      label: collagen fibril organization
    modifier: DECREASED
  downstream:
  - target: Multisystem Connective Tissue Fragility
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:16467571
    reference_title: Glycosylation catalyzed by lysyl hydroxylase 3 is essential for basement membranes.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "the reduction of the GGT activity of LH3 disrupts the localization of type IV collagen, and thus the formation of basement membranes during mouse embryogenesis leading to lethality at embryonic day (E) 9.5-14.5"
    explanation: The basement membrane failure and its developmental consequence, in the mouse.
  - reference: PMID:30463024
    reference_title: "Mutations in PLOD3, encoding lysyl hydroxylase 3, cause a complex connective tissue disorder including recessive dystrophic epidermolysis bullosa-like blistering phenotype with abnormal anchoring fibrils and type VII collagen deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The blistering in the skin occurred below the lamina densa and was associated with variable density and morphology of anchoring fibrils. The level of type VII collagen expression in the skin was markedly reduced."
    explanation: >-
      The human dermal-epidermal counterpart, notable because type VII collagen is reduced
      without a COL7A1 mutation, which makes it a secondary consequence of the LH3 defect.
- name: Multisystem Connective Tissue Fragility
  description: >-
    The clinical syndrome. Tissues dependent on basement membrane and network collagen
    integrity fail across the body, with the distribution mirroring where LH3 is expressed in
    development: cochlea, eyes, skin, forelimbs, heart and cartilage.
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:31129566
    reference_title: Pathogenic variants in PLOD3 result in a Stickler syndrome-like connective tissue disorder with vascular complications.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Human lysyl hydroxylase 3/PLOD3 expression was localised to the developing cochlea, eyes, skin, forelimbs, heart and cartilage, mirroring the clinical phenotype of this disorder."
    explanation: >-
      Connects the expression pattern to the organ distribution of the phenotype, which is
      the argument that the multisystem picture is one mechanism rather than several.

    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: surrounded by sparse extracellular matrix lacking collagen fibrils
    explanation: Transmission electron microscopy of mutant zebrafish cartilage showed deficient extracellular fibrillar matrix.
  biological_processes:

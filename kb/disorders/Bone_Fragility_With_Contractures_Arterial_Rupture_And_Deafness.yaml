pathophysiology:
- name: PLOD3 Biallelic Loss of Function
  description: Biallelic pathogenic variants can reduce LH3 abundance, stability and enzymatic activity. Human alleles need not selectively affect one catalytic function. The magnitude and combination of defects vary by allele and assay.
  biological_scale: MOLECULAR
  evidence:
  - reference: PMID:30089812
    reference_title: Molecular architecture of the multifunctional collagen lysyl hydroxylase and glycosyltransferase LH3.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: LH3 N223S showed severely reduced lysyl hydroxylase and fully abolished glycosyltransferase activities
    explanation: Recombinant p.Asn223Ser impairs both activities; the study also found instability and degradation.
  - reference: PMID:30463024

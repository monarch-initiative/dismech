- name: Type VII Collagen Anchoring Fibril Disruption
  description: The p.Leu627Pro patient had reduced type VII collagen, variable anchoring-fibril density and morphology, and sub-lamina-densa cleavage. Some areas retained normal-looking fibrils. Negative testing across epidermolysis-bullosa genes and PLOD3 functional findings support this association without making negative COL7A1 testing alone proof of causality.
  biological_scale: TISSUE
  evidence:
  - &id004
    reference: PMID:30463024
    reference_title: Mutations in PLOD3, encoding lysyl hydroxylase 3, cause a complex connective tissue disorder including recessive dystrophic epidermolysis bullosa-like blistering phenotype with abnormal anchoring fibrils and type VII collagen deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: The blistering in the skin occurred below the lamina densa and was associated with variable density and morphology of anchoring fibrils. The level of type VII collagen expression in the skin was markedly reduced.
    explanation: Patient skin directly demonstrated a disrupted anchoring-fibril system and sub-lamina-densa cleavage. The study did not directly measure type VII collagen glycosylation.

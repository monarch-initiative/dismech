- name: Altered Extracellular Collagen Fibril Organization
  description: Selective hydroxylase-deficient mice show disorganized fibrils, and mutant zebrafish cartilage has sparse extracellular collagen fibrils. These findings support a matrix-organization defect, while the contribution of individual collagen substrates to human bone fragility remains unresolved.
  biological_scale: TISSUE
  evidence:
  - *id002
  - &id009
    reference: PMID:41827019
    reference_title: Succinate supplementation ameliorates musculoskeletal defects caused by PLOD3 mutations in a BCARD syndrome model.

    Biallelic PLOD3 variants. The first reported patient was a compound heterozygote; later
    families include homozygotes, among them a consanguineous family homozygous for
    c.809C>T p.(Pro270Leu).
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:

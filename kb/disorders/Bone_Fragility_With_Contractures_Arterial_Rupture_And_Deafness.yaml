  relationship_type: CAUSATIVE
  notes: >-
    PLOD3 encodes LH3, with an N-terminal glucosyltransferase domain, an accessory domain, and a C-terminal
    lysyl hydroxylase domain. Reported alleles include compound heterozygous p.Asn223Ser/p.Cys691AlafsTer9,
    homozygous p.Leu627Pro, p.Pro270Leu and p.Leu406del, and the 2025 c.335A>G/c.2158G>T pair. The first pair
    affects both enzyme functions and protein abundance, rather than selectively separating them. RNA analysis
    is important: c.335A>G produces a four-base exon-3 truncation and frameshift; in a 2026 patient fibroblast
    study, c.1354C>T produced an in-frame p.Arg452_Val453del transcript rather than the predicted p.Arg452Ter
    product. Residual function and clinical severity cannot be assigned from domain position alone.

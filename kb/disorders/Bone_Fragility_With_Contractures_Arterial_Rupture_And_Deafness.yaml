    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: The level of LH3 was dramatically reduced in the skin and fibroblast cultures from the patient.
    explanation: Patient tissue and cultured fibroblasts showed reduced LH3 protein.

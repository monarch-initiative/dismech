- name: Genetic Counseling and Family Testing
  description: Discuss autosomal recessive inheritance and test relatives for the familial alleles. When both parents are heterozygous carriers, Mendelian recurrence is one in four per pregnancy. RNA or functional studies may be needed to interpret splice-altering or otherwise uncertain variants.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:18834968
    reference_title: A connective tissue disorder caused by mutations of the lysyl hydroxylase 3 gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    snippet: Our restriction analysis indicated that mutation 1 was inherited from the father and mutation 2 was inherited from the mother
    explanation: Parental segregation supports recessive counseling; the recurrence fraction follows Mendelian inheritance, not an observed cohort rate.
diagnosis:
- name: Biallelic PLOD3 Molecular Diagnosis
  description: Sequence PLOD3 in a patient with compatible connective tissue features, using a panel or exome/genome approach as appropriate, and establish segregation of candidate alleles. A rare variant or computational prediction alone does not confirm BCARD.
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:30463024
    reference_title: Mutations in PLOD3, encoding lysyl hydroxylase 3, cause a complex connective tissue disorder including recessive dystrophic epidermolysis bullosa-like blistering phenotype with abnormal anchoring fibrils and type VII collagen deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: Whole exome sequencing, combined with genome-wide homozygosity mapping, identified a homozygous missense mutation in PLOD3 encoding lysyl hydroxylase 3 (LH3).
    explanation: Documents the molecular route in the blistering patient.
- name: RNA Analysis of Suspected Splice-Altering Variants
  description: Transcript analysis can establish an unexpected splice consequence, including an in-frame deletion instead of a predicted stop-gain product. Results need interpretation in the assayed tissue and alongside phenotype and segregation.
  evidence:
  - reference: PMID:40289369
    reference_title: Expanding the Clinical Spectrum of BCARD Syndrome Caused by Novel Biallelic Variants in the PLOD3 Gene.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: The first variant functions as a cryptic splice site variant, and RNA analysis confirmed that it causes a 4 bp truncation of exon 3.
    explanation: The reported c.335A>G allele acts through aberrant splicing; the resulting frameshift is p.Asp112AlafsTer4.
  - reference: PMID:41827019
    reference_title: Succinate supplementation ameliorates musculoskeletal defects caused by PLOD3 mutations in a BCARD syndrome model.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: the c.1354 C > T transition created a premature GT splice donor site leading to a 6-bp in frame deletion
    explanation: Patient-derived RNA showed an in-frame deletion affecting Arg452 and Val453; a predicted stop-gain annotation does not describe the observed transcript.
- name: Collagen Modification and LH3 Protein Studies
  description: Urinary collagen-derived hydroxylysine glycosides and pyridinoline products, or LH3 protein measurements in patient-derived cells, can support a functional defect. Availability is limited and validated BCARD diagnostic thresholds are not established. Reduced glycosylation products can also occur in ARC syndrome.
  evidence:
  - *id006
  - reference: PMID:36203519
    reference_title: 'Cerebral small vessel disease caused by PLOD3 mutation: Expanding the phenotypic spectrum of lysyl hydroxylase-3 deficiency.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: Western blotting showed markedly reduced levels of LH3 in the patient
    explanation: Patient fibroblasts showed reduced LH3; urine pyridinoline and enzyme activity were not measured in this case.
- name: Skin Ultrastructure in Blistering Presentations
  description: Sub-lamina-densa cleavage, abnormal anchoring fibrils and reduced type VII collagen can resemble COL7A1-related dystrophic epidermolysis bullosa. Molecular testing and the multisystem presentation determine the diagnosis; immunostaining alone is not PLOD3-specific.
  evidence:
  - *id004
- name: Neuroimaging and EEG for Neurologic Presentations
  description: MRI and EEG characterized bleeding foci, white-matter abnormalities, cerebral atrophy and hypsarrhythmia in the p.Leu406del child. Normal MRA/MRV did not exclude the imaging-based small-vessel phenotype. This is diagnostic characterization of a symptomatic case, not a universal screening protocol.
  evidence:
  - reference: PMID:36203519
    reference_title: 'Cerebral small vessel disease caused by PLOD3 mutation: Expanding the phenotypic spectrum of lysyl hydroxylase-3 deficiency.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: The imaging features of the patient were consistent with the diagnosis of cerebral SVD. Electroencephalography (EEG) suggested hypsarrhythmia.
    explanation: MRI supported small-vessel involvement and EEG identified the epileptic pattern; no vascular biopsy established the mechanism.

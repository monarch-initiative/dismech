discussions:
- discussion_id: plod3_which_glycosyltransferase_activity
  kind: OPEN_QUESTION
  prompt: >-
    Does LH3 carry both the galactosyltransferase and the glucosyltransferase activity, or
    only the glucosyltransferase, with GLT25D1 supplying the other?
  attaches_to:
  - pathophysiology#Loss of Hydroxylysine-Linked Glycosylation
  rationale: >-
    The foundational work describes LH3 as trifunctional, with lysyl hydroxylase,
    hydroxylysyl galactosyltransferase and galactosylhydroxylysyl glucosyltransferase
    activities. A 2023 enzymology study using direct mass-spectrometry assays alongside the
    older indirect luminescence assays concludes instead that LH3 has only the
    glucosyltransferase activity and that GLT25D1 provides the galactosyltransferase
    activity. Both readings are represented in the literature this entry cites. The
    distinction does not change what is lost in BCARD, since the glucosyltransferase step is
    the one the mouse genetics identify as essential, but it does change what a residual
    activity assay is measuring and what an enzyme-replacement or small-molecule strategy
    would have to restore.
  notes: >-
    This entry's pathophysiology is written in terms of the glucosyltransferase step, which
    both readings agree LH3 performs, so it does not depend on the resolution.
- discussion_id: plod3_composite_phenotype_ascertainment
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is the epidermolysis-bullosa-like blistering a genuine but rare part of BCARD, or is it a
    separate presentation that shares the gene?
  attaches_to:
  - phenotypes#Abnormal blistering of the skin
  rationale: >-
    Sub-lamina-densa blistering with reduced type VII collagen was described in one patient,
    and the absence of a COL7A1 mutation makes it attributable to the PLOD3 defect rather than
    to a second diagnosis. But it does not appear in the collated feature list of the review
    that proposed the BCARD label, and with around eleven patients in total there is no basis
    for deciding whether it is a rare feature of one syndrome or a distinct
    allele-dependent presentation. The same question applies to the brain malformations,
    focal epilepsy and visceral anomalies added by the 2025 report.
  notes: >-
    Resolving this needs systematic skin and neuroimaging assessment across the reported
    cohort, which no publication has performed.
notes: >-
  Curated from the primary PLOD3 literature together with an OpenScientist deep-research
  report (11/11 references verified). Three notes on the evidence.

  **The mechanism is grounded in mouse genetics rather than in patient biochemistry**, and
  deliberately so: the decisive experiment is a comparison between mice blocked in one LH3
  activity and mice reduced in the other, which cannot be done in patients. Those items are
  graded `MODEL_ORGANISM`. Human evidence anchors the endpoints - reduced LH3 protein,
  reduced glycosylated hydroxylysine, the clinical phenotype - and the causal chain between
  them is the mouse's.

  **Phenotype frequencies are coarse on purpose.** The feature list comes from a collation
  across roughly ten published patients, with no per-feature counts. Frequencies here are
  graded from whether a feature appears in the syndrome definition (`FREQUENT`), in the
  collated list as a risk (`OCCASIONAL`), or in a single patient (`VERY_RARE`), and no
  numeric frequency is asserted anywhere.

  **Two snippets quote source spellings that are not standard** - "aneurisms" in the 2025
  abstract - and are reproduced rather than corrected, since a snippet reproduces its source.

  No GeneReviews chapter exists for BCARD or for PLOD3-related disease; a PubMed search for
  one returned nothing.

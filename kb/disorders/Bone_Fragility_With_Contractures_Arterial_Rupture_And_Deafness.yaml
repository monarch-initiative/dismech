biochemical:
- name: Reduced urinary glycosylated hydroxylysine
  presence: PRESENT
  notes: In the p.Leu627Pro child, urinary glycosylated hydroxylysine relative to hydroxylysine was markedly reduced, while total hydroxylysine relative to lysine and the disaccharide/monosaccharide ratio were preserved. The founding patient had absent urinary glucosyl-galactosyl pyridinoline and an altered hydroxylysine glycoside ratio. These assays support collagen-modification dysfunction; sensitivity, specificity and diagnostic cutoffs for BCARD have not been established.
  evidence:
  - &id006
    reference: url:https://kclpure.kcl.ac.uk/ws/files/103095648/Mutations_in_PLOD3_encoding_VAHIDNEZHAD_Firstonline18November2018_GREEN_AAM_CC_BY_NC_ND_.pdf
    reference_title: https://kclpure.kcl.ac.uk/ws/files/103095648/Mutations_in_PLOD3_encoding_VAHIDNEZHAD_Firstonline18November2018_GREEN_AAM_CC_BY_NC_ND_.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: the ratio of (GGHL + GHL)/HL in the proband was reduced to about 17% of that measured in his parents
    explanation: 'Full accepted manuscript of PMID:30463024: urinary glycosylated hydroxylysine relative to hydroxylysine was about 17% of parental values. This is a single-family functional observation, not a validated diagnostic cutoff.'
  - *id005
  readouts:
  - target: Reduced Collagen Hydroxylysine Glucosylation
    relationship: READOUT_OF
    direction: NEGATIVE
    interpretation: Reduced glycosylated hydroxylysine products reflect defective collagen modification, but do not isolate every enzyme step or establish diagnostic specificity.

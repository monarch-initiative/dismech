name: Infectious Mononucleosis
creation_date: "2026-11-25T00:00:00Z"
category: Infectious Disease
disease_term:
  preferred_term: infectious mononucleosis
  term:
    id: MONDO:0005810
    label: infectious mononucleosis
synonyms:
- glandular fever
- Mono
- gammaherpesviral mononucleosis
- EBV mononucleosis
- Pfeiffer disease
description: >-
  The clinical syndrome that follows symptomatic primary infection with
  Epstein-Barr virus (EBV, human gammaherpesvirus 4), a gamma-herpesvirus spread
  by saliva. EBV enters oropharyngeal B lymphocytes through the complement
  receptor CR2 (CD21), drives their proliferation, and establishes lifelong
  latency; the illness itself is largely immunopathology, produced by a massive
  oligoclonal expansion of EBV-specific CD8+ T cells (the atypical "Downey"
  lymphocytes) that infiltrate lymphoid tissue. The typical picture is sore
  throat, posterior cervical lymphadenopathy, fever, fatigue and splenomegaly in
  an adolescent or young adult, lasting several weeks and self-limited.
  Subclinical hepatitis is common; splenic rupture is the feared acute
  complication. Rare inborn errors of immunity (notably SH2D1A, causing X-linked
  lymphoproliferative disease) convert primary EBV infection into severe or
  fatal mononucleosis with hemophagocytosis. A history of infectious
  mononucleosis raises the later risk of Hodgkin lymphoma and multiple
  sclerosis.
infectious_agent:
- name: Epstein-Barr virus
  description: >-
    Human gammaherpesvirus 4 (Epstein-Barr virus), a lymphocryptovirus of the
    Herpesviridae that infects the great majority of the human population and
    persists latently in memory B cells.
  infectious_agent_term:
    preferred_term: Epstein-Barr virus
    term:
      id: NCBITaxon:10376
      label: human gammaherpesvirus 4
  evidence:
  - reference: PMID:26424648
    reference_title: Infectious Mononucleosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "this chapter only discusses infectious mononucleosis due to primary Epstein-Barr virus (EBV) infection. EBV is a γ-herpesvirus that infects at least 90% of the population worldwide."
    explanation: Identifies EBV as the gamma-herpesvirus cause of infectious mononucleosis.
transmission:
- name: Salivary (oral) transmission
  description: >-
    Primary EBV infection is acquired by transfer of virus in saliva; among
    adolescents and young adults deep kissing is the dominant route, which is
    why peak incidence falls in that age band.
  evidence:
  - reference: PMID:26424648
    reference_title: Infectious Mononucleosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Kissing is the major route of transmission of primary EBV infection among adolescents and young adults."
    explanation: Establishes salivary/oral transmission as the dominant route.
  - reference: PMID:23100562
    reference_title: "Behavioral, virologic, and immunologic factors associated with acquisition and severity of primary Epstein-Barr virus infection in university students."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Kissing was a significant risk for primary EBV infection."
    explanation: Prospective cohort confirming kissing as a transmission risk.
agent_life_cycle:
  description: >-
    EBV is a strictly human virus with no animal reservoir or arthropod vector;
    humans are the sole natural host, carrying the virus for life in latently
    infected memory B cells and shedding it intermittently in saliva.
  hosts:
  - preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
    role: sole natural host and reservoir
genetic:
- name: SH2D1A deficiency (X-linked lymphoproliferative disease type 1)
  gene_term:
    preferred_term: SH2D1A
    term:
      id: hgnc:10820
      label: SH2D1A
  relationship_type: SUSCEPTIBILITY
  notes: >-
    Loss-of-function variants in SH2D1A (encoding SAP) cause X-linked
    lymphoproliferative disease type 1, in which primary EBV infection provokes
    uncontrolled T- and B-cell proliferation and severe or fatal infectious
    mononucleosis with hemophagocytosis. SH2D1A is a severity/susceptibility
    gene, not a cause of ordinary infectious mononucleosis in the
    immunocompetent host.
  evidence:
  - reference: PMID:9771704
    reference_title: Host response to EBV infection in X-linked lymphoproliferative disease results from mutations in an SH2-domain encoding gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "X-linked lymphoproliferative syndrome (XLP or Duncan disease) is characterized by extreme sensitivity to Epstein-Barr virus (EBV), resulting in a complex phenotype manifested by severe or fatal infectious mononucleosis"
    explanation: SH2D1A loss causes severe/fatal mononucleosis on primary EBV infection.
  - reference: PMID:9771704
    reference_title: Host response to EBV infection in X-linked lymphoproliferative disease results from mutations in an SH2-domain encoding gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We have identified a gene, SH2D1A, that is mutated in XLP patients and encodes a novel protein composed of a single SH2 domain."
    explanation: Identifies SH2D1A as the XLP1 gene.
pathophysiology:
- name: Primary Oropharyngeal EBV Infection of B Lymphocytes
  biological_scale: CELLULAR
  description: >-
    Virus deposited in the oropharynx infects B lymphocytes, which EBV enters by
    binding the complement receptor type 2 (CR2/CD21) on the B-cell surface.
  biological_processes:
  - preferred_term: viral entry into B lymphocytes
    modifier: INCREASED
    term:
      id: GO:0046718
      label: symbiont entry into host cell
  cell_types:
  - preferred_term: B cell
    term:
      id: CL:0000236
      label: B cell
  downstream:
  - target: EBV-Driven B-Cell Proliferation and Latency
    description: Entry into B cells establishes proliferating and latently infected B cells.
  evidence:
  - reference: PMID:6087328
    reference_title: Epstein-Barr virus receptor of human B lymphocytes is the C3d receptor CR2.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We conclude that CR2 is the EBV receptor of human B lymphocytes."
    explanation: Establishes CR2/CD21 as the B-cell entry receptor for EBV.
  - reference: PMID:26424648
    reference_title: Infectious Mononucleosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The virus infects tonsillar epithelial cells as well as B cells in the parenchyma of the tonsil"
    explanation: EBV infects B cells (and epithelium) in the oropharyngeal tonsil at primary infection.
- name: EBV-Driven B-Cell Proliferation and Latency
  biological_scale: CELLULAR
  description: >-
    Infected B cells proliferate and a reservoir of latently infected memory B
    cells is established; these EBV-infected B cells are the targets the host
    cytotoxic response is directed against.
  biological_processes:
  - preferred_term: B cell proliferation
    modifier: INCREASED
    term:
      id: GO:0042100
      label: B cell proliferation
  - preferred_term: viral latency
    term:
      id: GO:0019042
      label: viral latency
  cell_types:
  - preferred_term: B cell
    term:
      id: CL:0000236
      label: B cell
  downstream:
  - target: Massive CD8+ T-Cell Expansion
    description: EBV-infected B cells drive a large EBV-specific cytotoxic T-cell response.
  evidence:
  - reference: PMID:26424648
    reference_title: Infectious Mononucleosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The virus is maintained in resting memory-like B cells."
    explanation: EBV establishes lifelong latency in resting memory B cells.
- name: Massive CD8+ T-Cell Expansion
  biological_scale: CELLULAR
  description: >-
    Primary EBV infection provokes a massive, largely oligoclonal expansion of
    EBV-specific CD8+ T cells (with an NK-cell response), selectively raising
    CD8+ not CD4+ numbers and inverting the CD4:CD8 ratio. These activated cells
    are the atypical lymphocytes of the blood film, and their magnitude tracks
    disease severity.
  biological_processes:
  - preferred_term: CD8+ T cell proliferation
    modifier: INCREASED
    term:
      id: GO:0042098
      label: T cell proliferation
  - preferred_term: adaptive immune response
    term:
      id: GO:0002250
      label: adaptive immune response
  cell_types:
  - preferred_term: CD8-positive, alpha-beta T cell
    term:
      id: CL:0000625
      label: CD8-positive, alpha-beta T cell
  - preferred_term: natural killer cell
    term:
      id: CL:0000623
      label: natural killer cell
  downstream:
  - target: Atypical lymphocytosis
    description: The expanded activated CD8+ T cells appear as atypical lymphocytes in blood.
  - target: Lymphoreticular Infiltration and Systemic Immune Activation
    description: The expanded lymphocytes infiltrate lymphoid organs and drive systemic symptoms.
  evidence:
  - reference: PMID:23100562
    reference_title: "Behavioral, virologic, and immunologic factors associated with acquisition and severity of primary Epstein-Barr virus infection in university students."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Increases were observed in numbers of NK cells and CD8(+) T-cells but not in numbers of CD4(+) T-cells during acute infection."
    explanation: Selective CD8+ (and NK) expansion, not CD4+, during acute infection.
  - reference: PMID:23100562
    reference_title: "Behavioral, virologic, and immunologic factors associated with acquisition and severity of primary Epstein-Barr virus infection in university students."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Severity of illness correlated positively with both blood EBV load (P = .015) and CD8(+) lymphocytosis (P = .0003)."
    explanation: Disease severity tracks the CD8+ lymphocytosis, supporting immunopathology.
- name: Lymphoreticular Infiltration and Systemic Immune Activation
  biological_scale: ORGANISM
  description: >-
    Expanded lymphocytes infiltrate the tonsils, cervical lymph nodes, spleen
    and liver, producing the lymphadenopathy, tonsillar enlargement and
    organomegaly, while the systemic immune response produces fever and
    fatigue. Clinically the picture is sore throat, cervical lymphadenopathy,
    fever and fatigue lasting several weeks.
  biological_processes:
  - preferred_term: adaptive immune response
    modifier: INCREASED
    term:
      id: GO:0002250
      label: adaptive immune response
  cell_types:
  - preferred_term: CD8-positive, alpha-beta T cell
    term:
      id: CL:0000625
      label: CD8-positive, alpha-beta T cell
  downstream:
  - target: Pharyngitis
    description: Oropharyngeal lymphoid involvement produces the sore throat.
  - target: Cervical lymphadenopathy
    description: Lymphocyte infiltration enlarges cervical lymph nodes.
  - target: Splenomegaly
    description: Splenic lymphoid infiltration enlarges the spleen.
  - target: Fever
    description: Systemic immune activation produces fever.
  - target: Fatigue
    description: Systemic immune activation produces prolonged fatigue.
  - target: EBV Hepatitis
    description: Hepatic lymphocytic infiltration produces subclinical hepatitis.
  evidence:
  - reference: PMID:26424648
    reference_title: Infectious Mononucleosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Infectious mononucleosis is a clinical entity characterized by sore throat, cervical lymph node enlargement, fatigue, and fever most often seen in adolescents and young adults and lasting several weeks."
    explanation: The core clinical syndrome produced by the immune response.
- name: EBV Hepatitis
  biological_scale: ORGANISM
  description: >-
    Lymphocytic infiltration of the liver produces a usually subclinical
    hepatitis with raised transaminases in the majority of patients, and
    occasionally tender hepatomegaly.
  downstream:
  - target: Elevated hepatic transaminases
    description: Hepatic involvement raises circulating transaminases.
  - target: Hepatomegaly
    description: Hepatic involvement can enlarge the liver.
  evidence:
  - reference: PMID:26424648
    reference_title: Infectious Mononucleosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Subclinical hepatitis documented by elevated levels of alanine aminotransferase occurs in approximately 75% of prospectively followed patients"
    explanation: Subclinical hepatitis with raised ALT in ~75% of patients.

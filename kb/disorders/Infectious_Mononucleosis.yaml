progression:
- phase: Incubation
  description: >-
    An incubation period of approximately 6 weeks separates salivary exposure
    from the onset of symptoms.
  evidence:
  - reference: PMID:26424648
    reference_title: Infectious Mononucleosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The incubation period of infectious mononucleosis is approximately 6 weeks."
    explanation: Defines the incubation phase.
- phase: Acute illness
  description: >-
    Self-limited acute illness lasting several weeks, with most signs resolving
    within about 10 days but fatigue and cervical lymphadenopathy persisting for
    a median of three weeks.
  evidence:
  - reference: PMID:26424648
    reference_title: Infectious Mononucleosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "fatigue and cervical lymphadenopathy persist for a median of 3 weeks"
    explanation: Defines the duration of the acute illness.
treatments:
- name: Supportive care
  description: >-
    There is no accepted specific treatment; infectious mononucleosis is
    self-limited and managed symptomatically with rest, fluids and
    analgesics/antipyretics. Aminopenicillins are avoided because they
    precipitate a rash, and contact sport is deferred for several weeks while
    the spleen is enlarged to avoid rupture.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:26424648
    reference_title: Infectious Mononucleosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "There is no currently accepted specific treatment for infectious mononucleosis."
    explanation: No disease-specific therapy exists; management is supportive.
- name: Acyclovir / valaciclovir
  description: >-
    Nucleoside antivirals have an in-vivo antiviral effect on EBV replication,
    but no convincing clinical benefit in infectious mononucleosis has been
    demonstrated, so they are not routinely recommended.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: acyclovir
      term:
        id: CHEBI:2453
        label: acyclovir
  evidence:
  - reference: PMID:26424648
    reference_title: Infectious Mononucleosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "While it is clear that acyclovir and valacyclovir and have an antiviral effect in vivo, a clinical benefit has not been convincingly demonstrated to date"
    explanation: Antivirals act on EBV but have no demonstrated clinical benefit in IM.
- name: Corticosteroids for inflammatory complications
  description: >-
    Corticosteroids are used for inflammatory complications such as airway
    obstruction or autoimmune cytopenias, though their value is controversial
    and they may impair viral clearance.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: corticosteroid
      term:
        id: CHEBI:50858
        label: corticosteroid
  evidence:
  - reference: PMID:26424648
    reference_title: Infectious Mononucleosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Corticosteroids are often prescribed to treat inflammatory complications such as airway obstruction or autoimmune phenomena such as anemia and thrombocytopenia, but the value of these drugs is controversial and they may impair clearance of the viral load"
    explanation: Corticosteroids are used for inflammatory/autoimmune complications, with controversial value.
diagnosis:
- name: Heterophile antibody and EBV-specific serology
  description: >-
    A typical clinical picture with a positive heterophile (monospot) test
    usually suffices, but heterophile antibodies are not specific and are often
    absent in young children, so EBV-specific antibody profiles are the
    reference for staging infection. Atypical lymphocytosis on the blood film
    strongly supports the diagnosis.
  diagnosis_term:
    preferred_term: serologic testing for EBV
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  evidence:
  - reference: PMID:26424648
    reference_title: Infectious Mononucleosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "A typical clinical picture with a positive heterophile test is usually sufficient to make the diagnosis, but heterophile antibodies are not specific"
    explanation: Describes heterophile testing and its limitation.
notes: >-
  Infectious mononucleosis is the symptomatic form of primary EBV infection; most
  childhood primary infection is asymptomatic, and whether primary infection
  causes mononucleosis is strongly age-dependent (highest in adolescents and
  young adults). A history of infectious mononucleosis is an established risk
  factor for later EBV-positive Hodgkin lymphoma and for multiple sclerosis
  (PMID:35025605 reports a 32-fold increase in multiple sclerosis risk after EBV
  infection); these sequelae are recorded as disease context rather than as
  phenotypes of the acute illness.

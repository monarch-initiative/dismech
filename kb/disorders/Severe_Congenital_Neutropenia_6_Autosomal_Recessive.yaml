- name: GM-CSF (sargramostim)
  action_category: THERAPEUTIC
  therapeutic_modality: PROTEIN_REPLACEMENT
  description: >-
    Proposed from the mouse model, where GM-CSF protected Jagn1-deficient mice
    from Candida challenge and restored patient bone marrow fungicidal activity
    ex vivo. In the only two patients reported to receive it, GM-CSF did not
    raise neutrophil counts and both proceeded to transplantation. Not an
    established therapy.
  treatment_term:
    preferred_term: colony-stimulating factor therapy
    term:
      id: NCIT:C15515
      label: Colony-Stimulating Factor Therapy
    therapeutic_agent:
    - preferred_term: sargramostim
      term:
        id: CHEBI:749544
        label: sargramostim
  target_phenotypes:
  - preferred_term: Severely decreased neutrophil count
    term:
      id: HP:0025826
      label: Severely decreased neutrophil count
  target_mechanisms:
  - target: Impaired Neutrophil Antimicrobial Function
    treatment_effect: RESTORES
    description: >-
      GM-CSF restored neutrophil function in the mouse model and in patient
      bone marrow cells ex vivo; this has not been shown in patients.
    evidence:
    - reference: PMID:25129145
      reference_title: Jagunal homolog 1 is a critical regulator of neutrophil function in fungal host defense.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Notably, GM-CSF also restored the defective fungicidal activity of bone marrow cells from humans with JAGN1 mutations."
      explanation: Ex vivo restoration of patient cell function.
  evidence:
  - reference: PMID:25129145
    reference_title: Jagunal homolog 1 is a critical regulator of neutrophil function in fungal host defense.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Treatment with granulocyte/macrophage colony-stimulating factor (GM-CSF) protected mutant mice from increased weight loss and accelerated mortality after Candida albicans challenge."
    explanation: Protective effect in the mouse model that motivated use in patients.
  - reference: PMID:39286252
    reference_title: 'Case report: Granulocyte-macrophage colony-stimulating factor sargramostim did not rescue the neutrophil phenotype in two patients with JAGN1-mutant severe congenital neutropenia.'
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "GM-CSF did not increase neutrophil counts in our patients."
    explanation: >-
      In the two treated patients GM-CSF failed to raise neutrophil counts,

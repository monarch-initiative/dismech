inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic JAGN1 variants, overwhelmingly homozygous in consanguineous or
    endogamous families; compound heterozygous cases are rare. Heterozygous
    carriers have normal blood counts.
  evidence:
  - reference: PMID:25129144
    reference_title: JAGN1 deficiency causes aberrant myeloid cell homeostasis and congenital neutropenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identify 9 distinct homozygous mutations in the JAGN1 gene encoding Jagunal homolog 1 in 14 individuals with SCN."
    explanation: >-
      The founding report: homozygous JAGN1 variants in every affected
      individual.
  - reference: PMID:25129144
    reference_title: JAGN1 deficiency causes aberrant myeloid cell homeostasis and congenital neutropenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Heterozygous JAGN1 mutation carriers were found to have normal differential blood counts"
    explanation: >-
      Heterozygous carriers are unaffected, consistent with recessive
      inheritance.
  - reference: PMID:41751872
    reference_title: Phenotypic Variability Associated with Jagunal Homolog 1 (JAGN1) Deficiency Caused by the c.63G>T Variant.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most patients (93%) had a homozygous variant and consanguineous background, while one had compound heterozygous JAGN1 variants."
    explanation: >-
      Records that biallelic disease is mostly homozygous on a consanguineous
      background, with compound heterozygosity occurring rarely.
pathophysiology:
- name: Biallelic JAGN1 Loss of Function
  description: >-
    Homozygous (rarely compound heterozygous) germline JAGN1 variants, most of
    them missense, plus start-loss (c.3G>A, p.Met1), nonsense and frameshift
    alleles. Depending on the allele, patient cells carry reduced or
    undetectable JAGN1 protein, or a mutant and likely non-functional protein.
  biological_scale: MOLECULAR
  genetic_context:
    functional_impact_category: LOSS_OF_FUNCTION
    variant_origin: GERMLINE
    gene:
      preferred_term: JAGN1
      term:
        id: hgnc:26926
        label: JAGN1
    description: >-
      Biallelic germline variants; homozygous in nearly all reported patients.
  genes:
  - preferred_term: JAGN1
    term:
      id: hgnc:26926
      label: JAGN1
  downstream:

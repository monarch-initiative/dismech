name: Severe Congenital Neutropenia 6, Autosomal Recessive
category: Mendelian
creation_date: "2026-10-18T12:00:00Z"
synonyms:
- SCN6
- neutropenia, severe congenital, 6, autosomal recessive
- JAGN1 deficiency
- SCN due to JAGN1 deficiency
- Severe congenital neutropenia due to jagunal homolog 1 deficiency
- JAGN1-CDG
description: >-
  Severe congenital neutropenia type 6 is an autosomal recessive inborn error of
  immunity caused by biallelic variants in JAGN1, which encodes Jagunal homolog
  1, a small endoplasmic reticulum (ER)-resident transmembrane protein of the
  early secretory pathway that interacts with the COPI vesicle coat. Loss of
  JAGN1 function in myeloid cells leaves an enlarged ER, almost no neutrophil
  granules, aberrant N-glycosylation (reduced fucosylation of multi-antennary
  glycans, and in murine cells reduced sialylation of adhesion receptors), a
  hypoglycosylated and less abundant G-CSF receptor with weakened downstream
  signalling, and a raised propensity of neutrophils to die. The bone marrow
  shows maturation arrest at the promyelocyte/myelocyte stage and the absolute
  neutrophil count is usually below 0.5 x 10^9/L from infancy, with early-onset
  recurrent bacterial infections of the ear-nose-throat tract, skin and mucosa,
  and severe periodontitis. About a third of patients also have a syndromic
  picture (facial features, short stature, bone metabolism disorders,
  developmental delay), and some have low immunoglobulin levels, consistent with
  JAGN1's role in antibody glycosylation. Response to G-CSF is often poor and
  dose requirements are high; allogeneic haematopoietic stem cell
  transplantation cures the haematological and infectious phenotype in
  refractory cases. Because JAGN1 deficiency is a defect of glycosylation
  trafficking, it is also counted among the congenital disorders of
  glycosylation with immune involvement (JAGN1-CDG).

- name: ER Stress and Increased Myeloid Cell Death
  description: >-
    JAGN1-deficient granulocytes show raised BiP and die more readily: patient
    neutrophils undergo apoptosis more often under staurosporine and depolarize
    their mitochondria quickly, and myeloid cells expressing patient JAGN1
    mutants succumb to a calcium- and calpain-dependent death programme. How
    much this contributes to the neutropenia, relative to impaired G-CSF
    receptor signalling, is unresolved; the zebrafish model argues it is not
    the primary mechanism.

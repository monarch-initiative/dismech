- name: B Cell ER Dysfunction and Altered IgG Glycosylation
  description: >-
    JAGN1 is also needed in antibody-producing cells: Jagn1 deficiency alters
    their ER, lowers antibody production and changes IgG N-glycosylation,
    including fucosylation in patients with JAGN1 loss-of-function variants. A
    minority of patients have reduced immunoglobulin levels, although the large
    cohort did not find a clinical antibody-deficiency phenotype.

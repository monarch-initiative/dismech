animal_models:
- name: Hematopoietic Jagn1 conditional knockout mouse
  species: Mouse
  genotype: Jagn1 flox/flox; vav-iCre
  background: Exon 2 floxed Jagn1 deleted in all hematopoietic cells (germline null is embryonic lethal)
  publication: PMID:25129145
  description: >-
    Mice lacking Jagn1 in the hematopoietic system have neutrophils with
    altered glycosylation, defective migration, impaired cytotoxic granule
    formation and poor killing of Candida albicans, but unlike patients are not
    neutropenic.
  modeled_mechanisms:
  - target: Impaired Neutrophil Antimicrobial Function
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Reproduces the qualitative neutrophil defect and its consequence for
      host defence.
    limitations: >-
      Tested against a fungal pathogen, whereas the human infection spectrum is
      mainly bacterial.
    evidence:
    - reference: PMID:25129145
      reference_title: Jagunal homolog 1 is a critical regulator of neutrophil function in fungal host defense.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Functional analysis confirmed marked defects in neutrophil migration in response to Candida albicans infection and impaired formation of cytotoxic granules, as well as defective myeloperoxidase release and killing of Candida albicans."
      explanation: The functional neutrophil defects in the knockout.
  - target: Myeloid Maturation Arrest
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      The knockout does not develop neutropenia, so it does not model the
      defining granulopoietic failure.
    limitations: >-
      Species difference in dependence on Jagn1 for steady-state granulopoiesis;
      the mouse cannot be used to study the human neutropenia or its G-CSF
      responsiveness.
    evidence:
    - reference: PMID:25129144
      reference_title: JAGN1 deficiency causes aberrant myeloid cell homeostasis and congenital neutropenia.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Even though, in contrast to human patients, Jagn1-deficient mice do not show neutropenia, they are characterized by increased susceptibility to fungal infections due to defective killing capacity of neutrophil granulocytes."
      explanation: States that the mouse lacks the human neutropenia.
- name: jagn1b zebrafish model
  species: Zebrafish
  genotype: jagn1b morphant, CRISPR/Cas9 mutant, or misexpression of a human-mutation-bearing jagn1b
  publication: PMID:38739706
  description: >-
    Knockdown, CRISPR editing or misexpression of a patient-mutation-bearing
    jagn1b gives a selective neutropenia with raised UPR gene expression and
    apoptosis, and impaired G-CSF receptor signalling.
  modeled_mechanisms:
  - target: Reduced G-CSF Receptor Signaling
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Reproduces the G-CSF receptor signalling defect and the resulting
      neutropenia.
    limitations: >-
      Zebrafish carry two JAGN1 paralogues with distinct roles; only jagn1b
      was modelled, and teleost granulopoiesis differs from human.
    evidence:
    - reference: PMID:38739706
      reference_title: A JAGN1-associated severe congenital neutropenia zebrafish model revealed an altered G-CSFR signaling and UPR activation.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Instead, Jagn1b has a critical role in granulocyte colony-stimulating factor receptor signaling and steady-state granulopoiesis"
      explanation: The model's central mechanistic finding.
  - target: Myeloid Maturation Arrest
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Selective loss of neutrophils with other lineages spared.
    limitations: >-
      A larval model; long-term marrow pathology and infection phenotype were
      not assessed.
    evidence:
    - reference: PMID:38739706
      reference_title: A JAGN1-associated severe congenital neutropenia zebrafish model revealed an altered G-CSFR signaling and UPR activation.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Using various approaches such as morpholino-based knockdown, CRISPR/Cas9-based gene editing, and misexpression of a jagn1b harboring a specific human mutation, we successfully developed neutropenia while leaving other hematopoietic lineages unaffected."
      explanation: The model develops selective neutropenia.
discussions:
- discussion_id: scn6_neutropenia_mechanism
  kind: KNOWLEDGE_GAP
  prompt: >-
    How much of the neutropenia in JAGN1 deficiency is due to impaired G-CSF
    receptor glycosylation and signalling, and how much to ER stress and
    myeloid cell death?
  attaches_to:
  - pathophysiology#Reduced G-CSF Receptor Signaling
  - pathophysiology#ER Stress and Increased Myeloid Cell Death
  rationale: >-
    Patient neutrophils show both a hypoglycosylated receptor and increased
    apoptosis, and the founding report could not separate them; the zebrafish
    model favours receptor signalling, but non-myeloid HeLa cells did not
    reproduce the primary-cell defects, so human myeloid evidence is missing.
  evidence:
  - reference: PMID:25129144
    reference_title: JAGN1 deficiency causes aberrant myeloid cell homeostasis and congenital neutropenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It remains difficult to determine the relative contributions of aberrant G-CSF-R signaling and increased apoptosis to the neutropenia."
    explanation: The founding report states the open question.
- discussion_id: scn6_mouse_model_mismatch
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Why does hematopoietic Jagn1 loss leave mice with normal neutrophil counts
    when JAGN1 loss in humans causes severe neutropenia, and does the mouse's
    GM-CSF rescue of neutrophil function say anything about treating patients?
  attaches_to:
  - animal_models#Hematopoietic Jagn1 conditional knockout mouse
  - treatments#GM-CSF (sargramostim)
  rationale: >-
    The mouse reproduces the functional neutrophil defect but not the
    neutropenia, and the GM-CSF benefit seen in mice did not translate into
    higher neutrophil counts in the two patients treated, so the model's
    therapeutic prediction failed on the clinically decisive outcome.
  evidence:
  - reference: PMID:39286252
    reference_title: 'Case report: Granulocyte-macrophage colony-stimulating factor sargramostim did not rescue the neutrophil phenotype in two patients with JAGN1-mutant severe congenital neutropenia.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "GM-CSF did not increase neutrophil counts in our patients."
    explanation: The human result that diverges from the mouse prediction.
notes: >-
  No GeneReviews chapter exists for JAGN1 deficiency (checked against the
  committed Bookshelf index). The often-quoted estimate that JAGN1 accounts for
  about 10% of severe congenital neutropenia comes from reviews, and the
  Turkish national registry found only 1%, so no case fraction beyond the
  registry figure is recorded. Atypical insulin-dependent diabetes rests on a
  single case report and is flagged VERY_RARE. Reduced immunoglobulin levels
  are OCCASIONAL (5 of 21 tested patients in the multicentre cohort); the same
  case report adds a patient whose impaired humoral immunity needed
  immunoglobulin replacement. The review that
  prompted this entry (PMID:42461459, fungal infections in inborn errors of
  immunity) expands JAGN1 as "Jagged-1" in its abbreviation list and is not
  cited; fungal susceptibility is curated from the mouse model, which is the
  primary source, and the human infection spectrum in the cohorts is bacterial.
  Orphanet's definition also lists failure to thrive, hypothyroidism,
  pancreatic insufficiency, coarctation of the aorta and urogenital
  abnormalities as possible associations, and the multicentre cohort mentions
  dental malformations, cardiac valve defects, hypospadias, strabismus and
  endocrine disorders as other findings detailed only in its supplemental
  table. They are not curated as phenotypes because neither source gives a
  count or frequency for them.

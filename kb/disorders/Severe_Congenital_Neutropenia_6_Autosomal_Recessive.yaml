      reference_title: Jagunal homolog 1 is a critical regulator of neutrophil function in fungal host defense.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "mice carrying a hematopoietic lineage-specific deletion of Jagn1 (encoding Jagunal homolog 1) cannot mount an efficient neutrophil-dependent immune response to the human fungal pathogen Candida albicans"
      explanation: >-
        Shows the functional defect translating into failed host defence in
        vivo; the human infection spectrum is predominantly bacterial, so this
        edge rests on a fungal model.
    - reference: PMID:39775668
      reference_title: 'Extended clinical phenotypes and treatment modalities in 32 JAGN1-deficient patients: a multicenter study by ESID and EBMT IEWP.'
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "Therapy was interrupted in 3 other patients due to the occurrence of severe infections, despite normalized neutrophil count"
      explanation: >-
        Patients kept having severe infections once G-CSF had normalized their
        neutrophil counts, which implies a defect in how the neutrophils work
        and not only in how many there are. Human evidence for this edge,
        alongside the fungal mouse model; the inference step is why it is
        indirect.

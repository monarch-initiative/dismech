- name: Aberrant Myeloid N-Glycosylation
  description: >-
    Patient neutrophils show anomalous N-glycomes with a marked loss of
    fucosylation on multi-antennary glycans and fewer Lewis X units, while
    O-glycans are unaffected. In murine Jagn1-deficient neutrophils,
    adhesion-relevant receptors (E-selectin ligands, CXCR2) are under-sialylated.
    Glycosylation of the G-CSF receptor itself is affected.

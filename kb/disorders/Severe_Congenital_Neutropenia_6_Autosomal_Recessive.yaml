    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identify 9 distinct homozygous mutations in the JAGN1 gene encoding Jagunal homolog 1 in 14 individuals with SCN."
    explanation: Identifies JAGN1 as the causal gene.

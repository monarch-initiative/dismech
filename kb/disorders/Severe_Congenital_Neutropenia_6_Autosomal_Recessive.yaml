    causal_link_type: DIRECT
    evidence:
    - reference: PMID:25129144
      reference_title: JAGN1 deficiency causes aberrant myeloid cell homeostasis and congenital neutropenia.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We here report that JAGN1 is an ER-resident protein with a function in the early secretory pathway and is critical for differentiation and maintenance of human neutrophils."
      explanation: >-
        Places JAGN1 function in the ER and early secretory pathway, the
        compartment disrupted when the protein is lost.

      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Here, we report that Jagn1 deficiency results in alterations in the endoplasmic reticulum (ER) of antibody-producing cells as well as decreased antibody production and secretion."
      explanation: >-
        Jagn1 loss in mouse antibody-producing cells alters their ER and lowers
        antibody production and secretion, the B-cell branch of the same
        secretory-pathway defect.
  evidence:
  - reference: PMID:25129144
    reference_title: JAGN1 deficiency causes aberrant myeloid cell homeostasis and congenital neutropenia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "different mutations resulted in decreased or non-detectable protein in some patients (P5, P7 and P13) and expression of a mutant and likely non-functional protein (P9, P12)"
    explanation: >-

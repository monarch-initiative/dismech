mechanistic_hypotheses:
- hypothesis_group_id: scn6_cell_death_contribution
  hypothesis_label: Myeloid cell death as a contributor to SCN6 neutropenia
  status: EMERGING
  description: >-
    Increased ER stress and calcium/calpain-dependent death of JAGN1-deficient
    myeloid cells depletes the granulocytic compartment. Human ex vivo and cell
    line data support increased death, but the zebrafish model indicates that
    reduced G-CSF receptor signalling, not apoptosis, is the primary cause of
    the neutropenia, and the founding report could not apportion the two.

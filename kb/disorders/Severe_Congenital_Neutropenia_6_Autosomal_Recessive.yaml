      snippet: "reduced sialylation of adhesion-relevant receptors on Jagn1-deficient neutrophils leading to impaired E-selectin and CXCL8 binding"
      explanation: >-
        In Jagn1-deficient murine neutrophils derived from immortalized
        progenitors, the trafficking defect results in under-sialylated surface
        receptors.

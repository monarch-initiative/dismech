  case_fractions:
  - population: Turkish Severe Congenital Neutropenia Registry (216 patients)
    case_fraction_percent: 1.0
    cohort_size: 216
    notes: >-
      Biallelic JAGN1 accounted for 2 of 216 registry patients in a population
      with high consanguinity. Reviews give a figure of about 10% of SCN
      worldwide, which this registry does not reproduce.
    evidence:
    - reference: PMID:31321910
      reference_title: 'Homozygous c.130-131 ins A (pW44X) mutation in the HAX1 gene as the most common cause of congenital neutropenia in Turkey: Report from the Turkish Severe Congenital Neutropenia Registry.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Biallelic mutations of G6PC3 (n = 9, 4.3%), CSF3R (n = 6, 2.9%), and JAGN1 (n = 2, 1%) were also observed."
      explanation: >-
        Gives the JAGN1 share of a national SCN registry.
  variants:
  - name: c.3G>A (p.Met1)
    description: >-
      Start-loss variant found homozygous in the founding Algerian Sephardic
      families; the most frequent variant in the 32-patient cohort and not
      associated with syndromic features there.
  - name: c.63G>T (p.Glu21Asp)
    description: >-
      Recurrent missense variant, enriched in Romanian patients (possible
      founder effect) and associated with severe periodontitis and some
      neurodevelopmental delay.
  - name: c.130C>T (p.His44Tyr)
    description: >-
      Missense variant more often associated with syndromic facial features
      and bone disease.

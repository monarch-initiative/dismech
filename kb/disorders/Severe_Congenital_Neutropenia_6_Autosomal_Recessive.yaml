- name: Early Secretory Pathway and ER Dysfunction
  description: >-
    JAGN1 resides in the ER and binds the COPI coat (COPA, COPB2, COPG2), which
    mediates retrograde Golgi-to-ER vesicle transport. Without it, the ER of
    myeloid cells is enlarged and selected secretory cargo is handled
    abnormally, which is the shared upstream defect for the glycosylation,
    granule and ER-stress consequences below.

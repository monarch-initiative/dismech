- name: G-CSF (filgrastim)
  action_category: THERAPEUTIC
  therapeutic_modality: PROTEIN_REPLACEMENT
  description: >-
    First-line therapy in nearly all patients. Response is variable and often
    poor; doses up to 40 ug/kg/day are used, syndromic patients need higher
    doses, and a few patients do not respond at all. Bone pain limits its use
    in some. G-CSF does not correct the bone disease.
  treatment_term:
    preferred_term: colony-stimulating factor therapy
    term:
      id: NCIT:C15515
      label: Colony-Stimulating Factor Therapy
    therapeutic_agent:
    - preferred_term: filgrastim
      term:
        id: CHEBI:749461
        label: filgrastim
  target_phenotypes:
  - preferred_term: Severely decreased neutrophil count
    term:
      id: HP:0025826
      label: Severely decreased neutrophil count
  target_mechanisms:
  - target: Reduced G-CSF Receptor Signaling
    treatment_effect: ACTIVATES
    description: >-
      Supraphysiological G-CSF drives the weakened receptor pathway; the
      receptor defect is the likely reason doses must be high and response is
      incomplete.
    evidence:
    - reference: PMID:39775668
      reference_title: 'Extended clinical phenotypes and treatment modalities in 32 JAGN1-deficient patients: a multicenter study by ESID and EBMT IEWP.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Patients with syndromic features needed significantly higher doses of G-CSF than those without."
      explanation: >-
        High dose requirements in part of the cohort, consistent with a
        blunted receptor pathway.
  evidence:
  - reference: PMID:39775668
    reference_title: 'Extended clinical phenotypes and treatment modalities in 32 JAGN1-deficient patients: a multicenter study by ESID and EBMT IEWP.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most of the patients received G-CSF as their first-line therapy (29/32)."
    explanation: G-CSF is first-line therapy.
  - reference: PMID:25129144
    reference_title: JAGN1 deficiency causes aberrant myeloid cell homeostasis and congenital neutropenia.
    supports: SUPPORT

    explanation: In vivo evidence that transfer occurs and is sufficient to produce fetal disease.
  downstream:
  - target: Neurotropic Entry into Fetal Neural Progenitors
    causal_link_type: DIRECT
    description: >-
      Virus that has reached the fetal compartment encounters the developing

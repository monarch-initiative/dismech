- discussion_id: gap_czs_specific_therapy
  prompt: >-
    No approved antiviral or disease-modifying therapy exists for congenital
    Zika syndrome; candidate small molecules (e.g., nucleoside analogues) and
    TLR3-pathway modulation have shown effects only in experimental models.
    Which interventions, if any, can interrupt the progenitor-cytopathy cascade
    within the narrow prenatal therapeutic window?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Antiviral Innate Immune Activation
  - pathophysiology#Neural Progenitor Apoptosis and Pool Depletion
  rationale: >-
    Experimental evidence (e.g., TLR3 inhibition reducing ZIKV phenotypes in
    organoids) suggests mechanistically rational intervention points, but no
    therapy has translated to human prenatal use, and the destructive,
    early-onset nature of the progenitor cytopathy makes the therapeutic window
    extremely narrow. This gap motivates prevention (vector control, avoidance
    of exposure in pregnancy) as the current mainstay.
- discussion_id: mismatch_czs_tnt_placental_transmission
  prompt: >-
    Does tunneling-nanotube-mediated viral spread operate in the human placenta,
    and how much of the mouse placental-injury phenotype transfers to human
    congenital Zika disease?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Tunneling Nanotube-Mediated Intercellular Viral Spread
  - pathophysiology#Placental Infection
  - pathophysiology#Placental Architectural and Functional Disruption
  - pathophysiology#Fetal Growth Restriction
  - pathophysiology#Transplacental Viral Transfer to the Fetal Compartment
  rationale: >-
    The TNT arm of transplacental dissemination is established entirely in mouse
    pregnancy models, by comparing a TNT-competent virus with an NS1
    residue-40-52 TNT-deficient mutant. Two distinct translational questions
    follow. First, TNTs have not been demonstrated to carry ZIKV between cells
    in human placental tissue in vivo, so the mechanism is a strong candidate
    rather than an established human route. Second, and more concretely, the
    architectural readout does not transfer at all: the junctional zone and
    labyrinth are compartments of the rodent placenta with no direct human
    homolog, so "altered junctional-to-labyrinth architecture" cannot be
    restated as a human placental finding. The nearest human comparison points
    the other way: in full-term placentas from three ZIKV-infected women, viral
    NS3 antigen localized to Hofbauer cells while the placentas showed no
    anatomic defects (PMID:31709049, the publication behind the GSE139181
    dataset already curated in this entry) — a small series, and not a test of
    the TNT mechanism, but not obviously the same picture either. Fetal growth
    restriction is therefore curated as an ORGANISM-scale pathophysiology node
    carrying model-organism evidence, and is deliberately absent from
    `phenotypes:`, which would require human evidence.
  proposed_experiments:
  - experiment_id: exp_czs_tnt_human_placenta
    name: Detection of ZIKV-laden tunneling nanotubes in human placental explants
    description: >-
      Live imaging and correlative electron microscopy of ZIKV-infected primary
      human trophoblast and placental explant cultures, scoring actin-rich
      intercellular conduits carrying viral components, with the NS1
      residue-40-52 TNT-deficient mutant as the negative control.
  evidence:
  - reference: PMID:42627154
    reference_title: "Tunneling nanotubes contribute to Zika virus pathogenesis at the maternal-fetal interface in vivo."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here, we investigated the in vivo role of TNTs in ZIKV maternal-fetal transmission using complementary pregnancy models."
    explanation: Establishes that the in vivo evidence for the TNT arm comes from animal pregnancy models rather than human tissue.
  - reference: PMID:42627154
    reference_title: "Tunneling nanotubes contribute to Zika virus pathogenesis at the maternal-fetal interface in vivo."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "ZIKVΔTNT infection was associated with reduced placental pathology, altered junctional-to-labyrinth architecture, improved placental efficiency, and protection from fetal growth restriction."
    explanation: Names the junctional-to-labyrinth readout, which is a rodent placental compartment measure with no human equivalent.
  - reference: PMID:31709049
    reference_title: "Immunological observations and transcriptomic analysis of trimester-specific full-term placentas from three Zika virus-infected women."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although ZIKV NS3 antigens co-localised to placental Hofbauer cells, the placentas showed no anatomic defects."
    explanation: >-
      The human placental comparison invoked in this mismatch. Infected human
      placentas carried viral antigen without the structural defects the mouse
      models show.
- discussion_id: gap_czs_ns1_tnt_therapeutic_target
  prompt: >-
    Is the NS1 determinant of tunneling-nanotube formation (residues 40-52) a
    tractable antiviral target for preventing transplacental ZIKV transmission,
    and does the same TNT route operate in other vertically transmitted viruses?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Tunneling Nanotube-Mediated Intercellular Viral Spread
  rationale: >-
    A discrete viral protein determinant whose loss reduces dissemination,
    placental injury, and fetal growth restriction without abolishing viral
    viability is an unusually clean target hypothesis, and it addresses the
    transmission step rather than the downstream progenitor cytopathy — a much
    wider therapeutic window than the one the existing therapy gap describes.
    Nothing here has been tested as an intervention: the evidence is a
    genetically engineered mutant virus, not a drug or an antibody, and no
    NS1-directed agent has been shown to block TNT formation. The authors also
    raise, without testing, whether TNTs matter for other vertically transmitted
    or emerging viruses; that generalization has no evidence in this entry and
    should not be curated onto other disease entries on the strength of this
    paper alone.
  evidence:
  - reference: PMID:42627154
    reference_title: "Tunneling nanotubes contribute to Zika virus pathogenesis at the maternal-fetal interface in vivo."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These findings identify TNTs as a previously underappreciated pathway of viral transmission during pregnancy and suggest new therapeutic targets."
    explanation: The therapeutic-target claim is the authors' proposal, not a tested intervention, which is what makes this a gap rather than a treatment entry.
  - reference: PMID:42627154
    reference_title: "Tunneling nanotubes contribute to Zika virus pathogenesis at the maternal-fetal interface in vivo."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "More broadly, TNTs may contribute to the pathogenesis of other vertically transmitted or emerging viral infections."
    explanation: Records the cross-pathogen generalization as an explicitly speculative statement.
- discussion_id: gap_czs_dengue_immunity_enhancement
  prompt: >-
    Does pre-existing maternal dengue immunity worsen fetal outcome in human
    congenital Zika syndrome, as it does in macaques?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Transplacental Viral Transfer to the Fetal Compartment
  - pathophysiology#Impaired Neurogenesis and Congenital Cortical Malformation
  - animal_models#Cynomolgus macaque
  rationale: >-
    Why some ZIKV-exposed fetuses are severely affected and others are not is
    the largest unexplained variance in this disease, and the entry's timing
    account does not fully cover it. A nonhuman primate experiment supplies a
    candidate: fetuses of dengue-immune macaques infected in early pregnancy
    developed significantly worse CZS than naive controls, with no difference in
    maternal infection or antibody response — locating the effect in the fetus
    rather than in maternal viral control.

    The translational question is unusually consequential because ZIKV and DENV
    co-circulate across most of the affected geography, so a large share of
    women entering a Zika outbreak are dengue-immune. If the enhancement operates
    in humans, prior dengue serostatus would be a risk stratifier available
    before conception and would also bear on flavivirus vaccination strategy in
    women of childbearing age. If it does not, the macaque result localises a
    species-specific branch that should not inform human counselling.

    This is recorded as a mismatch rather than a knowledge gap because the
    evidence exists and is strong in the model; what is unknown is whether it
    transfers.
  proposed_experiments:
  - experiment_id: exp_czs_denv_serostatus_stratified_cohort
    name: DENV-serostatus-stratified prospective cohort of ZIKV-infected pregnancies
    description: >-
      In a prospective cohort of pregnancies with confirmed ZIKV infection,
      determine pre-pregnancy or first-trimester DENV serostatus and compare the
      incidence and severity of CZS between DENV-immune and DENV-naive mothers,
      stratifying by gestational age at infection so the two risk factors are not
      confounded.
    would_support:
    - pathophysiology#Impaired Neurogenesis and Congenital Cortical Malformation
    supporting_outcome:
    - >-
      CZS is more frequent or more severe in the offspring of DENV-immune
      mothers after adjustment for timing, supporting transfer of the macaque
      enhancement to human pregnancy.
    refuting_outcome:
    - >-
      CZS incidence and severity are independent of maternal DENV serostatus,
      indicating the enhancement is model-specific and should not be used for
      human risk stratification.

datasets:
- accession: geo:GSE234062
  title: Human Otic progenitor cell models of congenital hearing loss applied to to Zika virus and cytomegalovirus infections
  description: Congenital hearing loss is a common chronic condition affecting children in both developed and developing nations. In many cases, congenital hearing loss is ultimately attributed to viral infection, most often by cytomegalovirus (CMV), but also in Congenital Zika Syndrome (CZS). The mechanisms by which CMV and ZIKV virus cause these cranial developmental defects have not been elucidated. Inner ear development has been particularly difficult to study, given the inaccessibility and scarcity of the tissue in animal models or on human autopsy; however, it is now possible to culture stem-cell derived otic progenitor cells (OPCs).
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  data_type: BULK_RNA_SEQ
  sample_count: 36
  publication: PMID:38440980
  notes: Identified by GEO DataSets index search for Congenital Zika Syndrome (scripts/discover_datasets.py); accession and metadata verified against NCBI E-utilities on 2026-08-01. Title, sample count, and organism are GEO's own values.
- accession: geo:GSE102128
  title: RNA-seq of hiPSCs-derived NPCs from 3 pairs of dizygotic discordant twins for Congenital Zika syndrome
  description: Congenital Zika syndrome (CZS), caused by Zika virus (ZIKV) infection, has been associated to impairment of early brain development, particularly related to neural progenitor cells (NPCs) survival and growth. In this work we report in a high-throughput manner (RNA-Seq) the differences in the transcriptomes of hiPSCs(human induced pluripotent stem cells)-derived NPCs from 3 pairs of discordant twins for Congenital Zika syndrome (CZS).
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  data_type: BULK_RNA_SEQ
  sample_count: 6
  publication: PMID:29396410
  notes: Identified by GEO DataSets index search for Congenital Zika Syndrome (scripts/discover_datasets.py); accession and metadata verified against NCBI E-utilities on 2026-08-01. Title, sample count, and organism are GEO's own values.
- accession: geo:GSE139181
  title: Transcriptomics analysis of trimester-specific full-term placentas from three Zika virus-infected women
  description: Effects of Zika virus (ZIKV) infection on placental development during pregnancy are unclear. In this study, full-term placentas from three women, each infected with ZIKV during specific pregnancy trimesters, were harvested for anatomic, immunologic and transcriptomic analysis. Each woman exhibited a unique immune response with raised IL-1RA, IP-10, EGF and RANTES expression, and neutrophil numbers during the acute infection phase. Although ZIKV NS3 antigens co-localized to placental Hofbauer cells, the placentas showed no anatomical defects.

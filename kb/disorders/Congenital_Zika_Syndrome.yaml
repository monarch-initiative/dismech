- category: Auditory
  name: Sensorineural Hearing Loss
  description: >-
    Sensorineural hearing loss in 5 of 70 (7%) infants with microcephaly and
    laboratory evidence of ZIKV infection, or 5.8% (4 of 69) after excluding one
    child tested following ototoxic antibiotic treatment. All affected infants
    had severe microcephaly.

    The frequency is ascertainment-dependent and this entry does not generalise
    it. A separate cohort of ZIKV-exposed children not selected for microcephaly
    found no sensorineural hearing loss over two years. Those results are not in
    conflict: they describe different populations, and the contrast is the reason
    the recommendation is to test hearing in all exposed infants rather than only
    those who look affected.

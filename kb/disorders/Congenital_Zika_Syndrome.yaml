    reference_title: "Congenital Zika virus infection: a neuropathological review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The lack of spinal motor neurons is responsible for fetal acynesia and consequent arthrogryposis."

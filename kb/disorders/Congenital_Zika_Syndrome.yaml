prevalence:
- population: Symptomatic ZIKV-infected pregnant women, Brazil (Ribeirao Preto region)
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 2500.0
  notes: >-
    Major signs of congenital Zika syndrome in 13 of 513 fetuses (2.5%) of
    symptomatic ZIKV-infected women in a prospective population-based cohort.
    This is a risk per infected pregnancy, not a population prevalence of the
    disease, and it is conditioned on the mother being symptomatic.
  evidence:
  - reference: PMID:32920998
    reference_title: "Early maternal Zika infection predicts severe neonatal neurological damage: results from the prospective Natural History of Zika Virus Infection in Gestation cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of these, 13 (2.5%; 95% CI 1.5-4.3) presented with major signs of congenital Zika syndrome (CZS)."
    explanation: The proportion with major CZS signs, with its confidence interval.
- population: Liveborn infants of symptomatic ZIKV-infected women, Brazil
  measure_type: BIRTH_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 3900.0
  notes: >-
    Microcephaly or other CNS malformation in 19 of 489 liveborn infants (3.9%).
    Pregnancy losses occurred separately in 4.7% of the cohort, so the liveborn
    denominator understates total adverse outcomes.
  evidence:
  - reference: PMID:32920998
    reference_title: "Early maternal Zika infection predicts severe neonatal neurological damage: results from the prospective Natural History of Zika Virus Infection in Gestation cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Microcephaly or other CNS malformations were diagnosed in 1/4 (25.0%) stillbirths and in 19/489 (3.9%; 95% CI 2.5-5.9) of the liveborn infants."
    explanation: Birth prevalence among liveborn infants, alongside the stillbirth figure.

diagnosis:
- name: Maternal gestational age at infection as the dominant risk determinant
  description: >-
    Timing of maternal infection is the single strongest predictor of fetal
    outcome, and is the reason this entry treats first-trimester exposure as
    the high-risk window rather than as a stylistic emphasis. Neuropathology
    agrees with the epidemiology: lesion severity tracks gestational age at
    infection.
  evidence:
  - reference: PMID:32920998
    reference_title: "Early maternal Zika infection predicts severe neonatal neurological damage: results from the prospective Natural History of Zika Virus Infection in Gestation cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Fetal abnormalities were 14.0 (95% CI 7.6-26.0) times more likely with gestational infection occurring in ≤11 weeks."
    explanation: Quantifies the timing dependence with an effect size and interval.
  - reference: PMID:29167994
    reference_title: "Congenital Zika virus infection: a neuropathological review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The severity of the lesions is directly related to the gestational age, the most severe occurring when the mother is infected in the first trimester."
    explanation: >-
      Independent pathological confirmation of the same gradient, from tissue
      rather than from outcome statistics.
- name: Screening of apparently unaffected exposed infants
  description: >-
    A normal examination at birth does not exclude CZS-spectrum injury. In
    follow-up of infants classified as asymptomatic, a small proportion had eye
    abnormalities or CNS imaging findings and a larger proportion had
    neurological alert signs by three months. Hearing testing is likewise
    recommended for all infants born to women with evidence of ZIKV infection,
    including those who appear normal at birth.
  evidence:
  - reference: PMID:32920998
    reference_title: "Early maternal Zika infection predicts severe neonatal neurological damage: results from the prospective Natural History of Zika Virus Infection in Gestation cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "On follow up of 280 asymptomatic infants, 2/155 (1.3%) had eye abnormalities, 1/207 (0.5%) had CNS imaging findings and 16/199 (8%) presented neurological alert signs."
    explanation: Subclinical findings in infants who appeared unaffected, with denominators.
  - reference: PMID:27585248
    reference_title: "Hearing Loss in Infants with Microcephaly and Evidence of Congenital Zika Virus Infection - Brazil, November 2015-May 2016."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "all infants born to women with evidence of Zika virus infection during pregnancy should have their hearing tested, including infants who appear normal at birth"
    explanation: The screening recommendation that follows from ascertainment-dependent detection.

histopathology:
- name: Destructive cortical injury with calcification and migration disturbance
  description: >-
    The postmortem picture is destructive rather than purely hypoplastic, which
    is what distinguishes CZS from genetic primary microcephaly on tissue. It
    combines extensive parenchymal destruction, calcification, disturbed
    neuronal migration, and a reactive glial and microglial response, with
    occasional perivascular lymphocytic cuffing extending to the meninges.
  context: Postmortem CNS of fetuses and neonates infected early in gestation.
  evidence:
  - reference: PMID:29167994
    reference_title: "Congenital Zika virus infection: a neuropathological review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "there is extensive destruction of the hemispheric parenchyma, calcifications, various disturbances of neuronal migration, reactive gliosis, microglial hyperplasia and occasional perivascular cuffs of lymphocytes, also in the meninges"
    explanation: >-
      The full histological description, including the inflammatory component
      that a purely developmental account would not predict.

differential_diagnoses:
- name: Other congenital (TORCH) infections
  description: >-
    Congenital cytomegalovirus and toxoplasmosis produce overlapping
    intracranial calcification, microcephaly, chorioretinal disease and hearing
    loss, and are the principal differential. The pattern of calcification and
    the presence of arthrogryposis help, but neither is decisive, so
    discrimination rests on laboratory confirmation of the agent rather than on
    imaging phenotype.
  distinguishing_features:
  - >-
    Arthrogryposis with normal joints and neurogenic electromyographic findings
    is characteristic of CZS and is not a usual feature of congenital CMV or
    toxoplasmosis.
  - >-
    Sensorineural hearing loss occurs in CZS at a frequency similar to that seen
    with other congenital viral infections, so it does not discriminate between
    them.
  evidence:
  - reference: PMID:27585248
    reference_title: "Hearing Loss in Infants with Microcephaly and Evidence of Congenital Zika Virus Infection - Brazil, November 2015-May 2016."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "which is similar to that seen in association with other congenital viral infections"
    explanation: >-
      States that the hearing-loss frequency does not separate CZS from the other
      congenital infections, which is why it is listed as a non-discriminating
      feature.
- name: Genetic primary microcephaly
  description: >-
    Autosomal recessive primary microcephaly converges on the same
    progenitor-depletion endpoint but differs pathologically: CZS is a
    destructive process with prominent cell death, necrosis and calcification,
    whereas genetic primary microcephaly is hypoplastic without those features.
    The distinction is made on tissue and imaging rather than on head
    circumference.
  distinguishing_features:
  - >-
    Calcification, parenchymal destruction and perivascular inflammation favour
    congenital infection over a germline progenitor defect.
  evidence:
  - reference: PMID:29167994
    reference_title: "Congenital Zika virus infection: a neuropathological review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "there is extensive destruction of the hemispheric parenchyma, calcifications, various disturbances of neuronal migration, reactive gliosis, microglial hyperplasia"
    explanation: >-
      The destructive, inflammatory signature that separates CZS from hypoplastic
      genetic microcephaly on histology.

treatments:
- name: Supportive Care
  description: >-
    There is no specific antiviral therapy for congenital Zika syndrome.
    Management is supportive and multidisciplinary, addressing feeding
    difficulties, seizures, spasticity, and developmental needs.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
- name: Physical and Developmental Therapy
  description: >-
    Early rehabilitative and developmental therapy to support motor function
    and mitigate the consequences of arthrogryposis and spasticity.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: physical therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
animal_models:
- name: Dengue-immune cynomolgus macaque ZIKV pregnancy model
  species: Cynomolgus macaque
  genotype: Wild type, DENV-immune prior to ZIKV challenge
  publication: PMID:37878671
  description: >-
    A nonhuman primate model of vertical transmission on a developmental
    timeline close to the human one, used to ask why some ZIKV-exposed fetuses
    are severely affected and others are not. Its answer is a maternal
    immunological one that this entry otherwise has no account of: prior dengue
    immunity worsens fetal outcome.
  modeled_mechanisms:
  - target: Impaired Neurogenesis and Congenital Cortical Malformation
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Fetuses of DENV-immune macaques infected with ZIKV in early pregnancy
      developed significantly more severe CZS than naive controls, with reduced
      cortical thickness and increased neuronal death, haemorrhage, cellular
      infiltration, calcification and lissencephaly — the same lesion set
      reported in human postmortem material.
    limitations: >-
      The enhancement is demonstrated in macaques and has not been shown to
      operate in human pregnancy, so it is a candidate explanation for the
      variable human severity rather than an established one. The model also
      cannot separate antibody-dependent enhancement from other consequences of
      prior flavivirus exposure.
    readouts:
    - name: Fetal head circumference and biparietal diameter by serial ultrasound
      target: Impaired Neurogenesis and Congenital Cortical Malformation
      direction: DECREASED
      interpretation: >-
        In vivo growth measurement across gestation, directly comparable to the
        human antenatal measure.
      evidence:
      - reference: PMID:37878671
        reference_title: "Exacerbated Zika virus-induced neuropathology and microcephaly in fetuses of dengue-immune nonhuman primates."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Ultrasound measurements of head circumference and biparietal diameter measurements taken sequentially throughout pregnancy demonstrated CZS in fetuses of DENV-immune pregnant macaques."
        explanation: The serial antenatal readout establishing microcephaly in the model.
    - name: Fetal brain histopathology
      target: Impaired Neurogenesis and Congenital Cortical Malformation
      direction: INCREASED
      interpretation: >-
        The lesion set matches human CZS neuropathology, which is what makes the
        model informative rather than merely a growth phenotype.
      evidence:
      - reference: PMID:37878671
        reference_title: "Exacerbated Zika virus-induced neuropathology and microcephaly in fetuses of dengue-immune nonhuman primates."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "severe CZS enhanced by DENV immunity was typified by reduced cortical thickness and increased frequency of neuronal death, hemorrhaging, cellular infiltrations, calcifications, and lissencephaly in fetal brains"
        explanation: The histological readouts, each of which has a human counterpart in this entry.
    evidence:
    - reference: PMID:37878671
      reference_title: "Exacerbated Zika virus-induced neuropathology and microcephaly in fetuses of dengue-immune nonhuman primates."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We found significantly increased severity of congenital Zika syndrome (CZS) in fetuses of DENV-immune cynomolgus macaques infected with ZIKV in early pregnancy compared with naïve controls, which occurred despite no effect on maternal ZIKV infection or antibody responses."
      explanation: >-
        The core result, including the control that makes it a fetal rather than
        a maternal effect: maternal infection and antibody responses were
        unchanged.

discussions:
- discussion_id: gap_czs_human_model_translatability
  prompt: >-
    Which parts of the congenital Zika syndrome mechanism are directly supported
    in human fetal disease, and which remain model-dependent findings from human
    iPSC-derived neural progenitors, cerebral organoids, mouse embryos,
    non-human-primate organoids, or organotypic fetal systems?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Transplacental Viral Transfer to the Fetal Compartment
  - pathophysiology#Neurotropic Entry into Fetal Neural Progenitors
  - pathophysiology#Antiviral Innate Immune Activation
  - pathophysiology#Viral Mitotic and Centrosome Cytopathy
  - pathophysiology#Neural Progenitor Apoptosis and Pool Depletion
  - pathophysiology#Impaired Neurogenesis and Congenital Cortical Malformation
  rationale: >-
    The disease pathograph now conforms to the viral neural progenitor cytopathy
    module, but much of the causal resolution comes from experimental systems
    rather than longitudinal human fetal material. Human autopsy anchors viral
    brain invasion and destructive malformation, while iPSC-derived hNPCs,
    cerebral organoids, mouse embryos, and non-human-primate organoids resolve
    entry, TLR3/TBK1 signaling, centrosome perturbation, apoptosis, and strain
    adaptation. This gap prevents a single model system from being treated as
    complete proof of the human prenatal disease sequence.
  evidence:
  - reference: PMID:27279226
    reference_title: "The Brazilian Zika virus strain causes birth defects in experimental models."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Mouse models often fail to reproduce the severely reduced brain size and
      pathological alterations found in human patients21,22, likely due to
      significant differences in gestation time and brain development between
      the two species.
    explanation: >-
      The paper explicitly identifies species and developmental-context
      differences that limit translation from mouse CZS models.
  - reference: PMID:27279226
    reference_title: "The Brazilian Zika virus strain causes birth defects in experimental models."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Finally, our data using a non-human primate organoids suggested that the
      ZIKVBR might have experienced adaptive changes in human cells.
    explanation: >-
      Supports a strain- and host-cell-context mismatch gap for translating
      organoid and animal findings to human congenital infection.

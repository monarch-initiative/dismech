    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Virus in the developing fetal CNS also reaches the spinal cord, where
      anterior horn motor neurons are lost. Whether this reflects the same
      progenitor-directed cytopathy operating at a second site, or direct
      infection of postmitotic motor neurons, is not established by the
      neuropathological material.
- name: Spinal Anterior Horn Motor Neuron Loss
  biological_scale: TISSUE
  description: >-
    Severe motor nerve cell loss in the anterior horn of the spinal cord is a
    consistent postmortem finding in congenital ZIKV infection, alongside
    hypoplasia of the descending tracts (small basis pontis, pyramids and spinal
    corticospinal tracts) that follows the loss of cortical output. The anterior
    horn lesion is the one that matters here, because it is what connects this
    entry's cortical mechanism to a phenotype the cortex cannot explain.

- accession: geo:GSE234062
  title: Human Otic progenitor cell models of congenital hearing loss applied to to Zika virus and cytomegalovirus infections
  description: Congenital hearing loss is a common chronic condition affecting children in both developed and developing nations. In many cases, congenital hearing loss is ultimately attributed to viral infection, most often by cytomegalovirus (CMV), but also in Congenital Zika Syndrome (CZS). The mechanisms by which CMV and ZIKV virus cause these cranial developmental defects have not been elucidated. Inner ear development has been particularly difficult to study, given the inaccessibility and scarcity of the tissue in animal models or on human autopsy; however, it is now possible to culture stem-cell derived otic progenitor cells (OPCs).

name: Congenital Zika Syndrome
creation_date: "2026-06-10T12:00:00Z"
category: Infectious Disease
disease_term:
  preferred_term: Zika virus congenital syndrome
  term:
    id: MONDO:0000890
    label: Zika virus congenital syndrome
parents:
- Microcephaly
synonyms:
- CZS
- congenital Zika virus syndrome
- Zika virus congenital syndrome
- congenital Zika virus infection
notes: >-
  Two things about this entry are worth knowing before extending it.

  First, the risk figures are lower than the outbreak-era coverage implies and
  should not be quoted from memory. In the largest Brazilian prospective cohort,
  major signs of CZS occurred in 2.5% of fetuses of symptomatic ZIKV-infected
  women and microcephaly or other CNS malformation in 3.9% of liveborn infants.
  What is large is not the absolute risk but its dependence on timing: fetal
  abnormalities were 14 times more likely when maternal infection occurred at or
  before 11 weeks.

  Second, head circumference is not a sufficient case definition, and the entry
  is curated so as not to imply that it is. Ventricular enlargement in CZS can be
  obstructive rather than ex-vacuo and present with a LARGE head; eye
  abnormalities and neurological alert signs occur in infants who appear normal
  at birth; and the reported frequency of sensorineural hearing loss depends
  entirely on whether the cohort was ascertained by microcephaly. Each of those
  is curated with the evidence that establishes it rather than left as caveat
  prose.
description: >-
  Congenital Zika syndrome (CZS) is a non-genetic malformation of cortical
  development caused by intrauterine infection with Zika virus (ZIKV), a
  mosquito-borne flavivirus. After maternal infection — most consequential for
  fetal neurodevelopment during the first and second trimesters — ZIKV crosses
  the placenta and reaches the developing fetal central nervous system, where it
  is neurotropic for apical and outer radial glia and other neural progenitor
  cells of the cortical ventricular and subventricular zones. Productive
  infection of these founder progenitors dysregulates the cell cycle, triggers
  caspase-mediated apoptosis, and activates innate antiviral signalling
  (including the TLR3 pathway and type I interferon responses), collectively
  depleting the progenitor pool and abrogating neurogenesis during the peak
  neurogenic window. The resulting deficit of cortical neurons produces the
  recognizable CZS phenotype: severe (often congenital) microcephaly with a
  markedly disproportionate skull, agyria/lissencephaly-like smooth cortex, intracranial
  (cortical and subcortical) calcifications, ventriculomegaly/hydrocephalus,
  and cortical thinning, frequently accompanied by ocular abnormalities,
  arthrogryposis, sensorineural hearing loss, seizures, and global
  developmental delay. CZS is the exemplar infectious (non-Mendelian) cortical
  malformation mechanism: its proximal cause is a defined viral exposure rather
  than a germline variant, but it converges on the same progenitor-depletion
  endpoint as genetic primary microcephaly, distinguished pathologically by a
  more destructive process with prominent cell death, necrosis, and
  calcification.
pathophysiology:
- name: Tunneling Nanotube-Mediated Intercellular Viral Spread
  biological_scale: CELLULAR
  description: >-
    ZIKV induces tunneling nanotubes (TNTs) — actin-rich, membrane-bounded
    intercellular conduits that carry viral components directly from cell to
    cell, bypassing the extracellular space. TNT-forming capacity maps to
    residues 40-52 of the viral nonstructural protein NS1: an engineered
    TNT-deficient mutant (ZIKVΔTNT) disseminates markedly less to maternal
    and fetal tissues than TNT-competent virus across multiple pregnancy models.
    Because transfer through a TNT is shielded from the extracellular
    compartment, this route also appears to let the virus persist in the face of
    a maternal type III interferon (IFN-lambda) response, implicating TNTs in
    immune evasion as well as in spread.
  biological_processes:
  - preferred_term: tunneling nanotube formation
    term:
      id: GO:0120031
      label: plasma membrane bounded cell projection assembly
    modifier: INCREASED
  - preferred_term: TNT-shielded escape from maternal type III interferon control
    term:
      id: GO:0042783
      label: symbiont-mediated evasion of host immune response
    modifier: INCREASED
  - preferred_term: maternal type III interferon (IFN-lambda) signaling at the maternal-fetal interface
    term:
      id: GO:0038196
      label: type III interferon-mediated signaling pathway
  evidence:
  - reference: PMID:42627154
    reference_title: "Tunneling nanotubes contribute to Zika virus pathogenesis at the maternal-fetal interface in vivo."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We previously showed that ZIKV induces tunneling nanotubes (TNTs), actin-rich intercellular conduits that enable direct cell-to-cell transfer of viral components."
    explanation: Defines TNTs as actin-rich conduits mediating direct cell-to-cell transfer of ZIKV components.
  - reference: PMID:42627154
    reference_title: "Tunneling nanotubes contribute to Zika virus pathogenesis at the maternal-fetal interface in vivo."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "A TNT-deficient ZIKV mutant (ZIKVΔTNT), harboring a change between residues 40 and 52 of the nonstructural protein 1 (NS1), showed markedly reduced viral dissemination to maternal and fetal tissues across all models tested, whereas the TNT-competent ZIKV established a robust infection."
    explanation: Loss-of-function genetic evidence that NS1-dependent TNT formation is required for maternal and fetal dissemination.
  - reference: PMID:42627154
    reference_title: "Tunneling nanotubes contribute to Zika virus pathogenesis at the maternal-fetal interface in vivo."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Loss of TNT-forming capacity also limited viral persistence despite maternal type III interferon (IFN-λ) responses, suggesting a role for TNTs in immune evasion."
    explanation: Links TNT-mediated spread to viral persistence under an active maternal IFN-lambda response.
  - reference: PMID:42627154
    reference_title: "Tunneling nanotubes contribute to Zika virus pathogenesis at the maternal-fetal interface in vivo."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Together, these findings provide in vivo evidence that TNTs are a key mechanism by which ZIKV enhances dissemination, promotes placental dysfunction, and drives fetal pathogenesis."
    explanation: The authors' in vivo summary claim placing TNTs upstream of placental dysfunction and fetal pathology.
  notes: >-
    No ontology term exists for the tunneling nanotube itself in GO, CL, or
    UBERON, so the structure is carried as a free-text `preferred_term` over the
    closest available parent process rather than being force-bound to `cytoneme`
    (GO:0035230) or `intercellular bridge` (GO:0045171), which name different
    structures. Recorded as an OBO gap. All evidence for this node is mouse
    in vivo; TNTs have not been demonstrated in human placental tissue in vivo
    (see the discussions block).
  downstream:
  - target: Placental Infection
    description: >-
      TNT-mediated spread within the placenta drives productive placental
      infection.
  - target: Transplacental Viral Transfer to the Fetal Compartment
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      TNT-competent virus reaches maternal and fetal tissues far more
      efficiently than TNT-deficient virus. The edge is retained because that
      dissemination difference is directly measured, but marked indirect: the
      route to the fetal compartment runs through placental infection, which is
      curated as its own node between the two.
- name: Placental Infection
  biological_scale: TISSUE
  description: >-
    ZIKV productively infects the placenta, producing histological placental
    pathology. The causal role of viral spread is established by the contrast
    with the TNT-deficient mutant, which produces less placental pathology. The
    placenta is therefore not merely a barrier ZIKV crosses but a target organ
    in its own right.
  cell_types:
  - preferred_term: trophoblast cell
    term:
      id: CL:0000351
      label: trophoblast cell
  locations:
  - preferred_term: placenta
    term:
      id: UBERON:0001987
      label: placenta
  evidence:
  - reference: PMID:42627154
    reference_title: "Tunneling nanotubes contribute to Zika virus pathogenesis at the maternal-fetal interface in vivo."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Using multiple pregnancy models, we demonstrate that viruses capable of forming these structures disseminate more efficiently, damage the placenta, and lead to fetal growth restriction, whereas TNT-deficient viruses show reduced infection and milder disease."
    explanation: States directly that TNT-competent virus damages the placenta, across the pregnancy models tested.
  - reference: PMID:42627154
    reference_title: "Tunneling nanotubes contribute to Zika virus pathogenesis at the maternal-fetal interface in vivo."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "ZIKVΔTNT infection was associated with reduced placental pathology, altered junctional-to-labyrinth architecture, improved placental efficiency, and protection from fetal growth restriction."
    explanation: The reduced placental pathology in the TNT-deficient mutant is the loss-of-function counterpart of the damage claim.
  notes: >-
    The trophoblast cell type is not named in PMID:42627154, whose placental
    readouts are the rodent junctional zone and labyrinth; `CL:0000351` is
    supplied from general placental biology as the resident parenchymal cell
    type of the infected organ, not asserted by this reference. All evidence for
    this node is mouse in vivo. No `conforms_to` is declared: the closest
    candidate, `innate_antiviral_interferon_response#Viral Interferon Antagonism
    and Innate Immune Evasion`, is about pathway antagonism (GO:0039502
    symbiont-mediated suppression of interferon signalling), which is a
    different mechanism from the physical compartment-shielding curated here —
    considered and declined rather than overlooked.
  downstream:
  - target: Placental Architectural and Functional Disruption
    description: >-
      Placental infection is followed by change in the relative architecture of
      the placental compartments and a fall in placental efficiency.
  - target: Transplacental Viral Transfer to the Fetal Compartment
    causal_link_type: DIRECT
    description: >-
      Placental infection and barrier injury permit virus to reach the fetal
      compartment and the developing central nervous system.
- name: Placental Architectural and Functional Disruption
  biological_scale: TISSUE
  description: >-
    Infected placentas differ from TNT-deficient-infected controls in the
    relative architecture of the placental compartments, and in placental
    efficiency (fetal mass supported per unit placental mass), which improves
    when viral spread is crippled.
  locations:
  - preferred_term: placenta
    term:
      id: UBERON:0001987
      label: placenta
  biological_processes:
  - preferred_term: placental architecture and efficiency
    term:

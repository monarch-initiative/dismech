    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "infects and replicates in primary human placental macrophages, called Hofbauer cells, and to a lesser extent in cytotrophoblasts, isolated from villous tissue of full-term placentae"
    explanation: Identifies the two placental cell types curated on this node, with their relative permissiveness.
  - reference: PMID:27443522
    reference_title: "Zika Virus Targets Different Primary Human Placental Cells, Suggesting Two Routes for Vertical Transmission."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our results suggest that ZIKV spreads from basal and parietal decidua to chorionic villi and amniochorionic membranes and that targeting TIM1 could suppress infection at the uterine-placental interface."
    explanation: >-
      The two-route structure of transfer, and the cofactor that is druggable at

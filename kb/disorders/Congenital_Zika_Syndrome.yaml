- name: Neurotropic Entry into Fetal Neural Progenitors
  biological_scale: CELLULAR
  description: >-
    Once in the fetal brain, ZIKV is neurotropic for radial glia and neural
    progenitor cells. Candidate entry receptors enriched on these cells —
    notably the TAM-family receptor tyrosine kinase AXL, which is highly
    expressed by human radial glia in the developing cortex — are thought to
    mediate or facilitate viral attachment and entry, establishing infection of
    the founder progenitor population during corticogenesis. Neuropathology
    confirms the target: infection of progenitor cells at the germinal matrix
    has been demonstrated in human material.

    AXL appears on both sides of this entry's transfer/entry split, and the
    duplication is real biology rather than a curation artefact: the same
    TAM-family cofactors are used at the placenta and on radial glia. They are
    nonetheless different claims about different cells in different organs, and
    are curated on the node each belongs to.
  conforms_to: viral_neural_progenitor_cytopathy#Fetal Brain Viral Exposure and Progenitor Infection

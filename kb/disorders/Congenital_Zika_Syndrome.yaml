      label: placenta development
    modifier: ABNORMAL
  evidence:
  - reference: PMID:42627154
    reference_title: "Tunneling nanotubes contribute to Zika virus pathogenesis at the maternal-fetal interface in vivo."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "ZIKVΔTNT infection was associated with reduced placental pathology, altered junctional-to-labyrinth architecture, improved placental efficiency, and protection from fetal growth restriction."
    explanation: Reports the altered compartment architecture and the improved placental efficiency of the TNT-deficient condition.
  notes: >-
    CRITICAL species caveat: the junctional zone and labyrinth are compartments
    of the *rodent* placenta and have no direct human homolog, so the measured
    "junctional-to-labyrinth architecture" readout cannot be carried over to
    human placental pathology. All evidence for this node is mouse in vivo.
    Scope of what the source states: the architectural readout is reported as
    *altered* in the TNT-deficient condition, with no direction given, so this
    node makes no claim about which way TNT-competent infection shifts it. The
    efficiency change does have a direction — the mutant improves it — and is
    stated as such in the description.
  downstream:
  - target: Fetal Growth Restriction
    description: >-
      Reduced placental efficiency limits fetal growth; crippling viral spread
      protects against the growth deficit.
- name: Fetal Growth Restriction
  biological_scale: ORGANISM
  description: >-
    The most distal outcome of the placental arm in the pregnancy models tested:
    TNT-competent ZIKV infection leads to fetal growth restriction, while
    TNT-deficient infection protects against it.
  evidence:
  - reference: PMID:42627154
    reference_title: "Tunneling nanotubes contribute to Zika virus pathogenesis at the maternal-fetal interface in vivo."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "ZIKVΔTNT infection was associated with reduced placental pathology, altered junctional-to-labyrinth architecture, improved placental efficiency, and protection from fetal growth restriction."
    explanation: Protection from fetal growth restriction in the TNT-deficient condition is the loss-of-function evidence for this outcome.
  - reference: PMID:42627154
    reference_title: "Tunneling nanotubes contribute to Zika virus pathogenesis at the maternal-fetal interface in vivo."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Using multiple pregnancy models, we demonstrate that viruses capable of forming these structures disseminate more efficiently, damage the placenta, and lead to fetal growth restriction, whereas TNT-deficient viruses show reduced infection and milder disease."
    explanation: States that TNT-competent virus leads to fetal growth restriction across the models tested.
  notes: >-
    Curated as an ORGANISM-scale pathophysiology node carrying MODEL_ORGANISM
    evidence, and deliberately NOT added to `phenotypes:` as a human phenotype:
    the finding is mouse-only, and model-organism evidence should not be the
    sole support for a human phenotype. A human citation would be needed to
    promote it. See the discussions block.
- name: Transplacental Viral Transfer to the Fetal Compartment
  biological_scale: TISSUE
  description: >-
    Crossing the maternal-fetal interface is a transport step, distinct from
    what the virus does once it arrives. Human placental work identifies more
    than one route rather than a single breach: ZIKV productively infects
    placental macrophages (Hofbauer cells) and, less efficiently,
    cytotrophoblasts in term villous tissue, and separately infects
    cytotrophoblasts, endothelial cells, fibroblasts and Hofbauer cells in
    chorionic villi together with amniotic epithelial cells and trophoblast
    progenitors in amniochorionic membranes. Those cells express the Axl, Tyro3
    and TIM1 entry cofactors, so the same TAM-family biology operates here as in
    the fetal brain — but on different cells, in a different organ, supporting a
    different claim. Curating them as one node conflated the two.

    Transfer is not uniformly permissive, and the restriction side explains the
    timing dependence the rest of this entry rests on. Primary human trophoblasts
    from full-term placentas are refractory to ZIKV and constitutively release
    type III interferon (IFN-lambda1) that protects both trophoblast and
    non-trophoblast cells, so virus reaching the fetal compartment must evade or
    bypass that barrier. Consistent with a barrier that strengthens as gestation
    proceeds, mid-gestation amniotic epithelial cells support higher viral titres
    than late-gestation cells.
  cell_types:
  - preferred_term: Hofbauer cell (placental macrophage)
    term:
      id: CL:3000001
      label: Hofbauer cell
  - preferred_term: Cytotrophoblast
    term:
      id: CL:0000523
      label: mononuclear cytotrophoblast cell

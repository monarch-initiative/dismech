    explanation: >-
      Gestational-age dependence measured at the placenta, which is the
      mechanistic counterpart of the clinical first-trimester risk.
  - reference: PMID:27066743
    reference_title: "Type III Interferons Produced by Human Placental Trophoblasts Confer Protection against Zika Virus Infection."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "PHT cells constitutively release the type III interferon (IFN) IFNλ1, which functions in both a paracrine and autocrine manner to protect trophoblast and non-trophoblast cells from ZIKV infection."

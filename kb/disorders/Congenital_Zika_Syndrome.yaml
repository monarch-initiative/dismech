- accession: geo:GSE102128
  title: RNA-seq of hiPSCs-derived NPCs from 3 pairs of dizygotic discordant twins for Congenital Zika syndrome
  description: Congenital Zika syndrome (CZS), caused by Zika virus (ZIKV) infection, has been associated to impairment of early brain development, particularly related to neural progenitor cells (NPCs) survival and growth. In this work we report in a high-throughput manner (RNA-Seq) the differences in the transcriptomes of hiPSCs(human induced pluripotent stem cells)-derived NPCs from 3 pairs of discordant twins for Congenital Zika syndrome (CZS).

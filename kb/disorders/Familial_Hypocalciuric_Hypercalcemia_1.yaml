    description: The clinical finding corresponding to the pathophysiology node.
- category: Biochemical
  name: Hypocalciuria
  frequency: VERY_FREQUENT
  description: >-
    Low urinary calcium excretion relative to serum calcium, conventionally
    expressed as a calcium/creatinine clearance ratio. It is the finding the
    disease is named for and the one that separates it from primary
    hyperparathyroidism, though the separation is imperfect.
  phenotype_term:
    preferred_term: Hypocalciuria
    term:
      id: HP:0003127
      label: Hypocalciuria
  evidence:
  - reference: PMID:32386559
    reference_title: 'Familial Hypocalciuric Hypercalcemia Type 1 and Autosomal-Dominant
      Hypocalcemia Type 1: Prevalence in a Large Healthcare Population.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 80% of FHH-affected individuals are hypocalciuric (Ca creatinine clearance
      ratio [CCCR] < 0.01) versus <20% of PHPT individuals with CCCR < 0.01
    explanation: Gives the frequency of hypocalciuria in FHH, supporting VERY_FREQUENT
      rather than obligate.
- category: Biochemical
  name: Elevated or Inappropriately Normal Parathyroid Hormone
  frequency: FREQUENT
  description: >-
    PTH that is not suppressed in the face of hypercalcaemia. It may sit within
    the reference interval - which is itself abnormal at this calcium level - or
    be frankly raised. This is the finding that puts primary hyperparathyroidism
    on the differential and cannot be used to exclude it.
  phenotype_term:
    preferred_term: Elevated circulating parathyroid hormone level
    term:
      id: HP:0003165
      label: Elevated circulating parathyroid hormone level
  evidence:
  - reference: PMID:32386559
    reference_title: 'Familial Hypocalciuric Hypercalcemia Type 1 and Autosomal-Dominant
      Hypocalcemia Type 1: Prevalence in a Large Healthcare Population.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: FHH1 accounts for ∼65% of cases, and is an autosomal-dominant condition
      characterized by lifelong elevations of serum calcium concentrations and normal
      or elevated serum parathyroid hormone (PTH) concentrations.
    explanation: States that PTH is normal or elevated rather than suppressed, which is
      the finding this phenotype records.
  sequelae:
  - target: Failure to Suppress Parathyroid Hormone Secretion
    description: The circulating readout of the parathyroid limb of the lesion.
- category: Biochemical
  name: Hypermagnesemia
  frequency: OCCASIONAL
  description: >-
    Mildly raised serum magnesium, reflecting the same paracellular transport
    defect that retains calcium. Supportive rather than diagnostic.
  phenotype_term:
    preferred_term: Hypermagnesemia
    term:
      id: HP:0002918
      label: Hypermagnesemia
  sequelae:
  - target: Hypermagnesemia
    description: The clinical finding corresponding to the pathophysiology node.
- category: Musculoskeletal
  name: Chondrocalcinosis
  frequency: OCCASIONAL
  description: >-
    Calcium pyrophosphate deposition in cartilage, reported in a minority of
    carriers and one of the few complications attributable to the chronic
    hypercalcaemia itself.
  phenotype_term:
    preferred_term: Chondrocalcinosis
    term:
      id: HP:0000934
      label: Chondrocalcinosis
- category: Gastrointestinal
  name: Pancreatitis
  frequency: RARE
  description: >-
    An uncommon association. Its causal attribution to FHH1 is contested rather
    than settled, and it should not be assumed in an individual patient without
    excluding the usual causes.
  phenotype_term:
    preferred_term: Pancreatitis
    term:
      id: HP:0001733
      label: Pancreatitis
- category: Renal
  name: Absence of Nephrolithiasis and Nephrocalcinosis
  frequency: VERY_FREQUENT
  description: >-
    Recorded as a phenotype because its absence is mechanistically informative
    rather than merely unremarkable. Chronic hypercalcaemia normally produces
    stones and nephrocalcinosis by way of hypercalciuria; the renal limb of the
    CASR lesion removes that intermediate step, so the complications that define
    the renal burden of primary hyperparathyroidism are largely absent here. This
    is a claim about the group, not a guarantee for an individual, and stones do
    occasionally occur in FHH1 carriers for unrelated reasons.
  phenotype_term:
    preferred_term: Nephrolithiasis
    term:
      id: HP:0000787
      label: Nephrolithiasis
genetic:
- name: CASR
  gene_term:
    preferred_term: CASR
    term:
      id: hgnc:1514
      label: CASR
  relationship_type: CAUSATIVE
  notes: >-
    CASR is one of the clearest allelic series in medicine, and FHH1 is best read
    against the rest of it: heterozygous loss of function gives this disease,
    biallelic loss of function gives neonatal severe hyperparathyroidism, and
    heterozygous gain of function gives autosomal dominant hypocalcaemia type 1,
    curated separately in this knowledge base. One receptor, dosed in both
    directions from normal.

    Two limits on genetic testing are worth recording. FHH1 accounts for roughly
    two-thirds of FHH; the remainder is FHH2 (GNA11) and FHH3 (AP2S1), which
    affect the receptor's downstream partners rather than the receptor itself and
    are clinically similar, so a negative CASR result does not exclude FHH. And
    within CASR, variant interpretation carries the usual difficulty that a rare
    missense change of uncertain significance is not by itself a diagnosis.
  evidence:
  - reference: PMID:7916660
    reference_title: Mutations in the human Ca(2+)-sensing receptor gene cause familial
      hypocalciuric hypercalcemia and neonatal severe hyperparathyroidism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We demonstrate that mutations in the human Ca(2+)-sensing receptor gene
      cause familial hypocalciuric hypercalcemia (FHH) and neonatal severe hyperparathyroidism
      (NSHPT), two inherited conditions characterized by altered calcium homeostasis.
    explanation: The founding demonstration that CASR is the causative gene, and that
      the same gene accounts for the neonatal subtype.
  - reference: PMID:20374733
    reference_title: Calcium-sensing receptor and associated diseases.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Heterozygous loss-of-function mutations cause familial (benign) hypocalciuric
      hypercalcemia (FHH) in which the lifelong mild hypercalcemia is generally asymptomatic.
      Homozygous inactivating mutations give rise to neonatal severe hyperparathyroidism
      (NSHPT) with extreme hypercalcemia and marked skeletal changes.
    explanation: The dose-dependent allelic series in one passage, which is what the
      note above is describing.
  - reference: PMID:32386559
    reference_title: 'Familial Hypocalciuric Hypercalcemia Type 1 and Autosomal-Dominant
      Hypocalcemia Type 1: Prevalence in a Large Healthcare Population.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: FHH1 accounts for ∼65% of cases
    explanation: Source for the share of FHH attributable to CASR rather than to GNA11
      or AP2S1, which is why a negative CASR result does not exclude FHH.
  case_fractions:
  - population: Familial hypocalciuric hypercalcemia, all genetic subtypes
    case_fraction_percent: 65.0
    notes: Share of FHH attributable to CASR (FHH1) rather than GNA11 (FHH2) or AP2S1
      (FHH3).
    evidence:
    - reference: PMID:32386559
      reference_title: 'Familial Hypocalciuric Hypercalcemia Type 1 and Autosomal-Dominant
        Hypocalcemia Type 1: Prevalence in a Large Healthcare Population.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: FHH1 accounts for ∼65% of cases
      explanation: States the CASR share of FHH directly.
biochemical:
- name: Serum total and ionised calcium
  presence: Increased
  context: >-
    The presenting analyte, usually found incidentally. The elevation is mild and
    stable over decades, which is itself a point of difference from the
    progressive hypercalcaemia of some other causes.
  biomarker_term:
    preferred_term: calcium(2+)
    term:
      id: CHEBI:29108
      label: calcium(2+)
  readouts:
  - target: Hypercalcemia with Non-Suppressed PTH
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: Reports the raised set point as it appears in the circulation.
- name: Calcium/creatinine clearance ratio
  presence: Decreased
  context: >-
    The discriminating measurement, computed from paired serum and urine calcium
    and creatinine. A ratio below 0.01 is the classic FHH figure; a two-step
    approach using a more permissive cut-off first and CASR sequencing second has
    been proposed because the distributions of FHH and primary hyperparathyroidism
    overlap.
  biomarker_term:
    preferred_term: calcium(2+)
    term:
      id: CHEBI:29108
      label: calcium(2+)
  readouts:
  - target: Hypocalciuria
    relationship: READOUT_OF
    direction: NEGATIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      Expresses urinary calcium relative to the prevailing serum calcium and renal
      function, which is what makes it more informative than a raw 24-hour calcium.
    evidence:
    - reference: PMID:18410554
      reference_title: 'Discriminative power of three indices of renal calcium excretion for the distinction between familial hypocalciuric hypercalcaemia and primary hyperparathyroidism: a follow-up study on methods.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Based on the ROC curve, the optimal cut-off point for diagnosing FHH using
        CCCR was < 0.0115, which yielded a diagnostic specificity of 0.88 and a sensitivity
        of 0.80.
      explanation: Quantifies the performance of the ratio as a diagnostic readout,
        against genetically and surgically confirmed comparison groups.
- name: Intact parathyroid hormone
  presence: Increased
  context: >-
    Measured with calcium rather than alone. The value that matters is whether
    PTH is suppressed for the prevailing calcium, not whether it exceeds the
    reference interval.
  biomarker_term:
    preferred_term: Parathyroid Hormone
    term:
      id: NCIT:C41027
      label: Parathyroid Hormone
  readouts:
  - target: Failure to Suppress Parathyroid Hormone Secretion
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: A PTH that is normal or raised alongside hypercalcaemia reports the
      parathyroid limb of the lesion.
prevalence:
- population: DiscovEHR cohort, single US health system, whole-exome sequenced
  measure_type: POINT_PREVALENCE
  prevalence_class: BAND_1_5_PER_10000
  rate_per_100000: 74.1
  notes: >-
    Genetic rather than clinical ascertainment: predicted loss-of-function CASR
    variants identified in 51,289 exomes and triaged against serum calcium. The
    authors note this makes FHH1 about as common as primary hyperparathyroidism,
    which reframes it from a rarity to a routine differential. Clinically
    ascertained estimates are lower, since most carriers never come to attention.
  evidence:
  - reference: PMID:32386559
    reference_title: 'Familial Hypocalciuric Hypercalcemia Type 1 and Autosomal-Dominant
      Hypocalcemia Type 1: Prevalence in a Large Healthcare Population.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: giving a prevalence in this population of 74.1 per 100,000 for FHH1 and
      3.9 per 100,000 for ADH1
    explanation: The population prevalence figure recorded here, with its cohort stated.
  - reference: PMID:32386559
    reference_title: 'Familial Hypocalciuric Hypercalcemia Type 1 and Autosomal-Dominant
      Hypocalcemia Type 1: Prevalence in a Large Healthcare Population.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'In conclusion, FHH1 is a common cause of hypercalcemia, with prevalence
      similar to that of primary hyperparathyroidism'
    explanation: Supports the note's claim that FHH1 is comparably common to the disease
      it is mistaken for.
diagnosis:
- name: Paired Serum Calcium and Intact PTH
  description: >-
    The entry point. Hypercalcaemia with a PTH that is not suppressed establishes
    a PTH-dependent hypercalcaemia and narrows the differential to primary
    hyperparathyroidism, FHH and a few rarer causes. It does not distinguish
    within that group.
  diagnosis_term:
    preferred_term: Laboratory Procedure
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
- name: Calcium/Creatinine Clearance Ratio
  description: >-
    The discriminating test, from paired serum and 24-hour urine calcium and
    creatinine. It is a screening step and not a rule: roughly a fifth of FHH
    patients are not hypocalciuric by the strict cut-off, and a substantial
    minority of primary hyperparathyroidism patients fall below it, so the ratio
    stratifies who should be sequenced rather than settling the diagnosis. Recent
    thiazide use, lithium, low calcium intake and vitamin D deficiency all move
    it.
  diagnosis_term:
    preferred_term: Laboratory Procedure
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  evidence:
  - reference: PMID:18410554
    reference_title: 'Discriminative power of three indices of renal calcium excretion for the distinction between familial hypocalciuric hypercalcaemia and primary hyperparathyroidism: a follow-up study on methods.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Our results support the use of the CCCR as an initial screening test for
      FHH. We suggest a two-step diagnostic procedure, where the first step is based
      on the CCCR with a cut-off at < 0.020, and the second step is CASR gene analysis
      in patients with FHH or PHPT.'
    explanation: Supports treating the ratio as a screening step followed by sequencing,
      which is how this entry describes it.
  - reference: PMID:18410554
    reference_title: 'Discriminative power of three indices of renal calcium excretion for the distinction between familial hypocalciuric hypercalcaemia and primary hyperparathyroidism: a follow-up study on methods.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Overlap analysis revealed that a cut-off point for CCCR at < 0.020 would
      sample 98% (53/54) of all patients with FHH and include 35% (34/97) of the PHPT
      patients.
    explanation: Quantifies the overlap that makes the ratio a stratifier rather than a
      decisive test.
- name: CASR Sequencing
  description: >-
    Confirmatory, and the step that should precede any decision about surgery in
    an ambiguous case. A negative result does not exclude FHH, since GNA11 and
    AP2S1 account for the remaining third.
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
treatments:
- name: Observation Without Intervention
  description: >-
    The correct management for the great majority of carriers. The hypercalcaemia
    is stable, the renal and skeletal complications that would justify treating it
    do not develop, and there is no evidence that lowering the calcium improves
    any outcome. Recording this as a treatment rather than as an absence of one is
    deliberate: the intervention that matters in FHH1 is the decision not to
    operate.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:32386559
    reference_title: 'Familial Hypocalciuric Hypercalcemia Type 1 and Autosomal-Dominant
      Hypocalcemia Type 1: Prevalence in a Large Healthcare Population.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: FHH1 is usually asymptomatic and requires no intervention
    explanation: States directly that the usual management is no intervention.
- name: Avoidance of Parathyroidectomy
  description: >-
    The single most consequential management decision in the disease, and the
    reason the diagnosis matters. Parathyroidectomy is the treatment for primary
    hyperparathyroidism and is inappropriate here, because the glands are
    responding correctly to a receptor that under-reports calcium; removing them
    does not reset the set point. The exception is the neonatal biallelic subtype,
    where parathyroidectomy is the definitive treatment and subtotal resection is
    reported as ineffective.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Surgical Procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  evidence:
  - reference: PMID:35566721
    reference_title: 'Disorders of the Calcium Sensing Signaling Pathway: From Familial
      Hypocalciuric Hypercalcemia (FHH) to Life Threatening Conditions in Infancy.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: In children, adolescents and young adults with FHH the main challenge is
      to distinguish the condition from primary hyperparathyroidism and thereby to avoid
      unnecessary treatments including parathyroidectomy.
    explanation: States avoidance of parathyroidectomy as the object of the diagnostic
      effort, which is what this entry records as a treatment decision.
  - reference: PMID:35566721
    reference_title: 'Disorders of the Calcium Sensing Signaling Pathway: From Familial
      Hypocalciuric Hypercalcemia (FHH) to Life Threatening Conditions in Infancy.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: In NSHPT, total parathyroidectomy is generally considered the definitive
      treatment.
    explanation: The neonatal exception noted here, where the same operation is
      indicated rather than avoided.
- name: Cinacalcet
  description: >-
    A calcimimetic - a positive allosteric modulator that lowers the calcium
    concentration needed to activate the receptor - and therefore a drug aimed at
    the actual lesion rather than at the number. It is reserved for the minority
    with symptomatic or marked hypercalcaemia, since most carriers need nothing.
    Reported to lower serum calcium and improve calcium clearance, and used
    successfully in the neonatal forms as well.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: cinacalcet
      term:
        id: CHEBI:48390
        label: cinacalcet
  target_mechanisms:
  - target: Right-Shifted Calcium Set Point
    description: >-
      Allosteric sensitisation of the mutant receptor partially offsets the
      rightward shift, which is why the drug acts on the mechanism and not merely
      on the calcium level.
  evidence:
  - reference: PMID:35566721
    reference_title: 'Disorders of the Calcium Sensing Signaling Pathway: From Familial
      Hypocalciuric Hypercalcemia (FHH) to Life Threatening Conditions in Infancy.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: In FHH, cinacalcet results in a significant reduction of serum calcium levels
      and improvement of calcium clearance after initiation of cinacalcet therapy
    explanation: Reports the biochemical effect of cinacalcet in FHH, which is the basis
      for its selective use here.
  - reference: PMID:35566721
    reference_title: 'Disorders of the Calcium Sensing Signaling Pathway: From Familial
      Hypocalciuric Hypercalcemia (FHH) to Life Threatening Conditions in Infancy.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Calcimimetic drugs, such as cinacalcet, are allosteric agonists at the CaSR
    explanation: Establishes the pharmacological class and mode of action that the
      target_mechanisms link asserts.
discussions:
- discussion_id: casr_lof_extracalcitropic_burden
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does the excess of cardiovascular and neurological diagnoses reported in CASR
    loss-of-function carriers reflect a consequence of the receptor defect, or
    ascertainment in a health-system cohort?
  attaches_to:
  - pathophysiology#Hypercalcemia with Non-Suppressed PTH
  rationale: >-
    A rare-variant burden test in the DiscovEHR exomes associated aggregated CASR
    loss-of-function variants with cardiovascular, neurological and other
    diagnoses. That is a real signal against the long-standing description of FHH1
    as entirely benign, and this entry deliberately does not fold it into the
    pathograph, because the study design cannot separate a mechanistic
    consequence of impaired calcium sensing from confounding in a
    healthcare-derived cohort. CASR is expressed well beyond parathyroid and
    kidney, so a genuine extra-calcitropic effect is biologically plausible rather
    than implausible - which is exactly why the question is worth recording rather
    than dismissing.
  proposed_experiments:
  - experiment_id: replicate_casr_lof_burden_population_cohort
    name: Independent replication in a population cohort not ascertained through care
    description: >-
      Test the same aggregated CASR loss-of-function burden against cardiovascular
      and neurological endpoints in a biobank recruited independently of
      healthcare contact, with serum calcium available so that carriers can be
      stratified by whether they are biochemically affected.
    would_support:
    - pathophysiology#Hypercalcemia with Non-Suppressed PTH
    supporting_outcome:
    - >-
      The association persists in carriers ascertained outside the health system
      and tracks biochemical severity, indicating a consequence of the receptor
      defect rather than of ascertainment.
    refuting_outcome:
    - >-
      The association is absent outside the healthcare-ascertained cohort, or is
      present in carriers with normal serum calcium as strongly as in those with
      hypercalcaemia, pointing to confounding.
notes: >-
  Scope and lump/split. Curated as a disease rather than as a subtype of a
  parent FHH entry, and rather than as a grouping. MONDO records no descendants
  under MONDO:0007791, and FHH2 (GNA11) and FHH3 (AP2S1) are sibling terms with
  different genes rather than children of this one, so the term denotes the
  CASR-specific entity. Neonatal severe hyperparathyroidism is carried here as a
  subtype because it is the same receptor at a higher mutational dose; it was not
  curated separately elsewhere in this knowledge base at the time of writing.

  Relationship to the rest of the CASR series. Autosomal_Dominant_Hypocalcemia_1
  curates the gain-of-function mirror of this disease and was used as the
  structural template for this entry, so the two pathographs are deliberately
  parallel: the same set-point node, the same parathyroid and renal limbs, with
  the direction of every modifier reversed. Reading them together is what makes
  "loss of function" concrete here.

  Two negative findings are curated as pathophysiology nodes rather than left
  implicit, because in this disease the absences carry the mechanism. Preserved
  bone mineral density despite chronically raised PTH, and the near-absence of
  stones and nephrocalcinosis despite chronic hypercalcaemia, are both
  consequences of the renal limb of the lesion and are both points of
  differentiation from primary hyperparathyroidism.

  What is deliberately not claimed. The pancreatitis association is recorded as
  RARE with its attribution flagged as contested rather than asserted. The
  cardiovascular and neurological burden signal is held in a KNOWLEDGE_GAP
  discussion rather than in the pathograph, for the ascertainment reason given
  there. No comorbidity or environmental block is curated, since nothing in the
  sources supported one.

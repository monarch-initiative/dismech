name: Familial Hypocalciuric Hypercalcemia 1
creation_date: "2026-09-04T00:00:00Z"
category: Mendelian
description: >-
  FHH1 is the loss-of-function half of the calcium-sensing receptor allelic
  series, and like its gain-of-function counterpart it is a disease of a moved
  set point rather than of a missing protein. The calcium-sensing receptor is a
  class C G-protein-coupled receptor that reads extracellular ionised calcium
  and, when that concentration rises, both suppresses parathyroid hormone
  secretion and reduces calcium reabsorption in the renal tubule. A heterozygous
  inactivating variant leaves that circuitry in place but shifts its
  dose-response curve to the right, so calcium concentrations a normal receptor
  would read as high are read as adequate.

  Two consequences follow from the one lesion, because the same receptor is
  doing two jobs in two organs. In the parathyroid, PTH is not suppressed at a
  calcium level that should suppress it, so hypercalcaemia is defended rather
  than corrected. In the thick ascending limb of the loop of Henle, the receptor
  normally restrains paracellular calcium reabsorption when calcium is high;
  with the receptor blunted, that brake is not applied and calcium is reabsorbed
  instead of excreted. The result is the combination the disease is named for:
  hypercalcaemia together with a urinary calcium that is low rather than the
  high value hypercalcaemia would otherwise produce.

  That second limb is also what makes the disease benign, and the contrast with
  primary hyperparathyroidism is the point. In PHPT the kidney is behaving
  normally and dutifully excretes the excess calcium, which is what generates
  stones and nephrocalcinosis; in FHH1 the kidney is part of the lesion and
  retains it, so the classic renal complications of hypercalcaemia largely do
  not occur, and bone density is not lost either. The hypercalcaemia is lifelong
  and non-progressive and most carriers never develop symptoms.

  The clinical stakes are therefore diagnostic rather than therapeutic. FHH1
  produces a biochemical picture - raised calcium with a PTH that is normal or
  frankly elevated - that is nearly indistinguishable from mild primary
  hyperparathyroidism, and PHPT is treated surgically. A patient with FHH1 who
  is mistaken for one with PHPT undergoes a parathyroidectomy that cannot work,
  because the parathyroid glands are responding correctly to a receptor that is
  misreporting the calcium level. Distinguishing the two is what the urinary
  calcium measurement and CASR sequencing are for, and it is the reason this
  entry exists as a disease rather than as a laboratory curiosity.

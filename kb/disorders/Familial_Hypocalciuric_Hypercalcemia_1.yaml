inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    A single inactivating allele is sufficient. The receptor is a dimer and the
    phenotype in heterozygotes reflects roughly half-normal calcium sensing
    rather than complete loss, which is why heterozygous carriers have mild
    lifelong hypercalcaemia while biallelic loss produces the far more severe
    neonatal disease recorded as a subtype below.
  evidence:
  - reference: PMID:20374733
    reference_title: Calcium-sensing receptor and associated diseases.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Heterozygous loss-of-function mutations cause familial (benign) hypocalciuric
      hypercalcemia (FHH) in which the lifelong mild hypercalcemia is generally
      asymptomatic.
    explanation: States that a single inactivating allele is sufficient and that the
      resulting hypercalcaemia is lifelong and usually asymptomatic.
has_subtypes:
- name: NSHPT
  display_name: Neonatal severe hyperparathyroidism (biallelic CASR loss of function)
  description: >-
    Homozygous or compound heterozygous inactivating CASR variants remove calcium
    sensing almost entirely rather than blunting it, and the result is a different
    disease in severity and urgency: marked hypercalcaemia presenting in the first
    days of life with muscular weakness, respiratory distress, fractures and
    failure to thrive, carrying real mortality. It is curated here as a subtype
    rather than as a separate entry because the lesion is the same receptor at a
    higher dose, which is the relationship the entry's genetic block records.

    Management inverts the adult rule. Parathyroidectomy is generally inappropriate
    in FHH1 and is the definitive treatment in NSHPT, and subtotal resection is
    reported as ineffective. A neonate carrying a single paternally inherited or
    de novo variant may instead present with the milder neonatal hyperparathyroidism
    that resolves over the first months, so the biallelic and monoallelic neonatal
    presentations must be distinguished before committing to surgery.
  evidence:
  - reference: PMID:35566721
    reference_title: 'Disorders of the Calcium Sensing Signaling Pathway: From Familial
      Hypocalciuric Hypercalcemia (FHH) to Life Threatening Conditions in Infancy.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: a clinically severe, ultra-rare disease associated with a high mortality
      usually caused by homozygous or compound heterozygous inactivating mutations
      in CaSR
    explanation: Establishes the biallelic genotype and the severity that separates
      this subtype from the heterozygous adult disease.
  - reference: PMID:35566721
    reference_title: 'Disorders of the Calcium Sensing Signaling Pathway: From Familial
      Hypocalciuric Hypercalcemia (FHH) to Life Threatening Conditions in Infancy.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Infants with NSHPT develop significant and symptomatic hypercalcemia with
      muscular weakness, respiratory distress, fractures, and failure to thrive in
      the early days of life
    explanation: Source for the neonatal presentation described in this subtype.
pathophysiology:
- name: Heterozygous CASR Loss-of-Function Variant
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    An inactivating variant, most often missense and frequently in the large
    extracellular calcium-binding domain, that raises the calcium concentration
    required to activate the receptor. Nonsense and frameshift alleles occur as
    well. Functional work on hypercalcaemia-associated missense alleles shows the
    defect is not confined to one step: expression, plasma-membrane targeting and
    signalling can each be impaired.
  genetic_context:
    gene:
      preferred_term: CASR
      term:
        id: hgnc:1514
        label: CASR
    functional_impact_category: LOSS_OF_FUNCTION
  molecular_functions:
  - preferred_term: calcium-sensing receptor activity
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0004930
      label: G protein-coupled receptor activity
  evidence:
  - reference: PMID:32386559
    reference_title: 'Familial Hypocalciuric Hypercalcemia Type 1 and Autosomal-Dominant
      Hypocalcemia Type 1: Prevalence in a Large Healthcare Population.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Functional studies showed that all hypercalcemia-associated missense variants
      impaired heterologous expression, plasma membrane targeting, and/or signaling
    explanation: Direct functional demonstration that the FHH1-associated alleles are
      loss of function, and that the impairment can act at expression, trafficking
      or signalling.
  - reference: PMID:7916660
    reference_title: Mutations in the human Ca(2+)-sensing receptor gene cause familial
      hypocalciuric hypercalcemia and neonatal severe hyperparathyroidism.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The expressed wild-type receptor elicited large inward currents in response
      to perfused polyvalent cations; a markedly attenuated response was observed with
      the mutated protein.
    explanation: The original oocyte expression experiment showing an FHH allele signals
      poorly compared with wild type.
  downstream:
  - target: Right-Shifted Calcium Set Point
    causal_link_type: DIRECT
    description: >-
      A receptor that requires more calcium to activate is, at the level of the
      whole homeostatic loop, a receptor with a higher set point.
- name: Right-Shifted Calcium Set Point
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    The set point is the serum calcium concentration at which PTH secretion is
    half-maximal. Shifting it upward is the single mechanistic statement from
    which the rest of the disease follows: nothing downstream is broken, but
    every calcium-sensing tissue is now regulating toward a higher target.
  biological_processes:
  - preferred_term: G protein-coupled receptor signaling pathway
    modifier: DECREASED
    term:
      id: GO:0007186
      label: G protein-coupled receptor signaling pathway
  evidence:
  - reference: PMID:35566721
    reference_title: 'Disorders of the Calcium Sensing Signaling Pathway: From Familial
      Hypocalciuric Hypercalcemia (FHH) to Life Threatening Conditions in Infancy.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: LOF of CaSR (in FHH1) or its downstream partner signaling proteins (in
      FHH2 and FHH3) result in an elevation of the body's calcium set point, defined
      as the serum calcium concentration at which PTH secretion is half-maximal.
    explanation: Defines the set point and states that CASR loss of function raises it,
      which is exactly this node.
  downstream:
  - target: Failure to Suppress Parathyroid Hormone Secretion
    causal_link_type: DIRECT
    description: The parathyroid limb of the shifted set point.
  - target: Increased Renal Tubular Calcium Reabsorption
    causal_link_type: DIRECT
    description: >-
      The renal limb. It is a separate edge rather than a consequence of the
      parathyroid limb, because the receptor acts on the tubule directly.
- name: Failure to Suppress Parathyroid Hormone Secretion
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Parathyroid chief cells continue to secrete PTH at calcium concentrations
    that should silence them. The cells are not autonomous and the glands are not
    neoplastic, which is why removing them does not address the lesion - they are
    obeying a receptor that is under-reporting the calcium level.
  cell_types:
  - preferred_term: parathyroid chief cell
    term:
      id: CL:0000446
      label: chief cell of parathyroid gland
  biological_processes:
  - preferred_term: parathyroid hormone secretion
    modifier: INCREASED
    term:
      id: GO:0035898
      label: parathyroid hormone secretion
  evidence:
  - reference: PMID:35566721
    reference_title: 'Disorders of the Calcium Sensing Signaling Pathway: From Familial
      Hypocalciuric Hypercalcemia (FHH) to Life Threatening Conditions in Infancy.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The resulting disorders share a constellation of inappropriately high PTH
      concentrations despite elevated serum calcium levels
    explanation: States the defining parathyroid abnormality - PTH that is inappropriate
      for the prevailing calcium rather than absolutely raised.
  downstream:
  - target: Hypercalcemia with Non-Suppressed PTH
    causal_link_type: DIRECT
    description: >-
      Continued PTH secretion sustains bone resorption and renal calcium
      retention, holding serum calcium above the normal range.
- name: Increased Renal Tubular Calcium Reabsorption
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED
  description: >-
    In the thick ascending limb the receptor normally responds to a rise in blood
    calcium by reducing paracellular calcium permeability, acting through the
    tight-junction protein claudin-14. A blunted receptor does not apply that
    brake, so calcium continues to be reabsorbed at concentrations where it
    should be shed. This is the limb that converts what would otherwise be
    ordinary hypercalcaemia into the hypocalciuric form.
  biological_processes:
  - preferred_term: renal calcium ion transport
    modifier: INCREASED
    term:
      id: GO:0070588
      label: calcium ion transmembrane transport
  evidence:
  - reference: PMID:42261748
    reference_title: Role of the calcium-sensing receptor in regulating calcium transport
      in the thick ascending limb.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Functional studies demonstrate that hypercalcemia-induced increases in urinary
      calcium excretion depend on renal CASR signaling, primarily through reduced paracellular
      calcium permeability in the TAL. Loss of the renal Casr in mice impairs urinary
      calcium excretion in conditions of hypercalcemia.
    explanation: Shows in mice that the calciuric response to hypercalcaemia requires
      renal CASR, which is the mechanism whose loss produces hypocalciuria here.
  - reference: PMID:42261748
    reference_title: Role of the calcium-sensing receptor in regulating calcium transport
      in the thick ascending limb.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: CASR activation upregulates claudin-14 (CLDN14), a tight junction protein
      that selectively blocks paracellular divalent cation reabsorption.
    explanation: Names the molecular effector through which the receptor restrains
      paracellular calcium reabsorption.
  downstream:
  - target: Hypocalciuria
    causal_link_type: DIRECT
    description: Reabsorbed calcium is calcium that does not appear in the urine.
  - target: Hypercalcemia with Non-Suppressed PTH
    causal_link_type: DIRECT
    description: >-
      Renal retention contributes to the circulating excess independently of the
      parathyroid limb.
  - target: Reduced Renal Magnesium Excretion
    causal_link_type: DIRECT
    description: >-
      The same paracellular pathway carries magnesium, so the transport defect is
      not selective for calcium.
- name: Hypocalciuria
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  description: >-
    Urinary calcium that is low in absolute terms or, more informatively, low
    relative to the prevailing serum calcium. It is simultaneously the diagnostic
    signature of the disease and the reason for its benign course, since the
    renal complications of chronic hypercalcaemia require calcium to be passing
    through the kidney.
  evidence:
  - reference: PMID:32386559
    reference_title: 'Familial Hypocalciuric Hypercalcemia Type 1 and Autosomal-Dominant
      Hypocalcemia Type 1: Prevalence in a Large Healthcare Population.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 80% of FHH-affected individuals are hypocalciuric (Ca creatinine clearance
      ratio [CCCR] < 0.01) versus <20% of PHPT individuals with CCCR < 0.01
    explanation: Quantifies how far hypocalciuria separates FHH from primary
      hyperparathyroidism, and by omission how often it does not.
- name: Reduced Renal Magnesium Excretion
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  description: >-
    Magnesium shares the claudin-gated paracellular route that the receptor
    regulates, so a blunted receptor retains magnesium alongside calcium. The
    resulting serum magnesium is typically high-normal to mildly raised rather
    than overtly abnormal.
  downstream:
  - target: Hypermagnesemia
    causal_link_type: DIRECT
    description: Retention raises circulating magnesium.
- name: Hypercalcemia with Non-Suppressed PTH
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  description: >-
    The biochemical core of the disease and the source of its entire clinical
    problem, which is that it looks like mild primary hyperparathyroidism. The
    hypercalcaemia is lifelong, non-progressive and usually mild, and the PTH
    accompanying it is normal or slightly raised rather than suppressed as it
    would be if the hypercalcaemia had a non-parathyroid cause.
  evidence:
  - reference: PMID:35566721
    reference_title: 'Disorders of the Calcium Sensing Signaling Pathway: From Familial
      Hypocalciuric Hypercalcemia (FHH) to Life Threatening Conditions in Infancy.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: 'Clinically, FHH is a benign, typically asymptomatic disease and usually
      presents with the biochemical triad: life-long, non-progressive hypercalcemia,
      normal or slightly increased serum PTH levels and hypocalciuria'
    explanation: The biochemical triad this node names, together with the benign,
      non-progressive course.
  downstream:
  - target: Preserved Bone Mineral Density Despite Chronic PTH Elevation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Chronic exposure to a modestly raised PTH does not, in this disease,
      translate into the bone loss the same biochemistry causes in primary
      hyperparathyroidism.
- name: Hypermagnesemia
  biological_scale: ORGANISM
  mechanism_confidence: PROVISIONAL
  description: >-
    Mildly raised serum magnesium, a supportive rather than a diagnostic finding.
    It is worth recording because it is a point of difference from primary
    hyperparathyroidism, where magnesium is typically normal or low.
- name: Preserved Bone Mineral Density Despite Chronic PTH Elevation
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED
  description: >-
    A deliberately negative node. Patients carry raised PTH and alkaline
    phosphatase for decades without losing bone, and bone density does not track
    the severity of the CASR variant. This is a real dissociation rather than an
    absence of data, and it belongs in the pathograph because it is one of the
    things that makes FHH1 mechanistically unlike primary hyperparathyroidism
    despite the shared biochemistry.
  evidence:
  - reference: PMID:19250271
    reference_title: Skeletal consequences of familial hypocalciuric hypercalcaemia vs.
      primary hyperparathyroidism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Familiar hypocalciuric hypercalcaemia is associated with increased PTH and
      AP compared to normal controls, but not with bone loss irrespective of the severity
      of the CASR mutations.
    explanation: Directly states the dissociation between chronically raised PTH and
      bone loss, and that it holds across variant severity.
  - reference: PMID:19250271
    reference_title: Skeletal consequences of familial hypocalciuric hypercalcaemia vs.
      primary hyperparathyroidism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: They had higher Z-scores in the hip and in the forearm.
    explanation: The densitometric comparison against primary hyperparathyroidism
      underlying this node.
phenotypes:
- category: Biochemical
  name: Hypercalcemia
  frequency: OBLIGATE
  description: >-
    Lifelong, non-progressive and usually mild. Most often found incidentally on
    a routine calcium measurement rather than through symptoms.
  phenotype_term:
    preferred_term: Hypercalcemia
    term:
      id: HP:0003072
      label: Hypercalcemia
    clinical_course: STABLE
  evidence:
  - reference: PMID:35566721
    reference_title: 'Disorders of the Calcium Sensing Signaling Pathway: From Familial
      Hypocalciuric Hypercalcemia (FHH) to Life Threatening Conditions in Infancy.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: 'Clinically, FHH is a benign, typically asymptomatic disease and usually
      presents with the biochemical triad: life-long, non-progressive hypercalcemia,
      normal or slightly increased serum PTH levels and hypocalciuria'
    explanation: States the hypercalcaemia and that it is lifelong and non-progressive,
      which is what the STABLE clinical course records.
  sequelae:

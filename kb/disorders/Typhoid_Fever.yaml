    explanation: The review directly names S. Typhi as a Gram-negative human-restricted cause of typhoid fever.
transmission:
- name: Fecal-oral food and water transmission
  description: >-
    Acutely infected patients and chronic carriers shed S. Typhi into the human
    reservoir; exposure to fecally contaminated food, drinking water, or poor
    hygiene delivers organisms to susceptible hosts.
  evidence:
  - reference: PMID:38913735
    reference_title: "Spatial and temporal clustering of typhoid fever in an urban slum of Dhaka City: Implications for targeted typhoid vaccination."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "Salmonella enterica serotype Typhi (Salmonella Typhi) causes severe and occasionally life-threatening disease, transmitted through contaminated food and water."
    explanation: The cohort paper's background directly supports contaminated food and water as fecal-oral transmission routes for S. Typhi.
  - reference: PMID:41335321
    reference_title: "Chronic carriers and multidrug resistance in typhoid fever: pathogenesis, challenges, and integrated control strategies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Chronic carriers, accounting for 2-5% of infections, play a crucial role in disease transmission. These carriers are often asymptomatic but intermittently shed bacteria, sustaining S. Typhi within the human population."
    explanation: The review supports intermittent bacterial shedding by chronic carriers as a route that sustains the human reservoir.

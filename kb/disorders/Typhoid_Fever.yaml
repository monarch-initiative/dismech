name: Typhoid Fever
creation_date: '2026-09-25T07:53:04Z'
category: Infectious Disease
description: >-
  Typhoid fever is an enteric fever syndrome caused by the human-restricted
  bacterium Salmonella enterica serovar Typhi. Fecal-oral exposure to
  contaminated food or water seeds intestinal invasion, macrophage intracellular
  survival, systemic bacteremia, and, in a minority of patients, chronic
  gallbladder carriage that sustains human-to-human transmission.
disease_term:
  preferred_term: typhoid fever
  term:
    id: MONDO:0005619
    label: typhoid fever
parents:
- Bacterial Infection
- Enteric fever
synonyms:
- Enteric fever due to Salmonella Typhi
- Typhoid
definitions:
- name: Salmonella Typhi enteric-fever definition
  definition_type: OTHER
  description: >-
    Typhoid fever is the systemic enteric-fever syndrome caused by Salmonella
    enterica serovar Typhi.
  evidence:
  - reference: PMID:40095029
    reference_title: "Virulence factors of Salmonella Typhi: interplay between the bacteria and host macrophages."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Salmonella Typhi (S. Typhi) is a Gram-negative bacterium that exclusively infects humans and causes typhoid fever- a major global public health concern responsible for approximately 9 million infections and 110,000 deaths annually."
    explanation: The review identifies S. Typhi as an exclusively human pathogen that causes typhoid fever.

diagnosis:
- name: Blood culture for S. Typhi
  description: >-
    Blood culture with organism identification confirms S. Typhi bacteremia
    and distinguishes typhoid from paratyphoid and other causes of prolonged fever.
  evidence:
  - reference: PMID:41246786
    reference_title: "Clinical Spectrum and Outcomes of Typhoid Fever: A Retrospective Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Blood cultures were positive in 238 (78.0%) of patients, with Salmonella Typhi identified in 196 (64.3%)."
    explanation: The clinical series used blood cultures to identify S. Typhi among confirmed typhoid fever patients.
treatments:
- name: Antibiotic therapy guided by susceptibility testing
  description: >-
    Culture-confirmed typhoid requires antibiotic therapy chosen against local
    and isolate-level susceptibility because XDR lineages can resist older
    first-line agents, fluoroquinolones, and ceftriaxone.
  treatment_term:
    preferred_term: antibiotic therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Antimicrobial-resistant S. Typhi
    treatment_effect: MODULATES
    description: Susceptibility results determine which antibiotic classes remain active against resistant S. Typhi.
  evidence:
  - reference: PMID:41550837
    reference_title: "Clinical Characteristics and Resistance Patterns of Extensively Drug-Resistant Salmonella Typhi in the Pediatric Population of Pakistan: A Prospective Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All isolates were resistant to ceftriaxone, ciprofloxacin, and first-line agents; meropenem and azithromycin remained 100% and 96.9% susceptible."
    explanation: The XDR cohort supports susceptibility-guided treatment in an era when ceftriaxone, ciprofloxacin, and older first-line agents can all fail.
- name: Typhoid conjugate vaccination
  description: >-
    Vi tetanus-toxoid conjugate vaccines reduce blood culture-confirmed typhoid
    risk and are a preventive intervention for endemic areas.
  treatment_term:
    preferred_term: vaccination
    term:
      id: NCIT:C15346
      label: Vaccination
  therapeutic_modality: VACCINE
  evidence:
  - reference: PMID:40788116
    reference_title: "Efficacy and Safety of Tetanus-Toxoid Conjugate Typhoid Vaccine (Vi-TT) in Children and Adolescents: A Systematic Review and Meta-Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Four trials with 111 481 children found the risk of blood culture-confirmed typhoid fever after Vi-TT to be 0.18 compared with nontyphoid vaccines."
    explanation: The meta-analysis supports typhoid conjugate vaccination as a protective intervention in children and adolescents.
prevalence:
- population: Global population
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: UNKNOWN
  rate_denominator: POPULATION_PER_YEAR
  notes: >-
    The 14.3 million figure is modeled global 2017 annual incidence for the
    combined typhoid/paratyphoid enteric-fever group, not a point prevalence;
    the same GBD model attributed 76.3% of 2017 enteric-fever cases to S. Typhi.
  evidence:
  - reference: PMID:30792131
    reference_title: "The global burden of typhoid and paratyphoid fevers: a systematic analysis for the Global Burden of Disease Study 2017."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "In 2017, Salmonella enterica serotype Typhi caused 76.3% (71.8-80.5) of cases of enteric fever."
    explanation: The GBD model splits modeled enteric-fever burden into Typhi and Paratyphi proportions.
progression:
- phase: Acute enteric fever
  duration: Days to weeks
  notes: >-
    Untreated typhoid progresses as a subacute febrile illness that can develop
    late complications, including intestinal perforation.
  evidence:
  - reference: PMID:41246786
    reference_title: "Clinical Spectrum and Outcomes of Typhoid Fever: A Retrospective Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Complications occurred in 84 (27.5%) of patients, most commonly gastrointestinal bleeding 32 (10.5%) and intestinal perforation 21 (6.9%)."
    explanation: The retrospective series documents late gastrointestinal complications in confirmed typhoid.
- phase: Chronic gallbladder carriage
  duration: Months to years
  notes: >-
    A minority of infected people become asymptomatic chronic carriers whose
    gallbladder biofilms intermittently shed S. Typhi and sustain transmission.
  evidence:
  - reference: PMID:41335321
    reference_title: "Chronic carriers and multidrug resistance in typhoid fever: pathogenesis, challenges, and integrated control strategies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Chronic carriers, accounting for 2-5% of infections, play a crucial role in disease transmission. These carriers are often asymptomatic but intermittently shed bacteria, sustaining S. Typhi within the human population."
    explanation: The review establishes chronic asymptomatic shedding as a minority outcome after acute S. Typhi infection.
notes: >-
  OpenScientist deep research found no Mendelian human causal gene for typhoid
  fever; host loci are susceptibility modifiers at most. The report suggested
  GO:0009405 for pathogenesis, but that GO term is obsolete, so it is not used.

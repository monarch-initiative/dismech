    reference_title: "Clinical Spectrum and Outcomes of Typhoid Fever: A Retrospective Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Blood cultures were positive in 238 (78.0%) of patients, with Salmonella Typhi identified in 196 (64.3%)."
    explanation: The confirmed clinical series reports culture-positive S. Typhi among typhoid fever patients.
  downstream:
  - target: Fever
    description: Culture-confirmed typhoid presents as a universal febrile syndrome in this cohort.
  - target: Abdominal pain
    description: Gastrointestinal inflammatory disease commonly produces abdominal pain.
  - target: Anorexia
    description: Systemic febrile illness commonly suppresses appetite.
  - target: Headache
    description: Systemic febrile inflammation commonly produces headache.
  - target: Diarrhea
    description: Intestinal involvement can manifest with diarrhea.
  - target: Constipation
    description: Intestinal involvement can alternatively manifest with constipation.
  - target: Hepatomegaly
    description: Dissemination through the reticuloendothelial system enlarges the liver in a subset of cases.
  - target: Splenomegaly
    description: Dissemination through the reticuloendothelial system enlarges the spleen in a subset of cases.
- name: Typhoid toxin delivery
  description: >-
    S. Typhi assembles a multipartite CdtB-PltA-PltB typhoid toxin and delivers
    the CdtB genotoxin from intracellular bacteria toward target cells.
  cellular_components:
  - preferred_term: Salmonella-containing vacuole
    term:
      id: GO:0020003
      label: symbiont-containing vacuole
  evidence:
  - reference: PMID:18191792
    reference_title: Delivery of a Salmonella Typhi exotoxin from a host intracellular compartment.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here, we show that PltA and PltB, which are encoded in the same pathogenicity islet as cdtB, associate with CdtB to form a multipartite toxin."
    explanation: The Cell Host & Microbe study identifies the CdtB-PltA-PltB multipartite typhoid toxin.
  - reference: PMID:18191792
    reference_title: Delivery of a Salmonella Typhi exotoxin from a host intracellular compartment.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We also show that PltA and PltB are required for the delivery of CdtB from an intracellular compartment to target cells via autocrine and paracrine pathways."
    explanation: The same study supports intracellular toxin export and target-cell delivery.
- name: Ileal necrosis and intestinal perforation
  description: >-
    Late severe intestinal typhoid can ulcerate ileal lymphoid tissue and
    perforate the intestine, driving peritonitis and death if not promptly
    treated.
  locations:
  - preferred_term: ileum
    term:
      id: UBERON:0002116
      label: ileum
  evidence:
  - reference: PMID:24743649
    reference_title: "Case fatality rate and length of hospital stay among patients with typhoid intestinal perforation in developing countries: a systematic literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "From 42 published reports, a total of 4,626 hospitalized typhoid intestinal perforation cases and 706 deaths were recorded (CFR = 15.4%; 95% CI; 13.0%-17.8%) with a significant regional differences."
    explanation: The systematic review establishes typhoid intestinal perforation as a severe, mortality-associated complication.
  downstream:
  - target: Intestinal perforation
    description: Necrotic ileal ulceration can perforate the bowel wall.
- name: Gallbladder biofilm carriage
  description: >-
    A small fraction of S. Typhi infections transition to chronic gallbladder
    carriage; gallstones provide a biofilm niche that favors persistence,
    intermittent shedding, and antibiotic tolerance.
  locations:
  - preferred_term: gallbladder
    term:
      id: UBERON:0002110
      label: gallbladder
  biological_processes:
  - preferred_term: biofilm formation
    term:
      id: GO:0042710
      label: biofilm formation
  evidence:
  - reference: PMID:41335321
    reference_title: "Chronic carriers and multidrug resistance in typhoid fever: pathogenesis, challenges, and integrated control strategies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Gallstones are strongly associated with the chronic carrier state, providing a niche for bacterial biofilm formation that enhances persistence and antibiotic resistance."
    explanation: The chronic-carriage review links gallstones, gallbladder biofilm, persistence, and antibiotic resistance.
  - reference: PMID:31575775
    reference_title: Establishment of Chronic Typhoid Infection in a Mouse Carriage Model Involves a Type 2 Immune Shift and T and B Cell Recruitment to the Gallbladder.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Salmonella forms biofilms on gallstones to establish gallbladder carriage."
    explanation: The mouse carriage model supports gallstone biofilm formation as a mechanism that establishes gallbladder carriage.
- name: Antimicrobial-resistant S. Typhi
  description: >-
    Extensively drug-resistant S. Typhi can resist ceftriaxone, ciprofloxacin,
    and older first-line drugs while retaining susceptibility to only a narrow
    remaining set of antibiotics in affected settings.
  biological_processes:
  - preferred_term: response to antibiotic
    term:
      id: GO:0046677
      label: response to antibiotic
  evidence:
  - reference: PMID:41550837
    reference_title: "Clinical Characteristics and Resistance Patterns of Extensively Drug-Resistant Salmonella Typhi in the Pediatric Population of Pakistan: A Prospective Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All isolates were resistant to ceftriaxone, ciprofloxacin, and first-line agents; meropenem and azithromycin remained 100% and 96.9% susceptible."
    explanation: The pediatric XDR S. Typhi cohort documents clinically decisive resistance to ceftriaxone, ciprofloxacin, and older first-line drugs.

pathophysiology:
- name: Salmonella epithelial invasion
  description: >-
    S. Typhi uses Salmonella pathogenicity-island virulence factors for
    adhesion and invasion after reaching the intestinal epithelium.
  cell_types:
  - preferred_term: intestinal epithelial cell
    term:
      id: CL:0002563
      label: intestinal epithelial cell
  locations:

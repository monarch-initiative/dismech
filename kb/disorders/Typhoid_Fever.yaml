      label: exposure to contaminated water
  influences_mechanisms:
  - target: Salmonella epithelial invasion
    environmental_effect: TRIGGERS
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Fecal contamination of water or food brings viable S. Typhi to the small-intestinal epithelium.
  description: >-
    Inadequate water, sanitation, and hygiene are major modifiable exposure
    contexts for fecal-oral S. Typhi transmission.
  presence: Present
  evidence:
  - reference: PMID:37983081
    reference_title: "Association Among Household Water, Sanitation, and Hygiene (WASH) Status and Typhoid Risk in Urban Slums: Prospective Cohort Study in Bangladesh."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found that residence in households with improved WASH facilities was associated with a 38% reduction in typhoid risk"
    explanation: The prospective cohort supports household WASH status as a modifiable exposure axis for typhoid risk.

      label: symbiont entry into host cell
  evidence:
  - reference: PMID:40095029
    reference_title: "Virulence factors of Salmonella Typhi: interplay between the bacteria and host macrophages."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "These virulence factors facilitate S. Typhi's intracellular survival within macrophages by mediating processes such as adhesion, invasion, nutrient acquisition and immune evasion, ultimately enabling systemic infection."
    explanation: The Typhi macrophage review supports bacterial adhesion and invasion among the processes used to initiate intracellular infection.
  downstream:
  - target: Macrophage Salmonella-containing vacuole survival
    description: After mucosal invasion, S. Typhi can survive inside host macrophages in Salmonella-containing vacuoles.
  - target: Ileal necrosis and intestinal perforation
    description: Intestinal infection can progress to ulceration and perforation in severe late disease.
- name: Macrophage Salmonella-containing vacuole survival
  description: >-
    Virulence determinants including type III secretion systems, Salmonella
    pathogenicity-island genes, and the Vi capsule support intracellular S.
    Typhi survival in macrophages.
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  cellular_components:
  - preferred_term: Salmonella-containing vacuole
    term:
      id: GO:0020003
      label: symbiont-containing vacuole
  biological_processes:
  - preferred_term: development of symbiont in host
    term:
      id: GO:0044114
      label: development of symbiont in host
  evidence:
  - reference: PMID:40095029
    reference_title: "Virulence factors of Salmonella Typhi: interplay between the bacteria and host macrophages."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "S. Typhi expresses a range of virulence factors, including the virulence-associated (Vi) capsule, outer membrane proteins (OMPs), flagella, fimbriae, type III secretion systems (T3SSs) and other genes encoded on Salmonella pathogenicity islands (SPIs), as well as toxins, regulatory factors, and virulence plasmids."
    explanation: The macrophage-focused review identifies S. Typhi virulence systems involved in intracellular infection.
  - reference: PMID:40095029
    reference_title: "Virulence factors of Salmonella Typhi: interplay between the bacteria and host macrophages."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "These virulence factors facilitate S. Typhi's intracellular survival within macrophages by mediating processes such as adhesion, invasion, nutrient acquisition and immune evasion, ultimately enabling systemic infection."
    explanation: The same review explicitly links S. Typhi virulence factors to macrophage intracellular survival and systemic infection.
  downstream:
  - target: Vi capsule autophagy evasion
    description: Vi expression supports macrophage survival by reducing antibacterial autophagy.
  - target: Typhi SPI-1 inflammasome activation
    description: SPI-1 effectors activate caspase-1 and IL-1 beta responses in macrophages.
  - target: S. Typhi bacteremia
    description: Intracellular survival supports systemic dissemination and culture-positive bacteremia.
  - target: Typhoid toxin delivery
    description: Typhi expresses typhoid toxin within the Salmonella-containing vacuole.
- name: Vi capsule autophagy evasion
  description: >-
    The S. Typhi Vi capsule decreases macrophage macroautophagy through lower
    Nod2 and Galectin-8 expression, allowing greater intracellular bacterial
    survival than Vi-deficient mutants.
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: macroautophagy
    term:
      id: GO:0016236
      label: macroautophagy
  - preferred_term: symbiont-mediated perturbation of host innate immune response
    term:
      id: GO:0052167
      label: symbiont-mediated perturbation of host innate immune response
  evidence:
  - reference: PMID:39732413
    reference_title: Vi capsular polysaccharide of Salmonella enterica serovar Typhi disturbs autophagy to increase intracellular survival in macrophages.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In summary, we propose that Vi capsule of S. Typhi decreased autophagy of macrophages to increase its survival in host cells by decreasing the expression of Nod2 and Galectin-8."
    explanation: THP-1 macrophage experiments show Vi-dependent reduction of autophagy and increased S. Typhi survival.
  downstream:
  - target: S. Typhi bacteremia
    description: Macrophage survival mechanisms enable dissemination to blood and reticuloendothelial sites.
- name: Typhi SPI-1 inflammasome activation
  description: >-
    S. Typhi SPI-1 effectors drive caspase-1 and IL-1 beta inflammasome
    activation in human monocyte-derived macrophages, providing a host-response
    link to bacteremic hyperinflammation.
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: acute inflammatory response
    term:
      id: GO:0002526
      label: acute inflammatory response
  evidence:
  - reference: PMID:32387390
    reference_title: Hyperexpression of type III secretion system of Salmonella Typhi linked to a higher cytotoxic effect to monocyte-derived macrophages by activating inflammasome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Thus, S. Typhi, relative to its non-typhoidal counterpart, S. Typhimurium, induces greater SPI-1-dependent inflammasome activation in monocyte-derived macrophages."
    explanation: The in vitro and ex vivo macrophage study attributes the greater Typhi inflammasome signal to SPI-1.
  downstream:
  - target: S. Typhi bacteremia
    description: SPI-1 inflammasome activation is one inflammatory arm of systemic bacteremic typhoid.
- name: S. Typhi bacteremia
  description: >-
    Systemic dissemination produces blood culture-positive typhoidal Salmonella
    infection and a febrile gastrointestinal syndrome.
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage

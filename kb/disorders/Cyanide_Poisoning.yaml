name: Cyanide Poisoning
creation_date: "2026-09-10T00:00:00Z"
category: Environmental
categories:
- Toxic Exposure Disorder
- Environmental Health Disorder
- Chemical Asphyxiant Poisoning
synonyms:
- cyanide toxicity
- hydrocyanic acid poisoning
- prussic acid poisoning
- hydrogen cyanide poisoning
description: >-
  Cyanide poisoning is an acute chemical-asphyxiant toxidrome caused by exposure
  to the cyanide ion or to compounds that release it: hydrogen cyanide gas from
  the combustion of nitrogen-containing synthetic polymers in structure fires,
  alkali cyanide salts used in electroplating and metal finishing, cyanogenic
  glycosides such as amygdalin in apricot kernels and bitter almonds, and the
  metabolic breakdown of infused sodium nitroprusside. Absorbed cyanide binds
  the ferric heme a3 centre of mitochondrial cytochrome c oxidase (Complex IV)
  and arrests the terminal step of the electron transport chain, so cells cannot
  use oxygen that is being delivered normally - histotoxic, rather than hypoxic,
  hypoxia. Oxidative phosphorylation fails, ATP is depleted within minutes, and
  metabolism is forced onto anaerobic glycolysis, producing severe high-anion-gap
  lactic acidosis. The brain and myocardium, with the highest oxidative demand,
  fail first: headache, vertigo and confusion give way to coma, seizures,
  hypotension, bradyarrhythmia and cardiac arrest. Classic bedside signs (bitter
  almond odour, cherry-red skin) are unreliable and blood cyanide assays are too
  slow to guide care, so plasma lactate serves as the practical surrogate marker.
  Survivors of severe poisoning may develop a delayed dystonic-parkinsonian
  syndrome weeks to months later, correlating with bilateral globus pallidus and
  putaminal lesions. Endogenous detoxification by rhodanese (thiosulfate
  sulfurtransferase) converts cyanide to renally excreted thiocyanate but is
  sulfur-donor limited and rapidly overwhelmed, which is the pharmacologic basis
  for thiosulfate therapy. Management is hydroxocobalamin as first-line antidote,
  with sodium nitrite and sodium thiosulfate as alternatives or adjuncts, plus
  100% oxygen and haemodynamic and ventilatory support. Chronic dietary
  cyanogen exposure produces distinct entities curated separately in this
  knowledge base (see Konzo).

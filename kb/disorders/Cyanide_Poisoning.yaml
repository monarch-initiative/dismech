- accession: geo:GSE286106
  title: "Regulation of Mammalian Cellular Metabolism by Endogenous Cyanide Production [TST_RNA-Seq]"
  description: >-
    RNA-seq arm of a study of endogenous cyanide production in mammalian cells,
    including TST manipulation. This is physiology rather than poisoning: it
    reports that cells make cyanide at low concentrations where it acts as a
    gasotransmitter, and that the same molecule impairs bioenergetics at high
    concentrations. It is included here because the dose-dependent flip is the

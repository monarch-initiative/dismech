definitions:
- name: Clinical case definition for acute cyanide poisoning
  definition_type: CASE_DEFINITION
  description: >-
    Acute cyanide poisoning is a toxidrome in which absorbed cyanide inhibits
    cellular oxygen utilization, recognised from a compatible exposure history
    (fire smoke, cyanide salt, cyanogenic glycoside, or nitroprusside infusion)
    together with rapidly progressive depressed consciousness, cardiovascular
    instability, and high-anion-gap lactic acidosis. Confirmatory blood cyanide
    measurement is rarely available in time, so plasma lactate is the practical
    diagnostic surrogate.
  scope: Disease-level clinical framing for acute poisoning and its delayed sequelae
  evidence:
  - reference: PMID:41204534
    reference_title: "A case report of acute cyanide poisoning treated with lactate as an indicator."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cyanide poisoning is a life-threatening condition that impairs cellular oxygen utilization, leading to lactic acidosis."
    explanation: Supports the core disease framing as impaired cellular oxygen utilization producing lactic acidosis.
  - reference: PMID:41204534
    reference_title: "A case report of acute cyanide poisoning treated with lactate as an indicator."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, serum cyanide levels are not readily available in clinical settings, making diagnosis and treatment monitoring difficult."
    explanation: Supports basing the case definition on exposure history plus surrogate laboratory findings rather than a confirmatory cyanide assay.
has_subtypes:
- name: Acute Cyanide Poisoning
  display_name: Acute Cyanide Poisoning
  description: >-
    Rapid-onset poisoning after a high-dose exposure by inhalation, ingestion, or
    dermal absorption. Progression from headache, vertigo, weakness and tachypnea
    to seizures, coma and cardiovascular collapse can take minutes at high doses.
  evidence:
  - reference: PMID:26543483
    reference_title: "Acute Cyanide Poisoning: Hydroxocobalamin and Sodium Thiosulfate Treatments with Two Outcomes following One Exposure Event."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This process prevents aerobic metabolism, which results in diffuse clinical symptoms such as dizziness, headache, weakness, and tachypnea, with progression to seizures, paralysis, and coma"
    explanation: Supports the acute multisystem presentation and its characteristic progression.
- name: Delayed Neurological Sequelae
  display_name: Delayed Dystonic-Parkinsonian Syndrome
  description: >-
    A subset of survivors of severe acute poisoning develop a delayed
    extrapyramidal syndrome - progressive rigidity, dystonia and parkinsonism -
    emerging days to months after apparent recovery, associated with bilateral
    basal ganglia lesions on CT and MRI.
  subtype_term:
    preferred_term: cyanide-induced parkinsonism
    term:
      id: MONDO:0017640
      label: cyanide-induced parkinsonism
  evidence:
  - reference: PMID:3225591
    reference_title: "Dystonic-Parkinsonian syndrome after cyanide poisoning: clinical and MRI findings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Progressive Parkinsonism, dystonia and apraxia of eye opening were seen after cyanide poisoning."
    explanation: Primary human report of the delayed extrapyramidal syndrome that defines this subtype.
  - reference: PMID:3225591
    reference_title: "Dystonic-Parkinsonian syndrome after cyanide poisoning: clinical and MRI findings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CT scan and MRI showed lesions in the basal ganglia, cerebellum and cerebral cortex consistent with reported pathological findings."
    explanation: Supports the imaging correlate, and shows the lesion is not confined to the basal ganglia.
  - reference: PMID:1564480
    reference_title: "Delayed cyanide induced dystonia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A few days after an apparently full recovery he developed a severe dystonia syndrome."
    explanation: >-
      Documents the defining latency - a lucid interval after apparent recovery -
      in a case followed for 21 years.
- name: Nitroprusside-Associated Cyanide Toxicity
  display_name: Iatrogenic (Nitroprusside) Cyanide Toxicity
  description: >-
    Cyanide released during the metabolism of infused sodium nitroprusside can
    accumulate to toxic concentrations during high-dose or prolonged infusion,
    with hepatic dysfunction raising cyanide risk and renal dysfunction raising
    the risk of the distinct thiocyanate toxidrome.
  evidence:
  - reference: PMID:8440119
    reference_title: "Use of vitamin B12 in the treatment and prevention of nitroprusside-induced cyanide toxicity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "High-dose or prolonged therapy with nitroprusside in patients with hepatic or renal dysfunction increases the risk for nitroprusside-induced cyanide or thiocyanate toxicity, respectively."
    explanation: Supports the iatrogenic subtype and the organ-dysfunction risk factors that define it.
pathophysiology:
- name: Systemic Cyanide Burden
  description: >-
    Cyanide reaches the systemic circulation by inhalation of hydrogen cyanide
    gas, gastric absorption of ingested cyanide salts, enzymatic hydrolysis of
    ingested cyanogenic glycosides, dermal absorption, or metabolic release from
    infused nitroprusside. Inhaled hydrogen cyanide acts fastest because it
    crosses the alveolar membrane directly.
  biological_scale: ORGANISM
  downstream:
  - target: Cytochrome c Oxidase Inhibition
    causal_link_type: DIRECT
    description: >-
      Absorbed cyanide ion distributes rapidly into cells and mitochondria,
      where it reaches its principal molecular target.
    evidence:
    - reference: PMID:41204534
      reference_title: "A case report of acute cyanide poisoning treated with lactate as an indicator."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Once ingested, cyanide compounds are rapidly absorbed in the stomach as hydrogen cyanide and exert toxicity through cyanide ions."
      explanation: Supports the step from absorption to delivery of free cyanide ion to its cellular target.
  - target: Rhodanese-Mediated Cyanide Detoxification
    causal_link_type: DIRECT
    description: >-
      The same absorbed cyanide load is the substrate for the endogenous
      sulfurtransferase clearance pathway, which runs in parallel with toxicity.
    evidence:
    - reference: PMID:16790311
      reference_title: "Evidence for a functional genetic polymorphism of the human thiosulfate sulfurtransferase (Rhodanese), a cyanide and H2S detoxification enzyme."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Rhodanese or thiosulfate sulfurtransferase (TST) is a mitochondrial matrix enzyme that plays roles in cyanide detoxification, the formation of iron-sulfur proteins and the modification of sulfur-containing enzymes."
      explanation: >-
        Establishes that circulating cyanide is routed into the mitochondrial
        sulfurtransferase pathway, which is the step this edge represents.
  evidence:
  - reference: PMID:29939573
    reference_title: "Cyanide Toxicity."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Dermal absorption and injection are rare but possible sources of cyanide exposure."
    explanation: Supports the breadth of absorption routes feeding this node, including the uncommon ones.
- name: Cytochrome c Oxidase Inhibition
  description: >-
    Cyanide binds with high affinity to the ferric heme a3 centre of cytochrome
    c oxidase (mitochondrial Complex IV), the oxygen-reducing terminus of the
    electron transport chain, and reversibly arrests the transfer of electrons
    to molecular oxygen. Nitric oxide modulates this in a dose-dependent and
    two-directional way: constitutive, low-level mitochondrial NO potentiates
    the inhibition, which is part of why onset is so fast, while high exogenous
    NO attenuates it - which is why the same molecule appears here as an
    aggravating factor and under Sodium Nitrite as the antidotal one.
  biological_scale: MOLECULAR
  downstream:
  - target: Oxidative Phosphorylation Failure and ATP Depletion
    causal_link_type: DIRECT
    description: >-
      Blocking the terminal electron acceptor step collapses the respiratory
      chain and with it mitochondrial ATP synthesis.
    evidence:
    - reference: PMID:41204534
      reference_title: "A case report of acute cyanide poisoning treated with lactate as an indicator."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "These ions bind to cellular cytochrome oxidase and interfere with aerobic metabolism, which generates intracellular adenosine triphosphate."
      explanation: States the causal step from Complex IV binding to failure of aerobic ATP generation.
  molecular_functions:
  - preferred_term: cytochrome-c oxidase activity
    modifier: DECREASED
    term:
      id: GO:0004129
      label: cytochrome-c oxidase activity
  cellular_components:
  - preferred_term: mitochondrial respiratory chain complex IV
    term:
      id: GO:0045277
      label: respiratory chain complex IV
  evidence:
  - reference: PMID:17906319
    reference_title: "Interaction of cyanide and nitric oxide with cytochrome c oxidase: implications for acute cyanide toxicity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Acute cyanide toxicity is attributed to inhibition of cytochrome c oxidase (CcOX), the oxygen-reducing component of mitochondrial electron transport"
    explanation: Identifies Complex IV as the molecular target responsible for acute cyanide toxicity.
  - reference: PMID:17906319
    reference_title: "Interaction of cyanide and nitric oxide with cytochrome c oxidase: implications for acute cyanide toxicity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "It is concluded that the rapid, potent action of cyanide is due in part to mitochondrial generation of NO, which enhances inhibition of CcOX."
    explanation: Supports nitric-oxide potentiation as a contributor to the speed of Complex IV inhibition.
  - reference: PMID:37465777
    reference_title: "Cyanide Poisoning."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "When cyanide enters the body via inhalation, it blocks the cells from utilizing oxygen by binding to the cytochrome oxidase in the mitochondria."
    explanation: Supports the histotoxic character of the lesion - oxygen is present but cannot be used.
- name: Rhodanese-Mediated Cyanide Detoxification
  description: >-
    Mitochondrial rhodanese (thiosulfate sulfurtransferase, TST) transfers sulfur
    from thiosulfate to cyanide, yielding thiocyanate that is excreted renally.
    3-mercaptopyruvate sulfurtransferase provides a complementary cytosolic
    route. The pathway is limited by sulfur-donor supply and is overwhelmed at
    high cyanide loads, which is exactly why supplying exogenous thiosulfate is
    an antidote rather than merely a supplement.
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: thiosulfate-cyanide sulfurtransferase activity
    term:
      id: GO:0004792
      label: thiosulfate-cyanide sulfurtransferase activity
  evidence:
  - reference: PMID:16790311
    reference_title: "Evidence for a functional genetic polymorphism of the human thiosulfate sulfurtransferase (Rhodanese), a cyanide and H2S detoxification enzyme."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Rhodanese or thiosulfate sulfurtransferase (TST) is a mitochondrial matrix enzyme that plays roles in cyanide detoxification, the formation of iron-sulfur proteins and the modification of sulfur-containing enzymes."
    explanation: Establishes TST as the mitochondrial enzyme that carries out cyanide detoxification.
  - reference: PMID:34297873
    reference_title: "The two faces of cyanide: an environmental toxin and a potential novel mammalian gasotransmitter."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "This reaction offers a rational behind the use of thiosulfate as antidote for cyanide poisoning."
    explanation: >-
      Connects the endogenous sulfurtransferase reaction to the pharmacologic use
      of thiosulfate. Quoted verbatim including the source's own wording; a
      snippet never corrects the text it quotes.
- name: Oxidative Phosphorylation Failure and ATP Depletion
  description: >-
    With Complex IV blocked, the mitochondrial proton-motive force collapses and
    oxidative phosphorylation ceases, depleting cellular ATP within minutes
    despite adequate arterial oxygen content and delivery.
  biological_scale: CELLULAR
  downstream:
  - target: Anaerobic Glycolytic Shift
    causal_link_type: DIRECT
    description: >-
      ATP depletion forces compensatory anaerobic glycolysis, whose lactate
      output accumulates far faster than it can be cleared.
    evidence:
    - reference: PMID:41204534
      reference_title: "A case report of acute cyanide poisoning treated with lactate as an indicator."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "As intracellular adenosine triphosphate depletes, anaerobic metabolism accelerates, leading to increased lactic acid production and venous blood oxygen saturation."
      explanation: States the causal step from ATP depletion to lactate accumulation, and notes the accompanying rise in venous oxygen saturation.
  - target: Myocardial Energy Failure
    causal_link_type: DIRECT
    description: >-
      The myocardium is among the tissues whose contractile function fails first
      when oxidative ATP supply is cut off.
    evidence:
    - reference: PMID:41204534
      reference_title: "A case report of acute cyanide poisoning treated with lactate as an indicator."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Given the high oxygen demand of the brain and heart, early symptoms primarily affect the central nervous and cardiovascular systems."
      explanation: Supports selective early failure of the heart on the basis of its oxidative demand.
  - target: Cerebral Energy Failure
    causal_link_type: DIRECT
    description: >-
      Neurons, with little energy reserve and high oxidative demand, lose
      ion-gradient maintenance as soon as ATP falls.
    evidence:
    - reference: PMID:41204534
      reference_title: "A case report of acute cyanide poisoning treated with lactate as an indicator."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Given the high oxygen demand of the brain and heart, early symptoms primarily affect the central nervous and cardiovascular systems."
      explanation: Supports selective early failure of the brain on the basis of its oxidative demand.
  biological_processes:
  - preferred_term: oxidative phosphorylation
    modifier: DECREASED
    term:
      id: GO:0006119
      label: oxidative phosphorylation
  - preferred_term: mitochondrial electron transport, cytochrome c to oxygen
    modifier: DECREASED
    term:
      id: GO:0006123
      label: mitochondrial electron transport, cytochrome c to oxygen
  evidence:
  - reference: PMID:25692407
    reference_title: "Protection from cyanide-induced brain injury by the Nrf2 transcriptional activator carnosic acid."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "For example, in addition to binding to and poisoning hemoglobin, cyanide inhibits cytochrome c oxidase, thus blocking electron transport in the mitochondrial respiratory chain and disrupting oxidative phosphorylation"
    explanation: Supports disruption of oxidative phosphorylation as the immediate consequence of Complex IV inhibition.
- name: Anaerobic Glycolytic Shift
  description: >-
    Anaerobic glycolysis becomes the only remaining ATP source and is grossly
    insufficient, generating pyruvate that is converted to lactate. The systemic
    consequence - a severe high-anion-gap metabolic acidosis whose magnitude
    tracks the cyanide burden closely enough to serve as a surrogate assay - is
    modelled as the downstream Lactic acidosis and Elevated serum anion gap
    phenotypes rather than bundled into this cellular node.
  biological_scale: CELLULAR
  downstream:
  - target: Lactic acidosis
    causal_link_type: DIRECT
  - target: Elevated serum anion gap
    causal_link_type: DIRECT
  - target: Tachypnea
    causal_link_type: DIRECT
    description: >-
      Respiratory compensation for the metabolic acidosis, which is why
      tachypnea appears before any respiratory depression.
  biological_processes:
  - preferred_term: glycolytic process
    modifier: INCREASED
    term:
      id: GO:0006096
      label: glycolytic process
  evidence:
  - reference: PMID:12352039
    reference_title: "Value of lactic acidosis in the assessment of the severity of acute cyanide poisoning."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using Spearman's test, there was a significant correlation between plasma lactate and blood cyanide concentrations"
    explanation: Quantifies the link between the cyanide burden and the lactate produced by this node.
  - reference: PMID:8989894
    reference_title: "Acute cyanide poisoning: clinical spectrum, diagnosis, and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Elevated plasma lactate, associated with cardiovascular collapse, should suggest cyanide intoxication."
    explanation: Supports lactic acidosis as the characteristic metabolic signature of this node.
- name: Myocardial Energy Failure
  description: >-
    Cardiomyocyte ATP failure produces progressive myocardial depression. This
    node is the cellular lesion in the heart; its organism-level consequence is
    modelled separately as Cardiovascular Collapse.
  biological_scale: CELLULAR
  downstream:
  - target: Cardiovascular Collapse
    causal_link_type: DIRECT
    description: >-
      Loss of contractile ATP supply across the myocardium is what converts a
      cellular energy deficit into failure of the circulation as a whole.
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  locations:
  - preferred_term: myocardium
    term:
      id: UBERON:0002349
      label: myocardium
  evidence:
  - reference: PMID:41204534
    reference_title: "A case report of acute cyanide poisoning treated with lactate as an indicator."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In severe cases, poisoning can result in coma, convulsions, circulatory failure, and death."
    explanation: Supports circulatory failure as an outcome of severe poisoning.
  - reference: PMID:26543483
    reference_title: "Acute Cyanide Poisoning: Hydroxocobalamin and Sodium Thiosulfate Treatments with Two Outcomes following One Exposure Event."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Emergency medical services arrived and found the patient in asystole and started advanced cardiac life support protocol."
    explanation: Documents asystolic cardiac arrest as the terminal cardiovascular event in an occupational cyanide exposure.
- name: Cardiovascular Collapse
  description: >-
    An early catecholamine-driven hypertensive phase gives way to hypotension,
    bradyarrhythmia and atrioventricular block, and in severe poisoning to
    ventricular dysrhythmia and asystole.
  biological_scale: ORGANISM
  downstream:
  - target: Hypotension
    causal_link_type: DIRECT
  - target: Ventricular bigeminy
    causal_link_type: DIRECT
  - target: Cardiac arrest
    causal_link_type: DIRECT
  locations:
  - preferred_term: heart
    term:
      id: UBERON:0000948
      label: heart
  evidence:
  - reference: PMID:12352039
    reference_title: "Value of lactic acidosis in the assessment of the severity of acute cyanide poisoning."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Before antidotal treatment, plasma lactate concentration correlated positively with anion gap and inversely with systolic blood pressure, spontaneous respiratory rate, and arterial pH."
    explanation: >-
      Ties progressive circulatory failure, measured as falling systolic blood
      pressure, to the severity of the underlying poisoning.
- name: Cerebral Energy Failure
  description: >-
    Neuronal ATP failure disables the sodium/potassium exchangers that maintain
    membrane potential and the transporters that clear synaptic glutamate. The
    clinical expression is immediate and graded, from headache and vertigo
    through confusion to seizures and coma.
  biological_scale: CELLULAR
  downstream:
  - target: Excitotoxic Neuronal Injury
    causal_link_type: DIRECT
    description: >-
      Failure of glutamate clearance is the step that converts a reversible
      energy deficit into structural neuronal injury.
  - target: Headache
    causal_link_type: DIRECT
  - target: Vertigo
    causal_link_type: DIRECT
  - target: Confusion
    causal_link_type: DIRECT
  - target: Seizure
    causal_link_type: DIRECT
  - target: Coma
    causal_link_type: DIRECT
  - target: Encephalopathy
    causal_link_type: DIRECT
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  locations:
  - preferred_term: brain
    term:
      id: UBERON:0000955
      label: brain
  evidence:
  - reference: PMID:25692407
    reference_title: "Protection from cyanide-induced brain injury by the Nrf2 transcriptional activator carnosic acid."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Particularly harmful to neurons is the malfunction of glutamate transport and sodium/potassium ion exchangers, contributing to excitotoxicity due to excessive extracellular glutamate"
    explanation: >-
      Supports failure of glutamate transport and ion exchange as the immediate
      neuronal consequence of energy failure. Quoted from a rodent and iPSC
      study whose introduction is summarising the mechanism, hence OTHER.
- name: Excitotoxic Neuronal Injury
  description: >-
    Extracellular glutamate over-activates NMDA receptors, admitting calcium and
    driving neuronal death, amplified by reactive oxygen species and lipid
    peroxidation. Sustained injury in the most metabolically demanding
    grey matter progresses to frank necrosis.
  biological_scale: CELLULAR
  downstream:
  - target: Basal Ganglia Necrosis
    causal_link_type: DIRECT
    description: >-
      Sustained excitotoxic injury in the most metabolically demanding
      grey-matter regions progresses to frank tissue necrosis.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:25692407
    reference_title: "Protection from cyanide-induced brain injury by the Nrf2 transcriptional activator carnosic acid."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Additionally, increased levels of reactive oxygen species (ROS) generated in response to cyanide poisoning initiate lipid peroxidation that is toxic to neurons"
    explanation: >-
      Supports the oxidative-stress arm that amplifies excitotoxic neuronal
      injury. This paper reports rodent and iPSC-neuron work; the quoted
      sentence is its introduction summarising the mechanism, hence OTHER.
- name: Basal Ganglia Necrosis
  description: >-
    The globus pallidus and putamen sustain bilateral, often haemorrhagic
    necrosis, visible as altered signal on MRI within weeks. The lesion is not
    confined there: the sensorimotor cortex can show pseudolaminar necrosis for
    the same reason - high oxygen dependency - and imaging series also report
    cerebellar and cortical involvement. The node is named for the basal ganglia
    because that is the consistent and clinically decisive site, and it is the
    substrate of the delayed dystonic-parkinsonian syndrome.
  biological_scale: TISSUE
  downstream:
  - target: Parkinsonism
    causal_link_type: DIRECT
  - target: Dystonia
    causal_link_type: DIRECT
  locations:
  - preferred_term: globus pallidus
    term:
      id: UBERON:0001875
      label: globus pallidus
  - preferred_term: putamen
    term:
      id: UBERON:0001874
      label: putamen
  evidence:
  - reference: PMID:12223384
    reference_title: "MR changes after acute cyanide intoxication."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The toxicity of cyanide causes damage, primarily to the basal ganglia, and those changes were visible as altered signal intensity on the first MR images."
    explanation: Supports basal ganglia as the primary site of structural cyanide injury.
  - reference: PMID:12223384
    reference_title: "MR changes after acute cyanide intoxication."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Extensive areas of hemorrhagic necrosis were seen 6 weeks later."
    explanation: Supports the necrotic, haemorrhagic character of the lesion and its evolution over weeks.
  - reference: PMID:3225591
    reference_title: "Dystonic-Parkinsonian syndrome after cyanide poisoning: clinical and MRI findings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CT scan and MRI showed lesions in the basal ganglia, cerebellum and cerebral cortex consistent with reported pathological findings."
    explanation: >-
      Confirms the basal ganglia as the lesion site and records the wider
      cerebellar and cortical involvement noted in the node description.
phenotypes:
- category: Neurologic
  name: Coma
  description: >-
    Depressed consciousness progressing to unresponsiveness is the dominant
    presenting feature of significant acute poisoning.
  phenotype_term:
    preferred_term: Coma
    term:
      id: HP:0001259
      label: Coma
    temporality: ACUTE
  evidence:
  - reference: PMID:8989894
    reference_title: "Acute cyanide poisoning: clinical spectrum, diagnosis, and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Signs of cyanide poisoning include headache, vertigo, agitation, confusion, coma, convulsions and death."
    explanation: Lists coma among the clinical signs of cyanide poisoning.
- category: Neurologic
  name: Seizure
  description: Generalized convulsions accompanying severe cerebral energy failure.
  phenotype_term:
    preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
    temporality: ACUTE
  evidence:
  - reference: PMID:41204534
    reference_title: "A case report of acute cyanide poisoning treated with lactate as an indicator."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In severe cases, poisoning can result in coma, convulsions, circulatory failure, and death."
    explanation: Names convulsions among the severe manifestations.
- category: Neurologic
  name: Encephalopathy
  description: >-
    Diffuse cerebral dysfunction, ranging from agitation and confusion to
    profound obtundation. The cited evidence establishes it for

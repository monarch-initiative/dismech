biochemical:
- name: Blood lactate
  presence: INCREASED
  notes: >-
    Plasma lactate is the practical surrogate for an unavailable blood cyanide
    assay. In non-fire cyanide poisoning a plasma lactate at or above 8 mmol/L
    (72 mg/dL) was 94% sensitive and 70% specific for a toxic blood cyanide
    concentration; in smoke-inhalation victims a threshold above 10 mmol/L was
    the sensitive indicator. The two thresholds come from different populations
    and are not interchangeable.
  evidence:
  - reference: PMID:12352039
    reference_title: "Value of lactic acidosis in the assessment of the severity of acute cyanide poisoning."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "During the course of cyanide poisonings, a plasma lactate concentration of >or=72 mg/d/L (8 mmol/L) was sensitive (94%) and moderately specific (70%) for a toxic blood cyanide concentration (>or=1.0 mg/L)."
    explanation: Gives the operating characteristics of the lactate threshold in non-fire cyanide poisoning.
  - reference: PMID:1944484
    reference_title: "Elevated blood cyanide concentrations in victims of smoke inhalation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Plasma lactate concentrations above 10 mmol per liter were a sensitive indicator of cyanide intoxication, as defined by the presence of a blood cyanide concentration above 40 mumol per liter."
    explanation: Gives the corresponding threshold derived in smoke-inhalation victims.
- name: Blood cyanide concentration
  presence: INCREASED
  notes: >-
    Whole-blood cyanide is the confirmatory analyte but turnaround is far too
    slow to guide resuscitation. It remains essential for forensic and
    retrospective work: fire fatalities average around 1 mg/L, and concentrations
    above roughly 3 mg/L are regarded as fatal.
  evidence:
  - reference: PMID:8150843
    reference_title: "Cyanide poisoning in victims of fire: analysis of 364 cases and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cyanide levels of 364 fatalities averaged 1.0 mg/L and exceeded fatal levels (> 3 mg/L) in 31 cases."
    explanation: Anchors the fatal blood cyanide threshold and the distribution observed in fire fatalities.
  - reference: PMID:12352039
    reference_title: "Value of lactic acidosis in the assessment of the severity of acute cyanide poisoning."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Before antidotal treatment, the median plasma lactate concentration was 168 mg/dL, the median blood cyanide concentration was 4.2 mg/L."
    explanation: Documents the blood cyanide concentrations seen in an intensive-care cohort of acute poisonings.
genetic:
- name: TST
  relationship_type: MODIFIER
  gene_term:
    preferred_term: TST
    term:
      id: hgnc:12388
      label: TST
  notes: >-
    TST encodes rhodanese (thiosulfate sulfurtransferase), the mitochondrial
    enzyme that detoxifies cyanide to thiocyanate. Functional promoter and
    coding polymorphisms reduce enzyme expression and intrinsic clearance, so
    TST genotype is a plausible determinant of individual cyanide susceptibility.
    These are population-frequency modifier alleles, not Mendelian pathogenic
    variants, and they have not been validated as clinical risk predictors in
    poisoned cohorts.
  evidence:
  - reference: PMID:16790311
    reference_title: "Evidence for a functional genetic polymorphism of the human thiosulfate sulfurtransferase (Rhodanese), a cyanide and H2S detoxification enzyme."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The P(285)A variant appears to encode a protein with a 50% decrease of in vitro intrinsic clearance compared to the wild-type enzyme."
    explanation: Demonstrates a functional TST coding variant with halved intrinsic clearance.
  - reference: PMID:16790311

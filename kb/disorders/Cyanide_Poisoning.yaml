treatments:
- name: Hydroxocobalamin
  description: >-
    First-line antidote for confirmed cyanide poisoning. The cobalt(III) centre
    binds cyanide in a 1:1 ratio to form cyanocobalamin, which is excreted in
    urine. It does not impair oxygen-carrying capacity, which is the basis for
    giving it empirically to a fire victim whose carboxyhaemoglobin status is
    unknown - unlike the nitrites, which would compound the hypoxia. That
    empiric indication is where the evidence is weakest: a 2025 systematic
    review of 1238 patients found no mortality benefit in smoke inhalation and
    signals for acute kidney injury and methaemoglobinaemia. Chromaturia and
    pink skin discoloration are the usual adverse effects in confirmed
    poisoning.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: hydroxocobalamin
      term:
        id: CHEBI:27786
        label: hydroxocobalamin
  target_mechanisms:
  - target: Systemic Cyanide Burden
    treatment_effect: INHIBITS
    description: >-
      Hydroxocobalamin sequesters free circulating cyanide as cyanocobalamin,
      removing it from the pool available to reach mitochondria.
    evidence:
    - reference: PMID:8440119
      reference_title: "Use of vitamin B12 in the treatment and prevention of nitroprusside-induced cyanide toxicity."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Hydroxocobalamin has been shown to significantly reduce RBC and plasma cyanide concentrations in animals and surgical patients without producing clinically important adverse effects or toxic metabolites."
      explanation: Demonstrates that hydroxocobalamin lowers the circulating cyanide burden this node represents.
  evidence:
  - reference: PMID:8989894
    reference_title: "Acute cyanide poisoning: clinical spectrum, diagnosis, and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hydroxocobalamin is an attractive antidote due to its rapid cyanide binding and its lack of serious side-effects, even in the absence of cyanide intoxication."
    explanation: Supports hydroxocobalamin as the preferred antidote on binding speed and safety grounds.
  - reference: PMID:17543660
    reference_title: "Hydroxocobalamin for severe acute cyanide poisoning by ingestion or inhalation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "That 71% of patients survived after treatment with hydroxocobalamin suggests that hydroxocobalamin as first-line antidotal therapy is effective and safe in acute cyanide poisoning."
    explanation: Provides the clinical survival data behind first-line use in severe poisoning.
  - reference: PMID:41497958
    reference_title: "Evidence for Hydroxocobalamin in Cyanide Toxicity Caused by Smoke Inhalation: An Updated Systematic Review."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "In light of the uncertain benefits and potential risks associated with hydroxocobalamin use for cyanide poisoning from smoke inhalation injury, its administration should be approached with caution."
    explanation: >-
      A 2025 systematic review contradicting the benefit of empiric
      hydroxocobalamin in the specific case of smoke inhalation, where cyanide
      toxicity is suspected rather than confirmed.
- name: Sodium Thiosulfate
  description: >-
    Sulfur donor that accelerates the endogenous rhodanese reaction converting
    cyanide to renally excreted thiocyanate. Slower in onset than
    hydroxocobalamin, so it is used as an adjunct rather than sole therapy in
    fulminant poisoning, but it is safe to combine with hydroxocobalamin.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: sodium thiosulfate
      term:
        id: CHEBI:132112
        label: sodium thiosulfate
  target_mechanisms:
  - target: Rhodanese-Mediated Cyanide Detoxification
    treatment_effect: ACTIVATES
    description: >-
      Exogenous thiosulfate relieves the sulfur-donor limitation on the
      rhodanese reaction, raising the rate at which cyanide is converted to
      thiocyanate.
    evidence:
    - reference: PMID:34297873
      reference_title: "The two faces of cyanide: an environmental toxin and a potential novel mammalian gasotransmitter."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "This reaction offers a rational behind the use of thiosulfate as antidote for cyanide poisoning."
      explanation: >-
        States that the rhodanese reaction is the rationale for thiosulfate
        therapy, quoted verbatim from the source.
  evidence:
  - reference: PMID:8989894
    reference_title: "Acute cyanide poisoning: clinical spectrum, diagnosis, and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sodium thiosulphate acts more slowly than other antidotes and is indicated in subacute cyanogen poisoning and as an adjunct to acute cyanide poisoning."
    explanation: Supports the adjunctive positioning of thiosulfate and its slower onset.
  - reference: PMID:25605411
    reference_title: "Severe cyanide poisoning from an alternative medicine treatment with amygdalin and apricot kernels in a 4-year-old child."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "After administering sodium thiosulfate, rapid improvement in his medical condition with complete recovery without need for further intensive care treatment was seen."
    explanation: Documents clinical recovery after thiosulfate in cyanogenic-glycoside poisoning.
- name: Sodium Nitrite
  description: >-
    Methaemoglobin-forming antidote used when hydroxocobalamin is unavailable.
    Oxidising haemoglobin iron creates methaemoglobin, which binds cyanide in
    preference to cytochrome c oxidase. Because the induced methaemoglobinaemia
    itself reduces oxygen-carrying capacity, it is a poor first choice in a fire
    victim who may already be carboxyhaemoglobinaemic.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: sodium nitrite
      term:
        id: CHEBI:78870
        label: sodium nitrite
  target_mechanisms:
  - target: Cytochrome c Oxidase Inhibition
    treatment_effect: INHIBITS
    description: >-
      Nitrite therapy draws cyanide away from Complex IV, both by providing a
      methaemoglobin sink and, per in vitro work, by generating mitochondrial
      nitric oxide at levels high enough to antagonise the inhibition. Note this
      is the high-NO arm of a dose-dependent effect whose low-NO arm potentiates
      the inhibition instead; see the Cytochrome c Oxidase Inhibition node.
    evidence:
    - reference: PMID:17906319
      reference_title: "Interaction of cyanide and nitric oxide with cytochrome c oxidase: implications for acute cyanide toxicity."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Also, the antidotal action of sodium nitrite is partly explained by generation of high mitochondrial levels of NO, which antagonizes the CcOX inhibition."
      explanation: Supports sodium nitrite acting on the Complex IV inhibition node itself, not only as a peripheral cyanide sink.
  evidence:
  - reference: PMID:8989894
    reference_title: "Acute cyanide poisoning: clinical spectrum, diagnosis, and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Antidotes include oxygen, hydroxocobalamin, di-cobalt EDTA and methaemoglobin-inducers."
    explanation: Places methaemoglobin inducers such as sodium nitrite within the accepted antidote set.
- name: High-Concentration Oxygen Therapy
  description: >-
    100% oxygen is given despite the lesion being one of utilization rather than
    delivery; raising the oxygen tension appears to help overcome the reversible
    Complex IV inhibition by mass action and treats any co-existing carbon
    monoxide poisoning or hypoxaemia.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Oxygen Therapy
    term:
      id: NCIT:C94624
      label: Oxygen Therapy
  target_mechanisms:
  - target: Cytochrome c Oxidase Inhibition
    treatment_effect: MODULATES
    description: >-
      High-concentration oxygen is standard immediate care and is presumed to
      act by mass action against the reversible Complex IV inhibition. This edge
      is deliberately left uncited: the clinical recommendation is well
      sourced (see the treatment-level evidence), but no cited source here
      states the mass-action mechanism, so the link is recorded as MODULATES
      rather than asserted as competitive inhibition.
  evidence:
  - reference: PMID:8989894
    reference_title: "Acute cyanide poisoning: clinical spectrum, diagnosis, and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Immediate treatment includes 100% oxygen, assisted ventilation, decontamination, correction of acidosis and blood pressure support."
    explanation: Supports 100% oxygen as part of immediate management.
  - reference: PMID:41204534
    reference_title: "A case report of acute cyanide poisoning treated with lactate as an indicator."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Oxygen therapy was initially initiated at 100% concentration and gradually reduced following improvement in lactate levels."
    explanation: Documents 100% oxygen in practice, titrated against the lactate response.
- name: Supportive Critical Care
  description: >-
    Airway control and mechanical ventilation, vasopressor and fluid support for
    haemodynamic instability, benzodiazepines for seizures, and correction of
    acidosis. Extracorporeal support has been used in refractory cardiogenic
    shock.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Myocardial Energy Failure
    treatment_effect: MODULATES
    description: >-
      Vasopressors and ventilatory support maintain perfusion and oxygenation
      while antidotal therapy and endogenous detoxification remove cyanide.
    evidence:
    - reference: PMID:8989894
      reference_title: "Acute cyanide poisoning: clinical spectrum, diagnosis, and treatment."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Immediate treatment includes 100% oxygen, assisted ventilation, decontamination, correction of acidosis and blood pressure support."
      explanation: Supports blood-pressure support and assisted ventilation as management of the cardiovascular failure node.
  evidence:
  - reference: PMID:8150843
    reference_title: "Cyanide poisoning in victims of fire: analysis of 364 cases and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In survivors of fire, detoxification of cyanide can occur without specific antidotes with the use of aggressive supportive care."
    explanation: >-
      States that cyanide detoxification can occur under supportive care alone
      in fire survivors. The source (1994) goes further than current practice,
      concluding that specific assay and treatment are rarely necessary in fire
      victims; the quote is recorded for what it says, not as an endorsement of
      withholding antidote.
animal_models:
- name: Mouse lethal cyanide poisoning model (inhaled and intraperitoneal)
  species: Mouse
  publication: PMID:20704457
  description: >-
    Paired inhaled and intraperitoneal mouse models of lethal cyanide poisoning
    used to rank antidote efficacy. Cobinamide, the cobalamin precursor,
    outperformed hydroxocobalamin, sodium thiosulfate, sodium nitrite, and the
    thiosulfate-nitrite combination, and rescued mice given cobinamide sulfite
    intramuscularly after more than two minutes of apnoea.
  evidence:
  - reference: PMID:20704457
    reference_title: "Cobinamide is superior to other treatments in a mouse model of cyanide poisoning."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We found Cbi more effective than hydroxocobalamin, sodium thiosulfate, sodium nitrite, and the combination of sodium thiosulfate-sodium nitrite in treating cyanide poisoning."
    explanation: Establishes the model as an antidote-ranking system and reports its principal result.
  modeled_mechanisms:
  - target: Systemic Cyanide Burden
    relationship: PERTURBS
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Delivers a controlled lethal systemic cyanide burden by two routes that
      mirror the human inhalational and parenteral exposures.
    limitations: >-
      Antidote potency ratios derived in mice have not translated into human
      efficacy data; cobinamide remains investigational, and the model uses
      pre-planned dosing with immediate treatment rather than the delayed,
      uncertain-dose presentation of real poisoning.
    evidence:
    - reference: PMID:20704457
      reference_title: "Cobinamide is superior to other treatments in a mouse model of cyanide poisoning."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We studied Cbi in both an inhaled and intraperitoneal model of cyanide poisoning in mice."
      explanation: >-
        Establishes that the model delivers a systemic cyanide burden by two
        routes, which is the node this link points at.
- name: Gottingen minipig lethal KCN bolus model
  species: Pig
  publication: PMID:31389254
  description: >-
    Anaesthetised Gottingen minipig model in which bolus potassium cyanide
    injection at doses comparable to human lethal doses simulates high-dose
    hydrogen cyanide inhalation, used to quantify antidote efficacy against
    lactate and survival endpoints. Licensed doses of dicobalt edetate and
    hydroxocobalamin were effective at just-lethal doses and failed at less than
    twice the estimated LD50.
  evidence:
  - reference: PMID:31389254
    reference_title: "Modest and variable efficacy of pre-exposure hydroxocobalamin and dicobalt edetate in a porcine model of acute cyanide salt poisoning."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In this porcine study of cyanide exposure, with pre-exposure antidote administration, licenced doses of dicobalt edetate and hydroxocobalamin were effective at just lethal doses but ineffective at less than twice the estimated LD50."
    explanation: Reports the model's principal finding on the dose ceiling of current antidotes.
  modeled_mechanisms:
  - target: Anaerobic Glycolytic Shift
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Bolus KCN reproduces the dose-dependent arterial lactate rise that defines
      the metabolic lesion in human poisoning, and the lactate endpoint is the
      same one used clinically.
    limitations: >-
      Antidotes were given before exposure rather than after, which is the
      opposite of the clinical sequence and makes the observed efficacy an upper
      bound; the authors say so explicitly.
    evidence:
    - reference: PMID:31389254
      reference_title: "Modest and variable efficacy of pre-exposure hydroxocobalamin and dicobalt edetate in a porcine model of acute cyanide salt poisoning."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We established an anaesthetised Gottingen minipig model of lethal bolus potassium cyanide (KCN) injection to simulate high dose hydrogen cyanide inhalation."
      explanation: >-
        Establishes the model as a deliberate simulation of high-dose human
        cyanide exposure, which is what makes it informative for this node.
    - reference: PMID:31389254
      reference_title: "Modest and variable efficacy of pre-exposure hydroxocobalamin and dicobalt edetate in a porcine model of acute cyanide salt poisoning."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Doses were similar to human lethal doses of KCN."
      explanation: >-
        Supports treating the model's metabolic response as informative for
        human poisoning, since the exposure is dosed to the human lethal range.
    readouts:
    - name: Arterial lactate concentration
      target: Anaerobic Glycolytic Shift
      direction: INCREASED
      interpretation: Dose-dependent arterial lactate rise as the metabolic correlate of cyanide exposure in this model.
      evidence:
      - reference: PMID:31389254
        reference_title: "Modest and variable efficacy of pre-exposure hydroxocobalamin and dicobalt edetate in a porcine model of acute cyanide salt poisoning."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Increases in arterial lactate were similar after 0.08 and 0.12 mmol/kg KCN."
        explanation: Reports the arterial lactate measurement behind this readout.
discussions:
- discussion_id: cyanide_empiric_hydroxocobalamin_smoke_inhalation
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does empiric hydroxocobalamin improve outcome in smoke-inhalation victims
    with suspected but unconfirmed cyanide toxicity?
  attaches_to:
  - treatments#Hydroxocobalamin
  - environmental#Structure fire smoke inhalation
  rationale: >-
    Hydroxocobalamin is first-line for confirmed cyanide poisoning, and its
    safety profile is what justifies giving it empirically at a fire scene where
    no cyanide assay is available. But the evidence for that empiric use is thin:
    a 2025 systematic review of six studies and 1238 patients found similar
    mortality between hydroxocobalamin and supportive treatment, with signals for
    acute kidney injury and methaemoglobinaemia, and could not pool the data. The
    same uncertainty runs the other way in the exposure literature, where a
    forensic series argues cyanide is an infrequent independent contributor to
    fire deaths. Resolving it needs a randomised trial that has never been done.
  evidence:
  - reference: PMID:41497958
    reference_title: "Evidence for Hydroxocobalamin in Cyanide Toxicity Caused by Smoke Inhalation: An Updated Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Well-designed randomized controlled trials are urgently needed to establish optimal treatment strategies for this patient population."
    explanation: States the gap directly, as the systematic review's own conclusion.
  - reference: PMID:41497958
    reference_title: "Evidence for Hydroxocobalamin in Cyanide Toxicity Caused by Smoke Inhalation: An Updated Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two studies reported mortality rates, which were found to be similar between the hydroxocobalamin and supportive treatment groups."
    explanation: Quantifies the absent mortality benefit that makes this a live question.
  - reference: PMID:29021725
    reference_title: "Prehospital hydroxocobalamin for inhalation injury and cyanide toxicity in the United States - analysis of a database and survey of ems providers."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Although a small sample, patients who received prehospital hydroxocobalamin had improved survival."
    explanation: >-
      Cuts the other way from the systematic review, which is why the question is
      open rather than settled. Its own authors flag the sample size; the survey
      arm reports only 38 percent of responding US EMS agencies carrying any
      cyanide antidote, so practice is not converging either.
- discussion_id: cyanide_tst_genotype_susceptibility
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does TST (rhodanese) genotype predict individual susceptibility to cyanide
    poisoning in exposed humans?
  attaches_to:
  - genetic#TST
  - pathophysiology#Rhodanese-Mediated Cyanide Detoxification
  rationale: >-
    The enzymology is settled: functional TST promoter and coding variants cut
    expression by 40-73% and intrinsic clearance by half. What is missing is any
    demonstration that carriers of these alleles are actually more susceptible.
    The variants were characterised in fifty French individuals with no exposure
    outcome attached, and no poisoned or occupationally exposed cohort has been
    genotyped. Until one is, the pathway from genotype to clinical risk is an
    inference from in vitro clearance, not an observation.
  evidence:
  - reference: PMID:16790311
    reference_title: "Evidence for a functional genetic polymorphism of the human thiosulfate sulfurtransferase (Rhodanese), a cyanide and H2S detoxification enzyme."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This work constitutes the first report of the existence of a functional genetic polymorphism affecting TST activity and should be of great help to investigate certain disorders for which impairment of CN(-) or H(2)S detoxification have been suggested to be involved."
    explanation: >-
      The source frames its own result as a tool for future investigation of
      cyanide-detoxification disorders, which is precisely the study that has not
      been done.
diagnosis:
- name: Clinical diagnosis with lactate as surrogate biomarker
  description: >-
    There is no confirmatory test that returns in time to guide treatment.
    Diagnosis rests on exposure history plus the clinical toxidrome, with serial
    plasma lactate standing in for the unavailable cyanide assay. Blood gas with
    co-oximetry adds a narrowed arteriovenous oxygen difference, and
    carboxyhaemoglobin is measured alongside in any fire victim.
  diagnosis_term:
    preferred_term: laboratory procedure
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  evidence:
  - reference: PMID:35042362
    reference_title: "Cyanide poisoning in patients with inhalation injury - the phantom menace."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis can only be based on the history, clinical findings, and indirect laboratory signs."
    explanation: States that the diagnosis is clinical plus indirect laboratory signs rather than confirmatory assay.
  - reference: PMID:35042362
    reference_title: "Cyanide poisoning in patients with inhalation injury - the phantom menace."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Direct determination of plasma cyanide levels is not generally adopted in routine clinical practice."
    explanation: Establishes why the confirmatory analyte is not the diagnostic route in practice.
  - reference: PMID:12352039
    reference_title: "Value of lactic acidosis in the assessment of the severity of acute cyanide poisoning."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The immediate and serial measurement of plasma lactate concentrations is useful in assessing the severity of cyanide poisoning."
    explanation: Supports serial plasma lactate as the practical diagnostic and monitoring measurement.
- name: Brain MRI for delayed neurological sequelae
  description: >-
    In survivors of severe poisoning, MRI characterises the bilateral basal
    ganglia lesion underlying the delayed dystonic-parkinsonian syndrome. This is
    a prognostic and characterising study performed after the acute event, not a
    diagnostic test for the poisoning itself.
  diagnosis_term:
    preferred_term: magnetic resonance imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:12223384
    reference_title: "MR changes after acute cyanide intoxication."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The toxicity of cyanide causes damage, primarily to the basal ganglia, and those changes were visible as altered signal intensity on the first MR images."
    explanation: Supports MRI as the modality that shows the basal ganglia lesion after acute poisoning.
differential_diagnoses:
- name: Carbon monoxide poisoning
  disease_term:
    preferred_term: carbon monoxide poisoning
    term:
      id: MONDO:0800373
      label: carbon monoxide poisoning
  description: >-
    The most important differential and, in fire victims, usually a
    co-exposure rather than an alternative. Both are products of the same fire
    and both produce impaired tissue oxygen use with depressed consciousness.
  distinguishing_features:
  - >-
    Carbon monoxide poisoning is confirmed rapidly by carboxyhaemoglobin on
    co-oximetry, whereas no comparably fast cyanide assay exists.
  - >-
    The practical consequence runs the other way from most differentials: a fire
    victim with a raised carboxyhaemoglobin should be presumed cyanide-exposed as
    well, so the two are co-treated rather than discriminated.
  - >-
    Carboxyhaemoglobinaemia is a reason to avoid the methaemoglobin-forming
    antidotes, which would compound the loss of oxygen-carrying capacity.
  evidence:
  - reference: PMID:29489235
    reference_title: "Hyperbaric Evaluation and Treatment of Cyanide Toxicity."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Patients presenting from structure fires with carbon monoxide poisoning should be assumed to have been exposed to toxic levels of cyanide as well since most modern buildings contain these materials."
    explanation: Supports treating carbon monoxide poisoning as a co-exposure to be assumed rather than a differential to be excluded.
  - reference: PMID:35042362
    reference_title: "Cyanide poisoning in patients with inhalation injury - the phantom menace."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We usually encounter carbon monoxide intoxication, but it is necessary to think about the possibility of poisoning by other combustion products."
    explanation: Supports carbon monoxide as the expected diagnosis in inhalation injury against which cyanide must be actively considered.
- name: Methemoglobinemia
  disease_term:
    preferred_term: methemoglobinemia
    term:
      id: MONDO:0001117
      label: methemoglobinemia
  description: >-
    Shares cyanosis unresponsive to oxygen and a normal arterial oxygen tension
    with cyanide poisoning, and is additionally an iatrogenic complication of
    the nitrite antidotes used to treat cyanide poisoning.
  distinguishing_features:
  - >-
    Methaemoglobin is directly measurable by co-oximetry, and the arterial blood
    is characteristically chocolate-brown.
  - >-
    Cyanide poisoning instead shows a narrowed arteriovenous oxygen difference
    with a normal methaemoglobin fraction, unless nitrites have already been
    given.
  notes: >-
    Left without an evidence item: no reference cached for this entry states the
    cyanide-versus-methaemoglobinaemia distinction, and the differential is
    recorded from the co-oximetry and antidote-toxicity facts curated elsewhere
    in this entry rather than from a quotable source.
progression:
- phase: Acute toxidrome
  duration: Seconds to hours from exposure
  notes: >-
    Onset is seconds to minutes after hydrogen cyanide inhalation, minutes after
    ingestion of a cyanide salt, and 30 minutes to several hours after ingestion
    of cyanogenic glycosides, which must be hydrolysed first. The course runs
    from headache, vertigo, weakness and tachypnea, through confusion and
    hypotension, to seizures, coma and cardiovascular collapse, and can traverse
    the whole range within minutes at high dose.
  evidence:
  - reference: PMID:26543483
    reference_title: "Acute Cyanide Poisoning: Hydroxocobalamin and Sodium Thiosulfate Treatments with Two Outcomes following One Exposure Event."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This process prevents aerobic metabolism, which results in diffuse clinical symptoms such as dizziness, headache, weakness, and tachypnea, with progression to seizures, paralysis, and coma"
    explanation: States the ordered progression from early symptoms to seizures and coma.
- phase: Recovery
  duration: Hours to days
  notes: >-
    In a survivor treated promptly, consciousness returns as lactate falls, and
    the two track each other closely enough that lactate is used to titrate
    care. Recovery from the acute phase does not settle the neurological
    outcome.
  evidence:
  - reference: PMID:41204534
    reference_title: "A case report of acute cyanide poisoning treated with lactate as an indicator."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient's consciousness improved with decreasing lactate levels, achieving full consciousness approximately 9 hours after poisoning."
    explanation: Documents the coupled recovery of consciousness and lactate over hours.
- phase: Delayed neurological sequelae
  duration: Days to months after apparent recovery
  notes: >-
    Two distinct delayed outcomes are reported after severe poisoning, and they
    are not the same syndrome. One is the extrapyramidal dystonic-parkinsonian
    picture arising after a lucid interval, curated as the Delayed Neurological
    Sequelae subtype. The other is a neuropsychological deficit, principally
    episodic memory, which is present early and improves only partially over
    months. A given survivor may have either, both, or neither.
  evidence:
  - reference: PMID:24648474
    reference_title: "Surviving acute cyanide poisoning: a longitudinal neuropsychological investigation with interval MRI."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Prominent deficits in episodic memory were noted from an early stage, which were consistent with the findings noted on structural neuroimaging."
    explanation: Documents the neuropsychological arm of the delayed outcome and its imaging correlate.
  - reference: PMID:24648474
    reference_title: "Surviving acute cyanide poisoning: a longitudinal neuropsychological investigation with interval MRI."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These deficits remained persistent, although improving in severity over the follow-up period."
    explanation: Establishes partial rather than complete recovery of the cognitive deficit over six months.
  - reference: PMID:24648474
    reference_title: "Surviving acute cyanide poisoning: a longitudinal neuropsychological investigation with interval MRI."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "No focal neurological deficits or abnormal involuntary movements emerged, and the patient's overall functional status remained satisfactory."
    explanation: >-
      The same survivor developed no extrapyramidal syndrome, which is why the
      two delayed outcomes are recorded as separable rather than as stages of
      one course.
references:
- reference: PMID:37721023
  title: "2023 American Heart Association Focused Update on the Management of Patients With Cardiac Arrest or Life-Threatening Toxicity Due to Poisoning: An Update to the American Heart Association Guidelines for Cardiopulmonary Resuscitation and Emergency Cardiovascular Care."
  findings:
  - statement: >-
      Current AHA resuscitation guidance covers critical cyanide poisoning
      alongside other toxidromes, and the antidote agents used in managing it.
    supporting_text: "Based on structured evidence reviews, guidelines are provided for the treatment of critical poisoning from benzodiazepines, β-adrenergic receptor antagonists (also known as β-blockers), L-type calcium channel antagonists (commonly called calcium channel blockers), cocaine, cyanide, digoxin and related cardiac glycosides, local anesthetics, methemoglobinemia, opioids, organophosphates and carbamates, sodium channel antagonists (also called sodium channel blockers), and sympathomimetics."
  - statement: >-
      Listed as the governing clinical guideline for this entry rather than
      cited inline against a specific treatment claim: the abstract enumerates
      the poisonings and agents the guideline addresses without stating a
      cyanide-specific recommendation, so no snippet from it would
      substantively support a particular treatment claim here.
datasets:
- accession: geo:GSE158994
  title: Expression data of the mouse heart of a nose-only HCN inhalation model and a subcutaneous KCN injection model
  description: >-
    Cardiac transcriptomes from two mouse cyanide-exposure models profiled by
    oligonucleotide microarray - nose-only hydrogen cyanide inhalation, chosen
    to be relevant to structure-fire smoke exposure, and subcutaneous potassium
    cyanide injection, the route conventionally used for countermeasure testing.
    The comparison is the point: the two routes give substantially different
    cardiac transcriptomes at every time point within 24 hours, which bears
    directly on how much of the countermeasure literature built on KCN injection
    transfers to inhalational poisoning.
  data_type: MICROARRAY
  organism:
    preferred_term: house mouse
    term:
      id: NCBITaxon:10090
      label: Mus musculus
  sample_count: 69
  publication: PMID:33914522
  evidence:
  - reference: GEO:GSE158994
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Although the KCN injection model has been often used to evaluate medical countermeasures, this study demonstrated that cardiac transcriptomes are largely different from that of the HCN inhalation model at multiple time points within 24 hours after exposure."
    explanation: >-
      The repository summary states the route-dependence finding that makes this
      dataset relevant to the myocardial arm of the pathograph and to the
      interpretation of antidote studies performed with injected KCN.
  notes: >-

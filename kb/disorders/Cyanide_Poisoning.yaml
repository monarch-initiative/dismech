    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Additionally, the six polymorphisms located upstream the ATG initiation codon are responsible for a significant decrease (ranging from 40% to 73%) in promoter activity of a reporter gene compared to the corresponding wild-type sequence."
    explanation: Demonstrates regulatory TST variants that reduce expression of the detoxifying enzyme.

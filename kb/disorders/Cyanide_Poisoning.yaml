notes: >-
  Scope. This entry covers acute cyanide poisoning and its delayed neurological
  sequelae. Chronic dietary cyanogen exposure produces distinct, separately
  curated entities: konzo (kb/disorders/Konzo.yaml) and lathyrism-adjacent
  tropical neuropathies. Cyanide-induced parkinsonism has its own MONDO term
  (MONDO:0017640) but is curated here as the "Delayed Neurological Sequelae"
  subtype rather than as a separate entry, since it is a sequela of the acute
  poisoning modelled by this pathograph rather than an independently acquired
  disease. The cross-link to Konzo is one-directional: `Konzo.yaml` does not
  point back here. Adding that would be an edit to a second entry needing its
  own history record, so it is left for a follow-up rather than folded in.

  Contested exposure weight. The prominence of fire smoke as a cause of
  clinically decisive cyanide poisoning is genuinely disputed in the literature,
  and both sides are recorded rather than reconciled: PMID:1944484 measured
  elevated blood cyanide at the scene in fire victims and PMID:29939573 calls
  fire smoke the commonest inhalational source, while PMID:8150843 concludes
  from 364 fire fatalities that cyanide poisoning is infrequent and inseparable
  from carboxyhaemoglobinaemia. The REFUTE evidence item on the structure-fire
  environmental entry is that disagreement, not an error.

  Frequencies deliberately omitted. The deep-research report quoted per-symptom
  frequencies (78% unresponsive, 54% hypotensive, and so on) attributed to a
  systematic review of 102 patients across 65 articles, but named no identifier
  for that review, so nothing here could be quote-verified against it. Those
  frequencies are left out rather than curated from an unsourced figure. They
  would be worth adding if the review is identified.

  Prevalence deliberately absent. No `prevalence:` block is curated. Acute
  cyanide poisoning has no authoritative population figure: US poison-centre
  totals (of the order of 150 single-substance exposures a year) count only what
  is reported to poison centres, and systematically miss the fatal exposures -
  suicide, homicide, undiagnosed fire deaths, mass-casualty industrial events -
  that never reach one. Fire-related figures are worse still, since what fraction
  of fire deaths cyanide causes is the very question this entry records as
  contested. A rate curated from any of these would be a number without a
  denominator, so none is given.

  Terms not bound. No HPO term was found for elevated central or mixed venous
  oxygen saturation, the "arterialised venous blood" sign that is
  pathognomonically useful in cyanide poisoning, nor for the bitter-almond breath
  odour. Both are described in the pathophysiology and description prose and left
  unbound rather than forced onto an approximate term.

- name: Medication and perioperative precautions
  description: General Leigh syndrome spectrum guidance; no COX8A-specific therapeutic trial is demonstrated. Avoid sodium valproate if possible; the absolute POLG contraindication should not be relabeled as a COX8A-specific rule. Plan anesthesia and monitoring, minimize prolonged fasting, and avoid lactate-containing solutions in those at risk of lactic acidosis.

    snippet: Avoid lactate-containing agents (e.g., Ringer's lactate) in those at risk of lactic acidosis
    explanation: General LSS guidance on fluids in people at risk of lactic acidosis.
- name: Genetic counseling
  description: General Leigh syndrome spectrum guidance; no COX8A-specific therapeutic trial is demonstrated. Confirm parental carrier status. With two heterozygous parents, recurrence risks per conception are 25% affected, 50% carrier and 25% unaffected noncarrier. Family variant identification enables prenatal and preimplantation testing.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK320989/
    reference_title: Nuclear Gene-Encoded Leigh Syndrome Spectrum Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: each sib of an affected individual has at conception a 25% chance of being affected, a 50% chance of being an asymptomatic ... carrier ... and a 25% chance of being unaffected and not a carrier.
    explanation: These are conditional autosomal recessive recurrence risks, not measured COX8A penetrance.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK320989/
    reference_title: Nuclear Gene-Encoded Leigh Syndrome Spectrum Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Once the LSS-related ... pathogenic variant ... (s) have been identified in an affected family member, prenatal and ... preimplantation genetic testing ... are possible.
    explanation: General LSS counseling guidance supports family-specific reproductive testing.
experimental_models:
- name: Patient-derived COX8A-deficient fibroblasts
  experimental_model_type: CELL_LINE
  description: The original patient line shows abnormal splicing, reduced stable complex IV and enzyme activity. Wild-type lentiviral COX8A restores enzyme stability and activity. Later work reuses this line and finds residual complex IV in supercomplexes with no mtUPR/ISR transcriptional induction. Daria Rotko's doctoral thesis also reports lower mitochondrial BK-alpha protein without a statistically significant KCNMA1 RNA decrease; its clinical significance is unresolved.
  publication: PMID:26685157
  evidence:
  - *id003
  - *id006
  - *id007
  - *id017
  - *id018
  - reference: url:https://rcin.org.pl/Content/236269/PhD%20thesis%20Daria%20Rotko%20FINAL.pdf
    reference_title: https://rcin.org.pl/Content/236269/PhD%20thesis%20Daria%20Rotko%20FINAL.pdf
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The results of the study confirmed the decrease in the total amount of the total full-sized BK-α protein in cell lysate, and in particular mitoBK-α protein in the mitochondria of COX8A-deficient fibroblasts
    explanation: The thesis reports a patient-cell protein finding without establishing a causal link to the neurological phenotype.
  - reference: url:https://rcin.org.pl/Content/236269/PhD%20thesis%20Daria%20Rotko%20FINAL.pdf
    reference_title: https://rcin.org.pl/Content/236269/PhD%20thesis%20Daria%20Rotko%20FINAL.pdf
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: No statistically significant decrease in the expression of KCNMA1 was detected in a qRT-PCR assay with GAPDH as a reference gene
    explanation: Patient-cell BK-alpha protein reduction is not accompanied by demonstrated KCNMA1 transcriptional downregulation.
  modeled_mechanisms:
  - target: Reduced stable free complex IV
    relationship: PARTIALLY_RECAPITULATES
    model_scale: CELLULAR
    limitations: Cellular biochemical findings do not reproduce the entire neurological or pulmonary phenotype.
  - target: Reduced complex IV activity
    relationship: PARTIALLY_RECAPITULATES
    model_scale: CELLULAR
    limitations: Cellular biochemical findings do not reproduce the entire neurological or pulmonary phenotype.
- name: Engineered COX8A-deficient HEK293T clones
  experimental_model_type: CELL_LINE
  description: CRISPR/Cas9 targeting of exon 1 produced two viable clones with compound frameshift and in-frame mitochondrial-targeting-sequence lesions. Neither clone was a complete knockout. They reproduce reduced complex IV abundance and activity with variable retention of supercomplex-associated enzyme; they are not additional clinical genotypes.
  publication: PMID:33705280
  evidence:
  - reference: PMID:33705280
    reference_title: Molecular and Functional Effects of Loss of Cytochrome c Oxidase Subunit 8A.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: in CRISPR/Cas9 genome-edited HEK293T cells
    explanation: The peer-reviewed study identifies the engineered cell system.
  - reference: url:https://rcin.org.pl/Content/236269/PhD%20thesis%20Daria%20Rotko%20FINAL.pdf
    reference_title: https://rcin.org.pl/Content/236269/PhD%20thesis%20Daria%20Rotko%20FINAL.pdf
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: While no viable mutant cell line was characterized as a full COX8A knockout
    explanation: The author thesis explicitly identifies incomplete engineered lesions; these are not complete knockout models.
  - *id007
  - *id017
  - *id009
  - *id018
  modeled_mechanisms:
  - target: Reduced stable free complex IV
    relationship: PARTIALLY_RECAPITULATES
    model_scale: CELLULAR
    limitations: Cellular biochemical findings do not reproduce the entire neurological or pulmonary phenotype.
  - target: Reduced complex IV activity
    relationship: PARTIALLY_RECAPITULATES
    model_scale: CELLULAR
    limitations: Cellular biochemical findings do not reproduce the entire neurological or pulmonary phenotype.

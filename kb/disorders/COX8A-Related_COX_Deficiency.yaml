name: COX8A-Related COX Deficiency
category: Mendelian
creation_date: '2026-06-20T00:00:00Z'
synonyms:
- COX8A deficiency
- Mitochondrial complex IV deficiency, nuclear type 15
- MC4DN15
- COX8A-related cytochrome c oxidase deficiency
- COX8A-related Leigh-like syndrome
disease_term:
  preferred_term: COX8A-related COX deficiency (MC4DN15)
  term:
    id: MONDO:0033650
    label: mitochondrial complex IV deficiency, nuclear type 15
parents:
- Mitochondrial Disease
- Inborn Error of Metabolism
description: COX8A-related mitochondrial complex IV deficiency is an autosomal recessive structural-subunit disorder reported with Leigh syndrome spectrum, leukodystrophy, severe epilepsy, developmental abnormalities and pulmonary hypertension. A homozygous intronic splice-acceptor variant produces abnormal RNA and loss of normal COX8A function. Patient cells and engineered cell models show reduced stable complex IV and enzyme activity, with residual enzyme preferentially retained in respiratory supercomplexes. ClinGen classified the broader COX8A–mitochondrial disease relationship as Limited in March 2024 because only one clinical case supported the assertion.
inheritance:
- &id011
  name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - &id001
    reference: PMID:26685157
    reference_title: Loss of the smallest subunit of cytochrome c oxidase, COX8A, causes Leigh-like syndrome and epilepsy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: we identified a homozygous splice site mutation in COX8A, which codes for the ubiquitously expressed isoform of subunit VIII, the smallest nuclear-encoded subunit of complex IV.
    explanation: The clinical report identifies a homozygous structural-subunit variant.
notes: The small clinical evidence base does not establish phenotype frequencies, penetrance, or severity subtypes. Clinical findings below refer to the reported proband or ClinGen's case-level abstraction. General Leigh syndrome spectrum care recommendations are distinguished from COX8A-specific treatment evidence. The 2021 cellular study reuses the previously reported patient fibroblasts and does not add an independent family.
pathophysiology:
- name: Homozygous COX8A splice-acceptor variant
  description: The reported NM_004074.3:c.115-1G>C variant affects the final nucleotide of intron 1. The physical alteration is a single nucleotide substitution; the subsequent 49-nucleotide deletion occurs in RNA.
  evidence:
  - *id001
  - &id004
    reference: url:https://search.clinicalgenome.org/kb/gene-validity/CGGV:assertion_a1671723-9b23-4f70-b64d-dd1829b926bc-2024-03-18T040000.000Z
    reference_title: curation results for Gene-Disease Validity
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: this 49 nt deletion results in a shift of the reading frame for the entire exon 2
    explanation: The aberrant transcript removes 49 nucleotides; this is an RNA consequence of an intronic SNV, not a genomic deletion.
  genes:
  - &id002
    preferred_term: COX8A
    term:
      id: hgnc:2294
      label: COX8A
  role: trigger
  genetic_context:
    gene: *id002
    variant_type: single nucleotide variant
    genomic_contexts:
    - intron
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
  downstream:
  - target: Aberrant COX8A splicing
    causal_link_type: DIRECT
    description: The splice-acceptor substitution alters processing of the COX8A transcript.
    evidence:
    - &id003
      reference: PMID:26685157
      reference_title: Loss of the smallest subunit of cytochrome c oxidase, COX8A, causes Leigh-like syndrome and epilepsy.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: The mutation, affecting the last nucleotide of intron 1, leads to aberrant splicing, a frame-shift in the highly conserved exon 2, and decreased amount of the COX8A transcript.
      explanation: Patient-cell RNA analysis links the intronic variant to abnormal splicing and reduced transcript abundance; it does not directly measure a decay pathway.
- name: Aberrant COX8A splicing
  description: Patient fibroblast RNA uses abnormal splicing and loses 49 nucleotides, shifting the reading frame of exon 2. This changes most of the mature subunit sequence.
  evidence:
  - *id003
  - &id012
    reference: url:https://search.clinicalgenome.org/kb/gene-validity/CGGV:assertion_a1671723-9b23-4f70-b64d-dd1829b926bc-2024-03-18T040000.000Z
    reference_title: curation results for Gene-Disease Validity
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: A shorter COX8A-specific PCR product was present in fibroblasts of the COX8A patient (Fig. 3B, asterisk), indicating aberrant splicing
    explanation: ClinGen reproduces the patient-cell RNA evidence from Hallmann 2016.
  - *id004
  - &id005
    reference: url:https://search.clinicalgenome.org/kb/gene-validity/CGGV:assertion_a1671723-9b23-4f70-b64d-dd1829b926bc-2024-03-18T040000.000Z
    reference_title: curation results for Gene-Disease Validity
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: As exon 2 encodes the 31 C-terminal amino acids of the 44 amino acid-long mature peptide, the translated mutant protein is very likely not functional.
    explanation: The source predicts a severe effect on the mature protein; it does not directly demonstrate nonsense-mediated decay.
  genes:
  - *id002
  downstream:
  - target: Reduced COX8A transcript abundance
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: The abnormal transcript is less abundant; the decay mechanism is not directly resolved.
    evidence:
    - *id003
  - target: Loss of normal COX8A function
    causal_link_type: DIRECT
    description: The frameshift disrupts the sequence of the mature structural subunit.
    evidence:
    - *id005
- name: Reduced COX8A transcript abundance
  description: COX8A RNA abundance is reduced in patient fibroblasts. Reduced abundance does not by itself identify altered transcription or prove a particular RNA-decay pathway.
  evidence:
  - *id003
  genes:
  - *id002
  downstream:
  - target: Loss of normal COX8A function
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Lower transcript availability compounds the abnormal coding sequence.
    evidence:
    - *id003
    - *id005
- name: Loss of normal COX8A function
  description: The aberrantly spliced transcript cannot produce the normal structural subunit. Sequence disruption and lower RNA abundance together impair normal COX8A function; residual respiratory activity does not imply normal subunit restoration.
  evidence:
  - &id008
    reference: PMID:26685157
    reference_title: Loss of the smallest subunit of cytochrome c oxidase, COX8A, causes Leigh-like syndrome and epilepsy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The loss of the wild-type COX8A protein severely impairs the stability of the entire cytochrome c oxidase enzyme complex and manifests in isolated complex IV deficiency in skeletal muscle and fibroblasts
    explanation: The report links loss of the normal subunit to deficient complex IV; complete loss of every respiratory complex is not established.
  - *id005
  - &id006
    reference: PMID:26685157
    reference_title: Loss of the smallest subunit of cytochrome c oxidase, COX8A, causes Leigh-like syndrome and epilepsy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Stability and activity of complex IV could be rescued in the patient's fibroblasts by lentiviral expression of wild-type COX8A.
    explanation: Wild-type complementation supports a causal relationship between COX8A dysfunction and the cellular enzyme defect.
  genes:
  - *id002
  downstream:
  - target: Reduced stable free complex IV
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Loss of normal subunit function impairs holoenzyme stability, supported by wild-type complementation.
    evidence:
    - &id007
      reference: PMID:33705280
      reference_title: Molecular and Functional Effects of Loss of Cytochrome c Oxidase Subunit 8A.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: In immunoblots of BN-PAGE separated mitochondria from both cellular models almost no monomers and dimers of the fully assembled COX could be visualized.
      explanation: Patient fibroblasts and engineered HEK293T cells lose most free complex IV; residual supercomplex-associated enzyme must be distinguished.
    - *id006
- name: Reduced stable free complex IV
  description: Patient cells and engineered COX8A-deficient cells have markedly reduced free complex IV monomers and dimers. Some residual enzyme remains in respiratory supercomplexes, suggesting structural stabilization there. The results do not establish a universal block of every complex IV assembly intermediate.
  evidence:
  - *id007
  - &id017
    reference: PMID:33705280
    reference_title: Molecular and Functional Effects of Loss of Cytochrome c Oxidase Subunit 8A.
    supports: NO_EVIDENCE
    evidence_source: IN_VITRO
    snippet: Interestingly, supercomplexes of COX formed with complex III and also with complexes I and III retained considerable immunoreactivity, while nearly no immunoreactivity attributable to subassemblies was found.
    explanation: Retained supercomplex-associated enzyme limits generalization of free-complex depletion; it does not itself demonstrate loss of free monomers or dimers.
  - *id006
  genes:
  - *id002
  conforms_to: complex_iv_assembly_deficiency#Complex IV Biogenesis Failure
  downstream:
  - target: Reduced complex IV activity
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Reduced stable enzyme abundance accompanies reduced measured complex IV activity.
    evidence:
    - *id007
    - &id009
      reference: PMID:33705280
      reference_title: Molecular and Functional Effects of Loss of Cytochrome c Oxidase Subunit 8A.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: In both cellular model systems, between 20 to 30% of the residual enzymatic activity of cytochrome c oxidase (COX) was detectable.
      explanation: The later study reports residual cellular activity, so neither universal zero activity nor complete ATP collapse follows.
    - *id006
- name: Reduced complex IV activity
  description: Complex IV enzyme activity is severely reduced in patient muscle and cultured fibroblasts, with residual activity in later cellular assays. COX8A supports holoenzyme stability; it is not an autonomous catalytic subunit. No direct measurement in these sources establishes universal ATP depletion or oxidative stress in patients.
  evidence:
  - *id008
  - *id009
  - *id006
  - &id018
    reference: PMID:33705280
    reference_title: Molecular and Functional Effects of Loss of Cytochrome c Oxidase Subunit 8A.
    supports: NO_EVIDENCE
    evidence_source: IN_VITRO
    snippet: With transcriptome analysis by 3'-RNA sequencing we failed to detect in our cellular models of COX8A deficiency transcriptional changes of genes involved in the mitochondrial unfolded protein response (mtUPR) and the integrated stress response (ISR).
    explanation: This is a negative transcriptional result in the assayed models, not proof that all stress signaling is absent.
  genes:
  - *id002
  molecular_functions:
  - preferred_term: cytochrome-c oxidase activity
    term:
      id: GO:0004129
      label: cytochrome-c oxidase activity
    modifier: DECREASED
  downstream:
  - target: Seizures
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: The biochemical lesion is associated with the reported neurological disease; the intervening neural mechanism has not been established.
    evidence:
    - &id010
      reference: PMID:26685157
      reference_title: Loss of the smallest subunit of cytochrome c oxidase, COX8A, causes Leigh-like syndrome and epilepsy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: In a patient with Leigh-like syndrome presenting with leukodystrophy and severe epilepsy
      explanation: The original patient has both findings; the report does not establish population frequencies.
    - *id008
  - target: Leukodystrophy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: White-matter injury accompanies the inherited enzyme defect; a specific ROS-mediated pathway is not demonstrated.
    evidence:
    - *id010
    - *id008
  - target: Lactic acidosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: The reported mitochondrial disease includes lactic acidosis; the tissue-specific metabolic intermediates remain unresolved.
    evidence:
    - &id014
      reference: CGGV:assertion_a1671723-9b23-4f70-b64d-dd1829b926bc-2024-03-18T040000.000Z
      reference_title: COX8A / mitochondrial disease (Limited)
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: in an individual from a consanguineous family with Leigh syndrome spectrum (LSS) disorder, congenital scoliosis, developmental delay, pulmonary hypertension, epilepsy, and lactic acidosis.
      explanation: ClinGen summarizes the single published proband at its March 2024 assessment.

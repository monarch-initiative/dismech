    evidence_source: HUMAN_CLINICAL
    snippet: Sodium valproate should be avoided if possible, because of its inhibitory effect on respiratory chain enzymes.
    explanation: This is the general mitochondrial-disease precaution, with the separate absolute contraindication applying to POLG-related disease.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK320989/
    reference_title: Nuclear Gene-Encoded Leigh Syndrome Spectrum Overview - GeneReviews® - NCBI Bookshelf

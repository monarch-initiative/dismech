    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The Janus kinase inhibitor ruxolitinib was administered to 1 patient (P5.2); it had a beneficial but transient effect."
    explanation: The single reported use and its explicitly transient benefit.
- name: Anakinra
  therapeutic_modality: PEPTIDE
  description: >-
    IL-1 receptor antagonist, used with corticosteroids in one fatal case of
    CMV-triggered HLH. It is included because the NLRP3 arm of the mechanism
    predicts that IL-1 blockade should help, and the one reported attempt did
    not prevent death - a result worth recording before that prediction is
    treated as established.
  treatment_term:
    preferred_term: Pharmacotherapy

animal_models:
- name: Znfx1-mutant mouse infected with LCMV
  species: Mouse
  genotype: Znfx1mut
  publication: PMID:41636200
  description: >-
    A mouse model built specifically to reproduce the HLH-like arm of the human
    disease, using lymphocytic choriomeningitis virus as the trigger. It is the
    first model to pair the genotype with a viral challenge rather than
    characterising the knockout at rest.
  modeled_mechanisms:
  - target: Virally Triggered Hyperinflammatory Episode
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      LCMV-infected Znfx1-mutant mice show hallmark features of HLH-like
      inflammation, with more pronounced T-cell expansion and Th1 polarisation
      than infected controls.
    limitations: >-
      LCMV is not among the viruses that trigger episodes in patients, so the
      trigger is a laboratory surrogate rather than the human exposure. The model
      reproduces the inflammatory phenotype but has not been shown to reproduce
      the renal, pulmonary or neurological injury that dominates the human
      disease, and the mouse Znfx1 literature describes it primarily as an
      antiviral dsRNA sensor - a role the second human cohort does not support.
    readouts:
    - name: Hepatic macrophage infiltration after LCMV infection
      target: Virally Triggered Hyperinflammatory Episode
      direction: INCREASED
      interpretation: >-
        Identifies the macrophage as the infiltrating effector cell in the
        inflamed organ that is also most affected in patients.
      evidence:
      - reference: PMID:41636200
        reference_title: A Novel Murine Model of Hemophagocytic Lymphohistiocytosis-Like Inflammation in ZNFX1 Deficiency.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Znfx1mut macrophages infiltrated the liver to a greater extent upon infection"
        explanation: The histological readout of macrophage-driven hepatic inflammation.
    - name: T cell expansion and Th1 polarisation
      target: Virally Triggered Hyperinflammatory Episode
      direction: INCREASED
      interpretation: >-
        Shows the lymphoid arm is also engaged, which matters because the human
        disease is not a lymphocyte-cytotoxicity defect.
      evidence:
      - reference: PMID:41636200
        reference_title: A Novel Murine Model of Hemophagocytic Lymphohistiocytosis-Like Inflammation in ZNFX1 Deficiency.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Immunophenotyping revealed more pronounced T cell expansion and type-1 helper (Th1) polarization in LCMV-infected Znfx1mut mice."
        explanation: The immunophenotyping readout defining the model's inflammatory signature.
    evidence:
    - reference: PMID:41636200
      reference_title: A Novel Murine Model of Hemophagocytic Lymphohistiocytosis-Like Inflammation in ZNFX1 Deficiency.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "This novel murine model of HLH-like inflammation mirrors key aspects of the immune dysregulation observed in patients"
      explanation: The authors' own claim for the model's fidelity to the human disease.
- name: Znfx1-knockout mouse infected with Mycobacterium tuberculosis
  species: Mouse
  genotype: Znfx1 knockout
  publication: PMID:38016036
  description: >-
    A separate model addressing the mycobacterial pole of the disease. It offers
    a candidate mechanism the human work does not: ZNFX1 stabilises the mRNA
    encoding an AMPK catalytic subunit, and its loss impairs autophagic control
    of M. tuberculosis in macrophages.
  modeled_mechanisms:
  - target: Impaired Monocyte Homeostasis and Antimycobacterial Defence
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      Znfx1-knockout mice show increased mycobacterial burden and progressive
      lung injury, matching the direction of the human mycobacterial phenotype.
    limitations: >-
      The model reproduces susceptibility but not the defining human feature of
      this arm, which is monocytosis; and the proposed AMPK-autophagy mechanism
      has not been tested in patient cells. Human patients presented with BCG-osis
      and disseminated tuberculosis rather than with the chronic pulmonary disease
      modelled here. Fidelity is graded LOW for that reason rather than because
      the murine work is weak.
    readouts:
    - name: Pulmonary M. tuberculosis burden
      target: Impaired Monocyte Homeostasis and Antimycobacterial Defence
      direction: INCREASED
      interpretation: Confirms the direction of the susceptibility phenotype in vivo.
      evidence:
      - reference: PMID:38016036
        reference_title: ZNFX1 promotes AMPK-mediated autophagy against Mycobacterium tuberculosis by stabilizing Prkaa2 mRNA.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "reduced phagocytosis, suppressed macrophage activation, increased M. tuberculosis burden, progressive lung tissue injury, and chronic inflammation in M. tuberculosis-infected mice"
        explanation: The in vivo outcome measures for the knockout under mycobacterial challenge.
    evidence:
    - reference: PMID:38016036
      reference_title: ZNFX1 promotes AMPK-mediated autophagy against Mycobacterium tuberculosis by stabilizing Prkaa2 mRNA.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "ZNFX1 critically maintained AMPK-regulated autophagic flux by stabilizing protein kinase AMP-activated catalytic subunit alpha 2 mRNA"
      explanation: >-
        The proposed molecular mechanism linking ZNFX1 loss to defective
        antimycobacterial autophagy.
discussions:
- discussion_id: znfx1_two_phenotype_poles
  kind: CONTROVERSY
  prompt: >-
    Are the viral-inflammatory phenotype and the monocytosis-mycobacterial
    phenotype of ZNFX1 deficiency one disease with variable expression, or two
    mechanistically distinct diseases at the same locus?
  attaches_to:
  - pathophysiology#Impaired Monocyte Homeostasis and Antimycobacterial Defence
  - pathophysiology#Virally Triggered Hyperinflammatory Episode
  rationale: >-
    The two founding reports appeared within weeks of each other and describe
    patients who look different. Vavassori's cohort had severe RNA and DNA viral
    infection with fatal HLH-like inflammation; Le Voyer's cohort had monocytosis
    and mycobacterial disease and explicitly did not have severe viral illness.

    This matters mechanistically, not just descriptively. If one disease, then
    any proposed mechanism has to explain both an inability to clear virus and
    an inability to contain mycobacteria, in patients with normal IFN-gamma
    production and normal responses to it. If two, then something - allele
    position, modifier genotype, or environmental exposure such as BCG
    vaccination practice - partitions them, and no published analysis has
    identified what.

    Both cohorts carried truncating alleles, so a simple severe-versus-hypomorph
    split does not obviously account for it. Ascertainment is a live alternative
    explanation: the cohorts were recruited through different clinical routes,
    one through inflammation and one through mycobacterial disease, and each may
    have under-detected the other's phenotype.
  proposed_experiments:
  - experiment_id: exp_znfx1_cross_phenotype_cohort_assessment
    name: Cross-phenotype systematic assessment of a combined ZNFX1 cohort
    description: >-
      Assemble the published patients and assess every individual for both
      phenotypes with the same protocol - viral clearance and ISG regulation on
      one side, monocyte counts and mycobacterial history on the other - rather
      than for the phenotype that prompted their referral. If ascertainment is
      the explanation, the poles should collapse.
    would_support:
    - pathophysiology#Loss of Cytosolic Double-Stranded Nucleic Acid Surveillance
    supporting_outcome:
    - >-
      Patients ascertained through mycobacterial disease are found to have
      subclinical ISG dysregulation and impaired monocyte viral clearance, and
      patients ascertained through HLH are found to have monocytosis, supporting
      one disease with ascertainment-driven apparent poles.
    refuting_outcome:
    - >-
      Each cohort is confirmed to lack the other's cellular phenotype under
      identical assays, supporting two mechanistically distinct diseases and
      requiring the pathograph to be split.
- discussion_id: znfx1_mouse_sensor_vs_human_phenotype
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Mouse Znfx1 was characterised as a dsRNA sensor restricting RNA virus
    replication. Does that role explain the human disease, given that one of the
    two founding human cohorts had no severe viral illness at all?
  attaches_to:
  - pathophysiology#Loss of Cytosolic Double-Stranded Nucleic Acid Surveillance
  - animal_models#Znfx1-mutant mouse infected with LCMV
  rationale: >-
    The murine antiviral-sensor result is what made ZNFX1 a credible candidate
    when the first patients were sequenced, and it fits the Vavassori cohort
    well. It fits the Le Voyer cohort poorly: those patients are susceptible to
    mycobacteria rather than to viruses, which is not what a dsRNA-sensor defect
    predicts.

    The mismatch is therefore not that the model fails to reproduce a human
    finding, but that the model may have anchored the field on one of two human
    phenotypes and made the other harder to explain. The NLRP3-restraint and
    AMPK-autophagy findings are both attempts to supply the missing function,
    and neither has been demonstrated in patient tissue.
  proposed_experiments:
  - experiment_id: exp_znfx1_patient_nlrp3_derepression
    name: Test NLRP3 derepression in patient-derived cells
    description: >-
      Measure NLRP3 inflammasome activation, caspase-1 cleavage and IL-1beta
      maturation in monocytes and macrophages from ZNFX1-deficient patients of
      both phenotypic poles, rather than in overexpression cell lines.
    would_support:
    - pathophysiology#Derepression of the NLRP3 Inflammasome
    supporting_outcome:
    - >-
      Patient macrophages show constitutive or lowered-threshold NLRP3
      activation relative to controls, promoting the inflammasome edge from
      provisional to established.
    refuting_outcome:
    - >-
      Patient macrophages show normal NLRP3 activation thresholds, indicating
      that the cell-line finding does not transfer and that the hyperinflammation
      needs a different explanation.
- discussion_id: znfx1_post_clearance_inflammation
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why do some patients deteriorate after the triggering virus has been
    cleared, or in the apparent absence of any infection?
  attaches_to:
  - pathophysiology#Virally Triggered Hyperinflammatory Episode
  rationale: >-
    A model in which inflammation is driven by failure to clear a pathogen
    predicts that inflammation stops when the pathogen does. The founding cohort
    reports otherwise in at least three patients. This is the strongest clinical
    argument that the disease has a genuine autoinflammatory component
    independent of pathogen load, and it is the observation that the NLRP3
    mechanism would explain if it were confirmed in patients.
  proposed_experiments:
  - experiment_id: exp_znfx1_serial_cytokine_viral_load
    name: Serial cytokine and viral-load monitoring through an inflammatory episode
    description: >-
      Track viral load and IL-1-family and interferon-stimulated cytokine
      profiles in parallel through a full episode in the same patient, to
      establish whether inflammatory activity outlasts detectable virus.
    would_support:
    - pathophysiology#Derepression of the NLRP3 Inflammasome
    supporting_outcome:
    - >-
      Inflammatory cytokine levels remain elevated after viral clearance,
      supporting a pathogen-independent autoinflammatory driver.
    refuting_outcome:
    - >-
      Cytokine elevation tracks viral load closely, indicating that apparent
      post-clearance disease reflects undetected persistent infection rather
      than autonomous inflammation.

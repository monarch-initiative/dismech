name: Immunodeficiency 91 and Hyperinflammation
creation_date: "2026-08-30T02:45:00Z"
category: Mendelian
disease_term:
  preferred_term: immunodeficiency 91 and hyperinflammation
  term:
    id: MONDO:0030491
    label: immunodeficiency 91 and hyperinflammation
description: >-
  An autosomal recessive inborn error of immunity caused by biallelic loss of
  ZNFX1, a cytosolic, interferon-inducible helicase that senses double-stranded
  nucleic acid. The disease is defined less by an inability to mount an immune
  response than by an inability to regulate one: patients meet infections that
  most children clear with an inflammatory episode that does not switch off,
  producing haemophagocytic lymphohistiocytosis (HLH) or HLH-like disease with
  hepatitis, cytopenias, seizures, and renal and pulmonary injury. Mortality in
  the founding cohort was high and death was usually from the inflammation
  rather than from the infection itself.

  Two things distinguish it from familial HLH, and both are curated here as
  evidence rather than as assertion. First, NK-cell degranulation and
  cytotoxicity are normal, so the mechanism is not the perforin-pathway defect
  that defines FHL. Second, the leukocytosis that accompanies these episodes is
  explicitly noted to be much less common in classical HLH.
synonyms:
- IMD91
- ZNFX1 deficiency
- immunodeficiency 91 with hyperinflammation and immune dysregulation
parents:
- primary immunodeficiency disease
notes: >-
  Nosological scope, and the single most important thing to know before
  extending this entry. ZNFX1 deficiency was reported twice in 2021, by two
  groups, with substantially different phenotypes, and the disagreement is not
  resolved.

  Vavassori et al. (PMID:33872655) described 15 patients whose disease is
  dominated by severe infection with RNA and DNA viruses and by virally
  triggered HLH-like inflammation, with 11 deaths in childhood. Le Voyer et al.
  (PMID:33876776) described four patients whose disease is dominated by
  intermittent monocytosis and mycobacterial disease - BCG-osis and disseminated
  tuberculosis - and who, in the authors' own words, "do not suffer from severe
  viral illnesses".

  This entry curates both poles rather than merging them into a single
  phenotype list or silently preferring the larger cohort. The `discussions`
  block records what is genuinely open about the relationship between them.
  A curator adding new patients should say which pole they resemble, and should
  not import mycobacterial findings into the viral-inflammatory arm or vice
  versa - the two cohorts differ in ancestry, ascertainment route, and the
  variants reported, and no published analysis has yet shown that the
  difference is allelic.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Homozygous and compound heterozygous loss-of-function ZNFX1 alleles, in
    consanguineous and non-consanguineous kindreds. No individual homozygous for
    a predicted loss-of-function ZNFX1 allele appears in public population
    databases, which is the population-genetic counterpart of the severity of
    the reported phenotype.
  evidence:
  - reference: PMID:33872655
    reference_title: Multisystem inflammation and susceptibility to viral infections in human ZNFX1 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Deleterious homozygous and compound heterozygous ZNFX1 variants were identified in all 13 patients."
    explanation: Establishes the biallelic, recessive genetic architecture across all eight founding kindreds.
  - reference: PMID:33876776
    reference_title: Inherited deficiency of stress granule ZNFX1 in patients with monocytosis and mycobacterial disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There are no subjects homozygous for pLOF variants in public databases."
    explanation: >-
      Population-database absence of homozygous loss-of-function carriers, which
      supports the alleles being under strong negative selection rather than
      tolerated variation.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Fewer than 30 patients had been reported by 2023, in a small number of
    largely consanguineous kindreds. No population-based estimate exists, and
    the figure below is a count of published cases, not a rate.
  evidence:
  - reference: PMID:37291413
    reference_title: ZNFX1 Deficiency in a Child with Interstitial Pneumonitis and Peripheral Monocytosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ZNFX1) mutations have been described in 28 patients from 17 families"
    explanation: A published tally of reported patients and kindreds as of 2023.
pathophysiology:
- name: Biallelic ZNFX1 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    The primary lesion is biallelic damage to ZNFX1, encoding a large
    interferon-stimulated helicase. Reported alleles include nonsense,
    frameshift and missense changes; the founding cohort carried 11 biallelic
    variants across eight kindreds, five truncating and six missense. Protein is
    undetectable in cells from patients carrying two truncating alleles, so for
    that allele class the functional consequence is absence of protein rather
    than a hypomorph.
  genes:
  - preferred_term: ZNFX1
    term:
      id: hgnc:29271
      label: ZNFX1
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:33872655
    reference_title: Multisystem inflammation and susceptibility to viral infections in human ZNFX1 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "By using WES, we identified 11 biallelic ZNFX1 variants in 13 patients"
    explanation: The allelic series in the founding cohort.
  - reference: PMID:33872655
    reference_title: Multisystem inflammation and susceptibility to viral infections in human ZNFX1 deficiency.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "ZNFX1 could not be detected in whole cell extracts of fibroblasts from 2 of the patients carrying biallelic stop codons"
    explanation: >-
      Confirms at protein level that truncating alleles abolish ZNFX1, rather
      than producing a stable truncated product.
  downstream:
  - target: Loss of Cytosolic Double-Stranded Nucleic Acid Surveillance
    causal_link_type: DIRECT
    description: >-
      Absent or non-functional ZNFX1 removes the sensor itself, which is the
      proximate functional lesion.
- name: Loss of Cytosolic Double-Stranded Nucleic Acid Surveillance
  biological_scale: MOLECULAR
  description: >-
    ZNFX1 is an interferon-stimulated double-stranded RNA sensor that binds
    viral RNA and signals through the mitochondrial antiviral signalling protein
    MAVS, independently of the two other MAVS-associated sensors RIG-I and MDA5.
    Its expression is low in resting cells and is rapidly induced by viral
    infection and type I interferon, so the lesion is one of a stress-induced
    surveillance arm rather than of a constitutively required housekeeping
    pathway. In patient cells the protein is also recruited to, and can induce,
    cytoplasmic stress granules.
  biological_processes:
  - preferred_term: cellular response to exogenous double-stranded RNA
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0071360
      label: cellular response to exogenous dsRNA
  molecular_functions:
  - preferred_term: double-stranded RNA binding
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0003725
      label: double-stranded RNA binding
  cellular_components:
  - preferred_term: cytoplasmic stress granule
    term:
      id: GO:0010494
      label: cytoplasmic stress granule
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:33872655
    reference_title: Multisystem inflammation and susceptibility to viral infections in human ZNFX1 deficiency.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "ZNFX1 binds to viral RNA and interacts with the mitochondrial antiviral signaling (MAVS) protein, promoting the expression of interferon-stimulated genes (ISGs)."
    explanation: The molecular function lost, and the signalling adaptor it acts through.
  - reference: PMID:33872655
    reference_title: Multisystem inflammation and susceptibility to viral infections in human ZNFX1 deficiency.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Low ZNFX1 protein expression was noted in fibroblasts under resting conditions, whereas a rapid upregulation was observed after 24 hours of stimulation"
    explanation: >-
      Establishes ZNFX1 as an inducible rather than constitutive sensor, which
      is why the disease manifests as episodes triggered by infection.
  - reference: PMID:33876776
    reference_title: Inherited deficiency of stress granule ZNFX1 in patients with monocytosis and mycobacterial disease.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We find that this cytoplasmic protein can be recruited to or even induce stress granules."
    explanation: Localises ZNFX1 to stress granules, the subcellular compartment the second group emphasises.
  downstream:
  - target: Dysregulated Interferon-Stimulated Gene Induction
    causal_link_type: DIRECT
    description: >-
      Losing the sensor deranges the transcriptional programme it normally
      shapes downstream of MAVS.
  - target: Derepression of the NLRP3 Inflammasome
    causal_link_type: DIRECT
    description: >-
      A second, non-sensing function of the same protein. Shown in cell lines
      and mice rather than in patient tissue, so the edge is graded provisional.
  - target: Impaired Monocyte Homeostasis and Antimycobacterial Defence
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The route from loss of the sensor to monocytosis and mycobacterial
      susceptibility is not established. The second founding cohort showed that
      it does not run through IFN-gamma, but did not identify what it does run
      through.
- name: Dysregulated Interferon-Stimulated Gene Induction
  biological_scale: CELLULAR
  description: >-
    The defect is dysregulation, not simple loss. Patient cells stimulated with
    intracellular double-stranded nucleic acid over-express interferon-stimulated
    genes, and the half-life of ISG mRNA is altered; baseline ISG expression in
    patient blood is higher than in controls. Yet the same cells respond poorly
    to soluble poly(I:C) and clear virus less well. Curating this node as
    "reduced interferon response" would misstate the finding: the pathology is
    an unbalanced response whose direction depends on how the nucleic acid is
    presented.
  biological_processes:
  - preferred_term: type I interferon-mediated signaling pathway
    term:
      id: GO:0060337
      label: type I interferon-mediated signaling pathway
  cell_types:
  - preferred_term: dermal fibroblast
    term:
      id: CL:0002551
      label: fibroblast of dermis
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:33872655
    reference_title: Multisystem inflammation and susceptibility to viral infections in human ZNFX1 deficiency.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Stimulation of patient-derived primary cells with synthetic double-stranded nucleic acids was associated with a deregulated pattern of expression of ISGs and alterations in the half-life of the mRNA of ISGs and also associated with poorer clearance of viral infections by monocytes."
    explanation: >-
      The core cellular phenotype, and the wording that justifies "deregulated"
      rather than "deficient" in this node's name.
  - reference: PMID:33872655
    reference_title: Multisystem inflammation and susceptibility to viral infections in human ZNFX1 deficiency.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the baseline expression of ISGs seen in peripheral blood isolated from the patients"
    explanation: >-
      Baseline ISG expression is raised rather than lowered, which is why this
      disease is discussed alongside the interferonopathies.
  downstream:
  - target: Impaired Monocyte Clearance of Virus
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      An unbalanced ISG programme leaves monocytes unable to complete an
      antiviral defence programme after nucleic-acid stimulation.
- name: Derepression of the NLRP3 Inflammasome
  biological_scale: MOLECULAR
  description: >-
    Independently of its sensing role, ZNFX1 restrains the NLRP3 inflammasome by
    holding NLRP3 in the cytoplasm and preventing its accumulation on
    trans-Golgi-network vesicles in the resting state. Loss of that restraint
    releases caspase-1 activation and IL-1-family cytokine maturation. Two
    features make this the most attractive current explanation for the
    hyperinflammatory pole of the disease: it is a licensing defect rather than
    a signalling deficiency, and human pathogenic ZNFX1 variants fail to rescue
    it where wild-type ZNFX1 does.

    It is nonetheless graded provisional. The work is in cell lines and mice; no
    patient-derived tissue has been shown to carry a derepressed NLRP3
    inflammasome, and no patient has been reported to respond to NLRP3-directed
    therapy in a way that would close the loop.
  biological_processes:
  - preferred_term: NLRP3 inflammasome complex assembly
    modifier: INCREASED
    term:
      id: GO:0044546
      label: NLRP3 inflammasome complex assembly
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:39333773
    reference_title: The human disease-associated gene ZNFX1 controls inflammation through inhibition of the NLRP3 inflammasome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "ZNFX1 retains NLRP3 in the cytoplasm and prevents its accumulation in the TGN38 + /TGN46+ vesicles in the resting state."
    explanation: The proposed molecular mechanism of restraint that is lost in the disease.
  - reference: PMID:39333773
    reference_title: The human disease-associated gene ZNFX1 controls inflammation through inhibition of the NLRP3 inflammasome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Expression of wild-type ZNFX1, but not of ZNFX1 with human pathogenic mutations, rescues the impairment of NLRP3 inflammasome inhibition."
    explanation: >-
      Ties the mechanism specifically to the disease-causing alleles, which is
      what raises it above a general cell-biological observation.
  downstream:
  - target: Macrophage-Driven Cytokine Excess
    causal_link_type: DIRECT
    description: >-
      Unrestrained inflammasome activity yields caspase-1-dependent maturation
      of IL-1-family cytokines.
- name: Impaired Monocyte Clearance of Virus
  biological_scale: CELLULAR
  description: >-
    After prestimulation with transfected poly(I:C), patient monocytes cleared
    vesicular stomatitis virus less efficiently than control monocytes. This is
    the cellular correlate of the clinical susceptibility to RNA and DNA viruses,
    and it locates the defect in a myeloid cell rather than in the lymphoid
    compartment.
  cell_types:
  - preferred_term: monocyte
    term:
      id: CL:0000576
      label: monocyte
  biological_processes:
  - preferred_term: defense response to virus
    modifier: DECREASED
    term:
      id: GO:0051607
      label: defense response to virus
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:33872655
    reference_title: Multisystem inflammation and susceptibility to viral infections in human ZNFX1 deficiency.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the monocytes of P2.1 were less efficient in clearing VSV than the control monocytes were"
    explanation: Direct functional demonstration of impaired viral clearance by patient monocytes.
  downstream:
  - target: Virally Triggered Hyperinflammatory Episode
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Failure to clear the trigger sustains the stimulus that drives the
      inflammatory episode.
- name: Macrophage-Driven Cytokine Excess
  biological_scale: CELLULAR
  description: >-
    Macrophages are the proposed effector of the inflammatory phase. In the
    Znfx1-mutant mouse, mutant macrophages infiltrate the liver more heavily
    after infection and produce more cytokine in vitro even without stimulation,
    which points at a cell-intrinsic hair-trigger rather than at a stronger
    upstream signal.
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:41636200
    reference_title: A Novel Murine Model of Hemophagocytic Lymphohistiocytosis-Like Inflammation in ZNFX1 Deficiency.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "macrophages infiltrated the liver to a greater extent upon infection and produced greater levels of cytokines in vitro in the absence of stimulation, suggesting that these cells have a major role in driving inflammation"
    explanation: >-
      Identifies the macrophage as the likely driver, and the unstimulated
      cytokine production is what makes it a cell-intrinsic claim.
  downstream:
  - target: Virally Triggered Hyperinflammatory Episode
    causal_link_type: DIRECT
    description: Cytokine excess from activated macrophages is the proximate cause of the systemic episode.
- name: Virally Triggered Hyperinflammatory Episode
  biological_scale: ORGANISM
  description: >-
    The clinical event that defines the disease: a systemic inflammatory episode
    precipitated by infection, with cytopenia and hepatitis, meeting HLH criteria
    in half of the affected patients in the founding cohort. Two negative
    findings are load-bearing for the mechanism. NK-cell degranulation and
    cytotoxicity were normal in every patient with HLH, so this is not the
    cytotoxicity defect of familial HLH. And the episodes are accompanied by
    leukocytosis, which the authors note is much less common in classical HLH.

    Episodes are not always infection-locked: some patients progressed after the
    virus had been cleared, and some in the apparent absence of any infectious
    agent, which is difficult to reconcile with a purely trigger-driven model and
    is one reason the inflammasome arm is attractive.
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:33872655
    reference_title: Multisystem inflammation and susceptibility to viral infections in human ZNFX1 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of the 12 patients with systemic inflammatory disease, 6 met the diagnostic criteria for hemophagocytic lymphohistiocytosis (HLH), including hemophagocytosis in bone marrow aspirates"
    explanation: Frequency of formally defined HLH within the cohort.
  - reference: PMID:33872655
    reference_title: Multisystem inflammation and susceptibility to viral infections in human ZNFX1 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Levels of natural killer cell degranulation and/or cytotoxicity were normal in all patients with HLH."
    explanation: >-
      The specificity control that separates this disease mechanistically from
      familial HLH, where the cytotoxicity pathway is the lesion.
  - reference: PMID:33872655
    reference_title: Multisystem inflammation and susceptibility to viral infections in human ZNFX1 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "other patients showed progressive disease even after the virus had been cleared"
    explanation: >-
      Evidence that the inflammatory programme can run on after the trigger is
      gone, which a purely infection-driven model does not predict.
- name: Impaired Monocyte Homeostasis and Antimycobacterial Defence
  biological_scale: CELLULAR
  description: >-
    The second pole of the disease, from the second founding cohort:
    intermittent monocytosis with mycobacterial disease, in patients with normal
    lymphocyte subsets who produce IFN-gamma normally and whose cells respond
    normally to it. That set of normal results is what makes the finding
    interesting - it places ZNFX1 outside the IFN-gamma circuit that explains
    most Mendelian susceptibility to mycobacterial disease, and leaves the
    effector mechanism unidentified.
  cell_types:
  - preferred_term: monocyte
    term:
      id: CL:0000576
      label: monocyte
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:33876776
    reference_title: Inherited deficiency of stress granule ZNFX1 in patients with monocytosis and mycobacterial disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our results indicate that human ZNFX1 is associated with stress granules and essential for both monocyte homeostasis and protective immunity to mycobacteria."
    explanation: The authors' summary claim for this arm of the phenotype.
  - reference: PMID:33876776
    reference_title: Inherited deficiency of stress granule ZNFX1 in patients with monocytosis and mycobacterial disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Lymphocyte subsets are present at normal frequencies in these patients and produce IFN-γ normally."
    explanation: >-
      Excludes the usual IFN-gamma-circuit explanations for mycobacterial
      susceptibility, which is why this arm is curated as mechanistically open.
genetic:
- name: ZNFX1
  gene_term:
    preferred_term: ZNFX1
    term:
      id: hgnc:29271
      label: ZNFX1
  relationship_type: CAUSATIVE
  notes: >-
    ZNFX1 encodes a large multidomain helicase with an ATP-binding site, a DEAD
    helicase box, six zinc fingers and a coiled-coil region; the helicase domain
    is homologous to the RNA helicase Aquarius. Reported disease alleles are
    distributed across the protein and include both truncating and missense
    changes.

    Both founding cohorts identified ZNFX1 as the only candidate segregating
    with disease in their kindreds, by independent whole-exome studies in
    different populations. That independent convergence, rather than any single
    functional assay, is the strongest argument for causality here.
  evidence:
  - reference: PMID:33872655
    reference_title: Multisystem inflammation and susceptibility to viral infections in human ZNFX1 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In all of the patients, ZNFX1 was the only candidate gene that segregated with the disease."
    explanation: Segregation evidence for causality in the founding cohort.
  - reference: PMID:33876776
    reference_title: Inherited deficiency of stress granule ZNFX1 in patients with monocytosis and mycobacterial disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patients are homozygous for ZNFX1 variants (p.S959* and p.E1606Rfs*10) predicted to be loss of function (pLOF)."
    explanation: Independent identification of biallelic loss-of-function alleles in a separate cohort.

treatments:
- name: Allogeneic Hematopoietic Stem Cell Transplantation
  therapeutic_modality: CELL_THERAPY
  description: >-
    The only reported intervention that has altered the course of the disease.
    One patient transplanted at age 3 was in good health five years later, and
    his cerebral white-matter changes stabilised and then regressed after
    transplant - which is the most direct evidence available that the
    neurological injury is driven by the haematopoietic compartment rather than
    being an independent, cell-autonomous consequence of ZNFX1 loss in brain.

    This rests on a single transplanted patient. It is a strong mechanistic hint
    and a weak efficacy claim, and it should not be quoted as an established
    indication.
  treatment_term:
    preferred_term: allogeneic hematopoietic stem cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_mechanisms:
  - target: Macrophage-Driven Cytokine Excess
    treatment_effect: INHIBITS
    description: >-
      Replacing the haematopoietic compartment replaces the ZNFX1-deficient
      myeloid cells that drive the inflammatory episodes.
    evidence:
    - reference: PMID:33872655
      reference_title: Multisystem inflammation and susceptibility to viral infections in human ZNFX1 deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Brain magnetic resonance imaging of this patient showed that the white matter changes present at the age of 32 months had stabilized at the age of 42 months"
      explanation: >-
        Post-transplant stabilisation of the imaging abnormality, the observation
        that ties the neurological injury to the transplantable compartment.
  evidence:
  - reference: PMID:33872655
    reference_title: Multisystem inflammation and susceptibility to viral infections in human ZNFX1 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One patient (P4.2) underwent allogeneic hematopoietic stem cell transplantation (HSCT) at the age of 3 years. Five years later, he is in good health but still has a significant developmental delay."
    explanation: >-
      The single reported transplant and its outcome, including the residual
      deficit, which the description reports rather than smoothing over.
- name: Ruxolitinib
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    A JAK inhibitor, given to one patient on the rationale that the disease is an
    interferon-driven inflammatory state. The reported effect was beneficial but
    transient. Curated because a transient response is mechanistically
    informative - it is consistent with JAK-STAT signalling carrying part but
    not all of the inflammatory drive - and because omitting a therapy that was
    tried and partly failed would misrepresent the therapeutic landscape.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:

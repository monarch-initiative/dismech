notes: 'Curated as a standalone ciliopathy entry rather than as a subtype of the existing Multiple_Epiphyseal_Dysplasia entry. Rationale (mechanism-first curation): the classic MED entry (MONDO:0016648) is a cartilage extracellular-matrix / sulfate-transporter disorder (COMP, MATN3, COL9, SLC26A2) acting through chondrocyte matrix and ER-stress mechanisms, whereas Al-Gazali type (MONDO:0011778) is mechanistically a KIF7 Hedgehog/GLI3 ciliopathy (MONDO additionally classifies it is-a KIF7-related ciliopathy and is-a multiple epiphyseal dysplasia). It therefore clusters with the existing dismech KIF7 ciliopathy entries (Acrocallosal Syndrome, Hydrolethalus Syndrome 2, Joubert syndrome, Meckel Syndrome) and is added as a member of the Ciliopathies grouping. Resolves the lump/split decision deferred in issue #4243; maintainers may override via review.'
references:
- reference: PMID:22587682
  title: A mutation in KIF7 is responsible for the autosomal recessive syndrome of macrocephaly, multiple epiphyseal dysplasia and distinctive facial appearance.
  findings:
  - statement: Whole-exome sequencing in a consanguineous family with autosomal recessive macrocephaly, multiple epiphyseal dysplasia, and distinctive facies identified a causative homozygous p.N1060S missense mutation in KIF7, expanding the KIF7 ciliopathy spectrum.
    supporting_text: Our data confirm that the syndrome mapping to 15q26 in this family is caused by a mutation in KIF7 and expand the clinical spectrum associated with mutations in this gene to include multiple epiphyseal dysplasia.
- reference: PMID:21552264
  title: KIF7 mutations cause fetal hydrolethalus and acrocallosal syndromes.
  findings:
  - statement: Biallelic KIF7 mutations cause fetal hydrolethalus and acrocallosal syndromes by impairing primary cilium-dependent GLI3 processing and deregulating Hedgehog target gene expression.
    supporting_text: Our data show the role of KIF7 in human primary cilia, especially in the Hedgehog pathway through the regulation of GLI targets, and expand the clinical spectrum of ciliopathies.
- reference: PMID:34705483
  title: Hedgehog-induced ciliary trafficking of kinesin-4 motor KIF7 requires intraflagellar transport but not KIF7's microtubule binding.
  findings:
  - statement: KIF7 is an immotile kinesin-4 protein that binds microtubules at the primary cilium tip and regulates Hedgehog/GLI signaling.
    supporting_text: KIF7 has also been suggested to regulate the length of the primary cilium and organize the cilium tip based on its ability to bind selectively to the plus ends of microtubules in in vitro assays

genetic:
- name: KIF7
  association: Causative
  gene_term:
    preferred_term: KIF7
    term:
      id: hgnc:30497
      label: KIF7
  notes: A homozygous p.N1060S missense mutation in KIF7 (15q26.1) was identified by whole-exome sequencing in a consanguineous family with this disorder. KIF7 encodes the human ortholog of Drosophila Costal2, a cilium-tip kinesin-4 regulator of the Sonic hedgehog pathway. This was the first reported missense homozygous disease-causing KIF7 mutation; the hypomorphic missense nature is proposed to underlie the distinctive epiphyseal-dysplasia presentation, in contrast to the loss-of-function alleles causing acrocallosal and hydrolethalus syndromes.
  evidence:
  - reference: PMID:22587682
    reference_title: A mutation in KIF7 is responsible for the autosomal recessive syndrome of macrocephaly, multiple epiphyseal dysplasia and distinctive facial appearance.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: the identification of a homozygous p.N1060S missense mutation in a highly conserved residue in KIF7, a regulator of Hedgehog signaling that has been recently found to be causing Joubert syndrome, fetal hydrolethalus and acrocallosal syndromes
    explanation: Identifies the causative homozygous KIF7 missense mutation and the allelic relationship with the other KIF7 ciliopathies.
  - reference: PMID:22587682
    reference_title: A mutation in KIF7 is responsible for the autosomal recessive syndrome of macrocephaly, multiple epiphyseal dysplasia and distinctive facial appearance.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: expand the clinical spectrum associated with mutations in this gene to include multiple epiphyseal dysplasia
    explanation: Establishes KIF7 as the causative gene and expands the KIF7 clinical spectrum to include multiple epiphyseal dysplasia.

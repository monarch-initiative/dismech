pathophysiology:
- name: KIF7 Cilium-Tip Dysfunction and Impaired Hedgehog Signal Transduction
  conforms_to: ciliopathy_dysfunction#Impaired Hedgehog Signal Transduction
  description: KIF7, the human ortholog of Drosophila Costal2, is an immotile kinesin-4 protein that localizes to the tip of the primary cilium, where it regulates the GLI transcription factors of the Hedgehog pathway. In the absence of Hedgehog ligand KIF7 promotes processing of GLI3 into its transcriptional repressor form; biallelic loss-of-function KIF7 mutations deregulate most GLI target genes and impair GLI3 processing, disrupting the tightly dosed Hedgehog output required for skeletal, limb, and craniofacial patterning. The homozygous p.N1060S missense mutation identified in Al-Gazali type multiple epiphyseal dysplasia is a hypomorphic allele whose partial activity is proposed to account for the distinctive skeletal presentation.

    snippet: KIF7, the human ortholog of Drosophila Costal2, is a key component of the Hedgehog signaling pathway
    explanation: Identifies KIF7 as a core Hedgehog pathway component (Costal2 ortholog), establishing the molecular basis shared across the KIF7 ciliopathies.
  - reference: PMID:21552264

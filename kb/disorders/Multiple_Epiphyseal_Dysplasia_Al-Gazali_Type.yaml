- name: Skeletal and Craniofacial Patterning Defect
  description: Deregulated KIF7-dependent Hedgehog/GLI3 signaling disrupts dosed skeletal and craniofacial patterning. The hallmark consequence in Al-Gazali type is multiple epiphyseal dysplasia (abnormal development of the epiphyses of the long bones), accompanied by macrocephaly and a distinctive facial appearance. This skeletal-predominant presentation distinguishes the disorder from the brain- and limb-predominant allelic KIF7 ciliopathies.

differential_diagnoses:
- name: Multiple Epiphyseal Dysplasia (cartilage-matrix forms)
  description: Classic multiple epiphyseal dysplasia caused by variants in cartilage extracellular-matrix genes (COMP, MATN3, COL9A1/2/3) or the sulfate transporter SLC26A2 shares the epiphyseal-dysplasia skeletal phenotype but acts through chondrocyte matrix/ER-stress mechanisms rather than ciliary Hedgehog signaling, and lacks the macrocephaly and distinctive facies of the Al-Gazali (KIF7) type.
  disease_term:
    preferred_term: multiple epiphyseal dysplasia
    term:
      id: MONDO:0016648
      label: multiple epiphyseal dysplasia
  notes: Grouped under the parent term MONDO:0016648 (multiple epiphyseal dysplasia) to represent non-ciliopathy cartilage-matrix forms (COMP, MATN3, COL9A1-3, SLC26A2) that share the epiphyseal dysplasia radiographic presentation; no cached abstract for the Al-Gazali KIF7 pedigree directly contrasts these cartilage-matrix forms in its abstract text.
- name: Acrocallosal Syndrome
  description: Acrocallosal syndrome is an allelic KIF7 ciliopathy distinguished by corpus callosum agenesis/hypoplasia and postaxial/preaxial polydactyly with hallux duplication; it shares macrocephaly and the underlying KIF7 Hedgehog mechanism but is brain- and limb-predominant rather than epiphyseal-dysplasia-predominant.
  disease_term:
    preferred_term: acrocallosal syndrome
    term:
      id: MONDO:0008708
      label: acrocallosal syndrome
  evidence:
  - reference: PMID:22587682
    reference_title: A mutation in KIF7 is responsible for the autosomal recessive syndrome of macrocephaly, multiple epiphyseal dysplasia and distinctive facial appearance.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: a regulator of Hedgehog signaling that has been recently found to be causing Joubert syndrome, fetal hydrolethalus and acrocallosal syndromes
    explanation: Documents the allelic KIF7 relationship with acrocallosal, hydrolethalus, and Joubert syndromes, relevant to differential diagnosis.
  - reference: PMID:21552264
    reference_title: KIF7 mutations cause fetal hydrolethalus and acrocallosal syndromes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: ACLS is an autosomal recessive syndrome with, typically, corpus callosum agenesis, occasional anencephaly and/or Dandy-Walker malformation, hypertelorism, postaxial polydactyly of the hands and preaxial polydactyly of the feet5.
    explanation: Defines the characteristic corpus callosum agenesis and polydactyly of allelic KIF7-related acrocallosal syndrome.
- name: Hydrolethalus Syndrome 2
  description: Allelic KIF7 ciliopathy at the lethal end of the spectrum, characterized by fetal/neonatal lethality, hydrocephaly or anencephaly with keyhole occipital defect, micrognathia, and polydactyly.
  disease_term:
    preferred_term: hydrolethalus syndrome 2
    term:
      id: MONDO:0013585
      label: hydrolethalus syndrome 2
  evidence:
  - reference: PMID:21552264
    reference_title: KIF7 mutations cause fetal hydrolethalus and acrocallosal syndromes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Here we report mutations in KIF7 in individuals with hydrolethalus and acrocallosal syndromes, two multiple malformation disorders with overlapping features that include polydactyly, brain abnormalities and cleft palate.
    explanation: Establishes hydrolethalus syndrome 2 as an allelic KIF7 disorder.
  - reference: PMID:22587682
    reference_title: A mutation in KIF7 is responsible for the autosomal recessive syndrome of macrocephaly, multiple epiphyseal dysplasia and distinctive facial appearance.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: a regulator of Hedgehog signaling that has been recently found to be causing Joubert syndrome, fetal hydrolethalus and acrocallosal syndromes
    explanation: Places fetal hydrolethalus syndrome within the allelic KIF7 ciliopathy differential diagnosis.
- name: Joubert Syndrome
  description: Allelic ciliopathy caused in a subset of cases by KIF7 variants, distinguished by cerebellar vermis hypoplasia/dysplasia and the molar tooth sign on brain MRI without multiple epiphyseal dysplasia.
  evidence:
  - reference: PMID:22587682
    reference_title: A mutation in KIF7 is responsible for the autosomal recessive syndrome of macrocephaly, multiple epiphyseal dysplasia and distinctive facial appearance.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: a regulator of Hedgehog signaling that has been recently found to be causing Joubert syndrome, fetal hydrolethalus and acrocallosal syndromes
    explanation: Documents Joubert syndrome as part of the allelic KIF7 ciliopathy spectrum.

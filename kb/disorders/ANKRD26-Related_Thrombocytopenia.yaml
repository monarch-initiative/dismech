      evidence_source: HUMAN_CLINICAL
      snippet: "This variant is in the FLI1 binding site, and is predicted to disrupt FLI1 binding due to loss of a hydrogen bond with FLI1."
      explanation: >-
        Reports the variant and its predicted effect on FLI1 binding.
  - name: c.-140C>G
    description: >-
      5' UTR variant originally reported in thrombocytopenic patients; later
      family studies found it in relatives with normal platelet counts and
      normal ANKRD26 expression.
    variant_type: single nucleotide variant
    genomic_contexts:
    - "5' UTR"
    clinical_significance: LIKELY_BENIGN
    evidence:
    - reference: PMID:39212265
      reference_title: "Impact of thrombocytopenia-associated c.-118C>T and c.-140C>G ANKRD26 5'UTR variants in three-generational pedigree."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "carriers of the c.-140C>G variant exhibited normal platelet counts and no significant elevation in the ANKRD26 expression, indicating the likely benign nature of this variant"

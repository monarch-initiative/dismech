- name: Somatic Driver Mutation Acquisition and Myeloid Transformation
  description: >-
    Carriers have an increased risk of myeloid neoplasms. Germline ANKRD26
    variants are not thought to be sufficient on their own; somatic driver
    mutations in hematopoietic regulators are thought to drive transformation,
    and clonal hematopoiesis has been found in preleukemic carriers. Myeloid
    neoplasms in carriers are classified among hematologic neoplasms with
    germline predisposition associated with a pre-existing platelet disorder.

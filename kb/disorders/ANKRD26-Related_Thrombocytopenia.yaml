        Carriers in this family are unaffected.
    - reference: PMID:38757516
      reference_title: "Inherited thrombocytopenia associated with a variant in the FLI1 binding site in the 5' UTR of ANKRD26."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We also provide evidence that the previously reported c.-140C>G ANKRD26 5' UTR variant is benign and not associated with thrombocytopenia."

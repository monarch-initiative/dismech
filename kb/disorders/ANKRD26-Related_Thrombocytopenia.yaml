pathophysiology:
- name: ANKRD26 5' UTR Variant Abolishing RUNX1 and FLI1 Binding
  description: >-
    A heterozygous single nucleotide substitution in the ANKRD26 5' UTR
    removes the binding sites for RUNX1 and FLI1. In healthy megakaryocytes,
    RUNX1 and FLI1 bound at this element switch ANKRD26 off during the late
    stages of megakaryopoiesis and platelet production.
  biological_scale: MOLECULAR
  genetic_context:
    variant_type: single nucleotide variant
    genomic_contexts:
    - "5' UTR"
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: GAIN_OF_FUNCTION
  biological_processes:

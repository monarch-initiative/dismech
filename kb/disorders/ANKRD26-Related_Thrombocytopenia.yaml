    explanation: >-
      GeneReviews defines the core phenotype.
  - reference: PMID:21467542
    reference_title: "Mutations in ANKRD26 are responsible for a frequent form of inherited thrombocytopenia: analysis of 78 patients from 21 families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nearly all patients had no platelet macrocytosis, and this characteristic distinguishes THC2 from most other forms of inherited thrombocytopenia."
    explanation: >-

      label: Autosomal dominant inheritance
  description: >-
    One 5' UTR variant allele is sufficient. Most patients inherit the variant
    from a parent who is known or presumed to carry it; the platelet count
    varies within families, so molecular testing is more reliable than the
    platelet count for identifying affected relatives.

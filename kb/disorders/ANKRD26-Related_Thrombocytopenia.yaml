    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "THC2-associated mutations in the 5' UTR of ANKRD26 resulted in loss of runt-related transcription factor 1 (RUNX1) and friend leukemia integration 1 transcription factor (FLI1) binding"
    explanation: >-
      Shown in megakaryocytes cultured from patients and controls.
  - reference: PMID:38757516
    reference_title: "Inherited thrombocytopenia associated with a variant in the FLI1 binding site in the 5' UTR of ANKRD26."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "ANKRD26 expression is controlled by the binding of a RUNX1/FLI1 complex to the 5' UTR."
    explanation: >-
      Restates the regulatory model that the c.-107C>T variant extends to the
      FLI1 site.
  downstream:

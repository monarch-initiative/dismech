name: ANKRD26-Related Thrombocytopenia
creation_date: "2026-10-31T19:00:00Z"
category: Mendelian
synonyms:
- thrombocytopenia 2
- THC2
- ANKRD26-RT
- thrombocytopenia autosomal dominant 2
- thrombocytopenia type 2
disease_term:
  preferred_term: thrombocytopenia 2
  term:
    id: MONDO:0008555
    label: thrombocytopenia 2
parents:
- Inherited thrombocytopenia
- Germline predisposition to myeloid neoplasm
description: >-
  ANKRD26-related thrombocytopenia (thrombocytopenia 2, THC2, OMIM 188000) is a
  non-syndromic autosomal dominant inherited thrombocytopenia with
  predisposition to myeloid neoplasms. It is caused by heterozygous single
  nucleotide variants in a short, highly conserved stretch of the ANKRD26 5'
  untranslated region. The variants abolish binding of the transcription
  factors RUNX1 and FLI1, which normally silence ANKRD26 during late
  megakaryopoiesis, so ANKRD26 stays expressed. Excess ANKRD26 binds and
  stabilizes the thrombopoietin receptor MPL (and the EPO and G-CSF receptors)
  at the cell surface, prevents their internalization and strengthens
  MAPK/ERK signalling; in megakaryocytes this impairs proplatelet formation,
  and polyploid megakaryocytes undergo apoptosis, giving dysmegakaryopoiesis
  and a lifelong mild to moderate thrombocytopenia with normal platelet size.
  Most patients have absent or mild mucocutaneous bleeding; some have
  erythrocytosis or leukocytosis. The risk of myeloid malignancy
  (myelodysplastic syndrome, acute myeloid leukemia, chronic myeloid and
  chronic myelomonocytic leukemia) is increased, with somatic driver mutations
  thought to be needed for transformation. The disorder is a germline
  predisposition syndrome; the myeloid neoplasms that arise in carriers are
  separate disease entities.
notes: >-
  Named by its GeneReviews chapter title (PMID:29927566), a dyadic name that is
  also a MONDO exact synonym of MONDO:0008555; the MONDO label "thrombocytopenia
  2" is kept in synonyms. The MONDO definition also mentions one family with a
  MASTL variant. Pippucci et al. (PMID:21211618) found ANKRD26 mutated in eight
  unrelated THC2 families and in the family previously reported with an ACBD5
  variant, and ClinGen classifies only ANKRD26 for this disease; MASTL is not
  recorded as a causal gene here. In the Italian registry described by Noris et
  al. (PMID:21467542), ANKRD26 variants accounted for 21 of 210 families with
  inherited thrombocytopenia, which is a share of a referral registry rather
  than a population prevalence. A WAC-ANKRD26 fusion from a complex structural
  variant (PMID:33857290) and N-terminal truncating coding variants seen in
  AML (PMID:28100250) are recorded as rarer gain-of-function routes in the
  genetic notes.

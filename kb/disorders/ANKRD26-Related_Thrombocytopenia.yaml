- name: Persistent ANKRD26 Expression During Late Megakaryopoiesis
  description: >-
    ANKRD26 is normally expressed in early erythroid, megakaryocyte and
    granulocyte progenitors, where it is needed for proliferation, and is
    progressively silenced as the cells mature. In THC2 it stays expressed in
    maturing megakaryocytes and platelets, an ectopic temporal expression.
    ANKRD26 binds the homodimeric type I cytokine receptors MPL, EPOR and
    G-CSFR.
  biological_scale: MOLECULAR
  regulatory_category: GOE

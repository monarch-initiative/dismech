    snippet: "Acute myeloid leukemia, myelodysplastic syndrome, and chronic myelomonocytic leukemia have been reported to occur in the context of germline variants in ANKRD26, with the development of somatic driver mutations in hematopoietic regulators playing an important role in malignant transformation."

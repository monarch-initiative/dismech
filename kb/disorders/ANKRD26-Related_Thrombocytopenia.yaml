genetic:
- name: ANKRD26
  gene_term:
    preferred_term: ANKRD26
    term:
      id: hgnc:29186
      label: ANKRD26
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Pathogenic variants are single nucleotide substitutions clustered in a
    highly conserved 19 bp stretch of the 5' UTR covering the RUNX1 binding
    site and a short flanking region (for example c.-125T>G and c.-118C>T), and
    one variant (c.-107C>T) lies in the adjacent FLI1 binding site. The
    mechanism is gain of function (persistent expression), not
    haploinsufficiency. A complex structural variant producing a WAC-ANKRD26
    fusion transcript caused a THC2-like phenotype in one family, and
    N-terminal truncating ANKRD26 variants found in apparently sporadic AML
    produce stable isoforms that activate MAPK/ERK signalling. The c.-140C>G 5'
    UTR variant, once reported as pathogenic, segregated with normal platelet
    counts in two later families and is regarded as likely benign.

      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "RUNX1 and FLI1 binding at the 5' UTR from healthy subjects led to ANKRD26 silencing during the late stages of megakaryopoiesis and blood platelet development."
      explanation: >-

phenotypes:
- name: Disseminated BCG Disease
  category: Immune
  description: >-
    The defining presentation. Eight of the nine published patients were BCG-vaccinated at or
    near birth and most developed disseminated BCG disease between one and twelve months. The
    2026 series shows the range: axillary adenitis with bone-marrow involvement at four months,
    abscessed BCG adenitis at seven months, local armpit disease at one month, and in one
    patient a BCG-osis involving brain, mastoid sinuses, lung, liver and gastrointestinal tract
    that was fatal.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Disseminated BCG disease
    term:
      id: HP:0020087
      label: BCGosis
  notes: >-
    Present in most of the nine published patients. The two exceptions are informative rather
    than incidental: one 2023 patient had not been BCG-vaccinated and was only two years old at
    last follow-up, and the 2026 American patient was never vaccinated and presented instead with
    environmental mycobacterial disease in adulthood. So the BCG phenotype requires the exposure,
    and an unvaccinated carrier is not protected — only differently exposed.
  evidence:
  - reference: PMID:41623352
    reference_title: "Complete and partial forms of X-linked MCTS1 deficiency in patients with mycobacterial disease."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Three patients had adverse reactions to the BCG vaccine, whereas another patient was not vaccinated with BCG and had an infection with Mycobacterium abscessus at 16 years of age."
    explanation: >-
      The split in the 2026 series between vaccinated and unvaccinated patients, which is the
      evidence that the vaccine is the usual trigger rather than the cause.
  - reference: PMID:41623352
    reference_title: "Complete and partial forms of X-linked MCTS1 deficiency in patients with mycobacterial disease."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "An empirical diagnosis of BCG-osis (affecting the brain, mastoid sinuses, lung, liver, and gastrointestinal tract) was established"
    explanation: >-
      The severe end of the range, in the patient who died — the organs involved when the disease
      is not controlled.
  sequelae:
  - target: Lymphadenopathy
    description: >-
      Regional then disseminated nodal disease is how BCG spreads from the vaccination site.
  - target: Granulomatous Meningitis and Seizures
    description: >-
      Central nervous system involvement in the patient in whom BCG disease was not controlled,
      with the organism cultured from cerebrospinal fluid.
  - target: Failure to Thrive
    description: >-
      Chronic mycobacterial infection is itself a cause of growth failure. Whether it is the only
      cause here is the question recorded in this entry's redundancy discussion.
  - target: Chronic Diarrhoea and Gastrointestinal Mycobacterial Disease
    description: >-
      The gastrointestinal tract is one of the organs BCG disseminates to, and in one patient the
      ileocaecal lesion was mycobacterium-positive on biopsy.
- name: Nontuberculous Mycobacterial Infection
  category: Immune
  description: >-
    Disseminated Mycobacterium abscessus in the unvaccinated American patient, presenting as
    bulky intra-abdominal and retroperitoneal lymphadenopathy with chronic diarrhoea and weight
    loss, and Mycobacterium tuberculosis complex on ileocaecal mucosal biopsy in the Chinese
    patient. Environmental mycobacteria are what these patients meet when BCG is not given.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Disseminated Mycobacterium abscessus infection
    term:
      id: HP:0032130
      label: Mycobacterium abscessus abscessus infection
  notes: >-
    2 of 9 published patients, and both of them presented late — sixteen and twenty-two years in
    the American patient, ten years in the Chinese one. The diagnostic lesson is that an adult
    with disseminated environmental mycobacterial disease and a normal immunophenotype is a
    candidate for this diagnosis.
  evidence:
  - reference: PMID:41623352
    reference_title: "Complete and partial forms of X-linked MCTS1 deficiency in patients with mycobacterial disease."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "The patient was diagnosed with disseminated M. abscessus infection manifesting as bulky intra-abdominal/retroperitoneal lymphadenopathy, chronic diarrhea, and chronic weight loss."
    explanation: The full presentation in the unvaccinated adult patient.
  sequelae:
  - target: Lymphadenopathy
    description: >-
      Bulky intra-abdominal and retroperitoneal nodal disease is the presenting manifestation of
      the M. abscessus infection in the unvaccinated adult patient.
  - target: Chronic Diarrhoea and Gastrointestinal Mycobacterial Disease
    description: >-
      Chronic diarrhoea accompanied the disseminated abdominal disease in that patient and the
      ileocaecal tuberculous ulcer in another.
- name: Lymphadenopathy
  category: Immune
  description: >-
    Regional adenitis at the vaccination site in the BCG patients, and bulky intra-abdominal and
    retroperitoneal conglomerate lymphadenopathy in the adult with M. abscessus — in his case a
    retroperitoneal mass encasing the aorta and the proximal coeliac and superior mesenteric
    arteries, with necrotic change.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Regional and intra-abdominal lymphadenopathy
    term:
      id: HP:0002716
      label: Lymphadenopathy
  notes: >-
    Reported for most published patients in one form or another. It is infection-driven rather
    than a primary lymphoid abnormality, which is why it resolves on antimycobacterial treatment.
  evidence:
  - reference: PMID:41623352
    reference_title: "Complete and partial forms of X-linked MCTS1 deficiency in patients with mycobacterial disease."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "At the age of 4 mo, he presented BCG-osis with left axillary adenitis."
    explanation: The regional adenitis in the youngest of the 2026 patients, with its age.
- name: Normal Circulating Leukocyte Subsets
  category: Immune
  description: >-
    Routine immunophenotyping is normal. That is the diagnostic problem this disease poses: the
    test a clinician runs to confirm an immunodeficiency comes back reassuring, and only
    molecular diagnosis finds it.

    Recorded as a phenotype in its own right because its absence is what a curator or clinician
    would otherwise infer from the disease's name.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Normal development of circulating leukocyte subsets
  notes: >-
    Reported for all five 2023 patients and for the American patient in 2026.

    Deliberately unbound. HPO has no term for a normal immunophenotype in a patient who has an
    immunodeficiency, and every candidate inverts the claim: HP:0002721 Immunodeficiency asserts
    the abnormality this node exists to deny, and the lymphocyte-count terms assert a direction.
    A term plus a disclaimer is still a wrong term — the disclaimer is prose and the term is
    machine-readable — so `term:` is omitted and `preferred_term` carries the finding. Needs a
    term request: the concept is "routine immunophenotyping normal", which is diagnostically
    load-bearing across the whole of MSMD and not only here.

    Searched before omitting, and re-run against `ols:hp` before committing this note.
    `l~leukocyte` returns abnormality terms only (HP:0001881 Abnormal leukocyte morphology,
    HP:0001974 Increased total leukocyte count, HP:0033797 Leukocyte migration defect and
    siblings). `l~lymphocyte count` returns HP:0040088 Abnormal lymphocyte count and its
    increased/decreased children, including HP:0005403 Decreased total T cell count.
    `l~immunophenotyp` returns nothing at all. `l~normal` returns terms in which "normal" is part
    of some other concept — HP:0002343 Normal pressure hydrocephalus, HP:0002372 Normal
    interictal EEG, HP:0002632 Low-to-normal blood pressure — and nothing about a normal
    immunological result. HPO has terms for the presence of an abnormality and none for a
    documented normal finding in this domain, which is what makes this an NTR rather than a
    search failure. Note HP:0002372 shows the shape a suitable term would take.
  evidence:
  - reference: PMID:41623352
    reference_title: "Complete and partial forms of X-linked MCTS1 deficiency in patients with mycobacterial disease."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "All the detected leukocyte subsets developed normally in the patients."
    explanation: >-
      The normal immunophenotype across the 2023 cohort, restated in the 2026 introduction —
      which is why it is graded BACKGROUND rather than PRIMARY_RESULT.
  - reference: PMID:41623352
    reference_title: "Complete and partial forms of X-linked MCTS1 deficiency in patients with mycobacterial disease."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Complete blood counts and clinical immunophenotyping results were normal (Tables S3 and S4)."
    explanation: >-
      The same finding measured directly in the 2026 adult patient, whose disseminated
      M. abscessus infection would otherwise have prompted a search for an acquired cause.
- name: Decreased Circulating Immunoglobulin
  category: Immune
  description: >-
    Low immunoglobulins with normal total protein and albumin in the youngest 2026 patient,
    treated with intravenous immunoglobulin; hypogammaglobulinaemia in the Chinese patient, also
    on replacement; moderately low B cell counts and IgG in the Omani patient.

    This is the finding that sits least comfortably with the founding description of an otherwise
    intact immune system. Three of the four 2026 patients received immunoglobulin replacement.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Hypogammaglobulinaemia requiring immunoglobulin replacement
    term:
      id: HP:0004313
      label: Decreased circulating immunoglobulin concentration
  notes: >-
    3 of 4 patients in the 2026 series; not reported in the 2023 cohort, whose leukocyte subsets
    are described as normal without immunoglobulin data being quoted in the abstract. Whether
    this is a newly recognised part of the phenotype or a difference in what was measured and
    reported cannot be settled from the published record, and the entry does not try to.

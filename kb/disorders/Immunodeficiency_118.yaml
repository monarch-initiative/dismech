      2023 finding in its introduction rather than reporting it, and HUMAN_CLINICAL because the
      work it summarises was done in patient and patient-derived cells.
  downstream:
  - target: Reduced JAK2 Protein
    causal_link_type: DIRECT
- name: Reduced JAK2 Protein
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    JAK2 falls in every cell type tested, including T lymphocytes and phagocytes. It does not
    fall to zero, and that quantitative detail is what makes the phenotype selective rather than
    global: the level is low enough to impair IL-23 responses and partially IL-12 responses, and
    not low enough to impair the other JAK2-dependent cytokine responses.

    A JAK2 null would be a different and much worse disease — JAK2 carries erythropoietin,
    thrombopoietin and growth-hormone signalling. Nothing like that is seen here.

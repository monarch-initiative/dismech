discussions:
- discussion_id: imd118_redundancy_claim
  kind: CONTROVERSY
  status: OPEN
  prompt: >-
    Is MCTS1-dependent translation reinitiation really "otherwise physiologically redundant", or
    did the founding cohort simply have less follow-up than the second one?
  rationale: >-
    The 2023 report's most striking claim is that losing a general translation factor costs
    nothing outside the mycobacterial axis: normal immunity, growth and development in the
    survivors. It is a claim worth taking seriously — nine hemizygous null males with no
    malignancy is real evidence that an established oncogene is dispensable.

    The 2026 series does not contradict it directly and does sit awkwardly with it. Three of
    four new patients have growth failure below the third percentile, three have
    hypogammaglobulinaemia or low IgG prompting replacement, one has delayed gross motor
    development, and three have chronic gastrointestinal disease. Some of that is attributable
    to chronic mycobacterial infection, which causes growth failure on its own. Some of it may
    not be.

    The two readings make different predictions. If the extra features are infection-driven,
    they should improve with mycobacterial control; if they are a direct consequence of the
    translation defect, they should not. The American patient — healthy childhood, no BCG,
    disease only from sixteen — is the informative case, and what is reported for him is chronic
    weight loss dating from the onset of his infection rather than from birth.

    This entry records both the founding claim and the later series without resolving them, and
    the quoted hedge in the mechanism node is deliberate.
  attaches_to:
  - pathophysiology#Failure of 40S Ribosome Recycling and Translation Reinitiation
  - phenotypes#Failure to Thrive
  - phenotypes#Decreased Circulating Immunoglobulin
- discussion_id: imd118_ifng_bypass
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Should recombinant IFN-gamma be started at diagnosis in MCTS1 deficiency rather than after
    antimycobacterial therapy fails?
  rationale: >-
    The mechanistic case is unusually clean for a disease this rare. The defect is in the
    induction of IFN-gamma, not in the response to it; patient leukocytes respond normally to
    exogenous IFN-gamma and IFN-alpha; so the lesion is bypassable in principle, and the
    pathograph in this entry predicts exactly where the bypass enters.

    The evidence is two uncontrolled observations. In the American patient, IFN-gamma-1b at 400
    micrograms three times weekly produced substantial improvement — after about a year, which
    is worth noting for anyone judging an early response. In the Omani patient it improved
    activity, mobility and nutrition, was stopped after six weeks when follow-up was lost, and
    he died some months later; that sequence is suggestive and is not evidence of causation in
    either direction.

    What would settle it is not obtainable at nine patients. What is obtainable is a consistent
    record of whether IFN-gamma was offered, at what dose, and when relative to the
    antimycobacterial regimen — which the 2026 report supplies for its patients and the 2023
    report does not for its five.
  attaches_to:
  - treatments#Recombinant Interferon Gamma-1b
  - pathophysiology#Failure of Macrophage Activation Against Intracellular Mycobacteria
- discussion_id: imd118_bcg_in_at_risk_families
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Does an unvaccinated male relative of an MCTS1-deficient proband need BCG withheld, screening
    for environmental mycobacteria, or both?
  rationale: >-
    Eight of nine published patients were BCG-vaccinated at or near birth, and most of their
    disease is BCG disease. The obvious inference is that withholding BCG from at-risk males
    prevents the disease.

    The American patient shows the limit of that inference. He was never vaccinated, had a
    healthy childhood, and presented at twenty-two with disseminated Mycobacterium abscessus and
    a retroperitoneal mass encasing the aorta. Withholding BCG did not protect him; it changed
    which mycobacterium found him, and when. One 2023 patient was likewise unvaccinated and was
    only two at last follow-up, so his eventual course is unknown.

    The practical question this raises is not answerable from nine patients but is worth posing
    explicitly: an X-linked disease with a vaccine-avoidable early presentation and an
    unavoidable late one needs a surveillance answer, not only a vaccination answer. No published
    source addresses it.
  attaches_to:
  - phenotypes#Disseminated BCG Disease
  - phenotypes#Nontuberculous Mycobacterial Infection
notes: >-
  Patient count and sources. Nine patients in nine unrelated families: five in PMID:37875108
  (2023) and four in PMID:41623352 (2026). The 2026 paper's own count of five prior reported
  variants matches the 2023 cohort, so the two sets are disjoint and the total is nine.

  Scope of the 2023 abstract. Only the abstract and the opening of the 2023 paper are in the
  reference cache here; its five patients' individual clinical courses are not quotable from
  what is cached. Every clinical phenotype in this entry that carries a per-patient detail is
  therefore evidenced from the 2026 paper, whose full text is cached. Where this entry states
  something about the 2023 cohort — normal leukocyte subsets, one death, the redundancy claim —
  it is quoted either from the 2023 abstract or from the 2026 paper's summary of it, and graded
  BACKGROUND in the latter case.

  The gene identifier. The deep-research report gives MCTS1 as HGNC:7838, which is NKX3-1. The
  correct identifier is hgnc:23357. This is the second wrong gene CURIE in the same batch of
  five openscientist runs — the HLASA report gave LARS2 as HGNC:21353, which is KLHL31. The
  research recipe passes `--term-skip-prefix HGNC` so gene CURIEs are unchecked where they are
  emitted, and `just validate-terms` compares a CURIE against its own label rather than against
  the gene the entry names (dismech#10948). Both were caught here only because the entries write
  `label:` out. The same report's JAK2 identifier was correct, so the error rate is not uniform
  and cannot be assumed either way.

  Two curator errors, both caught by term validation, both worth recording because neither felt
  like guessing at the time: NCIT:C1428 was written for recombinant interferon gamma and is
  Stavudine; the entry now uses NCIT:C100089 Interferon Gamma-1b. CHEBI:6030 was written with
  the label "isoniazid" where CHEBI's canonical label is "isoniazide".

  GeneReviews baseline: `just check-genereviews` reports NO_CHAPTER for both GeneReviews and
  StatPearls against the committed Bookshelf index (snapshot 2026-09-10).

  JAK2 in the `genetic:` section. JAK2 is not mutated in this disease and is recorded with
  `relationship_type: MODIFIER` because there is no value for "gene whose translation the causal
  gene's loss selectively impairs". CAUSATIVE would assert a JAK2 variant no patient has. This
  is a schema gap rather than a curation choice, and the nearest available value is used with
  the reason stated in that record's notes.

  Review round 1. Two IMPORTANT findings, both taken. The mechanism chain was graded
  HUMAN_CLINICAL throughout on the reasoning that the experiments used patient and
  patient-derived cells. That is the inference CLAUDE.md's definition rules out: IN_VITRO covers
  cultured cells whether human or not, and "patient-derived" says where a cell came from rather
  than the setting the experiment ran in. The work behind those six items is MCTS1-knockout HeLa
  transfection and reporter assays, 40S and 80S footprinting in HeLa, CRISPR knockout in THP-1,
  HEK-Blue IL-23 reporter lines, gamma-2A fibrosarcoma transfection, and SV40-immortalised
  patient fibroblasts transduced with wild-type MCTS1. The founding paper says it in its own
  words, describing the impaired BCG response of patient leukocytes as measured in vitro. Those
  six are now IN_VITRO; the general-immunology statement about IFN-gamma as macrophage-activating
  factor is now OTHER; the phenotype and treatment items stay HUMAN_CLINICAL, which is what they
  are.

  This matters beyond bookkeeping. CLAUDE.md's rule that model and in-vitro evidence should not
  be the sole support for a human claim only works if the grading is honest, and as written the
  entry asserted that a chain established in three immortalised cell lines was direct human
  clinical evidence.

  The second finding was a binding that inverted its own claim: Normal Circulating Leukocyte
  Subsets was bound to HP:0002721 Immunodeficiency, so any consumer reading HP terms would take
  the entry to assert the abnormality that node exists to deny. The original notes flagged it as
  a binding of convenience, which does not help — the disclaimer is prose and the term is
  machine-readable. The term is dropped, preferred_term carries the finding, and the searches
  behind that omission are recorded in the phenotype's own notes and were re-run before being
  written down.

  Not curated. The deep-research report cites a body of MCTS1 tumour-biology work — oncogenic
  roles in laryngeal squamous cell carcinoma, breast-cancer prognostic signatures, the
  OTUD6B-LIN28B axis. That is overexpression biology in cancer, not a mechanism of germline
  loss, and the most interesting thing about it is precisely that it does not manifest in these
  patients. It is discussed in the gene record rather than curated as pathophysiology.

  downstream:
  - target: Ribosomal Stalling at the JAK2 Start-Stop Upstream Open Reading Frames
    causal_link_type: DIRECT
- name: Ribosomal Stalling at the JAK2 Start-Stop Upstream Open Reading Frames
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    This node is the specificity of the disease. The JAK2 5-prime untranslated region carries
    three upstream open reading frames, two of them ultra-short start-stop frames. Without MCTS1
    to recycle them, 40S subunits stall at those stop codons and cannot reinitiate at the JAK2
    main open reading frame.

    It is why a general translation defect produces a single-pathway disease. Of seventeen genes
    of IFN-gamma immunity tested in MCTS1-knockout cells, only JAK2 showed a substantial
    translational decrease, rescued by wild-type MCTS1 and not by patient variants. A gene's
    vulnerability here is a property of its 5-prime untranslated region, not of its function.

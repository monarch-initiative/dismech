  - reference: PMID:37875108
    reference_title: "Human MCTS1-dependent translation of JAK2 is essential for IFN-γ immunity to mycobacteria."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "We report X-linked recessive MCTS1 deficiency in men with mycobacterial disease from kindreds of different ancestries (from China, Finland, Iran, and Saudi Arabia)."
    explanation: >-
      The inheritance mode and the geographic spread of the founding kindreds, which is what
      makes this a recurrent genotype rather than a founder effect.
pathophysiology:
- name: Hemizygous MCTS1 Loss-of-Function Variants
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Eight variants are published across nine families. The 2023 five are all loss-of-expression
    or complete loss-of-function: two frameshift, one splice-site, and two in-frame 3-prime
    deletions both removing residues Ala133 to Lys181. The 2026 report adds p.Leu170* and
    p.Glu60Lysfs*5, both loss-of-function, and p.Trp175*, which is hypomorphic when
    overexpressed rather than null.

    That last allele is the reason this entity now has a partial form. A nonsense variant at
    codon 175 of a 181-residue protein removes very little, and the patient who carries it was
    not BCG-vaccinated, stayed healthy through childhood, and presented at sixteen with weight
    loss and diarrhoea and at twenty-two with disseminated Mycobacterium abscessus. Allele
    severity and age at presentation move together.

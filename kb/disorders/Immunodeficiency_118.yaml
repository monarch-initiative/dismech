inheritance:
- name: X-linked recessive inheritance
  description: >-
    All nine published patients are male and hemizygous. The 2023 kindreds are from China,
    Finland, Iran and Saudi Arabia; the 2026 families from Iran, Oman, China and the United
    States. Consanguinity is common but not required — the American patient's family is not
    described as consanguineous, and his variant is hypomorphic rather than null.
  inheritance_term:
    preferred_term: X-linked recessive inheritance
    term:
      id: HP:0001419
      label: X-linked recessive inheritance

prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: BELOW_1_IN_1000000
  notes: >-
    Nine patients in nine unrelated families: five in 2023 from China, Finland, Iran (two
    families) and Saudi Arabia, and four in 2026 from Iran, Oman, China and the United States.
    All male, all hemizygous, eight distinct variants.

    No population estimate exists. Ascertainment is through MSMD cohorts, so the denominator is
    the set of patients whose mycobacterial disease prompted genetic investigation, not the
    population. rate_per_100000 is left unset.

    One quantity worth recording: MCTS1 is one of twenty-two genes underlying forty-seven
    genetic aetiologies of MSMD as of the 2026 report. That is the population this entity is a
    slice of, and it is the reason a targeted MSMD panel rather than a single-gene test is the
    diagnostic route.
  evidence:
  - reference: PMID:41623352
    reference_title: "Complete and partial forms of X-linked MCTS1 deficiency in patients with mycobacterial disease."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Variants of 22 genes underlie 47 different genetic etiologies of MSMD (4)."
    explanation: >-
      The size of the genetic differential this entity sits inside. Graded BACKGROUND because it
      is a cited count in the paper's introduction rather than its own result.
progression:
- phase: Infantile BCG disease
  notes: >-
    Disease appears between one and twelve months in the vaccinated patients, at the site of
    vaccination first and disseminating from there. The 2026 series' youngest presented at four
    months with axillary adenitis and bone-marrow involvement; another at one month with local
    armpit disease.
  evidence:
  - reference: PMID:41623352
    reference_title: "Complete and partial forms of X-linked MCTS1 deficiency in patients with mycobacterial disease."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "7 mo later, he was diagnosed with abscessed BCG adenitis (BCG-itis)."
    explanation: The interval from vaccination to disease in one of the 2026 patients.
- phase: Later mycobacterial disease in the unvaccinated
  notes: >-
    Without BCG the disease waits for an environmental mycobacterium. The American patient had a
    healthy childhood with no notable infections, began losing weight and having diarrhoea at
    sixteen, and was diagnosed with disseminated Mycobacterium abscessus at twenty-two. He
    carries the hypomorphic p.Trp175* allele, so allele severity and absence of BCG exposure both
    point the same way and cannot be separated in one patient.
  evidence:
  - reference: PMID:41623352
    reference_title: "Complete and partial forms of X-linked MCTS1 deficiency in patients with mycobacterial disease."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "He had a healthy childhood, without frequent or notable infections. At the age of 16 years, he began to experience weight loss and diarrhea."
    explanation: >-
      The healthy childhood and the age of first symptoms — the natural history of an
      unvaccinated patient with a hypomorphic allele.
- phase: Outcome
  notes: >-
    Two of nine published patients have died of mycobacterial disease: one of the original five,
    and the Omani patient at six years and nine months. The rest responded to antimycobacterial
    treatment. The 2023 report describes its survivors as asymptomatic after early childhood with
    normal growth and development; the 2026 series' survivors are on long-term antimycobacterial
    therapy, immunoglobulin replacement and in two cases IFN-gamma-1b.

    The difference between those two descriptions is the most important thing in this entry's
    prognosis, and it is at least partly a difference in follow-up rather than in disease.
  evidence:
  - reference: PMID:41623352
    reference_title: "Complete and partial forms of X-linked MCTS1 deficiency in patients with mycobacterial disease."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "He developed fever and hematemesis, leading to his collapse and death within 24 h at the age of 6 years and 9 mo."
    explanation: The fatal outcome in the 2026 series, with its age.
genetic:
- name: MCTS1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: MCTS1
    term:
      id: hgnc:23357
      label: MCTS1
  notes: >-
    The single causal gene. MCTS1 is also a well-established oncogene, overexpressed in several
    tumour types, which makes the narrowness of the germline loss-of-function phenotype the
    surprising part of this disease: nine hemizygous null or near-null males with mycobacterial
    disease and no reported malignancy.

    A note on the identifier. The deep-research report committed alongside this entry gives MCTS1
    as HGNC:7838, which is NKX3-1, an unrelated homeobox gene. The correct identifier is
    hgnc:23357. The same run's HLASA report made the same class of error for LARS2. Gene CURIEs
    are unchecked in the research lane (the recipe passes --term-skip-prefix HGNC) and only
    self-consistency-checked on the KB side, which is dismech issue #10948; the report's JAK2
    identifier, by contrast, was correct.
  evidence:
  - reference: PMID:37875108
    reference_title: "Human MCTS1-dependent translation of JAK2 is essential for IFN-γ immunity to mycobacteria."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "These findings suggest that X-linked recessive human MCTS1 deficiency underlies isolated mycobacterial disease by impairing JAK2 translation in innate-like adaptive T lymphocytes, thereby impairing the IL-23-dependent induction of IFN-γ."
    explanation: The gene-disease claim and the mechanism in one sentence, as the authors state it.
- name: JAK2
  relationship_type: MODIFIER
  variant_origin: GERMLINE
  gene_term:
    preferred_term: JAK2
    term:
      id: hgnc:6192
      label: JAK2
  notes: >-
    JAK2 is not mutated in this disease. It is recorded here because it is the substrate whose
    translation fails, and because the structure of its 5-prime untranslated region — not its
    function — is what makes it the vulnerable one. The relationship type is MODIFIER as the
    nearest available value; there is no relationship type for "gene whose translation is
    selectively impaired by the causal gene's loss", and calling it CAUSATIVE would assert a
    JAK2 variant that no patient has.
  evidence:
  - reference: PMID:37875108
    reference_title: "Human MCTS1-dependent translation of JAK2 is essential for IFN-γ immunity to mycobacteria."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "JAK2 expression is sufficiently low to impair cellular responses to interleukin-23 (IL-23) and partially IL-12, but not other JAK2-dependent cytokines."
    explanation: >-
      JAK2's role as the limiting substrate, and the quantitative reason the impairment is
      selective for IL-23 rather than global. Graded IN_VITRO, as the same sentence is on the
      pathophysiology node: the cellular responses it describes were measured in knockout cell
      lines and reporter systems, not in a patient.
diagnosis:
- name: Routine immunophenotyping
  presence: ABSENT
  description: >-
    Recorded as a negative because it is the trap. Circulating leukocyte subsets develop normally
    and complete blood counts and clinical immunophenotyping are normal, so the test that would
    ordinarily confirm an immunodeficiency comes back reassuring. Molecular diagnosis is the only
    route.
  evidence:
  - reference: PMID:41623352
    reference_title: "Complete and partial forms of X-linked MCTS1 deficiency in patients with mycobacterial disease."
    supports: SUPPORT

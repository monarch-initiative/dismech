- name: Failure of Macrophage Activation Against Intracellular Mycobacteria
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  description: >-
    IFN-gamma is the macrophage-activating factor at the heart of antimycobacterial immunity, and
    without enough of it macrophages do not restrict the intracellular growth of weakly virulent
    mycobacteria. This is the step every MSMD genotype converges on, and it is established for
    the syndrome rather than measured in MCTS1 patients specifically.

    Its most important property here is where it sits. The lesion is upstream of the IFN-gamma
    receptor and patient leukocytes respond normally to exogenous IFN-gamma, so this node can be
    driven from outside — which is what makes recombinant IFN-gamma a rational therapy rather
    than a hopeful one.
  cell_types:
  - preferred_term: macrophage
    term:

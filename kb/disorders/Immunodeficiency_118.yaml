- name: Failure of 40S Ribosome Recycling and Translation Reinitiation
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    MCTS1 heterodimerises with DENR to recycle 40S ribosomal subunits after termination and to
    permit reinitiation on messages carrying short upstream open reading frames. Without it,
    subunits are not released at stop codons and reinitiation downstream is impaired.

    The striking part is how little this costs. The founding authors call MCTS1-dependent
    recycling "otherwise physiologically redundant" in these patients — meaning that outside the
    one pathway below, no phenotype attributable to a general translation defect was found. That
    is a strong claim and it is theirs, not this entry's; the 2026 series' growth failure,
    hypogammaglobulinaemia and gastrointestinal disease sit awkwardly against it, and this entry
    records both.

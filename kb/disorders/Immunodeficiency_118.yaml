    explanation: The normal routine immunology in the adult patient, whose diagnosis came from sequencing.
- name: Whole-exome sequencing
  description: >-
    How every published patient was diagnosed. Given that MSMD has twenty-two genes and
    forty-seven aetiologies, a targeted MSMD panel or exome is the rational first test in a boy
    with disseminated BCG or environmental mycobacterial disease and a normal immunophenotype.
  evidence:
  - reference: PMID:41623352
    reference_title: "Complete and partial forms of X-linked MCTS1 deficiency in patients with mycobacterial disease."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Whole-exome sequencing of the probands revealed hemizygosity for rare germline MCTS1 variants."
    explanation: The diagnostic method used across the 2026 series.
- name: Mycobacterial culture and molecular identification from the affected site
  description: >-
    Identifying the organism is what converts a granulomatous or necrotic lesion into a
    mycobacterial diagnosis, and in this series it required a range of methods: PCR for the
    M. bovis complex on axillary and bone-marrow specimens, cerebrospinal fluid culture,
    mycobacterial culture from lymph node biopsy, and metagenomic next-generation sequencing on
    an ileocaecal mucosal biopsy. Histology alone was insufficient in at least one case —
    the Chinese patient's biopsy showed epithelial damage, crypt distortion and gastritis
    without granulomas.
  evidence:
  - reference: PMID:41623352
    reference_title: "Complete and partial forms of X-linked MCTS1 deficiency in patients with mycobacterial disease."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Histopathology revealed small intestinal villous widening with epithelial damage and increased intraepithelial lymphocytes, focal crypt distortion in the colon, and mild chronic gastritis without granulomas"

      A mycobacterial gastrointestinal infection with non-granulomatous histology — the reason
      organism identification rather than histology is the diagnostic step recorded here.
treatments:
- name: Antimycobacterial Therapy
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    The primary treatment, and mostly effective. Regimens in the published patients range from
    isoniazid and rifampicin for eighteen months, through isoniazid, rifampicin, ethambutol and
    pyrazinamide, to a four-drug combination of imipenem with ceftaroline, omadacycline,
    clofazimine and linezolid for the M. abscessus patient. One isolate was
    pyrazinamide-resistant M. bovis BCG, which is expected — M. bovis is intrinsically
    pyrazinamide-resistant — and is worth knowing before a standard antituberculous regimen is
    started.

    Some patients also carry long-term antibacterial prophylaxis: the youngest 2026 patient is on
    daily azithromycin.
  treatment_term:
    preferred_term: antimycobacterial pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: isoniazid
      term:
        id: CHEBI:6030
        label: isoniazide
    - preferred_term: rifampicin
      term:
        id: CHEBI:28077
        label: rifampicin
    - preferred_term: ethambutol
      term:
        id: CHEBI:4877
        label: ethambutol
  target_mechanisms:
  - target: Disseminated BCG Disease
    description: >-
      Kills the organism the immune defect cannot control. It addresses the infection and leaves
      the IFN-gamma induction defect intact, which is why several patients need it long-term and
      why exposure to a new mycobacterium remains a risk.
  evidence:
  - reference: PMID:41623352
    reference_title: "Complete and partial forms of X-linked MCTS1 deficiency in patients with mycobacterial disease."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "P1 was treated with isoniazid and rifampicin, initially for 4 mo, but with subsequent prolongation for 18 mo based on his clinical response and microbiological status."
    explanation: >-
      A worked regimen with its duration and the basis on which it was extended — the practical
      detail a clinician needs.
  - reference: PMID:41623352
    reference_title: "Complete and partial forms of X-linked MCTS1 deficiency in patients with mycobacterial disease."
    supports: REFUTE
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Despite intravenous phenytoin and dexamethasone treatment and anti-infection treatment with ceftriaxone, vancomycin, and acyclovir, the patient remained febrile and lethargic."
    explanation: >-
      Graded REFUTE against a reading of antimicrobial treatment as reliably effective. In the
      patient who died, broad empirical cover failed because the organism was mycobacterial and
      the regimen was not — the antimycobacterial drugs were started eleven days after admission.
- name: Recombinant Interferon Gamma-1b
  therapeutic_modality: PROTEIN_REPLACEMENT
  description: >-
    The mechanistically indicated therapy, and the one this entry's pathograph predicts. The
    lesion is upstream of the IFN-gamma receptor and patient cells respond normally to exogenous
    IFN-gamma, so supplying it bypasses the block rather than working around it.

    Three of the four 2026 patients received it. In the Omani patient subcutaneous IFN-gamma-1b
    improved activity, mobility and nutritional status before he was lost to follow-up and it
    was stopped after six weeks; in the American patient, increasing doses over a year and a
    half, reaching 400 micrograms three times weekly, produced substantial improvement after
    about a year.

    Those are two uncontrolled observations, one of them in a patient who then died after the
    drug was stopped. They are recorded as such.
  treatment_term:
    preferred_term: interferon gamma therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: interferon gamma-1b
      term:
        id: NCIT:C100089
        label: Interferon Gamma-1b
  target_mechanisms:
  - target: Failure of Macrophage Activation Against Intracellular Mycobacteria
    description: >-
      Exogenous IFN-gamma activates macrophages directly, downstream of the IL-23-to-IFN-gamma
      induction step that fails. This is the node the treatment targets, and the reason it
      targets that node rather than a phenotype is that the bypass is a mechanistic claim the
      published cell data support.
  notes: >-
    therapeutic_modality is PROTEIN_REPLACEMENT rather than the immunomodulation reading the
    drug's usual context invites. The lesion here is an inability to produce IFN-gamma: IL-23
    signalling fails, so MAIT and gamma-delta cells do not make the cytokine. Giving it replaces
    a protein the patient cannot make, in a patient whose response to it is intact. That is
    replacement in the same sense immunoglobulin replacement is, and it is why the entry's
    pathograph predicts the therapy rather than merely accommodating it.
  evidence:
  - reference: PMID:41623352
    reference_title: "Complete and partial forms of X-linked MCTS1 deficiency in patients with mycobacterial disease."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Treatment with increasing doses of IFN-γ-1b for 1.5 years has started to show substantial improvements in the patient’s condition after ~1 year of treatment at a dosage of 400 µg three times per week."
    explanation: >-
      The dose, the schedule, the duration before response, and the response — the only
      quantitative treatment observation in this disease.
  - reference: PMID:41623352
    reference_title: "Complete and partial forms of X-linked MCTS1 deficiency in patients with mycobacterial disease."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Subcutaneous IFN-γ1b treatment was initiated, leading to improvements in the patient’s activity, mobility, and nutritional status."
    explanation: >-
      The second reported response, in the patient with central nervous system disease. The same
      paragraph records that follow-up was lost and the drug stopped after six weeks; that is in
      this treatment's description rather than in the snippet, which reports only what was
      observed on treatment.
- name: Immunoglobulin Replacement Therapy
  therapeutic_modality: PROTEIN_REPLACEMENT
  description: >-
    Given to three of the four 2026 patients — monthly intravenous immunoglobulin in the youngest,
    intravenous immunoglobulin in the Chinese patient for hypogammaglobulinaemia, and in the
    Omani patient on the basis of severe illness with moderately low B-cell counts and IgG even
    though immunoglobulin levels were normal.

    That last case is worth distinguishing: it was a decision made on clinical severity rather
    than on a demonstrated antibody deficiency, and it is recorded that way here.
  treatment_term:
    preferred_term: immunoglobulin replacement therapy
    term:
      id: NCIT:C62710
      label: Immunoglobulin Therapy
  target_mechanisms:

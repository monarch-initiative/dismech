- name: Reduced IFN-gamma Production by Innate-like Adaptive T Lymphocytes
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    MAIT cells and gamma-delta T cells produce less IFN-gamma on mycobacterial challenge. These
    are the lymphocytes that respond to mycobacteria without needing clonal expansion from a
    naive repertoire, which is why an infant meeting BCG in the first months of life depends on
    them.

    Adequate JAK2 is required for exactly this, which is the 2026 authors' summary of the
    pathway and the reason the entity sits within MSMD rather than beside it.

name: Immunodeficiency 118
category: Mendelian
creation_date: "2026-09-22T00:00:00Z"
synonyms:
- IMD118
- MCTS1 deficiency
- X-linked MCTS1 deficiency
- Mendelian susceptibility to mycobacterial disease due to MCTS1 deficiency
- MSMD due to MCTS1 deficiency
disease_term:
  preferred_term: immunodeficiency 118
  term:
    id: MONDO:0958030
    label: immunodeficiency 118
description: >-
  IMD118 is X-linked MCTS1 deficiency, a Mendelian susceptibility to mycobacterial disease in
  which a general translation factor defect is funnelled into a single clinical phenotype by a
  single vulnerable substrate. Nine patients in nine unrelated families are published: five in
  the 2023 report that defined the entity and four in a 2026 follow-up.

  MCTS1 partners with DENR to recycle post-termination 40S ribosomal subunits and to allow
  reinitiation on messages carrying short upstream open reading frames. Losing it should, on the
  face of it, disturb a great deal. It does not. Of seventeen genes of IFN-gamma immunity tested
  in MCTS1-knockout cells, only JAK2 translation fell — because the JAK2 5-prime untranslated
  region carries two ultra-short start-stop upstream open reading frames at which 40S subunits
  stall without MCTS1 to recycle them, blocking reinitiation at the main open reading frame.

  The consequence is a JAK2 level low enough to impair responses to IL-23, and partially to
  IL-12, while leaving other JAK2-dependent cytokine responses intact. Defective IL-23 signalling
  preferentially costs IFN-gamma production by the innate-like adaptive lymphocytes — MAIT cells
  and gamma-delta T cells — that respond to mycobacterial challenge, and IFN-gamma is the
  macrophage-activating cytokine that controls intracellular mycobacteria. Everything else MCTS1
  does appears to be physiologically redundant, which is the founding paper's own word for it.

  Two clinically load-bearing consequences follow. The block is upstream of the IFN-gamma
  receptor and patient cells respond normally to exogenous IFN-gamma, so the lesion is
  bypassable — and by 2026, three patients had been given IFN-gamma-1b with reported benefit.
  And the disease is not the benign entity the first report suggested: one of the original five
  died, one of the four new patients died of disseminated BCG involving the brain, and two of
  the new patients have hypogammaglobulinaemia requiring immunoglobulin replacement, which the
  phrase "otherwise physiologically redundant" does not prepare a reader for.
parents:
- Mendelian Susceptibility to Mycobacterial Disease
- Inborn Errors of Immunity
classifications:
  harrisons_chapter:
  - classification_value: IMMUNE_RHEUMATOLOGIC
    notes: >-
      A monogenic inborn error of immunity. It presents to infectious disease or paediatrics as
      a mycobacterial infection and is diagnosed by immunology and genetics.
  iuis_category:
    classification_value: innate immunity defect
    notes: >-
      IUIS places Mendelian susceptibility to mycobacterial disease among the defects of
      intrinsic and innate immunity rather than among the combined immunodeficiencies. That
      placement fits here: circulating leukocyte subsets develop normally, and the lesion is in
      an induction pathway rather than in lymphocyte development.

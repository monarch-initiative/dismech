name: Hypercalciuria, Absorptive, 2
creation_date: "2026-10-31T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: absorptive hypercalciuria 2
  term:
    id: MONDO:0007748
    label: hypercalciuria, absorptive, 2
synonyms:
- hypercalciuria, absorptive, type 2
- HCA2
- ADCY10-related absorptive hypercalciuria
description: >-
  An autosomal dominant form of absorptive hypercalciuria linked to the gene
  encoding soluble adenylyl cyclase (ADCY10). Affected individuals have
  normocalcemic hypercalciuria driven by increased intestinal calcium
  absorption, with a predisposition to calcium-containing kidney stones and, in
  some reports, reduced spinal bone mineral density. It is one genetically
  defined subset of the common, heterogeneous trait of primary (absorptive)
  hypercalciuria, which affects about 10% of the general population and is
  itself probably polygenic.
notes: >-
  No GeneReviews or StatPearls chapter covers this disorder; PubMed searches of
  the GeneReviews book by the disease name, by "absorptive hypercalciuria", and
  by the ADCY10 gene symbol all returned no chapter (checked 2026-10-31). The
  gene-disease relationship is recorded as RISK_FACTOR rather than CAUSATIVE
  because the founding evidence (Reed et al., 2002) was an association of ADCY10
  base substitutions with a 2.2-3.5-fold increased risk of absorptive
  hypercalciuria, and the gene is described in the literature as a
  "susceptibility gene"; individual heterozygous pathogenic ADCY10 variants have
  since been reported as causative in single families with dominant segregation,
  but no ClinGen gene-disease validity classification exists. Several mechanism
  and management statements are cited from reviews of primary/idiopathic
  hypercalciuria, of which absorptive hypercalciuria is the intestinal
  hyperabsorption subtype; those evidence items carry quote_role REVIEW_SYNTHESIS.
  Biallelic (homozygous) ADCY10 loss of function is reported to cause a separate,
  recessive phenotype - severe asthenozoospermia/male infertility (PMID:31119281) -
  which is not part of this autosomal dominant absorptive hypercalciuria entry;
  the homozygous carriers in that family also had the dominant hypercalciuria.

inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Absorptive hypercalciuria linked to the ADCY10 locus segregates as an
    autosomal dominant trait, and reported patients carry heterozygous ADCY10
    variants.
  evidence:
  - reference: PMID:31119281
    reference_title: ADCY10 frameshift variant leading to severe recessive asthenozoospermia and segregating with absorptive hypercalciuria.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "absorptive hypercalciuria, segregating within the family, was also associated with the same variant following a dominant inheritance."
    explanation: Reports dominant segregation of absorptive hypercalciuria with the ADCY10 variant in the studied pedigree.

genetic:
- name: ADCY10
  gene_term:
    preferred_term: ADCY10
    term:
      id: hgnc:21285
      label: ADCY10
  relationship_type: RISK_FACTOR
  notes: >-
    ADCY10 encodes soluble adenylyl cyclase (sAC), a bicarbonate- and
    calcium-regulated cyclase. The locus for an inherited form of absorptive
    hypercalciuria was mapped to chromosome 1q23.3-q24, and base substitutions
    in this soluble adenylate cyclase gene were associated with the phenotype
    and with low spinal bone density. Across 61 reported absorptive
    hypercalciuria patients, 16 ADCY10 variants have been described - seven
    missense, five splicing, two frameshift and two nonsense - and all but two
    cases (a homozygous c.1205_1206del) carry heterozygous variants, consistent
    with the dominant inheritance.
  evidence:
  - reference: PMID:11932268
    reference_title: Identification and characterization of a gene with base substitutions associated with the absorptive hypercalciuria phenotype and low spinal bone density.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This is the first description of a specific gene defect associated with AH."
    explanation: Establishes ADCY10 (the soluble adenylate cyclase gene) as the gene associated with absorptive hypercalciuria.
  - reference: PMID:11932268
    reference_title: Identification and characterization of a gene with base substitutions associated with the absorptive hypercalciuria phenotype and low spinal bone density.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Six of the identified sequence variations occurred with increased frequency in the AH population and tracked with the AH phenotype in AH families."
    explanation: Reports that ADCY10 sequence variants segregate with the absorptive hypercalciuria phenotype in affected families.
  - reference: PMID:38258300
    reference_title: "Two novel heterozygous ADCY10 variants identified in Chinese pediatric patients with absorptive hypercalciuria: case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A total of 16 ADCY10 gene mutations were identified, including seven missense (43.75%), five splicing (31.25%), two frameshift (12.50%) and two nonsense mutations (12.50%)."
    explanation: Gives the ADCY10 variant-class spectrum pooled across reported absorptive hypercalciuria patients.
  - reference: PMID:38258300
    reference_title: "Two novel heterozygous ADCY10 variants identified in Chinese pediatric patients with absorptive hypercalciuria: case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Only two cases were identified as homozygous mutations (c.1205_1206del), and the others were heterozygous mutations."
    explanation: Documents that reported ADCY10 absorptive hypercalciuria is almost always heterozygous, consistent with dominant inheritance.
  - reference: PMID:11932268
    reference_title: Identification and characterization of a gene with base substitutions associated with the absorptive hypercalciuria phenotype and low spinal bone density.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Previously, we mapped the locus for an inherited form of AH to chromosome 1q23.3-q24."
    explanation: Localizes the inherited absorptive hypercalciuria locus to 1q23.3-q24, where ADCY10 lies.
  - reference: PMID:31119281
    reference_title: ADCY10 frameshift variant leading to severe recessive asthenozoospermia and segregating with absorptive hypercalciuria.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "ADCY10 is a susceptibility gene for dominant absorptive hypercalciuria (OMIM#143870)"
    explanation: States the established ADCY10-absorptive hypercalciuria relationship and its dominant, susceptibility-gene character.

pathophysiology:
- name: Soluble Adenylyl Cyclase (ADCY10) Dysregulation
  biological_scale: MOLECULAR
  description: >-
    Sequence variants in ADCY10 alter the activity of soluble adenylyl cyclase,
    a cytosolic cyclase that generates cAMP in response to bicarbonate and
    calcium. The enzyme is expressed in gut, renal, and bone tissue, so its
    dysregulation is proposed to shift calcium handling toward a
    hyperabsorptive, hypercalciuric state and to contribute to bone loss.
  genes:
  - preferred_term: ADCY10
    term:
      id: hgnc:21285
      label: ADCY10
  molecular_functions:
  - preferred_term: adenylate cyclase activity
    term:
      id: GO:0004016
      label: adenylate cyclase activity
  biological_processes:
  - preferred_term: cAMP biosynthetic process
    term:
      id: GO:0006171
      label: cAMP biosynthetic process
  downstream:
  - target: Enhanced Intestinal Calcium Absorption
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Reduced Bone Mineral Density
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:15659711
    reference_title: Cloning and characterization of the human soluble adenylyl cyclase.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "hsAC is a divalent cation and HCO(3)(-) sensor, and its HCO(3)(-) sensitivity is modulated by divalent cations."
    explanation: Characterizes the soluble adenylyl cyclase encoded by ADCY10 as a bicarbonate- and calcium-sensing cyclase, the molecular activity dysregulated here.
  - reference: PMID:15659711
    reference_title: Cloning and characterization of the human soluble adenylyl cyclase.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "Mg(2+), Mn(2+), and Ca(2+) all increased adenylyl cyclase activity in a dose-dependent manner."
    explanation: Shows calcium directly regulates the adenylyl cyclase activity of the enzyme, linking calcium status to cAMP generation.
  - reference: PMID:15659711
    reference_title: Cloning and characterization of the human soluble adenylyl cyclase.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "showed 190- and 80-kDa bands in multiple human cell lines from gut, renal, and bone origins"
    explanation: Demonstrates expression of the enzyme in gut, kidney, and bone, the tissues where calcium handling is altered.
- name: Enhanced Intestinal Calcium Absorption
  biological_scale: TISSUE
  description: >-
    The defining physiologic lesion of absorptive hypercalciuria is increased
    intestinal absorption of dietary calcium, which raises the filtered calcium
    load delivered to the kidney while serum calcium remains normal. Heightened
    intestinal calcium absorption is one of the key contributors to the
    pathogenesis of primary hypercalciuria.
  cell_types:
  - preferred_term: enterocyte
    term:
      id: CL:0000584
      label: enterocyte
  biological_processes:
  - preferred_term: calcium ion import
    term:
      id: GO:0070509
      label: calcium ion import
    modifier: INCREASED
  downstream:
  - target: Hypercalciuria
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:40330359
    reference_title: "Idiopathic Hypercalciuria: A Comprehensive Review of Clinical Insights and Management Strategies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Impaired renal tubular calcium reabsorption, heightened intestinal calcium absorption, and increased bone resorption are key contributors to its pathogenesis."
    explanation: Identifies heightened intestinal calcium absorption as a key contributor to primary hypercalciuria, substantiating the increased-absorption node.
  - reference: PMID:40330359
    reference_title: "Idiopathic Hypercalciuria: A Comprehensive Review of Clinical Insights and Management Strategies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "In contrast, individuals with IH absorb about 30% of their dietary calcium"
    explanation: Quantifies the increased fractional dietary calcium absorption (about 30% versus 20% in controls) that defines the absorptive mechanism.

phenotypes:
- name: Hypercalciuria
  category: Laboratory
  description: >-
    Excess urinary calcium excretion with normal serum calcium, the defining
    biochemical abnormality of the disorder. Across reported ADCY10-associated
    patients the mean age at onset is about 24 years, but the range spans
    infancy to adulthood.
  phenotype_term:
    preferred_term: Hypercalciuria
    term:
      id: HP:0002150
      label: Hypercalciuria
    onset:
      mean_age_years: 23.61
      notes: >-
        Pooled mean age of onset 23.61 plus or minus 20.08 years across 61
        reported ADCY10-associated absorptive hypercalciuria patients
        (PMID:38258300); the wide standard deviation reflects a range from
        infancy (reported 1- and 6-year-olds) to adulthood, so no single
        onset_category is assigned.
  sequelae:
  - target: Kidney stone
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:38258300
      reference_title: "Two novel heterozygous ADCY10 variants identified in Chinese pediatric patients with absorptive hypercalciuria: case report and literature review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Absorptive hypercalciuria (AH) is a prevalent cause of kidney stones, and the adenylate cyclase 10 (ADCY10) gene is a rare causative gene of AH."
      explanation: Supports that the hypercalciuria is the cause of the calcium kidney stones.
  evidence:
  - reference: PMID:38258300
    reference_title: "Two novel heterozygous ADCY10 variants identified in Chinese pediatric patients with absorptive hypercalciuria: case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Urinary metabolite analysis revealed that urine calcium / creatinine ratios were 0.95 mmol/mmol and 1.61 mmol/mmol, respectively."
    explanation: Directly documents the elevated urine calcium (calcium/creatinine ratio) in the ADCY10 patients, i.e. the hypercalciuria itself.
  - reference: PMID:38258300
    reference_title: "Two novel heterozygous ADCY10 variants identified in Chinese pediatric patients with absorptive hypercalciuria: case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the mean age of onset was 23.61±20.08 years"
    explanation: Gives the pooled mean age at onset across reported ADCY10 absorptive hypercalciuria patients.
- name: Kidney stone
  category: Renal
  description: >-
    Calcium-containing (calcium oxalate and/or calcium phosphate) urinary
    calculi arising from the sustained hypercalciuria.
  phenotype_term:
    preferred_term: Nephrolithiasis
    term:
      id: HP:0000787
      label: Nephrolithiasis
  evidence:
  - reference: PMID:38258300
    reference_title: "Two novel heterozygous ADCY10 variants identified in Chinese pediatric patients with absorptive hypercalciuria: case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two female patients (6 years old and 1 year old) with multiple bilateral kidney stones were found to have a heterozygous c.3304T>C mutation and a heterozygous c.1726C>T mutation in the ADCY10 gene."
    explanation: Reports kidney stones in patients carrying heterozygous ADCY10 variants.
  - reference: PMID:11932268
    reference_title: Identification and characterization of a gene with base substitutions associated with the absorptive hypercalciuria phenotype and low spinal bone density.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Absorptive hypercalciuria (AH) is a kidney stone-forming condition frequently complicated by bone loss."
    explanation: Characterizes absorptive hypercalciuria as a stone-forming condition.
- name: Reduced Bone Mineral Density
  category: Skeletal
  description: >-
    Reduced bone mineral density, documented at the lumbar spine (L2-L4) in the
    families used to map the ADCY10 locus, reflecting the systemic calcium
    imbalance and the role of soluble adenylyl cyclase in bone.
  phenotype_term:
    preferred_term: Reduced spinal bone mineral density
    term:
      id: HP:0004349
      label: Reduced bone mineral density
  evidence:
  - reference: PMID:11932268
    reference_title: Identification and characterization of a gene with base substitutions associated with the absorptive hypercalciuria phenotype and low spinal bone density.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In addition, 1 or more base changes was associated with a lower L2-L4 vertebral bone density."
    explanation: Associates ADCY10 base substitutions with lower lumbar vertebral bone density.
  - reference: PMID:11932268
    reference_title: Identification and characterization of a gene with base substitutions associated with the absorptive hypercalciuria phenotype and low spinal bone density.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Absorptive hypercalciuria (AH) is a kidney stone-forming condition frequently complicated by bone loss."
    explanation: States that absorptive hypercalciuria is frequently complicated by bone loss.

treatments:
- name: Thiazide diuretic
  description: >-
    Thiazide diuretics lower urinary calcium excretion by enhancing distal
    renal tubular calcium reabsorption and are used to treat the hypercalciuria
    and prevent recurrent calcium stones. In reported ADCY10 pediatric cases,
    thiazide therapy normalized urine calcium postoperatively.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: thiazide
      term:
        id: CHEBI:50264
        label: thiazide
  target_mechanisms:
  - target: Hypercalciuria
    treatment_effect: INHIBITS
    description: Reduces urinary calcium excretion by increasing distal tubular calcium reabsorption, correcting the hypercalciuria.
    evidence:
    - reference: PMID:40330359
      reference_title: "Idiopathic Hypercalciuria: A Comprehensive Review of Clinical Insights and Management Strategies."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "These medications reduce urinary calcium excretion by increasing calcium reabsorption in the distal convoluted tubule of the kidney"
      explanation: Gives the renal mechanism by which thiazides reduce the hypercalciuria.
  evidence:
  - reference: PMID:38258300
    reference_title: "Two novel heterozygous ADCY10 variants identified in Chinese pediatric patients with absorptive hypercalciuria: case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both patients underwent thiazide intake postoperatively, and upon reexamination, urine calcium decreased to within the normal range."
    explanation: Reports that thiazide therapy normalized urinary calcium in ADCY10-associated absorptive hypercalciuria.

prevalence:
- population: Reported ADCY10-associated absorptive hypercalciuria cases
  measure_type: CASES_IN_LITERATURE
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    ADCY10 is described as a rare causative gene of absorptive hypercalciuria;
    only a small number of patients and 16 ADCY10 variants had been reported in
    the literature as of 2024. No population-level prevalence of the
    ADCY10-defined subset is established.
  evidence:
  - reference: PMID:38258300
    reference_title: "Two novel heterozygous ADCY10 variants identified in Chinese pediatric patients with absorptive hypercalciuria: case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the adenylate cyclase 10 (ADCY10) gene is a rare causative gene of AH"
    explanation: Describes ADCY10 as a rare cause of absorptive hypercalciuria.

diagnosis:
- name: 24-hour urinary calcium measurement
  description: >-
    Diagnosis rests on documenting excess urinary calcium with normal serum
    calcium, after secondary causes (hyperparathyroidism, malignancy, vitamin D
    excess) are excluded; the standard first-line test is a 24-hour urine
    collection for calcium excretion.
  evidence:
  - reference: PMID:40330359
    reference_title: "Idiopathic Hypercalciuria: A Comprehensive Review of Clinical Insights and Management Strategies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The first step in the diagnostic workup typically includes a 24-hour urine collection to measure 24-hour urinary calcium excretion."
    explanation: Identifies 24-hour urinary calcium as the first-line diagnostic measurement for hypercalciuria.

discussions:
- discussion_id: adcy10_variant_functional_effect_unproven
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Soluble Adenylyl Cyclase (ADCY10) Dysregulation
  prompt: >-
    Do the absorptive-hypercalciuria-associated ADCY10 variants actually change
    soluble adenylyl cyclase activity, and in which direction, and is the
    intestine the tissue in which they act?
  rationale: >-
    The gene-disease relationship rests on association and co-segregation, not on
    a functional assay: no study has shown that an AH-associated ADCY10 variant
    raises or lowers sAC activity, or localized the defect to intestinal calcium
    transport. Both causal edges out of this node are therefore recorded as
    INDIRECT_UNKNOWN_INTERMEDIATES.

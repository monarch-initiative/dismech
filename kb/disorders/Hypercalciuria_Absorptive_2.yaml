treatments:
- name: Thiazide diuretic
  description: >-
    Thiazide diuretics lower urinary calcium excretion by enhancing distal
    renal tubular calcium reabsorption and are used to treat the hypercalciuria
    and prevent recurrent calcium stones. In reported ADCY10 pediatric cases,
    thiazide therapy normalized urine calcium postoperatively.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: thiazide
      term:
        id: CHEBI:50264
        label: thiazide
  target_mechanisms:
  - target: Enhanced Intestinal Calcium Absorption
    treatment_effect: MODULATES
    description: Increases distal convoluted tubule calcium reabsorption to counteract the urinary calcium load resulting from enhanced intestinal calcium absorption.
    evidence:
    - reference: PMID:40330359
      reference_title: "Idiopathic Hypercalciuria: A Comprehensive Review of Clinical Insights and Management Strategies."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "These medications reduce urinary calcium excretion by increasing calcium reabsorption in the distal convoluted tubule of the kidney"
      explanation: Gives the renal mechanism by which thiazides counteract the hypercalciuric consequence of enhanced intestinal calcium absorption.
  - target: Hypercalciuria
    treatment_effect: INHIBITS
    description: Reduces urinary calcium excretion by increasing distal tubular calcium reabsorption, correcting the hypercalciuria.
    evidence:
    - reference: PMID:40330359
      reference_title: "Idiopathic Hypercalciuria: A Comprehensive Review of Clinical Insights and Management Strategies."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "These medications reduce urinary calcium excretion by increasing calcium reabsorption in the distal convoluted tubule of the kidney"
      explanation: Gives the renal mechanism by which thiazides reduce the hypercalciuria.
  evidence:
  - reference: PMID:38258300
    reference_title: "Two novel heterozygous ADCY10 variants identified in Chinese pediatric patients with absorptive hypercalciuria: case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both patients underwent thiazide intake postoperatively, and upon reexamination, urine calcium decreased to within the normal range."
    explanation: Reports that thiazide therapy normalized urinary calcium in ADCY10-associated absorptive hypercalciuria.
- name: High Fluid Intake and Low-Sodium Diet
  description: >-
    Increased daily fluid intake dilutes urinary calcium to reduce crystal
    supersaturation, while dietary sodium restriction lowers urinary calcium
    excretion and preserves bone mineral storage.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Dietary Intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  target_mechanisms:
  - target: Enhanced Intestinal Calcium Absorption
    treatment_effect: MODULATES
    description: Balanced dietary calcium and sodium restriction counteract excessive urinary calcium excretion driven by intestinal hyperabsorption.
    evidence:
    - reference: PMID:40330359
      reference_title: "Idiopathic Hypercalciuria: A Comprehensive Review of Clinical Insights and Management Strategies."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "This low-sodium diet may lower calcium levels in the urine and preserve or improve bone mineral storage."
      explanation: Explains how sodium restriction reduces urinary calcium excretion and protects bone mineral density.
  evidence:
  - reference: PMID:40330359
    reference_title: "Idiopathic Hypercalciuria: A Comprehensive Review of Clinical Insights and Management Strategies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Adequate hydration helps dilute the urine, reducing calcium supersaturation and the risk of stone formation."
    explanation: Supports high fluid intake as a conservative intervention to prevent calcium stone formation.


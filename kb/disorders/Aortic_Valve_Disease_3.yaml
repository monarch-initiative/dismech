- name: Abnormal Aortic Valve Development
  description: >-
    ROBO4 is expressed in the endocardium of the developing outflow-tract
    cushions and later in endothelial and interstitial cells of the developing
    aortic valve. Robo4-deficient mice develop valve thickening, bicuspid and
    occasionally quadricuspid valves, and valve stenosis or regurgitation. Valve
    pathology from an affected family member with BAV showed valve thickening
    with a fibroproliferative process.
  biological_scale: TISSUE

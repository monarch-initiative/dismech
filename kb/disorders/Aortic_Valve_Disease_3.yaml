inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  expressivity: VARIABLE
  description: >-
    Heterozygous ROBO4 variants segregated with disease in two families. In the
    larger family two clinically unaffected female relatives carried the splice
    variant, and carriers showed BAV with ascending aneurysm, isolated BAV, or
    isolated aortic aneurysm. Seven of the eight affected members of that family
    were male. No numerical penetrance estimate exists.
  evidence:
  - reference: PMID:30455415
    reference_title: ROBO4 variants predispose individuals to bicuspid aortic valve and thoracic aortic aneurysm.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report the identification of variants in ROBO4 (which encodes a
      factor known to contribute to endothelial performance) that segregate with
      disease in two families.
    explanation: >-
      Segregation of heterozygous ROBO4 variants with disease in two families is
      the basis for the dominant inheritance pattern.
  - reference: PMID:30455415
    reference_title: ROBO4 variants predispose individuals to bicuspid aortic valve and thoracic aortic aneurysm.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two clinically unaffected female family members were heterozygous for the
      ROBO4 splice-site mutation.
    explanation: >-
      Unaffected heterozygous carriers in family 1 establish incomplete
      penetrance.
  - reference: PMID:30455415
    reference_title: ROBO4 variants predispose individuals to bicuspid aortic valve and thoracic aortic aneurysm.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a concept further supported by the presence of either BAV/AscAA, isolated
      BAV, or isolated AscAA in family members segregating the same ROBO4
      mutation
    explanation: >-
      Different manifestations among carriers of one variant establish variable
      expressivity.
  - reference: CGGV:assertion_3531e2eb-71cd-446c-8956-acb15c3adc7b-2025-01-24T170000.000Z
    reference_title: ROBO4 / aortic valve disease 3 (Moderate)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The condition is incompletely penetrant (both in terms of aortic valve
      disease and aortic aneurysm) with greater penetrance in males compared to
      females.
    explanation: >-
      The ClinGen evidence summary for this gene-disease pair records incomplete
      penetrance with a male bias.
pathophysiology:
- name: ROBO4 Loss of Function
  description: >-
    Heterozygous germline ROBO4 variants reduce or structurally disrupt the
    endothelial ROBO4 receptor. The family 1 splice-donor variant causes in-frame
    skipping of exon 13, removing 36 amino acids from the intracellular domain;
    the family 2 missense variant p.Arg64Cys changes a conserved residue in the
    first extracellular Ig-like domain. Silencing and mutant-expression
    experiments point to loss of function, by haploinsufficiency or an
    antimorphic effect of mutant protein, as the pathogenic mechanism.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: ROBO4
    modifier: DECREASED
    term:
      id: hgnc:17985
      label: ROBO4
  molecular_functions:
  - preferred_term: ROBO4 endothelial receptor activity
    term:
      id: GO:0038023
      label: signaling receptor activity
  notes: >-
    The molecular function is bound without a modifier. The discovery paper
    found the familial missense variants spread along the whole protein and
    argues against loss of any domain-specific function (dimerization, partner
    binding, SLIT recruitment), so which aspect of ROBO4 receptor activity the
    variants reduce has not been established. GO:0038023 is the curated GO
    molecular function for ROBO4 (Q8WZ75).
  evidence:
  - reference: PMID:18345009
    reference_title: Robo4 stabilizes the vascular network by inhibiting pathologic angiogenesis and endothelial hyperpermeability.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: >-
      Activation of Robo4 by Slit2 inhibits vascular endothelial growth factor
      (VEGF)-165-induced migration, tube formation and permeability in vitro
    explanation: >-
      Establishes ROBO4 as an endothelial receptor whose activation suppresses
      VEGF-induced permeability, which supports the molecular function bound on
      this node. It is not a study of the disease variants.
  - reference: PMID:30455415
    reference_title: ROBO4 variants predispose individuals to bicuspid aortic valve and thoracic aortic aneurysm.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Amplification and sequencing of cDNA derived from patient and control
      fibroblasts showed that the splice-site mutation results in the skipping of
      the 108 base pairs encoding exon 13 of ROBO4, resulting in an in-frame
      transcript encoding a protein isoform missing 36 amino acids from the
      intracellular domain
    explanation: >-
      Cultured patient fibroblasts show the molecular consequence of the
      family 1 splice variant.
  - reference: PMID:30455415
    reference_title: ROBO4 variants predispose individuals to bicuspid aortic valve and thoracic aortic aneurysm.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These data suggest that loss-of-function (by functional haploinsufficiency
      or the antimorphic effects of overexpressed mutant protein) is the relevant
      pathogenic mechanism.
    explanation: >-
      The authors' conclusion from the cultured endothelial-cell experiments
      that the variants act through loss of function.
  - reference: CGGV:assertion_3531e2eb-71cd-446c-8956-acb15c3adc7b-2025-01-24T170000.000Z
    reference_title: ROBO4 / aortic valve disease 3 (Moderate)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The mechanism of pathogenicity appears to be loss of function.
    explanation: ClinGen's curation records loss of function as the apparent mechanism.
  downstream:
  - target: Impaired Endothelial Barrier Function
    description: >-
      ROBO4 silencing, or expression of either familial variant, made cultured
      human aortic endothelial monolayers more permeable.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:30455415
      reference_title: ROBO4 variants predispose individuals to bicuspid aortic valve and thoracic aortic aneurysm.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Either ROBO4 silencing or expression of ROBO4 variants resulted in loss
        of endothelial barrier function in a dextran permeability assay
      explanation: >-
        Directly perturbing ROBO4 in human aortic endothelial cells produces the
        barrier defect.
  - target: Mesenchymal Shift of Aortic Endothelial Cells
    description: >-
      The same perturbations induced mesenchymal markers, cell elongation and
      invasion. The paper reports this in parallel with the barrier defect and
      does not show that one causes the other.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:30455415
      reference_title: ROBO4 variants predispose individuals to bicuspid aortic valve and thoracic aortic aneurysm.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Other phenotypes seen included induction of expression of α-SMA and
        Snail1 mRNA and cellular elongation and invasion.
      explanation: >-
        ROBO4 silencing or mutant expression in cultured aortic endothelial
        cells induces a mesenchymal expression program and invasive behavior.
  - target: Abnormal Aortic Valve Development
    description: >-
      Loss of Robo4 in mice produces aortic valve thickening, bicuspid valves and
      valve dysfunction. The intervening developmental steps were not studied;
      ROBO4 is expressed in the endocardial cushions where the valve forms.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:30455415
      reference_title: ROBO4 variants predispose individuals to bicuspid aortic valve and thoracic aortic aneurysm.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Homozygous Robo4tm1Lex/tm1Lex knockout mice exhibited a complex
        cardiovascular phenotype that includes a combination of aortic valve
        thickening with or without BAV, aortic valve stenosis and/or
        regurgitation and/or AscAA.
      explanation: >-
        Homozygous loss of Robo4 in the mouse produces valve malformation; the
        human disease is heterozygous, so this is model-organism support.
- name: Impaired Endothelial Barrier Function
  description: >-
    ROBO4-deficient aortic endothelium loses barrier function, with reduced
    expression of the tight-junction protein TJP1 and the adherens-junction
    protein VE-cadherin. In aneurysm tissue from an affected family member,
    endothelial ROBO4 staining was diminished and plasma albumin penetrated the
    aortic intima, whereas it stayed at the endothelial surface in control aorta.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: aortic endothelial cell
    term:
      id: CL:0002544
      label: aortic endothelial cell
  biological_processes:
  - preferred_term: establishment of endothelial barrier
    modifier: DECREASED
    term:
      id: GO:0061028
      label: establishment of endothelial barrier
  locations:
  - preferred_term: ascending aorta
    term:
      id: UBERON:0001496
      label: ascending aorta
  evidence:
  - reference: PMID:30455415
    reference_title: ROBO4 variants predispose individuals to bicuspid aortic valve and thoracic aortic aneurysm.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Loss of barrier function associated with down regulation of expression of
      TJP1 and VE-cadherin mRNA and protein, indicative of loss of tight- and
      adherens-junction integrity, respectively
    explanation: >-
      Junctional protein loss accompanies the barrier defect in cultured human
      aortic endothelial cells.
  - reference: PMID:30455415
    reference_title: ROBO4 variants predispose individuals to bicuspid aortic valve and thoracic aortic aneurysm.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      immunostaining for albumin was restricted to the endothelial surface in
      control aorta, but substantial penetration into the aortic intima was
      observed in patient tissue
    explanation: >-
      Resected aneurysm tissue from one affected individual shows increased
      permeability in vivo. This is a single patient compared with a single
      control.
  - reference: PMID:30455415
    reference_title: ROBO4 variants predispose individuals to bicuspid aortic valve and thoracic aortic aneurysm.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ROBO4 was strongly expressed in endothelial cells in control aorta as
      evidenced by co-localization with platelet endothelial cell adhesion
      molecule 1 (CD31) but was diminished in the endothelium in the BAV/AscAA
      sample
    explanation: >-
      Reduced endothelial ROBO4 in the patient's aneurysmal aorta.
  downstream:
  - target: Aortic Wall Medial Remodeling
    description: >-
      The authors infer from the patient tissue that barrier failure contributes
      to remodeling of the aortic media; the order of events was not tested.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:30455415
      reference_title: ROBO4 variants predispose individuals to bicuspid aortic valve and thoracic aortic aneurysm.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: >-
        Collectively, these data suggest that ROBO4 mutations disrupt
        endothelial cellular performance and barrier function, contributing to
        pathological remodeling of the aortic media.
      explanation: >-
        The causal link is the authors' interpretation of co-occurring findings
        in one patient's aneurysm tissue rather than an experiment.
- name: Mesenchymal Shift of Aortic Endothelial Cells
  description: >-
    ROBO4-deficient aortic endothelial cells express alpha-smooth muscle actin
    and SNAI1, elongate and invade collagen gels, a pattern the authors read as
    suggestive of endothelial-to-mesenchymal transition. In the patient's
    aneurysm, ROBO4-positive cells co-staining for alpha-smooth muscle actin
    were found in the aortic media. No single signaling pathway was identified:
    ROBO4 silencing gave a modest decline in BMP and Notch target-gene
    expression without altered TGF-beta responses.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: aortic endothelial cell
    term:
      id: CL:0002544
      label: aortic endothelial cell
  notes: >-
    No biological_processes binding. GO searched through ols:go with the
    queries "endothelial to mesenchymal" and "endothelial-mesenchymal"; both
    returned only GO:0140074 cardiac endothelial to mesenchymal transition and
    its three regulation terms. The cells studied were aortic endothelium, not
    cardiac endothelium, so the cardiac term would overstate the claim.
  evidence:
  - reference: PMID:30455415
    reference_title: ROBO4 variants predispose individuals to bicuspid aortic valve and thoracic aortic aneurysm.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Together, these results suggest that reduction or structural disruption of
      ROBO4 compromises endothelial identity and performance, as well as its
      capacity to suppress transition to a mesenchymal invasive character and
      synthetic repertoire.
    explanation: >-
      The authors' synthesis of the cultured-cell results.
  - reference: PMID:30455415
    reference_title: ROBO4 variants predispose individuals to bicuspid aortic valve and thoracic aortic aneurysm.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the aneurysm tissue uniquely showed infiltration of ROBO4+ cells into the
      aortic media with co-staining for α-SMA
    explanation: >-
      A tissue observation in one patient consistent with mesenchymal behavior
      of ROBO4-expressing cells in vivo.
  - reference: PMID:30455415
    reference_title: ROBO4 variants predispose individuals to bicuspid aortic valve and thoracic aortic aneurysm.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Assessment of expression of prototypical target genes suggested a modest
      decline in bone morphogenetic protein (BMP) and Notch activity without
      altered TGFβ responses upon ROBO4 silencing.
    explanation: >-
      Records that no single downstream pathway was shown to drive the
      mesenchymal shift.
  downstream:
  - target: Aortic Wall Medial Remodeling
    description: >-
      Proposed by the authors as a contributor alongside barrier failure; not
      tested experimentally.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:30455415
      reference_title: ROBO4 variants predispose individuals to bicuspid aortic valve and thoracic aortic aneurysm.
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: INDIRECT
      snippet: >-
        This study focuses attention on endothelial cell biology in BAV/AscAA,
        with impairment of barrier function and/or dysregulation of mesenchymal
        transition potentially contributing to disease expression.
      explanation: >-
        A hypothesis stated in the discussion, drawn from the cell experiments.
- name: Aortic Wall Medial Remodeling
  description: >-
    Aneurysmal ascending aorta from an affected family member showed a
    fibroproliferative response with collagen accumulation in the intima and
    superficial media, and decreased elastin with fragmented, disarrayed elastic
    fibers in the superficial media.
  biological_scale: TISSUE
  locations:

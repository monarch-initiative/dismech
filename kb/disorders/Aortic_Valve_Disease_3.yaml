name: Aortic Valve Disease 3
creation_date: "2026-10-11T00:00:00Z"
category: Mendelian
description: >-
  Aortic valve disease 3 is an autosomal dominant, incompletely penetrant
  ROBO4-associated valvulo-aortopathy in which bicuspid aortic valve, aortic
  valve stenosis, and aneurysm of the aortic root and/or ascending aorta occur
  alone or in combination, with atrial septal defect in one reported family.
  The proposed mechanism is endothelial: loss of ROBO4 function in cultured
  aortic endothelial cells weakens the endothelial barrier and shifts the cells
  toward a mesenchymal, invasive state, and aneurysm tissue from an affected
  individual shows plasma albumin penetrating the intima with fibroproliferative
  remodeling and elastic-fiber fragmentation of the superficial media. The
  disease rests on two segregating families, a rare-variant enrichment in a
  BAV/ascending-aneurysm cohort, and mouse and zebrafish models; ClinGen
  classifies the gene-disease relationship as Moderate.

    term:
      id: UBERON:0001496
      label: ascending aorta
  evidence:
  - reference: PMID:30455415
    reference_title: ROBO4 variants predispose individuals to bicuspid aortic valve and thoracic aortic aneurysm.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Histologic analyses showed a strong fibroproliferative response in the

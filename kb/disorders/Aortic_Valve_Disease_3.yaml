    evidence_source: MODEL_ORGANISM
    snippet: >-
      We observed that mouse ROBO4 was expressed in the endocardial layer of the
      cushions and delamination zones at embryonic day 11.5
    explanation: Places ROBO4 in the cells that form the valve primordia.
  - reference: PMID:30455415

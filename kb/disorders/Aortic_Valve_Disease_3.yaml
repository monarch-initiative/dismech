    evidence:
    - reference: CGGV:assertion_3531e2eb-71cd-446c-8956-acb15c3adc7b-2025-01-24T170000.000Z
      reference_title: ROBO4 / aortic valve disease 3 (Moderate)
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "ROBO4 | HGNC:17985 | aortic valve disease 3 | MONDO:0032783 | AD | Moderate"
      explanation: >-
        ClinGen Congenital Heart Disease GCEP classifies ROBO4-aortic valve
        disease 3 as Moderate for autosomal dominant inheritance.
  notes: >-
    relationship_type is deliberately left unset. The schema defines CAUSATIVE
    as corresponding to ClinGen Definitive or Strong, and ClinGen rates this
    pair Moderate; no other GeneDiseaseRelationshipEnum value describes a
    defining gene with moderate validity. In the discovery study 13 of 736
    BAV/ascending-aneurysm probands (1.77%) carried a filtered rare ROBO4 variant
    against one of 376 controls (P = 0.0432). A later study found no significant
    ROBO4 contribution to BAV in a heritable thoracic aortic disease cohort.
  variants:
  - name: ROBO4 c.2056+1G>T
    description: >-
      Splice-donor variant (NM_019055.5) segregating in family 1, carried by all
      eight affected members and two unaffected women; causes in-frame skipping
      of exon 13.
    evidence:
    - reference: PMID:30455415
      reference_title: ROBO4 variants predispose individuals to bicuspid aortic valve and thoracic aortic aneurysm.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We confirmed that all eight affected family members carried the
        mutation.
      explanation: Segregation of the splice variant with disease in family 1.
  - name: ROBO4 c.190C>T (p.Arg64Cys)
    description: >-
      Missense variant in the first Ig-like extracellular domain, found in an
      affected mother and son (family 2) and in one further unrelated proband.
    evidence:
    - reference: PMID:30455415
      reference_title: ROBO4 variants predispose individuals to bicuspid aortic valve and thoracic aortic aneurysm.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The missense mutations observed in the targeted sequencing cohort
        include an independent example of the p.Arg64Cys variant observed in
        Family 2.
      explanation: Recurrence of p.Arg64Cys in an unrelated proband.
  evidence:
  - reference: PMID:30455415
    reference_title: ROBO4 variants predispose individuals to bicuspid aortic valve and thoracic aortic aneurysm.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Collectively, among familial and individual probands (WES and targeted
      sequencing), 13/736 (1.77%) had a ROBO4 variant that passed a priori
      filtering constraints while one rare (absent from ExAC) missense mutation
      was observed among 376 rigorously phenotyped controls
    explanation: Rare-variant enrichment in BAV/ascending-aneurysm probands.
  - reference: PMID:32748548
    reference_title: "Rare deleterious variants of NOTCH1, GATA4, SMAD6, and ROBO4 are enriched in BAV with early onset complications but not in BAV with heritable thoracic aortic disease."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Rare variants of NOTCH1, ROBO4, SMAD6, or GATA4 do not significantly
      contribute to BAV in cohorts with HTAD.
    explanation: >-
      A burden analysis found no significant ROBO4 contribution to BAV in a
      heritable thoracic aortic disease cohort. This bears on how much of BAV
      with aortic disease ROBO4 explains, not on segregation in the original
      families.
  - reference: PMID:32748548
    reference_title: "Rare deleterious variants of NOTCH1, GATA4, SMAD6, and ROBO4 are enriched in BAV with early onset complications but not in BAV with heritable thoracic aortic disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Rare NOTCH1 and ROBO4 variants were also enriched in the EBAV cohort, but
      this was not statistically significant due to limited power in this small
      data set.
    explanation: >-
      A non-significant trend toward ROBO4 enrichment in early-onset BAV
      complications (63 probands).
diagnosis:
- name: Transthoracic Echocardiography
  description: >-
    Echocardiography defines valve morphology and function and measures the
    aortic root and ascending aorta. This is general BAV guidance, not
    ROBO4-specific.
  diagnosis_term:
    preferred_term: echocardiography
    term:
      id: NCIT:C16525
      label: Echocardiography Test
  evidence:
  - reference: PMID:36322642
    reference_title: "2022 ACC/AHA Guideline for the Diagnosis and Management of Aortic Disease: A Report of the American Heart Association/American College of Cardiology Joint Committee on Clinical Practice Guidelines."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In patients with a BAV, TTE is indicated to evaluate valve morphology and
      function, to evaluate the diameter of the aortic root and ascending aorta,
      and to evaluate for aortic coarctation and other associated cardiovascular
      defects.
    explanation: Guideline recommendation for BAV generally.
- name: Echocardiographic Screening of First-Degree Relatives
  description: >-
    Because penetrance is incomplete and carriers may have isolated valve or
    aortic disease, relatives are screened by imaging. The guideline
    recommendation applies to BAV with aortic dilatation generally.
  diagnosis_term:
    preferred_term: echocardiography
    term:
      id: NCIT:C16525
      label: Echocardiography Test
  evidence:
  - reference: PMID:36322642
    reference_title: "2022 ACC/AHA Guideline for the Diagnosis and Management of Aortic Disease: A Report of the American Heart Association/American College of Cardiology Joint Committee on Clinical Practice Guidelines."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In patients with a BAV and a dilated aortic root or ascending aorta,
      screening of all first-degree relatives by TTE is recommended to evaluate
      for the presence of a BAV, dilation of the aortic root and ascending
      aorta, or both
    explanation: Guideline basis for family imaging.
- name: Multigene Panel Testing
  description: >-
    ROBO4 is listed among genes for BAV with thoracic aortic aneurysm in the
    2022 ACC/AHA aortic guideline's gene table.
  evidence:
  - reference: PMID:36322642
    reference_title: "2022 ACC/AHA Guideline for the Diagnosis and Management of Aortic Disease: A Report of the American Heart Association/American College of Cardiology Joint Committee on Clinical Practice Guidelines."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "BAV with TAA | TGFBR2, MAT2A, GATA5, SMAD6, LOX, ROBO4, TBX20"
    explanation: The guideline gene table names ROBO4 for BAV with thoracic aortic aneurysm.
treatments:
- name: Aortic Valve Replacement
  description: >-
    Surgical replacement for severe aortic valve stenosis; the affected mother in
    family 2 required valve surgery. This treats the lesion, not the inherited
    susceptibility.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: aortic valve replacement
    term:
      id: NCIT:C50815
      label: Aortic Valve Replacement
  target_mechanisms:
  - target: Aortic valve stenosis
  evidence:
  - reference: PMID:30455415
    reference_title: ROBO4 variants predispose individuals to bicuspid aortic valve and thoracic aortic aneurysm.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In family 2, WES revealed a heterozygous ROBO4 missense variant (c.190C>T;
      p.Arg64Cys) in a woman, with atrial septal defect (ASD) and aortic valve
      stenosis (AVS) that required surgery
    explanation: Valve surgery in a ROBO4 carrier with stenosis.
- name: Prophylactic Aortic Root and Ascending Aorta Replacement
  description: >-
    Surgical replacement of the dilated aortic root and/or ascending aorta at
    guideline diameter thresholds for BAV-associated aortopathy. Thresholds are
    general BAV guidance and have not been validated for ROBO4 carriers.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: aortic root and ascending aorta replacement surgery
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Aortic root aneurysm
  - target: Ascending tubular aorta aneurysm
  evidence:
  - reference: PMID:36322642
    reference_title: "2022 ACC/AHA Guideline for the Diagnosis and Management of Aortic Disease: A Report of the American Heart Association/American College of Cardiology Joint Committee on Clinical Practice Guidelines."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In patients with a BAV and a diameter of the aortic root, ascending aorta,
      or both of ≥5.5 cm, surgery to replace the aortic root, ascending aorta,
      or both is recommended.
    explanation: Guideline surgical threshold for BAV-associated aortopathy.
animal_models:
- name: Robo4 knockout mouse (Robo4tm1Lex)
  species: Mouse
  genotype: Robo4tm1Lex/tm1Lex (exons 1-3 deleted)
  publication: PMID:30455415
  description: >-
    Homozygous knockout mice develop a low-penetrance, male-predominant
    combination of aortic valve thickening, BAV, valve stenosis or regurgitation
    and ascending aortic aneurysm; heterozygotes were unaffected.
  modeled_mechanisms:
  - target: Abnormal Aortic Valve Development
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    limitations: >-
      Only homozygous animals were affected, whereas human carriers are
      heterozygous; penetrance at 20 weeks was 5/28 males and 2/18 females.
    evidence:
    - reference: PMID:30455415
      reference_title: ROBO4 variants predispose individuals to bicuspid aortic valve and thoracic aortic aneurysm.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Overall, at 20 weeks of age, 5/28 (17.9%) male and 2/18 (11.1%) female
        Robo4tm1Lex/tm1Lex mice were affected compared to 0/22 (0%) and 0/19
        (0%) Robo4+/+ males and females, respectively
      explanation: Low-penetrance cardiovascular phenotype in homozygous knockouts.
    - reference: PMID:30455415
      reference_title: ROBO4 variants predispose individuals to bicuspid aortic valve and thoracic aortic aneurysm.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        None of the evaluated heterozygotes (Robo4tm1Lex/+) presented with any
        structural or functional abnormality.
      explanation: Grounds the heterozygosity limitation.
- name: Robo4 exon 13 splice knock-in mouse (Robo4Skip13)
  species: Mouse
  genotype: Robo4 c.2089+1G>T knock-in (Robo4Skip13)
  publication: PMID:30455415
  description: >-
    Knock-in of the mouse equivalent of the family 1 splice-donor variant causes
    exon 13 skipping and an incompletely penetrant valve and ascending-aorta
    phenotype, including in some heterozygous males.
  modeled_mechanisms:
  - target: ROBO4 Loss of Function
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: MOLECULAR
    evidence:
    - reference: PMID:30455415
      reference_title: ROBO4 variants predispose individuals to bicuspid aortic valve and thoracic aortic aneurysm.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We conclude that the Robo4Skip13 mutation alters pre-mRNA splicing with
        significant representation of mature mRNA lacking exon 13.
      explanation: Reproduces the splicing defect of the human family 1 allele.
  - target: Abnormal Aortic Valve Development
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    limitations: >-
      Penetrance at 20 weeks was 1/31 heterozygous and 4/35 homozygous males;
      the knock-in also activates a cryptic donor not described in patients.
    evidence:
    - reference: PMID:30455415
      reference_title: ROBO4 variants predispose individuals to bicuspid aortic valve and thoracic aortic aneurysm.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Like the knockout mice, Robo4Skip13 mice presented with an incompletely
        penetrant complex cardiovascular phenotype that included aortic valve
        defects and aortic valve dysfunction and AscAA.
      explanation: Valve and aortic phenotype in the splice knock-in.
- name: robo4 frameshift zebrafish (robo4 delta7)
  species: Zebrafish
  genotype: robo4 exon 6 seven-nucleotide deletion (robo4Δ7)
  publication: PMID:30455415
  description: >-
    Adult heterozygous and homozygous mutants show more ventriculo-bulbar valve
    regurgitation or turbulence than wild type; no vascular enlargement was
    observed.
  modeled_mechanisms:
  - target: Abnormal Aortic Valve Development
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    limitations: >-
      The ventriculo-bulbar valve is not an aortic valve, the readout is
      valve function rather than morphology, and no aneurysm phenotype was seen.
    evidence:
    - reference: PMID:30455415
      reference_title: ROBO4 variants predispose individuals to bicuspid aortic valve and thoracic aortic aneurysm.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Thus, targeted disruption of robo4 in zebrafish perturbs outflow tract function.
      explanation: Outflow-tract valve dysfunction in robo4 mutant fish.
experimental_models:
- name: ROBO4-silenced or mutant-expressing human aortic endothelial cells
  experimental_model_type: PRIMARY_CELL_CULTURE
  organism:
    preferred_term: Homo sapiens
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_types:
  - preferred_term: aortic endothelial cell
    term:
      id: CL:0002544
      label: aortic endothelial cell
  cell_source: Commercial primary human aortic endothelial cells, passages 2-6
  culture_system: Monolayers on porous inserts and cell aggregates on collagen gels
  publication: PMID:30455415
  description: >-
    Cells were treated with ROBO4 siRNA or transiently transfected with
    wild-type, exon 13-deleted or p.Arg64Cys ROBO4 constructs, then assayed for
    dextran permeability, junctional markers, mesenchymal markers, shape and
    invasion.
  modeled_mechanisms:
  - target: Impaired Endothelial Barrier Function
    relationship: PERTURBS
    fidelity: MODERATE
    model_scale: CELLULAR
    limitations: >-
      Transient overexpression in static culture, without flow, valve tissue
      context or lifetime exposure.
    evidence:
    - reference: PMID:30455415
      reference_title: ROBO4 variants predispose individuals to bicuspid aortic valve and thoracic aortic aneurysm.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Either ROBO4 silencing or expression of ROBO4 variants resulted in loss
        of endothelial barrier function in a dextran permeability assay
      explanation: The model's barrier readout.
  - target: Mesenchymal Shift of Aortic Endothelial Cells
    relationship: PERTURBS
    fidelity: MODERATE
    model_scale: CELLULAR
    limitations: >-
      Marker induction and invasion suggest, but do not prove, a full
      endothelial-to-mesenchymal transition.
    evidence:
    - reference: PMID:30455415
      reference_title: ROBO4 variants predispose individuals to bicuspid aortic valve and thoracic aortic aneurysm.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Other phenotypes seen included induction of expression of α-SMA and
        Snail1 mRNA and cellular elongation and invasion.
      explanation: The model's mesenchymal readouts.
notes: >-
  No GeneReviews chapter names this disease. A 2026 case report of congenital
  coarctation with BAV in a woman carrying ROBO4 p.Thr232Met was not curated as
  a phenotype: it is a single individual with no segregation data. Aortic
  regurgitation is reported only in the mouse and zebrafish models and is not
  listed as a human phenotype. No prevalence estimate exists; the 1.77% figure
  is a variant yield in a selected BAV/aneurysm cohort, not a disease
  frequency.

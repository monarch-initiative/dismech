  description: >-
    Repetitive pressing or poking of the eyes with a finger or fist, known as the
    oculodigital sign, is a characteristic behaviour of infants and young children
    with LCA. It is a presentation-level pediatric finding rather than a feature of
    the later disease course, and in a preverbal child it is often what prompts

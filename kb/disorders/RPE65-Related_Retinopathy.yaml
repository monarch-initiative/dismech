mappings:
  mondo_mappings:
  - term:
      id: MONDO:0008765
      label: Leber congenital amaurosis 2
    mapping_predicate: skos:narrowMatch
    mapping_source: MONDO
    mapping_justification: >
      MONDO places Leber congenital amaurosis 2 (MONDO:0008765) as a child of
      RPE65-related recessive retinopathy (MONDO:0100368), the term this entry is
      anchored at. LCA2 names the most severe, infantile-onset end of the same
      biallelic RPE65 spectrum rather than a separate mechanism, so it is recorded
      here as a narrow match and carried as the LCA2 subtype below.
notes: >-
  The three clinical phenotypes of the autosomal recessive form — LCA2 (onset
  infancy, most severe), EOSRD (onset early childhood), and juvenile RP (onset late
  childhood/adolescence, mildest) — represent a single genetic entity under
  MONDO:0100368 and are distinguished by allele severity and residual RPE65 activity
  rather than by separate disease mechanisms. MONDO:0100452 (RPE65-related dominant
  retinopathy) is captured as a subtype; its molecular mechanism (dominant-negative
  or gain-of-function) is less well characterized than the recessive loss-of-function
  form. The gene therapy approval (voretigene neparvovec) applies specifically to
  biallelic RPE65 mutations and does not cover the dominant form. Epidemiologically,
  biallelic RPE65 mutations account for approximately 8% of Leber congenital amaurosis
  cases and 2% of retinitis pigmentosa cases. Clinical presentation is highly variable
  and fundus abnormalities can be minimal in early childhood, making genetic testing
  essential for diagnosis.

  Lump/split: Leber congenital amaurosis 2 (MONDO:0008765) is curated here as a
  subtype of this entry rather than as its own disease entry. It is the same gene
  (RPE65), the same proximal lesion (loss of retinyl-ester isomerohydrolase
  activity) and the same pathograph as the rest of the recessive spectrum,
  separated from EOSRD and juvenile RP by age at onset and residual enzyme
  activity rather than by mechanism; MONDO itself files MONDO:0008765 beneath
  MONDO:0100368. This differs from the sibling entries Leber_Congenital_Amaurosis_9
  (NMNAT1), Leber_Congenital_Amaurosis_10 (CEP290) and Leber_Congenital_Amaurosis_13
  (RDH12), which are separate entries because each is a different gene with a
  different mechanism and no gene-level entry to fold into. Note that the LCA
  label is not the most common RPE65 presentation: most children with biallelic
  RPE65 variants present as EOSRD, with residual cone-mediated central vision and
  little or no nystagmus, so the LCA2 designation marks the severe end of a
  continuum rather than a discrete clinical category.
has_subtypes:
- name: LCA2
  display_name: Leber congenital amaurosis 2 (LCA2)
  genes:
  - preferred_term: RPE65
    term:
      id: hgnc:10294
      label: RPE65
  subtype_term:
    preferred_term: Leber congenital amaurosis 2
    term:
      id: MONDO:0008765
      label: Leber congenital amaurosis 2
  inheritance:
  - name: Autosomal recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
    description: >-
      LCA2 arises from biallelic (homozygous or compound heterozygous) RPE65
      loss-of-function variants, the severe end of the same recessive allelic
      series that produces EOSRD and juvenile retinitis pigmentosa.
  description: >-
    LCA2 is the most severe presentation of biallelic RPE65 deficiency: visual
    manifestations begin in the first year of life, with profound nyctalopia,
    severely reduced acuity, nystagmus, poorly reactive pupils and an
    undetectable or severely abnormal full-field electroretinogram. The
    oculodigital sign (eye poking) is a characteristic infant finding, and high
    hyperopia is common, suggesting impaired emmetropisation. LCA2 is separated
    from early-onset severe retinal dystrophy, which presents after infancy and
    usually before age five, by age at onset and by the amount of residual
    photoreceptor function rather than by a different mechanism. Because the
    degeneration is slow, a therapeutic window for subretinal RPE65 gene
    supplementation persists through childhood, which is why molecular diagnosis
    in an infant with nystagmus and an extinguished ERG is time-critical.
  evidence:
  - reference: PMID:28689169
    reference_title: "Leber congenital amaurosis/early-onset severe retinal dystrophy: clinical features, molecular genetics and therapeutic interventions."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Whereas LCA is congenital or presents within the first few months of life, is associated with nystagmus, poor pupil responses and in most instances an undetectable full-field electroretinogram (ERG)"
    explanation: >-
      This review defines the clinical boundary this subtype records: LCA is
      congenital or presents within the first few months of life with nystagmus,
      poor pupil responses and an undetectable ERG, whereas EOSRD presents after
      infancy. That boundary is what separates LCA2 from the EOSRD end of the
      same RPE65 spectrum.
  - reference: PMID:9326941
    reference_title: "Mutations in RPE65 cause autosomal recessive childhood-onset severe retinal dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Here we report that the analysis of RPE65 in a collection of about 100 unselected retinal-dystrophy patients of different ethnic origin revealed five that are likely to be pathogenic mutations"
    explanation: >-
      Gu et al. 1997 is the primary report identifying pathogenic RPE65 variants in
      autosomal recessive childhood-onset severe retinal dystrophy, the gene
      assignment on which the LCA2 designation rests. The gene was read off this
      primary source rather than from the stub or from review prose.
  - reference: PMID:9326941
    reference_title: "Mutations in RPE65 cause autosomal recessive childhood-onset severe retinal dystrophy."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "The most severe cases are termed Leber congenital amaurosis (LCA), while the less aggressive forms are usually considered juvenile retinitis pigmentosa."
    explanation: >-
      The same paper states the nosology directly: Leber congenital amaurosis is the
      name for the most severe cases within the recessive childhood-onset severe
      retinal dystrophy group, with juvenile retinitis pigmentosa at the mild end.
      This is the severity continuum the LCA2 subtype sits at one end of, and it is
      the reason LCA2 is recorded as a subtype rather than a separate disease.
- name: RPE65-related dominant retinopathy
  genes:
  - preferred_term: RPE65
    term:
      id: hgnc:10294
      label: RPE65
  subtype_term:
    preferred_term: RPE65-related dominant retinopathy
    term:
      id: MONDO:0100452
      label: RPE65-related dominant retinopathy
  description: >-
    Rare heterozygous dominant-acting RPE65 variants produce a retinitis pigmentosa
    phenotype that is generally milder and later in onset than the recessive LCA2/EOSRD
    form. Night blindness and progressive peripheral visual field loss are the
    predominant features; onset may extend into adulthood. Whether the dominant
    mechanism reflects dominant-negative interference with RPE65 enzyme complex
    assembly, gain-of-function toxicity, or haploinsufficiency is not fully resolved
    for most reported families.
  evidence:
  - reference: PMID:28712537
    reference_title: "Efficacy and safety of voretigene neparvovec (AAV2-hRPE65v2) in patients with RPE65-mediated inherited retinal dystrophy: a randomised, controlled, open-label, phase 3 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Biallelic mutations in this gene, which disrupt the visual cyde, can be described as Leber congenital amaurosis type 2, retinitis pigmentosa type 20, early-onset retinal dystrophy, and other clinical labels for severe rod-mediated inherited retinal dystrophies, which all eventually progress to complete blindness."
    explanation: >-
      The phase 3 trial paper contextualizes the RPE65 mutation phenotypic spectrum.
      Retinitis pigmentosa type 20 (RP20) reflects the less severe, adult-onset
      end of RPE65-related disease; the dominant retinopathy subtype (MONDO:0100452)
      represents this rarer inheritance context alongside the biallelic recessive
      forms.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    The vast majority of RPE65-related retinopathy is caused by biallelic
    loss-of-function variants, producing a range of severity from LCA2 (most
    severe) to juvenile RP (mildest) depending on residual RPE65 enzymatic activity.
  evidence:
  - reference: PMID:31725251
    reference_title: "Autosomal Recessive RPE65-Related Retinal Degeneration."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "GENETIC COUNSELING: RPE65-related retinal degeneration is inherited in an autosomal recessive manner. If both parents of a child diagnosed with autosomal recessive RPE65-related retinal degeneration are known to be heterozygous for an RPE65 pathogenic variant, each sib of an affected individual has at conception a 25% chance of being affected, a 50% chance of being an asymptomatic carrier, and a 25% chance of being unaffected and not a carrier."
    explanation: >-
      The GeneReview confirms autosomal recessive inheritance as the primary mode
      for RPE65-related retinal degeneration and provides the expected offspring
      risk ratios.

genetic:
- name: RPE65 pathogenic variants
  gene_term:
    preferred_term: RPE65
    term:
      id: hgnc:10294
      label: RPE65
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    Biallelic (compound heterozygous or homozygous) loss-of-function variants cause
    the recessive LCA2/EOSRD/juvenile RP spectrum. Missense variants that reduce but
    do not abolish RPE65 enzymatic activity tend to produce milder EOSRD or juvenile
    RP, while severe truncating variants in both alleles produce the LCA2 phenotype.
    Rare heterozygous dominant-acting variants cause the milder RP-like dominant form
    (MONDO:0100452).
  inheritance:
  - name: Autosomal recessive
    evidence:
    - reference: PMID:28712537
      reference_title: "Efficacy and safety of voretigene neparvovec (AAV2-hRPE65v2) in patients with RPE65-mediated inherited retinal dystrophy: a randomised, controlled, open-label, phase 3 trial."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "individuals aged 3 years or older with, in each eye, best corrected visual acuity of 20/60 or worse, or visual field less than 20 degrees in any meridian, or both, with confirmed genetic diagnosis of biallelic RPE65 mutations"
      explanation: >-
        The pivotal trial required biallelic RPE65 mutations as an eligibility
        criterion, directly confirming that the approved gene therapy indication
        targets biallelic (autosomal recessive) RPE65-mediated disease.
  evidence:
  - reference: PMID:28712537
    reference_title: "Efficacy and safety of voretigene neparvovec (AAV2-hRPE65v2) in patients with RPE65-mediated inherited retinal dystrophy: a randomised, controlled, open-label, phase 3 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The RPE65 gene encodes all-trans retinyl ester isomerase, an enzyme crucial to the retinoid cycle."
    explanation: >-
      This paper directly identifies RPE65 as the causative gene encoding a
      critical retinoid cycle enzyme, confirming the gene-disease relationship.
  - reference: PMID:31725251
    reference_title: "Autosomal Recessive RPE65-Related Retinal Degeneration."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The diagnosis of autosomal recessive RPE65-related retinal degeneration is established in a proband with suggestive findings and biallelic pathogenic variants in RPE65 identified by molecular genetic testing."
    explanation: >-
      The GeneReview confirms RPE65 as the causative gene for the autosomal
      recessive form and establishes molecular genetic testing as the diagnostic
      standard.
treatments:
- name: Voretigene Neparvovec Gene Therapy
  therapeutic_modality: GENE_THERAPY
  description: >-
    Subretinal AAV2-mediated gene supplementation therapy delivering a codon-optimized
    human RPE65 cDNA under control of a hybrid promoter, administered bilaterally by
    subretinal injection. Indicated for biallelic RPE65 mutation-associated retinal
    dystrophy in patients aged 12 months or older with sufficient viable retina. FDA
    approved December 2017 (Luxturna, Spark Therapeutics) — the first FDA-approved
    gene therapy for an inherited disease. Perioperative oral prednisone is used to
    attenuate immune responses.
  treatment_term:
    preferred_term: subretinal AAV2 RPE65 gene supplementation
    term:
      id: NCIT:C15238
      label: Gene Therapy
  delivery_system:
    delivery_platform: VIRAL_VECTOR
    target_cell_types:
    - preferred_term: retinal pigment epithelial cell
      term:
        id: CL:0002586
        label: retinal pigment epithelial cell
    description: >-
      The carrier is a recombinant adeno-associated virus serotype 2 (AAV2)
      containing human RPE65 cDNA under a hybrid chicken beta-actin promoter with a
      cytomegalovirus enhancer, delivered by subretinal injection under general
      anaesthesia, one eye at a time. Route is the substance of the design rather
      than a detail: the target cell is the retinal pigment epithelial monolayer,
      not the photoreceptor, and subretinal placement is what puts the vector
      against that monolayer while keeping the dose local to the eye. No targeting
      ligand is present - tropism is the native AAV2 capsid's - so the targeting
      slots are left empty rather than asserting a receptor the formulation does
      not engage.
    evidence:
    - reference: PMID:28712537
      reference_title: "Efficacy and safety of voretigene neparvovec (AAV2-hRPE65v2) in patients with RPE65-mediated inherited retinal dystrophy: a randomised, controlled, open-label, phase 3 trial."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Voretigene neparvovec is an AAV2 vector containing human RPE65 cDNA with a modified Kozak sequence engineered at the translational start site, under control of a hybrid chicken β-actin promoter with a cytomegalovirus enhancer."
      explanation: >-
        The trial report specifies the vector itself, an AAV2 capsid carrying human
        RPE65 cDNA under a hybrid chicken beta-actin promoter with a CMV enhancer,
        which is the delivery platform recorded here as VIRAL_VECTOR.
    - reference: PMID:28712537
      reference_title: "Efficacy and safety of voretigene neparvovec (AAV2-hRPE65v2) in patients with RPE65-mediated inherited retinal dystrophy: a randomised, controlled, open-label, phase 3 trial."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Here, we report the design, conduct, and safety and efficacy results of a phase 3 study of sequential, bilateral, subretinal administration of voretigene neparvovec in participants with RPE65-mediated inherited retinal dystrophy."
      explanation: >-
        The same report states the route and sequence of administration: sequential,
        bilateral, subretinal delivery. Subretinal placement is what brings the
        vector into contact with the retinal pigment epithelium recorded as the
        target cell type.
  evidence:
  - reference: PMID:28712537
    reference_title: "Efficacy and safety of voretigene neparvovec (AAV2-hRPE65v2) in patients with RPE65-mediated inherited retinal dystrophy: a randomised, controlled, open-label, phase 3 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Voretigene neparvovec gene replacement improved functional vision in RPE65-mediated inherited retinal dystrophy previously medically untreatable."
    explanation: >-
      The phase 3 randomised controlled trial demonstrated that voretigene
      neparvovec significantly improved functional vision (multi-luminance
      mobility testing) and full-field light sensitivity in patients with
      RPE65-mediated retinal dystrophy, forming the basis of FDA approval.
  - reference: PMID:28712537
    reference_title: "Efficacy and safety of voretigene neparvovec (AAV2-hRPE65v2) in patients with RPE65-mediated inherited retinal dystrophy: a randomised, controlled, open-label, phase 3 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "13 (65%) of 20 intervention participants, but no control participants, passed MLMT at the lowest luminance level tested (1 lux), demonstrating maximum possible improvement"
    explanation: >-
      The primary efficacy endpoint showed that 65% of voretigene-treated participants
      achieved maximum possible improvement on the multi-luminance mobility test
      (passing at 1 lux), while no control participants did, demonstrating the
      clinical magnitude of gene therapy benefit.
  - reference: PMID:31725251
    reference_title: "Autosomal Recessive RPE65-Related Retinal Degeneration."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Subretinal gene supplementation therapy for individuals between ages 12 months and 65 years with retinal degeneration known to be associated with biallelic RPE65 pathogenic variants."
    explanation: >-
      The GeneReview confirms the approved gene therapy indication and age range,
      consistent with the subretinal delivery approach established in the
      phase 3 trial.
  - reference: DOI:10.1159/000526317
    reference_title: "Gene Therapy for Inherited Retinal Disease: Long-Term Durability of Effect"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "sustained results for up to 7.5 years for the full-field light sensitivity threshold test and 5 years for the multi-luminance mobility test in the Phase I and Phase III trials, respectively"
    explanation: >-
      This systematic review of voretigene neparvovec long-term outcomes documents
      sustained functional improvements for up to 7.5 years (FST) and 5 years
      (MLMT) across Phase I and Phase III clinical trials, confirming durable efficacy.
  - reference: DOI:10.3390/biom14010122
    reference_title: "Real-World Safety and Effectiveness of Voretigene Neparvovec: Results up to 2 Years from the Prospective, Registry-Based PERCEIVE Study"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thirty-five patients (34%) experienced ocular treatment-emergent adverse events (TEAEs), most frequently related to chorioretinal atrophy"
    explanation: >-
      The prospective PERCEIVE real-world registry (n=103 patients) documents the
      real-world safety profile of voretigene neparvovec; chorioretinal atrophy is
      the most frequent ocular adverse event, occurring in 12.6% of patients, which
      is important for post-treatment monitoring.
  - reference: PMID:28712537
    reference_title: "Efficacy and safety of voretigene neparvovec (AAV2-hRPE65v2) in patients with RPE65-mediated inherited retinal dystrophy: a randomised, controlled, open-label, phase 3 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Improvements in both navigational abilities and light sensitivity were evident within the first 30 days after subretinal delivery and remained stable for 1 year, as they have for at least 3 years in the participants of the phase 1 follow-on trial."
    explanation: >-
      This states the limit of what the randomised comparison established. The
      controlled endpoint was change at 1 year; stability beyond that point is
      carried by the uncontrolled phase 1 follow-on cohort, not by the randomised
      trial. Durability claims longer than a year in this entry therefore rest on
      extension and registry data rather than on the pivotal trial.
  - reference: PMID:28712537
    reference_title: "Efficacy and safety of voretigene neparvovec (AAV2-hRPE65v2) in patients with RPE65-mediated inherited retinal dystrophy: a randomised, controlled, open-label, phase 3 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Other RPE65 gene therapy trials, which were administered to only one eye per individual using different gene constructs, vector formulations, or surgical approaches, have shown improvements in retinal function but variable durability of effect."
    explanation: >-
      The trial report's own introduction records that earlier RPE65 gene therapy
      trials, using different constructs and surgical approaches, showed improved
      retinal function but variable durability of effect. This is the caveat the
      pivotal trial was not designed to resolve, and it is quoted from that paper's
      background rather than from its results.
  - reference: PMID:28689169
    reference_title: "Leber congenital amaurosis/early-onset severe retinal dystrophy: clinical features, molecular genetics and therapeutic interventions."
    supports: REFUTE
    directness: INDIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "most studies at later intervals have shown a lack of durability of the improvements, with continuing retinal degeneration even in patients with improved retinal function."
    explanation: >-
      Recorded as a REFUTE against any reading of this treatment as arresting the
      degeneration. Reviewing the four phase 1 RPE65 gene therapy trials, this paper
      reports that most later follow-up showed a lack of durability of the functional
      improvements, with retinal degeneration continuing even in eyes whose retinal
      function had improved. Gene supplementation restores chromophore regeneration;
      on this evidence it does not demonstrably stop the photoreceptor loss, which is
      why treating while photoreceptors remain is the operative clinical point.
      Graded INDIRECT because the cohorts quoted are the phase 1 trials rather than
      the approved product's own programme.
  - reference: DOI:10.1038/s41433-024-03065-6
    reference_title: "Voretigene neparvovec for inherited retinal dystrophy due to RPE65 mutations: a scoping review of eligibility and treatment challenges from clinical trials to real practice"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "paediatric patients retain more viable cells, present a less severe disease stage and show the highest potential for improvements, making them the most suitable candidates for treatment"
    explanation: >-
      This scoping review of real-world eligibility for voretigene neparvovec
      identifies pediatric patients as optimal candidates due to greater photoreceptor
      viability, supporting early evaluation and intervention in children with
      confirmed biallelic RPE65 mutations.
  - reference: PMID:42425207
    reference_title: "Post-approval outcomes of voretigene neparvovec (Luxturna®) retinal gene therapy: A systematic review and meta-analysis"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    explanation: >-
      A 2026 systematic review and meta-analysis of post-approval voretigene
      neparvovec outcomes, reporting pooled improvement in full-field stimulus
      threshold and visual acuity and, separately, pooled proportions for
      chorioretinal atrophy - a complication not seen in the pivotal trials. No
      snippet is recorded: neither the PubMed record nor the publisher DOI returns
      a retrievable abstract body through the reference cache, so the figures
      cannot be exact-quote verified here and are deliberately not restated as
      verified numbers. The chorioretinal atrophy signal is separately carried by
      the PERCEIVE registry item above, which does verify. Cited for the existence
      and direction of the post-approval synthesis only.

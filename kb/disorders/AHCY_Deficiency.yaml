differential_diagnoses:
- name: Other inherited methylation disorders
  description: >-
    The differential diagnosis of isolated hypermethioninemia includes MAT I/III
    (MAT1A) deficiency, GNMT deficiency, AHCY deficiency, and adenosine kinase
    deficiency. CBS deficiency usually adds marked hyperhomocysteinemia.
    Sibling methionine-cycle disorders stay separate Disease entries.
  distinguishing_features:
  - Markedly elevated plasma AdoHcy with elevated AdoMet favors AHCY deficiency.
  - MAT I/III deficiency typically has high methionine with low or inappropriately normal AdoMet.
  - CBS deficiency produces homocystinuria with elevated total homocysteine.
  - ADK deficiency combines hypermethioninemia with adenosine-salvage disruption and is a neighboring, not identical, enzyme block.
  evidence:
  - reference: PMID:27671891
    reference_title: Consensus recommendations for the diagnosis, treatment and follow-up of inherited methylation disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These are methionine adenosyltransferase I/III, glycine
      N-methyltransferase, S-adenosylhomocysteine hydrolase and adenosine
      kinase deficiencies.
    explanation: Consensus list of the inherited methylation disorders in the isolated-hypermethioninemia differential.
prevalence:
- population: Reported cases in the literature
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Ultra-rare; Pinto et al. 2024 discuss a very small published case series
    (on the order of the low teens by 2024) and likely underdiagnosis of the
    mild p.Arg49His presentation. That exact case count is in the article body
    rather than the abstract, so it is recorded here rather than as a
    snippet-backed rate. Orphanet maps this entity as ORPHA:88618; the local
    Orphadata bulk XML was not present in this worktree, so no ORPHA cache row
    is cited.
  evidence:
  - reference: PMID:26974671
    reference_title: Abnormal Hypermethylation at Imprinting Control Regions in Patients with S-Adenosylhomocysteine Hydrolase (AHCY) Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      S-adenosylhomocysteine hydrolase (AHCY) deficiency is a rare autosomal
      recessive disorder in methionine metabolism caused by mutations in the
      AHCY gene.
    explanation: Published literature characterises the disorder as rare.
  - reference: PMID:33869213
    reference_title: Functional and Pathological Roles of AHCY.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In humans, AHCY deficiency is associated with an incurable rare recessive
      disorder in methionine metabolism.
    explanation: Review restates that human AHCY deficiency is a rare recessive inborn error.
treatments:
- name: Methionine-restricted diet
  description: >-
    Dietary methionine restriction, often with methionine-free amino-acid
    formula, is the principal disease-directed intervention. It can lower
    plasma methionine and has improved myelination in some patients, but does
    not reliably normalise AdoHcy or AdoMet. No approved AHCY enzyme
    replacement exists.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: dietary intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  target_mechanisms:
  - target: Elevated AdoMet and Methionine
    treatment_effect: MODULATES
    description: >-
      Reducing methionine intake is intended to lower accumulated
      methionine-cycle intermediates.
    evidence:
    - reference: PMID:39512434
      reference_title: Asymptomatic pediatric presentation of S-adenosylhomocysteine hydrolase deficiency.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Dietary methionine restriction decreased plasma methionine but not
        plasma S-adenosylhomocysteine and S-adenosylmethionine.
      explanation: >-
        Diet lowered methionine without correcting the primary AdoHcy/AdoMet
        accumulation, so the effect is modelled as modulation rather than
        correction.
  evidence:
  - reference: PMID:16435181
    reference_title: "S-Adenosylhomocysteine hydrolase deficiency: a second patient, the younger brother of the index patient, and outcomes during therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The disease seems to be at least to some extent treatable, as shown by
      improved myelination and psychomotor development during dietary
      methionine restriction and supplementation with creatine and
      phosphatidylcholine.
    explanation: Early sibling follow-up reported improved myelination and development on methionine restriction plus supplements.
  - reference: PMID:27671891
    reference_title: Consensus recommendations for the diagnosis, treatment and follow-up of inherited methylation disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There is some evidence that this diet may also be beneficial in patients
      with S-adenosylhomocysteine hydrolase and adenosine kinase deficiencies.
    explanation: Consensus recommendations support a low-methionine diet in AHCY deficiency, with limited evidence.
  - reference: PMID:20852937
    reference_title: "S-adenosylhomocysteine hydrolase deficiency: two siblings with fetal hydrops and fatal outcomes."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      treatment by means of dietary methionine restriction and supplementation
      with phosphatidylcholine and creatine did not prevent her death at age
      122 days.
    explanation: Severe perinatal disease was not rescued by diet plus supplements, so the intervention is not uniformly effective.
- name: Creatine and phosphatidylcholine supplementation
  description: >-
    Creatine and phosphatidylcholine have been used as adjuncts to bypass
    high-demand AdoMet-dependent biosynthetic pathways. Evidence is
    uncontrolled case reports; they are not enzyme-replacement therapy.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: creatine
      term:
        id: CHEBI:16919
        label: creatine
    - preferred_term: phosphatidylcholine
      term:
        id: CHEBI:64482
        label: phosphatidylcholine
  target_mechanisms:
  - target: Impaired Transmethylation
    treatment_effect: MODULATES
    description: >-
      Exogenous creatine and phosphatidylcholine are intended to bypass
      methylation-dependent biosynthetic demand.
    evidence:
    - reference: PMID:16435181
      reference_title: "S-Adenosylhomocysteine hydrolase deficiency: a second patient, the younger brother of the index patient, and outcomes during therapy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The disease seems to be at least to some extent treatable, as shown by
        improved myelination and psychomotor development during dietary
        methionine restriction and supplementation with creatine and
        phosphatidylcholine.
      explanation: Adjunctive creatine and phosphatidylcholine were part of the regimen associated with clinical improvement.
  evidence:
  - reference: PMID:16435181
    reference_title: "S-Adenosylhomocysteine hydrolase deficiency: a second patient, the younger brother of the index patient, and outcomes during therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The disease seems to be at least to some extent treatable, as shown by
      improved myelination and psychomotor development during dietary
      methionine restriction and supplementation with creatine and
      phosphatidylcholine.
    explanation: Documents creatine and phosphatidylcholine as used adjuncts in the original treated siblings.
- name: Liver transplantation
  description: >-
    The only reported intervention that normalized methionine-cycle metabolites
    in a diet-refractory child. A 40-month-old underwent liver transplantation
    after dietary therapy failed; metabolic parameters were restored and
    psychomotor and cognitive deficits reversed at 6 months (Strauss et al.
    2015, cited in PMID:33869213). High-risk, non-randomized, single case;
    indications in mild disease are unresolved, and extrahepatic muscle disease
    may not be corrected because the graft replaces a major but not exclusive
    source of systemic AHCY activity. Not a standard first-line therapy.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Liver Transplantation
    term:
      id: NCIT:C15271
      label: Liver Transplantation
  target_mechanisms:
  - target: AHCY Loss of Function
    treatment_effect: RESTORES
    description: >-
      Allograft hepatocytes supply AHCY activity and can clear circulating
      AdoHcy/AdoMet/methionine; extrahepatic residual enzyme deficiency is
      not replaced.
    evidence:
    - reference: PMID:33869213
      reference_title: Functional and Pathological Roles of AHCY.
      supports: PARTIAL
      evidence_source: OTHER
      snippet: >-
        For one 40-month-old child for whom dietary therapy was ineffective, liver transplantation restored metabolic parameters and reversed psychomotor and cognitive deficits after 6 months
      explanation: >-
        Single diet-refractory case in which transplantation restored
        metabolites and neurodevelopment; PARTIAL because it is n=1 and
        extrahepatic disease may persist.
  evidence:
  - reference: PMID:33869213
    reference_title: Functional and Pathological Roles of AHCY.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      For one 40-month-old child for whom dietary therapy was ineffective, liver transplantation restored metabolic parameters and reversed psychomotor and cognitive deficits after 6 months
    explanation: >-
      Reviews the Strauss 2015 transplant case as the only reported
      metabolic normalization after failed diet.

differential_diagnoses:
- name: Other inherited methylation disorders
  description: >-
    The differential diagnosis of isolated hypermethioninemia includes MAT I/III (MAT1A) deficiency, GNMT
    deficiency, AHCY deficiency, and adenosine kinase deficiency. CBS deficiency usually adds marked hyperhomocysteinemia.
    Sibling methionine-cycle disorders stay separate Disease entries.
  distinguishing_features:
  - Markedly elevated plasma AdoHcy with elevated AdoMet favors AHCY deficiency.
  - MAT I/III deficiency typically has high methionine with low or inappropriately normal AdoMet.
  - CBS deficiency produces homocystinuria with elevated total homocysteine.
  - ADK deficiency combines hypermethioninemia with adenosine-salvage disruption and is a neighboring, not identical, enzyme block.
  evidence:
  - reference: PMID:27671891
    reference_title: Consensus recommendations for the diagnosis, treatment and follow-up of inherited methylation disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These are methionine adenosyltransferase I/III, glycine N-methyltransferase, S-adenosylhomocysteine
      hydrolase and adenosine kinase deficiencies.
    explanation: >-
      Consensus list of the inherited methylation disorders in the isolated-hypermethioninemia differential.
    quote_role: BACKGROUND
    directness: DIRECT
prevalence:
- population: Reported cases in the literature
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    The literature consists of a small, overlapping collection of case reports and families. The 2024
    report counted 16 previously reported patients; this is a historical literature count, not a population
    prevalence estimate. Mild cases may be missed. Population prevalence and reliable phenotype frequencies
    are unknown.

    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: >-
      During 6 postoperative months, head growth accelerated 4-fold and the patient made promising gains
      in gross motor, language, and social skills.
    explanation: >-
      Promising short-term developmental gains are not evidence of complete reversal of disability.
- name: Multisystem surveillance
  description: >-
    Consensus-based follow-up assesses development, muscle function, nutrition, liver synthetic function
    and coagulation. Serial amino acids, SAM, SAH, CK, liver tests and coagulation studies guide care.
    Liver imaging and alpha-fetoprotein are suggested given the reported adult HCC, without a quantified
    disease-specific cancer risk or proven surveillance benefit.
  therapeutic_modality: OTHER
  evidence:
  - reference: PMID:27671891
    reference_title: Consensus recommendations for the diagnosis, treatment and follow-up of inherited methylation disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    directness: DIRECT
    snippet: >-
      The following tests are indicated: protein status, amino acids, AdoMet, AdoHcy, liver function tests,
      CK, alpha-fetoprotein, coagulation tests, liver imaging, while others depend on the clinical situation.
    explanation: >-
      Consensus recommendation based on sparse clinical experience; follow-up intervals depend on age
      and course.

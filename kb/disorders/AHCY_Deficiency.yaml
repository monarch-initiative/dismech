    explanation: Frames the disease as a methylation defect caused by methionine-cycle disruption.
  downstream:
  - target: Impaired Transmethylation
    causal_link_type: DIRECT
    description: >-
      Reduced methyltransferase activity impairs methylation-dependent
      macromolecular modification, including creatine and phosphatidylcholine
      synthesis.
  - target: Elevated AdoMet and Methionine
    causal_link_type: DIRECT
    description: >-
      Unused AdoMet and upstream methionine accumulate when transmethylation
      flux is blocked.
- name: Impaired Transmethylation
  biological_scale: CELLULAR
  description: >-
    Disturbed transmethylation contributes to myopathy and white-matter disease.
    Plasma guanidinoacetate elevation with low phosphatidylcholine in the index
    case is consistent with impaired creatine and phospholipid methylation.
    Genome-wide DNA hypermethylation is reported in some patients and is not a
    constant feature.
  biological_processes:
  - preferred_term: methylation
    term:
      id: GO:0032259
      label: methylation
    modifier: DECREASED
  - preferred_term: creatine biosynthetic process
    term:
      id: GO:0006601
      label: creatine biosynthetic process
    modifier: DECREASED
  evidence:
  - reference: PMID:15024124
    reference_title: "S-adenosylhomocysteine hydrolase deficiency in a human: a genetic disorder of methionine metabolism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Additional pretreatment abnormalities in plasma included low
      concentrations of phosphatidylcholine and choline, with elevations of
      guanidinoacetate, betaine, dimethylglycine, and cystathionine.
    explanation: >-
      Low phosphatidylcholine with elevated guanidinoacetate is the expected
      pattern when AdoMet-dependent creatine and phospholipid methylation are
      impaired.
  - reference: PMID:26974671
    reference_title: Abnormal Hypermethylation at Imprinting Control Regions in Patients with S-Adenosylhomocysteine Hydrolase (AHCY) Deficiency.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We conclude that DNA hypermethylation seems to be a frequent but not a
      constant feature associated with AHCY deficiency that affects different
      genomic regions to different degrees.
    explanation: >-
      DNA methylation changes occur in some patients but are not uniform, so
      they are not treated as the sole cellular readout of impaired
      transmethylation.
  downstream:
  - target: Hepatopathy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Impaired hepatocellular transmethylation is associated with liver
      dysfunction, but the intervening cellular steps are not fully resolved.
  - target: Myopathy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Muscle creatine depletion and impaired methylation are associated with
      hypotonia and myopathy.
  - target: Neurodevelopmental and White-Matter Disease
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Impaired transmethylation in the developing nervous system is associated
      with developmental delay and white-matter abnormality.

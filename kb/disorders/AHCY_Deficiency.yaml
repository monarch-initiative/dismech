progression:
- phase: Severe prenatal or infantile disease
  notes: >-
    Fetal hydrops, hypotonia, respiratory failure and developmental impairment can begin before or shortly
    after birth. Early death is reported despite combined dietary treatment; a normal methionine newborn
    screen does not exclude disease.
  evidence:
  - reference: PMID:20852937
    reference_title: 'S-adenosylhomocysteine hydrolase deficiency: two siblings with fetal hydrops and fatal outcomes.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: >-
      treatment by means of dietary methionine restriction and supplementation with phosphatidylcholine
      and creatine did not prevent her death at age 122 days.
    explanation: One severely affected sibling died despite treatment.
- phase: Mild childhood presentation with possible later complications
  notes: >-
    Some homozygous p.Arg49His children have biochemical liver and muscle abnormalities with little clinical
    impairment. One confirmed adult developed weakness in her mid-twenties and HCC at 29. These cases
    establish variability, not a predictable progression or genotype-specific risk rate.
  evidence:
  - reference: PMID:26527160
    reference_title: Adult-onset liver disease and hepatocellular carcinoma in S-adenosylhomocysteine hydrolase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: >-
      She developed muscle weakness in her mid-20s, and was diagnosed with hepatocellular carcinoma at
      age 29.
    explanation: An adult case demonstrates possible later morbidity.
discussions:
- evidence:
  - reference: PMID:26974671
    reference_title: Abnormal Hypermethylation at Imprinting Control Regions in Patients with S-Adenosylhomocysteine Hydrolase (AHCY) Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: This study was performed on DNA extracted from peripheral blood samples.
    explanation: >-
      The tissue restriction prevents direct extrapolation to affected muscle or brain.
  discussion_id: ahcy_tissue_methylation
  prompt: How do tissue-specific methylation changes produce organ disease?
  notes: >-
    Clinical DNA methylation measurements are restricted to blood and vary between patients and loci.
    The 2016 study did not perform the DNMT1 or myelin-protein methyltransferase activity experiments
    quoted in its discussion; those are earlier studies. No direct methylation-to-neurological-phenotype
    mechanism is established. Zebrafish hypomethylation and the worm SAM decrease further demonstrate
    model and tissue differences.
- evidence:
  - reference: PMID:39634240
    reference_title: Dysmorphic Findings in SAHH Deficiency with a Novel Variant in the AHCY Gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: >-
      S-adenosylhomocysteine (AdoHcy), and S-adenosylmethionine (AdoMet) could not be performed.
    explanation: Biochemical confirmation was unavailable in this dual-diagnosis case.
  - reference: PMID:39634240
    reference_title: Dysmorphic Findings in SAHH Deficiency with a Novel Variant in the AHCY Gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: >-
      We thought that cataract finding in our patient was explained by the genetic variant in the PITX3
      gene.
    explanation: The authors attribute cataract to the second molecular diagnosis.
  - reference: PMID:39634240
    reference_title: Dysmorphic Findings in SAHH Deficiency with a Novel Variant in the AHCY Gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: >-
      However, prematurity and neonatal problems may have contributed to neurodevelopmental problems.
    explanation: The source itself identifies additional developmental confounding.
  discussion_id: ahcy_dual_diagnosis
  prompt: Which findings in the dual AHCY/PITX3 case are attributable to AHCY?
  notes: >-
    The 2024 dysmorphic case carried homozygous AHCY p.Gly348Val and heterozygous PITX3 p.Tyr144Cys, both
    classified by the authors as likely pathogenic. SAM, SAH and enzyme activity were not available. Cataracts
    were attributed to PITX3; prematurity and neonatal illness also complicate neurodevelopmental attribution.
    The described facial and limb findings are case observations without an established AHCY-specific
    gestalt. The report advises diet and supplements but documents nonadherence, not treatment efficacy.
    Its assertion of HCC risk in heterozygous carriers is not established by the cited single-family primary
    report.
notes: >-
  Reviewed against the matching deep-research report and generated primary full text. Historical case
  counts differ between reviews because ascertainment and overlapping reports differ; no population phenotype
  frequencies are inferred. The later 2024 dysmorphic report counted 19 prior cases, whereas the earlier
  2024 report counted 16. GeneReviews and StatPearls had no disease-specific chapter in the checked repository
  index. Molecular links to tissue disease remain explicitly indirect when the intervening mechanisms
  have not been demonstrated.

  evidence:
  - reference: PMID:15024124
    reference_title: "S-adenosylhomocysteine hydrolase deficiency in a human: a genetic disorder of methionine metabolism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Activity of AdoHcy hydrolase was approximately equal to 3% of control in
      liver and was 5-10% of the control values in red blood cells and cultured
      fibroblasts.
    explanation: >-
      The index patient demonstrates residual adenosylhomocysteinase activity
      far below control in liver and extrahepatic cells.
  - reference: PMID:19177456
    reference_title: "S-adenosylhomocysteine hydrolase (AHCY) deficiency: two novel mutations with lethal outcome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Functional analysis of recombinant proteins containing the mutations
      detected showed that both dramatically reduce AHCY activity.
    explanation: >-
      Recombinant mutant proteins from a lethal infantile case show that
      disease alleles reduce catalytic activity.
  - reference: PMID:33869213
    reference_title: Functional and Pathological Roles of AHCY.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In mammals, AHCY is the only enzyme capable of performing this reaction.
    explanation: >-
      Review of AHCY biochemistry states that mammals have no alternative
      enzyme for AdoHcy hydrolysis, so biallelic loss is not bypassed.
  - reference: PMID:33869213
    reference_title: Functional and Pathological Roles of AHCY.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Phenotypic analysis of a large knockout mouse line collection indicates that homozygous deletion of Ahcy is embryonic lethal before E9.5
    explanation: >-
      Complete Ahcy deletion is early-embryonic lethal in mouse, which is
      why reported patients carry residual-activity alleles rather than
      homozygous nulls.
  downstream:
  - target: AdoHcy Accumulation
    causal_link_type: DIRECT
    description: >-
      Loss of AHCY activity causes S-adenosylhomocysteine to accumulate because
      hydrolysis is the sole mammalian route for AdoHcy clearance.
    evidence:
    - reference: PMID:15024124
      reference_title: "S-adenosylhomocysteine hydrolase deficiency in a human: a genetic disorder of methionine metabolism."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In plasma, S-adenosylmethionine was 30-fold and AdoHcy 150-fold
        elevated.
      explanation: Direct plasma measurement of massive AdoHcy accumulation in the index case.
- name: AdoHcy Accumulation
  biological_scale: MOLECULAR
  description: >-
    S-adenosylhomocysteine accumulates when AHCY cannot hydrolyse it. AdoHcy is
    a potent product inhibitor of AdoMet-dependent methyltransferases.
  chemical_entities:
  - preferred_term: S-adenosyl-L-homocysteine
    term:
      id: CHEBI:16680
      label: S-adenosyl-L-homocysteine
    modifier: INCREASED
  biological_processes:
  - preferred_term: methionine cycle
    term:
      id: GO:0033353
      label: L-methionine cycle
    modifier: ABNORMAL
  evidence:
  - reference: PMID:16435181
    reference_title: "S-Adenosylhomocysteine hydrolase deficiency: a second patient, the younger brother of the index patient, and outcomes during therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The latter include, most importantly, markedly elevated plasma AdoHcy.
    explanation: Independent sibling case identifies plasma AdoHcy elevation as the defining biochemical lesion.
  - reference: PMID:26974671
    reference_title: Abnormal Hypermethylation at Imprinting Control Regions in Patients with S-Adenosylhomocysteine Hydrolase (AHCY) Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The prime function of AHCY is to hydrolyse and efficiently remove
      S-adenosylhomocysteine, the by-product of transmethylation reactions and
      one of the most potent methyltransferase inhibitors.
    explanation: States that AdoHcy is both the uncleared substrate and a potent methyltransferase inhibitor.
  downstream:
  - target: Methyltransferase Product Inhibition
    causal_link_type: DIRECT
    description: >-
      Elevated AdoHcy competitively inhibits AdoMet-dependent
      methyltransferases, lowering the AdoMet/AdoHcy methylation index.
    evidence:
    - reference: PMID:33869213
      reference_title: Functional and Pathological Roles of AHCY.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        AHCY catalyzes the reversible break of S-adenosylhomocysteine (SAH),
        the by-product and a potent inhibitor of methyltransferases activity.
      explanation: Reviews the product-inhibition relationship between SAH and methyltransferases.
- name: Methyltransferase Product Inhibition
  biological_scale: MOLECULAR
  description: >-
    Product inhibition of AdoMet-dependent methyltransferases impairs
    transmethylation of DNA, RNA, proteins, and small molecules, and secondarily
    elevates AdoMet and methionine.

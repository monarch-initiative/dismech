  publication: PMID:33869213
  description: >-
    Complete Ahcy deletion is embryonic lethal before E9.5 (and chromosomal
    microdeletions encompassing Ahcy are lethal at the blastula stage). The
    null does not model surviving human patients, who retain residual
    hydrolase activity.
  genes:
  - preferred_term: AHCY
    term:
      id: hgnc:343
      label: AHCY
  modeled_mechanisms:
  - target: AHCY Loss of Function
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      A true null is not viable past early embryogenesis, so it cannot
      recapitulate the human residual-activity disease.
    limitations: >-
      Embryonic lethality before E9.5 precludes organ-level hepatopathy,
      myopathy, or white-matter phenotypes. It supports why patients are
      hypomorphs, not a phenocopy of clinical AHCY deficiency.
    evidence:
    - reference: PMID:33869213
      reference_title: Functional and Pathological Roles of AHCY.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Phenotypic analysis of a large knockout mouse line collection indicates that homozygous deletion of Ahcy is embryonic lethal before E9.5
      explanation: >-
        Documents that complete Ahcy loss is early-embryonic lethal in mouse.

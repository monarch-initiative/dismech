treatments:
- name: Methionine-restricted diet
  description: >-
    Specialist-supervised methionine restriction with adequate protein, energy and other amino acids is
    the main dietary intervention. Some cases show developmental or MRI improvement, but biochemical and
    clinical responses vary and SAM/SAH, muscle injury and coagulation abnormalities can persist. Evidence
    is uncontrolled; excessive restriction can compromise nutrition.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: dietary intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  target_mechanisms:
  - target: Methionine Accumulation
    treatment_effect: MODULATES
    description: Restriction can lower plasma methionine while SAM and SAH remain elevated.
    evidence:
    - reference: PMID:39512434
      reference_title: Asymptomatic pediatric presentation of S-adenosylhomocysteine hydrolase deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Dietary methionine restriction decreased plasma methionine but not plasma S-adenosylhomocysteine
        and S-adenosylmethionine.
      explanation: >-
        Diet lowered methionine without correcting the primary AdoHcy/AdoMet accumulation, so the effect
        is modelled as modulation rather than correction.
      quote_role: PRIMARY_RESULT
      directness: DIRECT
  evidence:
  - reference: PMID:16435181
    reference_title: 'S-Adenosylhomocysteine hydrolase deficiency: a second patient, the younger brother of the index patient, and outcomes during therapy.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The disease seems to be at least to some extent treatable, as shown by improved myelination and
      psychomotor development during dietary methionine restriction and supplementation with creatine
      and phosphatidylcholine.
    explanation: >-
      Early sibling follow-up reported improved myelination and development on methionine restriction
      plus supplements.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:27671891
    reference_title: Consensus recommendations for the diagnosis, treatment and follow-up of inherited methylation disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There is some evidence that this diet may also be beneficial in patients with S-adenosylhomocysteine
      hydrolase and adenosine kinase deficiencies.
    explanation: >-
      Consensus recommendations support a low-methionine diet in AHCY deficiency, with limited evidence.
    quote_role: BACKGROUND
    directness: DIRECT
  - reference: PMID:20852937
    reference_title: 'S-adenosylhomocysteine hydrolase deficiency: two siblings with fetal hydrops and fatal outcomes.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      treatment by means of dietary methionine restriction and supplementation with phosphatidylcholine
      and creatine did not prevent her death at age 122 days.
    explanation: >-
      Severe perinatal disease was not rescued by diet plus supplements, so the intervention is not uniformly
      effective.
    quote_role: PRIMARY_RESULT
    directness: DIRECT

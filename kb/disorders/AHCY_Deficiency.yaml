genetic:
- name: AHCY
  gene_term:
    preferred_term: AHCY
    term:
      id: hgnc:343
      label: AHCY
  association: Pathogenic Variants
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Biallelic AHCY variants (missense, nonsense, stop-gain) cause the disease.
    Published disease-linked substitutions include p.Arg49Cys, p.Arg49His,
    p.Ala50Thr, p.Thr57Ile, p.Gly71Ser, p.Asp86Gly, p.Ala89Val, p.Glu108Lys,
    p.Trp112Ter (T112stop), p.Tyr143Cys, p.Val217Met, and p.Tyr328Asp.
    Index-case residual adenosylhomocysteinase activity was ~3% of control in
    liver and 5–10% in erythrocytes and fibroblasts (PMID:15024124); surviving
    patients are hypomorphs rather than complete nulls. Homozygous p.Arg49His
    (c.146G>A) is a recurrent mild/adult-presenting allele in Pakistani and
    other South Asian families. A published ~1/15,300 South Asian versus
    ~1/83,400 global carrier-frequency estimate for p.Arg49His sits in article
    body rather than a cached abstract, so it is not snippet-backed here.
    ClinGen Aminoacidopathy GCEP classifies the gene-disease relationship as
    Definitive (SOP11, 2024-12-13).
  evidence:
  - reference: CGGV:assertion_d9b3a56b-b188-44d1-9983-a059895c0ba1-2024-12-13T170000.000Z
    reference_title: "AHCY / hypermethioninemia with deficiency of S-adenosylhomocysteine hydrolase (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "AHCY | HGNC:343 | hypermethioninemia with deficiency of S-adenosylhomocysteine hydrolase | MONDO:0013404 | AR | Definitive"
    explanation: ClinGen classifies the AHCY–disease relationship as definitive with autosomal recessive inheritance.
  - reference: PMID:15024124
    reference_title: "S-adenosylhomocysteine hydrolase deficiency in a human: a genetic disorder of methionine metabolism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Gene analysis revealed two mutations in exon 4: a maternally derived stop
      codon, and a paternally derived missense mutation.
    explanation: Index case was compound heterozygous for a stop-gain and a missense AHCY allele.
  - reference: PMID:31957987
    reference_title: A Turkish patient with novel AHCY variants and presumed diagnosis of S-adenosylhomocysteine hydrolase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The disease occurs by pathogenic variants of AHCY gene encoding
      S-adenosylhomocysteine hydrolase (AHCY) enzyme.
    explanation: States that pathogenic AHCY variants cause the disease.
  - reference: PMID:19177456
    reference_title: "S-adenosylhomocysteine hydrolase (AHCY) deficiency: two novel mutations with lethal outcome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Our functional studies provide novel insight into the molecular defect
      underlying AHCY deficiency and reveal that both low enzyme activity and
      protein stability of AHCY contribute to the clinical phenotype.
    explanation: Functional work on disease alleles supports loss of activity and stability as the mechanism.
  - reference: PMID:33869213
    reference_title: Functional and Pathological Roles of AHCY.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Twelve of these variants are linked with a rare autosomal recessive disorder in the methionine metabolism of hypermethioninemia (R49C, R49H, A50T, T57I, G71S, D86G, A89V, E108K, T112stop, Y143C, V217M, and Y328D)
    explanation: >-
      Review enumerates the published AHCY missense/nonsense allele series
      linked to the human disease.
  - reference: PMID:39512434
    reference_title: Asymptomatic pediatric presentation of S-adenosylhomocysteine hydrolase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      S-adenosylhomocysteine hydrolase deficiency was confirmed with homozygous missense variant c.146G>A (p.Arg49His) in the AHCY gene, a genotype previously reported in Pakistani patients with mild presentation
    explanation: >-
      Documents p.Arg49His as a recurrent mild-presentation allele in
      Pakistani patients.
  - reference: PMID:26527160
    reference_title: Adult-onset liver disease and hepatocellular carcinoma in S-adenosylhomocysteine hydrolase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Exome sequencing revealed that she was homozygous for a missense mutation (R49H) in AHCY, the gene encoding S-adenosylhomocysteine (SAH) hydrolase.
    explanation: >-
      Adult-onset hepatic failure and HCC in a woman of Pakistani descent
      homozygous for p.Arg49His, the mild end of the allele series.

genetic:
- name: AHCY
  gene_term:
    preferred_term: AHCY
    term:
      id: hgnc:343
      label: AHCY
  association: Pathogenic Variants
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Biallelic AHCY missense or truncating variants cause the disease. The index genotype includes p.Trp112Ter
    and p.Tyr143Cys; the review shorthand T112stop is not a p.Thr112Ter allele. Recombinant p.Arg49Cys
    and p.Asp86Gly have condition-dependent functional defects. Homozygous p.Arg49His recurs in Pakistani
    families with mild childhood presentations, but one confirmed adult developed HCC; a uniformly benign
    outcome or measured residual activity for this allele is not established. The 2024 report cites allele
    frequencies of approximately 0.000065 in South Asia and 0.000012 globally, not carrier frequencies
    or disease prevalence. ClinGen classified the gene-disease association as Definitive in December 2024;
    the older Moderate wording remaining in its narrative was superseded by that reevaluation.
  evidence:
  - reference: CGGV:assertion_d9b3a56b-b188-44d1-9983-a059895c0ba1-2024-12-13T170000.000Z
    reference_title: AHCY / hypermethioninemia with deficiency of S-adenosylhomocysteine hydrolase (Definitive)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      AHCY | HGNC:343 | hypermethioninemia with deficiency of S-adenosylhomocysteine hydrolase | MONDO:0013404
      | AR | Definitive
    explanation: >-
      ClinGen classifies the AHCY–disease relationship as definitive with autosomal recessive inheritance.
    quote_role: BACKGROUND
    directness: DIRECT
  - reference: PMID:15024124
    reference_title: 'S-adenosylhomocysteine hydrolase deficiency in a human: a genetic disorder of methionine metabolism.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Gene analysis revealed two mutations in exon 4: a maternally derived stop codon, and a paternally
      derived missense mutation.
    explanation: Index case was compound heterozygous for a stop-gain and a missense AHCY allele.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:19177456
    reference_title: 'S-adenosylhomocysteine hydrolase (AHCY) deficiency: two novel mutations with lethal outcome.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Our functional studies provide novel insight into the molecular defect underlying AHCY deficiency
      and reveal that both low enzyme activity and protein stability of AHCY contribute to the clinical
      phenotype.
    explanation: >-
      Functional work on disease alleles supports loss of activity and stability as the mechanism.
    quote_role: PRIMARY_RESULT

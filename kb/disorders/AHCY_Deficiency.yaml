    term:
      id: CHEBI:16680
      label: S-adenosyl-L-homocysteine
    modifier: INCREASED
  downstream:
  - target: Methyltransferase Product Inhibition
    causal_link_type: DIRECT
    description: >-
      SAH binds methyltransferase SAM-binding sites and inhibits susceptible enzymes; the degree varies
      with enzyme and substrate conditions.
    evidence:
    - reference: PMID:33869213
      reference_title: Functional and Pathological Roles of AHCY.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: BACKGROUND
      directness: DIRECT
      snippet: >-
        SAH is structurally similar to SAM and binds with a similar range of affinity to the SAM-binding
        pocket of MTases, thereby inhibiting their activity in a negative feedback loop
      explanation: >-
        The review summarizes product inhibition; sensitivities vary between methyltransferases and cellular
        contexts.
- name: Methyltransferase Product Inhibition
  biological_scale: MOLECULAR
  description: >-
    Accumulated SAH can inhibit SAM-dependent methyltransferases. Susceptibility differs by enzyme and
    cellular context; the SAM:SAH ratio is an index of methylation potential rather than a measurement
    of every methylation reaction.
  evidence:

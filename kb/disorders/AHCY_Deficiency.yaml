    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:39512434
    reference_title: Asymptomatic pediatric presentation of S-adenosylhomocysteine hydrolase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      S-adenosylhomocysteine hydrolase deficiency is an autosomal recessive
      inborn error of metabolism affecting methylation by disrupting the
      methionine cycle.
    explanation: >-
      The 2024 case report states autosomal recessive inheritance of AHCY
      deficiency.
  - reference: PMID:31957987
    reference_title: A Turkish patient with novel AHCY variants and presumed diagnosis of S-adenosylhomocysteine hydrolase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      S-adenosylhomocysteine hydrolase deficiency is an autosomal recessive
      neurometabolic disorder affecting the muscles, liver, and nervous system.
    explanation: Independent case report restates autosomal recessive inheritance.
pathophysiology:
- name: AHCY Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic pathogenic AHCY variants reduce adenosylhomocysteinase activity,
    blocking the only mammalian route for hydrolysis of S-adenosylhomocysteine
    to adenosine and homocysteine. Residual activity in reported patients is
    typically a few percent of control rather than a complete null.
  genes:
  - preferred_term: AHCY
    term:
      id: hgnc:343
      label: AHCY
  genetic_context:
    functional_impact_category: LOSS_OF_FUNCTION
    variant_origin: GERMLINE
    description: >-
      Reported genotypes are biallelic germline loss-of-function or severe
      hypomorphic alleles (homozygous or compound heterozygous missense,
      nonsense, or stop-gain). Complete AHCY deletion is embryonic lethal in
      several organisms, so surviving patients retain residual activity.

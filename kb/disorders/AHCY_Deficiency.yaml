name: S-Adenosylhomocysteine Hydrolase Deficiency
creation_date: "2026-08-20T02:56:36Z"
category: Mendelian
description: >-
  S-adenosylhomocysteine hydrolase (AHCY) deficiency is a rare autosomal
  recessive inborn error of the methionine cycle caused by biallelic loss of
  AHCY. Failure to hydrolyse S-adenosylhomocysteine (AdoHcy) produces AdoHcy
  accumulation, product inhibition of AdoMet-dependent methyltransferases,
  elevated S-adenosylmethionine and methionine, and impaired transmethylation.
  The resulting phenotype is developmental delay, hypotonia and myopathy,
  hepatocellular dysfunction, and white-matter abnormality, ranging from lethal
  perinatal disease to a mild or asymptomatic childhood course. Classic disease
  is developmental, hepatic, and myopathic rather than an intoxication-type
  metabolic crisis.

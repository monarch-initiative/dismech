      directness: INDIRECT
      snippet: In plasma, S-adenosylmethionine was 30-fold and AdoHcy 150-fold elevated.
      explanation: The index patient had markedly elevated plasma SAH and SAM.
  - target: Impaired Phosphatidylcholine Synthesis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Inhibition of the relevant methylation reaction is inferred from metabolite patterns, without a
      direct patient enzyme assay.
    evidence:

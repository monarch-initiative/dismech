- name: Liver transplantation
  description: >-
    One severely affected child underwent living-donor liver transplantation at 40 months. Over six months
    on an unrestricted diet, methionine and SAM normalized, SAH fell substantially, coagulation improved
    and developmental gains occurred. The SAM:SAH ratio remained below the control mean. This abstract-supported
    single case does not demonstrate complete neurological reversal, extrahepatic cure or established
    indications for mildly affected patients.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Liver Transplantation
    term:
      id: NCIT:C15271
      label: Liver Transplantation
  target_mechanisms:
  - target: AdoHcy Accumulation
    treatment_effect: MODULATES
    description: >-
      A liver graft substantially reduced circulating SAH in one child; extrahepatic AHCY deficiency is
      not replaced.
    evidence:
    - reference: PMID:26095522
      reference_title: Liver transplantation for treatment of severe S-adenosylhomocysteine hydrolase deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: Mean AdoHcy decreased 96% and the AdoMet:AdoHcy concentration ratio improved from 0.52±0.19 to 1.48±0.79 mol:mol (control 4.10±2.11 mol:mol).
      explanation: A substantial SAH reduction was reported in one transplanted child.
  evidence:
  - reference: PMID:26095522
    reference_title: Liver transplantation for treatment of severe S-adenosylhomocysteine hydrolase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: >-
      Blood methionine and AdoMet were normal and stable during 6 months of follow-up on an unrestricted
      diet.
    explanation: >-
      Single-case biochemical follow-up after transplantation; SAH fell 96%, but the ratio did not reach
      the control mean.
  - reference: PMID:26095522

name: S-Adenosylhomocysteine Hydrolase Deficiency
creation_date: '2026-08-20T02:56:36Z'
category: Mendelian
description: >-
  S-adenosylhomocysteine hydrolase (AHCY) deficiency is an autosomal recessive disorder of the methionine
  cycle caused by biallelic AHCY variants. Reduced hydrolase activity produces marked S-adenosylhomocysteine
  (SAH) accumulation, usually accompanied by elevated S-adenosylmethionine (SAM) and methionine. SAH inhibits
  multiple methyltransferases, but the tissue-specific routes to muscle, liver and nervous-system injury
  remain incompletely resolved. Blood DNA hypermethylation in subsets of patients cautions against assuming
  uniform DNA hypomethylation. The spectrum ranges from lethal perinatal disease to childhood biochemical
  abnormalities with little clinical impairment and adult-onset complications.

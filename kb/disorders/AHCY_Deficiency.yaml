inheritance:
- name: Autosomal recessive inheritance
  description: >-
    Biallelic germline AHCY variants cause the disorder; heterozygous parents are typically unaffected.
  inheritance_term:
    preferred_term: autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:39512434
    reference_title: Asymptomatic pediatric presentation of S-adenosylhomocysteine hydrolase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      S-adenosylhomocysteine hydrolase deficiency is an autosomal recessive inborn error of metabolism
      affecting methylation by disrupting the methionine cycle.
    explanation: The 2024 case report states autosomal recessive inheritance of AHCY deficiency.
    quote_role: BACKGROUND
    directness: DIRECT
  - reference: PMID:31957987
    reference_title: A Turkish patient with novel AHCY variants and presumed diagnosis of S-adenosylhomocysteine hydrolase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      S-adenosylhomocysteine hydrolase deficiency is an autosomal recessive neurometabolic disorder affecting
      the muscles, liver, and nervous system.
    explanation: Independent case report restates autosomal recessive inheritance.
    quote_role: BACKGROUND
    directness: DIRECT
pathophysiology:
- name: AHCY Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic AHCY variants reduce adenosylhomocysteinase activity. Residual activity is demonstrated
    in tested patient tissues and recombinant alleles, but has not been measured for every genotype. Individual
    substitutions can affect activity, stability or cofactor state in assay-dependent ways.
  evidence:
  - reference: PMID:15024124
    reference_title: 'S-adenosylhomocysteine hydrolase deficiency in a human: a genetic disorder of methionine metabolism.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Activity of AdoHcy hydrolase was approximately equal to 3% of control in liver and was 5-10% of
      the control values in red blood cells and cultured fibroblasts.
    explanation: >-
      The index patient demonstrates residual adenosylhomocysteinase activity far below control in liver
      and extrahepatic cells.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:19177456
    reference_title: 'S-adenosylhomocysteine hydrolase (AHCY) deficiency: two novel mutations with lethal outcome.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: >-
      Functional analysis of recombinant proteins containing the mutations detected showed that both dramatically
      reduce AHCY activity.
    explanation: >-
      The p.Arg49Cys and p.Asp86Gly proteins had reduced activity in recombinant assays.

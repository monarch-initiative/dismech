- name: AdoHcy Accumulation
  biological_scale: MOLECULAR
  description: >-
    SAH accumulates when its AHCY-mediated hydrolysis is impaired. Marked plasma elevation is a characteristic
    diagnostic observation; plasma levels do not directly quantify each tissue compartment.
  evidence:
  - reference: PMID:15024124
    reference_title: 'S-adenosylhomocysteine hydrolase deficiency in a human: a genetic disorder of methionine metabolism.'

  preferred_term: hypermethioninemia with deficiency of S-adenosylhomocysteine hydrolase
  term:
    id: MONDO:0013404
    label: hypermethioninemia with deficiency of S-adenosylhomocysteine hydrolase
parents:
- Inborn error of metabolism
- Disorder of methionine catabolism
synonyms:
- AHCY deficiency
- SAHH deficiency
- SAH hydrolase deficiency
- adenosylhomocysteinase deficiency
- hypermethioninemia due to S-adenosylhomocysteine hydrolase deficiency
- psychomotor retardation due to S-adenosylhomocysteine hydrolase deficiency

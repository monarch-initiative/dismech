name: Fanconi-Ichthyosis-Dysmorphism Syndrome
creation_date: "2026-08-02T00:00:00Z"
category: Mendelian
synonyms:
- Fanconi-ichthyosis-dysmorphism syndrome
- FID syndrome
- Deal-Barratt-Dillon syndrome
- Fanconi syndrome, ichthyosis, dysmorphism, jaundice and diarrhoea
- Fanconi syndrome-ichthyosis-dysmorphism-jaundice-diarrhoea syndrome
description: >
  Fanconi-ichthyosis-dysmorphism (FID) syndrome, also called Deal-Barratt-Dillon
  syndrome, was described in 1990 in six infants of consanguineous parentage who
  shared renal Fanconi syndrome, ichthyosis, musculoskeletal abnormalities,
  jaundice and diarrhoea, two of them with grey-platelet-like platelet
  morphology. All six died before 6 months of age from dehydration, acidosis and
  sepsis, and no recognised metabolic disorder was identified at the time.
  The "Fanconi" in the name refers to the renal proximal tubulopathy (renal
  Fanconi syndrome), NOT to Fanconi anaemia — a conflation that persists in some
  classifications (see `discussions` and `notes`).

  FID is no longer regarded as an independent nosological entity. A 2001
  multicentre series of infants with arthrogryposis-renal dysfunction-cholestasis
  (ARC) syndrome concluded explicitly that the Fanconi
  syndrome-ichthyosis-dysmorphism-jaundice-diarrhoea association "is part of the
  ARC spectrum", and ARC syndrome was subsequently shown to be caused by biallelic
  loss-of-function variants in VPS33B (2004) or its obligate partner VIPAS39/VIPAR
  (2010). These two proteins form the CHEVI (class C Homologues in Endosome-Vesicle
  Interaction) tethering complex, which acts with RAB11A on the apical recycling
  endosome pathway. Loss of CHEVI function destroys apical-basolateral polarity in
  hepatocytes and renal proximal tubular cells and cripples the biogenesis of two
  specialised lysosome-related organelles — the epidermal lamellar body and the
  platelet alpha-granule. This single trafficking lesion accounts for every element
  of the original FID description: low-GGT cholestatic jaundice, renal Fanconi
  syndrome with acidosis and dehydration, ichthyosis, intractable diarrhoea,
  neurogenic arthrogryposis/musculoskeletal anomalies, and alpha-granule-deficient
  ("grey") platelets. Importantly, arthrogryposis is not obligate — patients with
  complete loss-of-function VPS33B alleles have been reported with ichthyosis,
  cholestasis and renal dysfunction but no arthrogryposis, which is precisely the
  FID presentation.

  This entry is therefore curated as a historically named, phenotypically
  arthrogryposis-poor presentation of VPS33B/VIPAS39-related ARC-spectrum disease.
  Management is supportive; prognosis remains poor, with most affected infants
  dying in the first year of life. Liver and kidney biopsy carry a very high risk
  of fatal bleeding from the platelet alpha-granule defect, so molecular diagnosis
  is preferred over tissue sampling.

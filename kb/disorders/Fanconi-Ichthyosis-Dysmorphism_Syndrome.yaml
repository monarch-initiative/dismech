    explanation: Mechanism linking E-cadherin loss to failed bile duct and renal tubule lumen formation.
  downstream:
  - target: Low-GGT Intrahepatic Cholestasis
    causal_link_type: DIRECT
    description: >
      Mis-sorted canalicular transporters and hypoplastic peripheral biliary
      radicles abolish intrahepatic bile flow despite a patent biliary tree.
    evidence:
    - reference: PMID:20190753
      reference_title: "Mutations in VIPAR cause an arthrogryposis, renal dysfunction and cholestasis syndrome phenotype with defects in epithelial polarization."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Consequences of disordered apical protein restriction in ARC include mis-sorting of some apical proteins to basolateral membrane and into late endosomes and lysosomes, resulting in cholestasis and in urinary wasting of sugars and amino acids."
      explanation: Directly attributes both the cholestasis and the renal solute wasting to apical mis-sorting.
  - target: Proximal Tubular Apical Transport Failure
    causal_link_type: DIRECT
    description: >
      The same polarity failure in the proximal nephron prevents apical

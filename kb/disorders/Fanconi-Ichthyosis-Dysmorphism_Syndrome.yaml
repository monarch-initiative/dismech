    explanation: Documents the allelic ARKID phenotype and an additional VPS33B cargo (LH3).
- name: VIPAS39
  gene_term:
    preferred_term: VIPAS39
    term:
      id: hgnc:20347
      label: VIPAS39
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  frequency: the minority of ARC-spectrum cases without VPS33B variants

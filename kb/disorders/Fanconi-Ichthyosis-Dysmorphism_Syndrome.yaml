- name: Stratum Corneum Lipid Barrier Failure and Ichthyosis
  biological_scale: TISSUE
  description: >
    The end result of failed lamellar body exocytosis is a structurally abnormal
    stratum corneum — increased corneocyte thickness, a thinner cornified envelope
    and reduced deposition of intercellular lipids — manifesting clinically as
    ichthyosis. Skin biopsy typically shows mild hyperkeratosis without
    parakeratosis. Impaired absorption of free fatty acids, secondary to cholestasis
    and intestinal disease, has been proposed as an additional contributor.
  locations:
  - preferred_term: stratum corneum of epidermis
    term:
      id: UBERON:0002027
      label: stratum corneum of epidermis
  biological_processes:

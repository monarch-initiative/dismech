    term:
      id: HP:0001396
      label: Cholestasis
  evidence:
  - reference: PMID:25239142
    reference_title: "Arthrogryposis-renal dysfunction-cholestasis (ARC) syndrome: from molecular genetics to clinical features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "supplement with ursodeoxycholic acid, fat-soluble vitamins, calcium glubionate, L-thyroxine and phosphate"
    explanation: Names ursodeoxycholic acid within the standard supportive regimen.
- name: Nutritional support with fat-soluble vitamin supplementation
  description: >
    Cholestatic fat malabsorption plus diarrhoeal and renal losses make aggressive
    nutritional support and fat-soluble vitamin replacement necessary, though failure
    to thrive typically persists.
  action_category: THERAPEUTIC
  therapeutic_modality: OTHER

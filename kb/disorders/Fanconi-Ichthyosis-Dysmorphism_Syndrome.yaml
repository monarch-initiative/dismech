    reference_title: "Arthrogryposis-renal dysfunction-cholestasis (ARC) syndrome: from molecular genetics to clinical features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "supplement with ursodeoxycholic acid, fat-soluble vitamins, calcium glubionate, L-thyroxine and phosphate"
    explanation: Fat-soluble vitamin and mineral supplementation within the supportive regimen.
- name: Avoidance of liver and kidney biopsy
  description: >
    A management decision rather than an intervention, but arguably the highest-value
    one. Percutaneous liver or kidney biopsy carries a reported risk of fatal bleeding
    above 50% because of the platelet alpha-granule defect, and routine platelet
    analysis cannot identify who is at risk. Diagnosis should proceed via clinical
    features, blood film, fibroblast VPS33B expression and sequencing instead.
  action_category: THERAPEUTIC
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:25239142
    reference_title: "Arthrogryposis-renal dysfunction-cholestasis (ARC) syndrome: from molecular genetics to clinical features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ney or liver biopsies result in a risk of fatal bleeding"
    explanation: >
      Quantifies the biopsy bleeding risk (>50% in the source sentence) that motivates
      avoidance; "kidney" is hyphen-broken across a line in the cached full text.
- name: LDL apheresis and biliary diversion for intractable cholestatic pruritus
  description: >
    Reported in a single ARC-spectrum patient with a renal-predominant presentation,
    combining LDL apheresis with biliodigestive derivation for cholestatic pruritus,
    with encouraging results. This is anecdotal rescue therapy, not established
    practice.
  action_category: THERAPEUTIC
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: therapeutic apheresis
    term:
      id: NCIT:C173286
      label: Therapeutic Apheresis
  evidence:
  - reference: PMID:29907094
    reference_title: "Severe renal Fanconi and management strategies in Arthrogryposis-Renal dysfunction-Cholestasis syndrome: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we report on the successful use of LDL-Apheresis and biliodigestive derivation for treatment of cholestatic pruritus with encouraging results"
    explanation: Single-case report of this rescue approach.
- name: Genetic counseling and prenatal diagnosis
  description: >
    Given autosomal recessive inheritance with a 25% recurrence risk, high
    consanguinity in affected families and near-uniform infantile lethality, genetic
    counselling with the option of prenatal or preimplantation genetic diagnosis is a
    central part of care once the family's variants are known.
  action_category: COUNSELING_INFORMATIONAL
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:25239142
    reference_title: "Arthrogryposis-renal dysfunction-cholestasis (ARC) syndrome: from molecular genetics to clinical features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "provide genetic counseling and prenatal or preimplantation genetic diagnosis"
    explanation: Recommends genetic counselling and prenatal/preimplantation diagnosis for affected families.
- name: Palliative and supportive care
  description: >
    No specific or disease-modifying treatment exists. Care is directed at quality of
    life, infection control and symptom relief; aggressive orthopaedic intervention
    for contractures is generally not recommended because poor general status and low
    survival compromise surgical outcomes.
  action_category: THERAPEUTIC
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: palliative care
    term:
      id: NCIT:C15292
      label: Palliative Therapy
  evidence:
  - reference: PMID:25239142
    reference_title: "Arthrogryposis-renal dysfunction-cholestasis (ARC) syndrome: from molecular genetics to clinical features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, no specific treatment currently exists for this syndrome."
    explanation: States the absence of disease-modifying therapy.
  - reference: PMID:25239142
    reference_title: "Arthrogryposis-renal dysfunction-cholestasis (ARC) syndrome: from molecular genetics to clinical features."
    supports: SUPPORT

  - name: Autosomal recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
  notes: >
    VIPAS39 (formerly C14orf133, protein name VIPAR) encodes the obligate binding
    partner of VPS33B. Biallelic VIPAS39 variants accounted for every classical ARC
    case in which VPS33B mutation and linkage were excluded, and the reported
    alleles (six nonsense, one frameshift, one start-codon change) are predicted
    null. No clinical differences distinguish VPS33B- from VIPAS39-mutated
    patients, consistent with the two proteins acting as a single functional
    complex.

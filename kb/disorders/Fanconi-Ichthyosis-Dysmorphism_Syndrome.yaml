      label: ABCB11
  evidence:
  - reference: PMID:15052268
    reference_title: "Mutations in VPS33B, encoding a regulator of SNARE-dependent membrane fusion, cause arthrogryposis-renal dysfunction-cholestasis (ARC) syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "neonatal cholestasis with bile duct hypoplasia and low gamma glutamyl transpeptidase (gGT) activity"
    explanation: Defines the low-GGT cholestasis with bile duct hypoplasia characteristic of the spectrum.
  - reference: PMID:20190753
    reference_title: "Mutations in VIPAR cause an arthrogryposis, renal dysfunction and cholestasis syndrome phenotype with defects in epithelial polarization."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "labeled compounds normally secreted into bile do not enter the duodenum despite biliary tract patency, reflecting absent or severely reduced intrahepatic bile flow"
    explanation: Demonstrates the intrahepatic, non-obstructive nature of the cholestasis.
  downstream:
  - target: Failure to Thrive, Recurrent Sepsis and Early Death
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >
      Cholestasis impairs fat and fat-soluble vitamin absorption, compounding the
      nutritional failure driven by diarrhoea and renal solute loss.
    intermediate_mechanisms:
    - Fat and fat-soluble vitamin malabsorption from absent intraluminal bile acids
    evidence:
    - reference: PMID:11668108
      reference_title: "ARC syndrome: an expanding range of phenotypes."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Although all patients had severe cholestasis, serum gamma glutamyltransferase values were normal."
      explanation: Documents severe cholestasis with normal GGT in the cohort that subsumed FID.
- name: Proximal Tubular Apical Transport Failure
  biological_scale: CELLULAR
  description: >
    Generalised failure of apical reabsorptive transport in the proximal tubule
    produces renal Fanconi syndrome: aminoaciduria, glycosuria, phosphaturia and
    bicarbonate wasting (proximal renal tubular acidosis). In some ARC-spectrum
    patients the renal presentation dominates and precedes recognition of the
    hepatic and cutaneous features; a minority present instead with nephrogenic
    diabetes insipidus.

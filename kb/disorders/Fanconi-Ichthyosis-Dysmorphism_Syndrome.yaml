- name: Defective Epidermal Lamellar Body Biogenesis and Secretion
  biological_scale: CELLULAR
  description: >
    Lamellar bodies (lamellar granules) are keratinocyte lysosome-related
    organelles that are normally exocytosed at the boundary between the granular
    and cornified layers, delivering the lipids that build the stratum corneum
    permeability barrier. In ARC-spectrum skin, ultrastructural examination shows
    lamellar granules entombed within cornified cells rather than secreted; their
    internal structure is normal, distinguishing the defect from CEDNIK syndrome.
    Vps33b- and Vipar-deficient mice reproduce the abnormal lamellar body
    morphology and cargo mislocalisation.
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  cellular_components:
  - preferred_term: epidermal lamellar body
    modifier: ABNORMAL
    term:
      id: GO:0097209
      label: epidermal lamellar body
  biological_processes:

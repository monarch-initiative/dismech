mappings:
  icd11f_mappings:
  - term:
      id: icd11f:235762608
      label: Fanconi-ichthyosis-dysmorphism syndrome
    mapping_predicate: skos:exactMatch
    mapping_justification: >-
      The ICD-11 Foundation entity carries the identical label and a definition
      reproducing the original Deal-Barratt-Dillon description ("the association
      of Fanconi anaemia, ichthyosis, musculo-skeletal anomalies, jaundice, and
      diarrhoea"). The label match is exact; note that the ICD-11 definition and
      parentage misidentify the "Fanconi" component as Fanconi anaemia rather
      than renal Fanconi syndrome (see the `fid_icd11_fanconi_anaemia_misparent`
      discussion).
  mondo_mappings:

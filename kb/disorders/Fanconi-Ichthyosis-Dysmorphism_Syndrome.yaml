- name: Neurogenic Arthrogryposis and Musculoskeletal Anomalies
  biological_scale: TISSUE
  description: >
    Congenital joint contractures in the ARC spectrum are neurogenic rather than
    primarily myopathic or connective-tissue in origin. In the FID series this
    component was described as "musculoskeletal abnormalities" rather than frank
    arthrogryposis, and its relative mildness is precisely why FID was initially
    separated from ARC. Complete loss-of-function VPS33B alleles have since been
    shown to produce ichthyosis, cholestasis and renal dysfunction without
    arthrogryposis, so its absence does not exclude the diagnosis. Reported
    skeletal features across the spectrum include congenital hip dislocation and
    vertical talus.
  evidence:
  - reference: PMID:15052268
    reference_title: "Mutations in VPS33B, encoding a regulator of SNARE-dependent membrane fusion, cause arthrogryposis-renal dysfunction-cholestasis (ARC) syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "an autosomal recessive multisystem disorder characterized by neurogenic arthrogryposis multiplex congenita"
    explanation: Establishes the neurogenic basis of the contractures.
  - reference: PMID:16492441
    reference_title: "VPS33B mutation with ichthyosis, cholestasis, and renal dysfunction but without arthrogryposis: incomplete ARC syndrome phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "although homozygous for the novel VPS33B mutation 971delA/K324fs, predicted to abolish VPS33B function, did not exhibit arthrogryposis"
    explanation: >
      Demonstrates that a null VPS33B genotype can present without arthrogryposis,
      reconciling the FID phenotype with the ARC molecular aetiology.
- name: Failure to Thrive, Recurrent Sepsis and Early Death
  biological_scale: ORGANISM
  description: >
    The convergent endpoint. Combined renal solute wasting, diarrhoeal loss,
    cholestatic malabsorption and recurrent febrile illness produce severe failure
    to thrive; death follows in infancy from dehydration, acidosis, sepsis, or
    internal haemorrhage. Every infant in the original FID series died by 6 months;
    across the ARC spectrum most die within the first year, with survival beyond
    infancy essentially restricted to patients retaining partial VPS33B function.
  evidence:
  - reference: PMID:2206896
    reference_title: "Fanconi syndrome, ichthyosis, dysmorphism, jaundice and diarrhoea--a new syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "all died by the age of 6 months of dehydration, acidosis and sepsis"
    explanation: The terminal common pathway documented in the index FID series.
  - reference: PMID:15052268
    reference_title: "Mutations in VPS33B, encoding a regulator of SNARE-dependent membrane fusion, cause arthrogryposis-renal dysfunction-cholestasis (ARC) syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Affected infants do not thrive and usually die in the first year of life."

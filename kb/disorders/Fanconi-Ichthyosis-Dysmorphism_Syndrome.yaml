- name: Failed Platelet Alpha-Granule Biogenesis
  biological_scale: CELLULAR
  description: >
    VPS33B colocalises with alpha-granule markers in normal megakaryocytes and is
    required to build the alpha-granule, which is a lysosome-related organelle like
    the lamellar body. Its loss produces platelets that are large, pale on blood
    films, deficient in both soluble and membrane-bound alpha-granule proteins, and
    that show compensatorily increased delta-granules. This is the mechanistic basis
    of the "grey platelet syndrome" morphology reported in two of the six original
    FID infants — a phenocopy of, not an instance of, true NBEAL2/GFI1B grey platelet
    syndrome.
  cell_types:
  - preferred_term: megakaryocyte
    term:
      id: CL:0000556
      label: megakaryocyte
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  cellular_components:
  - preferred_term: platelet alpha granule
    modifier: ABSENT
    term:
      id: GO:0031091
      label: platelet alpha granule
  biological_processes:
  - preferred_term: platelet alpha granule organization
    modifier: DECREASED
    term:
      id: GO:0070889
      label: platelet alpha granule organization
  evidence:
  - reference: PMID:16123220
    reference_title: "Requirement of VPS33B, a member of the Sec1/Munc18 protein family, in megakaryocyte and platelet alpha-granule biogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Structural abnormalities seen in ARC platelets included increased platelet size, a pale appearance in blood films, elevated numbers of delta-granules, and completely absent alpha-granules."
    explanation: Defines the platelet ultrastructural phenotype matching the FID "grey platelet" observation.
  - reference: PMID:16123220
    reference_title: "Requirement of VPS33B, a member of the Sec1/Munc18 protein family, in megakaryocyte and platelet alpha-granule biogenesis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "VPS33B colocalized appreciably with markers of alpha-granules, moderately with late endosomes/lysosomes, minimally with delta-granules/lysosomes, and not with cis-Golgi complexes."
    explanation: Localises VPS33B to the alpha-granule biogenesis compartment.

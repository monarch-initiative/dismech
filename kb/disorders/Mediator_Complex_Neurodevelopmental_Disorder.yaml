    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "biallelic putative disease-causing variants in MED27, encoding Mediator complex subunit 27, in 16 patients from 11 families with a novel neurodevelopmental syndrome."
    explanation: Syndrome-defining cohort establishing biallelic MED27 variants as the cause of a neurodevelopmental disorder with dystonia and cerebellar hypoplasia.

- name: MED25
  display_name: MED25-related Basel-Vanagaite-Smirin-Yosef syndrome (BVSYS)
  classification: molecular
  description: >-
    Caused by biallelic variants in MED25, a subunit of the Mediator tail module, with founder
    missense alleles (p.Tyr39Cys; p.Ile173Thr) that impair MED25 incorporation into the complex.
    Characterized by severe intellectual disability with eye anomalies (cataract, microcornea,
    coloboma), brain anomalies (including polymicrogyria), cardiac and palatal anomalies,
    microcephaly, hypotonia, and seizures. Note: the historical MED25-CMT2B2 (axonal
    Charcot-Marie-Tooth) association has been formally reassigned to PNKP and is not modeled here.
  subtype_term:

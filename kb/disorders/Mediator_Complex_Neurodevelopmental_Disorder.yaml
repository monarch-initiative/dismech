- name: MED13
  display_name: MED13-related intellectual developmental disorder (MRD61)
  classification: molecular
  description: >-
    Caused by heterozygous (usually de novo) variants in MED13, encoding a subunit of
    the CDK8 kinase module of the Mediator complex. Characterized by intellectual
    disability, expressive speech delay, behavioral abnormalities (ASD, ADHD), nonspecific
    dysmorphic features, obstipation, and poor overall growth. This subtype often falls
    at the milder end of the Mediator spectrum, but severe presentations with epilepsy,
    structural brain anomalies, and additional congenital complications have also been reported.
  subtype_term:
    preferred_term: Intellectual developmental disorder 61
    term:
      id: MONDO:0032485
      label: intellectual developmental disorder 61
  genes:
  - preferred_term: MED13
    term:
      id: hgnc:22474
      label: MED13
  inheritance:
  - name: Autosomal Dominant
  evidence:
  - reference: PMID:41195223
    reference_title: "A novel frameshift variant in the MED13 gene causing intellectual developmental disorder-61 in a Chinese family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Intellectual developmental disorder type 61 (MRD61) is an extremely rare autosomal dominant disorder caused by variants in the MED13 gene."
    explanation: Directly defines MRD61 as an autosomal dominant MED13-related disorder.
  - reference: PMID:29740699
    reference_title: "De novo mutations in MED13, a component of the Mediator complex, are associated with a novel neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we describe a GeneMatcher collaboration which led to a cohort of 13 affected individuals harboring protein-altering variants, 11 of which are de novo, in MED13; the only inherited variant was transmitted to an affected child from an affected mother."
    explanation: Syndrome-defining cohort establishing recurrent, mostly de novo MED13-associated neurodevelopmental disease.

- name: MED13L
  display_name: MED13L syndrome (MRFACD)
  classification: molecular
  description: >-
    Caused by heterozygous (mostly de novo) variants in MED13L, a paralog of MED13 also
    in the CDK8 kinase module. The most syndromic subtype, characterized by mild to profound
    intellectual disability, distinctive facial dysmorphism (depressed nasal bridge, bulbous
    nasal tip, upslanting palpebral fissures, macrostomia), congenital heart defects with
    variable penetrance, hypotonia, seizures, and corpus callosum anomalies. Also known as
    Asadollahi-Rauch syndrome.
  subtype_term:
    preferred_term: MED13L syndrome
    term:
      id: MONDO:0014773
      label: cardiac anomalies - developmental delay - facial dysmorphism syndrome
  genes:
  - preferred_term: MED13L
    term:
      id: hgnc:22962
      label: MED13L
  inheritance:
  - name: Autosomal Dominant
  evidence:
  - reference: PMID:40228085
    reference_title: "MED13L Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of MED13L syndrome is established in a proband with a heterozygous pathogenic variant in MED13L identified by molecular genetic testing."
    explanation: Directly defines MED13L syndrome as the heterozygous MED13L-associated disorder.
  - reference: PMID:28645799
    reference_title: "Genotype-phenotype evaluation of MED13L defects in the light of a novel truncating and a recurrent missense mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Review of the reported patients with MED13L haploinsufficiency indicates moderate to severe ID and facial anomalies in all patients, as well as severe speech delay and muscular hypotonia in the majority."
    explanation: Human review further delineating the recurrent MED13L syndrome phenotype.

- name: MED12
  display_name: MED12-related disorders (FG/Opitz-Kaveggia, Lujan, X-linked Ohdo, Hardikar, female NDD)
  classification: molecular
  description: >-
    Caused by variants in MED12, encoding the scaffold subunit of the CDK8 kinase module
    on the X chromosome. MED12 produces an allelic series rather than a single syndrome.
    In hemizygous males, recurrent missense hotspots define distinct syndromes: p.R961W
    causes FG syndrome type 1 (Opitz-Kaveggia syndrome) — moderate-to-severe intellectual
    disability, relative macrocephaly, imperforate anus or constipation, congenital
    hypotonia, corpus callosum agenesis/hypoplasia, broad thumbs and halluces, and a
    characteristic tall forehead with downslanting palpebral fissures and small ears;
    p.N1007S causes Lujan (Lujan-Fryns) syndrome (marfanoid habitus with ID); and
    C-terminal missense (e.g., p.R1148H, p.S1165P) cause X-linked Ohdo syndrome,
    Maat-Kievit-Brunner type (blepharophimosis, ptosis, ID, facial coarsening with age).
    The FG and Lujan alleles share a mechanism: they disrupt a Mediator-imposed constraint
    on GLI3-dependent Sonic Hedgehog signaling by impairing MED12-CDK8 association. In
    heterozygous females, de novo loss-of-function variants cause a distinct, female-specific
    Hardikar syndrome (facial clefting, pigmentary retinopathy, biliary anomalies, intestinal
    malrotation, with typically preserved cognition), and de novo missense or truncating
    variants cause a syndromic neurodevelopmental disorder with ID, dysmorphism, and short
    stature. A benign-end X-linked partial epilepsy without ID has also been described
    (PMID:36894399). Somatic MED12 exon-2 (Q44) gain-of-function mutations are a separate,
    non-heritable tumor mechanism (uterine leiomyoma, breast fibroadenoma) modeled in the
    respective tumor entries.
  subtype_term:
    preferred_term: MED12-related intellectual disability syndrome
    term:
      id: MONDO:0100000
      label: MED12-related intellectual disability syndrome
  genes:
  - preferred_term: MED12
    term:
      id: hgnc:11957
      label: MED12
  inheritance:
  - name: X-linked Recessive
  evidence:
  - reference: PMID:19938245
    reference_title: "FG syndrome, an X-linked multiple congenital anomaly syndrome: the clinical phenotype and an algorithm for diagnostic testing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "FG syndrome is a rare X-linked multiple congenital anomaly-cognitive impairment disorder caused by the p.R961W mutation in the MED12 gene."
    explanation: Establishes the best-characterized MED12-related mediatoropathy form as an X-linked MED12 disorder.
  - reference: PMID:17334363
    reference_title: "A recurrent mutation in MED12 leading to R961W causes Opitz-Kaveggia syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the original family for whom the condition is named and five other families have a recurrent mutation (2881C>T, leading to R961W) in MED12"
    explanation: Gene-discovery paper establishing the recurrent MED12 p.R961W variant as the cause of FG/Opitz-Kaveggia syndrome.
  - reference: PMID:23091001
    reference_title: "MED12 mutations link intellectual disability syndromes with dysregulated GLI3-dependent Sonic Hedgehog signaling."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "MED12 mutations R961W and N1007S causing FG and Lujan syndromes, respectively, disrupt a Mediator-imposed constraint on GLI3-dependent Sonic Hedgehog (SHH) signaling."
    explanation: Establishes the shared molecular mechanism uniting the FG and Lujan MED12 alleles through impaired MED12-CDK8 control of GLI3/SHH signaling.
  - reference: PMID:23395478
    reference_title: "Mutations in MED12 cause X-linked Ohdo syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The occurrence of three different hemizygous missense mutations in three unrelated families affected by Ohdo syndrome MKB type shows that mutations in MED12 are the underlying cause of this X-linked form of Ohdo syndrome."
    explanation: Establishes MED12 as the cause of X-linked Ohdo syndrome, Maat-Kievit-Brunner type, expanding the MED12 allelic series beyond FG and Lujan.
  - reference: PMID:33244166
    reference_title: "De novo loss-of-function variants in X-linked MED12 are associated with Hardikar syndrome in females."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We propose a fifth, female-specific phenotype for MED12, and suggest that nonsense and frameshift loss-of-function MED12 variants in females cause HS."
    explanation: Establishes a distinct female-specific MED12 phenotype (Hardikar syndrome) caused by loss-of-function alleles, mechanistically distinct from the male missense syndromes.
  - reference: PMID:33244165
    reference_title: "De novo variants in MED12 cause X-linked syndromic neurodevelopmental disorders in 18 females."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Protein truncating variants were associated with a severe, syndromic phenotype consisting of intellectual disability (ID), facial dysmorphism, short stature, skeletal abnormalities, feeding difficulties, and variable other abnormalities."
    explanation: Establishes a syndromic neurodevelopmental disorder in females with de novo MED12 variants, further broadening the MED12 phenotypic spectrum beyond the male syndromes.

- name: MED23
  display_name: MED23-related intellectual disability (MRT18)
  classification: molecular
  description: >-
    Caused by biallelic (homozygous or compound heterozygous) variants in MED23, encoding
    a subunit of the tail module of the Mediator complex. Distinguished from other Mediator
    subtypes by prominent movement disorder features (spasticity, dystonia, choreoathetosis),
    autosomal recessive inheritance, and seizures with or without epilepsy. Brain imaging may
    show hypomyelination, pontine hypoplasia, and thin corpus callosum.
  subtype_term:
    preferred_term: Intellectual disability, autosomal recessive 18
    term:
      id: MONDO:0013651
      label: intellectual disability, autosomal recessive 18
  genes:
  - preferred_term: MED23
    term:
      id: hgnc:2372
      label: MED23
  inheritance:
  - name: Autosomal Recessive
  evidence:
  - reference: PMID:36824420
    reference_title: "Case report: Novel compound heterozygosity for pathogenic variants in MED23 in a syndromic patient with postnatal microcephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Biallelic loss-of-function variants in MED23 cause a recessive syndromic intellectual disability condition with or without epilepsy (MRT18)."
    explanation: Directly defines MED23-related MRT18 as a recessive syndromic intellectual disability disorder.
  - reference: PMID:21868677
    reference_title: "MED23 mutation links intellectual disability to dysregulation of immediate early gene expression."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report a missense mutation (p. R617Q) in MED23 that cosegregates with nonsyndromic autosomal recessive intellectual disability."
    explanation: Original human genetic evidence linking MED23 to recessive intellectual disability.

- name: CDK8
  display_name: CDK8-related disorder (IDDHBA)
  classification: molecular
  description: >-
    Caused by heterozygous de novo missense variants in CDK8, the catalytic kinase of the
    CDK8 kinase module. Variants localize to the ATP-binding pocket of the kinase domain and
    act as hypomorphic/partial loss-of-function alleles. Characterized by infantile hypotonia,
    mild-to-moderate intellectual disability, behavioral abnormalities (ASD and/or ADHD), and
    variable facial dysmorphism, with congenital heart disease in about half of individuals and
    additional features including agenesis of the corpus callosum, ano-rectal malformations,
    seizures, and hearing loss.
  subtype_term:
    preferred_term: Intellectual developmental disorder with hypotonia and behavioral abnormalities
    term:
      id: MONDO:0032897
      label: intellectual developmental disorder with hypotonia and behavioral abnormalities
  genes:
  - preferred_term: CDK8
    term:
      id: hgnc:1779
      label: CDK8
  inheritance:
  - name: Autosomal Dominant
  evidence:
  - reference: PMID:30905399
    reference_title: "De Novo Missense Substitutions in the Gene Encoding CDK8, a Regulator of the Mediator Complex, Cause a Syndromic Developmental Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Affected individuals have overlapping phenotypes characterized by hypotonia, mild to moderate intellectual disability, behavioral disorders, and variable facial dysmorphism."
    explanation: Syndrome-defining cohort establishing de novo CDK8 kinase-domain missense variants as the cause of a Mediator-related syndromic developmental disorder.

- name: CDK19
  display_name: CDK19-related developmental and epileptic encephalopathy (DEE87)
  classification: molecular
  description: >-
    Caused by heterozygous de novo missense variants in CDK19, the paralog of CDK8 and an
    alternative catalytic kinase of the CDK8 kinase module. This is the most epilepsy-predominant
    Mediator subtype: individuals present with hypotonia, global developmental delay, and
    epileptic encephalopathy (including infantile spasms) with dysmorphic features. Both loss-of-
    and gain-of-function mechanisms have been reported for different alleles.
  subtype_term:
    preferred_term: Developmental and epileptic encephalopathy 87
    term:
      id: MONDO:0030059
      label: developmental and epileptic encephalopathy, 87

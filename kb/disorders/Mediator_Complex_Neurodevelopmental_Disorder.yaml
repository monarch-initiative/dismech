    snippet: "Loss of the C-terminal of MED subunit 11 may affect its binding efficiency to other MED subunits, thus implicating the MED-complex stability in brain development and neurodegeneration."
    explanation: Demonstrates that a core head-module subunit variant causes disease by disrupting Mediator complex stability, the shared mechanism of the recessive core-module MEDopathies.
  - reference: PMID:25792360

    reference_title: "Infantile cerebral and cerebellar atrophy is associated with a mutation in the MED17 subunit of the transcription preinitiation mediator complex."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Five infants from four unrelated families of Caucasus Jewish origin presented soon after birth with spasticity, epilepsy, and profound psychomotor retardation."
    explanation: Gene-discovery paper establishing the MED17 p.L371P founder allele as the cause of infantile cerebral and cerebellar atrophy with postnatal microcephaly.

- name: MED11
  display_name: MED11-related lethal neurodegeneration (NDDRSB)
  classification: molecular
  description: >-
    Caused by a recurrent homozygous C-terminal MED11 variant (p.Arg109Ter), truncating the last
    conserved residues of this Mediator head-module subunit and disrupting assembly of the
    MED11-MED22-MED17 four-helix bundle. The most severe MEDopathy: congenital microcephaly,
    neonatal respiratory failure, refractory myoclonic seizures, exaggerated startle response,
    progressive widespread neurodegeneration, and premature death.
  subtype_term:
    preferred_term: Neurodegeneration with developmental delay, early respiratory failure, myoclonic seizures, and brain abnormalities
    term:
      id: MONDO:0957225
      label: neurodegeneration with developmental delay, early respiratory failure, myoclonic seizures, and brain abnormalities
  genes:
  - preferred_term: MED11
    term:
      id: hgnc:32687
      label: MED11
  inheritance:
  - name: Autosomal Recessive
  evidence:
  - reference: PMID:36001086
    reference_title: "A homozygous MED11 C-terminal variant causes a lethal neurodegenerative disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The disease was characterized by microcephaly, profound neurodevelopmental impairment, exaggerated startle response, myoclonic seizures, progressive widespread neurodegeneration, and premature death."
    explanation: Single defining paper establishing a recurrent homozygous C-terminal MED11 variant as the cause of a lethal neurodegenerative MEDopathy.

- name: MED27
  display_name: MED27-related disorder (NEDSCAC)
  classification: molecular
  description: >-
    Caused by biallelic variants in MED27, a subunit of the Mediator structural core. Highly
    homogeneous phenotype: global developmental delay, intellectual disability, axial hypotonia
    with distal spasticity, dystonic movements, and cerebellar hypoplasia; congenital cataracts
    and seizures occur in severely affected individuals. Later cohorts describe a
    ponto-cerebello-lental degeneration with movement disorders.
  subtype_term:
    preferred_term: Neurodevelopmental disorder with spasticity, cataracts, and cerebellar hypoplasia
    term:

    reference_title: "De Novo Variants in CDK19 Are Associated with a Syndrome Involving Intellectual Disability and Epileptic Encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These individuals presented with hypotonia, global developmental delay, epileptic encephalopathy, and dysmorphic features."
    explanation: Syndrome-defining report linking de novo CDK19 variants to a Mediator kinase-module disorder with epileptic encephalopathy.

- name: MED12L
  display_name: MED12L-related disorder (Nizon-Isidor syndrome)
  classification: molecular
  description: >-
    Caused by heterozygous (mostly de novo) variants in MED12L, the autosomal paralog of the
    MED12 scaffold in the CDK8 kinase module, acting through haploinsufficiency. Characterized by
    intellectual disability, prominent speech and language delay, motor delay, hypotonia, variable
    congenital heart defects, and mild dysmorphism, with a demonstrable transcriptional defect in
    patient fibroblasts.
  subtype_term:
    preferred_term: Nizon-Isidor syndrome
    term:
      id: MONDO:0030030

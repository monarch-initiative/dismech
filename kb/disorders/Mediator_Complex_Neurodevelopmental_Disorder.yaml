  evidence:
  - reference: PMID:40081376
    reference_title: "Bi-allelic MED16 variants cause a MEDopathy with intellectual disability, motor delay, and craniofacial, cardiac, and limb malformations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we report the identification of 25 individuals from 18 families with bi-allelic MED16 variants who have a multiple congenital anomalies (MCAs)-intellectual disability syndrome."
    explanation: Gene-discovery cohort establishing biallelic MED16 variants as a new (2025) recessive MEDopathy (Guillouet-Gordon syndrome).

- name: MED20
  display_name: MED20-related infantile basal ganglia degeneration (provisional)
  classification: molecular
  description: >-
    Caused by a homozygous MED20 variant (p.Gly114Ala) in a single reported family (two siblings),
    a subunit of the Mediator head module. Presents as an infantile-onset neurodegenerative
    movement disorder with infantile spasticity, childhood-onset dystonia, progressive basal
    ganglia degeneration, and brain atrophy. Provisional: the original authors state that
    definitive proof of pathogenicity awaits confirmation in unrelated patients, and no OMIM
    phenotype number has been assigned.
  subtype_term:
    preferred_term: MED20-related infantile basal ganglia degeneration with brain atrophy
  genes:
  - preferred_term: MED20
    term:

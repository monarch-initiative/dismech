- name: CDK8 Kinase Module Dysfunction
  description: >-
    The CDK8 kinase module (CKM) is a four-part cap that reversibly associates with the core
    Mediator complex to regulate its activity: a kinase (CDK8 or its paralog CDK19), cyclin C,
    a scaffold (MED12 or its paralog MED12L), and a large subunit (MED13 or MED13L). Disease
    variants affect every CKM component except cyclin C (CCNC has no confirmed germline disease):
    MED12 (FG/Lujan/Ohdo/Hardikar/female NDD), MED12L (Nizon-Isidor syndrome), MED13 (MRD61),
    MED13L (MED13L syndrome), CDK8 (IDDHBA), and CDK19 (DEE87). The CKM has both activating and
    repressive roles in transcription and modulates Wnt, Notch, GLI3/Sonic Hedgehog, and other
    signaling pathways during development. Mutations in CKM subunits preferentially affect neural
    crest-derived structures and brain development; the CDK8/CDK19 kinase subunits are a
    disproportionately mutation-prone part of the module.

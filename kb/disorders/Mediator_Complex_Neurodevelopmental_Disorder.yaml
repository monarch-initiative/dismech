  evidence:
  - reference: PMID:25446406
    reference_title: "MED20 mutation associated with infantile basal ganglia degeneration and brain atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified the first and homozygous mutation (p.Gly114Ala) in the Mediator subunit 20 gene (MED20) in siblings presenting with infantile-onset spasticity and childhood-onset dystonia, progressive basal ganglia degeneration, and brain atrophy."
    explanation: Single-family report proposing MED20 as the cause of an infantile-onset neurodegenerative movement disorder; modeled as a provisional subtype pending confirmation in unrelated patients.

pathophysiology:
- name: Mediator Complex Disruption
  description: >-
    The Mediator complex is a large multi-subunit assembly (~30 subunits in humans) that
    serves as a transcriptional coactivator bridging gene-specific transcription factors
    bound at enhancers and the RNA polymerase II general transcription machinery at
    promoters. Mutations in Mediator subunits disrupt this enhancer-promoter communication,
    leading to dysregulated expression of developmentally critical genes. The complex is
    organized into head, middle, tail, and CDK8 kinase modules, each with distinct
    interaction partners and regulatory functions.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  subtypes:
  - MED13
  - MED13L
  - MED12
  - MED23
  biological_processes:
  - preferred_term: Transcription by RNA polymerase II
    term:

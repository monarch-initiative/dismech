- name: MED16
  display_name: MED16-related Guillouet-Gordon syndrome (GGNS)
  classification: molecular
  description: >-
    Caused by biallelic variants in MED16, a subunit of the Mediator tail module; the most
    recently described MEDopathy (2025). A multiple congenital anomalies-intellectual disability
    syndrome with constant intellectual disability, speech and/or motor delay, plus variable
    craniofacial defects (micro/retrognathia, cleft palate, preauricular tags), limb/extremity
    anomalies, and congenital heart defects (predominantly tetralogy of Fallot); visual
    impairment, deafness, and MRI abnormalities are frequent. Most variants cause
    nuclear-to-cytoplasmic mislocalization of MED16.
  subtype_term:
    preferred_term: Guillouet-Gordon syndrome
    term:
      id: MONDO:0979227
      label: Guillouet-Gordon syndrome
  genes:
  - preferred_term: MED16
    term:
      id: hgnc:17556
      label: MED16
  inheritance:

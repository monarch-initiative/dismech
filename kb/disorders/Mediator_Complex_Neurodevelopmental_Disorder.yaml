name: Mediator Complex Neurodevelopmental Disorder
creation_date: "2026-04-11T00:00:00Z"
description: >-
  A group of neurodevelopmental and neurodegenerative disorders — collectively termed
  "MEDopathies" — caused by germline variants in genes encoding subunits of the Mediator
  complex, a ~30-subunit assembly required for RNA polymerase II-dependent transcription.
  The Mediator complex bridges gene-specific transcription factors at enhancers and the
  general transcription machinery at promoters, and its disruption leads to dysregulated
  gene expression during neurodevelopment. Shared phenotypic features across subtypes include
  intellectual disability, speech and language delay, behavioral abnormalities, and variable
  structural brain and cardiac anomalies, with movement disorder and brain-atrophy features
  concentrated in the recessive head/structural-module forms. The complex is organized into
  head, middle, tail, and a dissociable CDK8 kinase module (CKM); the CKM is a four-part cap
  comprising a kinase (CDK8 or its paralog CDK19), cyclin C (CCNC), a scaffold (MED12 or
  MED12L), and a large subunit (MED13 or MED13L). Disease-associated subunits span every
  module: CKM (MED12, MED12L, MED13, MED13L, CDK8, CDK19), head (MED11, MED17, MED20),
  structural core (MED27), and tail (MED23, MED25, MED16). Inheritance ranges from autosomal
  dominant (de novo CKM haploinsufficiency: MED13, MED13L, MED12L, CDK8, CDK19), through
  X-linked (MED12, with an allelic series spanning FG/Opitz-Kaveggia, Lujan, X-linked Ohdo,
  Hardikar syndrome in females, and a female syndromic NDD), to autosomal recessive
  (MED11, MED17, MED20, MED23, MED25, MED27, MED16). The spectrum continues to expand, with
  MED16 (Guillouet-Gordon syndrome) added as recently as 2025.
category: Genetic
parents:
- Neurodevelopmental Disorder
- Transcriptional Regulation Disorder
notes: >-
  MONDO grouping class requested in monarch-initiative/mondo#10146. Pending MONDO ID assignment.
  This entry follows the precedent of RASopathy (MONDO:0021060) as a complex/pathway-based
  disease grouping.

  Two of the four molecular subtypes also have standalone dismech entries carrying their
  full mechanism graph, variant-class stratification and management detail: `MED13_Syndrome`
  (MONDO:0032485) and `MED13L_Syndrome` (MONDO:0014773). This entry remains the
  cross-subtype view; consult the standalone entries for subtype-specific depth.
disease_term:
  preferred_term: Mediator complex neurodevelopmental disorder
  term:
    id: MONDO:0002320
    label: congenital nervous system disorder
prevalence:
- population: Global
  prevalence_class: RARE
  notes: >-
    Each subtype is individually ultra-rare. MED13L syndrome is the most commonly
    reported, with over 100 cases in the literature. MED13 (MRD61) had at least
    26 reported cases by 2025. MED12-related disorders, especially FG syndrome type 1,
    have several hundred reported cases. The recessive head/structural/tail-module
    forms are rarer still: MED17 (MCPHA) clusters in Caucasus-Jewish founder families;
    MED25 (BVSYS, ~22 patients), MED27 (NEDSCAC), MED16 (Guillouet-Gordon syndrome,
    25 individuals from 18 families in the 2025 defining cohort), and MED12L
    (Nizon-Isidor syndrome, ~a dozen individuals) each rest on one or a few case
    series. MED11 (lethal NDDRSB, 7 individuals) and MED20 (a single family, 2 sibs;
    provisional) are the rarest. MED23-related disorder remains limited to a small
    number of reported families.


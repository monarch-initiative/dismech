    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All affected individuals presented with intellectual disability and/or developmental delay, including speech impairment."
    explanation: Gene-discovery paper establishing MED12L as a CDK8-kinase-module disease gene causing intellectual disability with a transcriptional defect.

- name: MED17
  display_name: MED17-related infantile cerebral and cerebellar atrophy (MCPHA)
  classification: molecular
  description: >-
    Caused by biallelic variants in MED17, a subunit of the Mediator head module, with a
    recurrent p.Leu371Pro founder allele in Caucasus-Jewish families. Infants are normal at
    birth, then develop postnatal progressive microcephaly, spasticity, epilepsy, and profound
    psychomotor retardation; brain MRI shows severe cerebral and cerebellar atrophy with a poor
    myelination. Prognosis is grave. This is one of the founding recessive MEDopathies.
  subtype_term:
    preferred_term: Infantile cerebral and cerebellar atrophy with postnatal progressive microcephaly
    term:
      id: MONDO:0013351
      label: infantile cerebral and cerebellar atrophy with postnatal progressive microcephaly

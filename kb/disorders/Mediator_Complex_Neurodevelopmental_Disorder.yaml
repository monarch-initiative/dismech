- name: Core Module Disruption (Head, Structural, and Tail)
  description: >-
    In contrast to the dissociable CDK8 kinase module, the head, structural core, and tail
    modules form the constitutive body of Mediator that docks RNA polymerase II and integrates
    enhancer signals. Biallelic (autosomal recessive) variants in these subunits — MED11, MED17,
    and MED20 (head module); MED27 (structural core); MED25 and MED16 (tail module) — impair
    assembly or stability of the core complex itself. Several act by disrupting subunit-subunit
    contacts (MED11 C-terminal truncation destabilizes the MED11-MED22-MED17 four-helix bundle;
    MED25 founder alleles impair incorporation into the complex; most MED16 variants cause
    nuclear-to-cytoplasmic mislocalization). The resulting phenotypes skew toward severe,
    early-onset, and often neurodegenerative disease — postnatal progressive microcephaly with
    cerebral/cerebellar atrophy (MED17), lethal neurodegeneration (MED11), basal ganglia
    degeneration and dystonia (MED20), cerebellar hypoplasia with spasticity and cataracts
    (MED27), eye-brain malformation syndromes (MED25), and multiple congenital anomalies (MED16)
    — distinct from the predominantly non-degenerative CKM disorders.

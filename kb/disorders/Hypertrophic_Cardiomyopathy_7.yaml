  biological_scale: ORGANISM
  role: consequence
  description: >-
    The clinical endpoints of CMH7 are progressive heart failure — exertional
    dyspnoea, chest pain, and in a minority evolution to an advanced or
    end-stage phenotype — and sudden cardiac death from ventricular arrhythmia.
    The two arms are partly independent: sudden death can be the presenting event
    in a young carrier with minimal or absent hypertrophy, which is why
    genotype-informed risk stratification matters in this gene.

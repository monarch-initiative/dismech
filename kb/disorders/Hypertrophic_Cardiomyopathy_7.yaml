    reference_title: Mutations in the cardiac troponin I gene associated with hypertrophic cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hypertrophic cardiomyopathy (HCM), the most common cause of sudden death in
      the young, is an autosomal dominant disease characterized by ventricular
      hypertrophy accompanied by myofibrillar disarrays.
    explanation: >-
      The paper that established cardiac troponin I as an HCM gene states the
      autosomal dominant inheritance of the disease it is reporting.
mechanistic_hypotheses:
- hypothesis_group_id: tnni3_myofilament_calcium_hypersensitization
  hypothesis_label: Loss of troponin I inhibition and myofilament calcium hypersensitization
  status: CANONICAL
  description: >-
    The canonical model holds that CMH7 variants degrade the inhibitory function
    of cardiac troponin I. Mutant troponin I fails to hold actin-tropomyosin in
    the blocked state during diastole and its interactions with troponin C and
    troponin T are altered, so the thin filament activates at lower calcium
    concentrations. The resulting myofilament calcium hypersensitivity, together
    with blunted length-dependent activation and impaired protein kinase A
    responsiveness, produces hypercontractility with impaired relaxation, which
    is the proximate stimulus for hypertrophic remodeling.
  evidence:
  - reference: PMID:23508784
    reference_title: Perturbed length-dependent activation in human hypertrophic cardiomyopathy with missense sarcomeric gene mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      High-myofilament Ca(2+) sensitivity is a common characteristic of human HCM
      and partly reflects hypophosphorylation of PKA targets compared with donors.
    explanation: >-
      Establishes high myofilament calcium sensitivity as a shared feature of
      human hypertrophic cardiomyopathy myocardium, including samples carrying
      TNNI3 mutations, which is the core of this hypothesis group.
  - reference: PMID:26553696
    reference_title: Green Tea Catechin Normalizes the Enhanced Ca2+ Sensitivity of Myofilaments Regulated by a Hypertrophic Cardiomyopathy-Associated Mutation in Human Cardiac Troponin I (K206I).
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The K206I mutation impairs the ability of the troponin I to inhibit ATPase
      activity in the absence of calcium-bound human cardiac troponin C.
    explanation: >-
      Directly demonstrates loss of the troponin I inhibitory function for an
      HCM-associated TNNI3 variant, the molecular premise of this hypothesis.
- hypothesis_group_id: tnni3_secondary_metabolic_signaling_stress
  hypothesis_label: Secondary hypertrophic signaling and mitochondrial-metabolic stress
  status: EMERGING
  description: >-
    An additional arm proposes that TNNI3 variants engage hypertrophic signal
    transduction and metabolic derangement beyond the mechanical defect —
    activation of the ERK cascade with induction of the fetal gene programme
    (ANP, BNP, MYH7), mitochondrial dysfunction, and increased autophagy and
    apoptosis. The supporting data come from a single-variant cell-line study
    and from metabolomic profiling of small patient cohorts, so whether this arm
    is variant-specific, secondary to the mechanical lesion, or a generic
    hypertrophy response is unresolved.
  evidence:
  - reference: PMID:39426416
    reference_title: Mechanisms of pathogenicity in the hypertrophic cardiomyopathy-associated TNNI3 c.235C > T variant.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      This mutation led to the upregulation of hypertrophy-associated genes ANP,
      BNP, and MYH7, increased cardiomyocyte size, and activation of the ERK
      signaling pathway.
    explanation: >-
      Provides the primary in vitro basis for the signaling arm, in AC16 human
      cardiomyocytes transfected with a TNNI3 mutant plasmid.
  - reference: PMID:39426416
    reference_title: Mechanisms of pathogenicity in the hypertrophic cardiomyopathy-associated TNNI3 c.235C > T variant.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      Further investigations revealed that the TNNI3 c.235C > T mutation impaired
      mitochondrial function, disrupted cardiomyocyte metabolism, and increased
      cellular autophagy and apoptosis.
    explanation: >-
      Supports the metabolic/proteostatic arm but for one variant in a
      transfected cell line, which is why this hypothesis group is EMERGING
      rather than canonical.
pathophysiology:
- name: Cardiac Troponin I Inhibitory Dysfunction
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Primary Cardiomyocyte Insult"
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    TNNI3 encodes cardiac troponin I, the inhibitory subunit of the cardiac
    troponin complex on the thin filament. In diastole it anchors
    actin-tropomyosin in the blocked state; on systolic calcium binding to
    troponin C the inhibitory and switch peptides release actin, permitting
    cross-bridge cycling. CMH7-associated variants are predominantly
    heterozygous missense changes distributed across the N-terminal
    PKA-phosphorylation extension, the troponin T/troponin C binding region, the
    inhibitory peptide, and the C-terminal actin-binding region. They do not
    abolish the protein; they degrade its inhibitory capacity and its
    interactions with troponin C and troponin T, which is the primary lesion of
    this disorder. The distribution is not uniform across the gene:
    approximately 80% of reported pathogenic TNNI3 variants fall in exons 7 and
    8, which encode the actin- and troponin-C-interacting domains - so the
    mutational hotspot coincides with the functional interfaces this node
    describes, which is why variant position carries interpretive weight in this
    gene.

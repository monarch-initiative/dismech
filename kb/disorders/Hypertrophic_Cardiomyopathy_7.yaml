  notes: >-
    No population-based prevalence estimate exists for the TNNI3-specific form of
    hypertrophic cardiomyopathy. The available figures are genotype shares within
    hypertrophic cardiomyopathy cohorts rather than population rates: TNNI3
    variants account for approximately 3% of hypertrophic cardiomyopathy overall
    and up to 5% of genotyped familial cases. These case fractions are recorded
    under `genetic.case_fractions`.

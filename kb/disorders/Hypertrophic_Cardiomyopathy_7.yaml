  - reference: PMID:25524337
    reference_title: Clinical phenotype and outcome of hypertrophic cardiomyopathy associated with thin-filament gene mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In adult HCM patients, thin-filament mutations are associated with increased
      likelihood of advanced LV dysfunction and heart failure compared with
      thick-filament disease, whereas arrhythmic risk in both subsets is
      comparable.
    explanation: >-
      The reference cohort comparison (80 thin-filament vs 150 thick-filament
      adults) defining the organ-level course of the genotype class that includes
      TNNI3.
  downstream:

animal_models:
- species: Mouse (Mus musculus)
  genotype: Cardiac-specific transgenic overexpression of human cTnI Gly203Ser (cTnI-G203S)
  category: Transgenic
  genes:
  - preferred_term: TNNI3
    term:
      id: hgnc:11947
      label: TNNI3
  associated_phenotypes:
  - Left ventricular hypertrophy
  - Myocyte hypertrophy
  - Myofiber disarray
  - Interstitial fibrosis
  - Abnormal cardiomyocyte calcium cycling
  - Atrial electrical and structural remodeling
  description: >-
    Transgenic mouse lines overexpressing the human disease-causing cardiac
    troponin I variant Gly203Ser in a cardiac-specific manner, compared with
    wild-type cTnI transgenics and non-transgenic littermates. By 21 weeks the
    model develops the full hypertrophic cardiomyopathy phenotype — left
    ventricular hypertrophy on echocardiography, a four-fold rise in the
    hypertrophy markers ANF and BNP, myocyte hypertrophy, myofiber disarray, and
    interstitial fibrosis — with abnormal calcium cycling in isolated adult
    cardiomyocytes. The same model has been used to characterize the atrial
    electrophysiological and structural substrate for atrial fibrillation. It is
    the reference in vivo model for the CMH7 mechanism chain from the troponin I
    lesion through remodeling to the arrhythmogenic substrate.
  evidence:
  - reference: PMID:16950368
    reference_title: Molecular insights from a novel cardiac troponin I mouse model of familial hypertrophic cardiomyopathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Mice with the cTnI-G203S gene mutation develop all the phenotypic features
      of human FHC.
    explanation: >-

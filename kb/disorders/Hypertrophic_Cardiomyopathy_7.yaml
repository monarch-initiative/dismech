genetic:
- name: TNNI3 Pathogenic Variants
  association: Pathogenic Variants
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: TNNI3
    term:
      id: hgnc:11947
      label: TNNI3
  inheritance:
  - name: Autosomal Dominant
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
  features: >-
    CMH7-associated TNNI3 variants are overwhelmingly heterozygous missense
    changes. They cluster in functionally critical regions — the N-terminal
    extension containing the protein kinase A phosphorylation serines (p.Arg21Cys),
    the inhibitory peptide and switch region (Arg145), and the C-terminal
    actin/troponin C interaction region (Lys206) — and act by degrading rather
    than abolishing troponin I function, consistent with a dominant-negative
    (poison-peptide) mechanism incorporated into the sarcomere. Severity,
    penetrance, and rate of progression vary substantially between variants, so
    genotype-level rather than gene-level interpretation is required. TNNI3 is
    also the causal gene for distinct restrictive and dilated cardiomyopathy
    entities; variant interpretation must be anchored to the phenotype actually
    observed in the family.
  case_fractions:
  - population: Hypertrophic cardiomyopathy patients (unselected)
    case_fraction_percent: 3.0
    notes: TNNI3 accounts for approximately 3% of hypertrophic cardiomyopathy.
    evidence:
    - reference: PMID:32885985
      reference_title: Founder Mutation in N Terminus of Cardiac Troponin I Causes Malignant Hypertrophic Cardiomyopathy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Cardiac troponin I (TNNI3) gene mutations account for 3% of hypertrophic
        cardiomyopathy
      explanation: >-
        Direct quantitative statement of the TNNI3 share of hypertrophic
        cardiomyopathy cases.
  - population: Genotyped familial hypertrophic cardiomyopathy kindreds
    case_fraction_percent: 5.0
    notes: >-
      Reported as "up to 5%" of genotyped familial hypertrophic cardiomyopathy
      families; recorded as the upper bound of the cited range.
    evidence:
    - reference: PMID:16950368
      reference_title: Molecular insights from a novel cardiac troponin I mouse model of familial hypertrophic cardiomyopathy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Gene mutations in cardiac troponin I (cTnI) account for up to 5% of
        genotyped families with familial hypertrophic cardiomyopathy (FHC).
      explanation: >-
        Quantifies the TNNI3 share among genotyped familial cases; the statement
        itself summarises human genotyping data, hence HUMAN_CLINICAL even though
        the paper's own experiments are murine.
  variants:
  - name: TNNI3 Arg145Gly
    description: >-
      Missense variant in the inhibitory region reported in the original CMH7
      series and shown by family study to be linked to hypertrophic
      cardiomyopathy. One of the two founding CMH7 alleles.
    gene:
      preferred_term: TNNI3
      term:
        id: hgnc:11947
        label: TNNI3
  - name: TNNI3 Lys206Gln
    description: >-
      C-terminal missense variant identified as a de novo event in the original
      CMH7 series, providing independent support for causality. The neighbouring
      K206I substitution has been characterized functionally and impairs troponin
      I inhibition of actomyosin ATPase with increased myofilament calcium
      sensitivity.
    gene:
      preferred_term: TNNI3
      term:
        id: hgnc:11947
        label: TNNI3
  - name: TNNI3 p.Arg21Cys
    description: >-
      N-terminal missense variant with a founder effect in South Lebanon; the
      only reported variant in the N terminus of the protein. It impairs protein
      kinase A phosphorylation, increases calcium sensitivity, and causes
      diastolic dysfunction in model organisms, and produces a malignant clinical
      course with sudden cardiac death at a median age of 22.5 years, including in
      carriers without left ventricular hypertrophy.
    gene:
      preferred_term: TNNI3
      term:
        id: hgnc:11947
        label: TNNI3
  - name: TNNI3 p.Ile195Phe
    description: >-
      Novel de novo heterozygous missense variant (NM_000363.5:c.583A>T) in a
      14-year-old girl with nonobstructive hypertrophic cardiomyopathy who
      presented with cardiopulmonary arrest from ventricular fibrillation and
      showed progressive myocardial fibrosis and left ventricular remodeling.
      Illustrates paediatric-onset CMH7 arising de novo.
    gene:
      preferred_term: TNNI3
      term:
        id: hgnc:11947
        label: TNNI3
  - name: TNNI3 Gly203Ser
    description: >-
      Human disease-causing variant modelled in the cTnI-G203S transgenic mouse,
      which reproduces the full hypertrophic cardiomyopathy phenotype including
      left ventricular hypertrophy, myocyte disarray, interstitial fibrosis, and
      abnormal calcium cycling, together with an atrial substrate for atrial
      fibrillation.
    gene:
      preferred_term: TNNI3
      term:
        id: hgnc:11947
        label: TNNI3
  - name: TNNI3 c.235C>T (p.Arg79Cys)
    description: >-
      A missense allele that this entry previously cited for generic allelic
      heterogeneity without curating as a variant. It is the subject of a
      dedicated 2024 study that identified it as the disease-causing variant in
      an HCM family and characterised its cellular consequences: upregulation of
      the hypertrophy markers ANP, BNP and MYH7, increased cardiomyocyte size,
      ERK pathway activation, and impaired mitochondrial function with increased
      autophagy and apoptosis in transfected human AC16 cardiomyocytes. Two
      caveats are stated rather than buried. First, unlike Arg145Gly and
      Lys206Gln, causality here rests on one family plus a transfection model,
      not on linkage or a documented de novo event. Second, the supporting
      study's own conclusion is hedged - the variant "may be a pathogenic
      factor" - so this allele should not be treated as equivalent in evidential
      weight to the founding CMH7 alleles.
    gene:
      preferred_term: TNNI3
      term:
        id: hgnc:11947
        label: TNNI3
    evidence:
    - reference: PMID:39426416
      reference_title: Mechanisms of pathogenicity in the hypertrophic cardiomyopathy-associated TNNI3 c.235C > T variant.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The TNNI3 c.235C > T mutation was identified as the disease-causing
        variant in the family.
      explanation: >-
        The clinical basis for curating this allele: family-level identification
        as the disease-causing variant.
    - reference: PMID:39426416
      reference_title: Mechanisms of pathogenicity in the hypertrophic cardiomyopathy-associated TNNI3 c.235C > T variant.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        This mutation led to the upregulation of hypertrophy-associated genes
        ANP, BNP, and MYH7, increased cardiomyocyte size, and activation of the
        ERK signaling pathway.
      explanation: >-
        The cellular hypertrophic phenotype in transfected AC16 human
        cardiomyocytes, which is the functional support for pathogenicity.
    - reference: PMID:39426416
      reference_title: Mechanisms of pathogenicity in the hypertrophic cardiomyopathy-associated TNNI3 c.235C > T variant.
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: >-
        The TNNI3 c.235C > T gene mutation may be a pathogenic factor for HCM,
        showing heterogeneous features and clinical phenotypes.
      explanation: >-
        The authors' own hedged conclusion, curated PARTIAL and quoted verbatim

name: Hypertrophic Cardiomyopathy 7
creation_date: "2026-08-01T00:00:00Z"
synonyms:
- CMH7
- TNNI3 hypertrophic cardiomyopathy
- cardiomyopathy, familial hypertrophic, type 7
- cardiomyopathy, hypertrophic, 7
- hypertrophic cardiomyopathy type 7
- hypertrophic cardiomyopathy caused by mutation in TNNI3
description: >-
  Hypertrophic cardiomyopathy 7 (CMH7, OMIM 613690) is the TNNI3-related form of
  familial hypertrophic cardiomyopathy. TNNI3 encodes cardiac troponin I, the
  inhibitory subunit of the thin-filament troponin complex, which in diastole
  binds actin-tropomyosin and holds the thin filament in a blocked state, and in
  systole releases that inhibition when calcium binds troponin C. Cardiac
  troponin I was identified as the seventh hypertrophic cardiomyopathy gene by
  Kimura and colleagues in 1997 — hence the CMH7 designation — after screening
  the cardiac sarcomere genes in 184 unrelated probands. Disease-associated
  variants are predominantly heterozygous missense changes that impair the
  inhibitory and protein-partner functions of cardiac troponin I; the resulting
  myofilament calcium hypersensitivity, perturbed length-dependent activation,
  and impaired relaxation drive cardiomyocyte hypertrophy, myocyte disarray, and
  interstitial fibrosis, producing left ventricular hypertrophy with diastolic
  dysfunction and an arrhythmic substrate. TNNI3 accounts for roughly 3%–5% of
  genotyped hypertrophic cardiomyopathy, and the phenotype is heterogeneous:
  wall thickening is on average less marked than in thick-filament (MYH7,
  MYBPC3) disease, progression to advanced heart failure can be faster, and some
  variants — notably the South Lebanese founder allele p.Arg21Cys — confer a
  malignant course with sudden cardiac death even in carriers without overt
  hypertrophy. ClinGen's Hypertrophic Cardiomyopathy Gene Curation Expert Panel
  classifies the TNNI3–hypertrophic cardiomyopathy relationship as Definitive
  with autosomal dominant inheritance. TNNI3 is an allelic-series gene: distinct
  MONDO entities cover TNNI3-related restrictive cardiomyopathy (RCM1) and
  dilated cardiomyopathy (CMD1FF), and this entry is scoped strictly to the
  hypertrophic node.

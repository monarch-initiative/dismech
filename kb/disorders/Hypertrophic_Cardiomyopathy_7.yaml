- name: Cardiomyocyte Hypertrophy, Myocyte Disarray and Interstitial Fibrosis
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Ventricular Remodeling"
  biological_scale: TISSUE
  role: central_effector
  description: >-
    The remodeling myocardium of hypertrophic cardiomyopathy is defined
    histologically by three co-occurring features: cardiomyocyte hypertrophy,
    myocyte and myofibrillar disarray, and interstitial fibrosis from activated
    cardiac fibroblasts depositing excess collagen. In TNNI3 disease this triad
    is reproduced in the cTnI-G203S transgenic mouse and is seen in autopsy
    myocardium from carriers of the malignant p.Arg21Cys founder allele. The
    fibrotic and disarrayed myocardium is both the substrate of diastolic
    stiffening and the electrical substrate for re-entrant arrhythmia; in
    surgical series the degree of disarray and fibrosis tracks with defibrillator
    implantation and atrial fibrillation.

- name: Myofilament Calcium Hypersensitization and Impaired Relaxation
  biological_scale: MOLECULAR
  role: amplifier
  description: >-
    Loss of troponin I inhibition shifts the force-calcium relationship
    leftward: the thin filament activates at lower calcium concentrations,
    cross-bridges are recruited inappropriately during diastole, and relaxation
    is slowed. In human hypertrophic cardiomyopathy myocardium this
    hypersensitivity is accompanied by hypophosphorylation of protein kinase A
    targets and by blunted length-dependent activation — the myofilament basis
    of the Frank-Starling response — and in TNNI3-mutant samples replacing the
    mutant troponin with wild-type protein restores length-dependent activation,
    establishing the troponin lesion as causal rather than secondary. The energy
    cost of contraction rises and diastolic filling is impaired, the proximate
    driver of the hypertrophic response.
  cell_types:
  - preferred_term: Cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: Regulation of cardiac muscle cell contraction
    term:
      id: GO:0086004
      label: regulation of cardiac muscle cell contraction
    modifier: ABNORMAL
  - preferred_term: Relaxation of cardiac muscle
    term:
      id: GO:0055119
      label: relaxation of cardiac muscle
    modifier: DECREASED
  evidence:
  - reference: PMID:23508784
    reference_title: Perturbed length-dependent activation in human hypertrophic cardiomyopathy with missense sarcomeric gene mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Replacement of mutant by wild-type troponin in TNNT2mut and TNNI3mut
      corrected length-dependent activation to donor values.
    explanation: >-
      Demonstrates in human TNNI3-mutant myocardium that the mutant troponin
      itself causes the perturbed length-dependent activation, since restoring
      wild-type troponin normalizes it.
  - reference: PMID:23508784
    reference_title: Perturbed length-dependent activation in human hypertrophic cardiomyopathy with missense sarcomeric gene mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Length-dependent activation was significantly smaller in all HCM than in
      donor samples.
    explanation: >-
      Quantifies the blunted length-dependent activation in hypertrophic
      cardiomyopathy myocardium relative to non-failing donor hearts.
  - reference: PMID:32885985
    reference_title: Founder Mutation in N Terminus of Cardiac Troponin I Causes Malignant Hypertrophic Cardiomyopathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In model organisms, it impairs PKA (protein kinase A) phosphorylation,
      increases calcium sensitivity, and causes diastolic dysfunction.
    explanation: >-
      Links the specific TNNI3 p.Arg21Cys lesion to impaired PKA phosphorylation,
      increased calcium sensitivity, and diastolic dysfunction in animal models.
  - reference: PMID:16950368
    reference_title: Molecular insights from a novel cardiac troponin I mouse model of familial hypertrophic cardiomyopathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Ca2+ cycling was abnormal in adult cardiomyocytes extracted from cTnI-G203S
      mice, with a prolonged decay constant in Ca2+ transients and a reduced
      decay constant in response to caffeine treatment.
    explanation: >-
      In vivo evidence of disturbed calcium handling and slowed relaxation in
      cardiomyocytes carrying a human CMH7 troponin I variant.
  downstream:
  - target: Cardiomyocyte Hypertrophy, Myocyte Disarray and Interstitial Fibrosis
  - target: Left Ventricular Hypertrophy with Diastolic Dysfunction

- name: Hypertrophic Signaling and Metabolic Stress
  biological_scale: CELLULAR
  role: amplifier
  description: >-
    Beyond the mechanical defect, TNNI3-mutant cardiomyocytes activate
    hypertrophic signal transduction — ERK cascade activation with induction of
    the fetal gene programme (natriuretic peptides and beta-myosin heavy chain) —
    and show mitochondrial and metabolic derangement with increased autophagy and
    apoptosis. Whether this arm is a general consequence of increased mechanical
    and energetic load or a variant-specific proteotoxic effect is unresolved; it
    is curated as an EMERGING mechanistic hypothesis.

    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Despite numerous identified TNNI3 mutations associated with HCM, their
      severity, prevalence, and disease progression vary.
    explanation: >-
      Documents the allelic heterogeneity that makes variant-level rather than
      gene-level interpretation necessary in TNNI3.
diagnosis:
- name: Echocardiography
  description: >-
    First-line imaging. Measures maximal left ventricular wall thickness,
    identifies asymmetric septal hypertrophy and systolic anterior motion of the
    mitral valve, quantifies the resting and provoked outflow tract gradient, and
    assesses diastolic function by tissue Doppler. It is also the surveillance
    modality for genotype-positive, phenotype-negative relatives, in whom tissue
    Doppler abnormalities may precede overt hypertrophy.
  diagnosis_term:
    preferred_term: echocardiography
    term:
      id: NCIT:C16525
      label: Echocardiography Test
  evidence:
  - reference: PMID:32885985
    reference_title: Founder Mutation in N Terminus of Cardiac Troponin I Causes Malignant Hypertrophic Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In select carriers without left ventricular hypertrophy on echocardiogram,
      SCD occurred, myocyte disarray was found on autopsy heart, and tissue
      Doppler and cardiac magnetic resonance imaging identified subclinical
      disease features such as diastolic dysfunction and late gadolinium
      enhancement.
    explanation: >-
      Shows both the role of echocardiography and its limitation in TNNI3
      carriers: normal wall thickness does not exclude disease, and tissue
      Doppler adds subclinical information.
- name: Cardiac Magnetic Resonance with Late Gadolinium Enhancement
  description: >-
    Cardiac magnetic resonance characterizes wall thickness in segments poorly
    seen on echocardiography and quantifies myocardial fibrosis as late
    gadolinium enhancement. LGE is an established marker of arrhythmic risk in
    hypertrophic cardiomyopathy and is detectable in TNNI3 carriers before
    macroscopic hypertrophy.
  diagnosis_term:
    preferred_term: cardiac magnetic resonance imaging with late gadolinium enhancement
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:33171204
    reference_title: "Risk stratification using late gadolinium enhancement on cardiac magnetic resonance imaging in patients with hypertrophic cardiomyopathy: A systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These data support the routine use of LGE on c-MRI as a marker of SCD risk
      in this population.
    explanation: >-
      Meta-analysis of 8 prospective studies and 3,808 patients supporting routine
      LGE assessment for sudden-death risk stratification in hypertrophic
      cardiomyopathy.
- name: Cardiomyopathy Multigene Panel Sequencing
  description: >-
    Sequencing of a curated cardiomyopathy gene panel establishes the molecular
    diagnosis, enables cascade testing of relatives, and — for TNNI3 — may inform
    risk stratification, since specific alleles such as p.Arg21Cys carry a
    malignant prognosis. Panel content matters: most genes historically included
    on HCM panels have limited or no evidence of disease association, so reporting
    should be restricted to curated genes such as TNNI3.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:30681346
    reference_title: Evaluating the Clinical Validity of Hypertrophic Cardiomyopathy Genes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genetic testing for families with hypertrophic cardiomyopathy (HCM)
      provides a significant opportunity to improve care.
    explanation: >-
      States the clinical value of genetic testing in hypertrophic
      cardiomyopathy families.
  - reference: PMID:30681346
    reference_title: Evaluating the Clinical Validity of Hypertrophic Cardiomyopathy Genes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The majority of genes previously reported as causative of HCM and commonly
      included in diagnostic tests have limited or no evidence of disease
      association.
    explanation: >-
      Justifies restricting interpretation to curated definitive genes such as
      TNNI3 rather than reporting variants from the full historical panel.
  - reference: PMID:32885985
    reference_title: Founder Mutation in N Terminus of Cardiac Troponin I Causes Malignant Hypertrophic Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genetic diagnosis with this mutation may be sufficient for risk
      stratification for SCD.
    explanation: >-
      Documents a TNNI3 genotype for which the molecular result alone carries
      prognostic weight.
differential_diagnoses:
- name: Hypertrophic cardiomyopathy of another sarcomeric genotype
  description: >-
    MYBPC3, MYH7, TNNT2, TPM1, ACTC1, MYL2, and MYL3 are the other genes with
    definitive evidence for hypertrophic cardiomyopathy. Thick-filament genotypes
    (MYH7, MYBPC3) are far more common and tend to produce greater maximal wall
    thickness; the phenotypes overlap and only genetic testing distinguishes them.
  distinguishing_features:
  - Molecular testing identifying the causal gene is the only definitive discriminator.
  - Lower maximal wall thickness with faster progression to advanced heart failure is more typical of thin-filament genotypes such as TNNI3.
  evidence:
  - reference: PMID:30681346
    reference_title: Evaluating the Clinical Validity of Hypertrophic Cardiomyopathy Genes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of 33 HCM genes, only 8 (24%) were categorized as definitive ( MYBPC3, MYH7,
      TNNT2, TNNI3, TPM1, ACTC1, MYL2, and MYL3)
    explanation: >-
      Enumerates the definitive-evidence hypertrophic cardiomyopathy genes that
      constitute this genotypic differential.
- name: Non-sarcomeric hypertrophic cardiomyopathy phenocopies
  description: >-
    Cardiac amyloidosis, Fabry disease, glycogen storage disorders (including
    PRKAG2 and LAMP2 disease), RASopathies, and mitochondrial disease all produce
    increased left ventricular wall thickness that mimics sarcomeric hypertrophic
    cardiomyopathy but have distinct, often treatable, causes.
  distinguishing_features:
  - Extracardiac features, characteristic ECG patterns, CMR tissue characterization, and targeted laboratory tests point to a phenocopy.
  - Identification of a pathogenic TNNI3 variant with an appropriate family history establishes sarcomeric disease.
  evidence:
  - reference: PMID:41463072
    reference_title: "Hypertrophic Cardiomyopathy Phenocopies: Classification, Key Features, and Differential Diagnosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      However, numerous non-sarcomeric phenocopies exist, including amyloidosis,
      Fabry disease, glycogen storage disorders, RASopathies, and mitochondrial
      diseases.
    explanation: >-
      Enumerates the phenocopy differential. Evidence source is OTHER because
      this is a narrative review.
  - reference: PMID:41463072
    reference_title: "Hypertrophic Cardiomyopathy Phenocopies: Classification, Key Features, and Differential Diagnosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Correct identification of an HCM phenocopy carries important therapeutic
      implications, as disease-specific treatments can significantly improve
      prognosis.
    explanation: >-
      Explains why the phenocopy differential is clinically consequential rather
      than merely nosological.
- name: Secondary left ventricular hypertrophy from loading conditions
  description: >-
    Hypertension, aortic stenosis, and athletic remodeling all thicken the left
    ventricular wall. Hypertrophic cardiomyopathy is defined by wall thickening
    that is not explained by such loading conditions.
  distinguishing_features:
  - A sufficient hemodynamic explanation (uncontrolled hypertension, valvular obstruction) or regression with deconditioning argues against hypertrophic cardiomyopathy.
  - Wall thickness of 15 mm or more without an adequate loading explanation, with disarray-type features on imaging or a pathogenic sarcomere variant, favors hypertrophic cardiomyopathy.
  evidence:
  - reference: PMID:41463072
    reference_title: "Hypertrophic Cardiomyopathy Phenocopies: Classification, Key Features, and Differential Diagnosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      They are defined by a left ventricular wall thickness ≥15 mm in the absence
      of other causes such as loading conditions, ischemia, or valvular disease.
    explanation: >-
      States the exclusion of loading conditions, ischemia, and valvular disease
      that defines the hypertrophic phenotype.
- name: TNNI3-related restrictive and dilated cardiomyopathy
  description: >-
    TNNI3 variants also cause restrictive cardiomyopathy (RCM1, MONDO:0011400)
    and dilated cardiomyopathy (CMD1FF), which are separate MONDO entities with
    different ventricular geometry and physiology. Within a single TNNI3 kindred
    the expressed phenotype must be determined clinically rather than assumed
    from the gene.
  distinguishing_features:
  - Non-dilated, non-hypertrophied ventricles with severe biatrial enlargement and restrictive filling indicate the restrictive entity.
  - Ventricular dilation with reduced ejection fraction indicates the dilated entity.
  - Unexplained left ventricular wall thickening with preserved or supranormal ejection fraction indicates the hypertrophic entity curated here.
  evidence:
  - reference: PMID:12531876
    reference_title: Idiopathic restrictive cardiomyopathy is part of the clinical expression of cardiac troponin I mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We recognized a large family in which individuals were affected by either
      idiopathic RCM or hypertrophic cardiomyopathy (HCM).
    explanation: >-
      The landmark report establishing TNNI3-related restrictive cardiomyopathy
      as a distinct expression of the same gene, and demonstrating that the
      restrictive and hypertrophic phenotypes can co-occur within one kindred —
      the reason this differential exists. Cited here only to scope the
      hypertrophic entity against its restrictive sibling; no restrictive-cohort
      finding is used elsewhere in this entry.
  - reference: PMID:39426416
    reference_title: Mechanisms of pathogenicity in the hypertrophic cardiomyopathy-associated TNNI3 c.235C > T variant.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Despite numerous identified TNNI3 mutations associated with HCM, their
      severity, prevalence, and disease progression vary.
    explanation: >-
      Supports the allelic and phenotypic heterogeneity of TNNI3; PARTIAL because
      the quote addresses variability within the hypertrophic phenotype rather
      than naming the restrictive and dilated entities.
progression:
- phase: Age at onset spans childhood to old age
  notes: >-
    CMH7 has an unusually wide onset distribution. At one end, de novo TNNI3
    variants cause paediatric disease presenting with cardiac arrest, and the
    Lebanese p.Arg21Cys founder cohort was ascertained for early-onset disease
    with a median age at sudden death of 22.5 years. At the other, TNNI3 is
    over-represented among elderly-onset hypertrophic cardiomyopathy, where
    family history is typically noncontributory. Age at presentation therefore
    should not be used to include or exclude a TNNI3 aetiology.
  evidence:
  - reference: PMID:38548731
    reference_title: Pediatric hypertrophic cardiomyopathy caused by a novel TNNI3 variant.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genetic testing revealed a novel de novo heterozygous missense variant in
      TNNI3, NM_000363.5:c.583A>T (p.Ile195Phe), which was determined to be the
      pathogenic variant.
    explanation: >-
      Documents paediatric-onset CMH7 from a de novo TNNI3 variant.
  - reference: PMID:11815426
    reference_title: Sarcomere protein gene mutations in hypertrophic cardiomyopathy of the elderly.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Rather, mutations in cardiac myosin binding protein-C, troponin I, and
      alpha-cardiac myosin heavy chain caused elderly-onset hypertrophic
      cardiomyopathy.
    explanation: >-
      Establishes troponin I as one of the three genes over-represented in
      elderly-onset hypertrophic cardiomyopathy, the opposite end of the CMH7
      onset range.
  - reference: PMID:11815426
    reference_title: Sarcomere protein gene mutations in hypertrophic cardiomyopathy of the elderly.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The distribution of mutations in elderly-onset disease is strikingly
      different (P<0.00001) from that of familial, early onset hypertrophic
      cardiomyopathy.
    explanation: >-
      Quantifies the genotype shift with age at onset that places TNNI3 in the
      late-onset group.
- phase: Genotype-positive, phenotype-negative
  notes: >-
    A relative identified by cascade testing may carry the TNNI3 variant with
    normal wall thickness on echocardiography. Penetrance is incomplete and
    age-dependent, so serial imaging and rhythm surveillance rather than
    treatment is the correct posture. For the p.Arg21Cys founder allele this
    stage is not reliably benign: sudden death has occurred in carriers with a
    normal echocardiogram.
  evidence:
  - reference: PMID:32885985
    reference_title: Founder Mutation in N Terminus of Cardiac Troponin I Causes Malignant Hypertrophic Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In select carriers without left ventricular hypertrophy on echocardiogram,
      SCD occurred
    explanation: >-
      Establishes that the genotype-positive, imaging-negative stage can still
      carry lethal arrhythmic risk in TNNI3 disease.
- phase: Subclinical expression
  notes: >-
    Before overt hypertrophy, tissue Doppler may show impaired relaxation and
    cardiac magnetic resonance may show late gadolinium enhancement, indicating
    that the fibrotic and diastolic components of the disease precede the
    morphological one.
  evidence:
  - reference: PMID:32885985
    reference_title: Founder Mutation in N Terminus of Cardiac Troponin I Causes Malignant Hypertrophic Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      tissue Doppler and cardiac magnetic resonance imaging identified subclinical
      disease features such as diastolic dysfunction and late gadolinium
      enhancement
    explanation: >-
      Documents the measurable subclinical phase in TNNI3 variant carriers.
- phase: Overt hypertrophic cardiomyopathy
  notes: >-
    Established left ventricular hypertrophy with exertional dyspnoea, chest
    pain, palpitations, or syncope; obstruction in a subset; atrial fibrillation
    with advancing age. Standard hypertrophic cardiomyopathy management and
    sudden-death risk stratification apply at this stage. In thin-filament
    disease maximal wall thickness is typically lower than in thick-filament
    disease and septal reduction therapy is less often required.
  evidence:
  - reference: PMID:39941537
    reference_title: "Clinical Features and Prospective Outcomes of Thin-Filament Hypertrophic Cardiomyopathy: Intrinsic Data and Comparative Insights from Other Cohorts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      showed more rapid progression to advanced heart failure (HR = 5.6,
      p = 0.018), and less often underwent septal reduction therapy (p = 0.025)
    explanation: >-
      Characterizes the clinical course of thin-filament hypertrophic
      cardiomyopathy, the class that includes TNNI3, over nearly five years of
      follow-up.
- phase: Advanced disease and sudden death
  notes: >-
    Two competing endpoints: progression to advanced heart failure (in
    thin-filament disease faster than in thick-filament disease, with a hazard
    ratio of 5.6 in one prospective comparison) and sudden cardiac death from
    ventricular arrhythmia, which in malignant TNNI3 genotypes occurs in early
    adulthood.
  evidence:
  - reference: PMID:32885985
    reference_title: Founder Mutation in N Terminus of Cardiac Troponin I Causes Malignant Hypertrophic Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      TNNI3 p.Arg21Cys-related cardiomyopathy manifested a malignant
      phenotype-SCD occurred in 30 (53%) of 57 affected individuals at a median
      age of 22.5 years.
    explanation: >-
      Quantifies the sudden-death endpoint and its early median age for a
      malignant TNNI3 genotype.
treatments:
- name: Negative Inotropic Pharmacotherapy
  description: >-
    Beta-blockers are first-line for symptomatic disease, with non-dihydropyridine
    calcium channel blockers (verapamil) as an alternative and disopyramide added
    for refractory obstructive symptoms. These agents reduce heart rate, prolong
    diastolic filling, and blunt the dynamic outflow gradient. There is no
    TNNI3-specific pharmacotherapy; management follows generic hypertrophic
    cardiomyopathy guidelines.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: negative inotropic pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: beta-blocker
      term:
        id: NCIT:C29576
        label: Beta-Adrenergic Antagonist
    - preferred_term: non-dihydropyridine calcium channel blocker
      term:
        id: NCIT:C333
        label: Calcium Channel Blocker
    - preferred_term: disopyramide
      term:
        id: NCIT:C61730
        label: Disopyramide
  target_mechanisms:
  - target: Left Ventricular Hypertrophy with Diastolic Dysfunction
    treatment_effect: MODULATES
    description: >-
      Slowing the heart rate lengthens diastole and improves filling of the stiff
      ventricle, and negative inotropy reduces the dynamic outflow gradient.
  evidence:
  - reference: PMID:21389910
    reference_title: Medical management of hypertrophic cardiomyopathy.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Throughout the years, numerous medical treatments have been used to achieve
      symptom control in these patients, and include medications such as
      beta-blockers, calcium channel blockers, amiodarone, disopyramide, and
      angiotensin receptor blockers.
    explanation: >-
      Enumerates the pharmacological armamentarium for symptom control in
      hypertrophic cardiomyopathy. Evidence source is OTHER because this is a
      management review.
- name: Cardiac Myosin Inhibition
  description: >-
    Mavacamten is a first-in-class cardiac myosin inhibitor that reduces
    actin-myosin cross-bridge formation and directly targets the
    hypercontractility that is the physiological consequence of the sarcomere
    lesion. In the phase 3 EXPLORER-HCM trial it improved exercise capacity,
    outflow gradient, NYHA class, and health status in symptomatic obstructive
    hypertrophic cardiomyopathy. The trial enrolled obstructive hypertrophic
    cardiomyopathy irrespective of genotype, so its applicability to CMH7 is by
    inclusion in that clinical phenotype rather than by TNNI3-specific evidence.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: cardiac myosin inhibitor therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: mavacamten (cardiac myosin inhibitor)
    - preferred_term: aficamten
      term:
        id: CHEBI:747213
        label: aficamten
  target_mechanisms:
  - target: Myofilament Calcium Hypersensitization and Impaired Relaxation
    treatment_effect: INHIBITS
    description: >-
      Cardiac myosin inhibition reduces the number of force-generating
      cross-bridges, counteracting the hypercontractile state produced by the
      thin-filament lesion.
  evidence:
  - reference: PMID:32871100
    reference_title: "Mavacamten for treatment of symptomatic obstructive hypertrophic cardiomyopathy (EXPLORER-HCM): a randomised, double-blind, placebo-controlled, phase 3 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatment with mavacamten improved exercise capacity, LVOT obstruction, NYHA
      functional class, and health status in patients with obstructive
      hypertrophic cardiomyopathy.
    explanation: >-
      Pivotal randomised placebo-controlled evidence for cardiac myosin
      inhibition in obstructive hypertrophic cardiomyopathy.
  - reference: PMID:32871100
    reference_title: "Mavacamten for treatment of symptomatic obstructive hypertrophic cardiomyopathy (EXPLORER-HCM): a randomised, double-blind, placebo-controlled, phase 3 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We aimed to assess the efficacy and safety of mavacamten, a first-in-class
      cardiac myosin inhibitor, in symptomatic obstructive hypertrophic
      cardiomyopathy.
    explanation: >-
      Identifies the mechanism of action targeted by this treatment entry.
  - reference: PMID:38739079
    reference_title: "Aficamten for Symptomatic Obstructive Hypertrophic Cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The results for all 10 secondary end points were significantly improved
      with aficamten as compared with placebo.
    explanation: >-
      Independent randomised phase 3 confirmation of the cardiac myosin
      inhibitor class with a second agent (aficamten, SEQUOIA-HCM), folded into
      this treatment rather than curated separately because it acts on the same
      node by the same mechanism.
  notes: >-
    Aficamten is folded into this treatment rather than given its own entry
    because it is the same mechanistic class acting on the same pathograph node;
    splitting would duplicate the target_mechanisms edge without adding a
    distinct mechanistic claim. Neither trial was genotype-stratified - both
    enrolled obstructive hypertrophic cardiomyopathy by phenotype - so neither
    supports a TNNI3-specific effect, and the applicability argument for CMH7 is
    mechanistic rather than empirical. mavacamten deliberately carries no
    ontology term: NCIT:C174901 exists but sits under Inotropic Support rather
    than Pharmacologic Substance, so it is not reachable from the
    ChemicalEntityTerm enum roots, and CHEBI has no mavacamten term; aficamten is
    reachable and carries CHEBI:747213.
- name: Septal Reduction Therapy
  description: >-
    Surgical septal myectomy, or alcohol septal ablation in selected patients,
    relieves drug-refractory left ventricular outflow tract obstruction by
    removing or infarcting the hypertrophied basal septum. It is used less often
    in thin-filament genotypes such as TNNI3, consistent with their lower maximal
    wall thickness.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: septal myectomy
    term:
      id: NCIT:C157806
      label: Cardiac Surgery
  target_mechanisms:
  - target: Left Ventricular Hypertrophy with Diastolic Dysfunction
    treatment_effect: MODULATES
    description: >-
      Removing hypertrophied septal muscle abolishes the dynamic subaortic
      gradient and the associated mitral regurgitation.
  evidence:
  - reference: PMID:33926651
    reference_title: Myocardial Histopathology in Patients With Obstructive Hypertrophic Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The authors reviewed the pathological findings of the myocardial specimens
      from 1,836 patients with obstructive HCM who underwent septal myectomy from
      2000 to 2016.
    explanation: >-
      Documents septal myectomy as established practice for obstructive
      hypertrophic cardiomyopathy in a large contemporary surgical series.
  - reference: PMID:39941537
    reference_title: "Clinical Features and Prospective Outcomes of Thin-Filament Hypertrophic Cardiomyopathy: Intrinsic Data and Comparative Insights from Other Cohorts."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      less often underwent septal reduction therapy (p = 0.025)
    explanation: >-
      Supports the lower utilisation of septal reduction in thin-filament
      genotypes; PARTIAL because it reports observed practice rather than a
      recommendation.
- name: Implantable Cardioverter Defibrillator
  description: >-
    Device therapy for primary or secondary prevention of sudden cardiac death in
    patients judged to be at high arrhythmic risk. Extent of late gadolinium
    enhancement on cardiac magnetic resonance is an established risk marker
    feeding this decision, and for some TNNI3 genotypes the molecular result
    itself may be sufficient for risk stratification.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: implantable cardioverter-defibrillator placement
    term:
      id: NCIT:C80435
      label: Implantable Cardioverter-Defibrillator Placement
  target_mechanisms:
  - target: Arrhythmogenic Substrate
    treatment_effect: MODULATES
    description: >-
      The device does not modify the arrhythmogenic substrate but terminates the
      ventricular arrhythmia it generates, converting a lethal event into a
      survivable one.
  evidence:
  - reference: PMID:33171204
    reference_title: "Risk stratification using late gadolinium enhancement on cardiac magnetic resonance imaging in patients with hypertrophic cardiomyopathy: A systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In patients with HCM, LGE on c-MRI is a strong predictor of arrhythmic
      outcomes including SCD, aborted SCD, and appropriate ICD therapy.
    explanation: >-
      Supports imaging-based selection of hypertrophic cardiomyopathy patients for
      defibrillator therapy.
  - reference: PMID:32885985
    reference_title: Founder Mutation in N Terminus of Cardiac Troponin I Causes Malignant Hypertrophic Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genetic diagnosis with this mutation may be sufficient for risk
      stratification for SCD.
    explanation: >-
      Supports genotype-informed defibrillator decision-making for a specific
      malignant TNNI3 allele.
- name: Anticoagulation for Atrial Fibrillation
  description: >-
    Atrial fibrillation is already curated as a phenotype of this entity, and in
    hypertrophic cardiomyopathy its presence is itself the indication for
    anticoagulation - the thromboembolic risk conferred by the cardiomyopathy
    substrate is high enough that the risk scores used in atrial fibrillation
    without a cardiomyopathy are not the gate. Recording it closes an
    intervention join point that this entry's own pathograph already exposes:
    Arrhythmogenic Substrate is the node the ICD entry attaches to, and the
    atrial arm of that substrate had no treatment attached to it at all.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: anticoagulant agent
      term:
        id: NCIT:C263
        label: Anticoagulant Agent
  target_mechanisms:
  - target: Arrhythmogenic Substrate
    treatment_effect: INHIBITS
    description: >-
      Anticoagulation does not modify the arrhythmogenic substrate itself; it
      blocks the thrombus-formation step that converts atrial fibrillation
      arising from that substrate into systemic embolization.
  target_phenotypes:
  - preferred_term: Atrial fibrillation
    term:
      id: HP:0005110
      label: Atrial fibrillation
  notes: >-
    Deliberately unsourced at the TNNI3 level and bound at drug-class rather than
    agent level. No TNNI3-specific anticoagulation study exists, and the choice
    between a direct oral anticoagulant and a vitamin K antagonist is not
    genotype-determined. The indication is guideline-directed hypertrophic
    cardiomyopathy management; the guideline record cached for this entry
    (PMID:38718139) carries only AIM/METHODS/STRUCTURE sections with no quotable
    recommendation text, so no snippet is claimed rather than a citation being
    attached that does not support the claim.
- name: Heart Transplantation
  description: >-
    Transplantation for end-stage disease, which is the terminal phase this
    entry's own progression modelling and its Heart Failure and Sudden Cardiac
    Death node already describe. It is the only intervention that alters
    survival once the ventricle has failed, and it is the point at which cardiac
    myosin inhibition becomes inappropriate rather than helpful, since that class
    is indicated for obstructive physiology and not for a failing, dilating
    ventricle.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Heart Transplantation
    term:
      id: NCIT:C15246
      label: Heart Transplantation
  target_mechanisms:
  - target: Heart Failure and Sudden Cardiac Death
    treatment_effect: BYPASSES
    description: >-
      Replacement of the failing ventricle removes the substrate for both
      terminal outcomes rather than modifying the upstream sarcomere lesion.
  notes: >-
    Deliberately unsourced at the TNNI3 level. No published series reports
    transplantation outcomes in TNNI3 carriers specifically; this records the
    indication implied by the advanced-disease phase already modelled in this
    entry, not an outcome observed in CMH7 patients. Guideline-directed, with the
    same no-quotable-recommendation caveat as the anticoagulation entry above.
- name: Cascade Genetic Testing and Counseling
  description: >-
    Once a pathogenic TNNI3 variant is identified in a proband, first-degree
    relatives are offered predictive testing; carriers enter clinical
    surveillance and non-carriers are released from it. Counseling covers the
    autosomal dominant 50% recurrence risk, incomplete and age-dependent
    penetrance, and — for malignant alleles — the possibility of sudden death
    before hypertrophy is detectable.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: genetic counseling

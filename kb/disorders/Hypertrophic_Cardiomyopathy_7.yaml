      Cardiac troponin I (TNNI3) gene mutations account for 3% of hypertrophic
      cardiomyopathy and carriers have a heterogeneous phenotype, with increased
      risk of sudden cardiac death (SCD).
    explanation: >-
      Gives the TNNI3 share of hypertrophic cardiomyopathy cases, which bounds
      the rarity of CMH7 but is a genotype fraction rather than a population
      prevalence, hence PARTIAL.
inheritance:
- name: Autosomal Dominant
  description: >-
    CMH7 is transmitted as an autosomal dominant trait: affected individuals
    carry a single heterozygous TNNI3 variant, with incomplete penetrance and
    variable expressivity within families. De novo occurrence is documented
    (the Lys206Gln allele in the original series).

experimental_models:
- name: Reconstituted human cardiac thin filament with mutant troponin I
  description: >-
    Biochemical reconstitution comparing wild-type human troponin complex with
    the HCM-associated K206I cardiac troponin I variant in a regulated actomyosin
    system, plus troponin exchange into detergent-extracted cardiac fibers for
    force measurement. Isolates the effect of the variant on calcium sensitivity
    and on the inhibitory function of troponin I independent of remodeling.
  experimental_model_type: OTHER
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  publication: PMID:26553696
  modeled_mechanisms:
  - target: Cardiac Troponin I Inhibitory Dysfunction
    description: >-
      Directly measures the loss of troponin I inhibition of actomyosin ATPase in
      the absence of calcium-bound troponin C.
  - target: Myofilament Calcium Hypersensitization and Impaired Relaxation
    description: >-
      Quantifies the leftward shift in the calcium dependence of thin-filament
      activation caused by the variant.
  evidence:
  - reference: PMID:26553696
    reference_title: Green Tea Catechin Normalizes the Enhanced Ca2+ Sensitivity of Myofilaments Regulated by a Hypertrophic Cardiomyopathy-Associated Mutation in Human Cardiac Troponin I (K206I).
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      To determine molecular mechanism(s) of the mutant human cardiac troponin I
      (K206I), we tested the Ca(2+) dependence of thin filament-activated
      myosin-S1-ATPase activity in a reconstituted, regulated, actomyosin system
    explanation: >-
      Describes the reconstituted system and its readout as applied to an
      HCM-associated TNNI3 variant.
discussions:
- discussion_id: tnni3_allelic_series_hcm_rcm_dcm
  prompt: >-
    TNNI3 causes hypertrophic (CMH7), restrictive (RCM1), and dilated (CMD1FF)
    cardiomyopathy. Should dismech keep these as separate gene-specific entries,
    and how should evidence be partitioned between them?
  kind: INTERPRETATION
  status: OPEN
  attaches_to:
  - pathophysiology#Cardiac Troponin I Inhibitory Dysfunction
  rationale: >-
    MONDO models the three TNNI3 cardiomyopathies as distinct entities
    (MONDO:0013369 hypertrophic, MONDO:0011400 restrictive, and the dilated
    node), and dismech follows MONDO for disease_term. The shared molecular
    lesion — impaired troponin I inhibition of the thin filament — is common to
    all three, but the direction of the myofilament perturbation and the
    resulting ventricular geometry differ, and the clinical management differs
    substantially. This entry is scoped strictly to the hypertrophic node: every
    evidence item was checked to be about a hypertrophic-phenotype cohort,
    variant, or model, and no restrictive- or dilated-phenotype literature was
    used. Whether a future lumped "TNNI3-related cardiomyopathy" entity would
    better reflect the biology is left open; if the field converges there, this
    entry should be revisited rather than duplicated.
  evidence:
  - reference: PMID:39426416
    reference_title: Mechanisms of pathogenicity in the hypertrophic cardiomyopathy-associated TNNI3 c.235C > T variant.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The link between TNNI3 variants and phenotypes remains largely unexplored.
    explanation: >-
      Records that TNNI3 genotype-phenotype correlation is unresolved, which is
      the substance of this discussion.
references:
- reference: PMID:20301725
  title: Nonsyndromic Hypertrophic Cardiomyopathy Overview.
  tags:
  - GeneReviews
- reference: PMID:38718139
  title: "2024 AHA/ACC/AMSSM/HRS/PACES/SCMR Guideline for the Management of Hypertrophic Cardiomyopathy: A Report of the American Heart Association/American College of Cardiology Joint Committee on Clinical Practice Guidelines."
notes: >-
  Scope: this entry models MONDO:0013369 (hypertrophic cardiomyopathy 7,
  OMIM:613690), the TNNI3-related hypertrophic node of the TNNI3 allelic series,
  and conforms to the cardiomyopathy_maladaptive_remodeling module at its
  trigger, ventricular-remodeling, contractile-dysfunction, and heart-failure
  nodes. It is deliberately separate from the umbrella
  Hypertrophic_Cardiomyopathy entry (MONDO:0005045), which is not edited here.

  Named Entity Confusion preflight (per CLAUDE.md): MONDO:0013369 was verified
  with OAK before curation. The MONDO definition names TNNI3 as the causal gene
  ("Any hypertrophic cardiomyopathy in which the cause of the disease is a
  mutation in the TNNI3 gene"), the OMIM xref is OMIM:613690, and the synonym
  list includes CMH7 and "TNNI3 hypertrophic cardiomyopathy". TNNI3 is a
  high-NEC-risk gene because it also causes restrictive cardiomyopathy (RCM1)
  and dilated cardiomyopathy (CMD1FF); every citation used here was individually
  checked to concern the hypertrophic phenotype. Specifically: the ClinGen
  assertion cited is the TNNI3/hypertrophic-cardiomyopathy record
  (CGGV:assertion_4a7e6901..., Definitive), not the two
  TNNI3/dilated-cardiomyopathy assertions (Strong) that are also present in the
  cache; the
  ClinGen gene-validity paper cited is the HCM curation (PMID:30681346), not the
  DCM curation (PMID:33947203) that also lists TNNI3; and no restrictive- or
  dilated-cardiomyopathy primary literature was used anywhere in this entry.

  Deep-research provenance: the requested provider (falcon/Edison) was
  unavailable in this environment — neither EDISON_API_KEY nor
  FUTUREHOUSE_API_KEY is present, and `just research-disorder falcon` fails with
  "Provider 'falcon' not available. Available: claude_code". The `claude_code`
  provider was substituted; its report is
  `research/Hypertrophic_Cardiomyopathy_7-deep-research-claude_code.md` (25 web
  searches, 67 turns, 32 citations). The report passed the NEC preflight
  (TNNI3 named 192 times versus 10 for MYBPC3 and 9 for MYH7; OMIM:613690 and
  MONDO:0013369 both match the intended entity). It was treated as leads only:
  the entry's backbone was built independently from PubMed E-utilities searches
  and the ClinGen structured-source cache, and the four report-derived
  references adopted here (PMID:25524337 Coppini thin-filament cohort,
  PMID:11815426 Niimura elderly-onset, PMID:38548731 paediatric de novo case,
  PMID:12531876 Mogensen for the restrictive differential) were each fetched
  with `just fetch-reference` and quoted only from the cached record. One
  report suggestion was rejected on checking: it proposed Apical hypertrophic
  cardiomyopathy (HP:0031992) from the OMIM:613690 HPO annotation set, but the
  cited abstract does not support it and a genotype-morphology study
  (PMID:37561025) places TNNI3 hypertrophy in the anterior wall, interventricular
  septum, and lateral wall while attributing apical predominance to ALPK3, so no
  apical phenotype is curated. The report's Wolff-Parkinson-White suggestion was
  likewise dropped for lack of a quotable primary source.

  Evidence provenance caveats. (1) TNNI3-specific human cohort data are sparse,
  so several items are drawn from thin-filament-wide (PMID:39941537) or
  hypertrophic-cardiomyopathy-wide (PMID:33926651, PMID:33171204, PMID:32871100,
  PMID:41463072) studies; each such explanation states the scope explicitly and
  uses PARTIAL where the inference is indirect. (2) Mavacamten evidence comes
  from EXPLORER-HCM, which enrolled obstructive hypertrophic cardiomyopathy
  irrespective of genotype; there is no TNNI3-specific trial. (3) Mechanistic
  depth relies on the Gly203Ser transgenic mouse (PMID:16950368, PMID:34203369)
  and on reconstituted-myofilament biochemistry for K206I (PMID:26553696); these
  are tagged MODEL_ORGANISM and IN_VITRO respectively and are never the sole
  support for a human phenotype.

  GeneReviews baseline: there is no TNNI3-specific GeneReviews chapter, so the
  applicable resource is "Nonsyndromic Hypertrophic Cardiomyopathy Overview"
  (PMID:20301725), tagged accordingly in `references`. The indexed PubMed record
  contains only the chapter's six-clause purpose statement rather than the
  Clinical Characteristics or Management sections, so section-by-section
  GeneReviews mining is not possible from the cache; the one verbatim-quotable
  clause is cited on the cascade-testing treatment entry. Chapter-level
  phenotypes not quotable from the cached record (chest pain, syncope,
  palpitations, presyncope, exercise intolerance) are therefore not curated as
  separate phenotype entries rather than being supported by fabricated quotes.

  The 2024 AHA/ACC hypertrophic cardiomyopathy guideline (PMID:38718139) is
  listed in `references` for management provenance; its PubMed record is a
  structured AIM/METHODS/STRUCTURE abstract with no quotable clinical
  recommendations, so no evidence item quotes it.

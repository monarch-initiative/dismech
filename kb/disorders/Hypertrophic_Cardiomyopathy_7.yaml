    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The TNNI3 p.Arg21Cys mutation has a founder effect in South Lebanon and
      causes malignant hypertrophic cardiomyopathy with early SCD even in the
      absence of hypertrophy.
    explanation: >-
      Documents sudden cardiac death as a direct endpoint of a TNNI3 hypertrophic
      cardiomyopathy genotype, dissociable from the degree of hypertrophy.

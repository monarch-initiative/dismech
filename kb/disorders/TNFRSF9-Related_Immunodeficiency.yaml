clinical_burden:
  burden_level: HIGH
  rationale: >-
    Untransplanted patients face EBV-driven HLH and lymphoma, and deaths in
    the reported series occurred only among patients who were not
    transplanted. Lymphoma can relapse and transform after chemotherapy.
  evidence:
  - reference: PMID:42144872
    reference_title: "CD137 deficiency patients: two new patients and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All transplanted patients were alive at the last follow-up, whereas mortality occurred exclusively among non-transplanted patients, including EBV-positive cases."
    explanation: Mortality in the reported series supports a high disease burden.
pathophysiology:
- name: Biallelic TNFRSF9 Loss of Function
  description: >-
    Homozygous or compound heterozygous TNFRSF9 variants (missense,
    splice-site, frameshift and large deletions) abolish or markedly reduce
    CD137 protein on activated T, B and NK cells; the founder missense
    p.Gly109Ser also abolishes ligand binding.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: TNFRSF9
    term:
      id: hgnc:11924
      label: TNFRSF9
  molecular_functions:
  - preferred_term: CD137 costimulatory receptor activity
    term:
      id: GO:0038023
      label: signaling receptor activity
    modifier: DECREASED
  evidence:
  - reference: PMID:30872117
    reference_title: "Immunodeficiency and EBV-induced lymphoproliferation caused by 4-1BB deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The 2 patients shared a homozygous G109S missense mutation in 4-1BB that abolished protein expression and ligand binding."
    explanation: The founder variant produces no detectable receptor.
  - reference: PMID:37144041
    reference_title: "CD137 deficiency because of two novel biallelic TNFRSF9 mutations in a patient presenting with severe EBV-associated lymphoproliferative disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Biallelic TNFRSF9 mutations resulted in markedly reduced or abrogated expression of CD137 on activated T, B and NK cells."
    explanation: Hypomorphic compound heterozygous alleles also remove CD137 from activated lymphocytes.
  - reference: PMID:42144872
    reference_title: "CD137 deficiency patients: two new patients and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Reported variants included missense, splice-site, and frameshift variants, large deletions, and compound heterozygous variants."
    explanation: Summarizes the allelic spectrum, all converging on loss of CD137.

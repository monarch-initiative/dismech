animal_models:
- name: Tnfrsf9 knockout mouse
  species: Mouse
  genotype: Tnfrsf9-/-
  publication: PMID:12023342
  genes:
  - preferred_term: Tnfrsf9
    term:
      id: MGI:1101059
      label: Tnfrsf9
  description: >-
    4-1BB-deficient mice develop normally but have reduced cytokine
    production and CTL activity. Their T cells proliferate more, not less,
    to mitogen or anti-CD3, unlike patient T cells. Mice are not infected by
    EBV, so the lymphoproliferation and lymphoma of the human disease cannot
    be modeled directly.
  modeled_mechanisms:
  - target: Impaired CD8 T-Cell Expansion and Cytotoxicity Against EBV-Infected B Cells
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: CELLULAR
    limitations: >-
      The knockout reproduces reduced CTL activity and cytokine production
      but shows enhanced rather than reduced T-cell proliferation, and EBV,
      the antigen the human defect is defined against, does not infect mice.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        EBV is a human-restricted virus, so the mouse cannot show the
        EBV-specific CD8 response or the EBV-infected B-cell targets that
        the patient node describes.
    - divergence_type: INCOMPLETE_PHENOTYPE
      materiality: QUALIFYING
      description: >-
        Mouse T cells lacking 4-1BB proliferate more to mitogen or anti-CD3,
        whereas patient CD8 T cells expand less; only the cytotoxic half of
        the node is reproduced.
    evidence:
    - reference: PMID:12023342
      reference_title: "Immune responses in 4-1BB (CD137)-deficient mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Although T cells from 4-1BB-deficient mice showed enhanced proliferation, the T cell immune responses of these animals, such as cytokine production and CTL activity, were diminished."
      explanation: Reduced CTL activity matches the patient defect; enhanced proliferation does not.
differential_diagnoses:
- name: CD27-related lymphoproliferative and immune disorder
  description: >-
    Biallelic CD27 or CD70 deficiency removes another T-cell costimulatory
    pathway and gives a closely similar picture of EBV viremia,
    lymphoproliferation, HLH and lymphoma; distinguished by genetic testing
    and by absent CD27 or CD70 rather than CD137 expression.
  evidence:
  - reference: PMID:30872117
    reference_title: "Immunodeficiency and EBV-induced lymphoproliferation caused by 4-1BB deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Mutations in the T cell co-stimulatory TNF family member receptor CD27 and its ligand, the TNFR family member CD70 predominantly expressed on B cells, result in impaired generation of IFN-γ and perforin-producing CD8+ cytotoxic T cells"
    explanation: The CD27-CD70 defects produce the same CD8 effector deficit.
- name: TNFSF9 deficiency
  description: >-
    Inherited deficiency of the CD137 ligand (4-1BBL, TNFSF9) also impairs
    EBV control; the one reported patient had broad EBV infection of T and B
    cells with EBV-positive smooth muscle tumors and a coexisting 22q11.2
    deletion.
  evidence:
  - reference: PMID:35657354
    reference_title: "Inherited TNFSF9 deficiency causes broad Epstein-Barr virus infection with EBV+ smooth muscle tumors."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Importantly, patient EBV-infected B cells failed to trigger the expansion of EBV-specific T cells, resulting in decreased T cell effector responses."
    explanation: Loss of the ligand produces the same failure of EBV-specific T-cell expansion.
notes: >-
  No GeneReviews chapter covers TNFRSF9 deficiency; the phenotype baseline is
  the ClinGen curation summary and the 2026 literature review of 14 patients
  (PMID:42144872). Fewer than twenty patients are published, so phenotype
  frequencies come from small pooled counts and should not be read as
  penetrance estimates. One sibling with isolated CD137 deficiency carried
  persistent EBV-infected T cells without clinical disease (PMID:31537641);
  the affected proband in that family also carried a PIK3CD variant. An
  EBV-associated smooth muscle tumor was reported after transplantation from
  an affected sibling donor (PMID:41315311) and is not recorded as a
  phenotype because no HPO term covers it.

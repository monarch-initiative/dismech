    modifier: DECREASED
  evidence:
  - reference: PMID:31537641
    reference_title: "Concomitant PIK3CD and TNFRSF9 deficiencies cause chronic active Epstein-Barr virus infection of T cells."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mutation in TNFRSF9 gene coding CD137/4-1BB, a costimulatory molecule expressed by antigen-specific activated T cells, resulted in a complete loss of CD137 expression and impaired T cell expansion toward CD137 ligand-expressing cells."
    explanation: >-
      Patient T cells lacking CD137 fail to expand against CD137L-bearing
      cells, the costimulation defect itself. This patient also carried a
      PIK3CD defect, so the clinical course is not attributable to TNFRSF9
      alone.
  - reference: PMID:31501153
    reference_title: "CD137 deficiency causes immune dysregulation with predisposition to lymphomagenesis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Genetic reconstitution of CD137 reversed these defects."
    explanation: >-
      Re-expressing CD137 in patient lymphocytes rescued activation and
      proliferation, tying the defect to loss of CD137.

      supports: SUPPORT
      evidence_source: OTHER
      snippet: "TNFRSF9 | HGNC:11924 | immunodeficiency 109 with lymphoproliferation | MONDO:0859526 | AR | Definitive"
      explanation: >-
        The ClinGen Primary Immune Regulatory Disorders GCEP classifies
        TNFRSF9 in autosomal recessive IMD109 as Definitive.
  evidence:
  - reference: CGGV:assertion_a5baa1f6-63ef-46a7-8723-1c79844e0320-2025-04-15T190000.000Z
    reference_title: "TNFRSF9 / immunodeficiency 109 with lymphoproliferation (Definitive)"

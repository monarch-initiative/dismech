    reference_title: "CD137 deficiency patients: two new patients and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We recruited two patients carrying the same homozygous large deletion encompassing exons 1-6 of the TNFRSF9 gene and reviewed previously reported cases."
    explanation: Copy-number loss of TNFRSF9 is a recognized allele class.
  - reference: PMID:41315311

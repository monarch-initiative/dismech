genetic:
- name: TNFRSF9
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: TNFRSF9
    term:
      id: hgnc:11924
      label: TNFRSF9
  notes: >-
    Reported alleles include the Saudi founder missense c.325G>A
    (p.Gly109Ser), other homozygous missense, splice-site and frameshift
    variants, a homozygous deletion of exons 1-6 that exome SNV calling
    missed, and compound heterozygous hypomorphic alleles. All reduce or
    abolish CD137 expression. One patient regained EBV control after the
    emergence of somatic revertant CD8 T-cell clones (PMID:41315311).
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN

- name: Loss of CD137 Costimulation of Activated T Cells
  description: >-
    CD137 is induced on T cells after activation and, on binding CD137L
    (4-1BBL, TNFSF9) on antigen-presenting cells and EBV-transformed B cells,
    delivers a costimulatory signal. Patient T cells cannot receive this
    signal.
  biological_scale: CELLULAR
  cell_types:

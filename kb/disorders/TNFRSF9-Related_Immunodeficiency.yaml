description: >-
  TNFRSF9-related immunodeficiency (CD137 or 4-1BB deficiency, OMIM:620282) is
  an autosomal recessive inborn error of immunity caused by biallelic
  loss-of-function variants in TNFRSF9, which encodes the inducible T-cell
  costimulatory receptor CD137/4-1BB. Without CD137, activated CD8 T cells
  expand poorly and produce less interferon-gamma and perforin, and
  EBV-specific cytotoxic responses fail. Patients present in childhood with
  recurrent sinopulmonary infections, persistent EBV viremia and EBV-driven
  lymphoproliferation, and about half of reported patients have developed
  EBV-associated lymphoma (Hodgkin, Burkitt or diffuse large B-cell lymphoma);
  hemophagocytic lymphohistiocytosis, autoimmune cytopenias and both low and
  high immunoglobulin levels also occur. Fewer than twenty patients have been
  reported, mostly from consanguineous Middle Eastern families, and expression
  varies from clinically silent EBV persistence to fatal lymphoma.
  Allogeneic hematopoietic stem cell transplantation is the only curative
  treatment.
inheritance:
- name: Autosomal recessive
  description: >-
    Disease results from homozygous or compound heterozygous TNFRSF9 variants.
    Heterozygous parents have reduced CD137 expression but no reported
    disease.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:30872117
    reference_title: "Immunodeficiency and EBV-induced lymphoproliferation caused by 4-1BB deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sanger sequencing revealed that the mutation is homozygous in both patients"
    explanation: >-
      Both affected probands were homozygous for the same TNFRSF9 variant,
      with heterozygous parents, as expected for recessive inheritance.
  - reference: PMID:31501153
    reference_title: "CD137 deficiency causes immune dysregulation with predisposition to lymphomagenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified 4 distinct homozygous mutations in TNFRSF9 encoding the tumor necrosis factor receptor superfamily member CD137/4-1BB, leading to reduced, or loss of, protein expression."
    explanation: >-
      Four unrelated families with distinct homozygous TNFRSF9 variants
      replicate the recessive pattern.
  - reference: PMID:37144041
    reference_title: "CD137 deficiency because of two novel biallelic TNFRSF9 mutations in a patient presenting with severe EBV-associated lymphoproliferative disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report the first case of CD137 deficiency caused by two novel biallelic heterozygous TNFRSF9 mutations"
    explanation: >-
      A compound heterozygous patient shows that two different
      loss-of-function alleles in trans also cause the disease.

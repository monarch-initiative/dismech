pathophysiology:
- name: Hypomorphic POLA1 Variants
  biological_scale: MOLECULAR
  description: >-
    Hemizygous hypomorphic POLA1 alleles reduce DNA polymerase alpha function
    by two routes. Splice-affecting alleles (c.507+1G>A in family C;
    c.328G>A at the last base of exon 4 in family E) lower POLA1 transcript
    and protein, the family E transcript reduction exceeding that in XLPDR
    fibroblasts. Missense alleles (p.Ile79Ser, p.Pro1381Leu) leave POLA1
    protein levels unchanged and are thought to reduce activity. Recruitment
    of the POLA2 and PRIM1 subunits to chromatin is preserved. Complete POLA1
    loss is presumed lethal in males, so only hypomorphic alleles are
    compatible with life.

- name: Selection Against POLA1-Deficient Cells in Heterozygous Females
  biological_scale: CELLULAR
  description: >-
    Obligate carrier mothers in all three familial cases show significant to
    complete skewing of X inactivation and are clinically unaffected. A female
    whose POLA1 was disrupted by an X;6 translocation kept the normal X active
    in every lymphocyte examined, and heterozygous POLA1-spanning deletions in
    females with skewed X inactivation do not cause VEODS. This is consistent
    with selection against cells that express the deficient allele. The
    skewing is recorded here rather than as a phenotype because HP:0012546
    Skewed maternal X inactivation lies outside the PhenotypeTerm enum root.
  genes:
  - preferred_term: POLA1
    term:
      id: hgnc:9173
      label: POLA1
  evidence:
  - reference: PMID:31006512
    reference_title: "Defective DNA Polymerase α-Primase Leads to X-Linked Intellectual Disability Associated with Severe Growth Retardation, Microcephaly, and Hypogonadism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In addition, in the three familial cases (families A–C), all obligate female carriers show significant to complete skewing of X inactivation"
    explanation: Skewed X inactivation in all obligate carriers.
  - reference: PMID:28371302
    reference_title: "Functional monosomy of 6q27-qter and functional disomy of Xpter-p22.11 due to X;6 translocation with an atypical X-inactivation pattern."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We propose that completely skewed XCI favoring the normal X chromosome resulted from death of cells with an active derivative X that was caused by a non-functional POLA1 gene."
    explanation: Cells with only a non-functional POLA1 active are lost, explaining the completely skewed pattern.

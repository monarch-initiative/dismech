- name: Deficient DNA Replication in Proliferating Cells During Development
  biological_scale: TISSUE
  description: >-
    Proposed link between the cellular defect and the clinical picture. Pola1
    is expressed in the proliferative zones of the embryonic mouse neocortex
    and the postnatal subventricular zone, and the growth failure in patients
    begins before birth. Patient lymphoblastoid cells proliferate at a normal
    rate in culture, so the proliferation deficit is inferred for developing
    tissues rather than observed, and no animal model of a hypomorphic allele
    exists to test it.

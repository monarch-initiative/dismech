    evidence_source: HUMAN_CLINICAL
    snippet: "We could assign the causative gene to a 6 cM interval in Xp22.1-p21.3, with a maximum LOD score of 2.61 for markers DXS989 and DXS1061 at theta = 0.00."
    explanation: X-chromosome linkage in the original Belgian family (family A of the 2019 gene report).
  - reference: PMID:33477564
    reference_title: "Congenital Diseases of DNA Replication: Clinical Phenotypes and Molecular Mechanisms."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS

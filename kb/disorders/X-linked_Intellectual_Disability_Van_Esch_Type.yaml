name: X-linked Intellectual Disability Van Esch Type
creation_date: "2026-10-30T12:00:00Z"
category: Mendelian
synonyms:
- Van Esch-O'Driscoll syndrome
- VEODS
- Mental retardation, X-linked, syndromic, Van Esch-O'Driscoll type
description: >-
  X-linked recessive syndromic intellectual disability caused by hemizygous
  hypomorphic variants in POLA1, which encodes the p180 catalytic subunit of
  DNA polymerase alpha-primase, the enzyme that initiates DNA synthesis at
  replication origins and primes Okazaki fragments. Affected males have
  prenatal-onset proportionate short stature, microcephaly, intellectual
  disability or developmental delay of variable severity, and frequently
  hypogonadism; seizures, congenital heart malformation, reduced subcutaneous
  fat and recurrent infections are each reported in single individuals or
  families. The reported alleles are missense, splice-site and in-frame exon 6
  deletion variants. Some lower POLA1 protein levels while others leave them
  intact; patient lymphoblastoid cells show reduced replication origin firing
  and hypersensitivity to replication stress, and the developmental growth
  failure is attributed to deficient DNA replication in proliferating cells
  during development. Obligate carrier females are unaffected and show skewed
  X inactivation. VEODS is allelic to, and clinically distinct from, X-linked
  reticulate pigmentary disorder, which is caused by a recurrent deep-intronic
  POLA1 variant and has an interferon-driven autoinflammatory mechanism.

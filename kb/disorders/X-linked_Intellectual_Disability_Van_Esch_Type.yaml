      label: Homo sapiens
  cell_types:
  - preferred_term: B-lymphoblastoid cell
    term:
      id: CL:0017006
      label: B-lymphoblast
  cell_source: >-
    Lymphoblastoid cell lines from affected males of families A, B and C, with
    parental or unrelated wild-type male controls
  publication: PMID:31006512
  description: >-
    Patient-derived lymphoblastoid cell lines used for POLA1 protein and
    chromatin levels, DNA fiber combing and EdU incorporation after
    hydroxyurea.
  modeled_mechanisms:
  - target: Impaired Replication Origin Firing
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: Fiber combing in family C cells shows fewer initiation events and longer inter-origin distances.
    limitations: >-
      Measured in cells from one family only (family C), against a single
      paternal control; EBV-transformed B cells are not the neural or somatic
      progenitors in which the defect is thought to act.
    evidence:
    - reference: PMID:31006512
      reference_title: "Defective DNA Polymerase α-Primase Leads to X-Linked Intellectual Disability Associated with Severe Growth Retardation, Microcephaly, and Hypogonadism."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Consistent with this, we also observed increased inter-origin distance (IOD) in the family C proband’s LCLs compared to those of the father"
      explanation: Origin-firing defect observed directly in the patient cell line.
  - target: Hypersensitivity to Replication Stress
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Cells from three families incorporate less EdU after hydroxyurea; family C cells accumulate stalled forks.
    limitations: >-
      Proliferation of unperturbed patient cells is normal, so the cell lines
      do not reproduce a growth defect; the stress is applied pharmacologically.
    evidence:
    - reference: PMID:31006512
      reference_title: "Defective DNA Polymerase α-Primase Leads to X-Linked Intellectual Disability Associated with Severe Growth Retardation, Microcephaly, and Hypogonadism."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Collectively, these results show that LCLs from affected individuals with distinct POLA1 mutations exhibit reduced DNA replication under conditions of replication stress."
      explanation: Stress hypersensitivity reproduced across three patient cell lines.
  - target: Deficient DNA Replication in Proliferating Cells During Development
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: CELLULAR
    description: Unperturbed patient cell lines proliferate at the control rate.
    limitations: >-
      Lymphoblastoid cells are transformed, rapidly dividing mature B cells
      grown without replication stress; they may not expose a proliferation
      deficit that arises in developing tissues.
    evidence:
    - reference: PMID:31006512
      reference_title: "Defective DNA Polymerase α-Primase Leads to X-Linked Intellectual Disability Associated with Severe Growth Retardation, Microcephaly, and Hypogonadism."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Nonetheless, we did not observe a marked delay in proliferation of proband LCLs from families A, B, and C compared to in the WT"
      explanation: Negative result for a proliferation defect in the patient cell lines.
diagnosis:
- name: Exome sequencing
  description: >-
    The clinical picture overlaps other microcephalic growth-deficiency
    syndromes and there is no recognizable facial gestalt. Three of the five
    original families were diagnosed by single or trio exome sequencing, one
    by a microcephaly/microcephalic dwarfism gene panel, and one by linkage
    followed by Sanger sequencing. RNA studies were used to establish the
    effect of the splice-region variants.
  diagnosis_term:
    preferred_term: Whole exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:31006512
    reference_title: "Defective DNA Polymerase α-Primase Leads to X-Linked Intellectual Disability Associated with Severe Growth Retardation, Microcephaly, and Hypogonadism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "by a custom-designed microcephaly/microcephalic dwarfism Sure Select capture panel consisting of 63 genes (family C), by single whole-exome sequencing (WES) (family B), or by trio WES (families D and E)"
    explanation: Methods by which the reported families were diagnosed.
notes: >-
  No GeneReviews chapter covers this disease (just check-genereviews --online:
  NO_CHAPTER). Nine patients from five families were described with the gene
  discovery (PMID:31006512) and one further patient in 2021 (PMID:34119699);
  PubMed searches for "VEODS", "Van Esch-O'Driscoll" and "POLA1 AND
  (intellectual disability OR Van Esch OR microcephaly OR hypogonadism)" on
  2026-10-30 returned no other case report. A 2021 review notes that the
  clinical course past childhood had not been described. No disease-specific
  treatment, management guideline or treatment report was found, so no
  treatment is recorded. No animal model carries a hypomorphic POLA1 allele
  (PMID:33392852 cites the lack of animal models); a zebrafish pola1
  insertional mutant cited in the gene-discovery paper shows embryonic CNS
  necrosis and body wasting and models severe loss rather than VEODS. POLA1
  is also the gene for X-linked reticulate pigmentary disorder
  (MONDO:0010523), caused by a recurrent deep-intronic variant that reduces
  POLA1 and activates type I interferon through loss of cytosolic RNA:DNA
  hybrid synthesis; that mechanism is curated in its own entry and is not
  asserted here. A 2021 review states that at least one VEODS patient had a
  type I interferon signature and that fibroblasts from XLPDR and VEODS
  patients have reduced MCM4 (PMID:33392852); the text of the gene-discovery
  paper reports neither finding in VEODS cells, so neither is encoded as
  mechanism. POLA1 has also
  been reported as a dyskeratosis congenita gene, a separate entity.
  Heterozygous females carrying a POLA1-spanning Xp deletion had subfertility
  but not VEODS (PMID:36182037). The 2021 review reports no excess neoplasia
  in VEODS (PMID:33392852).

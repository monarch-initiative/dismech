genetic:
- name: POLA1
  gene_term:
    preferred_term: POLA1
    term:
      id: hgnc:9173
      label: POLA1
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Reported hemizygous alleles: c.236T>G p.(Ile79Ser) (family A, segregating
    through carrier mothers), c.4142C>T p.(Pro1381Leu) (family B, also carried
    by the unaffected mother, grandmother and sister), c.507+1G>A (family C;
    one transcript retains 60 intronic nucleotides and truncates, the other
    skips exon 6 in frame, p.Lys149_Glu169del), a de novo exon 6 deletion
    (family D) and a de novo c.328G>A p.(Gly110Arg) at the last base of exon 4
    that sharply reduces POLA1 mRNA (family E). A later patient carries a
    splice variant causing exon 6 skipping. None of these is the deep-intronic
    c.1375-354A>G variant that causes X-linked reticulate pigmentary disorder.
    ClinGen has no gene-disease validity assertion for POLA1 and this disease;
    its only POLA1 assertion is for XLPDR.
  evidence:
  - reference: PMID:31006512
    reference_title: "Defective DNA Polymerase α-Primase Leads to X-Linked Intellectual Disability Associated with Severe Growth Retardation, Microcephaly, and Hypogonadism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we describe distinct missense and splice-impacting mutations in POLA1 in five unrelated families presenting with an X-linked syndrome involving intellectual disability, proportionate short stature, microcephaly, and hypogonadism"
    explanation: Five unrelated families with POLA1 variants define the syndrome.
  - reference: PMID:31006512
    reference_title: "Defective DNA Polymerase α-Primase Leads to X-Linked Intellectual Disability Associated with Severe Growth Retardation, Microcephaly, and Hypogonadism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In family B, exome analysis identified a missense mutation, c.4142C>T, leading to a p.Pro1381Leu mutation."
    explanation: Family B allele.
  - reference: PMID:31006512
    reference_title: "Defective DNA Polymerase α-Primase Leads to X-Linked Intellectual Disability Associated with Severe Growth Retardation, Microcephaly, and Hypogonadism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In family C, a splice-site variant, c.507+1G>A, located in the donor splice site of intron 6 of POLA1 was identified."
    explanation: Family C allele.

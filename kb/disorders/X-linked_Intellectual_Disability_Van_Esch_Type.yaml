    explanation: Missense alleles do not lower protein abundance, so their effect is on function rather than amount.
  - reference: PMID:31006512
    reference_title: "Defective DNA Polymerase α-Primase Leads to X-Linked Intellectual Disability Associated with Severe Growth Retardation, Microcephaly, and Hypogonadism."
    supports: SUPPORT

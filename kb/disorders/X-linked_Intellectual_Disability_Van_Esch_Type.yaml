    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "By using DNA-fiber-combing analysis of ongoing, unperturbed DNA replication in LCLs obtained from the proband of family C and his unaffected father, we observed similar rates of replication-fork progression"
    explanation: Fork elongation is normal, so the defect lies in initiation.
  downstream:
  - target: Deficient DNA Replication in Proliferating Cells During Development
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:31006512
      reference_title: "Defective DNA Polymerase α-Primase Leads to X-Linked Intellectual Disability Associated with Severe Growth Retardation, Microcephaly, and Hypogonadism."
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: INDIRECT
      snippet: "These data strongly suggest that cellular DNA-replication deficits during development may underlie many of the clinical features observed in these families."

- name: Impaired Replication Origin Firing
  biological_scale: MOLECULAR
  description: >-
    DNA fiber combing of unperturbed lymphoblastoid cells from the family C
    proband showed fewer new initiation events, longer inter-origin distances,
    asymmetric forks and longer replication tracts than his father's cells,
    while fork speed was unchanged. This pattern indicates reduced productive
    origin firing and dormant origin capacity rather than slower elongation.
    It was measured in one family only.
  cell_types:
  - preferred_term: B-lymphoblastoid cell
    term:
      id: CL:0017006
      label: B-lymphoblast
  biological_processes:
  - preferred_term: DNA replication initiation
    term:
      id: GO:0006270
      label: DNA replication initiation
    modifier: DECREASED
  evidence:
  - reference: PMID:31006512
    reference_title: "Defective DNA Polymerase α-Primase Leads to X-Linked Intellectual Disability Associated with Severe Growth Retardation, Microcephaly, and Hypogonadism."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Consistent with this, we also observed increased inter-origin distance (IOD) in the family C proband’s LCLs compared to those of the father"
    explanation: Longer inter-origin distance indicates fewer fired origins.
  - reference: PMID:31006512
    reference_title: "Defective DNA Polymerase α-Primase Leads to X-Linked Intellectual Disability Associated with Severe Growth Retardation, Microcephaly, and Hypogonadism."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Furthermore, we found an increase in asymmetric forks and an accumulation of longer replication tracts in the family C proband’s LCLs compared to those of the father"
    explanation: Fork asymmetry and long tracts accompany reduced origin density.
  - reference: PMID:31006512

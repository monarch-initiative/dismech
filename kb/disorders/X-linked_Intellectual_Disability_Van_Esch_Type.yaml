- name: Hypersensitivity to Replication Stress
  biological_scale: CELLULAR
  description: >-
    Under hydroxyurea-induced nucleotide depletion, lymphoblastoid cells from
    the family C proband had about twice as many stalled replication forks as
    paternal cells, and cells from families A, B and C all incorporated less
    EdU after hydroxyurea. POLA1 siRNA in U2OS cells reproduced the reduced
    replication. The authors propose that rapidly proliferating embryonic
    cells, which experience constitutive replication stress, are where this
    defect matters.

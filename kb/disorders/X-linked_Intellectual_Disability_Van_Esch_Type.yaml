inheritance:
- name: X-linked recessive
  description: >-
    Affected individuals are hemizygous males. In the three familial cases the
    variant passes through unaffected obligate carrier mothers, who show
    skewed X inactivation; two further probands carry de novo variants. The
    first family was linked to Xp22.1-p21.3 before the gene was identified.
  inheritance_term:
    preferred_term: X-linked recessive inheritance
    term:
      id: HP:0001419
      label: X-linked recessive inheritance
  evidence:
  - reference: PMID:31006512
    reference_title: "Defective DNA Polymerase α-Primase Leads to X-Linked Intellectual Disability Associated with Severe Growth Retardation, Microcephaly, and Hypogonadism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In family A, a missense mutation in exon 3 of POLA1 was identified, and this mutation, c.236T>G (p.Ile79Ser), segregates with the disease in all four affected individuals and obligate carrier mothers"
    explanation: Segregation of a POLA1 variant through unaffected carrier mothers to affected males.
  - reference: PMID:16053905
    reference_title: "X-linked mental retardation, short stature, microcephaly and hypogonadism maps to Xp22.1-p21.3 in a Belgian family."

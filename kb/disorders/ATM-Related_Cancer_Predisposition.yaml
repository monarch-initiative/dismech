- name: Radiotherapy when otherwise indicated
  description: >-
    Radiotherapy is not withheld from a carrier. This is the management statement with
    the most history behind it, because biallelic ATM loss causes clinical
    radiosensitivity and that was long assumed to extend to heterozygotes. A
    population-based contralateral-breast-cancer study found that radiotherapy did not
    modify the contralateral risk carried by known pathogenic variants, and concluded
    that altering radiotherapy plans on that basis is unwarranted. The same study found
    an elevated radiotherapy-associated contralateral risk confined to carriers of rare
    ATM missense variants of uncertain significance, which is a different group from the
    pathogenic carriers this entry is about and is a reason the question is not closed
    rather than a reason to withhold treatment. Note that this coexists with the raised
    micronucleus formation after irradiation recorded on the Genomic Instability in
    Glandular Epithelium node, and the two are not in conflict: a measurable difference
    in a cellular damage assay did not translate into a measurable difference in
    contralateral breast cancer after radiotherapy in a population-based cohort. The
    cellular result is why the question was asked; the cohort result is what answers it
    for management.

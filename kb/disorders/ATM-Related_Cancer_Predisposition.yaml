    ataxia-telangiectasia, which is the split this entry follows.
pathophysiology:
- name: Heterozygous Germline ATM Loss of Function
  description: >-
    One inherited pathogenic ATM allele, in the great majority of cases a truncating
    variant. The carrier retains one wild-type copy, which is what distinguishes this
    disease from biallelic ATM loss.
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  genes:
  - preferred_term: ATM
    term:
      id: hgnc:795
      label: ATM
  molecular_functions:
  - preferred_term: protein serine/threonine kinase activity
    term:
      id: GO:0004674
      label: protein serine/threonine kinase activity
    modifier: DECREASED
  downstream:
  - target: Reduced ATM Dimer Activation Capacity
    causal_link_type: DIRECT
    description: >-
      A null allele halves the pool of subunits available to form activatable dimers.
  - target: Dominant-Negative Dimer Poisoning
    causal_link_type: DIRECT
    description: >-
      A missense or in-frame deletion allele instead contributes a stable, catalytically
      dead subunit to the dimer pool.
  evidence:
  - reference: PMID:42258614
    reference_title: "ATM-Related Cancer Predisposition."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The diagnosis of ATM-related cancer predisposition is established in a proband with a heterozygous germline pathogenic variant in ATM identified by molecular genetic testing."
    explanation: >-
      Establishes that the monoallelic germline variant is the defining lesion of this
      disease.
- name: ATM Dimer Autophosphorylation Switch
  description: >-
    Inactive ATM is held as a dimer with the kinase domain bound to a region around
    Ser1981. Damage triggers intermolecular autophosphorylation of Ser1981, which
    dissociates the dimer and releases kinase activity. Because the phosphorylation is
    intermolecular, one subunit's activation depends on its partner, and that is the
    structural reason the two allele classes below behave differently.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: protein autophosphorylation
    term:
      id: GO:0046777
      label: protein autophosphorylation
  evidence:
  - reference: PMID:12556884
    reference_title: "DNA damage activates ATM through intermolecular autophosphorylation and dimer dissociation."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: "Cellular irradiation induces rapid intermolecular autophosphorylation of serine 1981 that causes dimer dissociation and initiates cellular ATM kinase activity"
    explanation: >-
      Establishes the activation mechanism, including that the autophosphorylation is
      intermolecular, which the dominant-negative node depends on.
  - reference: PMID:25240135
    reference_title: "Dimer monomer transition and dimer re-formation play important role for ATM cellular function during DNA repair."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: "ATM cannot phosphorylate the substrates when it could not undergo dimer monomer transition"
    explanation: >-
      Shows the dimer-to-monomer transition is required for catalysis, so blocking it
      blocks ATM signalling.
- name: Reduced ATM Dimer Activation Capacity
  description: >-
    The null-allele route. With one allele producing no protein, the carrier forms
    functional wild-type homodimers at roughly half the normal abundance, giving a
    quantitative reduction in ATM signalling capacity rather than its abolition.
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: protein serine/threonine kinase activity
    term:
      id: GO:0004674
      label: protein serine/threonine kinase activity
    modifier: DECREASED
  downstream:
  - target: Attenuated DNA Damage Checkpoint Signalling
    causal_link_type: DIRECT
    description: >-
      Less activatable ATM gives a weaker damage-response signal.
  evidence:
  - reference: PMID:12195425
    reference_title: "Mice heterozygous for mutation in Atm, the gene involved in ataxia-telangiectasia, have heightened susceptibility to cancer."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "show an increased susceptibility to developing tumors. In contrast, no tumors are observed in Atm knockout"
    explanation: >-
      The contrast in this sentence is the evidence for the two-class model: the
      knockout heterozygote, which models the null-allele route, develops no tumours
      where the in-frame deletion heterozygote does. Cited here as indirect support for
      the null route being the weaker of the two.
- name: Dominant-Negative Dimer Poisoning
  description: >-
    The dominant-negative route. Selected missense and in-frame deletion alleles make a
    stable but catalytically dead subunit that enters mixed dimers with the wild-type
    subunit and blocks its activation. Because Ser1981 autophosphorylation is
    intermolecular, such a carrier loses considerably more than half of ATM activity,
    which is why risk is allele-specific rather than uniform across pathogenic carriers.
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: protein serine/threonine kinase activity
    term:
      id: GO:0004674
      label: protein serine/threonine kinase activity
    modifier: DECREASED
  downstream:
  - target: Attenuated DNA Damage Checkpoint Signalling
    causal_link_type: DIRECT
    description: >-
      A poisoned dimer pool gives a disproportionately weak damage-response signal.
  evidence:
  - reference: PMID:12195425
    reference_title: "Mice heterozygous for mutation in Atm, the gene involved in ataxia-telangiectasia, have heightened susceptibility to cancer."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "Expression of ATM cDNA containing the 7636del9 mutation had a dominant-negative effect in control cells, inhibiting radiation-induced ATM kinase activity in vivo and in vitro"
    explanation: >-
      Direct functional demonstration that the in-frame deletion allele suppresses
      wild-type ATM kinase activity rather than merely failing to contribute.
  - reference: PMID:17001622
    reference_title: "Characterization of the breast cancer associated ATM 7271T>G (V2424G) mutation by gene expression profiling."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "We previously reported one breast cancer family in which ATM 7271T>G (V2424G) segregated with disease, and apparently acted in a dominant negative manner"
    explanation: >-
      Human evidence that a dominant-negative allele segregates with breast cancer in a
      family.
- name: Attenuated DNA Damage Checkpoint Signalling
  description: >-
    Reduced ATM output weakens the damage-response signal that arrests the cell cycle
    and licenses repair after a double-strand break. ATM is a damage sensor rather than
    a repair effector, so the resulting defect is a checkpoint defect and not a collapse
    of homologous recombination — a distinction that carries directly into how these
    tumours respond to PARP inhibition.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: DNA damage checkpoint signaling
    term:
      id: GO:0000077
      label: DNA damage checkpoint signaling
    modifier: DECREASED
  - preferred_term: DNA damage response
    term:
      id: GO:0006974
      label: DNA damage response
    modifier: DECREASED
  downstream:
  - target: Genomic Instability in Glandular Epithelium
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Damage that escapes checkpoint control is carried into division, so mutations and
      structural rearrangements accumulate across successive cell cycles.
  evidence:
  - reference: PMID:40849250
    reference_title: "Impact of HRR Gene Subclass on Clinical Outcomes of PARP Inhibitors in Metastatic Castration-Resistant Prostate Cancer."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with effector mutations demonstrated a statistically significant improvement in PFS compared to those with sensor mutations"
    explanation: >-
      Supports the sensor-versus-effector distinction this node rests on, through its
      therapeutic consequence: ATM is a sensor gene, and sensor-gene tumours behave
      differently from homologous-recombination effector tumours.
- name: Genomic Instability in Glandular Epithelium
  description: >-
    Accumulated unrepaired damage in the epithelia where carrier tumours arise — breast,
    exocrine pancreas, prostate and stomach. The tissue restriction is not explained by
    the mechanism, which operates in every cell of the carrier, and is recorded as an
    open question in this entry's discussions.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: mammary gland epithelial cell
    term:
      id: CL:0002327
      label: mammary gland epithelial cell
  - preferred_term: pancreatic ductal cell
    term:
      id: CL:0002079
      label: pancreatic ductal cell
  - preferred_term: epithelial cell of prostate
    term:
      id: CL:0002231
      label: epithelial cell of prostate
  locations:
  - preferred_term: breast
    term:
      id: UBERON:0000310
      label: breast
  - preferred_term: pancreas
    term:
      id: UBERON:0001264
      label: pancreas
  - preferred_term: prostate gland
    term:
      id: UBERON:0002367
      label: prostate gland
  - preferred_term: stomach
    term:
      id: UBERON:0000945
      label: stomach
  downstream:
  - target: Breast carcinoma
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      The dominant manifestation, enriched for oestrogen-receptor-positive disease.
  - target: Pancreatic carcinoma
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Exocrine pancreatic cancer, one of the core triad.
  - target: Prostate cancer
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      With an excess of aggressive rather than indolent disease.
  - target: Gastric adenocarcinoma
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Named in the GeneReviews clinical characteristics alongside the other three.
  evidence:
  - reference: PMID:39636577
    reference_title: "Management of individuals with heterozygous germline pathogenic variants in ATM: A clinical practice resource of the American College of Medical Genetics and Genomics (ACMG)."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "ATM germline pathogenic variants (GPVs) are associated with a moderately increased risk of female breast cancer, pancreatic cancer, and prostate cancer"
    explanation: >-
      Identifies the organ sites at which the genomic instability of this disease
      actually produces tumours. It does not itself evidence the instability; the item
      below does that.
  - reference: PMID:15101044
    reference_title: Functional consequences of ATM sequence variants for chromosomal radiosensitivity.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "The BC, A-T het, and A-T cell line groups showed significantly higher mean levels of MN formation after exposure to ionizing radiation (IR) than did the group containing normal cell lines, with similar levels in the BC and A-T het groups."
    explanation: >-
      A direct measurement of chromosomal damage in cells from ATM heterozygotes:
      micronucleus formation is raised in heterozygote and breast-cancer-patient
      lymphoblastoid lines against normal lines. Graded INDIRECT for two reasons that
      matter when reading it as support for this node. The damage was induced by
      irradiation rather than observed accruing spontaneously, and it was measured in
      lymphoblastoid lines rather than in the glandular epithelia where carrier tumours
      arise. It is nonetheless evidence that one functional ATM allele is not sufficient
      to keep chromosomal damage at the level a normal genotype maintains, which is the
      claim this node makes.
phenotypes:
- category: Neoplastic
  name: Breast carcinoma
  description: >-
    Female breast cancer at moderately increased risk, enriched for
    oestrogen-receptor-positive disease rather than the triple-negative pattern seen
    with some other homologous-recombination genes. Two published estimates of that risk
    are recorded below and they are not interchangeable, because their designs answer
    different questions. A population-based case-control study gives an odds ratio of
    1.82, with a confidence interval from 1.46 to 2.27, for breast cancer overall, and
    reports the association as restricted to oestrogen-receptor-positive disease.
    Family-based segregation analysis in the Australian Breast Cancer Family Registry
    gives a cumulative risk to age 80 of 13 per cent, with a confidence interval from 4.6
    to 30 that reflects both the small number of informative families and heterogeneity
    among the pathogenic alleles pooled into it. The case-control odds ratio says how
    much a carrier's risk is multiplied; the segregation analysis says what proportion of
    carriers develop the disease. Neither is the disease's penetrance, since this is a
    multi-site predisposition and both figures are specific to female breast cancer.
  phenotype_term:
    preferred_term: Breast carcinoma
    term:
      id: HP:0003002
      label: Breast carcinoma
  evidence:
  - reference: PMID:33471974
    reference_title: "A Population-Based Study of Genes Previously Implicated in Breast Cancer."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "whereas pathogenic variants in ATM, CDH1, and CHEK2 were associated with an increased risk of estrogen receptor-positive breast cancer"
    explanation: >-
      A population-based case-control study establishing both the association and its
      restriction to oestrogen-receptor-positive disease.
  - reference: PMID:33471974
    reference_title: "A Population-Based Study of Genes Previously Implicated in Breast Cancer."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pathogenic variants in ATM and NF1 were associated with an increased risk of breast cancer, with odds ratios of 1.82 (95% CI, 1.46 to 2.27) and 1.93 (95% CI, 0.91 to 4.31), respectively."
    explanation: >-
      The case-control risk estimate itself, quoted so the magnitude and its interval are
      attributable rather than described. This is the odds ratio for breast cancer
      overall; the same study reports the association as confined to
      oestrogen-receptor-positive disease.
  - reference: PMID:35365198
    reference_title: Population-based estimates of age-specific cumulative risk of breast cancer for pathogenic variants in ATM.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "The estimated cumulative risk of breast cancer to age 80 years for heterozygous ATM pathogenic variant carriers was estimated to be 13% (95% CI 4.6-30)."
    explanation: >-
      The family-based segregation estimate, recorded beside the case-control odds ratio
      because the two designs give different quantities and the wide interval here is
      part of the finding.
  - reference: PMID:42258614
    reference_title: "ATM-Related Cancer Predisposition."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "ATM-related cancer predisposition is characterized by a moderately increased risk of female breast cancer, exocrine pancreatic cancer, prostate cancer, and gastric cancer."
    explanation: >-
      The GeneReviews clinical characteristics statement, which is this entry's
      phenotype baseline.

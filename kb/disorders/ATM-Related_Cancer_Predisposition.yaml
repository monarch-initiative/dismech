- name: Risk-reducing mastectomy or salpingo-oophorectomy
  description: >-
    Bilateral risk-reducing mastectomy, bilateral salpingo-oophorectomy, or both may be
    considered, but neither is routinely recommended on the basis of carrier status
    alone. The decision is taken against a personalised risk assessment that includes
    family history, by shared decision-making. This is the practical consequence of the
    moderate risk tier: the same surgery that is standard advice in a high-penetrance
    syndrome is optional here.

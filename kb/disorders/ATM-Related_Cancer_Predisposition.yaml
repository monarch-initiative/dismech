      term:
        id: CHEBI:83766
        label: olaparib
  target_mechanisms:
  - target: Attenuated DNA Damage Checkpoint Signalling
    description: >-
      PARP inhibition is used against the DNA-repair deficiency this node describes,
      though the entry records that ATM is a weaker synthetic-lethal partner than the
      homologous-recombination effector genes.
  evidence:
  - reference: PMID:32343890
    reference_title: "Olaparib for Metastatic Castration-Resistant Prostate Cancer."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "median, 7.4 months vs. 3.6 months; hazard ratio for progression or death, 0.34"
    explanation: >-
      The registrational progression-free survival result for the cohort that included
      ATM. Marked indirect because that cohort pooled BRCA1, BRCA2 and ATM and was
      dominated by BRCA2, so it does not isolate the ATM effect.
  - reference: PMID:40849250
    reference_title: "Impact of HRR Gene Subclass on Clinical Outcomes of PARP Inhibitors in Metastatic Castration-Resistant Prostate Cancer."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with effector mutations demonstrated a statistically significant improvement in PFS compared to those with sensor mutations"
    explanation: >-
      Quantifies the gap between sensor genes such as ATM and homologous-recombination
      effector genes, which is why this treatment row is qualified rather than presented
      as equivalent to its use in BRCA-altered disease.
differential_diagnoses:
- name: Ataxia-telangiectasia
  description: >-
    The biallelic disease, and the differential that matters most here because it is the
    same gene. It presents in early childhood with progressive cerebellar ataxia,
    oculocutaneous telangiectasia, immunodeficiency and a far higher cancer risk
    dominated by lymphoid malignancy. Carriers of a single allele have none of the
    neurological, immune or endocrine features. The practical connection is reproductive:
    two carriers can have a child with ataxia-telangiectasia.
  evidence:
  - reference: PMID:42258614
    reference_title: "ATM-Related Cancer Predisposition."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "offspring are at risk of inheriting biallelic ATM pathogenic variants and having ataxia-telangiectasia"
    explanation: >-
      States the relationship between the two diseases in the terms that matter to a
      carrier, and confirms that they are separate entities.
- name: CHEK2-related cancer predisposition
  description: >-
    The closest phenocopy: another moderate-penetrance, autosomal dominant predisposition
    to oestrogen-receptor-positive breast cancer, grouped with ATM in the same
    population-based analysis. Distinguished by gene testing rather than by phenotype.
- name: Hereditary breast and ovarian cancer syndrome
  description: >-
    BRCA1 and BRCA2 carry higher penetrance and a different tumour-subtype profile —
    oestrogen-receptor-negative and triple-negative disease for BRCA1 — and respond
    considerably better to PARP inhibition, being homologous-recombination effectors
    rather than damage sensors.
- name: PALB2-related cancer predisposition
  description: >-
    Another breast and pancreatic predisposition gene, but a homologous-recombination
    effector bridging BRCA1 to BRCA2, so it behaves like the BRCA genes on therapy
    response rather than like ATM.
animal_models:
- name: Atm-Delta SRI knock-in heterozygous mouse
  species: Mouse
  genotype: Atm in-frame deletion corresponding to human 7636del9, heterozygous
  publication: PMID:12195425
  modeled_mechanisms:
  - target: Dominant-Negative Dimer Poisoning
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: ORGANISM
    description: >-
      The decisive allele-class experiment. A heterozygous in-frame deletion
      corresponding to the human dominant-negative allele gives increased tumour
      susceptibility, while a heterozygous knockout of the same gene gives none. That
      contrast is what establishes the two allele classes as mechanistically different
      rather than as two degrees of the same loss.
    evidence:
    - reference: PMID:12195425
      reference_title: "Mice heterozygous for mutation in Atm, the gene involved in ataxia-telangiectasia, have heightened susceptibility to cancer."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "show an increased susceptibility to developing tumors. In contrast, no tumors are observed in Atm knockout"
      explanation: >-
        States both arms of the contrast in one sentence: tumours in the in-frame
        deletion heterozygote, none in the knockout heterozygote.
  notes: >-
    No MGI identifier is bound for the mouse Atm gene. The Alliance of Genome Resources
    API was unreachable from the curation environment, and this repository's term
    validator does not check MGI labels, so an identifier written from memory would pass
    every gate unverified. The model is identified by species, genotype and publication.
discussions:
- discussion_id: atm_heterozygote_tissue_restriction
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why is the tumour risk in ATM heterozygotes restricted to breast, exocrine pancreas,
    prostate and stomach, when the attenuated damage response operates in every cell of
    the carrier?
  rationale: >-
    The mechanism this entry curates is constitutional and tissue-agnostic: one allele
    is lost in every nucleated cell, and nothing in the chain from allele to checkpoint
    attenuation has a cell-type-specific component. Yet the clinical risk is sharply
    organ-restricted, and the entry's own pathophysiology offers nothing that predicts
    which epithelia are affected. Any explanation has to come from outside the ATM chain
    — proliferative rate, hormonal drive, baseline replication stress, or the local
    repair pathways that compensate — and none has been shown to be the operative
    factor. The gap matters practically, because surveillance is organ-specific and
    therefore rests on the epidemiology rather than on the mechanism.
  attaches_to:
  - pathophysiology#Genomic Instability in Glandular Epithelium
  - pathophysiology#Attenuated DNA Damage Checkpoint Signalling

name: ATM-Related Cancer Predisposition
category: Mendelian
creation_date: "2026-11-26T18:30:00Z"
synonyms:
- ATM-related cancer predisposition
- ATM heterozygous cancer predisposition
description: >-
  An autosomal dominant, moderate-penetrance, adult-onset tumour predisposition carried
  by people with one germline loss-of-function allele of ATM. ATM is the apical kinase
  of the DNA double-strand-break response: it rests as an inactive dimer and is switched
  on by MRN-gated intermolecular autophosphorylation at Ser1981, which dissociates the
  dimer and releases kinase activity. Because that activation step is intermolecular,
  the two classes of pathogenic allele are not equivalent. A truncating null leaves the
  wild-type copy making functional homodimers at roughly half capacity, whereas a
  dominant-negative missense or in-frame deletion allele makes a stable, catalytically
  dead subunit that enters mixed dimers and blocks activation of the wild-type partner.
  The clinical result is a moderately raised risk of female breast cancer (enriched for
  oestrogen-receptor-positive disease), exocrine pancreatic cancer, prostate cancer
  (with an excess of aggressive disease) and gastric cancer, presenting in adult life
  with no neurological, immunological or endocrine features. This entry covers the
  monoallelic state only; biallelic ATM loss causes ataxia-telangiectasia, a different
  disease curated separately.
disease_term:
  preferred_term: ATM-related cancer predisposition
  term:
    id: MONDO:0700270
    label: ATM-related cancer predisposition
parents:
- Hereditary neoplastic syndrome
notes: >-
  Entry name and scope. The name is the GeneReviews chapter title for this exact
  concept, which the `check-genereviews` baseline check reports as an untagged chapter
  for this entry; that chapter is the phenotype baseline the entry is built on. The
  scope boundary is the point of the entry: dismech already curates biallelic ATM loss
  as Ataxia_Telangiectasia, bound to MONDO:0008840, and one functional allele is enough
  for normal cerebellar development and normal immune function, so carriers have neither
  ataxia nor immunodeficiency. GeneReviews, ClinGen and MONDO all treat the two as
  separate entities, and MONDO:0700270 carries no OMIM anchor of its own.
  Why no single penetrance figure is recorded. Risk is allele-specific, which is why the
  entry separates the two allele classes as distinct pathophysiology nodes. Published
  cumulative breast-cancer risk estimates also differ by ascertainment, with
  family-based segregation analysis giving a lower figure and a wider interval than
  case-control series, so a reader is given a per-study estimate and its design rather
  than one number presented as the disease's penetrance.
  Three further tumour associations are reported but deliberately not curated as
  phenotype rows. GeneReviews lists ovarian, colorectal and melanoma as modest
  associations and states that larger studies are required to confirm them. Recording
  them here rather than as phenotypes keeps the entry from asserting a risk its own
  baseline source declines to assert.
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    One pathogenic ATM allele is sufficient for the cancer predisposition. Most carriers
    inherited the allele from a parent, who may never have had a cancer diagnosis given
    the incomplete, age-dependent penetrance.
  evidence:
  - reference: PMID:42258614
    reference_title: "ATM-Related Cancer Predisposition."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The vast majority of individuals with a germline ATM pathogenic variant inherited the pathogenic variant from a parent."
    explanation: >-
      The GeneReviews chapter states the inheritance pattern and the usual mode of
      transmission for this disease.

  notes: >-
    No MGI identifier is bound for the mouse Atm gene. The Alliance of Genome Resources
    API was unreachable from the curation environment, and this repository's term
    validator does not check MGI labels, so an identifier written from memory would pass
    every gate unverified. The model is identified by species, genotype and publication.
discussions:
- discussion_id: atm_heterozygote_tissue_restriction
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why is the tumour risk in ATM heterozygotes restricted to breast, exocrine pancreas,
    prostate and stomach, when the attenuated damage response operates in every cell of
    the carrier?
  rationale: >-
    The mechanism this entry curates is constitutional and tissue-agnostic: one allele
    is lost in every nucleated cell, and nothing in the chain from allele to checkpoint
    attenuation has a cell-type-specific component. Yet the clinical risk is sharply
    organ-restricted, and the entry's own pathophysiology offers nothing that predicts
    which epithelia are affected. Any explanation has to come from outside the ATM chain
    — proliferative rate, hormonal drive, baseline replication stress, or the local
    repair pathways that compensate — and none has been shown to be the operative
    factor. The gap matters practically, because surveillance is organ-specific and
    therefore rests on the epidemiology rather than on the mechanism.
  attaches_to:
  - pathophysiology#Genomic Instability in Glandular Epithelium
  - pathophysiology#Attenuated DNA Damage Checkpoint Signalling

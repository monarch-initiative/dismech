diagnosis:
- name: Germline ATM sequencing establishing heterozygosity
  description: >-
    The diagnosis rests on finding one heterozygous germline pathogenic ATM variant.
    Zygosity is the branch point: a second pathogenic allele makes the diagnosis
    ataxia-telangiectasia instead, a different disease with a different surveillance and
    management pathway.
  evidence:
  - reference: PMID:42258614
    reference_title: "ATM-Related Cancer Predisposition."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The diagnosis of ATM-related cancer predisposition is established in a proband with a heterozygous germline pathogenic variant in ATM identified by molecular genetic testing."
    explanation: >-
      States the diagnostic criterion, including the heterozygous requirement that
      separates this disease from ataxia-telangiectasia.
treatments:
- name: Breast surveillance from early adulthood
  description: >-
    Annual mammography from age 40 with breast MRI from age 30 to 35, the exact starting
    ages varying by country. Risk-reducing surgery and endocrine risk reduction are
    considered against personalised risk rather than offered to every carrier.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: cancer screening
    term:
      id: NCIT:C15406
      label: Cancer Screening
  target_phenotypes:
  - preferred_term: Breast carcinoma
    term:
      id: HP:0003002
      label: Breast carcinoma
  evidence:
  - reference: PMID:42258614
    reference_title: "ATM-Related Cancer Predisposition."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "annual mammogram beginning at age 40 years; annual breast MRI beginning at age 30-35 years (recommendations regarding age to start breast surveillance and use of breast MRI vary by country)"
    explanation: >-
      The surveillance schedule from this disease's own GeneReviews chapter, including
      that the starting age is not internationally settled.
- name: PARP inhibition
  description: >-
    Olaparib is approved in molecularly selected metastatic castration-resistant
    prostate cancer, and ATM was one of the genes in the registrational cohort. The
    benefit in ATM-altered disease is weaker than in BRCA-altered disease, because ATM
    loss gives a checkpoint defect rather than the homologous-recombination collapse
    that makes PARP inhibition synthetically lethal.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: olaparib
      term:
        id: CHEBI:83766
        label: olaparib
  target_mechanisms:
  - target: Attenuated DNA Damage Checkpoint Signalling
    description: >-
      PARP inhibition is used against the DNA-repair deficiency this node describes,
      though the entry records that ATM is a weaker synthetic-lethal partner than the
      homologous-recombination effector genes.
  evidence:
  - reference: PMID:32343890
    reference_title: "Olaparib for Metastatic Castration-Resistant Prostate Cancer."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "median, 7.4 months vs. 3.6 months; hazard ratio for progression or death, 0.34"
    explanation: >-
      The registrational progression-free survival result for the cohort that included
      ATM. Marked indirect because that cohort pooled BRCA1, BRCA2 and ATM and was
      dominated by BRCA2, so it does not isolate the ATM effect.
  - reference: PMID:40849250
    reference_title: "Impact of HRR Gene Subclass on Clinical Outcomes of PARP Inhibitors in Metastatic Castration-Resistant Prostate Cancer."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with effector mutations demonstrated a statistically significant improvement in PFS compared to those with sensor mutations"
    explanation: >-
      Quantifies the gap between sensor genes such as ATM and homologous-recombination
      effector genes, which is why this treatment row is qualified rather than presented
      as equivalent to its use in BRCA-altered disease.
differential_diagnoses:
- name: Ataxia-telangiectasia
  description: >-
    The biallelic disease, and the differential that matters most here because it is the
    same gene. It presents in early childhood with progressive cerebellar ataxia,
    oculocutaneous telangiectasia, immunodeficiency and a far higher cancer risk
    dominated by lymphoid malignancy. Carriers of a single allele have none of the
    neurological, immune or endocrine features. The practical connection is reproductive:
    two carriers can have a child with ataxia-telangiectasia.
  evidence:
  - reference: PMID:42258614
    reference_title: "ATM-Related Cancer Predisposition."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "offspring are at risk of inheriting biallelic ATM pathogenic variants and having ataxia-telangiectasia"
    explanation: >-
      States the relationship between the two diseases in the terms that matter to a
      carrier, and confirms that they are separate entities.
- name: CHEK2-related cancer predisposition
  description: >-
    The closest phenocopy: another moderate-penetrance, autosomal dominant predisposition
    to oestrogen-receptor-positive breast cancer, grouped with ATM in the same
    population-based analysis. Distinguished by gene testing rather than by phenotype.
- name: Hereditary breast and ovarian cancer syndrome
  description: >-
    BRCA1 and BRCA2 carry higher penetrance and a different tumour-subtype profile —
    oestrogen-receptor-negative and triple-negative disease for BRCA1 — and respond
    considerably better to PARP inhibition, being homologous-recombination effectors
    rather than damage sensors.
- name: PALB2-related cancer predisposition
  description: >-
    Another breast and pancreatic predisposition gene, but a homologous-recombination
    effector bridging BRCA1 to BRCA2, so it behaves like the BRCA genes on therapy
    response rather than like ATM.

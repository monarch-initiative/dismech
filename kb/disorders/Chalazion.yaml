name: Chalazion
creation_date: "2026-11-28T15:18:29Z"
description: >-
  Chalazion is a chronic, usually painless eyelid nodule in which obstruction
  of a meibomian gland (deep chalazion) or, less often, a gland of Zeis
  (superficial chalazion) retains meibum that provokes a sterile
  lipogranulomatous foreign-body reaction. It is the most common inflammatory
  eyelid lesion, occurs at all ages, is associated with blepharitis,
  meibomian gland dysfunction, rosacea and ocular Demodex infestation, and
  usually resolves with conservative care. Large upper-lid lesions can press
  on the cornea and induce astigmatism, which matters for amblyopia risk in
  young children. MONDO classifies chalazion under internal hordeolum and
  therefore within its bacterial (staphylococcal) infection subtree, but the
  lesion itself is typically sterile; infection is a feature of the
  hordeolum, not of the chalazion.
category: Complex
disease_term:
  preferred_term: chalazion
  term:
    id: MONDO:0005844
    label: chalazion
parents:
- eyelid disorder
- meibomian gland disorder
synonyms:
- Meibomian cyst
- Chalazia
- Tarsal cyst
notes: >-
  Classification. MONDO places chalazion as a subclass of internal hordeolum
  (MONDO:0004917) and so under bacterial infectious disease and
  Staphylococcus aureus infection. The clinical and histopathological
  literature cited here describes chalazion as a sterile lipogranuloma arising
  from noninfectious duct obstruction, and a 16S sequencing study cultured no
  bacteria or fungi from chalazion contents. The link to hordeolum is real but
  sequential: an unresolved acute internal hordeolum can evolve into a
  chalazion. This entry therefore records no infectious agent and no
  transmission route, and it is categorised as a multifactorial (Complex)
  disorder rather than an infectious disease. Demodex mites and an altered lid
  microbiome are recorded as associations, not causes. Evidence base. Most
  evidence is observational (case-control studies, claims and EHR cohorts,
  hospital case series); treatment evidence comes from several small
  randomized trials and one meta-analysis. No genetic, omics or animal-model
  data were found.

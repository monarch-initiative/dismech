histopathology:
- name: Lipogranulomatous inflammation within a pseudocapsule
  description: >-
    Lipid granules surrounded by a lipogranulomatous reaction and contained
    in a connective tissue pseudocapsule. This is the expected finding in an
    excised chalazion and the reason excised tissue is examined, because
    malignant tumours can look like a chalazion clinically.
  diagnostic: true
  evidence:
  - reference: PMID:25258508
    reference_title: "Differentiation between chalazion and sebaceous carcinoma by noninvasive meibography."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Histopathologically, chalazion manifests as a lipogranulomatous reaction
      to liberated lipid granules contained within a connective tissue
      pseudocapsule.
    explanation: >-
      Describes the defining histopathology.
- name: T-cell-predominant infiltrate with CD4 over CD8 cells
  description: >-
    Flow cytometry and immunohistochemistry of surgically excised chalazia
    show a predominantly T-cell infiltrate with more CD4-positive than
    CD8-positive cells; the same profile is seen in chalazion-associated
    pyogenic granuloma.
  evidence:
  - reference: PMID:37934292
    reference_title: "Immunophenotypic profiles in chalazion and pyogenic granuloma associated with chalazion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      the proportion of CD4-positive T cells was significantly higher than that
      of CD8-positive T cells (p < 0.0001), in both chalazion and pyogenic
      granuloma specimens.
    explanation: >-
      Quantifies the CD4 over CD8 predominance in 82 specimens from 74 Japanese
      adults.
environmental:
- name: Ocular Demodex infestation
  description: >-
    Demodex folliculorum and Demodex brevis eyelash and gland infestation is
    more common in people with chalazion and is linked to recurrent and
    multiple lesions. It is recorded as an association and risk factor, not as
    a causal agent; the histopathology study that found more D. folliculorum
    in chalazion-bearing lids could not establish causality.
  effect: Increased risk of chalazion, especially recurrent and multiple lesions
  evidence:
  - reference: PMID:35291979
    reference_title: "The association of demodex infestation with pediatric chalazia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Demodex was found in 236 (52.91%) patients with chalazia and zero control
      patients.
    explanation: >-
      In 446 children having chalazion surgery, Demodex was found in about half
      and in none of 50 surgical controls.
  - reference: PMID:35291979
    reference_title: "The association of demodex infestation with pediatric chalazia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Demodex infestation was more prevalent in pediatric chalazia patients
      than healthy children, and was associated with recurrent and multiple
      chalazia.
    explanation: >-
      Links Demodex to recurrent and multiple paediatric chalazia.
  - reference: PMID:23873491
    reference_title: "Ocular demodicidosis as a risk factor of adult recurrent chalazion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Among 48 eyes with recurrent chalazion, Demodex mites were found in 35
      (72.9%).
    explanation: >-
      Demodex was common in adult recurrent chalazion; the study had no
      control group.
  - reference: PMID:26408604
    reference_title: "Demodex mites as potential etiological factor in chalazion - a study in Poland."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Demodex was detected in 91.67% of patients with a chalazion.
    explanation: >-
      A Polish series found Demodex in most patients with chalazion.
  influences_mechanisms:
  - target: Meibomian Gland Dysfunction and Lid-Margin Disease
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Demodex is proposed to act through its effects on the eyelid margin, but
      causality has not been established.
    evidence:
    - reference: PMID:26108058
      reference_title: "The Association of Demodex with Chalazia: A Histopathologic Study of the Eyelid."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        While the authors cannot establish causality between Demodex and
        chalazia, these findings suggest that D. folliculorum indirectly may be
        involved in the pathogenesis of chalazia via its effect on the anterior
        eyelid margin.
      explanation: >-
        A histopathology case-control study of 78 eyelid specimens supports an
        indirect, lid-margin route while explicitly declining a causal claim.
- name: Tobacco smoking
  description: >-
    Smoking is a modest but consistent risk factor for chalazion in
    case-control and cohort studies.
  effect: Modestly increased risk of chalazion
  exposure_term:
    preferred_term: exposure to tobacco smoking
    term:
      id: ECTO:6000029
      label: exposure to tobacco smoking
  evidence:
  - reference: PMID:33789846
    reference_title: "Prevalence and risk factors for chalazion in an older veteran population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Factors associated with chalazion risk included smoking (OR=1.12,
      p<0.0005)
    explanation: >-
      Smoking was associated with chalazion in 3.45 million US veterans.
  - reference: PMID:37032590
    reference_title: "Risk Factors for Chalazion Diagnosis and Subsequent Surgical Excision."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Female sex, non-white race, conditions affecting periocular skin and the
      tear film, several non-ocular inflammatory conditions, and smoking were
      risk factors for chalazion diagnosis.
    explanation: >-
      Smoking was a risk factor for chalazion diagnosis in a second large
      matched cohort.
  influences_mechanisms:
  - target: Meibomian Gland Duct Obstruction
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The association is epidemiological; the route by which smoking acts on
      the meibomian gland is not established.
    evidence:
    - reference: PMID:28359272
      reference_title: "Effects of chalazia on corneal astigmatism : Large-sized chalazia in middle upper eyelids compress the cornea and induce the corneal astigmatism."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: >-
        A variety of factors are believed to be associated with the development
        of chalazia including meibomian gland dysfunction, chronic blepharitis,
        seborrheic dermatitis, gastritis, and smoking
      explanation: >-
        Background statement grouping smoking with meibomian gland
        dysfunction among factors associated with chalazion development.
- name: Low serum vitamin A
  description: >-
    Lower serum vitamin A has been reported in children and adolescents with
    chalazion, and was lowest in recurrent, multiple chalazia. Evidence comes
    from a single small case-control study.
  effect: Possible increased risk of recurrent or multiple chalazia
  evidence:
  - reference: PMID:29392144
    reference_title: "Serum Vitamin A Levels in Patients with Chalazion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Serum vitamin A levels in patients with recurrent, multiple chalazia were
      significantly lower than in patients with primary, multiple chalazia (P =
      0.026) and patients with a recurrent, single chalazion (P = 0.029).
    explanation: >-
      In 52 patients and 55 controls, recurrent multiple chalazia had the
      lowest serum vitamin A.
  influences_mechanisms:
  - target: Meibomian Gland Duct Obstruction
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Low vitamin A is associated with chalazion; any effect on duct
      obstruction is inferred, not demonstrated.
    evidence:
    - reference: PMID:29392144
      reference_title: "Serum Vitamin A Levels in Patients with Chalazion."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        In conclusion, chalazion could be one of the ocular presentations of
        vitamin A deficiency.
      explanation: >-
        The authors propose vitamin A deficiency as an upstream factor; the
        study does not show the mechanism.
progression:
- phase: Acute inflamed onset
  notes: >-
    A chalazion may begin as an acute, inflamed lesion; an unresolved acute
    internal hordeolum can evolve into a chalazion.
  evidence:
  - reference: PMID:28068454
    reference_title: "Non-surgical interventions for acute internal hordeolum."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      If unresolved, an acute internal hordeolum can become chronic, or can
      develop into a chalazion.
    explanation: >-
      Documents the hordeolum-to-chalazion sequence that underlies MONDO's
      placement of chalazion under internal hordeolum.
- phase: Chronic lipogranulomatous nodule
  notes: >-
    The established lesion is a chronic nodule. Most resolve with conservative
    care; lesions present for more than about two months are less likely to
    resolve without a procedure.
  evidence:
  - reference: PMID:42178961
    reference_title: "Twenty years of chalazion, big data analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Most chalazia resolve with conservative management.
    explanation: >-
      In 611,993 chalazion diagnoses in an Israeli health-system database,
      most resolved without invasive treatment.
  - reference: PMID:29338124
    reference_title: "Conservative therapy for chalazia: is it really effective?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Lesions that completely resolved had a statistically significant lower
      pretreatment duration (1.5 months) compared to lesions that did not
      completely resolve (2.2 months) (p = .04).
    explanation: >-
      Longer-standing lesions were less likely to resolve with conservative
      therapy.
- phase: Recurrence
  notes: >-
    Chalazia recur in up to about a third of patients, more often with
    meibomian gland disease or blepharitis and with Demodex infestation.
  evidence:
  - reference: PMID:37032590
    reference_title: "Risk Factors for Chalazion Diagnosis and Subsequent Surgical Excision."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      It is the most common eyelid lesion in the general population and can
      occur at any age with a rate of recurrence up to 35%.
    explanation: >-
      States the recurrence rate.
  - reference: PMID:34062122
    reference_title: "Chalazion: racial risk factors for formation, recurrence, and surgical intervention."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Repeated diagnoses of chalazion on separate encounters were seen in 17%
      without these conditions and in 33% (p < 0.0001) with one of these
      conditions.
    explanation: >-
      Repeat chalazion diagnoses were twice as common in children with
      meibomian gland disease, blepharitis or marginal keratitis.
diagnosis:
- name: Clinical eyelid examination
  description: >-
    The typical morphology and course usually establish the diagnosis
    clinically.
  evidence:
  - reference: PMID:34379160
    reference_title: "[Hordeolum and chalazion : (Differential) diagnosis and treatment]."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Due to the typical morphological features and clinical course, the
      diagnosis can mostly be clinically established.
    explanation: >-
      Supports clinical diagnosis for typical lesions.
- name: Histopathological examination of excised tissue
  description: >-
    Excised tissue should be examined histologically, because sebaceous
    carcinoma and other tumours masquerade as chalazion. In 1,060 specimens
    submitted as chalazion, 1.4% were malignant, and about two thirds of the
    premalignant and malignant cases had been diagnosed clinically as a
    primary rather than a recurrent chalazion.
  diagnosis_term:
    preferred_term: Biopsy Procedure
    term:
      id: NCIT:C15189
      label: Biopsy Procedure
  evidence:
  - reference: PMID:14762403
    reference_title: "Accuracy of the clinical diagnosis of chalazion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Of the 68 (6.4%) clinically misdiagnosed cases, 15 (1.4%) were found to
      be malignant, two (0.2%) premalignant, and 51 (4.8%) benign conditions.
    explanation: >-
      Quantifies how often a clinical chalazion is something else.
  - reference: PMID:14762403
    reference_title: "Accuracy of the clinical diagnosis of chalazion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Therefore, all chalazion specimens, primary or recurrent, should be
      submitted for histopathological examination.
    explanation: >-
      Recommends histopathology of every excised specimen.
  - reference: PMID:34379160
    reference_title: "[Hordeolum and chalazion : (Differential) diagnosis and treatment]."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In persistent, recurrent or clinically atypical cases malignant tumors
      must be excluded as a differential diagnosis by excisional biopsy and
      histopathological assessment.
    explanation: >-
      Names persistent, recurrent or atypical lesions as the indication for
      excisional biopsy.
- name: Eyelash sampling for Demodex
  description: >-
    Eyelash sampling with light microscopy detects ocular Demodex
    infestation, which is associated with recurrent chalazion and guides
    anti-Demodex lid treatment.
  evidence:
  - reference: PMID:23873491
    reference_title: "Ocular demodicidosis as a risk factor of adult recurrent chalazion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Demodex was detected by random lash sampling and microscopic
      examination.
    explanation: >-
      Describes the lash-sampling method used to detect Demodex in recurrent
      chalazion.
  - reference: PMID:23873491
    reference_title: "Ocular demodicidosis as a risk factor of adult recurrent chalazion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The possibility of demodicidosis should be considered in adults
      presenting with recurrent chalazia.
    explanation: >-
      Supports looking for Demodex in recurrent chalazia.
- name: Noninvasive meibography
  description: >-
    Noninvasive meibography shows a chalazion as a lesion of overall low
    reflectivity with small high-reflectivity lipid granules, unlike the
    poorly marginated high-reflectivity lesion of sebaceous carcinoma. The
    evidence is a small case series (five chalazia, three carcinomas).
  evidence:
  - reference: PMID:25258508
    reference_title: "Differentiation between chalazion and sebaceous carcinoma by noninvasive meibography."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Noninvasive meibographic imaging revealed chalazion as a lesion of
      overall low reflectivity with small regions of higher reflectivity
      corresponding to lipid granules.
    explanation: >-
      Describes the meibographic appearance of chalazion.
  - reference: PMID:25258508
    reference_title: "Differentiation between chalazion and sebaceous carcinoma by noninvasive meibography."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      On the other hand, the noninvasive meibography revealed sebaceous
      carcinoma as a poorly marginated lesion of high reflectivity in the
      eyelid.
    explanation: >-
      Describes the contrasting appearance of sebaceous carcinoma.
differential_diagnoses:
- name: Hordeolum
  description: >-
    A hordeolum is an acute, usually staphylococcal, purulent infection of
    the same eyelid glands, whereas a chalazion is a chronic sterile
    lipogranuloma.
  distinguishing_features:
  - Acute, painful and purulent rather than chronic and usually painless.
  evidence:
  - reference: PMID:36395826
    reference_title: "The lowly chalazion."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      This disease entity is differentiated from the hordeolum (stye), an acute
      purulent localized swelling of the eyelid often associated with an
      eyelash follicle, Zeis gland, or Moll gland obstruction and infection.
    explanation: >-
      Distinguishes chalazion from the acute infected hordeolum.
- name: Sebaceous carcinoma
  description: >-
    Sebaceous carcinoma is the malignancy most often missed as a chalazion;
    delayed diagnosis can be life threatening.
  distinguishing_features:
  - Recurrence or atypical appearance should prompt excisional biopsy.
  - Poorly marginated high reflectivity on noninvasive meibography.
  evidence:
  - reference: PMID:14762403
    reference_title: "Accuracy of the clinical diagnosis of chalazion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Sebaceous cell carcinoma was the most commonly missed malignancy (12
      cases, 1.1%) followed by basal cell carcinoma (three cases, 0.3%).
    explanation: >-
      Sebaceous carcinoma accounted for 12 of 1,060 specimens submitted as
      chalazion.
- name: Basal cell carcinoma of the eyelid
  description: >-
    Basal cell carcinoma was the second most commonly missed malignancy among
    specimens submitted as chalazion.
  distinguishing_features:
  - Confirmed only by histopathology.
  evidence:
  - reference: PMID:14762403
    reference_title: "Accuracy of the clinical diagnosis of chalazion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Sebaceous cell carcinoma was the most commonly missed malignancy (12
      cases, 1.1%) followed by basal cell carcinoma (three cases, 0.3%).
    explanation: >-
      Basal cell carcinoma accounted for three of 1,060 specimens submitted as
      chalazion.
treatments:
- name: Warm compresses and lid hygiene
  description: >-
    First-line conservative care with warm compresses, lid massage and lid
    hygiene. Most lesions resolve, though resolution within a few weeks is
    lower than after a procedure; adding topical tobramycin or
    tobramycin-dexamethasone to hot compresses did not improve resolution in
    a randomized trial. Conservative care succeeds most often in young
    children with small lesions.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: warm compresses
    term:
      id: NCIT:C94625
      label: Thermotherapy
  target_mechanisms:
  - target: Meibomian Gland Duct Obstruction
    treatment_effect: MODULATES
    description: >-
      Heat and massage aim to soften and express the retained secretion behind
      the blocked duct.
  evidence:
  - reference: PMID:29338124
    reference_title: "Conservative therapy for chalazia: is it really effective?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Hot compresses (HC) alone or in combination with tobramycin or
      tobramycin/dexamethasone drops and ointment are all effective first-line
      treatment options for chalazia.
    explanation: >-
      A 149-patient multicentre randomized trial supports hot compresses as
      first-line therapy, with no added benefit from the topical drugs.
  - reference: PMID:17997772
    reference_title: "A prospective randomized treatment study comparing three treatment options for chalazia: triamcinolone acetonide injections, incision and curettage and treatment with hot compresses."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      At the 3-week follow up, the resolution rates in the triamcinolone
      acetonide injection and surgical treatment groups were not significantly
      different from each other at 84% (47/56) and 87% (39/45), respectively
      (P < 0.001), but was significantly lower in the conservative treatment
      group at 46% (16/35) (P < 0.001).
    explanation: >-
      Hot compresses resolved fewer lesions at three weeks than injection or
      surgery.
  - reference: PMID:39287407
    reference_title: "Conservative Treatment of Chalazion in Pediatric Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The success rate of conservative treatment was 85.7% (78/91): 96.7%
      (29/30) in group A, 86.8% (33/38) in group B, and 69.7% (16/23) in group
      C (P = 0.022).
    explanation: >-
      In children, conservative care succeeded most often in the youngest age
      group.
- name: Intralesional triamcinolone acetonide injection
  description: >-
    Intralesional corticosteroid injection is an alternative to incision and
    curettage after failed conservative care. Single-injection success is
    lower than after one incision and curettage, and recurrence was higher in
    one trial; the gap narrows when a second injection is allowed. Skin
    depigmentation is relatively common in pigmented skin, and eyelid fat
    atrophy with depigmentation has been reported in young children.
    Injection avoids a tissue specimen, so it suits lesions whose diagnosis is
    not in doubt.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: triamcinolone acetonide
      term:
        id: CHEBI:71418
        label: triamcinolone acetonide
  target_mechanisms:
  - target: Lipogranulomatous Inflammation
    treatment_effect: INHIBITS
    description: >-
      The corticosteroid suppresses the lipogranulomatous inflammation within
      the lesion.
  evidence:
  - reference: PMID:21257145
    reference_title: "Intralesional triamcinolone acetonide injection versus incision and curettage for primary chalazia: a prospective, randomized study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Complete resolution was achieved in 33 (79%) of 42 patients in the I&C
      group and in 42 (81%) of 52 patients in the TA group (P=.8, chi-square
      analysis).
    explanation: >-
      In a 94-patient randomized trial of primary chalazia, injection matched
      incision and curettage.
  - reference: PMID:21257145
    reference_title: "Intralesional triamcinolone acetonide injection versus incision and curettage for primary chalazia: a prospective, randomized study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Injection may be considered as an alternative first-line treatment in
      cases where diagnosis is straightforward and no biopsy is required.
    explanation: >-
      Restricts injection to lesions not needing a biopsy.
  - reference: PMID:26035035
    reference_title: "Incision and Curettage Versus Steroid Injection for the Treatment of Chalazia: A Meta-Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      This analysis shows that I&C is more effective than SI with 1 procedure.
      This benefit is reduced when comparing 1 or 2 attempts of I&C and SI.
    explanation: >-
      A meta-analysis of eight randomized trials found single injection less
      effective than incision and curettage.
  - reference: PMID:31528769
    reference_title: "A prospective randomized study comparing incision and curettage with injection of triamcinolone acetonide for chronic chalazia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Lesion recurrence occurred in 9 patients (34.61%) in the TA group and 2
      (8%) in the I&C (P = 0.04).
    explanation: >-
      Recurrence was higher after injection than after incision and curettage
      in a randomized trial of chronic chalazia.
  - reference: PMID:16441988
    reference_title: "Intralesional corticosteroid injection vs surgical treatment of chalazia in pigmented patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      It is not associated with any serious complications although skin
      depigmentation is relatively common in coloured population.
    explanation: >-
      Records depigmentation as the main adverse effect in pigmented skin.
  - reference: PMID:28468185
    reference_title: "Eyelid Fat Atrophy and Depigmentation After an Intralesional Injection of Triamcinolone Acetonide to Treat Chalazion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Two patients with depigmentation and fat atrophy after an intralesional
      injection of triamcinolone acetonide (TA) to treat chalazion are
      reported.
    explanation: >-
      Case reports of eyelid fat atrophy and depigmentation in two young
      children after injection.
- name: Incision and curettage
  description: >-
    Transconjunctival incision and curettage under local anaesthesia after
    failed conservative care. It has the highest single-procedure success and
    lower recurrence than steroid injection, and it yields tissue for
    histopathology. Thermal cautery after surgery did not change recurrence.
    Children often need general anaesthesia for the procedure.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: incision and curettage
    term:
      id: NCIT:C15216
      label: Curettage Procedure
  target_mechanisms:
  - target: Lipogranulomatous Inflammation
    treatment_effect: INHIBITS
    description: >-
      Curettage removes the lipogranuloma and its contents.
  evidence:
  - reference: PMID:26035035
    reference_title: "Incision and Curettage Versus Steroid Injection for the Treatment of Chalazia: A Meta-Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      There were 264 patients treated by I&C with a larger aggregate success
      rate of 78.0% with 1 procedure and 86.7% with 1 or 2 procedures (p < 0.05
      for both comparisons).
    explanation: >-
      Pooled randomized-trial success rates for incision and curettage.
  - reference: PMID:31528769
    reference_title: "A prospective randomized study comparing incision and curettage with injection of triamcinolone acetonide for chronic chalazia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Advantages of I&C in comparison to TA include less recurrence, shorter

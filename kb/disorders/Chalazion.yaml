      chalazion group (p < 0.05).
    explanation: >-
      Corneal topography changes scaled with lesion size.
phenotypes:
- name: Chalazion Nodule
  description: >-
    A firm, slowly enlarging, usually non-tender nodule within the eyelid.
    It is more often in the upper than the lower lid; in a series of 471
    paediatric eyes the upper lid was affected in 56.9%.
  phenotype_term:
    preferred_term: Chalazion
    term:
      id: HP:0010605
      label: Chalazion
  evidence:
  - reference: PMID:33789846
    reference_title: "Prevalence and risk factors for chalazion in an older veteran population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Typically slow-growing, non-tender, and nodular, chalazia are considered
      to be the most common inflammatory eyelid lesion in the general
      population today.
    explanation: >-
      Describes the typical slow-growing, non-tender eyelid nodule.
  - reference: PMID:42507519
    reference_title: "Clinical features, treatment outcomes, and risk factors for surgery in pediatric chalazion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The upper eyelid was affected in the majority (56.9%), followed by the
      lower lid (33.3%), with involvement of both lids in 5.9%.
    explanation: >-
      Gives the lid distribution of chalazia in a paediatric series.

      reference_title: "[Hordeolum and chalazion : (Differential) diagnosis and treatment]."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        They can occur in association with underlying diseases causing
        Meibomian gland dysfunction and/or chronic blepharitis.
      explanation: >-
        Names meibomian gland dysfunction and chronic blepharitis as the
        underlying conditions on which chalazia and hordeola arise.
  evidence:
  - reference: PMID:33789846
    reference_title: "Prevalence and risk factors for chalazion in an older veteran population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Periocular skin, eyelid margin and tear film abnormalities were most
      strongly associated with risk for chalazion.
    explanation: >-
      In 3.45 million US veterans, lid-margin, periocular skin and tear-film
      conditions were the strongest risk factors for chalazion.
  - reference: PMID:21993469
    reference_title: "Associated morbidity of chalazia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The following risk factors of chalazion were statistically significant:
      blepharitis
    explanation: >-
      In a matched case-control study of 9,119 Israeli patients, blepharitis
      was the leading significant risk factor (odds ratio 6.2 in the same
      sentence), followed by rosacea.
  - reference: PMID:34062122
    reference_title: "Chalazion: racial risk factors for formation, recurrence, and surgical intervention."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      More than one chalazion was recorded in 31% of subjects without
      coexisting meibomian gland disease, blepharitis, or marginal keratitis,
      and in 56% (p < 0.0001) with one of these conditions.
    explanation: >-
      In children, coexisting meibomian gland disease or blepharitis nearly
      doubled the proportion with multiple chalazia.
  - reference: PMID:37032590
    reference_title: "Risk Factors for Chalazion Diagnosis and Subsequent Surgical Excision."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Female sex, non-white race, conditions affecting periocular skin and the
      tear film, several non-ocular inflammatory conditions, and smoking were
      risk factors for chalazion diagnosis.
    explanation: >-
      A matched cohort of 134,959 patients confirms periocular skin and
      tear-film disease as risk factors for chalazion diagnosis.

epidemiology:
- name: Japanese invasive chalazion treatment rate
  description: >-
    A 2014-2022 Japanese nationwide claims study counted 465,379 invasive
    chalazion treatments, an annual average of 40.9 per 100,000
    person-years. The codes cover removal of chalazion and partial eyelid
    resection for large chalazion, so these rates reflect surgically treated
    disease, not total incidence.
  evidence:
  - reference: PMID:41675090
    reference_title: "Sex Differences and Age Distributions in Invasive Treatments for Chalazion and Hordeolum in Japan: A 9-Year Nationwide Claims Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The annual average rates were 40.9 for ITC and 56.2 for ITH per 100 000
      person-years.
    explanation: >-
      Gives the annual rate of invasive chalazion treatment.
  - reference: PMID:41675090
    reference_title: "Sex Differences and Age Distributions in Invasive Treatments for Chalazion and Hordeolum in Japan: A 9-Year Nationwide Claims Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      ITC (K214, K215): Removal of chalazion or partial eyelid resection for
      large chalazion.
    explanation: >-
      Defines what the procedure rate counts.
- name: Israeli health-system chalazion burden and climate
  description: >-
    Over 2003-2022, 611,993 chalazion diagnoses were recorded in 412,365
    Clalit members; 9.3% needed an invasive procedure, rising with age, and
    incidence tracked mean monthly temperature.
  evidence:
  - reference: PMID:42178961
    reference_title: "Twenty years of chalazion, big data analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      A total of 611,993 chalazion diagnoses were recorded in 412,365 patients.
      Invasive procedures were required in 56,840 cases (9.3%).
    explanation: >-
      Gives the diagnosis count and the share treated invasively.
  - reference: PMID:42178961
    reference_title: "Twenty years of chalazion, big data analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Chalazion incidence correlated strongly with mean monthly temperature (r
      = 0.71, p < 0.001)
    explanation: >-
      Reports the association of incidence with temperature.

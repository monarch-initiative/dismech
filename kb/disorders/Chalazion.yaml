- name: Meibomian Gland Dysfunction and Lid-Margin Disease
  role: predisposing condition
  description: >-
    Chronic disease of the eyelid margin and periocular skin, including
    blepharitis, meibomian gland dysfunction and rosacea, is the strongest
    recognised substrate for chalazion and for multiple or recurrent lesions.
  biological_scale: TISSUE

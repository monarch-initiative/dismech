- name: Tea tree oil lid scrubs for Demodex-associated recurrence
  description: >-
    In adults with recurrent chalazion and confirmed ocular Demodex, weekly
    50% tea tree oil lid scrubs with daily tea tree shampoo scrubs were
    associated with few recurrences. The study was retrospective and had no
    control group.

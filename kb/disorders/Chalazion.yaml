- name: Antibiotics (no demonstrated benefit)
  description: >-
    Topical and oral antibiotics are often prescribed for chalazion, but
    adding an antibiotic to conservative measures was not associated with
    higher resolution in a 2,712-patient review, and topical tobramycin added
    nothing to hot compresses in a randomized trial. This row records the
    lack of benefit; antibiotics are not indicated for an uncomplicated
    sterile chalazion.
  treatment_term:
    preferred_term: Antibiotic Therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
  evidence:
  - reference: PMID:35296627
    reference_title: "Efficacy of Care and Antibiotic Use for Chalazia and Hordeola."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Although frequently prescribed, an antibiotic is unlikely to improve the
      resolution of a chalazion or hordeolum.
    explanation: >-
      Supports the statement that antibiotics do not improve chalazion
      resolution.
  - reference: PMID:37032590
    reference_title: "Risk Factors for Chalazion Diagnosis and Subsequent Surgical Excision."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Given the sterile nature of chalazia, antibiotics are not typically
      indicated in their treatment, however, antibiotics are often prescribed
      in the setting of concomitant blepharitis, ocular rosacea, or suspected
      superimposed infection.
    explanation: >-
      Explains why antibiotics are not indicated and when they are still
      given.

      retrospective empyema thoracis surgical cohort.

notes: >-
  Anaerobic pneumonia is often investigated through the adjacent aspiration
  pneumonia and lung-abscess literatures rather than a cleanly separated
  epidemiologic entity. Culture-based series are biased by the requirement for
  lower-airway or pleural specimens that are not contaminated by oral flora, and
  modern studies increasingly report aerobic Gram-negative bacilli in aspiration
  pneumonia; this entry therefore models anaerobic pneumonia as the
  anaerobe-dominant end of the aspiration/lung-abscess spectrum rather than as a
  claim that every aspiration pneumonia is anaerobic. Several cached PMIDs from
  the OpenScientist run remain navigation-only: broad aspiration-pneumonia
  epidemiology, veterinary aspiration models, and incidental abscess case reports
  were left uncited when they did not directly support the human
  anaerobe-dominant mechanism.
review_notes: >-
  Deliberately lumped. The four anaerobes in this entry -- Prevotella,
  Fusobacterium nucleatum, Peptostreptococcus and Bacteroides -- are kept together
  as one undifferentiated stratum after a rung-3 review against the six
  differentiating axes of design decisions section 3e (issue dismech#10115 decision 2).
  The decisive fact is that they do not partition cases: lower respiratory
  anaerobic infection is polymicrobial, the cited bacteriology series recovered an
  average of three anaerobes per specimen with all four genera among the commonest
  isolates (PMID:8324128, PMID:12959026), and a single empiric regimen covering the
  whole group is what treats the disease, with aminopenicillin/beta-lactamase
  inhibitor, moxifloxacin and clindamycin reported as equally effective
  (PMID:20477271). A `has_subtypes` row is a clinical stratum, and a case yielding
  Prevotella and Fusobacterium and Peptostreptococcus together cannot be assigned
  to one. Searches run on 2026-10-03: PubMed `(Prevotella[tiab] AND
  Fusobacterium[tiab] AND (pneumonia[tiab] OR "lung abscess"[tiab])) AND
  (differ*[tiab] OR compar*[tiab] OR outcome*[tiab])` returned 19 records, all oral
  or airway microbiome studies rather than per-genus clinical comparisons;
  `"Fusobacterium nucleatum"[tiab] AND pneumonia[tiab] AND (prognos*[tiab] OR
  mortality[tiab] OR severity[tiab])` returned 5, none comparing genera within
  anaerobic pneumonia; `Peptostreptococcus[tiab] AND (pneumonia[tiab] OR "lung
  abscess"[tiab]) AND (treatment[tiab] OR susceptibilit*[tiab])` returned 32, with
  no genus-specific first-line recommendation; and `anaerobic[tiab] AND
  pneumonia[tiab] AND polymicrobial[tiab]` returned 42, confirming the mixed-flora
  picture rather than contradicting it.

  The strongest contrary evidence found, recorded here so that a reviewer can
  disagree on the record rather than having to rediscover it, is PMID:30951830, a
  susceptibility survey of exactly these organisms as causes of aspiration
  pneumonia. It reports that Fusobacterium spp. were susceptible to every drug
  tested except ampicillin and showed no beta-lactamase activity, that Bacteroides
  fragilis and Peptostreptococcus spp. showed decreased susceptibility to
  cefmetazole or flomoxef, and that Prevotella spp. showed decreased ceftriaxone
  susceptibility. Drug susceptibility is one of the six axes, so this is a real
  near miss. It is judged insufficient here for two reasons: the differences are
  microbiological rather than clinical, in that no source names a genus-specific
  first-line regimen for anaerobic pneumonia or a clinical entity the field
  diagnoses as, say, Prevotella pneumonia; and the co-isolation above means the
  susceptibility profile of a case is the union of whatever grew, which is the
  reason broad anaerobic cover is given empirically. The paper is cached and named
  here but is not cited as evidence, because it supports no claim this entry makes.
  Rule R10 applies: if a source documents a genus-specific regimen or a
  genus-attributable clinical course, the row should be added then.

    Antibiotic therapy must cover anaerobes and frequent aerobic copathogens;
    clindamycin, amoxicillin-clavulanate, and ampicillin-sulbactam are named
    anti-anaerobic options, while metronidazole monotherapy is insufficient for
    mixed anaerobic-aerobic infection.
  therapeutic_modality: SMALL_MOLECULE

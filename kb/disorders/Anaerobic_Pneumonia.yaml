name: Anaerobic Pneumonia
creation_date: "2026-09-26T02:28:16Z"
category: Infectious Disease
description: >-
  Anaerobic pneumonia is a polymicrobial bacterial pneumonia in which oral or
  upper-airway anaerobes reach the lower respiratory tract, establish
  mixed anaerobic-aerobic infection, and can progress through necrotizing
  pneumonia to cavitary lung abscess and pleural empyema. The entry is scoped to
  MONDO's agent-defined term: it overlaps heavily with aspiration pneumonia, but
  aspiration pneumonia also includes chemical pneumonitis and aerobic
  Gram-negative infections in which anaerobes are not the dominant mechanism.
disease_term:
  preferred_term: anaerobic pneumonia
  term:
    id: MONDO:0004649
    label: anaerobic pneumonia
parents:
- Bacterial Pneumonia
- Anaerobic Bacteria Infectious Disease
synonyms:
- pneumonia due to anaerobic bacteria
- anaerobic pleuropulmonary infection
- anaerobic lung infection
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
infectious_agent:
- name: Prevotella
  infectious_agent_term:
    preferred_term: Prevotella
    term:
      id: NCBITaxon:838
      label: Prevotella
  description: >-
    Prevotella species are recurring oral anaerobes in anaerobic
    pleuropulmonary infection; pigmented and nonpigmented Prevotella species
    were among the most commonly encountered anaerobes in a pleural-fluid-heavy
    bacteriology series.
  evidence:
  - reference: PMID:8324128
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most commonly encountered anaerobes were pigmented Prevotella species,
      nonpigmented Prevotella species, Fusobacterium nucleatum, Peptostreptococcus
      species, and Bacteroides species.
    explanation: >-
      Identifies Prevotella as a frequent anaerobe recovered from anaerobic
      pleuropulmonary infection specimens.
- name: Fusobacterium nucleatum
  infectious_agent_term:
    preferred_term: Fusobacterium nucleatum
    term:
      id: NCBITaxon:851
      label: Fusobacterium nucleatum
  description: >-
    Fusobacterium nucleatum is an oral anaerobe repeatedly isolated from
    anaerobic lower-respiratory infection and reported in mNGS-confirmed
    anaerobic pneumonia.
  evidence:
  - reference: PMID:8324128
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most commonly encountered anaerobes were pigmented Prevotella species,
      nonpigmented Prevotella species, Fusobacterium nucleatum, Peptostreptococcus
      species, and Bacteroides species.
    explanation: >-
      Names Fusobacterium nucleatum among the common anaerobes in
      pleuropulmonary infection specimens.
- name: Peptostreptococcus
  infectious_agent_term:
    preferred_term: Peptostreptococcus
    term:
      id: NCBITaxon:1257
      label: Peptostreptococcus
  description: >-
    Peptostreptococcus species are Gram-positive anaerobic cocci that appear in
    the recurring anaerobic respiratory-pathogen set.
  evidence:
  - reference: PMID:12959026
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Peptostreptococcus, Fusobacterium, Prevotella and Bacteroides are the most
      common anaerobes.
    explanation: >-
      Lists Peptostreptococcus among common anaerobes in lower respiratory
      anaerobic infections.
- name: Bacteroides
  infectious_agent_term:
    preferred_term: Bacteroides
    term:
      id: NCBITaxon:816
      label: Bacteroides
  description: >-
    Bacteroides species are part of the recurrent oral/upper-airway anaerobic
    flora recovered from anaerobic respiratory infections.
  evidence:
  - reference: PMID:12959026
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Peptostreptococcus, Fusobacterium, Prevotella and Bacteroides are the most
      common anaerobes.
    explanation: >-
      Lists Bacteroides among common anaerobes in lower respiratory anaerobic
      infections.

pathophysiology:
- name: Oropharyngeal Anaerobe Aspiration
  role: trigger
  description: >-
    Impaired airway defense, such as alcoholism or post-stroke dysphagia,
    permits infectious material from the oropharyngeal cavity and upper
    respiratory tract to enter dependent lower-airway segments.
  biological_scale: ORGANISM
  locations:
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  evidence:
  - reference: PMID:20477271
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Pneumonia and primary lung abscesses may result from aspiration of
      infectious material from the oropharyngeal cavity and the upper respiratory
      tract.
    explanation: >-
      Supports oropharyngeal aspiration as the initiating route into the lung.
  downstream:
  - target: Polymicrobial Anaerobic-Aerobic Lung Infection
    causal_link_type: DIRECT
    description: >-
      Aspirated oral and upper-airway material seeds the lower respiratory tract
      with mixed anaerobic and aerobic flora.
    evidence:
    - reference: PMID:20477271
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Pneumonia and primary lung abscesses may result from aspiration of
        infectious material from the oropharyngeal cavity and the upper respiratory
        tract.
      explanation: >-
        Directly connects aspiration of infectious upper-airway material to
        pneumonia and primary lung abscess.

- name: Polymicrobial Anaerobic-Aerobic Lung Infection
  role: trigger
  description: >-
    The infected lung or pleural space usually contains several anaerobic
    species, often with coexisting nonanaerobes, so anaerobic pneumonia is better
    modeled as a community infection than as a single-species pneumonia.
  biological_scale: TISSUE
  locations:
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  evidence:
  - reference: PMID:8324128
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      cultures yielded an average of 3.0 anaerobes and 0.6 nonanaerobes per
      specimen.
    explanation: >-
      Quantifies the polymicrobial anaerobe-heavy composition of anaerobic
      pleuropulmonary infection specimens.
  - reference: PMID:12959026
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Lower respiratory infections are usually either polymicrobial or mixed
      anaerobic-aerobic infections.
    explanation: >-
      Describes the mixed anaerobic-aerobic bacteriology of lower respiratory
      anaerobic infections.
  downstream:
  - target: Anaerobe-Driven Adhesion and Neutrophilic Inflammation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      In model systems, Prevotella products increase lower-airway bacterial
      adhesion and inflammatory cytokines, suggesting one mechanism by which
      oral anaerobes amplify pneumonia.

- name: Anaerobe-Driven Adhesion and Neutrophilic Inflammation
  role: amplifier
  description: >-
    Products from the oral anaerobe Prevotella intermedia can amplify
    pneumococcal pneumonia in mice and increase pneumococcal adhesion to human
    alveolar epithelial cells together with platelet-activating-factor receptor
    expression, linking oral anaerobe exposure to increased lower-airway
    pathogen burden and cytokine-rich inflammation.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: epithelial cell of lower respiratory tract
    term:
      id: CL:0002632
      label: epithelial cell of lower respiratory tract
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  biological_processes:
  - preferred_term: adhesion of symbiont to host
    term:
      id: GO:0044406
      label: adhesion of symbiont to host
    modifier: INCREASED
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  evidence:
  - reference: PMID:24478074
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Mice inoculated with S. pneumoniae plus PiSup exhibited a significantly
      lower survival rate, higher bacterial loads in the lungs, spleen, and blood,
      and higher inflammatory cytokine levels in the bronchoalveolar lavage fluid
      (macrophage inflammatory protein 2 and tumor necrosis factor alpha) than
      those infected without PiSup.
    explanation: >-
      Shows in mice that Prevotella intermedia supernatant amplifies lung
      infection severity and inflammatory cytokines during pneumococcal
      pneumonia.
  - reference: PMID:24478074
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In A549 cells, PiSup increased pneumococcal adhesion and PAFR transcript
      levels.
    explanation: >-
      Shows that Prevotella products increase pneumococcal adhesion to human
      alveolar epithelial cells and induce the host receptor implicated in that
      adhesion.
  downstream:
  - target: Necrotizing Cavitary Lung Destruction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Sustained mixed bacterial growth and neutrophilic inflammation produce the
      tissue destruction that distinguishes anaerobic cavitary disease from
      uncomplicated pneumonia.

- name: Necrotizing Cavitary Lung Destruction
  role: outcome
  description: >-
    Untreated or severe anaerobic infection can progress over days from
    aspiration pneumonia to necrotizing pneumonia and pulmonary abscess, with
    foul-smelling putrid sputum and cavitary disease as delayed manifestations.
  biological_scale: TISSUE
  locations:
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  biological_processes:
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  evidence:
  - reference: PMID:20477271
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Necrotizing pneumonia, pulmonary abscesses and the characteristic,
      foul-smelling, putrid discharge only occur 8-14 days after the initial
      aspiration event.
    explanation: >-
      Links aspiration-associated cavitary anaerobic disease to necrotizing
      pneumonia, lung abscess, and the delayed putrid sputum manifestation.

phenotypes:
- name: Fever
  description: >-
    Systemic febrile illness accompanies lung abscess, one of the cavitary
    manifestations of anaerobic pneumonia.
  phenotype_term:
    preferred_term: Fever
    term:
      id: HP:0001945
      label: Fever
  evidence:
  - reference: PMID:41886424
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Systemic symptoms such as fever (91%) and hypoactivity (91%) were common.
    explanation: >-
      Reports fever in a retrospective cohort with lung abscess, grounding fever
      as a common systemic feature of cavitary pneumonia.
- name: Productive Cough
  description: >-
    Cough with sputum is common in lung abscess, and the sputum may become
    foul-smelling and putrid as anaerobic necrotizing infection matures.
  phenotype_term:
    preferred_term: Productive cough
    term:
      id: HP:0031245
      label: Productive cough
  evidence:
  - reference: PMID:41886424
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cough was reported in 87% of cases, with varying patterns (dry, wet, or
      both).
    explanation: >-
      Establishes cough as a frequent lung-abscess feature, with wet/productive
      cough represented among the reported patterns.
  - reference: PMID:20477271
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Necrotizing pneumonia, pulmonary abscesses and the characteristic,
      foul-smelling, putrid discharge only occur 8-14 days after the initial
      aspiration event.
    explanation: >-
      Supports the anaerobic-specific putrid sputum quality that can accompany
      productive cough after cavitation.
- name: Lung Abscess
  description: >-
    Cavitary pulmonary abscess is a hallmark destructive complication of
    aspiration-related anaerobic pneumonia.
  phenotype_term:
    preferred_term: Lung abscess
    term:
      id: HP:0025044
      label: Lung abscess
  evidence:
  - reference: PMID:20477271
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Necrotizing pneumonia, pulmonary abscesses and the characteristic,
      foul-smelling, putrid discharge only occur 8-14 days after the initial
      aspiration event.
    explanation: >-
      Places pulmonary abscess in the time course of aspiration-associated
      anaerobic cavitary disease.
- name: Pleural Empyema
  description: >-
    Extension of anaerobic pleuropulmonary infection to the pleural space can
    form an empyema that requires drainage or surgery.
  phenotype_term:
    preferred_term: Pleural empyema
    term:
      id: HP:0011919
      label: Pleural empyema
  evidence:
  - reference: PMID:23398871
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      These bacteria are relatively common in selected types of lung infections
      including aspiration pneumonia, lung abscess, necrotizing pneumonia and
      emphyema.
    explanation: >-
      Names pleural empyema among the selected lung infections where anaerobes
      are relatively common; the abstract misspells empyema as "emphyema".

diagnosis:
- name: Bronchoalveolar Lavage Metagenomic Sequencing
  description: >-
    Comprehensive metagenomic next-generation sequencing of bronchoalveolar
    lavage fluid can detect anaerobic sequences that targeted panels and routine
    culture miss, but the result must be interpreted against aspiration risk and
    oral-disease context because oral anaerobes can also be colonizers.
  diagnosis_term:
    preferred_term: metagenomic next-generation sequencing of bronchoalveolar lavage fluid
    term:
      id: NCIT:C101293
      label: Next Generation Sequencing
  evidence:
  - reference: PMID:42445473
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In both cases, tNGS was unable to detect anaerobic pathogens due to the
      limited scope of anaerobic bacterial targets in commercial panels. In
      contrast, comprehensive mNGS, when correctly interpreted in conjunction
      with clinical context, can detect anaerobic sequences.
    explanation: >-
      Supports comprehensive mNGS as a diagnostic route for anaerobic pneumonia
      when targeted sequencing and routine testing miss anaerobes.

treatments:
- name: Anti-Anaerobic Pharmacotherapy
  description: >-
    Antibiotic therapy must cover anaerobes and frequent aerobic copathogens;
    clindamycin and beta-lactam/beta-lactamase inhibitor combinations are
    experience-based preferred agents, while metronidazole monotherapy is
    insufficient for mixed anaerobic-aerobic infection.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: clindamycin
      term:
        id: CHEBI:3745
        label: clindamycin
  target_mechanisms:
  - target: Polymicrobial Anaerobic-Aerobic Lung Infection
    description: >-
      Anti-anaerobic antibiotics treat the mixed anaerobic-aerobic bacterial
      burden in the lung or pleural space.
  evidence:
  - reference: PMID:23398871
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Preferred antibiotics for these infections based on clinical experience are
      clindamycin and any betalactam-betalactamase inhibitor.
    explanation: >-
      Names clindamycin and beta-lactam/beta-lactamase inhibitor therapy as
      experience-based preferred antibiotic options.
  - reference: PMID:12959026
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatment includes an antibiotics regimen with an agent active against
      anaerobic and aerobic bacteria (therapy with 2 or 3 antimicrobial drugs).
    explanation: >-
      Supports broad antibacterial coverage rather than anaerobe-only treatment
      for mixed lower-respiratory anaerobic infection.
- name: Drainage or Surgery for Abscess and Empyema
  description: >-
    Drainage or surgical intervention is reserved for severe cavitary disease,
    especially pleural empyema or persistent abscess despite adequate antibiotic
    therapy.
  treatment_term:
    preferred_term: Surgical Procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Necrotizing Cavitary Lung Destruction
    description: >-
      Source-control procedures drain abscesses or infected pleural collections
      that do not resolve with pharmacotherapy alone.
  evidence:
  - reference: PMID:20477271
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Since antibiotics can provide cure in 80-90% of cases, surgical procedures
      are limited to severe complications, such as pleural empyema.
    explanation: >-
      Supports reserving surgery for severe complications after most cases are
      managed medically.

notes: >-
  Anaerobic pneumonia is often investigated through the adjacent aspiration
  pneumonia and lung-abscess literatures rather than a cleanly separated
  epidemiologic entity. Culture-based series are biased by the requirement for
  lower-airway or pleural specimens that are not contaminated by oral flora, and
  modern studies increasingly report aerobic Gram-negative bacilli in aspiration
  pneumonia; this entry therefore models anaerobic pneumonia as the
  anaerobe-dominant end of the aspiration/lung-abscess spectrum rather than as a
  claim that every aspiration pneumonia is anaerobic.

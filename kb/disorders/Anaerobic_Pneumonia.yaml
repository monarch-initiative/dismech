transmission:
- name: Aspiration of colonized oropharyngeal secretions and gastric contents
  description: >-
    Anaerobic pneumonia is acquired endogenously, not from another person: the
    inoculum is the patient's own oropharyngeal flora, carried into the lower
    respiratory tract when oral or upper gastrointestinal contents are inhaled past
    a failing airway defence. Because the anaerobes are oral commensals, the route
    and the reservoir are the same mouth, which is why poor oral hygiene raises the
    size of the inoculum rather than introducing a new organism, and why the
    anaerobe-dominant infections appear in patients whose swallowing or
    consciousness is impaired.
  notes: >-
    There is no person-to-person route and no environmental or vector reservoir for
    this entry. The host factors that permit aspiration are modelled separately in
    `environmental:`; this block records only the route by which the organisms reach
    the lung.
  evidence:
  - reference: PMID:39536943
    reference_title: >-
      "Bacteriology of Aspiration Pneumonia: The Lung Microbiome and the Changing
      Microbial Etiology."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      Aspiration pneumonia refers to the process of alveolar inflammation induced by
      the inhalation of oropharyngeal secretions into the lower respiratory tract.
    explanation: >-
      Defines the route: inhalation of oropharyngeal secretions into the lower
      respiratory tract.
  - reference: PMID:20477271
    reference_title: >-
      "Aspiration pneumonia and primary lung abscess: diagnosis and therapy of an
      aerobic or an anaerobic infection?"
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      Pneumonia and primary lung abscesses may result from aspiration of infectious
      material from the oropharyngeal cavity and the upper respiratory tract.
    explanation: >-
      Names the oropharyngeal cavity and upper respiratory tract as the source of the
      aspirated inoculum.
  - reference: PMID:11695090
    reference_title: "[Diagnosis and therapy of abscess forming pneumonia]."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      Aspiration of oro-pharyngeal secretions and gastric content is the most frequent
      cause of formation of primary lung abscess.
    explanation: >-
      Adds gastric content to the aspirated material and establishes that this route
      is the usual cause of the cavitary form.
  - reference: PMID:42445473
    reference_title: >-
      "Detection Blind Spots in Microbial Culture, tNGS, and mNGS: Anaerobic Bacterial
      Infections in the Lung-A Retrospective Analysis of Two Cases."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Aspiration pneumonia, caused by selective obligate anaerobes like oral commensal
      bacteria, occurs when oral or upper digestive tract contents are inhaled
    explanation: >-
      States that the responsible anaerobes are oral commensals, which is what makes
      this route endogenous rather than a transmission from an external source. The
      quote is the introduction of a two-case analysis stating the established route,
      so it is marked BACKGROUND.
environmental:
- name: Depressed consciousness and esophageal dysfunction
  description: >-
    Alcohol, sedative exposure, stroke-associated mental-status compromise, and
    esophageal dysfunction increase the chance that anaerobe-rich oropharyngeal
    or gastric contents enter the lower respiratory tract.
  influences_mechanisms:
  - target: Oropharyngeal Anaerobe Aspiration
    environmental_effect: PREDISPOSES
    causal_link_type: DIRECT
    description: >-
      Loss of ordinary airway protection permits aspiration, the initiating
      event for anaerobe-dominant primary lung abscess.
    evidence:
    - reference: PMID:11695090
      reference_title: "[Diagnosis and therapy of abscess forming pneumonia]."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        A compromised mental status (e.g. alcoholism, sedatives, stroke) and
        esophageal dysfunction (e.g. herniation, vomiting) are important risk
        factors.
      explanation: >-
        Names depressed consciousness and esophageal dysfunction as risk
        factors for aspiration-driven primary lung abscess.
  evidence:
  - reference: PMID:11695090
    reference_title: "[Diagnosis and therapy of abscess forming pneumonia]."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      A compromised mental status (e.g. alcoholism, sedatives, stroke) and
      esophageal dysfunction (e.g. herniation, vomiting) are important risk
      factors.
    explanation: >-
      Supports impaired consciousness and esophageal dysfunction as clinical
      contexts that predispose to aspiration and abscess-forming pneumonia.
- name: Swallowing dysfunction and impaired cough reflex
  description: >-
    Dysphagia, degenerative neurologic disease, and an impaired cough reflex
    weaken airway clearance and favor aspiration of colonized oropharyngeal
    secretions.
  influences_mechanisms:
  - target: Oropharyngeal Anaerobe Aspiration
    environmental_effect: PREDISPOSES
    causal_link_type: DIRECT
    description: >-
      Impaired swallowing and cough clearance make inhalation of oropharyngeal
      secretions into alveoli more likely.
    evidence:
    - reference: PMID:39536943
      reference_title: "Bacteriology of Aspiration Pneumonia: The Lung Microbiome and the Changing Microbial Etiology."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Predisposing factors comprise swallowing dysfunction, impaired cough
        reflex, and degenerative neurological diseases.
      explanation: >-
        Identifies the airway-protection failures that predispose to aspiration
        pneumonia.
  evidence:
  - reference: PMID:39536943
    reference_title: "Bacteriology of Aspiration Pneumonia: The Lung Microbiome and the Changing Microbial Etiology."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Aspiration pneumonia refers to the process of alveolar inflammation
      induced by the inhalation of oropharyngeal secretions into the lower
      respiratory tract.
    explanation: >-
      Frames aspiration pneumonia as inhalation of oropharyngeal secretions into
      the lower airway.
- name: Oral frailty and poor oral health
  description: >-
    Oral frailty and oral disease increase the reservoir of oral anaerobes
    available for aspiration into dependent lung segments.
  influences_mechanisms:
  - target: Oropharyngeal Anaerobe Aspiration
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Poor oral health expands the anaerobic oral burden, which can then be
      aspirated when swallowing and airway defenses fail.
    evidence:
    - reference: PMID:42548261
      reference_title: Oral Frailty and Meal Positioning Associated With Aspiration Pneumonia in Long-Term Care Residents at High Risk of Malnutrition.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        AP was associated with cumulative oral frailty-related conditions and
        meal positioning among residents at high risk of malnutrition in
        long-term care facilities.
      explanation: >-
        Connects cumulative oral frailty to aspiration pneumonia in a
        long-term-care cohort.
  evidence:
  - reference: PMID:41054501
    reference_title: "Metagenomic Next-Generation Sequencing Reveals Tannerella forsythia in Lung Abscesses: A Retrospective Case Series Linking Smoking, Oral Health, and Diagnostic Challenges."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All patients had oral diseases, and 75% were long-term smokers.
    explanation: >-
      Reports oral disease in a small anaerobic Tannerella forsythia lung
      abscess series diagnosed by bronchoalveolar-lavage mNGS.

pathophysiology:
- name: Oropharyngeal Anaerobe Aspiration
  role: trigger
  description: >-
    Impaired airway defense, such as alcoholism or post-stroke dysphagia,
    permits infectious material from the oropharyngeal cavity and upper
    respiratory tract to enter dependent lower-airway segments.
  biological_scale: ORGANISM
  locations:
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  evidence:
  - reference: PMID:20477271
    reference_title: "Aspiration pneumonia and primary lung abscess: diagnosis and therapy of an aerobic or an anaerobic infection?"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Pneumonia and primary lung abscesses may result from aspiration of
      infectious material from the oropharyngeal cavity and the upper respiratory
      tract.
    explanation: >-
      Supports oropharyngeal aspiration as the initiating route into the lung.
  downstream:
  - target: Polymicrobial Anaerobic-Aerobic Lung Infection
    causal_link_type: DIRECT
    description: >-
      Aspirated oral and upper-airway material seeds the lower respiratory tract
      with mixed anaerobic and aerobic flora.
    evidence:
    - reference: PMID:20477271
      reference_title: "Aspiration pneumonia and primary lung abscess: diagnosis and therapy of an aerobic or an anaerobic infection?"
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Pneumonia and primary lung abscesses may result from aspiration of
        infectious material from the oropharyngeal cavity and the upper respiratory
        tract.
      explanation: >-
        Directly connects aspiration of infectious upper-airway material to
        pneumonia and primary lung abscess.

- name: Polymicrobial Anaerobic-Aerobic Lung Infection
  role: trigger
  description: >-
    The infected lung or pleural space usually contains several anaerobic
    species, often with coexisting nonanaerobes, so anaerobic pneumonia is better
    modeled as a community infection than as a single-species pneumonia.
  biological_scale: TISSUE
  locations:
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  evidence:
  - reference: PMID:8324128
    reference_title: "Bacteriology of anaerobic pleuropulmonary infections: preliminary report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      cultures yielded an average of 3.0 anaerobes and 0.6 nonanaerobes per
      specimen.
    explanation: >-
      Quantifies the polymicrobial anaerobe-heavy composition of anaerobic
      pleuropulmonary infection specimens.
  - reference: PMID:12959026
    reference_title: "[Incidence of anaerobic bacteria in respiratory tract infections]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Lower respiratory infections are usually either polymicrobial or mixed
      anaerobic-aerobic infections.
    explanation: >-
      Describes the mixed anaerobic-aerobic bacteriology of lower respiratory
      anaerobic infections.
  downstream:
  - target: Prevotella-Enhanced Alveolar Adhesion
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      In model systems, Prevotella products increase lower-airway bacterial
      adhesion, suggesting one mechanism by which oral anaerobes can amplify
      coinfecting bacterial pneumonia.
  - target: Fever
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Mixed anaerobic-aerobic infection in the lung can produce systemic
      febrile illness.

- name: Prevotella-Enhanced Alveolar Adhesion
  role: amplifier
  description: >-
    Products from the oral anaerobe Prevotella intermedia can amplify
    pneumococcal adhesion to human alveolar epithelial cells together with
    platelet-activating-factor receptor expression. This is modeled as indirect
    support because the experiment used a pneumococcal coinfection rather than
    a purely anaerobic pneumonia.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: epithelial cell of lower respiratory tract
    term:
      id: CL:0002632
      label: epithelial cell of lower respiratory tract
  biological_processes:
  - preferred_term: adhesion of symbiont to host
    term:
      id: GO:0044406
      label: adhesion of symbiont to host
    modifier: INCREASED
  downstream:
  - target: Anaerobe-Amplified Pneumonic Inflammation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Higher lower-airway bacterial adhesion can increase the lung bacterial
      burden that drives host cytokine release.
  evidence:
  - reference: PMID:24478074
    reference_title: Prevotella intermedia induces severe bacteremic pneumococcal pneumonia in mice with upregulated platelet-activating factor receptor expression.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: >-
      In A549 cells, PiSup increased pneumococcal adhesion and PAFR transcript
      levels.
    explanation: >-
      Shows that Prevotella products increase pneumococcal adhesion to human
      alveolar epithelial cells and induce the host receptor implicated in that
      adhesion; the assay is indirect because it tests pneumococcal adhesion
      under Prevotella supernatant exposure.

- name: Anaerobe-Amplified Pneumonic Inflammation
  role: amplifier
  description: >-
    In mouse coinfection experiments, Prevotella intermedia products intensified
    pneumococcal pneumonia, bacterial burden, and alveolar cytokine production.
    This supports an anaerobe-mediated inflammatory amplification arm rather
    than a direct human anaerobic-pneumonia mechanism.
  biological_scale: TISSUE
  locations:
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  biological_processes:
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  downstream:
  - target: Necrotizing Cavitary Lung Destruction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Sustained mixed bacterial growth and cytokine-rich inflammation are
      upstream of the tissue destruction that distinguishes cavitary anaerobic
      disease from uncomplicated pneumonia.
  evidence:
  - reference: PMID:24478074
    reference_title: Prevotella intermedia induces severe bacteremic pneumococcal pneumonia in mice with upregulated platelet-activating factor receptor expression.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: >-
      Mice inoculated with S. pneumoniae plus PiSup exhibited a significantly
      lower survival rate, higher bacterial loads in the lungs, spleen, and
      blood, and higher inflammatory cytokine levels in the bronchoalveolar
      lavage fluid (macrophage inflammatory protein 2 and tumor necrosis factor
      alpha) than those infected without PiSup.
    explanation: >-
      Demonstrates Prevotella-mediated inflammatory amplification in a
      pneumococcal pneumonia model, an indirect model for oral-anaerobe synergy
      in the lower airway.

- name: Necrotizing Cavitary Lung Destruction
  role: outcome
  description: >-
    Untreated or severe anaerobic infection can progress over days from
    aspiration pneumonia to necrotizing pneumonia and pulmonary abscess, with
    foul-smelling putrid sputum and cavitary disease as delayed manifestations.
  biological_scale: TISSUE
  locations:
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  biological_processes:
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  evidence:
  - reference: PMID:20477271
    reference_title: "Aspiration pneumonia and primary lung abscess: diagnosis and therapy of an aerobic or an anaerobic infection?"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Necrotizing pneumonia, pulmonary abscesses and the characteristic,
      foul-smelling, putrid discharge only occur 8-14 days after the initial
      aspiration event.
    explanation: >-
      Links aspiration-associated cavitary anaerobic disease to necrotizing
      pneumonia, lung abscess, and the delayed putrid sputum manifestation.
  downstream:
  - target: Lung Abscess
    causal_link_type: DIRECT
    description: >-
      Necrotizing anaerobic pneumonia destroys lung parenchyma and forms
      cavitary pulmonary abscesses.
    evidence:
    - reference: PMID:20477271
      reference_title: "Aspiration pneumonia and primary lung abscess: diagnosis and therapy of an aerobic or an anaerobic infection?"
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Necrotizing pneumonia, pulmonary abscesses and the characteristic,
        foul-smelling, putrid discharge only occur 8-14 days after the initial
        aspiration event.
      explanation: >-
        Places pulmonary abscess downstream of the initial aspiration event.
  - target: Productive Cough
    causal_link_type: DIRECT
    description: >-
      Cavitary anaerobic disease can drain foul, putrid material into the
      airway and cause productive cough.
    evidence:
    - reference: PMID:20477271
      reference_title: "Aspiration pneumonia and primary lung abscess: diagnosis and therapy of an aerobic or an anaerobic infection?"
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Necrotizing pneumonia, pulmonary abscesses and the characteristic,
        foul-smelling, putrid discharge only occur 8-14 days after the initial
        aspiration event.
      explanation: >-
        Supports putrid sputum as a delayed manifestation of cavitary anaerobic
        pneumonia.
  - target: Pleural Extension of Infection
    causal_link_type: DIRECT
    description: >-
      Peripheral or ruptured cavitary infection can extend through the pleura,
      creating empyema or bronchopleural fistula.
  - target: Hemoptysis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Cavitary lung abscess can erode inflamed airway and vascular tissue,
      producing hemoptysis in some anaerobic abscess presentations.
  - target: Chest pain
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Cavitary and pleural inflammation can manifest with chest pain.

- name: Pleural Extension of Infection
  role: outcome
  conforms_to: "parapneumonic_empyema_formation#Bacterial Pleural Invasion and Purulent Progression"
  description: >-
    Cavitary lung infection can involve the pleural surface or rupture into the
    pleural space, producing empyema and, in severe cases, bronchopleural
    fistula that requires source control.
  biological_scale: TISSUE
  locations:
  - preferred_term: pleura
    term:
      id: UBERON:0000977
      label: pleura
  downstream:
  - target: Pleural Empyema
    causal_link_type: DIRECT
    description: >-
      Pleural extension seeds infected fluid in the pleural cavity and produces
      empyema.
    evidence:
    - reference: PMID:20477271
      reference_title: "Aspiration pneumonia and primary lung abscess: diagnosis and therapy of an aerobic or an anaerobic infection?"
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Since antibiotics can provide cure in 80-90% of cases, surgical
        procedures are limited to severe complications, such as pleural empyema.
      explanation: >-
        Identifies pleural empyema as a severe complication of aspiration
        pneumonia and primary lung abscess.

phenotypes:
- name: Fever
  description: >-
    Systemic febrile illness accompanies lung abscess, one of the cavitary
    manifestations of anaerobic pneumonia.
  phenotype_term:
    preferred_term: Fever
    term:
      id: HP:0001945
      label: Fever
  evidence:
  - reference: PMID:41886424
    reference_title: "Clinical presentation and management outcomes of pediatric lung abscess: A retrospective cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Systemic symptoms such as fever (91%) and hypoactivity (91%) were common.
    explanation: >-
      Reports fever in a pediatric lung-abscess cohort, grounding fever as a
      common systemic feature of cavitary pneumonia while not claiming that all
      pediatric abscesses were anaerobic.
- name: Productive Cough
  description: >-
    Cough with sputum is common in lung abscess, and the sputum may become
    foul-smelling and putrid as anaerobic necrotizing infection matures.
  phenotype_term:
    preferred_term: Productive cough
    term:
      id: HP:0031245
      label: Productive cough
  evidence:
  - reference: PMID:41886424
    reference_title: "Clinical presentation and management outcomes of pediatric lung abscess: A retrospective cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cough was reported in 87% of cases, with varying patterns (dry, wet, or
      both).
    explanation: >-
      Establishes cough as a frequent lung-abscess feature, with wet/productive
      cough represented among the reported patterns.
  - reference: PMID:20477271
    reference_title: "Aspiration pneumonia and primary lung abscess: diagnosis and therapy of an aerobic or an anaerobic infection?"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Necrotizing pneumonia, pulmonary abscesses and the characteristic,
      foul-smelling, putrid discharge only occur 8-14 days after the initial
      aspiration event.
    explanation: >-
      Supports the anaerobic-specific putrid sputum quality that can accompany
      productive cough after cavitation.
- name: Hemoptysis

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The primary clinical manifestations were nonspecific respiratory symptoms,
      including cough, fever, chest pain, and hemoptysis.
    explanation: >-
      Documents hemoptysis in a small mNGS-confirmed Tannerella forsythia lung
      abscess series.
- name: Chest pain
  description: >-
    Anaerobic lung abscess can present with chest pain among other nonspecific

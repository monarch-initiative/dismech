name: NEUROD2-Related Developmental and Epileptic Encephalopathy
creation_date: "2026-08-20T06:45:00Z"
category: Mendelian
synonyms:
- Developmental and epileptic encephalopathy 72
- DEE72
- EIEE72
- NEUROD2-related neurodevelopmental disorder
description: >-
  NEUROD2-related developmental and epileptic encephalopathy (DEE72) is caused by
  heterozygous de novo variants in NEUROD2, a class II basic helix-loop-helix proneural
  transcription factor that dimerises with E-proteins to bind E-box elements in the
  promoters of neuronal differentiation genes. It is unusual among the developmental and
  epileptic encephalopathies in that the primary lesion is transcriptional rather than in
  a channel, synaptic protein or trafficking component, so the disorder arises from
  mis-specified cortical development rather than from a directly altered conductance. The
  phenotype has since broadened to include developmental delay without epilepsy at all.
disease_term:
  preferred_term: developmental and epileptic encephalopathy, 72
  term:
    id: MONDO:0032710
    label: developmental and epileptic encephalopathy, 72
parents:
- Epilepsy
- Neurological Disease
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Heterozygous and de novo.
  evidence:
  - reference: PMID:30323019
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified novel de novo variants in neuronal differentiation factor 2
      (NEUROD2) in two unrelated children with early infantile epileptic encephalopathy"
    explanation: >-
      Establishes the de novo heterozygous architecture in the founding pair of patients.

pathophysiology:

- name: De Novo NEUROD2 Variant
  biological_scale: MOLECULAR
  description: >-
    The initiating lesion. Patient variants reduce NEUROD2 activity rather than abolishing
    the protein - overexpression of the patient alleles was markedly less effective than
    wild type in a functional assay, which is what establishes them as hypomorphic rather
    than merely present.
  evidence:
  - reference: PMID:30323019
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Overexpression of wild-type NEUROD2 induced ectopic neurons in tadpoles;
      however, patient variants were markedly less effective, suggesting that both variants
      are dysfunctional and likely pathogenic"
    explanation: >-
      A functional assay comparing patient alleles against wild type, which is what
      distinguishes a hypomorphic variant from an incidental one.
  downstream:
  - target: Reduced Proneural Transcription Factor Activity
    causal_link_type: DIRECT
    description: >-
      The variant acts on the transcription factor's own activity.

- name: Reduced Proneural Transcription Factor Activity
  biological_scale: MOLECULAR
  description: >-
    Loss of NEUROD2 transcriptional activity during vertebrate brain development. This is
    the disorder's defining molecular state and the level at which it differs from most
    developmental and epileptic encephalopathies: the lesion is in a regulator of gene
    expression, so its consequences are distributed across every downstream program
    NEUROD2 controls rather than concentrated in one protein's function.
  biological_processes:
  - preferred_term: central nervous system neuron differentiation
    modifier: DECREASED
    term:
      id: GO:0021953
      label: central nervous system neuron differentiation
  evidence:
  - reference: PMID:38788202
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Our results support a model of DEE75 resulting from reduced NeuroD2 activity
      during vertebrate brain development"
    explanation: >-
      States the reduced-activity model directly. Note the source labels the disorder
      DEE75; that designation belongs to a different disease and the discrepancy is
      addressed in this entry's notes and in a dedicated discussion.
  downstream:
  - target: Disrupted Cortical Neuron Migration and Lamination
    causal_link_type: DIRECT
    description: >-
      NEUROD2 regulates genes required for radial migration and layer specification.
  - target: Blood-Brain Barrier Permeability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      A separate, non-neuronal arm established in the tadpole model; the intervening steps
      between reduced NEUROD2 activity and barrier leakiness are not established.

- name: Disrupted Cortical Neuron Migration and Lamination
  biological_scale: TISSUE
  description: >-
    NEUROD2 target genes include those required for radial migration and layer-specific
    differentiation of cortical projection neurons, so reduced activity mis-positions
    neurons rather than killing them. Notably the gross structure of the tadpole brain
    appeared normal despite the functional phenotype, so this is a wiring defect rather
    than a malformation visible at low magnification.
  biological_processes:
  - preferred_term: cerebral cortex radially oriented cell migration
    modifier: ABNORMAL
    term:
      id: GO:0021799
      label: cerebral cortex radially oriented cell migration
  cell_types:
  - preferred_term: cortical glutamatergic projection neuron
    term:
      id: CL:0000679
      label: glutamatergic neuron
  evidence:
  - reference: PMID:34188164
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In Neurod2 KO embryos, cortical projection neurons over-migrated, thereby
      altering the final size and position of layers"
    explanation: >-
      The direct migration measurement, in a layered mammalian cortex rather than the
      lissencephalic tadpole. Note the direction: neurons over-migrate rather than failing
      to migrate, so the defect is mis-positioning rather than arrest.
  - reference: PMID:34188164
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "spine density and turnover were dysregulated in apical but not basal
      compartments in layer 5 neurons"
    explanation: >-
      Compartment-specific synaptic pathology - apical but not basal - which is a finer
      distinction than a general statement of altered connectivity and is preserved here
      rather than summarised away.
  - reference: PMID:38788202
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "While the resulting tadpole brain appeared grossly normal, the blood-brain
      barrier (BBB) was found to be leakier than that of controls"
    explanation: >-
      Records that gross brain structure is preserved, which is what makes this a
      circuit-wiring rather than a malformation disorder, and simultaneously introduces the
      barrier arm.
  downstream:
  - target: Neuronal Hyperactivity
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Mis-wired cortical circuitry is the proposed substrate for the hyperactivity, but no
      source establishes the intervening steps.

- name: Blood-Brain Barrier Permeability
  biological_scale: TISSUE
  description: >-
    A leaky blood-brain barrier in the CRISPR tadpole model. This is the entry's most
    unusual node: a non-neuronal contributor to epileptogenesis in a disorder whose gene is
    a neuronal transcription factor. It is curated as its own arm rather than as a
    consequence of the neuronal phenotype, because the losartan experiment acts on it
    directly and improves seizures.
  cell_types:
  - preferred_term: endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  evidence:
  - reference: PMID:38788202
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "the blood-brain barrier (BBB) was found to be leakier than that of controls"
    explanation: >-
      The barrier measurement in the model.
  - reference: PMID:38788202
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "indicate that a leaky BBB contributes to epileptogenesis"
    explanation: >-
      The authors' own claim that the barrier defect is causally involved rather than
      incidental.
  downstream:
  - target: Neuronal Hyperactivity
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Barrier leak is proposed to contribute to epileptogenesis, supported by the losartan
      rescue acting on both together.

- name: Neuronal Hyperactivity
  biological_scale: CELLULAR
  description: >-
    Calcium imaging in the tadpole model shows prolonged, strong signals sweeping through
    the brain. Curated at the level the source states it, as network-level hyperactivity
    measured by calcium signal rather than as single-neuron excitability, which was not
    measured here.
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Neuronal Hyperexcitability and Hypersynchrony"
  evidence:
  - reference: PMID:38788202
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Live imaging of Ca2+ signaling revealed prolongued, strong signals sweeping
      through the brain, indicative of neuronal hyperactivity"
    explanation: >-
      The imaging measurement and the interpretation the authors draw from it. The
      source's spelling of "prolongued" is reproduced as published.
  - reference: PMID:34188164
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Patch-clamp recordings in layer 5 neurons of juvenile mice revealed increased
      intrinsic excitability"
    explanation: >-
      Independent, cell-resolved confirmation of increased excitability in a mammalian
      model, complementing the network-level calcium signal from the tadpole. The two
      measurements are at different scales and in different species, which is why both are
      curated rather than one standing for the other.
  - reference: PMID:34188164
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Bulk RNA sequencing showed dysregulated expression of many genes associated
      with neuronal excitability and synaptic function"
    explanation: >-
      Establishes the transcriptional route from the transcription factor lesion to the
      excitability phenotype, which is the mechanistically expected path for this gene
      class.
  downstream:
  - target: Seizures
    causal_link_type: DIRECT
    description: >-
      Network hyperactivity manifests as seizure activity.

- name: Seizures
  biological_scale: ORGANISM
  description: >-
    Early-onset refractory seizures, characteristically including epileptic spasms. Crucially
    seizures are not obligatory: the phenotype now includes developmental delay without
    epilepsy, so the disorder should not be defined by its seizures alone.
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Recurrent Unprovoked Seizures"
  evidence:
  - reference: PMID:30323019
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Depleting neurod2 with CRISPR/Cas9-mediated genome editing induced
      spontaneous seizures in tadpoles, mimicking the patients' condition"
    explanation: >-
      Establishes that depleting the gene reproduces spontaneous seizures, linking the
      molecular lesion to the clinical endpoint in a model.

phenotypes:

- category: Neurological
  name: Early-Onset Seizures
  description: >-
    Seizures typically begin in the first months of life, often as epileptic spasms.
  phenotype_term:
    preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
  evidence:
  - reference: PMID:30323019
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "novel de novo variants in neuronal differentiation factor 2 (NEUROD2) in two
      unrelated children with early infantile epileptic encephalopathy"
    explanation: >-
      Establishes early infantile epileptic encephalopathy as the founding phenotype.

- category: Neurological
  name: Epileptic Spasms
  description: >-
    Epileptic spasms beginning in the first months of life, with multifocal independent
    spikes on EEG.
  phenotype_term:
    preferred_term: Epileptic spasm
    term:
      id: HP:0011097
      label: Epileptic spasm
  evidence:
  - reference: PMID:36494631
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report a female patient of Southeast Asian ethnicity with global
      developmental delay and epileptic spasms commencing in the first few months of life"
    explanation: >-
      Documents epileptic spasms with onset in the first months in a genotype-confirmed
      patient.

- category: Neurological
  name: Global Developmental Delay
  description: >-
    Developmental impairment is the one feature present across the whole reported spectrum,
    including in the individual reported without epilepsy. That makes it, rather than the
    seizures, the phenotype the disorder is most reliably defined by.
  phenotype_term:
    preferred_term: Global developmental delay
    term:
      id: HP:0001263
      label: Global developmental delay
  evidence:
  - reference: PMID:33438828
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report an adolescent with developmental delay without seizures who
      was found to have a novel de novo heterozygous NEUROD2 missense variant"
    explanation: >-
      Documents developmental delay in the absence of seizures, which is what establishes
      the delay rather than the epilepsy as the constant feature.
  - reference: PMID:33438828
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Her characteristics are notable primarily for global development delay
      without the early-onset epileptic encephalopathy of the previously observed
      phenotype"
    explanation: >-
      States the contrast with the founding phenotype explicitly.

- category: Neurological
  name: Drug-Resistant Epilepsy
  description: >-
    Where seizures occur they are typically refractory to multiple antiseizure medications,
    though non-pharmacological approaches have achieved control in individual patients.
  phenotype_term:
    preferred_term: Refractory drug response
    term:
      id: HP:0020174
      label: Refractory drug response
  evidence:
  - reference: PMID:33438828
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both patients were non-responsive to multiple antiepileptic medications, one
      becoming seizure-free with a ketogenic diet, the other with a vagal nerve stimulator"
    explanation: >-
      Documents non-response to multiple drugs, and simultaneously records that two
      non-drug approaches each achieved seizure freedom - which is why this entry does not
      describe the epilepsy as untreatable.

genetic:
- name: NEUROD2
  gene_term:
    preferred_term: NEUROD2
    term:
      id: hgnc:7763
      label: NEUROD2
  relationship_type: CAUSATIVE
  association: >-
    Heterozygous de novo variants in NEUROD2 reduce the activity of the encoded
    transcription factor and cause DEE72. Patient variants are hypomorphic rather than
    null, being markedly less effective than wild type in a neuron-induction assay.
  evidence:
  - reference: PMID:30323019
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified novel de novo variants in neuronal differentiation factor 2
      (NEUROD2) in two unrelated children with early infantile epileptic encephalopathy"
    explanation: >-
      The gene-disease assertion from the founding study.
  notes: >-
    A nomenclature hazard worth recording. One of the sources cited here, the Xenopus laevis
    CRISPR model, repeatedly designates this disorder DEE75. That designation belongs to a
    different disease: DEE75 is MONDO:0032752, OMIM 618437, caused by PARS2. NEUROD2 is
    DEE72, MONDO:0032710, OMIM 618374, which carries EIEE72 as an exact synonym. The paper
    is cited here for its findings, which concern NEUROD2 and are not in doubt, but its DEE
    number is not propagated into this entry. A future curator should not "correct" DEE72 to
    DEE75 on the strength of that paper.

diagnosis:
- name: Electroencephalography
  description: >-
    EEG in the spasms presentation shows multifocal independent spikes, and improves
    markedly with effective treatment - making it useful for following response as well as
    for diagnosis.
  diagnosis_term:
    preferred_term: Electroencephalography
    term:
      id: NCIT:C38054
      label: Electroencephalography
  evidence:
  - reference: PMID:36494631
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Electroencephalogram before treatment showed multifocal independent spikes
      predominantly in both posterior head regions and demonstrated marked improvement
      following combined vigabatrin and high-dose prednisolone treatment"
    explanation: >-
      Records both the characteristic interictal pattern and its response to treatment.

- name: Whole Exome Sequencing
  description: >-
    The gene was identified by exome sequencing and diagnosis remains genotype-driven.
  diagnosis_term:
    preferred_term: Whole Exome Sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:30323019
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We used whole exome sequencing to identify candidate genes"
    explanation: >-
      Establishes the diagnostic route by which the gene-disease relationship was found.

treatments:
- name: Combined Vigabatrin and High-Dose Prednisolone
  description: >-
    The one treatment in this entry with a documented positive response. A genotype-confirmed
    patient with epileptic spasms responded to combined vigabatrin and high-dose
    prednisolone, with marked EEG improvement. This is a single case, so it establishes that
    the standard spasms regimen can work in this genotype - not a response rate.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: vigabatrin
      term:
        id: CHEBI:63638
        label: vigabatrin
    - preferred_term: prednisolone
      term:
        id: CHEBI:8378
        label: prednisolone
  evidence:
  - reference: PMID:36494631
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Electroencephalogram before treatment showed multifocal independent spikes
      predominantly in both posterior head regions and demonstrated marked improvement
      following combined vigabatrin and high-dose prednisolone treatment"
    explanation: >-
      The measured response to the combination, reported as an objective EEG change rather
      than as a clinical impression. Preferred over the paper's title, which states the same
      result less precisely.
  - reference: PMID:36494631
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "there are limited data about the treatment course of ES with combined
      vigabatrin and high-dose prednisolone in the NEUROD2-related NDD syndrome"
    explanation: >-
      The authors' own statement of how thin the evidence base is, which is why this entry
      curates the response as a single documented case rather than as an expected outcome.

- name: Ketogenic Diet
  description: >-
    One reported patient became seizure-free on a ketogenic diet after failing multiple
    antiseizure medications.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Dietary Intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  evidence:
  - reference: PMID:33438828
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both patients were non-responsive to multiple antiepileptic medications, one
      becoming seizure-free with a ketogenic diet, the other with a vagal nerve stimulator"
    explanation: >-
      Documents seizure freedom on a ketogenic diet in a drug-refractory patient.

- name: Vagus Nerve Stimulation
  description: >-
    A second drug-refractory patient became seizure-free with a vagal nerve stimulator.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: Implanted vagus nerve stimulation
  notes: >-
    Deliberately left unbound - needs term / NTR. NCIT's only vagus-nerve option is
    NCIT:C203750 Transcutaneous Auricular Vagus Nerve Stimulation, which is a different,
    non-implanted modality; the cited patient had an implanted vagal nerve stimulator.
    Binding the transcutaneous term would misstate the intervention, and no NCIT term for
    implanted vagus nerve stimulation was found.
  evidence:
  - reference: PMID:33438828
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "one becoming seizure-free with a ketogenic diet, the other with a vagal nerve
      stimulator"
    explanation: >-
      Documents seizure freedom with vagus nerve stimulation in the second refractory
      patient.

animal_models:
- name: Xenopus laevis NeuroD2 CRISPR knockdown tadpole
  species: Xenopus laevis
  genotype: NeuroD2.S CRISPR/Cas9 edited
  publication: PMID:38788202
  description: >-
    A CRISPR knockdown tadpole that reproduces seizure behaviour and network hyperactivity,
    and that produced the entry's most unexpected finding - a leaky blood-brain barrier -
    together with a pharmacological rescue acting on it.
  modeled_mechanisms:
  - target: Neuronal Hyperactivity
    relationship: RECAPITULATES
    fidelity: MODERATE
    limitations: >-
      The Xenopus forebrain is lissencephalic, unlayered, and forms outside-in, whereas the
      human neocortex is six-layered and forms inside-out via radial migration. Since the
      proposed human mechanism runs through disrupted radial migration and lamination, the
      model cannot test the step it is being used to support, and higher cognitive
      phenotypes cannot be assessed at all.
    description: >-
      Calcium imaging shows prolonged signals sweeping through the brain.
    readouts:
    - name: Brain-wide calcium signal
      target: Neuronal Hyperactivity
      direction: INCREASED
      interpretation: >-
        Prolonged, strong signals sweeping through the brain.
      evidence:
      - reference: PMID:38788202
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Live imaging of Ca2+ signaling revealed prolongued, strong signals
          sweeping through the brain, indicative of neuronal hyperactivity"
        explanation: >-
          The imaging measurement behind this readout.
    evidence:
    - reference: PMID:38788202
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "NeuroD2.S CRISPR/Cas9 edited tadpoles were more active, swam faster on
        average, and had more seizures"
      explanation: >-
        Establishes the behavioural seizure phenotype that makes the model informative.
  - target: Blood-Brain Barrier Permeability
    relationship: RECAPITULATES
    fidelity: LOW
    limitations: >-
      The barrier phenotype has been demonstrated only in tadpoles. No human data establish
      that blood-brain barrier permeability is altered in NEUROD2 patients, so this arm rests
      entirely on the model - which is why it carries a HUMAN_MODEL_MISMATCH discussion
      rather than being presented as an established part of the human disease.
    description: >-
      Increased barrier permeability, rescued alongside seizures by losartan.
    readouts:
    - name: Blood-brain barrier permeability
      target: Blood-Brain Barrier Permeability
      direction: INCREASED
      interpretation: >-
        The barrier is leakier than in sibling controls.
      evidence:
      - reference: PMID:38788202
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "the blood-brain barrier (BBB) was found to be leakier than that of
          controls"
        explanation: >-
          The permeability measurement behind this readout.
    - name: Seizure events under losartan
      target: Blood-Brain Barrier Permeability
      direction: DECREASED
      interpretation: >-
        A TGF-beta antagonist that acts on the barrier reduced seizure events more than
        four-fold, which is the experiment linking the barrier arm to the seizures.
      evidence:
      - reference: PMID:38788202
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Treatment of NeuroD2 CRISPant tadpoles with 5 mM Losartan decreased
          seizure events by more than 4-fold compared to the baseline"
        explanation: >-
          The rescue measurement behind this readout.
    evidence:
    - reference: PMID:38788202
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Losartan was shown to have a short-term protective effect, reducing
        neuronal hyperactivity and reducing permeability of the BBB"
      explanation: >-
        Supports treating the barrier as a mechanistically involved arm rather than an
        incidental finding, since acting on it improves the neuronal phenotype. The word
        "short-term" is retained because durability was not established.

discussions:

- discussion_id: mismatch_bbb_arm_rests_entirely_on_tadpole
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Blood-Brain Barrier Permeability
  prompt: >-
    Is the blood-brain barrier defect part of the human disorder, or a feature of the
    tadpole model?
  rationale: >-
    This is the entry's most interesting claim and its least established. A leaky
    blood-brain barrier is a non-neuronal contributor to epileptogenesis in a disorder
    caused by a neuronal transcription factor, and the losartan experiment gives it causal
    weight in the model: a TGF-beta antagonist reduced both barrier permeability and seizure
    events more than four-fold. But every part of that sits in Xenopus. No human data
    establish altered barrier permeability in NEUROD2 patients. The stake is unusually
    concrete, because losartan is an approved drug in wide human use, so a positive human
    finding would point directly at a repurposing candidate - and a negative one would
    remove the rationale entirely. The rescue is also described by its own authors as
    short-term, so even within the model durability is unestablished.
  proposed_experiments:
  - experiment_id: exp_bbb_integrity_in_neurod2_patients
    name: Barrier integrity in NEUROD2 patients
    description: >-
      Assess blood-brain barrier integrity in genotype-confirmed NEUROD2 patients using
      contrast-enhanced imaging or CSF-to-serum protein ratios, and compare against
      age-matched epilepsy controls, to determine whether the tadpole finding has a human
      counterpart before any repurposing trial is contemplated.

- discussion_id: mismatch_lissencephalic_model_for_a_lamination_mechanism
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Disrupted Cortical Neuron Migration and Lamination
  prompt: >-
    Can a lissencephalic, unlayered, outside-in brain test a mechanism defined by
    inside-out radial migration into a six-layered cortex?
  rationale: >-
    The proposed human mechanism runs through disrupted radial migration and layer-specific
    differentiation of cortical projection neurons. The principal in vivo model is the
    Xenopus tadpole, whose forebrain is lissencephalic and unlayered and forms from the
    outside in, so the oldest neurons end up outermost - the opposite ordering to the human
    neocortex. The model therefore cannot test the lamination step it is being used to
    support; what it can show is that reduced NeuroD2 activity produces seizures and network
    hyperactivity, which it does. The mouse work on cortical over-migration and layer 5
    positioning is the better-matched evidence for the lamination arm, and this entry marks
    the edge from lamination to hyperactivity as indirect with unknown intermediates rather
    than treating the tadpole seizure phenotype as confirmation of the migration account.
  proposed_experiments:
  - experiment_id: exp_layer_resolved_migration_in_a_gyrencephalic_model
    name: Layer-resolved migration phenotype in a layered cortex
    description: >-
      Characterise laminar position and radial migration of cortical projection neurons in a
      Neurod2 hypomorphic mouse carrying a patient-equivalent allele, rather than a null, and
      determine whether mis-lamination is present at the allele dosage that causes human
      disease.

- discussion_id: gap_seizures_are_not_obligatory
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Seizures
  prompt: >-
    What determines whether a NEUROD2 variant carrier develops epilepsy at all?
  rationale: >-
    The disorder is named and defined as an epileptic encephalopathy, but at least one
    individual with a de novo NEUROD2 missense variant has developmental delay and no
    seizures. That is not a minor phenotypic footnote: it means the seizures are a frequent
    consequence rather than a defining one, and it raises the question of what separates
    carriers who develop epilepsy from those who do not - allele severity, modifier
    genotype, or something environmental. The entry therefore curates developmental delay as
    the constant feature and seizures as a frequent but non-obligatory one, and does not
    assign a frequency band to either, since the reported cohort is too small and too
    ascertainment-biased toward epilepsy to support one.
  proposed_experiments:
  - experiment_id: exp_genotype_stratified_seizure_penetrance
    name: Seizure penetrance stratified by allele activity
    description: >-
      Assay residual transcriptional activity for each reported NEUROD2 patient allele in a
      common reporter system, and test whether residual activity predicts the presence or
      absence of epilepsy across carriers. Ascertainment through non-epilepsy channels, such
      as developmental-delay cohorts, would be needed to avoid the bias that currently makes
      seizures look obligatory.

notes: >-
  Nomenclature: one cited source designates this disorder DEE75. That number belongs to a
  different disease - DEE75 is MONDO:0032752, OMIM 618437, caused by PARS2 - while NEUROD2
  is DEE72, MONDO:0032710, OMIM 618374. The discrepancy was resolved against MONDO rather
  than either publication, and the paper is cited for its findings without its DEE number
  being carried across.
  Scope: the TGF-beta/losartan arm is curated as a model finding with an explicit
  HUMAN_MODEL_MISMATCH, not as a treatment. No human has been treated with losartan for this
  disorder, and the entry deliberately does not create a treatment entry that would imply
  otherwise.

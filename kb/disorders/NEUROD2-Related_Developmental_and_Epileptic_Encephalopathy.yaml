genetic:
- name: NEUROD2
  gene_term:
    preferred_term: NEUROD2
    term:
      id: hgnc:7763
      label: NEUROD2
  relationship_type: CAUSATIVE
  association: >-
    Heterozygous de novo variants in NEUROD2 reduce the activity of the encoded
    transcription factor and cause DEE72. Reported pathogenic variants cluster in the bHLH
    domain, the DNA-binding module: p.Glu130Gln, p.Met134Thr and p.Arg129Trp all fall in the
    conserved DNA-binding basic region of the first helix, and p.Leu163Pro lies in the
    second helix, also DNA-binding and also highly conserved. p.Glu130Gln is recurrent
    across unrelated families. In cellular assay the variants are hypomorphic rather than
    null - markedly less effective than wild type in a neuron-induction assay, but not
    inert.
  evidence:
  - reference: PMID:30323019
    reference_title: "De novo pathogenic variants in neuronal differentiation factor 2 (NEUROD2) cause a form of early infantile epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified novel de novo variants in neuronal differentiation factor 2
      (NEUROD2) in two unrelated children with early infantile epileptic encephalopathy"
    explanation: >-
      The gene-disease assertion from the founding study.
  - reference: PMID:34188164
    reference_title: "Disruption of NEUROD2 causes a neurodevelopmental syndrome with autistic features via cell-autonomous defects in forebrain glutamatergic neurons."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "De novo mutations Glu130Gln, Met134Thr, and Arg129Trp from Families 1, 2, and
      4 are found in the conserved DNA-binding region of the bHLH domain, which is the basic
      region of the first helix"
    explanation: >-
      Locates three of the reported variants in the bHLH DNA-binding basic region, and
      names Glu130Gln as arising independently in more than one family.
  - reference: PMID:34188164
    reference_title: "Disruption of NEUROD2 causes a neurodevelopmental syndrome with autistic features via cell-autonomous defects in forebrain glutamatergic neurons."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The de novo Leu163Pro mutation from Family 3 lies in the second helix of the
      bHLH domain thought to be important for DNA binding and is also highly conserved"
    explanation: >-
      Places the fourth variant in the same functional module, which is what makes the bHLH
      clustering a spectrum-level observation rather than a coincidence of two variants.
  - reference: PMID:34188164
    reference_title: "Disruption of NEUROD2 causes a neurodevelopmental syndrome with autistic features via cell-autonomous defects in forebrain glutamatergic neurons."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mice heterozygous for Neurod2 had similar defects, indicating that Neurod2 is
      haploinsufficient"
    explanation: >-
      The dosage evidence. Curated MODEL_ORGANISM because it is a mouse genetic result, and
      see the note below on how it sits with the hypomorphic reading.
  notes: >-
    Haploinsufficiency and hypomorphism are not competing claims here, and the entry should
    not be read as leaving two readings live. They are measurements of different things.
    Haploinsufficiency is a statement about gene DOSAGE in mouse: one wild-type Neurod2 copy
    is not enough, since heterozygotes show the same defects as nulls in kind if milder in
    degree. Hypomorphism is a statement about the patient ALLELE: the mutant protein retains
    partial activity in a neuron-induction assay rather than none. A haploinsufficient gene
    carrying a partially active allele is exactly the expected architecture for a dominant
    disorder of this kind - the mutant contributes some activity, the total falls below the
    threshold the mouse data show exists, and the phenotype follows. What is NOT established
    by any source available to this entry is whether the patient alleles additionally act
    dominant-negatively against the wild-type copy, which would be a third and distinct
    claim.
    A nomenclature hazard worth recording. One of the sources cited here, the Xenopus laevis
    CRISPR model, repeatedly designates this disorder DEE75. That designation belongs to a
    different disease: DEE75 is MONDO:0032752, OMIM 618437, caused by PARS2. NEUROD2 is
    DEE72, MONDO:0032710, OMIM 618374, which carries EIEE72 as an exact synonym. The paper
    is cited here for its findings, which concern NEUROD2 and are not in doubt, but its DEE
    number is not propagated into this entry. A future curator should not "correct" DEE72 to
    DEE75 on the strength of that paper.

diagnosis:
- name: Electroencephalography
  description: >-
    EEG in the spasms presentation shows multifocal independent spikes, and improves
    markedly with effective treatment - making it useful for following response as well as
    for diagnosis.
  diagnosis_term:
    preferred_term: Electroencephalography
    term:
      id: NCIT:C38054
      label: Electroencephalography
  evidence:
  - reference: PMID:36494631
    reference_title: "Epileptic spasms related to neuronal differentiation factor 2 (NEUROD2) mutation respond to combined vigabatrin and high dose prednisolone therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Electroencephalogram before treatment showed multifocal independent spikes
      predominantly in both posterior head regions and demonstrated marked improvement
      following combined vigabatrin and high-dose prednisolone treatment"
    explanation: >-
      Records both the characteristic interictal pattern and its response to treatment.

- name: Whole Exome Sequencing
  description: >-

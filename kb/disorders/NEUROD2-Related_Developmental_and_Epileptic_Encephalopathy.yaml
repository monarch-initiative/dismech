animal_models:
- name: Neurod2 knockout and heterozygous mouse
  species: Mouse
  genotype: Neurod2 constitutive knockout (KO) and heterozygote (HET)
  publication: PMID:34188164
  description: >-
    The best-matched model for the lamination arm of this disorder, and the one that
    supplies the dosage evidence. Both null and heterozygous animals were characterized, in
    a mammalian six-layered neocortex that forms inside-out by radial migration - the
    architecture the Xenopus model cannot provide. The heterozygote matters specifically:
    patients are heterozygous, so the HET arm is the genotype-matched one.
  modeled_mechanisms:
  - target: Disrupted Cortical Neuron Migration and Lamination
    relationship: RECAPITULATES
    fidelity: HIGH
    limitations: >-
      Mouse and human neocortical development differ in scale, in the extent of the outer
      subventricular zone and in gyrification, so the magnitude of a migration defect does
      not transfer quantitatively. The mouse also carries a null or heterozygous-null
      allele rather than the patients' hypomorphic missense alleles, so it models the
      dosage consequence rather than the specific allele.
    description: >-
      Cortical projection neurons over-migrate, shifting the final position and size of
      cortical layers, in both null and heterozygous animals.
    readouts:
    - name: Radial position of cortical projection neurons
      target: Disrupted Cortical Neuron Migration and Lamination
      direction: ALTERED
      interpretation: >-
        Neurons over-migrate rather than under-migrate - they end up too superficial, and
        the layers are correspondingly displaced. The direction is worth stating because
        the intuitive prediction for a migration defect is the opposite one.
      evidence:
      - reference: PMID:34188164
        reference_title: "Disruption of NEUROD2 causes a neurodevelopmental syndrome with autistic features via cell-autonomous defects in forebrain glutamatergic neurons."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "In Neurod2 KO embryos, cortical projection neurons over-migrated, thereby
          altering the final size and position of layers"
        explanation: >-
          The migration measurement behind this readout.
    - name: Over-migration in heterozygotes
      target: Disrupted Cortical Neuron Migration and Lamination
      direction: ALTERED
      interpretation: >-
        The same defect in the genotype-matched heterozygote, which is what makes the
        model's relevance to a dominant human disorder more than an inference from the null.
      evidence:
      - reference: PMID:34188164
        reference_title: "Disruption of NEUROD2 causes a neurodevelopmental syndrome with autistic features via cell-autonomous defects in forebrain glutamatergic neurons."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Mice heterozygous for Neurod2 had similar defects, indicating that Neurod2
          is haploinsufficient"
        explanation: >-
          Establishes that one functional copy is insufficient, in the same assay.
    evidence:
    - reference: PMID:34188164
      reference_title: "Disruption of NEUROD2 causes a neurodevelopmental syndrome with autistic features via cell-autonomous defects in forebrain glutamatergic neurons."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Over-migration was maintained post-migration, at P7"
      explanation: >-
        The defect persists past the migratory period rather than being a transient delay,
        which is what makes it informative for the lamination node rather than only for
        migration timing.
  - target: Neuronal Hyperactivity
    relationship: RECAPITULATES
    fidelity: HIGH
    limitations: >-
      Recorded in layer 5 neurons of juvenile mice; the measurement is cell-intrinsic
      excitability and does not by itself establish network-level hypersynchrony.
    description: >-
      Increased intrinsic excitability in layer 5 cortical projection neurons.
    readouts:
    - name: Intrinsic excitability of layer 5 neurons
      target: Neuronal Hyperactivity
      direction: INCREASED
      interpretation: >-
        Patch-clamp recordings show increased intrinsic excitability, the cell-autonomous
        correlate of the hyperactivity node.
      evidence:
      - reference: PMID:34188164
        reference_title: "Disruption of NEUROD2 causes a neurodevelopmental syndrome with autistic features via cell-autonomous defects in forebrain glutamatergic neurons."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Patch-clamp recordings in layer 5 neurons of juvenile mice revealed
          increased intrinsic excitability"
        explanation: >-
          The electrophysiological measurement behind this readout.
    evidence:
    - reference: PMID:34188164
      reference_title: "Disruption of NEUROD2 causes a neurodevelopmental syndrome with autistic features via cell-autonomous defects in forebrain glutamatergic neurons."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In juvenile and adults, spine density and turnover were dysregulated in
        apical but not basal compartments in layer 5 neurons"
      explanation: >-
        The structural synaptic correlate in the same cells. The compartment specificity -
        apical but not basal - is preserved rather than generalized to "synaptic defects".
  - target: Seizures
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    limitations: >-
      Spontaneous seizures were seen only occasionally in the null, and the source gives no
      count, frequency or EEG characterization. This is a behavioural observation reported
      in passing among the ASD-like phenotypes, not a quantified epilepsy phenotype, and it
      is not reported for the genotype-matched heterozygote at all.
    description: >-
      Occasional spontaneous seizures alongside the ASD-like behavioural phenotype.
    readouts:
    - name: Spontaneous seizure occurrence
      target: Seizures
      direction: INCREASED
      interpretation: >-
        Present but occasional. The hedge is the source's own and is preserved rather than
        upgraded to a seizure phenotype.
      evidence:
      - reference: PMID:34188164
        reference_title: "Disruption of NEUROD2 causes a neurodevelopmental syndrome with autistic features via cell-autonomous defects in forebrain glutamatergic neurons."
        supports: PARTIAL
        evidence_source: MODEL_ORGANISM
        snippet: "Neurod2 KO mice displayed social interaction deficits, stereotypies,
          hyperactivity, and occasionally spontaneous seizures"
        explanation: >-
          Curated PARTIAL: the word "occasionally" is doing real work and no count is given.
          The same sentence is the primary evidence for the ASD-like behavioural phenotype,
          which is much better characterized in this model than the seizures are.
    evidence:
    - reference: PMID:34188164
      reference_title: "Disruption of NEUROD2 causes a neurodevelopmental syndrome with autistic features via cell-autonomous defects in forebrain glutamatergic neurons."
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: "social interaction deficits, stereotypies, hyperactivity, and occasionally
        spontaneous seizures"
      explanation: >-
        Curated PARTIAL for the seizure node specifically. The behavioural triad is well
        supported; the seizure observation is not quantified.

- name: Forebrain excitatory neuron-specific Neurod2 conditional knockout mouse
  species: Mouse
  genotype: Emx1-IRES-Cre; Neurod2 flox/flox (cKO)
  publication: PMID:34188164
  description: >-
    A conditional deletion restricted to forebrain excitatory neurons. Its purpose is
    causal attribution rather than phenotype reproduction: it tests whether the behavioural
    phenotype arises from within glutamatergic neurons or from elsewhere in the brain, which
    the constitutive knockout cannot distinguish.
  modeled_mechanisms:
  - target: Reduced Proneural Transcription Factor Activity
    relationship: PERTURBS
    fidelity: HIGH
    limitations: >-
      Emx1-Cre deletes across forebrain excitatory neurons broadly and from early
      development, so it localizes the requirement to that population without resolving
      which region, layer or developmental window within it is responsible.
    description: >-
      Cell-type-restricted deletion isolating the contribution of forebrain excitatory
      neurons.
    evidence:
    - reference: PMID:34188164
      reference_title: "Disruption of NEUROD2 causes a neurodevelopmental syndrome with autistic features via cell-autonomous defects in forebrain glutamatergic neurons."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We generated Neurod2flox/flox mice and crossed them with Emx1IRESCre mice to
        assess the specific contribution of forebrain excitatory neurons to the ASD-related
        phenotypes"
      explanation: >-
        States the design and its purpose - attributing the phenotype to a cell type rather
        than reproducing it.
  notes: >-
    This model is the basis for the cell-autonomy claim in the source's own title. It is
    curated as PERTURBS rather than RECAPITULATES because what it contributes is the
    localization of the requirement, not a demonstration that the human phenotype is
    reproduced - the constitutive knockout above does that.

- name: Xenopus laevis NeuroD2 CRISPR knockdown tadpole
  species: Xenopus laevis
  genotype: NeuroD2.S CRISPR/Cas9 edited
  publication: PMID:38788202
  description: >-
    A CRISPR knockdown tadpole that reproduces seizure behaviour and network hyperactivity,
    and that produced the entry's most unexpected finding - a leaky blood-brain barrier -
    together with a pharmacological rescue acting on it.
  modeled_mechanisms:
  - target: Neuronal Hyperactivity
    relationship: RECAPITULATES
    fidelity: MODERATE
    limitations: >-
      The Xenopus forebrain is lissencephalic, unlayered, and forms outside-in, whereas the
      human neocortex is six-layered and forms inside-out via radial migration. Since the
      proposed human mechanism runs through disrupted radial migration and lamination, the
      model cannot test the step it is being used to support, and higher cognitive
      phenotypes cannot be assessed at all.
    description: >-
      Calcium imaging shows prolonged signals sweeping through the brain.
    readouts:
    - name: Brain-wide calcium signal
      target: Neuronal Hyperactivity
      direction: INCREASED
      interpretation: >-
        Prolonged, strong signals sweeping through the brain.
      evidence:
      - reference: PMID:38788202
        reference_title: "Knockdown of NeuroD2 leads to seizure-like behavior, brain neuronal hyperactivity and a leaky blood-brain barrier in a Xenopus laevis tadpole model of DEE75."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Live imaging of Ca2+ signaling revealed prolongued, strong signals
          sweeping through the brain, indicative of neuronal hyperactivity"
        explanation: >-
          The imaging measurement behind this readout.
    evidence:
    - reference: PMID:38788202
      reference_title: "Knockdown of NeuroD2 leads to seizure-like behavior, brain neuronal hyperactivity and a leaky blood-brain barrier in a Xenopus laevis tadpole model of DEE75."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "NeuroD2.S CRISPR/Cas9 edited tadpoles were more active, swam faster on
        average, and had more seizures"
      explanation: >-
        Establishes the behavioural seizure phenotype that makes the model informative.
  - target: Blood-Brain Barrier Permeability
    relationship: RECAPITULATES
    fidelity: LOW
    limitations: >-
      The barrier phenotype has been demonstrated only in tadpoles. No human data establish
      that blood-brain barrier permeability is altered in NEUROD2 patients, so this arm rests
      entirely on the model - which is why it carries a HUMAN_MODEL_MISMATCH discussion
      rather than being presented as an established part of the human disease.
    description: >-
      Increased barrier permeability, rescued alongside seizures by losartan.
    readouts:
    - name: Blood-brain barrier permeability
      target: Blood-Brain Barrier Permeability
      direction: INCREASED
      interpretation: >-
        The barrier is leakier than in sibling controls.
      evidence:
      - reference: PMID:38788202
        reference_title: "Knockdown of NeuroD2 leads to seizure-like behavior, brain neuronal hyperactivity and a leaky blood-brain barrier in a Xenopus laevis tadpole model of DEE75."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "the blood-brain barrier (BBB) was found to be leakier than that of
          controls"
        explanation: >-
          The permeability measurement behind this readout.
    - name: Seizure events under losartan
      target: Blood-Brain Barrier Permeability
      direction: DECREASED
      interpretation: >-
        A TGF-beta antagonist that acts on the barrier reduced seizure events more than
        four-fold, which is the experiment linking the barrier arm to the seizures.
      evidence:
      - reference: PMID:38788202
        reference_title: "Knockdown of NeuroD2 leads to seizure-like behavior, brain neuronal hyperactivity and a leaky blood-brain barrier in a Xenopus laevis tadpole model of DEE75."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Treatment of NeuroD2 CRISPant tadpoles with 5 mM Losartan decreased
          seizure events by more than 4-fold compared to the baseline"
        explanation: >-
          The rescue measurement behind this readout.
    evidence:
    - reference: PMID:38788202
      reference_title: "Knockdown of NeuroD2 leads to seizure-like behavior, brain neuronal hyperactivity and a leaky blood-brain barrier in a Xenopus laevis tadpole model of DEE75."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Losartan was shown to have a short-term protective effect, reducing
        neuronal hyperactivity and reducing permeability of the BBB"
      explanation: >-
        Supports treating the barrier as a mechanistically involved arm rather than an
        incidental finding, since acting on it improves the neuronal phenotype. The word
        "short-term" is retained because durability was not established.

discussions:

- discussion_id: mismatch_bbb_arm_rests_entirely_on_tadpole
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Blood-Brain Barrier Permeability
  prompt: >-
    Is the blood-brain barrier defect part of the human disorder, or a feature of the
    tadpole model?
  rationale: >-
    This is the entry's most interesting claim and its least established. A leaky
    blood-brain barrier is a non-neuronal contributor to epileptogenesis in a disorder
    caused by a neuronal transcription factor, and the losartan experiment gives it causal
    weight in the model: a TGF-beta antagonist reduced both barrier permeability and seizure
    events more than four-fold. But every part of that sits in Xenopus. No human data
    establish altered barrier permeability in NEUROD2 patients. The stake is unusually
    concrete, because losartan is an approved drug in wide human use, so a positive human
    finding would point directly at a repurposing candidate - and a negative one would
    remove the rationale entirely. The rescue is also described by its own authors as
    short-term, so even within the model durability is unestablished.
  proposed_experiments:
  - experiment_id: exp_bbb_integrity_in_neurod2_patients
    name: Barrier integrity in NEUROD2 patients
    description: >-
      Assess blood-brain barrier integrity in genotype-confirmed NEUROD2 patients using
      contrast-enhanced imaging or CSF-to-serum protein ratios, and compare against
      age-matched epilepsy controls, to determine whether the tadpole finding has a human
      counterpart before any repurposing trial is contemplated.

- discussion_id: mismatch_lissencephalic_model_for_a_lamination_mechanism
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Disrupted Cortical Neuron Migration and Lamination
  prompt: >-
    Can a lissencephalic, unlayered, outside-in brain test a mechanism defined by
    inside-out radial migration into a six-layered cortex?
  rationale: >-
    The proposed human mechanism runs through disrupted radial migration and layer-specific
    differentiation of cortical projection neurons. The principal in vivo model is the
    Xenopus tadpole, whose forebrain is lissencephalic and unlayered and forms from the
    outside in, so the oldest neurons end up outermost - the opposite ordering to the human
    neocortex. The model therefore cannot test the lamination step it is being used to
    support; what it can show is that reduced NeuroD2 activity produces seizures and network
    hyperactivity, which it does. The mouse work on cortical over-migration and layer 5
    positioning is the better-matched evidence for the lamination arm, and this entry marks
    the edge from lamination to hyperactivity as indirect with unknown intermediates rather
    than treating the tadpole seizure phenotype as confirmation of the migration account.
  proposed_experiments:
  - experiment_id: exp_layer_resolved_migration_in_a_gyrencephalic_model
    name: Layer-resolved migration phenotype in a layered cortex
    description: >-
      Characterise laminar position and radial migration of cortical projection neurons in a
      Neurod2 hypomorphic mouse carrying a patient-equivalent allele, rather than a null, and
      determine whether mis-lamination is present at the allele dosage that causes human
      disease.

- discussion_id: gap_seizures_are_not_obligatory
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Seizures
  prompt: >-
    What determines whether a NEUROD2 variant carrier develops epilepsy at all?
  rationale: >-
    The disorder is named and defined as an epileptic encephalopathy, but at least one
    individual with a de novo NEUROD2 missense variant has developmental delay and no
    seizures. That is not a minor phenotypic footnote: it means the seizures are a frequent
    consequence rather than a defining one, and it raises the question of what separates
    carriers who develop epilepsy from those who do not - allele severity, modifier
    genotype, or something environmental. The entry therefore curates developmental delay as
    the constant feature and seizures as a frequent but non-obligatory one. The seizure
    phenotype does carry a frequency band, FREQUENT, taken from the counted 3 of 7 assessed
    patients - but that number should be read as a ceiling rather than as a population
    estimate. The reported cohort is small, and it was ascertained through epilepsy: the
    disorder was named and first described from epileptic encephalopathy cases, so carriers
    without seizures are exactly the ones least likely to have been found. Ascertainment
    through the phenotype being counted inflates its apparent frequency, so 3 of 7 is an
    upper bound; a denominator assembled through non-epilepsy channels would almost
    certainly put the figure lower.
  proposed_experiments:
  - experiment_id: exp_genotype_stratified_seizure_penetrance
    name: Seizure penetrance stratified by allele activity
    description: >-
      Assay residual transcriptional activity for each reported NEUROD2 patient allele in a
      common reporter system, and test whether residual activity predicts the presence or
      absence of epilepsy across carriers. Ascertainment through non-epilepsy channels, such
      as developmental-delay cohorts, would be needed to avoid the bias that currently makes
      seizures look obligatory.

notes: >-
  Nomenclature: one cited source designates this disorder DEE75. That number belongs to a
  different disease - DEE75 is MONDO:0032752, OMIM 618437, caused by PARS2 - while NEUROD2
  is DEE72, MONDO:0032710, OMIM 618374. The discrepancy was resolved against MONDO rather
  than either publication, and the paper is cited for its findings without its DEE number
  being carried across.
  Scope: the TGF-beta/losartan arm is curated as a model finding with an explicit
  HUMAN_MODEL_MISMATCH, not as a treatment. No human has been treated with losartan for this
  disorder, and the entry deliberately does not create a treatment entry that would imply
  otherwise.

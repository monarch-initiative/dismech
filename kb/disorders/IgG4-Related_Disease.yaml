- name: Obliterative Phlebitis
  diagnostic: true
  description: >-
    Inflammatory and fibrotic obliteration of venous lumina is a characteristic but organ-variable finding.
    Arteritis and aortitis are separate vascular lesions; leukocytoclastic small-vessel vasculitis is
    not interchangeable with obliterative phlebitis.
  evidence:

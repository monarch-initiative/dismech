  - preferred_term: Plasma cell differentiation
    term:
      id: GO:0002317
      label: plasma cell differentiation
  downstream:
  - target: IgG4-Positive Plasmablast Expansion
    description: Tfh-derived help promotes B-cell differentiation into plasmablasts in patient-derived cultures.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:27411315
      reference_title: Enhanced IgG4 production by follicular helper 2 T cells and the involvement of follicular helper 1 T cells in the pathogenesis of IgG4-related disease.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        In vitro, Tfh2 cells more efficiently induced the differentiation of naïve B cells into plasmablasts
        compared to Tfh1 or Tfh17 cells.
      explanation: >-
        The patient-derived coculture directly tests B-cell help, while its subset definition and culture
        conditions limit in-vivo extrapolation.
    - reference: PMID:28916523
      reference_title: 'Cutting Edge: A Critical Role of Lesional T Follicular Helper Cells in the Pathogenesis of IgG4-Related Disease.'
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Tfh cells from IgG4-DS submandibular glands had higher expression of B cell lymphoma 6 and a greater
        capacity to help B cells produce IgG4 than did tonsillar Tfh cells.
      explanation: >-
        Lesional Tfh cells support IgG4 production in the glandular disease context; tonsillar comparators
        are not matched unaffected salivary tissue.
    hypothesis_groups:
    - plasmablast_autoantigen_fibrosis_driver_model
  - target: Enhanced IgG4 Antibody Production
    description: Lesional Tfh helper activity increases IgG4 production in B-cell coculture.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:28916523
      reference_title: 'Cutting Edge: A Critical Role of Lesional T Follicular Helper Cells in the Pathogenesis of IgG4-Related Disease.'
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: a greater capacity to help B cells produce IgG4 than did tonsillar Tfh cells.
      explanation: Functional coculture supports this helper route.
  evidence:
  - reference: PMID:29253269
    reference_title: Correlation of T follicular helper cells and plasmablasts with the development of organ involvement in patients with IgG4-related disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The association found between Tfh cells and plasmablasts, linked with biological plausibility, suggests
      that Tfh cells contribute to the pathogenesis of IgG4-RD.
    explanation: >-
      Human immunophenotyping supports the modeled Tfh-plasmablast axis upstream of IgG4 class switching

  - target: B-Lineage Profibrotic Signaling
    description: >-
      Expanded plasmablasts include cells with intrinsic profibrotic programs and collagen-promoting activity.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:31319101
      reference_title: B lymphocytes directly contribute to tissue fibrosis in patients with IgG(4)-related disease.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        fibroblasts cultured with circulating plasmablasts produced significantly more collagen compared
        to control fibroblasts.
      explanation: >-
        Sorted patient plasmablasts stimulate collagen in coculture; the experiment does not isolate antibody
        isotype as the cause.
    hypothesis_groups:
    - plasmablast_autoantigen_fibrosis_driver_model
  evidence:
  - reference: PMID:24817416
    reference_title: Plasmablasts as a biomarker for IgG4-related disease, independent of serum IgG4 concentrations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Circulating plasmablasts are elevated in active IgG4-RD, even in patients with normal serum IgG4
      concentrations.
    explanation: >-
      Human flow-cytometry data support plasmablast expansion as a distinct active-disease B-lineage node.
  - reference: PMID:24815737
    reference_title: De novo oligoclonal expansions of circulating plasmablasts in active and relapsing IgG4-related disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These expanded plasmablasts are oligoclonal and exhibit extensive somatic hypermutation, and their
      numbers decrease after rituximab-mediated B-cell depletion therapy; this loss correlates with disease
      remission.
    explanation: >-
      Repertoire sequencing and treatment-response data support a clonally expanded, disease-linked plasmablast
      compartment.
- name: IgG4-Positive Plasma Cell Infiltration
  description: >-
    IgG4-bearing plasma cells accumulate in affected tissues as a characteristic histological component.
    Plasmablasts and mature plasma cells differ in phenotype and treatment susceptibility. The exact contribution
    of each compartment to antibodies, matrix remodeling and tissue injury varies; IgG4 staining alone
    does not establish disease or antibody pathogenicity.
  cell_types:
  - preferred_term: Plasma cell
    term:
      id: CL:0000786
      label: plasma cell
  biological_processes:
  - preferred_term: Immune response
    term:
      id: GO:0006955
      label: immune response
  - preferred_term: Inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
  evidence:
  - reference: PMID:25988916
    reference_title: 'IgG4-Related Disease: Clinical and Laboratory Features in One Hundred Twenty-Five Patients.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      IgG4-related disease (IgG4-RD) has emerged over the last decade as a unique immune-mediated condition
      that links multiple fibro-inflammatory disorders previously regarded as separate entities
    explanation: Establishes IgG4-RD as a unified immune-mediated fibroinflammatory condition.
  - reference: PMID:25988916
    reference_title: 'IgG4-Related Disease: Clinical and Laboratory Features in One Hundred Twenty-Five Patients.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The gold-standard for the diagnosis of IgG4-RD, regardless of the organ(s) involved, is the identification
      of typical histopathology features (e.g., lymphoplasmacytic infiltrate, storiform fibrosis, obliterative
      phlebitis) in the context of a significant IgG4+ plasma cell infiltrate
    explanation: >-
      Confirms lymphoplasmacytic infiltrate with IgG4+ plasma cells as the histopathological hallmark.

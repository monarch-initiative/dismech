- name: Renal Parenchymal Fibroinflammatory Injury
  description: >-
    Tubulointerstitial inflammation with IgG4-rich plasma cells and fibrosis can impair intrinsic renal
    function. Membranous nephropathy occurs in a subset and may coexist. Hypocomplementemia is associated,
    but the reviewed evidence does not establish a single complement-mediated causal route for all renal
    injury.
  evidence:
  - reference: PMID:30596168
    reference_title: Clinical Manifestations and Long-term Outcomes of IgG4-Related Kidney and Retroperitoneal Involvement in a United Kingdom IgG4-Related Disease Cohort.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      tubulointerstitial nephritis with abundant IgG4+ plasma cells was the most common finding (n = 14;
      93.3%), and 4 (26.7%) patients had membranous nephropathy.
    explanation: >-
      Renal biopsy findings concern the selected 15-biopsy renal cohort, not the prevalence in all IgG4-RD.

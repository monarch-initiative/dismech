mechanistic_hypotheses:
- hypothesis_group_id: plasmablast_autoantigen_fibrosis_driver_model
  hypothesis_label: Plasmablast-Autoantigen Fibrosis Driver Model
  status: CANONICAL
  description: >-
    An adaptive immune framework in which antigen-experienced B cells, plasmablasts and T-cell populations
    participate in chronic fibroinflammation. Tfh cells enhance IgG4 production and plasmablast differentiation
    in coculture; B-lineage cells can directly stimulate fibroblast collagen production, and cytotoxic
    T cells show tissue injury and profibrotic mediator programs. Universal autoantigen identity, the
    precise B-cell-to-CTL interaction and the CTL-specific route to storiform architecture remain unresolved.
  evidence:
  - reference: PMID:24815737
    reference_title: De novo oligoclonal expansions of circulating plasmablasts in active and relapsing IgG4-related disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Clonally expanded CD19(+)CD27(+)CD20(-)CD38(hi) plasmablasts are a hallmark of active IgG4-RD.
    explanation: >-
      Human B-cell repertoire data support plasmablast expansion as a central disease-activity feature
      in the canonical adaptive immune model.
  - reference: PMID:28166682
    reference_title: Clonally expanded cytotoxic CD4(+) T cells and the pathogenesis of IgG4-related disease.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      CD4+ CTLs in affected tissues secrete pro-fibrotic cytokines including IL-1β, TGF-β1, and IFN-γ
      as well as cytolytic molecules such as perforin and granzymes A and B.
    explanation: >-
      Review-level synthesis supports CD4+ cytotoxic T cells as the immune-cell arm most directly linked
      to fibrogenic mediator production.
- hypothesis_group_id: innate_first_bystander_model
  hypothesis_label: Innate-First Bystander Activation Model
  status: ALTERNATIVE
  description: >-
    Innate receptor activation can promote B-cell responses and fibroinflammation in cell systems and
    mouse models. An innate-initiation/adaptive-amplification sequence is a plausible alternative in human
    IgG4-RD, but its temporal transition is unobserved. Established adaptive responses show clonal selection;
    that disfavors a purely nonspecific bystander explanation without excluding a concurrent or earlier
    nonspecific component.
  evidence:
  - reference: PMID:31339007
    reference_title: Activated M2 Macrophages Contribute to the Pathogenesis of IgG4-Related Disease via Toll-like Receptor 7/Interleukin-33 Signaling.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      TLR-7-expressing M2 macrophages may promote the activation of Th2 immune responses via IL-33 secretion
      in IgG4-RD.
    explanation: >-
      This concluding sentence synthesizes human tissue, cultured macrophage and transgenic-mouse results.
      It supports an innate amplifier, not temporal priority in human disease.
  - reference: PMID:39264798
    reference_title: A positive cytokine/chemokine feedback loop establishes plasmacytoid DC-driven autoimmune pancreatitis in IgG4-related disease.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      murine AIP was initiated by TLR3-bearing conventional DCs in the uninflamed pancreas whose activation
      by the TLR3 ligand poly(I:C) caused IFN-α, CXCL9, and CXCL10 secretion
    explanation: >-
      In the MRL/MpJ poly(I:C) autoimmune pancreatitis model, innate TLR3+ conventional dendritic cells
      act first in uninflamed tissue and only then recruit T cells and plasmacytoid DCs, providing the
      strongest temporal evidence for the innate-first component of the hypothesis.
  - reference: PMID:41332187
    reference_title: TLR7 responses to nucleosides drive sialadenitis in Slc29a3-deficient mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: lysosomal accumulation of endogenous nucleosides is sufficient to drive autoimmune sialadenitis
    explanation: >-
      Slc29a3-deficient mice develop TLR7-associated autoimmune sialadenitis, a phenotype shared with
      other diseases. The experiment does not establish isolated innate-cell sufficiency without lymphocytes
      or reproduce systemic human IgG4-RD.
  - reference: PMID:21971969
    reference_title: Involvement of activation of toll-like receptors and nucleotide-binding oligomerization domain-like receptors in enhanced IgG4 responses in autoimmune pancreatitis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Activation of NOD-2 in monocytes from healthy control subjects induced IgG4 production by B cells
      in a BAFF-dependent and T cell-independent manner
    explanation: >-
      NOD2 activation induces BAFF-dependent, T-cell-independent IgG4 production in cultured healthy-control
      cells; this does not by itself establish in-vivo class-switch kinetics or human disease initiation.
  - reference: PMID:39541094
    reference_title: Inebilizumab for Treatment of IgG4-Related Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Inebilizumab reduced the risk of flares of IgG4-related disease and increased the likelihood of
      flare-free complete remission at 1 year, confirming the role of CD19-targeted B-cell depletion as
      a potential treatment for IgG4-related disease
    explanation: >-
      The randomized trial establishes substantial flare reduction through CD19-targeted intervention.
      It limits an exclusively irrelevant-B-cell account but does not identify the relevant B-lineage
      function or prove universal biological necessity.
  notes: >-
    The report is useful for innate component pathways but the distinctive composite hypothesis remains
    weakly supported/unresolved. Mouse initiation does not establish human initiation. Anti-CD19 efficacy
    shows therapeutic relevance of B-lineage functions, not universal necessity of antigen-specific adaptive
    immunity. NOD2/BAFF and basophil experiments concern cultured cells; the pDC pathway has separate
    primary evidence, although the report mislabels a review as an independent study. The two-phase transition
    remains an open alternative and is not encoded as a proven causal edge.
pathophysiology:
- name: Candidate Autoantigen Recognition and Antigen Presentation
  description: >-
    Oligoclonal self-reactive B-lineage responses and candidate autoantibodies support loss of tolerance
    in subsets. A universal initiating autoantigen is unknown. PHB1, annexin A11, laminin 511-E8 and galectin-3
    binding results vary across cohorts; a negative four-antigen panel does not exclude other autoreactivity.
    B-lineage antigen presentation to cytotoxic T cells remains inferred rather than experimentally isolated.
  role: trigger
  cell_types:
  - preferred_term: B cell
    term:
      id: CL:0000236
      label: B cell
  biological_processes:
  - preferred_term: Antigen processing and presentation
    term:
      id: GO:0019882
      label: antigen processing and presentation
  - preferred_term: B cell activation
    term:
      id: GO:0042113
      label: B cell activation
  downstream:
  - target: CD4-Positive Cytotoxic T-Lymphocyte Fibrogenic Cytokine Production
    description: >-
      Candidate antigen presentation may sustain the CTL response; the relevant antigen, presenting cell
      and functional interaction are unresolved.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:27667138
      reference_title: '"How I manage" IgG4-Related Disease.'
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        This cell is presumed to be sustained by continuous antigen presentation by cells of the B cell
        lineage, particularly plasmablasts.
      explanation: >-
        The review explicitly labels B-lineage antigen presentation to the pathogenic CTL population presumed.
    hypothesis_groups:
    - plasmablast_autoantigen_fibrosis_driver_model
  - target: Autoantibody-Mediated IL-1RA Neutralization
    description: A subset of autoreactive clones recognizes and functionally interferes with IL-1RA.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:33974929
      reference_title: Neutralizing anti-IL-1 receptor antagonist autoantibodies induce inflammatory and fibrotic mediators in IgG4-related disease.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Plasma from patients with IgG4-RD exhibited elevated levels of reactivity against IL-1RA compared
        with plasma from the controls and neutralized IL-1RA activity, resulting in inflammatory and fibrotic
        mediator production in vitro.
      explanation: >-
        Patient-derived antibody and plasma experiments demonstrate functional IL-1RA interference in
        a subset. They do not isolate an IgG4-only mechanism or prove tissue fibrosis in vivo.
  - target: Cholangiocyte Protective Barrier Impairment
    description: >-
      Anti-annexin-containing serum can impair cholangiocyte protective machinery, while anti-laminin
      pathogenic effects remain incompletely isolated.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:34718050
      reference_title: Role of the IgG4-related cholangitis autoantigen annexin A11 in cholangiocyte protection.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Incubation with IRC patient serum inhibited annexin A11 membrane shift and reduced ANO1 surface
        expression.
      explanation: >-
        Human cholangiocyte cultures exposed to antibody-containing patient serum show disturbed protective
        secretory machinery; mixed serum is not an isolated isotype perturbation.
    - reference: PMID:38524667
      reference_title: Laminin 511-E8, an autoantigen in IgG4-related cholangitis, contributes to cholangiocyte protection.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Knockdown of laminin 511 constituents increased toxic bile acid permeation and GCDC-induced apoptosis.
      explanation: >-
        Gene knockdown establishes laminin-dependent protection but does not by itself demonstrate that
        patient anti-laminin antibodies reproduce knockdown.
  evidence:
  - reference: PMID:24815737
    reference_title: De novo oligoclonal expansions of circulating plasmablasts in active and relapsing IgG4-related disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cloning and expression of immunoglobulin heavy and light chain genes from expanded plasmablasts
      at the peak of disease reveals that disease-associated IgG4 antibodies are self-reactive.
    explanation: >-
      Plasmablast-derived antibody cloning supports autoreactivity in the active disease B-lineage response.
  - reference: PMID:31612628
    reference_title: Disease Severity Linked to Increase in Autoantibody Diversity in IgG4-Related Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of these 86 patients, 32 (37%) had IgG4 antibodies to ≥1 of the 4 autoantigens and 12 (14%) showed
      reactivity with ≥2 of the tested antigens.
    explanation: >-
      Candidate autoantigens are documented, but the study also shows that none is a universal IgG4-RD
      antigen.
- name: Tfh-Mediated IgG4 Class Switching and Plasma Cell Differentiation
  description: >-
    Follicular and extrafollicular helper T-cell populations provide B-cell help that promotes plasmablast
    differentiation and IgG4 production. Patient-derived circulating Tfh subsets and lesional salivary-gland
    Tfh cells have increased B-cell-helper activity in coculture. IL-4-positive BATF-positive and IL-10-positive
    LAG3-positive tissue populations are associated with polarized IgG4 responses; these phenotypes should
    not be treated as interchangeable with classical GATA3-positive Th2 cells.
  cell_types:
  - preferred_term: T follicular helper cell
    term:
      id: CL:0002038
      label: T follicular helper cell
  - preferred_term: B cell
    term:
      id: CL:0000236
      label: B cell
  biological_processes:
  - preferred_term: Isotype switching

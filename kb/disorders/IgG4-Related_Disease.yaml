- name: Innate Receptor-Dependent BAFF Production
  description: >-
    NOD2- or TLR-stimulated monocytes and TLR-stimulated basophils can support enhanced IgG4 production
    through BAFF-associated mechanisms in culture. Healthy-control cells also respond. These routes can
    coexist with Tfh help; neither their redundancy in vivo nor a universal innate initiating event is
    established.
  evidence:
  - reference: PMID:21971969
    reference_title: Involvement of activation of toll-like receptors and nucleotide-binding oligomerization domain-like receptors in enhanced IgG4 responses in autoimmune pancreatitis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Activation of NOD-2 in monocytes from healthy control subjects induced IgG4 production by B cells
      in a BAFF-dependent and T cell-independent manner.
    explanation: >-
      The culture experiment separates BAFF-dependent IgG4 production from T-cell help; it does not establish
      de-novo class-switch recombination in vivo.
  - reference: PMID:22744834
    reference_title: Toll-like receptor activation in basophils contributes to the development of IgG4-related disease.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Activation of TLRs in basophils from healthy controls induced IgG4 production by B cells, which
      effect was associated with enhanced production of B cell activating factor (BAFF) and IL-13.
    explanation: >-
      A distinct basophil culture route is supported; association with both mediators is not proof of
      BAFF-alone necessity.

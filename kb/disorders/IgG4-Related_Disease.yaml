      from healthy individuals are capable of driving myofibroblast differentiation and collagen production
      through the secretion of soluble factors rather than physical interactions.
    explanation: >-
      Transwell cocultures establish a soluble B-cell-to-fibroblast mechanism, stronger with patient B
      cells, without proving its quantitative contribution in vivo.

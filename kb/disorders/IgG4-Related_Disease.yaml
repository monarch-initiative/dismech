- name: Salivary and Lacrimal Gland Fibroinflammation
  description: >-
    Immune-cell infiltration and tissue remodeling enlarge salivary and lacrimal glands. Persistent injury
    can compromise gland function; IgG4-rich inflammation alone does not distinguish this condition from
    all mimics.
  evidence:

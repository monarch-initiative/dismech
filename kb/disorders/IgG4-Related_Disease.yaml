histopathology:
- name: Dense Lymphoplasmacytic Infiltrate with IgG4-Positive Plasma Cells
  finding_term:
    preferred_term: Dense IgG4-positive lymphoplasmacytic infiltrate
    term:
      id: NCIT:C35984
      label: Lymphoplasmacytic Infiltrate
  diagnostic: true
  description: >-
    Tissue biopsy shows a dense lymphoplasmacytic infiltrate with increased IgG4-positive plasma cells
    or an increased IgG4+/IgG+ plasma-cell ratio. The feature is not universal or sufficient by itself;
    prominence varies by organ and disease stage.
  evidence:
  - reference: PMID:22596100
    reference_title: Consensus statement on the pathology of IgG4-related disease.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The critical histopathological features are a dense lymphoplasmacytic infiltrate, a storiform pattern
      of fibrosis, and obliterative phlebitis.
    explanation: >-
      International pathology consensus identifies the triad and emphasizes clinicopathological correlation.
- name: Storiform Fibrosis
  finding_term:
    preferred_term: Storiform fibrosis
    term:
      id: NCIT:C3044
      label: Fibrosis
  diagnostic: true
  description: >-
    Fibrosis in a storiform, whorled, or cartwheel pattern is one of the characteristic microscopic features
    of IgG4-RD. The feature is not universal or sufficient by itself; prominence varies by organ and disease
    stage.
  evidence:
  - reference: PMID:22596100
    reference_title: Consensus statement on the pathology of IgG4-related disease.
    supports: SUPPORT

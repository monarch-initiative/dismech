discussions:
- discussion_id: gap_igg4rd_dominant_autoantigen_identity
  prompt: >-
    What dominant autoantigen, antigen family, or antigen-presenting context initiates the coupled plasmablast
    and CD4-positive T-cell response in IgG4-RD?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Candidate Autoantigen Recognition and Antigen Presentation
  - pathophysiology#IgG4-Positive Plasmablast Expansion
  - pathophysiology#CD4-Positive Cytotoxic T-Lymphocyte Fibrogenic Cytokine Production
  rationale: >-
    Candidate antigens explain subsets, and the precise B-lineage-to-CTL antigen-presentation step remains
    inferred. Direct B-cell-to-fibroblast signaling provides an additional route. A universal antigen
    is neither established nor required for every clinical pattern.
  proposed_experiments:
  - experiment_id: exp_igg4rd_paired_bcr_tcr_antigen_discovery
    name: Paired BCR/TCR and autoantigen discovery across active IgG4-RD lesions
    description: >-
      From paired blood and affected-organ biopsies, sequence plasmablast BCRs and expanded CD4+ CTL TCRs,
      express dominant antibodies and TCRs, and test candidate antigens by proteome arrays, immunoprecipitation-mass
      spectrometry, and antigen-presentation assays.
    experiment_type:
      preferred_term: paired repertoire and antigen-discovery experiment
    model_systems:
    - name: Active human IgG4-RD blood and affected-organ biopsy pairs
      description: >-
        Prospective patient samples spanning pancreatobiliary, salivary/lacrimal, renal, retroperitoneal,
        and vascular IgG4-RD manifestations.
      experimental_model_type: OTHER
      organism:
        preferred_term: human
        term:
          id: NCBITaxon:9606
          label: Homo sapiens
      cell_types:
      - preferred_term: plasmablast
        term:
          id: CL:0000980
          label: plasmablast
      - preferred_term: CD4-positive cytotoxic T lymphocyte
        term:
          id: CL:0000624
          label: CD4-positive, alpha-beta T cell
    readouts:
    - name: Shared and organ-restricted antigen specificity
      target: pathophysiology#Candidate Autoantigen Recognition and Antigen Presentation
      description: >-
        Concordance between dominant plasmablast antibody specificity, expanded lesional TCR recognition,
        and organ expression of candidate antigens.
      assays:
      - preferred_term: B cell receptor sequencing
      - preferred_term: T cell receptor sequencing
      - preferred_term: immunoprecipitation mass spectrometry
      direction: POSITIVE
    decision_criterion: >-
      A dominant autoantigen model is supported if recurrent antigen specificities are shared across independent
      patients and mechanistically connect plasmablast BCRs to lesional CD4+ T-cell activation; a per-organ
      model is supported if specificity tracks organ tropism instead.
    would_support:
    - pathophysiology#Candidate Autoantigen Recognition and Antigen Presentation
    - pathophysiology#IgG4-Positive Plasmablast Expansion
    - pathophysiology#CD4-Positive Cytotoxic T-Lymphocyte Fibrogenic Cytokine Production
  evidence:
  - reference: PMID:31612628
    reference_title: Disease Severity Linked to Increase in Autoantibody Diversity in IgG4-Related Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      While these findings suggest an underlying importance for B cell tolerance and the potential pathogenicity
      of autoantibodies in IgG4-RD, they also highlight the unmet need in identifying a dominant and specific
      antigen that may drive the pathogenesis of IgG4-RD.
    explanation: >-
      The validation cohort explicitly frames dominant antigen identity as an unmet need despite several
      candidate autoantigens.
  - reference: PMID:24815737
    reference_title: De novo oligoclonal expansions of circulating plasmablasts in active and relapsing IgG4-related disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      disease pathogenesis is linked to de novo recruitment of naive B cells into T cell-dependent responses
      by CD4(+) T cells, likely driving a self-reactive disease process.
    explanation: >-
      The B-cell repertoire study motivates a specific antigen-discovery gap connecting plasmablasts to
      CD4+ T-cell-dependent responses.
- discussion_id: gap_igg4rd_organ_tropism_and_fibroinflammation
  prompt: >-
    Why do shared plasmablast, IgG4 class-switching, and CD4-positive cytotoxic-T-cell programs produce
    different organ manifestations such as pancreatitis, cholangitis, retroperitoneal fibrosis, kidney
    disease, and salivary/lacrimal gland enlargement?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Storiform Fibrosis
  - pathophysiology#Organ-Specific Fibroinflammatory Injury
  rationale: >-
    IgG4-RD has a conserved fibroinflammatory histology, but the current model cannot yet explain why
    particular organs are targeted in individual patients. Organ-restricted antigens, epithelial-barrier
    functions, chemokine niches, and local stromal repair programs remain plausible but incompletely connected
    mechanisms.
  proposed_experiments:
  - experiment_id: exp_igg4rd_multi_organ_single_cell_stromal_immune_map
    name: Multi-organ single-cell immune-stromal map of IgG4-RD lesions
    description: >-
      Compare affected pancreas, bile duct, kidney, retroperitoneum, and salivary/lacrimal tissues using
      single-cell RNA sequencing, spatial transcriptomics, BCR/TCR sequencing, and autoantigen staining
      to separate shared fibroinflammatory circuitry from organ-specific injury programs.
    experiment_type:
      preferred_term: multi-organ single-cell spatial profiling study
    model_systems:
    - name: Human IgG4-RD affected-organ biopsy cohort
      description: >-
        Cross-organ biopsy cohort with matched blood, histopathology, serum autoantibody, and treatment-response
        metadata.
      experimental_model_type: OTHER
      organism:
        preferred_term: human
        term:
          id: NCBITaxon:9606
          label: Homo sapiens
    readouts:
    - name: Organ-specific antigen and stromal activation signatures
      target: pathophysiology#Organ-Specific Fibroinflammatory Injury
      description: >-
        Spatial colocalization of candidate autoantigens, plasmablasts/plasma cells, CD4+ CTLs, macrophages,
        fibroblasts, myofibroblasts, and extracellular matrix gene programs.
      assays:
      - preferred_term: single-cell RNA sequencing
      - preferred_term: spatial transcriptomics
      direction: POSITIVE
    decision_criterion: >-
      Organ tropism is supported as antigen/barrier-driven if candidate autoantigen expression and barrier
      injury localize with immune clonotypes and stromal activation in the affected organ more strongly
      than in unaffected or disease-control tissue.
    would_support:
    - pathophysiology#Organ-Specific Fibroinflammatory Injury
    - pathophysiology#Storiform Fibrosis
  evidence:
  - reference: PMID:38524667
    reference_title: Laminin 511-E8, an autoantigen in IgG4-related cholangitis, contributes to cholangiocyte protection.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      This makes it tempting to speculate that a decreased epithelial barrier function with attraction
      of immune cells and impaired bicarbonate secretion as a result of dysfunction of laminin 511 by
      autoantibody binding could potentially be a common systemic pathogenic mechanism in a subset of
      patients with IgG4-RD.
    explanation: >-
      Cholangitis data support a plausible epithelial-barrier mechanism, while the authors frame it as
      subset-level and still partly speculative.
  - reference: PMID:34718050
    reference_title: Role of the IgG4-related cholangitis autoantigen annexin A11 in cholangiocyte protection.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Binding of patient-derived annexin A11 autoantibodies inhibits annexin A11 function, possibly contributing
      to bile duct damage by weakening the biliary bicarbonate umbrella in patients with IRC.
    explanation: >-
      Annexin A11 evidence supplies an organ-specific bile-duct injury model but does not explain non-biliary
      organ tropism.
- discussion_id: gap_igg4rd_vascular_and_stromal_specificity
  prompt: >-
    Which cell and matrix interactions produce obliterative phlebitis, organ tropism and storiform architecture?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Storiform Fibrosis
  - pathophysiology#IL-33-Associated Macrophage Matrix Remodeling
  - pathophysiology#Organ-Specific Fibroinflammatory Injury
  rationale: >-
    B-cell cocultures establish collagen-promoting activity, but do not reproduce whorled architecture.
    MMP12 expression in macrophages does not establish a collagen-deposition edge. CTL-associated apoptosis
    does not by itself explain venous obliteration. The isolated-aortitis comparator is not confirmed
    IgG4-RD, and human organ distribution cannot be inferred from induced mouse pancreatic initiation.
    These remain gaps, with clinical and histological findings retained without invented arrows.
datasets:
- accession: geo:GSE220582
  title: Transcriptomic analysis of double-negative B cell subsets in IgG4-related disease
  description: >-
    IgD-CD27- “double negative” (DN) B cells are known to be expanded in the blood in many disease contexts
    and the IgD-CD27-CXCR5-CD11c+ DN2 B cell subset has been most widely studied in autoimmune diseases.
    In addition to DN2 B cells, a distinct IgD-CD27-CXCR5-CD11c- DN3 B cell subset accumulates in the
    blood both in IgG4-related disease, an autoimmune disease in which inflammation and fibrosis can be
    reversed by B cell depletion, and in severe COVID-19. DN3 B cells, but not DN2 B cells, prominently
    accumulate in the blood and end-organs of IgG4-related disease.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  data_type: BULK_RNA_SEQ
  sample_count: 15
  publication: PMID:37300833
  notes: >-
    Identified by GEO DataSets index search for IgG4-Related Disease (scripts/discover_datasets.py); accession
    and metadata verified against NCBI E-utilities on 2026-08-01. Title, sample count, and organism are
    GEO's own values.
- accession: geo:GSE202617
  title: Gene expression of CD4+CD8+ Tfh cells in lesions of IgG4-related disease and CD4+CD8+ Tfh in tonsil.
  description: >-
    To further know features of CD4+CD8+ Double positive (DP)-Tfh cells in respective lymphoid tissues,
    we subsequently investigated transcriptomes of DP-Tfh cells in submandibular gland lesions of IgG4-RD
    in comparison to those of DP-Tfh cells in tonsils. Results showed that DP-Tfh cells of IgG4-RD lesions
    were more apt to present CTL-related genes such as Eomes and granzymes than DP-Tfh cells in tonsils.
    It was also noted that the level of CD70 in DP-Tfh cells of IgG4-RD lesions was higher than that of
    tonsillar DP-Tfh cells. Genes related to Tfh cell function were seemed to be presented in DP-Tfh cells
    of tonsils compared to DP-Tfh cells of IgG4-RD lesions.

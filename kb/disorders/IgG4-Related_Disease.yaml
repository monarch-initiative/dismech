  - target: Cytotoxic T-Cell-Associated Mesenchymal Injury
    description: >-
      Lesional cytotoxic T-cell populations are associated with apoptosis of mesenchymal target cells;
      CTL-specific causation remains inferred.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:32485263
      reference_title: CD4(+) and CD8(+) cytotoxic T lymphocytes may induce mesenchymal cell apoptosis in IgG(4)-related disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        CD4+CTLs and CD8+CTLs may induce apoptotic cell death in tissues of patients with IgG4-RD with
        preferential targeting of nonendothelial, nonimmune cells of mesenchymal origin.
      explanation: >-
        The human tissue study links cytotoxic effectors and apoptosis without a target-cell killing perturbation.
    hypothesis_groups:
    - plasmablast_autoantigen_fibrosis_driver_model
  evidence:
  - reference: PMID:26971690
    reference_title: Clonal expansion of CD4(+) cytotoxic T lymphocytes in patients with IgG4-related disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      IgG4-RD is prominently linked to clonally expanded IL-1β- and TGF-β1-secreting CD4(+) CTLs in both
      peripheral blood and inflammatory tissue lesions.
    explanation: >-
      Human cohort data support clonally expanded IL-1beta- and TGF-beta1-secreting CD4+ CTLs as a distinct
      pathogenic effector node.
  - reference: PMID:27358392

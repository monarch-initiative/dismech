diagnosis:
- name: Integrated clinical, imaging, serologic and tissue assessment
  description: >-
    Assess compatible organ manifestations and image the extent of disease. Biopsy interpretation integrates
    morphology with organ-appropriate IgG4 cell counts and ratios, while excluding malignancy and other
    inflammatory mimics. Serum IgG4 or immunostaining alone is insufficient.
  evidence:
  - reference: PMID:22596100
    reference_title: Consensus statement on the pathology of IgG4-related disease.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Tissue IgG4 counts and IgG4:IgG ratios are secondary in importance.
    explanation: The pathology consensus prioritizes morphology and clinical context.
  - reference: PMID:32552502
    reference_title: European Guideline on IgG4-related digestive disease - UEG and SGF evidence-based recommendations.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      IgG4-related digestive disease can be diagnosed only with a comprehensive work-up that includes
      histology, organ morphology at imaging, serology, search for other organ involvement, and response
      to glucocorticoid treatment.
    explanation: The guideline supports integrated evaluation.
- name: ACR/EULAR research classification and revised comprehensive diagnostic criteria
  description: >-
    The 2019 ACR/EULAR framework applies entry, exclusion and weighted inclusion domains for classification;
    classification thresholds do not replace clinical diagnosis. The 2020 revised comprehensive diagnostic
    framework integrates clinical/radiologic, serologic and pathologic domains.
  evidence:
  - reference: PMID:31793250
    reference_title: The 2019 American College of Rheumatology/European League Against Rheumatism Classification Criteria for IgG4-Related Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In the first validation cohort, a threshold of 20 points had a specificity of 99.2%
    explanation: >-
      The classifier was validated for research and should not be equated with a standalone diagnostic
      test.
  - reference: PMID:33274670
    reference_title: The 2020 revised comprehensive diagnostic (RCD) criteria for IgG4-RD.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      which consists of 3 domains; 1) Clinical and radiological features, 2) Serological diagnosis and
      3) Pathological diagnosis.
    explanation: The revised diagnostic framework integrates independent dimensions.
differential_diagnoses:
- name: Malignancy involving affected organs
  description: Pancreatic, biliary, glandular and lymphoid malignancies can mimic mass-forming inflammation.
  distinguishing_features:
  - Use imaging and appropriate tissue assessment to establish morphology and clonality; avoid attributing a mass to IgG4-RD on serum IgG4 alone.
  evidence:
  - reference: PMID:25988916
    reference_title: 'IgG4-Related Disease: Clinical and Laboratory Features in One Hundred Twenty-Five Patients.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The surgical procedures were usually performed for the purpose of diagnosis or for erroneous diagnoses
      of cancer.
    explanation: The cohort demonstrates the importance of this differential.
- name: Sjogren disease
  description: Lacrimal/salivary disease and tubulointerstitial nephritis can overlap.
  distinguishing_features:
  - Clinical distribution, tissue morphology and anti-SSA/Ro or anti-SSB/La antibodies help distinguish the diseases; antibody negativity alone is not conclusive.
  evidence:
  - reference: PMID:30596168
    reference_title: Clinical Manifestations and Long-term Outcomes of IgG4-Related Kidney and Retroperitoneal Involvement in a United Kingdom IgG4-Related Disease Cohort.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: anti-SSA/Ro and anti-SSB/La antigens are normally detectable in primary Sjögren’s syndrome−TIN.
    explanation: The kidney cohort discusses differentiation from Sjogren-associated nephritis.

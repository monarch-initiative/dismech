  - reference: PMID:35568079
    reference_title: 'Distinct disease-specific Tfh cell populations in 2 different fibrotic diseases: IgG(4)-related disease and Kimura disease.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We encountered abundant infiltrating IL-10-expressing LAG3+ Tfh cells in patients with IgG4-RD.
    explanation: >-
      Human single-cell and tissue imaging identifies an IL-10-positive population without proving its
      independent necessity.
- name: IgG4-Positive Plasmablast Expansion
  description: >-
    Circulating plasmablasts, many of which are IgG4-positive and clonally expanded, are elevated in active
    disease and fall with B-cell depletion. They are modeled separately from mature tissue plasma cells
    because they report disease activity, relapse biology, and CD19-targeted therapeutic vulnerability.
  cell_types:
  - preferred_term: Plasmablast
    term:
      id: CL:0000980
      label: plasmablast
  biological_processes:

- name: Retroperitoneal Encasement and Urinary Obstruction
  description: >-
    Periaortic and periureteric fibroinflammatory tissue can encase ureters and obstruct drainage, producing
    hydronephrosis and postrenal dysfunction. This route is distinct from intrinsic IgG4-related tubulointerstitial
    nephritis.
  evidence:
  - reference: PMID:30596168
    reference_title: Clinical Manifestations and Long-term Outcomes of IgG4-Related Kidney and Retroperitoneal Involvement in a United Kingdom IgG4-Related Disease Cohort.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Para-aortic or peri-ureteric RPF was evident in 14 patients (50%). This was associated with ureteric
      obstruction in 6 patients (21.4%)
    explanation: >-
      Imaging documents the obstructive mechanism within 28 patients with kidney or retroperitoneal involvement.

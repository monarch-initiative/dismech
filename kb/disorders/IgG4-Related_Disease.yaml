- name: Immune-Complex Complement Activation
  description: >-
    IgG4-containing patient immune-complex fractions can activate and consume classical and lectin-pathway
    complement in vitro. Anti-C1q and hypocomplementemia are associated with renal involvement in clinical
    cohorts. The causal contribution of individual subclasses to human renal injury remains unresolved.
  evidence:
  - reference: PMID:26357950
    reference_title: Possible participation of IgG4 in the activation of complement in IgG4-related disease with hypocomplementemia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We observed a marked reduction of CH50 and reduced complement activity in the classical complement
      pathway as well as the mannan-binding lectin complement pathway in NHS incubated with PEG-IC isolated
      from IgG4RD patients with hypocomplementemia.
    explanation: >-
      Patient immune-complex fractions consume complement ex vivo; mixed complexes cannot assign causality
      to purified IgG4 alone.
- name: Cholangiocyte Protective Barrier Impairment
  description: >-
    Annexin A11 supports apical ANO1 trafficking and protective bicarbonate secretion; patient serum can
    inhibit this process. Laminin 511 independently supports epithelial barrier integrity and bile-acid
    resistance. Candidate autoantibodies occur in subsets, but laminin knockdown and patient autoantibody
    binding should not be equated.
  evidence:
  - reference: PMID:34718050
    reference_title: Role of the IgG4-related cholangitis autoantigen annexin A11 in cholangiocyte protection.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Incubation with IRC patient serum inhibited annexin A11 membrane shift and reduced ANO1 surface
      expression.
    explanation: >-
      Human cholangiocyte cultures exposed to antibody-containing patient serum show disturbed protective
      secretory machinery; mixed serum is not an isolated isotype perturbation.
  - reference: PMID:38524667
    reference_title: Laminin 511-E8, an autoantigen in IgG4-related cholangitis, contributes to cholangiocyte protection.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Knockdown of laminin 511 constituents increased toxic bile acid permeation and GCDC-induced apoptosis.
    explanation: >-
      Gene knockdown establishes laminin-dependent protection but does not by itself demonstrate that
      patient anti-laminin antibodies reproduce knockdown.
  cell_types:
  - preferred_term: cholangiocyte
    term:
      id: CL:1000488
      label: cholangiocyte
  downstream:

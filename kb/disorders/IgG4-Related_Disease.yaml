- name: Gut Barrier and Microbiota-Dependent Innate Amplification
  description: >-
    Microbiota transfer and intestinal barrier disruption amplify poly(I:C)-induced pancreatitis through
    increased pancreatic pDC accumulation. Staphylococcus sciuri translocation and mono-colonization experiments
    support a model-specific modifier. Neither microbial sufficiency without the inducing regimen nor
    causal initiation of human systemic IgG4-RD is established.
  evidence:
  - reference: PMID:31287532
    reference_title: Intestinal dysbiosis mediates experimental autoimmune pancreatitis via activation of plasmacytoid dendritic cells.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Fecal microbiota transplantation (FMT) from donor mice treated with 100 µg of poly (I:C) led to
      the development of severe AIP in the recipient mice upon injection with 10 µg of poly (I:C).
    explanation: >-
      Microbiota transfer amplifies pancreatitis under a continuing low-dose innate stimulus; it does
      not induce spontaneous human IgG4-RD.

  conforms_to: fibrotic_response#Excessive ECM Deposition
  description: >-
    Fibrotic collagen remodeling can form a whorled or cartwheel storiform pattern. It is a characteristic
    microscopic architecture rather than a synonym for fibroblast activation. Fibrosis and inflammatory
    mass effects contribute to organ dysfunction; its prominence varies by organ and stage, and established
    scarring can be less reversible than active inflammation.

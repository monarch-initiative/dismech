- name: HLA-DRB1
  gene_term:
    preferred_term: HLA-DRB1
    term:
      id: hgnc:4948
      label: HLA-DRB1
  relationship_type: RISK_FACTOR
  notes: >-
    Replicated susceptibility association; this is not a monogenic diagnostic genotype. HLA peptide-binding
    and Fc-receptor biology can involve adaptive and innate cells, so the associations do not establish
    an innate-first temporal sequence.
  evidence:
  - reference: PMID:38229354
    reference_title: 'IgG4-related disease in the Japanese population: a genome-wide association study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified the HLA-DRB1 (p=1·1×10-11) and FCGR2B (p=2·0×10-8) regions as susceptibility loci
      for IgG4-related disease.
    explanation: Japanese case-control GWAS supports association.
  - reference: PMID:41298177
    reference_title: Genome-wide association studies reveal new insights into the genetic basis of IgG4-related disease in the Chinese Han population.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified 22 single nucleotide polymorphisms (SNPs) that surpassed genome-wide significance
      thresholds (P < 5E-08) and replicated consistently across both cohorts, defining 16 distinct genetic
      susceptibility loci.
    explanation: >-
      Chinese Han GWAS supports a broader polygenic architecture, not fine-mapped causal genes for every
      locus.

      Renal involvement may manifest as an intrinsic kidney disease (IgG4-RKD) or as a consequence of
      ureteric obstruction from retroperitoneal fibrosis (IgG4-RPF).
    explanation: The cohort distinguishes parenchymal and postrenal routes to kidney dysfunction.
  - reference: PMID:30596168
    reference_title: Clinical Manifestations and Long-term Outcomes of IgG4-Related Kidney and Retroperitoneal Involvement in a United Kingdom IgG4-Related Disease Cohort.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Renal function deteriorated in 5 patients (20.8%), including 2 (8.3%) who reached end-stage renal
      disease (ESRD).
    explanation: >-
      Longitudinal renal outcomes in the selected renal/RPF cohort establish potential irreversible impairment.
- name: Hydronephrosis
  category: Renal
  description: Urinary obstruction from retroperitoneal fibrosis can dilate the collecting system.
  phenotype_term:
    preferred_term: Hydronephrosis
    term:
      id: HP:0000126
      label: Hydronephrosis
  evidence:
  - reference: PMID:30596168
    reference_title: Clinical Manifestations and Long-term Outcomes of IgG4-Related Kidney and Retroperitoneal Involvement in a United Kingdom IgG4-Related Disease Cohort.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: image of left-sided ureteric obstruction and hydronephrosis in IgG4-RPF.
    explanation: Clinical imaging documents this complication.
- name: Salivary Gland Enlargement
  category: Head and Neck
  description: >-
    Salivary gland enlargement, especially submandibular involvement, is characteristic; enlargement and
    secretory dysfunction are distinct findings. The ontology anchor is broader than enlargement because
    a gland-general enlargement term was not identified.
  phenotype_term:
    preferred_term: Salivary gland enlargement
    term:
      id: HP:0010286
      label: Abnormal salivary gland morphology
  evidence:
  - reference: PMID:25988916
    reference_title: 'IgG4-Related Disease: Clinical and Laboratory Features in One Hundred Twenty-Five Patients.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The most commonly involved organs were the submandibular glands (35 cases, 28%)
    explanation: The cohort documents frequent submandibular involvement.
  - reference: PMID:35425928
    reference_title: 'Abatacept in IgG4-related disease: a prospective, open-label, single-arm, single-centre, proof-of-concept study.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      IgG4-RD most commonly involves the major salivary glands, lacrimal glands, orbits, bile ducts, retroperitoneal
      tissues, aorta, kidneys, and lungs.
    explanation: The primary trial provides a clinical background summary of characteristic involved organs.
- name: Lymphadenopathy
  category: Hematologic
  description: >-
    Regional or generalized lymph-node involvement occurs; lymph-node IgG4 staining alone requires caution
    because histology can overlap other conditions.
  phenotype_term:
    preferred_term: Lymphadenopathy
    term:
      id: HP:0002716
      label: Lymphadenopathy
  evidence:
  - reference: PMID:25988916
    reference_title: 'IgG4-Related Disease: Clinical and Laboratory Features in One Hundred Twenty-Five Patients.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Among 34 patients with lymphadenopathy, 21 had undergone a lymph node biopsy.
    explanation: The cohort establishes nodal disease and its ascertainment.
- name: Proteinuria
  category: Renal
  description: >-
    Intrinsic renal disease can produce urinary protein, with marked nephrosis in some membranous-nephropathy
    cases.
  phenotype_term:
    preferred_term: Proteinuria
    term:
      id: HP:0000093
      label: Proteinuria
  evidence:
  - reference: PMID:30596168
    reference_title: Clinical Manifestations and Long-term Outcomes of IgG4-Related Kidney and Retroperitoneal Involvement in a United Kingdom IgG4-Related Disease Cohort.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Mild-to-moderate hemoproteinuria occurred in just over half of the patients with IgG4-RKD
    explanation: Clinical cohort data support the phenotype in renal disease.
- name: Aortitis
  category: Cardiovascular
  description: >-
    Aortic inflammation can occur with or without retroperitoneal fibrosis. It is an arterial manifestation
    and must not be relabeled obliterative phlebitis.
  phenotype_term:
    preferred_term: Aortitis
    term:
      id: HP:6001461
      label: Aortitis
  evidence:
  - reference: PMID:30612117
    reference_title: 'Clinical phenotypes of IgG4-related disease: an analysis of two international cross-sectional cohorts.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the derivation cohort (n=493), we identified four groups with distinct manifestations: Group
      1 (31%), Pancreato-Hepato-Biliary disease; Group 2 (24%), Retroperitoneal Fibrosis and/or Aortitis;
      Group 3 (24%), Head and Neck-Limited disease and Group 4 (22%), classic Mikulicz syndrome with systemic
      involvement.
    explanation: >-
      Latent clinical organ-pattern groups were replicated; percentages describe the derivation cohort
      and are not mutually exclusive mechanistic classes.
biochemical:
- name: Serum IgG4
  presence: Elevated
  context: >-
    A diagnostic adjunct with imperfect sensitivity and specificity. The cited rheumatology cohort found
    elevation in about half of active cases using 135 mg/dL; other organ-selected cohorts differ. A normal
    value does not exclude disease.
  evidence:
  - reference: PMID:25988916
    reference_title: 'IgG4-Related Disease: Clinical and Laboratory Features in One Hundred Twenty-Five Patients.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Only 51% of the patients with active disease had elevated serum IgG4 concentrations.
    explanation: >-
      Large cohort study showing that nearly half of active IgG4-RD patients have normal serum IgG4, demonstrating
      imperfect sensitivity.
  - reference: PMID:25988916
    reference_title: 'IgG4-Related Disease: Clinical and Laboratory Features in One Hundred Twenty-Five Patients.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      patients with active disease and elevated serum IgG4 concentrations were older, had a higher IgG4-RD
      RI score, a greater number of organs involved, lower complement levels, higher absolute eosinophil
      counts, and higher IgE levels
    explanation: Elevated serum IgG4 identifies a subset with more severe disease.
- name: Total IgG
  presence: Elevated
  context: >-
    Total IgG can be elevated but is not universal or specific. Twenty-eight percent of active patients
    in the cited cohort had an elevated value.
  evidence:
  - reference: PMID:25988916
    reference_title: 'IgG4-Related Disease: Clinical and Laboratory Features in One Hundred Twenty-Five Patients.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Twenty-eight percent of patients with active disease at baseline had an elevated total IgG concentration
    explanation: This defines the denominator and limits generalization.
- name: Complement C3 and C4
  presence: Decreased
  context: >-
    C3 and C4 may be low, particularly in intrinsic kidney disease. Complement consumption supports an
    immune-complex hypothesis without identifying the responsible immunoglobulin subclass.
  evidence:
  - reference: PMID:25988916
    reference_title: 'IgG4-Related Disease: Clinical and Laboratory Features in One Hundred Twenty-Five Patients.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      patients with active disease and elevated serum IgG4 concentrations were older, had a higher IgG4-RD
      RI score, a greater number of organs involved, lower complement levels
    explanation: Lower complement levels associated with more severe IgG4-RD phenotype.
  - reference: PMID:39798124
    reference_title: Anti-C1q antibodies in IgG4-related disease are common and associated with renal involvement and cutaneous small-vessel vasculitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Anti-C1q antibody levels correlated negatively with levels of C3 and C4, and positively with levels
      of IgG1, IgG4, and serum free light chains.
    explanation: >-
      Association supports the complement-related clinical subset; anti-C1q positivity did not predict
      relapse-free survival.
  readouts:
  - target: Immune-Complex Complement Activation
    relationship: READOUT_OF
    direction: NEGATIVE
    interpretation: >-
      Lower measured complement is compatible with consumption but is not a direct organ-injury assay.
    evidence:
    - reference: PMID:26357950
      reference_title: Possible participation of IgG4 in the activation of complement in IgG4-related disease with hypocomplementemia.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        We observed a marked reduction of CH50 and reduced complement activity in the classical complement
        pathway as well as the mannan-binding lectin complement pathway in NHS incubated with PEG-IC isolated
        from IgG4RD patients with hypocomplementemia.
      explanation: >-
        Patient immune-complex fractions consume complement ex vivo; mixed complexes cannot assign causality
        to purified IgG4 alone.
- name: Circulating plasmablasts
  presence: Increased
  context: >-
    Disease-activity biomarker that may be elevated even when serum IgG4 is normal; not a standalone diagnostic
    test.
  evidence:
  - reference: PMID:25988916
    reference_title: 'IgG4-Related Disease: Clinical and Laboratory Features in One Hundred Twenty-Five Patients.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the levels of circulating plasmablasts – especially IgG4+ plasmablasts – correlate well with disease
      activity as assessed by the IgG4-RD RI.
    explanation: The cohort supports activity association.
  readouts:
  - target: IgG4-Positive Plasmablast Expansion
    relationship: READOUT_OF
    direction: POSITIVE
- name: Soluble interleukin-2 receptor
  presence: Increased
  context: >-
    Exploratory activity-associated marker. It also correlates with primary Sjogren disease activity,
    so neither disease specificity nor CTL-specific causality is established.
  evidence:
  - reference: PMID:29465360
    reference_title: Serum soluble interleukin-2 receptor is a useful biomarker for disease activity but not for differential diagnosis in IgG4-related disease and primary Sjögren's syndrome adults from a defined population.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      serum sIL-2R levels correlate with baseline IgG4-RD RI scores and the number of affected organs
      in IgG4-RD (ρ=0.74, p<0.0001 and ρ=0.75, p<0.0001, respectively).
    explanation: >-
      Clinical correlation supports an activity biomarker without proving that this signal is an upstream
      effector.
- name: IFN-alpha, IL-33 and associated chemokines
  presence: Increased
  context: >-
    Research biomarkers in selected autoimmune-pancreatitis/IgG4-RD cohorts. CXCL9/CXCL10/CCL25 were studied
    in 33 patients, with 14 paired steroid-treatment samples; human temporal causation was not tested.
  evidence:
  - reference: PMID:39264798
    reference_title: A positive cytokine/chemokine feedback loop establishes plasmacytoid DC-driven autoimmune pancreatitis in IgG4-related disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      serum concentrations of CXCL9, CXCL10, and CCL25 were markedly higher in patients with AIP/IgG4-RD
      as compared with those with CP and healthy controls
    explanation: >-
      The human component is serum comparison and treatment-associated change, not tissue or cellular
      perturbation.
treatments:
- name: Glucocorticoids
  description: >-
    Glucocorticoids are used to induce control of active disease, with treatment and taper tailored to
    involved organs and response. Relapse and cumulative toxicity can necessitate maintenance or steroid-sparing
    therapy. The 77% failure of sustained remission reported in one referral cohort is not a universal
    relapse rate.
  evidence:
  - reference: PMID:32552502
    reference_title: European Guideline on IgG4-related digestive disease - UEG and SGF evidence-based recommendations.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Maintenance treatment with glucocorticoids should be considered in multi-organ disease or history
      of relapse.
    explanation: The digestive guideline supports individualized maintenance decisions.
  - reference: PMID:25988916
    reference_title: 'IgG4-Related Disease: Clinical and Laboratory Features in One Hundred Twenty-Five Patients.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: This figure may be biased somewhat by the nature of our referral practice
    explanation: >-
      The primary cohort explicitly cautions against generalizing its 77% failure of sustained glucocorticoid-free
      remission.
  treatment_term:
    preferred_term: glucocorticoid therapy
    term:
      id: NCIT:C122080
      label: Systemic Corticosteroid Therapy
  target_mechanisms:
  - target: Organ-Specific Fibroinflammatory Injury
    treatment_effect: INHIBITS
    description: Suppresses active inflammation; fixed fibrosis and organ damage may persist.
    evidence:
    - reference: PMID:32552502
      reference_title: European Guideline on IgG4-related digestive disease - UEG and SGF evidence-based recommendations.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Response to initial treatment should be assessed at week 2-4 with clinical, biochemical and morphological
        markers.
      explanation: >-
        Response assessment captures inflammation and organ manifestations, rather than a specific cellular
        target.
- name: Rituximab
  description: >-
    Anti-CD20 B-cell depletion used as a steroid-sparing approach. In an uncontrolled 30-patient trial,
    97% had a disease response, 77% met the composite primary endpoint and 40% remained in complete remission
    at 12 months. These results support activity but do not constitute a randomized comparison or demonstrate
    elimination of mature plasma cells.
  treatment_term:
    preferred_term: rituximab therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: rituximab
      term:
        id: NCIT:C1702
        label: Rituximab
  evidence:
  - reference: PMID:25667206
    reference_title: 'Rituximab for IgG4-related disease: a prospective, open-label trial.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The primary outcome was achieved by 23 participants (77%). Fourteen (47%) were in complete remission
      at 6 months, and 12 (40%) remained in complete remission at 12 months.
    explanation: The denominators and endpoints concern an open-label 30-person trial.
  target_mechanisms:
  - target: IgG4-Positive Plasmablast Expansion
    treatment_effect: INHIBITS
    description: >-
      Depletion of CD20-positive B-cell precursors reduces the plasmablast-supporting lineage; long-lived
      plasma-cell persistence can contribute to incomplete serologic normalization.
    evidence:
    - reference: PMID:24817416
      reference_title: Plasmablasts as a biomarker for IgG4-related disease, independent of serum IgG4 concentrations.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The steep decline in plasmablast counts after anti-CD20 treatment likely stems from the depletion
        of CD20+ precursors.
      explanation: >-
        The clinical study documents declining plasmablast counts after CD20 depletion and interprets
        this as loss of precursor support.
- name: Inebilizumab
  description: >-
    CD19-directed cytolytic antibody with an FDA indication for adult IgG4-RD. In MITIGATE, 135 participants
    received standardized glucocorticoid tapering; flare occurred in 10% versus 60% on placebo, with hazard
    ratio 0.13. Serious adverse events occurred in 18% versus 9%. Reduced flares demonstrate clinical
    efficacy but do not isolate antigen presentation, antibody production or direct profibrotic signaling
    as the necessary B-cell function.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  target_mechanisms:
  - target: IgG4-Positive Plasmablast Expansion
    treatment_effect: INHIBITS
    description: >-
      Depletes CD19-positive B-lineage compartments. The trial establishes the value of targeting this
      lineage, not that every mature plasma cell is removed or that a specific B-to-CTL interaction is
      necessary.
    evidence:
    - reference: PMID:39541094
      reference_title: Inebilizumab for Treatment of IgG4-Related Disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Inebilizumab targets and depletes CD19+ B cells and may be effective for treating patients with
        IgG4-related disease.
      explanation: >-
        The Phase 3 trial describes CD19-positive B-cell depletion as the mechanism motivating inebilizumab
        in IgG4-RD.
  evidence:
  - reference: PMID:39541094
    reference_title: Inebilizumab for Treatment of IgG4-Related Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Inebilizumab reduced the risk of flares of IgG4-related disease and increased the likelihood of
      flare-free complete remission at 1 year, confirming the role of CD19-targeted B-cell depletion as
      a potential treatment for IgG4-related disease.
    explanation: >-
      MITIGATE provides randomized Phase 3 evidence that CD19-targeted B-cell depletion reduces IgG4-RD
      flares.
  - reference: url:https://www.accessdata.fda.gov/drugsatfda/docs/label/2025/761142s003lbl.pdf
    reference_title: https://www.accessdata.fda.gov/drugsatfda_docs/label/2025/761142s003lbl.pdf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      UPLIZNA is indicated for the treatment of Immunoglobulin G4-related disease (IgG4-RD) in adult patients.
    explanation: The FDA label revised April 2025 establishes the adult indication.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: inebilizumab
      term:
        id: NCIT:C88283
        label: Inebilizumab
- name: Obexelimab
  description: >-
    Investigated as a nondepleting CD19/Fc-gamma-RIIb B-cell inhibitor. Phase III INDIGO showed fewer
    flares and less rescue glucocorticoid exposure over 52 weeks. The randomized result supports B-cell
    functional inhibition; it does not establish reversal of fixed fibrosis.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: Obexelimab
      term:
        id: NCIT:C170236
        label: Obexelimab
  evidence:
  - reference: PMID:42233621
    reference_title: Obexelimab for the Treatment of IgG4-Related Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Obexelimab is a bifunctional monoclonal antibody that inhibits B-cell activity through coengagement
      of CD19 and FcγRIIb without inducing B-cell depletion.
    explanation: The drug tests nondepleting B-cell inhibition and should not be described as B-cell depletion.
  - reference: PMID:42233621
    reference_title: Obexelimab for the Treatment of IgG4-Related Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      flares were reported in 26 patients (26.8%) in the obexelimab group and in 53 patients (54.6%) in
      the placebo group.
    explanation: >-
      INDIGO randomized 194 participants with standardized glucocorticoid tapering; the flare hazard ratio
      was 0.44.
- name: Rilzabrutinib
  description: >-
    Investigational reversible BTK inhibitor in IgG4-RD. A 27-person open-label phase IIa trial, including
    rituximab-intolerant or refractory participants, reported 19/27 flare-free and off glucocorticoids/immunosuppressants
    at end of treatment. Diarrhea occurred in 11/27; two serious events, including one death, were judged
    unrelated to study drug. Larger controlled trials are needed.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: Rilzabrutinib
      term:
        id: NCIT:C174769
        label: Rilzabrutinib
  evidence:
  - reference: PMID:42481271
    reference_title: A phase 2 trial of rilzabrutinib in IgG4-related disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At the end of treatment, 70.4% (19/27) of participants were flare-free and off GCs/immunosuppressants.
    explanation: >-
      The 27-person open-label phase IIa trial supports feasibility and preliminary activity; it does
      not estimate comparative efficacy.
- name: Abatacept
  description: >-
    Investigational costimulation blockade. In a 10-person open-label study, 5 maintained a response at
    24 weeks and 3 achieved complete remission. Response correlated with reduced plasmablasts and activated
    Tfh2 cells; half discontinued for flare or lack of response. These exploratory data do not prove an
    obligatory Tfh pathway.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: Abatacept
      term:
        id: NCIT:C28898
        label: Abatacept
  evidence:
  - reference: PMID:35425928
    reference_title: 'Abatacept in IgG4-related disease: a prospective, open-label, single-arm, single-centre, proof-of-concept study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Three subjects (30%) achieved the primary endpoint.
    explanation: >-
      Complete remission at week 24 occurred in 3/10 in this uncontrolled proof-of-concept trial; 5/10
      maintained a treatment response.
  target_mechanisms:
  - target: Tfh-Mediated IgG4 Class Switching and Plasma Cell Differentiation
    treatment_effect: INHIBITS
    description: >-
      Costimulation blockade is associated with reduced activated Tfh2 and plasmablast compartments among
      responders.
    evidence:
    - reference: PMID:35425928
      reference_title: 'Abatacept in IgG4-related disease: a prospective, open-label, single-arm, single-centre, proof-of-concept study.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Reductions in serum IgE, circulating plasmablasts, and activated type 2 T follicular helper (TFH2)
        cells correlated with response to treatment.
      explanation: Correlated immune changes support pharmacodynamic interpretation rather than causal mediation.

  experimental_model_type: CO_CULTURE
  publication: PMID:31319101
  description: >-
    Patient B cells or sorted plasmablasts cocultured with primary pancreatic or skin fibroblasts; transwells
    and PDGF-B blocking test soluble collagen-promoting activity.
  cell_source: Patient-derived immune cells with primary fibroblasts or human cell lines as specified
  evidence:
  - reference: PMID:31319101
    reference_title: B lymphocytes directly contribute to tissue fibrosis in patients with IgG(4)-related disease.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      PDGF-B blockade attenuated the fibrotic effect induced by B cells from IgG4-RD patients while nonimmune
      IgG of the same isotype did not inhibit the collagen production induced by the same B lymphocytes.
    explanation: >-

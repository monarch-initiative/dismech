name: IgG4-Related Disease
creation_date: '2026-03-06T00:00:00Z'
category: Autoimmune
disease_term:
  preferred_term: IgG4-related disease
  term:
    id: MONDO:0017287
    label: immunoglobulin G4-related sclerosing disease
parents:
- Autoimmune Disease
- Fibroinflammatory Disease
description: >-
  An immune-mediated fibroinflammatory disease that produces tumefactive lesions in one or multiple organs,
  commonly involving the pancreas, bile ducts, salivary and lacrimal glands, kidneys, retroperitoneum
  and aorta. Characteristic pathology combines lymphoplasmacytic inflammation, often rich in IgG4-positive
  plasma cells, with storiform fibrosis and obliterative phlebitis; the full pattern varies by organ and
  disease stage. B-lineage, T-cell, myeloid and stromal mechanisms contribute, with unresolved initiating
  events and heterogeneous autoantibody effects. Recurrent inflammation and fibrosis can cause obstructive
  complications and irreversible organ dysfunction.
has_subtypes:
- name: Pancreato-hepato-biliary pattern
  description: >-
    Prominent pancreatic and biliary involvement. These are latent clinical patterns, not proven distinct
    immune mechanisms.
  evidence:
  - reference: PMID:30612117
    reference_title: 'Clinical phenotypes of IgG4-related disease: an analysis of two international cross-sectional cohorts.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the derivation cohort (n=493), we identified four groups with distinct manifestations: Group
      1 (31%), Pancreato-Hepato-Biliary disease; Group 2 (24%), Retroperitoneal Fibrosis and/or Aortitis;
      Group 3 (24%), Head and Neck-Limited disease and Group 4 (22%), classic Mikulicz syndrome with systemic
      involvement.
    explanation: >-
      Latent clinical organ-pattern groups were replicated; percentages describe the derivation cohort
      and are not mutually exclusive mechanistic classes.

- name: Pancreatobiliary Fibroinflammation and Ductal Obstruction
  description: >-
    Lymphoplasmacytic inflammation and fibrosis affect pancreatic and biliary structures. Duct narrowing
    and inflammatory enlargement can cause obstructive jaundice; persistent pancreatic injury can leave
    exocrine or endocrine dysfunction. An IgG4-related pancreatic mass requires distinction from malignancy.

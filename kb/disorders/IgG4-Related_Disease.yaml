- name: Autoantibody-Mediated IL-1RA Neutralization
  description: >-
    Anti-IL-1RA antibodies in a subset can neutralize the endogenous IL-1 receptor antagonist and increase
    inflammatory and profibrotic mediator production. IgG4 predominates in many positive samples but other
    subclasses occur, and functional plasma experiments do not isolate IgG4-specific activity. The pathway
    is not universal or specific to IgG4-RD.
  evidence:
  - reference: PMID:33974929
    reference_title: Neutralizing anti-IL-1 receptor antagonist autoantibodies induce inflammatory and fibrotic mediators in IgG4-related disease.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Plasma from patients with IgG4-RD exhibited elevated levels of reactivity against IL-1RA compared
      with plasma from the controls and neutralized IL-1RA activity, resulting in inflammatory and fibrotic
      mediator production in vitro.
    explanation: >-
      Patient-derived antibody and plasma experiments demonstrate functional IL-1RA interference in a
      subset. They do not isolate an IgG4-only mechanism or prove tissue fibrosis in vivo.
  downstream:
  - target: Fibroblast Activation and Collagen Production
    description: >-
      Unopposed IL-1 signaling increases profibrotic mediator production in cell assays; progression to
      human stromal fibrosis remains inferred.

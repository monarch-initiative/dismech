name: Ecthyma
creation_date: "2026-09-29T19:01:41Z"
description: >-
  Ecthyma is an ulcerative bacterial pyoderma and deeper variant of impetigo
  in which group A streptococci or Staphylococcus aureus extend through the
  epidermis into the dermis at sites of minor skin trauma.
category: Infectious Disease
disease_term:
  preferred_term: ecthyma
  term:
    id: MONDO:0001404
    label: ecthyma
parents:
- Impetigo
synonyms:
- Deep impetigo
- Ulcerative impetigo
notes: >-
  Bacterial ecthyma is distinct from the viral namesake contagious
  ecthyma/orf and from ecthyma gangrenosum; both are excluded from this
  entry.
infectious_agent:
- name: Streptococcus pyogenes
  infectious_agent_term:
    preferred_term: Streptococcus pyogenes
    term:
      id: NCBITaxon:1314
      label: Streptococcus pyogenes
  description: >-
    Streptococcus pyogenes, or group A beta-hemolytic Streptococcus, is one of
    the two principal bacteria cultured from impetigo and ecthyma lesions.
  evidence:
  - reference: PMID:782505
    reference_title: Clinical and bacteriological evaluation of a twice daily regimen of epicillin capsules for the treatment of skin infections.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Fifty-five patients with impetigo, ecthyma, or folliculitis caused by
      epicillin-sensitive strains of Streptococcus pyogenes or Staphylococcus
      aureus were treated with 500 mg epicillin capsules twice daily for an
      average duration of 9 days.
    explanation: >-
      Identifies S. pyogenes among the cultured bacteria causing ecthyma in a
      human treatment series.
  - reference: PMID:359752
    reference_title: Treatment of impetigo and ecthyma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The healing rate was higher (93 percent) in those children whose skin
      cultures grew Group A beta hemolytic streptococci.
    explanation: >-
      Reports group A beta-hemolytic streptococci from cultures in an
      impetigo/ecthyma pediatric treatment series.
- name: Staphylococcus aureus
  infectious_agent_term:
    preferred_term: Staphylococcus aureus
    term:
      id: NCBITaxon:1280
      label: Staphylococcus aureus
  description: >-
    Staphylococcus aureus is the second principal bacterium cultured from
    impetigo and ecthyma lesions, either alone or with group A streptococci.
  evidence:
  - reference: PMID:782505
    reference_title: Clinical and bacteriological evaluation of a twice daily regimen of epicillin capsules for the treatment of skin infections.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Fifty-five patients with impetigo, ecthyma, or folliculitis caused by
      epicillin-sensitive strains of Streptococcus pyogenes or Staphylococcus
      aureus were treated with 500 mg epicillin capsules twice daily for an
      average duration of 9 days.
    explanation: >-
      Identifies S. aureus among the cultured bacteria causing ecthyma in a
      human treatment series.
  - reference: PMID:359752
    reference_title: Treatment of impetigo and ecthyma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      When staphylococcus aureus was the only pathogen isolated, the healing
      rate was 86 percent.
    explanation: >-
      Reports S. aureus as a sole cultured pathogen in an impetigo/ecthyma
      pediatric treatment series.
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
    evidence:
    - reference: PMID:29299899
      reference_title: Clinical Guidelines for the Antibiotic Treatment for Community-Acquired Skin and Soft Tissue Infection.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        This clinical guideline provides recommendations for the diagnosis and
        management of SSTI, including impetigo/ecthyma, purulent skin and soft
        tissue infection, erysipelas and cellulitis, necrotizing fasciitis,
        pyomyositis, clostridial myonecrosis, and human/animal bite.
      explanation: >-
        Places impetigo/ecthyma in the community-acquired skin and soft-tissue
        infection guideline scope, supporting Harrison's Infectious Diseases
        classification.
transmission:
- name: Close-Contact and Fomite Spread
  description: >-
    Because ecthyma is the deeper ulcerative form of impetigo, bacteria from
    impetigo-spectrum skin lesions can spread through close contact and
    contaminated personal objects to seed breached epidermis in close contacts
    or at new excoriated sites.
  evidence:
  - reference: PMID:41839109
    reference_title: "Impetigo: Rapid Evidence Review."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Reducing the spread and recurrence of impetigo includes good hand
      hygiene, thoroughly washing objects used by people with impetigo, and
      refraining from returning to work or school until 12 to 24 hours after
      initiating antibiotic treatment or clinical improvement occurs.
    explanation: >-
      This review is about impetigo, not ecthyma. Its spread-control advice
      (hand hygiene, washing shared objects, exclusion until treated) implies
      contact and fomite spread of impetigo; the route is extended to ecthyma
      here because the same organisms cause both and ecthyma is the deeper form
      of the same infection.
pathophysiology:
- name: Excoriated Skin Portal
  role: trigger
  description: >-
    Minor abrasions, insect bites, scabies burrows, and scratching disrupt the
    epidermal barrier and create a portal through which skin-colonizing GAS or
    S. aureus can enter the deeper epidermis and dermis.
  locations:
  - preferred_term: skin of body
    term:
      id: UBERON:0002097
      label: skin of body
  - preferred_term: epidermis
    term:
      id: UBERON:0001003
      label: skin epidermis
  downstream:
  - target: Staphylococcal or Streptococcal Dermal Pyoderma
    description: >-
      The breached barrier exposes epidermal and dermal tissue to the bacteria
      that normally remain at the surface.
  evidence:
  - reference: PMID:31609963
    reference_title: "High burden and seasonal variation of paediatric scabies and pyoderma prevalence in The Gambia: A cross-sectional study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Scabies was significantly associated with pyoderma (aOR 2.74, 95% CI
      1.61-4.67).
    explanation: >-
      Supports scabies-associated excoriation as an epidemiologic portal for
      bacterial pyoderma.
- name: Staphylococcal or Streptococcal Dermal Pyoderma
  role: cause
  description: >-
    GAS or S. aureus, alone or together, proliferates beyond superficial
    impetigo, extending the untreated infection through the epidermis into the
    dermis where it forms an ulcer.
  locations:
  - preferred_term: epidermis
    term:
      id: UBERON:0001003
      label: skin epidermis
  - preferred_term: dermis
    term:
      id: UBERON:0002067
      label: dermis
  downstream:
  - target: Streptolysin S and Sse Neutrophil Evasion
    description: >-
      Hypervirulent GAS can express streptolysin S and Sse to blunt neutrophil
      containment in infected skin.
  - target: Shallow Dermal Ulceration
    description: >-
      The deeper staphylococcal or streptococcal pyoderma produces ulceration
      rather than remaining a purely subcorneal process.
  - target: Nephritogenic GAS Postinfectious Sequela
    description: >-
      Skin infection with nephritogenic GAS M serotypes can initiate the
      immune-mediated renal branch of disease.
  - target: Erythematous raised ulcer margin
    description: >-
      The dermal infection inflames the skin around the ulcer, giving the
      elevated red margin that often surrounds ecthyma lesions.
  evidence:
  - reference: PMID:16218899
    reference_title: Bacterial diseases of the skin.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Ecthyma is usually a consequence of failure to treat effectively
      impetigo. The untreated infection extends deep into the tissue in shallow
      ulcerations
    explanation: >-
      Describes ecthyma as impetigo that extends deeper into tissue and forms
      shallow ulcers.
  - reference: PMID:359752
    reference_title: Treatment of impetigo and ecthyma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The healing rate was higher (93 percent) in those children whose skin
      cultures grew Group A beta hemolytic streptococci. When staphylococcus
      aureus was the only pathogen isolated, the healing rate was 86 percent.
    explanation: >-
      Supports both GAS and S. aureus as cultured pathogens in impetigo/ecthyma
      lesions.
  - reference: PMID:29299899
    reference_title: Clinical Guidelines for the Antibiotic Treatment for Community-Acquired Skin and Soft Tissue Infection.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Ecthyma can also be caused by streptococci or S. aureus or it may be a
      polymicrobial infection involving both of these bacteria
    explanation: >-
      Guideline statement that ecthyma is caused by streptococci, S. aureus, or
      both together.
- name: Streptolysin S and Sse Neutrophil Evasion
  role: modifier
  description: >-
    In hypervirulent GAS skin infection, the streptolysin S gene sagA and the
    platelet-activating factor acetylhydrolase Sse cooperate to suppress
    neutrophil recruitment, enlarge skin lesions, and enable systemic spread in
    mouse subcutaneous infection.
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  downstream:
  - target: Shallow Dermal Ulceration
    description: >-
      Impaired neutrophil recruitment lets GAS lesion growth and local tissue
      injury outpace the early cellular response.
  evidence:
  - reference: PMID:28947648
    reference_title: Requirement and Synergistic Contribution of Platelet-Activating Factor Acetylhydrolase Sse and Streptolysin S to Inhibition of Neutrophil Recruitment and Systemic Infection by Hypervirulent emm3 Group A Streptococcus in Subcutaneous Infection of Mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Deletion of sse and sagA in MGAS315 synergistically reduced the skin
      lesion size and GAS burden in the liver and spleen.
    explanation: >-
      Shows the GAS Sse and SagA/SLS combination increases lesion size and
      systemic bacterial burden in a mouse skin-infection model.
  - reference: PMID:28947648
    reference_title: Requirement and Synergistic Contribution of Platelet-Activating Factor Acetylhydrolase Sse and Streptolysin S to Inhibition of Neutrophil Recruitment and Systemic Infection by Hypervirulent emm3 Group A Streptococcus in Subcutaneous Infection of Mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These findings indicate that both Sse and SLS are required but that
      neither is sufficient for inhibition of neutrophil recruitment and
      systemic infection by hypervirulent GAS.
    explanation: >-
      Directly supports Sse and SLS as joint GAS immune-evasion factors in
      infected skin.
- name: Shallow Dermal Ulceration
  role: outcome
  description: >-
    Extension into the dermis produces a punched-out ulcer covered by crust,
    the feature that makes ecthyma deeper than ordinary impetigo. Because the
    dermis is breached, the lesion may heal with a scar even when treated.
  downstream:
  - target: Skin ulcer
    description: >-
      Dermal ulceration is the defining tissue morphology of ecthyma.
  - target: Crusted ulcer surface
    description: >-
      Exudate from the ulcerated dermal lesion dries into the crust covering
      the ulcer.
  - target: Scarring after healing
    description: >-
      Loss of dermis in the ulcer heals by scar formation.
  evidence:
  - reference: PMID:16218899
    reference_title: Bacterial diseases of the skin.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Ecthyma is usually a consequence of failure to treat effectively
      impetigo. The untreated infection extends deep into the tissue in shallow
      ulcerations
    explanation: >-
      Establishes ulceration from deeper extension of untreated impetigo as the
      local tissue outcome in ecthyma.
  - reference: PMID:29299899
    reference_title: Clinical Guidelines for the Antibiotic Treatment for Community-Acquired Skin and Soft Tissue Infection.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Ecthyma lesions are punched-out ulcers covered by greenish yellow crusts
      that extend deeply into the dermis and are often surrounded by elevated
      red margins. Even when treated, ecthyma may leave a scar
    explanation: >-
      Guideline description of the ecthyma lesion as a crusted dermal ulcer
      that may scar.
- name: Nephritogenic GAS Postinfectious Sequela
  role: outcome
  description: >-
    When ecthyma is caused by nephritogenic S. pyogenes M serotypes, immune
    responses to skin infection can be followed by acute post-streptococcal
    glomerulonephritis. A 1979 epidemiological review reported that
    streptococcal skin infections, unlike pharyngitis, do not result in acute
    rheumatic fever; that older position has since been questioned in some
    high-burden populations, so it is recorded here as the review's finding
    rather than a settled rule.
  downstream:
  - target: Glomerulonephritis
    description: >-
      Post-streptococcal immune injury to the glomeruli presents clinically as
      acute glomerulonephritis.
  evidence:
  - reference: PMID:399386
    reference_title: Post-streptococcal glomerulonephritis following pyoderma.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      M-types 2, 49, 55, 57, and 60 are now recognized to be of major
      importance in AGN following pyoderma.
    explanation: >-
      Identifies the nephritogenic GAS M serotypes associated with acute
      glomerulonephritis after pyoderma.
  - reference: PMID:399386
    reference_title: Post-streptococcal glomerulonephritis following pyoderma.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Although streptococcal skin infections are quire important in AGN, they
      do not result in acute rheumatic fever.
    explanation: >-
      Source for the statement that the post-pyoderma sequela is
      glomerulonephritis rather than acute rheumatic fever. The quote keeps the
      source's typographical error ("quire").
  - reference: PMID:6371610
    reference_title: Autumn--the season for post-streptococcal acute glomerulonephritis in New Zealand.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The skin was the predominant site of infection (68%). Streptococci
      belonging to major pyoderma-associated nephritogenic serotypes 49, 57 and
      60 accounted for 19/30 (63%) M-typable isolates.
    explanation: >-
      Links skin infection by pyoderma-associated nephritogenic GAS serotypes
      to post-streptococcal acute glomerulonephritis in children.

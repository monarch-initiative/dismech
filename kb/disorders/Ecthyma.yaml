diagnosis:
- name: Clinical Diagnosis with Lesion Culture
  description: >-
    Ecthyma is recognized clinically by its crusted, punched-out dermal ulcers.
    When pus or exudate is present, Gram staining and bacterial culture can
    identify group A streptococci or S. aureus, but typical lesions can be
    treated without testing.
  evidence:
  - reference: PMID:29299899
    reference_title: Clinical Guidelines for the Antibiotic Treatment for Community-Acquired Skin and Soft Tissue Infection.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      When pus or exudate are present, the causative bacteria can be identified
      with Gram staining and bacterial culture testing, but typical lesions can
      be treated without testing, for microbial diagnosis.
    explanation: >-
      Guideline statement on the role of Gram stain and culture in impetigo
      and ecthyma diagnosis.
  - reference: PMID:29299899
    reference_title: Clinical Guidelines for the Antibiotic Treatment for Community-Acquired Skin and Soft Tissue Infection.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Ecthyma lesions are punched-out ulcers covered by greenish yellow crusts
      that extend deeply into the dermis and are often surrounded by elevated
      red margins. Even when treated, ecthyma may leave a scar
    explanation: >-
      Gives the clinical lesion pattern used to recognize ecthyma.
- name: Anti-DNase B for Post-Pyoderma APSGN
  description: >-
    Anti-DNase B serology is preferred over antistreptolysin O when acute
    glomerulonephritis follows streptococcal skin infection.
  evidence:
  - reference: PMID:6995881
    reference_title: Probable association of M type 57 streptococcal skin infection with acute glomerulonephritis in the Tauranga area.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The superiority of the anti-DNase B test over anti-streptolysin O
      determination in a situation when streptococcal pyoderma nephritis has
      occurred is shown.
    explanation: >-
      Supports anti-DNase B as the serologic test for a recent streptococcal
      skin infection when APSGN is suspected.
treatments:
- name: Systemic Antibiotics for Deep Impetigo
  description: >-
    Ecthyma is treated as impetigo except that oral (systemic) antibiotics are
    recommended rather than topical therapy alone. The drug must cover both
    streptococci and S. aureus; amoxicillin/clavulanate, a first-generation
    cephalosporin, or clindamycin are the guideline's oral options, and
    benzathine penicillin has been used in children.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antibiotic Therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
    therapeutic_agent:
    - preferred_term: amoxicillin
      term:
        id: CHEBI:2676
        label: amoxicillin
    - preferred_term: clavulanic acid
      term:
        id: CHEBI:48947
        label: clavulanic acid
    - preferred_term: first-generation cephalosporin
      term:
        id: CHEBI:23066
        label: cephalosporin
    - preferred_term: clindamycin
      term:
        id: CHEBI:3745
        label: clindamycin
    - preferred_term: benzathine penicillin
      term:
        id: CHEBI:51352
        label: benzylpenicillin benzathine
  target_mechanisms:
  - target: Staphylococcal or Streptococcal Dermal Pyoderma
    treatment_effect: INHIBITS
    description: >-
      Systemic antibiotics suppress or kill the S. aureus and GAS populations
      growing in the ulcerative pyoderma lesion.
  evidence:
  - reference: PMID:29299899
    reference_title: Clinical Guidelines for the Antibiotic Treatment for Community-Acquired Skin and Soft Tissue Infection.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Treatment of ecthyma is the same as for impetigo, except that oral
      antibiotics are recommended
    explanation: >-
      Guideline recommendation of oral antibiotics specifically for ecthyma.
  - reference: PMID:29299899
    reference_title: Clinical Guidelines for the Antibiotic Treatment for Community-Acquired Skin and Soft Tissue Infection.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      A drug that can treat both streptococci and S. aureus must be selected
      for treatment
    explanation: >-
      Requires coverage of both causative organisms.
  - reference: PMID:29299899
    reference_title: Clinical Guidelines for the Antibiotic Treatment for Community-Acquired Skin and Soft Tissue Infection.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Amoxicillin/clavulanate, first-generation cephalosporins, or clindamycin
      may be used as an oral antibiotics
    explanation: >-
      Names the oral agents recorded as therapeutic_agent values.
  - reference: PMID:16218899
    reference_title: Bacterial diseases of the skin.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Treatment for ecthyma usually requires systemic antibiotics against
      either staphylococcus or streptococcus.
    explanation: >-

pathophysiology:
- name: GDF5 Functional Haploinsufficiency
  conforms_to: "limb_digit_patterning_serial_homology#Limb Patterning Signal Perturbation"
  role: trigger
  biological_scale: MOLECULAR
  description: >
    GDF5 (CDMP1) is a secreted BMP-family ligand that acts through BMPR1B to
    drive chondrocyte differentiation and joint formation. BDC alleles are
    heterozygous frameshift, nonsense, and active-domain missense variants.
    Truncating alleles simply remove a functional copy; the missense alleles
    reach the same endpoint by a different route, failing to form the
    disulfide-linked dimers that the mature growth factor requires. Both
    converge on functional haploinsufficiency — roughly half the normal GDF5
    activity — which distinguishes BDC from the dominant-negative BMPR1B alleles
    of type A2 and from the processing-site GDF5 allele that also causes A2.
  gene:
    preferred_term: GDF5
    term:
      id: hgnc:4220
      label: GDF5
  biological_processes:
  - preferred_term: BMP Signaling Pathway
    term:
      id: GO:0030509
      label: BMP signaling pathway
    modifier: DECREASED
  - preferred_term: SMAD Protein Signal Transduction
    term:
      id: GO:0060395
      label: SMAD protein signal transduction
    modifier: DECREASED
  evidence:
  - reference: PMID:12357473
    reference_title: The mutational spectrum of brachydactyly type C.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Heterozygous mutations in GDF5, which maps to human chromosome 20, occur in individuals with autosomal dominant brachydactyly type C (BDC)."
    explanation: Establishes heterozygous GDF5 variants as the cause of BDC.
  - reference: PMID:12357473
    reference_title: The mutational spectrum of brachydactyly type C.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Finally, we show that mutant GDF5 polypeptides containing missense mutations in their active domains do not efficiently form disulfide-linked dimers when expressed in vitro."
    explanation: Explains how active-domain missense alleles lose function.
  - reference: PMID:12357473
    reference_title: The mutational spectrum of brachydactyly type C.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These data support the hypothesis that BDC results from functional haploinsufficiency for GDF5."
    explanation: States the inferred mechanism for BDC.
  downstream:
  - target: Reduced GDF5-BMPR1B Signaling in the Digital Ray and Interzone
    description: >-
      Halved GDF5 activity lowers signalling through BMPR1B in the condensing
      digital ray and at the forming interphalangeal joints.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:12357473
      reference_title: The mutational spectrum of brachydactyly type C.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "These data support the hypothesis that BDC results from functional haploinsufficiency for GDF5."
      explanation: Ties the allele class to a quantitative reduction in GDF5 signalling.
- name: Reduced GDF5-BMPR1B Signaling in the Digital Ray and Interzone
  conforms_to: "limb_digit_patterning_serial_homology#Disrupted Digit Number and Identity Specification"
  role: central_effector
  biological_scale: CELLULAR
  description: >
    GDF5 is expressed in the joint interzone and controls both chondrocyte
    differentiation in the digital ray and the segmentation that separates
    phalanges. Lowering it disturbs the segmentation program in two directions at
    once, which is why BDC uniquely pairs missing middle-phalangeal length with
    supernumerary phalangeal segments: some interzones fail to make a normal
    segment, while others produce an extra, malformed one. GDF5 is also the BDA2
    and (in semidominant families) the BDA1 gene, so the type of brachydactyly
    tracks the allele's specific effect on ligand maturation and receptor
    affinity rather than the identity of the gene.
  biological_processes:
  - preferred_term: Chondrocyte Differentiation
    term:
      id: GO:0002062
      label: chondrocyte differentiation
    modifier: DECREASED
  - preferred_term: Embryonic Digit Morphogenesis
    term:
      id: GO:0042733
      label: embryonic digit morphogenesis
    modifier: ABNORMAL
  cell_types:
  - preferred_term: Chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  - preferred_term: Prechondrogenic Mesenchymal Cell
    term:
      id: CL:0008019
      label: mesenchymal cell
  evidence:
  - reference: PMID:14523231
    reference_title: Mutations in bone morphogenetic protein receptor 1B cause brachydactyly type A2.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "GDF5, the most prominent member of the GDFs, was shown to play a vital role in the differentiation of chondrocytes and the formation of joints"
    explanation: Establishes GDF5's dual role in chondrocyte differentiation and joint formation.
  - reference: PMID:14523231
    reference_title: Mutations in bone morphogenetic protein receptor 1B cause brachydactyly type A2.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "BDC is characterized by brachymesophalangia of the second, third, and fifth fingers, sometimes together with hyperphalangia, usually of the second and third fingers."
    explanation: Describes the paired shortening-plus-extra-segment pattern that the segmentation defect produces.
  - reference: PMID:19790289
    reference_title: "The brachydactylies: a molecular disease family."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "As a consequence of the close interactions within the network, overlapping phenotypes are generated that are, nevertheless, characterized by specific recognizable patterns."
    explanation: >-
      Supports the reading that the distinct brachydactyly patterns arise from
      graded perturbations of one shared regulatory network.
  downstream:
  - target: Brachymesophalangy with Hyperphalangy of the Radial Digits
    description: >-
      The disturbed segmentation program yields short middle phalanges in rays
      II, III, and V and an extra phalangeal segment in rays II and III.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:22828468
      reference_title: A novel mutation in CDMP1 causes brachydactyly type C with "angel-shaped phalanx". A genotype-phenotype correlation in the mutational spectrum.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Brachydactyly type C (BDC), a well-recognized autosomal dominant hand malformation, displays brachymesophalangy of the second, third, and fifth fingers, a short first metacarpal, hyperphalangy, and ulnar deviation of the index finger."
      explanation: Names the realised digital pattern that follows from the segmentation defect.
- name: Brachymesophalangy with Hyperphalangy of the Radial Digits
  conforms_to: "limb_digit_patterning_serial_homology#Serially Homologous Autopod Malformation"
  role: consequence
  biological_scale: TISSUE
  description: >
    The realised malformation: short middle phalanges of the index, middle, and
    little fingers; an extra phalangeal segment in the index and middle fingers,
    often with an anomalous proximal-phalanx configuration that deviates the
    index finger ulnarly; and a short first metacarpal. Because the ring finger
    is spared it becomes the longest digit. Feet are normal or show only ordinary
    brachydactyly, so unlike most brachydactylies the hand carries nearly all of
    the phenotype. The "angel-shaped phalanx" is a distinctive radiographic
    variant within the same CDMP1 spectrum.
  biological_processes:
  - preferred_term: Limb Morphogenesis
    term:
      id: GO:0035108
      label: limb morphogenesis
    modifier: ABNORMAL
  evidence:
  - reference: PMID:22828468
    reference_title: A novel mutation in CDMP1 causes brachydactyly type C with "angel-shaped phalanx". A genotype-phenotype correlation in the mutational spectrum.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "An \"angel-shaped phalanx\" is a distinctive radiological sign that can be found in BDC and other skeletal dysplasias"
    explanation: Records the angel-shaped phalanx as a recognised BDC radiographic sign.
  - reference: PMID:18554391
    reference_title: Brachydactyly.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The ring finger is always the longest, longer than the index"
    explanation: States the ring-finger sign that distinguishes BDC clinically.

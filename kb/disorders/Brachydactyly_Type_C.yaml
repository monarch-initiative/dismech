name: Brachydactyly Type C
synonyms:
- BDC
- Brachydactyly with hyperphalangism, Haws type
- GDF5-related brachydactyly type C
creation_date: '2026-08-27T00:00:00Z'
category: Mendelian
description: >
  Brachydactyly type C (BDC) is an isolated hand malformation with an unusual
  signature: shortening of the middle phalanges of the index, middle, and little
  fingers combined with hyperphalangy — an extra, often triangular phalangeal
  segment — of the index and middle fingers, plus a short first metacarpal. The
  ring finger is spared and therefore ends up the longest digit, which is the
  single most useful bedside sign. BDC is caused by heterozygous loss-of-function
  variants in GDF5 (CDMP1), and the disease is locus homogeneous: the earlier
  suggestion of a second locus on chromosome 12 resolved to a GDF5 frameshift.
  Penetrance is incomplete and intra- and interfamilial variability is
  considerable, so an apparently skipped generation does not exclude the
  diagnosis. GDF5 dosage grades a whole allelic series — heterozygous
  loss-of-function gives BDC, while biallelic loss gives the far more severe
  Grebe type chondrodysplasia and Du Pan syndrome — and distinct GDF5 alleles
  that impair ligand processing or receptor affinity instead produce brachydactyly
  type A2 or A1.

genetic:
- name: GDF5 Loss-of-Function Variants
  gene_term:
    preferred_term: GDF5
    term:
      id: hgnc:4220
      label: GDF5
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Heterozygous frameshift, nonsense, and active-domain missense variants in
    GDF5 (CDMP1) on chromosome 20. BDC is locus homogeneous. The same gene in
    the biallelic state gives Grebe type chondrodysplasia and Du Pan syndrome,
    and distinct heterozygous alleles that impair precursor processing or
    receptor affinity give brachydactyly type A2 — so the allele, not the gene,
    determines the phenotype.
  evidence:
  - reference: PMID:12357473
    reference_title: The mutational spectrum of brachydactyly type C.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we show that BDC is locus homogeneous by reporting a GDF5 frameshift mutation segregating with the phenotype in a family whose trait was initially thought to map to human chromosome 12."
    explanation: Resolves the apparent second locus and establishes locus homogeneity.
  - reference: PMID:33872773
    reference_title: "A GDF5 frameshift mutation segregating with Grebe type chondrodysplasia and brachydactyly type C+ in a 6 generations family: Clinical report and mini review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Different mutations in the Growth/Differentiation Factor 5 gene (GDF5) have been associated with varying types of skeletal dysplasia, including Grebe type chondrodysplasia (GTC), Hunter-Thompson syndrome, Du Pan Syndrome and Brachydactyly type C (BDC)."
    explanation: Places BDC within the wider GDF5 allelic series.
  - reference: PMID:33872773
    reference_title: "A GDF5 frameshift mutation segregating with Grebe type chondrodysplasia and brachydactyly type C+ in a 6 generations family: Clinical report and mini review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Heterozygous pathogenic mutations exert milder effects, whereas homozygous mutations are known to manifest more severe phenotypes."
    explanation: States the dosage relationship between BDC and the recessive GDF5 chondrodysplasias.
diagnosis:
- name: Clinical-radiographic and molecular diagnosis
  description: >-
    Hand radiographs show brachymesophalangy of rays II, III, and V with
    hyperphalangy of rays II and III, a short first metacarpal, and a ring finger
    that is the longest digit. GDF5 sequencing confirms. Non-penetrant carriers
    are documented, so a negative family history and a negative examination in a
    parent do not exclude transmission.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  results: >-
    Brachymesophalangy with hyperphalangy on hand radiographs and a heterozygous
    loss-of-function GDF5 variant.
  evidence:
  - reference: PMID:18554391
    reference_title: Brachydactyly.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The ring finger is always the longest, longer than the index"
    explanation: Gives the radiographic sign that discriminates BDC at the bedside.
  - reference: PMID:12357473
    reference_title: The mutational spectrum of brachydactyly type C.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "show nonpenetrance in a mutation carrier"
    explanation: Documented non-penetrance is why a normal parental examination does not exclude carriage.
treatments:
- name: Genetic Counseling
  description: >-
    Counseling for autosomal dominant transmission with incomplete penetrance
    and wide expressivity, and — where both partners carry a GDF5 variant — for
    the severe biallelic phenotypes at the other end of the allelic series.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:18554391
    reference_title: Brachydactyly.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The nature of genetic counseling depends both on the pattern of inheritance of the type of brachydactyly present in the family and on the presence or absence of accompanying symptoms."
    explanation: Supports inheritance- and phenotype-specific counseling.
  - reference: PMID:33872773
    reference_title: "A GDF5 frameshift mutation segregating with Grebe type chondrodysplasia and brachydactyly type C+ in a 6 generations family: Clinical report and mini review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this study, we report a GDF5 frameshift mutation (c.404delC) segregating over six generations in an extended consanguineous Pakistani family."
    explanation: >-
      A consanguineous kindred in which the same allele produced both BDC and
      Grebe chondrodysplasia is the counseling scenario this covers.
- name: Function- or Cosmesis-Directed Hand Surgery
  description: >-
    Surgery is reserved for meaningful impairment of hand function or selected
    cosmetic indications and is usually unnecessary.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  evidence:
  - reference: PMID:18554391
    reference_title: Brachydactyly.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Plastic surgery is only indicated if the brachydactyly affects hand function or for cosmetic reasons, but is typically not needed."
    explanation: Defines the limited surgical indications in isolated brachydactyly.
- name: Hand Function Rehabilitation
  description: >-
    Physical and occupational therapy where digital shortening limits function.
  therapeutic_modality: BEHAVIORAL
  treatment_term:

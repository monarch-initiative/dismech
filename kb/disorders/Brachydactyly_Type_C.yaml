inheritance:
- name: Autosomal Dominant with Incomplete Penetrance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Autosomal dominant with demonstrated non-penetrance in mutation carriers and
    marked intra- and interfamilial variability. Rare families with an affected
    sibling pair born to unaffected consanguineous parents raised the possibility
    of a recessive form, and a semidominant pattern has been described in a
    consanguineous kindred in which homozygotes were more severely affected than
    heterozygotes.
  evidence:
  - reference: PMID:12357473
    reference_title: The mutational spectrum of brachydactyly type C.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We also describe heterozygous mutations in nine additional probands/families with BDC and show nonpenetrance in a mutation carrier."
    explanation: Documents both dominant transmission and non-penetrance within the same series.
  - reference: PMID:33872773
    reference_title: "A GDF5 frameshift mutation segregating with Grebe type chondrodysplasia and brachydactyly type C+ in a 6 generations family: Clinical report and mini review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "with severe GTC associated with homozygosity, and with a wide phenotypic variability among heterozygous carriers, ranging from unaffected non-penetrant carriers, to classical BDC and to novel unclassified types of brachydactylies"
    explanation: A six-generation family shows the dosage effect and the full range of heterozygous expressivity.
classifications:
  isds_skeletal_category:
  - classification_value: brachydactyly_without_extraskeletal_manifestations
    notes: >-
      ISDS Nosology of Genetic Skeletal Disorders, 2023 revision (Unger et al.,
      PMID:36779427), group 18 "Brachydactylies (isolated)", which lists
      brachydactyly type C (GDF5; OMIM 113100). The biallelic GDF5 disorders —
      Grebe type chondrodysplasia, Hunter-Thompson and Du Pan syndrome — are
      acromesomelic dysplasias and belong to group 16, so the group follows the
      entity rather than the gene. The 2019 revision (PMID:31633310) placed type
      C in group 37 "Brachydactylies (without extraskeletal manifestations)".
      Per-row re-verification against the 2023 Table 1 is tracked in
      monarch-initiative/dismech#7867.

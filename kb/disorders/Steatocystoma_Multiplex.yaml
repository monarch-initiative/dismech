inheritance:
- name: Autosomal Dominant
  description: >-
    Familial SM segregates as an autosomal dominant trait with heterozygous
    KRT17 missense variants, as in a four-generation Chinese pedigree with
    p.Arg94Cys in all ten affected members. Expressivity varies within and
    between families, and the same variant can give SM in one kindred and
    pachyonychia congenita in another.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:26165312
    reference_title: "Steatocystoma multiplex is associated with the R94C mutation in the KRTl7 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genealogical investigations demonstrated an autosomal dominant pattern, and direct sequencing of the PCR product revealed a heterozygous mutation, c.280C/T (R94C), which was located in exon 1 of the KRT17 gene in all 10 affected family members."
    explanation: Dominant segregation of a heterozygous KRT17 variant through a four-generation SM pedigree.
  - reference: PMID:9008238
    reference_title: "Missense mutations in keratin 17 cause either pachyonychia congenita type 2 or a phenotype resembling steatocystoma multiplex."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All the K17 mutations reported here were shown to co-segregate with the disease in the pedigrees analyzed"
    explanation: Heterozygous KRT17 variants co-segregate with SM in the two SM families of the founding report.
  - reference: PMID:35676340
    reference_title: "KERATIN 17-related recessive atypical pachyonychia congenita with variable hair and tooth anomalies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Heterozygous variants in KRT17 cause PC2 (PC-K17) with main characteristics of pachyonychia, subungual keratosis, palmoplantar keratoderma, hyperhidrosis, oral leukokeratosis and epidermal cysts, or steatocystoma multiplex, both with dominant inheritance."
    explanation: Background statement of dominant inheritance for heterozygous KRT17 SM.
- name: Sporadic
  description: >-
    Most reported cases have no affected relative, and in many no KRT17
    variant is found; the cause of these cases is not known.
  inheritance_term:
    preferred_term: Sporadic
    term:
      id: HP:0003745
      label: Sporadic
  evidence:
  - reference: PMID:11990250
    reference_title: "Clinical and histologic features of 64 cases of steatocystoma multiplex."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most of the cases were sporadic, with an average onset age of 26 years"
    explanation: Sporadic occurrence predominates in a 64-patient clinicopathological series.
  - reference: PMID:42518883
    reference_title: "Epidemiological Features and Pathogenic Mechanisms of Steatocystoma Multiplex: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Genotype-phenotype discordance and KRT17-negative cases suggest that modifier genes and hormonal factors contribute to phenotypic determination."
    explanation: Pooled case review records KRT17-negative cases alongside the familial KRT17 form.
prevalence:
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: RARE
  notes: >-
    No population-based estimate was found. The disease is described as rare,
    with 145 individually reported cases from 82 publications between 2003 and
    2023 and no clear geographic or ethnic predilection.
  evidence:
  - reference: PMID:42518883
    reference_title: "Epidemiological Features and Pathogenic Mechanisms of Steatocystoma Multiplex: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "A total of 145 cases from 82 publications were included. SM showed no clear geographical or ethnic predilection."
    explanation: Only a case-count basis for rarity exists; no prevalence rate is reported.
mechanistic_hypotheses:
- hypothesis_group_id: ductal_keratinous_plug_model
  hypothesis_label: Sebaceous duct keratinous plug and sebum retention
  status: EMERGING
  description: >-
    Abnormal keratinization of the sebaceous duct lining, attributed in
    familial cases to mutant keratin 17, plugs the duct so that sebum
    accumulates and the duct dilates into a cyst. This is the explanation most
    often given in reviews, but it has not been tested experimentally.
  evidence:
  - reference: PMID:42518883
    reference_title: "Epidemiological Features and Pathogenic Mechanisms of Steatocystoma Multiplex: A Systematic Review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The initial pathogenic event is thought to involve keratinous plug formation within the sebaceous duct, resulting in progressive sebum accumulation and cystic dilatation."
    explanation: Review statement of the retention model, framed as a hypothesis.
  - reference: PMID:28480085
    reference_title: "A Tale of Two Cysts: Steatocystoma Multiplex and Eruptive Vellus Hair Cysts-Two Case Reports and a Review of the Literature."
    supports: REFUTE
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Notably, the lesions seen in SM are bona fide tumors, rather than retention cysts caused by blockage of a sebaceous gland"
    explanation: Competing view that steatocystomas are hamartomatous growths rather than retention cysts.
- hypothesis_group_id: pilosebaceous_hamartoma_model
  hypothesis_label: Hamartomatous malformation of the pilosebaceous duct
  status: EMERGING
  description: >-
    Steatocystomas are hamartomas of the pilosebaceous duct, on a spectrum with
    eruptive vellus hair cysts, rather than retention cysts. The argument rests
    on histology (vellus hairs, follicles and smooth muscle in or near the cyst
    wall, hybrid lesions with eruptive vellus hair cysts).
  evidence:
  - reference: PMID:11990250
    reference_title: "Clinical and histologic features of 64 cases of steatocystoma multiplex."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The results of this study add further evidence to the hypothesis that SM is a hamartomatous condition and that SM and EVHC are variants of one disorder which originates in the pilosebaceous duct."
    explanation: Histological series interpreted as supporting a hamartoma origin.
  - reference: PMID:9185910
    reference_title: "Expression of keratins (K10 and K17) in steatocystoma multiplex, eruptive vellus hair cysts, and epidermoid and trichilemmal cysts."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings support the opinion that eruptive vellus hair cysts, which stained negative for K10, and steatocystoma multiplex are distinct entities and not variants of one disorder."
    explanation: Keratin expression differs between SM and eruptive vellus hair cysts, against the single-disorder part of the hamartoma model.
- hypothesis_group_id: krt17_sfn_bad_apoptosis_suppression
  hypothesis_label: KRT17 p.Arg94Cys suppresses apoptosis of the cyst wall via SFN-BAD sequestration
  status: EMERGING
  description: >-
    The recurrent KRT17 p.Arg94Cys variant binds 14-3-3 sigma (SFN) more tightly
    and favours a KRT17/SFN/BAD complex that may sequester pro-apoptotic BAD, so
    cyst wall cells persist rather than turn over. Based on modelling and
    immunoprecipitation in HeLa cells plus TUNEL staining of patient cysts; not
    replicated.
  evidence:
  - reference: PMID:42376483
    reference_title: "Genetic mutations in Chinese patients with steatocystoma multiplex and mechanistic investigation of KRT17 p.Arg94Cys."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Immunoprecipitation in KRT17-knockout HeLa cells confirmed significantly enhanced KRT17–SFN interaction in p.Arg94Cys versus wild-type cells"
    explanation: Cell-based evidence for the altered KRT17-SFN interaction underlying the model.
pathophysiology:
- name: Heterozygous KRT17 Helix Initiation Motif Missense Variant
  conforms_to: "keratin_intermediate_filament_fragility#Dominant-Negative Keratin Variant in a Filament Assembly Domain"
  biological_scale: MOLECULAR
  description: >-
    Familial SM is caused by heterozygous KRT17 missense variants, most at the
    start of the 1A helix of the rod domain (p.Asn92His, p.Arg94His,
    p.Arg94Cys, p.Arg94Gly) and a few in the head domain (p.Ser24Leu,
    p.Gly34Ser). The helix initiation motif is the assembly-critical region in
    which pachyonychia congenita keratin variants act dominant-negatively; the
    identical p.Arg94Cys and p.Asn92Ser changes are reported in both SM and
    PC-K17 families, so genotype alone does not predict which phenotype
    results.
  genes:
  - preferred_term: KRT17
    term:
      id: hgnc:6427
      label: KRT17
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: DOMINANT_NEGATIVE
  molecular_functions:
  - preferred_term: structural constituent of cytoskeleton
    term:
      id: GO:0005200
      label: structural constituent of cytoskeleton
    modifier: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:26165312
    reference_title: "Steatocystoma multiplex is associated with the R94C mutation in the KRTl7 gene."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    directness: INDIRECT
    snippet: "Mutations in this location are considered to have a significant effect on the assembly and/or integrity of the keratin cytoskeleton in cells"
    explanation: >-
      Background statement that 1A-helix KRT17 variants compromise the keratin
      cytoskeleton, the structural role lost by the mutant protein; no direct
      functional assay of SM alleles is reported.
  - reference: PMID:9008238
    reference_title: "Missense mutations in keratin 17 cause either pachyonychia congenita type 2 or a phenotype resembling steatocystoma multiplex."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We also show heterozygous missense mutations in K17 (N92H and R94H) in two families diagnosed as steatocystoma multiplex."
    explanation: Founding identification of heterozygous KRT17 1A-domain missense variants in SM families.
  - reference: PMID:9767294
    reference_title: "Keratin 17 mutations cause either steatocystoma multiplex or pachyonychia congenita type 2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two of these families have identical missense mutations (R94C) in the 1A domain of K17. However, while affected members of one kindred have the classical features of PC-2, affected persons in the other family have the steatocystoma multiplex phenotype."
    explanation: The same 1A-domain variant gives SM in one kindred and PC-2 in another.
  - reference: PMID:24371407
    reference_title: "A novel missense mutation of keratin 17 gene in a chinese family with steatocystoma multiplex."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The sequencing analysis showed a missense mutation of c.71C>T in the V1 domain of KRT17 gene in the proband and his father."
    explanation: A head-domain (V1) KRT17 variant outside the 1A hotspot in an SM family.
  - reference: PMID:19609311
    reference_title: "Keratin K6c mutations cause focal palmoplantar keratoderma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    directness: INDIRECT
    snippet: "Dominant-negative mutations in any of the four identified keratin genes, KRT6A, KRT6B, KRT16, or KRT17, cause pachyonychia congenita (PC), characterized by hypertrophic nail dystrophy and other ectodermal features."
    explanation: >-
      States the dominant-negative mechanism for KRT17 in pachyonychia
      congenita; applied to SM because the same KRT17 alleles cause both
      phenotypes. No SM-specific functional study of the dominant-negative
      effect was found.
  downstream:
  - target: Keratin 17 Filament Network Disruption in the Pilosebaceous Unit
    causal_link_type: DIRECT
    description: >-
      Mutant keratin 17 is incorporated with the wild-type protein and distorts
      the 1A helix that mediates filament assembly.

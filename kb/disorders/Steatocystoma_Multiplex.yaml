notes: >-
  No GeneReviews chapter covers this disease; the StatPearls chapter is cited
  for orientation only. Pachyonychia congenita (PC-K17) is curated as a
  separate entry: it shares the gene and alleles, but its nail, palmoplantar
  and dental phenotype defines a different clinical entity.

      explanation: Cell-based and modelling evidence for the variant-to-BAD link; the effect on apoptosis is inferred.
- name: Keratin 17 Filament Network Disruption in the Pilosebaceous Unit
  biological_scale: CELLULAR
  description: >-
    Keratin 17 is expressed in the nail bed, hair follicle outer root sheath,
    sebaceous gland and other epidermal appendages, which is where KRT17
    disease appears. Disruption of its filament network is inferred from the
    position of the variants and from pachyonychia congenita; it has not been
    shown directly in SM tissue or cells.

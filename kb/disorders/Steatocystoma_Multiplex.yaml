  biological_scale: TISSUE
  description: >-
    Cysts rupture, become inflamed and painful, may be secondarily infected
    with abscess formation and malodorous discharge, and heal with scarring.
    This suppurative form (steatocystoma multiplex suppurativa) can mimic
    hidradenitis suppurativa or acne conglobata, and the two diseases sometimes
    coexist. Infected lesions are more common in familial cases.

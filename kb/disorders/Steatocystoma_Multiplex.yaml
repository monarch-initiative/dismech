phenotypes:
- category: Dermatologic
  name: Multiple Steatocystomas
  frequency: VERY_FREQUENT
  description: >-
    Multiple soft to firm, skin-coloured to yellowish dermal cysts, usually 2-20
    mm, that discharge oily or creamy fluid on puncture. They involve the chest,
    axillae, upper arms, neck and face most often, with groin, scalp, scrotal,
    acral and whole-body involvement in some patients. Defining feature of the
    disease.
  phenotype_term:
    preferred_term: Steatocystoma multiplex
    term:
      id: HP:0012035
      label: Steatocystoma multiplex
    onset:
      onset_category: YOUNG_ADULT
      notes: >-
        Median onset 23 years in a pooled series of 145 cases (range 1 to 81.5
        years), and 13.5 years in familial cases; onset is usually around or
        after puberty.
  evidence:
  - reference: PMID:42518883
    reference_title: "Epidemiological Features and Pathogenic Mechanisms of Steatocystoma Multiplex: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "clinically characterized by multiple asymptomatic sebum-containing cysts predominantly distributed on the chest, axillae, and upper arms."
    explanation: Defining lesion and its distribution.
  - reference: PMID:42518883
    reference_title: "Epidemiological Features and Pathogenic Mechanisms of Steatocystoma Multiplex: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Familial cases (26.2%) had a significantly earlier age at onset (13.5 vs. 30.0 years, P < 0.001)"
    explanation: Onset age by familial status in the pooled series.
  - reference: PMID:11990250

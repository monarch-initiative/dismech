    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most of the cases were sporadic, with an average onset age of 26 years and distribution on the arms, chest, axillae, and neck."
    explanation: Onset and distribution in a 64-patient series.
  - reference: PMID:26165312

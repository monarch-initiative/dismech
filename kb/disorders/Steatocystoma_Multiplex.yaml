genetic:
- name: KRT17
  gene_term:
    preferred_term: KRT17
    term:
      id: hgnc:6427
      label: KRT17
  association: Causative
  relationship_type: CAUSATIVE
  notes: >-
    Reported heterozygous missense variants in SM families include
    p.Asn92His, p.Arg94His, p.Arg94Cys (recurrent, including Chinese
    families), p.Arg94Gly, p.Ser24Leu and p.Gly34Ser; p.Arg94 is the most
    frequently mutated site. p.Arg94Cys and p.Asn92Ser have also been reported
    in pachyonychia congenita (PC-K17) families. Most sporadic cases have no
    reported KRT17 variant. Homozygous p.Arg94His causes a separate recessive
    atypical pachyonychia congenita with hair and tooth anomalies, in which
    most heterozygous relatives are unaffected; that phenotype is not part of
    this entry. No ClinGen gene-disease validity record for KRT17
    and this disease was found in the local cache.
  evidence:
  - reference: PMID:9008238
    reference_title: "Missense mutations in keratin 17 cause either pachyonychia congenita type 2 or a phenotype resembling steatocystoma multiplex."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We also show heterozygous missense mutations in K17 (N92H and R94H) in two families diagnosed as steatocystoma multiplex."
    explanation: Gene discovery for SM.
  - reference: PMID:9767294
    reference_title: "Keratin 17 mutations cause either steatocystoma multiplex or pachyonychia congenita type 2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These results demonstrate that K17 mutations commonly underlie both PC-2 and steatocystoma multiplex"
    explanation: Replication in further kindreds and allelism with PC-2.
  - reference: PMID:11809119
    reference_title: "[Keratin 17 gene mutation in patients with steatocystoma multiplex]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The R94C mutation in keratin 17 gene is one of the genetic bases of SCM in Chinese."
    explanation: p.Arg94Cys in a large Chinese SM family.
  - reference: PMID:42518883
    reference_title: "Epidemiological Features and Pathogenic Mechanisms of Steatocystoma Multiplex: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "KRT17 was the most frequently mutated gene, with Arg94 as the predominant mutation site."
    explanation: Pooled variant spectrum.
  - reference: PMID:35676340
    reference_title: "KERATIN 17-related recessive atypical pachyonychia congenita with variable hair and tooth anomalies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The causative variant has been reported in heterozygous state in a family afflicted with severe steatocystoma multiplex and in a sporadic PC2 case, and thus we also define a third phenotype related to the variant."
    explanation: Heterozygous p.Arg94His causes SM; homozygosity for the same allele causes a distinct recessive atypical pachyonychia congenita that is not part of this entry.

name: Steatocystoma Multiplex
creation_date: "2026-10-23T17:31:43Z"
category: Mendelian
synonyms:
- sebocystomatosis
- steatocystoma multiplex
- steatocystomatosis
- multiple steatocystoma
description: >-
  Steatocystoma multiplex (SM) is a benign disorder of the pilosebaceous unit in
  which multiple dermal cysts develop, mostly on the chest, axillae, upper arms,
  neck, face and groin. The cysts are a few millimetres to about two centimetres
  across, skin-coloured to yellowish, and discharge an oily, sebum-like fluid
  when punctured. Histologically each cyst is lined by thin stratified squamous
  epithelium without a granular layer, with a corrugated eosinophilic cuticle
  and flattened sebaceous lobules in or beside the wall. Onset is usually around
  or after puberty; in a pooled literature series of 145 cases the median age at
  onset was 23 years, and earlier in familial cases. About a quarter of reported
  cases are familial, with autosomal dominant transmission of heterozygous
  missense variants in KRT17, mostly in the helix initiation motif of the 1A rod
  domain (codons 92-94). The same KRT17 variant can cause pachyonychia
  congenita (PC-K17, formerly PC type 2) in other families, and mild nail
  changes occur in some SM families, so the two are allelic. Most cases are
  sporadic, and many have no KRT17 variant. Lesions can rupture and become
  inflamed, painful or infected and heal with scarring (steatocystoma multiplex
  suppurativa), and SM sometimes coexists with hidradenitis suppurativa. The
  condition is otherwise asymptomatic and the burden is chiefly cosmetic and
  psychosocial; no treatment prevents new cysts.

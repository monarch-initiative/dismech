diagnosis:
- name: Skin biopsy and histopathology
  description: >-
    Histology confirms the diagnosis: a cyst lined by stratified squamous
    epithelium without a granular layer, with a corrugated eosinophilic
    cuticle and sebaceous lobules in the wall. This separates SM from
    epidermoid cysts, trichilemmal cysts and eruptive vellus hair cysts.
  diagnosis_term:
    preferred_term: skin biopsy
    term:
      id: NCIT:C51692
      label: Skin Biopsy
  evidence:
  - reference: PMID:11990250
    reference_title: "Clinical and histologic features of 64 cases of steatocystoma multiplex."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All cases exhibited eosinophilic cuticle and lack of granular layer"
    explanation: Consistent histological hallmarks in a 64-patient series.
  - reference: PMID:31353757
    reference_title: "Coexistence of steatocystoma multiplex and hidradenitis suppurativa: Assessment of this unique association by means of ultrasonography and Color Doppler."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although histology remains the gold standard for the diagnosis of SM, ultrasonography can be an useful diagnostic tool."
    explanation: Histology is the reference standard.
- name: Ultrasonography with color Doppler
  description: >-
    SM cysts appear as hypoechoic dermal nodules with well-defined
    hyperechoic borders and posterior acoustic enhancement and no Doppler
    signal, which separates them from the vascularized inflammatory lesions of
    hidradenitis suppurativa.
  diagnosis_term:
    preferred_term: ultrasound imaging
    term:
      id: NCIT:C17230
      label: Ultrasound Imaging
  evidence:
  - reference: PMID:31353757
    reference_title: "Coexistence of steatocystoma multiplex and hidradenitis suppurativa: Assessment of this unique association by means of ultrasonography and Color Doppler."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SM lesions appeared on ultrasonography as hypoechoic nodules with well-defined hyperechoic borders and posterior acoustic enhancement, in the absence of Color Doppler signal."
    explanation: Sonographic appearance of SM cysts.
- name: KRT17 sequencing
  description: >-
    Sequencing of KRT17, particularly exon 1 containing the 1A helix
    initiation motif, identifies the familial form; a negative result does not
    exclude SM. In a Chinese cohort of nine patients, seven with a paternal
    family history, exome sequencing found a known KRT17 variant in two; the
    other seven carried only variants of uncertain significance in other
    genes.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:42376483
    reference_title: "Genetic mutations in Chinese patients with steatocystoma multiplex and mechanistic investigation of KRT17 p.Arg94Cys."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cases 1-7 had a paternal family history."
    explanation: Most of the tested cohort was familial.
  - reference: PMID:42376483
    reference_title: "Genetic mutations in Chinese patients with steatocystoma multiplex and mechanistic investigation of KRT17 p.Arg94Cys."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic testing identified 2 known KRT17 variants: c.280C>T (p.Arg94Cys, Supplementary Fig 2, available via Mendeley at https://data.mendeley.com/datasets/74x5fgxmss/1) in Case 1 and c.100G>A (p.Gly34Ser) in Case 2. WES additionally identified variants in KRT2, GJB2, MVD/CYP27A1, and GNPTAB (Cases 3-9)"
    explanation: KRT17 testing was positive in two of nine patients; the remaining findings are unvalidated variants in other genes.
differential_diagnoses:
- name: Pachyonychia congenita
  description: >-
    Allelic disorder. KRT17 pachyonychia congenita (PC-K17, formerly PC type
    2) includes pilosebaceous cysts and steatocystomas together with
    hypertrophic nail dystrophy, focal palmoplantar keratoderma and natal
    teeth, and the same KRT17 variant can cause either phenotype.
  distinguishing_features:
  - Hypertrophic nail dystrophy, palmoplantar keratoderma and plantar pain favour pachyonychia congenita.
  - Natal teeth are strongly associated with KRT17 pachyonychia congenita.
  disease_term:
    preferred_term: pachyonychia congenita
    term:
      id: MONDO:0016471
      label: pachyonychia congenita
  evidence:
  - reference: PMID:9767294
    reference_title: "Keratin 17 mutations cause either steatocystoma multiplex or pachyonychia congenita type 2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pachyonychia congenita type 2 (PC-2; Jackson-Lawler syndrome) is an autosomal dominant disorder characterized by hypertrophic nail dystrophy, mild focal keratoderma, multiple pilosebaceous cysts and other features of ectodermal dysplasia."
    explanation: PC-2 shares pilosebaceous cysts with SM but adds nail and palmoplantar features.
  - reference: PMID:22264670
    reference_title: "A review of the clinical phenotype of 254 patients with genetically confirmed pachyonychia congenita."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a strong association of natal teeth and cysts in carriers of a KRT17 mutation"
    explanation: Cysts and natal teeth cluster with KRT17 variants in pachyonychia congenita.
- name: Steatocystoma multiplex-natal teeth syndrome
  description: >-
    Generalized steatocystomas with natal teeth, a combination that overlaps
    with KRT17 pachyonychia congenita and has been reported with KRT17
    variants.
  distinguishing_features:
  - Natal teeth.
  disease_term:
    preferred_term: steatocystoma multiplex-natal teeth syndrome
    term:
      id: MONDO:0008486
      label: steatocystoma multiplex-natal teeth syndrome
  evidence:
  - reference: PMID:16620218
    reference_title: "Keratin 17 mutation in pachyonychia congenita type 2 patient with early onset steatocystoma multiplex and Hutchinson-like tooth deformity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "phenotype included early onset steatocystoma multiplex and Hutchinson-like tooth deformities along with other typical features of PC-2 such as hypertrophic nails, natal teeth and follicular hyperkeratosis."
    explanation: Steatocystomas with natal teeth in a KRT17 (p.Met88Thr) patient.
- name: Eruptive vellus hair cysts
  description: >-
    Small dome-shaped papules of the trunk and limbs with similar onset and
    distribution; hybrid lesions and coexistence with SM are reported.
  distinguishing_features:
  - Cyst lining has a granular layer and laminated keratin with many vellus hairs in the lumen.
  - Cyst wall expresses keratin 17 but not keratin 10, whereas SM expresses both.
  evidence:
  - reference: PMID:9185910
    reference_title: "Expression of keratins (K10 and K17) in steatocystoma multiplex, eruptive vellus hair cysts, and epidermoid and trichilemmal cysts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Epidermoid cysts expressed K10 and eruptive vellus hair cysts expressed K17, whereas trichilemmal cysts and steatocystoma multiplex showed expression of both K10 and K17."
    explanation: Keratin expression separates the cyst types.
  - reference: PMID:21958358
    reference_title: "Eruptive vellus hair cysts: a systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "the histologic features of EVHC papules are rather monomorphous, indeed, the diagnostic hallmark being the presence of vellus hair shafts within the cystic space."
    explanation: Vellus hairs in the lumen are the histological hallmark of eruptive vellus hair cysts.
  - reference: PMID:28480085
    reference_title: "A Tale of Two Cysts: Steatocystoma Multiplex and Eruptive Vellus Hair Cysts-Two Case Reports and a Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "EVHCs originate from the isthmus or infundibulum of the pilosebaceous unit and thus are often lined by squamous epithelium containing a granular layer, in contrast to SM."
    explanation: The granular layer separates eruptive vellus hair cysts from SM on histology.
- name: Epidermoid cysts
  description: Common keratin-filled cysts that can be multiple and mimic SM clinically.
  distinguishing_features:
  - Cyst wall expresses keratin 10 rather than keratin 17 and lacks sebaceous lobules.
  disease_term:
    preferred_term: epidermoid cysts
    term:
      id: MONDO:0007547
      label: epidermoid cysts
  evidence:
  - reference: PMID:9185910
    reference_title: "Expression of keratins (K10 and K17) in steatocystoma multiplex, eruptive vellus hair cysts, and epidermoid and trichilemmal cysts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Epidermoid cysts expressed K10 and eruptive vellus hair cysts expressed K17, whereas trichilemmal cysts and steatocystoma multiplex showed expression of both K10 and K17."
    explanation: Epidermoid cysts lack the keratin 17 expression seen in SM.
- name: Hidradenitis suppurativa
  description: >-
    Inflamed SM (steatocystoma multiplex suppurativa) mimics hidradenitis
    suppurativa in the axillae and groin, and the two diseases also coexist,
    particularly in women.
  distinguishing_features:
  - Fistulas, abscesses and pseudocystic nodules with Doppler signal favour hidradenitis suppurativa; true sebum-filled cysts without Doppler signal favour SM.
  disease_term:
    preferred_term: hidradenitis suppurativa
    term:
      id: MONDO:0006559
      label: hidradenitis suppurativa
  evidence:
  - reference: PMID:31353757
    reference_title: "Coexistence of steatocystoma multiplex and hidradenitis suppurativa: Assessment of this unique association by means of ultrasonography and Color Doppler."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The combination of ultrasonography and Color Doppler proved to be a reliable instrument for differentiating between SM and HS lesions, particularly distinguishing HS pseudocystic nodules from true cysts of SM."
    explanation: Imaging separates the two lesion types.
  - reference: PMID:42518883
    reference_title: "Epidemiological Features and Pathogenic Mechanisms of Steatocystoma Multiplex: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Hidradenitis suppurativa was more prevalent in females (12.5% vs. 1.5%, P = 0.019)"
    explanation: Coexisting hidradenitis suppurativa in pooled SM cases.
references:

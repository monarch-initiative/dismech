  description: >-
    TUNEL staining of SM cyst walls showed very little apoptosis (0.01-0.09%)
    compared with lipoma controls, with low Ki-67 labelling, suggesting that
    cysts persist because cyst wall cells fail to turn over rather than
    because they proliferate. Reported in one small Chinese cohort.

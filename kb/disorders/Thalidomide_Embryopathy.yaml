    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: REVIEW_SYNTHESIS
    snippet: "the theories presently widely supported are thalidomide's antiangiogenic actions"
    explanation: >-
      Records that antiangiogenesis is one of the currently supported mechanisms, as the
      review frames the field.
  downstream:
  - target: Disrupted Limb Bud Outgrowth and FGF8/SHH Signaling
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Loss of the limb-bud vasculature is proposed to starve the outgrowing limb and
      precede the signaling-center failure.
    evidence:

name: Thalidomide Embryopathy
creation_date: '2026-11-20T00:00:00Z'
description: >-
  Thalidomide embryopathy is the pattern of limb, ear, eye, cardiac and visceral
  malformation that follows exposure to the sedative thalidomide between about 20
  and 36 days after fertilization. Maternal thalidomide intake during that narrow
  critical window is the sole necessary cause, and a single therapeutic tablet
  taken in it is reported to be sufficient to cause defects in up to half of
  exposed pregnancies. The entry models the modern molecular account alongside the
  older vascular one rather than ranking them: thalidomide binds cereblon (CRBN),
  the substrate receptor of a CRL4 E3 ubiquitin ligase, and reprograms it to
  degrade developmental transcription factors, chief among them SALL4, whose
  heterozygous loss of function phenocopies the limb, ear, eye and heart defects of
  the syndrome; in parallel the drug and its breakdown products have an
  antiangiogenic action on the nascent embryonic vasculature. The condition is the
  historical origin of modern teratology and of mandatory pre-market developmental
  toxicity testing, and it is the textbook case of a human teratogen whose effect
  is not reproduced in mice — because the cereblon-dependent degradation of SALL4
  occurs in humans, primates and rabbits but not in rodents or fish.
category: Environmental
parents:
- Teratogenic disorder
synonyms:
- fetal thalidomide syndrome
- thalidomide embryopathy syndrome
- thalidomide-induced birth defect
- thalidomide syndrome

differential_diagnoses:
- name: Duane-radial ray syndrome
  disease_term:
    preferred_term: Duane-radial ray syndrome (Okihiro syndrome)
    term:
      id: MONDO:0011812
      label: Duane-radial ray syndrome
  description: >-
    The clinically load-bearing differential, and the mechanistic mirror of this entry:
    Duane-radial ray syndrome (Okihiro syndrome) is caused by heterozygous loss-of-function
    SALL4 mutations — the same transcription factor thalidomide degrades — so it reproduces
    the radial-ray, Duane-anomaly and ear/eye features and has been misdiagnosed as
    thalidomide embryopathy. A thalidomide exposure history is what separates them.
  distinguishing_features:
  - >-
      Duane-radial ray syndrome is autosomal dominant with a SALL4 variant and a family
      history; thalidomide embryopathy has no heritable cause and requires a first-trimester
      thalidomide exposure. The phenotypic overlap is otherwise near-complete, which is the
      point: pharmacological SALL4 depletion phenocopies the genetic loss.
  evidence:
  - reference: PMID:30067223
    reference_title: "Thalidomide promotes degradation of SALL4, a transcription factor implicated in Duane Radial Ray syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "this phenotypic resemblance has led to misdiagnosis of patients with SALL4 mutations as cases of thalidomide embryopathy"
    explanation: States directly that the SALL4 syndromes are misdiagnosed as thalidomide embryopathy.
  - reference: PMID:30067223
    reference_title: "Thalidomide promotes degradation of SALL4, a transcription factor implicated in Duane Radial Ray syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "familial loss of function (LOF) mutations in SALL4 are causatively linked to the clinical syndromes, Duane Radial Ray syndrome (DRRS) also known as Okihiro syndrome"
    explanation: Identifies the SALL4 aetiology of Duane-radial ray / Okihiro syndrome, the shared mechanism.
- name: Holt-Oram syndrome
  disease_term:
    preferred_term: Holt-Oram syndrome
    term:
      id: MONDO:0007732
      label: Holt-Oram syndrome
  description: >-
    A heart-hand syndrome with upper-limb (radial ray) defects and congenital heart disease,
    mutated in some patients in SALL4 and sharing the TBX5-SALL4 axis, which overlaps the
    limb-and-heart picture of thalidomide embryopathy and has been confused with it.
  distinguishing_features:
  - >-
      Holt-Oram syndrome is a dominant TBX5 (occasionally SALL4) disorder whose cardinal
      combination is radial-ray limb defects with cardiac septal defects, without the ear,
      eye and renal spectrum of thalidomide embryopathy, and without an exposure history.
  evidence:
  - reference: PMID:26043938
    reference_title: "Thalidomide-induced teratogenesis: history and mechanisms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "both Okihiro Syndrome, characterized by limb reduction anomalies and Holt‐Oram Syndrome, typically presenting with heart and limb reduction deficiencies, can vary in severity and have been confused with thalidomide embryopathy"
    explanation: Names Okihiro and Holt-Oram syndromes as conditions confused with thalidomide embryopathy.
  - reference: PMID:30067223
    reference_title: "Thalidomide promotes degradation of SALL4, a transcription factor implicated in Duane Radial Ray syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "familial loss of function (LOF) mutations in SALL4 are causatively linked to the clinical syndromes, Duane Radial Ray syndrome (DRRS) also known as Okihiro syndrome, and mutated in some patients with Holt-Oram syndrome (HOS)"
    explanation: >-
      Grounds the SALL4 involvement in Holt-Oram syndrome named in the description, the shared
      transcription factor that makes this a mechanistically relevant differential.
- name: Roberts syndrome
  disease_term:
    preferred_term: Roberts syndrome (pseudothalidomide syndrome)
    term:
      id: MONDO:0100253
      label: Roberts-SC phocomelia syndrome
  description: >-
    An ESCO2-related chromosomal-cohesion disorder whose four-limb phocomelia, facial and
    internal-organ damage so resembles thalidomide embryopathy that it is historically called
    pseudothalidomide syndrome. Its mechanism is unrelated to SALL4.
  distinguishing_features:
  - >-
      Roberts syndrome is autosomal recessive, caused by ESCO2 mutations affecting sister
      chromatid cohesion, with symmetrical tetraphocomelia and growth restriction; thalidomide
      embryopathy is asymmetric, upper-limb predominant, and exposure-defined.
  evidence:
  - reference: PMID:26043938
    reference_title: "Thalidomide-induced teratogenesis: history and mechanisms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "As has another much rarer condition, Roberts Syndrome, also known as pseudothalidomide syndrome, given its striking phocomelia to all four limbs, facial damage, and internal organ damage."
    explanation: Names Roberts syndrome (pseudothalidomide syndrome) as a phenocopy confused with thalidomide embryopathy.
experimental_models:
- name: ReproTracker hiPSC developmental-toxicity assay (thalidomide)
  experimental_model_type: IPSC_DERIVED_MODEL
  description: >-
    A human induced pluripotent stem cell (hiPSC) biomarker assay in which cells are
    differentiated toward cardiomyocytes, hepatocytes and neural rosettes while exposed to
    a compound, and lineage- and cell-specific marker genes (MYH6, AFP, PAX6, NESTIN) are
    quantified. It classifies thalidomide as a teratogen from the human cells directly,
    which is what the mouse cannot do. Used here with a pregnancy PBPK model to derive
    human-equivalent doses; only the in vitro biomarker arm is linked to the pathograph.
  publication: PMID:38029956
  genes:
  - preferred_term: MYH6
    term:
      id: hgnc:7576
      label: MYH6
  modeled_mechanisms:
  - target: Impaired Cardiac and Visceral Organ Differentiation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      The assay reproduces the cardiac and hepatic differentiation arm of the phenotype —
      thalidomide lowers the cardiomyocyte marker MYH6 and the hepatocyte marker AFP in a
      dose-dependent manner — in human cells that an animal assay would not flag. It does
      not model the defining limb lesion, and the neural lineage was spared (PAX6 rose and
      the neural-rosette marker NESTIN was unchanged), so it captures only part of the
      syndrome.
    limitations: >-
      A 2D hiPSC differentiation reads gene-expression biomarkers of cell differentiation,
      not organ morphogenesis; it contains no limb field, no apical ectodermal ridge, and
      no vasculature, so the hallmark phocomelia and the antiangiogenic branch are outside
      it. Marker direction stands in for malformation.
    divergences:
    - divergence_type: PROXY_QUANTITY
      materiality: QUALIFYING
      description: >-
        The model's quantity is the transcript abundance of lineage markers (MYH6 for
        cardiomyocytes, AFP for hepatocytes). The node's quantity is the malformation of the
        heart and viscera. Reduced marker expression stands in for impaired organ formation.
    - divergence_type: BOUNDARY_OMISSION
      materiality: QUALIFYING
      description: >-
        The defining phenotype of the disease — limb reduction (phocomelia) — is not in the
        model: the assay differentiates cardiomyocytes, hepatocytes and neural rosettes and
        has no limb bud, apical ectodermal ridge or FGF8/SHH readout. The link therefore
        speaks only to the cardiac and visceral arm.
    evidence:
    - reference: PMID:38029956
      reference_title: "Animal-free assessment of developmental toxicity: Combining PBPK modeling with the ReproTracker assay."
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: "decreased expression of cardiomyocyte-specific marker MYH6 in a dose-dependent manner"
      explanation: >-
        The dose-dependent loss of the cardiomyocyte marker that makes this human assay
        informative for the cardiac differentiation node.
    readouts:
    - name: Cardiomyocyte marker MYH6 expression
      target: Impaired Cardiac and Visceral Organ Differentiation
      direction: DECREASED
      interpretation: >-
        Loss of the cardiomyocyte-specific marker on directed differentiation, read as
        impaired cardiomyocyte formation.
      evidence:
      - reference: PMID:38029956
        reference_title: "Animal-free assessment of developmental toxicity: Combining PBPK modeling with the ReproTracker assay."
        supports: SUPPORT
        evidence_source: IN_VITRO
        quote_role: PRIMARY_RESULT
        directness: DIRECT
        snippet: "decreased expression of cardiomyocyte-specific marker MYH6 in a dose-dependent manner"
        explanation: Reports the cardiomyocyte-marker decrease in this model.
    - name: Hepatocyte marker AFP expression
      target: Impaired Cardiac and Visceral Organ Differentiation
      direction: DECREASED
      interpretation: >-
        Loss of the hepatocyte-specific marker with disrupted hepatocyte morphology, read as
        impaired hepatocyte differentiation.
      evidence:
      - reference: PMID:38029956
        reference_title: "Animal-free assessment of developmental toxicity: Combining PBPK modeling with the ReproTracker assay."
        supports: SUPPORT
        evidence_source: IN_VITRO
        quote_role: PRIMARY_RESULT
        directness: DIRECT
        snippet: "disruption of endoderm to hepatocyte differentiation, indicated by the reduced expression of the hepatocyte-specific marker AFP"
        explanation: Reports the hepatocyte-marker decrease in this model.
animal_models:
- name: Mouse thalidomide exposure
  species: Mouse
  description: >-
    Conventional mouse thalidomide-exposure models, which historically failed to
    reproduce human thalidomide teratogenicity and so reassured regulators that the drug
    was safe. The failure is now understood mechanistically: thalidomide-bound cereblon
    does not degrade SALL4 in rodents.
  modeled_mechanisms:
  - target: CRBN-Dependent Degradation of SALL4 and Developmental Transcription Factors
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      The mouse does not reproduce the disease-defining molecular lesion: thalidomide does
      not induce SALL4 degradation in rodents, so the limb and organ phenotype is absent.
    limitations: >-
      This is a true negative with a known cause, not an untested model. Thalidomide
      degrades SALL4 in humans, primates and rabbits but not in rodents or fish, so a mouse
      cannot express the mechanism this node asserts; a negative mouse result is therefore
      not evidence against the human mechanism.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: INVALIDATING
      description: >-
        Rodent cereblon-ligase complexes do not ubiquitinate SALL4 in response to
        thalidomide, so the mouse structurally cannot express the SALL4-degradation node
        this link targets. The mismatch is at the level of the mechanism, not a quantitative
        difference.
    evidence:
    - reference: PMID:30067223
      reference_title: "Thalidomide promotes degradation of SALL4, a transcription factor implicated in Duane Radial Ray syndrome."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We find that thalidomide induces degradation of SALL4 exclusively in humans, primates, and rabbits, but not in rodents or fish, providing a mechanistic link for the species-specific pathogenesis of thalidomide syndrome."
      explanation: >-
        The species restriction that explains why the mouse fails to recapitulate the human
        mechanism.
    - reference: PMID:38029956
      reference_title: "Animal-free assessment of developmental toxicity: Combining PBPK modeling with the ReproTracker assay."
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: BACKGROUND
      snippet: "Thalidomide is a strong human teratogenic agent where its developmental toxicity cannot be detected in mouse models or in murine-based in vitro assays."
      explanation: >-
        States the model failure at the organismal level, the observation the species
        restriction explains.
discussions:
- discussion_id: thalidomide_human_model_mismatch
  prompt: >-
    Does a negative mouse teratology result bear on thalidomide developmental toxicity in
    humans, given that the cereblon-dependent degradation of SALL4 occurs in humans,
    primates and rabbits but not in rodents?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#CRBN-Dependent Degradation of SALL4 and Developmental Transcription Factors
  - experimental_models#ReproTracker hiPSC developmental-toxicity assay (thalidomide)
  - animal_models#Mouse thalidomide exposure
  rationale: >-
    Thalidomide is the archetypal case where a human teratogen is missed by the standard
    animal model, and the reason is now mechanistic rather than a dosing or ascertainment
    artifact: thalidomide-bound cereblon degrades SALL4 in humans, primates and rabbits but
    not in rodents or fish. A negative mouse result is therefore expected and uninformative
    about human risk, while a human iPSC assay (ReproTracker) detects the hazard directly.
    This is the entry whose model-mismatch is settled in direction — the human mechanism is
    real and the rodent one is absent — with the open question being which non-rodent system
    (primate, rabbit, or human cell/organoid) best reproduces each arm of the phenotype,
    especially the limb arm that the current iPSC assay does not model.
  evidence:
  - reference: PMID:30067223
    reference_title: "Thalidomide promotes degradation of SALL4, a transcription factor implicated in Duane Radial Ray syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We find that thalidomide induces degradation of SALL4 exclusively in humans, primates, and rabbits, but not in rodents or fish, providing a mechanistic link for the species-specific pathogenesis of thalidomide syndrome."
    explanation: The species restriction that grounds the mismatch as mechanistic rather than incidental.
  - reference: PMID:38029956
    reference_title: "Animal-free assessment of developmental toxicity: Combining PBPK modeling with the ReproTracker assay."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: "Thalidomide is a strong human teratogenic agent where its developmental toxicity cannot be detected in mouse models or in murine-based in vitro assays."
    explanation: States the organism-level model failure the mismatch concerns.
notes: >-
  Thalidomide embryopathy is curated as a standalone named clinical entity under the
  teratogen pattern established by Fetal_Valproate_Syndrome and Fetal_Alcohol_Spectrum_Disorder,
  not as a module, because it has its own MONDO term, a distinct molecular mechanism, and a
  well-documented human phenotype. It is deliberately separate from the antiseizure-medication
  embryopathies: thalidomide is a sedative/immunomodulatory teratogen with a cereblon-SALL4
  mechanism unrelated to valproate's HDAC/folate mechanism, so it shares no grouping with them.
  The ReproTracker link (PMID:38029956) was the motivating NAM for issue 16910: the paper's
  thalidomide arm had no pathograph node to attach to until this entry existed.

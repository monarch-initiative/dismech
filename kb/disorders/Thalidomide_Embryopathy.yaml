prevalence:
- population: Worldwide, 1957-1962 thalidomide disaster
  measure_type: CASES_IN_LITERATURE
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    Recorded as a historical outbreak count rather than a rate. Over 10,000 affected
    children were born worldwide during the years the drug was marketed as a sedative,
    and the true number is higher because severely affected embryos were miscarried or
    stillborn and were not counted. After the 1961-1962 withdrawals the condition
    became sporadic; new cases continue to arise where thalidomide is used to treat
    leprosy complications without adequate pregnancy prevention, notably in Brazil.
    No standing population prevalence is meaningful for a banned-in-pregnancy drug, so
    the measure type is the literature case count.
  evidence:
  - reference: PMID:26043938
    reference_title: "Thalidomide-induced teratogenesis: history and mechanisms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Between 1957 and 1962, thalidomide caused severe birth defects in over 10,000 children."
    explanation: The outbreak count this record normalizes, from a review summarizing the clinical record.
clinical_burden:
  burden_level: HIGH
  rationale: >-
    Lifelong multi-system disability — limb reduction requiring prosthetics and
    reconstructive surgery, deafness, visual impairment, and cardiac and renal
    malformation — in a condition wholly preventable by not exposing the embryo.
    Infant mortality in severely affected children is reported as high as 40%,
    attributed to internal-organ damage, and survivors now face early age-related
    morbidity. The burden is a prescribing and drug-governance burden as much as a
    biological one.
  evidence:
  - reference: PMID:26043938
    reference_title: "Thalidomide-induced teratogenesis: history and mechanisms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Infant mortality in babies born with severe thalidomide embryopathy is as high as 40%, quite likely due to internal organ damage"
    explanation: Quantifies the mortality and attributes it to the visceral arm of the phenotype.
environmental:
- name: Maternal thalidomide intake during the critical window
  description: >-
    Thalidomide taken by a pregnant woman — historically as a sedative and
    antiemetic for morning sickness, now for leprosy complications and multiple
    myeloma — reaching the embryo during the sensitive window of roughly 20 to 36
    days after fertilization. This is the sole necessary cause: the embryopathy does
    not occur without the exposure, and a single tablet taken within the window can
    produce it. The drug both racemizes between enantiomers in body fluids and breaks
    down into many hydrolytic and hepatic metabolites, so the species that reaches the
    embryo is a mixture rather than one agent.
  exposure_term:
    preferred_term: gestational maternal thalidomide exposure
  chemicals:
  - thalidomide
  influences_mechanisms:
  - target: Embryonic Thalidomide Exposure in the Critical Window
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Maternal intake during the 20-36 day window delivers the drug to the embryo at
      the time of limb, ear, eye and organ formation, which is the initiating step of
      every branch curated here.
    evidence:
    - reference: PMID:26043938
      reference_title: "Thalidomide-induced teratogenesis: history and mechanisms."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "The time sensitive window extends between days 20 and days 36 after fertilization"
      explanation: >-
        Fixes the window during which the exposure is teratogenic, reconstructed from
        maternal intake histories.
  evidence:
  - reference: PMID:26043938
    reference_title: "Thalidomide-induced teratogenesis: history and mechanisms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Reports indicate that a single 50 mg tablet of thalidomide during the time‐sensitive window is sufficient to cause birth defects in up to 50% of pregnancies."
    explanation: >-
      Establishes that the exposure needed to cause the syndrome is a single
      therapeutic dose taken in the window, not chronic high-dose intake.
  notes: >-
    The exposure is left ontologically unbound. ECTO has no thalidomide term:
    OLS searches of ECTO on 2026-11-20 for "thalidomide" and "exposure to
    thalidomide" returned nothing, and XCO likewise returned nothing. The only
    candidates were the generic class terms ECTO:0900043 (exposure to drug via
    maternal) and ECTO:9001876 (exposure to teratogenic agent), both of which drop
    the thalidomide identity that is the point of the record; the drug is instead
    grounded on the pathophysiology node below via CHEBI:9513. By contrast ECTO does
    carry ECTO:9000603 (exposure to carbamazepine), so the gap is thalidomide-specific
    and worth a term request rather than a reason to bind a class term here.
pathophysiology:
- name: Embryonic Thalidomide Exposure in the Critical Window
  biological_scale: ORGANISM
  description: >-
    Thalidomide (and its racemized enantiomers and breakdown products) reaches the
    embryo during the 20-36 day window, when the limbs, ears, eyes, heart and internal
    organs are forming. This node exists so that the molecular cereblon branch and the
    vascular branch below share one parent: they are competing and possibly
    complementary accounts of one exposure, and the entry does not rank them.
  chemical_entities:
  - preferred_term: thalidomide
    term:

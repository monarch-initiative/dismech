- name: Disrupted Limb Bud Outgrowth and FGF8/SHH Signaling
  biological_scale: TISSUE
  description: >-
    The convergence point of the cereblon and vascular branches at the limb: the limb
    bud fails to grow out normally and its FGF8 and SHH signaling centers are lost.
    Because proximal (long-bone) elements are the most affected while the distal hand
    plate is relatively spared, the characteristic outcome is phocomelia, and the upper
    limbs are affected more often and earlier than the lower limbs.

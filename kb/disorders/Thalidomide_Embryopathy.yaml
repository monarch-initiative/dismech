      label: embryo
  evidence:
  - reference: PMID:20223979
    reference_title: Identification of a primary target of thalidomide teratogenicity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "thalidomide was widely prescribed to pregnant women as a sedative but was found to be teratogenic, causing multiple birth defects"
    explanation: >-
      States the exposure and its teratogenic consequence. Graded HUMAN_CLINICAL for
      the human teratogenicity it describes, and BACKGROUND because the sentence is the
      opening framing of a mechanistic study rather than its own result.
  downstream:
  - target: Cereblon Binding and E3 Ubiquitin Ligase Reprogramming
    causal_link_type: DIRECT
    description: >-
      Thalidomide binds cereblon directly, which is the proximal drug-target event of
      the molecular branch.
    evidence:
    - reference: PMID:20223979
      reference_title: Identification of a primary target of thalidomide teratogenicity.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Thalidomide initiates its teratogenic effects by binding to CRBN and inhibiting the associated ubiquitin ligase activity."
      explanation: Names the binding target and the initiating step, from the study that identified it.
  - target: Antiangiogenic Disruption of the Embryonic Vasculature
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      In parallel with the cereblon branch, thalidomide and its breakdown products act
      on the forming embryonic blood vessels. Recorded as a separate candidate branch,
      not ranked against the cereblon one.
    evidence:
    - reference: PMID:26043938
      reference_title: "Thalidomide-induced teratogenesis: history and mechanisms."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: REVIEW_SYNTHESIS
      snippet: "Thalidomide was demonstrated in a landmark study to inhibit angiogenic vascularization of rodent corneas induced by fibroblast growth factor (GF) protein"
      explanation: >-
        The founding observation of the antiangiogenic branch, summarized by the review
        from the primary rodent-cornea study.
- name: Cereblon Binding and E3 Ubiquitin Ligase Reprogramming
  biological_scale: MOLECULAR
  description: >-
    Thalidomide binds cereblon (CRBN), the substrate-receptor subunit of a CRL4
    (CUL4-DDB1) E3 ubiquitin ligase that is required for limb outgrowth and for Fgf8
    expression in zebrafish and chick embryos. Binding both inhibits the ligase's
    normal activity and, as the later substrate work established, reprograms its
    substrate specificity so that it ubiquitinates neosubstrates it would not
    otherwise engage. The conserved limb-outgrowth role was shown in fish and chick;
    the disease-relevant neosubstrate degradation below is not conserved in those
    species, which is the crux of the model-mismatch.
  genes:
  - preferred_term: CRBN
    term:
      id: hgnc:30185
      label: CRBN
  molecular_functions:
  - preferred_term: ubiquitin-protein transferase activity
    modifier: DYSREGULATED
    term:
      id: GO:0004842
      label: ubiquitin-protein transferase activity
  chemical_entities:
  - preferred_term: thalidomide
    term:
      id: CHEBI:9513
      label: thalidomide
  evidence:
  - reference: PMID:20223979
    reference_title: Identification of a primary target of thalidomide teratogenicity.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "we identified cereblon (CRBN) as a thalidomide-binding protein. CRBN forms an E3 ubiquitin ligase complex with damaged DNA binding protein 1 (DDB1) and Cul4A that is important for limb outgrowth and expression of the fibroblast growth factor Fgf8 in zebrafish and chicks."
    explanation: >-
      Identifies the binding target and the ligase complex, and its conserved role in
      limb outgrowth and Fgf8 expression in two model species.
  downstream:
  - target: CRBN-Dependent Degradation of SALL4 and Developmental Transcription Factors
    causal_link_type: DIRECT
    description: >-
      Thalidomide-bound cereblon recruits and ubiquitinates C2H2 zinc-finger
      transcription factors for proteasomal degradation, SALL4 foremost among them.
    evidence:
    - reference: PMID:30067223
      reference_title: "Thalidomide promotes degradation of SALL4, a transcription factor implicated in Duane Radial Ray syndrome."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "IMiDs disrupt a broad transcriptional network through induced degradation of several C2H2 zinc finger transcription factors, including SALL4, a member of the spalt-like family of developmental transcription factors."
      explanation: The neosubstrate-degradation step this edge asserts, from the study that mapped it.
  - target: Disrupted Limb Bud Outgrowth and FGF8/SHH Signaling
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The conserved cereblon-ligase requirement for limb outgrowth and Fgf8 expression,
      shown in zebrafish and chick, is a route to the limb phenotype that is separate
      from the human-specific SALL4 degradation. Marked indirect because the
      intermediates between the ligase defect and the signaling loss are not resolved in
      the cited work.
    evidence:
    - reference: PMID:20223979
      reference_title: Identification of a primary target of thalidomide teratogenicity.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "CRBN forms an E3 ubiquitin ligase complex with damaged DNA binding protein 1 (DDB1) and Cul4A that is important for limb outgrowth and expression of the fibroblast growth factor Fgf8 in zebrafish and chicks."
      explanation: >-
        Ties the ligase to limb outgrowth and Fgf8, the signaling output disrupted at the
        limb node.
- name: CRBN-Dependent Degradation of SALL4 and Developmental Transcription Factors
  biological_scale: MOLECULAR
  description: >-
    Thalidomide-bound cereblon targets SALL4 and other developmental zinc-finger
    transcription factors for proteasomal degradation. SALL4 is the load-bearing
    neosubstrate: heterozygous loss-of-function SALL4 mutations cause a human
    developmental condition (Duane-radial ray / Okihiro syndrome) that phenocopies the
    limb, ear, eye and heart defects of thalidomide embryopathy, so depleting SALL4
    pharmacologically reproduces the genetic syndrome. The degradation is
    species-restricted — it occurs in humans, primates and rabbits but not in rodents
    or fish — which is the mechanistic basis for thalidomide's notorious failure in
    mouse teratology.
  genes:
  - preferred_term: SALL4
    term:
      id: hgnc:15924
      label: SALL4
  biological_processes:
  - preferred_term: proteasome-mediated ubiquitin-dependent protein catabolic process
    modifier: INCREASED
    term:
      id: GO:0043161
      label: proteasome-mediated ubiquitin-dependent protein catabolic process
  evidence:
  - reference: PMID:30067223
    reference_title: "Thalidomide promotes degradation of SALL4, a transcription factor implicated in Duane Radial Ray syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "heterozygous loss of function mutations in SALL4 result in a human developmental condition that phenocopies thalidomide-induced birth defects such as absence of thumbs, phocomelia, defects in ear and eye development, and congenital heart disease."
    explanation: >-
      The genetic phenocopy that makes SALL4 depletion the explanation for the phenotype.
      Graded HUMAN_CLINICAL for the human SALL4 syndrome it describes, BACKGROUND because
      the citing study is recalling an established human condition rather than reporting it.
  - reference: PMID:30067223
    reference_title: "Thalidomide promotes degradation of SALL4, a transcription factor implicated in Duane Radial Ray syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We find that thalidomide induces degradation of SALL4 exclusively in humans, primates, and rabbits, but not in rodents or fish, providing a mechanistic link for the species-specific pathogenesis of thalidomide syndrome."
    explanation: >-
      The species restriction of the degradation, which is why rodent models do not
      reproduce the disease and the ReproTracker human assay does.
  downstream:
  - target: Disrupted Limb Bud Outgrowth and FGF8/SHH Signaling
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      SALL4 depletion is taken to drive the limb reduction, on the strength of the
      SALL4 loss-of-function phenocopy; the transcriptional steps from SALL4 loss to the
      signaling-center failure at the limb bud are not resolved.
    evidence:
    - reference: PMID:30067223
      reference_title: "Thalidomide promotes degradation of SALL4, a transcription factor implicated in Duane Radial Ray syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: "phenocopies thalidomide-induced birth defects such as absence of thumbs, phocomelia, defects in ear and eye development, and congenital heart disease."
      explanation: Links SALL4 loss to the limb (and ear/eye/heart) phenotype it reproduces.
  - target: Impaired Cardiac and Visceral Organ Differentiation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The same SALL4 phenocopy includes congenital heart disease, and SALL4 is a
      regulator of cardiac and endodermal differentiation, so its degradation is taken to
      contribute to the cardiac and visceral arm of the phenotype.
    evidence:
    - reference: PMID:30067223
      reference_title: "Thalidomide promotes degradation of SALL4, a transcription factor implicated in Duane Radial Ray syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: "defects in ear and eye development, and congenital heart disease."
      explanation: Names the cardiac component of the SALL4-loss phenocopy.
- name: Antiangiogenic Disruption of the Embryonic Vasculature
  biological_scale: CELLULAR
  description: >-
    An older and still-supported account: thalidomide and its breakdown products
    inhibit angiogenesis and damage the nascent vessels that supply the growing limb
    and organ fields. In a breakdown-product model, vessels are destroyed within an
    hour of exposure, before any change in limb signaling-gene expression, which places
    vascular injury upstream of the signaling loss rather than beside it. Curated as a
    parallel candidate branch to the cereblon one, and marked indirect.
  biological_processes:

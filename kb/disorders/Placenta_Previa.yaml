clinical_burden:
  burden_level: HIGH
  rationale: >-
    Placenta previa is a leading cause of bleeding in the second half of pregnancy and
    of massive obstetric haemorrhage at delivery, and it sits in the top tier of risk
    factors for postpartum haemorrhage in the pooled literature. Perinatal loss is
    mediated almost entirely through preterm delivery rather than any direct fetal
    insult, with neonatal mortality running roughly four times the background rate.
  evidence:
  - reference: PMID:38841031
    reference_title: "Maternal and Perinatal Outcomes in Placenta Previa: A Comprehensive Review of Evidence."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Placenta previa stands as a primary cause of third-trimester hemorrhage and manifests through painless bleeding, posing life-threatening risks for both the mother and the infant"
    explanation: States the burden and the characteristic painless presentation.
  - reference: PMID:40188841
    reference_title: "Causes of and risk factors for postpartum haemorrhage: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Risk factors with a strong association with postpartum haemorrhage included anaemia, previous postpartum haemorrhage, caesarean birth, female genital mutilation, sepsis, no antenatal care, multiple pregnancy, placenta praevia, assisted reproductive technology use, macrosomia with a birthweight of more than 4500 g, and shoulder dystocia."
    explanation: >-
      Places placenta praevia in the strong-association tier (pooled OR above 2) for
      postpartum haemorrhage across 327 studies and 847 million women.
  - reference: PMID:38841031
    reference_title: "Maternal and Perinatal Outcomes in Placenta Previa: A Comprehensive Review of Evidence."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "a study revealed a neonatal mortality rate of 10.7 per 1,000 births in previa cases, contrasting with 2.5 per 1,000 in other pregnancies (relative risk: 4.3; 95% confidence interval: 4.0, 4.8)"
    explanation: Quantifies the excess neonatal mortality relative to pregnancies without previa.
pathophysiology:
- name: Endometrial and Decidual Damage at the Lower Uterine Segment
  biological_scale: TISSUE
  description: >-
    Every well-replicated risk factor for placenta previa - prior caesarean, uterine
    curettage after induced or spontaneous abortion, intrauterine surgery,
    endometriosis, advancing maternal age - is a cause of endometrial injury. The
    proposed common step is that injury alters decidualisation and drives excessive
    vascular remodelling, so the scarred region no longer supports normal
    implantation and the blastocyst implants elsewhere, including low in the uterus.
    This is a mechanism inferred from a consistent epidemiology rather than one
    demonstrated at the implantation site in humans, and it is recorded at that
    strength.
  cell_types:
  - preferred_term: endometrial stromal cell
    term:
      id: CL:0002255
      label: stromal cell of endometrium
  - preferred_term: decidual cell
    term:
      id: CL:2000002
      label: decidual cell
  biological_processes:
  - preferred_term: decidualization
    modifier: DECREASED
    term:
      id: GO:0046697
      label: decidualization
  locations:
  - preferred_term: endometrium
    term:
      id: UBERON:0001295
      label: endometrium
  evidence:
  - reference: PMID:23127895
    reference_title: "Caesarean section in cases of placenta praevia and accreta."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "These factors imply some degree of tissue damage, which can modify the decidualisation process, and produce excessive vascular remodelling."
    explanation: >-
      States the decidualisation-damage mechanism linking the shared risk factors
      (induced labour, termination, caesarean, older age) to abnormal placentation.
  - reference: PMID:34768164
    reference_title: "The risk factors associated with placenta previa: An umbrella review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "smoking (OR 1·42, 95% CI 1·30, 1·54) (RR 1·27, 95% CI: 1·18, 1·35) advanced maternal age (OR 3·16, 95% CI: 2·79, 3·57), cesarean (OR 1·60, 95% CI: 1·44, 1·76) and ART (singleton pregnancy) (RR 3·71, 95% CI: 2·67, 5·16) were graded as highly suggestive evidence (class III)."
    explanation: >-
      Umbrella review of nine meta-analyses grading the endometrial-injury risk factors
      at the highest evidence class it awards. Advanced maternal age carries the largest
      effect of the group.
  downstream:
  - target: Low Implantation of the Blastocyst
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The step from a damaged endometrium to a low implantation site is the weakest
      link in the chain. It is supported by the consistent direction of every risk
      factor and by the scar-specific version of the argument that holds for placenta
      accreta spectrum, but no human study observes the implantation event itself.
- name: Low Implantation of the Blastocyst
  biological_scale: CELLULAR
  description: >-
    The blastocyst implants in the lower uterine segment rather than the fundus. This
    node is an inferred event, not an observed one - implantation site in a human
    pregnancy is reconstructed backwards from where the placenta is later seen.
  biological_processes:
  - preferred_term: embryo implantation
    term:
      id: GO:0007566
      label: embryo implantation
  locations:
  - preferred_term: uterus
    term:
      id: UBERON:0000995
      label: uterus
  downstream:
  - target: Placental Development Overlying the Internal Cervical Os
    causal_link_type: DIRECT
- name: Placental Development Overlying the Internal Cervical Os
  biological_scale: TISSUE
  description: >-
    The placenta develops over or beside the internal os. At this point the disorder
    is a position, not yet an injury: most pregnancies diagnosed here in the second
    trimester will resolve, and the ones that do not acquire their pathology from what
    the cervix and lower segment do next.
  locations:
  - preferred_term: placenta
    term:
      id: UBERON:0001987
      label: placenta
  - preferred_term: uterine cervix
    term:
      id: UBERON:0000002
      label: uterine cervix
  evidence:
  - reference: PMID:39654466
    reference_title: Placenta Previa.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Today, placenta previa is typically identified during routine second-trimester ultrasound, with the overwhelming majority of cases resolving before term."
    explanation: >-
      Establishes that the second-trimester finding is usually transient, which is why
      the entry treats persistence rather than presence as the pathological step.
  downstream:
  - target: Failure of Trophotropic Migration Away from the Internal Os
    causal_link_type: DIRECT
  - target: Deficient Decidua Basalis Over the Uterine Scar
    causal_link_type: DIRECT
    description: >-
      This branch is taken only when the low implantation site coincides with a
      previous caesarean scar. A previa on unscarred myometrium does not take it, so
      the edge is conditional on the scar rather than obligatory.
  - target: Fetal Growth Restriction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The lower segment is less well vascularised than the fundus, which predicts
      impaired fetal growth. The measured effect is real but small, and the pooled
      estimate is highly heterogeneous - so this edge is included as a weak one rather
      than as a core feature of the disease.
    evidence:
    - reference: PMID:31301678
      reference_title: "Placenta previa and the risk of intrauterine growth restriction (IUGR): a systematic review and meta-analysis."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "pregnancies with placenta previa were associated with a mild increase in the risk of IUGR/SGA, with a pooled OR [95% confidence interval (CI)] of 1.19 (1.10-1.27)"
      explanation: >-
        1.59 million singleton pregnancies. The authors' own word for the effect is
        mild, and I2 was 94% - which the entry states rather than smoothing over.
- name: Failure of Trophotropic Migration Away from the Internal Os
  biological_scale: TISSUE
  description: >-
    Placental migration is not movement. The placenta grows preferentially toward
    the better-vascularised fundus while the tissue lying over the poorly vascularised
    cervix and lower segment atrophies, so the placental edge retreats from the os at
    roughly 5 mm per week and the great majority of second-trimester diagnoses
    resolve. Persistent placenta previa is the failure of this process - which is the
    reason the disease is defined by a third-trimester finding and why a covering
    placenta and a merely low-lying one behave so differently. The same process,
    running to completion over a velamentous cord, is the accepted explanation for
    vasa previa: the placental tissue atrophies and leaves the fetal vessels behind.
  locations:
  - preferred_term: placenta
    term:
      id: UBERON:0001987
      label: placenta
  evidence:
  - reference: PMID:37590981
    reference_title: Vasa Previa.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "It has been proposed that the placenta grows preferentially toward the better-vascularized fundus of the uterus with advancing gestational age, and then the placental tissue overlying the less well-vascularized cervix and lower uterine segment undergoes atrophy, leaving behind exposed fetal vessels."
    explanation: >-
      The trophotropism mechanism, stated by the source as a proposal rather than an
      established fact - the hedge is preserved here. Quoted from the vasa previa
      literature because that is where the mechanism is articulated most explicitly.
  - reference: PMID:38841031
    reference_title: "Maternal and Perinatal Outcomes in Placenta Previa: A Comprehensive Review of Evidence."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Research suggests a migration rate of approximately 5.4 mm per week, with over 98.4% of suspected low-lying/placenta previa cases in the second trimester resolving before delivery, typically around 26 weeks of gestation, leaving only 1.6% persisting until term"
    explanation: Quantifies both the rate of retreat and the proportion in which it succeeds.
  - reference: PMID:35841836
    reference_title: "Potential resolution of placenta previa from the 28th-to the 36th-week of pregnancy: A retrospective longitudinal cohort study."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "62.5% of the pregnant women with 28th-week placenta previa were still with previa at the 36 weeks of gestation (25.8% with marginal and 36.7% with partial/complete placenta previa)."
    explanation: >-
      REFUTE against the general reading of the 98%-resolve figure above, not against
      the migration mechanism. The resolve rate is a statement about second-trimester
      findings; in 368 women whose previa had already persisted to 28 weeks, most did
      not resolve by 36 weeks. The two figures describe different starting points, and
      quoting only the first would misdescribe the natural history of an established
      previa.
  - reference: PMID:35841836
    reference_title: "Potential resolution of placenta previa from the 28th-to the 36th-week of pregnancy: A retrospective longitudinal cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This proportion is even higher for 28th-week complete placenta previa."
    explanation: >-
      The residual migration capacity depends on how much the placenta overlaps the os,
      which is what a growth-and-atrophy mechanism predicts: the further the edge has to
      retreat, the less often it gets there.
  notes: >-
    The resolution rate quoted for this node is strongly dependent on gestational age at
    first detection, on how much the placental edge overlaps the os, and on case
    definition. Second-trimester series report over 98% resolution; a cohort already
    persisting at 28 weeks reports 62.5% still previa at 36 weeks. Both are cited above,
    as a SUPPORT and a REFUTE item, rather than reconciled into a single number.
  downstream:
  - target: Persistent Placenta Previa in the Third Trimester
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:31671480
      reference_title: "Follow-up ultrasound in second-trimester low-positioned anterior and posterior placentae: prospective cohort study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In the third trimester, 48/958 (5.0%) placentae persisted as a low-positioned placenta."
      explanation: >-
        Prospective cohort measuring the failure rate of the migration process directly:
        95% of second-trimester low placentae are no longer low in the third trimester.
- name: Persistent Placenta Previa in the Third Trimester
  biological_scale: TISSUE
  description: >-
    A placenta still overlying or abutting the internal os in the third trimester. A
    prior caesarean makes persistence markedly more likely, and a posterior placenta
    persists more often than an anterior one - so the same scarring that is thought to
    cause the low implantation also makes it less likely to resolve.
  locations:
  - preferred_term: placenta
    term:
      id: UBERON:0001987
      label: placenta
  evidence:
  - reference: PMID:31671480
    reference_title: "Follow-up ultrasound in second-trimester low-positioned anterior and posterior placentae: prospective cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Women with a posterior placenta had a higher risk of a low-positioned placenta in the third trimester than did those with an anterior placenta (38/594 (6.4%) vs 10/364 (2.7%); RR, 2.4 (95% CI, 1.2-4.9)), as did women with a history of Cesarean section compared with those without such a history (14/105 (13.3%) vs 34/853 (4.0%); RR, 3.7 (95% CI, 1.9-7.2))."
    explanation: >-
      Identifies prior caesarean and posterior position as predictors of persistence,
      with effect sizes.
  downstream:
  - target: Cervical Remodelling and Lower Segment Formation at the Placental Edge
    causal_link_type: DIRECT
  - target: Poorly Contractile Placental Bed in the Lower Uterine Segment
    causal_link_type: DIRECT
  - target: Obstruction of the Birth Canal
    causal_link_type: DIRECT
- name: Cervical Remodelling and Lower Segment Formation at the Placental Edge
  biological_scale: TISSUE
  description: >-
    As term approaches, the lower uterine segment forms and the cervix softens,
    shortens and effaces. The placenta cannot accommodate that change, so the
    utero-placental interface at the placental edge is disrupted. The clinical
    signature of this being a maternal-tissue event rather than a fetal one is that the
    bleeding is bright red, painless, and of maternal origin. The evidence that
    cervical change specifically drives the bleeding is mixed and is recorded that way:
    a short cervix predicts the severe, early, emergency-delivery haemorrhage, but in
    the same cohort it did not distinguish women who bled at all from those who did not.
  locations:
  - preferred_term: uterine cervix
    term:
      id: UBERON:0000002
      label: uterine cervix
  - preferred_term: myometrium
    term:
      id: UBERON:0001296
      label: myometrium
  evidence:
  - reference: PMID:19173235
    reference_title: "Cervical length and risk of antepartum bleeding in women with complete placenta previa."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "was significantly shorter among patients who underwent emergency Cesarean section < 34 weeks due to massive hemorrhage compared with patients who underwent elective Cesarean section (29.4 +/- 5.7 mm vs. 38.8 +/- 8.5 mm; P = 0.0006)"
    explanation: >-
      A 9 mm shorter cervix in the women who bled catastrophically. INDIRECT because
      cervical length is a marker of the remodelling process rather than a measurement
      of interface disruption.
  - reference: PMID:19173235
    reference_title: "Cervical length and risk of antepartum bleeding in women with complete placenta previa."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Cervical length did not differ significantly between cases with and those without prepartum bleeding (35.3 +/- 9.3 mm vs. 38.4 +/- 8.2 mm; P = 0.18)"
    explanation: >-
      The same 59-woman cohort, and the reason this node is not asserted more strongly.
      Cervical length separated the severe cases but not bleeding as such. Kept as a
      REFUTE item against the general form of the claim rather than dropped.
  - reference: PMID:31434519
    reference_title: "Cervical length should be measured for women with placenta previa: cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Women with short cervix had significantly higher rates of preterm birth, antepartum hemorrhage, emergency cesarean sections, intraoperative estimated blood loss, massive bleeding, prevalence of placental adherence and cesarean hysterectomy"
    explanation: >-
      A larger cohort (n=328) that does find the association with antepartum haemorrhage
      itself, not only with its severe form - which is why the disagreement above is
      recorded as unresolved rather than settled against the mechanism.
  downstream:
  - target: Maternal Sinus Haemorrhage from the Placental Bed
    causal_link_type: DIRECT
- name: Maternal Sinus Haemorrhage from the Placental Bed
  biological_scale: ORGANISM
  description: >-
    Disruption of the interface opens maternal venous sinuses in the placental bed,
    and blood escapes through the cervix. Because the bleeding is maternal and the
    uterus is not contracting against a retro-placental clot, it is painless - the
    single feature that distinguishes it at the bedside from placental abruption.
  locations:
  - preferred_term: decidua basalis
    term:
      id: UBERON:0000453
      label: decidua basalis
  downstream:
  - target: Antepartum Hemorrhage
    causal_link_type: DIRECT
  - target: Hypovolemic Shock
    causal_link_type: DIRECT
  - target: Indicated Preterm Delivery
    causal_link_type: DIRECT
    description: >-
      Bleeding is the proximate trigger for early delivery, so the haemorrhage arm and
      the prematurity arm are not independent complications - one causes the other.
    evidence:
    - reference: PMID:38841031
      reference_title: "Maternal and Perinatal Outcomes in Placenta Previa: A Comprehensive Review of Evidence."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Antepartum bleeding serves as a robust predictor of preterm delivery in pregnancies complicated by placenta previa"
      explanation: Links the haemorrhage node to the preterm-delivery node directly.
- name: Deficient Decidua Basalis Over the Uterine Scar
  biological_scale: TISSUE
  description: >-
    Where the low-implanting placenta lands on a caesarean scar, the scar has not
    re-epithelialised and the decidua basalis is absent or deficient. The decidua is
    the brake on extravillous trophoblast migration, so its absence permits otherwise
    normal placentation to proceed into the myometrium. This is the mechanism shared
    with the Placenta Accreta Spectrum entry, reached here from the previa side: it is
    why previa and prior caesarean multiply rather than merely add.
  cell_types:
  - preferred_term: decidual cell
    term:
      id: CL:2000002
      label: decidual cell
  locations:
  - preferred_term: decidua basalis
    term:
      id: UBERON:0000453
      label: decidua basalis
  evidence:
  - reference: PMID:24338130
    reference_title: "Risk factors for placenta accreta: a large prospective cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "as were women with previa (adjusted odds ratio [OR], 34.9; 95% confidence interval [CI], 22.4-54.3)"
    explanation: >-
      73,257 caesarean deliveries. A 35-fold adjusted odds ratio is the largest single
      risk factor for accreta in the cohort, which is why previa is treated here as a
      cause of PAS rather than a co-finding.
  - reference: PMID:24338130
    reference_title: "Risk factors for placenta accreta: a large prospective cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "patients with previa and two or three prior cesarean deliveries had an adjusted OR for accreta of 4.9 (95% CI, 1.7-14.3) or 7.7 (95% CI, 2.4-24.9), respectively"
    explanation: >-
      Within the previa group alone, risk scales with the number of scars - the
      dose-response that the deficient-decidua mechanism predicts.
  - reference: PMID:28268196
    reference_title: "Prenatal ultrasound diagnosis and outcome of placenta previa accreta after cesarean delivery: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The incidence of placenta previa accreta was 4.1% in women with 1 prior cesarean and 13.3% in women with ≥2 previous cesarean deliveries."
    explanation: The same dose-response in a 3,889-pregnancy meta-analysis, as absolute incidences.
  downstream:
  - target: Unimpeded Extravillous Trophoblast Invasion of the Myometrium
    causal_link_type: DIRECT
- name: Unimpeded Extravillous Trophoblast Invasion of the Myometrium
  biological_scale: CELLULAR
  description: >-
    Extravillous trophoblast migrates into the myometrium because the decidual barrier
    that normally limits it is not there. The sonographic correlate at the previa site
    is lower-segment hypervascularity and large, swirling placental lacunae, detectable
    as early as the first trimester.
  cell_types:
  - preferred_term: extravillous trophoblast
    term:
      id: CL:0008036
      label: extravillous trophoblast
  biological_processes:
  - preferred_term: trophoblast cell migration
    modifier: INCREASED
    term:
      id: GO:0061450
      label: trophoblast cell migration
  - preferred_term: blood vessel remodeling
    modifier: INCREASED
    term:
      id: GO:0001974
      label: blood vessel remodeling
  locations:
  - preferred_term: myometrium
    term:
      id: UBERON:0001296
      label: myometrium
  evidence:
  - reference: PMID:34837427
    reference_title: "First-trimester ultrasound diagnostic features of placenta accreta spectrum in low-implantation pregnancy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Lower uterine segment (uterovesical, subplacental and/or intraplacental) hypervascularity was present in 14/14 (100%) cases and only 1/12 (8.3%) controls (P < 0.001)."
    explanation: >-
      Case-control study in which both arms are low-implantation pregnancies, so the
      comparison isolates the invasion signal rather than the low position.
  - reference: PMID:34837427
    reference_title: "First-trimester ultrasound diagnostic features of placenta accreta spectrum in low-implantation pregnancy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Placental lacunae were present in 18/21 (85.7%) cases and 7/46 (15.2%) controls (odds ratio (OR), 33.4; 95% CI, 7.7-144.4; P < 0.001)."
    explanation: The lacunae marker in the same first-trimester low-implantation comparison.
  downstream:
  - target: Failure of Placental Separation at Delivery
    causal_link_type: DIRECT
- name: Failure of Placental Separation at Delivery
  biological_scale: TISSUE
  description: >-
    Villi anchored in the myometrium cannot shear off at the decidual plane, so the
    third stage does not complete. Attempting to remove the placenta tears the
    myometrium and opens the invaded vasculature - which is why the standard of care is
    to leave it alone and proceed to hysterectomy.
  locations:
  - preferred_term: myometrium
    term:
      id: UBERON:0001296
      label: myometrium
  evidence:
  - reference: PMID:16582134
    reference_title: "Placenta previa, placenta accreta, and vasa previa."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Women known to have placenta accreta should be delivered by cesarean, and no attempt should be made to separate the placenta at the time of delivery."
    explanation: >-
      The management rule follows from the mechanism: separation is not achievable, so
      attempting it converts a controlled delivery into a haemorrhage.
  downstream:
  - target: Post-partum Hemorrhage
    causal_link_type: DIRECT
- name: Poorly Contractile Placental Bed in the Lower Uterine Segment
  biological_scale: TISSUE
  description: >-
    After any delivery, haemostasis at the placental bed is mechanical: myometrial
    contraction occludes the spiral arteries. The lower uterine segment is a poorly
    contractile part of the uterus, so a placental bed sited there does not get that
    closure, and the newly formed vessels of the abnormally remodelled bed keep
    bleeding. This is why postpartum haemorrhage in previa happens even when the
    placenta separates normally and there is no accreta - it is a separate mechanism
    from the one above, converging on the same phenotype.
  locations:
  - preferred_term: myometrium
    term:
      id: UBERON:0001296
      label: myometrium
  evidence:
  - reference: PMID:23127895
    reference_title: "Caesarean section in cases of placenta praevia and accreta."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Placenta praevia and accreta are mainly located in the lower segment, a place that predisposes to persistent uterine bleeding because of the development of new vessels and because it is a poorly contractile area of the uterus."
    explanation: >-
      States both components of this node - neovascularisation and the contractile
      deficit of the lower segment - as the reason bleeding persists after delivery.
  downstream:
  - target: Post-partum Hemorrhage
    causal_link_type: DIRECT
- name: Obstruction of the Birth Canal
  biological_scale: ORGANISM
  description: >-
    The placenta lies between the fetus and the cervix. Labour would deliver the
    placenta first, detaching the fetal circulation before the fetus is born, so
    vaginal delivery is not available and abdominal delivery is obligatory rather than
    merely preferred. A low-lying placenta more than 2 cm from the os is the exception.
  locations:
  - preferred_term: uterine cervix
    term:
      id: UBERON:0000002
      label: uterine cervix
  evidence:
  - reference: PMID:16582134
    reference_title: "Placenta previa, placenta accreta, and vasa previa."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The diagnostic modality of choice for placenta previa is transvaginal ultrasonography, and women with a complete placenta previa should be delivered by cesarean."
    explanation: States the obligate abdominal route for a covering placenta.
  downstream:
  - target: Indicated Preterm Delivery
    causal_link_type: DIRECT
- name: Indicated Preterm Delivery
  biological_scale: ORGANISM
  description: >-
    Delivery is scheduled before term to pre-empt catastrophic haemorrhage, or happens
    as an emergency when haemorrhage occurs. Either way prematurity in placenta previa
    is substantially iatrogenic and deliberate - a chosen trade of neonatal risk against
    maternal risk - which is a different thing from spontaneous preterm labour and is
    the reason antenatal corticosteroids are a mainstay.
  evidence:
  - reference: PMID:38841031
    reference_title: "Maternal and Perinatal Outcomes in Placenta Previa: A Comprehensive Review of Evidence."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Preterm birth emerges as a prevalent complication linked to placenta previa, with approximately 5% of all preterm deliveries attributed to this condition"
    explanation: >-
      Gives the population-level contribution of previa to preterm birth, which is large
      relative to the condition's 0.5% prevalence.
  - reference: PMID:38841031
    reference_title: "Maternal and Perinatal Outcomes in Placenta Previa: A Comprehensive Review of Evidence."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "for uncomplicated complete placenta previa, scheduling delivery between 36 and 37 weeks is advisable"
    explanation: >-
      Documents that the timing is planned rather than spontaneous, supporting the
      iatrogenic framing of this node.
  downstream:
  - target: Premature Birth
    causal_link_type: DIRECT
  - target: Neonatal Death
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Mediated by the recognised complications of prematurity - respiratory distress
      syndrome, low birth weight and birth asphyxia - rather than by the placental
      position acting on the fetus directly.
phenotypes:
- category: Clinical
  name: Antepartum Hemorrhage
  description: >-
    Painless, bright-red vaginal bleeding in the second half of pregnancy, classically
    unprovoked and recurrent. Roughly half of women with a complete previa persisting
    into the third trimester bleed before delivery. The painlessness is diagnostic
    information, not a detail: it is what separates previa from abruption at
    presentation.
  phenotype_term:
    preferred_term: Antepartum hemorrhage
    term:
      id: HP:0025328
      label: Antepartum hemorrhage
    temporality: RECURRENT
  frequency: FREQUENT
  evidence:
  - reference: PMID:19173235
    reference_title: "Cervical length and risk of antepartum bleeding in women with complete placenta previa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Twenty-nine (49.1%) of the women presented prepartum bleeding and 12 (20.3%) required an emergency Cesarean section prior to 34 completed weeks due to massive hemorrhage."
    explanation: >-
      Gives the frequency in a cohort restricted to complete previa persisting into the
      third trimester, which is the population this frequency band is about.
  - reference: PMID:38841031
    reference_title: "Maternal and Perinatal Outcomes in Placenta Previa: A Comprehensive Review of Evidence."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Placenta previa stands as a primary cause of third-trimester hemorrhage and manifests through painless bleeding, posing life-threatening risks for both the mother and the infant"
    explanation: Establishes the painless character of the bleeding.
- category: Clinical
  name: Post-partum Hemorrhage
  description: >-
    Excessive blood loss after delivery, reached by two independent routes in this
    disease - a placental bed in a poorly contractile segment, and, when accreta is
    superimposed, a placenta that will not separate at all.
  phenotype_term:
    preferred_term: Post-partum hemorrhage
    term:
      id: HP:0011891
      label: Post-partum hemorrhage
  evidence:
  - reference: PMID:40188841
    reference_title: "Causes of and risk factors for postpartum haemorrhage: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Risk factors with a strong association with postpartum haemorrhage included anaemia, previous postpartum haemorrhage, caesarean birth, female genital mutilation, sepsis, no antenatal care, multiple pregnancy, placenta praevia, assisted reproductive technology use, macrosomia with a birthweight of more than 4500 g, and shoulder dystocia."
    explanation: >-
      Places placenta praevia in the highest association tier the review defines
      (pooled OR greater than 2).
- category: Clinical
  name: Hypovolemic Shock
  description: >-
    Massive antepartum or peripartum blood loss can produce haemorrhagic shock and is
    the route by which placenta previa kills. About one in five women with a persistent
    complete previa in one cohort required emergency delivery before 34 weeks for
    massive haemorrhage.
  phenotype_term:
    preferred_term: Hypovolemic shock
    term:
      id: HP:0031274
      label: Hypovolemic shock
    temporality: ACUTE
  evidence:
  - reference: PMID:19173235
    reference_title: "Cervical length and risk of antepartum bleeding in women with complete placenta previa."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Twenty-nine (49.1%) of the women presented prepartum bleeding and 12 (20.3%) required an emergency Cesarean section prior to 34 completed weeks due to massive hemorrhage."
    explanation: >-
      INDIRECT because the cohort reports emergency delivery for massive haemorrhage
      rather than measured haemodynamic shock, so the phenotype is inferred from the
      intervention it prompted.
- category: Clinical
  name: Premature Birth
  description: >-
    Delivery before 37 weeks, largely by obstetric indication rather than spontaneous
    labour. Placenta previa accounts for about 5% of all preterm deliveries.
  phenotype_term:
    preferred_term: Premature birth
    term:
      id: HP:0001622
      label: Premature birth
  frequency: FREQUENT
  evidence:
  - reference: PMID:38841031
    reference_title: "Maternal and Perinatal Outcomes in Placenta Previa: A Comprehensive Review of Evidence."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Preterm birth emerges as a prevalent complication linked to placenta previa, with approximately 5% of all preterm deliveries attributed to this condition"
    explanation: Quantifies previa's share of the population burden of preterm birth.
- category: Clinical
  name: Fetal Growth Restriction
  description: >-
    Birth weight below the 10th percentile, mildly more common than in pregnancies with
    a normally sited placenta. The effect is small (OR 1.19) and heterogeneous, and the
    entry deliberately does not present it as a characteristic feature.
  phenotype_term:
    preferred_term: Intrauterine growth retardation
    term:
      id: HP:0001511
      label: Intrauterine growth retardation
  frequency: OCCASIONAL
  evidence:
  - reference: PMID:31301678
    reference_title: "Placenta previa and the risk of intrauterine growth restriction (IUGR): a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The incidence of growth abnormalities was 8.7/100 births in cases of placenta previa vs. 5.8/100 births among controls."
    explanation: >-
      Absolute incidences behind the pooled odds ratio, which is what the OCCASIONAL
      band is set from.
- category: Clinical
  name: Neonatal Death
  description: >-
    Neonatal mortality is about four times the background rate, mediated by prematurity,
    low birth weight, asphyxia and respiratory distress rather than by a direct effect
    of the placental position on the fetus.
  phenotype_term:
    preferred_term: Neonatal death
  frequency: VERY_RARE
  evidence:
  - reference: PMID:38841031
    reference_title: "Maternal and Perinatal Outcomes in Placenta Previa: A Comprehensive Review of Evidence."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "a study revealed a neonatal mortality rate of 10.7 per 1,000 births in previa cases, contrasting with 2.5 per 1,000 in other pregnancies (relative risk: 4.3; 95% confidence interval: 4.0, 4.8)"
    explanation: >-
      10.7 per 1000 is about 1%, which sets the VERY_RARE frequency band even though the
      relative risk is fourfold.
  notes: >-
    Deliberately left unbound. HPO has a term - HP:0003811 Neonatal death - but it sits
    under Mortality/Aging rather than under HP:0000118 phenotypic abnormality, so it is
    outside the PhenotypeTerm dynamic-enum root and binding it fails term validation.
    This is the same enum-root gap that issue #7837 records for HP:0003826 Stillbirth,
    HP:0009800 Maternal diabetes and HP:0100602 Preeclampsia; Intrahepatic Cholestasis
    of Pregnancy leaves its stillbirth phenotype unbound for the same reason. Recorded
    here as a fourth instance rather than worked around.
diagnosis:
- name: Transvaginal Ultrasonography
  description: >-
    The diagnostic standard. Transvaginal scanning measures the placental edge to
    internal-os distance directly. Diagnosis is made in the third trimester, because a
    second-trimester finding usually resolves.
  diagnosis_term:
    preferred_term: transvaginal ultrasound
    term:
      id: NCIT:C17644
      label: Transvaginal Ultrasound
  evidence:
  - reference: PMID:16582134
    reference_title: "Placenta previa, placenta accreta, and vasa previa."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The diagnostic modality of choice for placenta previa is transvaginal ultrasonography, and women with a complete placenta previa should be delivered by cesarean."
    explanation: Names transvaginal ultrasonography as the modality of choice.
  - reference: PMID:31671480
    reference_title: "Follow-up ultrasound in second-trimester low-positioned anterior and posterior placentae: prospective cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Low-positioned placenta included placenta previa, defined as a placenta covering the internal os of the cervix, and a low-lying placenta, defined as a placenta lying near to (within 20 mm) but not overlying the internal os."
    explanation: Gives the measured criteria the scan applies.
- name: Assessment for Placenta Accreta Spectrum
  description: >-
    A diagnosis of previa is also an indication to look for PAS, because roughly one in
    nine previas has it and the management differs completely. Lower-segment
    hypervascularity, placental lacunae and loss of the clear zone are assessable from
    the first trimester in a low-implantation pregnancy.
  diagnosis_term:
    preferred_term: fetal ultrasound imaging
    term:
      id: NCIT:C222238
      label: Fetal Ultrasound Imaging
  evidence:
  - reference: PMID:39654466
    reference_title: Placenta Previa.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "When placenta previa is diagnosed, it is essential to assess for associated conditions like placenta accreta and vasa previa."
    explanation: States the obligation to screen for PAS and vasa previa once previa is found.
  - reference: PMID:34837427
    reference_title: "First-trimester ultrasound diagnostic features of placenta accreta spectrum in low-implantation pregnancy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In women at risk of PAS, ultrasound markers of PAS can and should be assessed as early as in the first trimester."
    explanation: Supports first-trimester rather than third-trimester assessment in this population.
environmental:
- name: Maternal Cigarette Smoking
  description: >-
    Smoking in pregnancy raises previa risk by about 40%. The usual proposed mechanism
    is that carbon-monoxide-mediated relative hypoxaemia drives compensatory placental
    enlargement, so the placenta spreads far enough to reach the lower segment - but the
    cited evidence is epidemiological and identifies no mediating step, so the link is
    recorded as an association with an unestablished mechanism.
  exposure_term:
    preferred_term: exposure to cigarette smoking via maternal
    term:
      id: ECTO:0300003
      label: exposure to cigarette smoking via maternal
  influences_mechanisms:
  - target: Placental Development Overlying the Internal Cervical Os
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      A consistent, modest association with no demonstrated intermediate. Included
      because smoking is the main modifiable risk factor in the set, not because the
      mechanism is established.
    evidence:
    - reference: PMID:27936997
      reference_title: "Smoking and placenta previa: a meta-analysis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "compared to nonsmoker women, the estimated OR and RR of placenta previa was 1.42 (95% CI: 1.30, 1.54) and 1.27 (95% CI: 1.18, 1.35), respectively"
      explanation: >-
        Meta-analysis over 9,094,443 participants giving both the odds-ratio and
        relative-risk forms of the association.
  evidence:
  - reference: PMID:34768164
    reference_title: "The risk factors associated with placenta previa: An umbrella review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "smoking (OR 1·42, 95% CI 1·30, 1·54) (RR 1·27, 95% CI: 1·18, 1·35) advanced maternal age (OR 3·16, 95% CI: 2·79, 3·57), cesarean (OR 1·60, 95% CI: 1·44, 1·76) and ART (singleton pregnancy) (RR 3·71, 95% CI: 2·67, 5·16) were graded as highly suggestive evidence (class III)."
    explanation: >-
      The umbrella review grades smoking at its highest awarded evidence class, alongside
      the other established risk factors.
- name: Endometriosis
  description: >-
    Endometriosis nearly triples the risk of placenta previa, and the effect is strongly
    dose-dependent on disease severity - roughly sevenfold for revised-ASRM stage III-IV
    disease and fourteenfold for deep endometriosis. Critically, the association holds
    regardless of whether conception was assisted, which separates it from the
    ART-related risk and points at the endometrium itself rather than at the procedures.
  exposure_term:
    preferred_term: pre-pregnancy endometriosis
  influences_mechanisms:
  - target: Endometrial and Decidual Damage at the Lower Uterine Segment
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The severity gradient is the informative part: a risk factor whose effect scales
      with how much endometrial and pelvic disease is present is consistent with the
      decidualisation-damage node, though the study measures outcome rather than
      decidualisation.
    evidence:
    - reference: PMID:39049473
      reference_title: "Untangling the independent effect of endometriosis, adenomyosis, and ART-related factors on maternal, placental, fetal, and neonatal adverse outcomes: results from a systematic review and meta-analysis."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "The association was observed regardless of the method of conception and was particularly strong in the most severe forms of endometriosis (i.e. rASRM stage III-IV endometriosis and deep endometriosis (DE)) (OR 6.61; 95% CI: 2.08, 20.98; I2 = 66% and OR 14.54; 95% CI: 3.67, 57.67; I2 = 54%, respectively)"
      explanation: >-
        Establishes both the independence from conception method and the severity
        gradient. INDIRECT because the inference from worse endometrial disease to the
        decidualisation node is a step the study does not take.
  evidence:
  - reference: PMID:39049473
    reference_title: "Untangling the independent effect of endometriosis, adenomyosis, and ART-related factors on maternal, placental, fetal, and neonatal adverse outcomes: results from a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We showed a higher risk of placenta previa in women with endometriosis compared to controls (34 studies, OR 2.84; 95% CI: 2.47, 3.26; I2 = 83%, moderate quality)"
    explanation: The headline pooled association across 34 studies, graded moderate quality by GRADE.
- name: Assisted Reproductive Technology
  description: >-
    ART in a singleton pregnancy carries a nearly fourfold relative risk of placenta
    previa - the largest effect among the established risk factors. Whether this is the
    technology, the underlying subfertility, or the endometrial pathology that caused
    the subfertility is unresolved; the endometriosis data above show that at least one
    component is independent of the method of conception.
  exposure_term:
    preferred_term: conception by assisted reproductive technology
  influences_mechanisms:
  - target: Low Implantation of the Blastocyst
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Embryo transfer places the blastocyst mechanically rather than letting it
      implant where it arrives, which is an obvious candidate mechanism for an altered
      implantation site - but it is a hypothesis, and the cited evidence does not test it.
    evidence:
    - reference: PMID:34768164
      reference_title: "The risk factors associated with placenta previa: An umbrella review."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "smoking (OR 1·42, 95% CI 1·30, 1·54) (RR 1·27, 95% CI: 1·18, 1·35) advanced maternal age (OR 3·16, 95% CI: 2·79, 3·57), cesarean (OR 1·60, 95% CI: 1·44, 1·76) and ART (singleton pregnancy) (RR 3·71, 95% CI: 2·67, 5·16) were graded as highly suggestive evidence (class III)."
      explanation: >-
        Gives the ART effect size (RR 3.71) at the review's highest evidence class.
        INDIRECT because nothing in the quote bears on the implantation-site step.
  evidence:
  - reference: PMID:34768164
    reference_title: "The risk factors associated with placenta previa: An umbrella review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study provides suggestive evidence about prior spontaneous abortion, prior induced abortion, male fetus, smoking, advanced maternal age, cesarean section, and assisted reproductive techniques (singleton pregnancy) as risk factors associated with placenta previa."
    explanation: >-
      The umbrella review's own summary statement, listing assisted reproductive
      techniques among the risk factors it grades at class III.
  - reference: PMID:26244528
    reference_title: "Abnormal Placentation: Placenta Previa, Vasa Previa, and Placenta Accreta."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "the rates of previa and accreta are increasing, probably as a result of increasing rates of cesarean delivery, maternal age, and assisted reproductive technology"
    explanation: >-
      Attributes the secular rise in previa incidence partly to ART uptake, which is the
      population-level reason this exposure matters rather than only the per-pregnancy
      relative risk.
treatments:
- name: Planned Cesarean Delivery
  description: >-
    The definitive management, and the intervention that turned placenta previa from a
    major cause of maternal death into a manageable condition. A covering placenta
    mandates it; a low-lying placenta more than 2 cm from the os may allow a trial of
    vaginal delivery. Scheduling is a deliberate trade: 36-37 weeks for an uncomplicated
    complete previa balances the bleeding risk of waiting against the neonatal risk of
    delivering early. Delivery should be at an institution able to transfuse.
  treatment_term:
    preferred_term: cesarean delivery
    term:
      id: NCIT:C46088
      label: Cesarean Section
  therapeutic_modality: SURGERY
  target_mechanisms:
  - target: Obstruction of the Birth Canal
    description: >-
      Bypasses the obstruction rather than correcting it - the placental position is
      unchanged, the fetus simply does not have to pass it.
  - target: Cervical Remodelling and Lower Segment Formation at the Placental Edge
    description: >-
      Pre-empting labour prevents the cervical change that disrupts the interface, which
      is why scheduled delivery is the whole strategy rather than a fallback.
  evidence:
  - reference: PMID:39654466
    reference_title: Placenta Previa.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "A planned cesarean delivery is recommended in cases that persist into the late third trimester."
    explanation: States the recommendation for the persistent case, which is the treated population.
  - reference: PMID:38841031
    reference_title: "Maternal and Perinatal Outcomes in Placenta Previa: A Comprehensive Review of Evidence."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "for uncomplicated complete placenta previa, scheduling delivery between 36 and 37 weeks is advisable"
    explanation: Gives the timing and the reasoning behind it.
  - reference: PMID:16582134
    reference_title: "Placenta previa, placenta accreta, and vasa previa."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Delivery should take place at an institution with adequate blood banking facilities."
    explanation: Records the setting requirement, which follows from the haemorrhage risk.
- name: Antenatal Corticosteroid Therapy
  description: >-
    Given because delivery in placenta previa is expected to be preterm. It targets the
    consequence of the obstetric decision rather than the placental disorder - the
    clearest example in this entry of a treatment aimed at an iatrogenic arm of the
    pathograph.
  treatment_term:
    preferred_term: antenatal corticosteroid administration
    term:
      id: NCIT:C122080
      label: Systemic Corticosteroid Therapy
    therapeutic_agent:
    - preferred_term: betamethasone
      term:
        id: CHEBI:3077
        label: betamethasone
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Indicated Preterm Delivery
    description: >-
      Mitigates the neonatal consequences of early delivery; it does not reduce the
      likelihood of early delivery.
  evidence:
  - reference: PMID:38841031
    reference_title: "Maternal and Perinatal Outcomes in Placenta Previa: A Comprehensive Review of Evidence."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "ACS has since demonstrated a capacity to decrease the risk of late miscarriages, infant deaths, RDS, intraventricular hemorrhage, necrotizing enterocolitis, and systemic infections within the first two days of life"
    explanation: >-
      Summarises the neonatal benefit of antenatal corticosteroids. Note this is the
      general preterm-birth evidence base, not a previa-specific trial.
  notes: >-
    The efficacy evidence quoted is for antenatal corticosteroids in preterm birth
    generally, not for placenta previa specifically. No previa-restricted randomised
    trial is cited here, and the entry does not imply one exists.
- name: Blood Transfusion and Haemorrhage Support
  description: >-
    Supportive rather than mechanistic: replaces what is lost while the bleeding source
    is addressed surgically. Its availability is a precondition for delivering a previa
    safely rather than an optional adjunct.
  treatment_term:
    preferred_term: blood transfusion
    term:
      id: NCIT:C15192
      label: Blood Transfusion
  target_mechanisms:
  - target: Hypovolemic Shock
    description: Restores circulating volume and oxygen-carrying capacity.
  evidence:
  - reference: PMID:16582134
    reference_title: "Placenta previa, placenta accreta, and vasa previa."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Delivery should take place at an institution with adequate blood banking facilities."
    explanation: Establishes transfusion capacity as a requirement of the delivery plan.
- name: Peripartum Hysterectomy
  description: >-
    The endpoint when the placenta cannot be separated, which in practice means when
    accreta spectrum is superimposed on the previa. It is a definitive haemostatic
    operation and an irreversible one; the great majority of significant accreta cases
    need it.
  treatment_term:
    preferred_term: peripartum hysterectomy
    term:
      id: NCIT:C15256
      label: Hysterectomy
  therapeutic_modality: SURGERY
  target_mechanisms:
  - target: Failure of Placental Separation at Delivery
    description: >-
      Removes the uterus with the placenta in situ, so the un-separable interface is
      never disturbed.
  - target: Poorly Contractile Placental Bed in the Lower Uterine Segment
    description: >-
      Also removes the bleeding bed itself, which is why it works when uterotonics -
      which depend on a contractile myometrium - do not.
  evidence:
  - reference: PMID:16582134
    reference_title: "Placenta previa, placenta accreta, and vasa previa."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The majority of women with significant degrees of placenta accreta will require a hysterectomy."
    explanation: States the frequency with which the definitive operation is needed.
  - reference: PMID:16582134
    reference_title: "Placenta previa, placenta accreta, and vasa previa."
    supports: NO_EVIDENCE
    evidence_source: OTHER
    snippet: "Although successful conservative management has been described, there are currently insufficient data to recommend this approach to management routinely."
    explanation: >-
      Recorded as NO_EVIDENCE for the uterus-preserving alternative: the source reports
      it exists and explicitly declines to judge it, which is not support either way.
discussions:
- discussion_id: previa_cervical_remodelling_vs_severity_marker
  kind: CONTROVERSY
  prompt: >-
    Does cervical remodelling cause the antepartum bleeding in placenta previa, or does
    it only mark the subset that bleeds catastrophically?
  attaches_to:
  - pathophysiology#Cervical Remodelling and Lower Segment Formation at the Placental Edge
  rationale: >-
    The two cohorts cited on that node disagree, and they disagree in a way that matters
    for the mechanism rather than only for prediction. Ghi and colleagues (n=59,
    complete previa only) found cervical length significantly shorter in women needing
    emergency delivery for massive haemorrhage but not different between women who bled
    and women who did not - which would make cervical shortening a severity marker,
    not the cause of bleeding as such. Altraigey and colleagues (n=328, previa and/or
    accreta) found short cervix associated with antepartum haemorrhage itself. The
    cohorts differ in size, in case mix, and in whether accreta was included, so the
    discrepancy has an obvious candidate explanation and no resolving study is cited
    here. The textbook account - lower-segment formation shears an inelastic placenta
    off the decidua - is mechanically plausible and is what every review states, but no
    reference in this entry demonstrates the shearing event directly.
- discussion_id: previa_why_low_implantation
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why does the placenta implant low in the first place, and is a damaged endometrium
    really the reason?
  attaches_to:
  - pathophysiology#Endometrial and Decidual Damage at the Lower Uterine Segment
  - pathophysiology#Low Implantation of the Blastocyst
  rationale: >-
    The endometrial-damage account is inferred entirely from the direction of the risk
    factors. No human study observes the implantation event, so the first two nodes of
    this pathograph rest on epidemiology plus the scar-specific mechanism borrowed from
    placenta accreta spectrum. The strongest single risk factor - assisted reproductive
    technology, RR 3.71 - is also the one least well explained by endometrial damage,
    since embryo transfer places the blastocyst mechanically; and the endometriosis data
    show an effect independent of conception method, which the damage account predicts
    but does not uniquely explain. The alternative account, that a large placenta
    spreads into the lower segment secondary to relative hypoxaemia, is the usual
    explanation offered for the smoking association and is not tested against the damage
    account by anything cited here.
differential_diagnoses:
- name: Placental Abruption
  description: >-
    The other major cause of second-half antepartum haemorrhage, and the one the
    painlessness of previa is meant to exclude. Curated separately.
  distinguishing_features:
  - Abruption bleeds with pain and uterine tenderness because blood accumulates behind an attached placenta; previa bleeds painlessly because the blood escapes freely through the cervix.
  - Ultrasound localises the placenta away from the internal os in abruption, and abruption is a clinical rather than a sonographic diagnosis.
  evidence:
  - reference: PMID:17012465
    reference_title: Placental abruption.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Placental abruption complicates about 1% of pregnancies and is a leading cause of vaginal bleeding in the latter half of pregnancy."
    explanation: >-
      Establishes abruption as the competing cause of second-half bleeding, at roughly
      twice the occurrence rate of previa, which is what makes it the differential that
      matters most at presentation.
  - reference: PMID:17012465
    reference_title: Placental abruption.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The diagnosis of abruption is a clinical one, and ultrasonography and the Kleihauer-Betke test are of limited value."
    explanation: >-
      The asymmetry that decides the differential: previa is diagnosed by transvaginal
      ultrasound, abruption clinically. A scan that localises the placenta away from the
      os therefore excludes previa without excluding abruption.
- name: Vasa Previa
  description: >-
    Fetal rather than maternal vessels crossing the os, most often arising when a
    second-trimester previa resolves and leaves velamentous vessels behind - so the two
    conditions share the trophotropic mechanism of this entry's migration node and are
    not merely look-alikes. Not currently a dismech entry.
  distinguishing_features:
  - The bleeding is fetal and small in volume but rapidly lethal to the fetus, whereas previa bleeding is maternal and threatens the mother.
  - Colour Doppler shows fetal vessels crossing over the cervix with no overlying placental tissue.
  evidence:
  - reference: PMID:37590981
    reference_title: Vasa Previa.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Vasa previa refers to fetal vessels (arterial or venous) unprotected by placental tissue or umbilical cord running through the membranes over or in close proximity to the internal cervical os."
    explanation: >-
      The definition that separates the two: the same anatomical location, but fetal
      vessels without placental tissue rather than placental tissue itself.
  - reference: PMID:37590981
    reference_title: Vasa Previa.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "It has been proposed that the placenta grows preferentially toward the better-vascularized fundus of the uterus with advancing gestational age, and then the placental tissue overlying the less well-vascularized cervix and lower uterine segment undergoes atrophy, leaving behind exposed fetal vessels."
    explanation: >-
      Why this is a mechanistic relative and not just a look-alike: the proposed origin
      of vasa previa is this entry's own migration node running to completion over a
      velamentous cord.
- name: Placenta Accreta Spectrum
  description: >-
    Not an alternative diagnosis so much as a frequent superimposition - about one previa
    in nine. Curated separately.
  distinguishing_features:
  - Distinguished antenatally by lower-segment hypervascularity, placental lacunae with swirling flow, and loss of the clear zone.
  - Distinguished at delivery by failure of the placenta to separate; a previa without those markers separates normally.
  evidence:
  - reference: PMID:31722942
    reference_title: "Epidemiology of placenta previa accreta: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The incidence of PAS in women with a placenta previa was 11.10% (IQR 7.65-17.35)."
    explanation: >-
      Quantifies the overlap, which is why PAS is framed here as a superimposition to be
      actively excluded rather than an alternative diagnosis.
  - reference: PMID:34837427
    reference_title: "First-trimester ultrasound diagnostic features of placenta accreta spectrum in low-implantation pregnancy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Lower uterine segment (uterovesical, subplacental and/or intraplacental) hypervascularity was present in 14/14 (100%) cases and only 1/12 (8.3%) controls (P < 0.001)."
    explanation: >-
      The discriminating marker, measured in a study whose controls are themselves
      persistent previas without PAS - which is exactly the comparison this differential
      requires.
notes: >-
  Scope. This entry covers placenta previa and the low-lying placenta. Placenta accreta
  spectrum has its own entry and is modelled here only where previa causes it: the
  Deficient Decidua Basalis Over the Uterine Scar node is the shared mechanism seen
  from the previa side, and the two entries should be read together rather than
  duplicated into each other.

  What the pathograph asserts and what it does not. The chain from a persistent previa
  onwards is well sourced - obstruction, haemorrhage, iatrogenic prematurity and the
  two independent routes to postpartum haemorrhage each carry their own citation. The
  first two nodes are weaker by construction and are flagged with a KNOWLEDGE_GAP
  discussion: no cited study observes a human implantation event, so the claim that
  endometrial damage causes low implantation is an inference from the uniform direction
  of the risk factors.

  On the bleeding mechanism. Every review states that lower-segment formation and
  cervical effacement shear the placental edge off the decidua, and it is almost
  certainly right, but none of the references assembled here demonstrates it. What is
  citable is the cervical-length literature, which is internally inconsistent - a
  CONTROVERSY discussion records the disagreement rather than picking the reading that
  suits the mechanism.

  Terminology. The historical complete/partial/marginal grading depended on cervical
  dilatation at examination and is not used. The subtypes here are the two
  transvaginal-ultrasound definitions in current use: covering the os, or within 20 mm
  of it.

  No datasets, deliberately. `just discover-datasets Placenta_Previa` returns six
  candidates and every one is a GENE_ONLY match whose actual subject is something else -
  four are placenta accreta spectrum transcriptomics (GSE211003, GSE211001, GSE210508,
  GSE104350 on abnormally invasive placenta), one is Hofbauer-cell chromatin
  (GSE255954), one is diabetic macrosomia (GSE162173). They resolve perfectly and none
  is about previa. This is the sibling-disease collapse the dataset-curation guidance
  warns about, arriving through the accreta overlap that the rest of this entry is at
  pains to keep separate, so the correct result is an empty `datasets:` block rather
  than a plausible one. Re-run the search if a previa-specific series appears.

  Prevalence denominators. Every prevalence record in this entry is per pregnancy, not
  per head of population, and the PAS record is conditional on previa. They are not
  comparable with the population prevalences elsewhere in the knowledge base, and each
  record says so in its own notes.

has_subtypes:
- name: Previa
  display_name: Placenta previa (placenta covering the internal cervical os)
  description: >-
    The placental edge overlies the internal os. This is the form that persists into
    the third trimester far more often than a merely low-lying placenta does, and it
    is the form that mandates abdominal delivery.
  evidence:
  - reference: PMID:31671480
    reference_title: "Follow-up ultrasound in second-trimester low-positioned anterior and posterior placentae: prospective cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Low-positioned placenta included placenta previa, defined as a placenta covering the internal os of the cervix, and a low-lying placenta, defined as a placenta lying near to (within 20 mm) but not overlying the internal os."
    explanation: States the covering-versus-near definition that separates the two contemporary subtypes.
- name: Low-Lying
  display_name: Low-lying placenta (edge within 20 mm of the internal os, not covering)
  description: >-
    The placental edge lies within 20 mm of the internal os without overlying it. It
    is worth separating rather than treating as a milder grade of the same thing: in
    the second trimester it persists to the third in about 1 in 70 cases against 1 in 5
    for a covering placenta, and above a 2 cm placenta-to-os distance vaginal delivery
    may be safe.
  evidence:
  - reference: PMID:31671480
    reference_title: "Follow-up ultrasound in second-trimester low-positioned anterior and posterior placentae: prospective cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Women with placenta previa in the second trimester had a higher risk of a low-positioned placenta in the third trimester than did those with a low-lying placenta in the second trimester (37/181 (20.4%) vs 11/777 (1.4%); relative risk (RR), 17.9 (95% CI, 8.9-36.0))."
    explanation: >-
      Quantifies the persistence difference between the two subtypes - an 18-fold
      relative risk - which is what makes them worth separating rather than grading.
  - reference: PMID:16582134
    reference_title: "Placenta previa, placenta accreta, and vasa previa."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Small studies suggest that, when the placenta to cervical os distance is greater than 2 cm, women may safely have a vaginal delivery."
    explanation: Records the management consequence of the distinction, with the source's own hedge about study size.
  review_notes: >-
    Historical terminology (complete, partial, marginal previa) graded how much of the
    os was covered and depended on cervical dilatation at the time of examination. It
    is not used here. The two subtypes above are the transvaginal-ultrasound
    definitions in current use.

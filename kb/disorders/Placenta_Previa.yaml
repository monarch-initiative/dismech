name: Placenta Previa
creation_date: "2026-09-15T00:00:00Z"
category: Complex
synonyms:
- Placenta praevia
- Low-lying placenta
- Praevia
description: >-
  Placenta previa is a disorder of placental implantation site, not of placental
  function: the placenta develops over or beside the internal cervical os instead of
  in the fundus, so the organ that must stay attached until after delivery sits on the
  one part of the uterus that has to open first. Almost everything clinically
  important follows from that single geometric fact. Low implantation is favoured by
  endometrial and decidual damage - prior caesarean, curettage, uterine surgery,
  endometriosis - which is thought to impair decidualisation at the usual fundal site.
  The great majority of second-trimester diagnoses then resolve, because the placenta
  grows preferentially toward the better-vascularised fundus while the tissue over the
  cervix atrophies; persistence is failure of that trophotropic migration rather than
  a separate disease. In the pregnancies where it persists, cervical remodelling and
  lower-segment formation disrupt the utero-placental interface and open maternal
  venous sinuses, producing the classic painless bright-red antepartum haemorrhage;
  the placenta blocks the birth canal, forcing abdominal delivery, usually preterm;
  and after delivery the placental bed lies in the lower segment, which is a poorly
  contractile part of the uterus, so the mechanical haemostasis that normally closes
  the bed does not happen. Where the low implantation lands on a caesarean scar, the
  decidua basalis is deficient and placenta accreta spectrum is superimposed - which
  is why previa is by a wide margin the strongest risk factor for PAS rather than
  merely a co-occurring finding.

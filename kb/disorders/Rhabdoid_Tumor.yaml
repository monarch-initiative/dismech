notes: >-
  This entry models the multisite malignant rhabdoid tumor spectrum (RTK, eMRT,
  and AT/RT, with CNS-specific biology curated in detail in
  Atypical_Teratoid_Rhabdoid_Tumor) rather than germline predisposition alone.
  The GeneReviews chapter on Rhabdoid Tumor Predisposition Syndrome covers
  constitutional SMARCB1/SMARCA4 predisposition syndromes (curated in
  Rhabdoid_Tumor_Predisposition_Syndrome_1 and
  Rhabdoid_Tumor_Predisposition_Syndrome_2) rather than sporadic somatic
  rhabdoid tumors.

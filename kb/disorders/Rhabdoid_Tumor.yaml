biochemical:
- name: SMARCB1 (INI1/BAF47) Immunohistochemistry
  presence: Absent
  context: Diagnostic tumor tissue immunohistochemistry
  notes: >-
    Loss of nuclear INI1/BAF47 staining in tumor cells (with retained internal
    control staining in non-neoplastic endothelial and inflammatory cells) is
    the canonical diagnostic biomarker for most rhabdoid tumors and mirrors
    biallelic SMARCB1 inactivation.
  readouts:
  - target: SMARCB1 or SMARCA4 Loss
    relationship: READOUT_OF
    direction: PRESENT_ABSENT
    endpoint_context: DIAGNOSTIC

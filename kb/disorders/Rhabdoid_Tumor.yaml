genetic:
- name: SMARCB1
  gene_term:
    preferred_term: SMARCB1
    term:
      id: hgnc:11103
      label: SMARCB1
  relationship_type: SOMATIC_DRIVER
  variant_origin: GERMLINE_AND_SOMATIC
  association: Somatic/Germline Loss-of-Function
  notes: >-
    SMARCB1 is the dominant driver gene across the rhabdoid tumor spectrum. Both
    biallelic somatic inactivation and germline pathogenic variants with a
    somatic second hit occur (~21% germline in extracranial EU-RHAB cohorts);
    constitutional variants define rhabdoid tumor predisposition syndrome type 1.
  evidence:
  - reference: PMID:39088359
    reference_title: "Malignant Rhabdoid Tumor and Related Pediatric Tumors: Multimodality Imaging Review with Pathologic Correlation."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: "Irrespective of the site of occurrence, somatic and germline mutations in SMARCB1, and rarely in SMARCA4, underlie the entire spectrum of rhabdoid tumors."
    explanation: This review supports SMARCB1 as the principal shared somatic and germline driver across renal, extrarenal, and CNS rhabdoid tumors.
  - reference: PMID:23432645
    reference_title: "Rhabdoid tumors: an initial clue to the role of chromatin remodeling in cancer."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: "Indeed, the mutation rate in RTs is among the lowest of all cancers sequenced, with loss of SMARCB1 as essentially the sole recurrent event."
    explanation: This review emphasizes how dominant SMARCB1 loss is in the otherwise genetically simple rhabdoid tumor genome.
- name: SMARCA4
  gene_term:
    preferred_term: SMARCA4
    term:
      id: hgnc:11100
      label: SMARCA4
  relationship_type: SOMATIC_DRIVER
  variant_origin: GERMLINE_AND_SOMATIC
  association: Rare Somatic/Germline Loss-of-Function
  notes: >-
    SMARCA4 loss is an uncommon alternative driver in rhabdoid tumor and is the
    genetic basis of rhabdoid tumor predisposition syndrome type 2 when present
    in the germline.
  evidence:
  - reference: PMID:39088359
    reference_title: "Malignant Rhabdoid Tumor and Related Pediatric Tumors: Multimodality Imaging Review with Pathologic Correlation."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: "Irrespective of the site of occurrence, somatic and germline mutations in SMARCB1, and rarely in SMARCA4, underlie the entire spectrum of rhabdoid tumors."
    explanation: This review supports rare but disease-defining SMARCA4-driven rhabdoid tumors alongside the more common SMARCB1-deficient cases.
diagnosis:
- name: SMARCB1 (INI1) and SMARCA4 (BRG1) Immunohistochemistry
  description: >-
    Immunohistochemical staining of tumor tissue demonstrating loss of nuclear
    SMARCB1 (INI1/BAF47) or, in INI1-retained cases, SMARCA4 (BRG1) expression
    distinguishes rhabdoid tumors from histologic mimics across renal,
    soft-tissue, and CNS sites.
  diagnosis_term:
    preferred_term: immunohistochemistry staining method
    term:
      id: NCIT:C23020
      label: Immunohistochemistry Staining Method
  evidence:
  - reference: PMID:36720509
    reference_title: "Extrarenal rhabdoid tumour of axillary soft tissue: a diagnostic challenge resolved by immunohistochemistry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is a heterogeneous group of aggressive tumours with distinct histopathological and immunohistochemistry findings. The tumour is characterised by diffuse proliferation of rhabdoid cells with hyaline like inclusion bodies. Defining feature is aberration of INI1/SMARCB1 gene located at chromosome 22q11.2."
    explanation: >-
      Demonstrates that immunohistochemical detection of INI1/SMARCB1 loss
      resolves the histopathologic diagnosis of rhabdoid tumor.
- name: Somatic and Germline SMARCB1/SMARCA4 Genetic Testing
  description: >-
    Sequencing and copy-number/cytogenetic analysis of tumor and matched blood
    DNA identifies biallelic SMARCB1 or SMARCA4 inactivation and detects
    underlying germline predisposition variants (~21% in extracranial cohorts)
    that guide prognostic stratification, genetic counseling, and surveillance.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:33249395
    reference_title: Clinical and genetic risk factors define two risk groups of extracranial malignant rhabdoid tumours (eMRT/RTK).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SMARCB1 germline mutations (GLM) were detected in 21% (17/81 evaluable) of patients."
    explanation: >-
      Quantifies the high yield of germline SMARCB1 testing in patients
      diagnosed with extracranial rhabdoid tumor.
  - reference: PMID:39088359
    reference_title: "Malignant Rhabdoid Tumor and Related Pediatric Tumors: Multimodality Imaging Review with Pathologic Correlation."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: "Multifocal synchronous or metachronous rhabdoid tumors occur predominantly in the context of underlying rhabdoid tumor predisposition syndromes (RTPSs). These autosomal dominant disorders are driven in most cases by pathogenic variants in SMARCB1 (RTPS type 1) and rarely by pathogenic variants in SMARCA4 (RTPS type 2). Genetic testing and counseling are imperative in RTPS."
    explanation: >-
      Supports germline SMARCB1/SMARCA4 genetic testing and counseling in the
      diagnostic workup of rhabdoid tumors.
- name: Multimodality Anatomical and Metabolic Imaging
  description: >-
    Ultrasonography, computed tomography, magnetic resonance imaging, and FDG
    PET/CT or PET/MRI characterize primary renal, soft-tissue, and CNS tumor
    extent, detect synchronous multifocal lesions or distant metastases, and
    monitor treatment response.
  diagnosis_term:
    preferred_term: multimodality diagnostic imaging
    term:
      id: NCIT:C16502
      label: Diagnostic Imaging Testing
  evidence:
  - reference: PMID:39088359
    reference_title: "Malignant Rhabdoid Tumor and Related Pediatric Tumors: Multimodality Imaging Review with Pathologic Correlation."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: "US, CT, MRI, and fluorodeoxyglucose PET/CT or PET/MRI facilitate diagnosis, initial staging, and follow-up, thus informing therapeutic decision making."
    explanation: >-
      Establishes multimodality anatomical and metabolic imaging (US, CT, MRI,
      and FDG PET/CT or PET/MRI) for diagnosis, initial staging, and
      longitudinal follow-up of MRT.
treatments:
- name: Multi-Agent Chemotherapy
  description: >-
    Intensive multi-agent chemotherapy remains part of front-line treatment for
    most newly diagnosed patients, usually combined with surgery and local
    radiotherapy according to age, site, and resectability.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Combination Chemotherapy
    term:
      id: NCIT:C191
      label: Combination Chemotherapy
- name: Gross Total Resection
  description: >-
    Maximal safe resection is pursued whenever anatomically feasible because gross
    total resection is one of the strongest favorable prognostic factors in
    extracranial disease.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  evidence:
  - reference: PMID:33249395
    reference_title: Clinical and genetic risk factors define two risk groups of extracranial malignant rhabdoid tumours (eMRT/RTK).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "On univariate analyses, age at diagnosis (≥12 months), M0-stage, absence of synchronous tumours, absence of a GLM, gross total resection (GTR), radiotherapy and achieving a CR were significantly associated with favourable outcomes."
    explanation: EU-RHAB registry data identifies gross total resection as a favorable prognostic factor in extracranial rhabdoid tumor.
- name: Radiation Therapy
  description: >-
    Radiotherapy is used for local control, especially after incomplete resection
    or in high-risk disease, and contributes to outcome in multimodality therapy.
  therapeutic_modality: RADIOTHERAPY
  treatment_term:
    preferred_term: Radiation Therapy
    term:
      id: NCIT:C15313
      label: Radiation Therapy
  evidence:
  - reference: PMID:33249395
    reference_title: Clinical and genetic risk factors define two risk groups of extracranial malignant rhabdoid tumours (eMRT/RTK).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "On univariate analyses, age at diagnosis (≥12 months), M0-stage, absence of synchronous tumours, absence of a GLM, gross total resection (GTR), radiotherapy and achieving a CR were significantly associated with favourable outcomes."
    explanation: The same EU-RHAB analysis supports radiotherapy as part of the treatment factors associated with improved extracranial outcomes.
- name: EZH2 Inhibitor Therapy
  description: >-
    EZH2-targeted therapy is an investigational mechanism-based strategy for
    relapsed or refractory SMARCB1/SMARCA4-deficient disease. Preclinical data
    support strong EZH2 dependence, and pediatric phase II trials have evaluated
    tazemetostat in molecularly selected tumors with prolonged disease
    stabilization in a subset of patients.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: tazemetostat
      term:
        id: NCIT:C107506
        label: Tazemetostat
  target_mechanisms:
  - target: EZH2-Driven H3K27 Methylation
    treatment_effect: INHIBITS
    description: >-
      Tazemetostat selectively inhibits EZH2 methyltransferase activity, blocking
      the H3K27 methylation dependency that SMARCB1-deficient rhabdoid tumors
      acquire when BAF-mediated antagonism of PRC2 is lost.
    evidence:
    - reference: PMID:23620515
      reference_title: Durable tumor regression in genetically altered malignant rhabdoid tumors by inhibition of methyltransferase EZH2.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "leads to dose-dependent regression of MRTs with correlative diminution of intratumoral trimethylation levels of lysine 27 on histone H3, and prevention of tumor regrowth after dosing cessation."
      explanation: >-
        Demonstrates selective small-molecule inhibition of intratumoral H3K27
        trimethylation and resulting regression of SMARCB1-deleted MRT
        xenografts.
  evidence:
  - reference: PMID:23620515
    reference_title: Durable tumor regression in genetically altered malignant rhabdoid tumors by inhibition of methyltransferase EZH2.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These data demonstrate the dependency of SMARCB1 mutant MRTs on EZH2 enzymatic activity and portend the utility of EZH2-targeted drugs for the treatment of these genetically defined cancers."
    explanation: Preclinical MRT models provide direct proof that EZH2 is a targetable dependency downstream of SMARCB1 loss.
  - reference: PMID:37228094
    reference_title: "Tazemetostat for tumors harboring SMARCB1/SMARCA4 or EZH2 alterations: results from NCI-COG pediatric MATCH APEC1621C."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although tazemetostat did not meet its primary efficacy endpoint in this population of refractory pediatric tumors (objective response rate = 5%, 90% CI = 1% to 20%), 25% of patients with multiple histologic diagnoses experienced prolonged stable disease of 6 months and over (range = 9-26 cycles), suggesting a potential effect of tazemetostat on disease stabilization."
    explanation: >-
      NCI-COG Pediatric MATCH phase II trial outcomes in SMARCB1/SMARCA4-altered
      refractory pediatric tumors (including AT/RT and MRT) show low objective
      response rates alongside prolonged disease stabilization in a subset of
      patients.

- accession: ega:EGAS00001008106
  title: Spatial and multi-omic profiling reveals genes and pathways associated with cytotoxic lymphocyte infiltration in malignant rhabdoid tumor
  description: Malignant rhabdoid tumors (MRTs) are aggressive pediatric cancers with poor outcomes. MRTs exhibit low tumor mutational burden, yet recent studies reported immune cell infiltration. Here, we used spatial transcriptomics and multi-omics to explore molecular and cellular features associated with immune cell infiltration in MRT. We identified a diverse set of tumor antigens (TAs) expressed by MRT cells and showed that genes associated with the IRF1 signaling pathway and antigen processing/presentation are significantly correlated with cytotoxic lymphocyte infiltration.

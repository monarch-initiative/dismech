name: Glanzmann Thrombasthenia
creation_date: "2026-08-24T00:00:00Z"
category: Mendelian
parents:
- Inherited Platelet Disorder
- Bleeding Disorder
disease_term:
  preferred_term: Glanzmann thrombasthenia
  term:
    id: MONDO:0100326
    label: Glanzmann thrombasthenia
synonyms:
- GT
- BDPLT2
- bleeding disorder, platelet-type, 2
- thrombasthenia of Glanzmann and Naegeli
- glycoprotein IIb-IIIa deficiency
- thrombocytasthenia
description: >-
  Glanzmann thrombasthenia is the prototype inherited disorder of platelet
  aggregation: an autosomal recessive bleeding syndrome in which quantitative or
  qualitative loss of the platelet integrin alphaIIbbeta3 leaves platelets
  unable to bind one another. It is the mechanistic mirror image of
  Bernard-Soulier syndrome. There the platelet cannot stick to the vessel wall
  and is large and scarce; here the platelet is present in normal number and
  normal size, it adheres perfectly well, it activates, and it still cannot form
  an aggregate, because alphaIIbbeta3 is the receptor that binds the fibrinogen
  and von Willebrand factor bridging one platelet to the next. That gives the
  disease a laboratory signature no other disorder reproduces - absent
  aggregation to every physiological agonist, with normal ristocetin-induced
  agglutination, a normal platelet count and normal platelet morphology - and it
  is the reason a diagnosis that is genuinely difficult to make clinically is
  nearly unmistakable in the aggregometry laboratory.

  The disease is caused by biallelic variants in either subunit gene, ITGA2B
  (alphaIIb) or ITGB3 (beta3), which sit adjacent on 17q21; because the two
  subunits must heterodimerize to leave the endoplasmic reticulum, losing either
  one removes the whole receptor and the two genotypes are clinically
  indistinguishable. Severity is strikingly variable - some patients have only
  minimal bruising while others have frequent, potentially fatal haemorrhage -
  and it correlates poorly with residual receptor level, so genotype is a poor
  guide to prognosis. It is rare worldwide but genuinely common in populations
  where consanguineous marriage is customary, and the clinical problem that
  dominates long-term management is iatrogenic: repeated platelet transfusion
  into a patient whose platelets have never displayed alphaIIbbeta3 provokes
  alloantibodies against an antigen the immune system treats as foreign, after
  which transfusion stops working.
has_subtypes:
- name: GT1
  display_name: Glanzmann thrombasthenia 1 (ITGA2B-related)
  subtype_term:
    preferred_term: Glanzmann thrombasthenia 1
    term:
      id: MONDO:0031332
      label: Glanzmann thrombasthenia 1
  description: >-
    Biallelic ITGA2B variants removing or inactivating the alphaIIb subunit.
    Clinically indistinguishable from the ITGB3 form, because loss of either
    subunit prevents surface expression of the heterodimer. Some geographic
    skewing has been reported - alphaIIb variants dominated an Italian series
    while beta3 variants, with emphasis on exon 4, characterized an Indian one -
    which reflects founder effects rather than any mechanistic difference.
  genes:
  - preferred_term: ITGA2B
    term:
      id: hgnc:6138
      label: ITGA2B
- name: GT2
  display_name: Glanzmann thrombasthenia 2 (ITGB3-related)
  subtype_term:
    preferred_term: Glanzmann thrombasthenia 2
    term:
      id: MONDO:0031009
      label: Glanzmann thrombasthenia 2
  description: >-
    Biallelic ITGB3 variants removing or inactivating the beta3 subunit. Because
    beta3 also partners alphaV to form the vitronectin receptor alphaVbeta3,
    which is expressed far beyond the platelet, ITGB3-null disease is the arm in
    which extraplatelet consequences might be expected; in the beta3-null mouse
    these are real (placental defects and fetal mortality), and whether they
    translate to patients is an open question rather than an established feature
    of the human disease.
  genes:
  - preferred_term: ITGB3
    term:
      id: hgnc:6156
      label: ITGB3
- name: Type I
  display_name: Type I (severe, <5% residual alphaIIbbeta3)
  description: >-
    The classic and commonest form: platelet aggregation is absent and clot
    retraction is absent, with essentially no surface alphaIIbbeta3. In the
    detailed Hopital Lariboisiere experience this accounted for 50 of 64
    patients (78%). This is a phenotypic severity class cutting across both
    genes, not a third genotype.
  evidence:
  - reference: PMID:16722529
    reference_title: Glanzmann thrombasthenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Those patients with absent platelet aggregation and absent clot retraction were subsequently termed as having type I disease; those with absent aggregation but residual clot retraction, type II disease"
    explanation: >-
      Defines the type I/type II split on which this and the following subtype
      entries rest.
- name: Type II
  display_name: Type II (residual alphaIIbbeta3, clot retraction preserved)
  description: >-
    Aggregation is absent but clot retraction is preserved, reflecting residual
    surface alphaIIbbeta3. Nine of 64 patients (14%) in the Lariboisiere series.
    Residual receptor does not reliably predict milder bleeding. No percentage
    is stated for the residual receptor here: the "5-20%" figure often quoted
    for type II is conventional teaching that the cited review does not contain,
    and nothing else in this entry's evidence base quantifies it.
- name: Variant GT
  display_name: Variant GT (receptor present but non-functional)
  description: >-
    alphaIIbbeta3 is expressed at near-normal levels but cannot bind ligand,
    diagnosed by the failure of the receptor to express activation-dependent
    epitopes. Five of 64 patients (8%) in the Lariboisiere series. This is the
    subtype in which a purely quantitative flow-cytometry screen is normal and
    the diagnosis is missed unless receptor function is tested - a practical
    reason the schema-level distinction is worth carrying.
pathophysiology:
- name: Biallelic Loss of Function in ITGA2B or ITGB3
  role: trigger
  biological_scale: MOLECULAR
  conforms_to: "primary_hemostatic_plug_failure#Loss of a Platelet Primary-Hemostatic Component"
  description: >-
    Pathogenic variants in either of the two adjacent 17q21 genes encoding the
    alphaIIb and beta3 subunits cause the disease, and the mutational spectrum
    spans every class - missense, nonsense, frameshift, splice and large
    deletion - with no region of either gene exempt. Heterozygotes carry roughly
    half-normal platelet alphaIIbbeta3 and are almost always asymptomatic, so
    the disease is recessive at the level of receptor dose as well as
    inheritance. Founder variants dominate in several populations, including the
    ITGA2B c.1544+1G>A allele of French Gypsy patients.
  genetic_context:
    allele_type: SNV
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  cell_types:
  - preferred_term: megakaryocyte
    term:
      id: CL:0000556
      label: megakaryocyte
  evidence:
  - reference: PMID:16722529
    reference_title: Glanzmann thrombasthenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Note that abnormalities are abundant in both αIIb and β3 genes and that no parts of either gene appear to be exempt."
    explanation: >-
      Establishes that the mutational spectrum is unconstrained across both
      genes, which is why the disorder has no small set of recurrent alleles
      outside founder populations.
  - reference: PMID:16722529
    reference_title: Glanzmann thrombasthenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "patients homozygous for mutations causing GT; the heter- ozygous condition is mostly asymptomatic, even though these subjects have only a half-normal concentration of platelet αIIbβ3"
    explanation: >-
      Supports the recessive dose relationship - half-normal receptor is
      haemostatically sufficient - which is the basis of the carrier statement
      in this node.
  downstream:
  - target: Quantitative or Qualitative Deficiency of Integrin alphaIIbbeta3
    causal_link_type: DIRECT
    description: >-
      Loss of either subunit prevents assembly and surface expression of the
      obligate heterodimer.
- name: Quantitative or Qualitative Deficiency of Integrin alphaIIbbeta3
  role: amplifier
  biological_scale: MOLECULAR
  description: >-
    alphaIIb and beta3 must heterodimerize in the endoplasmic reticulum before
    the complex can traffic to the platelet surface, so a defect in either
    subunit removes the whole receptor. Three outcomes are possible and define
    the phenotypic classes: near-total absence of surface receptor (type I),
    reduced but measurable receptor (type II), or normal amounts of a receptor
    that cannot bind ligand (variant GT). The last is why a quantitative
    flow-cytometry result alone cannot exclude the diagnosis.
  molecular_functions:
  - preferred_term: integrin alphaIIbbeta3 fibrinogen-binding activity
    term:
      id: GO:0005178
      label: integrin binding
    modifier: DECREASED
  cell_types:
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  evidence:
  - reference: PMID:16722529
    reference_title: Glanzmann thrombasthenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The molecular basis is linked to quantitative and/or qualitative abnormalities of alphaIIb beta3 integrin."
    explanation: >-
      States the quantitative-versus-qualitative distinction this node
      represents.
  - reference: PMID:22102273
    reference_title: Glanzmann thrombasthenia-like syndromes associated with Macrothrombocytopenias and mutations in the genes encoding the αIIbβ3 integrin.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "it is caused by the absence of platelet aggregation due to quantitative and/or qualitative deficiencies of the αIIbβ3 integrin coded by the ITGA2B and ITGB3 genes located at 17q21-23"
    explanation: >-
      Independent statement of the same receptor-level lesion and its two gene
      routes, including the chromosomal location asserted here.
  downstream:
  - target: Failure of Interplatelet Fibrinogen Bridging and Aggregation
    causal_link_type: DIRECT
    description: >-
      Without a functional receptor, the adhesive proteins that bridge adjacent
      platelets have nothing to bind.
  - target: Impaired Clot Retraction
    causal_link_type: DIRECT
    description: >-
      alphaIIbbeta3 also transmits the actomyosin contractile force of the
      platelet onto the fibrin network, an outside-in function separate from
      aggregation.
- name: Failure of Interplatelet Fibrinogen Bridging and Aggregation
  role: central_effector
  biological_scale: CELLULAR
  conforms_to: "primary_hemostatic_plug_failure#Failure of Integrin alphaIIbbeta3-Mediated Platelet Aggregation"
  description: >-
    The rate-limiting lesion. Activated alphaIIbbeta3 normally binds fibrinogen
    and von Willebrand factor, which cross-link adjacent platelets into a
    growing aggregate; without it, platelets that have adhered and activated
    normally remain a monolayer. Because this is the final common step of
    aggregation, the failure is agonist-independent: ADP, collagen, thrombin,
    arachidonic acid and epinephrine all fail alike, whereas ristocetin-induced
    agglutination - which depends on GPIb-IX-V and von Willebrand factor rather
    than on alphaIIbbeta3 - remains normal. That dissociation is what separates
    this disorder from Bernard-Soulier syndrome at the bench.
  cell_types:
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  biological_processes:
  - preferred_term: platelet aggregation
    term:
      id: GO:0070527
      label: platelet aggregation
    modifier: DECREASED
  evidence:
  - reference: PMID:16722529
    reference_title: Glanzmann thrombasthenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This receptor mediates the binding of adhesive proteins that attach aggregating platelets and ensure thrombus formation at sites of injury in blood vessels."
    explanation: >-
      States the bridging function whose loss constitutes this node.
  - reference: PMID:16722529
    reference_title: Glanzmann thrombasthenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "GT is the only disease in which platelet aggregation is defective to all agonists, while absent clot retraction is another frequent character- istic."
    explanation: >-
      Supports the agonist-independence claim - the discriminating feature of
      this node - and the linked clot-retraction defect.
  downstream:
  - target: Failure of Primary Hemostatic Plug Formation
    causal_link_type: DIRECT
    description: >-
      No aggregate means no plug beyond the adherent platelet monolayer.
- name: Impaired Clot Retraction
  role: effector
  biological_scale: CELLULAR
  description: >-
    A parallel, outside-in consequence of losing the receptor: alphaIIbbeta3
    engaged with fibrin transmits platelet actomyosin contraction to the clot,
    consolidating and shrinking it. Loss of clot retraction alongside absent
    aggregation defines type I disease; its preservation despite absent
    aggregation defines type II, so this node is the discriminator between the
    two severity classes rather than an independent bleeding mechanism.
  cell_types:
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  evidence:
  - reference: PMID:16722529
    reference_title: Glanzmann thrombasthenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mucocutaneous bleeding with absent platelet aggregation in response to all physiologic stimuli is pathognomonic for GT, and abnormal clot retraction is rarely observed in other disorders"
    explanation: >-
      Establishes impaired clot retraction as a real and near-specific feature
      of the disorder.
  downstream:
  - target: Failure of Primary Hemostatic Plug Formation
    causal_link_type: DIRECT
    description: >-
      An unretracted clot is mechanically weaker and more easily dislodged.
- name: Failure of Primary Hemostatic Plug Formation
  role: effector
  biological_scale: TISSUE
  conforms_to: "primary_hemostatic_plug_failure#Failure of Primary Hemostatic Plug Formation"
  description: >-
    Platelets adhere to the injured vessel wall normally - GPIb-IX-V and GPVI
    are intact - but the mass never grows or consolidates into a plug capable of
    arresting bleeding from small vessels. This is the shared destination of the
    inherited platelet function disorders reached here by the aggregation route.
  cell_types:
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  biological_processes:
  - preferred_term: primary hemostasis
    term:
      id: GO:0007599
      label: hemostasis
    modifier: DECREASED
  evidence:
  - reference: PMID:21781244
    reference_title: Advances in our understanding of the molecular basis of disorders of platelet function.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic defects of platelet function give rise to mucocutaneous bleeding of varying severity because platelets fail to fulfil their haemostatic role after vessel injury."
    explanation: >-
      Supports the convergence of a platelet-function defect onto failure of the
      platelet's haemostatic role and thence to mucocutaneous bleeding.
  downstream:
  - target: Mucocutaneous Bleeding Diathesis
    causal_link_type: DIRECT
    description: >-
      Skin and mucous membranes depend most heavily on platelet-dependent
      primary hemostasis.
- name: Mucocutaneous Bleeding Diathesis
  role: consequence
  biological_scale: ORGANISM
  conforms_to: "primary_hemostatic_plug_failure#Mucocutaneous Bleeding Diathesis"
  description: >-
    Bleeding declares itself at well-defined sites: purpura, epistaxis, gingival
    haemorrhage and menorrhagia are nearly constant, while gastrointestinal
    bleeding and haematuria are less common but disproportionately dangerous.
    Symptoms usually appear soon after birth. Severity varies enormously between
    patients carrying the same variant, so the clinical course cannot be
    predicted from the genotype; chronic low-grade loss from gingival oozing or
    menorrhagia makes iron-deficiency anaemia a frequent accompanying problem.
  biological_processes:
  - preferred_term: primary hemostasis
    term:
      id: GO:0007599
      label: hemostasis
    modifier: DECREASED
  evidence:
  - reference: PMID:16722529
    reference_title: Glanzmann thrombasthenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The site of bleeding in GT is clearly defined: purpura, epistaxis, gingival hemorrhage, and menorrhagia are nearly constant features; gastrointestinal bleeding and hematuria are less common."
    explanation: >-
      Enumerates the bleeding sites and their relative frequency, which is the
      content of this node.
  - reference: PMID:16722529
    reference_title: Glanzmann thrombasthenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "GT is associated with clinical variability: some patients have only minimal bruising while others have frequent, severe and potentially fatal hemorrhages."
    explanation: >-
      Supports the severity-variability claim that makes genotype a poor
      prognostic guide.
  downstream:
  - target: Platelet Alloimmunization Against alphaIIbbeta3
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Bleeding drives platelet transfusion, which is the exposure that
      immunizes; the intervening step is therapeutic rather than biological.
- name: Platelet Alloimmunization Against alphaIIbbeta3
  role: consequence
  biological_scale: ORGANISM
  description: >-
    The iatrogenic complication that dominates long-term management and has no
    counterpart in most inherited disorders. A patient whose platelets have
    never displayed alphaIIbbeta3 has no tolerance to it, so transfused normal
    platelets present a foreign antigen; the resulting anti-alphaIIbbeta3
    antibodies cause refractoriness to further transfusion and, in women, risk
    fetal and neonatal alloimmune thrombocytopenia. The beta3 subunit carries
    the HPA-1 antigen system, and because beta3 also partners alphaV, an
    HPA-1bb patient who expresses no platelet alphaIIbbeta3 at all can still be
    immunized against HPA-1a through alphaVbeta3 on their own platelet surface -
    an exposure route that a purely alphaIIbbeta3-centred model of the disease
    would predict was closed. This is the reason management is built around
    avoiding transfusion rather than around delivering it.
  evidence:
  - reference: PMID:33090654
    reference_title: Immunization against α(IIb) β(3) and α(v) β(3) in Glanzmann thrombasthenia patients carrying the French Gypsy mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we found that HPA-1bb patients who failed to express αIIb β3 on the platelet surface can develop alloantibodies against HPA-1a reacting with β3 as well as αv β3 . This is of particular importance as anti-HPA-1a alloantibodies might cause fetal neonatal alloimmune thrombocytopenia and/or platelet transfusion refractoriness."
    explanation: >-
      Direct evidence for the alphaVbeta3 immunization route and for the two
      clinical consequences named in this node.
  - reference: PMID:16722529
    reference_title: Glanzmann thrombasthenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In order to avoid platelet alloimmunisation, therapeutic management must include, if possible, local hemostatic procedures and/or desmopressin (DDAVP) administration."
    explanation: >-
      Supports the claim that avoidance of this complication is what structures
      first-line management.

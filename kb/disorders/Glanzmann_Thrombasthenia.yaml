genetic:
- name: ITGA2B
  gene_term:
    preferred_term: ITGA2B
    term:
      id: hgnc:6138
      label: ITGA2B
  relationship_type: CAUSATIVE
  notes: >-
    Encodes the alphaIIb integrin subunit. Biallelic loss-of-function variants
    cause Glanzmann thrombasthenia 1. A founder splice variant, c.1544+1G>A, is
    carried by French Gypsy patients and is linked to the HPA-1b allele of the
    beta3 antigen system, which shapes their alloimmunization risk.
  evidence:
  - reference: PMID:22102273
    reference_title: Glanzmann thrombasthenia-like syndromes associated with Macrothrombocytopenias and mutations in the genes encoding the αIIbβ3 integrin.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "quantitative and/or qualitative deficiencies of the αIIbβ3 integrin coded by the ITGA2B and ITGB3 genes located at 17q21-23"
    explanation: >-
      Establishes ITGA2B as one of the two causal genes and its chromosomal
      location.
  - reference: PMID:33090654
    reference_title: Immunization against α(IIb) β(3) and α(v) β(3) in Glanzmann thrombasthenia patients carrying the French Gypsy mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The c.1544+1G>A mutation was identified in Gypsy Glanzmann thrombasthenia (GT) patients."
    explanation: >-
      Supports the founder variant named in this gene block.
- name: ITGB3
  gene_term:
    preferred_term: ITGB3
    term:
      id: hgnc:6156
      label: ITGB3
  relationship_type: CAUSATIVE
  notes: >-
    Encodes the beta3 integrin subunit. Biallelic loss-of-function variants
    cause Glanzmann thrombasthenia 2. Distinct, mostly monoallelic variants at
    the cytoplasmic-tail salt bridge (beta3 Asp723, pairing with alphaIIb
    Arg995) do NOT cause classic thrombasthenia: they weaken the link that holds
    the integrin in its bent resting state, raise its activation status, and
    interfere with megakaryocytopoiesis, producing dominant macrothrombocytopenia
    with platelet anisotropy instead. Assigning an ITGB3 variant to this entry
    therefore requires the recessive, aggregation-loss phenotype, not merely a
    variant in the gene.
  evidence:
  - reference: PMID:22102273
    reference_title: Glanzmann thrombasthenia-like syndromes associated with Macrothrombocytopenias and mutations in the genes encoding the αIIbβ3 integrin.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This was brought to light by the discovery of mutations at Arg995 in αIIb and Asp723 in β3 that lead to platelet anisotropy (increased size variation) and thrombocytopenia. Significantly, Arg995 and Asp723 form a salt linkage binding the cytoplasmic tails of αIIbβ3 together keeping the integrin in a bent resting state."
    explanation: >-
      Supports the boundary drawn in this gene block between classic
      thrombasthenia alleles and the salt-bridge macrothrombocytopenia alleles.
inheritance:
- name: Autosomal Recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic variants in ITGA2B or ITGB3 are required. Heterozygotes have
    roughly half-normal platelet alphaIIbbeta3 and are mostly asymptomatic.
    Consanguinity is prominent in affected families and drives the disorder's
    geographic distribution.
  evidence:
  - reference: PMID:16722529
    reference_title: Glanzmann thrombasthenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Glanzmann thrombasthenia (GT) is a rare autosomal recessive bleeding syndrome affecting the megakaryocyte lineage and characterized by lack of platelet aggregation."
    explanation: >-
      States the mode of inheritance directly.
prevalence:
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: UNKNOWN
  notes: >-
    Deliberately unquantified. The authoritative review declines to give a
    worldwide figure because ascertainment is dominated by consanguineous
    populations - of 177 reviewed patients only 12 were from the United States
    while 55 were from Israel and Jordan and 42 from South India - so any global
    rate would average incomparable populations. A prevalence band is left
    unstated here rather than fabricated from a case series.
  evidence:
  - reference: PMID:16722529
    reference_title: Glanzmann thrombasthenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For these reasons, it would be imprudent to give an estimation of worldwide prevalence."
    explanation: >-
      The source's own explicit refusal to estimate, which is why this record
      carries no rate.
- population: Populations practising consanguineous marriage (South Indian Hindus, Iraqi Jews, French Gypsies, Jordanian nomadic tribes)
  measure_type: UNKNOWN
  prevalence_class: COMMON
  notes: >-
    Qualitative band only, and `measure_type` is UNKNOWN because the source
    states no measure type - it says the disorder "may actually be a
    common hereditary hemorrhagic disorder" in these groups and cites a single
    Iranian report of 382 patients, but gives no denominator, so no rate is
    recorded.
  evidence:
  - reference: PMID:16722529
    reference_title: Glanzmann thrombasthenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In certain ethnic groups, such as South Indian Hindus, Iraqi Jews, French gypsies and Jordanian nomadic tribes, thrombasthenia may actually be a common hereditary hemorrhagic disorder."
    explanation: >-
      Supports the qualitative COMMON band in the named populations and the
      populations listed.
diagnosis:
- name: Aggregometry with Normal Count and Morphology
  description: >-
    The diagnosis is made on a combination no other disorder reproduces: absent
    platelet aggregation to all physiological agonists, abnormal clot
    retraction, and a normal platelet count and morphology. Normal
    ristocetin-induced agglutination and normal platelet size rule out
    Bernard-Soulier syndrome; normal coagulation parameters rule out
    afibrinogenaemia and von Willebrand disease.
  evidence:
  - reference: PMID:16722529
    reference_title: Glanzmann thrombasthenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "When these two signs are associated with a normal platelet count and morphology, the diag- nosis of GT is clear-cut."
    explanation: >-
      States the diagnostic combination on which this entry rests.
- name: Flow Cytometric Confirmation of alphaIIbbeta3
  description: >-
    Surface alphaIIbbeta3 should always be quantified with monoclonal antibodies
    and flow cytometry. Western blotting for trace intracellular alphaIIb or
    beta3 can point to which gene is affected, and detection of unprocessed
    pro-alphaIIb suggests a block in integrin biosynthesis rather than absent
    transcription. A normal quantitative result does not exclude variant GT, in
    which activation-dependent epitope expression must be tested instead.
  evidence:
  - reference: PMID:16722529
    reference_title: Glanzmann thrombasthenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "can give clues to the identity of the affected gene, while the presence of nonprocessed precursor pro-αIIb will suggest a block in integrin biosyn- thesis"
    explanation: >-
      Supports the western-blot and biosynthetic-block inferences described
      here.
treatments:
- name: Local Hemostatic Measures and Desmopressin
  description: >-
    First-line, and chosen for what it avoids as much as for what it achieves:
    local measures (fibrin sealants, nasal packing, topical thrombin on gel
    foam, custom dental splints for extractions) and desmopressin are used
    wherever possible specifically to keep the patient from being exposed to
    donor platelets and alloimmunized. Regular dental care is preventive
    treatment in this disorder, not general advice.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Therapeutic Procedure
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  target_mechanisms:
  - target: Platelet Alloimmunization Against alphaIIbbeta3
    treatment_effect: INHIBITS
    description: >-
      The mechanism these measures act on is the iatrogenic one: by achieving
      haemostasis without donor platelets they prevent the alloimmunization that
      would close off transfusion later.
    evidence:
    - reference: PMID:16722529
      reference_title: Glanzmann thrombasthenia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In order to avoid platelet alloimmunisation, therapeutic management must include, if possible, local hemostatic procedures and/or desmopressin (DDAVP) administration."
      explanation: >-
        States exactly this rationale - the measures are selected to avoid
        alloimmunization.
- name: Platelet Transfusion
  description: >-
    Effective but reserved, because each exposure risks alloimmunization.
    HLA-compatible concentrates are used when local measures and desmopressin
    fail, or to cover surgery and delivery.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Therapeutic Procedure
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  target_mechanisms:
  - target: Failure of Interplatelet Fibrinogen Bridging and Aggregation
    treatment_effect: RESTORES
    description: >-
      Supplies platelets that express functional alphaIIbbeta3, transiently
      restoring the missing bridging function itself rather than bypassing it.
    evidence:
    - reference: PMID:16722529
      reference_title: Glanzmann thrombasthenia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Transfusion of HLA-compatible platelet concentrates may be necessary if these measures are ineffective, or to prevent bleeding during surgery."
      explanation: >-
        Supports the indication and the second-line positioning stated here.
- name: Recombinant Activated Factor VIIa
  description: >-
    The bypass agent, and the mainstay for patients with platelet antibodies or
    transfusion refractoriness - precisely the patients for whom transfusion has
    stopped working. In the international Glanzmann Thrombasthenia Registry it
    provided effective surgical haemostasis across 206 procedures regardless of
    antibody or refractoriness status, with a low adverse-event rate; the one
    treatment-related event was a non-fatal thromboembolism, which is the
    expected hazard of a prohaemostatic bypass.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Failure of Primary Hemostatic Plug Formation
    treatment_effect: BYPASSES
    description: >-
      Drives thrombin generation and fibrin formation on the available
      activated platelet surface, closing the haemostatic gap without restoring
      alphaIIbbeta3-mediated aggregation.
    evidence:
    - reference: PMID:26001792
      reference_title: "The international, prospective Glanzmann Thrombasthenia Registry: treatment and outcomes in surgical intervention."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "For all patients, regardless of platelet antibody or refractoriness status, recombinant factor VIIa, administered with or without platelets (±antifibrinolytics), provided effective hemostasis with a low frequency of adverse events in surgical procedures in Glanzmann thrombasthenia patients."
      explanation: >-
        Registry evidence that the agent achieves haemostasis without repairing
        the receptor defect.
  evidence:
  - reference: PMID:26001792
    reference_title: "The international, prospective Glanzmann Thrombasthenia Registry: treatment and outcomes in surgical intervention."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One of four adverse events reported for surgery was considered recombinant factor VIIa-treatment-related (non-fatal thromboembolic event in an adult female receiving recombinant factor VIIa+platelets+antifibrinolytics)."
    explanation: >-
      Supports the thromboembolic hazard named in the description and its
      observed rarity.
- name: Hormonal Control of Menorrhagia
  description: >-
    High-dose progesterone for severe menorrhagia, followed by maintenance oral
    contraception. Directed at the oestrogen-dominant proliferative endometrium
    rather than at the platelet defect, which is why it works where
    haemostatic agents alone do not.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:16722529
    reference_title: Glanzmann thrombasthenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It can be effectively treated with high doses of progesterone. Main- tenance treatment with birth control pills should follow."
    explanation: >-
      Supports the regimen described.
- name: Allogeneic Hematopoietic Stem Cell Transplantation
  description: >-
    The only curative option, and reserved for severe phenotypes because it
    trades a manageable bleeding disorder for transplant risk. The reported
    experience is small - 19 successful transplants in 18 type I patients, mean
    age 5 years, all alive at a median 25 months' follow-up - which is
    encouraging but far too short to establish long-term outcome, and 10 of
    those patients were already platelet-alloimmunized.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: Hematopoietic cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_mechanisms:
  - target: Biallelic Loss of Function in ITGA2B or ITGB3
    treatment_effect: RESTORES
    description: >-
      Replaces the patient's megakaryocyte lineage with donor cells carrying
      wild-type ITGA2B and ITGB3, correcting the defect at its origin.
    evidence:
    - reference: PMID:23868573
      reference_title: Indication for allogeneic stem cell transplantation in Glanzmann's thrombasthenia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "HSCT offers the only curative approach for patients with a severe clinical phenotype."
      explanation: >-
        Supports the curative claim and the restriction to severe phenotypes.
  evidence:
  - reference: PMID:23868573
    reference_title: Indication for allogeneic stem cell transplantation in Glanzmann's thrombasthenia.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "19 successful HSCT in 18 GT type I patients have been reported. Mean age at transplantation was 5 years. All patients are still alive. The majority received sibling bone marrow transplant with busulfan and cyclophosphamid conditioning. GvHD incidence was within the normal range, but 10 patients showed alloimmunization of thrombocytes. Median follow up is 25 months."
    explanation: >-
      PARTIAL because the reported series establishes short-term feasibility and
      survival but, at a 25-month median follow-up in 18 patients, cannot
      support a long-term outcome claim - which is the caveat this entry states.
animal_models:
- name: beta3-null mouse
  species: Mouse
  genotype: Itgb3 knockout (homozygous null)
  publication: PMID:9916135
  description: >-
    The reference model, and a faithful one for the haematological phenotype:
    beta3-null mice reproduce all the cardinal features of the human disease.
    They also reveal what a purely platelet-centred view of beta3 misses -
    because beta3 partners alphaV as well as alphaIIb, the null mouse develops
    placental defects and fetal mortality that have no established human
    counterpart.
  modeled_mechanisms:
  - target: Failure of Interplatelet Fibrinogen Bridging and Aggregation
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Reproduces defective platelet aggregation and clot retraction, the two
      integrin-dependent functions lost in the human disease.
    limitations: >-
      The mouse is a complete constitutional null, so it also lacks alphaVbeta3
      in every tissue; human patients with ITGA2B variants retain alphaVbeta3
      entirely, and the placental phenotype does not correspond to a documented
      human feature.
    readouts:
    - name: Platelet aggregation and clot retraction
      target: Failure of Interplatelet Fibrinogen Bridging and Aggregation
      direction: DECREASED
      interpretation: >-
        Direct functional correlate of the human aggregation defect.
      evidence:
      - reference: PMID:9916135
        reference_title: Beta3-integrin-deficient mice are a model for Glanzmann thrombasthenia showing placental defects and reduced survival.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "show all the cardinal features of GT (defects in platelet aggregation and clot retraction, prolonged bleeding times, and cutaneous and gastrointestinal bleeding)"
        explanation: >-
          Reports the measured aggregation and clot-retraction defects behind
          this readout.
    evidence:
    - reference: PMID:9916135
      reference_title: Beta3-integrin-deficient mice are a model for Glanzmann thrombasthenia showing placental defects and reduced survival.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In order to develop a mouse model of this disease and to further studies of hemostasis, thrombosis, and other suggested roles of beta3 integrins, we have generated a strain of beta3-null mice."
      explanation: >-
        Establishes the model as purpose-built for this disease.
  - target: Mucocutaneous Bleeding Diathesis
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Prolonged bleeding times with cutaneous and gastrointestinal bleeding, and
      anaemia from postnatal haemorrhage.
    limitations: >-
      Mouse bleeding is cutaneous and gastrointestinal; the mucosal sites that
      dominate the human picture (epistaxis, gingival haemorrhage, menorrhagia)
      have no direct murine counterpart, and reduced survival from postnatal
      haemorrhage exceeds what is seen in treated patients.
    readouts:
    - name: Bleeding time
      target: Mucocutaneous Bleeding Diathesis
      direction: INCREASED
      interpretation: >-
        Whole-animal haemostatic correlate of the plug-formation failure.
      evidence:
      - reference: PMID:9916135
        reference_title: Beta3-integrin-deficient mice are a model for Glanzmann thrombasthenia showing placental defects and reduced survival.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "prolonged bleeding times, and cutaneous and gastrointestinal bleeding"
        explanation: >-
          Reports the bleeding-time measurement and the bleeding sites observed.
    evidence:
    - reference: PMID:9916135
      reference_title: Beta3-integrin-deficient mice are a model for Glanzmann thrombasthenia showing placental defects and reduced survival.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Postnatal hemorrhage leads to anemia and reduced survival."
      explanation: >-
        Supports the whole-animal bleeding phenotype and the severity caveat
        recorded in the limitations.
differential_diagnoses:
- name: Bernard-Soulier Syndrome
  description: >-
    The mechanistic mirror image and the first disorder to exclude. Both give
    mucocutaneous bleeding with abnormal aggregometry, but Bernard-Soulier
    syndrome is a disorder of adhesion with large platelets and thrombocytopenia
    and absent ristocetin-induced agglutination, whereas here platelet count,
    size and ristocetin response are all normal.
  evidence:
  - reference: PMID:16722529
    reference_title: Glanzmann thrombasthenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Normal ristocetin-induced platelet agglutination and nor- mal platelet size clearly rule out the Bernard-Soulier syn- drome, a disorder of platelet adhesion."
    explanation: >-
      States the exact discriminators used here.
- name: Storage Pool Disease and Agonist-Specific Receptor Defects
  description: >-
    Aggregation defects confined to a single agonist point upstream, to that
    agonist's receptor or signalling pathway; a defective second wave of
    aggregation to ADP points to dense-granule storage pool disease; a defective
    response to arachidonic acid points to a thromboxane A2 synthesis defect -
    or to recent aspirin, the acquired phenocopy that must be excluded before
    any of these are diagnosed.
  evidence:
  - reference: PMID:16722529
    reference_title: Glanzmann thrombasthenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Deficiencies in the platelet response to arachidonic acid can point either to an inherited abnormality in thromboxane A2 formation or a platelet function defect temporarily acquired through aspirin ingestion."
    explanation: >-
      Supports the agonist-specific reasoning and the aspirin phenocopy warning.
- name: von Willebrand Disease and Congenital Afibrinogenemia
  description: >-
    Clotting disorders that can also disturb platelet function; excluded by
    normal coagulation parameters.
  evidence:
  - reference: PMID:16722529
    reference_title: Glanzmann thrombasthenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Normal coagulation parameters rule out clotting disorders that can also affect platelet function such as con- genital afibrinogenemia and von Willebrand disease."
    explanation: >-
      States the discriminator.
- name: Acquired Thrombasthenia
  description: >-
    An acquired autoantibody against alphaIIbbeta3, or pharmacological blockade
    by an alphaIIbbeta3 antagonist, reproduces the functional defect exactly.
    Must be excluded whenever there is no family history.
  evidence:
  - reference: PMID:16722529
    reference_title: Glanzmann thrombasthenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Acquired thrombasthenia must be eliminated in the absence of a family history of the disease."
    explanation: >-
      States the exclusion rule.
- name: ITGA2B/ITGB3-Related Macrothrombocytopenia
  description: >-
    Monoallelic variants disrupting the alphaIIb Arg995-beta3 Asp723 cytoplasmic
    salt bridge cause a dominant macrothrombocytopenia with platelet anisotropy,
    not classic thrombasthenia. The genes are the same and the mechanism is the
    opposite - increased rather than lost integrin activation - so a variant in
    ITGA2B or ITGB3 is not by itself a diagnosis of this disorder.
  evidence:
  - reference: PMID:22102273
    reference_title: Glanzmann thrombasthenia-like syndromes associated with Macrothrombocytopenias and mutations in the genes encoding the αIIbβ3 integrin.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations weakening this link (if not abolishing it) increase the activation state of αIIbβ3 and interfere with megakaryocytopoiesis."
    explanation: >-
      States the opposite-direction mechanism that distinguishes these variants
      from thrombasthenia alleles.
discussions:
- discussion_id: gap_severity_not_predicted_by_genotype
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why do patients carrying the same ITGA2B or ITGB3 variant differ so widely in
    bleeding frequency and severity?
  attaches_to:
  - pathophysiology#Mucocutaneous Bleeding Diathesis
  rationale: >-
    Clinical severity ranges from minimal bruising to fatal haemorrhage, and the
    source review states directly that individuals with the same mutation may
    differ widely. That means neither the causal genotype nor the residual
    receptor level (type I versus type II) is a sufficient predictor, so the
    modifier is elsewhere. This matters practically: prophylaxis and transplant
    decisions are severity-driven, and there is currently no molecular basis on
    which to make them. Candidate explanations include co-inherited prothrombotic
    variants, which have been reported to modulate the phenotype, and
    differences in vessel-wall or plasma-phase compensation.
  proposed_experiments:
  - experiment_id: exp_modifier_genotype_bleeding_score
    name: Genotype-stratified bleeding-score study with thrombophilia panel
    description: >-
      In a multinational registry, pair a standardized bleeding-assessment tool
      score with the causal genotype, the quantified residual alphaIIbbeta3, and
      a panel of prothrombotic modifier alleles. Testing whether modifier
      genotype explains within-variant variance would either yield a usable
      prognostic model or exclude the leading candidate explanation.
  evidence:
  - reference: PMID:16722529
    reference_title: Glanzmann thrombasthenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "with the same mutation may differ widely in the frequency and severity of bleeding"
    explanation: >-
      The observation that establishes this as a genuine gap rather than an
      artefact of imprecise phenotyping.
- discussion_id: mismatch_beta3_null_mouse_placental_phenotype
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Do the placental defects and fetal mortality of the beta3-null mouse
    correspond to any reproductive consequence in human ITGB3-related Glanzmann
    thrombasthenia?
  attaches_to:
  - pathophysiology#Quantitative or Qualitative Deficiency of Integrin alphaIIbbeta3
  rationale: >-
    The beta3-null mouse recapitulates the platelet phenotype faithfully but also
    shows placental defects leading to fetal mortality, which arise from loss of
    alphaVbeta3 rather than alphaIIbbeta3. Human ITGB3-null patients likewise
    lack alphaVbeta3, yet no corresponding placental disease is an established
    feature of the human disorder - while pregnancy in these patients is
    hazardous, the documented hazard is haemorrhagic. This is a mismatch of
    translational validity, not an absence of evidence: the mouse result is
    solid, and what is unresolved is whether it means anything for patients. The
    distinction matters because it separates a genuine unstudied risk from a
    species artefact of constitutional knockout, and because it applies only to
    the ITGB3 arm, not the ITGA2B arm.
  proposed_experiments:
  - experiment_id: exp_itgb3_pregnancy_outcome_registry
    name: Gene-stratified pregnancy outcome analysis
    description: >-
      Compare pregnancy outcomes - placental pathology, fetal growth
      restriction, and loss - between ITGB3-null and ITGA2B-null patients in an
      international registry, with haemorrhagic complications recorded
      separately so that a placental signal is not obscured by bleeding-driven
      outcomes. Equivalent outcomes across the two genotypes would settle the
      mouse finding as a species artefact.
  evidence:
  - reference: PMID:9916135
    reference_title: Beta3-integrin-deficient mice are a model for Glanzmann thrombasthenia showing placental defects and reduced survival.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Implantation appears to be unaffected, but placental defects do occur and lead to fetal mortality."
    explanation: >-
      The model-system finding whose human relevance is the open question.
notes: >-
  Conformance: this entry conforms to the `primary_hemostatic_plug_failure`
  module through the AGGREGATION arm - `#Failure of Integrin
  alphaIIbbeta3-Mediated Platelet Aggregation` - which is the arm the module
  reserves for a demonstrated failure of the final common aggregation step
  itself, and this is its worked example. It does not conform to the adhesion
  arm: GPIb-IX-V and GPVI are intact and ristocetin-induced agglutination is
  normal.

  Entry scope. MONDO:0100326 (Orphanet:849, OMIMPS:273800) is the umbrella term
  for classic autosomal recessive thrombasthenia and is used as the primary
  `disease_term`; MONDO:0031332 (GT1, ITGA2B) and MONDO:0031009 (GT2, ITGB3) are
  carried as `has_subtypes` because the two genotypes are clinically
  indistinguishable - the subunits are obligate partners, so losing either
  removes the same receptor - and splitting them into separate entries would
  duplicate one pathograph. The type I / type II / variant classes are carried
  as subtypes too, but they are a phenotypic severity axis crossing both genes,
  not additional genotypes; they earn their place because "variant GT" is the
  form a quantitative flow-cytometry screen misses.

  What is deliberately NOT in this entry. The dominant ITGA2B/ITGB3
  macrothrombocytopenias caused by variants at the alphaIIb Arg995-beta3 Asp723
  cytoplasmic salt bridge (OMIM BDPLT16, BDPLT24) are a different disease with
  the opposite mechanism - increased integrin activation interfering with
  megakaryocytopoiesis, rather than lost integrin function - and are recorded
  here only as a differential diagnosis and a caveat in the ITGB3 gene block.
  Leukocyte adhesion deficiency III (FERMT3/kindlin-3) produces a
  thrombasthenia-like platelet phenotype through failure of integrin activation
  with a structurally normal receptor, plus infections; it belongs to the
  signalling arm of the module, not here.

  Prevalence is deliberately left unquantified at worldwide level. The source
  review explicitly declines to estimate it, because ascertainment is dominated
  by consanguineous populations; recording a rate derived from case series would
  be a fabrication dressed as a measurement. The qualitative COMMON band in the
  named populations is recorded separately and carries no numerator.

  Evidence base. The backbone is the Orphanet Journal of Rare Diseases review
  (PMID:16722529), which is cached as full text, so several snippets here are
  drawn from the body rather than the abstract and carry the hyphenation
  artefacts of PDF extraction, where a word broken across a line in the
  original survives as a hyphen plus a space mid-word. These are faithful to
  the cached text and are not transcription errors; the affected snippets are
  in the diagnosis, differential-diagnosis and iron-deficiency-anaemia blocks. Registry-level treatment evidence comes from PMID:26001792, the
  alloimmunization mechanism from PMID:33090654, the macrothrombocytopenia
  boundary from PMID:22102273, and the animal model from PMID:9916135.

  Curation provenance. This entry was curated by direct review of the cached
  full text and abstracts of the references listed in `references:`, not from a
  deep-research provider artifact, so there is no corresponding file under
  `research/`. Candidate PMIDs were located by PubMed search and each was
  fetched with `just fetch-reference` before use; several initially plausible
  identifiers turned out to be unrelated papers and were discarded rather than
  cited on their titles. Every snippet in this entry is an exact substring of
  the cached reference text.

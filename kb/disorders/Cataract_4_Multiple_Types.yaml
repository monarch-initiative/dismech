genetic:
- name: CRYGD
  gene_term:
    preferred_term: CRYGD
    term:
      id: hgnc:2411
      label: CRYGD
  relationship_type: CAUSATIVE
  association: Causative
  variant_origin: GERMLINE
  presence: PRESENT
  notes: >-
    Residue numbering differs between reports. Much of the biophysical
    literature numbers the processed protein without the initiator
    methionine (R14C, P23T, R36S, R58H, W42R), while HGVS numbering from the
    coding sequence adds one (p.R15C, p.P24T, p.R37S, p.R59H, p.W43R). The
    recurrent c.70C>A (P23T, p.P24T) allele has been reported in Moroccan,
    Indian, Australian, Caucasian, Saudi and Chinese families. No ClinGen
    gene-disease validity record for CRYGD is cached in this repository, so
    gene_disease_validity is omitted; the published ClinGen-protocol
    curation cited below is not a ClinGen-issued assertion.
  evidence:
  - reference: PMID:9927684
    reference_title: "Progressive juvenile-onset punctate cataracts caused by mutation of the gammaD-crystallin gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A genome-wide search in our kindred revealed linkage at 2q33-35 where the gamma-crystallin gene cluster resides."
    explanation: Linkage to the gamma-crystallin cluster preceded identification of R14C.
  - reference: PMID:12676897
    reference_title: "Gamma-D crystallin gene (CRYGD) mutation causes autosomal dominant congenital cerulean cataracts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The maximum lod score (7.19 at recombination fraction theta=0) was obtained for marker D2S2208 near the gamma-crystallin gene (CRYG) cluster."
    explanation: Significant linkage to the CRYG cluster in the P23T family.
  - reference: PMID:14693780
    reference_title: "Investigation of crystallin genes in familial cataract, and report of two disease associated mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sequencing revealed a P23T mutation of CRYGD, found to segregate with disease."
    explanation: Independent Australian family linked to the gamma-crystallin locus.
  - reference: PMID:37337769
    reference_title: "Mutational spectrum in a Chinese cohort with congenital cataracts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "27.37% of variants (23/84) were commonly detected in PAX6, GJA8 and CRYGD, and the three genes covered 33.06% of cases (41/124) with molecular diagnosis."
    explanation: >-
      In a Chinese panel-sequencing cohort CRYGD was one of the three most
      frequently mutated genes; the 33.06% figure is for the three genes
      together, not for CRYGD alone.
  - reference: PMID:42091610
    reference_title: "Evaluating gene-disease relationship strength in crystallin genes in association with pediatric cataracts."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Seven genes (CRYAA, CRYAB, CRYBA1, CRYBB1, CRYBB2, CRYGC, CRYGD) scored as Definitively associated with autosomal dominant (AD) inherited pediatric cataracts."
    explanation: >-
      Published curation using ClinGen protocols scores CRYGD as definitive
      for dominant pediatric cataract.
    quote_role: REVIEW_SYNTHESIS
  variants:
  - name: R14C (p.Arg15Cys)
    description: >-
      Introduces an exposed cysteine; causes progressive juvenile-onset
      cataract through thiol-mediated oligomerization.
    evidence:
    - reference: PMID:10688888
      reference_title: "Molecular basis of a progressive juvenile-onset hereditary cataract."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We have expressed recombinant wild-type human gammaD crystallin (HGD) and its Arg-14 to Cys mutant (R14C) in Escherichia coli and show that R14C forms disulfide-linked oligomers, which markedly raise the phase separation temperature of the protein solution."
      explanation: Biophysical behavior of R14C.
  - name: P23T (p.Pro24Thr, c.70C>A)
    description: >-
      Recurrent allele with markedly lowered, retrograde solubility;
      associated with coralliform, cerulean, aculeiform, lamellar and
      fasciculiform cataract.
    evidence:
    - reference: PMID:37480084
      reference_title: "Congenital coralliform cataract is the predominant consequence of a recurrent mutation in the CRYGD gene."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A recurrent p.P24T CRYGD mutation occurs independently in 83.3% of the Chinese families with congenital coralliform cataracts and most likely represents a mutational hot spot, which underscore the relations between coralliform cataract and p.P24T CRYGD."
      explanation: Recurrence and mutational hotspot status of P24T.
  - name: R36S (p.Arg37Ser)
    description: Crystal-forming allele causing crystalline cataract.
    evidence:
    - reference: PMID:22219628
      reference_title: "Crystalline cataract caused by a heterozygous missense mutation in γD-crystallin (CRYGD)."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The heterozygous 109C→A CRYGD missense mutation is associated with a distinct crystalline cataract in two US Caucasian pedigrees."
      explanation: R36S is associated with crystalline cataract in two pedigrees.
  - name: R58H (p.Arg59His)
    description: Crystal-forming allele recurrent in aculeiform cataract.
    evidence:
    - reference: PMID:16030500
      reference_title: "CRYGD gene analysis in a family with autosomal dominant congenital cataract: evidence for molecular homogeneity and intrafamilial clinical heterogeneity in aculeiform cataract."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A heterozygous missense mutation consisting of a G to A transition at nucleotide position 411 in exon 2 that predicts an Arg to His replacement in residue 58 (R58H) of the CRYGD protein was demonstrated."
      explanation: R58H in a four-generation Mexican family.
  - name: W43R (p.Trp43Arg, c.127T>C)
    description: Destabilizing allele causing congenital nuclear cataract.
    evidence:
    - reference: PMID:21031598
      reference_title: "A novel CRYGD mutation (p.Trp43Arg) causing autosomal dominant congenital cataract in a Chinese family."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Sequencing of the CRYGD gene revealed a c.127T>C transition, which resulted in a substitution of a highly conserved tryptophan with arginine at codon 43 (p.Trp43Arg)."
      explanation: Identification of W43R.
  - name: Y151X (c.451_452insGACT)
    description: >-
      Truncating allele in Greek key motif 4 that destabilizes the protein
      and forms insoluble aggregates in cultured cells.
    evidence:
    - reference: PMID:39084439
      reference_title: "Truncation mutations of CRYGD gene in congenital cataracts cause protein aggregation by disrupting the structural stability of γD-crystallin."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In our cohort, we identified a nonsense mutation (c.451_452insGACT, p.Y151X) in the CRYGD gene."
      explanation: Identification of Y151X in a congenital cataract cohort.
diagnosis:
- name: Slit-lamp examination
  description: >-
    Slit-lamp biomicroscopy establishes the presence, laterality and
    morphology of the opacity. Several CRYGD morphologies (coralliform,
    aculeiform, cerulean, crystalline) are distinctive at the slit lamp, but
    morphology suggests rather than establishes the gene: the most commonly
    documented cause of cerulean cataract is a CRYBB2 allele (PMID:19633732),
    and coralliform cataract
    has also been reported with a connexin 46 insertion (PMID:37480084).
  diagnosis_term:
    preferred_term: slit-lamp examination
    term:
      id: NCIT:C75583
      label: Slit-lamp Examination
  evidence:
  - reference: PMID:35222542
    reference_title: "Case Report: A Novel Mutation in the CRYGD Gene Causing Congenital Cataract Associated with Nystagmus in a Chinese Family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The proband, a 35-year-old female, was diagnosed as bilateral nuclear congenital cataract in both eyes observed by the slit-lamp biomicroscope (Figures 1A,B)."
    explanation: Slit-lamp biomicroscopy used to diagnose and characterize the cataract in the S78F family.
  - reference: PMID:21031598
    reference_title: "A novel CRYGD mutation (p.Trp43Arg) causing autosomal dominant congenital cataract in a Chinese family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The phenotypes were documented by slit lamp photography."
    explanation: Slit-lamp photography documented the nuclear morphology in the W43R family.
  - reference: PMID:22219628
    reference_title: "Crystalline cataract caused by a heterozygous missense mutation in γD-crystallin (CRYGD)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Several phenotypically unique morphologic variants have been previously described, and are easily recognizable by the examining ophthalmologist."
    explanation: Distinctive inherited cataract morphologies, several of them CRYGD-associated, are recognizable on examination.
- name: Multigene panel sequencing
  description: >-
    Panel-based next-generation sequencing of known cataract and eye genes,
    with Sanger confirmation and family segregation, is the usual route to a
    CRYGD diagnosis, since the clinical appearance does not identify the gene.
  diagnosis_term:
    preferred_term: multi-gene panel sequencing
    term:
      id: NCIT:C198412
      label: Multi-gene Panel Sequencing
  evidence:
  - reference: PMID:37337769
    reference_title: "Mutational spectrum in a Chinese cohort with congenital cataracts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Probands (n = 164) with congenital cataracts and their affected or unaffected available family members were recruited for clinical examinations and panel-based next-generation sequencing, then classified into a cohort for further mutational analysis."
    explanation: Panel sequencing was the diagnostic method in a congenital cataract cohort in which CRYGD was a leading gene.
  - reference: PMID:37337769
    reference_title: "Mutational spectrum in a Chinese cohort with congenital cataracts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "56.88% (124/218) of patients received a molecular diagnosis"
    explanation: Diagnostic yield of panel sequencing in the same cohort, all genes together.
- name: Targeted CRYGD sequencing
  description: >-
    Sanger sequencing of the CRYGD coding exons confirms a known familial
    variant or tests a phenotype strongly associated with CRYGD, such as
    coralliform cataract, where the recurrent c.70C>A allele predominates.
  diagnosis_term:
    preferred_term: Sanger sequencing
    term:
      id: NCIT:C19641
      label: Dideoxy Chain Termination DNA Sequencing
  evidence:
  - reference: PMID:37480084
    reference_title: "Congenital coralliform cataract is the predominant consequence of a recurrent mutation in the CRYGD gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Direct sequencing of the entire coding region of CRYGD in 12 unrelated families with CC identified a recurrent c. 70 C > A mutation in 10 unrelated families"
    explanation: Targeted CRYGD sequencing identified the causal allele in 10 of 12 coralliform cataract families.
animal_models:
- name: Crygd Lop12 mouse
  species: Mouse
  genotype: Crygd(Lop12), exon 3 nonsense allele producing a 156-residue truncated protein; semidominant
  publication: PMID:10704279
  description: >-
    Spontaneous semidominant mutant with an irregular nuclear lens opacity,
    caused by a premature stop codon in mouse Crygd.
  modeled_mechanisms:
  - target: Lens Light Scattering and Loss of Transparency
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    limitations: >-
      The mouse allele is a truncation not reported in humans, and the mouse
      gamma-crystallin gene cluster is not equivalent to the human one, so
      the share of total gamma-crystallin contributed by the mutant protein
      may not be comparable.
    evidence:
    - reference: PMID:10704279
      reference_title: "Lop12, a mutation in mouse Crygd causing lens opacity similar to human Coppock cataract."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Lens opacity 12 (Lop12) is a semidominant mutation that results in an irregular nuclear lens opacity similar to the human Coppock cataract."
      explanation: A Crygd truncation causes nuclear lens opacity in mice.
- name: Crygd Aey4 (V76D) mouse
  species: Mouse
  genotype: Crygd(Aey4), T to A in exon 2, p.Val76Asp; dominant ENU allele
  publication: PMID:12226711
  description: >-
    ENU-induced dominant mutant with dense nuclear cataract and retained cell
    nuclei throughout the lens.
  modeled_mechanisms:
  - target: Lens Light Scattering and Loss of Transparency
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    limitations: >-
      V76D is a mouse core substitution, not a human allele; the human
      alleles studied in most detail alter the protein surface instead. The
      retained fiber cell nuclei have not been described in human CRYGD
      cataract.
    evidence:
    - reference: PMID:12226711
      reference_title: "V76D mutation in a conserved gD-crystallin region leads to dominant cataracts in mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The slit-lamp examination revealed a strong nuclear cataract surrounded by a homogeneous milky opacity in the inner cortex."
      explanation: Dominant nuclear cataract from a Crygd missense allele.
treatments:
- name: Cataract Surgery
  description: >-
    Lens extraction is the standard management of visually significant
    CRYGD cataract, performed from early infancy for dense congenital
    opacities and in childhood or adolescence for the progressive R14C
    cataract. In paediatric cataract generally it is lens aspiration with or
    without intraocular lens implantation, followed by amblyopia therapy, and
    for dense bilateral congenital cataract the timing of surgery in the first
    weeks of life governs visual outcome. The timing and technique evidence
    comes from cohorts that were not genotyped. Complications after
    paediatric cataract surgery include secondary membranes over the visual
    axis requiring re-operation and glaucoma, both more frequent after
    surgery in the first four weeks of life. No CRYGD-specific therapy
    exists.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: cataract surgery
    term:
      id: NCIT:C157809
      label: Cataract Surgery
  target_phenotypes:
  - preferred_term: Developmental cataract
    term:
      id: HP:0000519
      label: Developmental cataract
  evidence:
  - reference: PMID:9927684
    reference_title: "Progressive juvenile-onset punctate cataracts caused by mutation of the gammaD-crystallin gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The opacification evolves relatively slowly, generally necessitating removal of the lens in childhood or early adolescence."
    explanation: Lens removal in the R14C kindred.
  - reference: PMID:21031598
    reference_title: "A novel CRYGD mutation (p.Trp43Arg) causing autosomal dominant congenital cataract in a Chinese family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients had undergone cataract extraction during childhood."
    explanation: Childhood cataract extraction in every W43R carrier.
  - reference: PMID:19633732
    reference_title: "Founder heterozygous P23T CRYGD mutation associated with cerulean (and coralliform) cataract in 2 Saudi families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Their father and 2 older brothers, all of whom underwent childhood cataract surgery, also harbored the mutation while the 2 asymptomatic immediate family members did not."
    explanation: Childhood cataract surgery in P23T carriers.
  - reference: PMID:19084444
    reference_title: "The critical period for surgical treatment of dense congenital bilateral cataracts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "During weeks 0-14, mean visual acuity decreased by 1 line with each 3 weeks' delay in surgery."
    explanation: >-
      Prospective cohort of 37 infants with dense bilateral congenital
      cataract of unspecified cause; indirect because the cohort was not
      genotyped for CRYGD.
  - reference: PMID:42216740
    reference_title: "Overview of paediatric cataract in Malaysia."
    supports: SUPPORT
    evidence_source: OTHER
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: "Surgical treatment, mainly lens aspiration with or without intraocular lens implantation, is effective, but visual prognosis depends on early intervention and adherence to amblyopia therapy."
    explanation: Overview of paediatric cataract of all causes describing the surgical approach and the need for amblyopia therapy.
  - reference: PMID:19084444
    reference_title: "The critical period for surgical treatment of dense congenital bilateral cataracts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "8% (6/74 eyes) developed a secondary membrane requiring re-operation, and 8% (6/74 eyes) developed glaucoma that required treatment with medication and/or surgery during the follow-up period"
    explanation: >-
      Postoperative secondary membranes and glaucoma in the same ungenotyped
      congenital cataract cohort.
  - reference: PMID:19084444
    reference_title: "The critical period for surgical treatment of dense congenital bilateral cataracts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "whereas surgery during the first 4 weeks was associated with a greater prevalence of secondary membrane formation and glaucoma"
    explanation: Very early surgery is associated with more secondary membranes and glaucoma.
discussions:
- discussion_id: p23t_morphological_variability
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Lens Light Scattering and Loss of Transparency
  - phenotypes#Coralliform cataract
  - phenotypes#Cerulean cataract
  - phenotypes#Aculeiform cataract
  prompt: >-
    Why does one CRYGD allele produce several distinct lens morphologies,
    sometimes in siblings?
  rationale: >-
    P23T has been reported with coralliform, cerulean, aculeiform, lamellar
    and fasciculiform cataract, and R58H with both aculeiform and coral-like
    cataract within one family. The biophysics of each mutant protein is well
    characterized, but nothing in this entry explains how the same condensed
    phase or crystal produces different spatial patterns of opacity.
    Modifier loci, the timing of mutant expression across fiber cell
    generations, and environmental factors are untested possibilities.
  evidence:
  - reference: PMID:19633732
    reference_title: "Founder heterozygous P23T CRYGD mutation associated with cerulean (and coralliform) cataract in 2 Saudi families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Coralliform cataract can represent variable expressivity for the same mutation rather than a distinct entity."
    explanation: Siblings with the same allele and different morphologies.
  - reference: PMID:16030500
    reference_title: "CRYGD gene analysis in a family with autosomal dominant congenital cataract: evidence for molecular homogeneity and intrafamilial clinical heterogeneity in aculeiform cataract."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Intrafamilial clinical heterogeneity was observed as one affected member exhibited a coral-like cataract."
    explanation: Different morphology within an R58H family.
  - reference: PMID:14767902
    reference_title: "[Localization and screening of autosomal dominant coralliform cataract associated gene]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "thus providing evidence that the same genetic defect may be associated with different opacity location"
    explanation: The authors note that their coralliform P23T allele was previously reported with lamellar cataract.
- discussion_id: no_aggregation_targeted_therapy
  kind: KNOWLEDGE_GAP
  attaches_to:
  - treatments#
  - pathophysiology#Gamma-D Crystallin Aggregation in Lens Fiber Cells
  prompt: >-
    Can a small molecule that restores mutant gamma-D crystallin solubility
    prevent or slow opacity in vivo?
  rationale: >-
    Surgery is the only treatment. A chemical chaperone, sodium
    4-phenylbutyrate, restored solubility of a frameshift mutant in cultured
    cells, and second-site substitutions near residue 23 restore P23T
    solubility in vitro, but no study reviewed here tested a
    solubility-restoring agent in a Crygd mouse or in patients. The
    progressive R14C form, whose lenses are clear at birth, is the setting
    where such an agent could matter most.
  evidence:
  - reference: PMID:20577655
    reference_title: "Sodium 4-phenylbutyrate ameliorates the effects of cataract-causing mutant gammaD-crystallin in cultured cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "4-PBA treatment reduced the defective phenotype of mutant G165fsX8 CRYGD and rescued the affected cells from apoptosis."
    explanation: Chemical chaperone rescue in COS-7 cells only.
  - reference: PMID:15709761
    reference_title: "Decrease in protein solubility and cataract formation caused by the Pro23 to Thr mutation in human gamma D-crystallin."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We examined the mutants P23S, P23V, P23TInsP24, and P23TN24K and found that the latter two mutations can restore the solubility of the P23T mutant."
    explanation: Second-site substitutions restore P23T solubility in vitro.
notes: >-
  No GeneReviews chapter covers CRYGD cataract. A fasciculiform cataract
  family carrying c.70C>A (PMID:15064679) is represented through its lens
  histology rather than as a phenotype row, because HPO has no fasciculiform
  cataract term (`runoak -i ols:hp info "l~fasciculiform"` returns nothing).
  The R14C family's report describes the opacities as punctate only in its
  title, so punctate morphology is not carried as a separate phenotype row.

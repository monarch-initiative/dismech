- name: Gamma-D Crystallin Destabilization and Hydrophobic Exposure
  biological_scale: MOLECULAR
  description: >-
    A second group of alleles does perturb the protein. W43R (W42R in
    processed-protein numbering) lowers stability, and in vitro the W42R
    mutant aggregates through a non-native internal disulfide that locks a
    misfolded, aggregation-prone intermediate. C-terminal truncations
    (W156X, Y151X, T160RfsX8) disrupt Greek key motif 4, destabilize the
    protein and expose hydrophobic side chains to solvent. In cultured cells
    heat, UV and oxidative stress increase aggregation of truncated mutants,
    and co-expressed alpha-crystallins reduce it.
  cell_types:
  - preferred_term: lens fiber cell
    term:
      id: CL:0011004
      label: lens fiber cell
  biological_processes:

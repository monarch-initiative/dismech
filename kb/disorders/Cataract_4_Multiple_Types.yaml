inheritance:
- name: Autosomal Dominant
  description: >-
    Heterozygous CRYGD variants segregate with cataract in multigenerational
    families, and recurrent alleles (P23T, R58H, R36S) arise independently in
    unrelated families of different ancestries.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:9927684
    reference_title: "Progressive juvenile-onset punctate cataracts caused by mutation of the gammaD-crystallin gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we describe the genetic alteration responsible for a progressive form of cataract, segregating as an autosomal dominant trait in a three-generation pedigree."
    explanation: Dominant segregation of the R14C cataract in a three-generation kindred.
  - reference: PMID:12676897
    reference_title: "Gamma-D crystallin gene (CRYGD) mutation causes autosomal dominant congenital cerulean cataracts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Furthermore, this is the first report of a mutation in this gene resulting in autosomal dominant congenital cerulean cataracts."
    explanation: Heterozygous P23T segregating with dominant cataract in a four-generation Moroccan family.
  - reference: PMID:37480084
    reference_title: "Congenital coralliform cataract is the predominant consequence of a recurrent mutation in the CRYGD gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A recurrent c.70 C > A (p. P24T) mutation in CRYGD was identified in 10 families (83.3%) with congenital cataract, which co-segregated with all affected individuals and was not observed in unaffected family members or ethnically matched normal controls."
    explanation: Co-segregation of the heterozygous recurrent allele in ten independent families.
pathophysiology:
- name: CRYGD Pathogenic Variant
  biological_scale: MOLECULAR
  conforms_to: cataract_lens_opacification#Lens Homeostasis Insult
  description: >-
    Heterozygous missense, nonsense and frameshift variants in CRYGD. Most
    pathogenic missense alleles change surface residues (R14C, P23T, R36S,
    R58H, E107A); others change structurally critical residues (W43R) or
    truncate the C-terminal Greek key motifs (W156X, Y134X, and frameshifts).
    The biophysical studies below attribute the cataract to properties gained
    by the mutant protein. One allele points the other way: in transfected
    cells R36P lowers the total and soluble amount of gamma-D crystallin
    without increasing the insoluble fraction, so a reduced soluble pool may
    contribute for some alleles; this has not been tested in lens.
  genes:
  - preferred_term: CRYGD
    term:
      id: hgnc:2411
      label: CRYGD
  molecular_functions:
  - preferred_term: structural constituent of eye lens
    term:
      id: GO:0005212
      label: structural constituent of eye lens
    modifier: ABNORMAL
    description: >-
      Gamma-D crystallin serves the lens as a densely packed, highly soluble
      structural protein. Mutant protein is still made and often folds
      normally, but it no longer stays in solution with its neighbours; the
      structural role is altered qualitatively rather than reduced in amount,
      hence ABNORMAL rather than DECREASED.

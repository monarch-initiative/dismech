name: Cataract 4, Multiple Types
creation_date: "2026-10-15T17:00:00Z"
category: Mendelian
parents:
- Early-onset non-syndromic cataract
synonyms:
- CTRCT4
- cataract 4, multiple types
- CRYGD-related cataract
- cataract (disease) caused by mutation in CRYGD
- gamma-D crystallin cataract
description: >-
  Autosomal dominant, non-syndromic early-onset cataract caused by heterozygous
  variants in CRYGD, which encodes gamma-D crystallin, one of the most abundant
  monomeric structural proteins of the lens fiber cell cytoplasm. Most
  families have a congenital, bilateral cataract that is present at birth, but
  the first reported allele (R14C) causes a progressive cataract that appears
  in the first years of life and evolves slowly through childhood. The
  disease is named for its morphological diversity: coralliform, aculeiform,
  cerulean, crystalline, nuclear, lamellar and fasciculiform cataracts have
  all been reported, and the recurrent P23T allele alone has produced most of
  these morphologies, sometimes within one family. Biophysical work on
  recombinant mutant proteins established an unusual mechanism for several
  alleles: the mutant protein keeps a native fold and normal stability but
  has a sharply reduced solubility, so it aggregates (R14C through
  disulfide-linked oligomers, P23T through a condensed phase with inverted
  temperature dependence, E107A as light-scattering particles) or
  crystallizes in the lens (R36S and R58H). Other alleles, such as W43R and
  C-terminal truncations, instead destabilize the fold and expose hydrophobic
  surfaces that drive aggregation. Both routes converge on light scattering
  and lens opacity, causing visual impairment that, when the cataract is
  dense, is complicated by nystagmus and amblyopia. Management is surgical
  lens extraction; there is no disease-specific therapy.

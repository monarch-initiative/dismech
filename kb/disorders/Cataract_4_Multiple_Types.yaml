    snippet: "The deletion of C-terminal 18 residues of human gammaC- and gammaD-crystallins exposes the side chains of several hydrophobic residues in the sequence to the solvent, causing the molecule to self-aggregate."
    explanation: The W156X truncation exposes hydrophobic residues.

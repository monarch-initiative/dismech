    explanation: Congenital bilateral onset across the series.
  - reference: PMID:12676897
    reference_title: "Gamma-D crystallin gene (CRYGD) mutation causes autosomal dominant congenital cerulean cataracts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sequencing of the coding regions of the CRYGA, B, C, and D genes showed the presence of a heterozygous C>A transversion in exon 2 of CRYGD that is associated with cataracts in this family."
    explanation: Congenital cataract in the Moroccan P23T family.
  sequelae:
  - target: Amblyopia
    description: >-
      A dense opacity present in early infancy deprives the developing visual
      system of a formed image, causing deprivation amblyopia unless the lens
      is removed early.
    evidence:
    - reference: PMID:19084444
      reference_title: "The critical period for surgical treatment of dense congenital bilateral cataracts."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: "Deprivation amblyopia may be minimized with early surgery for dense congenital bilateral cataracts."
      explanation: >-
        Cohort of infants with dense bilateral congenital cataract of
        unspecified cause; indirect because it was not genotyped for CRYGD.
  - target: Nystagmus
    description: >-
      Nystagmus follows early form deprivation from a dense congenital
      opacity and is more frequent when surgery is delayed.
    evidence:
    - reference: PMID:19084444
      reference_title: "The critical period for surgical treatment of dense congenital bilateral cataracts."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: "Surgery after 4 weeks was associated with a greater prevalence of strabismus and nystagmus than surgery before 4 weeks"
      explanation: >-
        Longer deprivation before surgery is associated with more nystagmus;
        indirect because the cohort was not genotyped for CRYGD.
- category: Ophthalmologic
  name: Progressive juvenile-onset cataract
  description: >-
    The R14C kindred had lenses that were clear at birth, opacities first
    seen in the first year or two of life, and slow progression that usually
    required lens removal in childhood or early adolescence.

    explanation: Recurrent P23T allele in a linked Caucasian pedigree.
  - reference: PMID:21031598
    reference_title: "A novel CRYGD mutation (p.Trp43Arg) causing autosomal dominant congenital cataract in a Chinese family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This mutation co-segregated with all affected individuals and was not observed in either unaffected family members or in 200 normal unrelated individuals."
    explanation: W43R co-segregates with congenital nuclear cataract and is absent from controls.
  - reference: PMID:39563676

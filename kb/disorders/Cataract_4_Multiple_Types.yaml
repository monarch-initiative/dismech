- name: Reduced Gamma-D Crystallin Solubility With Preserved Native Fold
  biological_scale: MOLECULAR
  conforms_to: cataract_lens_opacification#Loss of Crystallin Solubility and Chaperone Capacity
  description: >-
    For R14C, P23T, R36S, R58H and E107A the recombinant mutant protein has
    essentially the secondary structure, tertiary structure and conformational
    stability of wild type. What changes is its intermolecular behavior: an
    extra exposed cysteine (R14C), a solubility that falls as temperature
    rises (P23T), or loss of the arginine side chain whose absence allows
    crystal packing (R36S) or removes an intermolecular ion pair (R58H). These
    alleles showed that unfolding is not required for a crystallin to cause
    cataract.
  cell_types:
  - preferred_term: lens fiber cell
    term:
      id: CL:0011004
      label: lens fiber cell
  evidence:
  - reference: PMID:10688888
    reference_title: "Molecular basis of a progressive juvenile-onset hereditary cataract."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Thus, contrary to current views, unfolding or destabilization of the protein is not necessary for cataractogenesis."
    explanation: R14C and wild type have nearly identical structure and stability.
  - reference: PMID:15709761
    reference_title: "Decrease in protein solubility and cataract formation caused by the Pro23 to Thr mutation in human gamma D-crystallin."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The results show that the cataract-causing mutation P23T does not exhibit any significant structural change relative to the native protein. However, in marked contrast to the native protein, the mutant shows a dramatically lowered solubility."
    explanation: P23T keeps its fold but loses solubility.
  - reference: PMID:15709761
    reference_title: "Decrease in protein solubility and cataract formation caused by the Pro23 to Thr mutation in human gamma D-crystallin."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We found that the solubility of the P23T mutant exhibits an inverse dependence on temperature, i.e., the protein clusters are increasingly soluble as the temperature of the solution decreases."
    explanation: Retrograde solubility of P23T, so clusters are least soluble at higher temperature.
  - reference: PMID:31422822
    reference_title: "Temperature-Dependent Interactions Explain Normal and Inverted Solubility in a γD-Crystallin Mutant."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This contact, at the P23T substitution site, relates to a genetic cataract and reveals at a molecular level the origin of the lowered and retrograde solubility of the protein."
    explanation: Crystal structures trace the inverted solubility to a temperature-dependent contact at residue 23.
  - reference: PMID:21197114
    reference_title: "Structural and aggregation behavior of the human γD-crystallin mutant E107A, associated with congenital nuclear cataract."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Its solubility, however, was over hundred-fold less than that of the wild type, and it had the tendency to precipitate and form light scattering particles."
    explanation: E107A is structurally normal but more than a hundred-fold less soluble.
  - reference: PMID:11371638
    reference_title: "Crystal cataracts: human genetic cataract caused by protein crystallization."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Measurements of the solubility curves of crystals of the Arg-58 to His and Arg-36 to Ser mutants of gammaD crystallin show that the mutations dramatically lower the solubility of the protein."
    explanation: R58H and R36S lower crystal solubility.
  - reference: PMID:11371638
    reference_title: "Crystal cataracts: human genetic cataract caused by protein crystallization."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "It should be noted that, although there is a marked difference in phase behavior, there is no significant difference in protein conformation among the three proteins."
    explanation: R58H and R36S keep the wild-type conformation.

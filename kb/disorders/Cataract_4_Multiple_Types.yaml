    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Biophysical studies indicated that the p.Trp43Arg mutation resulted in significant tertiary structural changes."
    explanation: W43R alters tertiary structure of the recombinant protein.
  - reference: PMID:18421082

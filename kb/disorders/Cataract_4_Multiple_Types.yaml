    evidence_source: HUMAN_CLINICAL
    snippet: "A single base alteration resulting in an Arg- 14 --> Cys (R14C) substitution in gammaD-crystallin was subsequently identified."
    explanation: First disease-causing CRYGD allele, found after linkage to the gamma-crystallin cluster.
  - reference: PMID:37480084
    reference_title: "Congenital coralliform cataract is the predominant consequence of a recurrent mutation in the CRYGD gene."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "The solubility and stability of γD-crystallin is indispensable for the lens transparency. Mutation in CRYGD gene may destroy the solubility and stability of the crystallin proteins, subsequently reduce lens transparency causing CC."
    explanation: >-
      States the structural requirement that CRYGD variants compromise:
      gamma-D crystallin must stay soluble and stable for the lens to remain
      transparent. Discussion text restating established biophysics.
  - reference: PMID:10915766
    reference_title: "Link between a novel human gammaD-crystallin allele and a unique cataract phenotype explained by protein crystallography."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sequencing of the CRYGD gene has shown a heterozygous C-->A transversion in position 109 of the inferred cDNA (36R-->S transversion of the processed, N-terminal methionine-lacking CRYGD)."
    explanation: Heterozygous R36S allele in a child with crystal cataract.
  - reference: PMID:15041957

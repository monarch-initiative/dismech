diagnosis:
- name: Cytologic Evaluation of Peri-Implant Effusion
  description: >-
    Fresh peri-implant effusion fluid should be processed promptly for
    cytomorphology; cytocentrifugation and filtration are prioritized because
    fluid-dominant disease is the common presentation.
  diagnosis_term:
    preferred_term: clinical cytological testing
    term:
      id: NCIT:C16490
      label: Cytological Procedure
  evidence:
  - reference: PMID:32045544
    reference_title: Best Practices Guideline for the Pathologic Diagnosis of Breast Implant-Associated Anaplastic Large-Cell Lymphoma.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The first priority is cytocentrifugation and filtration of fresh, unfixed
      effusion fluid to produce air-dried smears that are stained with
      Wright-Giemsa or other Romanowsky-type stains.
    explanation: >-
      The guideline directly specifies first-priority processing of fresh
      effusion fluid for cytologic diagnosis.
- name: Cell Block Immunohistochemistry and T-Cell Clonality Testing
  description: >-
    A cell block supports hematoxylin-eosin morphology and
    immunohistochemistry; polymerase-chain-reaction testing of T-cell receptor
    rearrangement can assess clonality.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  markers: CD30, T-cell receptor gene rearrangement
  evidence:
  - reference: PMID:32045544
    reference_title: Best Practices Guideline for the Pathologic Diagnosis of Breast Implant-Associated Anaplastic Large-Cell Lymphoma.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Cell block sections can be used for polymerase chain reaction-based
      investigation of T-cell receptor gene rearrangement to detect clonality.
    explanation: >-
      The guideline directly supports cell-block-based molecular clonality
      testing.
- name: Mapped Capsulectomy Specimen Evaluation
  description: >-
    When a capsulectomy is performed, fixation and mapped representative
    sections determine microscopic involvement and capsular invasion.
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  evidence:
  - reference: PMID:32045544
    reference_title: Best Practices Guideline for the Pathologic Diagnosis of Breast Implant-Associated Anaplastic Large-Cell Lymphoma.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Fixation and mapping of the capsulectomy specimen to select multiple
      representative sections are advised to assess for microscopic tumor
      involvement and capsular invasion.
    explanation: >-
      The guideline directly specifies mapped evaluation of the capsulectomy
      specimen.
differential_diagnoses:
- name: Reactive Late Peri-Implant Seroma
  description: >-
    Benign peri-implant fluid can produce the same breast-swelling presentation
    as fluid-dominant BIA-ALCL.
  distinguishing_features:
  - Cytologic evaluation of the effusion is required to identify or exclude lymphoma cells.
  - Cell-block immunohistochemistry and, when needed, T-cell clonality testing refine the distinction.
  evidence:
  - reference: PMID:32045544
    reference_title: Best Practices Guideline for the Pathologic Diagnosis of Breast Implant-Associated Anaplastic Large-Cell Lymphoma.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Because the most common presentation of BIA-ALCL is swelling of the breast
      with fluid collection, an accurate diagnosis requires cytologic evaluation
      of the effusion fluid surrounding the affected implant.
    explanation: >-
      The guideline establishes that a fluid collection cannot be classified as
      BIA-ALCL without cytologic evaluation.
treatments:
- name: Complete Surgical Excision with Implant Removal
  action_category: THERAPEUTIC
  description: >-
    Complete surgical excision, including total capsulectomy and implant
    removal, is the principal treatment for localized capsule-confined
    BIA-ALCL.
  context: Localized capsule-confined BIA-ALCL
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Periprosthetic CD30-Positive Malignant T-Cell Expansion
    treatment_effect: INHIBITS
    description: >-
      Total capsulectomy and implant removal physically excise the
      capsule-localized malignant compartment.
    evidence:
    - reference: PMID:26628470
      reference_title: Complete Surgical Excision Is Essential for the Management of Patients With Breast Implant-Associated Anaplastic Large-Cell Lymphoma.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Patients who underwent a complete surgical excision that consisted of
        total capsulectomy with breast implant removal had better OS (P = .022)
        and EFS (P = .014)
      explanation: >-
        The cohort links complete removal of the implant and capsule to improved
        outcomes, supporting excision of the capsule-localized tumor mechanism.
  evidence:
  - reference: PMID:26628470
    reference_title: Complete Surgical Excision Is Essential for the Management of Patients With Breast Implant-Associated Anaplastic Large-Cell Lymphoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients who underwent a complete surgical excision that consisted of
      total capsulectomy with breast implant removal had better OS (P = .022)
      and EFS (P = .014)
    explanation: >-
      The multi-institutional cohort directly supports total capsulectomy with
      implant removal as the key localized-disease treatment.
discussions:
- discussion_id: gap_bia_implant_exposure_to_jak_stat_driver
  prompt: >-
    Which peri-implant processes connect textured-surface exposure to selection
    or acquisition of JAK/STAT-activating lesions in BIA-ALCL?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - environmental#Textured Breast Implant Exposure
  - pathophysiology#JAK/STAT Activation in BIA-ALCL
  rationale: >-
    Human cohorts establish the textured-implant context and tumor sequencing
    establishes frequent JAK/STAT activation, but these observations do not
    identify a direct causal bridge. Keeping that bridge open prevents an
    exposure association from being promoted to an unsupported molecular edge.
  evidence:
  - reference: PMID:38102324
    reference_title: "Surgical Management and Long-Term Outcomes of BIA-ALCL: A Multidisciplinary Approach."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All known implants were macrotextured with the proprietary Biocell
      macrotexturing pattern from salt-loss technique.
    explanation: >-
      The cohort establishes the exposure side of the unresolved bridge.
  - reference: PMID:30546832
    reference_title: Frequent activating STAT3 mutations and novel recurrent genomic abnormalities detected in breast implant-associated anaplastic large cell lymphoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We observed sequence variants leading to JAK/STAT activation in 10 out
      of 11 patients.
    explanation: >-
      Tumor sequencing establishes the downstream genomic side of the bridge.
  posed_date: "2026-07-21T02:53:02Z"

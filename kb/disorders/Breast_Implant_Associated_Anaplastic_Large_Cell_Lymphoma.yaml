imaging_findings:
- name: Peri-Implant Fluid Collection on Breast Ultrasound
  modality: ULTRASOUND
  imaging_finding_term:
    preferred_term: Peri-implant fluid collection
  diagnostic: false
  description: >-
    Breast ultrasound can identify the peri-implant fluid collection that
    prompts diagnostic aspiration; the finding is not itself diagnostic because
    the effusion requires cytologic evaluation.
  evidence:
  - reference: PMID:32045544
    reference_title: Best Practices Guideline for the Pathologic Diagnosis of Breast Implant-Associated Anaplastic Large-Cell Lymphoma.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Because the most common presentation of BIA-ALCL is swelling of the breast
      with fluid collection, an accurate diagnosis requires cytologic evaluation
      of the effusion fluid surrounding the affected implant.
    explanation: >-
      The guideline supports peri-implant fluid collection as the finding that
      triggers aspiration and establishes that imaging alone is insufficient;
      the cached abstract does not quantify ultrasound performance.

name: Breast Implant-Associated Anaplastic Large Cell Lymphoma
creation_date: "2026-07-21T02:53:02Z"
category: Cancer
categories:
- Hematologic Malignancy
- T-cell Neoplasm
- Non-Hodgkin Lymphoma
- Exposure-Associated Neoplasm
synonyms:
- BIA-ALCL
- breast implant-associated ALCL
description: >-
  Breast implant-associated anaplastic large cell lymphoma (BIA-ALCL) is a rare
  mature T-cell lymphoma arising in the peri-implant capsule, usually after
  textured breast-implant exposure. It is represented separately from the
  MONDO:0020325 ALCL branch because MONDO assigns it the distinct identifier
  MONDO:0850112 under mature T-cell and NK-cell non-Hodgkin lymphoma.
definitions:
- name: Capsule-associated clinical definition
  definition_type: CASE_DEFINITION
  description: >-
    BIA-ALCL arises as a delayed peri-implant seroma or a capsule-based mass
    surrounding a textured breast implant.
  scope: Clinical and anatomic definition of BIA-ALCL
  evidence:
  - reference: PMID:38102324
    reference_title: "Surgical Management and Long-Term Outcomes of BIA-ALCL: A Multidisciplinary Approach."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Breast implant-associated anaplastic large cell lymphoma (BIA-ALCL) is a
      subtype of ALCL that arises as a seroma or a mass in the capsule
      surrounding textured breast implants.
    explanation: >-
      This cohort provides the capsule, implant, seroma, and mass boundaries
      used for this disorder entry.
disease_term:
  preferred_term: breast implant-associated anaplastic large cell lymphoma
  term:
    id: MONDO:0850112
    label: breast implant-associated anaplastic large cell lymphoma
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0850112
      label: breast implant-associated anaplastic large cell lymphoma
    mapping_predicate: skos:exactMatch
    mapping_source: MONDO
    mapping_justification: >-
      Primary MONDO identifier for the exposure-associated BIA-ALCL entity.
parents:
- Mature T-cell and NK-cell non-Hodgkin lymphoma
mechanistic_hypotheses:
- hypothesis_group_id: bia_jak_stat_genomic_model
  hypothesis_label: JAK/STAT-driven BIA-ALCL model
  status: EMERGING
  description: >-
    Recurrent somatic variants converge on JAK/STAT activation in BIA-ALCL;
    this pathway is modeled as a tumor-cell driver while the upstream bridge
    from implant exposure to acquisition or selection of these lesions remains
    unresolved.
  evidence:
  - reference: PMID:30546832
    reference_title: Frequent activating STAT3 mutations and novel recurrent genomic abnormalities detected in breast implant-associated anaplastic large cell lymphoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We observed sequence variants leading to JAK/STAT activation in 10 out
      of 11 patients.
    explanation: >-
      Patient-tumor sequencing shows frequent genomic convergence on JAK/STAT
      activation.
environmental:
- name: Textured Breast Implant Exposure
  presence: Positive
  description: >-
    BIA-ALCL occurs in the capsule around breast implants; in the cited cohort,
    every implant with known surface type was macrotextured. This is modeled as
    an exposure association, not as a proven direct cause of a particular
    somatic driver.
  effect: Associated peri-implant context for capsule-based lymphoma
  evidence:
  - reference: PMID:38102324
    reference_title: "Surgical Management and Long-Term Outcomes of BIA-ALCL: A Multidisciplinary Approach."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Median age at diagnosis was 57 (range 35-77) years following a median
      implant exposure of 11 (range 7-33) years. All known implants were
      macrotextured with the proprietary Biocell macrotexturing pattern from
      salt-loss technique.
    explanation: >-
      The cohort directly documents long implant exposure and macrotextured
      surfaces among implants whose surface was known.
pathophysiology:
- name: JAK/STAT Activation in BIA-ALCL
  conforms_to: "jak_stat_pathway_activation#Constitutive STAT Activation and Nuclear Translocation"
  description: >-
    Somatic sequence variants frequently activate JAK/STAT signaling in
    BIA-ALCL tumor cells, with recurrent involvement of STAT3 and JAK-family
    genes.
  genes:
  - preferred_term: JAK1
    term:
      id: hgnc:6190
      label: JAK1
  - preferred_term: STAT3
    term:
      id: hgnc:11364
      label: STAT3
  biological_processes:
  - preferred_term: cell surface receptor signaling pathway via JAK-STAT
    modifier: INCREASED
    term:
      id: GO:0007259
      label: cell surface receptor signaling pathway via JAK-STAT
  evidence:
  - reference: PMID:30546832
    reference_title: Frequent activating STAT3 mutations and novel recurrent genomic abnormalities detected in breast implant-associated anaplastic large cell lymphoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We observed sequence variants leading to JAK/STAT activation in 10 out
      of 11 patients.
    explanation: >-
      Sequencing of eleven patient tumors directly supports frequent JAK/STAT
      pathway activation in BIA-ALCL.
  - reference: PMID:34572893
    reference_title: "ALK-Negative Anaplastic Large Cell Lymphoma: Current Concepts and Molecular Pathogenesis of a Heterogeneous Group of Large T-Cell Lymphomas."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The JAK1/3 and STAT3 mutations have also been identified in BIA-ALCL but
      not in pc-ALCL.
    explanation: >-
      This review identifies JAK-family and STAT3 mutations specifically in
      BIA-ALCL.
  downstream:
  - target: Periprosthetic CD30-Positive Malignant T-Cell Expansion
    description: >-
      Activated JAK/STAT signaling supports the survival and expansion of the
      peri-implant malignant T-cell clone.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - transcriptional programs supporting malignant-cell survival and proliferation
    hypothesis_groups:
    - bia_jak_stat_genomic_model
    evidence:
    - reference: PMID:30546832
      reference_title: Frequent activating STAT3 mutations and novel recurrent genomic abnormalities detected in breast implant-associated anaplastic large cell lymphoma.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In summary, our comprehensive genomic characterisation of 11 cases of
        BIA-ALCL has provided insight into potential pathobiological mechanisms
        (JAK/STAT, MYC and TP53) as well as identifying targets for future
        therapeutic intervention (TNFRSF11A, PDGFRA) in this rare entity.
      explanation: >-
        The patient genomic series supports JAK/STAT as a pathobiological
        mechanism; the intervening survival and proliferation program is
        intentionally represented as an omitted intermediate.
- name: Periprosthetic CD30-Positive Malignant T-Cell Expansion
  description: >-
    A malignant T-cell clone expands within the peri-implant effusion and
    capsule, producing either fluid-dominant or mass-forming disease.
  biological_processes:
  - preferred_term: cell population proliferation
    modifier: INCREASED
    term:
      id: GO:0008283
      label: cell population proliferation
  evidence:
  - reference: PMID:38102324
    reference_title: "Surgical Management and Long-Term Outcomes of BIA-ALCL: A Multidisciplinary Approach."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Breast implant-associated anaplastic large cell lymphoma (BIA-ALCL) is a
      subtype of ALCL that arises as a seroma or a mass in the capsule
      surrounding textured breast implants.
    explanation: >-
      The cohort localizes BIA-ALCL to the implant capsule and its seroma or
      mass presentations.
  downstream:
  - target: Delayed Peri-Implant Seroma
    description: >-
      Fluid-dominant capsule disease produces a clinically evident delayed
      peri-implant effusion.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - local tumor and capsule inflammatory fluid accumulation
    hypothesis_groups:
    - bia_jak_stat_genomic_model
    evidence:
    - reference: PMID:38102324
      reference_title: "Surgical Management and Long-Term Outcomes of BIA-ALCL: A Multidisciplinary Approach."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Patients presented with clinically evident effusion in 78% of cases and
        a mass in 17% of cases, and 83% of patients presented with stage 1
        BIA-ALCL.
      explanation: >-
        This cohort directly supports effusion as the common clinical output of
        capsule-localized BIA-ALCL.
  - target: Capsular Mass
    description: >-
      Mass-forming growth in the peri-implant capsule produces a palpable or
      imaging-detectable breast mass.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - localized solid tumor accumulation in the capsule
    hypothesis_groups:
    - bia_jak_stat_genomic_model
    evidence:
    - reference: PMID:38102324
      reference_title: "Surgical Management and Long-Term Outcomes of BIA-ALCL: A Multidisciplinary Approach."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Patients presented with clinically evident effusion in 78% of cases and
        a mass in 17% of cases, and 83% of patients presented with stage 1
        BIA-ALCL.
      explanation: >-
        This cohort directly supports a capsule-based mass as the less-common
        presentation of BIA-ALCL.
histopathology:
- name: CD30-Positive Neoplastic Cells in Peri-Implant Effusion and Capsule
  finding_term:
    preferred_term: CD30-positive neoplastic cells in peri-implant effusion or capsule
    term:
      id: NCIT:C39715
      label: CD30-Positive Neoplastic Cells Present
  description: >-
    Diagnostic material may be present in the peri-implant effusion and in the
    capsule. Cytologic preparations and cell-block sections permit morphologic
    and immunohistochemical assessment, while systematic capsule mapping
    assesses microscopic tumor and invasion.
  diagnostic: true
  evidence:
  - reference: PMID:40565334
    reference_title: "Molecular Insights into the Diagnosis of Anaplastic Large Cell Lymphoma: Beyond Morphology and Immunophenotype."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Anaplastic Large Cell Lymphoma (ALCL) represents a diverse group of mature
      T-Cell Lymphomas unified by strong CD30 expression but with different
      molecular and clinical subtypes.
    explanation: >-
      The review directly supports strong CD30 expression as the shared
      immunophenotype of the ALCL family that includes BIA-ALCL.
  - reference: PMID:32045544
    reference_title: Best Practices Guideline for the Pathologic Diagnosis of Breast Implant-Associated Anaplastic Large-Cell Lymphoma.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Preparation of a cell block is desirable to allow for hematoxylin and
      eosin staining and immunohistochemical analysis of formalin-fixed,
      paraffin-embedded histologic sections.
    explanation: >-
      The best-practices guideline supports cell-block morphology and
      immunohistochemistry for peri-implant effusion material.
  - reference: PMID:32045544
    reference_title: Best Practices Guideline for the Pathologic Diagnosis of Breast Implant-Associated Anaplastic Large-Cell Lymphoma.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Fixation and mapping of the capsulectomy specimen to select multiple
      representative sections are advised to assess for microscopic tumor
      involvement and capsular invasion.
    explanation: >-
      The guideline directly supports mapped microscopic assessment of the
      capsule for tumor and invasion.

- name: ALK Protein Expression
  biomarker_term:
    preferred_term: ALK tyrosine kinase receptor
    term:
      id: NCIT:C27032
      label: ALK Tyrosine Kinase Receptor
  presence: ABSENT
  notes: >-
    BIA-ALCL belongs to the ALK-negative ALCL group; absence of ALK expression
    helps distinguish it from systemic ALK-positive ALCL.
  evidence:
  - reference: PMID:34572893
    reference_title: "ALK-Negative Anaplastic Large Cell Lymphoma: Current Concepts and Molecular Pathogenesis of a Heterogeneous Group of Large T-Cell Lymphomas."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Based on the presence/absence of the rearrangement and expression of
      anaplastic lymphoma kinase (ALK), ALCL is divided into ALK+ and ALK-, and
      both differ clinically and prognostically. This review focuses on the
      historical points, clinical features, histopathology, differential diagnosis,
      and relevant cytogenetic and molecular alterations of ALK- ALCL and its
      subtypes: systemic, primary cutaneous (pc-ALCL), and breast
      implant-associated (BIA-ALCL).
    explanation: >-
      The review classifies BIA-ALCL as an ALK-negative ALCL subtype and ties
      that classification to absent ALK rearrangement and expression.

datasets:
- accession: geo:GSE299253
  title: Hand1 gene replacement with Hand2 reveals overlap in function with unique occurrence of omphalocele and heart defects [scRNA-seq]
  description: The bHLH transcription factors HAND1 and HAND2 are expressed in partially overlapping patterns during development. Studies have established evidence for significant functional redundancy between HAND1 and HAND2. To test redundancy fully, we engineered a Hand1 allele where we directly replace the exons and intron with those of Hand2. Results show that 2% of Hand1Hand2/ Hand2 mice are viable, and fertile. The remaining Hand1Hand2/Hand2 embryos exhibit neonatal lethality due to omphalocele, ventricular septal defects and conduction anomalies.
  organism:
    preferred_term: mouse
    term:
      id: NCBITaxon:10090
      label: Mus musculus
  data_type: SINGLE_CELL_RNA_SEQ
  sample_count: 9
  publication: PMID:40960281
  notes: Identified by GEO DataSets index search for Omphalocele (scripts/discover_datasets.py); accession and metadata verified against NCBI E-utilities on 2026-08-01. Title, sample count, and organism are GEO's own values.

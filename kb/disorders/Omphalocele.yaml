has_subtypes:
- name: Isolated
  display_name: Isolated (non-syndromic) omphalocele
  description: >-
    Omphalocele occurring without associated major malformations, chromosomal
    abnormality, or recognized syndrome. Isolated cases have the most favorable
    prognosis, with high survival in the absence of chromosomal defects.
  evidence:
  - reference: PMID:32131131
    reference_title: "Omphalocele in Finland from 1993 to 2014: Trends, Prevalence, Mortality, and Associated Malformations-A Population-Based Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Total 1-year survival rates for isolated omphalocele, cases with multiple anomalies and neonates with chromosomal defects were 80, 88, and 17%, respectively."
    explanation: >-
      Distinguishes isolated omphalocele from cases with multiple anomalies or
      chromosomal defects and quantifies its higher 1-year survival rate.
- name: Syndromic
  display_name: Syndromic / chromosomal omphalocele
  description: >-
    Omphalocele occurring as part of a recognized congenital syndrome or
    chromosomal abnormality (such as trisomy 18, trisomy 13, or
    Beckwith-Wiedemann syndrome). Carries substantially worse prognosis, driven
    by the associated anomalies and chromosomal or syndromic diagnosis.
  evidence:
  - reference: PMID:39576336
    reference_title: "Omphalocele prevalence and co-occurring malformations: a nationwide register-based study of Danish live births in 1997-2021."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Over one-half (53.7%) presented with one or more major malformations, and an additional 17.0% were diagnosed with a syndrome."
    explanation: >-
      Documents the syndromic and malformation-associated subgroup in a
      nationwide birth cohort.
  - reference: PMID:40150018
    reference_title: "Omphalocele and Associated Anomalies: Exploring Pulmonary Development and Genetic Correlations-A Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "While omphalocele can occur as an isolated anomaly, it is more commonly associated with congenital syndromes and structural abnormalities."
    explanation: >-
      Confirms that omphalocele is commonly associated with congenital syndromes
      and structural abnormalities.
- name: Giant
  display_name: Giant omphalocele
  description: >-
    Anatomic size and severity stratum (which can occur in either isolated or
    syndromic omphalocele) characterized by viscero-abdominal disproportion
    that prevents primary fascial closure and predisposes to pulmonary
    hypoplasia and pulmonary hypertension.
  evidence:
  - reference: PMID:40389219
    reference_title: "European Paediatric Surgeons' Association Consensus Statement on the Management of Giant Omphalocele."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Giant omphalocele is appropriately defined as viscero-abdominal disproportion preventing primary closure."
    explanation: >-
      Provides the European Paediatric Surgeons' Association consensus
      definition of giant omphalocele.

pathophysiology:
- name: Ventral Body Wall Closure Failure
  description: >-
    The primary developmental lesion in omphalocele is failure to complete
    normal ventral body wall formation at the umbilical region. During normal
    embryogenesis the lateral, cephalic, and caudal body folds migrate ventrally
    and fuse at the umbilical ring; failure of this morphogenetic process leaves
    a central defect through which abdominal viscera herniate into the base of
    the umbilical cord, covered by a membranous (peritoneum/Wharton's
    jelly/amnion) sac. This distinguishes omphalocele from gastroschisis (a
    paraumbilical defect without a sac).
  locations:
  - preferred_term: abdominal wall
    term:
      id: UBERON:0003697
      label: abdominal wall
  - preferred_term: umbilical cord
    term:
      id: UBERON:0002331
      label: umbilical cord

- name: Transfusion Support for APL Coagulopathy
  description: >-
    Begin blood-product support immediately when APL is suspected, alongside
    ATRA, and monitor platelets and coagulation parameters frequently during
    induction. Replace platelets, fibrinogen, and other coagulation factors to
    reduce bleeding risk. Targets vary among protocols; one published algorithm
    uses INR below 1.5-2.0, fibrinogen above 100 mg/dL, and platelets above
    30,000/µL rather than establishing a universal threshold for all settings.
  action_category: THERAPEUTIC
  therapeutic_modality: OTHER
  target_phenotypes:
  - preferred_term: Abnormal Bleeding
    term:
      id: HP:0001892
      label: Abnormal bleeding
  - preferred_term: Thrombocytopenia
    term:
      id: HP:0001873
      label: Thrombocytopenia
  evidence:
  - reference: PMID:34193815
    reference_title: Acute promyelocytic leukemia current treatment algorithms.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In addition to prompt ATRA administration, coagulopathy should be
      adequately corrected by keeping internationalized normalized ratio (INR)
      for PT at less than 1.5–2.0, fibrinogen greater than 100 mg/dL platelets
      greater than 30,000/µL through blood product transfusions.
    explanation: The review supports immediate correction alongside ATRA and gives one explicit protocol's targets.
  - reference: PMID:34193815
    reference_title: Acute promyelocytic leukemia current treatment algorithms.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Platelet counts and coagulation parameters, including PTT, PT, as well as
      fibrinogen levels, should be monitored daily to keep these parameters
      within range.
    explanation: The review supports frequent laboratory monitoring during correction of APL coagulopathy.
  - reference: PMID:33860520
    reference_title: Management of Disseminated Intravascular Coagulation in Acute Leukemias.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Other aspects of management focus on supportive care aimed at minimizing
      the risk of bleeding, via transfusion of blood products.
    explanation: The review supports transfusion-based supportive care while avoiding unsupported universal thresholds.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care


    reference_title: ATRA resolves the differentiation block in t(15;17) acute myeloid leukemia by restoring PU.1 expression.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here we found that conditional expression of promyelocytic
      leukemia-retinoic acid receptor alpha (PML-RARA), the protein encoded by
      the t(15;17) translocation found in acute promyelocytic leukemia (APL),
      suppressed PU.1 expression
    explanation: Conditional PML-RARA expression suppresses a key myeloid-differentiation transcription factor.
  downstream:
  - target: Granulocytic Differentiation Arrest
    description: Failure to activate the granulocytic program arrests maturation near the promyelocyte stage.
    causal_link_type: DIRECT
    evidence:

- category: Treatment complication
  name: Differentiation Syndrome
  description: >-
    During ATRA and/or ATO induction, unexplained fever, weight gain, dyspnea,
    pulmonary infiltrates or effusions, hypotension, and renal failure can occur
    as a potentially severe treatment complication.
  context: During induction with differentiating agents
  evidence:
  - reference: PMID:24627526
    reference_title: How we prevent and treat differentiation syndrome in patients with acute promyelocytic leukemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The full-blown syndrome consists of unexplained fever, weight gain, dyspnea
      with pulmonary infiltrates, pleuropericardial effusion, hypotension, and
      renal failure.
    explanation: The review defines the clinical syndrome without assigning a universal frequency.

biochemical:
- name: Consumptive Coagulation Profile
  notes: >-
    APL coagulopathy commonly includes prolonged PT and PTT, elevated D-dimer,
    hypofibrinogenemia, and thrombocytopenia; individual results and treatment
    thresholds require clinical interpretation.
  evidence:
  - reference: PMID:34193815
    reference_title: Acute promyelocytic leukemia current treatment algorithms.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      A consumptive coagulopathy consisting of elevated partial thromboplastin
      time (PTT), prothrombin time (PT), and D-dimers, together with
      hypofibrinogenemia, and thrombocytopenia is another common feature present
      in three-quarters of the patients at diagnosis [15].
    explanation: The review supports the listed coagulation abnormalities and their common occurrence at diagnosis.
  readouts:
  - target: Systemic Coagulation Activation and Consumptive Coagulopathy
    relationship: READOUT_OF
    direction: THRESHOLD_DEPENDENT
    endpoint_context: MONITORING
    interpretation: The combined coagulation profile reflects the severity and evolution of APL coagulopathy.
    evidence:
    - reference: PMID:34193815
      reference_title: Acute promyelocytic leukemia current treatment algorithms.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        A consumptive coagulopathy consisting of elevated partial thromboplastin
        time (PTT), prothrombin time (PT), and D-dimers, together with
        hypofibrinogenemia, and thrombocytopenia is another common feature present
        in three-quarters of the patients at diagnosis [15].
      explanation: The measured profile is a readout of the consumptive coagulopathy node.
- name: PML-RARA Fusion Transcript
  notes: >-
    Detection establishes the molecular identity of this APL entry. Quantitative
    PCR is also used at protocol-defined response milestones and during
    follow-up; molecular complete remission at the end of consolidation is the
    response milestone represented here.
  evidence:
  - reference: DOI:10.3390/cancers16061160
    reference_title: "Acute Promyelocytic Leukemia: Review of Complications Related to All-Trans Retinoic Acid and Arsenic Trioxide Therapy"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The hallmark of acute promyelocytic leukemia (APL) is the presence of the
      characteristic fusion transcript of the promyelocytic leukemia gene with
      the retinoic acid receptor α gene (PML::RARA).
    explanation: The review identifies the fusion transcript as the molecular hallmark.
  readouts:
  - target: Somatic PML-RARA Fusion
    relationship: READOUT_OF
    direction: PRESENT_ABSENT
    endpoint_context: DIAGNOSTIC
    interpretation: Detection of the fusion transcript confirms the molecular lesion represented by the root node.
    evidence:
    - reference: DOI:10.3390/cancers16061160
      reference_title: "Acute Promyelocytic Leukemia: Review of Complications Related to All-Trans Retinoic Acid and Arsenic Trioxide Therapy"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        The hallmark of acute promyelocytic leukemia (APL) is the presence of the
        characteristic fusion transcript of the promyelocytic leukemia gene with
        the retinoic acid receptor α gene (PML::RARA).
      explanation: Presence of the transcript directly reports the fusion lesion.
  - target: Promyelocyte Compartment Expansion
    relationship: CORRELATES_WITH
    direction: POSITIVE
    endpoint_context: MONITORING
    interpretation: End-of-consolidation molecular response and subsequent PML::RARA PCR monitoring report residual or recurrent leukemic burden.
    evidence:
    - reference: DOI:10.3390/cancers16183208
      reference_title: "MRD in Acute Leukemias: Lessons Learned from Acute Promyelocytic Leukemia"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Acute promyelocytic leukemia (APL) leads the way in this transformation,
        initially using PCR to detect MRD in patients in remission, and more
        recently, aiming to eliminate it entirely with modern treatment strategies.
      explanation: The review supports PCR-based monitoring of residual disease in APL remission.
    - reference: PMID:34193815
      reference_title: Acute promyelocytic leukemia current treatment algorithms.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Maintenance therapy is not part of our standard practice for patients
        who achieve molecular CR at the end of consolidation with ATRA plus ATO
        based regimens.
      explanation: The treatment review identifies molecular complete remission at the end of consolidation as a defined response milestone.

genetic:
- name: PML Fusion Partner
  gene_term:
    preferred_term: PML
    term:
      id: hgnc:9113
      label: PML
  association: 5-prime partner in the defining somatic PML::RARA fusion driver
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  notes: >-
    PML is one partner in the defining somatic PML::RARA rearrangement, usually
    the classic t(15;17) but sometimes a cryptic or complex insertion. The
    fusion is not described here as sufficient by itself for full leukemic
    transformation because model systems show latency, incomplete penetrance,
    and cooperation with additional lesions.
  evidence:
  - reference: PMID:39858554
    reference_title: "Utilization of RT-PCR and Optical Genome Mapping in Acute Promyelocytic Leukemia with Cryptic PML::RARA Rearrangement: A Case Discussion and Systemic Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Acute promyelocytic leukemia (APL) is characterized by abnormal
      promyelocytes and t(15;17)(q24;q21) PML::RARA.
    explanation: The clinical review identifies PML as a partner in the defining fusion.
  - reference: PMID:9122233
    reference_title: A PMLRARalpha transgene initiates murine acute promyelocytic leukemia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Our results demonstrate that PMLRAR alpha impairs neutrophil
      differentiation and initiates the development of APL.
    explanation: The transgenic model supports an initiating-driver relationship.
  - reference: PMID:12060771
    reference_title: PML/RARalpha and FLT3-ITD induce an APL-like disease in a mouse model.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Expression of PML/RARalpha from the cathepsin G promoter in transgenic mice
      causes a nonfatal myeloproliferative syndrome in all mice; about 15% go on
      to develop APL after a long latent period, suggesting that additional
      mutations are required for the development of APL.
    explanation: The model directly supports long latency, incomplete penetrance, and the need for cooperating events.
- name: RARA Fusion Partner
  gene_term:
    preferred_term: RARA
    term:
      id: hgnc:9864
      label: RARA
  association: 3-prime partner in the defining somatic PML::RARA fusion driver
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  notes: >-
    RARA is the retinoic-acid receptor partner in the defining PML::RARA
    rearrangement, most often t(15;17). The resulting fusion protein recruits
    corepressors and disrupts the normal granulocytic differentiation program.
  evidence:
  - reference: PMID:39858554
    reference_title: "Utilization of RT-PCR and Optical Genome Mapping in Acute Promyelocytic Leukemia with Cryptic PML::RARA Rearrangement: A Case Discussion and Systemic Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Acute promyelocytic leukemia (APL) is characterized by abnormal
      promyelocytes and t(15;17)(q24;q21) PML::RARA.
    explanation: The clinical review identifies RARA as a partner in the defining fusion.
- name: FLT3
  gene_term:
    preferred_term: FLT3
    term:
      id: hgnc:3765
      label: FLT3
  association: Cooperating somatic alteration and prognostic biomarker
  relationship_type: COOPERATING
  variant_origin: SOMATIC
  notes: >-
    FLT3-ITD can cooperate with PML::RARA in experimental leukemogenesis and has
    been associated with adverse progression-free survival in a human
    ATRA-plus-chemotherapy cohort. No universal case frequency or
    treatment-intensification rule is asserted.
  evidence:
  - reference: PMID:12060771
    reference_title: PML/RARalpha and FLT3-ITD induce an APL-like disease in a mouse model.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These observations document cooperation between PML/RARalpha and FLT3-ITD
      in development of the murine APL phenotype.
    explanation: The model directly demonstrates functional cooperation.
  - reference: PMID:36539954
    reference_title: Association between FLT3-ITD and additional chromosomal abnormalities in the prognosis of acute promyelocytic leukemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      FLT3-ITD was an independent adverse factor for 5-year PFS, and ACA was an
      independent adverse factor for 5-year OS.
    explanation: The human cohort supports a prognostic association without establishing a treatment rule.

diagnosis:
- name: Morphologic Suspicion of APL
  description: >-
    Peripheral blood and marrow morphology showing abnormal promyelocytes with
    irregular azurophilic granules or Auer rods should trigger urgent evaluation
    and empiric ATRA while molecular confirmation is pursued.
  evidence:
  - reference: PMID:34193815
    reference_title: Acute promyelocytic leukemia current treatment algorithms.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Microscopic identification of circulating promyelocytes with irregular
      azurophilic granules or Auer rods strongly supports APL diagnosis.
    explanation: The review identifies the morphology that strongly supports rapid suspicion.
  - reference: PMID:34193815
    reference_title: Acute promyelocytic leukemia current treatment algorithms.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Immediate administration of ATRA at the first suspicion of APL diagnosis
      is of extreme importance.
    explanation: The review directly supports empiric ATRA at morphologic suspicion while confirmation is pursued.
- name: Molecular Confirmation of PML::RARA
  description: >-
    Confirm the PML::RARA fusion by molecular testing. A negative conventional
    karyotype does not exclude cryptic or complex rearrangements, so RT-PCR or
    another sensitive molecular method is important when morphology remains
    compelling.
  results: PML::RARA fusion transcript detected
  evidence:
  - reference: PMID:34193815
    reference_title: Acute promyelocytic leukemia current treatment algorithms.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In the majority of such cases, a molecular analysis nevertheless reveals
      an underlying PML–RARA fusion transcript formed as a result of
      cytogenetically cryptic or complex insertion events [2].
    explanation: The review supports molecular detection when classic cytogenetic findings are absent.
  - reference: PMID:39858554
    reference_title: "Utilization of RT-PCR and Optical Genome Mapping in Acute Promyelocytic Leukemia with Cryptic PML::RARA Rearrangement: A Case Discussion and Systemic Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "RT-PCR revealed a cryptic PML::RARA fusion transcript."
    explanation: A cryptic clinical case demonstrates the value of RT-PCR confirmation.
- name: Supportive Flow-Cytometric Immunophenotyping
  description: >-
    Flow cytometry can rapidly identify a characteristic APL pattern and
    prioritize confirmatory fusion testing, but variant immunophenotypes prevent
    it from being a stand-alone molecular diagnosis.
  markers: CD13+, CD33+, CD117+, HLA-DR- with variant patterns
  evidence:
  - reference: PMID:22535601
    reference_title: "Acute promyelocytic leukemia: four distinct patterns by flow cytometry immunophenotyping."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Apart from a well-known FC pattern of hypergranular APL, we presented less
      common immunophenotypic variants of APL, which helps to identify an
      additional group of patients who would benefit from fast confirmatory FISH
      and/or PCR testing for t(15;17)/PML-RARA.
    explanation: The study supports flow cytometry as a triage tool for rapid confirmatory testing.

differential_diagnoses:
- name: APL-Like Acute Myeloid Leukemia Without PML::RARA
  description: >-
    A small, genetically heterogeneous group of AMLs can show APL-like
    morphology or immunophenotype without t(15;17). Molecular confirmation is
    decisive because these entities differ in genetics, therapy sensitivity,
    and prognosis.
  distinguishing_features:
  - Absence of the defining PML::RARA fusion
  - Alternative genetic lesion on expanded molecular testing
  - Therapy response may differ from PML::RARA-positive APL
  evidence:
  - reference: DOI:10.3390/cancers16244192
    reference_title: "Acute Promyelocytic Leukemia-like AML: Genetic Perspective and Clinical Implications"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      However, a small percentage (estimated to be 2%) of AML presenting with
      APL-like morphology and/or immunophenotype lacks t(15;17).
    explanation: The review directly identifies the molecularly distinct APL-like differential group.

animal_models:
- species: Mus musculus
  genotype: Myeloid-cell PMLRARalpha transgenic mouse
  genes:

discussions:
- discussion_id: gap_apl_cooperating_lesions
  prompt: >-
    Which cooperating somatic lesions determine progression from a
    PML::RARA-initiated preleukemic state to overt APL, and which of those
    lesions materially shape relapse or treatment resistance in humans?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Somatic PML-RARA Fusion
  - genetic#FLT3
  rationale: >-
    PML::RARA transgenic mice show a long-latency, incompletely penetrant
    disease, whereas FLT3-ITD markedly accelerates an APL-like phenotype. This
    proves that cooperation can matter experimentally but does not establish a
    complete human progression or resistance map.
  evidence:
  - reference: PMID:9122233
    reference_title: A PMLRARalpha transgene initiates murine acute promyelocytic leukemia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      PMLRAR alpha transgenic mice exhibited impaired neutrophil maturation
      early in life, which progressed at a low frequency over the course of
      several months to overt APL.
    explanation: Low-frequency, long-latency progression motivates the search for cooperating lesions.
  - reference: PMID:12060771
    reference_title: PML/RARalpha and FLT3-ITD induce an APL-like disease in a mouse model.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These observations document cooperation between PML/RARalpha and FLT3-ITD
      in development of the murine APL phenotype.
    explanation: FLT3-ITD demonstrates one experimentally validated cooperation route.


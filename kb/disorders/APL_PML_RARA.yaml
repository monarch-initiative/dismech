progression:
- phase: Early hemorrhagic-risk presentation
  notes: >-
    Newly suspected APL is an urgent condition requiring prompt recognition to
    avoid early mortality; a severe bleeding diathesis can already be present at
    presentation.
  evidence:
  - reference: PMID:38890097
    reference_title: "Diagnosis and management of acute promyelocytic leukemia: Brazilian consensus guidelines 2024 on behalf of the Brazilian Association of Hematology, Hemotherapy and Cellular Therapy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Finally, acute promyelocytic leukemia is presented as a highly curable
      disease because of the real possibility of targeted therapy towards
      differentiation, and, paradoxically, as a serious and urgent condition
      that deserves prompt recognition and management to avoid early mortality.
    explanation: The current consensus identifies the urgent early-mortality phase.
  - reference: PMID:397771
    reference_title: "Acute promyelocytic leukemia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Acute promyelocytic leukemia (APL) is characterized by proliferation of
      morphologically abnormal promyelocytes and a severe bleeding diathesis.
    explanation: The review directly supports the severe bleeding risk present with APL.
- phase: Induction and differentiation-syndrome window
  notes: >-
    Differentiation syndrome occurs during induction with ATRA and/or ATO and
    requires prompt recognition; the mechanism includes differentiating-cell
    migration, endothelial activation, and vascular leak.
  evidence:
  - reference: PMID:22220256
    reference_title: "The differentiation syndrome in patients with acute promyelocytic leukemia: experience of the pethema group and review of the literature."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Roughly one quarter of patients with APL undergoing induction therapy will
      develop the DS, characterized by unexplained fever, acute respiratory
      distress with interstitial pulmonary infiltrates, and/or a vascular
      capillary leak syndrome leading to acute renal failure.
    explanation: The review places differentiation syndrome in the induction phase.
- phase: End-of-consolidation molecular response and follow-up
  notes: >-
    Molecular complete remission at the end of consolidation is the key response
    milestone represented here. Thereafter, PML::RARA PCR can detect residual or
    recurrent molecular disease during risk-adapted follow-up.
  evidence:
  - reference: PMID:34193815
    reference_title: Acute promyelocytic leukemia current treatment algorithms.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Maintenance therapy is not part of our standard practice for patients who
      achieve molecular CR at the end of consolidation with ATRA plus ATO based
      regimens.
    explanation: The treatment review identifies end-of-consolidation molecular complete remission as a response milestone.
  - reference: DOI:10.3390/cancers16183208
    reference_title: "MRD in Acute Leukemias: Lessons Learned from Acute Promyelocytic Leukemia"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Acute promyelocytic leukemia (APL) leads the way in this transformation,
      initially using PCR to detect MRD in patients in remission, and more
      recently, aiming to eliminate it entirely with modern treatment strategies.
    explanation: The review supports PCR-based monitoring after the defined molecular-response milestone.

treatments:
- name: Immediate All-Trans Retinoic Acid (ATRA)
  description: >-
    ATRA should begin at the first clinical suspicion of APL while confirmatory
    testing proceeds. It releases PML::RARA-associated corepressors and restores
    terminal myeloid differentiation.
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: PML-RARA Corepressor Recruitment
    treatment_effect: INHIBITS
    description: Ligand binding releases corepressors and relieves fusion-mediated transcriptional repression.
    evidence:
    - reference: PMID:34193815
      reference_title: Acute promyelocytic leukemia current treatment algorithms.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        ATRA causes a conformational change of the PML–RARA fusion transcripts,
        leading to the release of the co-repressors, recruitment of histone
        acetyltransferases, and relief of transcriptional repression
      explanation: The review directly supports the ATRA target mechanism.

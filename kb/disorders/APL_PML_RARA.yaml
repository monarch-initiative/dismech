name: Acute Promyelocytic Leukemia, PML-RARA
creation_date: '2026-01-26T02:55:13Z'
description: >-
  Acute promyelocytic leukemia (APL) with PML::RARA is a molecularly defined
  acute myeloid leukemia caused by a somatic PML::RARA rearrangement, most often
  the classic t(15;17) but sometimes a cytogenetically cryptic or complex
  insertion. The fusion oncoprotein represses the granulocytic differentiation
  program and disrupts PML nuclear-body functions, producing an expansion of
  abnormal promyelocytes. APL is both a hemorrhagic emergency and a highly
  curable malignancy when promptly recognized and treated with risk-adapted
  all-trans retinoic acid (ATRA), arsenic trioxide (ATO), and cytoreduction for
  high-risk disease according to the selected regimen.
categories:
- Hematologic Malignancy
- Acute Leukemia
- Molecularly Defined Cancer
parents:
- acute myeloid leukemia

prevalence:
- population: Europe
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: BAND_1_9_PER_1000000
  rate_low: 0.1
  rate_high: 0.9
  notes: >-
    Orphanet reports an annual incidence band of 1-9 per 1,000,000 in Europe.
    This is an incidence estimate, not a point-prevalence estimate or the
    fraction of acute myeloid leukemia cases represented by APL.
  evidence:
  - reference: ORPHA:520
    reference_title: Acute promyelocytic leukemia
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "1-9 / 1 000 000 | Europe | Annual incidence | REG"
    explanation: Orphanet provides the European annual-incidence band.

pathophysiology:
- name: Somatic PML-RARA Fusion
  description: >-
    An acquired rearrangement fuses PML with RARA in a myeloid progenitor. Most
    cases have the classic t(15;17), but cryptic or complex insertions can
    generate the same fusion transcript without a visible classic
    translocation. PML::RARA is the initiating driver of this disease entry,
    while model studies show that additional events influence progression from
    a preleukemic state to overt leukemia.
  genes:
  - preferred_term: PML
    term:
      id: hgnc:9113
      label: PML
  - preferred_term: RARA
    term:
      id: hgnc:9864
      label: RARA
  cell_types:
  - preferred_term: promyelocyte
    term:
      id: CL:0000836
      label: promyelocyte
  evidence:
  - reference: PMID:24344243
    reference_title: "Synergy against PML-RARa: targeting transcription, proteolysis, differentiation, and self-renewal in acute promyelocytic leukemia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Acute promyelocytic leukemia (APL) is a hematological malignancy driven by
      a chimeric oncoprotein containing the C terminus of the retinoic acid
      receptor-a (RARa) fused to an N-terminal partner, most commonly
      promyelocytic leukemia protein (PML).
    explanation: The review identifies PML-RARa as the driver oncoprotein in APL.
  - reference: PMID:34193815
    reference_title: Acute promyelocytic leukemia current treatment algorithms.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In about 10% of the cases, a successful cytogenetic analysis may lack
      classic t(15;17). In the majority of such cases, a molecular analysis
      nevertheless reveals an underlying PML–RARA fusion transcript formed as a
      result of cytogenetically cryptic or complex insertion events
    explanation: The review establishes that cryptic or complex events can produce PML-RARA without a visible classic translocation.
  downstream:
  - target: PML-RARA Corepressor Recruitment
    description: PML::RARA binds response elements and recruits repressive chromatin machinery.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:34193815
      reference_title: Acute promyelocytic leukemia current treatment algorithms.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        It binds to retinoic acid response elements of target genes and recruits
        co-repressors such as DNA methyltransferases and histone deacetylases,
        and sequesters retinoic X receptor and the wild-type PML protein, which
        finally leads to suppression of genes necessary for granulocytic
        differentiation
      explanation: This directly supports fusion-protein recruitment of corepressors.
  - target: PML Nuclear-Body Disassembly
    description: PML::RARA antagonizes normal PML nuclear-body formation and function.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:24344243
      reference_title: "Synergy against PML-RARa: targeting transcription, proteolysis, differentiation, and self-renewal in acute promyelocytic leukemia."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Mechanistically, PML-RARa acts as a transcriptional repressor of RARa and
        non-RARa target genes and antagonizes the formation and function of PML
        nuclear bodies that regulate numerous signaling pathways.
      explanation: The review directly attributes loss of PML nuclear-body formation and function to PML-RARa.


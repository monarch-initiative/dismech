- name: FLT3-ITD-Driven Proliferative Signaling
  description: >-
    Activating FLT3 internal tandem duplication can provide a cooperating
    proliferative signal in PML::RARA-expressing hematopoietic cells. In the
    cited mouse model, the combination shortened leukemia latency and produced
    a fully penetrant APL-like disease; this node does not imply that FLT3-ITD
    is required in human APL.
  gene:
    preferred_term: FLT3
    term:
      id: hgnc:3765
      label: FLT3
  cell_types:
  - preferred_term: hematopoietic cell
    term:
      id: CL:0000988
      label: hematopoietic cell
  evidence:
  - reference: PMID:12060771
    reference_title: PML/RARalpha and FLT3-ITD induce an APL-like disease in a mouse model.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Activating mutations in FLT3, including internal tandem duplication (ITD)
      in the juxtamembrane domain, transform hematopoietic cell lines to factor
      independent growth.
    explanation: The model paper identifies the proliferative effect of activating FLT3-ITD.
  downstream:
  - target: Promyelocyte Compartment Expansion
    description: FLT3-ITD cooperates with PML::RARA to accelerate expansion into an APL-like disease.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - factor-independent growth and shortened leukemia latency
    evidence:
    - reference: PMID:12060771
      reference_title: PML/RARalpha and FLT3-ITD induce an APL-like disease in a mouse model.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Retroviral transduction of FLT3-ITD into bone marrow cells obtained from
        PML/RARalpha transgenic mice results in a short latency APL-like disease
        with complete penetrance.
      explanation: The combination accelerates and fully penetrates the APL-like phenotype in this mouse model.


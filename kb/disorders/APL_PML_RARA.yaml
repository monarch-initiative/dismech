      label: PML
  - preferred_term: RARA
    term:
      id: hgnc:9864
      label: RARA
  description: >-
    Myeloid expression of PMLRARalpha produces early impaired neutrophil
    maturation, a transplantable preleukemic state, and low-frequency,
    long-latency APL that remains retinoic-acid responsive. The model separates
    fusion-driven initiation from the additional events required for efficient
    progression.
  associated_phenotypes:
  - Impaired neutrophil maturation
  - Preleukemic promyelocyte expansion
  - Retinoic-acid-responsive APL
  evidence:
  - reference: PMID:9122233
    reference_title: A PMLRARalpha transgene initiates murine acute promyelocytic leukemia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      PMLRAR alpha transgenic mice exhibited impaired neutrophil maturation
      early in life, which progressed at a low frequency over the course of
      several months to overt APL.
    explanation: The model reproduces the maturation defect and low-frequency progression to overt leukemia.
  - reference: PMID:9122233
    reference_title: A PMLRARalpha transgene initiates murine acute promyelocytic leukemia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Both the preleukemic state and the leukemia could be transplanted to
      nontransgenic mice, and the transplanted preleukemia could progress to APL.
    explanation: The experiment directly supports transplantability of both the preleukemic and leukemic states.
  - reference: PMID:9122233
    reference_title: A PMLRARalpha transgene initiates murine acute promyelocytic leukemia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The APL recapitulated features of the human disease, including a response
      to retinoic acid. Retinoic acid caused the leukemic cells to differentiate
      in vitro and in vivo, eliciting remissions of both the preleukemic state
      and APL in mice.
    explanation: The model directly supports retinoic-acid responsiveness and remission.

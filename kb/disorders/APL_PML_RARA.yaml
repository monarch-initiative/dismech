  - reference: PMID:397771
    reference_title: "Acute promyelocytic leukemia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Acute promyelocytic leukemia (APL) is characterized by proliferation of
      morphologically abnormal promyelocytes and a severe bleeding diathesis.
      The abnormal promyelocyte is characterized by abundant, large granules,
      many of which are spindle-shaped.
    explanation: The complete snippet identifies both abnormal promyelocytes and their characteristic granules.
- name: Characteristic Flow-Cytometric Immunophenotype
  description: >-
    Classical APL commonly shows CD13, CD33, CD117, and HLA-DR
    negativity; variant patterns occur, so immunophenotyping supports rapid
    suspicion but does not replace molecular confirmation.
  evidence:
  - reference: PMID:22535601
    reference_title: "Acute promyelocytic leukemia: four distinct patterns by flow cytometry immunophenotyping."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Leukemic cells had the following phenotype: CD11b-, CD11c-, CD13+, CD33+,
      CD45+, CD64+/-, CD117+, and HLA-DR-.
    explanation: The 97-patient series defines the characteristic core immunophenotype while also documenting variants.


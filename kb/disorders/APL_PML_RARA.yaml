      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        treatment of APL cell lines and primary cells with all-trans retinoic
        acid (ATRA) restored PU.1 expression and induced neutrophil
        differentiation.
      explanation: Restoration of PU.1 reverses the differentiation block, supporting the causal link.

- name: Granulocytic Differentiation Arrest
  description: >-
    PML::RARA-expressing myeloid cells fail to complete neutrophil maturation,
    creating a preleukemic compartment from which overt APL can emerge.
  cell_types:
  - preferred_term: promyelocyte
    term:
      id: CL:0000836
      label: promyelocyte
  biological_processes:
  - preferred_term: neutrophil differentiation
    modifier: DECREASED
    term:
      id: GO:0030223
      label: neutrophil differentiation
  evidence:
  - reference: PMID:9122233
    reference_title: A PMLRARalpha transgene initiates murine acute promyelocytic leukemia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      PMLRAR alpha transgenic mice exhibited impaired neutrophil maturation
      early in life, which progressed at a low frequency over the course of
      several months to overt APL.
    explanation: The transgenic model connects impaired maturation to a preleukemic state and later APL.
  downstream:
  - target: Promyelocyte Compartment Expansion
    description: Differentiation-arrested promyelocytes acquire increased proliferation and expand.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - altered cell-fate decisions and increased cell-cycle gene expression
    evidence:
    - reference: PMID:26088929
      reference_title: Transcription and methylation analyses of preleukemic promyelocytes indicate a dual role for PML/RARA in leukemia initiation.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Further, gene set enrichment analysis revealed that PML/RARA
        promyelocytes exhibit a subtle increase in expression of cell cycle
        genes, and we show that this leads to both increased proliferation of
        these cells and expansion of the promyelocyte compartment.
      explanation: The model identifies the proliferative intermediate linking the preleukemic state to compartment expansion.


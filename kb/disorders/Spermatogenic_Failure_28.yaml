    evidence_source: HUMAN_CLINICAL
    snippet: "Herein, we identified compound heterozygous variants in FANCM in two NOA-affected brothers (c. 1778delG:p. R593Qfs*76 and c. 1663G > T:p. V555F), and a homozygous variant in FANCM (c. 1972C > T:p. R658X) in a sporadic case with NOA, respectively."
    explanation: Replication in Chinese patients.
animal_models:
- name: FancmΔC/ΔC mouse
  species: Mouse
  genotype: Fancm truncating variant nearly equivalent to human p.P648Lfs*16, homozygous
  publication: PMID:29895858
  description: >-
    Males show spermatogenic failure with germ cell loss, Sertoli cell-only
    tubules and round spermatid arrest, and spermatogonia are hypersensitive
    to mitomycin C. No marrow failure or tumors were seen in adult mice.
  modeled_mechanisms:
  - target: Progressive Germ Cell Depletion
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: The model reproduces germ cell loss and Sertoli cell-only tubules.
    limitations: >-
      The mice are subfertile rather than sterile, and many tubules show
      round spermatid arrest, which has not been examined in patients.
    evidence:
    - reference: PMID:29895858
      reference_title: "A homozygous FANCM frameshift pathogenic variant causes male infertility."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Hence, FancmΔC/ΔC mice phenocopied the clinical phenotypes in our patients (Table 1)."
      explanation: Authors' statement that the mice reproduce the patient phenotype.
- name: FancmΔ2/Δ2 knockout mouse
  species: Mouse
  genotype: Fancm exon 2 deletion, homozygous
  publication: PMID:19561169
  description: >-
    Fancm knockout mice have hypogonadism, crosslinker-sensitive embryonic
    fibroblasts and reduced tumor-free survival, without the full Fanconi
    anemia picture.
  modeled_mechanisms:
  - target: Progressive Germ Cell Depletion
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: Gonadal hypoplasia in both sexes.
    limitations: >-
      Reported as hypogonadism without a detailed testicular analysis in the
      abstract; the knockout removes exon 2 rather than modelling a patient
      allele.
    evidence:
    - reference: PMID:19561169
      reference_title: "Fancm-deficient mice reveal unique features of Fanconi anemia complementation group M."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "FANCM deficiency caused hypogonadism in mice and hypersensitivity to cross-linking agents in mouse embryonic fibroblasts (MEFs)"
      explanation: Gonadal defect in the knockout.
diagnosis:
- name: Karyotype and Y-chromosome microdeletion analysis
  description: >-
    Exclusion tests done before gene-level testing. Every reported man had a
    normal 46,XY karyotype and no Y-chromosome microdeletion.
  diagnosis_term:
    preferred_term: karyotyping and Y-chromosome microdeletion analysis
    term:
      id: NCIT:C16768
      label: Karyotyping
  results: Normal 46,XY karyotype with no Y-chromosome microdeletion.
  evidence:
  - reference: PMID:34976027
    reference_title: "Novel Bi-Allelic Variants of FANCM Cause Sertoli Cell-Only Syndrome and Non-Obstructive Azoospermia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients have 46,XY karyotypes without microdeletions in the Y chromosome."
    explanation: Chromosomal causes were excluded in the Chinese patients.
- name: Semen analysis
  description: >-
    Repeated semen analysis shows azoospermia with normal ejaculate volume,

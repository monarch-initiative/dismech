name: Spermatogenic Failure 28
creation_date: "2026-10-15T00:00:00Z"
category: Mendelian
synonyms:
- SPGF28
- spermatogenic failure 28
- FANCM-related non-obstructive azoospermia
description: >-
  Spermatogenic failure 28 (SPGF28) is autosomal recessive male infertility
  caused by biallelic loss-of-function variants in FANCM, a DNA translocase
  that works with the Fanconi anemia (FA) core complex and the Bloom helicase
  complex to keep replicating and recombining DNA stable. Most reported men
  have non-obstructive azoospermia, and testicular biopsy shows a Sertoli
  cell-only pattern with no germ cells. Men in one consanguineous Pakistani
  family had oligoasthenozoospermia instead, so the spermatogenic defect is
  variable. Patient lymphocytes break their chromosomes more often after
  exposure to the crosslinking agent mitomycin C, but the men reported with
  spermatogenic failure had no bone marrow failure or congenital
  malformations. In mice, Fancm loss depletes primordial germ cells and then
  spermatogonial stem cells, and arrests some spermatids. Biallelic FANCM
  truncating variants are also found in women with premature ovarian
  insufficiency and in people of both sexes with early-onset cancer and severe
  chemotherapy toxicity. ClinGen groups these presentations with SPGF28 as one
  autosomal recessive FANCM Fanconi-like genomic instability disorder, which
  is distinct from Fanconi anemia.
disease_term:
  preferred_term: spermatogenic failure 28
  term:
    id: MONDO:0054732
    label: spermatogenic failure 28
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0100578
      label: FANCM Fanconi-like genomic instability disorder
    mapping_predicate: skos:broadMatch
    mapping_source: MONDO
    mapping_justification: >-
      ClinGen lumps spermatogenic failure 28 (OMIM 618086), premature ovarian
      failure 15 (OMIM 618096) and Fanconi-like syndrome (OMIM 227850) into one
      autosomal recessive FANCM disease, MONDO:0100578. This entry covers the
      male spermatogenic presentation of that broader disorder. MONDO does not
      currently place MONDO:0054732 beneath MONDO:0100578.
parents:
- Spermatogenic Failure
- Genetic Disease
notes: >-
  MONDO cross-references this disease as OMIM 618086. The entry is kept at the
  MONDO spermatogenic failure 28 concept rather than at the broader ClinGen
  disease because MONDO keeps them as separate terms and the stub queue
  nominated this one. Female ovarian insufficiency and the cancer and
  chemotoxicity phenotypes are recorded only through the broadMatch mapping and
  the mechanistic hypothesis below, not as phenotypes of this entry. The
  Croatian man with Sertoli cell-only syndrome and a diffuse astrocytoma
  (PMID:38927643) carried two FANCM missense variants of uncertain
  significance, so he is not counted among the loss-of-function cases.
  Abstract-only caches: PMID:30075111, PMID:28837157, PMID:28837162,
  PMID:40642874, PMID:40818381, PMID:30714416, PMID:19561169.
inheritance:
- name: Autosomal recessive
  description: >-
    Disease requires biallelic FANCM loss-of-function variants: compound
    heterozygous frameshift and splice variants in Estonian brothers,
    homozygous nonsense variants in Estonian, Portuguese and Chinese men, and a
    homozygous frameshift in a consanguineous Pakistani family.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:30075111
    reference_title: "Bi-allelic Recessive Loss-of-Function Variants in FANCM Cause Non-obstructive Azoospermia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The study convincingly demonstrates that bi-allelic recessive LoF variants in FANCM cause azoospermia."
    explanation: Recessive biallelic loss of function causes the disease.
  - reference: PMID:29895858
    reference_title: "A homozygous FANCM frameshift pathogenic variant causes male infertility."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A homozygous PV in FANCM (c.1946_1958del, p.P648Lfs*16) was found cosegregating with male infertility."
    explanation: Homozygous variant segregating with infertility in a consanguineous family.
pathophysiology:
- name: Loss of FANCM DNA Translocase Activity
  description: >-
    Biallelic truncating variants remove full-length FANCM. FANCM is a
    structure-specific DNA translocase whose ATPase motor activity is needed
    to resist DNA crosslinkers; it remodels stalled replication forks and
    recombination intermediates. No full-length FANCM was detected in blood
    from the Pakistani patients.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: FANCM
    term:
      id: hgnc:23168
      label: FANCM
  molecular_functions:
  - preferred_term: DNA translocase activity
    modifier: DECREASED
    term:
      id: GO:0015616
      label: DNA translocase activity
  downstream:
  - target: Defective DNA Interstrand Crosslink Repair
    causal_link_type: DIRECT
  - target: Loss of Meiotic Crossover Restraint
    causal_link_type: DIRECT
    description: Shown in Fancm-deficient mice; not studied in patients.
  evidence:
  - reference: PMID:30714416
    reference_title: "A tumor suppressive DNA translocase named FANCM."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "FANCM is a tumor suppressor gene that encodes a conserved and structure-specific DNA translocase."
    explanation: Review stating the molecular function of FANCM.
  - reference: PMID:19423727
    reference_title: "Impaired FANCD2 monoubiquitination and hypersensitivity to camptothecin uniquely characterize Fanconi anemia complementation group M."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "FANCM and a C-terminal deletion mutant rescued the cross-linker sensitivity of FANCM(-/-) cells, whereas a FANCM ATPase mutant did not."
    explanation: The ATPase motor activity of FANCM is required for crosslinker resistance.
  - reference: PMID:29895858
    reference_title: "A homozygous FANCM frameshift pathogenic variant causes male infertility."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Western blot analysis using an antibody recognizing an epitope between FANCM amino acids 600 and 700 confirmed the absence of full-length FANCM protein from the blood samples of all three infertile brothers"
    explanation: Patient blood lacks full-length FANCM.
  - reference: PMID:30075111
    reference_title: "Bi-allelic Recessive Loss-of-Function Variants in FANCM Cause Non-obstructive Azoospermia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "introduce a premature STOP codon leading to a truncated protein"
    explanation: The Estonian compound heterozygous variants truncate FANCM.
- name: Defective DNA Interstrand Crosslink Repair
  description: >-
    Without FANCM, cells repair DNA interstrand crosslinks poorly. Patient
    lymphocytes accumulate dose-dependent chromosomal breaks after mitomycin
    C, and spermatogonia from the matching mouse model are also hypersensitive
    to mitomycin C.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: Interstrand cross-link repair
    modifier: DECREASED
    term:
      id: GO:0036297
      label: interstrand cross-link repair
  downstream:
  - target: Chromosomal breakage induced by crosslinking agents
    causal_link_type: DIRECT
  - target: Progressive Germ Cell Depletion
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Proposed: unrepaired DNA damage in proliferating germ cells reduces
      their survival. The spermatogonial hypersensitivity is shown in mice;
      which lesions kill human germ cells is not known.
    evidence:
    - reference: PMID:29895858
      reference_title: "A homozygous FANCM frameshift pathogenic variant causes male infertility."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The loss-of-function FANCM PV increased ICL sensitivity in lymphocytes of patients and FancmΔC/ΔC spermatogonia."
      explanation: Germ cells of the mouse model share the crosslink sensitivity seen in patient cells.
  evidence:
  - reference: PMID:29895858
    reference_title: "A homozygous FANCM frameshift pathogenic variant causes male infertility."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "lymphocytes from both IV:2 and IV:3 displayed a dose-dependent increase in MMC-induced chromosomal breaks per cell, which averaged 3 to 17 times those of the father"
    explanation: Crosslink sensitivity in lymphocytes of men with SPGF28.
  - reference: PMID:28837157
    reference_title: "Biallelic truncating FANCM mutations cause early-onset cancer but not Fanconi anemia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Patient-derived cells exhibited chromosomal fragility, hypersensitivity to interstrand crosslinks, and impaired FANCD2 monoubiquitination."
    explanation: Fibroblasts from other biallelic FANCM carriers show the same crosslink repair defect.
- name: Loss of Meiotic Crossover Restraint
  description: >-
    FANCM limits meiotic crossovers. Fancm-deficient mice have a genome-wide
    increase in crossover frequency. The authors propose that this
    anti-crossover role is separable from the germ cell loss, so it is not
    drawn as a cause of the infertility here.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: Negative regulation of reciprocal meiotic recombination
    modifier: DECREASED
    term:
      id: GO:0045128
      label: negative regulation of reciprocal meiotic recombination
  evidence:
  - reference: PMID:37601968
    reference_title: "Fancm has dual roles in the limiting of meiotic crossovers and germ cell maintenance in mammals."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "identify a genome-wide increase in crossover frequencies in Fancm-deficient mice"
    explanation: Mouse evidence for the anti-crossover role.
  - reference: PMID:37601968
    reference_title: "Fancm has dual roles in the limiting of meiotic crossovers and germ cell maintenance in mammals."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We propose that the anti-crossover function and role in gametogenesis of Fancm are separable"
    explanation: The authors separate this role from the gametogenesis defect.
- name: Progressive Germ Cell Depletion
  description: >-
    Germ cells are lost from the seminiferous tubules, leaving Sertoli cells
    only in the most severe cases. In mice, Fancm loss reduces primordial germ
    cells before birth and then progressively depletes spermatogonial stem
    cells with age. Human testis biopsies show the end state, Sertoli
    cell-only tubules; whether the human loss is also progressive is not
    known.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: Spermatogonium
    term:
      id: CL:0000020
      label: spermatogonium
  - preferred_term: Primordial germ cell
    term:
      id: CL:0000670
      label: primordial germ cell
  biological_processes:
  - preferred_term: Male germ-line stem cell population maintenance
    modifier: DECREASED
    term:
      id: GO:0036098
      label: male germ-line stem cell population maintenance
  downstream:
  - target: Sertoli cell-only phenotype
    causal_link_type: DIRECT
  - target: Non-obstructive azoospermia
    causal_link_type: DIRECT
  - target: Oligozoospermia
    causal_link_type: DIRECT
    description: Partial germ cell loss reduces sperm output without abolishing it.
  - target: Decreased testicular size
    causal_link_type: DIRECT
    description: Germ cells make up most of the seminiferous epithelium.
  - target: Elevated circulating follicle stimulating hormone level
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Raised FSH accompanies the loss of germ cells; the feedback route was not studied in these patients.
  - target: Male infertility
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:29895858
    reference_title: "A homozygous FANCM frameshift pathogenic variant causes male infertility."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "suggesting an age-dependent progressive loss of SSCs in FancmΔC/ΔC mice"
    explanation: Progressive spermatogonial stem cell loss in the mouse model of the patient variant.
  - reference: PMID:37601968
    reference_title: "Fancm has dual roles in the limiting of meiotic crossovers and germ cell maintenance in mammals."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: "It was previously reported that a reduction in the number of primordial germ cells occurs prior to birth in Fancm-mutant mice of both sexes."
    explanation: Earlier mouse work showing primordial germ cell loss.
  - reference: PMID:34976027
    reference_title: "Novel Bi-Allelic Variants of FANCM Cause Sertoli Cell-Only Syndrome and Non-Obstructive Azoospermia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "H&E staining and immunohistochemistry showed Sertoli cell-only Syndrome (SCOS) in the three patients with NOA."
    explanation: Complete germ cell loss in patient testes.
- name: Round Spermatid Maturation Arrest
  description: >-
    In the FancmΔC/ΔC mouse, which carries a variant close to the Pakistani
    family's, 43.5% of tubules stop at the round spermatid stage. This was
    not reported in other Fanc mouse models. It may explain why some men
    produce a few, poorly motile sperm instead of none, but no testis
    histology is available from those men.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: Spermatid
    term:
      id: CL:0000018
      label: spermatid
  biological_processes:
  - preferred_term: Spermatid development
    modifier: DECREASED
    term:
      id: GO:0007286
      label: spermatid development
  downstream:
  - target: Oligozoospermia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Reduced sperm motility
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Proposed from the mouse arrest; the cause of the motility defect in patients was not studied.
  evidence:
  - reference: PMID:29895858
    reference_title: "A homozygous FANCM frameshift pathogenic variant causes male infertility."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Adult FancmΔC/ΔC mice showed spermatogenic failure, with germ cell loss in 50.2% of testicular tubules and round-spermatid maturation arrest in 43.5% of tubules."
    explanation: Round spermatid arrest in the mouse model.
mechanistic_hypotheses:
- hypothesis_group_id: fancm_infertility_cancer_spectrum
  hypothesis_label: Men with SPGF28 may share the cancer and chemotoxicity risk of other biallelic FANCM carriers
  status: EMERGING
  description: >-
    The same biallelic FANCM truncating genotypes that cause SPGF28 cause
    premature ovarian insufficiency, early-onset cancer and severe
    chemotherapy toxicity in other carriers, and ClinGen treats these as one
    disease. A Finnish biobank study found high cancer risks in people
    homozygous for p.Gln1701*, one of the SPGF28 alleles. A systematic review,
    however, found that men carrying C-terminal truncating variants had only
    infertility, and the men reported with spermatogenic failure had no
    cancer when described. Whether men with SPGF28 carry a clinically
    meaningful cancer risk, and whether that depends on variant position, is
    unresolved.
  evidence:
  - reference: PMID:40642874
    reference_title: "Recessive FANCM cancer syndrome with high cancer risks, chemotherapy toxicity, chromosome fragility, and gonadal failure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Homozygous c.5101C>T (N = 76) was associated with a high risk of breast, head and neck, gastrointestinal, gynecological, hematologic, skin, and lung cancer"
    explanation: High cancer risk in homozygotes for an allele also reported in SPGF28 (p.Gln1701*).
  - reference: PMID:28837157
    reference_title: "Biallelic truncating FANCM mutations cause early-onset cancer but not Fanconi anemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Care should be taken with chemotherapy and radiation treatments in these patients due to expected acute toxicity."
    explanation: Chemotoxicity in biallelic FANCM carriers with cancer.
  - reference: PMID:28837162
    reference_title: "Individuals with FANCM biallelic mutations do not develop Fanconi anemia, but show risk for breast cancer, chemotherapy toxicity and may display chromosome fragility."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "They show a heterogeneous phenotype including cancer predisposition, toxicity to chemotherapy, early menopause, and possibly chromosome fragility."
    explanation: Cancer, chemotoxicity and gonadal failure together in women homozygous for FANCM loss-of-function variants.
  - reference: PMID:40818381
    reference_title: "Genotype-phenotype correlations in biallelic carriers of FANCM protein truncating variants: A systematic literature review."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Men carrying the same PTVs combinations showed infertility only."
    explanation: Men with C-terminal truncating variants had infertility without cancer in the reviewed reports.
  - reference: PMID:29895858
    reference_title: "A homozygous FANCM frameshift pathogenic variant causes male infertility."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "neither bone marrow failure nor cancer/tumor was detected in all the patients or adult FancmΔC/ΔC mice"
    explanation: >-
      No cancer in the three Pakistani patients when reported. Only the human
      half of the sentence is used here; the mouse result is not counted.
  - reference: CGGV:assertion_abb231b6-1452-4f24-a8c1-ab45a791e73c-2024-11-12T170000.000Z
    reference_title: "FANCM / FANCM Fanconi-like genomic instability disorder (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "we found no difference in molecular mechanism, inheritance pattern or phenotypic variability for Fanconi-like syndrome (OMIM:227850), Premature ovarian failure 15 (OMIM:618096) and Spermatogenic failure 28 (OMIM:618086)"
    explanation: ClinGen lumps SPGF28 with the cancer-prone Fanconi-like syndrome.

    description: Searches the testis for residual foci of spermatogenesis to bypass azoospermia.
  evidence:
  - reference: PMID:34976027
    reference_title: "Novel Bi-Allelic Variants of FANCM Cause Sertoli Cell-Only Syndrome and Non-Obstructive Azoospermia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The two brothers with NOA and the NOA-affected sporadic cases were subjected to microsurgical testicular sperm extraction (micro-TESE) operation"

  diagnosis_term:
    preferred_term: testicular biopsy
    term:
      id: NCIT:C15189
      label: Biopsy Procedure
  results: Sertoli cell-only tubules with no germ cells.
  evidence:
  - reference: PMID:34976027
    reference_title: "Novel Bi-Allelic Variants of FANCM Cause Sertoli Cell-Only Syndrome and Non-Obstructive Azoospermia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "H&E staining and immunohistochemistry showed Sertoli cell-only Syndrome (SCOS) in the three patients with NOA."
    explanation: Biopsy histology in three patients.
- name: Exome sequencing
  description: >-
    Exome sequencing finds the biallelic FANCM variants, confirmed by Sanger
    sequencing and segregation in the family.
  diagnosis_term:
    preferred_term: exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  results: Biallelic FANCM loss-of-function variants.
  evidence:
  - reference: PMID:30075111
    reference_title: "Bi-allelic Recessive Loss-of-Function Variants in FANCM Cause Non-obstructive Azoospermia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "whole-exome sequencing (WES) was applied to two Estonian brothers diagnosed with NOA and Sertoli cell-only syndrome (SCOS)"
    explanation: Exome sequencing identified the first FANCM family.
  - reference: PMID:29895858
    reference_title: "A homozygous FANCM frameshift pathogenic variant causes male infertility."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exome and Sanger sequencing were used for PV screening."
    explanation: Exome plus Sanger confirmation in the Pakistani family.
- name: Mitomycin C chromosomal breakage test
  description: >-
    Lymphocytes cultured with mitomycin C show excess chromosomal breaks.
    This supports a loss-of-function effect, for example when a variant is of
    uncertain significance; it is not specific to FANCM.
  diagnosis_term:
    preferred_term: chromosomal breakage analysis (mitomycin C)
    term:
      id: NCIT:C18280
      label: Cytogenetic Analysis
  results: Dose-dependent increase in mitomycin C-induced chromosomal breaks.
  evidence:
  - reference: PMID:29895858
    reference_title: "A homozygous FANCM frameshift pathogenic variant causes male infertility."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "lymphocytes from both IV:2 and IV:3 displayed a dose-dependent increase in MMC-induced chromosomal breaks per cell, which averaged 3 to 17 times those of the father"
    explanation: Breakage test result in two affected brothers.
treatments:
- name: Genetic Counseling
  description: >-
    Counseling on recessive inheritance and on the possible cancer and
    hematologic risks of biallelic FANCM variants, as recommended after a
    Sertoli cell-only case with an astrocytoma.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:38927643
    reference_title: "FANCM Gene Variants in a Male Diagnosed with Sertoli Cell-Only Syndrome and Diffuse Astrocytoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "genetic counseling should be applied to azoospermia patients diagnosed with FANC mutations"
    explanation: Authors' recommendation for men with FANC-gene azoospermia.
- name: Cancer and Hematologic Surveillance
  description: >-
    Regular screening for cancer and hematologic abnormalities is proposed by
    the authors of two case series. It is expert opinion; no study has tested
    surveillance in men with SPGF28.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: cancer and hematologic surveillance
    term:
      id: NCIT:C15406
      label: Cancer Screening
  evidence:
  - reference: PMID:38927643
    reference_title: "FANCM Gene Variants in a Male Diagnosed with Sertoli Cell-Only Syndrome and Diffuse Astrocytoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "with proposals for the multidisciplinary monitoring of these men in terms of regular screenings for cancer or hematologic abnormalities and other potential complications"
    explanation: Recommendation for cancer and hematologic screening.
  - reference: PMID:34976027
    reference_title: "Novel Bi-Allelic Variants of FANCM Cause Sertoli Cell-Only Syndrome and Non-Obstructive Azoospermia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thus, future cancer incidence of the patients should be monitored."
    explanation: A second group recommends cancer monitoring.
- name: Caution with Chemotherapy and Radiotherapy
  description: >-
    If a biallelic FANCM carrier develops cancer, crosslinking chemotherapy
    and radiotherapy may cause acute toxicity, so dose reduction or other
    regimens are suggested. This rests on carriers with cancer, not on men
    with SPGF28.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: dose-adapted chemotherapy and radiotherapy
  target_mechanisms:
  - target: Defective DNA Interstrand Crosslink Repair
    description: >-
      Cells that repair crosslinks poorly are more sensitive to crosslinking
      chemotherapy, which is the reason for the caution.
    evidence:
    - reference: PMID:28837157
      reference_title: "Biallelic truncating FANCM mutations cause early-onset cancer but not Fanconi anemia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Care should be taken with chemotherapy and radiation treatments in these patients due to expected acute toxicity."
      explanation: Links the caution to the cellular crosslink defect seen in these patients.
  evidence:
  - reference: PMID:38927643
    reference_title: "FANCM Gene Variants in a Male Diagnosed with Sertoli Cell-Only Syndrome and Diffuse Astrocytoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "such as dose reductions or alternative regimens of chemotherapy and/or radiotherapy"
    explanation: Suggested adaptation of cancer treatment.
- name: Microsurgical Testicular Sperm Extraction
  description: >-
    The Chinese men with SPGF28 underwent micro-TESE. Their tissue showed
    Sertoli cell-only histology, and no sperm retrieval outcome is reported
    in the cached sources. The yield in SPGF28 is unknown.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: microsurgical testicular sperm extraction
    term:
      id: NCIT:C94427
      label: Sperm Retrieval
  target_mechanisms:

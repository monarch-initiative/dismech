  diagnosis_term:
    preferred_term: semen analysis
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  results: Azoospermia with normal volume, or oligoasthenozoospermia.
  evidence:
  - reference: PMID:34976027
    reference_title: "Novel Bi-Allelic Variants of FANCM Cause Sertoli Cell-Only Syndrome and Non-Obstructive Azoospermia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Routine semen analyses (three times) revealed normal volume but no sperm in the ejaculate, indicating complete azoospermia."
    explanation: Repeated semen analysis establishes azoospermia.
- name: Testicular biopsy histology
  description: >-
    Histology and immunohistochemistry of testicular tissue, obtained at

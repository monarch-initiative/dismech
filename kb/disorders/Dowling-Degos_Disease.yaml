  - reference: PMID:28287404
    reference_title: Mutations in gamma-secretase subunit-encoding PSENEN underlie Dowling-Degos disease
      associated with acne inversa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Here, we have identified 6 heterozygous truncating mutations in PSENEN, encoding presenilin
      enhancer protein 2, in 6 unrelated patients and families with DDD in whom mutations in KRT5, POFUT1,

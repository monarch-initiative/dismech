name: Dowling-Degos Disease
creation_date: "2026-07-24T00:00:00Z"
updated_date: "2026-07-24T00:00:00Z"
description: >-
  Dowling-Degos disease is an autosomal dominant reticulate pigmentary dermatosis
  characterized by progressive, symmetric reticulate (net-like) hyperpigmentation of
  the flexures, most prominently the axillae, groin, neck, and inframammary and
  antecubital regions. Additional features include comedo-like follicular lesions,
  pitted perioral acneiform scars, and small hypopigmented macules. Onset is typically
  in adulthood. It is caused by heterozygous loss-of-function variants in genes
  affecting basal keratinocyte biology and Notch-pathway glycosylation, including KRT5
  (DDD1), POFUT1 (DDD2), POGLUT1 (DDD3), and PSENEN (DDD4). Histology shows filiform,
  antler-like downward elongation of pigmented rete ridges. The acantholytic variant is
  termed Galli-Galli disease.

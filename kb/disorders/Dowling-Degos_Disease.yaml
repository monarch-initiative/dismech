    explanation: Demonstrates multigene molecular evaluation across KRT5, POFUT1, POGLUT1, and PSENEN.
differential_diagnoses:
- name: Reticulate acropigmentation of Kitamura
  description: A related reticulate pigmentary disorder that is an important differential of DDD; POFUT1
    pathology shows clinical overlap with reticulate acropigmentation of Kitamura.
  distinguishing_features:
  - Acral (dorsal hands/feet) distribution with pitted palmar lesions rather than the flexural predominance
    typical of DDD.

pathophysiology:
- name: Basal Keratinocyte Keratin 5 Haploinsufficiency
  description: Heterozygous loss-of-function variants in KRT5 reduce keratin 5 available for the basal
    keratinocyte intermediate-filament cytoskeleton. Functional studies implicate keratins in cell adhesion,
    melanosome uptake, organelle transport, and nuclear anchorage, so KRT5 haploinsufficiency is thought
    to disturb epidermal architecture and melanosome handling, producing the characteristic reticulate
    hyperpigmentation.

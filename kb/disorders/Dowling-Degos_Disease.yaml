diagnosis:
- name: Skin Biopsy and Histopathology
  description: Histopathologic examination of a skin biopsy from a hyperpigmented flexural lesion demonstrates
    lacy, filiform downward elongation of heavily pigmented epidermal rete ridges associated with follicular
    cysts or dilated follicles and follicular hyperkeratosis (especially in PSENEN-associated disease).
  diagnosis_term:
    preferred_term: Skin Biopsy
    term:
      id: NCIT:C51692
      label: Skin Biopsy
  results: Lacy, finger-like downward elongation of pigmented epidermal rete ridges into the dermis with
    small follicular cysts, dilated follicles, or follicular hyperkeratosis.
  evidence:
  - reference: PMID:20332593
    reference_title: 'Dowling-Degos disease: case report and review of the literature.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: A biopsy showed lacy, finger-like epidermal extensions into the dermis which were heavily
      pigmented and associated with tiny cysts or dilated follicles.
    explanation: Documents the characteristic skin biopsy histopathology of Dowling-Degos disease.
  - reference: PMID:28287404
    reference_title: Mutations in gamma-secretase subunit-encoding PSENEN underlie Dowling-Degos disease
      associated with acne inversa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Further examination revealed that the histopathologic feature of follicular hyperkeratosis
      distinguished these 6 patients from previously studied individuals with DDD.
    explanation: Identifies follicular hyperkeratosis on biopsy as a distinguishing histopathologic feature
      in PSENEN-associated DDD.
- name: Molecular Genetic Testing
  description: Molecular genetic testing of KRT5, POFUT1, POGLUT1, and PSENEN confirms the genetic subtype

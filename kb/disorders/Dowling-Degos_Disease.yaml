  and is not assigned here to either POGLUT1 or PSENEN. MONDO:0014307 defines POGLUT1-related Dowling-Degos
  disease 4. MONDO currently has no PSENEN-specific Dowling-Degos subtype term, so the PSENEN-associated
  subtype is modeled without a subtype_term.

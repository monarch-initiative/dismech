pathophysiology:
- name: Basal Keratinocyte Keratin 5 Haploinsufficiency
  description: >-
    Heterozygous loss-of-function variants in KRT5 reduce keratin 5 available for the
    basal keratinocyte intermediate-filament cytoskeleton. This is thought to impair
    organelle (including melanosome) transport and keratinocyte-melanocyte interaction,
    producing abnormal epidermal melanin distribution and the characteristic reticulate
    hyperpigmentation.
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  - preferred_term: melanocyte
    term:
      id: CL:0000148
      label: melanocyte
  cellular_components:
  - preferred_term: keratin filament
    term:
      id: GO:0045095
      label: keratin filament
- name: Notch Pathway Glycosylation Deficiency
  description: >-
    POFUT1 and POGLUT1 add O-linked fucose and glucose to EGF-like repeats of Notch
    receptors, and PSENEN is a gamma-secretase subunit required for Notch intracellular
    domain release. Reduced Notch signaling in the epidermis is proposed to disturb
    keratinocyte differentiation and melanocyte homeostasis, converging on the same
    reticulate pigmentary phenotype seen with KRT5 haploinsufficiency.
  biological_processes:
  - preferred_term: Notch signaling pathway
    term:
      id: GO:0007219
      label: Notch signaling pathway
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
phenotypes:
- name: Reticulate hyperpigmentation of the flexures
  description: >-
    Progressive, symmetric net-like (reticulate) hyperpigmentation involving the
    flexural sites (axillae, groin, neck, inframammary and antecubital regions).
  phenotype_term:
    preferred_term: Reticulate hyperpigmentation
    term:
      id: HP:0007441
      label: Reticulated skin pigmentation
- name: Hyperpigmentation of the skin
  description: >-
    Increased cutaneous pigmentation, the defining feature of the disease.
  phenotype_term:
    preferred_term: Hyperpigmentation of the skin
    term:
      id: HP:0000953
      label: Hyperpigmentation of the skin
- name: Comedo-like lesions
  description: >-
    Comedo-like follicular papules, often on the back and flexures.
  phenotype_term:
    preferred_term: Comedones
    term:
      id: HP:0025249
      label: Comedo
- name: Pitted perioral scars
  description: >-
    Pitted acneiform scarring around the mouth.
  phenotype_term:
    preferred_term: Facial scarring
    term:
      id: HP:0100609
      label: Abnormal scarring
- name: Hypopigmented macules
  description: >-
    Small hypopigmented macules interspersed with the reticulate hyperpigmentation.
  phenotype_term:
    preferred_term: Hypopigmented skin macule
    term:
      id: HP:0001053
      label: Hypopigmented skin patches

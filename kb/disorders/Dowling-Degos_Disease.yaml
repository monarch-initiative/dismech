name: Dowling-Degos Disease
creation_date: '2026-07-24T00:00:00Z'
description: Dowling-Degos disease is an autosomal dominant reticulate pigmentary genodermatosis characterized
  by progressive, disfiguring reticulate (net-like) hyperpigmentation of the flexures, most prominently
  the axillae, groin, neck, and inframammary regions, often with interspersed hypopigmented macules, comedo-like
  follicular lesions, and follicular hyperkeratosis. Onset is typically postpubertal. It is caused by
  heterozygous loss-of-function variants, acting through haploinsufficiency, in genes affecting basal
  keratinocyte keratin organization (KRT5; DDD1) or Notch-receptor glycosylation and gamma-secretase cleavage
  (POFUT1, DDD2; POGLUT1, DDD4; PSENEN-associated DDD). Histology shows filiform, antler-like downward
  elongation of pigmented rete ridges without an increase in melanocyte number. The acantholytic histopathologic
  variant is termed Galli-Galli disease. PSENEN carriers can show comorbid acne inversa (hidradenitis
  suppurativa).

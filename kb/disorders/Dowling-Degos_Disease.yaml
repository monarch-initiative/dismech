treatments:
- name: Topical retinoids
  description: >-
    Topical retinoids have been used with limited and variable benefit for the
    pigmentary lesions.
- name: Laser therapy
  description: >-
    Ablative laser (e.g., erbium:YAG) has been reported for cosmetic improvement of
    hyperpigmented lesions, with variable results.

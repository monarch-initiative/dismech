      snippet: "HYAL2, encoding hyaluronidase 2, degrades extracellular hyaluronan, a critical component of the developing heart and palatal shelf matrix."
      explanation: >-
        Identifies extracellular hyaluronan degradation as the function of
        HYAL2, whose loss leaves that substrate incompletely turned over.
- name: Impaired extracellular hyaluronan degradation
  description: >-
    With HYAL2 activity lost, high-molecular-weight extracellular hyaluronan is
    not properly degraded. Because hyaluronan is a critical, developmentally
    regulated component of the extracellular matrix of the developing heart and
    palatal shelves, its dysregulated turnover disrupts the matrix remodeling
    required for normal morphogenesis of these structures.
  biological_scale: MOLECULAR

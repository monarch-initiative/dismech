pathophysiology:
- name: HYAL2 hyaluronidase 2 deficiency
  description: >-
    Biallelic loss-of-function variants in HYAL2 destabilize the hyaluronidase 2
    protein, dramatically reducing its levels and causing an absence of the
    GPI-anchored enzyme from the cell surface. HYAL2 normally degrades
    extracellular high-molecular-weight hyaluronan, acting alongside HYAL1 as one
    of the two major mammalian somatic hyaluronidases.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: HYAL2
    term:
      id: hgnc:5321
      label: HYAL2
  genetic_context:
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Biallelic HYAL2 missense and truncating variants destabilize the protein
      and abolish its cell-surface presentation, producing a loss of
      hyaluronidase 2 function. Nonsense alleles yield no detectable protein and
      missense alleles are degraded or fail GPI-anchored surface localization.
  molecular_functions:
  - preferred_term: hyaluronidase 2 activity
    modifier: DECREASED
    term:
      id: GO:0004415
      label: hyalurononglucosaminidase activity
  evidence:
  - reference: PMID:28081210
    reference_title: "Mutations in HYAL2, Encoding Hyaluronidase 2, Cause a Syndrome of Orofacial Clefting and Cor Triatriatum Sinister in Humans and Mice."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Transfection assays demonstrated that the gene mutations destabilize the molecule, dramatically reducing HYAL2 protein levels."
    explanation: >-
      Establishes that the pathogenic HYAL2 variants act by destabilizing the
      protein and reducing its levels, i.e. loss of function.
  - reference: PMID:34906488
    reference_title: Elucidating the clinical spectrum and molecular basis of HYAL2 deficiency.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "functional studies indicated that these variants cause protein instability and a concomitant cell surface absence of HYAL2 protein."
    explanation: >-
      Independent functional studies confirm that pathogenic missense variants
      cause HYAL2 protein instability and loss of the cell-surface enzyme.
  downstream:
  - target: Impaired extracellular hyaluronan degradation
    causal_link_type: DIRECT
    description: >-
      Loss of the cell-surface hyaluronidase 2 enzyme removes a major route for
      degrading extracellular hyaluronan.
    evidence:
    - reference: PMID:28081210
      reference_title: "Mutations in HYAL2, Encoding Hyaluronidase 2, Cause a Syndrome of Orofacial Clefting and Cor Triatriatum Sinister in Humans and Mice."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "HYAL2, encoding hyaluronidase 2, degrades extracellular hyaluronan, a critical component of the developing heart and palatal shelf matrix."
      explanation: >-
        Identifies extracellular hyaluronan degradation as the function of
        HYAL2, whose loss leaves that substrate incompletely turned over. This
        is a background statement of HYAL2 enzymology, not a human clinical
        observation, so it is graded OTHER.
- name: Impaired extracellular hyaluronan degradation
  description: >-
    With HYAL2 activity lost, high-molecular-weight extracellular hyaluronan is
    not properly degraded. Because hyaluronan is a critical, developmentally
    regulated component of the extracellular matrix of the developing heart and
    palatal shelves, its dysregulated turnover disrupts the matrix remodeling
    required for normal morphogenesis of these structures.
  biological_scale: MOLECULAR

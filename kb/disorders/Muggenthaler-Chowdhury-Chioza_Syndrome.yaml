notes: >-
  Muggenthaler-Chowdhury-Chioza syndrome is the HYAL2 counterpart of HYAL1
  deficiency (mucopolysaccharidosis type IX). Both disrupt somatic hyaluronan
  turnover, but they are clinically and biochemically distinct: HYAL1 loss
  produces a mild, joint-centred lysosomal storage phenotype, whereas HYAL2 loss
  produces a developmental multiple-congenital-anomaly syndrome of orofacial
  clefting, cor triatriatum sinister, and craniofacial dysmorphism, reflecting
  the role of HYAL2 in degrading hyaluronan in the developing heart and palatal
  shelf matrix. The disorder is ultra-rare; the reported case series remain
  small (17 individuals from seven families summarized in GeneReviews as of the
  2023 review), so several well-documented features are described conservatively
  in prose rather than over-annotated. Cor triatriatum sinister and hearing loss
  are incompletely penetrant, having been identified in only a proportion of
  affected humans and Hyal2-/- mice.

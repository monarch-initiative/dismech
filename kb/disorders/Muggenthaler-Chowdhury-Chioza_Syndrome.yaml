diagnosis:
- name: Molecular genetic testing for biallelic HYAL2 variants
  description: >-
    The diagnosis is established in a proband with the suggestive craniofacial,
    cardiac, ophthalmic, otologic, and skeletal findings by identifying biallelic
    (homozygous or compound heterozygous) pathogenic HYAL2 variants on molecular
    genetic testing (exome or genome sequencing). There is no biochemical or
    functional assay in routine clinical use; molecular confirmation is the basis
    of diagnosis, and it also enables the carrier, prenatal, and preimplantation
    testing offered in genetic counseling.
  evidence:
  - reference: PMID:37733894
    reference_title: HYAL2 Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of HYAL2 deficiency is established in a proband with suggestive findings and biallelic pathogenic variants in HYAL2 identified by molecular genetic testing."
    explanation: >-
      GeneReviews states the diagnostic criterion - suggestive findings plus
      biallelic pathogenic HYAL2 variants on molecular genetic testing.

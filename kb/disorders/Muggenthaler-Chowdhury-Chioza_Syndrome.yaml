pathophysiology:
- name: HYAL2 hyaluronidase 2 deficiency
  description: >-
    Biallelic loss-of-function variants in HYAL2 destabilize the hyaluronidase 2
    protein, dramatically reducing its levels and causing an absence of the
    GPI-anchored enzyme from the cell surface. HYAL2 normally degrades
    extracellular high-molecular-weight hyaluronan, acting alongside HYAL1 as one
    of the two major mammalian somatic hyaluronidases.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: HYAL2
    term:
      id: hgnc:5321
      label: HYAL2
  molecular_functions:
  - preferred_term: hyaluronidase 2 activity
    modifier: DECREASED
    term:
      id: GO:0004415
      label: hyalurononglucosaminidase activity
  evidence:
  - reference: PMID:28081210
    reference_title: "Mutations in HYAL2, Encoding Hyaluronidase 2, Cause a Syndrome of Orofacial Clefting and Cor Triatriatum Sinister in Humans and Mice."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Transfection assays demonstrated that the gene mutations destabilize the molecule, dramatically reducing HYAL2 protein levels."
    explanation: >-
      Establishes that the pathogenic HYAL2 variants act by destabilizing the
      protein and reducing its levels, i.e. loss of function.
  - reference: PMID:34906488
    reference_title: Elucidating the clinical spectrum and molecular basis of HYAL2 deficiency.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "functional studies indicated that these variants cause protein instability and a concomitant cell surface absence of HYAL2 protein."
    explanation: >-
      Independent functional studies confirm that pathogenic missense variants
      cause HYAL2 protein instability and loss of the cell-surface enzyme.
  downstream:
  - target: Impaired extracellular hyaluronan degradation
    causal_link_type: DIRECT
    description: >-
      Loss of the cell-surface hyaluronidase 2 enzyme removes a major route for
      degrading extracellular hyaluronan.
    evidence:

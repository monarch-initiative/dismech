    reference_title: HYAL2 Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Once the HYAL2 pathogenic variants have been identified in an affected family member, carrier testing for relatives at risk and prenatal and preimplantation genetic testing are possible."
    explanation: >-
      GeneReviews documents the genetic counseling and testing options that
      follow from recessive inheritance.
  - reference: PMID:37733894
    reference_title: HYAL2 Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "each sib of an affected individual has at conception a 25% chance of being affected, a 50% chance of being an asymptomatic carrier, and a 25% chance of being unaffected and not a carrier."
    explanation: >-
      GeneReviews states the 25% sib recurrence risk that the genetic-counseling

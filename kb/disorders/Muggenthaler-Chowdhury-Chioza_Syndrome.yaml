    evidence:
    - reference: PMID:28081210
      reference_title: "Mutations in HYAL2, Encoding Hyaluronidase 2, Cause a Syndrome of Orofacial Clefting and Cor Triatriatum Sinister in Humans and Mice."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "HYAL2, encoding hyaluronidase 2, degrades extracellular hyaluronan, a critical component of the developing heart and palatal shelf matrix."
      explanation: >-
        Ties impaired hyaluronan turnover to the developing heart and palatal
        shelf matrix, the substrates of the affected morphogenesis. This is a
        background statement of HYAL2 enzymology, not a human clinical
        observation, so it is graded OTHER.
- name: Disrupted hyaluronan-dependent developmental morphogenesis
  description: >-
    Dysregulated hyaluronan turnover during embryonic development disrupts
    morphogenesis of the tissues in which hyaluronan is a critical, transient
    matrix constituent - the craniofacial structures (palatal shelves, lip), the
    heart, the vitreous of the eye, and the skeleton - producing the orofacial
    clefting, cardiac malformations, myopia, and skeletal findings that define
    the syndrome. Mechanistically, failure to clear high-molecular-weight
    hyaluronan drives excess epithelial-to-mesenchymal transition and decreased
    differentiation in the affected cushions and shelves. The Hyal2-/- mouse
    recapitulates these developmental abnormalities, supporting a causal,
    conserved role for HYAL2 in this process.
  biological_scale: TISSUE
  evidence:
  - reference: PMID:28081210
    reference_title: "Mutations in HYAL2, Encoding Hyaluronidase 2, Cause a Syndrome of Orofacial Clefting and Cor Triatriatum Sinister in Humans and Mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "investigations of Hyal2-/- mice revealed craniofacial abnormalities, including submucosal cleft palate."
    explanation: >-
      Hyal2-null mice develop craniofacial abnormalities including cleft palate,
      demonstrating that loss of HYAL2 disrupts craniofacial morphogenesis.
  downstream:
  - target: Cleft lip
    causal_link_type: DIRECT
    description: Disrupted palatal shelf and lip morphogenesis produces cleft lip.
  - target: Cleft palate
    causal_link_type: DIRECT
    description: Disrupted palatal shelf morphogenesis produces cleft palate.
  - target: Congenital cardiac anomalies
    causal_link_type: DIRECT
    description: Disrupted cardiac cushion morphogenesis produces the congenital cardiac anomalies.
  - target: Cor triatriatum sinister
    causal_link_type: DIRECT
    description: Disrupted cardiac morphogenesis produces cor triatriatum sinister.
  - target: Facial dysmorphism
    causal_link_type: DIRECT
    description: Disrupted craniofacial morphogenesis produces the characteristic facial dysmorphism.
  - target: Myopia
    causal_link_type: DIRECT
    description: >-
      Dysregulated hyaluronan turnover in the vitreous, of which hyaluronan is
      the major macromolecule, disrupts ocular development and produces myopia.
  - target: Cataract
    causal_link_type: DIRECT
    description: Disrupted hyaluronan-dependent ocular development contributes to the cataract seen in some individuals.
  - target: Conductive hearing impairment
    causal_link_type: DIRECT
    description: >-
      Disrupted craniofacial and middle-ear development, associated with the
      palatal clefting, produces the conductive hearing impairment.
  - target: Sensorineural hearing loss
    causal_link_type: DIRECT
    description: >-
      Disrupted hyaluronan-dependent otic development is the proposed basis for
      the sensorineural hearing loss identified in a minority of individuals.
  - target: Pectus excavatum
    causal_link_type: DIRECT
    description: Disrupted hyaluronan-dependent skeletal development produces pectus excavatum.
  - target: Digital anomalies
    causal_link_type: DIRECT
    description: Disrupted hyaluronan-dependent skeletal development produces the digital anomalies.

    explanation: >-
      In silico modeling supports a protein-folding/destabilization mechanism for
      the missense variants.
animal_models:
- name: Hyal2-/- knockout mouse
  species: Mouse
  genotype: Hyal2 homozygous null (Hyal2-/-)
  publication: PMID:28081210
  description: >-
    Constitutive Hyal2-null mice were used to establish the causal, conserved
    role of HYAL2 in the disorder. They universally show facial dysmorphism,
    underdevelopment of the viscerocranium, submucosal cleft palate (in ~83% of
    nulls), and cardiac valve thickening; cor triatriatum sinister (~50%) and
    hearing loss are found in a proportion of animals, paralleling the
    incompletely penetrant features seen in affected humans. Because the null
    allele abolishes HYAL2 entirely - whereas the human missense alleles retain
    residual protein - the mouse also develops circulating hyaluronan
    accumulation and cardiopulmonary complications not seen in the described
    human patients.
  modeled_mechanisms:
  - target: Disrupted hyaluronan-dependent developmental morphogenesis
    relationship: PARTIALLY_RECAPITULATES
    fidelity: HIGH
    description: >-
      The Hyal2-null mouse reproduces the core craniofacial and cardiac
      developmental defects of the human syndrome, establishing HYAL2 loss as a
      conserved cause of the disrupted hyaluronan-dependent morphogenesis.
    limitations: >-
      Only a proportion of null mice manifest cor triatriatum sinister (~50%)
      and hearing loss, mirroring the incomplete penetrance of these features in
      humans; and the complete null abolishes HYAL2 (versus residual protein
      from human missense alleles), so nulls additionally develop circulating
      hyaluronan accumulation and cardiopulmonary disease absent in the described
      human patients.
    readouts:
    - name: Craniofacial morphogenesis (submucosal cleft palate)
      target: Disrupted hyaluronan-dependent developmental morphogenesis
      description: >-

name: Muggenthaler-Chowdhury-Chioza Syndrome
creation_date: "2026-09-02T00:00:00Z"
category: Mendelian
description: >-
  Muggenthaler-Chowdhury-Chioza syndrome (HYAL2 deficiency) is an ultra-rare
  autosomal recessive multiple congenital anomaly disorder caused by biallelic
  loss-of-function variants in HYAL2, which encodes hyaluronidase 2, a
  GPI-anchored cell-surface enzyme that degrades the extracellular
  glycosaminoglycan hyaluronan. Hyaluronan is a critical, transient component of
  the developing heart and palatal shelf matrix, and its regulated turnover is
  required for normal craniofacial and cardiac morphogenesis. Loss of HYAL2
  activity therefore produces a recognizable syndrome dominated by orofacial
  clefting (unilateral or bilateral cleft lip and palate), a characteristic
  craniofacial dysmorphism, and congenital cardiac anomalies, most distinctively
  cor triatriatum sinister - of which HYAL2 deficiency is the first defined
  molecular cause. More variable features include myopia (sometimes severe, with
  increased risk of retinal detachment), typically conductive hearing loss, and
  skeletal findings such as pectus excavatum and digital anomalies; intellect is
  usually normal. The condition is distinct from HYAL1 deficiency
  (mucopolysaccharidosis type IX), which affects the other major somatic
  hyaluronidase and presents as a mild joint-centred phenotype. First delineated
  by Muggenthaler and colleagues in 2017, only a handful of families have been
  reported.

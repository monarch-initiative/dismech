treatments:
- name: Supportive and multidisciplinary care
  description: >-
    There is no cure for HYAL2 deficiency. Management is supportive, coordinated
    by a multidisciplinary team (pediatric cardiology and cardiac surgery for
    cardiac anomalies, a craniofacial team for the clefting, and audiology and
    speech-language pathology for hearing and communication) to maximize function
    and reduce complications.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:37733894
    reference_title: HYAL2 Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There is no cure for HYAL2 deficiency. Supportive care to improve quality of life, maximize function, and reduce complications is recommended."
    explanation: >-
      GeneReviews states that management is supportive, with no curative therapy.
- name: Surgical repair of cleft and cardiac anomalies
  description: >-
    Surgical management is directed at the structural anomalies - staged
    craniofacial/cleft repair and cardiac surgery for the congenital cardiac
    anomalies (including cor triatriatum sinister when hemodynamically
    significant).
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  evidence:
  - reference: PMID:37733894
    reference_title: HYAL2 Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "care by specialists in pediatric cardiology and cardiac surgery and a multidisciplinary craniofacial team to coordinate timing and type of surgical interventions"
    explanation: >-
      GeneReviews describes cardiac surgery and coordinated craniofacial surgical
      interventions as part of management.
  target_mechanisms:
  - target: Cleft lip
    treatment_effect: RESTORES
    description: >-
      Staged craniofacial/cleft surgery repairs the orofacial cleft, restoring
      the lip anatomy; symptomatic correction of the structural malformation
      rather than modification of the underlying developmental mechanism.
  - target: Cleft palate
    treatment_effect: RESTORES
    description: Cleft palate repair restores palatal continuity for feeding and speech.
  - target: Congenital cardiac anomalies
    treatment_effect: RESTORES
    description: >-
      Cardiac surgery corrects the congenital cardiac anomalies (including
      lesions requiring intervention in the first year of life).
  - target: Cor triatriatum sinister
    treatment_effect: RESTORES
    description: >-
      Surgical resection of the dividing left-atrial membrane corrects cor
      triatriatum sinister when hemodynamically significant.
- name: Genetic counseling
  description: >-
    Because HYAL2 deficiency is autosomal recessive, genetic counseling informs
    families of the 25% recurrence risk for sibs and the availability of carrier,
    prenatal, and preimplantation genetic testing once the familial variants are
    known.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:

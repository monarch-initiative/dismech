  features: >-
    Muggenthaler-Chowdhury-Chioza syndrome is caused by biallelic
    loss-of-function variants in HYAL2, which encodes the GPI-anchored
    cell-surface hyaluronidase 2. The originally reported Amish and Saudi Arabian
    families carried homozygous missense variants, and a later series identified
    additional novel missense and small-deletion variants. Functional and in
    silico studies indicate that the missense variants cluster around the
    predicted enzymatic active site and destabilize protein folding, causing
    protein instability and loss of the enzyme from the cell surface.
  evidence:
  - reference: PMID:34906488
    reference_title: Elucidating the clinical spectrum and molecular basis of HYAL2 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ten newly identified individuals with this condition were investigated, and they were associated with 9 novel pathogenic variants."
    explanation: >-
      Expands the HYAL2 mutational spectrum with nine additional pathogenic
      variants across ten newly identified individuals.
  - reference: PMID:34906488
    reference_title: Elucidating the clinical spectrum and molecular basis of HYAL2 deficiency.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "In silico modeling of missense variants identified likely deleterious effects on protein folding."
    explanation: >-
      In silico modeling supports a protein-folding/destabilization mechanism for
      the missense variants.
treatments:
- name: Supportive and multidisciplinary care
  description: >-
    There is no cure for HYAL2 deficiency. Management is supportive, coordinated
    by a multidisciplinary team (pediatric cardiology and cardiac surgery for
    cardiac anomalies, a craniofacial team for the clefting, and audiology and
    speech-language pathology for hearing and communication) to maximize function
    and reduce complications.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:37733894
    reference_title: HYAL2 Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There is no cure for HYAL2 deficiency. Supportive care to improve quality of life, maximize function, and reduce complications is recommended."
    explanation: >-
      GeneReviews states that management is supportive, with no curative therapy.
- name: Surgical repair of cleft and cardiac anomalies
  description: >-
    Surgical management is directed at the structural anomalies - staged
    craniofacial/cleft repair and cardiac surgery for the congenital cardiac
    anomalies (including cor triatriatum sinister when hemodynamically
    significant).
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  evidence:
  - reference: PMID:37733894
    reference_title: HYAL2 Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "care by specialists in pediatric cardiology and cardiac surgery and a multidisciplinary craniofacial team to coordinate timing and type of surgical interventions"
    explanation: >-
      GeneReviews describes cardiac surgery and coordinated craniofacial surgical
      interventions as part of management.
- name: Genetic counseling
  description: >-
    Because HYAL2 deficiency is autosomal recessive, genetic counseling informs
    families of the 25% recurrence risk for sibs and the availability of carrier,
    prenatal, and preimplantation genetic testing once the familial variants are
    known.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:37733894
    reference_title: HYAL2 Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Once the HYAL2 pathogenic variants have been identified in an affected family member, carrier testing for relatives at risk and prenatal and preimplantation genetic testing are possible."
    explanation: >-
      GeneReviews documents the genetic counseling and testing options that
      follow from recessive inheritance.

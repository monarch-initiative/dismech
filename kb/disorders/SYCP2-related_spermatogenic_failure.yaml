    loss-of-function is sufficient. The reported recessive pedigree, in which
    heterozygous carrier parents reproduced naturally, is directly relevant to
    what a carrier is told.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:37337432
    reference_title: "A homozygous frameshift variant in SYCP2 caused meiotic arrest and non-obstructive azoospermia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      And this variant was inherited from heterozygous parental carriers by
      natural reproduction.
    explanation: >-
      The observation that bears directly on recurrence-risk counseling for
      heterozygous carriers.
discussions:
- discussion_id: gap_sycp2_mode_of_inheritance_contested
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#SYCP2 Loss-of-Function Variants
  - disease#SYCP2-related spermatogenic failure
  prompt: >-
    Is SYCP2-related spermatogenic failure autosomal dominant, autosomal
    recessive, or both — and if heterozygous loss of function is pathogenic, why
    were the heterozygous parents in the reported recessive pedigree fertile?
  rationale: >-
    This is a live disagreement in the primary literature, not a gap in
    reporting. PMID:31866047 and PMID:39202451 identify heterozygous frameshift
    alleles in infertile men and, under the ClinGen framework, conclude that the
    aggregate evidence supports autosomal dominant inheritance strongly enough to
    put SYCP2 on diagnostic panels. PMID:37337432 reports a homozygous frameshift
    transmitted by heterozygous parents who conceived naturally, and concludes
    recessive inheritance "rather than an autosomal dominant pattern". Both
    cannot be unqualifiedly true of the same allele class. Reduced penetrance of
    heterozygous alleles would reconcile them, but no penetrance estimate exists,
    and the distinction determines recurrence-risk counseling and whether a
    heterozygous finding in an infertile man is reportable as causal.
  proposed_experiments:
  - experiment_id: exp_sycp2_heterozygote_fertility_cohort
    name: Semen phenotyping of obligate heterozygous carriers
    description: >-
      Systematically obtain semen analyses from the fertile heterozygous parents
      and other obligate carriers in reported SYCP2 pedigrees, to establish
      whether they are genuinely normozoospermic or subclinically affected.
    decision_criterion: >-
      Normal semen parameters in a series of obligate heterozygotes would argue
      that heterozygous loss of function is insufficient and support the recessive
      model. Subclinical oligozoospermia would support a dominant model with
      variable expressivity and reframe the disagreement as one about threshold,
      not mechanism.
  - experiment_id: exp_sycp2_burden_gnomad_penetrance
    name: Population burden of SYCP2 loss-of-function alleles
    description: >-
      Estimate the frequency of heterozygous SYCP2 loss-of-function alleles in
      large population reference cohorts not ascertained for infertility, and
      compare against the frequency in azoospermic and oligozoospermic case
      series.
    decision_criterion: >-
      A carrier frequency far exceeding the prevalence of SYCP2-attributable
      infertility would establish incomplete penetrance quantitatively and set an
      upper bound on the dominant model's contribution.

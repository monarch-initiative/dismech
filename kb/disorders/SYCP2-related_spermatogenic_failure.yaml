name: SYCP2-related spermatogenic failure
creation_date: "2026-08-24T22:05:00Z"
category: Mendelian
description: >-
  SYCP2-related spermatogenic failure (spermatogenic failure 1, SPGF1) is a
  meiotic cause of human male infertility arising from loss or dysregulation of
  SYCP2, which encodes an integral protein of the axial/lateral element of the
  synaptonemal complex. SYCP2 is the primary determinant of the axial element and
  is required to incorporate SYCP3 into the complex, so its disruption prevents
  assembly of the scaffold that homologous chromosomes need in order to synapse
  during meiotic prophase I. Affected men present across a spectrum from
  oligoasthenozoospermia and cryptozoospermia to non-obstructive azoospermia with
  meiotic arrest. Two distinct routes to the same lesion are documented:
  heterozygous frameshift (loss-of-function) alleles, and overexpression of the
  gene driven by a balanced chromosomal translocation through enhancer adoption
  — so both too little and too much SYCP2 disrupt the complex. The mode of
  inheritance is not settled, and this entry curates the disagreement rather than
  choosing a side.
disease_term:
  preferred_term: spermatogenic failure 1
  term:
    id: MONDO:0009776
    label: spermatogenic failure 1
parents:
- spermatogenic failure
synonyms:
- spermatogenic failure 1
- SPGF1
- SYCP2-related male infertility
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Heterozygous loss-of-function SYCP2 alleles have been reported in men with
    cryptozoospermia, azoospermia and oligoasthenozoospermia across several
    independent studies, and a formal ClinGen-framework reassessment concluded
    that the accumulated genetic and experimental evidence supports an autosomal
    dominant pattern.
  evidence:
  - reference: PMID:39202451
    reference_title: "Novel Loss-of-Function SYCP2 Variants in Infertile Males Upgrade the Gene-Disease Clinical Validity Classification for SYCP2 and Male Infertility to Strong."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These cases, combined with the previously reported cases, provide strong
      genetic evidence supporting an autosomal dominant inheritance pattern.
    explanation: >-
      A ClinGen-framework reassessment concluding that the aggregate genetic
      evidence supports autosomal dominant inheritance.
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    A homozygous SYCP2 loss-of-function variant was identified in a man with
    non-obstructive azoospermia and inherited from heterozygous parents who
    reproduced naturally. The authors argue from that pedigree that the
    gene-disease relationship is recessive rather than dominant. This block and
    the autosomal dominant block above are both curated deliberately; see the
    entry notes and the open discussion.
  evidence:
  - reference: PMID:37337432
    reference_title: "A homozygous frameshift variant in SYCP2 caused meiotic arrest and non-obstructive azoospermia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thus, this study revealed that SYCP2 associated with NOA segregates in an
      autosomal recessive inheritance pattern, rather than an autosomal dominant
      pattern.
    explanation: >-
      States the recessive conclusion drawn from a pedigree in which the
      heterozygous parents reproduced naturally.
notes: >-
  **The mode of inheritance is genuinely contested and both readings are
  curated.** PMID:31866047 and PMID:39202451 report heterozygous frameshift
  alleles in infertile men and conclude autosomal dominant; PMID:37337432
  reports a homozygous frameshift inherited from fertile heterozygous parents
  and concludes autosomal recessive, explicitly "rather than an autosomal
  dominant pattern". Two `inheritance` blocks are therefore present, each
  carrying its own evidence, and the conflict is recorded as an open
  discussion. Collapsing this to one block would have required deciding a
  question the field has not decided, and the fertile heterozygous parents in
  the recessive pedigree are a real observation that a dominant model has to
  account for.

  **Two mechanistically opposite lesions converge on the same node.** Most
  reported alleles are loss-of-function frameshifts, but the index subject of
  PMID:31866047 has a balanced translocation causing *overexpression* of SYCP2
  from the derivative allele through enhancer adoption. The pathograph models
  these as two triggers feeding one synaptonemal-complex node rather than as one
  "SYCP2 dysfunction" trigger, because dosage in either direction disrupting a
  stoichiometric structural complex is the actual claim, and flattening it would
  lose the overexpression route entirely.

  **Conformance stops short of the pachytene node on purpose.** The module's
  arrest node is named for pachytene, and the mouse literature supports arrest
  with spermatocyte apoptosis. But the one human histological study cited here
  (PMID:37337432) found spermatogenesis arrested at the **zygotene** stage.
  Declaring conformance to a pachytene-specific node on the strength of a
  zygotene observation would assert a stage this disorder's human evidence does
  not support, so this entry conforms at `#Synaptonemal Complex Assembly` and
  `#Spermatogenic Arrest and Non-Obstructive Azoospermia` only.

  **Evidence-strength note.** The strongest statement available about this
  gene-disease pair is a classification, not a finding: PMID:39202451 upgrades
  SYCP2-autosomal-dominant-male-infertility from "on the border of limited and
  moderate" to **strong** under the ClinGen Gene-Disease Validity SOP. The
  dismech `EvidenceItem` model has no slot for that classification, so it is
  recorded here in prose and in the `genetic` entry's `features`. See
  monarch-initiative/dismech#9421.

  Research input: `research/Spermatogenic_Failure_1-deep-research-perplexity.md`,
  which cleared the NEC preflight against MONDO:0009776 (PASS; SYCP2 mentioned
  235 times, next-nearest gene SYCP3 at 23). It returned no PMIDs in its body,
  so all references here were located independently in PubMed and fetched with
  `just fetch-reference`.
pathophysiology:
- name: SYCP2 Loss-of-Function Variants
  biological_scale: MOLECULAR
  description: >-
    Frameshift variants in SYCP2 truncate the protein and remove functional
    axial-element activity. These have been reported in the heterozygous state in
    men with cryptozoospermia, azoospermia and oligoasthenozoospermia, and in the
    homozygous state in a man with non-obstructive azoospermia.
  genes:
  - preferred_term: SYCP2
    term:
      id: hgnc:11490
      label: SYCP2
  evidence:
  - reference: PMID:31866047
    reference_title: "SYCP2 Translocation-Mediated Dysregulation and Frameshift Variants Cause Human Male Infertility."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Exome sequencing of infertile males revealed three heterozygous SYCP2
      frameshift variants in additional subjects with cryptozoospermia and
      azoospermia.
    explanation: >-
      Reports the heterozygous frameshift alleles in independently ascertained
      infertile men.
  - reference: PMID:39202451
    reference_title: "Novel Loss-of-Function SYCP2 Variants in Infertile Males Upgrade the Gene-Disease Clinical Validity Classification for SYCP2 and Male Infertility to Strong."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole exome sequencing (WES) and subsequent Sanger sequencing revealed novel
      heterozygous loss-of-function (LOF) variants in SYCP2
    explanation: >-
      Independent replication of heterozygous loss-of-function alleles in three
      further unrelated patients.
  downstream:
  - target: Synaptonemal Complex Axial Element Assembly Failure
    description: >-
      Loss of the axial-element protein prevents assembly of the axial/lateral
      elements of the synaptonemal complex.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:16717126
      reference_title: "Mouse SYCP2 is required for synaptonemal complex assembly and chromosomal synapsis during male meiosis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Sycp2 mutant spermatocytes exhibit failure in the formation of AEs and
        chromosomal synapsis.
      explanation: >-
        Direct demonstration in a mouse mutant that loss of SYCP2 function causes
        axial-element formation failure.
- name: SYCP2 Overexpression from Enhancer Adoption
  biological_scale: MOLECULAR
  description: >-
    A de novo balanced translocation, t(20;22)(q13.3;q11.2), drives exclusive
    overexpression of SYCP2 from the derivative chromosome 20 allele, attributed
    to adoption of an enhancer brought into range by the rearrangement. This is
    the mechanistic opposite of the frameshift alleles and reaches the same
    downstream node, consistent with the synaptonemal complex being sensitive to
    the stoichiometry of its structural components rather than simply to the
    presence of SYCP2.
  genes:
  - preferred_term: SYCP2
    term:
      id: hgnc:11490
      label: SYCP2
  evidence:
  - reference: PMID:31866047
    reference_title: "SYCP2 Translocation-Mediated Dysregulation and Frameshift Variants Cause Human Male Infertility."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified exclusive overexpression of SYCP2 from the der(20) allele that
      is hypothesized to result from enhancer adoption.
    explanation: >-
      Documents the overexpression and the proposed enhancer-adoption mechanism in
      the index subject.
  downstream:
  - target: Synaptonemal Complex Axial Element Assembly Failure
    description: >-
      Modelling the same dysregulation in budding yeast disrupted the structural
      integrity of the synaptonemal complex, supporting overexpression as a route
      to the same lesion.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:31866047
      reference_title: "SYCP2 Translocation-Mediated Dysregulation and Frameshift Variants Cause Human Male Infertility."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Modeling the dysregulation in budding yeast resulted in disrupted
        structural integrity of the synaptonemal complex, a common cause of
        defective spermatogenesis in mammals.
      explanation: >-
        A heterologous model shows that the dysregulation, not merely the loss,
        disrupts complex integrity.
- name: Synaptonemal Complex Axial Element Assembly Failure
  conforms_to: "meiotic_prophase_failure#Synaptonemal Complex Assembly"
  biological_scale: CELLULAR
  description: >-
    SYCP2 heterodimerizes with SYCP3 through a conserved coiled-coil domain and
    is the primary determinant of the axial/lateral elements: in a mouse mutant
    lacking that domain, mutant SYCP2 still localizes to axial chromosomal cores
    but SYCP3 does not, showing that SYCP2 is required to incorporate SYCP3 into
    the complex. Loss of the axial element removes the scaffold on which synapsis
    depends.
  cell_types:
  - preferred_term: primary spermatocyte
    term:
      id: CL:0000656
      label: primary spermatocyte
  biological_processes:
  - preferred_term: synaptonemal complex assembly
    term:
      id: GO:0007130
      label: synaptonemal complex assembly
    modifier: DECREASED
  evidence:
  - reference: PMID:16717126
    reference_title: "Mouse SYCP2 is required for synaptonemal complex assembly and chromosomal synapsis during male meiosis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      the mutant SYCP2 protein localizes to axial chromosomal cores in both
      spermatocytes and fetal oocytes, but SYCP3 does not, demonstrating that
      SYCP2 is a primary determinant of AEs/LEs and, thus, is required for the
      incorporation of SYCP3 into SCs
    explanation: >-
      Establishes the hierarchy within the axial element: SYCP2 is upstream of
      SYCP3 incorporation, which is why its loss is not equivalent to SYCP3 loss.
  - reference: PMID:16717126
    reference_title: "Mouse SYCP2 is required for synaptonemal complex assembly and chromosomal synapsis during male meiosis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We find that SYCP2 forms heterodimers with SYCP3 both in vitro and in vivo.
      An evolutionarily conserved coiled coil domain in SYCP2 is required for
      binding to SYCP3.
    explanation: >-
      Identifies the physical interaction and the domain that mediates it.
  downstream:
  - target: Homologous Chromosome Synapsis Failure and Meiotic Arrest
    description: >-
      Without assembled axial/lateral elements, homologous chromosomes cannot
      synapse, and affected spermatocytes arrest in meiotic prophase.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:16717126
      reference_title: "Mouse SYCP2 is required for synaptonemal complex assembly and chromosomal synapsis during male meiosis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        males are sterile because of a block in meiosis, whereas females are
        subfertile with sharply reduced litter size
      explanation: >-
        Links axial-element failure to a meiotic block, with the sexual dimorphism
        that also characterizes the human phenotype.
- name: Homologous Chromosome Synapsis Failure and Meiotic Arrest
  biological_scale: CELLULAR
  description: >-
    Homologous chromosomes fail to synapse and spermatocytes arrest in meiotic
    prophase I. In the one human testicular study cited here, histology,
    immunofluorescence and meiotic chromosome spreads placed the arrest at the
    zygotene stage. In the mouse, arrest is accompanied by spermatocyte
    apoptosis.
  cell_types:
  - preferred_term: spermatocyte
    term:
      id: CL:0000017

    reference_title: "SYCP2 Translocation-Mediated Dysregulation and Frameshift Variants Cause Human Male Infertility."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      While BCAs may reduce fertility by production of unbalanced gametes, a
      chromosomal rearrangement may also disrupt or dysregulate genes important in
      fertility.
    explanation: >-
      States the alternative interpretation of a balanced rearrangement in an
      infertile man.

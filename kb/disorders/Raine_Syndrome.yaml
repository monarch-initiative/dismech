      reference_title: Natural history of non-lethal Raine syndrome during childhood.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The most common neonatal comorbidity was respiratory distress secondary to choanal atresia."
      explanation: Directly links choanal atresia to neonatal respiratory compromise.
  evidence:
  - reference: PMID:25019372
    reference_title: "Raine syndrome: an overview."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The skeletal dysplasia predominantly affects craniofacial development explaining the severe proptosis, underdeveloped midface, depressed nasal bridge and short nose."
    explanation: Directly links the craniofacial skeletal overgrowth to the characteristic facial phenotype.
  - reference: PMID:33676444
    reference_title: "Recurrent variant c.1680C>A in FAM20C gene and genotype-phenotype correlation in a patient with Raine syndrome: a case report."

name: Raine Syndrome
creation_date: "2026-07-30T00:00:00Z"
category: Mendelian
description: >
  Raine syndrome (lethal osteosclerotic bone dysplasia, MIM #259775) is an
  ultra-rare autosomal recessive bone dysplasia caused by biallelic
  loss-of-function variants in FAM20C, which encodes the Golgi casein kinase
  that phosphorylates secreted proteins within S-x-E/pS motifs. It is
  characterized by generalized osteosclerosis with periosteal bone formation, a
  distinctive craniofacial phenotype (proptosis/exophthalmos, midface
  hypoplasia, depressed nasal bridge, gum hyperplasia, cleft palate, low-set
  ears), choanal atresia or stenosis, and intracranial (cerebral)
  calcification. The classic presentation is neonatal lethal, with death within
  days to weeks from respiratory insufficiency. A non-lethal (attenuated) form
  caused by hypomorphic FAM20C alleles is now well recognized, with survival
  into childhood and adulthood, FGF23-related hypophosphatemic rickets, dental
  anomalies including hypoplastic amelogenesis imperfecta, ectopic soft-tissue
  calcification, hearing or vision involvement, seizures, and variable
  neurodevelopmental delay. Historically the same entity was reported as
  congenital sclerosing osteomalacia with cerebral calcification (MIM 259660).

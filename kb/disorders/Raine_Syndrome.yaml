differential_diagnoses:
- name: Desmosterolosis
  description: >
    Desmosterolosis may resemble Raine syndrome clinically and should be
    considered in the differential diagnosis.
  evidence:
  - reference: PMID:25019372
    reference_title: "Raine syndrome: an overview."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Desmosterolosis and congenital cytomegalovirus infection may resemble Raine syndrome."
    explanation: Named as a phenocopy in the disease overview.
  - reference: PMID:9450875

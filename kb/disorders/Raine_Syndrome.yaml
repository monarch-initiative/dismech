      explanation: Directly demonstrates the DMP1-down/FGF23-up consequence of losing FAM20C activity.
  - target: Abnormal Bone Matrix Mineralization
    description: >
      Loss of SIBLING phosphorylation deranges matrix mineral nucleation and

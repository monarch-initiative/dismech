discussions:
- discussion_id: raine_osteosclerosis_vs_osteomalacia_model_mismatch
  kind: HUMAN_MODEL_MISMATCH
  prompt: >
    Why does Fam20c loss in mice produce hypophosphatemic rickets rather than
    the generalized osteosclerosis that defines human Raine syndrome, and what
    does that imply about the origin of the human sclerotic phenotype?
  rationale: >
    Global and tissue-specific Fam20c knockout mice, and transgenic mice
    expressing lethal (G374R) and non-lethal (D446N) Raine syndrome alleles,
    consistently develop hypophosphatemic rickets or osteomalacia without
    osteosclerosis. Only occasional conventional knock-in mice show an
    osteosclerotic radiographic appearance, and micro-CT of those bones shows
    reduced mineral density and increased porosity. Human autopsy histology
    likewise shows severe osteomalacia rather than true hypermineralization.
    This raises the possibility that human "osteosclerosis" is a radiographic
    semblance superimposed on an underlying osteomalacic/rachitic process,
    driven by extraskeletal systems (or FAM20C substrates outside bone) not
    captured by the mouse models.
  attaches_to:
  - pathophysiology#Abnormal Bone Matrix Mineralization
  proposed_experiments:
  - experiment_id: raine_bse_histomorphometry
    name: Quantitative bone mineral density distribution in human Raine syndrome bone
    description: >
      Quantitative backscattered-electron imaging and static/dynamic
      histomorphometry of non-decalcified human Raine syndrome bone, compared
      directly against the radiographic density of the same specimens, to test
      whether radiographic "osteosclerosis" reflects true hypermineralization or
      an osteomalacic matrix with altered geometry.
    would_support:
    - Radiographic osteosclerosis overlies an undermineralized osteomalacic matrix
    would_refute:
    - Raine syndrome bone is genuinely hypermineralized, matching the radiographic appearance
  - experiment_id: raine_extraskeletal_rescue
    name: Tissue-restricted Fam20c rescue outside the skeleton
    description: >
      Re-express Fam20c in candidate extraskeletal compartments (kidney, liver,
      brain, vasculature) on a global Fam20c-null background and assay whether
      an osteosclerotic skeletal phenotype emerges or is prevented, testing the
      hypothesis that the human sclerotic phenotype is driven by non-skeletal
      FAM20C substrates.
    would_support:
    - Osteosclerosis in Raine syndrome depends on loss of FAM20C activity outside bone
    would_refute:
    - The skeletal phenotype is entirely cell-autonomous to bone
  evidence:
  - reference: PMID:37698039
    reference_title: "Mutations of family with sequence similarity 20-member C gene causing lethal and nonlethal Raine syndrome causes hypophosphatemia rickets."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "transgenic mice expressing the mutant Fam20c found in the lethal (KO;G374R) and nonlethal (KO;D446N) Raine syndrome exhibited osteomalacia without osteosclerotic features."
    explanation: Documents the mouse-human mismatch for the defining osteosclerotic phenotype.
  - reference: PMID:36572689
    reference_title: "Altered sulfation status of FAM20C-dependent chondroitin sulfate is associated with osteosclerotic bone dysplasia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Fam20c deficiency in mice does not recapitulate the human disorder, so the underlying pathoetiological mechanisms remain poorly understood."
    explanation: States the model-human mismatch explicitly.
notes: >
  No GeneReviews chapter exists for Raine syndrome or FAM20C (PubMed searches
  for "Raine syndrome AND GeneReviews" and "FAM20C AND GeneReviews" return no
  results, checked 2026-07-31), so the phenotype baseline is drawn from the
  disease overview (PMID:25019372), the FAM20C/Raine syndrome review
  (PMID:34360805), and the non-lethal natural-history cohort (PMID:32299476).
  Nomenclature note: Whyte and colleagues showed that Raine syndrome
  (MIM #259775) and congenital sclerosing osteomalacia with cerebral
  calcification (MIM 259660) are the same FAM20C-related entity, which is why
  MONDO:0009821 carries both OMIM xrefs.

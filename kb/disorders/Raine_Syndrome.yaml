    explanation: Explains the mechanism by which craniofacial and thoracic involvement cause neonatal lethality.
  - reference: PMID:25019372
    reference_title: "Raine syndrome: an overview."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "If Raine syndrome is suspected prenatally the newborn should be admitted at a neonatal intensive care unit as significant respiratory distress is often present immediately after birth."
    explanation: Confirms respiratory distress as the immediate perinatal threat.
- name: Ectopic Intracranial and Soft Tissue Calcification
  biological_scale: TISSUE
  description: >
    Ectopic mineral is deposited outside the skeleton. The leading hypothesis is
    that loss of FAM20C-dependent phosphorylation of mineralization-INHIBITING
    secreted substrates removes a brake on mineral nucleation, but this has been
    demonstrated biochemically rather than at ectopic sites in patients, and a
    parallel in silico analysis proposes distinct brain-expressed FAM20C targets;
    the mechanism should be read as provisional.
    Intracranial calcifications are a cardinal feature, typically periventricular
    and involving basal ganglia and corpus callosum, and are accompanied in
    severe cases by periventricular gliosis, infarction, hemorrhage and
    leukomalacia. Brain-specific deletion of Fam20c in mice produces cerebral
    calcification without skeletal or dental defects, indicating that local loss
    of FAM20C function within the brain is sufficient. Ectopic calcification also
    occurs in soft tissue and solid organs in longer-surviving patients.
  evidence:
  - reference: PMID:36914045
    reference_title: "Intracranial calcification in Fam20c-deficient mice recapitulates human Raine syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Our results suggest that the local loss of FAM20C function in the brain may directly account for intracranial calcification."
    explanation: Brain-specific Fam20c deletion in mice shows a cell-autonomous CNS route to the calcification phenotype.
  - reference: PMID:36914045
    reference_title: "Intracranial calcification in Fam20c-deficient mice recapitulates human Raine syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "brain-specific deletion (mediated by Nestin-cre) of Fam20c in mice also led to cerebral calcification at an older age (postnatal 6 months), but no obvious skeletal or dental defects"
    explanation: Dissociates the CNS calcification mechanism from the skeletal and dental phenotypes.
  - reference: PMID:38163266
    reference_title: "Raine syndrome: Prenatally identified severe craniofacial phenotype with multisuture synostosis and brain abnormalities associated with variants in FAM20C."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Histological sections of the brain showed marked periventricular gliosis with regions of infarction, hemorrhage, and cavitation with global periventricular leukomalacia. Numerous dystrophic calcifications were diffusely present."
    explanation: Human neuropathology documenting dystrophic intracranial calcification and associated brain injury.
  - reference: PMID:37240249
    reference_title: "Potential Role of Protein Kinase FAM20C on the Brain in Raine Syndrome, an In Silico Analysis."
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: "However, FAM20C has many targets, including brain proteins and the cerebrospinal fluid phosphoproteome."
    explanation: In silico analysis proposing brain-expressed FAM20C substrates as a route to the neurological and calcification phenotype; hypothesis-generating only.
  - reference: PMID:37240249
    reference_title: "Potential Role of Protein Kinase FAM20C on the Brain in Raine Syndrome, an In Silico Analysis."
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: "Individuals with RNS can have developmental delay, intellectual disability, seizures, and structural brain defects, but little is known about FAM20C brain-target-protein dysregulation or about a potential pathogenesis associated with neurologic features."
    explanation: States the open question about the mechanism linking FAM20C loss to the neurological phenotype.
- name: Dental Hard Tissue Mineralization Failure
  biological_scale: TISSUE
  description: >
    FAM20C acts intracellularly within ameloblasts and odontoblasts, where its
    substrates (including DSPP and other SIBLINGs) direct enamel and dentin
    mineralization. Its loss produces a distinctive hypoplastic amelogenesis
    imperfecta affecting all teeth together with dentin abnormalities, a
    hallmark of the non-lethal form that should prompt FAM20C testing.
    Hypophosphatemic rickets adds spontaneous recurrent abscesses on non-carious
    teeth.
  cell_types:
  - preferred_term: ameloblast
    term:
      id: CL:0000059
      label: ameloblast
  - preferred_term: odontoblast
    term:
      id: CL:0000060
      label: odontoblast
  biological_processes:
  - preferred_term: biomineral tissue development
    modifier: ABNORMAL
    term:
      id: GO:0031214
      label: biomineral tissue development
  evidence:
  - reference: PMID:25928877
    reference_title: "Variability of systemic and oro-dental phenotype in two families with non-lethal Raine syndrome with FAM20C mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a profound failure of dental enamel formation leading to a distinctive hypoplastic AI in all teeth should alert clinicians to the possibility of FAM20C mutations."
    explanation: Establishes hypoplastic amelogenesis imperfecta as a defining dental manifestation of FAM20C loss.
  - reference: PMID:23703840
    reference_title: FAM20C functions intracellularly within both ameloblasts and odontoblasts in vivo.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "FAM20C localized intracellularly within ameloblasts and odontoblasts in a pattern consistent with Golgi localization."
    explanation: Localizes FAM20C to the Golgi of the two cell types that build enamel and dentin, grounding the dental mineralization defect.
  - reference: PMID:33505751
    reference_title: "Hypophosphataemic Rickets Secondary to Raine Syndrome: A Review of the Literature and Case Reports of Three Paediatric Patients' Dental Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Spontaneous recurrent abscesses on noncarious teeth result in significant odontogenic pain and multiple dental interventions."
    explanation: Documents the dental consequence of hypophosphataemic rickets in non-lethal Raine syndrome.
- name: Gingival Fibroblast Activation via TGF-beta and YAP/TAZ
  biological_scale: CELLULAR
  conforms_to: "fibrotic_response#Mesenchymal Cell Activation"
  description: >
    In non-lethal Raine syndrome, resident gingival fibroblasts are activated
    along the conserved pro-fibrotic axis. Proteomic and functional analyses of
    patient gingival tissue and primary gingival fibroblasts show upregulated
    TGF-beta/SMAD signaling together with engagement of the fibrogenic
    transcriptional cofactors YAP and TAZ; FAM20C knockdown reproduces the
    TGF-beta-YAP/TAZ interplay, defining a self-reinforcing profibrotic loop.
    This is the disease-specific instance of the conserved mesenchymal cell
    activation step of the fibrotic response, with the gingival fibroblast
    substituted for the generic fibroblast.
  cell_types:
  - preferred_term: gingival fibroblast
    term:
      id: CL:0002552
      label: fibroblast of gingiva
  biological_processes:
  - preferred_term: TGF-beta Receptor Signaling
    modifier: INCREASED
    term:
      id: GO:0007179
      label: transforming growth factor beta receptor signaling pathway
  downstream:
  - target: Excessive Gingival ECM Deposition and Calcification
    description: >
      Activated gingival fibroblasts overproduce and disorganize extracellular
      matrix.
    evidence:
    - reference: PMID:38664418
      reference_title: Gingival proteomics reveals the role of TGF beta and YAP/TAZ signaling in Raine syndrome fibrosis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Proteomic analysis of differentially expressed proteins demonstrated that proteins involved in extracellular matrix (ECM) regulation and related to the TGFβ/SMAD signaling pathway were increased."
      explanation: Links activated TGF-beta signaling to increased ECM-regulatory protein expression in patient gingiva.
  evidence:

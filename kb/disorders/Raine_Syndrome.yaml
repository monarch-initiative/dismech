  evidence:
  - reference: PMID:17924334
    reference_title: "Mutations in FAM20C are associated with lethal osteosclerotic bone dysplasia (Raine syndrome), highlighting a crucial molecule in bone development."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study defines the causative role of FAM20C in this lethal osteosclerotic disorder and its crucial role in normal bone development."
    explanation: Establishes FAM20C loss as the cause of the osteosclerotic skeletal phenotype.
  - reference: PMID:27862258
    reference_title: "Raine Syndrome (OMIM #259775), Caused By FAM20C Mutation, Is Congenital Sclerosing Osteomalacia With Cerebral Calcification (OMIM 259660)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >
    Raine syndrome is inherited in an autosomal recessive manner; affected
    individuals carry homozygous or compound heterozygous pathogenic FAM20C
    variants. Parental consanguinity is frequently reported, and unaffected
    parents are obligate heterozygous carriers.
  evidence:
  - reference: PMID:19250384
    reference_title: "Mutations in FAM20C also identified in non-lethal osteosclerotic bone dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in FAM20C, consistent with autosomal recessive inheritance, were identified in both cases."
    explanation: Documents autosomal recessive segregation of FAM20C variants in Raine syndrome families.
  - reference: PMID:24039075
    reference_title: "Hereditary deletion of the entire FAM20C gene in a patient with Raine syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report on a child who is homozygous for a 487-kb deletion in 7p22.3 that contains FAM20C. Both parents were heterozygous for the deletion."
    explanation: Homozygous whole-gene deletion with heterozygous carrier parents demonstrates recessive inheritance.
has_subtypes:
- name: Lethal RS
  display_name: Lethal (classic) Raine syndrome
  description: >
    The originally described, neonatal-lethal form. Affected neonates present
    at birth with generalized osteosclerosis, periosteal bone formation, the
    characteristic craniofacial phenotype and intracranial calcification, and
    die within the first days to weeks of life, usually from respiratory
    insufficiency secondary to midface hypoplasia with choanal atresia and a
    narrow, hypoplastic thorax. Typically associated with complete
    loss-of-function FAM20C alleles.
  genes:
  - preferred_term: FAM20C
    term:
      id: hgnc:22140
      label: FAM20C
  evidence:
  - reference: PMID:17924334
    reference_title: "Mutations in FAM20C are associated with lethal osteosclerotic bone dysplasia (Raine syndrome), highlighting a crucial molecule in bone development."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Lethal osteosclerotic bone dysplasia (or, Raine syndrome) is an autosomal recessive disorder characterized by generalized osteosclerosis with periosteal bone formation and a distinctive facial phenotype. Affected individuals survive only days or weeks."
    explanation: Defines the lethal subtype and its neonatal course.
- name: Non-lethal RS
  display_name: Non-lethal (attenuated) Raine syndrome
  description: >
    An attenuated form recognized since 2009, in which affected individuals
    survive infancy — into childhood, adolescence and adulthood (reported to at
    least 39 years). The phenotype is highly heterogeneous and dominated by
    FGF23-related hypophosphatemic rickets, hypoplastic amelogenesis
    imperfecta and dentin anomalies, ectopic soft-tissue and solid-organ
    calcification, facial dysmorphism, and variable neurodevelopmental delay,
    seizures and sensory involvement; osteosclerosis may be mild or absent.
    Associated with hypomorphic FAM20C alleles retaining residual kinase
    activity or partially preserved protein function.
  genes:
  - preferred_term: FAM20C
    term:
      id: hgnc:22140
      label: FAM20C
  evidence:
  - reference: PMID:19250384
    reference_title: "Mutations in FAM20C also identified in non-lethal osteosclerotic bone dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the identification of mutations in these two patients confirms a broader phenotypic spectrum and that mutation of FAM20C does not always lead to the infantile lethality previously seen as a prerequisite for Raine syndrome diagnosis."
    explanation: Establishes the existence of a non-lethal FAM20C-related Raine syndrome subtype.
  - reference: PMID:32299476
    reference_title: "Natural history of non-lethal Raine syndrome during childhood."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, there exists a non-lethal RS form, the phenotype of which is extremely heterogeneous."
    explanation: Confirms the non-lethal subtype and its marked phenotypic heterogeneity.
classifications:
  isds_skeletal_category:
  - classification_value: osteosclerotic_disorders
    notes: >-
      ISDS Nosology of Genetic Skeletal Disorders. Assigned from the 2019 revision
      (Mortier et al., PMID:31633310), Table 1 group 22 "Neonatal osteosclerotic
      dysplasias"; listed as "Raine dysplasia (lethal and nonlethal forms)". The 2023
      revision (Unger et al., PMID:36779427) dissolved that group into group 25
      "Osteosclerotic disorders", fusing the neonatal osteosclerotic dysplasias with the
      other sclerosing bone disorders, so the value is carried forward here. Membership
      has not been re-verified against the 2023 table.

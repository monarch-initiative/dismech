- name: Dysregulated FGF23 and Renal Phosphate Wasting
  biological_scale: ORGANISM
  description: >
    FAM20C directly phosphorylates FGF23 on Ser180 within its
    R176XXR179/S180AE subtilisin-like proprotein convertase motif; this
    phosphorylation blocks GalNAc-T3 O-glycosylation and promotes furin
    cleavage and inactivation of FGF23. FAM20C also sustains DMP1 expression,
    which suppresses FGF23 production. Loss of FAM20C therefore raises
    circulating intact, biologically active FGF23, causing renal phosphate
    wasting, hypophosphatemia, and FGF23-related hypophosphatemic rickets or
    osteomalacia — the dominant endocrine feature of the non-lethal form.
  gene:
    preferred_term: FGF23
    modifier: INCREASED
    term:
      id: hgnc:3680
      label: FGF23
  biological_processes:
  - preferred_term: phosphate ion homeostasis
    modifier: ABNORMAL
    term:
      id: GO:0055062
      label: phosphate ion homeostasis
  downstream:
  - target: Abnormal Bone Matrix Mineralization
    description: >
      Hypophosphatemia produces rickets/osteomalacia, on which the sclerotic
      radiographic phenotype is superimposed.
    evidence:
    - reference: PMID:32101876
      reference_title: High-Phosphate Diet Improved the Skeletal Development of Fam20c-Deficient Mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These results suggested that the hPi diet significantly improved the skeletal development of the Fam20c-deficient mice, implying that hypophosphatemia partially contributed to the skeletal defects in Fam20c-deficient subjects."
      explanation: Dietary phosphate rescue establishes hypophosphatemia as a causal contributor to the skeletal mineralization defect.
  evidence:
  - reference: PMID:24706917
    reference_title: "Dynamic regulation of FGF23 by Fam20C phosphorylation, GalNAc-T3 glycosylation, and furin proteolysis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here we show that Fam20C directly phosphorylates FGF23 on Ser(180), within the FGF23 R(176)XXR(179)/S(180)AE subtilisin-like proprotein convertase motif. This phosphorylation event inhibits O-glycosylation of FGF23 by polypeptide N-acetylgalactosaminyltransferase 3 (GalNAc-T3), and promotes FGF23 cleavage and inactivation by the subtilisin-like proprotein convertase furin."
    explanation: Defines the molecular mechanism by which FAM20C limits intact bioactive FGF23.
  - reference: PMID:24706917
    reference_title: "Dynamic regulation of FGF23 by Fam20C phosphorylation, GalNAc-T3 glycosylation, and furin proteolysis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "humans with FAM20C mutations and Fam20C KO mice develop hypophosphatemia due to an increase in full-length, biologically active FGF23"
    explanation: >
      Background statement summarising prior human and mouse work (this PNAS paper
      itself reports in vitro biochemistry), and it mixes human and mouse
      observations in one sentence - hence OTHER rather than HUMAN_CLINICAL.
      The human arm is independently evidenced by PMID:31471673 and PMID:25026495,
      the mouse arm by PMID:22615579.
  - reference: PMID:25026495
    reference_title: "Functional analysis of mutant FAM20C in Raine syndrome with FGF23-related hypophosphatemia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "our results suggest that FAM20C suppresses FGF23 production by enhancing DMP1 expression, and inactivating mutations in FAM20C cause FGF23-related hypophosphatemia by decreasing transcription of DMP1."
    explanation: Provides the DMP1-dependent arm of FGF23 dysregulation in Raine syndrome.
  - reference: PMID:22615579
    reference_title: "Inactivation of a novel FGF23 regulator, FAM20C, leads to hypophosphatemic rickets in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "both the global and mineralized tissue-specific cKO mice developed hypophosphatemic rickets (but not osteosclerosis), along with a significant downregulation of osteoblast differentiation markers and a dramatic elevation of fibroblast growth factor 23 (FGF23) in the serum and bone."
    explanation: Mouse Fam20c inactivation reproduces the FGF23-driven hypophosphatemic rickets arm of the human disease.
- name: Abnormal Bone Matrix Mineralization
  biological_scale: TISSUE
  description: >
    The matrix-level lesion. Loss of FAM20C-dependent substrate phosphorylation,
    compounded by FGF23-driven hypophosphatemia, leaves bone matrix abnormally
    mineralized with disorganized, thickened collagen fibrils and a widened,
    disorganized growth plate. Critically, this is an UNDER-mineralization
    lesion: non-decalcified human histology after tetracycline labeling
    documented severe osteomalacia (not rickets), and knock-in mouse tibiae that
    look osteosclerotic on radiography show reduced mineral density and
    increased porosity on micro-CT. FAM20C additionally fine-tunes chondroitin
    sulfate 4-O/6-O sulfation, an activity lost with Raine syndrome mutations,
    providing a further route to dysregulated osteoblast biomineralization.
    The relationship between this osteomalacic matrix and the sclerotic
    radiographic appearance is the entry's principal open question (see
    discussions).
  cell_types:

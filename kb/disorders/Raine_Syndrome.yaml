    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Knocking down of FAM20C confirmed the TGFβ-YAP/TAZ interplay indicating that a profibrotic loop enabled gingival fibrosis in RNS patients."
    explanation: Functional knockdown evidence for the TGF-beta-YAP/TAZ profibrotic loop driven by FAM20C loss.
  - reference: PMID:38664418
    reference_title: Gingival proteomics reveals the role of TGF beta and YAP/TAZ signaling in Raine syndrome fibrosis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "They furthermore uncover the contribution of increased TGFβ-YAP/TAZ signaling in the pathogenesis of the gingival fibrosis."
    explanation: States the increased TGF-beta-YAP/TAZ signaling contribution to the gingival phenotype.
- name: Excessive Gingival ECM Deposition and Calcification
  biological_scale: TISSUE
  conforms_to: "fibrotic_response#Excessive ECM Deposition"
  description: >
    Activated gingival fibroblasts overproduce and disorganize extracellular
    matrix, with increased profibrotic and pro-osteogenic proteins (POSTN,
    SPARC, VIM). The result is gingival fibrosis together with pathological
    ectopic gingival calcification — the tissue substrate of the gum
    hyperplasia seen clinically. The pro-osteogenic component distinguishes
    this from generic soft-tissue fibrosis and reflects the loss of
    FAM20C-dependent mineralization control.
  cell_types:
  - preferred_term: gingival fibroblast
    term:
      id: CL:0002552
      label: fibroblast of gingiva
  evidence:

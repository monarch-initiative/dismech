    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report on a child who is homozygous for a 487-kb deletion in 7p22.3 that contains FAM20C."
    explanation: Whole-gene deletion as a disease mechanism is the rationale for adding copy-number analysis.

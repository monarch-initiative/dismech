genetic:
- name: FAM20C
  gene_term:
    preferred_term: FAM20C
    term:
      id: hgnc:22140
      label: FAM20C
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  inheritance:
  - name: Autosomal recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
    evidence:
    - reference: PMID:19250384
      reference_title: Mutations in FAM20C also identified in non-lethal osteosclerotic bone dysplasia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Mutations in FAM20C, consistent with autosomal recessive inheritance, were identified in both cases."
      explanation: Confirms autosomal recessive segregation of FAM20C variants.
  notes: >
    Biallelic pathogenic variants in FAM20C at 7p22.3 cause Raine syndrome. The
    gene spans ~107 kb, consists of 10 exons and encodes a 584-amino-acid Golgi
    serine/threonine kinase whose critical kinase domain lies in the C-terminus
    (approximately residues 354-565). Reported alleles include missense
    substitutions at evolutionarily conserved residues, splice-site changes,
    nonsense variants, a synonymous splice-disrupting variant, and whole-gene
    deletions (including a 487-kb 7p22.3 deletion and a chromosome 7
    uniparental isodisomy with 7p telomeric microdeletion). Complete
    loss-of-function alleles are associated with the lethal neonatal
    presentation, while hypomorphic alleles retaining residual kinase activity
    or partial function underlie the non-lethal form; a nonsense variant in the
    terminal exon (c.1680C>A, p.Cys560Ter) has been associated with an extended
    lifespan. Genotype-phenotype correlation remains imperfect, with marked
    intrafamilial variability and discordant phenotypes reported for identical
    genotypes.
  evidence:
  - reference: PMID:17924334
    reference_title: "Mutations in FAM20C are associated with lethal osteosclerotic bone dysplasia (Raine syndrome), highlighting a crucial molecule in bone development."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sequence analysis of FAM20C, located within the deleted region, in six additional affected subjects revealed four homozygous mutations and two compound heterozygotes."
    explanation: Original identification of FAM20C as the Raine syndrome disease gene.
  - reference: PMID:40794899
    reference_title: "A synonymous single nucleotide variant on the FAM20C gene causes non-lethal Raine syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Biallelic mutations in the FAM20C gene, which encodes a Golgi serine/threonine protein kinase that phosphorylates secretory pathway proteins, are responsible for RNS."
    explanation: Confirms biallelic FAM20C variants as the cause of Raine syndrome.
  - reference: PMID:33676444
    reference_title: "Recurrent variant c.1680C>A in FAM20C gene and genotype-phenotype correlation in a patient with Raine syndrome: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "FAM20C gene, located on chromosome 7p22.3, spanning ~ 107 kb consists of 10 exons and encodes a protein of 584 amino acids in length. A critical kinase domain resides in its C-terminal, encompassing amino acids 354 to 565"
    explanation: Gene structure and kinase-domain location.
  - reference: PMID:33676444
    reference_title: "Recurrent variant c.1680C>A in FAM20C gene and genotype-phenotype correlation in a patient with Raine syndrome: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the position of a nonsense variant in the terminal exon of FAM20C gene, could have had a partial effect on the protein function, thereby resulting in a relatively milder phenotype and extended lifespan."
    explanation: Supports the hypomorphic-allele basis of the extended-lifespan phenotype.
  - reference: PMID:34360805
    reference_title: "FAM20C Overview: Classic and Novel Targets, Pathogenic Variants and Raine Syndrome Phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found the classic lethal and milder non-lethal phenotypes. The milder phenotype is defined by a large spectrum ranging from osteonecrosis to osteosclerosis with additional congenital defects or intellectual disability in some cases."
    explanation: Reviews the lethal versus non-lethal FAM20C variant-phenotype spectrum.
  - reference: PMID:24039075
    reference_title: "Hereditary deletion of the entire FAM20C gene in a patient with Raine syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Raine cases due to whole gene deletion do not seem to have a major difference in the phenotype over those caused by various mutations."
    explanation: Whole-gene deletion produces a phenotype comparable to point variants, consistent with loss of function.

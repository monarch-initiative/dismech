    reference_title: "Recurrent variant c.1680C>A in FAM20C gene and genotype-phenotype correlation in a patient with Raine syndrome: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of the 47 cases of RS reported worldwide; four are from India"
    explanation: Documents the cumulative reported-case count for Raine syndrome.
pathophysiology:
- name: Loss of FAM20C Golgi Casein Kinase Activity
  biological_scale: MOLECULAR
  description: >
    FAM20C is the Golgi casein kinase: an atypical, secretory-pathway protein
    kinase that localizes to the Golgi apparatus and phosphorylates serine
    residues within S-x-E/pS motifs of secreted proteins. Biallelic
    loss-of-function variants in FAM20C abolish or markedly reduce this kinase
    activity. Raine syndrome missense substitutions impair both Golgi
    localization and catalytic activity of the recombinant enzyme; a
    non-lethal splice-altering variant produces an in-frame insertion that
    mislocalizes the protein and reduces its secretion without disrupting
    dimerization.

      explanation: Shows the phosphorylation events lost in Raine syndrome control mineralization inhibition directly.
  - target: Ectopic Intracranial and Soft Tissue Calcification
    description: >
      Loss of phosphorylation on mineralization-inhibiting secreted substrates
      removes a brake on mineral nucleation outside the skeleton.

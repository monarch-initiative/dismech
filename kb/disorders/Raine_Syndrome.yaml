    explanation: Patient gingival tissue findings documenting fibrosis with pro-osteogenic protein upregulation.
  - reference: PMID:38664418
    reference_title: Gingival proteomics reveals the role of TGF beta and YAP/TAZ signaling in Raine syndrome fibrosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "gingival fibrosis and calcifications are associated with, and most likely caused by excessed ECM production and disorganization"

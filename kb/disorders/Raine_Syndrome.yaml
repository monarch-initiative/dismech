- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >
    Cumulative case counts remain very small; 47 cases reported worldwide as of
    the 2021 case report below. Published counts disagree because they use
    different inclusion criteria and cut-off dates: the 2021 FAM20C/Raine
    syndrome review by Palma-Lara et al. (PMID:34360805) tabulates a larger
    series of roughly 70 published patients (about 41 lethal and 29 non-lethal)
    in its full text. That figure is not quotable from the abstract, so it is
    recorded here as a curator note rather than as an evidence item; the 47
    figure below is retained as the snippet-verifiable count. Either way the
    order of magnitude - a few tens of published cases worldwide - is the same,
    and both are published-case tallies subject to ascertainment bias rather
    than population surveillance.
  evidence:

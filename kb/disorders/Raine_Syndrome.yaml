      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: "we find that FAM20C phosphorylates a biologically active peptide at amino acids essential for inhibition of biomineralization"
      explanation: Shows FAM20C phosphorylates residues essential for INHIBITION of biomineralization, the biochemical basis for loss of a mineralization brake; the extension to ectopic (extraskeletal) sites is inferred, hence PARTIAL.
  - target: Dental Hard Tissue Mineralization Failure

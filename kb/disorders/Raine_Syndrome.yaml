    snippet: "a few conventional Fam20cD446N knock-in mice died before weaning with the osteosclerotic X-ray radiography, though micro-CT assay displayed a reduced mineral density and increased porosity in the osteosclerotic tibia."
    explanation: Knock-in mouse data indicate the osteosclerotic radiographic appearance overlies undermineralized, porous bone.
  - reference: PMID:28620244
    reference_title: Specific ablation of mouse Fam20C in cells expressing type I collagen leads to skeletal defects and hypophosphatemia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "This study showed that the long bones of cKO mice were shorter and had a lower level of mineralization compared to the normal mice. The collagen fibrils in Fam20C-deficient bone were disorganized and thicker while the growth plate cartilage in cKO mice was disorganized and wider compared to the normal mice."
    explanation: Bone-cell-restricted Fam20C loss produces undermineralized bone with disorganized collagen fibrils, defining the matrix-level lesion.
- name: Generalized Osteosclerosis and Periosteal Bone Formation
  biological_scale: TISSUE
  description: >
    The radiographic readout of the abnormal matrix: a diffuse, marked increase
    in radiodensity of all bones, most striking at the skull base and long
    bones, together with periosteal new bone formation — the feature that
    distinguishes Raine syndrome from osteopetrosis and other sclerosing
    dysplasias. Modeled as a distinct node from the matrix lesion because the
    two dissociate: the sclerotic radiographic appearance overlies an
    osteomalacic, porous matrix, and osteosclerosis may be mild or absent in
    the non-lethal form.
  biological_processes:
  - preferred_term: ossification
    modifier: INCREASED
    term:
      id: GO:0001503
      label: ossification
  downstream:
  - target: Craniofacial Skeletal Overgrowth
    description: >
      Excess ossification of the skull and facial bones drives the craniofacial
      phenotype.
    evidence:
    - reference: PMID:33676444
      reference_title: "Recurrent variant c.1680C>A in FAM20C gene and genotype-phenotype correlation in a patient with Raine syndrome: a case report."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The increased ossification of the skull and facial bones underlies the characteristic facial features of RS, which include narrow prominent forehead, proptosis, depressed nasal bridge, and midface hypoplasia."
      explanation: States the causal link from skeletal over-ossification to the craniofacial phenotype.
  - target: Thoracic Hypoplasia and Pulmonary Hypoplasia
    description: >
      Skeletal involvement of the ribs and thoracic cage produces a narrow,
      hypoplastic thorax.
    evidence:
    - reference: PMID:33676444
      reference_title: "Recurrent variant c.1680C>A in FAM20C gene and genotype-phenotype correlation in a patient with Raine syndrome: a case report."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Clinical manifestations include generalized osteosclerosis, craniofacial dysplasia, thoracic hypoplasia and oro-dental anomalies."
      explanation: Lists thoracic hypoplasia alongside osteosclerosis as a skeletal manifestation; the causal ordering is inferred, hence PARTIAL.
  evidence:
  - reference: PMID:25019372
    reference_title: "Raine syndrome: an overview."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The main radiological manifestation is a diffuse, marked osteosclerosis of the base of skull and long bones."
    explanation: Defines the radiographic osteosclerosis and its anatomical distribution.
  - reference: PMID:33676444
    reference_title: "Recurrent variant c.1680C>A in FAM20C gene and genotype-phenotype correlation in a patient with Raine syndrome: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Periosteal bone formation is also a characteristic feature of this disorder differentiating it from osteopetrosis and other known lethal and nonlethal osteosclerotic bone dysplasias."
    explanation: Establishes periosteal new bone formation as the discriminating radiographic feature.
- name: Thoracic Hypoplasia and Pulmonary Hypoplasia
  biological_scale: ORGANISM
  description: >
    A narrow, hypoplastic thorax restricts lung growth, producing pulmonary
    hypoplasia. This arm is mechanistically independent of the craniofacial
    arm; the two converge on neonatal respiratory failure.
  downstream:
  - target: Neonatal Respiratory Failure
    description: >
      Pulmonary hypoplasia limits gas exchange from the first minutes of life.
    evidence:
    - reference: PMID:33676444
      reference_title: "Recurrent variant c.1680C>A in FAM20C gene and genotype-phenotype correlation in a patient with Raine syndrome: a case report."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Severe midface hypoplasia and narrow thorax leading to choanal atresia and pulmonary hypoplasia respectively, contribute to respiratory distress and have been regarded as the causes for early death."
      explanation: Attributes neonatal respiratory distress and early death to pulmonary hypoplasia arising from the narrow thorax.
  evidence:
  - reference: PMID:33676444
    reference_title: "Recurrent variant c.1680C>A in FAM20C gene and genotype-phenotype correlation in a patient with Raine syndrome: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Severe midface hypoplasia and narrow thorax leading to choanal atresia and pulmonary hypoplasia respectively, contribute to respiratory distress and have been regarded as the causes for early death."
    explanation: Attributes pulmonary hypoplasia specifically to the narrow thorax, separate from the midface/choanal arm.
- name: Neonatal Respiratory Failure
  biological_scale: ORGANISM
  description: >
    The convergent terminal node of the lethal form: upper-airway obstruction
    from choanal atresia/stenosis plus pulmonary hypoplasia from the narrow
    thorax produce severe respiratory distress from birth, the usual proximate
    cause of death within days to weeks.
  evidence:
  - reference: PMID:32299476
    reference_title: Natural history of non-lethal Raine syndrome during childhood.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "RS is usually lethal during the neonatal period due to severe respiratory distress."
    explanation: Identifies neonatal respiratory failure as the proximate cause of death.
  - reference: PMID:17924334
    reference_title: "Mutations in FAM20C are associated with lethal osteosclerotic bone dysplasia (Raine syndrome), highlighting a crucial molecule in bone development."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Affected individuals survive only days or weeks."
    explanation: Documents the neonatal-lethal course driven by respiratory failure.
- name: Craniofacial Skeletal Overgrowth
  biological_scale: ORGANISM
  description: >
    The dysplasia predominantly affects craniofacial development. Increased
    ossification of the skull and facial bones underlies the characteristic
    facies — narrow prominent forehead, severe proptosis, underdeveloped
    midface, depressed nasal bridge and short nose — and in the most severe
    cases multisuture craniosynostosis. Severe midface hypoplasia in turn
    produces choanal atresia or stenosis, obstructing the neonatal upper airway.
  biological_processes:
  - preferred_term: ossification
    modifier: INCREASED
    term:
      id: GO:0001503
      label: ossification
  downstream:

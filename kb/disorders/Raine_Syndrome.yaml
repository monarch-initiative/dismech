    preferred_term: FAM20C
    modifier: DECREASED
    term:
      id: hgnc:22140
      label: FAM20C
  molecular_functions:
  - preferred_term: Golgi casein kinase (protein serine/threonine kinase) activity
    modifier: DECREASED
    term:

    explanation: Primary report documenting the desmosterolosis-Raine syndrome phenotypic overlap and the biochemical test that separates them.
- name: Congenital cytomegalovirus infection
  description: >
    Congenital CMV infection can mimic Raine syndrome, particularly the
    intracranial calcification; CMV serology was negative in reported Raine
    syndrome cases where it was tested.
  evidence:
  - reference: PMID:25019372
    reference_title: "Raine syndrome: an overview."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Desmosterolosis and congenital cytomegalovirus infection may resemble Raine syndrome."
    explanation: Named as a phenocopy in the disease overview.
- name: FAM20A-related enamel-renal syndrome
  description: >
    FAM20A is the pseudokinase that allosterically activates FAM20C, and
    loss-of-function alleles cause amelogenesis imperfecta with gingival
    fibromatosis and nephrocalcinosis. It is the most instructive differential
    for the oral phenotype of non-lethal Raine syndrome (hypoplastic AI plus
    gingival fibrosis) but lacks osteosclerosis, periosteal bone formation and
    intracranial calcification.
  distinguishing_features:
  - FAM20A disease has no osteosclerosis, periosteal bone formation or intracranial calcification
  - FAM20A disease characteristically has nephrocalcinosis
  evidence:
  - reference: PMID:33759783
    reference_title: The ABCs of the atypical Fam20 secretory pathway kinases.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Loss-of-function genetic alterations in the Fam20 family lead to human diseases such as amelogenesis imperfecta, nephrocalcinosis, lethal and nonlethal forms of Raine syndrome with major skeletal defects, and altered phosphate homeostasis."
    explanation: Places the FAM20A and FAM20C disease phenotypes side by side within one gene family.
  - reference: PMID:33759783
    reference_title: The ABCs of the atypical Fam20 secretory pathway kinases.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "structural studies revealed that related member Fam20A allosterically activates Fam20C by forming a heterodimeric/tetrameric complex"
    explanation: Explains the mechanistic basis for the phenotypic overlap between FAM20A and FAM20C disease.
- name: Osteopetrosis
  description: >
    Osteopetrosis and other sclerosing bone dysplasias share generalized
    increased bone density but lack the periosteal new bone formation
    characteristic of Raine syndrome.
  distinguishing_features:
  - Periosteal bone formation is present in Raine syndrome and absent in osteopetrosis
  evidence:
  - reference: PMID:33676444
    reference_title: "Recurrent variant c.1680C>A in FAM20C gene and genotype-phenotype correlation in a patient with Raine syndrome: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Periosteal bone formation is also a characteristic feature of this disorder differentiating it from osteopetrosis and other known lethal and nonlethal osteosclerotic bone dysplasias."
    explanation: Names the radiographic feature distinguishing Raine syndrome from osteopetrosis.

diagnosis:
- name: Molecular genetic testing of FAM20C
  description: >
    Sequencing of FAM20C confirms the clinical diagnosis. Copy-number analysis
    must accompany sequencing because whole-gene and multi-exon deletions
    (including a 487-kb 7p22.3 deletion and a chromosome 7 uniparental
    isodisomy with 7p telomeric microdeletion) are established causes; a
    sequencing-only workflow that finds a single heterozygous allele can miss
    the second hit.

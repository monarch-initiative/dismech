  downstream:
  - target: Hypophosphorylation of Secreted Biomineralization Proteins
    description: >
      Loss of kinase activity leaves the FAM20C secreted phosphoproteome
      unphosphorylated.
    evidence:
    - reference: PMID:22582013
      reference_title: Secreted kinase phosphorylates extracellular proteins that regulate biomineralization.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Fam20C phosphorylates the caseins and several secreted proteins implicated in biomineralization, including the small integrin-binding ligand, N-linked glycoproteins (SIBLINGs). Consequently, mutations in Fam20C cause an osteosclerotic bone dysplasia in humans known as Raine syndrome."
      explanation: Establishes that the substrates left unphosphorylated when FAM20C is lost are the biomineralization phosphoproteins, and ties that directly to Raine syndrome.
  - target: Gingival Fibroblast Activation via TGF-beta and YAP/TAZ
    description: >
      Loss of FAM20C activity engages a TGF-beta-YAP/TAZ profibrotic loop in
      resident gingival fibroblasts.
    evidence:
    - reference: PMID:38664418
      reference_title: Gingival proteomics reveals the role of TGF beta and YAP/TAZ signaling in Raine syndrome fibrosis.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Knocking down of FAM20C confirmed the TGFβ-YAP/TAZ interplay indicating that a profibrotic loop enabled gingival fibrosis in RNS patients."
      explanation: siRNA knockdown of FAM20C is sufficient to engage the profibrotic loop, establishing the causal direction from kinase loss to fibroblast activation.
  evidence:
  - reference: PMID:22582013
    reference_title: "Secreted kinase phosphorylates extracellular proteins that regulate biomineralization."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Fam20C appears to be the Golgi casein kinase that phosphorylates secretory pathway proteins within S-x-E motifs."
    explanation: Identifies FAM20C as the Golgi casein kinase and defines its S-x-E substrate motif.
  - reference: PMID:22900076
    reference_title: "The Raine syndrome protein FAM20C is a Golgi kinase that phosphorylates bio-mineralization proteins."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Introduction of point mutations identified in Raine syndrome patients into recombinant FAM20C impairs its normal localization and kinase activity."
    explanation: Directly demonstrates that Raine syndrome variants impair FAM20C localization and catalysis.
  - reference: PMID:25026495
    reference_title: "Functional analysis of mutant FAM20C in Raine syndrome with FGF23-related hypophosphatemia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "all the mutant FAM20C proteins showed decreased kinase activities compared to wild-type (WT) FAM20C, and most of them also showed impaired secretion."
    explanation: Functional analysis of six Raine syndrome FAM20C mutants shows loss of kinase activity.
  - reference: PMID:40794899
    reference_title: "A synonymous single nucleotide variant on the FAM20C gene causes non-lethal Raine syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "this variant protein failed to localize properly to the Golgi apparatus and exhibited poor secretion from the cell."
    explanation: Shows a non-lethal Raine syndrome variant acts by mislocalizing FAM20C away from the Golgi.
  - reference: PMID:23754375
    reference_title: "Crystal structure of the Golgi casein kinase."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The nucleotide-free and Mn/ADP-bound structures unveil an atypical protein kinase-like fold and highlight residues critical for activity."
    explanation: >
      Provides the structural framework for the atypical Fam20 kinase fold and its
      catalytically critical residues. Note this is the C. elegans Fam20C ortholog
      and the paper does not itself map Raine syndrome variants onto residues; the
      variant-level loss of catalysis is evidenced separately by PMID:22900076 and
      PMID:25026495.
- name: Hypophosphorylation of Secreted Biomineralization Proteins
  biological_scale: MOLECULAR
  description: >
    FAM20C phosphorylates well over one hundred substrates in the secretory
    pathway, including the caseins and members of the SIBLING (small
    integrin-binding ligand, N-linked glycoprotein) family — DMP1, MEPE,
    osteopontin (SPP1), bone sialoprotein and DSPP — which regulate
    extracellular matrix biomineralization. Loss of FAM20C activity leaves
    these substrates hypophosphorylated, removing a key post-translational
    control on mineral nucleation and inhibition in bone and dental hard
    tissue.
  biological_processes:

    Two consanguineous families (five affected individuals) with molecularly confirmed SFMMP have been
    reported.
  evidence:
  - reference: PMID:38451290
    reference_title: "Heterozygous MAP3K20 variants cause ectodermal dysplasia, craniosynostosis, sensorineural hearing loss, and limb anomalies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Recently, biallelic variants in MAP3K20 (also known as ZAK) have been associated with SHFM type 7 (MIM # 616890), also known as split-foot malformation with mesoaxial polydactyly, in two separate consanguineous families (Spielmann 2016)."
    explanation: States that the published SFMMP literature consists of two consanguineous families.
  - reference: PMID:26755636
    reference_title: Exome sequencing and CRISPR/Cas genome editing identify mutations of ZAK as a cause of limb defects in humans and mice.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In a multiplex consanguineous Pakistani family with four affected individuals (family F1)"
    explanation: The index family contributed four of the five described patients; the second family had one affected boy.

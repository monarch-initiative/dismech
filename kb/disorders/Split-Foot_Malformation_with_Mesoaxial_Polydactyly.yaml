pathophysiology:
- name: Biallelic MAP3K20 SAM-Domain Lesions
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    The initiating lesions are homozygous MAP3K20 variants affecting the C-terminal SAM domain: the missense
    variant c.1103T>G p.(Phe368Cys) in the Pakistani family and a 14.7-kb intragenic deletion of exons 12-16
    in the Tunisian family. The SAM domain is present only in the long ZAK-alpha isoform; the short ZAK-beta
    isoform lacks it, so both lesions alter ZAK-alpha specifically.
  genes:
  - preferred_term: MAP3K20
    term:
      id: hgnc:17797
      label: MAP3K20
  genetic_context:
    genes:
    - preferred_term: MAP3K20
      term:
        id: hgnc:17797
        label: MAP3K20
    zygosity: HOMOZYGOUS
    variant_origin: GERMLINE
    notes: >-
      One missense allele and one intragenic exon deletion; both lie in the ZAK-alpha-specific SAM domain.
      The missense allele is hyperactive in cell assays, so a uniform loss-of-function category is not
      assigned.
  evidence:
  - reference: PMID:26755636
    reference_title: Exome sequencing and CRISPR/Cas genome editing identify mutations of ZAK as a cause of limb defects in humans and mice.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Notably, the missense alteration and the intragenic deletion both affect the SAM domain, which is only present in the longer ZAK-α isoform."
    explanation: Both disease alleles are confined to the ZAK-alpha-specific SAM domain.
  - reference: PMID:26755636
    reference_title: Exome sequencing and CRISPR/Cas genome editing identify mutations of ZAK as a cause of limb defects in humans and mice.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both variants cosegregated with the disease, were predicted to be damaging, and were absent or very rare in controls"
    explanation: Cosegregation of the homozygous ZAK missense variant in the index family.
  downstream:
  - target: Loss of Normal ZAK-alpha SAM Domain Structure
    causal_link_type: DIRECT
    description: >-
      The deletion removes the SAM-encoding exons; the missense variant destabilizes the domain.
    evidence:
    - reference: PMID:26755636
      reference_title: Exome sequencing and CRISPR/Cas genome editing identify mutations of ZAK as a cause of limb defects in humans and mice.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "These results indicate that the Phe368Cys mutation strongly destabilizes the ZAK SAM domain."
      explanation: Circular dichroism and thermal unfolding of purified wild-type and mutant SAM domains.
  - target: Abnormal fingernail with duplicated nail bed
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The nail-bed duplication segregates with the SAM-domain lesions in both families; no intermediate
      mechanism has been studied.
    evidence:
    - reference: PMID:26755636
      reference_title: Exome sequencing and CRISPR/Cas genome editing identify mutations of ZAK as a cause of limb defects in humans and mice.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The patients also had duplications of the nail bed on the hands"
      explanation: Genotype-phenotype association only; the step from ZAK-alpha to the nail unit is unknown.
      directness: INDIRECT
  - target: Bilateral sensorineural hearing impairment
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Hearing impairment was present in the missense family; Zak is expressed in mouse cochlear hair cells,
      but SAM-deleted mice showed no hearing defect on Preyer reflex screening and the auditory mechanism is
      unknown.
    evidence:
    - reference: PMID:26755636
      reference_title: Exome sequencing and CRISPR/Cas genome editing identify mutations of ZAK as a cause of limb defects in humans and mice.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In addition to limb defects, all patients in family 1 had bilateral sensorineural hearing impairment"
      explanation: Association of the homozygous missense allele with hearing impairment; mechanism not studied.
      directness: INDIRECT
- name: Loss of Normal ZAK-alpha SAM Domain Structure
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    p.Phe368Cys sits in the hydrophobic core of the SAM domain. The purified mutant domain loses about a
    third of its alpha-helicity, loses cooperative thermal unfolding and is aggregation prone. The exon 12-16
    deletion is predicted to remove the SAM domain entirely. These measurements were made on isolated
    domains, not on full-length protein in limb cells.
  genes:
  - preferred_term: MAP3K20
    term:
      id: hgnc:17797
      label: MAP3K20
  evidence:
  - reference: PMID:26755636
    reference_title: Exome sequencing and CRISPR/Cas genome editing identify mutations of ZAK as a cause of limb defects in humans and mice.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The CD spectrum of Phe368Cys showed a ∼30% loss of alpha-helicity compared with the wild-type"
    explanation: Direct biophysical measurement of SAM-domain destabilization.
  - reference: PMID:26755636
    reference_title: Exome sequencing and CRISPR/Cas genome editing identify mutations of ZAK as a cause of limb defects in humans and mice.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The Phe368Cys (F368C) substitution in the ZAK SAM domain causes a retarded migration, indicating protein aggregation."
    explanation: Native-gel evidence that the mutant SAM domain is aggregation prone.
  downstream:
  - target: Constitutive ZAK-alpha Kinase Activation
    causal_link_type: DIRECT
    description: >-
      Shown for p.Phe368Cys re-expressed in ZAK-knockout HEK293T cells; not tested for the deletion allele or
      in limb tissue.
    evidence:
    - reference: PMID:41261136
      reference_title: ZAK activation at the collided ribosome.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The known disease-associated mutation in the SAM domain (F368C) causes a hyperactive phenotype characterized by ZAK activation similar to another previously characterized constitutively active W347S mutant"
      explanation: The SFMMP missense allele is hyperactive in cell-based assays.
  - target: Reduced Hindlimb Bud Trp63 Expression
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Shown only for a mouse SAM-domain deletion that genocopies the Tunisian allele; the intermediates
      between ZAK-alpha and Trp63 transcription are not known.
    evidence:
    - reference: PMID:26755636
      reference_title: Exome sequencing and CRISPR/Cas genome editing identify mutations of ZAK as a cause of limb defects in humans and mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In contrast, a deletion of the SAM domain induces a complex hindlimb defect associated with down-regulation of Trp63, a known split-hand/split-foot malformation disease gene."
      explanation: Mouse SAM-domain deletion reduces hindlimb Trp63 expression.
- name: Constitutive ZAK-alpha Kinase Activation
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    ZAK-alpha is normally activated when its SAM domains dimerize on collided ribosomes. The SFMMP missense
    variant p.Phe368Cys is already fully autophosphorylated without induced ribosome collisions and can
    bypass the ribosome requirement. Whether this hyperactivity occurs in developing limb cells, or applies
    to the SAM-deletion allele, has not been tested.
  genes:
  - preferred_term: MAP3K20
    term:
      id: hgnc:17797
      label: MAP3K20
  molecular_functions:
  - preferred_term: MAP kinase kinase kinase activity
    modifier: INCREASED
    term:
      id: GO:0004709
      label: MAP kinase kinase kinase activity
  biological_processes:
  - preferred_term: protein autophosphorylation
    modifier: INCREASED
    term:
      id: GO:0046777
      label: protein autophosphorylation
  evidence:
  - reference: PMID:41261136
    reference_title: ZAK activation at the collided ribosome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "As expected, ANS treatment induced autophosphorylation of WT ZAK but did not change the extent of phosphorylation of F368C and K387D, which were already fully activated before ANS treatment"
    explanation: F368C is constitutively autophosphorylated in ZAK-knockout HEK293T cells.
  - reference: PMID:41261136
    reference_title: ZAK activation at the collided ribosome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Characterization of novel SAM variants as well as a known pathogenic variant of the SAM domain of ZAK supports a key role of the SAM domain in regulating kinase activity on and off the ribosome, with some mutants bypassing the ribosome requirement for ZAK activation."
    explanation: The SAM domain restrains ZAK activity; the pathogenic SAM variant escapes this control.
  downstream:
  - target: Disrupted Distal Hindlimb Patterning
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Proposed link. Increased kinase activity has been associated with the SAM-domain limb phenotype, but no
      experiment connects hyperactive ZAK to limb patterning.
    evidence:
    - reference: PMID:38451290
      reference_title: "Heterozygous MAP3K20 variants cause ectodermal dysplasia, craniosynostosis, sensorineural hearing loss, and limb anomalies."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Thus, biallelic loss-of-function variants in the kinase domain lead to CNM6, whereas biallelic variants in the SAM domain, which have been associated with increased kinase activity (Vind 2020), have been associated with limb anomalies and hearing loss."
      explanation: Authors' synthesis linking SAM-domain hyperactivity to the limb phenotype; an inference, not a test.
      directness: INDIRECT
- name: Reduced Hindlimb Bud Trp63 Expression
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  description: >-
    Mouse hindlimbs homozygous for a SAM-domain deletion show about a 60% decrease in Trp63 transcript at
    E11.5 by qRT-PCR, although Trp63, Fgf8 and Shh in situ staining patterns appeared normal. TP63 is an
    established split-hand/foot malformation gene. A reduced TP63 level has not been measured in human SFMMP
    tissue, and the authors state that the ZAK-TP63 link needs further work.
  genes:
  - preferred_term: TP63
    term:
      id: hgnc:15979
      label: TP63
  evidence:
  - reference: PMID:26755636
    reference_title: Exome sequencing and CRISPR/Cas genome editing identify mutations of ZAK as a cause of limb defects in humans and mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Expression analysis of Zakdel/del homozygous mutant (MT) hindlimbs at E11.5 showed a 60% decrease of Trp63 expression compared with wild-type (WT) hindlimbs."
    explanation: Quantitative Trp63 reduction in SAM-deleted mouse hindlimbs.
  - reference: PMID:26755636
    reference_title: Exome sequencing and CRISPR/Cas genome editing identify mutations of ZAK as a cause of limb defects in humans and mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "However, much more experimental work is needed to investigate a potential functional link between TP63 and ZAK."
    explanation: The authors' own caveat that the ZAK-TP63 relationship is not established.
  downstream:
  - target: Disrupted Distal Hindlimb Patterning
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Speculative link proposed by the authors, by analogy with Trp63 loss and retinoic-acid-induced limb

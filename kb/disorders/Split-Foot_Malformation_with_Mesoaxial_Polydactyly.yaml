genetic:
- name: MAP3K20
  gene_term:
    preferred_term: MAP3K20
    term:
      id: hgnc:17797
      label: MAP3K20
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Disease alleles are confined to the SAM domain of the long ZAK-alpha isoform. Biallelic truncating
    variants that remove both isoforms cause a congenital myopathy instead, and the complete mouse knockout of
    both isoforms is embryonic lethal. No external gene-disease validity classification was cached for this
    pair.
  evidence:
  - reference: PMID:26755636
    reference_title: Exome sequencing and CRISPR/Cas genome editing identify mutations of ZAK as a cause of limb defects in humans and mice.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we describe an autosomal recessive human disease in two unrelated families characterized by a split-foot defect, nail abnormalities of the hands, and hearing loss, due to mutations disrupting the SAM domain of the protein kinase ZAK."
    explanation: Homozygous ZAK SAM-domain mutations cause the disorder in two families.
  - reference: PMID:38451290
    reference_title: "Heterozygous MAP3K20 variants cause ectodermal dysplasia, craniosynostosis, sensorineural hearing loss, and limb anomalies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "It has two major isoforms, a long isoform and a short isoform, which does not contain the SAM domain"
    explanation: Only the long isoform carries the SAM domain affected in SFMMP.
  variants:
  - name: c.1103T>G p.(Phe368Cys)
    description: >-
      Homozygous missense variant at a conserved hydrophobic-core residue of the SAM domain, found in the
      Pakistani family. It destabilizes the isolated SAM domain and is constitutively active in cell assays.
    variant_type: single nucleotide variant
    evidence:
    - reference: PMID:26755636
      reference_title: Exome sequencing and CRISPR/Cas genome editing identify mutations of ZAK as a cause of limb defects in humans and mice.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "detected two homozygous missense variants in the linkage region: c.1247T > A (p.Phe416Tyr) in ZNF385B and c.1103T > G (p.Phe368Cys) in ZAK"
      explanation: Identification of the homozygous ZAK missense variant by exome sequencing in the linkage interval.
  - name: Exon 12-16 deletion
    description: >-
      Homozygous 14.7-kb intragenic deletion removing exons 12-16, which encode the SAM domain, in the
      Tunisian patient; heterozygous in his unaffected first-cousin parents.
    variant_type: deletion
    evidence:
    - reference: PMID:26755636
      reference_title: Exome sequencing and CRISPR/Cas genome editing identify mutations of ZAK as a cause of limb defects in humans and mice.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "this 14.7-kb deletion removed exons 12–16 of ZAK"
      explanation: Breakpoint sequencing defined the deletion.
animal_models:
- name: Zak SAM-domain deletion mouse
  species: Mouse
  genotype: Zak del/del (CRISPR/Cas deletion of the SAM-encoding region, genocopying the human exon 12-16 deletion)
  publication: PMID:26755636
  description: >-
    Highly chimeric mice from embryonic stem cells homozygous for an in-frame 12-kb deletion of the
    SAM-encoding region, with normal Zak mRNA levels in embryonic limbs.
  modeled_mechanisms:
  - target: Disrupted Distal Hindlimb Patterning
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      Produces hindlimb duplication and foot polydactyly, not a cleft foot.
    limitations: >-
      Low penetrance (4 of 64 animals) in chimeras, and the phenotype is duplication of the hindlimb or pelvis
      rather than a median cleft. No hearing defect was detected on Preyer reflex screening.
    evidence:
    - reference: PMID:26755636
      reference_title: Exome sequencing and CRISPR/Cas genome editing identify mutations of ZAK as a cause of limb defects in humans and mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "we observed a spectrum of unilateral complex hindlimb duplication phenotypes with low penetrance (four out of 64 animals)"
      explanation: Hindlimb patterning defect at low penetrance.
  - target: Reduced Hindlimb Bud Trp63 Expression
    relationship: MEASURES
    fidelity: UNKNOWN
    model_scale: TISSUE
    readouts:
    - name: Hindlimb Trp63 transcript by qRT-PCR at E11.5
      target: Reduced Hindlimb Bud Trp63 Expression
      direction: DECREASED
      interpretation: About 60% lower than in wild-type hindlimbs.
      evidence:
      - reference: PMID:26755636
        reference_title: Exome sequencing and CRISPR/Cas genome editing identify mutations of ZAK as a cause of limb defects in humans and mice.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Expression analysis of Zakdel/del homozygous mutant (MT) hindlimbs at E11.5 showed a 60% decrease of Trp63 expression compared with wild-type (WT) hindlimbs."
        explanation: The measured reduction in Trp63 transcript.
- name: Zak complete knockout mouse
  species: Mouse
  genotype: Zak -/- (CRISPR/Cas frameshift in exon 2, both isoforms)
  publication: PMID:26755636
  description: >-
    Frameshift inactivation of both Zak isoforms; homozygous embryos die at E9.5 with cardiac edema, and
    heterozygotes are normal.
  modeled_mechanisms:
  - target: Disrupted Distal Hindlimb Patterning
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      Whole-gene loss is lethal before limb patterning can be assessed, unlike the viable SAM-specific human
      disease.
    limitations: >-
      Removes both isoforms rather than only the ZAK-alpha SAM domain, so it models a different allele class.
    evidence:
    - reference: PMID:26755636
      reference_title: Exome sequencing and CRISPR/Cas genome editing identify mutations of ZAK as a cause of limb defects in humans and mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The CRISPR/Cas-mediated inactivation of Zak resulted in fully penetrant lethality at E9.5 due to severe cardiac edema and growth retardation"
      explanation: Embryonic lethality prevents modeling of the limb phenotype.

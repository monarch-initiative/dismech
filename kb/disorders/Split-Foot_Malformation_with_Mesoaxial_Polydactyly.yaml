name: Split-Foot Malformation with Mesoaxial Polydactyly
creation_date: "2026-10-09T12:00:00Z"
description: >-
  Split-foot malformation with mesoaxial polydactyly (SFMMP) is an autosomal recessive congenital limb
  malformation syndrome caused by biallelic MAP3K20 (ZAK) lesions that affect the sterile alpha motif (SAM)
  domain, which is present only in the long ZAK-alpha isoform. It was defined in two consanguineous families
  (one Pakistani family with four affected members and one Tunisian boy) with a variable split foot, partial
  duplication of the second toe, toe syndactyly, duplicated fingernail beds and, in the larger family,
  bilateral sensorineural hearing impairment. The missense allele destabilizes the isolated SAM domain and
  makes ZAK constitutively active in cell experiments, while a mouse SAM-domain deletion causes low-penetrance
  hindlimb duplication with reduced Trp63 expression. How either finding leads to the human foot defect is
  unresolved.
category: Mendelian
disease_term:
  preferred_term: Split-Foot Malformation with Mesoaxial Polydactyly
  term:
    id: MONDO:0014816
    label: split-foot malformation-mesoaxial polydactyly syndrome
synonyms:
- SFMMP
- split-foot malformation-mesoaxial polydactyly syndrome
- split-foot malformation-mesoaxial polydactyly-nail abnormalities-sensorineural hearing loss syndrome
- SHFM type 7
notes: >-
  No GeneReviews chapter exists for this disorder. Only two families with molecular confirmation have been
  reported, so per-feature counts describe five people and are not population frequencies. SFMMP is distinct
  from the MAP3K20-related congenital myopathy, caused by biallelic truncating variants that lose both
  isoforms, and from the dominant MAP3K20 disorder caused by heterozygous linker-region variants with
  ectodermal dysplasia and craniosynostosis. No treatment specific to SFMMP has been reported; management of
  the foot anomaly and hearing loss follows general practice, so no treatment record is included.

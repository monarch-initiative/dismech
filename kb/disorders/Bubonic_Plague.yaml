treatments:
- name: Early antibiotic therapy
  description: >-
    Antimicrobial treatment must be started early because untreated plague can be
    rapidly fatal; aminoglycosides, tetracyclines, fluoroquinolones, and
    sulfonamides all have reported clinical activity in treated human plague.
  treatment_term:
    preferred_term: antibiotic therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
    therapeutic_agent:
    - preferred_term: streptomycin
      term:
        id: CHEBI:17076
        label: streptomycin
    - preferred_term: gentamicin
      term:
        id: CHEBI:759884
        label: gentamicin
    - preferred_term: ciprofloxacin
      term:
        id: CHEBI:100241
        label: ciprofloxacin
  therapeutic_modality: SMALL_MOLECULE
  evidence:
  - reference: PMID:32435802
    reference_title: "Antimicrobial Treatment of Human Plague: A Systematic Review of the Literature on Individual Cases, 1937-2019."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In addition to aminoglycosides, other classes of antimicrobials including
      tetracyclines, fluoroquinolones, and sulfonamides are effective for plague
      treatment
    explanation: >-
      Systematic review of individual treated human plague cases identifying several
      active antibiotic classes.
  - reference: PMID:29183475
    reference_title: Bichat guidelines for the clinical management of plague and bioterrorism-related plague.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Most of the therapeutic guidelines suggest using gentamicin or streptomycin as
      first line therapy with ciprofloxacin as optional treatment.
    explanation: >-
      Identifies gentamicin and streptomycin as commonly recommended first-line
      agents and ciprofloxacin as an optional plague treatment.
  - reference: PMID:21628541
    reference_title: In vitro efficacy of antibiotics commonly used to treat human plague against intracellular Yersinia pestis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      For THP-1 cells, streptomycin and ciprofloxacin had comparable efficacies for
      intra- and extracellular Y. pestis, but the MBCs for chloramphenicol,
      gentamicin, doxycycline, and amoxicillin were two-, three-, four-, and five
      2-fold serial dilutions greater, respectively, for intracellular than for
      extracellular Y. pestis.
    explanation: >-
      Supports activity of specific plague antibiotics against intracellular Y.
      pestis in macrophage-like cells, an early host niche for the organism.
  - reference: PMID:15207311
    reference_title: Plague.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      delaying therapy will result in increased morbidity and mortality.
    explanation: >-
      Supports immediate treatment when plague is strongly suspected.
diagnosis:
- name: Bubo Aspirate Culture, qPCR, Serology, and F1 Antigen Testing
  description: >-
    Bubo aspirates from suspected bubonic plague cases can be tested by culture,
    PCR, and F1-antigen rapid diagnostic testing, with complementary blood
    serology; a triplex qPCR assay can target the Y. pestis caf1, pla, and yopM
    plasmid genes in a single assay.
  results: >-
    Triplex qPCR targeting caf1, pla, and yopM reached 100% sensitivity and 82%
    specificity against bacteriology in a Madagascar evaluation; on-site F1RDT in
    the IMASOY trial reached 94% sensitivity and 74% specificity against the
    routine culture/PCR reference standard.
  evidence:
  - reference: PMID:40705833
    reference_title: Development and evaluation of a triplex real-time PCR assay for enhanced plague diagnostics in Madagascar.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The assay targeted three genes: caf1, pla, and yopM, located on the plasmids
      pMT1, pPCP1, and pCD1, respectively.
    explanation: >-
      Identifies the three Y. pestis plasmid targets used by the evaluated triplex
      qPCR diagnostic assay.
  - reference: PMID:40705833
    reference_title: Development and evaluation of a triplex real-time PCR assay for enhanced plague diagnostics in Madagascar.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Using bacteriology technique as the reference standard, the triplex qPCR
      demonstrated a sensitivity of 100% (89-100%) and a specificity of 82%.
    explanation: >-
      Gives the test performance of the triplex qPCR assay against bacteriology in
      a Madagascar clinical-sample evaluation.
  - reference: PMID:41389991
    reference_title: "Performance of diagnostic procedures for bubonic plague in endemic settings in Madagascar: a prospective test accuracy sub-study within the IMASOY trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Bubo aspirates from patients (all ages) with suspected bubonic plague
      enrolled into the IMASOY trial (NCT04110340) underwent routine laboratory
      diagnosis complemented with serology to measure IgG F1 antibodies from blood
      samples taken on days 1, 11, and 21.
    explanation: >-
      Establishes that culture, PCR, and F1 serology were used in a
      bubo-aspirate-centered diagnostic workflow for suspected bubonic plague.
  - reference: PMID:41389991
    reference_title: "Performance of diagnostic procedures for bubonic plague in endemic settings in Madagascar: a prospective test accuracy sub-study within the IMASOY trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The sensitivity and specificity of on-site F1RDT were 94% (95% CI, 89.6-97.0)
      and 74% (95% CI, 68.2-79.3) against RS1 and 89.1% (95% CI, 84.1-93) and
      77.5% (95% CI, 71.5-82.8) against RS2.
    explanation: >-
      Quantifies on-site F1 antigen rapid-test performance in patients with
      suspected bubonic plague.
transmission:
- name: Flea-borne Transmission
  description: >-
    Flea-borne Y. pestis transmission from rodent reservoirs is the usual exposure
    route leading to bubonic plague.
  evidence:
  - reference: PMID:30940874
    reference_title: "Yersinia pestis and plague: an updated view on evolution, virulence determinants, immune subversion, vaccination, and diagnostics."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Plague is a vector-borne disease caused by Yersinia pestis. Transmitted by fleas
      from rodent reservoirs
    explanation: >-
      Supports flea-borne Y. pestis transmission from rodent reservoirs.
progression:
- phase: Acute untreated disease
  notes: >-
    Untreated bubonic plague can progress to death in less than a week.
  evidence:
  - reference: PMID:30940874
    reference_title: "Yersinia pestis and plague: an updated view on evolution, virulence determinants, immune subversion, vaccination, and diagnostics."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      the rapid onset of death in the absence of antibiotic treatment (less than a week
      for bubonic plague and <48 h for pneumonic plague)
    explanation: >-
      Supports a short untreated time course for bubonic plague.

treatments:
- name: Early antibiotic therapy
  description: >-
    Antimicrobial treatment must be started early because untreated plague can be
    rapidly fatal; aminoglycosides, tetracyclines, fluoroquinolones, and
    sulfonamides all have reported clinical activity in treated human plague.
  treatment_term:
    preferred_term: antibiotic therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
  therapeutic_modality: SMALL_MOLECULE
  evidence:
  - reference: PMID:32435802
    reference_title: "Antimicrobial Treatment of Human Plague: A Systematic Review of the Literature on Individual Cases, 1937-2019."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In addition to aminoglycosides, other classes of antimicrobials including
      tetracyclines, fluoroquinolones, and sulfonamides are effective for plague
      treatment
    explanation: >-
      Systematic review of individual treated human plague cases identifying several
      active antibiotic classes.
  - reference: PMID:15207311
    reference_title: Plague.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      delaying therapy will result in increased morbidity and mortality.
    explanation: >-
      Supports immediate treatment when plague is strongly suspected.
transmission:
- name: Flea-borne Transmission
  description: >-
    Flea-borne Y. pestis transmission from rodent reservoirs is the usual exposure
    route leading to bubonic plague.
  evidence:
  - reference: PMID:30940874
    reference_title: "Yersinia pestis and plague: an updated view on evolution, virulence determinants, immune subversion, vaccination, and diagnostics."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Plague is a vector-borne disease caused by Yersinia pestis. Transmitted by fleas
      from rodent reservoirs
    explanation: >-
      Supports flea-borne Y. pestis transmission from rodent reservoirs.
progression:
- phase: Acute untreated disease
  notes: >-
    Untreated bubonic plague can progress to death in less than a week.
  evidence:
  - reference: PMID:30940874
    reference_title: "Yersinia pestis and plague: an updated view on evolution, virulence determinants, immune subversion, vaccination, and diagnostics."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      the rapid onset of death in the absence of antibiotic treatment (less than a week
      for bubonic plague and <48 h for pneumonic plague)
    explanation: >-
      Supports a short untreated time course for bubonic plague.

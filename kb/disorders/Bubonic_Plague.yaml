name: Bubonic Plague
creation_date: "2026-09-25T15:25:20Z"
category: Infectious Disease
description: >-
  Bubonic plague is the lymph-node form of plague: Yersinia pestis is usually
  inoculated into skin by an infected flea, evades early innate killing through
  its type III secretion system, disseminates to draining lymph nodes, and
  replicates there to produce the regional lymphadenopathy that defines the
  bubonic presentation.
disease_term:
  preferred_term: bubonic plague
  term:
    id: MONDO:0001112
    label: bubonic plague
parents:
- Plague
notes: >-
  Lump/split decision: bubonic plague is kept as a standalone entry because
  MONDO assigns it a distinct term (MONDO:0001112) and this entry curates the
  flea-mediated inoculation -> lymph-node colonization -> bubo mechanism that the
  Bubonic has_subtypes row on Plague.yaml does not carry. The Plague entry's
  Bubonic subtype row cross-references this entry; pneumonic plague is now also
  curated as Pneumonic_Plague (MONDO:0001024).
infectious_agent:
- name: Yersinia pestis
  infectious_agent_term:
    preferred_term: Yersinia pestis
    term:
      id: NCBITaxon:632
      label: Yersinia pestis
  description: >-
    Gram-negative plague bacillus that establishes the lymph-node infection
    characteristic of bubonic plague.
  evidence:
  - reference: PMID:30940874
    reference_title: "Yersinia pestis and plague: an updated view on evolution, virulence determinants, immune subversion, vaccination, and diagnostics."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      unrestricted bacterial replication in lymph nodes (bubonic plague) and in lungs
      (pneumonic plague)
    explanation: >-
      Identifies Y. pestis replication in lymph nodes as the organism-tissue
      relationship that distinguishes bubonic plague.
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
    evidence:
    - reference: PMID:30940874
      reference_title: "Yersinia pestis and plague: an updated view on evolution, virulence determinants, immune subversion, vaccination, and diagnostics."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Plague is a vector-borne disease caused by Yersinia pestis.
      explanation: >-
        Bubonic plague is a bacterial infectious form of plague.
pathophysiology:
- name: Flea-Mediated Yersinia pestis Inoculation
  description: >-
    Infected fleas transmit Y. pestis from rodent reservoirs and inoculate the
    bacterium into skin, initiating the usual route to bubonic plague through local
    survival, hemostatic remodeling, and dissemination to a draining lymph node.
  biological_scale: TISSUE
  locations:
  - preferred_term: skin
    term:
      id: UBERON:0002097
      label: skin of body
  downstream:
  - target: Type III Secretion-Mediated Innate Immune Evasion
    causal_link_type: DIRECT
    description: >-
      Y. pestis uses its type III secretion system to subvert early mammalian host
      defenses after inoculation.
    evidence:
    - reference: PMID:24198067
      reference_title: "The Yersinia pestis type III secretion system: expression, assembly and role in the evasion of host defenses."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Yersinia pestis, the etiologic agent of plague, utilizes a type III secretion
        system (T3SS) to subvert the defenses of its mammalian hosts.
      explanation: >-
        Establishes the immune-evasion machinery that acts after Y. pestis enters a
        mammalian host.
  - target: Pla-Mediated Hemostatic Remodeling
    causal_link_type: DIRECT
    description: >-
      In the mammalian host, the Pla outer-membrane protease can activate fibrinolysis
      and remodel the host hemostatic environment in ways that support dissemination.
  evidence:
  - reference: PMID:30940874
    reference_title: "Yersinia pestis and plague: an updated view on evolution, virulence determinants, immune subversion, vaccination, and diagnostics."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Plague is a vector-borne disease caused by Yersinia pestis. Transmitted by fleas
      from rodent reservoirs
    explanation: >-
      Establishes flea-borne transmission of Y. pestis, the canonical exposure route
      that seeds bubonic plague.
- name: Type III Secretion-Mediated Innate Immune Evasion
  description: >-
    The Y. pestis type III secretion system injects Yop effector proteins into
    mammalian host cells and suppresses phagocyte defenses, permitting bacterial
    survival and expansion.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  biological_processes:
  - preferred_term: phagocytosis
    modifier: DECREASED
    term:
      id: GO:0006909
      label: phagocytosis
  - preferred_term: innate immune response
    modifier: DECREASED
    term:
      id: GO:0045087
      label: innate immune response
  downstream:
  - target: Draining Lymph Node Colonization
    causal_link_type: DIRECT
    description: >-
      Yop-mediated immune evasion permits extracellular Y. pestis survival and
      replication, supporting dissemination to the draining lymph node.
  evidence:
  - reference: PMID:24198067
    reference_title: "The Yersinia pestis type III secretion system: expression, assembly and role in the evasion of host defenses."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Yersinia pestis, the etiologic agent of plague, utilizes a type III secretion
      system (T3SS) to subvert the defenses of its mammalian hosts.
    explanation: >-
      Supports T3SS-mediated suppression of host defense as a core Y. pestis
      virulence process.
- name: Pla-Mediated Hemostatic Remodeling
  description: >-
    The Pla omptin protease activates human plasminogen and urokinase while
    inactivating the host fibrinolysis inhibitors alpha-2-antiplasmin and
    plasminogen activator inhibitor 1, enhancing local fibrinolysis that is
    thought to promote Y. pestis survival and spread from the dermal inoculation
    site.
  biological_scale: TISSUE
  locations:
  - preferred_term: skin
    term:
      id: UBERON:0002097
      label: skin of body
  biological_processes:
  - preferred_term: fibrinolysis
    modifier: INCREASED
    term:
      id: GO:0042730
      label: fibrinolysis
  downstream:
  - target: Draining Lymph Node Colonization
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Fibrinolysis and reduced fibrin deposition plausibly help bacteria leave the
      inoculation site and reach the lymphatic drainage basin.
  evidence:
  - reference: PMID:23898467
    reference_title: Fibrinolytic and coagulative activities of Yersinia pestis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Pla activates human plasminogen to the serine protease plasmin and activates
      the physiological plasminogen activator urokinase.
    explanation: >-
      Reviews the Pla activities that couple Y. pestis to host fibrinolysis and
      hemostatic remodeling.
- name: Draining Lymph Node Colonization
  description: >-
    Bacteria reach regional lymph nodes and replicate there; this lymphatic focus is
    the anatomic process that produces the bubo of bubonic plague.
  biological_scale: TISSUE
  locations:
  - preferred_term: lymph node
    term:
      id: UBERON:0000029
      label: lymph node
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  downstream:
  - target: Bubo
    causal_link_type: DIRECT
    description: >-
      Regional lymph-node replication clinically produces the lymphadenopathy
      named the bubo.
  - target: Fever
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Lymph-node Y. pestis replication and the associated inflammatory response
      can contribute to systemic febrile symptoms.
  - target: Chills
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Lymph-node Y. pestis replication and the associated inflammatory response
      can contribute to chills as a systemic acute-infection symptom.
  - target: Hematogenous Dissemination
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Y. pestis can leave the lymphatic focus and spread into the bloodstream.
  evidence:
  - reference: PMID:30940874
    reference_title: "Yersinia pestis and plague: an updated view on evolution, virulence determinants, immune subversion, vaccination, and diagnostics."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      unrestricted bacterial replication in lymph nodes (bubonic plague) and in lungs
      (pneumonic plague)
    explanation: >-
      Supports lymph nodes as the defining replication site of bubonic plague.
- name: Hematogenous Dissemination
  description: >-
    Y. pestis can disseminate from the lymphatic focus into the bloodstream,
    producing systemic plague and sepsis.
  biological_scale: ORGANISM
  downstream:
  - target: Sepsis
    causal_link_type: DIRECT
    description: >-
      Bloodstream spread of Y. pestis can produce septicemic plague and clinical
      sepsis.
  - target: Disseminated Intravascular Coagulation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Severe bloodstream plague can progress to septic coagulopathy.
  - target: Gangrene
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Coagulopathy and shock in disseminated plague can cause acral ischemic necrosis.
prevalence:
- population: Published individual treated plague cases, 1937-2019
  measure_type: CASES_IN_LITERATURE
  prevalence_class: UNKNOWN
  notes: >-
    Primary bubonic plague accounted for 63% of 762 published treated plague
    cases and had 17% case fatality among primary bubonic cases.
  evidence:
  - reference: PMID:32435802
    reference_title: "Antimicrobial Treatment of Human Plague: A Systematic Review of the Literature on Individual Cases, 1937-2019."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Most patients had primary bubonic (63%), pneumonic (21%), or septicemic (5%)
      plague, with associated case fatality rates of 17%, 27%, and 38%,
      respectively.
    explanation: >-
      Supports primary bubonic plague as the most frequent clinical form among
      published treated plague cases in the systematic review.
- population: Six leading plague-reporting countries, 2010-2019
  measure_type: CASES_IN_LITERATURE
  prevalence_class: UNKNOWN
  notes: >-
    Madagascar, Congo, Uganda, Peru, Tanzania, and the United States reported
    4,547 human plague cases to WHO from 2010 through 2019, with 786 deaths.
  evidence:
  - reference: PMID:37748767
    reference_title: Plague Gives Surprises in the Second Decade of the Twenty-First Century.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      From 2010 through 2019, the six leading countries by numbers of human plague
      cases reported to the WHO were, in order from highest to lowest,
      Madagascar, Congo, Uganda, Peru, Tanzania, and the United States. From these
      countries, there was a total of 4,547 cases, of whom 786 (17%) died.
    explanation: >-
      Provides recent global plague burden context for the bubonic subtype without
      treating the all-form case count as bubonic-specific.

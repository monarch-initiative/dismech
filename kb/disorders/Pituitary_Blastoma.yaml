phenotypes:
- category: Endocrine
  name: Cushing syndrome
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Cushing syndrome (ACTH-dependent hypercortisolism)
    term:
      id: HP:0011744
      label: Secondary hypercortisolism
  description: >-
    The commonest presentation, in 10 of the 17 children of the outcome series. In nine of them
    ACTH was raised at diagnosis, so their hypercortisolism is ACTH-dependent; in the tenth a
    raised random serum cortisol was recorded. Seven children had no cushingoid signs at
    diagnosis, two of them with a raised ACTH. Two patients reported as young adults presented
    differently: a 19-year-old woman with a possible pituitary blastoma, a raised growth hormone
    and a normal ACTH and cortisol, and a 27-year-old man whose report sets his raised prolactin
    against the Cushing syndrome or ophthalmoplegia of most cases.
  evidence:

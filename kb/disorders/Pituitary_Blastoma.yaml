    index that differs between tumours; "l~Ki67" returns no admissible term. The NCIT search
    "l~mitotic" returns admissible mitotic activity, mitotic rate and mitotic figure terms (such
    as Mitotic Activity, NCIT:C35959), which describe dividing cells or their count, not the
    variation between tumours that the row records, and two terms that name other tumours. The
    admissible findings returned by the NCIT search "l~proliferat" (such as Vascular
    Proliferation, NCIT:C35504) name the proliferation of particular cells, tissues, patterns or
    sites, or a lesion, none a proliferation index. OLS searches of HPO for "Ki-67" return
    nothing, and for "mitotic" return only two lymphoid terms.
  evidence:

- name: Variable proliferation index
  finding_term:
    preferred_term: variable Ki-67 proliferation index
  description: >-
    Proliferative and mitotic activity differ between tumours: in a 2012 report of three tumours
    mitotic activity and MIB-1 (Ki-67) labelling were moderate to high in two and low in one, and
    in the genetics series the Ki-67 index was high in four tumours and minimal in one (the
    genetics series' cases 3, 5 and 2 are the 2012 report's cases 1, 2 and 3). In the outcome
    series, a small cohort with six deaths from complications, the Ki-67 labelling index was not
    significantly associated with survival, and the genetics series, whose cohort it overlaps,
    judged the index's predictive value uncertain.
  notes: >-
    No term is bound. The NCIT search "l~Ki-67" returns Ki-67 Labeling Index (NCIT:C157250) and

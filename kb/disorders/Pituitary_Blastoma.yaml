    which sits under external beam radiation therapy: NCIT files the Gamma Knife treatment one
    child had (NCIT:C15382) under Radiosurgery instead, so Radiation Therapy is the narrowest term
    covering both children. The radiotherapy of a 19-year-old woman in a case report is not
    described further in its abstract, and Radiation Therapy covers it too.

  treatment_term:
    preferred_term: focal radiotherapy
    term:
      id: NCIT:C15313
      label: Radiation Therapy
  description: >-
    Given after surgery to two of the 17 children of the outcome series, one for persistent residual
    disease and one for progression. Both later had a vascular complication, moyamoya disease or an
    aneurysm, though the authors note the aneurysm may also have been associated with earlier
    surgery; the series advises that radiotherapy for this tumour be considered with special
    caution.
  notes: >-

      label: ribonuclease III activity
  downstream:
  - target: Somatic DICER1 Second Hit
    description: >-
      The germline variant is the first hit. The genetics series predicts that every tumour also
      needs a second, somatic DICER1 hit, and proposes that it takes place in the embryonic
      pituitary.
    evidence:
    - reference: PMID:24839956
      reference_title: >-
        Pituitary blastoma: a pathognomonic feature of germ-line DICER1 mutations.
      supports: SUPPORT
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We predict that all cases will have two DICER1 mutations, hypothesizing that a second
        somatic “hit” (most often affecting an RNase IIIb metal ion-binding residue of DICER1) in
        the embryonic pituitary is required in addition to a loss-of-function germ-line DICER1
        mutation to initiate development of an embryonic-appearing blastomatous tumor.
      explanation: >-
        The two-hit model for this tumour, stated by its genetics series as a prediction and a
        hypothesis rather than a finding.
    - reference: PMID:24839956
      reference_title: >-
        Pituitary blastoma: a pathognomonic feature of germ-line DICER1 mutations.
      supports: SUPPORT
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Overall, we demonstrated DICER1 mutations in 11 of 12 PitB cases for which we had germ-line
        and/or tumor sample(s): both germ-line and somatic mutations were present in seven of 12
        PitB cases
      explanation: >-
        Both hits were found in 7 of the 12 children for whom a germline or a tumour sample, or
        both, was available. The quote shows the two hits in the same children, not the step from
        one to the other.
  evidence:
  - reference: PMID:24839956
    reference_title: >-
      Pituitary blastoma: a pathognomonic feature of germ-line DICER1 mutations.
    supports: SUPPORT
    directness: DIRECT

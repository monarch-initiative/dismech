discussions:
- discussion_id: pbl_no_model
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is there a laboratory or animal model of pituitary blastoma in which the DICER1 second hit and
    the microRNA defect can be tested?
  attaches_to:
  - pathophysiology#Somatic DICER1 Second Hit
  - pathophysiology#Defective 5p microRNA Processing
  rationale: >-
    The DICER1 second hit and microRNA steps in this entry rest on studies of affected children
    and their tumours. A 2026 report describes a pituitary blastoma in a dog, the first in that
    species, with ACTH-dependent hypercortisolism and histological features resembling the human
    tumour, but its DICER1 status was not tested. The entry cites no laboratory or animal model in
    which either step has been tested.

genetic:
- name: DICER1
  gene_term:
    preferred_term: DICER1
    term:
      id: hgnc:17098
      label: DICER1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE_AND_SOMATIC
  notes: >-
    Both hits are in DICER1: a germline variant, predicted to inactivate the allele in most
    children, and a somatic second hit in the tumour (an RNase IIIb hotspot missense mutation, at
    Asp1709, Gly1809 or Glu1813 in the genetics series, or loss of the wild-type allele). No
    ClinGen gene-disease validity assertion for this tumour is cached here, so none is recorded:
    the ClinGen export cached in this repository (cache/clingen/gene_validity.csv) classifies
    DICER1 as Definitive for DICER1-related tumor predisposition (MONDO:0100216), a different
    disease from this tumour. The relationship_type is the reading of the two series cited. The
    outcome series included cases on clinical findings, pathological diagnosis and DICER1
    molecular findings, or on prototypical DICER1 syndrome phenotypes in the child; its counts of
    DICER1 involvement may therefore partly reflect how its cases were chosen, a reading the
    series itself does not state.
  evidence:
  - reference: PMID:33236116
    reference_title: >-
      Clinical Outcomes and Complications of Pituitary Blastoma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Overall, molecular and/or clinical evidence implicates DICER1 in 16 of the 17 pituitary
      blastoma cases.
    explanation: >-
      DICER1 in 16 of the 17 children of the outcome series.
  - reference: PMID:24839956
    reference_title: >-
      Pituitary blastoma: a pathognomonic feature of germ-line DICER1 mutations.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Seven of the nine DICER1 mutations identified within the tumor samples (eight of which are
      confirmed to be somatic in origin) were localized within the sequence encoding the protein's
      RNase IIIb domain, thereby affecting highly conserved amino acid residues (Asp1709, Gly1809,
      Glu1813)
    explanation: >-
      The residues hit in the tumours of the genetics series.
  - reference: PMID:24839956
    reference_title: >-
      Pituitary blastoma: a pathognomonic feature of germ-line DICER1 mutations.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This tumor may now be considered a rare but pathognomonic manifestation of a germ-line DICER1
      mutation.
    explanation: >-

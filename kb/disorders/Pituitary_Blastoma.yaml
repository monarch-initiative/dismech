      tumour and one (case 10) as progression. The genetics series dates case 6's death to 8
      months after surgery; the outcome series records 1.3 months of follow-up (Table 1) and an
      age of 8.3 months at the last follow-up against 7 months at diagnosis (Table 2), so the
      genetics series' 8 months may be the child's age. The entry follows the outcome series.
pathophysiology:
- name: Germline DICER1 Loss-of-Function Variant
  description: >-
    A heterozygous germline DICER1 variant, most often one predicted to inactivate the allele, is
    found in most children tested: 9 of 10 in the genetics series, 12 of 13 in the outcome series
    and 11 of 14 in a 2022 review. In the genetics series it was known to be inherited in five
    children and de novo in two. On its own it is thought not to produce the tumour: the genetics
    series predicts a second, somatic hit in every case. In the outcome series it was inherited in
    6 of the 8 children whose families were tested, and relatives in 5 of those 6 families had
    DICER1-related conditions. In a 2014 case report the germline frameshift allele made up 12% of
    the DICER1 transcripts in the child's leukocytes and none of those in the tumour.
  conforms_to: "germline_two_hit_tumor_predisposition#Constitutional First-Hit Tumor Suppressor Inactivation"
  biological_scale: MOLECULAR
  genetic_context:
    gene:
      preferred_term: DICER1
      term:
        id: hgnc:17098
        label: DICER1
    variant_origin: GERMLINE
    allelic_hit_role: FIRST_HIT
    zygosity: HETEROZYGOUS

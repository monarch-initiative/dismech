progression:
- phase: Early postoperative period
  duration: up to six weeks after surgery
  description: >-
    Half of the outcome series' eight deaths fell in this period: four of its 17 children died
    within six weeks of surgery, three of medical or surgical complications and one of sepsis;
    three of the early deaths (not the same three as those from complications: they include the
    death from sepsis) were in infants with Cushing disease, which the authors, citing earlier
    work, call a potentially life-threatening endocrine condition. In a case report, a 27-year-old
    man died within a month of surgery after an aggressive tumour course.
  notes: >-
    The six-week period is the outcome series' own grouping. Its Table 1 lists the four early
    deaths as cases 1, 6 and 8, dead of early complications after 1.5 months, 1.3 months and 1 day
    of follow-up, and case 17, dead of sepsis after 1 month; case 1's recorded follow-up is a
    little over six weeks. The genetics series, whose cohort the outcome series overlaps, dates
    case 6's death to 8 months after surgery (see the Outcome phase).
  evidence:
  - reference: PMID:33236116
    reference_title: >-
      Clinical Outcomes and Complications of Pituitary Blastoma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Four patients died within 6 weeks of surgery of medical/surgical complications (n = 3) or
      sepsis (n = 1); 4 died later in their courses of a second brain tumor (suspected
      pineoblastoma, n = 1), central venous catheter–related complication (n = 1), aneurysmal
      bleeding (n = 1), or progression (n = 1) (see Fig. 2).
    explanation: >-
      Four of the 17 children died within six weeks of surgery, three of medical or surgical
      complications and one of sepsis; the later deaths had other causes.
  - reference: PMID:33236116
    reference_title: >-
      Clinical Outcomes and Complications of Pituitary Blastoma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Three early deaths occurred in infants with Cushing disease, a potentially life-threatening
      endocrine condition (34), and highlight the medical/surgical challenge caring for a small
      infant with an intracranial mass and a serious endocrine disturbance.
    explanation: >-
      Three early deaths were in infants with Cushing disease, which the authors, citing earlier
      work, call a potentially life-threatening endocrine condition. By the 'Clinically Cushingoid
      at Dx' column of Table 2 these are cases 1, 8 and 17, so they include the death from sepsis
      and not case 6.
  - reference: PMID:40451220
    reference_title: >-
      Pituitary Blastoma: Expanding the Spectrum of Histopathological Findings in a Young Adult With DICER1 Mutation.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The tumor followed an aggressive course, and the patient succumbed within a month
      post-surgery.
    explanation: >-
      A 27-year-old man (his age is given earlier in the abstract) died within a month of surgery
      after an aggressive tumour course.
- phase: Long-term survivorship
  description: >-
    Nine of the 17 children of the outcome series survived, seven without evidence of disease and
    two with a stable residual lesion, at a median follow-up of 6.7 years across the series.
    Hypopituitarism was frequent, ranging up to panhypopituitarism: deficiencies were noted in
    ACTH in seven children, thyrotropin in seven, growth hormone in six, gonadotropin in four and
    antidiuretic hormone in three. Four had visual complications (severe visual impairment,
    extraocular movement palsy, or bilateral optic atrophy with extraocular movement palsy); six
    were progressing satisfactorily in their studies and two had cognitive delay. Growth hormone
    was replaced in every child with documented deficiency, and in several children given it the
    authors found the replacement not associated with recurrence or other neoplasms, while one
    survivor not assessed for growth hormone deficiency was 5.6 standard deviations below the mean
    height for age. One survivor later had a nasal chondromesenchymal hamartoma, a second
    DICER1-related condition. The series concludes that quality survival is possible with
    long-term neuroendocrine management.
  notes: >-
    The outcome series' abstract counts neurodevelopmental deficits in three children; its results
    give cognitive delay in two and satisfactory progress in their studies in six. The counts of
    pituitary deficiencies overlap, since one child can lack several hormones. Case 11, later
    diagnosed with a nasal chondromesenchymal hamartoma, had growth hormone deficiency at
    follow-up, and the series gave replacement to every such child; it does not discuss whether
    the replacement bears on the hamartoma. The earlier 2014 genetics series, whose cohort the
    outcome series overlaps, reports recurrences in three of its four highly proliferative
    tumours, of which the outcome series' Table 1 records progression for only one (case 5; cases
    matched by case number, sex and age); the outcome series' text also records hypercortisolism
    returning three to four months after surgery in case 3, one of the genetics series' four
    highly proliferative tumours.
  evidence:
  - reference: PMID:33236116
    reference_title: >-
      Clinical Outcomes and Complications of Pituitary Blastoma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At a median follow-up of 6.7 years (range, 1 day to 23.5 years), 9 patients are alive
      without evidence of disease (n = 7) or stable residual lesion radiographically (n = 2,
      duration of follow-up: 8.2 and 10 years) (see Table 1, Fig. 2) (31).
    explanation: >-
      Nine children were alive at the series' median follow-up of 6.7 years (over all 17
      children), seven without evidence of disease and two with a stable residual lesion.
  - reference: PMID:33236116
    reference_title: >-
      Clinical Outcomes and Complications of Pituitary Blastoma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Nine of 17 patients survived (median survival, 6.7 years; median age at last follow-up, 10.8
      years) with hormonal sequalae ranging from none to panhypopituitarism and neurocognitive
      function ranging from fully functional to impaired, and some survivors were visually
      impaired.
    explanation: >-
      The survivors' hormonal sequelae ranged from none to panhypopituitarism, their
      neurocognitive function from fully functional to impaired, and some were visually impaired.
  - reference: PMID:33236116
    reference_title: >-
      Clinical Outcomes and Complications of Pituitary Blastoma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hypopituitarism was frequent (see Table 2). Deficiencies were noted in ACTH (n = 7),
      thyrotropin (n = 7), gonadotropin (n = 4), antidiuretic hormone (n = 3), and GH (n = 6).
    explanation: >-
      Deficiencies of ACTH (7), thyrotropin (7), gonadotropin (4), antidiuretic hormone (3) and
      growth hormone (6), noted among the survivors at follow-up (Table 2).
  - reference: PMID:33236116
    reference_title: >-
      Clinical Outcomes and Complications of Pituitary Blastoma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Four patients had visual complications: severe vision impairments (n = 2), extraocular

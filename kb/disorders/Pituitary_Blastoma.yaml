- name: Focal radiotherapy
  therapeutic_modality: RADIOTHERAPY
  treatment_term:
    preferred_term: focal radiotherapy
    term:
      id: NCIT:C15313
      label: Radiation Therapy
  description: >-
    Given after surgery to two of the 17 children of the outcome series: Gamma Knife radiotherapy
    (45 Gy) for persistent residual disease in one, and conformal radiation (54 Gy, at 37 months
    of age) for progression in the other, who had received adjuvant temozolomide before the
    progression and was given three further lines of chemotherapy for it. Both later had a
    vascular complication: the child treated with Gamma Knife had moyamoya disease needing
    revascularisation surgery 9.3 years after radiation, and the other an aneurysm, which the
    authors note may also have been associated with earlier surgery; the series advises that
    radiotherapy for this tumour be considered with special caution. A 19-year-old woman whose
    pathology suggested a pituitary blastoma had radiotherapy, of a kind the case report's
    abstract does not state, and chemotherapy after subtotal resection.

    a 3.5-cm, focally cystic, contrast-enhancing sellar and suprasellar mass, and one tumour of
    the 2012 report was a large suprasellar mass with cavernous sinus invasion. The outcome
    series' introduction describes an often large solid or cystic and solid mass arising from the
    sella and extending into the hypothalamus, which may encompass the optic chiasm or the
    cavernous sinuses, or both. A 2020 case report with a literature review advises considering
    the tumour in children with an enhanced sellar and suprasellar mass with peripherally located
    cysts.

- phase: Outcome
  description: >-
    A locally destructive tumour with high mortality: 8 of the 17 children of the outcome series
    died, three of early medical or surgical complications, and the 5-year overall survival was
    59%. None had metastasis at diagnosis or during follow-up in that series; the earlier genetics
    series had reported apparent intraventricular metastases in one child, without histological
    confirmation. Eight of the nine survivors have chronic deficits: neuroendocrine, visual or
    neurodevelopmental. The genetics series, whose cohort the outcome series overlaps, recorded
    five of its 13 infants as dead of disease within 26 months of first surgery; the outcome
    series gives a cause for each of these five deaths, attributing three to early complications;
    in one of the other two, a fatal tumour that imaging had taken for a recurrence was found at
    autopsy to be a primitive neuroectodermal tumour, which the authors interpret as probably a
    pineoblastoma.

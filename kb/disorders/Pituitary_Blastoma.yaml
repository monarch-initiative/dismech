      a key predisposing genetic event.
    explanation: >-
      Most germline variants are predicted to inactivate the allele.
  - reference: PMID:33236116
    reference_title: >-
      Clinical Outcomes and Complications of Pituitary Blastoma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Germline DICER1 variants were detected in 12 of 13 patients tested.
    explanation: >-
      The same finding in the later outcome series, whose cohort overlaps the genetics series.
  - reference: PMID:24839956
    reference_title: >-
      Pituitary blastoma: a pathognomonic feature of germ-line DICER1 mutations.
    supports: SUPPORT

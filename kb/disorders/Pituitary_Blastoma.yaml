  - reference: PMID:33236116
    reference_title: >-
      Clinical Outcomes and Complications of Pituitary Blastoma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: OTHER
    snippet: >-
      A separate issue is the wisdom of screening an infant known to harbor DICER1 alterations for
      presymptomatic pituitary blastoma; this would require head magnetic resonance imaging with

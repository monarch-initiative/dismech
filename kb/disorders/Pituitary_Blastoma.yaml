- name: Adjuvant chemotherapy
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: chemotherapy
    term:
      id: NCIT:C15632
      label: Chemotherapy
  description: >-
    Given after surgery to five of the 17 children of the outcome series (six had adjuvant therapy
    of any kind); adjuvant therapy as a whole was not significantly associated with survival in
    the series. Regimens varied from child to child: temozolomide in two children, after subtotal
    resection in one, whose tumour progressed locally 20 months from diagnosis, and after a biopsy
    and again after a near-total resection in the other; a Pediatric Oncology Group protocol the
    outcome series' Table 1 calls 'baby POG' and the Australian and New Zealand Children's Cancer
    Study Group baby brain protocol without autologous stem cell transplant; and cyclophosphamide,
    vincristine, methotrexate, carboplatin and etoposide in a child who died of a catheter-related

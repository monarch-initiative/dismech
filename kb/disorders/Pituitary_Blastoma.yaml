  - reference: PMID:33236116
    reference_title: >-
      Clinical Outcomes and Complications of Pituitary Blastoma.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In no case did we have proof that both the hotspot and nonhotspot DICER1 abnormalities
      detected in tumor DNA were somatic in origin.
    explanation: >-
      No tumour of the outcome series was shown to carry two somatic DICER1 changes, so none was
      shown to have arisen without a germline variant. INDIRECT: an absence of proof, not a count of
      germline carriers.
- name: Somatic DICER1 Second Hit
  description: >-
    The transforming event: a somatic hit on the remaining DICER1 allele in the tumour, usually a
    missense mutation at a metal ion-binding residue of the RNase IIIb domain, and in a minority
    loss of the wild-type allele. In the genetics series eight of the nine tumour changes found were
    confirmed to be somatic.

      other tumors, including pituitary adenomas.
    explanation: >-
      Distinct from pituitary adenomas by methylation.
treatments:
- name: Surgical resection
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: tumour resection
    term:
      id: NCIT:C164212
      label: Tumor Resection
  description: >-
    The first treatment in every child of the outcome series, in four of them in stages: gross or
    near-total resection in 7, subtotal resection in 9 and biopsy alone in 1. The extent of
    resection was the one treatment factor associated with survival, and surgery was the only
    treatment in five of the nine survivors.
  target_mechanisms:
  - target: Arrested Pituitary Development with Uncontrolled Proliferation
    treatment_effect: INHIBITS
    description: >-
      Removing the tumour removes the proliferating tissue and with it the source of the ACTH and
      the mass; it does not touch the germline DICER1 variant, which stays with the child.
    evidence:

histopathology:
- name: Rathke-type epithelium
  finding_term:
    preferred_term: primitive Rathke-type epithelium in rosettes and glands
  diagnostic: true
  description: >-
    Primitive Rathke-type epithelium arranged in rosettes and glands, one of the tumour's
    components, with small primitive cells and secretory cells; folliculostellate cells are also
    present. In the first described tumour smaller cells resembling Rathke-type epithelium formed
    rosettes to sizeable glands, and on electron microscopy cells were consistent with committed
    but largely undifferentiated Rathke-type epithelium. In a 2012 report of three tumours, one
    tumour (case 3) lacked a glandular component; the genetics series, whose case 2 is that
    tumour, reports that all its cases showed the classic features, including Rathke-type rosettes
    or glands.
  notes: >-
    No term is bound. The nearest admissible terms name the arrangement, or glandular epithelium
    in general or of another organ, rather than primitive Rathke-type epithelium: HP:0031925
    Rosette (from an OLS search of HPO for "rosette"); from the NCIT search "l~rosette",
    NCIT:C35940 Rosette Formation and NCIT:C62128 Rosette-Like Configurations Present; and from
    the NCIT search "l~gland", terms such as Glandular Pattern (NCIT:C35929) and Neoplastic
    Glandular Epithelium Resembling the Normal Endometrium Present (NCIT:C61542). The row's
    finding, and the basis of its diagnostic flag, is the primitive Rathke-type epithelium.
    Rosettes as such are not specific to this tumour: the "l~rosette" search also returns other
    rosette-forming tumours, such as Rosette-Forming Glioneuronal Tumor and Embryonal Tumor with
    Multilayered Rosettes. No term names Rathke-type epithelium as a finding: the NCIT search
    "l~Rathke" returns only Rathke Pouch, Rathke Pouch Epithelium (NCIT:C54098), Persistent
    Rathke's Pouch and Rathke Pouch Cyst, none admissible in the histopathology finding enum, and
    an OLS search of HPO for "Rathke" returns nothing.
  evidence:
  - reference: PMID:33236116
    reference_title: >-
      Clinical Outcomes and Complications of Pituitary Blastoma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pathologically, the tumors exhibit arrested pituitary development and uncontrolled
      proliferation and are composed of Rathke epithelium, folliculostellate cells, small primitive
      cells, and secretory cells with ACTH or, less often, growth hormone (GH) immunoexpression
    explanation: >-
      The outcome series' summary of the tumour's components, restating earlier reports.
  - reference: PMID:24839956
    reference_title: >-
      Pituitary blastoma: a pathognomonic feature of germ-line DICER1 mutations.
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Histopathologically, the excised tumor was distinct from other pediatric adenohypophyseal
      tumors, exhibiting primitive Rathke-type epithelium arranged in rosettes and glandular
      structures, small folliculo-stellate (FS) cells and a limited range of fully differentiated
      secretory cells.
    explanation: >-
      The genetics series' account of the first described tumour, with primitive Rathke-type
      epithelium in rosettes and glandular structures.
  - reference: PMID:24839956
    reference_title: >-
      Pituitary blastoma: a pathognomonic feature of germ-line DICER1 mutations.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This included a combination of Rathketype epithelial rosettes/glands, small primitive
      appearing cells and secretory cells, the latter of which were synaptophysin and chromogranin
      immunoreactive and always expressed ACTH in at least a subset of cells.
    explanation: >-
      In the genetics series' histological review the tumours combined Rathke-type epithelial
      rosettes or glands, small primitive cells and secretory cells.
  - reference: PMID:21805093
    reference_title: >-
      Pituitary blastoma: a unique embryonal tumor.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Histologically, the complex tumors consisted of glands of varying from rosettes to glandular
      structures resembling Rathke epithelium, small undifferentiated-appearing cells (blastema),
      and large secretory cells.
    explanation: >-
      The 2012 report describes its tumours histologically as holding glands, from rosettes to
      glandular structures resembling Rathke epithelium.
  - reference: PMID:18551299
    reference_title: >-
      Pituitary blastoma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Also conspicuous were smaller cells resembling Rathke-type epithelium forming rosettes to
      sizable glands immunoreactive for EMA, keratin, S-100 protein, galectin-3 and rarely for
      synaptophysin and/or one of the above-noted adenohypophysial hormones.
    explanation: >-
      In the first described tumour, smaller cells resembling Rathke-type epithelium formed
      rosettes to sizeable glands.
  - reference: PMID:18551299
    reference_title: >-
      Pituitary blastoma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ultrastructurally, the tissue resembled fetal pituitary of 10-12 weeks gestation and
      contained fully differentiated corticotrophs and somatotrophs, scant cells of
      glycoprotein-hormone producing type with small secretory granules, and glandular epithelial
      cells consistent with committed, but largely undifferentiated Rathke-type epithelium.
    explanation: >-
      On electron microscopy the first described tumour held glandular epithelial cells consistent
      with committed but largely undifferentiated Rathke-type epithelium.
  - reference: PMID:18551299
    reference_title: >-
      Pituitary blastoma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We consider the tumor as a pituitary blastoma, a lesion composed of multiple cell types
      common to the development of the affected organ based upon (a) prominence of primitive
      Rathke-type epithelium, (b) disposition of secretory cells in lobules rather than acini, (c)
      the limited range of secretory cells represented, (d) the presence of their corresponding
      transcription factors, and (e) ultrastructural features indicating orderly development of
      the 10- to 12-week embryonic stage.
    explanation: >-
      The report of the first described tumour based the diagnosis partly on the prominence of
      primitive Rathke-type epithelium, the basis of the row's diagnostic flag.

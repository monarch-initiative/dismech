      supports: SUPPORT
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Extent of resection (GTR/NTR vs STR/Bx; EFS P = .018, OS P = .023) and year of diagnosis
        (before 1996 vs 1996 or later; EFS P = .048, OS P = .029), were significantly associated
        with patient survival.
      explanation: >-
        Gross or near-total resection, against subtotal resection or biopsy, was significantly
        associated with event-free and overall survival in 17 children; a small retrospective
        series, so an association rather than a trial result. INDIRECT: an outcome of the treatment,
        cited for the tissue it removes.
    - reference: PMID:33236116
      reference_title: >-
        Clinical Outcomes and Complications of Pituitary Blastoma.
      supports: SUPPORT
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Notwithstanding limited case numbers, our analyses (see Fig. 3) suggest GTRs/NTRs are
        beneficial and that more recently treated cases are associated with better survival, which
        seems reasonable given advances in imaging, neurosurgery, intensive care, and endocrinology.
      explanation: >-
        The direction of the association: on limited numbers, the authors read their analysis as
        suggesting that gross or near-total resection is beneficial. INDIRECT, for the same reason.

  - reference: PMID:24839956
    reference_title: >-
      Pituitary blastoma: a pathognomonic feature of germ-line DICER1 mutations.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Eight of the nine germ-line mutations identified are loss-of-function mutations that are

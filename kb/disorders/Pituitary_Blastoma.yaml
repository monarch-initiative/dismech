      INDIRECT: it is about DICER1 tumours in general, not specific to this tumour.
  - reference: PMID:34599283
    reference_title: >-
      DICER1 tumor predisposition syndrome: an evolving story initiated with the pleuropulmonary blastoma.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS

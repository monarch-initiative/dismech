      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The finding of cellular elements of adenohypophysial development is consistent with a
        diagnosis of pituitary blastoma and aligns it with blastomas of other organs.
      explanation: >-
        The 2012 report's conclusion: the tumour's cellular elements of adenohypophysial
        development align it with blastomas of other organs. INDIRECT: it aligns the tumour with
        blastomas but does not say embryonal (the report's title does, but a title is not a finding);
        the 2025 item below says so directly.

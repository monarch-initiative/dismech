        Pituitary blastoma is a rare embryonal tumor of the pituitary gland, typically occurring
        in children under 2 years of age and strongly associated with germline DICER1 mutations.
      explanation: >-
        A 2025 case report's background statement that pituitary blastoma is an embryonal tumour
        of the pituitary gland.
mappings:
  ncit_mappings:
  - term:
      id: NCIT:C155304
      label: Pituitary Gland Blastoma
    mapping_predicate: skos:exactMatch
    mapping_source: MONDO
    mapping_justification: >-
      MONDO:0858916, this entry's disease term, cross-references NCIT:C155304 and maps it with
      skos:exactMatch. NCIT defines it as a rare developmental early childhood neoplasm arising
      within the fetal anterior pituitary and associated with DICER1 mutations, the tumour this
      entry describes. The entry also records two young-adult case reports; one (PMID:40451220)
      presents its case as expanding the clinicopathological spectrum of the tumour, with its
      unusual age, so the reports describe the same tumour at an unusual age and the two concepts
      still match exactly.
inheritance:
- name: Autosomal dominant predisposition
  inheritance_term:
    preferred_term: autosomal dominant
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  description: >-
    The tumour is not inherited as such: it arises mostly in children who carry a germline DICER1
    variant, which is inherited in an autosomal dominant manner with reduced, age-related
    penetrance, and the second hit is acquired in the tumour. For this rare tumour the penetrance
    is under 1%.
  evidence:
  - reference: PMID:24761742
    reference_title: >-
      DICER1-Related Tumor Predisposition.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      DICER1 is inherited in an autosomal dominant manner with reduced, age-related penetrance.
    explanation: >-
      The inheritance of the germline variant behind the tumour.
  - reference: PMID:33236116
    reference_title: >-
      Clinical Outcomes and Complications of Pituitary Blastoma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Penetrance in DICER1 syndrome is generally low: less than 5% to 10% for the more frequent
      phenotypes and less than 1% for the rare phenotypes such as pituitary blastoma
    explanation: >-
      The penetrance for this tumour among carriers, from the series' introduction.
  - reference: PMID:24839956
    reference_title: >-
      Pituitary blastoma: a pathognomonic feature of germ-line DICER1 mutations.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The penetrance appears to be well below 1 %.
    explanation: >-
      The genetics series states, without giving a basis, that the penetrance of this tumour among
      DICER1 carriers appears to be well below 1%; this agrees with the figure the outcome series
      quotes in its introduction.

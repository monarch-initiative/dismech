- discussion_id: pbl_few_carriers
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Why do so few DICER1 carriers develop a pituitary blastoma?
  attaches_to:
  - pathophysiology#Germline DICER1 Loss-of-Function Variant
  - pathophysiology#Somatic DICER1 Second Hit
  - inheritance#Autosomal dominant predisposition
  rationale: >-
    The genetics series says penetrance appears to be well below 1%, and the outcome series'
    introduction, citing earlier work, puts it below 1%. The genetics series predicts that every
    tumour has two DICER1 mutations and proposes that the second, somatic one occurs in the
    embryonic pituitary. A study pooling two registries and a US National Cancer Institute cohort
    of DICER1 carriers (207 in all, many ascertained through a DICER1-associated tumour) saw no
    pituitary blastoma among them. A review states that the second somatic hit and its site
    determine where a DICER1-associated tumour arises. For DICER1 tumours in general, the carrier
    study's introduction suggests that the apparent requirement for a somatic mutation at one of
    five specific codons may explain in part the incomplete penetrance seen in families (in this
    tumour the second hit is sometimes loss of the wild-type allele instead); none of the sources
    cited in this discussion explains why this tumour in particular is so rare among carriers.
  evidence:
  - reference: PMID:24839956
    reference_title: >-
      Pituitary blastoma: a pathognomonic feature of germ-line DICER1 mutations.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The penetrance appears to be well below 1 %.
    explanation: >-
      The genetics series' statement, given without supporting data or a citation, that penetrance
      appears to be well below 1%.
  - reference: PMID:33236116
    reference_title: >-
      Clinical Outcomes and Complications of Pituitary Blastoma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Penetrance in DICER1 syndrome is generally low: less than 5% to 10% for the more frequent
      phenotypes and less than 1% for the rare phenotypes such as pituitary blastoma
    explanation: >-
      The outcome series' introduction, citing earlier work, on the penetrance of this tumour
      among DICER1 carriers: less than 1%.
  - reference: PMID:24839956
    reference_title: >-
      Pituitary blastoma: a pathognomonic feature of germ-line DICER1 mutations.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We predict that all cases will have two DICER1 mutations, hypothesizing that a second
      somatic “hit” (most often affecting an RNase IIIb metal ion-binding residue of DICER1) in
      the embryonic pituitary is required in addition to a loss-of-function germ-line DICER1
      mutation to initiate development of an embryonic-appearing blastomatous tumor.
    explanation: >-
      The genetics series predicts that every tumour has two DICER1 mutations and proposes that
      the second, somatic one occurs in the embryonic pituitary. INDIRECT: a prediction and a
      hypothesis; the source does not connect the embryonic timing of the second hit to
      penetrance.
  - reference: PMID:33236116
    reference_title: >-
      Clinical Outcomes and Complications of Pituitary Blastoma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In a minority of pituitary blastomas, the somatic event is not the usual hotspot mutation
      but instead a loss of the wild-type allele
    explanation: >-
      The outcome series' introduction, citing the genetics series: in a minority of these tumours
      the second hit is loss of the wild-type allele rather than a hotspot mutation.
  - reference: PMID:30715996
    reference_title: >-
      Neoplasm Risk Among Individuals With a Pathogenic Germline Variant in DICER1.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Other less common but establishedDICER1-associated cancers, such as pineoblastoma, pituitary
      blastoma, and Wilms tumor, were not observed in this study.
    explanation: >-
      A study of people carrying a pathogenic germline DICER1 variant, pooling two registries and
      a US National Cancer Institute cohort (207 carriers in all, probands and non-probands, many
      ascertained through a DICER1-associated tumour), saw no pituitary blastoma among them.
  - reference: PMID:30715996
    reference_title: >-
      Neoplasm Risk Among Individuals With a Pathogenic Germline Variant in DICER1.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The apparent requirement for somatic mutation in one of five specific codons may explain, in

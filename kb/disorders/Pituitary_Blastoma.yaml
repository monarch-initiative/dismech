- name: Surveillance of DICER1 carriers for central nervous system tumours
  diagnosis_term:
    preferred_term: brain magnetic resonance imaging for symptoms
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  description: >-
    Routine brain imaging of carriers without symptoms is not settled. The current recommendations
    are education about the signs, a neurological examination at each visit and an urgent MRI for
    any symptom; screening MRI without symptoms is left to shared decision, and the authors of the
    outcome series do not think screening carrier infants for this tumour is justified.
  evidence:
  - reference: PMID:39400264
    reference_title: >-
      DICER1-Related Tumor Predisposition: Identification of At-risk Individuals and Recommended
      Surveillance Strategies.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      Whether to offer CNS surveillance by MRI for asymptomatic individuals remains a subject of
      ongoing discussion and longitudinal data collection. For now, shared decision-making and
      family education regarding signs and symptoms and neurologic examination at each available
      opportunity with urgent MRI for any signs or symptoms of CNS disease are recommended.
    explanation: >-
      The 2024 recommendation for central nervous system tumours in DICER1 carriers, which covers
      this tumour.
  - reference: PMID:24761742
    reference_title: >-
      DICER1-Related Tumor Predisposition.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER

      snippet: >-
        These analyses demonstrated that DICER1 RNase IIIb hotspot mutations in PitBs induced
        improper processing of miRNA precursors, resulting in aberrant 5p-derived miRNA products and
        a skewed distribution of miRNAs favoring mature 3p over 5p miRNAs.
      explanation: >-

progression:
- phase: Outcome
  description: >-
    A locally destructive tumour with high mortality: 8 of the 17 children of the outcome series
    died, three of early medical or surgical complications, and the 5-year overall survival was 59%.
    None had metastasis at diagnosis or during follow-up in that series; the earlier genetics series
    had reported apparent intraventricular metastases in one child, without histological
    confirmation. Eight of the nine survivors have chronic deficits: neuroendocrine, visual or
    neurodevelopmental.
  evidence:
  - reference: PMID:33236116
    reference_title: >-
      Clinical Outcomes and Complications of Pituitary Blastoma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pituitary blastoma is a locally destructive tumor associated with high mortality.
    explanation: >-
      The outcome series' conclusion.
  - reference: PMID:33236116
    reference_title: >-
      Clinical Outcomes and Complications of Pituitary Blastoma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At a median follow-up of 6.7 years, 9 patients were alive; 8 patients died of the following
      causes: early medical/surgical complications (n = 3), sepsis (n = 1), catheter-related
      complication (n = 1), aneurysmal bleeding (n = 1), second brain tumor (n = 1), and progression
      (n = 1).
    explanation: >-
      Deaths and their causes in the 17 children; only one died of tumour progression.
  - reference: PMID:33236116
    reference_title: >-
      Clinical Outcomes and Complications of Pituitary Blastoma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The 5-year EFS and OS were 53 ± 12% and 59 ± 12%, respectively
    explanation: >-

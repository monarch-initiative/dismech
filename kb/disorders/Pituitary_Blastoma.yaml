  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    A count of reported cases, not a rate: the 2021 outcome series gathered all 17 well-investigated
    cases then known, reported between 1979 and 2017; a 2022 case report counts 21 reported cases.
    Single cases reported since 2021 are not added to the count here. Cases beyond infancy are
    described too, among them a 19-year-old woman, whom the outcome series mentions as a possible
    18th case but does not include.

- name: Somatic DICER1 Second Hit
  description: >-
    The transforming event: a somatic hit on the remaining DICER1 allele in the tumour, usually a
    missense mutation at a metal ion-binding residue of the RNase IIIb domain, and in a minority
    loss of the wild-type allele. In the genetics series eight of the nine tumour changes found
    were confirmed to be somatic; seven of the nine were predicted to hit the RNase IIIb catalytic
    site and the other two were losses of the wild-type allele. In one of those two children (case
    12 of the genetics series) the authors infer that the loss, together with the germline
    variant, would leave no normal DICER1 in the affected cells. The genetics series concludes
    that a somatic RNase IIIb mutation appears to be a critical second hit. In the outcome series,
    whose cohort overlaps the genetics series, 13 of 14 tumours tested had a DICER1 change: a
    hotspot mutation in 11 and loss of heterozygosity in 2. A 2014 case report, whose child is
    case 14 of the outcome series, found the child's germline frameshift variant and a somatic
    E1813V missense change together in one tumour. Whole-genome sequencing of tumours in a 2021
    molecular study found very few somatic alterations, suggesting that few other changes
    accompany the DICER1 hits.

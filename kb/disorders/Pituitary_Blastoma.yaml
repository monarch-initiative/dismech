  - reference: PMID:32339726
    reference_title: >-
      Pituitary Blastoma in a 19-Year-Old Woman: A Case Report and Review of Literature.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-

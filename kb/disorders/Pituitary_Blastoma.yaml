- name: ACTH-immunoreactive secretory cells
  finding_term:
    preferred_term: secretory cells immunoreactive for ACTH
  description: >-
    Secretory cells in which ACTH is the usual hormone, with growth hormone less often (10 of the
    14 tumours tested in the outcome series); other pituitary hormones are rarely found. Of the 17
    tumours of the outcome series, 16 stained for ACTH; the exception was the tumour of a child
    who presented with signs of raised intracranial pressure. The pathophysiology node Tumoral
    ACTH Secretion, which drives the Cushing syndrome of most children, records the secretion
    attributed to these cells.
  notes: >-
    No term is bound. The NCIT search "l~Corticotroph" returns corticotroph cell terms (such as
    Corticotroph Cell, NCIT:C32390), none admissible in the histopathology finding enum;
    corticotroph pituitary neuroendocrine tumour terms (such as Corticotroph Pituitary
    Neuroendocrine Tumor, NCIT:C7462), which are admissible but name a different tumour; and blood
    corticotrophin terms, which are not admissible. The NCIT searches "l~ACTH" and
    "l~Corticotropin" each return one admissible term, Pancreatic ACTH-Producing Neuroendocrine
    Tumor (NCIT:C27466) and Ovarian Dermoid Cyst with Corticotropin Secreting Adenoma
    (NCIT:C40007), both naming other tumours; none of "l~ACTH", "l~Corticotropin" and
    "l~adrenocorticotropic" returns a term that names ACTH-immunoreactive cells. OLS searches of
    HPO for "corticotroph" and "ACTH" return hormone-level, endocrine-disorder and
    stimulation-test terms, and Pituitary corticotropic cell adenoma (HP:0008291), which names a
    different tumour. The genetics series, whose cohort the outcome series overlaps, reports ACTH
    in at least a subset of the secretory cells of every tumour it reviewed, while the outcome
    series reports one ACTH-negative tumour, described in the row's description; the entry follows
    the later series.
  evidence:
  - reference: PMID:33236116
    reference_title: >-
      Clinical Outcomes and Complications of Pituitary Blastoma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Immunohistochemical staining for ACTH was positive in 16 of 17 tumors; the patient whose
      tumor was negative for ACTH presented with signs of increased intracranial pressure, and no
      endocrinologic assessment was conducted preoperatively.
    explanation: >-
      ACTH staining in 16 of the 17 tumours of the outcome series.
  - reference: PMID:33236116
    reference_title: >-
      Clinical Outcomes and Complications of Pituitary Blastoma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Immunohistochemistry for GH was positive in 10 of the 14 cases tested, but serum
      insulin-like growth factor-1 (n = 3) and spot GH (n = 1) did not suggest GH excess in the 4
      patients evaluated (see Table 2).
    explanation: >-
      Growth hormone stained in 10 of the 14 tumours tested in the outcome series; tests in the 4
      patients evaluated did not suggest growth hormone excess. With the 16 of 17 ACTH count
      above, this supports the description's statement that growth hormone is found less often
      than ACTH.
  - reference: PMID:24839956
    reference_title: >-
      Pituitary blastoma: a pathognomonic feature of germ-line DICER1 mutations.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-

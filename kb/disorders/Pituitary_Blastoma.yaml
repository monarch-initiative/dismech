    which, the outcome series says, the mass arises, with extension into the hypothalamus.
    Searches run with runoak -i ols:hp search, which matched whole words ("sellar" did not find
    the suprasellar term): "l~sellar" returned nothing; "l~suprasellar" returned only Suprasellar
    arachnoid cyst; "l~Neoplasm of the pituitary" returned Neoplasm of the pituitary gland and its
    anterior and posterior children; "l~pituitary" returned 44 terms, among them adenoma types,
    Pituitary blastoma and Enlarged pituitary gland, and none for a pituitary mass.
  description: >-
    In infants, the usual appearance on MRI: an enhancing sellar mass, with or without
    intratumoural cysts and cavernous sinus involvement, a median 3 cm across (range 1.7 to 12 cm)

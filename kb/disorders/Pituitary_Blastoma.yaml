      pituitary blastoma (her age and the pathology are given earlier in the abstract).
  - reference: PMID:40451220
    reference_title: >-
      Pituitary Blastoma: Expanding the Spectrum of Histopathological Findings in a Young Adult With DICER1 Mutation.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-

- discussion_id: pbl_no_standard_treatment
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Which children need anti-tumour treatment after resection, and what should it be?
  attaches_to:
  - treatments#Adjuvant chemotherapy
  - treatments#Focal radiotherapy
  rationale: >-
    None of the sources cited in this discussion establishes a standard anti-tumour treatment
    after resection; the endocrine support the outcome series says is needed is outside this
    question. The outcome series notes that the tumour's rarity and the small sample hamper robust
    analysis of therapy-related prognostic factors, although complete or near-complete resection
    may be adequate for disease control in some patients; in that series six children received
    adjuvant therapy, which was not significantly associated with better survival, and the series
    advises special caution with radiotherapy, as the Focal radiotherapy row records. The genetics
    series calls for communication between clinicians, neuropathologists and paediatric
    oncologists to help determine the most effective management of these infants.
  evidence:
  - reference: PMID:33236116
    reference_title: >-
      Clinical Outcomes and Complications of Pituitary Blastoma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The rarity of pituitary blastoma and limited sample size hamper robust analyses of
      demographic and therapy-related prognostic factors, although it appears that complete or
      near complete surgical resection may be adequate for disease control in some patients and
      that extensive endocrinologic support is needed.
    explanation: >-
      The outcome series' stated limitation: prognostic factors, including therapy, are hard to
      analyse robustly, although complete or near-complete resection may be adequate for disease
      control in some patients and extensive endocrine support is needed.

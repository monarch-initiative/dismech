name: Pituitary Blastoma
creation_date: '2026-11-20T20:06:00Z'
category: Cancer
synonyms:
- PitB
description: >-
  Pituitary blastoma is a rare embryonal tumour of the anterior pituitary gland that presents in the
  first two years of life, most often with Cushing syndrome from ACTH made by the tumour, and
  sometimes with cranial nerve palsies, reduced visual acuity or raised intracranial pressure,
  probably from the mass. It resembles the embryonic pituitary, with Rathke-type epithelium, small
  primitive cells and secretory cells. Most children carry a germline DICER1 variant (12 of 13
  tested in the outcome series, 11 of 14 in a 2022 review) and the tumour a somatic DICER1 hit, so
  finding the tumour is a strong pointer to DICER1 syndrome. It is not one of the pituitary
  neuroendocrine tumours (adenomas) or the metastatic tumours once called pituitary carcinoma, which
  the Pituitary_Tumor entry covers. Mortality is high, but in the outcome series only one of eight
  deaths was from tumour progression. Young adult cases have also been described; the outcome series
  mentions a 19-year-old woman as a possible 18th case but does not include her.
categories:
- Pediatric Cancer
- Central Nervous System Tumor
- Embryonal Tumor
- DICER1-Associated Neoplasm
- Rare Cancer
parents:

notes: >-
  The phenotype counts come from the 2021 outcome series of the 17 well-investigated children then
  known, whose cohort overlaps the 2014 genetics series of 13; the two report a few of the same
  children differently, and the entry follows the later series where they differ. Diabetes
  insipidus, secondary hypothyroidism and developmental delay are not linked to a mechanism node,
  because no cached source says how the tumour produces them. MONDO places the tumour under
  pituitary cancer (MONDO:0002109), the term the Pituitary_Tumor entry binds for its pituitary
  carcinoma subtype; the WHO 2022 classification lists pituitary blastoma apart from the pituitary
  neuroendocrine tumours, and calls the former pituitary carcinoma metastatic PitNET. The DICER1
  GeneReviews chapter is cached as its summary only, so only the summary is cited.

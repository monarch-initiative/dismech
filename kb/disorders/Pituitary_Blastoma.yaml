        Increased ACTH (n = 9) or random serum cortisol (n = 1) was documented at diagnosis in the
        10 patients presenting with Cushing syndrome
      explanation: >-
        Raised ACTH in nine of the ten children with Cushing syndrome. INDIRECT: the quote shows the
        two together, not that the tumour's ACTH caused the syndrome.
    - reference: PMID:33236116
      reference_title: >-
        Clinical Outcomes and Complications of Pituitary Blastoma.
      supports: SUPPORT
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Persistent hypercortisolism was not observed among long-term survivors. In case 3, cortisol
        levels progressively diminished in the first 3 months following STR of tumor. At 4 months,
        hypercortisolemia returned and the child started to become cushingoid. Chemotherapy was
        commenced, with cortisol measurements normalizing over the next 12 to 18 months.
      explanation: >-
        No long-term survivor had lasting hypercortisolism. In one child cortisol fell after partial
        removal of the tumour, then the hypercortisolism returned and the child started to become
        cushingoid, and cortisol normalised under chemotherapy. INDIRECT: a response to treatment in
        one child, read as the tumour driving the cortisol.

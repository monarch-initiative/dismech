treatments:
- name: Surgical resection
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: tumour resection
    term:
      id: NCIT:C164212
      label: Tumor Resection
  description: >-
    The first treatment in every child of the outcome series, in four of them in stages: gross or
    near-total resection in 7, subtotal resection in 9 and biopsy alone in 1. The extent of
    resection was the one treatment factor associated with survival, and surgery was the only
    treatment in five of the nine survivors: of the seven children treated by surgery alone who
    lived beyond six weeks, five became long-term survivors, four after gross total and one after
    subtotal resection. The series' authors judge that complete or near-complete resection may be
    enough for disease control in some patients, while noting that the small numbers limit robust
    analysis of prognostic factors. The 2012 report's abstract describes its three additional
    cases (one previously published as a pituitary adenoma; by the genetics series' Table 1, two
    of them are its cases 3 and 5, which match the outcome series' cases 3 and 5 by case number,
    sex and age) as subtotally resected; in two adult case reports a tumour in a 19-year-old woman
    whose pathology suggested a pituitary blastoma was subtotally removed, and a 27-year-old man
    had surgical decompression.
  target_mechanisms:
  - target: Arrested Pituitary Development with Uncontrolled Proliferation
    treatment_effect: INHIBITS
    description: >-
      Removing the tumour removes the proliferating tissue and with it the source of the ACTH and
      the mass; it does not touch the germline DICER1 variant, which stays with the child.
    evidence:
    - reference: PMID:33236116
      reference_title: >-
        Clinical Outcomes and Complications of Pituitary Blastoma.
      supports: SUPPORT
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Extent of resection (GTR/NTR vs STR/Bx; EFS P = .018, OS P = .023) and year of diagnosis
        (before 1996 vs 1996 or later; EFS P = .048, OS P = .029), were significantly associated
        with patient survival.
      explanation: >-
        Gross or near-total resection, against subtotal resection or biopsy, was significantly
        associated with event-free and overall survival in 17 children; a small retrospective
        series, so an association rather than a trial result. INDIRECT: an outcome of the treatment,
        cited for the tissue it removes.
    - reference: PMID:33236116
      reference_title: >-
        Clinical Outcomes and Complications of Pituitary Blastoma.
      supports: SUPPORT
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Notwithstanding limited case numbers, our analyses (see Fig. 3) suggest GTRs/NTRs are
        beneficial and that more recently treated cases are associated with better survival, which
        seems reasonable given advances in imaging, neurosurgery, intensive care, and endocrinology.
      explanation: >-
        The direction of the association: on limited numbers, the authors read their analysis as
        suggesting that gross or near-total resection is beneficial. INDIRECT, for the same reason.
  evidence:
  - reference: PMID:33236116
    reference_title: >-
      Clinical Outcomes and Complications of Pituitary Blastoma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Surgical resection was attempted at diagnosis in all patients, including 4 patients who had
      staged resection, resulting in gross or near-total resection (GTR/NTR, n = 7), subtotal
      resection (STR, n = 9), and Bx (n = 1).
    explanation: >-
      Resection was attempted in every child; the extent achieved in the 17.
  - reference: PMID:33236116
    reference_title: >-
      Clinical Outcomes and Complications of Pituitary Blastoma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Surgery was the only intervention for 5 of 9 survivors.
    explanation: >-
      Five of the nine survivors had surgery alone.
  - reference: PMID:33236116
    reference_title: >-
      Clinical Outcomes and Complications of Pituitary Blastoma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Surgical resection alone provides long-term disease control for some patients.
    explanation: >-
      The authors' conclusion from the five survivors treated with surgery alone.
  - reference: PMID:33236116
    reference_title: >-
      Clinical Outcomes and Complications of Pituitary Blastoma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of the 7 surgery-only patients who survived beyond 6 weeks, 5 were long-term survivors;
      their extents of surgery were, respectively, GTR (n = 4) and STR (n = 1) (see Fig. 2).
    explanation: >-
      Of the seven children treated by surgery alone who lived beyond six weeks, five became
      long-term survivors, four after gross total and one after subtotal resection.
  - reference: PMID:33236116
    reference_title: >-
      Clinical Outcomes and Complications of Pituitary Blastoma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The rarity of pituitary blastoma and limited sample size hamper robust analyses of
      demographic and therapy-related prognostic factors, although it appears that complete or
      near complete surgical resection may be adequate for disease control in some patients and
      that extensive endocrinologic support is needed.
    explanation: >-
      The series' authors judge that complete or near-complete resection may be enough for disease
      control in some patients, with the caveat that the small numbers limit analysis of
      prognostic factors.
  - reference: PMID:21805093
    reference_title: >-

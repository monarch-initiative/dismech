name: Intellectual Disability X-linked Syndromic Houge Type
creation_date: "2026-10-30T18:00:00Z"
category: Mendelian
disease_term:
  preferred_term: intellectual disability, X-linked, syndromic, Houge type
  term:
    id: MONDO:0030909
    label: intellectual disability, X-linked, syndromic, Houge type
parents:
- Syndromic X-Linked Intellectual Disability
- Developmental and Epileptic Encephalopathy
synonyms:
- intellectual developmental disorder, X-linked, syndromic, Houge type
- Houge type of X-linked syndromic mental retardation
- MRXSHG
- CNKSR2-related neurodevelopmental and epilepsy disorder
- CNKSR2-related developmental and epileptic encephalopathy with spike-wave activation in sleep
description: >-
  An X-linked neurodevelopmental disorder caused by loss-of-function variants in
  CNKSR2 (Xp22.12), which encodes a postsynaptic scaffold protein also known as
  CNK2 or MAGUIN. Affected hemizygous males have global developmental delay and
  intellectual disability, attention deficit and hyperactivity, and an epilepsy
  that begins in early childhood, is often difficult to control at first, and
  frequently shows continuous spike-and-wave activity in slow-wave sleep
  (CSWS/ESES). Language is disproportionately affected: many children never
  acquire speech or lose it abruptly when the epilepsy begins, and the language
  deficit persists after the seizures abate, which they usually do before
  adolescence. Sleep disturbance, autism and feeding difficulties are less
  frequent. About half of the variants arise de novo. Heterozygous females are
  often unaffected, but some have seizures and mild intellectual disability and
  a few have had a severe phenotype with skewed X inactivation. Fewer than a
  hundred patients have been reported.
inheritance:
- name: X-linked
  inheritance_term:
    preferred_term: X-linked inheritance
    term:
      id: HP:0001417
      label: X-linked inheritance
  description: >-
    Hemizygous males are consistently affected. About half of the known
    heterozygous females are unaffected and the others have a similar but
    usually milder neurological phenotype; a few females carrying de novo
    truncating variants have been severely affected, with skewed X
    inactivation proposed as the modifier. Approximately half of cases are de
    novo, and most carrier mothers of maternally transmitted cases are
    neurologically unaffected. Sources describe the disorder as X-linked
    recessive and, because of the affected females, as X-linked without
    qualification, so the unqualified term is bound.
  evidence:
  - reference: PMID:42541982
    reference_title: "Novel splice-site and recurrent p.Arg729* CNKSR2 variants in ESES/CSWS: insights into sex-dependent expression."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Hemizygous males are typically severely affected, whereas symptomatic females remain rare and incompletely characterized."
    explanation: States the sex-dependent expression of the X-linked disorder.
  - reference: PMID:34266427
    reference_title: "CNKSR2-related neurodevelopmental and epilepsy disorder: a cohort of 13 new families and literature review indicating a predominance of loss of function pathogenic variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Approximately half of the known instances of CNKSR2-related disease are de novo in origin, and of the maternally transmitted cases, the majority of carrier mothers are neurologically without concerns."
    explanation: Proportion of de novo cases and the usual unaffected status of carrier mothers.
  - reference: PMID:34266427
    reference_title: "CNKSR2-related neurodevelopmental and epilepsy disorder: a cohort of 13 new families and literature review indicating a predominance of loss of function pathogenic variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Approximately half of all known females heterozygous for a pathogenic CNKSR2 variant have a similar but sometimes milder neurological phenotype, but the other half are without neurodevelopmental concerns or seizures."
    explanation: Variable expression in heterozygous females, pooled across reported families.
  - reference: PMID:28098945
    reference_title: "Frequency of CNKSR2 mutation in the X-linked epilepsy-aphasia spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This mutation segregated in the three affected siblings in an X-linked manner, inherited from their mother who had febrile seizures."
    explanation: X-linked segregation of a CNKSR2 nonsense variant in a family that includes an affected sister.
  - reference: PMID:40873128
    reference_title: "Identification of CNKSR2 Pathogenic Variant and Detection of Strong XCI in a Female Patient With Severe DEE-SWAS and Phenotype Expansion in Male Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole-genome sequencing (WGS) revealed a heterozygous CNKSR2 c.2134C>T, p.(Arg712Ter) variant (de novo, previously reported), and X-chromosome inactivation analysis of her white blood cell DNA showed marked skewing (85:15)."
    explanation: A severely affected heterozygous female with a de novo variant and skewed X inactivation.
  - reference: PMID:31414730
    reference_title: "A de novo variant in the X-linked gene CNKSR2 is associated with seizures and mild intellectual disability in a female patient."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our results indicate that CNKSR2 nonsense variants in the C-terminal coding part can result in ID with seizures in female variant carriers."
    explanation: Heterozygous female expression of seizures and intellectual disability.
genetic:
- name: CNKSR2
  gene_term:
    preferred_term: CNKSR2
    term:
      id: hgnc:19701
      label: CNKSR2
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  association: >-
    CNKSR2 (Xp22.12) is the only gene associated with this disorder. Pathogenic
    alleles are almost all predicted loss-of-function: whole or partial gene
    deletions, nonsense, frameshift and canonical splice variants, with a
    minority of missense variants.
  evidence:
  - reference: PMID:25223753
    reference_title: "Absent CNKSR2 causes seizures and intellectual, attention, and language deficits."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We detail the disease caused by absence of the synaptic protein CNKSR2 in 8 patients ranging from 6 to 62 years old."
    explanation: Defining case series attributing the disorder to absence of CNKSR2.
  - reference: PMID:34266427
    reference_title: "CNKSR2-related neurodevelopmental and epilepsy disorder: a cohort of 13 new families and literature review indicating a predominance of loss of function pathogenic variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Virtually all of the pathogenic variants are predicted to be loss of function, including genomic deletions, nonsense variants, splice site mutations, and small insertions or deletions."
    explanation: Loss-of-function allelic spectrum across 13 families.
  - reference: PMID:39707601
    reference_title: "Novel Digital Anomalies, Hippocampal Atrophy, and Mutations Expand the Genotypic and Phenotypic Spectra of CNKSR2 in the Houge Type of X-Linked Syndromic Intellectual Development Disorder (MRXSHG)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic analyses revealed 14 distinct variants in CNKSR2, comprising five nonsense, three frameshift, two splice, and four missense variants, of which 13 are novel."
    explanation: Variant classes in a 15-patient series, including missense variants.
  - reference: PMID:22511892
    reference_title: "Loss-of-Function CNKSR2 Mutation Is a Likely Cause of Non-Syndromic X-Linked Intellectual Disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The maternally inherited deletion removed the initial 15 of the 21 exons of the connector enhancer of KSR-2 gene called CNKSR2 or CNK2."
    explanation: A partial gene deletion as a disease allele.
  notes: >-
    ClinGen classifies CNKSR2 as Definitive for X-linked complex
    neurodevelopmental disorder (MONDO:0100148, CGGV assertion
    420ee599-c745-43b9-b9a9-c80dfd7f68a8, December 2020), a broader lumped
    disease rather than MONDO:0030909, so no gene_disease_validity assertion is
    recorded here.
  variants:
  - name: p.Arg712Ter
    description: >-
      Recurrent nonsense variant reported in an X-linked family with
      epilepsy-aphasia spectrum phenotypes and, de novo, in a severely affected
      female. The family report gives the cDNA position as c.2314C>T and the
      later report as c.2134C>T; codon 712 corresponds to c.2134.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:28098945
      reference_title: "Frequency of CNKSR2 mutation in the X-linked epilepsy-aphasia spectrum."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We detected a novel nonsense mutation (c.2314 C>T; p.Arg712*) in one Ashkenazi Jewish family, the male proband of which had a severe epileptic encephalopathy with continuous spike-waves in sleep (ECSWS)."
      explanation: First report of p.Arg712* in a family with CSWS.
  - name: p.Arg729Ter
    description: >-
      Recurrent nonsense variant from a CGA>TGA transition at a CpG
      dinucleotide, found de novo in two unrelated males.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:42541982
      reference_title: "Novel splice-site and recurrent p.Arg729* CNKSR2 variants in ESES/CSWS: insights into sex-dependent expression."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Our case represents its second independent occurrence, a CGA>TGA transition at a CpG dinucleotide consistent with a mutational hotspot."
      explanation: Recurrence of p.Arg729* at a CpG mutational hotspot.
pathophysiology:
- name: CNKSR2 Loss of Function
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Germline deletion, truncating, splice or missense variants abolish or
    destabilize CNKSR2, a multidomain scaffold (SAM, CRIC, PDZ and PH domains
    and a C-terminal PDZ-binding motif) that binds PSD-95 and S-SCAM at the
    postsynaptic density and interacts with RAF1, ARHGAP39 (Vilse) and CYTH2.
    In males the single X carries the variant, so no wild-type copy remains.
  genetic_context:
    genes:
    - preferred_term: CNKSR2
      term:
        id: hgnc:19701
        label: CNKSR2
    variant_origin: GERMLINE
    zygosity: HEMIZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Hemizygous in affected males; heterozygous in affected females.
  molecular_functions:
  - preferred_term: postsynaptic scaffold (protein-macromolecule adaptor) activity
    modifier: DECREASED
    term:
      id: GO:0030674
      label: protein-macromolecule adaptor activity
  cellular_components:
  - preferred_term: postsynaptic density
    term:
      id: GO:0014069
      label: postsynaptic density
  evidence:
  - reference: PMID:35053419
    reference_title: "Functions of CNKSR2 and Its Association with Neurodevelopmental Disorders."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "CNKSR2 interacts with different molecules, including RAF1, ARHGAP39, and CYTH2, and regulates the Mitogen-Activated Protein Kinase (MAPK) cascade and small GTPase signaling."
    explanation: Review summarizing the scaffold's binding partners and signaling roles.
  - reference: PMID:10207009
    reference_title: "MAGUIN, a novel neuronal membrane-associated guanylate kinase-interacting protein."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "MAGUIN-1 is localized at the plasma membrane via the plekstrin homology domain and the C-terminal region and interacts with PSD-95/SAP90 and S-SCAM via a C-terminal PDZ domain-binding motif."
    explanation: Biochemical identification of CNKSR2 (MAGUIN-1) as a PSD-95 and S-SCAM binding partner.
  - reference: PMID:34266427
    reference_title: "CNKSR2-related neurodevelopmental and epilepsy disorder: a cohort of 13 new families and literature review indicating a predominance of loss of function pathogenic variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Virtually all of the pathogenic variants are predicted to be loss of function, including genomic deletions, nonsense variants, splice site mutations, and small insertions or deletions."
    explanation: Loss of function is the predominant disease mechanism.
  downstream:
  - target: Impaired Postsynaptic AMPA Receptor Localization
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:36803960
      reference_title: "s-Afadin binds to MAGUIN/Cnksr2 and regulates the localization of the AMPA receptor and glutamatergic synaptic response in hippocampal neurons."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Genetic ablation of MAGUIN impaired PSD-95 localization and α-amino-3-hydroxy-5-methyl-4-isoxazolepropionic (AMPA) receptor surface accumulation in cultured hippocampal neurons."
      explanation: Loss of CNKSR2 (MAGUIN) in cultured neurons mislocalizes PSD-95 and reduces surface AMPA receptors.
  - target: Dysregulated Rac Cycling at Dendritic Spines
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:24656827
      reference_title: "The CNK2 scaffold interacts with vilse and modulates Rac cycling during spine morphogenesis in hippocampal neurons."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Through mutant analysis, protein depletion and rescue experiments, we identify CNK2 as a spatial modulator of Rac cycling during spine morphogenesis and find that the interaction with Vilse is critical for maintaining RacGDP/GTP levels at a balance required for spine formation."
      explanation: Depletion of CNK2 disturbs the Vilse-dependent balance of Rac activity during spine formation.
  - target: Impaired Dentate Granule Cell Development
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:34800437
      reference_title: "The synaptic scaffolding protein CNKSR2 interacts with CYTH2 to mediate hippocampal granule cell development."

discussions:
- discussion_id: cnksr2_synapse_to_hyperexcitability
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Which consequence of CNKSR2 loss produces network hyperexcitability and
    sleep-activated spike-wave discharges, given that the best characterized
    synaptic defect is a weaker glutamatergic postsynaptic response?
  attaches_to:
  - pathophysiology#Reduced Glutamatergic Postsynaptic Response
  - pathophysiology#Neuronal Network Hyperexcitability
  rationale: >-
    Cultured CNKSR2-deficient hippocampal neurons show reduced AMPA receptor
    surface accumulation and a smaller response to glutamate, and the same
    study found no increase in chemically induced seizure susceptibility,
    whereas the knockout mouse has spontaneous seizures and CNKSR2 is present
    at inhibitory as well as excitatory postsynapses. No edge is drawn from the
    synaptic nodes to hyperexcitability for this reason.
  evidence:
  - reference: PMID:36803960
    reference_title: "s-Afadin binds to MAGUIN/Cnksr2 and regulates the localization of the AMPA receptor and glutamatergic synaptic response in hippocampal neurons."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Furthermore, disruption of MAGUIN did not increase the seizure susceptibility to flurothyl, a GABAA receptor antagonist."
    explanation: Negative result that leaves the route to hyperexcitability open.
  - reference: PMID:34580165
    reference_title: "Cnksr2 Loss in Mice Leads to Increased Neural Activity and Behavioral Phenotypes of Epilepsy-Aphasia Syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We find that Cnksr2 is expressed in cortical, striatal, and cerebellar regions and is localized at both excitatory and inhibitory postsynapses."
    explanation: Presence at inhibitory synapses offers an alternative route not yet tested.
- discussion_id: cnksr2_language_loss_origin
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Is the lifelong language loss caused by the sleep-activated epilepsy, by
    CNKSR2 loss in cortical excitatory circuits independently of seizures, or
    both?
  attaches_to:
  - phenotypes#Loss of acquired spoken language
  - pathophysiology#Excitatory Neuron Dysfunction in Anterior Cingulate Cortex
  rationale: >-
    In patients, language regression coincides with the onset of the epilepsy
    and spike-wave activation in sleep, but persists after the epilepsy
    remits. In mice, vocalization loss can be dissociated from seizures, but
    ultrasonic vocalization is a weak model of human language, so the mouse
    result does not settle the human question.
  evidence:
  - reference: PMID:39694826
    reference_title: "The Epilepsy-Aphasia Syndrome Gene, Cnksr2, Plays a Critical Role in the Anterior Cingulate Cortex Mediating Vocal Communication."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Together, our results reveal Cnksr2-based mechanisms that underlie USV impairments that suggest communication impairments can be dissociated from seizures or anxiety."
    explanation: Model evidence for a seizure-independent communication deficit.
  - reference: PMID:32197126
    reference_title: "Expanding the clinical and EEG spectrum of CNKSR2-related encephalopathy with status epilepticus during slow sleep (ESES)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Epilepsy onset (age range: 2-6 years) was associated with appearance or aggravation of cognitive impairment, language regression and/or behavioral disorders."
    explanation: Human temporal association between epilepsy onset and language regression.
notes: >-
  Scope. This is a single-gene disorder defined by CNKSR2 and is curated as its
  own entry. DEE_with_Spike-Wave_Activation_in_Sleep is an etiologically
  heterogeneous electroclinical syndrome that names CNKSR2 as one cause, and not
  every patient here has spike-wave activation in sleep (44% of those with a
  sleep EEG in the pooled literature).
  Non-Syndromic_X-Linked_Intellectual_Disability is a class entry that mentions
  CNKSR2 only among genes found in X-exome screens, while this disorder has
  consistent additional features (epilepsy, language loss, ADHD) and MONDO
  places it under X-linked syndromic intellectual disability.
  Tonne-Kalscheuer_Syndrome (RLIM) and Autism_Susceptibility_to_X-Linked_3
  (MECP2) only cite papers that list CNKSR2 among other genes.

  No GeneReviews chapter exists for this disorder (just check-genereviews). The
  CNKSR2 protein is also called CNK2 and MAGUIN, the name used in the older
  mechanistic literature; KSR2 is a different gene.

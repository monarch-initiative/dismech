      evidence_source: MODEL_ORGANISM
      snippet: "In both cases, CNKSR2-knockdown and CYTH2-knockdown cells exhibited characteristics of immature granule cells, consistent with their putative roles in neuron differentiation."
      explanation: In vivo knockdown of CNKSR2 in mouse granule cell precursors leaves them immature.
  - target: Neuronal Network Hyperexcitability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Shown in the knockout mouse; which of the synaptic defects produces the
      hyperexcitability has not been established.
    evidence:
    - reference: PMID:34580165
      reference_title: "Cnksr2 Loss in Mice Leads to Increased Neural Activity and Behavioral Phenotypes of Epilepsy-Aphasia Syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Here we develop a novel Cnksr2 KO mouse line and show that male mice exhibit increased neural activity and have spontaneous electrographic seizures."
      explanation: Loss of Cnksr2 in male mice raises neural activity.
  - target: Excitatory Neuron Dysfunction in Anterior Cingulate Cortex

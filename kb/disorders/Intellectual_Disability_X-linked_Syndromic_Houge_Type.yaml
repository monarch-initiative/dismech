      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "Here, we leverage conditional deletion of the X-linked Cnksr2 in a neuronal cell-type manner in male mice to demonstrate that anxiety and impaired USVs track with its loss from excitatory neurons."
      explanation: Vocal communication loss tracks with excitatory-neuron Cnksr2 loss, an inference step away from human language.

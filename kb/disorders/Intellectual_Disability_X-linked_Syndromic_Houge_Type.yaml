animal_models:
- name: Cnksr2 knockout mouse
  species: Mouse
  genotype: Cnksr2 null (hemizygous males)
  publication: PMID:34580165
  description: >-
    Male Cnksr2 knockout mice have increased neural activity, spontaneous
    electrographic seizures, anxiety, impaired learning and memory, and a
    progressive loss of ultrasonic vocalizations.
  modeled_mechanisms:
  - target: Neuronal Network Hyperexcitability
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    limitations: >-
      The sleep-state dependence of the human epileptiform activity
      (continuous spike-and-wave in slow-wave sleep) is not reported in the
      model, and mouse ultrasonic vocalization is only a proxy for human
      language.
    evidence:
    - reference: PMID:34580165
      reference_title: "Cnksr2 Loss in Mice Leads to Increased Neural Activity and Behavioral Phenotypes of Epilepsy-Aphasia Syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Here we develop a novel Cnksr2 KO mouse line and show that male mice exhibit increased neural activity and have spontaneous electrographic seizures."
      explanation: The knockout reproduces the hyperexcitability and spontaneous seizures.
    - reference: PMID:34580165
      reference_title: "Cnksr2 Loss in Mice Leads to Increased Neural Activity and Behavioral Phenotypes of Epilepsy-Aphasia Syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Cnksr2 KO mice also display significantly increased anxiety, impaired learning and memory, and a progressive and dramatic loss of ultrasonic vocalizations."
      explanation: Behavioral phenotypes paralleling the human cognitive and communication deficits.
- name: Cnksr2 conditional knockout in excitatory neurons
  species: Mouse
  genotype: Cnksr2 conditional deletion in glutamatergic neurons (males)
  publication: PMID:39694826
  description: >-
    Cell-type and region-restricted deletion shows that anxiety and loss of
    ultrasonic vocalizations follow Cnksr2 loss from excitatory neurons, and
    that the vocalization deficit maps to the anterior cingulate cortex.
  modeled_mechanisms:
  - target: Excitatory Neuron Dysfunction in Anterior Cingulate Cortex
    relationship: PERTURBS
    fidelity: LOW
    model_scale: TISSUE
    limitations: >-
      Ultrasonic vocalization in mice is a distant proxy for human speech, so
      the model cannot show whether the human language loss arises in the same
      circuit.
    evidence:
    - reference: PMID:39694826
      reference_title: "The Epilepsy-Aphasia Syndrome Gene, Cnksr2, Plays a Critical Role in the Anterior Cingulate Cortex Mediating Vocal Communication."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Finally, we further narrow the essential role of Cnksr2 loss in USV deficits to excitatory neurons of the ACC, a region in mice recently implicated in USV production associated with specific emotional states or social contexts, such as mating calls, distress calls, or social bonding signals."
      explanation: Localizes the communication deficit to excitatory neurons of the anterior cingulate cortex.

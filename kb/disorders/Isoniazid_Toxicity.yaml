    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Slow acetylator genotypes were significantly associated with an increased
      risk of AT-DILI (pooled OR = 3.02; 95% CI = 2.50-3.64; p < 0.001).
    explanation: >-

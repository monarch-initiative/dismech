environmental:
- name: Isoniazid exposure
  description: >-
    Exposure by two routes with different tempos. Continued therapeutic dosing
    over months of tuberculosis treatment produces the hepatic and neuropathic
    arms. A single large ingestion produces the seizure syndrome. Both are the
    same drug, and the drug is given to very large numbers of people for latent
    infection, so the denominator behind these toxicities is not small.
  exposure_term:
    preferred_term: exposure to isoniazid
    term:
      id: ECTO:0000509
      label: exposure to drug
  exposure_classifications:
    hazard_agent_type:
    - classification_value: CHEMICAL
    exposure_route:
    - classification_value: ORAL
  influences_mechanisms:
  - target: Hepatic Bioactivation of Isoniazid
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Dosing supplies the substrate the liver bioactivates.
    evidence:
    - reference: PMID:41793109
      reference_title: "A Review on Isoniazid and Rifampicin-Associated Hepatotoxicity: From Metabolism to Immunity."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Isoniazid (INH) and rifampicin (RIF) are cornerstone first-line
        antituberculosis drugs, yet their clinical utility is often limited by
        drug-induced liver injury (DILI).
      explanation: >-
        Ties therapeutic administration of the drug to the liver injury this edge
        initiates.
  - target: Functional Pyridoxine Deficiency
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      The same exposure depletes usable vitamin B6, which is the head of the two
      neurological arms. The dose and the duration both matter, which is why the
      slow arm needs months and the fast arm needs only one ingestion.
    evidence:
    - reference: PMID:29897291
      reference_title: "Isoniazid-induced neuropathy in a pre-pubertal child."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        INH leads to peripheral neuritis by causing a deficiency in the serum
        level of pyridoxine which depends on the dose of INH, duration of
        treatment and the patient's nutritional and acetylator status.
      explanation: >-
        States that the drug causes the deficiency and that dose and duration
        determine how much, which is the claim of this edge.
  evidence:
  - reference: PMID:17535059
    reference_title: "Isoniazid overdose : a case series, literature review and survey of antidote availability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      With the numbers of patients receiving isoniazid remaining high, the number
      of cases of acute poisoning is expected to be significant.
    explanation: >-
      Supports the denominator point in this exposure's description - the drug is
      widely prescribed, so even an uncommon toxicity is not rare in absolute
      terms.
  notes: >-
    Bound to ECTO:0000509 exposure to drug. ECTO was searched through this
    repository's adapter (sqlite:obo:ecto) and has no isoniazid-specific exposure
    class.
treatments:
- name: NAT2 genotype-guided isoniazid dosing
  description: >-
    Setting the dose by acetylator genotype instead of by weight alone - roughly
    half the standard dose for slow acetylators, one and a half times it for rapid
    ones. In the randomised trial, 78 percent of slow acetylators on standard
    dosing developed isoniazid liver injury and none did under genotype-guided
    dosing. It is the entry's only intervention that acts on the modifier rather
    than on the injury, and it improved efficacy as well as tolerability, because
    the rapid acetylators had been under-dosed.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: NAT2 Slow Acetylator Genotype
    treatment_effect: MODULATES
    description: >-
      Genotype-guided dosing does not change the genotype; it changes the exposure
      that genotype produces, which is why the effect is recorded as MODULATES on
      the modifier node rather than as an inhibition of anything downstream.
    evidence:
    - reference: PMID:23150149
      reference_title: "NAT2 genotype guided regimen reduces isoniazid-induced liver injury and early treatment failure in the 6-month four-drug standard treatment of tuberculosis: a randomized controlled trial for pharmacogenetics-based therapy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In the intention-to-treat (ITT) analysis, INH-DILI occurred in 78 % of the
        slow acetylators in the STD-treatment, while none of the slow acetylators
        in the PGx-treatment experienced either INH-DILI or early treatment
        failure.
      explanation: >-
        Gives the effect in the slow-acetylator stratum, which is the group this
        node identifies. Note the comparison is within a stratum of a 172-patient
        trial in which slow acetylators were 9.3 percent, so the absolute numbers
        behind "78 percent" and "none" are small.
  evidence:
  - reference: PMID:23150149
    reference_title: "NAT2 genotype guided regimen reduces isoniazid-induced liver injury and early treatment failure in the 6-month four-drug standard treatment of tuberculosis: a randomized controlled trial for pharmacogenetics-based therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thus, the NAT2 genotype-guided regimen resulted in much lower incidences of
      unfavorable events, INH-DILI or early treatment failure, than the
      conventional standard regimen.
    explanation: >-
      The trial's own summary across both outcomes.
  - reference: PMID:23150149
    reference_title: "NAT2 genotype guided regimen reduces isoniazid-induced liver injury and early treatment failure in the 6-month four-drug standard treatment of tuberculosis: a randomized controlled trial for pharmacogenetics-based therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One hundred and seventy-two Japanese patients (slow acetylators, 9.3 %;
      rapid acetylators, 53.5 %) were enrolled in this trial.
    explanation: >-
      Gives the size and the acetylator composition. The population is Japanese,
      and NAT2 allele frequencies differ markedly between populations, so the
      stratum sizes here do not transfer.
  notes: >-
    Curated as a treatment because it is a randomised intervention with a measured
    outcome, not as a diagnostic. The trial is single-country and the strata are
    small; it demonstrates the principle rather than establishing a dosing table
    for general use.
- name: Pyridoxine as antidote in acute overdose
  description: >-
    Replacement of the depleted cofactor, dosed gram for gram against the
    isoniazid swallowed. It is an antidote in the strict sense - it restores the
    thing the poison removed - which is rarer in toxicology than the word suggests.
    Its availability is a real constraint: a survey of Australian emergency
    departments was conducted precisely because stocking enough of it is not
    guaranteed.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: pyridoxine
      term:
        id: CHEBI:16709
        label: pyridoxine
  target_mechanisms:
  - target: Functional Pyridoxine Deficiency
    treatment_effect: RESTORES
    description: >-
      Restores the cofactor whose absence is the head of both neurological arms.
      This is the one node in the entry where the treatment acts on the lesion
      itself rather than downstream of it.
    evidence:
    - reference: PMID:8522667
      reference_title: "Isoniazid overdose: four case reports and review of the literature."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Pyridoxine, in a dose equivalent to the amount of INH ingested, is the
        only effective antidote.
      explanation: >-
        States the antidotal role and the gram-for-gram dosing rule this treatment
        is built on.
  evidence:
  - reference: PMID:17535059
    reference_title: "Isoniazid overdose : a case series, literature review and survey of antidote availability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This paper presents a series of two cases of isoniazid poisoning presenting
      to a tertiary referral centre in North Queensland.
    explanation: >-
      Establishes the clinical case series in which the antidote was used. The
      sentence naming pyridoxine as the specific antidote in that paper contains a
      bracketed gloss that the reference validator strips before matching, so the
      antidote claim itself is carried by the gram-for-gram quote on this
      treatment's mechanism link instead.
  - reference: PMID:17535059
    reference_title: "Isoniazid overdose : a case series, literature review and survey of antidote availability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We also surveyed all hospitals in Australia with an accredited adult
      Emergency Department to assess the availability of pyridoxine.
    explanation: >-
      Supports the availability point in the description. The survey's findings
      are not quoted here and no shortfall figure is asserted.
  notes: >-
    Pyridoxine is not harmless at antidotal doses; the cited pyridoxine review
    states that excessive dosage has adverse effects, which it summarises. This
    entry records that the caveat exists rather than restating effects it does not
    quote.
- name: Pyridoxine prophylaxis during treatment
  description: >-
    The same vitamin used the other way round - given alongside isoniazid from the
    start, in the patients whose B6 reserve is already low, to stop the neuropathy
    forming. Prevention and antidote are the same molecule for the same reason.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: pyridoxine
      term:
        id: CHEBI:16709
        label: pyridoxine
  target_mechanisms:
  - target: Functional Pyridoxine Deficiency
    treatment_effect: RESTORES
    description: >-
      Maintains the cofactor so the deficiency never develops far enough to reach
      peripheral nerve.
    evidence:
    - reference: PMID:29897291
      reference_title: "Isoniazid-induced neuropathy in a pre-pubertal child."

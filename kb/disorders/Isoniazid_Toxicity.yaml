phenotypes:
- name: Elevated circulating hepatic transaminase concentration
  description: >-
    The earliest and commonest sign of the hepatic arm, and usually a transient
    one that resolves on continued treatment.
  phenotype_term:
    preferred_term: Elevated transaminases
    term:
      id: HP:0002910
      label: Elevated circulating hepatic transaminase concentration
  evidence:
  - reference: PMID:17021358
    reference_title: "An official ATS statement: hepatotoxicity of antituberculosis therapy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Treatment should be interrupted and, generally, a modified or alternative
      regimen used for those with ALT elevation more than three times the upper
      limit of normal (ULN) in the presence of hepatitis symptoms and/or jaundice,
      or five times the ULN in the absence of symptoms.
    explanation: >-
      Establishes transaminase elevation as the monitored abnormality and gives
      the thresholds at which it becomes actionable.
- name: Decreased liver function
  phenotype_term:
    preferred_term: Hepatitis progressing to liver failure
    term:
      id: HP:0001410

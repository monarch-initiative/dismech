name: Isoniazid Toxicity
creation_date: '2026-09-02T03:15:00Z'
description: >-
  Isoniazid toxicity is two different problems wearing one drug's name, and the
  difference is a matter of direction. The hepatic arm is about what the liver
  does to isoniazid: it bioactivates the drug to something reactive, and how much
  it makes depends on the patient's NAT2 acetylator genotype. The neurological
  arms are about what isoniazid does to vitamin B6. Isoniazid is a hydrazide, it
  reacts with pyridoxal, and the resulting functional B6 deficiency starves any
  enzyme that needs pyridoxal 5-phosphate. Given slowly, over months of treatment,
  that presents as a peripheral neuropathy - the nerve is deprived rather than
  poisoned. Given all at once in overdose, GABA synthesis fails for want of the
  same cofactor, and the patient seizes in a way ordinary anticonvulsants do not
  fix. The antidote is the missing vitamin, matched gram for gram to the dose
  swallowed.
categories:
- Treatment Toxicity
category: Complex
parents:
- Drug Toxicity
disease_term:
  preferred_term: isoniazid toxicity
  term:
    id: MONDO:0027677
    label: isoniazid toxicity
mechanistic_hypotheses:
- hypothesis_group_id: acetylhydrazine_metabolic_idiosyncrasy
  hypothesis_label: Acetylhydrazine bioactivation without an immune response
  status: DEPRECATED
  description: >-
    The long-standing account: isoniazid is acetylated to acetylhydrazine, which
    is oxidised to a reactive species that injures the hepatocyte, and the injury
    is a metabolic idiosyncrasy with no immune involvement. This is the model most
    textbooks still carry and it is the reason slow acetylation was originally
    expected to matter. It is recorded here as deprecated rather than omitted,
    because a curator meeting the acetylhydrazine story in a secondary source
    should be able to find out from this entry that it has been superseded.
  evidence:
  - reference: PMID:26773235
    reference_title: "Mechanism of isoniazid-induced hepatotoxicity: then and now."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Previous mechanistic hypotheses have classified this type of drug-induced
      liver injury (DILI) as 'metabolic idiosyncrasy' which was thought not to
      involve an immune response and was mainly due to the bioactivation of the
      acetylhydrazine metabolite.
    explanation: >-
      States the older model in the review's own words, and marks it as previous.
- hypothesis_group_id: direct_bioactivation_immune
  hypothesis_label: Direct bioactivation of isoniazid with an immune response
  status: CANONICAL
  description: >-
    The current account: isoniazid itself is bioactivated to a reactive
    metabolite, and in some patients that provokes an immune response. Two
    phenotypes follow - a common mild injury that resolves as immune tolerance
    develops, and an uncommon severe one carrying anti-drug and anti-CYP
    antibodies that can progress to liver failure. The clinically important
    consequence is that resolving transaminase elevation on continued treatment is
    an expected outcome rather than a paradox.
  evidence:
  - reference: PMID:26773235
    reference_title: "Mechanism of isoniazid-induced hepatotoxicity: then and now."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      more recent studies support an alternative hypothesis, specifically, that
      INH itself is directly bioactivated to a reactive metabolite, which in some
      patients leads to an immune response and liver injury
    explanation: >-
      States the superseding model: direct bioactivation of the parent drug, with
      an immune component.
  - reference: PMID:26773235
    reference_title: "Mechanism of isoniazid-induced hepatotoxicity: then and now."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Most cases involve mild liver injury, which resolves with immune tolerance,
      while other cases appear to have a more severe phenotype that is associated
      with the production of anti-drug/anti-CYP P450 antibodies and can progress
      to liver failure.
    explanation: >-
      Gives the two phenotypes and the tolerance mechanism behind the common one.
pathophysiology:
- name: Hepatic Bioactivation of Isoniazid
  description: >-
    Conversion of isoniazid to a reactive metabolite in the liver. Which species
    does the damage is the point on which the field has changed its mind, so this
    node carries both models as hypothesis groups rather than asserting one
    chemistry.
  role: trigger
  biological_scale: MOLECULAR
  conforms_to: "drug_induced_liver_injury#Reactive Drug Metabolite Formation and Hepatocellular Stress"
  evidence:
  - reference: PMID:26773235
    reference_title: "Mechanism of isoniazid-induced hepatotoxicity: then and now."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Isoniazid (INH) remains a mainstay for the treatment of tuberculosis despite
      the fact that it can cause liver failure.
    explanation: >-
      Establishes the hepatic toxicity of the drug this node bioactivates.
  - reference: PMID:41793109
    reference_title: "A Review on Isoniazid and Rifampicin-Associated Hepatotoxicity: From Metabolism to Immunity."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Isoniazid (INH) and rifampicin (RIF) are cornerstone first-line
      antituberculosis drugs, yet their clinical utility is often limited by
      drug-induced liver injury (DILI).
    explanation: >-
      Confirms hepatotoxicity as the limiting toxicity of this drug in practice.
      The source treats isoniazid together with rifampicin, whose co-administration
      it describes as potentiating the injury, so it is not evidence for isoniazid
      acting alone.
  downstream:
  - target: Hepatocyte Injury and Death
    causal_link_type: DIRECT
    hypothesis_groups:
    - acetylhydrazine_metabolic_idiosyncrasy
    - direct_bioactivation_immune
    description: >-
      The reactive metabolite injures the hepatocyte. This edge is shared by both
      hypotheses, which disagree about which metabolite it is and about whether an
      immune response follows, not about whether the hepatocyte is injured.
  - target: Immune-Mediated Amplification of Hepatic Injury
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    hypothesis_groups:
    - direct_bioactivation_immune
    description: >-
      Under the current model the reactive metabolite provokes an immune response
      in some patients. The intermediate is hapten formation on hepatic proteins.
    evidence:
    - reference: PMID:41793109
      reference_title: "A Review on Isoniazid and Rifampicin-Associated Hepatotoxicity: From Metabolism to Immunity."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Additionally, we examined immune-mediated mechanisms, including hapten
        formation, Tool-like receptor-4 (TLR4) driven innate immune responses, and
        human leukocyte antigen (HLA) associated adaptive recognition, which
        integrated with toxic insults under the dual-hit hypothesis.
      explanation: >-
        Names hapten formation and the innate and adaptive arms this edge asserts,
        under a dual-hit framing that combines them with the toxic insult.
- name: NAT2 Slow Acetylator Genotype
  description: >-
    Reduced N-acetyltransferase 2 activity, which changes how much isoniazid is
    routed down the acetylation pathway and how long the parent drug persists.
    Slow acetylators carry roughly three times the risk of anti-tuberculosis
    drug-induced liver injury. This is one of the better-quantified
    pharmacogenetic effects in clinical toxicology.
  role: modifier
  biological_scale: MOLECULAR
  evidence:
  - reference: PMID:41657030
    reference_title: "The role of NAT2 genetic variants in anti-tuberculosis drug-induced liver injury (AT-DILI): a meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Slow acetylator genotypes were significantly associated with an increased
      risk of AT-DILI (pooled OR = 3.02; 95% CI = 2.50-3.64; p < 0.001).
    explanation: >-
      Gives the pooled effect size and interval for the claim in this node's
      description.
  - reference: PMID:41657030
    reference_title: "The role of NAT2 genetic variants in anti-tuberculosis drug-induced liver injury (AT-DILI): a meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A total of 48 studies comprising 11,035 patients were included.
    explanation: >-
      Gives the size of the evidence base behind that estimate.
  downstream:
  - target: Hepatic Bioactivation of Isoniazid
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Acetylator status modifies how much reactive metabolite is generated. The
      outcome measured in the cited meta-analysis is anti-tuberculosis
      drug-induced liver injury, not metabolite concentration, so the placement of
      the effect at this node is mechanistic inference.
    evidence:
    - reference: PMID:41657030
      reference_title: "The role of NAT2 genetic variants in anti-tuberculosis drug-induced liver injury (AT-DILI): a meta-analysis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        NAT2 acetylator status was significantly associated with the likelihood of
        experiencing hepatotoxicity related to anti-tuberculosis drugs.
      explanation: >-
        States the association between acetylator status and hepatotoxicity that
        this edge places upstream of bioactivation.
  notes: >-
    The meta-analysis measures anti-tuberculosis drug-induced liver injury, which
    is the injury from a multi-drug regimen rather than from isoniazid in
    isolation. That is the outcome the clinical literature actually reports, and
    this entry does not restate it as an isoniazid-specific odds ratio.
- name: Hepatocyte Injury and Death
  description: >-
    Hepatocellular injury, showing first as transaminase elevation. Most of it is
    mild and resolves even on continued treatment, which is what the tolerance
    arm of the current model predicts.
  role: intermediate
  biological_scale: TISSUE
  conforms_to: "drug_induced_liver_injury#Hepatocyte Cell Death"
  evidence:
  - reference: PMID:26773235
    reference_title: "Mechanism of isoniazid-induced hepatotoxicity: then and now."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Most cases involve mild liver injury, which resolves with immune tolerance,
      while other cases appear to have a more severe phenotype that is associated
      with the production of anti-drug/anti-CYP P450 antibodies and can progress
      to liver failure.
    explanation: >-
      Gives both the common mild injury and the severe minority this node covers.
  downstream:
  - target: Isoniazid-Induced Liver Injury
    causal_link_type: DIRECT
    description: >-
      Accumulated hepatocyte injury becomes clinically apparent liver injury.
- name: Immune-Mediated Amplification of Hepatic Injury
  description: >-
    Innate and adaptive immune responses to drug-modified hepatic proteins. In
    most patients this resolves into tolerance. In a minority it does not, and
    those are the cases carrying anti-drug and anti-CYP antibodies that progress.
  role: intermediate
  biological_scale: TISSUE
  conforms_to: "drug_induced_liver_injury#Sterile and Immune-Mediated Inflammatory Amplification"
  evidence:
  - reference: PMID:41793109
    reference_title: "A Review on Isoniazid and Rifampicin-Associated Hepatotoxicity: From Metabolism to Immunity."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Additionally, we examined immune-mediated mechanisms, including hapten
      formation, Tool-like receptor-4 (TLR4) driven innate immune responses, and
      human leukocyte antigen (HLA) associated adaptive recognition, which
      integrated with toxic insults under the dual-hit hypothesis.
    explanation: >-
      Names the innate and adaptive components of this node.
  downstream:
  - target: Isoniazid-Induced Liver Injury
    causal_link_type: DIRECT
    hypothesis_groups:
    - direct_bioactivation_immune
    description: >-
      The immune arm determines which patients progress rather than tolerate.
- name: Isoniazid-Induced Liver Injury
  description: >-
    Clinically apparent hepatitis, occasionally progressing to acute liver
    failure. The management threshold is biochemical: treatment is interrupted at
    a transaminase elevation above three times normal with symptoms or jaundice,
    or five times normal without.
  role: outcome
  biological_scale: ORGANISM
  conforms_to: "drug_induced_liver_injury#Liver Injury and Acute Liver Failure"
  evidence:
  - reference: PMID:17021358
    reference_title: "An official ATS statement: hepatotoxicity of antituberculosis therapy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Treatment should be interrupted and, generally, a modified or alternative
      regimen used for those with ALT elevation more than three times the upper
      limit of normal (ULN) in the presence of hepatitis symptoms and/or jaundice,
      or five times the ULN in the absence of symptoms.
    explanation: >-
      Gives the ATS interruption thresholds quoted in this node's description.
  - reference: PMID:17021358
    reference_title: "An official ATS statement: hepatotoxicity of antituberculosis therapy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Knowledge of the metabolism of anti-TB medications and of the mechanisms of
      TB DILI is incomplete.
    explanation: >-
      The official statement's own assessment of how well this mechanism is
      understood, which is why this entry carries two hypothesis groups rather
      than one settled chain.
  downstream:
  - target: Elevated circulating hepatic transaminase concentration
    causal_link_type: DIRECT
    description: >-
      The biochemical readout, and the one that is monitored.
  - target: Jaundice
    causal_link_type: DIRECT
    description: >-
      Appears in more advanced injury and lowers the interruption threshold.
  - target: Decreased liver function
    causal_link_type: DIRECT
    description: >-
      The severe minority phenotype, progressing toward failure.
- name: Functional Pyridoxine Deficiency
  description: >-
    Depletion of usable vitamin B6. Isoniazid is a hydrazide and reacts with
    pyridoxal, and the result is that the patient has a deficiency of the cofactor
    rather than a poison in the nerve. Everything downstream of this node is an
    enzyme failing for want of pyridoxal 5-phosphate, which is why one node
    supplies two clinically unrelated syndromes on two different timescales, and
    why one vitamin treats both.
  role: central_effector
  biological_scale: MOLECULAR
  evidence:
  - reference: PMID:29897291
    reference_title: "Isoniazid-induced neuropathy in a pre-pubertal child."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      INH leads to peripheral neuritis by causing a deficiency in the serum level
      of pyridoxine which depends on the dose of INH, duration of treatment and
      the patient's nutritional and acetylator status.
    explanation: >-
      States that the drug produces a pyridoxine deficiency and that this is how
      the neuritis arises, which is the whole basis of this node.
  - reference: PMID:15756083
    reference_title: "Pyridoxine in clinical toxicology: a review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Pyridoxine (vitamin B6) is a co-factor in many enzymatic pathways involved
      in amino acid metabolism: the main biologically active form is pyridoxal
      5-phosphate.
    explanation: >-
      Establishes pyridoxal 5-phosphate as the active cofactor whose loss this
      node describes, and that it serves many pathways - which is why one
      deficiency has several consequences.
  - reference: PMID:15756083
    reference_title: "Pyridoxine in clinical toxicology: a review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Pyridoxine has been used as an antidote in acute intoxications, including
      isoniazid overdose, Gyromitra mushroom or false morrel (monomethylhydrazine)
      poisoning and hydrazine exposure.
    explanation: >-
      Places isoniazid alongside monomethylhydrazine and hydrazine as poisonings
      answered by the same vitamin, which is the shared hydrazide chemistry this
      node rests on. The source states the antidotal use, not the chemical
      reaction.
  - reference: PMID:9354586
    reference_title: "Mechanisms of the inhibition of human erythrocyte pyridoxal kinase by drugs."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The second group, which included cycloserine, dopamine, isoniazid, and
      thiamphenicol glycinate, inhibited PLK using PL, but not PM, as substrate.
    explanation: >-
      Places isoniazid among the drugs that inhibit pyridoxal kinase, the enzyme
      that makes the active cofactor. Erythrocyte enzyme in vitro.
  - reference: PMID:9354586
    reference_title: "Mechanisms of the inhibition of human erythrocyte pyridoxal kinase by drugs."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      They were able to react with PL or PLP to form covalent complexes, and
      kinetic studies suggested that the observed PLK inhibition was due to these
      formed complexes.
    explanation: >-
      Gives both chemical steps and their order: covalent reaction with pyridoxal
      and its phosphate, with the kinase inhibition following from the complexes
      rather than occurring independently. The attribution is what the kinetics
      suggested, in the authors' own hedge.
  downstream:
  - target: Peripheral Nerve Deprivation of Pyridoxal Phosphate
    causal_link_type: DIRECT
    description: >-
      The slow arm. Months of treatment at ordinary doses deplete the cofactor
      enough to affect peripheral nerve.
  - target: Impaired GABA Synthesis
    causal_link_type: DIRECT
    description: >-
      The fast arm. A single large ingestion depletes the cofactor acutely, and
      the enzyme that fails first is the one making the brain's main inhibitory
      transmitter.
  notes: >-
    The two chemical steps are curated in the order the cited kinetic work
    supports, which is not the order usually given. Isoniazid reacts with
    pyridoxal and pyridoxal 5-phosphate to form covalent complexes, and the
    inhibition of pyridoxal kinase follows from those complexes rather than
    running beside them. Secondary accounts often present covalent trapping and
    kinase inhibition as two parallel mechanisms; the source cited here reports
    them as sequential. The work is in vitro, on non-purified erythrocyte enzyme,
    and isoniazid is one of several drugs examined - it is not a study of
    isoniazid toxicity in patients.
- name: Peripheral Nerve Deprivation of Pyridoxal Phosphate
  description: >-
    Peripheral nerve deprived of the cofactor. The insult that reaches the neuron
    here is a nutritional one, which is unlike most of the toxic neuropathies -
    nothing is accumulating in the nerve, something is missing from it. Risk
    tracks the things that lower B6 reserve to begin with: malnutrition,
    alcoholism, and slow acetylation.
  role: intermediate
  biological_scale: CELLULAR
  conforms_to: "peripheral_axonal_degeneration#Insult to Peripheral Neurons and Schwann Cells"
  evidence:
  - reference: PMID:29897291
    reference_title: "Isoniazid-induced neuropathy in a pre-pubertal child."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Isoniazid (INH)-induced peripheral neuritis is not uncommonly reported in
      adults, especially those with malnutrition and alcoholism, but it is very
      rare in children.
    explanation: >-
      Names the nutritional risk factors this node describes, and the age
      distribution.
  downstream:
  - target: Isoniazid-Induced Peripheral Neuropathy
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Cofactor deprivation produces the clinical neuropathy. The intervening
      cellular steps are not established by the sources cited here.
  notes: >-
    Conformance is asserted at the module's insult node because that is where an
    injury to peripheral neurons belongs, but the fit is unusual and worth
    flagging: the module's insult is something done to the nerve, and this one is
    something withheld from it. This entry does not conform to the module's
    "Distal Axonal Degeneration and Demyelination" node. Isoniazid neuropathy is
    conventionally described as a distal axonopathy, but the sources cited here
    do not report fibre pathology - the one case they describe had normal nerve
    conduction velocity - and a conformance would be asserting more than they say.
- name: Isoniazid-Induced Peripheral Neuropathy
  description: >-
    Distal sensory symptoms appearing over months of treatment. It is preventable
    and reversible: pyridoxine prophylaxis is recommended for those at risk, and
    symptoms resolve when the deficiency is corrected.
  role: outcome
  biological_scale: ORGANISM
  conforms_to: "peripheral_axonal_degeneration#Peripheral Neuropathy"
  evidence:
  - reference: PMID:29897291
    reference_title: "Isoniazid-induced neuropathy in a pre-pubertal child."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the World Health Organization recommends pyridoxine prophylaxis for children
      on INH who are malnourished or have HIV infection
    explanation: >-
      Establishes the prophylaxis recommendation and the risk groups it targets.
      The recommendation quoted is for children specifically.
  downstream:
  - target: Peripheral neuropathy
    causal_link_type: DIRECT
    description: >-
      The clinical readout of the slow B6 arm.
- name: Impaired GABA Synthesis
  description: >-
    Failure to make gamma-aminobutyric acid, because the enzyme that makes it
    requires pyridoxal 5-phosphate. This is what turns an overdose into a seizure
    that ordinary anticonvulsants cannot hold: the drugs that potentiate GABA
    signalling need GABA to potentiate, and there is not enough of it.
  role: intermediate
  biological_scale: CELLULAR
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Excitation-Inhibition Imbalance"
  evidence:
  - reference: PMID:17535059
    reference_title: "Isoniazid overdose : a case series, literature review and survey of antidote availability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The seizures are often refractory to traditional antiepileptics.
    explanation: >-
      Records the refractoriness this node explains. The source states the
      clinical observation; it does not itself state the GABA-synthesis mechanism,
      and the inference from one to the other is this entry's.
  downstream:
  - target: Isoniazid Overdose Seizures
    causal_link_type: DIRECT
    description: >-
      Loss of inhibitory transmission generates the seizures.
  notes: >-
    Conformance to the module's excitation-inhibition node is the right level for
    this claim, and this entry deliberately stops there. It does not conform to
    the module's "Recurrent Unprovoked Seizures" outcome, because isoniazid
    seizures are provoked by definition and stop when the drug is cleared and the
    cofactor is replaced. Unprovoked recurrence is what that node means, and
    asserting it here would turn a poisoning into an epilepsy.


    The specific enzyme - glutamate decarboxylase - is named in the standard
    account but is not stated by any source cited in this entry, so this node
    refers to GABA synthesis rather than naming the enzyme.
- name: Isoniazid Overdose Seizures
  description: >-
    Generalised seizures in acute overdose, resistant to standard treatment
    because the deficit is upstream of the receptors those drugs act on.
    Clinically they arrive as part of a triad with coma and metabolic acidosis.
  role: outcome
  biological_scale: ORGANISM
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Seizure Generation and Epileptogenesis"
  evidence:
  - reference: PMID:17535059
    reference_title: "Isoniazid overdose : a case series, literature review and survey of antidote availability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Isoniazid toxicity produces a triad of coma, metabolic acidosis and
      seizures.
    explanation: >-
      Gives the triad this node is named for.
  - reference: PMID:8522667
    reference_title: "Isoniazid overdose: four case reports and review of the literature."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Patients with INH overdose may present with nausea, vomiting, ataxia,
      symptoms reminiscent of atropine intoxication, coma and grand mal seizures.
    explanation: >-
      Gives the fuller presentation, including the early gastrointestinal and
      cerebellar features that precede the seizures.
  - reference: PMID:8522667
    reference_title: "Isoniazid overdose: four case reports and review of the literature."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      INH overdose should be suspected in any patient presenting with seizures and
      metabolic acidosis.
    explanation: >-
      States the diagnostic pairing, which is what makes this syndrome
      recognisable before an ingestion history is available.
  downstream:
  - target: Lactic Acidosis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Sustained convulsive activity is followed by a lactic acidosis. The
      intermediate usually given is lactate generated by the seizing muscle, and
      the sources cited here report the acidosis without assigning its origin, so
      the edge is recorded as indirect rather than as a measured production step.
    evidence:
    - reference: PMID:8522667
      reference_title: "Isoniazid overdose: four case reports and review of the literature."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Lactic acidosis is revealed by laboratory evaluation.
      explanation: >-
        Establishes the lactic acidosis as a laboratory finding in this poisoning.
        The source states its presence, not that seizure activity produces it.
  - target: Seizure
    causal_link_type: DIRECT
    description: >-
      The clinical readout of the fast B6 arm.
  - target: Coma
    causal_link_type: DIRECT
    description: >-
      Part of the overdose triad, alongside the seizures.
  - target: Nausea
    causal_link_type: DIRECT
    description: >-
      Early gastrointestinal feature, preceding the seizures.
  - target: Vomiting
    causal_link_type: DIRECT
    description: >-
      Early gastrointestinal feature, preceding the seizures.
  - target: Ataxia
    causal_link_type: DIRECT
    description: >-
      Early cerebellar sign, preceding the seizures.
- name: Lactic Acidosis
  description: >-
    Lactic acidosis in acute overdose. It is separated from the seizure node
    because the entry treats it as a consequence of the seizing rather than as a
    parallel toxicity, and because that causal claim is weaker than the seizure
    claim and should be visible as its own step.
  role: outcome
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:8522667
    reference_title: "Isoniazid overdose: four case reports and review of the literature."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      INH overdose should be suspected in any patient presenting with seizures and
      metabolic acidosis.
    explanation: >-
      Pairs the acidosis with the seizures as the recognisable presentation, which
      is the diagnostic value of this node.
  downstream:
  - target: Metabolic acidosis
    causal_link_type: DIRECT
    description: >-
      The acidosis as measured clinically.
genetic:
- name: NAT2
  gene_term:
    preferred_term: NAT2
    term:
      id: hgnc:7646
      label: NAT2
  relationship_type: SUSCEPTIBILITY
  notes: >-
    Slow acetylator genotypes carry about three times the risk of
    anti-tuberculosis drug-induced liver injury in a meta-analysis of 48 studies
    and 11,035 patients. Acetylator status also appears in the neuropathy
    literature as a factor in how much pyridoxine deficiency develops, so this
    gene modifies both of the entry's major arms rather than only the hepatic one.


    The allele-level picture is not the phenotype-level one. A trans-ethnic GWAS
    found NAT2*5 LESS frequent in cases while NAT2*6 and NAT2*7 homozygotes were
    enriched, and its authors call the NAT2 contribution complex rather than
    simply dose-dependent on acetylator speed. Both statements are curated here
    because a reader taking only the pooled odds ratio would infer that every
    slow-acetylator allele carries the same risk, and this study says otherwise.
  evidence:
  - reference: PMID:41657030

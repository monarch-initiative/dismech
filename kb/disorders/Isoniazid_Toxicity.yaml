  evidence:
  - reference: PMID:17021358
    reference_title: "An official ATS statement: hepatotoxicity of antituberculosis therapy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      During treatment of latent TB infection (LTBI) alanine aminotransferase

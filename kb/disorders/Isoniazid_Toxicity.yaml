    treatment_effect: INHIBITS
    description: >-
      Stopping the drug removes the substrate at the head of the hepatic arm.
    evidence:
    - reference: PMID:17021358
      reference_title: "An official ATS statement: hepatotoxicity of antituberculosis therapy."

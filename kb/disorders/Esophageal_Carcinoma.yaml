- accession: geo:GSE312063
  title: Characterization of esophageal squamous cell carcinoma cell lines sensitivity to Palbociclib
  description: 'Background: Esophageal squamous cell carcinoma (eSCC) is a highly aggressive malignancy with poor prognosis and limited therapeutic options. Although immune checkpoint inhibitors such as nivolumab, have shown clinical benefit, particularly in patients with high PD-L1 expression, this subgroup represents only a small fraction of eSCC cases. CDK4/6 inhibitors such as palbociclib have only been tested as second-line agents in eSCC, often in combination with EGFR inhibitors, with minimal benefit. Methods: Our study evaluates palbociclib as a first-line therapy in treatment-naive eSCC models. Using a panel of 22 eSCC cell lines with integrated multi-omics and phenotypic assays.'

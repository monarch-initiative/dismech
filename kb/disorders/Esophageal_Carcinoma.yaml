datasets:
- accession: geo:GSE203067
  title: Single-Cell Transcriptomic Analysis of Primary and Metastatic Tumor Ecosystems in Esophageal Squamous Cell Carcinoma
  description: We profiled the transcriptome of 85, 263 single cells from ESCC patients with lymph node metastasis (LNM) and clustered 7, 196 myeloid cells into 18 subclusters including nine for macrophage cells, one for neutrophils, two for monocytes, two for mast cells, one for tolerogenic dendritic cells, one for plasmacytoid dendritic cells and two for conventional dendritic cells. In this study, we not only provides a high-resolution landscape of the tumor, immune and stromal compartments in metastatic lymph node, but also highlights metastatic-specific patterns comparing with primary tumor.

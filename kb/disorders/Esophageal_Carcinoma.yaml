- accession: geo:GSE225178
  title: Association of immune related expression profile with sensitivity to neoadjuvant chemotherapy using docetaxel, cisplatin and 5-fluorouracil in esophageal squamous cell carcinoma.
  description: Neoadjuvant chemotherapy (NAC) followed by surgery is one of the standard therapeutic approaches for patients with locally advanced esophageal carcinoma in Japan. Recently, JCOG1109 study revealed that NAC with docetaxel, cisplatin and 5-fluorouracil (5-FU) (DCF-NAC) is superior to NAC with cisplatin and 5-FU, and has become the standard preoperative chemotherapy. By using microarray, we have previously investigated expression profiles of endoscopic biopsies of patients with esophageal squamous cell carcinoma (ESCC) before DCF-NAC (preNAC) and identified 17 molecules as predictive biomarkers for pathologically complete response to DCF-NAC.

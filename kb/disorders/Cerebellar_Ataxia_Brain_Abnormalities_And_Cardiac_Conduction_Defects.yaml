name: cerebellar ataxia, brain abnormalities, and cardiac conduction defects
creation_date: "2026-10-12T13:10:00Z"
category: Mendelian
synonyms:
- CABAC syndrome
- EXOSC5-related disease
- EXOSC5-related neurodevelopmental disorder with or without thrombotic microangiopathy
- neurodevelopmental delay-hypotonia-cerebellar ataxia-cardiac conduction defects syndrome
disease_term:
  preferred_term: cerebellar ataxia, brain abnormalities, and cardiac conduction defects
  term:
    id: MONDO:0859200
    label: cerebellar ataxia, brain abnormalities, and cardiac conduction defects
parents:
- Mendelian neurodevelopmental disorder
- autosomal recessive cerebellar ataxia
- RNA exosomopathy
description: >-
  Cerebellar ataxia, brain abnormalities, and cardiac conduction defects (CABAC
  syndrome) is a rare autosomal recessive neurodevelopmental disorder caused by
  biallelic variants in EXOSC5, which encodes a structural subunit of the RNA
  exosome. Reported patients present in infancy with hypotonia, global
  developmental delay affecting motor skills, failure to thrive, short stature,
  feeding difficulties and esotropia, and brain MRI shows cerebellar hypoplasia
  or atrophy, pontocerebellar hypoplasia, ventriculomegaly and hypomyelination.
  A distinctive feature in a subset of patients is progressive cardiac
  conduction and rhythm disease (complete heart block, sinus node dysfunction,
  atrioventricular block and ventricular tachycardia) with a recognized risk of
  sudden cardiac death; cardiac involvement is variable and has been absent in
  some patients. Renal thrombotic microangiopathy after a viral trigger has
  been reported in one patient and is now recognized across RNA-exosome
  disorders. EXOSC5 is one of several RNA-exosome subunit genes (EXOSC2,
  EXOSC3, EXOSC8, EXOSC9) linked to Mendelian neurodegenerative disease, and
  the literature on CABAC remains small (about ten reported patients). Disease
  mechanism appears to vary with the specific pathogenic variant.
inheritance:
- name: Autosomal recessive inheritance
  description: >-
    CABAC syndrome is inherited in an autosomal recessive manner. Affected
    individuals carry biallelic EXOSC5 variants (homozygous in consanguineous
    families, or compound heterozygous), and unaffected parents are
    heterozygous carriers.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:34089229
    reference_title: Risk of sudden cardiac death in EXOSC5-related disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "More recently, EXOSC5 (MIM *606492) was found to underlie an autosomal recessive neurodevelopmental disorder characterized by developmental delay, hypotonia, cerebellar abnormalities, and dysmorphic facies."
    explanation: States that EXOSC5-related disease is an autosomal recessive neurodevelopmental disorder.
  - reference: PMID:39062862
    reference_title: Mutations in Genes Encoding Subunits of the RNA Exosome as a Potential Novel Cause of Thrombotic Microangiopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the parents were consanguineous (of Syrian descent) and both heterozygous carriers of this EXOSC5 variant."
    explanation: Documents recessive transmission with heterozygous carrier parents in a consanguineous family.
pathophysiology:
- name: EXOSC5 Subunit Dysfunction
  biological_scale: MOLECULAR
  description: >-
    Biallelic EXOSC5 variants (recurrent hypomorphic missense such as
    p.Thr114Ile plus null alleles including intragenic deletions and
    frameshifts) alter EXOSC5, a structural subunit of the RNA exosome. Some
    variants reduce RNA exosome function and alter interactions with other
    exosome subunits; the Slavotinek study concludes that disease mechanism
    varies with the specific variant.
  genes:
  - preferred_term: EXOSC5
    term:
      id: hgnc:24662
      label: EXOSC5
  molecular_functions:
  - preferred_term: RNA exosome 3' to 5' exoribonuclease activity
    modifier: DECREASED
    term:
      id: GO:0000175
      label: 3'-5'-RNA exonuclease activity
  evidence:
  - reference: PMID:32504085
    reference_title: "Biallelic variants in the RNA exosome gene EXOSC5 are associated with developmental delays, short stature, cerebellar hypoplasia and motor weakness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified five patients with biallelic variants in EXOSC5, which encodes a structural subunit of the RNA exosome."
    explanation: Establishes EXOSC5 as a structural RNA-exosome subunit altered by biallelic disease variants.
  - reference: PMID:32504085
    reference_title: "Biallelic variants in the RNA exosome gene EXOSC5 are associated with developmental delays, short stature, cerebellar hypoplasia and motor weakness."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Some of these variants cause defects in RNA exosome function as well as altered interactions with other RNA exosome subunits."
    explanation: Yeast and mammalian-cell modeling shows pathogenic variants impair exosome function and subunit interactions.
  downstream:
  - target: Impaired RNA Exosome-Mediated RNA Processing and Degradation
    causal_link_type: DIRECT
    description: >-
      Loss or reduction of the EXOSC5 structural subunit impairs the RNA
      exosome's 3' to 5' processing and degradation of coding and non-coding
      RNA.
    evidence:
    - reference: PMID:32504085
      reference_title: "Biallelic variants in the RNA exosome gene EXOSC5 are associated with developmental delays, short stature, cerebellar hypoplasia and motor weakness."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Some of these variants cause defects in RNA exosome function as well as altered interactions with other RNA exosome subunits."
      explanation: Links the subunit defect to impaired RNA exosome function.
- name: Impaired RNA Exosome-Mediated RNA Processing and Degradation
  biological_scale: MOLECULAR
  description: >-
    The RNA exosome is an essential ribonuclease complex required for
    processing and degradation of coding and non-coding RNA; reduced EXOSC5
    function impairs this activity. The specific RNA targets and the basis for
    selective tissue vulnerability are not established.
  biological_processes:
  - preferred_term: RNA processing and degradation
    modifier: DECREASED
    term:

references:
- reference: PMID:32504085
  title: "Biallelic variants in the RNA exosome gene EXOSC5 are associated with developmental delays, short stature, cerebellar hypoplasia and motor weakness."
- reference: PMID:34089229
  title: Risk of sudden cardiac death in EXOSC5-related disease.
- reference: PMID:39062862
  title: Mutations in Genes Encoding Subunits of the RNA Exosome as a Potential Novel Cause of Thrombotic Microangiopathy.
notes: >-
  CABAC syndrome is a single-gene (EXOSC5) autosomal recessive RNA
  exosomopathy and is curated as one leaf disease with a single conserved
  pathograph; the EXOSC2/EXOSC3/EXOSC8/EXOSC9 disorders are distinct diseases
  kept as differentials rather than lumped. Cardiac conduction disease is a
  distinctive but variable feature (absent on repeated evaluation in the
  EXOSC5 thrombotic-microangiopathy patient). Renal thrombotic microangiopathy
  and the ribosome/endothelial-apoptosis mechanism are hypothesized from a
  single case and background exosome biology, and are marked as inferred.

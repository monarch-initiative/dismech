animal_models:
- name: exosc5 loss-of-function zebrafish
  species: zebrafish
  description: >-
    Zebrafish exosc5 loss of function produces shortened and curved
    tails/bodies, reduced eye and head size and edema, used to test the
    requirement for EXOSC5 in development and brain growth.
  publication: PMID:32504085
  modeled_mechanisms:
  - target: Cerebellar and Pontine Hypoplasia
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      Loss of exosc5 reduces head and eye size, modeling impaired brain growth;
      it does not reproduce the specific human cerebellar/pontine hypoplasia or
      the cardiac phenotype.
    limitations: >-
      Zebrafish crispants are mosaic and reflect acute knockdown rather than the
      constitutional biallelic hypomorphic state; the readout is a global
      reduction in head/eye size rather than isolated cerebellar or pontine
      hypoplasia, and no cardiac phenotype was reported.
    readouts:
    - name: Head and eye size
      target: Cerebellar and Pontine Hypoplasia
      direction: DECREASED
      interpretation: Reduced head and eye size is the structural correlate of impaired brain growth in this model.
      evidence:
      - reference: PMID:32504085
        reference_title: "Biallelic variants in the RNA exosome gene EXOSC5 are associated with developmental delays, short stature, cerebellar hypoplasia and motor weakness."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Loss of function for exosc5 in zebrafish results in shortened and curved tails/bodies, reduced eye/head size and edema."
        explanation: Reports the reduced head/eye size measured in the exosc5 loss-of-function model.
    evidence:
    - reference: PMID:32504085
      reference_title: "Biallelic variants in the RNA exosome gene EXOSC5 are associated with developmental delays, short stature, cerebellar hypoplasia and motor weakness."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Loss of function for exosc5 in zebrafish results in shortened and curved tails/bodies, reduced eye/head size and edema."
      explanation: Supports treating the exosc5 zebrafish as informative for the requirement of EXOSC5 in brain development.

- name: Impaired Ribosome Assembly
  biological_scale: CELLULAR
  description: >-
    Because the RNA exosome is required for ribosome assembly, exosome
    dysfunction is proposed to impair ribosome production; altered ribosome
    production could lead to cell cycle arrest and apoptosis. This step is
    hypothesized rather than demonstrated in affected tissue.
  biological_processes:
  - preferred_term: ribosome biogenesis
    modifier: DECREASED
    term:
      id: GO:0042254
      label: ribosome biogenesis
  evidence:
  - reference: PMID:39062862
    reference_title: Mutations in Genes Encoding Subunits of the RNA Exosome as a Potential Novel Cause of Thrombotic Microangiopathy.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "Alterations in ribosome production could ultimately lead to cell cycle arrest and apoptosis"
    explanation: States the proposed link from impaired ribosome production to apoptosis.
  downstream:
  - target: Endothelial Apoptosis and Thrombotic Microangiopathy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      It is hypothesized that defective processing of RNA induces ribosomal
      dysfunction in endothelial cells, leading to apoptosis and the cascade
      that produces thrombotic microangiopathy, typically after a viral
      trigger.
    evidence:
    - reference: PMID:39062862
      reference_title: Mutations in Genes Encoding Subunits of the RNA Exosome as a Potential Novel Cause of Thrombotic Microangiopathy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "It is hypothesized that infection causes an accumulation of viral RNA or defective processing of (viral) RNA in the cell, inducing ribosomal dysfunction in the endothelial cells resulting in apoptosis, and consequently leading to the cascade resulting in TMA"
      explanation: States the hypothesized endothelial mechanism linking the RNA exosome defect to thrombotic microangiopathy.
- name: Endothelial Apoptosis and Thrombotic Microangiopathy
  biological_scale: CELLULAR

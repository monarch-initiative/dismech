genetic:
- name: EXOSC5 variants
  gene_term:
    preferred_term: EXOSC5
    term:
      id: hgnc:24662
      label: EXOSC5
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Biallelic EXOSC5 variants cause CABAC syndrome. The recurrent missense
    allele p.Thr114Ile (c.341C>T, NM_020158.4) is carried by most patients with
    conduction disease and is seen compound heterozygous with null alleles or
    with other missense variants; homozygous missense (p.Leu206His,
    p.Met148Thr), an in-frame single-codon deletion (p.Glu77del) and null
    alleles (an exon 5-6 deletion and an early frameshift) are also reported.
    Slavotinek et al. conclude that disease mechanism varies with the specific
    variant. No ClinGen gene-disease validity (CGGV) record for EXOSC5 is cached
    in this repository, so gene_disease_validity is omitted; GenCC lists the
    gene-disease relationship as Strong (autosomal recessive).
  variants:
  - name: p.Thr114Ile (c.341C>T)
    description: >-
      Recurrent pathogenic missense variant (NM_020158.4:c.341C>T, p.Thr114Ile),
      seen compound heterozygous with an exon 5-6 deletion, with an early
      frameshift, and with p.Thr101Lys, and associated with cardiac conduction
      disease.
    evidence:
    - reference: PMID:34089229
      reference_title: Risk of sudden cardiac death in EXOSC5-related disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "NM_020158.4:c.341C > T (p.Thr114Ile; pathogenic, previously reported)"
      explanation: Reports the recurrent pathogenic p.Thr114Ile allele.
  - name: p.Thr101Lys (c.302C>A)
    description: Novel missense variant (NM_020158.4:c.302C>A, p.Thr101Lys) found in trans with p.Thr114Ile in two affected siblings.
    evidence:
    - reference: PMID:34089229
      reference_title: Risk of sudden cardiac death in EXOSC5-related disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "NM_020158.4:c.302C > A (p.Thr101Lys; novel variant)"
      explanation: Reports the novel p.Thr101Lys allele.
  - name: Homozygous and null alleles
    description: >-
      Additional biallelic genotypes include homozygous p.Leu206His, homozygous
      p.Met148Thr (via paternal chromosome 19 isodisomy), an exon 5-6 deletion
      and an early frameshift in trans with p.Thr114Ile.
    evidence:
    - reference: PMID:32504085
      reference_title: "Biallelic variants in the RNA exosome gene EXOSC5 are associated with developmental delays, short stature, cerebellar hypoplasia and motor weakness."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The first patient had a deletion involving exons 5-6 of EXOSC5 and a missense variant, p.Thr114Ile, that were inherited in trans, the second patient was homozygous for p.Leu206His and the third patient had paternal isodisomy for chromosome 19 and was homozygous for p.Met148Thr."
      explanation: Reports the homozygous missense, isodisomy, and null genotypes.
  - name: p.Glu77del (c.230_232del)
    description: >-
      Homozygous in-frame single-codon deletion (NM_020158.4:c.230_232del,
      p.Glu77del) in the exoribonuclease phosphorolytic domain, reported in a
      consanguineous patient with CABAC syndrome and renal thrombotic
      microangiopathy.
    evidence:
    - reference: PMID:39062862
      reference_title: Mutations in Genes Encoding Subunits of the RNA Exosome as a Potential Novel Cause of Thrombotic Microangiopathy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Genetic diagnostics revealed a homozygous mutation in the EXOSC5 gene (c.230_232del and p.Glu77del)"
      explanation: Reports the homozygous in-frame p.Glu77del allele.
  evidence:
  - reference: PMID:32504085
    reference_title: "Biallelic variants in the RNA exosome gene EXOSC5 are associated with developmental delays, short stature, cerebellar hypoplasia and motor weakness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified five patients with biallelic variants in EXOSC5, which encodes a structural subunit of the RNA exosome."
    explanation: Establishes EXOSC5 as the causative gene with a recessive, biallelic mechanism.

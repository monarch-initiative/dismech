    reference_title: "The prevalence and clinical features of MYO7A-related hearing loss including DFNA11, DFNB2 and USH1B."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In the inner ear, Myosin 7a forms a tripartite complex with SANS and Harmonin, and plays a crucial role in mechano-electro transduction in stereocilia, helps to maintain the mechanical tension across cadherin links and transports proteins components to the tip of stereocilia6,7."
    explanation: Defines the normal hair-cell function whose disruption produces the phenotype.
  - reference: PMID:38594301
    reference_title: "The prevalence and clinical features of MYO7A-related hearing loss including DFNA11, DFNB2 and USH1B."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "It is essential to the maintenance of hair cell stereocilia bundles and loss of this function is known to cause disorganized stereocilia and HL."
    explanation: Links loss of myosin VIIa function to stereocilia disorganisation and hearing loss.
  - reference: PMID:32350269
    reference_title: "Myosin-VIIa is expressed in multiple isoforms and essential for tensioning the hair cell mechanotransduction complex."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "IHCs of Myo7a-ΔC mice undergo normal development, but exhibit reduced resting open probability and slowed onset of MET currents, consistent with MYO7A's proposed role in tensioning the tip link."
    explanation: >-
      Direct measurement of the tensioning function, replacing an inference drawn from a
      cohort paper's introduction. Reduced resting open probability and slowed MET current
      onset are what "loss of tension across the tip link" looks like electrophysiologically.
  - reference: PMID:32350269
    reference_title: "Myosin-VIIa is expressed in multiple isoforms and essential for tensioning the hair cell mechanotransduction complex."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mature IHCs of Myo7a-ΔC mice degenerate over time, giving rise to progressive hearing loss."
    explanation: >-
      The temporal claim this node makes, measured rather than assumed: hair cells develop
      normally and then degenerate, which is why the human course is progressive rather
      than congenital.
  - reference: PMID:32350269
    reference_title: "Myosin-VIIa is expressed in multiple isoforms and essential for tensioning the hair cell mechanotransduction complex."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "MYO7A is proposed to function as a motor that tensions the hair cell mechanotransduction (MET) complex, but conclusive evidence is lacking."
    explanation: >-

name: Autosomal Dominant Nonsyndromic Hearing Loss 11
category: Mendelian
creation_date: "2026-08-27T00:00:00Z"
synonyms:
- DFNA11
- MYO7A-related autosomal dominant nonsyndromic hearing loss
- Deafness, autosomal dominant 11
- Nonsyndromic hearing loss, autosomal dominant 11
description: >-
  DFNA11 is the autosomal dominant, hearing-only form of MYO7A disease. MYO7A encodes
  myosin VIIa, an unconventional motor that in hair cells forms a tripartite complex with
  SANS and harmonin, maintains mechanical tension across cadherin links, and transports
  protein components to the stereocilia tip.

  What makes this entry worth curating separately from Usher syndrome is that MYO7A is an
  allelic series in which the *type* of allele, not merely its severity, determines the
  disease. Biallelic MYO7A loss causes Usher syndrome type 1B - congenital profound
  deafness with retinitis pigmentosa and vestibular areflexia - or, in the hearing-only
  recessive form, DFNB2. Heterozygous DFNA11 alleles cause the mildest MYO7A phenotype:
  postlingual, gradually progressive moderate hearing loss with asymptomatic vestibular
  dysfunction and no retinal degeneration.

  The genetics of a 10,042-patient cohort make the allele-type distinction concrete. Every
  variant found in autosomal dominant cases was missense or in-frame deletion, while
  almost half of Usher syndrome patients carried biallelic null variants. Dominant disease
  therefore does not arise from haploinsufficiency - if it did, null alleles would appear
  among the dominant cases and they do not.

  The mechanistic explanation that has emerged is gain of function. Myosin VIIa is
  autoregulated through specific IQ motifs in its lever arm, and many reported DFNA11
  mutations *activate* motor-dependent targeting of Myo7A in cultured cells, which the
  authors offer as the explanation for the dominant inheritance. This sits coherently
  alongside the earlier finding that a DFNA11 mutation in IQ5 disrupts calmodulin binding,
  since calmodulin occupancy of the IQ motifs is what holds the motor in check - though
  note that the earlier study framed its own result as impaired adaptation rather than as
  de-repression, so the unified reading is an interpretation of the two together and not a
  claim either paper makes.
disease_term:
  preferred_term: autosomal dominant nonsyndromic hearing loss 11
  term:
    id: MONDO:0011032
    label: autosomal dominant nonsyndromic hearing loss 11
parents:
- Autosomal Dominant Nonsyndromic Hearing Loss
inheritance:
- name: Autosomal dominant
  description: >-
    Heterozygous MYO7A missense or in-frame deletion variants, cosegregating with hearing
    loss across multigenerational pedigrees. The absence of null alleles among dominant
    cases is the key observation: it argues against haploinsufficiency and for a
    gain-of-function or dominant-negative mechanism.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:38594301
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All variants identified in autosomal dominant cases were missense or in-frame deletion variants."
    explanation: >-
      The allele-type restriction in dominant cases - no nulls - which is the genetic
      argument against haploinsufficiency.
  - reference: PMID:29400105
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This mutation co-segregated with hearing loss in this family. No mutation of MYO7A gene was found in the 151 controls."
    explanation: Cosegregation with control-population absence in a large multigenerational pedigree.
pathophysiology:
- name: Heterozygous MYO7A Missense Variant
  description: >-
    DFNA11 alleles are missense changes or in-frame deletions, never nulls. They fall in
    two functional regions: the motor head domain, and the IQ motifs of the lever arm that
    bind calmodulin. Only 35 of the 882 reported MYO7A variants are causative for autosomal
    dominant nonsyndromic hearing loss, so the dominant alleles are a small and
    structurally constrained subset of the gene's variation.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: MYO7A
    term:
      id: hgnc:7606
      label: MYO7A
  downstream:
  - target: Loss of IQ-Motif Autoregulation
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:38594301
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most of the reported variants were identified as genetic causes for Usher syndrome, with only 35 variants reported as causative for ADNSHL and only 49 variants reported as causative for ARNSHL11."
    explanation: Quantifies how small a subset of MYO7A variation causes dominant disease.
  - reference: PMID:16449806
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sequencing of the MYO7A gene in the linked region identified a new missense mutation resulting in an Ala230Val change in the motor domain of the myosin VIIA."
    explanation: An example of the motor-domain allele class.
  - reference: PMID:15300860
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a novel heterozygous missense mutation (c.2557C>T; p.R853C) in a family with autosomal dominant non-syndromic hearing loss that changes an evolutionarily invariant residue of the fifth IQ motif (IQ5), a putative calmodulin (CaM) binding domain, of MYO7A."
    explanation: An example of the IQ-motif allele class, at an invariant residue.
- name: Loss of IQ-Motif Autoregulation
  description: >-
    Myosin VIIa's motor activity is held in check by specific IQ motifs within its lever
    arm, and this regulation can operate at least partly independently of the tail. A
    DFNA11 mutation at an invariant residue of IQ5 abolishes constitutive calmodulin
    binding to that motif across all physiologically relevant calcium concentrations.

    Reading the two lines together, the most economical account is that calmodulin
    occupancy of the IQ motifs is the brake, and DFNA11 alleles release it. State the
    caveat plainly though: the calmodulin study interpreted its own finding as impaired
    adaptation to environmental stimuli, not as de-repression of the motor. The
    reconciliation is an interpretation across two papers, not a claim either makes.
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: calmodulin binding
    modifier: DECREASED
    term:
      id: GO:0005516
      label: calmodulin binding
  downstream:
  - target: Constitutive Myosin VIIa Motor Activation
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:39345484
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our findings reveal that Myo7A is regulated by specific IQ motifs within its lever arm, and that this regulation can function at least partially independent of its tail sequence."
    explanation: Establishes the IQ motifs of the lever arm as the autoregulatory element.
  - reference: PMID:15300860
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "analysis of calmodulin-dependent vasoconstriction suggests constitutive binding of CaM to the wildtype, but not the p.R853C-mutated IQ5 motif at all physiologically relevant Ca2+ concentrations"
    explanation: Demonstrates that a DFNA11 allele abolishes calmodulin binding to IQ5.
  - reference: PMID:15300860
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "this amino acid change may result in impaired adaptation to environmental stimuli and progressive deterioration of hearing transduction in heterozygotes"
    explanation: >-
      Graded PARTIAL and included to keep the record honest. This is the authors' own
      interpretation - impaired adaptation, not motor de-repression - and it differs from
      the activation account this node otherwise builds.
- name: Constitutive Myosin VIIa Motor Activation
  description: >-
    Many reported DFNA11 mutations activate the motor-dependent targeting of Myo7A to the
    tips of apical microvilli in cultured epithelial cells. The authors present this as a
    potential explanation for the dominant inheritance of DFNA11 - an activated motor
    would poison the normal one in trans or mislocalise cargo, whereas simply having half
    the normal amount would not.

    The genetic evidence corroborates this independently: dominant cases carry only
    missense and in-frame deletion alleles, while nulls appear in the recessive and Usher
    populations. Two lines of evidence of different kinds converging is what raises this
    above a cell-culture observation.
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: actin filament binding
    modifier: GAIN_OF_FUNCTION
    term:
      id: GO:0051015
      label: actin filament binding
  downstream:
  - target: Progressive Stereocilia Dysfunction
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:39345484
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we demonstrate that many of the DFNA11 deafness mutations reported in patients activate Myo7A targeting, providing a potential explanation for the autosomal dominant genetics of this form of deafness"
    explanation: The activation result and the authors' own link to dominant inheritance.
  - reference: PMID:38594301
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "On the other hand, in patients with Usher syndrome, almost half of the patients carried biallelic null variants (nonsense, splicing, and frameshift variants)."
    explanation: >-
      The contrasting allele class in the recessive disease. Nulls give Usher syndrome, not
      dominant hearing loss, which is the genetic corroboration of a non-haploinsufficiency
      mechanism.
  notes: >-
    The GO binding is `actin filament binding` with modifier GAIN_OF_FUNCTION. The claim
    being made is qualitative - the motor escapes its normal regulatory constraint - not
    that binding is merely quantitatively increased, which is why GAIN_OF_FUNCTION rather
    than INCREASED.
- name: Progressive Stereocilia Dysfunction
  description: >-
    Myosin VIIa maintains mechanical tension across cadherin links and transports
    components to the stereocilia tip, and is essential for maintaining hair cell
    stereocilia bundles. Dysregulated motor activity degrades that maintenance function
    over time, giving the gradually progressive rather than congenital course. Vestibular
    hair cells are affected too, but subclinically - vestibular dysfunction in DFNA11 is
    detectable on caloric testing while remaining asymptomatic.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: cochlear outer hair cell
    term:
      id: CL:0000601
      label: cochlear outer hair cell
  - preferred_term: cochlear inner hair cell
    term:
      id: CL:0000589
      label: cochlear inner hair cell
  evidence:
  - reference: PMID:38594301
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In the inner ear, Myosin 7a forms a tripartite complex with SANS and Harmonin, and plays a crucial role in mechano-electro transduction in stereocilia, helps to maintain the mechanical tension across cadherin links and transports proteins components to the tip of stereocilia6,7."
    explanation: Defines the normal hair-cell function whose disruption produces the phenotype.
  - reference: PMID:38594301
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "It is essential to the maintenance of hair cell stereocilia bundles and loss of this function is known to cause disorganized stereocilia and HL."
    explanation: Links loss of myosin VIIa function to stereocilia disorganisation and hearing loss.
phenotypes:
- name: Postlingual Progressive Sensorineural Hearing Impairment
  category: Auditory
  description: >-
    Postlingual, gradually progressive sensorineural hearing loss, typically beginning in
    the second decade and progressing across frequencies. This late-onset progressive
    course is the consistent distinguishing feature from the congenital or early-onset
    hearing loss of DFNB2 and USH1B.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Postlingual sensorineural hearing impairment
    term:
      id: HP:0008596
      label: Postlingual sensorineural hearing impairment
  evidence:
  - reference: PMID:11889386
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The phenotype of DFNA11 is postlingual, nonsyndromic sensorineural hearing loss with gradual progression."
    explanation: The defining audiological phenotype.
  - reference: PMID:38594301
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most of the autosomal dominant cases showed late-onset progressive hearing loss. On the other hand, cases with autosomal recessive inheritance or Usher syndrome showed congenital or early-onset hearing loss."
    explanation: >-
      Confirms the onset difference between dominant and recessive MYO7A disease in a large
      cohort - the clinical counterpart of the allele-type split.
  - reference: PMID:11889386
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most affected individuals had moderate cochlear hearing loss beginning in the second decade and progressing at all frequencies."
    explanation: Quantifies onset decade and severity in the phenotyped family.
- name: Abnormal Vestibular Function
  category: Vestibular
  description: >-
    Vestibular dysfunction that is detectable on testing but asymptomatic - a distinctive
    combination. In Usher syndrome type 1B the vestibular involvement is clinically
    obvious; in DFNA11 it is subclinical and found only by caloric testing.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Abnormal vestibular function
    term:
      id: HP:0001751
      label: Abnormal vestibular function
  evidence:
  - reference: PMID:11889386
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Variable degrees of asymptomatic vestibular dysfunction were present."
    explanation: Documents vestibular involvement that is present on testing but asymptomatic.
  - reference: PMID:16449806
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We ascertained a large Italian family with an autosomal dominant form of non-syndromic sensorineural hearing loss with vestibular involvement."
    explanation: Independent report of vestibular involvement in a DFNA11-linked family.
- name: High-Frequency Hearing Impairment
  category: Auditory
  description: >-
    High frequencies are commonly worst affected, though the audiometric configuration is
    not uniform - one large pedigree has loss beginning in the low and mid frequencies
    instead.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: High-frequency hearing impairment
    term:
      id: HP:0005101
      label: High-frequency hearing impairment
  evidence:
  - reference: PMID:32428919
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the affected family members in this study showed delayed-onset, progressive hearing loss affecting mostly high frequencies"
    explanation: High-frequency predominance in a p.R206C family.
  - reference: PMID:18667942
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "a large American DFNA11 pedigree with autosomal dominant progressive sensorineural hearing loss that first impacts the low- and mid-frequency auditory range"
    explanation: >-
      Graded PARTIAL because it qualifies rather than supports the high-frequency pattern -
      this pedigree's loss begins at low and mid frequencies instead.
- name: Absence of Retinitis Pigmentosa
  category: Ophthalmologic
  description: >-
    No retinal degeneration, established by electroretinography and ophthalmoscopy in a
    phenotyped DFNA11 family. This is a defining negative: MYO7A is the commonest Usher
    type 1 gene, so the absence of retinopathy is what makes DFNA11 nonsyndromic and is
    the single most consequential thing to tell a newly diagnosed family.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Retinitis pigmentosa
    term:
      id: HP:0000510
      label: Rod-cone dystrophy
  evidence:
  - reference: PMID:11889386
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "No evidence suggested retinitis pigmentosa."
    explanation: >-
      Graded REFUTE because the curated claim is the *absence* of retinitis pigmentosa in
      DFNA11. The finding refutes retinal degeneration as a feature of this disease.
  - reference: PMID:11889386
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Showing moderate hearing loss with asymptomatic variable vestibular dysfunction and no retinal degeneration, the DFNA11 phenotype is mildest among phenotypes caused by MYO7A mutations."
    explanation: Places DFNA11 as the mildest MYO7A phenotype, defined partly by this absence.
  notes: >-
    Bound to HP:0000510 (Rod-cone dystrophy), the HPO term for retinitis pigmentosa. The
    entry asserts this phenotype is absent, which is why the primary evidence item is
    graded REFUTE rather than SUPPORT.
genetic:
- name: MYO7A
  notes: >-
    MYO7A is on 11q13.5, has 49 exons, and encodes the unconventional motor myosin VIIa,
    expressed in retina, lung, testis, kidney and inner and outer hair cells. It is an
    allelic series: DFNA11 (dominant, hearing only), DFNB2 (recessive, hearing only) and
    USH1B (recessive, deaf-blind). Of 882 reported MYO7A variants only 35 cause dominant
    nonsyndromic hearing loss. The allele classes segregate by disease - dominant cases
    carry exclusively missense or in-frame deletion variants, recessive nonsyndromic cases
    carry at least one missense, and nearly half of Usher patients carry biallelic nulls.
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: MYO7A
    term:
      id: hgnc:7606
      label: MYO7A
  evidence:
  - reference: PMID:38594301
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The MYO7A gene is known to be responsible for both syndromic hearing loss (Usher syndrome type1B:USH1B) and non-syndromic hearing loss including autosomal dominant and autosomal recessive inheritance (DFNA11, DFNB2)."
    explanation: Establishes the three-disease allelic series at this locus.
  - reference: PMID:38594301
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among the autosomal recessive cases, all patients had at least one missense variant."
    explanation: >-
      Completes the allele-class picture - even recessive nonsyndromic cases retain a
      missense allele, so total loss is reserved for Usher syndrome.
  - reference: PMID:29400105
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We also summarized and analyzed the phenotypes and genotypes of all DFNA11 families, four of nine are Chinese families, suggesting that MYO7A mutations are not rare."
    explanation: Genotype-phenotype review across the then-known DFNA11 families.
  variants:
  - name: p.R206C
    description: >-
      A recurrent dominant allele reported in unrelated Taiwanese and mainland Chinese
      families, likely a mutation hot spot or founder allele. Its pathogenicity was
      initially ambiguous and was resolved by the second, clearly dominant family.
    evidence:
    - reference: PMID:32428919
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The recurrent p.R206C variant in MYO7A is pathogenic and is likely in a mutation hot spot or due to a founder effect."
      explanation: Establishes recurrence and resolves the earlier ambiguity about pathogenicity.
  - name: p.R853C
    description: >-
      An IQ5 allele at an evolutionarily invariant residue that abolishes calmodulin
      binding to the fifth IQ motif.
    evidence:
    - reference: PMID:15300860
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A defect in CaM/MYO7A interaction represents a novel pathomechanism for genetic hearing loss."
      explanation: The mechanistic significance the authors attach to this allele class.
prevalence:
- population: Japanese hearing loss patients
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 1360.0
  notes: >-
    1.36% of a 10,042-patient Japanese hearing loss cohort had MYO7A-associated hearing
    loss (137 patients). Note carefully what this figure is and is not: it is the
    proportion among people who already have hearing loss, covering all three MYO7A
    phenotypes together - DFNA11, DFNB2 and USH1B - not the population prevalence of
    DFNA11. No DFNA11-specific rate is available.
  evidence:
  - reference: PMID:38594301
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "As a result, 137 patients were identified with MYO7A-associated hearing loss so that the prevalence among Japanese hearing loss patients was 1.36%."
    explanation: >-
      Graded PARTIAL because the figure covers all MYO7A-associated hearing loss, not
      DFNA11 alone, and is a proportion within an ascertained hearing loss cohort rather
      than a population rate.
discussions:
- discussion_id: myo7a_allele_type_determines_disease
  kind: KNOWLEDGE_GAP
  prompt: >-
    Do all DFNA11 alleles act by activating myosin VIIa, and can allele class be used
    prospectively to predict which of the three MYO7A diseases a newly found variant will
    cause?
  attaches_to:
  - pathophysiology#Constitutive Myosin VIIa Motor Activation
  - genetic#MYO7A
  rationale: >-
    The correlation is unusually clean for an allelic series. Dominant cases carry only
    missense and in-frame deletion variants; nearly half of Usher patients carry biallelic
    nulls; recessive nonsyndromic cases sit between, retaining at least one missense. And
    a mechanism now exists that would explain it, since many DFNA11 alleles activate Myo7A
    targeting in cultured cells.

    What is not established is whether the rule runs prospectively. Only a subset of DFNA11
    alleles has been tested in the activation assay, and "many" is the word used, not all -
    so it is unknown whether the untested dominant alleles activate, whether some act by a
    dominant-negative route instead, and critically whether a *recessive* missense allele
    would fail to activate in the same assay. That last comparison is the one that would
    turn a correlation into a usable predictor, and it does not appear to have been run.
    Until it is, a novel MYO7A missense variant in an isolated case cannot be assigned to
    DFNA11 rather than DFNB2 on allele class alone. The assay exists and the alleles are
    published, so this is tractable now.
  evidence:
  - reference: PMID:39345484
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "we demonstrate that many of the DFNA11 deafness mutations reported in patients activate Myo7A targeting, providing a potential explanation for the autosomal dominant genetics of this form of deafness"
    explanation: >-
      Graded PARTIAL on the word "many" and on "potential explanation" - the mechanism is
      demonstrated for a subset and offered as an explanation, not established for the class.
  - reference: PMID:38594301
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All variants identified in autosomal dominant cases were missense or in-frame deletion variants."
    explanation: The genetic correlation that the mechanism would explain.
- discussion_id: dfna11_audiometric_modifier
  kind: KNOWLEDGE_GAP
  prompt: >-
    What modifies DFNA11 severity and audiometric configuration within a single family
    carrying one MYO7A allele?
  attaches_to:
  - phenotypes#High-Frequency Hearing Impairment
  - pathophysiology#Progressive Stereocilia Dysfunction
  rationale: >-
    In one large American pedigree segregating a single MYO7A allele, low- and
    mid-frequency hearing loss ranges from mild to severe with roughly equal numbers at
    each end, and severity varies between generations. Vestibular function appears to track
    auditory severity in at least two individuals, which points to a modifier acting inside
    the inner ear rather than to measurement noise or environmental exposure. Two obvious
    candidates were tested and excluded: SNPs in ATP2B2 and WFS1 did not segregate with the
    mild versus severe phenotype. The authors infer a common polymorphism not tightly
    linked to the MYO7A allele, which is a hypothesis about a genome-wide-mappable
    modifier that has not since been mapped. The unusual low- and mid-frequency
    configuration of this pedigree, against the high-frequency pattern typical elsewhere,
    may itself be the modifier's signature rather than an allele effect.
  evidence:
  - reference: PMID:18667942
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The degree of low- and mid-frequency hearing loss in HL2 family members segregating the MYO7A mutation varies from mild to more severe, with approximately the same number of HL2 family members falling at each end of the severity spectrum."
    explanation: Documents within-family variability under a single allele.
  - reference: PMID:18667942
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "The single-nucleotide polymorphisms examined within ATP2B2 and WFS1 did not segregate with the mild versus more severe auditory phenotype."
    explanation: >-
      Graded REFUTE against the two tested candidate modifiers - a negative result that
      narrows the search rather than advancing it.
  - reference: PMID:18667942
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The putative MYO7A genetic modifier is likely to represent a common polymorphism that is not linked tightly to the MYO7A mutation on the MYO7A allele."
    explanation: The authors' hypothesis about the modifier's nature, still unmapped.

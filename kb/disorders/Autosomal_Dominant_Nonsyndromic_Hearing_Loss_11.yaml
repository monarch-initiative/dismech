name: Autosomal Dominant Nonsyndromic Hearing Loss 11
category: Mendelian
creation_date: "2026-08-27T00:00:00Z"
synonyms:
- DFNA11
- MYO7A-related autosomal dominant nonsyndromic hearing loss
- Deafness, autosomal dominant 11
- Nonsyndromic hearing loss, autosomal dominant 11
description: >-
  DFNA11 is the autosomal dominant, hearing-only form of MYO7A disease. MYO7A encodes
  myosin VIIa, an unconventional motor that in hair cells forms a tripartite complex with
  SANS and harmonin, maintains mechanical tension across cadherin links, and transports
  protein components to the stereocilia tip.

  What makes this entry worth curating separately from Usher syndrome is that MYO7A is an
  allelic series in which the *type* of allele, not merely its severity, determines the
  disease. Biallelic MYO7A loss causes Usher syndrome type 1B - congenital profound
  deafness with retinitis pigmentosa and vestibular areflexia - or, in the hearing-only
  recessive form, DFNB2. Heterozygous DFNA11 alleles cause the mildest MYO7A phenotype:
  postlingual, gradually progressive moderate hearing loss with asymptomatic vestibular
  dysfunction and no retinal degeneration.

  The genetics of a 10,042-patient cohort make the allele-type distinction concrete. Every
  variant found in autosomal dominant cases was missense or in-frame deletion, while
  almost half of Usher syndrome patients carried biallelic null variants. Dominant disease
  therefore does not arise from haploinsufficiency - if it did, null alleles would appear
  among the dominant cases and they do not.

  The mechanistic explanation that has emerged is gain of function. Myosin VIIa is
  autoregulated through specific IQ motifs in its lever arm, and many reported DFNA11
  mutations *activate* motor-dependent targeting of Myo7A in cultured cells, which the
  authors offer as the explanation for the dominant inheritance. This sits coherently
  alongside the earlier finding that a DFNA11 mutation in IQ5 disrupts calmodulin binding,
  since calmodulin occupancy of the IQ motifs is what holds the motor in check - though
  note that the earlier study framed its own result as impaired adaptation rather than as
  de-repression, so the unified reading is an interpretation of the two together and not a
  claim either paper makes.

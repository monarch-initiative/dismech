prevalence:
- population: Japanese hearing loss patients
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 1360.0
  notes: >-
    1.36% of a 10,042-patient Japanese hearing loss cohort had MYO7A-associated hearing
    loss (137 patients). Note carefully what this figure is and is not: it is the
    proportion among people who already have hearing loss, covering all three MYO7A
    phenotypes together - DFNA11, DFNB2 and USH1B - not the population prevalence of
    DFNA11. A dominant-specific figure is curated as the second record below.
  evidence:
  - reference: PMID:38594301
    reference_title: "The prevalence and clinical features of MYO7A-related hearing loss including DFNA11, DFNB2 and USH1B."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "As a result, 137 patients were identified with MYO7A-associated hearing loss so that the prevalence among Japanese hearing loss patients was 1.36%."
    explanation: >-
      Graded PARTIAL because the figure covers all MYO7A-associated hearing loss, not
      DFNA11 alone, and is a proportion within an ascertained hearing loss cohort rather
      than a population rate.
- population: Korean postlingual autosomal dominant nonsyndromic hearing loss families
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 4700.0
  notes: >-
    MYO7A variants in 4.7% of post-lingual families. This is the dominant-specific figure
    the first record lacks, but read it the same way: it is a proportion among families
    already ascertained for postlingual dominant hearing loss, not a population rate. The
    same sentence notes 12 of 14 families were multiplex, which is what an ascertainment
    scheme biased toward large segregating pedigrees would produce.
  evidence:
  - reference: PMID:35453549
    reference_title: "Clinical Heterogeneity Associated with MYO7A Variants Relies on Affected Domains."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "MYO7A variants were detected in 4.7% of post-lingual families, and 12 of 14 families were multiplex."
    explanation: >-
      Graded PARTIAL. It gives a dominant-specific yield but within an ascertained family
      cohort, so it bounds how often MYO7A explains dominant postlingual hearing loss
      rather than how common DFNA11 is.
diagnosis:
- name: Ophthalmologic assessment to exclude Usher syndrome type 1B
  description: >-
    The step that makes the DFNA11 diagnosis rather than the MYO7A diagnosis. Finding a
    MYO7A variant does not distinguish DFNA11 from USH1B, and USH1B is the far commoner
    outcome at this locus, so retinal assessment - electroretinography plus ophthalmoscopy,
    with visual acuity, tonometry and slit-lamp examination - is what establishes the
    nonsyndromic label. It is the procedural basis of the entry's "Absence of Retinitis
    Pigmentosa" claim, and it is a longitudinal commitment rather than a one-off test in a
    child, since retinitis pigmentosa in Usher syndrome declares itself over years.
  evidence:
  - reference: PMID:11889386
    reference_title: "Phenotype of DFNA11: a nonsyndromic hearing loss caused by a myosin VIIA mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Selected subjects underwent additional examinations including speech discrimination scoring, acoustic reflex measurements, Békésy audiometry, evoked and distortion-product otoacoustic emissions, auditory brainstem responses, and bithermal caloric testing; visual acuity, ocular tonometry, slit-lamp examination, ophthalmoscopy, and electroretinography; and computed tomography of the temporal bone."
    explanation: >-
      The examination battery in the family from which the absence of retinopathy is
      curated, naming electroretinography and ophthalmoscopy specifically.
- name: Distortion-product otoacoustic emissions as an early marker
  description: >-
    Outer hair cell function measured by distortion-product otoacoustic emissions can be
    abnormal before pure-tone thresholds move. This matters for a progressive disorder in
    which the mechanism is a maintenance failure at the stereocilia: the cellular lesion
    precedes the audiometric one, so a normal audiogram in an at-risk family member does
    not establish that the cochlea is unaffected.
  evidence:
  - reference: PMID:32097363
    reference_title: "Clinical Profiles of DFNA11 at Diverse Stages of Development and Aging in a Large Family Identified by Linkage Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Some subjects showed partly abnormal results in the distortion products of otoacoustic emissions before the elevation of hearing thresholds."
    explanation: >-
      The observation itself, in a large linkage-confirmed family. Graded SUPPORT rather
      than as a validated screening test - it is reported in "some subjects", not
      quantified as a sensitivity.
treatments:
- name: Hearing Amplification and Cochlear Implantation
  description: >-
    Hearing aids, progressing to cochlear implantation as thresholds deteriorate. There is
    no disease-modifying therapy. What is specific to this disorder is the timing question
    rather than the modality: the loss is postlingual and progressive, so the clinically
    useful commitment is long-term audiological follow-up that catches deterioration early
    rather than a single fitting decision.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: hearing amplification and cochlear implantation
  notes: >-
    treatment_term carries no NCIT binding. NCIT's hearing-aid and cochlear-implant
    concepts are device terms and are not reachable from NCIT:C25218 Clinical Intervention
    or Procedure, so they fail TreatmentActionTerm validation, and NCIT has no
    clinical-action term for fitting or implantation. A free-text preferred_term is correct
    here under the ontology contract rather than a forced broader binding.
  evidence:
  - reference: PMID:37371710
    reference_title: "Autosomal Dominant Non-Syndromic Hearing Loss (DFNA): A Comprehensive Narrative Review."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "A long audiological follow-up is of paramount importance to identify hearing threshold deteriorations early and ensure prompt treatment with hearing aids or cochlear implants."
    explanation: >-
      Graded PARTIAL and cited at the group level deliberately. It is a narrative review of
      autosomal dominant nonsyndromic hearing loss as a class, not of DFNA11, so it
      supports the management approach for the class this disorder belongs to. No
      DFNA11-specific treatment study exists in the cache.
- name: Genetic Counselling
  description: >-
    Dominant counselling with a 50% transmission risk, and - more consequentially here -
    counselling about what the MYO7A finding does and does not predict. The same gene
    causes Usher syndrome type 1B, so a family told they carry a MYO7A variant needs the
    allele type and the ophthalmologic result explained together, or the reasonable
    inference is that blindness is coming.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:38594301
    reference_title: "The prevalence and clinical features of MYO7A-related hearing loss including DFNA11, DFNB2 and USH1B."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The MYO7A gene is known to be responsible for both syndromic hearing loss (Usher syndrome type1B:USH1B) and non-syndromic hearing loss including autosomal dominant and autosomal recessive inheritance (DFNA11, DFNB2)."
    explanation: >-
      The allelic series that makes counselling at this locus a substantive task rather
      than a recurrence-risk figure.
progression:
- phase: Childhood to third decade
  notes: >-
    Gently sloping audiogram in childhood, flattening after about age 30. High frequencies
    are affected first and deteriorate slowly.
  evidence:
  - reference: PMID:32097363
    reference_title: "Clinical Profiles of DFNA11 at Diverse Stages of Development and Aging in a Large Family Identified by Linkage Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Audiograms tended to show gently sloping configuration in childhood and flat configuration after the age of 30 years."
    explanation: The audiogram configuration and the age at which it changes.
- phase: Later adult life
  notes: >-
    Low frequencies begin to deteriorate later than high frequencies but then progress more
    rapidly, which is what converts the sloping childhood audiogram into the flat adult
    one. Vestibular function was normal throughout in this family, although caloric
    abnormalities are reported in others - see the vestibular phenotype.
  evidence:
  - reference: PMID:32097363
    reference_title: "Clinical Profiles of DFNA11 at Diverse Stages of Development and Aging in a Large Family Identified by Linkage Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hearing loss at high frequencies progressed slowly, while hearing at low frequencies started to deteriorate later but progressed more rapidly."
    explanation: The differing rates by frequency, which is the mechanism of the configuration change.
  - reference: PMID:32097363
    reference_title: "Clinical Profiles of DFNA11 at Diverse Stages of Development and Aging in a Large Family Identified by Linkage Analysis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Vestibular function was within the normal range in all the subjects tested."
    explanation: >-
      Graded PARTIAL because it conflicts with the caloric abnormalities curated in the
      vestibular phenotype from another family. Quoted rather than omitted: vestibular
      involvement in DFNA11 is not uniform, and an entry that only carried the positive
      finding would overstate it.
differential_diagnoses:
- name: Usher syndrome type 1B
  description: >-
    The differential that matters at this locus, because it is the same gene. USH1B is
    caused by biallelic MYO7A variants and presents with congenital profound sensorineural
    hearing loss, vestibular areflexia, and retinitis pigmentosa. DFNA11 is heterozygous,
    postlingual and progressive, has at most subclinical vestibular involvement, and no
    retinopathy.

    The timing is what makes this a real diagnostic problem rather than a textbook
    distinction. Retinitis pigmentosa in USH1 develops in early adolescence, so a normal
    retinal examination in a young child does not distinguish the two - which is why the
    ophthalmologic assessment in this entry's diagnosis section is a longitudinal
    commitment and not a one-off test.
  distinguishing_features:
  - >-
    Zygosity and allele class: heterozygous missense or in-frame deletion in DFNA11,
    against biallelic variants often including nulls in USH1B.
  - >-
    Onset and course: postlingual and progressive in DFNA11, against congenital and
    profound in USH1B.
  - >-
    Vestibular function: normal to subclinically abnormal on caloric testing in DFNA11,
    against areflexia in USH1B.
  - >-
    Retinal status on longitudinal electroretinography and ophthalmoscopy - longitudinal
    because a normal childhood examination does not distinguish the two.
  evidence:
  - reference: PMID:20301442
    reference_title: "Usher Syndrome Type I."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "congenital bilateral profound sensorineural hearing loss, vestibular areflexia, "
    explanation: >-
      The USH1 triad against which DFNA11 is defined. The quote ends at a line break in the
      cached chapter text.
  - reference: PMID:20301442
    reference_title: "Usher Syndrome Type I."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "develops in early adolescence, resulting in progressively constricted visual "
    explanation: >-
      The timing that makes a childhood retinal examination non-exclusionary, and therefore
      the basis for recommending longitudinal rather than single assessment.
  - reference: PMID:20301442
    reference_title: "Usher Syndrome Type I."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "five genes – MYO7A, USH1C, CDH23, PCDH15, and USH1G – confirms the diagnosis."
    explanation: >-
      Names MYO7A among the USH1 genes, which is what makes this differential
      gene-identical rather than merely phenotypically similar.
discussions:
- discussion_id: dfna11_no_in_vivo_model_of_activation
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Every in vivo model of MYO7A disease is a loss-of-function model, while DFNA11 is
    proposed to work by activating the motor. Does any animal reproduce the dominant
    activating mechanism, and until one does, what can the existing models actually be used
    to test?
  attaches_to:
  - pathophysiology#Constitutive Myosin VIIa Motor Activation
  - pathophysiology#Progressive Stereocilia Dysfunction
  rationale: >-
    This entry's central claim is that DFNA11 alleles activate myosin VIIa rather than
    removing it, and that this is why they are dominant while nulls are recessive. The
    direct evidence for activation is a cultured kidney epithelial cell assay - a
    heterologous system chosen because it makes motor-dependent targeting visible, not
    because it resembles a hair cell.

    The in vivo literature does not currently test that claim. The mouse models are
    deletions, which by construction model the recessive and Usher end of the allelic
    series; the tensioning study curated on the stereocilia node is an isoform deletion. A
    deletion model can tell you what myosin VIIa normally does, and this entry uses it for
    exactly that, but it cannot tell you what a constitutively activated motor does to a
    stereocilium over decades - which is the specific claim DFNA11 rests on.

    The consequence is concrete rather than academic. The proposed mechanism predicts that
    a therapy restoring autoinhibition would help in DFNA11 and be useless or harmful in
    DFNB2 and USH1B, and there is currently no in vivo system in which that prediction
    could be tested. A knock-in of a human activating allele is the missing experiment.
  evidence:
  - reference: PMID:39345484
    reference_title: "Select autosomal dominant DFNA11 deafness mutations activate Myo7A in epithelial cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In this study, we used cultured kidney epithelial cells to screen for mutations that activate the motor-dependent targeting of Myo7A to the tips of apical microvilli on these cells."
    explanation: >-
      Names the system in which the activation claim was established - cultured kidney
      epithelial cells, chosen for the readout rather than for fidelity to hair cells.
  - reference: PMID:39345484
    reference_title: "Select autosomal dominant DFNA11 deafness mutations activate Myo7A in epithelial cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Importantly, we demonstrate that many of the DFNA11 deafness mutations reported in patients activate Myo7A targeting, providing a potential explanation for the autosomal dominant genetics of this form of deafness."
    explanation: >-
      The activation result and the authors' own framing of it as a potential explanation.
      "Potential" is theirs, and it is the epistemic level this entry's mechanism sits at.
  - reference: PMID:32350269
    reference_title: "Myosin-VIIa is expressed in multiple isoforms and essential for tensioning the hair cell mechanotransduction complex."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "In mice with a specific deletion of the canonical isoform (Myo7a-ΔC mouse), MYO7A is severely diminished in inner hair cells (IHCs), while expression in outer hair cells is affected tonotopically."
    explanation: >-
      Graded PARTIAL and quoted to establish the mismatch rather than to support the
      mechanism. The best available in vivo model is a deletion, so it models absence of
      the motor, not activation of it.
- discussion_id: myo7a_allele_type_determines_disease
  kind: KNOWLEDGE_GAP
  prompt: >-
    Do all DFNA11 alleles act by activating myosin VIIa, and can allele class be used
    prospectively to predict which of the three MYO7A diseases a newly found variant will
    cause?
  attaches_to:
  - pathophysiology#Constitutive Myosin VIIa Motor Activation
  - genetic#MYO7A
  rationale: >-
    The correlation is unusually clean for an allelic series. Dominant cases carry only
    missense and in-frame deletion variants; nearly half of Usher patients carry biallelic
    nulls; recessive nonsyndromic cases sit between, retaining at least one missense. And
    a mechanism now exists that would explain it, since many DFNA11 alleles activate Myo7A
    targeting in cultured cells.

    What is not established is whether the rule runs prospectively. Only a subset of DFNA11
    alleles has been tested in the activation assay, and "many" is the word used, not all -
    so it is unknown whether the untested dominant alleles activate, whether some act by a
    dominant-negative route instead, and critically whether a *recessive* missense allele
    would fail to activate in the same assay. That last comparison is the one that would
    turn a correlation into a usable predictor, and it does not appear to have been run.
    Until it is, a novel MYO7A missense variant in an isolated case cannot be assigned to
    DFNA11 rather than DFNB2 on allele class alone. The assay exists and the alleles are
    published, so this is tractable now.
  evidence:
  - reference: PMID:39345484
    reference_title: "Select autosomal dominant DFNA11 deafness mutations activate Myo7A in epithelial cells."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "we demonstrate that many of the DFNA11 deafness mutations reported in patients activate Myo7A targeting, providing a potential explanation for the autosomal dominant genetics of this form of deafness"
    explanation: >-
      Graded PARTIAL on the word "many" and on "potential explanation" - the mechanism is
      demonstrated for a subset and offered as an explanation, not established for the class.
  - reference: PMID:38594301
    reference_title: "The prevalence and clinical features of MYO7A-related hearing loss including DFNA11, DFNB2 and USH1B."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All variants identified in autosomal dominant cases were missense or in-frame deletion variants."
    explanation: The genetic correlation that the mechanism would explain.
- discussion_id: dfna11_audiometric_modifier
  kind: KNOWLEDGE_GAP
  prompt: >-
    What modifies DFNA11 severity and audiometric configuration within a single family
    carrying one MYO7A allele?
  attaches_to:
  - phenotypes#High-Frequency Hearing Impairment
  - pathophysiology#Progressive Stereocilia Dysfunction
  rationale: >-
    In one large American pedigree segregating a single MYO7A allele, low- and
    mid-frequency hearing loss ranges from mild to severe with roughly equal numbers at
    each end, and severity varies between generations. Vestibular function appears to track
    auditory severity in at least two individuals, which points to a modifier acting inside
    the inner ear rather than to measurement noise or environmental exposure. Two obvious
    candidates were tested and excluded: SNPs in ATP2B2 and WFS1 did not segregate with the
    mild versus severe phenotype. The authors infer a common polymorphism not tightly
    linked to the MYO7A allele, which is a hypothesis about a genome-wide-mappable
    modifier that has not since been mapped. The unusual low- and mid-frequency
    configuration of this pedigree, against the high-frequency pattern typical elsewhere,
    may itself be the modifier's signature rather than an allele effect.
  evidence:
  - reference: PMID:18667942
    reference_title: "In search of the DFNA11 myosin VIIA low- and mid-frequency auditory genetic modifier."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The degree of low- and mid-frequency hearing loss in HL2 family members segregating the MYO7A mutation varies from mild to more severe, with approximately the same number of HL2 family members falling at each end of the severity spectrum."
    explanation: Documents within-family variability under a single allele.
  - reference: PMID:18667942
    reference_title: "In search of the DFNA11 myosin VIIA low- and mid-frequency auditory genetic modifier."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "The single-nucleotide polymorphisms examined within ATP2B2 and WFS1 did not segregate with the mild versus more severe auditory phenotype."
    explanation: >-
      Graded REFUTE against the two tested candidate modifiers - a negative result that
      narrows the search rather than advancing it.
  - reference: PMID:18667942
    reference_title: "In search of the DFNA11 myosin VIIA low- and mid-frequency auditory genetic modifier."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The putative MYO7A genetic modifier is likely to represent a common polymorphism that is not linked tightly to the MYO7A mutation on the MYO7A allele."
    explanation: The authors' hypothesis about the modifier's nature, still unmapped.

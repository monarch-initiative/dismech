- name: Absence of Retinitis Pigmentosa
  category: Ophthalmologic
  diagnostic: true
  description: >-
    No retinal degeneration, established by electroretinography and ophthalmoscopy in a
    phenotyped DFNA11 family. This is a defining negative: MYO7A is the commonest Usher
    type 1 gene, so the absence of retinopathy is what makes DFNA11 nonsyndromic and is
    the single most consequential thing to tell a newly diagnosed family.

    Curated as a REFUTED phenotype, and deliberately carrying NO phenotype_term and NO
    frequency. The schema has no negation slot and FrequencyEnum has no EXCLUDED value, so
    binding HP:0000510 with a frequency here would export as the assertion that 80-99% of
    DFNA11 patients HAVE rod-cone dystrophy - the exact opposite of the point, and the most
    harmful edge this entry could emit given the MYO7A-Usher relationship. The REFUTE
    grading on the evidence item is claim-relative and never reaches the phenotype
    assertion, so it cannot substitute. This follows the pattern in
    Amyotrophic_Lateral_Sclerosis_27_Juvenile ("Absence of Sensory Neuropathy").
  evidence:
  - reference: PMID:11889386
    reference_title: "Phenotype of DFNA11: a nonsyndromic hearing loss caused by a myosin VIIA mutation."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "No evidence suggested retinitis pigmentosa."
    explanation: >-
      Graded REFUTE because the curated claim is the *absence* of retinitis pigmentosa in
      DFNA11. The finding refutes retinal degeneration as a feature of this disease.
  - reference: PMID:11889386
    reference_title: "Phenotype of DFNA11: a nonsyndromic hearing loss caused by a myosin VIIA mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Showing moderate hearing loss with asymptomatic variable vestibular dysfunction and no retinal degeneration, the DFNA11 phenotype is mildest among phenotypes caused by MYO7A mutations."
    explanation: Places DFNA11 as the mildest MYO7A phenotype, defined partly by this absence.
  notes: >-
    The absence is not a guarantee for every MYO7A carrier - it is a statement about the
    DFNA11 phenotype. The same gene causes Usher syndrome type 1B, where retinitis
    pigmentosa is a defining feature, so a patient carrying a MYO7A variant needs the
    allele type established, not the gene alone. See the diagnosis section for the
    ophthalmologic assessment that establishes it.
genetic:
- name: MYO7A
  notes: >-
    MYO7A is on 11q13.5, has 49 exons, and encodes the unconventional motor myosin VIIa,
    expressed in retina, lung, testis, kidney and inner and outer hair cells. It is an
    allelic series: DFNA11 (dominant, hearing only), DFNB2 (recessive, hearing only) and
    USH1B (recessive, deaf-blind). Of 882 reported MYO7A variants only 35 cause dominant
    nonsyndromic hearing loss. The allele classes segregate by disease - dominant cases
    carry exclusively missense or in-frame deletion variants, recessive nonsyndromic cases
    carry at least one missense, and nearly half of Usher patients carry biallelic nulls.

    Within the dominant alleles there is a further, prognostic correlation by protein
    domain. Dominant variants cluster in the motor and MyTH4 domains; motor-domain missense
    variants give later onset with an ascending audiogram, while tail-domain variants give a
    severe audiological phenotype. This is the finer-grained form of the entry's own
    allele-type thesis: allele class separates the three diseases, and within DFNA11 the
    affected domain modulates severity and onset.
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: MYO7A
    term:
      id: hgnc:7606
      label: MYO7A
  evidence:
  - reference: PMID:38594301
    reference_title: "The prevalence and clinical features of MYO7A-related hearing loss including DFNA11, DFNB2 and USH1B."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The MYO7A gene is known to be responsible for both syndromic hearing loss (Usher syndrome type1B:USH1B) and non-syndromic hearing loss including autosomal dominant and autosomal recessive inheritance (DFNA11, DFNB2)."
    explanation: Establishes the three-disease allelic series at this locus.
  - reference: PMID:38594301
    reference_title: "The prevalence and clinical features of MYO7A-related hearing loss including DFNA11, DFNB2 and USH1B."

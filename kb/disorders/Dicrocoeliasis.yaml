name: Dicrocoeliasis
creation_date: '2026-11-14T09:43:18Z'
synonyms:
- dicrocoeliosis
- lancet liver fluke infection
category: Infectious Disease
description: >-
  Dicrocoeliasis is a rare food-borne trematodiasis caused by Dicrocoelium
  lancet liver flukes, especially Dicrocoelium dendriticum and probably
  Dicrocoelium hospes in West Africa. Adult flukes live in the gallbladder and
  bile ducts of sheep, cattle, and other herbivores; eggs leave in feces, larval
  development requires land snails and then ants, and the definitive host
  becomes infected when it accidentally ingests ants carrying metacercariae on
  food or in water. Humans are accidental definitive hosts. True infection must
  be distinguished from spurious egg passage after eating infected raw animal
  liver, because true disease can be asymptomatic or can present with
  eosinophilia, right-upper-quadrant abdominal pain, diarrhea, fatigue, weight
  loss, hepatomegaly, elevated transaminases, or rare biliary obstruction and
  cholangitis. Diagnosis is by microscopic
  identification of embryonated Dicrocoelium eggs that persist in stool after a
  liver-free diet, and reported true cases have been treated with praziquantel,
  triclabendazole, or albendazole.
disease_term:
  preferred_term: dicrocoeliasis
  term:
    id: MONDO:0005729
    label: dicrocoeliasis
parents:
- helminthiasis
infectious_agent:
- name: Dicrocoelium
  infectious_agent_term:
    preferred_term: Dicrocoelium
    term:
      id: NCBITaxon:57077
      label: Dicrocoelium
  description: >-
    Small dicrocoeliid liver flukes whose adults inhabit the gallbladder and
    bile ducts of herbivores; D. dendriticum is the best documented human
    agent, and Dicrocoelium spp. infections in Ghana may involve D. hospes.
  evidence:
  - reference: PMID:20220269
    reference_title: Human infection with Dicrocoelium dendriticum in Turkey.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Dicrocoeliosis is caused by Dicrocoelium dendriticum, a 5 to 15 mm long
      and 1.5 to 2.5 mm wide parasitic fluke that usually infests the gall
      bladder and bile ducts of herbivores, such as, sheep, goat, cattle, and
      sometimes humans.
    explanation: >-
      Identifies D. dendriticum as a human dicrocoeliasis agent and localizes
      adult worms to the gallbladder and bile ducts of herbivores or humans.
  - reference: PMID:33720847
    reference_title: True Dicrocoelium Spp. Infection in an Immigrant Traveler (VFR).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      In Ghana, Dicrocoelium hospes is a common parasite of cattle, and it is
      suggested that true infections in man may also occur.
    explanation: >-
      Supports keeping the agent at the Dicrocoelium genus level rather than
      making the disease exclusively D. dendriticum.
agent_life_cycle:
  description: >-
    Dicrocoelium flukes complete a terrestrial three-host cycle. Adult flukes
    in a mammalian definitive host produce embryonated eggs that pass in feces.
    Larvae develop first in land snails and then in ants; infected ants carry
    the metacercariae that infect sheep, cattle, other herbivores, or accidental
    human hosts after oral ingestion. In the definitive host, adult flukes
    settle in the biliary tract.
  hosts:
  - preferred_term: land snail
    term:
      id: NCBITaxon:6448
      label: Gastropoda
    role: first intermediate host
  - preferred_term: Formica ants
    term:
      id: NCBITaxon:72766
      label: Formica
    role: second intermediate host
  - preferred_term: sheep
    term:
      id: NCBITaxon:9940
      label: Ovis aries
    role: ruminant definitive host
  - preferred_term: cattle
    term:
      id: NCBITaxon:9913
      label: Bos taurus
    role: ruminant definitive host
  - preferred_term: Homo sapiens
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
    role: accidental definitive host
  life_cycle_stages:
  - name: Embryonated egg in definitive-host feces
    life_cycle_stage_term:
      preferred_term: egg stage
      term:
        id: OPL:0000180
        label: egg stage
    description: >-
      Adult flukes in the biliary tract release operculated, embryonated eggs
      that leave the definitive host in feces.
    evidence:
    - reference: PMID:27895270
      reference_title: "Dicrocoelium dendriticum: An Unusual Parasitological Diagnosis in a Reference International Health Unit."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: BACKGROUND
      snippet: >-
        Eggs are oval, asymmetrical, and operculated about 35–50 μm size with a
        brownish thick shell.
      explanation: >-
        Supports the diagnostic morphology of the Dicrocoelium egg stage in
        feces.
  - name: Snail and ant intermediate-host larval development
    description: >-
      The parasite requires a land snail as first intermediate host and a
      Formica ant or related ant as second intermediate host; ants carry the
      metacercariae that infect the mammalian definitive host.
    evidence:
    - reference: PMID:33720847
      reference_title: True Dicrocoelium Spp. Infection in an Immigrant Traveler (VFR).
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: BACKGROUND
      snippet: >-
        This helminth has a complex biological cycle because it requires two
        intermediate hosts (snails and ants) to complete its development.
      explanation: >-
        Supports the snail-to-ant intermediate-host organization of the cycle.
    - reference: PMID:27895270
      reference_title: "Dicrocoelium dendriticum: An Unusual Parasitological Diagnosis in a Reference International Health Unit."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: BACKGROUND
      snippet: >-
        The definitive host (herbivores) is parasitized by eating infected ants,
        mainly of the genus Formica, with metacercariae.
      explanation: >-
        Identifies infected Formica ants carrying metacercariae as the host
        form that infects a definitive herbivore.
  - name: Adult fluke in the biliary tract
    life_cycle_stage_term:
      preferred_term: adult parasitic worm stage
      term:
        id: OPL:0000237
        label: adult parasitic worm stage
    description: >-
      After a person or herbivore ingests infected ants, adult flukes inhabit
      the gallbladder and bile ducts and produce eggs.
    evidence:
    - reference: PMID:27895270
      reference_title: "Dicrocoelium dendriticum: An Unusual Parasitological Diagnosis in a Reference International Health Unit."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: BACKGROUND
      snippet: >-
        The adults are 5–15 mm in length and 1.5–2.5 mm in width and live in
        the bile ducts of many mammals, particularly Bovidae.
      explanation: >-
        Supports adult fluke residence in the gallbladder and bile ducts of
        bovine and other mammalian definitive hosts.
transmission:
- name: Ingestion of metacercaria-infected ants
  description: >-
    True infection follows accidental oral ingestion of ants carrying
    Dicrocoelium metacercariae, usually on unwashed raw vegetables or in
    contaminated water.
  evidence:
  - reference: PMID:27895270
    reference_title: "Dicrocoelium dendriticum: An Unusual Parasitological Diagnosis in a Reference International Health Unit."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Human infection is quite exceptional and occurs after accidental ingestion
      of infected ants by eating unwashed raw vegetables or drinking
      contaminated water.
    explanation: >-
      Supports the accidental food- or water-borne ingestion route for true
      human infection.
epidemiology:
- name: Rare human infection with frequent pseudo-parasitism
  description: >-
    Human Dicrocoelium egg detection is uncommon, and many stool-positive
    humans prove to have pseudo-parasitism after raw liver ingestion rather than
    persistent true infection. A Saudi hospital series found 208 stool-positive
    patients over three years, but only a small confirmed subset had true
    infection.
  factors:
  - raw animal liver ingestion
  - contaminated raw vegetables
  - contaminated water
  evidence:
  - reference: PMID:2260188
    reference_title: Human dicrocoeliasis. Report on 208 cases from Saudi Arabia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      In 3 years, Dicrocoelium dendriticum ova were detected in 208 patients at
      the Armed Forces Hospital, Riyadh, Saudi Arabia during 1984-1986. At least
      7 of these patients had a true infection and at least 34 patients had
      spurious infection as they gave a history of eating raw liver.
    explanation: >-
      Supports both the rarity of confirmed true infection among stool-positive
      patients and the contribution of raw-liver-associated false infections.
  - reference: PMID:27895270
    reference_title: "Dicrocoelium dendriticum: An Unusual Parasitological Diagnosis in a Reference International Health Unit."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Finding Dicrocoelium dendriticum eggs in human feces is exceptional and
      there are few prevalence data available.
    explanation: >-
      Supports that human stool detection is unusual and human prevalence is
      poorly characterized.
  - reference: PMID:27895270
    reference_title: "Dicrocoelium dendriticum: An Unusual Parasitological Diagnosis in a Reference International Health Unit."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Although the infection is usually asymptomatic
    explanation: >-
      Supports recording that true human infection can be clinically silent.
progression:
- phase: Accidental ant-borne metacercarial ingestion
  notes: >-
    True human infection begins after accidental ingestion of infected ants
    carrying metacercariae, distinct from spurious egg transit after raw liver
    ingestion.
  evidence:
  - reference: PMID:27895270
    reference_title: "Dicrocoelium dendriticum: An Unusual Parasitological Diagnosis in a Reference International Health Unit."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Human infection is quite exceptional and occurs after accidental ingestion
      of infected ants by eating unwashed raw vegetables or drinking
      contaminated water.
    explanation: >-
      Supports accidental infected-ant ingestion as the start of true human
      infection.
- phase: Established biliary adult-fluke infection
  notes: >-
    Adult flukes persist in the gallbladder or bile ducts and produce eggs that
    remain detectable after a liver-free diet in confirmed true infections.
  evidence:
  - reference: PMID:20220269
    reference_title: Human infection with Dicrocoelium dendriticum in Turkey.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The eggs were seen in each of the samples, which indicated that the
      infection was genuine and not a spurious infection.
    explanation: >-
      Repeated egg detection after liver-free diet supports a persistent
      established biliary infection rather than transient egg passage.
- phase: Rare chronic or obstructive biliary disease
  notes: >-
    A minority of true infections become symptomatic, with bile-duct
    inflammation, dilatation, cholangitis, or obstruction.
  evidence:
  - reference: PMID:27895270
    reference_title: "Dicrocoelium dendriticum: An Unusual Parasitological Diagnosis in a Reference International Health Unit."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      it can produce chronic cholangitis and dilatation of the bile ducts
      causing weight loss and fatigue.
    explanation: >-
      Supports symptomatic chronic bile-duct inflammation and dilatation as a
      later clinical phase.

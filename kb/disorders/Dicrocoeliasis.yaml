diagnosis:
- name: Stool Microscopy with Liver-Free Diet Confirmation
  description: >-
    Dicrocoeliasis is diagnosed by identifying Dicrocoelium eggs in stool; eggs
    that disappear after at least three days without liver or other viscera
    indicate pseudo-parasitism, whereas persistent egg shedding supports true
    infection.
  evidence:
  - reference: PMID:27895270
    reference_title: "Dicrocoelium dendriticum: An Unusual Parasitological Diagnosis in a Reference International Health Unit."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: Diagnosis of this parasitism is based on observation of eggs of D. dentriticum in feces.
    explanation: >-
      Supports fecal egg passage as the diagnostic finding in dicrocoeliasis.
  - reference: PMID:27895270
    reference_title: "Dicrocoelium dendriticum: An Unusual Parasitological Diagnosis in a Reference International Health Unit."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Differential diagnosis between true and pseudo-infections is performed
      through stool examination after a diet free of liver.
    explanation: >-
      Supports repeated stool examination after a liver-free diet as the key
      true-versus-spurious distinction.
  - reference: PMID:20220269
    reference_title: Human infection with Dicrocoelium dendriticum in Turkey.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The eggs were seen in each of the samples, which indicated that the
      infection was genuine and not a spurious infection.
    explanation: >-
      In a confirmed Turkish case, repeated egg detection after liver-free diet
      supported true infection.
treatments:
- name: Praziquantel for True Dicrocoelium Infection
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: praziquantel
      term:
        id: CHEBI:45267
        label: praziquantel
  description: >-
    Confirmed true infection can be treated with praziquantel, while transient
    egg passage after infected liver ingestion needs no anthelmintic.
  target_mechanisms:
  - target: Adult Fluke Bile-Duct Residence
  evidence:
  - reference: PMID:27895270
    reference_title: "Dicrocoelium dendriticum: An Unusual Parasitological Diagnosis in a Reference International Health Unit."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Treatment in true parasitism is praziquantel 15 or 25 mg/kg in a single
      dose or two doses of 7.5 mg on successive days or single dose of
      triclabendazole 10 mg/kg. In case of spurious infection, treatment is not
      recommended.
    explanation: >-
      Supports praziquantel as a reported option for true infection and no
      anthelmintic for pseudo-parasitism.
  - reference: PMID:33720847
    reference_title: True Dicrocoelium Spp. Infection in an Immigrant Traveler (VFR).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      It was therefore considered a true infection and treated with
      praziquantel (25 mg/kg/8 hours for 1 day).
    explanation: >-
      Documents praziquantel therapy in a diet-confirmed true infection.
  - reference: PMID:33720847
    reference_title: True Dicrocoelium Spp. Infection in an Immigrant Traveler (VFR).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-

  title: Structural variant allelic heterogeneity in MECP2 Duplication Syndrome provides insight into clinical severity and variability of disease expression
  description: 'MECP2 Duplication Syndrome, also known as X-linked intellectual developmental disorder Lubs type (MRXSL; MIM: 300260), is a neurodevelopmental disorder caused by copy number gains spanning MECP2. Despite varying genomic rearrangement structures, including duplications and triplications, and a wide range of duplication sizes, no clear correlation exists between DNA rearrangement and clinical features.'

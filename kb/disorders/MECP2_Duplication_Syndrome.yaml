- accession: geo:GSE71234
  title: Reversal of MECP2 duplication syndrome using genetic rescue and antisense oligonucleotides [ASO time point 2]
  description: 'MECP2 duplication syndrome, a childhood neurological disorder characterized by autism, intellectual disability, motor dysfunction, anxiety and epilepsy, is caused by a duplication on chromosome Xq28 spanning the MECP2 gene that results in doubling of MeCP2 levels. MECP2 overexpression in mice causes neurobehavioral and electroencephalographic defects similar to those of human patients, but the gross anatomy of the brain remains unaffected. We hypothesized that MECP2 duplication syndrome would be reversible and tested two methods to restore MeCP2 levels to normal: conditional genetic recombination and antisense oligonucleotide therapy.'

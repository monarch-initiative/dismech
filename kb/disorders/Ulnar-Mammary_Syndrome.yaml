differential_diagnoses:
- name: Holt-Oram Syndrome
  disease_term:
    preferred_term: Holt-Oram syndrome
    term:
      id: MONDO:0007732
      label: Holt-Oram syndrome
  description: >-
    TBX5-related Holt-Oram syndrome also combines upper-limb and cardiac
    findings, but classically affects anterior/radial limb structures rather
    than the posterior/ulnar structures of UMS; mammary, apocrine and genital
    findings favor TBX3-related disease.
  distinguishing_features:
  - Posterior ulnar-ray deficiency in UMS versus anterior radial-ray deficiency in Holt-Oram syndrome
  - Mammary and axillary apocrine hypoplasia favor UMS
  - Causative TBX3 variant in UMS versus TBX5 variant in Holt-Oram syndrome
  evidence:
  - reference: PMID:9207801
    reference_title: "Mutations in human TBX3 alter limb, apocrine and genital development in ulnar-mammary syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Limb abnormalities of ulnar-mammary syndrome involve posterior elements.
      Mutations in TBX5, a related and linked gene, cause anterior limb
      abnormalities in Holt-Oram syndrome.
    explanation: Directly states the limb-pattern distinction between the two T-box disorders.
review_notes: >-
  The reviewed graph deliberately leaves Postaxial Hand Polydactyly, Absent
  Axillary Hair, Micropenis, Cryptorchidism, Ventricular Septal Defect,
  Hypodontia, Bifid Nasal Tip, Bifid Tongue, Imperforate Hymen, and Bladder
  Diverticulum without incoming causal edges. Their occurrence is supported,
  but the retained cache does not establish disorder-specific intermediate
  routes. Hypoplastic Nipples and Hypohidrosis remain connected because the
  mammary-placode model and human apocrine-gland series provide suitably scoped
  support. No population-based prevalence estimate, disease-modifying trial,
  or GeneReviews chapter was identified.

animal_models:
- species: Mus musculus
  genotype: Heterozygous Tbx3 loss-of-function and mammary-development alleles
  description: >-
    Mouse Tbx3 dosage models reproduce failure to maintain mammary placodes and
    reduced ductal branching, while developmental studies resolve the posterior
    limb-boundary mechanism. These models capture tissue-specific consequences
    of reduced Tbx3 dosage rather than the full variably expressed human syndrome.
  genes:
  - preferred_term: TBX3
    term:
      id: hgnc:11602
      label: TBX3
  modeled_mechanisms:
  - target: Posterior Limb Patterning Disruption
    description: Models TBX3-dependent positioning of the posterior boundary and SHH organizer territory.
    evidence:
    - reference: PMID:38828908
      reference_title: "TBX3 is essential for establishment of the posterior boundary of anterior genes and upregulation of posterior genes together with HAND2 during the onset of limb bud development."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "the \nposterior expression boundaries of anterior genes are positioned by \nTBX3-mediated repression, which excludes anterior genes such as Gli3, Alx4, \nHand1 and Irx3/5 from the posterior limb bud mesenchyme"
      explanation: Defines the posterior limb-boundary readout captured by the mouse model.
  - target: Apocrine Gland Development Failure
    description: Models the dosage-sensitive mammary placode and ductal branching defect.
    evidence:
    - reference: PMID:16222716
      reference_title: "Tbx3, the ulnar-mammary syndrome gene, and Tbx2 interact in mammary gland development through a p19Arf/p53-independent pathway."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "we show a haploinsufficiency effect of Tbx3 on maintenance of \nthe mammary placodes and on the extent of branching of the ductal tree in mice"
      explanation: Directly identifies the mammary developmental phenotype of reduced Tbx3 dosage.
  evidence:

animal_models:
- species: Gallus gallus
  genotype: Smyth line autoimmune-vitiligo-prone chicken
  description: >-
    Smyth-line chickens spontaneously develop autoimmune vitiligo; a subset also
    develops uveitis and visual impairment with choroidal melanocyte loss,
    mononuclear infiltration, and an IFN-gamma-polarized Th1 response. This is a
    mechanistically relevant spontaneous pigmentation-autoimmunity model that
    resembles VKH, not a model that recapitulates the full human diagnostic
    syndrome.
  associated_phenotypes:
  - Autoimmune vitiligo
  - Uveitis
  - Choroidal melanocyte loss
  - Visual impairment
  evidence:
  - reference: PMID:35547230
    reference_title: Immune Activities in Choroids of Visually Impaired Smyth Chickens With Autoimmune Vitiligo.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The immunopathogenesis in SL vision impairment resembles human
      vitiligo-associated ocular diseases, especially Vogt-Koyanagi-Harada
      syndrome and sympathetic ophthalmia.
    explanation: >-
      The authors explicitly identify the ocular autoimmune phenotype as
      resembling VKH while also delimiting it as a cross-disease model.
  - reference: PMID:35547230
    reference_title: Immune Activities in Choroids of Visually Impaired Smyth Chickens With Autoimmune Vitiligo.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Specifically, as in active SLV, the loss of choroidal melanocytes is

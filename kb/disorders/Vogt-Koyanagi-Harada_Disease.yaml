      that corresponds to the inflammation areas
    explanation: >-
      The review directly describes active-phase OCT-A vascular readouts.
- name: Cerebrospinal Fluid Examination
  description: >-
    Lumbar-puncture evidence of lymphocyte-predominant pleocytosis supports
    neurologic involvement and is one of the SUN early-stage neurologic criteria;
    absence does not exclude VKH.
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  results: Lymphocyte-predominant pleocytosis with normal glucose may persist for up to eight weeks.
  evidence:
  - reference: PMID:37834885
    reference_title: Vogt-Koyanagi-Harada Disease and COVID.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cerebrospinal fluid pleocytosis with a predominance of lymphocytes,
      monocytes and normal glucose has been found in more than 80% of patients
      with VKH and may persist for up to eight weeks.
    explanation: >-
      The review describes the supportive CSF profile, frequency, and duration.

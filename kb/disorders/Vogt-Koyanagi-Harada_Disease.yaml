synonyms:
- VKH disease
- Vogt-Koyanagi-Harada syndrome
- Harada disease
description: >-
  Vogt-Koyanagi-Harada disease is a multisystem autoimmune inflammatory disease
  targeting melanin-containing tissues, especially the uvea and choroid, with
  neurologic, auditory, skin, and hair involvement. Disease expression reflects
  immune susceptibility and inflammatory triggers, and early systemic
  immunosuppression is used to prevent chronic recurrent ocular disease.
prevalence:
- population: Reported VKH populations
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: RARE
  rate_low: 0.6
  rate_high: 1.7
  notes: >-
    Review-level estimate expressed as incident cases per 100,000 person-years;
    the underlying populations are not specified in the cited passage, so this
    should not be interpreted as a globally representative rate. RARE is used
    as a coarse qualitative occurrence class calibrated to this low annual
    incidence; the numeric incidence range must not be compared directly with
    point-prevalence bands.
  evidence:
  - reference: PMID:37355662
    reference_title: A randomized non-inferiority trial of therapeutic strategy with immunosuppressants versus biologics for Vogt-Koyanagi-Harada disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It is estimated with an incidence of 0.6 to 1.7 per 100,000 person-years
    explanation: >-
      The review section of the randomized-trial report provides the incidence
      range; the structured record preserves it as annual incidence rather than
      mislabelling it as prevalence.
pathophysiology:
- name: HLA-DRB1-Restricted Melanocyte Antigen Recognition
  role: trigger
  mechanism_confidence: ESTABLISHED
  description: >-
    In HLA-DR4-positive VKH, ocular and circulating CD4-positive T cells recognize
    melanocyte-associated tyrosinase and gp100 peptides. This is direct human
    evidence for antigen-specific adaptive immunity, while the broader initiating
    trigger remains uncertain.
  genes:
  - preferred_term: HLA-DRB1
    term:
      id: hgnc:4948
      label: HLA-DRB1
  cell_types:
  - preferred_term: helper T cell
    term:
      id: CL:0000912
      label: helper T cell
  - preferred_term: melanocyte
    term:
      id: CL:0000148
      label: melanocyte
  biological_processes:
  - preferred_term: adaptive immune response
    term:
      id: GO:0002250
      label: adaptive immune response
    modifier: INCREASED
  - preferred_term: T cell activation
    term:
      id: GO:0042110
      label: T cell activation
    modifier: INCREASED
  evidence:
  - reference: PMID:16723469
    reference_title: Ocular infiltrating CD4+ T cells from patients with Vogt-Koyanagi-Harada disease recognize human melanocyte antigens.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cells infiltrating the eye and PBMCs in HLA-DR4+ (HLA-DRB1*0405, 0410)
      patients with VKH contained a population of CD4+ T lymphocytes that recognized
      tyrosinase and gp100 peptides and produced RANTES and IFN-gamma in response to
      the two peptides.
    explanation: >-
      Patient-derived ocular and blood T-cell clones directly recognized two
      melanocyte peptides in an HLA-DR4-positive context.
  downstream:
  - target: Th1 Effector Cytokine Response
    causal_link_type: DIRECT
    description: >-
      Recognition of tyrosinase and gp100 by patient CD4-positive T cells elicits
      a memory Th1 response with IFN-gamma and RANTES production.
    evidence:
    - reference: PMID:16723469
      reference_title: Ocular infiltrating CD4+ T cells from patients with Vogt-Koyanagi-Harada disease recognize human melanocyte antigens.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The T cells were active memory Th1-type lymphocytes, and they recognized
        the tyrosinase peptide and produced IFN-gamma in response to
        HLA-DRB1*0405+ melanoma cells.
      explanation: >-
        The same patient-derived T-cell experiment directly connects melanocyte
        peptide recognition to a Th1/IFN-gamma effector response.
- name: PRKCD-Associated Immune Susceptibility
  role: trigger
  mechanism_confidence: PROVISIONAL
  description: >-
    PRKCD rs74437127 is associated with VKH susceptibility in a Han Chinese
    case-control cohort. The study did not establish how the locus changes immune
    function in VKH, so its connection to the effector pathway remains provisional.
  genes:
  - preferred_term: PRKCD
    term:
      id: hgnc:9399
      label: PRKCD
  evidence:
  - reference: PMID:36782298
    reference_title: Genetic association of PRKCD and CARD9 polymorphisms with Vogt-Koyanagi-Harada disease in the Chinese Han population.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We found that rs74437127 C allele of PRKCD, rs3812555 CC genotype, and C
      allele of CARD9 were associated with increased susceptibility of VKH
      (Pc = 0.020, OR = 1.624; Pc = 2.04 × 10−5, OR = 1.810; Pc = 2.76 × 10−5,
      OR = 1.698, respectively).
    explanation: >-
      The 912-case/878-control study supports a susceptibility association, not
      a monogenic or experimentally proven causal mechanism.
  downstream:
  - target: Th1 Effector Cytokine Response
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      PRKCD is placed upstream of the T-cell effector response as a susceptibility
      locus, but the intervening functional steps were not established in VKH.
    evidence:
    - reference: PMID:36782298
      reference_title: Genetic association of PRKCD and CARD9 polymorphisms with Vogt-Koyanagi-Harada disease in the Chinese Han population.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Protein kinase C delta (PRKCD) and caspase recruitment domain family
        member 9 (CARD9) are genes involved in B and T cell activation, and
        cytokine production, which are vital mechanisms underlying autoimmune
        disease development.
      explanation: >-
        The paper provides a general immune-function rationale for the
        susceptibility locus, but its case-control data do not establish the
        PRKCD-to-Th1 route in VKH and a PRKCD functional study was unavailable.
- name: CARD9-Associated Pro-inflammatory Cytokine Amplification
  role: contributor
  mechanism_confidence: PROVISIONAL
  description: >-
    The VKH-associated CARD9 rs3812555 CC genotype correlates with higher CARD9
    expression and TNF-alpha production. Functional measurements support a
    cytokine-amplifying correlate, although they were not made in VKH target tissue.
  genes:
  - preferred_term: CARD9
    term:
      id: hgnc:16391
      label: CARD9
  biological_processes:
  - preferred_term: tumor necrosis factor production
    term:
      id: GO:0032640
      label: tumor necrosis factor production
    modifier: INCREASED
  evidence:
  - reference: PMID:36782298
    reference_title: Genetic association of PRKCD and CARD9 polymorphisms with Vogt-Koyanagi-Harada disease in the Chinese Han population.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Functional studies on rs3812555 genotyped individuals revealed that CC
      carriers had significantly higher CARD9 mRNA expression and tumour
      necrosis factor-α production than TC/TT carriers (P = 1.00 × 10−4;
      P = 2.00 × 10−3, respectively).
    explanation: >-
      Genotype-stratified human PBMC assays support increased CARD9 expression
      and TNF-alpha production, with the target-tissue limitation retained.
  downstream:
  - target: Granulomatous Choroidal Inflammation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      CARD9-associated TNF-alpha amplification is a plausible contributor to
      ocular inflammation, but this edge has not been directly demonstrated in
      VKH choroid.
    evidence:
    - reference: PMID:36782298
      reference_title: Genetic association of PRKCD and CARD9 polymorphisms with Vogt-Koyanagi-Harada disease in the Chinese Han population.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We found an association between PRKCD rs74437127 and CARD9 rs3812555
        polymorphisms and VKH susceptibility and revealed that the increased
        susceptibility of rs3812555 for VKH may be mediated by regulating CARD9
        gene expression and the production of pro-inflammatory cytokines, such as
        TNF-α.
      explanation: >-
        The authors propose cytokine-mediated susceptibility, but do not directly
        trace the genotype-to-choroid causal route.

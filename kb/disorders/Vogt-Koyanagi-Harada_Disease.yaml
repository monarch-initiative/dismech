treatments:
- name: Early Systemic Corticosteroids
  action_category: THERAPEUTIC
  description: >-
    High-dose systemic corticosteroids are used early to suppress acute ocular
    and systemic inflammation, commonly followed by early immunomodulatory
    therapy to reduce chronic progression risk.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: corticosteroid
      term:
        id: CHEBI:50858
        label: corticosteroid
  target_phenotypes:
  - preferred_term: Panuveitis
    term:
      id: HP:0012121
      label: Panuveitis
  target_mechanisms:
  - target: Granulomatous Choroidal Inflammation
    treatment_effect: INHIBITS
    description: >-
      High-dose systemic corticosteroids suppress acute intraocular and choroidal
      inflammation; adequate duration and early steroid-sparing therapy are
      important because corticosteroids alone may not prevent chronic evolution.
    evidence:
    - reference: PMID:37834885
      reference_title: Vogt-Koyanagi-Harada Disease and COVID.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In the initial phase, VKH usually responds to high-dose systemic
        corticosteroid therapy.
      explanation: >-
        The review directly supports acute inflammatory response to high-dose
        systemic corticosteroids.
  evidence:
  - reference: PMID:37204477
    reference_title: "Immunosuppressive therapy for Vogt-Koyanagi-Harada disease: a retrospective study and review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatment is usually initiated with corticosteroids followed by an early
      introduction of immunosuppressive treatment (IMT) to achieve immediate
      response after disease presentation, although the choice of IMT for VKH
      can vary.
    explanation: >-
      This clinical review supports systemic corticosteroids as the initial VKH
      treatment backbone.
- name: Combined Immunomodulatory Therapy
  action_category: THERAPEUTIC
  description: >-
    Conventional steroid-sparing immunomodulatory therapy, including agents such
    as mycophenolate mofetil or cyclosporine, is used with low-dose steroids to
    stabilize disease and preserve vision.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: mycophenolate mofetil
      term:
        id: CHEBI:8764
        label: mycophenolate mofetil
    - preferred_term: cyclosporin A
      term:
        id: CHEBI:4031
        label: cyclosporin A
  target_phenotypes:
  - preferred_term: Panuveitis
    term:
      id: HP:0012121
      label: Panuveitis
  target_mechanisms:
  - target: Persistent Subclinical Choroidal Inflammation
    treatment_effect: INHIBITS
    description: >-
      Early mycophenolate or other steroid-sparing immunomodulation is used to
      control clinically overt and subclinical choroidal inflammation and reduce
      chronic recurrent evolution.
    evidence:
    - reference: PMID:34869409
      reference_title: New Perspectives on the Immunopathogenesis and Treatment of Uveitis Associated With Vogt-Koyanagi-Harada Disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        addition of immunomodulatory therapy with mycophenolate mofetil as
        first-line therapy combined with systemic corticosteroids in patients
        with initial-onset acute uveitis associated with VKH disease prevented
        the progression of the disease to chronic recurrent evolution and
        development of complications and “sunset glow fundus.”
      explanation: >-
        Prospective treatment observations support suppression of the chronic
        inflammatory route and its depigmenting complications.
  evidence:
  - reference: PMID:37204477
    reference_title: "Immunosuppressive therapy for Vogt-Koyanagi-Harada disease: a retrospective study and review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      81% (21 of 26 patients) of our patients treated with combined IMT/steroid
      were able to achieve disease stability with significant good visual
      outcome at 24 months (Median VApre-IMT = 0.3 Logmar vs VApost-IMT = 0.0
      Logmar, p = 0.0001).
    explanation: >-
      This retrospective clinical series supports combined immunomodulatory
      therapy and low-dose steroid treatment for VKH disease stability.
  - reference: PMID:37355662
    reference_title: A randomized non-inferiority trial of therapeutic strategy with immunosuppressants versus biologics for Vogt-Koyanagi-Harada disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report that combined with a non-standard corticosteroid regimen,
      cyclosporine-based immunosuppressant strategy is non-inferior to
      adalimumab-based biologic strategy by 26 weeks for visual improvement in a
      cohort of patients with Vogt-Koyanagi-Harada disease, 75% of whom have a
      late-phase disease.
    explanation: >-
      The randomized non-inferiority trial supports cyclosporine-based
      conventional immunosuppression as an evidence-backed therapeutic strategy.
- name: Adalimumab Biologic Therapy
  action_category: THERAPEUTIC
  description: >-
    Adalimumab, an anti-TNF monoclonal antibody, is used for refractory or
    chronic recurrent VKH and is under study for acute VKH in combination with
    glucocorticoids.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: adalimumab
      term:
        id: NCIT:C65216
        label: Adalimumab
  target_phenotypes:
  - preferred_term: Panuveitis
    term:
      id: HP:0012121
      label: Panuveitis
  target_mechanisms:
  - target: CARD9-Associated Pro-inflammatory Cytokine Amplification
    treatment_effect: INHIBITS
    description: >-
      Adalimumab inhibits TNF-alpha, a cytokine implicated in ocular inflammatory
      chemokine, adhesion-molecule, and cytokine networks. The treatment evidence
      supports TNF-pathway inhibition but does not prove CARD9 dependence of
      response.
    evidence:
    - reference: PMID:38849758
      reference_title: Predictive factors and adalimumab efficacy in managing chronic recurrence Vogt-Koyanagi-Harada disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Tumor necrosis factor-alpha (TNF-α) has played a crucial role in the
        development of chemokines, adhesion molecules, and cytokines associated
        with ocular inflammation
      explanation: >-
        The source provides the TNF-alpha inflammatory rationale; observed
        adalimumab response is documented in the treatment-level evidence below.
  evidence:
  - reference: PMID:38849758
    reference_title: Predictive factors and adalimumab efficacy in managing chronic recurrence Vogt-Koyanagi-Harada disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ADA significantly reduced anterior chamber inflammatory cells (P = 0.000)
      and vitreous cavity inflammatory cells (P = 0.001) in the chronic-recurrent
      group, and markedly decreased the recurrence rate in VKH patients (P = 0.009).
    explanation: >-
      This retrospective cohort directly supports adalimumab efficacy in chronic
      recurrent VKH.

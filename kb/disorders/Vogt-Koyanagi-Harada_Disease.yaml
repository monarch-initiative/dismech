datasets:
- accession: geo:GSE148020
  title: Genetic landscape and autoimmunity of monocytes in developing Vogt-Koyanagi-Harada disease
  description: Vogt-Koyanagi-Harada (VKH) disease is a systemic autoimmune disorder affecting multiple organs, including eyes, skin, and central nervous system. It is known that monocytes significantly contribute to the development of autoimmune disease. However, the subset heterogeneity with unique functions and signatures in human circulating monocytes and the identity of disease-specific monocytic populations remain largely unknown. Here, we employed an advanced single-cell RNA sequencing technology to systematically analyze 11259 human circulating monocytes and genetically defined their subpopulations.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  data_type: SINGLE_CELL_RNA_SEQ
  sample_count: 6
  notes: Identified by GEO DataSets index search for Vogt-Koyanagi-Harada Disease (scripts/discover_datasets.py); accession and metadata verified against NCBI E-utilities on 2026-08-01. Title, sample count, and organism are GEO's own values.
discussions:
- discussion_id: gap_vkh_environmental_trigger_causality
  prompt: >-
    Do viral infection, vaccination, or molecular mimicry reproducibly initiate
    melanocyte-antigen-specific T-cell autoimmunity in genetically susceptible
    people, or are the reported temporal associations coincidental or
    disease-unmasking events?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#HLA-DRB1-Restricted Melanocyte Antigen Recognition
  - environmental#SARS-CoV-2 infection or vaccination
  rationale: >-
    Patient-derived T cells recognize tyrosinase and gp100, and some clones in
    one study cross-recognized a cytomegalovirus peptide, but this does not show
    that infection preceded or caused human disease. COVID-19 infection and
    vaccination reports are primarily temporal case observations. Prospective
    exposure ascertainment, population denominators, pre-onset immune samples,
    and antigen-specific clonotype tracking would be needed to distinguish a
    causal trigger from background occurrence or immune unmasking.
  evidence:
  - reference: PMID:34869409
    reference_title: New Perspectives on the Immunopathogenesis and Treatment of Uveitis Associated With Vogt-Koyanagi-Harada Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Efforts to corroborate the latter findings failed so far and the ensemble
      of such studies cautions that an association does not necessarily represent
      a cause
    explanation: >-
      The review explicitly identifies the unresolved distinction between
      infection association and causation.
review_notes: >-
  Completeness and claim-evidence review performed 2026-08-08 after consuming
  the Falcon deep-research report and its citation sidecar. DOI citations with
  available PubMed records were migrated to PMID caches so exact snippets could
  be checked. A D2P comparison surfaced numerous ORDO-only features, including
  nonspecific or apparently conflated findings such as short stature and
  cognitive impairment; these were not imported without independent VKH-specific
  evidence. Directly supported additions were limited to core ocular,
  neurologic, auditory, integumentary, diagnostic, histopathologic, biomarker,
  and model-system findings. The GEO dataset is retained as a discoverable
  resource without treating its uncited metadata summary as claim-level evidence.

progression:
- phase: Prodromal neurologic and auditory phase
  duration: 3-5 days
  notes: >-
    Nonspecific systemic symptoms, meningismus, headache, dizziness, orbital
    pain, photophobia, tearing, and scalp hypersensitivity can precede ocular
    inflammation; rare focal neurologic manifestations are reported.
  evidence:
  - reference: PMID:37834885
    reference_title: Vogt-Koyanagi-Harada Disease and COVID.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Prodromal stage: This usually lasts for 3–5 days and is characterised by
      nonspecific symptoms, such as malaise, fever, nausea, headache,
      meningismus, dizziness and orbital pain
    explanation: >-
      The review directly states the stage duration and typical prodromal
      manifestations.
- phase: Acute uveitic phase
  duration: weeks
  notes: >-
    Acute VKH follows the prodrome by days and lasts weeks. Multifocal choroiditis
    causes posterior choroidal thickening, optic-disc hyperemia or edema, RPE
    breakdown, and potentially confluent serous retinal detachment; untreated
    inflammation can extend to granulomatous anterior uveitis.
  evidence:
  - reference: PMID:37834885
    reference_title: Vogt-Koyanagi-Harada Disease and COVID.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Acute uveitic stage: This appears a few days after the prodromal phase and
      lasts for several weeks. During this period, the patient mainly complains of
      blurred vision, pain and central scotoma, and most patients present with
      bilateral posterior uveitis.
    explanation: >-
      The review directly defines the timing, duration, symptoms, and bilateral
      posterior inflammatory presentation of the acute phase.
- phase: Convalescent depigmentation phase
  duration: months to years
  notes: >-
    Uveal and integumentary depigmentation can emerge over months or years,
    including sunset glow fundus, vitiligo, and poliosis. These changes should
    not be assumed to represent biologically inactive convalescence because
    subclinical choroidal inflammation can persist.
  evidence:
  - reference: PMID:37834885
    reference_title: Vogt-Koyanagi-Harada Disease and COVID.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Chronic (or convalescent) stage: This lasts for months or even years and
      results in integumentary and uveal depigmentation.
    explanation: >-
      The review directly states the stage duration and depigmenting outcome.
- phase: Chronic recurrent phase
  notes: >-
    Recurrent, mainly anterior granulomatous uveitis can coexist with active
    choroiditis detectable on ICGA or EDI-OCT. Cataract, glaucoma,
    neovascularization, and subretinal fibrosis accumulate in this phase; poor
    initial acuity, older onset, and sunset glow fundus are prognostic signals in
    retrospective data.
  evidence:
  - reference: PMID:38849758
    reference_title: Predictive factors and adalimumab efficacy in managing chronic recurrence Vogt-Koyanagi-Harada disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Poor initial BCVA (P = 0.046) and the occurrence of “sunset glow fundus”
      (P = 0.040) were significantly associated with progression to the chronic
      recurrent phase.
    explanation: >-
      This retrospective cohort identifies clinical predictors of chronic
      recurrent VKH.
diagnosis:
- name: Clinical Classification Criteria and Mandatory Exclusions
  description: >-
    No single test establishes VKH. Revised Diagnostic Criteria classify
    complete, incomplete, and probable disease, while SUN criteria distinguish
    early- and late-stage patterns. A compatible presentation requires exclusion
    of antecedent ocular trauma or vitreoretinal surgery, treponemal infection,
    and sarcoidosis.
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  results: >-
    Early SUN classification uses bilateral retinal detachment or characteristic
    uveitis with at least two neurologic/auditory findings; late classification
    uses sunset glow fundus or characteristic uveitis with at least one cutaneous
    depigmenting finding.
  evidence:
  - reference: PMID:37834885
    reference_title: Vogt-Koyanagi-Harada Disease and COVID.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There is no single diagnostic test for VKH disease, and its diagnosis is
      mainly based on clinical features and either systemic or ocular findings.
    explanation: >-
      The review explicitly states that diagnosis is syndromic rather than based
      on one definitive assay.
  - reference: PMID:37834885
    reference_title: Vogt-Koyanagi-Harada Disease and COVID.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      According to SUN, early-stage features include bilateral retinal detachment
      or characteristic uveitis with at least two of the following neurological
      criteria: headache, dysacusis, meningism, pleocytosis of the cerebrospinal
      fluid and tinnitus. Late-stage features include sunset glow fundus or
      characteristic uveitis with at least one of the following cutaneous
      findings: vitiligo, poliosis or alopecia.
    explanation: >-
      This passage directly supports the detailed early- and late-stage SUN
      classification algorithm summarized in the results field.
  - reference: PMID:37834885
    reference_title: Vogt-Koyanagi-Harada Disease and COVID.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It is also mandatory to exclude previous ocular trauma, vitreoretinal
      surgery and positive treponemal syphilis serology or evidence of sarcoidosis
    explanation: >-
      The SUN summary specifies the mandatory exclusions that separate VKH from
      major infectious, granulomatous, and post-traumatic mimics.
- name: Fluorescein and Indocyanine Green Angiography
  description: >-
    Fluorescein angiography identifies early pinpoint hyperfluorescence followed
    by leakage and subretinal pooling. ICGA detects diffuse hypercyanescence,
    delayed choroidal perfusion, and hypocyanescent stromal inflammatory foci,
    including occult choroidal activity.
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  results: >-
    Concordant angiographic evidence supports diffuse choroiditis and maps the
    extent and activity of inflammation.
  evidence:
  - reference: PMID:37834885
    reference_title: Vogt-Koyanagi-Harada Disease and COVID.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Fluorescein angiography (FAG), in the early stage of the disease, shows
      multifocal choroiditis with multiple areas of early pinpoint
      hyperfluorescence followed by late leakage and pooling at the intraretinal
      or subretinal fluid level.
    explanation: >-
      The review directly describes the characteristic early fluorescein pattern.
  - reference: PMID:37834885
    reference_title: Vogt-Koyanagi-Harada Disease and COVID.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the initial phase, ICGA demonstrates a diffuse hypercyanescence, and in
      the intermediate and late phases, delayed choroidal perfusion and
      hypocyanescent lesions represent choroidal stromal inflammatory foci that
      cannot be highlighted by an ophthalmoscopic examination
    explanation: >-
      ICGA detects choroidal stromal inflammation that can be invisible on direct
      fundus examination.
- name: EDI-OCT and OCT Angiography
  description: >-
    EDI-OCT and OCT measure choroidal thickening even without serous detachment
    and can monitor treatment response. OCT angiography noninvasively shows
    reduced vessel density and focal vascular dropout in active inflammation.
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  results: >-
    Choroidal thickness and vascular-density changes support early diagnosis and
    longitudinal inflammatory monitoring but are interpreted with the full
    clinical syndrome.
  evidence:
  - reference: PMID:37834885
    reference_title: Vogt-Koyanagi-Harada Disease and COVID.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      EDI and OCT have demonstrated choroidal thickening in patients with
      early-stage VKH, even if a serous detachment is absent.
    explanation: >-
      The review identifies a diagnostic imaging abnormality that can precede or
      occur without serous detachment.
  - reference: PMID:37834885
    reference_title: Vogt-Koyanagi-Harada Disease and COVID.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      During the active phase, OCT-A demonstrates decreased choroidal and retinal

classifications:
  harrisons_chapter:
  - classification_value: IMMUNE_RHEUMATOLOGIC
    notes: >-
      A primary immunodeficiency; Harrison's covers the primary
      immunodeficiency diseases in the immunology/rheumatology Part.
    evidence:

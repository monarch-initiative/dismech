      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        B-cell intrinsic immunoglobulin class switch recombination (Ig-CSR)
        deficiencies, previously termed hyper-IgM syndromes, are genetically
        determined conditions characterized by normal or elevated serum IgM
        levels and an absence or very low levels of IgG, IgA, and IgE.
      explanation: >-
        Places the Ig-CSR deficiencies, which include UNG deficiency
        (Ig-CSR deficiency 2 in this review), among the genetically determined
        immunodeficiency disorders of the immunologic Part.

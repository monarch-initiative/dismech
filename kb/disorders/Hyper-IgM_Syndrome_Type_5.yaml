genetic:
- name: UNG
  notes: >-
    UNG (12q24.11) encodes uracil-DNA glycosylase, produced as a mitochondrial
    isoform (UNG1) and a nuclear isoform (UNG2); UNG2 is the species required in
    activated B cells. Biallelic loss-of-function variants cause HIGM5. Reported
    alleles include truncating frameshift and nonsense variants yielding
    catalytically dead or absent protein, and the F251S missense allele, whose
    protein is enzymatically competent in bacteria but mistargeted to
    mitochondria and degraded in mammalian B cells, leaving only trace nuclear
    activity. No dominant-negative or gain-of-function mechanism is established.
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: UNG
    term:
      id: hgnc:12572
      label: UNG
  association: Causative
  variants:
  - name: UNG F251S
    type: missense
    description: >-
      Homozygous Phe251Ser missense substitution in the UNG catalytic domain.
      The purified enzyme is active and stable in vitro, but in mammalian cells
      it is aberrantly sorted to mitochondria and degraded, so only ~0.4% of
      normal nuclear uracil-excision activity remains — explaining the hyper-IgM
      phenotype despite retained intrinsic catalytic capacity.
    gene:
      preferred_term: UNG
      term:
        id: hgnc:12572
        label: UNG
    evidence:
    - reference: PMID:15967827
      reference_title: "B cells from hyper-IgM patients carrying UNG mutations lack ability to remove uracil from ssDNA and have elevated genomic uracil."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        it was mistargeted to mitochondria and degraded in mammalian cells
      explanation: >-
        Characterizes the F251S allele as an expression/localization defect
        rather than a loss of intrinsic catalytic activity.
  evidence:
  - reference: PMID:12958596
    reference_title: "Human uracil-DNA glycosylase deficiency associated with profoundly impaired immunoglobulin class-switch recombination."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      recessive mutations of the gene encoding uracil-DNA glycosylase (UNG) are
      associated with profound impairment in CSR at a DNA precleavage step
    explanation: >-
      The gene-discovery study identifying recessive UNG mutations as the cause
      of HIGM5.
diagnosis:
- name: Serum immunoglobulin quantitation and class-switch evaluation
  description: >-
    Diagnosis rests on the serum profile (normal/elevated IgM with low IgG and
    IgA), normal total B-cell numbers with reduced class-switched memory B
    cells, poor specific antibody responses, and biallelic UNG variants, after
    excluding the more common CD40L form by CD40L expression/binding assays.
  notes: >-
    No HIGM5-specific diagnostic criteria exist; evaluation follows the general
    hyper-IgM/CSR-deficiency work-up. Molecular confirmation uses a hyper-IgM /
    primary-antibody-deficiency gene panel including CD40LG, CD40, AICDA and UNG.
treatments:
- name: Immunoglobulin Replacement Therapy
  description: >-
    Regular intravenous or subcutaneous IgG replacement is the mainstay,
    supplying the switched antibody patients cannot make and reducing infection
    frequency. It does not correct the underlying enzymatic defect.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: immunoglobulin replacement therapy
    term:
      id: NCIT:C62710
      label: Immunoglobulin Therapy
    therapeutic_agent:
    - preferred_term: human immunoglobulin G
      term:
        id: NCIT:C80829
        label: Human Immunoglobulin G
  target_mechanisms:
  - target: Defective Opsonizing and Mucosal Antibody Defense
    treatment_effect: BYPASSES
    description: >-
      Passive IgG supplies the opsonizing antibody the patient cannot generate,
      bypassing rather than repairing the class-switch block.
  notes: >-
    No HIGM5-specific controlled trial exists; immunoglobulin replacement
    follows general primary-antibody-deficiency practice, so no evidence item is
    attached rather than citing a source that does not address HIGM5.
- name: Antibiotic Therapy and Prophylaxis
  description: >-
    Antibiotics treat the recurrent bacterial infections, and prophylactic
    regimens may be added alongside immunoglobulin replacement when infection
    continues.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: antibiotic therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
  target_mechanisms:
  - target: Defective Opsonizing and Mucosal Antibody Defense
    treatment_effect: INHIBITS
    description: >-
      Antibiotics eradicate or suppress the bacterial infections the missing
      switched antibody cannot prevent or clear.
  notes: >-
    No HIGM5-specific antibiotic trial exists; use follows general
    primary-antibody-deficiency practice, so no evidence item is attached.
differential_diagnoses:
- name: Hyper-IgM syndrome type 2 (AID deficiency)
  description: >-
    AID (AICDA) deficiency is the closest phenocopy — the same B-cell-intrinsic
    CSR block, the same lymphoid hyperplasia, and the same bacterial
    susceptibility — because UNG acts immediately downstream of AID in the same
    pathway. Somatic hypermutation is generally more severely reduced or absent
    in AID deficiency, whereas UNG deficiency distorts the SHM spectrum rather
    than abolishing it. The two are separated by the causal gene.
  disease_term:
    preferred_term: hyper-IgM syndrome type 2
    term:
      id: MONDO:0011528
      label: hyper-IgM syndrome type 2
  distinguishing_features:
  - Biallelic AICDA versus biallelic UNG variants.
  - SHM typically absent/severely reduced in AID deficiency, distorted (spectrum shift) in UNG deficiency.
  evidence:
  - reference: PMID:15661022
    reference_title: "Hyper-immunoglobulin M syndromes caused by intrinsic B-lymphocyte defects."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      the observation that uracil-DNA-glycosylase deficiency leads to a severe
      hyper-IgM syndrome strongly argues in favor of a DNA-editing activity of AID
    explanation: >-
      Places UNG deficiency in the same AID-dependent CSR pathway as AID
      deficiency, the basis for their close resemblance.
- name: Hyper-IgM syndrome type 1 (CD40 ligand deficiency)
  description: >-
    The X-linked CD40LG defect produces the same serum pattern but, because it
    additionally loses T-cell licensing of macrophages and dendritic cells,
    carries opportunistic and fungal infection, neutropenia and sclerosing
    cholangitis — none characteristic of the B-cell-intrinsic UNG defect.
  disease_term:
    preferred_term: hyper-IgM syndrome type 1
    term:
      id: MONDO:0010626
      label: hyper-IgM syndrome type 1
  distinguishing_features:
  - X-linked (males) versus autosomal recessive.
  - Opportunistic infection, neutropenia and sclerosing cholangitis point to CD40L deficiency, not UNG deficiency.
  evidence:
  - reference: PMID:15358621
    reference_title: "Molecular analysis of a large cohort of patients with the hyper immunoglobulin M (IgM) syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We found mutations of CD40L in 98 males; AICDA in 4 patients (3 males, 1
      female); UNG in one adult male; and Btk in 3 boys.
    explanation: >-
      In a molecular hyper-IgM cohort CD40L deficiency dominates and UNG
      deficiency is rare, the clinical prior that drives the work-up order.
- name: Hyper-IgM syndrome type 3 (CD40 deficiency)
  description: >-
    Biallelic CD40 loss is the autosomal recessive phenocopy of CD40L
    deficiency and shares its combined-immunodeficiency, opportunistic-infection
    profile, which separates it from the antibody-only UNG defect.
  disease_term:
    preferred_term: hyper-IgM syndrome type 3
    term:
      id: MONDO:0011735
      label: hyper-IgM syndrome type 3
  distinguishing_features:
  - Autosomal recessive like UNG deficiency, but with the opportunistic infections of a CD40-axis defect.
  - IUIS places CD40 deficiency in Table 1 (combined immunodeficiency) rather than among the predominantly antibody deficiencies.
progression:
- phase: Onset and course
  age_range: Biological onset congenital; clinical onset variable, infancy to adolescence
  notes: >-
    Biallelic variants are present from conception, but clinical onset is
    variable and HIGM5 may present later than CD40L deficiency. The course is a
    chronic lifelong immunodeficiency with episodic bacterial infection
    superimposed on persistent immunoglobulin abnormalities. Long-term
    complications such as chronic airway damage are expected from other
    antibody deficiencies but have not been documented in published HIGM5
    patients. No validated staging system exists, and spontaneous remission is
    not expected.
clinical_burden:
  burden_level: MODERATE
  rationale: >-
    The infectious burden is largely correctable by immunoglobulin replacement,
    and because T-cell and myeloid function are preserved there is no
    opportunistic-infection or sclerosing-cholangitis mortality driver as in the
    CD40-axis forms. Residual burden comes from recurrent bacterial infection,
    lymphoid hyperplasia, and the lifelong demand of replacement therapy and
    monitoring. HIGM5-specific survival data do not
    exist; prognosis is considered better than in the CD40/CD40L disorders.
animal_models:
- name: Ung-knockout mouse
  species: Mouse
  genotype: Ung(-/-) null
  publication: PMID:12401169
  description: >-
    Gene-targeted Ung-null mice reproduce the mechanism but not the full human
    severity: class-switch recombination is only partly inhibited (a
    mismatch-repair backup operates in mice), and somatic hypermutation at G:C
    pairs is shifted strongly toward transitions. Aged Ung-null mice develop
    B-cell lymphomas, a finding specific to the mouse that should not be read as
    a demonstrated human cancer risk.
  modeled_mechanisms:
  - target: Altered Somatic Hypermutation Spectrum
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: >-
      Ung-null mice reproduce the directional skew of the SHM spectrum (excess
      G:C transitions, reduced transversions).
    limitations: >-
      Mouse class-switch recombination is only partly inhibited, unlike the
      profound human block, because a mismatch-repair backup operates in mice;
      so the model understates the human CSR defect.
    readouts:
    - name: G:C transition fraction during somatic hypermutation
      target: Altered Somatic Hypermutation Spectrum
      direction: INCREASED
      interpretation: >-
        Loss of abasic-site formation shifts G:C-pair mutations toward
        transitions, the structural correlate of the SHM-spectrum node.
      evidence:
      - reference: PMID:12401169
        reference_title: "Immunoglobulin isotype switching is inhibited and somatic hypermutation perturbed in UNG-deficient mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          mutations at dC/dG pairs are dramatically shifted toward transitions
          (95%)
        explanation: Quantifies the transition-biased SHM spectrum in the model.
  - target: Impaired Class-Switch Recombination
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Switching is inhibited in Ung-null mice but not abolished, so the model
      only partly recapitulates the profound human CSR block.
    limitations: >-
      A mismatch-repair backup leaves murine CSR substantially but not totally
      inhibited, whereas human UNG deficiency produces a profound precleavage
      block; the model therefore underrepresents the human phenotype's severity.
    evidence:
    - reference: PMID:12401169
      reference_title: "Immunoglobulin isotype switching is inhibited and somatic hypermutation perturbed in UNG-deficient mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Class-switch recombination is substantially, but not totally, inhibited.
      explanation: >-
        Documents the partial, not complete, CSR inhibition that distinguishes
        the mouse from the human disease.
  evidence:
  - reference: PMID:12934097
    reference_title: "Gene-targeted mice lacking the Ung uracil-DNA glycosylase develop B-cell lymphomas."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      a greatly increased incidence of B-cell lymphomas in older Ung-deficient mice
    explanation: >-
      A second Ung-null mouse line develops B-cell lymphomas with age; recorded
      here as a model-organism finding only, not a demonstrated human cancer risk.
discussions:
- discussion_id: higm5_cancer_risk_only_model_organism
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Failure of Switch-Region Uracil Excision
  prompt: >-
    Does the elevated genomic uracil and lymphomagenesis seen in aged
    Ung-knockout mice translate into an increased malignancy risk in human UNG
    deficiency?
  rationale: >-
    Aged Ung-null mice develop B-cell lymphomas, and patient B-cell lines
    accumulate genomic uracil, so a lymphoma risk is mechanistically plausible.
    But the lymphoma phenotype is demonstrated only in the mouse, the human
    cohort is tiny, and no quantitative human HIGM5 cancer incidence has been
    established. Whether the mouse finding reflects human risk or a
    species-specific consequence of chronic genomic-uracil load is unresolved.
  proposed_experiments:
  - experiment_id: higm5_malignancy_surveillance
    experiment_design: HUMAN_OBSERVATIONAL
    name: Long-term malignancy surveillance of molecularly confirmed UNG-deficient patients
    description: >-
      Pooled longitudinal follow-up of the small confirmed HIGM5 cohort to
      estimate lymphoma/malignancy incidence against age-matched expectation.
- discussion_id: higm5_population_prevalence_unknown
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - prevalence#Worldwide
  prompt: >-
    What is the true population prevalence and carrier frequency of UNG
    deficiency?
  rationale: >-
    Every reported figure is a referral-based case count; Orphanet lists
    prevalence as unavailable and the F251S allele is extremely rare in
    population databases. Because the disease is autosomal recessive and the
    infectious phenotype is milder than CD40L deficiency, under-ascertainment is
    plausible, but no denominator-based study has been done.

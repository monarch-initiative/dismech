name: Hyper-IgM Syndrome Type 5
creation_date: "2026-10-18T00:00:00Z"
category: Mendelian
synonyms:
- HIGM5
- UNG hyper-IgM syndrome
- hyper-IgM syndrome 5
- hyper-IgM syndrome due to UNG deficiency
- hyper-IgM syndrome due to uracil N-glycosylase
- uracil-DNA glycosylase deficiency
- immunodeficiency with hyper IgM, type 5
description: >-
  Hyper-IgM syndrome type 5 (HIGM5) is a primary antibody deficiency caused by
  biallelic loss-of-function variants in UNG, encoding uracil-DNA glycosylase.
  It is one of the B-cell-intrinsic immunoglobulin class-switch recombination
  (CSR) deficiencies and shares the hyper-IgM serum signature with the other
  forms: normal or elevated IgM with severely reduced IgG and IgA (and
  typically low IgE), normal numbers of circulating B cells, and recurrent
  bacterial infection with lymphoid hyperplasia. The lesion sits one step
  downstream of activation-induced cytidine deaminase (AID). AID deaminates
  cytosine to uracil in single-stranded DNA at the immunoglobulin switch and
  variable regions; the nuclear isoform of UNG (UNG2) then excises that uracil,
  generating the abasic sites that downstream repair enzymes convert into the
  switch-region DNA breaks required for CSR. When UNG is absent, unstable, or
  mistargeted, the AID-generated uracil is not efficiently removed, so CSR fails
  at a DNA precleavage step and the somatic-hypermutation spectrum is distorted
  rather than abolished.

  SCOPE AND CONTRAST. The defect is B-cell intrinsic, so — like AID deficiency
  (HIGM2) and unlike the CD40L (HIGM1) and CD40 (HIGM3) forms — T-cell and
  myeloid CD40 signalling is preserved and patients are not characteristically
  susceptible to the opportunistic infections of the CD40-axis defects. The
  IUIS 2024 classification records this: UNG deficiency sits in Table 3
  (predominantly antibody deficiencies), in the hyper-IgM section, whereas
  CD40LG and CD40 deficiency sit in Table 1 (combined immunodeficiencies).
  Only a handful of molecularly confirmed patients have been reported, so
  frequencies in this entry are qualitative; the deepest evidence is the
  original three-patient series and the biochemical studies of those patients'
  B-cell lines, supplemented by Ung-knockout mouse and engineered-B-cell data
  that are noted as such.

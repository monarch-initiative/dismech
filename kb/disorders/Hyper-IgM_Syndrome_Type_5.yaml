inheritance:
- name: Autosomal recessive inheritance
  description: >-
    HIGM5 is inherited as an autosomal recessive trait, caused by biallelic
    (homozygous or compound-heterozygous) loss-of-function variants in UNG.
    Consanguinity was documented in reported families.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:12958596
    reference_title: "Human uracil-DNA glycosylase deficiency associated with profoundly impaired immunoglobulin class-switch recombination."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      recessive mutations of the gene encoding uracil-DNA glycosylase (UNG) are
      associated with profound impairment in CSR at a DNA precleavage step and
      with a partial disturbance of the SHM pattern in three patients with
      hyper-IgM syndrome
    explanation: >-
      The gene-discovery study establishes recessive UNG mutations as the cause
      of the hyper-IgM phenotype.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population-based prevalence estimate for HIGM5 exists; Orphanet lists
    prevalence as unavailable. The disease is known from a small number of
    molecularly confirmed patients: the original report described three
    unrelated patients, and in a molecular survey of 140 hyper-IgM patients
    only a single adult male had a UNG mutation. These are referral-based
    counts, not denominators, so no rate per 100,000 is asserted.
  evidence:
  - reference: PMID:15358621
    reference_title: "Molecular analysis of a large cohort of patients with the hyper immunoglobulin M (IgM) syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We found mutations of CD40L in 98 males; AICDA in 4 patients (3 males, 1
      female); UNG in one adult male; and Btk in 3 boys.
    explanation: >-
      In a 140-patient hyper-IgM cohort a single patient had a UNG mutation,
      illustrating the rarity of HIGM5 relative to the CD40L form.
pathophysiology:
- name: UNG Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Uracil-DNA glycosylase is encoded by UNG, which produces a mitochondrial
    isoform (UNG1) and a nuclear isoform (UNG2); UNG2 is induced in activated
    germinal-center B cells. It hydrolyses the N-glycosidic bond of uracil in
    DNA, initiating base-excision repair by creating an abasic (AP) site.
    Biallelic UNG variants abolish or severely reduce this nuclear activity:
    truncating alleles yield catalytically dead protein, and the F251S missense
    allele produces an enzyme that is active in vitro but mistargeted to
    mitochondria and degraded in B cells, leaving only trace residual activity.
    This molecular lesion is the single upstream cause of the downstream
    class-switch and hypermutation defects.
  cell_types:
  - preferred_term: Germinal center B cell
    term:
      id: CL:0000844
      label: germinal center B cell
  genes:
  - preferred_term: UNG
    term:
      id: hgnc:12572
      label: UNG
  molecular_functions:
  - preferred_term: uracil DNA N-glycosylase activity
    term:
      id: GO:0004844
      label: uracil DNA N-glycosylase activity
    modifier: DECREASED
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  downstream:
  - target: Failure of Switch-Region Uracil Excision
    description: >-
      Loss of nuclear UNG removes the enzyme that excises AID-generated uracil
      from immunoglobulin switch-region DNA.
    evidence:
    - reference: PMID:12958596
      reference_title: "Human uracil-DNA glycosylase deficiency associated with profoundly impaired immunoglobulin class-switch recombination."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        these data support a model of CSR and SHM in which AID deaminates
        cytosine into uracil in targeted DNA (immunoglobulin switch or variable
        regions), followed by uracil removal by UNG
    - reference: PMID:15967827
      reference_title: "B cells from hyper-IgM patients carrying UNG mutations lack ability to remove uracil from ssDNA and have elevated genomic uracil."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        In B cell lines from hyper-IgM patients carrying UNG mutations, the
        single-strand-specific uracil-DNA glycosylase, SMUG1, cannot complement
        this function.
      explanation: >-
        Patient B-cell lines (the same three patients as the gene-discovery
        report, not an independent cohort) show the backup glycosylase SMUG1
        cannot substitute for lost nuclear UNG.
  evidence:
  - reference: PMID:15967827
    reference_title: "B cells from hyper-IgM patients carrying UNG mutations lack ability to remove uracil from ssDNA and have elevated genomic uracil."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      the UNG mutations lead to increased accumulation of genomic uracil
    explanation: >-
      Biochemical study of patient B-cell lines (shared with the discovery
      series) confirms functional loss of UNG with accumulation of genomic
      uracil.
- name: Failure of Switch-Region Uracil Excision
  biological_scale: MOLECULAR
  description: >-
    AID converts cytosine to uracil in single-stranded DNA at transcribed
    switch and variable regions. Without UNG, that uracil is not efficiently
    removed. The AID-directed step depends specifically on UNG being recruited
    to RPA-coated single-stranded DNA, a function separable from canonical
    repair of uracil in double-stranded genomic DNA. The unexcised U:G lesions
    propagate into the two downstream antibody-diversification failures.
  biological_processes:
  - preferred_term: base-excision repair, AP site formation via deaminated base removal
    term:
      id: GO:0097510
      label: "base-excision repair, AP site formation via deaminated base removal"
    modifier: DECREASED
  downstream:
  - target: Impaired Class-Switch Recombination
    description: >-
      Reduced excision of switch-region uracil yields fewer abasic sites and
      the DNA nicks and double-strand breaks CSR requires.
    evidence:
    - reference: PMID:17560278
      reference_title: "Pathophysiology of B-cell intrinsic immunoglobulin class switch recombination deficiencies."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        the AID-UNG pathway directly targets DNA of switch regions from the Ig
        heavy-chain locus to induce the CSR process
      explanation: >-
        The review places UNG action on switch-region DNA as the step that
        initiates class-switch recombination, so loss of uracil excision there
        blocks CSR.
  - target: Altered Somatic Hypermutation Spectrum
    description: >-
      Persistence of unexcised U:G lesions skews the point-mutation spectrum
      introduced during somatic hypermutation.
    evidence:
    - reference: PMID:31507588
      reference_title: "Repertoire Sequencing of B Cells Elucidates the Role of UNG and Mismatch Repair Proteins in Somatic Hypermutation in Humans."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Patients with MMR or UNG deficiency have reduced frequency and altered
        patterns of SHM in line with a five-pathway model to generate SHM.
      explanation: >-
        Repertoire sequencing shows an altered SHM pattern in UNG deficiency.
        The UNG-specific data come from a single patient within a mixed
        MMR/UNG cohort.
  evidence:
  - reference: PMID:38000394
    reference_title: "RPA guides UNG to uracil in ssDNA to facilitate antibody class switching and repair of mutagenic uracil at the replication fork."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We show that the UNG:RPA interaction plays a crucial role in both CSR and
      repair of AID-induced uracil at the Ig loci.
    explanation: >-
      Engineered B-cell clones show UNG recruitment to RPA-coated ssDNA is
      required for CSR and for repair of AID-induced uracil at the Ig loci.
- name: Impaired Class-Switch Recombination
  conforms_to: "germinal_center_reaction#Germinal Center Reaction"
  biological_scale: CELLULAR
  description: >-
    The block is at a DNA precleavage step: without efficient uracil excision,
    switch regions are not cut, so recombination from Cmu to the downstream
    Cgamma, Calpha or Cepsilon constant regions fails. In human UNG deficiency
    this failure is profound, more severe than in the Ung-knockout mouse, where
    a mismatch-repair backup leaves switching only partly inhibited.
  biological_processes:
  - preferred_term: isotype switching
    term:
      id: GO:0045190
      label: isotype switching
    modifier: DECREASED
  cell_types:
  - preferred_term: Germinal center B cell
    term:
      id: CL:0000844
      label: germinal center B cell
  downstream:
  - target: Impaired immunoglobulin class-switch recombination
    description: >-
      The precleavage block manifests as a measurable failure of in-vitro
      class-switch recombination in patient B cells.
  - target: Loss of Class-Switched Serum Antibody
    description: >-
      Failure to switch constant regions prevents production of IgG, IgA and
      IgE and leaves IgM as the dominant isotype.
    evidence:
    - reference: PMID:17116429
      reference_title: "Uracil in DNA--general mutagen, but normal intermediate in acquired immunity."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        In humans, UNG-deficiency results in the hyper IgM syndrome
        characterized by recurrent infections, lymphoid hyperplasia, extremely
        low IgG, IgA and IgE and elevated IgM.
      explanation: >-
        The review links UNG deficiency to the switched-isotype deficit with
        preserved or raised IgM, which is the output of the CSR block.
  - target: Reduced Class-Switched Memory B Cells
    description: >-
      Cells that fail to complete class switching do not populate the
      switched-memory compartment.
    evidence:
    - reference: PMID:33276124
      reference_title: "Class Switch Recombination Defects: impact on B cell maturation and antibody responses."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        CSRD patients showed uniformly absent or markedly reduced switched
        memory B cells (IgM-IgD-CD27+).
      explanation: >-
        In class-switch recombination defects, including UNG deficiency,
        switched-memory B cells are absent or markedly reduced.
  - target: Germinal Center and Lymphoid Hyperplasia
    description: >-
      B cells that cannot complete switching keep being driven by antigen,
      enlarging germinal centers and lymph nodes.
    evidence:
    - reference: PMID:15967827
      reference_title: "B cells from hyper-IgM patients carrying UNG mutations lack ability to remove uracil from ssDNA and have elevated genomic uracil."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: >-
        similar to those associated with AID deficiency, including
        susceptibility to bacterial infections and lymphoid hyperplasia
      explanation: >-
        Pairs the CSR-defect phenotype of UNG-deficient patients with lymphoid
        hyperplasia, as in AID deficiency. The sentence is the paper's framing
        of the patients' clinical picture, not its own experimental result.
  evidence:
  - reference: PMID:12958596
    reference_title: "Human uracil-DNA glycosylase deficiency associated with profoundly impaired immunoglobulin class-switch recombination."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      recessive mutations of the gene encoding uracil-DNA glycosylase (UNG) are
      associated with profound impairment in CSR at a DNA precleavage step
    explanation: >-
      The discovery study localises the CSR block to a DNA precleavage step.
  - reference: PMID:12401169
    reference_title: "Immunoglobulin isotype switching is inhibited and somatic hypermutation perturbed in UNG-deficient mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: >-
      Class-switch recombination is substantially, but not totally, inhibited.
    explanation: >-
      In Ung-knockout mice switching is only partly inhibited; the human defect
      is more severe, so the mouse supports the mechanism indirectly rather than
      recapitulating the human phenotype.
- name: Altered Somatic Hypermutation Spectrum
  biological_scale: MOLECULAR
  description: >-
    UNG deficiency does not abolish somatic hypermutation but distorts its
    spectrum. Unexcised U:G lesions persist and favour replication-associated
    G:C transitions, while the loss of abasic-site formation reduces G:C
    transversions. In the mouse this shows as a shift to ~95% transitions at
    G:C pairs; a single human UNG-deficient repertoire showed the same
    directional skew.
  biological_processes:
  - preferred_term: somatic hypermutation of immunoglobulin genes
    term:
      id: GO:0016446
      label: somatic hypermutation of immunoglobulin genes
    modifier: ABNORMAL
  evidence:
  - reference: PMID:12401169
    reference_title: "Immunoglobulin isotype switching is inhibited and somatic hypermutation perturbed in UNG-deficient mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: >-
      In ung(-/-) animals, mutations at dC/dG pairs are dramatically shifted
      toward transitions (95%), indicating that the generation of abasic sites
      (which can induce transversions) has been inhibited.
    explanation: >-
      The Ung-knockout mouse defines the spectrum shift; the direction is
      confirmed in a single human patient (PMID:31507588) but the quantitative
      mouse figure is not human data.
- name: Loss of Class-Switched Serum Antibody
  biological_scale: ORGANISM
  description: >-
    The CSR block produces the diagnostic serum profile — severely reduced IgG
    and IgA with low IgE and normal or elevated IgM — and leaves patients
    unable to mount switched, high-affinity antibody responses to protein and
    polysaccharide antigens, impairing opsonization and mucosal defence.
  downstream:
  - target: Increased circulating IgM level
    description: IgM is not converted to downstream isotypes and accumulates.
  - target: Decreased circulating IgG concentration
    description: Failure to switch to Cgamma abolishes normal IgG production.
  - target: Decreased circulating IgA concentration
    description: Failure to switch to Calpha abolishes normal IgA production.
  - target: Decreased circulating IgE concentration
    description: Failure to switch to Cepsilon leaves IgE low or absent.
  - target: Impaired specific antibody response
    description: >-
      Without class switching, antigen-specific IgG responses to vaccines and
      neoantigens are poor.
    evidence:
    - reference: PMID:33276124
      reference_title: "Class Switch Recombination Defects: impact on B cell maturation and antibody responses."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Antibody response to phage was remarkably decreased with lack of memory
        amplification and class-switching in immunized CD40L, UNG deficient, and
        NEMO patients.
      explanation: >-
        UNG-deficient patients immunized with a neoantigen mounted a markedly
        decreased antibody response without class switching.
  - target: Defective Opsonizing and Mucosal Antibody Defense
    description: >-
      Loss of switched IgG and secretory IgA removes opsonizing and mucosal
      antibody protection against encapsulated bacteria.
  evidence:
  - reference: PMID:17116429
    reference_title: "Uracil in DNA--general mutagen, but normal intermediate in acquired immunity."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      extremely low IgG, IgA and IgE and elevated IgM
    explanation: >-
      The review states the hyper-IgM serum profile that defines UNG
      deficiency.
- name: Defective Opsonizing and Mucosal Antibody Defense
  biological_scale: ORGANISM
  description: >-
    Lacking switched antibody, patients cannot opsonize or neutralize
    bacteria efficiently, producing recurrent bacterial infection. The cited
    UNG-specific sources describe this only as recurrent or bacterial
    infection; the sinopulmonary pattern and airway sequelae typical of severe
    antibody deficiency are expected but not documented in published HIGM5
    patients, so they are not recorded as phenotypes here.
  downstream:
  - target: Recurrent bacterial infections
    description: Loss of opsonizing and mucosal antibody leaves bacterial infection uncontrolled.
  evidence:
  - reference: PMID:17116429
    reference_title: "Uracil in DNA--general mutagen, but normal intermediate in acquired immunity."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In humans, UNG-deficiency results in the hyper IgM syndrome characterized
      by recurrent infections, lymphoid hyperplasia
    explanation: >-
      Recurrent infection is the recognised clinical consequence of the
      antibody-defense failure in UNG deficiency.
- name: Reduced Class-Switched Memory B Cells
  biological_scale: CELLULAR
  description: >-
    B cells that cannot complete class switching fail to enter the
    switched-memory compartment, while total B-cell numbers remain normal — a
    feature distinguishing HIGM5 from the agammaglobulinemias.
  cell_types:
  - preferred_term: class switched memory B cell
    term:
      id: CL:0000972
      label: class switched memory B cell
    modifier: DECREASED
  downstream:
  - target: Decreased class-switched memory B cell proportion
    description: >-
      Switched-memory B cells are markedly reduced or absent in the circulating
      repertoire.
    evidence:
    - reference: PMID:33276124
      reference_title: "Class Switch Recombination Defects: impact on B cell maturation and antibody responses."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        CSRD patients showed uniformly absent or markedly reduced switched
        memory B cells (IgM-IgD-CD27+).
      explanation: >-
        Switched-memory B cells were absent or markedly reduced across the
        class-switch recombination defect cohort, which included UNG-deficient
        patients.
- name: Germinal Center and Lymphoid Hyperplasia
  biological_scale: TISSUE
  description: >-
    Continued antigen-driven activation of B cells that cannot complete an
    effective switching reaction drives enlargement of lymph nodes and
    germinal centers, the lymphoid hyperplasia characteristic of the AID/UNG
    hyper-IgM subgroup.
  downstream:
  - target: Lymphadenopathy
    description: Enlarged lymph nodes and germinal centers.
    evidence:
    - reference: PMID:41608114
      reference_title: "Human inborn errors of immunity: 2024 update on the classification from the International Union of Immunological Societies Expert Committee."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "UNG deficiency | UNG | AR | 191525 | IgG and IgA decreased, IgM increased | Enlarged lymph nodes and germinal centers"
      explanation: The IUIS 2024 UNG deficiency row lists enlarged lymph nodes and germinal centers.
  evidence:
  - reference: PMID:17116429
    reference_title: "Uracil in DNA--general mutagen, but normal intermediate in acquired immunity."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      UNG-deficiency results in the hyper IgM syndrome characterized by
      recurrent infections, lymphoid hyperplasia
    explanation: >-
      Lymphoid hyperplasia is a recognised feature of human UNG deficiency.

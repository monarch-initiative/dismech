notes: >-
  Quantitative symptom and psychiatric comorbidity frequencies currently derive
  primarily from a single 125-patient tertiary academic cohort (PMID:40908757)
  and dermatology reviews (PMID:40855389, PMID:14756886). Associations of
  circulating GDNF, MMP-10, and DNER levels with lichen simplex chronicus risk
  rest on a single two-sample Mendelian randomization study using circulating
  protein quantitative trait loci (PMID:38795165), in which bidirectional
  causality was observed for DNER and independent validation remains necessary.

name: Lichen Simplex Chronicus
creation_date: "2026-02-02T00:16:36Z"
description: >-
  Lichen simplex chronicus (LSC), also known as neurodermatitis, is a common
  chronic, localized pruritic dermatosis defined by well-circumscribed
  lichenified plaques with accentuated skin markings resulting from persistent
  rubbing and scratching. Often secondary to underlying dermatologic, systemic,
  environmental, or psychological triggers, it is sustained by a
  self-perpetuating itch-scratch cycle involving cutaneous type 2 inflammation
  and sensory nerve sensitization. Chronic mechanical trauma induces reactive
  epidermal hyperplasia with acanthosis, hyperkeratosis, and dermal fibrosis,
  most commonly affecting readily reachable sites such as the limbs, ankles,
  nape of the neck, and anogenital region, and is frequently accompanied by
  sleep disturbance, anxiety, and depression.

    reference_title: Lichen simplex chronicus (atopic/neurodermatitis) of the anogenital region.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Lichen simplex chronicus frequently persists as an itch-scratch cycle, even when environmental triggers are removed and the underlying disease is treated. For this reason, successful therapy requires attention not only to trigger factors, but also to repair of the damaged barrier layer, reduction in inflammation, and breakup of the itch-scratch cycle."
    explanation: Demonstrates that repetitive scratching and epidermal barrier damage sustain a persistent itch-scratch cycle independent of initial triggers.
  - reference: PMID:40855389
    reference_title: "Lichen Simplex Chronicus: Clinical Perspectives and Emerging Therapeutic Strategies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The hallmark itch-scratch cycle contributes not only to visible skin changes but also to substantial sleep disruption, emotional distress, and functional impairment."

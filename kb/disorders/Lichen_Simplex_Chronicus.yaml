mechanistic_hypotheses:
- hypothesis_group_id: emerging_circulating_gdnf_susceptibility_hypothesis
  hypothesis_label: Emerging Circulating GDNF Susceptibility Hypothesis
  status: EMERGING
  description: >-
    Two-sample Mendelian randomization suggests that higher genetically
    predicted circulating glial cell line-derived neurotrophic factor (GDNF)
    levels are positively associated with lichen simplex chronicus prevalence,
    whereas MMP-10 and DNER levels are associated with risk attenuation;
    however, because the instruments reflect circulating protein quantitative
    trait loci and bidirectional causality was observed for DNER, the authors
    note that further validation is required.
  evidence:
  - reference: PMID:38795165
    reference_title: "Genetic analyses unravel the causal association of cytokine levels on lichen simplex chronicus risk: insights from a mendelian randomization study."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "Our analysis confirmed the causal impact of genetically determined cytokine levels on LSC risk, particularly MMP-10 (OR = 0.493, P = 0.004) and DNER (OR = 0.651, P = 0.043) in risk attenuation. We also found a positive causal correlation between GDNF levels (OR = 1.871, P = 0.007) and LSC prevalence. Notably, bidirectional causality was observed between DNER and LSC."
    explanation: Reports tentative Mendelian randomization associations between genetically determined circulating GDNF, MMP-10, and DNER levels and lichen simplex chronicus risk.
  - reference: PMID:38795165
    reference_title: "Genetic analyses unravel the causal association of cytokine levels on lichen simplex chronicus risk: insights from a mendelian randomization study."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "Although further validation is requisite, our findings augment the understanding of cytokine mediation in LSC and underscore prospective avenues for research."
    explanation: Explicitly notes that further validation is required for the Mendelian randomization cytokine findings.

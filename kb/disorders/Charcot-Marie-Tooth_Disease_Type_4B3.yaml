treatments:
- name: Physical and Occupational Therapy
  therapeutic_modality: BEHAVIORAL
  description: >-
    The mainstay of care. A multidisciplinary team - neurologist, physiatrist,
    orthopedic surgeon, physical and occupational therapists - maintains
    mobility and function, with exercise as tolerated and daily heel cord
    stretching to prevent Achilles tendon shortening. This is CMT4 management
    generally; nothing is specific to CMT4B3.
  treatment_term:
    preferred_term: physical therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  evidence:
  - reference: PMID:20301641
    reference_title: "Charcot-Marie-Tooth Neuropathy Type 4 – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Treatment by a team including a neurologist, physiatrist, orthopedic surgeon, physical and occupational therapists; special shoes and/or ankle/foot orthoses to correct foot drop and aid walking; surgery as needed for severe pes cavus; forearm crutches, canes, wheelchairs as needed for mobility; exercise as tolerated"
    explanation: >-
      GeneReviews management recommendation for CMT4, of which CMT4B3 is a
      subtype. Quoted from a chapter GeneReviews has since retired, so it is
      historical expert guidance rather than a current standard.
- name: Orthoses and Mobility Aids
  therapeutic_modality: DEVICE
  description: >-
    Special shoes and ankle-foot orthoses to correct foot drop and aid walking;
    forearm crutches, canes and wheelchairs as strength is lost. In the severe
    infantile axonal presentation these are needed within the first decade.
  treatment_term:
    preferred_term: orthotic and mobility support
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301641
    reference_title: "Charcot-Marie-Tooth Neuropathy Type 4 – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "special shoes and/or ankle/foot orthoses to correct foot drop and aid walking; surgery as needed for severe pes cavus; forearm crutches, canes, wheelchairs as needed for mobility"
    explanation: >-
      GeneReviews CMT4 management recommendation naming exactly these devices.
- name: Orthopedic Surgery for Foot Deformity and Contracture
  therapeutic_modality: SURGERY
  description: >-
    Corrective surgery for severe pes cavus, and Achilles tendon release for
    contracture. Tendon release was performed in a reported SBF1 patient and the
    contracture nonetheless recurred, which is worth saying plainly: surgery
    addresses the deformity, not the neuropathy driving it. That case comes from
    the family whose autosomal dominant inheritance claim this entry records as
    contested (cmt4b3_dominant_report); it is cited here for the surgical course
    only, which does not depend on that claim.
  treatment_term:
    preferred_term: orthopedic surgical procedure
    term:
      id: NCIT:C16186
      label: Orthopedic Surgical Procedure
  evidence:
  - reference: PMID:39664754
    reference_title: A novel SBF1 missense mutation causes autosomal dominant Charcot-Marie-Tooth disease type 4B3.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "After first surgery of patient III2, her Achilles tendon contracture progressively still rendered both heels of her feet difficult to land"
    explanation: >-
      Documents Achilles tendon release in a patient with an SBF1 variant, and
      that the contracture progressed afterwards.
- name: Avoidance of Neurotoxic Medications
  description: >-
    Drugs known to cause peripheral nerve damage - vincristine, isoniazid,
    nitrofurantoin among them - should be avoided, as should obesity, which
    makes ambulation harder. This is the CMT4 "agents and circumstances to
    avoid" guidance; there is no CMT4B3-specific list.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301641
    reference_title: "Charcot-Marie-Tooth Neuropathy Type 4 – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Agents/circumstances to avoid: Obesity (which makes ambulation more difficult); medications (e.g., vincristine, isoniazid, nitrofurantoin) known to cause nerve damage."
    explanation: >-
      GeneReviews list of agents and circumstances to avoid in CMT4, quoted
      verbatim.
- name: Respiratory and Nutritional Support
  description: >-
    In the severe infantile presentation, non-invasive positive pressure
    ventilation for respiratory decline and gastrostomy for dysphagia were both
    required before age 12. Anticipating these is part of managing the severe
    end of the spectrum.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:34118926
    reference_title: "Bi-allelic variants in MTMR5/SBF1 cause Charcot-Marie-Tooth type 4B3 featuring mitochondrial dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "with worsening of ambulation and of respiratory function, to the point of requiring non-invasive positive pressure ventilation, and the development of dysphagia, necessitating G-tube placement"
    explanation: >-
      Documents the respiratory and nutritional interventions required in a
      severely affected CMT4B3 child.
- name: Genetic Counseling
  description: >-
    Autosomal recessive recurrence risk of 25% per pregnancy, carrier testing
    for at-risk relatives, and prenatal testing where the familial variants are
    known. Most reported CMT4B3 families are consanguineous, so counseling about
    consanguinity is often central.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:20301641
    reference_title: "Charcot-Marie-Tooth Neuropathy Type 4 – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "At conception, each sib of an affected individual has a 25% chance of being affected, a 50% chance of being an asymptomatic carrier, and a 25% chance of being unaffected and not a carrier."
    explanation: >-
      The recurrence risk this counseling conveys, stated by GeneReviews for the
      CMT4 subtypes.
differential_diagnoses:
- name: Charcot-Marie-Tooth Disease Type 4B1
  description: >-
    MTMR2-related CMT4B1 is the closest mimic: autosomal recessive demyelinating
    neuropathy with the same focally folded myelin sheaths. MTMR2 is the active
    phosphatase that MTMR5 regulates, so the two diseases sit on the same
    molecular axis. Clinically the classic CMT4B3 phenotype resembles CMT4B1
    only "to some extent" - the number of myelinated fibers on biopsy differs -
    and CMT4B1 does not produce the microcephaly, intellectual disability or
    cranial neuropathy seen in syndromic SBF1 disease. Separation is by gene.
  distinguishing_features:
  - Causal gene MTMR2 rather than SBF1
  - No syndromic CNS or cranial nerve involvement
  - Different absolute myelinated fiber counts on nerve biopsy
  evidence:
  - reference: PMID:23749797
    reference_title: "SET binding factor 1 (SBF1) mutation causes Charcot-Marie-Tooth disease type 4B3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical phenotypes of affected study participants with CMT4B were similar, to some extent, to patients with CMT4B1 and CMT4B2."
    explanation: >-
      States the partial clinical overlap that makes CMT4B1 a differential, in
      the authors' own hedged terms.
- name: Charcot-Marie-Tooth Disease Type 4B2
  description: >-
    SBF2/MTMR13-related CMT4B2 is the other myotubularin CMT4B, caused by loss of
    the pseudophosphatase most similar to MTMR5 - the two share 59% identity and
    the same domain architecture. CMT4B2 is distinguished by early-onset
    glaucoma, which is not a feature of SBF1 disease, and by classic
    demyelination with outfoldings without the syndromic CNS features.
  distinguishing_features:
  - Causal gene SBF2 / MTMR13 rather than SBF1
  - Early-onset glaucoma
  - Classic demyelination without microcephaly or intellectual disability
  evidence:
  - reference: PMID:12687498
    reference_title: "Mutations in MTMR13, a new pseudophosphatase homologue of MTMR2 and Sbf1, in two families with an autosomal recessive demyelinating form of Charcot-Marie-Tooth disease associated with early-onset glaucoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified two different nonsense mutations in the myotubularin-related 13 gene, MTMR13."
    explanation: >-
      Establishes MTMR13/SBF2 as the CMT4B2 gene, distinct from SBF1, in
      families whose distinguishing feature is early-onset glaucoma.
- name: Charcot-Marie-Tooth Disease Type 4K
  description: >-
    SURF1-related CMT4K also presents as childhood demyelinating neuropathy with
    a mitochondrial biochemical profile, which makes it a genuine differential
    for the CMT4B3 cases reported with secondary oxidative-metabolism defects.
    The distinction is directional: in CMT4K the gene is a complex IV assembly
    factor and the mitochondrial defect is primary, with lactic acidosis and
    later putaminal and periaqueductal lesions; in CMT4B3 the mitochondrial
    findings are downstream of a membrane-trafficking lesion, and respiratory
    chain assembly is preserved.
  distinguishing_features:
  - Causal gene SURF1, a complex IV assembly factor
  - Lactic acidosis
  - Putaminal and periaqueductal brain lesions
  evidence:
  - reference: PMID:42627996
    reference_title: "Mitochondrial dysfunction, metabolic quiescence and premature senescence in CMT4B3 fibroblasts."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "reduced ATP production, while mitochondrial mass, respiratory chain assembly, and markers of mitochondrial biogenesis were preserved"
    explanation: >-
      Preserved respiratory chain assembly in CMT4B3 cells is the observation
      that separates it from a primary respiratory chain assembly disorder such
      as CMT4K.
animal_models:
- name: Mtmr5-null mouse
  species: Mus musculus
  genotype: Mtmr5-/- (Sbf1 knockout)
  description: >-
    Constitutive Mtmr5-null mice. Adult nerves contain fewer myelinated axons,
    attributed to defective axon radial sorting, and Mtmr5 expression peaks
    during radial sorting and falls after postnatal day 7. Critically, these
    mice do NOT develop the CMT4B-like myelin outfoldings that define the human
    disease. Combined Mtmr5/Mtmr13 deletion is perinatally lethal.
  publication: PMID:34718573
  genes:
  - preferred_term: SBF1
    term:
      id: hgnc:10542
      label: SBF1
  evidence:
  - reference: PMID:34718573
    reference_title: "Distinct roles for the Charcot-Marie-Tooth disease-causing endosomal regulators Mtmr5 and Mtmr13 in axon radial sorting and Schwann cell myelination."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "This study enhances our understanding of the non-redundant roles of the endosomal regulators MTMR5 and MTMR13 during normal peripheral nerve development and disease."
    explanation: >-
      Supports treating the Mtmr5-null mouse as informative for MTMR5 function
      in peripheral nerve, while the authors frame the roles as non-redundant -
      which is why this entry also records what the model fails to reproduce.
  modeled_mechanisms:
  - target: Impaired Axon Radial Sorting
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      The mouse is the primary evidence that MTMR5's peripheral-nerve role is in
      radial sorting.
    limitations: >-
      Mouse, not human, and the sorting defect is inferred from reduced
      myelinated axon counts in adult nerve rather than measured during sorting
      itself.
    evidence:
    - reference: PMID:34718573
      reference_title: "Distinct roles for the Charcot-Marie-Tooth disease-causing endosomal regulators Mtmr5 and Mtmr13 in axon radial sorting and Schwann cell myelination."

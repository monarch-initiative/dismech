    histopathology: redundant, focally folded myelin loops. Bound here as a
    phenotype because the HPO term exists and the NCIT-rooted histopathology
    vocabulary has no equivalent, so this is where the finding stays queryable.
  phenotype_term:
    preferred_term: Focally folded myelin sheaths
    term:

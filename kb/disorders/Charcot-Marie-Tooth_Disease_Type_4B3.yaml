differential_diagnoses:
- name: Charcot-Marie-Tooth Disease Type 4B1
  description: >-
    MTMR2-related CMT4B1 is an autosomal recessive demyelinating neuropathy with myelin outfoldings. MTMR2 is the active phosphatase regulated by MTMR5. The original CMT4B3 family partially resembled CMT4B1; overlapping clinical and biopsy findings require molecular distinction. Absence of every cranial or CNS feature is not a reliable absolute discriminator.
  distinguishing_features:
  - Biallelic MTMR2 variants rather than SBF1 variants
  - Myelin outfoldings overlap with the demyelinating SBF1 presentation
  evidence:
  - reference: PMID:23749797
    reference_title: "SET binding factor 1 (SBF1) mutation causes Charcot-Marie-Tooth disease type 4B3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical phenotypes of affected study participants with CMT4B were similar, to some extent, to patients with CMT4B1 and CMT4B2."
    explanation: >-
      States the partial clinical overlap that makes CMT4B1 a differential, in
      the authors' own hedged terms.
- name: Charcot-Marie-Tooth Disease Type 4B2
  description: >-
    SBF2/MTMR13-related CMT4B2 is another recessive myotubularin neuropathy with demyelination and myelin outfoldings. Early-onset glaucoma occurs in reported families and is a useful clue, but is not required in every CMT4B2 case. Molecular testing distinguishes SBF2 from SBF1 disease.
  distinguishing_features:
  - Causal gene SBF2/MTMR13 rather than SBF1
  - Early-onset glaucoma in some families
  evidence:
  - reference: PMID:12687498
    reference_title: "Mutations in MTMR13, a new pseudophosphatase homologue of MTMR2 and Sbf1, in two families with an autosomal recessive demyelinating form of Charcot-Marie-Tooth disease associated with early-onset glaucoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified two different nonsense mutations in the myotubularin-related 13 gene, MTMR13."
    explanation: >-
      Establishes MTMR13/SBF2 as the CMT4B2 gene, distinct from SBF1, in
      families whose distinguishing feature is early-onset glaucoma.
  - reference: PMID:12687498
    reference_title: "Mutations in MTMR13, a new pseudophosphatase homologue of MTMR2 and Sbf1, in two families with an autosomal recessive demyelinating form of Charcot-Marie-Tooth disease associated with early-onset glaucoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "a demyelinating CMT, mainly characterized by the presence of myelin outfoldings on nerve biopsies, cosegregated as an autosomal recessive trait with early-onset glaucoma."
    explanation: >-
      The primary CMT4B2 report describes the glaucoma/myelin association, rather than merely naming the causal gene.
- name: Charcot-Marie-Tooth Disease Type 4K
  description: >-
    SURF1-related CMT4K can cause childhood-onset demyelinating neuropathy with lactic acidosis and complex IV dysfunction. The distinction rests on SURF1 genotype and its assembly-factor function, not on assuming that every SBF1 mitochondrial abnormality is secondary. Putaminal or periaqueductal MRI abnormalities occur in SURF1 disease, but periaqueductal involvement was also reported in the British SBF1 family.
  distinguishing_features:
  - Biallelic SURF1 variants rather than SBF1 variants
  - Complex IV assembly-factor deficiency with lactic acidosis in the original cohort
  evidence:
  - reference: PMID:24027061
    reference_title: "SURF1 deficiency causes demyelinating Charcot-Marie-Tooth disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "All 3 patients with SURF1-associated CMT4 presented with severe childhood-onset neuropathy, motor nerve conduction velocities <25 m/s, and lactic acidosis."
    explanation: >-
      Independent primary clinical evidence for the SURF1 differential.
  - reference: PMID:24027061
    reference_title: "SURF1 deficiency causes demyelinating Charcot-Marie-Tooth disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "the SURF1 gene, encoding an assembly factor of the mitochondrial respiratory chain complex IV."
    explanation: >-
      SURF1 function is directly relevant to the molecular distinction.
animal_models:
- name: Mtmr5-null mouse
  species: Mus musculus
  genotype: Mtmr5-/- (Sbf1 knockout)
  description: >-
    Constitutive deletion of Mtmr5 exons 1–25 removes full-length protein. Adult sciatic nerves show fewer myelinated axons and retained large bundled axons consistent with impaired radial sorting, but normal myelin thickness, no outfoldings and no overt gait or motor phenotype. A low-abundance truncated protein was detectable in neonatal brain, limiting an unqualified null description at every age and tissue. Combined Mtmr5/Mtmr13 deletion is perinatally lethal.
  publication: PMID:34718573
  genes:
  - preferred_term: SBF1
    term:
      id: hgnc:10542
      label: SBF1
  evidence:
  - reference: PMID:34718573
    reference_title: "Distinct roles for the Charcot-Marie-Tooth disease-causing endosomal regulators Mtmr5 and Mtmr13 in axon radial sorting and Schwann cell myelination."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "This study enhances our understanding of the non-redundant roles of the endosomal regulators MTMR5 and MTMR13 during normal peripheral nerve development and disease."
    explanation: >-
      Supports treating the Mtmr5-null mouse as informative for MTMR5 function
      in peripheral nerve, while the authors frame the roles as non-redundant -
      which is why this entry also records what the model fails to reproduce.
  modeled_mechanisms:
  - target: Impaired Axon Radial Sorting
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      The mouse is the primary evidence that MTMR5's peripheral-nerve role is in
      radial sorting.
    limitations: >-
      Adult mouse nerves show retained large axons in bundles and incomplete
      Schwann-cell ensheathment on electron microscopy, in addition to reduced
      myelinated axon counts. Developmental sorting dynamics and the respective
      axonal versus Schwann-cell requirements were not resolved by this
      constitutive knockout; human radial sorting defects remain unproven.
    evidence:
    - reference: PMID:34718573
      reference_title: "Distinct roles for the Charcot-Marie-Tooth disease-causing endosomal regulators Mtmr5 and Mtmr13 in axon radial sorting and Schwann cell myelination."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "InMtmr5−/−nerves examined at 3 months, we observed a significant increase in the proportion of bundled axons that had a diameter of >1 μm"
      explanation: >-
        Electron microscopy directly documents retention of large axons in
        bundles, supporting delayed or arrested radial sorting in adult mutant
        nerve. This is more specific than a reduction in myelinated axon count.
  - target: Focally Folded and Redundant Myelin
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: TISSUE
    description: >-
      The mouse does not reproduce the histological hallmark of human CMT4B3.
    limitations: >-
      Adult knockout nerves lack outfoldings, whereas the original human Korean missense family had them. The study proposes allele-specific MTMR2 interference as one possible explanation; a constitutive deletion does not test this. Human axonal cases also need not have outfoldings.
    evidence:
    - reference: PMID:34718573
      reference_title: "Distinct roles for the Charcot-Marie-Tooth disease-causing endosomal regulators Mtmr5 and Mtmr13 in axon radial sorting and Schwann cell myelination."
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: "Loss of Mtmr5 in mice did not cause CMT4B-like myelin outfoldings."
      explanation: >-
        The negative result itself, stated by the authors.
- name: mtmr5 knockout zebrafish
  species: Danio rerio
  genotype: mtmr5 full-gene deletion (CRISPR/Cas9), homozygous
  description: >-

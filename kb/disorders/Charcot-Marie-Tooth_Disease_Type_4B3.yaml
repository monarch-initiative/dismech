name: Charcot-Marie-Tooth Disease Type 4B3
creation_date: "2026-09-07T00:00:00Z"
category: Mendelian
description: >-
  Charcot-Marie-Tooth disease type 4B3 (CMT4B3) is an autosomal recessive
  hereditary motor and sensory neuropathy caused by biallelic variants in SBF1,
  which encodes MTMR5 (SET binding factor 1). MTMR5 is a myotubularin-family
  protein whose own phosphatase domain is catalytically inactive; it acts
  instead as a binding partner that raises the enzymatic activity of the
  phosphoinositide 3-phosphatase MTMR2 and sets its subcellular localization,
  and as a DENN-domain Rab GTPase activator. "Loss of function" in CMT4B3
  therefore means loss of this regulatory and scaffolding role, not loss of a
  catalytic activity MTMR5 never had. The resulting derangement of
  phosphoinositide handling and endolysosomal membrane trafficking in Schwann
  cells produces the CMT4B nerve pathology: loss of large myelinated fibers and
  the focally folded, redundant myelin sheaths that are the biopsy hallmark of
  the CMT4B group, with slowed conduction and secondary axonal loss expressed
  clinically as childhood-onset distal weakness, distal sensory loss, areflexia
  and foot deformity. CMT4B3 is set apart from its CMT4B1 (MTMR2) and CMT4B2
  (SBF2/MTMR13) siblings by the breadth of its reported spectrum: alongside the
  pure demyelinating neuropathy of the index Korean family, several
  consanguineous families carry a far more severe early-onset syndromic
  disease - progressive microcephaly, intellectual disability, syndactyly,
  cerebellar and pyramidal signs, multiple cranial neuropathies and a
  predominantly axonal neuropathy - and one reported child had severe infantile
  axonal disease with secondary mitochondrial dysfunction but no CNS or
  cognitive involvement at all. Fewer than ten families have been published.
  There is no disease-modifying therapy; management is supportive and
  rehabilitative.

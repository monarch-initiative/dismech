  biological_scale: ORGANISM
  description: >-
    Congenital microcephaly occurs in the Bedouin family and progressive microcephaly in the Saudi and Syrian families. Zebrafish full-gene deletion reduces absolute head and brain dimensions along with body length; a specific neurogenesis defect remains a hypothesis. The experiments did not measure brain volume or establish a mechanism for human cranial neuropathy.

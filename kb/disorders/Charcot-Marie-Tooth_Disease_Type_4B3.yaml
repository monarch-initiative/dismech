pathophysiology:
- name: Biallelic SBF1 Variants
  biological_scale: MOLECULAR
  description: >-
    Homozygous and compound heterozygous SBF1 variants are associated with CMT4B3. MTMR5 is a pseudophosphatase: it has no intrinsic phosphatase catalysis to lose. Loss of protein or of regulatory interactions is plausible, but functional effects must be established allele by allele. The original Korean missense pair, truncating alleles and the uncertain Italian R763H/G1064E pair should not be assigned an identical experimentally proven molecular consequence. The molecular-function annotation denotes normal MTMR5-dependent phosphatase activation, not a demonstrated decrease for every variant.
  genetic_context:
    gene:
      preferred_term: SBF1
      term:
        id: hgnc:10542
        label: SBF1
  evidence:
  - reference: PMID:23749797
    reference_title: "SET binding factor 1 (SBF1) mutation causes Charcot-Marie-Tooth disease type 4B3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One pair of heterozygous missense mutations in the SET binding factor 1 (SBF1) gene (22q13.33), also called MTMR5, was identified as the underlying cause of the CMT4B family illness."
    explanation: >-
      Establishes biallelic SBF1 variants as the causal lesion of the disease
      this entry curates.
  - reference: PMID:12668758
    reference_title: "Regulation of myotubularin-related (MTMR)2 phosphatidylinositol phosphatase by MTMR5, a catalytically inactive phosphatase."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The interacting protein was shown by mass spectrometry to be MTMR5, a catalytically inactive member of the MTM family."
    explanation: >-
      The primary demonstration that MTMR5 is catalytically inactive - the fact
      that makes "loss of function" here mean loss of a regulatory role rather
      than loss of catalysis.
  - reference: PMID:12668758
    reference_title: Regulation of myotubularin-related (MTMR)2 phosphatidylinositol phosphatase by MTMR5, a catalytically inactive phosphatase.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: Through this interaction, MTMR5 increases the enzymatic activity of MTMR2 and dictates its subcellular localization.
    explanation: >-
      Normal regulatory function of the encoded protein; the activity consequences of individual disease alleles require separate evidence.
  downstream:
  - target: Reduced MTMR5 Protein Abundance
    causal_link_type: DIRECT
    description: >-
      Marked protein reduction was measured in fibroblasts from the British homozygous frameshift index case; this is not established for every missense allele.
  - target: Impaired MTMR2 Activation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Loss of MTMR5 regulation could reduce MTMR2 activity; purified-protein studies establish normal activation, not the effect of every patient allele.
    hypothesis_groups:
    - cmt4b3_trafficking
  - target: Altered MTMR2 Localization
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Engineered coiled-coil deletions disrupt interaction and cellular localization; extrapolation to disease alleles remains a hypothesis.
    hypothesis_groups:
    - cmt4b3_trafficking
  - target: Impaired Axon Radial Sorting
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Constitutive Mtmr5 deletion causes adult mouse sorting abnormalities; the corresponding human mechanism and responsible cell type remain unresolved.
    hypothesis_groups:
    - cmt4b3_sorting
  - target: Peripheral Axonal Loss
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Human nerve biopsies and electrophysiology support axonal injury, but the intervening SBF1-dependent events are unresolved.
  - target: Abnormal Brain Growth
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Some biallelic families have congenital or progressive microcephaly; the mechanism is unknown.
  - target: Cranial Nerve Dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Multiple cranial nerve abnormalities occur in several families, without a demonstrated molecular causal chain.
  molecular_functions:
  - preferred_term: MTMR2 phosphatase activation by MTMR5
    term:
      id: GO:0072542
      label: protein phosphatase activator activity
- name: Reduced MTMR5 Protein Abundance
  biological_scale: MOLECULAR
  description: >-
    Fibroblasts from the British index case homozygous for c.5477_5478del showed markedly reduced MTMR5 protein. Heterozygous parental fibroblasts had levels comparable to controls. This directly supports protein loss for this frameshift context and does not establish loss of MTMR2 protein.
  evidence:
  - reference: PMID:32444983
    reference_title: "A novel frameshift deletion in autosomal recessive SBF1-related syndromic neuropathy with necklace fibres."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: "Functional analysis showed a markedly reduced level of MTMR5 protein encoded by SBF1 in the index case."
    explanation: >-
      Protein abundance was measured in patient fibroblasts, not inferred from the sequence alone.
- name: Impaired MTMR2 Activation
  biological_scale: MOLECULAR
  description: >-
    Purified MTMR5 increases MTMR2 phosphatase activity against PI3P and PI(3,5)P2. Reduced activation is a proposed consequence of impaired partnering in CMT4B3; the biochemical study used recombinant proteins and engineered constructs rather than patient missense alleles or Schwann cells.
  evidence:
  - reference: PMID:12668758
    reference_title: "Regulation of myotubularin-related (MTMR)2 phosphatidylinositol phosphatase by MTMR5, a catalytically inactive phosphatase."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "MTMR5 consistently increased MTMR2 phosphatase activity 4.6- and 3.4-fold for PI(3)P and phosphatidylinositol 3,5-bisphosphate, respectively (data not shown)."
    explanation: >-
      Normal biochemical regulation supports the disease hypothesis indirectly; the authors could not determine the homo-/heterodimer proportions in the assay.
  molecular_functions:
  - preferred_term: protein phosphatase activator activity
    term:
      id: GO:0072542
      label: protein phosphatase activator activity
    modifier: DECREASED
  downstream:
  - target: Altered Phosphoinositide Handling
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Reduced activation could alter phosphoinositide dephosphorylation; disease-specific lipid measurements are lacking.
    hypothesis_groups:
    - cmt4b3_trafficking
- name: Altered MTMR2 Localization
  biological_scale: CELLULAR
  description: >-
    MTMR5 and MTMR2 coiled-coil domains mediate interaction. COS-1 cotransfection experiments show that deleting the MTMR5 coiled-coil domain changes MTMR2 localization. Whether individual CMT4B3 alleles reproduce this effect in peripheral nerve is unresolved.
  evidence:
  - reference: PMID:12668758
    reference_title: "Regulation of myotubularin-related (MTMR)2 phosphatidylinositol phosphatase by MTMR5, a catalytically inactive phosphatase."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "Through this interaction, MTMR5 increases the enzymatic activity of MTMR2 and dictates its subcellular localization."
    explanation: >-
      The normal regulatory interaction and engineered perturbations motivate a disease-localization hypothesis.
  - reference: PMID:12668758
    reference_title: "Regulation of myotubularin-related (MTMR)2 phosphatidylinositol phosphatase by MTMR5, a catalytically inactive phosphatase."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We also demonstrate that MTMR2 interacts with MTMR5 via its coiled-coil domain and that mutations in the coiled-coil domain of either MTMR2 or MTMR5 abrogate this interaction."
    explanation: >-
      Identifies the coiled-coil interface this node names, and shows that
      mutation of it abolishes the interaction.
  downstream:
  - target: Altered Phosphoinositide Handling
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Mislocalization could change the cellular sites at which MTMR2 acts.
    hypothesis_groups:
    - cmt4b3_trafficking
- name: Altered Phosphoinositide Handling
  biological_scale: MOLECULAR
  description: >-
    MTMR2 dephosphorylates PI3P and PI(3,5)P2. Impaired MTMR5-dependent activity or localization could alter these endosomal lipid pools, but their direction and magnitude have not been established across CMT4B3 genotypes.
  evidence:
  - reference: PMID:27666502
    reference_title: "WANTED - Dead or alive: Myotubularins, a large disease-associated protein family."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "While some members have phosphatase activity against the 3-phosphate of phosphoinositides, regulating the phosphorylation status of PtdIns3P and PtdIns(3,5)P2 implicated in membrane trafficking and autophagy, and producing PtdIns5P"
    explanation: >-
      General myotubularin biology supports this proposed route but does not demonstrate altered lipid pools in SBF1 patient nerve.
    directness: INDIRECT
  biological_processes:
  - preferred_term: phosphatidylinositol dephosphorylation
    term:
      id: GO:0046856
      label: phosphatidylinositol dephosphorylation
    modifier: ABNORMAL
  downstream:
  - target: Disordered Endolysosomal Trafficking
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Altered endosomal phosphoinositides are a proposed route to trafficking defects.
    hypothesis_groups:
    - cmt4b3_trafficking
- name: Disordered Endolysosomal Trafficking
  biological_scale: CELLULAR
  description: >-
    MTMR5-dependent endosomal trafficking is a candidate mechanism. The mouse paper discusses ErbB2/ErbB3 and beta1-integrin recycling, drawing on prior receptor and Rab21 biology; it did not measure these trafficking defects in Mtmr5-null nerves. The respective neuronal and Schwann-cell requirements are unresolved. Trafficking, macroautophagy and mitophagy are related processes, not interchangeable pathways.
  biological_processes:
  - preferred_term: Endosomal transport
    term:
      id: GO:0016197
      label: endosomal transport
    modifier: ABNORMAL
  evidence:
  - reference: PMID:34118926
    reference_title: "Bi-allelic variants in MTMR5/SBF1 cause Charcot-Marie-Tooth type 4B3 featuring mitochondrial dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MTMR5/SBF1 is a pseudophosphatase predicted to regulate endo-lysosomal trafficking in tandem with other MTMRs."
    explanation: >-
      The primary clinical report explicitly describes trafficking regulation as predicted; it does not measure trafficking in patient nerve.
    directness: INDIRECT
  downstream:
  - target: Focally Folded and Redundant Myelin
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Trafficking disruption is proposed to contribute to myelin pathology, but outfoldings are allele- and model-dependent.
    hypothesis_groups:
    - cmt4b3_trafficking
  - target: Impaired Axon Radial Sorting
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Receptor recycling is one proposed explanation for the mouse sorting phenotype; this link was not directly tested.
    hypothesis_groups:
    - cmt4b3_sorting
- name: Focally Folded and Redundant Myelin
  biological_scale: TISSUE
  conforms_to: "schwann_cell_myelin_maintenance#Tomaculous and Onion-Bulb Myelin Remodeling"
  description: >-
    The histological signature of the CMT4B group: myelin sheaths that fold back
    on themselves into redundant loops and outfoldings, with loss of large
    myelinated fibers. In CMT4B3 this was found in the index Korean family,
    although the absolute number of myelinated fibers differed from CMT4B1 and
    CMT4B2. It is characteristic of the demyelinating presentation and is not
    reported in the axonal syndromic families.
  cell_types:
  - preferred_term: Myelinating Schwann cell
    term:
      id: CL:0000218
      label: myelinating Schwann cell
  biological_processes:
  - preferred_term: Myelination
    term:
      id: GO:0042552
      label: myelination
    modifier: ABNORMAL
  cellular_components:
  - preferred_term: myelin sheath
    term:
      id: GO:0043209
      label: myelin sheath
    modifier: ABNORMAL
  evidence:
  - reference: PMID:23749797
    reference_title: "SET binding factor 1 (SBF1) mutation causes Charcot-Marie-Tooth disease type 4B3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found a similar loss of large myelinated fibers and focally folded myelin sheaths in our patients, but the actual number of myelinated fibers was different from CMT4B1 and CMT4B2."
    explanation: >-
      Documents both halves of this node in CMT4B3 nerve biopsies, and the one
      quantitative difference from the sibling diseases.
  downstream:
  - target: Dysmyelination
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Myelin pathology and slowed conduction co-occur in the Korean demyelinating presentation; the structural-to-functional relationship is inferred.
  - target: Myelin Outfoldings
    causal_link_type: DIRECT
    description: >-
      The corresponding observed nerve-biopsy phenotype.
- name: Impaired Axon Radial Sorting
  biological_scale: TISSUE
  description: >-
    Radial sorting is the developmental step in which Schwann cells segregate
    large-calibre axons out of bundles into 1:1 relationships before myelinating
    them. Mouse work places MTMR5's main peripheral-nerve role here rather than
    in myelin maintenance: Mtmr5-null nerves contain fewer myelinated axons and
    show sorting defects, while Mtmr13 loss produces the outfoldings. Whether
    this division of labour holds in human CMT4B3, where outfoldings are seen,
    is unresolved - see the model-mismatch discussion below.
  cell_types:
  - preferred_term: Schwann cell
    term:
      id: CL:0002573
      label: Schwann cell
  biological_processes:
  - preferred_term: Myelination in peripheral nervous system
    term:
      id: GO:0022011
      label: myelination in peripheral nervous system
    modifier: DECREASED
  evidence:
  - reference: PMID:34718573
    reference_title: "Distinct roles for the Charcot-Marie-Tooth disease-causing endosomal regulators Mtmr5 and Mtmr13 in axon radial sorting and Schwann cell myelination."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Loss of Mtmr5 in mice did not cause CMT4B-like myelin outfoldings. However, adult Mtmr5-/- mouse nerves contained fewer myelinated axons than control nerves, likely as a result of axon radial sorting defects."
    explanation: >-
      The primary evidence for this node, and simultaneously the negative result
      that the mouse does not reproduce the human outfolding pathology.
  - reference: PMID:34718573
    reference_title: "Distinct roles for the Charcot-Marie-Tooth disease-causing endosomal regulators Mtmr5 and Mtmr13 in axon radial sorting and Schwann cell myelination."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Consistently, Mtmr5 levels were highest during axon radial sorting and fell sharply after postnatal day seven."
    explanation: >-
      Developmental expression timing consistent with a radial-sorting role
      rather than an ongoing myelin-maintenance one.
  downstream:
  - target: Reduced Myelinated Axon Number in Mouse Nerve
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Persistent large bundled axons and incomplete ensheathment support impaired sorting as an explanation for fewer myelinated axons; this is a model-specific inference.
    hypothesis_groups:
    - cmt4b3_sorting
- name: Reduced Myelinated Axon Number in Mouse Nerve
  biological_scale: TISSUE
  description: >-
    Adult Mtmr5-null sciatic nerves contained approximately 10% fewer myelinated axons, with normal myelin thickness and no outfoldings. Reduced myelinated counts do not by themselves establish axonal degeneration or slowed conduction.
  evidence:
  - reference: PMID:34718573
    reference_title: "Distinct roles for the Charcot-Marie-Tooth disease-causing endosomal regulators Mtmr5 and Mtmr13 in axon radial sorting and Schwann cell myelination."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Loss of Mtmr5 in mice did not cause CMT4B-like myelin outfoldings. However, adult Mtmr5-/- mouse nerves contained fewer myelinated axons than control nerves, likely as a result of axon radial sorting defects."
    explanation: >-
      The primary evidence for this node, and simultaneously the negative result
      that the mouse does not reproduce the human outfolding pathology.
- name: Mitochondrial Network Fragmentation
  biological_scale: CELLULAR
  description: >-
    Patient fibroblasts showed fragmented mitochondrial networks despite preserved MFN2/OPA1 abundance and OPA1 isoform ratio. These are observations in R763H/G1064E fibroblasts from one patient. The original variants were classified as uncertain and likely benign, and genetic rescue was not performed; attribution to SBF1 and extrapolation to nerve remain provisional.
  evidence:
  - reference: PMID:42627996
    reference_title: "Mitochondrial dysfunction, metabolic quiescence and premature senescence in CMT4B3 fibroblasts."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Patient fibroblasts exhibited fragmented mitochondrial networks with a shift toward fission, together with reduced ATP production, while mitochondrial mass, respiratory chain assembly, and markers of mitochondrial biogenesis were preserved."
    explanation: >-
      The 2026 study directly measured mitochondrial network morphology in fibroblasts; this does not establish a primary respiratory-chain defect or a causal sequence from membrane trafficking.
  cell_types:
  - preferred_term: skin fibroblast
    term:
      id: CL:0002620
      label: skin fibroblast
- name: Reduced Fibroblast Bioenergetic Output
  biological_scale: CELLULAR
  description: >-
    ATP production, oxygen consumption and glycolytic output were reduced, consistent with metabolic quiescence. Mitochondrial mass, respiratory-chain assembly and mtDNA copy number were preserved in these cells, in contrast to the reduced mtDNA content measured in this patient's muscle. These are observations in R763H/G1064E fibroblasts from one patient. The original variants were classified as uncertain and likely benign, and genetic rescue was not performed; attribution to SBF1 and extrapolation to nerve remain provisional.
  evidence:
  - reference: PMID:42627996
    reference_title: "Mitochondrial dysfunction, metabolic quiescence and premature senescence in CMT4B3 fibroblasts."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Patient fibroblasts exhibited fragmented mitochondrial networks with a shift toward fission, together with reduced ATP production, while mitochondrial mass, respiratory chain assembly, and markers of mitochondrial biogenesis were preserved."
    explanation: >-

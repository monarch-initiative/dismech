histopathology:
- name: Focally folded myelin sheaths on sural nerve biopsy
  diagnostic: true
  description: >-
    The diagnostic hallmark of the CMT4B group and the finding that put SBF1
    disease in it. Distal sural nerve biopsies from the index Korean family
    showed focally folded (redundant, outfolded) myelin sheaths together with
    loss of large myelinated fibers - the same pattern as CMT4B1 and CMT4B2,
    although the absolute number of myelinated fibers differed. It is reported
    in the demyelinating presentation; the syndromic axonal families instead
    show denervation, and one showed necklace fibres on muscle biopsy.
  finding_term:
    preferred_term: focally folded myelin sheath
  subtype: Classic CMT4B3
  evidence:
  - reference: PMID:23749797
    reference_title: "SET binding factor 1 (SBF1) mutation causes Charcot-Marie-Tooth disease type 4B3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found a similar loss of large myelinated fibers and focally folded myelin sheaths in our patients, but the actual number of myelinated fibers was different from CMT4B1 and CMT4B2."
    explanation: >-
      The primary histological description in CMT4B3, from sural nerve biopsies
      of all three affected members of the index family.
  - reference: PMID:23749797
    reference_title: "SET binding factor 1 (SBF1) mutation causes Charcot-Marie-Tooth disease type 4B3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We enrolled 14 members of a Korean family in which 3 individuals had demyelinating CMT4B phenotype and obtained distal sural nerve biopsies from all affected participants."
    explanation: >-
      Establishes the tissue and ascertainment behind the histological finding.
- name: Necklace fibres on muscle biopsy
  description: >-
    Muscle biopsy in the Chinese syndromic family showed necklace fibres - a
    myofibre feature more usually associated with the myotubularin myopathies -
    alongside the sensorimotor axonal neuropathy. Reported in one family.
  finding_term:
    preferred_term: necklace fibres
  subtype: Syndromic SBF1 Neuropathy
  evidence:
  - reference: PMID:32444983
    reference_title: A novel frameshift deletion in autosomal recessive SBF1-related syndromic neuropathy with necklace fibres.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Muscle biopsy showed a feature of necklace fibres."
    explanation: Direct report of the finding this record names.
imaging_findings:
- name: Fork and bracket sign on brain MRI
  modality: MRI
  diagnostic: true
  description: >-
    A distinctive appearance at the pontine and mesencephalic level, attributed
    to degenerated fibre bundles of the oculomotor and facial nerves, reported
    in the Syrian and Bedouin syndromic families. It is the imaging finding that
    named "fork and bracket" syndrome, and its recognition is what linked that
    condition to SBF1.
  subtype: Syndromic SBF1 Neuropathy
  evidence:
  - reference: PMID:20658556
    reference_title: "Multiple cranial nerve neuropathies, microcephaly, neurological degeneration, and \"fork and bracket sign\" in the MRI: a distinct syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Previously unknown findings referred to as the \"fork sign\" at the pontine level and the \"bracket sign\" at the mesencephalic level were documented by magnetic resonance imaging."
    explanation: >-
      The original description of the sign, in the Syrian sibship later shown by
      exome sequencing to carry a homozygous SBF1 variant. Note this paper
      predates the SBF1 link and does not itself name the gene.
  - reference: PMID:30039846
    reference_title: Novel SBF1 splice-site null mutation broadens the clinical spectrum of Charcot-Marie-Tooth type 4B3 disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Magnetic resonance imaging (MRI) showed profound cerebellar atrophy with highly unique findings at the pontine and mesencephalic levels"
    explanation: >-
      Reports the pontine and mesencephalic MRI abnormality this finding names,
      in a second, independent SBF1 family.
- name: Normal brain and spinal MRI
  modality: MRI
  description: >-
    Recorded here because its absence is diagnostically informative: the Italian
    child with severe infantile axonal CMT4B3 had normal brain and spinal MRI on
    repeated imaging to age 11. A normal MRI does not exclude SBF1 disease.
  evidence:
  - reference: PMID:34118926
    reference_title: "Bi-allelic variants in MTMR5/SBF1 cause Charcot-Marie-Tooth type 4B3 featuring mitochondrial dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient showed no cognitive impairment during the clinical course, and at the latest follow up (age 11), brain and spinal MRI remained normal."
    explanation: >-
      Documents normal neuroimaging in a genetically confirmed, severely
      affected CMT4B3 patient.
diagnosis:
- name: Molecular genetic testing of SBF1
  diagnosis_term:
    preferred_term: SBF1 molecular genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  presence: PRESENT
  description: >-
    Diagnosis rests on identifying biallelic pathogenic SBF1 variants.
    Standard first-line CMT testing does not reach SBF1: the reported patients
    had PMP22 rearrangement, MFN2 and GDAP1 testing come back negative first.
  results: >-
    Two pathogenic SBF1 alleles, in trans - homozygous in the consanguineous
    families, compound heterozygous in the Korean and Italian families.
  markers: SBF1 (MTMR5), 22q13.33
  evidence:
  - reference: PMID:20301641
    reference_title: "Charcot-Marie-Tooth Neuropathy Type 4 – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The diagnosis of CMT4 subtypes is based on clinical findings, neurophysiologic studies, and molecular genetic testing."
    explanation: >-
      GeneReviews statement of the diagnostic approach for the CMT4 series that
      CMT4B3 belongs to.
  - reference: PMID:34118926
    reference_title: "Bi-allelic variants in MTMR5/SBF1 cause Charcot-Marie-Tooth type 4B3 featuring mitochondrial dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Gene testing for genomic rearrangements of PMP22 and punctuate variants in MNF2 and GDAP1 were negative."
    explanation: >-
      Illustrates that the common CMT genes are tested and excluded before SBF1
      is reached. Quoted verbatim including the source's misspelling of MFN2.
- name: Whole exome sequencing
  diagnosis_term:
    preferred_term: whole exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  presence: PRESENT
  description: >-
    The test that actually makes the diagnosis in practice. Every family in
    which SBF1 was established as causal was solved by exome sequencing, because
    the phenotype - especially the syndromic form - does not point at SBF1 on
    clinical grounds and SBF1 is not on all older CMT panels.
  results: >-
    A biallelic SBF1 variant surviving the filtering pipeline, segregating with
    disease in the pedigree.
  evidence:
  - reference: PMID:23749797
    reference_title: "SET binding factor 1 (SBF1) mutation causes Charcot-Marie-Tooth disease type 4B3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We conducted exome sequencing on 6 samples (3 affected and 3 unaffected individuals)."
    explanation: >-
      The exome study that identified SBF1 as the CMT4B3 gene, including
      unaffected relatives for segregation.
  - reference: PMID:30039846
    reference_title: Novel SBF1 splice-site null mutation broadens the clinical spectrum of Charcot-Marie-Tooth type 4B3 disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole exome sequencing identified a single novel homozygous deleterious splice-site mutation within this locus in SET binding factor 1 (SBF1)."
    explanation: >-
      A second, independent family diagnosed by exome sequencing after linkage
      narrowed the locus.
  - reference: PMID:32444983
    reference_title: A novel frameshift deletion in autosomal recessive SBF1-related syndromic neuropathy with necklace fibres.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Muscle biopsy and whole-exome sequencing (WES) were performed."
    explanation: >-
      A third family, showing exome sequencing paired with tissue biopsy as the
      diagnostic combination.
- name: Nerve conduction studies and electromyography
  diagnosis_term:
    preferred_term: nerve conduction study
    term:
      id: NCIT:C154784
      label: Electroneurography
  presence: PRESENT
  description: >-
    Neurophysiology classifies the neuropathy rather than making the diagnosis,
    and in CMT4B3 the classification is not uniform. The classic form shows
    demyelinating slowing, which is what places it in CMT4; the syndromic and
    the severe infantile forms show reduced compound muscle action potential
    amplitudes with denervation on EMG and relatively preserved velocities. A
    normal or near-normal conduction velocity therefore does not exclude
    CMT4B3.
  results: >-
    Either slowed motor conduction velocity (demyelinating range) or reduced
    CMAP amplitude with preserved velocity (axonal pattern), depending on the
    presentation.
  evidence:
  - reference: PMID:34118926
    reference_title: "Bi-allelic variants in MTMR5/SBF1 cause Charcot-Marie-Tooth type 4B3 featuring mitochondrial dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Electroneurography disclosed severe motor polyneuropathy with predominant axonal features, diffuse reduction of compound action muscular potentials (CMAP, values under 1.5 mV) and only slight decrement of NCV (38-43 m/s)."
    explanation: >-
      A worked example of the axonal electrophysiological pattern with nearly
      preserved conduction velocity in genetically confirmed CMT4B3.
  - reference: PMID:32444983
    reference_title: A novel frameshift deletion in autosomal recessive SBF1-related syndromic neuropathy with necklace fibres.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nerve conduction studies and electromyography of both patients suggested sensory-motor axonal neuropathy."
    explanation: >-
      Documents both tests used together, and a second family with the axonal
      rather than demyelinating pattern.
- name: Sural nerve biopsy
  diagnosis_term:
    preferred_term: sural nerve biopsy
    term:
      id: NCIT:C217131
      label: Nervous System Biopsy Procedure
  presence: PRESENT
  description: >-
    The CMT4B group's diagnostic hallmark. Distal sural nerve biopsy in the
    index Korean family showed focally folded myelin sheaths with loss of large
    myelinated fibers - the finding that placed SBF1 disease in CMT4B and named
    the disease. It is no longer required for diagnosis now that sequencing is
    available, but a historical biopsy showing myelin outfoldings in an unsolved
    recessive neuropathy is a reason to sequence SBF1.
  results: >-
    Focally folded (outfolded) myelin sheaths and loss of large myelinated
    fibers, with myelinated fiber counts differing from CMT4B1 and CMT4B2.
  evidence:
  - reference: PMID:23749797
    reference_title: "SET binding factor 1 (SBF1) mutation causes Charcot-Marie-Tooth disease type 4B3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We enrolled 14 members of a Korean family in which 3 individuals had demyelinating CMT4B phenotype and obtained distal sural nerve biopsies from all affected participants."
    explanation: >-
      The diagnostic material and how it was obtained, in the family that
      defined the disease.
  - reference: PMID:23749797
    reference_title: "SET binding factor 1 (SBF1) mutation causes Charcot-Marie-Tooth disease type 4B3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found a similar loss of large myelinated fibers and focally folded myelin sheaths in our patients, but the actual number of myelinated fibers was different from CMT4B1 and CMT4B2."
    explanation: >-
      The result the biopsy yields, and the one respect in which it differs from
      the sibling CMT4B diseases.

genetic:
- name: SBF1
  association: Causal
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: SBF1
    term:
      id: hgnc:10542
      label: SBF1
  notes: >-
    SBF1 (also MTMR5, DENND7A) at 22q13.33. Reported pathogenic alleles include
    compound heterozygous and homozygous missense variants clustering in the
    DENN and SBF2 domains, a homozygous splice-site null allele, and a
    homozygous frameshift deletion. Because MTMR5 has no catalytic activity of
    its own, the shared consequence is loss of its regulatory and scaffolding
    functions - MTMR2 activation and localization, and DENN-domain Rab GTPase
    activation.
  evidence:
  - reference: PMID:23749797
    reference_title: "SET binding factor 1 (SBF1) mutation causes Charcot-Marie-Tooth disease type 4B3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We suggest that the compound heterozygous mutations in SBF1 are the underlying causes of a novel CMT4B subtype, designated as CMT4B3."
    explanation: >-
      The paper that established SBF1 as the CMT4B3 gene and named the disease.
  - reference: CGGV:assertion_c0f814d9-02db-4c0c-8e1c-20a7759d993f-2024-12-02T170000.000Z
    reference_title: "SBF1 / Charcot-Marie-Tooth disease type 4B3 (Moderate)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "SBF1 | HGNC:10542 | Charcot-Marie-Tooth disease type 4B3 | MONDO:0014117 | AR | Moderate | SOP11 | Charcot-Marie-Tooth Disease Gene Curation Expert Panel"
    explanation: >-
      ClinGen expert-panel assessment of the SBF1-CMT4B3 gene-disease
      relationship. Moderate, not Definitive - the honest current strength of
      the association, reflecting the small number of published families.
  - reference: PMID:20301641
    reference_title: "Charcot-Marie-Tooth Neuropathy Type 4 – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Detection of biallelic pathogenic variants in one of the following 11 genes establishes the diagnosis: GDAP1 (CMT4A), MTMR2 (CMT4B1), SBF2 (CMT4B2), SBF1 (CMT4B3), SH3TC2 (CMT4C), NDRG1 (CMT4D), EGR2 (CMT4E), PRX (CMT4F), HK1 (CMT4G), FGD4 (CMT4H), and FIG4 (CMT4J)."
    explanation: >-
      GeneReviews places SBF1/CMT4B3 in the CMT4 diagnostic gene list. Cited

    modifier: DECREASED
  evidence:
  - reference: PMID:23749797
    reference_title: "SET binding factor 1 (SBF1) mutation causes Charcot-Marie-Tooth disease type 4B3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One pair of heterozygous missense mutations in the SET binding factor 1 (SBF1) gene (22q13.33), also called MTMR5, was identified as the underlying cause of the CMT4B family illness."
    explanation: >-
      Establishes biallelic SBF1 variants as the causal lesion of the disease
      this entry curates.
  - reference: PMID:12668758
    reference_title: "Regulation of myotubularin-related (MTMR)2 phosphatidylinositol phosphatase by MTMR5, a catalytically inactive phosphatase."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The interacting protein was shown by mass spectrometry to be MTMR5, a catalytically inactive member of the MTM family."
    explanation: >-
      The primary demonstration that MTMR5 is catalytically inactive - the fact
      that makes "loss of function" here mean loss of a regulatory role rather
      than loss of catalysis.
  - reference: PMID:27666502
    reference_title: "WANTED - Dead or alive: Myotubularins, a large disease-associated protein family."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "others lack key residues in the catalytic site and are classified as dead-phosphatases. However, these dead phosphatases regulate phosphoinositide-dependent cellular pathways by binding to catalytically active myotubularins."
    explanation: >-
      A review of the myotubularin family stating the general mechanism this
      node applies to MTMR5: a dead phosphatase acts by binding an active one.
      Graded OTHER because the cited publication is a review rather than a study
      reporting its own data.
  - reference: PMID:32444983
    reference_title: A novel frameshift deletion in autosomal recessive SBF1-related syndromic neuropathy with necklace fibres.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Functional analysis showed a markedly reduced level of MTMR5 protein encoded by SBF1 in the index case."
    explanation: >-
      Direct protein-level demonstration that a pathogenic SBF1 allele reduces
      MTMR5, confirming the loss-of-function mechanism in patient material.
  downstream:
  - target: Loss of MTMR2 Partnering and Phosphoinositide Misregulation
    causal_link_type: DIRECT
    description: >-
      Absent or dysfunctional MTMR5 removes the partner that activates and
      localizes MTMR2.
    evidence:
    - reference: PMID:27123480
      reference_title: "\"Fork and bracket\" syndrome expands the spectrum of SBF1-related sensory motor polyneuropathies."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "the impairment of this interaction, possibly related to protein absence, subcellular mislocalization, or functional changes of the interacting C-terminus domains, is a likely mechanism to explain the polyneuropathy associated with mutations in both genes"
      explanation: >-
        States the causal step this edge asserts - that losing the MTMR5-MTMR2
        interaction is the mechanism linking SBF1 variants to polyneuropathy.
  - target: Central Nervous System and Cranial Nerve Involvement
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      In the syndromic families, SBF1 loss produces disease outside the
      peripheral nerve as well. The mechanism is not established; the
      DENN-domain location of the syndromic variants, and functions of MTMR5
      beyond MTMR2 binding, are the leading hypotheses.
- name: Loss of MTMR2 Partnering and Phosphoinositide Misregulation
  biological_scale: MOLECULAR
  description: >-
    MTMR5 binds MTMR2 through its coiled-coil domain, increases MTMR2's
    enzymatic activity and dictates where MTMR2 is localized. Without that
    partnering, dephosphorylation of the endosomal phosphoinositides PI3P and
    PI(3,5)P2 is misregulated in both amount and place. Because MTMR5 has no
    catalytic activity of its own, this is the step at which a
    pseudophosphatase lesion becomes a phosphoinositide lesion.
  cell_types:
  - preferred_term: Schwann cell
    term:
      id: CL:0002573
      label: Schwann cell
  biological_processes:
  - preferred_term: Phosphatidylinositol dephosphorylation
    term:
      id: GO:0046856
      label: phosphatidylinositol dephosphorylation
    modifier: ABNORMAL
  evidence:
  - reference: PMID:12668758
    reference_title: "Regulation of myotubularin-related (MTMR)2 phosphatidylinositol phosphatase by MTMR5, a catalytically inactive phosphatase."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Through this interaction, MTMR5 increases the enzymatic activity of MTMR2 and dictates its subcellular localization."
    explanation: >-
      The two functions of MTMR5 that are lost - activation of MTMR2 and control
      of its localization - which is exactly what this node claims.
  - reference: PMID:12668758
    reference_title: "Regulation of myotubularin-related (MTMR)2 phosphatidylinositol phosphatase by MTMR5, a catalytically inactive phosphatase."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We also demonstrate that MTMR2 interacts with MTMR5 via its coiled-coil domain and that mutations in the coiled-coil domain of either MTMR2 or MTMR5 abrogate this interaction."
    explanation: >-
      Identifies the coiled-coil interface this node names, and shows that
      mutation of it abolishes the interaction.
  - reference: PMID:27666502
    reference_title: "WANTED - Dead or alive: Myotubularins, a large disease-associated protein family."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "While some members have phosphatase activity against the 3-phosphate of phosphoinositides, regulating the phosphorylation status of PtdIns3P and PtdIns(3,5)P2 implicated in membrane trafficking and autophagy, and producing PtdIns5P"
    explanation: >-
      Names the two phosphoinositide species whose handling this node says is
      misregulated - PtdIns3P and PtdIns(3,5)P2 - and ties them to membrane
      trafficking. Graded OTHER as a review statement rather than primary data.
  - reference: PMID:34718573
    reference_title: "Distinct roles for the Charcot-Marie-Tooth disease-causing endosomal regulators Mtmr5 and Mtmr13 in axon radial sorting and Schwann cell myelination."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In the mouse PNS, Mtmr2 was required to maintain wild-type levels of Mtmr5 and Mtmr13, suggesting that these factors function in discrete protein complexes."
    explanation: >-
      Shows the partnering is mutually stabilizing in vivo, so losing one member
      of the complex is not a one-way effect on the other.
  downstream:
  - target: Disordered Endolysosomal Trafficking in Schwann Cells
    causal_link_type: DIRECT
    description: >-
      Endosomal phosphoinositides set the identity and maturation of endosomal
      membranes, so misregulating them derails trafficking through that
      compartment.
    evidence:
    - reference: PMID:34718573
      reference_title: "Distinct roles for the Charcot-Marie-Tooth disease-causing endosomal regulators Mtmr5 and Mtmr13 in axon radial sorting and Schwann cell myelination."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "MTMR5 and MTMR13 are pseudophosphatases predicted to regulate endosomal trafficking by activating Rab GTPases and binding to the phosphoinositide 3-phosphatase MTMR2."
      explanation: >-
        States the causal link this edge asserts - that MTMR5's binding to MTMR2
        and its Rab activation are how it regulates endosomal trafficking.
- name: Disordered Endolysosomal Trafficking in Schwann Cells
  biological_scale: CELLULAR
  description: >-
    Schwann cells are unusually sensitive to disruption of endolysosomal
    membrane trafficking - nearly half the CMT4 genes encode regulators of that
    pathway - because building and maintaining the myelin sheath requires large,
    precisely directed membrane flux and correct trafficking of the receptors
    that time myelination. MTMR5 is almost ubiquitously expressed, yet SBF1
    variants strike the peripheral nervous system, which is the observation this
    node explains.
  cell_types:
  - preferred_term: Myelinating Schwann cell
    term:
      id: CL:0000218
      label: myelinating Schwann cell
  biological_processes:
  - preferred_term: Endosomal transport
    term:
      id: GO:0016197
      label: endosomal transport
    modifier: ABNORMAL
  evidence:
  - reference: PMID:34718573
    reference_title: "Distinct roles for the Charcot-Marie-Tooth disease-causing endosomal regulators Mtmr5 and Mtmr13 in axon radial sorting and Schwann cell myelination."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "β1-integrin through early endosomes is controlled by Rab21, which the DENN domain of Mtmr5/13 has been shown to activate"
    explanation: >-
      Names a specific cargo and the Rab that routes it, connecting the DENN
      domain lost in CMT4B3 to a concrete trafficking step in Schwann cells.
  - reference: PMID:34718573
    reference_title: "Distinct roles for the Charcot-Marie-Tooth disease-causing endosomal regulators Mtmr5 and Mtmr13 in axon radial sorting and Schwann cell myelination."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "β1-integrin is required for the extension and maintenance of Schwann cell processes around axons; loss of this surface receptor leads to radial sorting defects and delayed myelination in mice"
    explanation: >-
      Supplies the reason a trafficking defect reaches radial sorting: the
      receptor whose routing depends on Rab21 is the one Schwann cells need to
      extend processes around axons.
  - reference: PMID:34118926
    reference_title: "Bi-allelic variants in MTMR5/SBF1 cause Charcot-Marie-Tooth type 4B3 featuring mitochondrial dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although almost ubiquitously expressed, pathogenic variants primarily impact on the peripheral nervous system, corroborating the involvement of MTMR5/SBF1 and its molecular partners in Schwann cells-mediated myelinization."
    explanation: >-
      States the tissue-selectivity argument this node makes: broad expression,
      peripheral-nerve-selective disease, implicating Schwann-cell myelination.
  - reference: PMID:34118926
    reference_title: "Bi-allelic variants in MTMR5/SBF1 cause Charcot-Marie-Tooth type 4B3 featuring mitochondrial dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MTMR5/SBF1 is a pseudophosphatase predicted to regulate endo-lysosomal trafficking in tandem with other MTMRs."
    explanation: >-
      Names the cellular process this node is about and its dependence on other
      myotubularins.
  downstream:
  - target: Focally Folded and Redundant Myelin
    causal_link_type: DIRECT
    description: >-
      The membrane-trafficking defect produces excess, misdirected myelin
      membrane rather than a correctly compacted sheath.
  - target: Impaired Axon Radial Sorting
    causal_link_type: DIRECT
    description: >-
      Radial sorting depends on the same trafficking-dependent receptor
      signalling, and mouse Mtmr5 is expressed most highly while it occurs.
  - target: Secondary Mitochondrial Dysfunction and Altered Autophagic Selectivity
    causal_link_type: DIRECT
    description: >-
      Endolysosomal and autophagic membrane traffic are the same pathway, so the
      lesion also reaches mitochondrial quality control.
- name: Focally Folded and Redundant Myelin
  biological_scale: TISSUE
  conforms_to: "schwann_cell_myelin_maintenance#Tomaculous and Onion-Bulb Myelin Remodeling"
  description: >-
    The histological signature of the CMT4B group: myelin sheaths that fold back
    on themselves into redundant loops and outfoldings, with loss of large
    myelinated fibers. In CMT4B3 this was found in the index Korean family,
    although the absolute number of myelinated fibers differed from CMT4B1 and
    CMT4B2. It is characteristic of the demyelinating presentation and is not
    reported in the axonal syndromic families.

- name: Central Nervous System and Cranial Nerve Involvement
  biological_scale: ORGANISM
  description: >-
    In the syndromic families, SBF1 loss also produces progressive microcephaly,
    intellectual disability, cerebellar atrophy with ataxia and pyramidal signs,
    and degeneration of multiple cranial nerves. The mechanism is not
    established. Two observations argue that it is not simply more of the same
    Schwann-cell lesion: the syndromic variants fall in the DENN domain, which
    only SBF1 and SBF2 carry among the myotubularins, and the mtmr5-null
    zebrafish develops reduced head size and brain volume rather than a purely
    peripheral phenotype. Not every severe case has it - one child with severe
    infantile axonal disease had normal brain MRI and normal cognition
    throughout.
  evidence:
  - reference: PMID:30039846
    reference_title: Novel SBF1 splice-site null mutation broadens the clinical spectrum of Charcot-Marie-Tooth type 4B3 disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Four siblings of consanguineous Bedouin kindred presented at infancy with an autosomal recessive syndrome of congenital microcephaly, facial dysmorphism, strabismus, developmental delay and ataxia with positive pyramidal signs."
    explanation: >-
      Documents the CNS arm of this node - microcephaly, developmental delay,
      ataxia and pyramidal signs - in a family with a null SBF1 allele.
  - reference: PMID:27123480
    reference_title: "\"Fork and bracket\" syndrome expands the spectrum of SBF1-related sensory motor polyneuropathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of note, both mutations causative of syndromic CMT4B3 fall within the DENN domain"
    explanation: >-
      Supports the genotype argument this node makes for why the syndromic
      families differ, without asserting the mechanism.
  - reference: PMID:40066109
    reference_title: "Characterization of a novel zebrafish model of MTMR5-associated Charcot-Marie-Tooth disease type 4B3."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "starting by 10 days post-fertilization, mutant zebrafish develop obvious morphometric changes in head size and brain volume"
    explanation: >-
      Model-organism support that mtmr5 loss alone can produce a
      brain-size phenotype, consistent with a CNS role for MTMR5.
  - reference: PMID:40066109
    reference_title: "Characterization of a novel zebrafish model of MTMR5-associated Charcot-Marie-Tooth disease type 4B3."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In total, these data demonstrate that the microcephaly phenotype in mtmr5-KO zebrafish is not caused by excessive apoptosis, autophagy or cell loss in the nervous system, indicating instead potential defects in early neurogenesis."
    explanation: >-
      Constrains the CNS mechanism in the one model that shows it: a
      neurodevelopmental defect rather than degeneration. Zebrafish, so it is a
      lead for the human CNS arm, not an account of it.
  downstream:
  - target: Progressive Microcephaly
    causal_link_type: DIRECT
  - target: Intellectual Disability
    causal_link_type: DIRECT
  - target: Cerebellar Atrophy
    causal_link_type: DIRECT

  downstream:
  - target: Dysmyelination and Slowed Nerve Conduction
    causal_link_type: DIRECT
  - target: Myelin Outfoldings
    causal_link_type: DIRECT
    description: >-
      The finding as it is observed on nerve biopsy and recorded as an

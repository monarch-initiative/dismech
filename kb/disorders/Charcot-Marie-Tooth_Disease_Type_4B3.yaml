notes: >-
  Lump/split. This is curated as a single DISEASE entry on MONDO:0014117, which
  MONDO models as a leaf under MONDO:0018995 (CMT type 4) with one causal gene
  (SBF1) and no descendants. The reported biallelic SBF1 phenotypes span a wide
  range, and the alternative - separate entries for the classic demyelinating
  neuropathy and the severe syndromic form - was considered and rejected. The
  literature does not treat them as separate diseases: each new severe family
  has been published as "expanding the spectrum" or "broadening the clinical
  spectrum" of CMT4B3 rather than as a new entity, there is no separate MONDO,
  OMIM or Orphanet concept for the syndromic form, and ClinGen's expert panel
  curates one SBF1 gene-disease relationship. The variation is therefore
  captured as two has_subtypes entries within one disease, with subtype-scoped
  phenotypes.

  The subtype split is provisional and is argued in the
  `cmt4b3_spectrum_boundaries` discussion. In short: the demyelinating/axonal
  axis and the pure/syndromic axis are not congruent. One reported child had
  severe, rapidly progressive infantile axonal disease with entirely normal
  cognition and normal brain and spinal MRI, so "axonal" does not imply
  "syndromic", and that case also carried compound heterozygous missense
  variants, so allele severity does not cleanly predict which presentation
  results either.

  On optic atrophy. The severe syndromic presentation involves the eye, but
  through cranial neuropathy - ophthalmoparesis, absent pupillary light
  reactivity, strabismus - and one report lists a non-specific "vision problem".
  A PubMed search for SBF1 or MTMR5 together with optic atrophy or optic nerve
  returns no records, and none of the primary reports read for this entry
  describes optic atrophy. It is therefore deliberately not curated as a
  phenotype here. If a source does document it, this note should be corrected
  rather than the phenotype quietly added.

  On "loss of function". MTMR5 is a pseudophosphatase - its myotubularin
  phosphatase domain is catalytically dead. `functional_impact_category:
  LOSS_OF_FUNCTION` on the SBF1 genetic context therefore means loss of the
  protein's regulatory and scaffolding roles (coiled-coil-mediated activation
  and localization of MTMR2, and DENN-domain Rab GTPase activation), not loss of
  an enzymatic activity. The entry's description and the SBF1 Loss of Function
  node say this explicitly so the tag is not misread.

  Orphanet has a record for this disease (ORPHA:363981, cross-referenced from
  MONDO) which would normally be a citable source for the definition and
  epidemiology. It is not cited here because the Orphadata bulk XML is not
  present in this checkout and rebuilding the ORPHA cache requires downloading
  and re-pinning it. That is a gap in this entry, not a statement that the
  record is unusable.

  No phenotype carries a `frequency:` value. With seven to ten families in the
  entire literature and no cohort study, every FrequencyEnum band would be a
  guess, and the schema's own guidance is to omit rather than guess. Where a
  feature is restricted to one presentation that is recorded with `subtype:`
  instead, which is a claim the sources do support.

  Biochemical and clinical_trials sections are absent: no CMT4B3-specific
  laboratory biomarker and no registered trial was identified. `just
  discover-datasets` returned exactly one DIRECT candidate (the zebrafish
  model's RNA-seq, curated above) and one gene-only false positive on SBF1 that
  turned out to be a multiple myeloma study. No human CMT4B3 dataset exists in
  that index.

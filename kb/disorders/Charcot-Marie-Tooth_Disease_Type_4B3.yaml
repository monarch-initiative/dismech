    reference_title: "Selective mitophagy activation and protein aggregate accumulation in MTMR5/SBF1-deficient fibroblasts."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "CMT4B3 fibroblasts showed normal basal macroautophagy but failed to increase autophagy in response to mitochondrial stress or protein aggregates. Conversely, mitophagy was strongly activated via the PINK1-PRKN pathway."
    explanation: >-
      The autophagic-selectivity result this node names, measured in
      patient-derived fibroblasts.
- name: Increased PINK1-PRKN Mitophagy
  biological_scale: CELLULAR
  description: >-
    The same fibroblast study reported increased selective mitochondrial clearance through PINK1-PRKN, contrasting with the failed macroautophagy response. These are observations in R763H/G1064E fibroblasts from one patient. The original variants were classified as uncertain and likely benign, and genetic rescue was not performed; attribution to SBF1 and extrapolation to nerve remain provisional.

pathophysiology:
- name: SBF1 Loss of Function
  biological_scale: MOLECULAR
  conforms_to: "schwann_cell_myelin_maintenance#Myelin Gene Dosage or Structural Lesion in Schwann Cells"
  description: >-
    Biallelic SBF1 variants - missense, frameshift or splice-site - reduce or
    abolish functional MTMR5. The protein's own myotubularin phosphatase domain
    is catalytically inactive, so this is not the loss of an enzyme. What is
    lost is MTMR5's regulatory and scaffolding role: a coiled-coil-mediated
    interaction that raises MTMR2's phosphoinositide 3-phosphatase activity and
    fixes where in the cell MTMR2 acts, and an N-terminal DENN domain that
    activates Rab GTPases. Reported pathogenic variants cluster in the DENN and
    SBF2 domains but occur throughout the gene, and are generally associated
    with loss of expression or of function. A frameshift allele has been shown
    directly to reduce MTMR5 protein in patient cells. `zygosity` is
    deliberately left unset: reported families are homozygous (the
    consanguineous ones) or compound heterozygous (the index Korean and the
    Italian families), the slot is single-valued, and the enum has no
    "biallelic" value that would cover both without misreporting one.

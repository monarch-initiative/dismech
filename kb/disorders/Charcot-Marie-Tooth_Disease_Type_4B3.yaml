    presentation this appears as markedly slowed motor conduction velocities; in
    the axonal syndromic presentation velocities are relatively preserved and it
    is the action-potential amplitudes that collapse. A zebrafish mtmr5 knockout
    shows dysmyelination changes described as reminiscent of the human nerve
    pathology.

- name: Whole exome sequencing
  diagnosis_term:
    preferred_term: whole exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  presence: PRESENT
  description: >-
    Exome sequencing identified SBF1 variants in several published families, including the original Korean, Bedouin and British reports. It is one diagnostic approach; it is not the only way to detect SBF1 variants and does not by itself establish their pathogenicity.
  results: >-
    A biallelic SBF1 variant surviving the filtering pipeline, segregating with
    disease in the pedigree.
  evidence:

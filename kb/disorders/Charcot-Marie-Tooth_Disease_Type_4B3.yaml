  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Published family counts are sparse, dated author tallies rather than systematic ascertainment or population prevalence estimates. The 2016 paper cited two earlier families before adding its own; later reports used differing literature counts. They should not be read as a validated chronological census or used to estimate phenotype frequencies.
  evidence:

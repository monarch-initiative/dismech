has_subtypes:
- name: Classic CMT4B3
  display_name: Classic demyelinating CMT4B3
  description: >-
    The presentation of the index Korean family and the one that named the
    disease: a pure sensorimotor demyelinating neuropathy with focally folded
    myelin sheaths on nerve biopsy, closely resembling CMT4B1 and CMT4B2, with
    first-decade onset of distal weakness and atrophy, impaired vibration and
    position sense, areflexia and pes planus, and no cognitive, dysmorphic or
    other extraneurological features. These patients were compound
    heterozygous for two missense variants that most in-silico tools called
    benign or tolerated.
  evidence:
  - reference: PMID:27123480
    reference_title: "\"Fork and bracket\" syndrome expands the spectrum of SBF1-related sensory motor polyneuropathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the original Korean family, 3 siblings showed a homogeneous phenotype of pure sensory motor demyelinating neuropathy with focally folded myelin sheaths, closely resembling CMT4B1 and CMT4B2."
    explanation: >-
      Defines the pure demyelinating presentation that this subtype names, and
      places it alongside the CMT4B1 and CMT4B2 siblings.
- name: Syndromic SBF1 Neuropathy
  display_name: Severe syndromic SBF1-related neuropathy
  description: >-
    A descriptive grouping of SBF1 neuropathy with additional cranial nerve, CNS or developmental manifestations. Microcephaly, intellectual disability, syndactyly, cerebellar atrophy and pyramidal signs occur in some families but are not requirements: Spanish brothers and British siblings had cranial neuropathy without the microcephaly and moderate-to-severe intellectual disability of the Saudi and Syrian families. Neuropathy is often predominantly axonal, but conduction velocity and severity vary. This grouping and the classic demyelinating presentation are provisional clinical descriptions, not validated mutually exclusive mechanistic subtypes.
  evidence:
  - reference: PMID:27123480
    reference_title: "\"Fork and bracket\" syndrome expands the spectrum of SBF1-related sensory motor polyneuropathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the second SBF1-mutated family, from Saudi Arabia, the 3 affected siblings presented a more complex syndromic phenotype. Sensory motor polyneuropathy was associated with progressive microcephaly, intellectual disability, syndactyly, and multiple cranial nerve involvement, which resulted in ophthalmoparesis, absence of pupil reactivity to light, mild facial weakness, swallowing difficulties, and dysarthria."
    explanation: >-
      The Saudi family illustrates one syndromic presentation; the listed features do not define every syndromic SBF1 family.
  - reference: PMID:27123480
    reference_title: "\"Fork and bracket\" syndrome expands the spectrum of SBF1-related sensory motor polyneuropathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "both families presented a predominantly axonal sensory motor neuropathy with evidence of denervation, markedly reduced amplitude of action potentials, and relatively preserved nerve conduction velocities"
    explanation: >-
      The Saudi and Syrian families had predominantly axonal neuropathy. This comparison is family-specific, not an absolute electrophysiological boundary across all SBF1 disease.
inheritance:
- name: Autosomal Recessive
  description: >-
    The established gene-disease model is autosomal recessive, with homozygous or compound heterozygous SBF1 variants. The Spanish brothers were compound heterozygotes born to nonconsanguineous parents; the necklace-fibre family was British and carried a homozygous frameshift. The Italian R763H/G1064E pair was in trans, but the original authors classified the variants as uncertain and likely benign, respectively, despite attributing the phenotype to SBF1. A separate heterozygous H466Q dominant claim remains unresolved. The cited ClinGen snapshot classifies recessive SBF1-CMT4B3 as Moderate.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: CGGV:assertion_c0f814d9-02db-4c0c-8e1c-20a7759d993f-2024-12-02T170000.000Z
    reference_title: "SBF1 / Charcot-Marie-Tooth disease type 4B3 (Moderate)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "SBF1 | HGNC:10542 | Charcot-Marie-Tooth disease type 4B3 | MONDO:0014117 | AR | Moderate | SOP11 | Charcot-Marie-Tooth Disease Gene Curation Expert Panel"
    explanation: >-
      ClinGen expert-panel gene-disease validity assertion recording autosomal
      recessive inheritance for SBF1-CMT4B3, at Moderate classification.
  - reference: PMID:32444983
    reference_title: A novel frameshift deletion in autosomal recessive SBF1-related syndromic neuropathy with necklace fibres.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "WES identified a novel homozygous frameshift deletion (c.5477-5478del; p.1826-1826del) in exon 40 of the SBF1 gene in the two siblings, while both parents and the unaffected sibling were heterozygous carriers."
    explanation: >-
      Direct segregation evidence for recessive inheritance: affected siblings
      homozygous, unaffected parents and sibling heterozygous.

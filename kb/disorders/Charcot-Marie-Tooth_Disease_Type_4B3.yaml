name: Charcot-Marie-Tooth Disease Type 4B3
creation_date: "2026-09-07T00:00:00Z"
category: Mendelian
description: >-
  Charcot-Marie-Tooth disease type 4B3 (CMT4B3) is a rare autosomal recessive neuropathy associated with biallelic SBF1 variants. SBF1 encodes MTMR5, a catalytically inactive myotubularin that binds and regulates the active phosphoinositide phosphatase MTMR2. Reported presentations range from demyelinating neuropathy with myelin outfoldings to predominantly axonal neuropathy with variable cranial nerve, cognitive, brain-growth and skeletal involvement. These features do not form a uniform severity gradient. Protein reduction has been demonstrated for one frameshift allele; effects of individual missense alleles and the links between MTMR5 regulation, trafficking, axonal injury and CNS disease remain incompletely resolved. Mitochondrial and autophagy abnormalities have been investigated in patient-derived fibroblasts, with important limits on causal and tissue extrapolation. Management is supportive and adapted to the individual phenotype.

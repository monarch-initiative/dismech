    snippet: "In contrast to CMT4B1, CMT4B2, and the pure neuropathic form of CMT4B3, which are all characterized by demyelinating neuropathy with focally folded myelin sheaths, both families presented a predominantly axonal sensory motor neuropathy with evidence of denervation, markedly reduced amplitude of action potentials, and relatively preserved nerve conduction velocities"

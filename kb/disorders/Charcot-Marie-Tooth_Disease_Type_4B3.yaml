- name: Impaired Inducible Macroautophagy
  biological_scale: CELLULAR
  description: >-
    Basal macroautophagy was normal, but patient fibroblasts failed to augment it in response to mitochondrial stress or protein aggregates. This is a defect of inducible response, not total absence of autophagy. These are observations in R763H/G1064E fibroblasts from one patient. The original variants were classified as uncertain and likely benign, and genetic rescue was not performed; attribution to SBF1 and extrapolation to nerve remain provisional.
  evidence:

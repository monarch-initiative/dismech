    reference_title: "Bi-allelic variants in MTMR5/SBF1 cause Charcot-Marie-Tooth type 4B3 featuring mitochondrial dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Studies in muscle identified partial defects of oxidative metabolism."
    explanation: >-
      The in-patient observation that the mitochondrial arm of this node rests
      on.
  - reference: PMID:40998285
    reference_title: "Selective mitophagy activation and protein aggregate accumulation in MTMR5/SBF1-deficient fibroblasts."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "CMT4B3 fibroblasts showed normal basal macroautophagy but failed to increase autophagy in response to mitochondrial stress or protein aggregates. Conversely, mitophagy was strongly activated via the PINK1-PRKN pathway."
    explanation: >-
      The autophagic-selectivity result this node names, measured in
      patient-derived fibroblasts.
  - reference: PMID:42627996
    reference_title: "Mitochondrial dysfunction, metabolic quiescence and premature senescence in CMT4B3 fibroblasts."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Patient fibroblasts exhibited fragmented mitochondrial networks with a shift toward fission, together with reduced ATP production, while mitochondrial mass, respiratory chain assembly, and markers of mitochondrial biogenesis were preserved."
    explanation: >-
      Preserved respiratory chain assembly alongside reduced ATP output is the
      specific observation supporting "secondary" rather than primary
      mitochondrial disease.
  downstream:

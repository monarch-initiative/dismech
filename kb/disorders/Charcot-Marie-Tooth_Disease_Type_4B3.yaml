    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Impaired mitochondrial quality control is a plausible contributor to the
      axonal arm of the disease. The link is proposed by the cited authors, not
      demonstrated in nerve.
- name: Dysmyelination and Slowed Nerve Conduction
  biological_scale: TISSUE
  conforms_to: "schwann_cell_myelin_maintenance#Dysmyelination and Segmental Demyelination of Peripheral Nerve"
  description: >-

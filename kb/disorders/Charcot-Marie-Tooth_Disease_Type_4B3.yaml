- name: Fibroblast Senescence-like Phenotype
  biological_scale: CELLULAR
  description: >-
    Reduced proliferation, increased senescence-associated beta-galactosidase staining and increased p53/p21 were observed alongside the metabolic and signalling changes. Their temporal and causal ordering was not resolved. These are observations in R763H/G1064E fibroblasts from one patient. The original variants were classified as uncertain and likely benign, and genetic rescue was not performed; attribution to SBF1 and extrapolation to nerve remain provisional.

- name: Secondary Mitochondrial Dysfunction and Altered Autophagic Selectivity
  biological_scale: CELLULAR
  description: >-
    Muscle from one CMT4B3 child showed partial defects of oxidative metabolism,
    and fibroblasts from the same patient have fragmented mitochondrial networks
    with reduced ATP production despite preserved mitochondrial mass and
    respiratory chain assembly, strongly activated PINK1-PRKN mitophagy without
    the matching rise in macroautophagy, and features of premature senescence.
    This is presented as a downstream consequence of the trafficking and
    autophagy lesion, not as a primary respiratory chain defect - which is what
    separates CMT4B3 from CMT4K, where the gene itself is a complex IV assembly
    factor.
  cell_types:
  - preferred_term: Skin fibroblast
    term:
      id: CL:0002620
      label: skin fibroblast

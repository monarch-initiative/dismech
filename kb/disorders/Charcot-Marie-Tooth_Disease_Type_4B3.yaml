discussions:
- discussion_id: cmt4b3_mouse_lacks_outfoldings
  prompt: >-
    Why does a complete Mtmr5 null in mouse produce no myelin outfoldings, when
    focally folded myelin is the diagnostic hallmark of human CMT4B3 - and does
    that mean radial sorting, not myelin maintenance, is the mechanism in
    patients too?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Focally Folded and Redundant Myelin
  - pathophysiology#Impaired Axon Radial Sorting
  - animal_models#Mtmr5-null mouse
  rationale: >-
    The Korean missense family had myelin outfoldings, whereas adult Mtmr5-null mouse nerves had sorting abnormalities and fewer myelinated axons with normal sheath thickness. Allele-specific effects on MTMR2, species differences and cell-specific requirements remain possible explanations. Zebrafish deletion produces axon-myelin detachment rather than a demonstrated equivalent of the Korean outfolding lesion. The model findings should remain distinct.
  evidence:
  - reference: PMID:34718573
    reference_title: "Distinct roles for the Charcot-Marie-Tooth disease-causing endosomal regulators Mtmr5 and Mtmr13 in axon radial sorting and Schwann cell myelination."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Our findings suggest that Mtmr5 and Mtmr13 ensure proper axon radial sorting and Schwann cell myelination, respectively, perhaps through their direct interactions with Mtmr2."
    explanation: >-
      States the proposed division of labour that, if it holds in humans, would
      explain the mismatch.
  - reference: PMID:34718573
    reference_title: "Distinct roles for the Charcot-Marie-Tooth disease-causing endosomal regulators Mtmr5 and Mtmr13 in axon radial sorting and Schwann cell myelination."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The form of Charcot-Marie-Tooth type 4B (CMT4B) disease caused by mutations in myotubularin-related 5 (MTMR5; also called SET binding factor 1, SBF1) shows a spectrum of axonal and demyelinating nerve phenotypes. This contrasts with the CMT4B subtypes caused by MTMR2 or MTMR13 (SBF2) mutations, which are characterized by myelin outfoldings and classic demyelination."
    explanation: >-
      The authors' statement of how human SBF1 disease differs from its CMT4B1
      and CMT4B2 siblings, which is the human-side half of this mismatch.
  - reference: PMID:39461113
    reference_title: "Establishment and characterization of three human pluripotent stem cell lines from Charcot-Marie-Tooth disease Type 4B3 patients bearing mutations in MTMR5/Sbf1 gene."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Current MTMR5 -/- animal models do not clearly link Sbf1 mutations to severe neuropathy, so such a resource is highly desired to further elucidate the relationship between MTMR5 dysfunction and peripheral nerve degeneration."
    explanation: >-
      An independent group's statement of the same gap, and their reason for
      building a human cellular model instead.
- discussion_id: cmt4b3_syndromic_mechanism
  prompt: >-
    By what mechanism does SBF1 loss produce microcephaly, intellectual
    disability, cerebellar atrophy and cranial neuropathy in some families and
    a purely peripheral neuropathy in others?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Abnormal Brain Growth
  - has_subtypes#Syndromic SBF1 Neuropathy
  rationale: >-
    DENN-domain missense variants were an early clue, but subsequent syndromic cases carried truncating alleles. Zebrafish have reduced absolute brain dimensions together with reduced body size; no causal neurogenesis defect was measured. Healthy-donor iNeuron experiments show MTMR5-dependent autophagy regulation, but do not explain why only some SBF1 families develop microcephaly, intellectual disability or cranial neuropathy.
  evidence:
  - reference: PMID:27123480
    reference_title: "\"Fork and bracket\" syndrome expands the spectrum of SBF1-related sensory motor polyneuropathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, the severe syndromic phenotype shown by 2 SBF1-mutated families calls for additional explanations."
    explanation: >-
      The authors' own statement that the MTMR2-partnering mechanism does not
      account for the syndromic phenotype.
  - reference: PMID:27123480
    reference_title: "\"Fork and bracket\" syndrome expands the spectrum of SBF1-related sensory motor polyneuropathies."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "However, an SBF2 deletion abolishing the whole D-DENN module caused nonsyndromic demyelinating neuropathy in a Turkish family."
    explanation: >-
      Argues against the simplest version of the DENN-domain hypothesis, and is
      recorded here so the hypothesis is not read as established.
- discussion_id: cmt4b3_spectrum_boundaries
  prompt: >-
    Are the demyelinating/axonal and pure/syndromic axes of SBF1 disease two
    descriptions of one severity gradient, or genuinely separable entities?
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - has_subtypes#Classic CMT4B3
  - has_subtypes#Syndromic SBF1 Neuropathy
  rationale: >-
    Demyelinating versus axonal physiology and isolated versus syndromic disease are not a validated severity scale. Spanish and British families had cranial nerve involvement without the microcephaly and moderate-to-severe intellectual disability of the Saudi/Syrian families. The Italian child had severe motor axonal disease with normal cognition and MRI, but the original R763H/G1064E classifications were uncertain/likely benign, so its use as a genotype-phenotype counterexample requires that qualification. The two subtype labels are descriptive and incomplete.
  evidence:
  - reference: PMID:27123480
    reference_title: "\"Fork and bracket\" syndrome expands the spectrum of SBF1-related sensory motor polyneuropathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the Korean patients with pure demyelinating neuropathy were compound heterozygous for 2 missense variants, both predicted as benign or tolerated by most prediction software, suggesting a mild impact on the protein. On the contrary, the 2 families with severe syndromic presentation carried missense mutations that were consistently predicted to be deleterious for the protein structure or function"
    explanation: >-
      States the proposed genotype-phenotype correlation that the two subtypes
      here follow.
  - reference: PMID:34118926
    reference_title: "Bi-allelic variants in MTMR5/SBF1 cause Charcot-Marie-Tooth type 4B3 featuring mitochondrial dysfunction."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "We report a case of severe CMT4B3 characterized by early-onset motor and axonal polyneuropathy in an Italian child in absence of any evidence of brain and spine MRI abnormalities or intellectual disability and with a biochemical profile suggestive of mitochondrial disease."
    explanation: >-
      The counterexample: severe and axonal without any syndromic CNS or
      cognitive involvement, which is why the two axes are recorded as
      non-congruent.
- discussion_id: cmt4b3_dominant_report
  prompt: >-
    Does the reported heterozygous SBF1 p.H466Q mother-daughter pair establish a
    dominant form of SBF1 neuropathy, or is a second allele or another cause
    unaccounted for?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - inheritance#Autosomal Recessive
  rationale: >-
    A mother and daughter with axonal neuropathy carried heterozygous H466Q. The authors classified the variant as VUS (PM2, PP2, PP3), despite proposing dominant causation. In-silico predictions and two-person segregation do not establish a dominant-negative mechanism or exclude an unrecognized second allele. The earlier mouse paper's statement that known variants were recessive predates this report and cannot refute it. The 2026 toe-walking cohort was selected after genetic testing, lacked control enrichment, segregation and nerve-conduction studies, and predominantly carried VUS; it does not resolve dominant causality.
  evidence:
  - reference: PMID:39664754
    reference_title: A novel SBF1 missense mutation causes autosomal dominant Charcot-Marie-Tooth disease type 4B3.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sequencing identified a novel missense mutation (c.1398C > A, p.H466Q) in exon 13 of the SET binding factor 1 (SBF1) gene in both patients, indicating an autosomal dominant inheritance pattern."
    explanation: The claim itself, as its authors state it.
  - reference: PMID:41737274
    reference_title: "Pediatric toe-walking cohort with heterozygous SBF1 variants: A phenotypic description."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "heterozygous SBF1 variants were observed in children with persistent toe walking and accompanying mild neuromotor/musculoskeletal features that partially overlap with reported CMT4B3 phenotypes; however, these findings are descriptive and do not establish causality or enrichment"
    explanation: >-
      An independent cohort in which monoallelic SBF1 variants, mostly VUS, sit
      beside a mild neuromotor phenotype and the authors decline to call them
      causal. It is the same interpretive problem the dominant report faces, in
      a larger sample.
  - reference: PMID:39664754
    reference_title: "A novel SBF1 missense mutation causes autosomal dominant Charcot-Marie-Tooth disease type 4B3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "which should be classified as a Variant of Uncertain Significance (VUS)."
    explanation: >-
      The authors' explicit classification limits the proposed dominant interpretation.
- discussion_id: cmt4b3_no_disease_modifying_therapy
  prompt: >-
    Is there any tractable therapeutic target in CMT4B3, given that the lost
    protein is a scaffold rather than an enzyme?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - treatments#
  rationale: >-
    Published care remains supportive. Mdivi-1 changes mitochondrial morphology in one patient fibroblast line, without demonstrated clinical benefit or correction of neuropathy. Zebrafish offer a screening platform, but proposed candidate compounds were not tested for SBF1 rescue in that study. Manipulating MTMR5 to enhance autophagy in healthy-donor neurons is not evidence that reducing an already deficient protein would treat CMT4B3.
  evidence:
  - reference: PMID:40066109
    reference_title: "Characterization of a novel zebrafish model of MTMR5-associated Charcot-Marie-Tooth disease type 4B3."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "There is an incomplete understanding of the disease pathomechanism(s) underlying Charcot-Marie-Tooth type 4B3, and despite its severe clinical presentation, currently no disease-modifying therapies."
    explanation: >-
      Directly states both halves of this gap - incomplete mechanism and no
      disease-modifying therapy.
- discussion_id: cmt4b3_cell_context
  prompt: How do genotype, cell type and assay conditions account for differing mitochondrial and autophagy findings?
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - pathophysiology#Reduced Fibroblast Bioenergetic Output
  - pathophysiology#Impaired Inducible Macroautophagy
  - pathophysiology#Reduced Fibroblast Glutathione
  rationale: >-
    The Italian fibroblast studies report metabolic quiescence and failed inducible macroautophagy. Four other patient lines show variable ATP levels, increased glycolytic reliance and reduced glutathione without excess basal ROS. Healthy-donor glutamatergic neurons instead show enhanced inducible autophagy after SBF1 knockdown. Genotypes, cellular identity, stimuli and measurements differ, so these findings neither establish a universal defect nor directly refute one another. No study resolves the full causal sequence in patient peripheral neurons.
  evidence:
  - reference: PMID:39918771
    reference_title: "Charcot Marie Tooth disease pathology is associated with mitochondrial dysfunction and lower glutathione production."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: "the level of GSH in the fibroblasts with CMT4B3 associated mutations is significantly lower than in control fibroblasts"
    explanation: >-
      Four patient lines and two controls were studied; glutathione depletion was not accompanied by increased basal ROS production.
  - reference: PMID:35580604
    reference_title: "Myotubularin-related phosphatase 5 is a critical determinant of autophagy in neurons."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "knockdown of SBF1 in iNeurons significantly increased the number of mEGFP-LC3-positive puncta after Torin1 treatment"
    explanation: >-
      Engineered healthy-donor neuronal models establish cell-context-specific MTMR5 regulation, not a patient CMT4B3 phenotype.
  - reference: PMID:42627996
    reference_title: "Mitochondrial dysfunction, metabolic quiescence and premature senescence in CMT4B3 fibroblasts."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Patient fibroblasts exhibited fragmented mitochondrial networks with a shift toward fission, together with reduced ATP production, while mitochondrial mass, respiratory chain assembly, and markers of mitochondrial biogenesis were preserved."
    explanation: >-
      ATP impairment is directly observed; preserved assembly does not prove that mitochondrial changes are downstream of SBF1 trafficking.
datasets:
- accession: geo:GSE290354
  title: Characterization of a novel zebrafish model of MTMR5-associated Charcot-Marie-Tooth disease type 4B3
  description: >-
    Brain-enriched bulk RNA sequencing from seven-day zebrafish heads: four wild-type and four mtmr5-knockout biological replicates, each pooling 11–17 heads. Sampling precedes the overt brain-size change. The study identified 2,040 differentially expressed genes at adjusted P < 0.01 and absolute log2 fold change > 1, with neurogenesis, chromatin and synaptic pathway enrichment; enrichment does not establish a causal mechanism.
  data_type: BULK_RNA_SEQ
  organism:
    preferred_term: zebrafish
    term:
      id: NCBITaxon:7955
      label: Danio rerio
  publication: PMID:40066109
  evidence:
  - reference: GEO:GSE290354
    reference_title: Characterization of a novel zebrafish model of MTMR5-associated Charcot-Marie-Tooth disease type 4B3
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "RNA sequencing from brain-enriched samples identifies novel disease pathways including transcriptional changes in genes responsible for neurogenesis, chromatin remodeling/organization, and synaptic membrane homeostasis."
    explanation: >-
      The GEO record's own summary of what this dataset measured and found.
  notes: >-
    This is model-organism head tissue rather than patient peripheral nerve. Human R763H/G1064E fibroblast transcriptomic results are also reported in PMID:42627996 Supplementary File S1; they are not represented by this GEO accession.

notes: >-
  SBF1 neuropathy is represented as one disease with provisional descriptive presentations. Neither axonal physiology nor a truncating allele implies a fixed syndromic phenotype. Original variant classifications, assay context and model limitations are retained where reported causality is uncertain. MTMR5 lacks intrinsic phosphatase activity; loss of function refers to protein abundance or regulatory interactions. Published family reports do not support population-wide phenotype frequencies. Mitochondrial, redox and autophagy findings are cell- and genotype-dependent and are not validated clinical biomarkers or treatment targets. The current GeneReviews CMT Overview supplies general clinical, diagnostic and management context; its PubMed abstract is purpose-only, so the full chapter is cited. Disease-specific phenotype coverage rests on the SBF1 family reports.
mechanistic_hypotheses:
- hypothesis_group_id: cmt4b3_trafficking
  hypothesis_label: MTMR5-dependent MTMR2 regulation and endosomal trafficking
  status: EMERGING
  description: >-
    Normal biochemical interactions and engineered constructs motivate this mechanism; lipid and receptor trafficking changes are not established across human CMT4B3 alleles.
- hypothesis_group_id: cmt4b3_sorting
  hypothesis_label: Endosomal regulation contributes to axon radial sorting
  status: EMERGING
  description: >-
    Constitutive mouse knockout provides morphological evidence for sorting abnormalities. The receptor mechanism, cell autonomy and relevance to human disease remain unresolved.
- hypothesis_group_id: cmt4b3_mitochondrial
  hypothesis_label: Mitochondrial impairment contributes to axonal disease
  status: EMERGING
  description: >-
    Fibroblast and muscle findings suggest a mitochondrial contribution, but variant causality, genetic rescue and nerve-specific validation remain unresolved.
- hypothesis_group_id: cmt4b3_redox
  hypothesis_label: NADPH limitation impairs glutathione regeneration
  status: EMERGING
  description: >-
    Patient fibroblasts show correlated NADPH and glutathione reductions; altered glucose partitioning and redox vulnerability are proposed, without direct metabolic-flux or genetic-rescue proof.
biochemical:
- name: Muscle respiratory-chain activities
  presence: Reduced in one reported patient
  notes: >-
    In the Italian R763H/G1064E case, complex I, II+III and IV activities were 65%, 55% and 66% of normal, respectively. These are case-specific biochemical observations, not validated diagnostic cutoffs for SBF1 disease. Variant causality and the mechanism of mitochondrial impairment remain unresolved.
  evidence:
  - reference: PMID:34118926
    reference_title: "Bi-allelic variants in MTMR5/SBF1 cause Charcot-Marie-Tooth type 4B3 featuring mitochondrial dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "activity to be 65, 55 and 66% of normal values, respectively"
    explanation: >-
      Muscle enzymology in the single Italian case; complex identities and control normalization are described in the adjacent Results and Figure 1.
- name: Muscle mitochondrial DNA content
  presence: Reduced in one reported patient
  notes: >-
    Muscle mtDNA content was about 30% of normal control values, not a 30% reduction. Cultured fibroblast mtDNA/nDNA was normal, so this is tissue-specific and cannot be generalized across CMT4B3.
  evidence:
  - reference: PMID:34118926
    reference_title: "Bi-allelic variants in MTMR5/SBF1 cause Charcot-Marie-Tooth type 4B3 featuring mitochondrial dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "the mtDNA level in muscle (about 30% of normal control values)"
    explanation: >-
      The primary study explicitly distinguishes muscle from fibroblasts.
- name: Serum creatine kinase
  presence: Mildly elevated in two Spanish brothers
  notes: >-
    Reported values were 290 and 420 IU/L against the study upper reference limit of 195 IU/L. Nonspecific evidence of muscle involvement; not a CMT4B3 diagnostic biomarker.
  evidence:
  - reference: PMID:28005197
    reference_title: "SBF1 mutations associated with autosomal recessive axonal neuropathy with cranial nerve involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "Creatine kinase levels were 290 IU/L in patient II:3 and 420 IU/L in patient II:2 (normal values ≤195 IU/L)."
    explanation: >-
      Case-specific measurements and the study reference limit.

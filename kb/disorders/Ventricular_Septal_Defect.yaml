  evidence:
  - reference: PMID:39711769
    reference_title: "Pulmonary arterial hypertension with left to right shunts: When to treat and/or close?"
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Others may benefit from a "treat and repair" strategy, which involves the
      use of PAH therapy to achieve a drop in PVR, with the aim of achieving
      operability criteria.
    explanation: >-
      Supports the treat-and-repair rationale. Graded PARTIAL because the source

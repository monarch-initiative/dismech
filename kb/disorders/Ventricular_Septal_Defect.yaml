genetic:
- name: GATA4
  gene_term:
    preferred_term: GATA4
    term:
      id: hgnc:4173
      label: GATA4
  relationship_type: CAUSATIVE
  notes: >
    Heterozygous GATA4 missense (G296S) and frameshift (E359del) mutations
    segregate with isolated cardiac septal defects in large pedigrees, acting
    through reduced transcriptional activity and loss of the GATA4-TBX5
    interaction.
  evidence:
  - reference: PMID:12845333
    reference_title: "GATA4 mutations cause human congenital heart defects and reveal an interaction with TBX5."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In a second family, we identified a frame-shift mutation of GATA4 (E359del)
      that was transcriptionally inactive and segregated with cardiac septal
      defects.
    explanation: >-
      Independent segregating mutation in a second pedigree, which is what raises
      this from association to causation.
- name: NKX2-5
  gene_term:
    preferred_term: NKX2-5
    term:
      id: hgnc:2488
      label: NKX2-5
  relationship_type: CAUSATIVE
  notes: >
    NKX2-5 was the first gene identified by linkage in non-syndromic congenital
    heart defects. Mouse work shows that even a defined Nkx2-5 mutation yields a
    phenotype whose penetrance depends heavily on modifier loci.
  evidence:
  - reference: PMID:12845333
    reference_title: "GATA4 mutations cause human congenital heart defects and reveal an interaction with TBX5."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Only one causative gene, NKX2-5, has been identified through genetic
      linkage analysis of pedigrees with non-syndromic CHDs.
    explanation: >-
      Establishes NKX2-5 as a linkage-identified causative gene for non-syndromic
      congenital heart defects.
- name: TBX5
  gene_term:
    preferred_term: TBX5
    term:
      id: hgnc:11604
      label: TBX5
  relationship_type: CAUSATIVE
  notes: >
    TBX5 is responsible for a subset of syndromic cardiac septal defects, and the
    specific missense mutations that cause them disrupt the same GATA4-TBX5
    interaction that GATA4 mutations abolish from the other side.
  evidence:
  - reference: PMID:12845333
    reference_title: "GATA4 mutations cause human congenital heart defects and reveal an interaction with TBX5."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      interaction of Gata4 and TBX5 was disrupted by specific human TBX5 missense
      mutations that cause similar cardiac septal defects.
    explanation: >-
      Establishes that disease-causing TBX5 mutations converge on the same
      protein-protein interaction. Evidence source is IN_VITRO because the
      interaction was assayed biochemically.
animal_models:
- name: Nkx2-5(+/-) heterozygous knockout mouse
  species: Mus musculus
  genotype: Nkx2-5(+/-) heterozygous knockout on a C57BL/6 x FVB/N second-generation intercross
  category: Genetic model with mapped modifier loci
  publication: PMID:22534315
  modeled_mechanisms:
  - target: Cardiac Septation Transcriptional Program Disruption
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      A heterozygous null allele of a curated human septation-network gene
      produces ventricular septal defects in the mouse, which is the mechanism
      this node asserts.
  - target: Stochastic Error in Cardiac Morphogenesis
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    limitations: >-
      The model shows that the residual variance has structure - mapped modifier
      loci and a maternal-age effect - which is not the same claim as irreducible
      developmental noise. It demonstrates that defect occurrence is incompletely
      determined by genotype; it does not establish that the human residual is
      stochastic rather than merely undetected.
    description: >-
      Same-genotype littermates differ in whether a defect forms, and the
      variation is attributable to modifier loci and to maternal age rather than
      to the causal mutation - the experimental analogue of the discordance
      between monozygotic human twins.
  description: >
    The model that makes this entry's two hypotheses compatible rather than
    competing. Phenotyping over 3,100 hearts from an intercross of two inbred
    backgrounds carrying the same heterozygous Nkx2-5 knockout mapped modifier
    loci on chromosomes 6, 8, and 10 governing susceptibility to membranous
    defects, with the chromosome 6 locus overlapping one for muscular defect
    susceptibility. A defined causal mutation therefore does not determine
    whether a defect forms - genetic background does much of the work. The
    maternal-age finding is the sharper result: maternal age correlated with
    defect risk in Nkx2-5(+/-) animals but not in wild-type littermates,
    unrelated to aneuploidy, meaning an environmental variable acts only on a
    genetically predisposed background.
  evidence:
  - reference: PMID:22534315
    reference_title: "Complex trait analysis of ventricular septal defects caused by Nkx2-5 mutation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Genetic linkage analysis mapped loci with lod scores of 5 to 7 on
      chromosomes 6, 8, and 10 that influence the susceptibility to membranous
      VSDs in Nkx2-5(+/-) animals.
    explanation: >-
      Establishes mapped modifier loci acting on a defined causal mutation.
      Evidence source is MODEL_ORGANISM because this is a mouse intercross.
  - reference: PMID:22534315
    reference_title: "Complex trait analysis of ventricular septal defects caused by Nkx2-5 mutation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Multiple logistic regression analysis for environmental variables revealed
      that maternal age is correlated with the risk of membranous and muscular
      VSD in Nkx2-5(+/-) but not wild-type animals.
    explanation: >-
      The genotype-conditional environmental effect: maternal age acts only on
      the predisposed background, which is exactly the gene-environment structure
      the two curated hypotheses jointly predict.
  - reference: PMID:22534315
    reference_title: "Complex trait analysis of ventricular septal defects caused by Nkx2-5 mutation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The risk of a VSD is not only complex but dynamic. Whereas the effect of
      genetic modifiers on risk remains constant, the effect of maternal aging
      increases over time.
    explanation: >-
      Distinguishes a constant genetic contribution from a time-varying
      environmental one, which is why neither hypothesis in this entry is framed
      as sufficient on its own.
environmental:
- name: Periconceptional folic acid supplementation
  exposure_term:
    preferred_term: periconceptional folic acid supplementation exposure
    modifier: INCREASED
    term:
      id: ECTO:9000123
      label: exposure to folic acid
  description: >
    Maternal periconceptional folic acid supplement use is associated with an
    approximately 20% lower prevalence of congenital heart defects. It acts, if
    it acts causally, during the same organogenetic window in which septation
    occurs - which is what makes it a candidate modifier of the error rate the
    stochastic account posits, rather than a treatment of an established defect.
  influences_mechanisms:
  - target: Stochastic Error in Cardiac Morphogenesis
    environmental_effect: PROTECTS_AGAINST
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Adequate periconceptional folate is proposed to lower the rate of
      morphogenetic error during septation. The intermediates are unknown and the
      association is measured at the level of congenital heart defects as a
      class, so the edge is deliberately typed as indirect with unknown
      intermediates.
    evidence:
    - reference: PMID:19952004
      reference_title: "Protective effect of periconceptional folic acid supplements on the risk of congenital heart defects: a registry-based case-control study in the northern Netherlands."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Use of periconceptional folic acid supplements was related to
        approximately 20% reduction in the prevalence of any CHD.
      explanation: >-
        Quantifies the protective association. Graded PARTIAL because it is
        measured across all congenital heart defects rather than ventricular
        septal defect specifically, and because no mechanism linking folate to
        septation error is demonstrated.
  evidence:
  - reference: PMID:19952004
    reference_title: "Protective effect of periconceptional folic acid supplements on the risk of congenital heart defects: a registry-based case-control study in the northern Netherlands."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our results support the hypothesis that additional periconceptional folic
      acid use reduces CHD risk in infants.
    explanation: >-
      Supports a protective association. Graded PARTIAL because the finding is
      for congenital heart defects as a class in a registry-based case-control
      design, not ventricular septal defect specifically.
- name: Maternal diabetes mellitus in pregnancy
  description: >
    Offspring of women with diabetes carry an increased risk of ventricular
    septal defect. The effect is defect-specific and quantified: a relative risk
    of 1.31 for ventricular septal defect in offspring of women with gestational
    diabetes. Pre-gestational diabetes carries a higher overall risk of
    congenital heart defects than gestational diabetes does, which is
    mechanistically coherent -
    septation occurs in weeks three to eight, before gestational hyperglycaemia
    typically develops - and is one of the few places where exposure timing and
    developmental timing can be compared directly.
  influences_mechanisms:
  - target: Stochastic Error in Cardiac Morphogenesis
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      A diabetic intrauterine environment during organogenesis raises the
      probability of a septation error. Typed as predisposing rather than
      triggering because the great majority of exposed pregnancies produce no
      defect.
    evidence:
    - reference: PMID:35104296
      reference_title: "Risks of specific congenital anomalies in offspring of women with diabetes: A systematic review and meta-analysis of population-based studies including over 80 million births."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        ventricular septal defect (RR = 1.31, 95% CI 1.24 to 1.38, I2 = 0%, P =
        0.960)
      explanation: >-
        A defect-specific relative risk with no heterogeneity across the pooled
        population-based studies, which is what makes this stronger than the
        class-level associations elsewhere in this section.
  evidence:
  - reference: PMID:35104296
    reference_title: "Risks of specific congenital anomalies in offspring of women with diabetes: A systematic review and meta-analysis of population-based studies including over 80 million births."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The RRs of overall CAs and CHDs in offspring of women with PGDM were higher
      than those in offspring of women with GDM.
    explanation: >-
      Establishes the pre-gestational versus gestational gradient, the
      observation that lets exposure timing be compared against the
      organogenetic window.

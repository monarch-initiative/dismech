mechanistic_hypotheses:
- hypothesis_group_id: stochastic_developmental_error
  hypothesis_label: Stochastic morphogenetic error
  status: CANONICAL
  description: >
    Most ventricular septal defects arise as random errors during a complex
    morphogenetic process, at a rate set by that complexity rather than by any
    particular genetic or environmental exposure. The prediction is that
    incidence should be largely invariant across populations and exposures and
    that monozygotic twins should be substantially discordant - both of which are
    observed. This is curated as CANONICAL not because a stochastic account is
    intellectually satisfying but because it is what the epidemiology supports
    for the majority of cases.
  evidence:
  - reference: PMID:3840586
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Incidence rates are similar in different races and seasons and are
      unrelated to maternal age, birth order, sex, and socioeconomic status.
    explanation: >-
      The invariance across populations and exposures that this hypothesis
      predicts.
- hypothesis_group_id: transcriptional_network_lesion
  hypothesis_label: Cardiac transcription factor network lesion
  status: ALTERNATIVE
  description: >
    In a minority of cases, and disproportionately in familial ones, the defect
    results from a specific lesion in the GATA4-NKX2-5-TBX5 septation network.
    This account explains far fewer cases than the stochastic one but explains
    them far better, and is the only branch that currently supports mechanistic
    prediction, family counselling, or modeling. The mouse work makes the
    relationship between the two accounts explicit: even a defined Nkx2-5
    mutation produces a variable phenotype governed by modifier loci, so
    "genetic cause" and "stochastic variability" are not competing at the level
    of the individual patient.
  evidence:
  - reference: PMID:12845333
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These results implicate GATA4 as a genetic cause of human cardiac septal
      defects, perhaps through its interaction with TBX5.
    explanation: >-
      States the network hypothesis in the terms curated here.
  - reference: PMID:22534315
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The factors that modify rather than cause congenital heart disease
      substantially affect risk in predisposed individuals.
    explanation: >-
      Supports modifier-dependent penetrance of a defined causal mutation,
      reconciling the genetic and stochastic accounts. Evidence source is
      MODEL_ORGANISM because this is a mouse complex-trait analysis.
treatments:
- name: Surgical Ventricular Septal Defect Closure
  description: >
    Patch closure of the defect on cardiopulmonary bypass. Indicated for a large
    defect with heart failure or significant pulmonary overcirculation, and
    timed to precede irreversible pulmonary vascular disease. Contraindicated
    once Eisenmenger physiology is established.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Left-to-Right Shunt and Pulmonary Overcirculation
    treatment_effect: INHIBITS
    description: >-
      Closing the communication abolishes the shunt and the pulmonary
      overcirculation that drives vascular remodeling.
  evidence:
  - reference: PMID:12206559
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Surgical closure was required in 41 (14%) cases, and 155 (54%) defects
      closed spontaneously.
    explanation: >-
      Places surgical closure in proportion against spontaneous closure in a
      followed cohort of isolated defects.
  - reference: PMID:39711769
    supports: REFUTE
    evidence_source: OTHER
    snippet: >-
      Closing the defects is contraindicated
    explanation: >-
      Refutes closure specifically in the Eisenmenger subgroup, where the defect
      has become the pressure-relief route for a suprasystemic right ventricle.
      Evidence source is OTHER because this is a review carrying the
      guideline-derived classification.
- name: Transcatheter Device Closure
  description: >
    Catheter-delivered occluder device closure, avoiding sternotomy and bypass
    in anatomically suitable defects.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Left-to-Right Shunt and Pulmonary Overcirculation
    treatment_effect: INHIBITS
    description: >-
      Device occlusion abolishes the interventricular communication and its
      shunt.
  evidence:
  - reference: PMID:31208700
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      During the 7-year follow-up period, 18 cases required surgical or
      transcatheter closure.
    explanation: >-
      Documents transcatheter closure alongside surgery as the intervention used
      in the minority of defects that do not close spontaneously.
- name: Targeted Pulmonary Arterial Hypertension Therapy
  description: >
    Pulmonary vasodilator therapy, used both to treat established pulmonary
    arterial hypertension and, in a "treat and repair" strategy, to lower
    pulmonary vascular resistance far enough to bring a borderline patient back
    within operability criteria.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Obstructive Pulmonary Vascular Remodeling
    treatment_effect: INHIBITS
    description: >-
      Pulmonary vasodilator therapy lowers pulmonary vascular resistance, in
      some patients sufficiently to restore operability.
  evidence:
  - reference: PMID:39711769
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Others may benefit from a "treat and repair" strategy, which involves the
      use of PAH therapy to achieve a drop in PVR, with the aim of achieving
      operability criteria.
    explanation: >-
      Supports the treat-and-repair rationale. Graded PARTIAL because the source
      states it as a strategy some patients may benefit from, not as an
      established indication with demonstrated outcomes. Evidence source is OTHER
      because this is a review.
- name: Periconceptional Folic Acid Supplementation
  description: >
    Preventive rather than therapeutic. Periconceptional folic acid supplement
    use is associated with roughly a 20% reduction in the prevalence of
    congenital heart defects overall.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:19952004
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Use of periconceptional folic acid supplements was related to
      approximately 20% reduction in the prevalence of any CHD.
    explanation: >-
      Supports a protective association for congenital heart defects as a class.
      Graded PARTIAL because this is a registry-based case-control study
      reporting an association across all congenital heart defects, not a
      ventricular-septal-defect-specific causal effect.
discussions:
- discussion_id: vsd_intervention_timing_window
  kind: OPEN_QUESTION
  attaches_to:
  - "pathophysiology#Interventricular Communication"
  - "pathophysiology#Obstructive Pulmonary Vascular Remodeling"
  prompt: >
    How should the intervention window be bounded when the same defect may either
    close itself or become inoperable?
  rationale: >
    The therapeutic window in this disease is bounded on both sides, which is
    unusual. Operating too early risks intervening on a defect that would have
    closed spontaneously - the majority outcome, and 83.5% within one year in
    unselected newborns. Waiting too long allows pulmonary vascular remodeling to
    become irreversible, converting a correctable lesion into one where closure
    is contraindicated. Subtype resolves much of this (muscular defects can be
    watched; large perimembranous defects cannot), but the intermediate case -
    a moderate perimembranous defect with a growing shunt in an infant who is
    feeding adequately - is not resolved by the available data, and early age at
    presentation has been shown specifically not to predict the need for surgery.
  evidence:
  - reference: PMID:12206559
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Early age at presentation, in contrast, is not predictive of the need for
      surgical intervention.
    explanation: >-
      Removes the most intuitive triage variable from consideration, which is
      what makes the intermediate case genuinely open.
- discussion_id: vsd_stochastic_versus_undiscovered_cause
  kind: KNOWLEDGE_GAP
  attaches_to:
  - "pathophysiology#Stochastic Error in Cardiac Morphogenesis"
  prompt: >
    Is the residual, unexplained majority of ventricular septal defects genuinely
    stochastic, or does it reflect causes not yet detectable?
  rationale: >
    The stochastic account rests on negative and indirect evidence: flat
    incidence across exposures, few cases explained by known risk factors, and
    about 10% monozygotic twin concordance. Twin discordance is the strongest
    piece, but it does not distinguish true developmental noise from somatic
    mutation, stochastic gene expression, or micro-environmental differences
    between co-twins - all of which would be causes, just undetectable ones. The
    distinction is not academic: a genuinely stochastic process has an
    irreducible floor, whereas an undetected cause could in principle be
    prevented. No study has applied somatic variant detection to cardiac tissue
    from discordant monozygotic twins.
  proposed_experiments:
  - experiment_id: exp_vsd_discordant_twin_somatic_variants
    name: Somatic variant analysis of cardiac tissue from monozygotic twins discordant for septal defect
    description: >-
      Apply deep somatic variant detection to cardiac tissue or
      cardiac-lineage-derived cells from monozygotic twin pairs discordant for
      ventricular septal defect. Recurrent somatic lesions in septation-pathway
      genes in the affected twin would reclassify part of the "stochastic"
      residue as a detectable cause; their absence would strengthen the
      developmental-noise interpretation.
epidemiology:
- name: Prevalence in unselected newborns and fall after spontaneous closure
  description: >
    Screening echocardiography in unselected newborns finds a ventricular septal
    defect in about 3.3%, falling to 0.5% by age one as most close spontaneously.
  evidence:
  - reference: PMID:38857582
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The prevalence of VSDs in unselected newborns was 3.3%.
    explanation: >-
      Birth prevalence from universal newborn echocardiographic screening.
  - reference: PMID:38857582
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ultimately resulting in a prevalence of VSD in 1-year-old children of 0.5%.
    explanation: >-
      The one-year prevalence after spontaneous closure, which is what makes
      birth-prevalence and childhood-prevalence figures non-comparable.
- name: Share of congenital heart disease in newborn screening
  description: >
    Ventricular septal defects accounted for 62.8% of congenital heart disease
    detected by universal newborn echocardiographic screening.
  evidence:
  - reference: PMID:31208700
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      accounting for 62.8% of congenital heart disease
    explanation: >-
      Quantifies the share of congenital heart disease attributable to
      ventricular septal defect in a screened newborn population.
genetic:
- name: GATA4
  gene_term:
    preferred_term: GATA4
    term:
      id: hgnc:4173
      label: GATA4
  relationship_type: CAUSATIVE
  notes: >
    Heterozygous GATA4 missense (G296S) and frameshift (E359del) mutations
    segregate with isolated cardiac septal defects in large pedigrees, acting
    through reduced transcriptional activity and loss of the GATA4-TBX5
    interaction.
  evidence:
  - reference: PMID:12845333
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In a second family, we identified a frame-shift mutation of GATA4 (E359del)
      that was transcriptionally inactive and segregated with cardiac septal
      defects.
    explanation: >-
      Independent segregating mutation in a second pedigree, which is what raises
      this from association to causation.
- name: NKX2-5
  gene_term:
    preferred_term: NKX2-5
    term:
      id: hgnc:2488
      label: NKX2-5
  relationship_type: CAUSATIVE
  notes: >
    NKX2-5 was the first gene identified by linkage in non-syndromic congenital
    heart defects. Mouse work shows that even a defined Nkx2-5 mutation yields a
    phenotype whose penetrance depends heavily on modifier loci.
  evidence:
  - reference: PMID:12845333
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Only one causative gene, NKX2-5, has been identified through genetic
      linkage analysis of pedigrees with non-syndromic CHDs.
    explanation: >-
      Establishes NKX2-5 as a linkage-identified causative gene for non-syndromic
      congenital heart defects.
- name: TBX5
  gene_term:
    preferred_term: TBX5
    term:
      id: hgnc:11604
      label: TBX5
  relationship_type: CAUSATIVE
  notes: >
    TBX5 is responsible for a subset of syndromic cardiac septal defects, and the
    specific missense mutations that cause them disrupt the same GATA4-TBX5
    interaction that GATA4 mutations abolish from the other side.
  evidence:
  - reference: PMID:12845333
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      interaction of Gata4 and TBX5 was disrupted by specific human TBX5 missense
      mutations that cause similar cardiac septal defects.
    explanation: >-
      Establishes that disease-causing TBX5 mutations converge on the same
      protein-protein interaction. Evidence source is IN_VITRO because the
      interaction was assayed biochemically.
environmental:
- name: Periconceptional folic acid supplementation
  description: >
    Maternal periconceptional folic acid supplement use is associated with an
    approximately 20% lower prevalence of congenital heart defects.
  evidence:
  - reference: PMID:19952004
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our results support the hypothesis that additional periconceptional folic
      acid use reduces CHD risk in infants.
    explanation: >-
      Supports a protective association. Graded PARTIAL because the finding is
      for congenital heart defects as a class in a registry-based case-control
      design, not ventricular septal defect specifically.

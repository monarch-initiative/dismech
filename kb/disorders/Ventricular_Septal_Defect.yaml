mechanistic_hypotheses:
- hypothesis_group_id: stochastic_developmental_error
  hypothesis_label: Stochastic morphogenetic error
  status: ALTERNATIVE
  description: >
    Most ventricular septal defects arise as random errors during a complex
    morphogenetic process, at a rate set by that complexity rather than by any
    particular genetic or environmental exposure. The prediction is that
    incidence should be largely invariant across populations and exposures and
    that monozygotic twins should be substantially discordant - both of which are
    observed. This remains an epidemiologically supported hypothesis rather than
    a demonstrated mechanism: somatic mutation, stochastic gene expression, or
    unmeasured micro-environmental differences could produce the same pattern.
  evidence:
  - reference: PMID:3840586
    reference_title: "Etiology of ventricular septal defects: an epidemiologic approach."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Incidence rates are similar in different races and seasons and are
      unrelated to maternal age, birth order, sex, and socioeconomic status.
    explanation: >-
      The invariance across populations and exposures that this hypothesis
      predicts.
- hypothesis_group_id: transcriptional_network_lesion
  hypothesis_label: Cardiac transcription factor network lesion
  status: ALTERNATIVE
  description: >
    In a minority of cases, and disproportionately in familial ones, the defect
    results from a specific lesion in the GATA4-NKX2-5-TBX5 septation network.
    This account explains far fewer cases than the stochastic one but explains
    them far better, and is the only branch that currently supports mechanistic
    prediction, family counselling, or modeling. The mouse work makes the
    relationship between the two accounts explicit: even a defined Nkx2-5
    mutation produces a variable phenotype governed by modifier loci, so
    "genetic cause" and "stochastic variability" are not competing at the level
    of the individual patient.
  evidence:
  - reference: PMID:12845333
    reference_title: "GATA4 mutations cause human congenital heart defects and reveal an interaction with TBX5."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These results implicate GATA4 as a genetic cause of human cardiac septal
      defects, perhaps through its interaction with TBX5.
    explanation: >-
      States the network hypothesis in the terms curated here.
  - reference: PMID:22534315
    reference_title: "Complex trait analysis of ventricular septal defects caused by Nkx2-5 mutation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The factors that modify rather than cause congenital heart disease
      substantially affect risk in predisposed individuals.
    explanation: >-
      Supports modifier-dependent penetrance of a defined causal mutation,
      reconciling the genetic and stochastic accounts. Evidence source is
      MODEL_ORGANISM because this is a mouse complex-trait analysis.
treatments:
- name: Surgical Ventricular Septal Defect Closure
  description: >
    Patch closure of the defect on cardiopulmonary bypass. Indicated for a large
    defect with heart failure or significant pulmonary overcirculation, and
    timed to precede irreversible pulmonary vascular disease. Contraindicated
    once Eisenmenger physiology is established.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Left-to-Right Shunt and Pulmonary Overcirculation
    treatment_effect: INHIBITS
    description: >-
      Closing the communication abolishes the shunt and the pulmonary
      overcirculation that drives vascular remodeling.
  evidence:
  - reference: PMID:25523232
    reference_title: "Ventricular septal defect."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Surgical closure of large and non-restrictive defects ... in the setting of
      failure to thrive and symptoms of excessive pulmonary blood flow. ... the
      recommendation is usually to close these defects before the infant reaches
      one year of age.
    explanation: >-
      Supports closure of symptomatic large defects before pulmonary vascular
      disease develops. Evidence source is OTHER because this is a review.
  - reference: PMID:12206559
    reference_title: "Closure of ventricular septal defects: a study of factors influencing spontaneous and surgical closure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Surgical closure was required in 41 (14%) cases, and 155 (54%) defects
      closed spontaneously.
    explanation: >-
      Places surgical closure in proportion against spontaneous closure in a
      followed cohort of isolated defects.
  - reference: PMID:39711769
    reference_title: "Pulmonary arterial hypertension with left to right shunts: When to treat and/or close?"
    supports: REFUTE
    evidence_source: OTHER
    snippet: >-
      Closing the defects is contraindicated
    explanation: >-
      Refutes closure specifically in the Eisenmenger subgroup, where the defect
      has become the pressure-relief route for a suprasystemic right ventricle.
      Evidence source is OTHER because this is a review carrying the
      guideline-derived classification.
- name: Transcatheter Device Closure
  description: >
    Catheter-delivered occluder device closure, avoiding sternotomy and bypass
    in anatomically suitable defects.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: transcatheter device closure
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  target_mechanisms:
  - target: Left-to-Right Shunt and Pulmonary Overcirculation
    treatment_effect: INHIBITS
    description: >-
      Device occlusion abolishes the interventricular communication and its
      shunt.
  evidence:
  - reference: PMID:25523232
    reference_title: "Ventricular septal defect."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      both muscular and perimembranous defects can be closed percutaneously by
      insertion of devices using cardiac catheterisation
    explanation: >-
      Directly supports percutaneous device closure for anatomically suitable
      muscular and perimembranous defects. Evidence source is OTHER because this
      is a review.
  - reference: PMID:31208700
    reference_title: "Spontaneous Closure Rates of Ventricular Septal Defects (6,750 Consecutive Neonates)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      During the 7-year follow-up period, 18 cases required surgical or
      transcatheter closure.
    explanation: >-
      Documents transcatheter closure alongside surgery as the intervention used
      in the minority of defects that do not close spontaneously.
- name: Targeted Pulmonary Arterial Hypertension Therapy
  description: >
    Pulmonary vasodilator therapy, used both to treat established pulmonary
    arterial hypertension and, in a "treat and repair" strategy, to lower
    pulmonary vascular resistance far enough to bring a borderline patient back
    within operability criteria.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:

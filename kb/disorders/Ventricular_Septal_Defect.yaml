- name: Shunt Reversal and Eisenmenger Syndrome
  biological_scale: ORGANISM
  description: >
    When pulmonary vascular resistance rises to severe levels behind a large
    unrepaired post-tricuspid shunt, the direction of flow becomes bidirectional
    and then right to left. Deoxygenated blood enters the systemic circulation,
    producing cyanosis, secondary erythrocytosis, and multiorgan involvement.
    The clinically decisive point is that the defect has changed role: it is now
    the escape route for a suprasystemic right ventricle, and closing it is
    contraindicated rather than merely futile.
  locations:
  - preferred_term: interventricular septum
    term:
      id: UBERON:0002094
      label: interventricular septum
  evidence:
  - reference: PMID:39711769
    reference_title: "Pulmonary arterial hypertension with left to right shunts: When to treat and/or close?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Eisenmenger syndrome, appearing when a large post-tricuspid shunt is left
      uncorrected and pulmonary vascular disease (PVD) is severe, so the shunt
      becomes bidirectional or right-to-left, causing cyanosis
    explanation: >-
      Defines the syndrome and the shunt reversal that constitutes it. Evidence
      source is OTHER because this is a review.
  - reference: PMID:39711769
    reference_title: "Pulmonary arterial hypertension with left to right shunts: When to treat and/or close?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Closing the defects is contraindicated
    explanation: >-
      The reversal of therapeutic logic this node turns on, stated in the
      guideline-derived classification of Eisenmenger syndrome. Evidence source
      is OTHER because this is a review.
  - reference: PMID:39711769
    reference_title: "Pulmonary arterial hypertension with left to right shunts: When to treat and/or close?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      experts believe that the right ventricle of many Eisenmenger patients is
      optimally adapted to the increased afterload and is "unloaded" by R-L
      shunting though the unrepaired defect, supporting cardiac output at the
      expense of cyanosis.
    explanation: >-
      Supports the role of the reversed shunt as a right-ventricular pressure
      relief route. Evidence source is OTHER because this is a review.
  downstream:
  - target: Cyanosis
    causal_link_type: DIRECT
    description: >-
      Right-to-left flow delivers deoxygenated blood into the systemic
      circulation.
    evidence:
    - reference: PMID:39711769
      reference_title: "Pulmonary arterial hypertension with left to right shunts: When to treat and/or close?"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Eisenmenger syndrome, appearing when a large post-tricuspid shunt is left
        uncorrected and pulmonary vascular disease (PVD) is severe, so the shunt
        becomes bidirectional or right-to-left, causing cyanosis
      explanation: >-
        Directly supports cyanosis downstream of bidirectional or right-to-left
        shunting. Evidence source is OTHER because this is a review.
  - target: Polycythemia
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Chronic hypoxaemia drives a compensatory secondary erythrocytosis.
    evidence:
    - reference: PMID:39711769
      reference_title: "Pulmonary arterial hypertension with left to right shunts: When to treat and/or close?"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Chronic cyanosis is associated with haematological changes, such as
        secondary erythrocytosis, thrombocytopenia, predisposition to bleeding
        and thrombosis
      explanation: >-
        Supports secondary erythrocytosis downstream of chronic cyanosis.
        Evidence source is OTHER because this is a review.

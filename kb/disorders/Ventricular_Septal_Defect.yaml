discussions:
- discussion_id: vsd_intervention_timing_window
  kind: OPEN_QUESTION
  attaches_to:
  - "pathophysiology#Interventricular Communication"
  - "pathophysiology#Obstructive Pulmonary Vascular Remodeling"
  prompt: >
    How should the intervention window be bounded when the same defect may either
    close itself or become inoperable?
  rationale: >
    The therapeutic window in this disease is bounded on both sides, which is
    unusual. Operating too early risks intervening on a defect that would have
    closed spontaneously - the majority outcome, and 83.5% within one year in
    unselected newborns. Waiting too long allows pulmonary vascular remodeling to
    become irreversible, converting a correctable lesion into one where closure
    is contraindicated. Subtype resolves much of this (muscular defects can be
    watched; large perimembranous defects cannot), but the intermediate case -
    a moderate perimembranous defect with a growing shunt in an infant who is
    feeding adequately - is not resolved by the available data, and early age at
    presentation has been shown specifically not to predict the need for surgery.
  evidence:
  - reference: PMID:12206559
    reference_title: "Closure of ventricular septal defects: a study of factors influencing spontaneous and surgical closure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Early age at presentation, in contrast, is not predictive of the need for
      surgical intervention.
    explanation: >-
      Removes the most intuitive triage variable from consideration, which is
      what makes the intermediate case genuinely open.
- discussion_id: vsd_stochastic_versus_undiscovered_cause
  kind: KNOWLEDGE_GAP
  attaches_to:
  - "pathophysiology#Stochastic Error in Cardiac Morphogenesis"
  prompt: >
    Is the residual, unexplained majority of ventricular septal defects genuinely
    stochastic, or does it reflect causes not yet detectable?
  rationale: >
    The stochastic account rests on negative and indirect evidence: flat
    incidence across exposures, few cases explained by known risk factors, and
    about 10% monozygotic twin concordance. Twin discordance is the strongest
    piece, but it does not distinguish true developmental noise from somatic
    mutation, stochastic gene expression, or micro-environmental differences
    between co-twins - all of which would be causes, just undetectable ones. The
    distinction is not academic: a genuinely stochastic process has an
    irreducible floor, whereas an undetected cause could in principle be
    prevented. No study has applied somatic variant detection to cardiac tissue
    from discordant monozygotic twins.
  proposed_experiments:
  - experiment_id: exp_vsd_discordant_twin_somatic_variants
    name: Somatic variant analysis of cardiac tissue from monozygotic twins discordant for septal defect
    description: >-
      Apply deep somatic variant detection to cardiac tissue or
      cardiac-lineage-derived cells from monozygotic twin pairs discordant for
      ventricular septal defect. Recurrent somatic lesions in septation-pathway
      genes in the affected twin would reclassify part of the "stochastic"
      residue as a detectable cause; their absence would strengthen the
      developmental-noise interpretation.
inheritance:
- name: Sporadic occurrence
  inheritance_term:
    preferred_term: Sporadic
    term:
      id: HP:0003745
      label: Sporadic
  description: >
    The great majority of ventricular septal defects occur sporadically, with no
    family history and no identified exposure. Recurrence risk counselling rests
    on this, and on the observation that even monozygotic co-twins are usually
    discordant.
  evidence:
  - reference: PMID:3840586
    reference_title: "Etiology of ventricular septal defects: an epidemiologic approach."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Despite identical genes and similar prenatal environments, the concordance
      rate in identical twins is only about 10%.
    explanation: >-
      Supports predominantly sporadic occurrence: shared genotype does not confer
      shared phenotype.
- name: Non-Mendelian familial aggregation
  inheritance_term:
    preferred_term: Non-Mendelian inheritance
    term:
      id: HP:0001426
      label: Non-Mendelian inheritance
  description: >
    A minority of cases aggregate in families. Where a single-gene lesion in the
    GATA4-NKX2-5-TBX5 septation network is present, transmission can look
    autosomal dominant, but penetrance is modifier-dependent and the general
    pattern across families is non-Mendelian. Family history of congenital heart
    disease is a recognized risk factor that nonetheless explains few cases.
  evidence:
  - reference: PMID:3840586
    reference_title: "Etiology of ventricular septal defects: an epidemiologic approach."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The several known risk factors for VSD, including a family history of
      congenital heart disease and exposure to certain drugs, infectious agents,
      and maternal metabolic disturbances, explain few cases.
    explanation: >-
      Recognizes family history as a risk factor while establishing that it,
      like the other known factors, accounts for a minority of cases.
  - reference: PMID:22534315
    reference_title: "Complex trait analysis of ventricular septal defects caused by Nkx2-5 mutation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The factors that modify rather than cause congenital heart disease
      substantially affect risk in predisposed individuals.
    explanation: >-
      Supports modifier-dependent penetrance, the reason familial transmission
      does not follow a clean Mendelian pattern. Evidence source is
      MODEL_ORGANISM because this is a mouse complex-trait analysis.
diagnosis:
- name: Transthoracic Echocardiography
  description: >
    Echocardiography is the diagnostic modality for ventricular septal defect and
    is what defines its modern population epidemiology: the principal birth and
    one-year prevalence estimates cited in this entry come from a cohort in which
    unselected newborns underwent echocardiography rather than being referred on
    clinical suspicion. This matters because clinical ascertainment misses many
    small muscular defects that subsequently close.
  diagnosis_term:
    preferred_term: echocardiography
    term:
      id: NCIT:C16525
      label: Echocardiography Test
  evidence:
  - reference: PMID:31208700
    reference_title: "Spontaneous Closure Rates of Ventricular Septal Defects (6,750 Consecutive Neonates)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We conducted a prospective study at 3 hospitals, all newborns underwent
      echocardiography.
    explanation: >-
      Establishes universal newborn echocardiography as the ascertainment method
      behind the occurrence figures curated here.
- name: Fetal Echocardiography
  description: >
    Prenatal detection by fetal echocardiography, the setting in which in-utero
    spontaneous closure is observed. Because a third of fetally diagnosed
    muscular defects close before birth, a prenatal diagnosis cannot be counted
    as a postnatal case.
  diagnosis_term:
    preferred_term: echocardiography
    term:
      id: NCIT:C16525
      label: Echocardiography Test
  evidence:
  - reference: PMID:31928261
    reference_title: "Isolated ventricular septal defects demonstrated by fetal echocardiography: prenatal course and postnatal outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Spontaneous closure of the VSDs occurred prenatally in 31/64 and 3/11 of
      fetuses with muscular VSD and perimembranous VSD, respectively.
    explanation: >-
      Documents prenatal detection and in-utero closure in a fetally ascertained
      cohort.
- name: Cardiac Catheterization
  description: >
    The measurement that decides operability. Echocardiography establishes the
    defect; catheterization quantifies pulmonary vascular resistance and the
    pulmonary-to-systemic flow ratio, and permits the pulmonary circulation to be
    challenged pharmacologically or the defect temporarily occluded before a
    decision is made. This entry's whole Eisenmenger and treat-and-repair
    reasoning depends on those numbers, so the diagnostic modality that produces
    them belongs here rather than being implied.
  diagnosis_term:
    preferred_term: cardiac catheterization
    term:
      id: NCIT:C38044
      label: Cardiac Catheterization
  evidence:
  - reference: PMID:39711769
    reference_title: "Pulmonary arterial hypertension with left to right shunts: When to treat and/or close?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Cardiac catheterization is at the center of the evaluation and follow-up of
      these patients, collecting "baseline" data and providing the opportunity to
      challenge the pulmonary circulation, manipulate the loading status, or
      temporarily occlude the defect.
    explanation: >-
      States the central role of catheterization in the evaluation on which
      operability is judged. Evidence source is OTHER because this is a review.

  - reference: PMID:39711769
    reference_title: "Pulmonary arterial hypertension with left to right shunts: When to treat and/or close?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      There is now evidence to support a sustained, long-term beneficial effect
      of bosentan in Eisenmenger patients
    explanation: >-
      Names the endothelin receptor antagonist curated as a therapeutic agent and
      supports a sustained effect in the Eisenmenger subgroup - the same patients
      in whom defect closure is contraindicated, which is what makes medical
      therapy the only option there.
  - reference: PMID:39711769
    reference_title: "Pulmonary arterial hypertension with left to right shunts: When to treat and/or close?"
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      the phosphodiesterase type 5 inhibitors (PDE-5i), sildenafil and tadalafil,
      have also shown favourable functional and haemodynamic effects in
      Eisenmenger patients.
    explanation: >-
      Names the phosphodiesterase-5 inhibitor curated as a therapeutic agent.
      Graded PARTIAL because the source itself describes these as "less robust
      studies" than the bosentan evidence.

name: Ventricular Septal Defect
creation_date: "2026-08-10T13:40:00Z"
category: Congenital
disease_term:
  preferred_term: ventricular septal defect
  term:
    id: MONDO:0002070
    label: ventricular septal defect
description: >
  A communication between the ventricles, the commonest congenital cardiac
  malformation and the one most often described as simple. It is not simple, but
  it is unusual: it is one of the few structural heart lesions whose most likely
  outcome is that it disappears. In unselected newborns screened by
  echocardiography, roughly 3.3% have a ventricular septal defect and about
  nine in ten of those close spontaneously within the first year.
  What determines the course is not the hole but the pressure gradient across
  it, and that gradient is not fixed. Early on, systemic vascular resistance far
  exceeds pulmonary, so blood shunts left to right, flooding the lungs and
  volume-loading the left heart. Sustained overcirculation remodels the
  pulmonary arterioles; pulmonary vascular resistance climbs; the gradient
  narrows, then equalises, then inverts. Once it has inverted, the same hole
  that caused the problem has become the pressure-relief valve for a
  suprasystemic right ventricle, and closing it is contraindicated. The
  therapeutic window is therefore bounded on both sides - too early risks
  operating on a defect that would have closed itself, too late converts a
  correctable lesion into an inoperable one - and the entry is organised so that
  this reversal, rather than the anatomy, is the spine of the disease.
synonyms:
- VSD
- interventricular septal defect
notes: >
  Two mutually exclusive downstream branches hang off the same anatomic node, and
  both are curated: spontaneous closure and progressive pulmonary vascular
  disease. Modeling only the second would misrepresent the disease, since
  closure is the majority outcome. Anatomic subtype is what separates them -
  muscular defects close spontaneously in 87-97% of series, perimembranous in
  roughly 47-51% - so subtype is carried explicitly on the interventricular
  communication node rather than left in prose.

  `conforms_to` is declared for the pulmonary vascular arm only
  (`pulmonary_vascular_remodeling#Obstructive Pulmonary Vascular Remodeling`),
  and deliberately not for the shunt or Eisenmenger nodes. The module's
  conserved central effector is the remodeled small pulmonary artery, which this
  disorder genuinely instantiates with an overcirculation trigger substituted for
  BMPR2 loss or acquired endothelial injury. Shunt reversal is a haemodynamic
  consequence downstream of that remodeling, not another instance of it.

  The stochastic-error trigger node is not a placeholder for ignorance. The
  monozygotic twin concordance for ventricular septal defect is about 10%, which
  constrains any purely genetic or purely environmental account far more sharply
  than the absence of an identified cause would on its own. It is curated as a
  node with its own evidence because it makes a testable claim.

  The NKX2-5, GATA4, and TBX5 association study (PMID:30834692) reports
  polymorphism frequencies in a small Egyptian case-control series and is graded
  PARTIAL wherever cited; it is not treated as establishing causation, unlike the
  GATA4 linkage pedigrees.

  Several passages in the PMID:39711769 cache carry whitespace artifacts from
  text extraction ("multiple organinvolvement", "present.Closing"). Snippets
  quote around these rather than reproducing the corruption, which is why some
  quotations from that source are shorter than the sentence they come from.
pathophysiology:
- name: Cardiac Septation Transcriptional Program Disruption
  biological_scale: MOLECULAR
  role: trigger
  description: >
    Ventricular septation depends on a small network of interacting cardiac
    transcription factors. GATA4 missense and frameshift mutations segregate with
    isolated septal defects in large pedigrees; the disease-causing G296S
    substitution reduces DNA binding and transcriptional activity and abolishes
    the physical interaction between GATA4 and TBX5. The reciprocal experiment
    closes the loop: TBX5 missense mutations that cause similar septal defects
    disrupt the same interaction from the other side. NKX2-5 is the other
    established locus. What the network explains is a minority of defects, but it
    explains them mechanistically rather than statistically.
  locations:
  - preferred_term: interventricular septum
    term:
      id: UBERON:0002094
      label: interventricular septum
  biological_processes:
  - preferred_term: ventricular septum development
    term:
      id: GO:0003281
      label: ventricular septum development
    modifier: ABNORMAL
  genes:
  - preferred_term: GATA4
    term:
      id: hgnc:4173
      label: GATA4
  - preferred_term: NKX2-5
    term:
      id: hgnc:2488
      label: NKX2-5
  - preferred_term: TBX5
    term:
      id: hgnc:11604
      label: TBX5
  evidence:
  - reference: PMID:12845333
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A heterozygous G296S missense mutation of GATA4, a transcription factor
      essential for heart formation, was found in all available affected family
      members but not in any control individuals.
    explanation: >-
      Establishes GATA4 as segregating with isolated cardiac septal defects in a
      linkage pedigree, the causal genetic claim of this node.
  - reference: PMID:12845333
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      the Gata4 mutation abrogated a physical interaction between Gata4 and TBX5,
      a T-box protein responsible for a subset of syndromic cardiac septal
      defects. Conversely, interaction of Gata4 and TBX5 was disrupted by
      specific human TBX5 missense mutations that cause similar cardiac septal
      defects.
    explanation: >-
      The reciprocal disruption of the GATA4-TBX5 interaction from both sides is
      what makes this a network mechanism rather than two separate gene
      associations. Evidence source is IN_VITRO because the interaction was
      assayed biochemically.
  - reference: PMID:30834692
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Significantly higher frequency of different allelle of five variants was
      observed in cases when compared to the control group, with significant
      risky effect for the development of septal defect.
    explanation: >-
      Adds common-variant association evidence across NKX2-5, GATA4, and TBX5.
      Graded PARTIAL because this is a small case-control series reporting
      genotype frequencies, not a causal assignment.
  downstream:
  - target: Interventricular Communication
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Failure of the septation program leaves the interventricular septum
      incompletely formed.
    hypothesis_groups:
    - transcriptional_network_lesion
- name: Stochastic Error in Cardiac Morphogenesis
  biological_scale: TISSUE
  role: trigger
  description: >
    Most ventricular septal defects have no identifiable genetic or environmental
    cause, and the epidemiology suggests this is a fact about the disease rather
    than a gap in ascertainment. Incidence is essentially flat across races,
    seasons, maternal age, birth order, sex, and socioeconomic status; known risk
    factors explain few cases; and monozygotic twins, who share genome and
    prenatal environment, are concordant only about 10% of the time. The
    inference is that many defects arise as random errors during a
    morphogenetic process whose complexity sets the error rate - a claim with
    the practical corollary that many are not preventable.
  locations:
  - preferred_term: interventricular septum
    term:
      id: UBERON:0002094
      label: interventricular septum
  biological_processes:
  - preferred_term: ventricular septum development
    term:
      id: GO:0003281
      label: ventricular septum development
    modifier: ABNORMAL
  evidence:
  - reference: PMID:3840586
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Despite identical genes and similar prenatal environments, the concordance
      rate in identical twins is only about 10%.
    explanation: >-
      The single most constraining observation for any deterministic account of
      causation, genetic or environmental.
  - reference: PMID:3840586
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The consistency of incidence among individuals with widely differing genes
      and environments and the frequency of discordance in identical twins
      suggest that VSDs often occur as random errors in development, at a
      frequency largely determined by the complexity of normal cardiac
      morphogenesis.
    explanation: >-
      States the stochastic-error hypothesis this node encodes, with its
      supporting epidemiological reasoning.
  - reference: PMID:3840586
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The several known risk factors for VSD, including a family history of
      congenital heart disease and exposure to certain drugs, infectious agents,
      and maternal metabolic disturbances, explain few cases.
    explanation: >-
      Supports the claim that identified causes account for a minority of
      defects.
  downstream:
  - target: Interventricular Communication
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      A stochastic failure of septal closure during morphogenesis leaves a
      communication; the intermediates are by hypothesis not systematic.
    hypothesis_groups:
    - stochastic_developmental_error
- name: Interventricular Communication
  biological_scale: TISSUE
  description: >
    The anatomic lesion: a communication between the ventricular chambers. Its
    location is the single strongest determinant of what happens next. Muscular
    defects, entirely bordered by septal muscle, close spontaneously in the large
    majority of cases as the muscular septum grows and remodels around them.
    Perimembranous defects, which abut the fibrous membranous septum, close far
    less often. Size matters within subtype - perimembranous defects of 4 mm or
    more are those that do not close - but subtype dominates.
  locations:
  - preferred_term: interventricular septum
    term:
      id: UBERON:0002094
      label: interventricular septum
  evidence:
  - reference: PMID:38857582
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Muscular VSDs showed significantly higher rate of spontaneous closure
      compared with perimembranous VSDs
    explanation: >-
      Establishes anatomic subtype as the determinant of outcome, the central
      claim of this node.
  - reference: PMID:31208700
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      perimembranous site and defects ≥4 mm are risk factors for VSD that do not
      spontaneously close. Independent predictive factors for perimembranous VSD
      which do not spontaneously close is defects ≥4 mm.
    explanation: >-
      Establishes subtype and size as the determinants of persistence, in that
      order.
  - reference: PMID:12206559
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The size and morphology of a ventricular septal defect are important
      determinants of spontaneous closure and to the need for surgical
      intervention. Early age at presentation, in contrast, is not predictive of
      the need for surgical intervention.
    explanation: >-
      Supports morphology and size as determinants, and specifically excludes
      early presentation as a predictor - a negative finding that matters for
      management.
  downstream:
  - target: Spontaneous Defect Closure
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Muscular defects in particular are progressively occluded by growth and
      remodeling of the surrounding septal muscle. This is the majority outcome,
      not an exception.
  - target: Left-to-Right Shunt and Pulmonary Overcirculation
    causal_link_type: DIRECT
    description: >-
      A persistent communication permits flow from the higher-pressure left
      ventricle to the right.
- name: Spontaneous Defect Closure
  biological_scale: TISSUE
  description: >
    The commonest outcome, and the reason this disease is managed by observation
    far more often than by intervention. In an unselected newborn cohort 83.5% of
    all defects had closed by one year, dropping prevalence from 3.3% at birth to
    0.5% at age one. The subtype split is stark: muscular defects closed in 86.9%
    versus 46.9% of perimembranous. Closure begins before birth - a third of
    fetally diagnosed muscular defects close in utero.
  locations:
  - preferred_term: interventricular septum
    term:
      id: UBERON:0002094
      label: interventricular septum
  evidence:
  - reference: PMID:38857582
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      After 1 year, 83.5% (607 of 727) of all VSDs had closed spontaneously,
      resulting in a decrease of prevalence from 3.3% at birth to 0.5% in 1-year
      old children.
    explanation: >-
      Quantifies spontaneous closure and the resulting fall in prevalence in an
      unselected screened population.
  - reference: PMID:31208700
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The SC rate in those with perimembranous VSD and muscular VSD (mVSD) were
      51.4% (18 of 35) and 97.2% (70 of 72), respectively.
    explanation: >-
      Quantifies the subtype-dependent closure rates over seven years of
      follow-up.
  - reference: PMID:31928261
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Spontaneous closure of the VSDs occurred prenatally in 31/64 and 3/11 of
      fetuses with muscular VSD and perimembranous VSD, respectively.
    explanation: >-
      Documents that closure begins in utero, which is why fetally detected
      defects cannot be counted as future disease.
- name: Left-to-Right Shunt and Pulmonary Overcirculation
  biological_scale: ORGANISM
  description: >
    Because systemic vascular resistance normally far exceeds pulmonary, blood
    crosses the defect from left to right, recirculating through the lungs. The
    magnitude of the shunt is set by the ratio of the two resistances together
    with defect size, not by defect size alone - which is why the shunt is small
    in the first days of life while pulmonary resistance is still high, and grows
    over the following weeks as it falls. The consequence is excess pulmonary
    blood flow and pressure, and a volume load returning to the left atrium and
    ventricle.
  locations:
  - preferred_term: pulmonary artery
    term:
      id: UBERON:0002012
      label: pulmonary artery
  evidence:
  - reference: PMID:39711769
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      uncorrected left-to-right (L-R) intracardiac shunt leading to overload of
      the pulmonary circulation and a progressive increase of PVR
    explanation: >-
      States the shunt-to-overcirculation-to-rising-resistance sequence this node
      begins. Evidence source is OTHER because this is a review.
  downstream:
  - target: Left Ventricular Volume Overload and Heart Failure
    causal_link_type: DIRECT
    description: >-
      Recirculated pulmonary blood returns to the left heart as a volume load.
  - target: Obstructive Pulmonary Vascular Remodeling
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Chronic exposure of the pulmonary vascular bed to increased flow and
      pressure drives remodeling of the small pulmonary arteries.
- name: Left Ventricular Volume Overload and Heart Failure
  biological_scale: ORGANISM
  description: >
    The left ventricle handles the recirculating volume by dilating, and in a
    large defect this presents in infancy as congestive heart failure -
    tachypnoea, sweating with feeds, poor weight gain - typically after the first
    few weeks, once falling pulmonary resistance has allowed the shunt to grow.
    Failure to thrive in this setting is a haemodynamic sign rather than a
    nutritional one.
  locations:
  - preferred_term: heart left ventricle
    term:
      id: UBERON:0002084
      label: heart left ventricle
- name: Obstructive Pulmonary Vascular Remodeling
  biological_scale: TISSUE
  conforms_to: "pulmonary_vascular_remodeling#Obstructive Pulmonary Vascular Remodeling"
  description: >
    Longstanding exposure to increased pulmonary flow and pressure remodels the
    small pulmonary arteries - medial hypertrophy, muscularization of previously
    nonmuscular peripheral vessels, intimal and eventually plexiform lesions -
    obliterating the lumen and raising pulmonary vascular resistance. This node
    conforms to the conserved central effector of the
    `pulmonary_vascular_remodeling` module, substituting shunt overcirculation
    for the BMPR2 lesion or acquired endothelial injury that trigger it in other
    forms of pulmonary arterial hypertension. It is the point of no return: the
    remodeling is what makes the disease irreversible, and once it is severe the
    haemodynamics that follow cannot be undone by closing the defect.
  locations:
  - preferred_term: pulmonary artery
    term:
      id: UBERON:0002012
      label: pulmonary artery
  cell_types:
  - preferred_term: pulmonary artery smooth muscle cell
    term:
      id: CL:0000192
      label: smooth muscle cell
  - preferred_term: pulmonary artery endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  biological_processes:
  - preferred_term: blood vessel remodeling
    term:
      id: GO:0001974
      label: blood vessel remodeling
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:39711769
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      the longstanding exposure of the pulmonary vascular bed to increased flow
      and pressure can result in vascular remodelling and progressive increase in
      pulmonary vascular resistance (PVR)
    explanation: >-
      Directly links shunt overcirculation to pulmonary vascular remodeling and
      rising resistance, the mechanism this conforming node instantiates.
      Evidence source is OTHER because this is a review.
  downstream:
  - target: Shunt Reversal and Eisenmenger Syndrome
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Rising pulmonary vascular resistance progressively narrows, then reverses,
      the interventricular pressure gradient.
- name: Shunt Reversal and Eisenmenger Syndrome
  biological_scale: ORGANISM
  description: >
    When pulmonary vascular resistance rises to severe levels behind a large
    unrepaired post-tricuspid shunt, the direction of flow becomes bidirectional
    and then right to left. Deoxygenated blood enters the systemic circulation,
    producing cyanosis, secondary erythrocytosis, and multiorgan involvement.
    The clinically decisive point is that the defect has changed role: it is now
    the escape route for a suprasystemic right ventricle, and closing it is
    contraindicated rather than merely futile.
  locations:
  - preferred_term: interventricular septum
    term:
      id: UBERON:0002094
      label: interventricular septum
  evidence:
  - reference: PMID:39711769
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Eisenmenger syndrome, appearing when a large post-tricuspid shunt is left
      uncorrected and pulmonary vascular disease (PVD) is severe, so the shunt
      becomes bidirectional or right-to-left, causing cyanosis
    explanation: >-
      Defines the syndrome and the shunt reversal that constitutes it. Evidence
      source is OTHER because this is a review.
  - reference: PMID:39711769
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Closing the defects is contraindicated
    explanation: >-
      The reversal of therapeutic logic this node turns on, stated in the
      guideline-derived classification of Eisenmenger syndrome. Evidence source
      is OTHER because this is a review.

discussions:
- discussion_id: adh2_renal_casr_coupling
  kind: KNOWLEDGE_GAP
  attaches_to:
  - biochemical#Urinary calcium
  - pathophysiology#Increased CaSR-Galpha11 Sensitivity to Extracellular Calcium
  prompt: >-
    Does gain-of-function Galpha11 act in the renal tubule as activating CASR
    does in ADH1, or does the renal CaSR signal through other G proteins?
  rationale: >-
    ADH1 patients have pronounced hypercalciuria and hypomagnesemia from renal
    CaSR activation, but ADH2 families show urinary calcium in the reference
    range and normal magnesium (PMID:24823460, PMID:27334330). This changes
    treatment risk: if the renal tubule is spared, calcium and vitamin D may
    carry less risk of nephrocalcinosis in ADH2 than in ADH1. The review
    raising the question offers no data on renal G-protein coupling
    (PMID:27803672).
  proposed_experiments:
  - experiment_id: adh2_urinary_calcium_matched_comparison
    name: Urinary calcium at matched serum calcium in ADH1 and ADH2
    description: >-
      Compare fractional calcium excretion and serum magnesium in ADH1 and
      ADH2 patients at matched serum calcium and PTH, and measure CaSR
      signaling in kidney tubule cells carrying ADH2 Galpha11 variants.
    would_support:
    - pathophysiology#Increased CaSR-Galpha11 Sensitivity to Extracellular Calcium
    supporting_outcome:
    - ADH2 patients excrete calcium at rates similar to ADH1 at matched serum calcium.
    refuting_outcome:
    - ADH2 patients excrete markedly less calcium than ADH1 at matched serum calcium.

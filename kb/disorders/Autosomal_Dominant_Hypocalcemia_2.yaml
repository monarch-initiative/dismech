differential_diagnoses:
- name: Autosomal dominant hypocalcemia 1
  disease_term:
    preferred_term: autosomal dominant hypocalcemia 1
    term:
      id: MONDO:0011013
      label: autosomal dominant hypocalcemia 1
  description: The CASR gain-of-function form, with the same hypocalcemia and low PTH.
  distinguishing_features:
  - An activating CASR variant rather than a GNA11 variant.
  - Hypercalciuria and hypomagnesemia are more pronounced in ADH1.
  evidence:
  - reference: PMID:24823460
    reference_title: "Autosomal dominant hypoparathyroidism caused by germline mutation in GNA11: phenotypic and molecular characterization."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Compared to subjects with CASR mutations, patients with GNA11 mutations lacked hypercalciuria and had normal serum magnesium levels."
    explanation: Urinary calcium and magnesium separate the two in one family.
  - reference: PMID:27803672
    reference_title: "Autosomal Dominant Hypocalcemia (Hypoparathyroidism) Types 1 and 2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Additionally, elevations in urinary calcium of individuals with ADH2 appear to be less pronounced than in those with activating CASR mutations in ADH1, raising the question whether the CASR in the renal tubules couples to G proteins other than G11."
    explanation: Review comparison of urinary calcium.
animal_models:
- name: Dsk7 mouse (Gna11 Ile62Val)
  species: Mouse
  genotype: Gna11 Ile62Val (Dsk7), heterozygous and homozygous
  publication: PMID:28194447
  description: >-
    A dark-skin ENU mutant carrying a hypermorphic Gna11 allele. Heterozygotes
    and homozygotes have hypocalcemia and reduced plasma PTH. A single dose of
    the calcilytic NPS-2143 raises PTH and calcium to normal.
  modeled_mechanisms:
  - target: Suppressed Parathyroid Hormone Secretion
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Low PTH and hypocalcemia, corrected by a calcilytic.
    limitations: >-
      Ile62Val is not a reported human allele, and the dark skin phenotype has
      no established counterpart in patients.
    readouts:
    - name: Plasma PTH and calcium after NPS-2143
      target: Suppressed Parathyroid Hormone Secretion
      direction: RESTORED
      interpretation: CaSR negative modulation overcomes the downstream Galpha11 gain of function.
      evidence:
      - reference: PMID:28194447
        reference_title: "Gα(11) mutation in mice causes hypocalcemia rectifiable by calcilytic therapy."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "In vivo, NPS-2143 induced a rapid and marked rise in plasma PTH and calcium concentrations in Dsk7/Dsk7 and Dsk7/+ mice, which became normocalcemic."
        explanation: Calcilytic rescue of PTH and calcium.
    evidence:
    - reference: PMID:28194447
      reference_title: "Gα(11) mutation in mice causes hypocalcemia rectifiable by calcilytic therapy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Mutant Dsk7/+ and Dsk7/Dsk7 mice were shown to have hypocalcemia and reduced plasma PTH concentrations, similar to ADH2 patients."
      explanation: The mouse reproduces the human biochemistry.

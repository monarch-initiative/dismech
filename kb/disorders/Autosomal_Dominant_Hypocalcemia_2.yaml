  features: >-
    GNA11 (19p13.3) encodes Galpha11. Loss-of-function variants cause the
    opposite disorder, familial hypocalciuric hypercalcemia type 2. GNA11 gain
    of function accounted for about a quarter of ADH patients without CASR
    variants in the first series.

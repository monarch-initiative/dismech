name: Autosomal Dominant Hypocalcemia 2
creation_date: "2026-10-24T02:24:13Z"
category: Mendelian
description: >-
  Autosomal dominant hypocalcemia type 2 (ADH2) is a form of isolated
  hypoparathyroidism caused by heterozygous gain-of-function missense variants
  in GNA11, which encodes G-protein subunit alpha-11 (Galpha11), the main
  signaling partner of the calcium-sensing receptor (CaSR) in parathyroid
  cells. Mutant Galpha11 makes CaSR signaling respond to lower extracellular
  calcium, so parathyroid cells read normal calcium as high and secrete too
  little parathyroid hormone (PTH). The result is lifelong hypocalcemia,
  usually mild to moderate, with low or inappropriately normal PTH and often
  hyperphosphatemia. Patients range from asymptomatic to paresthesia, tetany
  and seizures. Several families also have short stature and basal ganglia or
  wider intracranial calcification. Unlike CASR-related ADH1, most reported
  patients do not have marked hypercalciuria. ADH2 is the gain-of-function
  counterpart of familial hypocalciuric hypercalcemia type 2, which is caused
  by loss-of-function GNA11 variants. Symptomatic patients are treated with the
  lowest effective doses of calcium and active vitamin D; calcilytics
  (negative CaSR modulators) correct the defect in cells and in two mouse
  models but have not been tested in ADH2 patients.
notes: >-
  The entry is anchored on MONDO:0014146 and GNA11 (hgnc:4379).

  Whether the renal tubule shares the parathyroid defect is open. In ADH1 the
  activating CASR variant also raises urinary calcium directly, but the R60L
  family had no hypercalciuria and normal serum magnesium (PMID:24823460),
  and a review notes that urinary calcium is less elevated in ADH2 than in
  ADH1 (PMID:27803672). No renal mechanism node is curated; the question is
  recorded as a knowledge gap.

  The short stature and the link from Galpha11 to skeletal growth are
  curated as a hypothesis edge, because the families that report them propose
  increased Galpha11 signaling as the cause without testing it.

  No GeneReviews chapter covers this disease.

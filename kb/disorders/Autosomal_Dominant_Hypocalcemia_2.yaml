  - target: Decreased circulating parathyroid hormone level
    causal_link_type: DIRECT
  - target: Hyperphosphatemia
    causal_link_type: DIRECT
    description: >-
      PTH normally inhibits proximal tubular phosphate reabsorption, so low
      PTH lets serum phosphate rise.
    evidence:
    - reference: PMID:27803672
      reference_title: "Autosomal Dominant Hypocalcemia (Hypoparathyroidism) Types 1 and 2."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      directness: INDIRECT
      snippet: "In the proximal tubule, PTH inhibits phosphate reabsorption from the urine resulting in a decrease in serum phosphate levels."
      explanation: >-
        States the normal physiology the edge rests on; the hyperphosphatemia
        of ADH2 follows by inference from the low PTH.

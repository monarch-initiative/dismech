pathophysiology:
- name: Heterozygous GNA11 Gain-of-Function Variant
  biological_scale: MOLECULAR
  description: >-
    Missense variants such as Arg60Cys, Arg60Leu, Arg181Gln, Arg183Pro,
    Ser211Trp, Val340Met and Phe341Leu alter Galpha11 structure. Arg181Gln and
    Phe341Leu are predicted to destabilize the GTP hydrolysis transition state
    and so prolong the active GTP-bound state.
  genes:
  - preferred_term: GNA11
    term:
      id: hgnc:4379
      label: GNA11
  molecular_functions:
  - preferred_term: GTPase activity
    description: >-
      Reduced GTP hydrolysis is predicted for Arg181Gln and Phe341Leu from
      structural modeling, not measured. Other variants act through helix or
      subunit-interface changes.
    term:
      id: GO:0003924
      label: GTPase activity
    modifier: DECREASED
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: GAIN_OF_FUNCTION
  evidence:
  - reference: PMID:23802516
    reference_title: "Mutations affecting G-protein subunit α11 in hypercalcemia and hypocalcemia."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "Both the Arg181Gln mutation and the Phe341Leu mutation probably decrease the stabilization of the GTP hydrolysis transition state by Arg183 and Gln209,26-30 thereby prolonging the lifetime of the active GTP-bound Gα11 subunit."
    explanation: Structural prediction of how two ADH2 variants keep Galpha11 active.
  - reference: PMID:23802516
    reference_title: "Mutations affecting G-protein subunit α11 in hypercalcemia and hypocalcemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Missense GNA11 mutations (Arg181Gln and Phe341Leu) were detected in two unrelated patients with hypocalcemia; they were therefore identified as having autosomal dominant hypocalcemia type 2."
    explanation: Identifies the first ADH2 variants.
  downstream:
  - target: Increased CaSR-Galpha11 Sensitivity to Extracellular Calcium
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:23802516
      reference_title: "Mutations affecting G-protein subunit α11 in hypercalcemia and hypocalcemia."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The autosomal dominant hypocalcemia type 2–associated Gα11 mutants, Gln181 and Leu341, resulted in a leftward shift in the concentration–response curves, with significantly lower EC50 values, as compared with nonmutant Gα11 (Fig."
      explanation: Mutant Galpha11 lowers the calcium concentration needed for a half-maximal response.
    - reference: PMID:26818911
      reference_title: "Identification of a G-Protein Subunit-α11 Gain-of-Function Mutation, Val340Met, in a Family With Autosomal Dominant Hypocalcemia Type 2 (ADH2)."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "In vitro functional expression of wild-type (Val340) and mutant (Met340) Gα11 proteins in HEK293 cells stably expressing the CaSR, demonstrated that the intracellular calcium responses following stimulation with extracellular calcium, of the mutant Met340 Gα11 led to a leftward shift of the concentration-response curve with a significantly (p < 0.0001) reduced mean half-maximal concentration (EC50 ) value of 2.44 mM (95% CI, 2.31 to 2.77 mM) when compared to the wild-type EC50 of 3.14 mM (95% CI, 3.03 to 3.26 mM), consistent with a gain-of-function mutation."
      explanation: The same shift for a third variant.
  - target: Short stature
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Proposed, not shown: increased Galpha11 signaling outside the
      parathyroid may impair linear growth.
    evidence:
    - reference: PMID:27334330
      reference_title: "Impaired growth and intracranial calcifications in autosomal dominant hypocalcemia caused by a GNA11 mutation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: "(13) support the hypothesis that short stature may be a consequence of increased Gα11 signaling in patients with ADH caused by GNA11 mutations."
      explanation: States the growth link as a hypothesis supported by family data.
    - reference: PMID:24823460
      reference_title: "Autosomal dominant hypoparathyroidism caused by germline mutation in GNA11: phenotypic and molecular characterization."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: "Our findings indicate that the germline gain-of-function mutation of GNA11 is a cause of ADH and implicate a novel role for GNA11 in skeletal growth."
      explanation: Affected relatives were shorter than unaffected ones.
- name: Increased CaSR-Galpha11 Sensitivity to Extracellular Calcium
  biological_scale: CELLULAR
  description: >-
    In CaSR-expressing cells, mutant Galpha11 shifts the intracellular calcium
    response to lower extracellular calcium and raises calcium-stimulated ERK
    phosphorylation. The mutants are not constitutively active; they amplify
    the receptor's response to calcium.
  cell_types:
  - preferred_term: chief cell of parathyroid gland
    term:
      id: CL:0000446
      label: chief cell of parathyroid gland
  genes:
  - preferred_term: CASR
    term:
      id: hgnc:1514
      label: CASR
  biological_processes:
  - preferred_term: phospholipase C-activating G protein-coupled receptor signaling pathway
    term:
      id: GO:0007200
      label: phospholipase C-activating G protein-coupled receptor signaling pathway
    modifier: INCREASED
  - preferred_term: cellular response to calcium ion
    term:
      id: GO:0071277
      label: cellular response to calcium ion
    modifier: INCREASED
  evidence:
  - reference: PMID:26994139
    reference_title: "Allosteric Modulation of the Calcium-sensing Receptor Rectifies Signaling Abnormalities Associated with G-protein α-11 Mutations Causing Hypercalcemic and Hypocalcemic Disorders."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "ADH2-causing Gα11 mutations were demonstrated not to be constitutively activating and induced ERK phosphorylation following Ca(2+) o stimulation only."
    explanation: The gain of function depends on receptor stimulation by calcium.
  - reference: PMID:24823460
    reference_title: "Autosomal dominant hypoparathyroidism caused by germline mutation in GNA11: phenotypic and molecular characterization."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Functional studies of Gα11 R60L showed increased accumulation of intracellular concentration of free calcium in response to extracellular concentration of free calcium with a significantly decreased EC50 compared with wild-type Gα11."
    explanation: The R60L variant also increases calcium sensitivity.
  downstream:
  - target: Suppressed Parathyroid Hormone Secretion
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:28194447
      reference_title: "Gα(11) mutation in mice causes hypocalcemia rectifiable by calcilytic therapy."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: BACKGROUND
      snippet: "The CaSR is a widely expressed class C G-protein coupled receptor (GPCR) that plays a pivotal role in Ca2+o homeostasis by transducing elevations in the prevailing Ca2+o concentration into multiple signaling cascades that include Gq/11-protein–mediated activation of phospholipase C (PLC), which in the parathyroid glands induce increases in intracellular calcium (Ca2+i) and MAPK signaling responses that lead to decreased parathyroid hormone (PTH) secretion (3)."
      explanation: In parathyroid cells, Gq/11 signaling from the CaSR suppresses PTH secretion.

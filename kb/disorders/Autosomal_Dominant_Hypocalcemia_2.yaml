    reference_title: "Germline mutations affecting Gα11 in hypoparathyroidism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In summary, genomewide linkage analysis, com bined with whole-exome sequencing, revealed two different heterozygous mutations affecting Gα11 as novel causes of autosomal dominant isolated hypoparathyroidism."
    explanation: Heterozygous variants segregate dominantly in two families.
  - reference: PMID:35777808
    reference_title: "The Youngest Infant to Be Diagnosed with Autosomal Dominant Hypocalcemia Type 2 Harboring a Novel Variant of GNA11: A Case Study and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exome sequencing identified a de novo heterozygous missense variant, c. G548C (p. Arg183Pro) in GNA11."
    explanation: A de novo heterozygous case.

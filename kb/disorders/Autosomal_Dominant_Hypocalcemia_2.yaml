    snippet: "Moreover, these germline GNA11 mutations were detected in more than 10% of patients with familial hypocalciuric hypercalcemia who did not have CASR and AP2S1 mutations and in approximately 25% of patients with autosomal dominant hypocalcemia who did not have CASR mutations."
    explanation: Gives the diagnostic yield of GNA11 in CASR-negative ADH.

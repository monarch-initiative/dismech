diagnosis:
- name: Confirmatory Invasive Diagnostic Testing (CSF Analysis, Culture, and PCR)
  description: >-
    Confirmatory microbiological and molecular diagnostic testing (cerebrospinal
    fluid examination, blood and CSF culture, and PCR) performed concomitantly
    with early empirical antimicrobial therapy in patients with suspected
    meningococcal meningitis or sepsis.
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  evidence:
  - reference: PMID:23830646
    reference_title: "Severe meningococcal infection: a review of epidemiology, diagnosis, and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Suspected patients should receive early appropriate antimicrobial therapy concomitantly with confirmatory invasive diagnostic tests."
    explanation: Establishes confirmatory invasive diagnostic testing alongside empirical antimicrobial therapy as standard diagnostic practice.
treatments:
- name: Quadrivalent Meningococcal Conjugate Vaccination (MenACWY / MCV4)
  description: >-
    Polysaccharide-protein conjugate vaccines against Neisseria meningitidis
    serogroups A, C, W, and Y convert T-independent capsular polysaccharides
    into T-dependent antigens, inducing high-titer serum bactericidal antibodies
    and mucosal carriage reduction that have markedly reduced non-B invasive
    meningococcal disease.
  therapeutic_modality: VACCINE
  treatment_term:
    preferred_term: vaccination
    term:
      id: NCIT:C15346
      label: Vaccination
  target_mechanisms:
  - target: Polysaccharide Capsule and Factor H-Binding Protein Complement Evasion and Meningococcemia
    treatment_effect: INHIBITS
    description: >-
      Anti-capsular IgG antibodies induced by MenACWY conjugate vaccination
      trigger complement-mediated serum bactericidal lysis of serogroup A, C, W,
      and Y meningococci.
    evidence:
    - reference: PMID:23830646
      reference_title: "Severe meningococcal infection: a review of epidemiology, diagnosis, and management."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: "Vaccines have reduced the incidence of infection with certain non-B meningococcal serogroups, and new serotype B vaccines are on the horizon."
      explanation: Documents reduction of non-B invasive meningococcal infection incidence by serogroup-specific meningococcal vaccines.
  effect_modifiers:
  - effect_modifier_type: GENOTYPE
    stratum: terminal complement pathway deficiency (C5-C9) or C5 inhibitor recipients
    comparator_stratum: complement-sufficient individuals
    modified_outcome: serum bactericidal lysis and protection against invasive meningococcal disease
    effect_in_stratum: SMALLER_EFFECT
    description: >-
      Because meningococcal killing relies heavily on membrane attack complex
      (C5b-9) serum bactericidal activity, patients with terminal complement
      pathway deficiencies remain at elevated risk of invasive meningococcal
      disease despite vaccination.
    evidence:
    - reference: PMID:31440263
      reference_title: "Clinical and Genetic Spectrum of a Large Cohort With Total and Sub-total Complement Deficiencies."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Our study confirms the strong association of meningococcal infections with terminal pathway deficiency and highlights the risk of pneumococcal and auto-immune diseases in the classical and alternative pathways."
      explanation: Confirms the dependence of anti-meningococcal host defense on intact terminal complement pathway activity.
  evidence:
  - reference: PMID:23830646
    reference_title: "Severe meningococcal infection: a review of epidemiology, diagnosis, and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Vaccines have reduced the incidence of infection with certain non-B meningococcal serogroups, and new serotype B vaccines are on the horizon."
    explanation: Confirms effectiveness of non-B meningococcal conjugate vaccines in reducing disease incidence.
- name: Meningococcal Group B Protein Vaccination (4CMenB / MenB-FHbp)
  description: >-
    Because the alpha(2-8)-linked polysialic acid capsule of serogroup B
    Neisseria meningitidis mimics human neural cell adhesion molecule (NCAM) and
    is poorly immunogenic, MenB vaccines (4CMenB / Bexsero and MenB-FHbp /
    Trumenba) target subcapsular outer-membrane proteins (fHbp, NadA, NHBA, PorA
    OMVs). Infant 4CMenB vaccination in England achieved 82.9% two-dose vaccine
    effectiveness (94.2% against covered strains) and a 75% reduction in MenB
    disease incidence.
  therapeutic_modality: VACCINE
  treatment_term:
    preferred_term: vaccination
    term:
      id: NCIT:C15346
      label: Vaccination
  target_mechanisms:
  - target: Polysaccharide Capsule and Factor H-Binding Protein Complement Evasion and Meningococcemia
    treatment_effect: INHIBITS
    description: >-
      Antibodies against subcapsular antigens (fHbp, NadA, NHBA, PorA) block
      factor H recruitment and promote classical-pathway bactericidal lysis of
      serogroup B meningococci.
    evidence:
    - reference: PMID:31971676
      reference_title: "Vaccination of Infants with Meningococcal Group B Vaccine (4CMenB) in England."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: "From September 2015 through August 2018, the incidence of meningococcal group B disease in England (average annual birth cohort, approximately 650,000 infants) was significantly lower in vaccine-eligible cohorts than the expected incidence (63 observed cases as compared with 253 expected cases; incidence rate ratio, 0.25; 95% confidence interval [CI], 0.19 to 0.36), with a 75% reduction in age groups that were fully eligible for vaccination."
      explanation: Demonstrates 75% reduction in invasive MenB disease in 4CMenB-eligible infant cohorts.
  evidence:
  - reference: PMID:31971676
    reference_title: "Vaccination of Infants with Meningococcal Group B Vaccine (4CMenB) in England."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "From September 2015 through August 2018, the incidence of meningococcal group B disease in England (average annual birth cohort, approximately 650,000 infants) was significantly lower in vaccine-eligible cohorts than the expected incidence (63 observed cases as compared with 253 expected cases; incidence rate ratio, 0.25; 95% confidence interval [CI], 0.19 to 0.36), with a 75% reduction in age groups that were fully eligible for vaccination."
    explanation: Provides population-level effectiveness of infant 4CMenB immunization.
  - reference: PMID:28100432
    reference_title: "Effectiveness and impact of a reduced infant schedule of 4CMenB vaccine against group B meningococcal disease in England: a national observational cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two-dose vaccine effectiveness was 82·9% (95% CI 24·1-95·2) against all MenB cases, equivalent to a vaccine effectiveness of 94·2% against the highest predicted MenB strain coverage of 88%."
    explanation: Reports 82.9% two-dose vaccine effectiveness against all MenB cases and 94.2% against vaccine-covered strains.
- name: Early Parenteral Antimicrobial Therapy
  description: >-
    Immediate empirical and targeted parenteral antimicrobial therapy (such as
    third-generation cephalosporins or penicillin G) is essential to eradicate
    cerebrospinal fluid and bloodstream meningococci.
  treatment_term:
    preferred_term: antibiotic therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
  target_mechanisms:
  - target: Cerebrospinal Fluid Complement Activation and Inflammasome Pyroptosis
    treatment_effect: INHIBITS
    description: Bactericidal beta-lactam antibiotics clear viable N. meningitidis from the CSF and bloodstream.
    evidence:
    - reference: PMID:23830646
      reference_title: "Severe meningococcal infection: a review of epidemiology, diagnosis, and management."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: "Suspected patients should receive early appropriate antimicrobial therapy concomitantly with confirmatory invasive diagnostic tests."
      explanation: Establishes early antimicrobial therapy as standard-of-care treatment for suspected invasive meningococcal disease.
  evidence:
  - reference: PMID:23830646
    reference_title: "Severe meningococcal infection: a review of epidemiology, diagnosis, and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Suspected patients should receive early appropriate antimicrobial therapy concomitantly with confirmatory invasive diagnostic tests."
    explanation: Supports prompt antimicrobial therapy upon clinical suspicion of meningococcal meningitis or sepsis.
genetic:
- name: Terminal Complement Pathway Deficiency (C5-C9)
  association: Risk Factor / Predisposition
  notes: >-
    Congenital deficiencies of terminal complement pathway components (C5
    through C9) impair membrane attack complex-mediated serum bactericidal
    lysis and strongly predispose affected individuals to invasive
    meningococcal infections.
  evidence:
  - reference: PMID:31440263
    reference_title: "Clinical and Genetic Spectrum of a Large Cohort With Total and Sub-total Complement Deficiencies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our study confirms the strong association of meningococcal infections with terminal pathway deficiency and highlights the risk of pneumococcal and auto-immune diseases in the classical and alternative pathways."
    explanation: Confirms the strong genetic association between terminal complement pathway deficiencies and invasive meningococcal infections.

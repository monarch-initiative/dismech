name: Meningococcal Meningitis
creation_date: '2026-10-25T20:10:00Z'
category: Infectious Disease
description: >-
  Meningococcal meningitis is an acute, life-threatening bacterial infection of
  the leptomeninges and subarachnoid space caused by encapsulated Neisseria
  meningitidis (serogroups A, B, C, W, X, and Y). Following nasopharyngeal
  colonization and bloodstream invasion, meningococci cross the blood-brain
  barrier and replicate in the cerebrospinal fluid, where lipooligosaccharide
  (endotoxin) release and two-partner secretion system virulence factors trigger
  complement activation (C1q, MBL, C3a, C5a, sC5b-9) and canonical/non-canonical
  inflammasome pyroptosis (caspase-1, caspase-11, gasdermin-D, IL-1beta, IL-18),
  often accompanied by meningococcemia and a characteristic petechial or
  purpuric rash.
disease_term:
  preferred_term: meningococcal meningitis
  term:
    id: MONDO:0018059
    label: meningococcal meningitis
parents:
- Bacterial meningitis
synonyms:
- Cerebrospinal fever
- Epidemic cerebrospinal meningitis
- Meningococcal cerebrospinal meningitis
infectious_agent:
- name: Neisseria meningitidis
  description: >-
    Encapsulated, Gram-negative diplococcus colonizing the human nasopharynx;
    invasive disease is caused predominantly by polysaccharide-encapsulated
    serogroups A, B, C, W, X, and Y.
  infectious_agent_term:
    preferred_term: Neisseria meningitidis
    term:
      id: NCBITaxon:487
      label: Neisseria meningitidis
  evidence:
  - reference: PMID:23830646
    reference_title: "Severe meningococcal infection: a review of epidemiology, diagnosis, and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neisseria meningitidis, also known as meningococcus, is a relatively uncommon cause of invasive infection, but when it occurs it is frequently severe and potentially life threatening."
    explanation: Identifies Neisseria meningitidis as the causative bacterium of severe invasive meningococcal infection and meningitis.
agent_life_cycle:
  description: >-
    Neisseria meningitidis is an obligate human pathogen maintained by
    asymptomatic carriage in the human nasopharynx and transmitted person to
    person via respiratory droplets.
  hosts:
  - preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
    role: obligate human reservoir and definitive host
transmission:
- name: Respiratory droplet and close-contact transmission from nasopharyngeal carriers
  description: >-
    Neisseria meningitidis colonizes the human nasopharynx and is transmitted
    from person to person via respiratory droplets or oral secretions, with
    invasive bloodstream and meningeal invasion occurring in a subset of newly
    colonized susceptible hosts.
  evidence:
  - reference: PMID:23830646
    reference_title: "Severe meningococcal infection: a review of epidemiology, diagnosis, and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neisseria meningitidis, also known as meningococcus, is a relatively uncommon cause of invasive infection, but when it occurs it is frequently severe and potentially life threatening."
    explanation: Identifies Neisseria meningitidis as an invasive human pathogen causing severe meningococcal infection.
prevalence:
- population: Global invasive meningococcal disease cohorts
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: UNKNOWN
  rate_denominator: POPULATION_PER_YEAR
  notes: >-
    Invasive meningococcal infection is relatively uncommon overall in
    non-epidemic settings, with serogroup-specific conjugate and protein
    vaccines substantially reducing disease incidence in immunized cohorts.
  evidence:
  - reference: PMID:23830646
    reference_title: "Severe meningococcal infection: a review of epidemiology, diagnosis, and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neisseria meningitidis, also known as meningococcus, is a relatively uncommon cause of invasive infection, but when it occurs it is frequently severe and potentially life threatening."
    explanation: Characterizes invasive meningococcal infection as a relatively uncommon but severe and potentially life-threatening disease.
progression:
- phase: Nasopharyngeal Carriage and Acute Meningococcemic Invasion Phase
  notes: >-
    Following asymptomatic nasopharyngeal colonization, encapsulated
    meningococci invade the bloodstream in susceptible hosts, causing acute
    meningococcemia frequently accompanied by a non-blanching petechial rash.
  evidence:
  - reference: PMID:23830646
    reference_title: "Severe meningococcal infection: a review of epidemiology, diagnosis, and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Meningococcus should be considered and investigated promptly as a potentially etiologic pathogen in any patient with meningitis, or sepsis accompanied by a petechial rash."
    explanation: Documents the acute invasive bloodstream presentation (sepsis with petechial rash) alongside meningitis.
- phase: Acute Purulent Meningitis Phase
  notes: >-
    Bacteremic meningococci breach the blood-brain barrier and replicate in the
    cerebrospinal fluid, triggering fulminant complement- and pyroptosis-driven
    meningitis that requires immediate parenteral antimicrobial therapy.
  evidence:
  - reference: PMID:23830646
    reference_title: "Severe meningococcal infection: a review of epidemiology, diagnosis, and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Suspected patients should receive early appropriate antimicrobial therapy concomitantly with confirmatory invasive diagnostic tests."
    explanation: Emphasizes the rapid clinical progression of invasive meningococcal meningitis requiring immediate empirical antimicrobial therapy.
pathophysiology:
- name: Nasopharyngeal Mucosal Colonization and Epithelial Invasion
  description: >-
    Encapsulated Neisseria meningitidis adheres to and colonizes the human
    nasopharyngeal mucosa and translocates across the epithelial barrier into
    the submucosa and bloodstream in susceptible individuals.
  role: trigger
  biological_scale: CELLULAR
  locations:
  - preferred_term: nasopharynx
    term:
      id: UBERON:0001728
      label: nasopharynx
  biological_processes:
  - preferred_term: adhesion of symbiont to host
    modifier: INCREASED
    term:
      id: GO:0044406
      label: adhesion of symbiont to host
  evidence:
  - reference: PMID:23830646
    reference_title: "Severe meningococcal infection: a review of epidemiology, diagnosis, and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neisseria meningitidis, also known as meningococcus, is a relatively uncommon cause of invasive infection, but when it occurs it is frequently severe and potentially life threatening."
    explanation: Establishes mucosal acquisition and progression to severe invasive meningococcal infection.
  downstream:
  - target: Polysaccharide Capsule and Factor H-Binding Protein Complement Evasion and Meningococcemia
    description: Translocation across the nasopharyngeal epithelium seeds encapsulated meningococci into the systemic circulation.
    causal_link_type: DIRECT
- name: Polysaccharide Capsule and Factor H-Binding Protein Complement Evasion and Meningococcemia
  conforms_to: "polysaccharide_conjugate_t_dependent_switching#Polysaccharide Capsule-Mediated Mucosal Colonization and Complement Evasion"
  description: >-
    Within the bloodstream, the meningococcal polysaccharide capsule and factor
    H-binding protein (fHbp) inhibit alternative-pathway opsonophagocytosis and
    complement-mediated bactericidal lysis, enabling intravascular survival and
    meningococcemia.
  role: amplifier
  biological_scale: TISSUE
  locations:
  - preferred_term: blood
    term:
      id: UBERON:0000178
      label: blood
  biological_processes:
  - preferred_term: complement activation
    modifier: DECREASED
    term:
      id: GO:0006956
      label: complement activation
  evidence:
  - reference: PMID:23830646
    reference_title: "Severe meningococcal infection: a review of epidemiology, diagnosis, and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Meningococcus should be considered and investigated promptly as a potentially etiologic pathogen in any patient with meningitis, or sepsis accompanied by a petechial rash."
    explanation: Links invasive meningococcal bloodstream infection (sepsis with petechial rash) to meningitis.
  downstream:
  - target: Cerebrospinal Fluid Complement Activation and Inflammasome Pyroptosis
    description: Bacteremic meningococci adhere to cerebral microvascular endothelium and breach the blood-brain barrier to enter the subarachnoid space.
    causal_link_type: DIRECT
  - target: Sepsis
    description: Intravascular meningococcal replication and endotoxin release produce meningococcal sepsis.
  - target: Petechiae
    description: Microvascular endothelial invasion and thrombosis during meningococcemia cause a petechial or purpuric rash.
- name: Cerebrospinal Fluid Complement Activation and Inflammasome Pyroptosis
  description: >-
    Within the subarachnoid space and brain parenchyma, Neisseria meningitidis
    triggers classical, lectin, and common-pathway complement activation in the
    cerebrospinal fluid (elevated C1q, MBL, C3a, iC3b, C5a, sC5b-9, and CFH) and
    activates canonical and non-canonical inflammasome pyroptosis via caspase-1,
    caspase-11, and gasdermin-D cleavage (promoted by the HrpB two-partner
    secretion system), releasing mature IL-1beta and IL-18 and driving intense
    meningeal inflammation.
  role: central_effector
  biological_scale: TISSUE
  locations:
  - preferred_term: cerebrospinal fluid
    term:
      id: UBERON:0001359
      label: cerebrospinal fluid
  - preferred_term: meninx
    term:
      id: UBERON:0002360
      label: meninx
  - preferred_term: brain
    term:
      id: UBERON:0000955
      label: brain
  biological_processes:
  - preferred_term: complement activation
    modifier: INCREASED
    term:
      id: GO:0006956
      label: complement activation
  - preferred_term: pyroptosis
    modifier: INCREASED
    term:
      id: GO:0070269
      label: pyroptotic inflammatory response
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  evidence:
  - reference: PMID:24412248
    reference_title: "Cerebrospinal fluid complement activation in patients with pneumococcal and meningococcal meningitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Complement factors C1q and MBL as well as common complement pathway factors C3a, iC3b, C5a, sC5b-9 and complement regulator CFH were all elevated in patients with bacterial meningitis as compared to the controls."
    explanation: Demonstrates widespread CSF complement cascade activation (C1q, MBL, C3a, iC3b, C5a, sC5b-9) in patients with meningococcal and pneumococcal meningitis.
  - reference: DOI:10.3389/fcimb.2024.1384072
    reference_title: "Neisseria meningitidis activates pyroptotic pathways in a mouse model of meningitis: role of a two-partner secretion system"
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Furthermore, western blot analysis of brain samples during the infection demonstrated that: i. N. meningitidis activated canonical and non-canonical inflammasome pyroptosis pathways in the mouse brain; ii. the activation of caspase-11, caspase-1, and gasdermin-D was markedly reduced in the hrpB mutant; iii. the increase in the amount of IL-1β and IL-18, which are an important end point of pyroptosis, occurs in the brains of mice infected with the wild-type strain 93/4286 and is strongly reduced in those infected with 93/4286ΩhrpB."
    explanation: Shows that N. meningitidis activates caspase-1/caspase-11/gasdermin-D pyroptosis and IL-1beta/IL-18 release in the brain during meningitis.
  downstream:
  - target: Meningitis
    description: Complement anaphylatoxins (C3a, C5a) and pyroptotic IL-1beta/IL-18 release drive purulent meningeal inflammation.

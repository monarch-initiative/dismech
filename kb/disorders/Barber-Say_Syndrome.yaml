genetic:
- name: TWIST2
  gene_term:
    preferred_term: TWIST2
    term:
      id: hgnc:20670
      label: TWIST2
  association: CAUSATIVE
  variant_origin: DE_NOVO
  features: >-
    Heterozygous variants in the basic domain: p.Glu75Gln (NM_057179.2
    c.223G>C; 9 of the 11 Glu75 BSS individuals in the discovery series),
    p.Glu75Ala (c.224A>C; 2 of 11) and, in one proband, the in-frame
    duplication p.Gln77_Arg78dup (c.229_234dupCAGCGC). Mostly de novo;
    transmitted in several families, including from mosaic fathers.
    p.Glu75Lys at the same residue causes ablepharon-macrostomia syndrome, and
    biallelic nonsense alleles cause Setleis syndrome.
  evidence:
  - reference: PMID:26119818
    reference_title: Recurrent Mutations in the Basic Domain of TWIST2 Cause Ablepharon Macrostomia and Barber-Say Syndromes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      nine had a c.223G>C (p.Glu75Gln) mutation (GenBank: NM_057179.2) and two
      had c.224A>C (p.Glu75Ala) mutations
    explanation: Allele counts in the Glu75 BSS individuals of the discovery series.
  - reference: PMID:28680619
    reference_title: "Barber-say syndrome: a confirmed case of TWIST2 gene mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "TWIST2 sequencing showed a pathogenic mutation: c.223G>C (p.Glu75Gln)."
    explanation: Independent confirmation of the recurrent allele in a later case.
  - reference: PMID:37817291
    reference_title: Multiple rhabdomyomatous mesenchymal hamartomas in a patient with mosaic Barber-Say syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Therefore, we consider this variant as de novo mosaicism.
    explanation: De novo mosaic TWIST2 variant in a proband.
  notes: >-
    No ClinGen gene-disease validity assertion exists for TWIST2 and Barber-Say
    syndrome (ClinGen gene-validity download, retrieved 2026-09-23, has no
    TWIST2 row). The mosaic father-to-child transmission in an Indian family
    (PMID:27092433) is not cited: PubMed holds no abstract for it and no full
    text was retrievable.
diagnosis:
- name: TWIST2 Sequencing With Parental Testing
  description: >-
    The diagnosis is clinical at birth and is confirmed by sequencing TWIST2.
    Because the recurrent alleles sit at one codon and the substituting amino
    acid distinguishes Barber-Say from ablepharon-macrostomia syndrome, the
    report should name the variant. Testing both parents establishes de novo
    or inherited origin, which matters for recurrence counselling because
    transmitting parents can be mildly affected mosaics.
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:28680619
    reference_title: "Barber-say syndrome: a confirmed case of TWIST2 gene mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genetic testing is recommended in patients presenting with these
      phenotypic abnormalities, along with their parents, to establish de novo
      or inherited mutations.
    explanation: Recommends proband and parental TWIST2 testing.
  - reference: PMID:28680619
    reference_title: "Barber-say syndrome: a confirmed case of TWIST2 gene mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Paternal testing would have helped to clarify whether this finding is
      paternally inherited or de novo. Additionally, it would clarify recurrence
      risks for the patient's family.
    explanation: Parental testing informs recurrence risk.
differential_diagnoses:
- name: Ablepharon-macrostomia syndrome
  description: >-
    Allelic TWIST2 disorder caused by p.Glu75Lys at the same residue. Shares
    macrostomia, eyelid underdevelopment, cheek pads, ear, nipple and genital
    anomalies; distinguished by absent or severely hypoplastic eyelids
    (ablepharon) and sparse scalp hair, whereas Barber-Say syndrome has
    generalized hypertrichosis and mostly ectropion. The variant settles the
    call.
  disease_term:
    preferred_term: ablepharon macrostomia syndrome
    term:
      id: MONDO:0008693
      label: ablepharon macrostomia syndrome
  evidence:
  - reference: PMID:26119818
    reference_title: Recurrent Mutations in the Basic Domain of TWIST2 Cause Ablepharon Macrostomia and Barber-Say Syndromes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a lysine at TWIST2 residue 75 resulted in AMS, whereas a glutamine or
      alanine yielded BSS
    explanation: The molecular discriminator between the two syndromes.
  - reference: PMID:27196381
    reference_title: "Barber-Say syndrome and Ablepharon-Macrostomia syndrome: An overview."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Scalp hair is sparse in AMS only, but sparse eyebrows and eyelashes occur
      in both entities, and general hypertrichosis occurs in BSS.
    explanation: The hair phenotype that separates the two clinically.
  - reference: PMID:19760652
    reference_title: Case report supporting that the Barber-Say and ablepharon macrostomia syndromes could represent one disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Other authors have discussed that BSS and AMS could possibly represent one
      syndrome, and our report supports this hypothesis.
    explanation: The lumping argument, recorded because it bears on the split.
- name: Setleis syndrome (focal facial dermal dysplasia type III)
  description: >-
    Autosomal recessive TWIST2 disorder caused by biallelic truncating
    variants, with bitemporal scar-like lesions and eyelash and eyebrow
    abnormalities. It overlaps facially with Barber-Say syndrome, but its
    inheritance, its loss-of-function mechanism and the focal temporal lesions

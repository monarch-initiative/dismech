animal_models:
- name: Zebrafish embryos injected with mutant human TWIST2 mRNA
  species: Zebrafish
  genotype: >-
    Wild-type embryos injected at the one-cell stage with human TWIST2 mRNA
    (wild-type, p.Glu75Gln or p.Glu75Lys); stable Cre-inducible transgenic
    lines confirmed the phenotypes
  publication: PMID:26119818
  description: >-
    Overexpression model used to compare wild-type and mutant TWIST2 in vivo.
    Mutant protein caused more severe head hypoplasia and trunk defects than
    wild-type, and RNA-seq at shield stage showed down-regulation of
    extracellular matrix, membrane and cytoskeletal gene sets.
  modeled_mechanisms:
  - target: Dysregulated TWIST2-Dependent Mesenchymal Transcription
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      Shows that the Barber-Say allele changes developmental transcription and
      head development more than wild-type TWIST2 does.
    limitations: >-
      Global overexpression of human mRNA from the one-cell stage, not a
      heterozygous allele expressed in mesenchyme; wild-type TWIST2
      overexpression alone produced a phenotype, so the comparison is between
      two gain-of-dose conditions. Fish have no eyelids or hair, so the
      defining features cannot be assessed.
    evidence:
    - reference: PMID:26119818
      reference_title: Recurrent Mutations in the Basic Domain of TWIST2 Cause Ablepharon Macrostomia and Barber-Say Syndromes.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Comparison of wild-type and mutant TWIST2 expressed in zebrafish
        identified abnormal developmental phenotypes and widespread
        transcriptome changes.
      explanation: Supports the model as informative for the transcriptional node.
    - reference: PMID:26119818
      reference_title: Recurrent Mutations in the Basic Domain of TWIST2 Cause Ablepharon Macrostomia and Barber-Say Syndromes.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Simple overexpression of the wild-type protein in zebrafish caused a
        mild developmental phenotype.
      explanation: The overexpression caveat recorded in limitations.
- name: hlh-8 Glu29 allelic series (C. elegans)
  species: Caenorhabditis elegans
  genotype: hlh-8 Glu29 substitutions equivalent to the five human TWIST1/TWIST2 disease alleles
  publication: PMID:28369379
  description: >-
    CRISPR/Cas9 substitutions at endogenous hlh-8 Glu29 model the conserved human TWIST1/TWIST2 residue. BSS-equivalent
    Glu29Ala and Glu29Gln were examined as homozygotes and heterozygotes, with a frameshift-null control. Homozygotes
    had egg-laying and M-lineage defects, with residual tissue-specific reporter expression. Heterozygotes
    showed reduced vulval-muscle egl-15 reporter expression despite a wild-type allele; null heterozygotes
    resembled wild-type. Embryo retention was assessed in a sensitized multicopy reporter background.
  modeled_mechanisms:
  - target: Dysregulated TWIST2-Dependent Mesenchymal Transcription
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      BSS-equivalent substitutions impair target-gene reporter expression in endogenous heterozygous worms,
      contrasting with the recessive null control and supporting dominant-negative activity.
    limitations: >-
      The worm has a single Twist homolog and no mammalian eyelids or hair. Reporter transgenes contain multiple
      promoter copies; the embryo-retention assay uses a sensitized background. These assays address allele
      behavior rather than the specific human mesenchymal transcriptome, and do not map DNA-binding sites.
      Inferred sequestration into nonproductive dimers was not directly measured.
    evidence:
    - reference: PMID:28369379
      reference_title: Localized TWIST1 and TWIST2 basic domain substitutions cause four distinct human diseases that can be modeled in Caenorhabditis elegans.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        This allelic series revealed that different substitutions exhibit
        graded severity, in terms of both gene expression and cellular
        phenotype, which we incorporate into a model explaining the various
        human disease phenotypes.
      explanation: Grades the Glu75-equivalent alleles in vivo.
    - reference: url:https://ora.ox.ac.uk/objects/uuid%3A0b9cf8b9-01b4-43b7-95b4-b9c68ea74406/files/mf135269e0a132704a438813780ba4af6
      reference_title: https://ora.ox.ac.uk/objects/uuid%3A0b9cf8b9-01b4-43b7-95b4-b9c68ea74406/files/mf135269e0a132704a438813780ba4af6
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Glu29Gln/+ and Glu29Ala/+ animals were also quite defective with 60% of the population barely expressing
        the GFP
      explanation: >-
        BSS-equivalent heterozygotes showed deficient egl-15 reporter expression in vulval muscles.
    - reference: url:https://ora.ox.ac.uk/objects/uuid%3A0b9cf8b9-01b4-43b7-95b4-b9c68ea74406/files/mf135269e0a132704a438813780ba4af6
      reference_title: https://ora.ox.ac.uk/objects/uuid%3A0b9cf8b9-01b4-43b7-95b4-b9c68ea74406/files/mf135269e0a132704a438813780ba4af6
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In examining egl-15::gfp expression in heterozygotes, the fs2728/+ animals resembled the WT population
      explanation: >-
        The frameshift-null heterozygous control helps distinguish the missense effect from simple loss of
        one functional copy.

    explanation: Gain of binding at sites the wild-type protein does not occupy.
  - reference: PMID:26119818
    reference_title: Recurrent Mutations in the Basic Domain of TWIST2 Cause Ablepharon Macrostomia and Barber-Say Syndromes.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Mutations in the basic domain of TWIST2 drastically altered the spectrum

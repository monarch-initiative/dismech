- name: Dermal Extracellular Matrix Disorganization
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  description: >-
    Electron microscopy of Barber-Say skin shows thin, elongated elastic
    fibres, disordered collagen fibres of variable diameter, and microfibrillar
    proliferation with amorphous deposits, the same pattern as in
    ablepharon-macrostomia skin. One further patient in the series had reduced
    elastic fibres on biopsy. This is the tissue correlate of the thin,
    wrinkled and redundant skin. Based on skin biopsies from two individuals.

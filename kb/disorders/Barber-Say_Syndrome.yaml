pathophysiology:
- name: TWIST2 Basic-Domain Variant
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Heterozygous variants alter the DNA-contacting basic domain of TWIST2. The discovery series contained p.Glu75Gln,
    p.Glu75Ala and p.Gln77_Arg78dup. The p.Glu75Lys substitution instead segregated with ablepharon-macrostomia
    syndrome. Structural modeling predicted altered DNA interaction rather than a gross change in protein fold;
    that prediction is distinct from the measured binding changes in HeLa cells.
  gene:
    preferred_term: TWIST2
    term:
      id: hgnc:20670
      label: TWIST2
  genetic_context:
    gene:
      preferred_term: TWIST2
      term:
        id: hgnc:20670
        label: TWIST2
    zygosity: HETEROZYGOUS
    description: >-
      Heterozygous missense substitutions p.Glu75Gln and p.Glu75Ala and the in-frame duplication p.Gln77_Arg78dup,
      including de novo, inherited and mosaic presentations. Dominant-negative and neomorphic mechanisms are
      recorded as hypotheses because binding changes alone do not establish their relative contribution in
      human tissue.
  evidence:
  - reference: PMID:26119818
    reference_title: Recurrent Mutations in the Basic Domain of TWIST2 Cause Ablepharon Macrostomia and Barber-Say Syndromes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified a recurrent de novo mutation in TWIST2 in seven independent
      AMS-affected families, as well as another recurrent de novo mutation
      affecting the same amino acid in ten independent BSS-affected families.
    explanation: Identifies the recurrent causal residue across unrelated BSS families.
  - reference: PMID:26119818
    reference_title: Recurrent Mutations in the Basic Domain of TWIST2 Cause Ablepharon Macrostomia and Barber-Say Syndromes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a lysine at TWIST2 residue 75 resulted in AMS, whereas a glutamine or
      alanine yielded BSS
    explanation: >-
      The residue-level genotype-phenotype correlation that separates this
      disorder from ablepharon-macrostomia syndrome.
  - reference: PMID:26119818
    reference_title: Recurrent Mutations in the Basic Domain of TWIST2 Cause Ablepharon Macrostomia and Barber-Say Syndromes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A 12th individual with BSS, BSS-1.1, carried a heterozygous
      c.229_234dupCAGCGC (p.Gln77_Arg78dup) mutation
    explanation: The one non-Glu75 allele in the series, also in the basic domain.
  - reference: PMID:26119818
    reference_title: Recurrent Mutations in the Basic Domain of TWIST2 Cause Ablepharon Macrostomia and Barber-Say Syndromes.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      In silico TWIST2 modeling suggests that mutations affecting the p.Glu75
      residue do not alter global protein structure but could alter DNA binding
    explanation: Structural modelling result from the same paper, graded COMPUTATIONAL.
  downstream:
  - target: Altered TWIST2 Genomic DNA-Binding Pattern
    causal_link_type: DIRECT
    description: >-
      The substituted basic domain changes where TWIST2 binds the genome.
    evidence:
    - reference: PMID:26119818
      reference_title: Recurrent Mutations in the Basic Domain of TWIST2 Cause Ablepharon Macrostomia and Barber-Say Syndromes.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        All identified mutations fell in the basic domain of TWIST2 and altered
        the DNA-binding pattern of Flag-TWIST2 in HeLa cells.
      explanation: >-
        Links the basic-domain substitutions directly to altered DNA binding in
        a cell system.
- name: Altered TWIST2 Genomic DNA-Binding Pattern
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    ChIP-seq in T-REx HeLa cells overexpressing tagged TWIST2 compared wild-type protein with p.Glu75Lys, p.Glu75Gln,
    p.Glu75Ala and p.Gln77_Arg78dup. Wild-type TWIST2 had 630 binding peaks. The paper reports that p.Glu75Ala
    and p.Gln77_Arg78dup shared only 25 peaks with wild-type, and that mutant proteins also occupied sites
    not detected for wild-type. These findings support altered target occupancy in this assay. Their relevance
    to endogenous TWIST2 binding in affected human craniofacial or dermal mesenchyme remains provisional.
  molecular_functions:
  - preferred_term: E-box binding
    term:
      id: GO:0070888
      label: E-box binding
    modifier: DECREASED
  - preferred_term: DNA-binding transcription factor activity
    term:
      id: GO:0003700
      label: DNA-binding transcription factor activity
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:26119818
    reference_title: Recurrent Mutations in the Basic Domain of TWIST2 Cause Ablepharon Macrostomia and Barber-Say Syndromes.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We identified 630 binding peaks associated with wild-type TWIST2.
    explanation: The wild-type binding baseline in the same assay.
  - reference: PMID:26119818
    reference_title: Recurrent Mutations in the Basic Domain of TWIST2 Cause Ablepharon Macrostomia and Barber-Say Syndromes.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      p.Glu75Ala and p.Gln77_Arg78dup TWIST2, both associated with BSS, shared
      only 25 binding peaks in common with the wild-type
    explanation: Loss of normal binding sites for the BSS alleles.
  - reference: PMID:26119818
    reference_title: Recurrent Mutations in the Basic Domain of TWIST2 Cause Ablepharon Macrostomia and Barber-Say Syndromes.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      A significant number of binding peaks detected for the mutant TWIST2

- name: Dysregulated TWIST2-Dependent Mesenchymal Transcription
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    TWIST2 is expressed in craniofacial mesenchyme and chondrogenic precursors
    during embryonic development and is thought to direct development of dermal
    and chondrogenic tissue. Expressing the Barber-Say (p.Glu75Gln) or AMS
    (p.Glu75Lys) protein in zebrafish embryos produced more severe
    developmental defects than wild-type TWIST2 and down-regulated genes for
    extracellular matrix, membrane and cytoskeletal components.

    PROVISIONAL: the tissue-expression premise comes from the background of the
    primary paper, and the transcriptome is from zebrafish embryos injected
    with human mRNA at the one-cell stage, which over-expresses TWIST2
    globally rather than modelling a heterozygous allele in mesenchyme. No
    patient-cell transcriptome for a Barber-Say allele has been reported.

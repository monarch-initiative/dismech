- ectodermal dysplasia syndrome
- TWIST2-related disorder
notes: >-
  Lump/split. Barber-Say syndrome is curated as its own Disease entry, with
  ablepharon-macrostomia syndrome (AMS, MONDO:0008693) as an allelic
  differential rather than a subtype. The reasons are that MONDO, OMIM
  (209885 versus 200110) and Orphanet keep the two separate, and that the
  molecular split is clean at the residue level: in the gene-discovery series
  every AMS family carried p.Glu75Lys and every BSS family carried p.Glu75Gln,
  p.Glu75Ala or p.Gln77_Arg78dup, with no allele shared between the two
  phenotypes (PMID:26119818). The opposing view is documented: a 2009 case
  report of microblepharon in BSS argued the two could be one disorder
  (PMID:19760652), and a 2016 critical review of all published patients
  expected BSS, AMS and Setleis syndrome eventually to be regarded as a
  continuum (PMID:27196381). If a future entry lumps AMS and BSS as a single
  TWIST2 Glu75 disorder, the residue-level genotype-phenotype correlation is
  what should be carried as subtypes. The paralogous TWIST1 Glu117 disorder,
  Sweeney-Cox syndrome, has its own entry (Sweeney-Cox_Syndrome).

  The synonym list omits "BSS" and "Bss". In the curation queue these had been
  attached to Brown-Sequard syndrome, an unrelated spinal cord hemisection
  lesion, and the abbreviation is ambiguous with it.

  Name collision: Say-Barber-Biesecker-Young-Simpson syndrome (entry
  Say-Barber-Biesecker-Young-Simpson_Syndrome) shares two eponyms with this
  disease but is unrelated: it is caused by KAT6B truncating variants and is a
  blepharophimosis and intellectual disability syndrome. It is not listed as a
  differential diagnosis because the defining features differ (narrow,
  ptotic palpebral fissures and severe developmental delay there; macrostomia,
  ectropion and hypertrichosis with usually normal cognition here), though
  non-specific features such as cleft palate, hearing loss and cryptorchidism
  occur in both. The note is here so that literature or database records for
  one are not attached to the other.

  The MONDO:0008853 textual definition (sourced to Orphanet:1231) says
  "microstomia". The current Orphanet definition in ORPHA:1231 and every
  clinical report cited here describe macrostomia, so the MONDO wording appears
  to be an error in the imported definition; macrostomia is curated.

  No GeneReviews chapter exists for this disease (just check-genereviews
  --online, Bookshelf index snapshot 2026-09-10: NO_CHAPTER). The ClinGen
  gene-disease validity download (search.clinicalgenome.org, retrieved
  2026-09-23) has no TWIST2 row, so there is no CGGV assertion to cite.
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Heterozygous TWIST2 variants cause the disorder. Most probands carry a de
    novo variant. Vertical transmission is documented mother-to-son and
    father-to-daughter, and in the gene-discovery series three transmitting
    fathers with milder features were somatic mosaics for the variant their
    children carried. A clinically unaffected or mildly affected parent can
    therefore carry the variant in mosaic form, which is why parental testing
    is recommended.
  evidence:
  - reference: PMID:10440829
    reference_title: Autosomal dominant inheritance of Barber-Say syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report on a mother-to-son transmission of the Barber-Say syndrome, a
      finding that strongly supports dominant inheritance of this rare
      disorder.
    explanation: Documents vertical transmission supporting dominant inheritance.
  - reference: PMID:20799330
    reference_title: Barber-Say syndrome in a father and daughter.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report on a father to daughter transmission of Barber-Say syndrome
      (BSS)
    explanation: A second vertically transmitting family.
  - reference: PMID:26119818
    reference_title: Recurrent Mutations in the Basic Domain of TWIST2 Cause Ablepharon Macrostomia and Barber-Say Syndromes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In all instances in which DNA was available from both unaffected parents,
      the TWIST2 mutation occurred de novo in the first generation of
      individuals affected with AMS or BSS and was heritable in the third
      generation.
    explanation: >-
      Establishes de novo origin in simplex families and subsequent
      transmission.
  - reference: PMID:26119818
    reference_title: Recurrent Mutations in the Basic Domain of TWIST2 Cause Ablepharon Macrostomia and Barber-Say Syndromes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Three disease-transmitting fathers with mild AMS or BSS and variable skin
      pigmentation were mosaic for a TWIST2 mutation
    explanation: >-
      Parental somatic mosaicism with a milder phenotype, the basis for
      recommending parental testing.

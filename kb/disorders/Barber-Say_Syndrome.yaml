- name: TWIST2
  gene_term:
    preferred_term: TWIST2
    term:
      id: hgnc:20670
      label: TWIST2
  association: CAUSATIVE
  features: >-
    Heterozygous basic-domain variants include p.Glu75Gln (NM_057179.2:c.223G>C; nine individuals), p.Glu75Ala
    (c.224A>C; two individuals), and p.Gln77_Arg78dup (c.229_234dupCAGCGC; one individual) in the 12-person,
    10-family discovery series. De novo, inherited and mosaic presentations are documented. The father of the
    2017 p.Glu75Gln infant was not tested, so that patient's variant origin was unresolved. A later proband
    had tissue-dependent postzygotic mosaicism with the variant detected in blood and hamartoma tissue but
    not saliva.
  evidence:
  - reference: PMID:26119818
    reference_title: Recurrent Mutations in the Basic Domain of TWIST2 Cause Ablepharon Macrostomia and Barber-Say Syndromes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      nine had a c.223G>C (p.Glu75Gln) mutation (GenBank: NM_057179.2) and two
      had c.224A>C (p.Glu75Ala) mutations
    explanation: Allele counts in the Glu75 BSS individuals of the discovery series.
  - reference: PMID:28680619
    reference_title: 'Barber-say syndrome: a confirmed case of TWIST2 gene mutation.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'TWIST2 sequencing showed a pathogenic mutation: c.223G>C (p.Glu75Gln).'
    explanation: Independent confirmation of the recurrent allele in a later case.
  - reference: PMID:37817291
    reference_title: Multiple rhabdomyomatous mesenchymal hamartomas in a patient with mosaic Barber-Say syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Therefore, we consider this variant as de novo mosaicism.
    explanation: De novo mosaic TWIST2 variant in a proband.
  notes: >-
    PMID:27092433 is a further familial report. Repeat reference fetches during this review retrieved no quotable
    abstract or full text; it is retained as a lead, not affirmative evidence.
  variants:

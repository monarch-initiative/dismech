    explanation: The authors' summary of the ChIP-seq result.
  downstream:
  - target: Dysregulated TWIST2-Dependent Mesenchymal Transcription
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - twist2_glu75_dominant_negative
    - twist2_glu75_neomorphic_binding
    description: >-

      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: >-
        The dominant nature of the mutations, then, could be explained by the
        abnormal 50% of TWIST2 homodimers and bHLH heterodimers that either
        reduced binding to the normal contingent of DNA binding sites or
        conferred a neomorphic function by binding to other sites.
      explanation: >-

name: Barber-Say Syndrome
creation_date: "2026-09-23T00:00:00Z"
category: Mendelian
synonyms:
- Barber Say syndrome
- BBRSAY
- hypertrichosis-atrophic skin-ectropion-macrostomia syndrome
- hypertrichosis, atrophic skin, ectropion, and macrostomia
description: >-
  Barber-Say syndrome is a congenital ectodermal dysplasia with multiple
  malformations, recognisable at birth by generalized hypertrichosis, thin,
  wrinkled and redundant skin, ectropion with underdevelopment of the anterior
  lamella of the eyelids, macrostomia, a bulbous nose, first-degree microtia and
  hypoplastic nipples. Cognition and motor development are usually normal. The
  principal early morbidity is ocular: the everted, underdeveloped eyelids leave
  the cornea exposed from the neonatal period, so eye lubrication, tarsorrhaphy
  and eyelid reconstruction with skin grafting are needed in infancy.

  It is autosomal dominant and caused by heterozygous substitutions at a single
  residue, Glu75, in the basic DNA-binding domain of the bHLH transcription
  factor TWIST2 - p.Glu75Gln in most families and p.Glu75Ala in the rest, with
  one in-frame duplication two codons away (p.Gln77_Arg78dup). Most cases are de
  novo; parent-to-child transmission is documented, including from mildly
  affected fathers who were mosaic for the variant. The same residue substituted
  by lysine (p.Glu75Lys) causes the allelic ablepharon-macrostomia syndrome,
  and biallelic loss-of-function TWIST2 alleles cause Setleis syndrome (focal
  facial dermal dysplasia type III).

  In HeLa cells the Glu75 substitutions reduce binding of TWIST2 at its normal
  E-box sites and create binding at sites the wild-type protein does not
  occupy. Whether the disease results chiefly from interference with the
  wild-type protein (a dominant-negative effect) or from new target binding (a
  neomorphic effect) is unresolved; the two primary papers weight the
  possibilities differently, and both are recorded under
  mechanistic_hypotheses.

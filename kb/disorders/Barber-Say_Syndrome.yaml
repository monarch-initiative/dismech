notes: >-
  Lump/split. Barber-Say syndrome is curated as its own Disease entry, with ablepharon-macrostomia syndrome
  (AMS, MONDO:0008693) as an allelic differential rather than a subtype. The reasons are that MONDO, OMIM (209885
  versus 200110) and Orphanet keep the two separate, and that the molecular split is clean at the residue level:
  in the gene-discovery series every AMS family carried p.Glu75Lys and every BSS family carried p.Glu75Gln,
  p.Glu75Ala or p.Gln77_Arg78dup, with no allele shared between the two phenotypes (PMID:26119818). The opposing
  view is documented: a 2009 case report of microblepharon in BSS argued the two could be one disorder (PMID:19760652),
  and a 2016 critical review of all published patients expected BSS, AMS and Setleis syndrome eventually to
  be regarded as a continuum (PMID:27196381). If a future entry lumps AMS and BSS as a single TWIST2 Glu75
  disorder, the residue-level genotype-phenotype correlation is what should be carried as subtypes. The paralogous
  TWIST1 Glu117 disorder, Sweeney-Cox syndrome, has its own entry (Sweeney-Cox_Syndrome). The synonym list
  omits "BSS" and "Bss". In the curation queue these had been attached to Brown-Sequard syndrome, an unrelated
  spinal cord hemisection lesion, and the abbreviation is ambiguous with it. Name collision: Say-Barber-Biesecker-Young-Simpson
  syndrome (entry Say-Barber-Biesecker-Young-Simpson_Syndrome) shares two eponyms with this disease but is
  unrelated: it is caused by KAT6B truncating variants and is a blepharophimosis and intellectual disability
  syndrome. It is not listed as a differential diagnosis because the defining features differ (narrow, ptotic
  palpebral fissures and severe developmental delay there; macrostomia, ectropion and hypertrichosis with usually
  normal cognition here), though non-specific features such as cleft palate, hearing loss and cryptorchidism
  occur in both. The note is here so that literature or database records for one are not attached to the other.
  The MONDO:0008853 textual definition (sourced to Orphanet:1231) says "microstomia". The current Orphanet
  definition in ORPHA:1231 and every clinical report cited here describe macrostomia, so the MONDO wording
  appears to be an error in the imported definition; macrostomia is curated. No GeneReviews chapter exists
  for this disease (just check-genereviews --online, Bookshelf index snapshot 2026-09-10: NO_CHAPTER). The
  ClinGen gene-disease validity download (search.clinicalgenome.org, retrieved 2026-09-23) has no TWIST2 row,
  so there is no CGGV assertion to cite. Source reassessment: the 2016 critical review (PMID:27196381; full
  text cached under its Amsterdam UMC PDF URL) excluded Suga 2014 (PMID:25614816) as likely another disorder
  after negative TWIST2 testing, and excluded Ng and Rajguru 2006 (PMID:16714944) and the son in Dinulos and
  Pagon 1999 (PMID:10440829) for diagnostic uncertainty. The anesthesia report PMID:29497666 identifies its
  patient as the same first Japanese case reported by Suga; its anesthesia observations therefore are not used
  here to establish Barber-Say-specific risks. The mother's phenotype in PMID:10440829 remains usable. PMID:34092176
  describes mosaic AMS, so it is not primary Barber-Say patient evidence. The Oxford PDF is the full text corresponding
  to PMID:28369379, and the Amsterdam UMC PDF corresponds to PMID:27196381.
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Heterozygous TWIST2 basic-domain variants cause autosomal dominant disease. De novo origin was demonstrated
    when both unaffected parents were available in the discovery study. Father-to-daughter transmission is
    documented, including BSS-4.1, a mildly affected mosaic father of two affected daughters. The reported
    three transmitting mosaic parents in the discovery paper refer to the combined AMS/BSS series, not three
    Barber-Say fathers. A 1999 mother-to-son report was subsequently reassessed: the mother remained a convincing
    case, but the son's diagnosis was insufficiently documented. Parental testing informs recurrence counseling;
    mild parental features and tissue-dependent mosaicism complicate interpretation.
  evidence:
  - reference: PMID:10440829
    reference_title: Autosomal dominant inheritance of Barber-Say syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report on a mother-to-son transmission of the Barber-Say syndrome, a
      finding that strongly supports dominant inheritance of this rare
      disorder.
    explanation: >-
      Historical report of proposed mother-to-son transmission. The 2016 critical review accepted the mother
      but excluded the son from its confirmed series because available data were insufficient; this report
      alone does not establish the son as an affected case.
  - reference: PMID:20799330
    reference_title: Barber-Say syndrome in a father and daughter.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report on a father to daughter transmission of Barber-Say syndrome
      (BSS)
    explanation: A second vertically transmitting family.
  - reference: PMID:26119818
    reference_title: Recurrent Mutations in the Basic Domain of TWIST2 Cause Ablepharon Macrostomia and Barber-Say Syndromes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In all instances in which DNA was available from both unaffected parents,
      the TWIST2 mutation occurred de novo in the first generation of
      individuals affected with AMS or BSS and was heritable in the third
      generation.
    explanation: >-
      Establishes de novo origin in simplex families and subsequent
      transmission.
  - reference: PMID:26119818
    reference_title: Recurrent Mutations in the Basic Domain of TWIST2 Cause Ablepharon Macrostomia and Barber-Say Syndromes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Three disease-transmitting fathers with mild AMS or BSS and variable skin
      pigmentation were mosaic for a TWIST2 mutation
    explanation: >-
      Mosaic transmission in the combined AMS/BSS series. Table 1 identifies BSS-4.1 and his two daughters;
      the count of three is not a Barber-Say-specific count.
  - reference: url:https://pure.amsterdamumc.nl/ws/files/159999289/Barber-say-syndrome-and-ablepharon-macrostomia-syndrome-an-overview.pdf
    reference_title: https://pure.amsterdamumc.nl/ws/files/159999289/Barber-say-syndrome-and-ablepharon-macrostomia-syndrome-an-overview.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The description and pictures of patient 1 are ﬁtting well the diagnosis BSS but data on the child were
      insufﬁcient to allow for a diagnosis
    explanation: >-
      The critical review retained the mother and excluded the incompletely documented son from Dinulos and
      Pagon 1999.
    quote_role: REVIEW_SYNTHESIS

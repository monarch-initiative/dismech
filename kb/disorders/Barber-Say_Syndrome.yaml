mechanistic_hypotheses:
- hypothesis_group_id: twist2_glu75_dominant_negative
  hypothesis_label: Glu75 substitutions interfere with the wild-type TWIST2 pool
  status: EMERGING
  description: >-
    Under this model the mutant subunit still enters TWIST2 homodimers and
    bHLH heterodimers but those complexes fail to bind the normal E-box
    targets, so the wild-type protein is inactivated along with it. Support
    comes from the ChIP-seq loss of wild-type peaks, from the C. elegans hlh-8
    allelic series, which favours a predominantly dominant-negative mechanism
    for the TWIST1/TWIST2 residue substitutions, and from phenotypic overlap
    with Setleis syndrome, which is caused by biallelic loss of TWIST2
    function. Not mutually exclusive with the neomorphic model.
  evidence:
  - reference: PMID:28369379
    reference_title: Localized TWIST1 and TWIST2 basic domain substitutions cause four distinct human diseases that can be modeled in Caenorhabditis elegans.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The genetic analysis favors a predominantly dominant-negative mechanism
      for the action of amino acid substitutions at this highly conserved
      glutamic acid residue
    explanation: >-
      Conclusion of the C. elegans allelic series, which included the TWIST2
      Glu75 alleles engineered at the equivalent hlh-8 residue.
  - reference: PMID:26119818
    reference_title: Recurrent Mutations in the Basic Domain of TWIST2 Cause Ablepharon Macrostomia and Barber-Say Syndromes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Supporting a contribution by the first mechanism is the phenotypic
      overlap with Setleis syndrome
    explanation: >-
      The primary paper's argument for the dominant-negative model from
      phenotypic overlap with the recessive loss-of-function allelic disorder.
  - reference: PMID:30450715
    reference_title: Ablepharon and craniosynostosis in a patient with a localized TWIST1 basic domain substitution.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Heterozygous localized TWIST1 and TWIST2 basic domain substitutions exert
      antimorphic effects to cause Sweeney-Cox syndrome, Barber-Say syndrome,
      and ablepharon-macrostomia syndrome, respectively.
    explanation: >-
      A later TWIST1 case report restates the Glu75 alleles as antimorphic,
      summarising the earlier functional work rather than adding new data.
  - reference: url:https://ora.ox.ac.uk/objects/uuid%3A0b9cf8b9-01b4-43b7-95b4-b9c68ea74406/files/mf135269e0a132704a438813780ba4af6
    reference_title: https://ora.ox.ac.uk/objects/uuid%3A0b9cf8b9-01b4-43b7-95b4-b9c68ea74406/files/mf135269e0a132704a438813780ba4af6
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In examining egl-15::gfp expression in heterozygotes, the fs2728/+ animals resembled the WT population
    explanation: >-
      The frameshift-null heterozygous control helps distinguish the missense effect from simple loss of one
      functional copy.
- hypothesis_group_id: twist2_glu75_neomorphic_binding
  hypothesis_label: Glu75 substitutions give TWIST2 new genomic targets
  status: EMERGING
  description: >-
    Under this model the disease-relevant effect is the binding of mutant
    TWIST2 to sites the wild-type protein does not occupy, changing expression
    of genes TWIST2 does not normally regulate. The observation behind it is
    the large set of mutant-only ChIP-seq peaks. It would also offer an
    explanation for why lysine at the same residue (AMS) and glutamine or
    alanine (BSS) give different syndromes, but no study has tested that
    target-set difference in a relevant tissue.
  evidence:
  - reference: PMID:26119818
    reference_title: Recurrent Mutations in the Basic Domain of TWIST2 Cause Ablepharon Macrostomia and Barber-Say Syndromes.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      two possible mechanisms: a dominant-negative effect due to loss of
      binding to the normal contingent of TWIST2 DNA binding sites or a
      neomorphic mechanism due to binding of the mutant TWIST2 to extraneous
      promoter sites
    explanation: >-
      The primary functional study states the neomorphic mechanism as an
      alternative to the dominant-negative one.
  - reference: PMID:26119818
    reference_title: Recurrent Mutations in the Basic Domain of TWIST2 Cause Ablepharon Macrostomia and Barber-Say Syndromes.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      A significant number of binding peaks detected for the mutant TWIST2
      proteins were not detected for the wild-type protein
    explanation: The mutant-only binding peaks the neomorphic model rests on.

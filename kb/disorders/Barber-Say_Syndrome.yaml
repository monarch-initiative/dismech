      mesenchyme, so which peaks are relevant in patient tissue is unknown.
    evidence:
    - reference: PMID:26119818
      reference_title: Recurrent Mutations in the Basic Domain of TWIST2 Cause Ablepharon Macrostomia and Barber-Say Syndromes.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        All identified mutations fell in the basic domain of TWIST2 and altered
        the DNA-binding pattern of Flag-TWIST2 in HeLa cells.
      explanation: The measurement this model provides.
discussions:
- discussion_id: bss_hypertrichosis_mechanism_gap
  prompt: >-
    How do the Glu75Gln and Glu75Ala substitutions produce generalized
    hypertrichosis, when Glu75Lys at the same residue gives sparse scalp hair?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - phenotypes#Congenital Generalized Hypertrichosis
  - mechanistic_hypotheses#twist2_glu75_neomorphic_binding
  rationale: >-
    The opposing hair distributions in Barber-Say and ablepharon-macrostomia syndromes remain unexplained by
    the cited functional studies. Clinical skin biopsies have examined follicles, but the studies do not establish
    how these alleles alter the signaling that controls hair growth. HeLa binding differences suggest a testable
    hypothesis, not a demonstrated follicular mechanism.
  evidence:
  - reference: PMID:27196381
    reference_title: 'Barber-Say syndrome and Ablepharon-Macrostomia syndrome: An overview.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Scalp hair is sparse in AMS only, but sparse eyebrows and eyelashes occur
      in both entities, and general hypertrichosis occurs in BSS.
    explanation: The opposite hair phenotypes of the two allelic syndromes.
- discussion_id: bss_model_fidelity_gap
  prompt: >-
    Would a heterozygous Twist2 Glu75Gln knock-in mouse reproduce the eyelid,
    skin and hair phenotype, and which mesenchymal targets would it show to be
    lost or newly bound?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - animal_models#Zebrafish
  - pathophysiology#Altered TWIST2 Genomic DNA-Binding Pattern
  rationale: >-
    The cited Barber-Say functional studies use human TWIST2 overexpression in zebrafish or HeLa cells, or
    conserved-residue substitutions in C. elegans. The worm study does include endogenous heterozygotes with
    a wild-type allele, unlike the overexpression assays, but cannot reproduce mammalian skin, hair and eyelid
    anatomy. The cited studies do not include a Barber-Say knock-in mammalian model or identify the patient-tissue
    targets responsible for each manifestation.
  evidence:
  - reference: PMID:26119818
    reference_title: Recurrent Mutations in the Basic Domain of TWIST2 Cause Ablepharon Macrostomia and Barber-Say Syndromes.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Simple overexpression of the wild-type protein in zebrafish caused a
      mild developmental phenotype.
    explanation: >-
      Shows that the zebrafish system responds to TWIST2 dose itself, limiting
      what it can say about the heterozygous allele.

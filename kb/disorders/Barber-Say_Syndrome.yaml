name: Barber-Say Syndrome
creation_date: '2026-09-23T00:00:00Z'
category: Mendelian
synonyms:
- Barber Say syndrome
- BBRSAY
- hypertrichosis-atrophic skin-ectropion-macrostomia syndrome
- hypertrichosis, atrophic skin, ectropion, and macrostomia
description: >-
  Barber-Say syndrome is a congenital ectodermal dysplasia characterized by generalized hypertrichosis, thin,
  wrinkled and redundant skin, ectropion with eyelid anterior lamellar underdevelopment, macrostomia, a bulbous
  nose, ear anomalies and hypoplastic nipples. Cognition and motor development are usually normal, although
  developmental difficulties have been reported. Incomplete eyelid closure can expose the cornea from birth;
  lubrication and, when exposure is severe, early eyelid surgery are important components of care. Heterozygous
  TWIST2 basic-domain variants cause autosomal dominant disease: p.Glu75Gln and p.Glu75Ala substitutions and
  an in-frame p.Gln77_Arg78dup duplication were identified in the discovery series. De novo, inherited and
  mosaic variants have been documented. The allelic p.Glu75Lys substitution causes ablepharon-macrostomia syndrome,
  while biallelic loss-of-function variants cause TWIST2-related Setleis syndrome. Mutant TWIST2 shows altered
  genomic binding in HeLa cells. Worm genetics favor a dominant-negative mechanism, while mutant-only binding
  sites also support a possible neomorphic contribution; their relative contributions in affected human tissues
  remain unresolved.

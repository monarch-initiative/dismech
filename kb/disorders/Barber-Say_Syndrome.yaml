  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  description: >-
    Underdevelopment of the anterior lamella of the eyelid is a defining
    ophthalmic finding across the TWIST2 Glu75 disorders. In Barber-Say
    syndrome it presents mainly as ectropion, and less often as
    microblepharon; the severe end, ablepharon, characterises the allelic
    ablepharon-macrostomia syndrome. Surgical exploration in one patient found
    abnormal external and internal eyelid anatomy.


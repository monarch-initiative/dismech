discussions:
- discussion_id: bss_hypertrichosis_mechanism_gap
  prompt: >-
    How do the Glu75Gln and Glu75Ala substitutions produce generalized
    hypertrichosis, when Glu75Lys at the same residue gives sparse scalp hair?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - phenotypes#Congenital Generalized Hypertrichosis
  - mechanistic_hypotheses#twist2_glu75_neomorphic_binding
  rationale: >-
    Hypertrichosis is the clinical feature that separates Barber-Say from
    ablepharon-macrostomia syndrome, yet no study among the references cited
    here has examined hair follicles or follicular mesenchyme in either. The
    hypertrichosis phenotype is therefore left without an upstream mechanism
    node in this entry. A residue-specific difference in off-target binding
    would be one explanation, but the ChIP-seq was done in HeLa cells.
  evidence:
  - reference: PMID:27196381
    reference_title: "Barber-Say syndrome and Ablepharon-Macrostomia syndrome: An overview."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Scalp hair is sparse in AMS only, but sparse eyebrows and eyelashes occur
      in both entities, and general hypertrichosis occurs in BSS.
    explanation: The opposite hair phenotypes of the two allelic syndromes.
- discussion_id: bss_model_fidelity_gap
  prompt: >-
    Would a heterozygous Twist2 Glu75Gln knock-in mouse reproduce the eyelid,
    skin and hair phenotype, and which mesenchymal targets would it show to be
    lost or newly bound?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - animal_models#Zebrafish
  - pathophysiology#Altered TWIST2 Genomic DNA-Binding Pattern
  rationale: >-
    Every functional result for a Barber-Say allele comes from overexpression
    or from a distant organism: human mRNA injected into zebrafish, tagged
    protein in HeLa cells, and engineered alleles in the single C. elegans
    Twist homolog. None has eyelids, hair or mammalian dermis, and none
    expresses the mutant beside a wild-type allele at physiological dose.
    Whether the mechanism is dominant-negative, neomorphic or both cannot be
    settled until the allele is studied in mammalian mesenchyme. No knock-in
    model was found among the references cited here.
  evidence:
  - reference: PMID:26119818
    reference_title: Recurrent Mutations in the Basic Domain of TWIST2 Cause Ablepharon Macrostomia and Barber-Say Syndromes.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Simple overexpression of the wild-type protein in zebrafish caused a
      mild developmental phenotype.
    explanation: >-
      Shows that the zebrafish system responds to TWIST2 dose itself, limiting
      what it can say about the heterozygous allele.

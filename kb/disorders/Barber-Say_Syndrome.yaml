- name: Altered TWIST2 Genomic DNA-Binding Pattern
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    In ChIP-seq of HeLa cells overexpressing tagged TWIST2, wild-type protein
    bound 630 sites with a canonical E-box consensus. Each mutant shared only a
    fraction of those peaks, and the two BSS alleles tested beside it
    (p.Glu75Ala and p.Gln77_Arg78dup) shared only 25; all mutants also bound
    many sites the wild-type protein did not. The lesion is therefore both a
    loss of normal target occupancy and a gain of new occupancy.

    PROVISIONAL because this is overexpression in a non-mesenchymal cancer cell
    line. Binding in craniofacial or dermal mesenchyme, at endogenous
    expression, with the wild-type allele present, has not been measured.
  molecular_functions:
  - preferred_term: E-box binding
    term:
      id: GO:0070888
      label: E-box binding
    modifier: DECREASED
  - preferred_term: DNA-binding transcription factor activity

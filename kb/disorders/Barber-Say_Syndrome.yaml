- name: Abnormal Dermal Elastic and Collagen Fibers
  description: >-
    Electron microscopy in molecularly confirmed BSS-3.1 showed thin elongated elastic fibers, abnormal collagen
    orientation, microfibrillar proliferation and amorphous deposits. Reduced elastic fibers were recorded
    separately in BSS-5.1. Findings vary among patients and are not established as diagnostic.
  diagnostic: false

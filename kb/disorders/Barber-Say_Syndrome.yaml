diagnosis:
- name: TWIST2 Sequencing With Parental Testing
  description: >-
    The characteristic congenital phenotype prompts TWIST2 sequencing. Interpretation must distinguish disease-associated
    basic-domain alleles from variants of uncertain significance and from alleles associated with other TWIST2
    disorders. Testing both parents can establish inheritance or support de novo origin; testing a single tissue
    may miss mosaicism.
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:28680619
    reference_title: 'Barber-say syndrome: a confirmed case of TWIST2 gene mutation.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genetic testing is recommended in patients presenting with these
      phenotypic abnormalities, along with their parents, to establish de novo
      or inherited mutations.
    explanation: Recommends proband and parental TWIST2 testing.
  - reference: PMID:28680619
    reference_title: 'Barber-say syndrome: a confirmed case of TWIST2 gene mutation.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Paternal testing would have helped to clarify whether this finding is
      paternally inherited or de novo. Additionally, it would clarify recurrence
      risks for the patient's family.
    explanation: Parental testing informs recurrence risk.
- name: Assessment for Tissue-Dependent TWIST2 Mosaicism
  description: >-
    A negative result from one sampled tissue may not exclude mosaicism when the phenotype is suggestive. In
    one child, sequencing detected the variant in blood and rhabdomyomatous mesenchymal hamartoma tissue but
    not saliva or parental samples. This observation supports considering specimen choice and assay sensitivity
    in an individualized genetics assessment; it is not a validated universal testing algorithm.
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:37817291
    reference_title: Multiple rhabdomyomatous mesenchymal hamartomas in a patient with mosaic Barber-Say syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Next-generation sequencing, performed in DNA from a blood sample, and RMH tissue, revealed a pathogenic
      variant in the TWIST2 gene, which was not detected in a salivary sample of the patient, nor in his parents.
    explanation: >-
      Direct evidence of tissue-dependent detection in one mosaic proband.
differential_diagnoses:
- name: Ablepharon-macrostomia syndrome
  description: >-
    Allelic TWIST2 disorder caused by p.Glu75Lys at the same residue. Shares macrostomia, eyelid underdevelopment,
    cheek pads, ear, nipple and genital anomalies; distinguished by absent or severely hypoplastic eyelids
    (ablepharon) and sparse scalp hair, whereas Barber-Say syndrome has generalized hypertrichosis and mostly
    ectropion. The known alleles and the clinical phenotype support the distinction; an uncharacterized TWIST2
    variant alone does not settle it.
  disease_term:
    preferred_term: ablepharon macrostomia syndrome
    term:
      id: MONDO:0008693
      label: ablepharon macrostomia syndrome
  evidence:
  - reference: PMID:26119818
    reference_title: Recurrent Mutations in the Basic Domain of TWIST2 Cause Ablepharon Macrostomia and Barber-Say Syndromes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a lysine at TWIST2 residue 75 resulted in AMS, whereas a glutamine or
      alanine yielded BSS
    explanation: The molecular discriminator between the two syndromes.
  - reference: PMID:27196381
    reference_title: 'Barber-Say syndrome and Ablepharon-Macrostomia syndrome: An overview.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Scalp hair is sparse in AMS only, but sparse eyebrows and eyelashes occur
      in both entities, and general hypertrichosis occurs in BSS.
    explanation: The hair phenotype that separates the two clinically.
  - reference: PMID:19760652
    reference_title: Case report supporting that the Barber-Say and ablepharon macrostomia syndromes could represent one disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Other authors have discussed that BSS and AMS could possibly represent one
      syndrome, and our report supports this hypothesis.
    explanation: The lumping argument, recorded because it bears on the split.
- name: Setleis syndrome (focal facial dermal dysplasia type III)
  description: >-
    TWIST2-related Setleis syndrome is recessive and associated with biallelic loss-of-function alleles, bitemporal
    scar-like lesions and eyelash/eyebrow abnormalities. Temporal lesions can also occur in Barber-Say syndrome,
    so they are not an absolute discriminator. Genotype, inheritance and the full clinical pattern must be
    considered together; Setleis-like phenotypes are genetically heterogeneous.
  disease_term:
    preferred_term: Setleis syndrome
    term:
      id: MONDO:0009203
      label: focal facial dermal dysplasia type III
  evidence:
  - reference: PMID:20691403
    reference_title: Homozygous nonsense mutations in TWIST2 cause Setleis syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Homozygous TWIST2 nonsense mutations, c.324C>T and c.486C>T, were
      identified in the affected members of the Arab and PR families,
      respectively.
    explanation: Biallelic TWIST2 truncation as the cause of Setleis syndrome.
  - reference: PMID:28663233
    reference_title: 'The focal facial dermal dysplasias: phenotypic spectrum and molecular genetic heterogeneity.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      the overlapping facial abnormalities in FFDD3 and two other genetic
      disorders, Ablepharon macrostomia syndrome and Barber-Say syndrome, are
      noted
    explanation: Review noting facial overlap between Setleis syndrome and BSS.

pathophysiology:
- name: TWIST2 Glu75 Basic-Domain Substitution
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    A heterozygous substitution of the conserved glutamic acid at codon 75 of
    TWIST2, in the basic region of the bHLH domain that contacts DNA.
    Glutamine (p.Glu75Gln) is the recurrent Barber-Say allele and alanine
    (p.Glu75Ala) the second; one proband carried an in-frame duplication of
    codons 77-78 (p.Gln77_Arg78dup) in the same domain. Lysine at the same
    residue (p.Glu75Lys) gives ablepharon-macrostomia syndrome instead, so the
    substituting amino acid, not only the position, sets the phenotype.
    In silico modelling places Glu75 facing the DNA major groove next to the
    first two nucleotides of the E-box, and predicts no change in global
    protein structure.

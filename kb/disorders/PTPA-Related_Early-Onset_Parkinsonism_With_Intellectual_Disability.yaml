differential_diagnoses:
- name: PRKN and PINK1 Early-Onset Parkinson Disease
  description: >-
    The common recessive early-onset parkinsonisms; they act through
    mitochondrial quality control rather than PP2A phosphatase regulation and
    are not accompanied by intellectual disability.
- name: Other Atypical Recessive Early-Onset Parkinsonisms (SYNJ1, FBXO7, VPS13C)
  description: >-
    Atypical recessive early-onset parkinsonisms with additional neurological
    features, acting through presynaptic endocytosis (SYNJ1), the proteasome
    (FBXO7) or ER-lysosome lipid transfer / mitophagy (VPS13C) rather than PP2A.

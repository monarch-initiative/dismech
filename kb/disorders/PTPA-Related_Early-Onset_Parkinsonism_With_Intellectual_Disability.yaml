    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The motor symptoms were responsive to treatment with levodopa and deep brain stimulation of the subthalamic nucleus."
    explanation: Documents the levodopa responsiveness of the PTPA parkinsonism.
  - reference: PMID:36073231
    reference_title: PTPA variants and impaired PP2A activity in early-onset parkinsonism with intellectual disability.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "early development of severe, disabling levodopa-induced dyskinesias"
    explanation: Documents the severe levodopa-induced dyskinesias complicating levodopa therapy.

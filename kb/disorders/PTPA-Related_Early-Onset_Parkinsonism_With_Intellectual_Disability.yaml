diagnosis:
- name: Molecular genetic diagnosis
  notes: >-
    Diagnosis rests on juvenile/early-onset akinetic-rigid parkinsonism with
    intellectual disability plus biallelic PTPA (PPP2R4) missense variants on
    molecular genetic testing (exome/genome sequencing or a parkinsonism gene
    panel).
  evidence:
  - reference: PMID:36073231
    reference_title: PTPA variants and impaired PP2A activity in early-onset parkinsonism with intellectual disability.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We first identified a homozygous PTPA variant, c.893T>G (p.Met298Arg), in patients from a South African family with early-onset parkinsonism and intellectual disability."
    explanation: The biallelic PTPA genotype on which the molecular diagnosis rests.
genetic:
- name: PTPA
  gene_term:
    preferred_term: PTPA
    term:
      id: hgnc:9308
      label: PTPA
  association: Causative
  relationship_type: CAUSATIVE
  inheritance:
  - name: Autosomal recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
    evidence:
    - reference: PMID:37046398
      reference_title: "Cross-Ethnic Variant Screening and Burden Analysis of PTPA in Parkinson's Disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "One patient with early-onset PD from a consanguineous family carried the homozygous variant p.Met329Val, while her parents and elder sister with heterozygous p.Met329Val were healthy."
      explanation: Homozygous proband with unaffected heterozygous relatives establishes recessive inheritance.
  notes: >-
    PTPA (previous symbol PPP2R4) encodes a major activator of protein
    phosphatase 2A. Biallelic missense variants were reported in a South African
    and a Libyan family with early-onset parkinsonism and intellectual
    disability, and a third consanguineous family was identified by independent
    cross-ethnic screening. The ClinGen Gene-Disease Validity table lists no
    PTPA-Parkinson disease assertion, so the gene-disease relationship here rests
    on the primary literature; no gene_disease_validity row is recorded.
  evidence:
  - reference: PMID:36073231
    reference_title: PTPA variants and impaired PP2A activity in early-onset parkinsonism with intellectual disability.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We conclude that bi-allelic missense PTPA variants associated with impaired activation of the PP2A phosphatase cause autosomal recessive early-onset parkinsonism with intellectual disability."
    explanation: Original identification of PTPA as the PARK25 gene.
  variants:
  - name: p.Met298Arg
    description: >-
      Homozygous missense variant (c.893T>G) in the South African index family;
      destabilises PTPA and reduces PP2A activation.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:36073231
      reference_title: PTPA variants and impaired PP2A activity in early-onset parkinsonism with intellectual disability.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We first identified a homozygous PTPA variant, c.893T>G (p.Met298Arg), in patients from a South African family with early-onset parkinsonism and intellectual disability."
      explanation: Reports the homozygous Met298Arg genotype in the index family.
  - name: p.Ala171Asp
    description: >-
      Homozygous missense variant (c.512C>A) in a Libyan family with a similar
      phenotype; additionally decreases PTPA protein stability.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:36073231
      reference_title: PTPA variants and impaired PP2A activity in early-onset parkinsonism with intellectual disability.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "a second homozygous variant, c.512C>A (p.Ala171Asp), in a Libyan family"
      explanation: Reports the second homozygous genotype in an independent family.
  - name: p.Met329Val
    description: >-
      Homozygous missense variant identified by independent cross-ethnic
      screening in a consanguineous early-onset PD family, with unaffected
      heterozygous relatives.
    clinical_significance: LIKELY_PATHOGENIC
    evidence:
    - reference: PMID:37046398
      reference_title: "Cross-Ethnic Variant Screening and Burden Analysis of PTPA in Parkinson's Disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "One patient with early-onset PD from a consanguineous family carried the homozygous variant p.Met329Val, while her parents and elder sister with heterozygous p.Met329Val were healthy."
      explanation: Reports the replication genotype and its recessive segregation.
treatments:

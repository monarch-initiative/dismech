notes: >-
  No GeneReviews chapter covers PTPA-related early-onset parkinsonism with
  intellectual disability (PARK25); the clinical baseline is drawn from the
  discovery report (PMID:36073231) and the cross-ethnic replication
  (PMID:37046398).

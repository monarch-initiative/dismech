- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Inherited in an autosomal recessive manner; affected individuals carry
    biallelic (homozygous) missense PTPA variants that co-segregate with disease,
    and heterozygous relatives are unaffected.
  evidence:
  - reference: PMID:36073231
    reference_title: PTPA variants and impaired PP2A activity in early-onset parkinsonism with intellectual disability.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We conclude that bi-allelic missense PTPA variants associated with impaired activation of the PP2A phosphatase cause autosomal recessive early-onset parkinsonism with intellectual disability."
    explanation: States the recessive mode of inheritance directly.
pathophysiology:
- name: PP2A Phosphatase Activation Failure
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    The root lesion is biallelic missense variants in PTPA (the PP2A activator,
    previous symbol PPP2R4). The variants lower PTPA RNA and protein levels and,
    through that, the level of assembled PP2A complex, so the phosphatase is not
    activated normally. PP2A is the major serine/threonine phosphatase of the
    brain and regulates neurodegeneration-relevant proteins including
    alpha-synuclein, tau and LRRK2.
  genes:
  - preferred_term: PTPA
    term:
      id: hgnc:9308
      label: PTPA
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Biallelic (homozygous) missense PTPA variants that destabilise PTPA RNA
      and protein and reduce PP2A complex levels and activation.
  molecular_functions:
  - preferred_term: protein serine/threonine phosphatase activity
    term:
      id: GO:0004722
      label: protein serine/threonine phosphatase activity
    modifier: DECREASED
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:36073231
    reference_title: PTPA variants and impaired PP2A activity in early-onset parkinsonism with intellectual disability.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "expression of both variants was associated with decreased PP2A complex levels and impaired PP2A phosphatase activation"
    explanation: Directly states the decreased PP2A complex level and impaired phosphatase activation this node asserts.
  - reference: PMID:36073231
    reference_title: PTPA variants and impaired PP2A activity in early-onset parkinsonism with intellectual disability.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "the regulation of crucial proteins for neurodegeneration, such as alpha-synuclein, tau and LRRK2"
    explanation: Establishes that PP2A regulates neurodegeneration-relevant substrates, the reason its failure is pathogenic; restates established biology, hence OTHER/BACKGROUND.
  - reference: PMID:36073231
    reference_title: PTPA variants and impaired PP2A activity in early-onset parkinsonism with intellectual disability.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We conclude that bi-allelic missense PTPA variants associated with impaired activation of the PP2A phosphatase cause autosomal recessive early-onset parkinsonism with intellectual disability."
    explanation: Establishes biallelic PTPA loss of PP2A activation as the root cause of PARK25.
  downstream:
  - target: Striatal Dopamine Deficiency and Basal Ganglia Circuit Dysfunction
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Loss of PP2A activation in neurons, with the dopaminergic step inferred from a levodopa-reversible locomotor defect in a Drosophila ptpa knock-down and the patients' levodopa response.
    description: >-
      The dopaminergic step is an inference rather than a direct measurement: the
      only functional in vivo result is a levodopa-reversible climbing defect in
      a Drosophila ptpa knock-down, and the patients' motor symptoms responded to
      levodopa. No human nigrostriatal dopamine measurement is reported for PTPA
      carriers.
    evidence:
    - reference: PMID:36073231
      reference_title: PTPA variants and impaired PP2A activity in early-onset parkinsonism with intellectual disability.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: "PTPA orthologue knock-down in Drosophila neurons induced a significant impairment of locomotion in the climbing test. This defect was age-dependent and fully reversed by L-DOPA treatment."
      explanation: A levodopa-reversible motor defect on PTPA knock-down is the basis for placing this node upstream of striatal dopamine deficiency, and the reversal by L-DOPA is what makes the link dopaminergic.
  - target: Intellectual Disability
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Failure of PP2A, the major brain serine/threonine phosphatase, disrupts
      neurodevelopmental signalling and produces the intellectual disability that
      accompanies the parkinsonism; the co-occurrence is consistent across the
      reported families, though the specific neurodevelopmental mechanism is not
      dissected.
    evidence:
    - reference: PMID:36073231
      reference_title: PTPA variants and impaired PP2A activity in early-onset parkinsonism with intellectual disability.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: "The affected subjects display juvenile-onset parkinsonism and intellectual disability."
      explanation: The intellectual disability co-segregating with the PP2A defect in the reported families.

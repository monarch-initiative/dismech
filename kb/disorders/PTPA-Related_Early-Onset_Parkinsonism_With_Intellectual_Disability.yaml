name: PTPA-Related Early-Onset Parkinsonism with Intellectual Disability
creation_date: "2026-11-27T02:50:00Z"
category: Mendelian
description: >-
  PTPA-related early-onset parkinsonism with intellectual disability (PARK25) is
  an autosomal-recessive disorder caused by biallelic missense variants in PTPA
  (previous symbol PPP2R4), which encodes a major activator of protein
  phosphatase 2A (PP2A). The disease-associated variants destabilise PTPA RNA
  and protein, lowering the level of assembled PP2A and impairing its
  activation. PP2A is the major serine/threonine phosphatase of the brain and
  regulates proteins central to neurodegeneration (alpha-synuclein, tau, LRRK2),
  so its failure defines a distinct PP2A/phosphatase arm of early-onset
  parkinsonism, separate from the mitochondrial (PRKN/PINK1, VPS13C) and
  presynaptic-endocytic (SYNJ1/DNAJC6) arms. The phenotype is juvenile-onset,
  levodopa-responsive akinetic-rigid parkinsonism accompanied by intellectual
  disability; the motor syndrome responds to levodopa and to subthalamic deep
  brain stimulation.
parents:
- Movement Disorder
- Autosomal Recessive Early-Onset Parkinsonism
synonyms:
- PARK25
- Parkinson disease 25, autosomal recessive early-onset, with impaired intellectual development
- PTPA early-onset parkinsonism with intellectual disability
- PPP2R4-related early-onset parkinsonism

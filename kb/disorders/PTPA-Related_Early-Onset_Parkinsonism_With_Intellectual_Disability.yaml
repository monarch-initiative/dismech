  description: >-
    Dopaminergic replacement with levodopa, to which the parkinsonian motor
    features respond well; the response can be complicated by early, severe
    levodopa-induced dyskinesias.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:

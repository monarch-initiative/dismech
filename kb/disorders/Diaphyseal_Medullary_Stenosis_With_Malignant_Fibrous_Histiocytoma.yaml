notes: >-
  Named Entity Confusion warning for anyone extending this entry. MTAP is far
  better known as a somatic passenger deletion: it sits immediately adjacent to
  CDKN2A at 9p21 and is co-deleted in a large fraction of sporadic cancers, and
  MTAP-deleted tumours are an active therapeutic target through PRMT5. That
  literature is about homozygous somatic deletion of the whole locus in tumour
  cells and is not about this syndrome, whose lesion is a germline splicing
  mutation in a retroviral-derived terminal exon. A search on the gene symbol
  will return overwhelmingly the former. The one genuine connection is the
  9p21-22 loss of heterozygosity shared with sporadic bone malignant fibrous
  histiocytoma, which is curated here with its own evidence.

  Nomenclature. Malignant fibrous histiocytoma is the name used throughout the
  primary literature on this syndrome and is retained here for that reason. The
  entity was reclassified as undifferentiated pleomorphic sarcoma in later WHO
  classifications, and the description says so, but the disease name and the
  quoted snippets keep the historical term because that is what the sources say.
pathophysiology:
- name: MTAP Retroviral-Exon Splicing Mutation
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Mutations fall in the most proximal of three previously uncharacterised
    terminal exons of MTAP. Two of these exons derive from independent retroviral
    integrations into the primate genome at least forty million years ago, and
    have since taken on a function. The gene had been thought to be encoded by
    eight exons alone, which is why the locus resisted identification for more
    than a decade after linkage.
  gene:
    preferred_term: MTAP
    description: >-
      Encodes methylthioadenosine phosphorylase; germline mutation of a
      retroviral-derived terminal exon causes this syndrome.
    term:
      id: hgnc:7413
      label: MTAP
  genetic_context:
    gene:
      preferred_term: MTAP
      term:
        id: hgnc:7413
        label: MTAP
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: UNKNOWN
    description: >-
      Heterozygous germline mutation in a retroviral-derived terminal exon,
      acting dominantly through dysregulated splicing rather than by
      straightforward loss of enzyme activity. No source classifies the
      functional impact, and the category is left UNKNOWN rather than guessed.
  evidence:
  - reference: PMID:22464254
    reference_title: "Primate genome gain and loss: a bone dysplasia, muscular dystrophy, and bone cancer syndrome resulting from mutated retroviral-derived MTAP transcripts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We now demonstrate that DMS-MFH results from mutations in the most proximal
      of three previously uncharacterized terminal exons of the gene encoding
      methylthioadenosine phosphorylase, MTAP.
    explanation: Identifies the causal gene and the exon in which mutations fall.
  - reference: PMID:22464254
    reference_title: "Primate genome gain and loss: a bone dysplasia, muscular dystrophy, and bone cancer syndrome resulting from mutated retroviral-derived MTAP transcripts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      two of these MTAP exons arose from early and independent retroviral-integration
      events in primate genomes at least 40 million years ago, and since then,
      their genomic integration has gained a functional role
    explanation: >-
      Establishes the retroviral origin of the affected exons, which is why the
      gene's coding extent had been misjudged.
  - reference: PMID:22464254
    reference_title: "Primate genome gain and loss: a bone dysplasia, muscular dystrophy, and bone cancer syndrome resulting from mutated retroviral-derived MTAP transcripts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      one mutation was a synonymous change at position c.885A>G
    explanation: >-
      The most informative single fact about this lesion. A synonymous change
      alters no amino acid, so the pathogenic effect cannot be a change to the
      protein sequence and must act on the transcript, which is what makes the
      splicing mechanism the explanation rather than one candidate among
      several.
  downstream:
  - target: Dysregulated Alternative Splicing of MTAP Isoforms
    causal_link_type: DIRECT
    description: >-
      The mutation causes skipping of the affected exon, which propagates to the
      splicing of the whole isoform family.
    evidence:
    - reference: PMID:22464254
      reference_title: "Primate genome gain and loss: a bone dysplasia, muscular dystrophy, and bone cancer syndrome resulting from mutated retroviral-derived MTAP transcripts."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        The disease-causing mutations occur within one of these retroviral-derived
        exons and result in exon skipping and dysregulated alternative splicing of
        all MTAP isoforms.
      explanation: States the direct splicing consequence of the mutation.
- name: Dysregulated Alternative Splicing of MTAP Isoforms
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Six distinct retroviral-sequence-containing MTAP isoforms exist, and each can
    physically interact with the archetype enzyme. Exon skipping in the mutated
    isoform dysregulates alternative splicing across all of them, so the defect
    is combinatorial rather than confined to one product. Because the isoforms
    bind the canonical trimeric enzyme, the plausible route to disease is
    interference with archetype MTAP rather than its simple absence, though no
    source states this as demonstrated.
  biological_processes:
  - preferred_term: regulation of alternative mRNA splicing, via spliceosome
    term:
      id: GO:0000381
      label: regulation of alternative mRNA splicing, via spliceosome
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:22464254
    reference_title: "Primate genome gain and loss: a bone dysplasia, muscular dystrophy, and bone cancer syndrome resulting from mutated retroviral-derived MTAP transcripts."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Six distinct retroviral-sequence-containing MTAP isoforms, each of which can
      physically interact with archetype MTAP, have been identified.
    explanation: >-
      Establishes the isoform family and their physical interaction with the
      canonical enzyme, which is what makes a splicing defect consequential.
  downstream:
  - target: Impaired Polyamine and Methionine Salvage Metabolism
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Disordered isoform splicing is presumed to compromise the enzyme's
      metabolic role. The quantitative effect on flux through the salvage
      pathways has not been reported in patients.
- name: Impaired Polyamine and Methionine Salvage Metabolism
  biological_scale: MOLECULAR
  mechanism_confidence: HYPOTHETICAL
  description: >-
    MTAP is a ubiquitously expressed homotrimeric enzyme central to polyamine
    metabolism and to the adenine and methionine salvage pathways. The inference
    that disrupting it perturbs these pathways in patients is straightforward,
    and MONDO classifies the syndrome partly as a disorder of polyamine
    metabolism on that basis.

    Curated HYPOTHETICAL nonetheless. No study has measured
    methylthioadenosine, polyamine or methionine-salvage flux in affected
    individuals, and the route from a metabolic perturbation to bone infarction,
    cortical dysplasia or sarcoma is entirely unmapped. This node names what the
    enzyme does rather than what has been shown to go wrong.
  molecular_functions:
  - preferred_term: S-methyl-5-thioadenosine phosphorylase activity
    term:
      id: GO:0017061
      label: S-methyl-5-thioadenosine phosphorylase activity
    modifier: DECREASED
  biological_processes:

- category: Musculoskeletal
  name: Myopathy
  description: >-
    Muscle involvement is part of the syndrome and is easy to overlook, since
    neither the disease name nor its common abbreviation mentions it. The
    defining report characterises the condition as a bone dysplasia, muscular
    dystrophy and bone cancer syndrome.

    It is not present in every family. Myopathy entered the phenotype when two
    newly characterised families were found to have a progressive muscular
    disease resembling facioscapulohumeral muscular dystrophy; the three
    originally described families did not have it. So this is a feature of the
    syndrome as currently defined rather than of every reported pedigree, and the
    variability is unexplained.

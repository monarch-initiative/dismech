    term:
      id: CHEBI:17509
      label: 5'-S-methyl-5'-thioadenosine
  presence: Detectable in affected individuals; undetectable in unaffected controls
  evidence:
  - reference: PMID:22464254
    reference_title: "Primate genome gain and loss: a bone dysplasia, muscular dystrophy, and bone cancer syndrome resulting from mutated retroviral-derived MTAP transcripts."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All three serum samples from unaffected individuals had no detectable MTA
      levels. In marked contrast, both affected individuals had accumulations of
      MTA detectable in their serum
    explanation: >-
      The measurement itself, with a clean separation between affected and
      unaffected individuals in a blinded assay.
  - reference: PMID:22464254
    reference_title: "Primate genome gain and loss: a bone dysplasia, muscular dystrophy, and bone cancer syndrome resulting from mutated retroviral-derived MTAP transcripts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MTA is not normally present in human serum.
    explanation: >-
      Establishes the baseline that makes a detectable level meaningful. Left
      without a directness grade, consistent with how the same background
      sentence is graded elsewhere in this entry: it states normal physiology
      rather than a DMS-MFH-specific finding.
  notes: >-
    The direct substrate of MTAP, and the one measured biochemical abnormality in
    this disease. It is not normally present in human serum, so its appearance is
    interpretable as accumulation rather than variation within a range. In a
    blinded assay it was undetectable in all three unaffected individuals tested
    and accumulated in both affected individuals.

    Curated as a candidate analyte rather than an established test. Five people
    is the entire dataset, no reference interval exists, no assay is in clinical
    use, and nothing is reported about whether the level tracks disease activity
    or sarcoma risk.

    The evidence here duplicates what the Impaired Polyamine and Methionine
    Salvage Metabolism node carries, deliberately. That node needs it to justify
    its ESTABLISHED grade; this record makes the same measurement findable as a
    candidate diagnostic analyte, which is a different question.

diagnosis:
- name: Radiographic Screening of At-Risk Relatives from Puberty
  description: >-
    The one explicit published surveillance recommendation for this disease, and
    the response the entry's 35 percent sarcoma risk demands. Radiographic
    screening of family members is suggested from puberty onward, which is when
    the dysplasia becomes visible on plain film. Thallium scanning is proposed as
    a more tumour-sensitive agent in individuals already known to be affected, so
    the two have different jobs: plain films identify who has the dysplasia,
    thallium looks for malignant transformation in those who do.
  diagnosis_term:
    preferred_term: X-Ray Imaging
    term:
      id: NCIT:C38101
      label: X-Ray Imaging
  evidence:
  - reference: PMID:8781110
    reference_title: "Diaphyseal medullary stenosis (sclerosis) with bone malignancy (malignant fibrous histiocytoma): Hardcastle syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Radiographic screening of family members is suggested from puberty onward.
      Thallium scanning is proposed as a more tumor-sensitive screening agent in
      affected individuals.
    explanation: >-
      States both the screening recommendation and its timing, and distinguishes
      the tumour-directed modality from the dysplasia-directed one.
- name: Molecular Testing for MTAP Exon 9
  description: >-
    A negative gene panel does not exclude this diagnosis, and the reason is the
    same fact that makes the disease mechanistically interesting. The causal
    exon lies roughly 65 kb downstream of the canonical MTAP termination site and
    was not part of the annotated gene, so standard exome capture and standard
    hereditary-cancer or skeletal-dysplasia panels are not designed to report it.
    Testing has to target the retroviral-derived terminal exons specifically.

    The same history is why candidate screening of the linked region failed for
    over a decade: the gene was there, and the exons were not being looked at.
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:22464254
    reference_title: "Primate genome gain and loss: a bone dysplasia, muscular dystrophy, and bone cancer syndrome resulting from mutated retroviral-derived MTAP transcripts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We previously mapped the DMS-MFH tumor-suppressing-gene locus to
      chromosomal region 9p21-22 but failed to identify mutations in known genes
      in this region.
    explanation: >-
      Documents that screening the annotated genes in the correct interval failed
      to find the cause, which is the historical form of the same problem a
      modern panel has: the causal exons are not where the gene was thought to
      end.
  notes: >-
    Variant numbering is a live trap. The reported variants are numbered against
    the EST reference clone GenBank AK309365, not the canonical NM_002451
    transcript, so reconciling them against ClinVar or a laboratory report
    requires knowing which reference was used. Recorded here rather than left for
    a reader to discover.
treatments:
- name: Surveillance and Symptomatic Management
  therapeutic_modality: OTHER
  description: >-
    There is no disease-modifying therapy. Management is surveillance for
    malignant transformation plus symptomatic care of the fractures, infarctions
    and pain, with sarcoma treated by standard oncological means when it appears.
    The reasonable posture is surveillance rather than symptomatic management
    alone, precisely because the sarcoma risk is high and the window in which it
    is detectable is what screening exists to exploit.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:8781110
    reference_title: "Diaphyseal medullary stenosis (sclerosis) with bone malignancy (malignant fibrous histiocytoma): Hardcastle syndrome."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Radiographic screening of family members is suggested from puberty onward.
    explanation: >-
      The only published management recommendation for this disease is a
      screening one. Typed INDIRECT because it recommends screening rather than
      treatment; that no therapy has been reported for the established dysplasia
      is recorded in this treatment's notes.
  notes: >-
    No pharmacological therapy is curated because none has been reported in this
    disease. The MTAP-PRMT5 synthetic-lethality axis is deliberately excluded:
    that strategy targets tumours with homozygous MTAP deletion and absent
    protein, whereas this syndrome retains archetype MTAP expression, so
    importing it here would assert a therapeutic rationale the biology does not
    support.
- name: Genetic Counselling
  therapeutic_modality: BEHAVIORAL
  description: >-
    Autosomal dominant inheritance carries a 50 percent transmission risk to
    each offspring of an affected individual. Counselling for this syndrome has
    two disease-specific points beyond the standard risk discussion: the
    sarcoma risk that makes early identification of carriers clinically
    consequential (see Bone Sarcoma Predisposition), and the fact that a
    negative standard hereditary-cancer or skeletal-dysplasia panel does not
    exclude the diagnosis, because the causal exons sit outside the region
    those panels are designed to capture (see Molecular Testing for MTAP Exon
    9). A relative should not be falsely reassured by a negative panel result
    obtained without knowledge of that caveat.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:22464254
    reference_title: "Primate genome gain and loss: a bone dysplasia, muscular dystrophy, and bone cancer syndrome resulting from mutated retroviral-derived MTAP transcripts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      DMS-MFH) is an autosomal-dominant syndrome characterized by bone dysplasia,
      myopathy, and bone cancer
    explanation: >-
      States the autosomal dominant inheritance pattern that underlies the 50
      percent transmission risk counselling is built around.

mechanistic_hypotheses:
- hypothesis_group_id: dmsmfh_prmt5_synthetic_lethality_untested
  hypothesis_label: MTAP-PRMT5 synthetic-lethality vulnerability in DMS-MFH tumours
  status: EMERGING
  description: >-
    DMS-MFH tumours share two features with the MTAP-homozygous-deletion,
    protein-null cancers that PRMT5 inhibitors target: serum methylthioadenosine
    accumulates in affected individuals, and the tumour loses the wild-type
    MTAP allele outright. Whether that combination raises intratumoural MTA
    enough to confer the same PRMT5 dependence has never been measured in a
    DMS-MFH tumour. The germline allele here is synonymous and leaves archetype
    MTAP protein intact, which is a different molecular state from the
    biallelic-deletion tumours the PRMT5 strategy was developed against, and
    immunohistochemistry for MTAP would likely read falsely negative in this
    setting. See discussion dmsmfh_prmt5_vulnerability_untested for the full
    reasoning and what would settle it.
  evidence:
  - reference: PMID:22464254
    reference_title: "Primate genome gain and loss: a bone dysplasia, muscular dystrophy, and bone cancer syndrome resulting from mutated retroviral-derived MTAP transcripts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All three serum samples from unaffected individuals had no detectable MTA
      levels. In marked contrast, both affected individuals had accumulations of
      MTA detectable in their serum
    explanation: >-
      One of the two measured features the hypothesis rests on: serum MTA
      accumulates in affected individuals.
  - reference: PMID:22464254
    reference_title: "Primate genome gain and loss: a bone dysplasia, muscular dystrophy, and bone cancer syndrome resulting from mutated retroviral-derived MTAP transcripts."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      direct sequencing of this patient’s osteosarcoma genomic DNA demonstrated
      homozygosity for the c.885A >G mutation
    explanation: >-
      The other measured feature: the tumour loses the wild-type allele
      outright, which is the second feature shared with MTAP-deleted cancers.
  notes: >-
    Nothing here supports offering PRMT5 inhibition to a patient with this
    syndrome; the treatments section's exclusion of that strategy stands. This
    entry records a hypothesis about tumour biology, not a therapeutic
    recommendation.

clinical_trials:

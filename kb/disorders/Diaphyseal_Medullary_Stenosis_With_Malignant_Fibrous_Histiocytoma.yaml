  phase: NOT_APPLICABLE
  status: COMPLETED
  description: >-
    Completed NCRR-sponsored observational genetic study that set out to
    identify the causal gene and characterise the clinical manifestations of
    DMS-MFH in reported families. This is the study-registry record of the
    gene-hunting effort that the mutations curated in this entry are the
    published result of; it is a natural-history and gene-discovery study,
    not an interventional trial, and offers no treatment to enrol in.
  evidence:
  - reference: clinicaltrials:NCT00007046
    supports: SUPPORT

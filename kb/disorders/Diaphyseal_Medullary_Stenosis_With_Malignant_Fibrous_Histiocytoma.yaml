name: Diaphyseal Medullary Stenosis with Malignant Fibrous Histiocytoma
creation_date: "2026-08-29T00:00:00Z"
category: Mendelian
synonyms:
- DMS-MFH
- DMSMFH
- Hardcastle syndrome
- bone dysplasia-medullary fibrosarcoma syndrome
- diaphyseal medullary stenosis-malignant fibrous histiocytoma syndrome
- diaphyseal medullary stenosis-bone malignancy syndrome
description: >-
  Diaphyseal medullary stenosis with malignant fibrous histiocytoma is an
  autosomal dominant syndrome that combines a long-bone dysplasia with a high
  lifetime risk of bone sarcoma. Affected individuals develop bone infarctions,
  abnormal cortical growth with narrowing of the medullary canal, pathological
  fractures and painful debilitation, and roughly a third go on to develop
  malignant fibrous histiocytoma of bone, now classified as undifferentiated
  pleomorphic sarcoma. Myopathy is part of the syndrome and is often
  under-emphasised in the name.

  The molecular cause is unusual enough to be worth stating carefully. The locus
  was mapped to 9p21-22 and then resisted identification for over a decade,
  because the causal mutations do not lie in any of the genes that region is
  known for. They lie in one of three previously uncharacterised terminal exons
  of MTAP, which encodes methylthioadenosine phosphorylase, an enzyme of the
  polyamine, adenine and methionine salvage pathways. Two of those exons entered
  the primate genome as independent retroviral integration events at least forty
  million years ago and have since acquired a function. Six retroviral-sequence
  MTAP isoforms exist, each able to interact physically with the archetype
  enzyme, and the disease mutations cause exon skipping that dysregulates
  alternative splicing of all of them.

  So this is not a simple enzyme deficiency. One of the two reported mutations is
  synonymous, changing no amino acid at all, so the pathogenic effect cannot be a
  change to the protein sequence and has to act on the transcript. The lesion is
  in a regulatory isoform that interacts with the canonical protein, and its
  consequence is disordered splicing across the whole isoform family rather than
  loss of a single product.

  This is a germline predisposition syndrome, and under the granularity ladder in
  the design-decision register it follows the plain Mendelian rules and stays
  separate from the somatic sarcoma entries it predisposes to. The relationship
  between the two is nonetheless real and worth curating: sporadic bone malignant
  fibrous histiocytoma shows loss of heterozygosity in the same 9p21-22 interval
  in most informative specimens, which is what motivated the search for a shared
  tumour suppressor.

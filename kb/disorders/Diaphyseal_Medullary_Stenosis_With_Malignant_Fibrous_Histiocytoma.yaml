    snippet: >-
      Identify and characterize the gene causing diaphyseal medullary
      stenosis with malignant fibrous histiocytoma of the bone.
    explanation: >-
      States the trial's objective, which is exactly the gene-identification
      effort this entry's genetic findings are the outcome of.

discussions:
- discussion_id: dmsmfh_metabolic_route_to_bone_unmapped
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    How does dysregulated MTAP isoform splicing produce bone infarction, cortical
    dysplasia and sarcoma?
  attaches_to:
  - pathophysiology#Impaired Polyamine and Methionine Salvage Metabolism
  - pathophysiology#Diaphyseal Cortical Dysplasia and Medullary Stenosis
  - pathophysiology#Bone Sarcoma Predisposition
  rationale: >-
    The molecular lesion is well characterised, the clinical phenotype is well
    described, and almost nothing connects them. Both endpoints are now measured:
    substrate accumulation shows the enzymatic step is perturbed in patients, and
    somatic loss of the wild-type allele shows how the tumour arises. The road
    between them is not. No cell type, signalling pathway or bone-remodelling
    mechanism has been implicated in the dysplasia, and nothing connects the
    metabolic state to either the dysplasia or the transformation.

    There is no animal model of the human lesion, and that is structural rather
    than incidental: the causal exons are retroviral insertions specific to
    primates, so a mouse has nothing to mutate.
  evidence:
  - reference: PMID:22464254
    reference_title: "Primate genome gain and loss: a bone dysplasia, muscular dystrophy, and bone cancer syndrome resulting from mutated retroviral-derived MTAP transcripts."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: COMPUTATIONAL
    snippet: >-
      two of these MTAP exons arose from early and independent retroviral-integration
      events in primate genomes at least 40 million years ago, and since then,
      their genomic integration has gained a functional role
    explanation: >-
      The primate specificity of the affected exons is why no conventional mouse
      model of this lesion can exist, which is the structural reason the route
      between the measured endpoints remains unmapped.
- discussion_id: dmsmfh_single_laboratory_dependence
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Has the MTAP retroviral-exon mechanism been independently replicated?
  attaches_to:
  - pathophysiology#MTAP Retroviral-Exon Splicing Mutation
  - pathophysiology#Dysregulated Alternative Splicing of MTAP Isoforms
  rationale: >-
    Essentially the entire molecular understanding of this syndrome rests on one
    paper from one laboratory, which also produced the earlier linkage work. That
    is not a criticism of the finding, which is internally coherent and explains
    a decade-long failure of candidate screening. It is a statement about how
    much independent corroboration exists, which is little, and it matters more
    than usual here because the claim is unusual: pathogenic synonymous mutations
    in retroviral-derived exons of a gene otherwise known as a somatic deletion
    passenger. The two strands of the mechanism are not equally exposed: that
    MTAP is a tumour suppressor in its own right is corroborated from outside the
    discovery laboratory by the Kadariya mouse work, so the sarcoma arm does not
    rest on a single group; the splicing mechanism itself, which is what these
    two nodes assert, has no such corroboration. Independent identification of
    the same exons in a new family would be the obvious confirmation and has not
    been reported.
- discussion_id: dmsmfh_myopathy_variability
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why do only some DMS-MFH families have myopathy, and what determines it?
  attaches_to:
  - phenotypes#Myopathy
  rationale: >-
    Myopathy is named as a defining component of the syndrome but was absent from
    the three originally described families and appeared when two further
    families were characterised. A simple allele-phenotype correlation does not
    account for it, since the two myopathic families carry different mutations.
    With five families in total there is no power for modifier analysis, so
    whether this reflects an unrecognised modifier, an allele-specific effect
    that a larger series would resolve, or ascertainment differences in how
    carefully muscle was assessed, is open.
- discussion_id: dmsmfh_prmt5_vulnerability_untested
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Do DMS-MFH tumours reach the MTA-high, PRMT5-dependent state that
    MTAP-deleted cancers do?
  attaches_to:
  - pathophysiology#Somatic Loss of the Wild-Type MTAP Allele
  - treatments#Surveillance and Symptomatic Management
  rationale: >-
    The treatments section excludes PRMT5 inhibition, and that exclusion is
    correct as stated: the strategy was developed for tumours with homozygous
    MTAP deletion and absent protein, whereas the germline allele here is
    synonymous and leaves archetype MTAP untouched. Immunohistochemistry for
    MTAP would very likely read falsely negative in this setting.

    But the question is better posed than the exclusion implies. Two things are
    true of these tumours that are also true of the MTAP-deleted cancers PRMT5
    inhibitors target: serum methylthioadenosine accumulates in affected
    individuals, and the tumour loses the wild-type allele outright. Whether
    that combination is sufficient to produce the intratumoural MTA elevation
    that confers PRMT5 dependence has never been measured in a DMS-MFH tumour,
    and the entry should not be read as answering it. Intratumoural MTA and a
    PRMT5-dependence assay on tumour material would settle it.
  notes: >-
    Recorded as an open question rather than as a treatment. Nothing here
    supports offering PRMT5 inhibition to a patient with this syndrome, and the
    exclusion in the treatments notes stands.
- discussion_id: dmsmfh_clinical_burden_undocumented
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What is the quality-of-life and functional burden of DMS-MFH, beyond the
    individual phenotypes and the sarcoma-risk figure?
  attaches_to:
  - clinical_burden#
  rationale: >-
    The five reported families establish the phenotype and the sarcoma risk in
    considerable molecular and radiographic detail, but none of the source
    literature reports a quality-of-life instrument, a disability or functional
    burden score, or caregiver-burden data. For a disease whose non-neoplastic
    course is described as producing painful debilitation and progressive
    wasting from childhood, and which then carries a roughly one-in-three
    lifetime cancer risk, the absence of any formal burden measurement is
    itself notable and is recorded here rather than left implicit. With only
    five families ever described, a dedicated burden study is unlikely to be
    powered, which is worth stating rather than treating the gap as an
    oversight to be filled by more literature search.

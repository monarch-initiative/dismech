notes: >-
  Named Entity Confusion warning for anyone extending this entry. MTAP is far
  better known as a somatic passenger deletion: it sits immediately adjacent to
  CDKN2A at 9p21 and is co-deleted in a large fraction of sporadic cancers, and
  MTAP-deleted tumours are an active therapeutic target through PRMT5. That
  literature is about homozygous somatic deletion of the whole locus in tumour
  cells and is not about this syndrome, whose lesion is a germline splicing
  mutation in a retroviral-derived terminal exon. A search on the gene symbol
  will return overwhelmingly the former. The one genuine connection is the
  9p21-22 loss of heterozygosity shared with sporadic bone malignant fibrous
  histiocytoma, which is curated here with its own evidence.

  Nomenclature. Malignant fibrous histiocytoma is the name used throughout the
  primary literature on this syndrome and is retained here for that reason. The
  entity was reclassified as undifferentiated pleomorphic sarcoma in later WHO
  classifications, and the description says so, but the disease name and the
  quoted snippets keep the historical term because that is what the sources say.
pathophysiology:
- name: MTAP Retroviral-Exon Splicing Mutation
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Mutations fall in the most proximal of three previously uncharacterised
    terminal exons of MTAP. Two of these exons derive from independent retroviral
    integrations into the primate genome at least forty million years ago, and
    have since taken on a function. The gene had been thought to be encoded by
    eight exons alone, which is why the locus resisted identification for more
    than a decade after linkage.
  gene:
    preferred_term: MTAP
    description: >-
      Encodes methylthioadenosine phosphorylase; germline mutation of a
      retroviral-derived terminal exon causes this syndrome.
    term:
      id: hgnc:7413
      label: MTAP
  genetic_context:
    gene:
      preferred_term: MTAP
      term:
        id: hgnc:7413
        label: MTAP
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: UNKNOWN
    description: >-
      Heterozygous germline mutation in a retroviral-derived terminal exon,
      acting dominantly through dysregulated splicing rather than by
      straightforward loss of enzyme activity. No source classifies the
      functional impact, and the category is left UNKNOWN rather than guessed.
  evidence:
  - reference: PMID:22464254
    reference_title: "Primate genome gain and loss: a bone dysplasia, muscular dystrophy, and bone cancer syndrome resulting from mutated retroviral-derived MTAP transcripts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We now demonstrate that DMS-MFH results from mutations in the most proximal
      of three previously uncharacterized terminal exons of the gene encoding
      methylthioadenosine phosphorylase, MTAP.
    explanation: Identifies the causal gene and the exon in which mutations fall.
  - reference: PMID:22464254
    reference_title: "Primate genome gain and loss: a bone dysplasia, muscular dystrophy, and bone cancer syndrome resulting from mutated retroviral-derived MTAP transcripts."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: COMPUTATIONAL
    snippet: >-
      two of these MTAP exons arose from early and independent retroviral-integration
      events in primate genomes at least 40 million years ago, and since then,
      their genomic integration has gained a functional role
    explanation: >-
      Establishes the retroviral origin of the affected exons, which is why the
      gene's coding extent had been misjudged.
  - reference: PMID:22464254
    reference_title: "Primate genome gain and loss: a bone dysplasia, muscular dystrophy, and bone cancer syndrome resulting from mutated retroviral-derived MTAP transcripts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      one mutation was a synonymous change at position c.885A>G
    explanation: >-
      The most informative single fact about this lesion. A synonymous change
      alters no amino acid, so the pathogenic effect cannot be a change to the
      protein sequence and must act on the transcript, which is what makes the
      splicing mechanism the explanation rather than one candidate among
      several.
  downstream:
  - target: Dysregulated Alternative Splicing of MTAP Isoforms
    causal_link_type: DIRECT
    description: >-
      The mutation causes skipping of the affected exon, which propagates to the
      splicing of the whole isoform family.
    evidence:
    - reference: PMID:22464254
      reference_title: "Primate genome gain and loss: a bone dysplasia, muscular dystrophy, and bone cancer syndrome resulting from mutated retroviral-derived MTAP transcripts."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        The disease-causing mutations occur within one of these retroviral-derived
        exons and result in exon skipping and dysregulated alternative splicing of
        all MTAP isoforms.
      explanation: States the direct splicing consequence of the mutation.
  - target: Somatic Loss of the Wild-Type MTAP Allele
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The germline allele is the first hit. It does not cause the second one:
      loss of the remaining wild-type copy is a stochastic somatic event, and
      what the inherited allele supplies is the vulnerability that makes that
      loss consequential. No mechanism linking the germline lesion to the
      occurrence of the somatic event has been established.
    evidence:
    - reference: PMID:22464254
      reference_title: "Primate genome gain and loss: a bone dysplasia, muscular dystrophy, and bone cancer syndrome resulting from mutated retroviral-derived MTAP transcripts."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        direct sequencing of this patient’s osteosarcoma genomic DNA demonstrated
        homozygosity for the c.885A >G mutation
      explanation: >-
        Shows the tumour is homozygous for the germline mutation, which is the
        second hit this edge asserts.
- name: Dysregulated Alternative Splicing of MTAP Isoforms
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Six distinct retroviral-sequence-containing MTAP isoforms exist, and each can
    physically interact with the archetype enzyme. Exon skipping in the mutated
    isoform dysregulates alternative splicing across all of them, so the defect
    is combinatorial rather than confined to one product. Because the isoforms
    bind the canonical trimeric enzyme, the plausible route to disease is
    interference with archetype MTAP rather than its simple absence, though no
    source states this as demonstrated.
  biological_processes:
  - preferred_term: regulation of alternative mRNA splicing, via spliceosome
    term:
      id: GO:0000381
      label: regulation of alternative mRNA splicing, via spliceosome
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:22464254
    reference_title: "Primate genome gain and loss: a bone dysplasia, muscular dystrophy, and bone cancer syndrome resulting from mutated retroviral-derived MTAP transcripts."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Six distinct retroviral-sequence-containing MTAP isoforms, each of which can
      physically interact with archetype MTAP, have been identified.
    explanation: >-
      Establishes the isoform family and their physical interaction with the
      canonical enzyme, which is what makes a splicing defect consequential.
  downstream:
  - target: Impaired Polyamine and Methionine Salvage Metabolism
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Disordered isoform splicing is presumed to compromise the enzyme's
      metabolic role. The quantitative effect on flux through the salvage
      pathways has not been reported in patients.
- name: Impaired Polyamine and Methionine Salvage Metabolism
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    MTAP is a ubiquitously expressed homotrimeric enzyme central to polyamine
    metabolism and to the adenine and methionine salvage pathways, and the
    enzymatic step is demonstrably impaired in patients. Methylthioadenosine, the
    direct substrate of MTAP and a by-product of polyamine synthesis, is not
    normally present in human serum. In a blinded assay it was undetectable in
    all three unaffected individuals and accumulated in both affected
    individuals. Substrate accumulation in vivo is a direct demonstration that
    the enzyme step is compromised, not an inference from what the enzyme is
    known to do, and it is the reason MONDO's classification of this syndrome as
    a disorder of polyamine metabolism is more than nominal.

    Two limits on how far that goes. The measurement is five people, two of them
    affected, so it establishes that the step is perturbed rather than how much.
    And flux through the downstream salvage pathways has not been measured at
    all: what is shown is that the substrate backs up, not what happens to
    polyamine or methionine economy as a result.
  molecular_functions:
  - preferred_term: S-methyl-5-thioadenosine phosphorylase activity
    term:
      id: GO:0017061
      label: S-methyl-5-thioadenosine phosphorylase activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: polyamine metabolic process
    term:
      id: GO:0006595
      label: polyamine metabolic process
    modifier: DYSREGULATED
  - preferred_term: L-methionine salvage
    description: >-
      No modifier is asserted. Flux through this pathway has not been measured in
      patients; what is measured is that the enzyme's substrate accumulates.
    term:
      id: GO:0071267
      label: L-methionine salvage
  - preferred_term: purine ribonucleoside salvage
    description: >-
      No modifier is asserted, for the same reason as L-methionine salvage: the
      direction is inferred from the enzymology, not measured.
    term:
      id: GO:0006166
      label: purine ribonucleoside salvage
  evidence:
  - reference: PMID:22464254
    reference_title: "Primate genome gain and loss: a bone dysplasia, muscular dystrophy, and bone cancer syndrome resulting from mutated retroviral-derived MTAP transcripts."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: >-
      MTAP is a ubiquitously expressed homotrimeric-subunit enzyme critical to
      polyamine metabolism and adenine and methionine salvage pathways
    explanation: >-
      States the enzyme's metabolic role. Typed INDIRECT and OTHER because this
      is background description of MTAP biology rather than a measurement in
      patients, and it establishes what the enzyme does. The measurement that
      shows the pathway is disturbed is the next item.
  - reference: PMID:22464254
    reference_title: "Primate genome gain and loss: a bone dysplasia, muscular dystrophy, and bone cancer syndrome resulting from mutated retroviral-derived MTAP transcripts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All three serum samples from unaffected individuals had no detectable MTA
      levels. In marked contrast, both affected individuals had accumulations of
      MTA detectable in their serum
    explanation: >-
      A direct in-vivo measurement of the enzyme's own substrate, blinded, with a
      clean separation between affected and unaffected. This is the propositional
      evidence that the MTAP step is impaired in patients.
  - reference: PMID:22464254
    reference_title: "Primate genome gain and loss: a bone dysplasia, muscular dystrophy, and bone cancer syndrome resulting from mutated retroviral-derived MTAP transcripts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MTA is not normally present in human serum.
    explanation: >-
      Establishes the baseline that makes detectable serum MTA in affected
      individuals interpretable as accumulation rather than as normal variation.
  downstream:
  - target: Diaphyseal Cortical Dysplasia and Medullary Stenosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The route from the metabolic lesion to the bone phenotype is unknown. No
      cell type, signalling pathway or bone-remodelling mechanism has been
      implicated.
- name: Somatic Loss of the Wild-Type MTAP Allele
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    The tumour-suppressive mechanism is characterised, and it is Knudson's two
    hits. In an osteosarcoma from an affected individual carrying c.885A>G, the
    tumour DNA was homozygous for the mutation, and loss-of-heterozygosity
    analysis across the 2.9 Mb critical region showed complete loss of the
    wild-type allele from the unaffected chromosome. So the germline allele is
    the first hit and somatic loss of the remaining wild-type copy is the second.

    This is also what ties the syndrome to its sporadic counterpart: the same
    interval is lost in most informative sporadic bone malignant fibrous
    histiocytoma specimens, which is what motivated the search for a shared
    tumour suppressor in the first place.
  evidence:
  - reference: PMID:22464254
    reference_title: "Primate genome gain and loss: a bone dysplasia, muscular dystrophy, and bone cancer syndrome resulting from mutated retroviral-derived MTAP transcripts."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      direct sequencing of this patient’s osteosarcoma genomic DNA demonstrated
      homozygosity for the c.885A >G mutation
    explanation: >-
      Establishes tumour homozygosity for the germline allele, the direct
      evidence of a second hit.
  downstream:
  - target: Bone Sarcoma Predisposition
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - dmsmfh_prmt5_synthetic_lethality_untested
    description: >-
      Biallelic loss of MTAP function in the tumour precedes sarcoma, but what
      the resulting metabolic state does to the cell to permit transformation is
      not established.

- name: Diaphyseal Cortical Dysplasia and Medullary Stenosis
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED
  description: >-
    Abnormal cortical growth narrows the medullary canal of the long bones, with
    bone infarctions, pathological fractures and painful debilitation. This is
    the non-neoplastic half of the syndrome and it is what brings most patients
    to attention before any tumour appears.
  locations:
  - preferred_term: diaphysis
    term:
      id: UBERON:0004769
      label: diaphysis
  evidence:
  - reference: PMID:10612808
    reference_title: "Malignant fibrous histiocytoma: inherited and sporadic forms have loss of heterozygosity at chromosome bands 9p21-22-evidence for a common genetic defect."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This hereditary cancer syndrome is characterized by bone infarctions,
      cortical growth abnormalities, pathologic fractures, and painful
      debilitation.
    explanation: >-
      Lists the skeletal features that constitute this node.
- name: Bone Sarcoma Predisposition
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED
  description: >-
    About 35 percent of affected individuals develop malignant fibrous
    histiocytoma of bone. That is the feature which makes this a cancer
    predisposition syndrome rather than a bone dysplasia, and it is why
    surveillance rather than symptomatic management is the reasonable posture.

    The tumour-suppressor route is established: tumour DNA is
    homozygous for the germline mutation with complete loss of the wild-type
    allele, so this is direct loss of MTAP function by Knudson's two hits. What
    remains unresolved is whether the abnormal bone environment created by the
    dysplasia additionally contributes, and what the biallelic metabolic state
    does to permit transformation.
  evidence:
  - reference: PMID:10612808
    reference_title: "Malignant fibrous histiocytoma: inherited and sporadic forms have loss of heterozygosity at chromosome bands 9p21-22-evidence for a common genetic defect."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most notably, 35% of affected individuals develop bone MFH, a sarcoma that,
      in its sporadic form, accounts for 6% of all bone cancers.
    explanation: >-
      Quantifies the sarcoma risk and places it against the sporadic tumour's
      share of bone cancers.
  - reference: PMID:22464254
    reference_title: "Primate genome gain and loss: a bone dysplasia, muscular dystrophy, and bone cancer syndrome resulting from mutated retroviral-derived MTAP transcripts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our results identify a gene involved in the development of bone sarcoma
    explanation: >-
      States the identification of MTAP as a bone sarcoma gene, which is the
      basis for treating this node as a tumour-suppressor mechanism rather than
      an association.

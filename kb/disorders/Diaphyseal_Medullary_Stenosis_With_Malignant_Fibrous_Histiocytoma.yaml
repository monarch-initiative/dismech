- name: Bone Sarcoma Predisposition
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED
  description: >-
    About 35 percent of affected individuals develop malignant fibrous
    histiocytoma of bone. That is the feature which makes this a cancer
    predisposition syndrome rather than a bone dysplasia, and it is why
    surveillance rather than symptomatic management is the reasonable posture.

    The tumour arises in bone already abnormal from the dysplasia, so whether the
    sarcoma risk is a direct consequence of losing MTAP tumour-suppressive
    function or is mediated by the abnormal bone environment is not resolved.
  evidence:
  - reference: PMID:10612808
    reference_title: "Malignant fibrous histiocytoma: inherited and sporadic forms have loss of heterozygosity at chromosome bands 9p21-22-evidence for a common genetic defect."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most notably, 35% of affected individuals develop bone MFH, a sarcoma that,
      in its sporadic form, accounts for 6% of all bone cancers.
    explanation: >-
      Quantifies the sarcoma risk and places it against the sporadic tumour's
      share of bone cancers.
  - reference: PMID:22464254
    reference_title: "Primate genome gain and loss: a bone dysplasia, muscular dystrophy, and bone cancer syndrome resulting from mutated retroviral-derived MTAP transcripts."

genetic:
- name: MTAP
  gene_term:
    preferred_term: MTAP
    term:
      id: hgnc:7413
      label: MTAP
  association: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    Germline mutations in the most proximal of three retroviral-derived terminal
    exons of MTAP, causing exon skipping and dysregulated alternative splicing
    across the isoform family. The locus was mapped to 9p21-22 more than a decade
    before the gene was found; the delay is explained by the fact that the
    causal exons were not part of the annotated gene.

    Two variants account for the reported families and they do different things,
    which matters because this entry's myopathy gap turns on the two myopathic
    families carrying different mutations. c.885A>G is synonymous, effectively
    R100R, and decreases expression of all exon-9 isoforms by roughly 70 percent
    while leaving archetype MTAP untouched. c.813-2A>G is a splice-acceptor
    variant with a different isoform consequence. Both increase MTAP_v3 and _v6
    expression to the same degree, so what the two share is a shift in isoform
    balance rather than a common loss of one product.
  evidence:
  - reference: PMID:22464254
    reference_title: "Primate genome gain and loss: a bone dysplasia, muscular dystrophy, and bone cancer syndrome resulting from mutated retroviral-derived MTAP transcripts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We previously mapped the DMS-MFH tumor-suppressing-gene locus to
      chromosomal region 9p21-22 but failed to identify mutations in known genes
      in this region.
    explanation: >-
      Records that the causal gene was invisible to candidate screening of the
      annotated genes in the linked region, which is the point of the retroviral
      exon finding.
  - reference: PMID:22464254
    reference_title: "Primate genome gain and loss: a bone dysplasia, muscular dystrophy, and bone cancer syndrome resulting from mutated retroviral-derived MTAP transcripts."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The c.885A >G mutation decreased the expression levels of all exon 9
      isoforms by approximately 70% but had no effect on archetype-MTAP
      expression.
    explanation: >-
      Quantifies what the synonymous variant does: partial loss of the
      retroviral-exon isoforms with the canonical enzyme untouched.
  - reference: PMID:22464254
    reference_title: "Primate genome gain and loss: a bone dysplasia, muscular dystrophy, and bone cancer syndrome resulting from mutated retroviral-derived MTAP transcripts."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      increased the expression of MTAP_v3 and _v6 to the same degree
    explanation: >-
      Identifies what the two different variants share, which is a shift in
      isoform balance rather than a common loss.
  - reference: PMID:10612808
    reference_title: "Malignant fibrous histiocytoma: inherited and sporadic forms have loss of heterozygosity at chromosome bands 9p21-22-evidence for a common genetic defect."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In addition to the hereditary specimen, 71% (5/7) of informative sporadic
      bone MFH specimens displayed LOH for markers within that same region.
    explanation: >-
      Shows the same interval is lost in most informative sporadic bone sarcomas,
      which is the observation that motivated the search for a shared tumour
      suppressor and led to MTAP.
  notes: >-
    The germline syndrome and the corresponding sporadic tumour converge on this
    locus. Loss of heterozygosity across the 9p21-22 critical region was found in
    five of seven informative sporadic bone malignant fibrous histiocytoma
    specimens, and the minimal region of overlap narrowed the interval to 2 cM
    between D9S736 and D9S171. That somatic observation is recorded here because
    it bears on the germline mechanism; sporadic sarcoma is not in scope for this
    entry.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Five unrelated multigenerational families carried the identified mutations,
    and fewer than six families have been reported in total across a literature
    spanning several decades. There is no registry, no cohort and no population
    estimate.
  evidence:
  - reference: PMID:22464254
    reference_title: "Primate genome gain and loss: a bone dysplasia, muscular dystrophy, and bone cancer syndrome resulting from mutated retroviral-derived MTAP transcripts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Family 4 is a previously undescribed DMS-MFH-affected family from New York.
    explanation: >-
      Documents the composition of the cohort: families 1 to 3 were the
      previously described American, Australian and New York kindreds, and
      families 4 and 5 were added by this study, giving the five on which the
      molecular characterisation rests.
  - reference: PMID:22464254
    reference_title: "Primate genome gain and loss: a bone dysplasia, muscular dystrophy, and bone cancer syndrome resulting from mutated retroviral-derived MTAP transcripts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Family 5 has been described as having autosomal-dominant bone fragility and
      limb-girdle myopathy.
    explanation: >-
      Identifies the second newly added family and its myopathic presentation,
      which is the source of the myopathy that entered the phenotype after the
      original three families.
diagnosis:
- name: Radiographic Screening of At-Risk Relatives from Puberty
  description: >-
    The one explicit published surveillance recommendation for this disease, and
    the response the entry's 35 percent sarcoma risk demands. Radiographic
    screening of family members is suggested from puberty onward, which is when
    the dysplasia becomes visible on plain film. Thallium scanning is proposed as
    a more tumour-sensitive agent in individuals already known to be affected, so
    the two have different jobs: plain films identify who has the dysplasia,
    thallium looks for malignant transformation in those who do.
  diagnosis_term:
    preferred_term: X-Ray Imaging
    term:
      id: NCIT:C38101
      label: X-Ray Imaging
  evidence:
  - reference: PMID:8781110
    reference_title: "Diaphyseal medullary stenosis (sclerosis) with bone malignancy (malignant fibrous histiocytoma): Hardcastle syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Radiographic screening of family members is suggested from puberty onward.
      Thallium scanning is proposed as a more tumor-sensitive screening agent in
      affected individuals.
    explanation: >-
      States both the screening recommendation and its timing, and distinguishes
      the tumour-directed modality from the dysplasia-directed one.
- name: Molecular Testing for MTAP Exon 9
  description: >-
    A negative gene panel does not exclude this diagnosis, and the reason is the
    same fact that makes the disease mechanistically interesting. The causal
    exon lies roughly 65 kb downstream of the canonical MTAP termination site and
    was not part of the annotated gene, so standard exome capture and standard
    hereditary-cancer or skeletal-dysplasia panels are not designed to report it.
    Testing has to target the retroviral-derived terminal exons specifically.

    The same history is why candidate screening of the linked region failed for
    over a decade: the gene was there, and the exons were not being looked at.
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:22464254
    reference_title: "Primate genome gain and loss: a bone dysplasia, muscular dystrophy, and bone cancer syndrome resulting from mutated retroviral-derived MTAP transcripts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We previously mapped the DMS-MFH tumor-suppressing-gene locus to
      chromosomal region 9p21-22 but failed to identify mutations in known genes
      in this region.
    explanation: >-
      Documents that screening the annotated genes in the correct interval failed
      to find the cause, which is the historical form of the same problem a
      modern panel has: the causal exons are not where the gene was thought to
      end.
  notes: >-
    Variant numbering is a live trap. The reported variants are numbered against
    the EST reference clone GenBank AK309365, not the canonical NM_002451
    transcript, so reconciling them against ClinVar or a laboratory report
    requires knowing which reference was used. Recorded here rather than left for
    a reader to discover.
treatments:
- name: Surveillance and Symptomatic Management
  therapeutic_modality: BEHAVIORAL
  description: >-
    There is no disease-modifying therapy. Management is surveillance for
    malignant transformation plus symptomatic care of the fractures, infarctions
    and pain, with sarcoma treated by standard oncological means when it appears.
    The reasonable posture is surveillance rather than symptomatic management
    alone, precisely because the sarcoma risk is high and the window in which it
    is detectable is what screening exists to exploit.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:8781110
    reference_title: "Diaphyseal medullary stenosis (sclerosis) with bone malignancy (malignant fibrous histiocytoma): Hardcastle syndrome."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Radiographic screening of family members is suggested from puberty onward.
    explanation: >-
      The only published management recommendation for this disease is a
      screening one. Graded PARTIAL because it supports surveillance and says
      nothing about treating the established dysplasia, for which no therapy has
      been reported.
  notes: >-
    No pharmacological therapy is curated because none has been reported in this
    disease. The MTAP-PRMT5 synthetic-lethality axis is deliberately excluded:
    that strategy targets tumours with homozygous MTAP deletion and absent
    protein, whereas this syndrome retains archetype MTAP expression, so
    importing it here would assert a therapeutic rationale the biology does not
    support.

discussions:
- discussion_id: dmsmfh_metabolic_route_to_bone_unmapped
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    How does dysregulated MTAP isoform splicing produce bone infarction, cortical
    dysplasia and sarcoma?
  attaches_to:
  - pathophysiology#Impaired Polyamine and Methionine Salvage Metabolism
  - pathophysiology#Diaphyseal Cortical Dysplasia and Medullary Stenosis
  - pathophysiology#Bone Sarcoma Predisposition
  rationale: >-
    The molecular lesion is well characterised and the clinical phenotype is well
    described, and almost nothing connects them. The first step after the
    splicing defect is inference
    from what the enzyme is known to do. Beyond that, no cell type, signalling
    pathway or bone-remodelling mechanism has been implicated in either the
    dysplasia or the sarcoma, and there is no animal model of the human lesion.
    That last point is structural rather than incidental: the causal exons are
    retroviral insertions specific to primates, so a mouse has nothing to mutate.
  evidence:
  - reference: PMID:22464254
    reference_title: "Primate genome gain and loss: a bone dysplasia, muscular dystrophy, and bone cancer syndrome resulting from mutated retroviral-derived MTAP transcripts."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      two of these MTAP exons arose from early and independent retroviral-integration
      events in primate genomes at least 40 million years ago, and since then,
      their genomic integration has gained a functional role
    explanation: >-
      The primate specificity of the affected exons is why no conventional mouse
      model of this lesion can exist, which is the structural reason the
      mechanism remains unmapped.
- discussion_id: dmsmfh_single_laboratory_dependence
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Has the MTAP retroviral-exon mechanism been independently replicated?
  attaches_to:
  - pathophysiology#MTAP Retroviral-Exon Splicing Mutation
  - pathophysiology#Dysregulated Alternative Splicing of MTAP Isoforms
  rationale: >-
    Essentially the entire molecular understanding of this syndrome rests on one
    paper from one laboratory, which also produced the earlier linkage work. That
    is not a criticism of the finding, which is internally coherent and explains
    a decade-long failure of candidate screening. It is a statement about how
    much independent corroboration exists, which is little, and it matters more
    than usual here because the claim is unusual: pathogenic synonymous mutations
    in retroviral-derived exons of a gene otherwise known as a somatic deletion
    passenger. Independent identification of the same exons in a new family would
    be the obvious confirmation and has not been reported.
- discussion_id: dmsmfh_myopathy_variability
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why do only some DMS-MFH families have myopathy, and what determines it?
  attaches_to:
  - phenotypes#Myopathy
  rationale: >-
    Myopathy is named as a defining component of the syndrome but was absent from
    the three originally described families and appeared when two further
    families were characterised. A simple allele-phenotype correlation does not
    account for it, since the two myopathic families carry different mutations.
    With five families in total there is no power for modifier analysis, so
    whether this reflects an unrecognised modifier, an allele-specific effect
    that a larger series would resolve, or ascertainment differences in how
    carefully muscle was assessed, is open.

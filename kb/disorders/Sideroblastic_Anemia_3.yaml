name: Sideroblastic Anemia 3
creation_date: "2026-08-24T14:05:00Z"
description: >-
  Sideroblastic anemia 3 (SIDBA3) is an ultra-rare autosomal recessive congenital
  sideroblastic anemia caused by biallelic GLRX5 variants. Glutaredoxin 5 is a
  mitochondrial protein required for iron-sulfur cluster biogenesis. Its loss
  strips the [4Fe-4S] cluster from iron regulatory protein 1, converting IRP1 to
  its RNA-binding form. That form represses translation of ALAS2, the erythroid
  heme enzyme whose transcript carries a 5' iron-responsive element, while
  stabilising transferrin receptor mRNA. The result is the paradoxical combination that defines the
  disease: erythroid heme deficiency with microcytic anemia on one hand, and
  mitochondrial iron overload with ring sideroblasts on the other. GLRX5 is
  unusual among disease genes in producing two clinically distinct,
  allele-dependent phenotypes; this entry covers the isolated sideroblastic
  anemia phenotype only.
synonyms:
- SIDBA3
- GLRX5-related sideroblastic anemia
- glutaredoxin 5 deficiency
- GLRX5 deficiency
- autosomal recessive sideroblastic anemia due to GLRX5 deficiency
category: Mendelian

treatments:
- name: Iron chelation therapy
  description: >-
    Iron chelation partially reversed the anemia in the index patient. The
    proposed mechanism is that redistributing iron from mitochondria to the
    cytosol relieves IRP2-mediated repression, improving heme synthesis. Note this
    is the authors' hypothesis, not a demonstrated mechanism, and rests on a
    single patient.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: deferasirox
      term:
        id: CHEBI:49005
        label: deferasirox
    - preferred_term: deferoxamine
      term:
        id: CHEBI:4356
        label: desferrioxamine B
  target_phenotypes:
  - preferred_term: Microcytic anemia
    term:
      id: HP:0001935
      label: Microcytic anemia
  - preferred_term: Increased circulating iron concentration
    term:
      id: HP:0003452
      label: Increased circulating iron concentration
  target_mechanisms:
  - target: Mitochondrial Iron Overload and Ring Sideroblast Formation
    treatment_effect: INHIBITS
    description: >-
      Chelation is proposed to relieve mitochondrial iron loading and its
      downstream repression of heme synthesis.
    evidence:
    - reference: PMID:17485548
      reference_title: The human counterpart of zebrafish shiraz shows sideroblastic-like microcytic anemia and iron overload.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Iron chelation, redistributing iron to the cytosol, might relieve IRP2
        excess, improving heme synthesis and anemia.
      explanation: >-
        The proposed mechanism, stated by the authors as a possibility ("might
        relieve"), hence PARTIAL.
  evidence:
  - reference: PMID:17485548
    reference_title: The human counterpart of zebrafish shiraz shows sideroblastic-like microcytic anemia and iron overload.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Anemia was worsened by blood transfusions but partially reversed by iron

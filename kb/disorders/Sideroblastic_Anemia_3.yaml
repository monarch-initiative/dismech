animal_models:
- name: shiraz (sir) zebrafish grx5 mutant
  species: Zebrafish
  genotype: grx5 (glutaredoxin 5) deficiency
  publication: PMID:16110529
  description: >-
    The zebrafish mutant that established the GLRX5-heme connection. Loss of Fe-S
    cluster assembly activates IRP1 and blocks ALAS2-catalysed heme biosynthesis.
    The causal role of the IRP1-ALAS2 axis was established by two reciprocal
    rescue experiments rather than by correlation.
  modeled_mechanisms:
  - target: IRP1 Activation and Iron-Responsive Element Binding
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      The model demonstrates the IRP1-dependence of the heme block directly:
      ALAS2 lacking its iron-responsive element rescues the mutant while ALAS2
      retaining the element does not, and IRP1 knockdown restores haemoglobin
      synthesis.
    limitations: >-
      Severity does not translate. The zebrafish mutant is embryonically lethal,
      whereas human GLRX5 deficiency presents in adulthood with anemia and iron
      overload; the original human report states this divergence explicitly.
      Zebrafish also lack the iron-overload phenotype that dominates the human
      disease.
    readouts:
    - name: Haemoglobin synthesis after IRP1 antisense knockdown
      target: IRP1 Activation and Iron-Responsive Element Binding
      direction: RESTORED
      interpretation: >-
        Restoration of haemoglobin on IRP1 knockdown establishes that IRP1
        activation is the causal intermediate, not a bystander.
      evidence:
      - reference: PMID:16110529
        reference_title: Deficiency of glutaredoxin 5 reveals Fe-S clusters are required for vertebrate haem synthesis.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Further, antisense knockdown of IRP1 restored sir embryo haemoglobin
          synthesis.
        explanation: >-
          The reciprocal rescue that establishes IRP1 causality.
    - name: Embryo rescue by iron-responsive-element-less ALAS2 overexpression
      target: IRP1 Activation and Iron-Responsive Element Binding
      direction: RESTORED
      interpretation: >-
        Rescue only by the ALAS2 transcript lacking the iron-responsive element
        localises the block to IRP1-mediated translational repression of ALAS2.
      evidence:
      - reference: PMID:16110529
        reference_title: Deficiency of glutaredoxin 5 reveals Fe-S clusters are required for vertebrate haem synthesis.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Overexpression of ALAS2 RNA without the 5' iron response element that
          binds IRP1 rescued sir embryos, whereas overexpression of ALAS2
          including the iron response element did not.
        explanation: >-
          The element-dependence of rescue is what makes this mechanistic rather
          than correlative.
  evidence:
  - reference: PMID:16110529
    reference_title: Deficiency of glutaredoxin 5 reveals Fe-S clusters are required for vertebrate haem synthesis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Here we show that the hypochromic anaemia in shiraz (sir) zebrafish mutants
      is caused by deficiency of glutaredoxin 5 (grx5), a gene required in yeast
      for Fe-S cluster assembly.
    explanation: >-
      Establishes the model as a genuine grx5-deficiency model of hypochromic
      anemia.
discussions:
- discussion_id: hmm_glrx5_zebrafish_severity_divergence
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Why is grx5 deficiency embryonically lethal in zebrafish but compatible with
    survival to middle age in humans, and does the difference lie in residual
    GLRX5 function or in a vertebrate-specific compensation absent from fish?
  attaches_to:
  - "pathophysiology#GLRX5 Deficiency and Impaired Iron-Sulfur Cluster Biogenesis"
  rationale: >-
    The zebrafish model is exceptionally strong on mechanism: reciprocal rescue
    experiments establish IRP1-mediated ALAS2 repression as causal, which no human
    experiment could do. But it diverges on severity and on phenotype. The shiraz
    mutant dies as an embryo; the index human patient presented in middle age. And
    the iron overload that dominates the human disease, and drives its management,
    is not the zebrafish phenotype. The original human report states the
    divergence explicitly. Whether the human course reflects hypomorphic rather
    than null alleles (the index allele reduces GLRX5 RNA drastically but is a
    splice variant, not a deletion, and the zebrafish lesion is a deletion), or a
    compensating mechanism that fish lack, is unresolved and matters for
    interpreting the model's predictions about therapy.
  proposed_experiments:
  - experiment_id: exp_glrx5_allele_series_residual_function
    name: Quantify residual GLRX5 function across the human allele series
    description: >-
      Measure GLRX5 transcript, protein and cluster-transfer activity for each
      reported human allele in a common cell background, to test whether human
      survival is explained by residual function rather than by species
      difference.
  - experiment_id: exp_glrx5_null_human_cell_model
    name: Complete GLRX5 knockout in human erythroid cells
    description: >-
      Generate a true null in human erythroid progenitors and compare its
      phenotype with the hypomorphic patient alleles and with the zebrafish
      mutant, to determine whether a human null is viable at the cellular level.
- discussion_id: gap_glrx5_irp2_contribution
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does IRP2, rather than IRP1 alone, drive the erythroid ALAS2 and ferritin
    repression in human GLRX5 deficiency?
  attaches_to:
  - "pathophysiology#IRP1 Activation and Iron-Responsive Element Binding"
  rationale: >-
    IRP1 activation is directly evidenced in both patient cells and the zebrafish
    model. IRP2 is a separate proposal: the index-report authors hypothesise that
    IRP2, being less degraded when heme is low, contributes to the erythroblast
    repression and thereby to mitochondrial iron loading, and the 2010 human
    erythroblast study did observe increased IRP2 levels. But the increase was
    interpreted as a marker of cytosolic iron depletion, not demonstrated to be
    causal. The distinction is not academic: the proposed mechanism for why iron
    chelation helps runs specifically through relieving IRP2 excess, so the only
    treatment with reported benefit rests on the arm of the mechanism that is
    least established.
  proposed_experiments:
  - experiment_id: exp_glrx5_irp2_selective_knockdown
    name: Selective IRP1 versus IRP2 knockdown in GLRX5-deficient erythroblasts
    description: >-
      Knock down IRP1 and IRP2 separately and together in GLRX5-deficient human
      erythroid cells, measuring ALAS2 translation, ferritin, and mitochondrial
      iron, to apportion the repression between the two proteins.
  - experiment_id: exp_glrx5_chelation_irp2_readout
    name: IRP2 readout during iron chelation
    description: >-
      Measure IRP2 abundance and iron-responsive-element binding before and during
      iron chelation in GLRX5-deficient cells, to test the proposed mechanism of
      the observed clinical benefit directly.
notes: >-
  Scope. GLRX5 causes two clinically distinct, allele-dependent phenotypes, and
  this entry covers only the first: isolated sideroblastic anemia. The second is a
  complex neurological phenotype with variant non-ketotic hyperglycinemia,
  spastic paraparesis, axonal polyneuropathy and psychiatric disturbance,
  associated with the p.Lys51del allele and reported in four patients from three
  Australian families of Lebanese descent. That phenotype is a separate disease
  entity and should be curated separately rather than as a subtype here; it is
  named in this entry only so the boundary is explicit.

  Distinct from the other congenital sideroblastic anemias by mechanism, not just
  by gene: X-linked ALAS2 deficiency and SLC25A38 deficiency hit heme synthesis
  directly, whereas GLRX5 does so indirectly through iron-sulfur cluster failure
  and IRP-mediated regulation, which is also why GLRX5 patients have iron overload
  rather than the iron-poor picture of a pure heme-synthesis block. The existing
  Myopathy_Lactic_Acidosis_and_Sideroblastic_Anemia entry (PUS1/YARS2) and
  Pearson_Syndrome (mtDNA deletion) are separate entities.

  GeneReviews baseline. There is no GeneReviews chapter for GLRX5-related
  sideroblastic anemia. The only chapter in this space is X-Linked Sideroblastic
  Anemia and Ataxia (PMID:20301496), which covers a different gene (ABCB7) and a
  different disease, and is retired. Recording the negative result so the check is
  visibly done rather than skipped.

  Frequency bands are deliberately absent throughout. With a handful of patients
  reported worldwide, every available source is a case report or a small series,
  and a frequency band is a separate quantitative claim from the disease-phenotype
  association. Microcytic anemia is almost certainly obligate, but no source states
  that, so nothing here carries a band.

  Evidence-strength note for reviewers. The single most clinically actionable
  statement in this entry, that transfusion worsened the anemia while chelation
  partially reversed it, rests on ONE patient, and the mechanism proposed for it
  runs through IRP2, which is the least-established arm of the pathway (see
  gap_glrx5_irp2_contribution). Both facts are recorded in the treatment
  descriptions rather than left implicit, because the schema's evidence fields
  capture what a source says but not how many patients it says it about.

  No module conformance declared. lysosomal_substrate_accumulation and the
  metabolic modules do not describe this mechanism, and there is no iron-metabolism
  or heme-synthesis module in kb/modules/ at present. A future
  iron_sulfur_cluster_biogenesis module would be a natural home for this entry
  alongside IREB2-Related_Neurodegeneration and Lipoic_Acid_Synthetase_Deficiency.

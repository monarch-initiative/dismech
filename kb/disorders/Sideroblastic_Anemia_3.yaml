  - reference: PMID:34732213
    reference_title: "GLRX5-associated [Fe-S] cluster biogenesis disorder: further characterisation of the neurological phenotype and long-term outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Bi-allelic pathogenic variants in the gene encoding GLRX5, a protein involved

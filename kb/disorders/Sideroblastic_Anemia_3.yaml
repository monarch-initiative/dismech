  evidence:
  - reference: PMID:17485548
    reference_title: The human counterpart of zebrafish shiraz shows sideroblastic-like microcytic anemia and iron overload.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patient had a homozygous (c.294A>G) mutation that interferes with intron
      1 splicing and drastically reduces GLRX5 RNA.
    explanation: >-
      The first reported causative GLRX5 genotype, with its molecular
      consequence.
  - reference: PMID:30660387
    reference_title: GLRX5 mutations impair heme biosynthetic enzymes ALA synthase 2 and ferrochelatase in Human congenital sideroblastic anemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patient was a young female with biallelic compound heterozygous
      mutations in GLRX5 (p.Cys67Tyr and p.Met128Lys).
    explanation: >-

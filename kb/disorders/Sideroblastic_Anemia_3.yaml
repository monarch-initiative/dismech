genetic:
- name: GLRX5 pathogenic variants (sideroblastic anemia phenotype)
  gene_term:
    preferred_term: GLRX5
    term:
      id: hgnc:20134
      label: GLRX5
  association: Causative
  relationship_type: CAUSATIVE
  notes: >-
    Alleles reported with the isolated sideroblastic anemia phenotype include the

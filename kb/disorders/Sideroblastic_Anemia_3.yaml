prevalence:
- population: Global published literature
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    A time-bounded diagnosed-case count from the literature as of 2019, not a
    population prevalence estimate. GLRX5 is one of the rarest causes within
    congenital sideroblastic anemia, which is itself a rare disease dominated by
    X-linked ALAS2 deficiency.
  evidence:
  - reference: PMID:30660387
    reference_title: GLRX5 mutations impair heme biosynthetic enzymes ALA synthase 2 and ferrochelatase in Human congenital sideroblastic anemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Herein we explored a new case of cSA with two mutations in GLRX5, a gene for
      which only two patients have been reported so far.
    explanation: >-
      Direct published patient-count statement as of 2019.
  - reference: PMID:24003969
    reference_title: Pathophysiology and genetic mutations in congenital sideroblastic anemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most common form is X-linked sideroblastic anemia, due to mutations in
      the erythroid-specific δ-aminolevulinate synthase (ALAS2), which is the first
      enzyme of the heme biosynthesis pathway in erythroid cells.
    explanation: >-
      Establishes that GLRX5 is a minor contributor relative to ALAS2 within
      congenital sideroblastic anemia.
pathophysiology:
- name: GLRX5 Deficiency and Impaired Iron-Sulfur Cluster Biogenesis
  biological_scale: MOLECULAR
  description: >-
    Biallelic GLRX5 variants reduce or abolish glutaredoxin 5, a mitochondrial
    protein that homodimerises and assembles a [2Fe-2S] cluster, and is required
    for iron-sulfur cluster biogenesis. GLRX5 is highly expressed in erythroid
    cells, which is one reason the phenotype is erythroid-predominant.
  genes:
  - preferred_term: GLRX5
    term:
      id: hgnc:20134
      label: GLRX5
  biological_processes:
  - preferred_term: iron-sulfur cluster assembly
    modifier: DECREASED
    term:
      id: GO:0016226
      label: iron-sulfur cluster assembly
  cellular_components:
  - preferred_term: mitochondrion
    term:
      id: GO:0005739
      label: mitochondrion
  evidence:
  - reference: PMID:20364084
    reference_title: Glutaredoxin 5 deficiency causes sideroblastic anemia by specifically impairing heme biosynthesis and depleting cytosolic iron in human erythroblasts.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      GLRX5, a mitochondrial protein that is highly expressed in erythroid cells,
      can homodimerize
    explanation: >-
      Establishes GLRX5 mitochondrial localisation and erythroid enrichment. The
      quote stops before the cluster-assembly clause because the reference
      validator strips the bracketed chemical notation that follows.
  - reference: PMID:20364084
    reference_title: Glutaredoxin 5 deficiency causes sideroblastic anemia by specifically impairing heme biosynthesis and depleting cytosolic iron in human erythroblasts.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      the iron-responsive element-binding (IRE-binding) activity of iron regulatory
      protein 1 (IRP1) was activated, and increased IRP2 levels, indicative of
      relative cytosolic iron depletion, were observed together with mitochondrial
      iron overload.
    explanation: >-
      The central mechanistic observation linking cluster failure, IRP1
      activation and the two-compartment iron abnormality.
  - reference: PMID:30660387
    reference_title: GLRX5 mutations impair heme biosynthetic enzymes ALA synthase 2 and ferrochelatase in Human congenital sideroblastic anemia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Collectively, our study demonstrates the key role of GLRX5 in modulating
      ALAS2 and ferrochelatase activities and in maintaining mitochondrial
      function.
    explanation: >-
      The authors' own summary of GLRX5's role in the two heme enzymes and in
      mitochondrial maintenance.
  downstream:
  - target: IRP1 Activation and Iron-Responsive Element Binding
    description: >-
      Loss of its [4Fe-4S] cluster converts IRP1 from cytosolic aconitase into its
      iron-responsive-element-binding form.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:17485548
      reference_title: The human counterpart of zebrafish shiraz shows sideroblastic-like microcytic anemia and iron overload.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        As in shiraz, aconitase and H-ferritin levels were low and TfR level was
        high in the patient's cells, compatible with increased IRP1 binding.
      explanation: >-
        Patient-cell evidence for IRP1 activation: low aconitase with the
        reciprocal ferritin/transferrin-receptor signature.
- name: IRP1 Activation and Iron-Responsive Element Binding
  biological_scale: MOLECULAR
  description: >-
    Activated IRP1 binds iron-responsive elements, stabilising transferrin
    receptor 1 mRNA and repressing translation of transcripts carrying a
    5'-iron-responsive element, which in erythroid cells includes ferritin and
    ALAS2. Erythroblasts are unusual in expressing both the IRP-repressible ALAS2
    and a non-IRP-repressible ferroportin isoform, and this particular
    combination of IRP targets is what makes the phenotype erythroid-specific.
  biological_processes:
  - preferred_term: cellular iron ion homeostasis
    modifier: ABNORMAL
    term:
      id: GO:0006879
      label: intracellular iron ion homeostasis
  evidence:
  - reference: PMID:17485548
    reference_title: The human counterpart of zebrafish shiraz shows sideroblastic-like microcytic anemia and iron overload.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      This leads to stabilization of transferrin receptor 1 (TfR) RNA, repression
      of ferritin, and ALA-synthase 2 (ALAS2) translation with impaired heme
      synthesis.
    explanation: >-
      States the IRP1 consequence chain. Cited as MODEL_ORGANISM because in this
      sentence the authors are describing the zebrafish shiraz mechanism.
  - reference: PMID:20364084
    reference_title: Glutaredoxin 5 deficiency causes sideroblastic anemia by specifically impairing heme biosynthesis and depleting cytosolic iron in human erythroblasts.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Erythroblasts express both IRP-repressible ALAS2 and non-IRP-repressible
      ferroportin 1b. The unique combination of IRP targets likely accounts for the
      tissue-specific phenotype of human GLRX5 deficiency.
    explanation: >-
      The authors' explanation for why an IRP defect produces an
      erythroid-restricted phenotype.
  downstream:
  - target: Erythroid Heme Synthesis Failure
    description: >-
      IRP-mediated translational repression of ALAS2, the rate-limiting erythroid
      heme enzyme, blocks heme synthesis in the developing red cell.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:20364084
      reference_title: Glutaredoxin 5 deficiency causes sideroblastic anemia by specifically impairing heme biosynthesis and depleting cytosolic iron in human erythroblasts.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Decreased aminolevulinate delta, synthase 2 (ALAS2) levels attributable to
        IRP-mediated translational repression were observed in erythroid cells in
        which GLRX5 expression had been downregulated using siRNA along with marked
        reduction in ferrochelatase levels and increased ferroportin expression.
      explanation: >-
        Direct demonstration of IRP-mediated ALAS2 repression on GLRX5 knockdown
        in human erythroid cells.
  - target: Mitochondrial Iron Overload and Ring Sideroblast Formation
    description: >-
      Relative cytosolic iron depletion with continued mitochondrial iron import,
      in the face of blocked heme synthesis, loads iron into perinuclear
      mitochondria.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:20364084
      reference_title: Glutaredoxin 5 deficiency causes sideroblastic anemia by specifically impairing heme biosynthesis and depleting cytosolic iron in human erythroblasts.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        increased IRP2 levels, indicative of relative cytosolic iron depletion,
        were observed together with mitochondrial iron overload
      explanation: >-
        Documents the simultaneous cytosolic depletion and mitochondrial overload
        that produce ring sideroblasts.
- name: Erythroid Heme Synthesis Failure
  biological_scale: CELLULAR
  description: >-
    ALAS2, the first and rate-limiting erythroid heme enzyme, is translationally
    repressed by activated IRP. This is the IRP-dependent arm of the heme block and
    is separated from the ferrochelatase arm below because the two are independent
    consequences of the same upstream lesion by different routes: this one through
    translational repression, the other through loss of an iron-sulfur cluster from
    the enzyme itself.
  cell_types:
  - preferred_term: erythroblast
    term:
      id: CL:0000765
      label: erythroblast
  biological_processes:
  - preferred_term: heme biosynthetic process
    modifier: DECREASED
    term:
      id: GO:0006783
      label: heme biosynthetic process
  evidence:
  - reference: PMID:20364084
    reference_title: Glutaredoxin 5 deficiency causes sideroblastic anemia by specifically impairing heme biosynthesis and depleting cytosolic iron in human erythroblasts.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here we report that GLRX5 is essential for iron-sulfur cluster biosynthesis
      and the maintenance of normal mitochondrial and cytosolic iron homeostasis in
      human cells.
    explanation: >-
      Establishes the human-cell requirement for GLRX5 in both cluster synthesis
      and iron compartmentalisation.
  downstream:
  - target: Ferrochelatase Activity Loss
    description: >-
      The same iron-sulfur cluster failure that activates IRP1 also strips the
      cluster from ferrochelatase, so the terminal heme enzyme loses activity
      independently of the ALAS2 repression above.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:30660387
      reference_title: GLRX5 mutations impair heme biosynthetic enzymes ALA synthase 2 and ferrochelatase in Human congenital sideroblastic anemia.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Collectively, our study demonstrates the key role of GLRX5 in modulating
        ALAS2 and ferrochelatase activities and in maintaining mitochondrial
        function.
      explanation: >-
        Names both enzymes as GLRX5-dependent, which is the basis for modelling
        them as two arms rather than one.
  - target: Microcytic anemia
    description: Failed erythroid heme synthesis produces hypochromic microcytic anemia.
    causal_link_type: DIRECT
  - target: Ring sideroblasts
    description: >-
      Iron that cannot be incorporated into heme is deposited in perinuclear
      mitochondria.
    causal_link_type: DIRECT
- name: Ferrochelatase Activity Loss
  biological_scale: MOLECULAR
  description: >-
    Ferrochelatase, the terminal heme enzyme, loses activity while its protein level
    is normal or even INCREASED, because ferrochelatase is itself an iron-sulfur
    cluster enzyme. The defect is functional, not expression-level, which is why
    measuring protein abundance would miss it. The combination of very low
    ferrochelatase activity WITHOUT accumulation of porphyrin precursors is what
    distinguishes this from erythropoietic protoporphyria, where ferrochelatase
    alone is impaired.
  cell_types:
  - preferred_term: erythroblast
    term:
      id: CL:0000765
      label: erythroblast
  evidence:
  - reference: PMID:30660387
    reference_title: GLRX5 mutations impair heme biosynthetic enzymes ALA synthase 2 and ferrochelatase in Human congenital sideroblastic anemia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The protein-level of ferrochelatase, the terminal-enzyme of heme process, was
      increased both in patient-derived lymphoblastoid and CD34+ cells, however,
      its activity was drastically decreased.
    explanation: >-
      Shows the ferrochelatase defect is functional rather than expression-level,
      consistent with loss of its iron-sulfur cluster.
  - reference: PMID:30660387
    reference_title: GLRX5 mutations impair heme biosynthetic enzymes ALA synthase 2 and ferrochelatase in Human congenital sideroblastic anemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thus, the patient exhibits both a very low ferrochelatase activity without
      any accumulation of porphyrins precursors in contrast to what is reported in
      erythropoietic protoporphyria with solely impaired ferrochelatase activity.
    explanation: >-
      The discriminating biochemical observation against erythropoietic
      protoporphyria.
  downstream:
  - target: Microcytic anemia
    description: >-
      Loss of the terminal heme enzyme compounds the ALAS2 block, deepening the
      erythroid heme deficit.
    causal_link_type: DIRECT
- name: Mitochondrial Iron Overload and Ring Sideroblast Formation
  biological_scale: CELLULAR
  description: >-
    Mitochondrial iron accumulation in erythroblasts produces ring sideroblasts,
    and drives systemic iron overload. In one patient this was accompanied by
    oxidative stress with mitochondrial DNA depletion and damage, reduced
    respiratory complex I and IV activity and depleted ATP, indicating the injury
    extends beyond heme synthesis.
  cell_types:
  - preferred_term: erythroblast
    term:
      id: CL:0000765
      label: erythroblast
  evidence:
  - reference: PMID:17485548
    reference_title: The human counterpart of zebrafish shiraz shows sideroblastic-like microcytic anemia and iron overload.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report the first case of GLRX5 deficiency in a middle-aged anemic male
      with iron overload and a low number of ringed sideroblasts.
    explanation: >-
      The index patient's ring sideroblasts and iron overload. Note the ring
      sideroblast count was low, not florid.
  - reference: PMID:30660387
    reference_title: GLRX5 mutations impair heme biosynthetic enzymes ALA synthase 2 and ferrochelatase in Human congenital sideroblastic anemia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      This oxidative stress depleted and damaged mtDNA, decreased complex I and IV
      activities and depleted ATP content.
    explanation: >-
      Evidence for broader mitochondrial injury downstream of the iron and
      cluster defect.
  downstream:
  - target: Ring sideroblasts
    description: Perinuclear mitochondrial iron deposition is seen as ring sideroblasts.
  - target: Iron overload
    description: >-
      Systemic iron overload develops and is aggravated by transfusion.
phenotypes:
- name: Microcytic anemia
  description: >-
    Hypochromic microcytic anemia is the presenting feature, reflecting failed
    erythroid heme synthesis. No frequency band is assigned: with a handful of
    patients reported worldwide, the available sources are case reports, and a
    frequency band is a separate quantitative claim from the association. It is
    almost certainly obligate, but no source states that.
  phenotype_term:
    preferred_term: Microcytic anemia
    term:
      id: HP:0001935
      label: Microcytic anemia
  evidence:
  - reference: PMID:17485548
    reference_title: The human counterpart of zebrafish shiraz shows sideroblastic-like microcytic anemia and iron overload.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report the first case of GLRX5 deficiency in a middle-aged anemic male
      with iron overload and a low number of ringed sideroblasts.
    explanation: >-
      Anemia in the index patient; the paper title specifies it as
      sideroblastic-like microcytic anemia.
- name: Ring sideroblasts
  description: >-
    Ring sideroblasts on bone marrow examination define the sideroblastic anemias.
    In GLRX5 deficiency their number can be low, so a sparse count does not
    exclude the diagnosis.
  phenotype_term:
    preferred_term: Ring sideroblasts
    term:
      id: HP:0004864
      label: Elevated bone marrow ring sideroblast count
  evidence:
  - reference: PMID:17485548
    reference_title: The human counterpart of zebrafish shiraz shows sideroblastic-like microcytic anemia and iron overload.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report the first case of GLRX5 deficiency in a middle-aged anemic male
      with iron overload and a low number of ringed sideroblasts.
    explanation: >-
      Documents ring sideroblasts, and specifically that they were few in number.
- name: Iron overload
  description: >-
    Systemic iron overload accompanies the anemia and is worsened by transfusion.
    This inversion of the usual anemia-transfusion relationship is the clinically
    important feature of the disease.
  phenotype_term:
    preferred_term: Increased circulating iron concentration
    term:
      id: HP:0003452
      label: Increased circulating iron concentration
  evidence:
  - reference: PMID:17485548
    reference_title: The human counterpart of zebrafish shiraz shows sideroblastic-like microcytic anemia and iron overload.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Anemia was worsened by blood transfusions but partially reversed by iron
      chelation.
    explanation: >-
      The pivotal clinical observation: transfusion worsened and chelation
      partially reversed the anemia.
- name: Abnormal iron deposition in mitochondria
  description: >-
    Mitochondrial iron overload in erythroblasts, the cellular substrate of the
    ring sideroblast and the direct consequence of iron entering the mitochondrion
    faster than blocked heme synthesis can consume it.
  phenotype_term:
    preferred_term: Abnormal iron deposition in mitochondria
    term:
      id: HP:0008306
      label: Abnormal iron deposition in mitochondria
  evidence:
  - reference: PMID:20364084
    reference_title: Glutaredoxin 5 deficiency causes sideroblastic anemia by specifically impairing heme biosynthesis and depleting cytosolic iron in human erythroblasts.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      increased IRP2 levels, indicative of relative cytosolic iron depletion, were
      observed together with mitochondrial iron overload
    explanation: >-
      Direct measurement of mitochondrial iron overload in GLRX5-deficient human
      cells, alongside the reciprocal cytosolic depletion.

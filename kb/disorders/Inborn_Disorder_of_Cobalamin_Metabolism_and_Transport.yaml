- name: cblX
  display_name: cblX type (HCFC1, X-linked)
  description: >-
    X-linked disorder caused by hemizygous HCFC1 variants that reduce MMACHC expression, producing
    a cblC-like combined biochemical phenotype with prominent intractable epilepsy and severe
    neurodevelopmental impairment. Unlike the autosomal recessive complementation groups, cblX
    follows X-linked inheritance. HCFC1 acts in a complex with THAP11 and with the
    sequence-specific DNA-binding protein ZNF143; biallelic variants in either of those two
    partners cause autosomal recessive cblX-like disease, which is a different mode of inheritance
    and so is kept off this row. The THAP11 form has its own row below; ZNF143 has no
    gene-specific class in MONDO and is recorded in this entry's genetic section.
  subtype_term:
    preferred_term: methylmalonic acidemia with homocystinuria, type cblX

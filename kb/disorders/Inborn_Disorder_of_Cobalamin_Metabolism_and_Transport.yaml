notes: >-
  Scope and anchor. This entry is the umbrella class MONDO:0019220, which asserts no causal gene of
  its own, and every subtype row below binds a class that resolves inside that class's subtree. The
  rows are the complementation groups plus transcobalamin II deficiency, which is a transport rather
  than a processing defect.


  Imerslund-Grasbeck syndrome. MONDO:0009853 and its two gene-specific children sit under this
  umbrella, but the disease belongs to the intestinal-absorption arm of the group rather than to
  intracellular cobalamin processing: the GeneReviews chapter on disorders of intracellular
  cobalamin metabolism, which supplies the gene-to-group assignments used above, names neither CUBN
  nor AMN nor Imerslund-Grasbeck syndrome. MONDO:0100156 is the disease_term of
  kb/disorders/Imerslund-Grasbeck_Syndrome_Type_1.yaml and MONDO:0100157, the AMN form, is bound as
  a differential diagnosis in that same entry, so neither is repeated as a subtype row here.


  The cblL class. MONDO:0975798 carries no definition, no synonym and no causal-gene axiom; its
  OMIM equivalence, OMIM:620940, is the only record of what it denotes, and that OMIM entry is the
  THAP11 disorder. Its MONDO primary label spells the group "cb1L" with the digit one, the spelling
  GTR supplies for the same concept, while OMIM spells it cblL; term.label above copies MONDO
  verbatim and preferred_term carries the intended spelling.


  Forms with no class to bind. A synonym-inclusive OLS4 search of MONDO for ZNF143 returns nothing,
  so the ZNF143 cblX-like form is held in the genetic section rather than as a subtype row. Searches
  for "epi-cblC" and for PRDX1 likewise return nothing, so the epi-cblC form, in which MMACHC is
  silenced epigenetically rather than mutated, has no class to bind and is not represented here
  either.

pathophysiology:
- name: Defective cobalamin absorption, transport, and cellular uptake
  description: >-
    Genetic defects in transcobalamin II (TCN2) and the lysosomal cobalamin exporters LMBRD1
    (cblF) and ABCD4 (cblJ) impair the delivery of dietary cobalamin from the bloodstream into
    the cytosolic compartment where it is processed into active cofactors. Reduced cellular
    cobalamin availability functionally starves the downstream cofactor-dependent enzymes.
  genes:
  - preferred_term: TCN2
    term:
      id: hgnc:11653
      label: TCN2
  - preferred_term: LMBRD1
    term:
      id: hgnc:23038
      label: LMBRD1
  - preferred_term: ABCD4
    term:
      id: hgnc:68
      label: ABCD4
  biological_processes:
  - preferred_term: cobalamin transport
    term:
      id: GO:0015889
      label: cobalamin transport
    modifier: DECREASED
  chemical_entities:
  - preferred_term: cobalamin
    term:
      id: CHEBI:30411
      label: cobalamin
    modifier: DECREASED
  downstream:
  - target: Impaired intracellular cobalamin cofactor synthesis
    description: >-
      Reduced cellular cobalamin uptake limits the substrate available for conversion into
      methylcobalamin and adenosylcobalamin.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:39125597
    reference_title: "Vitamin B(12) Metabolism: A Network of Multi-Protein Mediated Processes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Beyond inadequate dietary intake, vitamin B12 deficiency might be caused by insufficient bioavailability, blood transport disruptions, or impaired cellular uptake and metabolism."
    explanation: Supports defects of transport and cellular uptake as a mechanism producing functional cobalamin deficiency.
- name: Reduced MMACHC expression from HCFC1-THAP11-ZNF143 transcriptional dysfunction
  description: >-
    HCFC1 is a transcriptional cofactor that acts with the sequence-specific DNA-binding protein
    ZNF143 and with THAP11 (RONIN) to regulate MMACHC. Hemizygous HCFC1 variants (cblX) and
    biallelic THAP11 or ZNF143 variants (cblX-like) reduce MMACHC expression, so the cblC lesion
    is reproduced without any variant in MMACHC itself. Cells carrying these mutations behave as
    cblC phenocopies, and GeneReviews lists all three genes alongside MMACHC as genes in which a
    pathogenic variant confirms the diagnosis.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: HCFC1
    term:
      id: hgnc:4839
      label: HCFC1
  - preferred_term: THAP11
    term:
      id: hgnc:23194
      label: THAP11
  - preferred_term: ZNF143
    term:
      id: hgnc:12928
      label: ZNF143
  biological_processes:
  - preferred_term: regulation of MMACHC transcription
    term:
      id: GO:0006355
      label: regulation of DNA-templated transcription
    modifier: ABNORMAL
  downstream:
  - target: Impaired intracellular cobalamin cofactor synthesis
    description: >-
      Loss of MMACHC expression removes the same cytosolic cobalamin-processing step that biallelic
      MMACHC variants remove, so the two routes converge on one lesion.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:35013307
      reference_title: "Mutations in Hcfc1 and Ronin result in an inborn error of cobalamin metabolism and ribosomopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: "Since HCFC1/RONIN jointly regulate MMACHC, patients with mutations in these factors suffer from reduced MMACHC expression and exhibit a cblC-like disease."
      explanation: States that reduced MMACHC expression is the route by which HCFC1 and THAP11 variants produce cblC-like disease.
  evidence:
  - reference: PMID:35013307
    reference_title: "Mutations in Hcfc1 and Ronin result in an inborn error of cobalamin metabolism and ribosomopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: "Recently, mutations in the transcriptional regulators HCFC1 and RONIN (THAP11) were shown to result in cellular phenocopies of cblC."
    explanation: Supports HCFC1 and THAP11 variants producing a cellular cblC phenocopy, the basis for treating this as one mechanism node.
  - reference: PMID:38617190
    reference_title: "Overexpression of MMACHC Prevents Craniofacial Phenotypes Caused by Knockdown of znf143b."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "In humans, ZNF143 interacts with HCFC1, a transcriptional cofactor, to regulate the expression of downstream target genes, including MMACHC, which encodes an enzyme involved in cobalamin (cbl) metabolism."
    explanation: Establishes ZNF143 as the third member of the complex that regulates MMACHC, which is why it is bound on this node.
  - reference: PMID:20301503
    reference_title: "Disorders of Intracellular Cobalamin Metabolism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Diagnosis is confirmed by identification of biallelic pathogenic variants in one of the following genes (associated complementation groups indicated in parentheses): MMACHC (cblC), MMADHC (cblD-combined and cblD-homocystinuria), MTRR (cblE), LMBRD1 (cblF), MTR (cblG), ABCD4 (cblJ), THAP11(cblX-like), ZNF143(cblX-like), or a hemizygous variant in HCFC1 (cblX, which can show a cblC complementation class)."
    explanation: GeneReviews lists HCFC1, THAP11 and ZNF143 alongside MMACHC as genes in which a pathogenic variant confirms the diagnosis, and records the cblC complementation behaviour of the HCFC1 form.

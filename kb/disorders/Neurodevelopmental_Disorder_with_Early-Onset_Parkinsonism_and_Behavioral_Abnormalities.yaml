- name: Corticospinal Tract Dysfunction
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  description: >-
    A pyramidal arm that is separable from the parkinsonian arm and, in some
    families, precedes it by decades. Affected individuals in the South African
    and Omani kindreds developed generalized spasticity, brisk reflexes and
    upgoing toes in childhood, alongside the developmental phase; in the most
    severely affected individual this worsened over time to loss of independent
    ambulation. Notably, the pyramidal arm is not universal - the Pakistani
    family had a mildly ataxic gait explicitly without spasticity or hemiparesis
    - so spasticity is a frequent but not obligate feature.
  locations:
  - preferred_term: corticospinal tract
    term:
      id: UBERON:0002707
      label: corticospinal tract
  evidence:
  - reference: PMID:34765690
    reference_title: "Biallelic PTRHD1 Frameshift Variants Associated with Intellectual Disability, Spasticity, and Parkinsonism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      all patients presented initially with global developmental delay during
      early childhood and onset of pyramidal signs including spasticity and
      hyperreflexia
    explanation: >-
      Establishes childhood-onset pyramidal involvement co-occurring with the
      developmental phase, before parkinsonism.
  - reference: PMID:34765690
    reference_title: "Biallelic PTRHD1 Frameshift Variants Associated with Intellectual Disability, Spasticity, and Parkinsonism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      these patients developed pyramidal signs consisting of spasticity,
      hyperreflexia, and upgoing toes
    explanation: Enumerates the pyramidal signs across the then-reported cohort.
  downstream:
  - target: Spasticity
    causal_link_type: DIRECT
    description: >-
        Velocity-dependent hypertonia from loss of corticospinal inhibition.
  - target: Hyperreflexia
    causal_link_type: DIRECT
    description: >-
        Brisk deep tendon reflexes from the same upper-motor-neuron lesion.
  - target: Extensor plantar response
    causal_link_type: DIRECT
    description: >-
        Upgoing toes completing the pyramidal picture.


- name: Nigrostriatal Dopaminergic Neuron Degeneration
  biological_scale: CELLULAR
  mechanism_confidence: HYPOTHETICAL
  conforms_to: "parkinsonism_dopaminergic_degeneration#Nigrostriatal Dopaminergic Neurodegeneration"
  description: >-
    Inferred second arm of the biphasic course. Years to decades after the
    static developmental phase, affected individuals develop progressive
    parkinsonism that in most reported patients has been levodopa-responsive,
    implying a presynaptic nigrostriatal dopaminergic deficit. PTRHD1 is
    expressed in the substantia nigra, striatum, and putamen, providing an
    anatomical substrate. This node is nonetheless marked HYPOTHETICAL and is a
    declared knowledge gap: no neuropathology has ever been reported for a
    PTRHD1 patient, and no dopamine-transporter (DaT-SPECT) imaging result has
    been published - the Omani proband with parkinsonism explicitly had no
    DaTscan available. Conformance to the shared
    parkinsonism_dopaminergic_degeneration module is therefore asserted on
    pharmacological and expression grounds, not on direct demonstration of
    nigral cell loss in this disease.
  cell_types:
  - preferred_term: midbrain dopaminergic neuron
    term:
      id: CL:0000700
      label: dopaminergic neuron
  locations:
  - preferred_term: substantia nigra pars compacta
    term:
      id: UBERON:0001965
      label: substantia nigra pars compacta
  evidence:
  - reference: PMID:34765690
    reference_title: "Biallelic PTRHD1 Frameshift Variants Associated with Intellectual Disability, Spasticity, and Parkinsonism."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most of these patients developed levodopa‐responsive parkinsonism symptoms
      around the third and fourth decade.
    explanation: >-
      Reported for most of the seven patients in the three families known as of
      2021. Levodopa responsiveness is indirect evidence of a presynaptic
      nigrostriatal dopaminergic deficit with preserved postsynaptic striatal
      targets; it does not itself demonstrate neuronal loss.
  - reference: PMID:41918506
    reference_title: "Homozygous PTRHD1 Mutation in Intellectual Disability and Atypical Parkinsonism."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We found expression of PTRHD1 in different brain parts including the
      striatum and putamen, which are involved in degenerative neurological
      disorders.
    explanation: >-
      Expression in the relevant basal-ganglia structures supports, but does not
      prove, a nigrostriatal locus of degeneration.
  - reference: PMID:36699000
    reference_title: "Parkinsonism in Genetic Neurodevelopmental Disorders: A Systematic Review."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Results of dopaminergic imaging and response to antiparkinsonian
      medication often supported the neurodegenerative nature of parkinsonism.
    explanation: >-
      Class-level evidence that in genetic neurodevelopmental disorders with
      parkinsonism (a group that explicitly includes PTRHD1) the motor arm is
      generally neurodegenerative rather than developmental; PTRHD1-specific
      imaging and neuropathology are still absent.
  downstream:
  - target: Striatal Dopamine Deficiency and Basal Ganglia Motor Circuit Dysfunction
    causal_link_type: DIRECT
  - target: Dementia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Late cognitive decline appears in the same decade as the motor features,
      superimposed on the static developmental impairment. It is placed on the
      degenerative arm because of that temporal coupling; its anatomical
      substrate has never been examined in this disorder, so the intermediates
      are unknown.

- name: Striatal Dopamine Deficiency and Basal Ganglia Motor Circuit Dysfunction
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  conforms_to: "parkinsonism_dopaminergic_degeneration#Striatal Dopamine Deficiency and Basal Ganglia Circuit Dysfunction"
  description: >-
    Loss of nigrostriatal dopaminergic input unbalances the basal ganglia motor
    circuit, producing the clinical parkinsonian syndrome: bradykinesia with
    rest and postural tremor, muscle stiffness/rigidity, postural instability,
    and gait disturbance. The syndrome is levodopa-responsive in most reported
    patients, consistent with a dopamine-replaceable striatal deficit. It is
    also atypical in an important minority: one family developed bradykinesia,
    tremor and dementia in the fourth decade with neither muscle rigidity nor
    postural instability, and with a mildly ataxic rather than parkinsonian
    gait, widening the syndrome beyond pure parkinsonism.
  locations:
  - preferred_term: striatum
    term:
      id: UBERON:0002435
      label: striatum
  biological_processes:
  - preferred_term: dopamine secretion
    term:
      id: GO:0014046
      label: dopamine secretion
    modifier: DECREASED
  evidence:
  - reference: PMID:27753167
    reference_title: "PTRHD1 (C2orf79) mutations lead to autosomal-recessive intellectual disability and parkinsonism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      presented with ID, muscle stiffness, rest and postural tremor, postural
      instability, gait disturbances, speech difficulties, as well as
      psychiatric symptoms such as anxiety, hypersomnia, and hypersexuality.
    explanation: >-
      Documents the full parkinsonian motor syndrome (stiffness, rest and
      postural tremor, postural instability, gait disturbance) in the index
      family.
  - reference: PMID:41918506
    reference_title: "Homozygous PTRHD1 Mutation in Intellectual Disability and Atypical Parkinsonism."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There was no muscle rigidity and postural instability, but there were
      unusual features of exotropia, pectus excavatum, and prominent clavicles.
    explanation: >-
      Counter-evidence delimiting the syndrome: in the Pakistani family the
      cardinal signs of rigidity and postural instability were absent even in
      the eldest affected sibling, so these are not obligate features.
  downstream:

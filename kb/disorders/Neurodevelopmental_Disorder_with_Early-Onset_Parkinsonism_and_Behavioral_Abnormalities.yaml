notes: >-
  Named-entity-confusion (NEC) preflight. This entity sits in the very
  high-NEC-risk "neurodevelopmental disorder with ..." OMIM series and in the
  crowded early-onset-parkinsonism gene space, so the identity was pinned before
  any deep-research content was used. `uv run runoak -i sqlite:obo:mondo info
  MONDO:0958323 -O obo` returns three identity anchors that all agree:
  `relationship: RO:0004003 HGNC:33782 ! PTRHD1`, `xref: OMIM:620747`, and
  `xref: MEDGEN:1857802`, with `is_a: MONDO:0100500 ! Mendelian
  neurodevelopmental disorder`. Every cited paper was screened to be about
  PTRHD1 and not one of the locus- or phenotype-adjacent early-onset
  parkinsonism genes (PRKN/PARK2, PINK1, PARK7/DJ-1, ATP13A2, SYNJ1, DNAJC6,
  FBXO7, PLA2G6, VPS13C, RAB39B). The ones that already exist as dismech
  entries - PRKN, PARK7 and ATP13A2 (as Kufor-Rakeb syndrome) - are curated
  explicitly under `differential_diagnoses`; the remainder are covered by the
  atypical-juvenile-parkinsonism gene-panel evidence on the Kufor-Rakeb entry,
  which also records VPS13C as the closest phenotypic comparator to PTRHD1. The falcon deep-research report generated for this
  entry was NEC-screened by gene-mention frequency: PTRHD1 42 mentions versus 1
  each for PRKN, PINK1, PARK7, ATP13A2, SYNJ1, DNAJC6 and FBXO7, and 0 for
  ADORA1 - consistent with the intended entity.

  ADORA1 disambiguation (a documented historical misattribution, not a
  competing gene). The first family in which the disease allele was found
  (PMID:27134041, Jaberi et al. 2016, an Iranian kindred with early-onset
  parkinsonism and cognitive dysfunction) nominated ADORA1 p.Gly279Ser as the
  likely cause while also reporting the homozygous PTRHD1 c.155G>A
  (p.Cys52Tyr) allele. Khodadadi et al. (PMID:27753167) subsequently genotyped
  and sequenced ADORA1 in their own family, found no pathogenic ADORA1 variant
  and incomplete homozygosity across the ADORA1 locus, and concluded that
  PTRHD1 is the causative gene in both families. Note that the PTRHD1 c.155G>A
  allele in the 2016 family is documented in Khodadadi's account of it, not in
  the PMID:27134041 abstract, which does not mention PTRHD1 at all. A follow-up
  letter from the original group (PMID:29143421) shifted the attribution toward
  PTRHD1 but did not fully retract ADORA1 - only its title could be verified
  here (the cache body is unavailable), and that title reads "PTRHD1 and
  possibly ADORA1 mutations contribute to Parkinsonism with intellectual
  disability", i.e. ADORA1 is retained as a possible contributor. The same
  p.Cys52Tyr allele has since been found in an unrelated Pakistani family
  (PMID:41918506). On the balance of that evidence ADORA1 is deliberately NOT
  curated as a causal or modifier gene here. PMID:29143421 has no abstract and
  is cited by no evidence item for that reason; it and PMID:27134041 are
  retained in the top-level `references:` block as provenance for this
  disambiguation.

  CENPO disambiguation. Open Targets returns CENPO as a second, weaker
  association for MONDO:0958323 (surfaced in the falcon report). This appears to
  reflect overlapping locus/variant records at 2p23 rather than an
  independently established second cause, and CENPO is deliberately not curated
  as a causal gene.

  GeneReviews baseline. A PubMed search for a GeneReviews chapter
  (`PTRHD1 GeneReviews[All Fields]`) returned no results; there is no
  GeneReviews chapter for PTRHD1-related disease, and none is tagged in
  `references:`. The clinical baseline used instead is the primary case-series
  literature plus two systematic reviews (PMID:34630269, PMID:36699000).

  Sourcing provenance. One deep-research run was performed (falcon, 2026-08-15,
  516 s). It was used only as a lead generator: it surfaced the two review
  articles and the Open Targets/CENPO caveat, but it produced no verbatim
  patient-level quotations (its own report states that "fabricated quotations
  have not been supplied"). All evidence items in this entry were built from
  PMIDs located by direct PubMed E-utilities search on `PTRHD1` (18 hits, all
  triaged), fetched with `just fetch-reference`, and quoted from the cached
  text. No claim rests on deep-research narrative alone.

  Scope note on parkinsonism phenotype terms. Two published families report a
  parkinsonian syndrome that is explicitly atypical: PMID:41918506 documents
  bradykinesia, tremor and dementia in the fourth decade with NO muscle
  rigidity and NO postural instability, plus a mildly ataxic rather than
  parkinsonian gait. Rigidity and postural instability are therefore curated
  with `frequency: OCCASIONAL` and an explicit refuting evidence item rather
  than as obligate features.


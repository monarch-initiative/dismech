progression:
- phase: Phase 1 - static neurodevelopmental phase
  age_range: Late infancy to childhood
  notes: >-
    Developmental milestones are delayed from late infancy; motor milestones may
    be mildly late (one proband sat at 10 months and walked at 20 months) and
    speech is markedly delayed. This resolves into a stable, NON-progressive
    impairment of intellectual development with behavioral abnormalities, which
    can remain the sole presentation for two to four decades. In some families
    (Omani, South African) childhood pyramidal signs - spasticity and
    hyperreflexia - accompany this phase and are themselves slowly progressive.
  evidence:
  - reference: PMID:41918506
    reference_title: "Homozygous PTRHD1 Mutation in Intellectual Disability and Atypical Parkinsonism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Early onset and nonprogressive ID in the four siblings were assessed as
      mild to moderate
    explanation: Establishes the static character of the first phase.
  - reference: PMID:34765690
    reference_title: "Biallelic PTRHD1 Frameshift Variants Associated with Intellectual Disability, Spasticity, and Parkinsonism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All cases reported shared a consistent phenotype of delayed developmental
      milestones and moderate to severe ID. The onset of symptoms was present
      since late infancy.
    explanation: Fixes the late-infantile onset of the first phase.
- phase: Phase 2 - progressive motor-neurodegenerative phase
  age_range: Later childhood to fourth decade (most commonly third to fourth decade)
  notes: >-
    Progressive parkinsonism (bradykinesia, rest and postural tremor, variable
    rigidity and postural instability, gait disturbance) emerges after the
    static phase, frequently accompanied by late cognitive decline/dementia.
    Onset is variably penetrant and heterogeneous even within a single sibship:
    in one Omani family only one of four affected siblings had developed
    parkinsonism by the fourth decade, and in the Pakistani family the eldest
    sibling was the least affected. Motor features are levodopa-responsive in
    most reported patients.
  evidence:
  - reference: PMID:41918506
    reference_title: "Homozygous PTRHD1 Mutation in Intellectual Disability and Atypical Parkinsonism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In all 10 families, onset of ID was early childhood, and in parkinsonism,
      later childhood to the fourth decade.
    explanation: Gives the onset window for the second phase across all reported families.
  - reference: PMID:34765690
    reference_title: "Biallelic PTRHD1 Frameshift Variants Associated with Intellectual Disability, Spasticity, and Parkinsonism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Parkinsonism features developed during adulthood.
    explanation: Confirms adult onset of the motor phase in the Omani family.
  - reference: PMID:34765690
    reference_title: "Biallelic PTRHD1 Frameshift Variants Associated with Intellectual Disability, Spasticity, and Parkinsonism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Intrafamilial and disease symptoms heterogeneity were noted, including the
      onset of parkinsonism symptoms.
    explanation: Documents the intrafamilial variability in timing of the second phase.

imaging_findings:
- name: Unremarkable brain MRI
  modality: MRI
  description: >-
    Brain MRI has been grossly normal in reported patients, with no
    pathognomonic PTRHD1 pattern, no structural malformation, and no iron
    accumulation or other neurodegenerative signature described. This is
    diagnostically important: a normal MRI does not exclude the diagnosis, and
    imaging serves mainly to exclude structural and metabolic mimics.
  evidence:
  - reference: PMID:41918506
    reference_title: "Homozygous PTRHD1 Mutation in Intellectual Disability and Atypical Parkinsonism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The results of multiecho and multiplanar brain MRI were grossly
      unmarkable
    explanation: Documents normal brain MRI in four affected siblings.
  - reference: PMID:34765690
    reference_title: "Biallelic PTRHD1 Frameshift Variants Associated with Intellectual Disability, Spasticity, and Parkinsonism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The following investigations were within normal limits and included an
      inborn error of metabolism screen, thyroid function test, CK level,
      chromosomal microarray, and a brain magnetic resonance imaging (MRI)
      examination.
    explanation: >-
      Normal MRI plus normal metabolic and chromosomal-microarray workup in an
      Omani proband, underlining the genomic route to diagnosis.

treatments:
- name: Levodopa
  description: >-
    A monitored levodopa trial is the principal symptomatic option once
    parkinsonism becomes functionally limiting. Most reported PTRHD1 patients
    who developed parkinsonism in the third or fourth decade had
    levodopa-responsive symptoms, which is also the pharmacological basis for
    inferring a presynaptic nigrostriatal dopaminergic deficit. Quantitative
    response rates, durability, and dyskinesia risk have not been reported in
    this disorder, and at least one patient was unable to cooperate with a
    levodopa trial.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: levodopa
      term:
        id: CHEBI:15765
        label: L-dopa
  target_mechanisms:
  - target: Striatal Dopamine Deficiency and Basal Ganglia Motor Circuit Dysfunction
    description: >-
      Levodopa is decarboxylated to dopamine in surviving nigrostriatal
      terminals and other striatal cells, restoring striatal dopaminergic tone
      and correcting basal ganglia motor-circuit imbalance. It does not act on
      the upstream PTRHD1 lesion or on neuronal loss.
  evidence:
  - reference: PMID:34765690
    reference_title: "Biallelic PTRHD1 Frameshift Variants Associated with Intellectual Disability, Spasticity, and Parkinsonism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      responsive parkinsonism symptoms around the third and fourth decade
    explanation: >-
      Documents levodopa responsiveness of the parkinsonian arm across the
      reported PTRHD1 cohort.
  - reference: PMID:34765690
    reference_title: "Biallelic PTRHD1 Frameshift Variants Associated with Intellectual Disability, Spasticity, and Parkinsonism."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      She was not cooperative for the levodopa trial and OCD treatment.
    explanation: >-
      Illustrates a practical limitation: behavioral and cognitive impairment
      can prevent a formal levodopa trial, which is part of why response data
      are sparse.

- name: Genetic Counseling and Cascade Testing
  description: >-
    Because every reported family is consanguineous with biallelic transmission,
    genetic counseling for a 25% recurrence risk per pregnancy, carrier testing
    of at-risk relatives once the familial variant is known, and discussion of
    prenatal or preimplantation genetic testing are the principal preventive
    interventions.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  therapeutic_modality: BEHAVIORAL
  evidence:
  - reference: PMID:41722179
    reference_title: "Early-onset parkinsonism with intellectual disability in an Italian family associated with a PTRHD1 variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This study expands the mutational and geographical spectrum of
      PTRHD1-related disorders and reinforces the inclusion of PTRHD1 in genetic
      screening panels for early-onset parkinsonism, particularly in individuals
      with intellectual disability and evidence of autosomal recessive
      inheritance.
    explanation: >-
      Supports genomic testing (and hence counseling and cascade testing) as the
      actionable pathway in this recessive disorder.

- name: Multidisciplinary Supportive and Rehabilitative Care
  description: >-
    No disease-modifying therapy exists. Management is symptom-directed and
    lifelong: special educational placement and behavioral support for the
    developmental and psychiatric manifestations, speech and language therapy
    for the marked language delay, physiotherapy and mobility aids for
    spasticity and later parkinsonian gait impairment, and standard treatment of
    epilepsy and sleep disturbance where present. Longitudinal movement-disorder
    surveillance is warranted into adulthood because parkinsonism may emerge
    decades after the neurodevelopmental diagnosis.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  therapeutic_modality: BEHAVIORAL
  evidence:
  - reference: PMID:36699000
    reference_title: "Parkinsonism in Genetic Neurodevelopmental Disorders: A Systematic Review."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Findings from this study may provide clues for further research and
      improve management of patients with GNDs and/or parkinsonism.
    explanation: >-
      Class-level support for management of parkinsonism arising in genetic
      neurodevelopmental disorders; no PTRHD1-specific management trial exists.

differential_diagnoses:
- name: PRKN-Related Juvenile Parkinson Disease
  description: >-
    The commonest autosomal recessive early-onset parkinsonism. Like PTRHD1
    disease it is recessive, levodopa-responsive, and third-decade in onset, and
    it also implicates the ubiquitin-proteasome system (parkin is an E3
    ubiquitin ligase).
  distinguishing_features:
  - >-
    PRKN disease is a comparatively pure parkinsonism without a preceding static
    neurodevelopmental phase: intellectual development and childhood milestones
    are normal, and behavioral abnormalities are not a defining early feature.
    PTRHD1 disease is defined by the childhood cognitive/behavioral phase that
    precedes motor onset by decades.
  evidence:
  - reference: PMID:34630269
    reference_title: "Genotype-Phenotype Correlations in Monogenic Parkinson Disease: A Review on Clinical and Molecular Findings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among AR parkinsonisms, forms caused by biallelic pathogenic variants in
      the PRKN, PINK1, and DJ-1 genes are thus far considered pure forms of
      EOPD.
    explanation: >-
      States the key discriminator: PRKN/PINK1/DJ-1 cause pure early-onset
      Parkinson disease, whereas PTRHD1 causes a complicated form.
- name: PARK7-Related Early-Onset Parkinson Disease
  description: >-
    Autosomal recessive early-onset Parkinson disease caused by biallelic
    PARK7/DJ-1 loss of function, with onset typically in the third decade and a
    high burden of psychiatric and cognitive non-motor features.
  distinguishing_features:
  - >-
    PARK7 disease is classified among the pure forms of early-onset Parkinson
    disease; its cognitive and psychiatric features accompany or follow motor
    onset rather than constituting a preceding static childhood
    neurodevelopmental phase, and pyramidal signs are not a defining feature.
  evidence:
  - reference: PMID:34630269
    reference_title: "Genotype-Phenotype Correlations in Monogenic Parkinson Disease: A Review on Clinical and Molecular Findings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among AR parkinsonisms, forms caused by biallelic pathogenic variants in
      the PRKN, PINK1, and DJ-1 genes are thus far considered pure forms of
      EOPD.
    explanation: Groups DJ-1/PARK7 with the pure, non-syndromic recessive parkinsonisms.
- name: Kufor-Rakeb syndrome
  description: >-
    ATP13A2-related autosomal recessive juvenile parkinsonism with pyramidal
    signs, supranuclear gaze palsy, and cognitive decline - one of the closest
    clinical mimics of PTRHD1 disease among the atypical juvenile parkinsonisms.
  distinguishing_features:
  - >-
    Kufor-Rakeb typically shows supranuclear vertical gaze palsy,
    facial-faucial-finger mini-myoclonus, and often brain iron accumulation on
    MRI, and its cognitive decline is progressive dementia rather than a static
    childhood intellectual impairment. Brain MRI in PTRHD1 disease is grossly
    normal.
  evidence:
  - reference: PMID:27753167
    reference_title: "PTRHD1 (C2orf79) mutations lead to autosomal-recessive intellectual disability and parkinsonism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Atypical juvenile parkinsonism (AJP) usually refers to a complex form of
      EOP that is inherited in a recessive manner and manifests with diverse
      neurological and psychiatric manifestations, including pyramidal signs,
      abnormalities of eye movements, depression, anxiety, psychosis, impulse
      control disorders, and intellectual disability (ID), among others.
    explanation: >-
      Defines the atypical juvenile parkinsonism class - including the
      ATP13A2/Kufor-Rakeb prototype with its eye-movement abnormalities - within
      which PTRHD1 disease must be distinguished.
  - reference: PMID:27753167
    reference_title: "PTRHD1 (C2orf79) mutations lead to autosomal-recessive intellectual disability and parkinsonism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To date, pathogenic mutations in at least eight different genes have been
      reported in AJP.
    explanation: >-
      Establishes the size of the atypical-juvenile-parkinsonism gene panel
      (ATP13A2, DNAJC6, FBXO7, PLA2G6, SPG11, SPG15, SYNJ1, VPS13C) that must be
      excluded before attributing disease to PTRHD1.
- name: Parkinsonism in other genetic neurodevelopmental disorders
  description: >-
    A broad and growing class in which parkinsonism emerges on a background of a
    genetic neurodevelopmental disorder - 69 disorders in 422 patients in the
    most recent systematic review, most frequently 22q11.2 deletion syndrome,
    beta-propeller protein-associated neurodegeneration, Down syndrome,
    cerebrotendinous xanthomatosis and Rett syndrome. PTRHD1 is itself one of
    the entities in this class.
  distinguishing_features:
  - >-
    Distinction is genomic rather than clinical: the syndromic context (facial
    dysmorphism, organ involvement, an MRI signature such as brain iron in BPAN,
    or a biochemical abnormality as in cerebrotendinous xanthomatosis) points to
    the alternative diagnosis, whereas PTRHD1 disease has a normal MRI, no
    dysmorphism, and a normal metabolic screen.
  evidence:
  - reference: PMID:36699000
    reference_title: "Parkinsonism in Genetic Neurodevelopmental Disorders: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The literature search yielded 208 reports for data-extraction, describing
      69 genetic disorders in 422 patients. The five most reported from most to
      least frequent were: 22q11.2 deletion syndrome, beta-propeller
      protein-associated neurodegeneration, Down syndrome, cerebrotendinous
      xanthomatosis, and Rett syndrome.
    explanation: Defines the differential class and its most frequent members.
- name: Parkinson disease
  description: >-
    Common, largely sporadic late-onset Parkinson disease. PTRHD1 has been
    formally excluded as a risk gene for typical Parkinson disease in large
    European, Chinese and Taiwanese cohorts.
  distinguishing_features:
  - >-
    Typical Parkinson disease lacks the preceding childhood neurodevelopmental
    and behavioral phase and lacks the recessive inheritance pattern; PTRHD1
    variants are not enriched in typical Parkinson disease cohorts, so PTRHD1
    testing is indicated only in the syndromic, recessive, early-onset context.
  evidence:
  - reference: PMID:34246528
    reference_title: "Analysis of PTRHD1 common and rare variants in European patients with Parkinson's disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our results show no association between PTRHD1 and PD risk or AAO. We
      conclude that PTRHD1 does not play a major role in PD in the European
      population.
    explanation: >-
      Large European case-control and GWAS analysis separating the PTRHD1
      syndromic entity from typical Parkinson disease.
  - reference: PMID:33004232
    reference_title: "Lack of PTRHD1 mutation in patients with young-onset and familial Parkinson's disease in a Taiwanese population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We did not find any pathogenic coding variants or previously reported
      mutations, suggesting that PTRHD1 mutations are rare in young-onset and
      familial PD in our population.
    explanation: >-
      Independent negative screen in 464 Taiwanese young-onset/familial PD
      participants.
  - reference: PMID:35848037
    reference_title: "Rare Variant Analysis of PTRHD1 in Parkinson's Disease in the Chinese Population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Three rare variants were identified, but rare variants of PTRHD1 were not
      enriched in PD.
    explanation: >-
      Independent negative burden test in a Chinese case-control cohort
      (1367 cases, 3298 controls).

discussions:
- discussion_id: ptrhd1_molecular_function_unknown
  kind: KNOWLEDGE_GAP
  prompt: >-
    What is the actual molecular function of human PTRHD1, given that the
    recombinant protein binds tRNA but has no peptidyl-tRNA hydrolase activity
    despite carrying the PTH2 domain that names the gene?
  attaches_to:
  - "pathophysiology#Impaired Ubiquitin-Proteasome Protein Quality Control"
  rationale: >-
    This is the central gap for the entire entry. The gene name and the
    ubiquitin-proteasome hypothesis both derive from the PTH2 domain, but the
    only direct biochemical characterization of the human protein found tRNA
    binding without hydrolase activity and concluded that PTRHD1 is not a
    peptidyl-tRNA hydrolase. No enzymatic activity, physiological substrate, or
    binding partner has been established for the human protein, and no
    disease-specific proteasome-function assay has been reported in PTRHD1
    patient neurons. Until this is resolved, every mechanistic node downstream of
    the genetic lesion is inferential, and the ubiquitin-proteasome model rests
    on yeast Pth2 homology rather than human data.
  proposed_experiments:
  - experiment_id: ptrhd1_interactome
    name: PTRHD1 neuronal interactome by AP-MS
    description: >-
      Determine binding partners of human PTRHD1 by affinity
      purification-mass spectrometry in neuronal cells, testing specifically for
      UBL-domain proteins (RAD23, UBQLN/DSK2 homologs) and proteasome subunits.
    decision_criterion: >-
      Recovery of UBL-domain proteins or proteasome subunits as reproducible
      specific interactors would support the ubiquitin-proteasome model; their
      absence alongside recovery of ribosome/tRNA-handling partners would favor
      a translation-associated quality-control function instead.
  - experiment_id: ptrhd1_proteasome_activity
    name: Proteasome function in patient-derived neurons
    description: >-
      Measure proteasome activity and steady-state polyubiquitinated-protein
      load in patient-derived fibroblasts and iPSC-derived cortical and midbrain
      dopaminergic neurons carrying p.Ala57Argfs*26 versus isogenic controls.
    decision_criterion: >-
      Reduced chymotrypsin-like proteasome activity or accumulation of
      polyubiquitinated protein in patient neurons would upgrade the
      Impaired Ubiquitin-Proteasome Protein Quality Control node from
      HYPOTHETICAL toward ESTABLISHED.
  - experiment_id: ptrhd1_null_vs_truncation
    name: Null versus stable-truncation allele comparison
    description: >-
      Test whether the stable truncated p.Ala57Argfs*26 protein acts as a null
      or exerts a distinct (dominant-negative or neomorphic) activity, by
      comparing a full knockout with a knock-in of the frameshift allele in the
      same isogenic background.
    decision_criterion: >-
      A phenotypic difference between full knockout and frameshift knock-in
      would show that the stable truncated protein is not simply a null, which
      would change how the Escape of Nonsense-Mediated Decay node is
      interpreted mechanistically.
  evidence:
  - reference: PMID:27235175
    reference_title: "Expression, purification, and buffer solubility optimization of the putative human peptidyl-tRNA hydrolase PTRHD1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Additionally, we report binding to tRNA but absence of peptidyl-tRNA
      hydrolase activity. Thus, PTRHD1 is not a Pth and the functional
      consequence of nucleotide binding remains undefined.
    explanation: >-
      The primary biochemical result establishing that the nominal function
      implied by the gene name does not hold, leaving the true function unknown.

- discussion_id: ptrhd1_no_neuropathology_or_dat_imaging
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is the parkinsonism of PTRHD1 disease actually caused by nigrostriatal
    dopaminergic neurodegeneration? No neuropathological examination and no
    dopamine-transporter imaging study has ever been published for a
    PTRHD1-mutant individual.
  attaches_to:
  - "pathophysiology#Nigrostriatal Dopaminergic Neuron Degeneration"
  rationale: >-
    The Nigrostriatal Dopaminergic Neuron Degeneration node - and the
    conforms_to link to the parkinsonism_dopaminergic_degeneration module - is
    currently supported only indirectly, by levodopa responsiveness and by
    PTRHD1 expression in the substantia nigra, striatum and putamen. Brain MRI
    is grossly normal and DaTscan was explicitly unavailable in the one detailed
    report that mentions it. The distinction matters mechanistically: a
    genuinely degenerative nigral lesion would place this disorder alongside the
    other recessive early-onset parkinsonisms, whereas a developmental or
    functional dopaminergic deficit that becomes symptomatic with age would make
    it a different kind of entity - and this is exactly the neurodevelopment
    versus neurodegeneration question that makes the disorder interesting.
  proposed_experiments:
  - experiment_id: ptrhd1_dat_imaging
    name: Presynaptic dopaminergic imaging in PTRHD1 carriers
    description: >-
      Perform dopamine transporter SPECT (DaT-SPECT) or 18F-DOPA PET in
      PTRHD1-mutant individuals before and after the emergence of parkinsonism,
      to test for presynaptic dopaminergic denervation and to date its onset
      relative to motor symptoms.
    decision_criterion: >-
      Reduced striatal tracer binding that worsens with motor progression would
      confirm presynaptic nigrostriatal degeneration; normal binding in
      symptomatic individuals would refute the degenerative model and point to a
      postsynaptic or circuit-level mechanism.
  - experiment_id: ptrhd1_neuropathology
    name: Post-mortem neuropathology of a PTRHD1 brain
    description: >-
      Obtain post-mortem neuropathological examination of a PTRHD1-mutant brain,
      assessing nigral neuronal counts, alpha-synuclein/Lewy pathology, tau, and
      ubiquitin-positive inclusions.
    decision_criterion: >-
      Nigral neuronal loss would establish the degeneration node; the presence or
      absence of ubiquitin-positive inclusions would additionally test the
      ubiquitin-proteasome hypothesis directly in human tissue.
  evidence:
  - reference: PMID:34765690
    reference_title: "Biallelic PTRHD1 Frameshift Variants Associated with Intellectual Disability, Spasticity, and Parkinsonism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      DaTscan imaging is not available.
    explanation: >-
      Documents the absence of dopaminergic imaging in the one patient in whom
      parkinsonism was formally rated.
  - reference: PMID:36699000
    reference_title: "Parkinsonism in Genetic Neurodevelopmental Disorders: A Systematic Review."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Results of dopaminergic imaging and response to antiparkinsonian
      medication often supported the neurodegenerative nature of parkinsonism.
    explanation: >-
      Shows that the class-level expectation is neurodegeneration, which makes
      the absence of PTRHD1-specific imaging and pathology data a concrete,
      answerable gap rather than an open-ended question.

- discussion_id: ptrhd1_no_animal_or_cellular_model
  kind: KNOWLEDGE_GAP
  prompt: >-
    No animal or human cellular model of PTRHD1 deficiency has been reported
    that reproduces either arm of the biphasic phenotype. Can a model
    recapitulate the neurodevelopmental phase, the later motor-degenerative
    phase, or the transition between them?
  attaches_to:
  - "pathophysiology#PTRHD1 Biallelic Loss of Function"
  rationale: >-
    All published PTRHD1 work is human genetic or descriptive; the only
    laboratory studies are a recombinant-protein biochemistry paper and
    patient-lymphocyte transcript/protein analyses. Without a model system, the
    causal chain from the genetic lesion to either phenotype cannot be tested,
    and no therapeutic hypothesis beyond symptomatic levodopa can be evaluated.
    The biphasic course makes this disorder an unusually informative potential
    model for how a single locus can produce a static developmental deficit and
    a later progressive degeneration, which raises the value of building one.
  proposed_experiments:
  - experiment_id: ptrhd1_ipsc_neurons
    name: Isogenic iPSC-derived cortical and dopaminergic neuron models
    description: >-
      Generate isogenic PTRHD1-null and patient-allele knock-in human iPSC lines
      and differentiate them to cortical neurons and midbrain dopaminergic
      neurons, phenotyping neurite development, synapse formation, proteasome
      function, and long-term survival under stress.
    decision_criterion: >-
      A developmental phenotype in cortical neurons together with a
      later-emerging survival deficit in dopaminergic neurons would reproduce the
      biphasic human course in vitro and validate the two-arm pathograph.
  - experiment_id: ptrhd1_vertebrate_model
    name: Aged vertebrate PTRHD1 loss-of-function model
    description: >-
      Create PTRHD1 knockout and knock-in vertebrate models (mouse and/or
      zebrafish) with longitudinal cognitive, behavioral, and motor phenotyping
      into aged animals to test whether a late motor phase emerges on a
      developmental background.
    decision_criterion: >-
      Emergence of a late motor phenotype on a background of early cognitive or
      behavioral abnormality would establish the first animal model of the
      neurodevelopment-to-neurodegeneration transition for this gene.
  evidence:
  - reference: PMID:34765690
    reference_title: "Biallelic PTRHD1 Frameshift Variants Associated with Intellectual Disability, Spasticity, and Parkinsonism."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      However, to date, functional studies of the reported variants and studies
      of patients
    explanation: >-
      The authors state directly that functional studies of the reported
      variants and of patient-derived cells had not been performed.

- discussion_id: ptrhd1_parkinsonism_penetrance
  kind: OPEN_QUESTION
  prompt: >-
    Is the parkinsonian arm incompletely penetrant, or merely very late, so that
    all biallelic carriers would eventually develop it if followed long enough?
  attaches_to:
  - "pathophysiology#Nigrostriatal Dopaminergic Neuron Degeneration"
  rationale: >-
    Reports differ. Some describe parkinsonism as variably penetrant; in one
    Omani family only one of four affected siblings had developed mild
    parkinsonism by the fourth decade, and in an Iranian family the affected
    individuals were reported with intellectual disability manifestations. Yet
    the longest-followed kindred showed motor signs appearing only at ages
    34-48, with the authors concluding that gait problems may not be evident
    until towards the end of the fourth decade. Distinguishing true incomplete
    penetrance from ascertainment at too young an age changes both counseling
    and the interpretation of the mechanism (a stochastic degenerative threshold
    versus an obligate but slow decline).
  proposed_experiments:
  - experiment_id: ptrhd1_penetrance_cohort
    name: Prospective re-examination of known PTRHD1 kindreds
    description: >-
      Systematic prospective re-examination of all reported PTRHD1 kindreds at
      5-year intervals with standardized movement-disorder assessment, to
      establish age-specific penetrance curves for parkinsonism.
    decision_criterion: >-
      A penetrance curve approaching 100% by the fifth or sixth decade would
      support age-dependent rather than incomplete penetrance; a plateau well
      below 100% would establish genuinely incomplete penetrance and motivate a
      search for modifiers.
  evidence:
  - reference: PMID:41918506
    reference_title: "Homozygous PTRHD1 Mutation in Intellectual Disability and Atypical Parkinsonism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings reveal that not all PTRHD1 mutations manifest with muscle
      rigidity and postural instability and confirm that gait problems may not
      be evident until towards the end of the fourth decade.
    explanation: >-
      Supports the very-late-rather-than-absent interpretation, and documents
      the incomplete parkinsonian syndrome.
  - reference: PMID:34816696
    reference_title: "The PTRHD1 Mutation in Intellectual Disability."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings are in agreement with the clinical spectrum of PTRHD1
      mutations; however, our affected individuals suffer from ID
      manifestations.
    explanation: >-
      A family in whom intellectual disability was the reported manifestation,
      without documented parkinsonism, supporting variable expression of the
      motor arm.

      responsive parkinsonism symptoms around the third and fourth decade
    explanation: >-
      Levodopa responsiveness is indirect evidence of a presynaptic
      nigrostriatal dopaminergic deficit with preserved postsynaptic striatal
      targets; it does not itself demonstrate neuronal loss.
  - reference: PMID:41918506
    reference_title: "Homozygous PTRHD1 Mutation in Intellectual Disability and Atypical Parkinsonism."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We found expression of PTRHD1 in different brain parts including the
      striatum and putamen, which are involved in degenerative neurological

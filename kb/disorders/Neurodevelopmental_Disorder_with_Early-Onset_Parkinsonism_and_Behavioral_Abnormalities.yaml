- name: Disrupted Development of Cognitive and Behavioral Circuits
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  description: >-
    The first arm of the biphasic course. Loss of PTRHD1 during brain
    development produces delayed milestones from late infancy, mild to severe
    impairment of intellectual development, speech and language delay, and a
    characteristic behavioral profile (attention deficit and hyperactivity,
    impulsivity, aggression, social isolation, obsessive-compulsive behavior,
    anxiety, and sleep disturbance). Critically, this arm is STATIC: cognitive
    impairment in the best-followed family was explicitly described as
    early-onset and non-progressive, in contrast to the later motor arm. Brain
    MRI is grossly unremarkable, so the substrate is presumed to be circuit- and
    synapse-level rather than a gross malformation.

prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Ultra-rare. As of the most recent published tally, ten families had been
    reported with a homozygous PTRHD1 mutation, all consanguineous and
    predominantly from the Middle East; single additional families have since
    been reported from Austria and Italy. No population prevalence, incidence,
    or carrier-frequency estimate exists.
  evidence:
  - reference: PMID:41918506
    reference_title: "Homozygous PTRHD1 Mutation in Intellectual Disability and Atypical Parkinsonism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To date, ten families have been reported with homozygous PTRHD1
      mutation
    explanation: Gives the published family count underpinning the ultra-rare classification.
  - reference: PMID:41918506
    reference_title: "Homozygous PTRHD1 Mutation in Intellectual Disability and Atypical Parkinsonism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The majority of the families are from the Middle East, and all have
      parental consanguinity.
    explanation: Documents the consanguineous, geographically clustered ascertainment.

inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    All reported families carry biallelic (homozygous) PTRHD1 variants that
    segregate with disease in a recessive pattern; every family described to
    date has documented parental consanguinity. Heterozygous carriers,
    including obligate-carrier parents, are unaffected.
  evidence:
  - reference: PMID:30398675
    reference_title: "PTRHD1 Loss-of-function mutation in an african family with juvenile-onset Parkinsonism and intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Together with the previous reports, we provide conclusive evidence that
      loss-of-function mutations in PTRHD1 cause autosomal-recessive juvenile
      parkinsonism and intellectual disability.
    explanation: >-
      States the autosomal recessive mode of inheritance for PTRHD1
      loss-of-function disease with genome-wide significant linkage support.
  - reference: PMID:41722179
    reference_title: "Early-onset parkinsonism with intellectual disability in an Italian family associated with a PTRHD1 variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations in PTRHD1 have recently been implicated in autosomal recessive
      neurodevelopmental syndromes characterized by intellectual disability,
      and variably penetrant early-onset parkinsonism, mainly in consanguineous
      families of Middle Eastern or African origin.
    explanation: >-
      Independent confirmation of recessive inheritance and of the variable
      penetrance of the parkinsonian arm.

genetic:
- name: PTRHD1
  gene_term:
    preferred_term: PTRHD1
    term:
      id: hgnc:33782
      label: PTRHD1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    PTRHD1 (peptidyl-tRNA hydrolase domain containing 1; formerly C2orf79) at
    2p23.3 encodes a 140-amino-acid protein consisting essentially of a single
    PTH2 (peptidyl-tRNA hydrolase 2) domain spanning residues 25-139. All
    reported disease alleles are homozygous and fall within or truncate this
    domain: the missense alleles c.155G>A (p.Cys52Tyr, Iranian and Pakistani
    families), c.157C>T (p.His53Tyr, Iranian family), c.365G>A (p.Arg122Gln, a
    large Middle Eastern kinship and an Austrian individual) and p.Arg122Trp
    (Iranian family); the 28-nucleotide frameshift deletion c.169_196del
    (p.Ala57Argfs*26, South African and Omani families); and the nonsense
    c.213C>A (p.Tyr71*, Italian family). Loss of function is the accepted
    disease mechanism.
  evidence:
  - reference: PMID:27753167
    reference_title: "PTRHD1 (C2orf79) mutations lead to autosomal-recessive intellectual disability and parkinsonism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The chromosome, 2p23.3, was identified as the disease-associated locus,
      and a homozygous PTRHD1 mutation (c.157C>T) was then established as the
      disease-causing mutation.
    explanation: >-
      Original gene-disease assignment, mapping the locus to 2p23.3 and
      establishing PTRHD1 c.157C>T as causal in an Iranian consanguineous family.
  - reference: PMID:27753167
    reference_title: "PTRHD1 (C2orf79) mutations lead to autosomal-recessive intellectual disability and parkinsonism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      both PTRHD1 mutations identified in families with ID and parkinsonism lie
      within the PTH2 domain (25-139 amino-acids) of the PTRHD1 protein
    explanation: Localizes the disease alleles to the single PTH2 domain of the protein.
  - reference: PMID:30398675
    reference_title: "PTRHD1 Loss-of-function mutation in an african family with juvenile-onset Parkinsonism and intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A homozygous 28-nucleotide frameshift deletion in the PTRHD1 coding region
      was identified in the 3 affected family members and linked to the disease
      with genome-wide significant evidence.
    explanation: >-
      Independent linkage-supported identification of a truncating allele,
      establishing loss of function as the mechanism.
  - reference: PMID:41722179
    reference_title: "Early-onset parkinsonism with intellectual disability in an Italian family associated with a PTRHD1 variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The analysis revealed a homozygous nonsense variant (c.213C > A,
      p.Tyr71*), segregating with severe intellectual disability and variably
      penetrant parkinsonian features
    explanation: Adds a nonsense allele and extends the geographical spectrum to Europe.
  - reference: PMID:34816696
    reference_title: "The PTRHD1 Mutation in Intellectual Disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A novel homozygous missense mutation (p.Arg122Trp) was detected in the
      PTRHD1 gene.
    explanation: >-
      Adds the p.Arg122Trp allele in an Iranian consanguineous family in whom
      intellectual disability dominated the presentation.
  - reference: PMID:34246528
    reference_title: "Analysis of PTRHD1 common and rare variants in European patients with Parkinson's disease."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our results show no association between PTRHD1 and PD risk or AAO. We
      conclude that PTRHD1 does not play a major role in PD in the European
      population.
    explanation: >-
      Counter-evidence delimiting the gene-disease claim: PTRHD1 is a Mendelian
      cause of this recessive syndrome but is NOT a common-variant risk gene for
      typical Parkinson disease. Curated deliberately to prevent
      over-generalization of the causal claim.

variants:
- name: PTRHD1 c.169_196del (p.Ala57Argfs*26)
  description: >-
    Recurrent homozygous 28-nucleotide frameshift deletion in PTRHD1 exon 1,
    reported independently in a South African and an Omani consanguineous
    family. Functional work in patient primary cells showed that the mutant
    transcript escapes nonsense-mediated decay and that a truncated (~81
    amino-acid) but stable protein is expressed, so the allele is not a simple
    null by transcript degradation.
  gene:
    preferred_term: PTRHD1
    term:
      id: hgnc:33782
      label: PTRHD1
  clinical_significance: PATHOGENIC
  evidence:
  - reference: PMID:34765690
    reference_title: "Biallelic PTRHD1 Frameshift Variants Associated with Intellectual Disability, Spasticity, and Parkinsonism."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      A homozygous 28-nucleotide frameshift deletion introducing a premature
      stop codon in the PTRHD1 exon 1 was identified in the four affected
      members.
    explanation: Identifies the recurrent frameshift allele in the Omani family.
  - reference: PMID:34765690
    reference_title: "Biallelic PTRHD1 Frameshift Variants Associated with Intellectual Disability, Spasticity, and Parkinsonism."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Real-time PCR showed that mRNA expression of the mutant PTRHD1 is higher
      compared to the wild-type.
    explanation: >-
      Patient-cell RT-qPCR showing the mutant transcript is not degraded,
      supporting NMD escape rather than loss of transcript.
- name: PTRHD1 c.155G>A (p.Cys52Tyr)
  description: >-
    Recurrent homozygous missense allele first reported in an Iranian sibling
    pair and later found in an unrelated Pakistani family with a very late
    (fourth-decade), atypical parkinsonian phase. Cys52 is conserved across
    species except C. elegans and lies immediately adjacent to the putative
    ligand-binding residue His53.
  gene:
    preferred_term: PTRHD1
    term:
      id: hgnc:33782
      label: PTRHD1
  clinical_significance: PATHOGENIC
  evidence:
  - reference: PMID:41918506
    reference_title: "Homozygous PTRHD1 Mutation in Intellectual Disability and Atypical Parkinsonism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Linkage analysis using SNP genotyping followed by exome sequencing led to
      the discovery of PTRHD1 c.155G>A (p.Cys52Tyr), already reported in an
      Iranian sibling pair.
    explanation: Confirms recurrence of the p.Cys52Tyr allele in an unrelated kindred.
- name: PTRHD1 c.365G>A (p.Arg122Gln)
  description: >-
    Homozygous missense allele reported in a large Middle Eastern kinship
    comprising three related families and, independently, in an Austrian
    individual whose phenotype additionally included genetic generalized
    epilepsy.
  gene:
    preferred_term: PTRHD1
    term:
      id: hgnc:33782
      label: PTRHD1
  clinical_significance: PATHOGENIC
  evidence:
  - reference: PMID:38286424
    reference_title: "A Homozygous PTRHD1 Missense Variant (p.Arg122Gln) in an Individual with Intellectual Disability, Generalized Epilepsy, and Juvenile Parkinsonism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Using diagnostic exome sequencing, we identified a homozygous missense
      variant (c.365G > A, p.(Arg122Gln)) in PTRHD1 (NM_001013663).
    explanation: Documents the p.Arg122Gln allele and its transcript reference.

mechanistic_hypotheses:
- hypothesis_group_id: ptrhd1_ubiquitin_proteasome_model
  hypothesis_label: PTH2/UBL-Domain Link to Ubiquitin-Proteasome System Failure
  status: EMERGING
  description: >-
    The leading - but explicitly unproven - mechanistic model. PTRHD1 consists
    essentially of a PTH2 (peptidyl-tRNA hydrolase 2) domain, and every
    disease-associated allele lies within or truncates it. In yeast, the Pth2
    protein is a ubiquitin-like (UBL) domain-binding protein that participates
    in the ubiquitin-proteasome pathway and retards ubiquitin-mediated
    degradation. Because the ubiquitin-proteasome system is independently
    implicated both in intellectual disability (UBE3A, UBE2A, CUL4B, BRWD3) and
    in early-onset parkinsonism (parkin/PRKN, FBXO7), the proposal is that
    PTRHD1 loss of function degrades proteostasis in a way that impairs brain
    development and later renders vulnerable neuronal populations
    degeneration-prone. The originating authors state this as speculation, no
    disease-specific proteasome assay has been reported in patient neurons, and
    the alternative that PTRHD1 acts in translation-associated RNA quality
    control is not excluded.
  evidence:
  - reference: PMID:27753167
    reference_title: "PTRHD1 (C2orf79) mutations lead to autosomal-recessive intellectual disability and parkinsonism."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we speculated that PTRHD1 genetic variability might cause ID and
      parkinsonism through defects in the ubiquitin-proteasome system, as
      observed in other inherited forms of parkinsonism and ID.
    explanation: >-
      The originating statement of the hypothesis, explicitly framed by its
      authors as speculation rather than demonstrated mechanism.
  - reference: PMID:27753167
    reference_title: "PTRHD1 (C2orf79) mutations lead to autosomal-recessive intellectual disability and parkinsonism."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      The PTH2 domain is a ubiquitin-like (UBL) domain-binding protein that is
      known to participate in the ubiquitin-proteasome pathway and has been
      shown to suppress ubiquitin-mediated degradation.
    explanation: >-
      Provides the domain-level biochemical rationale (from yeast Pth2) that
      motivates the hypothesis; it is homology-based, not PTRHD1-specific.
  - reference: PMID:34630269
    reference_title: "Genotype-Phenotype Correlations in Monogenic Parkinson Disease: A Review on Clinical and Molecular Findings."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Intriguingly, the pathogenic variants causing Parkinsonism are in the
      ubiquitin-like (UBL) domain-binding site of the protein.
    explanation: >-
      Independent review notes that the disease alleles cluster in the
      UBL-domain-binding site, the structural argument for the hypothesis.
  - reference: PMID:27235175
    reference_title: "Expression, purification, and buffer solubility optimization of the putative human peptidyl-tRNA hydrolase PTRHD1."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      Additionally, we report binding to tRNA but absence of peptidyl-tRNA
      hydrolase activity. Thus, PTRHD1 is not a Pth and the functional
      consequence of nucleotide binding remains undefined.
    explanation: >-
      Constrains the hypothesis space from the other direction: the domain's
      nominal enzymatic activity is absent in the recombinant human protein, so
      the disease mechanism cannot simply be loss of peptidyl-tRNA hydrolysis.

pathophysiology:
- name: PTRHD1 Biallelic Loss of Function
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Homozygous missense, frameshift, or nonsense variants in the single PTH2
    domain of PTRHD1 (2p23.3) abolish or corrupt the function of the
    140-amino-acid protein. Linkage-supported segregation in multiple unrelated
    consanguineous families, absence of the alleles from ethnically matched
    control chromosomes and population databases, and the presence of clearly
    truncating alleles together establish loss of function as the disease
    mechanism. PTRHD1 is widely expressed, including throughout the adult brain
    (cortex, cerebellum, brainstem, substantia nigra, pons, putamen, and spinal
    cord), which is consistent with a phenotype that spans cognitive,
    behavioral, pyramidal, and extrapyramidal domains.
  gene:
    preferred_term: PTRHD1
    term:
      id: hgnc:33782
      label: PTRHD1
  evidence:
  - reference: PMID:30398675
    reference_title: "PTRHD1 Loss-of-function mutation in an african family with juvenile-onset Parkinsonism and intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Together with the previous reports, we provide conclusive evidence that
      loss-of-function mutations in PTRHD1 cause autosomal-recessive juvenile
      parkinsonism and intellectual disability.
    explanation: Establishes biallelic loss of function as the causal molecular lesion.
  - reference: PMID:41918506
    reference_title: "Homozygous PTRHD1 Mutation in Intellectual Disability and Atypical Parkinsonism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PTRHD1 is expressed in many organs, and we found widespread expression in
      the adult brain.
    explanation: >-
      Expression data supporting a broadly distributed CNS substrate for the
      loss-of-function lesion.
  downstream:
  - target: Escape of Nonsense-Mediated Decay with Stable Truncated Protein
    causal_link_type: DIRECT
    description: >-
      Truncating PTRHD1 alleles do not simply eliminate the transcript; the
      mutant mRNA is stable and a shortened protein is produced.
  - target: Impaired Ubiquitin-Proteasome Protein Quality Control
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - ptrhd1_ubiquitin_proteasome_model
    description: >-
      Hypothesized link, based on the UBL-domain-binding activity of the PTH2
      domain family; not demonstrated in patient neurons.
  - target: Disrupted Development of Cognitive and Behavioral Circuits
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The first, static phase of the biphasic course: developmental milestones
      are delayed from late infancy and cognitive/behavioral impairment is then
      non-progressive.
  - target: Nigrostriatal Dopaminergic Neuron Degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The second, progressive phase, emerging years to decades after the
      developmental phase in the same individuals.
  - target: Corticospinal Tract Dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Pyramidal involvement, present in some families from childhood alongside
      the developmental phase and progressive in others.

- name: Escape of Nonsense-Mediated Decay with Stable Truncated Protein
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Functional work on the recurrent c.169_196del (p.Ala57Argfs*26) allele in
    primary cells from four affected members of an Omani family showed that,
    contrary to in-silico prediction, the premature-termination-codon transcript
    escapes nonsense-mediated mRNA decay and is in fact expressed at higher
    levels than wild type. Immunoblot and isoelectric focusing detected a stable
    truncated protein of roughly 8-9 kDa (isoelectric point ~11) instead of the
    15 kDa wild-type product. The disease allele therefore produces an abnormal
    protein species rather than protein absence, which leaves open whether the
    pathogenic effect is pure loss of function or includes an aberrant activity
    of the truncated product.
  evidence:
  - reference: PMID:34765690
    reference_title: "Biallelic PTRHD1 Frameshift Variants Associated with Intellectual Disability, Spasticity, and Parkinsonism."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We further confirmed the apparent transcript escape of the
      nonsense-mediated messenger RNA (mRNA) decay pathway.
    explanation: Direct patient-cell demonstration of NMD escape.
  - reference: PMID:34765690
    reference_title: "Biallelic PTRHD1 Frameshift Variants Associated with Intellectual Disability, Spasticity, and Parkinsonism."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Western blotting and isoelectric focusing identified a truncated, but
      stable mutant PTRHD1 protein expressed in the patient
    explanation: >-
      Shows the truncated protein is stably expressed in patient primary cells,
      so the allele is not a protein-null.

- name: Impaired Ubiquitin-Proteasome Protein Quality Control
  biological_scale: MOLECULAR
  mechanism_confidence: HYPOTHETICAL
  description: >-
    Hypothesized proximal consequence of PTRHD1 loss of function. The PTH2
    domain family binds ubiquitin-like (UBL) domains and participates in the
    ubiquitin-proteasome pathway, and all reported disease alleles fall in that
    domain - in the UBL-domain-binding site specifically. Disturbed
    ubiquitin-dependent proteolysis would plausibly account for the double
    phenotype, since the ubiquitin-proteasome system is required for brain
    development, synaptic plasticity, and long-term memory formation, and its
    failure is a recognized route to both intellectual disability and
    early-onset parkinsonism. No proteasome-activity or polyubiquitinated-protein
    measurement has been reported in PTRHD1-deficient human neurons, so this node
    remains a hypothesis rather than a demonstrated step.
  biological_processes:
  - preferred_term: proteasome-mediated ubiquitin-dependent protein catabolic process
    term:
      id: GO:0043161
      label: proteasome-mediated ubiquitin-dependent protein catabolic process
    modifier: DECREASED
  - preferred_term: ubiquitin-dependent protein catabolic process
    term:
      id: GO:0006511
      label: ubiquitin-dependent protein catabolic process
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:27753167

- name: Striatal Dopamine Deficiency and Basal Ganglia Motor Circuit Dysfunction
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  conforms_to: "parkinsonism_dopaminergic_degeneration#Striatal Dopamine Deficiency and Basal Ganglia Circuit Dysfunction"
  description: >-
    Loss of nigrostriatal dopaminergic input unbalances the basal ganglia motor
    circuit, producing the clinical parkinsonian syndrome: bradykinesia with
    rest and postural tremor, muscle stiffness/rigidity, postural instability,
    and gait disturbance. The syndrome is levodopa-responsive in most reported
    patients, consistent with a dopamine-replaceable striatal deficit. It is
    also atypical in an important minority: one family developed bradykinesia,
    tremor and dementia in the fourth decade with neither muscle rigidity nor
    postural instability, and with a mildly ataxic rather than parkinsonian
    gait, widening the syndrome beyond pure parkinsonism.
  locations:
  - preferred_term: striatum
    term:
      id: UBERON:0002435
      label: striatum
  biological_processes:
  - preferred_term: dopamine secretion
    term:
      id: GO:0014046
      label: dopamine secretion
    modifier: DECREASED
  evidence:
  - reference: PMID:27753167
    reference_title: "PTRHD1 (C2orf79) mutations lead to autosomal-recessive intellectual disability and parkinsonism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      presented with ID, muscle stiffness, rest and postural tremor, postural
      instability, gait disturbances, speech difficulties, as well as
      psychiatric symptoms such as anxiety, hypersomnia, and hypersexuality.
    explanation: >-
      Documents the full parkinsonian motor syndrome (stiffness, rest and
      postural tremor, postural instability, gait disturbance) in the index
      family.
  - reference: PMID:41918506
    reference_title: "Homozygous PTRHD1 Mutation in Intellectual Disability and Atypical Parkinsonism."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There was no muscle rigidity and postural instability, but there were
      unusual features of exotropia, pectus excavatum, and prominent clavicles.
    explanation: >-
      Counter-evidence delimiting the syndrome: in the Pakistani family the
      cardinal signs of rigidity and postural instability were absent even in
      the eldest affected sibling, so these are not obligate features.

- name: Corticospinal Tract Dysfunction
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  description: >-
    A pyramidal arm that is separable from the parkinsonian arm and, in some
    families, precedes it by decades. Affected individuals in the South African
    and Omani kindreds developed generalized spasticity, brisk reflexes and
    upgoing toes in childhood, alongside the developmental phase; in the most
    severely affected individual this worsened over time to loss of independent
    ambulation. Notably, the pyramidal arm is not universal - the Pakistani
    family had a mildly ataxic gait explicitly without spasticity or hemiparesis
    - so spasticity is a frequent but not obligate feature.
  locations:
  - preferred_term: corticospinal tract
    term:
      id: UBERON:0002707
      label: corticospinal tract
  evidence:
  - reference: PMID:34765690
    reference_title: "Biallelic PTRHD1 Frameshift Variants Associated with Intellectual Disability, Spasticity, and Parkinsonism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      all patients presented initially with global developmental delay during
      early childhood and onset of pyramidal signs including spasticity and
      hyperreflexia
    explanation: >-
      Establishes childhood-onset pyramidal involvement co-occurring with the
      developmental phase, before parkinsonism.
  - reference: PMID:34765690
    reference_title: "Biallelic PTRHD1 Frameshift Variants Associated with Intellectual Disability, Spasticity, and Parkinsonism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      these patients developed pyramidal signs consisting of spasticity,
      hyperreflexia, and upgoing toes
    explanation: Enumerates the pyramidal signs across the then-reported cohort.


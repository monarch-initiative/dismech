- name: Nigrostriatal Dopaminergic Neuron Degeneration
  biological_scale: CELLULAR
  mechanism_confidence: HYPOTHETICAL
  conforms_to: "parkinsonism_dopaminergic_degeneration#Nigrostriatal Dopaminergic Neurodegeneration"
  description: >-
    Inferred second arm of the biphasic course. Years to decades after the
    static developmental phase, affected individuals develop progressive
    parkinsonism that in most reported patients has been levodopa-responsive,
    implying a presynaptic nigrostriatal dopaminergic deficit. PTRHD1 is
    expressed in the substantia nigra, striatum, and putamen, providing an
    anatomical substrate. This node is nonetheless marked HYPOTHETICAL and is a
    declared knowledge gap: no neuropathology has ever been reported for a
    PTRHD1 patient, and no dopamine-transporter (DaT-SPECT) imaging result has
    been published - the Omani proband with parkinsonism explicitly had no
    DaTscan available. Conformance to the shared
    parkinsonism_dopaminergic_degeneration module is therefore asserted on
    pharmacological and expression grounds, not on direct demonstration of
    nigral cell loss in this disease.
  cell_types:
  - preferred_term: midbrain dopaminergic neuron
    term:
      id: CL:0000700
      label: dopaminergic neuron

name: Neurodevelopmental Disorder with Early-Onset Parkinsonism and Behavioral Abnormalities
creation_date: "2026-08-15T00:00:00Z"
description: >-
  Neurodevelopmental disorder with early-onset parkinsonism and behavioral
  abnormalities (NEDPBA; OMIM 620747) is an ultra-rare autosomal recessive
  condition caused by biallelic loss-of-function variants in PTRHD1
  (peptidyl-tRNA hydrolase domain containing 1) at 2p23.3. Its defining feature
  is a biphasic course in which a single locus appears to bridge
  neurodevelopment and neurodegeneration; the reporting authors put this no more
  strongly than a potential role for the protein in both. In the first phase, delayed developmental milestones become
  apparent in late infancy or early childhood and settle into a static,
  non-progressive impairment of intellectual development with learning
  difficulties, speech and language delay, and prominent behavioral
  abnormalities (attention deficit and hyperactivity, aggression, social
  isolation, obsessive-compulsive behavior, anxiety, and sleep disturbance). In
  the second phase - typically the third or fourth decade, but reported from
  later childhood onward - a progressive motor disorder emerges, combining
  parkinsonism (bradykinesia, rest and postural tremor, rigidity, postural
  instability) with pyramidal signs (spasticity and hyperreflexia); some
  individuals additionally develop dementia, gait ataxia, or generalized
  epilepsy. Parkinsonism has been described as levodopa-responsive in most
  reported patients, and the intrafamilial variability in both the presence and
  the timing of motor features is a consistent finding. Fewer than a dozen
  families have been reported worldwide - from Iran, Oman, Pakistan, South
  Africa, Austria, and Italy, most but not all of them consanguineous - and the
  molecular
  function of PTRHD1 remains genuinely unknown: despite the PTH2 (peptidyl-tRNA
  hydrolase 2) domain that gives the gene its name, the recombinant human
  protein binds tRNA but has no detectable peptidyl-tRNA hydrolase activity. The
  leading (but still unproven) mechanistic hypothesis is that the
  PTH2/ubiquitin-like-domain-binding module links PTRHD1 to the
  ubiquitin-proteasome system, a pathway already implicated in both intellectual
  disability and early-onset parkinsonism.
category: Mendelian
parents:
- Neurodevelopmental Disorder
- Movement Disorder
- Autosomal Recessive Early-Onset Parkinsonism

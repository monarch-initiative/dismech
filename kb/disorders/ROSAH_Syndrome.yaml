diagnosis:
- name: ALPK1 molecular genetic testing
  description: >-
    The diagnosis is established by finding a heterozygous pathogenic ALPK1
    variant in a proband with suggestive findings, typically optic disc
    elevation, uveitis and retinal degeneration with systemic features. It is
    usually made by exome sequencing or a retinal dystrophy panel.
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  evidence:
  - reference: PMID:38935811
    reference_title: "ALPK1-Related Autoinflammatory Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The diagnosis of ALPK1-AD is established in a proband with suggestive findings and a heterozygous pathogenic variant in ALPK1 identified by molecular genetic testing."
    explanation: GeneReviews diagnostic criterion.
  - reference: PMID:40201710
    reference_title: "Case Report: ROSAH syndrome presents diagnostic and therapeutic challenges."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A diagnosis of ROSAH syndrome, suggested by the concomitant presentation of optic disc edema, uveitis, and retinal degeneration, can be made by targeted genetic sequencing of the ALKP1 gene."
    explanation: The clinical triad that prompts testing.
differential_diagnoses:
- name: Cogan Syndrome
  disease_term:
    preferred_term: Cogan syndrome
    term:
      id: MONDO:0015453
      label: Cogan syndrome
  description: >-
    In a paediatric Cogan syndrome cohort, one child carried an ALPK1 variant
    of uncertain significance (p.His735Pro). Children with Cogan-like ocular
    inflammation and systemic features may therefore warrant ALPK1 testing.
  distinguishing_features:
  - Heterozygous ALPK1 variant supports ROSAH syndrome
  - Optic disc elevation, retinal degeneration, anhidrosis or short dental roots point to ROSAH
  evidence:
  - reference: PMID:42640550
    reference_title: "Whole exome sequencing of paediatric patients with Cogan's syndrome to identify monogenic mimics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a novel ALPK1 p.H735P (n = 1), associated with Retinal dystrophy Optic nerve oedema Splenomegaly Anhidrosis Headache (ROSAH) syndrome"
    explanation: Exome sequencing of a paediatric Cogan cohort found an ALPK1 variant of uncertain significance.
- name: Systemic Lupus Erythematosus
  disease_term:
    preferred_term: systemic lupus erythematosus
    term:
      id: MONDO:0007915
      label: systemic lupus erythematosus
  description: >-
    Immune-complex glomerulonephritis in ROSAH has been misdiagnosed as lupus
    nephritis.
  distinguishing_features:
  - Absence of clinical or serological markers of lupus
  - ALPK1 variant with ocular and other ROSAH features
  evidence:
  - reference: PMID:42112140
    reference_title: "Renal Disease in ROSAH Syndrome Masquerading as Lupus Nephritis: A Case Report and Cohort Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Renal biopsy revealed immune complex-mediated glomerulonephritis with minimal mesangial proliferation, resembling class II lupus nephritis, despite the absence of clinical or serological markers of systemic lupus erythematosus."
    explanation: Renal ROSAH can mimic lupus nephritis.

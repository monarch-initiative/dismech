  variants:
  - name: p.Thr237Met (c.710C>T)
    description: >-
      Recurrent pathogenic variant in the N-terminal ADP-heptose-binding domain,
      carried by most known families.
    evidence:
    - reference: PMID:30967659
      reference_title: "ALPK1 missense pathogenic variant in five families leads to ROSAH syndrome, an ocular multisystem autosomal dominant disorder."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "segregated with disease in all five families"
      explanation: The variant segregated with disease in all five discovery families.
  - name: p.Tyr254Cys (c.761A>G)
    description: >-
      Variant in the ligand-binding domain, found in a single sporadic patient.
      It gives higher NF-kappaB activity than T237M in reporter assays.
    evidence:
    - reference: PMID:35868845
      reference_title: "Gain-of-function mutations in ALPK1 cause an NF-κB-mediated autoinflammatory disease: functional assessment, clinical phenotyping and disease course of patients with ROSAH syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The majority of the cohort carried the p.Thr237Met mutation but we also identified a new ROSAH-associated mutation, p.Tyr254Cys."
      explanation: Identification of the second ROSAH variant.
  - name: p.Ser277Phe
    description: >-
      Variant found in one family of six affected members, all with ocular
      inflammation and optic nerve elevation. It is activated by UDP-mannose and
      ADP-ribose more strongly than T237M, and also by GDP-mannose.
    evidence:
    - reference: PMID:39626775
      reference_title: "Discovery and functional analysis of a novel ALPK1 variant in ROSAH syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Here, we identify a family in which ROSAH syndrome is caused by a novel variant in which Ser277 is changed to Phe."
      explanation: Family segregation of the variant, with functional characterisation in the same paper.
  - name: p.Thr237Ala
    description: >-
      A different substitution at the recurrent residue, with a milder,
      predominantly ocular phenotype in one family.
    evidence:
    - reference: PMID:41046116
      reference_title: "Ocular Manifestations of ROSAH Syndrome Caused by Different Mutations of the ALPK1 Gene."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Notably, individuals with the T237A variant displayed solely ocular manifestations, with no/mild systemic symptoms."
      explanation: Genotype-phenotype observation in two related patients.

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Seven patients showed retinal degeneration consistent with a cone-rod dystrophy, with atrophy tending to involve the posterior pole and extending peripherally."
    explanation: Ophthalmic phenotyping of the retinal degeneration.
  - reference: PMID:42773882
    reference_title: "Familial ROSAH Syndrome Associated with the ALPK1 p.Thr237Ala Variant: Divergent Ocular Phenotypes and Partial Response to IL-6 Blockade."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The different clinical courses observed in these two related patients raise the possibility that inflammatory and degenerative mechanisms may progress, at least in part, independently."
    explanation: Supports the description's point that degeneration is not purely a consequence of inflammation.
  downstream:

- name: Retinal and Optic Nerve Neuroinflammation
  description: >-
    In mice heterozygous for human wild-type and T237M ALPK1, the retina, optic
    nerve and cortex show microglial infiltration, astrocyte activation and
    cytokine upregulation, all reversed by the ALPK1 inhibitor DF-003. In
    patients, contrast MRI shows meningeal enhancement and posterior globe
    thickening or enhancement, and CSF shows raised neopterin and activated
    cells, consistent with CNS inflammation.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: microglial cell
    term:
      id: CL:0000129
      label: microglial cell
  locations:
  - preferred_term: retina
    term:
      id: UBERON:0000966
      label: retina
  - preferred_term: optic nerve
    term:
      id: UBERON:0000941
      label: cranial nerve II
  evidence:
  - reference: PMID:40925900
    reference_title: "Discovery of a selective alpha-kinase 1 inhibitor for the rare genetic disease ROSAH syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Using mice heterozygous for wild-type human ALPK1 and ALPK1T237M established to model ROSAH syndrome that exhibit retinal microglial infiltration, astrocyte activation, and inflammatory cytokine upregulation in the retina, optic nerve, and cortex"
    explanation: Humanised T237M mouse model showing retinal and optic nerve neuroinflammation.
  - reference: PMID:35868845
    reference_title: "Gain-of-function mutations in ALPK1 cause an NF-κB-mediated autoinflammatory disease: functional assessment, clinical phenotyping and disease course of patients with ROSAH syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "four showed foci of meningeal enhancement (online supplemental figure 3b), suggesting the possibility of ongoing central nervous system (CNS) inflammation"
    explanation: Patient imaging consistent with CNS inflammation.
  downstream:

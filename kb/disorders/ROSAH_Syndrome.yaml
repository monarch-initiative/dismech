      reference_title: "Tocilizumab as a treatment tool for ROSAH syndrome: a case report."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Tocilizumab showed significant anatomical benefit in this ROSAH syndrome patient, suggesting a role for IL-6 in disease pathophysiology."
      explanation: Anatomical response of macular edema and disc swelling to IL-6 receptor blockade.
  evidence:
  - reference: PMID:35868845
    reference_title: "Gain-of-function mutations in ALPK1 cause an NF-κB-mediated autoinflammatory disease: functional assessment, clinical phenotyping and disease course of patients with ROSAH syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "anti-IL-6 (tocilizumab) was the only anticytokine therapy that improved intraocular inflammation (two of two patients)"
    explanation: Open-label empirical use in the NIH cohort.
  - reference: PMID:41269507
    reference_title: "Tocilizumab as a treatment tool for ROSAH syndrome: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Recently, tocilizumab, an IL-6 receptor antagonist, was added, resulting in significant reduction in macular edema and optic disc swelling just within one month."
    explanation: Single p.Tyr254Cys case with an anatomical ocular response.
  - reference: PMID:41880066

notes: >-
  GeneReviews covers this disease as "ALPK1-Related Autoinflammatory Disease"
  (PMID:38935811). Only its abstract was cached, so the abstract served as the
  baseline: its clinical characteristics, diagnosis, management, surveillance
  and genetic counseling statements are each cited above. Optic disc swelling
  in ROSAH is not caused by raised intracranial pressure, and HPO has no
  optic-disc-edema term outside Papilledema (HP:0001085), which is defined by
  raised CSF pressure; Abnormal optic disc morphology (HP:0012795) is used
  instead.

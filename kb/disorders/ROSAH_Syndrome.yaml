      reference_title: "Tocilizumab as a treatment tool for ROSAH syndrome: a case report."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: "resulting in significant reduction in macular edema and optic disc swelling just within one month"
      explanation: Disc swelling regressed with IL-6 blockade, implying an inflammatory component.
  - target: Recurrent Headache
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Intraocular Inflammation
  description: >-
    Uveitis with keratic precipitates, anterior chamber cells, band
    keratopathy, retinal vasculitis and cystoid macular edema. Together with
    optic nerve involvement and retinal degeneration, it is one of the three
    factors that reduce vision in ROSAH. It is the ocular feature that has
    responded to IL-6 blockade.
  biological_scale: TISSUE
  locations:
  - preferred_term: eye
    term:
      id: UBERON:0000970
      label: eye
  evidence:
  - reference: PMID:36332842
    reference_title: "Ophthalmic Manifestations of ROSAH (Retinal Dystrophy, Optic Nerve Edema, Splenomegaly, Anhidrosis, and Headache) Syndrome, an Inherited NF κB-Mediated Autoinflammatory Disease with Retinal Dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "this study identified 3 main factors as contributing to changes in visual function of patients with ROSAH syndrome: optic nerve involvement; intraocular inflammation, including cystoid macular edema; and retinal degeneration"
    explanation: Largest single-centre ophthalmic cohort; names the three drivers of visual loss.
  downstream:

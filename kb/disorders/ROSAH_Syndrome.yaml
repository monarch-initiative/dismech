name: ROSAH Syndrome
creation_date: "2026-10-19T05:00:00Z"
category: Mendelian
parents:
- Autoinflammatory Disease
description: >-
  ROSAH syndrome (retinal dystrophy, optic nerve edema, splenomegaly,
  anhidrosis and headache), also called ALPK1-related autoinflammatory disease,
  is an autosomal dominant autoinflammatory disorder caused by heterozygous
  gain-of-function missense variants in ALPK1, most often p.Thr237Met. The
  mutant kinase loses its specificity for the bacterial sugar ADP-heptose and
  is activated by endogenous nucleotide sugars, driving constitutive
  ALPK1-TIFA signalling to NF-kappaB with an accompanying interferon/STAT1
  signature. Patients show variable intraocular inflammation, optic disc
  elevation and cone-rod-type retinal degeneration, together with episodic
  fever, deforming arthritis, splenomegaly with cytopenias, hypohidrosis or
  anhidrosis from birth, hyposalivation, dental caries and short dental roots,
  headaches with premature basal ganglia mineralisation, and elevated CRP and
  TNF. Penetrance appears complete, but expressivity varies widely, even within
  families.
disease_term:
  preferred_term: ROSAH syndrome
  term:
    id: MONDO:0013999
    label: retinal dystrophy, optic nerve edema, splenomegaly, anhidrosis, and migraine headache syndrome
synonyms:
- ROSAH
- ROSAH syndrome
- ALPK1-related autoinflammatory disease
- optic nerve edema-splenomegaly syndrome
- retinal dystrophy, optic nerve edema, splenomegaly, anhidrosis, and headache
pathophysiology:
- name: ALPK1 Gain-of-Function Missense Variants
  description: >-
    Heterozygous missense variants in the N-terminal ADP-heptose-binding domain
    of ALPK1 (recurrent p.Thr237Met; also p.Tyr254Cys and p.Ser277Phe) are the
    initiating lesion. Transfected mutant proteins show constitutive
    NF-kappaB activity that wild-type ALPK1 does not.
  biological_scale: MOLECULAR
  gene:
    preferred_term: ALPK1
    term:
      id: hgnc:20917
      label: ALPK1
  molecular_functions:
  - preferred_term: protein serine/threonine kinase activity
    modifier: GAIN_OF_FUNCTION
    term:
      id: GO:0004674
      label: protein serine/threonine kinase activity
  evidence:
  - reference: PMID:30967659
    reference_title: "ALPK1 missense pathogenic variant in five families leads to ROSAH syndrome, an ocular multisystem autosomal dominant disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Heterozygosity for ALPK1, p.Thr237Met leads to ROSAH syndrome, an autosomal dominant ocular systemic disorder."
    explanation: Discovery study in five families establishing ALPK1 p.Thr237Met as the cause.
  - reference: PMID:35868845
    reference_title: "Gain-of-function mutations in ALPK1 cause an NF-κB-mediated autoinflammatory disease: functional assessment, clinical phenotyping and disease course of patients with ROSAH syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Transiently transfected mutant proteins had increased constitutive NF-κB activity relative to the wild-type protein."
    explanation: Reporter assays show that ROSAH ALPK1 variants are gain-of-function alleles.
  downstream:
  - target: Loss of ALPK1 Ligand Specificity
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:38060563
      reference_title: "ALPK1 mutants causing ROSAH syndrome or Spiradenoma are activated by human nucleotide sugars."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "they can also be activated by nucleotide sugars present in human cells (UDP-mannose, ADP-ribose, and cyclic ADP-ribose) which can be prevented by disruption of the ADP-heptose binding site"
      explanation: The T237M mutant, unlike wild-type ALPK1, responds to endogenous nucleotide sugars through its ADP-heptose binding site.
  - target: Eccrine Sweat Gland Dysfunction
    causal_link_type: UNKNOWN
  - target: Defective Primary Ciliogenesis
    causal_link_type: UNKNOWN
    hypothesis_groups:
    - ciliopathy_model
    evidence:
    - reference: PMID:30967659
      reference_title: "ALPK1 missense pathogenic variant in five families leads to ROSAH syndrome, an ocular multisystem autosomal dominant disorder."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Affected family member fibroblasts demonstrated defective ciliogenesis."
      explanation: Patient fibroblasts carrying p.Thr237Met showed defective ciliogenesis.
- name: Loss of ALPK1 Ligand Specificity
  description: >-
    Wild-type ALPK1 is a cytosolic pattern-recognition receptor that is
    activated when bacterial ADP-heptose binds its N-terminal domain. The ROSAH
    mutants can also be activated by host nucleotide sugars (UDP-mannose,
    ADP-ribose, cyclic ADP-ribose), so the kinase signals without infection.
    The authors propose this loss of specificity as the basis of the disease.
  biological_scale: MOLECULAR
  gene:
    preferred_term: ALPK1
    term:
      id: hgnc:20917
      label: ALPK1
  molecular_functions:
  - preferred_term: pattern recognition receptor activity
    modifier: ABNORMAL
    term:
      id: GO:0038187
      label: pattern recognition receptor activity
  evidence:
  - reference: PMID:30111836
    reference_title: "Alpha-kinase 1 is a cytosolic innate immune receptor for bacterial ADP-heptose."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "ADP-Hep directly binds the N-terminal domain of ALPK1, stimulating its kinase domain to phosphorylate and activate TIFA."
    explanation: Defines the normal ligand and the domain the ROSAH variants alter.
  - reference: PMID:38060563
    reference_title: "ALPK1 mutants causing ROSAH syndrome or Spiradenoma are activated by human nucleotide sugars."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We propose that the loss of the specificity of ALPK1 for bacterial ADP-heptose underlies ROSAH syndrome"
    explanation: Biochemical study proposing loss of ligand specificity as the disease mechanism.
  downstream:
  - target: Constitutive TIFA Phosphorylation and TIFAsome Assembly
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:37072480
      reference_title: "In vitro kinase assay reveals ADP-heptose-dependent ALPK1 autophosphorylation and altered kinase activity of disease-associated ALPK1 mutants."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "T237M and V1092A mutations associated with ROSAH syndrome and spiradenoma/spiradenocarcinoma respectively, exhibit enhanced ADPH-induced kinase activity and constitutive assembly of TIFAsomes."
      explanation: The T237M mutant assembles TIFA oligomers constitutively.
- name: Constitutive TIFA Phosphorylation and TIFAsome Assembly
  description: >-
    Activated ALPK1 phosphorylates TIFA on threonine 9, which drives TIFA
    oligomerisation into TIFAsomes that recruit TRAF6. ROSAH mutants assemble
    TIFAsomes and activate a TIFA-dependent NF-kappaB/AP-1 reporter without
    ADP-heptose.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: TIFA
    term:
      id: hgnc:19075
      label: TIFA
  evidence:
  - reference: PMID:38060563
    reference_title: "ALPK1 mutants causing ROSAH syndrome or Spiradenoma are activated by human nucleotide sugars."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "unlike wild-type (WT) ALPK1, the disease-causing ALPK1 mutants trigger the TIFA-dependent activation of an NF-κB/activator protein 1 reporter gene in the absence of ADP-heptose"
    explanation: Ligand-independent, TIFA-dependent signalling by the ROSAH mutants.
  downstream:
  - target: Constitutive Canonical NF-kappaB Activation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:37072480
      reference_title: "In vitro kinase assay reveals ADP-heptose-dependent ALPK1 autophosphorylation and altered kinase activity of disease-associated ALPK1 mutants."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "This leads to the assembly of large TIFA oligomers called TIFAsomes, activation of NF-κB and pro-inflammatory gene expression."
      explanation: TIFAsome assembly is the step that couples ALPK1 to NF-kappaB.
- name: Constitutive Canonical NF-kappaB Activation
  description: >-
    Patient fibroblasts and transfected cells show increased phosphorylation
    of IKKalpha/beta and IkappaBalpha, IkappaBalpha degradation and p38/JNK
    MAPK activation. Whole-blood transcriptomes of untreated patients show
    activated innate immune pathways. Among immune cells, ALPK1 is most highly
    transcribed in neutrophils.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: canonical NF-kappaB signal transduction
    term:
      id: GO:0007249
      label: canonical NF-kappaB signal transduction
  cell_types:

- name: Salivary Gland Inflammation and Atrophy
  description: >-
    Labial salivary glands show focal lymphocytic infiltrates, glandular atrophy
    with fat replacement and mild fibrosis. Salivary flow is reduced, and the
    dental caries follow a Sjogren-like pattern, but without anti-SSA/SSB
    antibodies. The eccrine and mammary gland defects (anhidrosis from birth,
    failure to lactate) also involve exocrine glands, but no study has shown
    that they share a mechanism.
  biological_scale: TISSUE
  locations:
  - preferred_term: saliva-secreting gland
    term:
      id: UBERON:0001044
      label: saliva-secreting gland
  evidence:
  - reference: PMID:35868845
    reference_title: "Gain-of-function mutations in ALPK1 cause an NF-κB-mediated autoinflammatory disease: functional assessment, clinical phenotyping and disease course of patients with ROSAH syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Histopathologic analysis of ROSAH labial salivary glands revealed focal inflammation (foci of lymphocytic infiltrate), glandular atrophy with adipocytic replacement and focal mild fibrosis"
    explanation: Salivary gland histopathology in ROSAH patients.
  downstream:

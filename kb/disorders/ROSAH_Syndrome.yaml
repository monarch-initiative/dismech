treatments:
- name: IL-6 Receptor Blockade
  description: >-
    Tocilizumab is the only anticytokine therapy reported to improve
    intraocular inflammation (two of two patients in the NIH cohort, and a
    later case with rapid reduction of macular edema and optic disc swelling).
    Vision already lost to retinal damage does not recover.
  action_category: THERAPEUTIC
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:

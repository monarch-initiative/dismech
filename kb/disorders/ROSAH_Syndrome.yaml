      term:
        id: NCIT:C84217
        label: Tocilizumab
  target_mechanisms:
  - target: Proinflammatory Cytokine Overproduction
    treatment_effect: INHIBITS
  - target: Intraocular Inflammation
    treatment_effect: INHIBITS
    evidence:

    causal_link_type: DIRECT
  - target: Retinal Vasculitis
    causal_link_type: DIRECT
  - target: Cystoid Macular Edema
    causal_link_type: DIRECT
  - target: Cone-Rod Retinal Degeneration
    causal_link_type: UNKNOWN
    hypothesis_groups:
    - inflammation_model
    description: >-
      Whether the retinal degeneration follows from chronic inflammation, from a
      cell-intrinsic photoreceptor defect, or both, is unresolved. Degeneration
      can progress after inflammation is controlled.
    evidence:
    - reference: PMID:40201710
      reference_title: "Case Report: ROSAH syndrome presents diagnostic and therapeutic challenges."
      supports: REFUTE
      evidence_source: HUMAN_CLINICAL
      snippet: "While the proband's macular edema improved with intravitreal dexamethasone and systemic tocilizumab, immune suppression did not prevent retinal degeneration."
      explanation: Degeneration continued after the inflammation was suppressed.
- name: Defective Primary Ciliogenesis
  description: >-
    The discovery study found ALPK1 at the basal body of the photoreceptor
    connecting cilium, at centrioles and at the base of primary cilia, and
    defective ciliogenesis in patient fibroblasts. It proposed ROSAH as a
    ciliopathy, like other syndromic retinal dystrophies. Later work reframed
    the disease as autoinflammatory, and this branch has not been followed up.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: cilium assembly
    term:
      id: GO:0060271
      label: cilium assembly
  cell_types:

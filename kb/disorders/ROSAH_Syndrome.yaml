    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Adult mouse retinal section stained with anti-Alpk1 (green, MyBioSource, cat #MBS001969), and DAPI (blue) shows expression of Alpk1 in the RPE and connecting cilium region of the photoreceptor cells."
    explanation: >-
      Immunofluorescence in adult mouse retina places Alpk1 at the photoreceptor
      connecting cilium, supporting a possible ciliary role. The human data in
      this paper are expression levels, not localisation.
  downstream:
  - target: Cone-Rod Retinal Degeneration
    causal_link_type: UNKNOWN
    hypothesis_groups:
    - ciliopathy_model
- name: Cone-Rod Retinal Degeneration
  description: >-
    Progressive degeneration resembling a cone-rod dystrophy, with atrophy
    beginning at the posterior pole and spreading peripherally, causing loss of
    central and colour vision. Onset and course vary widely, even within one
    family. Its cause is unresolved. Two models are recorded: a consequence of
    chronic intraocular inflammation (inflammation_model) and a ciliary defect
    (ciliopathy_model). Degeneration can progress after inflammation is
    controlled, so it is probably not purely inflammatory.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: photoreceptor cell
    term:
      id: CL:0000210
      label: photoreceptor cell
  locations:
  - preferred_term: retina
    term:
      id: UBERON:0000966
      label: retina
  evidence:

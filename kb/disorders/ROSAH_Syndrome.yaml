    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "showed increased phosphorylation of IκBα, IKKα/β, and MAP kinases p38 and JNK, which are hallmarks of the activated canonical NF-κB pathway"
    explanation: Patient-derived fibroblasts show activated canonical NF-kappaB signalling.
  - reference: PMID:35868845
    reference_title: "Gain-of-function mutations in ALPK1 cause an NF-κB-mediated autoinflammatory disease: functional assessment, clinical phenotyping and disease course of patients with ROSAH syndrome."

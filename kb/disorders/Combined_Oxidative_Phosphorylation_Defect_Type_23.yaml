  - target: Arrhythmia
  - target: Congestive Heart Failure
- name: Thalamic and Brainstem Injury
  biological_scale: TISSUE
  description: >-
    The neurological half of the presentation, and the feature that separates this disease
    from MTO1 deficiency in the founding series: most GTPBP3 patients developed neurological
    symptoms with MRI involvement of thalamus, putamen and brainstem resembling Leigh
    syndrome. Bilateral thalamic lesions, interpreted as metabolic oedema, are the
    characteristic imaging clue and were present in both severely affected patients imaged and
    in six of ten mildly affected ones.

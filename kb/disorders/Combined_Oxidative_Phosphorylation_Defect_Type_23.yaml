    snippet: "consistent with the predicted function of the protein in catalyzing the formation of 5-taurinomethyluridine (τm(5)U) in the anticodon wobble position of five mitochondrial tRNAs."
    explanation: >-
      The enzymatic step, and the number of tRNA substrates that depend on it. Note the
      founding paper states this as the predicted function rather than as one it measured.
  - reference: PMID:41957021

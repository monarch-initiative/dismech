- name: Cellular Energy Deficit and Lactate Overproduction
  biological_scale: CELLULAR
  description: >-
    Pyruvate that cannot be oxidised through a failing respiratory chain is reduced to lactate
    to regenerate NAD+. Raised lactate is the most constant metabolic abnormality in this
    disease across the published series, in blood, in cerebrospinal fluid and on brain
    spectroscopy, and in the severe cluster it presents as decompensated metabolic acidosis.
  biological_processes:
  - preferred_term: mitochondrial ATP synthesis coupled electron transport
    modifier: DECREASED
    term:
      id: GO:0042775
      label: mitochondrial ATP synthesis coupled electron transport
  evidence:
  - reference: PMID:38327089
    reference_title: "Biallelic variants in GTPBP3: New patients, phenotypic spectrum, and outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Increase of lactate in biological fluids and brain (when examined) is the most constant metabolic alteration."
    explanation: >-
      The consistency of the lactate finding across the reviewed literature, and the
      compartments in which it has been measured.
  - reference: PMID:25434004
    reference_title: "Mutations in GTPBP3 cause a mitochondrial translation defect associated with hypertrophic cardiomyopathy, lactic acidosis, and encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

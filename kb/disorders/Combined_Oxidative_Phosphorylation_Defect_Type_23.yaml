inheritance:
- name: Autosomal recessive inheritance
  description: >-
    GTPBP3 is nuclear-encoded and autosomal, and every reported family is biallelic - either
    homozygous, typically in consanguineous unions, or compound heterozygous. Segregation has
    been demonstrated repeatedly: in the Italian sibship both variants were inherited one
    from each parent, were present in the affected sister and absent in a healthy brother;
    in an adult hypertrophic cardiomyopathy case the two alleles traced to the mother and the
    paternal grandmother respectively. The homozygous-versus-compound-heterozygous
    distinction is not merely bookkeeping here - homozygosity is over-represented in the
    severe cluster.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:25434004
    reference_title: "Mutations in GTPBP3 cause a mitochondrial translation defect associated with hypertrophic cardiomyopathy, lactic acidosis, and encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "By whole-exome and candidate gene sequencing, we identified 11 individuals from 9 families carrying compound heterozygous or homozygous mutations in GTPBP3, encoding the mitochondrial GTP-binding protein 3."
    explanation: >-
      The founding series, with the biallelic configuration in both of its forms and the
      number of families it rests on.
  - reference: PMID:37029485
    reference_title: "Novel insights on GTPBP3-associated hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Family segregation analysis showed that the patient's mother is a carrier of variant c.181G>C and the patient's paternal grandmother is a carrier of variant c.1199C>T in the GTPBP3 gene, which is in accordance with an autosomal recessive model of inheritance of the disease."
    explanation: >-
      Explicit two-parent segregation in an adult case, which is the cleanest single
      demonstration of the recessive mode in this literature.
  - reference: CGGV:assertion_393ee652-756b-4b54-9e0a-916bbae9d9eb-2024-05-23T040000.000Z
    reference_title: "GTPBP3 / mitochondrial disease (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "GTPBP3 | HGNC:14880 | mitochondrial disease | MONDO:0044970 | AR | Definitive | SOP10"
    explanation: >-
      Independent expert-panel classification of the inheritance mode and the strength of the
      gene-disease relationship. Graded OTHER because a curation assertion is an expert
      judgement rather than a study.
pathophysiology:
- name: Biallelic GTPBP3 Variant
  biological_scale: MOLECULAR
  description: >-
    Two damaged copies of GTPBP3. The allelic spectrum is broad - missense, frameshift,
    in-frame deletion, nonsense and splice-site changes are all reported - and the mechanism
    is loss of function. Two quantitative observations give that reading its force: loss-of-
    function variants are markedly over-represented in patients relative to gnomAD, and
    patient variants cluster significantly in the TrmE-type G domain that binds guanine
    nucleotides and Mg2+ and hydrolyses GTP. The recurrent c.689A>C (p.Gln230Pro) allele is a
    hotspot, particularly in Chinese cohorts.
  genes:
  - preferred_term: GTPBP3
    term:
      id: hgnc:14880
      label: GTPBP3
  genetic_context:
    genes:
    - preferred_term: GTPBP3
      term:
        id: hgnc:14880
        label: GTPBP3
    allele_type: missense, frameshift, in-frame deletion, nonsense and splice-site alleles
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Biallelic in every reported family, homozygous or compound heterozygous. ClinGen
      records loss of function as the mechanism of disease.
    notes: >-
      The zygosity slot is single-valued and HOMOZYGOUS is chosen because homozygosity is the
      configuration that carries the genotype-phenotype signal in this disease - it is
      significantly over-represented in the severe cluster. Compound heterozygosity is at
      least as common overall and is recorded in the description and in the inheritance
      block. The loss-of-function category is not a default: it rests on the
      over-representation of loss-of-function alleles relative to population data, on the
      clustering of patient variants in the catalytic G domain, and on direct measurement of
      reduced GTPase activity for individual alleles.
  evidence:
  - reference: PMID:36980825
    reference_title: "Pathogenicity Analysis of a Novel Variant in GTPBP3 Causing Mitochondrial Disease and Systematic Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Compared with the variants in gnomAD, the proportion of LOFVs in GTPBP3 was higher in COXPD23 patients (48.6% versus 8.9%, p < 0.0001 ****), and 31% of them were frameshift variants, showing the LOF mechanism of GTPBP3."
    explanation: >-
      The population-genetic argument for a loss-of-function mechanism, with the comparison
      that makes it quantitative rather than assumed.
  - reference: PMID:36980825
    reference_title: "Pathogenicity Analysis of a Novel Variant in GTPBP3 Causing Mitochondrial Disease and Systematic Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Additionally, the variants in patients were significantly enriched in the TrmE-type G domain, indicating that the G domain was crucial for GTPBP3 protein function."
    explanation: >-
      Where in the protein the disease alleles sit, which localises the loss of function to
      the catalytic GTPase domain rather than leaving it unlocalised.
  - reference: PMID:39719609
    reference_title: "Expanding the phenotypic and genetic spectrum of GTPBP3 deficiency: findings from nine Chinese pedigrees."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Analysis of the genetic spectrum in the Chinese population highlighted a concentration in exons 4 and 6, with c.689A > C being the prominent hotspot."
    explanation: The recurrent allele and its exonic distribution in the largest single-population series.
  downstream:
  - target: Loss of Taurinomethyluridine Modification of Mitochondrial tRNAs
    causal_link_type: DIRECT
- name: Loss of Taurinomethyluridine Modification of Mitochondrial tRNAs
  biological_scale: MOLECULAR
  description: >-
    GTPBP3 and MTO1 jointly catalyse the formation of 5-taurinomethyluridine at the wobble
    (position 34) uridine of five mitochondrial tRNAs - those for Gln, Glu, Lys, Leu(UUR) and
    Trp. GTPBP3 contributes the potassium-dependent GTPase activity and binds
    methylene-tetrahydrofolate; the modification promotes decoding at cognate codons and
    restricts mispairing at near-cognate ones. Patient alleles reduce or abolish that
    activity, and structural work on individual variants shows multimerisation, aggregation
    and proteasomal degradation of the protein as the route to it.

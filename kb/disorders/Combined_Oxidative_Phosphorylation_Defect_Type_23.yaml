prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: BELOW_1_IN_1000000
  notes: >-
    An ultra-rare disease. Eleven patients from nine families in the 2014 founding series;
    twenty cases in the 2024 literature review; thirty-five variants across thirty pedigrees
    from eight countries by 2026. No population-based estimate exists, and none could be made
    from an ascertainment that runs through exome sequencing of children with cardiomyopathy
    and lactic acidosis. The prevalence_class is the numeric floor tier; no rate_per_100000 is
    given because none has been reported.
  evidence:
  - reference: PMID:38327089
    reference_title: "Biallelic variants in GTPBP3: New patients, phenotypic spectrum, and outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "COXPD23 is an ultrarare mitochondrial encephalopathy"
    explanation: The rarity as the reviewing authors state it.
  - reference: PMID:41957021
    reference_title: "Molecular pathogenesis and gene therapy-based intervention of GTPBP3-related mitochondrial disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To date, 35 hGTPBP3 genetic variants were identified in 30 pedigrees from eight countries"
    explanation: >-
      The cumulative count as of the most recent report, which is the closest thing to a
      denominator this literature offers.
progression:
- phase: Early-onset severe encephalopathy with cardiogenic shock
  notes: >-
    Eight of the twenty reviewed patients follow this course: fatal encephalopathy,
    cardiogenic shock and decompensated metabolic acidosis in infancy or early childhood.
    Arrhythmia and congestive heart failure are frequent in this group, and mortality is in
    early childhood. Homozygosity is significantly over-represented here relative to compound
    heterozygosity.
  evidence:
  - reference: PMID:38327089
    reference_title: "Biallelic variants in GTPBP3: New patients, phenotypic spectrum, and outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "an early‐onset presentation with severe fatal encephalopathy, cardiogenic shock, and decompensated metabolic acidosis (in 8 patients)"
    explanation: The severe cluster with its count, as the reviewed literature defines it.
  - reference: PMID:36980825
    reference_title: "Pathogenicity Analysis of a Novel Variant in GTPBP3 Causing Mitochondrial Disease and Systematic Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The proportion of homozygous variants (71.4%) significantly differed from that of compound heterozygous variants (18.1%) in the severe type."
    explanation: >-
      The genotype association with the severe course, which is the only genotype-phenotype
      signal reported for this disease.
- phase: Later-onset milder course with progressive cardiomyopathy
  notes: >-
    Twelve of the twenty reviewed patients: developmental delay leading to intellectual
    disability, epilepsy in five and exercise intolerance in three, with symptoms often absent
    until late infancy or early childhood. Late onset is the most reliable prognostic factor -
    neither lactate levels nor MRI findings predict severity. The cardiomyopathy rather than
    the brain lesions determines outcome in seven of these twelve. The oldest reported patient
    died at 27 years of poly-organ failure, and one man was still being investigated for
    hypertrophic cardiomyopathy at 25.
  evidence:
  - reference: PMID:38327089
    reference_title: "Biallelic variants in GTPBP3: New patients, phenotypic spectrum, and outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with a milder phenotype may not show clinical symptoms until late infancy or early childhood, suggesting that the late onset is the most reliable prognostic factor."
    explanation: >-
      The prognostic conclusion of the review, and the one it prefers over biochemical or
      imaging markers.
  - reference: PMID:38327089
    reference_title: "Biallelic variants in GTPBP3: New patients, phenotypic spectrum, and outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The literature review shows that neither the lactate levels nor the MRI findings seem to predict the severity of the disease."
    explanation: >-
      The negative that gives the previous statement its force: the obvious biomarkers do not
      work as prognostic markers here.
  - reference: CGGV:assertion_393ee652-756b-4b54-9e0a-916bbae9d9eb-2024-05-23T040000.000Z
    reference_title: "GTPBP3 / mitochondrial disease (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The outcomes are variable as some individuals live into the teens and at least one reported individual lived to the third decade (PMID: 37029485)."
    explanation: >-
      The upper end of the survival range, from an independent synthesis. Graded OTHER because
      a curation narrative is an expert judgement rather than a study.
genetic:
- name: GTPBP3
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: GTPBP3
    term:
      id: hgnc:14880
      label: GTPBP3
  notes: >-
    GTPBP3 is a nuclear gene on chromosome 19p13.11 encoding mitochondrial GTP-binding
    protein 3, the GTPase half of the two-enzyme system that installs 5-taurinomethyluridine
    on five mitochondrial tRNAs. ClinGen's Mitochondrial Diseases expert panel classifies the
    gene-disease relationship as Definitive with loss of function as the mechanism, and has
    lumped every GTPBP3 phenotype into one entity.

    A naming trap worth recording. ClinGen curated this gene twice: against Leigh syndrome
    spectrum in 2020, reaching Moderate, and then against primary mitochondrial disease in
    2024, reaching Definitive. The later curation explicitly includes the three cases from the
    earlier one. Both assertions are live in the ClinGen download, and a curator who picks the
    2020 record will report a weaker classification against a narrower disease than the panel
    currently holds. This entry cites the 2024 record.

    A second trap, in the literature rather than the ontology. One 2026 report gives COXPD23
    the OMIM number 608536; that is the number for the GTPBP3 gene, and the disease is OMIM
    616198. The entry uses 616198 and does not repeat the error.
  evidence:
  - reference: CGGV:assertion_393ee652-756b-4b54-9e0a-916bbae9d9eb-2024-05-23T040000.000Z
    reference_title: "GTPBP3 / mitochondrial disease (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In summary, there is definitive evidence to support the relationship between GTPBP3 and primary mitochondrial disease."
    explanation: >-
      The strength-of-evidence judgement, which is Definitive rather than Moderate and is what
      makes this a settled gene-disease relationship rather than a candidate one.
  - reference: CGGV:assertion_393ee652-756b-4b54-9e0a-916bbae9d9eb-2024-05-23T040000.000Z
    reference_title: "GTPBP3 / mitochondrial disease (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Of note, GTPBP3 was first curated by this Expert Panel for its association with Leigh syndrome spectrum (LSS) on January 13, 2020 (SOP v7), with a final classification of Moderate."
    explanation: >-
      The earlier, weaker assertion that a curator may find first, recorded here so the trap
      is documented rather than rediscovered.
  - reference: PMID:25434004
    reference_title: "Mutations in GTPBP3 cause a mitochondrial translation defect associated with hypertrophic cardiomyopathy, lactic acidosis, and encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our study of a mitochondrial translation disorder points toward the importance of posttranscriptional modification of mitochondrial tRNAs for proper mitochondrial function."
    explanation: The conclusion the founding series draws about the class of disease this belongs to.
diagnosis:
- name: Exome or panel sequencing prompted by cardiomyopathy with lactic acidosis
  description: >-
    Every reported family was solved by sequencing rather than by enzymology, and the
    presentation that prompts it is hypertrophic cardiomyopathy with raised lactate in a
    child. Muscle respiratory chain analysis supports the diagnosis but does not make it: the
    deficiencies are variable, one of the nine founding families did not show them, and the
    features are shared with MTO1 deficiency and the other mitochondrial translation defects.
    Bilateral thalamic lesions on MRI are the most useful imaging pointer. In adults the
    entry point may be cardiological rather than metabolic - one 25-year-old was referred for
    genetic testing of hypertrophic cardiomyopathy after a negative targeted PRKAG2 screen.
  evidence:
  - reference: PMID:37029485
    reference_title: "Novel insights on GTPBP3-associated hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A 25-year old male with hypertrophic cardiomyopathy and fasciculoventricular accessory pathway was referred for genetic testing by his cardiologist."
    explanation: >-
      The adult diagnostic route, which is different from the paediatric one and is why this
      diagnosis should not be excluded on age.
  - reference: PMID:38327089
    reference_title: "Biallelic variants in GTPBP3: New patients, phenotypic spectrum, and outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Next‐generation sequencing, taking into account the phenotype of the patient, led to the identification of two heterozygous missense variants in the GTPBP3 gene"
    explanation: The phenotype-directed sequencing route that solved the Italian sibship.
differential_diagnoses:
- name: MTO1 deficiency (COXPD10)
  description: >-
    The closest differential by some distance, and the one this entry exists to distinguish
    itself from. MTO1 encodes the partner subunit of the same wobble-uridine taurinomethylation
    enzyme, and MTO1 deficiency presents with the same infantile hypertrophic cardiomyopathy
    with lactic acidosis. dismech curates it separately as MTO1_Deficiency. Two things
    separate the two entities. Clinically, the founding GTPBP3 series observed that, unlike
    MTO1 patients, most GTPBP3 patients develop neurological symptoms with thalamic, putaminal
    and brainstem MRI involvement resembling Leigh syndrome. Cellularly, the two defects drive
    the HIF-PPAR-gamma-UCP2-AMPK axis in opposite directions. Neither difference is a
    diagnostic test - separation in practice rests on sequencing - but the second is the only
    known biological asymmetry between two defects in one reaction.
  evidence:
  - reference: PMID:25434004
    reference_title: "Mutations in GTPBP3 cause a mitochondrial translation defect associated with hypertrophic cardiomyopathy, lactic acidosis, and encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast to individuals with mutations in MTO1, the protein product of which is predicted to participate in the generation of the same modification, most individuals with GTPBP3 mutations developed neurological symptoms and MRI involvement of thalamus, putamen, and brainstem resembling Leigh syndrome."
    explanation: >-
      The clinical contrast, drawn by the authors who defined the entity, against the disease
      it is most easily confused with.
  - reference: PMID:29348686
    reference_title: "Defects in the mitochondrial-tRNA modification enzymes MTO1 and GTPBP3 promote different metabolic reprogramming through a HIF-PPARγ-UCP2-AMPK axis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Unexpectedly, this response is different from that triggered by the GTPBP3 defect, as GTPBP3-depleted cells exhibit AMPK activation, increased levels of UCP2 and PPARγ, and inactivation of HIF-1."
    explanation: The cellular asymmetry between the two defects, measured in each.
- name: Other nuclear mitochondrial translation and tRNA-modification defects
  description: >-
    TRMU, which 2-thiolates the same wobble uridine, and the wider class of nuclear defects in
    mitochondrial protein synthesis - mitoribosomal proteins, aminoacyl-tRNA synthetases,
    MTFMT, TSFM and TUFM - all produce infantile cardiomyopathy with lactic acidosis and a
    combined respiratory chain defect. None can be separated from COXPD23 on phenotype. The
    common route to all of them is the same exome or panel that finds GTPBP3.
  evidence:
  - reference: PMID:25434004
    reference_title: "Mutations in GTPBP3 cause a mitochondrial translation defect associated with hypertrophic cardiomyopathy, lactic acidosis, and encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Respiratory chain deficiencies exhibit a wide variety of clinical phenotypes resulting from defective mitochondrial energy production through oxidative phosphorylation."
    explanation: >-
      The phenotypic non-specificity of the class this disease belongs to, which is what makes
      the differential a sequencing problem rather than a clinical one.
animal_models:
- name: gtpbp3 knockout zebrafish
  species: Zebrafish
  genotype: gtpbp3 knockout generated by CRISPR/Cas9
  publication: PMID:30916346
  description: >-
    A CRISPR/Cas9 gtpbp3 knockout in zebrafish, and the model that supplies the tissue-level
    account this disease otherwise lacks. Loss of gtpbp3 altered tRNA folding and, unexpectedly,
    globally increased mitochondrial tRNA aminoacylation efficiency; it impaired mitochondrial
    translation, produced proteostasis stress and altered respiratory chain complex activities.
    The animals developed abnormal embryonic heart development with reduced ventricular
    fractional shortening, cardiomyocyte hypertrophy and myocardial fibre disarray.
  modeled_mechanisms:
  - target: Cardiomyocyte Bioenergetic Failure and Hypertrophic Remodeling
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The knockout reproduces the cardinal cardiac phenotype of the human disease at both the
      functional and histological level, which is what makes it usable as the tissue-level
      evidence for a node that has never been biopsied in a patient.
    limitations: >-
      A complete knockout in a fish, against biallelic missense and truncating alleles in
      humans, several of which retain partial activity. The cardiac readout is embryonic and
      the human cardiomyopathy is progressive over years. Nothing here models the encephalopathy
      or the thalamic lesions, which are the features that distinguish this disease from MTO1
      deficiency. And one of the model's own findings - globally increased tRNA aminoacylation -
      has no reported human counterpart.
    readouts:
    - name: Cardiomyocyte size and myocardial fibre architecture
      target: Cardiomyocyte Bioenergetic Failure and Hypertrophic Remodeling
      direction: INCREASED
      interpretation: >-
        Cardiomyocytes are hypertrophic and ventricular myofibres are disarrayed in the
        knockout, matching the human histological description of hypertrophic cardiomyopathy.
      evidence:
      - reference: PMID:30916346
        reference_title: "Deletion of Gtpbp3 in zebrafish revealed the hypertrophic cardiomyopathy manifested by aberrant mitochondrial tRNA metabolism."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Notably, the gtpbp3 knock-out zebrafish exhibited hypertrophy of cardiomyocytes and myocardial fiber disarray in ventricles."
        explanation: The histological readout, which is the part that cannot be obtained from patients.
  evidence:
  - reference: PMID:30916346
    reference_title: "Deletion of Gtpbp3 in zebrafish revealed the hypertrophic cardiomyopathy manifested by aberrant mitochondrial tRNA metabolism."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These cardiac defects in the gtpbp3 knock-out zebrafish recapitulated the clinical phenotypes in HCM patients carrying the GTPBP3 mutation(s)."
    explanation: >-
      The authors' own claim about the model's reach, which is what licenses treating it as
      informative for the human cardiac node.
- name: Gtpbp3 patient-allele knock-in mice
  species: Mouse
  genotype: homozygous E230P, homozygous N374D, and compound heterozygous E230P/N374D knock-in
  publication: PMID:41957021
  description: >-
    The first mammalian models of this disease, reported in 2026 and built to carry the
    patient's own alleles rather than a null. The result splits by genotype: homozygous N374D
    is embryonic lethal, while homozygous E230P and compound heterozygous E230P/N374D animals
    survive and develop cardiac and muscular dysfunction attributed to altered mitochondrial
    translation. That split is itself informative, because the two alleles came from one
    compound-heterozygous patient.
  modeled_mechanisms:
  - target: Impaired Mitochondrial Translation
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      The surviving knock-in genotypes develop cardiac and muscular dysfunction that the
      authors attribute to altered mitochondrial translation, which is the same causal step the
      human entry asserts.
    limitations: >-
      A mouse, and one reported in a single 2026 paper with no independent replication. The
      lethal genotype cannot be studied postnatally at all, so the model covers the milder half
      of the allelic range by construction. The mouse phenotype is described as cardiac and
      muscular; no thalamic or encephalopathic phenotype is reported, so the neurological half
      of the human disease remains unmodelled in any mammal.
    readouts:
    - name: Survival by knock-in genotype
      target: Impaired Mitochondrial Translation
      direction: ALTERED
      interpretation: >-
        Homozygous N374D is embryonic lethal while homozygous E230P and the compound
        heterozygote survive with cardiac and muscular dysfunction, so allele severity orders
        the mouse phenotype as it appears to order the human one.
      evidence:
      - reference: PMID:41957021
        reference_title: "Molecular pathogenesis and gene therapy-based intervention of GTPBP3-related mitochondrial disease."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Homozygous N374D mutations in mice cause embryonic lethality; homozygous E230P or compound heterozygous E230P/N374D knock-in mice develop cardiac and muscular dysfunction due to altered mitochondrial translation."
        explanation: The genotype-stratified outcome, with the mechanism the authors attribute it to.
  - target: Loss of Taurinomethyluridine Modification of Mitochondrial tRNAs
    relationship: RESCUES
    fidelity: MODERATE
    description: >-
      Virus-mediated expression of Gtpbp3 reversed the mitochondrial dysfunction and pathology
      in these animals as well as in cells, which is the first intervention result reported for
      this disease.
    limitations: >-
      Preclinical. This is a mouse rescue in a single study; no human trial exists and none is
      registered. The report does not establish durability, dose, delivery route in humans, or
      whether the neurological phenotype - absent from the mouse - would respond at all. Reading
      it as a therapy in prospect for patients would go beyond what the source claims.
    readouts:
    - name: Mitochondrial function and pathology after virus-mediated Gtpbp3 expression
      target: Loss of Taurinomethyluridine Modification of Mitochondrial tRNAs
      direction: RESTORED
      interpretation: >-
        Mitochondrial dysfunction and pathology reverse in both cells and animals after
        exogenous Gtpbp3 expression.
      evidence:
      - reference: PMID:41957021
        reference_title: "Molecular pathogenesis and gene therapy-based intervention of GTPBP3-related mitochondrial disease."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Mitochondrial dysfunction and pathology are efficiently reversed by virus-mediated GTPBP3 expression in cells and animals."
        explanation: The rescue result, stated at the level the authors state it.
  evidence:
  - reference: PMID:41957021
    reference_title: "Molecular pathogenesis and gene therapy-based intervention of GTPBP3-related mitochondrial disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "pathogenic studies based on mammalian animal models of hGTPBP3 deficiency are currently lacking"
    explanation: >-
      Why this model matters: the authors state that no mammalian model existed before it,
      which is what makes the knock-in the first of its kind rather than one of several.
treatments:
- name: Mitochondrial Cofactor and Antioxidant Supplementation
  description: >-
    The only pharmacological management reported for this disease is the generic mitochondrial
    cocktail. Both Italian siblings receive levocarnitine, thiamine, ascorbic acid, riboflavin
    and idebenone. The proband improved over five and a half years of follow-up - spoken
    language emerged and irritability and behavioural problems reduced - and his sister has a
    stable course. Whether the supplements caused the improvement is untested and untestable
    in two patients.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: levocarnitine
      term:
        id: CHEBI:16347
        label: (R)-carnitine
    - preferred_term: thiamine
      term:
        id: CHEBI:26948
        label: vitamin B1
    - preferred_term: ascorbic acid
      term:
        id: CHEBI:29073
        label: L-ascorbic acid
    - preferred_term: riboflavin
      term:
        id: CHEBI:17015
        label: riboflavin
    - preferred_term: idebenone
      term:
        id: CHEBI:31687
        label: idebenone
  notes: >-
    No effectiveness claim is made and none can be. The improvement described in the proband
    is uncontrolled, in one child, over a period in which spontaneous developmental progress is
    expected, and the source itself only reports the temporal association. No target_mechanisms
    link is declared for the same reason: asserting which node the cocktail acts on would
    manufacture a mechanism the source does not propose.

    On the agent bindings. Levocarnitine is bound to (R)-carnitine rather than to the
    racemic parent term, thiamine to vitamin B1 (which is the canonical CHEBI label for the
    neutral vitamin; thiamine(1+) is the cation and is not what a supplement delivers), and
    ascorbic acid to L-ascorbic acid rather than the stereochemistry-free parent. In each
    case preferred_term keeps the clinical name the source used.
  evidence:
  - reference: PMID:38327089
    reference_title: "Biallelic variants in GTPBP3: New patients, phenotypic spectrum, and outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "After the diagnosis, a treatment was started including levocarnitine (1 g/day), thiamine (300 mg/day), ascorbic acid (1 g/day), riboflavin (100 mg/day), and idebenone (400 mg/day)."
    explanation: The regimen with the doses used, in the only patients for whom one is reported.
  - reference: PMID:38327089
    reference_title: "Biallelic variants in GTPBP3: New patients, phenotypic spectrum, and outcome."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "During the last 5.5 years of follow‐up, a progressive clinical improvement was observed with the emergence of spoken language and reduction of irritability and behavioral issues."
    explanation: >-
      The observed course on treatment. INDIRECT because attributing the improvement to the
      supplements requires an inference the uncontrolled observation cannot support.
- name: Antiseizure Medication for Drug-Responsive Epilepsy
  description: >-
    The epilepsy of the milder cluster is drug-responsive, which is worth stating because it is
    not what a reader would assume of a mitochondrial encephalopathy. In the Italian sibship
    the sister's absence seizures responded to levetiracetam and lamotrigine.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: levetiracetam
      term:
        id: CHEBI:6437
        label: levetiracetam
    - preferred_term: lamotrigine
      term:
        id: CHEBI:6367
        label: lamotrigine
  target_mechanisms:
  - target: Seizure
    treatment_effect: MODULATES
    description: >-
      Symptomatic seizure control. Neither drug addresses the translation defect or anything
      upstream of the seizures.
  notes: >-
    One patient's regimen, reported without an outcome measure beyond the statement that the
    seizures were responsive. It is curated because drug responsiveness is a stated feature of
    the milder cluster in the reviewed literature, not because a two-drug combination in one
    girl constitutes evidence for a management strategy.
  evidence:
  - reference: PMID:38327089
    reference_title: "Biallelic variants in GTPBP3: New patients, phenotypic spectrum, and outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Seizures were responsive to levetiracetam and Lamotrigine."
    explanation: The named drugs and the response, in the one patient for whom both are reported.
discussions:
- discussion_id: coxpd23_vs_mto1_same_reaction_two_diseases
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - "pathophysiology#GTPBP3-Specific Metabolic Reprogramming"
  - "pathophysiology#Thalamic and Brainstem Injury"
  prompt: >-
    Why are GTPBP3 and MTO1 deficiency not the same disease, given that the two proteins
    catalyse the same modification?
  rationale: >-
    They should be the same disease and they nearly are. GTPBP3 and MTO1 form a complex and
    install one modification on five mitochondrial tRNAs; both deficiencies present as
    infantile hypertrophic cardiomyopathy with lactic acidosis, and the standard advice is that
    they are separated by sequencing rather than by phenotype. dismech curates them as separate
    entries, and MTO1_Deficiency lists this disease as its closest differential.

    Two asymmetries are nonetheless on record. The clinical one comes from the founding GTPBP3
    series: in contrast to MTO1 patients, most GTPBP3 patients developed neurological symptoms
    with thalamic, putaminal and brainstem MRI involvement resembling Leigh syndrome. The
    cellular one is sharper and more surprising. MTO1-deficient fibroblasts inactivate AMPK,
    down-regulate UCP2 and PPAR-gamma and activate HIF-1; GTPBP3-depleted cells do the exact
    opposite on all four. The authors of that study draw the obvious conclusion - that one of
    the two proteins must do something besides tRNA modification - and stop there.

    What remains open is which protein, and what the something is. The candidates are not
    equally testable: an additional GTPBP3 function, an additional MTO1 function, or a
    difference in how the two partial complexes behave when one subunit is missing rather than
    an extra function in either. A cytoplasm-localised GTPBP3 isoform has been described and
    called an unknown potential noncanonical function, which is at least a place to look. Until
    that is resolved, the clinical difference between the two entities has no mechanistic
    explanation, and this entry does not offer one.
  evidence:
  - reference: PMID:29348686
    reference_title: "Defects in the mitochondrial-tRNA modification enzymes MTO1 and GTPBP3 promote different metabolic reprogramming through a HIF-PPARγ-UCP2-AMPK axis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Therefore, the HIF-PPARγ-UCP2-AMPK axis is operating differently in MTO1- and GTPBP3-defective cells, which strongly suggests that one of these proteins has an additional role, besides mitochondrial-tRNA modification."
    explanation: The open question in the words of the study that raised it, with its own hedge attached.
  - reference: PMID:25434004
    reference_title: "Mutations in GTPBP3 cause a mitochondrial translation defect associated with hypertrophic cardiomyopathy, lactic acidosis, and encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast to individuals with mutations in MTO1, the protein product of which is predicted to participate in the generation of the same modification, most individuals with GTPBP3 mutations developed neurological symptoms and MRI involvement of thalamus, putamen, and brainstem resembling Leigh syndrome."
    explanation: The clinical half of the same asymmetry, observed in patients rather than in cells.
  proposed_experiments:
  - experiment_id: exp_coxpd23_reciprocal_reprogramming
    name: Test whether the reprogramming difference survives complementation
    description: >-
      Express wild-type GTPBP3 in MTO1-deficient cells and wild-type MTO1 in GTPBP3-deficient
      cells, and read out AMPK phosphorylation, UCP2, PPAR-gamma and HIF-1 in each. If the axis
      is driven by an extra function of one protein, only that protein's own complementation
      should normalise it, and cross-complementation should not. If instead the difference
      arises from how the residual partial complex behaves, both should partially normalise. The
      experiment distinguishes the two accounts without needing to identify the extra function
      first.
    readouts:
    - name: HIF-PPAR-gamma-UCP2-AMPK axis state after complementation
      target: "pathophysiology#GTPBP3-Specific Metabolic Reprogramming"
      direction: RESTORED
      interpretation: >-
        Normalisation only on same-gene complementation would support an additional function in
        one protein; partial normalisation in both directions would support a complex-level
        explanation instead.
    would_support:
    - "pathophysiology#GTPBP3-Specific Metabolic Reprogramming"
    supporting_outcome:
    - >-
      Gene-specific normalisation of the axis would establish that the divergence is a property
      of the individual protein rather than of the partial complex.
- discussion_id: coxpd23_gene_therapy_is_preclinical
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - treatments#
  - "animal_models#Mouse"
  prompt: >-
    Is there a disease-modifying treatment for COXPD23?
  rationale: >-
    Not for patients. What exists is a 2026 preclinical result: virus-mediated GTPBP3
    expression reversed mitochondrial dysfunction and pathology in patient-allele knock-in mice
    and in cells. That is the first intervention data of any kind for this disease and it is
    curated under animal_models, with its limitations attached, rather than under treatments.

    The gap between that and a therapy is wide and specific. The mouse models cover only the
    surviving genotypes - the homozygous N374D knock-in is embryonic lethal - so the severe end
    of the allelic range is unmodelled. The mouse phenotype is cardiac and muscular; no
    thalamic or encephalopathic phenotype is reported in any mammal, so the neurological half of
    the human disease has not been shown to respond to anything. No trial is registered. And the
    disease's own natural history complicates any future trial design: outcome in the milder
    cluster is determined by progression of cardiomyopathy over years, and neither lactate nor
    MRI predicts severity, so there is no validated surrogate endpoint to run a trial against.

    What patients actually receive is the generic mitochondrial cocktail - levocarnitine,
    thiamine, ascorbic acid, riboflavin, idebenone - and drug-responsive antiseizure medication
    where epilepsy is present. Neither is disease-modifying and neither is reported with a
    controlled outcome.
  evidence:
  - reference: PMID:41957021
    reference_title: "Molecular pathogenesis and gene therapy-based intervention of GTPBP3-related mitochondrial disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "This study provides valuable insights into the etiology of and promising intervention strategies for GTPBP3-related diseases."
    explanation: >-
      The claim the authors make for their own result - promising intervention strategies, not
      an available treatment.
  - reference: PMID:38327089
    reference_title: "Biallelic variants in GTPBP3: New patients, phenotypic spectrum, and outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The literature review shows that neither the lactate levels nor the MRI findings seem to predict the severity of the disease."
    explanation: >-
      Why a future trial has no obvious surrogate endpoint: the two candidate biomarkers do not
      track severity.
notes: >-
  Scope decision: DISEASE, curated as a standalone entry. COXPD types 4, 7, 13, 21, 26 and 30
  and deficiencies 42 and 51 are already curated as standalone per-gene entries, and
  MONDO:0014525 is a leaf under MONDO:0000732 with a single causal gene. The stub is deleted.

  The duplicate risk this entry was written against. GTPBP3 and MTO1 catalyse the same
  reaction and their diseases are near-phenocopies, so the obvious failure mode was to
  reproduce kb/disorders/MTO1_Deficiency.yaml with the gene name swapped. Three things were
  done to avoid that. First, the differential is stated explicitly in its own
  differential_diagnoses block, using the founding series' own contrast sentence, and it
  mirrors the entry MTO1_Deficiency already carries in the other direction. Second, the
  cellular asymmetry between the two defects is curated as its own pathophysiology node
  (GTPBP3-Specific Metabolic Reprogramming) rather than as prose, because it is the only known
  biological difference between them. Third, the phenotype frequencies here are taken from the
  GTPBP3 literature's own denominators - 11 patients in the founding series, 20 in the 2024
  review split 8 severe and 12 mild - and not from the MTO1 cohort, whose numbers would have
  been easy to reuse and would have been wrong.

  On frequency bands. Several bands in this entry rest on a qualitative statement rather than
  a count, and each says so in its own notes: arrhythmia, congestive heart failure, feeding
  difficulties, hypotonia and strabismus have no published numerator. Where a numerator exists
  it is given with its denominator and its cluster. Lactic acidosis is VERY_FREQUENT rather
  than OBLIGATE despite being 11/11 in the founding series, because that series was ascertained
  on a phenotype that included lactic acidosis and later mild patients show only modest
  elevation.

  What is deliberately not curated. No biochemical block: the respiratory chain enzymology and
  the lactate are the substantive measurements and are curated as pathophysiology nodes and
  phenotypes. No clinical trials - none is registered for this gene or disease. Heart-valve
  involvement is described in the nine-pedigree series and is deliberately not bound as a
  phenotype, because the source names no valve, no lesion and no patient count. Intrauterine
  growth restriction appears in ClinGen's feature list but in no primary source read here with
  a numerator, and is not bound. The 2026 gene-therapy rescue is curated under animal_models
  and not under treatments, because it is a mouse result; the reasoning is in the discussion
  coxpd23_gene_therapy_is_preclinical.

  Pathograph wiring. Every phenotype in this entry has an incoming edge. Two nodes are marked
  PROVISIONAL - the metabolic-reprogramming node, because the interpretation the authors draw
  from a measured divergence is explicitly hedged, and the two tissue nodes, because no
  myocardial or neuropathological tissue study exists in any GTPBP3 patient and both accounts
  rest on model organisms.

  On the ClinGen record. Two live assertions exist for this gene - Leigh syndrome spectrum
  (Moderate, 2020) and primary mitochondrial disease (Definitive, 2024) - and the later one
  explicitly subsumes the cases of the earlier. This entry cites the 2024 record; the trap is
  written into the genetic notes. The assertion was rebuilt during this curation because it was
  absent from the committed cache, using the ClinGen gene-validity CSV as downloaded on
  2026-09-08. That download no longer matches the sha256 pinned in data/clingen/MANIFEST.yaml,
  which is the ordinary unversioned-URL release drift the manifest itself documents; the GTPBP3
  row is unchanged and the assertion is dated 2024-05-23, so the record is unaffected.
  Repinning the manifest is a separate change and is not made here.

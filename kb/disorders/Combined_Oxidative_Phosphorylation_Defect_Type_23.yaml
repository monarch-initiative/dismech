    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bilateral thalamic lesions, suggesting metabolic edema, is a possible neuroimaging clue of this condition occurring in 2 out of 2 patients with severe and in 6 out of 10 patients with a milder phenotype undergoing a brain MRI."
    explanation: >-

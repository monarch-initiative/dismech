phenotypes:
- name: Hypertrophic Cardiomyopathy
  category: Cardiovascular
  description: >-
    The feature the disease was named for. Nine of the eleven patients in the founding series
    developed it, and in the milder clinical cluster its progression rather than the brain
    lesions is what determines outcome - in seven of twelve reviewed mild-phenotype patients.
    It can present as late as adulthood: one 25-year-old man was referred for genetic testing
    of hypertrophic cardiomyopathy and turned out to have biallelic GTPBP3 variants.
  frequency: VERY_FREQUENT

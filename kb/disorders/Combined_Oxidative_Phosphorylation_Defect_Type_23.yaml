name: Combined Oxidative Phosphorylation Defect Type 23
category: Mendelian
creation_date: "2026-09-08T00:00:00Z"
synonyms:
- COXPD23
- combined oxidative phosphorylation deficiency 23
- combined oxidative phosphorylation deficiency type 23
- GTPBP3 combined oxidative phosphorylation deficiency
- GTPBP3 deficiency
- GTPBP3-related primary mitochondrial disease
disease_term:
  preferred_term: combined oxidative phosphorylation defect type 23
  term:
    id: MONDO:0014525
    label: combined oxidative phosphorylation defect type 23
description: >-
  COXPD23 (OMIM 616198) is the autosomal recessive mitochondrial disease caused by biallelic
  variants in GTPBP3. GTPBP3 and MTO1 together install 5-taurinomethyluridine at the wobble
  position of five mitochondrial tRNAs - those for Gln, Glu, Lys, Leu(UUR) and Trp - using
  taurine, methylene-tetrahydrofolate and GTP. Losing that modification degrades
  codon-anticodon pairing during mitochondrial translation, so synthesis of the thirteen
  mtDNA-encoded respiratory chain subunits falls and a combined, rather than isolated,
  respiratory chain defect follows.

  The cardinal triad is hypertrophic cardiomyopathy, lactic acidosis and encephalopathy, and
  the entity was defined by an eleven-patient series in 2014. Since then the reported
  spectrum has separated into two clusters that a curator should keep apart: an early-onset
  severe form with fatal encephalopathy, cardiogenic shock and decompensated metabolic
  acidosis, and a milder later-onset form dominated by developmental delay and intellectual
  disability with or without drug-responsive epilepsy. In the milder group it is the
  progression of the cardiomyopathy rather than the brain lesions that determines outcome,
  and survival into the third decade is documented. Bilateral thalamic lesions are the
  characteristic neuroimaging clue.

  The relationship to MTO1 deficiency is the most important thing about this entity and is
  drawn explicitly in this entry rather than left implicit. The two enzymes act in the same
  reaction, and the two diseases are near-phenocopies separated by sequencing rather than by
  phenotype. Two things do separate them. The founding cohort observed that, unlike MTO1
  patients, most GTPBP3 patients develop neurological symptoms with thalamic, putaminal and
  brainstem MRI involvement resembling Leigh syndrome. And at the cellular level the two
  defects drive the HIF-PPAR-gamma-UCP2-AMPK axis in opposite directions - which is itself
  evidence that one of the two proteins does something beyond tRNA modification.

  ClinGen's Mitochondrial Diseases expert panel classifies the GTPBP3 gene-disease
  relationship as Definitive, with loss of function as the mechanism. Knock-in mouse models
  reproducing patient alleles were reported in 2026, and adeno-associated-virus-mediated
  GTPBP3 expression reversed the mitochondrial dysfunction and pathology in those animals -
  the first intervention data for this disease, and preclinical.

- name: Lactic Acidosis
  category: Metabolism
  description: >-
    Present in every patient of the founding series, and in the severe cluster it takes the
    form of decompensated metabolic acidosis accompanying cardiogenic shock. In the milder
    cluster the elevation may be modest and intermittent.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Lactic acidosis
    term:
      id: HP:0003128
      label: Lactic acidosis
  notes: >-

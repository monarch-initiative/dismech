    snippet: "Q230P and N374D mutations induce protein multimerization/aggregation, protease degradation, decreased GTPase activity, and tRNA modification to varying degrees, affecting mitochondrial translation, respiration, dynamics, and function."
    explanation: >-
      How two specific patient alleles reach the loss of modification - through protein
      destabilisation and reduced GTPase activity rather than through a direct catalytic
      block.
  downstream:
  - target: Impaired Mitochondrial Translation
    causal_link_type: DIRECT
- name: Impaired Mitochondrial Translation
  biological_scale: MOLECULAR
  description: >-
    Wobble hypomodification degrades codon-anticodon pairing, so synthesis of the thirteen
    mtDNA-encoded respiratory chain subunits falls. The founding series calls this a severe
    mitochondrial translation defect. Because those thirteen subunits are distributed across
    complexes I, III, IV and V, the downstream deficiency is combined rather than isolated -
    which is the structural reason this disease is named as a combined oxidative
    phosphorylation defect.
  biological_processes:
  - preferred_term: mitochondrial translation
    modifier: DECREASED
    term:
      id: GO:0032543
      label: mitochondrial translation
  evidence:
  - reference: PMID:25434004
    reference_title: "Mutations in GTPBP3 cause a mitochondrial translation defect associated with hypertrophic cardiomyopathy, lactic acidosis, and encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in GTPBP3 are associated with a severe mitochondrial translation defect"
    explanation: The translational lesion as the founding series states it.
  - reference: PMID:30916346
    reference_title: "Deletion of Gtpbp3 in zebrafish revealed the hypertrophic cardiomyopathy manifested by aberrant mitochondrial tRNA metabolism."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "The aberrant mitochondrial tRNA metabolisms impaired mitochondrial translation, produced proteostasis stress and altered activities of respiratory chain complexes."
    explanation: >-
      The same chain measured end to end in a knockout organism. INDIRECT because the claim
      about human translation follows from a zebrafish result rather than being asserted of
      patients.
  downstream:
  - target: Combined Respiratory Chain Complex Deficiency
    causal_link_type: DIRECT
- name: Combined Respiratory Chain Complex Deficiency
  biological_scale: MOLECULAR
  conforms_to: "mitochondrial_dysfunction#Bioenergetic Decline and Oxidative Stress"
  description: >-
    The biochemical endpoint the entity is named for, and it is variable rather than
    stereotyped. Eight of the nine founding families showed combined respiratory chain
    complex deficiencies in skeletal muscle; ClinGen describes the muscle findings across the
    literature as variable. In the Italian sibship complex IV was reduced by 61 percent in
    muscle with complex I at the lower limit of control, and ATP synthesis in fibroblast
    mitochondria was reduced by 38 to 49 percent depending on substrate. Variability of which
    complexes are hit is expected from the mechanism: a translation defect degrades all four
    mtDNA-dependent complexes, and which one falls furthest in a given assay is a matter of
    tissue and threshold rather than of a distinct lesion.
  biological_processes:
  - preferred_term: mitochondrial ATP synthesis coupled electron transport
    modifier: DECREASED
    term:
      id: GO:0042775
      label: mitochondrial ATP synthesis coupled electron transport
  notes: >-
    Conformance note. The module node pairs decreased oxidative phosphorylation with
    increased reactive oxygen species. The oxidative-phosphorylation half is directly
    evidenced here. The reactive-oxygen half is not asserted in this node: superoxide
    accumulation is described for this disease in review prose, but no patient measurement is
    cited here for it, and the module's upstream node - age-related mitochondrial damage and
    mtDNA mutation - does not apply to a primary nuclear-gene translation defect, so
    conformance is declared at this node alone.
  evidence:
  - reference: PMID:25434004
    reference_title: "Mutations in GTPBP3 cause a mitochondrial translation defect associated with hypertrophic cardiomyopathy, lactic acidosis, and encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Affected individuals from eight out of nine families presented with combined respiratory chain complex deficiencies in skeletal muscle."
    explanation: >-
      The biochemical phenotype with its denominator, and the one family in nine that did not
      show it.
  - reference: PMID:38327089
    reference_title: "Biallelic variants in GTPBP3: New patients, phenotypic spectrum, and outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the present cases the biochemical study in muscle tissue and fibroblasts confirmed the relevant impairment of OXPHOS and complex V activity."
    explanation: >-
      Independent confirmation in a later family, in two tissues, including the ATP synthase
      that a translation defect also depends on.
  - reference: CGGV:assertion_393ee652-756b-4b54-9e0a-916bbae9d9eb-2024-05-23T040000.000Z

- name: GTPBP3-Specific Metabolic Reprogramming
  biological_scale: CELLULAR
  description: >-
    The one thing that separates this disease from MTO1 deficiency at the cellular level.
    Both enzymes catalyse the same modification and both defects cause infantile hypertrophic
    cardiomyopathy with lactic acidosis, but the compensatory response runs in opposite
    directions. MTO1-deficient fibroblasts inactivate AMPK, down-regulate UCP2 and PPAR-gamma
    and activate HIF-1; GTPBP3-depleted cells do the reverse - AMPK is activated, UCP2 and
    PPAR-gamma rise and HIF-1 is inactivated. The authors read that divergence as evidence
    that one of the two proteins has a role beyond tRNA modification.
  biological_processes:
  - preferred_term: cellular response to energy stress
    modifier: DYSREGULATED
    term:
      id: GO:0071456
      label: cellular response to hypoxia
  mechanism_confidence: PROVISIONAL
  notes: >-
    PROVISIONAL, and deliberately so. The divergence between the two defects is measured, in
    cultured cells, and is not in doubt. What is provisional is the interpretation - that one
    of the two proteins therefore has an additional function - which the authors themselves
    present as a strong suggestion rather than a finding, and which nothing in the patient
    literature tests. The node is curated because it is the only mechanistic handle anyone has
    on why two defects in one reaction are not identical diseases, not because the extra
    function has been demonstrated.

    The GO binding is imperfect and is flagged rather than glossed. There is no GO term for
    the HIF-PPAR-gamma-UCP2-AMPK axis as such; cellular response to hypoxia is bound because
    HIF-1 activity is the axis component the source measures most directly, and the modifier
    is ALTERED rather than a direction because the whole point of the node is that the
    direction is opposite to the sibling disease.
  evidence:
  - reference: PMID:29348686
    reference_title: "Defects in the mitochondrial-tRNA modification enzymes MTO1 and GTPBP3 promote different metabolic reprogramming through a HIF-PPARγ-UCP2-AMPK axis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Unexpectedly, this response is different from that triggered by the GTPBP3 defect, as GTPBP3-depleted cells exhibit AMPK activation, increased levels of UCP2 and PPARγ, and inactivation of HIF-1."
    explanation: >-
      The measured divergence, with the direction of each component, in the words of the study
      that found it.
  - reference: PMID:29348686
    reference_title: "Defects in the mitochondrial-tRNA modification enzymes MTO1 and GTPBP3 promote different metabolic reprogramming through a HIF-PPARγ-UCP2-AMPK axis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Therefore, the HIF-PPARγ-UCP2-AMPK axis is operating differently in MTO1- and GTPBP3-defective cells, which strongly suggests that one of these proteins has an additional role, besides mitochondrial-tRNA modification."
    explanation: >-
      The inference the authors draw, at the strength they give it - strongly suggests, not
      shows. That hedge is why the node is PROVISIONAL.
- name: Cardiomyocyte Bioenergetic Failure and Hypertrophic Remodeling
  biological_scale: TISSUE
  description: >-
    Cardiac muscle has among the highest oxidative demands in the body, and hypertrophic
    cardiomyopathy is the feature this disease was named for. What the human data establish is
    the association; the causal step from a translation defect to myocyte hypertrophy is
    supplied by the zebrafish knockout, in which loss of gtpbp3 produced cardiomyocyte
    hypertrophy and myocardial fibre disarray in the ventricles together with reduced
    fractional shortening, and by knock-in mice carrying patient alleles, which develop
    cardiac and muscular dysfunction attributed to altered mitochondrial translation.
  locations:
  - preferred_term: myocardium
    term:
      id: UBERON:0002349
      label: myocardium
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  mechanism_confidence: PROVISIONAL
  notes: >-
    PROVISIONAL because no myocardial tissue study is reported in a GTPBP3 patient. The
    hypertrophy is documented echocardiographically in patients and histologically only in
    model organisms, so the tissue-level account here rests on the zebrafish and mouse work
    and is marked as such; the incoming edge is INDIRECT_UNKNOWN_INTERMEDIATES for the same
    reason.
  evidence:
  - reference: PMID:30916346
    reference_title: "Deletion of Gtpbp3 in zebrafish revealed the hypertrophic cardiomyopathy manifested by aberrant mitochondrial tRNA metabolism."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "Notably, the gtpbp3 knock-out zebrafish exhibited hypertrophy of cardiomyocytes and myocardial fiber disarray in ventricles."
    explanation: >-
      The tissue-level lesion, measured in a knockout organism because it has not been
      measured in a patient.
  - reference: PMID:30916346

notes: |-
  CMH13 is the TNNC1 (cardiac troponin C) member of the sarcomeric HCM series and a ClinGen-definitive HCM gene, added to complete the definitive thin-filament gene set (with ACTC1/CMH11, TNNT2/CMH2, TNNI3/CMH7, TPM1/CMH3). It is the most direct myofilament calcium-sensitization lesion in the sarcomere and conforms to the shared cardiomyopathy_maladaptive_remodeling module. A parallel arrhythmogenic-substrate node captures the fatal arrhythmogenic subtype reported for TNNC1. TNNC1 is allelically pleiotropic — other variants cause dilated cardiomyopathy (ClinGen Definitive) — so this entry is scoped to the hypertrophic phenotype.
  GeneReviews scope. The GeneReviews resource applicable to this entry is the disease-level "Nonsyndromic Hypertrophic Cardiomyopathy Overview" (PMID:20301725), tagged accordingly in `references`. Its indexed PubMed record is content_type abstract_only and carries only the chapter's purpose statement, not the Clinical Characteristics, Management, or Genetic Counseling sections, so section-by-section GeneReviews mining is not possible from the cache and no snippet is quoted from it. The clinical-characteristics baseline for this entry is therefore built from the general HCM review PMID:28912181 together with the TNNC1 proband and functional reports PMID:16302972 and PMID:22815480, and the cTnC structure-function review PMID:26232335.

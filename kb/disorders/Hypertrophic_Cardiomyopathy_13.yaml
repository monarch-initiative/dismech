    snippet: Hypertrophic cardiomyopathy (HCM) is a genetic disorder that is characterized by left ventricular
      hypertrophy unexplained by secondary causes and a nondilated left ventricle with preserved or increased
      ejection fraction.
    explanation: States the disease definition that echocardiography is used to establish (unexplained
      left ventricular hypertrophy with a nondilated left ventricle). The sentence defines the disease and

name: Hypertrophic Cardiomyopathy 13
creation_date: "2026-08-22T00:00:00Z"
synonyms:
- CMH13
- TNNC1 hypertrophic cardiomyopathy
- cardiac troponin C hypertrophic cardiomyopathy
- cardiomyopathy, familial hypertrophic, 13
- hypertrophic cardiomyopathy caused by mutation in TNNC1
description: >-
  Hypertrophic cardiomyopathy 13 (CMH13) is the TNNC1-related form of familial
  hypertrophic cardiomyopathy. TNNC1 encodes cardiac troponin C (cTnC), the
  calcium-sensing subunit of the thin-filament troponin complex: calcium binding
  to its regulatory N-domain is the switch that turns cardiac contraction on. TNNC1
  is a rare but ClinGen-definitive HCM gene, and it is the most direct
  calcium-sensitization lesion in the sarcomere — pathogenic missense variants
  increase the myofilament calcium sensitivity of contraction, which reconfigures
  excitation-contraction coupling and predisposes to a hypertrophic, and in some
  probands strongly arrhythmogenic, phenotype. The founding TNNC1 HCM allele (L29Q)
  and later variants such as A31S illustrate the spectrum, the latter presenting in
  childhood with ventricular fibrillation and aborted sudden death. Inheritance is
  autosomal dominant; other TNNC1 variants cause dilated cardiomyopathy.

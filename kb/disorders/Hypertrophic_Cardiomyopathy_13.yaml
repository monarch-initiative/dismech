- name: Increased Myofilament Calcium Sensitivity
  biological_scale: MOLECULAR
  role: effector
  description: >-
    Cardiac troponin C sets the calcium sensitivity of contraction: calcium binding
    to its regulatory N-domain relieves troponin-I inhibition and allows
    cross-bridge cycling. HCM TNNC1 variants directly increase this calcium
    sensitivity — the A31S allele, for example, increases calcium sensitivity with
    no change in maximal force. A myofilament that activates at lower calcium
    reconfigures excitation-contraction coupling and calcium handling, the proximal
    functional lesion of the disease and the reason cTnC is a target for
    calcium-sensitivity-modulating drugs.
  cell_types:
  - preferred_term: Cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: Regulation of Cardiac Muscle Contraction by Calcium
    term:
      id: GO:0010882

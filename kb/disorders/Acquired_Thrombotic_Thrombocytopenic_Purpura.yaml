discussions:
- discussion_id: gap_ittp_second_hit_and_organ_tropism
  prompt: >-
    Why do some people with severe ADAMTS13 deficiency remain clinically well
    while others develop an acute episode with a particular pattern of organ
    injury?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Severe ADAMTS13 Activity Deficiency
  - pathophysiology#Disseminated Platelet-VWF Microthrombosis
  rationale: >-
    Severe deficiency is necessary for TTP but does not by itself explain the
    timing of attacks, infection and pregnancy triggers, or variable cerebral,
    cardiac, and renal involvement. Endothelial activation, VWF release,
    inflammation, and vascular susceptibility are candidate additional factors.
  evidence:
  - reference: PMID:39161536
    reference_title: A Systematic Review of the Epidemiology and Disease Burden of Congenital and Immune-Mediated Thrombotic Thrombocytopenic Purpura.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Triggers of acute episodes were similar for cTTP and iTTP, with pregnancy
      and infection the most commonly observed.
    explanation: >-
      Common triggers demonstrate that enzyme deficiency is embedded in a
      broader attack context.
- discussion_id: gap_ittp_remission_threshold_and_monitoring_interval
  prompt: >-
    Which ADAMTS13 activity threshold, antibody profile, and testing interval
    best identify patients who benefit from preemptive immunosuppression?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Anti-ADAMTS13 Autoantibody Production
  - pathophysiology#Severe ADAMTS13 Activity Deficiency
  rationale: >-
    Low activity and high antibody levels predict relapse, but cohorts use
    different thresholds and the ISTH guideline identifies no evidence-based
    universal monitoring interval.
  evidence:
  - reference: PMID:32914526
    reference_title: ISTH guidelines for treatment of thrombotic thrombocytopenic purpura.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      There is also no evidence on the appropriate interval for performing
      ADAMTS13 activity testing.
    explanation: >-
      The guideline directly identifies the interval evidence gap.
- discussion_id: gap_ittp_pex_free_and_novel_autoantibody_therapy
  prompt: >-
    Can selected acute episodes be treated safely without plasma exchange, and
    can FcRn blockade or other targeted therapies produce durable immunologic
    remission with less treatment burden?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - treatment#Immediate therapeutic plasma exchange
  - treatment#Rituximab for acute immune control
  rationale: >-
    Active PEX-free and efgartigimod studies are small or single-arm and have no
    posted results. They should not be treated as established alternatives to
    current TPE, caplacizumab, corticosteroid, and rituximab care.
  evidence:
  - reference: clinicaltrials:NCT06291025
    reference_title: "Efficacy and Safety of Immunosuppression, Caplacizumab and Plasma Infusion Without Therapeutic Plasma Exchange in Immune-mediated Thrombotic Thrombocytopenic Purpura: Multicentric Non-inferiority Single-arm Study"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, it's considered that robust data are still lacking to completely
      remove plasmatherapy from iTTP management.
    explanation: >-
      The study rationale itself states the unresolved evidence gap.

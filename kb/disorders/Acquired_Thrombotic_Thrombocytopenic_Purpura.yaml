notes: >-
  This entry models acquired immune TTP, not congenital ADAMTS13 deficiency or
  secondary thrombotic microangiopathy. Severe ADAMTS13 deficiency is central,
  but attack timing and organ tropism require additional incompletely defined
  factors. Caplacizumab suppresses VWF-platelet thrombosis without curing the
  autoimmune disease; platelet recovery therefore does not replace ADAMTS13
  surveillance or immunosuppressive control.

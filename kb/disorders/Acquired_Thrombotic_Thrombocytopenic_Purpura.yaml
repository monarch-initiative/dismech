  evidence:
  - reference: PMID:39161536
    reference_title: A Systematic Review of the Epidemiology and Disease Burden of Congenital and Immune-Mediated Thrombotic Thrombocytopenic Purpura.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Damage to major organs may also result in transient ischemic attack,
      stroke, myocardial infarction, or acute kidney injury.
    explanation: >-
      The systematic review identifies myocardial infarction among acute organ
      complications.
- name: Acute kidney injury
  category: Renal
  description: >-
    Renal microvascular injury can cause acute loss of kidney function, although
    severe renal failure is less typical of TTP than of hemolytic-uremic
    syndromes.
  phenotype_term:
    preferred_term: Acute kidney injury
    term:
      id: HP:0001919
      label: Acute kidney injury
  evidence:
  - reference: PMID:39161536
    reference_title: A Systematic Review of the Epidemiology and Disease Burden of Congenital and Immune-Mediated Thrombotic Thrombocytopenic Purpura.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Damage to major organs may also result in transient ischemic attack,
      stroke, myocardial infarction, or acute kidney injury.
    explanation: >-
      The systematic review identifies acute kidney injury as an organ
      complication.
- name: Stroke in remission
  category: Neurologic
  frequency: OCCASIONAL
  description: >-
    Stroke can occur after recovery, outside an acute TTP episode. One
    137-survivor cohort observed stroke in 13.1% over a median 3.08 years; this
    cohort-specific estimate should not be treated as lifetime population risk.
  phenotype_term:
    preferred_term: Stroke
    term:
      id: HP:0001297
      label: Stroke
  evidence:
  - reference: PMID:31431443
    reference_title: Reduced ADAMTS13 activity during TTP remission is associated with stroke in TTP survivors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of the remaining 137 patients, 18 (13.1%) developed stroke unrelated to
      an acute TTP episode over a median observation period of 3.08 years
    explanation: >-
      This supports the occasional frequency band specifically in a survivor
      cohort.
- name: Cognitive impairment
  category: Neurologic
  description: >-
    Survivors may have persistent or progressive deficits in memory, attention,
    processing speed, and related cognitive domains.
  phenotype_term:
    preferred_term: Cognitive impairment
    term:
      id: HP:0100543
      label: Cognitive impairment
  evidence:
  - reference: PMID:25975932
    reference_title: Depression and cognitive impairment following recovery from thrombotic thrombocytopenic purpura.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patients as a group performed significantly worse than standardized
      values provided by the test developers from neurologically normal
      individuals on both the MoCA and the RBANS.
    explanation: >-
      Formal survivor testing supports cognitive impairment after recovery.
- name: Depression
  category: Psychiatric
  frequency: FREQUENT
  description: >-
    Depressive symptoms are common after recovery. The frequency band derives
    from one longitudinal survivor cohort in which 59% screened positive at
    least once; it is not a universal point-prevalence estimate.
  phenotype_term:
    preferred_term: Depression
    term:
      id: HP:0000716
      label: Depression
  evidence:
  - reference: PMID:25975932
    reference_title: Depression and cognitive impairment following recovery from thrombotic thrombocytopenic purpura.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      31 (59%) patients screened positive for depression at least once; in 15
      (29%), the results suggested severe depression at least once.
    explanation: >-
      The longitudinal cohort supports the frequent band with an explicit
      denominator and follow-up context.
biochemical:
- name: Severely Reduced ADAMTS13 Activity
  presence: DECREASED
  context: >-
    Plasma ADAMTS13 activity below 10% in an appropriate thrombotic
    microangiopathy context confirms the defining enzyme defect. Anti-ADAMTS13
    IgG or inhibitor supports immune etiology. Samples should be obtained before
    plasma therapy when feasible, but emergency treatment must not be delayed.
  biomarker_term:
    preferred_term: ADAMTS13
    term:
      id: NCIT:C118327
      label: A Disintegrin and Metalloproteinase with Thrombospondin Motifs 13
  readouts:
  - target: Severe ADAMTS13 Activity Deficiency
    relationship: READOUT_OF
    direction: NEGATIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      Lower measured activity is the direct biochemical readout of functional
      ADAMTS13 deficiency.
    evidence:
    - reference: PMID:32914582
      reference_title: ISTH guidelines for the diagnosis of thrombotic thrombocytopenic purpura.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        importance of ADAMTS13 testing (eg, activity, anti-ADAMTS13 IgG or
        inhibitor)
      explanation: >-
        The diagnosis guideline establishes the measurement and immune assays
        as central readouts.
  evidence:
  - reference: PMID:39161536
    reference_title: A Systematic Review of the Epidemiology and Disease Burden of Congenital and Immune-Mediated Thrombotic Thrombocytopenic Purpura.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      An ADAMTS13 activity of <10% is required to confirm the diagnosis of TTP
    explanation: >-
      The systematic review states the severe-deficiency diagnostic threshold.
- name: Anti-ADAMTS13 IgG or Functional Inhibitor
  presence: Increased
  context: >-
    Detectable anti-ADAMTS13 IgG or an inhibitor supports immune-mediated rather
    than congenital TTP. A negative assay does not by itself establish
    congenital disease; clinical context, repeat testing, recovery pattern, and
    genetic analysis may be needed.
  readouts:
  - target: Anti-ADAMTS13 Autoantibody Production
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      Higher or detectable anti-ADAMTS13 antibody supports the acquired immune
      mechanism.
    evidence:
    - reference: PMID:9828246
      reference_title: Antibodies to von Willebrand factor-cleaving protease in acute thrombotic thrombocytopenic purpura.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Inhibitory antibodies against von Willebrand factor-cleaving protease
        occur in patients with acute thrombotic thrombocytopenic purpura.
      explanation: >-
        The original study establishes the inhibitor as a mechanistic biomarker.
  evidence:
  - reference: PMID:32914582
    reference_title: ISTH guidelines for the diagnosis of thrombotic thrombocytopenic purpura.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      importance of ADAMTS13 testing (eg, activity, anti-ADAMTS13 IgG or
      inhibitor)
    explanation: >-
      The guideline explicitly includes antibody and inhibitor assays.
diagnosis:
- name: Urgent recognition of thrombotic microangiopathy
  description: >-
    Suspect TTP in thrombocytopenia with microangiopathic hemolytic anemia and
    no better explanation. Evaluate the blood count, peripheral smear,
    hemolysis markers, renal function, cardiac injury, and neurologic status
    urgently. The historical fever-neurologic-renal pentad is not required.
  diagnosis_term:
    preferred_term: Blood Cell Count
    term:
      id: NCIT:C28133
      label: Blood Cell Count
  results: >-
    Thrombocytopenia plus schistocyte-associated hemolysis should trigger an
    emergency TTP pathway and collection of ADAMTS13 samples.
  evidence:
  - reference: PMID:28416507
    reference_title: Thrombotic thrombocytopenic purpura.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      TTP is a rare and life-threatening thrombotic microangiopathy
      characterized by microangiopathic hemolytic anemia, severe
      thrombocytopenia, and organ ischemia linked to disseminated microvascular
      platelet rich-thrombi.
    explanation: >-
      The review defines the urgent clinical syndrome.
- name: ADAMTS13 activity and immune-assay confirmation
  description: >-
    Measure ADAMTS13 activity and anti-ADAMTS13 IgG or functional inhibitor,
    ideally on blood drawn before plasma exchange. Severe activity deficiency
    confirms TTP in the proper clinical context; antibody/inhibitor evidence
    supports the immune acquired subtype.
  diagnosis_term:
    preferred_term: von Willebrand Coagulation Factor Cleaving Protease Measurement
    term:
      id: NCIT:C187684
      label: von Willebrand Coagulation Factor Cleaving Protease Measurement
  results: >-
    Activity below 10% supports TTP. Detectable anti-ADAMTS13 IgG or inhibitor
    supports immune TTP; absent antibody requires cautious interpretation and
    may prompt repeat or genetic evaluation.
  evidence:
  - reference: PMID:32914582
    reference_title: ISTH guidelines for the diagnosis of thrombotic thrombocytopenic purpura.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The panel agreed on three recommendations covering the initial diagnosis
      with emphasis on the importance of ADAMTS13 testing (eg, activity,
      anti-ADAMTS13 IgG or inhibitor)
    explanation: >-
      The ISTH guideline supports the confirmatory testing strategy.
- name: PLASMIC or French-score pretest assessment
  description: >-
    When rapid ADAMTS13 results are unavailable, use clinical judgment and a
    validated score such as PLASMIC or the French score to estimate the
    probability of severe ADAMTS13 deficiency. Scores aid urgent decisions but
    do not replace ADAMTS13 testing.
  diagnosis_term:
    preferred_term: disease screening
    term:
      id: NCIT:C15419
      label: Disease Screening
  results: >-
    High pretest probability supports immediate TTP-directed treatment while
    ADAMTS13 testing is pending; intermediate or low probability increases the
    need to assess alternative thrombotic microangiopathies.
  evidence:
  - reference: PMID:32914582
    reference_title: ISTH guidelines for the diagnosis of thrombotic thrombocytopenic purpura.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      assessment of the pretest probability of TTP by clinical assessment
      and/or the risk assessment models like the PLASMIC or French score.
    explanation: >-
      The diagnosis guideline explicitly supports clinical or score-based
      pretest assessment.
- name: Serial ADAMTS13 surveillance during remission
  description: >-
    Monitor ADAMTS13 activity longitudinally after clinical recovery because a
    falling or persistently low result identifies elevated relapse and stroke
    risk and can trigger specialist consideration of preemptive therapy.
  diagnosis_term:
    preferred_term: von Willebrand Coagulation Factor Cleaving Protease Measurement
    term:
      id: NCIT:C187684
      label: von Willebrand Coagulation Factor Cleaving Protease Measurement
  results: >-
    Activity at or below 20% together with a high anti-ADAMTS13 antibody titer
    identifies a higher-risk remission state; no universally proven optimal
    testing interval exists.
  evidence:
  - reference: PMID:32350923
    reference_title: "Low levels of ADAMTS-13 with high anti-ADAMTS-13 antibodies during remission of immune-mediated thrombotic thrombocytopenic purpura highly predict for disease relapse: A multi-institutional study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      patients with ADAMTS-13 activity ≤20% plus anti-ADAMTS13 antibody titer
      ≥15 U/mL at remission had an increased risk of relapse
    explanation: >-
      The multicenter cohort supports risk-stratified remission monitoring.
- name: Neuropsychological and depression surveillance
  description: >-
    Ask survivors about cognition, mood, anxiety, work function, and quality of
    life. Positive screening or functional concerns should prompt appropriate
    neurologic, neuropsychological, primary-care, or mental-health evaluation.
  diagnosis_term:
    preferred_term: disease screening
    term:
      id: NCIT:C15419
      label: Disease Screening
  results: >-
    Depression or cognitive impairment may persist despite hematologic
    remission and should not be dismissed as evidence that the acute episode
    has fully resolved.
  evidence:
  - reference: PMID:25975932
    reference_title: Depression and cognitive impairment following recovery from thrombotic thrombocytopenic purpura.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These observations emphasize the importance of screening evaluations for
      depression and cognitive impairment.
    explanation: >-
      The survivor study directly recommends screening.
- name: Cardiovascular risk and survivorship follow-up
  description: >-
    Long-term follow-up should include blood-pressure and cardiovascular-risk
    assessment, attention to recurrent neurologic symptoms, and prompt
    evaluation of possible stroke or cardiac events.
  diagnosis_term:
    preferred_term: disease screening
    term:
      id: NCIT:C15419
      label: Disease Screening
  results: >-
    Identified hypertension, vascular risk, stroke symptoms, or cardiac disease
    should receive guideline-directed evaluation and management.
  evidence:
  - reference: PMID:34461629
    reference_title: Cardiovascular disease is a leading cause of mortality among TTP survivors in clinical remission.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our study highlights the need for survivorship care and investigation
      focused on cardiovascular disease and early mortality in TTP survivors.
    explanation: >-
      The multicenter survivor cohort supports cardiovascular-focused follow-up.
- name: Pregnancy planning and ADAMTS13-guided monitoring
  description: >-
    People with prior iTTP should receive expert preconception counseling and
    close hematology-obstetric monitoring through pregnancy and postpartum,
    including serial ADAMTS13 activity.
  diagnosis_term:
    preferred_term: disease screening
    term:
      id: NCIT:C15419
      label: Disease Screening
  results: >-
    Falling or low ADAMTS13 activity in pregnancy identifies a high-risk state
    requiring individualized prophylactic management.
  evidence:
  - reference: PMID:24859360
    reference_title: "Thrombotic thrombocytopenic purpura and pregnancy: presentation, management, and subsequent pregnancy outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Careful diagnosis, monitoring, and treatment in congenital and acquired
      TTP have assisted in excellent pregnancy outcomes.
    explanation: >-
      The pregnancy cohort supports structured monitoring and management.
differential_diagnoses:
- name: Congenital thrombotic thrombocytopenic purpura
  description: >-
    Congenital TTP also has severe ADAMTS13 deficiency but results from biallelic
    ADAMTS13 variants rather than an acquired inhibitor. Childhood onset,
    pregnancy-associated presentation, absent antibody, and failure of activity
    to recover after immunosuppression should prompt genetic evaluation.
  evidence:
  - reference: PMID:28416507
    reference_title: Thrombotic thrombocytopenic purpura.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      ADAMTS13 deficiency is most frequently acquired via ADAMTS13
      autoantibodies, but rarely, it is inherited via mutations of the ADAMTS13
      gene.
    explanation: >-
      The review distinguishes immune and inherited ADAMTS13 deficiency.
- name: Complement-mediated atypical hemolytic-uremic syndrome
  description: >-
    Complement-mediated HUS causes thrombotic microangiopathy, often with more
    severe kidney injury, but does not usually produce severe ADAMTS13
    deficiency. Complement evaluation should not delay empiric TTP treatment
    when pretest probability is high.
  disease_term:
    preferred_term: atypical hemolytic-uremic syndrome
    term:
      id: MONDO:0016244
      label: atypical hemolytic-uremic syndrome
- name: Shiga toxin-associated hemolytic-uremic syndrome
  description: >-
    Diarrheal prodrome, Shiga-toxin evidence, and predominant renal injury favor
    Shiga toxin HUS; severe ADAMTS13 deficiency favors TTP.
- name: Disseminated intravascular coagulation
  description: >-
    DIC can produce thrombocytopenia and fragmented erythrocytes but usually has
    systemic coagulation activation with abnormal clotting studies and a
    precipitating critical illness; TTP microthrombi are platelet-VWF rich.
  disease_term:
    preferred_term: disseminated intravascular coagulation
    term:
      id: MONDO:0001243
      label: disseminated intravascular coagulation
- name: HELLP syndrome and severe preeclampsia
  description: >-
    Pregnancy-associated hypertension, liver-enzyme elevation, and obstetric
    context favor HELLP or preeclampsia. Persistent thrombotic microangiopathy
    postpartum or severe ADAMTS13 deficiency supports TTP.
  disease_term:
    preferred_term: HELLP syndrome
    term:
      id: MONDO:0008585
      label: HELLP syndrome
- name: Catastrophic antiphospholipid syndrome
  description: >-
    Widespread thrombosis, antiphospholipid antibodies, and coagulation-related
    manifestations can mimic TTP; severe ADAMTS13 deficiency with immune
    inhibition favors iTTP.
- name: Malignant hypertension-associated thrombotic microangiopathy
  description: >-
    Severe hypertension with target-organ injury can cause secondary
    microangiopathy. ADAMTS13 is generally not severely deficient, and the
    clinical sequence and response to blood-pressure control help distinguish
    it from iTTP.
- name: Secondary thrombotic microangiopathy
  description: >-
    Sepsis, malignancy, transplantation, autoimmune disease, and certain drugs
    can cause thrombocytopenia and microangiopathic hemolysis without the severe
    ADAMTS13 deficiency that defines TTP.
treatments:
- name: Immediate therapeutic plasma exchange
  action_category: THERAPEUTIC
  therapeutic_modality: OTHER
  description: >-
    Begin daily therapeutic plasma exchange urgently in suspected acute iTTP.
    TPE supplies functional ADAMTS13 and removes circulating antibody and other
    pathogenic plasma components. It remains part of current guideline and
    regulatory standard care; PEX-free regimens are investigational.
  treatment_term:
    preferred_term: Plasmapheresis
    term:
      id: NCIT:C15304
      label: Plasmapheresis
  target_mechanisms:
  - target: Severe ADAMTS13 Activity Deficiency
    treatment_effect: RESTORES
    description: >-
      Donor plasma replenishes missing or inhibited ADAMTS13 while exchange
      removes circulating pathogenic material.
    evidence:
    - reference: PMID:32914526
      reference_title: ISTH guidelines for treatment of thrombotic thrombocytopenic purpura.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        replacing the missing and/or inhibited ADAMTS13
      explanation: >-
        The ISTH guideline identifies ADAMTS13 replacement as a principal
        treatment mechanism.
    - reference: url:https://clinicaltrials.gov/api/v2/studies/NCT05468320
      reference_title: https://clinicaltrials.gov/api/v2/studies/NCT05468320
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        TPE replenishes the ADAMTS13 enzyme and removes anti-ADAMTS13
        antibodies, and ultra-large von Willebrand factor multimers gradually
        from the circulation.
      explanation: >-
        The registry outcome definition explicitly states the replacement and
        removal mechanisms attributed to TPE.
  evidence:
  - reference: PMID:32914526
    reference_title: ISTH guidelines for treatment of thrombotic thrombocytopenic purpura.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      For patients with iTTP experiencing a first acute event, the panel
      recommends the addition of corticosteroids to therapeutic plasma exchange
      (TPE) over TPE alone.
    explanation: >-
      The guideline establishes TPE as the acute-care backbone while
      recommending corticosteroid addition.
  - reference: PMID:40533296
    reference_title: 2025 focused update of the 2020 ISTH guidelines for management of thrombotic thrombocytopenic purpura.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      For patients with iTTP, no change to 2020's recommendations.
    explanation: >-
      The 2025 focused update retained the immune-TTP recommendations.
- name: Corticosteroids with plasma exchange
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Add systemic corticosteroids to TPE for a first acute episode or relapse.
    The ISTH recommendation is strong because iTTP is life-threatening, but the
    supporting certainty is very low and no preferred steroid or dose is
    established.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: corticosteroid
      term:
        id: CHEBI:50858
        label: corticosteroid
  target_mechanisms:
  - target: Anti-ADAMTS13 Autoantibody Production
    treatment_effect: INHIBITS
    description: >-
      Corticosteroids suppress inflammation and are intended to reduce the
      anti-ADAMTS13 autoimmune response.
    evidence:
    - reference: PMID:32914526
      reference_title: ISTH guidelines for treatment of thrombotic thrombocytopenic purpura.
      supports: PARTIAL
      evidence_source: OTHER
      snippet: >-
        The presumptive rationales for the use of corticosteroids are to reduce
        acute inflammation and inhibit the production of ADAMTS13
        autoantibodies, although high-quality data are not available.
      explanation: >-
        The guideline states the intended mechanism while explicitly qualifying
        the evidence.
  evidence:
  - reference: PMID:32914526
    reference_title: ISTH guidelines for treatment of thrombotic thrombocytopenic purpura.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      For patients with iTTP experiencing a first acute event, the panel
      recommends the addition of corticosteroids to therapeutic plasma exchange
      (TPE) over TPE alone.
    explanation: >-
      This is a strong recommendation in the context of very low-certainty
      evidence.
- name: Rituximab for acute immune control
  action_category: THERAPEUTIC
  therapeutic_modality: MONOCLONAL_ANTIBODY
  description: >-
    Rituximab is added to TPE and corticosteroids to control the anti-ADAMTS13
    autoimmune response and reduce relapse risk. The acute first-event and
    relapse recommendations are conditional because evidence certainty is very
    low.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: rituximab
      term:
        id: NCIT:C1702
        label: Rituximab
  target_mechanisms:
  - target: Anti-ADAMTS13 Autoantibody Production
    treatment_effect: INHIBITS
    description: >-
      Anti-CD20 B-cell depletion reduces the B-cell compartment sustaining the
      pathogenic autoantibody response; mature plasma cells are not directly
      targeted.
    evidence:
    - reference: PMID:28416507
      reference_title: Thrombotic thrombocytopenic purpura.
      supports: PARTIAL
      evidence_source: OTHER
      snippet: >-
        Additional immune modulators targeting ADAMTS13 autoantibodies are
        mainly based on steroids and the humanized anti-CD20 monoclonal antibody
        rituximab.
      explanation: >-
        The review supports B-cell-directed immune modulation while the detailed
        cellular route remains indirect.
  evidence:
  - reference: PMID:32914526
    reference_title: ISTH guidelines for treatment of thrombotic thrombocytopenic purpura.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      For patients with iTTP experiencing their first acute event, the panel
      suggests the addition of rituximab to corticosteroids and TPE over
      corticosteroids and TPE alone.
    explanation: >-
      The guideline conditionally supports rituximab in acute first events.
- name: Caplacizumab with plasma exchange and immunosuppression
  action_category: THERAPEUTIC
  therapeutic_modality: NANOBODY
  description: >-
    Caplacizumab is an anti-VWF single-domain antibody that blocks VWF A1-domain
    binding to platelet glycoprotein Ib. It rapidly suppresses new
    microthrombus formation but does not correct ADAMTS13 deficiency or remove
    the autoantibody. The approved United States regimen combines it with
    plasma exchange and immunosuppression; plasma-exchange-free use remains
    selected and investigational. Current labeling covers adults and pediatric
    patients aged 12 years or older. Bleeding is the principal risk. Pregnancy
    use requires individualized expert risk-benefit assessment because human
    data are unavailable and maternal and fetal bleeding are concerns.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: caplacizumab
      term:
        id: NCIT:C128625
        label: Caplacizumab
  target_mechanisms:
  - target: Disseminated Platelet-VWF Microthrombosis
    treatment_effect: INHIBITS
    description: >-
      Caplacizumab blocks VWF A1-domain binding to platelet glycoprotein Ib and
      thereby suppresses VWF-platelet microthrombus formation without restoring
      ADAMTS13.
    evidence:
    - reference: PMID:26863353
      reference_title: Caplacizumab for Acquired Thrombotic Thrombocytopenic Purpura.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Caplacizumab, an anti-von Willebrand factor humanized
        single-variable-domain immunoglobulin (Nanobody), inhibits the
        interaction between ultralarge von Willebrand factor multimers and
        platelets.
      explanation: >-
        The phase 2 trial defines the molecular treatment mechanism.
  target_phenotypes:
  - preferred_term: Thrombocytopenia
    term:
      id: HP:0001873
      label: Thrombocytopenia
  evidence:
  - reference: PMID:30625070
    reference_title: Caplacizumab Treatment for Acquired Thrombotic Thrombocytopenic Purpura.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The percentage of patients with a composite outcome event was 74% lower
      with caplacizumab than with placebo (12% vs. 49%, P<0.001).
    explanation: >-
      This supports reduction of the prespecified composite outcome, not each
      component independently.
  - reference: PMID:30625070
    reference_title: Caplacizumab Treatment for Acquired Thrombotic Thrombocytopenic Purpura.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most common adverse event was mucocutaneous bleeding, which was
      reported in 65% of the patients in the caplacizumab group and in 48% in
      the placebo group.
    explanation: >-
      The randomized trial establishes the common bleeding liability.
  - reference: url:https://www.accessdata.fda.gov/drugsatfda_docs/label/2025/761112s018lbl.pdf
    reference_title: https://www.accessdata.fda.gov/drugsatfda_docs/label/2025/761112s018lbl.pdf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      indicated for the treatment of adult and pediatric patients 12 years of
      age and older with acquired thrombotic thrombocytopenic purpura (aTTP), in
      combination with plasma exchange and immunosuppressive therapy.
    explanation: >-
      The current FDA label establishes the approved age range and combination
      regimen in the United States.
  - reference: url:https://www.accessdata.fda.gov/drugsatfda_docs/label/2025/761112s018lbl.pdf
    reference_title: https://www.accessdata.fda.gov/drugsatfda_docs/label/2025/761112s018lbl.pdf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      There are no available data on CABLIVI use in pregnant women to inform a
      drug-associated risk of major birth defects and miscarriage. However,
      there are potential risks of hemorrhage in the mother and fetus
      associated with use of CABLIVI
    explanation: >-
      The current label supports cautious individualized pregnancy use because
      human exposure data are absent and bleeding may affect mother and fetus.
  - reference: url:https://www.accessdata.fda.gov/drugsatfda_docs/label/2025/761112s018lbl.pdf
    reference_title: https://www.accessdata.fda.gov/drugsatfda_docs/label/2025/761112s018lbl.pdf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Treatment after plasma exchange period: 11 mg subcutaneous injection once
      daily continuing for 30 days following the last daily plasma exchange.
    explanation: >-
      The label supplies the post-exchange treatment duration; extension is
      considered when underlying disease remains active.
- name: Preemptive rituximab during high-risk remission
  action_category: THERAPEUTIC
  therapeutic_modality: MONOCLONAL_ANTIBODY
  description: >-
    In asymptomatic nonpregnant patients with falling or severely reduced
    ADAMTS13 activity, preemptive rituximab may be used to restore immunologic
    remission and reduce clinical relapse risk. This is conditional and depends
    on reliable serial ADAMTS13 testing.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: rituximab
      term:
        id: NCIT:C1702
        label: Rituximab
  target_mechanisms:
  - target: Anti-ADAMTS13 Autoantibody Production
    treatment_effect: INHIBITS
    description: >-
      Preemptive B-cell depletion is intended to reverse the autoimmune relapse
      before thrombocytopenia and hemolysis recur.
    evidence:
    - reference: PMID:30201758
      reference_title: Preemptive rituximab prevents long-term relapses in immune-mediated thrombotic thrombocytopenic purpura.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Preemptive rituximab reduces clinical relapses by maintaining a
        detectable ADAMTS13 activity with an advantageous risk-benefit balance.
      explanation: >-
        The 92-patient cohort supports the preemptive strategy.
  evidence:
  - reference: PMID:32914526
    reference_title: ISTH guidelines for treatment of thrombotic thrombocytopenic purpura.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      For patients with iTTP who are in remission, but still have low plasma
      ADAMTS13 activity with no clinical signs/symptoms, the panel suggests the
      use of rituximab over nonuse of rituximab for prophylaxis.
    explanation: >-
      The ISTH guideline conditionally supports preemptive rituximab outside
      pregnancy.
- name: Prophylactic treatment for high-risk pregnancy
  action_category: THERAPEUTIC
  therapeutic_modality: OTHER
  description: >-
    Pregnancy with a history of iTTP and reduced ADAMTS13 activity requires
    expert prophylactic treatment rather than observation alone. The ISTH
    guideline supports prophylactic therapy to raise ADAMTS13, but does not
    establish one universal immune-suppressive or plasma regimen.
  treatment_term:
    preferred_term: Plasmapheresis
    term:
      id: NCIT:C15304
      label: Plasmapheresis
  target_mechanisms:
  - target: Severe ADAMTS13 Activity Deficiency
    treatment_effect: RESTORES
    description: >-
      Plasma-based prophylaxis can raise ADAMTS13 activity during a high-risk
      pregnancy; regimen choice is individualized.
    evidence:
    - reference: PMID:32914526
      reference_title: ISTH guidelines for treatment of thrombotic thrombocytopenic purpura.
      supports: PARTIAL
      evidence_source: OTHER
      snippet: >-
        Although no specific prophylactic immune suppressive or plasma
        treatment regimen is recommended, the panel made a strong
        recommendation for the use of prophylactic treatment to increase the
        ADAMTS13 activity to prevent both maternal and fetal mortality and
        morbidity.
      explanation: >-
        The guideline supports prophylaxis while explicitly leaving regimen
        selection unresolved.
  evidence:
  - reference: PMID:32914526
    reference_title: ISTH guidelines for treatment of thrombotic thrombocytopenic purpura.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Patients with a history of iTTP in remission that are pregnant with
      reduced levels of ADAMTS13 activity have more recently been recognized to
      have poor clinical outcomes with close monitoring alone.
    explanation: >-
      This supports active expert management rather than surveillance alone.
- name: Serial ADAMTS13 activity monitoring
  action_category: MONITORING
  description: >-
    Continue ADAMTS13 activity monitoring after clinical recovery and during
    pregnancy planning. Results guide relapse-risk assessment, preemptive
    immunosuppression, and the safe duration of caplacizumab; the optimal fixed
    testing interval is not established.
  treatment_term:
    preferred_term: ADAMTS13 activity monitoring
    term:
      id: NCIT:C187684
      label: von Willebrand Coagulation Factor Cleaving Protease Measurement
  evidence:
  - reference: PMID:32914526
    reference_title: ISTH guidelines for treatment of thrombotic thrombocytopenic purpura.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The panel raised practical issues around the cost, resource utilization,
      and patient commitment necessary for monitoring during remission, such as
      continued monitoring of plasma ADAMTS13 activity and starting rituximab
      in a timely fashion.
    explanation: >-
      The guideline explicitly links serial monitoring with timely preemptive
      treatment.
clinical_trials:
- name: NCT05468320
  phase: PHASE_III
  status: COMPLETED
  description: >-
    Completed open-label, single-arm study of caplacizumab plus
    immunosuppressive therapy without first-line therapeutic plasma exchange in
    selected adults with iTTP. Actual enrollment was 51. Among evaluable
    participants, 93.5% achieved remission without TPE and 4.3% required TPE.
  notes: >-
    The study completed on 2024-12-26 and posted results in December 2025.
    Severe neurologic or cardiac presentations were excluded, and there was no
    randomized comparator; these findings therefore do not establish
    equivalence or replace current guideline-based TPE care.

name: Acquired Thrombotic Thrombocytopenic Purpura
creation_date: "2026-07-05T00:00:00Z"
category: Autoimmune
parents:
- Autoimmune Disease
- Hematologic Disease
- Thrombotic Microangiopathy
disease_term:
  preferred_term: Acquired Thrombotic Thrombocytopenic Purpura
  term:
    id: MONDO:0019740
    label: acquired thrombotic thrombocytopenic purpura
description: >-
  Acquired, immune-mediated thrombotic thrombocytopenic purpura (iTTP/aTTP) is
  a medical emergency caused by autoantibody-mediated severe functional
  deficiency of ADAMTS13, the von Willebrand factor (VWF)-cleaving protease.
  Unprocessed ultralarge VWF multimers recruit platelets under shear and form
  disseminated platelet-VWF microthrombi, producing thrombocytopenia,
  microangiopathic hemolytic anemia with schistocytes, and ischemic organ
  injury. Acute treatment must address three distinct processes: plasma
  exchange restores ADAMTS13 and removes circulating pathogenic material,
  corticosteroids and rituximab suppress the autoimmune driver, and
  caplacizumab blocks VWF-platelet adhesion. Clinical remission does not always
  mean immunologic remission; persistent or recurrent low ADAMTS13 activity
  predicts relapse and stroke risk and requires longitudinal surveillance.
definitions:
- name: Immune-mediated TTP disease definition
  definition_type: CASE_DEFINITION
  description: >-
    Immune TTP is severe ADAMTS13 deficiency caused by anti-ADAMTS13
    autoantibodies, distinguished from congenital TTP caused by biallelic
    ADAMTS13 variants.
  scope: Disease-level distinction between immune-mediated and congenital TTP.
  evidence:
  - reference: PMID:28416507
    reference_title: Thrombotic thrombocytopenic purpura.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      ADAMTS13 deficiency is most frequently acquired via ADAMTS13
      autoantibodies, but rarely, it is inherited via mutations of the ADAMTS13
      gene.
    explanation: >-
      This review distinguishes immune acquired TTP from hereditary ADAMTS13
      deficiency.
epidemiology:
- name: Rare relapsing autoimmune thrombotic microangiopathy
  description: >-
    General-population studies estimate 1.81 to 3.93 acute iTTP episodes per
    million people annually. Reported prevalence varies substantially with
    geography, ascertainment, and diagnostic method. The first episode usually
    occurs in adulthood; women are overrepresented, and Black people have a
    markedly higher reported incidence in United States cohorts.
  evidence:
  - reference: PMID:39161536
    reference_title: A Systematic Review of the Epidemiology and Disease Burden of Congenital and Immune-Mediated Thrombotic Thrombocytopenic Purpura.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The incidence rate of acute episodes ranged from 0.19-0.35 person-years
      in adult patients with cTTP, and 1.81-3.93 per million persons per year
      for iTTP in the general population.
    explanation: >-
      The systematic review provides the general-population incidence range
      for immune TTP.
  - reference: PMID:39161536
    reference_title: A Systematic Review of the Epidemiology and Disease Burden of Congenital and Immune-Mediated Thrombotic Thrombocytopenic Purpura.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Compared with cTTP, the onset of symptoms in patients with iTTP occurred
      later in life
    explanation: >-
      This supports typical adult onset while not excluding pediatric disease.
  - reference: PMID:39161536
    reference_title: A Systematic Review of the Epidemiology and Disease Burden of Congenital and Immune-Mediated Thrombotic Thrombocytopenic Purpura.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      A female predominance was reported for both cTTP and iTTP
    explanation: >-
      The review consistently found female predominance across immune-TTP
      studies.
  - reference: PMID:39161536
    reference_title: A Systematic Review of the Epidemiology and Disease Burden of Congenital and Immune-Mediated Thrombotic Thrombocytopenic Purpura.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Black race is an established risk factor for iTTP,3,133with a sevenfold
      higher incidence reported among individuals who are Black vs non-Black.
    explanation: >-
      This reports a major population disparity while the review cautions that
      access and registry participation affect estimates.
prevalence:
- population: Spain
  measure_type: POINT_PREVALENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 2.144
  notes: >-
    Nationwide registry survey estimate among people aged 16 years and older;
    it should not be generalized as a worldwide prevalence.
  evidence:
  - reference: PMID:33780553
    reference_title: "Incidence, diagnosis, and outcome of immune-mediated thrombotic thrombocytopenic purpura: A nationwide survey by the Spanish registry of thrombotic thrombocytopenic purpura."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Incidence was 2.67 (95% CI 1.90-3.45) patients per million inhabitants
      per year and prevalence 21.44 (95% CI% 19.10-23.73) patients per million
      inhabitants.
    explanation: >-
      The Spanish registry supplies a denominator-based population estimate.
progression:
- phase: Acute immune-TTP episode
  age_range: Usually adulthood; pediatric and adolescent disease also occurs
  notes: >-
    A first or relapsed episode presents as a thrombotic microangiopathy and can
    progress rapidly to irreversible neurologic, cardiac, renal, or other organ
    injury. Treatment should begin on strong clinical suspicion rather than
    waiting for untreated natural progression or delayed ADAMTS13 results.
  evidence:
  - reference: PMID:39161536
    reference_title: A Systematic Review of the Epidemiology and Disease Burden of Congenital and Immune-Mediated Thrombotic Thrombocytopenic Purpura.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Acute episodes are considered a true medical emergency and are associated
      with a mortality rate of >90% if left untreated.
    explanation: >-
      The systematic review documents the lethality of untreated acute TTP.
- phase: Clinical remission with residual relapse and survivorship risk
  notes: >-
    Platelet recovery and resolution of acute hemolysis define clinical
    response, but ADAMTS13 activity may remain suppressed or later fall again.
    Relapse timing is unpredictable, and survivors remain at risk for stroke,
    cardiovascular disease, cognitive impairment, depression, and reduced
    quality of life.
  evidence:
  - reference: PMID:39161536
    reference_title: A Systematic Review of the Epidemiology and Disease Burden of Congenital and Immune-Mediated Thrombotic Thrombocytopenic Purpura.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Relapses can occur in up to 50% of patients who survive their initial
      episode, and the timing may be unpredictable, occurring close to
      achievement of remission or months later.
    explanation: >-
      This supports a chronic relapsing disease model rather than a single
      resolved acute event.
- phase: Pregnancy-associated risk
  age_range: Reproductive age
  notes: >-
    Pregnancy can precipitate a first or recurrent TTP episode. Congenital and
    immune TTP must be distinguished, and subsequent pregnancies require
    expert planning and ADAMTS13-guided monitoring.
  evidence:
  - reference: PMID:24859360
    reference_title: "Thrombotic thrombocytopenic purpura and pregnancy: presentation, management, and subsequent pregnancy outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pregnancy can precipitate thrombotic thrombocytopenic purpura (TTP).
    explanation: >-
      The UK pregnancy cohort establishes pregnancy as a clinically important
      precipitant.
pathophysiology:
- name: Anti-ADAMTS13 Autoantibody Production
  description: >-
    Autoreactive B-lineage cells produce predominantly IgG antibodies against
    ADAMTS13. Antibodies can inhibit proteolytic activity and/or accelerate
    antigen clearance. This acquired immune response, rather than a germline
    ADAMTS13 defect, defines immune TTP.
  cell_types:
  - preferred_term: B cell
    term:
      id: CL:0000236
      label: B cell
  - preferred_term: plasma cell
    term:
      id: CL:0000786
      label: plasma cell
  evidence:
  - reference: PMID:9828246
    reference_title: Antibodies to von Willebrand factor-cleaving protease in acute thrombotic thrombocytopenic purpura.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The inhibitors were IgG antibodies.
    explanation: >-
      The original human study identifies the inhibitor as IgG.
  - reference: PMID:9828245
    reference_title: von Willebrand factor-cleaving protease in thrombotic thrombocytopenic purpura and the hemolytic-uremic syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Nonfamilial thrombotic thrombocytopenic purpura is due to an inhibitor of
      von Willebrand factor-cleaving protease
    explanation: >-
      This foundational study distinguishes acquired inhibitor-mediated TTP.
  downstream:
  - target: Severe ADAMTS13 Activity Deficiency
    causal_link_type: DIRECT
    description: >-
      Inhibition and immune clearance reduce circulating ADAMTS13 activity to
      the severe-deficiency range.
    evidence:
    - reference: PMID:30625070
      reference_title: Caplacizumab Treatment for Acquired Thrombotic Thrombocytopenic Purpura.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        an immune-mediated deficiency of the von Willebrand factor-cleaving
        protease ADAMTS13 allows unrestrained adhesion of von Willebrand factor
        multimers to platelets and microthrombosis
      explanation: >-
        The phase 3 report states that immune-mediated ADAMTS13 deficiency is
        upstream of VWF-platelet microthrombosis.
- name: Severe ADAMTS13 Activity Deficiency
  description: >-
    Functional ADAMTS13 activity below 10% is the defining biochemical lesion
    of TTP in the appropriate thrombotic-microangiopathy context. Severe
    deficiency can persist during apparent clinical remission, so it is a
    disease-state marker as well as an acute diagnostic marker.
  biological_processes:
  - preferred_term: proteolysis
    term:
      id: GO:0006508
      label: proteolysis
    modifier: DECREASED
  evidence:
  - reference: PMID:39161536
    reference_title: A Systematic Review of the Epidemiology and Disease Burden of Congenital and Immune-Mediated Thrombotic Thrombocytopenic Purpura.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      An ADAMTS13 activity of <10% is required to confirm the diagnosis of TTP
    explanation: >-
      This supports the severe-activity threshold stated for the node.
  downstream:
  - target: Persistence of Ultralarge VWF Multimers
    causal_link_type: DIRECT
    description: >-
      Loss of VWF-cleaving activity permits newly released ultralarge VWF
      multimers to remain uncleaved.
    evidence:
    - reference: PMID:28768626
      reference_title: Pathophysiology of thrombotic thrombocytopenic purpura.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Inherited or acquired ADAMTS13 deficiency allows the unrestrained
        growth of microthrombi that are composed of von Willebrand factor and
        platelets
      explanation: >-
        Review evidence links ADAMTS13 deficiency to the VWF-platelet
        microthrombotic process.
- name: Persistence of Ultralarge VWF Multimers
  description: >-
    Endothelial VWF remains in ultralarge, highly adhesive forms when ADAMTS13
    cleavage is severely impaired. Under shear, these multimers bind platelet
    glycoprotein Ib and recruit platelets.
  biological_processes:
  - preferred_term: platelet aggregation
    term:
      id: GO:0070527
      label: platelet aggregation
    modifier: INCREASED
  evidence:
  - reference: PMID:9828245
    reference_title: von Willebrand factor-cleaving protease in thrombotic thrombocytopenic purpura and the hemolytic-uremic syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Unusually large multimers of von Willebrand factor, capable of
      agglutinating circulating platelets under high shear stress
    explanation: >-
      The foundational study identifies the shear-dependent platelet-adhesive
      substrate.
  downstream:
  - target: Disseminated Platelet-VWF Microthrombosis
    causal_link_type: DIRECT
    description: >-
      Shear-dependent platelet adhesion to ultralarge VWF produces growing
      platelet-rich microthrombi.
    evidence:
    - reference: PMID:26863353
      reference_title: Caplacizumab for Acquired Thrombotic Thrombocytopenic Purpura.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Acquired thrombotic thrombocytopenic purpura (TTP) is caused by
        aggregation of platelets on ultralarge von Willebrand factor multimers.
      explanation: >-
        The phase 2 report describes the direct VWF-platelet aggregation step.
- name: Disseminated Platelet-VWF Microthrombosis
  description: >-
    Platelet-rich, VWF-rich thrombi disseminate through small vessels. This is
    not modeled as conventional fibrin/thrombin thrombogenesis: the defining
    lesion is VWF-mediated platelet adhesion.
  locations:
  - preferred_term: blood microvessel
    term:
      id: UBERON:8410081
      label: blood microvessel
  evidence:
  - reference: PMID:28768626
    reference_title: Pathophysiology of thrombotic thrombocytopenic purpura.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      microthrombi that are composed of von Willebrand factor and platelets
    explanation: >-
      The review defines the material composition of TTP microthrombi.
  downstream:
  - target: Platelet Consumption
    causal_link_type: DIRECT
    description: >-
      Recruitment of circulating platelets into disseminated microthrombi
      depletes the circulating platelet pool.
    evidence:
    - reference: PMID:28768626
      reference_title: Pathophysiology of thrombotic thrombocytopenic purpura.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        which account for the thrombocytopenia, hemolytic anemia, schistocytes,
        and tissue injury that characterize TTP
      explanation: >-
        Review evidence attributes thrombocytopenia to the VWF-platelet
        microthrombi.
  - target: Shear-Mediated Erythrocyte Fragmentation
    causal_link_type: DIRECT
    description: >-
      Erythrocytes are mechanically fragmented while traversing partially
      occluded microvessels.
    evidence:
    - reference: PMID:28768626
      reference_title: Pathophysiology of thrombotic thrombocytopenic purpura.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        which account for the thrombocytopenia, hemolytic anemia, schistocytes,
        and tissue injury that characterize TTP
      explanation: >-
        This links the microthrombotic process to hemolysis and schistocytes.
  - target: Microvascular Occlusion and Ischemic Organ Injury
    causal_link_type: DIRECT
    description: >-
      Occlusion of small vessels reduces organ perfusion and produces ischemic
      tissue injury.
    evidence:
    - reference: PMID:26863353
      reference_title: Caplacizumab for Acquired Thrombotic Thrombocytopenic Purpura.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        This microvascular thrombosis causes multiorgan ischemia with
        potentially life-threatening complications.
      explanation: >-
        The trial report directly connects microvascular thrombosis with
        multiorgan ischemia.
- name: Platelet Consumption
  description: >-
    Platelet incorporation into microthrombi produces the characteristic severe
    thrombocytopenia.
  evidence:
  - reference: PMID:30625070
    reference_title: Caplacizumab Treatment for Acquired Thrombotic Thrombocytopenic Purpura.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      microthrombosis, which result in thrombocytopenia, hemolytic anemia, and
      tissue ischemia
    explanation: >-
      The phase 3 report supports platelet consumption as the proximal basis of
      thrombocytopenia in the microthrombotic process.
  downstream:
  - target: Thrombocytopenia
    causal_link_type: DIRECT
    description: >-
      Consumption of circulating platelets lowers the measured platelet count.
    evidence:
    - reference: PMID:30625070
      reference_title: Caplacizumab Treatment for Acquired Thrombotic Thrombocytopenic Purpura.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        unrestrained adhesion of von Willebrand factor multimers to platelets
        and microthrombosis, which result in thrombocytopenia, hemolytic anemia,
        and tissue ischemia
      explanation: >-
        The phase 3 report connects VWF-platelet microthrombosis to
        thrombocytopenia.
- name: Shear-Mediated Erythrocyte Fragmentation
  description: >-
    Mechanical injury to erythrocytes in obstructed microvessels produces
    intravascular hemolysis and fragmented cells on the blood smear.
  evidence:
  - reference: PMID:28768626
    reference_title: Pathophysiology of thrombotic thrombocytopenic purpura.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      the thrombocytopenia, hemolytic anemia, schistocytes, and tissue injury

    reference_title: Cardiovascular disease is a leading cause of mortality among TTP survivors in clinical remission.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Immune-mediated thrombotic thrombocytopenic purpura (iTTP) survivors
      experience high rates of adverse health sequelae and increased mortality
      over long-term follow-up.
    explanation: >-
      This multicenter registry study establishes a substantial survivorship
      burden.
  downstream:

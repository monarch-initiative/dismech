- name: Post-Acute Neurovascular and Psychosocial Sequelae
  description: >-
    Clinical remission can be followed by stroke, cognitive impairment,
    depression, anxiety, and cardiovascular morbidity. These outcomes are
    observationally associated with surviving iTTP; causal pathways are
    heterogeneous and incompletely defined.
  evidence:

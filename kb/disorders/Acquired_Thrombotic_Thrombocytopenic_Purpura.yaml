name: Acquired Thrombotic Thrombocytopenic Purpura
creation_date: "2026-07-05T00:00:00Z"
category: Autoimmune
parents:
- Autoimmune Disease
- Hematologic Disease
- Thrombotic Microangiopathy
disease_term:
  preferred_term: Acquired Thrombotic Thrombocytopenic Purpura
  term:
    id: MONDO:0019740
    label: acquired thrombotic thrombocytopenic purpura
description: >-
  Acquired (immune-mediated) thrombotic thrombocytopenic purpura (iTTP/aTTP) is a
  life-threatening thrombotic microangiopathy caused by an autoantibody-mediated
  severe deficiency of ADAMTS13, the von Willebrand factor (VWF)-cleaving protease.
  Loss of ADAMTS13 activity permits persistence of ultralarge VWF multimers that
  agglutinate platelets under high shear, producing disseminated microvascular
  platelet-VWF thrombi. The result is profound consumptive thrombocytopenia,
  microangiopathic hemolytic anemia with schistocytes, and ischemic organ injury
  (notably neurologic). The flagship targeted therapy is caplacizumab, an anti-VWF
  humanized single-domain immunoglobulin (Nanobody) that blocks the VWF-platelet
  interaction; it is used alongside therapeutic plasma exchange and immunosuppression
  (corticosteroids, rituximab).
pathophysiology:
- name: ADAMTS13 Autoantibody-Mediated Deficiency
  description: >-
    Acquired TTP is an autoimmune disorder in which inhibitory IgG autoantibodies
    against ADAMTS13 (the VWF-cleaving protease) cause a severe functional deficiency
    of the enzyme. Unlike the congenital form, the deficiency is not due to germline
    mutation but to circulating autoantibodies that neutralize or clear the protease.
  cell_types:
  - preferred_term: Autoantibody-producing plasma cell
    term:
      id: CL:0000786
      label: plasma cell
  biological_processes:
  - preferred_term: ADAMTS13 proteolysis of von Willebrand factor
    term:
      id: GO:0006508
      label: proteolysis
    modifier: DECREASED
  evidence:
  - reference: PMID:9828246
    reference_title: Antibodies to von Willebrand factor-cleaving protease in acute thrombotic thrombocytopenic purpura.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Inhibitory antibodies against von Willebrand factor-cleaving protease occur in patients with acute thrombotic thrombocytopenic purpura."
    explanation: Establishes that acquired TTP is driven by autoantibodies against the VWF-cleaving protease (ADAMTS13).
  - reference: PMID:9828246
    reference_title: Antibodies to von Willebrand factor-cleaving protease in acute thrombotic thrombocytopenic purpura.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The inhibitors were IgG antibodies."
    explanation: Identifies the inhibitory autoantibodies as IgG, defining the immune mechanism of the acquired form.
  - reference: PMID:9828245
    reference_title: von Willebrand factor-cleaving protease in thrombotic thrombocytopenic purpura and the hemolytic-uremic syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nonfamilial thrombotic thrombocytopenic purpura is due to an inhibitor of von Willebrand factor-cleaving protease"
    explanation: Distinguishes acquired (nonfamilial) TTP as inhibitor-mediated, contrasting with the constitutional deficiency of the familial form.
  - reference: PMID:30625070
    reference_title: Caplacizumab Treatment for Acquired Thrombotic Thrombocytopenic Purpura.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "an immune-mediated deficiency of the von Willebrand factor-cleaving protease ADAMTS13 allows unrestrained adhesion of von Willebrand factor multimers to platelets and microthrombosis"
    explanation: States the immune-mediated ADAMTS13 deficiency as the initiating lesion of acquired TTP.
- name: Ultralarge VWF-Platelet Microthrombosis
  description: >-
    Without ADAMTS13 proteolysis, ultralarge VWF multimers persist and, under high
    shear stress, agglutinate circulating platelets. This drives unrestrained growth
    of platelet-VWF microthrombi throughout the microcirculation.
  cell_types:
  - preferred_term: Platelet
    term:
      id: CL:0000233
      label: platelet
  - preferred_term: Vascular endothelial cell (VWF source)
    term:
      id: CL:0002139
      label: endothelial cell of vascular tree
  biological_processes:
  - preferred_term: Shear-induced platelet aggregation on VWF
    term:
      id: GO:0070527
      label: platelet aggregation
    modifier: INCREASED
  - preferred_term: Microvascular thrombosis
    term:
      id: GO:0007596
      label: blood coagulation
    modifier: INCREASED
  downstream:
  - target: Microvascular Thrombosis and Multiorgan Ischemia
  evidence:
  - reference: PMID:26863353
    reference_title: Caplacizumab for Acquired Thrombotic Thrombocytopenic Purpura.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Acquired thrombotic thrombocytopenic purpura (TTP) is caused by aggregation of platelets on ultralarge von Willebrand factor multimers."
    explanation: Directly identifies platelet aggregation on ultralarge VWF multimers as the causal event.
  - reference: PMID:9828245
    reference_title: von Willebrand factor-cleaving protease in thrombotic thrombocytopenic purpura and the hemolytic-uremic syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Unusually large multimers of von Willebrand factor, capable of agglutinating circulating platelets under high shear stress"
    explanation: Describes the ultralarge VWF multimers agglutinating platelets under shear, the mechanistic basis of microthrombosis.
  - reference: PMID:28768626
    reference_title: Pathophysiology of thrombotic thrombocytopenic purpura.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Inherited or acquired ADAMTS13 deficiency allows the unrestrained growth of microthrombi that are composed of von Willebrand factor and platelets"
    explanation: Links ADAMTS13 deficiency to unrestrained growth of VWF-platelet microthrombi.
- name: Microvascular Thrombosis and Multiorgan Ischemia
  description: >-
    Disseminated platelet-VWF microthrombi consume platelets (thrombocytopenia),
    shear passing erythrocytes to produce schistocytes and microangiopathic hemolytic
    anemia, and occlude the microcirculation to cause ischemic organ injury with
    potentially life-threatening (especially neurologic and cardiac) complications.
  biological_processes:
  - preferred_term: Platelet activation and consumption
    term:
      id: GO:0030168
      label: platelet activation
    modifier: INCREASED
  evidence:
  - reference: PMID:26863353
    reference_title: Caplacizumab for Acquired Thrombotic Thrombocytopenic Purpura.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This microvascular thrombosis causes multiorgan ischemia with potentially life-threatening complications."
    explanation: Connects microvascular thrombosis to multiorgan ischemia and life-threatening complications.
  - reference: PMID:28768626
    reference_title: Pathophysiology of thrombotic thrombocytopenic purpura.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "which account for the thrombocytopenia, hemolytic anemia, schistocytes, and tissue injury that characterize TTP"
    explanation: Attributes the defining hematologic and tissue-injury features of TTP to the microthrombi.
phenotypes:
- name: Thrombocytopenia
  description: Profound consumptive thrombocytopenia from platelet incorporation into microthrombi.
  phenotype_term:
    preferred_term: Thrombocytopenia
    term:
      id: HP:0001873
      label: Thrombocytopenia
  evidence:
  - reference: PMID:30625070
    reference_title: Caplacizumab Treatment for Acquired Thrombotic Thrombocytopenic Purpura.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "unrestrained adhesion of von Willebrand factor multimers to platelets and microthrombosis, which result in thrombocytopenia, hemolytic anemia, and tissue ischemia"
    explanation: Lists thrombocytopenia as a direct consequence of the microthrombotic process.
- name: Microangiopathic Hemolytic Anemia
  description: >-
    Non-immune hemolytic anemia from mechanical fragmentation of erythrocytes passing
    through partially occluded, VWF-platelet-laden microvessels.
  phenotype_term:
    preferred_term: Microangiopathic hemolytic anemia
    term:
      id: HP:0001937
      label: Microangiopathic hemolytic anemia
  evidence:
  - reference: PMID:28768626
    reference_title: Pathophysiology of thrombotic thrombocytopenic purpura.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the thrombocytopenia, hemolytic anemia, schistocytes, and tissue injury that characterize TTP"
    explanation: Documents hemolytic anemia with schistocytes as a characteristic feature of TTP.
- name: Schistocytosis
  description: Fragmented erythrocytes (schistocytes) on the peripheral blood smear, a hallmark of microangiopathic hemolysis.
  phenotype_term:
    preferred_term: Schistocytosis
    term:
      id: HP:0001981
      label: Schistocytosis
  evidence:
  - reference: PMID:28768626
    reference_title: Pathophysiology of thrombotic thrombocytopenic purpura.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the thrombocytopenia, hemolytic anemia, schistocytes, and tissue injury that characterize TTP"
    explanation: Names schistocytes among the characteristic findings of TTP.
- name: Neurological Manifestations
  description: >-
    Ischemic central nervous system involvement (e.g., confusion, focal deficits,
    seizures, stroke); neurologic injury may become irreversible before treatment response.
  phenotype_term:
    preferred_term: Neurological deficits
    term:
      id: HP:0000707
      label: Abnormality of the nervous system
  evidence:
  - reference: PMID:28768626
    reference_title: Pathophysiology of thrombotic thrombocytopenic purpura.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "some die or acquire irreversible neurological deficits before they can respond"
    explanation: Documents neurologic deficits as a major and potentially irreversible consequence of TTP.
biochemical:
- name: Severely Reduced ADAMTS13 Activity
  presence: Decreased
  context: >-
    Severe ADAMTS13 deficiency (activity <10%) with a detectable anti-ADAMTS13
    inhibitor/IgG autoantibody is the diagnostic hallmark distinguishing acquired
    TTP from other thrombotic microangiopathies. Persistently low activity after an
    acute episode signals unresolved autoimmune activity and relapse risk.
  biomarker_term:
    preferred_term: ADAMTS13
    term:
      id: hgnc:1366
      label: ADAMTS13
  evidence:
  - reference: PMID:26863353
    reference_title: Caplacizumab for Acquired Thrombotic Thrombocytopenic Purpura.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "7 had ADAMTS13 activity that remained below 10%, suggesting unresolved autoimmune activity"
    explanation: Anchors the <10% ADAMTS13 activity threshold and its link to unresolved autoimmune activity and relapse.
treatments:
- name: Caplacizumab
  description: >-
    Caplacizumab (Cablivi) is an anti-von Willebrand factor humanized single-domain
    immunoglobulin (Nanobody) — a single-variable-domain antibody fragment — that binds
    the A1 domain of VWF and blocks the VWF-platelet (GPIb) interaction, arresting
    microthrombus formation despite persistent ADAMTS13 deficiency. Added to plasma
    exchange and immunosuppression, it speeds platelet normalization and reduces
    TTP-related death, recurrence, and thromboembolism; the main adverse effect is
    mucocutaneous bleeding.
  therapeutic_modality: NANOBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: caplacizumab
      term:
        id: NCIT:C128625
        label: Caplacizumab
  target_mechanisms:
  - target: Ultralarge VWF-Platelet Microthrombosis
    treatment_effect: INHIBITS
    description: >-
      Caplacizumab blocks the interaction between ultralarge VWF multimers and
      platelets, preventing platelet aggregation and microthrombus growth independently
      of ADAMTS13 activity.
  target_phenotypes:
  - preferred_term: Thrombocytopenia
    term:
      id: HP:0001873
      label: Thrombocytopenia
  evidence:
  - reference: PMID:26863353
    reference_title: Caplacizumab for Acquired Thrombotic Thrombocytopenic Purpura.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Caplacizumab, an anti-von Willebrand factor humanized single-variable-domain immunoglobulin (Nanobody), inhibits the interaction between ultralarge von Willebrand factor multimers and platelets."
    explanation: Defines caplacizumab as an anti-VWF single-domain immunoglobulin (Nanobody) and states its molecular mechanism.
  - reference: PMID:26863353
    reference_title: Caplacizumab for Acquired Thrombotic Thrombocytopenic Purpura.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The time to a response was significantly reduced with caplacizumab as compared with placebo (39% reduction in median time, P=0.005)."
    explanation: Phase 2 (TITAN) efficacy — faster platelet-count response with caplacizumab.
  - reference: PMID:30625070
    reference_title: Caplacizumab Treatment for Acquired Thrombotic Thrombocytopenic Purpura.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The percentage of patients with a composite outcome event was 74% lower with caplacizumab than with placebo (12% vs. 49%, P<0.001)."
    explanation: Phase 3 (HERCULES) efficacy — large reduction in the composite of TTP-related death, recurrence, or thromboembolism.
  - reference: PMID:30625070
    reference_title: Caplacizumab Treatment for Acquired Thrombotic Thrombocytopenic Purpura.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The most common adverse event was mucocutaneous bleeding, which was reported in 65% of the patients in the caplacizumab group and in 48% in the placebo group."
    explanation: Documents mucocutaneous bleeding as the principal safety liability of the anti-VWF mechanism.
- name: Therapeutic Plasma Exchange
  description: >-
    Daily therapeutic plasma exchange removes anti-ADAMTS13 autoantibodies and
    ultralarge VWF multimers while replenishing functional ADAMTS13; it is the
    long-standing first-line intervention that converts a formerly fatal disease into
    a treatable one.
  treatment_term:
    preferred_term: Plasmapheresis
    term:
      id: NCIT:C15304
      label: Plasmapheresis
  target_mechanisms:
  - target: ADAMTS13 Autoantibody-Mediated Deficiency
    treatment_effect: INHIBITS
    description: Plasma exchange removes circulating anti-ADAMTS13 autoantibodies and replenishes the deficient protease.
  evidence:
  - reference: PMID:28768626
    reference_title: Pathophysiology of thrombotic thrombocytopenic purpura.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most patients with acquired TTP respond to a combination of plasma exchange and rituximab"
    explanation: Establishes plasma exchange (with rituximab) as standard effective therapy for acquired TTP.
  - reference: PMID:26863353
    reference_title: Caplacizumab for Acquired Thrombotic Thrombocytopenic Purpura.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Daily plasma exchange and immunosuppressive therapies induce remission, but mortality and morbidity due to microthrombosis remain high."
    explanation: Confirms daily plasma exchange plus immunosuppression as remission-inducing standard care, while noting residual risk that motivates caplacizumab.
- name: Rituximab
  description: >-
    Anti-CD20 monoclonal antibody that depletes B cells and suppresses anti-ADAMTS13
    autoantibody production, used to treat and prevent relapse in acquired TTP.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: rituximab
      term:
        id: NCIT:C1702
        label: Rituximab
  target_mechanisms:
  - target: ADAMTS13 Autoantibody-Mediated Deficiency
    treatment_effect: INHIBITS
    description: B-cell depletion reduces production of the anti-ADAMTS13 autoantibody driving the disease.
  evidence:
  - reference: PMID:28768626
    reference_title: Pathophysiology of thrombotic thrombocytopenic purpura.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most patients with acquired TTP respond to a combination of plasma exchange and rituximab"
    explanation: Identifies rituximab, combined with plasma exchange, as effective therapy targeting the autoimmune driver.
- name: Corticosteroid Immunosuppression
  description: >-
    Corticosteroids are given as adjunctive immunosuppression to dampen the autoimmune
    response producing anti-ADAMTS13 autoantibodies.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: corticosteroid
      term:
        id: CHEBI:50858
        label: corticosteroid
  target_mechanisms:
  - target: ADAMTS13 Autoantibody-Mediated Deficiency
    treatment_effect: INHIBITS
    description: Immunosuppression reduces autoantibody-mediated ADAMTS13 inhibition.
  evidence:
  - reference: PMID:26863353
    reference_title: Caplacizumab for Acquired Thrombotic Thrombocytopenic Purpura.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Daily plasma exchange and immunosuppressive therapies induce remission, but mortality and morbidity due to microthrombosis remain high."
    explanation: Supports immunosuppressive therapy as part of remission-inducing standard care.

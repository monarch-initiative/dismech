- name: Microvascular Occlusion and Ischemic Organ Injury
  description: >-
    Platelet-VWF microthrombi obstruct organ microcirculation. Neurologic injury
    is prominent, but cardiac and renal ischemic injury also occur; severe renal
    failure should increase consideration of another thrombotic
    microangiopathy.

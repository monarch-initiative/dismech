    explanation: >-
      The review supports erythrocyte fragmentation as the proximal mechanism
      yielding hemolytic anemia and schistocytes.
  downstream:
  - target: Microangiopathic Hemolytic Anemia
    causal_link_type: DIRECT
    description: >-
      Ongoing mechanical erythrocyte destruction produces anemia and hemolysis.
    evidence:
    - reference: PMID:28768626
      reference_title: Pathophysiology of thrombotic thrombocytopenic purpura.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        the thrombocytopenia, hemolytic anemia, schistocytes, and tissue injury
        that characterize TTP
      explanation: >-
        Review evidence supports hemolytic anemia as a consequence of the
        microthrombotic process.
  - target: Schistocytosis
    causal_link_type: DIRECT
    description: >-
      Fragmented erythrocytes appear as schistocytes on peripheral smear.
    evidence:
    - reference: PMID:28768626
      reference_title: Pathophysiology of thrombotic thrombocytopenic purpura.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        the thrombocytopenia, hemolytic anemia, schistocytes, and tissue injury

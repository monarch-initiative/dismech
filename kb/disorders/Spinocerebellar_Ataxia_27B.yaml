- name: Loss of Cerebellar Cortical Output
  description: >-
    Purkinje cells provide the sole output of the cerebellar cortex to the deep
    cerebellar nuclei. Their functional silencing and, later, loss corrupt the
    motor-coordination and oculomotor signals relayed downstream. In SCA27B the
    dysfunction is initially intermittent and reversible, which explains the
    prominent episodic phase and the responsiveness to a drug that restores
    Purkinje pacemaking precision.
  role: effector
  biological_scale: TISSUE
  conforms_to: "cerebellar_purkinje_degeneration#Loss of Cerebellar Cortical Output"
  mechanism_confidence: ESTABLISHED
  cell_types:
  - preferred_term: cerebellar Purkinje cell
    term:
      id: CL:0000121
      label: Purkinje cell
  biological_processes:
  - preferred_term: nervous system process
    term:

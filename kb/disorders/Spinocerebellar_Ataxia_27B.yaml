variants:
- name: FGF14 intron 1 (GAA)n repeat expansion
  description: >-
    Heterozygous expansion of a (GAA) short tandem repeat located deep in
    intron 1 of FGF14. Pathogenicity depends jointly on the length of the
    longest pure GAA tract and on the presence of interrupting motifs; the
    non-coding location means the mechanism is loss of expression rather than
    an altered protein product.
  gene:
    preferred_term: FGF14
    term:
      id: hgnc:3671
      label: FGF14
  clinical_significance: PATHOGENIC
  type: short tandem repeat expansion
  regulatory_category: LOE
  evidence:
  - reference: PMID:36516086
    reference_title: Deep Intronic FGF14 GAA Repeat Expansion in Late-Onset Cerebellar Ataxia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Postmortem cerebellum specimens and iPSC-derived motor neurons from
      patients showed reduced expression of FGF14 RNA and protein.
    explanation: >-
      Supports classification as a loss-of-expression regulatory variant: the
      intronic expansion reduces FGF14 RNA and protein rather than altering
      coding sequence.
- name: FGF14 GAAGGA / AAGGAG interrupted hexameric repeat configuration
  description: >-
    Expanded FGF14 repeat alleles whose tract is composed of, or heavily
    interrupted by, GAAGGA/AAGGAG hexameric motifs. These configurations occur
    at equal frequency in patients and controls and are treated as
    non-pathogenic; mosaic divergent repeat interruptions that shorten the
    remaining pure GAA tract are enriched in unaffected expansion carriers.
  gene:
    preferred_term: FGF14
    term:
      id: hgnc:3671
      label: FGF14
  clinical_significance: LIKELY_BENIGN
  type: interrupted short tandem repeat
  evidence:
  - reference: PMID:39227614
    reference_title: Identification and characterisation of pathogenic and non-pathogenic FGF14 repeat expansions.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Conversely, AAGGAG hexameric expansions are equally frequent in patients
      and controls.
    explanation: >-
      Directly supports the non-pathogenic status of the hexameric motif
      configuration.
  - reference: PMID:39227614
    reference_title: Identification and characterisation of pathogenic and non-pathogenic FGF14 repeat expansions.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Furthermore, pure AAG (pathogenic) and AAGGAG (non-pathogenic) repeats
      form different secondary structures.
    explanation: >-
      Offers a biophysical rationale for the motif-dependent pathogenicity.
      Evidence source is IN_VITRO because the secondary-structure comparison is
      a molecular assay outside an organism.
  - reference: PMID:40379261
    reference_title: "FGF14 repeat length and mosaic interruptions: modifiers of spinocerebellar ataxia 27B?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      with a higher mosaic frequency of interruptions in unaffected
      individuals compared with patients
    explanation: >-
      Supports interruptions acting as a protective modifier of pathogenicity.

pathophysiology:
- name: FGF14 Intronic GAA Repeat Expansion
  description: >-
    A heterozygous (GAA)n repeat expansion deep in intron 1 of FGF14 is the
    initiating molecular lesion. Because the repeat lies in non-coding
    sequence, it does not produce an altered FGF14 protein; instead, expansion
    beyond a length- and motif-dependent threshold destabilises expression of
    the allele. Repeat length correlates inversely with age at onset, and the
    tract's motif composition (pure GAA versus GAAGGA/AAGGAG interruptions)
    gates whether an expansion is pathogenic at all.
  role: trigger
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED

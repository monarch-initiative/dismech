  evidence:
  - reference: PMID:18930825
    reference_title: FGF14 regulates the intrinsic excitability of cerebellar Purkinje neurons.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Current clamp recordings from Purkinje neurons in cerebellar slices
      revealed attenuated spontaneous firing in Fgf14(-/-) neurons. Unlike in
      the wild type animals, more than 80% of Fgf14(-/-) Purkinje neurons were
      quiescent and failed to fire repetitively in response to depolarizing
      current injections.
    explanation: >-
      Direct electrophysiological demonstration in Fgf14-null mice that loss of
      FGF14 abolishes spontaneous and repetitive Purkinje firing.
  - reference: PMID:18930825
    reference_title: FGF14 regulates the intrinsic excitability of cerebellar Purkinje neurons.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      FGF14 is required for normal Nav1.6 expression in Purkinje neurons, and
      that the loss of FGF14 impairs spontaneous and repetitive firing in
      Purkinje neurons by altering the expression of Nav1.6 channels
    explanation: >-
      Identifies the voltage-gated sodium channel Nav1.6 as the effector
      through which FGF14 loss degrades Purkinje firing.
  - reference: PMID:25926453
    reference_title: Intracellular FGF14 (iFGF14) Is Required for Spontaneous and Evoked Firing in Cerebellar Purkinje Neurons and for Motor Coordination and Balance.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      the loss of iFGF14 results in a marked hyperpolarizing shift in the
      voltage dependence of steady-state inactivation of the Nav currents in
      adult Purkinje neurons
    explanation: >-
      Defines the biophysical mechanism (shifted Nav steady-state inactivation)
      by which iFGF14 loss silences Purkinje neurons.
  downstream:
  - target: Purkinje Neuron Degeneration and Cerebellar Atrophy
    description: >-
      Chronic failure of Purkinje pacemaking is accompanied, over years, by
      Purkinje neuron loss, most severe in the anterior vermis in human
      autopsy series.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:39263992
      reference_title: Clinical, Radiological and Pathological Features of a Large American Cohort of Spinocerebellar Ataxia (SCA27B).
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The principal finding on post-mortem examination of 4 brain specimens
        was loss of Purkinje neurons that was most severe in the vermis most

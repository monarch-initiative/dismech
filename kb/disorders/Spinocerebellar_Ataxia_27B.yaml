- category: Neurological
  name: Downbeat nystagmus
  description: >-
    Downbeat nystagmus is a hallmark cerebellar oculomotor sign of SCA27B and
    can be the dominant or presenting manifestation. Conversely, FGF14
    (GAA)>=250 expansions account for roughly half of patients presenting with
    otherwise idiopathic downbeat nystagmus, making SCA27B the single most
    common identified cause of that syndrome.
  phenotype_term:

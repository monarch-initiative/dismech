histopathology:
- name: Purkinje cell loss with anterior vermian predominance
  description: >-
    Post-mortem examination of genetically confirmed SCA27B brains shows loss
    of Purkinje neurons, most severe in the vermis and particularly the
    anterior vermis.
  evidence:
  - reference: PMID:39263992
    reference_title: Clinical, Radiological and Pathological Features of a Large American Cohort of Spinocerebellar Ataxia (SCA27B).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The principal finding on post-mortem examination of 4 brain specimens
      was loss of Purkinje neurons that was most severe in the vermis most
      particularly in the anterior vermis.
    explanation: Primary neuropathological description of SCA27B.

progression:
- phase: Episodic prodrome
  age_range: Typically two to four years before progressive ataxia
  notes: >-
    Nearly half of patients first experience discrete episodes of gait and limb
    ataxia, visual disturbance, vertigo/dizziness, or dysarthria, on average
    two to four years before progressive ataxia begins.
  evidence:
  - reference: PMID:38271551
    reference_title: GAA-FGF14-Related Ataxia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Nearly 50% of individuals may first experience episodic manifestations
      including gait and limb ataxia, visual disturbances (diplopia,
      oscillopsia, and blurring), vertigo and/or dizziness, or dysarthria on
      average two to four years before the onset of progressive ataxia.
    explanation: Defines the episodic prodromal phase and its lead time.
- phase: Slowly progressive ataxia with functional plateau
  age_range: Median onset 60 years, reported range 21-87 years
  notes: >-
    Progression is slow, about 0.29 SARA points per year, with severity not
    exceeding a moderate level even in advanced disease and unilateral mobility
    aids required after roughly eight years in half of patients. Serum
    neurofilament light is not elevated relative to controls, consistent with
    limited neuroaxonal degeneration. Concurrent second neurological diseases
    are a major individual aggravator of severity and a confounder for trial
    design.
  evidence:
  - reference: PMID:38271551
    reference_title: GAA-FGF14-Related Ataxia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Median age at onset is 60 years (range: 21-87 years).
    explanation: Supports the recorded age range for this phase.
  - reference: PMID:37165652
    reference_title: "GAA-FGF14 ataxia (SCA27B): phenotypic profile, natural history progression and 4-aminopyridine treatment response."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Functional impairment increased relatively slowly (unilateral mobility
      aids after 8 years in 50% of patients).
    explanation: Quantifies functional progression.
  - reference: PMID:37165652
    reference_title: "GAA-FGF14 ataxia (SCA27B): phenotypic profile, natural history progression and 4-aminopyridine treatment response."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Concurrent second diseases (including progressive supranuclear palsy
      neuropathology) represented major individual aggravators of disease
      severity, constituting important caveats for planning future GAA-FGF14
      trials.
    explanation: Documents comorbid disease as a driver of apparent severity.
  - reference: PMID:38271551
    reference_title: GAA-FGF14-Related Ataxia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      use of a wheelchair is less necessary than in other common hereditary
      spinocerebellar ataxias (e.g., SCA1, SCA2, and SCA3)
    explanation: Contrasts the milder functional trajectory with the polyglutamine SCAs.


  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:39263992
    reference_title: Clinical, Radiological and Pathological Features of a Large American Cohort of Spinocerebellar Ataxia (SCA27B).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Balance and gait impairment were almost always present at disease onset.
    explanation: >-
      Supports both the phenotype and the VERY_FREQUENT band: "almost always"
      maps to the 80-100% HPO frequency range in a 102-patient cohort.
  - reference: PMID:38271551
    reference_title: GAA-FGF14-Related Ataxia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-

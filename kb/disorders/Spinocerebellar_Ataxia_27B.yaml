notes: >-
  Module conformance: four pathophysiology nodes declare conformance to
  cerebellar_purkinje_degeneration (Cerebellar Neuron Insult, Purkinje Neuron
  Degeneration, Loss of Cerebellar Cortical Output, Cerebellar Ataxia). The
  module's "Purkinje Cell Calcium and Proteostasis Dysregulation" amplifier node
  is deliberately NOT claimed: SCA27B's amplifying lesion is sodium-channel
  gating and intrinsic excitability failure, not calcium dysregulation or
  proteotoxicity, so the entry substitutes its own "Impaired Purkinje Neuron
  Intrinsic Excitability and Firing" node at that position in the chain.

  Nomenclature: the same disease appears in the literature as SCA27B,
  GAA-FGF14 ataxia/disease, SCA50, and ATX-FGF14. The SCA50 designation was
  assigned independently by the Australian discovery group before the entities
  were recognised as identical. This entry is scoped strictly to the intronic
  repeat-expansion disease (MONDO:0859340, OMIM:620174) and excludes SCA27A
  (MONDO:0008654, OMIM:609307), the childhood-onset FGF14 coding-variant
  disorder.

  Repeat orientation: reports differ in whether the tract is written as (GAA)n
  or (AAG)n depending on the strand and register used; these refer to the same
  repeat. Snippets in this entry preserve whichever form the source used.

  Deliberately omitted: prevalence is
  recorded as diagnostic yield with measure_type UNKNOWN rather than a
  population rate, because no population-based prevalence estimate for SCA27B
  has been published. Age at onset is captured as an OnsetDescriptor on the
  gait-ataxia phenotype and in the progression phases rather than as a separate
  HP:0003584 phenotype, since onset modifiers are not members of the
  PhenotypeTerm enum. Snippets avoid square-bracketed source text (e.g. the
  "[0.29 SARA points/year]" interval), which the reference validator strips
  before substring matching.

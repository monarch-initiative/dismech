- name: Impaired Purkinje Neuron Intrinsic Excitability and Firing
  description: >-
    Intracellular FGF14 binds the C-terminus of voltage-gated sodium (Nav)
    channel alpha subunits and is concentrated at the Purkinje neuron axon
    initial segment, where Nav1.6-mediated resurgent sodium current sustains
    the high-frequency pacemaking that defines these cells. Loss of FGF14
    produces a hyperpolarizing shift in the voltage dependence of steady-state
    Nav inactivation and reduced Nav1.6 availability, so Purkinje neurons fail
    to fire spontaneously and cannot sustain repetitive firing to depolarizing
    input. This is a functional excitability defect that precedes and is
    separable from cell death, and it is the node targeted by
    4-aminopyridine.
  role: central_effector
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  notes: >-
    This node is deliberately NOT declared as conforming to
    "cerebellar_purkinje_degeneration#Purkinje Cell Calcium and Proteostasis
    Dysregulation". That module node models calcium-handling and
    proteostatic/aggregation stress as the amplifying step, which is the
    polyglutamine and calcium-channelopathy SCA pattern. In SCA27B the
    amplifying lesion is sodium-channel-dependent intrinsic excitability
    failure, with no evidence of a proteotoxic or calcium-homeostasis
    intermediate. Asserting conformance here would misrepresent the mechanism.
  cell_types:
  - preferred_term: cerebellar Purkinje cell

  evidence:
  - reference: PMID:25926453
    reference_title: Intracellular FGF14 (iFGF14) Is Required for Spontaneous and Evoked Firing in Cerebellar Purkinje Neurons and for Motor Coordination and Balance.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The selective shRNA-mediated in vivo "knock-down" of iFGF14 in adult
      Purkinje neurons also impairs motor coordination and balance.
    explanation: >-
      Demonstrates that FGF14-dependent loss of Purkinje output translates into
      a motor-coordination deficit in vivo.
  - reference: PMID:37165652
    reference_title: "GAA-FGF14 ataxia (SCA27B): phenotypic profile, natural history progression and 4-aminopyridine treatment response."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      pancerebellar syndrome, partly combined with afferent sensory deficits
      (55%) and dysautonomia (28%)
    explanation: >-
      Confirms that the clinical picture in patients is a pancerebellar
      (cortical-output) syndrome.
  downstream:
  - target: Progressive Late-Onset Cerebellar Ataxia
    causal_link_type: DIRECT

- name: Progressive Late-Onset Cerebellar Ataxia
  description: >-
    The convergent clinical consequence: a mid- to late-adult-onset,
    slowly progressive pancerebellar syndrome of gait and limb ataxia,
    cerebellar oculomotor signs including downbeat nystagmus, and dysarthria,
    often preceded by an episodic phase. Progression is mild (about 0.29 SARA
    points per year) and severity plateaus at a moderate level even in advanced
    disease, distinguishing SCA27B from SCA1/2/3.
  role: consequence
  biological_scale: ORGANISM
  conforms_to: "cerebellar_purkinje_degeneration#Cerebellar Ataxia"
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:37165652
    reference_title: "GAA-FGF14 ataxia (SCA27B): phenotypic profile, natural history progression and 4-aminopyridine treatment response."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      not exceeding a moderate disease severity even in advanced stages
      (maximum SARA score: 18 points).
    explanation: >-
      Quantifies the plateau in severity that characterises this clinical
      consequence; the accompanying rate figure in the same sentence is 0.29
      SARA points per year.
  - reference: PMID:38271551
    reference_title: GAA-FGF14-Related Ataxia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      GAA-FGF14-related ataxia is a mid to late adult-onset slowly progressive
      cerebellar syndrome with predominant gait involvement.
    explanation: >-
      GeneReviews summary of the convergent clinical syndrome. Evidence source
      is OTHER because GeneReviews is an expert clinical synthesis.

phenotypes:
- category: Neurological
  name: Gait ataxia
  description: >-
    Progressive unsteadiness of gait is the cardinal and usually the presenting
    feature; balance and gait impairment were almost always present at disease
    onset in the largest reported cohort.
  phenotype_term:
    preferred_term: Gait ataxia
    term:
      id: HP:0002066
      label: Gait ataxia
    clinical_course: PROGRESSIVE
    onset:

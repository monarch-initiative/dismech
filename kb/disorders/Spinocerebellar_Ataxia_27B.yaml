inheritance:
- name: Autosomal dominant
  description: >-
    SCA27B is inherited in an autosomal dominant manner. Most affected
    individuals inherit the expanded FGF14 (GAA) allele from a parent who may
    carry a high-normal, reduced-penetrance, or fully pathogenic repeat; each
    child of an affected individual has a 50% chance of inheriting the allele.
    Penetrance is age-dependent and incomplete at shorter expansion sizes, and
    de novo generation of an expansion during meiosis has been inferred from
    haplotype analysis.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  parent_of_origin_effect: >-
    Repeat size is more likely to expand on maternal transmission and to
    contract on paternal transmission, an intergenerational instability that
    underlies variable anticipation within families.
  evidence:
  - reference: PMID:38271551
    reference_title: GAA-FGF14-Related Ataxia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      GAA-FGF14-related ataxia is inherited in an autosomal dominant manner.
    explanation: >-
      GeneReviews states the mode of inheritance directly. Evidence source is
      OTHER because GeneReviews is an expert-curated clinical synthesis rather
      than a primary study.
  - reference: PMID:38271551
    reference_title: GAA-FGF14-Related Ataxia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      the size of the GAA repeat is more likely to expand upon maternal
      transmission and to contract upon paternal transmission
    explanation: >-
      Supports the recorded parent-of-origin effect on intergenerational repeat
      instability.
  - reference: PMID:36493768
    reference_title: An intronic GAA repeat expansion in FGF14 causes the autosomal-dominant adult-onset ataxia SCA50/ATX-FGF14.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      identification of a shared haplotype in a minority of individuals
      suggests that the expansion can be inherited or generated de novo during
      meiotic division
    explanation: >-
      Supports both inherited transmission and de novo generation of the
      expansion.

genetic:
- name: FGF14
  gene_term:
    preferred_term: FGF14
    term:
      id: hgnc:3671
      label: FGF14
  association: Deep intronic (GAA) repeat expansion in intron 1 of FGF14
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: Positive
  notes: >-
    The pathogenic lesion is a heterozygous (GAA)n repeat expansion located
    deep within the first intron of FGF14 (equivalently written (AAG)n on the
    opposite strand in some reports). Reported thresholds have shifted as
    cohorts have grown: the original French Canadian cosegregation analysis
    supported (GAA) >= 250; the Australian/German discovery cohort concluded
    (GAA) > 335 is disease causing and fully penetrant while (GAA) > 250 is
    likely pathogenic with reduced penetrance; GeneReviews uses (GAA) > 300 for
    a definitive molecular diagnosis with a reduced-penetrance 250-300 zone; and
    a subsequent long-read study argued that uninterrupted expansions are
    already enriched in patients from 180-200 repeats. Repeat length correlates
    inversely with age at onset. Motif purity is a key modifier: pure GAA
    (AAG) expansions are pathogenic, whereas GAAGGA/AAGGAG hexameric expansions
    are found equally in patients and controls, and mosaic divergent repeat
    interruptions (mDRILS) that shorten the longest pure GAA tract are more
    frequent in unaffected carriers.
  inheritance:
  - name: Autosomal dominant
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
    penetrance: INCOMPLETE
  evidence:
  - reference: PMID:36516086
    reference_title: Deep Intronic FGF14 GAA Repeat Expansion in Late-Onset Cerebellar Ataxia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the six French Canadian patients, we identified a GAA repeat
      expansion deep in the first intron of FGF14, which encodes fibroblast
      growth factor 14.
    explanation: >-
      Establishes the causal lesion as a deep intronic GAA repeat expansion in
      FGF14 intron 1.
  - reference: PMID:36516086
    reference_title: Deep Intronic FGF14 GAA Repeat Expansion in Late-Onset Cerebellar Ataxia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cosegregation of the repeat expansion with disease in the families
      supported a pathogenic threshold of at least 250 GAA repeats
    explanation: >-
      Documents the originally proposed (GAA)>=250 pathogenic threshold from
      family cosegregation.
  - reference: PMID:36493768
    reference_title: An intronic GAA repeat expansion in FGF14 causes the autosomal-dominant adult-onset ataxia SCA50/ATX-FGF14.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The combined data suggest (GAA)>335 are disease causing and fully
      penetrant
    explanation: >-
      Independent cohort defining a fully penetrant threshold, higher than the
      original >=250 estimate.
  - reference: PMID:36493768
    reference_title: An intronic GAA repeat expansion in FGF14 causes the autosomal-dominant adult-onset ataxia SCA50/ATX-FGF14.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A negative correlation between age at onset and repeat length was
      observed
    explanation: >-
      Supports the inverse relationship between expansion size and age at
      onset.
  - reference: PMID:39227614
    reference_title: Identification and characterisation of pathogenic and non-pathogenic FGF14 repeat expansions.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Uninterrupted AAG expansions are significantly enriched in patients with
      ataxia from a lower threshold (180-200 repeats) than previously reported
      based on expansion size alone. Conversely, AAGGAG hexameric expansions
      are equally frequent in patients and controls.
    explanation: >-
      Establishes the motif-purity distinction: pure GAA/AAG tracts are
      pathogenic while GAAGGA/AAGGAG hexameric expansions are not, and lowers
      the length threshold once motif is accounted for.

diagnosis:
- name: FGF14 repeat sizing by long-range PCR with long-read confirmation
  description: >-
    Molecular diagnosis rests on sizing the intron 1 (GAA) repeat, usually by
    long-range and repeat-primed PCR. Because pathogenicity depends on the
    length of the longest pure GAA tract rather than total allele size,
    long-read sequencing (Nanopore or PacBio) is needed to resolve interrupting
    motifs accurately; short-read genome data can be screened with tools such
    as ExpansionHunter and STRling using outlier approaches.
  presence: Positive
  evidence:
  - reference: PMID:38271551
    reference_title: GAA-FGF14-Related Ataxia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The diagnosis of GAA-FGF14-related ataxia is established in a
      symptomatic individual with a compatible phenotype by the identification
      of a heterozygous (GAA)>300 repeat expansion in intron 1 of FGF14 by
      molecular genetic testing.
    explanation: GeneReviews diagnostic criterion.
  - reference: PMID:40379261
    reference_title: "FGF14 repeat length and mosaic interruptions: modifiers of spinocerebellar ataxia 27B?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      long-read sequencing is required to detect complex repeat interruptions
      accurately
    explanation: Supports the requirement for long-read confirmation.
  - reference: PMID:39227614
    reference_title: Identification and characterisation of pathogenic and non-pathogenic FGF14 repeat expansions.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      we demonstrate that STRling and ExpansionHunter accurately detect FGF14
      expansions from short-read genome data using outlier approaches
    explanation: >-
      Supports short-read screening as a first-pass detection route. Evidence
      source is COMPUTATIONAL because the claim concerns performance of
      bioinformatic repeat-detection algorithms.

differential_diagnoses:
- name: CANVAS
  description: >-
    RFC1-related CANVAS (cerebellar ataxia, neuropathy, vestibular areflexia
    syndrome) is the closest clinical mimic and the most important
    differential in practice. Both are late-onset ataxias that combine
    cerebellar signs with vestibular hypofunction and sensory/afferent
    deficits, so the two are separated by genotype rather than by phenotype:
    CANVAS is autosomal recessive, caused by a biallelic intronic (AAGGG)n
    expansion in RFC1, whereas SCA27B is autosomal dominant and caused by a
    heterozygous intronic (GAA)n expansion in FGF14. The FGF14 expansion was
    explicitly identified as an alternative genetic cause in patients with
    CANVAS-like syndromes who test negative for biallelic RFC1 expansions, so
    a negative RFC1 result in a CANVAS-like presentation should prompt FGF14
    repeat sizing rather than closing the workup.
  distinguishing_features:
  - Autosomal recessive biallelic RFC1 (AAGGG)n expansion, versus autosomal dominant heterozygous FGF14 (GAA)n expansion
  - Prominent sensory neuronopathy and chronic cough are characteristic of CANVAS but not of SCA27B
  - Episodic ataxia and a marked 4-aminopyridine response point towards SCA27B
  disease_term:
    preferred_term: cerebellar ataxia with neuropathy and bilateral vestibular areflexia syndrome
    term:
      id: MONDO:0044720
      label: cerebellar ataxia with neuropathy and bilateral vestibular areflexia syndrome
  evidence:
  - reference: PMID:36493768
    reference_title: An intronic GAA repeat expansion in FGF14 causes the autosomal-dominant adult-onset ataxia SCA50/ATX-FGF14.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      provides an alternative genetic cause in individuals with CANVAS-like
      syndromes negative for bi-allelic
    explanation: >-
      Establishes SCA27B as the alternative diagnosis to pursue in
      RFC1-negative CANVAS-like presentations, which is exactly why the two
      belong together as differentials. Quoted as an exact substring of the
      cached full text; the sentence continues "RFC1 RE", rendered without
      spacing in the cached PDF extraction.

- name: Spinocerebellar ataxia 27A
  description: >-
    SCA27A (MONDO:0008654, OMIM:609307) is caused by FGF14 coding point
    variants (classically the F145S missense) rather than the intronic repeat.
    It shares the gene and, in some families, the episodic ataxia and downbeat
    nystagmus, but presents in childhood. Distinguishing the two is essential
    because literature about one does not transfer to the other.
  distinguishing_features:
  - Coding point variant in FGF14 rather than an intronic GAA repeat expansion
  - Childhood rather than sixth-decade onset
  disease_term:
    preferred_term: Spinocerebellar ataxia 27A
    term:
      id: MONDO:0008654
      label: spinocerebellar ataxia 27A
  evidence:
  - reference: PMID:39227614
    reference_title: Identification and characterisation of pathogenic and non-pathogenic FGF14 repeat expansions.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      similar to the presentation observed in a family with a previously
      unreported nonsense variant (SCA27A)
    explanation: >-
      Confirms that SCA27A is a separate, coding-variant entity whose
      presentation overlaps SCA27B.
  - reference: PMID:18930825
    reference_title: FGF14 regulates the intrinsic excitability of cerebellar Purkinje neurons.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      A missense mutation in the fibroblast growth factor 14 (FGF14) gene
      underlies SCA27, an autosomal dominant spinocerebellar ataxia in humans.
    explanation: >-
      Documents the coding missense basis of the originally described SCA27
      (now SCA27A). Evidence source is OTHER because this is background framing
      rather than a result of the reported experiments.

treatments:
- name: 4-Aminopyridine
  description: >-
    4-Aminopyridine (4-AP), a voltage-gated potassium channel blocker, is the
    principal symptomatic therapy for SCA27B and is the mechanistically
    rational choice: it does not increase inhibitory drive onto Purkinje cells
    but restores the precision of Purkinje pacemaking by prolonging the action
    potential and increasing the afterhyperpolarization, counteracting the
    firing failure caused by FGF14 loss. Across cohorts, 75-86% of treated
    patients report clinically meaningful benefit, and placebo-controlled
    video-oculography in a small number of expansion carriers showed a
    significant reduction in downbeat nystagmus slow-phase velocity on 4-AP but
    not placebo. Formal randomised trials in genetically defined SCA27B are
    still awaited.
  therapeutic_modality: SMALL_MOLECULE
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: 4-aminopyridine
      term:
        id: CHEBI:34385
        label: 4-aminopyridine
  target_phenotypes:
  - preferred_term: Downbeat nystagmus
    term:
      id: HP:0010545
      label: Downbeat nystagmus
  - preferred_term: Gait ataxia
    term:
      id: HP:0002066
      label: Gait ataxia
  target_mechanisms:
  - target: Impaired Purkinje Neuron Intrinsic Excitability and Firing
    treatment_effect: RESTORES
    description: >-
      Blockade of Kv1-family potassium channels prolongs the Purkinje action
      potential and deepens the afterhyperpolarization, restoring the precision
      of pacemaking that is degraded when FGF14 loss shifts Nav steady-state
      inactivation.
    evidence:
    - reference: PMID:20505092
      reference_title: The therapeutic mode of action of 4-aminopyridine in cerebellar ataxia.
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: >-
        4-AP restores the severely diminished precision of pacemaking in
        Purkinje cells of EA2 mutant mice by prolonging the action potential
        and increasing the action potential afterhyperpolarization
      explanation: >-
        Defines the mechanism of action of 4-AP at the Purkinje pacemaking
        node. Classified PARTIAL because the model is EA2 (a P/Q-type calcium
        channelopathy) rather than FGF14 deficiency, so this supports the
        drug-target mechanism generically rather than demonstrating it in
        FGF14-deficient neurons.
  evidence:
  - reference: PMID:37165652
    reference_title: "GAA-FGF14 ataxia (SCA27B): phenotypic profile, natural history progression and 4-aminopyridine treatment response."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A treatment response to 4-AP with relevance for everyday living was
      reported by 86% of treated patients.
    explanation: Quantifies real-world treatment response in a genetically defined cohort.
  - reference: PMID:37165652
    reference_title: "GAA-FGF14 ataxia (SCA27B): phenotypic profile, natural history progression and 4-aminopyridine treatment response."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A series of three prospective n-of-1 treatment experiences with on/off
      design showed marked reduction in daily symptomatic time and symptom
      severity on 4-AP.
    explanation: Provides prospective on/off within-patient evidence of benefit.
  - reference: PMID:38507876
    reference_title: "GAA-FGF14 disease: defining its frequency, molecular basis, and 4-aminopyridine response in a large downbeat nystagmus cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Placebo-controlled video-oculography data, available for four patients
      carrying an FGF14 (GAA)≥250 expansion, showed a significant decrease in
      slow phase velocity of DBN with 4-aminopyridine, but not placebo.
    explanation: >-
      The only placebo-controlled objective evidence to date, though in only
      four expansion carriers.
  - reference: PMID:39263992
    reference_title: Clinical, Radiological and Pathological Features of a Large American Cohort of Spinocerebellar Ataxia (SCA27B).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Similar to European populations, a high percent of patients 21/28 (75%)
      reported a positive treatment response with 4-aminopyridine.
    explanation: Independent replication of the response rate in a US cohort.
  notes: >-
    Response rates are drawn from retrospective and open-label real-world data
    plus a very small placebo-controlled video-oculography subset; they are not
    equivalent to randomised trial efficacy. 4-AP at higher concentrations
    blocks a broad range of potassium channels and is proconvulsant.

- name: Avoidance of episode triggers
  description: >-
    Patients should be informed that alcohol intake and strenuous physical
    activity may precipitate episodes of ataxia and worsen incoordination, and
    that medications with known cerebellar or vestibular toxicity should be
    avoided.
  therapeutic_modality: BEHAVIORAL
  action_category: COUNSELING_INFORMATIONAL
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:38271551
    reference_title: GAA-FGF14-Related Ataxia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Inform affected individuals that alcohol intake and strenuous physical
      activity may precipitate episodes of ataxia and may exacerbate
      incoordination. Avoid medications with known toxicity to the cerebellum
      and the vestibular system.
    explanation: >-
      GeneReviews "Agents/circumstances to avoid" guidance, quoted verbatim.

- name: Multidisciplinary rehabilitation
  description: >-
    There is no cure or disease-modifying therapy. Management aims to improve
    quality of life, maximise function, and reduce complications through
    multidisciplinary care including physical therapy, occupational therapy,
    and speech-language therapy.
  therapeutic_modality: BEHAVIORAL
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: Physical Therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  evidence:
  - reference: PMID:38271551
    reference_title: GAA-FGF14-Related Ataxia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      This ideally involves multidisciplinary care by specialists in relevant
      fields, such as neurologists, ophthalmologists, orthoptists, physical
      therapists, occupational therapists, speech-language therapists, and
      psychologists.
    explanation: GeneReviews management recommendation.

- name: Genetic counseling
  description: >-
    Counseling should cover the autosomal dominant 50% transmission risk, the
    age-dependent and incomplete penetrance of shorter expansions, and the
    intergenerational instability of the repeat (expansion on maternal, and
    contraction on paternal, transmission). Predictive and prenatal testing are
    technically possible but prognostically limited: clinical manifestations
    cannot be predicted from a fetal repeat size, and prenatal somatic
    instability is not characterised.
  therapeutic_modality: OTHER
  action_category: COUNSELING_INFORMATIONAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:38271551
    reference_title: GAA-FGF14-Related Ataxia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      accurate prediction of future possible clinical manifestations in a
      fetus found to have an FGF14 GAA repeat expansion is not possible, and
      the current lack of knowledge regarding somatic instability of the repeat
      prenatally makes the interpretation of prenatal genetic test results
      challenging
    explanation: >-
      GeneReviews statement of the counseling limitations around predictive and
      prenatal testing.

discussions:
- discussion_id: sca27b_pathogenic_threshold
  prompt: >-
    What is the true pathogenic threshold for the FGF14 intronic GAA
    expansion, and how should length and motif purity be combined into a
    single interpretive rule?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#FGF14 Intronic GAA Repeat Expansion
  rationale: >-
    Every major cohort has proposed a different cut-off. The discovery study
    supported (GAA)>=250 from family cosegregation; an independent
    Australian/German cohort concluded (GAA)>335 is fully penetrant with
    (GAA)>250 likely pathogenic at reduced penetrance; GeneReviews adopts
    (GAA)>300 for a definitive diagnosis with a 250-300 reduced-penetrance
    zone; a downbeat-nystagmus cohort found (GAA)200-249 alleles enriched
    15-fold over controls with an indistinguishable phenotype; and long-read
    work argues that once the repeat is known to be uninterrupted, enrichment
    begins at 180-200 repeats. The disagreement is not merely statistical: it
    reflects that total allele length is the wrong variable. The pathogenically
    relevant quantity appears to be the longest pure GAA tract, since
    GAAGGA/AAGGAG hexameric expansions are equally common in patients and
    controls, and mosaic interruptions that shorten the pure tract are enriched
    in unaffected carriers. No consensus interpretive rule combining these
    dimensions exists, so laboratories currently report the same allele
    differently.
  proposed_experiments:
  - experiment_id: exp_sca27b_motif_aware_threshold
    name: Motif-aware case-control threshold derivation by long-read sequencing
    description: >-
      Long-read resequencing of a large multi-ancestry case-control set,
      reporting the longest pure GAA tract rather than total allele size, to
      derive a motif-aware pathogenic threshold with calibrated penetrance
      estimates.
    decision_criterion: >-
      A motif-aware rule is preferable to a length-only rule if pure-tract
      length separates cases from controls with materially higher accuracy than
      total allele length in held-out cohorts.
  - experiment_id: exp_sca27b_carrier_penetrance_cohort
    name: Prospective penetrance follow-up of intermediate-range carriers
    description: >-
      Prospective longitudinal follow-up of asymptomatic carriers of
      200-300-repeat alleles to measure age-dependent penetrance directly
      rather than inferring it from cross-sectional case-control enrichment.
    decision_criterion: >-
      Age-stratified conversion rates would establish whether the 200-300 zone
      is genuinely reduced-penetrance pathogenic or simply a common
      non-pathogenic polymorphism enriched by ascertainment.
  - experiment_id: exp_sca27b_somatic_mosaicism_tissue
    name: Cerebellum-versus-blood somatic repeat mosaicism
    description: >-
      Systematic assay of somatic repeat mosaicism in cerebellum versus blood
      from the same individuals, since a blood-derived repeat size may not
      represent the size present in the pathogenically relevant tissue.
    decision_criterion: >-
      Substantial cerebellum-specific somatic expansion would explain why
      blood-based thresholds disagree across cohorts and would argue for
      tissue-adjusted interpretation.
  evidence:
  - reference: PMID:36493768
    reference_title: An intronic GAA repeat expansion in FGF14 causes the autosomal-dominant adult-onset ataxia SCA50/ATX-FGF14.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      while (GAA)>250 is likely pathogenic with reduced penetrance
    explanation: One of the several competing threshold definitions in the literature.
  - reference: PMID:38507876
    reference_title: "GAA-FGF14 disease: defining its frequency, molecular basis, and 4-aminopyridine response in a large downbeat nystagmus cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It provides preliminary evidence that (GAA)200-249 alleles might be
      pathogenic.
    explanation: >-
      Extends candidate pathogenicity below the previously accepted cut-off,
      widening rather than resolving the uncertainty.
  - reference: PMID:39227614
    reference_title: Identification and characterisation of pathogenic and non-pathogenic FGF14 repeat expansions.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We strongly recommend re-evaluating pathogenic thresholds and
      integrating expansion sequencing into the molecular diagnostic process.
    explanation: >-
      The authors themselves call the current thresholds into question and ask
      for motif-aware reinterpretation.
  - reference: PMID:40379261
    reference_title: "FGF14 repeat length and mosaic interruptions: modifiers of spinocerebellar ataxia 27B?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Five ataxia patients with interruptions still had a remaining pure GAA
      expansion <200.
    explanation: >-
      Shows that even a motif-purity-corrected rule does not cleanly separate
      patients from unaffected carriers, so the gap remains open.

- discussion_id: sca27b_intronic_repeat_to_expression_route
  prompt: >-
    By what molecular route does the intronic GAA expansion reduce FGF14
    expression - transcriptional elongation blockade, R-loop formation,
    repressive chromatin, or another mechanism?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#FGF14 Intronic GAA Repeat Expansion
  - pathophysiology#Reduced FGF14 Expression in Cerebellar Neurons
  rationale: >-
    Reduced FGF14 RNA and protein have been demonstrated in patient postmortem
    cerebellum and patient-derived neurons, and the pathogenic tract is a GAA
    repeat in the first intron - the same sequence and genomic context as the
    FXN intron 1 expansion in Friedreich ataxia, where heterochromatin
    formation and transcriptional silencing are established. Whether SCA27B
    uses the same machinery, however, has not been shown. Until it is, the
    causal edge from expansion to reduced expression carries unknown
    intermediates, and a whole class of candidate therapeutic strategies
    (transcriptional de-repression, HDAC inhibition, R-loop modulation) cannot
    be rationally prioritised.
  proposed_experiments:
  - experiment_id: exp_sca27b_fgf14_locus_chromatin
    name: Chromatin and methylation profiling of the FGF14 locus
    description: >-
      Chromatin state and DNA methylation profiling across the FGF14 locus in
      expansion-carrier versus control cerebellum and in iPSC-derived
      Purkinje-like neurons.
    decision_criterion: >-
      Repressive chromatin marks or hypermethylation spreading from the repeat
      in carriers would implicate the Friedreich-ataxia-like silencing
      mechanism.
  - experiment_id: exp_sca27b_nascent_transcription
    name: Nascent-transcription analysis for elongation stalling at the repeat
    description: >-
      PRO-seq or TT-seq analysis of expansion-carrier versus control neurons to
      test whether RNA polymerase II stalls within FGF14 intron 1 at the GAA
      tract.
    decision_criterion: >-
      A carrier-specific drop in nascent transcription immediately downstream
      of the repeat would establish elongation blockade as the route.
  - experiment_id: exp_sca27b_rloop_drip
    name: R-loop mapping at the FGF14 intron 1 tract
    description: >-
      DRIP-seq for R-loop accumulation at the FGF14 intron 1 GAA tract in
      carrier versus control cells.
    decision_criterion: >-
      Carrier-specific R-loop enrichment at the repeat would implicate
      co-transcriptional R-loop formation and nominate R-loop-directed
      therapeutics.
  - experiment_id: exp_sca27b_derepression_rescue
    name: Test of transcriptional de-repression agents on FGF14 expression
    description: >-
      Test whether transcriptional de-repression agents with efficacy in
      Friedreich ataxia models (for example HDAC inhibitors) restore FGF14 RNA
      and protein in patient-derived neurons.
    decision_criterion: >-
      Restoration of FGF14 expression would both confirm a silencing mechanism
      and identify a repurposable therapeutic class.
  evidence:
  - reference: PMID:36516086
    reference_title: Deep Intronic FGF14 GAA Repeat Expansion in Late-Onset Cerebellar Ataxia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Postmortem cerebellum specimens and iPSC-derived motor neurons from
      patients showed reduced expression of FGF14 RNA and protein.
    explanation: >-
      Establishes the endpoint (reduced expression) without establishing the
      route, which is precisely the gap.

- discussion_id: sca27b_firing_failure_versus_cell_loss
  prompt: >-
    Is the clinical deficit in SCA27B driven primarily by reversible Purkinje
    firing failure or by irreversible Purkinje neuron loss, and does that
    balance shift over the disease course?
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired Purkinje Neuron Intrinsic Excitability and Firing
  - pathophysiology#Purkinje Neuron Degeneration and Cerebellar Atrophy
  rationale: >-
    Several observations point towards a functional rather than degenerative
    dominant mechanism: the striking episodic phase, the rapid and substantial
    response to 4-aminopyridine, the mild SARA progression rate with a plateau
    at moderate severity, and serum neurofilament light that is not elevated
    relative to controls. Against that, autopsy in genetically confirmed cases
    shows definite Purkinje neuron loss. If the deficit is largely a reversible
    channel-availability problem for much of the disease course, that has
    direct consequences for trial endpoint choice (symptomatic versus
    disease-modifying), for the therapeutic window, and for whether restoring
    FGF14 expression late in disease could help.
  proposed_experiments:
  - experiment_id: exp_sca27b_longitudinal_nfl_volumetry
    name: Longitudinal neurofilament light and cerebellar volumetry
    description: >-
      Longitudinal serum and CSF neurofilament light measurement plus
      cerebellar volumetry in a genetically defined SCA27B cohort, testing
      whether a degenerative signal emerges at a definable disease stage.
    decision_criterion: >-
      A stage-dependent rise in neurofilament light with accelerating volume
      loss would mark the transition from functional to degenerative
      pathophysiology and define the therapeutic window.
  - experiment_id: exp_sca27b_purkinje_counts_duration
    name: Quantitative Purkinje cell counts stratified by disease duration
    description: >-
      Quantitative Purkinje cell counts correlated with disease duration across
      a larger SCA27B autopsy series than the four brains reported to date.
    decision_criterion: >-
      Substantial Purkinje loss in short-duration cases would favour early
      degeneration; preserved counts in short-duration cases would favour a
      primarily functional early phase.
  - experiment_id: exp_sca27b_ipsc_purkinje_rescue
    name: Rescue electrophysiology in patient-derived Purkinje-like neurons
    description: >-
      Electrophysiological characterisation of iPSC-derived Purkinje-like
      neurons from expansion carriers, testing whether restoring FGF14
      expression or applying 4-aminopyridine rescues firing independently of
      any effect on survival.
    decision_criterion: >-
      Full firing rescue without a survival effect would establish the deficit
      as functional and reversible at the cellular level.
  evidence:
  - reference: PMID:37165652
    reference_title: "GAA-FGF14 ataxia (SCA27B): phenotypic profile, natural history progression and 4-aminopyridine treatment response."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Corresponding to slow progression and low extra-cerebellar involvement,
      sNfL was not increased relative to controls.
    explanation: >-
      Absence of a neuroaxonal damage biomarker signal argues for a largely
      functional deficit.
  - reference: PMID:39263992
    reference_title: Clinical, Radiological and Pathological Features of a Large American Cohort of Spinocerebellar Ataxia (SCA27B).
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The principal finding on post-mortem examination of 4 brain specimens
      was loss of Purkinje neurons that was most severe in the vermis most
      particularly in the anterior vermis.
    explanation: >-
      Establishes that genuine neuron loss does occur, counterbalancing the
      purely functional interpretation; PARTIAL because four brains without
      quantitative counts or duration stratification cannot settle the balance.


      deliberately omitted: the quoted figure describes the episodic phase, not
      the overall prevalence of limb ataxia.

- category: Neurological
  name: Episodic ataxia
  description: >-
    Roughly half of patients experience discrete episodes of ataxia, vertigo,
    dysarthria, and visual disturbance for two to four years before
    progressive ataxia begins; episodes may persist afterwards and are commonly
    triggered by alcohol intake and physical exertion. Episodic onset is a
    strong diagnostic pointer to SCA27B in an undiagnosed late-onset ataxia
    patient.
  phenotype_term:
    preferred_term: Episodic ataxia
    term:
      id: HP:0002131
      label: Episodic ataxia
    temporality: RECURRENT
  frequency: FREQUENT
  diagnostic: true
  evidence:
  - reference: PMID:39263992
    reference_title: Clinical, Radiological and Pathological Features of a Large American Cohort of Spinocerebellar Ataxia (SCA27B).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we found that SCA27B was a late-onset (57 ± 12.5 years) slowly
      progressive ataxia with an episodic component in 51% of patients
    explanation: >-
      Direct quantitative support for both the phenotype and the FREQUENT band
      (51% falls in the 30-79% HPO range) in a 102-patient cohort.
  - reference: PMID:39263992
    reference_title: Clinical, Radiological and Pathological Features of a Large American Cohort of Spinocerebellar Ataxia (SCA27B).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Testing for SCA27B should be considered in all undiagnosed ataxia

name: Spinocerebellar ataxia 27B
creation_date: "2026-07-31T00:00:00Z"
category: Mendelian
synonyms:
- SCA27B
- GAA-FGF14 ataxia
- GAA-FGF14 disease
- GAA-FGF14-related ataxia
- SCA50
- ATX-FGF14
description: >-
  Spinocerebellar ataxia 27B (SCA27B), also called GAA-FGF14 ataxia, is an
  autosomal dominant, mid- to late-adult-onset, slowly progressive cerebellar
  syndrome caused by a deep intronic (GAA) repeat expansion in intron 1 of
  FGF14. First reported in 2022-2023, it has rapidly emerged as one of the most
  common genetic causes of late-onset cerebellar ataxia, accounting for a
  substantial fraction of previously undiagnosed adult-onset ataxia cohorts.
  Median age at onset is about 57-60 years. The clinical core is a
  pancerebellar syndrome with gait ataxia, cerebellar oculomotor signs (notably
  downbeat nystagmus), and dysarthria, frequently preceded for years by
  episodic ataxia, vertigo, and visual disturbance. Mechanistically the
  expansion reduces FGF14 expression; FGF14 is an intracellular fibroblast
  growth factor (iFGF/FHF) that binds voltage-gated sodium channels at the
  Purkinje neuron axon initial segment and is required for normal spontaneous
  and repetitive Purkinje firing, so its loss degrades cerebellar cortical
  output and, over time, is accompanied by Purkinje neuron loss. SCA27B is
  notable as a treatable ataxia: a large majority of patients report meaningful
  symptomatic benefit from 4-aminopyridine.

  SCA27B is a distinct disease entity from SCA27A (MONDO:0008654,
  OMIM:609307), which is caused by FGF14 coding point variants and presents in
  childhood; the two share a gene but not a mutational mechanism, onset, or
  natural history.

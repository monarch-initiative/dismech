imaging_findings:
- name: Cerebellar atrophy on brain MRI
  modality: MRI
  description: >-
    Brain MRI shows regional cerebellar atrophy in a substantial minority of
    patients, concordant with the anterior-vermis-predominant Purkinje cell
    loss seen at autopsy. Critically, a normal MRI does not exclude the
    diagnosis: in the Australian discovery cohort only five of thirteen
    expansion carriers had visible cerebellar atrophy despite a mean 8.5 years
    of symptoms, so imaging is a poor rule-out test and molecular repeat
    sizing should be pursued regardless.
  phenotype_term:
    preferred_term: Cerebellar atrophy
    term:
      id: HP:0001272
      label: Cerebellar atrophy
  frequency: FREQUENT
  located_in:
    preferred_term: cerebellum
    term:
      id: UBERON:0002037
      label: cerebellum
  evidence:
  - reference: PMID:36493768
    reference_title: An intronic GAA repeat expansion in FGF14 causes the autosomal-dominant adult-onset ataxia SCA50/ATX-FGF14.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All displayed a range of clinical ataxic phenomena, with MRI scanning
      revealing cerebellar atrophy in five of the 13
    explanation: >-
      Direct quantitative support for both the finding and the FREQUENT band
      (5/13 = 38%, within the 30-79% HPO range), and for the point that most
      expansion carriers in this cohort had no visible atrophy.
  - reference: PMID:36493768
    reference_title: An intronic GAA repeat expansion in FGF14 causes the autosomal-dominant adult-onset ataxia SCA50/ATX-FGF14.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-

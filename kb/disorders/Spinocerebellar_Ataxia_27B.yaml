  downstream:
  - target: Reduced FGF14 Expression in Cerebellar Neurons
    description: >-
      Expansion of the intronic GAA tract beyond the pathogenic threshold
      reduces FGF14 RNA and protein levels in patient cerebellum and in
      patient-derived neurons.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:36516086
      reference_title: Deep Intronic FGF14 GAA Repeat Expansion in Late-Onset Cerebellar Ataxia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Postmortem cerebellum specimens and iPSC-derived motor neurons from
        patients showed reduced expression of FGF14 RNA and protein.
      explanation: >-
        Links the expansion directly to reduced FGF14 expression in patient
        tissue. The intervening molecular steps (the transcriptional or
        epigenetic route from an intronic GAA tract to reduced expression) are
        not established in FGF14, hence INDIRECT_UNKNOWN_INTERMEDIATES.

- name: Reduced FGF14 Expression in Cerebellar Neurons
  description: >-
    The expanded allele is expressed at reduced level, producing functional
    FGF14 haploinsufficiency in cerebellar neurons. FGF14 is an intracellular
    fibroblast growth factor (iFGF/FGF homologous factor) that is not secreted
    and does not signal through FGF receptors; it acts intracellularly as a
    binding partner and regulator of voltage-gated sodium channels. Reduced
    FGF14 RNA and protein have been demonstrated in postmortem patient
    cerebellum and in patient-derived iPSC neurons.

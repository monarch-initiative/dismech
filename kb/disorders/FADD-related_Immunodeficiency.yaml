      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "viral infections result from impaired interferon immunity"
      explanation: >-
        The causal statement for the viral arm.
- name: Recurrent Severe Infection
  biological_scale: ORGANISM
  role: consequence
  description: >-
    Severe bacterial and viral disease, arriving by two mechanistically distinct
    routes that converge on the same clinical picture. Febrile infection is also
    the trigger for the encephalopathic crises, so infection is both a
    consequence of the immune defect and the precipitant of the neurological one.
  evidence:
  - reference: PMID:21109225
    reference_title: "Whole-exome-sequencing-based discovery of human FADD deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "biological features of ALPS were found in the context of severe bacterial and viral disease"
    explanation: >-
      Establishes the severity and the dual bacterial/viral character of the
      infection phenotype.
  downstream:
  - target: Recurrent Febrile Encephalopathic Crises
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Febrile illness precipitates the encephalopathic episodes; whether it does
      so through inflammation, through the cell-death defect, or both is the
      subject of an open discussion in this entry.
    evidence:
    - reference: PMID:32350755
      reference_title: "Novel Compound Heterozygote Variations in FADD Identified to Cause FAS-Associated Protein with Death Domain Deficiency."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "but also recurrent febrile episodes with encephalopathy and seizures"
      explanation: >-
        Classified PARTIAL: establishes the febrile-episode association without
        demonstrating the mechanism by which fever precipitates encephalopathy.
- name: Recurrent Febrile Encephalopathic Crises
  biological_scale: ORGANISM
  role: consequence
  description: >-
    Stereotyped, recurrent episodes of febrile encephalopathy with refractory
    seizures, which in one family met the criteria for febrile
    infection-related epilepsy syndrome. These crises carry much of the
    disorder's mortality and are what most distinguishes it from the ALPS
    spectrum clinically. The FIRES observation is doubly interesting: it
    supplies a genetic cause for a syndrome usually of unknown aetiology, and
    it points at a cell-death regulatory pathway rather than at a channel.
  evidence:
  - reference: PMID:38752438
    reference_title: "FADD gene pathogenic variants causing recurrent febrile infection-related epilepsy syndrome: Case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We hereby report the clinical, EEG, brain MRI, and genetic findings of a nuclear family with recurrent febrile-related encephalopathy with refractory de novo Status Epilepticus."
    explanation: >-
      Describes the crises and their refractory character in a reported family.
  - reference: PMID:38752438
    reference_title: "FADD gene pathogenic variants causing recurrent febrile infection-related epilepsy syndrome: Case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The FADD-related conditions disrupt FAS-mediated apoptosis and can cause a clinical picture with the characteristics of FIRES."
    explanation: >-
      Establishes the FIRES framing and the authors' attribution of it to the
      apoptosis defect.

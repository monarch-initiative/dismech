name: FADD-Related Immunodeficiency
creation_date: "2026-08-24T00:00:00Z"
description: >-
  FADD deficiency is an ultra-rare autosomal recessive disorder of the adaptor
  protein that nucleates the death-inducing signalling complex downstream of
  FAS. Because FADD sits at a branch point rather than on a single pathway, the
  disease is not simply an ALPS phenocopy: patients have the ALPS biomarker
  profile (impaired Fas-dependent lymphocyte apoptosis, expanded
  double-negative T cells) without the florid lymphoproliferation, and in
  addition carry features no FAS-pathway disorder produces — recurrent
  stereotyped febrile encephalopathic crises with refractory status epilepticus,
  hepatopathy, cardiac malformations, and a functional hyposplenism that drives
  invasive encapsulated-organism infection. The founding study attributed the
  bacterial infections to hyposplenism and the viral infections to impaired
  interferon immunity, making this one of the clearest human demonstrations that
  FADD has essential Fas-independent functions.
category: Mendelian
parents:
- autosomal recessive disease
- primary immunodeficiency disease
synonyms:
- FADD deficiency
- FAS-associated death domain protein deficiency
- infections, recurrent, with encephalopathy, hepatic dysfunction, and cardiovascular malformations
disease_term:
  preferred_term: FADD-related immunodeficiency
  term:
    id: MONDO:0013408
    label: FADD-related immunodeficiency
classifications:
  harrisons_chapter:
  - classification_value: IMMUNE_RHEUMATOLOGIC
    notes: >-
      Placed with the immune disorders because the immunodeficiency and the
      lymphocyte-apoptosis defect are the defining axis, even though the
      encephalopathic crises carry much of the mortality. Harrison's does not
      list FADD deficiency by name; this is a mechanism-based placement.
inheritance:
- name: Autosomal recessive inheritance
  description: >-
    FADD deficiency is autosomal recessive. The founding kindred was large,
    consanguineous and multiplex, homozygous for a missense allele; compound
    heterozygous patients have since been reported. A separate route to the
    phenotype exists in which a germline monoallelic FADD mutation is
    unmasked somatically — see the genetic section.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  expressivity: VARIABLE
  evidence:
  - reference: PMID:21109225
    reference_title: "Whole-exome-sequencing-based discovery of human FADD deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We investigated a large, consanguineous, multiplex kindred in which biological features of ALPS were found in the context of severe bacterial and viral disease, recurrent hepatopathy and encephalopathy, and cardiac malformations."
    explanation: >-
      Establishes the consanguineous multiplex pedigree structure consistent
      with recessive inheritance, and enumerates the multisystem phenotype.
  - reference: PMID:32350755
    reference_title: "Novel Compound Heterozygote Variations in FADD Identified to Cause FAS-Associated Protein with Death Domain Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "is an autosomal recessive disorder resulting from a pathogenic variation in F ADD(FAS-associated protein with death do- main), the adaptor protein involved in Fas signaling to caspases 8 and 10"
    explanation: >-
      States the inheritance mode directly. The spacing in "F ADD" is how the
      text extracts from the cached PDF and is quoted as it appears.
pathophysiology:
- name: Biallelic FADD Loss of Function
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    FADD is a small bipartite adaptor: a death effector domain that recruits
    procaspase-8 and -10, and a death domain that binds the death domain of a
    ligated receptor. It carries no catalytic activity of its own, so the
    disease is a failure of assembly rather than of enzymology. The reported
    disease alleles reduce steady-state FADD protein rather than abolishing it,
    which matters because complete Fadd loss is embryonic lethal in mice —
    surviving patients are therefore expected to retain residual function.
  genes:
  - preferred_term: FADD
    term:
      id: hgnc:3573
      label: FADD
  evidence:
  - reference: PMID:21109225
    reference_title: "Whole-exome-sequencing-based discovery of human FADD deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified a homozygous missense mutation in FADD, encoding the Fas-associated death domain protein (FADD), in the patients. This FADD mutation decreases steady-state protein levels and impairs Fas-dependent apoptosis in vitro"
    explanation: >-
      Establishes the causal variant and its molecular consequence — reduced
      protein level rather than absence, which is the basis for the residual
      function claim.
  - reference: PMID:32350755
    reference_title: "Novel Compound Heterozygote Variations in FADD Identified to Cause FAS-Associated Protein with Death Domain Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the adaptor protein involved in Fas signaling to caspases 8 and 10"
    explanation: >-
      States the adaptor role and the caspases recruited, which is the function
      lost at this node.
  downstream:
  - target: Impaired Death-Receptor Apoptotic Signalling
    causal_link_type: DIRECT
    description: >-
      Without the adaptor, the death-inducing signalling complex cannot be
      assembled on a ligated receptor.
    evidence:
    - reference: PMID:21109225
      reference_title: "Whole-exome-sequencing-based discovery of human FADD deficiency."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "This FADD mutation decreases steady-state protein levels and impairs Fas-dependent apoptosis in vitro"
      explanation: >-
        Directly links the variant to the loss of Fas-dependent apoptosis.
  - target: Loss of Fas-Independent FADD Functions
    causal_link_type: DIRECT
    description: >-
      The same loss of adaptor also removes FADD's functions outside the Fas
      pathway, which is what makes this disease more than an ALPS phenocopy.
    evidence:
    - reference: PMID:21109225
      reference_title: "Whole-exome-sequencing-based discovery of human FADD deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "It also impairs Fas-independent signaling pathways."
      explanation: >-
        The explicit statement that the defect is not confined to Fas
        signalling, which is the justification for a parallel arm here.
- name: Impaired Death-Receptor Apoptotic Signalling
  biological_scale: MOLECULAR
  role: central_effector
  description: >-
    FADD is obligate for assembling the death-inducing signalling complex
    downstream of FAS and other death-domain receptors: its death domain engages
    the receptor, its death effector domain recruits procaspase-8 and -10, and
    caspase activation follows. Losing the adaptor breaks the chain at the
    nucleation step, so no amount of receptor ligation produces apoptosis.
  biological_processes:
  - preferred_term: extrinsic apoptotic signaling pathway via death domain receptors
    term:
      id: GO:0008625
      label: extrinsic apoptotic signaling pathway via death domain receptors
    modifier: DECREASED
  - preferred_term: extrinsic apoptotic signaling pathway
    term:
      id: GO:0097191
      label: extrinsic apoptotic signaling pathway
    modifier: DECREASED
  evidence:
  - reference: PMID:21115735
    reference_title: "FADD deficiency impairs early hematopoiesis in the bone marrow."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "During apoptotic signaling induced by death receptors including Fas, FADD is required for the recruitment and activation of caspase 8."
    explanation: >-
      States the obligate adaptor requirement that this node represents.
      Evidence source is MODEL_ORGANISM because the paper's experimental work is
      in mice.
  - reference: PMID:21109225
    reference_title: "Whole-exome-sequencing-based discovery of human FADD deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "impairs Fas-dependent apoptosis in vitro, accounting for biological ALPS phenotypes in vivo"
    explanation: >-
      Connects the signalling defect to the ALPS-like laboratory phenotype
      observed in patients.
  downstream:
  - target: Failure of Activation-Induced Lymphocyte Apoptosis
    causal_link_type: DIRECT
    description: >-
      Activated lymphocytes that should be deleted by Fas ligation survive.
    evidence:
    - reference: PMID:21109225
      reference_title: "Whole-exome-sequencing-based discovery of human FADD deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "impairs Fas-dependent apoptosis in vitro, accounting for biological ALPS phenotypes in vivo"
      explanation: >-
        The authors' own attribution of the lymphocyte phenotype to the
        apoptosis defect.
- name: Failure of Activation-Induced Lymphocyte Apoptosis
  biological_scale: CELLULAR
  description: >-
    Lymphocytes that fail to undergo activation-induced death accumulate, and
    the readout is the ALPS biomarker panel: expanded circulating
    double-negative T cells, raised soluble Fas ligand, interleukin-10 and
    vitamin B12. What is notable is what does not follow. Patients do not
    develop the massive lymphadenopathy, splenomegaly and autoimmune cytopenias
    that define clinical ALPS — the biology is shared, the clinical syndrome is
    not, and the cited source explicitly separates FADD deficiency from ALPS-FAS
    on that basis.
  cell_types:
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  biological_processes:
  - preferred_term: extrinsic apoptotic signaling pathway via death domain receptors
    term:
      id: GO:0008625
      label: extrinsic apoptotic signaling pathway via death domain receptors
    modifier: DECREASED
  evidence:
  - reference: PMID:32350755
    reference_title: "Novel Compound Heterozygote Variations in FADD Identified to Cause FAS-Associated Protein with Death Domain Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Previously described FADD deficiency patients demonstrate a clinical phenotype partially overlap- ping with other ALPS disorders (decreased Fas-mediated lym- phocyte apoptosis, increased circulating double negative T cells, elevated soluble Fas ligand, IL-10, and vitamin B12)"
    explanation: >-
      Enumerates the full biomarker panel this node produces. The hyphenation
      is how the text extracts from the cached PDF and is quoted as it appears.
- name: Loss of Fas-Independent FADD Functions
  biological_scale: MOLECULAR
  description: >-
    The founding study reported that the patients' FADD mutation impairs
    Fas-independent signalling as well, and traced two of the disease's most
    consequential features to that arm rather than to apoptosis: the bacterial
    infections to functional hyposplenism, and the viral infections to impaired
    interferon immunity. This node is what separates FADD deficiency from the
    ALPS spectrum mechanistically, not just clinically.
  biological_processes:
  - preferred_term: type I interferon-mediated signaling pathway
    term:
      id: GO:0060337
      label: type I interferon-mediated signaling pathway
    modifier: DECREASED
  evidence:
  - reference: PMID:21109225
    reference_title: "Whole-exome-sequencing-based discovery of human FADD deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The observed bacterial infections result partly from functional hyposplenism, and viral infections result from impaired interferon immunity."
    explanation: >-
      The direct attribution of the two infection phenotypes to non-apoptotic
      mechanisms, quoted with the authors' own hedge ("partly") on the
      bacterial arm.
  - reference: PMID:21109225
    reference_title: "Whole-exome-sequencing-based discovery of human FADD deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings highlight the key role of FADD in Fas-dependent and Fas-independent signaling pathways in humans."
    explanation: >-
      Establishes the dual-arm framing that this entry's pathograph reproduces.
  downstream:
  - target: Functional Hyposplenism
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      How loss of FADD produces a hyposplenic state is not established; the
      association is reported, the mechanism is not.
    evidence:
    - reference: PMID:21109225

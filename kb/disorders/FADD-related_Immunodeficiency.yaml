      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "The observed bacterial infections result partly from functional hyposplenism"
      explanation: >-
        Classified PARTIAL: the source attributes the infections to
        hyposplenism, but does not demonstrate how FADD loss causes the
        hyposplenism itself.
  - target: Impaired Interferon Immunity
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The interferon defect is attributed to the Fas-independent arm.
    evidence:
    - reference: PMID:21109225
      reference_title: "Whole-exome-sequencing-based discovery of human FADD deficiency."

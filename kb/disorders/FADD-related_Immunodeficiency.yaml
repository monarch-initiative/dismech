    consequence of the immune defect and the precipitant of the neurological one.
  evidence:
  - reference: PMID:21109225
    reference_title: "Whole-exome-sequencing-based discovery of human FADD deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

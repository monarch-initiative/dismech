- name: Functional Hyposplenism
  biological_scale: ORGANISM
  description: >-
    The spleen is present but does not work. The practical consequence is the
    one that follows from any hyposplenic state — susceptibility to invasive
    infection with encapsulated organisms — and the practical marker is
    Howell-Jolly bodies on the blood film, which is why this is worth curating
    as its own node rather than folding into the immunodeficiency.
  evidence:
  - reference: PMID:21109225
    reference_title: "Whole-exome-sequencing-based discovery of human FADD deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The observed bacterial infections result partly from functional hyposplenism"
    explanation: >-
      Establishes the hyposplenic state and its role in the bacterial
      infections.
  downstream:
  - target: Recurrent Severe Infection
    causal_link_type: DIRECT
    description: >-
      Hyposplenism is a direct route to invasive encapsulated-organism disease.
    evidence:
    - reference: PMID:21109225
      reference_title: "Whole-exome-sequencing-based discovery of human FADD deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The observed bacterial infections result partly from functional hyposplenism"
      explanation: >-
        The causal statement, with the authors' own partial attribution
        preserved.
- name: Impaired Interferon Immunity
  biological_scale: CELLULAR
  description: >-
    The antiviral arm. FADD participates in innate antiviral signalling
    independently of its apoptotic role, and its loss leaves patients
    susceptible to severe viral disease alongside the bacterial susceptibility
    from hyposplenism.
  biological_processes:
  - preferred_term: type I interferon-mediated signaling pathway
    term:

- name: Recurrent Febrile Encephalopathic Crises
  biological_scale: ORGANISM
  role: consequence
  description: >-
    Stereotyped, recurrent episodes of febrile encephalopathy with refractory
    seizures, which in one family met the criteria for febrile
    infection-related epilepsy syndrome. These crises carry much of the
    disorder's mortality and are what most distinguishes it from the ALPS
    spectrum clinically. The FIRES observation is doubly interesting: it
    supplies a genetic cause for a syndrome usually of unknown aetiology, and
    it points at a cell-death regulatory pathway rather than at a channel.
  evidence:
  - reference: PMID:38752438
    reference_title: "FADD gene pathogenic variants causing recurrent febrile infection-related epilepsy syndrome: Case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We hereby report the clinical, EEG, brain MRI, and genetic findings of a nuclear family with recurrent febrile-related encephalopathy with refractory de novo Status Epilepticus."
    explanation: >-
      Describes the crises and their refractory character in a reported family.
  - reference: PMID:38752438

genetic:
- name: FADD
  gene_term:
    preferred_term: FADD
    term:
      id: hgnc:3573
      label: FADD
  association: Pathogenic Variants
  relationship_type: CAUSATIVE
  notes: >-
    FADD is the only gene implicated. Reported alleles are missense and
    truncating, and act by reducing steady-state protein rather than abolishing
    it. Two genetic routes to the phenotype are now recognized and should not be
    conflated: the classical biallelic germline route, and a second in which a
    germline monoallelic FADD mutation inherited from a healthy parent is
    rendered homozygous in the pathogenic double-negative T cell compartment by
    a somatic event — uniparental disomy — so that the disease-causing genotype
    exists only in the affected cells. Sequencing peripheral blood in the second
    situation can miss the diagnosis.
  evidence:
  - reference: PMID:21109225
    reference_title: "Whole-exome-sequencing-based discovery of human FADD deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "By a combination of genome-wide linkage and whole-exome sequencing, we identified a homozygous missense mutation in FADD, encoding the Fas-associated death domain protein (FADD), in the patients."
    explanation: >-
      The gene-discovery statement establishing FADD as causative.
  - reference: PMID:37793571
    reference_title: "Combined germline and somatic human FADD mutations cause autoimmune lymphoproliferative syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found homozygous FADD mutations in the DN T cells from all 4 patients, which resulted from uniparental disomy."
    explanation: >-
      Establishes the somatic second-hit route, in four unrelated patients, and
      names the mechanism. This is why the entry does not describe FADD disease
      as germline-only.
  - reference: PMID:37793571
    reference_title: "Combined germline and somatic human FADD mutations cause autoimmune lymphoproliferative syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We sought to identify whether a somatic event affecting the FAS-associated death domain (FADD) gene could be related to the disease onset in 4 unrelated patients with ALPS carrying a germline monoallelic mutation of the FADD protein inherited from a healthy parent."
    explanation: >-
      Describes the germline-plus-somatic architecture, including that the
      germline allele came from an unaffected parent — the reason a
      heterozygous parental result does not exclude the diagnosis.
  - reference: PMID:32350755
    reference_title: "Novel Compound Heterozygote Variations in FADD Identified to Cause FAS-Associated Protein with Death Domain Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a maternally inherited nonsense variant characterized by a 7 base-pair deletion (c.52_58delGACGAGC) predicted to severely truncate the protein, and a paternally inherited rare missense variant"
    explanation: >-
      A worked compound-heterozygous genotype pairing a truncating and a
      missense allele, establishing that allele class in trans.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Only a small number of families have been reported since the disorder was
    delineated in 2010 — a founding consanguineous kindred, subsequent compound
    heterozygous and single-family reports, and four patients with the somatic
    second-hit architecture. No pooled count and no population prevalence
    estimate has been published, so no number is asserted here.
  evidence:
  - reference: PMID:35243129
    reference_title: "Ocular findings associated with FADD deficiency resemble familial exudative vitreoretinopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Fas-associated protein with death domain (FADD) deficiency is a rare and severe genetic mutation characterized by recurrent infections, encephalopathy, cardiac abnormalities, and short life expectancy."
    explanation: >-
      Characterizes the disorder as rare and severe. Used to support the
      ULTRA_RARE band qualitatively; no count is claimed because none is
      published.
  - reference: PMID:32350755
    reference_title: "Novel Compound Heterozygote Variations in FADD Identified to Cause FAS-Associated Protein with Death Domain Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There are very few cases in the literature of FADD deficiency patients"
    explanation: >-
      Direct statement of the size of the reported literature, without
      converting it into a count this entry would then have to defend.
progression:
- phase: Infancy and early childhood
  notes: >-
    Presentation is in infancy or early childhood with infection and the first
    encephalopathic crises. Life expectancy is described as short, and the
    encephalopathic episodes carry much of the mortality.
  evidence:
  - reference: PMID:35243129
    reference_title: "Ocular findings associated with FADD deficiency resemble familial exudative vitreoretinopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "characterized by recurrent infections, encephalopathy, cardiac abnormalities, and short life expectancy"
    explanation: >-
      States the severity and shortened life expectancy of the disorder.
  - reference: PMID:32350755
    reference_title: "Novel Compound Heterozygote Variations in FADD Identified to Cause FAS-Associated Protein with Death Domain Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three of four patients from the original report died prior to 5 years old"
    explanation: >-
      Quantifies the early mortality in the founding kindred, which is what
      "short life expectancy" means concretely.
  - reference: PMID:32350755
    reference_title: "Novel Compound Heterozygote Variations in FADD Identified to Cause FAS-Associated Protein with Death Domain Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These patients seem to have worse outcomes than classical ALPS patients."
    explanation: >-
      Supports the prognostic contrast with ALPS, quoted with the hedge the
      authors used.
- phase: Episodic relapsing course
  notes: >-
    Between crises patients can be comparatively well; the course is
    relapsing and precipitated by febrile illness rather than steadily
    progressive. Expressivity varies — the Epilepsia report notes that its
    family widens the recognized phenotype.
  evidence:
  - reference: PMID:38752438
    reference_title: "FADD gene pathogenic variants causing recurrent febrile infection-related epilepsy syndrome: Case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "it increases the number of reported patients with FADD deficiency, showing that this disorder may present variable expressivity"
    explanation: >-
      Supports the variable expressivity claim from the reporting authors.
diagnosis:
- name: Fas-mediated apoptosis functional assay
  description: >-
    A functional apoptosis assay showing impaired Fas-mediated lymphocyte death,
    in a patient without a FAS, FASLG or CASP10 mutation, is what points at FADD.
    The assay is also what distinguishes the disorder from the rest of the ALPS
    spectrum, since the biomarker panel alone does not.
  evidence:
  - reference: PMID:21109225
    reference_title: "Whole-exome-sequencing-based discovery of human FADD deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This FADD mutation decreases steady-state protein levels and impairs Fas-dependent apoptosis in vitro"
    explanation: >-
      Establishes the assay abnormality that is diagnostically informative.
- name: Sequencing of sorted double-negative T cells
  description: >-
    Where a germline monoallelic FADD variant is found in a patient with an
    ALPS phenotype, the disease-causing homozygous genotype may exist only in
    the double-negative T cell compartment. Sequencing sorted CD4-positive or
    double-negative T cells, rather than whole blood, is what reveals it — the
    same strategy previously used for somatic FAS events.
  evidence:
  - reference: PMID:37793571
    reference_title: "Combined germline and somatic human FADD mutations cause autoimmune lymphoproliferative syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We sequenced FADD and performed array-based comparative genomic hybridization using DNA from sorted CD4+ or DN T cells."
    explanation: >-
      Describes the specimen and method that detect the somatic event.
  - reference: PMID:37793571
    reference_title: "Combined germline and somatic human FADD mutations cause autoimmune lymphoproliferative syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These somatic events were identified by sequencing FAS in DNA from double-negative (DN) T cells, the pathognomonic T-cell subset in ALPS, in which the somatic events accumulated."
    explanation: >-
      Explains why the double-negative compartment is the right specimen — it
      is where the somatic events accumulate.
differential_diagnoses:
- name: Autoimmune lymphoproliferative syndrome (ALPS-FAS)
  description: >-
    The nearest mimic, and the reason FADD deficiency is easy to misfile. The
    two share the biomarker panel — impaired Fas-mediated apoptosis, expanded
    double-negative T cells, raised soluble Fas ligand, interleukin-10 and
    vitamin B12. They differ in what surrounds it: FADD deficiency has milder
    lymphoproliferation and adds recurrent febrile encephalopathy, hepatopathy,
    cardiac malformation and functional hyposplenism, none of which ALPS-FAS
    produces. The ALPS entry in this knowledge base cites a source that draws
    exactly this distinction.
  evidence:
  - reference: PMID:32350755
    reference_title: "Novel Compound Heterozygote Variations in FADD Identified to Cause FAS-Associated Protein with Death Domain Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Previously described FADD deficiency patients demonstrate a clinical phenotype partially overlap- ping with other ALPS disorders"
    explanation: >-
      States the partial overlap that makes ALPS the differential. The
      hyphenation is how the text extracts from the cached PDF.
animal_models:
- name: Fadd conditional knockout mouse
  species: Mouse
  genotype: Fadd conditional deletion (Mx1-cre inducible, and tissue-specific alleles)
  category: Genetic
  description: >-
    Constitutive Fadd loss is embryonic lethal, so the mouse work uses
    conditional alleles. Inducible deletion across haematopoietic lineages
    depletes peripheral lymphocytes over time and impairs early bone-marrow
    haematopoiesis — and pointedly does NOT reproduce the lymphoproliferative
    disease seen in Fas-deficient mice, which is the murine counterpart of the
    human observation that FADD deficiency is not simply severe ALPS.
    Epithelium-specific alleles reveal a different function again: FADD restrains
    RIPK3-MLKL necroptosis and caspase-8-gasdermin-D pyroptosis-like death, and
    its loss in gut or skin epithelium causes inflammatory disease that human
    patients do not have.
  publication: PMID:21115735
  genes:
  - preferred_term: FADD
    term:
      id: hgnc:3573
      label: FADD
  modeled_mechanisms:
  - target: Failure of Activation-Induced Lymphocyte Apoptosis
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Haematopoietic Fadd deletion perturbs lymphocyte homeostasis, but in the
      opposite direction to the human disease: mice lose peripheral lymphocytes
      over time rather than accumulating an apoptosis-resistant population.
    limitations: >-
      The mouse model deletes Fadd outright, whereas human disease alleles
      reduce protein without abolishing it; and the murine outcome is lymphocyte
      depletion rather than the double-negative T cell expansion that defines
      the human laboratory phenotype.
    readouts:
    - name: Peripheral lymphocyte number after inducible Fadd deletion
      target: Failure of Activation-Induced Lymphocyte Apoptosis
      direction: DECREASED
      interpretation: >-
        Time-dependent depletion, which is the direction opposite to the human
        accumulation and is the reason this link is only partial.
      evidence:
      - reference: PMID:21115735
        reference_title: "FADD deficiency impairs early hematopoiesis in the bone marrow."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Instead, a time-dependent depletion of peripheral FADD-deficient lymphocytes was observed."
        explanation: >-
          The measurement and its direction.
    evidence:
    - reference: PMID:21115735
      reference_title: "FADD deficiency impairs early hematopoiesis in the bone marrow."
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: "The resulting FADD mutant mice did not develop lymphoproliferation diseases, unlike Fas-deficient mice."
      explanation: >-
        Classified PARTIAL: the model is informative about the lymphocyte arm,
        but its explicit divergence from the Fas-deficient phenotype is also
        what limits how far it can stand in for the human disease.
  evidence:
  - reference: PMID:21115735
    reference_title: "FADD deficiency impairs early hematopoiesis in the bone marrow."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In addition, a death receptor-independent function of FADD is essential for embryogenesis."
    explanation: >-
      Establishes the embryonic-lethality constraint that forces conditional
      alleles and that supports the residual-function inference in human
      patients.
discussions:
- discussion_id: mismatch_mouse_necroptosis_arm
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Mouse Fadd deletion in epithelium causes RIPK3-MLKL necroptosis and
    caspase-8-gasdermin-D pyroptosis-like death, with colitis and skin
    inflammation. Human FADD-deficient patients do not have inflammatory bowel
    disease. Does the necroptosis-restraint function of FADD operate in human
    tissue, and if so why is it not clinically apparent?
  attaches_to:
  - "pathophysiology#Loss of Fas-Independent FADD Functions"
  rationale: >-
    This is a genuine translational discrepancy rather than a gap in the human
    literature. The mouse work is unambiguous that FADD restrains two distinct
    lytic death programmes in epithelium, and lytic death is exactly the sort of
    mechanism that would be expected to produce inflammatory disease. Two
    explanations are compatible with what is known and are not distinguishable
    on current evidence: human disease alleles are hypomorphic rather than null,
    so enough FADD remains to restrain necroptosis while being insufficient for
    efficient DISC assembly; or the epithelial requirement genuinely differs
    between species. Which it is bears directly on whether the encephalopathic
    crises might themselves be a lytic-death phenomenon, and therefore on
    whether necroptosis inhibition would be a rational therapeutic direction.
  proposed_experiments:
  - experiment_id: exp_necroptosis_competence_patient_cells
    name: Necroptosis competence in patient-derived cells
    description: >-
      Challenge patient-derived cells carrying the reported hypomorphic alleles
      with TNF plus caspase inhibition and measure MLKL phosphorylation and
      lytic death against isogenic FADD-null and wild-type controls. Preserved
      restraint in patient cells would support the hypomorphic explanation;
      unrestrained necroptosis would make the species-difference explanation
      more likely and would raise the question of why the gut is spared.
  evidence:
  - reference: PMID:32362323
    reference_title: "FADD and Caspase-8 Regulate Gut Homeostasis and Inflammation by Controlling MLKL- and GSDMD-Mediated Death of Intestinal Epithelial Cells."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mice with IEC-specific FADD or caspase-8 deficiency developed colitis dependent on mixed lineage kinase-like (MLKL)-mediated epithelial cell necroptosis."
    explanation: >-
      Establishes the murine phenotype whose human counterpart is missing, which
      is the mismatch itself.
  - reference: PMID:25132550
    reference_title: "RIPK1 maintains epithelial homeostasis by inhibiting apoptosis and necroptosis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "a RIPK1 kinase inactive knock-in delayed but did not prevent inflammation caused by FADD deficiency in IECs or keratinocytes"
    explanation: >-
      Confirms the epithelial inflammatory consequence of Fadd loss in a second
      tissue and a second laboratory, so the mismatch is not a single-study
      artefact.
- discussion_id: gap_febrile_encephalopathy_mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    By what mechanism does febrile infection precipitate the stereotyped
    encephalopathic crises of FADD deficiency?
  attaches_to:
  - "pathophysiology#Recurrent Febrile Encephalopathic Crises"
  rationale: >-
    The crises are the feature that most distinguishes this disorder from the
    ALPS spectrum and carry much of its mortality, yet they are the least
    mechanistically explained. The reporting authors attribute them to
    disrupted FAS-mediated apoptosis, but that leaves unexplained why the
    episodes are febrile-triggered, why they are stereotyped and recurrent
    rather than progressive, and why the brain in particular. That FADD
    variants can produce a picture meeting FIRES criteria suggests a
    neuroinflammatory rather than a purely apoptotic route, which would have
    direct therapeutic consequences — the Epilepsia authors argue on that basis
    for early immunomodulatory treatment.
  proposed_experiments:
  - experiment_id: exp_crisis_neuroinflammatory_profiling
    name: Cytokine and cell-death profiling during and between crises
    description: >-
      Profile CSF and paired serum cytokines, and markers of lytic cell death,
      in the same patient during a febrile encephalopathic crisis and at
      baseline. A crisis-specific inflammatory signature would support the
      neuroinflammatory route and the case for immunomodulation; its absence
      would push attention back towards a cell-autonomous neuronal
      death-signalling defect.
  evidence:
  - reference: PMID:38752438
    reference_title: "FADD gene pathogenic variants causing recurrent febrile infection-related epilepsy syndrome: Case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "it demonstrates a genetic cause of FIRES involving a cell-mediated inflammation regulatory pathway. This finding supports early treatment with immunomodulatory therapy"
    explanation: >-
      States the neuroinflammatory framing and the therapeutic inference drawn
      from it, which is the hypothesis the proposed experiment would test.
notes: >-
  No treatments block is curated. No FADD-specific therapy has been evaluated in
  any series; management in the reported cases is supportive and directed at the
  complications (infection prophylaxis appropriate to hyposplenism,
  immunoglobulin replacement, antiseizure treatment, and the immunomodulation
  the Epilepsia authors argue for on mechanistic grounds). Asserting these as
  curated treatments would attach clinical convention to an evidence base that
  does not exist for this disorder specifically.

  Functional hyposplenism has no HP term. The nearest-sounding candidate,
  HP:0001971, is Hypersplenism — the clinical opposite — so the hyposplenic
  state is described in prose and the ontology binding is carried by
  Howell-Jolly bodies (HP:0032550), the objective marker of it.

  A note on this entry's deep-research report. Its NEC preflight passed and all
  9 references resolved, but seven of its suggested ontology terms were wrong on
  checking against OLS4, several dangerously: HP:0001971 was offered for
  "functional abnormality of the spleen" but is Hypersplenism; HP:0031913 was
  offered for Howell-Jolly bodies but is Rhombencephalosynapsis; HP:0011146 was
  offered for encephalopathy but is Dialeptic seizure; HP:0040218 was offered
  for double-negative T lymphocytosis but is Reduced total natural killer cell
  count; HP:0040214 was offered for elevated vitamin B12 but is Abnormal
  circulating insulin concentration. The report also asserted that "no somatic
  FADD variants have been implicated", which PMID:37793571 directly contradicts
  — that paper reports homozygous FADD mutations arising by uniparental disomy
  in the double-negative T cells of four unrelated patients. The somatic route
  is curated in the genetic section and in a dedicated diagnosis entry.

  No `datasets:` block: no disease-specific dataset was identified for this
  disorder.

    explanation: >-
      Supports the variable expressivity claim from the reporting authors.
diagnosis:
- name: Fas-mediated apoptosis functional assay
  description: >-
    A functional apoptosis assay showing impaired Fas-mediated lymphocyte death,
    in a patient without a FAS, FASLG or CASP10 mutation, is what points at FADD.
    The assay is also what distinguishes the disorder from the rest of the ALPS
    spectrum, since the biomarker panel alone does not.
  notes: >-
    No diagnosis_term is bound. NCIT has no term for a functional apoptosis
    assay — searching it returns apoptosis as a biological process, apoptosis
    markers and apoptosis-regulating proteins, but no diagnostic procedure — and
    the cited source does not state the assay platform, so binding a generic
    flow-cytometry term would assert a method the reference does not report.
  evidence:
  - reference: PMID:21109225
    reference_title: "Whole-exome-sequencing-based discovery of human FADD deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This FADD mutation decreases steady-state protein levels and impairs Fas-dependent apoptosis in vitro"
    explanation: >-
      Establishes the assay abnormality that is diagnostically informative.
- name: Sequencing of sorted double-negative T cells
  description: >-
    Where a germline monoallelic FADD variant is found in a patient with an
    ALPS phenotype, the disease-causing homozygous genotype may exist only in
    the double-negative T cell compartment. Sequencing sorted CD4-positive or
    double-negative T cells, rather than whole blood, is what reveals it — the
    same strategy previously used for somatic FAS events.
  diagnosis_term:
    preferred_term: sequencing of DNA from sorted T cell subsets
    term:
      id: NCIT:C153598
      label: DNA Sequencing
  evidence:
  - reference: PMID:37793571
    reference_title: "Combined germline and somatic human FADD mutations cause autoimmune lymphoproliferative syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We sequenced FADD and performed array-based comparative genomic hybridization using DNA from sorted CD4+ or DN T cells."
    explanation: >-
      Describes the specimen and method that detect the somatic event.
  - reference: PMID:37793571
    reference_title: "Combined germline and somatic human FADD mutations cause autoimmune lymphoproliferative syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These somatic events were identified by sequencing FAS in DNA from double-negative (DN) T cells, the pathognomonic T-cell subset in ALPS, in which the somatic events accumulated."
    explanation: >-
      Explains why the double-negative compartment is the right specimen — it
      is where the somatic events accumulate.
- name: Biomarker panel with double-negative T cell phenotyping
  description: >-
    Where exome sequencing is negative in a patient whose clinical picture and
    biomarkers look like ALPS, the combination of serum biomarkers with
    double-negative T cell phenotyping is what identifies the cases it missed —
    among them patients with heterozygous FADD mutations plus somatic loss of
    heterozygosity. This is the systematic counterpart of the sorted-cell
    sequencing entry above: it says which patients to send for it.
  diagnosis_term:
    preferred_term: double-negative T cell immunophenotyping
    term:
      id: NCIT:C113003
      label: Immunological Flow Cytometry
  evidence:
  - reference: PMID:37979702
    reference_title: "Abnormal biomarkers predict complex FAS or FADD defects missed by exome sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A combination of serum biomarkers and DNT phenotyping is an accurate means to identify patients with ALPS who are missed by routine exome sequencing."
    explanation: >-
      The study's own conclusion about what this diagnostic combination
      achieves.
  - reference: PMID:37979702
    reference_title: "Abnormal biomarkers predict complex FAS or FADD defects missed by exome sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three of the 4 ALPS-U patients with normal FAS expression carried heterozygous FADD mutations with sLOH."
    explanation: >-
      The FADD-specific yield, and the reason this is curated here rather than
      only in the ALPS entry: normal FAS expression on double-negative T cells
      is what points away from FAS and towards FADD.
differential_diagnoses:
- name: Autoimmune lymphoproliferative syndrome (ALPS-FAS)
  description: >-
    The nearest mimic, and the reason FADD deficiency is easy to misfile. The
    two share the biomarker panel — impaired Fas-mediated apoptosis, expanded
    double-negative T cells, raised soluble Fas ligand, interleukin-10 and
    vitamin B12. They differ in what surrounds it: FADD deficiency has milder
    lymphoproliferation and adds recurrent febrile encephalopathy, hepatopathy,
    cardiac malformation and functional hyposplenism, none of which ALPS-FAS
    produces. The ALPS entry in this knowledge base cites a source that draws
    exactly this distinction.
  evidence:
  - reference: PMID:32350755
    reference_title: "Novel Compound Heterozygote Variations in FADD Identified to Cause FAS-Associated Protein with Death Domain Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Previously described FADD deficiency patients demonstrate a clinical phenotype partially overlap- ping with other ALPS disorders"
    explanation: >-
      States the partial overlap that makes ALPS the differential. The
      hyphenation is how the text extracts from the cached PDF.
treatments:
- name: Immunoglobulin Replacement
  description: >-
    Subcutaneous immunoglobulin replacement, given at 400 mg/kg/month in the one
    report that describes its use, directed at the impaired antibody responses —
    absent isohaemagglutinins and suboptimal anti-pneumococcal titres despite
    repeated conjugate vaccination — rather than at the apoptosis defect. It
    substitutes for the antibody the patient cannot make; it does not correct
    FADD function, and no series has evaluated it.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: immunoglobulin therapy
    term:
      id: NCIT:C62710
      label: Immunoglobulin Therapy
  target_mechanisms:
  - target: Recurrent Severe Infection
    treatment_effect: BYPASSES
    description: >-
      Supplying immunoglobulin bypasses the impaired humoral response
      downstream of the FADD lesion; it leaves every upstream node untouched.
    evidence:
    - reference: PMID:32350755
      reference_title: "Novel Compound Heterozygote Variations in FADD Identified to Cause FAS-Associated Protein with Death Domain Deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "To address possible impaired viral responses and lack of appropriate B cell antibodies (isohemagglutinins), we initiated subcutaneous immunoglobulin infusions"
      explanation: >-
        States what the replacement was aimed at — the humoral deficit — which
        is the claim this link makes, distinct from the claim that it was given.
  evidence:
  - reference: PMID:32350755
    reference_title: "Novel Compound Heterozygote Variations in FADD Identified to Cause FAS-Associated Protein with Death Domain Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we initiated subcutaneous immunoglobulin infusions at 400 mg/kg/month"
    explanation: >-
      The one reported administration, with route and dose. A single patient, so
      this documents that the treatment was given — not that it is effective.
  - reference: PMID:32350755
    reference_title: "Novel Compound Heterozygote Variations in FADD Identified to Cause FAS-Associated Protein with Death Domain Deficiency."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient tolerated these infusions well with no side effects and subjec- tive improvements in fatigue and decreased respiratory infec- tions overall for the past 8 months"
    explanation: >-
      The only reported outcome. Classified PARTIAL and quoted in full because
      the improvements are explicitly subjective, in one uncontrolled patient
      over eight months. The hyphenation is how the text extracts from the
      cached PDF.
- name: Antibiotic Prophylaxis
  description: >-
    Antipneumococcal antibiotic prophylaxis is recommended on the strength of
    the functional hyposplenism, which is what puts these patients at risk of
    overwhelming encapsulated-organism sepsis. It is recorded here as a
    recommendation rather than as established practice: in the single report that
    describes it, the family declined it and the recommendation was still under
    discussion at the time of writing.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Functional Hyposplenism
    treatment_effect: BYPASSES
    description: >-
      Prophylaxis does not restore splenic phagocyte function; it substitutes
      for the clearance the hyposplenic patient has lost.
    evidence:
    - reference: PMID:32350755
      reference_title: "Novel Compound Heterozygote Variations in FADD Identified to Cause FAS-Associated Protein with Death Domain Deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "given his functional hyposplenism and risk of sepsis from encapsulated organisms"
      explanation: >-
        Names the hyposplenism as the reason prophylaxis was recommended, which
        is what ties this treatment to this node.
  evidence:
  - reference: PMID:32350755
    reference_title: "Novel Compound Heterozygote Variations in FADD Identified to Cause FAS-Associated Protein with Death Domain Deficiency."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "family declined antibiotic prophylaxis, although there are on- going discussions continuing to recommend it"
    explanation: >-
      Classified PARTIAL deliberately: the source establishes that prophylaxis
      was recommended, and simultaneously that it was not administered, so it
      cannot support an efficacy claim. The hyphenation is how the text extracts
      from the cached PDF.
- name: Haematopoietic Cell Transplantation
  description: >-
    Transplantation has been performed in a small number of reported patients
    and is the only intervention that could replace the FADD-deficient
    haematopoietic compartment. Two limits are explicit in the literature and
    are the reason this is not curated as established management: outcomes in
    the transplanted patients diverged sharply, and the non-haematopoietic
    manifestations — the encephalopathic crises, the cardiac malformation, the
    hepatopathy — arise in tissues a graft does not replace, so whether
    transplantation affects them is unknown.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: hematopoietic cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_mechanisms:
  - target: Failure of Activation-Induced Lymphocyte Apoptosis
    treatment_effect: RESTORES
    description: >-
      Replacing the haematopoietic compartment replaces the lymphocytes that
      carry the apoptosis defect. It reaches only this arm of the disease.
    evidence:
    - reference: PMID:32350755
      reference_title: "Novel Compound Heterozygote Variations in FADD Identified to Cause FAS-Associated Protein with Death Domain Deficiency."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "it remains unclear what degree of donor chimerism is needed to be curative of the immunodeficiency and how HSCT will affect non- hematopoietic manifestations of FADD deficiency"
      explanation: >-
        The source's own division of the disease into the compartment a graft
        replaces and the manifestations it does not — which is exactly why this
        link targets the lymphocyte-apoptosis node alone. PARTIAL because the
        same sentence says the curative threshold is unknown. The hyphenation is
        how the text extracts from the cached PDF.
  evidence:
  - reference: PMID:32350755
    reference_title: "Novel Compound Heterozygote Variations in FADD Identified to Cause FAS-Associated Protein with Death Domain Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two previously described patients underwent hematopoietic stem cell transplantation (HSCT)"
    explanation: >-
      Establishes that transplantation has been performed, and how few times.
  - reference: PMID:32350755
    reference_title: "Novel Compound Heterozygote Variations in FADD Identified to Cause FAS-Associated Protein with Death Domain Deficiency."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "HSCT will likely be an important part of the treatment regimen for FADD deficien- cy, but given the rarity of the disease and the paucity of data on all of the potential clinical manifestations, it remains unclear what degree of donor chimerism is needed to be curative of the immunodeficiency"
    explanation: >-
      The authors' own hedge, quoted rather than paraphrased: transplantation is
      expected to matter but the curative threshold is not known. This is why
      the entry does not assert transplantation as standard of care. The
      hyphenation is how the text extracts from the cached PDF.
- name: Immunomodulatory Therapy
  description: >-
    Early immunomodulatory treatment is argued for on mechanistic grounds in the
    family whose presentation was recurrent febrile infection-related epilepsy
    syndrome: if the encephalopathic crises reflect dysregulated cell-mediated
    inflammation rather than infection itself, immunomodulation is the rational
    target. This is an argument from mechanism, not a result — no trial, series,
    or controlled comparison exists in FADD deficiency.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: immunomodulation therapy
    term:
      id: NCIT:C116540
      label: Immunomodulation Therapy
  target_mechanisms:
  - target: Recurrent Febrile Encephalopathic Crises
    treatment_effect: MODULATES
    description: >-
      Proposed to act on the inflammatory regulatory pathway held to generate
      the crises. Untested.
    evidence:
    - reference: PMID:38752438
      reference_title: "FADD gene pathogenic variants causing recurrent febrile infection-related epilepsy syndrome: Case report and literature review."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "it demonstrates a genetic cause of FIRES involving a cell-mediated inflammation regulatory pathway. This finding supports early treatment with immunomodulatory therapy"
      explanation: >-
        Carries both halves of the link in one sentence: the pathway held to
        generate the crises, and the therapeutic inference drawn from it.
        PARTIAL — an inference, with no outcome reported.
  evidence:
  - reference: PMID:38752438
    reference_title: "FADD gene pathogenic variants causing recurrent febrile infection-related epilepsy syndrome: Case report and literature review."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "This finding supports early treatment with immunomodulatory therapy"
    explanation: >-
      Classified PARTIAL: the source recommends the approach as a consequence of
      identifying the genetic cause, and reports no outcome of having given it.

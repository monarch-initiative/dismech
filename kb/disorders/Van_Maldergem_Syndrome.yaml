differential_diagnoses:
- name: Hennekam lymphangiectasia-lymphedema syndrome 2
  description: >-
    Allelic — also caused by biallelic FAT4 variants — and shares the facial
    gestalt and intellectual disability. Distinguished by prominent lymphedema
    and intestinal lymphangiectasia, whereas van Maldergem syndrome features
    neonatal hypotonia, feeding problems, hearing loss, tracheal anomalies and
    osteopenia.
  evidence:
  - reference: PMID:29681106
    reference_title: "Van Maldergem syndrome and Hennekam syndrome: Further delineation of allelic phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      but differ in the occurrence of neonatal hypotonia and feeding problems,
      hearing loss, tracheal anomalies, and osteopenia in VMS, and lymphedema in
      HS
    explanation: >-
      Gives the discriminating features between the two allelic conditions.
- name: Other periventricular nodular heterotopia syndromes
  description: >-
    FLNA-related periventricular nodular heterotopia is X-linked and lacks the
    blepharo-naso-facial gestalt, ear anomalies and digital contractures of van
    Maldergem syndrome.
notes: >-
  Curated as a single Disease entry covering both numbered forms. DCHS1 and FAT4
  encode a heterophilic receptor-ligand pair that binds each other and acts in
  one planar cell polarity system, so the two forms share a pathograph rather
  than merely a phenotype.

  Two mechanistic routes to the heterotopia are curated separately and
  deliberately: a Hippo/Yap-mediated progenitor-differentiation imbalance
  (PMID:24056717) and a loss of Fat-PCP directional guidance for migrating
  neurons (PMID:24998526). Both are supported, they are not alternatives, and
  collapsing them into one node would lose the distinction.

  The FAT4 allelism with Hennekam lymphangiectasia-lymphedema syndrome 2 is
  recorded as a differential diagnosis rather than re-curated here; that entry
  already exists as kb/disorders/Hennekam_Lymphangiectasia-Lymphedema_Syndrome_2.yaml.

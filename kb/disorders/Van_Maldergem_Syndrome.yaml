- name: Dchs1 intracellular-domain deletion mouse
  species: Mouse
  genotype: Dchs1(delta-ICD-V5) homozygous
  publication: PMID:41972678
  description: >-
    Mouse in which the DCHS1 intracellular domain is replaced with a V5 epitope
    tag, isolating the signaling function of the ICD from the extracellular
    DCHS1-FAT4 binding interaction.
  modeled_mechanisms:
  - target: Expanded Neural Progenitor Pool with Reduced Neuronal Differentiation
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Reproduces the craniofacial and periventricular proliferative phenotype
      and measures the Hippo pathway shift directly.
    limitations: >-
      A targeted domain deletion rather than a patient allele, so it models the
      ICD signaling requirement specifically rather than the full spectrum of
      human loss-of-function variants. Unlike the neonatal-lethal global Dchs1
      knockout these mice are viable, which aids study but means the model is
      milder than complete loss.
    readouts:
    - name: Periventricular Ki67+ proliferation
      target: Expanded Neural Progenitor Pool with Reduced Neuronal Differentiation
      direction: INCREASED
      interpretation: >-
        Direct measure of the expanded proliferative compartment.

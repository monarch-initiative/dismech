pathophysiology:
- name: Loss of DCHS1-FAT4 Cadherin Pair Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic loss-of-function variants in DCHS1 or FAT4 abolish the function of
    a heterophilic receptor-ligand pair of giant atypical cadherins. Because the
    two proteins bind each other, loss of either produces the same downstream
    defect, which is the mechanistic basis for curating the two numbered forms
    as one disease.
  genes:
  - preferred_term: DCHS1
    term:
      id: hgnc:13681
      label: DCHS1
  - preferred_term: FAT4
    term:
      id: hgnc:23109
      label: FAT4
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Biallelic germline DCHS1 or FAT4 alleles, homozygous or compound
      heterozygous. Reported classes are nonsense, frameshift, canonical
      splice-site and missense; the disease is defined by loss of function of
      the pair, and no gain-of-function or dominant-negative mechanism has been
      described.
  biological_processes:
  - preferred_term: establishment of planar polarity
    term:
      id: GO:0001736
      label: establishment of planar polarity
    modifier: DECREASED
  evidence:
  - reference: PMID:24998526
    reference_title: Regulation of neuronal migration by Dchs1-Fat4 planar cell polarity.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Mutations in human FAT4 and DCHS1, key components of Fat-PCP signaling,
      cause Van Maldergem syndrome, characterized by severe neuronal
      abnormalities indicative of altered neuronal migration
    explanation: >-
      Identifies the two genes as components of the Fat planar cell polarity
      system and links their mutation to the syndrome.
  downstream:
  - target: Expanded Neural Progenitor Pool with Reduced Neuronal Differentiation
    causal_link_type: DIRECT
    description: >-
      Reducing Dchs1 or Fat4 in the embryonic neuroepithelium increases
      progenitor number and reduces differentiation into neurons.
    evidence:
    - reference: PMID:24056717
      reference_title: Mutations in genes encoding the cadherin receptor-ligand pair DCHS1 and FAT4 disrupt cerebral cortical development.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Reducing the expression of Dchs1 or Fat4 within mouse embryonic
        neuroepithelium increased progenitor cell numbers and reduced their
        differentiation into neurons, resulting in the heterotopic accumulation
        of cells below the neuronal layers in the neocortex, reminiscent of the
        human phenotype.
      explanation: >-
        Directly demonstrates the progenitor/differentiation imbalance
        downstream of losing either gene.
  - target: Impaired Osteoblast Differentiation
    causal_link_type: DIRECT
    description: >-
      The same cadherin pair is required for osteoblast differentiation. Loss of
      Dchs1-Fat4 signalling increases osteoprogenitor proliferation and delays
      their differentiation, through the same Yap-Tead route as the neural arm.
    evidence:
    - reference: PMID:31358536
      reference_title: Dchs1-Fat4 regulation of osteogenic differentiation in mouse.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In Dchs1/Fat4 mutants, proliferation of osteoprogenitors is increased and
        osteoblast differentiation is delayed.
      explanation: >-
        Establishes the osteoblast arm as a direct consequence of losing the
        cadherin pair.
  - target: Disrupted Planar-Polarity-Guided Neuronal Migration
    causal_link_type: DIRECT
    description: >-
      Fat4 and Dchs1 are expressed in complementary gradients that establish
      intracellular polarity across migrating neurons; disrupting the gradient
      alters both polarity and migration.
    evidence:
    - reference: PMID:24998526
      reference_title: Regulation of neuronal migration by Dchs1-Fat4 planar cell polarity.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Disruption of the Dchs1 gradients by mosaic inactivation of Dchs1 alters
        FBM neuron polarity and migration.
      explanation: >-
        Establishes the causal dependence of neuronal polarity and migration on
        the Dchs1 gradient.
- name: Expanded Neural Progenitor Pool with Reduced Neuronal Differentiation
  biological_scale: CELLULAR
  description: >-
    Loss of Dchs1-Fat4 signaling in the neuroepithelium shifts the balance from
    neuronal differentiation toward progenitor self-renewal. The effect is
    mediated through the Hippo pathway: concurrent knockdown of Yap, the
    pathway's transcriptional effector, rescues the phenotype, placing Dchs1 and
    Fat4 upstream of Yap in mammalian neurogenesis.
  biological_processes:
  - preferred_term: hippo signaling
    term:
      id: GO:0035329
      label: hippo signaling
    modifier: DECREASED
  evidence:
  - reference: PMID:24056717
    reference_title: Mutations in genes encoding the cadherin receptor-ligand pair DCHS1 and FAT4 disrupt cerebral cortical development.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These effects were countered by concurrent knockdown of Yap, a
      transcriptional effector of the Hippo signaling pathway.
    explanation: >-
      The Yap rescue establishes Hippo signaling as the mediator of the
      progenitor expansion.
  - reference: PMID:41972678
    reference_title: Loss of the DCHS1 Intracellular Domain Expands Neurogenic Proliferation and Generates Van Maldergem-like Neurodevelopmental Defects.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Neonatal brains display reduced pYAP1: YAP1 ratios and increased Ki67+
      proliferation with greater Ki67-neuronal co-localization within the
      periventricular zone.
    explanation: >-
      Independently measures the Hippo pathway shift (reduced YAP1
      phosphorylation) alongside increased periventricular proliferation,
      confirming the mechanism in a targeted mouse allele.
  downstream:
  - target: Periventricular and Subcortical Nodular Heterotopia
    causal_link_type: DIRECT
    description: >-
      Cells retained in the progenitor state accumulate heterotopically below
      the neuronal layers instead of populating the cortical plate.
    evidence:
    - reference: PMID:24056717
      reference_title: Mutations in genes encoding the cadherin receptor-ligand pair DCHS1 and FAT4 disrupt cerebral cortical development.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        resulting in the heterotopic accumulation of cells below the neuronal
        layers in the neocortex, reminiscent of the human phenotype
      explanation: >-
        States the heterotopic accumulation that is the direct anatomical
        consequence.
- name: Disrupted Planar-Polarity-Guided Neuronal Migration
  biological_scale: CELLULAR
  description: >-
    Fat-PCP acts as a neuronal guidance system in its own right, distinct from
    and orthogonal to the Frizzled-PCP axis. Loss of the Dchs1-Fat4 gradient
    removes the directional cue for collective tangential migration, contributing
    to the mislocalization of neurons independently of the progenitor imbalance.
  biological_processes:
  - preferred_term: neuron migration
    term:
      id: GO:0001764
      label: neuron migration
    modifier: DECREASED
  evidence:
  - reference: PMID:24998526
    reference_title: Regulation of neuronal migration by Dchs1-Fat4 planar cell polarity.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We find that Fat4 and Dchs1 are expressed in complementary gradients and
      are required for the collective tangential migration of FBM neurons and
      for their PCP.
    explanation: >-
      Establishes the requirement for the gradient in collective neuronal
      migration.
  - reference: PMID:24998526
    reference_title: Regulation of neuronal migration by Dchs1-Fat4 planar cell polarity.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Our results also identify Fat-PCP as a novel neuronal guidance system and
      reveal that Fat-PCP and Fz-PCP can act along orthogonal axes.
    explanation: >-
      Identifies Fat-PCP as an independent guidance system, supporting a
      migration defect separate from the progenitor effect.
  downstream:
  - target: Periventricular and Subcortical Nodular Heterotopia
    causal_link_type: DIRECT
    description: >-
      Neurons that lose their directional cue fail to reach their target layer
      and remain in ectopic nodules.
    evidence:
    - reference: PMID:22473091
      reference_title: "Van Maldergem syndrome: further characterisation and evidence for neuronal migration abnormalities and autosomal recessive inheritance."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        digital contractures and skeletal anomalies together with subependymal
        and subcortical neuronal heterotopia
      explanation: >-
        Documents the human heterotopia that the migration defect produces.
- name: Periventricular and Subcortical Nodular Heterotopia
  biological_scale: TISSUE
  description: >-
    Nodules of neurons arrested along the ventricular wall and in the subcortical
    white matter. This is the imaging signature of the syndrome and the
    structural correlate of the intellectual disability.
  locations:
  - preferred_term: cerebral cortex
    term:
      id: UBERON:0000956
      label: cerebral cortex
  evidence:
  - reference: PMID:24056717
    reference_title: Mutations in genes encoding the cadherin receptor-ligand pair DCHS1 and FAT4 disrupt cerebral cortical development.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Periventricular neuronal heterotopia, a specific form of mislocalization
      of cortical neurons, can arise from neuronal progenitors that fail to
      negotiate aspects of these developmental processes.
    explanation: >-
      Defines the lesion and attributes it to failed progenitor development.
  - reference: PMID:25930014
    reference_title: Mammalian cadherins DCHS1-FAT4 affect functional cerebral architecture.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we show that when key regulators during mammalian cerebral cortical
      development are disrupted due to DCHS1-FAT4 mutations, functional cerebral
      asymmetries are stronger
    explanation: >-
      Provides a functional correlate of the disrupted cortical architecture.
      Graded PARTIAL because it is a single-patient dichotic-listening/EEG study,
      so it establishes an association rather than a population-level finding.
- name: Impaired Osteoblast Differentiation
  biological_scale: CELLULAR
  description: >-
    Loss of Dchs1-Fat4 signalling expands the osteoprogenitor pool and delays
    its differentiation into osteoblasts. Mechanistically this is the same
    Yap-Tead shift that drives the neural progenitor imbalance, which is why one
    molecular lesion produces both a brain and a skeletal phenotype. Yap and Taz
    are not interchangeable here: Yap is required for osteoprogenitor
    proliferation and is the arm that is deranged, while Taz-Tead activity is
    unaffected in mutants.
  cell_types:
  - preferred_term: osteoblast
    term:
      id: CL:0000062
      label: osteoblast
  biological_processes:
  - preferred_term: osteoblast differentiation
    term:
      id: GO:0001649
      label: osteoblast differentiation
    modifier: DECREASED
  - preferred_term: hippo signaling
    term:
      id: GO:0035329
      label: hippo signaling
    modifier: DECREASED
  evidence:
  - reference: PMID:31358536
    reference_title: Dchs1-Fat4 regulation of osteogenic differentiation in mouse.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We show that loss of Dchs1-Fat4 signalling is linked to increased Yap-Tead
      activity and that Yap is expressed and required for proliferation in
      osteoprogenitors.
    explanation: >-
      Identifies increased Yap-Tead activity as the mediator, the same effector
      shift as in the neural arm.
  - reference: PMID:31358536
    reference_title: Dchs1-Fat4 regulation of osteogenic differentiation in mouse.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In contrast, Taz is expressed in more-committed Runx2-expressing
      osteoblasts, Taz does not regulate osteoblast proliferation and Taz-Tead
      activity is unaffected in Dchs1/Fat4 mutants.
    explanation: >-
      Distinguishes the Yap arm, which is deranged, from the Taz arm, which is
      not - a specificity claim that matters for interpreting the node.
  downstream:
  - target: Impaired Craniofacial and Middle Ear Morphogenesis
    causal_link_type: DIRECT
    description: >-
      Delayed osteoblast differentiation in the craniofacial skeleton is what
      produces the facial gestalt; the mouse mutants reproduce the human
      craniofacial phenotype.
    evidence:
    - reference: PMID:31358536
      reference_title: Dchs1-Fat4 regulation of osteogenic differentiation in mouse.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We show that Fat4 and Dchs1 mutants mimic the craniofacial phenotype of
        the human syndrome and that Dchs1-Fat4 signalling is essential for
        osteoblast differentiation.
      explanation: >-
        Directly connects the osteoblast defect to the craniofacial phenotype of
        the human syndrome.
- name: Impaired Craniofacial and Middle Ear Morphogenesis
  biological_scale: TISSUE
  description: >-
    The blepharo-naso-facial gestalt and the ear anomalies reflect disrupted
    Fat-PCP signaling in craniofacial development. Conductive hearing loss in
    VMS was historically attributed to microtia and external canal atresia, but
    middle ear ossicular malformation has since been documented directly and can
    be the dominant contributor.
  evidence:
  - reference: PMID:31358536
    reference_title: Dchs1-Fat4 regulation of osteogenic differentiation in mouse.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In human, mutations of the protocadherins FAT4 and DCHS1 result in Van
      Maldergem syndrome, which is characterised, in part, by craniofacial
      abnormalities.
    explanation: >-
      Attributes the craniofacial abnormalities to the cadherin pair, which is
      the claim this node makes.
  - reference: PMID:27739185
    reference_title: Middle ear abnormalities in Van Maldergem syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The main features of this syndrome comprise intellectual disability,
      blepharo-naso-facial malformation, and hand anomalies.
    explanation: >-
      Describes the clinical craniofacial phenotype this node produces.
  downstream:
  - target: Conductive Hearing Loss
    causal_link_type: DIRECT
    description: >-
      External and middle ear malformation obstructs sound conduction.
    evidence:
    - reference: PMID:27739185
      reference_title: Middle ear abnormalities in Van Maldergem syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Here, we present a VMS patient with congenital malformations of the
        middle ear as the main reason for severe conductive bilateral hearing
        impairment.
      explanation: >-
        Directly attributes conductive hearing loss to middle ear malformation
        in a VMS patient.
- name: Conductive Hearing Loss
  biological_scale: ORGANISM
  description: >-
    Bilateral conductive hearing impairment, present in nearly all reported
    patients.
  evidence:
  - reference: PMID:27739185
    reference_title: Middle ear abnormalities in Van Maldergem syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Almost all nine described patients have been shown to be affected by
      conductive hearing impairment attributed to microtia, and atresia of the
      outer ear canal.
    explanation: >-
      Establishes near-universal conductive hearing impairment in the reported
      cohort.

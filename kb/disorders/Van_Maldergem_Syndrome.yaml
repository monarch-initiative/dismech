name: Van Maldergem Syndrome
creation_date: "2026-08-29T00:00:00Z"
description: >-
  Van Maldergem syndrome (VMS) is a rare autosomal recessive multisystem
  developmental disorder caused by biallelic loss-of-function variants in either
  DCHS1 or FAT4, which encode a receptor-ligand pair of giant atypical
  (proto)cadherins. The clinical picture combines a distinctive
  blepharo-naso-facial gestalt (blepharophimosis, telecanthus, maxillary
  hypoplasia, microtia with external auditory canal atresia), intellectual
  disability, conductive hearing loss, digital contractures and skeletal
  anomalies, with neonatal hypotonia, chronic feeding difficulties and
  respiratory problems. The
  neuroanatomical signature is periventricular and subcortical nodular
  heterotopia, reflecting a failure of neuronal migration.

  Mechanistically, DCHS1 and FAT4 bind each other and operate as the vertebrate
  Fat-Dachsous planar cell polarity system. In the developing neuroepithelium
  their loss increases progenitor cell number at the expense of neuronal
  differentiation — an effect reversed by concurrent knockdown of the Hippo
  pathway effector Yap — and separately disrupts the polarity and collective
  migration of neurons, so that cells accumulate below their proper cortical
  layer. Because the same DCHS1-FAT4 pair also governs lymphatic endothelial
  polarity, biallelic FAT4 loss is allelic with Hennekam
  lymphangiectasia-lymphedema syndrome 2; the two conditions share a facial
  gestalt and intellectual disability but are distinguished by neonatal
  hypotonia, hearing loss, tracheal anomalies and osteopenia in VMS versus
  prominent lymphedema in Hennekam syndrome.
category: Mendelian
parents:

    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Both the DCHS1 and FAT4 forms are autosomal recessive. Sibling recurrence
    and parental consanguinity in reported families established the mode of
    inheritance before the genes were identified.
  evidence:
  - reference: PMID:22473091
    reference_title: "Van Maldergem syndrome: further characterisation and evidence for neuronal migration abnormalities and autosomal recessive inheritance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In our cohort, we have observed one instance of sibling recurrence and
      parental consanguinity in three of the families, indicating that autosomal
      recessive inheritance is likely.
    explanation: >-
      Sibling recurrence plus consanguinity across multiple families supports
      autosomal recessive inheritance.

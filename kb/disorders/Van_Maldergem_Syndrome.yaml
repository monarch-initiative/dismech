  - target: Impaired Craniofacial and Middle Ear Morphogenesis
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces craniofacial flattening, reduced palatine/maxillary structures
      and airway cartilage abnormality.
    limitations: >-
      Mouse craniofacial morphology does not map one-to-one onto the human
      blepharo-naso-facial gestalt, and the model does not reproduce the microtia
      and external auditory canal atresia that drive the human hearing loss.
    readouts:
    - name: Craniofacial and airway cartilage morphology
      target: Impaired Craniofacial and Middle Ear Morphogenesis
      direction: ALTERED
      interpretation: >-
        Structural correlate of the human craniofacial and tracheal phenotype.
      evidence:
      - reference: PMID:41972678
        reference_title: Loss of the DCHS1 Intracellular Domain Expands Neurogenic Proliferation and Generates Van Maldergem-like Neurodevelopmental Defects.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          exhibit VMS-like craniofacial flattening with enlarged fontanelles and
          reduced palatine/maxillary structures, along with airway cartilage
          abnormalities including reduced mineralization and decreased tracheal
          circularity
        explanation: >-
          Reports the craniofacial and tracheal cartilage measurements behind

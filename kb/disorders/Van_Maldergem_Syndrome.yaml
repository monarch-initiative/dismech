genetic:
- name: DCHS1
  gene_term:
    preferred_term: DCHS1
    term:
      id: hgnc:13681
      label: DCHS1
  relationship_type: CAUSATIVE
  notes: >-
    Biallelic DCHS1 variants cause van Maldergem syndrome 1. DCHS1 encodes the
    ligand half of the Dachsous-Fat atypical cadherin pair.
  evidence:
  - reference: PMID:24056717
    reference_title: Mutations in genes encoding the cadherin receptor-ligand pair DCHS1 and FAT4 disrupt cerebral cortical development.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we show that mutations in genes encoding the receptor-ligand cadherin
      pair DCHS1 and FAT4 lead to a recessive syndrome in humans that includes
      periventricular neuronal heterotopia.
    explanation: >-
      Establishes DCHS1 causality for the recessive syndrome.
  - reference: PMID:29046692
    reference_title: A patient with van Maldergem syndrome with endocrine abnormalities, hypogonadotropic hypogonadism, and breast aplasia/hypoplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      WES revealed compound heterozygous variants in DCHS1 (rs145099391:G > A,
      p.P197L & rs753548138:G > A, p.T2334 M)
    explanation: >-
      Documents a compound heterozygous DCHS1 genotype, confirming that
      biallelic loss need not be homozygous.
- name: FAT4
  gene_term:
    preferred_term: FAT4
    term:
      id: hgnc:23109
      label: FAT4
  relationship_type: CAUSATIVE
  notes: >-
    Biallelic FAT4 variants cause van Maldergem syndrome 2, and are separately
    responsible for Hennekam lymphangiectasia-lymphedema syndrome 2. The two
    conditions are allelic; which phenotype results is not fully explained by
    genotype.
  evidence:
  - reference: PMID:24913602
    reference_title: Hennekam syndrome can be caused by FAT4 mutations and be allelic to Van Maldergem syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Subsequent targeted mutation analysis of FAT4 in a cohort of 24 CCBE1
      mutation-negative Hennekam syndrome patients identified homozygous or
      compound heterozygous mutations in four additional families.
    explanation: >-
      Documents the FAT4 allelism between van Maldergem and Hennekam syndromes.
  - reference: PMID:30853441
    reference_title: FAT4 Fine-Tunes Kidney Development by Regulating RET Signaling.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Thus, FAT4 interacts with RET to fine-tune RET signaling, establishing a
      juxtacrine mechanism controlling kidney development.
    explanation: >-
      Identifies a second, Hippo-independent FAT4 mechanism operating in kidney
      development, which is the likely route to the renal anomalies in this
      syndrome. Recorded on the gene rather than as a pathophysiology node
      because it is demonstrated in mouse kidney development and has not been
      shown to operate in patients.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    First described in 1992; a 2018 review of all reported FAT4-variant patients
    counted 11 with van Maldergem syndrome, and the DCHS1 form adds a similarly
    small number.
  evidence:
  - reference: PMID:29681106
    reference_title: "Van Maldergem syndrome and Hennekam syndrome: Further delineation of allelic phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Biallelic variants in FAT4 are associated with the two disorders, Van
      Maldergem syndrome (VMS) (n = 11) and Hennekam syndrome (HS) (n= 40).
    explanation: >-
      Gives the reported FAT4-related VMS case count supporting the ultra-rare
      band.
treatments:
- name: Middle Ear Implantation for Conductive Hearing Loss
  description: >-
    Hearing rehabilitation is the principal intervention for the syndrome's
    chief morbidity. A conventional skin-drive bone-conduction device gave
    suboptimal restoration in a reported child, so an active middle ear implant
    (Vibrant Soundbridge) was placed instead, requiring an original surgical
    approach because of tympanic cavity hypoplasia. Craniofacial deformity also
    complicated intubation, which is an anaesthetic consideration in its own
    right.
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  therapeutic_modality: DEVICE
  target_mechanisms:
  - target: Conductive Hearing Loss
    description: >-
      Bypasses the malformed external and middle ear conduction pathway by
      driving the ossicular chain directly.
    evidence:
    - reference: PMID:26491591
      reference_title: Original Solution for Middle Ear Implant and Anesthetic/Surgical Management in a Child with Severe Craniofacial Dysmorphism.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The decision made was to position Vibrant Soundbridge, a middle ear
        implant, with an original surgical application due to hypoplasia of the
        tympanic cavity.
      explanation: >-
        Documents the intervention placed against this node in a VMS patient.
  evidence:
  - reference: PMID:26491591
    reference_title: Original Solution for Middle Ear Implant and Anesthetic/Surgical Management in a Child with Severe Craniofacial Dysmorphism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A five-year-old child, affected by a rare congenital disease (Van
      Maldergem Syndrome), suffered from conductive hearing loss.
    explanation: >-
      Establishes that the treated patient had van Maldergem syndrome with
      conductive hearing loss.
  - reference: PMID:26491591
    reference_title: Original Solution for Middle Ear Implant and Anesthetic/Surgical Management in a Child with Severe Craniofacial Dysmorphism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Postoperative hearing rehabilitation involved a multidisciplinary team,
      showing improved social skills and language development.
    explanation: >-
      Reports the functional outcome, which extends beyond audiometry to
      language and social development.
- name: GnRH Agonist Therapy for Central Precocious Puberty
  description: >-
    Monthly leuprorelin acetate microspheres controlled central precocious
    puberty over a two-year follow-up in a reported VMS-1 patient. The
    neurodevelopmental deficits in the same patient were managed by surveillance
    only, there being no established protocol.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: leuprorelin
      term:
        id: CHEBI:6427
        label: leuprolide
  therapeutic_modality: PEPTIDE
  target_mechanisms:
  - target: phenotypes#Central Precocious Puberty
    description: >-
      GnRH agonist suppression of the hypothalamic-pituitary-gonadal axis halts
      the precocious pubertal progression.
    evidence:
    - reference: PMID:40797481
      reference_title: "Van Maldergem syndrome-1 in a patient with central precocious puberty: A case report."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Over the 2-year follow-up, the precocious pubertal development was
        successfully controlled, and the neurodevelopmental deficits remained
        stable without progression.
      explanation: >-
        Reports the outcome of the intervention against this phenotype.
  evidence:
  - reference: PMID:40797481
    reference_title: "Van Maldergem syndrome-1 in a patient with central precocious puberty: A case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The treatment for precocious puberty involved monthly administration of
      leuprorelin acetate microspheres (Enantone®).
    explanation: >-
      Names the agent and schedule used.
  notes: >-
    There is no disease-modifying therapy for van Maldergem syndrome, and no
    established protocol for the neurodevelopmental deficits - the reported
    approach is surveillance. Management is otherwise symptomatic: hearing
    rehabilitation, feeding and respiratory support in infancy, and treatment of
    the individual malformations as they present. Only interventions with a
    citable VMS-specific report are curated here.
diagnosis:
- name: Brain MRI for the recognisable heterotopia pattern
  diagnosis_term:
    preferred_term: brain magnetic resonance imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  description: >-
    Periventricular and subcortical nodular heterotopia on brain MRI, together
    with the facial gestalt and hearing loss, is the pattern that should prompt
    targeted genetic testing. Van Maldergem syndrome is one of a small set of
    neurogenetic disorders whose brain MRI appearance is recognisable enough to
    direct the molecular workup rather than follow it.
  evidence:
  - reference: PMID:39462795
    reference_title: Recognisable Neuroradiological Findings in Five Neurogenetic Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The comprehensively reviewed conditions include DDX3X-related
      neurodevelopmental disorder, Van Maldergem syndrome, NMDAR-related
      disorders, EML1-associated disorder and ARFGEF2-related periventricular
      nodular heterotopia with microcephaly.
    explanation: >-
      Places van Maldergem syndrome among the disorders whose brain MRI pattern
      is recognisable enough to guide genetic testing.
  - reference: PMID:39462795
    reference_title: Recognisable Neuroradiological Findings in Five Neurogenetic Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      As these conditions can often prove challenging to diagnose, a clinical
      suspicion of a specific disorder may be invaluable to guide and interpret
      genetic testing.
    explanation: >-
      States the diagnostic logic: imaging-led suspicion directs and interprets
      the molecular result.
- name: Temporal bone imaging for the conductive hearing loss
  diagnosis_term:
    preferred_term: high-resolution computed tomography of the temporal bone
    term:
      id: NCIT:C17204
      label: Computed Tomography
  description: >-
    High-resolution CT of the petrous temporal bone characterises the middle ear
    malformation. This matters because conductive loss in VMS was historically
    attributed to microtia and canal atresia alone, and ossicular malformation is
    only demonstrable on imaging and exploratory tympanotomy.
  evidence:
  - reference: PMID:27739185
    reference_title: Middle ear abnormalities in Van Maldergem syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These malformations were seen on high resolution Computed Tomography
      scanning and during an exploratory tympanotomy.
    explanation: >-
      Names the two modalities that demonstrated the middle ear malformation.
- name: Molecular diagnosis by exome sequencing of DCHS1 and FAT4
  diagnosis_term:
    preferred_term: whole exome sequencing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    Confirmation is by identifying biallelic pathogenic variants in DCHS1 or
    FAT4. Reported diagnoses have come from whole-exome sequencing, including in
    patients whose presentation was not clinically recognisable as VMS.
  evidence:
  - reference: PMID:28878612
    reference_title: "Whole-Exome Sequencing Reveals FAT4 Mutations in a Clinically Unrecognizable Patient with Syndromic CAKUT: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The initial presentation of our patient was not clinically recognizable.
      However, in view of the molecular findings, the most likely diagnosis is a
      mild manifestation of VMS.
    explanation: >-
      Shows exome sequencing making a diagnosis that clinical recognition
      missed, which is the argument for molecular-first testing in mild
      presentations.
animal_models:
- name: Dchs1/Fat4 knockdown mouse neuroepithelium
  species: Mouse
  genotype: In utero electroporation knockdown of Dchs1 or Fat4
  publication: PMID:24056717
  description: >-
    Knockdown of Dchs1 or Fat4 in the embryonic mouse neuroepithelium, with a
    Yap co-knockdown rescue arm.
  modeled_mechanisms:
  - target: Expanded Neural Progenitor Pool with Reduced Neuronal Differentiation
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Reproduces the progenitor expansion, reduced neuronal differentiation and
      subcortical heterotopic accumulation seen in patients, and identifies Yap
      as the mediating effector.
    limitations: >-
      Acute knockdown in a subset of electroporated cells rather than a
      germline biallelic null, so it models the cell-autonomous requirement
      rather than the full constitutional genotype. Mouse neocortex lacks the
      expanded outer subventricular zone of human cortex.
    readouts:
    - name: Heterotopic cell accumulation below neuronal layers
      target: Expanded Neural Progenitor Pool with Reduced Neuronal Differentiation
      direction: INCREASED
      interpretation: >-
        Structural correlate of the human periventricular nodular heterotopia.
      evidence:
      - reference: PMID:24056717
        reference_title: Mutations in genes encoding the cadherin receptor-ligand pair DCHS1 and FAT4 disrupt cerebral cortical development.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          resulting in the heterotopic accumulation of cells below the neuronal
          layers in the neocortex, reminiscent of the human phenotype
        explanation: >-
          Reports the heterotopia measurement behind this readout.
    - name: Progenitor cell number
      target: Expanded Neural Progenitor Pool with Reduced Neuronal Differentiation
      direction: INCREASED
      interpretation: >-
        Quantifies the progenitor expansion that precedes the heterotopia.
      evidence:
      - reference: PMID:24056717
        reference_title: Mutations in genes encoding the cadherin receptor-ligand pair DCHS1 and FAT4 disrupt cerebral cortical development.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Reducing the expression of Dchs1 or Fat4 within mouse embryonic
          neuroepithelium increased progenitor cell numbers and reduced their
          differentiation into neurons
        explanation: >-
          Reports the progenitor count and differentiation measurements.
    evidence:
    - reference: PMID:24056717
      reference_title: Mutations in genes encoding the cadherin receptor-ligand pair DCHS1 and FAT4 disrupt cerebral cortical development.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        These findings implicate Dchs1 and Fat4 upstream of Yap as key
        regulators of mammalian neurogenesis.
      explanation: >-
        Supports treating this model as informative for the progenitor/
        differentiation node.
- name: Fat4/Dchs1 mutant mouse facial branchiomotor neurons
  species: Mouse
  genotype: Fat4 and Dchs1 loss-of-function; mosaic Dchs1 inactivation
  publication: PMID:24998526
  description: >-
    Murine facial branchiomotor neuron migration used as a tractable model of
    Fat-PCP-guided collective neuronal migration.
  modeled_mechanisms:
  - target: Disrupted Planar-Polarity-Guided Neuronal Migration
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Establishes that the Dchs1-Fat4 gradient is required for neuronal polarity
      and collective migration.
    limitations: >-
      Facial branchiomotor neurons migrate tangentially in the hindbrain, which
      is not the cortical radial migration whose failure produces the human
      periventricular heterotopia, so the model demonstrates the mechanism in a
      different neuronal population than the one affected clinically.
    readouts:
    - name: FBM neuron polarity and migration
      target: Disrupted Planar-Polarity-Guided Neuronal Migration
      direction: ALTERED
      interpretation: >-
        Direct measure of the polarity-dependent migration defect.
      evidence:
      - reference: PMID:24998526
        reference_title: Regulation of neuronal migration by Dchs1-Fat4 planar cell polarity.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Disruption of the Dchs1 gradients by mosaic inactivation of Dchs1
          alters FBM neuron polarity and migration.
        explanation: >-
          Reports the polarity and migration measurement behind this readout.
    evidence:
    - reference: PMID:24998526
      reference_title: Regulation of neuronal migration by Dchs1-Fat4 planar cell polarity.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Fat4 and Dchs1 are required intrinsically within the FBM neurons and
        extrinsically within the neuroepithelium.
      explanation: >-
        Supports the model as informative for cell-intrinsic and extrinsic
        control of migration.
- name: Dchs1 intracellular-domain deletion mouse
  species: Mouse
  genotype: Dchs1(delta-ICD-V5) homozygous
  publication: PMID:41972678
  description: >-
    Mouse in which the DCHS1 intracellular domain is replaced with a V5 epitope
    tag, isolating the signaling function of the ICD from the extracellular
    DCHS1-FAT4 binding interaction.
  modeled_mechanisms:
  - target: Expanded Neural Progenitor Pool with Reduced Neuronal Differentiation
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Reproduces the craniofacial and periventricular proliferative phenotype
      and measures the Hippo pathway shift directly.
    limitations: >-
      A targeted domain deletion rather than a patient allele, so it models the
      ICD signaling requirement specifically rather than the full spectrum of
      human loss-of-function variants. Unlike the neonatal-lethal global Dchs1
      knockout these mice are viable, which aids study but means the model is
      milder than complete loss.
    readouts:
    - name: Periventricular Ki67+ proliferation
      target: Expanded Neural Progenitor Pool with Reduced Neuronal Differentiation
      direction: INCREASED
      interpretation: >-
        Direct measure of the expanded proliferative compartment.
      evidence:
      - reference: PMID:41972678
        reference_title: Loss of the DCHS1 Intracellular Domain Expands Neurogenic Proliferation and Generates Van Maldergem-like Neurodevelopmental Defects.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Neonatal brains display reduced pYAP1: YAP1 ratios and increased Ki67+
          proliferation with greater Ki67-neuronal co-localization within the
          periventricular zone.
        explanation: >-
          Reports the proliferation measurement behind this readout.
    - name: Subventricular zone cell polarization
      target: Expanded Neural Progenitor Pool with Reduced Neuronal Differentiation
      direction: ALTERED
      interpretation: >-
        Loss of the polarized DCHS1 localization seen in wild type.
      evidence:
      - reference: PMID:41972678
        reference_title: Loss of the DCHS1 Intracellular Domain Expands Neurogenic Proliferation and Generates Van Maldergem-like Neurodevelopmental Defects.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          In periventricular regions, wild-type DCHS1 expression shows polarized
          localization, whereas mice with the ICD deletion exhibit altered cell
          polarization within the subventricular zone, concomitant with changes
          in neural cellular distribution.
        explanation: >-
          Reports the polarization measurement behind this readout.
    evidence:
    - reference: PMID:41972678
      reference_title: Loss of the DCHS1 Intracellular Domain Expands Neurogenic Proliferation and Generates Van Maldergem-like Neurodevelopmental Defects.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Additionally, our data establish Dchs1ΔICD-V5/ΔICD-V5 mice as a model
        that recapitulates core features of VMS, thereby allowing new mechanistic
        discoveries into its pathogenesis.
      explanation: >-
        The authors explicitly position the line as a VMS model, supporting its
        use for this node.
  - target: Impaired Craniofacial and Middle Ear Morphogenesis
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces craniofacial flattening, reduced palatine/maxillary structures
      and airway cartilage abnormality.
    limitations: >-
      Mouse craniofacial morphology does not map one-to-one onto the human
      blepharo-naso-facial gestalt, and the model does not reproduce the microtia
      and external auditory canal atresia that drive the human hearing loss.
    readouts:
    - name: Craniofacial and airway cartilage morphology
      target: Impaired Craniofacial and Middle Ear Morphogenesis
      direction: ALTERED
      interpretation: >-
        Structural correlate of the human craniofacial and tracheal phenotype.
      evidence:
      - reference: PMID:41972678
        reference_title: Loss of the DCHS1 Intracellular Domain Expands Neurogenic Proliferation and Generates Van Maldergem-like Neurodevelopmental Defects.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          exhibit VMS-like craniofacial flattening with enlarged fontanelles and
          reduced palatine/maxillary structures, along with airway cartilage
          abnormalities including reduced mineralization and decreased tracheal
          circularity
        explanation: >-
          Reports the craniofacial and tracheal cartilage measurements behind
          this readout.
    evidence:
    - reference: PMID:41972678
      reference_title: Loss of the DCHS1 Intracellular Domain Expands Neurogenic Proliferation and Generates Van Maldergem-like Neurodevelopmental Defects.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Van Maldergem Syndrome (VMS) is a rare autosomal recessive disorder
        caused by pathogenic variants in the atypical cadherin genes DCHS1 or
        FAT4 and is marked by craniofacial, skeletal, and neurodevelopmental
        abnormalities.
      explanation: >-
        Establishes the craniofacial domain of the syndrome that this model arm
        addresses.
- name: dchs1b zebrafish maternal-zygotic mutant
  species: Zebrafish
  genotype: maternal zygotic dchs1b mutant
  publication: PMID:26160902
  description: >-
    Maternal-zygotic dchs1b mutant zebrafish, which reveal a cytoskeletal role
    for Dachsous that is separable from its Fat-binding function.
  modeled_mechanisms:
  - target: Loss of DCHS1-FAT4 Cadherin Pair Function
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      Establishes that Dchs1 regulates the actin and microtubule cytoskeleton,
      and that some of this is independent of Fat. That matters for this entry
      because it means DCHS1 loss is not wholly equivalent to loss of the pair.
    limitations: >-
      The phenotypes are in the single-celled and gastrulating embryo - egg
      activation, cortical granule exocytosis, dorsal organizer specification -
      none of which correspond to any human van Maldergem feature. It is
      evidence about Dchs1 protein function, not a model of the disease, and is
      curated at LOW fidelity for that reason.
    evidence:
    - reference: PMID:26160902
      reference_title: Dachsous1b cadherin regulates actin and microtubule cytoskeleton during early zebrafish embryogenesis.
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Moreover, the bundled microtubule phenotype was partially rescued by
        expressing either full-length Dchs1b or its intracellular domain,
        suggesting that Dchs1b affects microtubules and some developmental
        processes independent of its known ligand Fat.
      explanation: >-
        Supports a Fat-independent DCHS1 function. Graded PARTIAL because it
        qualifies the receptor-ligand-pair framing of this entry without
        overturning it, and does so in a developmental context with no human
        counterpart.
- name: Neuron-specific fat knockdown Drosophila
  species: Drosophila melanogaster
  genotype: neuron-specific fat RNAi knockdown
  publication: PMID:28488382
  description: >-
    Knockdown of the Drosophila FAT4 homologue fat restricted to the nervous
    system, testing whether the neuronal phenotype of the human syndrome is
    cell-autonomous to neurons.
  modeled_mechanisms:
  - target: Disrupted Planar-Polarity-Guided Neuronal Migration
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      Neuron-restricted loss of the fat homologue impairs synapse structure and
      axonal targeting, supporting a neuron-intrinsic requirement for the
      cadherin in nervous system formation.
    limitations: >-
      Drosophila fat is a homologue rather than an orthologue-matched model, the
      readouts are neuromuscular junction structure and photoreceptor axon
      targeting rather than cortical neuronal migration, and the fly has no
      cortex in which heterotopia could form. The authors themselves frame the
      link to human disease as a consideration rather than a demonstration.
    evidence:
    - reference: PMID:28488382
      reference_title: Neuron-specific knockdown of the Drosophila fat induces reduction of life span, deficient locomotive ability, shortening of motoneuron terminal branches and defects in axonal targeting.
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Taken together, the results indicate that Drosophila fat plays an
        essential role in formation and/or maintenance of neuron.
      explanation: >-
        Supports a neuron-intrinsic requirement for the cadherin. Graded PARTIAL
        because it is an invertebrate homologue and the paper offers the human
        connection as a hypothesis.
differential_diagnoses:
- name: Hennekam lymphangiectasia-lymphedema syndrome 2
  description: >-
    Allelic — also caused by biallelic FAT4 variants — and shares the facial
    gestalt and intellectual disability. The discriminator that holds is
    lymphedema, a Hennekam feature, set against neonatal hypotonia, feeding
    problems, hearing loss, tracheal anomalies and osteopenia in van Maldergem
    syndrome. Intestinal lymphangiectasia is deliberately not offered as a
    discriminator: it has since been reported in van Maldergem syndrome as well,
    in a report titled as challenging exactly this distinction.
  evidence:
  - reference: PMID:29681106
    reference_title: "Van Maldergem syndrome and Hennekam syndrome: Further delineation of allelic phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      but differ in the occurrence of neonatal hypotonia and feeding problems,
      hearing loss, tracheal anomalies, and osteopenia in VMS, and lymphedema in
      HS
    explanation: >-
      Gives the discriminating features between the two allelic conditions.
- name: Other periventricular nodular heterotopia syndromes
  description: >-
    FLNA-related periventricular nodular heterotopia is X-linked and lacks the
    blepharo-naso-facial gestalt, ear anomalies and digital contractures of van
    Maldergem syndrome.
notes: >-
  Curated as a single Disease entry covering both numbered forms. DCHS1 and FAT4
  encode a heterophilic receptor-ligand pair that binds each other and acts in
  one planar cell polarity system, so the two forms share a pathograph rather
  than merely a phenotype.

  Two mechanistic routes to the heterotopia are curated separately and
  deliberately: a Hippo/Yap-mediated progenitor-differentiation imbalance
  (PMID:24056717) and a loss of Fat-PCP directional guidance for migrating
  neurons (PMID:24998526). Both are supported, they are not alternatives, and
  collapsing them into one node would lose the distinction.

  The FAT4 allelism with Hennekam lymphangiectasia-lymphedema syndrome 2 is
  recorded as a differential diagnosis rather than re-curated here; that entry
  already exists as kb/disorders/Hennekam_Lymphangiectasia-Lymphedema_Syndrome_2.yaml.

  Intestinal lymphangiectasia has been reported in van Maldergem syndrome
  (PMID:31063239), which erodes the lymphatic boundary between it and Hennekam
  syndrome. That report is a Letter with no abstract in the reference cache, so
  it cannot carry a verified snippet and is not cited as evidence anywhere in
  this entry; it is recorded here so the differential is not read as a firmer
  separation than the literature supports.

  FAT4 has a second, Hippo-independent mechanism - juxtacrine tuning of RET
  signalling during kidney development (PMID:30853441) - which is the likely
  route to the renal anomalies. It is recorded on the FAT4 genetic entry rather
  than as a pathophysiology node, because it is a mouse kidney-development
  result that has not been demonstrated in patients.

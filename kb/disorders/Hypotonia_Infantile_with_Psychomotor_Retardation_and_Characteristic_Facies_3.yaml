histopathology:
- name: Intraneuronal Lipofuscin Storage
  description: >-
    Widespread, massive accumulation of lipofuscin storage material in CNS
    neurons, notably without prominent neuronal degeneration at the time of
    examination, plus storage deposits in a minority of astrocytes.
  evidence:
  - reference: PMID:30591081
    reference_title: "Homozygous TBC1 domain-containing kinase (TBCK) mutation causes a novel lysosomal storage disease - a new type of neuronal ceroid lipofuscinosis (CLN15)?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a widespread and massive accumulation of lipofuscin storage material in
      neurons of the central nervous system without notable neuronal degeneration
    explanation: The defining neuropathological finding.
- name: Nonspecific Myopathic Changes on Muscle Biopsy
  description: >-
    Muscle biopsy can show nonspecific myopathic changes, establishing that
    neuromuscular involvement is not purely neurogenic and that muscle disease may
    be present early in life. This is a qualified finding rather than a diagnostic
    one: biopsies taken in infancy across the reported cohort have generally been
    normal or non-diagnostic, so a negative biopsy does not argue against the
    diagnosis.
  diagnostic: false
  evidence:
  - reference: PMID:32363625
    reference_title: "Myopathic changes associated with psychomotor delay and seizures caused by a novel homozygous mutation in TBCK."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole exome sequencing was performed on a family diagnosed with nonspecific
      myopathic changes by means of histological analysis and immunohistochemistry
      of muscle biopsy samples.
    explanation: >-

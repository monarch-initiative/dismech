discussions:
- discussion_id: mtorc1_primary_or_secondary
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is reduced mTORC1 signaling a primary consequence of TBCK loss, or a
    secondary, cell-type-restricted effect of endolysosomal trafficking failure?
  attaches_to:
  - pathophysiology#Reduced mTORC1 Signaling
  rationale: >-
    The mTORC1 model is the basis of the only proposed disease-directed therapy
    (leucine supplementation), so whether it is causal matters clinically, not just
    taxonomically. Reduced phospho-S6 is reproducible in patient fibroblasts and
    lymphocytes, but a human neural model found no mTORC1 inhibition in
    neuroprogenitors or neurons and found the effect inconsistent across eight
    patient-derived lines. The iNPC authors likewise leave open whether reduced
    mTOR signaling is secondary to impaired regulation of other secretory
    transport regulators.
  proposed_experiments:
  - experiment_id: mtorc1_celltype_resolved
    name: Cell-type-resolved mTORC1 output in isogenic TBCK-null human neurons
    description: >-
      Measure phospho-S6 and phospho-4E-BP1 across isogenic TBCK-null and corrected
      iPSC-derived neurons, astrocytes, fibroblasts and lymphoblasts under matched
      nutrient conditions, to establish whether the mTORC1 change is cell-type
      specific rather than genotype-driven.
  - experiment_id: rab5_gap_restoration_epistasis
    name: Epistasis of RAB5-GAP restoration on mTORC1 output
    description: >-
      Test whether restoring RAB5 hydrolysis (by expressing a GAP-competent
      TBCK-PPP1R21-FERRY3 module, or by RAB5 inhibition) normalizes phospho-S6 in
      TBCK-null cells; rescue would place the mTORC1 change downstream of the
      endosomal defect.
  evidence:
  - reference: PMID:35095425
    reference_title: "Neuroprogenitor Cells From Patients With TBCK Encephalopathy Suggest Deregulation of Early Secretory Vesicle Transport."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Whether reduced mechanistic target of rapamycin (mTOR) signaling is secondary
      to impaired TBCK function over other secretory transport regulators still
      needs further investigation.
    explanation: The authors state the open question in these terms.
- discussion_id: cln15_classification_proposal
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Should TBCK deficiency be classified as a neuronal ceroid lipofuscinosis
    (proposed CLN15), or as a distinct storage phenotype secondary to endolysosomal
    trafficking failure?
  attaches_to:
  - pathophysiology#Intraneuronal Lipofuscin and Carbohydrate Storage
  rationale: >-
    Neuropathology shows predominant intraneuronal lipofuscin, prompting a CLN15
    proposal. But the storage is heterogeneous rather than a single substrate,
    there is no deficient lysosomal hydrolase, and the emerging mechanism is a
    RAB5-GAP/trafficking defect that impairs lysosomal enzyme delivery rather than
    enzyme function. MONDO does not classify IHPRF3 under the neuronal ceroid
    lipofuscinoses, and no lysosomal_storage classification is asserted in this
    entry pending resolution.
  evidence:
  - reference: PMID:30591081
    reference_title: "Homozygous TBC1 domain-containing kinase (TBCK) mutation causes a novel lysosomal storage disease - a new type of neuronal ceroid lipofuscinosis (CLN15)?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Due to the clear predominance of intraneuronal lipofuscin storage material
      and the characteristic clinical presentation we propose to classify this
      disease as a new subtype of neuronal ceroid lipofuscinosis (CLN15).
    explanation: >-
      States the proposal; the question mark in the paper's own title signals it is
      unsettled.
  - reference: PMID:41789809
    reference_title: "The TBCK-PPP1R21-FERRY3/C12orf4 complex: a RAB5-GAP brake essential for endo-lysosomal homeostasis."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      These findings redefine TBCK syndrome as a primary disorder of endosomal
      dynamics
    explanation: >-
      The competing framing that would place the storage downstream of a
      trafficking defect rather than defining the disease class.
- discussion_id: ihprf_series_lump_vs_split
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Should IHPRF3 be curated as a standalone entry, or lumped with IHPRF1 (NALCN)
    and IHPRF2 (UNC80) under the shared MONDO series parent?
  rationale: >-
    The numbered IHPRF series shares a clinical presentation but not a mechanism.
    NALCN and UNC80 encode components of one sodium-leak channelosome, whereas TBCK
    acts on an unrelated endolysosomal/FERRY axis, and IHPRF3 alone carries the
    progressive neurodegenerative course with lysosomal storage. This entry is
    therefore curated standalone. Tracked in dismech issue #8451, which proposes a
    NALCN/UNC80 channelosome entry plus this separate TBCK entry.
  notes: >-
    If the series is later represented as a Grouping, this entry should be listed

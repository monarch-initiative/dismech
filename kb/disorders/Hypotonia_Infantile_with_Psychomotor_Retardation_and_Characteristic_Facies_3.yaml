    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings identify a novel early truncating variant in TBCK associated
      with a severe presentation and add muscle disease to the variability of
      phenotypes associated with TBCK mutations.
    explanation: >-
      The authors' own framing: muscle disease extends the phenotype rather than
      defining it.
  - reference: PMID:29283439
    reference_title: "Homozygous boricua TBCK mutation causes neurodegeneration and aberrant autophagy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Muscle and nerve biopsies were obtained in infancy (when available) and were
      overall non-diagnostic.
    explanation: >-
      The counterweight recorded in the description: in the Boricua cohort, infant
      biopsies were non-diagnostic, so this finding is inconsistent across the
      reported population.
- name: Carbohydrate-Rich Visceral Storage Deposits
  description: >-
    Carbohydrate-rich deposits in brain, spleen and liver, with more than twenty
    known lysosomal storage diseases excluded biochemically — i.e. a storage
    phenotype defined by heterogeneous rather than a single accumulated substrate.
  evidence:
  - reference: PMID:30591081
    reference_title: "Homozygous TBC1 domain-containing kinase (TBCK) mutation causes a novel lysosomal storage disease - a new type of neuronal ceroid lipofuscinosis (CLN15)?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Biochemical examinations ruled out more than 20 known lysosomal storage
      diseases. These investigations strikingly uncover TBCK-DD as a novel type of
      lysosomal storage disease which is characterized by different storage
      products rather than one specific type of accumulated material.
    explanation: >-
      Establishes both the visceral storage and its distinctive multi-substrate
      character.

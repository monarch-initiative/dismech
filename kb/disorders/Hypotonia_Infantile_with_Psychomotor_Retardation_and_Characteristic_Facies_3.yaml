inheritance:
- name: Autosomal recessive
  description: >-
    Biallelic (homozygous or compound heterozygous) loss-of-function variants in
    TBCK are required. Heterozygous carriers are clinically unaffected for the
    core syndrome, although a biobank-scale association study has reported a mild
    excess of acquired toe and foot deformities in carriers, interpreted as a
    subclinical peripheral neuropathy signal.
  inheritance_term:
    preferred_term: autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:40504974
    reference_title: "TBCK-Related Neurodevelopmental Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: TBCK-NDD is inherited in an autosomal recessive manner.
    explanation: GeneReviews states the mode of inheritance explicitly.
  - reference: PMID:27040692
    reference_title: "Recessive Inactivating Mutations in TBCK, Encoding a Rab GTPase-Activating Protein, Cause Severe Infantile Syndromic Encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Biallelic inactivating mutations in TBCK (TBC1-domain-containing kinase)
      were independently identified by whole-exome sequencing as the cause of this
      condition in four unrelated families.
    explanation: >-
      The original gene-discovery cohort established biallelic inactivating
      variants as causal in four unrelated families.
prevalence:
- population: Worldwide
  measure_type: POINT_PREVALENCE
  prevalence_class: BELOW_1_IN_1000000
  rate_per_100000: 0.1
  notes: >-
    Ultra-rare. Approximately 159 affected individuals were known worldwide as of
    2026; earlier reviews counted about 33 (2019) and over 100 (2023) reported
    cases. The rate recorded here is the upper bound of the cited "less than 1 in
    1,000,000" statement, not a measured estimate.
  evidence:
  - reference: PMID:42182390
    reference_title: "A novel mouse model of rare neurodevelopmental disorder, TBCK Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To date, about 159 affected individuals worldwide are known to have TBCK
      Syndrome, classifying this an ultra-rare condition (ultra rare < 1 in 50,000
      individuals) with a prevalence of less than 1 in 1,000,000
    explanation: >-
      States the worldwide case count and the prevalence band used for this
      record.
- population: Individuals of Puerto Rican (Boricua) ancestry
  measure_type: CARRIER_FREQUENCY
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 500.0
  notes: >-
    Founder effect for the TBCK c.376C>T (p.Arg126Ter) "Boricua" allele. The rate
    recorded is the reported ~0.5% carrier frequency in the ExAC Latino reference
    population, i.e. a heterozygous carrier rate and not a disease prevalence.
  evidence:
  - reference: PMID:29283439
    reference_title: "Homozygous boricua TBCK mutation causes neurodegeneration and aberrant autophagy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All patients reported here are of Puerto Rican ancestry without a history of
      consanguinity, consistent with a founder mutation.
    explanation: >-
      Establishes the Puerto Rican founder effect for p.R126X. Marked PARTIAL
      because the quoted sentence documents the founder effect rather than the
      numeric carrier frequency.
progression:
- phase: Congenital / neonatal presentation
  age_range: Birth to 3 months
  notes: >-
    Congenital severe generalized hypotonia, poor feeding and areflexia, often
    prompting evaluation for spinal muscular atrophy or a mitochondrial disorder.
  evidence:
  - reference: PMID:40504974
    reference_title: "TBCK-Related Neurodevelopmental Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most affected individuals also have congenital and severe hypotonia, which
      can also lead to feeding issues and dysphagia, with many affected
      individuals requiring gastrostomy tube placement.
    explanation: Establishes the congenital onset of the hypotonia and feeding phase.
- phase: Infancy and early childhood - developmental plateau and epilepsy
  age_range: 3 months to 5 years
  notes: >-
    Profound global developmental delay with failure to acquire independent
    sitting, ambulation or speech; onset of seizures; emergence of white-matter
    lesions on MRI; most children require nocturnal non-invasive respiratory
    support by age five.
  evidence:
  - reference: PMID:40504974
    reference_title: "TBCK-Related Neurodevelopmental Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Respiratory issues are also progressive, with most affected individuals
      requiring noninvasive nocturnal respiratory support by age five years and
      about 75% of teenagers requiring a tracheostomy.
    explanation: Anchors the age at which respiratory support becomes necessary.
- phase: Later childhood and adolescence - neurodegenerative phase
  age_range: 5 years to adolescence
  notes: >-
    Developmental regression and neurologic decompensation with illness,
    progressive cortical atrophy, distal-onset motor neuronopathy with muscle
    wasting and fasciculations, contractures and neuromuscular scoliosis,
    coarsening facies, and progression to tracheostomy in about three quarters of
    teenagers.
  evidence:
  - reference: PMID:40504974
    reference_title: "TBCK-Related Neurodevelopmental Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most affected individuals exhibit some degree of developmental regression
      and/or neurologic decompensation in the setting of illness, which often
      raises clinical concerns for mitochondrial disorders.
    explanation: Documents the regression/decompensation that defines this phase.
  - reference: PMID:30103036
    reference_title: "Further delineation of TBCK - Infantile hypotonia with psychomotor retardation and characteristic facies type 3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pathogenic mutations in TBCK have a predominant involvement of the Central
      Nervous System with a progressive pattern, leading to the conclusion where
      pathogenic mutations of the said gene lead to a progressive neurodegenerative
      disease.
    explanation: >-
      A literature review of the reported cohort characterizes the natural history
      as progressive neurodegeneration rather than a static encephalopathy.
- phase: Premature mortality
  age_range: Before the third decade in severely affected individuals
  notes: >-
    Severely affected individuals typically die of respiratory complications
    before the third decade of life.
  evidence:
  - reference: PMID:37353954
    reference_title: "Heterozygous variants in TBCK cause a mild neurologic syndrome in humans and mice."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Individuals with severe disease usually die before the third decade of life
      due to respiratory complications.
    explanation: States the cause and timing of premature death in the severe phenotype.
mechanistic_hypotheses:
- hypothesis_group_id: endosomal_rab5_gap_model
  hypothesis_label: Primary RAB5-GAP / FERRY endolysosomal trafficking defect
  status: EMERGING
  description: >-
    TBCK is the catalytic core of a TBCK-PPP1R21-FERRY3 heterotrimer that acts as
    a RAB5 GTPase-activating protein and is a subunit of the wider FERRY complex
    that shuttles mRNA on early endosomes for local translation. Under this model
    the primary lesion is constitutive RAB5 hyperactivation with arrest of the
    early-to-late endosome transition, failure of lysosomal enzyme delivery, and
    compartment-specific mRNA/lysosome trafficking failure in axons; autophagic,
    lysosomal-storage and mitochondrial abnormalities and any mTORC1 change are
    downstream consequences.
  evidence:
  - reference: PMID:41789809
    reference_title: "The TBCK-PPP1R21-FERRY3/C12orf4 complex: a RAB5-GAP brake essential for endo-lysosomal homeostasis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      TBCK deficiency or missense mutations of its key residues in the RABGAP-TBC
      domain lead to constitutive RAB5 hyperactivation, which blocks the
      transition from early to late endosomes and results in the formation of
      massively enlarged RAB5-positive endosomes.
    explanation: States the proposed primary molecular lesion of this model.
  - reference: PMID:40093117
    reference_title: "TBCK-deficiency leads to compartment-specific mRNA and lysosomal trafficking defects in patient-derived neurons."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      TBCK-deficient neurons show reduced levels of the lysosomal dynein/dynactin
      adapter protein JIP4, which functionally leads to TBCK-deficient neurons
      exhibiting striking lysosomal axonal retrograde trafficking defects.
    explanation: >-
      Patient-derived neurons show the endolysosomal trafficking phenotype this
      model predicts.
- hypothesis_group_id: mtorc1_downregulation_model
  hypothesis_label: Primary mTORC1 signaling downregulation
  status: ALTERNATIVE
  description: >-
    The original model: loss of TBCK Rab-GAP function downregulates mTORC1
    signaling, and the resulting de-repression of autophagy drives
    autophagic-lysosomal dysfunction and neurodegeneration. It is supported by
    reduced phospho-S6 in patient fibroblasts and lymphocytes and by rescue of
    fibroblast oligosaccharide profiles with the mTORC1 activator leucine, but is
    contradicted in neural cell types, where mTORC1 activity is unchanged and
    where the inhibition seen across patient lines is inconsistent. Retained as an
    alternative because it is the basis of the only proposed disease-directed
    therapy (leucine supplementation).
  evidence:
  - reference: PMID:27040691
    reference_title: "Mutations in TBCK, Encoding TBC1-Domain-Containing Kinase, Lead to a Recognizable Syndrome of Intellectual Disability and Hypotonia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      TBCK was absent in cells from affected individuals, and decreased
      phosphorylation of phospho-ribosomal protein S6 was also observed, a finding
      suggestive of downregulation of mTOR signaling.
    explanation: The original observation on which the mTORC1 model rests.
  - reference: PMID:39553985
    reference_title: "A Novel Human TBCK- Neuronal Cell Model Results in Severe Neurodegeneration and Partial Rescue with Mitochondrial Fission Inhibition."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: >-
      These data showed that loss of TBCK did not inhibit mTORC1 activity in
      neither NPC nor neurons. Additionally, analysis of eight patient-derived
      cells and TBCK knock down HeLa cells showed that mTORC1 inhibition is
      inconsistent across different patients and cell types.
    explanation: >-
      A human neural model finds no mTORC1 inhibition in the disease-relevant cell
      types, directly challenging this model.
pathophysiology:
- name: Biallelic TBCK Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Homozygous or compound heterozygous loss-of-function variants in TBCK
    (nonsense, frameshift, canonical splice-site, and a recurrent single-exon
    deletion of exon 23) abolish the major TBCK isoform. TBCK protein is absent
    from patient cells, so the disorder behaves as a complete loss of TBCK
    function rather than a hypomorphic or dominant-negative state.
  genetic_context:
    gene:
      preferred_term: TBCK
      term:
        id: hgnc:28261
        label: TBCK
    allele_type: SNV
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Reported alleles are predominantly biallelic truncating variants, including
      the Puerto Rican founder allele c.376C>T (p.Arg126Ter); compound
      heterozygosity and a recurrent exon 23 deletion also occur.
  genes:
  - preferred_term: TBCK
    term:
      id: hgnc:28261
      label: TBCK
  evidence:
  - reference: PMID:27040692
    reference_title: "Recessive Inactivating Mutations in TBCK, Encoding a Rab GTPase-Activating Protein, Cause Severe Infantile Syndromic Encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      are predicted to truncate the protein, and loss of the major TBCK isoform was
      confirmed in primary fibroblasts from one affected individual
    explanation: >-
      Confirms that the causal alleles truncate TBCK and that the major isoform is
      lost in patient cells.
  - reference: PMID:27040691
    reference_title: "Mutations in TBCK, Encoding TBC1-Domain-Containing Kinase, Lead to a Recognizable Syndrome of Intellectual Disability and Hypotonia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: TBCK was absent in cells from affected individuals
    explanation: Independent confirmation that patient cells lack TBCK protein.
  downstream:
  - target: Loss of TBCK-PPP1R21-FERRY3 RAB5-GAP Activity
    causal_link_type: DIRECT
    hypothesis_groups:
    - endosomal_rab5_gap_model
    description: >-
      Absence of TBCK removes the catalytic core of the heterotrimeric RAB5-GAP.
    evidence:
    - reference: PMID:41789809
      reference_title: "The TBCK-PPP1R21-FERRY3/C12orf4 complex: a RAB5-GAP brake essential for endo-lysosomal homeostasis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        we identify TBCK as the catalytic core of a heterotrimeric complex
        comprising TBCK, PPP1R21, and FERRY3/C12orf4. This complex functions as a
        specific GTPase-activating protein (GAP) for RAB5.
      explanation: >-
        Identifies TBCK as the catalytic subunit whose loss ablates the GAP
        activity.
  - target: Reduced mTORC1 Signaling
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - mtorc1_downregulation_model
    description: >-
      Loss of TBCK is associated with reduced basal mTORC1 output in fibroblasts
      and lymphocytes; the intermediate steps are not established, and the effect
      is not reproduced in neural cell types.
    evidence:
    - reference: PMID:27040691
      reference_title: "Mutations in TBCK, Encoding TBC1-Domain-Containing Kinase, Lead to a Recognizable Syndrome of Intellectual Disability and Hypotonia."
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: >-
        decreased phosphorylation of phospho-ribosomal protein S6 was also
        observed, a finding suggestive of downregulation of mTOR signaling
      explanation: >-
        Supports an association between TBCK loss and reduced mTORC1 output;
        PARTIAL because the authors themselves describe it as suggestive and the
        mechanism linking the two is unknown.
  - target: Impaired ER-to-Golgi Vesicle Transport in Neural Progenitors
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Patient-derived neuroprogenitor cells lacking functional TBCK show defective
      early secretory transport.
    evidence:
    - reference: PMID:35095425
      reference_title: "Neuroprogenitor Cells From Patients With TBCK Encephalopathy Suggest Deregulation of Early Secretory Vesicle Transport."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Lack of functional TBCK protein in iNPC is associated with impaired
        endoplasmic reticulum-to-Golgi vesicle transport and autophagosome
        biogenesis, as well as altered cell cycle progression and severe
        impairment in the capacity of migration.
      explanation: Directly links absent TBCK to the early secretory transport defect.
- name: Loss of TBCK-PPP1R21-FERRY3 RAB5-GAP Activity
  biological_scale: MOLECULAR
  description: >-
    TBCK forms a heterotrimer with PPP1R21 and FERRY3/C12orf4 that acts as a
    specific GTPase-activating protein for RAB5, and is a subunit of the wider
    five-subunit FERRY complex (with CRYZL1 and GATD1) that couples early
    endosomes to mRNA for peripheral local translation. Loss of the GAP leaves
    RAB5 constitutively GTP-bound. Despite the gene name, TBCK's N-terminal
    kinase-like domain is a catalytically inactive class I pseudokinase lacking the
    VAIK, HRD and DFG motifs and nucleotide binding, so the disease-relevant
    activity resides in the central TBC/Rab-GAP domain.
  molecular_functions:
  - preferred_term: RAB5 GTPase-activating protein activity
    term:
      id: GO:0005096
      label: GTPase activator activity
    modifier: LOSS_OF_FUNCTION
  protein_complexes:
  - preferred_term: FERRY complex (TBCK-PPP1R21-FERRY3/C12orf4-CRYZL1-GATD1)
  evidence:
  - reference: PMID:41789809
    reference_title: "The TBCK-PPP1R21-FERRY3/C12orf4 complex: a RAB5-GAP brake essential for endo-lysosomal homeostasis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      we identify TBCK as the catalytic core of a heterotrimeric complex
      comprising TBCK, PPP1R21, and FERRY3/C12orf4. This complex functions as a
      specific GTPase-activating protein (GAP) for RAB5.
    explanation: Establishes the complex and its RAB5-GAP activity.
  - reference: PMID:40093117
    reference_title: "TBCK-deficiency leads to compartment-specific mRNA and lysosomal trafficking defects in patient-derived neurons."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      we find TBCK interacts with PPP1R21, C12orf4, and Cryzl1, consistent with
      TBCK being part of the FERRY mRNA transport complex
    explanation: >-
      Unbiased proteomics in patient-derived human neurons confirms the complex
      membership in the disease-relevant cell type.
  - reference: PMID:40062705
    reference_title: "Neurogenetic disorders associated with mutations in the FERRY complex: a novel disease class?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Interestingly, three members of the FERRY complex are associated with
      ultra-rare neurogenetic disorders.
    explanation: >-
      Places TBCK loss within a wider FERRY-complex disease class (with PPP1R21
      and FERRY3), supporting the complex as the disease-relevant unit.
  - reference: PMID:42546825
    reference_title: "Human TBC1 domain-containing kinase is a class I multidomain pseudokinase."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Biochemical and biophysical analyses reveal that the catalytically inactive
      pseudokinase domain of TBCK lacks nucleotide binding, consistent with the
      absence of the canonical VAIK, HRD, and DFG motifs required for catalysis.
    explanation: >-
      Purified full-length human TBCK shows its N-terminal kinase-like domain is a
      catalytically inactive class I pseudokinase, so the "kinase" in the gene name
      is not the disease-relevant activity; the TBC/Rab-GAP domain is.
  downstream:
  - target: Constitutive RAB5 Hyperactivation and Endosomal Maturation Arrest
    causal_link_type: DIRECT
    hypothesis_groups:
    - endosomal_rab5_gap_model
    evidence:
    - reference: PMID:41789809
      reference_title: "The TBCK-PPP1R21-FERRY3/C12orf4 complex: a RAB5-GAP brake essential for endo-lysosomal homeostasis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        TBCK deficiency or missense mutations of its key residues in the
        RABGAP-TBC domain lead to constitutive RAB5 hyperactivation, which blocks
        the transition from early to late endosomes
      explanation: The GAP loss directly produces the RAB5 hyperactivation phenotype.
  - target: Axonal mRNA and Lysosome Trafficking Failure
    causal_link_type: DIRECT
    hypothesis_groups:
    - endosomal_rab5_gap_model
    evidence:
    - reference: PMID:40093117
      reference_title: "TBCK-deficiency leads to compartment-specific mRNA and lysosomal trafficking defects in patient-derived neurons."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        TBCK-deficient neurons have reduced mRNA content in the axonal compartment
        relative to the soma.
      explanation: >-
        Loss of the FERRY subunit produces the compartment-specific mRNA
        trafficking defect.
  - target: Impaired Ribosomal Function and Translation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - endosomal_rab5_gap_model
    description: >-
      The FERRY complex couples early endosomes to mRNA and ribosomes, so loss of
      TBCK is expected to degrade translational output; the steps between the lost
      GAP activity and the measured translation deficit are not established.
    evidence:
    - reference: PMID:41040160
      reference_title: "TBCK Deficiency Alters Ribosomal Function, RNA Splicing, and miRNA Networks: Insights from Multi-Omics Analyses."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Our comprehensive analysis uncovered significant disruptions in ribosomal
        and translation-related pathways with widespread alternative splicing
        defects, and key miRNA changes that validate previously reported molecular
        findings.
      explanation: >-
        Unbiased multi-omics in patient-derived TBCK-deficient cells identifies the
        ribosome/translation axis as a consequence of TBCK loss.
- name: Constitutive RAB5 Hyperactivation and Endosomal Maturation Arrest
  biological_scale: CELLULAR
  description: >-
    Without GAP-mediated GTP hydrolysis, RAB5 remains active, the early-to-late
    endosome transition is blocked, and massively enlarged RAB5-positive endosomes
    accumulate. RAB5 hyperactivation also constitutively activates the
    PIK3C3/VPS34 complex.
  biological_processes:
  - preferred_term: early endosome to late endosome transport
    term:
      id: GO:0045022
      label: early endosome to late endosome transport
    modifier: DECREASED
  - preferred_term: endosomal transport
    term:
      id: GO:0016197
      label: endosomal transport
    modifier: DECREASED
  evidence:
  - reference: PMID:41789809
    reference_title: "The TBCK-PPP1R21-FERRY3/C12orf4 complex: a RAB5-GAP brake essential for endo-lysosomal homeostasis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      which blocks the transition from early to late endosomes and results in the
      formation of massively enlarged RAB5-positive endosomes. Furthermore, this
      RAB5 hyperactivation drives the constitutive activation of the PIK3C3/VPS34
      complex.
    explanation: Describes the endosomal maturation arrest and its VPS34 consequence.
  downstream:
  - target: Autophagic-Lysosomal Degradation Failure
    causal_link_type: DIRECT
    hypothesis_groups:
    - endosomal_rab5_gap_model
    evidence:
    - reference: PMID:41789809
      reference_title: "The TBCK-PPP1R21-FERRY3/C12orf4 complex: a RAB5-GAP brake essential for endo-lysosomal homeostasis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        These defects culminate in a failure of lysosomal enzyme delivery and a
        secondary collapse of macroautophagic/autophagic flux.
      explanation: >-
        The endosomal arrest is stated to cause the lysosomal and autophagic
        failure.
- name: Reduced mTORC1 Signaling
  biological_scale: MOLECULAR
  description: >-
    Patient fibroblasts and lymphocytes show markedly decreased phosphorylation of

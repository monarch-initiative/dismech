  description: >-
    The diagnosis is established by identifying biallelic pathogenic TBCK variants.
    Exome sequencing is the usual first-line test but misses the recurrent
    single-exon deletion, so genome sequencing, targeted copy-number analysis or
    RNA sequencing should be considered in a clinically suggestive but
    exome-negative child.

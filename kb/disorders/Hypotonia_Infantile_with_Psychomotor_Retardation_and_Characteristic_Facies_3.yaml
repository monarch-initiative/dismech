notes: >-
  Naming: the literature uses at least four names for this entity — IHPRF3 (the
  OMIM/MONDO name), TBCK-related neurodevelopmental disorder (TBCK-NDD, the
  GeneReviews name), TBCK syndrome, and TBCK-encephaloneuronopathy (TBCKE, coined
  for the severe Puerto Rican founder-allele phenotype). TBCKE is not a separate
  disease but the severe end of one allelic spectrum, so it is recorded here as a
  synonym rather than a subtype; no has_subtypes are declared because no
  genotype-phenotype correlation has been established across the reported cohort.

  Evidence conventions used here: the two competing mechanistic models are curated
  as mechanistic_hypotheses with hypothesis-scoped causal edges rather than being
  merged into one chain, and the negative mTORC1 result in neural cells is retained
  as REFUTE evidence rather than dropped.

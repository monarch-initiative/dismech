name: Hypotonia, Infantile, with Psychomotor Retardation and Characteristic Facies 3
creation_date: '2026-08-19T00:00:00Z'
category: Mendelian
synonyms:
- IHPRF3
- TBCK-related neurodevelopmental disorder
- TBCK-NDD
- TBCK syndrome
- TBCK encephaloneuronopathy
- TBCKE
- TBCK deficiency disorder
description: >-
  Hypotonia, infantile, with psychomotor retardation and characteristic facies 3
  (IHPRF3; OMIM:616900), increasingly called TBCK-related neurodevelopmental
  disorder (TBCK-NDD) or TBCK syndrome, is an ultra-rare autosomal recessive
  multisystem encephaloneuronopathy caused by biallelic loss-of-function variants
  in TBCK. Affected children present in infancy with congenital, severe
  generalized hypotonia, profound global developmental delay, and a facial
  gestalt that coarsens over time; most never achieve independent ambulation or
  spoken language. The course is characteristically progressive rather than
  static: seizures, developmental regression or neurologic decompensation during
  intercurrent illness, brain MRI white-matter lesions and cortical atrophy, and a
  distal-onset motor neuronopathy that drives neuromuscular weakness, chronic
  respiratory insufficiency and, for most teenagers, tracheostomy. Systemic
  features include dysphagia requiring gastrostomy, contractures and neuromuscular
  scoliosis, osteoporosis with fractures, optic atrophy, nephrolithiasis and
  recurrent urinary tract infections, dyslipidemia, and left ventricular
  hypertrophy.

  Mechanistically the entry is anchored on a moving target. TBCK was originally
  described as a putative Rab-GTPase-activating protein whose loss downregulates
  mTORC1 signaling, and patient fibroblasts do show reduced phospho-S6 with
  aberrant autophagy, impaired lysosomal proteolysis, secondary mitochondrial
  quality-control failure, and intraneuronal lipofuscin storage that prompted a
  proposal to classify TBCK deficiency as a new neuronal ceroid lipofuscinosis
  subtype. More recent work places TBCK in the five-subunit endosomal Rab5 and
  RNA/ribosome intermediary (FERRY) complex — where it mediates endolysosomal
  trafficking of mRNA in neuronal axons — and identifies it as the catalytic core
  of a TBCK-PPP1R21-FERRY3 RAB5-GAP, recasting the disorder as a primary defect of
  endosomal dynamics with autophagic-lysosomal collapse downstream. Whether
  reduced mTORC1 signaling is a primary or a secondary, cell-type-dependent
  consequence is explicitly unresolved and is curated here as competing
  mechanistic hypotheses rather than a settled chain.

  Curation scope: IHPRF3 is kept as a standalone entry rather than lumped with the
  NALCN (IHPRF1) and UNC80 (IHPRF2) members of the numbered IHPRF series, because
  those two encode components of the same sodium-leak channelosome while TBCK acts
  on a mechanistically unrelated endolysosomal/FERRY axis (dismech issue #8451).

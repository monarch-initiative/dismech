      label: leukocyte
  evidence:
  - reference: PMID:30211253
    reference_title: "Varicella-zoster virus CNS vasculitis and RNA polymerase III gene mutation in identical twins."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "RNA POL III is a 17-subunit enzyme with dual functions in both promoter-dependent transcription of tRNA and rRNA and innate sensing of AT-rich DNA, converting this into 5"
    explanation: >-
      States the dual role that makes this node possible: the same enzyme does
      housekeeping transcription and cytosolic AT-rich DNA sensing, converting
      that DNA into the 5-prime-phosphorylated RNA that RIG-I recognises. Quoted
      up to the prime symbol, which does not survive as a stable substring.
  - reference: PMID:30115567
    reference_title: "RNA Polymerase III as a Gatekeeper to Prevent Severe VZV Infections."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Recent studies have demonstrated that defects in the DNA sensor RNA polymerase III (POL III) confer selective increased susceptibility to VZV infection, thus providing fundamental new insight into VZV immunity."
    explanation: >-
      States both halves of this node: POL III acts as a DNA sensor, and defects
      in it confer SELECTIVE susceptibility to VZV.
  - reference: PMID:29728610
    reference_title: "Mutations in RNA Polymerase III genes and defective DNA sensing in adults with varicella-zoster virus CNS infection."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "impaired immunological sensing of AT-rich DNA in adult patients with VZV CNS infection"
    explanation: >-
      Names the specific molecular defect — impaired sensing of AT-rich DNA — in
      adult patients.
  - reference: PMID:30211253
    reference_title: "Varicella-zoster virus CNS vasculitis and RNA polymerase III gene mutation in identical twins."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the novel association between defects in sensing of AT-rich DNA present in the VZV genome and increased susceptibility to severe manifestations of VZV infection in the CNS in humans"
    explanation: >-
      Connects the AT-rich content of the VZV genome specifically to the sensing
      defect, which is the basis for the pathogen-restriction claim in this node.
  downstream:
  - target: Deficient Type I Interferon Induction
    causal_link_type: DIRECT
    description: >-
      Failure of sensing means the interferon response that sensing normally
      triggers is not mounted.
    evidence:
    - reference: PMID:28783042
      reference_title: "Inborn errors in RNA polymerase III underlie severe varicella zoster virus infections."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Leukocytes from all 4 patients tested exhibited poor IFN induction in response to synthetic or VZV-derived DNA."
      explanation: >-
        Directly measures the interferon consequence of the sensing defect, in
        response both to synthetic DNA and to VZV-derived DNA.
- name: Deficient Type I Interferon Induction
  biological_scale: CELLULAR
  role: amplifier
  description: >-
    Patient leukocytes mount a poor interferon response to synthetic AT-rich DNA,
    to VZV-derived DNA, and to VZV infection itself. That the defect is
    demonstrable with a synthetic agonist as well as with the virus is what
    separates a sensing defect from a downstream failure of viral handling. The
    causal weight of this node rests on a rescue experiment: transducing patient
    cells with the relevant wild-type allele restored the phenotype.
  biological_processes:
  - preferred_term: positive regulation of type I interferon production
    term:
      id: GO:0032481
      label: positive regulation of type I interferon production
    modifier: DECREASED
  - preferred_term: type I interferon production
    term:
      id: GO:0032606
      label: type I interferon production
    modifier: DECREASED
  cell_types:
  - preferred_term: leukocyte
    term:
      id: CL:0000738
      label: leukocyte
  evidence:
  - reference: PMID:28783042
    reference_title: "Inborn errors in RNA polymerase III underlie severe varicella zoster virus infections."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Moreover, leukocytes from 3 of the patients displayed defective IFN production upon VZV infection and reduced control of VZV replication."
    explanation: >-
      Shows the interferon defect on live VZV infection, not only on synthetic
      agonist, together with the loss of viral control.
  - reference: PMID:28783042
    reference_title: "Inborn errors in RNA polymerase III underlie severe varicella zoster virus infections."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These phenotypes were rescued by transduction with relevant WT alleles."
    explanation: >-
      The rescue experiment that establishes the variants as causal for the
      interferon phenotype rather than merely associated with it.
  - reference: PMID:29728610
    reference_title: "Mutations in RNA Polymerase III genes and defective DNA sensing in adults with varicella-zoster virus CNS infection."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we found impaired expression of antiviral and inflammatory cytokines in response to the POL III agonist Poly(dA:dT) as well as increased viral replication in patient cells compared to controls"
    explanation: >-
      Replicates the cytokine and viral-replication phenotype in an independent
      adult cohort with POLR3A and POLR3E variants.
  - reference: PMID:30211253
    reference_title: "Varicella-zoster virus CNS vasculitis and RNA polymerase III gene mutation in identical twins."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "By contrast, responses to transfected Poly(I:C) were normal as expected because this ligand activates the cytosolic RNA receptor Retinoic acid-inducible-I (RIG-I) directly downstream of POL III"
    explanation: >-
      The internal control that localizes the lesion. Poly(I:C) bypasses POL III
      and engages RIG-I directly, and the response to it is intact, so the defect
      is in the sensor rather than anywhere in the pathway below it. This is what
      makes the interferon deficit specific to the DNA-sensing route.
  - reference: PMID:30211253
    reference_title: "Varicella-zoster virus CNS vasculitis and RNA polymerase III gene mutation in identical twins."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "PBMCs from P1 showed significantly impaired IFN"
    explanation: >-
      Reports the impaired interferon response to the POL III agonist in patient
      cells. Quoted short because the cached text uses a Greek beta immediately
      after, which does not survive as a stable substring.
  downstream:
  - target: Failure to Restrict VZV Replication
    causal_link_type: DIRECT
    description: >-
      Without an adequate interferon response the cell does not establish the
      antiviral state that limits VZV replication.
    evidence:
    - reference: PMID:28783042
      reference_title: "Inborn errors in RNA polymerase III underlie severe varicella zoster virus infections."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "defective IFN production upon VZV infection and reduced control of VZV replication"
      explanation: >-
        Couples the interferon defect to loss of control of viral replication in
        the same cells.
- name: Failure to Restrict VZV Replication
  biological_scale: CELLULAR
  role: effector
  description: >-
    Patient cells permit more VZV replication than control cells. This is the
    convergence point of the disease: whatever the subunit and whichever phase of
    the viral life cycle, the cell fails to hold the virus down, and everything
    downstream is a consequence of uncontrolled VZV in a particular tissue.
  biological_processes:
  - preferred_term: defense response to virus
    term:
      id: GO:0051607
      label: defense response to virus
    modifier: DECREASED
  evidence:
  - reference: PMID:30211253
    reference_title: "Varicella-zoster virus CNS vasculitis and RNA polymerase III gene mutation in identical twins."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "patient PBMCs exhibited impaired antiviral and inflammatory responses to the POL III agonist poly(dA:dT) and increased viral replication compared with controls"
    explanation: >-
      Measures increased viral replication in patient cells relative to controls.
  - reference: PMID:30211253
    reference_title: "Varicella-zoster virus CNS vasculitis and RNA polymerase III gene mutation in identical twins."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "a significantly increased amount of the viral immediate-early gene ORF63 mRNA was detected in P1 cells relative to controls, demonstrating increased viral replication, i.e., reduced viral control in patient cells"
    explanation: >-
      Quantifies the loss of viral control as increased viral immediate-early
      transcript in patient cells, which is the measurement this node names.
  downstream:
  - target: VZV Reactivation from Latency
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Loss of cell-intrinsic restraint in neurons permits reactivation from
      latency, which is the arm that produces the adult presentation on which the
      numbered OMIM entity is defined. The direct evidence is a neuronal cell
      model rather than patient tissue.
    evidence:
    - reference: PMID:41739639
      reference_title: "RNA Polymerase III Suppresses Varicella Zoster Virus in Human Neurons."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Varicella zoster virus infection of undifferentiated as well as terminally differentiated early passage SH-SY5Y cells resulted in higher viral gene expression and more VZV reactivation in the POLR3F neuronal heterozygous (POLR3F+/-) knockout cells, reflecting the patient phenotype, compared with wild-type cells."
      explanation: >-
        Directly demonstrates increased reactivation in POLR3F-heterozygous
        neuronal cells, which is the mechanistic basis for this edge.
  - target: Severe Primary VZV Disease of the CNS and Lungs
    causal_link_type: DIRECT
    description: >-
      In children meeting the virus for the first time, the same failure of
      restraint permits severe primary disease rather than uncomplicated
      varicella.
    evidence:
    - reference: PMID:28783042
      reference_title: "Inborn errors in RNA polymerase III underlie severe varicella zoster virus infections."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "4 cases of acute severe VZV infection affecting the central nervous system or the lungs"
      explanation: >-
        Documents the paediatric primary-infection presentation of the same

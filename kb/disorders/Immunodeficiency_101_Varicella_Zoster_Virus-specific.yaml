classifications:
  harrisons_chapter:
  - classification_value: IMMUNE_RHEUMATOLOGIC
    notes: >-
      Placed with the immune disorders because the entity is an inborn error of
      innate antiviral immunity; the presenting illness is neurological, but the
      lesion is immunological and the susceptibility is what defines the disease.
infectious_agent:
- name: Varicella zoster virus
  infectious_agent_term:
    preferred_term: Human alphaherpesvirus 3
    term:
      id: NCBITaxon:10335
      label: Human alphaherpesvirus 3
  description: >-
    VZV is the alphaherpesvirus that causes varicella on primary infection and
    zoster on reactivation from latency in sensory ganglia. Its relevance here is
    not merely that it is the offending pathogen but that its genome is AT-rich,
    which is what makes it a substrate for POL III sensing and is the leading
    explanation for why this immunodeficiency is VZV-restricted rather than
    pan-viral.
  evidence:
  - reference: PMID:28783042
    reference_title: "Inborn errors in RNA polymerase III underlie severe varicella zoster virus infections."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "the causative agent of varicella (chickenpox) during primary infection and zoster (shingles) during reactivation from latency in sensory ganglia"
    explanation: >-
      Identifies the agent and both phases of its life cycle. The sentence's
      opening clause is not quoted because the cached typeset text hyphenates
      "alphaherpesvirus" across a line break.
  - reference: PMID:30211253
    reference_title: "Varicella-zoster virus CNS vasculitis and RNA polymerase III gene mutation in identical twins."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Varicella-zoster virus (VZV) is a human pathogenic alpha-herpesvirus causing chickenpox in children during primary infection and herpes zoster in elderly or immunocompromised individuals on reactivation from latency."
    explanation: >-
      States the two phases of the VZV life cycle, both of which this disorder
      can fail to control.
inheritance:
- name: Autosomal dominant inheritance
  description: >-
    Reported patients are HETEROZYGOUS for rare missense variants in a POL III
    subunit, which is why the condition is recorded as autosomal dominant. Two
    caveats belong with that label. Penetrance is plainly incomplete — most
    people carrying a rare POL III variant never develop severe VZV disease, and
    the disease requires the virus as well as the genotype. And one of the four
    children in the founding series was DIGENIC, carrying variants in both
    POLR3A and POLR3C, so a single heterozygous allele is not in every case the
    whole genetic explanation.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:28783042
    reference_title: "Inborn errors in RNA polymerase III underlie severe varicella zoster virus infections."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "unrelated, otherwise healthy children who are heterozygous for rare missense mutations in POLR3A (one patient), POLR3C (one patient), or both (two patients)"
    explanation: >-
      Establishes heterozygous inheritance and documents the digenic genotype in
      two of the four founding patients.
  - reference: PMID:28783042
    reference_title: "Inborn errors in RNA polymerase III underlie severe varicella zoster virus infections."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This work demonstrates that monogenic or digenic POLR3A and POLR3C deficiencies confer increased susceptibility to severe VZV disease in otherwise healthy children"
    explanation: >-
      The authors' own framing of the genotypes as monogenic or digenic, which is
      the basis for the digenic caveat in this block.
  - reference: PMID:30211253
    reference_title: "Varicella-zoster virus CNS vasculitis and RNA polymerase III gene mutation in identical twins."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mutation was inherited from the father"
    explanation: >-
      Documents vertical transmission of the POLR3F allele, establishing germline
      origin.
  - reference: PMID:30211253
    reference_title: "Varicella-zoster virus CNS vasculitis and RNA polymerase III gene mutation in identical twins."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "who was previously admitted to hospital with clinical signs and symptoms of stroke, which retrospectively might have been linked to VZV CNS vasculitis; however, this was not examined at the time"
    explanation: >-
      The transmitting father's status is genuinely undetermined - possibly
      affected, never investigated - which is why this entry describes penetrance
      as incomplete rather than asserting an unaffected carrier parent. Marked
      PARTIAL because the authors themselves only say it "might" have been.
pathophysiology:
- name: RNA Polymerase III Subunit Missense Variant
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    Rare heterozygous missense variants in genes encoding subunits of RNA
    polymerase III. Four subunits have been implicated in VZV susceptibility:
    POLR3A and POLR3C in children with severe primary VZV disease, POLR3A and
    POLR3E in adults with VZV CNS infection after reactivation, and POLR3F —
    the subunit on which OMIM anchors IMD101 — in monozygotic twins with
    recurrent VZV CNS vasculitis. The variants are damaging but not null: the
    functional assays show impaired, not abolished, responses, and POL III's
    housekeeping transcription of tRNAs and other small RNAs is evidently
    preserved enough to be compatible with life and with otherwise normal health.
  genes:
  - preferred_term: POLR3A
    term:
      id: hgnc:30074
      label: POLR3A
  - preferred_term: POLR3C
    term:
      id: hgnc:30076
      label: POLR3C
  - preferred_term: POLR3E
    term:
      id: hgnc:30347
      label: POLR3E
  - preferred_term: POLR3F
    term:
      id: hgnc:15763
      label: POLR3F
  genetic_context:
    gene:
      preferred_term: POLR3F
      term:
        id: hgnc:15763
        label: POLR3F
    allele_type: missense
    zygosity: HETEROZYGOUS
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
    description: >-
      The genetic context is written for POLR3F because that is the subunit on
      which OMIM and MedGen anchor the numbered IMD101 entity; the twins carried
      the heterozygous R50W substitution. PARTIAL_LOSS_OF_FUNCTION rather than
      LOSS_OF_FUNCTION is the honest category: the reported functional
      consequence is impaired antiviral and inflammatory responses and increased
      viral replication relative to controls, not abolished POL III function,
      and the housekeeping transcription these subunits also serve is evidently
      retained. The same category applies to the POLR3A, POLR3C and POLR3E
      alleles listed on this node.
    variant_origin: GERMLINE
    notes: >-
      `variant_origin: GERMLINE` is set on the strength of the POLR3F pedigree,
      in which Sanger sequencing placed the c.148C>T variant in both twins and in
      their father. That pedigree also carries the penetrance evidence: the
      father was previously admitted with stroke-like signs that the authors say
      might retrospectively have been VZV CNS vasculitis, but this was never
      investigated, so he is neither a confirmed affected transmitting parent nor
      a confirmed unaffected carrier. Origin is not asserted for the POLR3A,
      POLR3C or POLR3E alleles, whose parental testing is not reported in the
      cached sources.
  protein_complexes:
  - preferred_term: RNA polymerase III complex
    term:
      id: GO:0005666
      label: RNA polymerase III complex
  evidence:
  - reference: PMID:28783042
    reference_title: "Inborn errors in RNA polymerase III underlie severe varicella zoster virus infections."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report 4 cases of acute severe VZV infection affecting the central nervous system or the lungs in unrelated, otherwise healthy"
    explanation: >-
      Establishes the founding cohort and, in the phrase "otherwise healthy", the
      pathogen-restricted character of the susceptibility.
  - reference: PMID:34395528
    reference_title: "RNA Polymerase III Subunit Mutations in Genetic Diseases."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Mutations in the POLR3A, POLR3C, POLR3E and POLR3F subunits are associated with susceptibility to varicella zoster virus-induced encephalitis and pneumonitis."
    explanation: >-
      Enumerates the four implicated subunits, which is the basis for modelling
      them as one allelic series on this node.
  - reference: PMID:30211253
    reference_title: "Varicella-zoster virus CNS vasculitis and RNA polymerase III gene mutation in identical twins."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We performed whole-exome sequencing and identified a rare mutation in the POL III subunit POLR3F."
    explanation: >-
      Identifies the POLR3F variant on which OMIM anchors the numbered IMD101
      entity.
  - reference: PMID:30211253
    reference_title: "Varicella-zoster virus CNS vasculitis and RNA polymerase III gene mutation in identical twins."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "expression and solubility of the mutant POLR3F protein were unaltered compared with wild type, suggesting that the R50W mutation affects protein function, such as ligand recognition or enzymatic conversion of the adenosine-thymidine-rich DNA ligand into 5' triphosphorylated RNA, rather than expression of the POLR3F protein"
    explanation: >-
      Establishes that the disease allele impairs FUNCTION rather than protein
      abundance, which is the basis for typing it as a partial loss of function
      of the sensing activity rather than a loss of the subunit.
  downstream:
  - target: Impaired Cytosolic Sensing of AT-Rich VZV DNA
    causal_link_type: DIRECT
    description: >-
      The variants sit in the sensor itself, so the function that fails is
      recognition of AT-rich cytosolic DNA.
    evidence:
    - reference: PMID:30211253
      reference_title: "Varicella-zoster virus CNS vasculitis and RNA polymerase III gene mutation in identical twins."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The identified R50W POLR3F mutation is predicted by bioinformatics to be damaging, and when tested in functional assays, patient PBMCs exhibited impaired antiviral and inflammatory responses to the POL III agonist poly(dA:dT) and increased viral replication compared with controls."
      explanation: >-
        Links the variant directly to impaired responses to the AT-rich POL III
        agonist poly(dA:dT), which is the sensing step.
- name: Impaired Cytosolic Sensing of AT-Rich VZV DNA
  biological_scale: MOLECULAR
  role: central_effector
  description: >-
    RNA polymerase III has a second job beyond housekeeping transcription: in the
    cytosol it transcribes AT-rich double-stranded DNA into 5'-triphosphate RNA,
    which is a ligand for RIG-I and thus a trigger for type I interferon. This
    node is the failure of that recognition step. It is also the best available
    explanation for the disease's most striking feature — that the
    susceptibility is confined to one virus. VZV has an AT-rich genome, so it is
    the pathogen most dependent on this particular sensing route; patients do not
    have increased susceptibility to other infections.
  biological_processes:
  - preferred_term: innate immune response
    term:
      id: GO:0045087
      label: innate immune response
    modifier: DECREASED
  - preferred_term: transcription by RNA polymerase III
    term:
      id: GO:0006383
      label: transcription by RNA polymerase III
    modifier: DECREASED

  - reference: PMID:30211253
    reference_title: "Varicella-zoster virus CNS vasculitis and RNA polymerase III gene mutation in identical twins."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical presentation and findings included recurrent episodes of headache, dizziness, and neurologic deficits, CSF with pleocytosis and intrathecal VZV antibody production, and MRI of the brain showing ischemic lesions."
    explanation: >-
      Enumerates the clinical, CSF and imaging findings that define this node.
  - reference: PMID:30211253
    reference_title: "Varicella-zoster virus CNS vasculitis and RNA polymerase III gene mutation in identical twins."
    supports: SUPPORT
    evidence_source: OTHER

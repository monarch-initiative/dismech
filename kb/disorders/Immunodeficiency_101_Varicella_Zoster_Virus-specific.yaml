diagnosis:
- name: Cerebrospinal Fluid Intrathecal Anti-VZV IgG Index
  description: >-
    The diagnostic point that most often goes wrong in practice. In VZV CNS
    vasculitis, CSF PCR for VZV DNA is frequently NEGATIVE - in a case series of
    14 adults with cerebral vasculitis it was positive in only four - and both
    reported twins had negative CSF PCR. What establishes the diagnosis is a
    positive intrathecal anti-VZV IgG index together with compatible neurological
    symptoms and imaging. Treating a negative PCR as excluding VZV is therefore
    the way this diagnosis is missed.
  diagnosis_term:
    preferred_term: lumbar puncture
    term:
      id: NCIT:C15327
      label: Lumbar Puncture
  evidence:
  - reference: PMID:30211253
    reference_title: "Varicella-zoster virus CNS vasculitis and RNA polymerase III gene mutation in identical twins."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "it was reported that positive intrathecal anti-VZV IgG combined with relevant neurologic symptoms and imaging was a definite marker of this disease rather than VZV DNA detection by PCR because the latter was positive in only 4 of the patients"
    explanation: >-
      States that the intrathecal antibody index, not PCR, is the definite
      diagnostic marker, and gives the PCR yield that justifies it.
  - reference: PMID:30211253
    reference_title: "Varicella-zoster virus CNS vasculitis and RNA polymerase III gene mutation in identical twins."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the absence of detectable VZV by PCR in CSF is not surprising and is consistent with VZV CNS meningoencephalitis, including vasculitis"
    explanation: >-
      Makes explicit that a negative CSF PCR does not argue against the
      diagnosis.
- name: Brain and Spinal Magnetic Resonance Imaging
  description: >-
    Imaging demonstrates the ischemic consequences: infarcts, lacunar infarction,
    paraventricular and juxtacortical white-matter lesions, and in one twin
    spinal cord lesions. MR angiography is suggestive rather than conclusive, and
    histopathological confirmation of CNS vasculitis was not obtainable in either
    reported patient - so the diagnosis rests on the combination of imaging,
    intrathecal antibody and clinical course rather than on any single test.
  diagnosis_term:
    preferred_term: magnetic resonance imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:30211253
    reference_title: "Varicella-zoster virus CNS vasculitis and RNA polymerase III gene mutation in identical twins."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "signs of paraventricular parietal cerebral ischemic lesions on the left side with several small juxtacortical lesions bilaterally"
    explanation: >-
      Documents the imaging findings that support the diagnosis.
  - reference: PMID:30211253
    reference_title: "Varicella-zoster virus CNS vasculitis and RNA polymerase III gene mutation in identical twins."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "this diagnosis is rather difficult to make with certainty, and even MR angiography is only suggestive and not a conclusive evidence of this diagnosis"
    explanation: >-
      The authors' own statement of the diagnostic uncertainty, which is why this
      entry does not present imaging as confirmatory.
- name: Immunological Evaluation (to Exclude Broader Immunodeficiency)
  description: >-
    Routine immunological workup is NORMAL in this condition, and that negative
    result is diagnostically informative rather than merely reassuring: it is
    what distinguishes a pathogen-restricted innate sensing defect from the
    combined and phagocyte immunodeficiencies that also predispose to
    disseminated VZV. In the reported twins, immunoglobulins, lymphocyte
    distribution and lymphocyte proliferation were all normal and HIV testing was
    negative.
  diagnosis_term:
    preferred_term: laboratory procedure
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  evidence:
  - reference: PMID:30211253
    reference_title: "Varicella-zoster virus CNS vasculitis and RNA polymerase III gene mutation in identical twins."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A routine clinical immunologic evaluation was normal, including normal immunoglobulins, lymphocyte distribution and proliferation within the normal range, and a negative HIV test."
    explanation: >-
      Documents the normal immunological evaluation that frames this as a
      pathogen-restricted rather than general immunodeficiency.
  - reference: PMID:30211253
    reference_title: "Varicella-zoster virus CNS vasculitis and RNA polymerase III gene mutation in identical twins."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "they did not report any increased susceptibility to other viral, bacterial, or fungal infections, neither in the past nor at present"
    explanation: >-
      Documents the absence of broader infectious susceptibility, the clinical
      counterpart of the normal immunological workup.
- name: Exome Sequencing
  description: >-
    Whole-exome sequencing identified the causal variant in every reported case,
    and is the only way this diagnosis is made. It is worth considering in an
    otherwise immunologically normal person with severe or recurrent VZV CNS
    disease - a setting in which a genetic cause is not routinely sought.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:29728610
    reference_title: "Mutations in RNA Polymerase III genes and defective DNA sensing in adults with varicella-zoster virus CNS infection."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "By whole exome sequencing we identified mutations in POL III genes in two of eight patients."
    explanation: >-
      Gives the diagnostic yield of exome sequencing in a consecutive adult VZV
      CNS infection cohort.
  - reference: PMID:30211253
    reference_title: "Varicella-zoster virus CNS vasculitis and RNA polymerase III gene mutation in identical twins."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Because of this unusual presentation in both monozygotic twin sisters, we suspected a genetic etiology of the recurrent VZV CNS vasculitis."
    explanation: >-
      States the clinical trigger for genetic investigation - an unusual,
      recurrent VZV CNS presentation - which is the setting this entry recommends.
genetic:
- name: RNA polymerase III subunit variants
  gene_term:
    preferred_term: POLR3F
    term:
      id: hgnc:15763
      label: POLR3F
  association: Causative
  relationship_type: CAUSATIVE
  notes: >-
    OMIM #619872 and MedGen anchor IMD101 on POLR3F (20p11.23). The wider
    VZV-susceptibility allelic series spans four POL III subunits — POLR3A and
    POLR3C (severe primary VZV disease in children), POLR3A and POLR3E (adult
    VZV CNS infection after reactivation), POLR3F (recurrent adult CNS
    vasculitis, the OMIM anchor). Note that MONDO:0030813 records no causal-gene
    relationship of its own, so the gene anchor here comes from OMIM/MedGen; that
    gap is worth reporting upstream. Note also that other variants in some of the
    same genes cause an entirely different disease: POLR3A, POLR3B, POLR1C and
    POLR3K variants cause hypomyelinating leukodystrophy, with no reported VZV
    susceptibility. Any variant interpretation in these genes therefore has to
    ask which disease the allele belongs to, not merely whether the gene is
    disease-associated.
  variants:
  - name: POLR3F p.Arg50Trp (R50W)
    description: >-
      The OMIM-anchoring allele: a rare heterozygous missense change in the
      N-terminal region of POLR3F, in the winged-helix region of the POLR3F /
      POLR3C / POLR3G subcomplex required for POL III transcription initiation.
      Predicted damaging by PolyPhen-2 and SIFT with a CADD score of 25.8,
      against a mutation significance cutoff of 13.0 for this gene, and POLR3F
      itself appears to be under purifying selection. Critically, the mutant
      protein's expression and solubility are normal, so the allele impairs what
      the subunit DOES rather than how much of it there is.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:30211253
      reference_title: "Varicella-zoster virus CNS vasculitis and RNA polymerase III gene mutation in identical twins."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The mutation, R50W POLR3F, is rare and predicted to be damaging by bioinformatics software, such as PolyPhen-2 and SIFT and with a high combined annotation dependent depletion (CADD) score of 25.8, which is well above the mutation significance cutoff score of 13.0 for this gene."
      explanation: >-
        Names the allele and gives the in-silico support and the gene-specific
        significance threshold it exceeds.
    - reference: PMID:30211253
      reference_title: "Varicella-zoster virus CNS vasculitis and RNA polymerase III gene mutation in identical twins."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "causes an amino acid shift from the positively charged arginine (R) to a bulky aromatic tryptophan (W) in the N-terminal region of the POLR3F subunit, which together with POLR3C and POLR3G constitutes a POLR3 subcomplex essential for POLR3 promoter transcription initiation"
      explanation: >-
        Gives the physicochemical nature of the substitution and its structural
        context in the transcription-initiation subcomplex.
  evidence:
  - reference: PMID:34395528
    reference_title: "RNA Polymerase III Subunit Mutations in Genetic Diseases."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Mutations in the POLR3A, POLR3C, POLR3E and POLR3F subunits are associated with susceptibility to varicella zoster virus-induced encephalitis and pneumonitis."
    explanation: >-
      Enumerates the four subunits implicated in VZV susceptibility.
  - reference: PMID:30211253
    reference_title: "Varicella-zoster virus CNS vasculitis and RNA polymerase III gene mutation in identical twins."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "with the POLR3F variant c.148C>T present in P1, P2, and the father"
    explanation: >-
      Sanger segregation placing the variant in both affected twins and in their
      father, which is the basis for germline origin and for the caveat about
      incomplete penetrance in the inheritance block.
  - reference: PMID:34395528
    reference_title: "RNA Polymerase III Subunit Mutations in Genetic Diseases."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "an ever-increasing number of distinct mutations in the POLR3A, POLR3B, POLR1C and POLR3K subunits cause a spectrum of neurodegenerative diseases, which includes most notably hypomyelinating leukodystrophy"
    explanation: >-
      Documents the allelic-series problem: the same genes carry variants causing
      a mechanistically unrelated neurodegenerative disease.
  - reference: PMID:30211253
    reference_title: "Varicella-zoster virus CNS vasculitis and RNA polymerase III gene mutation in identical twins."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "identified a rare mutation in the POL III subunit POLR3F"
    explanation: >-
      Identifies the POLR3F variant underlying the OMIM-anchored presentation.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Published cases number in the single figures: four children in the founding
    series (POLR3A and/or POLR3C), two of eight sequenced adults with VZV CNS
    infection (POLR3A, POLR3E), and one monozygotic twin pair (POLR3F). No
    population prevalence estimate exists, and none is straightforward to derive,
    because the phenotype requires both a rare genotype and exposure to a
    near-universal virus, with plainly incomplete penetrance. For context on the
    denominator, VZV CNS infection and pneumonia complicate roughly 0.02% and
    0.25% of childhood primary infections respectively — most of which are not
    POL III deficient.
  evidence:
  - reference: PMID:29728610
    reference_title: "Mutations in RNA Polymerase III genes and defective DNA sensing in adults with varicella-zoster virus CNS infection."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "By whole exome sequencing we identified mutations in POL III genes in two of eight patients."
    explanation: >-
      Gives the yield in a consecutive adult VZV CNS infection cohort, which is
      the only denominator-bearing figure available.
experimental_models:
- name: POLR3F+/- SH-SY5Y human neuronal cell model
  experimental_model_type: CELL_LINE
  description: >-
    Human SH-SY5Y neuroblastoma cells engineered to POLR3F heterozygous knockout,
    used both as differentiated neurons in acute VZV infection and in a quiescent
    infection model that permits spontaneous reactivation to be quantified. This
    is the only model that addresses the reactivation arm directly.
  modeled_mechanisms:
  - target: VZV Reactivation from Latency
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      POLR3F-heterozygous neuronal cells show higher viral gene expression and
      more spontaneous VZV reactivation than wild type, which the authors
      describe as reflecting the patient phenotype.
    limitations: >-
      SH-SY5Y is a neuroblastoma line rather than a sensory ganglion neuron, and
      the quiescent-infection system is a surrogate for latency rather than
      latency itself. The genotype is an engineered heterozygous knockout, not
      the patients' R50W missense allele, so the model tests gene dosage rather
      than the specific human variant. Effects were noted in early-passage cells.
    readouts:
    - name: VZV gene expression by RT-qPCR
      target: VZV Reactivation from Latency
      direction: INCREASED
      interpretation: >-
        Higher viral gene expression in POLR3F+/- neuronal cells is the acute
        infection readout of impaired restraint.
      evidence:
      - reference: PMID:41739639
        reference_title: "RNA Polymerase III Suppresses Varicella Zoster Virus in Human Neurons."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "resulted in higher viral gene expression and more VZV reactivation in the POLR3F neuronal heterozygous (POLR3F+/-) knockout cells"
        explanation: >-
          Reports the direction of both measurements in the model.
    - name: Spontaneous reactivation from quiescent infection
      target: VZV Reactivation from Latency
      direction: INCREASED
      interpretation: >-
        Increased spontaneous reactivation is the readout that makes this model
        informative for the reactivation node specifically.
      evidence:
      - reference: PMID:41739639
        reference_title: "RNA Polymerase III Suppresses Varicella Zoster Virus in Human Neurons."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "We also established a quiescent infection model and quantified spontaneous reactivation by detection of viral proteins fused to fluorophores."
        explanation: >-
          Describes the assay behind the reactivation readout.
    evidence:
    - reference: PMID:41739639
      reference_title: "RNA Polymerase III Suppresses Varicella Zoster Virus in Human Neurons."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "This work identifies a novel role for POLR3F as a sentinel for VZV reactivation in neuronal cells"
      explanation: >-
        The authors' statement of what the model establishes, which is what makes
        it informative for this node.
- name: Patient peripheral blood mononuclear cells with wild-type allele rescue
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: >-
    Primary patient leukocytes stimulated with the POL III agonist poly(dA:dT),
    with VZV-derived DNA, or infected with VZV, and compared against healthy
    controls. In the founding study the defective phenotypes were rescued by
    transduction with the relevant wild-type allele, which is what converts an
    association into a causal claim.
  modeled_mechanisms:
  - target: Deficient Type I Interferon Induction
    relationship: MEASURES
    fidelity: HIGH
    description: >-
      Direct measurement in patient cells of the interferon and cytokine defect,
      with genetic rescue.
    limitations: >-
      Peripheral blood mononuclear cells are not the cell type in which the
      disease manifests — the lesion presents in cerebral arteries and neurons —
      so the assay establishes the cell-intrinsic defect rather than its tissue
      consequence. Rescue was reported for the founding POLR3A/POLR3C patients;
      no equivalent rescue is reported for the POLR3F twins.
    readouts:
    - name: Interferon induction by synthetic and VZV-derived DNA
      target: Deficient Type I Interferon Induction
      direction: DECREASED
      interpretation: >-
        Poor interferon induction to both agonists is the defining laboratory
        phenotype of the disorder.
      evidence:
      - reference: PMID:28783042
        reference_title: "Inborn errors in RNA polymerase III underlie severe varicella zoster virus infections."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Leukocytes from all 4 patients tested exhibited poor IFN induction in response to synthetic or VZV-derived DNA."
        explanation: >-
          Reports the direction and the stimuli.
    - name: Interferon phenotype after wild-type allele transduction
      target: Deficient Type I Interferon Induction
      direction: RESTORED
      interpretation: >-
        Restoration on transduction with the wild-type allele is the causal test.
      evidence:
      - reference: PMID:28783042
        reference_title: "Inborn errors in RNA polymerase III underlie severe varicella zoster virus infections."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "These phenotypes were rescued by transduction with relevant WT alleles."
        explanation: >-
          Reports the rescue result.
    evidence:
    - reference: PMID:28783042
      reference_title: "Inborn errors in RNA polymerase III underlie severe varicella zoster virus infections."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "confer increased susceptibility to severe VZV disease in otherwise healthy children, providing evidence for an essential role of a DNA sensor in human immunity"
      explanation: >-
        The authors frame the patient-cell work as evidence for an essential role
        of a DNA sensor in human immunity, which is what this model measures.
treatments:
- name: Acyclovir
  description: >-
    Antiviral therapy is the mainstay, and OMIM's own summary of IMD101 states
    that treatment with acyclovir is effective. Two qualifiers belong with that
    word. Even with acyclovir, the incidence and severity of sequelae after
    severe VZV infection are considerable, so effective is not curative, and
    nothing available treats the underlying sensing defect. And in the reported
    twins the benefit was not durable: both had a good clinical response during
    episodes but relapsed with new symptoms AND new MRI lesions when acyclovir
    was discontinued. In a host whose cell-intrinsic control of VZV is
    permanently impaired, that is what one would expect, and it is the argument
    for continued rather than episodic antiviral therapy - though no trial has
    tested a suppression strategy in this disorder.
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: aciclovir
      term:
        id: CHEBI:2453
        label: acyclovir
  target_mechanisms:
  - target: Failure to Restrict VZV Replication
    treatment_effect: INHIBITS
    description: >-
      Acyclovir suppresses viral replication pharmacologically, substituting for
      the cell-intrinsic restraint that the sensing defect removes. It does not
      repair the sensor, which is why the mechanism node it acts on is the
      replication node and not an upstream one.
    evidence:
    - reference: PMID:28783042
      reference_title: "Inborn errors in RNA polymerase III underlie severe varicella zoster virus infections."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Antiviral therapy with acyclovir is used for treatment of VZV encephalitis"
      explanation: >-
        Establishes acyclovir as the treatment for the VZV manifestations this
        disorder produces. The quote stops before "pneumonitis" because the
        cached typeset text hyphenates that word across a line break.
  evidence:
  - reference: PMID:28783042
    reference_title: "Inborn errors in RNA polymerase III underlie severe varicella zoster virus infections."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "However, despite treatment with acyclovir, the incidence and severity of sequelae following severe VZV infection are considerable"
    explanation: >-
      The qualifier that belongs with calling acyclovir effective: sequelae after
      severe VZV infection remain considerable despite it.
  - reference: PMID:30211253
    reference_title: "Varicella-zoster virus CNS vasculitis and RNA polymerase III gene mutation in identical twins."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "both patients described in the present study have a good clinical response to acyclovir and corticosteroid treatment during clinical episodes but experience recurrence of symptoms and new MRI lesions during discontinuation of acyclovir"
    explanation: >-
      The single most clinically actionable observation in this disorder: the
      response to acyclovir is good but not durable, and stopping it produced
      both symptomatic recurrence and new imaging lesions in both twins. This is
      the argument for continued rather than episodic antiviral therapy.
- name: Corticosteroids During Acute Vasculitic Episodes
  description: >-
    Corticosteroids were given alongside acyclovir during acute episodes in the
    reported twins, on the reasoning that the presentation is an inflammatory
    vasculitis and not simply viral replication. The index patient received
    prednisolone 50 mg daily for 10 days with acyclovir 10 mg/kg three times
    daily for 14 days, and the authors report good clinical response to the
    combination. Two cautions belong with this. The contribution of the steroid
    cannot be separated from that of the antiviral in a two-patient series. And
    immunosuppression in a patient who already fails to control VZV is not a
    neutral act - it is given here for the vasculitic component, under antiviral
    cover, not as monotherapy.
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: prednisolone
      term:
        id: CHEBI:8378
        label: prednisolone
  target_mechanisms:
  - target: VZV Vasculopathy of Cerebral Arteries
    treatment_effect: MODULATES
    description: >-
      Corticosteroids act on the inflammatory arterial lesion rather than on the
      virus or on the sensing defect, which is why the mechanism target is the
      vasculopathy node and why the treatment is given under antiviral cover.
    evidence:
    - reference: PMID:30211253
      reference_title: "Varicella-zoster virus CNS vasculitis and RNA polymerase III gene mutation in identical twins."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "The patient was treated with acyclovir 10 mg/kg tds for 14 days together with corticosteroids (prednisolone 50 mg once daily for 10 days) because the clinical presentation was interpreted as CNS vasculitis."
      explanation: >-
        Documents the regimen and, crucially, the stated reason for adding the
        steroid - the vasculitic interpretation of the presentation. Marked
        PARTIAL because this is a treatment decision in a two-patient series, not
        evidence of steroid efficacy.
  evidence:
  - reference: PMID:30211253
    reference_title: "Varicella-zoster virus CNS vasculitis and RNA polymerase III gene mutation in identical twins."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "good clinical response to acyclovir and corticosteroid treatment during clinical episodes"
    explanation: >-
      Reports the response to the combination. PARTIAL because the steroid's
      individual contribution is not separable from the antiviral's.
- name: Genetic Testing and Counseling
  description: >-
    Whole-exome or targeted POL III sequencing is how every reported case was
    identified, and it is worth considering in an otherwise healthy person with
    severe or recurrent VZV CNS disease. Counseling has to convey two things that
    make this condition unusual: penetrance is plainly incomplete and the
    phenotype requires the virus as well as the genotype, so a carrier relative
    is not a patient-in-waiting; and a variant in one of these genes may belong
    to a different disease entirely, since POLR3A and several other POL III
    subunits also carry variants causing hypomyelinating leukodystrophy.
  action_category: COUNSELING_INFORMATIONAL
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:29728610
    reference_title: "Mutations in RNA Polymerase III genes and defective DNA sensing in adults with varicella-zoster virus CNS infection."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "By whole exome sequencing we identified mutations in POL III genes in two of eight patients."
    explanation: >-
      Demonstrates the diagnostic yield of exome sequencing in adults presenting
      with VZV CNS infection, which is the basis for testing in that setting.
  - reference: PMID:34395528
    reference_title: "RNA Polymerase III Subunit Mutations in Genetic Diseases."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "an ever-increasing number of distinct mutations in the POLR3A, POLR3B, POLR1C and POLR3K subunits cause a spectrum of neurodegenerative diseases"
    explanation: >-
      Supports the counseling point that a POL III variant may belong to a
      different disease entity than this one.
discussions:
- discussion_id: imd101_nosology_primary_versus_reactivation
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Are severe PRIMARY VZV disease in POL III-deficient children and adult VZV
    REACTIVATION vasculitis one disease entity or two, and does MONDO:0030813
    cover both?
  attaches_to:
  - "pathophysiology#Failure to Restrict VZV Replication"
  rationale: >-
    OMIM's summary of IMD101 is written entirely around adult reactivation —
    reactivation in adulthood after primary childhood infection, presenting as
    CNS vasculitis — and MedGen anchors the entity on POLR3F. But the founding
    literature is paediatric and primary-infection, in POLR3A and POLR3C, and the
    review literature treats all four subunits as one susceptibility. The
    neuronal model complicates rather than settles this: its authors conclude
    that POL III matters to VZV immunity MAINLY UPON REACTIVATION, which if
    correct would make the paediatric primary-infection cases the harder ones to
    explain by this mechanism, not the easier. This entry curates both arms off a
    shared upstream chain and flags the question rather than choosing an answer,
    because the choice determines whether the paediatric POLR3A/POLR3C cases
    belong under this MONDO concept at all.
  proposed_experiments:
  - experiment_id: exp_imd101_lifecycle_stage_comparison
    name: Stage-resolved comparison of POL III dependence in primary versus reactivating VZV infection
    description: >-
      In matched neuronal and non-neuronal human cells carrying POLR3A, POLR3C,
      POLR3E and POLR3F patient alleles, quantify interferon induction and viral
      control separately during de novo infection and during reactivation from a
      quiescent state, to test whether the subunits differ in which life-cycle
      stage they gate — which would be the mechanistic basis for splitting or
      lumping the two clinical presentations.
  evidence:
  - reference: PMID:41739639
    reference_title: "RNA Polymerase III Suppresses Varicella Zoster Virus in Human Neurons."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "POL III) plays a role in immunity to VZV mainly upon reactivation in humans"
    explanation: >-
      The claim that POL III acts mainly at reactivation, which is what puts the
      paediatric primary-infection arm in question.
  - reference: PMID:28783042
    reference_title: "Inborn errors in RNA polymerase III underlie severe varicella zoster virus infections."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "4 cases of acute severe VZV infection affecting the central nervous system or the lungs"
    explanation: >-
      The paediatric primary-infection cases that the reactivation-centred
      framing has to accommodate.
- discussion_id: imd101_no_model_of_the_affected_tissue
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Every model of this disease is a model of the wrong compartment. Does
    evidence from circulating leukocytes and a neuroblastoma line license claims
    about cerebral arteries and sensory ganglia, which is where the disease
    actually happens?
  attaches_to:
  - "pathophysiology#VZV Vasculopathy of Cerebral Arteries"
  rationale: >-
    The functional evidence in this entry comes from two sources, and neither is
    the affected tissue. Patient peripheral blood mononuclear cells give the
    cleanest genotype-phenotype link - impaired interferon and cytokine responses
    to the POL III agonist, intact responses to a ligand that bypasses POL III,
    increased viral transcript - but they are circulating mixed cells, not
    neurons, ganglia, or cerebral arterial endothelium. The SH-SY5Y model reaches
    the neuronal compartment and the reactivation step, but it is a
    neuroblastoma line carrying an engineered heterozygous knockout rather than
    the patients' R50W missense allele, so it tests gene dosage rather than the
    human variant. No animal model of this disorder exists, and no
    histopathological confirmation of the CNS vasculitis was obtainable in either
    reported patient. The vasculopathy node is therefore supported by clinical,
    CSF and imaging evidence in humans and by mechanistic evidence in the wrong
    cell types, with nothing bridging the two.
  proposed_experiments:
  - experiment_id: exp_imd101_patient_ipsc_neurovascular_model
    name: Patient-derived iPSC neurons and brain microvascular endothelial cells carrying R50W
    description: >-
      Differentiate iPSCs from an R50W carrier, and isogenic corrected controls,
      into sensory-type neurons and brain microvascular endothelial cells; assay
      VZV infection, latency establishment, reactivation, interferon induction
      and endothelial activation in each. This would test the disease mechanism
      in the two cell types the disease actually damages, with the patient's own
      allele rather than a knockout.
  evidence:
  - reference: PMID:30211253
    reference_title: "Varicella-zoster virus CNS vasculitis and RNA polymerase III gene mutation in identical twins."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "histopathologic evidence of vasculitis in the CNS could not be provided in the 2 cases described here"
    explanation: >-
      Establishes that the tissue diagnosis was never obtained, which is one half
      of the gap this discussion records.
  - reference: PMID:41739639
    reference_title: "RNA Polymerase III Suppresses Varicella Zoster Virus in Human Neurons."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "We generated human SH-SY5Y (POLR3F+/-) knockout cells."
    explanation: >-
      Identifies the only neuronal model as an engineered knockout line rather
      than a patient-allele or animal model, which is the other half of the gap.
- discussion_id: imd101_pol_iii_genotype_phenotype
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why do variants in POL III subunits produce either VZV susceptibility or
    hypomyelinating leukodystrophy, and what determines which, given that both
    perturb the same nine-subunit enzyme?
  attaches_to:
  - "pathophysiology#RNA Polymerase III Subunit Missense Variant"
  rationale: >-
    POL III subunit variants cause tissue-specific diseases rather than a general
    failure of the enzyme's vital functions, and the two disease groups barely
    overlap clinically: POLR3A appears in both lists, but VZV-susceptible
    patients do not have leukodystrophy and leukodystrophy patients are not
    reported to have VZV susceptibility. The review literature states plainly
    that the exact molecular mechanisms underlying disease pathogenesis remain
    enigmatic. This matters practically as well as conceptually: it means a
    variant in POLR3A cannot be interpreted without knowing which disease
    mechanism it engages, and it is the reason this entry's counseling entry
    carries that warning.
  proposed_experiments:
  - experiment_id: exp_imd101_subunit_allele_function_partition
    name: Partitioned assay of housekeeping versus DNA-sensing POL III function across disease alleles
    description: >-
      Assay VZV-susceptibility alleles and leukodystrophy alleles side by side
      for tRNA/small-RNA transcription on the one hand and cytosolic AT-rich DNA
      sensing with interferon induction on the other, to test whether the two
      disease groups separate along the housekeeping/sensing axis rather than by
      subunit identity.
  evidence:
  - reference: PMID:34395528
    reference_title: "RNA Polymerase III Subunit Mutations in Genetic Diseases."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "it was discovered in the last decade that various inherited mutations in genes encoding nine distinct subunits of Pol III cause tissue-specific diseases rather than a general failure of all vital functions"
    explanation: >-
      States the puzzle: subunit variants give tissue-specific disease rather
      than global enzyme failure.
  - reference: PMID:34395528
    reference_title: "RNA Polymerase III Subunit Mutations in Genetic Diseases."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "the exact molecular mechanisms underlying disease pathogenesis remain enigmatic"
    explanation: >-
      The authors' own statement that the mechanism partitioning these diseases
      is unresolved.
notes: >-
  Identifier and gene anchor. MONDO:0030813 carries no causal-gene relationship;
  OMIM #619872 and MedGen (CUI C5676983) both associate IMD101 with POLR3F at
  20p11.23. The gene anchor in this entry therefore comes from OMIM/MedGen. That
  MONDO gap is worth reporting upstream and is not a curation choice made here.


  Scope. The entry models the POL III VZV-susceptibility mechanism as one chain
  across POLR3A, POLR3C, POLR3E and POLR3F, because the reported variants in all
  four produce the same sensing defect and the same pathogen-restricted
  susceptibility. Whether the paediatric primary-infection arm and the adult
  reactivation arm are one MONDO concept is recorded as an open question in the
  discussions rather than decided silently.


  Evidence mechanics. The PMID:28783042 cache is `full_text_xml` of a typeset
  PDF, so words are hyphenated across line breaks ("alphaherpes-virus",
  "pneu-monitis", "infec-tion"). Snippet matching normalizes ordinary line breaks
  but not those intra-word hyphens, so every quote from that source is bounded to
  stop short of a hyphenated word rather than reproduce the break. Where that
  clipped the opening clause of a sentence, the clipped part is stated in the
  surrounding description and the reason is given in the evidence explanation.


  No `datasets:` block. No disease-specific omics accession was identified; the
  published work is targeted functional immunology rather than deposited
  datasets, and searching the POL III gene names alone would surface
  leukodystrophy and cancer datasets, which is the Named Entity Confusion hazard
  the dataset SOP warns about.


  No ORPHA evidence asserted. `just refresh-orphadata` is currently failing on a
  manifest checksum mismatch and no cached ORPHA record for this concept was
  available.

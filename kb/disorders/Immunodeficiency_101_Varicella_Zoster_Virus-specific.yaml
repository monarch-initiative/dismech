- name: VZV Reactivation from Latency
  biological_scale: TISSUE
  role: effector
  description: >-
    VZV establishes latency in sensory ganglia after primary infection and
    reactivates from there. In POL III deficiency the reactivation arm is what
    produces the defining adult phenotype, and a neuronal knockout model shows
    both higher viral gene expression and more spontaneous reactivation in
    POLR3F-heterozygous cells. Note the model's own framing: it supports POL III
    mattering to VZV immunity MAINLY UPON REACTIVATION, which is a claim about
    where in the viral life cycle the sensor is rate-limiting and should not be
    flattened into "POL III controls VZV".
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:41739639
    reference_title: "RNA Polymerase III Suppresses Varicella Zoster Virus in Human Neurons."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This work identifies a novel role for POLR3F as a sentinel for VZV reactivation in neuronal cells and lends further support to the hypothesis that polymerase III (POL III) plays a role in immunity to VZV mainly upon reactivation in humans and that POL III defects predispose to VZV central nervous system infection."
    explanation: >-
      States the reactivation-specific role and the resulting predisposition to
      CNS infection, with the authors' own hedge on where in the life cycle POL
      III acts.
  downstream:
  - target: VZV Vasculopathy of Cerebral Arteries
    causal_link_type: DIRECT
    description: >-
      Reactivated VZV productively infects cerebral arteries, which is the lesion
      behind the stroke-like presentation.
    evidence:
    - reference: PMID:30211253
      reference_title: "Varicella-zoster virus CNS vasculitis and RNA polymerase III gene mutation in identical twins."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "we describe a pair of monozygotic female twins, who both experienced severe recurrent CNS vasculitis caused by VZV reactivation"
      explanation: >-
        Attributes recurrent CNS vasculitis directly to VZV reactivation in the
        POLR3F patients.
- name: VZV Vasculopathy of Cerebral Arteries
  biological_scale: TISSUE
  role: consequence
  description: >-
    Productive VZV infection of cerebral arteries produces a vasculitis affecting
    large vessels, small vessels, or both. The consequence is ischemic injury,
    which is why an immunodeficiency presents to a stroke service. Cerebrospinal
    fluid in the reported twins showed pleocytosis with intrathecal VZV antibody
    production, and brain MRI showed ischemic lesions.
  locations:
  - preferred_term: artery
    term:
      id: UBERON:0001637
      label: artery
  - preferred_term: brain
    term:
      id: UBERON:0000955
      label: brain

name: Immunodeficiency 101 (Varicella Zoster Virus-Specific)
creation_date: "2026-08-25T00:00:00Z"
category: Mendelian
synonyms:
- IMD101
- RNA polymerase III deficiency with varicella zoster virus susceptibility
- POL III deficiency, VZV-specific
description: >-
  Immunodeficiency-101 is a monogenic susceptibility to severe varicella zoster
  virus (VZV) disease, and it is unusual among the inborn errors of immunity in
  being genuinely pathogen-specific: affected individuals are not broadly
  infection-prone, they fail at one virus. The defect lies in RNA polymerase III,
  which besides its housekeeping job of transcribing tRNAs and other small
  untranslated RNAs also acts as a CYTOSOLIC SENSOR OF AT-RICH
  DOUBLE-STRANDED DNA. Sensing DNA is what makes it immunologically relevant:
  POL III transcribes AT-rich cytosolic DNA into 5'-triphosphate RNA that
  triggers RIG-I-dependent type I interferon induction. Rare heterozygous
  missense variants in POL III subunits impair that sensing, interferon
  induction to synthetic AT-rich DNA and to VZV-derived DNA falls, and patient
  cells lose control of VZV replication. Clinically this presents at two points
  in the viral life cycle: severe primary VZV disease of the CNS or lungs in
  otherwise healthy children, and — the presentation on which the numbered OMIM
  entity is defined — VZV reactivation in adulthood producing recurrent CNS
  vasculitis with stroke-like episodes, headache, hemiparesis, impaired balance
  and ischemic lesions on brain imaging. Acyclovir is effective, but sequelae
  after severe VZV disease remain considerable despite it.


  Identifier note, and a MONDO gap worth recording: MONDO:0030813 carries NO
  causal-gene relationship at all, while OMIM #619872 and MedGen both anchor
  IMD101 on POLR3F at 20p11.23 — the subunit mutated in the monozygotic twins
  with recurrent VZV CNS vasculitis. This entry therefore takes its gene anchor
  from OMIM/MedGen rather than from MONDO, and models the wider POL III allelic
  series (POLR3A, POLR3C, POLR3E, POLR3F) as one mechanism, because the reported
  variants across those four subunits produce the same sensing defect and the
  same VZV-restricted susceptibility. Whether the paediatric primary-infection
  cases and the adult reactivation cases are one MONDO concept or two is an open
  nosological question and is recorded as such rather than silently decided.

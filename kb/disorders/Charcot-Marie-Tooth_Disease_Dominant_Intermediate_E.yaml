    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Individuals with CMT manifest symmetric, slowly progressive distal motor neuropathy of the arms and legs usually beginning in the first to third decade and resulting in weakness and atrophy of the muscles in the feet and/or hands."
    explanation: >-

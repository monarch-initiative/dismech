    reference_title: "INF2 mutations in Charcot-Marie-Tooth disease with glomerulopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "INF2 encodes a formin protein that interacts with the Rho-GTPase CDC42 and myelin and lymphocyte protein (MAL) that are implicated in essential steps of myelination and myelin maintenance."
    explanation: >-
      Attributes the myelination role to the two partners, which is the step that connects the
      cytoskeletal lesion to a myelin phenotype.
  - reference: PMID:25943269
    reference_title: "INF2 mutations associated with dominant inherited intermediate Charcot-Marie-Tooth neuropathy with focal segmental glomerulosclerosis in two Chinese patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ultrastructurally, numerous elongated extensions of Schwann cells of unmyelinated fibers could be seen in both patients."
    explanation: >-
      Shows the Schwann cell abnormality is not confined to the myelinating compartment, which
      is why this node is about the cell rather than about myelin alone.
- name: Demyelination with Onion Bulbs and Secondary Axonal Loss
  biological_scale: TISSUE
  description: >-
    The nerve-level lesion. Sural nerve biopsy shows moderate-to-severe loss of myelinated
    fibres with onion bulbs and regeneration clusters, the histological signature of repeated
    demyelination and remyelination with axonal dropout. Clinically and electrophysiologically
    this reads as an intermediate neuropathy, with demyelinating and axonal features present
    together rather than one or the other.

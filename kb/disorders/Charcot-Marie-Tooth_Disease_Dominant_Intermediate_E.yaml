    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:30962575
    reference_title: "A complex containing lysine-acetylated actin inhibits the formin INF2."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Inhibition of INF2 by CAP-KAc-actin is dependent on the INF2 diaphanous inhibitory domain (DID)."
    explanation: >-
      Demonstrates dependence of CAP-KAc-actin inhibition on the DID in the tested biochemical system.
    quote_role: PRIMARY_RESULT
  - reference: PMID:30962575
    reference_title: "A complex containing lysine-acetylated actin inhibits the formin INF2."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Disease-associated INF2 mutants are poorly inhibited by CAP-KAc-actin, suggesting that focal segmental glomerulosclerosis and Charcot-Marie-Tooth disease result from reduced CAP-KAc-actin binding."
    explanation: >-
      The mechanistic claim itself, tested on the disease alleles rather than on a designed DID mutant.
    quote_role: PRIMARY_RESULT
  - reference: PMID:30962575
    reference_title: "A complex containing lysine-acetylated actin inhibits the formin INF2."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We therefore asked whether CAP/actin could inhibit two INF2 mutants: R218Q, a common FSGS mutant22; and L77R, a CMTD mutant23."
    explanation: >-
      Identifies the CMT-associated L77R and renal-associated R218Q alleles actually tested.
    quote_role: PRIMARY_RESULT
  - reference: PMID:30962575
    reference_title: "A complex containing lysine-acetylated actin inhibits the formin INF2."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "CAP/CSKA displays reduced inhibition of both mutants biochemically, with R218Q being particularly resistant"
    explanation: >-
      The result for that pair. Both alleles escape inhibition, so the CMT allele carries the mechanism
      too; the FSGS allele is the more resistant of the two, which is a quantitative difference and not
      a difference in kind.
    quote_role: PRIMARY_RESULT
  - reference: PMID:30962575
    reference_title: "A complex containing lysine-acetylated actin inhibits the formin INF2."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "Fixed-cell analysis shows that both mutants display significantly higher cytosolic actin filaments than WT-INF2"
    explanation: >-
      L77R and R218Q nonCAAX constructs were expressed in INF2-knockout U2OS cells; this is an allele-
      and system-specific result.
- name: Enhanced Calmodulin Binding to INF2
  biological_scale: MOLECULAR
  description: >-
    A CMT-associated INF2 mutant showed increased binding to calcium-bound calmodulin. Structural and
    biochemical work identifies CaM binding to the DID as an allosteric route that disrupts DID-DAD autoinhibition
    and activates actin assembly. The available abstract does not identify the tested disease allele,
    so this result is not generalized to all INF2 variants.
  evidence:
  - reference: PMID:42545850
    reference_title: "Mechanistic basis for calmodulin‑dependent allosteric activation of the neuropathy-associated formin INF2."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "We further demonstrate that a Charcot-Marie-Tooth neuropathy-associated INF2 mutation enhances Ca2+-CaM binding through optimized interfacial dynamics, revealing a gain-of-function disease mechanism."
    explanation: >-
      The disease-mutant binding result supports altered regulation; the abstract does not name the allele.
  - reference: PMID:42545850
    reference_title: "Mechanistic basis for calmodulin‑dependent allosteric activation of the neuropathy-associated formin INF2."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "Ca2+-CaM binding induces conformational changes that disrupt the autoinhibitory DID-DAD interaction, triggering its actin assembly activity."
    explanation: >-
      Provides the experimentally proposed regulatory connection to actin assembly.
- name: Disruption of the INF2-MAL-CDC42 Pathway in Schwann Cells
  biological_scale: CELLULAR
  description: >-
    INF2 is strongly expressed in Schwann-cell cytoplasm, where it colocalises and interacts with myelin
    and lymphocyte protein (MAL) and engages the Rho-family GTPase CDC42 - both of them proteins implicated
    in myelination and myelin maintenance. Mutant INF2 perturbs this three-way pathway: the cytoskeleton
    is disorganised, INF2 binding to CDC42 is enhanced, and INF2, MAL and CDC42 are all mislocalised.
  cell_types:
  - preferred_term: Schwann cell
    term:
      id: CL:0002573
      label: Schwann cell
  biological_processes:
  - preferred_term: Rho protein signal transduction
    modifier: ABNORMAL
    term:
      id: GO:0007266
      label: Rho protein signal transduction
  - preferred_term: regulation of actin cytoskeleton organization
    modifier: ABNORMAL
    term:
      id: GO:0032956
      label: regulation of actin cytoskeleton organization
  downstream:
  - target: Schwann Cell Actinopathy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:22187985
    reference_title: "INF2 mutations in Charcot-Marie-Tooth disease with glomerulopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Immunohistochemical analysis revealed strong INF2 expression in Schwann-cell cytoplasm and podocytes."
    explanation: >-
      Shows INF2 expression in the affected cell populations; expression alone does not establish causation
      or cell autonomy.
    quote_role: PRIMARY_RESULT
  - reference: PMID:22187985
    reference_title: "INF2 mutations in Charcot-Marie-Tooth disease with glomerulopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Moreover, we demonstrated that INF2 colocalizes and interacts with MAL in Schwann cells."
    explanation: >-
      The physical interaction that makes MAL part of this node rather than a bystander.
    quote_role: PRIMARY_RESULT
  - reference: PMID:22187985
    reference_title: "INF2 mutations in Charcot-Marie-Tooth disease with glomerulopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The INF2 mutants perturbed the INF2-MAL-CDC42 pathway, resulting in cytoskeleton disorganization, enhanced INF2 binding to CDC42 and mislocalization of INF2, MAL, and CDC42."
    explanation: >-
      Reports mutant-associated cytoskeletal and protein-localization effects; enhanced CDC42 binding

    snippet: "The R218Q mutation in INF2 disrupted sequestration of Dynll1 by INF2, allowing Dynll1 to be captured by PI31 and promoting dynein-mediated transport of nephrin to the proteasome."
    explanation: >-
      The mechanism itself. Graded INDIRECT because R218Q is an FSGS-range allele and this
      entry is about the CMT-range alleles; the inference that the same route operates in
      CMTDIE podocytes is not tested.
  - reference: PMID:39621430
    reference_title: "Dynll1-PI31 Interaction Enhances Proteolysis Through the Proteasome, Representing a Novel Therapeutic Target for INF2-Related FSGS."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "In R218Q KI mice challenged with puromycin aminonucleoside, dynein-mediated mistrafficking and depletion of nephrin were correlated with increased Dynll1-PI31 interaction; the resulting podocytopathy and FSGS were ameliorated by bortezomib."
    explanation: >-
      The in vivo rescue, which is what makes the pathway a plausible drug target rather than a

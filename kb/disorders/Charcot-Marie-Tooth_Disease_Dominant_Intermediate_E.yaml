    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Podocyte Actin Cytoskeleton Disorganization
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Dynein-Mediated Nephrin Mistrafficking
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Sustained MRTF-SRF Transcriptional Activation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:22187985
    reference_title: "INF2 mutations in Charcot-Marie-Tooth disease with glomerulopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified nine new heterozygous mutations in 12 of the 16 index patients (75%), all located in exons 2 and 3, encoding the diaphanous-inhibitory domain of INF2."
    explanation: >-
      The founding allelic series and its confinement to the regulatory domain.
    quote_role: PRIMARY_RESULT
  - reference: PMID:32451589
    reference_title: "The formin INF2 in disease: progress from 10 years of research."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "All known INF2 gene mutations causing disease map to the exons encoding the amino-terminal domain."
    explanation: >-
      A systematic exon-by-exon review confirming the localisation across the whole reported mutation
      set, not just the founding cohort.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:30680856
    reference_title: "A cryptic splicing mutation in the INF2 gene causing Charcot-Marie-Tooth disease with minimal glomerular dysfunction."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Genetic analysis found a c.271C > G (p. Arg91Gly) variation in INF2 exon 2, and in vitro splicing assays showed the deletion of the last 120 nucleotides of INF2 exon 2 leading to a 40 amino acids in-frame deletion (p. Arg91_p. Gln130del)."
    explanation: >-
      The quoted splice assay establishes the functional RNA consequence of a variant found in an affected
      family; the assay evidence is in vitro.
    quote_role: PRIMARY_RESULT
  - reference: PMID:24174593
    reference_title: "De novo INF2 mutations expand the genetic spectrum of hereditary neuropathy with glomerulopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "In 3 patients, we detected 2 novel de novo INF2 mutations (p.Leu77Arg and p.Leu69_Ser72del) and a third, most likely de novo mutation (p.Gly114Asp)."
    explanation: >-
      Documents missense and in-frame deletion alleles, with different levels of de novo confirmation.
- name: Loss of Facilitated Autoinhibition of INF2
  biological_scale: MOLECULAR
  description: >-
    Cyclase-associated protein complexed with lysine-acetylated actin facilitates INF2 inhibition through
    its regulatory domain. The tested L77R CMT allele and R218Q renal allele were poorly inhibited in
    biochemical assays and produced excess cytoplasmic actin filaments in INF2-knockout U2OS cells. This
    supports loss of a regulatory restraint for these alleles, without implying uniform actin accumulation
    across variants or cell systems.
  molecular_functions:
  - preferred_term: actin binding
    term:
      id: GO:0003779
      label: actin binding
  biological_processes:
  - preferred_term: actin filament polymerization
    modifier: INCREASED
    term:
      id: GO:0030041
      label: actin filament polymerization
  downstream:

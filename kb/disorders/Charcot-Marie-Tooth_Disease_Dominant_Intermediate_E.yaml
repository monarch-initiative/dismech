discussions:
- discussion_id: inf2_organ_selectivity
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why does the same INF2 diaphanous-inhibitory-domain variant produce isolated
    glomerulosclerosis in one carrier and combined neuropathy plus glomerulosclerosis in a
    relative?
  attaches_to:
  - pathophysiology#Loss of Facilitated Autoinhibition of INF2
  - pathophysiology#Disruption of the INF2-MAL-CDC42 Pathway in Schwann Cells
  rationale: >-
    Part of this is now answered, and the answer is positional. Variants between residues 184
    and 245 produce monogenic FSGS; variants between residues 57 and 184 produce the dual
    CMT-plus-FSGS disease. So where in the diaphanous inhibitory domain the substitution falls
    predicts which organs are involved, and a cell-biological correlate has been measured:
    CMT/FSGS variants cause more prominent mitochondrial fragmentation and distribution change
    than FSGS variants, and the difference tracks the severity of cytoskeletal disruption. The
    dual phenotype looks like the more globally disruptive end of one gradient rather than a
    separate mechanism.

    What that does not explain is the intrafamilial variability, and it is worth being precise
    about why. The c.451T>C allele lies in the CMT-range segment, yet it segregated as isolated
    FSGS in some members of one family and as the dual phenotype in others. Position therefore
    sets what an allele *can* produce and something else decides what it *does* - a modifier,
    a threshold effect, or ascertainment. Nothing published identifies it, and the authors who
    established the positional rule end by saying that tissue-specific pathways in the two
    phenotypes still need clarifying.
  evidence:
  - reference: PMID:25943269
    reference_title: "INF2 mutations associated with dominant inherited intermediate Charcot-Marie-Tooth neuropathy with focal segmental glomerulosclerosis in two Chinese patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The c.451 T>C mutant was responsible for both isolated FSGS and a dual phenotype of FSGS and neuropathy within one family."
    explanation: >-
      The observation that makes this a gap rather than a curiosity: one allele, one family,
      two organ distributions.
  - reference: PMID:37491439
    reference_title: "Characterization of cytoskeletal and structural effects of INF2 variants causing glomerulopathy and neuropathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Variants between residues 184 and 245 of INF2, an actin assembly factor, produce the monogenic FSGS phenotype. Meanwhile, variants between residues 57 and 184 cause a dual-faceted disease involving peripheral neurons and podocytes (Charcot-Marie-Tooth CMT/FSGS)."
    explanation: >-
      The positional rule, which is the part of this question that has an answer and which the
      earlier version of this entry did not have.
  - reference: PMID:37491439
    reference_title: "Characterization of cytoskeletal and structural effects of INF2 variants causing glomerulopathy and neuropathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Notably, CMT/FSGS variants caused more prominent changes in mitochondrial distribution and fragmentation than FSGS variants and these changes correlated with the severity of cytoskeletal disruption."
    explanation: >-
      A measured cell-biological difference between the two variant classes, which turns the
      positional rule from a correlation into a gradient with a candidate substrate.
  - reference: PMID:37491439
    reference_title: "Characterization of cytoskeletal and structural effects of INF2 variants causing glomerulopathy and neuropathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Further study is needed to clarify tissue-specific pathways and/or cellular functions implicated in FSGS and CMT phenotypes."
    explanation: >-
      The authors' own statement that the tissue selectivity is not resolved by their result,
      which is why this stays a KNOWLEDGE_GAP rather than being closed.
- discussion_id: inf2_renal_penetrance
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    What fraction of INF2 neuropathy carriers develop clinically significant renal disease,
    and does that fraction justify lifelong renal surveillance?
  attaches_to:
  - phenotypes#Focal Segmental Glomerulosclerosis
  - phenotypes#Proteinuria
  rationale: >-
    Every published frequency estimate is unusable for this question because of how the
    cohorts were assembled. The founding series genotyped patients selected for having CMT
    *and* FSGS, so 100% renal involvement in it is a property of the inclusion criteria. The
    one family ascertained neurologically had normal albumin and creatinine and at most mildly
    raised urine protein into the ninth decade. What is missing is an unselected INF2
    neuropathy cohort with prospective renal follow-up; until it exists the entry records
    renal involvement as FREQUENT on published cases rather than as a penetrance figure.
  evidence:
  - reference: PMID:30680856
    reference_title: "A cryptic splicing mutation in the INF2 gene causing Charcot-Marie-Tooth disease with minimal glomerular dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Plasma albumin and creatinine were normal in all four cases, and urine protein was normal in one case and mildly raised in three patients"
    explanation: >-
      The one neurologically ascertained family, whose renal findings are the counterweight to
      the founding cohort's selection.
notes: >-
  Naming: MONDO and OMIM call this dominant intermediate CMT type E; much of the primary
  literature calls it INF2-related CMT or CMT with FSGS. The synonyms list carries all three
  so the entry is findable under whichever the reader knows.

  Scope against the existing knowledge base: kb/disorders/Focal_Segmental_Glomerulosclerosis
  covers the renal disease as an entity and mentions INF2 among its causes. This entry is the
  neuropathy, and it curates the renal arm only as far as it is part of the INF2 phenotype -
  it does not restate FSGS pathophysiology.

    snippet: "Patients presented with an intermediate form of Charcot-Marie-Tooth neuropathy as well as a glomerulopathy with FSGS on kidney biopsy."
    explanation: Biopsy as the basis of the renal diagnosis in the founding cohort.
animal_models:
- name: INF2 R218Q knock-in mouse
  species: Mouse
  genotype: Inf2 R218Q knock-in, heterozygous; compared against Inf2 knockout
  publication: PMID:39536114
  description: >-
    The model that settles gain versus loss of function in vivo. Neither the knockout nor the
    point-mutant mouse has a spontaneous kidney or neurological phenotype, so the discrimination
    comes from a puromycin aminonucleoside challenge: the R218Q mouse is susceptible to
    glomerular disease and the knockout is not.
  modeled_mechanisms:
  - target: Loss of Facilitated Autoinhibition of INF2
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces the de-repressed actin phenotype this node asserts, measured directly on the
      cytoskeleton rather than inferred from disease.
    limitations: >-
      Two limits, and they run in different directions. R218Q is an FSGS-range allele, so the
      model speaks to the shared molecular lesion rather than to the CMT-range variants this
      entry is about - it has no reported neurological phenotype at all. And the phenotype is
      not spontaneous: it requires a puromycin aminonucleoside challenge, so what the model
      demonstrates is susceptibility rather than disease.
    readouts:
    - name: Cellular actin measurement
      target: Loss of Facilitated Autoinhibition of INF2
      direction: INCREASED
      interpretation: >-
        Direct measurement of the de-repressed actin assembly that this entry's central node
        asserts.
      evidence:
      - reference: PMID:39536114
        reference_title: "INF2 mutations cause kidney disease through a gain-of-function mechanism."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Colocalization, coimmunoprecipitation analyses, and cellular actin measurements showed that INF2 R218Q confers a gain-of-function effect on the actin cytoskeleton."
        explanation: The measured gain-of-function effect on the actin cytoskeleton.
    evidence:
    - reference: PMID:39536114
      reference_title: "INF2 mutations cause kidney disease through a gain-of-function mechanism."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "R218Q INF2 mice are susceptible to glomerular disease, in contrast to INF2 knockout mice."
      explanation: >-
        Why this model is informative for the node: it separates gain from loss of function,
        which is the claim the node makes. The genotype is R218Q, an FSGS-range allele, so the
        item is INDIRECT for a CMT entry.
  - target: Podocyte Actin Cytoskeleton Disorganization
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Models the renal arm, and only under challenge. Adhesion and mitochondria-related pathways
      were enriched in the challenged R218Q mice.
    limitations: >-
      Requires a puromycin aminonucleoside insult to manifest, so it models susceptibility to
      podocyte injury rather than spontaneous podocytopathy. It models nothing on the nerve
      side.
    evidence:
    - reference: PMID:39536114
      reference_title: "INF2 mutations cause kidney disease through a gain-of-function mechanism."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "RNA expression analysis showed that adhesion and mitochondria-related pathways were enriched in the PAN-treated R218Q mice."
      explanation: >-
        The cellular pathways engaged in the challenged model, which is what makes the link to
        the podocyte node more than nominal.
  - target: Demyelination with Onion Bulbs and Secondary Axonal Loss
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      Recorded as a negative because it is a substantive one. No INF2 mouse - knockout or point
      mutant - has a reported neurological phenotype, so the nerve arm of this disorder has no
      animal model at all.
    limitations: >-
      The allele modelled is FSGS-range, so its silence on nerve may reflect the allele rather
      than a species difference; that is exactly what makes it uninformative rather than
      reassuring. A CMT-range knock-in has not been reported.
    evidence:
    - reference: PMID:39536114
      reference_title: "INF2 mutations cause kidney disease through a gain-of-function mechanism."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Despite established roles in multiple cellular processes, neither INF2 knockout mice nor mice with a disease-associated point mutation display an evident kidney or neurologic phenotype."
      explanation: >-
        The explicit statement that no neurological phenotype is evident in either genotype,
        which is the basis for FAILS_TO_RECAPITULATE.
treatments:
- name: Kidney transplantation
  description: >-
    Renal replacement for the ESRD end of the renal arm, and the point at which knowing the
    genotype changes the counselling rather than only the label. Genetic FSGS generally does
    not recur in the graft, in contrast to FSGS without a confirmed genetic cause, and an INF2
    family with 14 affected members reported four transplants without recurrence.
  treatment_term:
    preferred_term: kidney transplantation
    term:
      id: NCIT:C15265
      label: Kidney Transplantation
  therapeutic_modality: SURGERY
  target_phenotypes:
  - preferred_term: Stage 5 chronic kidney disease
    term:
      id: HP:0003774
      label: Stage 5 chronic kidney disease
  evidence:
  - reference: PMID:29038887
    reference_title: "Mutations in INF2 may be associated with renal histology other than focal segmental glomerulosclerosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Four members received a kidney transplant without disease recurrence."
    explanation: >-
      Direct observation of non-recurrence in transplanted INF2 patients, rather than an
      extrapolation from genetic FSGS as a class.
  - reference: PMID:27733133
    reference_title: "Diagnosing FSGS without kidney biopsy - a novel INF2-mutation in a family with ESRD of unknown origin."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whilst patients with FSGS without a confirmed genetic cause have a high recurrence rate in the transplanted organ, patients with a mutation generally exhibit no recurrence and have a good prognosis."
    explanation: >-
      The general rule the INF2 observation instantiates. Graded INDIRECT because it is a
      statement about genetically caused FSGS as a class rather than about INF2 specifically.
  notes: >-
    Practical consequence recorded because it is easy to lose: at-risk relatives of an INF2
    proband have to be genotyped before being considered as living donors.
- name: Proteasome inhibition
  description: >-
    Experimental and not established for this disease. Bortezomib restored nephrin and
    ameliorated podocytopathy and FSGS in the INF2 R218Q knockin mouse, and the authors propose
    proteasome inhibition as a therapeutic strategy for INF2-mediated FSGS. R218Q is an
    FSGS-range allele, the work is entirely preclinical, and nothing addresses the neuropathy.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: bortezomib
      term:
        id: CHEBI:52717
        label: bortezomib
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Dynein-Mediated Nephrin Mistrafficking and Proteasomal Degradation
    description: >-
      Blocks the terminal step of the nephrin degradation route rather than restoring INF2
      regulation.
  evidence:
  - reference: PMID:39621430
    reference_title: "Dynll1-PI31 Interaction Enhances Proteolysis Through the Proteasome, Representing a Novel Therapeutic Target for INF2-Related FSGS."
    supports: SUPPORT
    directness: INDIRECT

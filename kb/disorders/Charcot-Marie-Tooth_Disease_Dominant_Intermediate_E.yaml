    of a separate INF2 renal-disease family had no reported recurrence, but this small series does not
    establish zero recurrence risk in all INF2 genotypes.
  treatment_term:
    preferred_term: kidney transplantation
    term:
      id: NCIT:C15265
      label: Kidney Transplantation

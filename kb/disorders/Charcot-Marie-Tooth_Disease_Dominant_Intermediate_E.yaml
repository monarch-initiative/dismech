  - reference: PMID:22187985
    reference_title: "INF2 mutations in Charcot-Marie-Tooth disease with glomerulopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "INF2 mutations appear to cause many cases of FSGS-associated Charcot-Marie-Tooth neuropathy, showing that INF2 is involved in a disease affecting both the kidney glomerulus and the peripheral nervous system."
    explanation: The authors' own gene-disease conclusion.
diagnosis:
- name: Nerve conduction studies
  description: >-
    Motor and sensory conduction studies showing demyelinating and axonal features together,
    which places the neuropathy in the intermediate category and narrows the gene panel.
  evidence:
  - reference: PMID:30680856
    reference_title: "A cryptic splicing mutation in the INF2 gene causing Charcot-Marie-Tooth disease with minimal glomerular dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mean age at CMT disease onset was 11.5 years (3-17), and electrophysiological studies showed demyelinating and axonal features consistent with intermediate CMT."
    explanation: The electrophysiological pattern used to classify the neuropathy.
- name: INF2 sequencing
  description: >-
    Targeted sequencing of INF2, concentrating on the amino-terminal exons where every reported
    pathogenic allele lies. The cryptic-splicing family is a caution against restricting the
    test to patients who have renal disease as well as neuropathy, and against reading a
    missense call at face value without a splicing assay.
  evidence:
  - reference: PMID:30680856
    reference_title: "A cryptic splicing mutation in the INF2 gene causing Charcot-Marie-Tooth disease with minimal glomerular dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Consequently, INF2 mutation analysis should not be restricted to individuals with coincident neuropathy and renal disease."
    explanation: The authors' explicit testing recommendation.
  - reference: PMID:32451589
    reference_title: "The formin INF2 in disease: progress from 10 years of research."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "All known INF2 gene mutations causing disease map to the exons encoding the amino-terminal domain."
    explanation: Why the amino-terminal exons are the high-yield target.
- name: Renal biopsy
  description: >-
    Histological confirmation of focal segmental glomerulosclerosis in a carrier with

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We performed direct genotyping of INF2 in 16 index patients with Charcot-Marie-Tooth neuropathy and FSGS who did not have a mutation in PMP22 or MPZ, encoding peripheral myelin protein 22 and myelin protein zero, respectively."
    explanation: >-
      The denominator and the prior exclusions, which are what make the 75% yield

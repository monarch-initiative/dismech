    quote_role: PRIMARY_RESULT
  - reference: PMID:22187985
    reference_title: "INF2 mutations in Charcot-Marie-Tooth disease with glomerulopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "INF2 mutations appear to cause many cases of FSGS-associated Charcot-Marie-Tooth neuropathy, showing that INF2 is involved in a disease affecting both the kidney glomerulus and the peripheral nervous system."
    explanation: >-
      The authors' own gene-disease conclusion.
    quote_role: PRIMARY_RESULT
  - reference: PMID:22187985
    reference_title: "INF2 mutations in Charcot-Marie-Tooth disease with glomerulopathy."
    supports: SUPPORT

diagnosis:
- name: Nerve conduction studies
  description: >-
    Motor and sensory conduction studies characterize a sensorimotor neuropathy with intermediate or demyelinating
    velocities and secondary axonal loss. Conduction block can occur; it should not by itself establish
    an acquired inflammatory cause.
  evidence:
  - reference: PMID:30680856
    reference_title: "A cryptic splicing mutation in the INF2 gene causing Charcot-Marie-Tooth disease with minimal glomerular dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mean age at CMT disease onset was 11.5 years (3-17), and electrophysiological studies showed demyelinating and axonal features consistent with intermediate CMT."
    explanation: >-
      The electrophysiological pattern used to classify the neuropathy.
    quote_role: PRIMARY_RESULT
  - reference: PMID:40985697
    reference_title: "INF2-Related Charcot-Marie-Tooth Disease in a Japanese Cohort: Genetic and Clinical Insights."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Additionally, 3/8 (38%) patients had a conduction block of ≥ 30% in either the median or ulnar nerve"
    explanation: >-
      The threshold and nerves are those assessed in the cohort.
- name: Molecular diagnosis
  description: >-
    Molecular testing that includes INF2 can establish the cause of a compatible neuropathy, especially
    with proteinuria or renal disease. Testing should not be restricted to patients with both organs affected.
    Splice consequences may require functional assessment even when a DNA variant appears to encode a
    missense change. General CMT evaluation includes PMP22 dosage analysis and then an appropriate multigene
    panel or genomic testing; INF2 coverage should be confirmed when this phenotype is suspected.
  evidence:
  - reference: PMID:30680856
    reference_title: "A cryptic splicing mutation in the INF2 gene causing Charcot-Marie-Tooth disease with minimal glomerular dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Consequently, INF2 mutation analysis should not be restricted to individuals with coincident neuropathy and renal disease."
    explanation: >-
      The authors' explicit testing recommendation.
    quote_role: PRIMARY_RESULT
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1358/
    reference_title: "Charcot-Marie-Tooth Hereditary Neuropathy Overview - GeneReviews® - NCBI Bookshelf"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Molecular genetic testing approaches can include gene-targeted testing (single-gene testing, multigene panel) and comprehensive genomic testing (exome sequencing, exome array)."
    explanation: >-
      General CMT molecular-testing framework; laboratory gene coverage must be checked.
    directness: INDIRECT
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1358/
    reference_title: "Charcot-Marie-Tooth Hereditary Neuropathy Overview - GeneReviews® - NCBI Bookshelf"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Single-gene testing for <i>PMP22</i> duplication/deletion is recommended as the first test in all probands with CMT as defined in this <i>GeneReview</i>."
    explanation: >-
      General CMT testing sequence, distinct from the disease-specific indication to include INF2.
    directness: INDIRECT
- name: Renal biopsy
  description: >-
    Kidney biopsy can characterize clinically significant nephropathy when indicated. FSGS is typical,
    but renal histology in the wider INF2 disease spectrum is variable; biopsy is not a prerequisite for
    recognizing genetically confirmed INF2 neuropathy.
  evidence:
  - reference: PMID:22187985
    reference_title: "INF2 mutations in Charcot-Marie-Tooth disease with glomerulopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients presented with an intermediate form of Charcot-Marie-Tooth neuropathy as well as a glomerulopathy with FSGS on kidney biopsy."
    explanation: >-
      Biopsy as the basis of the renal diagnosis in the founding cohort.
    quote_role: PRIMARY_RESULT
  - reference: PMID:29038887
    reference_title: "Mutations in INF2 may be associated with renal histology other than focal segmental glomerulosclerosis."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Two patients underwent renal biopsy with the result of minimal-change glomerulopathy and IgA nephropathy respectively."
    explanation: >-
      A renal-disease family illustrates broader INF2-associated histology; it is indirect evidence for
      the neuropathy population.
- name: Longitudinal renal assessment
  description: >-
    Assess proteinuria and renal function at diagnosis and during follow-up, because renal manifestations
    may emerge after neuropathy. The available evidence does not establish a single surveillance interval
    for every genotype.
  evidence:
  - reference: PMID:40985697
    reference_title: "INF2-Related Charcot-Marie-Tooth Disease in a Japanese Cohort: Genetic and Clinical Insights."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Early genetic diagnosis should prompt longitudinal monitoring of proteinuria and renal function, which may facilitate timely intervention."
    explanation: >-
      The cohort authors recommend ongoing renal assessment; no fixed interval is specified.
  - reference: PMID:25439738
    reference_title: "Charcot-Marie-Tooth: are you testing for proteinuria?"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "For this reason, we strongly suggest to screen for proteinuria in CMT patients, in order to identify patients with this renal-neurologic phenotype in an early stage, and to perform genetic testing for INF2 mutations."
    explanation: >-
      Clinical review recommends proteinuria screening to recognize the INF2 phenotype.
animal_models:
- name: INF2 R218Q knock-in mouse
  species: Mouse
  genotype: Inf2 R218Q knock-in, heterozygous and homozygous; compared against Inf2 knockout
  publication: PMID:39536114
  description: >-
    Heterozygous and homozygous R218Q knock-in mice develop persistent glomerular injury after puromycin
    aminonucleoside challenge, unlike knockout comparators. The study supports a mutation-specific renal
    disease mechanism rather than simple INF2 deficiency; it does not model CMT neuropathy.
  modeled_mechanisms:
  - target: Podocyte Actin Cytoskeleton Disorganization
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Models susceptibility to podocyte injury and altered adhesion under puromycin aminonucleoside stress.
    limitations: >-
      Requires a puromycin aminonucleoside insult to manifest, so it models susceptibility to podocyte
      injury rather than spontaneous podocytopathy. It models nothing on the nerve side.
    evidence:
    - reference: PMID:39536114
      reference_title: "INF2 mutations cause kidney disease through a gain-of-function mechanism."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "RNA expression analysis showed that adhesion and mitochondria-related pathways were enriched in the PAN-treated R218Q mice."
      explanation: >-
        The cellular pathways engaged in the challenged model, which is what makes the link to the podocyte
        node more than nominal.
      quote_role: PRIMARY_RESULT
  - target: Peripheral Nerve Demyelination
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      The studied R218Q and knockout mice did not show an evident neurological phenotype.
    limitations: >-
      A renal-associated allele and absence of an evident phenotype in these models do not establish the
      behavior of all INF2 variants or all possible animal models.
    evidence:
    - reference: PMID:39536114
      reference_title: "INF2 mutations cause kidney disease through a gain-of-function mechanism."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Despite established roles in multiple cellular processes, neither INF2 knockout mice nor mice with a disease-associated point mutation display an evident kidney or neurologic phenotype."
      explanation: >-
        Documents the negative neurological observation for the genotypes studied.
      quote_role: PRIMARY_RESULT

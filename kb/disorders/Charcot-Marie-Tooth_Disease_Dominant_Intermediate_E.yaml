inheritance:
- name: Autosomal dominant
  description: >-
    Heterozygous INF2 variants. The founding series identified nine new heterozygous mutations
    in 12 of 16 index patients with CMT and FSGS, and the later cryptic-splicing family shows
    dominant transmission across three generations. Expressivity is variable even within a
    single family: the same allele has produced isolated FSGS in some relatives and combined
    FSGS with neuropathy in others.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  expressivity: VARIABLE
  evidence:
  - reference: PMID:22187985
    reference_title: "INF2 mutations in Charcot-Marie-Tooth disease with glomerulopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified nine new heterozygous mutations in 12 of the 16 index patients (75%), all located in exons 2 and 3, encoding the diaphanous-inhibitory domain of INF2."
    explanation: >-
      Heterozygous state in every index patient, which is the dominant pattern, and the
      restriction of the alleles to the DID-encoding exons.
  - reference: PMID:25943269
    reference_title: "INF2 mutations associated with dominant inherited intermediate Charcot-Marie-Tooth neuropathy with focal segmental glomerulosclerosis in two Chinese patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Intrafamilial variability can be found with the same INF2 mutation."
    explanation: >-
      Direct statement of variable expressivity, which is why penetrance of the renal arm
      cannot be read off the genotype.
pathophysiology:
- name: INF2 Diaphanous-Inhibitory-Domain Variant
  biological_scale: MOLECULAR
  description: >-
    A heterozygous variant in the amino-terminal region of INF2. In the founding CMT-plus-FSGS
    series every allele lay in exons 2 and 3, which encode the diaphanous inhibitory domain,
    and a systematic review of the whole pathogenic allele set a decade later reached the same
    conclusion for INF2 disease as a whole. Missense substitutions dominate, but the spectrum
    also includes a cryptic splicing allele (c.271C>G, p.Arg91Gly) whose real consequence is
    an in-frame 40-amino-acid deletion inside the same domain.
  genes:
  - preferred_term: INF2
    term:
      id: hgnc:23791
      label: INF2
  genetic_context:
    allele_type: missense, and one cryptic splice allele producing an in-frame 40-residue deletion
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: GAIN_OF_FUNCTION
    description: >-
      Categorised as gain of function on two independent lines: disease-associated INF2 mutants
      escape inhibition by the CAP-KAc-actin complex in vitro, and in mice a disease point
      mutation confers susceptibility to glomerular disease where the knockout does not.

      The two lines differ in allele coverage. The biochemistry tested both ranges - R218Q, an
      FSGS allele, and L77R, which the source calls a CMTD mutant and which sits at residue 77,
      inside the 57-184 CMT-associated span this entry describes - and found reduced
      CAP-KAc-actin inhibition of both, so that line bears on CMT alleles directly. The mouse
      work uses R218Q alone, so it is the in vivo line whose inference to CMT-range alleles is
      stated rather than assumed. It is drawn here and not for
      the nephrin route because the two claims have different scopes. Gain versus loss of
      function is a property of the *domain*: every pathogenic INF2 allele sits in the DID, the
      biochemical escape from CAP-KAc-actin inhibition was measured across disease mutants
      rather than on one, and the knockout-versus-point-mutant comparison tests the class of
      mechanism, not a residue. The nephrin route is the opposite - a specific molecular
      pathway, in one cell type, demonstrated for one allele - so it stays allele-local. Every
      evidence item on both is graded INDIRECT regardless.
  downstream:
  - target: Loss of Facilitated Autoinhibition of INF2
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:22187985
    reference_title: "INF2 mutations in Charcot-Marie-Tooth disease with glomerulopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified nine new heterozygous mutations in 12 of the 16 index patients (75%), all located in exons 2 and 3, encoding the diaphanous-inhibitory domain of INF2."
    explanation: The founding allelic series and its confinement to the regulatory domain.
  - reference: PMID:32451589
    reference_title: "The formin INF2 in disease: progress from 10 years of research."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "All known INF2 gene mutations causing disease map to the exons encoding the amino-terminal domain."
    explanation: >-
      A systematic exon-by-exon review confirming the localisation across the whole reported
      mutation set, not just the founding cohort.
  - reference: PMID:30680856
    reference_title: "A cryptic splicing mutation in the INF2 gene causing Charcot-Marie-Tooth disease with minimal glomerular dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic analysis found a c.271C > G (p. Arg91Gly) variation in INF2 exon 2, and in vitro splicing assays showed the deletion of the last 120 nucleotides of INF2 exon 2 leading to a 40 amino acids in-frame deletion (p. Arg91_p. Gln130del)."
    explanation: >-
      The splicing allele, which is why the allele spectrum cannot be described as purely
      missense.
  - reference: PMID:39536114
    reference_title: "INF2 mutations cause kidney disease through a gain-of-function mechanism."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "Despite established roles in multiple cellular processes, neither INF2 knockout mice nor mice with a disease-associated point mutation display an evident kidney or neurologic phenotype."
    explanation: >-
      The baseline observation that makes the comparison below meaningful: unchallenged, both
      genotypes look normal, so the gain-of-function claim rests on the challenge experiment
      rather than on a spontaneous phenotype. Graded INDIRECT for the same reason as the nephrin
      node - the point mutation modelled is R218Q, an FSGS-range allele.
  - reference: PMID:39536114
    reference_title: "INF2 mutations cause kidney disease through a gain-of-function mechanism."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "R218Q INF2 mice are susceptible to glomerular disease, in contrast to INF2 knockout mice."
    explanation: >-
      The in vivo discrimination between gain and loss of function: the point-mutant mouse is
      susceptible where the knockout is not. The allele is R218Q, an FSGS-range variant, so the
      item is graded INDIRECT for a CMT entry; see genetic_context for why this entry treats the
      gain-of-function conclusion as generalising across the DID while the nephrin route does
      not.
- name: Loss of Facilitated Autoinhibition of INF2
  biological_scale: MOLECULAR
  description: >-
    Wild-type INF2 is not autoinhibited when purified; it accelerates actin polymerisation
    from monomers as efficiently as a construct lacking the DID entirely. The brake is
    supplied in trans by a complex of cyclase-associated protein with lysine-acetylated actin,
    and that inhibition requires the DID. Disease-associated INF2 mutants are poorly inhibited
    by this complex, so a DID variant releases the formin from an externally imposed control
    rather than crippling it - which is why this node is tagged GAIN_OF_FUNCTION rather than
    INCREASED.
  molecular_functions:
  - preferred_term: actin binding
    term:
      id: GO:0003779
      label: actin binding
  biological_processes:
  - preferred_term: actin filament polymerization
    modifier: GAIN_OF_FUNCTION
    term:
      id: GO:0030041
      label: actin filament polymerization
  downstream:
  - target: Disruption of the INF2-MAL-CDC42 Pathway in Schwann Cells
    causal_link_type: DIRECT
  - target: Podocyte Actin Cytoskeleton Disorganization
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:30962575
    reference_title: "A complex containing lysine-acetylated actin inhibits the formin INF2."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Interestingly, purified INF2 is not autoinhibited, suggesting the existence of other cellular inhibitors."
    explanation: >-
      Establishes that the DID does not act as a conventional intramolecular brake, which is
      the premise the rest of the node rests on.
  - reference: PMID:30962575
    reference_title: "A complex containing lysine-acetylated actin inhibits the formin INF2."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Inhibition of INF2 by CAP-KAc-actin is dependent on the INF2 diaphanous inhibitory domain (DID)."
    explanation: >-
      Links the inhibitory mechanism to the exact domain in which every disease allele sits.
  - reference: PMID:30962575
    reference_title: "A complex containing lysine-acetylated actin inhibits the formin INF2."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Disease-associated INF2 mutants are poorly inhibited by CAP-KAc-actin, suggesting that focal segmental glomerulosclerosis and Charcot-Marie-Tooth disease result from reduced CAP-KAc-actin binding."
    explanation: >-
      The mechanistic claim itself, tested on the disease alleles rather than on a designed
      DID mutant.
  - reference: PMID:30962575
    reference_title: "A complex containing lysine-acetylated actin inhibits the formin INF2."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We therefore asked whether CAP/actin could inhibit two INF2 mutants: R218Q, a common FSGS mutant22; and L77R, a CMTD mutant23."
    explanation: >-
      Names the two alleles the biochemistry was run on. L77R is called a CMTD mutant by the
      source and sits at residue 77, inside the 57-184 CMT-associated span, so the escape from
      CAP-KAc-actin inhibition is not measured only on FSGS alleles. The trailing digits are the
      source's superscript citation markers, carried through by the cache.
  - reference: PMID:30962575
    reference_title: "A complex containing lysine-acetylated actin inhibits the formin INF2."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "CAP/CSKA displays reduced inhibition of both mutants biochemically, with R218Q being particularly resistant"
    explanation: >-
      The result for that pair. Both alleles escape inhibition, so the CMT allele carries the
      mechanism too; the FSGS allele is the more resistant of the two, which is a quantitative
      difference and not a difference in kind.
- name: Disruption of the INF2-MAL-CDC42 Pathway in Schwann Cells
  biological_scale: CELLULAR
  description: >-
    INF2 is strongly expressed in Schwann-cell cytoplasm, where it colocalises and interacts
    with myelin and lymphocyte protein (MAL) and engages the Rho-family GTPase CDC42 - both of
    them proteins implicated in myelination and myelin maintenance. Mutant INF2 perturbs this
    three-way pathway: the cytoskeleton is disorganised, INF2 binding to CDC42 is enhanced,
    and INF2, MAL and CDC42 are all mislocalised.
  cell_types:
  - preferred_term: Schwann cell
    term:
      id: CL:0002573
      label: Schwann cell
  biological_processes:
  - preferred_term: Rho protein signal transduction
    modifier: ABNORMAL
    term:
      id: GO:0007266
      label: Rho protein signal transduction
  - preferred_term: regulation of actin cytoskeleton organization
    modifier: ABNORMAL
    term:
      id: GO:0032956
      label: regulation of actin cytoskeleton organization
  downstream:
  - target: Schwann Cell Myelin Maintenance Failure
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:22187985
    reference_title: "INF2 mutations in Charcot-Marie-Tooth disease with glomerulopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Immunohistochemical analysis revealed strong INF2 expression in Schwann-cell cytoplasm and podocytes."
    explanation: >-
      Establishes that both affected cell types actually express the protein, which is the
      minimum requirement for a shared cell-autonomous mechanism.
  - reference: PMID:22187985
    reference_title: "INF2 mutations in Charcot-Marie-Tooth disease with glomerulopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Moreover, we demonstrated that INF2 colocalizes and interacts with MAL in Schwann cells."
    explanation: The physical interaction that makes MAL part of this node rather than a bystander.
  - reference: PMID:22187985
    reference_title: "INF2 mutations in Charcot-Marie-Tooth disease with glomerulopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The INF2 mutants perturbed the INF2-MAL-CDC42 pathway, resulting in cytoskeleton disorganization, enhanced INF2 binding to CDC42 and mislocalization of INF2, MAL, and CDC42."
    explanation: >-
      The functional consequence measured on the patient alleles: enhanced CDC42 binding is
      the observation that argues against a simple loss of INF2 activity.
- name: Schwann Cell Myelin Maintenance Failure
  biological_scale: CELLULAR
  description: >-
    MAL and CDC42 are implicated in essential steps of myelination and myelin maintenance, so
    the pathway disruption above translates into a failure of the Schwann cell to build and
    keep a normal myelin sheath. The non-myelinating Schwann cell compartment is affected too,
    taking on supernumerary elongated extensions around unmyelinated fibres.
  cell_types:
  - preferred_term: Schwann cell
    term:
      id: CL:0002573
      label: Schwann cell

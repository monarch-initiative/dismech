- name: Proteasome inhibition
  description: >-
    Bortezomib ameliorated renal injury in puromycin aminonucleoside-challenged R218Q knock-in mice. This
    is preclinical treatment of an adjacent renal allele, with no established efficacy for human INF2
    neuropathy. Proteasome-inhibitor neurotoxicity is an additional translational concern discussed by
    the study.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: bortezomib
      term:
        id: CHEBI:52717
        label: bortezomib
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Proteasomal Nephrin Depletion
    description: >-
      Blocks the terminal step of the nephrin degradation route rather than restoring INF2 regulation.
  evidence:
  - reference: PMID:39621430
    reference_title: "Dynll1-PI31 Interaction Enhances Proteolysis Through the Proteasome, Representing a Novel Therapeutic Target for INF2-Related FSGS."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "In R218Q KI mice challenged with puromycin aminonucleoside, dynein-mediated mistrafficking and depletion of nephrin were correlated with increased Dynll1-PI31 interaction; the resulting podocytopathy and FSGS were ameliorated by bortezomib."
    explanation: >-
      Animal efficacy for the renal R218Q model, not clinical efficacy in CMT.
    directness: INDIRECT
  - reference: PMID:39621430
    reference_title: "Dynll1-PI31 Interaction Enhances Proteolysis Through the Proteasome, Representing a Novel Therapeutic Target for INF2-Related FSGS."
    supports: SUPPORT
    evidence_source: OTHER

inheritance:
- name: Autosomal dominant
  description: >-
    Heterozygous INF2 variants cause autosomal dominant neuropathy with variable renal involvement. Both
    familial transmission and de novo disease occur. The Japanese neuropathy cohort contained eight sporadic
    cases; parental segregation testing confirmed de novo variants in the five pedigrees tested. A negative
    family history therefore does not exclude the disorder.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  expressivity: VARIABLE
  evidence:
  - reference: PMID:22187985
    reference_title: "INF2 mutations in Charcot-Marie-Tooth disease with glomerulopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified nine new heterozygous mutations in 12 of the 16 index patients (75%), all located in exons 2 and 3, encoding the diaphanous-inhibitory domain of INF2."
    explanation: >-
      The selected CMT-plus-FSGS series establishes heterozygous disease-associated variants; multigenerational
      segregation and de novo cases provide the inheritance evidence.
    quote_role: PRIMARY_RESULT
  - reference: PMID:25943269
    reference_title: "INF2 mutations associated with dominant inherited intermediate Charcot-Marie-Tooth neuropathy with focal segmental glomerulosclerosis in two Chinese patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Intrafamilial variability can be found with the same INF2 mutation."
    explanation: >-
      Direct statement of variable expressivity, which is why penetrance of the renal arm cannot be read
      off the genotype.
    quote_role: PRIMARY_RESULT
  - reference: PMID:40985697
    reference_title: "INF2-Related Charcot-Marie-Tooth Disease in a Japanese Cohort: Genetic and Clinical Insights."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Segregation analyses performed in five pedigrees confirmed de novo mutations in all cases, despite the autosomal dominant inheritance pattern of INF2‐related CMT."
    explanation: >-
      Five tested pedigrees establish de novo occurrence; the other three sporadic cases were not genetically
      confirmed as de novo.
pathophysiology:
- name: INF2 Diaphanous-Inhibitory-Domain Variant
  biological_scale: MOLECULAR
  description: >-
    Heterozygous disease-associated variants affect the amino-terminal diaphanous inhibitory domain of
    INF2. The allelic spectrum includes missense substitutions, in-frame deletions and a cryptic splicing
    variant. The c.271C>G variant, nominally p.Arg91Gly, caused a 120-nucleotide exon deletion in an in
    vitro splicing assay, predicting p.Arg91_Gln130del.
  genes:
  - preferred_term: INF2
    term:
      id: hgnc:23791
      label: INF2
  genetic_context:
    allele_type: missense, in-frame deletion, and cryptic splice alteration
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    description: >-
      Regulatory dysfunction is supported for experimentally tested alleles. Gain-of-function findings
      for L77R or renal-disease R218Q do not establish the functional effect of every DID variant; changes
      in actin organization depend on the allele, isoform and assay.
  downstream:
  - target: Loss of Facilitated Autoinhibition of INF2
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Enhanced Calmodulin Binding to INF2
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

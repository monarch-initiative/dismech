discussions:
- discussion_id: inf2_organ_selectivity
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why does the same INF2 diaphanous-inhibitory-domain variant produce isolated glomerulosclerosis in
    one carrier and combined neuropathy plus glomerulosclerosis in a relative?
  attaches_to:
  - pathophysiology#Loss of Facilitated Autoinhibition of INF2
  - pathophysiology#Disruption of the INF2-MAL-CDC42 Pathway in Schwann Cells
  rationale: >-
    CMT-associated variants often involve the proximal DID, but position does not determine phenotype.
    The 2023 full text explicitly notes exceptions, including CMT with minimal renal involvement and considerable
    intrafamilial variation. Selected CMT/FSGS variants have stronger cytoskeletal and organelle effects
    in expression assays than renal-only comparators, but the tissue-specific threshold hypothesis remains
    unproven.
  evidence:
  - reference: PMID:25943269
    reference_title: "INF2 mutations associated with dominant inherited intermediate Charcot-Marie-Tooth neuropathy with focal segmental glomerulosclerosis in two Chinese patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The c.451 T>C mutant was responsible for both isolated FSGS and a dual phenotype of FSGS and neuropathy within one family."
    explanation: >-
      The observation that makes this a gap rather than a curiosity: one allele, one family, two organ
      distributions.
    quote_role: PRIMARY_RESULT
  - reference: PMID:37491439
    reference_title: "Characterization of cytoskeletal and structural effects of INF2 variants causing glomerulopathy and neuropathy."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "However, recent catalogues of mutations have disclosed no consistent difference in the locations among the two clinical subtypes"
    explanation: >-
      The full-text discussion qualifies the simplified positional rule in the abstract.
  - reference: PMID:37491439
    reference_title: "Characterization of cytoskeletal and structural effects of INF2 variants causing glomerulopathy and neuropathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "Cells expressing G73D variant typically exhibited global dysregulation in which most microtubules were disorganized as bundles aligned parallel to the cell long axis and lacking polarity"
    explanation: >-
      The cellular phenotype was measured in transfected HeLa cells, not patient nerve.
- discussion_id: inf2_renal_penetrance
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    What is the age- and allele-specific risk of clinically significant kidney disease in INF2 neuropathy?
  attaches_to:
  - phenotypes#Focal Segmental Glomerulosclerosis
  - phenotypes#Proteinuria
  rationale: >-
    The original study selected patients with both CMT and FSGS, whereas a cryptic-splice family had minimal
    renal dysfunction. The later Japanese neuropathy cohort found renal disease in all eight INF2 cases,
    often progressing during adolescence, but remains a small retrospective referral series. Population
    penetrance and optimal surveillance intervals remain uncertain; that uncertainty does not negate the
    authors' recommendation for longitudinal renal assessment.
  evidence:
  - reference: PMID:30680856
    reference_title: "A cryptic splicing mutation in the INF2 gene causing Charcot-Marie-Tooth disease with minimal glomerular dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Plasma albumin and creatinine were normal in all four cases, and urine protein was normal in one case and mildly raised in three patients"
    explanation: >-
      The one neurologically ascertained family, whose renal findings are the counterweight to the founding
      cohort's selection.
    quote_role: PRIMARY_RESULT
  - reference: PMID:40985697
    reference_title: "INF2-Related Charcot-Marie-Tooth Disease in a Japanese Cohort: Genetic and Clinical Insights."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "All patients also developed kidney dysfunction, with 7/8 (88%) progressing to end-stage renal disease at a median age of 15 years."
    explanation: >-
      Direct renal outcome in an INF2 neuropathy cohort; frequency is not generalized.
notes: >-
  The historical dominant intermediate type E name and MONDO mapping are retained, with INF2-related CMT
  as a synonym. Electrophysiological classification is variable. This entry covers the neuropathy and
  its associated kidney manifestations; isolated INF2 glomerulopathy is not a separate subtype of this
  neuropathy. General CMT supportive-care recommendations are indirect evidence, rather than INF2-specific
  treatment trials.
experimental_models:
- name: HeLa cells expressing INF2 disease variants
  experimental_model_type: CELL_LINE
  cell_source: Immortalized HeLa cells with transient expression of GFP-tagged INF2-CAAX constructs
  publication: PMID:39337270
  description: >-
    Live-cell imaging compares G73D, T161N, N202S and R218W with wild-type INF2. ER architecture, mitochondrial
    distribution and respiration are disturbed, most markedly for the tested G73D CMT/FSGS variant.
  modeled_mechanisms:
  - target: Endoplasmic Reticulum Discontinuity
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Recapitulates the ER morphological phenotype in an expression model.
    limitations: >-
      Transient overexpression in a transformed non-neural line; these experiments do not establish ER
      discontinuity in patient Schwann cells.
    evidence:
    - reference: PMID:39337270
      reference_title: "Altered Endoplasmic Reticulum Integrity and Organelle Interactions in Living Cells Expressing INF2 Variants."
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: "In contrast, the cells expressing the severe G73D variant showed a nearly global tubule-to-sheet ER transformation across the cytoplasm with disruption of the tubular structures."
      explanation: >-
        Direct live-cell phenotype in the G73D expression model.
  - target: Impaired Mitochondrial Respiration
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      G73D expression reduces oxygen consumption relative to the wild-type construct.
    limitations: >-
      Assay- and allele-specific; not a measurement of respiration in patient nerve.
    evidence:
    - reference: PMID:39337270
      reference_title: "Altered Endoplasmic Reticulum Integrity and Organelle Interactions in Living Cells Expressing INF2 Variants."
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: "The G73D variant had the greatest reduction in OCR, suggesting severe mitochondrial dysfunction"
      explanation: >-
        Measured respiratory phenotype in HeLa cells; human nerve bioenergetic failure was not measured.
- name: Patient-derived INF2 S186P kidney organoids
  experimental_model_type: ORGANOID
  cell_source: iPSCs from an individual with INF2-related FSGS and a normal donor comparator
  publication: PMID:39536114
  description: >-
    S186P kidney organoids show abnormal nephrin localization, while outgrown podocytes show defective
    adhesion and shorter mitochondria in basal and stressed conditions. The comparator is a normal donor,

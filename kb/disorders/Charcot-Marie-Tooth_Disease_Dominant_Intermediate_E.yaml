    explanation: >-
      The authors' interpretation of their own series, and the reason this is a node rather
      than a line in the demyelination node: it is a claim about the cell, not the sheath.
  - reference: PMID:24487800
    reference_title: "Neuropathologic characterization of INF2-related Charcot-Marie-Tooth disease: evidence for a Schwann cell actinopathy."

      label: proteasome-mediated ubiquitin-dependent protein catabolic process
    modifier: INCREASED
- name: Podocyte Injury
  biological_scale: CELLULAR
  description: >-
    Foot-process effacement and loss of slit-diaphragm integrity compromise the glomerular filtration
    barrier. Experimental support comes from challenged R218Q mice; the associated CMT/FSGS human phenotype
    provides clinical evidence for renal disease rather than proof of every modeled molecular step.
  evidence:
  - reference: PMID:39621430
    reference_title: "Dynll1-PI31 Interaction Enhances Proteolysis Through the Proteasome, Representing a Novel Therapeutic Target for INF2-Related FSGS."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "Compared with the wt/wt litter mates, PA induced greater glomerulosclerosis and tubular interstitial fibrosis in the R218Q KI mice, as well as significant podocytopathy, a pathology characterized by foot process effacement, a reduced number of SDs per µm length of glomerular capillaries, and a reduced fraction of capillary loops covered by intact foot processes"
    explanation: >-
      In vivo renal injury in an adjacent INF2 allele under experimental challenge.
    directness: INDIRECT
  downstream:
  - target: Proteinuria
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Nephrotic Syndrome
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Glomerular Scarring
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Glomerular Scarring
  biological_scale: TISSUE
  description: >-
    Focal segmental glomerulosclerosis is the characteristic renal biopsy pattern in many patients with
    INF2 neuropathy and nephropathy. Progressive renal disease can culminate in kidney failure, although
    renal involvement and severity vary between individuals.
  evidence:
  - reference: PMID:22187985
    reference_title: "INF2 mutations in Charcot-Marie-Tooth disease with glomerulopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients presented with an intermediate form of Charcot-Marie-Tooth neuropathy as well as a glomerulopathy with FSGS on kidney biopsy."
    explanation: >-
      Biopsy-confirmed FSGS in the index patients, not merely proteinuria.
    quote_role: PRIMARY_RESULT
  downstream:
  - target: Focal Segmental Glomerulosclerosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Stage 5 Chronic Kidney Disease
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Sustained MRTF-SRF Transcriptional Activation
  biological_scale: MOLECULAR
  description: >-
    R218Q expression in renal epithelial cells promotes nuclear accumulation of MRTF and sustained MRTF-SRF
    transcriptional activity. This is an experimental renal-allele mechanism whose relevance to CMT-associated
    kidney disease is indirect.
  evidence:
  - reference: PMID:38916773
    reference_title: "INF2 formin variants linked to human inherited kidney disease reprogram the transcriptome, causing mitotic chaos and cell death."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "In line with the effect of INF2 R218Q on MRTF nuclear translocation, INF2 R218Q caused a considerable increase of MRTF-SRF transcriptional activity, an effect that was reduced by LatB"
    explanation: >-
      Reporter measurements in cultured MDCK cells support altered transcriptional activity.
    directness: INDIRECT
  downstream:
  - target: Mitotic Failure in INF2 Variant Renal Cells
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Mitotic Failure in INF2 Variant Renal Cells
  biological_scale: CELLULAR
  description: >-
    R218Q-expressing MDCK cells and cultured human primary podocytes develop abnormal spindles and nuclear
    morphology. Nuclear p53 accumulation and cleaved caspase-3 accompany cell death in the epithelial
    model. These results do not demonstrate mitotic catastrophe in patient Schwann cells or establish
    it as the universal cause of renal progression.
  evidence:
  - reference: PMID:38916773
    reference_title: "INF2 formin variants linked to human inherited kidney disease reprogram the transcriptome, causing mitotic chaos and cell death."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "Remarkably, expression of INF2 R218Q induced p53 translocation to the nucleus (Fig. 10A, B) and resulted in abnormal mitotic spindles and aberrant nuclei (Fig. 10C–E), mirroring the effects observed in MDCK cells."
    explanation: >-
      Primary human podocytes were cultured and experimentally transfected; this is in vitro evidence,
      not a patient clinical finding.
    directness: INDIRECT
  downstream:
  - target: Podocyte Injury
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

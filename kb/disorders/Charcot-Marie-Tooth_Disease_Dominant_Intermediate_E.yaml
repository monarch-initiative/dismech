  - reference: PMID:30680856
    reference_title: "A cryptic splicing mutation in the INF2 gene causing Charcot-Marie-Tooth disease with minimal glomerular dysfunction."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "This report expands the genetic spectrum of INF2-associated disorders and demonstrates that INF2 mutations may provoke isolated CMT with no clinically relevant kidney involvement."
    explanation: >-
      Recorded as REFUTE against the specific claim that glomerular disease is a constant
      feature of this disorder. It does not contradict the founding series, which selected for
      patients who had both; it contradicts the generalisation.
  - reference: PMID:29038887
    reference_title: "Mutations in INF2 may be associated with renal histology other than focal segmental glomerulosclerosis."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Two patients underwent renal biopsy with the result of minimal-change glomerulopathy and IgA nephropathy respectively."
    explanation: >-
      Recorded as REFUTE against the claim that INF2 renal disease is always FSGS. In a
      14-member INF2 family the two biopsies showed something else entirely, so a non-FSGS
      biopsy does not exclude the gene.
  notes: >-
    The founding cohort was ascertained as CMT *with* FSGS, so it cannot estimate how often
    INF2 neuropathy carries renal disease. FREQUENT reflects that, plus one published family
    with clinically unimportant kidney findings, plus a second family in which the renal
    histology was not FSGS at all.

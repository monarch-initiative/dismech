genetic:
- name: INF2
  gene_term:
    preferred_term: INF2
    term:
      id: hgnc:23791
      label: INF2
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  frequency: >-
    Found in 12 of 16 (75%) index patients with Charcot-Marie-Tooth neuropathy plus FSGS who
    had already been excluded for PMP22 and MPZ.
  features: >-
    Disease-associated variants cluster in the amino-terminal DID. Missense, in-frame deletion and cryptic
    splice alleles occur. Familial and confirmed de novo cases are reported. Variant location alone does
    not reliably predict whether the phenotype is isolated neuropathy, isolated renal disease or both.
  evidence:
  - reference: PMID:22187985
    reference_title: "INF2 mutations in Charcot-Marie-Tooth disease with glomerulopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

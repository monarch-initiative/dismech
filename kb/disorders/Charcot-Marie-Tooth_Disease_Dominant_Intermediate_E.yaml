- name: Dynein-Mediated Nephrin Mistrafficking
  biological_scale: MOLECULAR
  description: >-
    In R218Q renal-disease models, disrupted sequestration of dynein light chain Dynll1 permits increased
    association with PI31 and promotes nephrin transport toward degradation pathways. This allele-specific
    renal mechanism has not been demonstrated in CMT-associated Schwann cells.
  cell_types:
  - preferred_term: podocyte
    term:
      id: CL:0000653
      label: podocyte
  downstream:
  - target: Proteasomal Nephrin Depletion
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:39621430
    reference_title: "Dynll1-PI31 Interaction Enhances Proteolysis Through the Proteasome, Representing a Novel Therapeutic Target for INF2-Related FSGS."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "The R218Q mutation in INF2 disrupted sequestration of Dynll1 by INF2, allowing Dynll1 to be captured by PI31 and promoting dynein-mediated transport of nephrin to the proteasome."
    explanation: >-
      R218Q podocyte experiments establish the trafficking route. Relevance to renal disease accompanying
      CMT is indirect; no neurological mechanism is demonstrated.
    quote_role: PRIMARY_RESULT
- name: Proteasomal Nephrin Depletion
  biological_scale: MOLECULAR
  description: >-
    Accelerated nephrin proteolysis depletes a slit-diaphragm component in R218Q podocytes. Puromycin
    aminonucleoside stress activates proteasomes in mice, and depletion occurs preferentially in the knock-in
    genotype. This is a renal model with an additional experimental insult.
  evidence:
  - reference: PMID:39621430
    reference_title: "Dynll1-PI31 Interaction Enhances Proteolysis Through the Proteasome, Representing a Novel Therapeutic Target for INF2-Related FSGS."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "A faster degradation of nephrin was observed in the R218Q KI podocytes than in the wt cells, which was largely rescued by siRNA-mediated knockdown of Dynll1 or PI31"
    explanation: >-
      The intervention supports the Dynll1-PI31 contribution to nephrin degradation in cultured renal-allele
      podocytes.
    directness: INDIRECT
  downstream:
  - target: Podocyte Injury
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  biological_processes:

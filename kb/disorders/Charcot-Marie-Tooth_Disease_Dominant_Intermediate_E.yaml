- name: Podocyte Loss and Glomerular Scarring
  biological_scale: TISSUE
  description: >-
    Progressive podocyte loss produces glomerular dysfunction, seen first as proteinuria with
    or without other features of nephrotic syndrome, and the histological pattern of scarring
    in localised regions of some but not all glomeruli - focal segmental glomerulosclerosis.
    In its advanced stage it reaches end-stage renal disease.
  downstream:
  - target: Proteinuria
    causal_link_type: DIRECT
  - target: Focal Segmental Glomerulosclerosis
    causal_link_type: DIRECT
  - target: Stage 5 Chronic Kidney Disease
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:32451589
    reference_title: "The formin INF2 in disease: progress from 10 years of research."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Patients with FSGS exhibit a progressive loss of podocytes, which causes glomerular dysfunction, and is initially manifested as proteinuria with or without other signs of nephrotic syndrome"
    explanation: >-
      The podocyte-loss-to-proteinuria sequence, stated for FSGS generally, in the review that
      covers the INF2 form specifically.
  - reference: PMID:22187985

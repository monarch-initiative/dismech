    marked fragmentation with G73D. This provides an experimental link between cytoskeletal organization
    and ER integrity; replication in Schwann cells or patient nerve remains needed.
  evidence:
  - reference: PMID:39337270
    reference_title: "Altered Endoplasmic Reticulum Integrity and Organelle Interactions in Living Cells Expressing INF2 Variants."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT

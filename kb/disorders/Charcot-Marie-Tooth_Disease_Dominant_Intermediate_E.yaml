- name: Podocyte Actin Cytoskeleton Disorganization
  biological_scale: CELLULAR
  description: >-
    The second arm. INF2 is strongly expressed in podocytes, whose foot processes are
    load-bearing actin structures, and mutant INF2 disorganises the actin cytoskeleton. The
    same de-repressed actin assembly that damages the Schwann cell acts here on a cell whose
    architecture is actin.

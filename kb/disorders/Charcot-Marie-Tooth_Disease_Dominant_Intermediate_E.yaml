    evidence_source: HUMAN_CLINICAL
    snippet: "Our results suggest that these lesions reflect a global disorder of the actin cytoskeleton in Schwann cells and that CMTDIE is the first peripheral nerve disorder associated with a Schwann cell actinopathy."
    explanation: >-

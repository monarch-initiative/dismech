- name: Cytoskeletal Disorganization in INF2 Variant Cells
  biological_scale: CELLULAR
  description: >-
    In transfected HeLa cells, CMT/FSGS-associated G73D and V108D variants disrupt actin stress fibers
    and microtubule organization more markedly than the tested renal-only variants. Reduced stable actin
    cables in these assays coexist with increased cytoplasmic actin in other systems; these experiments
    support dysregulation rather than a uniform direction of actin abundance.
  evidence:
  - reference: PMID:37491439
    reference_title: "Characterization of cytoskeletal and structural effects of INF2 variants causing glomerulopathy and neuropathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "Cells expressing G73D variant typically exhibited global dysregulation in which most microtubules were disorganized as bundles aligned parallel to the cell long axis and lacking polarity"
    explanation: >-
      The cellular phenotype was measured in transfected HeLa cells, not patient nerve.
  - reference: PMID:39337270
    reference_title: "Altered Endoplasmic Reticulum Integrity and Organelle Interactions in Living Cells Expressing INF2 Variants."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "The cells expressing G73D INF2 produced shorter and/or thinner F-actin bundles and formed more sheet-like ER components and fragmented INF2 aggregates in the peripheral ER than the cells expressing WT."
    explanation: >-
      Live-cell observation supports variant-associated actin and ER abnormalities.
  downstream:
  - target: Endoplasmic Reticulum Discontinuity
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Mitochondrial Misdistribution
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

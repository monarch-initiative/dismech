name: Charcot-Marie-Tooth Disease Dominant Intermediate E
category: Mendelian
creation_date: "2026-09-03T19:00:00Z"
synonyms:
- CMTDIE
- CMT dominant intermediate E
- DI-CMTE
- INF2-related Charcot-Marie-Tooth disease
- Charcot-Marie-Tooth neuropathy with focal segmental glomerulosclerosis
description: >-
  INF2-related Charcot-Marie-Tooth disease, historically designated dominant intermediate type E, is an
  autosomal dominant sensorimotor neuropathy associated with heterozygous variants in the regulatory diaphanous
  inhibitory domain of inverted formin 2. Childhood-onset distal weakness, muscle wasting, sensory impairment
  and foot deformity may accompany hearing loss. Electrophysiology spans intermediate and demyelinating
  patterns, with secondary axonal loss; conduction block can mimic an acquired inflammatory neuropathy.
  Kidney involvement ranges from minimal proteinuria to nephrotic syndrome, focal segmental glomerulosclerosis
  and early kidney failure. Neuropathy can occur without clinically important renal disease. Variant-dependent
  disturbances of INF2 regulation, Schwann-cell actin organization and organelle dynamics are implicated,
  but tissue selectivity and individual renal prognosis remain incompletely explained.

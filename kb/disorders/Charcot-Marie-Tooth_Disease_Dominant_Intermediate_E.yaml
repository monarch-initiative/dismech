    explanation: >-
      Cytoskeletal disorganisation is the measured consequence of the mutant protein; it is
      cited here as the shared lesion rather than as a podocyte-specific experiment.
  notes: >-
    The evidence in this node is INDIRECT for the podocyte specifically: the cytoskeletal
    disorganisation assay in the founding paper is not reported as podocyte-restricted, and
    what ties it to the kidney is INF2 expression plus the established actin dependence of
    foot-process architecture rather than a podocyte experiment on these alleles.
- name: Dynein-Mediated Nephrin Mistrafficking and Proteasomal Degradation
  biological_scale: MOLECULAR
  description: >-
    A specific route from the actin lesion to podocyte failure, worked out in detail for the
    INF2 R218Q allele. Normally INF2 sequesters dynein light chain 1; the mutant fails to, so
    Dynll1 is captured by PI31 and dynein carries the slit-diaphragm protein nephrin to the
    proteasome. Knocking down Dynll1 or PI31, inactivating dynein, or inhibiting the proteasome
    each restores nephrin, and bortezomib rescues the mouse.

    Two things limit how far this can be carried into CMTDIE, and both are recorded here rather
    than glossed. R218 lies in the residue range associated with monogenic FSGS, not in the
    range associated with the dual CMT/FSGS phenotype, so this is an adjacent allele rather
    than a CMTDIE allele. And nephrin is a podocyte protein, so nothing here speaks to the
    nerve arm at all.
  cell_types:
  - preferred_term: podocyte

name: Charcot-Marie-Tooth Disease Dominant Intermediate E
category: Mendelian
creation_date: "2026-09-03T19:00:00Z"
synonyms:
- CMTDIE
- CMT dominant intermediate E
- DI-CMTE
- INF2-related Charcot-Marie-Tooth disease
- Charcot-Marie-Tooth neuropathy with focal segmental glomerulosclerosis
description: >-
  Charcot-Marie-Tooth disease dominant intermediate E (CMTDIE) is a dominantly inherited
  peripheral neuropathy caused by heterozygous variants in INF2, the gene encoding inverted
  formin 2. It is the neurological arm of a two-organ disorder: the same gene, and often the
  same variant, also causes autosomal dominant focal segmental glomerulosclerosis (FSGS), and
  the combined neuropathy-plus-nephropathy presentation is what led to INF2 being tested in
  CMT at all.

  The organising fact of this entry is that the disease mutations are not scattered across the
  gene. Every pathogenic INF2 allele reported to date lies in the amino-terminal region, and
  in the CMT-plus-FSGS series all of them fell in exons 2 and 3, which encode the diaphanous
  inhibitory domain (DID). That domain is regulatory rather than catalytic, so the natural
  reading is that these variants change how INF2 is controlled rather than what it can do.

  Biochemistry has since made that reading concrete, and in a way that inverts the intuitive
  model. Purified INF2 is not autoinhibited - it polymerises actin constitutively in vitro -
  so the DID cannot be holding the molecule shut on its own. The missing inhibitor was
  purified from brain as a complex of cyclase-associated protein with lysine-acetylated actin,
  which requires the DID to act, and disease-associated INF2 mutants are poorly inhibited by
  it. So the DID variants are best understood as escaping an externally supplied brake, not as
  destroying a function. That is why this entry tags the actin-assembly node GAIN_OF_FUNCTION
  rather than INCREASED: the claim is that the process has left normal regulatory control, not
  that it is merely running faster.

  That reading is not only biochemical any more. In mice, a disease-associated INF2 point
  mutation confers susceptibility to glomerular disease while the knockout does not - which is
  the experiment that separates gain of function from haploinsufficiency in vivo rather than in
  a tube.

  How the same lesion reaches two tissues is partly answered, and the answer is positional.
  Variants between residues 184 and 245 give monogenic FSGS; variants between residues 57 and
  184 give the dual CMT-plus-FSGS disease, and the dual-phenotype variants cause more
  mitochondrial fragmentation and more cytoskeletal disruption in cells. So this entity is the
  more globally disruptive end of one gradient rather than a separate mechanism. INF2 is
  strongly expressed in both Schwann-cell cytoplasm and podocytes; in Schwann cells it
  colocalises and interacts with MAL, and mutant INF2 perturbs the INF2-MAL-CDC42 pathway,
  disorganises the cytoskeleton, binds CDC42 more avidly and mislocalises all three proteins.
  Nerve biopsy in six patients reads the result as a global disorder of the Schwann cell actin
  cytoskeleton with abnormal cytoplasmic actin accumulation - the first peripheral nerve
  disorder described as a Schwann cell actinopathy.

  What the positional rule does not explain is the intrafamilial variability, and the entry
  keeps that open. One CMT-range allele segregated as isolated FSGS in some members of a family
  and as the dual phenotype in others, so position sets what an allele can do and something
  unidentified decides what it does. Separately, a three-generation family with a cryptic
  splicing allele had unambiguous intermediate CMT with normal albumin and creatinine and at
  most mildly raised urine protein, so kidney involvement is common but not obligate - and the
  practical consequence, stated by those authors, is that INF2 testing should not be reserved
  for patients who have both. A second family shows the converse trap: INF2 renal disease is
  not always FSGS on biopsy.

  Where the genotype changes management is transplantation. Genetic FSGS generally does not
  recur in the graft, and four transplants in one INF2 family were recurrence-free.

  Electrophysiologically the neuropathy is intermediate: nerve conduction studies show
  demyelinating and axonal features together, which is what places this entity in the dominant
  intermediate CMT group rather than with CMT1 or CMT2. Nerve pathology matches, with heavy
  loss of myelinated fibres, onion bulbs and regeneration clusters, plus a distinctive
  ultrastructural finding in the non-myelinating compartment: supernumerary elongated Schwann
  cell extensions around unmyelinated fibres.

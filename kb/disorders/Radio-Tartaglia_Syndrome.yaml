diagnosis:
- name: Exome or genome sequencing
  description: >-
    The diagnosis is molecular: identification of a heterozygous truncating
    SPEN variant. Chromosomal microarray detects 1p36 deletions but not the
    sequence-level truncations that cause most cases, and the clinical picture
    can resemble other conditions, so exome or genome sequencing (trio where
    possible) is the effective test.
  evidence:
  - reference: PMID:39431794
    reference_title: "Clinical Features of a Japanese Girl With Radio-Tartaglia Syndrome due to a SPEN Truncating Variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Microarray analysis revealed no pathogenic aberrations. We performed
      trio-based whole exome sequencing and identified a recurrent pathogenic
      variant
    explanation: >-
      Microarray was uninformative and trio exome sequencing made the
      diagnosis.
  - reference: DOI:10.26815/acn.2024.00717
    reference_title: "Identification of De Novo Radio-Tartaglia Syndrome and Comparison of Clinical and Molecular Characteristics with Those of 1p36 Deletion Syndrome"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A 3-year-old boy was brought to the hospital and underwent whole genome
      sequencing to evaluate developmental delay and multiple anomalies. This
      led to the identification of a de novo truncating variant in SPEN.
    explanation: >-
      A second independent diagnosis made by genome sequencing.
- name: Prenatal genetic testing in families with a known variant
  description: >-
    Where a familial SPEN variant is known, it can be tested for prenatally by
    amniocentesis; fetal ultrasound may be unremarkable.
  evidence:
  - reference: PMID:41574619
    reference_title: "Prenatal Diagnosis of Radio-Tartaglia Syndrome Caused by a Loss-of-Function Variant in SPEN in a Chinese Family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Prenatal ultrasonography during pregnancy revealed no obvious structural
      abnormalities. However, prenatal genetic testing revealed the foetus
      harboured the same SPEN pathogenic variant.
    explanation: >-
      Ultrasound was normal and genetic testing was what identified the
      affected fetus.
- name: X-chromosome DNA methylation episignature (research)
  description: >-
    In affected females a blood DNA methylation episignature restricted to the
    X chromosome distinguishes cases. It is a research-stage classifier derived
    from a small number of females, not reported for males, and not a validated
    stand-alone clinical test.
  evidence:
  - reference: PMID:33596411
    reference_title: "SPEN haploinsufficiency causes a neurodevelopmental disorder overlapping proximal 1p36 deletion syndrome with an episignature of X chromosomes in females."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a paradigm of an X chromosome-specific episignature that classifies
      syndromic traits
    explanation: >-
      The authors present the episignature as a classifier.
differential_diagnoses:
- name: Proximal 1p36 deletion syndrome
  description: >-
    The phenotype overlaps considerably with proximal 1p36 deletion syndrome,
    and SPEN is commonly deleted in it; it also overlaps with distal 1p36
    deletions that spare SPEN. Chromosomal microarray separates a
    multigene deletion from an intragenic SPEN variant; deletions removing both
    SPEN and RERE carry a higher rate of orofacial clefting.
  evidence:
  - reference: PMID:33596411
    reference_title: "SPEN haploinsufficiency causes a neurodevelopmental disorder overlapping proximal 1p36 deletion syndrome with an episignature of X chromosomes in females."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we used clinical data from 34 individuals with truncating variants
      in SPEN to define a neurodevelopmental disorder presenting with features
      that overlap considerably with those of proximal del1p36 syndrome.
    explanation: >-
      States the clinical overlap that makes this the main differential.
  - reference: DOI:10.26815/acn.2024.00717
    reference_title: "Identification of De Novo Radio-Tartaglia Syndrome and Comparison of Clinical and Molecular Characteristics with Those of 1p36 Deletion Syndrome"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, in all reported Korean cases of 1p36DS, the deletions were
      distal and did not involve SPEN; despite this, the clinical features of
      the disorder overlap considerably with those of RTS.
    explanation: >-
      The overlap extends to distal 1p36 deletions that spare SPEN, so a 1p36
      phenotype does not by itself implicate SPEN; molecular testing is needed.
- name: Down syndrome
  description: >-
    One reported girl with developmental delay, hypotonia, upslanting
    palpebral fissures, hypertelorism and epicanthus was first thought to have
    Down syndrome; cytogenetic testing excluded it.
  evidence:
  - reference: PMID:39431794
    reference_title: "Clinical Features of a Japanese Girl With Radio-Tartaglia Syndrome due to a SPEN Truncating Variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We first considered DS as a differential diagnosis based on the
      developmental delay with hypotonia and facial features, including an
      upslanted palpebral fissure, hypertelorism, epicanthus folds, and a low
      nose; however, it was ruled out after cytogenetic testing.
    explanation: >-
      A documented case where Down syndrome was the working diagnosis.
treatments:
- name: Clonazepam and botulinum toxin for dystonia
  description: >-
    Symptomatic treatment of dystonia, reported in one adult patient, who also
    received escitalopram for psychiatric symptoms; the report describes some
    reduction of symptoms at follow-up. There is no disease-modifying treatment
    for this syndrome; management is otherwise supportive and directed at the
    individual's developmental, behavioural, cardiac and feeding needs.
  treatment_term:
    preferred_term: Pharmacotherapy for dystonia
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: clonazepam
      term:
        id: CHEBI:3756
        label: clonazepam
    - preferred_term: botulinum toxin type A
      term:
        id: CHEBI:3160
        label: Botulinum toxin type A
  therapeutic_modality: OTHER
  target_mechanisms:
  - target: Dystonia
  evidence:
  - reference: PMID:41525714
    reference_title: "Two Cases of SPEN Haploinsufficiency Presenting with Dystonia: Expanding the Genotype and Phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatment included clonazepam and botulinum toxin injections for the
      dystonia and escitalopram for the psychiatric symptoms, with some
      reduction of the symptoms at follow‐up.
    explanation: >-
      Single-patient report of symptomatic benefit; not a controlled result.
animal_models:
- name: Spen-null and neural crest-conditional Spen mouse
  species: Mouse
  genotype: Spen homozygous null; Spen conditional deletion in cranial neural crest
  publication: PMID:42456047
  description: >-
    Homozygous Spen-null embryos develop cleft palate from defective palatal
    shelf elevation and extension; deleting Spen only in cranial neural crest
    delays palatal development. Rere and Spen interact genetically in palate
    development.
  modeled_mechanisms:
  - target: Impaired Palatal Shelf Development
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Reproduces a palatal shelf defect, and localizes it to neural
      crest-derived mesenchyme.
    limitations: >-
      The model is homozygous null, while patients are heterozygous. The model
      shows frank cleft palate, which in patients is only occasional, whereas
      the common human finding, a high or narrow palate, is not what the null
      mouse displays.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        Palatogenesis timing and the degree of shelf delay that produces a
        cleft differ between mouse and human, so a cleft in the mouse does not
        predict a cleft in patients.
    evidence:
    - reference: PMID:42456047
      reference_title: "SPEN deficiency contributes to the development of orofacial clefts in humans and mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We show that Spen-null embryos have abnormal palatal shelf elevation and
        extension leading to the development of cleft palate.
      explanation: >-
        The model's palatal phenotype.
- name: Spen-depleted Drosophila fat body
  species: Fruit fly
  genotype: Spen knockdown in larval fat body
  publication: PMID:28640815
  description: >-
    Spen depletion in Drosophila fat-storage cells increases fat and impairs
    energy liberation and beta-oxidation; dietary supplementation changes the
    outcome in a stage-dependent way.
  modeled_mechanisms:
  - target: Impaired Fat Mobilization and Fatty Acid Beta-Oxidation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: CELLULAR
    description: >-
      Supplies the only mechanistic account of why SPEN loss might cause
      obesity.
    limitations: >-
      Invertebrate fat body, not mammalian adipose tissue; no human metabolic
      measurement exists to compare against, so the model's relevance to the
      obesity in this syndrome is unconfirmed.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        The Drosophila fat body combines liver and adipose functions, so a
        fat-body storage defect cannot be assigned to one human tissue.
    evidence:
    - reference: PMID:28640815
      reference_title: "An autonomous metabolic role for Spen."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Spen-depleted larvae had defects in energy liberation from stores,
        including starvation sensitivity and major changes in the levels of
        metabolic enzymes and metabolites, particularly those involved in
        β-oxidation.
      explanation: >-
        The model's metabolic phenotype.
discussions:
- discussion_id: ratars_x_episignature_function
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does heterozygous SPEN loss disturb X-chromosome inactivation in human
    females, and does the female X-chromosome methylation episignature have any
    consequence for the clinical features or for sex differences such as the
    female predominance of obesity?
  attaches_to:
  - pathophysiology#Female X Chromosome DNA Methylation Episignature
  - pathophysiology#Impaired XIST-SPEN-Mediated X Chromosome Silencing
  rationale: >-
    The X-silencing role of SPEN was shown with complete loss in mouse embryos
    and stem cells, and in neural progenitors SPEN is not needed to maintain
    silencing. Patients keep one functional copy. The episignature is the only
    human observation, measured in blood, and no study has measured
    X-inactivation skewing or escape-gene expression in patient cells.
  status: OPEN
  evidence:
  - reference: PMID:32025035
    reference_title: "SPEN integrates transcriptional and epigenetic control of X-inactivation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      SPEN is dispensable for maintenance of XCI in neural progenitors,
      although it significantly decreases the expression of genes that escape
      XCI.
    explanation: >-
      The model evidence is for complete loss and shows a maintenance role
      limited to escape genes, which leaves the human haploinsufficient case
      open.
- discussion_id: ratars_obesity_mechanism
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Is the obesity and raised BMI of this syndrome caused by the
    fat-mobilization defect seen in Spen-depleted Drosophila, or by a central
    (hypothalamic or behavioural) mechanism that the fly model cannot
    represent?
  attaches_to:
  - pathophysiology#Impaired Fat Mobilization and Fatty Acid Beta-Oxidation
  - phenotypes#Obesity
  rationale: >-
    The only mechanistic evidence comes from invertebrate fat-storage cells and
    a body-fat correlation in mouse. No human metabolic, lipidomic or
    energy-expenditure study exists, and the female predominance of obesity in
    patients is unexplained.
  status: OPEN
  evidence:
  - reference: PMID:28640815
    reference_title: "An autonomous metabolic role for Spen."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Finally, mouse Spen and Spenito transcript levels scaled directly with
      body fat in vivo, suggesting a conserved role in fat liberation and
      catabolism.
    explanation: >-
      The mammalian link is correlational, which is why the human mechanism is
      open.
- discussion_id: ratars_phenotype_expansion
  kind: KNOWLEDGE_GAP
  prompt: >-
    Are dystonia and sensorineural hearing loss part of the SPEN-related
    spectrum, or coincidental findings in single families?
  attaches_to:
  - phenotypes#Dystonia
  - genetic#SPEN
  rationale: >-
    Dystonia is reported in one mother-daughter pair whose other relatives with
    tremor were not tested. Hearing loss occurred in 3 of 31 of the founding
    series, but severe congenital sensorineural hearing loss in a premature boy
    carrying a SPEN variant of uncertain significance, inherited from a healthy
    father, cannot be attributed to this syndrome. Both need further cases.
  status: OPEN
  evidence:
  - reference: PMID:40529391
    reference_title: "Syndromic congenital hypoacusis associated with premature birth and a variant of the SPEN gene: A case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      who possessed a novel variant of the SPEN gene (discovered by whole exome
      sequencing), which was inherited from a healthy father, and severe
      congenital bilateral sensorineural hearing loss. This SPEN gene variant
      was classified as having unknown significance.
    explanation: >-
      The variant is inherited from an unaffected parent and of uncertain
      significance, so hearing loss is not recorded as a phenotype.
  - reference: PMID:41525714
    reference_title: "Two Cases of SPEN Haploinsufficiency Presenting with Dystonia: Expanding the Genotype and Phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      While dystonia can be idiopathic or associated with other neurological
      disorders, it has never been reported in patients with SPEN
      haploinsufficiency and RTS.
    explanation: >-
      The authors themselves flag dystonia as a single-family finding.

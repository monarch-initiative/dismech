name: Radio-Tartaglia Syndrome
creation_date: "2026-10-09T20:30:00Z"
description: >-
  Radio-Tartaglia syndrome (RATARS) is an autosomal dominant neurodevelopmental
  disorder caused by heterozygous truncating, loss-of-function variants in SPEN,
  a transcriptional repressor gene at 1p36 that lies just centromeric to the
  proximal 1p36 deletion critical region. It was defined in 2021 from 34
  individuals and overlaps clinically with proximal 1p36 deletion syndrome:
  developmental delay and intellectual disability, autism spectrum disorder,
  anxiety, aggression and attention deficit, hypotonia, brain and spine
  anomalies, congenital heart defects, a high or narrow palate, facial
  dysmorphism, and obesity or increased BMI that is more marked in females.
  Most variants arise de novo, but familial transmission with variable
  expressivity is documented. SPEN is the protein through which XIST RNA
  initiates silencing of one X chromosome, and affected females carry a
  distinctive X-chromosome DNA methylation episignature in blood; whether that
  epigenetic change contributes to the clinical features is not established.
category: Mendelian
disease_term:
  preferred_term: Radio-Tartaglia syndrome
  term:
    id: MONDO:0859143
    label: Radio-Tartaglia syndrome
synonyms:
- RATARS
- SPEN-related neurodevelopmental disorder
- SPEN haploinsufficiency syndrome
parents:
- neurodevelopmental disorder
- syndromic intellectual disability
inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    A single heterozygous truncating SPEN variant is sufficient. Most published
    variants arose de novo; transmission over three generations has been
    reported in a Chinese family, with milder disease in the transmitting
    grandmother than in her daughter, and a mother-daughter pair has been
    reported with a dystonia-predominant presentation.
  evidence:
  - reference: PMID:41574619
    reference_title: "Prenatal Diagnosis of Radio-Tartaglia Syndrome Caused by a Loss-of-Function Variant in SPEN in a Chinese Family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Radio-Tartaglia Syndrome (RATARS) is a rare autosomal dominant
      neurodevelopmental disorder caused by loss-of-function (LoF) variants in
      SPEN.
    explanation: >-
      States the dominant mode and the loss-of-function variant class directly.
  - reference: PMID:41574619
    reference_title: "Prenatal Diagnosis of Radio-Tartaglia Syndrome Caused by a Loss-of-Function Variant in SPEN in a Chinese Family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sanger sequencing confirmed the authenticity of the variant and revealed
      that it was inherited from the mother of the pregnant woman.
    explanation: >-
      Transmission of a heterozygous SPEN frameshift from an affected parent to
      an affected child, and on to the fetus, is the segregation pattern of a
      dominant disorder.
  - reference: PMID:39431794
    reference_title: "Clinical Features of a Japanese Girl With Radio-Tartaglia Syndrome due to a SPEN Truncating Variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified a de novo heterozygous pathogenic variant of SPEN and
      diagnosed her with RATARS.
    explanation: >-
      A de novo heterozygous variant causing disease is consistent with
      dominant (haploinsufficient) inheritance.
prevalence:
- population: Published RATARS case literature
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    The founding series described 34 individuals. Later single-family reports
    (Japan, China, Slovenia) add a handful of cases. No population-based
    prevalence or incidence estimate exists, and 34 is a case count, not a rate.
  evidence:
  - reference: PMID:39431794
    reference_title: "Clinical Features of a Japanese Girl With Radio-Tartaglia Syndrome due to a SPEN Truncating Variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This syndrome is extremely rare, with only 34 cases reported to date.
    explanation: >-
      Gives the cumulative published case count at the time of the report.
pathophysiology:
- name: SPEN Haploinsufficiency
  biological_scale: MOLECULAR
  description: >-
    A heterozygous stop-gain or frameshift variant in SPEN (or, in a broader
    proximal 1p36 deletion, loss of one SPEN copy) halves the dose of SPEN
    protein. The founding series consisted entirely of truncating variants;
    reduced protein was inferred from variant class and was not measured
    variant by variant in patient cells.
  genes:
  - preferred_term: SPEN
    term:
      id: hgnc:17575
      label: SPEN
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    zygosity: HETEROZYGOUS
  evidence:
  - reference: PMID:33596411
    reference_title: "SPEN haploinsufficiency causes a neurodevelopmental disorder overlapping proximal 1p36 deletion syndrome with an episignature of X chromosomes in females."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we used clinical data from 34 individuals with truncating variants
      in SPEN to define a neurodevelopmental disorder presenting with features
      that overlap considerably with those of proximal del1p36 syndrome.
    explanation: >-
      The founding cohort is defined by heterozygous truncating SPEN variants.
  - reference: PMID:33596411
    reference_title: "SPEN haploinsufficiency causes a neurodevelopmental disorder overlapping proximal 1p36 deletion syndrome with an episignature of X chromosomes in females."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We conclude that SPEN is required for multiple developmental processes and
      SPEN haploinsufficiency is a major contributor to a disorder associated
      with deletions centromeric to the previously established 1p36 critical
      regions.
    explanation: >-
      Names haploinsufficiency as the disease mechanism.
  downstream:
  - target: Reduced SPEN-Mediated Transcriptional Repression
    causal_link_type: DIRECT
    description: >-
      SPEN is a transcriptional repressor, so halving its dose reduces the
      repressive activity it recruits to target genes.
    evidence:
    - reference: PMID:33596411
      reference_title: "SPEN haploinsufficiency causes a neurodevelopmental disorder overlapping proximal 1p36 deletion syndrome with an episignature of X chromosomes in females."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        SPEN encodes a transcriptional repressor commonly deleted in proximal
        del1p36 syndrome and is located centromeric to the proximal 1p36
        critical region.
      explanation: >-
        Establishes the molecular function that a reduced dose diminishes.
  - target: Impaired XIST-SPEN-Mediated X Chromosome Silencing
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The X-silencing function of SPEN was established by complete loss of SPEN
      in mouse cells and embryos. Whether a single remaining SPEN copy is enough
      for normal X inactivation in human females has not been tested; the
      female X-chromosome methylation episignature is the only human
      observation pointing that way.
    evidence:
    - reference: PMID:33596411
      reference_title: "SPEN haploinsufficiency causes a neurodevelopmental disorder overlapping proximal 1p36 deletion syndrome with an episignature of X chromosomes in females."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        providing further evidence of a specific contribution of the protein to
        the epigenetic control of this chromosome
      explanation: >-
        The authors read the female episignature as evidence that SPEN dosage
        matters for epigenetic control of the X chromosome in patients.
- name: Reduced SPEN-Mediated Transcriptional Repression
  biological_scale: MOLECULAR
  description: >-
    SPEN (also called SHARP or MINT) binds RNA through its RRM domains and, via
    its C-terminal SPOC domain, recruits the NCoR/SMRT co-repressor and HDAC3
    as well as NuRD, m6A and RNA polymerase II machinery. In mouse it also
    competes with the Notch intracellular domain for RBP-J and so dampens
    Notch-dependent transactivation. Which developmental target genes are
    de-repressed in RATARS patients is unknown.
  biological_processes:
  - preferred_term: negative regulation of transcription by RNA polymerase II
    modifier: DECREASED
    term:
      id: GO:0000122
      label: negative regulation of transcription by RNA polymerase II
  - preferred_term: negative regulation of Notch signaling pathway
    modifier: DECREASED
    term:
      id: GO:0045746
      label: negative regulation of Notch signaling pathway
  genes:
  - preferred_term: SPEN
    term:
      id: hgnc:17575
      label: SPEN
  evidence:
  - reference: PMID:32025035
    reference_title: "SPEN integrates transcriptional and epigenetic control of X-inactivation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We identify the protein partners of SPOC, including NCoR/SMRT, the m6A
      RNA methylation machinery, the NuRD complex, RNA polymerase II and factors
      involved in the regulation of transcription initiation and elongation.
    explanation: >-
      Identifies the co-repressor and transcription machinery that SPEN
      recruits, the activity a reduced dose would diminish. Measured in mouse
      embryonic stem cells.
  - reference: PMID:12594956
    reference_title: "Regulation of marginal zone B cell development by MINT, a suppressor of Notch/RBP-J signaling pathway."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: >-
      We found that Msx2-interacting nuclear target protein (MINT) competed with
      the intracellular region of Notch for binding to a DNA binding protein
      RBP-J and suppressed the transactivation activity of Notch signaling.
    explanation: >-
      Shows the Notch-repressive activity of mouse SPEN (MINT). Indirect for
      this disease, since no Notch-pathway change has been measured in RATARS
      patients.
  downstream:
  - target: Abnormal Neurodevelopment
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      SPEN is needed for several developmental processes, but the de-repressed
      genes and the neural cell types that carry the defect in patients are not
      identified.
    evidence:
    - reference: PMID:33596411
      reference_title: "SPEN haploinsufficiency causes a neurodevelopmental disorder overlapping proximal 1p36 deletion syndrome with an episignature of X chromosomes in females."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We conclude that SPEN is required for multiple developmental processes
      explanation: >-
        Supports SPEN dosage acting on development generally; the specific
        neural intermediates remain unresolved.
  - target: Impaired Palatal Shelf Development
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      In the mouse, Spen loss reduces palatal mesenchyme proliferation and
      delays shelf elevation; Spen interacts genetically with the RERE
      co-repressor in this process. The transcriptional targets involved are
      not identified.
    evidence:
    - reference: PMID:42456047
      reference_title: "SPEN deficiency contributes to the development of orofacial clefts in humans and mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Our results suggest that SPEN is required for normal mammalian palatal
        development, that RERE and SPEN interact in a common pathway during
        palatal development
      explanation: >-
        Places SPEN, a transcriptional repressor, upstream of palatal
        development, in a pathway shared with another 1p36 co-repressor.
  - target: Impaired Fat Mobilization and Fatty Acid Beta-Oxidation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      In Drosophila, Spen acts cell-autonomously in fat-storage cells to permit
      lipid mobilization, and mouse Spen transcript levels track body fat. This
      is a candidate explanation for the obesity in RATARS, not a demonstrated
      human mechanism.
    evidence:
    - reference: PMID:28640815
      reference_title: "An autonomous metabolic role for Spen."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: >-
        We find that manipulating Spen expression alters larval fat levels in a
        cell-autonomous manner.
      explanation: >-
        Fly evidence that Spen dosage controls fat storage; indirect for the
        human disease.
- name: Impaired XIST-SPEN-Mediated X Chromosome Silencing
  biological_scale: MOLECULAR
  description: >-
    XIST RNA recruits SPEN to the future inactive X through SPEN RRM4 and the
    XIST A-repeat; SPEN then recruits SMRT/HDAC3, histones are deacetylated and
    RNA polymerase II is excluded, initiating silencing. In mouse, SPEN is
    essential to initiate X inactivation but dispensable for its maintenance in
    neural progenitors, where it still dampens expression of escape genes. All
    of this comes from complete loss of SPEN; the effect of heterozygous loss
    on human X inactivation is untested.
  biological_processes:
  - preferred_term: dosage compensation by inactivation of X chromosome
    modifier: DECREASED
    term:
      id: GO:0009048
      label: dosage compensation by inactivation of X chromosome
  genes:
  - preferred_term: SPEN
    term:
      id: hgnc:17575
      label: SPEN
  evidence:
  - reference: PMID:25915022
    reference_title: "The Xist lncRNA interacts directly with SHARP to silence transcription through HDAC3."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Our results suggest that Xist silences transcription by directly
      interacting with SHARP, recruiting SMRT, activating HDAC3, and
      deacetylating histones to exclude Pol II across the X chromosome.
    explanation: >-
      Defines the XIST-SPEN-SMRT-HDAC3 silencing route in mouse embryonic stem
      cells.
  - reference: PMID:32025035
    reference_title: "SPEN integrates transcriptional and epigenetic control of X-inactivation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We show that SPEN is essential for initiating gene silencing on the X
      chromosome in preimplantation mouse embryos and in embryonic stem cells.
    explanation: >-
      Shows SPEN is required to initiate X silencing in vivo.
  - reference: PMID:32025035
    reference_title: "SPEN integrates transcriptional and epigenetic control of X-inactivation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      SPEN is dispensable for maintenance of XCI in neural progenitors,
      although it significantly decreases the expression of genes that escape
      XCI.
    explanation: >-
      Limits the claim: in neural progenitors SPEN is not needed to keep the X
      silent, but it does restrain escape genes, which is relevant to a
      neurodevelopmental disease.
  - reference: PMID:38164599
    reference_title: "Dissection of protein and RNA regions required for SPEN binding to XIST A-repeat RNA."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Binding of SPEN to XIST RNA requires RRM 4 of the protein, in contrast to
      the requirement of RRM 3 and RRM 4 for specific binding to SRA RNA.
    explanation: >-
      Maps the human SPEN domain that binds XIST, using purified human
      components.
  downstream:
  - target: Female X Chromosome DNA Methylation Episignature
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The episignature is restricted to the X chromosome and to females, which
      is the pattern expected if SPEN dosage affects the epigenetic state of the
      inactive X. The link is inferred from that specificity; no study has
      measured X-inactivation skewing or escape-gene expression in patients.
    evidence:
    - reference: PMID:33596411
      reference_title: "SPEN haploinsufficiency causes a neurodevelopmental disorder overlapping proximal 1p36 deletion syndrome with an episignature of X chromosomes in females."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Finally, we show that haploinsufficiency of SPEN is associated with a
        distinctive DNA methylation episignature of the X chromosome in affected
        females
      explanation: >-
        The observed female-specific, X-restricted methylation change is the
        downstream readout of this node.
- name: Female X Chromosome DNA Methylation Episignature
  biological_scale: MOLECULAR
  description: >-
    Peripheral-blood DNA from affected females shows a distinctive methylation
    pattern confined to the X chromosome. The founding paper describes it as an
    X chromosome-specific episignature that classifies the syndrome; it is a
    research-stage biomarker from a small number of females and is not reported
    for affected males. Whether it has any functional consequence for the
    clinical features, or explains any sex difference in presentation, is not
    known.
  evidence:
  - reference: PMID:33596411
    reference_title: "SPEN haploinsufficiency causes a neurodevelopmental disorder overlapping proximal 1p36 deletion syndrome with an episignature of X chromosomes in females."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Finally, we show that haploinsufficiency of SPEN is associated with a
      distinctive DNA methylation episignature of the X chromosome in affected
      females
    explanation: >-
      Direct statement of the female X-chromosome episignature.
  - reference: PMID:33596411
    reference_title: "SPEN haploinsufficiency causes a neurodevelopmental disorder overlapping proximal 1p36 deletion syndrome with an episignature of X chromosomes in females."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a paradigm of an X chromosome-specific episignature that classifies
      syndromic traits
    explanation: >-
      The authors present the signature as a classifier, which is why it is
      recorded as a biomarker rather than as a cause of any phenotype.
- name: Abnormal Neurodevelopment
  biological_scale: TISSUE
  description: >-
    Altered development of the brain underlies the developmental delay,
    intellectual disability, behavioural and psychiatric features, hypotonia
    and the structural brain anomalies. Reported neuroimaging findings vary
    between individuals. The intermediate cell types and the genes that
    mediate the effect are unresolved.
  biological_processes:
  - preferred_term: central nervous system development
    modifier: ABNORMAL
    term:
      id: GO:0007417
      label: central nervous system development
  evidence:
  - reference: PMID:33596411
    reference_title: "SPEN haploinsufficiency causes a neurodevelopmental disorder overlapping proximal 1p36 deletion syndrome with an episignature of X chromosomes in females."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The clinical profile of this disease includes developmental delay/intellectual
      disability, autism spectrum disorder, anxiety, aggressive behavior,
      attention deficit disorder, hypotonia, brain and spine anomalies
    explanation: >-
      The neurodevelopmental core of the clinical profile.
  downstream:
  - target: Global developmental delay
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Intellectual disability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Autism spectrum disorder
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Anxiety
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Aggressive behavior
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Attention deficit disorder
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Hypotonia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Brain anomalies
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Gait disturbance
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Dystonia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Delayed speech and language development
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Motor delay
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Motor stereotypy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Seizure
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Feeding difficulties
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Inferred via hypotonia and oral-motor dysfunction; not studied directly.
- name: Impaired Palatal Shelf Development
  biological_scale: TISSUE
  description: >-
    In Spen-null mouse embryos, proliferation of mesenchymal cells in the
    medial palatal shelves is reduced at E13.5, delaying shelf elevation and
    extension and producing cleft palate; ablating Spen only in cranial neural
    crest cells delays palatal development. In people, a high or narrow palate
    is common and orofacial clefting occasional, and clefting is more frequent
    with 1p36 deletions removing both SPEN and RERE.
  biological_processes:
  - preferred_term: secondary palate development
    modifier: DECREASED
    term:
      id: GO:0062009
      label: secondary palate development
  - preferred_term: palatal mesenchymal cell proliferation
    modifier: DECREASED
    term:
      id: GO:0010463
      label: mesenchymal cell proliferation
  cell_types:
  - preferred_term: cranial neural crest cell
    term:
      id: CL:0000008
      label: migratory cranial neural crest cell
  evidence:
  - reference: PMID:42456047
    reference_title: "SPEN deficiency contributes to the development of orofacial clefts in humans and mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Mesenchymal cell proliferation in the medial halves of the palatal shelves
      of Spen-null embryos at E13.5 is significantly reduced.
    explanation: >-
      Identifies the cellular defect behind the palatal phenotype in the mouse.
  - reference: PMID:42456047
    reference_title: "SPEN deficiency contributes to the development of orofacial clefts in humans and mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Tissue specific ablation of Spen in the cranial neural crest cells results
      in delayed palatal development.
    explanation: >-
      Localizes the requirement to cranial neural crest-derived cells.
  downstream:
  - target: High narrow palate
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Inferred: the mouse shows delayed shelf elevation, and the common human
      palatal anomaly is a high or narrow palate rather than a cleft.
  - target: Orofacial cleft
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:42456047
      reference_title: "SPEN deficiency contributes to the development of orofacial clefts in humans and mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We show that Spen-null embryos have abnormal palatal shelf elevation and
        extension leading to the development of cleft palate.
      explanation: >-
        Shows the shelf defect producing cleft palate, in homozygous null mice.
- name: Impaired Fat Mobilization and Fatty Acid Beta-Oxidation
  biological_scale: CELLULAR
  description: >-
    Spen-depleted Drosophila fat-body cells store excess fat and fail to
    liberate it, with starvation sensitivity and changes in beta-oxidation
    enzymes and metabolites; diet alters these effects. A matching human
    metabolic signature has not been looked for. This node is a model-derived
    candidate explanation for the obesity and raised BMI in RATARS.
  biological_processes:
  - preferred_term: fatty acid beta-oxidation
    modifier: DECREASED
    term:
      id: GO:0006635
      label: fatty acid beta-oxidation
  evidence:
  - reference: PMID:28640815
    reference_title: "An autonomous metabolic role for Spen."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: >-
      Spen-depleted larvae had defects in energy liberation from stores,
      including starvation sensitivity and major changes in the levels of
      metabolic enzymes and metabolites, particularly those involved in
      β-oxidation.
    explanation: >-
      Fly evidence for the impaired-mobilization mechanism; indirect for
      humans.
  - reference: PMID:32107279
    reference_title: "Gene-Diet Interactions: Dietary Rescue of Metabolic Effects in spen-Depleted Drosophila melanogaster."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: >-
      Lipid catabolism is impaired in Spen-deficient fat storage cells,
      accompanied by a compensatory increase in glycolytic flux and protein
      catabolism.
    explanation: >-
      Follow-up from the same group restating the catabolic defect.
  downstream:
  - target: Obesity
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Hypothesised: a fat-mobilization defect would favour fat accumulation,
      but this has not been shown in patients or mammals.
    evidence:
    - reference: PMID:28640815
      reference_title: "An autonomous metabolic role for Spen."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: >-
        Finally, mouse Spen and Spenito transcript levels scaled directly with
        body fat in vivo, suggesting a conserved role in fat liberation and
        catabolism.
      explanation: >-
        The mammalian link is a correlation in mouse, so the edge to human
        obesity is a hypothesis.

    quote_role: BACKGROUND
    snippet: >-
      Toes abnormalities - 4/27 (15) Scoliosis/kyphosis +, Scoliosis 5/28 (18)
    explanation: >-
      Count from the founding Radio et al. series as re-tabulated in this paper's Table 2 (positives over individuals assessed for the feature); 5 of 28 had scoliosis or kyphosis; the source does not split the two, so the count is an upper bound for scoliosis alone.
- category: Auditory

- name: Cox15 knockout with OPA1 overexpression
  description: Crossing muscle-specific Cox15 mutants with Opa1 transgenic mice improves cristae organization, stabilizes residual complex IV and respiratory supercomplexes, and improves respiration, endurance and survival. It is a genetic proof of principle, not a tested patient gene therapy.
  evidence:
  - reference: PMID:26039449
    reference_title: Opa1 overexpression ameliorates the phenotype of two mitochondrial disease mouse models.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: correction of cristae ultrastructure and mitochondrial respiration, improvement of motor performance and prolongation of lifespan were remarkable in Cox15(sm/sm)::Opa1(tg) mice.
    explanation: Reports multiple preclinical rescue outcomes.
  species: Mouse
  genotype: Cox15 sm/sm crossed with Opa1 transgenic mice
  publication: PMID:26039449
  modeled_mechanisms:
  - target: Disorganized Mitochondrial Cristae
    relationship: RESCUES
    description: OPA1 overexpression improves cristae organization.
    evidence:
    - reference: PMID:26039449
      reference_title: Opa1 overexpression ameliorates the phenotype of two mitochondrial disease mouse models.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: the Cox15sm/sm::Opa1tg cristae were organized in an ordered and parallel array and were tightly folded
      explanation: Ultrastructure documents rescue of the structural phenotype.
    limitations: Transgenic rescue in muscle-specific mice does not establish human efficacy or safety.
    fidelity: MODERATE
    model_scale: CELLULAR
  - target: Deficient Complex IV Biogenesis
    relationship: RESCUES
    description: OPA1 overexpression stabilizes residual complex IV and supercomplexes.
    evidence:
    - reference: PMID:26039449
      reference_title: Opa1 overexpression ameliorates the phenotype of two mitochondrial disease mouse models.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Mechanistically, respiratory chain supercomplexes were increased in Cox15(sm/sm)::Opa1(tg) mice, and residual monomeric complex IV was stabilized.

    limitations: Cellular and animal results do not establish clinical treatment efficacy.
    fidelity: MODERATE
    model_scale: MOLECULAR
discussions:
- discussion_id: cox15-clinical-biochemical-variability
  kind: INTERPRETATION
  status: OPEN
  prompt: What determines cardiac versus neurological severity and the relationship to residual complex IV activity?
  rationale: Marked tissue differences, a patient with normal fibroblast holoenzyme abundance, and clinical differences within families argue against a simple universal activity threshold or a reliable genotype-severity rule. The small case literature cannot establish penetrance or manifestation frequencies.
  evidence:
  - reference: PMID:15863660
    reference_title: Novel mutations in COX15 in a long surviving Leigh syndrome patient with cytochrome c oxidase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The clinical and biochemical phenotypes in COX15 defects are more heterogeneous than in other conditions associated with COX deficiency
    explanation: The early long-surviving case establishes biochemical and clinical heterogeneity.
  - reference: PMID:40439182
    reference_title: 'Clinical Phenotype and Neuroimaging Findings in Siblings with COX15 Deficiency: Case Report and Review of Previously Reported Cases.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: However, additional cases are needed to confirm a genotype–phenotype correlation.
    explanation: The recent report explicitly limits genotype-based prognosis.
- discussion_id: cox15-quality-control-translation
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: Do the muscle-model quality-control defects and intervention responses apply to human COX15 disease?
  rationale: Conditional muscle deletion reveals impaired flux and damaged mitochondrial accumulation. Rapamycin, AICAR, bezafibrate, rilmenidine and OPA1 overexpression have different biochemical and motor effects; none of these experiments demonstrates benefit in human COX15 disease or reproduces its complete neurological and cardiac spectrum.
  evidence:
  - *id017
  - *id018
  - *id016
  - reference: PMID:30309855
    reference_title: Rapamycin rescues mitochondrial myopathy via coordinated activation of autophagy and lysosomal biogenesis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: treated mice still perform much less than the WT littermates.
    explanation: Even the beneficial rapamycin effect leaves substantial motor impairment.

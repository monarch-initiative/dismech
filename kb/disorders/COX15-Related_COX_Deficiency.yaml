- name: Metabolic and perioperative precautions
  description: Minimize fasting and prevent catabolism during illness or procedures; consider perioperative glucose as appropriate, with individualized diet-related exceptions. Monitor respiratory status during anesthesia, avoid prolonged propofol exposure where possible, and avoid lactate-containing fluids in those at risk of lactic acidosis.

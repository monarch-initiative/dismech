genetic:
- name: COX15 pathogenic variants
  gene_term: *id007
  inheritance:
  - name: Autosomal recessive
    evidence:
    - *id008
  features: Missense, splice-altering and truncating alleles are reported. Arg217Trp recurs across families with different clinical severity. The founding paper used historical nucleotide coordinates C700T and C447-3G; these should not be confused with modern transcript-specific HGVS coordinates. Ser151Ter has occurred in compound heterozygosity with other alleles. Gly78Arg and Leu340Pro were described as likely pathogenic in their respective reports. A reliable genotype-severity prediction is not established.
  evidence:
  - reference: PMID:12474143
    reference_title: Mutations in COX15 produce a defect in the mitochondrial heme biosynthetic pathway, causing early-onset fatal hypertrophic cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Mutation analysis of COX15 in the patient identified a missense mutation (C700T) on one allele, changing a conserved arginine to tryptophan (R217W), and a splice-site mutation in intron 3 on the other allele (C447-3G), resulting in a deletion of exon 4.
    explanation: The original report establishes two different variant classes and records the historical numbering.
  - reference: PMID:33746038
    reference_title: 'A novel variant in the COX15 gene causing a fatal infantile cardioencephalomyopathy: A case report with clinical and molecular review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: c.232G > A; p.(Gly78Arg), classified as likely pathogenic, and c.452C > G; p.(Ser151Ter), as pathogenic
    explanation: Retains the reported distinction between likely pathogenic and pathogenic variants.
  - reference: PMID:40439182
    reference_title: 'Clinical Phenotype and Neuroimaging Findings in Siblings with COX15 Deficiency: Case Report and Review of Previously Reported Cases.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: A homozygous likely pathogenic variant in c.T1019C (p.L340P) in the exon 8 of COX15 gene was identified.
    explanation: The 2025 siblings extend the missense spectrum; the report classifies the variant as likely pathogenic.
  - reference: PMID:32232962
    reference_title: Phenotypic variability and mutation hotspot in COX15-related Leigh syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: several phenotypic features were markedly distinguished between the affected siblings and in relation to previous reports of COX15 mutations.
    explanation: Even identical familial genotypes do not imply identical organ involvement.
progression:
- phase: Variable infantile and childhood course
  evidence:
  - reference: PMID:12474143

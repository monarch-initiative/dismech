- name: Experimental rapamycin
  description: Rapamycin improved autophagic flux, lysosomal biogenesis, mitochondrial clearance and motor performance in muscle-specific Cox15-knockout mice. Absolute complex IV specific activity remained unchanged, while the COX/citrate-synthase ratio increased as citrate synthase normalized. Treated mice remained impaired relative to wild type; human efficacy is unestablished.

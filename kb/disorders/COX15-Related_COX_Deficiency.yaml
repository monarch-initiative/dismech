pathophysiology:
- name: COX15 Heme A Synthase Deficiency
  description: Biallelic variants reduce COX15 enzymatic function through allele-dependent defects in protein stability or catalytic properties. COX15 is a heme biosynthetic enzyme rather than a structural subunit of the mature respiratory complex.
  evidence:
  - reference: PMID:12474143
    reference_title: Mutations in COX15 produce a defect in the mitochondrial heme biosynthetic pathway, causing early-onset fatal hypertrophic cardiomyopathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: This splicing error introduces a frameshift and a premature stop codon, resulting in an unstable mRNA and, likely, a null allele.
    explanation: The founding splice allele reduces functional COX15 through abnormal splicing and transcript instability.
  - reference: PMID:26940873
    reference_title: Analysis of Oligomerization Properties of Heme a Synthase Provides Insights into Its Function in Eukaryotes.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: COX15 protein in the S344P/S151X cells was intrinsically unstable. However, steady-state levels of COX15 protein in cells with R217W/C447–3G were comparable with the control
    explanation: Patient fibroblast experiments show that deficient function need not entail reduced protein abundance.
  genes:
  - &id007
    preferred_term: COX15
    term:
      id: hgnc:2263
      label: COX15
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: heme A synthase activity
    term:
      id: GO:0120547
      label: heme A synthase activity
    modifier: DECREASED
  downstream:
  - target: Reduced Heme A Availability
    description: Reduced heme A synthase function restricts synthesis of the complex IV heme cofactor.
    causal_link_type: DIRECT
    evidence:
    - &id001
      reference: PMID:12474143
      reference_title: Mutations in COX15 produce a defect in the mitochondrial heme biosynthetic pathway, causing early-onset fatal hypertrophic cardiomyopathy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Patient N heart mitochondria contained markedly reduced levels of heme A and increased levels of heme O
      explanation: The founding patient heart shows impaired heme A production and accumulated precursor.
- name: Reduced Heme A Availability
  description: Heme A production is impaired. In the founding patient, heart mitochondria accumulated heme O, whereas patient fibroblasts did not show a detectable heme O peak; accumulation should not be assumed in every tissue.
  evidence:
  - *id001
  - reference: PMID:12474143
    reference_title: Mutations in COX15 produce a defect in the mitochondrial heme biosynthetic pathway, causing early-onset fatal hypertrophic cardiomyopathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Low heme A was also detected in patient fibroblasts; however, no heme O peak could be detected
    explanation: The heme profile differs between heart and cultured fibroblasts.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: heme A biosynthetic process
    term:
      id: GO:0006784
      label: heme A biosynthetic process
    modifier: DECREASED
  downstream:
  - target: Deficient Complex IV Biogenesis
    description: Limited heme A compromises maturation and assembly of functional complex IV.
    causal_link_type: DIRECT
    evidence:
    - &id002
      reference: PMID:12474143
      reference_title: Mutations in COX15 produce a defect in the mitochondrial heme biosynthetic pathway, causing early-onset fatal hypertrophic cardiomyopathy.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: These results suggest that reduced availability of heme A stalls the assembly of COX.
      explanation: Heme measurements and complementation support a cofactor-dependent assembly defect.
- name: Deficient Complex IV Biogenesis
  description: 'Insufficient cofactor supply can reduce the amount of assembled complex IV. This is allele- and tissue-dependent: normal amounts of assembled enzyme were reported in fibroblasts of a slowly progressive Leigh patient despite reduced activity.'
  evidence:
  - *id002
  - reference: PMID:15863660
    reference_title: Novel mutations in COX15 in a long surviving Leigh syndrome patient with cytochrome c oxidase deficiency.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: COX deficiency was mild in muscle and a normal amount of fully assembled COX was present in cultured fibroblasts.
    explanation: A patient-cell exception limits a universal claim that all COX15 variants abolish assembly.
  biological_scale: MOLECULAR
  conforms_to: complex_iv_assembly_deficiency#Complex IV Biogenesis Failure
  biological_processes:
  - preferred_term: mitochondrial respiratory chain complex IV assembly
    term:
      id: GO:0033617
      label: mitochondrial respiratory chain complex IV assembly
    modifier: DECREASED
  downstream:
  - target: Reduced Complex IV Respiratory Capacity
    description: Deficient maturation or activity lowers the functional capacity of terminal respiratory electron transfer.
    causal_link_type: DIRECT
    evidence:
    - &id003
      reference: PMID:12474143
      reference_title: Mutations in COX15 produce a defect in the mitochondrial heme biosynthetic pathway, causing early-onset fatal hypertrophic cardiomyopathy.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: COX activity and the total amount of fully assembled enzyme were reduced by 50%–70% in patient fibroblasts.
      explanation: The founding patient cells retain substantial complex IV activity; deficiency is not equivalent to complete ATP collapse.
- name: Reduced Complex IV Respiratory Capacity
  description: Complex IV activity is reduced with variable residual function and marked tissue differences. This compromises oxidative metabolism and is associated with cardiac, neurological and metabolic disease.
  evidence:
  - *id003
  - reference: PMID:21412973
    reference_title: 'Infantile cardioencephalopathy due to a COX15 gene defect: report and review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Postmortem cardiac muscle study showed marked complex IV deficiency. In contrast, complex IV activity was only slightly decreased in the skeletal muscle.
    explanation: Cardiac and skeletal-muscle activities can be substantially discordant.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: mitochondrial electron transport, cytochrome c to oxygen
    term:
      id: GO:0006123
      label: mitochondrial electron transport, cytochrome c to oxygen
    modifier: DECREASED
  downstream:
  - target: Hypertrophic cardiomyopathy
    description: The cardiac respiratory defect contributes to cardiomyopathy through incompletely resolved intermediates.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:21412973
      reference_title: 'Infantile cardioencephalopathy due to a COX15 gene defect: report and review.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: a neonatal rapidly progressive fatal course characterized by microcephaly, encephalopathy, persistent lactic acidosis, and hypertrophic cardiomyopathy
      explanation: The case links severe cardiac COX deficiency with hypertrophy and metabolic disease.
  - target: Lactic acidosis
    description: Deficient oxidative metabolism is associated with lactate accumulation and acidosis.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:21412973
      reference_title: 'Infantile cardioencephalopathy due to a COX15 gene defect: report and review.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: persistent lactic acidosis, and hypertrophic cardiomyopathy. Postmortem cardiac muscle study showed marked complex IV deficiency.
      explanation: A genetically confirmed COX15 patient had persistent lactic acidosis and tissue COX deficiency.
  - target: Developmental regression
    description: Impaired mitochondrial energy metabolism contributes to neurological deterioration; intermediate injury mechanisms remain incompletely resolved.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:26959537
      reference_title: Leigh syndrome associated with a novel mutation in the COX15 gene.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Here we report a 7-year-old girl with hypotonia, tremor, developmental delay and psychomotor regression.
      explanation: The case directly establishes the neurological phenotype in COX15-associated disease.
  - target: Bilateral basal ganglia lesions
    description: The neurological phenotype can include bilateral Leigh-pattern lesions.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:40439182
      reference_title: 'Clinical Phenotype and Neuroimaging Findings in Siblings with COX15 Deficiency: Case Report and Review of Previously Reported Cases.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: symmetrical hyperintensity in the bilateral cerebellar white matter, middle cerebellar peduncles, and putamen, along with volume loss and globus pallidi blooming.
      explanation: The two COX15 siblings have symmetric basal-ganglia and cerebellar lesions.
  - target: Disorganized Mitochondrial Cristae
    description: Severe respiratory dysfunction is associated with disrupted mitochondrial ultrastructure in the muscle model.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - &id004
      reference: PMID:26039449
      reference_title: Opa1 overexpression ameliorates the phenotype of two mitochondrial disease mouse models.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: While Cox15sm/sm muscle mitochondria showed profound cristae disorganization and prominent vacuolar degeneration of the inner mitochondrial compartment
      explanation: Electron microscopy shows disrupted cristae in the muscle-specific mouse model.
  - target: Impaired Autophagic Flux
    description: Muscle-specific COX15 loss is associated with impaired autophagic clearance; the intervening signaling mechanism is unresolved.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - &id005
      reference: PMID:30309855
      reference_title: Rapamycin rescues mitochondrial myopathy via coordinated activation of autophagy and lysosomal biogenesis.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Colchicine increased LC3‐II in WT but not in Cox15 sm/sm muscles, suggesting a block of the autophagic flux in the latter.
      explanation: The flux experiment distinguishes impaired clearance from increased steady-state autophagosome abundance.
- name: Disorganized Mitochondrial Cristae
  description: Abnormal mitochondrial cristae occur in affected cardiac tissue and are reproduced in Cox15-deficient mouse muscle. OPA1 overexpression improves cristae organization in the model, supporting a potentially modifiable structural component of respiratory dysfunction.
  evidence:
  - *id004
  - reference: PMID:12474143
    reference_title: Mutations in COX15 produce a defect in the mitochondrial heme biosynthetic pathway, causing early-onset fatal hypertrophic cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: greatly increased numbers of mitochondria with abnormal shapes, abnormally arranged cristae, and numerous matrix densities
    explanation: Electron microscopy of the founding patient heart documents mitochondrial ultrastructural abnormalities.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: inner mitochondrial membrane organization
    term:

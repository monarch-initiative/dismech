    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Echocardiogram on day 6 showed no ventricular enlargement, but she died at age 24 d from a massive biventricular hypertrophic cardiomyopathy.
    explanation: The founding patient had rapid cardiac progression.
  - reference: PMID:15863660
    reference_title: Novel mutations in COX15 in a long surviving Leigh syndrome patient with cytochrome c oxidase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: our patient had a slowly progressive course with no heart involvement.
    explanation: A contrasting course prevents treating neonatal fatality or cardiomyopathy as obligatory.
  - reference: PMID:40439182
    reference_title: 'Clinical Phenotype and Neuroimaging Findings in Siblings with COX15 Deficiency: Case Report and Review of Previously Reported Cases.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Both patients developed progressive generalized dystonia at ages 12 and 14
    explanation: Neurological progression can extend into adolescence.
  notes: Severe neonatal cases may die rapidly, while other patients survive into adolescence with slowly progressive neurological disease and no cardiomyopathy. Published ages describe individual cases rather than a survival estimate.
biochemical:
- name: Tissue-dependent complex IV deficiency
  evidence:
  - reference: PMID:21412973
    reference_title: 'Infantile cardioencephalopathy due to a COX15 gene defect: report and review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Postmortem cardiac muscle study showed marked complex IV deficiency. In contrast, complex IV activity was only slightly decreased in the skeletal muscle.
    explanation: Direct human tissue comparison supports this diagnostic caveat.
  notes: Enzyme deficiency can be severe in heart while mild or low-normal in skeletal muscle. Biopsy results must be interpreted in their tissue and clinical context.

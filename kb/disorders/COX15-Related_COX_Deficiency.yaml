experimental_models:
- name: Patient fibroblast complementation
  description: Immortalized fibroblasts from the founding patient show reduced heme A and mature complex IV. COX15.1 expression partially rescues enzyme activity. The mild cellular defect does not reproduce the severity of the neonatal cardiac presentation.
  evidence:
  - reference: PMID:12474143
    reference_title: Mutations in COX15 produce a defect in the mitochondrial heme biosynthetic pathway, causing early-onset fatal hypertrophic cardiomyopathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Overexpression of COX15 restored COX activity to ∼60% of the control levels when normalized to citrate synthase
    explanation: Partial functional rescue supports the causal gene.
  experimental_model_type: CELL_LINE
  publication: PMID:12474143
  cell_source: Patient skin fibroblasts immortalized with HPV E6/E7 and human telomerase
  modeled_mechanisms:
  - target: Deficient Complex IV Biogenesis
    relationship: RECAPITULATES
    description: Patient cells reproduce deficient assembly and partial complementation rescue.
    evidence:
    - *id002
    limitations: Cellular and animal results do not establish clinical treatment efficacy.
    fidelity: HIGH
    model_scale: MOLECULAR
  - target: Reduced Heme A Availability
    relationship: RESCUES
    description: Wild-type COX15 expression raises cellular heme A.
    evidence:
    - reference: PMID:12474143
      reference_title: Mutations in COX15 produce a defect in the mitochondrial heme biosynthetic pathway, causing early-onset fatal hypertrophic cardiomyopathy.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Overexpression of COX15 in patient fibroblasts increased the heme A levels threefold
      explanation: The rescue links the gene to the cofactor deficit.
    limitations: Cellular and animal results do not establish clinical treatment efficacy.
    fidelity: HIGH
    model_scale: MOLECULAR
- name: Yeast COX15 pathogenic-variant model
  description: Yeast Cox15 Thr236Trp models human Arg217Trp, with Thr236Arg as a functional humanized control. The pathogenic analogue is stably expressed but impairs heme A synthesis, respiration and COX-subunit maintenance and alters oligomer migration.
  evidence:
  - reference: PMID:26940873
    reference_title: Analysis of Oligomerization Properties of Heme a Synthase Provides Insights into Its Function in Eukaryotes.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: The T236R variant rescued respiratory growth similarly to the yeast WT; however, the T236W variant was unable to support respiratory growth of the heme a synthase-deficient strain
    explanation: The homologous variant perturbs a conserved biochemical function.
  experimental_model_type: OTHER
  publication: PMID:26940873
  cell_source: Saccharomyces cerevisiae cox15 deletion strain expressing Cox15 variants
  modeled_mechanisms:
  - target: COX15 Heme A Synthase Deficiency
    relationship: PARTIALLY_RECAPITULATES
    description: Homologous pathogenic substitution compromises catalytic function.
    evidence:
    - reference: PMID:26940873
      reference_title: Analysis of Oligomerization Properties of Heme a Synthase Provides Insights into Its Function in Eukaryotes.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: impairs enzymatic activity and affects oligomerization of the Cox15 complex.
      explanation: Functional and native-gel studies support a catalytic and oligomeric consequence.
    limitations: The human Arg217 site corresponds to a naturally occurring threonine in baker yeast; this system cannot model neurological or cardiac presentation.
    fidelity: MODERATE
    model_scale: MOLECULAR
animal_models:
- name: Muscle-specific Cox15 knockout mouse
  description: Conditional deletion under the skeletal-muscle ACTA1 promoter produces severe COX-deficient myopathy with residual Cox15 expression. The model tests muscle respiratory and quality-control defects, not the complete human Leigh/cardioencephalomyopathy spectrum.
  evidence:
  - reference: PMID:21723506
    reference_title: In vivo correction of COX deficiency by activation of the AMPK/PGC-1α axis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Recombination of the Cox15 locus by the cre recombinase was detected only in skeletal muscle and, in trace amount, in the heart, whereas no recombination occurs in other tissues
    explanation: Defines the tissue limitation of the model.
  - *id005
  species: Mouse
  genotype: Muscle-specific Cox15 deletion driven by ACTA1-Cre; also reported as Cox15 sm/sm
  publication: PMID:21723506

      label: inner mitochondrial membrane organization
    modifier: ABNORMAL
- name: Impaired Autophagic Flux
  description: Autophagic flux is blocked in skeletal muscle of the conditional mouse model. This has not been demonstrated in COX15 patient tissues. Basal mTOR signaling was not significantly increased in the model, so constitutive mTOR activation is not established as the lesion.
  evidence:
  - *id005
  - reference: PMID:30309855
    reference_title: Rapamycin rescues mitochondrial myopathy via coordinated activation of autophagy and lysosomal biogenesis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: While mTOR signaling was not significantly changed in naïve Cox15 sm/sm versus WT mice, autophagy flux was reduced
    explanation: Impaired flux does not imply basal mTOR overactivation.
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  biological_processes:
  - preferred_term: autophagy
    term:
      id: GO:0006914
      label: autophagy
    modifier: DECREASED
  downstream:
  - target: Accumulation of Damaged Mitochondria
    description: Reduced clearance may permit damaged organelles to accumulate in mouse skeletal muscle.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - &id006
      reference: PMID:30309855
      reference_title: Rapamycin rescues mitochondrial myopathy via coordinated activation of autophagy and lysosomal biogenesis.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: A block of the autophagic flux may result in reduced clearance of dysfunctional mitochondria in Cox15 sm/sm muscle.
      explanation: The study proposes defective clearance as a contributor to mitochondrial accumulation in mouse muscle.
- name: Accumulation of Damaged Mitochondria
  description: The muscle-specific Cox15 model accumulates damaged mitochondria. Coordinated restoration of autophagic flux and lysosomal biogenesis improves clearance in rapamycin-treated mice; applicability to patient disease is unresolved.
  evidence:
  - *id006
  - reference: PMID:30309855
    reference_title: Rapamycin rescues mitochondrial myopathy via coordinated activation of autophagy and lysosomal biogenesis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Our results suggest that rapamycin induced the removal of damaged mitochondria, as demonstrated by correction of muscle morphology, reduction of mtDNA amount, normalization of CS activity, and increased mitochondrial respiration.
    explanation: Multiple model readouts support the organelle-clearance interpretation.
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL

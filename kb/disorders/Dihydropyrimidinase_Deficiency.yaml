- name: Plasma beta-aminoisobutyric acid
  presence: DECREASED
  notes: >-
    Reduced because the thymine arm of the pathway is blocked upstream of it.
    Beta-alanine, by contrast, is normal, which separates this disease
    biochemically from dihydropyrimidine dehydrogenase deficiency. Measured in
    two siblings only; whether the depletion matters clinically is unresolved.
  evidence:
  - reference: PMID:18600547
    reference_title: Beta-alanine and beta-aminoisobutyric acid levels in two siblings with dihydropyrimidinase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a normal concentration of beta-alanine and strongly decreased levels of beta-aminoisobutyric acid were observed in plasma, urine and CSF."
    explanation: The measured direction for both beta-amino acids.
genetic:
- name: DPYS
  gene_term:
    preferred_term: DPYS
    term:
      id: hgnc:3013
      label: DPYS
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    DPYS encodes dihydropyrimidinase, a zinc-dependent cyclic amidohydrolase
    that works as a tetramer. Reported variants cluster in exons 5 to 8, which
    carry about 41 per cent of the coding sequence but 71 per cent of the
    variants in the largest series. Residual activity varies widely between
    alleles, from none to about half of wild type, but it does not explain the
    clinical variability: the paper that first characterised the gene found no
    significant difference in residual activity between the variants carried
    by symptomatic and by asymptomatic individuals.
    Four variants recurred in unrelated patients in that series, and p.R302Q
    has since been seen in Chinese and other East Asian patients.
  inheritance:
  - name: Autosomal recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:20362666
    reference_title: "Dihydropyrimidinase deficiency: Phenotype, genotype and structural consequences in 17 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Seventy-one percent of the mutations were located at exons 5-8, representing 41% of the coding sequence."
    explanation: The exonic clustering described in the notes.
  - reference: PMID:20362666
    reference_title: "Dihydropyrimidinase deficiency: Phenotype, genotype and structural consequences in 17 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Four mutations were identified in multiple unrelated DHP patients, indicating that DHP deficiency may be more common than anticipated."
    explanation: Recurrent alleles across unrelated patients.
  - reference: PMID:29054612
    reference_title: Dihydropyrimidinase deficiency in four East Asian patients due to novel and rare DPYS mutations affecting protein structural integrity and catalytic activity.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Functional analysis of recombinantly expressed DHP mutants carrying the p.M250I, p.H295R, p.Q334R, p.T418I and the p.R490H variant showed residual DHP activities of 2.0%, 9.8%, 9.7%, 64% and 0.3%, respectively."
    explanation: >-
      The range of residual activity across alleles, which is the basis for
      the statement that activity varies widely.
  variants:
  - name: p.R302Q
    description: >-
      Recurrent missense variant seen in unrelated patients including Chinese
      and other East Asian cases, with low residual activity on expression.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:20362666
      reference_title: "Dihydropyrimidinase deficiency: Phenotype, genotype and structural consequences in 17 patients."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Only DHP enzymes containing the mutations p.R302Q and p.T343A possessed a residual activity of 3.9% and 49%, respectively."
      explanation: Residual activity measured for this allele.
    - reference: PMID:23732435
      reference_title: Diagnosis of dihydropyrimidinase deficiency in a Chinese boy with dihydropyrimidinuria.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "DNA testing confirmed that the patient was compound heterozygous for two missense mutations, one known (p.R302Q) and the other was novel (p.N16K)."
      explanation: The same allele in a patient from a different population.
treatments:
- name: Fluoropyrimidine Avoidance or Dose Reduction
  description: >-
    The one actionable intervention in this disease, and it is preventive
    rather than therapeutic: knowing the diagnosis before a fluoropyrimidine
    is prescribed. The published argument for it is that severe toxicity has
    been reported in patients and in carriers of congenital pyrimidine
    metabolic disorders, so identifying affected people, including the
    asymptomatic ones, is worthwhile before 5-fluorouracil is given. Note
    this is a published recommendation rather than a guideline: no dosing
    algorithm for DPYS exists, unlike DPYD, and the cohort evidence on DPYS
    variants and toxicity is contested (see the Fluoropyrimidine Cytotoxicity
    node).
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Drug avoidance in a susceptible patient
  notes: >-
    No ontology term is bound, because this treatment consists of not
    administering a drug and NCIT appears to have no clinical-action term for
    that. Searched `ols:ncit` for l~drug avoidance, l~drug withholding,
    l~dose reduction, l~drug discontinuation (all returned nothing),
    l~avoidance (returns NCIT:C54264 Avoidance, a behavioural concept, plus
    questionnaire items), l~contraindication (returns NCIT:C50646 Medical
    Contraindication and NCIT:C37933 Contraindicated, which are a finding and
    a qualifier rather than actions) and l~treatment modification (returns
    protocol-administration items only). The entry previously bound
    NCIT:C15986 Pharmacotherapy here, which asserts the opposite of what this
    record means, so it was removed rather than replaced.
    therapeutic_modality is OTHER rather than BEHAVIORAL because a
    prescribing decision is not the behavioural, physical or dietary
    intervention that value describes.
  target_mechanisms:
  - target: Impaired Fluoropyrimidine Catabolism
    treatment_effect: INHIBITS
    description: >-
      Withholding or reducing the drug removes the substrate the deficient
      enzyme cannot process, which is the only point in this arm that can be
      acted on; the enzyme deficit itself is not treatable.
    evidence:
    - reference: PMID:30384990
      reference_title: A case of dihydropyrimidinase deficiency incidentally detected by urine metabolome analysis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "As severe 5-fluorouracil-associated toxicity has been reported in patients and carriers of congenital pyrimidine metabolic disorders, urinary pyrimidine analysis should be considered for those who will undergo 5-fluorouracil treatment."
      explanation: >-
        The published rationale for identifying affected people before the
        drug is given, which is what this intervention acts on.
  evidence:
  - reference: PMID:38199782
    reference_title: "The diagnostic odyssey of a patient with dihydropyrimidinase deficiency: a case report and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Identifying patients with DHP deficiency, even when they are asymptomatic, is warranted to prevent neurotoxicity while administering pyrimidine analog drugs, such as 5-fluorouracil (5-FU), to patients with cancer."
    explanation: >-
      States the case for pre-treatment identification including of
      asymptomatic individuals, which is what makes this a preventive
      intervention rather than a therapy.
- name: Levodopa for the Parkinsonian Presentation
  description: >-
    In the single reported patient with levodopa-responsive juvenile
    parkinsonism, levodopa relieved the motor symptoms. One patient, so this
    is a lead rather than established management, but it is recorded because
    the presentation is treatable and would not otherwise be looked for in a
    pyrimidine disorder.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: levodopa
      term:
        id: NCIT:C611
        label: Levodopa
  target_mechanisms:
  - target: Parkinsonism
    treatment_effect: MODULATES
    description: >-
      Symptomatic dopaminergic replacement. It acts on the parkinsonian
      phenotype, not on the metabolic lesion, and nothing is known about why
      this patient was dopamine-responsive.
    evidence:
    - reference: PMID:39558747
      reference_title: Juvenile Parkinsonism Associated With Dihydropyrimidinase Deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Levodopa treatment effectively relieved the patient's motor symptoms."
      explanation: The reported response in the single treated patient.
  evidence:
  - reference: PMID:39558747
    reference_title: Juvenile Parkinsonism Associated With Dihydropyrimidinase Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This report identifies DPYS as a novel genetic cause of juvenile parkinsonism and underscores the potential efficacy of levodopa therapy in managing motor dysfunction in DYPS-related parkinsonism."
    explanation: >-
      The authors' own framing, as potential efficacy from one case rather
      than established treatment.
diagnosis:
- name: Urine pyrimidine analysis
  description: >-
    Quantification of dihydrouracil and dihydrothymine in urine, by tandem
    mass spectrometry or gas chromatography-mass spectrometry. This is what
    makes the biochemical diagnosis; DPYS sequencing then confirms it and
    allows family testing.
  notes: >-
    No LOINC code exists for DPYS gene sequencing or for a dihydropyrimidinase
    enzyme assay. Searched the Monarch KG search API
    (https://api-v3.monarchinitiative.org/v3/api/search), which carries the
    LOINC table, on 2026-10-17: the spelled-out enzyme name
    "dihydropyrimidinase" returns 82 results and the gene symbol "DPYS"
    returns 241, both read in full, neither containing a LOINC entity (only
    PR/GO/MONDO/HP/OBA terms). LOINC adds codes release to release, so a later
    search could find one; this records what the KG held on that date. The
    urine metabolites this test actually measures do have codes, used in
    measurements below.
  measurements:
  - preferred_term: Urinary 5,6-dihydrouracil (creatinine-normalized)
    term:
      id: LOINC:79685-4
      label: 5,6-Dihydrouracil/Creatinine [Molar ratio] in Urine
  - preferred_term: Urinary dihydrothymine (creatinine-normalized)
    term:
      id: LOINC:78693-9
      label: Dihydrothymine/Creatinine [Molar ratio] in Urine
  evidence:
  - reference: PMID:38199782
    reference_title: "The diagnostic odyssey of a patient with dihydropyrimidinase deficiency: a case report and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Molecular genetic testing, specifically the identification of biallelic pathogenic variants in DPYS, has proven instrumental in confirming the diagnosis and facilitating family studies."
    explanation: The confirmatory role of sequencing after the biochemical finding.
  - reference: PMID:30384990
    reference_title: A case of dihydropyrimidinase deficiency incidentally detected by urine metabolome analysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Gas chromatography-mass spectrometry-based urine metabolomics demonstrated significant elevations of dihydrouracil and dihydrothymine, which were subsequently confirmed by a quantitative analysis using liquid chromatography-tandem mass spectrometry."
    explanation: >-
      The two-assay sequence in a patient found incidentally, which is how
      several reported patients came to attention.
- name: Urinary pyrimidine analysis before fluoropyrimidine treatment
  description: >-
    Proposed as a pre-treatment screen for patients about to receive

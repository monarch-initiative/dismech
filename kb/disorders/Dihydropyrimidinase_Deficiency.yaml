    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Reproduces the metabolite accumulation at the same enzymatic step, by a
      variant at a residue mutated in human disease.
    limitations: >-
      A single animal, and its hyperammonaemia is not a reported feature of
      the human disease, so the presentation is not a match even though the
      biochemistry is. Beta-aminoisobutyrate was not measured.
    evidence:
    - reference: PMID:23430934
      reference_title: "Dihydropyrimidinase deficiency: the first feline case of dihydropyrimidinuria with clinical and molecular findings."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Analysis of the feline DPYS gene encoding DHP demonstrated that the cat was homozygous for the missense mutation c.1303G>A (p.G435R) in exon 8, which corresponds to a known mutation in a human patient with DHP deficiency."
      explanation: >-
        The variant corresponds to a human patient allele, which is what makes
        this animal informative for the human mechanism.
    readouts:
    - name: Urinary dihydrouracil and dihydrothymine
      target: Dihydropyrimidine Accumulation with Beta-Aminoisobutyrate Depletion
      direction: INCREASED
      interpretation: The same metabolite accumulation as in human patients.
      evidence:
      - reference: PMID:23430934
        reference_title: "Dihydropyrimidinase deficiency: the first feline case of dihydropyrimidinuria with clinical and molecular findings."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "A gas chromatographic-mass spectrometric analysis of urinary metabolic substances showed the presence of large amounts of dihydrouracil and dihydrothymine and moderate amounts of uracil and thymine, suggesting DHP deficiency."
        explanation: The metabolite measurement in the affected cat.
differential_diagnoses:
- name: Dihydropyrimidine dehydrogenase deficiency
  description: >-
    Deficiency of DPYD, the first and rate-limiting enzyme of the same
    pathway. It shares the variable neurological presentation and the
    fluoropyrimidine-toxicity implication, but the block sits one step
    earlier, so uracil and thymine accumulate rather than their dihydro
    forms, and beta-alanine is depleted rather than normal. Curated as
    Dihydropyrimidine_Dehydrogenase_Deficiency.
- name: Beta-ureidopropionase deficiency
  description: >-
    Deficiency of UPB1, the third and final enzyme of pyrimidine catabolism.
    The N-carbamyl compounds that DHP produces accumulate instead, which is
    what separates it on urine analysis.
notes: >-
  Lump/split decision: DISEASE. One gene, one enzymatic step, and one
  conserved biochemical chain from biallelic DPYS loss of function to
  dihydropyrimidinuria. MONDO records no descendants for MONDO:0009111.

  Two things are deliberately not asserted. The neurological phenotype is not
  placed downstream of the metabolite disturbance in the pathograph, because
  biochemically identical siblings differ in whether they are affected; that
  link is carried as an EMERGING mechanistic hypothesis instead, which is the
  same treatment the sibling DPD entry gives the same problem. And the
  fluoropyrimidine-toxicity arm is modelled but kept thin: it rests on one
  attributed case plus two cohorts that disagree, so the cohort that found no
  association is cited as REFUTE on the same node rather than left out.

  No GeneReviews chapter exists; a PubMed genereviews[book] title search for
  dihydropyrimidinase and DPYS returned nothing.

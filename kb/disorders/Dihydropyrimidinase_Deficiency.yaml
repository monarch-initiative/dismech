name: Dihydropyrimidinase Deficiency
creation_date: "2026-10-15T07:30:00Z"
category: Mendelian
parents:
- Inborn Error of Pyrimidine Metabolism
disease_term:
  preferred_term: dihydropyrimidinase deficiency
  term:
    id: MONDO:0009111
    label: dihydropyrimidinuria
synonyms:
- dihydropyrimidinuria
- DHP deficiency
- DPYS deficiency
description: >-
  Autosomal recessive inborn error of pyrimidine catabolism caused by biallelic
  DPYS variants that abolish dihydropyrimidinase (DHP), the second of the three
  enzymes that break down uracil and thymine. DHP opens the ring of
  5,6-dihydrouracil and 5,6-dihydrothymine, so its loss makes these two
  intermediates accumulate in urine, plasma and cerebrospinal fluid, which is
  the biochemical signature of the disease. Downstream, beta-aminoisobutyric
  acid, the product of thymine breakdown, is strongly reduced while
  beta-alanine stays normal.

  The clinical picture is unusually variable. Reported patients have
  developmental delay, seizures including infantile spasms, white-matter
  abnormalities and brain atrophy, microcephaly, autistic features and
  gastrointestinal problems, while others with the same biochemical findings,
  including affected siblings, have no symptoms at all. How the metabolite
  changes would cause neurological disease is not known, and this entry records
  that link as a hypothesis rather than an established chain.

  DHP also catalyses the second step in the breakdown of 5-fluorouracil, so DHP
  deficiency is a candidate pharmacogenetic risk factor for fluoropyrimidine
  toxicity, by analogy with the upstream enzyme dihydropyrimidine
  dehydrogenase. The evidence for that arm is much weaker than for DPD
  deficiency: one reported case of severe toxicity in a partially deficient
  heterozygote, and cohort studies of DPYS variants that disagree with each
  other.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Fewer than 40 published patients by 2024. Recurrent variants found in
    unrelated patients, and variants enriched in Japanese population data, have
    led authors to suggest the disease is under-diagnosed.
  evidence:
  - reference: PMID:38958169
    reference_title: "Dihydropyrimidinase deficiency with atrioventricular septal defect: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Dihydropyrimidinase deficiency is a rare autosomal recessive disorder of the pyrimidine degradation pathway, with fewer than 40 patients published."
    explanation: Published case count as of 2024.
  - reference: PMID:29054612
    reference_title: Dihydropyrimidinase deficiency in four East Asian patients due to novel and rare DPYS mutations affecting protein structural integrity and catalytic activity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The observation that the identified mutations were more prevalent in East Asians and the Japanese population indicates that DHP deficiency may be more common than anticipated in these ethnic groups."
    explanation: Suggests under-ascertainment in East Asian populations.
- population: Worldwide, biochemically defined
  measure_type: UNKNOWN
  prevalence_class: BAND_1_5_PER_10000
  rate_per_100000: 10.0
  rate_denominator: POPULATION
  notes: >-
    An estimate of 2 in 20,000, i.e. 10 per 100,000, quoted in a case report
    arguing that the disease is under-diagnosed. Recorded separately from the
    published case count above because the two are not the same quantity and
    are in open tension: fewer than 40 patients have been described, orders of
    magnitude fewer than this estimate implies. The reconciliation the authors
    propose is that most biochemically affected people are asymptomatic or
    have non-specific findings and are never tested. Do not quote the two
    figures as one number.

    The source gives only "an estimated prevalence of 2/20,000" without
    saying whether it is a point or a lifetime prevalence, which is why
    measure_type is UNKNOWN.
  evidence:
  - reference: PMID:30384990
    reference_title: A case of dihydropyrimidinase deficiency incidentally detected by urine metabolome analysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Dihydropyrimidinase deficiency is probably underdiagnosed, considering its wide phenotypical variability, nonspecific neurological presentations, and an estimated prevalence of 2/20,000."
    explanation: >-
      The estimate, and the authors' own argument for why it exceeds the
      reported case count.
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    The metabolic disease requires biallelic DPYS variants. A single
    deleterious allele does not cause the inborn error but may reduce DHP
    activity enough to matter if a fluoropyrimidine is given.
  evidence:
  - reference: PMID:38199782
    reference_title: "The diagnostic odyssey of a patient with dihydropyrimidinase deficiency: a case report and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Dihydropyrimidinase (DHP) deficiency is an autosomal recessive metabolic disorder caused by biallelic pathogenic variants of DPYS"
    explanation: States the mode of inheritance.
pathophysiology:
- name: Biallelic DPYS Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Missense, nonsense, splice-site and deletion variants in DPYS. Most
    missense variants leave no measurable activity when expressed; structural
    mapping places them at the tetramer interface, near the di-zinc catalytic
    centre and substrate site, or in regions where they destabilise folding.
    Many inactive variants are degraded by the proteasome and fail to form the
    large oligomers the active enzyme needs.
  genes:
  - preferred_term: DPYS
    term:
      id: hgnc:3013
      label: DPYS
  molecular_functions:
  - preferred_term: dihydropyrimidinase activity
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0004157
      label: dihydropyrimidinase activity
  evidence:
  - reference: PMID:20362666
    reference_title: "Dihydropyrimidinase deficiency: Phenotype, genotype and structural consequences in 17 patients."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Heterologous expression of 11 mutant enzymes in Escherichia coli showed that all but two missense mutations yielded mutant DHP proteins without significant activity."
    explanation: Patient variants abolish enzyme activity when expressed.
  - reference: PMID:20362666
    reference_title: "Dihydropyrimidinase deficiency: Phenotype, genotype and structural consequences in 17 patients."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "The crystal structure of human DHP indicated that the point mutations p.R490C, p.R302Q and p.V364M affect the oligomerization of the enzyme."
    explanation: Structural mapping of patient missense variants to the oligomer interface.
  - reference: PMID:28642038
    reference_title: Functional characterization of 21 allelic variants of dihydropyrimidinase.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "9/21 variants were expressed at low levels and were inactive due to proteasome-mediated degradation."
    explanation: Protein instability and proteasomal degradation as a loss-of-function route.
  - reference: PMID:35961217
    reference_title: Structural investigation of pathogenic variants in dihydropyrimidinase using molecular dynamics simulations.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "In the T68R, D81G, G278D, and L337P variants, the flexibilities of structures related to the interaction for oligomer formation increased in comparison with those of the wild type."
    explanation: >-
      Simulation evidence that one class of patient variant acts by
      destabilising the oligomerisation interface, consistent with the
      crystal-structure mapping above.
  - reference: PMID:9718352
    reference_title: "Dihydropyrimidinase deficiency: structural organization, chromosomal localization, and mutation analysis of the human dihydropyrimidinase gene."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Using a eukaryotic expression system, we showed that all mutations reduced enzyme activity significantly, indicating that these are crucial DHP deficiency-causing mutations."
    explanation: >-
      The first demonstration that the identified DPYS variants reduce enzyme
      activity, in the paper that characterised the gene.
  downstream:
  - target: Block of Dihydropyrimidine Ring Opening
    causal_link_type: DIRECT
    description: Without DHP activity the second step of pyrimidine catabolism stops.
  - target: Impaired Fluoropyrimidine Catabolism
    causal_link_type: DIRECT
    description: >-
      The same enzyme opens the ring of dihydro-5-fluorouracil, so the deficit
      is also a drug-clearance deficit. Latent until a fluoropyrimidine is
      given.
    evidence:
    - reference: PMID:28642038
      reference_title: Functional characterization of 21 allelic variants of dihydropyrimidinase.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: BACKGROUND
      snippet: "DHP catalyzes the hydrolytic ring opening of dihydrouracil and dihydro-5-fluorouracil."
      explanation: >-
        The enzyme acts on the fluoropyrimidine intermediate as well as the
        natural one. BACKGROUND because it is the paper's framing of
        established enzymology rather than its own result.
- name: Block of Dihydropyrimidine Ring Opening
  biological_scale: MOLECULAR
  description: >-
    The committed hydrolytic step of pyrimidine degradation is lost, so
    5,6-dihydrouracil and 5,6-dihydrothymine are not converted to
    N-carbamyl-beta-alanine and N-carbamyl-beta-aminoisobutyric acid.
  biological_processes:
  - preferred_term: pyrimidine nucleobase catabolic process
    modifier: DECREASED
    term:
      id: GO:0006208
      label: pyrimidine nucleobase catabolic process
  evidence:
  - reference: PMID:17383919
    reference_title: Clinical, biochemical and genetic findings in two siblings with a dihydropyrimidinase deficiency.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: "Dihydropyrimidinase (DHP) is the second enzyme of the pyrimidine degradation pathway and it catalyses the ring opening of 5,6-dihydrouracil and 5,6-dihydrothymine to N-carbamyl-beta-alanine and N-carbamyl-beta-aminoisobutyric acid"
    explanation: Names the reaction that is lost and both of its products.
  downstream:
  - target: Dihydropyrimidine Accumulation with Beta-Aminoisobutyrate Depletion
    causal_link_type: DIRECT
    description: Substrates build up and the downstream thymine product is not made.
- name: Dihydropyrimidine Accumulation with Beta-Aminoisobutyrate Depletion
  biological_scale: ORGANISM
  description: >-
    5,6-dihydrouracil and 5,6-dihydrothymine accumulate in urine, plasma and
    cerebrospinal fluid. Beta-aminoisobutyric acid is strongly reduced, while
    beta-alanine is normal, which distinguishes this block from the upstream
    DPD deficiency where beta-alanine itself is depleted. Both the symptomatic
    and the asymptomatic sibling in one family had the same metabolite profile,
    so the profile alone does not predict whether anyone will be ill.
  chemical_entities:
  - preferred_term: 3-aminoisobutyric acid
    modifier: DECREASED
    term:
      id: CHEBI:27389
      label: 3-aminoisobutyric acid
  evidence:
  - reference: PMID:20362666
    reference_title: "Dihydropyrimidinase deficiency: Phenotype, genotype and structural consequences in 17 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients presented mainly with neurological and gastrointestinal abnormalities and markedly elevated levels of 5,6-dihydrouracil and 5,6-dihydrothymine in plasma, cerebrospinal fluid and urine."
    explanation: The accumulating metabolites and the compartments they are measured in.
  - reference: PMID:18600547
    reference_title: Beta-alanine and beta-aminoisobutyric acid levels in two siblings with dihydropyrimidinase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In two siblings with a complete DHP deficiency and a variable clinical presentation, a normal concentration of beta-alanine and strongly decreased levels of beta-aminoisobutyric acid were observed in plasma, urine and CSF."
    explanation: >-
      The downstream half of the profile, and the reason beta-alanine is
      recorded as normal rather than depleted here.
  downstream:
  - target: Elevated urinary dihydrouracil level
    causal_link_type: DIRECT
    description: The accumulating intermediate is excreted, giving dihydropyrimidinuria.
  - target: Elevated urinary dihydrothymine level
    causal_link_type: DIRECT
    description: The thymine-derived intermediate is excreted in the same way.
  - target: Intellectual disability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - dihydropyrimidine_accumulation_neurotoxicity
    description: >-
      Proposed route to the cognitive phenotype. Not asserted: the
      intermediates are unknown, and biochemically identical siblings differ
      in whether they are affected. See the hypothesis of the same name.
  - target: Global developmental delay
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - dihydropyrimidine_accumulation_neurotoxicity
    description: Same proposed route, same reservation.
  - target: Seizure
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - dihydropyrimidine_accumulation_neurotoxicity
    description: Same proposed route, same reservation.
  - target: Hypotonia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - dihydropyrimidine_accumulation_neurotoxicity
    description: Same proposed route, same reservation.
  - target: Abnormal cerebral white matter morphology
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - dihydropyrimidine_accumulation_neurotoxicity
    description: >-
      Same proposed route. The authors who described the imaging phenotype in
      the upstream disease state that its mechanism is unknown, which is the
      same reservation.
  - target: Autistic behavior
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - dihydropyrimidine_accumulation_neurotoxicity
    description: Same proposed route, same reservation.
  - target: Microcephaly
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - dihydropyrimidine_accumulation_neurotoxicity
    description: Same proposed route, same reservation.
- name: Impaired Fluoropyrimidine Catabolism
  biological_scale: ORGANISM
  description: >-
    Reduced capacity to degrade 5-fluorouracil and its prodrugs at the second
    catabolic step. This node is inert without drug exposure, which is why the
    exposure is modelled separately below. The strength of this arm is
    deliberately not overstated: it rests on a single patient in whom severe
    toxicity was attributed to partial DHP deficiency, plus cohort evidence
    that is inconsistent.
  biological_processes:
  - preferred_term: pyrimidine nucleobase catabolic process
    modifier: DECREASED
    term:
      id: GO:0006208
      label: pyrimidine nucleobase catabolic process
  evidence:
  - reference: PMID:14555507
    reference_title: Dihydropyrimidinase deficiency and severe 5-fluorouracil toxicity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we demonstrated for the first time that in one patient the severe toxicity, after a treatment with 5FU, was attributable to a partial deficiency of DHP."
    explanation: >-
      The originating observation for this arm, and the reason it is a single
      case rather than a cohort finding.
  - reference: PMID:14555507
    reference_title: Dihydropyrimidinase deficiency and severe 5-fluorouracil toxicity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our results show that a partial DHP deficiency is a novel pharmacogenetic disorder associated with severe 5FU toxicity."
    explanation: The authors' own framing of partial deficiency as a pharmacogenetic risk.
  downstream:
  - target: Fluoropyrimidine Cytotoxicity
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      The proposed route runs through accumulated 5,6-dihydro-5-fluorouracil,
      which dihydropyrimidine dehydrogenase can convert back to
      5-fluorouracil. The intermediate is named in the literature, which is
      why the edge is INDIRECT_KNOWN_INTERMEDIATES rather than direct, but no
      pharmacokinetic measurement in a DHP-deficient patient was found.
    evidence:
    - reference: PMID:38199782
      reference_title: "The diagnostic odyssey of a patient with dihydropyrimidinase deficiency: a case report and review of the literature."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: "Patients with DHP deficiency are prone to accumulating 5,6-dihydro-5-FU in the plasma. DPD can convert this back to 5-FU, reaching toxic levels rapidly"
      explanation: >-
        Names the accumulating intermediate and the back-conversion that is
        the proposed route to toxicity. BACKGROUND because the review is
        restating the mechanism from earlier work rather than measuring it.
- name: Fluoropyrimidine Cytotoxicity
  biological_scale: ORGANISM
  description: >-
    Severe fluoropyrimidine-associated toxicity. In the only cohort that found a
    signal, carrying at least one rare DPYS variant was associated with about a
    fourfold higher risk of severe cumulative toxicity; a second cohort
    genotyping common DPYS variants found no association, so this node is
    carried as a contested claim and both results are cited.
  evidence:
  - reference: PMID:37946254
    reference_title: The burden of rare variants in DPYS gene is a novel predictor of the risk of developing severe fluoropyrimidine-related toxicity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Carrying at least one rare DPYS variant was associated with an approximately fourfold higher risk of severe cumulative (OR = 4.08, P = 0.030) and acute (OR = 4.21, P = 0.082) toxicity."
    explanation: >-
      The strongest cohort evidence for this arm. Note the acute-toxicity
      association did not reach significance in the same analysis.
  - reference: PMID:38215018
    reference_title: Common dihydropyrimidinase ( DPYS ) genetic variations do not predict fluoropyrimidine-related chemotherapy toxicity in a Canadian cohort.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "in our cohort of mostly Caucasian Canadians, genetic variations in DPYS do not appear to be a significant contributor to severe fluoropyrimidine-associated toxicity."
    explanation: >-
      The contradicting cohort. It genotyped three common DPYS variants rather
      than sequencing for rare ones, so it does not test the same claim as the
      rare-variant-burden study; it does refute a common-variant effect.
mechanistic_hypotheses:
- hypothesis_group_id: dihydropyrimidine_accumulation_neurotoxicity
  hypothesis_label: Accumulated dihydropyrimidines or depleted beta-aminoisobutyrate cause the neurological phenotype
  status: EMERGING
  description: >-
    Holds that the accumulated dihydropyrimidines, or the shortage of
    beta-aminoisobutyric acid, disturb the developing nervous system and so
    account for the seizures, developmental delay and white-matter change seen
    in some patients. Nothing stronger than coherence supports it. The decisive
    objection is the same as in the upstream DPD deficiency: siblings with
    identical complete enzyme deficiency and identical metabolite profiles
    differ in whether they have any symptoms at all, so the metabolite
    disturbance cannot be sufficient.
  evidence:
  - reference: PMID:18600547
    reference_title: Beta-alanine and beta-aminoisobutyric acid levels in two siblings with dihydropyrimidinase deficiency.
    supports: NO_EVIDENCE
    evidence_source: HUMAN_CLINICAL
    snippet: "the relevance of the shortage of beta-aminoisobutyric acid for the onset of a clinical phenotype in patients with DHP deficiency remains to be established."
    explanation: >-
      The authors who measured the depletion state that its relevance to the
      clinical phenotype is unestablished. Graded NO_EVIDENCE rather than
      SUPPORT because a sentence saying a question is open does not support
      either answer to it; it is cited to record that the question is open.
  - reference: PMID:18600547
    reference_title: Beta-alanine and beta-aminoisobutyric acid levels in two siblings with dihydropyrimidinase deficiency.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "No major differences were observed for the concentrations of the beta-amino acids in plasma and urine between the symptomatic and asymptomatic sibling."
    explanation: >-
      The discordant sibling pair, which is direct evidence against the
      metabolite level determining the phenotype.
  - reference: PMID:38199782
    reference_title: "The diagnostic odyssey of a patient with dihydropyrimidinase deficiency: a case report and review of the literature."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Among the 35 patients, nine patients were asymptomatic at the time of diagnosis"
    explanation: >-
      Roughly a quarter of published patients had no symptoms at diagnosis
      despite the biochemical defect, which is the scale of what any
      metabolite-driven account of the phenotype has to explain. REFUTE
      because it counts against the metabolite disturbance being sufficient,
      not because it bears on whether it contributes.
  - reference: PMID:38958169
    reference_title: "Dihydropyrimidinase deficiency with atrioventricular septal defect: a case report."
    supports: NO_EVIDENCE
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "The mechanism of neurological and other systemic findings is unclear."
    explanation: >-
      An independent statement that the mechanism remains unknown, from a case
      report's framing of established knowledge. NO_EVIDENCE for the same
      reason as the item above: it records that the question is open rather
      than bearing on the answer.
  - reference: PMID:9718352
    reference_title: "Dihydropyrimidinase deficiency: structural organization, chromosomal localization, and mutation analysis of the human dihydropyrimidinase gene."
    supports: REFUTE
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "There was no significant difference, in residual activity, between mutations observed in the symptomatic and those observed in the asymptomatic individuals."
    explanation: >-
      Residual activity did not separate the symptomatic from the asymptomatic
      individuals, which cuts against the enzyme deficit determining the
      phenotype. INDIRECT because the inference runs from residual activity
      through metabolite level to phenotype and the sentence speaks only to
      the first step, and IN_VITRO because the activities were measured in a
      eukaryotic expression system. Note the comparison is one symptomatic
      against five asymptomatic individuals, so it bounds rather than
      excludes an effect; the discordant sibling pair above is the stronger
      argument.
  notes: >-
    Kept as a hypothesis rather than a pathophysiology chain. Any complete
    account has to explain the asymptomatic patients as well as the affected
    ones, and none currently does. The size of that problem is nine of the 35
    published patients asymptomatic at diagnosis, which is the closest thing
    to a penetrance figure this disease has.
environmental:
- name: Fluoropyrimidine chemotherapy administration
  description: >-
    Administration of 5-fluorouracil or a prodrug such as capecitabine. The
    toxicity arm of this entry is inert without it. It is included because the
    enzyme that is missing is also the second enzyme of fluoropyrimidine
    catabolism, and because partial deficiency has been reported as the cause
    of severe toxicity in a patient.
  evidence:
  - reference: PMID:14555507
    reference_title: Dihydropyrimidinase deficiency and severe 5-fluorouracil toxicity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "it has been suggested that patients with a deficiency of this enzyme are at risk from developing severe 5FU-associated toxicity."
    explanation: >-
      The prior suggestion that this paper set out to test, in its own hedged
      wording. BACKGROUND because the sentence restates somebody else's
      hypothesis; it establishes that deficient patients are at risk, not the
      exposure-dependence, which the paper's own result below carries.
  influences_mechanisms:
  - target: Impaired Fluoropyrimidine Catabolism
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Supplies the substrate the deficient enzyme cannot process. With no
      administration there is nothing to clear and no toxicity, however low the
      activity.
    evidence:
    - reference: PMID:14555507
      reference_title: Dihydropyrimidinase deficiency and severe 5-fluorouracil toxicity.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "we demonstrated for the first time that in one patient the severe toxicity, after a treatment with 5FU, was attributable to a partial deficiency of DHP."
      explanation: >-
        Toxicity followed drug administration in a patient with reduced
        enzyme activity, which is the exposure-dependence this link asserts.

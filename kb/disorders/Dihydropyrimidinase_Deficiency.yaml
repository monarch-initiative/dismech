  - preferred_term: Urinary dihydrothymine (creatinine-normalized)
    term:
      id: LOINC:78693-9
      label: Dihydrothymine/Creatinine [Molar ratio] in Urine
  evidence:
  - reference: PMID:30384990
    reference_title: A case of dihydropyrimidinase deficiency incidentally detected by urine metabolome analysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "urinary pyrimidine analysis should be considered for those who will undergo 5-fluorouracil treatment."
    explanation: The authors' proposal, in their own words.
animal_models:
- name: Feline dihydropyrimidinase deficiency (DPYS p.G435R homozygous cat)
  species: Cat
  genotype: DPYS c.1303G>A (p.G435R) homozygous
  publication: PMID:23430934
  description: >-
    A naturally occurring case rather than an engineered model: a cat
    homozygous for a DPYS missense variant at a residue also mutated in a human
    patient, with dihydrouracil and dihydrothymine in urine. It presented with
    malnutrition, depression, vomiting and hyperammonaemia. Screening 1,000
    cats found no other carrier.
  modeled_mechanisms:

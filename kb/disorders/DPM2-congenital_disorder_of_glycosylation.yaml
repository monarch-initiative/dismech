  icimd_category:
  - classification_value: multiple_glycosylation_pathways
    notes: >-
      ICIMD (Ferreira et al. 2021, PMID:33340416): group "Disorders affecting
      multiple glycosylation pathways (dolichol metabolism, Golgi transport and
      homeostasis, sialic acid metabolism)" under category 18, "Congenital
      disorders of glycosylation". DPM2-CDG is a dolichol-metabolism defect
      whose single depleted donor (Dol-P-Man) feeds N-glycosylation,
      O-mannosylation, C-mannosylation and GPI-anchor biosynthesis, so the
      multiple-pathway group is the correct placement rather than the
      N-linked-only group.

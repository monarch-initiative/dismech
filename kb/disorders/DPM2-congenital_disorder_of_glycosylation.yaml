name: DPM2-congenital disorder of glycosylation
creation_date: "2026-07-31T00:00:00Z"
description: >-
  DPM2-congenital disorder of glycosylation (DPM2-CDG, CDG-Iu) is an ultra-rare
  autosomal recessive disorder caused by biallelic pathogenic variants in DPM2,
  which encodes the regulatory subunit of the endoplasmic-reticulum
  dolichol-phosphate-mannose (Dol-P-Man / DPM) synthase complex. Because
  Dol-P-Man is the obligate mannosyl donor for four distinct glycosylation
  pathways — N-glycan lipid-linked oligosaccharide assembly, protein
  O-mannosylation, C-mannosylation and GPI-anchor biosynthesis — DPM2 deficiency
  produces a combined glycosylation defect that simultaneously manifests as a
  type I congenital disorder of glycosylation and as a secondary
  dystroglycanopathy. The severe end of the spectrum, which defines the
  Orphanet/MONDO label "congenital muscular dystrophy with intellectual
  disability and severe epilepsy", presents at birth with severe hypotonia,
  elevated creatine kinase, absent psychomotor development, intractable epilepsy
  and progressive microcephaly, and is fatal in infancy or early childhood; later
  reports have expanded the phenotype to a milder, adult-viable form with
  intellectual disability, myopathy and hyperCKemia.
category: Mendelian
parents:
- hereditary disease
synonyms:
- DPM2-CDG
- CDG-Iu
- CDG1U
- congenital disorder of glycosylation type Iu
- congenital muscular dystrophy with intellectual disability and severe epilepsy
- CMD with intellectual disability and severe epilepsy
- dolichyl-phosphate mannosyltransferase subunit 2 deficiency

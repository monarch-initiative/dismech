      label: Autosomal recessive inheritance
  expressivity: VARIABLE
  description: >-
    DPM2-CDG requires biallelic DPM2 variants. Reported families include
    compound heterozygosity for a missense plus a canonical splice-acceptor
    variant, homozygosity for a recurrent missense allele in two unrelated
    families, and homozygosity for a second missense allele in non-consanguineous
    Chinese siblings. Expressivity is markedly variable: reported genotypes span
    a neonatal-onset, infantile-lethal epileptic and myopathic encephalopathy and
    a mild, adult-viable intellectual-disability-plus-myopathy phenotype.
  evidence:
  - reference: PMID:23109149
    reference_title: "DPM2-CDG: a muscular dystrophy-dystroglycanopathy syndrome with severe epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      DNA analysis revealed mutations in DPM2, 1 of the subunits of the
      dolichol-phosphate-mannose (DPM) synthase; the patient in the first family
      is compound heterozygous for 2 mutations (c.68A>G, predicting a missense
      mutation p.Y23C and c.4-1G>C, a splice mutation), whereas the patients in
      the second family are homozygous for the same missense mutation (c.68A>G,
      p.Y23C).
    explanation: >-
      Biallelic genotypes (compound heterozygous and homozygous) in two
      independent families establish autosomal recessive inheritance.
  - reference: PMID:37152991
    reference_title: "Identification and characterization of a new variation in DPM2 gene in two Chinese siblings with mild intellectual impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A homozygous mutation, c.197G>A (p.Gly66Glu) in exon 4 of DPM2 (NM_003863)
      was identified by whole exome sequencing (WES).
    explanation: >-
      A homozygous DPM2 variant segregating in two affected siblings of healthy
      parents supports recessive inheritance.
pathophysiology:
- name: DPM Synthase Complex Destabilization
  biological_scale: MOLECULAR
  role: trigger
  mechanism_confidence: ESTABLISHED
  description: >-
    DPM synthase is a heterotrimer of DPM1 (the catalytic subunit), DPM2 (a
    regulatory subunit that stabilizes DPM1 and enhances dolichol-phosphate
    binding) and DPM3 (which tethers DPM1 to the ER membrane). Biallelic DPM2
    variants — missense alleles in either transmembrane region, a nonsense
    allele, or a canonical splice-acceptor allele — reduce or functionally
    impair DPM2, destabilizing the complex. In patient fibroblasts carrying a
    nonsense/missense genotype, DPM2 fell to roughly 60% of control and DPM1
    protein became undetectable, showing that loss of the regulatory subunit
    also collapses the catalytic subunit.

- name: ER Lipid-Linked Oligosaccharide Assembly Arrest
  biological_scale: MOLECULAR
  conforms_to: "congenital_disorder_of_glycosylation#ER Lipid-Linked Oligosaccharide Assembly Defect"
  mechanism_confidence: ESTABLISHED
  description: >-
    Without sufficient Dol-P-Man, the luminal mannosylation steps of
    lipid-linked oligosaccharide assembly stall. Patient fibroblasts accumulate
    the truncated intermediate Dol-PP-GlcNAc2-Man5 — precisely the species
    expected when the biosynthetic block lies at the first Dol-P-Man-dependent
    mannosyltransferase step — and truncated precursors are transferred to
    nascent protein, producing the type I CDG biochemical pattern on serum
    transferrin isoelectric focusing.

- name: Alpha-Dystroglycan Hypo-O-Mannosylation
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    The POMT1/POMT2 O-mannosyltransferases use Dol-P-Man to initiate the
    O-mannosyl glycan on alpha-dystroglycan. Dol-P-Man depletion therefore
    truncates this glycan, so alpha-dystroglycan cannot be extended into its
    laminin-binding matriglycan. Muscle immunohistochemistry in DPM2-CDG
    patients showed deficient O-mannosylation, making DPM2-CDG a secondary
    dystroglycanopathy — the same arm demonstrated directly in the sister
    disorder DPM3-CDG.

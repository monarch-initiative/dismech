- name: Sarcolemmal Laminin Anchorage Failure
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED
  description: >-
    Hypoglycosylated alpha-dystroglycan loses its laminin-binding capacity, so
    the dystrophin-glycoprotein complex can no longer transmit force between the

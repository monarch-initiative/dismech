progression:
- phase: Severe infantile-lethal course
  age_range: Birth to 3 years
  notes: >-
    The severe, first-domain-variant form presents at birth and is fatal between
    7 months and 3 years of age, with death attributed to severe epilepsy,
    muscular dystrophy and acute respiratory infections.
  evidence:
  - reference: PMID:33129689
    reference_title: "Expanding the clinical and metabolic phenotype of DPM2 deficient congenital disorders of glycosylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All three patients included in the report had a severe clinical
      presentation characterized by hypotonia, progressive muscle weakness and
      wasting, absent psychomotor development, intractable seizures, liver
      involvement, abnormal coagulation factors and early mortality (between 7
      months and 3 years of age).
    explanation: >-
      Documents the age range of early mortality in the severe form.
  - reference: PMID:37152991
    reference_title: "Identification and characterization of a new variation in DPM2 gene in two Chinese siblings with mild intellectual impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Until now, only four cases from three families have been reported, and three
      of them with the variant c.68A>G (p.Tyr23Cys) died before 3 years old due to
      severe epilepsy, muscular dystrophy, and acute respiratory infections
    explanation: >-
      States the causes and timing of death in the severe genotype.
- phase: Mild adult-viable course
  age_range: Childhood into the third decade
  notes: >-
    The milder form presents in early childhood with developmental delay and is
    compatible with survival into adulthood; reported patients were alive at 11,
    20 and 23 years with stable intellectual disability, myopathy and hyperCKemia.
  evidence:
  - reference: PMID:33129689
    reference_title: "Expanding the clinical and metabolic phenotype of DPM2 deficient congenital disorders of glycosylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      His clinical presentation was much less severe than that of the three
      previously described patients.
    explanation: >-
      Establishes the milder, adult-viable end of the natural-history spectrum.
biochemical:
- name: Transferrin Isoelectric Focusing Type I Pattern
  notes: >-
    Serum transferrin isoelectric focusing shows a type I CDG pattern (cathodic
    shift from whole missing N-glycans), the classic first-line CDG screening
    test. In DPM2-CDG the abnormality can be subtle: it was described as only
    mildly abnormal in the adult patient.
  presence: PRESENT
  evidence:
  - reference: PMID:23109149
    reference_title: "DPM2-CDG: a muscular dystrophy-dystroglycanopathy syndrome with severe epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Metabolic investigations revealed CDG-I, pointing to a defect in protein
      N-glycosylation in the endoplasmic reticulum.
    explanation: >-
      Establishes the CDG type I biochemical pattern in DPM2-CDG.
  - reference: PMID:33129689
    reference_title: "Expanding the clinical and metabolic phenotype of DPM2 deficient congenital disorders of glycosylation."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Laboratory studies which included POLG sequencing and whole genome
      microarray analysis were normal while serum transferrin isoelectric focusing
      (TIEF) was mildly abnormal (Figure 3).
    explanation: >-
      Shows the transferrin abnormality can be mild, an important caveat for using
      it as a screening test in the milder phenotype.
- name: Lipid-Linked Oligosaccharide Accumulation
  notes: >-
    Analysis of lipid-linked oligosaccharides in patient fibroblasts shows
    accumulation of the truncated intermediate Dol-PP-GlcNAc2-Man5, the species
    expected when the block lies at the first Dol-P-Man-dependent
    mannosyltransferase step of assembly. This is the biochemical signature that
    localizes the defect to the DPM pathway.
  presence: PRESENT
  cell_types:
  - preferred_term: Fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  evidence:
  - reference: PMID:23109149
    reference_title: "DPM2-CDG: a muscular dystrophy-dystroglycanopathy syndrome with severe epilepsy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Analysis of lipid-linked oligosaccharides in fibroblasts showed accumulation
      of Dol-PP-GlcNAc(2)
    explanation: >-
      The truncated species accumulating in patient fibroblasts is the diagnostic
      biochemical fingerprint of the Dol-P-Man-dependent block.
- name: Reduced ICAM1 as Hypoglycosylation Reporter
  notes: >-
    ICAM1 was used as a general cellular hypoglycosylation readout. Expression of
    the p.Gly66Glu DPM2 allele produced a significant decrease in ICAM1,
    confirming abnormal N-linked glycosylation despite increased DPM2 protein
    levels for this allele.
  presence: PRESENT
  evidence:
  - reference: PMID:37152991
    reference_title: "Identification and characterization of a new variation in DPM2 gene in two Chinese siblings with mild intellectual impairment."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In vitro functional analysis demonstrated that this variant increased the
      expression level of DPM2 protein and western blot revealed a significant
      decrease in ICAM1, a universal biomarker for hypoglycosylation in patients
      with CDG, suggesting abnormal N-linked glycosylation.
    explanation: >-
      ICAM1 reduction functions as the hypoglycosylation readout for this variant.
genetic:
- name: DPM2
  gene_term:
    preferred_term: DPM2
    term:
      id: hgnc:3006
      label: DPM2
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: PRESENT
  frequency: All reported patients (biallelic in every case)
  notes: >-
    DPM2 (9q34.11) encodes the 84-amino-acid, two-transmembrane regulatory
    subunit of DPM synthase. Reported pathogenic alleles are missense
    (p.Tyr23Cys, p.Gly58Asp, p.Gly66Glu), nonsense (p.Arg47Ter) and a canonical
    splice-acceptor variant (c.4-1G>C), all germline and biallelic. Variant
    position appears to track with severity: alleles in the region encoding the
    first domain associate with the severe, early-lethal phenotype, while
    second-domain alleles associate with the milder phenotype — a correlation the
    reporting authors themselves flag as needing more data.
  evidence:
  - reference: PMID:23109149
    reference_title: "DPM2-CDG: a muscular dystrophy-dystroglycanopathy syndrome with severe epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      DNA analysis revealed mutations in DPM2, 1 of the subunits of the
      dolichol-phosphate-mannose (DPM) synthase; the patient in the first family
      is compound heterozygous for 2 mutations (c.68A>G, predicting a missense
      mutation p.Y23C and c.4-1G>C, a splice mutation), whereas the patients in
      the second family are homozygous for the same missense mutation (c.68A>G,
      p.Y23C).
    explanation: >-
      Identifies DPM2 as the causal gene and lists the founding pathogenic
      alleles.
  - reference: PMID:37152991
    reference_title: "Identification and characterization of a new variation in DPM2 gene in two Chinese siblings with mild intellectual impairment."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We also reviewed the 4 previously reported patients carrying homozygous or
      compound heterozygous variants of DMP2 gene, and found that patients with
      variants within the region encoding the first domain had more severe
      clinical symptoms than those with variants within the second domain.
    explanation: >-
      Reports the domain-position genotype-severity correlation; PARTIAL because
      the same paper states the relationship needs more study and it rests on only
      six patients.
  variants:
  - name: "NM_003863.4:c.68A>G (p.Tyr23Cys)"
    description: >-
      Recurrent missense allele in the first transmembrane region, found

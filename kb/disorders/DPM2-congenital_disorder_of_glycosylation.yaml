      and reproductive risk assessment; PARTIAL because counseling outcomes are
      not themselves reported.
differential_diagnoses:
- name: DPM1-congenital disorder of glycosylation
  description: >-
    The allelic-complex disorder caused by variants in the catalytic DPM synthase
    subunit. Shares the CDG type I transferrin pattern, elevated CK, hypotonia and
    seizures.
  distinguishing_features:
  - >-
    Same enzyme complex, different subunit — DPM1 is the catalytic rather than the
    regulatory subunit. Separation requires sequencing, since the biochemical
    phenotypes overlap.
  evidence:
  - reference: PMID:23109149
    reference_title: "DPM2-CDG: a muscular dystrophy-dystroglycanopathy syndrome with severe epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hence, mutations have now been described in the genes for the 3 subunits of
      DPM: DPM1, DPM2, and DPM3
    explanation: >-
      Establishes the three-subunit allelic series that constitutes the primary
      differential.
- name: DPM3-congenital disorder of glycosylation
  description: >-
    Caused by variants in the DPM3 tethering subunit. Overlaps DPM2-CDG in
    combining a CDG type I pattern with alpha-dystroglycan hypo-O-mannosylation;
    often milder and more cardiac-predominant, with several adult-onset cases.
  distinguishing_features:
  - >-
    Cardiac involvement is prominent (reported in four of six DPM3 patients), and
    transferrin isoelectric focusing may be normal or only mildly abnormal.
    Molecular testing distinguishes the subunits.
  evidence:
  - reference: PMID:19576565
    reference_title: "Deficiency of Dol-P-Man synthase subunit DPM3 bridges the congenital disorders of glycosylation with the dystroglycanopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This mild Dol-P-Man biosynthesis defect due to DPM3 mutations is a cause for
      alpha-dystroglycanopathy, thereby bridging the congenital disorders of
      glycosylation with the dystroglycanopathies.
    explanation: >-
      DPM3-CDG shares the combined CDG/dystroglycanopathy signature that defines
      the differential with DPM2-CDG.
- name: MPDU1-congenital disorder of glycosylation
  description: >-
    Defect in the utilization, rather than the synthesis, of dolichol-linked
    mannose and glucose donors. Produces the same CDG-I-plus-dystroglycanopathy
    overlap space.
  distinguishing_features:
  - >-
    MPDU1 affects donor utilization downstream of Dol-P-Man synthesis, whereas
    DPM2 affects donor synthesis. Molecular testing distinguishes them.
  evidence:
  - reference: PMID:31741824
    reference_title: "A mutation in mannose-phosphate-dolichol utilization defect 1 reveals clinical symptoms of congenital disorders of glycosylation type I and dystroglycanopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mannose-phosphate-dolichol utilization defect 1 (MPDU1) plays a role in the
      utilization of DPM.
    explanation: >-
      Places MPDU1 in the same Dol-P-Man axis, immediately downstream of the DPM2
      lesion.
- name: Primary alpha-dystroglycanopathies
  description: >-
    Congenital muscular dystrophies caused by variants in the dedicated
    alpha-dystroglycan glycosylation genes (POMT1, POMT2, POMGNT1, LARGE, FKTN,
    FKRP, B3GALNT2 and others), spanning Walker-Warburg syndrome and
    muscle-eye-brain disease.
  distinguishing_features:
  - >-
    Primary dystroglycanopathies impair alpha-dystroglycan O-mannosylation without
    a generalized N-glycosylation defect, so serum transferrin isoelectric
    focusing is typically normal — the key discriminator from DPM2-CDG.
  evidence:
  - reference: PMID:28198708
    reference_title: "Dystroglycanopathies: About Numerous Genes Involved in Glycosylation of One Single Glycoprotein."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Dystroglycanopathies are neuromuscular disorders due to abnormal
      glycosylation of dystroglycan which is a cell-surface glycoprotein that acts
      as a receptor for extracellular matrix proteins containing laminin-G
      domains.
    explanation: >-
      Defines the primary dystroglycanopathy family that constitutes the
      muscular-dystrophy side of the differential.
  - reference: PMID:28198708
    reference_title: "Dystroglycanopathies: About Numerous Genes Involved in Glycosylation of One Single Glycoprotein."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Most genes code for glycosyltransferases (POMT1, POMT2, POMGNT1, LARGE,
      GTDC2, B4GAT1, B3GALNT2) although a minority does not (DPM1, DPM2, DPM3,
      DOLK, POMK, GMPPB).
    explanation: >-
      Places DPM2 explicitly within the dystroglycanopathy gene list while
      distinguishing it from the dedicated glycosyltransferases.
discussions:
- discussion_id: dpm2_gpi_anchor_arm_unproven
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is GPI-anchor biosynthesis measurably impaired in DPM2-CDG patient cells, or
    is this arm purely an inference from DPM synthase biochemistry?
  attaches_to:
  - "pathophysiology#GPI-Anchor Biosynthesis Impairment"
  rationale: >-
    Dol-P-Man donates mannoses to the GPI-anchor precursor, so DPM2 deficiency
    should impair GPI-anchor assembly, and DPM-synthase-null CHO cells do lose
    surface GPI-anchored proteins. But no DPM2-CDG case report has measured
    GPI-anchored protein display (e.g. CD59, CD55, alkaline phosphatase) in
    patient cells. The supporting patient data are indirect — a fibroblast
    lipidomic shift and congenital heart defects. This matters because a
    demonstrated GPI arm would place DPM2-CDG in the inherited GPI-deficiency
    disease class as well, with implications for expected phenotypes such as
    hyperphosphatasia.
  proposed_experiments:
  - experiment_id: exp_dpm2_gpi_flow_cytometry
    name: Flow cytometry for GPI-anchored proteins on patient cells
    description: >-
      Measure surface CD59 and CD55 (and FLAER binding) on DPM2-CDG patient
      fibroblasts or blood cells against controls, the standard assay used to
      establish GPI-anchor deficiency in the PIG-gene disorders.
  - experiment_id: exp_dpm2_alkaline_phosphatase_cohort
    name: Serum alkaline phosphatase profiling across the reported cohort
    description: >-
      Retrospectively collate alkaline phosphatase values in reported DPM2-CDG
      patients; hyperphosphatasia is a recognized marker of specific GPI-anchor
      biosynthesis defects.
- discussion_id: dpm2_no_faithful_animal_model
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Can any current animal model reproduce human DPM2-CDG, given that the
    published zebrafish work transiently depleted the whole DPM synthase complex
    rather than modeling the hypomorphic patient DPM2 alleles?
  attaches_to:
  - "pathophysiology#Sarcolemmal Laminin Anchorage Failure"
  - "pathophysiology#DPM Synthase Complex Destabilization"
  rationale: >-
    The zebrafish morphant study is the only in vivo model of this pathway and it
    recapitulates dystrophic muscle with hypoglycosylated alpha-dystroglycan — but
    it is a transient morpholino knockdown of dpm1/dpm2/dpm3 that causes early
    death, not a model of the hypomorphic missense alleles that actually cause
    human disease. It therefore cannot address the feature that most needs
    explaining: why the same pathway yields an infantile-lethal epileptic
    encephalopathy with one allele and an adult-viable myopathy with another.
    Evidence exists in a model system; its fidelity to the human allelic spectrum
    is the open question.
  proposed_experiments:
  - experiment_id: exp_dpm2_patient_allele_knockin
    name: Knock-in animal models carrying patient DPM2 missense alleles
    description: >-
      Generate hypomorphic knock-in alleles corresponding to p.Tyr23Cys (severe)
      and p.Gly66Glu (mild) rather than null alleles, and compare survival,
      seizure susceptibility, muscle histology and alpha-dystroglycan
      glycosylation between them.
  - experiment_id: exp_dpm2_ipsc_neuron_myotube
    name: Patient iPSC-derived neurons and skeletal myotubes
    description: >-
      Differentiate iPSC lines from severe- and mild-genotype patients into
      neurons and myotubes and compare Dol-P-Man levels, lipid-linked
      oligosaccharide profiles and alpha-dystroglycan glycosylation, to test the
      domain-position severity hypothesis in human cells.
- discussion_id: dpm2_domain_position_severity
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Does the position of a DPM2 variant (first versus second transmembrane domain
    region) genuinely determine severity, or is the apparent correlation an
    artifact of a six-patient sample?
  attaches_to:
  - "pathophysiology#DPM Synthase Complex Destabilization"
  rationale: >-
    The only proposed prognostic factor in DPM2-CDG is variant position, based on
    a review of six patients across four families. The correlation is confounded
    by the fact that three of the severe patients share a single recurrent allele
    (p.Tyr23Cys) from two families, so the comparison is closer to
    allele-versus-allele than domain-versus-domain. The reporting authors
    explicitly note the relationship needs more study. Additional unrelated
    patients, or functional assays quantifying residual DPM synthase activity per
    allele, would resolve it.
  proposed_experiments:
  - experiment_id: exp_dpm2_residual_activity_per_allele
    name: Residual DPM synthase activity per allele
    description: >-
      Express each reported DPM2 allele in DPM2-null cells and quantify Dol-P-Man
      synthesis and lipid-linked oligosaccharide profiles, testing whether
      residual activity rather than domain position predicts clinical severity.
notes: >-
  Naming: this entry follows the gene-anchored convention used by the sibling CDG
  entries in this knowledge base (MPDU1-, ALG9-, COG1-congenital disorder of
  glycosylation). The MONDO/Orphanet label "congenital muscular dystrophy with
  intellectual disability and severe epilepsy" is retained as the bound
  disease_term label and as a synonym. That clinical label describes only the
  severe end of the spectrum; the disorder as now understood also has a mild,
  adult-viable form.

  Scope note on the shared DPM-synthase mechanism: DPM1-, DPM2- and DPM3-CDG share
  the same trigger-to-consequence chain (subunit loss, complex destabilization,
  Dol-P-Man depletion, four-pathway glycosylation failure). That is a candidate
  for a future mechanism module; until one exists the chain is curated in full on
  this entry, and conformance is declared against the existing
  congenital_disorder_of_glycosylation module for the shared CDG arm only.

  Early mortality in the severe form is recorded under progression rather than as
  a phenotype because the corresponding HPO term (HP:0001522, Death in infancy)
  sits outside the Phenotypic abnormality subtree that phenotype_term binds to.

  No GeneReviews chapter exists for DPM2-CDG. A PubMed search returned only the
  retired historical overview chapter "Congenital Disorders of N-Linked
  Glycosylation and Multiple Pathway Overview" (PMID:20301507), which is marked
  for historical reference only and is therefore not used as a phenotype baseline
  here.

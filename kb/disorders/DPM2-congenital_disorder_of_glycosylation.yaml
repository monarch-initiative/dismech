  - target: Dolichol-Phosphate-Mannose Depletion
- name: Dolichol-Phosphate-Mannose Depletion
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    The destabilized complex synthesizes less dolichol-phosphate-mannose from
    GDP-mannose and dolichol phosphate. Dol-P-Man is flipped to the luminal face
    of the endoplasmic reticulum, where it serves as the sole mannosyl donor for
    four glycosylation pathways: lipid-linked oligosaccharide (N-glycan
    precursor) mannosylation, protein O-mannosylation, protein C-mannosylation,
    and GPI-anchor mannosylation. Depletion of this single shared donor is
    therefore the branch point that produces the disorder's combined
    CDG-plus-dystroglycanopathy phenotype.

prevalence:
- population: Worldwide (published case reports)
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Six patients from four families had been reported by 2023 — three severe-form
    patients from two Italian families (2012), one adult male (2021), and two
    Chinese siblings (2023). No population prevalence or incidence rate has been
    established.
  evidence:
  - reference: PMID:37152991
    reference_title: "Identification and characterization of a new variation in DPM2 gene in two Chinese siblings with mild intellectual impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      DPM2 is one subunit of a heterotrimeric complex for dolichol-phosphatemannose
      synthase (DPMS), a key enzyme in glycosylation, and only four patients with
      DPM2-CDG have been reported.
    explanation: >-
      Confirms that only four patients were on record before this report added two
      more, establishing ultra-rare status.
diagnosis:
- name: DPM2 Molecular Genetic Testing
  description: >-
    Definitive diagnosis requires demonstration of biallelic DPM2 variants.
    Because the phenotype overlaps both the CDG and the dystroglycanopathies,
    exome sequencing or a combined CDG/dystroglycanopathy gene panel is the
    practical first-tier test; in the reported patients after the index family the
    diagnosis was made by whole exome sequencing.
  presence: PRESENT
  evidence:
  - reference: PMID:37152991
    reference_title: "Identification and characterization of a new variation in DPM2 gene in two Chinese siblings with mild intellectual impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A homozygous mutation, c.197G>A (p.Gly66Glu) in exon 4 of DPM2 (NM_003863)
      was identified by whole exome sequencing (WES).
    explanation: >-
      Exome sequencing established the molecular diagnosis in this family.
- name: Serum Transferrin Isoelectric Focusing Screening
  description: >-
    Transferrin isoelectric focusing (or capillary zone electrophoresis) is the
    recommended first-line screening test in early-onset epilepsy of unknown
    cause, which is the presentation route for the severe DPM2-CDG phenotype. A
    type I pattern directs testing toward the ER N-glycosylation disorders.
  presence: PRESENT
  evidence:
  - reference: PMID:26453362
    reference_title: "Electroclinical Features of Early-Onset Epileptic Encephalopathies in Congenital Disorders of Glycosylation (CDGs)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We propose a diagnostic flowchart for the early diagnosis of CDG in patients
      presenting with EOEE and suggest to perform serum transferrin IEF (or
      capillary zone electrophoresis) as a first-line screening in early-onset
      epilepsy.
    explanation: >-
      Establishes transferrin isoelectric focusing as the recommended screening
      test for the clinical presentation in which DPM2-CDG is found.
- name: Muscle Biopsy Alpha-Dystroglycan Immunohistochemistry
  description: >-
    Muscle biopsy immunohistochemistry showing deficient alpha-dystroglycan
    O-mannosylation confirms the dystroglycanopathy component and, combined with a
    CDG type I transferrin pattern, points specifically at the DPM synthase
    complex rather than at an isolated dystroglycanopathy gene.
  presence: PRESENT
  evidence:
  - reference: PMID:23109149
    reference_title: "DPM2-CDG: a muscular dystrophy-dystroglycanopathy syndrome with severe epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There was clinical evidence of a muscular dystrophy-dystroglycanopathy
      syndrome, supported by deficient O-mannosylation by muscle
      immunohistochemistry.
    explanation: >-
      Muscle immunohistochemistry provided the tissue-level confirmation in the
      index patients.
treatments:
- name: Supportive and Multidisciplinary Care
  description: >-
    No disease-modifying therapy exists for DPM2-CDG. Unlike PMM2-CDG or MPI-CDG,
    the lesion is in Dol-P-Man synthesis itself rather than in substrate
    availability, so simple mannose supplementation would not be expected to
    bypass the block and none has been reported. Management is symptom-directed
    and multidisciplinary: seizure control, orthopedic and rehabilitative care,
    cardiac surveillance, and nutritional support.
  action_category: THERAPEUTIC
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747

  notes: Identified by GEO DataSets index search for Primary Coenzyme Q10 Deficiency (scripts/discover_datasets.py); accession and metadata verified against NCBI E-utilities on 2026-08-01. Title, sample count, and organism are GEO's own values.
notes: >-
  This is the umbrella entry for primary (biosynthesis) coenzyme Q10 deficiency,
  which is the subset of CoQ10 deficiency caused by defects in the biosynthetic
  pathway itself (PMID:37627647). Secondary CoQ10 deficiency, which PMID:37508007
  describes as resulting from a wide variety of cellular dysfunctions not directly
  linked to primary synthesis, is a different entity and is out of scope here.

  Anchor. MONDO:0018151 carries "coenzyme Q10 deficiency, primary" and "CoQ10
  deficiency, primary" among its exact synonyms, and all nine of its children are
  the primary numbered forms COQ10D1 to COQ10D9, each asserting a single causal
  gene in its OWL axioms. Searches for a secondary or a separate primary umbrella
  class returned nothing: runoak -i ols:mondo search 'secondary coenzyme Q10
  deficiency' and 'secondary CoQ10' both returned zero rows, and 't~coenzyme Q10
  deficiency' returned exactly MONDO:0018151 plus those nine children. The
  binding is therefore kept as an exactMatch-strength disease_term rather than
  demoted to a broadMatch.

  Numbered forms with their own dismech entries. COQ2 (MONDO:0011829) is curated
  as COQ2-Related_Primary_Coenzyme_Q10_Deficiency, COQ4 (MONDO:0014562) as
  COQ4-Related_Neonatal_Encephalomyopathy, COQ6 (MONDO:0013836) as
  COQ6-Related_Steroid-Resistant_Nephrotic_Syndrome, and COQ8A (MONDO:0012784) as
  Autosomal_Recessive_Ataxia_Due_to_Ubiquinone_Deficiency. Those four are
  cross-referenced from has_subtypes rather than duplicated here. PDSS1, PDSS2,
  COQ5, COQ7, COQ8B and COQ9 have no separate entry and are curated on this
  umbrella.

  COQ8B sits outside the MONDO umbrella. MONDO files the COQ8B disease as
  MONDO:0014257 nephrotic syndrome type 9, under familial idiopathic
  steroid-resistant nephrotic syndrome, so it is not one of MONDO:0018151's
  children even though every source treats COQ8B as a CoQ10 biosynthesis gene.
  That renal class is the subtype_term used on the COQ8B row.

  HPDL is dispositioned elsewhere. PMID:36978966 counts HPDL among 11 CoQ10
  biosynthesis disease genes, but MONDO gives the HPDL disease its own home as
  MONDO:0033614 spastic paraplegia 83, filed under hereditary spastic paraplegia
  and not under coenzyme Q10 deficiency, and ClinGen's only HPDL assertion is
  Moderate against Leigh syndrome. HPDL therefore gets no subtype row on this
  umbrella. Searches run: runoak -i ols:mondo search 'HPDL', '4-hydroxyphenylpyruvate
  dioxygenase like' (both zero rows) and 'spastic paraplegia 83'.

  ClinGen's COQ6 row names the wrong numbered form. The committed
  gene_validity.csv row for COQ6 gives its disease as "primary coenzyme Q10
  deficiency 8" / MONDO:0014754, but MONDO:0014754 is the COQ7 form (its
  definition names COQ7 and its axiom asserts hgnc:2244), while COQ6's form is
  COQ10D6 / MONDO:0013836. That row is therefore not cited anywhere in this
  entry; the COQ6 claims rest on PMID:21540551 instead.

  Orphanet could not be consulted. MONDO:0018151 carries Orphanet:35656 as an
  xref, references_cache holds no ORPHA_35656.md, and just fetch-reference
  ORPHA:35656 returns "No source found for reference type", so no Orphanet content
  is used or asserted here.

    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the second family, direct sequencing of OH-benzoate polyprenyltransferase
      (COQ2), the human ortholog of the yeast COQ2 gene, identified a single base
      pair frameshift deletion resulting in a premature stop codon (c.1198delT,
      N401fsX415).
    explanation: >-
      An independent family with a biallelic truncating COQ2 variant, naming the
      enzyme activity COQ2 contributes to the pathway.

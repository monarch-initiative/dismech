pathophysiology:
- name: Defective Polyisoprenoid Side-Chain Assembly and Attachment
  description: >-
    The first steps of CoQ10 biosynthesis build the polyisoprenoid tail and
    attach it to the 4-hydroxybenzoate ring. Only three of the disease genes act
    here: PDSS1 and PDSS2 each encode a subunit of the decaprenyl diphosphate
    synthase that supplies the side chain, and COQ2 is the polyprenyltransferase
    that joins it to the ring. Biallelic defects in this segment therefore block CoQ10 assembly at its
    earliest committed step, and the reported phenotypes of this segment include
    prominent visual involvement.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: PDSS1
    term:
      id: hgnc:17759
      label: PDSS1
  - preferred_term: PDSS2
    term:
      id: hgnc:23041
      label: PDSS2
  - preferred_term: COQ2
    term:
      id: hgnc:25223
      label: COQ2
  molecular_functions:
  - preferred_term: decaprenyl diphosphate synthase activity
    term:
      id: GO:0097269
      label: all-trans-decaprenyl-diphosphate synthase activity
    modifier: DECREASED
  - preferred_term: 4-hydroxybenzoate polyprenyltransferase activity
    term:
      id: GO:0008412
      label: 4-hydroxybenzoate polyprenyltransferase activity

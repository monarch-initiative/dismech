- name: Defective Benzoquinone Head-Group Modification
  description: >-
    Most of the CoQ10 biosynthesis enzymes act after side-chain attachment, on
    the benzoquinone ring, and may assemble into resolvable domains described as
    COQ complexes. COQ4, COQ5, COQ6, COQ7 and COQ9 act in this segment: COQ4 is
    the zinc-dependent C1 decarboxylase, COQ5 the pathway's C-methyltransferase,
    COQ6 its flavin-dependent ring monooxygenase, COQ7 the NADH-dependent
    demethoxyubiquinone hydroxylase, and COQ9 a lipid-binding protein that
    presents its bound lipid to COQ7. Biallelic defects in this segment therefore
    block CoQ10 maturation after the side chain has been attached.

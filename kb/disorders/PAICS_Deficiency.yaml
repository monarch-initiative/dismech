name: PAICS Deficiency
creation_date: "2026-09-01T00:00:00Z"
category: Mendelian
description: >-
  PAICS deficiency is an autosomal recessive inborn error of de novo purine
  synthesis caused by biallelic variants in PAICS, which encodes the
  bifunctional enzyme phosphoribosylaminoimidazole carboxylase (AIRC) /
  phosphoribosylaminoimidazole succinocarboxamide synthetase (SAICARS)
  catalysing steps six and seven of the pathway. It was first described in two
  Faroese siblings with multiple congenital malformations and early neonatal
  death. The recognizable malformation pattern is esophageal atresia with
  polyhydramnios, congenital heart disease, urogenital anomalies, vertebral and
  limb defects, and distinctive craniofacial features. Two things about it are
  unsettled and important. First, the phenotype has split: some patients have
  the malformation syndrome with normal neurodevelopment and survival past
  infancy, while a separate reported sibpair had severe neurodevelopmental
  regression and ocular disease with none of the malformations. Second, the
  proposed toxic metabolites were not actually found — AIR and AIr, the
  substrates predicted to accumulate, were undetectable in patient fibroblasts —
  so the mechanism connecting enzyme deficiency to malformation runs through
  loss of purinosome assembly rather than through demonstrated substrate
  toxicity.
parents:
- hereditary disease
- inborn error of purine metabolism
- disorder of de novo purine synthesis
disease_term:
  preferred_term: PAICS deficiency
  term:
    id: MONDO:0859003
    label: PAICS deficiency

inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Homozygous p.(Lys53Arg) in the original consanguineous Faroese family and in
    a third unrelated patient, and compound heterozygous p.Ser35Phe /
    p.Cys281Ter in a fourth. Heterozygous carriers have roughly half-normal
    enzyme activity and are unaffected.
  evidence:
  - reference: PMID:31600779
    reference_title: "PAICS deficiency, a new defect of de novo purine synthesis resulting in multiple congenital anomalies and fatal outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report for the first time an autosomal recessive inborn error of de novo purine synthesis (DNPS)-PAICS deficiency."
    explanation: Establishes autosomal recessive inheritance in the founding report.

pathophysiology:
- name: PAICS Bifunctional Enzyme Deficiency
  description: >-
    The recurrent p.(Lys53Arg) missense variant alters the structure of the
    catalytic site of the bifunctional AIRC/SAICARS enzyme. The deficit is
    graded and dose-dependent: about 50% of control activity in heterozygous
    carrier fibroblasts, about 10% in patient fibroblasts, and about 25% for the
    purified recombinant mutant protein. So this is a severe hypomorph rather
    than a null, which may be why any patient survives at all.
  biological_scale: MOLECULAR
  downstream:
  - target: Failure of Purinosome Assembly
    causal_link_type: DIRECT
    description: >-
      The catalytically compromised enzyme cannot support assembly of the
      multienzyme de novo purine synthesis complex, mirroring what is seen in the
      two other known DNPS defects.
    evidence:
    - reference: PMID:31600779
      reference_title: "PAICS deficiency, a new defect of de novo purine synthesis resulting in multiple congenital anomalies and fatal outcome."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "the PAICS mutation prevented purinosome formation in the patient's skin fibroblasts, and this phenotype was corrected by transfection with the wild-type but not the mutated PAICS"
      explanation: Transfection rescue with wild-type but not mutant PAICS establishes that the variant causes the purinosome defect.
  genetic_context:
    zygosity: HOMOZYGOUS
    variant_origin: GERMLINE
    allele_type: missense
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
    description: >-
      A severe hypomorph rather than a null: roughly 10% residual catalytic
      activity in patient fibroblasts, about 25% for the purified recombinant
      p.(Lys53Arg) protein, and about 50% in heterozygous carriers. The
      recurrent allele is homozygous in two unrelated families; a fourth patient
      is compound heterozygous for p.Ser35Phe and p.Cys281Ter.
  molecular_functions:
  - preferred_term: phosphoribosylaminoimidazole carboxylase activity
    term:
      id: GO:0004638
      label: phosphoribosylaminoimidazole carboxylase activity
    modifier: DECREASED
  - preferred_term: phosphoribosylaminoimidazolesuccinocarboxamide synthase activity
    term:
      id: GO:0004639
      label: phosphoribosylaminoimidazolesuccinocarboxamide synthase activity
    modifier: DECREASED
  evidence:
  - reference: PMID:31600779
    reference_title: "PAICS deficiency, a new defect of de novo purine synthesis resulting in multiple congenital anomalies and fatal outcome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The mutation reduced the catalytic activity of PAICS in heterozygous carrier and patient skin fibroblasts to approximately 50 and 10% of control levels, respectively."
    explanation: Quantifies the enzyme deficit in patient and carrier cells.
  - reference: PMID:31600779
    reference_title: "PAICS deficiency, a new defect of de novo purine synthesis resulting in multiple congenital anomalies and fatal outcome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The catalytic activity of the corresponding recombinant enzyme protein carrying the mutation p.Lys53Arg expressed and purified from E. coli was reduced to approximately 25% of the wild-type enzyme."
    explanation: Confirms the catalytic deficit in purified recombinant protein, independent of cellular context.

- name: Failure of Purinosome Assembly
  description: >-
    The purinosome is the transient multienzyme complex in which the ten de novo
    purine synthesis enzymes are co-localized for substrate channelling. Patient
    fibroblasts fail to form it, and this is corrected by wild-type but not
    mutant PAICS. The same failure occurs in adenylosuccinate lyase deficiency
    and AICA-ribosiduria, the two previously known DNPS defects, which makes
    disrupted purinosome assembly the shared cellular lesion of this disease
    group.
  biological_scale: CELLULAR
  downstream:
  - target: Impaired De Novo Purine Synthesis
    causal_link_type: DIRECT
    description: >-
      Without the assembled complex, flux through the de novo pathway is
      compromised beyond what the residual activity of the single enzyme would
      predict.
    evidence:
    - reference: PMID:35331738
      reference_title: "Multienzyme interactions of the de novo purine biosynthetic protein PAICS facilitate purinosome formation and metabolic channeling."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "perturbing PPIs between DNPB enzymes negatively impact metabolite flux through this important pathway"
      explanation: >-
        States the load-bearing claim of this edge directly: disrupting the
        protein-protein interactions that build the purinosome reduces flux
        through the pathway, over and above any single enzyme's activity.
  cell_types:
  - preferred_term: skin fibroblast
    term:
      id: CL:0002620
      label: skin fibroblast
  biological_processes:
  - preferred_term: purine nucleotide biosynthetic process
    term:
      id: GO:0006164
      label: purine nucleotide biosynthetic process
    modifier: DECREASED
  evidence:
  - reference: PMID:31600779
    reference_title: "PAICS deficiency, a new defect of de novo purine synthesis resulting in multiple congenital anomalies and fatal outcome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Similar to other two known DNPS defects-adenylosuccinate lyase deficiency and AICA-ribosiduria-the PAICS mutation prevented purinosome formation in the patient's skin fibroblasts"
    explanation: Places the purinosome assembly failure in the context of the other de novo purine synthesis defects.
  - reference: PMID:35331738
    reference_title: "Multienzyme interactions of the de novo purine biosynthetic protein PAICS facilitate purinosome formation and metabolic channeling."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we discovered PAICS interacts with all other known DNPB enzymes and with MTHFD1, an enzyme which supplies the 10-formyltetrahydrofolate cofactor essential for DNPB"
    explanation: >-
      Establishes PAICS as the interaction hub of the purinosome, which is why
      losing it disassembles the complex rather than merely removing one
      enzymatic step.

- name: Impaired De Novo Purine Synthesis
  description: >-
    Reduced flux through de novo purine nucleotide synthesis. The expected
    corollary — accumulation of the blocked substrates aminoimidazole ribotide
    (AIR) and aminoimidazole riboside (AIr) — was looked for and not found in
    patient fibroblasts, which is why no diagnostic metabolite exists for this
    disorder. AIr is cytotoxic to cell lines, so substrate toxicity remains a
    plausible but undemonstrated contributor in patients.
  biological_scale: CELLULAR
  downstream:
  - target: Disrupted Embryonic Organogenesis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Purine nucleotides are required for the proliferation and nucleic acid
      synthesis of rapidly dividing embryonic tissue, but the specific
      developmental processes that fail have not been identified.
  biological_processes:
  - preferred_term: "'de novo' IMP biosynthetic process"
    term:
      id: GO:0006189
      label: "'de novo' IMP biosynthetic process"
    modifier: DECREASED
  evidence:
  - reference: PMID:31600779
    reference_title: "PAICS deficiency, a new defect of de novo purine synthesis resulting in multiple congenital anomalies and fatal outcome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Although aminoimidazole ribotide (AIR) and aminoimidazole riboside (AIr), the enzyme substrates that are predicted to accumulate in PAICS deficiency, were not detected in patient's fibroblasts, the cytotoxic effect of AIr on various cell lines was demonstrated."
    explanation: Records both the failure to detect the predicted accumulating substrates and the separate demonstration that one of them is cytotoxic.

- name: Disrupted Embryonic Organogenesis
  description: >-
    A multisystem malformation syndrome affecting foregut, heart, axial
    skeleton, limbs, urogenital tract, and craniofacial structures — a pattern
    consistent with a global constraint on proliferating embryonic tissue rather
    than a lesion of one developmental program.
  biological_scale: ORGANISM
  downstream:
  - target: Esophageal atresia
    causal_link_type: DIRECT
  - target: Abnormal heart morphology
    causal_link_type: DIRECT
  - target: Abnormal vertebral morphology
    causal_link_type: DIRECT
  - target: Abnormal facial shape
    causal_link_type: DIRECT
  - target: Cryptorchidism
    causal_link_type: DIRECT
  - target: Pulmonary hypoplasia
    causal_link_type: DIRECT
  - target: Short stature
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:42569864
    reference_title: "Compound Heterozygous Variants in the PAICS Gene Integrate the Previously Described Divergent Phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Biallelic variants in PAICS, one of the 10 genes involved in the de novo purine synthesis (DNPS), were originally associated with an extremely rare phenotype characterized by multiple and severe congenital abnormalities, such as polyhydramnios due to esophageal atresia, congenital heart disease, and urogenital anomalies, which were lethal within the first days of life."
    explanation: Summarizes the multisystem malformation pattern attributed to the enzyme defect.


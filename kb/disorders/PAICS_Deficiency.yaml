progression:
- phase: Neonatal
  age_range: first days of life
  notes: >-
    The originally reported Faroese siblings died within the first days of life
    from their malformations. Later patients have survived — one to at least
    seven years — so lethality is not universal, and the determinants of survival
    are not established.
  evidence:
  - reference: PMID:31600779
    reference_title: "PAICS deficiency, a new defect of de novo purine synthesis resulting in multiple congenital anomalies and fatal outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We investigated two siblings from the Faroe Islands born with multiple malformations resulting in early neonatal death."
    explanation: Records the lethal neonatal course of the index siblings.
- phase: Childhood survival
  age_range: beyond infancy
  notes: >-
    Later-reported patients have survived beyond infancy, one with normal
    neurodevelopment at seven years and relatively long follow-up in another.
  evidence:
  - reference: PMID:39726239
    reference_title: "Identification of the Third Patient With PAICS Deficiency Harbouring the p.(Lys53Arg) Recurrent Variant, Extending the Phenotype Diversity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We further delineate the phenotype of PAICS deficiency and provide new insights concerning prognosis, notably in terms of neurodevelopment."
    explanation: Reports revised prognostic expectations following survival of a later patient.

clinical_burden:
  burden_level: VARIABLE
  rationale: >-
    Lethal within days of birth in the index siblings, yet compatible with
    survival to at least seven years with normal neurodevelopment in another
    patient homozygous for the same recurrent variant. With fewer than ten
    reported individuals the range is wide and the determinants are unknown.
  evidence:
  - reference: PMID:39726239
    reference_title: "Identification of the Third Patient With PAICS Deficiency Harbouring the p.(Lys53Arg) Recurrent Variant, Extending the Phenotype Diversity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Only two patients from a consanguineous family have been reported, with multiple congenital malformations, resulting in early neonatal death."
    explanation: Establishes the severe end of the burden range against which later survivors are contrasted.

genetic:
- name: PAICS
  notes: >-
    Biallelic variants in PAICS, encoding the bifunctional
    phosphoribosylaminoimidazole carboxylase (AIRC, EC 4.1.1.21) /
    phosphoribosylaminoimidazole succinocarboxamide synthetase (SAICARS, EC
    6.3.2.6). c.158A>G p.(Lys53Arg) is a recurrent variant, found homozygous in
    the original Faroese sibship and again in an unrelated third patient; a
    fourth patient carried compound heterozygous p.Ser35Phe and p.Cys281Ter.
  gene_term:
    preferred_term: PAICS
    term:
      id: hgnc:8587
      label: PAICS
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:31600779
    reference_title: "PAICS deficiency, a new defect of de novo purine synthesis resulting in multiple congenital anomalies and fatal outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic analysis of affected individuals revealed a homozygous missense mutation in PAICS (c.158A>G; p.Lys53Arg) that affects the structure of the catalytic site of the bifunctional enzyme phosphoribosylaminoimidazole carboxylase (AIRC, EC 4.1.1.21)/phosphoribosylaminoimidazole succinocarboxamide synthetase (SAICARS, EC 6.3.2.6) (PAICS)."
    explanation: Identifies PAICS as the causal gene and the recurrent variant's effect on the catalytic site.
  - reference: PMID:39726239
    reference_title: "Identification of the Third Patient With PAICS Deficiency Harbouring the p.(Lys53Arg) Recurrent Variant, Extending the Phenotype Diversity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genome Sequencing identified the homozygous pathogenic variant p.(Lys53Arg), suggesting a recurrent variant in PAICS."
    explanation: Establishes p.(Lys53Arg) as recurrent across unrelated families.

experimental_models:
- name: Patient skin fibroblasts with PAICS transfection rescue
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: >-
    Primary skin fibroblasts from an affected individual and from heterozygous
    carriers, used to measure residual enzyme activity, to score purinosome
    formation, and — through transfection with wild-type versus mutant PAICS —
    to establish causation.
  modeled_mechanisms:
  - target: Failure of Purinosome Assembly
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Patient-derived cells carrying the actual disease genotype reproduce the
      purinosome assembly defect and are corrected by wild-type PAICS.
    limitations: >-
      Fibroblasts cannot model the embryonic organogenesis in which the disease
      manifests, and the predicted accumulating substrates were not detectable in
      them — so the model demonstrates the cellular lesion but not the route from
      it to the malformations.
    readouts:
    - name: Purinosome formation after wild-type versus mutant PAICS transfection
      target: Failure of Purinosome Assembly
      direction: RESTORED
      interpretation: >-
        Wild-type PAICS restores purinosome formation and the mutant construct
        does not, establishing that the variant causes the defect.
      evidence:
      - reference: PMID:31600779
        reference_title: "PAICS deficiency, a new defect of de novo purine synthesis resulting in multiple congenital anomalies and fatal outcome."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "this phenotype was corrected by transfection with the wild-type but not the mutated PAICS"
        explanation: Reports the transfection rescue measurement in patient fibroblasts.
    evidence:
    - reference: PMID:31600779
      reference_title: "PAICS deficiency, a new defect of de novo purine synthesis resulting in multiple congenital anomalies and fatal outcome."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "the PAICS mutation prevented purinosome formation in the patient's skin fibroblasts"
      explanation: Establishes patient fibroblasts as informative for the purinosome assembly node.

treatments:
- name: Supportive and Surgical Care
  description: >-
    No disease-modifying therapy exists. Management is surgical repair of
    esophageal atresia and congenital heart disease where survival permits, plus
    supportive care. Because AIR and AIr do not accumulate detectably, there is
    no substrate-reduction target either.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care

- name: Genetic Counseling and Prenatal Diagnosis
  description: >-
    Relevant to families with recurrent spontaneous abortion or unexplained early
    neonatal death, in whom this disorder should be considered. A probable
    recurrence in a later sibling was diagnosed antenatally on the malformation
    pattern although it could not be confirmed molecularly.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:31600779
    reference_title: "PAICS deficiency, a new defect of de novo purine synthesis resulting in multiple congenital anomalies and fatal outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PAICS deficiency is a newly described disease that enhances our understanding of the DNPS pathway and should be considered in the diagnosis of families with recurrent spontaneous abortion or early neonatal death."
    explanation: States the clinical setting in which this diagnosis should be sought.

discussions:
- discussion_id: missing_toxic_metabolite
  kind: KNOWLEDGE_GAP
  prompt: >-
    If AIR and AIr do not accumulate detectably in patient cells, what actually
    mediates the tissue damage in PAICS deficiency?
  attaches_to:
  - pathophysiology#Impaired De Novo Purine Synthesis
  - pathophysiology#Disrupted Embryonic Organogenesis
  rationale: >-
    The substrate-accumulation model, which works for the sibling DNPS disorders,
    was tested here and failed: the predicted metabolites were sought in patient
    fibroblasts and not found, even though AIr is demonstrably cytotoxic to cell
    lines. That leaves purine insufficiency, purinosome-dependent channelling
    failure, or accumulation confined to a tissue or developmental window that
    fibroblasts do not sample. The absence also means there is no diagnostic
    metabolite and no substrate-reduction therapeutic target.

- discussion_id: malformation_versus_neurodegeneration_phenotypes
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why do some individuals with biallelic PAICS variants present with a
    congenital malformation syndrome and others with neurodevelopmental
    regression and ocular disease, with almost no overlap?
  attaches_to:
  - phenotypes#Global developmental delay
  - pathophysiology#PAICS Bifunctional Enzyme Deficiency
  rationale: >-
    The split is close to dichotomous in the literature to date: malformation
    patients are described as having no neurologic involvement, and the
    neurodevelopmental sibpair had none of the malformations. Allele-specific
    residual activity is the obvious hypothesis, but the recurrent p.(Lys53Arg)
    homozygous genotype itself spans neonatal lethality and survival to seven
    years with normal neurodevelopment, so genotype alone does not explain it.

- discussion_id: genotype_does_not_predict_survival
  kind: KNOWLEDGE_GAP
  prompt: >-
    What determines whether an individual homozygous for p.(Lys53Arg) dies in
    the neonatal period or survives with normal neurodevelopment?
  attaches_to:
  - pathophysiology#PAICS Bifunctional Enzyme Deficiency
  rationale: >-
    The same recurrent homozygous variant produced early neonatal death in the
    Faroese siblings and a seven-year-old with normal neurodevelopment in an
    unrelated family. With so few patients, modifier effects, ascertainment bias
    toward lethal cases, and differences in surgical management of the
    esophageal atresia are all unexcluded.

notes: >-
  Phenotype coverage is deliberately incomplete. OMIM #619859 and the HPO-JAX
  annotation set for this disorder carry a fuller craniofacial and skeletal
  list than this entry does — flat face, brachycephaly, short nose, depressed
  nasal bridge, anteverted nares, low-set ears, short neck, hypertelorism,
  tracheoesophageal fistula, choanal atresia, missing ribs, lumbar
  hemivertebrae, talipes equinovarus, fifth-finger clinodactyly, and coronal
  hypospadias. All three primary reports are abstract-only in the reference
  cache and none of those individual features appears in an abstract, so they
  could not be given a verified snippet and were left out rather than cited to
  a source that does not state them. A curator with full-text access to
  PMID:31600779 and PMID:39726239, or with the Orphanet bulk cache rebuilt for
  ORPHA:633099, should add them.

  Nomenclature: the MONDO term "phosphoribosylaminoimidazole carboxylase
  deficiency" (MONDO:0859244) is obsolete and was merged into MONDO:0859003
  "PAICS deficiency" (monarch-initiative/mondo#9884); this entry uses the live
  term. The disorder is also referenced as OMIM:619859 and Orphanet:633099. Note
  that PAICS is heavily studied as a cancer proliferation gene, so a literature
  search on the symbol alone returns overwhelmingly oncology papers unrelated to
  this inborn error.


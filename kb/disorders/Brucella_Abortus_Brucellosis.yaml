name: Brucella Abortus Brucellosis
creation_date: "2026-09-30T00:39:21Z"
description: >-
  Brucella abortus brucellosis is a cattle- and bison-associated form of human
  brucellosis caused by the facultatively intracellular bacterium Brucella
  abortus after zoonotic exposure to infected bovine tissues, reproductive
  fluids, raw dairy products, or laboratory cultures.
category: Infectious Disease
disease_term:
  preferred_term: Brucella abortus brucellosis
  term:
    id: MONDO:0001973
    label: Brucella abortus brucellosis
parents:
- Brucellosis
synonyms:
- B. abortus infection
notes: >-
  The Falcon deep-research request fell back to OpenScientist and all 32
  reported PMIDs resolved. The report's HP:0100775 lead was not used because the
  term is Dural ectasia, not Sacroiliitis. The report itself flagged selected
  brucellosis endocarditis and relapse-rate numerics for re-confirmation, so
  those outcome and treatment numbers were not curated. preflight-dr skipped
  automated gene identity checks because MONDO:0001973 records no causal gene;
  manual review confirmed the report covered Brucella abortus brucellosis.
infectious_agent:
- name: Brucella abortus
  infectious_agent_term:
    preferred_term: Brucella abortus
    term:
      id: NCBITaxon:235
      label: Brucella abortus
  description: >-
    Facultatively intracellular Brucella species associated with bovine hosts
    that can cause human brucellosis after zoonotic spillover.
  evidence:
  - reference: PMID:21939378
    reference_title: Interactions of the human pathogenic Brucella species with their hosts.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Brucellosis is a zoonotic infection caused primarily by the bacterial
      pathogens Brucella melitensis and B. abortus.
    explanation: >-
      Identifies B. abortus as one of the primary bacterial agents of human
      zoonotic brucellosis.
  - reference: PMID:21346896
    reference_title: "Brucellosis: review on the recent trends in pathogenicity and laboratory diagnosis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Brucella is a facultative intracellular pathogen that has the ability to
      survive and multiply in the phagocytes and cause abortion in cattle and
      undulant fever in humans.
    explanation: >-
      Supports Brucella as a facultatively intracellular zoonotic pathogen that
      connects bovine disease to human undulant fever.
agent_life_cycle:
  description: >-
    B. abortus is maintained in bovine hosts, especially cattle, where infection
    of reproductive tissues amplifies shedding from aborted material and creates
    zoonotic foodborne, contact, and aerosol exposure for humans.
  hosts:
  - preferred_term: Homo sapiens
    role: incidental clinical host
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  - preferred_term: cattle
    role: primary bovine reservoir host
    term:
      id: NCBITaxon:9913
      label: Bos taurus
  evidence:
  - reference: PMID:8319440
    reference_title: Pathogenesis of abortion of bovine brucellosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Bovine brucellosis is a major disease of cattle characterized by abortion
      during the last trimester of gestation.
    explanation: >-
      Places cattle at the center of bovine B. abortus disease and reproductive
      shedding that can expose humans.
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
transmission:
- name: Cattle-associated zoonotic exposure
  description: >-
    Humans acquire B. abortus brucellosis through exposure to infected cattle,
    bison, or bovine products, including unpasteurized dairy, birth products,
    animal tissues, aerosols, or laboratory cultures.
  evidence:
  - reference: PMID:21939378
    reference_title: Interactions of the human pathogenic Brucella species with their hosts.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      It is acquired by consumption of unpasteurized dairy products or by contact
      with infected animals.
    explanation: >-
      Supports raw-dairy ingestion and infected-animal contact as major
      transmission routes for human Brucella infection.
  - reference: PMID:21346896
    reference_title: "Brucellosis: review on the recent trends in pathogenicity and laboratory diagnosis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Brucellosis is a zoonotic infection transmitted from animals to humans by
      the ingestion of infected food products, direct contact with an infected
      animal or inhalation of aerosols.
    explanation: >-
      Adds aerosol inhalation to foodborne and direct-contact zoonotic
      acquisition routes.
pathophysiology:
- name: Bovine-Associated Brucella abortus Acquisition
  role: trigger
  description: >-
    B. abortus enters the human host after cattle- or bison-associated zoonotic
    exposure and establishes the species-specific form of brucellosis.
  biological_scale: ORGANISM
  downstream:
  - target: Intracellular Macrophage Survival
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Zoonotically acquired B. abortus crosses a mucosal or cutaneous barrier and
      is taken up by phagocytes.
  evidence:
  - reference: PMID:21346896
    reference_title: "Brucellosis: review on the recent trends in pathogenicity and laboratory diagnosis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The last method is remarkably efficient given the relatively low
      concentration of organisms (10 - 100 bacteria) needed to establish
      infection in humans, and has brought renewed attention to this old disease.
    explanation: >-
      Supports efficient zoonotic infection after aerosol exposure to small
      numbers of Brucella organisms.
- name: Intracellular Macrophage Survival
  description: >-
    Brucella survives in phagocytic host cells by avoiding lysosomal killing and
    establishing an intracellular replicative niche.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  downstream:
  - target: Granulomatous Brucella abortus Inflammation
    causal_link_type: DIRECT
    description: >-
      Intracellular persistence triggers a systemic inflammatory response.
  evidence:
  - reference: PMID:26497941
    reference_title: Brucella abortus Cell Cycle and Infection Are Coordinated.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      B. abortus cell-cycle progression is coordinated with intracellular
      trafficking in the endosomal compartments.
    explanation: >-
      Supports coordinated B. abortus intracellular trafficking as a mechanism
      that precedes replication in the host cell.
  - reference: PMID:26497941
    reference_title: Brucella abortus Cell Cycle and Infection Are Coordinated.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Bacteria are first blocked at the G1 stage, growth and chromosome
      replication being resumed shortly before reaching the intracellular
      proliferation compartment.
    explanation: >-
      Connects B. abortus cell-cycle progression to arrival at a permissive
      intracellular proliferation compartment.
- name: Granulomatous Brucella abortus Inflammation
  description: >-
    Persistent intracellular B. abortus infection produces the systemic febrile
    inflammatory syndrome of human brucellosis and can seed focal complications.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  evidence:
  - reference: PMID:21939378
    reference_title: Interactions of the human pathogenic Brucella species with their hosts.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      An important feature of the disease is persistent bacterial colonization of
      the reticuloendothelial system.
    explanation: >-
      Links pathogenic Brucella intracellular survival to persistent systemic
      colonization.
  - reference: PMID:21939378
    reference_title: Interactions of the human pathogenic Brucella species with their hosts.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In this review we discuss recent insights into mechanisms of intracellular
      survival and immune evasion that contribute to systemic persistence by the
      pathogenic Brucella species.
    explanation: >-
      Supports intracellular survival and immune evasion as Brucella-wide drivers
      of systemic persistence.

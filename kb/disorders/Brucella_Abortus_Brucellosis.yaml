progression:
- phase: Acute brucellosis
  notes: >-
    The early presentation, with the most pronounced systemic inflammatory
    profile and the best response to appropriately prolonged combination
    therapy. The cited cohort is genus-level on phase but species-resolved on
    agent only in PMID:41260186, which studied acute cases.
  evidence:
  - reference: PMID:41241000
    reference_title: "Laboratory parameters and serum tube agglutination test as markers for brucellosis treatment response."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In conclusion, acute brucellosis presents with a more pronounced inflammatory profile than subacute/chronic forms."
    explanation: >-
      The phase-comparison cohort distinguishes acute from subacute/chronic
      brucellosis and describes acute disease as the more inflammatory phase.
- phase: Subacute and chronic brucellosis
  notes: >-
    Later presentations respond less well to therapy and may reflect persistent
    or focalized infection seeded from the reticuloendothelial reservoir.
  evidence:
  - reference: PMID:41241000
    reference_title: "Laboratory parameters and serum tube agglutination test as markers for brucellosis treatment response."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "While patients with acute brucellosis demonstrated a significantly higher therapeutic response rate, the serological response was also more pronounced in this group."
    explanation: >-
      The acute versus subacute/chronic comparison supports later disease as a
      clinically distinct, less treatment-responsive phase.
- phase: Relapse after apparent therapy response
  notes: >-
    Relapse follows standard therapy in a minority of uncomplicated cases, which
    is why multi-week combination courses are used.
  evidence:
  - reference: PMID:18162038
    reference_title: "Perspectives for the treatment of brucellosis in the 21st century: the Ioannina recommendations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "More importantly, these regimens still allow for a small, albeit significant percentage of therapeutic failures, most commonly in the form of relapses, ranging from 5% to 15% of uncomplicated cases."
    explanation: >-
      The expert recommendations describe relapse as the commonest form of
      therapeutic failure after standard brucellosis regimens.
treatments:
- name: Doxycycline-rifampicin combination therapy
  description: >-
    Six-week all-oral combination therapy for uncomplicated human brucellosis.
    Brucellosis therapy is not split by Brucella species, so the regimen is
    curated here on the same genus-level footing it is recommended on.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: doxycycline
      term:
        id: CHEBI:50845
        label: doxycycline
    - preferred_term: rifampicin
      term:
        id: CHEBI:28077
        label: rifampicin
  target_mechanisms:
  - target: Requirement for Cell-Penetrant Antimicrobials
    treatment_effect: INHIBITS
    description: >-
      Doxycycline and rifampicin both accumulate intracellularly, so the
      combination reaches the protected phagocyte reservoir.
  - target: Persistent Reticuloendothelial Colonization
    treatment_effect: INHIBITS
    description: >-
      Prolonged combination therapy clears the reticuloendothelial reservoir and
      limits relapse.
  evidence:
  - reference: PMID:18162038
    reference_title: "Perspectives for the treatment of brucellosis in the 21st century: the Ioannina recommendations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The author panel suggests that the optimal treatment of uncomplicated brucellosis should be based on a six-week regimen of doxycycline combined either with streptomycin for 2–3 weeks, or rifampicin for six weeks."
    explanation: >-
      The expert recommendation lists doxycycline plus six weeks of rifampicin as
      one optimal regimen for uncomplicated brucellosis.
- name: Doxycycline-aminoglycoside combination therapy
  description: >-
    Doxycycline combined with streptomycin or gentamicin, the highest-ranked
    regimens for human brucellosis in randomized-trial evidence, at the cost of
    parenteral administration. Not species-split.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: doxycycline
      term:
        id: CHEBI:50845
        label: doxycycline
    - preferred_term: streptomycin
      term:
        id: CHEBI:17076
        label: streptomycin
  target_mechanisms:
  - target: Requirement for Cell-Penetrant Antimicrobials
    treatment_effect: INHIBITS
    description: >-
      Doxycycline reaches the intracellular reservoir while the aminoglycoside
      adds bactericidal activity against extracellular organisms.
  - target: Persistent Reticuloendothelial Colonization
    treatment_effect: INHIBITS
    description: >-
      The doxycycline-aminoglycoside combination improves clearance and relapse
      prevention over all-oral therapy.
  evidence:
  - reference: PMID:39172763
    reference_title: "Updated therapeutic options for human brucellosis: A systematic review and network meta-analysis of randomized controlled trials."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Doxycycline + Gentamicin ranked the best in efficacy (SUCRA values: 0.94), the second is Triple (SUCRA values: 0.87), and the third is Doxycycline + Streptomycin (SUCRA values: 0.78)."
    explanation: >-
      The randomized-trial network meta-analysis ranks the two
      doxycycline-aminoglycoside regimens among the most efficacious options.
review_notes: >-
  Promotion to its own entry under design decisions 3e rests on two of the five
  axes, both cited here.

  Axis 1, reservoir and transmission: B. abortus is maintained in cattle and
  reaches humans through bovine tissues, reproductive material, bovine dairy,
  and laboratory aerosols, against the sheep and goat reservoir and
  small-ruminant dairy route recorded for Brucella_Melitensis_Brucellosis.
  Cited to PMID:8319440 on the bovine reproductive reservoir and PMID:21346896
  on the acquisition routes.

  Axis 2, presentation: PMID:41260186 differentiated the infecting species by
  nested PCR in 349 acute brucellosis patients and found the two species
  produce different clinical and laboratory pictures, with fatigue, arthralgia
  and sweating higher in the 17 B. abortus cases and depressed eosinophils and
  raised CRP more frequent in the 38 B. melitensis cases. That study also
  withdraws the "B. melitensis is the most virulent species" framing rather
  than supporting it, so this entry does not claim that B. abortus disease is
  milder - only that it presents differently. The axis is the difference in
  presentation, not a severity ordering.

  First-line therapy is explicitly not an axis: brucellosis regimens are
  recommended at genus level, which is why the two regimens here cite the same
  genus-level sources as the parent and the melitensis sibling rather than
  species-specific trials.

  The covering organization 3e requires is now in place: the parent Brucellosis
  has_subtypes pointer row (classification etiologic_species, curated_in
  Brucella_Abortus_Brucellosis) plus the Brucelloses grouping, which was
  created with this entry. The melitensis review_notes rationale for not
  creating that grouping ("while this is the only curated species-specific
  child") expired when this entry was curated, and the grouping supersedes it;
  that note should be updated when that entry is next revised.

    explanation: Review establishes marked accumulation of 7alpha-hydroxy-4-cholesten-3-one in CTX.
- name: 27-hydroxycholesterol (27-OHC)
  presence: Decreased
  context: >
    Direct enzymatic product of mitochondrial sterol 27-hydroxylase (CYP27A1);
    significantly reduced in CTX plasma and patient-derived cortical neurons,
    distinguishing CTX from hereditary spastic paraplegia type 5
    (SPG5/CYP7B1 deficiency), in which 27-hydroxycholesterol is markedly
    elevated.
  readouts:
  - target: CYP27A1 sterol 27-hydroxylase deficiency
    relationship: READOUT_OF
    direction: NEGATIVE
    endpoint_context: DIAGNOSTIC
    interpretation: Significantly reduced 27-hydroxycholesterol directly reports loss of CYP27A1 sterol 27-hydroxylase catalytic activity.
    evidence:
    - reference: DOI:10.3389/fneur.2022.1049850
      reference_title: "Cerebrotendinous Xanthomatosis: A practice review of pathophysiology, diagnosis, and treatment"
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "the levels of 27-hydroxycholesterol, the product of the 27-hydroxylase activity that passes more eﬃciently the cell membranes, are signiﬁcantly reduced"
      explanation: Practice review confirms significantly reduced 27-hydroxycholesterol levels in CTX.
    - reference: DOI:10.1186/s13023-023-02666-w
      reference_title: "Chenodeoxycholic acid rescues axonal degeneration in induced pluripotent stem cell-derived neurons from spastic paraplegia type 5 and cerebrotendinous xanthomatosis patients"
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Moreover, because of impaired oxidation of cholesterol, 27-OHC levels in CTX neurons were significantly reduced"
      explanation: Patient iPSC-derived cortical neuron study demonstrates significantly reduced 27-OHC levels in CTX neurons.
  evidence:
  - reference: DOI:10.3389/fneur.2022.1049850
    reference_title: "Cerebrotendinous Xanthomatosis: A practice review of pathophysiology, diagnosis, and treatment"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "the levels of 27-hydroxycholesterol, the product of the 27-hydroxylase activity that passes more eﬃciently the cell membranes, are signiﬁcantly reduced"
    explanation: Practice review identifies significantly reduced 27-hydroxycholesterol in CTX.
- name: Postprandial fibroblast growth factor 19 (FGF19)
  presence: Decreased
  context: >
    Blunted postprandial ileal FXR-FGF19 endocrine signaling in CTX patients
    assessed after a 3-week washout of chenodeoxycholic acid and statin
    therapy compared with matched healthy controls, reflecting luminal primary
    bile acid (CDCA) deficiency and impaired negative feedback repression of
    hepatic CYP7A1.
  readouts:
  - target: Chenodeoxycholic acid deficiency and disinhibited bile acid precursor synthesis
    relationship: READOUT_OF
    direction: NEGATIVE
    endpoint_context: DIAGNOSTIC
    interpretation: Reduced postprandial FGF19 in CTX patients after a 3-week washout of chenodeoxycholic acid and statin therapy compared with matched healthy controls reports impaired ileal FXR activation downstream of CDCA deficiency and loss of endocrine feedback on hepatic CYP7A1.
    evidence:
    - reference: DOI:10.3390/nu15214625
      reference_title: "Characterization of Postprandial Bile Acid Profiles and Glucose Metabolism in Cerebrotendinous Xanthomatosis"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Postprandial GLP-1 levels were slightly higher in CTX subjects whereas postprandial FGF19 levels were lower in CTX subjects. This novel characterization of CTX patients reveals very low circulating bile acid levels and FGF19 levels, aberrant postprandial glucose and insulin profiles, and elevated postprandial GLP-1 responses."
      explanation: Meal-test clinical study demonstrates lower postprandial FGF19 alongside very low circulating bile acid levels in CTX.
    - reference: DOI:10.3390/nu15214625
      reference_title: "Characterization of Postprandial Bile Acid Profiles and Glucose Metabolism in Cerebrotendinous Xanthomatosis"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Seven patients and seven age, gender and body mass index matched controls were included and subjected to a 4 h mixed meal test with regular blood sampling. CTX patients withdrew from chenodeoxycholic acid (CDCA) and statin therapy three weeks prior to the test."
      explanation: Clinical protocol specifies that CTX patients were studied after a 3-week washout of chenodeoxycholic acid and statin therapy rather than in treatment-naive disease or an on/off pharmacodynamic crossover.
  evidence:
  - reference: DOI:10.3390/nu15214625
    reference_title: "Characterization of Postprandial Bile Acid Profiles and Glucose Metabolism in Cerebrotendinous Xanthomatosis"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Postprandial GLP-1 levels were slightly higher in CTX subjects whereas postprandial FGF19 levels were lower in CTX subjects. This novel characterization of CTX patients reveals very low circulating bile acid levels and FGF19 levels, aberrant postprandial glucose and insulin profiles, and elevated postprandial GLP-1 responses."
    explanation: Clinical study shows lower postprandial FGF19 concentrations in CTX patients.
  - reference: DOI:10.3390/nu15214625
    reference_title: "Characterization of Postprandial Bile Acid Profiles and Glucose Metabolism in Cerebrotendinous Xanthomatosis"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Seven patients and seven age, gender and body mass index matched controls were included and subjected to a 4 h mixed meal test with regular blood sampling. CTX patients withdrew from chenodeoxycholic acid (CDCA) and statin therapy three weeks prior to the test."
    explanation: Meal-test cohort was evaluated after a 3-week washout of CDCA and statin therapy compared against matched healthy controls.

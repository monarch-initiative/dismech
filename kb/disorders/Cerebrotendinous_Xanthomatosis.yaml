animal_models:
- name: Cyp27a1-/- mouse
  species: Mouse
  genotype: Cyp27a1-/-
  description: >
    Targeted disruption of the sterol 27-hydroxylase gene (Cyp27a1-/-) in mice
    reduces primary bile acid synthesis with compensatory increase in
    cholesterol 7alpha-hydroxylase activity and flux of
    7alpha-hydroxy-4-cholesten-3-one across the blood-brain barrier into
    cholestanol, but does not give rise to xanthomas.
  modeled_mechanisms:
  - target: CYP27A1 sterol 27-hydroxylase deficiency
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    limitations: >
      Partial biochemical validity (impaired bile acid synthesis, CYP7A1
      upregulation, and blood-brain barrier flux of 7alpha-hydroxy-4-cholesten-3-one)
      but lacks human xanthoma formation.
    description: Models loss of mitochondrial sterol 27-hydroxylase activity with flux of 7alpha-hydroxy-4-cholesten-3-one across the blood-brain barrier and conversion into cholestanol, without xanthoma formation.
    evidence:
    - reference: PMID:20494109
      reference_title: "Cerebrotendinous xanthomatosis: an inborn error in bile acid synthesis with defined mutations but still a challenge."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: REVIEW_SYNTHESIS
      snippet: "Disruption of this gene in mice does not give rise to xanthomas."
      explanation: Review notes that sterol 27-hydroxylase gene disruption in mice does not produce human-like xanthomas.
    - reference: PMID:23759795
      reference_title: "Cerebrotendinous xanthomatosis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM

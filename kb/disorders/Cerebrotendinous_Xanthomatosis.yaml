diagnosis:
- name: Plasma cholestanol testing
  description: Elevated plasma cholestanol supports CTX diagnosis and treatment monitoring.
  results: Elevated plasma cholestanol.
  evidence:
  - reference: PMID:20301583
    reference_title: "Cerebrotendinous Xanthomatosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "high plasma and tissue cholestanol concentration"
    explanation: GeneReviews identifies elevated cholestanol as a key biochemical diagnostic abnormality.
- name: Bile alcohol and bile acid profile
  description: Decreased CDCA with increased bile alcohols and glyconjugates supports a bile-acid synthesis defect.
  results: Decreased CDCA with increased bile alcohols and glyconjugates.
  evidence:
  - reference: PMID:20301583
    reference_title: "Cerebrotendinous Xanthomatosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "decreased chenodeoxycholic acid (CDCA), increased concentration of bile alcohols and their glyconjugates"
    explanation: GeneReviews identifies the diagnostic bile acid and bile alcohol pattern.
- name: CYP27A1 molecular genetic testing
  description: Molecular testing confirms diagnosis by identifying biallelic CYP27A1 pathogenic variants.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  results: Biallelic pathogenic CYP27A1 variants confirm CTX.
  evidence:
  - reference: PMID:20301583
    reference_title: "Cerebrotendinous Xanthomatosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "biallelic pathogenic variants in CYP27A1 identified by molecular genetic testing"
    explanation: GeneReviews establishes molecular confirmation by biallelic CYP27A1 variants.
- name: Newborn screening dried blood spot bile alcohol glucuronide ratio
  description: >
    Candidate neonatal dried blood spot biomarker testing using liquid
    chromatography-tandem mass spectrometry (LC-MS/MS) to quantify
    5beta-cholestane-3alpha,7alpha,12alpha,25-tetrol,3-O-beta-D-glucuronide
    (GlcA-tetrol) and its ratio to tauro-chenodeoxycholic acid (TCDCA); no
    consensus metabolite or universal screening tier is yet established, and
    population implementation is recommended cautiously and initially in a
    research context because mild variants may remain asymptomatic for
    prolonged periods without treatment.
  diagnosis_term:
    preferred_term: newborn screening
    term:
      id: NCIT:C81178
      label: Newborn Screening
  results: Elevated dried blood spot GlcA-tetrol and GlcA-tetrol/tauro-chenodeoxycholic acid (TCDCA) ratio serve as candidate neonatal screening biomarkers, evaluated cautiously and initially in a research context due to detection of mild variants.
  evidence:
  - reference: DOI:10.3389/fneur.2022.1049850
    reference_title: "Cerebrotendinous Xanthomatosis: A practice review of pathophysiology, diagnosis, and treatment"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Newborn screening with dried blood spots is considered by several groups a key step for early diagnosis and treatment"
    explanation: Practice review notes that several groups consider dried blood spot newborn screening a key step toward early CTX diagnosis and treatment.
  - reference: DOI:10.3389/fneur.2022.1049850
    reference_title: "Cerebrotendinous Xanthomatosis: A practice review of pathophysiology, diagnosis, and treatment"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "However, the most characteristic biomarker in CTX positive newborns after screening was 5- β -cholestane-3α ,7α ,12α ,25-tetrol,3-O-β - D-glucuronide (GlcA-tetrol)"
    explanation: Practice review identifies GlcA-tetrol as the most characteristic candidate dried blood spot biomarker in CTX-positive newborns.
  - reference: DOI:10.3389/fneur.2022.1049850
    reference_title: "Cerebrotendinous Xanthomatosis: A practice review of pathophysiology, diagnosis, and treatment"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "However, inclusion in newborn screening programs should be done cautiously and initially in a research context due to the likelihood of detecting mild variants that may remain asymptomatic for a longer period without treatment"
    explanation: Practice review cautions that newborn screening inclusion should initially occur in a research context because mild variants may remain asymptomatic for prolonged periods without treatment.
- name: Mignarri clinical suspicion index
  description: >
    Weighted clinical scoring algorithm assigning points across family history,
    systemic indicators (infantile chronic diarrhea, juvenile cataracts, tendon
    xanthomas, neonatal cholestasis), and neurological/MRI features using very
    strong (100), strong (50), and moderate (25) criteria to guide biochemical
    cholestanol screening and CYP27A1 genetic analysis.
  results: Weighted score across very strong (100), strong (50), and moderate (25) criteria guides serum cholestanol assessment and CYP27A1 sequencing.
  evidence:
  - reference: DOI:10.3389/fneur.2022.1049850
    reference_title: "Cerebrotendinous Xanthomatosis: A practice review of pathophysiology, diagnosis, and treatment"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "In clinical practice, the Mignarri index of suspicion can be used to calculate the CTX prediction score and guide the best diagnostic approach for each individual."
    explanation: Practice review describes clinical use of the Mignarri suspicion index to calculate a CTX prediction score and guide diagnostic testing.
  - reference: DOI:10.3389/fneur.2022.1049850
    reference_title: "Cerebrotendinous Xanthomatosis: A practice review of pathophysiology, diagnosis, and treatment"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Score for each group of criteria: very strong criteria = 100/strong criteria = 50/moderate criteria = 25."
    explanation: Practice review specifies the Mignarri point weights for very strong, strong, and moderate clinical criteria.
differential_diagnoses:
- name: Sitosterolemia
  description: >
    Autosomal recessive sterol storage disorder (ABCG5/ABCG8 deficiency) that
    shares tendon xanthomas and premature atherosclerosis with CTX amid normal to
    moderately elevated plasma cholesterol.
  distinguishing_features:
  - Markedly elevated plasma plant sterols (sitosterol, campesterol) rather than predominant cholestanol and bile alcohol accumulation
  - Absence of childhood cataracts, chronic infantile diarrhea, and progressive cerebellar/pyramidal leukodystrophy
  - Pathogenic variants in ABCG5 or ABCG8 rather than CYP27A1
  disease_term:
    preferred_term: Sitosterolemia
    term:
      id: MONDO:0008863
      label: sitosterolemia
  evidence:
  - reference: PMID:27678445
    reference_title: "Tendon xanthomas: Not always familial hypercholesterolemia."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Tendon xanthoma are most commonly associated with Familial Hypercholesterolemia, but the differential diagnosis includes sitosterolemia and cerebrotendinous xanthomatosis (CTX)."
    explanation: Review identifies sitosterolemia and familial hypercholesterolemia as the primary differential diagnoses for tendon xanthomas alongside CTX.
  - reference: DOI:10.3389/fneur.2022.1049850
    reference_title: "Cerebrotendinous Xanthomatosis: A practice review of pathophysiology, diagnosis, and treatment"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Regarding diﬀerential diagnoses, sitosterolemia, familial hypercholesterolemia (both of which can also manifest with tendon xanthomas), Smith-Lemli-Opitz syndrome (characterized by elevated 7-dehydrocholesterol, which may also be present in some CTX patients), other inborn errors of bile acid metabolism (such as HSP type 5A), and non-speciﬁc liver disease are among the disorders with features similar to CTX"
    explanation: Practice review lists sitosterolemia and familial hypercholesterolemia as key differential diagnoses that also manifest with tendon xanthomas.
- name: Familial hypercholesterolemia
  description: >
    Common genetic dyslipidemia characterized by tendon xanthomas, xanthelasma,
    and premature atherosclerotic cardiovascular disease that often leads to
    initial misdiagnosis of CTX patients presenting with Achilles xanthomas.
  distinguishing_features:
  - Markedly elevated plasma total and LDL cholesterol in familial hypercholesterolemia versus normal or low plasma cholesterol with elevated cholestanol in CTX
  - Autosomal dominant inheritance (LDLR, APOB, PCSK9) in classic familial hypercholesterolemia
  - Absence of juvenile cataracts, infantile diarrhea, and progressive CNS leukodystrophy
  disease_term:
    preferred_term: Familial hypercholesterolemia
    term:
      id: MONDO:0005439
      label: familial hypercholesterolemia
  evidence:
  - reference: PMID:27678445
    reference_title: "Tendon xanthomas: Not always familial hypercholesterolemia."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Tendon xanthoma are most commonly associated with Familial Hypercholesterolemia, but the differential diagnosis includes sitosterolemia and cerebrotendinous xanthomatosis (CTX)."
    explanation: Review highlights familial hypercholesterolemia as the most common cause of tendon xanthomas in the differential diagnosis of CTX.
  - reference: PMID:27678445
    reference_title: "Tendon xanthomas: Not always familial hypercholesterolemia."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "When patients present with tendon xanthomas and FH is ruled out, clinicians should consider CTX as a possible diagnosis."
    explanation: Review emphasizes considering CTX when familial hypercholesterolemia is excluded in patients with tendon xanthomas.
- name: Hereditary spastic paraplegia type 5A (SPG5A)
  description: >
    Autosomal recessive disorder of oxysterol and bile-acid metabolism caused by
    CYP7B1 (oxysterol 7alpha-hydroxylase) deficiency that mimics the spinal
    xanthomatosis subtype of CTX with progressive spastic paraparesis and dorsal
    column sensory loss.
  distinguishing_features:
  - Marked accumulation of plasma and neuronal 27-hydroxycholesterol (27-OHC) in SPG5A versus significant reduction of 27-OHC in CTX
  - Biallelic pathogenic variants in CYP7B1 rather than CYP27A1
  - Typical absence of tendon xanthomas and juvenile cataracts in SPG5A
  disease_term:
    preferred_term: Hereditary spastic paraplegia 5A
    term:
      id: MONDO:0010047
      label: hereditary spastic paraplegia 5A
  evidence:
  - reference: DOI:10.1186/s13023-023-02666-w
    reference_title: "Chenodeoxycholic acid rescues axonal degeneration in induced pluripotent stem cell-derived neurons from spastic paraplegia type 5 and cerebrotendinous xanthomatosis patients"
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Indeed, using the 27-OHC ELISA kit (MyBioSource, Cat. #: MBS285996), we observed a significant increase of 27-OHC levels in SPG5 cortical PNs compared with WT PNs"
    explanation: Comparative study of SPG5 and CTX patient neurons shows significantly elevated 27-hydroxycholesterol in SPG5 cortical projection neurons.
  - reference: PMID:19812052
    reference_title: "Marked accumulation of 27-hydroxycholesterol in SPG5 patients with hereditary spastic paresis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with a recessively inherited \"pure\" hereditary spastic paresis (SPG5) have mutations in the gene coding for the oxysterol 7 alpha hydroxylase (CYP7B1)."
    explanation: Clinical biochemical study establishes CYP7B1 mutations and 27-hydroxycholesterol accumulation as the basis of SPG5.
- name: Smith-Lemli-Opitz syndrome
  description: >
    Autosomal recessive disorder of distal cholesterol biosynthesis (DHCR7
    deficiency) that shares neurodevelopmental impairment, cataracts, and
    elevated 7-dehydrocholesterol sterol intermediates with CTX.
  distinguishing_features:
  - Deficient 7-dehydrocholesterol reductase (DHCR7) with congenital multiple malformation syndrome (such as 2-3 toe syndactyly and microcephaly)
  - Absence of massive cholestanol and 25-hydroxylated bile alcohol glucuronide accumulation characteristic of CYP27A1 deficiency
  disease_term:
    preferred_term: Smith-Lemli-Opitz syndrome
    term:
      id: MONDO:0010035
      label: Smith-Lemli-Opitz syndrome
  evidence:
  - reference: DOI:10.3389/fneur.2022.1049850
    reference_title: "Cerebrotendinous Xanthomatosis: A practice review of pathophysiology, diagnosis, and treatment"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Regarding diﬀerential diagnoses, sitosterolemia, familial hypercholesterolemia (both of which can also manifest with tendon xanthomas), Smith-Lemli-Opitz syndrome (characterized by elevated 7-dehydrocholesterol, which may also be present in some CTX patients), other inborn errors of bile acid metabolism (such as HSP type 5A), and non-speciﬁc liver disease are among the disorders with features similar to CTX"
    explanation: Practice review notes biochemical overlap in elevated 7-dehydrocholesterol between CTX and Smith-Lemli-Opitz syndrome.
- name: Alagille syndrome
  description: >
    Pediatric cholestatic syndrome that enters the differential diagnosis when
    CTX presents in infancy with neonatal cholestasis or childhood onset.
  distinguishing_features:
  - Bile alcohol glucuronide elevation with low/normal gamma-glutamyl transferase and biallelic CYP27A1 variants in neonatal CTX versus JAG1/NOTCH2-associated bile duct paucity and syndromic features in Alagille syndrome
  disease_term:
    preferred_term: Alagille syndrome
    term:
      id: MONDO:0007318
      label: Alagille syndrome
  evidence:
  - reference: DOI:10.3389/fneur.2022.1049850
    reference_title: "Cerebrotendinous Xanthomatosis: A practice review of pathophysiology, diagnosis, and treatment"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Congenital diarrhea and Alagille syndrome are important diﬀerential diagnoses in childhood onset, as well as other causes of neonatal jaundice."
    explanation: Practice review identifies Alagille syndrome as an important differential diagnosis in childhood-onset and neonatal cholestatic presentations of CTX.
treatments:
- name: Chenodeoxycholic acid
  description: >
    Long-term chenodeoxycholic acid is targeted replacement/suppression therapy
    that normalizes cholestanol biochemistry and is most neurologically
    protective when started before advanced neurologic damage.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: chenodeoxycholic acid
      term:
        id: CHEBI:16755
        label: chenodeoxycholic acid
  target_mechanisms:
  - target: Chenodeoxycholic acid deficiency and disinhibited bile acid precursor synthesis
    treatment_effect: RESTORES
    description: CDCA restores bile-acid feedback and normalizes excessive precursor synthesis.
    evidence:
    - reference: PMID:20494109
      reference_title: "Cerebrotendinous xanthomatosis: an inborn error in bile acid synthesis with defined mutations but still a challenge."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "The activity of cholesterol 7alpha-hydroxylase is normalized by treatment with bile acids."
      explanation: Review supports bile-acid therapy as feedback correction of the upstream metabolic defect.
    - reference: DOI:10.1186/s13023-023-02666-w
      reference_title: "Chenodeoxycholic acid rescues axonal degeneration in induced pluripotent stem cell-derived neurons from spastic paraplegia type 5 and cerebrotendinous xanthomatosis patients"
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "the bile acid chenodeoxycholic acid (CDCA) effectively mitigated the biochemical alterations and rescued axonal degeneration in patient iPSC-derived neurons."
      explanation: Patient-derived neuronal model supports CDCA mitigation of CTX-relevant biochemical and axonal abnormalities.
  - target: Cholestanol and bile alcohol accumulation
    treatment_effect: INHIBITS
    description: CDCA suppresses the accumulated cholestanol biochemical signature downstream of CYP27A1 deficiency.
    evidence:
    - reference: PMID:20301583
      reference_title: "Cerebrotendinous Xanthomatosis."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Long-term treatment with chenodeoxycholic acid (CDCA) normalizes plasma and cerebrospinal fluid concentration of cholestanol"
      explanation: GeneReviews supports CDCA lowering the accumulated cholestanol marker.
  - target: CTX neuronal axonopathy
    treatment_effect: MODULATES
    description: CDCA mitigates CTX-relevant biochemical abnormalities and axonal degeneration in patient-derived neurons.
    evidence:
    - reference: DOI:10.1186/s13023-023-02666-w
      reference_title: "Chenodeoxycholic acid rescues axonal degeneration in induced pluripotent stem cell-derived neurons from spastic paraplegia type 5 and cerebrotendinous xanthomatosis patients"
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "the bile acid chenodeoxycholic acid (CDCA) effectively mitigated the biochemical alterations and rescued axonal degeneration in patient iPSC-derived neurons."
      explanation: Patient-derived neuronal model supports CDCA rescue of axonal degeneration.
  evidence:
  - reference: PMID:20301583
    reference_title: "Cerebrotendinous Xanthomatosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Long-term treatment with chenodeoxycholic acid (CDCA) normalizes plasma and cerebrospinal fluid concentration of cholestanol"
    explanation: GeneReviews supports CDCA as targeted therapy that normalizes cholestanol.
  - reference: PMID:23673909
    reference_title: "Neurological outcome in cerebrotendinous xanthomatosis treated with chenodeoxycholic acid: early versus late diagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "preventing neurological damage and deterioration in CTX."
    explanation: Long-term cohort supports early CDCA therapy to prevent neurologic damage.
- name: Cholic acid
  description: Cholic acid is an alternative bile-acid therapy reported to lower cholestanol and improve neurologic symptoms in limited experience.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:

- name: 7alpha-hydroxy-4-cholesten-3-one (7alpha-C4)
  presence: Elevated
  context: >
    Circulating 7alpha-hydroxylated bile acid intermediate produced downstream of
    disinhibited CYP7A1 that crosses the blood-brain barrier and serves as the
    major precursor for CNS cholestanol synthesis as well as a sensitive dynamic
    biomarker of CYP7A1 suppression during bile-acid replacement therapy.
  readouts:
  - target: Chenodeoxycholic acid deficiency and disinhibited bile acid precursor synthesis
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: Markedly elevated 7alpha-hydroxy-4-cholesten-3-one directly reflects uninhibited CYP7A1-mediated 7alpha-hydroxylated bile-acid precursor synthesis.
    evidence:
    - reference: PMID:20494109
      reference_title: "Cerebrotendinous xanthomatosis: an inborn error in bile acid synthesis with defined mutations but still a challenge."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "This leads to a marked accumulation of 7alpha-hydroxylated bile acid precursors, in particular 7alpha-hydroxy-4-cholesten-3-one."
      explanation: Review identifies 7alpha-hydroxy-4-cholesten-3-one as the principal accumulated 7alpha-hydroxylated bile acid precursor in CTX.
  evidence:
  - reference: PMID:20494109
    reference_title: "Cerebrotendinous xanthomatosis: an inborn error in bile acid synthesis with defined mutations but still a challenge."
    supports: SUPPORT

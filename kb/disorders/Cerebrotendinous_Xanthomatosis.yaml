experimental_models:
- name: CTX patient iPSC-derived cortical projection neurons
  experimental_model_type: IPSC_DERIVED_MODEL
  tissue_term:
    preferred_term: cerebral cortex
    term:
      id: UBERON:0000956
      label: cerebral cortex
  cell_types:
  - preferred_term: cortical projection neuron
    term:
      id: CL:0010012
      label: cerebral cortex neuron
  description: >
    Human induced pluripotent stem cell-derived cortical projection neurons
    generated from CTX patients with biallelic CYP27A1 mutations exhibit
    significantly reduced 27-hydroxycholesterol, neuronal cholesterol
    accumulation, increased axonal swellings, and axonal degeneration that are
    rescued by chenodeoxycholic acid treatment.
  modeled_mechanisms:
  - target: CYP27A1 sterol 27-hydroxylase deficiency
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    limitations: >
      Monoculture iPSC-derived cortical projection neurons capture
      cell-autonomous neuronal CYP27A1 loss and impaired 27-hydroxycholesterol
      synthesis, but omit hepatic bile-acid synthesis, enterohepatic FXR-FGF19
      feedback, and systemic blood-brain barrier flux of
      7alpha-hydroxy-4-cholesten-3-one.
    divergences:
    - divergence_type: BOUNDARY_OMISSION
      materiality: QUALIFYING
      description: >
        In vitro neuronal monoculture omits systemic hepatic CYP7A1
        upregulation and blood-brain barrier transport of circulating
        7alpha-hydroxy-4-cholesten-3-one that drive bulk CNS cholestanol
        accumulation in vivo.
    description: Models impaired neuronal cholesterol oxidation and significantly reduced 27-hydroxycholesterol levels.
    evidence:
    - reference: DOI:10.1186/s13023-023-02666-w
      reference_title: "Chenodeoxycholic acid rescues axonal degeneration in induced pluripotent stem cell-derived neurons from spastic paraplegia type 5 and cerebrotendinous xanthomatosis patients"
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Moreover, because of impaired oxidation of cholesterol, 27-OHC levels in CTX neurons were significantly reduced"
      explanation: Patient iPSC-derived cortical projection neurons recapitulate significantly reduced 27-OHC levels due to impaired cholesterol oxidation.
  - target: CTX neuronal axonopathy
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    limitations: >
      Monoculture iPSC-derived cortical projection neurons model intrinsic
      axonal swellings and chenodeoxycholic acid rescue in long-term culture,
      but omit oligodendrocyte myelination, neurovascular blood-brain barrier
      sterol transport, and non-neuronal CNS microenvironmental interactions.
    divergences:
    - divergence_type: BOUNDARY_OMISSION
      materiality: QUALIFYING
      description: >
        In vitro cortical projection neuron culture lacks oligodendrocytes,
        myelin sheaths, and blood-brain barrier sterol exchange present in
        human CNS white-matter tracts.
    description: Models increased axonal swellings and progressive axonal impairments in long-term cortical projection neuron cultures, rescued by chenodeoxycholic acid.
    evidence:
    - reference: DOI:10.1186/s13023-023-02666-w
      reference_title: "Chenodeoxycholic acid rescues axonal degeneration in induced pluripotent stem cell-derived neurons from spastic paraplegia type 5 and cerebrotendinous xanthomatosis patients"
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Thus, CTX cortical PNs exhibit axonal impairments, as indicated by accumulation of axonal swellings in long-term cultures."
      explanation: Patient iPSC-derived cortical projection neurons model CTX axonal impairments and accumulation of axonal swellings.
  notes: >
    Demonstrates human cell-autonomous neuronal sterol dysregulation,
    axonopathy, and response to chenodeoxycholic acid in cortical projection
    neurons, complementing Cyp27a1-/- mice while remaining bounded to a
    cellular monoculture system.
  evidence:
  - reference: DOI:10.1186/s13023-023-02666-w
    reference_title: "Chenodeoxycholic acid rescues axonal degeneration in induced pluripotent stem cell-derived neurons from spastic paraplegia type 5 and cerebrotendinous xanthomatosis patients"
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the bile acid chenodeoxycholic acid (CDCA) effectively mitigated the biochemical alterations and rescued axonal degeneration in patient iPSC-derived neurons."
    explanation: Demonstrates predictive therapeutic validity of CTX patient iPSC-derived cortical neurons treated with CDCA.
notes: >
  This curation uses ORPHA:909 as the direct disease mapping. The mechanism is
  centered on biallelic CYP27A1 pathogenic variants, mitochondrial sterol
  27-hydroxylase deficiency, impaired primary bile-acid (CDCA) synthesis and
  loss of FXR-FGF19 negative feedback on CYP7A1, accumulation of
  7alpha-hydroxy-4-cholesten-3-one (7alpha-C4), cholestanol, and 25-hydroxylated
  bile alcohols, tissue sterol deposition, and progressive systemic and
  neurologic disease across classical, spinal xanthomatosis, and
  non-neurological subtypes. Chenodeoxycholic acid is modeled as targeted
  replacement and suppression therapy because it restores negative feedback on
  CYP7A1, normalizes cholestanol and bile alcohol biochemistry, rescues axonal
  degeneration in patient iPSC-derived cortical projection neurons, and prevents
  neurologic deterioration when started before irreversible white-matter and
  axonal injury.

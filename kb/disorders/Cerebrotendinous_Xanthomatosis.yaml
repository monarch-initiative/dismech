      by mitochondrial sterol 27-hydroxylase (CYP27A1) deficiency.
has_subtypes:
- name: Classical cerebrotendinous xanthomatosis
  description: >
    Multisystem presentation progressing from infantile-onset chronic diarrhea
    or neonatal cholestasis and childhood juvenile cataracts to adolescent or
    adult tendon xanthomas and progressive cerebellar, pyramidal, extrapyramidal,
    cognitive, and peripheral neurologic dysfunction.
  evidence:
  - reference: DOI:10.3389/fneur.2022.1049850
    reference_title: "Cerebrotendinous Xanthomatosis: A practice review of pathophysiology, diagnosis, and treatment"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Their accumulation mainly in the brain, eye lenses and tendons cause progressive neurologic dysfunction, cataract and xanthomas, respectively, which are some of the classic clinical manifestations of the disease."
    explanation: Practice review describes the classic clinical manifestations of CTX across brain, eye lenses, and tendons.
- name: Spinal xanthomatosis
  description: >
    Spinal cord-predominant neurological variant affecting the corticospinal and
    dorsal column tracts (mean neurological symptom onset around 24 years), most
    commonly presenting with a complex hereditary spastic paraplegia (HSP)
    phenotype complicated by dementia, ataxia, polyneuropathy, seizures, or
    psychiatric disease, and less often as isolated spastic paraplegia (23.5%);
    cataracts (78%) and chronic diarrhea (65%) remain frequent, whereas tendon
    xanthomas are present in 31% of cases.
  evidence:
  - reference: DOI:10.3389/fneur.2022.1049850
    reference_title: "Cerebrotendinous Xanthomatosis: A practice review of pathophysiology, diagnosis, and treatment"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "cases of spinal xanthomatosis, characterized sometimes as pure forms of spastic paraparesis, have been reported in the literature"
    explanation: Practice review notes that spinal xanthomatosis can sometimes present as pure spastic paraparesis.
  - reference: DOI:10.3389/fneur.2022.1049850
    reference_title: "Cerebrotendinous Xanthomatosis: A practice review of pathophysiology, diagnosis, and treatment"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "A recent literature review on spinal xanthomatosis, reviewed 34 cases, reporting a mean age of onset of the neurological symptoms of 24 years, with most cases presenting with complex hereditary spastic paraplegia (HSP) phenotype, presenting dementia, ataxia, polyneuropathy,"
    explanation: Practice review summarizes 34 spinal xanthomatosis cases with mean neurological onset at 24 years and predominance of a complex HSP phenotype.
  - reference: DOI:10.3389/fneur.2022.1049850
    reference_title: "Cerebrotendinous Xanthomatosis: A practice review of pathophysiology, diagnosis, and treatment"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "seizures, and psychiatric disease as the complicating feature. Interestingly, 23.5% reported patients had spastic paraplegia as the sole neurological phenotype and only 31% of patients with spinal xanthomatosis presented xanthomas. On the other hand, cataracts and chronic diarrhea were frequent features being present in 78 and 65% of cases, respectively"
    explanation: Continuation of the 34-case spinal xanthomatosis review summary detailing complicating features, isolated spastic paraplegia frequency (23.5%), xanthoma frequency (31%), cataracts (78%), and chronic diarrhea (65%).
- name: Non-neurological cerebrotendinous xanthomatosis
  description: >
    Clinical presentation restricted to marked multisystemic involvement (such
    as tendon xanthomas or cataracts) with no clinical or neuroimaging evidence
    of neurological compromise.
  evidence:
  - reference: DOI:10.3389/fneur.2022.1049850
    reference_title: "Cerebrotendinous Xanthomatosis: A practice review of pathophysiology, diagnosis, and treatment"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "“Non-neurological” CTX: phenotype associated with marked multisystemic involvement and no clinical or neuroimaging evidence of neurological compromise ."
    explanation: Practice review defines the non-neurological CTX clinical subtype.

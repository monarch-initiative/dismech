- name: Inner Dynein Arm Loss in Respiratory Cilia
  description: >-
    In one PCD patient whose respiratory cilia lacked inner dynein arms and
    moved abnormally, DNAH7 was made in the cell but missing from the cilia.
    That patient was not genotyped, so the lesion may have been in another
    gene. The only patient with biallelic DNAH7 variants whose airway cilia
    were examined, a man homozygous for a frameshift, had normal ciliary
    ultrastructure on electron microscopy. An inner-arm defect in airway
    cilia is therefore expected from DNAH7's location but has not been shown
    in a genotyped CILD50 patient.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: Respiratory tract multiciliated cell
    term:
      id: CL:4030034
      label: respiratory tract multiciliated cell

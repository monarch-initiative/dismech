    reference_title: "Identification of dynein heavy chain 7 as an inner arm component of human cilia that is synthesized but not assembled in a case of primary ciliary dyskinesia."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "In cilia from PCD cells, DNAH7 was undetectable, whereas intracellular DNAH7 was clearly present."
    explanation: DNAH7 absent from the cilia of a PCD patient lacking inner arms; the patient's genotype was not determined.
  - reference: PMID:31443223
    reference_title: "Clinical and Genetic Analysis of Children with Kartagener Syndrome."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "It was found to be missing in a patient with PCD who had an absence of IDA and displayed abnormal cilia motility, but with normal ODA"
    explanation: Records that the 2002 patient's cilia moved abnormally as well as lacking inner arms.
  - reference: PMID:37998386
    reference_title: "Ciliary Ultrastructure Assessed by Transmission Electron Microscopy in Adults with Bronchiectasis and Suspected Primary Ciliary Dyskinesia but Inconclusive Genotype."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "In addition, we observed normal ciliary ultrastructure in patients with variants in the PCD candidate genes DNAH1 (n = 2) and DNAH7 (n = 1; Figure 4)."
    explanation: >-
      Electron microscopy of nasal brush biopsies from a man homozygous for a
      DNAH7 frameshift showed no inner-arm loss. It does not exclude a
      functional inner-arm defect, but it is the only direct look at airway
      cilia in a genotyped patient, and it found no structural defect.
- name: Impaired Mucociliary Clearance
  description: >-
    If respiratory inner arms fail, mucus clearance from the airways falls,
    as in other PCD forms, leading to chronic sinus and bronchial infection
    and bronchiectasis. Clearance has not been measured in a CILD50 patient,
    and the airway phenotypes below rest on very few patients, so this
    step is inferred from the general PCD mechanism.

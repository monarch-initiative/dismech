differential_diagnoses:
- name: Primary ciliary dyskinesia 14 (CCDC39-related axonemal ruler defect)
  disease_term:
    preferred_term: primary ciliary dyskinesia 14
    term:
      id: MONDO:0013434
      label: primary ciliary dyskinesia 14
  description: >-
    Axonemal ruler defects caused by CCDC39 or CCDC40 also remove DNAH7 from
    respiratory cilia, so absent DNAH7 staining in a ciliary biopsy does not
    by itself point to DNAH7.
  distinguishing_features:
  - >-
    CCDC39/40 disease causes axonemal disorganization and loss of several
    inner-arm heavy chains (DNAH1, DNAH6, DNAH7) together with typical PCD
    airway disease. In CILD50 inner-arm loss has been shown only in sperm,
    and the one examined airway sample had normal ultrastructure.
  evidence:
  - reference: PMID:39056782
    reference_title: "Primary Ciliary Dyskinesia Associated Disease-Causing Variants in CCDC39 and CCDC40 Cause Axonemal Absence of Inner Dynein Arm Heavy Chains DNAH1, DNAH6, and DNAH7."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "demonstrated that the IDA heavy chains DNAH1, DNAH6, and DNAH7 are conspicuously absent within the respiratory ciliary axonemes by immunofluorescence analyses"
    explanation: Secondary DNAH7 loss in CCDC39/40 PCD.
treatments:
- name: Intracytoplasmic Sperm Injection
  description: >-
    ICSI bypasses the motility defect. Patients in all three sperm genetic reports
    fathered children or achieved pregnancies through ICSI.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Intracytoplasmic Sperm Injection
    term:
      id: NCIT:C185482
      label: Intracytoplasmic Sperm Injection
  target_mechanisms:
  - target: Inner Dynein Arm Loss in the Sperm Flagellum
    description: Direct injection makes flagellar motility irrelevant to fertilization.
    evidence:
    - reference: PMID:40810911
      reference_title: "Biallelic loss-of-function variants of DNAH7 cause male infertility associated with asthenozoospermia in humans."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "the infertility of the patients harboring DNAH7 mutations could be successfully overcome by intracytoplasmic sperm injection treatment"
      explanation: ICSI success in patients with truncating variants.
  evidence:
  - reference: PMID:34476482
    reference_title: "Bi-allelic mutations in DNAH7 cause asthenozoospermia by impairing the integrality of axoneme structure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "these patients were able to have their children via intra-cytoplasmic sperm injection treatment"
    explanation: ICSI success in patients with missense variants.
  - reference: PMID:35543642
    reference_title: "Loss of function mutation in DNAH7 induces male infertility associated with abnormalities of the sperm flagella and mitochondria in human."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Live birth was achieved via intracytoplasmic sperm injection."
    explanation: ICSI success in the patient with MMAF.
- name: Airway Clearance and Chronic Infection Management
  description: >-
    There is no treatment for the ciliary defect. Patients with airway
    disease receive the supportive care used across primary ciliary
    dyskinesia: airway clearance, prompt treatment of infections, and
    surveillance of lung function. Nothing in it is DNAH7-specific.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Impaired Mucociliary Clearance
    description: >-
      Airway clearance techniques substitute mechanically for the mucus
      transport the cilia cannot provide, and antibiotics treat the
      infections that follow. Neither restores ciliary function.
  evidence:
  - reference: PMID:38891105
    reference_title: "Primary Ciliary Dyskinesia: A Clinical Review."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Though there are no PCD-specific approved therapies that restore ciliary function, routine airway clearance and aggressive management of infections are important to preserve lung health and minimize complications"
    explanation: >-
      Review statement of standard PCD airway management. It covers PCD in
      general and is not specific to DNAH7.

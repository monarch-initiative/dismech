genetic:
- name: DNAH7
  association: Causal
  gene_term:
    preferred_term: DNAH7
    term:
      id: hgnc:18661
      label: DNAH7
  notes: >-
    Reported genotypes: biallelic missense variants in three of 85 Chinese
    men with asthenozoospermia (PMID:34476482), and compound heterozygous
    truncating variants in two men, c.9702_9705del (p.Phe3234Leufs*52) with
    c.768G>A (p.Trp256*), and c.5650C>T (p.Arg1884*) with c.768G>A
    (PMID:40810911). The shared p.Trp256* allele in two unrelated men may be
    recurrent. A Portuguese child with Kartagener syndrome carried two DNAH7
    missense variants together with two truncating DNAH5 variants
    (PMID:31443223); the authors consider DNAH5 the main cause, so this case
    does not establish DNAH7 as a respiratory PCD gene.
  evidence:
  - reference: PMID:34476482
    reference_title: "Bi-allelic mutations in DNAH7 cause asthenozoospermia by impairing the integrality of axoneme structure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our study is the first to demonstrate that bi-allelic mutations in DNAH7 may impair the integrality of axoneme structure, affect sperm motility, and cause asthenozoospermia in humans."
    explanation: First human genetic report for DNAH7.
  - reference: PMID:40810911
    reference_title: "Biallelic loss-of-function variants of DNAH7 cause male infertility associated with asthenozoospermia in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "our findings confirmed that DNAH7 variants may contribute to asthenozoospermia by affecting flagellar IDA assembly"
    explanation: Independent replication with truncating alleles.
  - reference: PMID:31443223
    reference_title: "Clinical and Genetic Analysis of Children with Kartagener Syndrome."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "The variants in gene DNAH5 are potentially more damaging and are, thus, expected to be the major factor responsible for Patient-2 phenotype. Nevertheless, DNAH7 may have an accumulative effect, leading to the complete loss of both DAs."
    explanation: >-
      The only Kartagener patient with DNAH7 variants also had DNAH5
      variants the authors judged more damaging, so the case is weak support
      for a respiratory DNAH7 phenotype. The authors still propose an
      additive DNAH7 contribution.
  - reference: CGGV:assertion_90a097d6-5127-4466-8c81-00e99dab2696-2025-02-13T170000.000Z
    reference_title: "DNAH7 / primary ciliary dyskinesia (Limited)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "DNAH7 | HGNC:18661 | primary ciliary dyskinesia | MONDO:0016575 | AR | Limited"
    explanation: >-
      ClinGen rates DNAH7 as Limited for primary ciliary dyskinesia in
      general. The assertion is for MONDO:0016575, not this numbered entity,
      so it is quoted here rather than recorded as gene_disease_validity.
diagnosis:
- name: Exome Sequencing in Asthenozoospermia
  description: >-
    All reported patients were found by exome sequencing of infertile men
    with asthenozoospermia, supported by sperm electron microscopy showing
    inner-arm loss and immunostaining showing missing DNAH7.
  diagnosis_term:
    preferred_term: Whole exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:34476482
    reference_title: "Bi-allelic mutations in DNAH7 cause asthenozoospermia by impairing the integrality of axoneme structure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "identified bi-allelic mutations in DNAH7 (NM_018897.3) from three patients using whole-exome sequencing"
    explanation: Diagnostic route in the founding report.
differential_diagnoses:
- name: Primary ciliary dyskinesia 14 (CCDC39-related axonemal ruler defect)
  disease_term:
    preferred_term: primary ciliary dyskinesia 14
    term:
      id: MONDO:0013434
      label: primary ciliary dyskinesia 14
  description: >-
    Axonemal ruler defects caused by CCDC39 or CCDC40 also remove DNAH7 from
    respiratory cilia, so absent DNAH7 staining in a ciliary biopsy does not
    by itself point to DNAH7.
  distinguishing_features:
  - >-
    CCDC39/40 disease causes axonemal disorganization and loss of several
    inner-arm heavy chains (DNAH1, DNAH6, DNAH7) together with typical PCD
    airway disease. In CILD50 only the inner arms are reported missing, and
    only in sperm.
  evidence:
  - reference: PMID:39056782
    reference_title: "Primary Ciliary Dyskinesia Associated Disease-Causing Variants in CCDC39 and CCDC40 Cause Axonemal Absence of Inner Dynein Arm Heavy Chains DNAH1, DNAH6, and DNAH7."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "demonstrated that the IDA heavy chains DNAH1, DNAH6, and DNAH7 are conspicuously absent within the respiratory ciliary axonemes by immunofluorescence analyses"
    explanation: Secondary DNAH7 loss in CCDC39/40 PCD.
treatments:
- name: Intracytoplasmic Sperm Injection
  description: >-
    ICSI bypasses the motility defect. Patients in both genetic reports
    fathered children or achieved pregnancies through ICSI.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Intracytoplasmic Sperm Injection
    term:
      id: NCIT:C185482
      label: Intracytoplasmic Sperm Injection
  target_mechanisms:
  - target: Inner Dynein Arm Loss in the Sperm Flagellum
    description: Direct injection makes flagellar motility irrelevant to fertilization.
    evidence:
    - reference: PMID:40810911
      reference_title: "Biallelic loss-of-function variants of DNAH7 cause male infertility associated with asthenozoospermia in humans."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "the infertility of the patients harboring DNAH7 mutations could be successfully overcome by intracytoplasmic sperm injection treatment"
      explanation: ICSI success in patients with truncating variants.
  evidence:
  - reference: PMID:34476482
    reference_title: "Bi-allelic mutations in DNAH7 cause asthenozoospermia by impairing the integrality of axoneme structure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "these patients were able to have their children via intra-cytoplasmic sperm injection treatment"
    explanation: ICSI success in patients with missense variants.

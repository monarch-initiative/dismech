name: Primary Ciliary Dyskinesia 50
creation_date: "2026-10-14T00:00:00Z"
category: Mendelian
synonyms:
- CILD50
- ciliary dyskinesia, primary, 50
- DNAH7-related primary ciliary dyskinesia
description: >-
  Primary ciliary dyskinesia 50 (CILD50) is the autosomal recessive disorder
  attributed to biallelic variants in DNAH7, which encodes an axonemal inner
  dynein arm heavy chain. In human respiratory cilia DNAH7 is the heavy chain
  of the single-headed inner arms IDAb and IDAe and runs along the whole
  axoneme. It was first identified in 2002 as the protein missing from the
  cilia of a PCD patient whose cilia lacked inner dynein arms; that patient's
  DNAH7 was made in the cell but not built into the cilium, and the gene was
  not sequenced.

  The human genetic evidence is about sperm, not airways. Two Chinese studies
  found biallelic DNAH7 variants in five infertile men with
  asthenozoospermia: three with missense variants among 85 men screened, and
  two with compound heterozygous truncating variants. In both studies sperm
  flagella lacked inner dynein arms and DNAH7 protein. In the truncating
  cases, the inner-arm heavy chains DNAH3 and DNAH6 were also reduced, while
  outer-arm proteins were normal. ICSI gave pregnancies. Neither cached
  abstract reports airway disease or laterality defects, and no patient with
  genetically confirmed CILD50 has had respiratory cilia examined. A
  Portuguese child with Kartagener syndrome carried DNAH7 missense variants,
  but also two truncating DNAH5 variants that are the more likely cause.

  So CILD50 is named as primary ciliary dyskinesia mainly from DNAH7's place
  in respiratory cilia and the 2002 biochemical case. The established human
  phenotype is male infertility from an inner-arm sperm defect. ClinGen rates
  DNAH7 as Limited for primary ciliary dyskinesia.
parents:
- Primary Ciliary Dyskinesia
- Ciliopathy
notes: >-
  MONDO (MONDO:0957252, OMIM 620356 cross-reference) names this entity as a
  form of primary ciliary dyskinesia. The deep-research report quotes the
  Disease Ontology definition (DOID:0070763, via ZFIN) as listing chronic
  sinusitis and bronchitis, which was not checked against OMIM. Neither
  cached abstract of the human DNAH7 genetic studies (PMID:34476482,
  PMID:40810911) mentions respiratory symptoms. Respiratory phenotypes are therefore not recorded. The umbrella
  Primary_Ciliary_Dyskinesia entry lists CILD50 as a has_subtypes row. ClinGen
  classified DNAH7 against primary ciliary dyskinesia (MONDO:0016575), not
  this numbered entity, so no gene_disease_validity assertion is recorded on
  the genetic row; the ClinGen row is quoted as evidence instead. No
  GeneReviews chapter covers CILD50 specifically (just check-genereviews).
  No Dnah7 animal model was found in the cached literature.

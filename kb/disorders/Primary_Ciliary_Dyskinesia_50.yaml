name: Primary Ciliary Dyskinesia 50
creation_date: "2026-10-14T00:00:00Z"
category: Mendelian
synonyms:
- CILD50
- ciliary dyskinesia, primary, 50
- DNAH7-related primary ciliary dyskinesia
description: >-
  Primary ciliary dyskinesia 50 (CILD50) is the autosomal recessive disorder
  attributed to biallelic variants in DNAH7, which encodes an axonemal inner
  dynein arm heavy chain. In human respiratory cilia DNAH7 is the heavy chain
  of the single-headed inner arms IDAb and IDAe and runs along the whole
  axoneme. It was first identified in 2002 as the protein missing from the
  cilia of a PCD patient whose cilia lacked inner dynein arms; that patient's
  DNAH7 was made in the cell but not built into the cilium, and the gene was
  not sequenced.

  Most of the human genetic evidence comes from sperm. Three Chinese
  studies found biallelic DNAH7 variants in six infertile men with
  asthenozoospermia: three with missense variants among 85 men screened, one
  with a loss-of-function variant and multiple morphological abnormalities
  of the sperm flagella (MMAF), and two with compound heterozygous
  truncating variants. Sperm flagella lacked inner dynein arms and DNAH7
  protein. In the truncating cases, the inner-arm heavy chains DNAH3 and
  DNAH6 were also reduced, while outer-arm proteins were normal. ICSI gave
  pregnancies and live births.

  The airway evidence is thinner. OMIM and the ClinGen curation describe
  chronic sinusitis and chronic bronchitis as features of CILD50, attributed
  to the 2021 patients, but the abstract of that report does not mention
  them. The one genotyped patient with documented airway disease is a
  51-year-old Turkish man, homozygous for a DNAH7 frameshift, with
  bronchiectasis, early-onset chronic wet cough, chronic rhinosinusitis with
  nasal polyps and Pseudomonas aeruginosa infection. His nasal nitric oxide
  was above the diagnostic threshold, his ciliary ultrastructure on
  electron microscopy was normal, and he was classified as possible PCD. A
  Portuguese child with Kartagener syndrome carried DNAH7 missense variants,
  but also two truncating DNAH5 variants that are the more likely cause. No
  laterality defect has been reported with DNAH7 variants alone.

  CILD50 is therefore named as primary ciliary dyskinesia from DNAH7's place
  in respiratory cilia, the 2002 biochemical case, and a small number of
  patients with airway disease. The best established human phenotype is
  male infertility from an inner-arm sperm defect. ClinGen rates DNAH7 as
  Limited for primary ciliary dyskinesia.
disease_term:
  preferred_term: 'ciliary dyskinesia, primary, 50'
  term:
    id: MONDO:0957252
    label: 'ciliary dyskinesia, primary, 50'
parents:
- Primary Ciliary Dyskinesia
- Ciliopathy
notes: >-
  MONDO (MONDO:0957252, OMIM 620356 cross-reference) names this entity as a
  form of primary ciliary dyskinesia. The OMIM definition, as reproduced by
  NCBI MedGen (C5830473), reads "Primary ciliary dyskinesia-50 (CILD50) is
  characterized by chronic sinusitis and bronchitis as well as male
  infertility", citing Wei et al. 2021 (PMID:34476482) and Gao et al. 2022
  (PMID:35543642). OMIM has no fetcher in this repository, so it is not
  cited as evidence. The PMID:34476482 full text is not in PubMed Central
  and the publisher copy is not open access; its cached record is the
  abstract only, which reports no airway symptoms, so the clinical details
  of those three men cannot be quoted here. The chronic sinusitis and
  chronic bronchitis phenotypes are instead sourced from the ClinGen
  evidence summary and from the one patient with tabulated clinical detail
  (PMID:37998386), and should be read as reported in very few patients. The
  umbrella
  Primary_Ciliary_Dyskinesia entry lists CILD50 as a has_subtypes row. ClinGen
  classified DNAH7 against primary ciliary dyskinesia (MONDO:0016575), not
  this numbered entity, so no gene_disease_validity assertion is recorded on
  the genetic row; the ClinGen row is quoted as evidence instead. No
  GeneReviews chapter covers CILD50 specifically (just check-genereviews).
  No Dnah7 animal model was found in the cached literature.

epidemiology:
- name: Martha's Vineyard primary pneumonic outbreaks
  description: >-
    Primary pneumonic tularemia is rare in the United States, but Martha's
    Vineyard had recognized outbreaks in 1978 and 2000, and the 2000 outbreak
    case-control study implicated lawn mowing and brush cutting as
    aerosol-generating risk factors.
  evidence:
  - reference: PMID:11757506
    reference_title: An outbreak of primary pneumonic tularemia on Martha's Vineyard.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The only previously reported outbreak of pneumonic tularemia in the
      United States also occurred on the island in 1978.
    explanation: >-
      Places the 2000 Martha's Vineyard outbreak in context as the second
      recognized U.S. outbreak of primary pneumonic tularemia.
- name: High-mortality pulmonary form
  description: >-
    Pneumonic tularemia has the highest mortality among tularemia clinical
    forms, with untreated tularemia carrying roughly 30% mortality in modern
    review summaries.
  evidence:
  - reference: PMID:38461051
    reference_title: Current vaccine strategies and novel approaches to combatting Francisella infection.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Tularemia is caused by subspecies of Francisella tularensis and can
      manifest in a variety of disease states, with the pneumonic presentation
      resulting in the greatest mortality.
    explanation: >-
      The vaccine review identifies pneumonic tularemia as the highest-mortality
      disease state.
  - reference: PMID:42641375
    reference_title: "Tularemia: a re-emerging zoonosis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Tularemia is classified as a Category A bioterrorism agent by the CDC due
      to its extraordinary virulence; as few as 10 bacterial cells can establish
      infection, and untreated cases carry 30% mortality.
    explanation: >-
      Recent review synthesis ties Francisella's high virulence to the
      approximately 30% untreated mortality figure.

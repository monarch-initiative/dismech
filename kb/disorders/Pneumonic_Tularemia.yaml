diagnosis:
- name: Tularemia Laboratory Diagnosis
  description: >-
    Tularemia diagnosis relies principally on serology, with PCR and culture
    used for direct pathogen detection when available and safe.
  diagnosis_term:
    preferred_term: laboratory procedure
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  evidence:
  - reference: PMID:20220165
    reference_title: Evaluation of an immunochromatographic test for rapid and reliable serodiagnosis of human tularemia and detection of Francisella tularensis-specific antibodies in sera from different mammalian species.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Serology is still considered to be a cornerstone in tularemia diagnosis
      due to the low sensitivity of bacterial culture and the lack of
      standardization in PCR methodology for the direct identification of the
      pathogen.
    explanation: >-
      Serodiagnostic test development summarizes why serology remains central
      while culture and PCR have sensitivity, biosafety, or standardization
      limitations.
treatments:
- name: Tularemia antibiotic therapy
  description: >-
    Aminoglycosides, fluoroquinolones, and tetracyclines are effective
    intracellularly active treatment classes for tularemia; streptomycin and
    gentamicin are historical treatments of choice, while ciprofloxacin and
    doxycycline are commonly used modern options.
  therapeutic_modality: SMALL_MOLECULE

name: Pneumonic Tularemia
creation_date: "2026-09-29T22:52:21Z"
description: >-
  Pneumonic tularemia is the inhalational and pulmonary form of Francisella
  tularensis infection in which aerosolized bacteria reach the lung, escape
  the macrophage phagosome into the cytosol, and trigger acute inflammatory
  pneumonia.
category: Infectious Disease
disease_term:
  preferred_term: pneumonic tularemia
  term:
    id: MONDO:0002212
    label: pneumonic tularemia
parents:
- Tularemia
synonyms:
- Pulmonary tularemia
notes: >-
  This entry is scoped to primary pneumonic tularemia after aerosol inhalation
  of Francisella tularensis. Other tularemia entries carry vector-borne,
  ulceroglandular, oculoglandular, or oropharyngeal portals when those routes
  drive the clinical form. Pneumonic tularemia is retained separately because
  it is the highest-mortality tularemia form and carries pulmonary diagnostic
  and treatment urgency after aerosol exposure.
review_notes: >-
  Deliberately lumped. F. tularensis type A, type B, and type A-east/A-west
  strain strata differ in virulence, geography, and typical severity, but this
  pneumonic-form entry is organized by inhalational route and lung disease
  rather than by agent subspecies.
infectious_agent:
- name: Francisella tularensis
  infectious_agent_term:
    preferred_term: Francisella tularensis
    term:
      id: NCBITaxon:263
      label: Francisella tularensis
  description: >-
    Intracellular Gram-negative coccobacillus that causes tularemia, including
    its inhalational pneumonic form.
  evidence:
  - reference: PMID:38294108
    reference_title: >-
      Systematic Review: Clinical Features, Antimicrobial Treatment, and
      Outcomes of Human Tularemia, 1993-2023.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Francisella tularensis, the causative agent of tularemia, is endemic
      throughout the Northern Hemisphere and requires as few as 10 organisms to
      cause disease
    explanation: >-
      Identifies F. tularensis as the causative agent of tularemia and
      supports the low infectious dose relevant to inhalational disease.
agent_life_cycle:
  description: >-
    Francisella tularensis persists in a broad zoonotic cycle involving
    lagomorphs, rodents, more than 250 animal species, arthropod vectors, and
    contaminated soil or water; humans are incidental clinical hosts exposed to
    infectious aerosols, infected animals, or contaminated environmental
    material.
  hosts:
  - preferred_term: Homo sapiens
    role: incidental clinical host
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  - preferred_term: lagomorphs
    role: animal source
    term:
      id: NCBITaxon:9975
      label: Lagomorpha
  - preferred_term: rodents
    role: animal source
    term:
      id: NCBITaxon:9989
      label: Rodentia
  vectors:
  - Lone star tick (Amblyomma americanum)
  - American dog tick (Dermacentor variabilis)
  - Mosquitoes (Culicidae)
  evidence:
  - reference: PMID:37941380
    reference_title: "Pathogenicity and virulence of Francisella tularensis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Hares or small rodents (voles, mice, rats, coypu, squirrels, etc.) are
      the primary sources of direct contamination, but over 250 animal species
      have been identified as carrying or being infected with F. tularensis
      [17].
    explanation: >-
      Supports the broad animal cycle that seeds environmental material able to
      aerosolize and cause pneumonic tularemia.
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
transmission:
- name: Inhalation of infectious aerosols
  description: >-
    Humans acquire pneumonic tularemia when they inhale aerosolized F.
    tularensis from contaminated animal or environmental material.
  evidence:
  - reference: PMID:37916743
    reference_title: "Tularemia - a re-emerging disease with growing concern."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Pulmonary form appears after inhalation of bacteria.
    explanation: >-
      Links inhalation of F. tularensis to pulmonary tularemia.
  - reference: PMID:11757506
    reference_title: An outbreak of primary pneumonic tularemia on Martha's Vineyard.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Study of this outbreak of primary pneumonic tularemia implicates lawn
      mowing and brush cutting as risk factors for this infection.
    explanation: >-
      The Martha's Vineyard outbreak tied aerosol-generating landscaping to
      primary pneumonic tularemia.
pathophysiology:
- name: Inhaled Francisella tularensis Exposure
  role: trigger
  description: >-
    Aerosolized F. tularensis is inhaled into the lung and seeds the pulmonary
    portal of entry that defines pneumonic tularemia.
  biological_scale: TISSUE
  locations:
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  downstream:
  - target: Macrophage Phagosomal Escape and Cytosolic Replication
    causal_link_type: DIRECT
    description: >-
      Inhaled F. tularensis enters pulmonary macrophages and establishes an
      intracellular cytosolic niche.
  evidence:
  - reference: PMID:37916743
    reference_title: "Tularemia - a re-emerging disease with growing concern."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Pulmonary form appears after inhalation of bacteria.
    explanation: >-
      Establishes inhaled bacteria as the route that produces the pulmonary
      form of tularemia.
- name: Macrophage Phagosomal Escape and Cytosolic Replication
  description: >-
    F. tularensis uses its Francisella Pathogenicity Island-encoded type VI
    secretion system to escape the macrophage phagosome and replicate in the
    cytosol.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: symbiont-mediated disruption of host phagosome
    term:
      id: GO:0141160
      label: symbiont-mediated disruption of host phagosome
  downstream:
  - target: Atypical Lipid A TLR4 Evasion
    causal_link_type: DIRECT
    description: >-
      Francisella surface lipid A weakly activates TLR4, delaying early innate
      recognition while cytosolic replication is established.
  - target: GBP-IRGB10 Francisella Bacteriolysis
    causal_link_type: DIRECT
    description: >-
      Replicating cytosolic Francisella can be attacked and lysed by
      interferon-inducible GBPs and IRGB10, releasing bacterial DNA for AIM2.
  evidence:
  - reference: PMID:37941380
    reference_title: "Pathogenicity and virulence of Francisella tularensis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The main virulence attribute of F. tularensis is the type 6 secretion
      system (T6SS) and its effectors that promote escape from the phagosome.
    explanation: >-
      Identifies T6SS-mediated phagosomal escape as the central Francisella
      virulence mechanism enabling cytosolic replication.
- name: Atypical Lipid A TLR4 Evasion
  description: >-
    Francisella produces an atypical lipid A that is poorly recognized by TLR4
    and cationic antimicrobial peptides, helping the bacterium blunt early
    innate recognition in the lung.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: negative regulation of toll-like receptor 4 signaling pathway
    modifier: INCREASED
    term:
      id: GO:0034144
      label: negative regulation of toll-like receptor 4 signaling pathway
  downstream:
  - target: Pulmonary Inflammation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Early TLR4 evasion allows higher pulmonary Francisella burden before the
      delayed inflammatory phase.
  evidence:
  - reference: PMID:28807561
    reference_title: Mass spectrometry analysis of intact Francisella bacteria identifies lipid A structure remodeling in response to acidic pH stress.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      It produces an atypical lipid A, whose structure precludes an efficient
      recognition by both innate immune players, TLR4 and cationic
      antimicrobial peptides.
    explanation: >-
      Mass-spectrometry work on Francisella lipid A states that the unusual
      lipid-A structure evades TLR4 and antimicrobial-peptide recognition.
- name: GBP-IRGB10 Francisella Bacteriolysis
  description: >-
    Interferon-inducible GBP2, GBP5, and IRGB10 attack cytosolic Francisella
    and liberate bacterial ligands that can be sensed by inflammasomes.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  downstream:
  - target: AIM2 Inflammasome Pyroptosis
    causal_link_type: DIRECT
    description: >-
      GBP- and IRGB10-mediated bacteriolysis releases bacterial DNA into the
      cytosol, exposing the AIM2 ligand.
  evidence:
  - reference: PMID:25774716
    reference_title: Guanylate-binding proteins promote activation of the AIM2 inflammasome during infection with Francisella novicida.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Mechanistically, these two GBPs targeted cytosolic F. novicida and
      promoted bacteriolysis.
    explanation: >-
      F. novicida experiments identify GBP2 and GBP5 as cytosolic
      Francisella-targeting proteins that lyse bacteria to enable sensing.
  - reference: PMID:27693356
    reference_title: IRGB10 Liberates Bacterial Ligands for Sensing by the AIM2 and Caspase-11-NLRP3 Inflammasomes.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      IRGB10 directly targeted cytoplasmic bacteria through a mechanism
      requiring guanylate-binding proteins. Localization of IRGB10 to the
      bacterial cell membrane compromised bacterial structural integrity and
      mediated cytosolic release of ligands for recognition by inflammasome
      sensors.
    explanation: >-
      The IRGB10 study independently places cytosolic Francisella bacteriolysis
      upstream of AIM2 DNA sensing.
- name: AIM2 Inflammasome Pyroptosis
  description: >-
    Cytosolic Francisella DNA activates AIM2/ASC inflammasomes, caspase-1,
    IL-1β and IL-18 release, and pyroptosis.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: AIM2 inflammasome complex assembly
    modifier: INCREASED
    term:
      id: GO:0140970
      label: AIM2 inflammasome complex assembly
  downstream:
  - target: Th1 IFN-gamma TNF-iNOS Control
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: IL-18 contributes to IFN-gamma-biased anti-Francisella immunity.
  - target: Pulmonary Inflammation
    causal_link_type: DIRECT
    description: >-
      AIM2/caspase-1 activation releases inflammatory IL-1-family cytokines
      and causes pyroptotic macrophage death in Francisella infection.
  evidence:
  - reference: PMID:21883803
    reference_title: Elevated AIM2-mediated pyroptosis triggered by hypercytotoxic Francisella mutant strains is attributed to increased intracellular bacteriolysis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      assembly of the AIM2 inflammasome complex is critical for caspase-1
      activation in response to Francisella infection.
    explanation: >-
      Francisella macrophage experiments demonstrate that AIM2/ASC inflammasome
      assembly activates caspase-1 after cytosolic bacterial DNA sensing.
- name: Th1 IFN-gamma TNF-iNOS Control
  description: >-
    IL-18, IL-12, T-bet-dependent CD4+ T cells, IFN-gamma, and TNF drive the
    macrophage antimicrobial program needed to control intracellular
    Francisella, including nitric-oxide-mediated killing.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: CD4-positive, alpha-beta T cell
    term:
      id: CL:0000624
      label: CD4-positive, alpha-beta T cell
  downstream:
  - target: Pulmonary Inflammation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Protective Th1 cytokine responses shape the inflammatory lung response
      to intracellular Francisella.
  evidence:
  - reference: PMID:38461051
    reference_title: Current vaccine strategies and novel approaches to combatting Francisella infection.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      IFNγ and TNF producing Th1 T cells are required to control infection,
      although roles for IL-17, IL-2, and IL-12 have likewise been described
    explanation: >-
      Review synthesis places IFN-gamma/TNF-producing Th1 cells and IL-12 in
      protective control of Francisella infection.
  - reference: PMID:24421047
    reference_title: T-bet regulates immunity to Francisella tularensis live vaccine strain infection, particularly in lungs.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In contrast, immune T-bet-KO lung lymphocytes were greatly impaired in
      controlling intramacrophage growth of LVS; this functional defect is the
      likely mechanism underpinning the lack of respiratory protection.
    explanation: >-
      Mouse LVS infection experiments show that the Th1 transcription factor
      T-bet is required for effective lung Francisella immunity.
- name: Pulmonary Inflammation
  description: >-
    Pulmonary innate immune activation produces acute infectious pneumonia.
  biological_scale: TISSUE
  locations:
  - preferred_term: lung
    term:

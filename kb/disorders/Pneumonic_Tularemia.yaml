treatments:
- name: Ciprofloxacin
  description: >-
    Fluoroquinolone therapy used for tularemia, with review-level evidence of
    pneumonic-form activity among reported treated human cases.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: antibiotic therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
  evidence:
  - reference: PMID:38294108
    reference_title: "Systematic Review: Clinical Features, Antimicrobial Treatment, and Outcomes of Human Tularemia, 1993-2023."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      For pneumonic disease specifically, ciprofloxacin may have slight advantages
      compared to other antimicrobials.
    explanation: >-
      CDC systematic review notes a possible ciprofloxacin advantage in pneumonic
      tularemia specifically.
transmission:
- name: Inhalational Transmission
  description: >-
    Inhalation of aerosolized bacteria seeds the pulmonary form of tularemia.
  evidence:
  - reference: PMID:37916743
    reference_title: "Tularemia - a re-emerging disease with growing concern."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Pulmonary form appears after inhalation of bacteria.
    explanation: >-
      Supports inhalation as the defining exposure route for pneumonic tularemia.

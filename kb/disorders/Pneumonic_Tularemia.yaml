name: Pneumonic Tularemia
creation_date: "2026-09-25T15:35:21Z"
category: Infectious Disease
description: >-
  Pneumonic tularemia is the lung form of tularemia: Francisella tularensis is
  acquired by inhalation or reaches the lung secondarily, survives in macrophages
  through phagosomal escape and cytosolic replication, and drives pulmonary
  inflammation with pneumonia.
disease_term:
  preferred_term: pneumonic tularemia
  term:
    id: MONDO:0002212
    label: pneumonic tularemia
parents:
- Tularemia
synonyms:
- Pulmonary tularemia
infectious_agent:
- name: Francisella tularensis
  infectious_agent_term:
    preferred_term: Francisella tularensis
    term:
      id: NCBITaxon:263
      label: Francisella tularensis
  description: >-
    Intracellular Gram-negative coccobacillus that causes tularemia, including its
    pneumonic form.
  evidence:
  - reference: PMID:37916743
    reference_title: "Tularemia - a re-emerging disease with growing concern."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Tularemia caused by Gram-negative, coccobacillus bacterium, Francisella
      tularensis, is a highly infectious zoonotic disease.
    explanation: >-
      Identifies F. tularensis as the Gram-negative bacterium that causes tularemia.
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
    evidence:
    - reference: PMID:37916743
      reference_title: "Tularemia - a re-emerging disease with growing concern."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Tularemia caused by Gram-negative, coccobacillus bacterium, Francisella
        tularensis, is a highly infectious zoonotic disease.
      explanation: >-
        Pneumonic tularemia is a bacterial infectious form of tularemia.
pathophysiology:
- name: Inhalational Francisella tularensis Lung Exposure
  description: >-
    Pneumonic tularemia follows respiratory exposure to aerosolized F. tularensis,
    establishing the lung as the primary site of infection.
  biological_scale: TISSUE
  locations:
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  downstream:
  - target: Macrophage Phagosomal Escape and Cytosolic Replication
    causal_link_type: DIRECT
    description: >-
      F. tularensis enters macrophages and establishes an intracellular cytosolic
      niche after inoculation.
  evidence:
  - reference: PMID:37916743
    reference_title: "Tularemia - a re-emerging disease with growing concern."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Pulmonary form appears after inhalation of bacteria.
    explanation: >-
      Supports inhalational acquisition as the route to the pulmonary form of
      tularemia.
- name: Macrophage Phagosomal Escape and Cytosolic Replication
  description: >-
    F. tularensis uses its Francisella Pathogenicity Island-encoded type VI
    secretion system to escape the phagosome and replicate in macrophage cytosol.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: symbiont-mediated suppression of host phagosome maturation
    term:
      id: GO:0141158
      label: symbiont-mediated suppression of host phagosome maturation
  downstream:
  - target: Pulmonary Inflammasome Activation
    causal_link_type: DIRECT
    description: >-
      Cytosolic F. tularensis is sensed by innate immune pathways and activates
      inflammasome-mediated inflammation.
  evidence:
  - reference: PMID:37941380
    reference_title: "Pathogenicity and virulence of Francisella tularensis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The main virulence attribute of F. tularensis is the type 6 secretion system
      (T6SS) and its effectors that promote escape from the phagosome.
    explanation: >-
      Identifies the T6SS-mediated phagosomal escape machinery that permits
      Francisella intracellular replication.
- name: Pulmonary Inflammasome Activation
  description: >-
    Lung infection culminates in macrophage inflammasome activation and a
    pro-inflammatory response that injures infected pulmonary tissue.
  biological_scale: TISSUE
  locations:
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: inflammasome-mediated signaling pathway
    modifier: INCREASED
    term:
      id: GO:0141084
      label: inflammasome-mediated signaling pathway
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  downstream:
  - target: Pneumonia
    causal_link_type: DIRECT
    description: >-
      Pulmonary inflammation after inhalational F. tularensis exposure produces
      pneumonic tularemia.
  - target: Cough
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Pulmonary tularemia can clinically manifest with cough.
  evidence:
  - reference: PMID:19863554
    reference_title: "Cell biology and molecular ecology of Francisella tularensis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      activation of the inflammasome mediated by caspase-1, and a pro-inflammatory
      response
    explanation: >-
      Supports inflammasome activation and pro-inflammatory signaling downstream of
      cytosolic Francisella infection.

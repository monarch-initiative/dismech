  evidence:
  - reference: PMID:21819572
    reference_title: A galU mutant of Francisella tularensis is attenuated for virulence in a murine pulmonary model of tularemia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Following pulmonary infection of mice with FT, there is an initial lag in
      recruitment of neutrophils as well as a minimal proinflammatory cytokine
      response in the first 24-48 hours following infection with FT
    explanation: >-
      The murine pulmonary tularemia model documents delayed early neutrophil
      and cytokine responses in the lung after F. tularensis infection.
progression:
- phase: Aerosol pulmonary exposure
  notes: >-
    Pneumonic tularemia begins when aerosolized F. tularensis is inhaled into
    the lower respiratory tract.
  evidence:
  - reference: PMID:37916743
    reference_title: "Tularemia - a re-emerging disease with growing concern."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Pulmonary form appears after inhalation of bacteria.
    explanation: >-
      Defines inhalation as the exposure route for the pulmonary clinical form.
- phase: Intracellular macrophage replication
  notes: >-
    Inhaled Francisella organisms enter pulmonary phagocytes, escape the
    phagosome through the Francisella pathogenicity island type VI secretion
    system, and replicate in the macrophage cytosol.
  evidence:
  - reference: PMID:37941380
    reference_title: "Pathogenicity and virulence of Francisella tularensis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The main virulence attribute of F. tularensis is the type 6 secretion
      system (T6SS) and its effectors that promote escape from the phagosome.
    explanation: >-
      Places type VI secretion-mediated phagosomal escape in the intracellular
      replication phase.
- phase: Acute inflammatory pneumonia
  notes: >-
    Intracellular replication, cytosolic bacteriolysis, AIM2/caspase-1
    activation, and delayed pulmonary innate responses progress to inflammatory
    pneumonia.
  evidence:
  - reference: PMID:21883803
    reference_title: Elevated AIM2-mediated pyroptosis triggered by hypercytotoxic Francisella mutant strains is attributed to increased intracellular bacteriolysis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Francisella tularensis is a facultative intracellular pathogen known to
      trigger a cytosolic innate immune response upon phagosomal escape.
    explanation: >-
      Places phagosomal escape upstream of Francisella-triggered cytosolic
      innate sensing.

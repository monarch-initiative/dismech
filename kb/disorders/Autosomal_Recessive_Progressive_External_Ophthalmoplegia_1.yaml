- name: Ragged-Red Fibers on Modified Gomori Trichrome
  description: >
    Scattered fibres with irregular, red-staining subsarcolemmal masses of
    proliferated mitochondria on modified Gomori trichrome staining of skeletal
    muscle. In arPEO these are typically sparse and scattered rather than
    widespread, matching the mosaic threshold-dependent pathology. (No NCIT
    Histopathology Result term exists for this finding; the HP binding
    HP:0003200 is carried on the corresponding phenotype entry.)
  diagnostic: false
  evidence:

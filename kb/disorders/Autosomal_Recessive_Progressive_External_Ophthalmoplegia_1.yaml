- name: Neurological Extension of the POLG Phenotype
  biological_scale: ORGANISM
  description: >
    Most patients with POLG-related recessive PEO develop a "PEO-plus" phenotype
    because the mtDNA maintenance defect is systemic. The commonest extensions are
    a length-dependent sensory ataxic axonal neuropathy (from dorsal root ganglion
    neuron loss), cerebellar and sensory ataxia, dysarthria and/or dysphagia, and
    sensorineural hearing loss. In a subset, epilepsy, migraine, myoclonus,

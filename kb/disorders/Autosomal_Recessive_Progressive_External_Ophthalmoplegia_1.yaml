    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "Previous studies in CPEO patients with mtDNA deletions reported a threefold higher proportion of COX deficient fibers in EOMs compared to limb skeletal muscles"
    explanation: >
      Reports that extraocular muscle carries a threefold higher burden of
      COX-deficient fibres than limb muscle in CPEO patients - the
      tissue-selectivity that defines the PEO phenotype. Tagged MODEL_ORGANISM
      because the citing publication is a mouse K320E-Twinkle study and this
      sentence sits in its Discussion restating a prior human report rather than
      presenting new human data; cited PARTIAL for the same reason.
  - reference: PMID:33057669

pathophysiology:
- name: POLG Catalytic and Proofreading Deficiency
  biological_scale: MOLECULAR
  description: >
    Biallelic pathogenic POLG variants impair the catalytic A subunit of
    mitochondrial DNA polymerase gamma, the only polymerase that replicates the
    mitochondrial genome. Depending on the domain affected, the consequence is
    reduced 5'-3' polymerase activity (polymerase-domain variants such as
    p.T914P, which is catalytically inactive), reduced 3'-5' exonuclease
    proofreading fidelity (exonuclease-domain variants such as p.F197S), or loss
    of the linker-domain interaction with the POLG2 accessory subunit that confers
    processivity (the common p.A467T allele). In autosomal recessive disease two
    such hypomorphic or null alleles are required; the residual activity of the
    less severe allele largely determines how much mtDNA replication capacity
    survives.
  genes:
  - preferred_term: POLG
    term:
      id: hgnc:9179
      label: POLG
    modifier: DECREASED

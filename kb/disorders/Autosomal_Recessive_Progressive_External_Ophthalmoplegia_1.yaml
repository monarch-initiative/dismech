  - reference: PMID:32042919
    reference_title: "Deep sequencing of mitochondrial DNA and characterization of a novel POLG mutation in a patient with arPEO."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Biochemical characterization revealed that the novel F197S mutant protein had reduced exonuclease and DNA polymerase activities and confirmed that T914P was inactive."
    explanation: >
      Direct biochemical demonstration in an arPEO patient that one allele
      abolishes polymerase activity and the other degrades both polymerase and
      exonuclease (proofreading) function.
  - reference: PMID:16024923
    reference_title: "The common A467T mutation in the human mitochondrial DNA polymerase (POLG) compromises catalytic efficiency and interaction with the accessory subunit."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The A467T mutant enzyme possesses only 4% of wild-type DNA polymerase activity, and the catalytic defect is manifest primarily through a 6-fold reduction in kcat with minimal effect on exonuclease function."
    explanation: >
      Quantifies the catalytic defect of the most common recessive POLG allele in
      purified enzyme assays.
  - reference: PMID:16024923
    reference_title: "The common A467T mutation in the human mitochondrial DNA polymerase (POLG) compromises catalytic efficiency and interaction with the accessory subunit."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "However, the A467T mutant enzyme failed to interact with and was not stimulated by the accessory subunit, as judged by processivity, heat inactivation, and N-ethylmaleimide protection assays in vitro."
    explanation: >
      Shows that p.A467T additionally destroys the processivity-conferring
      interaction with the POLG2 accessory subunit, a distinct second hit on
      replication capacity.
  downstream:
  - target: Impaired Mitochondrial DNA Replication
    description: >-
      Loss of polymerase activity, proofreading, and accessory-subunit-dependent
      processivity directly reduces the fidelity and completion of mitochondrial
      genome replication.
    causal_link_type: DIRECT
    evidence:

- name: Serum Lactate
  biomarker_term:
    preferred_term: Increased circulating lactate concentration
    term:
      id: HP:0002151
      label: Increased circulating lactate concentration
  presence: VARIABLE
  evidence:
  - reference: PMID:28695364
    reference_title: "Revisiting mitochondrial ocular myopathies: a study from the Italian Network."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Increased lactate was associated with central neurological involvement."
    explanation: >
      In a 722-patient genetically diagnosed mitochondrial cohort in which ocular
      myopathy was positively associated with POLG mutations, raised lactate
      marked CNS involvement rather than the ocular myopathy.
  notes: >
    Resting serum lactate is frequently normal in pure ocular myopathy and is not
    a sensitive screening test for PEOB1. In the large Italian mitochondrial
    network cohort, raised lactate tracked with central nervous system involvement
    rather than with the ocular myopathy itself - so a normal lactate does not
    exclude the diagnosis, and an elevated lactate should prompt a search for
    encephalopathic features. Creatine kinase is typically normal or only mildly
    elevated in mitochondrial ocular myopathy and is not curated here as a
    separate marker because no quotable PEOB1-specific figure was found.
genetic:
- name: POLG
  gene_term:
    preferred_term: POLG
    term:
      id: hgnc:9179
      label: POLG
  relationship_type: CAUSATIVE
  association: >-
    Biallelic pathogenic variants in POLG, encoding the catalytic A subunit of
    mitochondrial DNA polymerase gamma, cause autosomal recessive progressive
    external ophthalmoplegia 1 by impairing mtDNA replication and producing
    multiple large-scale mtDNA deletions with variable mtDNA depletion. POLG is
    also the commonest identified nuclear cause of the multiple-mtDNA-deletion
    molecular phenotype irrespective of clinical presentation.
  inheritance:
  - name: Autosomal recessive inheritance
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
    description: >-
      PEOB1 requires two pathogenic POLG alleles - most often compound
      heterozygosity for one of the common European founder alleles (p.A467T,
      p.W748S) plus a second, frequently polymerase-domain, variant. Heterozygous
      carriers are typically asymptomatic for PEO, although carrier status is
      itself a risk factor for valproate hepatotoxicity. This recessive
      requirement is what separates PEOB1 from its autosomal dominant sibling
      PEOA1, in which a single heterozygous POLG variant (classically p.Y955C in
      polymerase motif B) suffices.
    evidence:
    - reference: PMID:20301791
      reference_title: "POLG-Related Disorders."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Early-onset and juvenile/adult-onset POLG-related disorders are typically caused by biallelic pathogenic variants and inherited in an autosomal recessive manner."
      explanation: >
        GeneReviews establishes biallelic POLG variants and autosomal recessive
        inheritance for the recessive POLG-related disorders.
    - reference: PMID:11431686
      reference_title: "Mutation of POLG is associated with progressive external ophthalmoplegia characterized by mtDNA deletions."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We identified three additional POLG missense mutations compatible with recessive PEO In two nuclear families."
      explanation: >
        The founding report that distinguished recessive POLG PEO (this entry)
        from the dominant p.Y955C form described in the same paper.
    - reference: PMID:12565911
      reference_title: "Recessive POLG mutations presenting with sensory and ataxic neuropathy in compound heterozygote patients with progressive external ophthalmoplegia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "we report a novel POLG missense mutation (R627W) in a sporadic patient and we provide genetic support that all these POLG mutations are actually causal and recessive"
      explanation: >
        Provides the genetic proof of recessive causality for the POLG variants
        underlying arPEO.
  evidence:
  - reference: PMID:11431686
    reference_title: "Mutation of POLG is associated with progressive external ophthalmoplegia characterized by mtDNA deletions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Progressive external ophthalmoplegias (PEO) characterized by accumulation of large-scale mitochondrial DNA (mtDNA) deletions are rare human diseases."
    explanation: >
      Frames the disease entity - PEO with large-scale mtDNA deletions - in the
      paper that first implicated POLG.
  - reference: PMID:21550804
    reference_title: "Relative frequency of known causes of multiple mtDNA deletions: two novel POLG mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We showed that 10 cases (48%) display mutations in POLG, including eight previously reported variants and two novel mutations (namely, p.Trp585X and p.Arg1081Gln)."
    explanation: >
      POLG is the single commonest nuclear gene in patients with multiple mtDNA
      deletions in skeletal muscle.
  - reference: PMID:28695364
    reference_title: "Revisiting mitochondrial ocular myopathies: a study from the Italian Network."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among the 722 patients with a definite genetic diagnosis, ocular myopathy was observed in 399 subjects (55.3%) and was positively associated with mtDNA single deletions and POLG mutations."
    explanation: >
      In a large genetically diagnosed mitochondrial disease cohort, ocular
      myopathy was positively associated with POLG mutations.
  variants:
  - name: p.Ala467Thr (c.1399G>A)
    description: >
      The most frequent recessive POLG allele in populations of European descent.
      It lies in the linker domain and acts through two distinct defects: the
      purified enzyme retains only ~4% of wild-type polymerase activity (a ~6-fold
      fall in kcat with essentially intact exonuclease function), and it fails
      entirely to bind and be stimulated by the POLG2 accessory subunit, so
      processivity collapses. It is carried by essentially all patients in the
      original Belgian recessive PEO cohort and occurs at a frequency of 0.6% in
      the Belgian population. Homozygotes span the entire POLG phenotypic
      continuum from Alpers-Huttenlocher to adult sensory ataxic neuropathy with
      ophthalmoparesis, so genotype alone does not predict presentation.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:12565911
      reference_title: "Recessive POLG mutations presenting with sensory and ataxic neuropathy in compound heterozygote patients with progressive external ophthalmoplegia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "all carrying the POLG A467T mutation, which occurs at a frequency of 0.6% in the Belgian population"
      explanation: >
        Establishes p.A467T as the shared allele of the founding recessive PEO
        cohort and gives its population frequency.
    - reference: PMID:16024923
      reference_title: "The common A467T mutation in the human mitochondrial DNA polymerase (POLG) compromises catalytic efficiency and interaction with the accessory subunit."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The A467T mutant enzyme possesses only 4% of wild-type DNA polymerase activity, and the catalytic defect is manifest primarily through a 6-fold reduction in kcat with minimal effect on exonuclease function."
      explanation: >
        Quantifies the residual catalytic activity of the p.A467T enzyme.
    - reference: PMID:23250882
      reference_title: "What is influencing the phenotype of the common homozygous polymerase-gamma mutation p.Ala467Thr?"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In conclusion, our clinical results show that the homozygous p.Ala467Thr POLG mutation does not cause discrete phenotypes, as previously suggested, but rather there is a continuum of clinical symptoms."
      explanation: >
        68 homozygotes across eight centres show a continuum rather than discrete
        genotype-defined phenotypes, so p.A467T homozygosity does not by itself
        predict a PEO versus an Alpers presentation.
  - name: p.Trp748Ser (c.2243G>C)
    description: >
      The second common recessive European founder allele, almost always carried
      in cis with p.Glu1143Gly. It is the commonest cause of mitochondrial
      recessive ataxia syndrome (MIRAS) and, in compound heterozygosity with
      p.A467T or a polymerase-domain variant, contributes to the recessive
      PEO/ataxia-neuropathy end of the spectrum. Haplotype analysis shows a single
      ancient European founder chromosome shared across Finland, Norway, the UK
      and Belgium; the carrier frequency reaches 1 in 125 in Finland.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:16080118
      reference_title: "Mitochondrial DNA polymerase W748S mutation: a common cause of autosomal recessive ataxia with ancient European origin."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We identified 27 patients with mitochondrial recessive ataxia syndrome (MIRAS) from 15 Finnish families, with a carrier frequency in the general population of 1 : 125."
      explanation: >
        Quantifies the Finnish carrier frequency of the p.W748S allele.
    - reference: PMID:16080118
      reference_title: "Mitochondrial DNA polymerase W748S mutation: a common cause of autosomal recessive ataxia with ancient European origin."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Haplotype analysis revealed that all the chromosomes carrying these two changes, in patients from Finland, Norway, the United Kingdom, and Belgium, originate from a common ancient founder."
      explanation: >
        Establishes the single ancient European founder origin of the p.W748S +
        p.E1143G allele.
    - reference: PMID:17426723
      reference_title: "Abundance of the POLG disease mutations in Europe, Australia, New Zealand, and the United States explained by single ancient European founders."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "They have effectively spread to populations of European descent with carrier frequencies up to 1% in several populations."
      explanation: >
        Gives the population-level carrier burden of the common recessive POLG
        founder alleles.
  - name: Compound heterozygosity for p.Ala467Thr and p.Trp748Ser
    description: >
      Trans-compound heterozygosity for the two common founder alleles is a
      recurrent recessive genotype. In a 26-patient series, compound heterozygotes
      had significantly shorter survival than homozygotes for either allele,
      raising the possibility of a dominant-negative interaction between the two
      mutant subunits rather than simple additive loss of function.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:16638794
      reference_title: "The spectrum of clinical disease caused by the A467T and W748S POLG mutations: a study of 26 cases."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "major differences in survival were seen depending on genotype, with compound heterozygotes having a significantly shorter survival time than patients homozygous either for the A467T or W748S"
      explanation: >
        Quantifies the genotype-survival correlation distinguishing compound
        heterozygotes from homozygotes.
    - reference: PMID:16638794
      reference_title: "The spectrum of clinical disease caused by the A467T and W748S POLG mutations: a study of 26 cases."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Compound heterozygotes have a significantly more severe phenotype raising the possibility of a dominant negative effect."
      explanation: >
        States the proposed dominant-negative mechanism underlying the compound
        heterozygote severity.
  - name: Exonuclease-domain and polymerase-domain variants in trans (p.Phe197Ser / p.Thr914Pro)
    description: >
      A worked late-onset arPEO genotype illustrating the general recessive
      architecture: one allele carries a novel exonuclease-domain variant
      (c.590T>C; p.F197S) with reduced exonuclease AND polymerase activity, while
      the other carries a catalytically inactive polymerase-domain null
      (c.2740A>C; p.T914P). Residual activity is supplied entirely by the
      hypomorphic allele, and the resulting replication deficit produces the
      multiple large-scale mtDNA deletions found in the patient's muscle.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:32042919
      reference_title: "Deep sequencing of mitochondrial DNA and characterization of a novel POLG mutation in a patient with arPEO."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "One allele carried a novel mutation in the exonuclease domain (c.590T>C; p.F197S), and the other had a previously characterized null mutation in the polymerase domain (c.2740A>C; p.T914P)."
      explanation: >
        Defines the biallelic genotype in a biochemically characterised arPEO
        patient.
    - reference: PMID:32042919
      reference_title: "Deep sequencing of mitochondrial DNA and characterization of a novel POLG mutation in a patient with arPEO."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "resulting in one inactive POLγA protein (T914P) and one with decreased polymerase and exonuclease activity (F197S)"
      explanation: >
        States the genotype-to-phenotype conclusion for this recessive PEO case.
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    PEOB1 is inherited in an autosomal recessive manner; both POLG alleles must
    carry a pathogenic variant. Sibs of a proband have a 25% recurrence risk.
    Heterozygous sibs are typically asymptomatic. The autosomal dominant POLG PEO
    (PEOA1) is a separate MONDO entity and must not be conflated with this one.
  evidence:
  - reference: PMID:20301791
    reference_title: "POLG-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "If both parents are known to be heterozygous for a POLG pathogenic variant, each sib of an affected individual has at conception a 25% chance of inheriting biallelic pathogenic variants and being affected, a 50% chance of being heterozygous, and a 25% chance of inheriting neither of the familial POLG pathogenic variants."
    explanation: >
      GeneReviews states the standard autosomal recessive recurrence risks for
      POLG-related disorders.
  - reference: PMID:20301791
    reference_title: "POLG-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Heterozygous sibs of a proband with an autosomal recessive POLG-related disorder are typically asymptomatic."
    explanation: >
      Confirms that single-allele carriers do not develop the recessive
      phenotype.
prevalence:
- population: North East England adults (all nuclear-gene adult mitochondrial disease)
  measure_type: POINT_PREVALENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 2.9
  notes: >-
    Upper bound proxy. This is the prevalence of ALL clinically overt adult
    mitochondrial disease caused by nuclear-gene mutations (of which POLG is the
    largest single contributor); PEOB1 specifically is a fraction of this figure.
    No PEOB1-specific population prevalence estimate is available.
  evidence:
  - reference: PMID:25652200
    reference_title: "Prevalence of nuclear and mitochondrial DNA mutations related to adult mitochondrial disease."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "In this population, nuclear mutations were responsible for clinically overt adult mitochondrial disease in 2.9 per 100,000 adults."
    explanation: >
      Population-based minimum prevalence of nuclear-gene adult mitochondrial
      disease, the class to which PEOB1 belongs. Cited as PARTIAL because it is a
      class-level rather than a PEOB1-specific figure.
- population: European-descent populations (POLG founder-allele carriers)
  measure_type: CARRIER_FREQUENCY
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 1000.0
  notes: >-
    Carrier frequency of the common recessive POLG founder alleles (p.A467T,
    p.W748S, p.G848S) reaches ~1% in several populations of European descent -
    equivalently 1000 carriers per 100,000. This is a carrier, not a disease,
    rate.
  evidence:
  - reference: PMID:17426723
    reference_title: "Abundance of the POLG disease mutations in Europe, Australia, New Zealand, and the United States explained by single ancient European founders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "They have effectively spread to populations of European descent with carrier frequencies up to 1% in several populations."
    explanation: >
      Directly reports the ~1% carrier frequency of the common recessive POLG
      alleles in European-descent populations.
- population: Finland (POLG p.W748S carriers)
  measure_type: CARRIER_FREQUENCY
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 800.0
  notes: 1 in 125 general-population carrier frequency for the p.W748S founder allele.
  evidence:
  - reference: PMID:16080118
    reference_title: "Mitochondrial DNA polymerase W748S mutation: a common cause of autosomal recessive ataxia with ancient European origin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "with a carrier frequency in the general population of 1 : 125"
    explanation: >
      Finnish general-population carrier frequency for the p.W748S POLG allele.
treatments:
- name: Supportive and Multidisciplinary Care
  description: >
    There is no disease-modifying therapy for PEOB1. Management is supportive and
    multidisciplinary: occupational, physical and speech therapy for the myopathy,
    ataxia and dysarthria; nutritional and swallowing support; respiratory support
    where needed; and standard treatment of any epilepsy, movement, vision and
    hearing complications - subject to the valproate contraindication below.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301791
    reference_title: "POLG-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical management is largely supportive and involves standard approaches for associated complications including occupational, physical, and speech therapy; nutritional support; respiratory support"
    explanation: >
      GeneReviews specifies supportive multidisciplinary management for
      POLG-related disorders.
- name: Ptosis Surgery (Levator Advancement or Frontalis Suspension)
  description: >
    Surgical correction is the mainstay of symptomatic treatment for the ptosis of
    PEOB1, chosen according to levator excursion: levator advancement or resection
    where levator function is preserved, frontalis suspension (sling) where it is
    not. Myogenic ptosis is a particularly difficult surgical target because the
    ptosis continues to worsen and because the same mitochondrial myopathy impairs
    protective corneal mechanisms (Bell's phenomenon, orbicularis closure).
    Deliberate under-correction is therefore standard - enough to clear the visual
    axis without producing exposure keratopathy - at the cost of a high recurrence
    rate.
  treatment_term:
    preferred_term: Ophthalmologic Surgical Procedure
    term:
      id: NCIT:C15331
      label: Ophthalmologic Surgical Procedure
  therapeutic_modality: SURGERY
  target_phenotypes:
  - preferred_term: Ptosis
    term:
      id: HP:0000508
      label: Ptosis
  evidence:
  - reference: PMID:36178005
    reference_title: "A review of surgical management of progressive myogenic ptosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Surgical techniques predominantly involved levator advancement, levator resection, frontalis sling, blepharoplasty, and Fasanella-Servat."
    explanation: >
      Enumerates the surgical options used for progressive myogenic ptosis,
      including the CPEO subgroup.
  - reference: PMID:36178005
    reference_title: "A review of surgical management of progressive myogenic ptosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, myogenic ptosis is especially challenging as it is characterized by worsening ptosis and the loss of protective corneal mechanisms."
    explanation: >
      Explains why myogenic (mitochondrial) ptosis carries a higher surgical risk
      than other ptosis aetiologies.
  - reference: PMID:36178005
    reference_title: "A review of surgical management of progressive myogenic ptosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The goals of care with myogenic ptosis involves repairing ptosis just sufficiently to alleviate visual obstruction while avoiding adverse post-operative complications."
    explanation: >
      Establishes the deliberate-under-correction principle that governs ptosis
      surgery in mitochondrial ocular myopathy.
- name: Avoidance of Valproic Acid (Contraindicated)
  description: >
    Valproic acid (Depakene) and sodium divalproate/divalproex (Depakote) must be
    avoided in all POLG-related disorders, including PEOB1, because they can
    precipitate or accelerate liver disease and fatal hepatic failure. This is not
    a theoretical caution: in a 26-patient recessive POLG cohort, liver failure
    caused or contributed to death in eight patients, all but one of whom were on
    valproate. The risk is genotype-driven and detectable prospectively, so POLG
    genotyping should precede valproate in anyone with a suspected mitochondrial
    or unexplained epilepsy phenotype. This record is curated with negative
    valence - the intervention is withholding the drug, not administering it.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: valproic acid
      term:
        id: CHEBI:39867
        label: valproic acid
  therapeutic_modality: SMALL_MOLECULE
  evidence:
  - reference: PMID:20301791
    reference_title: "POLG-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "because of the risk of precipitating and/or accelerating liver disease"
    explanation: >
      GeneReviews lists valproic acid and sodium divalproate under
      Agents/circumstances to avoid for POLG-related disorders because of hepatic
      risk.
  - reference: PMID:16638794
    reference_title: "The spectrum of clinical disease caused by the A467T and W748S POLG mutations: a study of 26 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with this disorder are at high risk of death from status epilepticus and from liver failure, if exposed to sodium valproate."
    explanation: >
      Direct clinical evidence of fatal valproate-associated liver failure in
      recessive POLG disease.
  - reference: PMID:21038416
    reference_title: "Polymerase gamma gene POLG determines the risk of sodium valproate-induced liver toxicity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These findings implicate impaired liver regeneration in VPA toxicity and show that prospective genetic testing of POLG will identify individuals at high risk of this potentially fatal consequence of treatment."
    explanation: >
      Supports pre-treatment POLG genotyping to identify patients at high risk of
      valproate hepatotoxicity.
- name: Hepatic and Anti-Seizure Medication Surveillance
  description: >
    Liver enzymes should be monitored every three months or as clinically
    indicated, and liver function retested after introduction of any new
    anti-seizure medication - the surveillance counterpart of the valproate
    contraindication.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301791
    reference_title: "POLG-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "monitoring of liver enzymes every three months or as clinically indicated; monitoring of epilepsy with repeat liver function tests after introduction of any new anti-seizure medication."
    explanation: >
      GeneReviews surveillance recommendation for POLG-related disorders.
- name: Deoxynucleoside (dC/dT) Substrate Supplementation
  description: >
    Investigational, not standard of care. Enteral deoxycytidine plus
    deoxythymidine (dC/dT) aims to replenish the mitochondrial dNTP pool and so
    partially compensate for the reduced replication capacity of mutant
    polymerase gamma - the only curated treatment here that targets the causal
    mechanism rather than the consequences. An open-label single-arm phase 2
    trial (NCT04802707) in POLG-related disorders reported improvement in the
    Newcastle Mitochondrial Disease Scale and stable-or-falling GDF-15 at 6
    months. Important scope caveat for PEOB1: the interim cohort was children,
    six of ten with Alpers-Huttenlocher syndrome and two with ataxia-neuropathy
    spectrum, so efficacy in adult-onset recessive PEO specifically is untested.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: deoxycytidine
      term:
        id: CHEBI:15698
        label: 2'-deoxycytidine
    - preferred_term: deoxythymidine
      term:
        id: CHEBI:17748
        label: thymidine
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Impaired Mitochondrial DNA Replication
    treatment_effect: RESTORES
  evidence:
  - reference: PMID:39091670
    reference_title: "Safety and efficacy of deoxycytidine/deoxythymidine combination therapy in POLG-related disorders: 6-month interim results of an open-label, single arm, phase 2 trial."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "we assessed the safety and efficacy of combination therapy with deoxycytidine and deoxythymidine (dC/dT) in children with POLG-related disorders."
    explanation: >
      Phase 2 open-label trial of enteral dC/dT across POLG-related disorders.
      Cited PARTIAL for PEOB1 because the interim cohort was children with
      Alpers-Huttenlocher syndrome and ataxia-neuropathy spectrum, not
      adult-onset recessive PEO.
  - reference: PMID:39091670
    reference_title: "Safety and efficacy of deoxycytidine/deoxythymidine combination therapy in POLG-related disorders: 6-month interim results of an open-label, single arm, phase 2 trial."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "During the 6 months of treatment, NMDS score improved from a mean of 27.3 at baseline to 20.7 at 6 months"
    explanation: >
      Quantifies the primary efficacy signal. PARTIAL because it is an
      uncontrolled single-arm interim result in a mixed POLG cohort.
  - reference: PMID:39091670
    reference_title: "Safety and efficacy of deoxycytidine/deoxythymidine combination therapy in POLG-related disorders: 6-month interim results of an open-label, single arm, phase 2 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At present, there are no effective treatments for POLG-related disorders."
    explanation: >
      Confirms that no disease-modifying therapy is established for the POLG
      spectrum, which is why the rest of this section is supportive care.
- name: Genetic Counseling
  description: >
    Autosomal recessive counselling with a 25% sib recurrence risk, carrier
    testing for at-risk relatives once the familial variants are known, and the
    option of prenatal or preimplantation genetic testing. Counselling should
    explicitly cover the valproate contraindication for heterozygous relatives,
    who are at increased risk of valproate hepatotoxicity even though they do not
    develop PEO.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:20301791
    reference_title: "POLG-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Once the POLG pathogenic variants have been identified in an affected family member, testing for at-risk family members is possible."
    explanation: >
      GeneReviews genetic counselling guidance for autosomal recessive
      POLG-related disorders.
clinical_trials:
- name: NCT04802707
  phase: PHASE_II
  description: >-
    Single-arm phase 2 trial of combined deoxycytidine (dC) and deoxythymidine
    (dT) nucleoside substrate supplementation as early treatment for
    mitochondrial DNA depletion syndromes, including POLG-related disease. The
    only interventional trial curated here that targets the mtDNA-replication
    defect underlying PEOB1 rather than its downstream consequences.
  evidence:
  - reference: clinicaltrials:NCT04802707
    reference_title: "A Phase II, Monocenter, Single Arm Study To Assess The Safety and Efficacy Of Combination Deoxycytidine and Deoxythymidine For Mitochondrial Depletion Disorders"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this phase II Trial a mix of Deoxynucleosides Pyrimidine (Deoxycytidine dC and Deoxythymidine dT) will be used as early treatment of MDS."
    explanation: >-
      Phase II trial of dC/dT substrate supplementation enrolling mtDNA
      maintenance/depletion disorders including POLG-related disease.
diagnosis:
- name: Molecular Diagnosis by Biallelic POLG Variants
  description: >
    Diagnosis rests on the clinical picture of progressive ptosis and external
    ophthalmoplegia (usually with a mitochondrial myopathy and neuropathy) plus
    identification of biallelic pathogenic POLG variants. Muscle biopsy showing
    ragged-red and COX-negative fibres with multiple large-scale mtDNA deletions
    supports the diagnosis and, historically, was the finding that redirected
    testing to the nuclear genome; with modern panels or exome sequencing, POLG
    sequencing often precedes biopsy. Critically, the requirement for BIALLELIC
    variants is what distinguishes PEOB1 from the autosomal dominant PEOA1, where
    a single heterozygous variant is diagnostic.
  evidence:
  - reference: PMID:20301791
    reference_title: "POLG-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Establishing the diagnosis of a POLG-related disorder relies on clinical findings and the identification of biallelic POLG pathogenic variants on molecular genetic testing for all phenotypes except autosomal dominant progressive external ophthalmoplegia (adPEO), for which identification of a heterozygous POLG pathogenic variant on molecular genetic testing is diagnostic."
    explanation: >
      States the biallelic requirement and explicitly contrasts it with the
      dominant form.
  - reference: PMID:21550804
    reference_title: "Relative frequency of known causes of multiple mtDNA deletions: two novel POLG mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "it is recommended to test POLG routinely in diagnostic laboratories whenever multiple mtDNA deletions are present, regardless of the age of onset of patients and their clinical phenotype"
    explanation: >
      Supports POLG sequencing as first-line whenever multiple mtDNA deletions are
      demonstrated.
differential_diagnoses:
- name: Autosomal Dominant Progressive External Ophthalmoplegia 1 (PEOA1)
  description: >
    The dominant POLG sibling disorder, caused by a single heterozygous POLG
    variant (classically p.Y955C in polymerase motif B, mapped to 15q22-q26 in the
    original Belgian pedigree). Same gene, same molecular endpoint (multiple mtDNA
    deletions), different inheritance and typically later, milder, more
    ocular-restricted disease. This is the single most important entity to keep
    distinct from PEOB1.
  evidence:
  - reference: PMID:11431686
    reference_title: "Mutation of POLG is associated with progressive external ophthalmoplegia characterized by mtDNA deletions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We mapped a new locus for dominant PEO at 15q22-q26 in a Belgian pedigree and identified a heterozygous mutation (Y955C) in the polymerase motif B of the mtDNA polymerase gamma (POLG)."
    explanation: >
      Describes the dominant POLG PEO entity, defined by a single heterozygous
      p.Y955C variant, in the same paper that identified the recessive form.
- name: SANDO / Ataxia-Neuropathy Spectrum (POLG)
  description: >
    Sensory ataxic neuropathy, dysarthria and ophthalmoparesis is caused by the
    same biallelic POLG genotypes and is arguably a phenotypic variant of
    autosomal recessive PEO rather than a separate disease - the boundary is
    clinical emphasis (neuropathy-first versus ophthalmoplegia-first), not
    mechanism.
  evidence:
  - reference: PMID:12565911
    reference_title: "Recessive POLG mutations presenting with sensory and ataxic neuropathy in compound heterozygote patients with progressive external ophthalmoplegia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This is the first finding of a genetic cause of Sensory Ataxic Neuropathy, Dysarthria and Ophthalmoparesis and it implies that this disorder may actually be a variant of autosomal recessive progressive external ophthalmoplegia."
    explanation: >
      Explicitly proposes SANDO as a variant of autosomal recessive PEO, defining
      the boundary problem between the two entries.
- name: Alpers-Huttenlocher Syndrome and MIRAS (POLG)
  description: >
    The early-onset (hepatocerebral, intractable epilepsy) and ataxia-predominant
    ends of the same POLG continuum. They share the p.A467T and p.W748S founder
    alleles with PEOB1, so genotype does not separate them; age of onset and organ
    emphasis do.
  evidence:
  - reference: PMID:16621917
    reference_title: "Phenotypic spectrum associated with mutations of the mitochondrial polymerase gamma gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "POLG1 mutations cause an overlapping clinical spectrum of disease with both dominant and recessive modes of inheritance."
    explanation: >
      Establishes the overlapping-spectrum framing that makes these entities
      differential diagnoses of one another.
- name: Other Nuclear mtDNA Maintenance Disorders (TWNK, RRM2B, SLC25A4, TYMP)
  description: >
    Other nuclear genes produce PEO with multiple mtDNA deletions - TWNK (the
    replicative helicase; formerly C10orf2/PEO1), RRM2B, SLC25A4/ANT1, and TYMP
    (MNGIE). POLG accounts for roughly half of cases, so a negative POLG result
    should prompt testing of the rest of the panel.
  evidence:
  - reference: PMID:21550804
    reference_title: "Relative frequency of known causes of multiple mtDNA deletions: two novel POLG mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Diseases affecting mtDNA stability, termed nuclear-mitochondrial intergenomic communication disorders, are caused by a primary nuclear gene defect resulting in multiple mtDNA deletions."
    explanation: >
      Frames the class of nuclear mtDNA maintenance disorders within which POLG
      accounted for 48% of cases in this cohort.
- name: Single Large-Scale mtDNA Deletion Syndromes (CPEO, Kearns-Sayre)
  description: >
    Sporadic PEO and Kearns-Sayre syndrome are caused by a SINGLE clonal
    large-scale mtDNA deletion arising in the germline or early embryogenesis,
    with no nuclear-gene lesion and negligible recurrence risk. Distinguishing
    single from multiple deletions on muscle mtDNA analysis is the decisive step.
  evidence:
  - reference: PMID:28695364
    reference_title: "Revisiting mitochondrial ocular myopathies: a study from the Italian Network."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among the 722 patients with a definite genetic diagnosis, ocular myopathy was observed in 399 subjects (55.3%) and was positively associated with mtDNA single deletions and POLG mutations."
    explanation: >
      Shows that both single mtDNA deletions and POLG mutations converge on the
      ocular myopathy phenotype, which is why they must be separated
      molecularly.
discussions:
- discussion_id: peob1_extraocular_selectivity_gap
  prompt: >-
    Why are the extraocular muscles and levator palpebrae superioris the earliest
    and most severely affected tissue in POLG-related recessive PEO, when the
    POLG defect is present in every cell?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Selective Extraocular and Levator Muscle Vulnerability
  rationale: >-
    Extraocular muscle carries a threefold higher burden of COX-deficient fibres
    than limb muscle in CPEO patients, and accumulates somatic mtDNA deletions
    faster during normal ageing. Candidate explanations - a lower heteroplasmy
    threshold, a faster deletion generation rate, more permissive clonal
    expansion, lower mitophagy efficiency, or fibre-type-specific mitochondrial
    fusion dynamics - have not been discriminated. This matters because the
    tissue-selectivity, not the enzymology, is what makes PEO a distinct clinical
    entity from the other POLG phenotypes carrying the same alleles.
  proposed_experiments:
  - experiment_id: peob1_single_fibre_threshold_mapping
    name: Single-fibre heteroplasmy threshold mapping across muscle groups
    description: >-
      Measure single-fibre mtDNA deletion load and the heteroplasmy threshold for
      COX negativity in extraocular, levator palpebrae and limb muscle from the
      same POLG-mutant donor, to test whether extraocular selectivity reflects a
      lower threshold or a faster accumulation rate.
  - experiment_id: peob1_fibre_type_mitophagy_imaging
    name: Fibre-type-resolved mitophagy and mitochondrial dynamics imaging
    description: >-
      Compare mitophagy flux and mitochondrial fusion/fission dynamics across
      fibre types in human extraocular versus limb muscle, to test the
      quality-control-capacity explanation for selective vulnerability.
  evidence:
  - reference: PMID:33057669
    reference_title: "Extraocular Muscle Reveals Selective Vulnerability of Type IIB Fibers to Respiratory Chain Defects Induced by Mitochondrial DNA Alterations."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Therefore, our results showing that type IIB fibers in EOMs are affected earlier and more extensively (see Figs. 3A, 3B, 3E), suggest that these fibers might either have a faster rate of mitochondrial DNA deletion accumulation, clonal expansion, or a lower threshold compared to the other fiber types."
    explanation: >
      Explicitly leaves the three candidate mechanisms unresolved.
- discussion_id: peob1_genotype_phenotype_modifier_gap
  prompt: >-
    What determines whether a given recessive POLG genotype - most starkly,
    p.A467T homozygosity - presents as late-onset PEO rather than as
    Alpers-Huttenlocher syndrome or MIRAS?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#POLG Catalytic and Proofreading Deficiency
  rationale: >-
    68 p.A467T homozygotes across eight centres span essentially the entire POLG
    phenotypic spectrum, and clinical presentation clusters within sibships,
    implying heritable modifiers. Yet a genome-directed search within POLG and its
    flanking regulatory regions, and in POLG2, TWNK/PEO1 and ANT1, found no
    correlating nuclear variant. The only signal identified was mitochondrial DNA
    haplogroup U, which was protective against epilepsy. So the modifiers that
    decide a PEO versus an Alpers presentation remain unidentified, and this is
    the central unsolved problem of POLG nosology - it is also why PEOB1 cannot
    be predicted from genotype alone.
  proposed_experiments:
  - experiment_id: peob1_genome_wide_modifier_scan
    name: Genome-wide modifier scan in phenotype-discordant POLG homozygotes
    description: >-
      Run an unbiased genome-wide (rather than candidate-gene) modifier scan in
      large sibship-matched cohorts of p.A467T homozygotes stratified by
      presentation (PEO versus Alpers versus ataxia-neuropathy).
  - experiment_id: peob1_tissue_mtdna_copy_number_profiling
    name: Tissue-resolved mtDNA copy number and deletion-load profiling
    description: >-
      Profile tissue-specific mtDNA copy number and deletion load across
      presentations to test whether the phenotype tracks a quantitative
      replication-capacity threshold rather than a discrete modifier allele.
  evidence:
  - reference: PMID:23250882
    reference_title: "What is influencing the phenotype of the common homozygous polymerase-gamma mutation p.Ala467Thr?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Interestingly, the clinical presentation was similar in siblings, implying a genetic basis for the phenotypic variability amongst homozygotes. However, the p.Ala467Thr allele was present on a shared haplotype in each affected individual, and there was no correlation between the clinical presentation and genetic variants in any of the analysed nuclear genes."
    explanation: >
      Documents both the evidence for a genetic modifier and the failure of the
      candidate-gene search to find one.
  - reference: PMID:23250882
    reference_title: "What is influencing the phenotype of the common homozygous polymerase-gamma mutation p.Ala467Thr?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our results suggest that the mitochondrial DNA background plays an important role in modifying the disease phenotype but nuclear modifiers, epigenetic and environmental factors may also influence the severity of disease."
    explanation: >
      States the residual uncertainty about which class of modifier dominates.
- discussion_id: peob1_compound_heterozygote_dominant_negative
  prompt: >-
    Is the excess severity of p.A467T/p.W748S compound heterozygotes a true
    dominant-negative interaction between the two mutant Pol-gamma-A subunits, or
    simply the additive effect of two partially-overlapping catalytic defects?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#POLG Catalytic and Proofreading Deficiency
  rationale: >-
    Compound heterozygotes have significantly shorter survival than homozygotes
    for either allele, which is not what a simple additive loss-of-function model
    predicts. A dominant-negative mechanism was proposed but has not been tested
    biochemically - Pol gamma functions as a heterotrimer, so a poisoned-complex
    model is plausible but unproven. Resolving this would change how
    compound-heterozygote prognosis is counselled.
  proposed_experiments:
  - experiment_id: peob1_mixed_subunit_polgamma_reconstitution
    name: Mixed-subunit Pol gamma reconstitution assay
    description: >-
      Reconstitute heterotrimeric Pol gamma with mixed A467T and W748S catalytic
      subunits in vitro and compare polymerase activity and processivity against
      each homomeric mutant, to test for a poisoned-complex (dominant-negative)
      effect.
  - experiment_id: peob1_genotype_stratified_deletion_load
    name: Genotype-stratified muscle mtDNA deletion load comparison
    description: >-
      Compare mtDNA deletion load and copy number in matched skeletal muscle from
      compound-heterozygote versus homozygote patients.
  evidence:
  - reference: PMID:16638794
    reference_title: "The spectrum of clinical disease caused by the A467T and W748S POLG mutations: a study of 26 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Compound heterozygotes have a significantly more severe phenotype raising the possibility of a dominant negative effect."
    explanation: >
      Raises the dominant-negative hypothesis without testing it.
notes: >-
  Naming and scope. This entry is specifically MONDO:0009783 / OMIM:258450 -
  progressive external ophthalmoplegia with mitochondrial DNA deletions,
  AUTOSOMAL RECESSIVE 1 (PEOB1, arPEO). It is NOT the autosomal dominant sibling
  PEOA1, and it is deliberately kept distinct from the neighbouring POLG entry
  already in dismech (Sensory Ataxic Neuropathy, Dysarthria, and Ophthalmoparesis
  = MONDO:0011835). The POLG spectrum is a genuine continuum and the boundaries
  between PEOB1, SANDO, MIRAS/ataxia-neuropathy spectrum and
  Alpers-Huttenlocher syndrome are clinical rather than mechanistic; the
  differential_diagnoses section records this explicitly rather than pretending
  the entities are cleanly separable.

  Histopathology term binding. The four histopathology findings carry no
  finding_term because the HistopathologyFindingTerm range is rooted in the NCIT
  Histopathology Result branch, which has no classes for ragged-red fibres,
  COX-negative fibres, or multiple mtDNA deletions. The corresponding HP terms
  (HP:0003200, HP:0003688, HP:0003557, HP:0003689) are bound on the matching
  phenotype entries instead, so the ontology coverage is not lost.

  Frequency bands. No frequency value is asserted on any phenotype in this
  entry. The available literature on recessive POLG PEO consists of small series
  and mixed-phenotype cohorts in which the denominator is either the whole POLG
  spectrum or all multiple-deletion patients, not PEOB1. Per
  docs/frequency-evidence-guidelines.md, omitting the band is preferred to
  fabricating one.

  Prevalence. There is no PEOB1-specific population prevalence estimate. The
  curated records give an upper-bound class-level figure for all nuclear-gene
  adult mitochondrial disease plus founder-allele carrier frequencies, each
  labelled in notes so they are not mistaken for a disease rate. The POLG
  diagnostic yield among patients with multiple mtDNA deletions (48%,
  PMID:21550804) is a conditional diagnostic probability rather than a
  population rate and is therefore recorded under genetic and histopathology
  rather than as a prevalence record.

name: Autosomal Recessive Progressive External Ophthalmoplegia 1
creation_date: "2026-07-31T00:00:00Z"
category: Mendelian
synonyms:
- PEOB1
- arPEO
- POLG autosomal recessive progressive external ophthalmoplegia
- autosomal recessive progressive external ophthalmoplegia caused by mutation in POLG
- progressive external ophthalmoplegia with mitochondrial DNA deletions, autosomal recessive 1
description: >
  Autosomal recessive progressive external ophthalmoplegia 1 (PEOB1, arPEO) is a
  nuclear-encoded disorder of mitochondrial DNA (mtDNA) maintenance caused by
  biallelic pathogenic variants in POLG, the gene encoding the catalytic A subunit
  of mitochondrial DNA polymerase gamma (Pol-gamma-A). Pol gamma is the only DNA
  polymerase responsible for replicating the mitochondrial genome, and it carries
  both a 5'-3' polymerase domain and a 3'-5' exonuclease (proofreading) domain,
  linked by a linker region that mediates binding to the POLG2 accessory subunit
  required for processive synthesis. Recessive POLG variants reduce polymerase
  activity, proofreading fidelity, and/or accessory-subunit interaction; the
  resulting replication stalling and error-prone mtDNA synthesis produce multiple
  large-scale mtDNA deletions in post-mitotic tissue, often with a degree of mtDNA
  depletion. Clonal expansion of deleted mtDNA species above the biochemical
  threshold causes a mosaic respiratory-chain (oxidative phosphorylation) defect,
  seen histologically as ragged-red and cytochrome c oxidase (COX)-negative fibres.
  Extraocular muscle and the levator palpebrae superioris are affected earliest and
  most severely, giving the cardinal phenotype of progressive bilateral ptosis and
  slowly progressive external ophthalmoplegia, typically with a proximal
  mitochondrial myopathy and exercise intolerance. Because the same molecular lesion
  affects all post-mitotic tissue, most patients have a "PEO-plus" phenotype with
  neurological extensions - sensory ataxic axonal neuropathy, cerebellar and sensory
  ataxia, dysarthria/dysphagia, sensorineural hearing loss, and in some patients
  epilepsy and hepatic involvement.

  PEOB1 sits within the POLG-related disorder spectrum, a continuum whose severity
  correlates broadly with age of onset. It must be distinguished from its autosomal
  DOMINANT sibling PEOA1 (heterozygous POLG variants, classically p.Y955C), and from
  the neighbouring recessive POLG phenotypes Alpers-Huttenlocher syndrome, MIRAS,
  SANDO, and ataxia-neuropathy spectrum, with which it shares the two common European
  founder alleles p.A467T and p.W748S. Management is supportive - ptosis surgery,
  multidisciplinary rehabilitation, genetic counselling - and the single most
  important actionable fact is the absolute contraindication to valproic acid, which
  can precipitate or accelerate fatal liver failure on a POLG-deficient background.

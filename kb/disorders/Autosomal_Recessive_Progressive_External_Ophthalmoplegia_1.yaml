- name: Multiple Large-Scale mtDNA Deletions and Depletion
  biological_scale: MOLECULAR
  description: >
    The molecular hallmark of PEOB1 is the accumulation, in post-mitotic tissue
    (especially skeletal and extraocular muscle), of multiple different
    large-scale mtDNA deletions, frequently accompanied by a variable degree of
    mtDNA depletion. Unlike the single, clonal, sporadic deletion of Kearns-Sayre
    syndrome, these deletions are heterogeneous in breakpoint and are generated
    continuously throughout life because the nuclear replication defect persists.
    Deep sequencing of muscle mtDNA in arPEO allows the rearrangements to be
    mapped and their load quantified.
  locations:
  - preferred_term: skeletal muscle tissue
    term:
      id: UBERON:0001134
      label: skeletal muscle tissue
  evidence:
  - reference: PMID:12565911
    reference_title: "Recessive POLG mutations presenting with sensory and ataxic neuropathy in compound heterozygote patients with progressive external ophthalmoplegia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Autosomal recessive progressive external ophthalmoplegia is a mitochondrial disease characterized by accumulation of multiple large-scale deletions of mitochondrial DNA."
    explanation: >
      Defines multiple large-scale mtDNA deletions as the defining molecular
      lesion of autosomal recessive PEO specifically.
  - reference: PMID:32042919
    reference_title: "Deep sequencing of mitochondrial DNA and characterization of a novel POLG mutation in a patient with arPEO."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "By deep sequencing of mitochondrial DNA (mtDNA) extracted from muscle, multiple large-scale rearrangements were mapped and quantified."
    explanation: >
      Demonstrates that multiple large-scale mtDNA rearrangements are directly
      detectable and quantifiable in arPEO muscle.
  - reference: PMID:21550804
    reference_title: "Relative frequency of known causes of multiple mtDNA deletions: two novel POLG mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We showed that 10 cases (48%) display mutations in POLG, including eight previously reported variants and two novel mutations (namely, p.Trp585X and p.Arg1081Gln)."
    explanation: >
      POLG accounted for roughly half of all patients presenting with multiple
      mtDNA deletions in skeletal muscle, establishing it as the dominant genetic
      cause of this molecular phenotype.
  downstream:
  - target: Clonal Expansion Above the Biochemical Threshold
    description: >-
      Individual deleted mtDNA genomes replicate preferentially within single
      post-mitotic cells until they exceed the heteroplasmy threshold for
      respiratory-chain failure.
    causal_link_type: DIRECT
  - target: Multiple Mitochondrial DNA Deletions
    description: >-
      The accumulated heteroplasmic population of deleted mtDNA molecules is
      directly observable in post-mitotic tissue as the multiple-deletion
      molecular phenotype, the diagnostic signature that separates PEOB1 from
      single-deletion PEO.
    causal_link_type: DIRECT
  - target: Valproate-Precipitated Hepatic Decompensation
    description: >-
      Reduced hepatic mtDNA maintenance capacity is the susceptible background on
      which valproate exposure precipitates hepatotoxicity: the liver's
      regenerative response to the drug requires mtDNA replication that a
      POLG-deficient hepatocyte cannot deliver. The edge is conditional on drug
      exposure, so it is indirect rather than an obligate consequence of the
      genotype.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Therapeutic valproic acid or sodium divalproate exposure (usually prescribed for POLG-related epilepsy before the genetic diagnosis is known)
    - Valproate-induced inhibition of hepatocyte proliferation and regeneration
    evidence:
    - reference: PMID:21038416
      reference_title: "Polymerase gamma gene POLG determines the risk of sodium valproate-induced liver toxicity."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "AHS is a neurometabolic disorder associated with an increased risk of developing fatal VPA hepatotoxicity."
      explanation: >
        Establishes that the POLG genotype itself is the substrate on which
        valproate hepatotoxicity risk is conferred, which is what this causal
        edge asserts.
- name: Clonal Expansion Above the Biochemical Threshold
  biological_scale: CELLULAR
  description: >
    Deleted mtDNA genomes are shorter and are amplified preferentially within
    individual long-lived post-mitotic cells (muscle fibre segments, neurons).
    Because mtDNA is polyploid, a cell remains biochemically normal until the
    mutant fraction crosses a threshold, after which mtDNA-encoded respiratory
    chain subunits become limiting. This threshold effect explains the
    characteristic mosaic (fibre-to-fibre) pattern of the defect rather than a
    uniform tissue-wide deficiency.
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  biological_processes:
  - preferred_term: mitochondrial DNA replication
    term:
      id: GO:0006264
      label: mitochondrial DNA replication
    modifier: ABNORMAL
  evidence:
  - reference: PMID:33057669
    reference_title: "Extraocular Muscle Reveals Selective Vulnerability of Type IIB Fibers to Respiratory Chain Defects Induced by Mitochondrial DNA Alterations."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "Therefore, our results showing that type IIB fibers in EOMs are affected earlier and more extensively (see Figs. 3A, 3B, 3E), suggest that these fibers might either have a faster rate of mitochondrial DNA deletion accumulation, clonal expansion, or a lower threshold compared to the other fiber types."
    explanation: >
      A mouse mtDNA-deletion model directly frames the fibre-type-specific defect
      in terms of deletion accumulation rate, clonal expansion, and heteroplasmy
      threshold. Model-organism evidence, offered as mechanistic support for the
      threshold/clonal-expansion step rather than as proof in human tissue.
  downstream:
  - target: Mosaic Respiratory-Chain (OXPHOS) Deficiency
    description: >-
      Once the mutant mtDNA load exceeds threshold in a cell, mtDNA-encoded
      subunits of complexes I, III, IV and V become insufficient and oxidative
      phosphorylation fails in that cell.
    causal_link_type: DIRECT
- name: Mosaic Respiratory-Chain (OXPHOS) Deficiency
  biological_scale: CELLULAR
  description: >
    Loss of intact mtDNA templates reduces the supply of the thirteen
    mtDNA-encoded respiratory-chain polypeptides. Complex IV (cytochrome c
    oxidase) is the most sensitive readout because three of its catalytic
    subunits are mtDNA-encoded and none are supplied by the nuclear genome, so
    affected cells become COX-negative on histochemistry while succinate
    dehydrogenase (entirely nuclear-encoded, complex II) is preserved or
    upregulated. The bioenergetic deficit affects the most oxidative,
    highest-demand post-mitotic cells first.
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  - preferred_term: sensory neuron of dorsal root ganglion
    term:
      id: CL:1001451
      label: sensory neuron of dorsal root ganglion
  biological_processes:
  - preferred_term: oxidative phosphorylation
    term:
      id: GO:0006119
      label: oxidative phosphorylation
    modifier: DECREASED
  - preferred_term: cellular respiration
    term:
      id: GO:0045333
      label: cellular respiration
    modifier: DECREASED
  evidence:
  - reference: PMID:32042919
    reference_title: "Deep sequencing of mitochondrial DNA and characterization of a novel POLG mutation in a patient with arPEO."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Muscle biopsy showed slight variability in muscle fiber size, scattered ragged red fibers, and partial cytochrome c oxidase deficiency."
    explanation: >
      Muscle histochemistry in a genetically confirmed arPEO patient shows the
      mosaic (scattered, partial) pattern of respiratory-chain deficiency
      predicted by threshold-dependent clonal expansion.
  downstream:
  - target: Ragged-Red and COX-Negative Fibre Pathology
    description: >-
      Respiratory-chain-deficient fibre segments lose COX histochemical activity
      and undergo compensatory subsarcolemmal mitochondrial proliferation, the
      histological substrate of ragged-red fibres.
    causal_link_type: DIRECT
  - target: Selective Extraocular and Levator Muscle Vulnerability
    description: >-
      The same OXPHOS deficit is expressed disproportionately in extraocular
      muscle, which is tonically active, has a mitochondrial content several-fold
      higher than limb muscle, and has a lower heteroplasmy threshold for COX
      deficiency than limb muscle.
    causal_link_type: DIRECT
  - target: Neurological Extension of the POLG Phenotype
    description: >-
      Long, metabolically demanding post-mitotic neurons - dorsal root ganglion
      sensory neurons, cerebellar circuits, cochlear neurons - accumulate the same
      bioenergetic deficit, producing the PEO-plus features.
    causal_link_type: DIRECT
  - target: Serum Lactate
    description: >-
      When respiratory-chain impairment is sufficiently systemic, pyruvate is
      redirected toward lactate and circulating lactate may rise; the finding is
      variable and is more associated with central neurological involvement than
      with isolated ocular myopathy.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Reduced mitochondrial oxidation of pyruvate
    - Cytosolic reduction of pyruvate to lactate
- name: Ragged-Red and COX-Negative Fibre Pathology
  biological_scale: TISSUE
  description: >
    In respiratory-chain-deficient fibre segments, a retrograde signalling
    response drives compensatory mitochondrial biogenesis. The resulting
    subsarcolemmal and intermyofibrillar accumulation of structurally abnormal
    mitochondria produces the ragged-red fibre on modified Gomori trichrome and
    the COX-negative / SDH-hyperreactive fibre on sequential COX-SDH
    histochemistry. Fibre atrophy, increased fibre-size variability, and
    endomysial fibrosis accompany the change.
  locations:

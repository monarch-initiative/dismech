- name: Progressive Ptosis and External Ophthalmoplegia
  biological_scale: ORGANISM
  description: >
    The defining clinical expression of PEOB1: bilateral, usually symmetric,
    slowly progressive ptosis followed by restriction of horizontal and vertical
    gaze. Because the deficit is symmetric and evolves over years, diplopia is
    often absent or late, and patients may adopt a chin-up head posture and
    frontalis overaction rather than complain of eye-movement limitation.
  locations:
  - preferred_term: extra-ocular muscle
    term:
      id: UBERON:0001601
      label: extra-ocular muscle
  evidence:
  - reference: PMID:32042919
    reference_title: "Deep sequencing of mitochondrial DNA and characterization of a novel POLG mutation in a patient with arPEO."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient had slowly progressive bilateral ptosis and severely reduced horizontal and vertical gaze."
    explanation: >
      Describes the cardinal arPEO presentation in a genetically and
      biochemically confirmed patient.
  downstream:
  - target: Ptosis
    description: >-
      Loss of contractile capacity in the levator palpebrae superioris presents
      clinically as bilateral, slowly progressive ptosis, typically the first
      sign of the disease.
    causal_link_type: DIRECT
  - target: Progressive External Ophthalmoplegia
    description: >-
      Loss of contractile capacity across the recti and obliques presents
      clinically as progressive, largely symmetric restriction of horizontal and
      vertical gaze.
    causal_link_type: DIRECT
- name: Mitochondrial Myopathy and Exercise Intolerance
  biological_scale: ORGANISM
  description: >
    Beyond the eye, PEOB1 produces a generalised mitochondrial myopathy with
    proximal limb weakness, fatigability, exercise intolerance, and in some

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Muscle biopsy showed slight variability in muscle fiber size, scattered ragged red fibers, and partial cytochrome c oxidase deficiency."
    explanation: >
      Documents ragged-red fibres, COX deficiency and fibre-size variability in
      arPEO muscle.
  - reference: PMID:33057669
    reference_title: "Extraocular Muscle Reveals Selective Vulnerability of Type IIB Fibers to Respiratory Chain Defects Induced by Mitochondrial DNA Alterations."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "We observed fiber atrophy, ragged-red fibers, increased collagen fibrosis, and infiltration of mono-nucleated non-muscle cells"
    explanation: >
      A mouse model of accumulating mtDNA deletions reproduces the full
      histological package (atrophy, ragged-red fibres, fibrosis), supporting the
      causal link from mtDNA deletions to this pathology.
  downstream:
  - target: Mitochondrial Myopathy and Exercise Intolerance
    description: >-
      Accumulation of respiratory-chain-deficient, atrophic fibre segments across
      limb and axial muscle produces proximal weakness, fatigability, and
      exercise intolerance.
    causal_link_type: DIRECT
  - target: Ragged-Red Muscle Fibers
    description: >-
      Compensatory subsarcolemmal mitochondrial proliferation in
      respiratory-chain-deficient fibre segments is what stains as the ragged-red
      fibre on modified Gomori trichrome.
    causal_link_type: DIRECT
  - target: Cytochrome C Oxidase-Negative Muscle Fibers
    description: >-
      Loss of complex IV activity in threshold-crossing fibre segments is
      visualized on sequential COX-SDH histochemistry as discrete COX-negative
      fibres against a background of normally reacting fibres.
    causal_link_type: DIRECT
  - target: Increased Variability in Muscle Fiber Diameter
    description: >-
      Atrophy of respiratory-chain-deficient fibre segments alongside preserved
      fibres widens the fibre-size distribution, the non-specific myopathic
      change seen on biopsy.
    causal_link_type: DIRECT
- name: Selective Extraocular and Levator Muscle Vulnerability
  biological_scale: TISSUE
  description: >
    Extraocular muscles are the earliest and most severely affected tissue in all
    forms of PEO. They are tonically active with the fastest shortening velocities
    and highest firing rates of any skeletal muscle, they carry a mitochondrial
    content several-fold higher than limb muscle, and - critically - they show a
    lower mtDNA mutational threshold for COX deficiency together with a higher
    rate of somatic mtDNA deletion accumulation than limb muscle. The levator
    palpebrae superioris shares this vulnerability, which is why ptosis is
    typically the first sign. The reason this selective vulnerability exists is
    still only partly explained.
  locations:
  - preferred_term: extra-ocular muscle
    term:
      id: UBERON:0001601
      label: extra-ocular muscle

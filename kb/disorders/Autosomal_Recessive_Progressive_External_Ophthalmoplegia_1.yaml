- name: Valproate-Precipitated Hepatic Decompensation
  biological_scale: ORGANISM
  description: >
    Exposure to valproic acid on a POLG-deficient background can precipitate or
    accelerate hepatotoxicity and fulminant liver failure. This is a gene-drug
    interaction rather than a spontaneous feature of PEOB1: valproate impairs
    hepatocyte proliferation and regeneration, which a liver already limited by
    defective mtDNA maintenance cannot compensate for. It is the single most
    important actionable contraindication in the POLG-related disorders and is
    most often encountered when valproate is chosen to treat POLG-related
    epilepsy before the genetic diagnosis is known.
  triggers:
  - preferred_term: valproic acid exposure
    term:
      id: CHEBI:39867
      label: valproic acid
  evidence:
  - reference: PMID:16638794
    reference_title: "The spectrum of clinical disease caused by the A467T and W748S POLG mutations: a study of 26 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Liver failure was the sole cause of death in two patients and evolved terminally in six others, all but one of whom were being treated with sodium valproate."
    explanation: >
      In a 26-patient recessive POLG cohort carrying the same p.A467T/p.W748S
      alleles that cause PEOB1, fatal liver failure clustered almost entirely in
      valproate-exposed patients.
  - reference: PMID:21038416
    reference_title: "Polymerase gamma gene POLG determines the risk of sodium valproate-induced liver toxicity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Heterozygous genetic variation in POLG was strongly associated with VPA-induced liver toxicity"
    explanation: >
      A prospective Drug Induced Liver Injury Network study establishing POLG
      genotype as a strong determinant of valproate hepatotoxicity risk.
  - reference: PMID:21038416
    reference_title: "Polymerase gamma gene POLG determines the risk of sodium valproate-induced liver toxicity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These findings implicate impaired liver regeneration in VPA toxicity and show that prospective genetic testing of POLG will identify individuals at high risk of this potentially fatal consequence of treatment."
    explanation: >
      Identifies impaired hepatocyte regeneration as the mechanism and supports
      pre-treatment POLG genotyping as a preventive strategy.
  downstream:
  - target: Hepatic Failure
    description: >-
      Valproate exposure can overwhelm the limited regenerative and
      mitochondrial reserve of a POLG-deficient liver, culminating in fulminant
      hepatic failure.
    causal_link_type: DIRECT

      scattered ragged-red fibres.
- name: Partial Cytochrome c Oxidase Deficiency on COX-SDH Histochemistry
  description: >
    Sequential COX / SDH histochemistry shows a mosaic of COX-negative,
    SDH-hyperreactive fibre segments among normally reacting fibres. Because SDH
    (complex II) is wholly nuclear-encoded and COX (complex IV) has three
    mtDNA-encoded catalytic subunits, this COX-negative / SDH-positive pattern is
    the specific signature of an mtDNA rather than a nuclear OXPHOS lesion.
    (HP:0003688 is carried on the corresponding phenotype entry.)
  diagnostic: false
  evidence:
  - reference: PMID:32042919
    reference_title: "Deep sequencing of mitochondrial DNA and characterization of a novel POLG mutation in a patient with arPEO."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Muscle biopsy showed slight variability in muscle fiber size, scattered ragged red fibers, and partial cytochrome c oxidase deficiency."
    explanation: >

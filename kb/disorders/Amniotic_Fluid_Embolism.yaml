    snippet: the need for psychological and emotional support for the patient, family members, and clinical staff should be recognized.
  - reference: PMID:33345954
    reference_title: 'Amniotic fluid embolism syndrome: analysis of the Unites States International Registry.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT

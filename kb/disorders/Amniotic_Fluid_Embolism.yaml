- name: Reduced C1 Esterase Inhibitor Activity
  biological_scale: MOLECULAR
  description: A retrospective Japanese registry study measured lower activity in 106 AFE cases than in 88 uncomplicated deliveries and lower values in 21 fatal than 85 nonfatal cases. This is an association, not proof that reduced activity precedes collapse or results from consumption; prognostic utility and replacement efficacy remain unvalidated.

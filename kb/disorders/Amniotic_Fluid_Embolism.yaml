name: Amniotic Fluid Embolism
creation_date: "2026-08-17T09:00:00Z"
category: Complex
synonyms:
- AFE
- Anaphylactoid syndrome of pregnancy
description: >
  Amniotic fluid embolism is a sudden, catastrophic peripartum syndrome of
  cardiovascular collapse, hypoxaemia and coagulopathy that begins when the
  physiological barrier separating the fetal and maternal compartments is
  breached during labour, delivery or the immediate postpartum period. It is
  named for a mechanism it largely does not have. The historical account was
  mechanical - fetal squames, lanugo and vernix physically obstructing the
  maternal pulmonary microvasculature - but the national registry analysis that
  first characterised the syndrome systematically found its clinical and
  haemodynamic picture indistinguishable from anaphylaxis and septic shock, and
  concluded that the name is a misnomer. The dominant modern account is an
  abnormal maternal humoral response to fetal tissue exposure, with
  proinflammatory mediator activation resembling the systemic inflammatory
  response syndrome.

  Whatever initiates it, the haemodynamic sequence is stereotyped and ordered:
  pulmonary vasoconstriction raises pulmonary vascular resistance, the right
  ventricle fails acutely, and left ventricular dysfunction and systemic
  collapse follow. That ordering is a management decision rather than an
  academic one, because a failing right ventricle is treated with inotropes,
  pulmonary vasodilators and vasopressors rather than with volume.

  The coagulopathy is the part of this entry that is mechanistically
  distinctive rather than merely severe. Coagulation is activated and fibrinogen
  consumed, as in any disseminated intravascular coagulation - but in a direct
  comparison against severe placental abruption, fibrinolytic activation in
  amniotic fluid embolism was hyperactive and uncoupled from coagulation
  activation, with raised tissue plasminogen activator and depleted
  thrombin-activatable fibrinolysis inhibitor. Bedside series show the same
  signature from the other direction: fibrinogen and factor V disproportionately
  low and D-dimers exorbitant while platelets and antithrombin are only slightly
  reduced. The clinical expression is therefore haemorrhage, not occlusive
  thrombosis, which is why this entry claims module conformance for coagulation
  activation but deliberately not for thrombus formation.

  Two facts constrain everything above. There is no diagnostic test - amniotic
  fluid embolism remains a clinical diagnosis and no candidate biomarker has
  proved reliable - so the case definition itself is a moving quantity, and
  registries using expert chart review report systematically different incidence
  and mortality from administrative-database studies. And there is no
  disease-modifying therapy: every established intervention is supportive
  resuscitation, haemostatic replacement and prompt delivery.

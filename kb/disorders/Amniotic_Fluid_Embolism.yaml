mechanistic_hypotheses:
- hypothesis_group_id: maternal_inflammatory_response
  hypothesis_label: Abnormal maternal inflammatory response to fetal-compartment exposure
  status: CANONICAL
  description: A prevailing explanatory model links fetal-compartment material entering maternal blood to inflammatory mediator activation. Neither a specific antigen nor an IgE-independent pathway has been established for every clinical presentation. Complement, mast-cell and cytokine observations are heterogeneous and do not prove an obligatory sequence.
  evidence:
  - reference: PMID:24402585
    reference_title: Amniotic fluid embolism.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: The pathophysiology appears to involve an abnormal maternal response to fetal tissue exposure associated with breaches of the maternal-fetal physiologic barrier during parturition.
  - reference: PMID:24865116
    reference_title: Incidence, diagnosis and pathophysiology of amniotic fluid embolism.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: To date, immunological mechanisms, amniotic fluid-dependent anaphylactic reaction and complement activation, have been proposed as potential pathogenetic and pathophysiological mechanisms.

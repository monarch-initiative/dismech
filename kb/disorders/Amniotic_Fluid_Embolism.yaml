    explanation: Author-proposed therapy, not an efficacy finding.
diagnosis:
- name: Clinical Diagnosis and Immediate Differential Assessment
  description: AFE is a clinical diagnosis in sudden peripartum cardiopulmonary compromise with coagulopathy after considering alternative causes. Resuscitation proceeds while the differential is evaluated. No individual laboratory assay, fetal squame finding or cytokine result can currently confirm or exclude AFE.
  evidence:
  - reference: PMID:26987420
    reference_title: 'Amniotic fluid embolism: diagnosis and management.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: we do not recommend the use of any specific diagnostic laboratory test to either confirm or refute the diagnosis of amniotic fluid embolism; at the present time, amniotic fluid embolism remains a clinical diagnosis
- name: Strict Criteria for Research Reporting
  description: The 2016 research definition requires sudden arrest, or hypotension with respiratory compromise; overt DIC before blood loss sufficient to explain the coagulopathy; onset during labor or within 30 minutes of placental delivery; and no intrapartum fever of 38°C or higher. These criteria deliberately exclude some atypical clinical cases and should not be used to delay support or automatically rule out clinical AFE. In 115 selected registry charts, 54 fulfilled the criteria and 14 additional cases were considered AFE by expert review; the comparator was expert consensus, not a diagnostic gold standard.
  evidence:
  - reference: PMID:27372270
    reference_title: Proposed diagnostic criteria for the case definition of amniotic fluid embolism in research studies.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: This approach is intended to apply only to patients included in research reports
  - reference: PMID:30481492
    reference_title: Evaluation of proposed criteria for research reporting of amniotic fluid embolism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: The 14 cases (21%) identified by the expert panel as AFE that did not meet the objective criteria are believed to represent atypical presentations of this condition.
- name: Echocardiography to Characterize Hemodynamic Failure
  description: Bedside transthoracic or transesophageal echocardiography assesses right and left ventricular function, septal displacement and pulmonary hypertension to guide therapy and evaluate alternative cardiac causes. The pattern is not independently diagnostic of AFE.
  evidence:
  - reference: PMID:31376394
    reference_title: 'Amniotic fluid embolism: principles of early clinical management.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: we recommend performing transthoracic or transesophageal echocardiography as soon as possible because this is an easy and reliable method of identifying a failing right ventricle.
  diagnosis_term:
    preferred_term: Echocardiography Test
    term:
      id: NCIT:C16525
      label: Echocardiography Test
- name: Serial Coagulation and Organ-Function Assessment
  description: Assess blood count, platelets, fibrinogen, coagulation times, blood gases and organ function early and repeatedly as clinically indicated. Viscoelastic assays can assist rapid hemostatic management where available. These measurements guide support, rather than specifically identifying AFE.
  evidence:
  - reference: PMID:26987420
    reference_title: 'Amniotic fluid embolism: diagnosis and management.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: we recommend the early assessment of clotting status and early aggressive management of clinical bleeding with standard massive transfusion protocols
differential_diagnoses:
- name: Postpartum hemorrhage with hypovolemic shock
  distinguishing_features:
  - Primary obstetric blood loss can produce shock and secondary dilutional or consumptive coagulopathy. Establish the sequence of bleeding, coagulopathy and cardiorespiratory collapse; hemorrhage alone does not establish AFE.
  evidence:
  - reference: PMID:33345954
    reference_title: 'Amniotic fluid embolism syndrome: analysis of the Unites States International Registry.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: the most common actual diagnosis was hypovolemic shock secondary to postpartum hemorrhage (n=21, 77.7%)
    explanation: Among 27 alternative diagnoses in a selected registry.
- name: Anesthetic complications
  distinguishing_features:
  - High neuraxial block or local-anesthetic systemic toxicity can cause abrupt respiratory or cardiovascular compromise. Timing relative to anesthetic administration and neurologic findings help distinguish these conditions; coagulopathy is not their usual initial feature.
  evidence:
  - reference: PMID:33345954
    reference_title: 'Amniotic fluid embolism syndrome: analysis of the Unites States International Registry.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: followed by anesthetic complications (n = 4, 14.8%)
- name: Sepsis
  distinguishing_features:
  - Infection can cause respiratory failure, cardiovascular collapse and DIC. Fever, infection evidence and time course inform the differential, but their absence does not by itself prove AFE.
  evidence:
  - reference: PMID:33345954
    reference_title: 'Amniotic fluid embolism syndrome: analysis of the Unites States International Registry.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: sepsis-related cardiovascular collapse (n = 2, 7.4%).
- name: Placental abruption with disseminated intravascular coagulation
  distinguishing_features:
  - Abruption can cause bleeding, fetal compromise and severe coagulopathy. PF1+2 and PIC elevations overlap with selected AFE cases; differences in correlations or tPA/TAFI antigen concentrations are not validated bedside discriminators.
  evidence:
  - reference: PMID:38168649
    reference_title: Comparative analysis of hyperfibrinolysis with activated coagulation between amniotic fluid embolism and severe placental abruption.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Both AFE and sPA were associated with activation of coagulation and massive fibrinolysis without significant difference in each plasma maker between the groups.
- name: Pulmonary thromboembolism, myocardial infarction and air embolism
  distinguishing_features:
  - These are alternative causes of abrupt peripartum collapse requiring directed evaluation and treatment. Echocardiography, ECG and appropriate vascular imaging are selected according to clinical stability; right ventricular dysfunction alone does not prove AFE.
  evidence:
  - reference: PMID:42730345
    reference_title: 'Society for Maternal-Fetal Medicine Special Statement: Checklist for initial management of amniotic fluid embolism-Updated 2026.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: The differential diagnosis of AFE includes pulmonary embolism, myocardial infarction, air embolism, high spinal block, and sepsis.
- name: Anaphylaxis, eclampsia and peripartum cardiomyopathy
  distinguishing_features:
  - Drug exposure with rash or bronchospasm, hypertensive disease with seizures, or predominant left ventricular failure may favor these alternatives. No single clinical sign safely excludes competing causes of collapse.
  evidence:
  - reference: url:https://assets.noviams.com/novi-file-uploads/smfm/Publications_and_Guidelines/Clinical_Guidelines/CG_9_amniotic_fluid_embolism.pdf
    reference_title: https://assets.noviams.com/novi-file-uploads/smfm/Publications_and_Guidelines/Clinical_Guidelines/CG_9_amniotic_fluid_embolism.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: includes myocardial infarction, pulmonary embolism, air embolism, anesthetic complications, anaphylaxis, and eclampsia and in some cases sepsis.
  - reference: url:https://assets.noviams.com/novi-file-uploads/smfm/Publications_and_Guidelines/Clinical_Guidelines/CG_9_amniotic_fluid_embolism.pdf
    reference_title: https://assets.noviams.com/novi-file-uploads/smfm/Publications_and_Guidelines/Clinical_Guidelines/CG_9_amniotic_fluid_embolism.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Echocardiography will also aid in ruling out conditions such as a peripartum dilated cardiomyopathy.
discussions:
- discussion_id: afe_case_definition
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: How do case definitions affect mechanistic and outcome estimates?
  rationale: Strict research criteria improve consistency but exclude some expert-adjudicated atypical cases. The 2020 voluntary registry classified 59/129 typical, 15 atypical, 27 alternative and 28 indeterminate; indeterminate does not mean a proven alternative diagnosis. A 2024 series selected 29 cases using broader proposed criteria, none meeting Clark criteria, without a gold-standard validation of the new definition. Different ascertainment and incomplete records limit pooled frequency and mortality interpretations.
  evidence:
  - reference: PMID:33345954
    reference_title: 'Amniotic fluid embolism syndrome: analysis of the Unites States International Registry.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: 22% (28/129) had an uncertain diagnosis.
  - reference: PMID:38082418
    reference_title: 'Amniotic fluid embolism: a reappraisal.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: None of the cases met Clark's criteria while all met our criteria.
- discussion_id: afe_complement_and_mast_cells
  kind: CONTROVERSY
  status: OPEN
  prompt: Which immune observations are causal rather than accompanying critical illness?
  rationale: Low C1 inhibitor activity and complement concentrations, pulmonary degranulation and occasional cytokine elevations supply hypotheses rather than an established ordered pathway. Serum and tissue tryptase measurements sample different compartments and times; negative serum findings in other cases do not refute local lung degranulation. Healthy controls alone do not resolve specificity against sepsis, anaphylaxis or hemorrhagic shock.
  evidence:
  - reference: PMID:25807263
    reference_title: 'Amniotic fluid embolism pathophysiology suggests the new diagnostic armamentarium: β-tryptase and complement fractions C3-C4 are the indispensable working tools.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: the results obtained were negative for serum tryptase and urinary histamine measurements in women with AFE
  - reference: PMID:41765067
    reference_title: 'A subclinical cytokine storm is present before the clinical diagnosis of amniotic fluid embolism: implications for the prediction and prevention of maternal death.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: It is not known whether C1-INH dysregulation precedes clinical deterioration or reflects downstream consumption
  attaches_to:
  - pathophysiology#Complement Activation
  - pathophysiology#Reduced C1 Esterase Inhibitor Activity
  - pathophysiology#Pulmonary Mast Cell Degranulation
  - pathophysiology#Maternal Inflammatory Mediator Activation
- discussion_id: afe_coagulation_scope
  kind: INTERPRETATION
  status: OPEN
  prompt: What can the coagulation comparison establish?
  rationale: The 27 AFE samples were selected from 789 registry cases meeting Erez DIC criteria among 2059 reports. Sampling was before transfusion but after a median 4.9 L blood loss and 1.3 L administered fluid, with variable timing. Both thrombin-generation and plasmin-generation markers were elevated. A nonsignificant within-group correlation does not establish coagulation-independent fibrinolysis. Antigen assays do not quantify tPA or TAFIa activity. The graph represents coagulation activation and excessive fibrinolysis without asserting that occlusive microthrombi cannot form.
  evidence:
  - reference: PMID:38168649
    reference_title: Comparative analysis of hyperfibrinolysis with activated coagulation between amniotic fluid embolism and severe placental abruption.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Among a total of 2059 cases enrolled in the Japanese AFE Registry, we identified 789 AFE patients who met the definition of DIC by Erez’s diagnostic criteria. Of these, plasma samples before blood transfusion were available for 27 cases.
  - reference: PMID:38168649
    reference_title: Comparative analysis of hyperfibrinolysis with activated coagulation between amniotic fluid embolism and severe placental abruption.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: We evaluated antigen levels, not activity, for the plasma tPA and total TAFI
  attaches_to:
  - pathophysiology#Coagulation Cascade Activation
  - pathophysiology#Excessive Plasmin Generation
  - pathophysiology#Reduced Functional Fibrinogen
- discussion_id: afe_risk_association
  kind: INTERPRETATION
  status: OPEN
  prompt: Do epidemiologic associations justify altering obstetric practice?
  rationale: Population studies report associations with medical induction, advanced maternal age and placental or delivery complications. These do not identify a deterministic cause; confounding, reverse causation and case misclassification remain possible. Absence of an actionable prevention rule does not refute an association. The Canadian three-million-delivery study reported adjusted odds 1.8 for medical induction with low absolute excess risk. Current clinical assessment should follow indications for obstetric care rather than an unvalidated AFE prevention strategy.
  evidence:
  - reference: PMID:17055946
    reference_title: 'Amniotic-fluid embolism and medical induction of labour: a retrospective, population-based cohort study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Medical induction of labour nearly doubled the risk of overall cases of amniotic-fluid embolism (adjusted odds ratio 1.8 [1.3-2.7])
  - reference: PMID:24402585
    reference_title: Amniotic fluid embolism.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: at present, no putative risk factor has been identified that would justify modification of standard obstetric practice to reduce the risk of this condition.
- discussion_id: afe_survivorship
  kind: INTERPRETATION
  status: OPEN
  prompt: What is known about long-term recovery and subsequent pregnancy?
  rationale: 'Selected registry interviews at least one year after AFE found PTSD-consistent symptoms in 16/29 available survivors; this is not a population PTSD diagnosis rate. Seven women reported a later pregnancy: one miscarriage and six uncomplicated term births without recurrence. These small selected observations support follow-up and individualized counseling, not a claim of zero recurrence risk. The Australasian surveillance captured initial management rather than long-term neurologic outcomes.'
  evidence:
  - reference: PMID:33345954
    reference_title: 'Amniotic fluid embolism syndrome: analysis of the Unites States International Registry.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Of 29 survivors available for interview, 2 reported thyroid abnormalities, 1 reported persistent liver dysfunction, and 16 (55.1%) endorsed symptoms consistent with PTSD
  - reference: PMID:33345954
    reference_title: 'Amniotic fluid embolism syndrome: analysis of the Unites States International Registry.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: 'Seven women who experienced either typical or atypical AFE had a subsequent pregnancy: 1 miscarried, and the other 6 had an uncomplicated pregnancy and delivered at term with no recurrence of AFE.'
- discussion_id: afe_mechanical_hypothesis
  kind: CONTROVERSY
  status: OPEN
  prompt: Does fetal material cause collapse through pulmonary microvascular obstruction?
  rationale: Mechanical obstruction was the historical explanation and remains discussed in older pathology accounts. Detection of fetal material does not quantify occlusion or establish causality. The 2026 SMFM statement considers a direct embolic explanation unlikely; the initiating inflammatory trigger remains unresolved. This entry therefore does not assert an established mechanical-obstruction node.
  evidence:
  - reference: PMID:24888909
    reference_title: 'Amniotic fluid embolism: pathophysiology and new strategies for management.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: the fetal materials create physical obstructions in the maternal microvessels in various organs, such as the lung
    explanation: Older review interpretation, not a new quantitative obstruction experiment.
  - reference: PMID:42730345
    reference_title: 'Society for Maternal-Fetal Medicine Special Statement: Checklist for initial management of amniotic fluid embolism-Updated 2026.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Despite its name, AFE likely has no direct relation to either amniotic fluid or an embolism
notes: Full review uses original primary abstracts and available full texts, regenerated tables, the 2016 research definition, and the corrected 2026 SMFM statement (PMID:42730345). The separately cached full 2016 SMFM guideline URL corresponds to PMID:26987420; full-body excerpts are cited to that generated URL. StatPearls NBK559107 was mined for clinical coverage, with treatment decisions anchored to the newer primary guideline. No matching deep-research report was available. No consistently validated animal model was identified in the cited sources; clinical observations are not represented as experimental models. Selected-registry symptoms with incomplete denominators retain cohort descriptions rather than disease-wide frequency bands. Uterine atony has no precise HPO binding found in the live search. Chest pain, cough, headache, arrhythmia and cerebral infarction are retained as source-supported clinical findings without assigning a uniquely demonstrated causal mediator.
biochemical:
- name: C1 esterase inhibitor activity
  presence: Decreased
  specificity: Not specific or clinically validated for AFE prediction
  notes: A retrospective Japanese registry study measured lower activity in 106 AFE cases than in 88 uncomplicated deliveries and lower values in 21 fatal than 85 nonfatal cases. This is an association, not proof that reduced activity precedes collapse or results from consumption; prognostic utility and replacement efficacy remain unvalidated.
  evidence:
  - reference: PMID:24561565
    reference_title: C1 esterase inhibitor activity in amniotic fluid embolism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: C1 esterase inhibitor activity levels were significantly lower in amniotic fluid embolism patients (30.0% ± 1.8%) than in control women (62.0% ± 2.0%) (p < 0.0001).
- name: Plasma tissue plasminogen activator antigen
  presence: Increased in the selected AFE-with-DIC cohort
  notes: Antigen was measured by ELISA, not catalytic activity or active free tPA. Higher antigen cannot by itself establish increased secretion or causal mediation of fibrinolysis. The comparison used 27 AFE cases, 12 severe abruption cases and 23 controls with different sampling and clinical contexts.
  evidence:
  - reference: PMID:38168649
    reference_title: Comparative analysis of hyperfibrinolysis with activated coagulation between amniotic fluid embolism and severe placental abruption.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: AFE had significantly increased tPA and decreased total TAFI levels compared with severe PA and controls
  - reference: PMID:38168649
    reference_title: Comparative analysis of hyperfibrinolysis with activated coagulation between amniotic fluid embolism and severe placental abruption.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: We evaluated antigen levels, not activity, for the plasma tPA and total TAFI
- name: Total thrombin-activatable fibrinolysis inhibitor antigen
  presence: Decreased in the selected AFE-with-DIC cohort
  notes: The assay combined TAFI and activated TAFIa antigen; it did not separately quantify active inhibitory function. Reduced total antigen may be associated with fibrinolysis, but causation and the reason for reduction are unresolved.
  evidence:
  - reference: PMID:38168649
    reference_title: Comparative analysis of hyperfibrinolysis with activated coagulation between amniotic fluid embolism and severe placental abruption.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Since the capture antibody in the ELISA kit used in the present study detects both TAFI and TAFIa antigens according to the manufacturer, we described the amount of TAFI and TAFIa measured together with the kit as total TAFI.
  - reference: PMID:38168649
    reference_title: Comparative analysis of hyperfibrinolysis with activated coagulation between amniotic fluid embolism and severe placental abruption.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: AFE had significantly increased tPA and decreased total TAFI levels compared with severe PA and controls
- name: Prothrombin fragment 1+2 and plasmin–antiplasmin complex
  presence: Increased in selected coagulopathic cases
  notes: These complementary markers indicate coagulation and fibrinolytic activation. Their cross-sectional relationship cannot establish which pathway begins first or exclude microvascular thrombosis.
  evidence:
  - reference: PMID:38168649
    reference_title: Comparative analysis of hyperfibrinolysis with activated coagulation between amniotic fluid embolism and severe placental abruption.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: PF1 + 2 and PIC were markedly increased in both AFE (n = 27) and severe PA (n = 12) compared to controls (n = 23), without significant difference between those disease groups
- name: D-dimer and functional fibrinogen
  presence: Elevated D-dimer with reduced Clauss fibrinogen
  notes: The Japanese cohort measured functional fibrinogen but not antigenic fibrinogen. Increased D-dimer reflects crosslinked fibrin degradation; the design cannot partition consumption, fibrinogenolysis and polymerization inhibition.
  evidence:
  - reference: PMID:38168649
    reference_title: Comparative analysis of hyperfibrinolysis with activated coagulation between amniotic fluid embolism and severe placental abruption.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: the very low values of Clauss fibrinogen with elevated D-dimer levels compared to the control group
  - reference: PMID:38168649
    reference_title: Comparative analysis of hyperfibrinolysis with activated coagulation between amniotic fluid embolism and severe placental abruption.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: We could not calculate the Clauss fibrinogen/antigenic fibrinogen ratio because our study was not designed to evaluate fibrinogen antigen levels when we started our study.
- name: Circulating inflammatory cytokines
  presence: Markedly increased in an individual fatal case
  notes: In one 2026 reanalysis, IL-6, IL-8 and IL-10 were elevated at admission and diagnosis relative to six healthy term-labor and six healthy nonlabor controls. This was a previously reported case, not a new cohort. Fever after epidural and lack of autopsy limit etiologic certainty; there was no infected or critically ill concurrent control group, independent prediction validation or tested immunotherapy.
  evidence:
  - reference: PMID:41765067
    reference_title: 'A subclinical cytokine storm is present before the clinical diagnosis of amniotic fluid embolism: implications for the prediction and prevention of maternal death.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: 'The present analysis involved two plasma specimens from this patient: (1) an admission sample obtained before the onset of symptoms/diagnosis and (2) a sample collected at the time of AFE diagnosis.'
  - reference: PMID:41765067
    reference_title: 'A subclinical cytokine storm is present before the clinical diagnosis of amniotic fluid embolism: implications for the prediction and prevention of maternal death.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: The admission plasma sample, obtained when the patient appeared completely asymptomatic, showed extraordinary elevations of key inflammatory cytokines relative to women in labor.
    explanation: Single-case observation against six term-labor and six term-not-in-labor controls.
histopathology:
- name: Fetal squamous material in maternal pulmonary vessels
  description: Fetal squames or other amniotic components have been described in maternal pulmonary vessels at autopsy. Presence is neither required nor pathognomonic, and does not demonstrate that mechanical occlusion caused collapse.
  diagnostic: false
  evidence:
  - reference: PMID:25807263
    reference_title: 'Amniotic fluid embolism pathophysiology suggests the new diagnostic armamentarium: β-tryptase and complement fractions C3-C4 are the indispensable working tools.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: The presence of squamous cells in the maternal pulmonary artery circulation is no longer considered pathognomonic.
- name: Pulmonary mast-cell degranulation
  description: Extracellular tryptase staining in selected fatal AFE lung series supports local degranulation. These observations do not establish a validated diagnostic test or a causal mediator common to all cases.
  diagnostic: false
  evidence:
  - reference: PMID:25807263
    reference_title: 'Amniotic fluid embolism pathophysiology suggests the new diagnostic armamentarium: β-tryptase and complement fractions C3-C4 are the indispensable working tools.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: These studies, therefore, highlight that mast cell degranulation occurs in the lungs of AFE fatal cases, whereas it does not occur in other fatal pregnancies.
    explanation: Review synthesis of selected autopsy series, not proof of specificity across all causes of death.
progression:
- phase: Acute peripartum presentation
  notes: Presentation is usually abrupt during labor or shortly after delivery, but broader surveillance definitions include later and atypical presentations. Cardiopulmonary compromise and coagulopathy may overlap; an obligatory sequential four-stage course is not established.
  evidence:
  - reference: PMID:42730345
    reference_title: 'Society for Maternal-Fetal Medicine Special Statement: Checklist for initial management of amniotic fluid embolism-Updated 2026.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Cardiac arrest accompanies many cases of AFE, but not all
  - reference: PMID:26703453
    reference_title: 'Amniotic fluid embolism: an Australian-New Zealand population-based study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Five women presented 30 min or more after delivery.
- phase: Recovery and sequelae
  notes: Survivors may require prolonged critical care and follow-up for neurologic, other organ and psychological sequelae. Available studies often ascertain only early outcomes; selected survivors with later pregnancies do not define recurrence risk.
  evidence:
  - reference: PMID:33345954
    reference_title: 'Amniotic fluid embolism syndrome: analysis of the Unites States International Registry.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Among women who survived either atypical or typical AFE, long-term complications that include medical and psychological manifestations involving depression and post-traumatic stress disorder (PTSD) symptoms, were recorded from those contacted and available for interview at least 1 year post-event.

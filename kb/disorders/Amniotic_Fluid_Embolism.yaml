mechanistic_hypotheses:
- hypothesis_group_id: anaphylactoid_immune_response
  hypothesis_label: Abnormal maternal humoral/anaphylactoid response to fetal antigen exposure
  status: CANONICAL
  description: >
    Under this model the injury is caused not by the physical presence of fetal
    material but by the maternal reaction to it. Fetal antigens entering the
    maternal circulation trigger proinflammatory mediator release resembling the
    systemic inflammatory response syndrome, with complement activation and
    kallikrein-kinin and coagulofibrinolytic involvement, in a susceptible host.
    The supporting arguments are the haemodynamic identity with anaphylaxis and
    septic shock, the excess of atopy among cases, and the measurable consumption
    of complement components and C1 esterase inhibitor. The model is explicitly
    non-IgE-mediated, which is why "anaphylactoid" rather than "anaphylactic" is
    the term used.
  evidence:
  - reference: PMID:24402585
    reference_title: Amniotic fluid embolism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The pathophysiology appears to involve an abnormal maternal response to fetal tissue exposure associated with breaches of the maternal-fetal physiologic barrier during parturition."
    explanation: States the abnormal-maternal-response model as the current account of pathophysiology.
  - reference: PMID:7726251
    reference_title: "Amniotic fluid embolism: analysis of the national registry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The striking similarities between clinical and hemodynamic findings in amniotic fluid embolism and both anaphylaxis and septic shock suggest a common pathophysiologic mechanism for all these conditions."
    explanation: >
      The registry argument that founded this model, and the basis for the
      "misnomer" claim this entry's description repeats.
  - reference: PMID:33345954
    reference_title: "Amniotic fluid embolism syndrome: analysis of the Unites States International Registry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This doubling of reported atopy among cases suggests that an anaphylactoid reaction may be the inciting event for the cascade of adverse events that characterize AFE."
    explanation: >
      The contemporary registry's own inference from the atopy excess. Note the
      hedge - "suggests", "may be" - which is why the atopy observation supports
      the hypothesis rather than establishing it.
  - reference: PMID:24865116
    reference_title: "Incidence, diagnosis and pathophysiology of amniotic fluid embolism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To date, immunological mechanisms, amniotic fluid-dependent anaphylactic reaction and complement activation, have been proposed as potential pathogenetic and pathophysiological mechanisms."
    explanation: Names the immunological and complement mechanisms grouped under this hypothesis.
- hypothesis_group_id: mechanical_embolic_obstruction
  hypothesis_label: Physical obstruction of the maternal pulmonary microvasculature by fetal material
  status: ALTERNATIVE
  description: >
    The original account, and the one the disease is named for: fetal squames,
    lanugo hairs, vernix and mucin entering maternal vessels and physically
    obstructing the pulmonary and other microcirculations. It is retained as
    ALTERNATIVE rather than DEPRECATED because the Japanese registry programme
    explicitly reports two etiologies and keeps physical obstruction as one of
    them, and because fetal material in the pulmonary vasculature is a real
    autopsy finding. What it has lost is its status as a diagnostic criterion:
    squamous cells in the pulmonary circulation are no longer accepted as
    pathognomonic, and continued reliance on them is named as a source of
    misdiagnosis.
  evidence:
  - reference: PMID:24888909
    reference_title: "Amniotic fluid embolism: pathophysiology and new strategies for management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Those data showed that there were two etiologies of AFE: the fetal materials create physical obstructions in the maternal microvessels in various organs, such as the lung"
    explanation: >
      The registry statement that keeps mechanical obstruction as a live etiology
      alongside the anaphylactoid one, and the reason this group is ALTERNATIVE
      rather than DEPRECATED.
  - reference: PMID:33345954
    reference_title: "Amniotic fluid embolism syndrome: analysis of the Unites States International Registry."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Continued erroneous reliance on the detection of squamous cells in the pulmonary circulation as a pathognomonic criterion for AFE diagnosis regardless of clinical presentation also plays a role in erroneous diagnoses."
    explanation: >
      PARTIAL because it does not refute the mechanism, only its diagnostic use.
      This is the boundary the entry draws: fetal material in the maternal
      pulmonary circulation may occur without being what causes the syndrome.

pathophysiology:
- name: Breach of the Maternal-Fetal Physiologic Barrier
  biological_scale: TISSUE
  role: TRIGGER
  description: >
    The initiating event is a loss of separation between the amniotic compartment
    and the maternal circulation during parturition - through the endocervical
    veins, the placental implantation site, or a surgical or traumatic uterine
    breach. This is a normal-anatomy failure of an ordinary process rather than a
    lesion: small quantities of fetal material enter the maternal circulation in
    many uneventful labours, so the breach is necessary but not sufficient, and
    what follows depends on the host response.
  biological_processes:
  - preferred_term: parturition
    term:
      id: GO:0007567
      label: parturition
  evidence:
  - reference: PMID:24402585
    reference_title: Amniotic fluid embolism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "breaches of the maternal-fetal physiologic barrier during parturition"
    explanation: Names the barrier breach and its timing as the initiating condition.
  downstream:
  - target: Entry of Amniotic Fluid and Fetal Antigens into the Maternal Circulation
    causal_link_type: DIRECT
    description: >
      The breach is simply the route; what crosses it is the amniotic fluid and
      fetal cellular material that the maternal system then responds to.
    evidence:
    - reference: PMID:28188959
      reference_title: "Amniotic fluid embolism: Pathophysiology from the perspective of pathology."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "caused by the inflow of amniotic components into the maternal circulation"
      explanation: States the inflow of amniotic components as the proximate cause of the syndrome.

- name: Entry of Amniotic Fluid and Fetal Antigens into the Maternal Circulation
  biological_scale: ORGANISM
  description: >
    Amniotic fluid carrying fetal squamous cells, lanugo, vernix, mucin and
    soluble fetal antigens enters the maternal venous circulation and reaches the
    pulmonary vascular bed. This node is deliberately atomic and deliberately
    neutral between the two hypotheses in this entry: it is the last step both
    accounts share. Everything after it forks, into a maternal humoral response
    (canonical) or a physical obstruction (alternative).
  evidence:
  - reference: PMID:33345954
    reference_title: "Amniotic fluid embolism syndrome: analysis of the Unites States International Registry."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "may enhance the opportunity for large volumes of amniotic fluid to enter maternal circulation"
    explanation: >
      PARTIAL because the sentence is offered as one of two speculative
      explanations for the placenta previa excess, not as an established
      quantitative claim about entry volume.
  downstream:
  - target: Abnormal Maternal Proinflammatory Mediator Activation
    causal_link_type: DIRECT
    hypothesis_groups:
    - anaphylactoid_immune_response
    description: >
      Under the canonical model the fetal antigen load provokes a systemic
      humoral response rather than acting mechanically.
    evidence:
    - reference: PMID:24402585
      reference_title: Amniotic fluid embolism.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This response and its subsequent injury appear to involve activation of proinflammatory mediators similar to that seen with the classic systemic inflammatory response syndrome."
      explanation: Links the maternal response to fetal tissue exposure to proinflammatory mediator activation.
  - target: Mechanical Obstruction of the Maternal Pulmonary Microvasculature
    causal_link_type: DIRECT
    hypothesis_groups:
    - mechanical_embolic_obstruction
    description: >
      Under the alternative model the same entry event acts physically, the fetal
      particulate matter obstructing maternal microvessels.
    evidence:
    - reference: PMID:24888909
      reference_title: "Amniotic fluid embolism: pathophysiology and new strategies for management."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "the fetal materials create physical obstructions in the maternal microvessels in various organs, such as the lung"
      explanation: States the physical-obstruction step this edge represents.

- name: Abnormal Maternal Proinflammatory Mediator Activation
  biological_scale: ORGANISM
  description: >
    The canonical hub of this entry. Exposure to fetal antigen provokes a
    systemic humoral response in the susceptible host, with proinflammatory
    mediator activation resembling the systemic inflammatory response syndrome
    and haemodynamics indistinguishable from anaphylaxis and septic shock. The
    node is scaled ORGANISM because the claim is about a whole-body mediator
    state rather than about any one cell or tissue; the complement and mast cell
    arms below are its identified molecular and cellular components.
  biological_processes:
  - preferred_term: acute inflammatory response
    term:
      id: GO:0002526
      label: acute inflammatory response
    modifier: INCREASED
    temporality: ACUTE
  evidence:
  - reference: PMID:24402585
    reference_title: Amniotic fluid embolism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This response and its subsequent injury appear to involve activation of proinflammatory mediators similar to that seen with the classic systemic inflammatory response syndrome."
    explanation: The core statement that this node represents.
  - reference: PMID:7726251
    reference_title: "Amniotic fluid embolism: analysis of the national registry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical and hemodynamic manifestations were similar to those manifest in anaphylaxis and septic shock."
    explanation: The registry observation that made a shared mediator-driven mechanism the leading account.
  - reference: PMID:35840499
    reference_title: Acute respiratory distress and amniotic fluid embolism in pregnancy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "maternal inflammatory response and activation of the immune and complement systems appear to play leading roles"
    explanation: >
      Independent review attributing the leading mechanistic role to the maternal
      inflammatory and complement response. Note "appear to" - this is the
      field's consensus reading, not a demonstrated causal chain.
  downstream:
  - target: Complement Activation and C1 Esterase Inhibitor Consumption
    causal_link_type: DIRECT
    hypothesis_groups:
    - anaphylactoid_immune_response
    description: >
      Complement is the best-measured arm of the humoral response, with
      demonstrable consumption of C3, C4 and C1 esterase inhibitor activity.
    evidence:
    - reference: PMID:24561565
      reference_title: C1 esterase inhibitor activity in amniotic fluid embolism.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Amniotic fluid embolism exhibits activation of the complement system and the kallikrein-kinin and coagulofibrinolytic systems."
      explanation: States complement activation as a component of the response, alongside the kallikrein-kinin and coagulofibrinolytic systems.
  - target: Pulmonary Mast Cell Degranulation
    causal_link_type: UNKNOWN
    hypothesis_groups:
    - anaphylactoid_immune_response
    description: >
      Typed UNKNOWN rather than DIRECT because the evidence for a mast cell arm
      is genuinely split - autopsy immunohistochemistry supports it, serum
      tryptase and urinary histamine measurements in living patients do not. See
      the controversy discussion.
    evidence:
    - reference: PMID:25807263
      reference_title: "Amniotic fluid embolism pathophysiology suggests the new diagnostic armamentarium."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Anaphylactoid reactions refer to an identical clinical pattern seen in the classical anaphylaxis, non-IgE mediated and certain allergens, including drugs can trigger the mast cell cascade directly without involving IgE as the initial mediator"
      explanation: >
        Gives the mechanistic rationale for a non-IgE mast cell arm. PARTIAL
        because it establishes that such a route exists in general, not that it
        operates in this disease.
  - target: Pulmonary Vasoconstriction and Acute Pulmonary Hypertension
    causal_link_type: DIRECT
    hypothesis_groups:
    - anaphylactoid_immune_response
    description: >
      The anaphylactoid reaction produces pulmonary vasospasm directly, which is
      the entry point into the stereotyped haemodynamic sequence.
    evidence:
    - reference: PMID:24888909
      reference_title: "Amniotic fluid embolism: pathophysiology and new strategies for management."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "the liquids cause an anaphylactoid reaction that leads to pulmonary vasospasm and activation of platelets, white blood cells and/or complements"
      explanation: States pulmonary vasospasm as the direct consequence of the anaphylactoid reaction.
  - target: Coagulation Activation and Fibrinogen Consumption
    causal_link_type: DIRECT
    hypothesis_groups:
    - anaphylactoid_immune_response
    description: >
      The same response activates platelets and the coagulation system, which is
      why the coagulopathy is a parallel arm of the syndrome rather than merely
      a consequence of shock.
    evidence:
    - reference: PMID:24888909
      reference_title: "Amniotic fluid embolism: pathophysiology and new strategies for management."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "an anaphylactoid reaction that leads to pulmonary vasospasm and activation of platelets, white blood cells and/or complements"
      explanation: Names platelet activation as part of the same reaction that produces the vasospasm.

- name: Complement Activation and C1 Esterase Inhibitor Consumption
  biological_scale: MOLECULAR
  description: >
    Complement components are consumed in amniotic fluid embolism, and the
    principal regulator of the classical pathway is consumed with them. C3 and C4
    fall markedly in the disseminated-intravascular-coagulation presentation, and
    C1 esterase inhibitor activity is roughly half that of control pregnant women
    and lower still in fatal cases - a dose-response relationship with outcome
    that is unusual in this disease, where almost nothing correlates with
    anything. C1 esterase inhibitor is not only a complement regulator: it also
    inhibits plasma kallikrein and factors XIIa and XIa, which is what ties this
    node mechanistically to the coagulofibrinolytic arm rather than leaving it a
    parallel curiosity.
  biological_processes:
  - preferred_term: complement activation
    term:
      id: GO:0006956
      label: complement activation
    modifier: INCREASED
  molecular_functions:
  - preferred_term: serine-type endopeptidase inhibitor activity
    term:
      id: GO:0004867
      label: serine-type endopeptidase inhibitor activity
    modifier: DECREASED
  evidence:
  - reference: PMID:24888909
    reference_title: "Amniotic fluid embolism: pathophysiology and new strategies for management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a marked reduction of C3 and C4 was observed in DIC type AFE"
    explanation: Documents complement component consumption, specifically in the coagulopathic presentation.
  - reference: PMID:24561565
    reference_title: C1 esterase inhibitor activity in amniotic fluid embolism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "C1 esterase inhibitor activity levels were significantly lower in amniotic fluid embolism patients (30.0% ± 1.8%) than in control women (62.0% ± 2.0%) (p < 0.0001)."
    explanation: Quantifies the C1 esterase inhibitor deficit against pregnant controls in 106 registry cases.
  - reference: PMID:24561565
    reference_title: C1 esterase inhibitor activity in amniotic fluid embolism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "C1 esterase inhibitor activity levels in fatal amniotic fluid embolism cases (22.5% ± 3.4%) were significantly lower than those in nonfatal amniotic fluid embolism cases (32.0% ± 2.1%) (p < 0.05)."
    explanation: >
      The severity gradient - lower activity in fatal than non-fatal cases -
      which is what raises this above a bystander association.
  - reference: PMID:24561565
    reference_title: C1 esterase inhibitor activity in amniotic fluid embolism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "C1 esterase inhibitor is a major inhibitor of C1 esterase and can inhibit plasma kallikrein and also factors XIIa and XIa."
    explanation: Establishes the shared regulator linking the complement arm to contact-system and coagulation activation.
  downstream:
  - target: Pulmonary Vasoconstriction and Acute Pulmonary Hypertension
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - anaphylactoid_immune_response
    description: >
      Complement activation is proposed to drive the immune cell activation that
      initiates the fatal cascade, but the intermediates between an anaphylatoxin
      and a constricted pulmonary artery are not identified in the cited
      evidence, so the edge is typed INDIRECT_UNKNOWN_INTERMEDIATES.
    evidence:
    - reference: PMID:24865116
      reference_title: "Incidence, diagnosis and pathophysiology of amniotic fluid embolism."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Immune cell activation induced through complement activation may be associated with the mechanism that immediately initiates maternal death, only in susceptible individuals."
      explanation: >
        PARTIAL and INDIRECT together: the source says "may be associated with",
        and names no intermediate step.
  - target: Hyperfibrinolysis Uncoupled from Coagulation Activation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - anaphylactoid_immune_response
    description: >
      Thrombin-activatable fibrinolysis inhibitor also inhibits complement C3a and
      C5a, so its depletion in amniotic fluid embolism is interpreted by the
      source as consumption in suppressing activated complement. If that reading
      is right, complement activation is a cause of the fibrinolytic defect
      rather than a parallel finding - which is the strongest available link
      between the immune and coagulation arms of this disease.
    evidence:
    - reference: PMID:38168649
      reference_title: Comparative analysis of hyperfibrinolysis with activated coagulation between amniotic fluid embolism and severe placental abruption.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "As TAFI and TAFIa are also inhibitors of complement C3a and C5a16, the decrease of total TAFI may be associated with consumption to suppress the activated complement system"
      explanation: >
        PARTIAL - the authors offer this as an interpretation of their own
        measurement ("may be associated with"), not as a demonstrated mechanism.

- name: Pulmonary Mast Cell Degranulation
  biological_scale: CELLULAR
  description: >
    A contested node, retained because the disagreement is itself informative.
    Autopsy immunohistochemistry finds increased pulmonary mast cell numbers in
    fatal amniotic fluid embolism, at levels comparable to anaphylactic deaths and
    far above traumatic controls, with extracellular tryptase indicating
    degranulation. But serum tryptase in living or recently deceased patients is
    inconsistent - normal in some fatal cases, and negative in a controlled series
    that also measured urinary histamine. The honest reading is that mast cell
    degranulation occurs in the lung in fatal cases without being established as
    a driver of the syndrome, and it is certainly not a usable diagnostic marker.
  cell_types:
  - preferred_term: mast cell
    term:
      id: CL:0000097
      label: mast cell
  biological_processes:
  - preferred_term: mast cell degranulation
    term:
      id: GO:0043303
      label: mast cell degranulation
    modifier: INCREASED
  evidence:
  - reference: PMID:25807263
    reference_title: "Amniotic fluid embolism pathophysiology suggests the new diagnostic armamentarium."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These studies, therefore, highlight that mast cell degranulation occurs in the lungs of AFE fatal cases, whereas it does not occur in other fatal pregnancies."
    explanation: The positive histological evidence, with a pregnancy-matched comparison group.
  - reference: PMID:25807263
    reference_title: "Amniotic fluid embolism pathophysiology suggests the new diagnostic armamentarium."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "the results obtained were negative for serum tryptase and urinary histamine measurements in women with AFE"
    explanation: >
      The controlled negative series. Recorded as REFUTE and kept on the same
      node as the supporting evidence, because splitting them across nodes would
      hide the contradiction rather than curate it.
  - reference: PMID:25807263
    reference_title: "Amniotic fluid embolism pathophysiology suggests the new diagnostic armamentarium."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "However, other reports of AFE cases, in which serum tryptase was detected, gave discordant results to the anaphylactic hypothesis."
    explanation: The review's own summary that the serological arm of the anaphylactic hypothesis is discordant.
  downstream:
  - target: Pulmonary Vasoconstriction and Acute Pulmonary Hypertension
    causal_link_type: UNKNOWN
    hypothesis_groups:
    - anaphylactoid_immune_response
    description: >
      Mast cell mediators are vasoactive and would plausibly contribute to
      pulmonary vasoconstriction, but no cited source demonstrates that step in
      this disease. Typed UNKNOWN deliberately: the alternative was to omit the
      edge and lose the claim, or type it DIRECT and assert a mechanism nobody
      has shown.
    evidence:
    - reference: PMID:25807263
      reference_title: "Amniotic fluid embolism pathophysiology suggests the new diagnostic armamentarium."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Mast cells have a key role in inflammatory and immediate allergic reactions."
      explanation: >
        Supports only the general vasoactive/inflammatory role of the cell type.
        This is why the edge is UNKNOWN rather than DIRECT.

- name: Mechanical Obstruction of the Maternal Pulmonary Microvasculature
  biological_scale: TISSUE
  description: >
    The alternative arm. Fetal squamous cells, lanugo hairs, vernix and mucin
    lodged in the maternal pulmonary microcirculation, obstructing flow. The
    material is demonstrably there at autopsy; what is contested is whether its
    presence causes the syndrome or merely accompanies it, and its former status
    as a pathognomonic diagnostic criterion has been withdrawn.
  cell_types:
  - preferred_term: blood vessel endothelial cell
    term:
      id: CL:0000071
      label: blood vessel endothelial cell
  evidence:
  - reference: PMID:24888909
    reference_title: "Amniotic fluid embolism: pathophysiology and new strategies for management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the fetal materials create physical obstructions in the maternal microvessels in various organs, such as the lung"
    explanation: States the obstruction mechanism this node represents, as one of two etiologies recognised by the Japanese registry.
  - reference: PMID:26703453
    reference_title: "Amniotic fluid embolism: an Australian-New Zealand population-based study."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "as a post mortem diagnosis (presence of fetal squames/debris in the pulmonary circulation)"
    explanation: >
      Confirms fetal material in the pulmonary circulation is a recognised
      post-mortem finding. PARTIAL because being a diagnostic criterion is not
      evidence that obstruction is the operative mechanism.
  downstream:
  - target: Pulmonary Vasoconstriction and Acute Pulmonary Hypertension
    causal_link_type: DIRECT
    hypothesis_groups:
    - mechanical_embolic_obstruction
    description: >
      Under this model raised pulmonary vascular resistance is produced by
      physical occlusion of the bed rather than by vasospasm. The two hypotheses
      converge here on the same downstream node, which is why the haemodynamic
      sequence is the same under either account.
    evidence:
    - reference: PMID:24888909
      reference_title: "Amniotic fluid embolism: pathophysiology and new strategies for management."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "there were two etiologies of AFE: the fetal materials create physical obstructions in the maternal microvessels in various organs, such as the lung"
      explanation: >
        PARTIAL: the source establishes obstruction of pulmonary microvessels but
        does not itself measure the resulting pulmonary vascular resistance.

- name: Pulmonary Vasoconstriction and Acute Pulmonary Hypertension
  biological_scale: TISSUE
  description: >
    The convergence point of both hypotheses and the first step of the stereotyped
    haemodynamic sequence: pulmonary vascular resistance rises acutely. This is
    the node that makes the ordering of events clinically actionable, because
    everything downstream is right-heart failure before it is left-heart failure.
  biological_processes:
  - preferred_term: vasoconstriction
    term:
      id: GO:0042310
      label: vasoconstriction
    modifier: INCREASED
    temporality: ACUTE
  evidence:
  - reference: PMID:33345954
    reference_title: "Amniotic fluid embolism syndrome: analysis of the Unites States International Registry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Available evidence suggests that the hemodynamic response to AFE initially presents with increased pulmonary vascular resistance, and right ventricular failure, followed by left ventricular dysfunction."
    explanation: >
      The single sentence that establishes the whole ordered haemodynamic
      sequence curated in the next three nodes.
  downstream:
  - target: Acute Right Ventricular Failure
    causal_link_type: DIRECT
    description: >
      A pressure load imposed suddenly on a ventricle unadapted to it. The right
      ventricle fails before the left, and in that order.
    evidence:
    - reference: PMID:33345954
      reference_title: "Amniotic fluid embolism syndrome: analysis of the Unites States International Registry."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "initially presents with increased pulmonary vascular resistance, and right ventricular failure, followed by left ventricular dysfunction"
      explanation: States the sequence from raised pulmonary vascular resistance to right ventricular failure.
  - target: Acute Hypoxaemic Respiratory Failure
    causal_link_type: DIRECT
    description: >
      Loss of effective pulmonary perfusion produces acute hypoxaemia, which
      together with hypotension and coagulopathy forms the diagnostic triad.
    evidence:
    - reference: PMID:28188959
      reference_title: "Amniotic fluid embolism: Pathophysiology from the perspective of pathology."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "characterized by the abrupt onset of hypoxia, hypotension, seizures, or disseminated intravascular coagulopathy (DIC), occurring during labor, delivery, or immediately postpartum"
      explanation: Names abrupt hypoxia as a defining feature of the syndrome and its timing.

- name: Acute Right Ventricular Failure
  biological_scale: TISSUE
  description: >
    The right ventricle, acutely pressure-loaded, dilates and fails. This is the
    node with the most direct therapeutic consequence in the entry: it is
    identifiable at the bedside by echocardiography, and identifying it changes
    management, because a failing right ventricle is supported with inotropes,
    pulmonary vasodilators and vasopressors rather than with fluid.
  evidence:
  - reference: PMID:31376394
    reference_title: "Amniotic fluid embolism: principles of early clinical management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we recommend performing transthoracic or transesophageal echocardiography as soon as possible because this is an easy and reliable method of identifying a failing right ventricle"
    explanation: Establishes right ventricular failure as a discrete, detectable state central to early management.
  downstream:
  - target: Left Ventricular Dysfunction and Cardiovascular Collapse
    causal_link_type: DIRECT
    description: >
      Right ventricular failure is followed by left ventricular dysfunction; the
      registry evidence states the order rather than leaving it to inference.
    evidence:
    - reference: PMID:33345954
      reference_title: "Amniotic fluid embolism syndrome: analysis of the Unites States International Registry."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "right ventricular failure, followed by left ventricular dysfunction"
      explanation: States the temporal ordering that this edge encodes.

- name: Left Ventricular Dysfunction and Cardiovascular Collapse
  biological_scale: ORGANISM
  description: >
    Systemic circulatory failure - profound hypotension progressing in many cases
    to cardiac arrest. This is the presentation that brings the diagnosis to
    mind, and the reason resuscitation rather than diagnosis is the first action.
  evidence:
  - reference: PMID:33345954
    reference_title: "Amniotic fluid embolism syndrome: analysis of the Unites States International Registry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The classic clinical signs of AFE, including peripartum respiratory distress, hypoxia, profound hypotension, cardiovascular collapse, and disseminated intravascular coagulopathy"
    explanation: Names cardiovascular collapse and profound hypotension among the consistent clinical features.
  - reference: PMID:32157417
    reference_title: "Amniotic fluid embolism-associated coagulopathy: a single-center observational study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is characterized by cardiovascular compromise, loss of consciousness or other neurologic symptoms, and coagulopathy."
    explanation: Independent statement of the cardiovascular-neurologic-coagulopathic triad.
  downstream:
  - target: Hypoxic-Ischaemic Maternal Organ Injury
    causal_link_type: DIRECT
    description: >
      Global hypoperfusion during collapse and arrest is what produces the
      neurological injury seen in survivors.
    evidence:
    - reference: PMID:21126320
      reference_title: Amniotic fluid embolism in an Australian population-based cohort.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "survivors were at increased risk of cerebral infarction"
      explanation: Documents ischaemic brain injury as a measured outcome in population-level survivors.
  - target: Fetal Hypoxia Secondary to Maternal Circulatory Failure
    causal_link_type: DIRECT
    description: >
      With the fetus still in utero, maternal circulatory failure is transmitted
      directly to the uteroplacental circulation. This is the two-organism step:
      the lesion is entirely maternal and the injury is fetal.
    evidence:
    - reference: PMID:24402585
      reference_title: Amniotic fluid embolism.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "prompt delivery of the mother who has sustained cardiopulmonary arrest is critical for improved newborn outcome"
      explanation: >
        The clinical corollary of this edge: newborn outcome depends on
        removing the fetus from the failing maternal circulation.

- name: Coagulation Activation and Fibrinogen Consumption
  biological_scale: ORGANISM
  conforms_to: "thrombogenesis#Coagulation Cascade Activation and Thrombin-Driven Fibrin Formation"
  description: >
    Systemic activation of coagulation with thrombin generation and consumption of
    fibrinogen. Prothrombin fragment 1+2 - a direct marker of thrombin generation
    - is markedly raised, Clauss fibrinogen falls to very low values and D-dimer
    rises. Disseminated intravascular coagulation is documented in 83-100% of
    reported cases regardless of delivery mode, which makes it a defining arm of
    the syndrome rather than a complication of some presentations.

    This node declares conformance to the thrombogenesis module's coagulation
    cascade node and to no other node in that module - see the discussion on why
    the thrombus-formation node is deliberately not claimed.
  biological_processes:
  - preferred_term: blood coagulation
    term:
      id: GO:0007596
      label: blood coagulation
    modifier: INCREASED
    temporality: ACUTE
  cell_types:
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  evidence:
  - reference: PMID:33345954
    reference_title: "Amniotic fluid embolism syndrome: analysis of the Unites States International Registry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In all registries and research reports, 83–100% of patients demonstrated laboratory abnormalities or clinical findings consistent with DIC, regardless of mode of delivery."
    explanation: Establishes the coagulopathy as near-universal and independent of delivery mode.
  - reference: PMID:38168649
    reference_title: Comparative analysis of hyperfibrinolysis with activated coagulation between amniotic fluid embolism and severe placental abruption.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found that AFE and sPA patients had low platelet counts as well as disturbed coagulation function due to the very low values of Clauss fibrinogen with elevated D-dimer levels compared to the control group"
    explanation: The measured coagulation profile - fibrinogen consumption with raised D-dimer - underlying this node.
  - reference: PMID:38168649
    reference_title: Comparative analysis of hyperfibrinolysis with activated coagulation between amniotic fluid embolism and severe placental abruption.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both AFE and sPA were associated with activation of coagulation and massive fibrinolysis"
    explanation: >
      The thrombin-generation half of the finding, and the basis for the
      thrombogenesis module conformance declared on this node.
  downstream:
  - target: Haemostatic Failure and Obstetric Haemorrhage
    causal_link_type: DIRECT
    description: >
      Consumption of fibrinogen and clotting factors leaves the uterus unable to
      achieve haemostasis after delivery.
    evidence:
    - reference: PMID:24888909
      reference_title: "Amniotic fluid embolism: pathophysiology and new strategies for management."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "the other involves the presence of disseminated intravascular coagulation (DIC) and atonic bleeding"
      explanation: Pairs the coagulopathy with atonic bleeding as the presentation of this arm.

- name: Hyperfibrinolysis Uncoupled from Coagulation Activation
  biological_scale: ORGANISM
  description: >
    The mechanistically distinctive finding of this entry, and the reason
    amniotic fluid embolism coagulopathy is not simply "severe DIC". In a direct
    comparison with severe placental abruption - a disease matched for
    coagulation activation, fibrinogen depletion and D-dimer rise - fibrinolytic
    activation in amniotic fluid embolism was hyperactive and did *not* correlate
    with coagulation activation, whereas in abruption the two were positively
    correlated. Tissue plasminogen activator was higher and total
    thrombin-activatable fibrinolysis inhibitor lower than in either abruption or
    controls. Bedside serial testing shows the same picture from the other side:
    fibrinogen and factor V disproportionately low and D-dimers exorbitant while
    platelets and antithrombin - the markers of pure consumption - are only
    slightly reduced.

    The therapeutic consequence is direct: it is the rationale for early
    antifibrinolytic therapy alongside factor replacement, rather than factor
    replacement alone.
  biological_processes:
  - preferred_term: fibrinolysis
    term:
      id: GO:0042730
      label: fibrinolysis
    modifier: INCREASED
    temporality: ACUTE
  evidence:
  - reference: PMID:38168649
    reference_title: Comparative analysis of hyperfibrinolysis with activated coagulation between amniotic fluid embolism and severe placental abruption.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we found that fibrinolysis in AFE showed hyperactivation without correlating to the enhanced coagulation, compared to the significant positive correlation between activated coagulation and hyperfibrinolysis in sPA"
    explanation: >
      The uncoupling itself, established against a disease-matched comparator
      rather than against healthy controls - which is what makes it specific to
      amniotic fluid embolism rather than generic to obstetric DIC.
  - reference: PMID:38168649
    reference_title: Comparative analysis of hyperfibrinolysis with activated coagulation between amniotic fluid embolism and severe placental abruption.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The contribution of a significant increase of tPA on producing plasmin in plasma, as well as decrease of TAFI and/or TAFIa may combine to promote fibrinolytic hyperactivity"
    explanation: >
      Names the two measured components - raised tissue plasminogen activator and
      depleted TAFI - proposed to produce the hyperfibrinolytic state.
  - reference: PMID:32157417
    reference_title: "Amniotic fluid embolism-associated coagulopathy: a single-center observational study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Disproportionately low levels of fibrinogen and factor five, and exorbitantly elevated D-dimers were present in all cases, whereas markers of consumptive coagulopathy, platelets and antithrombin in particular, were only slightly reduced."
    explanation: >
      Independent bedside confirmation, and the sharpest statement of why this is
      not adequately described as consumptive coagulopathy.
  - reference: PMID:32157417
    reference_title: "Amniotic fluid embolism-associated coagulopathy: a single-center observational study."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Our results support hyperfibrinolysis as contributing factor of AFE-associated coagulopathy."
    explanation: >
      PARTIAL because the authors claim a contributing factor from three cases,
      not an established primary mechanism.
  downstream:
  - target: Haemostatic Failure and Obstetric Haemorrhage
    causal_link_type: DIRECT
    description: >
      Premature lysis of formed clot compounds factor consumption, so bleeding
      continues even where coagulation factors are replaced.
    evidence:
    - reference: PMID:32157417
      reference_title: "Amniotic fluid embolism-associated coagulopathy: a single-center observational study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "we, therefore, propose a treatment algorithm which includes early use of tranexamic acid and transfusion of red blood cells and fresh frozen plasma, adding fibrinogen if hemostasis is not readily achieved"
      explanation: >
        The therapeutic inference the authors draw, which presupposes that
        hyperfibrinolysis is contributing to the failure of haemostasis.

- name: Haemostatic Failure and Obstetric Haemorrhage
  biological_scale: ORGANISM
  description: >
    Clinical bleeding, typically atonic postpartum haemorrhage compounded by an
    inability to form stable clot. This is the arm that drives transfusion,
    hysterectomy and much of the non-fatal morbidity, and it is the reason the
    guideline recommendation is to assess clotting status early rather than after
    bleeding is established.
  evidence:
  - reference: PMID:26987420
    reference_title: "Amniotic fluid embolism: diagnosis and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "because coagulopathy may follow cardiovascular collapse with amniotic fluid embolism, we recommend the early assessment of clotting status and early aggressive management of clinical bleeding with standard massive transfusion protocols"
    explanation: Establishes clinical bleeding as an expected consequence requiring pre-emptive management.
  - reference: PMID:26703453
    reference_title: "Amniotic fluid embolism: an Australian-New Zealand population-based study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "18% (n = 6) had a hysterectomy and 85% (n = 28) received a transfusion of blood or blood products"
    explanation: Quantifies the haemorrhagic burden at population level - most patients transfused, nearly a fifth hysterectomised.

- name: Acute Hypoxaemic Respiratory Failure
  biological_scale: ORGANISM
  description: >
    Abrupt hypoxaemia with dyspnoea, cyanosis and in severe cases respiratory
    arrest, frequently progressing to acute respiratory distress syndrome in
    survivors of the initial event. Hypoxia is one of the three cardinal
    diagnostic features alongside hypotension and coagulopathy.
  evidence:
  - reference: PMID:25807263
    reference_title: "Amniotic fluid embolism pathophysiology suggests the new diagnostic armamentarium."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "acute hypoxia (with dyspnoea, cyanosis and/or respiratory arrest)"
    explanation: Names the respiratory presentation and its component signs.
  - reference: PMID:35840499
    reference_title: Acute respiratory distress and amniotic fluid embolism in pregnancy.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "it is more often related to acute respiratory distress syndrome from obstetric complications"
    explanation: >
      PARTIAL: places amniotic fluid embolism among the obstetric causes of
      maternal ARDS without quantifying its contribution.
  downstream:
  - target: Hypoxic-Ischaemic Maternal Organ Injury
    causal_link_type: DIRECT
    description: >
      Failure of oxygenation compounds the perfusion failure in producing organ
      injury, particularly neurological.
    evidence:
    - reference: PMID:28188959
      reference_title: "Amniotic fluid embolism: Pathophysiology from the perspective of pathology."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "the abrupt onset of hypoxia, hypotension, seizures, or disseminated intravascular coagulopathy"
      explanation: >
        PARTIAL: the syndrome definition places hypoxia and seizures together
        without asserting that one causes the other.

- name: Hypoxic-Ischaemic Maternal Organ Injury
  biological_scale: ORGANISM
  role: OUTCOME
  description: >
    The end state in survivors: neurological injury from the arrest and
    hypoperfusion, ranging from seizures and coma at presentation to cerebral
    infarction and permanent deficit. Neurologically intact survival, not
    survival, is the meaningful outcome measure in this disease - the two figures
    differ substantially in every registry that reports both.
  evidence:
  - reference: PMID:7726251
    reference_title: "Amniotic fluid embolism: analysis of the national registry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Maternal mortality was 61%, with neurologically intact survival seen in 15% of women."
    explanation: >
      The original registry figures, and the clearest demonstration that survival
      and intact survival are different quantities.
  - reference: PMID:21126320
    reference_title: Amniotic fluid embolism in an Australian population-based cohort.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "survivors were at increased risk of cerebral infarction"
    explanation: Population-level evidence of ischaemic brain injury as a survivor outcome.

- name: Fetal Hypoxia Secondary to Maternal Circulatory Failure
  biological_scale: ORGANISM
  role: OUTCOME
  description: >
    Where the fetus is in utero at the time of the event, maternal circulatory
    collapse is transmitted to the uteroplacental circulation and produces acute
    fetal hypoxaemia and acidaemia. The lesion is wholly maternal and the injury
    wholly fetal, which is why the therapeutic response - immediate delivery -
    treats the fetus by separating it from the maternal circulation rather than
    by treating anything in the fetus.
  evidence:
  - reference: PMID:33345954
    reference_title: "Amniotic fluid embolism syndrome: analysis of the Unites States International Registry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A total of 30 newborns (51%) born to women with typical AFE had Apgar scores < 7 at 1 minute and were acidemic (mean arterial pH was 6.95)."
    explanation: Quantifies the fetal insult - half of newborns depressed and acidaemic, with a profoundly low mean arterial pH.
  - reference: PMID:7726251
    reference_title: "Amniotic fluid embolism: analysis of the national registry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of fetuses in utero at the time of the event, only 39% survived."
    explanation: >
      The historical fetal survival figure, and the reason this node is curated
      separately from the maternal outcome node.


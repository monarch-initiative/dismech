  rate_high: 7.2
  notes: Prospective AMOSS surveillance in 2010–2011 recorded 33 cases among an estimated 613,731 women giving birth. Site participation increased during rollout, and denominators were adjusted for active days. Case criteria included clinical cardiopulmonary/coagulation findings or postmortem findings. The denominator is women giving birth, not person-time; BIRTH_PREVALENCE is used for the available birth-based measure, not congenital prevalence.
  evidence:

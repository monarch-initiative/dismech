- name: Inotropic Support
  therapeutic_modality: SMALL_MOLECULE
  description: Use echo-guided inotropic support for significant ventricular dysfunction. Dobutamine or milrinone may be selected by the critical-care team; no comparative AFE drug trial establishes a universally preferred agent.
  evidence:
  - reference: PMID:42730345

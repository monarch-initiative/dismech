  preferred_term: amniotic fluid embolism
  term:
    id: MONDO:0850046
    label: amniotic fluid embolism
parents:
- Pregnancy disorder
- Obstetric emergency
- Peripartum cardiovascular collapse

clinical_burden:
  burden_level: HIGH
  rationale: >
    Amniotic fluid embolism is rare - roughly 3 to 6 cases per 100,000 deliveries
    across contemporary population studies - but it is a leading direct cause of
    maternal death in high-income countries, it is unpredictable and
    unpreventable, and survivors carry substantial morbidity including
    hysterectomy, cerebral infarction and post-traumatic stress. The burden is
    compounded by the absence of any disease-modifying treatment and by the
    absence of a diagnostic test.
  evidence:
  - reference: PMID:26703453
    reference_title: "Amniotic fluid embolism: an Australian-New Zealand population-based study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Amniotic fluid embolism (AFE) is a major cause of direct maternal mortality in Australia and New Zealand."
    explanation: States the population-level burden as a leading direct cause of maternal death.
  - reference: PMID:33345954
    reference_title: "Amniotic fluid embolism syndrome: analysis of the Unites States International Registry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "AFE remains both unpredictable and unpreventable."
    explanation: >
      The registry authors' own summary of why the burden cannot presently be
      reduced by changing obstetric practice.
  - reference: PMID:28188959
    reference_title: "Amniotic fluid embolism: Pathophysiology from the perspective of pathology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A major concern is that there are no effective evidence-based therapies for AFE, because its pathophysiology is still not well understood."
    explanation: States the absence of disease-modifying therapy that amplifies the burden.


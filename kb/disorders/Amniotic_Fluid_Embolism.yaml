  therapeutic_modality: SMALL_MOLECULE
  description: The 2026 SMFM checklist includes tranexamic acid for AFE-associated DIC or hemorrhage. It suppresses fibrinolysis and accompanies blood-product resuscitation and source control. The observational AFE biomarker study did not test treatment efficacy; do not infer an AFE-specific survival effect from its mechanistic rationale.

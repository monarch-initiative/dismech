treatments:
- name: Immediate High-Quality Cardiopulmonary Resuscitation
  description: >
    Because amniotic fluid embolism usually presents with cardiac arrest, standard
    basic and advanced cardiac life support is the first action - before, not
    after, any attempt at diagnosis.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: resuscitation
    term:
      id: NCIT:C50822
      label: Resuscitation
  target_mechanisms:
  - target: Left Ventricular Dysfunction and Cardiovascular Collapse
    treatment_effect: MODULATES
    description: >
      Mechanical circulatory support sustains perfusion through the collapse; it
      does not act on any upstream step, which is why the effect is MODULATES
      rather than INHIBITS.
    evidence:
    - reference: PMID:26987420
      reference_title: "Amniotic fluid embolism: diagnosis and management."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "we recommend the provision of immediate high-quality cardiopulmonary resuscitation with standard basic cardiac life support and advanced cardiac life support protocols in patients who develop cardiac arrest associated with amniotic fluid embolism"
      explanation: The graded guideline recommendation for this intervention against this node.
  evidence:
  - reference: PMID:24402585
    reference_title: Amniotic fluid embolism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Maternal treatment is primarily supportive"
    explanation: Establishes that the maternal treatment strategy as a whole is supportive rather than mechanism-directed.
- name: Vasopressor and Inotropic Support Directed at the Failing Right Ventricle
  description: >
    Blood-pressure support with vasopressors, and inotropes plus pulmonary
    vasodilators where echocardiography shows right ventricular failure.
    Volume loading is explicitly deprecated in severe right ventricular
    compromise, which is the practical payoff of curating the haemodynamic
    sequence in the right order.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: noradrenaline
      term:
        id: CHEBI:33569
        label: noradrenaline
    - preferred_term: milrinone
      term:
        id: CHEBI:50693
        label: milrinone
  target_mechanisms:
  - target: Acute Right Ventricular Failure
    treatment_effect: MODULATES
    description: >
      Inotropic support acts on the failing right ventricle specifically, which is
      the node echocardiography identifies.
    evidence:
    - reference: PMID:31376394
      reference_title: "Amniotic fluid embolism: principles of early clinical management."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "If such failure is identified, treatment that is tailored at improving right ventricular performance should be initiated with the use of inotropic agents and pulmonary vasodilators."
      explanation: Directs inotropes and pulmonary vasodilators specifically at right ventricular failure.
  evidence:
  - reference: PMID:31376394
    reference_title: "Amniotic fluid embolism: principles of early clinical management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Blood pressure support with vasopressors is preferred over fluid infusion in the setting of severe right ventricular compromise."
    explanation: >
      The negative half of the recommendation - vasopressors rather than fluid -
      which is what makes identifying the right ventricle worth doing.
  - reference: PMID:26987420
    reference_title: "Amniotic fluid embolism: diagnosis and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the use of vasopressors and inotropic agents in the initial management of amniotic fluid embolism. Excessive fluid administration should be avoided"
    explanation: Independent guideline statement of the same recommendation and the same caution against fluid.
- name: Pulmonary Vasodilator Therapy
  description: >
    Inhaled or systemic pulmonary vasodilators to unload the right ventricle by
    reducing pulmonary vascular resistance. This is the one intervention in the
    entry that acts on a node upstream of the collapse rather than supporting the
    patient through it.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: inhaled nitric oxide
      term:
        id: CHEBI:16480
        label: nitric oxide
  target_mechanisms:
  - target: Pulmonary Vasoconstriction and Acute Pulmonary Hypertension
    treatment_effect: INHIBITS
    description: >
      Pulmonary vasodilation opposes the vasoconstriction that initiates the
      haemodynamic sequence.
    evidence:
    - reference: PMID:31376394
      reference_title: "Amniotic fluid embolism: principles of early clinical management."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "treatment that is tailored at improving right ventricular performance should be initiated with the use of inotropic agents and pulmonary vasodilators"
      explanation: >
        Names pulmonary vasodilators as an intervention in this setting. Note the
        source states the recommendation, not a measured reduction in pulmonary
        vascular resistance in this disease.
- name: Haemostatic Resuscitation with Massive Transfusion Protocol
  description: >
    Balanced 1:1:1 replacement of packed red cells, fresh frozen plasma and
    platelets, with cryoprecipitate as needed to hold fibrinogen above roughly
    150-200 mg/dL. Guidelines direct that clotting status be assessed early
    rather than after bleeding is established.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: blood transfusion
    term:
      id: NCIT:C15192
      label: Blood Transfusion
  target_mechanisms:
  - target: Haemostatic Failure and Obstetric Haemorrhage
    treatment_effect: RESTORES
    description: >
      Replacement of consumed factors and platelets restores the capacity to form
      clot; it does not address why they were consumed.
    evidence:
    - reference: PMID:31376394
      reference_title: "Amniotic fluid embolism: principles of early clinical management."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Amniotic fluid embolism-related coagulopathy should be managed with hemostatic resuscitation with the use of a 1:1:1 ratio of packed red cells, fresh frozen plasma, and platelets (with cryoprecipitate as needed to maintain a serum fibrinogen of >150-200 mg/dL)."
      explanation: The specific replacement strategy and the fibrinogen target it is titrated to.
  evidence:
  - reference: PMID:26987420
    reference_title: "Amniotic fluid embolism: diagnosis and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we recommend the early assessment of clotting status and early aggressive management of clinical bleeding with standard massive transfusion protocols"
    explanation: The graded guideline recommendation for early haemostatic assessment and massive transfusion.
- name: Tranexamic Acid
  description: >
    Antifibrinolytic therapy, proposed early in the treatment algorithm on the
    basis that the coagulopathy is hyperfibrinolytic and not purely consumptive.
    This is the one pharmacological intervention in the entry whose rationale
    follows from a specific mechanistic finding rather than from generic
    resuscitation practice - but the supporting evidence is a three-case
    observational series proposing an algorithm, not a trial, and it should be
    read that way.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: tranexamic acid
      term:
        id: CHEBI:48669
        label: tranexamic acid
  target_mechanisms:
  - target: Hyperfibrinolysis Uncoupled from Coagulation Activation
    treatment_effect: INHIBITS
    description: >
      Tranexamic acid inhibits fibrinolysis, which is the node the authors invoke
      to justify placing it early in the algorithm.
    evidence:
    - reference: PMID:32157417
      reference_title: "Amniotic fluid embolism-associated coagulopathy: a single-center observational study."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Our results support hyperfibrinolysis as contributing factor of AFE-associated coagulopathy. We, therefore, propose a treatment algorithm which includes early use of tranexamic acid"
      explanation: >
        PARTIAL deliberately. The authors propose the algorithm from their
        mechanistic finding; no outcome trial of tranexamic acid in amniotic
        fluid embolism is cited, so this edge records a rationale, not a
        demonstrated benefit.
- name: Immediate Delivery Following Maternal Cardiac Arrest
  description: >
    Delivery of a fetus at 23 weeks or beyond immediately after maternal cardiac
    arrest. It is directed at the fetus - separating it from a failed maternal
    circulation - and is the only intervention in this entry that treats the
    second organism.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: cesarean section
    term:
      id: NCIT:C46088
      label: Cesarean Section
  target_mechanisms:
  - target: Fetal Hypoxia Secondary to Maternal Circulatory Failure
    treatment_effect: BYPASSES
    description: >
      Delivery does not correct the maternal lesion; it removes the fetus from
      dependence on it. BYPASSES rather than INHIBITS for exactly that reason.
    evidence:
    - reference: PMID:24402585
      reference_title: Amniotic fluid embolism.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "prompt delivery of the mother who has sustained cardiopulmonary arrest is critical for improved newborn outcome"
      explanation: States the indication and, specifically, that the benefit is to the newborn.
  evidence:
  - reference: PMID:26987420
    reference_title: "Amniotic fluid embolism: diagnosis and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "following cardiac arrest with amniotic fluid embolism, we recommend immediate delivery in the presence of a fetus ≥23 weeks of gestation"
    explanation: The graded guideline recommendation, including the gestational-age threshold.
- name: Venoarterial Extracorporeal Membrane Oxygenation
  description: >
    Rescue mechanical circulatory support where cardiopulmonary resuscitation is
    prolonged, or ventricular dysfunction after arrest is refractory to medical
    management.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: extracorporeal membrane oxygenation
    term:
      id: NCIT:C171507
      label: Extracorporeal Membrane Oxygenation
  target_mechanisms:
  - target: Left Ventricular Dysfunction and Cardiovascular Collapse
    treatment_effect: BYPASSES
    description: >
      Extracorporeal support substitutes for the failed cardiopulmonary unit
      rather than acting on it.
    evidence:
    - reference: PMID:31376394
      reference_title: "Amniotic fluid embolism: principles of early clinical management."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In cases that require prolonged cardiopulmonary resuscitation or, after arrest, severe ventricular dysfunction refractory to medical management, consideration for venoarterial extracorporeal membrane oxygenation should be given."
      explanation: States the indication and the refractory-failure context.
- name: Oxygenation and Mechanical Ventilation
  description: Airway control, oxygenation and ventilation as part of initial supportive management.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: mechanical ventilation
    term:
      id: NCIT:C70909
      label: Mechanical Ventilation
  target_mechanisms:
  - target: Acute Hypoxaemic Respiratory Failure
    treatment_effect: MODULATES
    description: Ventilatory support corrects the gas-exchange failure without addressing its cause.
    evidence:
    - reference: PMID:26987420
      reference_title: "Amniotic fluid embolism: diagnosis and management."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "we recommend the provision of adequate oxygenation and ventilation"
      explanation: The guideline recommendation for ventilatory support in initial management.
- name: C1 Esterase Inhibitor Replacement (investigational)
  description: >
    Not an established therapy. It is included because it is the only
    mechanism-directed candidate in this disease that follows from a measured
    deficit with a severity gradient - C1 esterase inhibitor activity is roughly
    half of control in affected women and lower again in fatal cases - and
    because the registry group that made that measurement proposed it as a
    treatment candidate on that basis. No trial evidence is cited.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Complement Activation and C1 Esterase Inhibitor Consumption
    treatment_effect: RESTORES
    description: >
      Replacement of the consumed inhibitor would restore regulation of the
      classical complement pathway and of the contact system.
    evidence:
    - reference: PMID:24888909
      reference_title: "Amniotic fluid embolism: pathophysiology and new strategies for management."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "C1 esterase inhibitor activity in AFE cases was significantly lower than those of normal pregnant women. C1 esterase inhibitor may be a promising candidate of treatment of AFE."
      explanation: >
        PARTIAL, and deliberately not upgraded: "may be a promising candidate"
        is a proposal from an observed deficit, not evidence of therapeutic
        effect.

diagnosis:
- name: Clinical Diagnosis of Exclusion
  description: >
    Amniotic fluid embolism has no confirmatory test. Guidelines explicitly
    recommend against using any specific laboratory test to confirm or refute it,
    and every candidate biomarker studied - zinc coproporphyrin, sialyl Tn
    antigen, serum tryptase, complement C3 and C4 - has failed to prove reliable
    for prediction or diagnosis. The diagnosis is made clinically, from sudden
    cardiorespiratory collapse with coagulopathy in the peripartum window, once
    alternatives are excluded.
  evidence:
  - reference: PMID:26987420
    reference_title: "Amniotic fluid embolism: diagnosis and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we do not recommend the use of any specific diagnostic laboratory test to either confirm or refute the diagnosis of amniotic fluid embolism; at the present time, amniotic fluid embolism remains a clinical diagnosis"
    explanation: The guideline statement that there is no confirmatory test.
  - reference: PMID:33345954
    reference_title: "Amniotic fluid embolism syndrome: analysis of the Unites States International Registry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "have been studied and reported, but, to date, none appear reliable in predicting or diagnosing AFE"
    explanation: Records that the candidate biomarker programme has not produced a usable test.
- name: Echocardiographic Identification of Right Ventricular Failure
  description: >
    Not diagnostic of the syndrome, but the key management-directing
    investigation: transthoracic or transoesophageal echocardiography identifies
    the failing right ventricle, which determines whether inotropes, pulmonary
    vasodilators and vasopressors or volume are given.
  evidence:
  - reference: PMID:31376394
    reference_title: "Amniotic fluid embolism: principles of early clinical management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we recommend performing transthoracic or transesophageal echocardiography as soon as possible because this is an easy and reliable method of identifying a failing right ventricle"
    explanation: States the investigation, its timing, and what it identifies.

differential_diagnoses:
- name: Hypovolaemic shock from postpartum haemorrhage
  description: >
    The single most common alternative diagnosis in cases submitted to the US
    registry as amniotic fluid embolism - 21 of the 27 charts with a definitive
    alternative diagnosis. Distinguishing them matters mechanistically, because
    in haemorrhagic shock the coagulopathy follows the blood loss whereas here it
    accompanies the collapse.
  evidence:
  - reference: PMID:33345954
    reference_title: "Amniotic fluid embolism syndrome: analysis of the Unites States International Registry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of the 27 women misclassified as an amniotic fluid embolism with an alternative diagnosis, the most common actual diagnosis was hypovolemic shock secondary to postpartum hemorrhage."
    explanation: Quantifies this as the leading misdiagnosis in a chart-reviewed registry.
- name: Anaesthetic complication
  evidence:
  - reference: PMID:33345954
    reference_title: "Amniotic fluid embolism syndrome: analysis of the Unites States International Registry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "followed by anesthetic complications (n = 4, 14.8%) and sepsis-related cardiovascular collapse (n = 2, 7.4%)"
    explanation: Names anaesthetic complication and sepsis as the second and third alternative diagnoses in misclassified cases.
- name: Sepsis-related cardiovascular collapse
  description: >
    Particularly difficult to separate, because the haemodynamic profile of
    amniotic fluid embolism was characterised in the first place by its
    similarity to septic shock.
  evidence:
  - reference: PMID:7726251
    reference_title: "Amniotic fluid embolism: analysis of the national registry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical and hemodynamic manifestations were similar to those manifest in anaphylaxis and septic shock."
    explanation: The similarity that makes this differential intrinsically hard.
- name: Severe placental abruption with disseminated intravascular coagulation
  description: >
    Shares fibrinogen depletion, D-dimer elevation and thrombocytopenia. The
    discriminating feature in the one direct comparison is the *coupling* between
    coagulation and fibrinolysis, not the magnitude of either.
  evidence:
  - reference: PMID:38168649
    reference_title: Comparative analysis of hyperfibrinolysis with activated coagulation between amniotic fluid embolism and severe placental abruption.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both AFE and sPA were associated with activation of coagulation and massive fibrinolysis without significant difference in each plasma maker between the groups."
    explanation: >
      States that the individual coagulation markers do not separate the two
      diseases, which is why the discriminator has to be the correlation
      structure rather than any single value.

discussions:
- discussion_id: controversy_afe_mast_cell_arm
  kind: CONTROVERSY
  status: OPEN
  prompt: >
    Does mast cell degranulation contribute causally to amniotic fluid embolism,
    or is the pulmonary mast cell finding a post-mortem epiphenomenon?
  rationale: >
    The evidence splits cleanly by method rather than by quality. Pulmonary
    immunohistochemistry in fatal cases finds mast cell numbers comparable to
    anaphylactic deaths and far above traumatic controls, with extracellular
    tryptase indicating degranulation, and does not find it in other fatal
    pregnancies. Serological measurement disagrees: serum tryptase has been
    normal in fatal cases, and a controlled series measuring both serum tryptase
    and urinary histamine returned negative. This entry curates both on one node
    with opposing `supports` values rather than picking a side, and types the
    outgoing edge UNKNOWN. The distinction matters practically: if the arm is
    causal, tryptase is a candidate biomarker in a disease that has none.
  attaches_to:
  - pathophysiology#Pulmonary Mast Cell Degranulation
  proposed_experiments:
  - experiment_id: exp_afe_serial_tryptase_registry
    name: Prospectively banked serial tryptase and complement in registry-confirmed cases
    description: >
      Measure serum tryptase, complement components and C1 esterase inhibitor on
      timed samples drawn during the acute event in prospectively enrolled cases
      meeting validated research criteria, with peripartum controls. The existing
      serological studies are retrospective, variably timed, and frequently
      post-mortem - which is a sufficient explanation for the discordance on its
      own, and is exactly the confound a prospective design removes.
  evidence:
  - reference: PMID:25807263
    reference_title: "Amniotic fluid embolism pathophysiology suggests the new diagnostic armamentarium."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, other reports of AFE cases, in which serum tryptase was detected, gave discordant results to the anaphylactic hypothesis."
    explanation: The review's own acknowledgement that this arm of the evidence is discordant.
- discussion_id: interp_afe_thrombogenesis_conformance_boundary
  kind: INTERPRETATION
  status: RESOLVED
  prompt: >
    Why does this entry conform to the thrombogenesis module at the coagulation
    cascade node but not at the thrombus formation node?
  rationale: >
    The coagulation node conforms straightforwardly: prothrombin fragment 1+2 is
    markedly raised, fibrinogen is consumed and D-dimer rises, which is
    thrombin-driven fibrin formation by any reading. The thrombus formation node
    is deliberately not claimed. In amniotic fluid embolism the fibrin that forms
    is lysed as fast as it is made - fibrinolysis is hyperactive and uncoupled
    from coagulation activation - and the clinical expression is uncontrollable
    haemorrhage requiring transfusion and hysterectomy, not an occlusive
    thrombus. Claiming the thrombus node would assert a pathological structure
    that this disease characteristically fails to form, and would license
    downstream inferences about occlusion and ischaemic tissue injury that the
    evidence does not support. Recorded as RESOLVED rather than OPEN because this
    is a curation decision with a stated rationale, not an unanswered question.
  attaches_to:
  - pathophysiology#Coagulation Activation and Fibrinogen Consumption
  - pathophysiology#Hyperfibrinolysis Uncoupled from Coagulation Activation
  evidence:
  - reference: PMID:32157417
    reference_title: "Amniotic fluid embolism-associated coagulopathy: a single-center observational study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Disproportionately low levels of fibrinogen and factor five, and exorbitantly elevated D-dimers were present in all cases, whereas markers of consumptive coagulopathy, platelets and antithrombin in particular, were only slightly reduced."
    explanation: >
      The dissociation that justifies the boundary: the profile is lytic rather
      than purely consumptive, and platelets - required for the module's
      fibrin-platelet thrombus - are barely affected.
- discussion_id: gap_afe_no_diagnostic_test
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >
    Can a biomarker distinguish amniotic fluid embolism from the obstetric
    conditions it is confused with, given that every candidate tested so far has
    failed?
  rationale: >
    This gap propagates into everything else in the entry. Without a test the
    case definition is a set of clinical criteria, competing criteria sets do not
    agree with each other, and the resulting cohorts differ enough that incidence
    and mortality estimates are not comparable across studies. Nearly half the
    charts submitted to the US registry as amniotic fluid embolism did not
    survive expert review. A 2024 reappraisal reported that none of its 29 cases
    met the Clark criteria while all met the authors' own - which is a statement
    about the criteria, not about the patients. Until this is closed, every
    epidemiological and mechanistic number in this entry inherits an unquantified
    case-definition error.
  attaches_to:
  - pathophysiology#Abnormal Maternal Proinflammatory Mediator Activation
  proposed_experiments:
  - experiment_id: exp_afe_prospective_biomarker_panel
    name: Prospective multi-analyte panel against expert-adjudicated case status
    description: >
      Evaluate a combined panel - complement components, C1 esterase inhibitor
      activity, tryptase, fibrinolytic markers - in prospectively collected
      peripartum-collapse cases adjudicated by expert chart review against
      published research criteria, with the comparator being the conditions
      amniotic fluid embolism is actually confused with (postpartum haemorrhage,
      sepsis, anaesthetic complication) rather than healthy controls. Single
      analytes have been tested this way and failed; whether a combination
      separates the groups has not been established.
  evidence:
  - reference: PMID:33345954
    reference_title: "Amniotic fluid embolism syndrome: analysis of the Unites States International Registry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "our data confirm the frequent misdiagnosis of AFE; almost one-half of patients whose diagnosis was believed to be sufficiently secure to prompt submission to the national registry did not, upon careful review of medical records, have confirmed AFE"
    explanation: Quantifies the magnitude of the case-definition problem in the best-curated available series.
  - reference: PMID:38082418
    reference_title: "Amniotic fluid embolism: a reappraisal."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "None of the cases met Clark's criteria while all met our criteria."
    explanation: >
      A direct demonstration that two published criteria sets can classify the
      same 29 patients in completely opposite ways.
- discussion_id: controversy_afe_risk_factors
  kind: CONTROVERSY
  status: OPEN
  prompt: >
    Are there modifiable obstetric risk factors for amniotic fluid embolism, or
    are the reported associations artefacts of case ascertainment?
  rationale: >
    Large administrative cohorts report reproducible associations - medical
    induction of labour roughly doubling the risk, and raised risk with maternal
    age, caesarean or instrumental delivery, polyhydramnios, cervical laceration
    or uterine rupture, placenta previa or abruption and eclampsia. Chart-reviewed
    registry work reaches the opposite practical conclusion: no risk factor
    justifies modifying obstetric practice, and the disease is unpredictable and
    unpreventable. The two are not straightforwardly reconcilable, and the
    proposed explanation is methodological - administrative datasets are known to
    include substantial numbers of women who did not have the disease, which is
    precisely the population in which induction, caesarean and haemorrhage-related
    codes would cluster. The registry series does independently observe excess
    placenta previa, atopy and in-vitro fertilisation, so this entry does not
    treat all associations as artefact; it declines to convert any of them into a
    mechanism node.
  attaches_to:
  - pathophysiology#Breach of the Maternal-Fetal Physiologic Barrier
  evidence:
  - reference: PMID:17055946
    reference_title: "Amniotic-fluid embolism and medical induction of labour: a retrospective, population-based cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Medical induction of labour nearly doubled the risk of overall cases of amniotic-fluid embolism"
    explanation: The strongest population-level association claim, from a three-million-delivery cohort.
  - reference: PMID:17055946
    reference_title: "Amniotic-fluid embolism and medical induction of labour: a retrospective, population-based cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Maternal age of 35 years or older, caesarean or instrumental vaginal delivery, polyhydramnios, cervical laceration or uterine rupture, placenta previa or abruption, eclampsia, and fetal distress were also associated with an increased risk."
    explanation: The full set of associations reported by the same cohort.
  - reference: PMID:24402585
    reference_title: Amniotic fluid embolism.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Data regarding the presence of risk factors for amniotic fluid embolism are inconsistent and contradictory; at present, no putative risk factor has been identified that would justify modification of standard obstetric practice to reduce the risk of this condition."
    explanation: >
      The counter-position, from the author of the original registry. Recorded as
      REFUTE against the risk-factor claim rather than being softened - the
      disagreement is the content of this discussion.
  - reference: PMID:24402585
    reference_title: Amniotic fluid embolism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical series based on population or administrative databases that do not include individual chart review by individuals with expertise in critical care obstetrics are likely to both overestimate the incidence and underestimate the mortality of this condition by the inclusion of women who did not have amniotic fluid embolism."
    explanation: >
      The proposed methodological explanation for the disagreement, and the
      reason the prevalence records in this entry note their ascertainment method.
- discussion_id: interp_afe_misnomer
  kind: INTERPRETATION
  status: OPEN
  prompt: >
    Should the entity continue to be called amniotic fluid embolism when the
    dominant mechanistic account is not embolic?
  rationale: >
    The registry analysis that first characterised the syndrome concluded outright
    that the name is a misnomer, and proposed "anaphylactoid syndrome of
    pregnancy" instead - retained here as a synonym. The name has nonetheless
    persisted for three decades, and MONDO, ICD and every cited guideline use it.
    This is recorded because the name actively misleads: it names the alternative
    hypothesis, not the canonical one, and the historical reliance on pulmonary
    squamous cells as a pathognomonic finding - now identified as a source of
    misdiagnosis - is a direct consequence of taking the name literally.
  attaches_to:
  - pathophysiology#Mechanical Obstruction of the Maternal Pulmonary Microvasculature
  evidence:
  - reference: PMID:7726251
    reference_title: "Amniotic fluid embolism: analysis of the national registry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thus the term amniotic fluid embolism appears to be a misnomer."
    explanation: The source of the misnomer claim.

notes: >
  Curated 2026-08-17 against issue #7837 (obstetric coverage gap). No deep-research
  provider report was generated or consumed for this entry; every claim is sourced
  directly from PubMed-cached abstracts and full texts, and no source is cited that
  was not read.

  Two evidence decisions are worth flagging for reviewers. First, this entry uses
  `supports: REFUTE` twice - once for the negative tryptase/histamine series against
  the mast cell node, and once for the risk-factor counter-position - rather than
  omitting the contradicting evidence or downgrading it to PARTIAL. In both cases
  the disagreement is the substance, and hiding it would leave a cleaner but less
  truthful entry. Second, several edges are typed UNKNOWN or
  INDIRECT_UNKNOWN_INTERMEDIATES where a DIRECT edge would have read better: the
  route from complement activation to pulmonary vasoconstriction, and from mast
  cell degranulation to the same node, are asserted by no cited source.

  Two things were considered and deliberately not curated. There is no
  `environmental:` block: the candidate exposures (induction of labour, caesarean
  delivery) are obstetric interventions rather than ECTO-codeable exposures, and
  the risk-factor evidence is contested - see the risk-factor controversy. And no
  `histopathology:` block is included: fetal squames, lanugo and mucin in the
  maternal pulmonary vasculature are a genuine autopsy finding, but their
  diagnostic use has been explicitly withdrawn, and curating them as
  histopathology would re-privilege exactly the criterion the field abandoned. The
  finding is instead carried on the mechanical-obstruction node inside the
  ALTERNATIVE hypothesis group, where its epistemic status is explicit.

  Module conformance is claimed at one node only
  (`thrombogenesis#Coagulation Cascade Activation and Thrombin-Driven Fibrin
  Formation`); see the conformance-boundary discussion for why the thrombus
  formation node is not claimed.

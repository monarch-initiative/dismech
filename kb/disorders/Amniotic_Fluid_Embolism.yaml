- name: Psychological Support and Post-Event Follow-Up
  therapeutic_modality: OTHER
  description: Assess physical recovery, neurologic deficits and mental health after severe maternal illness. Offer trauma-informed support and referral for persistent post-traumatic stress or depression symptoms. Discuss subsequent pregnancies individually because reassuring small series do not establish zero recurrence risk.
  evidence:
  - reference: PMID:42730345
    reference_title: 'Society for Maternal-Fetal Medicine Special Statement: Checklist for initial management of amniotic fluid embolism-Updated 2026.'
    supports: SUPPORT

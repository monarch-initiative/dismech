- name: Avoid Routine Atropine-Ondansetron-Ketorolac Regimen
  therapeutic_modality: OTHER
  description: 'The corrected 2026 SMFM statement reports an expert recommendation against routine AOK treatment: evidence is limited to case reports and potential harms include renal dysfunction, bleeding, arrhythmia and myocardial injury. Atropine is not a routine AFE treatment in the absence of bradycardia.'

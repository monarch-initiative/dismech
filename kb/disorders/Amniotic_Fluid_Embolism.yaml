treatments:
- name: Immediate Cardiopulmonary Resuscitation
  therapeutic_modality: OTHER
  description: For cardiac arrest, begin high-quality CPR and standard advanced life support immediately while the obstetric emergency team responds; diagnosis must not delay resuscitation. Relieve aortocaval compression with manual lateral uterine displacement. The 2016 SMFM recommendation was GRADE 1C; the 2026 checklist reinforces pregnancy-specific resuscitation.
  evidence:
  - reference: PMID:26987420
    reference_title: 'Amniotic fluid embolism: diagnosis and management.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: we recommend the provision of immediate high-quality cardiopulmonary resuscitation with standard basic cardiac life support and advanced cardiac life support protocols in patients who develop cardiac arrest associated with amniotic fluid embolism
  - reference: PMID:42730345
    reference_title: 'Society for Maternal-Fetal Medicine Special Statement: Checklist for initial management of amniotic fluid embolism-Updated 2026.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Priorities for pregnant people in cardiac arrest should include the provision of high‐quality cardiopulmonary resuscitation (CPR) and relief of aortocaval compression with lateral uterine displacement

name: Amniotic Fluid Embolism
creation_date: '2026-08-17T09:00:00Z'
category: Complex
synonyms:
- AFE
- Anaphylactoid syndrome of pregnancy
description: Amniotic fluid embolism is a rare peripartum syndrome of sudden respiratory compromise, cardiovascular collapse and coagulopathy. Presentation and timing vary with the case definition; cardiac arrest occurs in many, but not all, cases. Abnormal maternal inflammatory responses to material from the fetal compartment are proposed, but the initiating exposure, susceptibility factors and causal mediator sequence remain unresolved. Pulmonary hypertension and acute right ventricular dysfunction can reduce systemic blood flow; left ventricular dysfunction and pulmonary edema may follow. Coagulation activation and excessive fibrinolysis contribute to severe bleeding, without establishing that thrombosis is absent. Diagnosis remains clinical, with urgent exclusion of alternative causes of maternal collapse. Treatment centers on resuscitation, hemodynamic and respiratory support, correction of bleeding and coagulopathy, and resuscitative delivery when indicated.
disease_term:
  preferred_term: amniotic fluid embolism
  term:
    id: MONDO:0850046
    label: amniotic fluid embolism
parents:
- Pregnancy disorder
- Obstetric emergency
- Peripartum cardiovascular collapse
clinical_burden:
  burden_level: HIGH
  rationale: Although rare, AFE can cause maternal death, emergency hysterectomy, critical illness, neurologic injury and substantial psychological morbidity. Population estimates and survival differ with ascertainment and diagnostic criteria. There is no validated screening test or established prevention strategy; treatment requires a coordinated emergency response.
  evidence:
  - reference: PMID:26703453
    reference_title: 'Amniotic fluid embolism: an Australian-New Zealand population-based study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Five woman died (case fatality rate 15%)
    explanation: Five deaths among 33 prospectively reported cases; not a universal mortality rate.
  - reference: PMID:42730345
    reference_title: 'Society for Maternal-Fetal Medicine Special Statement: Checklist for initial management of amniotic fluid embolism-Updated 2026.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: the need for psychological and emotional support for the patient, family members, and clinical staff should be recognized.

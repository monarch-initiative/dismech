- name: Venoarterial Extracorporeal Membrane Oxygenation
  therapeutic_modality: DEVICE
  description: Consider VA-ECMO for prolonged arrest or severe ventricular failure refractory to medical management at an experienced center. Coagulopathy does not automatically exclude support, but cannulation and anticoagulation require individualized bleeding-risk management. Published cases are selected and cannot establish comparative survival benefit.
  evidence:
  - reference: PMID:31376394
    reference_title: 'Amniotic fluid embolism: principles of early clinical management.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS

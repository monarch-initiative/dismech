- name: C1 Esterase Inhibitor Replacement (Investigational)
  therapeutic_modality: OTHER
  description: Reduced endogenous activity supplies a research rationale, but no cited controlled study establishes that replacement improves AFE outcomes. It is not standard resuscitative therapy and should not be represented as proven reversal of an established causal deficiency.

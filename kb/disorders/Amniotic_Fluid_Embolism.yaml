- name: Hemostatic Resuscitation and Fibrinogen Replacement
  therapeutic_modality: OTHER
  description: Activate the massive transfusion protocol for severe bleeding and assess coagulation early. Replace red cells, plasma and platelets according to the evolving deficit, with prompt fibrinogen replacement using cryoprecipitate or locally appropriate concentrates. The 2026 checklist describes approximately 1:1:1 component resuscitation and favors concentrated cryoprecipitate for fibrinogen support to limit volume overload; this does not replace every plasma indication. Avoid excessive crystalloid or colloid loading.
  evidence:
  - reference: PMID:26987420
    reference_title: 'Amniotic fluid embolism: diagnosis and management.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: we recommend the early assessment of clotting status and early aggressive management of clinical bleeding with standard massive transfusion protocols
  - reference: PMID:42730345
    reference_title: 'Society for Maternal-Fetal Medicine Special Statement: Checklist for initial management of amniotic fluid embolism-Updated 2026.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: in AFE, cryoprecipitate is favored over fresh or frozen plasma to limit the risk of volume overload while addressing coagulopathy
  treatment_term:

    reference_title: Comparative analysis of hyperfibrinolysis with activated coagulation between amniotic fluid embolism and severe placental abruption.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the very low values of Clauss fibrinogen with elevated D-dimer levels compared to the control group"
    explanation: Documents the fibrinogen depletion this phenotype records.
- category: Hematologic
  name: Thrombocytopenia

- name: Maternal Inflammatory Mediator Activation
  biological_scale: ORGANISM
  description: An abnormal inflammatory response is a leading model. A 2026 reanalysis found markedly elevated IL-6, IL-8 and IL-10 in two banked samples from one fatal clinically diagnosed case, including admission before overt collapse. Fever developed after epidural analgesia, no autopsy was performed, and microbial versus sterile triggers were unresolved. The observation does not establish a universal fetal-antigen trigger, a prediction test, or efficacy of immunomodulation.
  evidence:
  - reference: PMID:24402585
    reference_title: Amniotic fluid embolism.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: This response and its subsequent injury appear to involve activation of proinflammatory mediators similar to that seen with the classic systemic inflammatory response syndrome.
  - reference: PMID:41765067
    reference_title: 'A subclinical cytokine storm is present before the clinical diagnosis of amniotic fluid embolism: implications for the prediction and prevention of maternal death.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: The admission plasma sample, obtained when the patient appeared completely asymptomatic, showed extraordinary elevations of key inflammatory cytokines relative to women in labor.
    explanation: Single-case observation against six term-labor and six term-not-in-labor controls.
  downstream:

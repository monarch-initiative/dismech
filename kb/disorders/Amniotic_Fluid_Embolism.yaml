- name: Vasopressor Support
  therapeutic_modality: SMALL_MOLECULE
  description: Use vasopressors when hypotension requires support, guided by hemodynamic status. Severe right ventricular compromise favors pressure support over indiscriminate fluid loading; bleeding still requires appropriate blood-product resuscitation.
  evidence:
  - reference: PMID:31376394
    reference_title: 'Amniotic fluid embolism: principles of early clinical management.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Blood pressure support with vasopressors is preferred over fluid infusion in the setting of severe right ventricular compromise.
  target_mechanisms:
  - target: Reduced Systemic Perfusion
    treatment_effect: MODULATES
    description: Supports pressure and organ perfusion without correcting the initiating insult.
    evidence:

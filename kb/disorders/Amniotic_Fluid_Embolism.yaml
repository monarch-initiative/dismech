- name: Resuscitative Delivery During Maternal Cardiac Arrest
  therapeutic_modality: SURGERY
  description: Prepare for immediate delivery during maternal arrest; the 2026 checklist calls for cesarean delivery to be started within 4 minutes when circulation has not returned. Uterine evacuation can improve maternal hemodynamics as well as fetal outcome. Perform it where the patient is located if transfer would delay treatment. Operative vaginal delivery is an option only when complete dilation and a crowning head allow prompt birth. Apply the pregnancy cardiac-arrest protocol and individual clinical circumstances; the older 2016 guideline used a fetal viability threshold of 23 weeks.
  evidence:
  - reference: PMID:42730345
    reference_title: 'Society for Maternal-Fetal Medicine Special Statement: Checklist for initial management of amniotic fluid embolism-Updated 2026.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Immediate delivery can improve maternal hemodynamics and, in a patient receiving CPR, should be initiated within 4 min to increase the likelihood of return of spontaneous circulation
  - reference: PMID:42730345
    reference_title: 'Society for Maternal-Fetal Medicine Special Statement: Checklist for initial management of amniotic fluid embolism-Updated 2026.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Operative vaginal delivery can be considered if the cervix is completely dilated and the fetal head is crowning
  treatment_term:

- name: Pulmonary Vasodilator Therapy
  therapeutic_modality: SMALL_MOLECULE
  description: Consider pulmonary vasodilators to reduce right ventricular afterload in documented pulmonary hypertension/right ventricular failure, under expert hemodynamic monitoring. Inhaled nitric oxide or prostacyclin are options; use is targeted rather than routine for every respiratory presentation.
  evidence:
  - reference: PMID:31376394
    reference_title: 'Amniotic fluid embolism: principles of early clinical management.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: If such failure is identified, treatment that is tailored at improving right ventricular performance should be initiated with the use of inotropic agents and pulmonary vasodilators.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:

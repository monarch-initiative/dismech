- name: Pulmonary Mast Cell Degranulation
  biological_scale: CELLULAR
  description: Extracellular tryptase and mast-cell observations in selected fatal cases support local pulmonary degranulation. Negative or inconsistent serum tryptase and urinary histamine results in other samples constrain a systemic biomarker claim, but do not refute tissue degranulation. Necessity and causal contribution remain unresolved.
  evidence:
  - reference: PMID:25807263
    reference_title: 'Amniotic fluid embolism pathophysiology suggests the new diagnostic armamentarium: β-tryptase and complement fractions C3-C4 are the indispensable working tools.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: These studies, therefore, highlight that mast cell degranulation occurs in the lungs of AFE fatal cases, whereas it does not occur in other fatal pregnancies.
    explanation: Review synthesis of selected autopsy series, not proof of specificity across all causes of death.

      snippet: "In vivo experiments in rlim mutant zebrafish showed that wild type RLIM rescued the zebrafish rlim phenotype, whereas the patient-specific missense RLIM variants failed to rescue the phenotype and thus represent likely severe loss-of-function mutations."

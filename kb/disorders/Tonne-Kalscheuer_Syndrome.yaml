diagnosis:
- name: Exome sequencing
  description: >-
    Most diagnoses, including antenatal ones, are made by exome sequencing.
    Carrier testing of the mother and X-inactivation studies support
    classification of a new variant; cell-based RLIM activity reporters have been
    developed to test variants of uncertain significance.
  evidence:
  - reference: PMID:41658772
    reference_title: The Importance of a Multidisciplinary Team Approach in a Rare Case of Antenatally Diagnosed Tonne-Kalscheuer Syndrome.

discussions:
- discussion_id: tokas_malformation_mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Which RLIM substrates and gene expression programmes connect reduced RLIM
    ligase activity to diaphragmatic hernia, differences of sex development and
    the other malformations of TOKAS?
  attaches_to:
  - pathophysiology#Impaired RLIM E3 Ubiquitin Ligase Activity
  - phenotypes#Congenital diaphragmatic hernia
  - phenotypes#Differences of sex development
  rationale: >-
    The substrate-level defects (REX1, SMAD7) and the accelerated neural
    differentiation are shown only in mouse embryonic stem cells. No study has
    connected them to diaphragm, genital, heart or limb development. Only the
    diaphragmatic hernia, which PMID:33953269 names as a feature caused by
    disrupted RLIM function through unidentified programmes, carries a causal
    edge; the other malformations
    and the neurodevelopmental features are left without an upstream mechanism
    node rather than wired to one no source connects them to.
  evidence:
  - reference: PMID:33953269
    reference_title: A novel RLIM/RNF12 variant disrupts protein stability and function to cause severe Tonne-Kalscheuer syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "However, the relevant gene expression programmes that are disrupted to cause the syndromic features of TOKAS, such as diaphragmatic hernia, are yet to be elucidated."
    explanation: The authors state the gap directly.
- discussion_id: tokas_genotype_phenotype
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why is p.Arg611Cys almost always antenatally lethal while other RING and
    basic-region variants allow survival with intellectual disability?
  attaches_to:
  - pathophysiology#Hemizygous RLIM Missense Variant
  - phenotypes#Congenital diaphragmatic hernia
  rationale: >-
    Arg611 is the conserved linchpin arginine of the RING domain, which
    mediates E2 and ubiquitin interaction, but the reason for the severity of
    this variant relative to other ligase-impairing variants has not been
    explained.
  evidence:
  - reference: PMID:38849204
    reference_title: "Extending the clinical spectrum of X-linked Tonne-Kalscheuer syndrome (TOKAS): new insights from the fetal perspective."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, the lethality of this specific variant, and more generally the genotype-phenotype correlation in this syndrome, has not yet been explained."
    explanation: States that the p.Arg611Cys severity is unexplained.
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0010506
      label: intellectual disability, X-linked 61
    mapping_predicate: skos:exactMatch
    mapping_source: MONDO
    mapping_justification: >-
      MONDO:0010506 carries "Tonne-Kalscheuer syndrome" as an exact synonym, its
      OMIM xref is OMIM:300978 (Tonne-Kalscheuer syndrome), and its causal gene
      is RLIM.
notes: >-
  Scope. MONDO files MONDO:0010506 under MONDO:0019181 non-syndromic X-linked
  intellectual disability, following the historical MRX61 numbering. The
  clinical literature describes a syndromic disorder with congenital
  malformations, and OMIM:300978 is titled Tonne-Kalscheuer syndrome, so this
  is curated as its own entry rather than as a subtype row of
  Non-Syndromic_X-Linked_Intellectual_Disability, whose notes record the same
  decision. The parents listed here reflect the syndromic reading, not the
  MONDO placement.

  Severity forms a spectrum from survival into adulthood with intellectual
  disability (the original Norwegian family) to antenatal lethality; no named
  subtypes are used in the literature, so none are declared. Duplications of
  Xq13.2-q13.3 that include RLIM are associated with a milder neurocognitive
  phenotype with distinct facial features (PMID:33159883); they are a separate
  dosage condition and are not included here.

  Perinatal death and skewed X-inactivation in carrier mothers are recorded in
  prose (pulmonary hypoplasia description; inheritance) rather than as
  phenotypes, because their HPO terms (HP:0003811 Neonatal death, HP:0012546
  Skewed maternal X inactivation) lie outside the PhenotypeTerm enum root.

  No GeneReviews chapter exists for this disorder (just check-genereviews).
  Mechanistic evidence comes from mouse embryonic stem cells, mouse genetics
  and zebrafish complementation; no patient-tissue study of substrate levels or
  X-inactivation in affected males has been reported.

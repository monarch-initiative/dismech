- name: Impaired Xist Induction
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    In mice, maternally deposited RLIM is required to induce Xist and initiate
    imprinted X-chromosome inactivation, and REX1 is its critical target; RLIM is
    dispensable for random X-inactivation in the epiblast. Because affected

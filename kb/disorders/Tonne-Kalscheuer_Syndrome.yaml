- name: Disrupted RLIM-USP26 Amplification Loop
  biological_scale: MOLECULAR
  mechanism_confidence: HYPOTHETICAL
  description: >-
    In mouse embryonic stem cells and testis, RLIM relieves REX1 repression of
    the deubiquitylase USP26, which in turn stabilizes RLIM, forming a
    feed-forward loop required for germ cell differentiation in vitro. TOKAS
    variants disrupt this loop; its relevance to the human phenotype, for
    example to hypogenitalism, has not been tested.

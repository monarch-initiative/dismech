description: >-
  Tonne-Kalscheuer syndrome (TOKAS) is an X-linked recessive neurodevelopmental
  and multiple congenital anomaly disorder caused by hemizygous missense variants
  in RLIM (also called RNF12), which encodes a RING-type E3 ubiquitin ligase that
  also acts as a cofactor of LIM-homeodomain transcription factors. Affected males
  have intellectual disability of variable severity, global developmental delay,
  speech delay, behavioural anomalies including autistic features, abnormal gait,
  microcephaly, variable facial dysmorphism, short broad thumbs and other hand,
  foot and nail anomalies, and differences of sex development such as micropenis,
  hypospadias and cryptorchidism. At the severe end of the spectrum, congenital
  diaphragmatic hernia with pulmonary hypoplasia, heart defects, omphalocele,
  intrauterine growth restriction and hydrops present antenatally and are often
  lethal in the perinatal period; the recurrent RING-domain variant p.Arg611Cys
  accounts for most antenatal cases.

  All reported disease alleles are missense changes, clustered in the basic
  regulatory region and the catalytic RING domain, and the ones tested impair
  E3 ligase activity or protein stability. In embryonic stem cell models, loss of
  RLIM activity impairs ubiquitylation of its substrates REX1 (ZFP42) and SMAD7
  and accelerates neural differentiation. In mice, maternal RLIM initiates
  imprinted X-chromosome inactivation by degrading REX1; how these substrate
  defects produce the human malformations and cognitive phenotype is not
  established. Heterozygous carrier females are usually cognitively unaffected
  and show highly skewed X-inactivation, occasionally with mild physical features.
inheritance:
- name: X-linked recessive
  inheritance_term:
    preferred_term: X-linked recessive inheritance
    term:
      id: HP:0001419
      label: X-linked recessive inheritance
  description: >-
    Affected individuals are hemizygous males; variants are typically inherited
    from a carrier mother. Carrier females are usually cognitively unaffected,
    sometimes with mild physical features (short broad thumbs, premature ovarian
    failure), and show highly skewed X-inactivation, which has been proposed as
    supporting evidence when classifying a new RLIM variant.
  evidence:
  - reference: PMID:38849204
    reference_title: "Extending the clinical spectrum of X-linked Tonne-Kalscheuer syndrome (TOKAS): new insights from the fetal perspective."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Tonne-Kalscheuer syndrome (TOKAS) is a recessive X-linked multiple congenital anomaly disorder caused by RLIM variations."
    explanation: States the X-linked recessive mode of inheritance.
  - reference: PMID:25735484
    reference_title: Syndromic X-linked intellectual disability segregating with a missense variant in RLIM.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sanger sequencing confirmed the presence of the variant in the four affected males (none of whom were siblings) and in three mothers available for testing."
    explanation: >-
      Transmission through carrier mothers to affected males across a
      three-generation family, the pattern of X-linked recessive inheritance.
  - reference: PMID:25735484
    reference_title: Syndromic X-linked intellectual disability segregating with a missense variant in RLIM.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No other shared rare variants on the X chromosome were detected in the two affected exome-sequenced individuals, and all female carriers had an extremely skewed X-chromosome inactivation pattern."
    explanation: Extreme X-inactivation skewing in all carriers of the first family.
  - reference: PMID:41068697
    reference_title: A novel missense variant at the site of interaction between RLIM and E2 ubiquitin-conjugating enzymes causes Tønne-Kalscheuer syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Segregation analysis revealed the asymptomatic mother to be a carrier of the familial missense variant, and a highly skewed X chromosome inactivation pattern was observed in this study."
    explanation: Asymptomatic carrier mother with highly skewed X-inactivation in a further family.
  - reference: PMID:29728705
    reference_title: Pathogenic variants in E3 ubiquitin ligase RLIM/RNF12 lead to a syndromic X-linked intellectual disability and behavior disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast, 44 heterozygous female carriers have normal cognition and behavior, but eight showed mild physical features."
    explanation: Carrier females are cognitively unaffected, with occasional mild physical features.
genetic:
- name: RLIM
  gene_term:
    preferred_term: RLIM
    term:
      id: hgnc:13429
      label: RLIM
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  association: >-
    RLIM (RNF12, Xq13.2) encodes a RING-H2 E3 ubiquitin ligase. Every reported
    disease allele is a missense variant; truncating variants have not been
    reported, and the gene is highly intolerant to loss-of-function variation.
    Variants cluster in the basic region (required for chromatin recruitment and
    substrate targeting) and in the C-terminal RING catalytic domain.
  evidence:
  - reference: PMID:29728705
    reference_title: Pathogenic variants in E3 ubiquitin ligase RLIM/RNF12 lead to a syndromic X-linked intellectual disability and behavior disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All RLIM variants identified are missense changes co-segregating with the phenotype and predicted to affect protein function."
    explanation: Co-segregation of RLIM missense variants with disease across nine families.
  - reference: PMID:25644381
    reference_title: X-exome sequencing of 405 unresolved families identifies seven novel intellectual disability genes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In 19 families, we detected likely causative protein truncating and missense variants in 7 novel and validated XLID genes (CLCN4, CNKSR2, FRMPD4, KLHL15, LAS1L, RLIM and USP27X)"
    explanation: Independent identification of RLIM as an X-linked intellectual disability gene in an X-exome screen.
  - reference: PMID:38849204
    reference_title: "Extending the clinical spectrum of X-linked Tonne-Kalscheuer syndrome (TOKAS): new insights from the fetal perspective."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No truncating variants have been reported and RLIM is predicted to be highly intolerant to loss-of-function variants"
    explanation: Supports the statement that the allelic spectrum is missense-only and that RLIM is loss-of-function intolerant.
  variants:
  - name: p.Arg611Cys
    description: >-
      Recurrent missense variant at the conserved linchpin arginine of the RING
      domain; the main cause of antenatal and perinatally lethal TOKAS.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:38849204
      reference_title: "Extending the clinical spectrum of X-linked Tonne-Kalscheuer syndrome (TOKAS): new insights from the fetal perspective."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Of the 13 individuals carrying this variant, 12 had either an antenatal form with TOP or perinatal lethality."
      explanation: Nearly all carriers of p.Arg611Cys had antenatal or perinatally lethal disease.
  - name: p.Tyr356Cys
    description: >-
      Missense variant in the conserved domain that binds LIM-homeodomain
      transcription factors; identified in the original Norwegian family, in
      which affected males survived into adulthood.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:25735484
      reference_title: Syndromic X-linked intellectual disability segregating with a missense variant in RLIM.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Tyrosine in position 356 in RNF12 is located within a highly conserved domain essential for binding such transcription factors."
      explanation: Places p.Tyr356Cys in the transcription-factor-binding domain.
  - name: p.Tyr421Cys
    description: >-
      Missense variant adjacent to the basic region that destabilizes the
      protein and impairs E3 ligase activity; reported in a neonate who died of
      congenital diaphragmatic hernia.
    clinical_significance: LIKELY_PATHOGENIC
    evidence:
    - reference: PMID:33953269
      reference_title: A novel RLIM/RNF12 variant disrupts protein stability and function to cause severe Tonne-Kalscheuer syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "which causes a severe form of TOKAS resulting in perinatal lethality by diaphragmatic hernia"
      explanation: Case report linking p.Tyr421Cys to severe, perinatally lethal TOKAS.

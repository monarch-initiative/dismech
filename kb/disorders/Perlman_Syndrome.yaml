    Dis3l2-null mouse nephron progenitor cells, a potential cell of origin of
    Wilms tumor, up-regulate Igf2, a growth-promoting gene strongly associated
    with Wilms tumorigenesis. The authors present this as a candidate
    mechanism, not a demonstrated cause of nephroblastomatosis or Wilms tumor
    in patients.
  biological_scale: CELLULAR
  genes:
  - preferred_term: IGF2

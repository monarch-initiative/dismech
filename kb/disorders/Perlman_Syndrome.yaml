- name: Mitotic Abnormalities
  description: >-
    DIS3L2 inactivation is associated with mitotic abnormalities and altered
    expression of mitotic checkpoint proteins in human cells, and dis3l2
    knockdown in zebrafish disrupts early mitoses, spindle length, chromosome
    congression and cytokinesis. How this contributes to the patient phenotype
    is not established.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: mitotic spindle assembly checkpoint signaling
    modifier: DYSREGULATED
    term:
      id: GO:0007094
      label: mitotic spindle assembly checkpoint signaling
  evidence:
  - reference: PMID:22306653
    reference_title: Germline mutations in DIS3L2 cause the Perlman syndrome of overgrowth and Wilms tumor susceptibility.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      DIS3L2 inactivation was associated with mitotic abnormalities and altered

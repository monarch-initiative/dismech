differential_diagnoses:
- name: Beckwith-Wiedemann syndrome
  disease_term:
    preferred_term: Beckwith-Wiedemann syndrome
    term:
      id: MONDO:0007534
      label: Beckwith-Wiedemann syndrome
  distinguishing_features:
  - Fetal ascites and the characteristic facies without macroglossia or anterior abdominal wall defects favor Perlman syndrome.
  - 11p15 genetic or epigenetic alterations, including CDKN1C mutation, support Beckwith-Wiedemann syndrome; they were excluded in the 2008 Perlman index case.
  evidence:
  - reference: PMID:28674120
    reference_title: Surveillance Recommendations for Children with Overgrowth Syndromes and Predisposition to Wilms Tumors and Hepatoblastoma.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Perlman syndrome may be differentiated from other congenital overgrowth
      disorders such as BWS and Simpson-Golabi-Behmel syndrome (SGBS) by the
      presence of features including fetal ascites and characteristic facial
      dysmorphism in the absence of macroglossia, anterior abdominal wall
      defects, polydactyly, and other features.
    explanation: Clinical features separating Perlman from BWS and SGBS.
  - reference: PMID:18780370
    reference_title: "Perlman syndrome: report, prenatal findings and review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genetic or epigenetic alterations of the 11p15 region (involved in the
      BWS), including mutation of the CDKN1C gene were excluded.
    explanation: BWS molecular causes excluded in the index case.
- name: Simpson-Golabi-Behmel syndrome type 1
  disease_term:
    preferred_term: Simpson-Golabi-Behmel syndrome
    term:
      id: MONDO:0020602
      label: Simpson-Golabi-Behmel syndrome type 1
  distinguishing_features:
  - Polydactyly favors SGBS; a GPC3 mutation was excluded in the 2008 Perlman index case.
  evidence:
  - reference: PMID:18780370
    reference_title: "Perlman syndrome: report, prenatal findings and review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: No mutation of the GPC3 gene was identified.
    explanation: GPC3 testing excludes SGBS type 1 in the index case.
treatments:
- name: Renal Ultrasound Surveillance
  description: >-
    Children with Perlman syndrome are offered Wilms tumor surveillance like
    that for Beckwith-Wiedemann syndrome. The AACR 2017 consensus schedule for
    syndromes with Wilms tumor risk is renal ultrasound every 3 months from
    birth or diagnosis to the seventh birthday.

    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Upon DIS3L2 loss, sustained 3'-end uridylation of aberrant 7SL RNA
      impacts ER-targeted translation and causes ER calcium leakage.
    explanation: Cell-based demonstration of the 7SL and ER calcium defect.
- name: Increased PI3K/AKT Signaling
  description: >-
    Loss of DIS3L2 in human HEK-293T kidney cells increases PI3-kinase/AKT

    explanation: Zebrafish knockdown shows mitotic defects.
- name: Increased Cell Proliferation and Tissue Overgrowth
  description: >-
    DIS3L2 knockdown enhances the growth of human cancer cell lines and its
    overexpression suppresses it; loss of DIS3L2 increases proliferation of
    human kidney cells, and null or nuclease-dead dis3L2 causes wing overgrowth
    in Drosophila through the growth factor Idgf2. This loss of growth
    restraint is the proposed basis of fetal overgrowth and organomegaly.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: cell proliferation
    modifier: INCREASED
    term:
      id: GO:0008284
      label: positive regulation of cell population proliferation
  evidence:
  - reference: PMID:22306653
    reference_title: Germline mutations in DIS3L2 cause the Perlman syndrome of overgrowth and Wilms tumor susceptibility.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      DIS3L2 overexpression suppressed the growth of human cancer cell lines,
      and knockdown enhanced the growth of these cells.
    explanation: DIS3L2 restrains cell growth in human cell lines.
  - reference: PMID:33370287
    reference_title: Dis3L2 regulates cell proliferation and tissue growth through a conserved mechanism.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      we have generated a new dis3L2 null mutant together with wild-type and
      nuclease-dead genetic lines in Drosophila to demonstrate that the
      catalytic activity of Dis3L2 is required to control cell proliferation
    explanation: Catalytic activity of Dis3L2 is required to restrain proliferation in Drosophila.
  - reference: PMID:33370287
    reference_title: Dis3L2 regulates cell proliferation and tissue growth through a conserved mechanism.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We also demonstrate that loss of DIS3L2 in human kidney HEK-293T cells
      results in cell proliferation, illustrating the conservation of this
      important cell proliferation pathway.
    explanation: Increased proliferation of DIS3L2-deficient human kidney cells.
  downstream:

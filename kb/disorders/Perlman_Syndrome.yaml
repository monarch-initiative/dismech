genetic:
- name: DIS3L2
  gene_term:
    preferred_term: DIS3L2
    term:
      id: hgnc:28648
      label: DIS3L2
  association: Defining gene; biallelic loss-of-function variants
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_e68b93df-e0e7-4d46-8934-8b86064c0b37-2019-11-21T193052.781Z
    evidence:
    - reference: CGGV:assertion_e68b93df-e0e7-4d46-8934-8b86064c0b37-2019-11-21T193052.781Z
      reference_title: "DIS3L2 / Perlman syndrome (Definitive)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "DIS3L2 | HGNC:28648 | Perlman syndrome | MONDO:0009965 | AR | Definitive"
      explanation: ClinGen Hereditary Cancer GCEP classifies DIS3L2 and Perlman syndrome as Definitive (AR).
  notes: >-
    Somatic DIS3L2 mutations also occur in sporadic Wilms tumor. A child with
    Wilms tumor carrying one familial germline DIS3L2 variant and a somatic
    DIS3L2 mutation in the tumor (PMID:35700413) is a monoallelic carrier with
    a two-hit tumor, not a case of Perlman syndrome, and is not counted here.
  variants:
  - name: DIS3L2 exon 9 deletion
    description: >-
      Recurrent deletion of exon 9 arising by LINE-1-mediated non-allelic
      homologous recombination. Homozygous exon 9 deletion has been associated
      with poor survival, though one child has lived past age 2.
    evidence:
    - reference: PMID:23486540
      reference_title: Homozygous deletion of DIS3L2 exon 9 due to non-allelic homologous recombination between LINE-1s in a Japanese patient with Perlman syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The data suggest that the region around exon 9 might be a hot spot of
        L1-mediated NAHR.
      explanation: Exon 9 is a recurrent deletion hotspot.
    - reference: PMID:42040973
      reference_title: "Prolonged Survival With Homozygous Deletion of Exon 9 in Perlman Syndrome: A Case Report."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Although homozygous deletions of exon 9 are rare and have been
        associated with poor survival, we describe a case report of the only
        known patient with Perlman syndrome to live past 2 years old with this
        deletion.
      explanation: Survival associated with the exon 9 deletion.
  - name: DIS3L2 c.127C>T (p.Arg43Ter) / c.2381G>A (p.Arg794His)
    description: >-
      Compound heterozygous genotype in three siblings with an attenuated
      presentation surviving into childhood.
    evidence:
    - reference: PMID:40704758
      reference_title: "Three Siblings With an Attenuated Presentation of Perlman Syndrome: A Case Report and Literature Review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Genetic testing identified compound heterozygous variants in DIS3L2
        (NM_152383.5): c.127C>T (p.Arg43Ter) (paternal)/c.2381G>A (p.Arg794His)
        (maternal).
      explanation: Biallelic genotype in an attenuated sibship.
  evidence:
  - reference: PMID:22306653
    reference_title: Germline mutations in DIS3L2 cause the Perlman syndrome of overgrowth and Wilms tumor susceptibility.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We mapped a previously unknown susceptibility locus to 2q37.1 and
      identified germline mutations in DIS3L2, a homolog of the
      Schizosaccharomyces pombe dis3 gene, in individuals with Perlman
      syndrome.
    explanation: Gene discovery.
  - reference: ORPHA:2849
    reference_title: Perlman syndrome
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "DIS3L2 | DIS3 like 3'-5' exoribonuclease 2 | hgnc:28648 | Disease-causing germline mutation(s) in"
    explanation: Orphanet records DIS3L2 as the disease-causing gene.
animal_models:
- name: Dis3l2-null mouse
  species: Mouse
  genotype: Dis3l2 knockout, homozygous
  publication: PMID:29950491
  description: >-
    Dis3l2-null mice partially phenocopy Perlman syndrome and show Igf2
    up-regulation in nephron progenitor cells.
  modeled_mechanisms:
  - target: IGF2 Upregulation in Nephron Progenitor Cells
    relationship: RECAPITULATES
    fidelity: UNKNOWN
    model_scale: CELLULAR
    limitations: >-
      The abstract states only a partial phenocopy; which human features the
      mice show, and whether they develop nephroblastomatosis or Wilms tumor,
      was not checked against the full text here.
    evidence:
    - reference: PMID:29950491
      reference_title: Loss of Dis3l2 partially phenocopies Perlman syndrome in mice and results in up-regulation of Igf2 in nephron progenitor cells.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Rather, analysis of Dis3l2-null nephron progenitor cells, a potential
        cell of origin of Wilms tumors, reveals up-regulation of Igf2, a
        growth-promoting gene strongly associated with Wilms tumorigenesis.
      explanation: Igf2 up-regulation in the null mouse's nephron progenitors.
- name: Drosophila dis3L2 null and nuclease-dead
  species: Fruit fly
  genotype: dis3L2 null; nuclease-dead dis3L2
  publication: PMID:33370287
  description: >-
    Loss of Dis3L2 catalytic activity causes wing imaginal disc overgrowth
    driven by Idgf2, a homolog of human chitinase-like proteins.
  modeled_mechanisms:
  - target: Increased Cell Proliferation and Tissue Overgrowth
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    limitations: >-
      Invertebrate wing-disc overgrowth; there is no kidney or nephrogenic
      tissue, so it cannot model nephroblastomatosis or Wilms tumor.
    evidence:
    - reference: PMID:33370287
      reference_title: Dis3L2 regulates cell proliferation and tissue growth through a conserved mechanism.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        we used RNA-seq on dis3L2 mutant wing discs to show that the imaginal
        disc growth factor Idgf2 is responsible for driving the wing overgrowth
      explanation: Overgrowth in the fly model and its effector.

name: Perlman Syndrome
creation_date: "2026-11-06T20:10:00Z"
category: Mendelian
description: >-
  Perlman syndrome is a rare autosomal recessive congenital overgrowth syndrome
  caused by biallelic germline loss-of-function variants in DIS3L2, which
  encodes a cytoplasmic 3'-5' exoribonuclease that degrades 3'-oligouridylated
  RNAs, including uridylated pre-let-7 and aberrant structured noncoding RNAs.
  It presents prenatally with polyhydramnios, fetal ascites, macrosomia and
  nephromegaly; neonates show distinctive facies, hypotonia, renal dysplasia
  with nephroblastomatosis and visceromegaly. Neonatal mortality is high, from
  renal failure, respiratory failure and pulmonary hypoplasia. Children who
  survive the neonatal period have developmental delay and a high, early risk
  of Wilms tumor, often bilateral, so renal ultrasound surveillance is
  recommended. ClinGen classifies DIS3L2 for Perlman syndrome as Definitive
  (autosomal recessive). The germline syndrome is kept separate from the Wilms
  tumor it predisposes to, which has its own entry.

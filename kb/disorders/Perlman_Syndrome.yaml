    explanation: Mitotic abnormalities after DIS3L2 inactivation in cell models.
  - reference: PMID:40500755
    reference_title: Dis3l2 is essential for neural crest survival by modulating Akt signaling.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-

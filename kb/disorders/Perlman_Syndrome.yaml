  description: >-
    Affected individuals carry homozygous or compound heterozygous DIS3L2
    variants. Parental consanguinity is the exception rather than the rule in
    the reported sibships, and a homozygous exon 9 deletion in a Japanese
    patient arose from two independent LINE-1 recombination events, one on
    each parental allele.
  evidence:
  - reference: PMID:22306653
    reference_title: Germline mutations in DIS3L2 cause the Perlman syndrome of overgrowth and Wilms tumor susceptibility.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Perlman syndrome is a congenital overgrowth syndrome inherited in an
      autosomal recessive manner that is associated with Wilms tumor
      susceptibility.
    explanation: Gene-discovery paper states autosomal recessive inheritance.
  - reference: PMID:23613427
    reference_title: "Perlman syndrome: overgrowth, Wilms tumor predisposition and DIS3L2."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Recently a Perlman syndrome locus was mapped to chromosome 2q37 and
      homozygous or compound heterozygous mutations were characterized in
      DIS3L2.
    explanation: Review summarizing the biallelic genotypes found in affected individuals.
  - reference: PMID:18780370
    reference_title: "Perlman syndrome: report, prenatal findings and review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We review 19 patients from seven sibships with parental consanguinity in two families only.
    explanation: Recurrence in sibships fits recessive transmission; consanguinity is uncommon.
  - reference: PMID:23486540
    reference_title: Homozygous deletion of DIS3L2 exon 9 due to non-allelic homologous recombination between LINE-1s in a Japanese patient with Perlman syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Furthermore, the deletion junctions were different between the paternal
      and maternal mutant alleles, suggesting the occurrence of two independent
      NAHR events in the ancestors of each parent.
    explanation: A homozygous deletion carried on two independently arisen parental alleles.
  - reference: CGGV:assertion_e68b93df-e0e7-4d46-8934-8b86064c0b37-2019-11-21T193052.781Z
    reference_title: "DIS3L2 / Perlman syndrome (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "DIS3L2 | HGNC:28648 | Perlman syndrome | MONDO:0009965 | AR | Definitive"
    explanation: ClinGen curates the gene-disease pair as autosomal recessive.
pathophysiology:
- name: DIS3L2 Biallelic Loss of Function
  description: >-
    Biallelic germline DIS3L2 variants (nonsense, frameshift, missense, and an
    exon 9 deletion generated by LINE-1 non-allelic homologous recombination)
    remove the 3'-5' exoribonuclease activity of DIS3L2. Unlike DIS3 and
    DIS3L1, DIS3L2 lacks the PIN domain and has a different intracellular
    localization.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: DIS3L2
    term:
      id: hgnc:28648
      label: DIS3L2
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  molecular_functions:
  - preferred_term: 3'-5' exoribonuclease activity
    modifier: DECREASED
    term:
      id: GO:0000175
      label: 3'-5'-RNA exonuclease activity
  evidence:
  - reference: PMID:22306653
    reference_title: Germline mutations in DIS3L2 cause the Perlman syndrome of overgrowth and Wilms tumor susceptibility.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We mapped a previously unknown susceptibility locus to 2q37.1 and
      identified germline mutations in DIS3L2, a homolog of the
      Schizosaccharomyces pombe dis3 gene, in individuals with Perlman
      syndrome.
    explanation: Germline DIS3L2 mutations identified in affected individuals.
  - reference: PMID:22306653
    reference_title: Germline mutations in DIS3L2 cause the Perlman syndrome of overgrowth and Wilms tumor susceptibility.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      DIS3L2 has a different intracellular localization and lacks the PIN
      domain found in DIS3 and DIS3L1; nevertheless, we show that DIS3L2 has
      exonuclease activity.
    explanation: Establishes the enzymatic activity lost in the disease.
  - reference: CGGV:assertion_e68b93df-e0e7-4d46-8934-8b86064c0b37-2019-11-21T193052.781Z
    reference_title: "DIS3L2 / Perlman syndrome (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Mutant DIS3L2 proteins lacking either exon 6 or exon 9 did not show
      substantial ribonuclease activity and results in aneuploidy and mitotic
      errors.
    explanation: ClinGen summary of functional evidence that patient deletion alleles abolish ribonuclease activity.
  - reference: PMID:23486540
    reference_title: Homozygous deletion of DIS3L2 exon 9 due to non-allelic homologous recombination between LINE-1s in a Japanese patient with Perlman syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified the deletion junction, and implicate a non-allelic
      homologous recombination (NAHR) between two LINE-1 (L1) elements as the
      causative mechanism.
    explanation: Mechanism of the recurrent exon 9 deletion allele.
  downstream:
  - target: Failure of DIS3L2-Mediated Decay of Uridylated RNAs
    description: Loss of the exoribonuclease removes the decay step for 3'-oligouridylated RNAs.
  - target: Increased PI3K/AKT Signaling
    description: >-
      Shown in DIS3L2-deficient human kidney cells. Which accumulated RNA
      substrate links nuclease loss to PI3K/AKT activation is not established.
  - target: IGF2 Upregulation in Nephron Progenitor Cells
    description: Shown in Dis3l2-null mouse nephron progenitor cells.
  - target: Mitotic Abnormalities
    description: DIS3L2 inactivation is associated with mitotic abnormalities in cell models.
- name: Failure of DIS3L2-Mediated Decay of Uridylated RNAs
  description: >-
    DIS3L2 degrades 3'-oligouridylated RNAs after uridylation by terminal
    uridylyl transferases. Its substrates include LIN28-directed uridylated
    pre-let-7 and a broad set of aberrantly processed, highly structured
    noncoding RNAs (7SL, RMRP, rRNA, snRNA, tRNA, Y RNAs). Loss of DIS3L2
    stabilizes these substrates. Mature let-7 levels are not changed by DIS3L2
    loss, so the disease mechanism is not thought to run through let-7
    depletion.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: DIS3L2
    term:
      id: hgnc:28648
      label: DIS3L2
  biological_processes:
  - preferred_term: cytoplasmic RNA surveillance of uridylated noncoding RNAs
    modifier: DECREASED
    term:
      id: GO:0071025
      label: RNA surveillance
  - preferred_term: decay of uridylated pre-let-7
    modifier: DECREASED
    term:
      id: GO:0010587
      label: miRNA catabolic process
  evidence:
  - reference: PMID:24141620
    reference_title: Mammalian DIS3L2 exoribonuclease targets the uridylated precursors of let-7 miRNAs.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here, we identify the Perlman syndrome-associated protein DIS3L2 as an
      oligo(U)-binding and processing exoribonuclease that specifically
      targets uridylated pre-let-7 in vivo.
    explanation: DIS3L2 is the nuclease for uridylated pre-let-7.
  - reference: PMID:23594738
    reference_title: A role for the Perlman syndrome exonuclease Dis3l2 in the Lin28-let-7 pathway.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      knockdown of Dis3l2 in mouse embryonic stem cells leads to the
      stabilization of pre-let-7
    explanation: Loss of Dis3l2 stabilizes its uridylated substrate in mouse embryonic stem cells.
  - reference: PMID:27498873
    reference_title: Dis3l2-Mediated Decay Is a Quality Control Pathway for Noncoding RNAs.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      3'-Uridylated Rmrp, 7SL, and small nuclear RNA (snRNA) species were
      highly stabilized in the cytoplasm of Dis3l2-depleted cells.
    explanation: Dis3l2 depletion stabilizes uridylated structured noncoding RNAs.
  - reference: PMID:27647875
    reference_title: TUT-DIS3L2 is a mammalian surveillance pathway for aberrant structured non-coding RNAs.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Our findings establish the role of DIS3L2 and oligouridylation as the
      cytoplasmic quality control for highly structured ncRNAs.
    explanation: Human cell CLIP study defines the DIS3L2-dependent cytoplasmic uridylome.
  - reference: PMID:29950491
    reference_title: Loss of Dis3l2 partially phenocopies Perlman syndrome in mice and results in up-regulation of Igf2 in nephron progenitor cells.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Here we examine new DIS3L2-deficient cell lines and mouse models,
      demonstrating that DIS3L2 loss has no effect on mature let-7 levels.
    explanation: >-
      Mature let-7 is unchanged, so the decay defect does not act through let-7
      depletion. The study used cell lines and mice; it is graded by its mouse
      data here.
  downstream:
  - target: Dysregulated ER-Targeted Translation and ER Calcium Leak
    description: Persistent uridylated 7SL RNA disturbs signal recognition particle-dependent translation.
- name: Dysregulated ER-Targeted Translation and ER Calcium Leak
  description: >-
    The 7SL RNA of the signal recognition particle is a DIS3L2 substrate. In
    DIS3L2-deficient cells, persistently uridylated aberrant 7SL disturbs
    ER-targeted mRNA translation, ER calcium leaks, calcium signaling response
    genes are induced, and embryonic stem cell differentiation is perturbed.
    How this contributes to the patient phenotype is not known.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: endoplasmic reticulum calcium ion homeostasis
    modifier: DYSREGULATED
    term:
      id: GO:0032469
      label: endoplasmic reticulum calcium ion homeostasis
  evidence:

notes: >-
  No GeneReviews chapter covers Perlman syndrome or DIS3L2: PubMed
  "Perlman syndrome"[TI] AND genereviews[book] and DIS3L2[TIAB] AND
  genereviews[book] both returned no records. Orphanet ORPHA:2849 and the AACR
  2017 consensus (PMID:28674120) serve as the phenotype baseline. Clinical data
  come from fewer than about 40 reported patients, so frequencies are
  approximate. Mechanism nodes below the nuclease defect come from cell, mouse,
  fly and zebrafish models; the step linking accumulated uridylated RNAs to
  PI3K/AKT activation or Igf2 up-regulation is not established.

- name: DIS3L2 molecular testing
  description: >-
    Diagnosis is confirmed by biallelic pathogenic DIS3L2 variants, for
    example by exome sequencing with Sanger confirmation. Exon-level deletions
    are a recurrent allele class, so copy-number analysis is needed alongside
    sequencing.
  diagnosis_term:
    preferred_term: DIS3L2 genetic testing
    term:
      id: NCIT:C15709

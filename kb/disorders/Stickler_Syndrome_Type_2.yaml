diagnosis:
- name: Molecular genetic testing on a Stickler syndrome gene panel
  description: >
    The diagnosis rests on the clinical phenotype - the beaded vitreous is the
    single most useful clue toward COL11A1 - confirmed by a heterozygous
    pathogenic variant. Because the syndrome is locus heterogeneous, a
    multi-gene panel rather than single-gene COL11A1 sequencing is the
    standard first-tier test.
  evidence:
  - reference: PMID:20301479
    reference_title: "Stickler Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of Stickler syndrome can be established in a proband with characteristic clinical features and/or a heterozygous pathogenic variant in COL2A1, COL11A1, or COL11A2"
    explanation: >
      GeneReviews' diagnostic statement, which names COL11A1 among the genes
      whose heterozygous variants establish the diagnosis.
  - reference: PMID:41856555
    reference_title: "Diagnostic genetic testing indications and findings in type II, IX and XI collagenopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnostic yield of Stickler syndrome panels was 50%, with a higher rate among cases reporting a family history"
    explanation: >
      Quantifies the real-world yield of the panel approach in a diagnostic
      laboratory series. The abstract does not state the denominator for the
      50%, and it is not the 7798 panels ordered - those yielded 214 cases
      with a pathogenic or likely pathogenic variant in total.
  notes: >
    The yield figure is for Stickler syndrome panels overall, not for STL2
    specifically; the same series found ocular signs and family history were
    the commonest indications for ordering one.
differential_diagnoses:
- name: Stickler Syndrome Type 1
  description: >
    The commoner COL2A1-related form. Separated at the slit lamp by a
    membranous rather than beaded vitreous, and clinically by less frequent
    hearing impairment.
  distinguishing_features:
  - Membranous rather than beaded vitreous phenotype
  - COL2A1 haploinsufficiency rather than dominant-negative COL11A1
  - Hearing impairment in about half of COL2A1 patients (52.2%) versus 82.5% of COL11A1 patients in the same review
  evidence:
  - reference: PMID:20513134
    reference_title: "Stickler syndrome and the vitreous phenotype: mutations in COL2A1 and COL11A1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in COL2A1 usually result in a congenital membranous vitreous anomaly. In contrast mutations in COL11A1 result in a different vitreous phenotype where the lamellae have an irregular and beaded appearance."
    explanation: States the vitreous phenotype that distinguishes the two forms.
  - reference: PMID:23110709
    reference_title: "Hearing impairment in Stickler syndrome: a systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Overall, mutations in COL11A1 (82.5%) and COL11A2 (94.1%) seem to be more frequently associated with hearing impairment than mutations in COL2A1 (52.2%)"
    explanation: Quantifies the auditory difference between the COL11A1 and COL2A1 forms.
- name: Marshall Syndrome
  description: >
    An allelic COL11A1 disorder overlapping STL2, associated in particular
    with splicing variants of the 54-bp exons in the C-terminal region of the
    gene.
  distinguishing_features:
  - Retracted midface with flat nasal bridge, short nose, anteverted nostrils and long philtrum
  - Short stature and abnormal cranial ossification
  - Retinal detachment reported less often than in Stickler syndrome
  - Overlapping cases carrying features of both syndromes are well described
  evidence:
  - reference: PMID:10486316
    reference_title: "Splicing mutations of 54-bp exons in the COL11A1 gene cause Marshall syndrome, but other mutations cause overlapping Marshall/Stickler phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genotypic-phenotypic comparison revealed an association between the Marshall syndrome phenotype and splicing mutations of 54-bp exons in the C-terminal region of the COL11A1 gene"
    explanation: >
      Identifies the COL11A1 variant class that separates the Marshall
      phenotype from classic Stickler syndrome.
  - reference: PMID:10486316
    reference_title: "Splicing mutations of 54-bp exons in the COL11A1 gene cause Marshall syndrome, but other mutations cause overlapping Marshall/Stickler phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Some patients, however, presented with phenotypes of both Marshall and Stickler syndromes."
    explanation: >
      Records the overlap that makes this the principal differential rather
      than a cleanly separable entity.
- name: Otospondylomegaepiphyseal Dysplasia
  description: >
    The COL11A2-related type XI collagenopathy, presenting with hearing loss
    and skeletal dysplasia but without the ocular disease. The accepted
    explanation is that the alpha2(V) chain substitutes for alpha2(XI) in
    vitreous, so a COL11A2 lesion is covered for there and not elsewhere.
  distinguishing_features:
  - Absence of the vitreous and retinal features
  - Caused by COL11A2 rather than COL11A1
  evidence:
  - reference: PMID:8872475
    reference_title: "A family with Stickler syndrome type 2 has a mutation in the COL11A1 gene resulting in the substitution of glycine 97 by valine in alpha 1 (XI) collagen."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A mutation in COL11A2, the gene for alpha 2 (XI) procollagen, has recently been found in a family described as having Stickler syndrome, although there was no ocular involvement."
    explanation: >
      Records the absence of ocular involvement in COL11A2-related disease,
      the feature that distinguishes it from STL2.
  - reference: PMID:10486316
    reference_title: "Splicing mutations of 54-bp exons in the COL11A1 gene cause Marshall syndrome, but other mutations cause overlapping Marshall/Stickler phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "chain substitutes for the α2(XI) chain in the vitreous (Mayne et al.1993), thus explaining the lack of the ocular symptoms in patients with the COL11A2 gene mutations"
    explanation: >
      Gives the mechanistic reason COL11A2 disease spares the eye, which is
      what makes the ocular features a reliable discriminator.
  - reference: PMID:33348901
    reference_title: "Exon-Trapping Assay Improves Clinical Interpretation of COL11A1 and COL11A2 Intronic Variants in Stickler Syndrome Type 2 and Otospondylomegaepiphyseal Dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Type 2 SS and the SS variant otospondylomegaepiphyseal dysplasia (OSMED) are caused by deleterious variants in COL11A1 and COL11A2, respectively."
    explanation: States the gene assignment that separates the two entities.
discussions:
- discussion_id: cho_heterozygote_auditory_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >
    Why do cho/+ mice, heterozygous for a Col11a1 functional null, develop the
    joint phenotype of COL11A1 disease but show no hearing loss at all, when
    human COL11A1 heterozygotes have frequent sensorineural hearing loss?
  attaches_to:
  - pathophysiology#Cochlear Extracellular Matrix Abnormality
  - animal_models#cho/+ heterozygous Col11a1 mouse
  rationale: >
    The mismatch is mechanistically load-bearing rather than a modelling
    nuisance. The mouse heterozygote tests halved Col11a1 dosage; human STL2
    alleles are missense and splice changes whose product still enters the
    heterotrimer. That the joint phenotype survives the switch to a null
    allele while the auditory phenotype does not is the study's argument that
    the human cochlear lesion needs dominant-negative mutant chains and is
    not a dosage effect. The cho/cho homozygote is not the exception it looks
    like: it does have marked ABR hearing loss and a disorganized organ of
    Corti, but that is a recessive, perinatally lethal genotype modelling the
    fibrochondrogenesis end of the COL11A1 spectrum rather than dominant
    STL2. So no current mouse model addresses the auditory arm of STL2 at the
    right gene dosage; a knock-in of a human triple-helical missense allele
    would be the test.
  evidence:
  - reference: PMID:12527136
    reference_title: "Auditory function associated with Col11a1 haploinsufficiency in chondrodysplasia (cho) mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "To determine if Col11a1 haploinsufficiency causes hearing loss in cho/+ mice, auditory brainstem response (ABR) thresholds were measured at 2, 4, 6, 8 and 10 months of age. There was no difference in ABR thresholds for click and tone burst stimuli between cho/+ and +/+ mice at all ages."
    explanation: >
      The negative auditory result in the heterozygous mouse that constitutes
      the mismatch.
  - reference: PMID:12527136
    reference_title: "Auditory function associated with Col11a1 haploinsufficiency in chondrodysplasia (cho) mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We conclude that Stickler syndrome and Marshall syndrome mutations in COL11A1 cause hearing loss via dominant negative effects upon wild-type fibrillar collagen polypeptides in the extracellular matrices of the cochlea"
    explanation: >
      The authors' resolution of the mismatch, and the reason it is
      mechanistically informative rather than merely a failed model.
  - reference: PMID:1952599
    reference_title: "Ultrastructural changes of cochlea in mice with hereditary chondrodysplasia (cho/cho)."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These mice show marked hearing loss when tested by auditory brain-stem responses. The temporal bone shows underdevelopment of the organs of Corti in the lower turn of the cochlea."
    explanation: >
      The homozygote does have a cochlear phenotype, so the mismatch is
      specific to the heterozygote and to gene dosage rather than to the
      mouse cochlea being insensitive to Col11a1 loss.
notes: >
  Curated from a claude_code deep-research report
  (research/Stickler_Syndrome_Type_2-deep-research-claude_code.md) with the
  GeneReviews Stickler syndrome chapter (PMID:20301479) as the phenotype
  baseline. Two areas were deliberately left out. First, the rare biallelic
  COL11A1 form reported with unusually severe hearing loss: it is a distinct
  inheritance mode and belongs in its own record rather than as a footnote
  here. Second, prevalence specific to type 2 - the report's "10-20% of
  Stickler cases" figure could not be traced to a citable primary source, so
  only the group-scoped Orphanet birth-prevalence band is recorded, with its
  scope stated in the record.

  No datasets are recorded. `just discover-datasets` returns only GENE_ONLY
  matches on COL11A1 - GEO series about collagen XI in ovarian cancer and in
  cutaneous squamous cell carcinoma invasion. Those accessions resolve
  perfectly and are about a different disease entirely, which is the Named
  Entity Confusion case the dataset-curation guidance warns about; none is
  admitted here.

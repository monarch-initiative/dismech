- category: Auditory
  name: Sensorineural hearing impairment
  description: >
    Bilateral cochlear hearing loss affecting all test frequencies rather than
    the high frequencies alone. It is the predominant type of hearing
    impairment in STL2 and is more consistently present than in type 1
    disease.
  phenotype_term:
    preferred_term: Sensorineural hearing impairment
    term:
      id: HP:0000407
      label: Sensorineural hearing impairment
  frequency: FREQUENT
  evidence:
  - reference: PMID:32901364
    reference_title: "Auditory dysfunction in type 2 Stickler Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hearing impairment was identified in at least one ear for 69% of individuals. Analysis against age-matched normative data showed that reduced hearing sensitivity was present across all test frequencies. Sensorineural hearing loss was most common (77% of ears)"
    explanation: >
      In 65 genetically confirmed STL2 patients, 69% of individuals had
      hearing impairment and sensorineural loss predominated - the basis for
      the FREQUENT band recorded here.
  - reference: PMID:23110709
    reference_title: "Hearing impairment in Stickler syndrome: a systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Overall, mutations in COL11A1 (82.5%) and COL11A2 (94.1%) seem to be more frequently associated with hearing impairment than mutations in COL2A1 (52.2%)"
    explanation: >
      A gene-scoped literature review puts hearing impairment at 82.5% of
      COL11A1 patients, higher than the 69% measured in the single
      genetically confirmed cohort above; the lower, directly measured figure
      is the one the band follows.
- category: Auditory
  name: Conductive hearing impairment
  description: >
    A conductive component is present in a small minority of ears (3%).
    Separately, hypermobile tympanic membranes are found in 24% of ears -
    less often than has been documented in type 1 disease - and, when
    present, are attributed to collagen abnormality in the middle ear itself.
    The two observations are distinct: the source makes the collagen
    attribution for the hypermobile tympanic membrane, not for the conductive
    loss, and a palatal defect with middle ear effusion is a well-described
    route to conductive loss in Stickler syndrome.
  phenotype_term:
    preferred_term: Conductive hearing impairment
    term:
      id: HP:0000405
      label: Conductive hearing impairment
  evidence:
  - reference: PMID:32901364
    reference_title: "Auditory dysfunction in type 2 Stickler Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sensorineural hearing loss was most common (77% of ears), with conductive (3%), mixed (7%) and no hearing loss (13%), respectively. The proportion of hypermobile tympanic membranes (24%) was less than previously documented in type 1 Stickler Syndrome. When present, this appears to arise as a direct result of collagen abnormalities in the middle ear."
    explanation: >
      The 3% figure is the conductive share of ears. The middle-ear collagen
      attribution in the final sentence is made for the hypermobile tympanic
      membranes, not for the conductive loss. No frequency band is set
      because the reported denominator is ears, not individuals.
  - reference: PMID:23110709
    reference_title: "Hearing impairment in Stickler syndrome: a systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Conductive (14.1%) and mixed (18.1%) hearing loss was primarily found in young patients or patients with a palatal defect"
    explanation: >
      Across the Stickler literature the conductive component tracks young
      age and palatal defect, which is the effusion route rather than an
      intrinsic middle-ear collagen defect. Recorded here because it is the
      counterpoint to the single-cohort attribution above, and it is scoped
      to Stickler syndrome as a whole rather than to type 2.

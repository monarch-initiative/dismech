name: Stickler Syndrome Type 2
creation_date: "2026-09-04T00:00:00Z"
category: Mendelian
description: >
  Stickler syndrome type 2 (STL2) is the COL11A1-related form of Stickler
  syndrome, an autosomal dominant hereditary arthro-ophthalmopathy. Type XI
  collagen is a quantitatively minor fibrillar collagen that nucleates and
  limits the lateral growth of the type II collagen fibrils of vitreous,
  cartilage and cochlear extracellular matrix; a heterozygous COL11A1 variant
  in the triple-helical domain is incorporated into the heterotrimer and
  poisons that regulatory function. STL2 is separated from the commoner COL2A1
  form (type 1) at the slit lamp: the vitreous lamellae are irregular and
  beaded rather than membranous. Clinically it combines congenital high myopia
  and a lifelong risk of giant retinal tear and rhegmatogenous retinal
  detachment with predominantly cochlear sensorineural hearing loss, midfacial
  hypoplasia and cleft palate, and early degenerative joint disease. Hearing
  loss is both more frequent and more prominent than in type 1.
disease_term:
  preferred_term: Stickler syndrome type 2
  term:
    id: MONDO:0011493
    label: Stickler syndrome type 2
synonyms:
- STL2
- COL11A1-related Stickler syndrome
- beaded vitreous Stickler syndrome
- hereditary arthro-ophthalmopathy, type 2
parents:
- Stickler Syndrome
references:
- reference: PMID:20301479
  title: "Stickler Syndrome."
  tags:

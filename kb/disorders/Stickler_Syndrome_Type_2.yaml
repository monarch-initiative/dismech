genetic:
- name: COL11A1
  gene_term:
    preferred_term: COL11A1
    term:
      id: hgnc:2186
      label: COL11A1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  inheritance:
  - name: Autosomal dominant
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
  features: >
    Encodes the pro-alpha1 chain of type XI collagen. Pathogenic variants in
    the triple-helical domain - glycine substitutions and splice changes
    causing in-frame exon skipping - classically act through
    dominant-negative incorporation into the collagen XI heterotrimer, which
    distinguishes the mechanism from the haploinsufficiency typical of
    COL2A1-related type 1 disease. Nonsense and frameshift COL11A1 alleles
    may instead act by haploinsufficiency; that branch is not separately
    evidenced in this entry.
  evidence:
  - reference: PMID:8872475
    reference_title: "A family with Stickler syndrome type 2 has a mutation in the COL11A1 gene resulting in the substitution of glycine 97 by valine in alpha 1 (XI) collagen."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "only mutations in COL11A1 will give the full syndrome including the vitreo-retinal features"
    explanation: >
      Establishes COL11A1 as the causal locus for the full type 2 phenotype
      including the ocular features, separating it from COL11A2.
  - reference: PMID:12527136
    reference_title: "Auditory function associated with Col11a1 haploinsufficiency in chondrodysplasia (cho) mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Heterozygosity for mutations in the fibrillar collagen gene COL11A1 causes sensorineural hearing loss in patients with Stickler syndrome or Marshall syndrome"
    explanation: >
      States the heterozygous COL11A1 gene-disease relationship curated here.
  case_fractions:
  - population: Stickler syndrome patients (all types, literature estimate)
    case_fraction_low: 10.0
    case_fraction_high: 20.0
    notes: >
      The share of Stickler syndrome patients carrying a COL11A1 variant, as
      stated in a case report's introduction rather than measured in a
      cohort. Treat it as the field's working figure, not a measurement.
    evidence:
    - reference: PMID:32558342
      reference_title: "Variable clinical expression of Stickler Syndrome: A case report of a novel COL11A1 mutation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "a heterozygous mutation in COL11A1 gene is identified in about 10 to 20% of Stickler Syndrome patients"
      explanation: >
        Gives the COL11A1 share of Stickler syndrome cases recorded by this
        case fraction.
  notes: >
    Biallelic loss-of-function COL11A1 variants cause fibrochondrogenesis
    rather than STL2, and other COL11A1 variants cause Marshall syndrome and
    non-syndromic hearing loss; the allelic series is not curated in this
    entry.
environmental:
- name: Ocular or head trauma, including contact sports
  description: >
    Trauma is not a cause of STL2 - the disease is fully monogenic - but it is
    the trigger that converts an already abnormal vitreoretinal interface into
    a detachment. This is the interaction behind the syndrome's one standing
    activity restriction.
  effect: Precipitates retinal tear and detachment in an eye already at risk
  influences_mechanisms:
  - target: Vitreoretinal Traction and Retinal Tear
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >
      Impact transmitted to an abnormal vitreous gel produces the tractional
      tear that the intrinsic mechanism has already made the eye vulnerable
      to.
    evidence:
    - reference: PMID:20301479
      reference_title: "Stickler Syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Activities such as contact sports that may lead to traumatic retinal detachment."
      explanation: >
        GeneReviews names contact sports as the activity that may lead to
        traumatic retinal detachment, which is the exposure-to-mechanism link
        asserted here.
  evidence:
  - reference: PMID:20301479
    reference_title: "Stickler Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Agents/circumstances to avoid: Activities such as contact sports that may lead to traumatic retinal detachment."
    explanation: >
      The GeneReviews circumstances-to-avoid item establishing trauma as the
      relevant environmental exposure in this disease.
  notes: >
    Left without an `exposure_term`. ECTO was searched for trauma, injury,
    mechanical and physical exposure terms and for sport; it has
    `ECTO:6000002` exposure to exercise and `ECTO:6000031` exposure to
    strenuous exercise, neither of which means blunt ocular or head trauma.
    No term beats a wrong one, so none is bound.
animal_models:
- name: cho/+ heterozygous Col11a1 mouse
  species: Mouse
  genotype: Col11a1 cho/+ (heterozygous functional null)
  publication: PMID:13130470
  description: >
    The spontaneous chondrodysplasia (cho) allele is a functional null of
    Col11a1. Homozygotes die perinatally; heterozygotes are viable and are the
    standard genetic model for the joint arm of COL11A1 disease. Because the
    allele is a null rather than a dominant-negative missense change, the
    heterozygote models haploinsufficiency and not the human STL2 lesion -
    which is why it splits so sharply between the joint and ear phenotypes.
  modeled_mechanisms:
  - target: Articular Cartilage Degeneration
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >
      cho/+ mice develop increased articular cartilage fibril diameter and
      osteoarthritis-like degeneration of knee and temporomandibular joints
      from three months of age.
    limitations: >
      The cho allele is a functional null, so the heterozygote reproduces the
      joint phenotype through halved collagen XI dosage rather than through
      the dominant-negative incorporation that operates in human STL2.
    readouts:
    - name: Articular cartilage collagen fibril diameter
      target: Articular Cartilage Degeneration
      direction: INCREASED
      interpretation: >
        Structural correlate of loss of collagen XI fibril-diameter control
        in the joint.
      evidence:
      - reference: PMID:13130470
        reference_title: "Osteoarthritis-like changes and decreased mechanical function of articular cartilage in the joints of mice with the chondrodysplasia gene (cho)."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The diameter of collagen fibrils in articular cartilage of knee joints from heterozygous cho/+ mice was increased relative to that in control cartilage"
        explanation: Reports the fibril-diameter measurement behind this readout.
    evidence:
    - reference: PMID:13130470
      reference_title: "Osteoarthritis-like changes and decreased mechanical function of articular cartilage in the joints of mice with the chondrodysplasia gene (cho)."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Heterozygosity for a loss-of-function mutation in Col11a1 results in the development of OA in the knee and TM joints of cho/+ mice"
      explanation: >
        Supports treating cho/+ as informative for the articular cartilage
        degeneration node.
  - target: Cochlear Extracellular Matrix Abnormality
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >
      Auditory brainstem response thresholds in cho/+ mice are
      indistinguishable from wild-type littermates through ten months of age,
      despite the same animals developing the joint phenotype. Human COL11A1
      heterozygotes have frequent sensorineural hearing loss.
    limitations: >
      The negative result is specific to a null allele on a C57BL/6
      background. The authors read it as evidence that the human auditory
      phenotype requires dominant-negative mutant chains rather than reduced
      dosage, so the model's failure is mechanistically informative but it
      cannot be used to study the human cochlear lesion.
    readouts:
    - name: Auditory brainstem response threshold
      target: Cochlear Extracellular Matrix Abnormality
      direction: UNCHANGED
      interpretation: >
        No hearing loss detectable in the heterozygote at any age tested - a
        negative result against the human phenotype.
      evidence:
      - reference: PMID:12527136
        reference_title: "Auditory function associated with Col11a1 haploinsufficiency in chondrodysplasia (cho) mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "There was no difference in ABR thresholds for click and tone burst stimuli between cho/+ and +/+ mice at all ages"
        explanation: Reports the ABR measurement behind this readout.
    evidence:
    - reference: PMID:12527136
      reference_title: "Auditory function associated with Col11a1 haploinsufficiency in chondrodysplasia (cho) mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "our results indicate that Col11a1 haploinsufficiency does not cause significant hearing loss on the C57BL/6 strain background"
      explanation: >
        Substantiates the failure of this model to reproduce the human
        cochlear phenotype.
  evidence:
  - reference: PMID:12527136
    reference_title: "Auditory function associated with Col11a1 haploinsufficiency in chondrodysplasia (cho) mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Chondrodysplasia (cho) is a functional null allele of Col11a1 that causes lethal chondrodysplasia in cho/cho newborn mice, and osteoarthritis in cho/+ heterozygotes."
    explanation: >
      Establishes the identity and phenotype of the cho/+ model recorded
      here: a Col11a1 functional null whose heterozygote develops
      osteoarthritis.
- name: col11a1a morpholino knockdown zebrafish
  species: Zebrafish
  genotype: col11a1a morpholino knockdown
  publication: PMID:19638309
  description: >
    Morpholino knockdown of the zebrafish COL11A1 ortholog, expressed at 48
    hours post fertilisation in craniofacial skeleton, pectoral fin
    endoskeleton and otic vesicles.
  modeled_mechanisms:
  - target: Craniofacial Cartilage Malformation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >
      Knockdown embryos develop craniofacial cartilage defects with
      disordered chondrocyte organization and abnormally thick, sparse
      cartilage matrix fibrils, which the authors note resemble human
      Stickler/Marshall chondrodysplasia.
    limitations: >
      A transient morpholino knockdown in a teleost with two COL11A1
      orthologs, modelling loss of collagen XI rather than the human
      dominant-negative allele; no ocular or auditory phenotype was assessed.
    evidence:
    - reference: PMID:19638309
      reference_title: "Craniofacial cartilage morphogenesis requires zebrafish col11a1 activity."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "the defects observed in cartilage formation resemble those observed in human chondrodysplasia such as the Stickler/Marshall syndrome"
      explanation: >
        The authors' own assessment that this model is informative for the
        human craniofacial cartilage phenotype.
  evidence:
  - reference: PMID:19638309
    reference_title: "Craniofacial cartilage morphogenesis requires zebrafish col11a1 activity."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Zebrafish represent a novel reliable vertebrate model for collagen XI collagenopathies."
    explanation: >
      The authors' assessment that this model system is informative for the
      collagen XI collagenopathies, of which STL2 is one.
treatments:
- name: Prophylactic Retinal Cryotherapy
  description: >
    360-degree contiguous cryotherapy at the retina-pars plana junction, to
    forestall giant retinal tear and detachment before it happens. The
    controlled evidence comes from type 1 cohorts, so use in STL2 is
    extrapolated from the shared vitreoretinal mechanism rather than
    demonstrated.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: retinal cryotherapy
    term:
      id: NCIT:C40030
      label: Cryotherapy
  target_mechanisms:
  - target: Vitreoretinal Traction and Retinal Tear
    description: >
      Prophylactic chorioretinal adhesion at the vitreous base blocks the
      progression from vitreoretinal traction to detachment.
  evidence:
  - reference: PMID:24793526
    reference_title: "Prevention of retinal detachment in Stickler syndrome: the Cambridge prophylactic cryotherapy protocol."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "all analyses indicate that the Cambridge prophylactic cryotherapy protocol is safe and markedly reduces the risk of retinal detachment"
    explanation: >
      The controlled cohort establishing prophylactic cryotherapy efficacy was
      conducted in 487 type 1 Stickler syndrome patients, so it supports use
      in type 2 only by extension from the shared vitreoretinal mechanism.
  - reference: PMID:21466760
    reference_title: "The clinical effectiveness and safety of prophylactic retinal interventions to reduce the risk of retinal detachment and subsequent vision loss in adults and children with Stickler syndrome: a systematic review."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Only 360° cryotherapy and focal and circumferential laser treatment have been evaluated for the type 1 Stickler syndrome population, and then only by a single retrospective, controlled, cohort study in each case."
    explanation: >
      A systematic review making the scope limitation explicit: the
      prophylaxis evidence base is type 1 and retrospective, which is why
      this treatment carries INDIRECT directness for type 2.
  notes: >
    The same review flags a high risk of bias in both underlying studies and
    the absence of randomised data. Determining the retinal detachment risk
    of type 2 patients specifically was named as a service priority.
- name: Prophylactic 360-Degree Laser Retinopexy
  description: >
    Circumferential laser retinopexy posterior to the ora serrata, the other
    arm of retinal-detachment prophylaxis. As with cryotherapy the reported
    series are in Stickler syndrome broadly rather than type 2 specifically.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: laser retinopexy
    term:
      id: NCIT:C15466
      label: Laser Therapy
  target_mechanisms:
  - target: Vitreoretinal Traction and Retinal Tear
    description: >
      Laser-induced chorioretinal adhesion at the vitreous base interrupts
      the progression from a traction tear to detachment.
  evidence:
  - reference: PMID:36583093
    reference_title: "Preventing Retinal Detachment: Where are We? Implications from Stickler Syndrome."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "extraordinary publications in 2021-2022, each reporting successful prevention of RRD in Stickler syndrome, using 360-degree (encircling) laser retinopexy"
    explanation: >
      Reports successful prevention of rhegmatogenous retinal detachment with
      360-degree laser retinopexy in Stickler syndrome. Scoped to Stickler
      syndrome as a whole rather than to type 2, hence INDIRECT.
  - reference: PMID:20301479
    reference_title: "Stickler Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "laser therapy for prevention of retinal detachment"
    explanation: >
      GeneReviews names laser therapy for retinal detachment prevention among
      the treatments of manifestations.
- name: Ophthalmic Surveillance, Refractive Correction and Patient Education
  description: >
    Annual review by a vitreoretinal specialist, spectacle correction of the
    refractive error, and teaching patients the symptoms of a detachment so
    they present within the window in which vision can be saved. Repair of an
    established detachment is not curated as a separate treatment here - see
    the entry `notes`.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: ophthalmic surveillance and patient education
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_phenotypes:
  - preferred_term: Retinal detachment
    term:
      id: HP:0000541
      label: Retinal detachment
  - preferred_term: High myopia
    term:
      id: HP:0011003
      label: High myopia
  evidence:
  - reference: PMID:20301479
    reference_title: "Stickler Syndrome."

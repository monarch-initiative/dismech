definitions:
- name: Orphanet disease definition
  definition_type: CASE_DEFINITION
  description: >
    Orphanet defines Stickler syndrome as a group of connective tissue
    disorders with ophthalmic, auditory, orofacial and articular
    manifestations, whose two main clinical forms are separated by the
    vitreous phenotype; type 2 shows sparse, irregularly thickened fibre
    bundles throughout the vitreous cavity.
  evidence:
  - reference: ORPHA:828
    reference_title: "Stickler syndrome"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "A rare group of genetic connective tissue disorders characterized by ophthalmic, auditory, orofacial and articular manifestations"
    explanation: >
      Orphanet's definition of the Stickler syndrome group, of which the
      COL11A1-related type 2 curated here is one of the two main clinical
      forms.
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0019354
      label: Stickler syndrome
    mapping_predicate: skos:broadMatch
    mapping_source: ORPHA:828
    mapping_justification: >
      Orphanet cross-references its Stickler syndrome record to the broader
      MONDO grouping class. This entry curates the COL11A1-related type 2
      subtype specifically (MONDO:0011493), so the mapping to the group term
      is broad.
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  expressivity: VARIABLE
  description: >
    Classic STL2 segregates as an autosomal dominant trait, with a single
    heterozygous COL11A1 variant sufficient to produce the full syndrome
    including the vitreoretinal features. Expressivity is highly variable
    both within and among families; locus and allelic heterogeneity account
    for part of the interfamilial variability.
  evidence:
  - reference: PMID:8872475
    reference_title: "A family with Stickler syndrome type 2 has a mutation in the COL11A1 gene resulting in the substitution of glycine 97 by valine in alpha 1 (XI) collagen."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Stickler syndrome (hereditary arthro-ophthalmopathy) is the commonest inherited cause of retinal detachment and one of the commonest autosomal dominant connective tissue dysplasias"
    explanation: >
      The defining COL11A1 linkage study describes Stickler syndrome as an
      autosomal dominant connective tissue dysplasia.
  - reference: PMID:20301479
    reference_title: "Stickler Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Stickler syndrome caused by pathogenic variants in COL2A1, COL11A1, or COL11A2 is inherited in an autosomal dominant manner"
    explanation: >
      GeneReviews states the inheritance mode for the COL11A1-related form
      curated here.
  - reference: PMID:20301479
    reference_title: "Stickler Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Variable phenotypic expression of Stickler syndrome occurs both within and among families; interfamilial variability is in part explained by locus and allelic heterogeneity"
    explanation: Supports the variable-expressivity statement recorded above.
prevalence:
- population: Worldwide
  measure_type: BIRTH_PREVALENCE
  prevalence_class: UNKNOWN
  notes: >
    No band or rate is asserted. Orphanet's birth-prevalence rows are scoped
    to the whole Stickler syndrome group, of which COL11A1-related type 2 is
    the minority form, and those rows disagree with each other by two orders
    of magnitude - from 1-9 per 1,000,000 in France to 1-5 per 10,000
    worldwide. No type-2-specific population estimate was found, so the
    record carries the association and the reason a number was declined.
    The share of Stickler patients who carry a COL11A1 variant is recorded
    instead as a case fraction under `genetic`.
  evidence:
  - reference: ORPHA:828
    reference_title: "Stickler syndrome"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "1-5 / 10 000 | Worldwide | Prevalence at birth | PMID:20301479"
    explanation: >
      Cited for the association only. This is Orphanet's worldwide
      birth-prevalence class for the Stickler syndrome group as a whole, so
      no band is adopted for type 2: the row is scoped more broadly than this
      entry, and Orphanet's own record carries four other rows spanning a
      500-fold range.
pathophysiology:
- name: COL11A1 Triple-Helical Domain Variant
  description: >
    A heterozygous COL11A1 variant - classically a glycine substitution within
    the Gly-X-Y repeat of the triple-helical domain, or a splice-site change
    causing in-frame skipping of a triple-helical exon - yields a structurally
    abnormal pro-alpha1(XI) chain. The chain is still competent to enter the
    type XI heterotrimer, which is what makes the lesion dominant negative
    rather than a simple loss of one allele's product.
  biological_scale: MOLECULAR
  genetic_context:
    gene:
      preferred_term: COL11A1
      term:
        id: hgnc:2186
        label: COL11A1
    allele_type: SNV
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: DOMINANT_NEGATIVE
    description: >
      Heterozygous germline COL11A1 variants acting through incorporation of
      the mutant chain into the collagen XI heterotrimer.
  downstream:
  - target: Impaired Type XI Collagen Regulation of Fibrillogenesis
    causal_link_type: DIRECT
    description: >
      The mutant alpha1(XI) chain is incorporated into wild-type-containing
      fibrillar collagen assemblies and disrupts their function.
    evidence:
    - reference: PMID:12527136
      reference_title: "Auditory function associated with Col11a1 haploinsufficiency in chondrodysplasia (cho) mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We conclude that Stickler syndrome and Marshall syndrome mutations in COL11A1 cause hearing loss via dominant negative effects upon wild-type fibrillar collagen polypeptides in the extracellular matrices of the cochlea"
      explanation: >
        States the causal step from the COL11A1 variant to poisoning of
        wild-type fibrillar collagen, which is the edge asserted here. The
        authors reach it because halving Col11a1 dosage in the mouse does not
        reproduce the human phenotype.
  evidence:
  - reference: PMID:8872475
    reference_title: "A family with Stickler syndrome type 2 has a mutation in the COL11A1 gene resulting in the substitution of glycine 97 by valine in alpha 1 (XI) collagen."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "characterise the mutation as a Glycine to Valine substitution at position 97 of the triple helical domain caused by a single base G-->T mutation"
    explanation: >
      The founding STL2 family carries a glycine substitution in the
      triple-helical domain of alpha1(XI), the variant class described by
      this node.
  - reference: PMID:8872475
    reference_title: "A family with Stickler syndrome type 2 has a mutation in the COL11A1 gene resulting in the substitution of glycine 97 by valine in alpha 1 (XI) collagen."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a family with the full Type 2 Stickler syndrome including vitreous and retinal abnormalities is linked to the COL11A1 gene"
    explanation: >
      Establishes COL11A1 as the locus for the full type 2 syndrome,
      vitreoretinal features included.
  - reference: PMID:10486316
    reference_title: "Splicing mutations of 54-bp exons in the COL11A1 gene cause Marshall syndrome, but other mutations cause overlapping Marshall/Stickler phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genotypic-phenotypic comparison revealed an association between the Marshall syndrome phenotype and splicing mutations of 54-bp exons in the C-terminal region of the COL11A1 gene"
    explanation: >
      Shows that where in COL11A1 the variant falls, and what kind it is,
      determines whether the phenotype reads as Marshall or as Stickler -
      the reason this node is specified by variant class and not by gene
      alone.
- name: Impaired Type XI Collagen Regulation of Fibrillogenesis
  description: >
    Type XI collagen co-assembles with type II collagen and controls fibril
    nucleation, diameter and spacing. With a mutant alpha1(XI) chain in the
    heterotrimer, that control is lost and the resulting heterotypic fibrils
    are abnormally sized, sparse and disorganized wherever the type II/XI
    network is load-bearing.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: collagen fibril organization
    term:
      id: GO:0030199
      label: collagen fibril organization
    modifier: DECREASED
  - preferred_term: extracellular matrix organization
    term:
      id: GO:0030198
      label: extracellular matrix organization
    modifier: DECREASED
  downstream:
  - target: Beaded Vitreous Anomaly
    causal_link_type: DIRECT
    description: >
      In the vitreous the same loss of fibril regulation presents as the
      beaded lamellar phenotype, which tracks the causal gene closely enough
      to be used clinically to predict it.
    evidence:
    - reference: PMID:20513134
      reference_title: "Stickler syndrome and the vitreous phenotype: mutations in COL2A1 and COL11A1."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Although the systemic phenotype is highly variable, the vitreous phenotype has been used successfully to differentiate between patients with mutations in these different genes."
      explanation: >
        Establishes that the vitreous phenotype is determined by which
        collagen gene is mutated - the step from the molecular lesion to the
        vitreous appearance that this edge asserts.
  - target: Disorganized Cartilage Collagen Matrix
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:19638309
      reference_title: "Craniofacial cartilage morphogenesis requires zebrafish col11a1 activity."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Knockdown of col11a1 in embryos stimulated the expression of the marker of chondrocyte differentiation col2a1, resulting in the deposit of abnormally thick and sparse fibrils in the cartilage extracellular matrix"
      explanation: >
        Removing collagen XI is sufficient to produce an abnormal cartilage
        fibril matrix, which is the step this edge asserts.
  - target: Cochlear Extracellular Matrix Abnormality
    causal_link_type: DIRECT
    description: >
      The cochlear extracellular matrices carry the same fibrillar collagen,
      and it is the mutant chains within them - not reduced dosage - that the
      mouse work implicates.
    evidence:
    - reference: PMID:12527136
      reference_title: "Auditory function associated with Col11a1 haploinsufficiency in chondrodysplasia (cho) mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We conclude that Stickler syndrome and Marshall syndrome mutations in COL11A1 cause hearing loss via dominant negative effects upon wild-type fibrillar collagen polypeptides in the extracellular matrices of the cochlea"
      explanation: >
        States the step from poisoned fibrillar collagen to the cochlear
        extracellular matrices that this edge asserts.
  - target: Middle Ear Collagen Abnormality
    causal_link_type: DIRECT
    description: >
      A separate, smaller branch: the fibrous layer of the tympanic membrane
      is also collagenous, and abnormality there is hypermobility rather than
      cochlear dysfunction.
  - target: High myopia
    description: >
      The refractive error of STL2 is congenital or early in onset and is
      attributed to the same structural collagen defect in the developing
      eye. Left uncited: no source found states the step from collagen XI
      dysregulation to axial elongation, as opposed to listing myopia among
      the syndrome's features.
  evidence:
  - reference: PMID:7859283
    reference_title: "A fibrillar collagen gene, Col11a1, is essential for skeletal morphogenesis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The data demonstrate that collagen XI is essential for normal formation of cartilage collagen fibrils and the cohesive properties of cartilage"
    explanation: >
      The cho mouse establishes that collagen XI is required for normal
      fibril formation, the function lost at this node.
  - reference: PMID:32950601
    reference_title: "Collagen XI regulates the acquisition of collagen fibril structure, organization and functional properties in tendon."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Reducing Col11a1 and, therefore collagen XI content, resulted in abnormal fibril structure, loss of normal fibril diameter control with a significant shift to small diameters and disrupted parallel alignment of fibrils"
    explanation: >
      Directly demonstrates the loss of fibril-diameter control described by
      this node. Reported in tendon rather than vitreous or cartilage, so it
      supports the general regulatory role rather than the tissue-specific
      consequence.
  - reference: PMID:8872475
    reference_title: "A family with Stickler syndrome type 2 has a mutation in the COL11A1 gene resulting in the substitution of glycine 97 by valine in alpha 1 (XI) collagen."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Type XI collagen is a quantitatively minor fibrillar collagen related to type V collagen and associated with the more abundant type II collagen fibrils"
    explanation: >
      Supports the co-assembly of collagen XI with the abundant type II
      fibrils that this node's regulatory claim depends on.
- name: Beaded Vitreous Anomaly
  description: >
    In the vitreous the disordered type II/XI network presents as sparse,
    irregularly thickened and beaded lamellae, in contrast to the membranous
    vitreous of COL2A1-related type 1 disease. This is the sign the diagnosis
    is made on at the slit lamp.
  biological_scale: TISSUE
  locations:
  - preferred_term: vitreous humor
    term:
      id: UBERON:0001797
      label: vitreous humor
  downstream:
  - target: Vitreoretinal Traction and Retinal Tear
    causal_link_type: DIRECT
    description: >
      The abnormal gel is the substrate on which peripheral tractional tears
      form.
    evidence:
    - reference: PMID:36583093
      reference_title: "Preventing Retinal Detachment: Where are We? Implications from Stickler Syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Both syndromic and non-syndromic eyes suffer RRD predominately from the same pathogenesis, vitreous tractional tears in the peripheral retina."
      explanation: >
        Names vitreous tractional tearing of the peripheral retina as the
        pathogenesis of detachment in Stickler syndrome, which is the step
        this edge asserts.
  - target: Beaded vitreous appearance
  evidence:
  - reference: PMID:20513134
    reference_title: "Stickler syndrome and the vitreous phenotype: mutations in COL2A1 and COL11A1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast mutations in COL11A1 result in a different vitreous phenotype where the lamellae have an irregular and beaded appearance"
    explanation: >
      States the beaded vitreous phenotype of COL11A1 disease and its
      contrast with the COL2A1 membranous phenotype.
  - reference: PMID:10573014
    reference_title: "Stickler syndrome: further mutations in COL11A1 and evidence for additional locus heterogeneity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These data confirm that mutations in COL11A1 cause Stickler syndrome with the type2 vitreous phenotype and also reveal further locus heterogeneity"
    explanation: >
      Independent linkage confirmation that COL11A1 variants produce the type
      2 vitreous phenotype.
- name: Vitreoretinal Traction and Retinal Tear
  description: >
    The abnormal vitreous gel retains adherence at the vitreous base while
    losing its normal internal architecture, so that ordinary vitreous
    movement or minor trauma transmits traction to the peripheral retina and
    produces giant retinal tears.
  biological_scale: TISSUE
  downstream:
  - target: Retinal detachment
  evidence:
  - reference: PMID:36583093
    reference_title: "Preventing Retinal Detachment: Where are We? Implications from Stickler Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both syndromic and non-syndromic eyes suffer RRD predominately from the same pathogenesis, vitreous tractional tears in the peripheral retina."
    explanation: >
      Names the mechanism this node describes - peripheral tractional tearing
      driven by the vitreous - rather than merely associating the syndrome
      with detachment.
  - reference: PMID:36583093
    reference_title: "Preventing Retinal Detachment: Where are We? Implications from Stickler Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Stickler syndrome, a rare inherited disease, carries a lifetime risk of rhegmatogenous retinal detachment (RRD) of up to 65%, higher than any other predisposing condition known."
    explanation: >
      Quantifies the lifetime detachment risk this node leads to. Scoped to
      Stickler syndrome as a whole; no type-2 figure is asserted from it.
  - reference: PMID:24793526
    reference_title: "Prevention of retinal detachment in Stickler syndrome: the Cambridge prophylactic cryotherapy protocol."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "a standardized retinal prophylactic treatment developed to prevent retinal detachment arising from giant retinal tears in type 1 Stickler syndrome"
    explanation: >
      Names giant retinal tear as the route to detachment that prophylaxis
      targets. Scoped to type 1, so it reaches this node's claim by extension
      from the shared vitreoretinal mechanism.
- name: Disorganized Cartilage Collagen Matrix
  description: >
    In cartilage the same fibril dysregulation gives thick, sparse fibrils and
    disturbed spatial organization and hypertrophic maturation of
    chondrocytes, affecting both the craniofacial cartilages laid down in
    development and the articular cartilage that has to bear load for a
    lifetime.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  downstream:
  - target: Craniofacial Cartilage Malformation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:36278545
      reference_title: "The Shape of the Jaw-Zebrafish Col11a1a Regulates Meckel's Cartilage Morphogenesis and Mineralization."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "zebrafish col11a1a knockdown impairs the cellular organization of Meckel's cartilage in the developing jaw and alters the bone formation that occurs adjacent to the Meckel's cartilage"
      explanation: >
        Ties disordered cartilage cellular organization directly to
        malformation of a craniofacial cartilage and the bone formed against
        it.
  - target: Articular Cartilage Degeneration
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:13130470
      reference_title: "Osteoarthritis-like changes and decreased mechanical function of articular cartilage in the joints of mice with the chondrodysplasia gene (cho)."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The diameter of collagen fibrils in articular cartilage of knee joints from heterozygous cho/+ mice was increased relative to that in control cartilage, and histologic analysis showed OA-like degenerative changes in knee and TM joints, starting at age 3 months"
      explanation: >
        Reports the abnormal cartilage fibrils and the degeneration in the
        same joints, which is the step this edge asserts.
  evidence:
  - reference: PMID:19638309
    reference_title: "Craniofacial cartilage morphogenesis requires zebrafish col11a1 activity."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Col11a1 depletion affected the spatial organization of chondrocytes, the shaping of cartilage elements, and the maturation of chondrocytes to hypertrophy"
    explanation: >
      Describes the disorganized cartilage this node asserts, at the level of
      chondrocyte organization and maturation.
  - reference: PMID:7859283
    reference_title: "A fibrillar collagen gene, Col11a1, is essential for skeletal morphogenesis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "the normal differentiation and spatial organization of growth plate chondrocytes is critially dependent on the presence of type XI collagen in cartilage extracellular matrix"
    explanation: >
      The cho mouse links loss of cartilage collagen XI to disordered growth
      plate chondrocyte organization.
- name: Craniofacial Cartilage Malformation
  description: >
    Defective cartilage matrix during craniofacial morphogenesis underlies the
    midfacial hypoplasia and the failure of palatal shelf fusion seen as cleft
    palate or Pierre Robin sequence.
  biological_scale: TISSUE
  downstream:
  - target: Midface retrusion
  - target: Cleft palate
  evidence:
  - reference: PMID:19638309
    reference_title: "Craniofacial cartilage morphogenesis requires zebrafish col11a1 activity."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Collagen XI alpha1-deficient zebrafish embryos developed defects in craniofacial cartilage formation and in notochord morphology"
    explanation: >
      Demonstrates that loss of collagen XI produces craniofacial cartilage
      malformation, the claim of this node. The authors note the defects
      resemble human Stickler/Marshall chondrodysplasia.
- name: Articular Cartilage Degeneration
  description: >
    Articular cartilage built on abnormally thick fibrils degenerates early,
    with matrix metalloproteinase induction, proteoglycan loss and reduced
    tensile stiffness preceding the clinical arthropathy.
  biological_scale: TISSUE
  downstream:
  - target: Premature osteoarthritis
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:13130470
      reference_title: "Osteoarthritis-like changes and decreased mechanical function of articular cartilage in the joints of mice with the chondrodysplasia gene (cho)."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Morphologic and biochemical evidence of OA appears to precede significant mechanical changes, suggesting that the cho mutation leads to OA through a mechanism that does not initially involve mechanical factors."
      explanation: >
        Orders the steps: the matrix change comes first and the osteoarthritis
        follows, which is the direction this edge asserts.
  evidence:
  - reference: PMID:13130470
    reference_title: "Osteoarthritis-like changes and decreased mechanical function of articular cartilage in the joints of mice with the chondrodysplasia gene (cho)."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The diameter of collagen fibrils in articular cartilage of knee joints from heterozygous cho/+ mice was increased relative to that in control cartilage, and histologic analysis showed OA-like degenerative changes in knee and TM joints, starting at age 3 months"
    explanation: >
      Ties increased fibril diameter from reduced collagen XI directly to
      early degenerative change in articular cartilage.
  - reference: PMID:13130470
    reference_title: "Osteoarthritis-like changes and decreased mechanical function of articular cartilage in the joints of mice with the chondrodysplasia gene (cho)."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Heterozygosity for a loss-of-function mutation in Col11a1 results in the development of OA in the knee and TM joints of cho/+ mice"
    explanation: >
      A single abnormal Col11a1 allele is sufficient for early osteoarthritis
      in the mouse joint.
- name: Middle Ear Collagen Abnormality
  description: >
    The fibrous layer of the tympanic membrane is collagenous too. Abnormal
    collagen there gives a hypermobile tympanic membrane, found in about a
    quarter of ears in type 2 disease and less often than in type 1. This is
    a distinct route to hearing impairment from the cochlear node, and it is
    not the only route to a conductive loss: palatal clefting with middle ear
    effusion accounts for much of the conductive component across Stickler
    syndrome.
  biological_scale: TISSUE
  downstream:
  - target: Conductive hearing impairment
  evidence:
  - reference: PMID:32901364
    reference_title: Auditory dysfunction in type 2 Stickler Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The proportion of hypermobile tympanic membranes (24%) was less than previously documented in type 1 Stickler Syndrome. When present, this appears to arise as a direct result of collagen abnormalities in the middle ear."
    explanation: >
      Attributes tympanic membrane hypermobility in genetically confirmed
      STL2 patients to middle ear collagen abnormality, which is this node's
      claim, and quantifies it against type 1.
- name: Cochlear Extracellular Matrix Abnormality
  description: >
    Col11a1 is expressed in the developing cochlea and contributes collagen to
    the basilar and tectorial membranes. A dominant-negative alpha1(XI) chain
    in those specialized matrices degrades sound transduction across the whole
    frequency range, giving a cochlear - not retrocochlear - hearing loss.
  biological_scale: TISSUE
  locations:
  - preferred_term: cochlea
    term:
      id: UBERON:0001844
      label: cochlea
  downstream:
  - target: Sensorineural hearing impairment
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:12527136
      reference_title: "Auditory function associated with Col11a1 haploinsufficiency in chondrodysplasia (cho) mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Heterozygosity for mutations in the fibrillar collagen gene COL11A1 causes sensorineural hearing loss in patients with Stickler syndrome or Marshall syndrome."
      explanation: >
        States the causal step from the COL11A1 collagen lesion to
        sensorineural hearing loss in patients.
  evidence:
  - reference: PMID:15141750
    reference_title: "Col11a1 and Col11a2 mRNA expression in the developing mouse cochlea: implications for the correlation of hearing loss phenotype with mutant type XI collagen genotype."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The expression patterns suggest essential roles for Col11a1 and Col11a2 in the basilar or tectorial membranes"
    explanation: >
      Localizes Col11a1 expression to the cochlear structures this node
      implicates.
  - reference: PMID:32901364
    reference_title: "Auditory dysfunction in type 2 Stickler Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "it is likely that hearing loss in type 2 Stickler Syndrome arises in the auditory periphery, without significant central processing deficits"
    explanation: >
      Localizes the lesion in genetically confirmed STL2 patients to the
      cochlea rather than to central auditory processing.
  - reference: PMID:32901364
    reference_title: "Auditory dysfunction in type 2 Stickler Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The impact on hearing thresholds can be seen across the frequency range, suggesting a contribution of defective collagen throughout the cochlea"
    explanation: >
      The pan-frequency threshold shift is the authors' argument for defective
      collagen distributed through the cochlea, which is this node's claim.
phenotypes:
- category: Ophthalmologic
  name: Beaded vitreous appearance
  description: >
    Sparse, irregularly thickened and beaded vitreous lamellae throughout the
    vitreous cavity - the type 2 vitreous phenotype, and the sign that
    separates COL11A1 from COL2A1 disease clinically.
  phenotype_term:
    preferred_term: Beaded vitreous appearance
    term:
      id: HP:0031154
      label: Beaded vitreous appearance

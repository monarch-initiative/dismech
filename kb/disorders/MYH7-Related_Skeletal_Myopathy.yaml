      label: striated muscle myosin thick filament
  evidence:
  - reference: PMID:22155079
    reference_title: "Effects of pathogenic proline mutations on myosin assembly."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We show that, while the two mutations inhibit myosin self-assembly in
      non-muscle cells, they do not prevent incorporation of the mutant myosin
      into sarcomeres. Nevertheless, we find that the L1706P mutation affects
      proper antiparallel myosin association by accumulating in the bare zone
      of the sarcomere.
    explanation: Laing proline variants impair self-assembly and mispack in the sarcomere.
  - reference: PMID:29660325
    reference_title: "A1603P and K1617del, Mutations in β-Cardiac Myosin Heavy Chain that Cause Laing Early-Onset Distal Myopathy, Affect Secondary Structure and Filament Formation In Vitro and In Vivo."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Mutant eGFP-tagged β-MHC accumulated abnormally into the M-line of
      sarcomeres in cultured skeletal muscle myotubes.
    explanation: Mutant myosin mislocalizes within sarcomeres of cultured myotubes.
  - reference: PMID:19336582
    reference_title: "Mutations in the beta-myosin rod cause myosin storage myopathy via multiple mechanisms."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These mechanisms range from thermodynamic and functional irregularities
      of individual proteins (L1793P), to varying defects in the assembly and
      stability of filaments formed from the proteins (R1845W, E1886K, and
      H1901L).
    explanation: Myosin storage alleles defectively assemble or destabilize filaments.
  - reference: PMID:39485824
    reference_title: "Dominant myosin storage myopathy mutations disrupt striated muscles in Drosophila and the myosin tail-tail interactome of human cardiac thick filaments."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Incorporation of GFP-myosin enabled in situ determination of thick
      filament lengths, which were significantly reduced in all mutants.
    explanation: Heterozygous myosin storage alleles shorten thick filaments in vivo.

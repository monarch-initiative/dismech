    reference_title: "Laing Distal Myopathy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Laing distal myopathy is an autosomal dominant disorder. Approximately
      65%-70% of affected individuals have an affected parent; de novo
      pathogenic variants in MYH7 account for 30%-35% of individuals with Laing
      distal myopathy.
    explanation: GeneReviews states the inheritance and the de novo fraction.
  - reference: PMID:20301606
    reference_title: "Laing Distal Myopathy."
    supports: SUPPORT

- name: Coiled-Coil Destabilization of the Myosin Rod
  biological_scale: MOLECULAR
  description: >-
    Prolines and single-residue deletions break the heptad repeat that holds
    the two heavy-chain alpha-helices in a coiled coil, lowering helical
    content of the rod. Distal-rod missense changes alter the hydropathy or
    charge of residues that stabilize coiled-coil dimers.

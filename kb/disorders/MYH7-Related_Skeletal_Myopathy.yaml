    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Proline substitutions within the coiled-coil rod region of the β-myosin
      gene (MYH7) are the predominant mutations causing Laing distal myopathy
      (MPD1)
    explanation: >-
      Proline substitutions in the rod are the predominant Laing variant class;
      stated as background in a mouse-model paper.
  - reference: PMID:33298082
    reference_title: "Clinical features and genotypes of Laing distal myopathy in a group of Chinese patients, with in-frame deletions of MYH7 as common mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In-frame deletions of the MYH7 gene made up 3/4 of mutations in our
      patients, suggesting that these are common mutations of Laing distal
      myopathy.
    explanation: Single-residue in-frame deletions are the other common Laing variant class.
  - reference: CGGV:assertion_8974721a-f333-4fb7-b8b7-043233d3d100-2021-05-13T160000.000Z
    reference_title: "MYH7 / MYH7-related skeletal myopathy (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The mechanism for disease is dominant negative
    explanation: ClinGen's mechanism call for the lumped entity.
  - reference: PMID:32833721
    reference_title: "Laing Myopathy: Report of 4 New Families With Novel MYH7 Mutations, Double Mutations, and Severe Phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most patients with LDM harbor mutations in the midrod domain of the MYH7
      gene, but rare cases document disease-associated mutations in the

differential_diagnoses:
- name: Hereditary motor neuropathy or Charcot-Marie-Tooth disease
  distinguishing_features:
  - >-
    Neurogenic-appearing EMG in MYH7 myopathy can mimic a neuropathy; muscle
    MRI, family history and genetic testing distinguish them.
  evidence:
  - reference: PMID:25695922
    reference_title: "Two families with MYH7 distal myopathy associated with cardiomyopathy and core formations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both families were initially misdiagnosed with either central core
      disease or hereditary neuropathy.
    explanation: Documents misdiagnosis as neuropathy or central core disease.
- name: Central core disease and other congenital core myopathies
  distinguishing_features:
  - >-
    Cores are common in MYH7 myopathy; the distal pattern with a hanging great
    toe points to MYH7.
  evidence:
  - reference: PMID:20733148
    reference_title: "MYH7 gene tail mutation causing myopathic profiles beyond Laing distal myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The p.K1729del mutation in the MYH7 gene expresses notable clinical
      variability and electromyographic and pathologic features that can lead
      to the misdiagnosis of neurogenic atrophies, congenital myopathies, or
      mitochondrial myopathies.
    explanation: Overlap with congenital and mitochondrial myopathies.
- name: Other distal myopathies (Udd, Welander, GNE myopathy)
  distinguishing_features:
  - >-
    Earlier onset, and rimmed vacuoles are uncommon in MYH7 myopathy but
    typical of most other distal myopathies.
  evidence:
  - reference: PMID:12062252
    reference_title: "Early onset chromosome 14-linked distal myopathy (Laing)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, the age of onset was earlier than in these other myopathies and
      rimmed vacuoles were not found in biopsies from two affected individuals.
    explanation: Distinguishes Laing from tibial-type distal myopathies.
discussions:
- discussion_id: assembly_versus_energetics
  prompt: >-
    Is weakness in MYH7 rod myopathy driven mainly by defective thick-filament
    assembly and aggregation, or by loss of myosin head sequestration and
    raised ATP use, and is the human disease hypercontractile?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#Defective Thick Filament Assembly
  - pathophysiology#Loss of Myosin Head Sequestration
  - mechanistic_hypotheses#rod_assembly_aggregation
  - mechanistic_hypotheses#rod_srx_energetics
  rationale: >-
    The two models rest on different systems (in vitro and fly assembly
    studies versus a transgenic mouse and patient biopsies) and lead to
    different therapies. The mouse study reports hypercontractility; a study of
    patient myofibres with LMM variants reports unchanged contractility.
  evidence:
  - reference: PMID:37788100
    reference_title: "Human skeletal myopathy myosin mutations disrupt myosin head sequestration."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings indicate that the structural remodeling associated with
      LMM mutations induces a pathogenic state in which formation of shutdown
      heads is impaired, thus increasing myosin head ATP demand in the
      filaments, rather than affecting contractility.
    explanation: Patient-fibre result that conflicts with the mouse hypercontractility finding.
  proposed_experiments:
  - experiment_id: srx_stabiliser_versus_aggregate_burden
    experiment_design: TARGETED_PERTURBATION
    name: Relaxed-state stabiliser rescue measured against aggregate burden
    description: >-
      Treat a rod-variant model (R1500P mouse, or patient iPSC-derived
      myotubes) with a small molecule that restores head sequestration, and
      measure function together with thick-filament integrity and myosin
      aggregate burden. Rescue of function without any change in aggregates
      would favour the energetic model; failure to rescue despite a corrected
      DRX fraction would favour the assembly model.
    would_support:
    - mechanistic_hypotheses#rod_srx_energetics
    would_refute:
    - mechanistic_hypotheses#rod_srx_energetics
    supporting_outcome:
    - >-
      Function improves with normalized DRX fraction while aggregate burden
      and filament disorganization are unchanged.
    refuting_outcome:
    - >-
      DRX fraction is corrected but function does not improve, or improvement
      tracks a reduction in aggregates.
  - experiment_id: muscle_energetics_mrs_in_patients
    name: 31P magnetic resonance spectroscopy in genotyped patients
    description: >-
      Measure resting phosphocreatine/ATP and post-exercise phosphocreatine
      recovery in the tibialis anterior of genotyped MYH7 rod-variant carriers
      against controls, to test whether the raised myosin ATP use seen in
      biopsies is detectable in vivo and tracks weakness.
    would_support:
    - mechanistic_hypotheses#rod_srx_energetics
    supporting_outcome:
    - >-
      Carriers show an altered energetic profile in affected muscle that
      scales with weakness.
    refuting_outcome:
    - >-
      No energetic difference from controls in affected muscle.
- discussion_id: myosin_inhibitor_transfer
  prompt: >-
    Would cardiac myosin inhibitors such as mavacamten or aficamten improve
    skeletal muscle function in Laing distal myopathy or myosin storage
    myopathy?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - treatments#Myosin ATPase inhibition (preclinical)
  - mechanistic_hypotheses#myosin_inhibitor_rescue
  rationale: >-
    Only one tool compound (MYK-581) has been tested, in one mouse model; no
    human skeletal-muscle data exist for the approved cardiac inhibitors. The
    two approved drugs are not interchangeable for this purpose: mavacamten
    sequesters heads on the thick filament, whereas aficamten slows ATP
    turnover without doing so. Mavacamten does act on skeletal muscle myosin,
    and skeletal myopathy has been reported as an adverse effect, so any
    transfer needs a safety margin.
  evidence:
  - reference: PMID:40463178
    reference_title: "Myosin modulator Aficamten inhibits force in cardiac muscle by altering myosin's biochemical activity without changing thick filament structure."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In contrast to Mavacamten, Aficamten does not structurally sequester
      myosin heads along the thick filament.
    explanation: >-
      Aficamten does not restore head sequestration, so it may not act on the
      sequestration defect described in this entry the way mavacamten could.
  - reference: PMID:41144950
    reference_title: "Mavacamten facilitates myosin head ON-to-OFF transitions and shortens thin filament length in relaxed mouse skeletal muscle."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      mavacamten treatment reduced the proportion of myosin heads in an active
      state but did not eliminate length-dependent structural changes in
      passive muscle
    explanation: Mavacamten engages skeletal muscle myosin in mouse muscle.
  - reference: PMID:41144950
    reference_title: "Mavacamten facilitates myosin head ON-to-OFF transitions and shortens thin filament length in relaxed mouse skeletal muscle."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      Indeed, emerging clinical reports indicate mavacamten-induced
      generalized skeletal myopathy in elderly patients.
    explanation: >-
      Safety caution, stated as background; the underlying clinical reports
      are few and are not cited here directly.
- discussion_id: shared_rod_mechanism_across_isoforms
  prompt: >-
    Do MYH7 and MYH2 rod variants share a single head-sequestration mechanism,
    and does it hold for myosin storage alleles as well as Laing alleles?
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - pathophysiology#Loss of Myosin Head Sequestration
  - mechanistic_hypotheses#shared_myosin_rod_mechanism
  rationale: >-
    A shared mechanism would justify a cross-isoform mechanism module linking
    this entry with MYH2-Related_Myopathy, but the evidence is one study from
    one group, and its readouts are themselves contested: the mantATP assay
    for the super-relaxed state, and the assumed equivalence of that state
    with the interacting-heads structure, are both disputed. The question
    applies only to dominant rod variants; recessive MYH2 myopathy is a loss
    of type 2A fibres, a different mechanism.
  evidence:
  - reference: PMID:38103642
    reference_title: "The biochemically defined super relaxed state of myosin-A paradox."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      A combination of our experimental observations and theories suggests
      that the displacement of mantATP in purified proteins is not a reliable
      assay to quantify the SRX population.
    explanation: >-
      Questions the assay used to measure the super-relaxed state; tested on
      purified porcine cardiac myosin, so it only partly applies to fibre
      measurements.
  - reference: PMID:40727670
    reference_title: "Various challenges in understanding the thick filaments, within and outside skeletal and cardiac muscles."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      It has frequently been claimed that the IHM and the SRX state are
      closely related. Some authors still consider this relationship valid,
      but this view is now broadly called into question.
    explanation: The structural interpretation of the super-relaxed state is disputed.
  - reference: PMID:32578970
    reference_title: "MYH2 myopathy, a new case expands the clinical and pathological spectrum of the recessive form."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      a recessive early onset myopathy characterized by complete loss of type
      2A fibers
    explanation: Recessive MYH2 disease is fibre loss, outside the scope of the rod-variant question.
references:
- reference: PMID:20301606
  title: Laing Distal Myopathy.
  tags:
  - GeneReviews
notes: >-
  Entry named after ClinGen's lumped entity (MONDO:0008050). Autosomal
  dominant myosin storage myopathy has its own MONDO term (MONDO:0008409) and
  is curated here as a subtype, following ClinGen's lumping. Autosomal
  recessive MYH7 myosin storage myopathy (MONDO:0009708) differs in
  inheritance and is left to its own stub. MYH7 cardiomyopathies without
  skeletal myopathy are separate entries (Hypertrophic_Cardiomyopathy_1,
  Dilated_Cardiomyopathy_1S).

- name: Myosin ATPase inhibition (preclinical)
  description: >-
    Oral MYK-581, a small molecule that lowers the fraction of myosin heads
    in the disordered relaxed state, improved running capacity in R1500P
    transgenic mice and corrected the raised DRX fraction in patient
    myofibrils. Preclinical only; no human trial is reported.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Loss of Myosin Head Sequestration
    description: Restores head sequestration by stabilizing the relaxed state.
    evidence:
    - reference: PMID:38690726
      reference_title: "A Laing distal myopathy-associated proline substitution in the β-myosin rod perturbs myosin cross-bridging activity."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        oral administration of MYK-581, a small molecule that decreases the
        population of heads in the DRX configuration, significantly improved
        the limited running capacity of the R1500P-transgenic mice and
        corrected the increased DRX state of the myofibrils from patients
      explanation: Preclinical rescue in mouse and ex vivo correction in patient myofibrils.
  evidence:
  - reference: PMID:38690726
    reference_title: "A Laing distal myopathy-associated proline substitution in the β-myosin rod perturbs myosin cross-bridging activity."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: Currently, there are no approved treatments for the cause of the disease.
    explanation: No disease-modifying therapy is approved.
  notes: >-
    OLS label searches l~MYK-581 and l~MYK581 in NCIT and CHEBI returned no
    terms, so therapeutic_agent is left unbound.
animal_models:
- name: MYH7 R1500P transgenic mouse
  species: Mouse
  genotype: Transgenic human MYH7 p.Arg1500Pro
  description: The first mouse model of Laing distal myopathy.
  publication: PMID:38690726
  genes:
  - preferred_term: MYH7
    term:
      id: hgnc:7577
      label: MYH7
  modeled_mechanisms:
  - target: Loss of Myosin Head Sequestration
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: >-
      Reproduces the DRX shift that is also measured in patient biopsies.
    limitations: >-
      Whether the model reproduces the selective anterior-compartment
      distribution of human weakness was not shown.
    evidence:
    - reference: PMID:38690726
      reference_title: "A Laing distal myopathy-associated proline substitution in the β-myosin rod perturbs myosin cross-bridging activity."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        a conformational shift of the myosin heads toward the more reactive
        disordered relaxed (DRX) state, causing hypercontractility and greater
        ATP consumption
      explanation: The mouse shows the DRX shift.
  - target: Slow Fibre Fatigue and Weakness
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Muscles show fatigue and weakness with faster cross-bridge detachment.
    evidence:
    - reference: PMID:38690726
      reference_title: "A Laing distal myopathy-associated proline substitution in the β-myosin rod perturbs myosin cross-bridging activity."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Contractility experiments carried out on isolated mutant muscles,
        myofibrils, and myofibers identified muscle fatigue and weakness
        phenotypes
      explanation: Fatigue and weakness phenotypes in the mouse.
- name: Drosophila Mhc K1728del knock-in
  species: Drosophila melanogaster
  genotype: Mhc K1728del (orthologous to human MYH7 p.Lys1729del), genomic engineering
  description: >-
    Heterozygous flies are flightless with reduced movement and lifespan;
    disrupted sarcomeres are suppressed by overexpressing the E3 ligase
    Abba/Thin.
  publication: PMID:29946036
  modeled_mechanisms:
  - target: Defective Thick Filament Assembly
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: CELLULAR
    limitations: >-
      Insect flight muscle has no slow/fast fibre-type distinction comparable
      to human type 1 fibres, and the fly carries the variant in its single
      muscle myosin gene.
    evidence:
    - reference: PMID:29946036
      reference_title: "Drosophila model of myosin myopathy rescued by overexpression of a TRIM-protein family member."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Sarcomeres of MhcK1728del mutant indirect flight muscles and larval
        body wall muscles were disrupted with clearly disorganized muscle
        filaments.
      explanation: Disorganized filaments in the fly model.
- name: Drosophila myosin storage myopathy models
  species: Drosophila melanogaster
  genotype: Mhc L1793P, R1845W or E1883K transgenes (heterozygous and myosin-null backgrounds)
  description: >-
    Reproduce defective filament assembly, shortened thick filaments,
    myofibrillar disarray and hyaline-like inclusions, plus age-dependent
    cardiac dysfunction in heterozygotes.
  publication: PMID:28973424
  modeled_mechanisms:
  - target: Myosin Aggregation in Type 1 Fibres
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    limitations: >-
      Flight-muscle inclusions are a structural analogue of human hyaline
      bodies; fibre-type selectivity cannot be modelled in the fly.
    evidence:
    - reference: PMID:28973424
      reference_title: "Myosin storage myopathy mutations yield defective myosin filament assembly in vitro and disrupted myofibrillar structure and function in vivo."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Our Drosophila models are the first to recapitulate the human MSM
        phenotype with ultrastructural inclusions
      explanation: The fly models reproduce the inclusions.
- name: Campus syndrome pig
  species: Pig
  genotype: MYH7 c.4320_4321insCCCGCC (p.Ala1440_Ala1441insProAla), heterozygous, naturally occurring
  description: >-

mechanistic_hypotheses:
- hypothesis_group_id: rod_assembly_aggregation
  hypothesis_label: >-
    Rod variants cause disease by destabilizing the coiled coil and corrupting
    thick-filament assembly, with myosin aggregation in type 1 fibres
  status: CANONICAL
  description: >-
    The established model: prolines, single-residue deletions and heptad-repeat
    missense changes in the light meromyosin rod lower coiled-coil stability,
    so mutant myosin mispacks or co-assembles poorly with wild-type myosin,
    producing shortened or unstable thick filaments, myofibrillar disarray and,
    in myosin storage myopathy, subsarcolemmal myosin aggregates. Supported
    mainly by in vitro assembly assays, transfected myotubes and Drosophila
    models.
  evidence:
  - reference: PMID:29660325
    reference_title: "A1603P and K1617del, Mutations in β-Cardiac Myosin Heavy Chain that Cause Laing Early-Onset Distal Myopathy, Affect Secondary Structure and Filament Formation In Vitro and In Vivo."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Taken together, it seems likely that the MPD-1 mutations destabilize
      the coiled coil, resulting in aberrant myosin packing in thick filaments
      in muscle sarcomeres, providing a potential mechanism for the disease.
    explanation: States the assembly model for Laing variants.
- hypothesis_group_id: rod_srx_energetics
  hypothesis_label: >-
    Rod variants cause weakness by releasing myosin heads from the
    super-relaxed state, raising ATP use and causing fatigue
  status: EMERGING
  description: >-
    An alternative, not mutually exclusive model: rod (LMM) variants remodel
    the thick-filament backbone so that fewer heads are sequestered in the
    energy-sparing super-relaxed state. Basal ATP consumption rises and, in the
    R1500P mouse, muscle is hypercontractile, fatigable and weak. A study of
    patient myofibres found raised ATP demand without increased contractility,
    so whether hypercontractility is part of the human disease is unresolved.
  evidence:
  - reference: PMID:38690726
    reference_title: "A Laing distal myopathy-associated proline substitution in the β-myosin rod perturbs myosin cross-bridging activity."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      a conformational shift of the myosin heads toward the more reactive
      disordered relaxed (DRX) state, causing hypercontractility and greater
      ATP consumption
    explanation: Mouse evidence for the energetic model.
  - reference: PMID:37788100
    reference_title: "Human skeletal myopathy myosin mutations disrupt myosin head sequestration."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we found that basal myosin ATP consumption was increased and the myosin
      super-relaxed state was decreased in vivo
    explanation: Patient-biopsy evidence for loss of the super-relaxed state.
- hypothesis_group_id: myosin_inhibitor_rescue
  hypothesis_label: >-
    Myosin inhibitors that stabilize the relaxed state can improve skeletal
    muscle function in MYH7 rod myopathy
  status: EMERGING
  description: >-
    If the energetic model holds, small molecules that shift heads back toward
    the relaxed state should help. MYK-581 improved running capacity in R1500P
    mice and normalized the DRX fraction in patient myofibrils. Whether the
    approved cardiac myosin inhibitors mavacamten and aficamten act on slow
    skeletal muscle at tolerable doses, and whether they help myosin storage
    alleles, is untested.
  evidence:
  - reference: PMID:38690726
    reference_title: "A Laing distal myopathy-associated proline substitution in the β-myosin rod perturbs myosin cross-bridging activity."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      oral administration of MYK-581, a small molecule that decreases the
      population of heads in the DRX configuration, significantly improved
      the limited running capacity of the R1500P-transgenic mice and
      corrected the increased DRX state of the myofibrils from patients
    explanation: Preclinical rescue motivating the hypothesis.
- hypothesis_group_id: shared_myosin_rod_mechanism
  hypothesis_label: >-
    MYH7 and MYH2 light meromyosin variants share a common
    head-sequestration defect
  status: EMERGING
  description: >-
    The same loss of the super-relaxed state and raised ATP demand was found
    for common LMM variants in both MYH7 (type 1 fibres) and MYH2 (type 2A
    fibres). If general, the rod myosinopathies would share one mechanism
    across fibre types, which would argue for a shared mechanism module and
    for testing the same modulators in MYH2 myopathy.
  evidence:
  - reference: PMID:37788100
    reference_title: "Human skeletal myopathy myosin mutations disrupt myosin head sequestration."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Analyses of expressed and purified MYH7 and MYH2 LMM mutant proteins
      combined with in silico modeling showed that myosin coiled coil
      structure and packing of filaments in vitro are commonly disrupted.
    explanation: >-
      Purified MYH7 and MYH2 LMM mutant proteins showed the same disruption
      of coiled-coil structure and filament packing, the structural half of
      the shared defect.
  - reference: PMID:37788100
    reference_title: "Human skeletal myopathy myosin mutations disrupt myosin head sequestration."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we found that basal myosin ATP consumption was increased and the myosin
      super-relaxed state was decreased in vivo
    explanation: >-
      In patient biopsies carrying the MYH7 and MYH2 LMM variants, basal ATP
      consumption rose and the super-relaxed state fell, the functional half
      of the shared head-sequestration defect.
pathophysiology:
- name: MYH7 Rod Domain Variant
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    The initiating lesion is a heterozygous MYH7 variant, usually in the
    light meromyosin (LMM) region of the coiled-coil rod toward the 3' end of
    the gene (exons 30-40). Laing alleles are characteristically proline
    substitutions (Arg1500Pro, Arg1560Pro) or single-residue in-frame
    deletions (Lys1617del, Glu1508del, Lys1729del); myosin storage alleles are
    distal-rod missense changes (Arg1845Trp, His1904Leu, Leu1793Pro). The
    mutant heavy chain is expressed and incorporated, so ClinGen classifies the
    mechanism as dominant negative.

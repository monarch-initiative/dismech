  variants:
  - name: p.Lys1617del
    description: The most common Laing variant; iPSC lines exist from three unrelated carriers.
    variant_type: deletion
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:39047410
      reference_title: "Generation of iPSC lines from three Laing distal myopathy patients with a recurrent MYH7 p.Lys1617del variant."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: >-
        we generated iPSC lines from lymphoblastoid cells of three unrelated
        individuals heterozygous for the most common MPD1-causing variant;
        p.Lys1617del
      explanation: Identifies Lys1617del as the most common Laing variant.
  - name: p.Lys1729del
    description: >-
      Recurrent Laing variant with a large cluster in the Safor region of
      Spain, showing wide intrafamilial variability from asymptomatic to
      wheelchair-dependent.
    variant_type: deletion
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:20733148
      reference_title: "MYH7 gene tail mutation causing myopathic profiles beyond Laing distal myopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: All patients carried the p.K1729del mutation in MYH7.
      explanation: The shared variant in 32 examined patients from 4 kindreds.
  - name: p.Glu1508del
    description: >-
      Arose independently in French and Norwegian families and de novo in a
      Finnish patient, suggesting a mutation-prone residue; associated with
      dilated cardiomyopathy in two further families.
    variant_type: deletion
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:21279644
      reference_title: "A novel MYH7 mutation occurring independently in French and Norwegian Laing distal myopathy families and de novo in one Finnish patient."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Interestingly, we identified the identical mutation in an unrelated
        Norwegian family and, as a de novo mutation, in one sporadic Finnish
        patient.
      explanation: Recurrent independent occurrence of Glu1508del.
  - name: p.Arg1500Pro
    description: One of the original Laing variants; modelled in transgenic mouse and C. elegans.
    variant_type: single nucleotide variant
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:15322983
      reference_title: "Mutations in the slow skeletal muscle fiber myosin heavy chain gene (MYH7) cause laing early-onset distal myopathy (MPD1)."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We have identified five novel heterozygous mutations--Arg1500Pro,
        Lys1617del, Ala1663Pro, Leu1706Pro, and Lys1729del in exons 32, 34, 35,
        and 36 of MYH7--in six families with early-onset distal myopathy.
      explanation: The founding set of Laing variants, including Arg1500Pro.
  - name: p.Arg1560Pro
    description: Andalusian founder variant.
    variant_type: single nucleotide variant
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:30166250
      reference_title: "A novel MYH7 founder mutation causing Laing distal myopathy in Southern Spain."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Our findings support the novel variant p.R1560P in MYH7 as a founder
        mutation in Andalucía.
      explanation: Haplotype evidence for a regional founder variant.
  - name: p.Arg1845Trp
    description: >-
      The original myosin storage myopathy variant, also found in
      scapuloperoneal myopathy. Homozygous rod missense variants (Arg1820Trp,
      Arg1712Trp) cause the separate recessive form.
    variant_type: single nucleotide variant
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:14520662
      reference_title: "Myosin storage myopathy associated with a heterozygous missense mutation in MYH7."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We identified a missense mutation, Arg1845Trp, in the rod region of
        slow/beta-cardiac MyHC in patients with a skeletal myopathy from two
        different families.
      explanation: Founding myosin storage myopathy variant.
    - reference: PMID:17118657
      reference_title: "Myosin storage (hyaline body) myopathy: a case report."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        confirms that Arg1845Trp is a common mutation associated with this
        phenotype, at least in the White European population
      explanation: Arg1845Trp is recurrent in myosin storage myopathy.
  - name: p.Glu500del
    description: >-
      A rare head-domain (relay loop) in-frame deletion causing congenital
      axial stiffness without cardiomyopathy, de novo in one family and from
      a mosaic father in another; an exception to the rod rule.
    variant_type: deletion
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:35854315
      reference_title: "A recurrent single-amino acid deletion (p.Glu500del) in the head domain of ß-cardiac myosin in two unrelated boys presenting with polyhydramnios, congenital axial stiffness and skeletal myopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Both patients display an unusual skeletal myopathy phenotype with
        congenital axial stiffness and muscular hypertonus, but no cardiac
        involvement.
      explanation: Head-domain variant causing an atypical axial skeletal myopathy.
    - reference: PMID:35854315
      reference_title: "A recurrent single-amino acid deletion (p.Glu500del) in the head domain of ß-cardiac myosin in two unrelated boys presenting with polyhydramnios, congenital axial stiffness and skeletal myopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The mutation occurred de novo in one patient, whereas mosaicism was
        detected in blood of the father of the second patient.
      explanation: De novo occurrence and parental mosaicism, relevant to recurrence risk.
  - name: p.His1904Leu
    description: Hyaline body myopathy variant in a Saudi kindred.
    variant_type: single nucleotide variant
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:15136674

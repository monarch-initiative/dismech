- name: Defective Thick Filament Assembly
  biological_scale: CELLULAR
  description: >-
    Mutant rods polymerize poorly, form shorter or less stable filaments, and
    mispack within the sarcomere; L1706P accumulates in the bare zone and
    eGFP-tagged mutant myosin collects at the M-line. Mutant molecules still
    enter sarcomeres and co-assemble with wild-type myosin, which is how a
    single allele exerts a dominant effect.
  cell_types:
  - preferred_term: Type 1 (slow) skeletal muscle fibre
    term:
      id: CL:0002211
      label: type I muscle cell
  biological_processes:
  - preferred_term: Thick filament (myosin II filament) organization
    term:
      id: GO:0031038
      label: myosin II filament organization
    modifier: ABNORMAL

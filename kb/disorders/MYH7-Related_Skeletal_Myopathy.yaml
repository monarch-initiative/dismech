name: MYH7-Related Skeletal Myopathy
creation_date: "2026-10-15T00:00:00Z"
synonyms:
- Laing distal myopathy
- Laing early-onset distal myopathy
- distal myopathy type 1
- MPD1
- myopathy, distal, 1
- myopathy, distal, early-onset, autosomal dominant
- MYH7-related myopathy
description: >-
  Autosomal dominant skeletal myopathy caused by heterozygous variants in MYH7,
  which encodes the slow/beta-cardiac myosin heavy chain (MyHC-I) of type 1
  (slow, oxidative) skeletal muscle fibres and the cardiac ventricles. The
  classic presentation is Laing distal myopathy: weakness beginning in early
  childhood in the ankle and great-toe dorsiflexors (a "hanging great toe"),
  followed by the finger extensors and neck flexors, with slow progression and
  normal life expectancy. ClinGen's Congenital Myopathies Gene Curation Expert
  Panel lumps Laing distal myopathy, autosomal dominant myosin storage (hyaline
  body) myopathy, MYH7 scapuloperoneal myopathy and the axial forms into this
  single entity, because they share inheritance, mechanism and overlapping
  phenotypes. Most causal variants lie in the light meromyosin part of the
  coiled-coil rod, typically proline substitutions or single-residue in-frame
  deletions, in contrast to the head-domain missense variants behind MYH7
  hypertrophic cardiomyopathy. The mutant rod destabilizes the coiled coil and
  thick-filament packing; in myosin storage myopathy this produces
  subsarcolemmal myosin aggregates in type 1 fibres. Recent work also shows
  that rod variants release myosin heads from the energy-sparing super-relaxed
  state, raising ATP consumption. Cardiomyopathy (dilated, hypertrophic or left
  ventricular noncompaction) occurs in a minority of patients.
category: Mendelian

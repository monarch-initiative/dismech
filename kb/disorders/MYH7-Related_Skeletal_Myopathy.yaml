progression:
- phase: Onset
  notes: >-
    Onset ranges from birth to adulthood, usually before age five in the
    Laing presentation, with distal lower-limb weakness first.
  evidence:
  - reference: PMID:16103042
    reference_title: "Laing early onset distal myopathy: slow myosin defect with variable abnormalities on muscle biopsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Age of onset was the only variable, being from birth up to the 20 s, but
      progression was always very slow.
    explanation: Variable onset with uniformly slow progression.
- phase: Long-term course
  notes: >-
    Very slow progression with normal life expectancy; disability ranges from
    asymptomatic to wheelchair use.
  evidence:
  - reference: PMID:20301606
    reference_title: "Laing Distal Myopathy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      After distal weakness has been present for more than ten years, mild
      proximal weakness may be observed. Life expectancy is normal.
    explanation: GeneReviews on long-term course and prognosis.
  - reference: PMID:20733148
    reference_title: "MYH7 gene tail mutation causing myopathic profiles beyond Laing distal myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Life expectancy was not reduced but the spectrum of disability ranged
      from asymptomatic to wheelchair confined.
    explanation: Range of disability within one variant cluster.
diagnosis:
- name: MYH7 molecular genetic testing
  description: >-
    Diagnosis is established by a heterozygous pathogenic MYH7 variant in a
    proband with suggestive findings. Muscle biopsy findings are variable and
    seldom diagnostic; muscle MRI showing early tibialis anterior and
    extensor hallucis longus involvement supports the diagnosis.
  evidence:
  - reference: PMID:20301606
    reference_title: "Laing Distal Myopathy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The diagnosis of Laing distal myopathy is established in a proband with
      suggestive findings and a heterozygous pathogenic variant in MYH7
      identified by molecular genetic testing.
    explanation: GeneReviews diagnostic criterion.

- name: Type 1 Fibre Myopathic Remodelling
  biological_scale: TISSUE
  description: >-
    Muscle biopsies are variable and seldom diagnostic: type 1 fibre atrophy
    or fibre-type disproportion, cores and minicores (the commonest lesion in
    the French cohort), co-expression of slow and fast myosin in type 1
    fibres, mitochondrial abnormalities, and neurogenic-appearing changes.
    Rimmed vacuoles, typical of other distal myopathies, are uncommon.
  cell_types:
  - preferred_term: Type 1 (slow) skeletal muscle fibre

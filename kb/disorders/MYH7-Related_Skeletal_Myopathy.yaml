    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings demonstrate that heterozygous mutations toward the 3' end
      of MYH7 cause Laing-type early-onset distal myopathy.
    explanation: The gene-identification study placing Laing variants in the 3' (rod) end of MYH7.
  - reference: PMID:38690726

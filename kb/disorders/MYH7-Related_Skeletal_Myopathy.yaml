- name: Myosin Aggregation in Type 1 Fibres
  biological_scale: CELLULAR
  conforms_to: "loss_of_proteostasis#Misfolded-Protein Aggregation"
  description: >-
    Mutant myosin accumulates beneath the sarcolemma and between myofibrils as
    hyaline bodies that stain for slow myosin. Aggregates can sequester
    wild-type myosin. Hyaline bodies define myosin storage myopathy, but they
    are absent in about half of biopsies even with a myosin storage allele, and
    occur only occasionally in Laing distal myopathy.
  cell_types:
  - preferred_term: Type 1 (slow) skeletal muscle fibre
    term:
      id: CL:0002211
      label: type I muscle cell
  evidence:
  - reference: PMID:22918376
    reference_title: "Myosinopathies: pathology and mechanisms."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In myosin storage myopathy protein aggregates are formed by accumulation
      of myosin beneath the sarcolemma and between myofibrils.
    explanation: Review describing the subsarcolemmal myosin aggregates of myosin storage myopathy.
  - reference: PMID:22155079
    reference_title: "Effects of pathogenic proline mutations on myosin assembly."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Both mutations also form aggregates consisting of cytoplasmic vacuoles
      surrounding paracrystalline arrays and amorphous rod-like inclusions
      that sequester WT myosin.
    explanation: Laing proline variants aggregate and sequester wild-type myosin in cells.
  - reference: PMID:17336526
    reference_title: "MYH7 gene mutation in myosin storage myopathy and scapulo-peroneal myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Muscle biopsy revealed hyaline bodies in only half of biopsied patients
      (2/4).
    explanation: Hyaline bodies are not obligatory even with a myosin storage variant.
- name: Loss of Myosin Head Sequestration
  biological_scale: MOLECULAR
  description: >-
    Rod (LMM) variants remodel the thick-filament backbone so that fewer
    myosin heads are held in the folded, energy-sparing super-relaxed state;
    more heads sit in the disordered relaxed state available to actin. This
    resembles a subset of head-domain hypertrophic cardiomyopathy variants,
    although the lesion is in the rod.
  genes:
  - preferred_term: MYH7
    term:
      id: hgnc:7577
      label: MYH7
  evidence:
  - reference: PMID:37788100
    reference_title: "Human skeletal myopathy myosin mutations disrupt myosin head sequestration."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we found that basal myosin ATP consumption was increased and the myosin
      super-relaxed state was decreased in vivo
    explanation: Measured in patient muscle biopsies carrying MYH7 and MYH2 LMM variants.
  - reference: PMID:38690726
    reference_title: "A Laing distal myopathy-associated proline substitution in the β-myosin rod perturbs myosin cross-bridging activity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      molecular analysis of muscle biopsies from patients with MPD1 revealed a
      significant increase in sarcomeric DRX content
    explanation: Laing patient biopsies show a shift of heads to the disordered relaxed state.
  downstream:
  - target: Increased Basal Myosin ATP Turnover
    causal_link_type: DIRECT
    hypothesis_groups:
    - rod_srx_energetics
    evidence:
    - reference: PMID:38690726
      reference_title: "A Laing distal myopathy-associated proline substitution in the β-myosin rod perturbs myosin cross-bridging activity."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        a conformational shift of the myosin heads toward the more reactive
        disordered relaxed (DRX) state, causing hypercontractility and greater
        ATP consumption
      explanation: In the R1500P mouse the DRX shift causes higher ATP use.

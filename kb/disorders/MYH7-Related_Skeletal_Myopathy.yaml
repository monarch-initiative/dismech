has_subtypes:
- name: Laing distal myopathy
  description: >-
    The classic and most common presentation: early-onset weakness of the
    ankle and great-toe dorsiflexors, then the finger extensors and neck
    flexors, with very slow progression. In a French cohort of 57 patients the
    distal phenotype accounted for 70%.
  evidence:
  - reference: PMID:39448255
    reference_title: "MYH7-related myopathies: clinical, myopathological and genotypic spectrum in a multicentre French cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified three phenotypes with varying degrees of overlap: distal
      myopathy (70%), scapuloperoneal (23%) and axial with peculiar cervical
      spine rigidity called the 'sphinx' phenotype (7%).
    explanation: >-
      Distal myopathy is the commonest of the three MYH7-related myopathy
      phenotypes in this cohort.
  - reference: PMID:16103042
    reference_title: "Laing early onset distal myopathy: slow myosin defect with variable abnormalities on muscle biopsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The phenotype of MPD1 was consistent, with initial weakness of great
      toe/ankle dorsiflexion, and later development of weakness of finger
      extension and neck flexion.
    explanation: Defines the clinical pattern of the Laing presentation.
- name: Myosin storage myopathy
  display_name: Myosin storage (hyaline body) myopathy, autosomal dominant
  subtype_term:
    preferred_term: congenital myopathy 7A, myosin storage, autosomal dominant
    term:
      id: MONDO:0008409
      label: congenital myopathy 7A, myosin storage, autosomal dominant
  description: >-
    Childhood-onset, slowly progressive myopathy defined histologically by
    large subsarcolemmal inclusions of slow/beta-cardiac myosin (hyaline
    bodies) in type 1 fibres, caused by distal-rod missense variants such as
    Arg1845Trp, His1904Leu and Leu1793Pro. MONDO keeps it as a separate term;
    ClinGen lumps it into MYH7-related skeletal myopathy. The recessive form
    (MONDO:0009708) is not covered here.
  evidence:
  - reference: PMID:14520662
    reference_title: "Myosin storage myopathy associated with a heterozygous missense mutation in MYH7."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Slow, oxidative, type 1 muscle fibers showed large inclusions consisting
      of slow/beta-cardiac MyHC. The features were similar to a previously
      described entity: hyaline body myopathy.
    explanation: The founding report defining myosin storage myopathy as an MYH7 rod disorder.
  - reference: CGGV:assertion_8974721a-f333-4fb7-b8b7-043233d3d100-2021-05-13T160000.000Z
    reference_title: "MYH7 / MYH7-related skeletal myopathy (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Therefore, all of the disease entities have been lumped into one disease
      entity, MYH7-related skeletal myopathy.
    explanation: >-
      ClinGen's lumping decision is the basis for curating myosin storage
      myopathy as a subtype of this entry rather than a separate one.
- name: Scapuloperoneal myopathy
  description: >-
    Shoulder-girdle and peroneal weakness, reported with the Arg1845Trp
    myosin storage variant and accounting for 23% of a French MYH7 myopathy
    cohort.
  evidence:
  - reference: PMID:17336526
    reference_title: "MYH7 gene mutation in myosin storage myopathy and scapulo-peroneal myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MYH7 gene studies revealed the 5533C>T mutation (Arg1845Trp) in both
      myosin storage myopathy and in 2 of the 17 scapulo-peroneal patients
      studied.
    explanation: One MYH7 rod variant causes both the myosin storage and scapuloperoneal presentations.
  - reference: PMID:39448255
    reference_title: "MYH7-related myopathies: clinical, myopathological and genotypic spectrum in a multicentre French cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified three phenotypes with varying degrees of overlap: distal
      myopathy (70%), scapuloperoneal (23%) and axial with peculiar cervical
      spine rigidity called the 'sphinx' phenotype (7%).
    explanation: Source of the 23% scapuloperoneal share.
- name: Axial myopathy
  display_name: Axial myopathy with cervical rigidity or dropped head
  description: >-
    Childhood-onset axial weakness, with either cervical spine rigidity (the
    "sphinx" phenotype) or a dropped head, often with respiratory involvement
    and variable cardiomyopathy.
  evidence:
  - reference: PMID:39448255
    reference_title: "MYH7-related myopathies: clinical, myopathological and genotypic spectrum in a multicentre French cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      axial with peculiar cervical spine rigidity called the 'sphinx'
      phenotype (7%)
    explanation: Defines the axial 'sphinx' phenotype and its share of the cohort.
  - reference: PMID:30794915
    reference_title: "Common pathogenic mechanism in patients with dropped head syndrome caused by different mutations in the MYH7 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Early-onset axial myopathy with a dropped head syndrome is a distinct
      clinical entity within MYH7-related disorders.
    explanation: Supports a distinct early-onset axial presentation.

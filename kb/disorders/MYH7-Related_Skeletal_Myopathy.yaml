- name: Selective Pattern of Muscle Involvement
  biological_scale: TISSUE
  description: >-
    A single, selective and non-length-dependent pattern of muscle
    involvement. Clinically and on MRI the tibialis anterior and extensor
    hallucis longus are affected first and constantly, with variable later
    spread to the thigh (sartorius, quadriceps), hip, paravertebral, calf and
    scapulohumeral muscles, and with intramuscular fat replacement. Why these
    muscles are selectively vulnerable when MyHC-I is expressed in every slow
    fibre is not explained.

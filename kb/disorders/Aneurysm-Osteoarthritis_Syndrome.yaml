definitions:
- name: Molecular and clinical diagnosis
  definition_type: DIAGNOSTIC_CRITERIA
  description: >-
    The diagnosis is established clinically and/or by identification of a
    heterozygous pathogenic variant in a Loeys-Dietz gene; SMAD3 is the causal
    gene for aneurysm-osteoarthritis syndrome (LDS type 3).
  evidence:
  - reference: PMID:20301312
    reference_title: "Loeys-Dietz Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of LDS is established in (1) a proband with characteristic
      clinical findings or (2) by the identification of a heterozygous
      pathogenic variant in SMAD2, SMAD3, TGFB2, TGFB3, TGFBR1, or TGFBR2
    explanation: >-
      GeneReviews specifies the molecular and clinical basis for establishing the
      diagnosis, including SMAD3 among the causal genes.
differential_diagnoses:
- name: Marfan syndrome
  description: >-
    Marfan syndrome overlaps in aortic-root aneurysm, skeletal findings, and
    autosomal dominant inheritance.
  distinguishing_features:
  - FBN1-associated ectopia lentis favors Marfan syndrome.
  - >-
    The absence of characteristic early-onset osteoarthritis and
    osteochondritis dissecans favors Marfan syndrome.
  - >-
    AOS/LDS can dissect at smaller diameters and has more diffuse arterial
    involvement; SMAD3 molecular testing distinguishes AOS.
  disease_term:
    preferred_term: Marfan syndrome
    term:
      id: MONDO:0007947
      label: Marfan syndrome
  evidence:
  - reference: PMID:20301312
    reference_title: "Loeys-Dietz Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      aortic dissection can occur at smaller aortic diameters and at younger
      ages than observed in Marfan syndrome; vascular disease is not limited to
      the aortic root
    explanation: >-
      Directly states two vascular features distinguishing LDS from Marfan
      syndrome.
- name: Vascular Ehlers-Danlos syndrome
  description: >-
    Vascular Ehlers-Danlos syndrome can also present with arterial aneurysm,
    dissection or rupture and translucent skin.
  distinguishing_features:
  - COL3A1 molecular findings favor vascular EDS.
  - Characteristic tissue fragility and hollow-organ rupture favor vascular EDS.
  - >-
    SMAD3-related early osteoarthritis and osteochondritis dissecans favor AOS.
  disease_term:
    preferred_term: vascular Ehlers-Danlos syndrome
    term:
      id: MONDO:0017314
      label: Ehlers-Danlos syndrome, vascular type
- name: Other molecular subtypes of Loeys-Dietz syndrome
  description: >-
    TGFBR1-, TGFBR2-, TGFB2-, TGFB3-, SMAD2-, and IPO8-related LDS share the
    diffuse aortopathy and overlapping craniofacial, skeletal, and cutaneous
    findings.
  distinguishing_features:
  - Identification of a pathogenic variant in SMAD3 establishes LDS3/AOS.
  - Prominent premature osteoarthritis is particularly characteristic of LDS3.
  disease_term:
    preferred_term: Loeys-Dietz syndrome
    term:
      id: MONDO:0018954
      label: Loeys-Dietz syndrome
  evidence:
  - reference: PMID:20301312

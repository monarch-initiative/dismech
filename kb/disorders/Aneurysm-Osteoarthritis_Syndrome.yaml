inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Aneurysm-osteoarthritis syndrome is inherited in an autosomal dominant
    manner; as with other Loeys-Dietz subtypes, a substantial fraction of
    probands carry a de novo SMAD3 variant, while the remainder inherit the
    variant from an affected parent.
  evidence:
  - reference: PMID:20301312
    reference_title: "Loeys-Dietz Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Approximately 75% of probands diagnosed with LDS have the disorder as the
      result of a de novo pathogenic variant; approximately 25% of individuals
      diagnosed with LDS have an affected parent.
    explanation: >-
      GeneReviews documents autosomal dominant inheritance of Loeys-Dietz
      syndrome (which includes SMAD3-related LDS3/aneurysm-osteoarthritis
      syndrome), with a high proportion of de novo variants.
pathophysiology:
- name: SMAD3 Loss-of-Function
  biological_scale: MOLECULAR
  description: >-
    Heterozygous pathogenic variants in SMAD3 disrupt the receptor-regulated
    SMAD that transduces TGF-beta signals from activated TGF-beta receptors to
    the nucleus. SMAD3 forms a complex with the co-SMAD SMAD4 and regulates
    transcription of TGF-beta target genes. Loss of normal SMAD3 function is the
    conserved genetic trigger for the syndrome.
  biological_processes:
  - preferred_term: SMAD protein signal transduction
    term:
      id: GO:0060395
      label: SMAD protein signal transduction
    modifier: ABNORMAL
  evidence:
  - reference: PMID:21217753
    reference_title: "Mutations in SMAD3 cause a syndromic form of aortic aneurysms and dissections with early-onset osteoarthritis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the disease is caused by mutations in SMAD3. This gene encodes a member
      of the TGF-β pathway that is essential for TGF-β signal transmission
    explanation: >-
      van de Laar et al. identified SMAD3 as the causal gene, encoding an
      essential mediator of TGF-beta signal transmission.
  downstream:
  - target: TGF-beta Signaling Dysregulation
    description: >-
      SMAD3 dysfunction paradoxically increases aortic TGF-beta pathway
      activity.
  - target: Cartilage TGF-beta Dysregulation and Early-Onset Osteoarthritis
    description: >-
      The same SMAD3 loss also disrupts TGF-beta-dependent cartilage
      homeostasis, driving the early-onset osteoarthritis arm.
- name: TGF-beta Signaling Dysregulation
  conforms_to: "aortopathy_tgfbeta_dysregulation#TGF-beta Signaling Dysregulation"
  biological_scale: CELLULAR
  description: >-
    Despite SMAD3 being a positive transducer of TGF-beta signaling, SMAD3
    mutations lead to paradoxically increased expression of key TGF-beta pathway
    components in the aortic wall, the same dysregulated-TGF-beta signature seen
    across the heritable thoracic aortic disease syndromes.
  cell_types:
  - preferred_term: vascular smooth muscle cell
    term:
      id: CL:0000359
      label: vascular associated smooth muscle cell
  biological_processes:
  - preferred_term: transforming growth factor beta receptor signaling pathway
    term:
      id: GO:0007179
      label: transforming growth factor beta receptor signaling pathway
    modifier: INCREASED
  evidence:
  - reference: PMID:21217753
    reference_title: "Mutations in SMAD3 cause a syndromic form of aortic aneurysms and dissections with early-onset osteoarthritis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SMAD3 mutations lead to increased aortic expression of several key players
      in the TGF-β pathway, including SMAD3
    explanation: >-
      Demonstrates paradoxically increased aortic TGF-beta pathway signaling,
      the conserved aortopathy mechanism.
  - reference: PMID:27688095
    reference_title: "Defective Connective Tissue Remodeling in Smad3 Mice Leads to Accelerated Aneurysmal Growth Through Disturbed Downstream TGF-β Signaling."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Although Smad3-/- aortas showed increased nuclear pSmad2 and pErk,
      indicating TGF-β receptor activation, downstream TGF-β-activated target
      genes were not upregulated.
    explanation: >-
      Refines the TGF-beta paradox: in the Smad3-null model, receptor-proximal
      signaling (pSmad2, pErk) is increased while downstream SMAD3-dependent
      target-gene transcription fails.
  downstream:
  - target: Aortic Medial Degeneration and Wall Weakening
    description: >-
      Dysregulated TGF-beta signaling drives maladaptive medial remodeling.
- name: Aortic Medial Degeneration and Wall Weakening
  conforms_to: "aortopathy_tgfbeta_dysregulation#Aortic Medial Degeneration and Wall Weakening"
  biological_scale: TISSUE
  description: >-
    Dysregulated TGF-beta signaling together with the underlying connective
    tissue defect produces medial degeneration of the aortic wall. In the
    Smad3-null model the dominant findings are medial elastin (elastic fiber)
    disruption and adventitial inflammation with matrix metalloproteinase
    activation concentrated in inflammatory areas, progressively weakening the
    wall; this inflammatory, MMP-driven route is a notable AOS-specific feature.
  cell_types:
  - preferred_term: vascular smooth muscle cell
    term:
      id: CL:0000359
      label: vascular associated smooth muscle cell
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: extracellular matrix organization
    term:
      id: GO:0030198
      label: extracellular matrix organization
    modifier: ABNORMAL
  evidence:
  - reference: PMID:21217753
    reference_title: "Mutations in SMAD3 cause a syndromic form of aortic aneurysms and dissections with early-onset osteoarthritis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We delineated a new syndrome presenting with aneurysms, dissections and
      tortuosity throughout the arterial tree
    explanation: >-
      Establishes the systemic arterial-wall pathology (aneurysm, dissection,
      tortuosity) that reflects medial wall weakening.
  - reference: PMID:27688095
    reference_title: "Defective Connective Tissue Remodeling in Smad3 Mice Leads to Accelerated Aneurysmal Growth Through Disturbed Downstream TGF-β Signaling."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Aortic wall immunohistochemistry showed no increase in extracellular
      matrix and collagen accumulation, nor loss of vascular smooth muscle cells
      (VSMCs) but instead revealed medial elastin disruption and adventitial
      inflammation.
    explanation: >-
      Identifies medial elastin disruption and adventitial inflammation (rather
      than SMC loss or ECM accumulation) as the medial-degeneration mechanism in
      the Smad3-null aorta.
  - reference: PMID:23782924
    reference_title: "SMAD3 deficiency promotes inflammatory aortic aneurysms in angiotensin II-infused mice via activation of iNOS."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      the underlying mechanism involved aberrant upregulation of inducible
      nitric oxide synthase (iNOS)-derived nitric oxide production and activation
      of elastolytic matrix metalloproteinases 2 and 9
    explanation: >-
      Shows macrophage iNOS-derived nitric oxide and elastolytic MMP2/9
      activation as the mechanism of wall weakening in SMAD3-deficient aortas.
  downstream:
  - target: Progressive Arterial Aneurysm and Tortuosity
    description: Wall weakening permits progressive dilation and tortuosity.
- name: Progressive Arterial Aneurysm and Tortuosity

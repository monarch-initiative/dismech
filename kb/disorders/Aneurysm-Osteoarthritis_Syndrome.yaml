      snippet: >-
        Aortic pulse wave velocity was high-normal (9.2 ± 2.2 m/s), indicating
        increased aortic stiffness, which strongly correlated with NT-proBNP
        (r = 0.731, p = 0.005).
      explanation: >-
        Quantifies the correlation between NT-proBNP and aortic stiffness in the
        AOS cohort.

    snippet: >-
      N-terminal brain natriuretic peptide (NT-proBNP) was significantly higher
      in AOS patients compared with matched controls (p < 0.001).
    explanation: >-
      Establishes NT-proBNP elevation in AOS relative to matched controls.

genetic:
- name: SMAD3
  gene_term:
    preferred_term: SMAD3
    term:
      id: hgnc:6769
      label: SMAD3
  association: Causative
  relationship_type: CAUSATIVE
  notes: >-
    Heterozygous pathogenic variants in SMAD3, encoding the receptor-regulated
    SMAD3 of the TGF-beta pathway, cause aneurysm-osteoarthritis syndrome
    (Loeys-Dietz syndrome type 3). Inheritance is autosomal dominant. The
    variant spectrum includes haploinsufficiency alleles and missense
    substitutions in the MH2 domain (as well as MH1-domain variants and in-frame
    deletions); MH2 missense variants are associated with earlier aortic events.
    Penetrance for aortic disease is reduced and age of onset is variable.
  evidence:
  - reference: PMID:21217753
    reference_title: "Mutations in SMAD3 cause a syndromic form of aortic aneurysms and dissections with early-onset osteoarthritis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We mapped the genetic locus to chromosome 15q22.2-24.2 and show that the
      disease is caused by mutations in SMAD3
    explanation: >-
      Identifies SMAD3 (15q22) as the causal gene for the syndrome.
  - reference: PMID:30661052
    reference_title: "SMAD3 pathogenic variants: risk for thoracic aortic disease and associated complications from the Montalcino Aortic Consortium."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SMAD3 pathogenic variants cause thoracic aortic aneurysms and dissections
      in the majority of individuals with variable age of onset and reduced
      penetrance.
    explanation: >-
      Documents autosomal dominant SMAD3-driven aortic disease with variable
      onset and reduced penetrance.
  - reference: PMID:30661052
    reference_title: "SMAD3 pathogenic variants: risk for thoracic aortic disease and associated complications from the Montalcino Aortic Consortium."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The median age at first aortic event was significantly lower in
      individuals with SMAD3 MH2 missense variants than those with HI variants
    explanation: >-
      Genotype-phenotype correlation: MH2-domain missense variants are
      associated with earlier aortic events than haploinsufficiency variants.
  - reference: DOI:10.1093/hmg/ddae044
    reference_title: Functional analysis of cell lines derived from SMAD3-related Loeys-Dietz syndrome patients provides insights into genotype-phenotype relation
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Individuals with dominant negative (DN) SMAD3 variant in the MH2 domain
      exhibited more major events (66.7% vs. 44.0%, P = 0.054), occurring at a
      younger age compared to those with haploinsufficient (HI) variants.
    explanation: >-
      The expanded cohort and patient-cell study supports a possible
      dominant-negative-versus-haploinsufficient distinction. The reported
      P=0.054 is borderline, so this is a risk-stratification signal rather than
      a definitive genotype-prognosis rule.
progression:
- phase: Childhood and adolescence
  age_range: Childhood to early adulthood
  notes: >-
    Early-onset joint disease (osteoarthritis and osteochondritis dissecans) is
    frequently the first manifestation, often prompting the initial medical
    evaluation. Aortic events in childhood have not been observed in SMAD3
    cohorts.
  evidence:
  - reference: PMID:22167769
    reference_title: "Phenotypic spectrum of the SMAD3-related aneurysms-osteoarthritis syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the majority of patients, early-onset joint abnormalities, including
      osteoarthritis and osteochondritis dissecans, were the initial symptom
      for which medical advice was sought.
    explanation: >-
      Establishes joint disease as the typical presenting feature earlier in the
      disease course.
  - reference: PMID:30661052
    reference_title: "SMAD3 pathogenic variants: risk for thoracic aortic disease and associated complications from the Montalcino Aortic Consortium."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No aortic events in childhood were observed.
    explanation: >-
      Supports the absence of aortic events during childhood, informing
      gene-specific surveillance.
- phase: Adulthood
  age_range: Adulthood
  notes: >-
    Aortic aneurysms and dissections accrue with age; the cumulative risk of an
    aortic event reaches 50% by age 54, and aortic dissection is a major cause
    of sudden death.
  evidence:
  - reference: PMID:30661052
    reference_title: "SMAD3 pathogenic variants: risk for thoracic aortic disease and associated complications from the Montalcino Aortic Consortium."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The cumulative risk of an aortic event was 50% at 54 years of age.
    explanation: >-
      Quantifies age-dependent cumulative aortic-event risk in the adult course.
  - reference: PMID:22167769
    reference_title: "Phenotypic spectrum of the SMAD3-related aneurysms-osteoarthritis syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of the patients who first presented with joint abnormalities, 20% died
      suddenly from aortic dissection.
    explanation: >-
      Documents sudden death from aortic dissection as a major adult outcome.
treatments:
- name: Angiotensin Receptor Blocker Therapy
  description: >-
    Angiotensin receptor blockers (e.g., losartan) are used to reduce
    hemodynamic stress and are hypothesized to attenuate dysregulated TGF-beta
    signaling in the aortic wall.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: losartan
      term:
        id: CHEBI:6541
        label: losartan
  target_mechanisms:
  - target: TGF-beta Signaling Dysregulation
    treatment_effect: INHIBITS
    description: >-
      Angiotensin receptor blockade (losartan) is proposed to attenuate the
      dysregulated aortic TGF-beta signaling that drives medial degeneration,
      in addition to lowering hemodynamic wall stress. IMPORTANT: this edge is
      a mechanistic hypothesis, not an evidenced effect in AOS. The attached
      GeneReviews evidence supports only the hemodynamic-stress rationale, and
      the SMAD3 mouse literature argues against TGF-beta as the actionable
      target. See discussion `arb_tgfbeta_target_uncertainty`.
  notes: >-
    Pregnancy contraindication. Angiotensin receptor blockers act on the
    renin-angiotensin system and are contraindicated in pregnancy because of
    fetal renal and developmental toxicity, so ARB therapy has to be reviewed
    and withdrawn before or at conception. This matters particularly in
    aneurysm-osteoarthritis syndrome, where the peripartum period itself
    carries a high risk of aortic dissection/rupture and uterine rupture and
    warrants intensified imaging instead (see the "Pregnancy and Peripartum
    Aortic Surveillance" treatment). Recorded as a note rather than as an
    evidence item because none of the cached references for this entry states
    the ARB pregnancy contraindication in quotable form.
  evidence:
  - reference: PMID:20301312
    reference_title: "Loeys-Dietz Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      angiotensin receptor blockers, beta-adrenergic receptor blockers, or
      other medications are used to reduce hemodynamic stress
    explanation: >-
      GeneReviews documents angiotensin receptor blockers to reduce hemodynamic
      stress in LDS.
- name: Beta-Adrenergic Blocker Therapy
  description: >-
    Beta-adrenergic receptor blockers reduce hemodynamic stress on the aortic
    wall to slow aneurysm progression.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: beta-adrenergic antagonist
      term:
        id: NCIT:C29576
        label: Beta-Adrenergic Antagonist
  evidence:
  - reference: PMID:20301312
    reference_title: "Loeys-Dietz Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      angiotensin receptor blockers, beta-adrenergic receptor blockers, or
      other medications are used to reduce hemodynamic stress
    explanation: >-
      GeneReviews documents beta-adrenergic receptor blockers to reduce
      hemodynamic stress in LDS.
- name: Prophylactic Aortic and Arterial Surgery
  description: >-
    Aneurysms are amenable to early and aggressive surgical intervention;
    prophylactic repair at appropriate thresholds prevents dissection and
    rupture.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  evidence:
  - reference: PMID:20301312
    reference_title: "Loeys-Dietz Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      aneurysms are amenable to early and aggressive surgical intervention
    explanation: >-
      GeneReviews documents early, aggressive surgical repair of aneurysms in LDS.
  - reference: PMID:22633655
    reference_title: "Aggressive cardiovascular phenotype of aneurysms-osteoarthritis syndrome caused by pathogenic SMAD3 variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Dissections can occur at relatively mildly increased aortic diameters;
      therefore, early elective repair of the ascending aorta should be
      considered.
    explanation: >-
      Because dissection occurs at mildly increased diameters in AOS, early
      elective ascending-aorta repair is recommended.
- name: Avoidance of Contact, Competitive, and Isometric Exercise
  description: >-
    Patients should avoid contact and competitive sports and isometric exercise
    because these activities can impose abrupt hemodynamic stress on a fragile
    arterial wall.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301312
    reference_title: "Loeys-Dietz Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Contact sports, competitive sports, and isometric exercise
    explanation: >-
      GeneReviews lists contact/competitive sports and isometric exercise among
      the agents/circumstances to avoid in Loeys-Dietz syndrome.
- name: Pregnancy and Peripartum Aortic Surveillance
  description: >-
    Pregnancy and the postpartum period are high-risk intervals in which aortic
    dissection/rupture and uterine rupture may occur, so aortic imaging is
    performed more frequently during gestation and in the weeks after delivery,
    and medical therapy is reviewed for fetal safety.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  notes: >-
    Curated as management rather than as a phenotype because the cited source
    states a peripartum surveillance recommendation. The evidence is
    Loeys-Dietz-syndrome-wide GeneReviews guidance, which covers SMAD3-related
    LDS type 3 (aneurysm-osteoarthritis syndrome) but is not SMAD3-specific.
    Angiotensin receptor blocker therapy is contraindicated in pregnancy and
    must be reviewed in this setting; see the notes on "Angiotensin Receptor
    Blocker Therapy".
  evidence:
  - reference: PMID:20301312
    reference_title: "Loeys-Dietz Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pregnancy and the postpartum period can be dangerous for women with LDS
      because of increased risk of aortic dissection/rupture and uterine
      rupture. Increased frequency of aortic imaging is recommended, both
      during pregnancy and in the weeks following delivery.
    explanation: >-
      GeneReviews documents the peripartum aortic-catastrophe and
      uterine-rupture risk in Loeys-Dietz syndrome and the intensified aortic
      imaging schedule it warrants.
prevalence:
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: UNKNOWN
  notes: >-
    Aneurysm-osteoarthritis syndrome (SMAD3-related Loeys-Dietz syndrome type 3)
    is a rare disorder; a precise population prevalence has not been
    established. The only quantitative anchor available is the share of
    familial thoracic aortic aneurysm and dissection attributable to AOS (~2%),
    which is a disease-fraction rather than a population rate. The incidence of
    AOS among patients with primary visceral and iliac artery aneurysms is
    explicitly stated to be unknown.
  evidence:
  - reference: PMID:22975338
    reference_title: "Aneurysms-osteoarthritis syndrome: a syndromic form of arterial aneurysms and dissections with early-onset osteoarthritis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      AOS is estimated to be responsible for ~2% of familial thoracic aortic
      aneurysms and dissections
    explanation: >-
      Provides the only quantitative occurrence anchor for AOS: a ~2% share of
      familial thoracic aortic aneurysm and dissection. Population prevalence
      remains undetermined, so prevalence_class stays UNKNOWN.
experimental_models:
- name: Patient-Derived SMAD3 Fibroblast and Vascular Smooth Muscle Cell Cultures
  description: >-
    Primary fibroblasts and vascular smooth muscle cells from individuals with
    pathogenic/likely pathogenic SMAD3 variants were compared across
    dominant-negative MH2 and haploinsufficient variant classes. The system
    resolves variant-class effects on differentiation, smooth-muscle markers,
    MYH11 isoforms, and extracellular-matrix formation. It is limited by small
    numbers of patient lines, in-vitro differentiation, and the borderline
    clinical genotype-event comparisons; it does not reproduce arterial
    biomechanics, immune recruitment, or longitudinal aneurysm formation.
  experimental_model_type: PRIMARY_CELL_CULTURE
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_types:
  - preferred_term: vascular smooth muscle cell
    term:
      id: CL:0000359
      label: vascular associated smooth muscle cell
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  cell_source: Primary patient-derived dermal fibroblasts and vascular smooth muscle cells
  culture_system: Monolayer culture with fibroblast-to-myofibroblast differentiation
  conditions:
  - dominant-negative SMAD3 MH2-domain variants
  - haploinsufficient SMAD3 variants
  - control cell lines
  publication: DOI:10.1093/hmg/ddae044
  modeled_mechanisms:
  - target: SMAD3 Loss-of-Function
    description: >-
      Compares functional consequences of dominant-negative and
      haploinsufficient pathogenic SMAD3 variants.
    evidence:
    - reference: DOI:10.1093/hmg/ddae044
      reference_title: Functional analysis of cell lines derived from SMAD3-related Loeys-Dietz syndrome patients provides insights into genotype-phenotype relation
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Pathogenic (P)/likely pathogenic (LP) SMAD3 variants cause Loeys-Dietz
        syndrome type 3 (LDS3), which is characterized by arterial aneurysms,
        dissections and tortuosity throughout the vascular system combined with
        osteoarthritis.
      explanation: >-
        Establishes pathogenic SMAD3 variants as the genetic cause represented
        by the primary-cell model.
  - target: Aortic Medial Degeneration and Wall Weakening
    description: >-
      Measures vascular smooth-muscle differentiation and extracellular-matrix
      outputs relevant to aortic wall homeostasis.
    evidence:
    - reference: DOI:10.1093/hmg/ddae044
      reference_title: Functional analysis of cell lines derived from SMAD3-related Loeys-Dietz syndrome patients provides insights into genotype-phenotype relation
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        DN SMAD3 variant myofibroblasts demonstrated reduced extracellular
        matrix formation compared to control cell lines.
      explanation: >-
        Directly supports the model's extracellular-matrix readout relevant to
        medial wall integrity, without claiming that the culture reproduces the
        intact aorta.
  findings:
  - statement: >-
      Dominant-negative and haploinsufficient SMAD3 variants produced distinct
      differentiation, smooth-muscle-marker, MYH11-isoform, and matrix phenotypes.
    supporting_text: >-
      Fibroblasts carrying DN SMAD3 variants displayed reduced differentiation
      potential, contrasting with increased differentiation potential in HI
      SMAD3 variant fibroblasts.
    evidence:
    - reference: DOI:10.1093/hmg/ddae044
      reference_title: Functional analysis of cell lines derived from SMAD3-related Loeys-Dietz syndrome patients provides insights into genotype-phenotype relation
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Fibroblasts carrying DN SMAD3 variants displayed reduced differentiation
        potential, contrasting with increased differentiation potential in HI
        SMAD3 variant fibroblasts.
      explanation: >-
        Directly states the opposing differentiation phenotypes of the two
        pathogenic-variant classes.
  evidence:
  - reference: DOI:10.1093/hmg/ddae044
    reference_title: Functional analysis of cell lines derived from SMAD3-related Loeys-Dietz syndrome patients provides insights into genotype-phenotype relation
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      A retrospective analysis on clinical data from individuals with a P/LP
      SMAD3 variant and functional analyses on SMAD3 patient-derived VSMCs and
      SMAD3 patient-derived fibroblasts, differentiated into myofibroblasts.
    explanation: >-
      Defines the patient-derived primary-cell systems and the fibroblast
      differentiation design.

- name: Aortic Smooth-Muscle-to-Elastic-Lamella Disconnection
  biological_scale: TISSUE
  description: >-
    Early human aortic pathology in SMAD3 variant carriers consists of smooth
    muscle cells separated from elastic lamellae by glycosaminoglycans and
    elastic fibers that are poorly decorated by multiple microfibril proteins,
    even while lamellar structure and SMC content remain relatively intact.
  cell_types:
  - preferred_term: vascular smooth muscle cell
    term:
      id: CL:0000359
      label: vascular associated smooth muscle cell
  biological_processes:
  - preferred_term: extracellular matrix organization
    term:
      id: GO:0030198
      label: extracellular matrix organization
    modifier: DECREASED
  evidence:
  - reference: PMID:42273728
    reference_title: "Microfibril Denudation Marks Early Aortic Vulnerability in SMAD3 Variant Carriers: A Multigenerational Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, early pathology was evident, with SMCs separated from elastic
      lamellae by a thin layer of glycosaminoglycans. Confocal reconstructions
      revealed that elastic fibers were poorly decorated by microfibrils, with
      reduced fibrillin-1, fibrillin-2, microfibril associated glycoprotein-2,
      fibulin-1 and fibulin-2.
    explanation: >-
      Direct analysis of surgically obtained human aortas identifies an early
      tissue lesion preceding gross lamellar destruction.
  downstream:
  - target: Aortic Medial Degeneration and Wall Weakening
    description: >-
      Loss of smooth-muscle-to-elastic-lamella coupling and microfibril support
      creates an early structural vulnerability that contributes to medial
      degeneration.
- name: TGF-beta Signaling Dysregulation
  conforms_to: "aortopathy_tgfbeta_dysregulation#TGF-beta Signaling Dysregulation"
  biological_scale: CELLULAR
  description: >-
    Despite SMAD3 being a positive transducer of TGF-beta signaling, SMAD3
    mutations lead to paradoxically increased expression of key TGF-beta pathway
    components in the aortic wall, the same dysregulated-TGF-beta signature seen
    across the heritable thoracic aortic disease syndromes.
  cell_types:

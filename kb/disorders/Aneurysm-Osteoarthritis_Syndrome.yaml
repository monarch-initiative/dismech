- name: Cartilage TGF-beta Dysregulation and Early-Onset Osteoarthritis
  biological_scale: TISSUE
  description: >-
    A hallmark that distinguishes aneurysm-osteoarthritis syndrome from other
    aneurysm syndromes is prominent early-onset osteoarthritis, frequently with
    osteochondritis dissecans. SMAD3 is essential for TGF-beta-mediated
    regulation of chondrocyte differentiation and cartilage homeostasis, so its
    disruption promotes cartilage degeneration.

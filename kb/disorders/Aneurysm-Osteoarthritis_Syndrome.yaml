- name: Reduced PRRX2-Dependent Aortic Microfibril Expression
  biological_scale: CELLULAR
  description: >-
    In a multigenerational SMAD3 p.Arg287Gln family, aortic smooth muscle cells
    showed reduced expression of microfibril genes and downregulation of PRRX2,
    a promoter-occupying regulator of five microfibril genes. SMAD3
    overexpression rescued both PRRX2 and microfibril expression, defining a
    directly tested SMAD3-PRRX2-microfibril axis.

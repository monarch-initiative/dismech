discussions:
- discussion_id: arb_tgfbeta_target_uncertainty
  kind: CONTROVERSY
  status: OPEN
  prompt: >-
    Does angiotensin receptor blockade benefit SMAD3-related
    aneurysm-osteoarthritis syndrome by inhibiting aortic TGF-beta signaling,
    or only by reducing hemodynamic wall stress - and is TGF-beta the right
    therapeutic target in AOS at all?
  attaches_to:
  - pathophysiology#TGF-beta Signaling Dysregulation
  rationale: >-
    The entry models an ARB -> "TGF-beta Signaling Dysregulation" INHIBITS
    edge, but that edge is not directly evidenced in AOS. The GeneReviews
    statement attached to the ARB treatment supports only reduction of
    hemodynamic stress, not TGF-beta inhibition. Two SMAD3 mouse studies point
    away from TGF-beta as the actionable target: PMID:27688095 concludes that
    immune suppression may be more beneficial than targeting TGF-beta
    signaling, and PMID:23782924 nominates macrophage depletion and iNOS
    antagonism instead. The paradoxical-TGF-beta-increase model is inherited
    from the aortopathy_tgfbeta_dysregulation module and from Marfan/losartan
    biology, so there is a real risk of importing a mechanism that has not been
    demonstrated for SMAD3 specifically. Resolving this matters clinically,
    since ARB therapy is a modeled treatment for this disease.
  evidence:
  - reference: PMID:27688095
    reference_title: "Defective Connective Tissue Remodeling in Smad3 Mice Leads to Accelerated Aneurysmal Growth Through Disturbed Downstream TGF-β Signaling."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: >-
      instead of targeting TGF-β signaling, immune suppression may be more
      beneficial
    explanation: >-
      Argues against TGF-beta signaling as the therapeutic target in SMAD3
      aortic disease, in tension with the modeled ARB -> TGF-beta edge.
  - reference: PMID:23782924
    reference_title: "SMAD3 deficiency promotes inflammatory aortic aneurysms in angiotensin II-infused mice via activation of iNOS."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Macrophage depletion and iNOS antagonism represent 2 promising approaches
    explanation: >-
      Nominates immune/iNOS-directed rather than TGF-beta-directed intervention
      for SMAD3-related aneurysm.
  notes: >-
    Both refuting studies are MODEL_ORGANISM evidence, so they constrain the
    mechanistic claim rather than the clinical practice of using ARBs in AOS.
    Retained rather than deleting the target_mechanisms edge so the open
    question stays visible; a curator may prefer to retarget the edge to the
    hemodynamic-stress node instead.

diagnosis:
- name: Molecular confirmation of a pathogenic SMAD3 variant
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    Sequence analysis with deletion/duplication coverage, usually through a
    heritable thoracic aortic disease or connective-tissue multigene panel,
    identifies a heterozygous pathogenic or likely pathogenic SMAD3 variant.
    A variant of uncertain significance alone does not establish the diagnosis.
  results: >-
    A heterozygous pathogenic or likely pathogenic SMAD3 variant in a compatible
    clinical or family context establishes SMAD3-related LDS3/AOS.
  evidence:
  - reference: PMID:20301312
    reference_title: "Loeys-Dietz Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of LDS is established in (1) a proband with characteristic
      clinical findings or (2) by the identification of a heterozygous
      pathogenic variant in SMAD2, SMAD3, TGFB2, TGFB3, TGFBR1, or TGFBR2
    explanation: >-
      GeneReviews directly supports molecular confirmation and includes SMAD3.
- name: Baseline and serial whole-arterial-tree imaging
  diagnosis_term:
    preferred_term: Diagnostic Imaging Testing
    term:
      id: NCIT:C16502
      label: Diagnostic Imaging Testing
  description: >-
    Echocardiography measures the aortic root and ascending aorta, while
    contrast CT angiography or MR angiography from head to pelvis identifies
    extra-aortic aneurysms, dissections, and arterial tortuosity that
    echocardiography cannot detect.
  results: >-
    Aortic-root/ascending-aortic dimensions and the presence, location, and
    growth of aneurysm, dissection, or tortuosity establish vascular extent and
    guide surveillance and prophylactic repair.
  evidence:
  - reference: PMID:20301312
    reference_title: "Loeys-Dietz Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Echocardiography to monitor the status of the aortic root and ascending
      aorta (at least annually) and magnetic resonance angiography or
      computerized tomography angiography to assess the entire arterial tree
    explanation: >-
      GeneReviews directly supports combined echocardiographic and complete
      arterial-tree imaging.

histopathology:
- name: Aortic Medial Degeneration
  description: >-
    Histology of human AOS aortic wall fragments shows disorganization of the
    tunica media with characteristic mucoid medial degeneration and
    accumulation of collagen in the media. This is the human tissue-level
    counterpart of the "Aortic Medial Degeneration and Wall Weakening"
    pathophysiology node.
  evidence:
  - reference: PMID:22975338
    reference_title: "Aneurysms-osteoarthritis syndrome: a syndromic form of arterial aneurysms and dissections with early-onset osteoarthritis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      On histology of aortic wall fragments, evident disorganization of the
      tunica media with fragmentation and loss of elastic fibers was observed,
      as well as characteristic mucoid medial degeneration and accumulation of
      collagen in media.
    explanation: >-
      Direct human aortic histology documenting mucoid medial degeneration and
      medial collagen accumulation in AOS.
  notes: >-
    Two caveats. (1) Human-versus-model discordance: the medial collagen
    accumulation seen in human AOS aortas is NOT recapitulated in the Smad3-/-
    mouse, where PMID:27688095 reports no collagen accumulation. The human
    histology above is therefore the primary support for this finding, and the
    mouse data should not be read as confirming it. (2) No finding_term is
    bound because the precise HPO aortic-histopathology terms (HP:0032079
    medial degeneration, HP:0200146 mucoid extracellular matrix accumulation)
    are not admissible under the current HistopathologyFindingTerm dynamic
    enum, which is reachable only from NCIT branches plus HP:0025461; NCIT has
    no equivalent term.
- name: Aortic Elastic Fiber Fragmentation and Loss
  description: >-
    Fragmentation and loss of medial elastic fibers accompanies the medial
    disorganization in AOS aortic wall specimens.
  evidence:
  - reference: PMID:22975338

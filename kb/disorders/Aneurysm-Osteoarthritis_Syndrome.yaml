- name: Aortic Dissection and Rupture
  conforms_to: "aortopathy_tgfbeta_dysregulation#Aortic Dissection and Rupture"
  biological_scale: ORGANISM
  description: >-
    The weakened, aneurysmal arterial wall is prone to dissection and rupture.
    A clinically critical feature shared with other Loeys-Dietz subtypes is that
    dissection can occur at smaller aortic diameters and at younger ages than in
    Marfan syndrome, and vascular disease is not limited to the aortic root.
  cell_types:

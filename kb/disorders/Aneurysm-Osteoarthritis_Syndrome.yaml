discussions:
- discussion_id: arb_tgfbeta_target_uncertainty
  kind: CONTROVERSY
  status: OPEN
  prompt: >-
    Does angiotensin receptor blockade benefit SMAD3-related aneurysm-
    osteoarthritis syndrome by inhibiting aortic TGF-beta signaling, or only by
    reducing hemodynamic wall stress - and is TGF-beta the right therapeutic
    target in AOS at all?
  attaches_to:
  - pathophysiology#TGF-beta Signaling Dysregulation
  rationale: >-
    The entry models an ARB -> "TGF-beta Signaling Dysregulation" INHIBITS
    edge, but that edge is not directly evidenced in AOS. The GeneReviews
    statement attached to the ARB treatment supports only reduction of
    hemodynamic stress, not TGF-beta inhibition. Two SMAD3 mouse studies point
    away from TGF-beta as the actionable target: PMID:27688095 concludes that
    immune suppression may be more beneficial than targeting TGF-beta
    signaling, and PMID:23782924 nominates macrophage depletion and iNOS
    antagonism instead. The paradoxical-TGF-beta-increase model is inherited
    from the aortopathy_tgfbeta_dysregulation module and from Marfan/losartan
    biology, so there is a real risk of importing a mechanism that has not been
    demonstrated for SMAD3 specifically. Resolving this matters clinically,
    since ARB therapy is a modeled treatment for this disease.
  evidence:
  - reference: PMID:27688095
    reference_title: "Defective Connective Tissue Remodeling in Smad3 Mice Leads to Accelerated Aneurysmal Growth Through Disturbed Downstream TGF-β Signaling."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: >-
      instead of targeting TGF-β signaling, immune suppression may be more
      beneficial
    explanation: >-
      Argues against TGF-beta signaling as the therapeutic target in SMAD3
      aortic disease, in tension with the modeled ARB -> TGF-beta edge.
  - reference: PMID:23782924
    reference_title: "SMAD3 deficiency promotes inflammatory aortic aneurysms in angiotensin II-infused mice via activation of iNOS."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Macrophage depletion and iNOS antagonism represent 2 promising approaches
    explanation: >-
      Nominates immune/iNOS-directed rather than TGF-beta-directed intervention
      for SMAD3-related aneurysm.
  notes: >-
    Both refuting studies are MODEL_ORGANISM evidence, so they constrain the
    mechanistic claim rather than the clinical practice of using ARBs in AOS.
    Retained rather than deleting the target_mechanisms edge so the open
    question stays visible; a curator may prefer to retarget the edge to the
    hemodynamic-stress node instead.

histopathology:
- name: Aortic Medial Degeneration
  description: >-
    Histology of human AOS aortic wall fragments shows disorganization of the
    tunica media with characteristic mucoid medial degeneration and
    accumulation of collagen in the media. This is the human tissue-level
    counterpart of the "Aortic Medial Degeneration and Wall Weakening"
    pathophysiology node.
  evidence:
  - reference: PMID:22975338
    reference_title: "Aneurysms-osteoarthritis syndrome: a syndromic form of arterial aneurysms and dissections with early-onset osteoarthritis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      On histology of aortic wall fragments, evident disorganization of the
      tunica media with fragmentation and loss of elastic fibers was observed,
      as well as characteristic mucoid medial degeneration and accumulation of
      collagen in media.
    explanation: >-
      Direct human aortic histology documenting mucoid medial degeneration and
      medial collagen accumulation in AOS.
  notes: >-
    Two caveats. (1) Human-versus-model discordance: the medial collagen
    accumulation seen in human AOS aortas is NOT recapitulated in the Smad3-/-
    mouse, where PMID:27688095 reports no collagen accumulation. The human
    histology above is therefore the primary support for this finding, and the
    mouse data should not be read as confirming it. (2) No finding_term is
    bound because the precise HPO aortic-histopathology terms (HP:0032079
    medial degeneration, HP:0200146 mucoid extracellular matrix accumulation)
    are not admissible under the current HistopathologyFindingTerm dynamic
    enum, which is reachable only from NCIT branches plus HP:0025461; NCIT has
    no equivalent term.
- name: Aortic Elastic Fiber Fragmentation and Loss
  description: >-
    Fragmentation and loss of medial elastic fibers accompanies the medial
    disorganization in AOS aortic wall specimens.
  evidence:
  - reference: PMID:22975338
    reference_title: "Aneurysms-osteoarthritis syndrome: a syndromic form of arterial aneurysms and dissections with early-onset osteoarthritis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      On histology of aortic wall fragments, evident disorganization of the
      tunica media with fragmentation and loss of elastic fibers was observed
    explanation: >-
      Human aortic histology documents elastic fiber fragmentation and loss.
  notes: >-
    No finding_term is bound: HP:0032083 (aortic elastic fiber fragmentation)
    is the exact term but is outside the HistopathologyFindingTerm enum's
    reachable set, and NCIT has no equivalent.

biochemical:
- name: N-Terminal Pro-B-Type Natriuretic Peptide (NT-proBNP)
  biomarker_term:
    preferred_term: NT-proBNP measurement
    term:
      id: NCIT:C96610
      label: N-Terminal ProB-type Natriuretic Peptide Measurement
  presence: Elevated relative to matched controls
  notes: >-
    NT-proBNP is elevated in AOS patients versus matched controls and correlates
    strongly with aortic pulse wave velocity, a measure of aortic stiffness.
  readouts:
  - target: Aortic Medial Degeneration and Wall Weakening
    relationship: CORRELATES_WITH
    direction: POSITIVE
    endpoint_context: MONITORING
    interpretation: >-
      Higher NT-proBNP tracks with higher aortic pulse wave velocity (increased
      aortic stiffness), making it a candidate circulating correlate of the
      degenerated, stiffened aortic wall. This is an observed correlation in a
      single cohort, not a validated surrogate endpoint.
    evidence:
    - reference: PMID:22633655
      reference_title: "Aggressive cardiovascular phenotype of aneurysms-osteoarthritis syndrome caused by pathogenic SMAD3 variants."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Aortic pulse wave velocity was high-normal (9.2 ± 2.2 m/s), indicating
        increased aortic stiffness, which strongly correlated with NT-proBNP
        (r = 0.731, p = 0.005).
      explanation: >-
        Quantifies the correlation between NT-proBNP and aortic stiffness in the
        AOS cohort.
  evidence:
  - reference: PMID:22633655
    reference_title: "Aggressive cardiovascular phenotype of aneurysms-osteoarthritis syndrome caused by pathogenic SMAD3 variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      N-terminal brain natriuretic peptide (NT-proBNP) was significantly higher
      in AOS patients compared with matched controls (p < 0.001).
    explanation: >-
      Establishes NT-proBNP elevation in AOS relative to matched controls.

genetic:
- name: SMAD3
  gene_term:
    preferred_term: SMAD3
    term:
      id: hgnc:6769
      label: SMAD3
  association: Causative
  relationship_type: CAUSATIVE
  notes: >-
    Heterozygous pathogenic variants in SMAD3, encoding the receptor-regulated
    SMAD3 of the TGF-beta pathway, cause aneurysm-osteoarthritis syndrome
    (Loeys-Dietz syndrome type 3). Inheritance is autosomal dominant. The
    variant spectrum includes haploinsufficiency alleles and missense
    substitutions in the MH2 domain (as well as MH1-domain variants and in-frame
    deletions); MH2 missense variants are associated with earlier aortic events.
    Penetrance for aortic disease is reduced and age of onset is variable.
  evidence:
  - reference: PMID:21217753
    reference_title: "Mutations in SMAD3 cause a syndromic form of aortic aneurysms and dissections with early-onset osteoarthritis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We mapped the genetic locus to chromosome 15q22.2-24.2 and show that the
      disease is caused by mutations in SMAD3
    explanation: >-
      Identifies SMAD3 (15q22) as the causal gene for the syndrome.
  - reference: PMID:30661052
    reference_title: "SMAD3 pathogenic variants: risk for thoracic aortic disease and associated complications from the Montalcino Aortic Consortium."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SMAD3 pathogenic variants cause thoracic aortic aneurysms and dissections
      in the majority of individuals with variable age of onset and reduced
      penetrance.
    explanation: >-
      Documents autosomal dominant SMAD3-driven aortic disease with variable
      onset and reduced penetrance.
  - reference: PMID:30661052
    reference_title: "SMAD3 pathogenic variants: risk for thoracic aortic disease and associated complications from the Montalcino Aortic Consortium."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The median age at first aortic event was significantly lower in
      individuals with SMAD3 MH2 missense variants than those with HI variants
    explanation: >-
      Genotype-phenotype correlation: MH2-domain missense variants are
      associated with earlier aortic events than haploinsufficiency variants.
progression:
- phase: Childhood and adolescence
  age_range: Childhood to early adulthood
  notes: >-
    Early-onset joint disease (osteoarthritis and osteochondritis dissecans) is
    frequently the first manifestation, often prompting the initial medical
    evaluation. Aortic events in childhood have not been observed in SMAD3
    cohorts.
  evidence:
  - reference: PMID:22167769
    reference_title: "Phenotypic spectrum of the SMAD3-related aneurysms-osteoarthritis syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the majority of patients, early-onset joint abnormalities, including
      osteoarthritis and osteochondritis dissecans, were the initial symptom
      for which medical advice was sought.
    explanation: >-
      Establishes joint disease as the typical presenting feature earlier in the
      disease course.
  - reference: PMID:30661052
    reference_title: "SMAD3 pathogenic variants: risk for thoracic aortic disease and associated complications from the Montalcino Aortic Consortium."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No aortic events in childhood were observed.
    explanation: >-
      Supports the absence of aortic events during childhood, informing
      gene-specific surveillance.
- phase: Adulthood
  age_range: Adulthood
  notes: >-
    Aortic aneurysms and dissections accrue with age; the cumulative risk of an
    aortic event reaches 50% by age 54, and aortic dissection is a major cause
    of sudden death.
  evidence:
  - reference: PMID:30661052
    reference_title: "SMAD3 pathogenic variants: risk for thoracic aortic disease and associated complications from the Montalcino Aortic Consortium."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The cumulative risk of an aortic event was 50% at 54 years of age.
    explanation: >-
      Quantifies age-dependent cumulative aortic-event risk in the adult course.
  - reference: PMID:22167769
    reference_title: "Phenotypic spectrum of the SMAD3-related aneurysms-osteoarthritis syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of the patients who first presented with joint abnormalities, 20% died
      suddenly from aortic dissection.
    explanation: >-
      Documents sudden death from aortic dissection as a major adult outcome.
treatments:
- name: Angiotensin Receptor Blocker Therapy
  description: >-
    Angiotensin receptor blockers (e.g., losartan) are used to reduce
    hemodynamic stress and are hypothesized to attenuate dysregulated TGF-beta
    signaling in the aortic wall.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: losartan
      term:
        id: CHEBI:6541
        label: losartan
  target_mechanisms:
  - target: TGF-beta Signaling Dysregulation
    treatment_effect: INHIBITS
    description: >-
      Angiotensin receptor blockade (losartan) is proposed to attenuate the
      dysregulated aortic TGF-beta signaling that drives medial degeneration,
      in addition to lowering hemodynamic wall stress. IMPORTANT: this edge is
      a mechanistic hypothesis, not an evidenced effect in AOS. The attached
      GeneReviews evidence supports only the hemodynamic-stress rationale, and
      the SMAD3 mouse literature argues against TGF-beta as the actionable
      target. See discussion `arb_tgfbeta_target_uncertainty`.
  evidence:
  - reference: PMID:20301312
    reference_title: "Loeys-Dietz Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      angiotensin receptor blockers, beta-adrenergic receptor blockers, or
      other medications are used to reduce hemodynamic stress
    explanation: >-
      GeneReviews documents angiotensin receptor blockers to reduce hemodynamic
      stress in LDS.

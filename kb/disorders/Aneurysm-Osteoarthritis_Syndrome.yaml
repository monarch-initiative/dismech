    explanation: >-
      Quantifies the lethal risk of aortic dissection in AOS, including in
      patients who initially presented with joint disease.
  - reference: PMID:30661052
    reference_title: "SMAD3 pathogenic variants: risk for thoracic aortic disease and associated complications from the Montalcino Aortic Consortium."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Aortic events were documented in 37% of cases, with dissections
      accounting for 70% of events.
    explanation: >-
      In an international SMAD3 cohort, aortic events (dissection or aneurysm
      repair) affected a substantial minority, most being dissections.
  - reference: PMID:22633655
    reference_title: "Aggressive cardiovascular phenotype of aneurysms-osteoarthritis syndrome caused by pathogenic SMAD3 variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The main cause of death was aortic dissection (9 of 15; 60%), which
      occurred at mildly increased aortic diameters (range: 40 to 63 mm).
    explanation: >-
      Aortic dissection was the leading cause of death and occurred at only
      mildly increased aortic diameters, underscoring dissection risk below
      conventional thresholds.
- name: Cartilage TGF-beta Dysregulation and Early-Onset Osteoarthritis
  biological_scale: TISSUE
  description: >-
    A hallmark that distinguishes aneurysm-osteoarthritis syndrome from other
    aneurysm syndromes is prominent early-onset osteoarthritis, frequently with
    osteochondritis dissecans. SMAD3 is essential for TGF-beta-mediated
    regulation of chondrocyte differentiation and cartilage homeostasis, so its
    disruption promotes cartilage degeneration.
  cell_types:

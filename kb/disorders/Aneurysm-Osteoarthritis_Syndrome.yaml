- name: Familial thoracic aortic aneurysm and dissection
  description: >-
    Nonsyndromic familial HTAD can present with an autosomal dominant thoracic
    aneurysm/dissection phenotype without obvious systemic features.
  distinguishing_features:
  - >-
    A pathogenic SMAD3 variant with early osteoarthritis, osteochondritis
    dissecans, arterial tortuosity, and extra-aortic aneurysms supports
    syndromic AOS rather than an isolated familial TAAD presentation.
  disease_term:
    preferred_term: familial thoracic aortic aneurysm and aortic dissection
    term:
      id: MONDO:0019625
      label: familial thoracic aortic aneurysm and aortic dissection
- name: Multiple epiphyseal dysplasia
  description: >-
    Multiple epiphyseal dysplasia is an important musculoskeletal differential
    when premature generalized osteoarthritis is the presenting complaint.
  distinguishing_features:
  - >-
    Epiphyseal dysplasia on skeletal imaging and a causal COMP, MATN3, COL9A1,
    COL9A2, or COL9A3 variant favor multiple epiphyseal dysplasia.
  - >-
    Diffuse aneurysm, dissection, or arterial tortuosity with a pathogenic SMAD3
    variant establishes AOS.
  disease_term:

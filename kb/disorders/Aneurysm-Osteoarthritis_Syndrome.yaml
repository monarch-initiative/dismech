name: Aneurysm-Osteoarthritis Syndrome
creation_date: "2026-07-29T00:00:00Z"
category: Mendelian
description: >
  Aneurysm-osteoarthritis syndrome (AOS), also classified as Loeys-Dietz
  syndrome type 3 (LDS3; formerly Loeys-Dietz syndrome type 1C), is an
  autosomal dominant connective tissue disorder caused by heterozygous
  pathogenic variants in SMAD3, an intracellular mediator of the transforming
  growth factor beta (TGF-beta) signaling pathway. It is characterized by the
  combination of arterial aneurysms, dissections, and tortuosity throughout the
  arterial tree together with a distinctive, early-onset osteoarthritis with
  osteochondritis dissecans that sets it apart from other heritable thoracic
  aortic disease (HTAD) syndromes. Additional features include mild craniofacial
  anomalies (hypertelorism, bifid uvula/cleft palate), skeletal manifestations
  (pectus deformity, scoliosis, arachnodactyly, pes planus, joint laxity), mitral
  valve abnormalities, and cutaneous findings. As in other Loeys-Dietz subtypes,
  aortic dissection can occur at smaller aortic diameters and younger ages than in
  Marfan syndrome, so early diagnosis, arterial-tree surveillance, medical therapy,
  and prophylactic surgery are central to management.

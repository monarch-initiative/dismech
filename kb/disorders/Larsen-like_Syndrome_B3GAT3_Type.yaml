  downstream:
  - target: Incomplete GAG-Protein Tetrasaccharide Linker Assembly
    description: >
      Loss of the terminal glucuronosyl transfer step leaves the linker
      trisaccharide unfinished, so glycosaminoglycan polymerization cannot begin.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:25893793
      reference_title: "Skeletal dysplasia in a consanguineous clan from the island of Nias/Indonesia is caused by a novel mutation in B3GAT3."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        We found that Pro140Leu-mutant GlcAT-I cannot efficiently transfer GlcA to
        the linker region trisaccharide.
      explanation: >-
        Shows directly that the mutant enzyme fails to complete the linker
        tetrasaccharide.
- name: Incomplete GAG-Protein Tetrasaccharide Linker Assembly
  biological_scale: MOLECULAR
  description: >
    All glycosaminoglycan chains — heparan sulfate and chondroitin/dermatan
    sulfate alike — are built on a single shared GlcA-Gal-Gal-Xyl tetrasaccharide
    linker attached to a serine of the proteoglycan core protein. GlcAT-I catalyzes
    the final, committing step of linker assembly, so its deficiency is a
    bottleneck upstream of every downstream GAG polymerase and sulfotransferase.
    This shared-bottleneck position is what defines the "linkeropathy" disease class
    and explains why one enzyme defect produces a pleiotropic connective tissue
    phenotype.
  biological_processes:
  - preferred_term: proteoglycan biosynthesis
    term:
      id: GO:0030166
      label: proteoglycan biosynthetic process
    modifier: DECREASED
  evidence:
  - reference: PMID:26086840
    reference_title: "A homozygous B3GAT3 mutation causes a severe syndrome with multiple fractures, expanding the phenotype of linkeropathy syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Linkeropathies are due to enzymatic defects in the synthesis of the
      common linker region that joins the core proteins to their glycosaminoglycan
      (GAG) side chains.
    explanation: Defines the shared-linker bottleneck that this node represents.
  - reference: PMID:31438591
    reference_title: "Further Defining the Phenotypic Spectrum of B3GAT3 Mutations and Literature Review on Linkeropathy Syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The linker region is completed by the transfer of glucuronic acid (GlcA)
      catalyzed by glucuronosyltransferase I (GlcAT-I encoded by B3GAT3), upon which
      polymerization of the HS or CS/DS chains begins.
    explanation: >-
      States that GlcAT-I completes the linker and that HS and CS/DS polymerization
      is downstream of it.
  downstream:
  - target: Combined Heparan and Chondroitin/Dermatan Sulfate Proteoglycan Deficiency
    description: >
      Because the blocked step is shared, both the heparan sulfate and the
      chondroitin/dermatan sulfate arms of proteoglycan synthesis are reduced
      together rather than one selectively.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:25893793
      reference_title: "Skeletal dysplasia in a consanguineous clan from the island of Nias/Indonesia is caused by a novel mutation in B3GAT3."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        This failure results in a partial deficiency of both chondroitin sulfate
        and heparan sulfate chains.
      explanation: Demonstrates the combined, non-selective GAG deficiency.
- name: Combined Heparan and Chondroitin/Dermatan Sulfate Proteoglycan Deficiency
  biological_scale: CELLULAR
  description: >
    Patient fibroblasts and lymphoblastoid cells carry reduced numbers of GAG side
    chains and reduced levels of heparan sulfate, chondroitin sulfate, and dermatan
    sulfate proteoglycans. Proteoglycans are not only structural space-filling ECM
    components but also co-receptors and morphogen reservoirs (FGF, BMP, Wnt,
    Hedgehog), so their simultaneous depletion degrades both the mechanical and the
    signalling functions of the matrix. The b3gat3 zebrafish mutant qualifies this
    picture: there, CS synthesis is virtually abolished while roughly half of
    normal HS output is retained, implying the two arms may not be equally
    sensitive to loss of the shared linker step.
  biological_processes:
  - preferred_term: heparan sulfate proteoglycan biosynthesis
    term:
      id: GO:0015012
      label: heparan sulfate proteoglycan biosynthetic process
    modifier: DECREASED
  - preferred_term: chondroitin sulfate proteoglycan biosynthesis
    term:
      id: GO:0050650
      label: chondroitin sulfate proteoglycan biosynthetic process
    modifier: DECREASED
  cell_types:

- name: Joint Capsule and Ligament Laxity
  biological_scale: TISSUE
  description: >
    Ligaments, joint capsules and tendons depend on proteoglycan-rich matrix for
    tensile integrity. Their weakening produces the cardinal congenital large-joint
    dislocations (hips, elbows, knees) and generalized joint hypermobility, while
    the same abnormal periarticular tissue also gives rise to fixed joint
    contractures — an unusual coexistence of laxity and contracture that is
    characteristic of B3GAT3 (and B3GALT6) disease among the linkeropathies.
  locations:
  - preferred_term: skeletal joint
    term:
      id: UBERON:0000982
      label: skeletal joint
  evidence:
  - reference: PMID:21763480
    reference_title: "Faulty initiation of proteoglycan synthesis causes cardiac and joint defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We studied five patients with recessive joint dislocations
      and congenital heart defects, including bicuspid aortic valve (BAV) and aortic
      root dilatation.
    explanation: >-
      The founding cohort was ascertained on recessive joint dislocations, anchoring
      this node clinically.
  - reference: PMID:31438591
    reference_title: "Further Defining the Phenotypic Spectrum of B3GAT3 Mutations and Literature Review on Linkeropathy Syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      While joint hypermobility is a common trait of all LKs, joint contractures are
      more frequently observed in patients with B3GAT3 and B3GALT6 mutations.
    explanation: >-
      Supports the coexistence of hypermobility with contractures and its relative
      specificity for B3GAT3.
- name: Impaired Cardiac Valve and Great Vessel Development
  biological_scale: TISSUE
  description: >
    Proteoglycan-rich cardiac jelly and valve interstitial matrix are required for
    endocardial cushion remodelling and semilunar/atrioventricular valve
    morphogenesis, and proteoglycans are structural constituents of the aortic
    media. GlcAT-I deficiency therefore yields bicuspid aortic valve, mitral valve
    prolapse, atrial and ventricular septal defects, and progressive aortic root
    dilatation. Cardiovascular involvement is the feature that most sharply
    distinguishes B3GAT3-related disease from the B4GALT7/B3GALT6 spondylodysplastic
    Ehlers-Danlos linkeropathies, and it is genotype-dependent: the Nias

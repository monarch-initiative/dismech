      We identified linkage to chromosome 11 and detected a mutation
      (c.830G>A, p.Arg277Gln) in B3GAT3, the gene coding for glucuronosyltransferase-I
      (GlcAT-I).
    explanation: >-
      Original gene discovery establishing B3GAT3 as the cause of the Larsen-like
      joint dislocation plus congenital heart defect syndrome.
  - reference: PMID:27871226
    reference_title: "Functional validation of novel compound heterozygous variants in B3GAT3 resulting in severe osteopenia and fractures: expanding the disease phenotype."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Independent in vitro assessment of each variant confirmed the B3GAT3: c.1A > G (p.Met1?)
      variant is functionally null and the c.671 T > A (p.L224Q) missense variant has
      significantly reduced glucuronyltransferase activity (~3% of control).
    explanation: >-
      Functional confirmation that pathogenic B3GAT3 alleles act by loss of
      glucuronyltransferase activity, including a true null allele.
  - reference: PMID:39359951
    reference_title: "A Recurrent c.416C>T Variant in the B3GAT3 Gene in the Turkish Population: Report of Two Siblings and Expanding the Clinical Spectrum."
    supports: SUPPORT

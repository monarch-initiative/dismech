      boy patient.
    explanation: Documents a recurrent homozygous B3GAT3 allele in the Turkish population.
pathophysiology:
- name: GlcAT-I Loss of Function
  biological_scale: MOLECULAR
  description: >
    Biallelic B3GAT3 missense, start-loss, or in-frame deletion variants reduce or
    abolish the galactosylgalactosylxylosylprotein 3-beta-glucuronosyltransferase
    activity of GlcAT-I. Disease-associated substitutions cluster in the two
    functional halves of the catalytic domain: the donor (UDP-GlcA)
    substrate-binding subdomain (p.Pro140Leu, p.Thr139Met, p.Arg161Trp) and the
    acceptor substrate-binding subdomain (p.Arg277Gln, p.Gly223Ser, p.Leu224Gln,
    p.Arg297Trp). Reduced activity is demonstrable both in patient-derived cells
    and for recombinant mutant protein.

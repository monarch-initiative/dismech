progression:
- phase: Perinatal-lethal severe course
  age_range: Prenatal period to 1 year
  notes: >-
    Patients homozygous for the acceptor-subdomain p.Gly223Ser allele present
    prenatally with craniosynostosis and radioulnar/radiohumeral synostosis and have
    a uniformly fatal course in the first year of life, with multiple neonatal
    fractures, joint dislocations and contractures, and cardiovascular malformation.
  evidence:
  - reference: PMID:28771243
    reference_title: "B3GAT3-related disorder with craniosynostosis and bone fragility due to a unique mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All died before 1 year of
      age.
    explanation: Documents uniform death before age one in the six p.Gly223Ser patients.
- phase: Survival to adulthood in milder genotypes
  age_range: Birth to adulthood
  notes: >-
    Milder genotypes are compatible with survival into adult life, though with
    substantial cumulative morbidity — fixed joint malalignment, severe
    kyphoscoliosis, osteoporosis with childhood fractures, and dental anomalies.
  evidence:
  - reference: PMID:34537402
    reference_title: "B3GAT3-related linkeropathy and an in-frame homozygous deletion in an adult patient."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Previously described patients of B3GAT3-deficiency were,
      however, all children with phenotypes ranging from prenatal manifestation and
      early lethality to less severe.
    explanation: >-
      Frames this report as the first adult phenotype, establishing that survival to
      adulthood is possible in milder disease.
diagnosis:
- name: Molecular Genetic Testing (Exome/Genome Sequencing)
  description: >
    Diagnosis rests on identification of biallelic pathogenic B3GAT3 variants. In
    practice most patients have been ascertained by trio exome or clinical exome
    sequencing after a clinical diagnosis of Larsen syndrome, spondylodysplastic
    Ehlers-Danlos syndrome, Marfan syndrome, Antley-Bixler syndrome or
    Shprintzen-Goldberg syndrome proved genetically unconfirmed — the phenotypic
    overlap is close enough that B3GAT3 is frequently missed on targeted panels.
  evidence:
  - reference: PMID:28771243
    reference_title: "B3GAT3-related disorder with craniosynostosis and bone fragility due to a unique mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Molecular diagnosis involved whole-exome and gene-panel
      sequencing.
    explanation: Documents the diagnostic modality used.
  - reference: PMID:35151321
    reference_title: "Severe phenotypes of B3GAT3-related disorder caused by two heterozygous variants: a case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We diagnosed a patient with congenital heart defects at an early age
      with a B3GAT3-related disorder instead of Marfan syndrome
    explanation: >-
      Illustrates that molecular testing reclassifies clinically Marfan-suspected
      patients as B3GAT3-related disease.
- name: Glucuronyltransferase Activity Assay
  description: >
    Enzymatic assay of GlcAT-I activity in patient fibroblasts or lymphoblastoid
    cells, and quantification of GAG side-chain occupancy, can support the
    pathogenicity of variants of uncertain significance. This is a research-level
    assay rather than a routine clinical test.
  evidence:
  - reference: PMID:27871226
    reference_title: "Functional validation of novel compound heterozygous variants in B3GAT3 resulting in severe osteopenia and fractures: expanding the disease phenotype."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      demonstrating the patient had a
      decrease both in the protein level of B3GAT3 and in the glucuronyltransferase
      activity when compared to control samples.
    explanation: Demonstrates the assay used to establish variant pathogenicity.
differential_diagnoses:
- name: Larsen Syndrome (FLNB-related)
  disease_term:
    preferred_term: Larsen syndrome
    term:
      id: MONDO:0007875
      label: Larsen syndrome
  description: >
    Classic Larsen syndrome shares congenital large-joint dislocations and
    craniofacial dysmorphism, and is the source of the "Larsen-like" name.
  distinguishing_features:
  - FLNB-Larsen is autosomal dominant, caused by heterozygous missense variants
    clustered in the actin-binding domain and filamin repeats 13-17, whereas B3GAT3
    disease is autosomal recessive.
  - B3GAT3 disease adds radioulnar synostosis, reduced bone mineral density and
    cardiac valve/great-vessel malformations that are not core features of
    FLNB-Larsen.
  evidence:
  - reference: PMID:31438591
    reference_title: "Further Defining the Phenotypic Spectrum of B3GAT3 Mutations and Literature Review on Linkeropathy Syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among the B3GAT3-related disorders, a LRS-like presentation similar to that of
      our patient was the most common, but more severe phenotypes resembling ABS, SGS,
      and GO have also been reported
    explanation: >-
      States that a Larsen-syndrome-like presentation is the most common B3GAT3
      phenotype, making FLNB-Larsen the primary differential.
- name: Spondylodysplastic Ehlers-Danlos Syndrome
  disease_term:
    preferred_term: spondylodysplastic Ehlers-Danlos syndrome
    term:
      id: MONDO:0007526
      label: Ehlers-Danlos syndrome, spondylodysplastic type
  description: >
    The B4GALT7- and B3GALT6-related linkeropathies are the immediate mechanistic
    neighbours of B3GAT3 disease — they block the two galactosyl transfer steps of
    the same tetrasaccharide linker — and were incorporated into the 2017 EDS
    nosology as spEDS, together with SLC39A13-spEDS.
  distinguishing_features:
  - B3GAT3 disease is deliberately not classified within spEDS in the 2017 EDS
    nosology despite the shared pathogenic mechanism.
  - Cardiovascular malformation and craniosynostosis are more characteristic of
    B3GAT3 disease.
  - Marked skin hyperextensibility, doughy or translucent skin and atrophic scarring
    are more characteristic of spEDS.
  - Platyspondyly, the hallmark of spondylodysplasia, is essentially absent in
    B3GAT3-related disease.
  evidence:
  - reference: PMID:31438591
    reference_title: "Further Defining the Phenotypic Spectrum of B3GAT3 Mutations and Literature Review on Linkeropathy Syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with B3GAT3, XYLT1, and XYLT2 mutations were also not classified as
      spEDS, even though there is a common pathogenic mechanism and numerous shared
      clinical features.
    explanation: >-
      Confirms that B3GAT3 disease sits outside the spEDS nosologic bucket despite the
      shared mechanism — the key positioning statement for this entry.
  - reference: PMID:31438591
    reference_title: "Further Defining the Phenotypic Spectrum of B3GAT3 Mutations and Literature Review on Linkeropathy Syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Platyspondyly, a hallmark of “spondylo”-dysplasia, has never been recognized in
      B4GALT7-spEDS and B3GAT3-related disorders
    explanation: Provides the platyspondyly discriminator relative to B3GALT6-spEDS.
- name: CHST3-Related Skeletal Dysplasia
  disease_term:
    preferred_term: spondyloepiphyseal dysplasia with congenital joint dislocations
    term:
      id: MONDO:0007738
      label: spondyloepiphyseal dysplasia with congenital joint dislocations
  description: >
    CHST3-related skeletal dysplasia (also called autosomal recessive Larsen
    syndrome, or humero-spinal dysostosis) is the closest recessive phenocopy:
    congenital large-joint dislocations, short stature and clubfoot in an
    autosomal recessive glycosaminoglycan-pathway disorder.
  distinguishing_features:
  - CHST3 encodes carbohydrate sulfotransferase 3 (C6ST-1), which 6-O-sulfates
    already-polymerized chondroitin — a downstream chain-modification step, not the
    shared tetrasaccharide linker that B3GAT3 completes, so heparan sulfate
    synthesis is spared.
  - CHST3 disease is dominated by progressive spinal and epiphyseal involvement and
    does not carry the B3GAT3 pattern of radioulnar synostosis with congenital
    cardiac valve and great-vessel malformation.
  evidence:
  - reference: PMID:31438591
    reference_title: "Further Defining the Phenotypic Spectrum of B3GAT3 Mutations and Literature Review on Linkeropathy Syndromes."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The linker region is completed by the transfer of glucuronic acid (GlcA)
      catalyzed by glucuronosyltransferase I (GlcAT-I encoded by B3GAT3), upon which
      polymerization of the HS or CS/DS chains begins.
    explanation: >-
      Establishes that B3GAT3 acts at the shared linker step upstream of chain
      polymerization and its sulfotransferase modifications — the mechanistic boundary
      distinguishing it from a CHST3 chain-sulfation defect. Supports the mechanism
      contrast only; the clinical CHST3 comparison is not asserted from this source.
- name: Antley-Bixler Syndrome
  disease_term:
    preferred_term: Antley-Bixler syndrome
    term:
      id: MONDO:0008803
      label: Antley-Bixler syndrome
  description: >
    The prenatal combination of craniosynostosis with radiohumeral or radioulnar
    synostosis is the classic Antley-Bixler presentation and is exactly what the
    severe p.Gly223Ser B3GAT3 genotype mimics.
  distinguishing_features:
  - Antley-Bixler syndrome is caused by FGFR2 or POR variants; the severe B3GAT3
    patients were negative for the known Antley-Bixler genes.
  - B3GAT3 patients additionally show multiple neonatal fractures, joint
    dislocations and cardiovascular abnormalities.
  evidence:
  - reference: PMID:28771243
    reference_title: "B3GAT3-related disorder with craniosynostosis and bone fragility due to a unique mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This syndrome should be considered in the prenatal period in light of
      the severe outcome and as an alternative diagnosis to Antley-Bixler or
      Shprintzen-Goldberg syndrome.
    explanation: >-
      Explicitly recommends B3GAT3 disease as a prenatal alternative diagnosis to
      Antley-Bixler and Shprintzen-Goldberg syndromes.
  - reference: PMID:28771243
    reference_title: "B3GAT3-related disorder with craniosynostosis and bone fragility due to a unique mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we report on six patients from four unrelated consanguineous
      families in whom Antley-Bixler syndrome was suspected during the prenatal period
      without mutation in genes known to be associated with the
      syndrome.
    explanation: >-
      Documents that the B3GAT3 patients were negative for the known Antley-Bixler
      genes.
- name: Shprintzen-Goldberg Syndrome
  disease_term:
    preferred_term: Shprintzen-Goldberg syndrome
    term:
      id: MONDO:0008426
      label: Shprintzen-Goldberg syndrome
  description: >
    Postnatally the association of craniosynostosis with arachnodactyly and a
    Marfanoid habitus suggests Shprintzen-Goldberg syndrome; at least one B3GAT3
    patient carried that clinical label for years before molecular diagnosis.
  distinguishing_features:
  - Shprintzen-Goldberg syndrome characteristically includes intellectual
    disability and brain anomalies, both absent in the B3GAT3 patient who had been
    misdiagnosed as SGS.
  evidence:
  - reference: PMID:31438591
    reference_title: "Further Defining the Phenotypic Spectrum of B3GAT3 Mutations and Literature Review on Linkeropathy Syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Interestingly, our patient received a diagnosis of SGS in infancy, though there
      was the absence of several cardinal features, above all intellectual disability
      and brain abnormalities.
    explanation: >-
      Documents the SGS misdiagnosis and the absent cardinal SGS features that
      distinguish it.
- name: Marfan Syndrome
  disease_term:
    preferred_term: Marfan syndrome
    term:
      id: MONDO:0007947
      label: Marfan syndrome
  description: >
    Arachnodactyly with aortic root dilatation in an infant readily suggests Marfan
    syndrome, and a B3GAT3 patient was so labelled at birth.
  distinguishing_features:
  - Marfan syndrome is autosomal dominant and FBN1-related, with tall stature and
    ectopia lentis.
  - B3GAT3 patients have short stature, congenital joint dislocations, radioulnar
    synostosis and reduced bone mineral density.
  evidence:
  - reference: PMID:35151321
    reference_title: "Severe phenotypes of B3GAT3-related disorder caused by two heterozygous variants: a case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report for the first time two heterozygous
      variants of B3GAT3 in a Chinese infant, in whom Marfan syndrome was suspected at
      birth.
    explanation: Documents the Marfan misdiagnosis that molecular testing corrected.
- name: Geroderma Osteodysplastica
  disease_term:
    preferred_term: geroderma osteodysplastica
    term:
      id: MONDO:0009271
      label: geroderma osteodysplastica
  description: >
    A geroderma osteodysplastica-like presentation with cutis laxa, generalized
    osteoporosis with fractures and spondyloepimetaphyseal dysplasia has been
    reported with the homozygous B3GAT3 p.Pro82Leu allele.
  distinguishing_features:
  - Geroderma osteodysplastica proper is caused by GORAB variants; the B3GAT3
    phenocopy is distinguished molecularly rather than clinically.
  evidence:
  - reference: PMID:31438591
    reference_title: "Further Defining the Phenotypic Spectrum of B3GAT3 Mutations and Literature Review on Linkeropathy Syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      reported a GO–like syndrome in a patient carrying the
      homozygous c.245C>T, p.(Pro82Leu) missense variant in the donor substrate binding
      subdomain of the protein.
    explanation: Documents the geroderma osteodysplastica-like B3GAT3 presentation.
treatments:
- name: Orthopedic and Spinal Surgery
  description: >
    Management is entirely supportive; no disease-modifying therapy exists. Severe
    progressive kyphoscoliosis has been managed with preoperative halo-gravity
    traction followed by posterior instrumentation and spinal fusion. Joint
    dislocations, foot deformity and cervical instability are addressed by
    conventional orthopedic means, with the caveat that surgical results are often
    unsatisfactory in this connective tissue context.
  treatment_term:
    preferred_term: orthopedic surgical procedure
    term:
      id: NCIT:C16186
      label: Orthopedic Surgical Procedure
  therapeutic_modality: SURGERY
  target_phenotypes:
  - preferred_term: Kyphoscoliosis
    term:
      id: HP:0002751
      label: Kyphoscoliosis
  evidence:
  - reference: PMID:39359951
    reference_title: "A Recurrent c.416C>T Variant in the B3GAT3 Gene in the Turkish Population: Report of Two Siblings and Expanding the Clinical Spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The boy underwent preoperative halo-gravity
      traction for severe kyphoscoliosis, followed by posterior instrumentation and
      fusion surgery without complications.
    explanation: Documents the spinal surgical approach used and its uncomplicated outcome.
- name: Bisphosphonate Therapy for Low Bone Mineral Density
  description: >
    Bisphosphonates have been used for the osteopenia/osteoporosis of B3GAT3
    disease, but the reported outcomes are equivocal — one patient remained severely
    osteopenic with delayed bone age despite treatment. Evidence is anecdotal and no
    controlled data exist.
  treatment_term:
    preferred_term: bisphosphonate pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  therapeutic_modality: SMALL_MOLECULE
  target_phenotypes:
  - preferred_term: Osteopenia
    term:
      id: HP:0000938
      label: Osteopenia
  evidence:
  - reference: PMID:31438591
    reference_title: "Further Defining the Phenotypic Spectrum of B3GAT3 Mutations and Literature Review on Linkeropathy Syndromes."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      DEXA confirmed severe osteopenia and delayed bone age despite bisphosphonates
      treatment; no fractures were reported.
    explanation: >-
      Documents bisphosphonate use but with persistent severe osteopenia, so support
      for benefit is only partial.
- name: Cardiovascular Surveillance and Surgical Repair
  description: >
    Lifelong echocardiographic surveillance for valve disease and progressive aortic
    root/ascending aortic dilatation is warranted given the early onset reported
    (from two months of age), with surgical closure of haemodynamically significant
    septal defects. One reported patient required surgical ASD closure after
    developing tachyarrhythmia and pulmonary hypertension.
  treatment_term:
    preferred_term: cardiac surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  therapeutic_modality: SURGERY
  target_phenotypes:
  - preferred_term: Ventricular septal defect
    term:
      id: HP:0001629
      label: Ventricular septal defect
  - preferred_term: Aortic root dilatation
    term:
      id: HP:0002616
      label: Aortic root aneurysm
  evidence:
  - reference: PMID:31438591
    reference_title: "Further Defining the Phenotypic Spectrum of B3GAT3 Mutations and Literature Review on Linkeropathy Syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At the age of two, a heart ultrasound revealed an atrial septal defect, which was
      surgically treated three years later due to tachyarrhythmia and pulmonary
      hypertension.
    explanation: Documents surgical repair of a septal defect prompted by complications.
- name: Genetic Counseling
  description: >
    Autosomal recessive inheritance implies a 25% recurrence risk for siblings.
    Counseling is particularly relevant given the high proportion of consanguineous
    families, the availability of recurrent founder alleles for targeted testing
    (p.Arg277Gln in the United Arab Emirates, p.Thr139Met in Turkey, p.Pro140Leu on
    Nias), and the prenatal detectability of the severe craniosynostosis/synostosis
    phenotype on ultrasound.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:34537402
    reference_title: "B3GAT3-related linkeropathy and an in-frame homozygous deletion in an adult patient."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both unaffected parents (double second cousins) were shown to be
      heterozygous carriers.
    explanation: >-
      Confirms carrier status of consanguineous parents, the basis for recurrence-risk
      counseling.
animal_models:
- species: Danio rerio (zebrafish)
  genotype: b3gat3 mutant
  category: Skeletal
  genes:
  - preferred_term: B3GAT3
    term:
      id: hgnc:923
      label: B3GAT3
  description: >
    The b3gat3 zebrafish mutant is the only well-characterized animal model of
    GlcAT-I deficiency. It develops abnormal pharyngeal cartilage morphology with
    failure of pericellular extracellular matrix formation around chondrocytes,
    recapitulating the cartilage arm of the human disease. Biochemically the model
    is informative but not a straightforward mirror of the human data: chondroitin
    sulfate biosynthesis is virtually abolished while about half of normal heparan
    sulfate output persists, whereas human patient fibroblasts show a more balanced
    reduction across dermatan, chondroitin and heparan sulfate proteoglycans. The
    model has not been reported to reproduce the human cardiac valve and
    great-vessel malformations.
  evidence:
  - reference: PMID:22869369
    reference_title: "On the roles and regulation of chondroitin sulfate and heparan sulfate in zebrafish pharyngeal cartilage morphogenesis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      uxs1 and b3gat3 mutants, predicted to have
      impaired biosynthesis of both HS and CS because of defective formation of the
      common proteoglycan linkage tetrasaccharide were analyzed
    explanation: >-
      Identifies the zebrafish b3gat3 mutant as a linker-region-deficient model
      matching the human molecular lesion.
  - reference: PMID:22869369
    reference_title: "On the roles and regulation of chondroitin sulfate and heparan sulfate in zebrafish pharyngeal cartilage morphogenesis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      impaired CS biosynthesis inhibited formation of the extracellular matrix
      surrounding chondrocytes.
    explanation: >-
      Provides the cartilage-specific mechanistic readout — loss of pericellular
      extracellular matrix around chondrocytes.
discussions:
- discussion_id: b3gat3_cardiac_tissue_specificity
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does the tissue-specific expression level of B3GAT3 relative to the other
    linker enzymes explain why cardiac malformation is characteristic of
    B3GAT3-related disease but not of B4GALT7/B3GALT6 spondylodysplastic EDS?
  attaches_to:
  - pathophysiology#Impaired Cardiac Valve and Great Vessel Development
  rationale: >-
    The leading explanation for the cardiac specificity is that B3GAT3 is expressed
    more highly in heart than B3GALT6 and B4GALT7, so heart tissue is
    disproportionately sensitive to loss of this particular linker step. An
    alternative model holds that the linker enzymes act within a shared complex (a
    "GAGosome"), which would predict comparable rather than differential tissue
    sensitivity. Neither model has been tested directly in cardiac tissue, and the
    observation that the donor-subdomain p.Pro140Leu family had no cardiac phenotype
    at all suggests residual activity thresholds may matter as much as expression
    level.
  proposed_experiments:
  - experiment_id: linker_enzyme_expression_map
    name: Comparative linker-enzyme expression and activity mapping
    description: >-
      Quantify B3GAT3, B4GALT7 and B3GALT6 expression and GlcAT-I / GalT-I / GalT-II
      activity across human developing cardiac valve, aortic media, cartilage and
      bone to test whether cardiac tissue is disproportionately B3GAT3-dependent.
  - experiment_id: tissue_resolved_gag_quantification
    name: Tissue-resolved GAG quantification in linker-enzyme-deficient models
    description: >-
      Measure heparan and chondroitin/dermatan sulfate content in cardiac valve
      tissue from B3GAT3-deficient versus B4GALT7-deficient models to test
      differential tissue sensitivity.
  - experiment_id: glcat1_allelic_series_threshold
    name: Allelic-series threshold test in a vertebrate model
    description: >-
      Establish an allelic series (null, p.Gly223Ser, p.Pro140Leu) in a vertebrate
      model and test whether cardiac cushion phenotypes track residual GlcAT-I
      activity thresholds rather than pathway identity.
- discussion_id: linkeropathy_nosology_boundary
  kind: KNOWLEDGE_GAP
  prompt: >-
    Should B3GAT3-related disease remain a separate nosologic entity, or be merged
    into a single gene-prefixed "linkeropathy" spectrum alongside XYLT1/XYLT2,
    B4GALT7 and B3GALT6 disorders?
  attaches_to:
  - pathophysiology#Incomplete GAG-Protein Tetrasaccharide Linker Assembly
  rationale: >-
    All five linker enzymes act sequentially on the same tetrasaccharide and produce
    overlapping phenotypes, yet the 2017 EDS nosology admits only B4GALT7 and
    B3GALT6 (as spEDS) and leaves B3GAT3, XYLT1 and XYLT2 outside. The comprehensive
    2019 review argues these are a phenotypic continuum and proposes gene-prefixed
    "linkeropathy" naming. dismech currently follows MONDO and keeps this entry
    separate from Spondylodysplastic Ehlers-Danlos Syndrome; a linkeropathy Grouping
    would be the natural way to represent the union without collapsing the entities.
  proposed_experiments:
  - experiment_id: cross_gene_linkeropathy_phenotyping
    name: Cross-gene linkeropathy deep phenotyping cohort
    description: >-
      Systematically phenotype a multi-gene linkeropathy cohort with a common
      instrument to test whether gene identity or residual enzyme activity better
      predicts the clinical profile.
  - experiment_id: linkeropathy_grouping_curation
    name: Curate a dismech linkeropathy Grouping
    description: >-
      Build a dismech Grouping over the linkeropathy entries with explicit
      membership criteria so the boundary between spEDS and the non-spEDS
      linkeropathies is auditable.
- discussion_id: b3gat3_zebrafish_cs_hs_asymmetry
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Does the zebrafish b3gat3 mutant's near-complete loss of chondroitin sulfate with
    retained heparan sulfate reflect human GlcAT-I deficiency, where patient
    fibroblasts show a more balanced reduction of dermatan, chondroitin and heparan
    sulfate proteoglycans?
  attaches_to:
  - pathophysiology#Combined Heparan and Chondroitin/Dermatan Sulfate Proteoglycan Deficiency
  rationale: >-
    Both systems block the same shared linker step, so a priori both GAG arms should
    fall together — and that is what human fibroblast measurements show. The
    zebrafish model instead shows CS virtually abolished with ~50% of HS retained,
    implying a species- or context-dependent prioritization of HS over CS when linker
    flux is limiting. This matters mechanistically: if the human disease also
    preferentially spares HS, then the skeletal/cartilage phenotype (CS-dependent
    pericellular matrix) should dominate over HS-dependent morphogen-signalling
    phenotypes, which is broadly what is observed clinically. The mismatch is
    unresolved because the human data are semi-quantitative and come from fibroblasts
    rather than cartilage or cardiac tissue.
  proposed_experiments:
  - experiment_id: human_cs_hs_ratio_disease_tissue
    name: Quantitative CS/HS ratio in human B3GAT3 patient tissue
    description: >-
      Measure absolute chondroitin/dermatan sulfate and heparan sulfate chain
      abundance in patient-derived chondrocytes and iPSC-derived cardiac cells, not
      only dermal fibroblasts, to test whether the zebrafish CS-over-HS asymmetry
      holds in human disease-relevant cell types.
  - experiment_id: humanized_allele_zebrafish_rescue
    name: Humanized allele rescue in the zebrafish model
    description: >-
      Test whether human B3GAT3 disease alleles rescue the zebrafish b3gat3 cartilage
      phenotype in an allele-strength-dependent manner, and whether rescue restores
      chondroitin and heparan sulfate proportionately.
notes: >
  Naming decision: the entry is titled "Larsen-like Syndrome B3GAT3 Type" to match
  the canonical MONDO:0009511 label and the curation issue, with "B3GAT3-related
  linkeropathy" / "B3GAT3-related disorder" and the OMIM/Orphanet descriptive name
  (JDSCD) carried as synonyms. The literature is split — Ritelli et al.
  (PMID:31438591) argue for gene-prefixed linkeropathy naming — but MONDO alignment
  is the governing convention here and the eponymic name remains the one most
  readers will search for.

  Scope boundaries. This entry deliberately does NOT cover: (a) classic Larsen
  syndrome, the dominant FLNB disorder curated separately as Larsen_Syndrome
  (MONDO:0007875); (b) the B4GALT7/B3GALT6/SLC39A13 spondylodysplastic Ehlers-Danlos
  syndromes, curated separately as Spondylodysplastic_Ehlers-Danlos_Syndrome
  (MONDO:0007526); or (c) CHST3-related skeletal dysplasia (MONDO:0007738), a
  downstream chondroitin 6-O-sulfotransferase defect rather than a linker-region
  defect. All three are captured as differential diagnoses instead.

  Not curated for lack of verifiable evidence: (i) PMID:29318063 reports short
  stature, growth hormone deficiency and ketotic hypoglycaemia with a
  *heterozygous* B3GAT3 splice variant; because the disorder is autosomal recessive
  and the report does not establish a second allele, that case is not used to
  support disease phenotypes here. (ii) Quantitative GAG figures surfaced by the
  Edison deep-research run (GlcAT-I activity ~3-5% of control; CS ~65% and HS ~53%
  of control in p.Arg277Gln fibroblasts) come from the body of PMID:21763480, which
  is cached abstract-only, so they could not be snippet-verified and are not
  asserted. (iii) Numeric phenotype frequencies are unavailable for most features —
  the cumulative published cohort is ~26 patients — so `frequency:` is populated
  only where a source states a qualitative frequency ("ubiquitous", "very common",
  "high rate of incidence", "present only in some patients") that maps cleanly onto
  the enum, and omitted elsewhere. (iv) No prevalence rate is asserted; the
  Prevalence record uses CASES_IN_LITERATURE with the published case count.
  (v) There is no GeneReviews chapter for B3GAT3 or for Larsen-like syndrome
  B3GAT3 type (PubMed search for "B3GAT3 GeneReviews" returned no results), so the
  GeneReviews phenotype-baseline step could not be applied.

  Deep research: Edison (falcon) run at
  research/Larsen-like_Syndrome_B3GAT3_Type-deep-research-falcon.md. Its report
  independently confirmed MONDO:0009511 / OMIM 245600 / B3GAT3 (NEC preflight
  passed) and contributed the zebrafish b3gat3 model lead (PMID:22869369) and the
  CHST3 differential. Every PMID it cited was independently fetched and every
  snippet used here was verified against the cached abstract.

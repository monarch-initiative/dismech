name: Larsen-like Syndrome B3GAT3 Type
creation_date: '2026-08-01T00:00:00Z'
category: Mendelian
description: >
  Larsen-like syndrome, B3GAT3 type — also called multiple joint dislocations,
  short stature, craniofacial dysmorphism, with or without congenital heart
  defects (JDSCD), and increasingly in the literature "B3GAT3-related
  linkeropathy" — is an ultra-rare autosomal recessive multisystem connective
  tissue and skeletal disorder caused by biallelic loss-of-function variants in
  B3GAT3. B3GAT3 encodes glucuronosyltransferase-I (GlcAT-I), the Golgi enzyme
  that transfers the terminal glucuronic acid onto the Gal-Gal-Xyl trisaccharide
  to complete the tetrasaccharide linker region common to all
  glycosaminoglycan-bearing proteoglycans. Because this linker is shared, GlcAT-I
  deficiency simultaneously blocks initiation of heparan sulfate and of
  chondroitin/dermatan sulfate chains, making the disorder a "linkeropathy"
  alongside the XYLT1, XYLT2, B4GALT7 and B3GALT6 disorders. The resulting
  proteoglycan-poor extracellular matrix produces congenital large-joint
  dislocations and contractures, short stature, radioulnar synostosis, reduced
  bone mineral density with fractures in severe cases, characteristic craniofacial
  dysmorphism, and — distinctively among the linkeropathies — congenital cardiac
  valve and great-vessel malformations (bicuspid aortic valve, septal defects,
  mitral valve prolapse, aortic root dilatation). Severity ranges from a mild
  Larsen-like presentation to perinatally lethal disease with craniosynostosis
  and multiple fractures, and correlates in part with whether the variant falls
  in the donor- or acceptor-substrate-binding subdomain of GlcAT-I.
synonyms:
- multiple joint dislocations, short stature, craniofacial dysmorphism, with or
  without congenital heart defects
- JDSCD
- B3GAT3-related linkeropathy
- B3GAT3-related disorder
- GlcAT-I deficiency
- Larsen syndrome, autosomal recessive

      label: skin fibroblast
  evidence:
  - reference: PMID:21763480
    reference_title: "Faulty initiation of proteoglycan synthesis causes cardiac and joint defects."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Patient fibroblasts demonstrated decreased levels of dermatan sulfate,
      chondroitin sulfate, and heparan sulfate proteoglycans, indicating that the
      defect in linker synthesis affected all three lines of O-glycanated
      proteoglycans.
    explanation: >-
      Direct patient-cell measurement of the combined DS/CS/HS proteoglycan
      deficiency.
  - reference: PMID:25893793
    reference_title: "Skeletal dysplasia in a consanguineous clan from the island of Nias/Indonesia is caused by a novel mutation in B3GAT3."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Moreover, relative numbers of glycosaminoglycan (GAG) side chains were
      decreased in patient cells.
    explanation: Independent confirmation of reduced GAG side-chain occupancy in patient cells.
  - reference: PMID:22869369
    reference_title: "On the roles and regulation of chondroitin sulfate and heparan sulfate in zebrafish pharyngeal cartilage morphogenesis."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In uxs1 and b3gat3 mutant larvae,
      biosynthesis of CS was shown to be virtually abolished, whereas these mutants
      still were capable of synthesizing 50% of the HS produced in control larvae.
    explanation: >-
      Zebrafish b3gat3 mutants show a markedly asymmetric CS-versus-HS deficit,
      qualifying (rather than simply confirming) the balanced reduction inferred
      from human fibroblasts.
  downstream:
  - target: Proteoglycan-Deficient Extracellular Matrix
    description: >
      Loss of GAG-bearing proteoglycans changes the composition and mechanical
      behaviour of the extracellular matrix in connective tissue.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:24668659
      reference_title: "Skeletal dysplasia, global developmental delay, and multiple congenital anomalies in a 5-year-old boy-report of the second family with B3GAT3 mutation and expansion of the phenotype."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        As a major component of the extracellular matrix, proteoglycans influence the
        mechanical properties of connective tissue and play an important role in
        cell-cell and cell-matrix interactions.
      explanation: >-
        Links proteoglycan loss to altered mechanical and adhesive properties of
        connective tissue matrix.
    - reference: PMID:22869369
      reference_title: "On the roles and regulation of chondroitin sulfate and heparan sulfate in zebrafish pharyngeal cartilage morphogenesis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        impaired CS biosynthesis inhibited formation of the extracellular matrix
        surrounding chondrocytes.
      explanation: >-
        Establishes the causal step from GAG deficiency to failure of pericellular

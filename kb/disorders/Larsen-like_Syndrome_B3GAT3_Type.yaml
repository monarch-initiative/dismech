inheritance:
- name: Autosomal Recessive
  description: >
    Biallelic (homozygous or compound heterozygous) pathogenic B3GAT3 variants
    are required. Most reported families are consanguineous and homozygous for a
    founder or private missense allele; compound heterozygosity, including a null
    allele in trans with a hypomorphic missense, has also been documented.
    Heterozygous carrier parents are unaffected.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:34537402
    reference_title: "B3GAT3-related linkeropathy and an in-frame homozygous deletion in an adult patient."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Biallelic pathogenic variants in B3GAT3 hence lead to Linkeropathy due to
      loss of function or decreased activity of this enzyme.
    explanation: States explicitly that biallelic variants are required.
  - reference: PMID:34537402
    reference_title: "B3GAT3-related linkeropathy and an in-frame homozygous deletion in an adult patient."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both unaffected parents (double second cousins) were shown to be
      heterozygous carriers.
    explanation: >-
      Documents unaffected heterozygous carrier parents, the defining pattern of
      autosomal recessive inheritance.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Only 26 molecularly confirmed patients from 13 families had been reported in
    the literature as of the 2019 comprehensive review; a handful of further
    cases have since been published (e.g. a Chinese infant in 2022 and two Turkish
    siblings in 2024). No population prevalence estimate exists.
  evidence:
  - reference: PMID:31438591
    reference_title: "Further Defining the Phenotypic Spectrum of B3GAT3 Mutations and Literature Review on Linkeropathy Syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Table 2 summarizes the clinical features of the 26 patients from 13
      different families, 11 of which were consanguineous with B3GAT3 mutations
      reported so far
    explanation: >-
      Provides the cumulative published case count, supporting an ultra-rare
      cases-in-literature occurrence measure rather than a population rate.
genetic:
- name: B3GAT3
  notes: >
    B3GAT3 (11q12.3) encodes beta-1,3-glucuronyltransferase 3 /
    glucuronosyltransferase-I (GlcAT-I), a cis- and cis-medial Golgi enzyme that
    transfers UDP-glucuronic acid onto the Gal-Gal-Xyl-Ser trisaccharide,
    completing the tetrasaccharide linker that all glycosaminoglycan chains are
    built upon. Reported disease alleles are predominantly missense substitutions
    in the glycosyltransferase catalytic domain (p.Arg277Gln — the original United
    Arab Emirates founder allele; p.Pro140Leu in the Nias/Indonesia clan;
    p.Gly223Ser in the severe craniosynostosis/fracture phenotype; p.Thr139Met
    recurrent in the Turkish population; p.Pro82Leu in a geroderma-like case;
    p.Arg161Trp and p.Arg297Trp in a compound heterozygote), together with a
    start-loss null allele (p.Met1?), a missense p.Leu224Gln with ~3% residual
    activity, and an in-frame p.Leu21del.
  gene_term:
    preferred_term: B3GAT3
    term:
      id: hgnc:923
      label: B3GAT3
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:21763480
    reference_title: "Faulty initiation of proteoglycan synthesis causes cardiac and joint defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

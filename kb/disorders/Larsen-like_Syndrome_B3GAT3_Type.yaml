    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We studied five patients with recessive joint dislocations
      and congenital heart defects, including bicuspid aortic valve (BAV) and aortic
      root dilatation.
    explanation: All five patients in the founding cohort had joint dislocations.
  - reference: PMID:31438591
    reference_title: "Further Defining the Phenotypic Spectrum of B3GAT3 Mutations and Literature Review on Linkeropathy Syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The phenotypic features with a high rate of incidence shared among all LKs
      include short stature, joint laxity with dislocations, craniofacial dysmorphism
      (especially prominent forehead/eyes and blue sclerae), pectus abnormalities,
      peculiar fingers, foot deformities, and to a variable degree hypotonia and
      developmental delay.

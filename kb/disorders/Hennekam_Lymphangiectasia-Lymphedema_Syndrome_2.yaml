inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    HKLLS2 is inherited in an autosomal recessive manner; affected individuals
    carry biallelic (homozygous or compound heterozygous) FAT4 mutations,
    frequently with parental consanguinity.
  evidence:
  - reference: PMID:24913602
    reference_title: Hennekam syndrome can be caused by FAT4 mutations and be allelic to Van Maldergem syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Subsequent targeted mutation analysis of FAT4 in a cohort of 24 CCBE1
      mutation-negative Hennekam syndrome patients identified homozygous or
      compound heterozygous mutations in four additional families.
    explanation: >-
      Homozygous and compound heterozygous FAT4 genotypes establish autosomal
      recessive inheritance for HKLLS2.
pathophysiology:
- name: FAT4 loss of function
  biological_scale: MOLECULAR
  description: >-
    Biallelic loss-of-function mutations in FAT4, a giant atypical
    protocadherin, disrupt Dachsous1-FAT4 planar cell polarity signaling (with
    context-dependent Hippo-pathway involvement) required for normal lymphatic
    development.
  genes:
  - preferred_term: FAT4
    term:
      id: hgnc:23109
      label: FAT4
  evidence:
  - reference: PMID:24913602
    reference_title: Hennekam syndrome can be caused by FAT4 mutations and be allelic to Van Maldergem syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We used homozygosity mapping and whole-exome sequencing in the original HS
      family with multiple affected individuals in whom no CCBE1 mutation had
      been detected, and identified a homozygous mutation in the FAT4 gene.
    explanation: >-
      Identifies FAT4 as a causal Hennekam syndrome gene, discovered in the
      original Hennekam family.
  - reference: PMID:36797229
    reference_title: Structure of the planar cell polarity cadherins Fat4 and Dachsous1.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The binding domains of Fat4 and Dchs1 form an extended interface along
      extracellular cadherin (EC) domains 1-4 of each protein.
    explanation: >-
      The FAT4-DCHS1 co-crystal structure defines the molecular basis of the
      receptor-ligand pair whose disruption underlies HKLLS2.
  downstream:
  - target: Impaired lymphatic valve morphogenesis
    description: >-
      FAT4, with its ligand Dachsous1, controls planar cell polarity of valve
      endothelial cells; loss disrupts lymphatic valve leaflet formation.
    evidence:
    - reference: PMID:28705793
      reference_title: Dachsous1-Fat4 Signaling Controls Endothelial Cell Polarization During Lymphatic Valve Morphogenesis-Brief Report.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        both genes are specifically required for lymphatic valve morphogenesis
      explanation: >-
        Mouse data show Fat4 (with Dachsous1) is required for valve endothelial
        cell polarization and valve leaflet formation.
- name: Impaired lymphatic valve morphogenesis
  biological_scale: CELLULAR
  description: >-
    Disrupted FAT4-dependent planar cell polarity leaves lymphatic valve
    endothelial cells disoriented and unable to form proper valve leaflets,
    impairing lymphatic drainage.
  cell_types:
  - preferred_term: lymphatic endothelial cell
    term:
      id: CL:0002138
      label: endothelial cell of lymphatic vessel
  genes:
  - preferred_term: DCHS1
    term:
      id: hgnc:13681
      label: DCHS1
  biological_processes:
  - preferred_term: establishment of planar polarity
    term:
      id: GO:0001736
      label: establishment of planar polarity
  evidence:
  - reference: PMID:28705793
    reference_title: Dachsous1-Fat4 Signaling Controls Endothelial Cell Polarization During Lymphatic Valve Morphogenesis-Brief Report.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      This study highlights that valve defects may contribute to lymphedema in
      Hennekam syndrome caused by Fat4 mutations.
    explanation: >-
      Directly links FAT4-dependent lymphatic valve defects to the lymphedema of
      FAT4-related Hennekam syndrome.
  - reference: DOI:10.1172/JCI99027
    reference_title: Atypical cadherin FAT4 orchestrates lymphatic endothelial cell polarity in response to flow.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      control cell polarity in response to flow and is required for lymphatic
      vessel morphogenesis throughout development.
    explanation: >-
      Demonstrates that FAT4 controls lymphatic endothelial cell polarity in
      response to flow and is required for lymphatic vessel morphogenesis, the
      flow-responsive arm of the mechanism.
  downstream:
  - target: Generalized lymphatic dysplasia
    description: >-
      Defective lymphatic valve morphogenesis and drainage produce dysfunctional
      lymphatics.
    causal_link_type: DIRECT
- name: Generalized lymphatic dysplasia
  biological_scale: TISSUE
  description: >-
    Lymphatic dysfunction impairs lymph drainage and underlies the intestinal
    lymphangiectasia and lymphedema of the syndrome.
  cell_types:
  - preferred_term: lymphatic endothelial cell
    term:
      id: CL:0002138
      label: endothelial cell of lymphatic vessel
  evidence:
  - reference: PMID:2624276
    reference_title: Autosomal recessive intestinal lymphangiectasia and lymphedema, with facial anomalies and mental retardation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report on two male and two female relatives with intestinal
      lymphangiectasia; severe lymphedema of limbs, genitalia, and face; facial
      anomalies; seizures; mild growth retardation; and moderate mental
      retardation.
    explanation: >-
      The original Hennekam family, later shown to carry biallelic FAT4
      mutations (PMID:24913602), showed generalized lymphatic involvement
      (intestinal lymphangiectasia plus lymphedema of limbs, genitalia, and
      face).
  downstream:
  - target: Intestinal lymphangiectasia
    description: >-
      Dysplastic intestinal lymphatics dilate and leak lymph into the gut lumen.
    causal_link_type: DIRECT
  - target: Lymphedema
    description: >-

differential_diagnoses:
- name: Van Maldergem syndrome 1
  disease_term:
    preferred_term: Van Maldergem syndrome 1
    term:
      id: MONDO:0011070
      label: van Maldergem syndrome 1
  description: >-
    Van Maldergem syndrome 1 is allelic to HKLLS2 (both caused by biallelic FAT4
    variants) and shares a facial gestalt and intellectual disability, but is
    distinguished by neonatal hypotonia, hearing loss, tracheal anomalies, and
    osteopenia rather than prominent lymphedema.
- name: Hennekam lymphangiectasia-lymphedema syndrome 1
  disease_term:
    preferred_term: Hennekam lymphangiectasia-lymphedema syndrome 1
    term:
      id: MONDO:0009337
      label: Hennekam lymphangiectasia-lymphedema syndrome 1
  description: >-
    CCBE1-related Hennekam syndrome is clinically overlapping and accounts for
    ~25% of cases; it is distinguished from the FAT4-related form by molecular
    testing.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Hennekam syndrome is ultra-rare; by 2018 only about 40 individuals with
    Hennekam syndrome of all molecular subtypes had been reported, with FAT4
    accounting for a subset of CCBE1 mutation-negative cases.

name: Hennekam lymphangiectasia-lymphedema syndrome 2
creation_date: "2026-08-02T00:00:00Z"
description: >-
  Hennekam lymphangiectasia-lymphedema syndrome 2 (HKLLS2) is an autosomal
  recessive generalized lymphatic dysplasia caused by biallelic mutations in
  FAT4. Like the CCBE1-related form, it presents with intestinal
  lymphangiectasia, peripheral and facial lymphedema, a characteristic flat
  facial gestalt, and mild to moderate intellectual disability. FAT4 was
  identified as a Hennekam gene through the original 1989 Hennekam family, in
  whom no CCBE1 mutation was found; it accounts for a subset of CCBE1
  mutation-negative cases. FAT4 is a giant atypical (protocadherin) cadherin
  that partners with Dachsous1 (DCHS1) in planar cell polarity signaling (with
  context-dependent Hippo-pathway crosstalk) to control lymphatic endothelial
  cell polarization and lymphatic valve morphogenesis. Biallelic FAT4 loss is allelic to Van Maldergem syndrome,
  with which HKLLS2 shares a facial gestalt and intellectual disability but which
  is distinguished by neonatal hypotonia, hearing loss, tracheal anomalies, and
  osteopenia rather than prominent lymphedema.
category: Mendelian
parents:
- Hennekam syndrome
- hereditary disease
synonyms:
- FAT4 Hennekam syndrome
- HKLLS2
- Hennekam syndrome type 2

pathophysiology:
- name: DYNC1I2 Biallelic Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Both DYNC1I2 alleles are disrupted: a canonical splice-donor variant
    (homozygous), a nonsense variant, a deletion of the whole gene, or the
    missense variant p.Tyr247Cys, which zebrafish complementation shows to
    attenuate gene function. The splice variant has not been tested on patient
    RNA. The molecular functions bound here are DYNC1I2's GO annotations
    (dynein heavy- and light-chain binding, inferred by phylogeny); the
    intermediate chain's binding activity has not been measured for any
    patient allele.
  molecular_functions:
  - preferred_term: dynein heavy chain binding
    modifier: DECREASED
    term:
      id: GO:0045504
      label: dynein heavy chain binding
  - preferred_term: dynein light chain binding
    modifier: DECREASED
    term:
      id: GO:0045503
      label: dynein light chain binding

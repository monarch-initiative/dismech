- name: Cytoplasmic Dynein-1 Complex Dysfunction
  biological_scale: MOLECULAR
  description: >-
    Cytoplasmic dynein-1 is the minus-end-directed microtubule motor complex
    required for retrograde intracellular cargo transport, mitotic cell division,
    and neurogenesis. Reduced or structurally perturbed DYNC1I2 intermediate
    chain is inferred to impair dynein-1 complex function in dividing neural
    progenitors and developing axons; no direct measurement of dynein motor or
    cargo-transport activity in patient material has been published.

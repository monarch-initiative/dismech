animal_models:
- name: dync1i2a-disrupted zebrafish
  species: Zebrafish
  genotype: F0 CRISPR-Cas9 disruption or morpholino suppression of dync1i2a
  publication: PMID:31079899
  description: >-
    Larvae show reduced head and optic tectum size, reduced dorsal midline
    commissural axon crossing, and altered craniofacial cartilage patterning, all
    rescued by wild-type human DYNC1I2 mRNA. Complementation with human DYNC1I2
    mRNA shows that p.Tyr247Cys fails to rescue similarly to p.Gln290Ter.
  modeled_mechanisms:
  - target: Abnormal Mitotic Spindle Morphology
    relationship: PARTIALLY_RECAPITULATES
    fidelity: UNKNOWN
    model_scale: CELLULAR
    description: Abnormal prophase and metaphase mitotic spindles in dync1i2a-deficient embryos.
    limitations: >-
      Transient morpholino knockdown and mosaic F0 CRISPR rather than a stable
      germline mutant. The spindle defect has not been examined in human patient
      cells, so fidelity to human cortical progenitors remains unknown.
    evidence:
    - reference: PMID:31079899
      reference_title: "Bi-allelic Variants in DYNC1I2 Cause Syndromic Microcephaly with Intellectual Disability, Cerebral Malformations, and Dysmorphic Facial Features."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We observed a significantly greater number of cells with abnormal spindle morphology in morphants versus controls in prophase and metaphase, but nominal differences in anaphase cells (n = 33–42 cells/condition; Figures 4D and 4E)."
      explanation: Confocal imaging demonstrates early mitotic spindle disorganization in dync1i2a morphants.
  - target: Increased Apoptosis in the Developing Head
    relationship: PARTIALLY_RECAPITULATES
    fidelity: UNKNOWN
    model_scale: CELLULAR
    description: Increased dorsal forebrain TUNEL-positive apoptosis accompanying reduced head size, rescued by human DYNC1I2 mRNA.
    limitations: >-
      Transient or mosaic disruption; no human neural tissue or patient-derived
      cortical organoids have been studied, so the human counterpart is inferred.
    evidence:
    - reference: PMID:31079899
      reference_title: "Bi-allelic Variants in DYNC1I2 Cause Syndromic Microcephaly with Intellectual Disability, Cerebral Malformations, and Dysmorphic Facial Features."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In dync1i2a morphants, we observed a significant increase in cell death that could be rescued with co-injection of WT human DYNC1I2 mRNA (p < 0.0001, MO versus control; p < 0.01, MO versus MO+WT mRNA; Figures 4A and 4B)."
      explanation: Demonstrates increased forebrain apoptosis rescued by wild-type human DYNC1I2 mRNA.
  - target: Impaired Midline Commissural Axon Tract Organization
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Reduced dorsal midline commissural axon crossing and cranial axonal disorganization rescued by wild-type human DYNC1I2 mRNA.
    limitations: >-
      Zebrafish lack a mammalian neocortex and corpus callosum; intertectal
      dorsal midline commissures model midline axon crossing rather than
      eutherian callosal projection neurons directly.
    evidence:
    - reference: PMID:31079899
      reference_title: "Bi-allelic Variants in DYNC1I2 Cause Syndromic Microcephaly with Intellectual Disability, Cerebral Malformations, and Dysmorphic Facial Features."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We observed a modest but significant reduction in the number of axon tracts crossing the dorsal midline in MO-injected batches (p < 0.0001 versus controls), and this defect could be rescued significantly by the presence of WT mRNA (p < 0.0001 versus MO alone; replicate batches; Figures S7A and S7B)."
      explanation: Models impaired midline commissural axon crossing rescued by human DYNC1I2 mRNA.
  - target: Altered Craniofacial Cartilage Patterning
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    description: Dose-dependent increase in ceratohyal cartilage angle rescued by wild-type human DYNC1I2 mRNA.
    limitations: >-
      Larval pharyngeal cartilage angle is a surrogate craniofacial readout and
      does not map one-to-one onto human facial soft-tissue features.
    evidence:
    - reference: PMID:31079899
      reference_title: "Bi-allelic Variants in DYNC1I2 Cause Syndromic Microcephaly with Intellectual Disability, Cerebral Malformations, and Dysmorphic Facial Features."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The highest dose of e2i2 tested (9 ng) resulted in a 10% reduction in head size (p < 0.0001 versus controls; Figures 3E, 3F, and S3G) and a 30° increase in ceratohyal angle (p < 0.0001 versus controls; Figures 3G, 3H, and S3H)."
      explanation: Quantifies altered craniofacial cartilage patterning in dync1i2a morphants.
discussions:
- discussion_id: nedmiba_brain_malformation_mechanism
  prompt: >-
    How does DYNC1I2 deficiency perturb human radial-glial mitosis, outer
    subventricular zone neurogenesis, neuronal migration, and callosal axon
    guidance in human cortical tissue?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired Cortical Neurogenesis
  - pathophysiology#Impaired Midline Commissural Axon Tract Organization
  rationale: >-
    Experimental mechanistic data come solely from dync1i2a zebrafish models,
    which demonstrate prophase/metaphase spindle abnormalities, G2/M mitotic
    accumulation, forebrain apoptosis, reduced head/optic-tectum size, and
    reduced intertectal midline axon crossing. Zebrafish lack a gyrified
    mammalian neocortex, outer radial glia, and a corpus callosum, and no
    patient-derived cells, iPSC cortical organoids, or human neuropathology have
    been studied to distinguish progenitor depletion from postmitotic neuronal
    migration or callosal axon-guidance defects in humans.
  evidence:
  - reference: PMID:31079899
    reference_title: "Bi-allelic Variants in DYNC1I2 Cause Syndromic Microcephaly with Intellectual Disability, Cerebral Malformations, and Dysmorphic Facial Features."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Further work on in vivo or in vitro DYNC1I2 models will be required to understand the functional link between abnormal spindle organization and cell cycle defects."
    explanation: The defining study explicitly notes the need for further in vivo or in vitro DYNC1I2 models to resolve the cellular mechanism.
notes: >-
  Five patients in three families are published in the defining study
  (PMID:31079899). The 2024 Pakistani cohort report (PMID:39281811) describes a
  family with the same homozygous c.607+1G>A variant, three affected individuals
  in Table 2 (two in the main text), and overlapping authors; it most likely
  represents the 2019 index pedigree rather than an independent family, so it is
  cited as a confirmatory description rather than additional independent cases.
  Population feature frequencies are omitted because the well-characterized
  cohort comprises five individuals. No disease-specific GeneReviews chapter or
  disease-modifying therapy exists; clinical management is supportive alongside
  genetic counseling.

- name: Impaired Midline Commissural Axon Tract Organization
  biological_scale: TISSUE
  description: >-
    Loss of dync1i2a in zebrafish causes marked disorganization of cranial axonal
    patterning and significantly reduces the number of commissural axon tracts
    crossing the dorsal midline (rescued by wild-type human DYNC1I2 mRNA),
    modeling the corpus callosum hypogenesis or near-complete agenesis and
    secondary colpocephaly seen in human patients.

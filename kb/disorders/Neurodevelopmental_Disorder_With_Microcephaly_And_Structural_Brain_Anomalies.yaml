    supports: SUPPORT
    directness: INDIRECT
    quote_role: BACKGROUND
    evidence_source: OTHER
    snippet: "Cargo transport along the cytoplasmic microtubular network is essential for neuronal function, and cytoplasmic dynein-1 is an established molecular motor that is critical for neurogenesis and homeostasis."

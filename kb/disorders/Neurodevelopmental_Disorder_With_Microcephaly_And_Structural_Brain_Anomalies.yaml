pathophysiology:
- name: DYNC1I2 Biallelic Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Both DYNC1I2 alleles are disrupted: a canonical splice-donor variant
    (homozygous), a nonsense variant, a deletion of the whole gene, or the
    missense variant p.Tyr247Cys, which zebrafish complementation shows to
    attenuate gene function similarly to the nonsense allele. Structural modeling
    places Tyr247 on the linker between the N-terminal dimerization helix and the
    WD40 scaffold domain that couples the dynein heavy chain and light roadblock
    chain. The c.607+1G>A splice variant has not been tested on patient RNA. The
    molecular functions bound here (dynein heavy chain binding and dynein light
    chain binding) come from DYNC1I2's GO phylogenetic (IBA) annotations, and
    intermediate-chain subunit binding has not been measured directly for any
    patient allele.

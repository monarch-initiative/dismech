name: Neurodevelopmental Disorder With Microcephaly And Structural Brain Anomalies
creation_date: "2026-10-22T13:25:13Z"
category: Mendelian
parents:
- Syndromic microcephaly
- Neurodevelopmental disorder
synonyms:
- NEDMIBA
- DYNC1I2-related syndromic microcephaly
description: >-
  An autosomal recessive syndromic microcephaly caused by biallelic variants in
  DYNC1I2, which encodes an intermediate chain of the cytoplasmic dynein-1
  motor complex. Five affected individuals from three families have been
  reported: three siblings of a consanguineous Pakistani family homozygous for
  the splice-donor variant c.607+1G>A, and two unrelated individuals carrying
  p.Tyr247Cys in trans with either a 374 kb deletion spanning DYNC1I2 or the
  nonsense variant p.Gln290Ter. The phenotype combines microcephaly,
  intellectual disability, simplified cerebral gyration, corpus callosum
  hypoplasia and dysmorphic facial features. In zebrafish, disrupting the
  ortholog dync1i2a reduces head size and alters craniofacial cartilage
  patterning, with abnormal mitotic spindles, prolonged mitosis and increased
  apoptosis; the patient missense allele attenuates gene function in a
  zebrafish complementation assay. Treatment is supportive.

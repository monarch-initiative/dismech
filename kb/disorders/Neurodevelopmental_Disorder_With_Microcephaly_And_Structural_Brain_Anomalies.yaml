diagnosis:
- name: Exome Sequencing
  description: >-
    Whole-exome sequencing (proband or trio), combined with homozygosity mapping
    and Sanger segregation testing, identified biallelic DYNC1I2 sequence
    variants across all three reported families.
  diagnosis_term:
    preferred_term: exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  results: >-
    Homozygous or compound-heterozygous pathogenic/likely pathogenic sequence
    variants in DYNC1I2.
  evidence:
  - reference: PMID:31079899
    reference_title: "Bi-allelic Variants in DYNC1I2 Cause Syndromic Microcephaly with Intellectual Disability, Cerebral Malformations, and Dysmorphic Facial Features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We performed whole-exome sequencing, homozygosity mapping, and chromosomal microarray studies in five individuals from three independent pedigrees and identified likely-pathogenic variants in DYNC1I2 (Dynein Cytoplasmic 1 Intermediate Chain 2), encoding a component of the cytoplasmic dynein 1 complex."
    explanation: Establishes whole-exome sequencing combined with homozygosity mapping and microarray as the molecular diagnostic workflow.
- name: Chromosomal Microarray Analysis
  description: >-
    Chromosomal microarray analysis detects multi-kilobase copy-number deletions
    encompassing DYNC1I2 on 2q31.1 that can act in trans with a single-nucleotide
    variant.
  diagnosis_term:
    preferred_term: Microarray Analysis
    term:
      id: NCIT:C18477
      label: Microarray Analysis
  results: >-
    Heterozygous 374 kb interstitial 2q31.1 deletion encompassing DYNC1I2 in
    trans with a pathogenic point variant.
  evidence:
  - reference: PMID:31079899
    reference_title: "Bi-allelic Variants in DYNC1I2 Cause Syndromic Microcephaly with Intellectual Disability, Cerebral Malformations, and Dysmorphic Facial Features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Individual II:1 of family 2 underwent a two-tiered clinical genetic analysis consisting of chromosomal microarray analysis (CMA) and whole-exome sequencing. We identified a 374 kb interstitial heterozygous deletion: arr ... 2q31.1(172,318,311–172,692,048)×1."
    explanation: Demonstrates diagnostic utility of chromosomal microarray analysis for detecting DYNC1I2-encompassing deletions.
- name: Brain Magnetic Resonance Imaging
  description: >-
    Brain MRI characterizes the structural malformation spectrum of profound
    microcephaly, simplified cortical gyration, cerebral white-matter hypoplasia,
    corpus callosum hypogenesis or agenesis, colpocephaly, and brainstem
    hypoplasia.
  diagnosis_term:
    preferred_term: Magnetic Resonance Imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  results: >-
    Profound microcephaly with simplified gyral pattern, corpus callosum
    hypogenesis or near-complete agenesis, white-matter hypoplasia, and
    ventricular enlargement/colpocephaly.
  evidence:
  - reference: PMID:31079899
    reference_title: "Bi-allelic Variants in DYNC1I2 Cause Syndromic Microcephaly with Intellectual Disability, Cerebral Malformations, and Dysmorphic Facial Features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All individuals in our cohort present similar clinical features, predominantly microcephaly, developmental delay, facial dysmorphism, and similar brain MRI findings, which include hypoplasia of the white matter, most notably hypogenesis or almost complete agenesis of the corpus callosum (Table 1B), and simplification of cerebral cortical gyration."
    explanation: Summarizes the diagnostic neuroimaging pattern on brain MRI across all imaged patients.

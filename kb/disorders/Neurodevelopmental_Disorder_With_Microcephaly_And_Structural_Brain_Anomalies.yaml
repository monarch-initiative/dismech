discussions:
- discussion_id: nedmiba_brain_malformation_mechanism
  prompt: >-
    How does DYNC1I2 deficiency produce simplified gyration and corpus
    callosum hypoplasia, beyond the cell loss proposed for microcephaly?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - phenotypes#Simplified Gyral Pattern
  - phenotypes#Corpus Callosum Hypoplasia
  - phenotypes#Intellectual Disability
  rationale: >-
    The only mechanistic data come from zebrafish larvae, which show spindle
    defects, apoptosis and reduced head size. No study in human cells or
    tissue has examined cortical folding, neuronal migration or callosal axon
    growth with DYNC1I2 loss, and no patient cells or organoids have been
    studied. The Perplexity report states that the 2019 full text describes
    axon-tract disorganization in dync1i2a morphants; that text is not cached
    here and could not be checked, so these phenotypes are not connected to a
    mechanism in this entry.
  evidence:
  - reference: PMID:31079899
    reference_title: "Bi-allelic Variants in DYNC1I2 Cause Syndromic Microcephaly with Intellectual Disability, Cerebral Malformations, and Dysmorphic Facial Features."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "this finding offers initial insights into the cellular basis of microcephaly"
    explanation: The authors frame their mechanistic data as initial and specific to microcephaly.
notes: >-
  Five patients in three families are published (PMID:31079899). The 2024
  Pakistani cohort report (PMID:39281811) describes a family with the same
  homozygous c.607+1G>A variant, three affected individuals and overlapping
  authors; it is most likely the 2019 index pedigree rather than an independent
  family, so it is cited here as a second description, not as further
  patients. That report's text says two affected individuals while its table
  says three. Its rows for speech delay, delayed walking, spasticity,
  hyperreflexia and seizures come from the table column restating the OMIM
  clinical synopsis, not from its own examination. Feature frequencies are not
  given because the published cohort is five people. No GeneReviews chapter
  exists. Management is supportive.

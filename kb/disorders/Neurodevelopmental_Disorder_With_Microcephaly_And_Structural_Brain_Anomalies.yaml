- name: DYNC1I2
  gene_term:
    preferred_term: DYNC1I2
    term:
      id: hgnc:2964
      label: DYNC1I2
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: PRESENT
  variants:
  - name: NM_001378.2:c.607+1G>A
    type: splice donor
    variant_type: single nucleotide variant
    clinical_significance: PATHOGENIC
    description: Homozygous canonical splice-donor variant in a 96 bp exon conserved across all seven RefSeq transcripts in the consanguineous Pakistani family; splicing effect predicted, not tested on patient RNA.
    evidence:
    - reference: PMID:31079899
      reference_title: "Bi-allelic Variants in DYNC1I2 Cause Syndromic Microcephaly with Intellectual Disability, Cerebral Malformations, and Dysmorphic Facial Features."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We identified a single-nucleotide homozygous splicing variant (GenBank: NM_001378.2:c.607+1G>A) in DYNC1I2 (Figure 2A). We confirmed the variant by segregation analysis in all members of the family via Sanger sequencing (Figure S1A)."
      explanation: Identifies and confirms recessive segregation of homozygous c.607+1G>A in Family 1.
    - reference: PMID:39281811
      reference_title: The genetic cause of neurodevelopmental disorders in 30 consanguineous families.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "DYNC1I2 (AR) | Neurodevelopmental disorder with microcephaly and structural brain anomalies | 618,492 | NM_001378.3 | c.607 + 1G > A; p.? Pathogenic (Class 1)"
      explanation: ACMG Pathogenic (Class 1) classification reported for c.607+1G>A on transcript NM_001378.3.
  - name: c.740A>G (p.Tyr247Cys)
    type: missense
    variant_type: single nucleotide variant
    clinical_significance: PATHOGENIC
    description: >-
      Found in two unrelated individuals, in trans with a 374 kb deletion or
      with p.Gln290Ter; fails to rescue dync1i2a morphant zebrafish phenotypes.
    evidence:
    - reference: PMID:31079899
      reference_title: "Bi-allelic Variants in DYNC1I2 Cause Syndromic Microcephaly with Intellectual Disability, Cerebral Malformations, and Dysmorphic Facial Features."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "However, an examination of the coding regions encompassed by the 2q31.1 interval in the proband exome uncovered a rare heterozygous change, c.740A>G (p.Tyr247Cys), inherited from the mother (MAF = 1.8×10−5 in gnomAD; heterozygous variants were present in four individuals of Ashkenazi Jewish descent)"
      explanation: Documents maternal inheritance and population rarity of c.740A>G (p.Tyr247Cys) in trans with the 2q31.1 deletion.
  - name: c.868C>T (p.Gln290Ter)
    type: nonsense
    variant_type: single nucleotide variant
    clinical_significance: PATHOGENIC
    description: Nonsense variant absent from gnomAD, found in trans with p.Tyr247Cys in Individual II:1 of Family 3.
    evidence:
    - reference: PMID:31079899
      reference_title: "Bi-allelic Variants in DYNC1I2 Cause Syndromic Microcephaly with Intellectual Disability, Cerebral Malformations, and Dysmorphic Facial Features."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "we found bi-allelic variants in DYNC1I2; these variants were the same rare c.740A>G (p.Tyr247Cys) change identified in family 2 and a nonsense variant, c.868C>T (p.Gln290∗) (Figure 2A), that was absent from the gnomAD database."
      explanation: Identifies nonsense variant c.868C>T (p.Gln290Ter) in trans with p.Tyr247Cys in Family 3.

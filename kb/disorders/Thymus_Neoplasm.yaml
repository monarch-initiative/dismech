- name: Neoplastic transformation of thymic epithelium
  biological_scale: CELLULAR
  genetic_context:
    variant_origin: SOMATIC
  description: >-
    The shared origin of the thymic epithelial and neuroendocrine tumor
    families: clonal proliferation of transformed thymic epithelial cells in the
    anterior mediastinum. The downstream biology then diverges by family - the
    organotypic thymoma arm perturbs thymic tolerance, while the carcinoma and
    neuroendocrine arms follow overtly malignant, higher-burden oncogenic
    programs detailed in the dedicated subtype entries.
  cell_types:
  - preferred_term: epithelial cell of thymus
    term:
      id: CL:0002293
      label: epithelial cell of thymus
  biological_processes:
  - preferred_term: epithelial cell proliferation
    modifier: INCREASED
    term:
      id: GO:0050673
      label: epithelial cell proliferation
  locations:
  - preferred_term: thymus
    term:
      id: UBERON:0002370
      label: thymus
  evidence:
  - reference: PMID:38881813
    reference_title: "Insights into molecular aspects and targeted therapy of thymic carcinoma: a narrative review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Thymic carcinomas are rare tumors derived from thymic epithelial cells.
    explanation: >-
      Anchors the thymic epithelial origin shared across the TET families.
  downstream:
  - target: Impaired thymic central tolerance
    description: >-
      In the organotypic thymoma arm, the neoplastic epithelium fails to enforce
      normal negative selection, generating autoreactive T cells.
    evidence:
    - reference: PMID:40983285
      reference_title: "Management of Autoimmune Conditions Associated With Thymic Epithelial Tumors."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        The pathogenesis involves thymic dysfunction leading to impaired T-cell
        development and self-tolerance.
      explanation: >-
        Links the neoplastic thymic epithelium to failure of self-tolerance.
  - target: Anterior mediastinal mass
    description: >-
      Expansion of the transformed thymic epithelium within the prevascular
      compartment produces the anterior mediastinal mass that is the unifying
      clinical presentation across all three thymic neoplasm families.
    evidence:
    - reference: PMID:38264756
      reference_title: "Epidemiology of thymomas and thymic carcinomas in the United States and Germany, 1999-2019."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Among patients aged ≥20 years, TETs accounted for the most prevalent
        anterior mediastinal tumors (US/GER: 63%/64%), followed by lymphomas
        (14%/8%).
      explanation: >-
        Establishes thymic epithelial tumors as the dominant cause of anterior
        mediastinal masses in adults, supporting this causal edge.
- name: Impaired thymic central tolerance
  biological_scale: TISSUE
  description: >-
    The thymoma-defining mechanism: a cortex-dominant, medulla-poor tumor
    microenvironment with loss of the autoimmune regulator (AIRE) generates
    autoreactive effector T cells and underproduces regulatory T cells, allowing
    self-reactive T-cell escape and paraneoplastic autoimmunity. The full causal
    chain (AIRE loss, residual medullary niches, neuromuscular autoantigen
    presentation) is curated in the Thymoma entry.
  cell_types:
  - preferred_term: epithelial cell of thymus
    term:
      id: CL:0002293
      label: epithelial cell of thymus
  - preferred_term: regulatory T cell
    term:
      id: CL:0000815
      label: regulatory T cell
  biological_processes:
  - preferred_term: T cell differentiation in thymus
    modifier: ABNORMAL
    term:
      id: GO:0033077
      label: T cell differentiation in thymus
  locations:
  - preferred_term: thymus
    term:
      id: UBERON:0002370
      label: thymus
  evidence:
  - reference: PMID:18567864
    reference_title: "Common cellular and diverse genetic basis of thymoma-associated myasthenia gravis: role of MHC class II and AIRE genes and genetic polymorphisms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Recently, we also found that expression of the autoimmune regulator
      (AIRE) gene is absent from approximately 95% of thymomas.
    explanation: >-
      Human thymoma profiling supports AIRE loss as the central-tolerance defect
      underlying thymoma autoimmunity.
  downstream:
  - target: Myasthenia gravis
    description: >-
      Autoreactive T-cell escape supports pathogenic neuromuscular autoimmunity,
      the most common thymoma paraneoplastic syndrome.
    evidence:
    - reference: PMID:18567864
      reference_title: "Common cellular and diverse genetic basis of thymoma-associated myasthenia gravis: role of MHC class II and AIRE genes and genetic polymorphisms."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Generation of autoreactive CD4(+) effector T cells and defective
        production of regulatory CD4(+) T cells inside thymomas contribute to the
        development of myasthenia gravis (MG) in >90% of MG(+) thymomas.
      explanation: >-
        Directly asserts the causal contribution of intratumoral tolerance
        failure to myasthenia gravis.
  - target: Pure red cell aplasia
    description: >-
      Immune dysregulation from tolerance failure can suppress erythroid
      precursors.
    evidence:
    - reference: PMID:40983285
      reference_title: "Management of Autoimmune Conditions Associated With Thymic Epithelial Tumors."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Myasthenia gravis is the most common, followed by less frequent but
        notable conditions including pure red cell aplasia, Good's syndrome, and
        various neurologic, dermatologic, and systemic autoimmune disorders.
      explanation: >-
        Places pure red cell aplasia within the same thymic-tolerance-failure
        autoimmune spectrum as myasthenia gravis.
  - target: Good syndrome
    description: >-
      Tolerance failure also underlies the thymoma-associated combined
      immunodeficiency of Good syndrome.
    evidence:
    - reference: PMID:40983285
      reference_title: "Management of Autoimmune Conditions Associated With Thymic Epithelial Tumors."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Myasthenia gravis is the most common, followed by less frequent but
        notable conditions including pure red cell aplasia, Good's syndrome, and
        various neurologic, dermatologic, and systemic autoimmune disorders.
      explanation: >-
        Places Good's syndrome within the same thymic-tolerance-failure
        autoimmune spectrum.
phenotypes:
- category: Clinical
  name: Anterior mediastinal mass
  description: >-
    The unifying clinical presentation of thymic neoplasia: a prevascular
    (anterior) mediastinal mass, often found incidentally or when large enough
    to cause local compressive symptoms.
  phenotype_term:
    preferred_term: Anterior mediastinal mass
    term:
      id: HP:0033827
      label: Anterior mediastinal mass
  evidence:
  - reference: PMID:38264756
    reference_title: "Epidemiology of thymomas and thymic carcinomas in the United States and Germany, 1999-2019."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among patients aged ≥20 years, TETs accounted for the most prevalent
      anterior mediastinal tumors (US/GER: 63%/64%), followed by lymphomas
      (14%/8%).
    explanation: >-
      Thymic epithelial tumors are the most common anterior mediastinal tumor in
      adults, supporting the anterior mediastinal mass presentation.
- category: Neuromuscular
  name: Myasthenia gravis
  description: >-
    The dominant paraneoplastic autoimmune complication of thymoma, reflecting
    failure of central tolerance and neuromuscular autoantigen presentation.
  phenotype_term:
    preferred_term: myasthenia gravis
    term:
      id: MONDO:0009688
      label: myasthenia gravis
  evidence:
  - reference: PMID:40983285
    reference_title: "Management of Autoimmune Conditions Associated With Thymic Epithelial Tumors."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Myasthenia gravis is the most common, followed by less frequent but
      notable conditions including pure red cell aplasia, Good's syndrome, and
      various neurologic, dermatologic, and systemic autoimmune disorders.
    explanation: >-
      Identifies myasthenia gravis as the most common paraneoplastic autoimmune
      syndrome of thymic epithelial tumors.
- category: Hematologic
  name: Pure red cell aplasia
  description: >-
    Paraneoplastic suppression of erythroid precursors, a less common but
    characteristic thymoma-associated autoimmune cytopenia.
  phenotype_term:
    preferred_term: Pure red cell aplasia
    term:
      id: HP:0012410
      label: Pure red cell aplasia
  evidence:
  - reference: PMID:40983285
    reference_title: "Management of Autoimmune Conditions Associated With Thymic Epithelial Tumors."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Myasthenia gravis is the most common, followed by less frequent but
      notable conditions including pure red cell aplasia, Good's syndrome, and
      various neurologic, dermatologic, and systemic autoimmune disorders.
    explanation: >-
      Lists pure red cell aplasia among the notable thymoma-associated
      autoimmune conditions.
- category: Immunologic
  name: Good syndrome
  description: >-
    Thymoma-associated combined immunodeficiency (hypogammaglobulinemia with
    B-cell deficiency), the third classic paraneoplastic syndrome of thymoma
    alongside myasthenia gravis and pure red cell aplasia, predisposing to
    recurrent infections.
  phenotype_term:
    preferred_term: Good syndrome
    term:
      id: MONDO:0015696
      label: Good syndrome
  evidence:
  - reference: PMID:40983285
    reference_title: "Management of Autoimmune Conditions Associated With Thymic Epithelial Tumors."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Myasthenia gravis is the most common, followed by less frequent but
      notable conditions including pure red cell aplasia, Good's syndrome, and
      various neurologic, dermatologic, and systemic autoimmune disorders.
    explanation: >-
      Names Good's syndrome among the notable thymic-epithelial-tumor-associated
      immune conditions.
diagnosis:
- name: Thoracic computed tomography and positron emission tomography imaging
  description: >-
    Contrast-enhanced thoracic CT and FDG-PET imaging evaluate prevascular
    (anterior) mediastinal masses, local invasion of adjacent mediastinal
    structures, and nodal or pleural dissemination across thymic epithelial and
    neuroendocrine tumors.
  diagnosis_term:
    preferred_term: computed tomography
    term:
      id: NCIT:C17204
      label: Computed Tomography
  evidence:
  - reference: PMID:34695605
    reference_title: "The 2021 WHO Classification of Tumors of the Thymus and Mediastinum: What Is New in Thymic Epithelial, Germ Cell, and Mesenchymal Tumors?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Endowed with updated clinical information and state-of-the-art positron
      emission tomography and computed tomography images, the fifth edition of the
      WHO classification of thymic epithelial tumors, germ cell tumors, and
      mesenchymal neoplasms with its wealth of new diagnostic and molecular
      insights will be a valuable source for pathologists, radiologists, surgeons,
      and oncologists alike.
    explanation: >-
      Highlights CT and PET imaging as standard diagnostic modalities integrated
      into the WHO diagnostic evaluation of thymic epithelial tumors.
- name: Histopathologic examination and WHO subtype classification
  description: >-
    Microscopic evaluation of biopsy or thymectomy specimens classifies tumors
    into WHO thymoma histotypes (A, AB, B1, B2, B3), thymic carcinoma subtypes,
    or thymic neuroendocrine neoplasms (typical/atypical carcinoid, large-cell
    neuroendocrine carcinoma, small-cell carcinoma).
  diagnosis_term:
    preferred_term: histopathologic examination
    term:
      id: NCIT:C18190
      label: Histopathologic Examination
  evidence:
  - reference: PMID:25521402
    reference_title: "Development of the international thymic malignancy interest group international database: an unprecedented resource for the study of a rare group of tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      WHO type B2 was the most frequent histologic classification among thymomas,
      whereas squamous was the most common among thymic carcinomas.
    explanation: >-
      Demonstrates WHO histopathologic subtyping across thymomas and thymic
      carcinomas.
  - reference: PMID:35696052
    reference_title: "Thymic neuroendocrine tumors in patients with multiple endocrine neoplasia type 1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      TNET was classified as atypical carcinoid (AC) in five out of six patients.
    explanation: >-
      Demonstrates WHO histopathologic subtyping of thymic neuroendocrine tumors.
- name: Diagnostic immunohistochemistry (KIT, CD5, and PRAME)
  description: >-
    Immunohistochemistry for KIT (CD117), CD5, and PRAME distinguishes thymic
    squamous cell carcinoma (typically positive) from organotypic thymomas
    including type B3 thymoma (typically negative).
  diagnosis_term:
    preferred_term: immunohistochemistry
    term:
      id: NCIT:C23020
      label: Immunohistochemistry Staining Method
  evidence:
  - reference: PMID:32704057
    reference_title: "Preferentially expressed antigen in melanoma as a novel diagnostic marker differentiating thymic squamous cell carcinoma from thymoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      KIT and CD5 were positive in 17 (100%) and 16 (94.1%) TSQCCs, respectively,
      whereas one (0.9%) type B3 thymoma showed double positivity for KIT and CD5.
    explanation: >-
      Quantifies KIT and CD5 immunohistochemical sensitivity and specificity for
      distinguishing thymic squamous cell carcinoma from thymoma.
  - reference: PMID:32704057
    reference_title: "Preferentially expressed antigen in melanoma as a novel diagnostic marker differentiating thymic squamous cell carcinoma from thymoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The KIT-/CD5-positive type B3 thymoma was negative for PRAME. Thus,
      combinatorial evaluation of PRAME with KIT and CD5 may facilitate a more
      precise diagnosis of TSQCC.
    explanation: >-
      Establishes combined PRAME, KIT, and CD5 immunohistochemistry for resolving
      borderline type B3 thymoma versus thymic carcinoma.
treatments:
- name: Complete surgical resection
  description: >-
    Complete surgical resection (thymectomy) is the cornerstone of
    curative-intent treatment across resectable thymic epithelial tumors and the
    single most important prognostic determinant.
  treatment_term:
    preferred_term: thymectomy
    term:
      id: NCIT:C29894
      label: Thymectomy
  therapeutic_modality: SURGERY
  target_mechanisms:
  - target: Neoplastic transformation of thymic epithelium
    treatment_effect: INHIBITS
    description: Complete surgical excision removes the transformed thymic tumor mass.
  evidence:
  - reference: PMID:38881813
    reference_title: "Insights into molecular aspects and targeted therapy of thymic carcinoma: a narrative review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Currently, no therapy is more effective than complete surgical resection
    explanation: >-
      Establishes complete surgical resection as the most effective treatment
      for thymic epithelial tumors.
- name: Postoperative radiotherapy
  description: >-
    Adjuvant mediastinal radiotherapy after surgical resection improves local
    control and survival in invasive (Masaoka-Koga stage IIb-IV) or incompletely
    resected thymomas and thymic carcinomas.
  treatment_term:
    preferred_term: radiation therapy
    term:
      id: NCIT:C15313
      label: Radiation Therapy
  therapeutic_modality: RADIOTHERAPY
  target_mechanisms:
  - target: Neoplastic transformation of thymic epithelium
    treatment_effect: INHIBITS
    description: Ionizing radiation eradicates residual microscopic neoplastic thymic epithelial cells in the tumor bed.
  evidence:
  - reference: PMID:33447442
    reference_title: "The role of postoperative radiotherapy for thymomas: a multicentric retrospective evaluation from three Italian centers and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with R0 margins treated with PORT showed better OS and DSS (P=0.05).
    explanation: >-
      Multicenter clinical cohort supporting survival benefit of postoperative
      radiotherapy in resected thymoma.
  - reference: PMID:33447442
    reference_title: "The role of postoperative radiotherapy for thymomas: a multicentric retrospective evaluation from three Italian centers and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Other trials reported a significant benefit in OS, DSS and DFS in stage IIb-IV thymoma treated with PORT.
    explanation: >-
      Summarizes stage-specific survival and disease-free survival benefit of
      postoperative radiotherapy in invasive stage IIb-IV thymoma.
- name: Platinum-based chemotherapy for advanced or unresectable disease
  description: >-
    For advanced, metastatic or unresectable disease, platinum-based
    chemotherapy - commonly carboplatin plus paclitaxel - is the standard
    first-line systemic option across thymoma and thymic carcinoma. Specific
    regimens are curated in the family subtype entries.
  treatment_term:
    preferred_term: chemotherapy
    term:
      id: NCIT:C15632
      label: Chemotherapy
    therapeutic_agent:
    - preferred_term: carboplatin
      term:
        id: CHEBI:31355
        label: carboplatin
    - preferred_term: paclitaxel
      term:
        id: CHEBI:45863
        label: paclitaxel
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Neoplastic transformation of thymic epithelium
    treatment_effect: INHIBITS
    description: Cytotoxic DNA crosslinking and microtubule stabilization inhibit proliferating neoplastic thymic epithelial cells.
  evidence:
  - reference: PMID:21502559
    reference_title: "Phase II study of carboplatin and paclitaxel in advanced thymoma and thymic carcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      For patients with thymic carcinoma, no CRs and five
      PRs (ORR, 21.7%; 90% CI, 9.0% to 40.4%) were observed; 12 patients had stable
      disease.
    explanation: >-
      Prospective phase 2 trial supports carboplatin plus paclitaxel as an active
      first-line platinum-based regimen in advanced thymic epithelial tumors.
- name: Lenvatinib
  description: >-
    Lenvatinib, a multi-targeted tyrosine kinase inhibitor, is an active option
    in advanced or metastatic thymic carcinoma previously treated with
    platinum-based chemotherapy. Detailed line-of-therapy context is curated in
    the Thymic Carcinoma entry.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: lenvatinib
      term:
        id: CHEBI:85994
        label: lenvatinib
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Neoplastic transformation of thymic epithelium
    treatment_effect: INHIBITS
    description: Multi-kinase inhibition suppresses angiogenesis and receptor-tyrosine-kinase-driven thymic carcinoma growth.
  evidence:
  - reference: PMID:32502444
    reference_title: "Lenvatinib in patients with advanced or metastatic thymic carcinoma (REMORA): a multicentre, phase 2 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The objective response rate was 38% (90% CI 25·6-52·0, p<0·0001). 16 (38%)
      of 42 patients had a partial response and 24 (57%) had stable disease.
    explanation: >-
      A single-arm phase 2 trial reporting a 38% objective response rate for
      second-line lenvatinib in advanced/metastatic thymic carcinoma, supporting
      it as an active systemic option.
stages:
- name: Masaoka-Koga and TNM staging
  description: >-
    Thymic epithelial tumors are staged by the invasion-and-dissemination-based
    Masaoka-Koga system (stage I encapsulated; II capsular/perithymic-fat
    invasion; III invasion of adjacent organs; IV pleural/pericardial [IVa] or
    lymphogenous/hematogenous [IVb] spread) and, since the eighth edition, by the
    IASLC/UICC TNM classification, which refines these into T (tumor extent), N
    (nodal), and M (metastasis) descriptors. Stage and completeness of resection
    are the dominant prognostic determinants.
  evidence:
  - reference: PMID:33447442
    reference_title: "The role of postoperative radiotherapy for thymomas: a multicentric retrospective evaluation from three Italian centers and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      According to the Masaoka-Koga staging system, 39.3%, 32.7%, 18.6% and 9.8%
      patients were in stage I, II, III and IV of disease, respectively.
    explanation: >-
      Documents the Masaoka-Koga stage I-IV framework used to stratify thymic
      epithelial tumors in a clinical cohort.

notes: >-
  This is a CURATE_ROOT_WITH_SUBTYPES entry (issue #8457). Subtype-level
  mechanism graphs already exist as free-standing dismech Disease entries -
  Thymoma (MONDO:0006456), Thymic Carcinoma (MONDO:0006451) and Thymic
  Neuroendocrine Carcinoma (MONDO:0020516). Following the cancer-curation
  convention used for those pages, the thymus-neoplasm root treats each family
  as a flat has_subtypes facet grounded to MONDO/NCIT and, for thymoma, lists
  the five WHO histotypes (A, AB, B1, B2, B3) as child subtypes. The detailed
  oncogenic and tolerance-failure pathophysiology is intentionally NOT
  duplicated here; the root carries only the shared thymic-epithelial-origin
  node and the thymoma-defining central-tolerance-failure arm that produces the
  characteristic paraneoplastic autoimmunity. Non-epithelial thymic masses
  (thymic lymphoma, germ cell tumor, thymic cyst) fall under this MONDO grouping
  clinically but are out of dismech scope for this entry, which is restricted to
  the thymic epithelial and neuroendocrine tumor families. Nosology nuance: in
  MONDO, thymic neuroendocrine carcinoma (MONDO:0020516) is a multi-parent class
  nested under BOTH thymic carcinoma (MONDO:0006451) and the family-level thymic
  neuroendocrine tumor (MONDO:0019964, itself under neuroendocrine neoplasm), so
  a strict ontology view folds the neuroendocrine arm inside carcinoma. dismech
  deliberately flattens this by listing the neuroendocrine family as its own
  has_subtypes facet parallel to thymoma and thymic carcinoma, grounded to the
  family-level parent MONDO:0019964, because its MEN1-driven biology and
  endocrine paraneoplasia are mechanistically distinct from squamous-type thymic
  carcinoma.
classifications:
  harrisons_chapter:
  - classification_value: ONCOLOGY_HEMATOLOGY
    evidence:
    - reference: PMID:38264756
      reference_title: "Epidemiology of thymomas and thymic carcinomas in the United States and Germany, 1999-2019."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Patients aged 0-19 (n=478) and ≥20 years (n=17,459) diagnosed with
        malignant tumors of the anterior mediastinum were identified from the
        Surveillance, Epidemiology, and End Results registry (SEER)
      explanation: >-
        Thymic tumors are registered and analysed as malignant neoplasms of the
        anterior mediastinum in national cancer registries, supporting an
        oncology classification for the grouping concept.
  - classification_value: IMMUNE_RHEUMATOLOGIC
    evidence:
    - reference: PMID:40983285
      reference_title: "Management of Autoimmune Conditions Associated With Thymic Epithelial Tumors."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Thymic epithelial tumors are associated with diverse autoimmune
        manifestations, with 30% to 50% of patients developing at least one
        autoimmune condition.
      explanation: >-
        Because 30-50% of patients develop autoimmune disease, thymic neoplasia
        also belongs to the immune/rheumatologic axis rather than oncology
        alone.
has_subtypes:
- name: Thymoma
  classification: histologic_family
  children:
  - Type A thymoma
  - Type AB thymoma
  - Type B1 thymoma
  - Type B2 thymoma
  - Type B3 thymoma
  subtype_term:
    preferred_term: thymoma
    term:
      id: MONDO:0006456
      label: thymoma
  description: >-
    Organotypic thymic epithelial tumor spanning WHO histotypes A, AB, B1, B2
    and B3, characterized by a low mutational burden, enrichment for the GTF2I
    missense mutation (especially types A/AB), and a unique capacity to perturb
    thymic selection so that impaired central tolerance drives paraneoplastic
    autoimmunity (myasthenia gravis, pure red cell aplasia, Good syndrome).
    Curated in detail in the free-standing dismech entry Thymoma
    (kb/disorders/Thymoma.yaml).
  evidence:
  - reference: PMID:25521402
    reference_title: "Development of the international thymic malignancy interest group international database: an unprecedented resource for the study of a rare group of tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      WHO type B2 was the most frequent histologic classification among thymomas,
      whereas squamous was the most common among thymic carcinomas.
    explanation: >-
      The ITMIG international database frames thymoma as the WHO-histotyped
      epithelial family, distinct from thymic carcinoma.
- name: Type A thymoma
  classification: histological_pattern
  subtype_term:
    preferred_term: Type A thymoma
    term:
      id: NCIT:C6454
      label: Thymoma Type A
  description: >-
    Spindle-cell thymoma with relatively indolent behavior and marked enrichment
    for GTF2I mutation.
  evidence:
  - reference: PMID:15063231
    reference_title: "WHO histologic classification is a prognostic indicator in thymoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The frequency of invasion to neighboring organs increased according to
      tumor subtype in the order A (0%), AB (6%), B1 (19%), B2 (25%), B3 (42%),
      and C (89%).
    explanation: >-
      Positions type A at the least-invasive end of the WHO histologic gradient.
- name: Type AB thymoma

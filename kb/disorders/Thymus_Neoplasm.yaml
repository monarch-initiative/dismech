    reference_title: "A specific missense mutation in GTF2I occurs at high frequency in thymic epithelial tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In a series of 274 TETs, we detected the GTF2I mutation in 82% of type A and 74% of type AB thymomas but rarely in the aggressive subtypes, where recurrent mutations of known cancer genes have been identified."
    explanation: Establishes the recurrent somatic GTF2I missense mutation enriched in type A and AB thymomas.

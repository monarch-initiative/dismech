    reference_title: "Somatic Mutations of Thymic Epithelial Tumors Identified in the Prospective THYMOGENE Trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "GTF2I mutations were the most common, being present in 41% of patients."
    explanation: Prospective tumor-normal sequencing confirms GTF2I as the most frequent somatic driver across thymic epithelial tumors.

name: Thymus Neoplasm
creation_date: "2026-08-14T00:00:00Z"
description: >-
  Thymus neoplasm is the root grouping concept for primary tumors of the thymus
  gland in the prevascular (anterior) mediastinum. The overwhelming majority are
  thymic epithelial tumors (TETs), which dismech models as three biologically
  distinct families, each curated in its own dedicated entry: thymoma (an
  organotypic epithelial tumor spanning WHO histotypes A, AB, B1, B2 and B3),
  thymic carcinoma (an overtly malignant, CD5/CD117-positive epithelial tumor
  with a higher mutational burden and greater metastatic potential), and thymic
  neuroendocrine tumors (historically "thymic carcinoid", strongly associated
  with germline MEN1 loss). The defining clinical peculiarity of thymic
  neoplasia is the paraneoplastic autoimmunity of thymoma: because the tumor
  perturbs thymic central tolerance, a large fraction of patients develop
  autoimmune syndromes such as myasthenia gravis, pure red cell aplasia, and
  Good syndrome. This root entry organizes and cross-references the three
  family-level dismech entries (Thymoma, Thymic Carcinoma, Thymic
  Neuroendocrine Carcinoma) rather than duplicating their detailed mechanism
  graphs; the causal detail lives in those subtype pages.
category: Neoplastic
categories:
- Thymic epithelial tumor
- Mediastinal neoplasm
- Thoracic cancer
parents:
- thymus gland disorder
- mediastinal neoplasm
synonyms:
- thymus cancer
- thymic neoplasm
- neoplasm of thymus
- thymic tumor
- tumor of thymus

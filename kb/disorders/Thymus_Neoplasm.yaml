notes: >-
  Thymus neoplasm is curated as the root grouping entry over three
  family-level dismech Disease entries - Thymoma (MONDO:0006456), Thymic
  Carcinoma (MONDO:0006451) and Thymic Neuroendocrine Carcinoma
  (MONDO:0020516). Following the cancer-curation convention used for those
  pages, the thymus-neoplasm root treats each family as a flat has_subtypes
  facet grounded to MONDO/NCIT and, for thymoma, lists the five WHO histotypes
  (A, AB, B1, B2, B3) as child subtypes. The root summarizes the
  family-distinguishing molecular drivers (somatic GTF2I in thymoma, somatic
  CDKN2A/TP53 inactivation in thymic carcinoma, and germline or somatic MEN1
  inactivation in thymic neuroendocrine tumors), the shared
  thymic-epithelial-origin node, and the thymoma-defining
  central-tolerance-failure arm that produces paraneoplastic autoimmunity; the
  detailed intra-family mechanism graphs are curated on the dedicated subtype
  pages rather than duplicated here. Non-epithelial thymic masses (thymic
  lymphoma, germ cell tumor, thymic cyst) fall under this MONDO grouping
  clinically but are out of dismech scope for this entry, which is restricted
  to the thymic epithelial and neuroendocrine tumor families. Nosology nuance:
  in MONDO, thymic neuroendocrine carcinoma (MONDO:0020516) is a multi-parent
  class nested under BOTH thymic carcinoma (MONDO:0006451) and the
  family-level thymic neuroendocrine tumor (MONDO:0019964, itself under
  neuroendocrine neoplasm), so a strict ontology view folds the neuroendocrine
  arm inside carcinoma. dismech deliberately flattens this by listing the
  neuroendocrine family as its own has_subtypes facet parallel to thymoma and
  thymic carcinoma, grounded to the family-level parent MONDO:0019964, because
  its MEN1-driven biology and endocrine paraneoplasia are mechanistically
  distinct from squamous-type thymic carcinoma. No GeneReviews or StatPearls
  chapter covers thymus neoplasm as a whole.
classifications:
  harrisons_chapter:
  - classification_value: ONCOLOGY_HEMATOLOGY
    evidence:
    - reference: PMID:38264756
      reference_title: "Epidemiology of thymomas and thymic carcinomas in the United States and Germany, 1999-2019."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Patients aged 0-19 (n=478) and ≥20 years (n=17,459) diagnosed with
        malignant tumors of the anterior mediastinum were identified from the
        Surveillance, Epidemiology, and End Results registry (SEER)
      explanation: >-
        Thymic tumors are registered and analysed as malignant neoplasms of the
        anterior mediastinum in national cancer registries, supporting an
        oncology classification for the grouping concept.
  - classification_value: IMMUNE_RHEUMATOLOGIC
    evidence:
    - reference: PMID:40983285
      reference_title: "Management of Autoimmune Conditions Associated With Thymic Epithelial Tumors."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Thymic epithelial tumors are associated with diverse autoimmune
        manifestations, with 30% to 50% of patients developing at least one
        autoimmune condition.
      explanation: >-
        Because 30-50% of patients develop autoimmune disease, thymic neoplasia
        also belongs to the immune/rheumatologic axis rather than oncology
        alone.
has_subtypes:
- name: Thymoma
  classification: histologic_family
  children:
  - Type A thymoma
  - Type AB thymoma
  - Type B1 thymoma
  - Type B2 thymoma
  - Type B3 thymoma
  subtype_term:
    preferred_term: thymoma
    term:
      id: MONDO:0006456
      label: thymoma
  description: >-
    Organotypic thymic epithelial tumor spanning WHO histotypes A, AB, B1, B2
    and B3, characterized by a low mutational burden, enrichment for the GTF2I
    missense mutation (especially types A/AB), and a unique capacity to perturb
    thymic selection so that impaired central tolerance drives paraneoplastic
    autoimmunity (myasthenia gravis, pure red cell aplasia, Good syndrome).
    Curated in detail in the free-standing dismech entry Thymoma
    (kb/disorders/Thymoma.yaml).
  evidence:
  - reference: PMID:25521402
    reference_title: "Development of the international thymic malignancy interest group international database: an unprecedented resource for the study of a rare group of tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      WHO type B2 was the most frequent histologic classification among thymomas,
      whereas squamous was the most common among thymic carcinomas.
    explanation: >-
      The ITMIG international database frames thymoma as the WHO-histotyped
      epithelial family, distinct from thymic carcinoma.
- name: Type A thymoma
  classification: histological_pattern
  subtype_term:
    preferred_term: Type A thymoma
    term:
      id: NCIT:C6454
      label: Thymoma Type A
  description: >-
    Spindle-cell thymoma with relatively indolent behavior and marked enrichment
    for GTF2I mutation.
  evidence:
  - reference: PMID:15063231
    reference_title: "WHO histologic classification is a prognostic indicator in thymoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The frequency of invasion to neighboring organs increased according to
      tumor subtype in the order A (0%), AB (6%), B1 (19%), B2 (25%), B3 (42%),
      and C (89%).
    explanation: >-
      Positions type A at the least-invasive end of the WHO histologic gradient.
- name: Type AB thymoma
  classification: histological_pattern
  subtype_term:
    preferred_term: Type AB thymoma
    term:
      id: NCIT:C6885
      label: Thymoma Type AB
  description: >-
    Mixed spindle-cell and lymphocyte-rich thymoma sharing much of the
    GTF2I-enriched, indolent molecular profile of type A.
  evidence:
  - reference: PMID:15063231
    reference_title: "WHO histologic classification is a prognostic indicator in thymoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The frequency of invasion to neighboring organs increased according to
      tumor subtype in the order A (0%), AB (6%), B1 (19%), B2 (25%), B3 (42%),
      and C (89%).
    explanation: >-
      Positions type AB near the least-invasive end of the WHO histologic
      gradient.
- name: Type B1 thymoma
  classification: histological_pattern
  subtype_term:
    preferred_term: Type B1 thymoma
    term:
      id: NCIT:C6887
      label: Thymoma Type B1
  description: >-
    Cortical-like thymoma rich in immature T lymphocytes, generally showing less
    invasion than type B3.
  evidence:
  - reference: PMID:15063231
    reference_title: "WHO histologic classification is a prognostic indicator in thymoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The frequency of invasion to neighboring organs increased according to
      tumor subtype in the order A (0%), AB (6%), B1 (19%), B2 (25%), B3 (42%),
      and C (89%).
    explanation: >-
      Positions type B1 in the intermediate range of the WHO histologic
      invasion gradient.
- name: Type B2 thymoma
  classification: histological_pattern
  subtype_term:
    preferred_term: Type B2 thymoma
    term:
      id: NCIT:C6888
      label: Thymoma Type B2
  description: >-
    Cortical thymoma with numerous lymphocytes and conspicuous neoplastic
    epithelial cells; the single most frequently assigned WHO histotype and
    strongly associated with myasthenia gravis.
  evidence:
  - reference: PMID:25521402
    reference_title: "Development of the international thymic malignancy interest group international database: an unprecedented resource for the study of a rare group of tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      WHO type B2 was the most frequent histologic classification among thymomas,
      whereas squamous was the most common among thymic carcinomas.
    explanation: >-
      Establishes type B2 as the most common thymoma histotype.
- name: Type B3 thymoma
  classification: histological_pattern
  subtype_term:
    preferred_term: Type B3 thymoma
    term:
      id: NCIT:C7997
      label: Thymoma Type B3
  description: >-
    Epithelial-predominant, atypia-poor thymoma with the highest invasion
    frequency among thymomas, sitting at the aggressive end of the WHO gradient
    and bordering thymic carcinoma.
  evidence:
  - reference: PMID:15063231
    reference_title: "WHO histologic classification is a prognostic indicator in thymoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The frequency of invasion to neighboring organs increased according to
      tumor subtype in the order A (0%), AB (6%), B1 (19%), B2 (25%), B3 (42%),
      and C (89%).
    explanation: >-
      Positions type B3 at the most-invasive end of the WHO histologic gradient
      among thymomas.
- name: Thymic carcinoma
  classification: histologic_family
  subtype_term:
    preferred_term: thymic carcinoma
    term:
      id: MONDO:0006451
      label: thymic carcinoma
  description: >-
    Overtly malignant thymic epithelial tumor with frank cytologic atypia,
    infiltrative growth, high metastatic potential and a characteristic
    CD5/CD117 (KIT) immunophenotype. Carries a higher mutational burden than
    thymoma (recurrent TP53 and CDKN2A/B loss, receptor-tyrosine-kinase pathway
    alterations including KIT) and generally lacks thymoma's paraneoplastic
    autoimmune syndromes. Curated in detail in the free-standing dismech entry
    Thymic Carcinoma (kb/disorders/Thymic_Carcinoma.yaml).
  evidence:
  - reference: PMID:38881813
    reference_title: "Insights into molecular aspects and targeted therapy of thymic carcinoma: a narrative review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      the frequently involved genes or pathways associated with thymic carcinoma
      are tumor suppressor genes, including TP53 and CDKN2A/B, and the receptor
      tyrosine kinase pathway
    explanation: >-
      Summarizes the higher-mutational-burden, RTK-driven molecular profile that
      distinguishes thymic carcinoma from thymoma.
- name: Thymic neuroendocrine tumors
  classification: histologic_family
  subtype_term:
    preferred_term: thymic neuroendocrine tumor
    term:
      id: MONDO:0019964
      label: thymic neuroendocrine tumor
  description: >-
    Ultra-rare thymic epithelial malignancy with neuroendocrine morphology and
    marker expression (chromogranin A, synaptophysin), historically called
    "thymic carcinoid", spanning typical/atypical carcinoid to large-cell and
    small-cell neuroendocrine carcinoma. Strongly associated with germline MEN1
    loss and prone to functional endocrine paraneoplasia (ectopic ACTH/CRH,
    Cushing syndrome). Curated in detail in the free-standing dismech entry
    Thymic Neuroendocrine Carcinoma (MONDO:0020516,
    kb/disorders/Thymic_Neuroendocrine_Carcinoma.yaml).
  evidence:
  - reference: PMID:35696052
    reference_title: "Thymic neuroendocrine tumors in patients with multiple endocrine neoplasia type 1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Neuroendocrine tumors of the thymus (TNETs) are very rare but often have
      an aggressive nature.
    explanation: >-
      Characterizes the thymic neuroendocrine family as rare and aggressive,
      distinguishing it from thymoma.

- name: Somatic mosaic arm
  inheritance_term:
    preferred_term: Typified by somatic mosaicism
    term:
      id: HP:0001442
      label: Typified by somatic mosaicism
  description: >-
    A minority of individuals carry a post-zygotic CYLD variant. They present
    with clustered, often asymmetric cylindromas or spiradenomas, may have no
    detectable variant in blood, and can transmit a constitutional form to
    offspring when the mosaic variant reaches the germline.
  evidence:
  - reference: PMID:31085270
    reference_title: "Diverse presentations of cutaneous mosaicism occur in CYLD cutaneous syndrome and may result in parent-to-child transmission."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two patients had mosaic pathogenic CYLD variants in both the blood and skin. One of these patients transmitted a pathogenic variant to her daughter"
    explanation: Paired blood and skin testing demonstrates post-zygotic CYLD mosaicism with germline transmission.
  - reference: PMID:31085270
    reference_title: "Diverse presentations of cutaneous mosaicism occur in CYLD cutaneous syndrome and may result in parent-to-child transmission."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two patients had recurrent pathogenic variants in skin tumors from a single cluster but none detectable in the blood."
    explanation: Tissue-restricted mosaicism, detectable only by testing more than one tumor from a cluster.
has_subtypes:
- name: FC
  display_name: Familial cylindromatosis
  description: >-
    Phenotypic variant in which cylindromas predominate, classically on the
    scalp. Caused by germline CYLD variants; the same variant can present as
    familial cylindromatosis in one relative and as multiple familial
    trichoepithelioma in another.
  subtype_term:
    preferred_term: familial cylindromatosis
    term:
      id: MONDO:0007565
      label: familial cylindromatosis
  genes:

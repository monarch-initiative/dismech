name: CYLD Cutaneous Syndrome
creation_date: "2026-10-13T20:32:52Z"
category: Mendelian
categories:
- Hereditary Cancer Syndrome
- Cancer Predisposition Syndrome
parents:
- hereditary neoplastic syndrome
disease_term:
  preferred_term: Brooke-Spiegler syndrome
  term:
    id: MONDO:0011512
    label: Brooke-Spiegler syndrome
synonyms:
- Brooke-Spiegler syndrome
- BSS
- CCS
- turban tumor syndrome
description: >-
  CYLD cutaneous syndrome is the autosomal dominant skin adnexal tumor
  predisposition caused by heterozygous germline loss-of-function variants in
  CYLD at 16q12-q13, which encodes a deubiquitinase that removes K63-linked
  polyubiquitin from signalling intermediates and restrains NF-kappaB and
  Wnt/beta-catenin signalling. Carriers develop multiple cylindromas,
  spiradenomas, spiradenocylindromas and trichoepitheliomas, chiefly on the
  scalp and face but also on the trunk and in sun-protected genital and
  axillary skin. The first tumor typically appears around puberty and tumors
  accumulate through adulthood; in the most severe cases confluent scalp
  tumors ("turban tumor") lead to total scalp removal. Each tumor completes a
  second hit at CYLD, most often by loss of heterozygosity of 16q. Tumors
  overexpress TRKB/TRKC and MYB, which are candidate therapeutic targets.
  Brooke-Spiegler syndrome, familial cylindromatosis and multiple familial
  trichoepithelioma were described as separate disorders, but the same
  germline CYLD variant produces more than one of these presentations within a
  family, so they are curated here as one entity with phenotypic variants
  recorded as subtypes. The GeneReviews chapter uses the inclusive name CYLD
  cutaneous syndrome, which is the name of this entry; MONDO and ClinGen label
  the concept Brooke-Spiegler syndrome. Rare manifestations are salivary gland
  membranous basal cell adenoma, pulmonary (large-airway) cylindromas and
  malignant transformation of a preexisting benign tumor.
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  expressivity: VARIABLE
  description: >-
    Germline CYLD variants are transmitted as an autosomal dominant
    predisposition, and most probands inherit the variant from a parent.
    Expressivity is highly variable, both in which tumor types predominate and
    in tumor burden, and this variability is seen within single families.
    Age-related penetrance has not been precisely estimated.
  evidence:

animal_models:
- name: Cyld knockout mouse (chemical carcinogenesis)
  species: Mouse
  genotype: Cyld-/-
  publication: PMID:16713561
  modeled_mechanisms:
  - target: NF-kappaB Pathway Derepression
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Cyld-null keratinocytes show Bcl-3-dependent NF-kappaB activation,
      cyclin D1 elevation and hyperproliferation, and the mice are highly
      susceptible to chemically induced skin tumors.
    limitations: >-
      Constitutional biallelic knockout rather than a germline heterozygote
      with somatic second hits, and the tumors studied were induced by TPA or
      UV promotion; the model does not reproduce spontaneous cylindromas,
      spiradenomas or trichoepitheliomas.
    evidence:
    - reference: PMID:16713561
      reference_title: "Cyld inhibits tumor cell proliferation by blocking Bcl-3-dependent NF-kappaB signaling."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Here we show that mice lacking Cyld are highly susceptible to chemically induced skin tumors."
      explanation: Supports the model as informative for the NF-kappaB node.
discussions:
- discussion_id: gap_cyld_lineage_restriction
  prompt: >-
    Why does constitutional CYLD loss of function produce tumors almost only in
    hair-follicle-related adnexal lineages, which cell is the tumor of origin,
    and how does CYLD loss lead to TRK and MYB overexpression?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Somatic CYLD Second-Hit Inactivation
  - pathophysiology#TRK Receptor Signalling Upregulation
  - pathophysiology#MYB Oncogenic Transcription Program Activation
  rationale: >-
    CYLD restrains several broadly used pathways, yet the tumor spectrum is
    narrow. Proposed explanations are the ectodysplasin-receptor (EDAR, XEDAR)
    arm of NF-kappaB signalling and a higher second-hit rate in hormonally
    stimulated follicles inferred from tumor maps; origin in hair follicle
    stem cells is stated in the literature as a hypothesis. No cited source
    establishes the route from CYLD loss to TRKB/TRKC or MYB overexpression.
  proposed_experiments:
  - experiment_id: lineage_resolved_cyld_second_hit_mapping
    name: Lineage-resolved second-hit mapping in early CYLD carrier lesions
    description: >-
      Microdissect the earliest visible lesions and adjacent follicles from
      carriers, determine which follicular compartment first shows biallelic
      CYLD loss, and profile NF-kappaB, Wnt, TRK and MYB programs in those
      cells relative to heterozygous neighbors.

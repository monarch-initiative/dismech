diagnosis:
- name: Histopathologic Confirmation of Adnexal Tumors
  description: >-
    A clinical diagnosis rests on multiple skin tumors histologically
    confirmed as cylindromas, spiradenomas or trichoepitheliomas.
  diagnosis_term:
    preferred_term: histopathologic examination of excised skin tumors
    term:
      id: NCIT:C18190
      label: Histopathologic Examination
  results: >-
    Multiple histologically confirmed cylindromas, spiradenomas and/or
    trichoepitheliomas establish the diagnosis without a molecular result.
  evidence:
  - reference: PMID:32298062
    reference_title: "CYLD Cutaneous Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The diagnosis of CYLD cutaneous syndrome is established in a proband with multiple skin tumors (histologically confirmed cylindromas, spiradenomas, and/or trichoepitheliomas) and/or by identification of a germline heterozygous pathogenic variant in CYLD by molecular genetic testing."
    explanation: GeneReviews diagnostic criteria; histologic confirmation of multiple tumors is one route to diagnosis.
- name: Molecular Genetic Testing of CYLD
  description: >-
    Identification of a germline heterozygous pathogenic CYLD variant
    establishes the diagnosis and enables testing of at-risk relatives. A
    normal blood result does not exclude the diagnosis when tumors are
    clustered, asymmetric or linear and there is no family history: a
    post-zygotic CYLD variant can be absent from blood leukocyte DNA and is
    found by testing two or more tumors for a recurrent variant.
  diagnosis_term:
    preferred_term: CYLD molecular genetic testing (germline, and tumor tissue when mosaicism is suspected)
    term:
      id: NCIT:C15709
      label: Genetic Testing
  results: >-
    A germline heterozygous pathogenic CYLD variant; or, in mosaic
    presentations, the same pathogenic CYLD variant recurring in two or more
    tumors, with or without a low-level variant in blood.
  evidence:
  - reference: PMID:32298062
    reference_title: "CYLD Cutaneous Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The diagnosis of CYLD cutaneous syndrome is established in a proband with multiple skin tumors (histologically confirmed cylindromas, spiradenomas, and/or trichoepitheliomas) and/or by identification of a germline heterozygous pathogenic variant in CYLD by molecular genetic testing."
    explanation: GeneReviews diagnostic criteria; a germline heterozygous pathogenic CYLD variant is the molecular route to diagnosis.
  - reference: PMID:31085270
    reference_title: "Diverse presentations of cutaneous mosaicism occur in CYLD cutaneous syndrome and may result in parent-to-child transmission."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two patients had recurrent pathogenic variants in skin tumors from a single cluster but none detectable in the blood."
    explanation: Blood-only testing missed tissue-restricted CYLD variants that tumor testing found.
  - reference: PMID:31085270
    reference_title: "Diverse presentations of cutaneous mosaicism occur in CYLD cutaneous syndrome and may result in parent-to-child transmission."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In such patients who lack a family history, genetic testing of skin tumors is necessary."
    explanation: Recommends tumor testing for clustered cylindromas without a family history.
  - reference: PMID:34744449
    reference_title: "Genetic Testing in CYLD Cutaneous Syndrome: An Update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Somatic testing of tumour tissue, relevant in mosaic CCS, can reveal recurrently detected pathogenic variants when two or more tumours are tested."
    explanation: Supports testing two or more tumors to identify a recurrent variant in mosaic presentations.
treatments:
- name: Surgical Excision of Tumors
  description: >-
    Conventional surgical removal of cylindromas, spiradenomas and
    trichoepitheliomas, with scalp-sparing strategies (early excision with
    direct closure, enucleation, excision with secondary-intention healing)
    to avoid total scalp removal. Mohs surgery for recurrence has limited
    benefit.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical excision of adnexal tumors
    term:
      id: NCIT:C15232

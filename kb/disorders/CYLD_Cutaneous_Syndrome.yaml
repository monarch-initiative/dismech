notes: >-
  Lump/split. Brooke-Spiegler syndrome, familial cylindromatosis and the
  CYLD-related form of multiple familial trichoepithelioma are curated as one
  disease with FC and MFT1 as subtypes, because one CYLD variant yields more
  than one of these presentations within a family (PMID:16922728). Two MONDO
  descendants of MONDO:0011512 are deliberately not bound as subtypes.
  MONDO:0012800 "trichoepithelioma, multiple familial, 2" (OMIM:612099)
  corresponds to the 9p21 linkage locus for MFT (PMID:8752837); the NCBI Gene
  record 100188881 (symbol MFT2, MIM 612099, map location 9p21) names no
  causal gene, and CYLD-linked MFT families excluded 9p21 (PMID:15289313), so
  it is not a CYLD disorder. MONDO:0011114 "familial multiple
  trichoepithelioma" is the MONDO parent of both MFT1 and MFT2, so binding it
  would bring the 9p21 locus into this entry; MFT1 (MONDO:0042977) is bound
  instead.

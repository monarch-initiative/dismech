    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Symptoms reported by affected patients included painful tumors (in 12 of 23 patients [52%] who answered the question), conductive deafness, and sexual dysfunction."
    explanation: Conductive deafness reported by affected patients.
  - reference: ORPHA:79493
    reference_title: "Brooke-Spiegler syndrome"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "HP:0000372 | Abnormality of the auditory canal | Very rare (<4-1%)"
    explanation: Orphanet frequency class for auditory canal involvement.
genetic:
- name: CYLD
  gene_term:
    preferred_term: CYLD
    term:
      id: hgnc:2584
      label: CYLD
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  association: >-
    Heterozygous germline loss-of-function variants in CYLD cause CYLD cutaneous
    syndrome; post-zygotic CYLD variants cause a mosaic form.
  notes: >-
    No genotype-phenotype correlation has been found for severity, malignant
    transformation or extracutaneous lesions. Germline variant detection rates
    are higher in classical Brooke-Spiegler syndrome than in the multiple
    familial trichoepithelioma presentation. ClinGen also rates CYLD for
    frontotemporal dementia and/or amyotrophic lateral sclerosis 8 (Limited),
    a separate gene-disease pair not curated here.
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_434ddb72-ee88-47af-9fa2-8dee9fa0a388-2019-04-19T160000.000Z
    evidence:
    - reference: CGGV:assertion_434ddb72-ee88-47af-9fa2-8dee9fa0a388-2019-04-19T160000.000Z
      reference_title: "CYLD / Brooke-Spiegler syndrome (Definitive)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "CYLD | HGNC:2584 | Brooke-Spiegler syndrome | MONDO:0011512 | AD | Definitive"
      explanation: ClinGen Hereditary Cancer GCEP classifies CYLD and Brooke-Spiegler syndrome (AD) as Definitive.
  case_fractions:
  - population: Brooke-Spiegler syndrome cohort, classical phenotype
    case_fraction_percent: 88
    cohort_size: 49
    notes: Germline CYLD variant detected by direct sequencing in 43 of 49 patients with classical BSS.
    evidence:
    - reference: PMID:23249834
      reference_title: "Novel and recurrent germline and somatic mutations in a cohort of 67 patients from 48 families with Brooke-Spiegler syndrome including the phenotypic variant of multiple familial trichoepitheliomas and correlation with the histopathologic findings in 379 biopsy specimens."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Germline CYLD mutations were found in 43 of the 49 patients with BSS (88%) but in only 8 of 18 MFT cohort (44%)."
      explanation: Detection rate in the classical phenotype.
  - population: Multiple familial trichoepithelioma phenotype cohort
    case_fraction_percent: 44
    cohort_size: 18
    notes: Germline CYLD variant detected in 8 of 18 patients with the MFT phenotype.
    evidence:
    - reference: PMID:23249834
      reference_title: "Novel and recurrent germline and somatic mutations in a cohort of 67 patients from 48 families with Brooke-Spiegler syndrome including the phenotypic variant of multiple familial trichoepitheliomas and correlation with the histopathologic findings in 379 biopsy specimens."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Germline CYLD mutations were found in 43 of the 49 patients with BSS (88%) but in only 8 of 18 MFT cohort (44%)."
      explanation: Detection rate in the MFT phenotype.
  evidence:
  - reference: PMID:10835629
    reference_title: "Identification of the familial cylindromatosis tumour-suppressor gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we have identified CYLD by detecting germline mutations in 21 cylindromatosis families and somatic mutations in 1 sporadic and 5 familial cylindromas."
    explanation: Gene discovery.
  - reference: PMID:26971504
    reference_title: "Brooke-Spiegler Syndrome and Phenotypic Variants: An Update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "There appears to be no genotype-phenotype correlations with respect to the severity of the disease, the possibility of malignant transformation, and development of extracutaneous lesions."
    explanation: Supports the absence of genotype-phenotype correlation stated in notes.

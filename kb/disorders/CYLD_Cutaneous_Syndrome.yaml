    reference_title: "CYLD mutations underlie Brooke-Spiegler, familial cylindromatosis, and multiple familial trichoepithelioma syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe a single family with affected members exhibiting either the FC or the MFT phenotypes associated with a mutation in the CYLD gene."
    explanation: One CYLD variant produces both the FC and the MFT presentation in one family, supporting treatment as phenotypic variants of one disease.
  - reference: ORPHA:211
    reference_title: "Familial cylindromatosis"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "CYLD | CYLD lysine 63 deubiquitinase | hgnc:2584 | Disease-causing germline mutation(s) in"
    explanation: Orphanet records familial cylindromatosis as a clinical subtype with CYLD as the disease-causing gene.
- name: MFT1
  display_name: Multiple familial trichoepithelioma 1 (CYLD-related)
  description: >-
    Phenotypic variant in which trichoepitheliomas (cribriform trichoblastomas)
    predominate, mostly on the central face. Only the CYLD-related form is
    included here. Germline CYLD variants are found less often in this
    presentation (about 40-50%) than in classical Brooke-Spiegler syndrome
    (about 80-85%), so a CYLD-negative MFT family may have another cause.
  subtype_term:
    preferred_term: multiple familial trichoepithelioma 1
    term:
      id: MONDO:0042977
      label: trichoepithelioma, multiple familial, 1
  genes:
  - preferred_term: CYLD
    term:
      id: hgnc:2584
      label: CYLD
  evidence:
  - reference: PMID:15086550
    reference_title: "Identification of the cylindromatosis tumor-suppressor gene responsible for multiple familial trichoepithelioma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The study firstly identified the cylindromatosis gene responsible for MFT and showed that different mutations of the CYLDI gene can give rise to distinct clinical and histological expression such as FC and MFT."
    explanation: Linkage to 16q12-q13 and a segregating CYLD frameshift in a large MFT family.
  - reference: PMID:26971504
    reference_title: "Brooke-Spiegler Syndrome and Phenotypic Variants: An Update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Germline CYLD mutations are detected in about 80-85% of patients with the classical BSS phenotype and in about 40-50% of the individuals with the MFT phenotype"
    explanation: Supports the lower CYLD detection rate in the MFT presentation stated in the description.
pathophysiology:
- name: Germline CYLD First-Hit Inactivation
  conforms_to: "germline_two_hit_tumor_predisposition#Constitutional First-Hit Tumor Suppressor Inactivation"
  description: >-
    A heterozygous CYLD loss-of-function variant is present constitutionally.
    Most germline alleles are frameshift or nonsense variants predicted to
    truncate the protein; missense and splice-site variants, large deletions
    and inversions account for a minority. Disease-associated truncations
    reduce the deubiquitinating activity of the encoded enzyme.
  role: trigger
  biological_scale: MOLECULAR
  genes:
  - preferred_term: CYLD
    term:
      id: hgnc:2584
      label: CYLD
  genetic_context:
    gene:
      preferred_term: CYLD
      term:
        id: hgnc:2584
        label: CYLD
    variant_origin: GERMLINE
    allelic_hit_role: FIRST_HIT
    allelic_events:
    - FRAMESHIFT_VARIANT
    - NONSENSE_VARIANT
    zygosity: HETEROZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Constitutional heterozygous CYLD loss of function, predominantly
      protein-truncating.
  molecular_functions:
  - preferred_term: K63-linked deubiquitinase activity
    term:
      id: GO:0061578
      label: K63-linked deubiquitinase activity
    modifier: DECREASED
  evidence:
  - reference: PMID:10835629
    reference_title: "Identification of the familial cylindromatosis tumour-suppressor gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we have identified CYLD by detecting germline mutations in 21 cylindromatosis families and somatic mutations in 1 sporadic and 5 familial cylindromas. All mutations predict truncation or absence of the encoded protein."
    explanation: Gene discovery in 21 families; all germline alleles are predicted loss of function.
  - reference: PMID:12917691
    reference_title: "The tumour suppressor CYLD negatively regulates NF-kappaB signalling by deubiquitination."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Truncations of CYLD found in cylindromatosis result in reduced enzymatic activity, indicating a link between impaired deubiquitination of CYLD substrates and human pathophysiology."
    explanation: Disease-associated truncations reduce the deubiquitinase activity bound on this node.
  - reference: PMID:23249834
    reference_title: "Novel and recurrent germline and somatic mutations in a cohort of 67 patients from 48 families with Brooke-Spiegler syndrome including the phenotypic variant of multiple familial trichoepitheliomas and correlation with the histopathologic findings in 379 biopsy specimens."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Twenty-one frameshift, 15 nonsense, 3 missense, and 4 splice site mutations were found in patients with BSS"
    explanation: Allelic spectrum in a 67-patient cohort, dominated by truncating variants.
  - reference: PMID:34744449
    reference_title: "Genetic Testing in CYLD Cutaneous Syndrome: An Update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "In addition, a minority of patients have large deletions involving the CYLD gene, intronic pathogenic variants that affect splicing, or inversions."
    explanation: Supports the non-truncating minority of germline alleles.
  downstream:
  - target: Somatic CYLD Second-Hit Inactivation
    description: >-
      With one allele inactivated in every cell, a single somatic event at
      CYLD in a susceptible adnexal cell becomes the rate-limiting step.
- name: Somatic CYLD Second-Hit Inactivation
  conforms_to: "germline_two_hit_tumor_predisposition#Somatic Second-Hit Inactivation of the Wild-Type Allele"
  description: >-
    Each tumor inactivates the retained wild-type CYLD allele. Loss of
    heterozygosity of 16q is the commonest route (about two thirds of tumors
    with a detected second hit), and intragenic somatic mutation accounts for
    the rest; apart from 16q LOH, CYLD-mutant tumors carry few copy-number
    changes. The tumors are of hair-follicle lineage. Tumor mapping in two
    large families found tumors concentrated at sites of hormonally stimulated
    hair follicles, which the authors interpret as those follicles being
    particularly vulnerable to loss of heterozygosity; that is an inference
    from tumor distribution, not a measured mutation rate.
  role: amplifier
  biological_scale: MOLECULAR
  genetic_context:
    gene:
      preferred_term: CYLD
      term:
        id: hgnc:2584
        label: CYLD
    variant_origin: SOMATIC
    allelic_hit_role: SECOND_HIT
    allelic_events:
    - LOSS_OF_HETEROZYGOSITY
    - PATHOGENIC_VARIANT
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Acquired inactivation of the wild-type CYLD allele in tumor tissue,
      mostly by 16q loss of heterozygosity and less often by an intragenic
      somatic mutation.
  cell_types:
  - preferred_term: hair follicle keratinocyte
    term:
      id: CL:2000092
      label: hair follicular keratinocyte
  evidence:
  - reference: PMID:23249834
    reference_title: "Novel and recurrent germline and somatic mutations in a cohort of 67 patients from 48 families with Brooke-Spiegler syndrome including the phenotypic variant of multiple familial trichoepitheliomas and correlation with the histopathologic findings in 379 biopsy specimens."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Somatic mutations were detected in 67 specimens of these 76 tumors (88%). Of the 67 somatic mutations, 21 (31%) represented a sequence alteration and 46 (69%) showed loss of heterozygosity."
    explanation: Quantifies the somatic second hit and its two routes in tumors from germline carriers.
  - reference: PMID:15289313
    reference_title: "Multiple familial trichoepithelioma caused by mutations in the cylindromatosis tumor suppressor gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In individual tumors, loss of heterozygosity at 16q or a somatic point mutation in the CYLD gene was detected."
    explanation: The same two second-hit routes in trichoepitheliomas from an MFT family.
  - reference: PMID:21552290
    reference_title: "Dysregulated TRK signalling is a therapeutic target in CYLD defective tumours."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CYLD mutant tumours were characterised by an absence of copy-number aberrations apart from LOH chromosome 16q, the genomic location of the CYLD gene."
    explanation: Array CGH shows 16q LOH as essentially the only copy-number event in these tumors.
  - reference: PMID:16713561
    reference_title: "Cyld inhibits tumor cell proliferation by blocking Bcl-3-dependent NF-kappaB signaling."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Mutations in the CYLD gene cause tumors of hair-follicle keratinocytes."
    explanation: >-
      Introductory statement of the human tumor lineage in a mouse study; it
      supports the hair follicle keratinocyte binding. The narrower claim that
      the tumors arise from hair follicle stem cells is stated in the
      literature only as a hypothesis and is not bound here.
  - reference: PMID:19917957
    reference_title: "Tumor mapping in 2 large multigenerational families with CYLD mutations: implications for disease management and tumor induction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Tumor mapping provided clinical evidence that correlated with hormonally stimulated hair follicles being particularly vulnerable to loss of heterozygosity and tumor induction."
    explanation: Source of the hormonally stimulated follicle interpretation recorded in the description.
  downstream:
  - target: Biallelic CYLD Loss in Adnexal Keratinocytes
    description: >-
      Completion of the second hit leaves the tumor-initiating cell without
      functional CYLD.
- name: Biallelic CYLD Loss in Adnexal Keratinocytes
  conforms_to: "germline_two_hit_tumor_predisposition#Biallelic Tumor Suppressor Inactivation in a Susceptible Cell"
  description: >-
    Tumor cells lack CYLD protein. CYLD is a deubiquitinase directed at
    non-K48 (K63-linked) polyubiquitin chains on signalling intermediates,
    including TRAF2, TRAF6, NEMO, Bcl-3 and Dishevelled, so its loss releases
    several growth and survival pathways at once. CYLD protein is normally
    prominent in the inner root sheath of the hair follicle and in eccrine
    glands, matching the lineages of the tumors.
  role: central_effector
  biological_scale: CELLULAR
  molecular_functions:
  - preferred_term: K63-linked deubiquitinase activity
    term:
      id: GO:0061578
      label: K63-linked deubiquitinase activity
    modifier: ABSENT
  evidence:
  - reference: CGGV:assertion_434ddb72-ee88-47af-9fa2-8dee9fa0a388-2019-04-19T160000.000Z
    reference_title: "CYLD / Brooke-Spiegler syndrome (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "CYLD protein is prominently expressed in the inner root sheath of hair follicles of human scalp as well as in eccrine glands. Multiple articles reported no CYLD protein expression in the tumour tissue from BSS patients."
    explanation: ClinGen evidence summary for absent CYLD protein in tumors and its normal follicular and eccrine expression.
  - reference: PMID:12917689
    reference_title: "CYLD is a deubiquitinating enzyme that negatively regulates NF-kappaB activation by TNFR family members."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here we show that CYLD is a deubiquitinating enzyme that negatively regulates activation of the transcription factor NF-kappaB by specific tumour-necrosis factor receptors (TNFRs). Loss of the deubiquitinating activity of CYLD correlates with tumorigenesis."
    explanation: Establishes CYLD as a deubiquitinase whose loss of activity correlates with tumor formation.
  downstream:
  - target: NF-kappaB Pathway Derepression
    description: Loss of CYLD removes deubiquitination of TRAF2, NEMO and Bcl-3.
  - target: Wnt-beta-Catenin Pathway Hyperactivation
    description: Loss of CYLD increases K63-linked ubiquitination of Dishevelled.
  - target: TRK Receptor Signalling Upregulation
    description: >-
      CYLD-null tumors overexpress TRKB and TRKC; the molecular route from CYLD
      loss to TRK overexpression is not established.
  - target: MYB Oncogenic Transcription Program Activation
    description: >-
      CYLD-defective cylindromas activate MYB without the MYB-NFIB fusion of
      sporadic cylindromas; the route from CYLD loss to MYB activation is not
      established.
  - target: Impaired DNA Damage-Induced p53 Stabilization
    description: >-
      Loss of CYLD catalytic activity removes CYLD-dependent deubiquitination
      of p53 after genotoxic stress. Shown in cultured cells, mice and
      nematodes, not in human CYLD-null tumors.
- name: Impaired DNA Damage-Induced p53 Stabilization
  description: >-
    CYLD binds and deubiquitinates p53, and is needed for p53 stabilization and
    activation after DNA damage. Ubiquitin chain-restriction analysis suggests
    CYLD removes K48 chains from p53 indirectly by cleaving K63 linkages in
    mixed chains. Loss of CYLD catalytic activity impairs this response in
    epithelial cells and sensitizes mice to chemical carcinogen-induced skin
    and intestinal tumors, and CYLD deficiency reduces CEP-1/p53-dependent
    germ cell apoptosis in C. elegans. This arm rests on model-system and
    biochemical evidence only; p53 stabilization has not been reported in
    tumors from CYLD cutaneous syndrome patients in the sources cited here,
    so its contribution to the human tumors is a hypothesis.
  role: central_effector
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: DNA damage-induced p53 signalling
    term:
      id: GO:0030330
      label: DNA damage response, signal transduction by p53 class mediator
    modifier: DECREASED
  evidence:
  - reference: DOI:10.1038/ncomms12508
    reference_title: "The tumour suppressor CYLD regulates the p53 DNA damage response"
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Mechanistically, CYLD interacts with and deubiquitinates p53 facilitating its stabilization in response to genotoxic stress."
    explanation: Biochemical basis for CYLD-dependent p53 stabilization after DNA damage.
  - reference: DOI:10.1038/ncomms12508
    reference_title: "The tumour suppressor CYLD regulates the p53 DNA damage response"
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Moreover, CYLD deficiency also diminishes CEP-1/p53-dependent DNA damage-induced germ cell apoptosis in the nematode Caenorhabditis elegans."
    explanation: The same dependence of the p53 damage response on CYLD in an invertebrate model.
  downstream:
  - target: Clonal Expansion of CYLD-Null Adnexal Tumor Cells
    description: >-
      Hypothesized contribution. The supporting result is carcinogen-induced
      skin and intestinal tumorigenesis in mice lacking CYLD catalytic
      activity, not adnexal tumor formation in human carriers.
    evidence:
    - reference: DOI:10.1038/ncomms12508
      reference_title: "The tumour suppressor CYLD regulates the p53 DNA damage response"
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Here we show that loss of CYLD catalytic activity causes impaired DNA damage-induced p53 stabilization and activation in epithelial cells and sensitizes mice to chemical carcinogen-induced intestinal and skin tumorigenesis."
      explanation: >-
        Mouse evidence that loss of CYLD catalytic activity both impairs the
        p53 damage response and increases carcinogen-induced skin tumors; it
        does not test adnexal tumors.
- name: NF-kappaB Pathway Derepression
  description: >-
    CYLD binds NEMO and TRAF2 and removes their activating non-K48
    polyubiquitin, so its loss augments TNF-receptor-family (CD40, EDAR, XEDAR)
    activation of canonical NF-kappaB and increases resistance to apoptosis.
    In keratinocytes, CYLD also deubiquitinates Bcl-3 and keeps it out of the
    nucleus; Cyld-null keratinocytes accumulate nuclear Bcl-3 with p50 and p52,
    raise cyclin D1 and proliferate. EDAR and XEDAR are ectodysplasin
    receptors, which is one proposed reason the phenotype is restricted to skin
    appendages.
  role: central_effector
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: canonical NF-kappaB signal transduction
    term:
      id: GO:0007249
      label: canonical NF-kappaB signal transduction
    modifier: INCREASED
  - preferred_term: apoptotic process
    term:
      id: GO:0006915
      label: apoptotic process
    modifier: DECREASED
  evidence:
  - reference: PMID:12917689
    reference_title: "CYLD is a deubiquitinating enzyme that negatively regulates NF-kappaB activation by TNFR family members."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "CYLD inhibits activation of NF-kappaB by the TNFR family members CD40, XEDAR and EDAR in a manner that depends on the deubiquitinating activity of CYLD."
    explanation: Names the receptors whose NF-kappaB output CYLD restrains, including the ectodysplasin receptors.
  - reference: PMID:12917689
    reference_title: "CYLD is a deubiquitinating enzyme that negatively regulates NF-kappaB activation by TNFR family members."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These results indicate that CYLD is a negative regulator of the cytokine-mediated activation of NF-kappaB that is required for appropriate cellular homeostasis of skin appendages."
    explanation: Authors' link between CYLD-restrained NF-kappaB signalling and skin appendage homeostasis.
  - reference: PMID:12917691
    reference_title: "The tumour suppressor CYLD negatively regulates NF-kappaB signalling by deubiquitination."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here we report that CYLD, a tumour suppressor that is mutated in familial cylindromatosis, interacts with NEMO, the regulatory subunit of IKK."
    explanation: Places CYLD at the IKK complex.
  - reference: PMID:12917690
    reference_title: "Loss of the cylindromatosis tumour suppressor inhibits apoptosis by activating NF-kappaB."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Inhibition of CYLD increases resistance to apoptosis, suggesting a mechanism through which loss of CYLD contributes to oncogenesis."
    explanation: RNAi knockdown links CYLD loss to apoptosis resistance through NF-kappaB.
  - reference: PMID:16713561
    reference_title: "Cyld inhibits tumor cell proliferation by blocking Bcl-3-dependent NF-kappaB signaling."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here we show that mice lacking Cyld are highly susceptible to chemically induced skin tumors. Cyld-/- tumors and keratinocytes treated with 12-O-tetradecanoylphorbol-13 acetate (TPA) or UV light are hyperproliferative and have elevated cyclin D1 levels."
    explanation: In vivo evidence that Cyld loss promotes keratinocyte proliferation and skin tumors.
  - reference: PMID:16713561
    reference_title: "Cyld inhibits tumor cell proliferation by blocking Bcl-3-dependent NF-kappaB signaling."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In Cyld+/+ keratinocytes, TPA or UV light triggers the translocation of Cyld from the cytoplasm to the perinuclear region, where Cyld binds and deubiquitinates Bcl-3, thereby preventing nuclear accumulation of Bcl-3 and p50/Bcl-3- or p52/Bcl-3-dependent proliferation."
    explanation: Mechanism of the Bcl-3 arm in keratinocytes.
  downstream:
  - target: Clonal Expansion of CYLD-Null Adnexal Tumor Cells
    description: Increased survival and proliferation of CYLD-null cells.
- name: Wnt-beta-Catenin Pathway Hyperactivation
  description: >-
    CYLD binds Dishevelled and limits K63-linked ubiquitination of its DIX
    domain; without CYLD, polymerized Dishevelled is hyperubiquitinated and
    Wnt-induced beta-catenin accumulation is enhanced. Hyperactive Wnt
    signalling is seen in human cylindromas.
  role: central_effector
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: canonical Wnt signaling pathway
    term:
      id: GO:0060070
      label: canonical Wnt signaling pathway
    modifier: INCREASED
  evidence:
  - reference: PMID:20227366
    reference_title: "Loss of the tumor suppressor CYLD enhances Wnt/beta-catenin signaling through K63-linked ubiquitination of Dvl."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Depletion of CYLD from cultured cells markedly enhances Wnt-induced accumulation of beta-catenin and target gene activation."
    explanation: Cell-based evidence that CYLD loss enhances canonical Wnt output.
  - reference: PMID:20227366
    reference_title: "Loss of the tumor suppressor CYLD enhances Wnt/beta-catenin signaling through K63-linked ubiquitination of Dvl."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Moreover, we demonstrate hyperactive Wnt signaling in human cylindroma skin tumors that arise from mutations in CYLD."
    explanation: The same pathway state observed in patient tumors.
  downstream:
  - target: Clonal Expansion of CYLD-Null Adnexal Tumor Cells
    description: Enhanced Wnt/beta-catenin output promotes tumor growth.
- name: TRK Receptor Signalling Upregulation
  description: >-
    Expression profiling of CYLD-mutant tumors against perilesional skin shows
    overexpression of TRKB (NTRK2) and TRKC (NTRK3), with membranous staining,
    increased ERK phosphorylation and BCL2 in cylindromas. TRK knockdown or the
    TRK inhibitor lestaurtinib reduced growth of 3D primary tumor cultures,
    which is the preclinical basis for topical TRK inhibition.
  role: central_effector
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: neurotrophin TRK receptor signaling pathway
    term:
      id: GO:0048011
      label: neurotrophin TRK receptor signaling pathway
    modifier: INCREASED
  evidence:
  - reference: PMID:21552290
    reference_title: "Dysregulated TRK signalling is a therapeutic target in CYLD defective tumours."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Gene expression profiling of CYLD mutant tumours showed dysregulated tropomyosin kinase (TRK) signalling, with overexpression of TRKB and TRKC in tumours when compared with perilesional skin."
    explanation: Patient tumor transcriptomes show TRK overexpression.
  - reference: PMID:21552290
    reference_title: "Dysregulated TRK signalling is a therapeutic target in CYLD defective tumours."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "RNA interference-mediated silencing of TRKB and TRKC, as well as treatment with the small-molecule TRK inhibitor lestaurtinib, reduced colony formation and proliferation in 3D primary cell cultures established from CYLD mutant tumours."
    explanation: Functional dependence of tumor cells on TRK signalling in culture.
  downstream:
  - target: Clonal Expansion of CYLD-Null Adnexal Tumor Cells
    description: TRK signalling supports proliferation of CYLD-null tumor cells.
- name: MYB Oncogenic Transcription Program Activation
  description: >-
    Inherited CYLD-defective cylindromas do not carry the MYB-NFIB fusion found
    in sporadic cylindromas but still overexpress MYB and its target genes, and
    MYB knockdown reduces cylindroma cell proliferation, so the inherited and
    sporadic tumors converge on MYB activation by different routes.
  role: central_effector
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: cell population proliferation
    term:
      id: GO:0008283
      label: cell population proliferation
    modifier: INCREASED
  evidence:
  - reference: PMID:26969893
    reference_title: "Overexpression of MYB drives proliferation of CYLD-defective cylindroma cells."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Strikingly, none of the inherited CYLD-defective (n = 23) tumours expressed MYB-NFIB fusion transcripts. However, MYB expression was increased in the majority of tumours (69%)"
    explanation: MYB activation without fusion in inherited cylindromas.
  - reference: PMID:26969893
    reference_title: "Overexpression of MYB drives proliferation of CYLD-defective cylindroma cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Moreover, knock-down of MYB expression caused a significant reduction in cylindroma cell proliferation, suggesting that MYB is also a key player and oncogenic driver in inherited cylindromas."
    explanation: Functional dependence of cylindroma cells on MYB.
  downstream:
  - target: Clonal Expansion of CYLD-Null Adnexal Tumor Cells
    description: MYB drives proliferation of CYLD-defective cylindroma cells.
- name: Clonal Expansion of CYLD-Null Adnexal Tumor Cells
  conforms_to: "germline_two_hit_tumor_predisposition#Clonal Expansion and Tumor Initiation"
  description: >-
    CYLD-null clones expand into benign adnexal tumors with follicular
    (trichoepithelioma) or sweat-gland-like (cylindroma, spiradenoma)
    differentiation, often several histologies in one patient and hybrid
    spiradenocylindromas in one lesion. Many arise independently, so tumor
    number rises with age. Benign tumors frequently carry further clonal
    mutations in the epigenetic modifiers DNMT3A and BCOR (29% of benign
    tumors in one series), with marked intra-tumor heterogeneity; the
    contribution of those mutations to growth or transformation is not
    established.
  role: consequence
  biological_scale: TISSUE
  evidence:
  - reference: PMID:31624251
    reference_title: "Epigenetic modifiers DNMT3A and BCOR are recurrently mutated in CYLD cutaneous syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we comprehensively profile the genomic landscape of 42 benign and malignant tumors across 13 individuals from four multigenerational families and discover recurrent mutations in epigenetic modifiers DNMT3A and BCOR in 29% of benign tumors."
    explanation: Cooperating somatic events in benign CYLD-null tumors.
  - reference: PMID:23249834
    reference_title: "Novel and recurrent germline and somatic mutations in a cohort of 67 patients from 48 families with Brooke-Spiegler syndrome including the phenotypic variant of multiple familial trichoepitheliomas and correlation with the histopathologic findings in 379 biopsy specimens."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of the 76 tumors from 32 patients with a germline CYLD mutation, 12 were spiradenomas, 15 spiradenocylindromas, 26 cylindromas, 15 trichoepitheliomas, and 7 were other tumor types."
    explanation: Histologic spectrum of tumors arising in germline carriers.
  downstream:
  - target: Multiple Skin Appendage Tumors
  - target: Cylindroma
  - target: Spiradenoma
  - target: Trichoepithelioma
  - target: Salivary Gland Membranous Basal Cell Adenoma
  - target: Pulmonary Cylindromas
  - target: Malignant Transformation of Adnexal Tumors
phenotypes:
- category: Neoplastic
  name: Multiple Skin Appendage Tumors
  description: >-
    Multiple benign adnexal tumors on the scalp and face, and frequently on the
    trunk and in sun-protected genital and axillary skin. The first tumor
    typically appears around puberty and tumors accumulate through adulthood.
    In two large families the mean age at onset was 16 years (range 8-30), 23%
    of surveyed patients had undergone total scalp removal, and tumors were on
    the scalp in 81%, the trunk in 69% and the pubic area in 42%. GeneReviews
    states that females often have more tumors than males; the same family
    study found roughly equal numbers of affected men and women but 5 of the 6
    total scalp removals were in women.
  phenotype_term:
    preferred_term: Multiple skin appendage tumors
    term:
      id: HP:0012842
      label: Skin appendage neoplasm
    onset:
      onset_category: JUVENILE
      mean_age_years: 16
      min_age_years: 8
      max_age_years: 30
      notes: Onset figures are from two multigenerational families (PMID:19917957).
  evidence:
  - reference: PMID:32298062
    reference_title: "CYLD Cutaneous Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The first tumor typically develops at puberty and tumors progressively accumulate through adulthood. Females often have more tumors than males. Tumors typically arise on the scalp and face but can also arise on the torso and sun-protected sites, such as the genital and axillary skin."
    explanation: GeneReviews phenotype baseline for onset, accumulation, sex difference in burden and distribution.
  - reference: PMID:19917957
    reference_title: "Tumor mapping in 2 large multigenerational families with CYLD mutations: implications for disease management and tumor induction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The average age at onset was 16 years (range, 8-30 years)."
    explanation: Quantitative onset age.
  - reference: PMID:19917957
    reference_title: "Tumor mapping in 2 large multigenerational families with CYLD mutations: implications for disease management and tumor induction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although an approximately equal female to male predisposition was noted, 5 women and 1 man (of 26 patients surveyed [23%]) had undergone total scalp removal."
    explanation: Equal sex ratio of affected individuals with more severe disease in women, and the rate of total scalp removal.
  - reference: PMID:19917957
    reference_title: "Tumor mapping in 2 large multigenerational families with CYLD mutations: implications for disease management and tumor induction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of the 26 surveyed patients, tumors were noted on the scalp in 21 (81%), on the trunk in 18 (69%), and in the pubic area in 11 (42%)."
    explanation: Body-site distribution beyond the head and neck.
- category: Neoplastic
  name: Cylindroma
  description: >-
    The defining tumor of the syndrome; dermal cylindromas, often confluent on
    the scalp.
  phenotype_term:
    preferred_term: Cylindroma
    term:
      id: HP:0031024
      label: Cylindroma
  frequency: VERY_FREQUENT
  evidence:
  - reference: ORPHA:79493
    reference_title: "Brooke-Spiegler syndrome"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "HP:0031024 | Cylindroma | Very frequent (99-80%)"
    explanation: Orphanet HPO annotation and frequency class.
  - reference: PMID:32298062
    reference_title: "CYLD Cutaneous Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "CYLD cutaneous syndrome (CCS) typically manifests in the second or third decade with the appearance of multiple skin tumors including cylindromas, spiradenomas, trichoepitheliomas, and rarely, membranous basal cell adenoma of the salivary gland."
    explanation: GeneReviews tumor spectrum.
- category: Neoplastic
  name: Spiradenoma
  description: >-
    Spiradenomas and hybrid spiradenocylindromas. Pain is a common symptom of
    the tumors (about half of patients asked in one family study), although
    that study did not attribute it to a particular histology.
  phenotype_term:
    preferred_term: Spiradenoma
  notes: >-
    Left unbound: an OLS search of the hp ontology for "spiradenoma" returned
    no terms. The parent concept HP:0012842 Skin appendage neoplasm is bound
    on the Multiple Skin Appendage Tumors phenotype.
  evidence:
  - reference: PMID:32298062
    reference_title: "CYLD Cutaneous Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "CYLD cutaneous syndrome (CCS) typically manifests in the second or third decade with the appearance of multiple skin tumors including cylindromas, spiradenomas, trichoepitheliomas, and rarely, membranous basal cell adenoma of the salivary gland."
    explanation: GeneReviews tumor spectrum includes spiradenoma.
  - reference: PMID:19917957
    reference_title: "Tumor mapping in 2 large multigenerational families with CYLD mutations: implications for disease management and tumor induction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Symptoms reported by affected patients included painful tumors (in 12 of 23 patients [52%] who answered the question), conductive deafness, and sexual dysfunction."
    explanation: Pain is a common symptom; the study does not attribute it to a single histology.
- category: Neoplastic
  name: Trichoepithelioma
  description: >-
    Trichoepitheliomas, predominantly on the central face; the sole tumor type
    in the multiple familial trichoepithelioma presentation.
  phenotype_term:
    preferred_term: Trichoepithelioma
    term:
      id: HP:0025367
      label: Trichoepithelioma
  frequency: FREQUENT
  evidence:
  - reference: ORPHA:79493
    reference_title: "Brooke-Spiegler syndrome"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "HP:0025367 | Trichoepithelioma | Frequent (79-30%)"
    explanation: Orphanet HPO annotation and frequency class.
  - reference: PMID:26971504
    reference_title: "Brooke-Spiegler Syndrome and Phenotypic Variants: An Update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Multiple familial trichoepithelioma (MFT) is a phenotypic variant of the disease characterized by the development of numerous trichoepitheliomas (cribriform trichoblastoma) only."
    explanation: Trichoepithelioma as the defining tumor of the MFT presentation.
- category: Neoplastic
  name: Salivary Gland Membranous Basal Cell Adenoma
  description: >-
    A minority develop major or minor salivary gland tumors, characteristically
    membranous basal cell adenoma, which resembles dermal cylindroma
    histologically.
  phenotype_term:
    preferred_term: Membranous basal cell adenoma of salivary gland
    term:
      id: HP:6000007
      label: Salivary basal cell adenoma
  frequency: VERY_RARE
  evidence:
  - reference: PMID:32298062
    reference_title: "CYLD Cutaneous Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "A minority of individuals develop salivary gland tumors."
    explanation: GeneReviews statement of salivary involvement.
  - reference: ORPHA:79493
    reference_title: "Brooke-Spiegler syndrome"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "HP:0100684 | Salivary gland neoplasm | Very rare (<4-1%)"
    explanation: Orphanet frequency class for salivary gland neoplasm.
  - reference: PMID:29569226
    reference_title: "Inherited pulmonary cylindromas: extending the phenotype of CYLD mutation carriers."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "a minority develop a type of salivary gland tumour, membranous basal cell adenoma, which shares similar histology."
    explanation: Names the salivary tumor type bound here.
- category: Neoplastic
  name: Pulmonary Cylindromas
  description: >-
    Cylindromas of the large airways, usually in patients with a high cutaneous
    tumor burden; they can cause breathlessness and airway obstruction. In one
    tertiary cohort of 16 carriers, 4 had lung imaging and 2 had histologically
    confirmed multiple pulmonary cylindromas. In a separate genomic study some
    pulmonary lesions were shown phylogenetically to be metastases of skin
    cylindromas.
  phenotype_term:
    preferred_term: Pulmonary cylindroma
    term:
      id: HP:0034637
      label: Pulmonary cylindroma
  evidence:
  - reference: PMID:29569226
    reference_title: "Inherited pulmonary cylindromas: extending the phenotype of CYLD mutation carriers."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Four patients had radiological imaging of their lungs, of which two had multiple pulmonary cylindromas that were confirmed histologically."
    explanation: Case series establishing pulmonary cylindromas in CYLD carriers.
  - reference: PMID:31624251
    reference_title: "Epigenetic modifiers DNMT3A and BCOR are recurrently mutated in CYLD cutaneous syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Phylogenetic and mutational signature analyses confirm cylindroma pulmonary metastases from primary skin tumors."
    explanation: At least some pulmonary cylindromas are metastatic rather than primary.
  - reference: PMID:32298062
    reference_title: "CYLD Cutaneous Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Rarely, pulmonary cylindromas can develop in large airways and compromise breathing."
    explanation: GeneReviews baseline statement of large-airway cylindromas and their respiratory consequence.
- category: Neoplastic
  name: Malignant Transformation of Adnexal Tumors
  description: >-
    Malignant tumors arise within preexisting benign tumors in about 5-10% of
    patients, and metastasis with lethal outcome can occur. In a review of 55
    published cases only age predicted malignancy. Signs prompting evaluation
    are rapid growth, bleeding, ulceration or a change in appearance.
  phenotype_term:
    preferred_term: Malignant adnexal skin tumor arising in a benign precursor
    term:
      id: HP:0012842
      label: Skin appendage neoplasm
  frequency: OCCASIONAL
  notes: >-
    HPO has no term for a malignant adnexal tumor or for malignant change in a
    cylindroma or spiradenoma. OLS searches of HPO (ontology=hp, 2026-10-14)
    for "cylindrocarcinoma", "spiradenocarcinoma", "malignant cylindroma",
    "malignant spiradenoma", "sweat gland carcinoma" and "skin appendage
    carcinoma" returned no terms; "adnexal carcinoma" returned only
    HP:0031548 Follicular infundibulum tumor; and "skin carcinoma" returned
    squamous cell, basal cell, Merkel cell and sebaceous gland carcinoma
    terms among unrelated hits, none of which names these tumors. The binding is HP:0012842 Skin
    appendage neoplasm, which HPO defines as "A benign or malignant neoplasm
    that arises from the hair follicles, sebaceous glands, or sweat glands"
    and which sits under HP:0008069 Neoplasm of the skin. It is the same term
    as the benign tumor phenotype, so the malignant state is carried only by
    preferred_term.
  evidence:
  - reference: PMID:26971504
    reference_title: "Brooke-Spiegler Syndrome and Phenotypic Variants: An Update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Malignant tumors arise in association with preexisting benign cutaneous neoplasms in about 5-10% of the patients ."
    explanation: Frequency of malignant transformation, supporting the OCCASIONAL class.
  - reference: PMID:32975300
    reference_title: "Can we clinically identify patients at risk of malignant transformation of skin tumors in Brooke-Spiegler syndrome?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our analysis revealed only age as a predictor of malignancy; however, this is also a general risk factor for development of malignancy and therefore of limited value as a screening tool."
    explanation: No clinical predictor beyond age.
  - reference: PMID:32975300
    reference_title: "Can we clinically identify patients at risk of malignant transformation of skin tumors in Brooke-Spiegler syndrome?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "An increased risk of malignant transformation of adnexal cutaneous tumors in BSS patients has been reported."
    explanation: >-
      States that the malignancies arise from the adnexal tumors, which is
      the basis for binding a skin appendage neoplasm term.
  - reference: PMID:32298062
    reference_title: "CYLD Cutaneous Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Although the tumors are usually benign, malignant transformation is recognized."
    explanation: GeneReviews baseline statement.
- category: Otologic
  name: Conductive Hearing Impairment
  description: >-
    Reported as a symptom in a family study; Orphanet lists hearing impairment
    and auditory canal abnormality as very rare. The mechanism has not been

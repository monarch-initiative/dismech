    reference_title: "CYLD Cutaneous Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Germline pathogenic variants in CYLD are inherited in an autosomal dominant manner."
    explanation: GeneReviews genetic counseling statement of the mode of inheritance.
  - reference: PMID:32298062
    reference_title: "CYLD Cutaneous Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Most individuals with CYLD cutaneous syndrome inherit it from a parent."
    explanation: Supports the statement that most probands inherit the variant from a parent.
  - reference: PMID:32298062
    reference_title: "CYLD Cutaneous Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Offspring of an individual with CYLD cutaneous syndrome have a 50% chance of inheriting the variant."
    explanation: GeneReviews transmission risk to offspring of a heterozygous carrier.
  - reference: PMID:32298062
    reference_title: "CYLD Cutaneous Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The degree of severity can vary within families; for example, a mildly affected parent may have a more severely affected child or vice versa."
    explanation: Supports variable expressivity, including within families.
  - reference: PMID:34744449
    reference_title: "Genetic Testing in CYLD Cutaneous Syndrome: An Update."
    supports: SUPPORT

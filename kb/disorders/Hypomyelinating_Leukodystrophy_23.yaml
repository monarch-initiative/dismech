genetic:
- name: RNF220
  notes: >-
    RNF220 encodes a RING-finger E3 ubiquitin ligase. The two reported HLD23
    alleles are missense substitutions at adjacent conserved arginine residues,
    p.R363Q and p.R365Q. Both reduce binding to lamin B1, and both lose the
    ability of RNF220 to raise endogenous Olig1 and Olig2 protein levels — the
    two alleles behave the same way in every published assay. No source
    stratifies clinical course, cause of death or survival by allele; the
    clinical reports describe the two together. Only R365Q has been modelled in
    mouse, which is a difference in what has been studied, not a reported
    difference between the alleles.
  gene_term:
    preferred_term: RNF220
    term:
      id: hgnc:25552
      label: RNF220
  relationship_type: CAUSATIVE
  evidence:
  - reference: PMID:33964137
    reference_title: "Biallelic mutations in RNF220 cause laminopathies featuring leukodystrophy, ataxia and deafness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report these two homozygous missense variants (p.R363Q and p.R365Q) in the ubiquitin E3 ligase RNF220 as the underlying cause of this novel form of leukodystrophy with ataxia and sensorineural deafness that includes fibrotic cardiomyopathy and hepatopathy as associated features in seven consanguineous families."
    explanation: >-
      Names both causative alleles, the gene, and the multisystem phenotype
      they produce across seven families.
  - reference: PMID:40594583
    reference_title: Overview of genetic variants in a cohort of Iranian patients with leukodystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In addition, six cases carried homozygote variants in the GJC2, PLEKHG2, RNF220, POLR1C, DEGS1 and ACER3 genes, respectively."
    explanation: >-
      An independent leukodystrophy cohort recovered a homozygous RNF220
      variant, supporting RNF220 as a recurrent cause in this disease group.
      The cohort's own variant was classified as a VUS, so this is corroborating
      rather than independently confirmatory. The paper reports the change at
      the nucleotide level only (NM_018150 c.1088G > A); c.1088 is the second
      base of codon 363, so a CGA to CAA change there would give p.R363Q, one of
      the two recurrent alleles. That is an inference from the coordinates, not
      something the paper states, and it is recorded here rather than curated as
      a protein-level claim.
mechanistic_hypotheses:
- hypothesis_group_id: lamin_b1_nuclear_lamina
  hypothesis_label: HLD23 is a laminopathy acting through impaired RNF220-lamin B1 regulation
  status: EMERGING
  description: >-
    The original delineating proposal: that the primary consequence of the
    RNF220 arginine substitutions is loss of normal regulation of lamin B1 and
    of nuclear lamina architecture, and that the neurodegeneration follows from
    nuclear envelope dysfunction. It is supported by direct binding data, by a
    Drosophila model, and by patient-fibroblast nuclear morphology, but the
    step from abnormal nuclei to hypomyelination specifically has not been
    demonstrated.
  evidence:
  - reference: PMID:33964137
    reference_title: "Biallelic mutations in RNF220 cause laminopathies featuring leukodystrophy, ataxia and deafness."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Mass spectrometry analysis identified lamin B1 as the RNF220 binding protein and co-immunoprecipitation experiments demonstrated reduced binding of both RNF220 mutants to lamin B1."
    explanation: >-
      Establishes the physical interaction and that both disease alleles impair
      it, which is the molecular premise of this hypothesis.
  - reference: PMID:33964137
    reference_title: "Biallelic mutations in RNF220 cause laminopathies featuring leukodystrophy, ataxia and deafness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Overall, our data identify RNF220 as a gene implicated in leukodystrophy with ataxia and sensorineural deafness and document a critical role of RNF220 in the regulation of nuclear lamina."
    explanation: >-
      The authors' own framing of the hypothesis, stated as an interpretation
      of their data rather than a demonstrated causal path to hypomyelination.
- hypothesis_group_id: olig_stabilization_failure
  hypothesis_label: Loss of RNF220-mediated Olig1/Olig2 stabilization causes the hypomyelination
  status: EMERGING
  description: >-
    The competing — or complementary — proposal that the myelin limb of HLD23
    arises cell-autonomously in the oligodendrocyte lineage, because RNF220
    normally maintains Olig1 and Olig2 protein levels through K63-linked
    polyubiquitination and the R365Q allele cannot. This is the better-evidenced
    route for hypomyelination specifically, resting on a knock-in mouse carrying
    the patient allele, but it says nothing about the deafness, liver or cardiac
    limbs.
  evidence:
  - reference: PMID:38324685
    reference_title: "RNF220-mediated K63-linked polyubiquitination stabilizes Olig proteins during oligodendroglial development and myelination."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We were able to replicate leukodystrophy-like symptoms in a pathomimetic RNF220R365Q knock-in mouse model, which represents deregulated K63 ubiquitination of Olig proteins and impediments of oligodendroglial differentiation and myelination."
    explanation: >-
      A mouse carrying the actual patient allele reproduces both the proposed
      molecular defect and the myelin phenotype, which is the strongest support
      for this route.
pathophysiology:
- name: RNF220 Missense Substitution at Conserved Arginine R363/R365
  conforms_to: "cns_myelin_failure#Oligodendrocyte-Lineage or Myelin-Membrane Insult"
  biological_scale: MOLECULAR
  genetic_context:
    allele_type: MISSENSE
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
    description: >-
      Both variants are homozygous germline missense changes. They are curated
      as partial loss of function rather than complete null: the mutant protein
      is expressed and retains partial lamin B1 binding, and the phenotype is
      milder than the profound developmental failure of full RNF220 depletion
      in mouse.
  description: >-
    The initiating lesion. Homozygous p.R363Q or p.R365Q substitutions affect
    adjacent, highly conserved arginine residues of the RNF220 E3 ubiquitin
    ligase. This is the disorder-specific substitution for the module's trigger
    node: RNF220 is oligodendrocyte-essential ubiquitination machinery rather
    than a myelin structural protein or a lipid-degradation enzyme.

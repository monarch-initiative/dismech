- name: Nuclear Lamina Disorganization and Abnormal Nuclear Morphology
  biological_scale: CELLULAR
  description: >-
    Primary skin fibroblasts from HLD23 patients show blebs, herniations and
    invaginations of the nuclear envelope — the cellular signature that places
    this disease among the laminopathies. In Drosophila, RNF220 silencing
    mislocalizes and aggregates the lamin B1 orthologue lamin Dm0 and produces a
    neurodegenerative phenotype.
  biological_processes:
  - preferred_term: nuclear envelope organization
    term:
      id: GO:0006998
      label: nuclear envelope organization
    modifier: DECREASED
  downstream:
  - target: Progressive Neurodegeneration and White Matter Dysfunction
    description: >-
      Nuclear envelope dysfunction is proposed as the route from the RNF220
      lesion to neurodegeneration, by analogy with the other laminopathies.
      The specific step to hypomyelination has not been demonstrated.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:33964137
      reference_title: "Biallelic mutations in RNF220 cause laminopathies featuring leukodystrophy, ataxia and deafness."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We demonstrate that RNF220 silencing in Drosophila melanogaster specifically affects proper localization of lamin Dm0, the fly lamin B1 orthologue, promotes its aggregation and causes a neurodegenerative phenotype, strongly supporting the functional link between RNF220 and lamin B1."
      explanation: >-
        An invertebrate model connects loss of RNF220 to lamin mislocalization
        and neurodegeneration. Curated as INDIRECT because the model is not a
        myelinating vertebrate and does not report hypomyelination.
  evidence:
  - reference: PMID:33964137
    reference_title: "Biallelic mutations in RNF220 cause laminopathies featuring leukodystrophy, ataxia and deafness."

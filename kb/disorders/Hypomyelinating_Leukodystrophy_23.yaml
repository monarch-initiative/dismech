    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole exome sequencing performed in five large consanguineous nuclear families allowed us to identify homozygosity for two recurrent missense variants affecting highly conserved residues of RNF220 as the causative event underlying a novel form of leukodystrophy with ataxia and sensorineural deafness."

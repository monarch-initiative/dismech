- name: RNF220 conditional knockout mouse (oligodendrocyte lineage)
  species: Mouse
  genotype: Rnf220 conditional knockout in oligodendrocyte lineage cells (RNF220-cKO)
  publication: PMID:38324685
  description: >-
    A lineage-restricted knockout used to establish that the myelin defect is
    cell-autonomous to oligodendroglia rather than secondary to disease
    elsewhere. It is not an allelic model of HLD23 — it is a null, whereas
    patients carry partial-loss-of-function missense alleles.

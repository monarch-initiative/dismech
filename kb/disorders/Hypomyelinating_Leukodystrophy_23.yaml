discussions:
- discussion_id: gap_hld23_nonneural_organ_mechanism
  kind: KNOWLEDGE_GAP
  prompt: >-
    By what mechanism do RNF220 missense variants cause sensorineural deafness,
    hepatopathy and cardiomyopathy?
  attaches_to:
  - pathophysiology#Cardiac and Hepatic Involvement
  - pathophysiology#Auditory Pathway Involvement
  rationale: >-
    Three of the four organ systems in this disease's name have no mechanistic
    account at all. Both published mechanisms — reduced lamin B1 binding and
    failed Olig1/Olig2 stabilization — were worked out for the CNS myelin
    phenotype. Olig1/Olig2 are oligodendrocyte transcription factors and cannot
    explain cochlear, hepatic or cardiac disease; the lamin B1 route could in
    principle, since laminopathies commonly involve heart and muscle, but no
    cardiac or hepatic tissue from an HLD23 patient has been examined for
    nuclear envelope pathology. The gap also extends to natural history: no
    published source says which of the four organ limbs is the proximate cause
    of the deaths reported in the second decade, so it is not known whether the
    unexplained limbs or the well-characterised CNS one determine survival.
  proposed_experiments:
  - experiment_id: exp_hld23_nuclear_envelope_heart_liver
    name: Nuclear envelope morphology in HLD23 cardiac and hepatic tissue
    description: >-
      Examine nuclear morphology and lamin B1 distribution in cardiomyocytes and
      hepatocytes from HLD23 autopsy material, or in patient iPSC-derived
      cardiomyocytes and hepatocyte-like cells, using the same blebs and
      invaginations readout applied to patient fibroblasts.
    would_support:
    - pathophysiology#Cardiac and Hepatic Involvement
    - mechanistic_hypotheses#lamin_b1_nuclear_lamina
    supporting_outcome:
    - >-
      Cardiomyocytes and hepatocytes carrying the patient allele show the same
      nuclear blebs, herniations and invaginations seen in patient fibroblasts,
      implicating the lamina lesion in the cardiac and hepatic limbs.
    refuting_outcome:
    - >-
      Patient-derived cardiomyocytes and hepatocytes have normal nuclear
      morphology and lamin B1 distribution, implicating a third RNF220 substrate
      rather than the lamina.
- discussion_id: mismatch_hld23_knockin_mouse_progression
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Why does the RNF220 R365Q knock-in mouse, which carries the exact patient
    allele, not reproduce the progressive ataxia and early death that define the
    human disease?
  attaches_to:
  - animal_models#RNF220 R365Q knock-in mouse (RNF220-QQ)
  - pathophysiology#Progressive Neurodegeneration and White Matter Dysfunction
  rationale: >-
    This is a mismatch rather than a knowledge gap: the model exists, carries the
    correct allele, and reproduces the molecular and myelin phenotypes well, but
    the authors report no survival or walking difference over 12 months against a
    human disease that is lethal in the second decade. The divergence is
    mechanistically informative rather than a technical failure — it suggests the
    lethal component of HLD23 is not the hypomyelination the mouse does
    reproduce, though which limb of the disease does account for the deaths is
    not reported anywhere. It also bounds what the model can be used for: it is a
    myelination model, not a disease-progression or therapeutic-endpoint model.
  proposed_experiments:
  - experiment_id: exp_hld23_qq_mouse_cardiac_hepatic_phenotyping
    name: Longitudinal cardiac and hepatic phenotyping of RNF220-QQ mice
    description: >-
      Serial echocardiography, cardiac histology for fibrosis, and liver
      function assessment in RNF220-QQ mice beyond 12 months, to test whether the
      model lacks the non-CNS limbs entirely or merely develops them later than
      the neurological readouts were scored.
    would_support:
    - pathophysiology#Cardiac and Hepatic Involvement
    supporting_outcome:
    - >-
      RNF220-QQ mice develop cardiac fibrosis and impaired liver function,
      establishing the model for the organ limbs and explaining the survival
      discrepancy as a difference in timing rather than in mechanism.
    refuting_outcome:
    - >-
      Cardiac and hepatic structure and function remain normal at all ages,
      confirming a genuine species difference and indicating that the human
      cardiac and hepatic limbs require a modifier absent in mouse.
notes: >-
  Curated without a deep-research provider report. The Edison/falcon provider
  returned HTTP 402 (account out of credits) and the documented claude_code
  fallback failed to launch, so all content here was assembled from
  directly retrieved primary literature.

  The published literature on this entity is genuinely small. Four papers are
  listed under references; two of them (PMID:33964137 and PMID:38324685) carry
  essentially all the mechanistic content, and one of those is a mouse study.
  The entry is deliberately shaped around that: the CNS myelin chain is well
  evidenced, the nuclear-lamina arm is curated as a hypothesis rather than a
  settled pathway, and the auditory, cardiac and hepatic nodes assert clinical
  involvement with UNKNOWN causal links rather than manufacturing a mechanism.

  PMID:36083980 (Yan et al., Brain 2022) is the second of the two clinical
  reports that PMID:38324685 cites as "(16, 17)" for its human-phenotype
  statements, the first being PMID:33964137. It is listed here so the citation
  chain is complete, but it supports no evidence item: it is a paywalled
  scientific correspondence with no abstract in PubMed or Europe PMC, so no
  exact quote can be verified against a cache. Anyone with institutional access
  should read it — it is the most likely place for additional natural-history
  detail on this entity.

  Natural history: an allele-stratified mortality claim (R365Q homozygotes dying
  of cardiomyopathy in the first decade, R363Q homozygotes surviving into the
  second) was asserted in an earlier version of this entry and has been removed
  throughout. No cited source states it, and PMID:38324685 describes the course
  without stratifying it — severe ataxia in the early teenage years and death in
  the second decade for affected patients as a group. Nothing published names
  the proximate cause of death.

  Naming note: the MONDO and OMIM labels say "dilated cardiomyopathy" while the
  delineating paper (PMID:33964137) describes "fibrotic cardiomyopathy". Both
  descriptions are retained rather than reconciled, since no source states they
  are the same finding.

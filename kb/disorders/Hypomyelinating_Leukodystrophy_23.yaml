    explanation: >-
      Documents the abnormal nuclear morphology in cells taken from affected
      individuals.
- name: Failure of K63-Linked Polyubiquitination and Stabilization of Olig1/Olig2
  biological_scale: MOLECULAR
  description: >-
    RNF220 normally attaches K63-linked polyubiquitin chains to the
    oligodendrocyte transcription factors Olig1 and Olig2, maintaining their
    protein stability. This is a non-degradative, stabilizing ubiquitination —
    not the canonical K48 proteasomal signal — so loss of RNF220 lowers rather
    than raises Olig protein levels. In the R365Q knock-in mouse, forebrain
    polyubiquitination of Olig1 and Olig2 is reduced and both proteins are less
    abundant in isolated progenitor and oligodendrocyte fractions.
  molecular_functions:
  - preferred_term: ubiquitin protein ligase activity
    term:
      id: GO:0061630
      label: ubiquitin protein ligase activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: protein K63-linked ubiquitination
    term:
      id: GO:0070534
      label: protein K63-linked ubiquitination
    modifier: DECREASED
  downstream:
  - target: Oligodendrocyte Progenitor Proliferation and Differentiation Failure
    description: >-
      Depleted Olig1 and Olig2 remove the transcriptional drive that the
      oligodendrocyte lineage depends on.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:38324685
      reference_title: "RNF220-mediated K63-linked polyubiquitination stabilizes Olig proteins during oligodendroglial development and myelination."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "RNF220 regulated K63-linked polyubiquitination to maintain Olig1 and Olig2 protein stability, and this modulation is required for oligodendroglial development and myelination, as well as remyelination."
      explanation: >-
        States the requirement of this specific modification for
        oligodendroglial development.
  evidence:
  - reference: PMID:38324685
    reference_title: "RNF220-mediated K63-linked polyubiquitination stabilizes Olig proteins during oligodendroglial development and myelination."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Furthermore, we showed that Olig1 and Olig2 are two direct ubiquitination substrates of RNF220, and the protein stabilities of these two TFs are maintained by RNF220 through K63-linked polyubiquitination."
    explanation: >-
      Establishes Olig1 and Olig2 as direct substrates and the chain linkage

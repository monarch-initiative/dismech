    into mature oligodendrocytes. In conditional RNF220 knockout mouse corpus
    callosum, BrdU and Ki67 labelling of progenitors is reduced at P3 and mature
    CC1+Sox10+ oligodendrocytes are fewer at P21. This is the module's
    differentiation-arrest node; the arrest, not oligodendrocyte death after
    myelination, is the documented route in HLD23.

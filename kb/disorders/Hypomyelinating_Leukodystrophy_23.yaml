animal_models:
- name: RNF220 R365Q knock-in mouse (RNF220-QQ)
  species: Mouse
  genotype: Rnf220 p.R365Q homozygous knock-in (CRISPR-Cas9)
  publication: PMID:38324685
  description: >-
    A CRISPR-generated mouse carrying the human HLD23 R365Q allele in homozygous
    form. It reproduces the CNS myelin limb of the disease — severe corpus
    callosum hypomyelination on MRI, black-gold staining and electron
    microscopy, reduced myelin protein expression, reduced Olig polyubiquitination
    — but the authors state explicitly that it does not reproduce the full
    patient phenotype, showing no survival or walking deficit over 12 months
    where patients are severely ataxic as teenagers and die in the second decade.
  modeled_mechanisms:
  - target: Deficient CNS Myelin Deposition
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      The knock-in carries the actual patient allele and reproduces
      hypomyelination of the corpus callosum by three independent modalities.
    limitations: >-
      Mouse corpus callosum myelination is the readout; no human CNS tissue
      comparison is available.
    readouts:
    - name: Corpus callosum myelin protein expression (MBP, PLP, MAG, MOG)
      target: Deficient CNS Myelin Deposition
      direction: DECREASED
      interpretation: >-
        Structural myelin proteins are reduced, the molecular correlate of the
        hypomyelination node.
      evidence:
      - reference: PMID:38324685
        reference_title: "RNF220-mediated K63-linked polyubiquitination stabilizes Olig proteins during oligodendroglial development and myelination."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Furthermore, the mRNA and protein levels of myelin-related molecules, including MBP, PLP, MAG, and MOG, were significantly down-regulated in the forebrains of RNF220-QQ mice"
        explanation: >-
          Reports the measurement behind this readout.
    evidence:
    - reference: PMID:38324685
      reference_title: "RNF220-mediated K63-linked polyubiquitination stabilizes Olig proteins during oligodendroglial development and myelination."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Consistent with this finding, BG staining and TEM analyses showed that the axonal fibers of corpus callosum in RNF220-QQ mice were severely hypomyelinated"
      explanation: >-
        Supports treating this model as informative for the hypomyelination
        node.
  - target: Failure of K63-Linked Polyubiquitination and Stabilization of Olig1/Olig2
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      The proposed molecular defect is directly observed in vivo in the animal
      carrying the patient allele.
    limitations: >-
      Measured in mouse forebrain lysates; the equivalent measurement has not
      been made in human patient tissue.
    evidence:
    - reference: PMID:38324685
      reference_title: "RNF220-mediated K63-linked polyubiquitination stabilizes Olig proteins during oligodendroglial development and myelination."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Moreover, in the pathomimetic RNF220R365Q knock-in mouse model, deregulation of ubiquitination and stabilization of the Olig proteins leads to maldevelopment of oligodendroglia, corpus callosum agenesis, and leukodystrophy-like symptoms."
      explanation: >-
        Confirms the molecular defect in the knock-in animal.
  - target: Progressive Neurodegeneration and White Matter Dysfunction
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      The mouse has cognitive deficits and a rotarod abnormality, but not the
      progressive, lethal neurological decline that defines the human disease.
    limitations: >-
      The authors report no significant difference in survival or walking
      performance over a 12-month observation, whereas affected individuals are
      severely ataxic as teenagers and die in the second decade. The model
      therefore cannot be used to study the progressive or lethal component of
      the disease.
    evidence:
    - reference: PMID:38324685
      reference_title: "RNF220-mediated K63-linked polyubiquitination stabilizes Olig proteins during oligodendroglial development and myelination."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "RNF220-QQ mice showed no significant difference in survival and walking performance during our 12-month observation"
      explanation: >-
        The mouse result itself. The authors report it in a sentence that also

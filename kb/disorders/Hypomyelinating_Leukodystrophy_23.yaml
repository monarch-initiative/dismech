name: Hypomyelinating Leukodystrophy 23
creation_date: "2026-09-02T00:00:00Z"
category: Mendelian
description: >-
  Hypomyelinating leukodystrophy 23 (HLD23) is an autosomal recessive
  multisystem leukodystrophy caused by biallelic missense variants in RNF220,
  which encodes a RING-finger E3 ubiquitin ligase. It was delineated in 2021
  from seven consanguineous families carrying one of two recurrent homozygous
  substitutions at adjacent, highly conserved arginines — p.R363Q and p.R365Q.
  The name of the entity is the point of it: the disease is not a
  CNS-restricted hypomyelination but a leukodystrophy with ataxia and
  progressive sensorineural deafness that also carries fibrotic cardiomyopathy
  and hepatopathy. Affected individuals are reported to become severely ataxic
  in the early teenage years and to die in the second decade; no published
  source names the proximate cause of death or reports survival separately for
  the two alleles.

  Two mechanistic routes out of the same RNF220 lesion are documented, and they
  are not the same claim. The first is nuclear: mass spectrometry identified
  lamin B1 as an RNF220 binding partner, both mutants bind it less well, and
  patient fibroblasts show the nuclear blebs, herniations and invaginations
  characteristic of a laminopathy — which is why the original report classified
  HLD23 among the laminopathies rather than among the classical myelin-protein
  leukodystrophies. The second is oligodendroglial: RNF220 stabilises the
  transcription factors Olig1 and Olig2 by K63-linked polyubiquitination, and a
  knock-in mouse carrying the patient R365Q allele loses that stabilisation,
  fails oligodendrocyte progenitor proliferation and differentiation, and is
  severely hypomyelinated. What has not been shown is how either route produces
  the deafness, the hepatopathy or the cardiomyopathy; those three limbs of the
  disease name are clinically established and mechanistically unexplained, and
  the knock-in mouse does not reproduce them.

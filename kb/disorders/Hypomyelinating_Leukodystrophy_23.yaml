      snippet: "In this study, we found that the E3 ubiquitin ligase RNF220 is required for oligodendroglial development, and its specific depletion in OL lineage cells impairs OPC proliferation, differentiation, subsequent myelination, as well as remyelination after demyelinating injury in the adult mouse brains."

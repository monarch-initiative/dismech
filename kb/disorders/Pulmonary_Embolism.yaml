name: Pulmonary Embolism
creation_date: "2026-08-10T03:40:00Z"
category: Acquired
disease_term:
  preferred_term: pulmonary embolism
  term:
    id: MONDO:0005279
    label: pulmonary embolism
description: >
  Acute obstruction of the pulmonary arterial circulation by embolic material, in the great
  majority of cases a thrombus that formed in the deep veins and then dislodged. The organising
  fact of the disease is that the embolus is not what kills. Death in the first hours comes from
  the right ventricle, which is a thin-walled chamber built for a low-pressure circuit and has no
  reserve for an afterload that appears in minutes. Everything clinically decisive about acute
  pulmonary embolism follows from that: severity tracks right ventricular function rather than
  clot burden, risk stratification is built on right ventricular imaging and myocardial
  biomarkers rather than on the size of the filling defect, and reperfusion is offered to the
  patients whose right ventricle is failing rather than to those with the most extensive
  disease. A second consequence of the anatomy runs the other way. The lung is supplied twice,
  by the pulmonary and the bronchial arteries, so occluding a pulmonary artery usually does not
  infarct the tissue it supplies. That is the opposite of what happens in the coronary or
  cerebral circulation, and it is why infarction is the wrong default model for this disease
  even though the word survives in its older names.
parents:
- pulmonary artery disease
- venous thromboembolism

classifications:
  harrisons_chapter:
  - classification_value: CARDIOVASCULAR
    notes: >-
      Curated as cardiovascular because the mechanism that determines outcome is haemodynamic and
      cardiac. The presentation is respiratory and the diagnosis is made by chest imaging, so a
      respiratory classification would also be defensible, but it would misplace the organ whose
      failure the disease is graded by.

has_subtypes:
- name: High-risk PE
  display_name: High-risk pulmonary embolism
  description: >
    Pulmonary embolism with haemodynamic instability. This is the stratum in which right
    ventricular failure has already progressed to systemic hypotension or arrest, and the one in
    which reperfusion is offered without further stratification. It is defined by the patient's
    circulation rather than by the anatomy of the clot.
- name: Intermediate-risk PE
  display_name: Intermediate-risk pulmonary embolism
  description: >
    Normotensive pulmonary embolism with imaging evidence of right ventricular dysfunction and
    with myocardial biomarker elevation. Mechanistically this is the interesting stratum, because
    the right ventricle is demonstrably injured while the systemic circulation is still being
    maintained. It is the population in which fibrinolysis was formally tested and found to trade
    prevented decompensation for bleeding.
- name: Low-risk PE
  display_name: Low-risk pulmonary embolism
  description: >
    Normotensive pulmonary embolism without right ventricular dysfunction or biomarker
    elevation. Anticoagulation alone, and increasingly outpatient management, on the reasoning
    that the mechanism which causes early death is absent.

pathophysiology:
- name: Prothrombotic venous context
  biological_scale: ORGANISM
  conforms_to: "thrombogenesis#Virchow-Triad Prothrombotic Context"
  description: >
    Stasis, endothelial injury, and a hypercoagulable state, singly or together, create the
    conditions in which a venous thrombus forms. In pulmonary embolism these are usually acquired
    and transient, such as surgery, immobilisation, pregnancy, oestrogen exposure, or
    malignancy, and they are frequently layered on an inherited thrombophilic background. The
    node is placed first because it is the only part of the causal chain that prophylaxis can act
    on, and because it is what distinguishes a provoked from an unprovoked event, which in turn
    determines how long anticoagulation continues.
  downstream:
  - target: Deep venous thrombus formation
    causal_link_type: DIRECT
    description: >
      The prothrombotic conditions are what permit a thrombus to nucleate and propagate rather
      than being cleared.

- name: Deep venous thrombus formation
  biological_scale: TISSUE
  conforms_to: "thrombogenesis#Pathological Fibrin-Platelet Thrombus Formation"
  description: >
    Platelet adhesion and coagulation-cascade activation build a fibrin-platelet thrombus, most
    often beginning in a valve pocket of a lower-limb or pelvic deep vein. This node is the
    disease of deep vein thrombosis, and pulmonary embolism only becomes a separate clinical
    entity at the next step. Curating it here rather than treating it as an external precondition
    is deliberate, because anticoagulation acts on this node and not on any node downstream of
    it.
  cell_types:
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  - preferred_term: endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  biological_processes:
  - preferred_term: blood coagulation, fibrin clot formation
    term:
      id: GO:0072378
      label: blood coagulation, fibrin clot formation
    modifier: INCREASED
  - preferred_term: regulation of blood coagulation
    term:
      id: GO:0030193
      label: regulation of blood coagulation
    modifier: DECREASED
  locations:
  - preferred_term: deep vein
    term:
      id: UBERON:0035552
      label: deep vein
  downstream:
  - target: Embolization to the pulmonary arterial tree
    causal_link_type: DIRECT
    description: >
      A formed venous thrombus is the material that embolises. Most venous thrombi never do, so
      this edge describes a possible fate of the thrombus rather than an obligatory one.

- name: Embolization to the pulmonary arterial tree
  biological_scale: ORGANISM
  conforms_to: "thrombogenesis#Venous Thrombus Embolization to Pulmonary Arteries"
  description: >
    A thrombus fragment detaches and travels through the inferior vena cava, right atrium, and
    right ventricle to lodge in the pulmonary arteries, at a level determined by its size. This
    is the step that converts a limb disease into a cardiopulmonary emergency, and it is
    mechanistically distinct from thrombus formation rather than a continuation of it. Which
    thrombi embolise is not simply a function of how prothrombotic the patient is, and one
    pooled analysis found the commonest inherited thrombophilia to be relatively less frequent
    among patients presenting with pulmonary embolism than among those with deep vein thrombosis
    alone.
  locations:
  - preferred_term: pulmonary artery
    term:
      id: UBERON:0002012
      label: pulmonary artery
  evidence:
  - reference: PMID:11583312
    reference_title: "Combined effect of factor V Leiden and prothrombin 20210A on the risk of venous thromboembolism--pooled analysis of 8 case-control studies including 2310 cases and 3204 controls."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "we also confirmed that the frequency of factor V Leiden was lower in patients with pulmonary embolism than in patients with deep vein thrombosis without PE (odds ratio 0.69). Conversely, factor II G20210A mutation was equally balanced in both patient groups."
    explanation: >-
      Supports the claim that embolization is a step with its own determinants rather than a
      simple function of thrombotic tendency, since two thrombophilias with similar effects on
      thrombosis risk are distributed differently between embolic and non-embolic presentations.
      Graded PARTIAL because the observation establishes that the propensities differ without
      identifying what makes a thrombus embolise.
  downstream:
  - target: Acute rise in pulmonary vascular resistance
    causal_link_type: DIRECT
    description: >
      Lodged embolic material physically removes cross-sectional area from the pulmonary arterial
      bed.
  - target: Ventilation-perfusion mismatch and increased dead space
    causal_link_type: DIRECT
    description: >
      Segments that remain ventilated but lose perfusion become dead space at the moment of
      occlusion.
  - target: Pulmonary infarction
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >
      Occlusion causes tissue necrosis only in the minority of cases where the bronchial arterial
      supply cannot compensate, so the intervening determinant is the adequacy of that second
      circulation rather than the occlusion itself.

- name: Acute rise in pulmonary vascular resistance
  biological_scale: ORGANISM
  description: >
    Loss of pulmonary arterial cross-sectional area raises pulmonary arterial pressure
    immediately. Pressure and resistance do not rise together, which matters because they are
    often treated as interchangeable. In a controlled porcine model of successive emboli,
    pulmonary pressure rose after the very first embolus while pulmonary vascular resistance and
    right ventricular arterial elastance did not rise until the third, so early pressure
    elevation reflects obstruction being absorbed by a still-compensating circuit rather than the
    afterload burden the right ventricle ultimately faces. A humoral contribution from
    platelet-derived vasoconstrictors is widely proposed as an amplifier of the mechanical
    obstruction. This entry does not cite evidence for that component and does not assert it.
  locations:
  - preferred_term: pulmonary artery
    term:
      id: UBERON:0002012
      label: pulmonary artery
  evidence:
  - reference: PMID:38745282
    reference_title: "Immediate cardiopulmonary responses to consecutive pulmonary embolism: a randomized, controlled, experimental study."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Pulmonary pressures increased after the initial PE administration"
    explanation: >-
      Establishes that pulmonary arterial pressure rises from the first embolic insult. Evidence
      source is MODEL_ORGANISM because the measurements are from an anaesthetised porcine
      preparation with catheter-delivered emboli.
  - reference: PMID:38745282
    reference_title: "Immediate cardiopulmonary responses to consecutive pulmonary embolism: a randomized, controlled, experimental study."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Conversely, RV arterial elastance and pulmonary vascular resistance was not increased after the first PE, but after three PEs an increase was observed (p = 0.0103 and p = 0.0015, respectively)."
    explanation: >-
      Separates the pressure response from the resistance and afterload response, which is the
      basis for modelling this node distinctly from the right ventricular afterload node
      downstream of it.
  downstream:
  - target: Right ventricular afterload mismatch and dilation
    causal_link_type: DIRECT
    description: >
      Sustained elevation of the resistance the right ventricle pumps against is what the chamber
      must then accommodate.

- name: Right ventricular afterload mismatch and dilation
  biological_scale: TISSUE
  description: >
    The right ventricle is a thin-walled chamber adapted to a low-resistance circuit, and it
    cannot acutely generate the pressures a hypertrophied chamber can. Faced with an afterload
    that appears over minutes it dilates, and wall stress rises. Dilation is a compensatory
    response before it is a failure state, and the same porcine model shows the sequence
    directly. Dilation occurs from the earliest emboli while ejection fraction is preserved, and
    only with further embolic burden does contractile performance fall. This is why a dilated
    right ventricle on imaging is a risk marker rather than a diagnosis of shock.
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  locations:
  - preferred_term: heart right ventricle
    term:
      id: UBERON:0002080
      label: heart right ventricle
  evidence:
  - reference: PMID:38745282
    reference_title: "Immediate cardiopulmonary responses to consecutive pulmonary embolism: a randomized, controlled, experimental study."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "RV dilatation occurred following initial PEs, while RV ejection fraction declined after the third PE (p = 0.004)."
    explanation: >-
      Directly separates dilation from contractile failure in time, supporting dilation as the
      earlier, compensatory event modelled at this node. Evidence source is MODEL_ORGANISM
      because this is a porcine experimental preparation.
  downstream:
  - target: Right ventricular ischaemia and contractile failure
    causal_link_type: DIRECT
    description: >
      Raised wall stress increases myocardial oxygen demand while dilation and systemic
      hypotension reduce the perfusion gradient that supplies it.
  - target: Ventricular interdependence and impaired left ventricular filling
    causal_link_type: DIRECT
    description: >
      A dilated, pressure-loaded right ventricle displaces the interventricular septum into the
      left ventricle within the shared pericardial space.

- name: Right ventricular ischaemia and contractile failure
  biological_scale: TISSUE
  description: >
    Right ventricular myocardium becomes ischaemic in the absence of any coronary disease. Demand
    rises with wall stress while supply falls, because right coronary perfusion depends on the
    gradient between systemic pressure and right ventricular cavity pressure, and pulmonary
    embolism moves both in the wrong direction. The resulting myocardial injury is measurable as
    troponin release, which is why a biomarker of myocyte necrosis is a risk-stratification tool
    in a disease of the lungs. Once contractile failure is established the cascade is
    self-reinforcing, and this is the mechanism behind the observation that a large share of
    deaths occur within the first hour.
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  locations:
  - preferred_term: heart right ventricle
    term:
      id: UBERON:0002080
      label: heart right ventricle
  evidence:
  - reference: PMID:11888976
    reference_title: "Major pulmonary embolism: review of a pathophysiologic approach to the golden hour of hemodynamically significant pulmonary embolism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In either case, the presence of shock defines a threefold to sevenfold increase in mortality, with a majority of deaths occurring within 1 h of presentation."
    explanation: >-
      Establishes that mortality is concentrated in the first hour once the circulation has
      failed, which is the clinical signature of a self-reinforcing haemodynamic cascade rather
      than of progressive respiratory failure.
  downstream:
  - target: Ventricular interdependence and impaired left ventricular filling
    causal_link_type: DIRECT
    description: >
      A failing right ventricle delivers less blood to the pulmonary circulation and therefore
      less to the left heart.

- name: Ventricular interdependence and impaired left ventricular filling
  biological_scale: ORGANISM
  description: >
    The two ventricles share a septum and a pericardium, so right ventricular dilation and
    pressure overload bow the septum leftwards and physically restrict left ventricular
    diastolic filling. Cardiac output falls even though the left ventricle is contracting
    normally, producing obstructive shock. The causal direction has been demonstrated by
    intervention rather than only inferred from imaging. Relieving the pulmonary arterial
    obstruction mechanically reduces septal bowing and simultaneously increases left ventricular
    volume and improves transmitral filling, and septal curvature tracks both pulmonary pressure
    and left ventricular filling pressure.
  locations:
  - preferred_term: heart right ventricle
    term:
      id: UBERON:0002080
      label: heart right ventricle
  evidence:
  - reference: PMID:41984155
    reference_title: "Mechanical thrombectomy improves left ventricular filling in intermediate-high risk pulmonary embolism: the role of ventricular interdependence."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Right ventricular (RV) volumes and septal bowing decreased, whereas left ventricular (LV) volumes and transmitral filling parameters improved (E/e', p = 0.0002)."
    explanation: >-
      Shows the interdependence relationship reversing when the upstream obstruction is removed,
      which is stronger evidence for the causal direction than a cross-sectional association
      between septal position and low output.
  - reference: PMID:41984155
    reference_title: "Mechanical thrombectomy improves left ventricular filling in intermediate-high risk pulmonary embolism: the role of ventricular interdependence."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Septal curvature strongly correlated with sPAP (r = 0.84) and LV filling pressure (r =  - 0.51 with E/e'), indicating its potential as a surrogate marker linking RV pressure overload to impaired LV diastolic filling."
    explanation: >-
      Quantifies the septum as the mechanical link between right-sided pressure overload and
      left-sided filling impairment, which is the specific claim this node makes.

- name: Ventilation-perfusion mismatch and increased dead space
  biological_scale: ORGANISM
  description: >
    Occluded segments continue to be ventilated but are no longer perfused, so they become
    alveolar dead space, while blood is redistributed to the remaining vasculature at higher flow
    per unit of alveolus. The result is hypoxaemia with hypocapnia, since the patient
    hyperventilates in response. This arm runs in parallel with the haemodynamic arm rather than
    downstream of it, and it is the source of the presenting symptoms. It is not, however, what
    determines survival, which is the central asymmetry of the disease.
  locations:
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  evidence:
  - reference: PMID:38745282
    reference_title: "Immediate cardiopulmonary responses to consecutive pulmonary embolism: a randomized, controlled, experimental study."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Acute pulmonary embolism (PE) induces ventilation-perfusion mismatch and hypoxia and increases pulmonary pressure and right ventricular (RV) afterload, entailing potentially fatal RV failure within a short timeframe."
    explanation: >-
      States the parallel gas-exchange and haemodynamic consequences of the same embolic event,
      which is the structure this node and the afterload node together represent.
  - reference: PMID:38745282
    reference_title: "Immediate cardiopulmonary responses to consecutive pulmonary embolism: a randomized, controlled, experimental study."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Ventilatory variables exhibited a more direct association with clot burden."
    explanation: >-
      Supports the gas-exchange arm scaling with embolic burden more directly than the
      haemodynamic arm does, which is why symptom severity is a poor guide to haemodynamic risk.

- name: Pulmonary infarction
  biological_scale: TISSUE
  description: >
    Necrosis of lung distal to an occluded pulmonary artery. It is the exception rather than the
    rule, because the lung receives a second arterial supply from the bronchial circulation that
    can sustain the tissue when the pulmonary supply is lost. Infarction is accordingly
    associated with smaller, more distal emboli and with conditions that limit bronchial
    collateral flow, and it produces the pleuritic pain and haemoptysis that the classical
    description of the disease was built around. Its true frequency is uncertain, and is higher
    in post-mortem series than in series of survivors, which is itself informative about
    ascertainment.
  locations:
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  evidence:
  - reference: PMID:36013155
    reference_title: "Pulmonary Embolism Presenting with Pulmonary Infarction: Update and Practical Review of Literature Data."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The real incidence of PI could be underestimated considering only non-fatal PE presentation. However, following postmortem examination, the prevalence of PI is considerably higher."
    explanation: >-
      Supports the statement that the frequency of infarction is ascertainment-dependent and
      higher at autopsy, which is why this entry does not attach a single frequency figure to the
      node.

- name: Thrombus resolution versus fibrotic organization
  biological_scale: TISSUE
  description: >
    Most emboli resolve. Endogenous fibrinolysis, assisted by anticoagulation preventing further
    accretion, clears the pulmonary arterial bed over weeks to months. In a minority the material
    is not cleared but organises into fibrotic tissue incorporated into the vessel wall, giving
    fixed obstruction and chronic thromboembolic pulmonary hypertension. The risk is
    concentrated early and is higher after an unprovoked event, and it does not accumulate
    indefinitely.
  biological_processes:
  - preferred_term: fibrinolysis
    term:
      id: GO:0042730
      label: fibrinolysis
    modifier: DECREASED
  locations:
  - preferred_term: pulmonary artery
    term:
      id: UBERON:0002012
      label: pulmonary artery
  evidence:
  - reference: PMID:15163775
    reference_title: "Incidence of chronic thromboembolic pulmonary hypertension after pulmonary embolism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No cases occurred after two years among the patients with more than two years of follow-up data."
    explanation: >-
      Supports the claim that the risk of chronic thromboembolic pulmonary hypertension is
      front-loaded rather than cumulative, which is what a failure of early resolution rather
      than a progressive arteriopathy predicts.
  - reference: PMID:15163775
    reference_title: "Incidence of chronic thromboembolic pulmonary hypertension after pulmonary embolism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The following increased the risk of CTPH: a previous pulmonary embolism (odds ratio, 19.0), younger age (odds ratio, 1.79 per decade), a larger perfusion defect (odds ratio, 2.22 per decile decrement in perfusion), and idiopathic pulmonary embolism at presentation (odds ratio, 5.70)."
    explanation: >-
      Identifies embolic burden and recurrence as the dominant risk factors, consistent with
      failure of clearance of thromboembolic material as the mechanism at this node.
  notes: >
    No conformance is declared to the pulmonary_vascular_remodeling module. That module's central
    effector node describes obstruction produced by pulmonary artery smooth muscle cell
    proliferation, neointima formation, and plexiform lesions. The obstruction curated here is
    organised fibrotic thromboembolic material, which is a different lesion arrived at by a
    different route. Chronic thromboembolic pulmonary hypertension is also reported to carry a
    small-vessel arteriopathy in territories that were never occluded, and if that arm were
    curated with its own evidence it would be a legitimate conformance target. This entry does
    not cite evidence for it and therefore does not assert it.

phenotypes:
- category: Symptom
  name: Dyspnoea
  description: >
    Breathlessness, usually of rapid onset, is the commonest presenting symptom. Its diagnostic
    value is limited in both directions. In the PIOPED II cohort dyspnoea or tachypnoea was
    present in 92 percent of patients whose largest embolus was in a main or lobar pulmonary
    artery, but the same study records that dyspnoea can be absent even in patients who have
    already collapsed, so its absence does not exclude severe disease.
  phenotype_term:
    preferred_term: Dyspnea
    term:
      id: HP:0002094
      label: Dyspnea
    temporality: ACUTE
  evidence:
  - reference: PMID:17904458
    reference_title: "Clinical characteristics of patients with acute pulmonary embolism: data from PIOPED II."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In patients with pulmonary embolism in the main or lobar pulmonary arteries, dyspnea or tachypnea occurred in 92%, but the largest pulmonary embolism was in the segmental pulmonary arteries in only 65%."
    explanation: >-
      Quantifies how often the symptom is present and shows that it becomes markedly less
      reliable with more distal emboli. No frequency band is assigned to this phenotype because
      the figure is for dyspnoea or tachypnoea together and is stratified by embolus location.
  - reference: PMID:17904458
    reference_title: "Clinical characteristics of patients with acute pulmonary embolism: data from PIOPED II."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Dyspnea may be absent even in patients with circulatory collapse."
    explanation: >-
      Records the counterintuitive dissociation between the presenting symptom and haemodynamic
      severity. Graded PARTIAL because it qualifies the phenotype rather than establishing it.

- category: Symptom
  name: Pleuritic chest pain
  description: >
    Sharp chest pain worsened by inspiration, arising from pleural inflammation over an infarcted
    or ischaemic peripheral segment. It is therefore a symptom of the distal, infarcting form of
    the disease rather than of the central, haemodynamically dangerous form, which is why the
    patients who look most uncomfortable are not necessarily the ones at highest risk.
  phenotype_term:
    preferred_term: Pleuritic chest pain
    term:
      id: HP:0033771
      label: Pleuritic chest pain

- category: Sign
  name: Tachypnoea
  description: >
    Increased respiratory rate, driven by dead-space ventilation and hypoxaemia. It is one of the
    most consistently present signs and contributes the hypocapnia seen on blood gases.
  phenotype_term:
    preferred_term: Tachypnea
    term:
      id: HP:0002789
      label: Tachypnea
  evidence:
  - reference: PMID:17904458
    reference_title: "Clinical characteristics of patients with acute pulmonary embolism: data from PIOPED II."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In patients with pulmonary embolism in the main or lobar pulmonary arteries, dyspnea or tachypnea occurred in 92%, but the largest pulmonary embolism was in the segmental pulmonary arteries in only 65%."
    explanation: >-
      The same combined figure supports tachypnoea as a common presenting sign in proximal
      disease. No frequency band is assigned, because the number is a composite.

- category: Sign
  name: Tachycardia
  description: >
    Sinus tachycardia, the compensatory response to a falling stroke volume. It is included in
    every validated clinical prediction rule for the disease.
  phenotype_term:
    preferred_term: Tachycardia
    term:
      id: HP:0001649
      label: Tachycardia

- category: Sign
  name: Hypoxaemia
  description: >
    Reduced arterial oxygenation from ventilation-perfusion mismatch. It is typically accompanied
    by hypocapnia rather than hypercapnia, because minute ventilation rises.
  phenotype_term:
    preferred_term: Hypoxemia
    term:
      id: HP:0012418
      label: Hypoxemia

- category: Symptom
  name: Haemoptysis
  description: >
    Coughing of blood, a consequence of alveolar haemorrhage into an infarcted segment. Like
    pleuritic pain it marks the peripheral infarcting presentation rather than central
    obstruction.
  phenotype_term:
    preferred_term: Hemoptysis
    term:
      id: HP:0002105
      label: Hemoptysis

- category: Sign
  name: Syncope
  description: >
    Transient loss of consciousness from an abrupt fall in cardiac output. It is a haemodynamic
    sign rather than a respiratory one, and it identifies patients whose right ventricle is
    already failing.
  phenotype_term:
    preferred_term: Syncope
    term:
      id: HP:0001279
      label: Syncope

- category: Sign
  name: Hypotension and obstructive shock
  description: >
    Systemic hypotension, the defining feature of high-risk disease. It is produced by impaired
    left ventricular filling rather than by impaired left ventricular contraction, which is why
    the failing chamber and the hypotensive circulation are on opposite sides of the heart.
  phenotype_term:
    preferred_term: Hypotension
    term:
      id: HP:0002615
      label: Hypotension
    severity: SEVERE
  evidence:
  - reference: PMID:11888976
    reference_title: "Major pulmonary embolism: review of a pathophysiologic approach to the golden hour of hemodynamically significant pulmonary embolism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In either case, the presence of shock defines a threefold to sevenfold increase in mortality, with a majority of deaths occurring within 1 h of presentation."
    explanation: >-
      Establishes shock as the prognostically decisive phenotype and quantifies the mortality
      difference it marks.

- category: Sign
  name: Elevated jugular venous pressure
  description: >
    Distension of the jugular veins reflecting raised right atrial pressure in a failing,
    pressure-loaded right ventricle. It is one of the few bedside findings that points at the
    haemodynamic rather than the respiratory arm of the disease.
  phenotype_term:
    preferred_term: Elevated jugular venous pressure
    term:
      id: HP:0030848
      label: Elevated jugular venous pressure

- category: Sign
  name: Concurrent deep venous thrombosis
  description: >
    Unilateral limb swelling and tenderness from the source thrombus. Its presence supports the
    diagnosis, but its absence is uninformative, because a thrombus that has embolised completely
    leaves nothing behind to find.
  phenotype_term:
    preferred_term: Deep venous thrombosis
    term:
      id: HP:0002625
      label: Deep venous thrombosis

- category: Cardiovascular
  name: Right ventricular failure
  description: >
    Dilation and contractile failure of the right ventricle. It is the phenotype the disease is
    graded by and the direct clinical readout of the pathophysiology nodes above.
  phenotype_term:
    preferred_term: Right ventricular failure
    term:
      id: HP:0001708
      label: Right ventricular failure
    temporality: ACUTE
  evidence:
  - reference: PMID:40312123
    reference_title: "Managing right ventricular failure in the setting of pulmonary embolism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pulmonary embolism (PE) has a significant impact on right-sided heart function. Clinical presentation can range from no involvement of the right ventricle to right ventricular dysfunction, cardiogenic shock, and even cardiac arrest."
    explanation: >-
      States the spectrum of right ventricular involvement, from none to arrest, which is the
      range this phenotype covers.

- category: Cardiovascular
  name: Post-pulmonary embolism syndrome
  description: >
    Persistent breathlessness, exercise intolerance, and impaired quality of life after an
    apparently treated pulmonary embolism, frequently without pulmonary hypertension or right
    ventricular abnormality to account for it. It is far commoner than chronic thromboembolic
    pulmonary hypertension and is the outcome most survivors actually live with, yet it has no
    single diagnostic test, which is why it was long treated as a complaint rather than a
    syndrome. A measurable subset does have persistent right ventricular dysfunction, and that
    subset carries excess recurrence and mortality, so the label spans a functional complaint and
    a haemodynamic finding that are not the same thing.
  phenotype_term:
    preferred_term: Dyspnea
    term:
      id: HP:0002094
      label: Dyspnea
    temporality: CHRONIC
  evidence:
  - reference: PMID:41765088
    reference_title: "Post-pulmonary embolism syndrome: a practical narrative review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Post-pulmonary embolism syndrome (PPES) describes the spectrum of long-term sequelae following acute pulmonary embolism (PE), including persistent dyspnea, exercise intolerance, and psychological impairment, often in the absence of pulmonary hypertension (PH) or right ventricular (RV) abnormalities."
    explanation: >-
      Defines the syndrome and makes explicit that it usually occurs without the haemodynamic
      abnormality one would expect to find, which is what distinguishes it from chronic
      thromboembolic pulmonary hypertension.
  - reference: PMID:41765088
    reference_title: "Post-pulmonary embolism syndrome: a practical narrative review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Persistent RV dysfunction occurs in up to 18% of patients beyond three months and is associated with recurrent venous thromboembolism (VTE) and PE-related mortality."
    explanation: >-
      Quantifies the measurable subset and shows it is prognostically meaningful rather than an
      incidental finding. No frequency band is assigned, since the figure is an upper bound.
  notes: >
    The binding is to Dyspnea with a CHRONIC qualifier. HPO has no term for post-pulmonary
    embolism syndrome as an entity, and the syndrome is a composite of persistent breathlessness,
    exercise intolerance, and psychological impairment that no single HPO term covers, so the
    dominant symptom carries the binding and the composite is described in prose.

- category: Cardiovascular
  name: Chronic thromboembolic pulmonary hypertension
  description: >
    Persistent pulmonary hypertension from unresolved, organised thromboembolic obstruction,
    presenting months to years later with exertional breathlessness. It is the one chronic
    outcome of an otherwise acute disease, and it is potentially curable by surgical
    endarterectomy, which makes recognising it consequential rather than merely prognostic.
  phenotype_term:
    preferred_term: Pulmonary arterial hypertension
    term:
      id: HP:0002092
      label: Pulmonary arterial hypertension
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:15163775
    reference_title: "Incidence of chronic thromboembolic pulmonary hypertension after pulmonary embolism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The cumulative incidence of symptomatic CTPH was 1.0 percent (95 percent confidence interval, 0.0 to 2.4) at six months, 3.1 percent (95 percent confidence interval, 0.7 to 5.5) at one year, and 3.8 percent (95 percent confidence interval, 1.1 to 6.5) at two years."
    explanation: >-
      Quantifies the cumulative incidence after an index pulmonary embolism in a prospective
      cohort.
  notes: >
    The HPO term bound here is Pulmonary arterial hypertension, which is a broader concept than
    the chronic thromboembolic form and does not encode the thromboembolic aetiology. HPO has no
    term specific to chronic thromboembolic pulmonary hypertension, so the aetiology is carried
    by the phenotype name and description rather than by the binding.

genetic:
- name: F5
  gene_term:
    preferred_term: F5
    term:
      id: hgnc:3542
      label: F5
  relationship_type: SUSCEPTIBILITY
  variant_origin: GERMLINE
  notes: >
    Factor V Leiden, the commonest inherited thrombophilia in European-ancestry populations,
    removes an activated protein C cleavage site so that activated factor V persists. It raises
    the risk of venous thrombosis several-fold and interacts strongly with oestrogen exposure.
    Its relationship to pulmonary embolism specifically is more complicated than its relationship
    to venous thrombosis, since it is relatively less frequent among embolic than among
    non-embolic presentations.
  evidence:
  - reference: PMID:11583312
    reference_title: "Combined effect of factor V Leiden and prothrombin 20210A on the risk of venous thromboembolism--pooled analysis of 8 case-control studies including 2310 cases and 3204 controls."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Odds ratios for VTE were 4.9 (95% CI; 4.1-5.9) for the factor V Leiden and 3.8 (3.0-4.9) for the factor II G20210A mutation."
    explanation: >-
      Quantifies the effect size for venous thromboembolism in a pooled analysis of eight
      case-control studies.
  - reference: PMID:11583312
    reference_title: "Combined effect of factor V Leiden and prothrombin 20210A on the risk of venous thromboembolism--pooled analysis of 8 case-control studies including 2310 cases and 3204 controls."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In factor V Leiden carriers using OC, the odds ratio for VTE was 10.25 (5.69-1 8.45)."
    explanation: >-
      Quantifies the gene-environment interaction with combined oral contraceptive use, which is
      the clinically important consequence of carrier status.

- name: F2
  gene_term:
    preferred_term: F2
    term:
      id: hgnc:3535
      label: F2
  relationship_type: SUSCEPTIBILITY
  variant_origin: GERMLINE
  notes: >
    The prothrombin G20210A variant lies in the 3-prime untranslated region and raises circulating
    prothrombin. Unlike factor V Leiden it is distributed evenly between embolic and non-embolic
    venous thromboembolism.
  evidence:
  - reference: PMID:11583312
    reference_title: "Combined effect of factor V Leiden and prothrombin 20210A on the risk of venous thromboembolism--pooled analysis of 8 case-control studies including 2310 cases and 3204 controls."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The odds ratio for venous thrombosis in double heterozygotes was 20.0 (11.1-36.1)."
    explanation: >-
      Quantifies the combined effect with factor V Leiden, showing that the two variants compound
      rather than merely coexist.

- name: PROC
  gene_term:
    preferred_term: PROC
    term:
      id: hgnc:9451
      label: PROC
  relationship_type: SUSCEPTIBILITY
  variant_origin: GERMLINE
  notes: >
    Loss-of-function variants cause protein C deficiency. Together with protein S and antithrombin
    deficiency these are individually rarer than the common risk alleles but carry higher
    penetrance, and they belong to the mechanistic mirror image of factor V Leiden. One removes
    the target of the anticoagulant protease, the other removes the protease.

- name: PROS1
  gene_term:
    preferred_term: PROS1
    term:
      id: hgnc:9456
      label: PROS1
  relationship_type: SUSCEPTIBILITY
  variant_origin: GERMLINE
  notes: >
    Loss-of-function variants cause protein S deficiency, removing the cofactor that activated
    protein C requires.

- name: SERPINC1
  gene_term:
    preferred_term: SERPINC1
    term:
      id: hgnc:775
      label: SERPINC1
  relationship_type: SUSCEPTIBILITY
  variant_origin: GERMLINE
  notes: >
    Loss-of-function variants cause antithrombin deficiency, generally regarded as the
    highest-risk of the classical inherited thrombophilias. It is also the target through which
    heparins act, so the deficiency and the drug converge on the same protein.

biochemical:
- name: D-dimer
  notes: >
    A fibrin degradation product, raised whenever fibrin is being formed and lysed anywhere in the
    body. Its role in this disease is entirely as a rule-out test. It is sensitive and
    unspecific, so a negative result in a patient with low pretest probability excludes the
    diagnosis while a positive result means very little on its own. No numeric performance
    figures are recorded here because no cited reference in this entry reports them.

- name: Cardiac troponin
  notes: >
    A marker of myocyte necrosis, elevated here by right ventricular ischaemia rather than by
    coronary disease. It is not used diagnostically but is central to risk stratification, and
    its presence is one of the two criteria that define the intermediate-risk stratum.

- name: B-type natriuretic peptide
  notes: >
    Released in response to ventricular wall stretch, and therefore a biochemical readout of the
    right ventricular dilation node. Like troponin it stratifies risk rather than establishing
    the diagnosis.

environmental:
- name: Immobilisation and surgery
  description: >
    Prolonged immobility and major surgery, especially orthopaedic surgery of the hip and knee,
    are the archetypal acquired provoking factors. They act through stasis and through
    tissue-factor-mediated activation of coagulation, and they are the setting in which
    mechanical and pharmacological prophylaxis is applied.
  influences_mechanisms:
  - target: Prothrombotic venous context
    environmental_effect: PREDISPOSES
    causal_link_type: DIRECT
    description: >
      Immobility produces venous stasis and surgical tissue injury activates coagulation, which
      are two of the three components of the prothrombotic context node.

- name: Oestrogen exposure
  exposure_term:
    preferred_term: exposure to estrogens
    term:
      id: ECTO:9000010
      label: exposure to estrogens
  description: >
    Combined oral contraceptives and hormone replacement therapy raise the risk of venous
    thromboembolism, and they do so multiplicatively rather than additively in carriers of
    inherited thrombophilia. This is the best-quantified gene-environment interaction in the
    disease and the reason thrombophilia status changes contraceptive counselling.
  influences_mechanisms:
  - target: Prothrombotic venous context
    environmental_effect: PREDISPOSES
    causal_link_type: DIRECT
    description: >
      Oestrogen exposure shifts the coagulation balance and compounds the effect of an inherited
      thrombophilic background.
    evidence:
    - reference: PMID:11583312
      reference_title: "Combined effect of factor V Leiden and prothrombin 20210A on the risk of venous thromboembolism--pooled analysis of 8 case-control studies including 2310 cases and 3204 controls."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Odds ratio for VTE associated with OC was 2.29 (1.72-3.04). In factor V Leiden carriers using OC, the odds ratio for VTE was 10.25 (5.69-1 8.45)."
      explanation: >-
        Gives both the main effect of oral contraceptive use and the substantially larger effect
        in factor V Leiden carriers, which is the interaction this exposure is curated for.

treatments:
- name: Pharmacological thromboprophylaxis
  description: >
    Low-dose anticoagulation given to patients at risk who do not have the disease, in hospital,
    after surgery, and in other high-risk settings. It is the only intervention in this entry
    that acts on the prothrombotic context node, which is the only part of the causal chain that
    exists before the disease does. That makes it the sole primary-prevention lever, and its
    effect on venous thromboembolism in hospitalised medical patients was roughly a two-thirds
    relative reduction against placebo.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Anticoagulation Therapy
    term:
      id: NCIT:C63341
      label: Anticoagulation Therapy
  target_mechanisms:
  - target: Prothrombotic venous context
    treatment_effect: INHIBITS
    description: >
      Prophylactic anticoagulation offsets the hypercoagulable component of the prothrombotic
      context so that a thrombus does not form in the first place.
  evidence:
  - reference: PMID:10477777
    reference_title: "A comparison of enoxaparin with placebo for the prevention of venous thromboembolism in acutely ill medical patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The incidence of venous thromboembolism was significantly lower in the group that received 40 mg of enoxaparin"
    explanation: >-
      Establishes the effect in hospitalised medical patients against placebo, which is the
      cleanest available demonstration that acting on the prothrombotic context prevents the
      disease rather than treating it.
  - reference: PMID:10477777
    reference_title: "A comparison of enoxaparin with placebo for the prevention of venous thromboembolism in acutely ill medical patients."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "There was no significant difference in the incidence of venous thromboembolism between the group that received 20 mg of enoxaparin"
    explanation: >-
      The dose-response arm, which matters mechanistically because it shows the benefit is not a
      general property of receiving an anticoagulant. Graded PARTIAL because it qualifies rather
      than establishes the treatment.

- name: Therapeutic anticoagulation
  description: >
    The mainstay of treatment in every risk stratum. Anticoagulation does not dissolve the
    embolus. It prevents further thrombus accretion and recurrent embolisation while endogenous
    fibrinolysis clears what is already there, which is the reason the treatment works despite
    acting on a node upstream of the one causing the symptoms.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Anticoagulation Therapy
    term:
      id: NCIT:C63341
      label: Anticoagulation Therapy
  target_mechanisms:
  - target: Deep venous thrombus formation
    treatment_effect: INHIBITS
    description: >
      Suppressing thrombin generation stops propagation of the source thrombus and formation of
      new thrombus, which is what prevents further embolisation.

- name: Direct oral anticoagulant therapy
  description: >
    Fixed-dose oral factor Xa inhibitors, now preferred over vitamin K antagonists for most
    patients. Their advantage over the older standard is not greater efficacy but less bleeding
    at equivalent efficacy, which was demonstrated separately for rivaroxaban in a
    pulmonary-embolism-specific trial and for apixaban across venous thromboembolism.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Anticoagulation Therapy
    term:
      id: NCIT:C63341
      label: Anticoagulation Therapy
    therapeutic_agent:
    - preferred_term: rivaroxaban
      term:
        id: CHEBI:68579
        label: rivaroxaban
    - preferred_term: apixaban
      term:
        id: CHEBI:72296
        label: apixaban
  target_mechanisms:
  - target: Deep venous thrombus formation
    treatment_effect: INHIBITS
    description: >
      Direct factor Xa inhibition reduces thrombin generation at the same node as heparin and
      vitamin K antagonism, by a different molecular route.
  evidence:
  - reference: PMID:22449293
    reference_title: "Oral rivaroxaban for the treatment of symptomatic pulmonary embolism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Major bleeding was observed in 26 patients (1.1%) in the rivaroxaban group and 52 patients (2.2%) in the standard-therapy group (hazard ratio, 0.49; 95% CI, 0.31 to 0.79; P=0.003)."
    explanation: >-
      Quantifies the halving of major bleeding at noninferior efficacy in a trial recruiting
      specifically patients with acute symptomatic pulmonary embolism.
  - reference: PMID:23808982
    reference_title: "Oral apixaban for the treatment of acute venous thromboembolism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A fixed-dose regimen of apixaban alone was noninferior to conventional therapy for the treatment of acute venous thromboembolism and was associated with significantly less bleeding"
    explanation: >-
      Establishes the same efficacy-and-safety pattern for a second agent of the class. Note the
      trial population is venous thromboembolism broadly rather than pulmonary embolism
      specifically.

- name: Systemic fibrinolysis
  description: >
    Plasminogen activators given systemically to lyse the embolus and unload the right ventricle.
    This is the one treatment that acts on the obstruction itself, and it is curated with its
    harm attached, because the trial that tested it in the intermediate-risk stratum found it
    prevented haemodynamic decompensation while causing major bleeding and stroke. That result is
    the reason fibrinolysis is reserved for patients already in shock rather than given to
    everyone with a strained right ventricle.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: tenecteplase
      term:
        id: CHEBI:753718
        label: tenecteplase
  target_mechanisms:
  - target: Acute rise in pulmonary vascular resistance
    treatment_effect: INHIBITS
    description: >
      Lysis of embolic material restores pulmonary arterial cross-sectional area and lowers the
      resistance the right ventricle faces.
  evidence:
  - reference: PMID:24716681
    reference_title: "Fibrinolysis for patients with intermediate-risk pulmonary embolism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Death or hemodynamic decompensation occurred in 13 of 506 patients (2.6%) in the tenecteplase group as compared with 28 of 499 (5.6%) in the placebo group (odds ratio, 0.44; 95% confidence interval, 0.23 to 0.87; P=0.02)."
    explanation: >-
      Establishes the efficacy half of the trade-off, a halving of death or haemodynamic
      decompensation.
  - reference: PMID:24716681
    reference_title: "Fibrinolysis for patients with intermediate-risk pulmonary embolism."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Stroke occurred in 12 patients (2.4%) in the tenecteplase group and was hemorrhagic in 10 patients; 1 patient (0.2%) in the placebo group had a stroke, which was hemorrhagic (P=0.003)."
    explanation: >-
      Refutes a general recommendation for fibrinolysis in the intermediate-risk stratum by
      quantifying the stroke harm that offsets the benefit above. Curated as REFUTE against the
      broad use of this treatment, not against its mechanism.
  - reference: PMID:24716681
    reference_title: "Fibrinolysis for patients with intermediate-risk pulmonary embolism."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "In patients with intermediate-risk pulmonary embolism, fibrinolytic therapy prevented hemodynamic decompensation but increased the risk of major hemorrhage and stroke."
    explanation: >-
      The authors' own summary of the trade-off. Graded PARTIAL because it supports the treatment
      in one respect and opposes it in another, which is exactly the curated position.

- name: Catheter-directed mechanical thrombectomy
  description: >
    Percutaneous removal of embolic material, offered increasingly in the intermediate-high and
    high-risk strata as an alternative to systemic lysis. Its mechanistic interest exceeds its
    current evidence base, because measuring the heart before and after the procedure has shown
    the interdependence mechanism reversing, which is stronger support for the causal model than
    any observational imaging study.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: Therapeutic Procedure
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  target_mechanisms:
  - target: Ventricular interdependence and impaired left ventricular filling
    treatment_effect: INHIBITS
    description: >
      Relieving pulmonary arterial obstruction reduces right ventricular pressure overload,
      straightens the septum, and restores left ventricular filling.
  evidence:
  - reference: PMID:41984155
    reference_title: "Mechanical thrombectomy improves left ventricular filling in intermediate-high risk pulmonary embolism: the role of ventricular interdependence."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mechanical thrombectomy in intermediate-high-risk PE not only relieves RV overload but also enhances LV filling by mitigating ventricular interdependence."
    explanation: >-
      States the mechanistic effect this treatment is curated for. The study is a single-centre
      series of 26 patients without a control arm, so it supports the mechanism rather than a
      clinical outcome benefit.

- name: Surgical pulmonary embolectomy
  description: >
    Open removal of central embolic material on cardiopulmonary bypass, reserved for high-risk
    disease where thrombolysis is contraindicated or has failed. It and catheter-directed
    intervention occupy the same niche, and in the setting where they have been compared the
    populations were largely defined by a contraindication to systemic lysis rather than by
    anatomy.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Surgical Procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Acute rise in pulmonary vascular resistance
    treatment_effect: INHIBITS
    description: >
      Removing central embolic material restores pulmonary arterial cross-sectional area
      immediately and mechanically.
  evidence:
  - reference: PMID:41412228
    reference_title: "Catheter-directed interventions versus surgical embolectomy in massive pulmonary embolism."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The majority in both groups had absolute (CDI, 17.3%; SE, 16.7%; P = .94) or relative contraindication (CDI, 58.7%; SE, 66.7%; P = .49) to stPA."
    explanation: >-
      Establishes what actually selects patients into these procedures, namely inability to
      receive systemic thrombolysis rather than a positive indication. Graded PARTIAL because a
      retrospective single-system series cannot establish comparative efficacy.

- name: Inferior vena cava filter
  description: >
    A mechanical device intended to trap embolising thrombus before it reaches the lungs, so in
    principle the only treatment that acts on the embolization node itself. It is curated with
    its negative trial attached, because when tested against anticoagulation alone in patients at
    high risk of recurrence it did not reduce recurrent pulmonary embolism, and recurrences were
    numerically more frequent in the filter arm. Its remaining role is confined to patients who
    cannot be anticoagulated at all, which is a role defined by the absence of an alternative
    rather than by demonstrated benefit.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: Therapeutic Procedure
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  target_mechanisms:
  - target: Embolization to the pulmonary arterial tree
    treatment_effect: INHIBITS
    description: >
      A caval filter is intended to intercept embolising thrombus mechanically between its venous
      origin and the pulmonary arteries.
  evidence:
  - reference: PMID:25919526
    reference_title: "Effect of a retrievable inferior vena cava filter plus anticoagulation vs anticoagulation alone on risk of recurrent pulmonary embolism: a randomized clinical trial."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "By 3 months, recurrent pulmonary embolism had occurred in 6 patients (3.0%; all fatal) in the filter group and in 3 patients (1.5%; 2 fatal) in the control group"
    explanation: >-
      Refutes routine filter use in anticoagulated patients at high risk of recurrence, since the
      outcome the device exists to prevent was not reduced and was numerically more common with
      the filter.

- name: Pulmonary endarterectomy and balloon pulmonary angioplasty
  description: >
    Mechanical removal or dilation of organised fibrotic thromboembolic material in chronic
    thromboembolic pulmonary hypertension. Endarterectomy is the treatment of choice where the
    disease is surgically accessible and balloon angioplasty is the alternative where it is not.
    Both produce right ventricular reverse remodelling, which is the point mechanistically, since
    it shows the chronic right ventricular changes are load-dependent and reversible rather than
    a fixed cardiomyopathy. This is the treatment that makes recognising chronic thromboembolic
    disease consequential rather than merely prognostic.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Surgical Procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Thrombus resolution versus fibrotic organization
    treatment_effect: INHIBITS
    description: >
      Removing or dilating the organised fibrotic material relieves the fixed obstruction that
      failure of resolution produced.
  evidence:
  - reference: PMID:39467613
    reference_title: "Right ventricular remodelling and long-term survival after pulmonary endarterectomy versus balloon pulmonary angioplasty in chronic thromboembolic pulmonary hypertension."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both PEA and BPA led to significant RV reverse remodelling, with no clear evidence of a difference in survival rates."
    explanation: >-
      Establishes that both routes relieve the obstruction and that the right ventricle recovers,
      which is the mechanistic claim this treatment is curated for.
  - reference: PMID:39467613
    reference_title: "Right ventricular remodelling and long-term survival after pulmonary endarterectomy versus balloon pulmonary angioplasty in chronic thromboembolic pulmonary hypertension."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Improvement in RV function, particularly RV FAC, was associated with better outcomes, highlighting the importance of RV recovery in CTEPH treatment."
    explanation: >-
      Connects the mechanical result to outcome through right ventricular recovery, consistent
      with the entry's account that the right ventricle rather than the obstruction is what
      determines how patients fare. Graded PARTIAL because the study is a single-centre
      observational cohort without randomisation.

- name: Riociguat
  description: >
    A soluble guanylate cyclase stimulator approved for chronic thromboembolic pulmonary
    hypertension that is inoperable, or persistent after endarterectomy. It is worth noting what
    it implies. A pulmonary vasodilator improving a disease whose obstruction is organised fibrous
    tissue only makes sense if part of the raised resistance in that disease is not the visible
    obstruction at all, which is the small-vessel arteriopathy this entry declines to assert for
    lack of cited evidence.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Thrombus resolution versus fibrotic organization
    treatment_effect: INHIBITS
    description: >
      Pharmacological reduction of pulmonary vascular resistance in the chronic thromboembolic
      state, acting on the vascular component rather than on the organised material itself.
  evidence:
  - reference: PMID:23883377
    reference_title: "Riociguat for the treatment of chronic thromboembolic pulmonary hypertension."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "By week 16, the 6-minute walk distance had increased by a mean of 39 m in the riociguat group, as compared with a mean decrease of 6 m in the placebo group"
    explanation: >-
      The randomised functional result in inoperable or post-endarterectomy disease.
  - reference: PMID:23883377
    reference_title: "Riociguat for the treatment of chronic thromboembolic pulmonary hypertension."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pulmonary vascular resistance decreased by 226 dyn·sec·cm(-5) in the riociguat group and increased by 23 dyn·sec·cm(-5) in the placebo group"
    explanation: >-
      The haemodynamic result, which is the mechanistically informative one, since a fall in
      resistance under a vasodilator implies a vasoactive component to an obstruction usually
      described as fixed.

experimental_models:
- name: Porcine consecutive pulmonary embolism model
  description: >
    Anaesthetised pigs receiving repeated catheter-delivered emboli at fixed intervals, with
    pressure-volume loops and invasive pressures recorded after each. The model exists because
    rodent venous thrombosis models reproduce thrombus formation well but do not reliably produce
    pulmonary embolism, so the haemodynamic half of the disease has to be studied by delivering
    emboli directly. Its value here is that it separates events that are simultaneous in
    patients. It shows pulmonary pressure rising from the first embolus, resistance and afterload
    only from the third, and dilation preceding the fall in ejection fraction. Its limitation is
    that bypassing spontaneous embolisation makes it useless for studying why thrombi embolise.
  experimental_model_type: OTHER
  organism:
    preferred_term: pig
    term:
      id: NCBITaxon:9823
      label: Sus scrofa
  modeled_mechanisms:
  - target: Acute rise in pulmonary vascular resistance
    description: >
      Serial embolisation reproduces the rise in pulmonary pressure and, with greater burden, in
      pulmonary vascular resistance.
  - target: Right ventricular afterload mismatch and dilation
    description: >
      The model reproduces right ventricular dilation and the later decline in ejection fraction.
  publication: PMID:38745282
  evidence:
  - reference: PMID:38745282
    reference_title: "Immediate cardiopulmonary responses to consecutive pulmonary embolism: a randomized, controlled, experimental study."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Twelve pigs were randomly assigned to receive sham procedures or consecutive PEs every 15 min until doubling of mean pulmonary pressure."
    explanation: >-
      Describes the design, including the sham control arm and the randomisation that make it a
      controlled experiment rather than a descriptive preparation.
  - reference: PMID:38745282
    reference_title: "Immediate cardiopulmonary responses to consecutive pulmonary embolism: a randomized, controlled, experimental study."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In an experimental model of consecutive PE, RV afterload elevation and dysfunction manifested after the third PE, in contrast to pulmonary pressure that increased after the first PE."
    explanation: >-
      The finding that makes the model informative for this entry, since it dissociates pressure
      from afterload in a way that clinical measurement cannot.

diagnosis:
- name: Computed tomographic pulmonary angiography
  description: >
    The first-line confirmatory test, showing filling defects directly. It also gives the right
    ventricular to left ventricular diameter ratio in the same acquisition, so the test that
    establishes the diagnosis simultaneously supplies the risk-stratification variable.

- name: Risk stratification by right ventricular function and cardiac biomarkers
  description: >
    Severity is assessed from haemodynamic status, a validated clinical severity score, imaging
    of the right ventricle, and cardiac biomarkers, rather than from the anatomical extent of the
    embolus. The 2026 multisociety guideline replaced the older informal massive and submassive
    vocabulary with an explicit set of clinical categories built on these variables.
  evidence:
  - reference: PMID:41712898
    reference_title: "2026 AHA/ACC/ACCP/ACEP/CHEST/SCAI/SHM/SIR/SVM/SVN Guideline for the Evaluation and Management of Acute Pulmonary Embolism in Adults."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A key feature of this guideline is the introduction of the AHA/ACC Acute Pulmonary Embolism Clinical Categories, which enhance the precision of severity classification, prognosis assessment, and evidence-based therapeutic decision-making."
    explanation: >-
      Documents the current formal severity classification that this entry's subtypes correspond
      to.

- name: D-dimer with pretest probability assessment
  description: >
    A sensitive but unspecific assay used to exclude the diagnosis in patients whose clinical
    probability is low. It is diagnostically useful only in that direction, and using it as a
    positive test generates imaging without benefit.

progression:
- phase: Acute event
  notes: >
    Onset over minutes to hours. Mortality is concentrated in the earliest period and is driven by
    right ventricular failure rather than by hypoxaemia, with a majority of deaths in patients
    presenting in shock occurring within the first hour.
  evidence:
  - reference: PMID:11888976
    reference_title: "Major pulmonary embolism: review of a pathophysiologic approach to the golden hour of hemodynamically significant pulmonary embolism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In either case, the presence of shock defines a threefold to sevenfold increase in mortality, with a majority of deaths occurring within 1 h of presentation."
    explanation: >-
      Supports the concentration of mortality in the first hour after presentation with shock.

- phase: Resolution on anticoagulation
  notes: >
    Most patients stabilise and clear the embolic burden over weeks to months while
    anticoagulated. Duration of anticoagulation is then decided by whether the event was
    provoked, which is a statement about the prothrombotic context node rather than about the
    embolus.

- phase: Chronic thromboembolic pulmonary hypertension
  notes: >
    A minority fail to clear the material, which organises into fixed fibrotic obstruction. In a
    prospective cohort the cumulative incidence of symptomatic disease was 3.8 percent at two
    years, and no new cases appeared beyond two years of follow-up, so the risk is front-loaded.
  evidence:
  - reference: PMID:15163775
    reference_title: "Incidence of chronic thromboembolic pulmonary hypertension after pulmonary embolism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The cumulative incidence of symptomatic CTPH was 1.0 percent (95 percent confidence interval, 0.0 to 2.4) at six months, 3.1 percent (95 percent confidence interval, 0.7 to 5.5) at one year, and 3.8 percent (95 percent confidence interval, 1.1 to 6.5) at two years."
    explanation: >-
      Gives the cumulative incidence figures quoted in this phase.

differential_diagnoses:
- name: Acute coronary syndrome
  description: >
    Shares chest pain, dyspnoea, troponin elevation, and electrocardiographic change. The
    distinction matters because both conditions raise troponin but by opposite mechanisms,
    coronary occlusion in one and right ventricular afterload in the other, and because the
    treatments are close to mutually exclusive.

- name: Pneumonia
  description: >
    Shares pleuritic pain, breathlessness, fever, and a peripheral opacity on chest radiography.
    A pulmonary infarct is radiographically similar to a consolidation, and the two are commonly
    confused in both directions.

- name: Aortic dissection
  description: >
    Shares abrupt chest pain and haemodynamic collapse. It is the differential in which the
    consequence of getting it wrong is greatest, because anticoagulation or fibrinolysis given to
    a dissection is actively harmful.

- name: Pericardial tamponade
  description: >
    Shares obstructive shock with a clear chest and raised jugular venous pressure. Both impair
    ventricular filling rather than contraction, so they present with the same physiology arrived
    at by different routes.

prevalence:
- population: Worldwide
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 100.0
  rate_low: 100.0
  rate_high: 200.0
  notes: >
    Venous thromboembolism is commonly cited at an annual incidence of roughly one to two per
    thousand adults, rising steeply with age, with pulmonary embolism accounting for a substantial
    share. One to two per thousand is one hundred to two hundred per hundred thousand, which is
    the ABOVE_1_IN_1000 band. The value recorded here is an order-of-magnitude normalisation of
    that range and is not drawn from a single cited study, which is why no evidence item is
    attached.

discussions:
- discussion_id: what_makes_a_thrombus_embolise
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >
    Why do some deep venous thrombi embolise while most do not, and can that propensity be
    predicted or modified?
  rationale: >
    Every treatment in this disease acts either on thrombus formation or on the consequences of an
    embolus that has already lodged. Nothing acts on embolisation itself, and the step is treated
    clinically as a stochastic event. There is evidence that it is not purely stochastic, since
    two inherited thrombophilias with comparable effects on thrombosis risk are distributed
    differently between embolic and non-embolic presentations, which implies thrombus properties
    or location influence the propensity. What those determinants are is not established, and the
    model systems that could address it are precisely the ones that fail, since rodent venous
    thrombosis models do not embolise and the porcine models that reproduce the haemodynamics
    deliver emboli directly and so bypass the question.
  attaches_to:
  - "pathophysiology#Embolization to the pulmonary arterial tree"
  evidence:
  - reference: PMID:11583312
    reference_title: "Combined effect of factor V Leiden and prothrombin 20210A on the risk of venous thromboembolism--pooled analysis of 8 case-control studies including 2310 cases and 3204 controls."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "we also confirmed that the frequency of factor V Leiden was lower in patients with pulmonary embolism than in patients with deep vein thrombosis without PE (odds ratio 0.69)."
    explanation: >-
      Establishes that embolic propensity is not a simple function of thrombotic tendency, which
      is what makes this a gap rather than an already-answered question.
  proposed_experiments:
  - experiment_id: exp_embolic_propensity_thrombus_composition
    name: Thrombus composition and embolic propensity
    description: >
      Compare the composition, age, and anatomical origin of retrieved thrombi from patients
      undergoing mechanical thrombectomy for pulmonary embolism against thrombi retrieved or
      imaged in patients with deep vein thrombosis that did not embolise, testing whether fibrin
      content, platelet content, or degree of organisation predicts embolisation.

- discussion_id: polygenic_background_modifies_monogenic_thrombophilia
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >
    Should thrombophilia risk be assessed as a polygenic quantity rather than as carrier status
    for a small number of named variants?
  rationale: >
    Thrombophilia testing in practice asks whether a patient carries one of a handful of variants.
    A large genome-wide meta-analysis found that the extremes of a polygenic score reach the risk
    conferred by those variants, and, more consequentially, that carriers of the classical
    variants who sit in the low tail of the polygenic distribution have risk indistinguishable
    from the general population. If that is confirmed prospectively it means carrier status alone
    is not the right unit of risk, and that some patients currently counselled as thrombophilic
    are not. The open question is whether this changes management decisions, principally the
    duration of anticoagulation, rather than merely improving risk estimation.
  attaches_to:
  - "pathophysiology#Prothrombotic venous context"
  evidence:
  - reference: PMID:36658437
    reference_title: "Genome-wide meta-analysis identifies 93 risk loci and enables risk prediction equivalent to monogenic forms of venous thromboembolism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We also document that F2 and F5 mutation carriers in the bottom 10% of the PRS distribution had a risk similar to that of the general population."
    explanation: >-
      This is the specific finding that makes carrier status an incomplete description of risk,
      and therefore the basis of the question.
  - reference: PMID:36658437
    reference_title: "Genome-wide meta-analysis identifies 93 risk loci and enables risk prediction equivalent to monogenic forms of venous thromboembolism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Individuals within the top 0.1% of PRS distribution had a VTE risk similar to homozygous or compound heterozygous carriers of the variants G20210A"
    explanation: >-
      Establishes the other half of the argument, that common-variant background alone can reach
      monogenic-equivalent risk.

- discussion_id: reperfusion_in_intermediate_risk_disease
  kind: CONTROVERSY
  status: OPEN
  prompt: >
    Which patients with a strained but compensating right ventricle should have the obstruction
    removed?
  rationale: >
    The intermediate-risk stratum is defined by demonstrable right ventricular injury without
    systemic hypotension, so by the mechanistic account in this entry it is the group in which
    intervening before the cascade becomes self-reinforcing should pay off most. The randomised
    test of systemic fibrinolysis in exactly this group found the expected benefit and an
    offsetting harm, leaving no net mortality difference. Catheter-directed approaches are
    proposed as the way to get the mechanical benefit without the systemic bleeding, and the
    haemodynamic evidence that they reverse ventricular interdependence is encouraging, but it
    comes from small uncontrolled series. The controversy is therefore not about the mechanism,
    which is well supported, but about whether any currently available way of acting on it
    improves outcomes.
  attaches_to:
  - "pathophysiology#Right ventricular afterload mismatch and dilation"
  - "pathophysiology#Ventricular interdependence and impaired left ventricular filling"
  evidence:
  - reference: PMID:24716681
    reference_title: "Fibrinolysis for patients with intermediate-risk pulmonary embolism."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "By day 30, a total of 12 patients (2.4%) in the tenecteplase group and 16 patients (3.2%) in the placebo group had died (P=0.42)."
    explanation: >-
      Shows the absence of a mortality difference at thirty days despite the reduction in
      haemodynamic decompensation, which is the core of the controversy.
  proposed_experiments:
  - experiment_id: exp_catheter_reperfusion_randomised_outcome
    name: Randomised outcome trial of catheter-directed reperfusion
    description: >
      Randomise normotensive patients with right ventricular dysfunction and biomarker elevation
      to catheter-directed reperfusion plus anticoagulation versus anticoagulation alone, powered
      for death or haemodynamic decompensation with bleeding as a co-primary safety outcome, to
      test whether the mechanical benefit demonstrated haemodynamically translates into outcome
      benefit without the bleeding cost of systemic lysis.

notes: >
  Scope. This entry curates pulmonary embolism as an acute cardiopulmonary event, with deep
  venous thrombus formation included as the immediately upstream node because anticoagulation
  acts there. Non-thrombotic embolism, including fat, air, amniotic fluid, tumour, and septic
  embolism, shares the anatomical endpoint but not the mechanism and is deliberately out of
  scope. Chronic thromboembolic pulmonary hypertension is curated as the chronic outcome node and
  phenotype of this disease rather than as an entity in its own right, and its small-vessel
  arteriopathy arm is not asserted here.

  Deep-research provenance. Curated from a claude_code deep-research report treated as leads only.
  The report's citations proved unusually reliable, with all twelve sampled identifiers resolving
  to the papers claimed. Its suggested ontology bindings did not. Three checks failed. HP:0030848
  was offered as Pleuritic chest pain and is in fact Elevated jugular venous pressure, which is a
  genuine sign of this disease and is now curated correctly under its real label, with pleuritic
  chest pain bound to HP:0033771. HP:0004936 was labelled Deep venous thrombosis and is Venous
  thrombosis, so the specific term HP:0002625 is used instead. CHEBI:66989 was offered as apixaban
  and is a sphinganine lipid, with apixaban being CHEBI:72296. NEC preflight returned SKIP because
  MONDO records no causal gene for this disease. The manual fallback passed, since every OMIM
  identifier in the report corresponds to a thrombophilia locus consistent with the intended
  entity.

  References fetched and not used. Four references were retrieved during curation and then not
  cited, because none of their cached records carries abstract text that could be quoted. They
  were the 2019 ESC guideline PMID:31504429, the updated chronic thromboembolic incidence
  meta-analysis PMID:37321620, a factor V Leiden and prothrombin meta-analysis PMID:22329698, and
  a review of mouse venous thrombosis models PMID:22345593. Their cache files are deliberately not
  committed, since committing a cached reference that nothing cites would suggest an evidential
  basis the entry does not have. The claims those papers would have carried are instead carried by
  sources that can be quoted: the 2026 multisociety guideline for severity classification, the
  Pengo cohort for chronic thromboembolic incidence, the pooled thrombophilia analysis
  PMID:11583312 for variant effect sizes, and the porcine model PMID:38745282 in place of the
  rodent-model review.

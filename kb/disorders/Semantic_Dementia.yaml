    term:
      id: HP:0000716
      label: Depression
  evidence:
  - reference: PMID:24966676
    reference_title: "Frontotemporal dementia and primary progressive aphasia, a review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    directness: INDIRECT
    snippet: "Treatment of depression with a selective serotonin reuptake inhibitor, such as paroxetine, sertraline, or citalopram, is frequently helpful, although one study of paroxetine was positive,88 and another negative.89"
    explanation: Documents the symptomatic use of selective serotonin reuptake inhibitors (paroxetine, sertraline, citalopram; noting mixed paroxetine trial results) for depression in frontotemporal dementia and primary progressive aphasia.

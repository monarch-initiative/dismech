    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "In the majority (> 80%) of cases, SD is underpinned by a specific histopathological subtype of pathogenic protein TDP-43 (type C) deposition33,34."

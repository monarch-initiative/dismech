disease_term:
  preferred_term: semantic dementia
  term:
    id: MONDO:0010857
    label: semantic dementia
description: >-
  Semantic dementia (also termed semantic variant primary progressive aphasia,
  svPPA) is a progressive neurodegenerative disorder within the frontotemporal
  lobar degeneration (FTLD) spectrum characterized by multimodal loss of
  semantic knowledge, severe confrontation naming deficits (anomia), and
  impaired single-word comprehension with relatively preserved speech fluency,
  repetition, syntax, and episodic memory in early stages. Neuropathologically,
  more than 80% of cases are underpinned by FTLD-TDP type C pathology with
  asymmetric anterior, polar, and inferolateral temporal lobe atrophy.

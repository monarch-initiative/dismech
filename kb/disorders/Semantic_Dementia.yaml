- name: TARDBP
  gene_term:
    preferred_term: TARDBP
    term:
      id: hgnc:11571
      label: TARDBP
  variant_origin: SOMATIC
  relationship_type: SOMATIC_DRIVER
  association: Low-level somatic missense variants in exon 1 of TARDBP cause sporadic semantic dementia
  notes: >-
    Postmortem brain sequencing identified low-level (1-3%) somatic variants
    in exon 1 of TARDBP (p.Leu41Phe and p.Arg42His) in cortical regions and the
    dentate gyrus of two semantic dementia brains, functionally causing
    impaired TDP-43 splicing regulation and altered subcellular localization.
    Because evidence is currently limited to two postmortem brains in
    DOI:10.1093/brain/awaa317, this post-zygotic mechanism is recorded here via
    variant_origin: SOMATIC and relationship_type: SOMATIC_DRIVER rather than as
    a separate disorder-level HP:0001442 (Somatic mosaicism) inheritance arm.
  evidence:

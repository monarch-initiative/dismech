- name: Neurofilament Light Chain (NEFL)
  presence: INCREASED
  context: >-
    Neurofilament light chain (NEFL/NfL) in cerebrospinal fluid and plasma is an
    established biomarker of neuroaxonal injury elevated across all forms of
    frontotemporal dementia (including sporadic and genetic FTD cohorts),
    reflecting active neuroaxonal degeneration rather than a
    semantic-dementia-specific anatomical assay.
  notes: >-
    Primary FTD cohort biomarker evidence is anchored to the cached CSF/plasma
    proteomics study DOI:10.1101/2024.02.09.579529 (directness: INDIRECT because
    it evaluates sporadic and genetic FTD cohorts broadly), supplemented by
    background recognition in PMID:42297981 (quote_role: BACKGROUND,
    directness: INDIRECT). Note that DOI:10.1016/j.jalz.2017.06.2012 in
    references has content_type: unavailable in references_cache/.
  readouts:
  - target: Temporal Neocortex Degeneration
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      Elevated CSF and plasma neurofilament light chain reflects general
      neuroaxonal injury and degeneration across frontotemporal dementia
      syndromes broadly.
    evidence:
    - reference: DOI:10.1101/2024.02.09.579529
      reference_title: "Alterations in Lysosomal, Glial and Neurodegenerative Biomarkers in Patients with Sporadic and Genetic Forms of Frontotemporal Dementia"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: "Neuronal injury and degeneration biomarkers NfL in CSF and plasma, and UCHL1 in CSF were elevated in patients with all forms of FTD."
      explanation: Demonstrates in a primary FTD biomarker cohort that CSF and plasma NfL are elevated as biomarkers of neuronal injury and degeneration across all forms of frontotemporal dementia.

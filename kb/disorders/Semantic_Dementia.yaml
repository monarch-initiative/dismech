- name: Ventral and Temporal White Matter Tract Degeneration
  description: >-
    Diffusion tensor tractography in semantic variant primary progressive
    aphasia demonstrates prominent white matter damage in the two ventral
    language pathways (uncinate fasciculus and inferior longitudinal
    fasciculus) as well as the temporal components of dorsal pathways,
    disconnecting the anterior temporal semantic hub from distributed
    perisylvian and visual-association regions.
  biological_scale: TISSUE
  locations:
  - preferred_term: temporal lobe
    term:
      id: UBERON:0001871
      label: temporal lobe
  downstream:
  - target: Progressive Semantic Network Degeneration
    description: Disconnection of ventral and temporal white matter tracts isolates the anterior temporal semantic hub from distributed language and recognition networks
  evidence:
  - reference: PMID:21666264
    reference_title: "White matter damage in primary progressive aphasias: a diffusion tensor tractography study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most prominent white matter changes were found in the dorsal pathways in non-fluent patients, in the two ventral pathways and the temporal components of the dorsal pathways in semantic variant, and in the temporoparietal component of the dorsal bundles in logopenic patients."
    explanation: Demonstrates selective white matter tract degeneration in the two ventral pathways and temporal components of the dorsal pathways in semantic variant PPA.
- name: Progressive Semantic Network Degeneration
  description: >-
    Progressive breakdown of the bilateral (predominantly left-lateralized)
    anterior temporal lobe semantic network leads to multimodal loss of
    conceptual knowledge, severe confrontation naming impairment (anomia),
    single-word comprehension deficits (especially for low-frequency items),
    surface dyslexia and dysgraphia, associative object recognition failure,
    and primary deficits in social cognition (emotion recognition, theory of
    mind, and empathy).

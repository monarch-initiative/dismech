inheritance:
- name: Sporadic
  inheritance_term:
    preferred_term: Sporadic
    term:
      id: HP:0003745
      label: Sporadic
  description: >-
    Semantic dementia is predominantly a sporadic, non-hereditary disorder and
    represents the least heritable syndrome within the frontotemporal lobar
    degeneration spectrum, with rare cases linked to somatic TARDBP variants or
    germline C9orf72 or TUBA4A variants.
  evidence:
  - reference: PMID:34169147
    reference_title: "Novel TUBA4A Variant Associated With Familial Frontotemporal Dementia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast, most patients with a language variant (primary progressive aphasia) are sporadic."
    explanation: Establishes that language variants of frontotemporal dementia, including semantic dementia, are predominantly sporadic.
  - reference: DOI:10.1093/brain/awaa317
    reference_title: "Somatic<i>TARDBP</i>variants as a cause of semantic dementia"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These findings indicate that somatic variants may cause semantic dementia as a non-hereditary neurodegenerative disease, which might be exemplary for other late-onset neurodegenerative disorders."
    explanation: Characterizes semantic dementia as a non-hereditary neurodegenerative disorder that can arise from somatic TARDBP variants.
prevalence:
- population: General population across US and European frontotemporal dementia cohorts (and adults aged 60 to 70 years)
  measure_type: POINT_PREVALENCE
  prevalence_class: BAND_1_5_PER_10000
  rate_low: 4.0
  rate_high: 15.0
  notes: >-
    Across US and European cohorts, overall frontotemporal dementia prevalence
    is estimated at 4 to 15 cases per 100,000, rising to 28 cases per 100,000
    among adults aged 60 to 70 years.
  evidence:
  - reference: PMID:24966676
    reference_title: "Frontotemporal dementia and primary progressive aphasia, a review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "A recent estimate placed FTD as occurring in 4–15 cases per 100,000, based on both US and European sources."
    explanation: Provides the population point prevalence range for frontotemporal dementia across US and European cohorts.
  - reference: PMID:24966676
    reference_title: "Frontotemporal dementia and primary progressive aphasia, a review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Among those aged 60–70 years, the prevalence was 28 cases per 100,000."
    explanation: Documents the age-specific point prevalence of frontotemporal dementia in adults aged 60 to 70 years.
progression:
- phase: Onset
  age_range: 40s-60s (most commonly 50s or 60s)
  notes: >-
    Symptom onset most commonly occurs in the 50s or 60s (or even 40s),
    representing a younger age distribution than Alzheimer disease.
  evidence:
  - reference: PMID:24966676
    reference_title: "Frontotemporal dementia and primary progressive aphasia, a review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Most patients with FTD dementia present in their 50s or 60s, or even 40s, clearly a younger age distribution, as compared with AD."
    explanation: Documents the typical presenile onset window in the 50s or 60s (or 40s) across frontotemporal dementia syndromes.
- phase: Duration
  age_range: 10-12 years
  notes: >-
    Primary progressive aphasia syndromes including semantic dementia can follow
    a slowly progressive course of language dysfunction over 10 to 12 years.
  evidence:
  - reference: PMID:24966676
    reference_title: "Frontotemporal dementia and primary progressive aphasia, a review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Some cases of PPA have shown slowly progressive language dysfunction over courses as long as 10–12 years, without obvious deterioration of other cognitive functions or dementia."
    explanation: Establishes the slowly progressive 10-to-12-year course observed in primary progressive aphasia syndromes.
pathophysiology:
- name: TDP-43 Type C Proteinopathy and Dystrophic Neurite Formation
  description: >-
    In more than 80% of semantic dementia cases, neurodegeneration is driven by
    frontotemporal lobar degeneration with TDP-43 type C pathology (FTLD-TDP
    type C), characterized by cytoplasmic mislocalization of phosphorylated
    TDP-43, impaired TDP-43 splicing regulation, and abundant long dystrophic
    neurites throughout the cerebral cortex (especially superficial cortical
    laminae of the anterior temporal lobes). In rare cases, low-level somatic
    TARDBP variants in cortical regions and the dentate gyrus directly disrupt
    TDP-43 splicing regulation and subcellular localization.
  biological_scale: MOLECULAR

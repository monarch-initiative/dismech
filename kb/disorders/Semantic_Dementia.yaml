  - reference: DOI:10.1111/neup.12859
    reference_title: "Clinicopathological diversity of semantic dementia: Comparisons of patients with early‐onset versus late‐onset, left‐sided versus right‐sided temporal atrophy, and TDP‐type A versus type C pathology"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Phosphorylated(p)‐TDP‐43‐positive long dystrophic neurites (DNs) were observed throughout the cerebral cortex; they were more abundant in the relatively spared cortices and less so in the severely degenerated cortices."
    explanation: Describes the characteristic phosphorylated TDP-43-positive long dystrophic neurites across the cerebral cortex in semantic dementia.
  - reference: DOI:10.1093/brain/awaa317
    reference_title: "Somatic<i>TARDBP</i>variants as a cause of semantic dementia"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The pathogenicity of both variants is supported by demonstrating impaired splicing regulation of TDP-43 and by altered subcellular localization of the mutant TDP-43 protein."
    explanation: Demonstrates that somatic TARDBP variants identified in semantic dementia brains impair TDP-43 splicing regulation and alter its subcellular localization.
  - reference: PMID:39260416
    reference_title: "Heteromeric amyloid filaments of ANXA11 and TDP-43 in FTLD-TDP type C."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Unexpectedly, the structures revealed that a second protein, annexin A11 (ANXA11), co-assembles with TDP-43 in heteromeric amyloid filaments. The ordered filament fold is formed by TDP-43 residues G282/G284-N345 and ANXA11 residues L39-Y74 from their respective low-complexity domains."
    explanation: Cryo-EM structures of brain filaments from patients with FTLD-TDP type C (presenting as semantic variant primary progressive aphasia) demonstrate that ANXA11 and TDP-43 co-assemble into heteromeric amyloid filaments via their low-complexity domains.
  - reference: PMID:40713859
    reference_title: "Proteomics of the temporal cortex in semantic dementia reveals brain-region specific molecular pathology and regulation of the TDP-43-ANXA11 interactome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the temporal cortex, two-thirds of proteins (67.3%) within the TDP-43-ANXA11 interactome showed significant differential abundancy in SD versus NDC"
    explanation: Proteomic profiling of semantic dementia temporal cortex confirms widespread dysregulation of the TDP-43-ANXA11 interactome in human disease tissue.
- name: Attenuated Temporal Inhibitory Self-Coupling and Abnormal Left Fronto-Temporal Excitatory Projection
  description: >-
    Spectral dynamic causal modeling (DCM) of resting-state
    magnetoencephalography (MEG) in semantic dementia demonstrates weakened
    intrinsic inhibitory self-coupling within bilateral antero-mesial temporal
    network hubs alongside an abnormal excitatory fronto-temporal projection in
    the left cerebral hemisphere. Across patients, clinical severity of
    semantic impairment and social disinhibition correlates with more extensive
    attenuation of temporal inhibitory self-coupling and abnormal excitatory
    projections between temporal and inferior frontal regions.
  notes: >-
    In the discussion of DOI:10.1038/s41598-020-72847-1, the authors propose
    superficial-lamina GABAergic inhibitory interneurons as a candidate
    microanatomical substrate for lost recurrent temporal inhibition; because
    the study's primary measurements are macroscopic MEG cross-spectral
    effective-connectivity estimates inferred via spectral DCM, this node is
    modeled at TISSUE scale with evidence_source: COMPUTATIONAL and
    directness: INDIRECT rather than binding unmeasured single-cell neuron
    classes.
  biological_scale: TISSUE

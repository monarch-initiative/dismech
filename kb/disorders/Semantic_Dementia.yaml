- name: Bilateral Frontal Microglial Activation
  description: >-
    In a longitudinal [11C]PK11195 PET and structural MRI cohort of 30
    frontotemporal dementia patients (10 behavioral variant FTD, 10 semantic
    variant PPA, and 10 nonfluent/agrammatic variant PPA), reduced baseline
    grey-matter volume and increased microglial activation in bilateral frontal
    cortices predicted faster longitudinal global cognitive decline on the
    revised Addenbrooke's Cognitive Examination (ACE-R). The study reports this
    prognostic association across the pooled frontotemporal dementia cohort
    without a separate semantic-variant-only regional subgroup breakdown.

  evidence:
  - reference: DOI:10.1038/s41598-020-72847-1
    reference_title: "The neurophysiological architecture of semantic dementia: spectral dynamic causal modelling of a neurodegenerative proteinopathy"
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    directness: INDIRECT
    snippet: "The presence of pathogenic protein in SD weakened the normal inhibitory self-coupling of network hubs in both antero-mesial temporal lobes, with development of an abnormal excitatory fronto-temporal projection in the left cerebral hemisphere."
    explanation: Spectral dynamic causal modeling of resting-state MEG demonstrates weakened intrinsic inhibitory self-coupling in bilateral antero-mesial temporal hubs and an abnormal left fronto-temporal excitatory projection in semantic dementia.
  - reference: DOI:10.1038/s41598-020-72847-1

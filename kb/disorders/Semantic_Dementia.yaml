  evidence:
  - reference: DOI:10.1038/s41598-020-72847-1
    reference_title: "The neurophysiological architecture of semantic dementia: spectral dynamic causal modelling of a neurodegenerative proteinopathy"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the majority (> 80%) of cases, SD is underpinned by a specific histopathological subtype of pathogenic protein TDP-43 (type C) deposition33,34."
    explanation: Establishes that more than 80% of semantic dementia cases are caused by pathogenic TDP-43 type C deposition.
  - reference: DOI:10.1111/neup.12859
    reference_title: "Clinicopathological diversity of semantic dementia: Comparisons of patients with early‐onset versus late‐onset, left‐sided versus right‐sided temporal atrophy, and TDP‐type A versus type C pathology"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Phosphorylated(p)‐TDP‐43‐positive long dystrophic neurites (DNs) were observed throughout the cerebral cortex; they were more abundant in the relatively spared cortices and less so in the severely degenerated cortices."
    explanation: Describes the characteristic phosphorylated TDP-43-positive long dystrophic neurites across the cerebral cortex in semantic dementia.
  - reference: DOI:10.1093/brain/awaa317
    reference_title: "Somatic<i>TARDBP</i>variants as a cause of semantic dementia"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The pathogenicity of both variants is supported by demonstrating impaired splicing regulation of TDP-43 and by altered subcellular localization of the mutant TDP-43 protein."
    explanation: Demonstrates that somatic TARDBP variants identified in semantic dementia brains impair TDP-43 splicing regulation and alter its subcellular localization.
- name: Superficial Lamina GABAergic Interneuron Dysfunction and Fronto-Temporal Hyperconnectivity
  description: >-
    Pathogenic protein deposition in superficial cortical laminae targets
    widely arborizing GABAergic inhibitory interneurons that normally maintain
    recurrent inhibitory control over temporal lobe microcircuitry. Spectral
    dynamic causal modeling of magnetoencephalography in semantic dementia
    demonstrates attenuated intrinsic inhibitory self-coupling within bilateral
    antero-mesial temporal network hubs coupled with an abnormal excitatory
    fronto-temporal projection in the left hemisphere, linking local circuit
    disinhibition to both semantic impairment and social disinhibition.
  biological_scale: CELLULAR

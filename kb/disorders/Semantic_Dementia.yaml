  - target: Progressive Semantic Network Degeneration
    description: Loss of anterior, polar, and inferolateral temporal cortical neurons degrades the core amodal semantic hub
  - target: Ventral and Temporal White Matter Tract Degeneration
    description: Cortical degeneration in the anterior temporal lobe leads to secondary axonal loss along ventral and temporal white matter tracts
  - target: Frontotemporal Cerebral Atrophy
    description: Progressive neuronal loss across temporal, insular, and orbitofrontal cortices manifests macroscopically as asymmetric frontotemporal cerebral atrophy
  - target: Prosopagnosia
    description: Right-predominant anterior and inferolateral temporal cortical degeneration impairs familiarity and recognition of faces
  - target: Atypical Behavior
    description: Extension of neurodegeneration to the right temporal lobe, amygdala, anterior insula, and nucleus accumbens produces personality and behavioral abnormalities
  evidence:
  - reference: PMID:11287367
    reference_title: "Semantic dementia: relevance to connectionist models of long-term memory."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Semantic dementia is a recently documented syndrome associated with non-Alzheimer degenerative pathology of the polar and inferolateral temporal neocortex, with relative sparing (at least in the early stages) of the hippocampal complex."
    explanation: The abstract specifies the temporal neocortical pathology and relative hippocampal sparing.
  - reference: DOI:10.1186/s13195-020-00600-x
    reference_title: "In vivo staging of frontotemporal lobar degeneration TDP-43 type C pathology"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Four sequential stages were identified in the initial development phase. Stage 1 was defined by atrophy in the left amygdala, medial temporal cortex, temporal pole, lateral temporal cortex and right medial temporal cortex; Stage 2 by atrophy in the left supratemporal cortex; Stage 3 by atrophy in the right anterior insula; and Stage 4 by atrophy in the right accumbens."
    explanation: Establishes the four-stage anatomical progression of FTLD-TDP type C atrophy from the temporal pole, amygdala, and medial/lateral temporal cortex to supratemporal cortex, right anterior insula, and right nucleus accumbens.
  - reference: DOI:10.1111/neup.12859
    reference_title: "Clinicopathological diversity of semantic dementia: Comparisons of patients with early‐onset versus late‐onset, left‐sided versus right‐sided temporal atrophy, and TDP‐type A versus type C pathology"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Case 2 was a 63‐year‐old woman with right‐predominant temporal atrophy and TDP‐type C pathology who had prosopagnosia and personality changes."
    explanation: Links right-predominant temporal atrophy with TDP-43 type C pathology to clinical prosopagnosia and personality/behavioral changes.
- name: Ventral and Temporal White Matter Tract Degeneration
  description: >-
    Diffusion tensor tractography in semantic variant primary progressive
    aphasia demonstrates prominent white matter damage in the two ventral
    language pathways (uncinate fasciculus and inferior longitudinal
    fasciculus) as well as the temporal components of dorsal pathways,
    disconnecting the anterior temporal semantic hub from distributed
    perisylvian and visual-association regions.
  biological_scale: TISSUE
  locations:
  - preferred_term: temporal lobe
    term:
      id: UBERON:0001871
      label: temporal lobe
  downstream:
  - target: Progressive Semantic Network Degeneration
    description: Disconnection of ventral and temporal white matter tracts isolates the anterior temporal semantic hub from distributed language and recognition networks
  evidence:
  - reference: PMID:21666264
    reference_title: "White matter damage in primary progressive aphasias: a diffusion tensor tractography study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most prominent white matter changes were found in the dorsal pathways in non-fluent patients, in the two ventral pathways and the temporal components of the dorsal pathways in semantic variant, and in the temporoparietal component of the dorsal bundles in logopenic patients."
    explanation: Demonstrates selective white matter tract degeneration in the two ventral pathways and temporal components of the dorsal pathways in semantic variant PPA.
- name: Progressive Semantic Network Degeneration
  description: >-
    Progressive breakdown of the bilateral (predominantly left-lateralized)
    anterior temporal lobe semantic network leads to multimodal loss of
    conceptual knowledge, severe confrontation naming impairment (anomia),
    single-word comprehension deficits (especially for low-frequency items),
    surface dyslexia and dysgraphia, associative object recognition failure,
    and primary deficits in social cognition (emotion recognition, theory of
    mind, and empathy).
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: trans-synaptic signaling
    term:
      id: GO:0099537

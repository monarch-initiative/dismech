  evidence:
  - reference: DOI:10.1038/s41598-020-72847-1
    reference_title: "The neurophysiological architecture of semantic dementia: spectral dynamic causal modelling of a neurodegenerative proteinopathy"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The presence of pathogenic protein in SD weakened the normal inhibitory self-coupling of network hubs in both antero-mesial temporal lobes, with development of an abnormal excitatory fronto-temporal projection in the left cerebral hemisphere."
    explanation: Demonstrates weakened intrinsic inhibitory self-coupling in bilateral antero-mesial temporal hubs and abnormal left fronto-temporal excitatory projection in semantic dementia.
  - reference: DOI:10.1038/s41598-020-72847-1
    reference_title: "The neurophysiological architecture of semantic dementia: spectral dynamic causal modelling of a neurodegenerative proteinopathy"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "GABAergic inhibitory processes maintain efficient neural network operation by regulating the gain of neural circuit activity and stimulus reactivity"
    explanation: Explains how GABAergic inhibitory processes regulate neural circuit gain and stimulus reactivity in the temporal cortical networks disrupted in semantic dementia.
  - reference: DOI:10.1038/s41598-020-72847-1
    reference_title: "The neurophysiological architecture of semantic dementia: spectral dynamic causal modelling of a neurodegenerative proteinopathy"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Semantic impairment and social disinhibition were linked to a similar but more extensive profile of abnormally attenuated inhibitory self-coupling within temporal lobe regions and excitatory projections between temporal and inferior frontal regions."
    explanation: Connects attenuated temporal inhibitory self-coupling and abnormal inferior frontal-temporal excitatory projections to both semantic impairment and social disinhibition.

    description: Breakdown of lexical-semantic representations in the left-predominant anterior temporal network causes severe confrontation naming deficits
  - target: Impaired Single-Word Comprehension and Semantic Memory Loss
    description: Erosion of amodal conceptual representations impairs single-word comprehension, initially for low-frequency items
  - target: Dyslexia
    description: Loss of semantic support for irregular orthography-to-phonology mapping causes surface dyslexia with regularization errors
  - target: Dysgraphia
    description: Loss of lexical-semantic representations for exception words causes surface dysgraphia
  - target: Visual Agnosia
    description: Multimodal semantic memory breakdown leads to progressive deterioration in recognizing objects and people
  - target: Disinhibition
    description: Primary semantic and temporo-frontal network breakdown impairs emotion recognition, theory of mind, and empathy
  evidence:
  - reference: PMID:41089414
    reference_title: "Clinical Manifestations and Neural Basis of Semantic Dementia: Converging Evidences From Brain Imaging Studies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Semantic dementia (SD) is a progressive neurodegenerative disorder primarily characterized by core linguistic deficits, notably impaired confrontation naming and single-word comprehension."
    explanation: The abstract identifies progressive neurodegeneration with semantic language deficits.
  - reference: PMID:34266501
    reference_title: "Language training for oral and written naming impairment in primary progressive aphasia: a review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "svPPA is clinically characterized by a slow loss of semantic knowledge"
    explanation: Links progressive loss of semantic knowledge in semantic variant PPA to core semantic network degeneration.
  - reference: PMID:30876954
    reference_title: "More than words: Social cognition across variants of primary progressive aphasia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Whereas the evidence on lvPPA proves scant, studies on nfvPPA and svPPA patients show consistent deficits in emotion recognition, theory of mind, and empathy. Notably, these seem to be intertwined with language impairments in nfvPPA, but they prove primary and independent of language disturbances in svPPA."
    explanation: Demonstrates that deficits in emotion recognition, theory of mind, and empathy are primary manifestations of network degeneration in semantic variant PPA.

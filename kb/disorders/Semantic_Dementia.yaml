inheritance:
- name: Sporadic
  inheritance_term:
    preferred_term: Sporadic
    term:
      id: HP:0003745
      label: Sporadic
  description: >-
    Semantic dementia is predominantly a sporadic, non-hereditary disorder and
    represents the least heritable syndrome within the frontotemporal lobar
    degeneration spectrum. Rare cases are associated with low-level post-zygotic
    somatic TARDBP variants in brain tissue (modeled under genetic with
    variant_origin: SOMATIC rather than as a separate HP:0001442 Somatic
    mosaicism inheritance arm, because evidence is currently limited to two
    postmortem brains in DOI:10.1093/brain/awaa317) or rare germline C9orf72
    repeat expansions.
  evidence:
  - reference: PMID:34169147
    reference_title: "Novel TUBA4A Variant Associated With Familial Frontotemporal Dementia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    directness: INDIRECT
    snippet: "In contrast, most patients with a language variant (primary progressive aphasia) are sporadic."
    explanation: Establishes that language variants of frontotemporal dementia, including semantic dementia, are predominantly sporadic.
  - reference: DOI:10.1093/brain/awaa317
    reference_title: "Somatic<i>TARDBP</i>variants as a cause of semantic dementia"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These findings indicate that somatic variants may cause semantic dementia as a non-hereditary neurodegenerative disease, which might be exemplary for other late-onset neurodegenerative disorders."
    explanation: Characterizes semantic dementia as a non-hereditary neurodegenerative disorder that can arise from somatic TARDBP variants.
prevalence:
- population: General population across US and European cohorts (frontotemporal dementia spectrum upper bound; semantic dementia accounts for ~18.6% of sporadic FTD)
  measure_type: POINT_PREVALENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_low: 4.0
  rate_high: 15.0
  notes: >-
    PMID:24966676 reports an overall frontotemporal dementia (FTD) point
    prevalence of 4 to 15 cases per 100,000 across US and European sources,
    which serves as an FTD-wide upper bound rather than a semantic-dementia-only
    rate. In the large international cross-sectional FTD cohort (PMID:22406228),
    semantic dementia accounts for 18.6% (195/1,048) of non-expansion FTD cases
    and 5.6% (7/125) of C9orf72-expanded FTD cases, corresponding to an
    estimated semantic dementia point prevalence of approximately 0.7 to 2.8
    cases per 100,000.
  evidence:

- name: Temporal Neocortex Degeneration
  description: >-
    Asymmetric degeneration of the polar, medial, and inferolateral temporal
    neocortex and amygdala (with relative sparing of the hippocampal complex in
    early stages) underlies semantic dementia. In vivo staging of FTLD-TDP type
    C pathology defines four sequential anatomical stages: Stage 1 involves
    atrophy in the left amygdala, medial temporal cortex, temporal pole,
    lateral temporal cortex, and right medial temporal cortex; Stage 2 extends
    to the left supratemporal cortex; Stage 3 involves the right anterior
    insula; and Stage 4 reaches the right nucleus accumbens. Left-predominant
    temporal atrophy primarily drives word comprehension deficits and anomia,
    whereas right-predominant temporal atrophy drives progressive prosopagnosia
    and personality/behavioral changes.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: cerebral cortex neuron
    term:
      id: CL:0010012
      label: cerebral cortex neuron

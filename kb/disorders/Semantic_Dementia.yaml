    evidence_source: OTHER
    snippet: "Associated features include surface dyslexia, prosopagnosia, relatively preserved speech production, and emotional or behavioral abnormalities."
    explanation: The abstract lists prosopagnosia as an associated feature of semantic dementia.
  - reference: PMID:32507758
    reference_title: "[Evaluation of Semantic Dementia Patient]."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Progressive gogi (word-meaning) aphasia, i.e., word comprehension deficits with severe anomia, is prominent in left-dominant patients, whereas progressive prosopagnosia, i.e., difficulty recognizing familiar faces, is prominent in right-dominant patients."
    explanation: Highlights that progressive prosopagnosia is especially prominent in right-dominant semantic dementia.
- name: Frontotemporal Cerebral Atrophy
  category: Neurologic
  frequency: VERY_FREQUENT
  diagnostic: true
  description: >-
    Bilateral but asymmetric (most frequently left-predominant) atrophy of the
    anterior, inferior, and mesial temporal lobes that progresses to involve
    the insula and orbitofrontal cortex.
  phenotype_term:
    preferred_term: Frontotemporal cerebral atrophy
    term:
      id: HP:0006892
      label: Frontotemporal cerebral atrophy
  evidence:
  - reference: PMID:34266501
    reference_title: "Language training for oral and written naming impairment in primary progressive aphasia: a review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The neuroanatomical profiles of svPPA include bilateral, although mainly left-lateralized, anterior inferior and mesial temporal lobe atrophy [13]."
    explanation: Documents the characteristic bilateral, predominantly left-lateralized anterior inferior and mesial temporal lobe atrophy of semantic variant PPA.
- name: Disinhibition
  category: Neuropsychiatric
  frequency: FREQUENT
  description: >-
    Social disinhibition accompanied by primary impairments in emotion
    recognition, theory of mind, and empathy independent of language deficits.
  phenotype_term:
    preferred_term: Disinhibition
    term:
      id: HP:0000734
      label: Disinhibition
  evidence:
  - reference: DOI:10.1038/s41598-020-72847-1
    reference_title: "The neurophysiological architecture of semantic dementia: spectral dynamic causal modelling of a neurodegenerative proteinopathy"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Semantic impairment and social disinhibition were linked to a similar but more extensive profile of abnormally attenuated inhibitory self-coupling within temporal lobe regions and excitatory projections between temporal and inferior frontal regions."
    explanation: Establishes social disinhibition as a core behavioral manifestation linked to fronto-temporal circuit dysfunction in semantic dementia.
  - reference: PMID:30876954
    reference_title: "More than words: Social cognition across variants of primary progressive aphasia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Whereas the evidence on lvPPA proves scant, studies on nfvPPA and svPPA patients show consistent deficits in emotion recognition, theory of mind, and empathy. Notably, these seem to be intertwined with language impairments in nfvPPA, but they prove primary and independent of language disturbances in svPPA."
    explanation: Shows that social cognition deficits (emotion recognition, theory of mind, and empathy) are primary and independent of language disturbance in semantic variant PPA.
- name: Atypical Behavior
  category: Neuropsychiatric
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Atypical behavior
    term:
      id: HP:0000708
      label: Atypical behavior
  evidence:
  - reference: PMID:41089414
    reference_title: "Clinical Manifestations and Neural Basis of Semantic Dementia: Converging Evidences From Brain Imaging Studies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Associated features include surface dyslexia, prosopagnosia, relatively preserved speech production, and emotional or behavioral abnormalities."
    explanation: The abstract notes behavioral abnormalities as associated features.
biochemical:
- name: Neurofilament Light Chain (NEFL)
  presence: INCREASED
  context: >-
    Neurofilament light chain (NEFL) is an established biomarker of axonal
    injury that is often markedly elevated across frontotemporal dementia
    syndromes, reflecting active neuroaxonal degeneration in temporo-limbic and
    frontotemporal structures vulnerable to frontotemporal lobar degeneration.
  readouts:
  - target: Temporal Neocortex Degeneration
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      Markedly elevated neurofilament light chain reflects active axonal injury
      from temporal and frontotemporal lobar neurodegeneration.
    evidence:
    - reference: PMID:42297981
      reference_title: "Plasma proteomic signatures of cellular aging predict human disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "NEFL is a widely recognized biomarker of axonal injury, often markedly raised in FTD, while C1QL2 is a synaptic organizer known to be prominent in temporo-limbic structures vulnerable to frontotemporal lobar degeneration"
      explanation: Establishes NEFL as a widely recognized biomarker of axonal injury markedly raised in frontotemporal dementia and linked to vulnerable temporo-limbic structures.
  evidence:
  - reference: PMID:42297981
    reference_title: "Plasma proteomic signatures of cellular aging predict human disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "NEFL is a widely recognized biomarker of axonal injury, often markedly raised in FTD, while C1QL2 is a synaptic organizer known to be prominent in temporo-limbic structures vulnerable to frontotemporal lobar degeneration"
    explanation: Establishes elevated neurofilament light chain as a recognized biomarker of axonal injury in frontotemporal dementia.
- name: Cerebrospinal Fluid Amyloid-beta 42 and Phosphorylated Tau Profile
  presence: NORMAL
  context: >-
    CSF amyloid-beta 42, total tau, and phosphorylated tau (pTau181/Abeta42)
    immunoassays are used in the diagnostic workup of semantic variant primary
    progressive aphasia to exclude underlying Alzheimer disease pathology;
    patients with FTLD-TDP-driven semantic dementia lack the reduced Abeta42
    and markedly elevated total tau and pTau181 profile characteristic of
    Alzheimer disease.
  evidence:
  - reference: PMID:35841250
    reference_title: "Elecsys Cerebrospinal Fluid Assays Accurately Distinguish Alzheimer's Disease from Frontotemporal Lobar Degeneration."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Elecsys CSF immunoassays demonstrate good diagnostic accuracy in differentiating patients with AD from those with FTLD. These immunoassays have the potential to support clinical decision making, i.e. in diagnosing patients with FTLD by excluding patients with amyloid positivity, which is indicative of underlying AD."
    explanation: Confirms the diagnostic utility of CSF amyloid and tau immunoassays in diagnosing FTLD (including semantic variant PPA) by excluding Alzheimer disease pathology.
  - reference: PMID:24966676
    reference_title: "Frontotemporal dementia and primary progressive aphasia, a review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Some evidence can also be found on lumbar puncture, in which elevated spinal fluid tau and reduced spinal fluid beta-amyloid can support the diagnosis of AD."
    explanation: Contrasts the elevated CSF tau and reduced beta-amyloid profile supporting Alzheimer disease with frontotemporal dementia on lumbar puncture.
genetic:
- name: TARDBP
  gene_term:
    preferred_term: TARDBP
    term:
      id: hgnc:11571
      label: TARDBP
  variant_origin: SOMATIC
  relationship_type: SOMATIC_DRIVER
  association: Low-level somatic missense variants in exon 1 of TARDBP cause sporadic semantic dementia
  notes: >-
    Postmortem brain sequencing identified low-level (1-3%) somatic variants
    in exon 1 of TARDBP (p.Leu41Phe and p.Arg42His) in cortical regions and the
    dentate gyrus of two semantic dementia brains, functionally causing
    impaired TDP-43 splicing regulation and altered subcellular localization.
  evidence:
  - reference: DOI:10.1093/brain/awaa317
    reference_title: "Somatic<i>TARDBP</i>variants as a cause of semantic dementia"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified two variants in exon one of the TARDBP gene (L41F and R42H) at low level (1–3%) in cortical regions and in dentate gyrus in two semantic dementia brains, respectively."
    explanation: Reports the discovery of low-level somatic TARDBP variants in cortical regions and dentate gyrus of semantic dementia brains.
  - reference: DOI:10.1093/brain/awaa317
    reference_title: "Somatic<i>TARDBP</i>variants as a cause of semantic dementia"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The pathogenicity of both variants is supported by demonstrating impaired splicing regulation of TDP-43 and by altered subcellular localization of the mutant TDP-43 protein."
    explanation: Provides functional validation that both somatic TARDBP variants impair TDP-43 splicing regulation and subcellular localization.
- name: C9orf72
  gene_term:
    preferred_term: C9orf72
    term:
      id: hgnc:28337
      label: C9orf72
  variant_origin: GERMLINE
  relationship_type: CAUSATIVE
  association: Rare germline hexanucleotide repeat expansions in C9orf72 occur in a small subset of semantic dementia patients
  notes: >-
    Although semantic dementia is overwhelmingly sporadic, C9orf72
    hexanucleotide repeat expansions were identified in 7 of 202 (3.5%)
    semantic dementia cases in a large international cross-sectional study
    (accounting for 5.6% of C9orf72-positive FTD cases).
  evidence:
  - reference: PMID:22406228
    reference_title: "Frequency of the C9orf72 hexanucleotide repeat expansion in patients with amyotrophic lateral sclerosis and frontotemporal dementia: a cross-sectional study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Semantic dementia | 7 (5·6%) | 195 (18·6%)"
    explanation: Documents 7 semantic dementia cases with the C9orf72 hexanucleotide repeat expansion versus 195 without the expansion in the international FTD cohort.
- name: TUBA4A
  gene_term:
    preferred_term: TUBA4A
    term:
      id: hgnc:12407
      label: TUBA4A
  variant_origin: GERMLINE
  relationship_type: CAUSATIVE
  association: Rare truncating frameshift variant in TUBA4A identified in semantic dementia
  notes: >-
    A heterozygous exon 2 frameshift variant (p.Arg64Glyfs*90) in TUBA4A
    resulting in a truncated protein was identified in a Belgian patient
    diagnosed with semantic dementia without amyotrophic lateral sclerosis.
  evidence:
  - reference: PMID:34169147
    reference_title: "Novel TUBA4A Variant Associated With Familial Frontotemporal Dementia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The first TUBA4A variant in FTD without ALS was identified in a Belgian patient diagnosed with semantic dementia.30 This frameshift variant (p.Arg64Glyfs*90) occurred in exon 2, leading to a truncated protein."
    explanation: Documents the truncating TUBA4A frameshift variant p.Arg64Glyfs*90 in a patient with semantic dementia.
diagnosis:
- name: International Consensus Clinical and Neuropsychological Classification for Semantic Variant PPA
  diagnosis_term:
    preferred_term: Neuropsychological Assessment
    term:
      id: NCIT:C165543
      label: Neuropsychological Assessment
  description: >-
    Clinical diagnosis is established using the 2011 Gorno-Tempini
    international consensus criteria for primary progressive aphasia, which
    first confirm primary progressive aphasia and then classify the semantic
    variant based on core deficits in confrontation naming and single-word
    comprehension (especially for low-frequency items), supported by impaired
    object knowledge, surface dyslexia or dysgraphia, spared repetition, and
    fluent spontaneous speech.
  results: >-
    Severe confrontation naming deficit (anomia) and impaired single-word
    comprehension with preserved speech fluency and word repetition; further
    specified as imaging-supported or with definite pathology when neuroimaging
    or pathologic/genetic data are available.
  evidence:
  - reference: PMID:21325651
    reference_title: "Classification of primary progressive aphasia and its variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients are first diagnosed with PPA and are then divided into clinical variants based on specific speech and language features characteristic of each subtype. Classification can then be further specified as \"imaging-supported\" if the expected pattern of atrophy is found and \"with definite pathology\" if pathologic or genetic data are available."
    explanation: Summarizes the diagnostic framework of the 2011 international consensus criteria for classifying primary progressive aphasia variants including the semantic variant.
  - reference: PMID:34266501
    reference_title: "Language training for oral and written naming impairment in primary progressive aphasia: a review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The impairment in single-word comprehension is usually the earliest symptom of semantic memory deficit, subsequently leading to deterioration in recognizing objects and people"
    explanation: Details the core neuropsychological progression from single-word comprehension deficits to multimodal object and person recognition impairment in semantic variant PPA.
- name: Structural Brain Magnetic Resonance Imaging (MRI)
  diagnosis_term:
    preferred_term: Magnetic Resonance Imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  description: >-
    Structural brain MRI (particularly coronal T1-weighted sequences) is used
    to establish an imaging-supported diagnosis of semantic dementia by
    demonstrating characteristic bilateral but asymmetric (most commonly
    left-predominant) atrophy of the anterior, inferior, polar, and mesial
    temporal lobes.
  results: >-
    Predominant anterior, polar, and inferolateral temporal lobe cortical
    atrophy (left-predominant in typical word-comprehension presentations and
    right-predominant in prosopagnosia/behavioral presentations).
  evidence:
  - reference: PMID:34266501
    reference_title: "Language training for oral and written naming impairment in primary progressive aphasia: a review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The neuroanatomical profiles of svPPA include bilateral, although mainly left-lateralized, anterior inferior and mesial temporal lobe atrophy [13]."
    explanation: Describes the characteristic MRI atrophy pattern in semantic variant PPA.
  - reference: PMID:24966676
    reference_title: "Frontotemporal dementia and primary progressive aphasia, a review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Some patients have striking focal atrophy in the frontal or temporal lobe on one or both sides; coronal MRI makes it especially easy to detect temporal lobe atrophy, as well as to look at the medial temporal structures, which are more typically affected in AD."
    explanation: Confirms that coronal MRI detects focal temporal lobe atrophy in frontotemporal dementia and differentiates it from medial temporal involvement in Alzheimer disease.
- name: 18F-Fluorodeoxyglucose Positron Emission Tomography (FDG-PET)
  diagnosis_term:
    preferred_term: Positron Emission Tomography
    term:
      id: NCIT:C17007
      label: Positron Emission Tomography
  description: >-
    Brain FDG-PET evaluates regional cerebral glucose metabolism, demonstrating
    focal anterior temporal lobe hypometabolism that supports imaging-confirmed
    semantic variant PPA and assists in differentiating FTLD from Alzheimer
    disease.
  results: >-
    Asymmetric regional glucose hypometabolism in the anterior temporal lobes.
  evidence:
  - reference: PMID:24966676
    reference_title: "Frontotemporal dementia and primary progressive aphasia, a review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Functional imaging techniques, particularly positron emission tomography (PET), make focal areas of hypometabolism easy to visualize."
    explanation: Highlights the utility of PET functional imaging for visualizing focal areas of cerebral hypometabolism in frontotemporal dementia and primary progressive aphasia.
  - reference: PMID:35841250
    reference_title: "Elecsys Cerebrospinal Fluid Assays Accurately Distinguish Alzheimer's Disease from Frontotemporal Lobar Degeneration."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A total of 130 patients with cognitive impairment were included in the study; 86 patients were diagnosed with AD and 44 with FTLD (behavioral variant frontotemporal dementia, semantic variant of primary progressive aphasia, and non-fluent variant of primary progressive aphasia), based on core clinical criteria and a non-CSF biomarker, a typical pattern of regional hypometabolism"
    explanation: Confirms the use of regional hypometabolism on FDG-PET alongside core clinical criteria to establish the diagnosis of semantic variant PPA and other FTLD syndromes.
differential_diagnoses:
- name: Alzheimer Disease and Logopenic Variant Primary Progressive Aphasia
  disease_term:
    preferred_term: Alzheimer disease
    term:
      id: MONDO:0004975
      label: Alzheimer disease
  description: >-
    Logopenic variant primary progressive aphasia (most commonly an atypical
    clinical presentation of Alzheimer disease) and early-onset Alzheimer
    disease present with word-finding difficulty and naming impairment that can
    mimic semantic dementia.
  distinguishing_features:
  - Logopenic variant PPA is characterized by impaired repetition of phrases and sentences, phonological speech errors, relatively preserved single-word comprehension, and left posterior temporoparietal atrophy, whereas semantic dementia features spared repetition, severe single-word comprehension loss, and anterior temporal lobe atrophy.
  - CSF biomarker positivity (decreased Abeta42 with elevated total tau and pTau181) or positive amyloid PET identifies underlying Alzheimer disease pathology and excludes FTLD-TDP-driven semantic dementia.
  evidence:
  - reference: PMID:21666264
    reference_title: "White matter damage in primary progressive aphasias: a diffusion tensor tractography study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Primary progressive aphasia is a clinical syndrome that encompasses three major phenotypes: non-fluent/agrammatic, semantic and logopenic. These clinical entities have been associated with characteristic patterns of focal grey matter atrophy in left posterior frontoinsular, anterior temporal and left temporoparietal regions, respectively."
    explanation: Contrasts the anterior temporal atrophy of semantic variant PPA with the left temporoparietal atrophy of logopenic variant PPA.
  - reference: PMID:35841250
    reference_title: "Elecsys Cerebrospinal Fluid Assays Accurately Distinguish Alzheimer's Disease from Frontotemporal Lobar Degeneration."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Elecsys CSF immunoassays demonstrate good diagnostic accuracy in differentiating patients with AD from those with FTLD. These immunoassays have the potential to support clinical decision making, i.e. in diagnosing patients with FTLD by excluding patients with amyloid positivity, which is indicative of underlying AD."
    explanation: Demonstrates that CSF amyloid and tau immunoassays differentiate Alzheimer disease from FTLD syndromes including semantic variant PPA.
- name: Nonfluent/Agrammatic Variant Primary Progressive Aphasia
  disease_term:
    preferred_term: primary progressive aphasia
    term:
      id: MONDO:0019806
      label: primary progressive aphasia
  description: >-
    Nonfluent/agrammatic variant primary progressive aphasia (PNFA/nfvPPA) is a
    sister language syndrome within the frontotemporal lobar degeneration
    spectrum that also presents with progressive communication decline.
  distinguishing_features:
  - Nonfluent/agrammatic variant PPA presents with effortful, halting speech, phoneme errors, and agrammatic productions with preserved single-word comprehension and object knowledge in early stages, whereas semantic dementia presents with fluent, grammatically intact speech and profound loss of word meaning and object knowledge.
  - Neuroimaging in nonfluent/agrammatic variant PPA shows left posterior frontoinsular atrophy and dorsal white matter pathway damage, contrasting with anterior temporal atrophy and ventral pathway damage in semantic dementia.
  evidence:
  - reference: PMID:24966676
    reference_title: "Frontotemporal dementia and primary progressive aphasia, a review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "PNFA may be thought of as a Broca-like syndrome; speech production is effortful and halting, with phoneme (speech sound) errors, and simplified or “agrammatic” productions. Word and simple sentence comprehension, as well as recognition of nouns (object knowledge), are preserved, although usually with some loss of comprehension for complicated syntactic constructions."
    explanation: Contrasts the effortful, halting, agrammatic speech and preserved single-word comprehension/object knowledge of PNFA with semantic dementia.
  - reference: PMID:21666264
    reference_title: "White matter damage in primary progressive aphasias: a diffusion tensor tractography study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most prominent white matter changes were found in the dorsal pathways in non-fluent patients, in the two ventral pathways and the temporal components of the dorsal pathways in semantic variant, and in the temporoparietal component of the dorsal bundles in logopenic patients."
    explanation: Distinguishes dorsal white matter tract damage in nonfluent PPA from ventral and temporal pathway damage in semantic variant PPA.
- name: Behavioral Variant Frontotemporal Dementia
  disease_term:
    preferred_term: frontotemporal dementia
    term:
      id: MONDO:0017276
      label: frontotemporal dementia
  description: >-
    Behavioral variant frontotemporal dementia (bvFTD) shares behavioral,
    emotional, and social-cognitive abnormalities with semantic dementia,
    particularly when semantic dementia begins with right-predominant temporal
    lobe atrophy.
  distinguishing_features:
  - Behavioral variant FTD presents primarily with early personality change, alterations in social conduct, and predominant frontal cortical atrophy, whereas semantic dementia is characterized by asymmetric anterior temporal atrophy, multimodal semantic loss, and (in right-predominant cases) early progressive prosopagnosia with underlying FTLD-TDP type C pathology.
  evidence:
  - reference: PMID:24966676
    reference_title: "Frontotemporal dementia and primary progressive aphasia, a review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In bvFTD, or fvFTD, patients present with behavioral changes involving personality change and alterations in social conduct"
    explanation: Describes the primary presentation of behavioral variant FTD with personality change and altered social conduct.
  - reference: DOI:10.1111/neup.12859
    reference_title: "Clinicopathological diversity of semantic dementia: Comparisons of patients with early‐onset versus late‐onset, left‐sided versus right‐sided temporal atrophy, and TDP‐type A versus type C pathology"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Case 2 was a 63‐year‐old woman with right‐predominant temporal atrophy and TDP‐type C pathology who had prosopagnosia and personality changes."
    explanation: Illustrates the right-predominant temporal variant of semantic dementia presenting with prosopagnosia and personality changes.
treatments:
- name: Speech and Language Therapy and Lexical Retrieval Training
  description: >-
    Specialist speech and language therapy combining structured word-retrieval
    interventions (semantic, phonological, and orthographic training for
    personally relevant vocabulary) with functional communication strategies
    and family/caregiver communication support.
  treatment_term:
    preferred_term: Speech Language Therapy
    term:
      id: NCIT:C159273
      label: Speech Language Therapy
  target_phenotypes:
  - preferred_term: Anomic aphasia
    term:
      id: HP:0030784
      label: Anomic aphasia
  evidence:
  - reference: PMID:28286641
    reference_title: "Supporting communication in semantic dementia: clinical consensus from expert practitioners."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The purpose of this paper is to gain consensus regarding the clinical priorities and tasks required in supporting communication needs in those living with semantic dementia and their families, by specialist speech and language therapists (SLTs), working in clinical practice within dementia care settings in the UK."
    explanation: The abstract describes speech and language therapist-led communication support for semantic dementia.
  - reference: PMID:34266501
    reference_title: "Language training for oral and written naming impairment in primary progressive aphasia: a review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Several studies have suggested that word retrieval treatments, such as semantic, phonological and orthographic interventions, provide substantial benefits for naming abilities of PPA patients and often show a generalized effect on functional communication [24–26]."
    explanation: Demonstrates that semantic, phonological, and orthographic word-retrieval interventions improve naming abilities and functional communication in primary progressive aphasia.
- name: Symptomatic Pharmacotherapy with Selective Serotonin Reuptake Inhibitors
  description: >-
    Although no disease-modifying therapy currently exists for semantic
    dementia, selective serotonin reuptake inhibitors (SSRIs) such as
    paroxetine, sertraline, or citalopram are used for symptomatic management
    of affective and behavioral disturbances in frontotemporal dementia and
    primary progressive aphasia syndromes.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_phenotypes:
  - preferred_term: Disinhibition
    term:
      id: HP:0000734
      label: Disinhibition
  - preferred_term: Atypical behavior
    term:
      id: HP:0000708
      label: Atypical behavior
  evidence:
  - reference: PMID:24966676
    reference_title: "Frontotemporal dementia and primary progressive aphasia, a review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Treatment of depression with a selective serotonin reuptake inhibitor, such as paroxetine, sertraline, or citalopram, is frequently helpful"
    explanation: Supports the symptomatic use of selective serotonin reuptake inhibitors (paroxetine, sertraline, citalopram) in frontotemporal dementia and primary progressive aphasia management.

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The overall phenotype across all cases was consistent with classical RP, based on clinical examination and electrophysiological testing"
    explanation: Patients have the photoreceptor degeneration of classical retinitis pigmentosa.
  - reference: PMID:41513982
    reference_title: "De novo and inherited dominant variants in U4 and U6 snRNA genes cause retinitis pigmentosa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "NSR and RPE had higher expression of RNU4 (2.51×) and RNU6 (6.09×) with respect to the choroid"
    explanation: Higher U4 and U6 expression in the retinal layers affected by the disease.
  - reference: PMID:41513982
    reference_title: "De novo and inherited dominant variants in U4 and U6 snRNA genes cause retinitis pigmentosa."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is therefore plausible that the RP variants identified in RNU4-2 and RNU6 paralogs could lead to photoreceptor death and subsequent visual loss, while having no influence on the development of the brain."
    explanation: The authors propose photoreceptor death as the cellular outcome; it is not measured directly.

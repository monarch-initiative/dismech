  - reference: PMID:41513982
    reference_title: "De novo and inherited dominant variants in U4 and U6 snRNA genes cause retinitis pigmentosa."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we interpret these data as indicating that snRNA variants associated with RP are unlikely to prevent the assembly of spliceosomal complexes"
    explanation: Bounds the claim to a delay rather than a block in assembly.
  downstream:
  - target: Photoreceptor Degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Photoreceptor Degeneration
  conforms_to: "spliceosome_component_dysfunction#Failure of Splicing-Sensitive Cell Populations"
  description: >-
    Progressive loss of rod and then cone photoreceptor function produces
    classical retinitis pigmentosa. The photoreceptor degeneration itself is
    known from clinical examination and electrophysiology in patients; how the
    snRNP assembly delay leads to it is not shown. Conformance to the
    splicing-sensitive cell failure node rests on human donor-tissue RNA-seq
    showing higher U4 and U6 snRNA expression in neurosensory retina and
    retinal pigment epithelium than in choroid, which the authors take as a
    high retinal demand for snRNAs, and on the authors' proposal that the
    variants cause photoreceptor death while sparing brain development. No
    splicing defect has been measured in retinal cells.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: rod photoreceptor
    term:
      id: CL:0000604
      label: retinal rod cell
  - preferred_term: cone photoreceptor
    term:
      id: CL:0000573
      label: retinal cone cell
  evidence:

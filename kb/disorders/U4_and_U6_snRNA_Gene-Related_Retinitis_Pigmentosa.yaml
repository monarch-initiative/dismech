name: U4 and U6 snRNA Gene-Related Retinitis Pigmentosa
creation_date: "2026-11-01T21:45:46Z"
category: Mendelian
description: >-
  U4 and U6 snRNA gene-related retinitis pigmentosa is a nonsyndromic,
  dominantly transmitted rod-cone dystrophy caused by heterozygous variants in
  RNU4-2, which encodes the U4 small nuclear RNA, or in four of the five
  identical RNU6 paralogs (RNU6-1, RNU6-2, RNU6-8 and RNU6-9), which encode the
  U6 small nuclear RNA. Four recurrent variants account for the reported
  families: n.18_19insA and n.56T>C in RNU4-2, and n.55_56insG and n.56_57insG
  in the RNU6 paralogs. Variants are inherited in most families and arise de
  novo in some isolated cases, and RNU4-2 variants show incomplete penetrance.
  All of them lie in the three-way junction of the U4/U6 duplex, where the
  duplex binds the tri-snRNP splicing factors PRPF31 and PRPF3, both themselves
  causes of dominant retinitis pigmentosa. This is a different structural
  element from the RNU4-2 region mutated in ReNU syndrome, and patients have no
  neurodevelopmental phenotype. In ectopic expression assays the variant snRNAs
  bind the di-snRNP markers SART3 and PRPF31 more strongly, consistent with a
  delay in snRNP biogenesis at the di-snRNP stage rather than a failure of
  assembly, and no consistent splicing change was found in patient leukocytes.
  The presentation is classical retinitis pigmentosa with onset mostly in
  adolescence, with frequent cystoid macular edema, lens opacities and
  vitreomacular complications. In a
  cohort of 4,722 genetically undiagnosed retinitis pigmentosa cases the
  variants were estimated to explain about 1.4% of cases. Because snRNA genes
  are not captured by exome sequencing, affected individuals are usually
  exome-negative. MONDO has no class for this disease, so disease_term carries
  a free-text preferred term with no binding and the retinitis pigmentosa class
  is recorded as a broad match.
disease_term:
  preferred_term: U4 and U6 snRNA gene-related retinitis pigmentosa
parents:
- Retinitis pigmentosa
synonyms:
- RNU4-2 and RNU6-related retinitis pigmentosa
- RNU4- and RNU6-associated retinitis pigmentosa
- snRNA-related autosomal dominant retinitis pigmentosa
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0019200
      label: retinitis pigmentosa
    mapping_predicate: skos:broadMatch
    mapping_source: MONDO
    mapping_justification: >-
      This entry is the subset of retinitis pigmentosa caused by dominant
      variants in RNU4-2 and the RNU6 paralogs, so the whole retinitis
      pigmentosa class is broader than it. A narrower MONDO class was searched
      for on 2026-11-01 with the OLS4 search API restricted to MONDO. The query
      "RNU4-2" returned one class, MONDO:0008871 microcephalic osteodysplastic
      primordial dwarfism type I, whose definition names RNU4ATAC, not RNU4-2.
      The queries "RNU6", "RNU6-1", "U4 snRNA", "U6 snRNA" and "snRNA retinitis
      pigmentosa" returned no classes. The newest numbered classes,
      retinitis pigmentosa 96 to 101 (exact-label OLS4 search; "retinitis
      pigmentosa 102" returned nothing), are not this disease: the OLS4 v2
      records of retinitis pigmentosa 96, 98, 99, 100 and 101 link to HGNC
      10521, 25018, 5386, 21485 and 2074, which genenames.org resolves to SAG,
      TMEM216, IDH3G, TBC1D32 and CLN3, and the retinitis pigmentosa 97 record
      links to no RNU4 or RNU6 gene.
inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  description: >-
    Heterozygous variants are transmitted dominantly from either parent in
    most families (61%), and arise de novo in some isolated cases. The RNU6
    n.55_56insG variant was shown to be de novo in eight sporadic cases, while
    n.56_57insG was seen only in dominant pedigrees. Nine obligate RNU4-2
    carriers had no visual symptoms, so penetrance is incomplete for RNU4-2
    variants.
  evidence:
  - reference: PMID:41513982
    reference_title: "De novo and inherited dominant variants in U4 and U6 snRNA genes cause retinitis pigmentosa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "in our study most families with RP (61%) bore RNU4-2 and RNU6 changes as inherited variants"
    explanation: Most families carry the variant by inheritance rather than de novo.
  - reference: PMID:41513982
    reference_title: "De novo and inherited dominant variants in U4 and U6 snRNA genes cause retinitis pigmentosa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Notably, n.55_56insG was confirmed to be a de novo event in eight individuals, clinically identified as sporadic cases."
    explanation: Confirmed de novo occurrence in sporadic cases.
  - reference: PMID:41513982
    reference_title: "De novo and inherited dominant variants in U4 and U6 snRNA genes cause retinitis pigmentosa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of note, incomplete penetrance was observed for nine obligate carriers, without visual symptoms"
    explanation: Incomplete penetrance among RNU4-2 obligate carriers.
  - reference: PMID:41513982
    reference_title: "De novo and inherited dominant variants in U4 and U6 snRNA genes cause retinitis pigmentosa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We did not observe the same trend for RP, with variants being inherited from either of the parents"
    explanation: Transmission occurs from mothers and fathers, unlike the maternal bias reported for ReNU syndrome.
pathophysiology:
- name: U4/U6 Three-Way Junction snRNA Variant
  conforms_to: "spliceosome_component_dysfunction#Germline Spliceosome Component Variant"
  description: >-
    A heterozygous variant in RNU4-2 or in one of the RNU6 paralogs changes the
    sequence of U4 or U6 snRNA within the three-way junction of the U4/U6
    duplex, bounded by stem I, stem II and the U4 5' stem-loop. RNA folding
    predictions suggest the RNU4-2 variants enlarge the internal loop and the
    RNU6 insertions lengthen stem I and reorient the 5' stem-loop; the authors
    note these structural effects are not yet verified experimentally. Because
    only about a quarter of cellular U4 or a tenth of U6 would be mutant, and
    because common benign variants at the same position appear not to enter the
    assembly pathway, the authors favour a gain-of-function or dominant-negative
    effect over haploinsufficiency. Evidence for the variant spectrum is from
    human genetic studies; the structural mapping is computational.
  biological_scale: MOLECULAR

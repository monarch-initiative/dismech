      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: "The mutated and neighboring U4 and U6 nucleotides detected in RP cases directly participate in the binding of PRPF31 and PRPF3"
      explanation: >-
        Analysis of an existing cryo-EM structure (PDB 6QW6) shows the mutated
        nucleotides contact the tri-snRNP factors whose binding is altered.
- name: Increased Di-snRNP Factor Binding and Delayed Tri-snRNP Assembly
  description: >-
    Ectopically expressed U4 and U6 snRNAs carrying RP variants co-purify more
    SART3 and, partially, more PRPF31, while binding of the U5 snRNP protein
    SNRNP200 is unchanged or reduced. The authors read this as a modest delay in
    the transition from the U4/U6 di-snRNP to the U4/U6.U5 tri-snRNP, not a
    failure of assembly: all changes were under 1.5-fold. The ReNU variant
    n.64_65insT tested alongside showed no significant change, and the RP and
    ReNU variants did not differ significantly from each other. Evidence is from
    cell-based immunoprecipitation assays.
  biological_scale: MOLECULAR
  cellular_components:

genetic:
- name: RNU4-2
  gene_term:
    preferred_term: RNU4-2
    term:
      id: hgnc:10193
      label: RNU4-2
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    RNU4-2 encodes U4 snRNA, which pairs with U6 in the U4/U6 di-snRNP and
    U4/U6.U5 tri-snRNP. Recurrent RP variants were found in 41 affected
    individuals from 15 families. The paralog RNU4-1, which differs at four
    positions, carried no case-enriched variant. RNU4-2 is the same gene that
    causes ReNU syndrome, through variants in a different structural region; it
    is a non-coding gene, so the snRNA has no protein molecular function.
  variants:
  - name: n.18_19insA
    variant_type: insertion
    clinical_significance: PATHOGENIC
    description: >-
      Single-nucleotide insertion between stem II and the U4 5' stem-loop
      (NR_003137.2:n.18_19insA). Found in the founding family and three further
      families, and once de novo; significantly enriched in cases over gnomAD
      and All of Us controls.
    evidence:
    - reference: PMID:41513982
      reference_title: "De novo and inherited dominant variants in U4 and U6 snRNA genes cause retinitis pigmentosa."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The n.18_19insA allele was significantly enriched in the RP cohort compared with both the gnomAD and the All of Us databases"
      explanation: Case-control enrichment of the insertion.
  - name: n.56T>C
    variant_type: single nucleotide variant
    clinical_significance: PATHOGENIC
    description: >-
      Disrupts the first base pair of the U4/U6 duplex in stem I. Recurred in
      four families in the initial cohort and six more in later screening, and
      was absent from controls. It did not score significantly in saturation
      genome editing of RNU4-2 in HAP1 cells, which reads out cell fitness
      rather than retinal function.
    evidence:
    - reference: PMID:41513982
      reference_title: "De novo and inherited dominant variants in U4 and U6 snRNA genes cause retinitis pigmentosa."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "one of which (n.56T>C) recurred in eight individuals from four families"
      explanation: Recurrence of n.56T>C in the initial cohort.
    - reference: PMID:41951737
      reference_title: "Saturation editing of RNU4-2 reveals distinct dominant and recessive disorders."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "It is notable, for instance, that a variant recently associated with retinitis pigmentosa (n.56T>C) did not score significantly."
      explanation: The variant has no detectable fitness effect in the HAP1 saturation editing assay.
  evidence:
  - reference: PMID:41513982
    reference_title: "De novo and inherited dominant variants in U4 and U6 snRNA genes cause retinitis pigmentosa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Altogether, recurrent variants in RNU4-2 were identified in 41 affected individuals from 15 families"
    explanation: Establishes RNU4-2 as a cause of dominant retinitis pigmentosa.
  - reference: PMID:41974596
    reference_title: "A new era for the dark genome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "variants in noncoding small nuclear RNA genes, RNU4-2 and four RNU6 paralogs, represent a previously unrecognized cause of autosomal dominant retinitis pigmentosa"
    explanation: An independent commentary restating the gene-disease finding.

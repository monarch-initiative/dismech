discussions:
- discussion_id: u4u6_rp_no_detected_missplicing
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Increased Di-snRNP Factor Binding and Delayed Tri-snRNP Assembly
  - pathophysiology#Photoreceptor Degeneration
  prompt: >-
    Does delayed snRNP assembly cause mis-splicing in photoreceptors, and if
    so of which transcripts?
  rationale: >-
    Leukocyte RNA-seq from nine patients found no consistent splicing change,
    and the two shared events differed by under 10%. Leukocytes are not the
    affected tissue, and the snRNA demand of retina is several-fold higher, so
    a retina-restricted splicing defect is not excluded. Until splicing is
    measured in patient-derived photoreceptors or retinal organoids, the step
    between the assembly delay and photoreceptor degeneration is unknown, which
    is why this entry does not conform to the module's mis-splicing node.
  evidence:
  - reference: PMID:41513982
    reference_title: "De novo and inherited dominant variants in U4 and U6 snRNA genes cause retinitis pigmentosa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we did not observe any major splicing anomalies in transcripts from patients with RP, with the only two significant events showing differences below 10% in expression"
    explanation: The absence of a splicing signature in patient blood that leaves the gap open.
- discussion_id: u4u6_rp_rnu6_7_spared
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - genetic#RNU6-1
  prompt: >-
    Why does RNU6-7 carry no pathogenic variant when the other four identical
    RNU6 paralogs do?
  rationale: >-
    RNU6-7 has the same chromatin marks of active transcription in retina as
    the other paralogs, so differential expression does not explain it, and the
    recurrent n.55_56insG variant is present in RNU6-7 in control individuals
    of African ancestry in gnomAD and All of Us. The authors leave this
    unresolved. It bears on whether every RNU6 paralog contributes equally to
    the retinal U6 pool.
  evidence:
  - reference: PMID:41513982
    reference_title: "De novo and inherited dominant variants in U4 and U6 snRNA genes cause retinitis pigmentosa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We also identified the recurrent variant n.55_56insG in RNU6-7 in six control individuals of African or African American ancestry in gnomAD v.4.1"
    explanation: The recurrent pathogenic insertion occurs in RNU6-7 in unaffected controls.
  - reference: PMID:41513982
    reference_title: "De novo and inherited dominant variants in U4 and U6 snRNA genes cause retinitis pigmentosa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These seemingly contradictory observations merit further investigations in future studies."
    explanation: The authors state the question is open.

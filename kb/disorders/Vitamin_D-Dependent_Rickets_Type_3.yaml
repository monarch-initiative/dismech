    - reference: PMID:36656330
      reference_title: "Vitamin D-Dependent Rickets Type 3: A Case Report and Systematic Review."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        His biochemical studies now showed a normal calcium (2.25 mmol/L), PTH
        (38 ng/L), and 25(OH)D (126.3 mmol/L) and radiographs of his bones showed
        marked improvements (Fig. 1B).
      explanation: >-
        Documents mineral-ion normalization and skeletal improvement under the

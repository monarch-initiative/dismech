name: Vitamin D-Dependent Rickets Type 3
synonyms:
- VDDR3
- CYP3A4-related vitamin D-dependent rickets
- Vitamin D hypercatabolism rickets
creation_date: "2026-08-19T00:00:00Z"
category: Mendelian
description: >-
  Vitamin D-dependent rickets type 3 is caused by a de novo gain-of-function
  missense variant in CYP3A4 that converts a promiscuous drug-metabolizing enzyme
  into a highly efficient inactivator of vitamin D metabolites. Both
  25-hydroxyvitamin D and calcitriol are low, but for the opposite reason to
  types 1A and 1B: synthesis is intact and catabolism is accelerated. This makes
  type 3 the only member of the series in which the lesion is in degradation
  rather than production or reception of the hormone, and it explains the
  characteristic resistance to both parent and activated vitamin D - supplied
  hormone is destroyed as fast as it is given.

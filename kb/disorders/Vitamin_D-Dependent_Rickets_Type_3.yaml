diagnosis:
- name: Biochemical and Radiographic Assessment of Calciopenic Rickets
  description: >-
    Initial evaluation establishes active calciopenic rickets and its severity
    with serum calcium, phosphate, alkaline phosphatase, parathyroid hormone,
    calcifediol, and calcitriol together with skeletal radiographs. The typical
    VDDR3 pattern combines low calcium, phosphate, calcifediol, and calcitriol
    with elevated parathyroid hormone and alkaline phosphatase; active treatment
    can alter individual measurements.
  diagnosis_term:
    preferred_term: biochemical and radiographic assessment
  markers: >-
    Serum calcium, phosphate, alkaline phosphatase, parathyroid hormone,
    25-hydroxyvitamin D, 1,25-dihydroxyvitamin D, and metaphyseal radiographs.
  results: >-
    Calciopenic biochemical abnormalities with radiographic metaphyseal
    splaying, cupping, lucency, osteopenia, or other evidence of active rickets.
  evidence:
  - reference: PMID:29461981
    reference_title: "CYP3A4 mutation causes vitamin D-dependent rickets type 3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      bilateral genu varum, poor growth, and reduced serum calcium and phosphorus
      with elevated serum alkaline phosphatase and parathyroid hormone (Table 1).
    explanation: >-
      Documents the characteristic mineral and regulatory-hormone pattern in a
      founding patient.
  - reference: PMID:29461981
    reference_title: "CYP3A4 mutation causes vitamin D-dependent rickets type 3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Wrist radiographs from these patients show the typical features of
      rickets: younger growing patients have bowing (green triangle),
      metaphyseal splaying (yellow triangle), and cupping (red triangle), as in
      proband 1.1 (P 1.1); older patients have metaphyseal lucency (blue
      triangle) and osteopenia (purple triangle), as in proband 2.1
    explanation: >-
      Establishes the radiographic component and its age-dependent findings.
- name: Serial Vitamin D Metabolite Clearance Challenge
  description: >-
    In a child with calciopenic rickets and inadequate response to conventional
    vitamin D, serial calcifediol and calcitriol measurements after a supervised
    oral cholecalciferol dose can demonstrate adequate initial absorption and
    production followed by unusually rapid clearance. This is a mechanistic
    clue, not a substitute for molecular confirmation.
  diagnosis_term:
    preferred_term: Vitamin D Measurement
    term:
      id: NCIT:C84818
      label: Vitamin D Measurement
  markers: Serial serum 25-hydroxyvitamin D and 1,25-dihydroxyvitamin D.
  results: >-
    Initial rise after dosing followed by a substantially faster decline than
    expected in controls or nutritional rickets.
  evidence:
  - reference: PMID:36656330
    reference_title: "Vitamin D-Dependent Rickets Type 3: A Case Report and Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Serial measurements of vitamin D metabolites after a single 150,000 IU
      dose of cholecalciferol demonstrated an accelerated inactivation of
      25(OH)D and 1,25(OH)2D.
    explanation: >-
      Directly supports the dynamic clearance test in the Brazilian patient.
- name: CYP3A4 Molecular Testing
  description: >-
    Sequencing that includes CYP3A4 can confirm the diagnosis by identifying the
    recurrent heterozygous c.902T>C (p.Ile301Thr) variant. Because the published
    molecular spectrum currently consists of this single allele, another CYP3A4
    variant requires independent pathogenicity assessment rather than automatic
    assignment to VDDR3.
  diagnosis_term:
    preferred_term: Molecular Analysis
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  markers: Heterozygous CYP3A4 c.902T>C (p.Ile301Thr).
  results: Molecular confirmation of CYP3A4-related VDDR3.
  evidence:
  - reference: PMID:38179381
    reference_title: "CYP3A4 Mutation Causes Vitamin D-Dependent Rickets Type 3: A Case Report in Saudi Arabia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the finding of a heterozygous missense variant in CYP3A4: c.902 T > C;
      p.Ile301Thr in the CYP3A4 gene confirms the diagnosis of VDDR3.
    explanation: >-
      Explicitly identifies the recurrent heterozygous allele as molecularly
      confirmatory in the Saudi patient.
differential_diagnoses:
- name: Nutritional vitamin D deficiency rickets
  description: >-
    Nutritional deficiency can reproduce low calcifediol, low calcitriol,
    secondary hyperparathyroidism, and rickets. Adequate dosing ordinarily
    produces a sustained metabolite response, whereas VDDR3 shows rapid loss
    after an initial rise and carries the CYP3A4 p.Ile301Thr variant.
  disease_term:
    preferred_term: vitamin D deficiency
    term:
      id: MONDO:0100471
      label: vitamin D deficiency
  distinguishing_features:
  - Dietary or sunlight insufficiency rather than a pathogenic CYP3A4 allele.
  - Sustained response to conventional replacement rather than accelerated post-dose clearance.
  evidence:
  - reference: PMID:36656330
    reference_title: "Vitamin D-Dependent Rickets Type 3: A Case Report and Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Individuals who carry this heterozygous mutation have the same clinical
      and biochemical features as children with nutritional vitamin D
      deficiency, which makes it important to consider CYP3A4 mutations in
      patients with vitamin D deficiency who do not respond to conventional
      doses of vitamin D.
    explanation: >-
      Establishes the close phenotypic overlap and deficient conventional-dose
      response that prompts evaluation for VDDR3.
- name: Medication-induced CYP3A4 vitamin D hypercatabolism
  description: >-
    CYP3A4-inducing drugs can phenocopy selective vitamin D metabolite
    inactivation, but the process is exposure-related rather than the recurrent
    germline p.Ile301Thr disorder. Medication history and molecular testing
    separate this acquired mechanism from VDDR3.
  disease_term:
    preferred_term: medication-induced vitamin D hypercatabolism
  distinguishing_features:
  - Exposure to a CYP3A4-inducing medication such as an anticonvulsant or rifampin.
  - Absence of the recurrent germline CYP3A4 p.Ile301Thr variant.
  evidence:
  - reference: PMID:29461981
    reference_title: "CYP3A4 mutation causes vitamin D-dependent rickets type 3."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      the genetic gain of function in CYP3A4 recapitulated the selective
      inactivation of vitamin D metabolites well described in patients taking
      drugs that induce CYP3A4 (21).
    explanation: >-
      Establishes the acquired medication-induced mechanistic phenocopy while
      distinguishing it from germline gain of function.
- name: Vitamin D-dependent rickets type 1A
  description: >-
    CYP27B1 deficiency produces low calcitriol but normal or increased
    calcifediol because renal 1-alpha-hydroxylation is blocked. VDDR3 instead
    depletes both metabolites through accelerated catabolism and is associated
    with heterozygous CYP3A4 rather than biallelic CYP27B1 variation.
  disease_term:
    preferred_term: vitamin D-dependent rickets, type 1A
    term:
      id: MONDO:0020723
      label: vitamin D-dependent rickets, type 1A
  distinguishing_features:
  - Normal or increased calcifediol with low calcitriol.
  - Biallelic CYP27B1 loss of function.
  evidence:
  - reference: PMID:32596195
    reference_title: "Diagnosis and Management of Vitamin D Dependent Rickets."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Plasma concentrations of 1,25(OH)2D are low or even undetectable. By
      contrast, plasma concentrations of 25 (OH)D are normal or increased,
      likely reflecting the effects of both vitamin D supplementation and
      decreased clearance of 25 (OH)D due to lack of induction of CYP24A1 by the
      absence of 1,25(OH)2D.
    explanation: >-
      The review states the metabolite pattern that separates type 1A from
      VDDR3.
- name: Vitamin D-dependent rickets type 1B
  description: >-
    CYP2R1 deficiency lowers calcifediol by impaired 25-hydroxylation and can
    therefore resemble VDDR3 biochemically. The distinction is the CYP2R1
    genotype and failure to generate an adequate calcifediol increment, versus
    an initial increment followed by accelerated clearance in VDDR3.
  disease_term:
    preferred_term: vitamin D hydroxylation-deficient rickets, type 1B
    term:
      id: MONDO:0010810
      label: vitamin D hydroxylation-deficient rickets, type 1B
  distinguishing_features:
  - CYP2R1 loss-of-function genotype.
  - Negligible or blunted calcifediol generation rather than rapid post-peak clearance.
  evidence:
  - reference: PMID:32596195
    reference_title: "Diagnosis and Management of Vitamin D Dependent Rickets."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      VDDR1b (OMIM #600081) is due to mutations in CYP2R1 that decrease
      expression or function of the encoded CYP2R1 enzyme, the principal
      25-hydroxylase. VDDR1b is associated with hypocalcemia, secondary
      hyperparathyroidism and low plasma concentrations of 25(OH)D, with reduced
      clinical and biochemical responsiveness to conventional doses of vitamin
      D (28–33).
    explanation: >-
      Defines the CYP2R1 activation defect and its overlapping biochemical
      phenotype.
- name: Vitamin D-dependent rickets type 2A
  description: >-
    Biallelic VDR loss causes target-tissue resistance with elevated rather than
    depleted calcitriol. Alopecia is a useful but incompletely sensitive clue.
  disease_term:
    preferred_term: vitamin D-dependent rickets, type 2A
    term:
      id: MONDO:0010186
      label: vitamin D-dependent rickets, type 2A
  distinguishing_features:
  - Elevated calcitriol despite hypocalcemic rickets.
  - Biallelic VDR loss of function; alopecia in about half of reported patients.
  evidence:
  - reference: PMID:32596195
    reference_title: "Diagnosis and Management of Vitamin D Dependent Rickets."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Biochemical studies show low serum levels of calcium and phosphorus and
      elevated serum concentrations of 1,25(OH)2D, in the range of 50–1,000
      pg/mL (normal in children is 30–100 pg/mL); serum concentrations of
      25(OH)D may be normal or elevated due to lack of induction of CYP24A1,
      which requires VDR action.
    explanation: >-
      States the high-calcitriol pattern that distinguishes receptor resistance
      from VDDR3.
  - reference: PMID:32596195
    reference_title: "Diagnosis and Management of Vitamin D Dependent Rickets."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The clinical features of VDDR2a are very similar to those of patients with
      other forms of VDDR, but about fifty percent of patients with VDDR2a have
      alopecia.
    explanation: >-
      Directly supports the approximate alopecia frequency used as a secondary
      distinguishing clue.
- name: Vitamin D-dependent rickets type 2B
  description: >-
    VDDR2B has been proposed as a VDDR2A-like target-tissue resistance disorder
    without a VDR variant, potentially mediated by excess expression of a
    nuclear response-element-binding protein. No causative gene is established,
    and the review questions whether it is a distinct disorder. Its reported
    receptor-resistance pattern, rather than depleted vitamin D metabolites,
    separates the proposal from molecularly defined CYP3A4-related VDDR3.
  disease_term:
    preferred_term: vitamin D-dependent rickets, type 2B
    term:
      id: MONDO:0010931
      label: vitamin D-dependent rickets, type 2B
  distinguishing_features:
  - VDDR2A-like vitamin D target-tissue resistance without a VDR defect, rather than accelerated metabolite depletion.
  - No established causative gene and no CYP3A4 p.Ile301Thr variant; the status of VDDR2B as a distinct entity remains uncertain.
  evidence:
  - reference: PMID:32596195
    reference_title: "Diagnosis and Management of Vitamin D Dependent Rickets."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      VDDR2b (OMIM 600785) resembles VDDR2a but is not caused by a defect in the
      VDR gene. Rather, the molecular defect appears to be overexpression of a
      nuclear protein that specifically interacts with a DNA response element
      that binds retinoid X receptor-VDR heterodimers.
    explanation: >-
      Defines the proposed receptor-response mechanism while appropriately using
      tentative language rather than assigning an established causative gene.
  - reference: PMID:32596195
    reference_title: "Diagnosis and Management of Vitamin D Dependent Rickets."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      No gene has yet been identified as the cause of VDDR2b so it is impossible
      to state with precision the number of affected subjects.
    explanation: >-
      Directly supports the lack of an established gene and the uncertainty of
      the published case denominator.
  - reference: PMID:32596195
    reference_title: "Diagnosis and Management of Vitamin D Dependent Rickets."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      VDDR2b appears to be a very uncommon condition, if indeed it is a distinct
      disorder at all.
    explanation: >-
      The review explicitly cautions that VDDR2B may not be a distinct disease,
      preventing overstatement of this differential.
- name: Hypophosphatemic rickets
  description: >-
    Primary phosphopenic rickets shares hypophosphatemia, limb deformity, and
    growth-plate disease, but typically has normal calcium, parathyroid hormone,
    and vitamin D status with evidence of renal phosphate wasting; VDDR3 is a
    calciopenic disorder with elevated parathyroid hormone and depleted vitamin
    D metabolites.
  disease_term:
    preferred_term: hypophosphatemic rickets
    term:
      id: MONDO:0024300
      label: hypophosphatemic rickets
  distinguishing_features:
  - Normal calcium and parathyroid hormone in primary phosphopenic disease.
  - Reduced tubular phosphate reabsorption in genetic renal phosphate-wasting disorders such as XLH.
  - No CYP3A4 p.Ile301Thr variant or accelerated vitamin D metabolite clearance.
  evidence:
  - reference: PMID:32596195
    reference_title: "Diagnosis and Management of Vitamin D Dependent Rickets."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Subjects who have hypophosphatemia and normal serum levels of PTH, calcium,
      and 25(OH)D are likely to have phosphopenic rickets; a normal or elevated
      tubular reabsorption of phosphorus (TRP) will be found in subjects with
      inadequate intake or absorption of phosphorus. By contrast, patients with
      XLH and other genetic or acquired causes of renal phosphate wasting will
      have reduced TRP values.
    explanation: >-
      The diagnostic review gives the mineral pattern distinguishing primary
      phosphopenic rickets from calciopenic VDDR3.
- name: Hypophosphatasia
  description: >-
    Hypophosphatasia can produce a rickets-like metaphyseal appearance, but
    tissue-nonspecific alkaline phosphatase activity is low rather than elevated.
    Persistently low age-adjusted alkaline phosphatase and pathogenic ALPL
    variation favor hypophosphatasia over VDDR3.
  disease_term:
    preferred_term: hypophosphatasia
    term:
      id: MONDO:0018570
      label: hypophosphatasia
  distinguishing_features:
  - Low rather than elevated age-adjusted serum alkaline phosphatase activity.
  - Pathogenic ALPL variation rather than CYP3A4 p.Ile301Thr.
  evidence:
  - reference: PMID:32596195
    reference_title: "Diagnosis and Management of Vitamin D Dependent Rickets."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Because the appearance of the growth plate in children with rickets can
      resemble that of subjects with hypophosphatasia or metaphyseal dysplasias,
      a reasonable first step in diagnosis is to determine the serum level of
      alkaline phosphatase (Figure 2). Using age- and sex-related references
      ranges, alkaline phosphatase activity will usually be elevated in rickets,
      normal in metaphyseal dysplasia, and low in hypophosphatasia.
    explanation: >-
      Directly establishes the radiographic mimic and the opposite alkaline
      phosphatase direction that separates it from VDDR3.
animal_models: []
experimental_models:
- name: CYP3A4-I301T HEK293T Substrate-Selectivity Assays
  description: >-
    HEK293T cells expressing wild-type CYP3A4, CYP3A4-I301T, or CYP24A1 were
    compared in a mammalian two-hybrid reporter system in which intracellular
    calcitriol drives luciferase; a parallel luciferin IPA assay compared activity
    toward a non-vitamin D CYP3A4 substrate. Increased calcitriol inactivation
    with decreased luciferin IPA turnover establishes substrate selectivity. The
    systems isolate the molecular enzymatic phenotype but do not reproduce
    patient mineral homeostasis or skeletal disease.
  experimental_model_type: CELL_LINE
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_source: HEK293T cells obtained from ATCC (CRL-3216)
  culture_system: >-
    Transfected mammalian two-hybrid calcitriol-responsive reporter and luciferin
    IPA CYP3A4 activity assays
  conditions:
  - Recombinant CYP3A4-I301T
  - Recombinant wild-type CYP3A4
  - Recombinant CYP24A1 comparator
  publication: PMID:29461981
  modeled_mechanisms:
  - target: CYP3A4 p.Ile301Thr Substrate-Selective Gain of Function
    relationship: MEASURES
    description: >-
      The paired reporters compare increased calcitriol-inactivating function
      with activity toward a non-vitamin D substrate.
    fidelity: MODERATE
    limitations: >-
      Transient recombinant expression and an indirect reporter do not capture
      physiological hepatic abundance, whole-body pharmacokinetics, mineral
      feedback, or growth-plate disease.
    readouts:
    - name: Calcitriol inactivation
      target: CYP3A4 p.Ile301Thr Substrate-Selective Gain of Function
      direction: INCREASED
      interpretation: >-
        CYP3A4-I301T inactivated calcitriol more strongly than wild-type CYP3A4
        and CYP24A1 in the reporter comparison.
      evidence:
      - reference: PMID:29461981
        reference_title: "CYP3A4 mutation causes vitamin D-dependent rickets type 3."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          CYP3A4 p.I301T had increased inactivation of calcitriol relative to WT
          (**P < 0.01 by 2-way ANOVA for curve)
        explanation: >-
          Directly reports the direction of the model readout.
    - name: Luciferin IPA turnover
      target: CYP3A4 p.Ile301Thr Substrate-Selective Gain of Function
      direction: DECREASED
      interpretation: >-
        CYP3A4-I301T showed lower activity than wild type toward this
        non-vitamin D substrate, demonstrating that the gain was not global.
      evidence:
      - reference: PMID:29461981
        reference_title: "CYP3A4 mutation causes vitamin D-dependent rickets type 3."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          The p.I301T mutant had significantly decreased activity for luciferin
          IPA relative to the WT enzyme (30.0 ± 1.6 vs. 50.1 ± 1.6, n = 4 for
          each, ***P < 0.001).
        explanation: >-
          Directly reports the decreased non-vitamin D substrate readout.
    evidence:
    - reference: PMID:29461981
      reference_title: "CYP3A4 mutation causes vitamin D-dependent rickets type 3."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        In vitro, the mutant CYP3A4 oxidized 1,25-dihydroxyvitamin D with
        10-fold greater activity than WT CYP3A4 and 2-fold greater activity than
        CYP24A1, the principal inactivator of vitamin D metabolites.
      explanation: >-
        Confirms that the recombinant variant system measures strongly increased
        calcitriol oxidation.
  evidence:
  - reference: PMID:29461981
    reference_title: "CYP3A4 mutation causes vitamin D-dependent rickets type 3."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Because the kidney cell line (HEK293T) does not express CYP3A4, we used it
      to create a cell-based assay.
    explanation: >-
      Identifies the cell line and rationale for recombinant expression.
- name: Recombinant E. coli CYP3A4-I301T Membrane-Fraction Assay
  description: >-
    Membrane fractions from recombinant Escherichia coli expressing
    CYP3A4-I301T or wild-type CYP3A4 were used to characterize product formation
    from calcifediol and calcitriol. The system identified additional
    11-alpha-hydroxylated, low-receptor-affinity products but cannot model human
    tissue expression or systemic clearance.
  experimental_model_type: OTHER
  organism:
    preferred_term: Escherichia coli
    term:
      id: NCBITaxon:562
      label: Escherichia coli
  cell_source: Membrane fractions from recombinant Escherichia coli
  culture_system: Cell-free recombinant CYP3A4 membrane-fraction enzymology
  conditions:
  - Recombinant human CYP3A4-I301T
  - Recombinant human wild-type CYP3A4
  publication: PMID:41046353
  modeled_mechanisms:
  - target: Accelerated Formation of Low-Activity Vitamin D Metabolites
    relationship: MEASURES
    description: >-
      Directly measures variant-specific vitamin D metabolite product formation.
    fidelity: MODERATE
    limitations: >-
      Bacterial membrane fractions isolate enzyme chemistry but omit mammalian
      cofactors, hepatic and intestinal regulation, circulating binding
      proteins, feedback, and whole-organism pharmacokinetics.
    readouts:
    - name: Formation of additional low-affinity vitamin D metabolites
      target: Accelerated Formation of Low-Activity Vitamin D Metabolites
      direction: INCREASED
      interpretation: >-
        Relative to wild type, CYP3A4-I301T generated additional
        11-alpha-hydroxylated products with lower vitamin D receptor affinity.
      evidence:
      - reference: PMID:41046353
        reference_title: "Distinct and potent vitamin D hydroxylation activity acquired by the CYP3A4 I301T single amino acid substitution causes type 3 rickets."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Surprisingly, we found that CYP3A4-I301T efficiently produced
          additional metabolites compared to the wild-type CYP3A4, including
          11α,25-dihydroxyvitamin D3 and 1α,11α,25-trihydroxyvitamin D3, which
          have much lower affinity for the vitamin D receptor than do 25(OH)D3
          and 1α,25(OH)2D3, respectively.
        explanation: >-
          Directly reports the product and affinity readout.
    evidence:
    - reference: PMID:41046353
      reference_title: "Distinct and potent vitamin D hydroxylation activity acquired by the CYP3A4 I301T single amino acid substitution causes type 3 rickets."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        In this study, we investigated the enzymatic properties of CYP3A4-I301T
        using membrane fractions from recombinant Escherichia coli expressing
        the variant.
      explanation: >-
        Defines the recombinant membrane-fraction experimental system.
  evidence:
  - reference: PMID:41046353
    reference_title: "Distinct and potent vitamin D hydroxylation activity acquired by the CYP3A4 I301T single amino acid substitution causes type 3 rickets."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In this study, we investigated the enzymatic properties of CYP3A4-I301T
      using membrane fractions from recombinant Escherichia coli expressing the
      variant.
    explanation: >-
      Identifies the non-animal biochemical model.
computational_models:
- name: CYP3A4-I301T Vitamin D Molecular Docking Model
  description: >-
    Molecular docking predicted a Thr301 hydrogen bond to the calcifediol
    3-beta-hydroxyl group and interactions of the 25-hydroxyl group with Arg372
    and Glu374, positioning substrate for 11-alpha hydroxylation. This is a
    structural explanation for product selectivity, not an experimentally
    determined CYP3A4-I301T structure.
  model_type: MOLECULAR_DOCKING
  perturbations:
  - preferred_term: CYP3A4
    term:
      id: hgnc:2637
      label: CYP3A4
  publication: PMID:41046353
  modeled_mechanisms:
  - target: CYP3A4 p.Ile301Thr Substrate-Selective Gain of Function
    relationship: PARTIALLY_RECAPITULATES
    description: >-
      Provides an in-silico substrate-pose explanation for variant-specific
      11-alpha hydroxylation.
    fidelity: LOW
    limitations: >-
      The predicted contacts have not been confirmed by an experimental
      CYP3A4-I301T-substrate structure and do not quantify in-vivo flux.
    evidence:
    - reference: PMID:41046353
      reference_title: "Distinct and potent vitamin D hydroxylation activity acquired by the CYP3A4 I301T single amino acid substitution causes type 3 rickets."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: >-
        Docking simulations suggested that the 3β-hydroxyl group of 25(OH)D3
        forms a hydrogen bond with Thr301 of CYP3A4-I301T, while the
        25-hydroxyl group interacts with Arg372 and Glu374, favoring
        hydroxylation at the 11α-position.
      explanation: >-
        States the computationally predicted contacts and positional
        consequence without presenting them as experimental structure.
  evidence:
  - reference: PMID:41046353
    reference_title: "Distinct and potent vitamin D hydroxylation activity acquired by the CYP3A4 I301T single amino acid substitution causes type 3 rickets."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      Docking simulations suggested that the 3β-hydroxyl group of 25(OH)D3
      forms a hydrogen bond with Thr301 of CYP3A4-I301T, while the 25-hydroxyl
      group interacts with Arg372 and Glu374, favoring hydroxylation at the
      11α-position.
    explanation: >-
      Defines the molecular-docking model and its predicted binding geometry.

name: Vitamin D-Dependent Rickets Type 3
synonyms:
- VDDR3
- CYP3A4-related vitamin D-dependent rickets
- Vitamin D-dependent rickets, CYP3A4-related
- Vitamin D hypercatabolism rickets
creation_date: "2026-08-19T00:00:00Z"
updated_date: "2026-08-20T06:33:14Z"
category: Mendelian
description: >-
  Vitamin D-dependent rickets type 3 is an autosomal dominant vitamin D
  hypercatabolism disorder caused, in at least five molecularly described
  patients reported to date (four in peer-reviewed journal reports and one in a
  conference abstract), by the recurrent heterozygous CYP3A4 c.902T>C
  (p.Ile301Thr) gain-of-function variant. The altered enzyme accelerates
  conversion of calcifediol and calcitriol to metabolites with much lower
  vitamin D receptor affinity. Low circulating concentrations of both vitamin D
  metabolites lead to secondary hyperparathyroidism, hypocalcemia,
  hypophosphatemia, and childhood rickets. Unlike an activation defect or
  receptor resistance, the lesion is excessive degradation: conventional doses
  are inadequate, but pharmacologic-dose cholecalciferol or calcitriol can
  maintain mineral homeostasis; cholecalciferol regimens have also healed
  rickets. This disease entry is kept
  separate from acquired CYP3A4 induction by medications and from the other
  genetically distinct vitamin D-dependent rickets.

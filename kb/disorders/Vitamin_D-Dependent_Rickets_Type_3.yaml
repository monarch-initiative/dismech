variants:
- name: CYP3A4 c.902T>C (p.Ile301Thr)
  gene:
    preferred_term: CYP3A4
    term:
      id: hgnc:2637
      label: CYP3A4
  type: missense
  clinical_significance: PATHOGENIC
  description: >-
    A recurrent heterozygous germline missense variant affecting substrate
    recognition site 4. The threonine substitution changes CYP3A4 substrate
    positioning and selectively increases vitamin D metabolite hydroxylation;
    activity toward at least one non-vitamin D substrate was not increased.
  evidence:
  - reference: PMID:29461981
    reference_title: "CYP3A4 mutation causes vitamin D-dependent rickets type 3."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In vitro, the mutant CYP3A4 oxidized 1,25-dihydroxyvitamin D with 10-fold
      greater activity than WT CYP3A4 and 2-fold greater activity than CYP24A1,
      the principal inactivator of vitamin D metabolites.
    explanation: >-
      Functional comparison demonstrates a strong, substrate-directed gain of
      vitamin D catabolic activity.
pathophysiology:
- name: CYP3A4 p.Ile301Thr Substrate-Selective Gain of Function
  description: >-
    The heterozygous p.Ile301Thr substitution remodels CYP3A4 substrate
    recognition site 4. It confers increased and altered hydroxylation of
    calcifediol and calcitriol rather than a nonspecific increase in all CYP3A4
    activity.

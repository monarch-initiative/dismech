discussions:
- discussion_id: gap_vddr3_natural_history_and_inheritance
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What are the penetrance, phenotype range, long-term course, and true
    inherited transmission pattern of CYP3A4 p.Ile301Thr VDDR3?
  attaches_to:
  - pathophysiology#CYP3A4 p.Ile301Thr Substrate-Selective Gain of Function
  rationale: >-
    At least five molecularly described patients are published, all with the
    same allele; four are in peer-reviewed journal reports and one is in a
    conference abstract. The variant was absent from tested parents in four
    patients. The Saudi patient's father had rickets, short stature, and genu
    varum but was not genotyped, leaving vertical transmission unconfirmed.
    This evidence cannot establish
    penetrance, prevalence, sex effects, an allelic spectrum, or adult
    complications.
  evidence:
  - reference: PMID:38179381
    reference_title: "CYP3A4 Mutation Causes Vitamin D-Dependent Rickets Type 3: A Case Report in Saudi Arabia."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      She has a strong family history of rickets. Her parents are first cousins;
      the father has a history of rickets, short stature, and genu varum,
      corrected surgically and followed with orthopedics, while the mother is
      healthy.
    explanation: >-
      Establishes a potentially affected parent but not molecular
      cosegregation.
- discussion_id: gap_vddr3_optimal_replacement_regimen
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What age- and weight-adjusted vitamin D regimen provides durable skeletal
    healing without hypercalcemia, hypercalciuria, or other long-term toxicity?
  attaches_to:
  - treatments#Pharmacologic-Dose Vitamin D Replacement
  rationale: >-
    Effective regimens vary widely among five molecularly described cases and
    were not compared in a trial. Long-term target concentrations, dose
    adjustment, renal safety, and
    whether calcitriol, parent vitamin D, or their combination is preferable
    remain undefined.
  evidence:
  - reference: PMID:38179381
    reference_title: "CYP3A4 Mutation Causes Vitamin D-Dependent Rickets Type 3: A Case Report in Saudi Arabia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The optimal dose of cholecalciferol for treatment remains to be
      determined.
    explanation: >-
      The Saudi case report explicitly identifies dose optimization as
      unresolved.
notes: >-
  The phenotype spectrum is based on four patients in peer-reviewed journal
  reports plus one patient in a conference abstract. These reports provide
  positive case observations but did not systematically ascertain the absence
  of each feature across a shared denominator, so no disease frequency bands
  are assigned. The entry includes the recurrent
  germline p.Ile301Thr disorder only; acquired vitamin D hypercatabolism from
  CYP3A4-inducing drugs is mechanistically analogous but is not lumped into this
  Mendelian disease.
review_notes: >-
  Literature was re-searched through 2026-08-19. PubMed identified the 2018
  founding study, two 2023 case reports (four patients in peer-reviewed journal
  reports), and the 2026 recombinant-enzyme/docking study; later
  disease-focused PubMed hits were reviews. A broader allele-level web search
  identified a 2022 ESPE conference abstract describing a fifth molecularly
  confirmed patient. A 2025 genetic-rickets cohort was checked and contained
  VDDR1, VDDR2, and hypophosphatemic cases only; its VDDR3 mention was
  background rather than a new patient. An exact NCBI GEO search returned no
  disease-specific dataset. An exact ClinicalTrials.gov condition search
  returned only broad genomic newborn-screening protocols, not a
  VDDR3-directed interventional trial. No whole-organism animal model was
  located, so animal_models, clinical_trials, and datasets are deliberately
  empty. Phenotype frequencies are likewise left unassigned because the small
  case literature does not provide systematic feature ascertainment.

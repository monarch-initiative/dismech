  target_mechanisms:
  - target: Accelerated Catabolism of Vitamin D Metabolites
    treatment_effect: MODULATES
    description: >-
      Supplying parent or activated vitamin D raises substrate flux into the same
      accelerated catabolic pathway rather than correcting it, which is why the
      response is deficient rather than absent.
    evidence:
    - reference: PMID:29461981
      reference_title: CYP3A4 mutation causes vitamin D-dependent rickets type 3.
      supports: SUPPORT

  - reference: PMID:41046353
    reference_title: "Distinct and potent vitamin D hydroxylation activity acquired by the CYP3A4 I301T single amino acid substitution causes type 3 rickets."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These results indicate that the I301T mutation confers a gain-of-function
      phenotype on CYP3A4, enhancing its ability to metabolize 25(OH)D3 and
      1α,25(OH)2D3 into low-activity derivatives.
    explanation: >-
      The recombinant-enzyme study confirms gain of vitamin D metabolite
      hydroxylation and identifies low-activity products.
  - reference: PMID:29461981
    reference_title: "CYP3A4 mutation causes vitamin D-dependent rickets type 3."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The p.I301T mutant had significantly decreased activity for luciferin IPA
      relative to the WT enzyme (30.0 ± 1.6 vs. 50.1 ± 1.6, n = 4 for each, ***P
      < 0.001).
    explanation: >-
      The lack of a parallel gain for a non-vitamin D substrate supports a
      substrate-selective rather than global increase in CYP3A4 activity.
  downstream:
  - target: Accelerated Formation of Low-Activity Vitamin D Metabolites
    causal_link_type: DIRECT
    description: >-
      The altered active site increases hydroxylation of both calcifediol and
      calcitriol and changes the product profile.
    evidence:
    - reference: PMID:41046353
      reference_title: "Distinct and potent vitamin D hydroxylation activity acquired by the CYP3A4 I301T single amino acid substitution causes type 3 rickets."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Surprisingly, we found that CYP3A4-I301T efficiently produced additional
        metabolites compared to the wild-type CYP3A4, including
        11α,25-dihydroxyvitamin D3 and 1α,11α,25-trihydroxyvitamin D3, which have
        much lower affinity for the vitamin D receptor than do 25(OH)D3 and
        1α,25(OH)2D3, respectively.
      explanation: >-
        Direct recombinant-enzyme evidence establishes altered formation of
        additional low-affinity vitamin D products.

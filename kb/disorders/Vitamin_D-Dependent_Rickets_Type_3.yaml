        activated forms of vitamin D.
      explanation: >-
        Reports deficient responsiveness to both parent and activated vitamin D,
        the therapeutic consequence of the catabolic gain of function.
notes: >-
  Evidence for this disorder rests on two unrelated patients sharing one recurrent
  de novo variant, plus in vitro enzymology. No cohort or prevalence data are
  asserted here. The pharmacological corollary - that CYP3A4-inducing drugs might
  phenocopy the mechanism - is a plausible extension of the same biology but is
  not curated as a claim of this entry.

treatments:
- name: Pharmacologic-Dose Vitamin D Replacement
  description: >-
    The gain of catabolism makes conventional replacement inadequate, not
    futile. Pharmacologic-dose cholecalciferol or calcitriol can maintain
    vitamin D metabolites, calcium, phosphate, and parathyroid hormone;
    cholecalciferol regimens have also produced skeletal and functional
    improvement. Reported requirements vary substantially with age and body
    size: 50,000 IU cholecalciferol daily or high-dose calcitriol in the
    founding patients, 10,000 IU cholecalciferol daily plus calcium in a younger
    child, alfacalcidol 1.5–2 mcg with calcium 30 mg/kg daily followed by 50,000
    IU cholecalciferol weekly in the Saudi case. The alfacalcidol-calcium regimen
    accompanied clinical improvement but residual generalized osteopenia, so it
    is not evidence of complete skeletal correction. These are case-derived
    observations, not a standardized regimen; dose selection and monitoring
    require specialist supervision.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: cholecalciferol
      term:
        id: CHEBI:28940
        label: calciol
    - preferred_term: calcitriol
      term:
        id: CHEBI:17823
        label: calcitriol
    - preferred_term: alfacalcidol
      term:
        id: CHEBI:31186
        label: alfacalcidol
  target_phenotypes:
  - preferred_term: Rickets
    term:
      id: HP:0002748
      label: Rickets
  - preferred_term: Growth delay
    term:
      id: HP:0001510
      label: Growth delay
  target_mechanisms:
  - target: Vitamin D Metabolite Depletion
    treatment_effect: RESTORES
    description: >-
      Sustained pharmacologic input compensates for accelerated clearance and
      restores circulating metabolite and mineral-ion concentrations while
      treatment is maintained; it does not correct the CYP3A4 allele.
    evidence:
    - reference: PMID:32596195
      reference_title: "Diagnosis and Management of Vitamin D Dependent Rickets."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Both patients required high doses of calcitriol or vitamin D3 (50,000 IU
        daily) to maintain normal serum concentrations of vitamin D metabolites as
        well as normal serum levels of PTH, calcium, and phosphorus.
      explanation: >-
        Directly supports biochemical restoration of the depleted vitamin D and
        mineral-ion state while pharmacologic replacement is maintained.
  - target: Impaired Hydroxyapatite Deposition at the Mineralization Front
    treatment_effect: RESTORES
    description: >-
      Pharmacologic vitamin D treatment, often administered with calcium,
      produced radiographic improvement and healing of bone deformities. These
      clinical readouts support restoration of skeletal mineralization, although
      no biopsy or direct mineral-deposition assay was performed.
    evidence:
    - reference: PMID:36656330
      reference_title: "Vitamin D-Dependent Rickets Type 3: A Case Report and Systematic Review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Significant improvement in growth velocity and healing of bone
        deformities were achieved after a short period of treatment with 10.000
        IU of cholecalciferol daily, showing the importance of early recognition
        and prompt precision therapy of this condition.
      explanation: >-
        Directly reports skeletal healing after pharmacologic cholecalciferol;
        the patient also received calcium, so the vitamin D contribution is not
        experimentally isolated.
    - reference: url:https://abstracts.eurospe.org/hrp/0095/hrp0095p1-422
      reference_title: "A heterozygous variant of CYP3A4 in a Chinese boy with Vitamin D-dependent rickets type 3 | ESPE2022 | 60th Annual ESPE (ESPE 2022) | ESPE Abstracts"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        After several months of oral vitamin D treatment, the pathological
        changes improved in X-ray films.
      explanation: >-
        Directly reports radiographic improvement, with the limitation that the
        source is a conference abstract and does not specify the regimen.
  evidence:
  - reference: PMID:32596195
    reference_title: "Diagnosis and Management of Vitamin D Dependent Rickets."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Both patients required high doses of calcitriol or vitamin D3 (50,000 IU
      daily) to maintain normal serum concentrations of vitamin D metabolites as
      well as normal serum levels of PTH, calcium, and phosphorus.
    explanation: >-
      The management review summarizes successful biochemical maintenance in
      the two founding patients.
  - reference: PMID:36656330
    reference_title: "Vitamin D-Dependent Rickets Type 3: A Case Report and Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At his most recent clinic visit, 3 months after the initiation of 10,000 IU
      of cholecalciferol daily, his height had increased to 91.4 cm (Z −1.3
      SDS), with a greatly increased height velocity (5.9 cm in 3 months) and
      markedly improved gait.
    explanation: >-
      Directly documents rapid growth and gait improvement in the Brazilian patient.
  - reference: PMID:38179381
    reference_title: "CYP3A4 Mutation Causes Vitamin D-Dependent Rickets Type 3: A Case Report in Saudi Arabia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Approximately three months after beginning cholecalciferol 50,000 IU
      weekly, her lab results showed a significant improvement.
    explanation: >-
      Documents biochemical improvement on a lower-frequency high-dose regimen
      in the Saudi patient.
  - reference: PMID:38179381
    reference_title: "CYP3A4 Mutation Causes Vitamin D-Dependent Rickets Type 3: A Case Report in Saudi Arabia."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Upon follow-up at the age of eight years, the patient continued to receive
      alfacalcidol at a dosage of 1.5-2 mcg, along with a daily calcium supplement
      of 30 mg/kg. The patient clinically improved (mild genu valgum), and her
      height was -0.87 SD.
    explanation: >-
      Documents the alfacalcidol-calcium regimen and clinical improvement, but
      the combined treatment prevents attribution to alfacalcidol alone and the
      same visit retained generalized osteopenia.
  - reference: url:https://abstracts.eurospe.org/hrp/0095/hrp0095p1-422
    reference_title: "A heterozygous variant of CYP3A4 in a Chinese boy with Vitamin D-dependent rickets type 3 | ESPE2022 | 60th Annual ESPE (ESPE 2022) | ESPE Abstracts"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      After several months of oral vitamin D treatment, the pathological changes
      improved in X-ray films.
    explanation: >-
      Directly reports radiographic improvement in the conference case, while
      leaving the vitamin D formulation and dose unspecified.
  notes: >-
    Calcium supplements accompanied treatment in the two recent case reports,
    so their independent contribution cannot be separated. Published experience
    is too small to define an age- or weight-standardized optimal dose.
- name: Adjunctive Calcium Supplementation
  description: >-
    Oral calcium was administered with pharmacologic vitamin D in the Brazilian
    and Saudi cases. The Brazilian combined regimen normalized serum calcium and
    produced marked radiographic improvement, while the Saudi alfacalcidol-calcium
    regimen accompanied clinical improvement but residual osteopenia. No calcium
    monotherapy result is available, so calcium is modeled as an adjunct and its
    independent efficacy cannot be inferred.

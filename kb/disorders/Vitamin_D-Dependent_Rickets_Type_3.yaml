  - target: Impaired Hydroxyapatite Deposition at the Mineralization Front
    causal_link_type: DIRECT
    description: >-
      Low calcium and phosphate reduce the substrate available for
      hydroxyapatite deposition at the mineralization front.
    evidence:
    - reference: PMID:32596195
      reference_title: "Diagnosis and Management of Vitamin D Dependent Rickets."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Hypocalcemia and hypophosphatemia collectively reduce the rate of
        mineralization of bone matrix. Reduced serum levels of calcium and/or
        phosphorus can produce osteomalacia, as the low concentrations of these
        minerals are insufficient to induce or propagate hydroxyapatite cystral
        deposition in the skeleton. By contrast, rickets arises as a result of a
        growth plate defect that in which hypertrophic chondrocytes fail to
        undergo caspase 9-mediated apoptosis due to reduced concentrations of
        extracellular phosphate (20).
      explanation: >-
        The review directly links the mineral-ion deficits to reduced bone
        matrix mineralization.

inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    The reported patients carry the same heterozygous de novo missense variant.
    The mechanism is a gain of enzymatic function, so a single allele suffices,
    unlike the recessive loss-of-function types 1A, 1B and 2A.
  evidence:
  - reference: PMID:29461981
    reference_title: CYP3A4 mutation causes vitamin D-dependent rickets type 3.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Neither patient had a mutation in any genes known to cause VDDR; however,
      using whole exome sequencing analysis, we identified a recurrent de novo
      missense mutation, c.902T>C (p.I301T), in CYP3A4 in both subjects that
      alters the conformation of substrate recognition site 4 (SRS-4).
    explanation: >-
      Documents the same heterozygous de novo variant in two unrelated patients.
genetic:
- name: De novo CYP3A4 gain-of-function variant
  gene_term:
    preferred_term: CYP3A4
    term:
      id: hgnc:2637
      label: CYP3A4
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: DE_NOVO
  notes: >-
    The recurrent c.902T>C (p.Ile301Thr) variant remodels substrate recognition
    site 4, which is what redirects the enzyme's activity toward vitamin D
    metabolites.
  evidence:
  - reference: PMID:29461981
    reference_title: CYP3A4 mutation causes vitamin D-dependent rickets type 3.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      As CYP3A4 mutations have not previously been linked to rickets, these
      findings provide insight into vitamin D metabolism and demonstrate that
      accelerated inactivation of vitamin D metabolites represents a mechanism for
      vitamin D deficiency.
    explanation: >-
      Establishes CYP3A4 as a novel rickets gene acting through accelerated
      metabolite inactivation.
pathophysiology:
- name: Accelerated Catabolism of Vitamin D Metabolites
  description: >-
    The variant enzyme oxidizes calcitriol far more efficiently than wild-type
    CYP3A4, and more efficiently than CYP24A1, the physiological inactivator. The
    active hormone and its precursor are cleared before they can act. Because the
    defect is in the degradation limb, giving more substrate does not help: the
    same enzyme destroys the supplement, which is the feature that separates this
    disorder from every other member of the series.
  role: trigger
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: CYP3A4 Vitamin D Metabolite Oxidation
    term:
      id: GO:0008395
      label: steroid hydroxylase activity
    modifier: GAIN_OF_FUNCTION
  biological_processes:
  - preferred_term: Vitamin D Catabolism
    term:
      id: GO:0042359
      label: vitamin D metabolic process
    modifier: INCREASED
  evidence:
  - reference: PMID:29461981
    reference_title: CYP3A4 mutation causes vitamin D-dependent rickets type 3.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In vitro, the mutant CYP3A4 oxidized 1,25-dihydroxyvitamin D with 10-fold
      greater activity than WT CYP3A4 and 2-fold greater activity than CYP24A1,
      the principal inactivator of vitamin D metabolites.
    explanation: >-
      Quantifies the gain of catabolic function against both wild-type enzyme and
      the physiological inactivator.
  downstream:
  - target: Hormone Deficiency Despite Intact Synthesis
    causal_link_type: DIRECT
    description: >-
      Accelerated clearance depletes both metabolites without any defect in their
      production.
- name: Hormone Deficiency Despite Intact Synthesis
  description: >-
    Serum 25-hydroxyvitamin D and calcitriol are both low, mimicking nutritional
    deficiency or a synthetic block, while the synthetic enzymes are normal.
    Vitamin D receptor signalling in the intestine falls and the calciopenic
    cascade follows. This is the disorder-specific instance of the module's
    calciopenic trigger arm, entered from the catabolic side.
  role: central_effector
  biological_scale: ORGANISM
  conforms_to: "defective_skeletal_mineralization#Calciopenic Substrate Deficiency"
  cell_types:
  - preferred_term: Enterocyte

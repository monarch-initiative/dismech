treatments:
- name: Vitamin D and Calcitriol Replacement (Resistant)
  description: >-
    Recorded as a treatment whose defining feature is that it FAILS. Because the
    lesion is in the degradation limb, the variant enzyme destroys supplied
    hormone as fast as it is given, so both parent vitamin D and activated
    calcitriol meet deficient responsiveness. This is what singles type 3 out
    within the series: in types 1A and 1B the hormone that is missing can simply
    be supplied, whereas here supplying it is defeated by the lesion itself. No
    effective regimen is asserted - the two reported patients are the entire
    clinical evidence base, and inventing a dosing recommendation from them would
    exceed what the source supports.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: calcitriol
      term:

    term:
      id: GO:0070561
      label: vitamin D receptor signaling pathway
    modifier: DECREASED
  evidence:
  - reference: PMID:29461981
    reference_title: CYP3A4 mutation causes vitamin D-dependent rickets type 3.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we describe two unrelated patients with early-onset rickets, reduced
      serum levels of the vitamin D metabolites 25-hydroxyvitamin D and
      1,25-dihydroxyvitamin D, and deficient responsiveness to parent and
      activated forms of vitamin D.
    explanation: >-
      Records the low levels of both metabolites together with resistance to both
      parent and activated vitamin D.
  downstream:
  - target: Defective Skeletal Mineralization
    causal_link_type: DIRECT
    description: >-
      Reduced calcium and phosphate supply lowers the calcium-phosphate product at
      the mineralization front.

    reference_title: "Diagnosis and Management of Vitamin D Dependent Rickets."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      rickets arises as a result of a growth plate defect that in which
      hypertrophic chondrocytes fail to undergo caspase 9-mediated apoptosis due
      to reduced concentrations of extracellular phosphate (20). This effect of
      hypophosphatemia provides a final common pathway that unifies the growth
      plate defect of calciopenic forms of rickets (i.e., rickets due to
      deficiency of vitamin D and/or calcium) with that of hypophosphatemic forms
      of rickets.
    explanation: >-
      Establishes phosphate-dependent hypertrophic-chondrocyte failure as the
      common growth-plate mechanism in calciopenic rickets.

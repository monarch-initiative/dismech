  - target: Calciopenic Mineral-Ion Disturbance
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Reduced calcitriol-dependent duodenal calcium transport.
    - Secondary hyperparathyroidism with reduced renal phosphate reabsorption.
    description: >-
      Loss of calcitriol action reduces intestinal calcium transport;
      hypocalcemia stimulates parathyroid hormone, which promotes renal
      phosphate loss.
    evidence:
    - reference: PMID:32596195
      reference_title: "Diagnosis and Management of Vitamin D Dependent Rickets."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Nearly all features of vitamin D deficiency represent a direct or
        indirect consequence of the loss of vitamin D action on duodenal
        transport of calcium and to a lesser degree on impaired mobilization of
        calcium from skeletal stores. Hypocalcemia, and to some degree
        calciferol deficiency, results in increased section of PTH from the
        parathyroid glands (i.e., secondary hyperparathyroidism), which leads to
        decreased reabsorption of phosphate and bicarbonate in the proximal renal
        tubule, resulting in hypophosphatemia and hyperchloremic acidosis,
        respectively.
      explanation: >-
        The diagnostic-management review states the known intermediates between
        deficient vitamin D action and the mineral-ion pattern.
- name: Calciopenic Mineral-Ion Disturbance
  description: >-
    Reduced calcium delivery produces hypocalcemia and secondary
    hyperparathyroidism. Parathyroid hormone-driven renal phosphate loss adds
    hypophosphatemia; alkaline phosphatase rises with active rachitic bone
    turnover. This node represents the systemic calciopenic state rather than
    treating each laboratory measurement as a separate causal mechanism.

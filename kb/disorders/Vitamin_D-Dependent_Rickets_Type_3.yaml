    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    A single heterozygous gain-of-function allele is sufficient. The two
    original patients, the Brazilian patient, and a Chinese patient described in
    a conference abstract had the variant absent from tested parents. The Saudi
    patient had an affected father, but the father was not genotyped, so
    inherited transmission in that family is plausible rather than proven.
  evidence:
  - reference: PMID:29461981
    reference_title: "CYP3A4 mutation causes vitamin D-dependent rickets type 3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Neither patient had a mutation in any genes known to cause VDDR; however,
      using whole exome sequencing analysis, we identified a recurrent de novo
      missense mutation, c.902T>C (p.I301T), in CYP3A4 in both subjects that
      alters the conformation of substrate recognition site 4 (SRS-4).
    explanation: >-
      Establishes independent de novo occurrence of the same heterozygous
      variant in the two founding patients.
  - reference: PMID:38179381
    reference_title: "CYP3A4 Mutation Causes Vitamin D-Dependent Rickets Type 3: A Case Report in Saudi Arabia."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      She has a strong family history of rickets. Her parents are first cousins;
      the father has a history of rickets, short stature, and genu varum,
      corrected surgically and followed with orthopedics, while the mother is
      healthy.
    explanation: >-
      The affected father makes dominant transmission plausible, but parental
      molecular testing was not reported and therefore does not prove that the
      proband inherited the CYP3A4 allele.
  - reference: url:https://abstracts.eurospe.org/hrp/0095/hrp0095p1-422
    reference_title: "A heterozygous variant of CYP3A4 in a Chinese boy with Vitamin D-dependent rickets type 3 | ESPE2022 | 60th Annual ESPE (ESPE 2022) | ESPE Abstracts"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      p.Ile301Thr) which was further confirmed using Sanger sequencing. However,
      this variant was not found in his parents.
    explanation: >-
      A conference abstract reports another molecularly confirmed de novo
      occurrence; its preliminary publication type is retained as a limitation.

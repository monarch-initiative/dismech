name: Superior Mesenteric Artery Syndrome
creation_date: "2026-08-01T17:30:00Z"
category: Structural
description: >
  Superior mesenteric artery (SMA) syndrome, also called Wilkie syndrome or cast
  syndrome, is a rare mechanical cause of proximal (high) small-bowel obstruction
  in which the third, horizontal part of the duodenum is compressed in the
  narrowed space between the abdominal aorta and vertebral column posteriorly and
  the superior mesenteric artery anteriorly. Its mechanism is anatomic and
  biomechanical rather than Mendelian: the retroperitoneal/mesenteric fat pad that
  normally cushions the SMA and holds it away from the aorta is depleted by
  catabolic weight loss (or the aortomesenteric geometry is distorted by corrective
  spinal surgery, body casting, or rapid linear growth), narrowing the
  aortomesenteric angle and distance until the duodenum is trapped. The resulting
  obstruction causes postprandial pain, nausea, and vomiting, which reduce oral
  intake and drive further weight loss and further fat-pad depletion - a
  self-amplifying vicious cycle that is the defining pathophysiologic feature of
  the disorder and the reason nutritional restoration, not symptom suppression, is
  the therapeutic target.
disease_term:
  preferred_term: superior mesenteric artery syndrome
  term:
    id: MONDO:0002687
    label: superior mesenteric artery syndrome
synonyms:
- Wilkie syndrome
- Cast syndrome
- Arteriomesenteric duodenal compression syndrome
- Vascular compression of the duodenum
- Chronic duodenal obstruction
- Aorto-mesenteric compass syndrome
parents:
- Duodenal Obstruction

classifications:
  harrisons_chapter:
  - classification_value: GASTROINTESTINAL
    evidence:
    - reference: PMID:30291587
      reference_title: "Superior Mesenteric Artery Syndrome: a Prospective Study in a Single Institution."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Superior mesenteric artery syndrome (SMAS) is a rare cause of duodenal obstruction, resulting from the compression of the duodenum between superior mesenteric artery and aorta."
      explanation: >
        SMA syndrome is a mechanical duodenal obstruction and is managed as a
        gastrointestinal disorder, notwithstanding that the compressing structure is
        an artery.
progression:
- phase: Intermittent postprandial symptoms
  notes: >
    Early phase. Compression is partial and posture-dependent; symptoms occur after
    larger or solid meals and remit between them. Weight is often still preserved.
- phase: Established obstruction with reduced intake and weight loss
  notes: >
    The vicious cycle is engaged. Solids are avoided, then meals generally; weight
    and the aortomesenteric fat pad fall together, progressively narrowing the angle.
- phase: Severe nutritional and metabolic compromise or complications
  notes: >
    Marked undernutrition, dehydration, and hypochloraemic metabolic alkalosis, with
    risk of aspiration pneumonia, acute gastric dilatation and perforation, and
    obstructive pancreatitis. This is the phase that carries mortality.
- phase: Recovery after fat-pad restoration or surgical bypass
  notes: >
    Conservative management succeeds in roughly 70-80% of cases; laparoscopic
    duodenojejunostomy achieves 80-100% success when it fails. The course may remit
    with weight restoration, recur if weight is lost again, or remain chronic if
    obstruction and nutritional depletion continue to perpetuate one another.
  evidence:
  - reference: PMID:37383896
    reference_title: "Superior mesenteric artery syndrome: Diagnosis and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The initial treatment is usually conservative, including postural change, gastroduodenal decompression, and nutrient management (success rates: 70%-80%). If conservative therapy fails, surgical treatment (i.e., laparoscopic duodenojejunostomy) is recommended (success rates: 80%-100%)."
    explanation: >
      Quantifies recovery rates for the conservative and surgical routes out of the
      obstructed state.

mechanistic_hypotheses:
- hypothesis_group_id: fat_pad_depletion_vicious_cycle
  hypothesis_label: Self-amplifying fat-pad-depletion cycle
  status: CANONICAL
  description: >
    The canonical model of SMA syndrome is not a simple linear cascade but a
    positive-feedback loop. Depletion of the aortomesenteric fat pad narrows the
    aortomesenteric angle and compresses the duodenum; the resulting meal-provoked
    pain, nausea, and vomiting reduce oral intake; the reduced intake produces
    further weight loss and further fat-pad depletion, which narrows the angle
    still further. Edges tagged with this hypothesis group form the closed cycle
    (fat-pad depletion -> angle narrowing -> duodenal compression -> obstruction ->
    reduced intake -> weight loss -> fat-pad depletion). The clinical corollary is
    that the loop can only be broken by restoring the fat pad (nutritional
    rehabilitation, ideally delivered distal to the obstruction) or by surgically
    bypassing the compressed segment.
  evidence:
  - reference: PMID:31998513
    reference_title: "Superior mesenteric artery syndrome in severe anorexia nervosa: A case series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The symptoms that patients experience lead to further decreases in oral intake, which in turn brings about further weight and fat pad loss and thus worsening of the duodenal obstruction."
    explanation: >
      States the positive-feedback structure explicitly - symptoms reduce intake,
      which worsens fat-pad loss, which worsens the obstruction.

pathophysiology:
- name: Precipitating Catabolic Weight Loss or Anatomic Alteration
  biological_scale: ORGANISM
  description: >
    The upstream trigger. Two mechanistically distinct routes converge on the same
    aortomesenteric geometry. (1) A catabolic/undernutrition state producing rapid
    or substantial weight loss - anorexia nervosa and other restrictive eating,
    malignancy and cachexia, major burns, trauma, malabsorption, chronic infection,
    prolonged immobilisation, or severe systemic illness. (2) A change in the
    spatial relationship among the spine, aorta, SMA, and duodenum without primary
    fat loss - corrective spinal surgery for scoliosis (the classic paediatric
    setting), body casting (the origin of the name "cast syndrome"), rapid linear
    growth, or abdominal/retroperitoneal operations that alter intestinal fixation
    and tension. A third, less common route is constitutional: a congenital
    anatomic variant of the SMA origin (an abnormally low, caudally angled take-off)
    or of duodenal fixation (a short, high-inserting ligament of Treitz suspending
    the duodenum within the aortomesenteric window) can narrow the window from
    birth, so that a much smaller degree of fat loss is sufficient to precipitate
    obstruction.
  triggers:
  - preferred_term: Rapid or substantial weight loss
  - preferred_term: Corrective spinal surgery for scoliosis
  - preferred_term: Body casting or spinal traction
  - preferred_term: Congenital anatomic variant of SMA origin or duodenal fixation
  evidence:
  - reference: PMID:17476104
    reference_title: "Recalling superior mesenteric artery syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Frequently, predisposing medical conditions associated with catabolic states or rapid weight loss result in a decrease of the aortomesenteric angle and subsequent duodenal obstruction. External cast compression, anatomic variants and surgical alteration of the anatomy following spine surgery or ileoanal pouch anastomosis can also precipitate the syndrome."
    explanation: >
      Names all three arms of the trigger node - catabolic/weight-loss states,
      mechanical/surgical alteration of the anatomy, and anatomic variants - and
      links them to the narrowed aortomesenteric angle.
  - reference: PMID:29204239
    reference_title: "Wilkie's syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This syndrome can be congenital or acquired. The acquired type is more common and is generally caused by reduced perivascular fat surrounding the abdominal aorta and the superior mesenteric artery"
    explanation: >
      Establishes the congenital/constitutional arm as a distinct (if less common)
      route alongside the acquired, fat-loss-driven form.
  downstream:
  - target: Mesenteric Fat Pad Depletion
    causal_link_type: DIRECT
    description: >
      Catabolic weight loss mobilises the visceral adipose stores that constitute
      the aortomesenteric cushion.
  - target: Aortomesenteric Angle and Distance Narrowing
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Altered spinal and mesenteric geometry after deformity correction (lengthening and extension of the corrected spine, cranial displacement of the SMA origin, increased mesenteric tension), which narrows the aortomesenteric window without primary fat-pad depletion and so bypasses the adipose node.
    evidence:
    - reference: PMID:33905850
      reference_title: "Superior Mesenteric Artery Syndrome Following Scoliosis Surgery: A Systematic Review of Case Reports."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Superior mesenteric artery (SMA) syndrome is a well-recognized, rare complication of undergoing surgical correction of a spinal deformity."
      explanation: >
        Establishes the spinal-correction arm as a recognised route to SMA syndrome
        independent of primary catabolic weight loss.

- name: Mesenteric Fat Pad Depletion
  biological_scale: TISSUE
  description: >
    Loss of the retroperitoneal and mesenteric adipose cushion that surrounds the
    origin of the superior mesenteric artery. In health this fat pad splays the SMA
    away from the aorta and provides the space through which the third part of the
    duodenum passes. Its depletion by lipolysis during negative energy balance is
    the proximate anatomic lesion of the weight-loss arm of the disease, and its
    reconstitution is the therapeutic goal of conservative management.
  cell_types:
  - preferred_term: Visceral (mesenteric) white adipocyte
    term:
      id: CL:0000448
      label: white adipocyte
  biological_processes:
  - preferred_term: Triglyceride mobilization from the mesenteric fat depot
    term:
      id: GO:0006642
      label: triglyceride mobilization
    modifier: INCREASED
  locations:
  - preferred_term: Aortomesenteric (retroperitoneal) fat pad
    term:
      id: UBERON:0015143
      label: mesenteric fat pad
  - preferred_term: Visceral abdominal adipose tissue
    term:
      id: UBERON:0014454
      label: visceral abdominal adipose tissue
  evidence:
  - reference: PMID:31998513
    reference_title: "Superior mesenteric artery syndrome in severe anorexia nervosa: A case series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mesentery around the SMA is surrounded by a fatty tissue pad which forms a cushion that allows the duodenum to pass unobstructed between the SMA and the aorta."
    explanation: >
      Describes the normal function of the fat pad whose depletion defines this
      pathophysiology node.
  downstream:
  - target: Aortomesenteric Angle and Distance Narrowing
    causal_link_type: DIRECT
    hypothesis_groups:
    - fat_pad_depletion_vicious_cycle
    evidence:
    - reference: PMID:31998513
      reference_title: "Superior mesenteric artery syndrome in severe anorexia nervosa: A case series."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Weight loss and its resulting malnutrition lead to a loss of said fat pad surrounding the SMA, which allows for migration of the SMA medially, thus resulting in a narrowing of the normal angle between the SMA and the aorta."
      explanation: >
        Directly asserts the causal step from fat-pad loss to medial migration of
        the SMA and narrowing of the aortomesenteric angle.

- name: Aortomesenteric Angle and Distance Narrowing
  biological_scale: TISSUE
  description: >
    Reduction of the angle at which the SMA leaves the abdominal aorta, and of the
    aorta-to-SMA distance at the level of the duodenum. Normative values vary by
    population; one cross-sectional series reported a mean angle of 54.07 +/- 8.53
    degrees and a mean distance of 16.25 +/- 3.44 mm. The operational diagnostic
    thresholds used in the largest prospective surgical series are an
    aortomesenteric angle of 22 degrees or less and/or a distance of 8 mm or less.
    This is a geometric, not a biochemical, lesion: no vascular occlusion,
    thrombosis, dissection, or ischaemia is involved, and the SMA itself is
    structurally normal.
  locations:
  - preferred_term: Superior mesenteric artery
    term:
      id: UBERON:0001182
      label: superior mesenteric artery
  - preferred_term: Abdominal aorta
    term:
      id: UBERON:0001516
      label: abdominal aorta
  evidence:
  - reference: PMID:30291587
    reference_title: "Superior Mesenteric Artery Syndrome: a Prospective Study in a Single Institution."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis was achieved through barium swallow, CT/MR angiography (aortomesenteric angle ≤ 22°, distance ≤ 8 mm), endoscopy."
    explanation: >
      Gives the operational angle and distance thresholds used to define the
      narrowed aortomesenteric geometry in a prospective 39-patient cohort.
  - reference: PMID:38694377
    reference_title: "Evaluating aortomesenteric parameters in a tertiary center of Nepal for superior mesenteric artery syndrome diagnosis and risk factors: cross-sectional study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The study reveals a mean AMA of 54.07°±8.53° and a mean distance of 16.25±3.44 mm. Elevated BMI is found to positively correlate with AMA and distance, indicating that higher BMI values may augment these parameters"
    explanation: >
      Provides normative aortomesenteric angle/distance values and demonstrates the
      quantitative dependence of both parameters on BMI, the population-level
      counterpart of the fat-pad-depletion mechanism.
  notes: >
    An angle of 22 degrees or less and a distance of 8 mm or less are supportive
    operational cut-offs in the cited prospective cohort, but narrowed geometry can
    be present in asymptomatic individuals. Diagnosis therefore requires
    clinical-radiological concordance rather than a threshold alone.
  downstream:
  - target: Extrinsic Compression of the Third Part of the Duodenum
    causal_link_type: DIRECT
    hypothesis_groups:
    - fat_pad_depletion_vicious_cycle
    evidence:
    - reference: PMID:31998513
      reference_title: "Superior mesenteric artery syndrome in severe anorexia nervosa: A case series."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This narrowing results in external mechanical compression of the duodenum as it passes between the SMA and the aorta."
      explanation: >
        States the causal step from the narrowed angle to mechanical compression of
        the duodenum.

- name: Extrinsic Compression of the Third Part of the Duodenum
  biological_scale: TISSUE
  description: >
    The primary lesion. The horizontal (third) portion of the duodenum, which
    crosses the midline in the aortomesenteric window, is squeezed between the SMA
    anteriorly and the aorta and vertebral column posteriorly. The compression is
    extrinsic - the duodenal wall and lumen are intrinsically normal - which is why
    endoscopy alone cannot establish the diagnosis and why bypassing or
    decompressing the segment relieves it.
  locations:
  - preferred_term: Third (horizontal) part of the duodenum
    term:
      id: UBERON:0002114
      label: duodenum
  evidence:
  - reference: PMID:31998513
    reference_title: "Superior mesenteric artery syndrome in severe anorexia nervosa: A case series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is defined as the extrinsic compression of the third part of the duodenum by the aorta posteriorly and the superior mesenteric artery anteriorly."
    explanation: >
      Defines the primary anatomic lesion, including the anterior and posterior
      compressing structures.
  - reference: PMID:17476104
    reference_title: "Recalling superior mesenteric artery syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The syndrome is caused by compression of the third part of the duodenum in the angle between the aorta and the superior mesenteric artery."
    explanation: >
      Independent review confirming the site and mechanism of compression.
  downstream:
  - target: Proximal Duodenal Obstruction and Gastroduodenal Stasis
    causal_link_type: DIRECT
    hypothesis_groups:
    - fat_pad_depletion_vicious_cycle

- name: Proximal Duodenal Obstruction and Gastroduodenal Stasis
  biological_scale: ORGANISM
  description: >
    Partial or complete high intestinal obstruction at the third part of the
    duodenum. Chyme cannot pass the compressed segment, so the proximal duodenum
    and stomach dilate and empty slowly. Obstruction may be intermittent and
    posture-dependent - supine positioning worsens it and left lateral decubitus,
    prone, or knee-chest positions can transiently relieve it - which explains both
    the fluctuating symptoms and the positional manoeuvres used in conservative
    management.
  locations:
  - preferred_term: Duodenum
    term:
      id: UBERON:0002114
      label: duodenum
  - preferred_term: Stomach
    term:
      id: UBERON:0000945
      label: stomach
  biological_processes:
  - preferred_term: Gastroduodenal emptying
    term:
      id: GO:0035483
      label: gastric emptying
    modifier: DECREASED
  evidence:
  - reference: PMID:30291587
    reference_title: "Superior Mesenteric Artery Syndrome: a Prospective Study in a Single Institution."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Barium swallow showed a gastroduodenal dilation in 57% of patients, and a delayed gastroduodenal emptying in 38%."
    explanation: >
      Quantifies proximal dilation and delayed emptying, the direct functional
      consequences of the compressed duodenal segment, in a prospective cohort.
  downstream:
  - target: Meal-Provoked Symptoms and Reduced Oral Intake
    causal_link_type: DIRECT
    hypothesis_groups:
    - fat_pad_depletion_vicious_cycle

- name: Meal-Provoked Symptoms and Reduced Oral Intake
  biological_scale: ORGANISM
  description: >
    Eating loads the obstructed segment, producing postprandial epigastric pain,
    nausea, early satiety, bloating, and vomiting that begins within roughly
    15-20 minutes of a meal and is characteristically relieved by emesis. Patients
    learn to avoid solids, then to avoid eating, so the obstruction is converted
    into a behavioural restriction of intake. This is the node at which a
    mechanical lesion becomes a nutritional one, and it is the hinge of the vicious
    cycle.
  evidence:
  - reference: PMID:37383896
    reference_title: "Superior mesenteric artery syndrome: Diagnosis and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The symptoms are variable, consisting of postprandial abdominal pain, nausea and vomiting, early satiety, anorexia, and weight loss and can mimic anorexia nervosa or functional dyspepsia."
    explanation: >
      Lists the meal-provoked symptom cluster and notes that it can be mistaken for
      a primary eating disorder, which is why intake falls.
  downstream:
  - target: Progressive Weight Loss and Malnutrition
    causal_link_type: DIRECT
    hypothesis_groups:
    - fat_pad_depletion_vicious_cycle
  - target: Obstructive and Aspiration Complications
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Recurrent vomiting against a dilated, obstructed proximal gut, producing aspiration of gastric contents and hypochloraemic metabolic alkalosis.
    - Progressive acute gastric distension, which can advance to mural ischaemia, necrosis, and perforation.

- name: Progressive Weight Loss and Malnutrition
  biological_scale: ORGANISM
  description: >
    Sustained negative energy balance with falling BMI, dehydration, and
    electrolyte and acid-base disturbance (classically hypochloraemic metabolic
    alkalosis from recurrent vomiting). In the largest prospective series the
    median BMI at presentation was 17.8 kg/m2, and surgical relief of the
    obstruction raised it significantly - consistent with the undernutrition being
    substantially driven by the obstruction rather than merely preceding it, though
    that series was single-arm and uncontrolled with concurrent nutritional care.
  evidence:
  - reference: PMID:30291587
    reference_title: "Superior Mesenteric Artery Syndrome: a Prospective Study in a Single Institution."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thirty-nine patients (11 M/28 F, median age 38 years, median BMI 17.8 kg/m2) were included."
    explanation: >
      Documents the low BMI characteristic of the malnutrition node in a
      prospectively enrolled SMA syndrome cohort.
  downstream:
  - target: Mesenteric Fat Pad Depletion
    causal_link_type: DIRECT
    description: >
      The closing edge of the vicious cycle. Obstruction-driven weight loss further
      depletes the very fat pad whose loss caused the obstruction, so the
      aortomesenteric angle narrows further and the disease becomes self-sustaining
      unless nutrition is restored or the segment is bypassed.
    hypothesis_groups:
    - fat_pad_depletion_vicious_cycle
    evidence:
    - reference: PMID:31998513
      reference_title: "Superior mesenteric artery syndrome in severe anorexia nervosa: A case series."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The symptoms that patients experience lead to further decreases in oral intake, which in turn brings about further weight and fat pad loss and thus worsening of the duodenal obstruction."
      explanation: >
        Explicitly closes the loop: obstruction-driven symptoms cause further fat
        pad loss, which worsens the obstruction.

- name: Obstructive and Aspiration Complications
  biological_scale: ORGANISM
  description: >
    Uncommon but potentially fatal sequelae of unrelieved obstruction and recurrent
    vomiting: aspiration pneumonia, respiratory depression from metabolic
    alkalosis, acute gastric dilatation progressing to necrosis and perforation,
    peptic ulceration, and obstructive acute pancreatitis. These complications are
    the reason delayed diagnosis carries meaningful mortality.
  evidence:
  - reference: PMID:37383896
    reference_title: "Superior mesenteric artery syndrome: Diagnosis and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Because recurrent vomiting leads to aspiration pneumonia or respiratory depression via metabolic alkalosis, early diagnosis is required."
    explanation: >
      Names the aspiration and metabolic-alkalosis complications and the diagnostic
      urgency they create.


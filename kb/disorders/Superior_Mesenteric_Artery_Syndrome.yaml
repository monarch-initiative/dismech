    reference_title: "Superior mesenteric artery syndrome in severe anorexia nervosa: A case series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Superior mesenteric artery (SMA) syndrome is a rare complication of severe malnutrition that leads to intestinal obstruction"
    explanation: >
      Links severe malnutrition directly to the obstruction, supporting malnutrition
      as an integral clinical feature.

- category: Respiratory
  name: Aspiration Pneumonia
  description: >
    A serious complication of recurrent vomiting against a distended, obstructed
    proximal gut.
  phenotype_term:
    preferred_term: Aspiration pneumonia
    term:
      id: HP:0011951
      label: Aspiration pneumonia
  evidence:
  - reference: PMID:37383896
    reference_title: "Superior mesenteric artery syndrome: Diagnosis and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Because recurrent vomiting leads to aspiration pneumonia or respiratory depression via metabolic alkalosis, early diagnosis is required."
    explanation: >
      Directly identifies aspiration pneumonia as a consequence of the recurrent
      vomiting caused by the obstruction.

- category: Metabolic
  name: Hypochloremic Metabolic Alkalosis
  description: >
    Loss of gastric hydrochloric acid through recurrent vomiting produces a
    hypochloraemic, hypokalaemic metabolic alkalosis, which in severe cases causes
    compensatory hypoventilation and respiratory depression.
  phenotype_term:
    preferred_term: Hypochloremic metabolic alkalosis
    term:
      id: HP:0005977
      label: Hypochloremic metabolic alkalosis
  evidence:
  - reference: PMID:37383896
    reference_title: "Superior mesenteric artery syndrome: Diagnosis and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Because recurrent vomiting leads to aspiration pneumonia or respiratory depression via metabolic alkalosis, early diagnosis is required."
    explanation: >
      Identifies vomiting-induced metabolic alkalosis, and the respiratory depression
      it causes, as a recognised consequence of the obstruction.

- category: Gastrointestinal
  name: Gastric Perforation
  description: >
    Acute gastric dilatation proximal to the obstruction can progress to mural
    ischaemia, necrosis, and perforation - a rare but potentially fatal complication.
  phenotype_term:
    preferred_term: Gastric perforation
    term:
      id: HP:6000383
      label: Gastric perforation
  evidence:
  - reference: PMID:31998513
    reference_title: "Superior mesenteric artery syndrome in severe anorexia nervosa: A case series."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "they can show complications of this syndrome, such as acute gastric dilatation."
    explanation: >
      Documents acute gastric dilatation as a recognised complication. The
      progression from dilatation to perforation is not asserted by this source, so
      support is recorded as PARTIAL.

- category: Gastrointestinal
  name: Acute Pancreatitis
  description: >
    Obstructive acute pancreatitis is an uncommon complication, attributed to
    duodenal distension and impaired pancreatic outflow at the aortomesenteric
    compression.
  phenotype_term:
    preferred_term: Acute pancreatitis
    term:
      id: HP:0001735
      label: Acute pancreatitis
  notes: >
    Reported in the SMA syndrome complication literature and surfaced by the Edison
    deep-research report, but no PMID with a quotable abstract sentence linking
    acute pancreatitis to SMA syndrome was located, so no evidence item is asserted.
    Retained as a described but unevidenced complication rather than dropped.

imaging_findings:
- name: Reduced Aortomesenteric Angle on CT Angiography
  modality: CT
  description: >
    Sagittal reconstruction of contrast-enhanced abdominal CT (or CT/MR angiography)
    measures the angle at which the SMA leaves the aorta. Values of 22 degrees or
    less, together with an aortomesenteric distance of 8 mm or less, are the
    operational diagnostic criteria used in the largest prospective series, in
    which the median measured angle was 11 degrees and the median distance 5 mm.
    A narrowed angle in the absence of demonstrated duodenal obstruction is not
    diagnostic.
  diagnostic: true
  located_in:
    preferred_term: Superior mesenteric artery
    term:
      id: UBERON:0001182
      label: superior mesenteric artery
  evidence:
  - reference: PMID:30291587
    reference_title: "Superior Mesenteric Artery Syndrome: a Prospective Study in a Single Institution."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Median aortomesenteric angle was 11° and distance was 5 mm."
    explanation: >
      Reports the measured aortomesenteric geometry in a prospectively enrolled
      SMA syndrome cohort, quantifying the imaging finding.
  - reference: PMID:31127323
    reference_title: "Superior mesenteric artery syndrome: a radiographic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Imaging can assist in diagnosis by demonstrating characteristic findings of reduced aortomesenteric angle, reduced aortomesenteric distance, gastroduodenal distention, bowel caliber narrowing at the takeoff of the superior mesenteric artery from the aorta, as well as delayed gastric emptying or positional obstruction observed with real time with fluoroscopy."
    explanation: >
      Enumerates the characteristic imaging findings, including the reduced angle
      and distance and the caliber change at the SMA takeoff.

- name: Gastroduodenal Distention with Abrupt Caliber Change at the SMA Crossing
  modality: OTHER
  description: >
    On an upper gastrointestinal barium series the stomach and proximal duodenum
    are dilated with abrupt hold-up of contrast at the level where the SMA crosses
    the third part of the duodenum, and gastroduodenal emptying is delayed.
    Obstruction may be positional, improving in the prone or left lateral decubitus
    position under real-time fluoroscopy.
  notes: >
    Modality is recorded as OTHER because a barium/upper-GI series is fluoroscopic
    rather than plain-film projectional radiography, and ImagingModalityEnum has no
    FLUOROSCOPY value.
  located_in:
    preferred_term: Duodenum
    term:
      id: UBERON:0002114
      label: duodenum
  evidence:
  - reference: PMID:30291587
    reference_title: "Superior Mesenteric Artery Syndrome: a Prospective Study in a Single Institution."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Barium swallow showed a gastroduodenal dilation in 57% of patients, and a delayed gastroduodenal emptying in 38%."
    explanation: >
      Quantifies gastroduodenal dilation and delayed emptying on barium swallow in a
      prospective cohort.

environmental:
- name: Rapid or Substantial Weight Loss
  description: >
    Any catabolic or undernutrition state producing rapid loss of visceral fat -
    anorexia nervosa and other restrictive eating disorders, malignancy and
    cachexia, burns, trauma, malabsorption, chronic infection, and prolonged
    severe illness. This is the commonest precipitant.
  influences_mechanisms:
  - target: Precipitating Catabolic Weight Loss or Anatomic Alteration
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Catabolic or undernutrition states directly establish the weight-loss arm of
      the precipitating mechanism.
    evidence:
    - reference: PMID:31998513
      reference_title: "Superior mesenteric artery syndrome in severe anorexia nervosa: A case series."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "SMA syndrome can be the result of a multitude of medical conditions that lead to weight loss and a malnourished state, namely wasting diseases such as cancer, burns, AIDS, and chronic infections; malabsorptive states; or voluntary or involuntary lack of caloric intake such as patients with anorexia nervosa (AN)."
      explanation: >-
        Directly links catabolic and undernutrition conditions to the weight-loss
        state that precipitates SMA syndrome.
  evidence:
  - reference: PMID:31998513
    reference_title: "Superior mesenteric artery syndrome in severe anorexia nervosa: A case series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SMA syndrome can be the result of a multitude of medical conditions that lead to weight loss and a malnourished state, namely wasting diseases such as cancer, burns, AIDS, and chronic infections; malabsorptive states; or voluntary or involuntary lack of caloric intake such as patients with anorexia nervosa (AN)."
    explanation: >
      Enumerates the weight-loss states that precipitate SMA syndrome.

- name: Corrective Spinal Surgery for Scoliosis
  exposure_term:
    preferred_term: surgical procedure exposure
    term:
      id: ECTO:2000054
      label: exposure to surgery
  description: >
    Surgical correction of a spinal deformity is a well-recognised precipitant,
    particularly in adolescents with adolescent idiopathic scoliosis and a low
    preoperative BMI. Reported latency to symptom onset diverges markedly between
    the two pooled systematic reviews - a mean of 9.6 +/- 9.5 days in one and a mean
    of 69 days (range 3 days to 4 years) in the other - so onset can be anywhere
    from the first postoperative days to years later, and a late presentation does
    not exclude the diagnosis.
  influences_mechanisms:
  - target: Precipitating Catabolic Weight Loss or Anatomic Alteration
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Corrective spine surgery directly supplies the anatomic-alteration arm of the
      precipitating mechanism, which then narrows the aortomesenteric geometry
      without requiring primary fat-pad depletion.
    evidence:
    - reference: PMID:17476104
      reference_title: "Recalling superior mesenteric artery syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "External cast compression, anatomic variants and surgical alteration of the anatomy following spine surgery or ileoanal pouch anastomosis can also precipitate the syndrome."
      explanation: >-
        Explicitly identifies surgical alteration after spine surgery as a
        precipitating route to SMA syndrome.
  evidence:
  - reference: PMID:39118170
    reference_title: "Superior mesenteric artery syndrome following spine surgery in idiopathic adolescent scoliosis: a systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Superior mesenteric artery syndrome (SMAS) is a rare and unpredictable complication after correction spine surgery for adolescent idiopathic scoliosis (AIS)."
    explanation: >
      Establishes corrective spine surgery for adolescent idiopathic scoliosis as a
      recognised precipitating exposure.
  - reference: PMID:39118170
    reference_title: "Superior mesenteric artery syndrome following spine surgery in idiopathic adolescent scoliosis: a systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mean interval between spine surgery and symptoms of SAMS was 69 days, with high between-studies variability (3 days to 4 years)."
    explanation: >
      Gives the longer latency estimate that diverges from the 9.6-day mean of the
      other pooled review, documenting the wide and uncertain time-to-onset window.
  - reference: PMID:33905850
    reference_title: "Superior Mesenteric Artery Syndrome Following Scoliosis Surgery: A Systematic Review of Case Reports."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mean age of patients with SMA syndrome following scoliosis surgery was 14.7 ± 2.9 years and the majority (n = 42, 80.8%) were girls. The most frequently reported scoliosis type was adolescent idiopathic scoliosis (n = 34, 65.4%). The mean postoperative days (POD) (interval between the surgical treatment and the onset of symptoms) was 9.6 ± 9.5 days."
    explanation: >
      Quantifies the demographics and post-operative latency of the
      scoliosis-surgery arm across 52 pooled cases.

- name: Body Casting and External Spinal Compression
  description: >
    Application of a body cast or spinal traction for scoliosis - the origin of the
    historical name "cast syndrome" - can precipitate the same duodenal compression
    without primary fat loss.
  influences_mechanisms:
  - target: Precipitating Catabolic Weight Loss or Anatomic Alteration
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      External cast compression directly supplies the mechanical-alteration arm of
      the precipitating mechanism.
    evidence:
    - reference: PMID:17476104
      reference_title: "Recalling superior mesenteric artery syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "External cast compression, anatomic variants and surgical alteration of the anatomy following spine surgery or ileoanal pouch anastomosis can also precipitate the syndrome."
      explanation: >-
        Explicitly identifies external cast compression as a precipitant of SMA
        syndrome.
  evidence:
  - reference: PMID:17476104
    reference_title: "Recalling superior mesenteric artery syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "External cast compression, anatomic variants and surgical alteration of the anatomy following spine surgery or ileoanal pouch anastomosis can also precipitate the syndrome."
    explanation: >
      Names external cast compression and anatomic/surgical alteration as
      precipitants distinct from weight loss.

prevalence:
- population: Worldwide
  measure_type: POINT_PREVALENCE
  prevalence_class: RARE
  notes: >
    Estimated at 0.013%-3% of the general population from historical barium studies;
    the wide range reflects radiographic ascertainment in selected populations rather
    than a population registry, so no precise numeric rate is asserted here.
  evidence:
  - reference: PMID:31998513
    reference_title: "Superior mesenteric artery syndrome in severe anorexia nervosa: A case series."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The overall prevalence of SMA syndrome is unknown; however, it is estimated to be 0.013%"
    explanation: >
      Source states the prevalence is unknown and gives only a wide
      barium-study-derived estimate, supporting a qualitative RARE class rather than
      a numeric rate.

epidemiology:
- name: Demographics
  description: >
    Median age at presentation around 23 years (reported range 0-91 years), with a
    female predominance of roughly 3:2 and a peak in adolescents and young adults.
    In the scoliosis-surgery subgroup the mean age is about 15 years and over 80%
    of reported cases are girls.
  evidence:
  - reference: PMID:37383896
    reference_title: "Superior mesenteric artery syndrome: Diagnosis and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The median age of patients is 23 years old (range 0-91 years old) and predominant in females over males with a ratio of 3:2."
    explanation: Gives the age distribution and sex ratio.
  - reference: PMID:33905850
    reference_title: "Superior Mesenteric Artery Syndrome Following Scoliosis Surgery: A Systematic Review of Case Reports."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mean age of patients with SMA syndrome following scoliosis surgery was 14.7 ± 2.9 years and the majority (n = 42, 80.8%) were girls."
    explanation: >
      Supplies the age and sex distribution of the scoliosis-surgery subgroup quoted
      in this epidemiology entry.

treatments:
- name: Nutritional Rehabilitation and Weight Restoration
  description: >
    First-line and mechanistically definitive therapy. The goal is to restore the
    aortomesenteric fat pad, which widens the angle and relieves the compression -
    not merely to suppress nausea. Delivered as small, frequent, energy-dense
    liquid or soft feeds when oral intake is tolerated, with careful electrolyte
    monitoring for refeeding syndrome. Conservative management succeeds in roughly
    70-80% of cases.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: nutritional support
    term:
      id: NCIT:C15433
      label: Nutritional Support
  target_mechanisms:
  - target: Mesenteric Fat Pad Depletion
    treatment_effect: RESTORES
    description: >
      Weight restoration reconstitutes the aortomesenteric fat pad, reversing the
      upstream anatomic lesion and breaking the vicious cycle at its origin.
    evidence:
    - reference: PMID:31998513
      reference_title: "Superior mesenteric artery syndrome in severe anorexia nervosa: A case series."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Treatment of SMA syndrome necessitates gaining enough weight to ultimately reconstitute the fat pad between the aorta and the SMA"
      explanation: >
        States that the therapeutic mechanism is reconstitution of the fat pad, i.e.
        reversal of the Mesenteric Fat Pad Depletion node.
    - reference: PMID:29204239
      reference_title: "Wilkie's syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "After diagnosis, the patient followed a high-calorie diet, and 2 months later an ultrasound scan proved the restoration of the aorto-mesenteric angle as a consequence of increased perivascular fat with regression of symptoms."
      explanation: >
        Direct in-vivo demonstration of the treatment mechanism - refeeding restored
        the perivascular fat, which restored the aortomesenteric angle, which
        resolved the symptoms - closing the causal loop in the therapeutic direction.
  evidence:
  - reference: PMID:37383896
    reference_title: "Superior mesenteric artery syndrome: Diagnosis and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The initial treatment is usually conservative, including postural change, gastroduodenal decompression, and nutrient management (success rates: 70%-80%)."
    explanation: >
      Establishes conservative nutritional/decompressive management as first line and
      quantifies its success rate.

- name: Post-Pyloric (Nasojejunal) Enteral Feeding
  description: >
    Enteral nutrition delivered by a tube whose tip lies distal to the compressed
    third part of the duodenum. This bypasses the obstruction so that calories can be
    delivered despite it, allowing weight gain and fat-pad reconstitution - an
    intervention that exploits the fact that the bowel distal to the compression is
    entirely normal.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: enteral tube feeding
    term:
      id: NCIT:C93322
      label: Enteral Tube Feeding
  target_mechanisms:
  - target: Proximal Duodenal Obstruction and Gastroduodenal Stasis
    treatment_effect: BYPASSES
    description: >
      Feeding distal to the compressed segment circumvents the obstruction rather
      than relieving the compression itself.
  evidence:
  - reference: PMID:17476104
    reference_title: "Recalling superior mesenteric artery syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "first-line treatment is usually conservative with jejunal or parenteral nutrition for restoration of the aortomesenteric fatty tissue."
    explanation: >
      Identifies jejunal (post-pyloric) feeding as first-line conservative therapy
      aimed specifically at restoring the aortomesenteric fat.

- name: Total Parenteral Nutrition
  description: >
    Used when enteral feeding distal to the obstruction is impossible or
    insufficient, or when the obstruction is complete. Provides calories for weight
    restoration entirely independently of the gut.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: total parenteral nutrition
    term:
      id: NCIT:C29484
      label: Total Parenteral Nutrition
  evidence:
  - reference: PMID:17476104
    reference_title: "Recalling superior mesenteric artery syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "first-line treatment is usually conservative with jejunal or parenteral nutrition for restoration of the aortomesenteric fatty tissue."
    explanation: >
      Names parenteral nutrition alongside jejunal feeding as conservative therapy
      aimed at restoring the aortomesenteric fat pad.

- name: Nasogastric Decompression
  description: >
    Gastroduodenal decompression relieves acute distension, reduces vomiting and
    aspiration risk, and allows correction of fluid and electrolyte deficits during
    the acute presentation. Symptomatic rather than mechanism-reversing.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: nasogastric decompression
    term:
      id: NCIT:C70910
      label: Nasogastric Decompression
  evidence:
  - reference: PMID:28356803
    reference_title: "Superior mesenteric artery syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The SMAS was suspected and a nasogastric tube was inserted, stomach decompression and the correction of electrolytes disbalance were made."
    explanation: >
      Documents nasogastric decompression plus electrolyte correction as the acute
      management of post-scoliosis-surgery SMA syndrome.

- name: Laparoscopic Duodenojejunostomy
  description: >
    The best-supported definitive operation when conservative management fails. A
    side-to-side anastomosis between the duodenum proximal to the compression and
    the jejunum bypasses the aortomesenteric window entirely, so the obstruction is
    circumvented rather than the angle corrected. Reported success rates are
    80-100%; in a prospective 39-patient cohort symptom scores fell and BMI rose
    significantly at a median 47 months of follow-up.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: laparoscopic duodenojejunostomy
    term:
      id: NCIT:C15725
      label: Laparoscopic Surgery
  target_mechanisms:
  - target: Extrinsic Compression of the Third Part of the Duodenum
    treatment_effect: BYPASSES
    description: >
      Diverts chyme around the compressed duodenal segment without altering the
      aortomesenteric geometry.
  evidence:
  - reference: PMID:30291587
    reference_title: "Superior Mesenteric Artery Syndrome: a Prospective Study in a Single Institution."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At a median follow-up of 47 months, the overall symptom score significantly dropped (10 vs. 32, p < 0.0001) and BMI increased (19.5 vs. 17.8, p < 0.0001)."
    explanation: >
      Quantifies symptom and BMI improvement after duodenojejunostomy in the largest
      prospective cohort.
  - reference: PMID:39191411
    reference_title: "Laparoscopic Surgery for Superior Mesenteric Artery Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All operations were successfully completed laparoscopically, and with a median follow-up of 65 months, the overall symptom score was significantly reduced from 32 to 8 (p < 0.0001) and the BMI was increased from 17.2 kg/m2 to 21.8 kg/m2 (p < 0.0001)."
    explanation: >
      Independent 66-patient laparoscopic series confirming durable symptom and BMI
      improvement.
  - reference: PMID:37383896
    reference_title: "Superior mesenteric artery syndrome: Diagnosis and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "If conservative therapy fails, surgical treatment (i.e., laparoscopic duodenojejunostomy) is recommended (success rates: 80%-100%)."
    explanation: >
      Positions laparoscopic duodenojejunostomy as the recommended operation after
      failed conservative therapy and gives its success rate.

- name: Strong Procedure (Division of the Ligament of Treitz)
  description: >
    Division of the ligament of Treitz with mobilisation of the duodenum allows the
    duodenum to drop caudally out of the narrowed aortomesenteric window. Unlike
    duodenojejunostomy this addresses the position of the duodenum relative to the
    compressing structures rather than bypassing the segment; it is anatomically
    distinct from duodenojejunostomy and less consistently effective.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Extrinsic Compression of the Third Part of the Duodenum
    treatment_effect: INHIBITS
    description: >
      Mobilising the duodenum out of the aortomesenteric window relieves the
      extrinsic compression directly.
  evidence:
  - reference: PMID:17476104
    reference_title: "Recalling superior mesenteric artery syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "If conservative management fails, surgical options include open or laparoscopic duodenojejunostomy or duodenal mobilization and division of the ligament of Treitz."
    explanation: >
      Names duodenal mobilisation with division of the ligament of Treitz as a
      surgical option distinct from duodenojejunostomy.

diagnosis:
- name: Clinical-Radiological Concordance
  description: >
    Diagnosis requires BOTH a compatible obstructive clinical picture AND imaging
    evidence of duodenal compression with narrowed aortomesenteric geometry. A
    narrow angle or distance in isolation occurs in asymptomatic individuals and is
    not diagnostic; conversely, endoscopy cannot establish an extrinsic compression.
    In practice barium swallow, contrast-enhanced CT or CT/MR angiography, and
    endoscopy are combined.
  evidence:
  - reference: PMID:30291587
    reference_title: "Superior Mesenteric Artery Syndrome: a Prospective Study in a Single Institution."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis was achieved through barium swallow, CT/MR angiography (aortomesenteric angle ≤ 22°, distance ≤ 8 mm), endoscopy."
    explanation: >
      Describes the multimodal diagnostic pathway and the imaging thresholds applied.
  - reference: PMID:23959808
    reference_title: "Superior mesenteric artery syndrome and its associated gastrointestinal implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CT angiography is currently favored in the literature for diagnosis as it can not only show the narrowed aorto-mesenteric angle and distance, but also the extent of duodenal obstruction."
    explanation: >
      Explains why CT angiography is preferred - it captures both the geometry and
      the obstruction, i.e. both halves of the concordance requirement.

differential_diagnoses:
- name: Nutcracker Syndrome (Left Renal Vein Entrapment)
  description: >
    The other clinical consequence of a narrowed aortomesenteric angle. The same
    geometry that traps the duodenum also traps the left renal vein, so the two
    entities share an anatomic substrate, are frequently co-reported, and can
    coexist in the same patient. They are nonetheless distinct diseases with
    distinct compressed structures and distinct presentations, and must not be
    conflated.
  distinguishing_features:
  - Nutcracker syndrome compresses the LEFT RENAL VEIN and presents as a urologic/venous syndrome with haematuria, proteinuria, left flank pain, pelvic congestion, and left varicocele.
  - SMA syndrome compresses the THIRD PART OF THE DUODENUM and presents as a gastrointestinal obstructive syndrome with postprandial pain, vomiting, and weight loss.
  evidence:
  - reference: PMID:29204239
    reference_title: "Wilkie's syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The reduced angle compresses the structures situated between the aorta and the superior mesenteric artery, such as the duodenum and left renal vein; this can determine painful crises, intestinal subocclusions, and left varicocele."
    explanation: >
      Documents that the same narrowed aortomesenteric angle compresses both the
      duodenum and the left renal vein, establishing the shared substrate while
      distinguishing the two symptom complexes.

- name: Anorexia Nervosa
  description: >
    The most consequential differential. SMA syndrome mimics a restrictive eating
    disorder (food avoidance, low BMI, vomiting), AND anorexia nervosa is one of
    its commonest causes, so the two are bidirectionally confusable and frequently
    coexist. Attributing SMA-syndrome symptoms to the psychiatric diagnosis alone
    delays treatment and blocks weight restoration.
  distinguishing_features:
  - In SMA syndrome food avoidance is secondary to reproducible meal-provoked pain relieved by emesis or postural change, and imaging shows duodenal obstruction with a narrowed aortomesenteric angle.
  - In uncomplicated anorexia nervosa there is a primary drive for thinness and fear of weight gain, and imaging shows no duodenal obstruction.
  evidence:
  - reference: PMID:37383896
    reference_title: "Superior mesenteric artery syndrome: Diagnosis and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The symptoms are variable, consisting of postprandial abdominal pain, nausea and vomiting, early satiety, anorexia, and weight loss and can mimic anorexia nervosa or functional dyspepsia."
    explanation: >
      States explicitly that SMA syndrome can mimic anorexia nervosa.

- name: Functional Dyspepsia and Gastroparesis
  description: >
    Non-obstructive upper-gut motility and symptom disorders that produce
    overlapping postprandial pain, nausea, bloating, and early satiety. Gastroparesis
    frequently coexists with SMA syndrome in malnourished patients.
  distinguishing_features:
  - Neither produces a fixed extrinsic caliber change at the third part of the duodenum or a narrowed aortomesenteric angle on cross-sectional imaging.
  - Neither shows the abrupt positional relief (prone, knee-chest, left lateral decubitus) characteristic of SMA syndrome.
  evidence:
  - reference: PMID:31998513
    reference_title: "Superior mesenteric artery syndrome in severe anorexia nervosa: A case series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Concurrent gastroparesis was diagnosed clinically in all eight patients."
    explanation: >
      Documents that gastroparesis coexisted in every case of a confirmed SMA
      syndrome series, supporting coexistence rather than mutual exclusion and
      explaining why the two are hard to disentangle clinically.
  - reference: PMID:37383896
    reference_title: "Superior mesenteric artery syndrome: Diagnosis and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The symptoms are variable, consisting of postprandial abdominal pain, nausea and vomiting, early satiety, anorexia, and weight loss and can mimic anorexia nervosa or functional dyspepsia."
    explanation: >
      Names functional dyspepsia as a condition SMA syndrome mimics.

clinical_trials:
- name: NCT03416647
  status: COMPLETED
  description: >
    Prospective single-institution registry of 39 consecutive SMA syndrome patients
    (2008-2016), all treated with duodenojejunostomy, with symptom score, BMI, and
    barium swallow reassessed at follow-up. Published as PMID:30291587.
  target_phenotypes:
  - preferred_term: Duodenal (high intestinal) obstruction
    term:
      id: HP:0005250
      label: High intestinal obstruction
  evidence:
  - reference: clinicaltrials:NCT03416647
    reference_title: "Superior Mesenteric Artery Syndrome: a Prospective Study in a Single Institution"
    supports: SUPPORT
    snippet: "Between 2008 and 2016, 39 consecutive patients with chronic gastrointestinal symptoms and a diagnosis of SMAS were prospectively included in the study, in order to describe their demographic, clinical and outcome features. All patients underwent duodenojejunostomy."
    explanation: >
      Describes the prospective cohort and the uniform duodenojejunostomy
      intervention underpinning the surgical evidence base.

- name: NCT06970093
  status: RECRUITING
  description: >
    Randomised open-label comparison of one-anastomosis gastric bypass versus
    duodenojejunostomy for SMA syndrome, with 12-month symptom, nutritional, and
    quality-of-life endpoints. Addresses the near-absence of comparative surgical
    evidence.
  target_phenotypes:
  - preferred_term: Postprandial bilious vomiting
    term:
      id: HP:0002013
      label: Vomiting
  - preferred_term: Weight loss
    term:
      id: HP:0001824
      label: Weight loss
  evidence:
  - reference: clinicaltrials:NCT06970093
    reference_title: "One Anastomosis Gastric Bypass (OAGB) vs Duodeno-jejunostomy For Treatment of Superior Mesenteric Artery Syndrome: A Prospective Randomized Control Trial"
    supports: SUPPORT
    snippet: "This condition causes the duodenum to be squeezed between two arteries, leading to severe nausea, vomiting, and weight loss."
    explanation: >
      Confirms the trial targets the mechanical duodenal compression and its cardinal
      symptoms.

- name: NCT03937193
  status: COMPLETED
  description: >
    Completed 510-participant CT study establishing the normal range of
    aortomesenteric angle and distance in a young Chinese population and
    correlating both with retroperitoneal adipose tissue. Directly addresses the
    threshold-variability knowledge gap and provides population-level confirmation
    of the fat-pad mechanism.
  evidence:
  - reference: clinicaltrials:NCT03937193
    reference_title: "Normal Range of Superior Mesenteric Artery on Computerized Tomography in Young Chinese Population and Its Correlation With Retroperitoneal Adipose Tissue"
    supports: SUPPORT
    snippet: "In literature, superior mesenteric artery (SMA) angle, also named as aortomesenteric angle (AMA), varies greatly in both adult and children; while the aortomesenteric distance also ranges widely. Both AMA and AMD are influenced by retroperitoneal fat."
    explanation: >
      Documents both the wide variation in reported normal aortomesenteric geometry
      and its dependence on retroperitoneal fat.

- name: NCT04515251
  status: RECRUITING
  description: >
    Prospective multicentre observational study deriving normative ultrasound
    aortomesenteric measurements in healthy children aged 10-15 years, the age band
    in which post-scoliosis-surgery SMA syndrome peaks. Paediatric reference
    standards remain under development.
  evidence:
  - reference: clinicaltrials:NCT04515251
    reference_title: "A Prospective, Observational, Multicenter Study on Ultrasound Evaluation of Superior Mesenteric Artery Measurements in a Healthy Pediatric Population"
    supports: SUPPORT
    snippet: "Multicenter, prospective, observational research project on children aged from 10 to 15 years old undergoing abdominal ultrasound examinations during routine clinical practice."
    explanation: >
      Confirms the study is deriving paediatric normative aortomesenteric ultrasound
      values in the relevant age band.

- name: NCT07115472
  status: RECRUITING
  description: >
    Single-group study of fluoxetine in refractory SMA syndrome with comorbid
    DSM-5 somatic symptom disorder - the only registered pharmacotherapy trial in
    this disease. IMPORTANT SCOPE CAVEAT - this treats a psychiatric comorbidity
    that may amplify symptom burden, NOT the anatomic compression, and must not be
    generalised to routine SMA syndrome management. It is recorded here because the
    hypothesis (that reducing somatic-symptom amplification can avert
    duodenojejunostomy) bears directly on the disease's symptom-driven vicious
    cycle.
  evidence:
  - reference: clinicaltrials:NCT07115472
    reference_title: "Fluoxetine as a Non-Surgical Intervention for Refractory Superior Mesenteric Artery Syndrome With Comorbid Somatic Symptom Disorder: A Prospective Case Series Study"
    supports: SUPPORT
    snippet: "Can psychiatric intervention targeting SSD reduce the likelihood of requiring duodenojejunostomy in refractory SMAS?"
    explanation: >
      States the trial's scope - a psychiatric comorbidity intervention tested for
      its effect on the need for surgery, not a treatment of the compression itself.

discussions:
- discussion_id: smas_no_molecular_lesion
  prompt: >
    Is there any molecular, genetic, or cellular determinant of susceptibility to
    SMA syndrome, beyond bulk visceral adiposity and skeletal geometry?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Mesenteric Fat Pad Depletion
  rationale: >
    SMA syndrome is curated here as a purely biomechanical disorder with no causal
    gene, pathogenic variant, inheritance pattern, molecular biomarker, or omics
    signature established. Yet only a minority of severely underweight patients
    develop it, implying unmodelled determinants of susceptibility - for example
    constitutional differences in the fixation and length of the ligament of Treitz,
    in SMA origin height or take-off angle, in the regional lipolytic behaviour of
    the mesenteric fat depot versus other depots, or in mesenteric connective-tissue
    laxity. Rare familial reports exist but have not been resolved to a mechanism.
    Whether these determinants are anatomic-variant, connective-tissue, or
    adipose-biology in nature is entirely open.
  proposed_experiments:
  - experiment_id: smas_depot_lipolysis
    name: Depot-resolved mesenteric adipose mobilisation study
    description: >
      Depot-resolved imaging or adipose sampling asking whether the mesenteric fat
      depot is preferentially mobilised in patients who develop SMA syndrome
      compared with BMI-matched controls who do not.
    decision_criterion: >
      Preferential mesenteric-depot loss in cases versus matched controls would
      support a depot-specific adipose-biology determinant of susceptibility.
  - experiment_id: smas_pre_post_geometry
    name: Prospective pre/post weight-loss aortomesenteric geometry cohort
    description: >
      Prospective CT or ultrasound cohorts measuring aortomesenteric angle,
      aortomesenteric distance, SMA origin height, and ligament-of-Treitz position
      before and after comparable weight loss, to identify pre-existing geometric
      predisposition.
    decision_criterion: >
      Baseline geometric parameters that predict incident SMA syndrome independently
      of the magnitude of weight loss would establish anatomic predisposition.
  - experiment_id: smas_connective_tissue_phenotyping
    name: Connective-tissue phenotyping of SMA syndrome cohorts
    description: >
      Systematic assessment of joint hypermobility and established heritable
      connective-tissue disease in SMA syndrome cohorts versus controls.
    decision_criterion: >
      Enrichment of connective-tissue laxity in cases would implicate mesenteric
      connective-tissue properties as a susceptibility determinant.

- discussion_id: smas_threshold_variability
  prompt: >
    What aortomesenteric angle and distance thresholds should define SMA syndrome,
    and should they be adjusted for age, BMI, sex, population, and imaging technique?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Aortomesenteric Angle and Distance Narrowing
  rationale: >
    One population-specific cross-sectional series reported a mean
    aortomesenteric angle of 54.07 +/- 8.53 degrees and a mean distance of 16.25 +/-
    3.44 mm, while a prospective clinical cohort used 22 degrees or less and 8 mm or
    less as operational thresholds. Because the angle and distance correlate
    directly with BMI - which is itself the disease's principal risk factor - a
    fixed threshold necessarily entangles the exposure with the diagnostic
    criterion, and narrowed geometry occurs in asymptomatic individuals.
    Population- and age-specific normative studies are actively being conducted but
    have not yet produced adjusted criteria.
  evidence:
  - reference: PMID:30291587
    reference_title: "Superior Mesenteric Artery Syndrome: a Prospective Study in a Single Institution."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis was achieved through barium swallow, CT/MR angiography (aortomesenteric angle ≤ 22°, distance ≤ 8 mm), endoscopy."
    explanation: >-
      Documents the operational angle and distance thresholds used in a prospective
      clinical cohort.
  - reference: PMID:38694377
    reference_title: "Evaluating aortomesenteric parameters in a tertiary center of Nepal for superior mesenteric artery syndrome diagnosis and risk factors: cross-sectional study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Understanding these normal values in the Nepalese population is critical for accurate diagnoses and predictions using CT scans. The research highlights the impact of demographic factors on these parameters and emphasizes their significance in clinical assessments related to SMA syndrome."
    explanation: >
      Argues explicitly that population-specific normative aortomesenteric values are
      needed rather than a single universal threshold.
  - reference: clinicaltrials:NCT03937193
    reference_title: "Normal Range of Superior Mesenteric Artery on Computerized Tomography in Young Chinese Population and Its Correlation With Retroperitoneal Adipose Tissue"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In literature, superior mesenteric artery (SMA) angle, also named as aortomesenteric angle (AMA), varies greatly in both adult and children; while the aortomesenteric distance also ranges widely. Both AMA and AMD are influenced by retroperitoneal fat."
    explanation: >
      Registered normative study confirming both the wide literature variation in
      aortomesenteric geometry and its confounding by retroperitoneal fat - the two
      halves of this knowledge gap.
  - reference: clinicaltrials:NCT04515251
    reference_title: "A Prospective, Observational, Multicenter Study on Ultrasound Evaluation of Superior Mesenteric Artery Measurements in a Healthy Pediatric Population"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Multicenter, prospective, observational research project on children aged from 10 to 15 years old undergoing abdominal ultrasound examinations during routine clinical practice."
    explanation: >
      Shows that age-specific paediatric normative work is actively underway but not
      yet reported, substantiating the claim that adjusted criteria do not yet exist.
  proposed_experiments:
  - experiment_id: smas_normative_multipopulation
    name: Multi-population normative aortomesenteric reference study
    description: >
      Normative CT and ultrasound studies across multiple populations, stratified by
      age, sex, BMI, and measured visceral fat, deriving percentile-based rather
      than fixed thresholds.
    decision_criterion: >
      Demonstration that percentile-based, covariate-adjusted thresholds outperform a
      single fixed cut-off would justify replacing the current criteria.
  - experiment_id: smas_threshold_accuracy
    name: Prospective diagnostic-accuracy study of candidate thresholds
    description: >
      Prospective study comparing candidate angle and distance thresholds against a
      reference standard combining compatible symptoms with demonstrated duodenal
      transit obstruction, reporting sensitivity, specificity, and positive
      predictive value.
    decision_criterion: >
      A threshold pair with acceptable positive predictive value against the
      composite reference standard would define operational diagnostic criteria.

notes: >
  Curation notes. (1) SMA syndrome is deliberately curated as a non-Mendelian,
  mechanical/anatomic disorder: no gene, variant, inheritance pattern, molecular
  pathway, biomarker, omics signature, or validated animal model is established,
  and those sections are intentionally empty rather than speculatively filled.
  GeneReviews has no article for this disorder (confirmed by PubMed search), as
  expected for a non-Mendelian entity. (2) The pathograph is deliberately CYCLIC.
  The edge "Progressive Weight Loss and Malnutrition" -> "Mesenteric Fat Pad
  Depletion" closes a positive-feedback loop with the intervening nodes; every edge
  of the loop carries the hypothesis group `fat_pad_depletion_vicious_cycle`. This
  is not a modelling error - the self-amplifying cycle is the clinically decisive
  feature of the disease and the reason therapy targets nutrition rather than
  symptoms. (3) Do NOT conflate with nutcracker syndrome (left renal vein
  entrapment by the same aortomesenteric angle - modelled here as a differential
  diagnosis with an explicitly shared anatomic substrate), median arcuate ligament
  syndrome (coeliac axis compression by the diaphragm), or SMA
  thrombosis/embolism/dissection and mesenteric ischaemia (occlusive vascular
  disease of the artery itself). In SMA syndrome the artery is structurally normal;
  it is the compressing structure, not the diseased one. (4) Historical case-based
  literature reports mortality up to 33% in untreated or severely delayed disease.
  That figure was not carried into the entry as a structured claim because it
  derives from selected historical series with substantial ascertainment bias and no
  verifiable quotable source was located.


      Children: Prodromal Illness Duration May Reflect Pathogenetic Mechanism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most common clinical syndromes were encephalitis (52%), acute
      disseminated encephalomyelitis (12%), transverse myelitis (12%), and
      cerebellar ataxia (10%).
    explanation: >-
      Records cerebellar ataxia among attributable M. pneumoniae neurologic
      syndromes in the cohort.
- name: Reduced Consciousness
  category: Neurological
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Reduced consciousness
    term:
      id: HP:0004372
      label: Reduced consciousness
  evidence:
  - reference: PMID:37417436
    reference_title: >-
      Determining the Clinical Characteristics, Treatment Strategies, and
      Prognostic Factors for Mycoplasma pneumoniae Encephalitis in Children: A
      Multicenter Study in China.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most frequently reported neurological manifestations were disturbance
      of consciousness (90.0%), positive pyramidal tract sign (89.7%), headache
      (87.4%), and seizures (75.9%).
    explanation: >-
      Reports disturbance of consciousness in 90.0% of children in a pediatric
      M. pneumoniae encephalitis cohort.
- name: Fever
  category: Constitutional
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Fever
    term:
      id: HP:0001945
      label: Fever
  evidence:
  - reference: PMID:37417436
    reference_title: >-
      Determining the Clinical Characteristics, Treatment Strategies, and
      Prognostic Factors for Mycoplasma pneumoniae Encephalitis in Children: A
      Multicenter Study in China.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All patients had an abnormal body temperature: most had fever (96.5%) and
      only 3.5% had hypothermia.
    explanation: >-
      Establishes fever as a frequent extraneurologic manifestation in pediatric
      Mycoplasma encephalitis.

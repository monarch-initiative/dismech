name: Mycoplasma Encephalitis
synonyms:
- M. pneumoniae encephalitis
- Mycoplasma pneumoniae-associated encephalitis
- mycoplasmal meningoencephalitis
- M. pneumoniae meningoencephalitis
- M. pneumoniae-associated CNS disease
creation_date: "2026-09-30T10:37:00Z"
description: >-
  Mycoplasma encephalitis is infectious encephalitis associated with
  Mycoplasmoides pneumoniae in which respiratory infection can be followed by
  neuroinvasion or postinfectious immune injury that inflames the brain.
category: Infectious Disease
disease_term:
  preferred_term: Mycoplasma encephalitis
  term:
    id: MONDO:0019377
    label: Mycoplasma encephalitis
parents:
- Infectious encephalitis
- Mycoplasmoides infection
infectious_agent:
- name: Mycoplasmoides pneumoniae
  description: >-
    Mycoplasmoides pneumoniae is the respiratory Mollicutes pathogen linked to
    extrapulmonary central-nervous-system inflammation in Mycoplasma
    encephalitis.
  infectious_agent_term:
    preferred_term: Mycoplasmoides pneumoniae
    term:
      id: NCBITaxon:2104
      label: Mycoplasmoides pneumoniae
  evidence:
  - reference: PMID:39475213
    reference_title: "Mycoplasma pneumoniae: not a typical respiratory pathogen."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      M. pneumoniae infects exclusively humans where it primarily causes mild
      and self-limiting respiratory tract infections.
    explanation: >-
      Identifies M. pneumoniae as a human respiratory pathogen and the
      infection source for downstream extrapulmonary disease.
agent_life_cycle:
  description: >-
    M. pneumoniae cycles among human respiratory hosts without an animal
    reservoir, arthropod vector, or sylvatic stage; neurologic disease is an
    uncommon extrapulmonary outcome after respiratory acquisition.
  hosts:
  - preferred_term: Homo sapiens
    role: natural host and respiratory reservoir
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  evidence:
  - reference: PMID:39475213
    reference_title: "Mycoplasma pneumoniae: not a typical respiratory pathogen."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The host range of natural infection is limited to humans.
    explanation: >-
      Supports humans as the natural host range and the absence of a known
      animal reservoir for M. pneumoniae infection.
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
  - classification_value: NEUROLOGIC
transmission:
- name: Respiratory Droplet Acquisition
  description: >-
    M. pneumoniae is acquired through close respiratory exposure before the
    infection or its immune sequelae reach the central nervous system.
  evidence:
  - reference: PMID:39475213
    reference_title: "Mycoplasma pneumoniae: not a typical respiratory pathogen."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Transmission is predominantly via respiratory droplets during periods of
      close contact with M. pneumoniae-positive individuals with a long
      incubation period of several weeks.
    explanation: >-
      Supports respiratory droplet spread between close human contacts as the
      acquisition route preceding respiratory infection and rare CNS disease.
prevalence:
- population: Children with confirmed encephalitis in an Australian multicenter cohort
  measure_type: CASES_IN_LITERATURE
  prevalence_class: UNKNOWN
  notes: >-
    In a prospective national Australian pediatric encephalitis cohort,
    Mycoplasma pneumoniae accounted for 6% of confirmed encephalitis etiologies.
  evidence:
  - reference: PMID:31549170
    reference_title: >-
      Causes and Clinical Features of Childhood Encephalitis: A Multicenter,
      Prospective Cohort Study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      57% (95% confidence interval [CI], 52%-63%) had infectious causes, 10%
      enterovirus, 10% parechovirus, 8% bacterial meningoencephalitis, 6%
      influenza, 6% herpes simplex virus (HSV), and 6% Mycoplasma pneumoniae
    explanation: >-
      Quantifies M. pneumoniae among expert-confirmed childhood encephalitis
      etiologies.
progression:
- phase: Brief-prodrome direct CNS infection
  notes: >-
    Early-onset neurologic disease can have less prominent respiratory illness
    and PCR-detectable organisms in cerebrospinal fluid, supporting direct
    central-nervous-system infection.
  evidence:
  - reference: PMID:26084846
    reference_title: >-
      Neurological Complications of PCR-Proven M. pneumoniae Infections in
      Children: Prodromal Illness Duration May Reflect Pathogenetic Mechanism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      one with a brief (<7 days) or no prodrome, less frequent respiratory
      manifestations and IgM response, and detection of M. pneumoniae in the CSF,
      but not the respiratory tract
    explanation: >-
      Defines the brief-prodrome CSF-positive pattern used to represent direct
      CNS infection in the pathograph.
- phase: Prolonged-prodrome immune-mediated disease
  notes: >-
    Later-onset neurologic disease follows a longer respiratory prodrome with
    respiratory-tract detection and a peripheral IgM response, consistent with
    postinfectious immune injury.
  evidence:
  - reference: PMID:26084846
    reference_title: >-
      Neurological Complications of PCR-Proven M. pneumoniae Infections in
      Children: Prodromal Illness Duration May Reflect Pathogenetic Mechanism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      one with a prolonged prodrome (≥7 days), respiratory manifestations, an
      immunoglobulin M (IgM) response in peripheral blood, and detection of M.
      pneumoniae in the respiratory tract, but not the CSF
    explanation: >-
      Defines the prolonged-prodrome respiratory/IgM pattern used to represent
      delayed immune-mediated CNS injury in the pathograph.
pathophysiology:
- name: Mycoplasmoides Respiratory Infection
  role: trigger
  biological_scale: TISSUE
  description: >-
    M. pneumoniae initially colonizes the respiratory mucosa and establishes a
    systemic inflammatory context for neurologic complications.
  downstream:
  - target: Direct CNS Mycoplasmoides Invasion
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      In the short-prodrome subset, organisms can be detected in cerebrospinal
      fluid and implicate direct central nervous system invasion.
  - target: Postinfectious Neural Autoantibody Injury
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      In the longer-prodrome subset, respiratory infection elicits immune
      responses that injure central nervous system tissue after organisms are no
      longer demonstrable in cerebrospinal fluid.
  - target: Cerebral Vaso-Occlusion
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      In a rare acute-pneumonia branch, infection-associated vasculitis,
      hypercoagulability, and hypoperfusion can produce cerebral watershed
      infarction.
  - target: Systemic Febrile Response
    causal_link_type: DIRECT
    description: >-
      Acute respiratory infection triggers a systemic inflammatory response
      that commonly produces fever.
- name: Direct CNS Mycoplasmoides Invasion
  biological_scale: TISSUE
  description: >-
    In early neurologic disease, M. pneumoniae can be detected in the
    cerebrospinal fluid, consistent with direct neuroinvasion rather than a
    delayed postinfectious syndrome.
  downstream:
  - target: Brain Inflammation
    causal_link_type: DIRECT
    description: >-
      Organism entry into the central nervous system provides a direct route to
      inflammatory brain injury.
  evidence:
  - reference: PMID:26084846
    reference_title: >-
      Neurological Complications of PCR-Proven M. pneumoniae Infections in
      Children: Prodromal Illness Duration May Reflect Pathogenetic Mechanism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      one with a brief (<7 days) or no prodrome, less frequent respiratory
      manifestations and IgM response, and detection of M. pneumoniae in the CSF,
      but not the respiratory tract
    explanation: >-
      Distinguishes an early, CSF-PCR-positive pattern compatible with direct
      central nervous system infection.
- name: Postinfectious Neural Autoantibody Injury
  biological_scale: ORGANISM
  description: >-
    Delayed M. pneumoniae-associated neurologic disease can reflect immune
    injury, including anti-galactocerebroside and antiganglioside antibodies
    that appear with central nervous system manifestations.
  downstream:
  - target: Brain Inflammation
    causal_link_type: DIRECT
    description: >-
      Neural autoantibody responses can produce inflammatory brain and deep gray
      matter injury after respiratory infection.
  evidence:
  - reference: PMID:26084846
    reference_title: >-
      Neurological Complications of PCR-Proven M. pneumoniae Infections in
      Children: Prodromal Illness Duration May Reflect Pathogenetic Mechanism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings support the hypothesis of two separate pathogenetic
      mechanisms for M. pneumoniae-associated neurologic disease, one related to
      direct infection of the central nervous system and one indirect, likely
      immunologically mediated.
    explanation: >-
      Supports an immune-mediated branch separable from the direct
      central-nervous-system infection subset.
  - reference: PMID:17651816
    reference_title: >-
      Anti-galactocerebroside testing in Mycoplasma
      pneumoniae-associated encephalitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Anti-GalC antibody was found in the CSF of only eight (31%) of 21 Mp
      patients indicating that CSF anti-GalC antibody is not a specific marker
      for Mp CNS disease.
    explanation: >-
      Places anti-galactocerebroside antibodies in the cerebrospinal fluid of a
      subset of M. pneumoniae-associated encephalitis cases.
  - reference: PMID:20305125
    reference_title: >-
      Transient basal ganglia and thalamic involvement following Mycoplasma
      pneumoniae infection associated with antiganglioside antibodies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Increased titers of immunoglobulin M antibodies against GM1 ganglioside
      components were found during an acute phase of neurological illness.
    explanation: >-
      Links M. pneumoniae-associated basal-ganglia and thalamic neurologic
      injury with antiganglioside antibodies in an acute clinical presentation.
- name: Cerebral Vaso-Occlusion
  biological_scale: TISSUE
  description: >-
    M. pneumoniae pneumonia can be accompanied by focal vasculitis,
    hypercoagulability, and hypoperfusion that occlude cerebral watershed
    territories and cause ischemic brain injury.
  biological_processes:
  - preferred_term: blood coagulation
    modifier: INCREASED
    term:
      id: GO:0007596
      label: blood coagulation
  downstream:
  - target: Cerebral Infarct
    causal_link_type: DIRECT
    description: >-
      Occlusion of cerebral watershed territories directly manifests as focal
      cerebral infarction.
  evidence:
  - reference: PMID:41398820
    reference_title: >-
      Was the occurrence of mycoplasma pneumoniae pneumonia combined with
      cerebral watershed infarction a coincidence?: A CARE compliant case series
      and literature review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Focal vasculitis, hypercoagulability and hypoperfusion may be the dominant
      causes of cerebral watershed infarction in patients with MP infection.
    explanation: >-
      Supports the vaso-occlusive, hypercoagulable watershed-infarction branch
      downstream of acute M. pneumoniae infection.
- name: Brain Inflammation
  biological_scale: TISSUE
  description: >-
    Inflamed brain tissue produces the acute encephalitic presentation.
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  locations:
  - preferred_term: brain
    term:
      id: UBERON:0000955
      label: brain
  downstream:
  - target: Infectious Encephalitis
    causal_link_type: DIRECT
    description: >-
      Brain inflammation downstream of M. pneumoniae infection manifests as
      infectious encephalitis.
  - target: Ataxia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      In a lower-frequency cerebellar subset, M. pneumoniae-associated brain
      inflammation manifests with cerebellar ataxia.
  - target: Reduced Consciousness
    causal_link_type: DIRECT
    description: >-
      Acute encephalitic brain inflammation commonly disturbs consciousness.
  - target: Headache
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Encephalitic inflammation produces headache in most pediatric M.
      pneumoniae encephalitis cases.
  - target: Seizure
    causal_link_type: DIRECT
    description: >-
      Inflamed brain tissue can generate acute seizures and status epilepticus.
  - target: CSF Pleocytosis
    causal_link_type: DIRECT
    description: >-
      Central nervous system inflammation raises the cerebrospinal-fluid
      leukocyte count in an immune-mediated basal-ganglia subset.
  - target: Movement Disorder
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Involvement of basal ganglia circuits can produce involuntary movement
      phenotypes in postinfectious M. pneumoniae-associated encephalitis.
- name: Systemic Febrile Response
  biological_scale: ORGANISM
  description: >-
    The acute systemic inflammatory response to M. pneumoniae infection produces
    fever in most pediatric Mycoplasma encephalitis cases.
  downstream:
  - target: Fever
    causal_link_type: DIRECT
    description: >-
      Systemic inflammation downstream of infection drives fever.
phenotypes:
- name: Infectious Encephalitis
  category: Neurological
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Infectious encephalitis
    term:
      id: HP:0002383
      label: Infectious encephalitis
  evidence:
  - reference: PMID:26084846
    reference_title: >-
      Neurological Complications of PCR-Proven M. pneumoniae Infections in
      Children: Prodromal Illness Duration May Reflect Pathogenetic Mechanism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most common clinical syndromes were encephalitis (52%), acute
      disseminated encephalomyelitis (12%), transverse myelitis (12%), and
      cerebellar ataxia (10%).
    explanation: >-
      Shows encephalitis as the dominant neurologic syndrome in a pediatric
      cohort with PCR-proven M. pneumoniae infection.
- name: Ataxia
  category: Neurological
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Ataxia
    term:
      id: HP:0001251
      label: Ataxia
  evidence:
  - reference: PMID:26084846

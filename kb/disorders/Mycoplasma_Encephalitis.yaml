    reference_title: Analysis of status epilepticus with Mycoplasma pneumoniae encephalitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Six of the nine children (67%) developed refractory status epilepticus.
    explanation: >-
      Shows that M. pneumoniae encephalitis can present with severe refractory
      status epilepticus in a pediatric subset.
- name: CSF Pleocytosis
  category: Laboratory
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: CSF pleocytosis
    term:
      id: HP:0012229
      label: CSF pleocytosis
  evidence:
  - reference: PMID:42475768
    reference_title: Clinical and Neuroimaging Features of Basal Ganglia Encephalitis in Children.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cerebrospinal fluid analysis revealed mild pleocytosis in 66.7% and
      positive oligoclonal bands in 42.1%.
    explanation: >-
      Records CSF pleocytosis in a postinfectious basal-ganglia encephalitis
      cohort frequently associated with M. pneumoniae infection.
- name: Movement Disorder
  category: Neurological
  frequency: OCCASIONAL
  context: Symmetric basal-ganglia postinfectious subset
  phenotype_term:
    preferred_term: Abnormality of movement
    term:
      id: HP:0100022
      label: Abnormality of movement
  evidence:
  - reference: PMID:42475768
    reference_title: Clinical and Neuroimaging Features of Basal Ganglia Encephalitis in Children.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The initial symptoms comprised altered consciousness or behavioral changes
      (10/21, 47.6%), followed by movement disorders (8/21, 38%) and seizures
      (6/21, 28.5%). Evidence of Mycoplasma pneumoniae infection was confirmed
      in 14 patients (66.7%).
    explanation: >-
      Links movement disorders to a postinfectious basal-ganglia encephalitis
      subset in which two-thirds of cases had evidence of M. pneumoniae infection.
- name: Cerebral Infarct
  category: Neurological
  frequency: RARE
  phenotype_term:
    preferred_term: Cerebral infarct
    term:
      id: HP:0025722
      label: Cerebral infarct
  evidence:
  - reference: PMID:41398820
    reference_title: >-
      Was the occurrence of mycoplasma pneumoniae pneumonia combined with
      cerebral watershed infarction a coincidence?: A CARE compliant case series
      and literature review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cerebral magnetic resonance imaging revealed cerebral watershed infarction
      in all 4 children included in the study.
    explanation: >-
      Documents watershed cerebral infarction as a rare vaso-occlusive neurologic
      complication of acute M. pneumoniae pneumonia.
diagnosis:
- name: Mycoplasma pneumoniae serology
  description: >-
    M. pneumoniae-associated encephalitis is commonly assigned by serum or CSF
    serology because direct organism detection in cerebrospinal fluid is
    insensitive.
  diagnosis_term:
    preferred_term: Diagnostic Serology Testing
    term:
      id: NCIT:C217458
      label: Diagnostic Serology Testing
  evidence:
  - reference: PMID:17671056
    reference_title: "Pediatric encephalitis: what is the role of Mycoplasma pneumoniae?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Eighty percent of the 84 patients were positive for M. pneumoniae by
      serology alone. Cerebrospinal fluid polymerase chain reaction for M.
      pneumoniae was rarely positive (2%).
    explanation: >-
      Shows that the California Encephalitis Project identified most pediatric
      M. pneumoniae-associated encephalitis cases serologically.
- name: Mycoplasma pneumoniae PCR
  description: >-
    PCR can test respiratory or cerebrospinal-fluid specimens for M. pneumoniae
    DNA, but CSF PCR is rarely positive in pediatric M. pneumoniae-associated
    encephalitis.
  diagnosis_term:
    preferred_term: Polymerase Chain Reaction
    term:
      id: NCIT:C17003
      label: Polymerase Chain Reaction
  evidence:
  - reference: PMID:17671056
    reference_title: "Pediatric encephalitis: what is the role of Mycoplasma pneumoniae?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Eighty percent of the 84 patients were positive for M. pneumoniae by
      serology alone. Cerebrospinal fluid polymerase chain reaction for M.
      pneumoniae was rarely positive (2%).
    explanation: >-
      Establishes that cerebrospinal-fluid PCR is rarely positive in pediatric
      M. pneumoniae-associated encephalitis.
treatments:
- name: Anti-Mycoplasma Antibiotics
  description: >-
    Macrolides, tetracyclines, or fluoroquinolones can inhibit M. pneumoniae,
    whereas beta-lactams are ineffective because the organism lacks a cell wall.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antibiotic Therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
    therapeutic_agent:
    - preferred_term: azithromycin
      term:
        id: CHEBI:2955
        label: azithromycin
    - preferred_term: clarithromycin
      term:
        id: CHEBI:3732
        label: clarithromycin
    - preferred_term: doxycycline
      term:
        id: CHEBI:50845
        label: doxycycline
    - preferred_term: levofloxacin
      term:
        id: CHEBI:63598
        label: levofloxacin
    - preferred_term: moxifloxacin
      term:
        id: CHEBI:63611
        label: moxifloxacin
  target_mechanisms:
  - target: Mycoplasmoides Respiratory Infection
    treatment_effect: INHIBITS
    description: >-
      Active intracellular antimicrobials suppress respiratory M. pneumoniae
      replication, reducing further organism-driven immune stimulation.
  - target: Direct CNS Mycoplasmoides Invasion
    treatment_effect: INHIBITS
    description: >-
      When organisms are detectable in CSF, anti-mycoplasmal treatment targets
      the invading pathogen.
  evidence:
  - reference: PMID:37417436
    reference_title: >-
      Determining the Clinical Characteristics, Treatment Strategies, and
      Prognostic Factors for Mycoplasma pneumoniae Encephalitis in Children: A
      Multicenter Study in China.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Azithromycin was administered to all 87 patients, with 80 (91.9%)
      receiving intravenous (i.v.) followed by oral azithromycin treatment.
    explanation: >-
      Documents uniform azithromycin use in a multicenter pediatric Mycoplasma
      encephalitis cohort.
  - reference: PMID:39475213
    reference_title: "Mycoplasma pneumoniae: not a typical respiratory pathogen."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      As M. pneumoniae lacks a cell wall, it is resistant to antibiotics that
      inhibit cell wall synthesis, such as β-lactam antibiotics.
    explanation: >-
      Explains why M. pneumoniae requires anti-mycoplasmal agents rather than
      beta-lactam therapy.
  - reference: PMID:39475213
    reference_title: "Mycoplasma pneumoniae: not a typical respiratory pathogen."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Tetracycline and fluoroquinolone antibiotics show good activity in vitro
      and may be considered, although these classes of antibiotics may have
      potential toxicities in young children.
    explanation: >-
      Supports tetracycline and fluoroquinolone agents as non-macrolide
      anti-mycoplasmal antibiotic options.
- name: Corticosteroid Therapy
  description: >-
    Corticosteroids, often represented clinically by methylprednisolone, dampen
    immune-mediated central-nervous-system injury in M. pneumoniae encephalitis.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: systemic corticosteroid therapy
    term:
      id: NCIT:C122080
      label: Systemic Corticosteroid Therapy
    therapeutic_agent:
    - preferred_term: methylprednisolone
      term:
        id: NCIT:C647
        label: Methylprednisolone
  target_mechanisms:
  - target: Postinfectious Neural Autoantibody Injury
    treatment_effect: INHIBITS
    description: >-
      Steroid immunosuppression inhibits the delayed immune injury branch of
      M. pneumoniae-associated neurologic disease.
  evidence:
  - reference: PMID:37417436
    reference_title: >-
      Determining the Clinical Characteristics, Treatment Strategies, and
      Prognostic Factors for Mycoplasma pneumoniae Encephalitis in Children: A
      Multicenter Study in China.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Azithromycin with intravenous immunoglobulin or/and corticosteroid
      treatment can shorten the hospitalization duration and the clinical
      improvement process.
    explanation: >-
      Supports corticosteroid-containing immunomodulation as an adjunct to
      anti-mycoplasmal antibiotic therapy in pediatric M. pneumoniae
      encephalitis.
- name: Intravenous Immunoglobulin
  description: >-
    IVIG is used as immune-modulating therapy with azithromycin for the
    postinfectious immune-mediated branch of M. pneumoniae encephalitis.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: intravenous immunoglobulin therapy
    term:

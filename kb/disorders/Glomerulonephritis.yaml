    ADX-097, a targeted complement inhibitor, given subcutaneously across three
    complement-implicated glomerulonephritis subtypes at once. Included at the
    root level precisely because its enrolment spans IgAN, lupus nephritis, and
    C3 glomerulopathy — it is a trial of the shared complement mechanism rather
    than of a single subtype.
  evidence:

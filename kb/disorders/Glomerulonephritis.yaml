        label: dapagliflozin
  target_mechanisms:
  - target: Nephron Loss and Progressive Kidney Failure
    treatment_effect: INHIBITS
    description: >-
      Slows the rate of GFR decline and progression to kidney failure along the
      shared nephron-loss pathway.
  evidence:
  - reference: PMID:32970396
    reference_title: "Dapagliflozin in Patients with Chronic Kidney Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among patients with chronic kidney disease, regardless of the presence or
      absence of diabetes, the risk of a composite of a sustained decline in the
      estimated GFR of at least 50%, end-stage kidney disease, or death from
      renal or card
    explanation: >-
      DAPA-CKD randomized trial establishing that SGLT2 inhibition slows
      progression in chronic kidney disease independent of diabetes, the basis
      for curating it as root-level background therapy.
- name: Kidney Replacement Therapy
  description: >-
    Dialysis or kidney transplantation once glomerulonephritis has progressed to
    kidney failure. Curated because Stage 5 chronic kidney disease is a terminal
    node of this entry's pathograph and the entry would otherwise model the
    endpoint without the intervention that addresses it. Note that several
    glomerulonephritis subtypes recur in the allograft, which is a
    subtype-specific consideration handled on those entries.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: renal replacement therapy
    term:
      id: NCIT:C126400
      label: Renal Replacement Therapy
  evidence:
  - reference: PMID:20301598
    reference_title: "C3 Glomerulopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      When ESRD develops, treatment options are limited to dialysis or
      transplantation.
    explanation: >-
      GeneReviews management guidance for the kidney-failure endpoint of
      complement-mediated glomerulonephritis.
- name: Surveillance of Kidney Function and Complement Status
  description: >-
    Structured monitoring rather than an intervention: serial assessment of
    kidney function and of the complement pathway, with fundus examination where
    complement-mediated disease carries a retinal risk. Curated from the
    GeneReviews Surveillance recommendations.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301598

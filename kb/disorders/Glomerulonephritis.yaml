- name: Subepithelial Immune Deposition and Podocyte Injury
  description: >-
    The nephrotic arm of GN, exemplified by membranous nephropathy. Antibody
    against a podocyte surface antigen (PLA2R1, THSD7A, and a growing list of
    minor antigens) forms immune deposits in the subepithelial space. Because the
    basement membrane separates these deposits from the circulation, circulating
    leukocytes are not recruited and the lesion is not inflammatory; instead,
    locally generated C5b-9 injures the podocyte, disorganizing its actin
    cytoskeleton. The consequence is nephrotic-range proteinuria without the
    hematuria-dominant nephritic picture. This node is the point of contact with
    the conserved podocytopathy module.
  biological_scale: CELLULAR
  conforms_to: "nephrotic_podocyte_injury#Podocyte Injury"
  cell_types:

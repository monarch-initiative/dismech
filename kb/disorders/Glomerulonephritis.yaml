environmental:
- name: Streptococcal and other infectious triggers
  description: >-
    Infection initiates glomerulonephritis by several distinct routes: deposition
    of circulating immune complexes, planting of antigen in the capillary wall
    with in-situ complex formation, molecular mimicry between anti-pathogen
    antibody and intrinsic glomerular matrix proteins, direct damage to glomerular
    cells, and superantigen-driven T cell activation. Group A streptococcus is the
    classic trigger, but hepatitis B and C, staphylococci, endocarditis pathogens,
    HIV, and parasites are all implicated. The relationship is bidirectional:
    urinary immunoglobulin loss and immunosuppressive treatment in turn raise
    infection risk.
  evidence:
  - reference: PMID:37764071
    reference_title: "Autoimmunity and Infection in Glomerular Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The mechanisms responsible range from the direct damage of glomerular cells
      to the formation and deposition of immunocomplexes to molecular mimicry to
      the secretion of superantigens.
    explanation: >-
      Enumerates the distinct mechanisms linking infection to glomerular injury.
  - reference: PMID:37764071
    reference_title: "Autoimmunity and Infection in Glomerular Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      infections are more frequent than in the general population due to the loss
      of immunoglobulins in urine and the immunosuppressive agents used to treat
      the autoimmune disease that decrease the activity of the immune system
    explanation: >-
      Documents the reverse arm of the infection-glomerulonephritis relationship.
  influences_mechanisms:
  - target: Nephritogenic Antigen Exposure and Loss of Tolerance
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Infection supplies the nephritogenic antigen, or breaks tolerance by
      molecular mimicry or superantigen effect, initiating the immune response
      that injures the glomerulus.
    evidence:
    - reference: PMID:39341789
      reference_title: "Mechanisms that potentially contribute to the development of post-streptococcal glomerulonephritis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Streptococcal pyrogenic exotoxin B and nephritis-associated plasmin
        receptor are identified nephritogenic antigens (nephritogens).
      explanation: >-
        Names the specific streptococcal antigens that trigger the nephritogenic
        immune response.
treatments:
- name: Corticosteroid Therapy
  description: >-
    Glucocorticoids are the backbone of induction therapy for inflammatory GN,
    suppressing leukocyte recruitment and cytokine production at the glomerulus.
    They are given with a second agent in severe crescentic disease and are used
    selectively — not universally — in indolent subtypes, where toxicity may
    outweigh benefit. In infection-related GN, treating the infection takes
    precedence over immunosuppression.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: corticosteroid
      term:
        id: CHEBI:50858
        label: corticosteroid
  target_mechanisms:
  - target: Leukocyte Recruitment and Glomerular Inflammation
    treatment_effect: INHIBITS
    description: >-
      Broad suppression of the glomerular inflammatory infiltrate and its cytokine
      output.
  evidence:
  - reference: PMID:28515156
    reference_title: "Anti-Glomerular Basement Membrane Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatment aims to rapidly remove pathogenic autoantibody, typically with the
      use of plasma exchange, along with steroids and cytotoxic therapy to prevent
      ongoing autoantibody production and tissue inflammation.
    explanation: >-
      Documents corticosteroids as a component of standard induction therapy in
      severe antibody-mediated GN.
- name: Cyclophosphamide
  description: >-
    Alkylating cytotoxic therapy used for induction in severe crescentic and
    rapidly progressive glomerulonephritis, suppressing the B cell clones
    producing pathogenic autoantibody. Gonadotoxicity and malignancy risk limit
    cumulative exposure, which is why rituximab has displaced it in many settings.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: cyclophosphamide
      term:
        id: NCIT:C405
        label: Cyclophosphamide
  target_mechanisms:
  - target: Nephritogenic Antigen Exposure and Loss of Tolerance
    treatment_effect: INHIBITS
    description: >-
      Suppresses the lymphocyte clones generating pathogenic autoantibody.
  evidence:
  - reference: PMID:28515156
    reference_title: "Anti-Glomerular Basement Membrane Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      along with steroids and cytotoxic therapy to prevent ongoing autoantibody
      production and tissue inflammation
    explanation: >-
      Documents cytotoxic therapy as standard induction alongside corticosteroids
      to halt autoantibody production.
- name: Rituximab
  description: >-
    Anti-CD20 monoclonal antibody depleting B cells and thereby the precursors of
    autoantibody-secreting plasma cells. Now a first-line induction and
    maintenance option in ANCA-associated GN and the preferred immunosuppressive
    therapy in PLA2R-associated membranous nephropathy.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: rituximab
      term:
        id: NCIT:C1702
        label: Rituximab
  target_mechanisms:
  - target: Nephritogenic Antigen Exposure and Loss of Tolerance
    treatment_effect: INHIBITS
    description: >-
      B cell depletion removes the source of pathogenic autoantibody.
    evidence:
    - reference: PMID:31269364
      reference_title: "Rituximab or Cyclosporine in the Treatment of Membranous Nephropathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        B-cell anomalies play a role in the pathogenesis of membranous
        nephropathy. B-cell depletion with rituximab may therefore be noninferior
        to treatment with cyclosporine for inducing and maintaining a complete or
        partial remission of proteinuria in patients with this condition.
      explanation: >-
        States the mechanistic rationale linking B cell depletion to the
        autoantibody-driven lesion, and the proteinuria endpoint it addresses.
  evidence:
  - reference: PMID:20647199
    reference_title: "Rituximab versus cyclophosphamide for ANCA-associated vasculitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Rituximab therapy was not inferior to daily cyclophosphamide treatment for
      induction of remission in severe ANCA-associated vasculitis and may be
      superior in relapsing disease.
    explanation: >-
      RAVE randomized trial establishing rituximab as non-inferior to
      cyclophosphamide for remission induction in severe ANCA-associated disease.
  - reference: PMID:31269364
    reference_title: "Rituximab or Cyclosporine in the Treatment of Membranous Nephropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Rituximab was noninferior to cyclosporine in inducing complete or partial
      remission of proteinuria at 12 months and was superior in maintaining
      proteinuria remission up to 24 months.
    explanation: >-
      MENTOR randomized trial supporting rituximab in the membranous/podocyte arm
      of glomerulonephritis.
- name: Plasma Exchange
  description: >-
    Extracorporeal removal of circulating pathogenic autoantibody. The clearest
    indication is anti-GBM disease, where the antibody is directly pathogenic and
    outcome depends on removing it before crescents organize; it is also used in
    severe ANCA-associated disease with pulmonary hemorrhage. Benefit is greatest
    when started early, before dialysis dependence.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: Plasmapheresis
    term:
      id: NCIT:C15304
      label: Plasmapheresis
  target_mechanisms:
  - target: Anti-GBM Autoantibody Binding to Type IV Collagen
    treatment_effect: INHIBITS
    description: >-
      Removes circulating anti-GBM antibody, cutting off the supply of pathogenic
      autoantibody to the basement membrane.
    evidence:
    - reference: PMID:28515156
      reference_title: "Anti-Glomerular Basement Membrane Disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Treatment aims to rapidly remove pathogenic autoantibody, typically with
        the use of plasma exchange
      explanation: >-
        States the mechanistic rationale for plasma exchange as removal of the
        pathogenic autoantibody.
  evidence:
  - reference: PMID:28515156
    reference_title: "Anti-Glomerular Basement Membrane Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Retrospective cohort studies suggest that when this combination of treatment
      is started early, the majority of patients will have good renal outcome
    explanation: >-
      Supports early combination therapy including plasma exchange as
      outcome-determining.
- name: Avacopan
  description: >-
    Oral C5a receptor antagonist that blocks the C5a-driven neutrophil priming and
    recruitment loop central to ANCA-associated glomerulonephritis. Its
    development is a direct application of the complement mechanism to therapy,
    and it permits substantial reduction of glucocorticoid exposure.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: avacopan
      term:
        id: NCIT:C174788
        label: Avacopan
  target_mechanisms:
  - target: Complement Activation
    treatment_effect: INHIBITS
    description: >-
      Blockade of the C5a receptor interrupts complement-driven neutrophil
      recruitment and priming at the glomerulus.
    evidence:
    - reference: PMID:33596356
      reference_title: "Avacopan for the Treatment of ANCA-Associated Vasculitis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The C5a receptor inhibitor avacopan is being studied for the treatment of
        antineutrophil cytoplasmic antibody (ANCA)-associated vasculitis.
      explanation: >-
        Identifies avacopan's molecular target as the C5a receptor, the
        complement node this treatment link asserts.
  evidence:
  - reference: PMID:33596356
    reference_title: "Avacopan for the Treatment of ANCA-Associated Vasculitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this trial involving patients with ANCA-associated vasculitis, avacopan
      was noninferior but not superior to prednisone taper with respect to
      remission at week 26 and was superior to prednisone taper with respect to
      sustained remission at week 52.
    explanation: >-
      ADVOCATE randomized trial establishing avacopan's efficacy relative to a
      prednisone taper, the basis for its glucocorticoid-sparing role.
- name: Renin-Angiotensin System Blockade and Supportive Antiproteinuric Therapy
  description: >-
    Non-immunosuppressive background therapy given across essentially every
    subtype of glomerulonephritis, independent of the initiating immune
    mechanism. ACE inhibitors and angiotensin II receptor blockers lower
    intraglomerular pressure and proteinuria, and lipid-lowering agents address
    the dyslipidemia of chronic glomerular disease. Unlike the mechanism-directed
    immunosuppressants above, this is the one intervention that applies at the
    root level: it acts on the shared downstream progression pathway rather than
    on any one subtype's trigger.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ACE inhibitor
      term:
        id: NCIT:C247
        label: ACE Inhibitor
    - preferred_term: angiotensin II receptor blocker
      term:
        id: NCIT:C66930
        label: Angiotensin II Receptor Antagonist
    - preferred_term: statin (HMG-CoA reductase inhibitor)
      term:
        id: NCIT:C1655
        label: HMG-CoA Reductase Inhibitor
  target_mechanisms:
  - target: Nephron Loss and Progressive Kidney Failure
    treatment_effect: INHIBITS
    description: >-
      Reduction of intraglomerular pressure and proteinuria slows the
      proteinuria-driven tubulointerstitial injury that carries surviving
      nephrons toward sclerosis, independent of the upstream immune trigger.
  evidence:
  - reference: PMID:20301598
    reference_title: "C3 Glomerulopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Nonspecific therapies used to treat numerous chronic glomerular diseases,
      including angiotensin-converting enzyme inhibitors, angiotensin II type-1
      receptor blockers, and lipid-lowering agents (in particular
      hydroxymethylglutaryl coenzyme A reductase inhibitors).
    explanation: >-
      GeneReviews management guidance naming RAS blockade and lipid-lowering
      therapy as the nonspecific measures used across chronic glomerular
      diseases, which is the basis for curating this at the root level rather
      than per subtype.
- name: SGLT2 Inhibition
  description: >-
    Sodium-glucose cotransporter-2 inhibition, added to RAS blockade as
    contemporary background therapy for proteinuric chronic kidney disease
    irrespective of diabetes status. Like RAS blockade it acts on the shared
    progression pathway rather than on any subtype's immune trigger, so it
    belongs at the root level. The pivotal trial enrolled a CKD population,
    including glomerulonephritis, rather than a GN-specific cohort — the
    evidence is therefore for the shared downstream node, not for any one
    subtype.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:

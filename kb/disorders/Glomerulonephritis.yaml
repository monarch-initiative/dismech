diagnosis:
- name: Kidney biopsy with light microscopy, immunofluorescence, and electron microscopy
  description: >-
    Kidney biopsy is the central diagnostic act in glomerulonephritis, because the
    clinical presentation — hematuria, proteinuria, hypertension, falling GFR — is
    shared across mechanistically unrelated subtypes and cannot distinguish them.
    All three modalities are needed: light microscopy defines the proliferative
    pattern, immunofluorescence separates immune-complex (granular), anti-GBM
    (linear), pauci-immune (scant), C3-dominant, and monoclonal light-chain
    patterns, and electron microscopy localizes deposits to the mesangial,
    subendothelial, or subepithelial compartment. Because deposit location and
    immunofluorescence pattern are precisely what map to the distinct upstream
    mechanisms modelled in this entry's pathophysiology, the biopsy is the
    observation that assigns a patient to a causal arm.
  diagnosis_term:
    preferred_term: Kidney biopsy
    term:
      id: NCIT:C51699
      label: Kidney Biopsy
  results: >-
    Immunofluorescence pattern and electron-microscopic deposit location together
    assign the case to an immune-complex, anti-GBM, pauci-immune, or
    complement-mediated arm; crescent burden and interstitial fibrosis grade the
    severity and reversibility.
  evidence:
  - reference: PMID:20301598
    reference_title: "C3 Glomerulopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The definitive diagnosis of C3G requires a renal biopsy with specialized
      immunofluorescence and electron microscopy studies both for diagnosis and to
      distinguish between the two major subtypes of C3G: C3 glomerulonephritis
      (C3GN) and dense deposit disease (DDD).
    explanation: >-
      States that renal biopsy with immunofluorescence and electron microscopy is
      required both to diagnose and to subtype complement-mediated
      glomerulonephritis.
  - reference: PMID:36635359
    reference_title: "Glomerulonephritis: immunopathogenesis and immunotherapy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These disorders are currently classified largely on the basis of
      histopathological lesion patterns
    explanation: >-
      Confirms that histopathological lesion pattern is the prevailing basis of
      classification, hence the central diagnostic role of biopsy; marked PARTIAL
      because the same source argues those patterns align poorly with mechanism.
  - reference: PMID:37869232
    reference_title: "Prevalence and distribution of primary glomerular diseases in Africa: a systematic review and meta-analysis of observational studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Only 4 studies (23.5%) used light microscopy (LM), immunofluorescence (IF),
      and electron microscopy (EM) for diagnosis.
    explanation: >-
      Documents that the full three-modality biopsy standard is frequently not met
      in practice, a recognised source of ascertainment bias in subtype
      distribution data.
- name: Mechanism-directed serologic panel
  description: >-
    Serology narrows the mechanism before and alongside biopsy, and each assay maps
    onto a specific pathophysiology arm modelled here: ANCA with PR3/MPO
    specificity for the pauci-immune neutrophil arm; anti-GBM antibody for the
    anti-alpha3(IV) arm; anti-PLA2R for the subepithelial podocyte arm; C3 and C4
    for complement consumption; ANA and anti-dsDNA for lupus nephritis; hepatitis
    B/C, HIV and streptococcal serology (ASO, anti-DNase B) for the
    infection-related arm; and serum/urine electrophoresis with free light chains
    for monoclonal gammopathy-related disease. Anti-PLA2R is the one assay that has
    become a genuine non-invasive substitute for biopsy in a defined setting;
    the others remain adjuncts to it.
  diagnosis_term:
    preferred_term: Autoantibody and complement serology
    term:
      id: NCIT:C181397
      label: Autoantibody Measurement
  results: >-
    A positive result assigns the mechanism: PR3/MPO-ANCA (pauci-immune), anti-GBM
    (linear anti-basement-membrane), anti-PLA2R (membranous), low C3
    (post-infectious, C3 glomerulopathy, or lupus nephritis).
  evidence:
  - reference: PMID:35484394
    reference_title: "Membranous nephropathy: new pathogenic mechanisms and their clinical implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the discovery of pathogenic circulating autoantibodies against phospholipase
      A2 receptor 1 (PLA2R1) and thrombospondin type 1 domain-containing protein
      7A (THSD7A)
    explanation: >-
      Establishes the circulating podocyte autoantibodies that underpin serologic
      diagnosis of the membranous arm.
  - reference: PMID:36109667
    reference_title: "Genetics of ANCA-associated vasculitis: role in pathogenesis, classification and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the positivity of ANCA targeting proteinase-3 (PR3-ANCA) or myeloperoxidase
      (MPO-ANCA)
    explanation: >-
      Establishes PR3 and MPO ANCA specificity as the serologic discriminator of
      the pauci-immune arm.
  - reference: PMID:20301598
    reference_title: "C3 Glomerulopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      low levels of the complement component C3
    explanation: >-
      Supports serum C3 measurement as part of the mechanism-directed workup.
prevalence:
- population: Africa (biopsy-proven primary glomerular disease, 8 countries)
  measure_type: UNKNOWN
  prevalence_class: UNKNOWN
  notes: >-
    Pooled biopsy-series distribution rather than a population rate: among 6,494
    biopsied individuals in 17 African studies, FSGS 26.10%, minimal change
    disease 22.40%, membranous nephropathy 8.40%, MPGN 6.40%,
    mesangioproliferative GN 6.40%, post-infectious GN 2.60%, IgA nephropathy
    2.60%, and crescentic GN 1.40%. This is a subtype *distribution* among
    biopsies, not an incidence in the general population, and is subject to biopsy
    referral and ascertainment bias. No reliable global incidence exists for
    aggregate glomerulonephritis, because biopsy policy, coding, age structure,
    and infection burden differ between settings.
  evidence:
  - reference: PMID:37869232
    reference_title: "Prevalence and distribution of primary glomerular diseases in Africa: a systematic review and meta-analysis of observational studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Seventeen eligible articles (n = 6,494 individuals) from 8 African countries
      met the inclusion criteria. The overall pooled prevalence of FSGS, MCD, MN,
      MPGN, MesPGN, PIGN, IgAN and CresGN was 26.10%, 22.40%, 8.40%, 6.40%, 6.40%,
      2.60%, 2.60%, 1.40%, respectively.
    explanation: >-
      Quantifies the relative distribution of glomerular disease subtypes in a
      large pooled African biopsy series.
biochemical:
- name: Anti-PLA2R autoantibody
  presence: Positive
  specificity: >-
    High for primary membranous nephropathy; absent in secondary membranous
    nephropathy and in other glomerulonephritis subtypes.
  notes: >-
    The one serologic marker in glomerulonephritis that is both mechanistically
    causal and clinically validated: it identifies the autoantigen driving the
    subepithelial deposition node, and its titre tracks disease activity closely
    enough that a positive result can substitute for biopsy in defined settings.
    Contrast the omics-derived candidate markers below, which remain unvalidated.
  evidence:
  - reference: PMID:19571279
    reference_title: "M-type phospholipase A2 receptor as target antigen in idiopathic membranous nephropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Serum samples from 26 of 37 patients (70%) with idiopathic but not
      secondary membranous nephropathy specifically identified a 185-kD
      glycoprotein in nonreduced glomerular extract.
    explanation: >-
      Quantifies detection in primary but not secondary membranous nephropathy,
      supporting both the presence and the specificity claim.
  - reference: PMID:19571279
    reference_title: "M-type phospholipase A2 receptor as target antigen in idiopathic membranous nephropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PLA(2)R is present in normal podocytes and in immune deposits in patients
      with idiopathic membranous nephropathy, indicating that PLA(2)R is a major
      antigen in this disease.
    explanation: >-
      Localizes the antigen to the podocyte and to the subepithelial immune
      deposits, tying the biomarker to the pathophysiology node rather than
      leaving it a free-standing serology.
- name: Serum complement C3
  presence: Decreased
  notes: >-
    Consumption of C3 through alternative-pathway activation. A low C3 is the
    routine bedside readout of the complement node in the pathograph, and its
    trajectory differs by subtype — transient in post-infectious GN, persistently
    low in C3 glomerulopathy.
  evidence:
  - reference: PMID:20301598
    reference_title: "C3 Glomerulopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      low levels of the complement component C3
    explanation: >-
      GeneReviews lists depressed serum C3 among the typical presenting
      laboratory findings of complement-mediated glomerulonephritis.
- name: Urinary and serum omics-derived candidate biomarkers
  presence: Under investigation
  notes: >-
    Curated deliberately as an unvalidated class rather than as named analytes.
    Proteomic and metabolomic studies in glomerulonephritis have proposed many
    candidates, but the systematic review below concludes that validation is
    still outstanding — so naming individual markers here would overstate the
    evidence.
  evidence:
  - reference: PMID:38689160
    reference_title: "The current use of proteomics and metabolomics in glomerulonephritis: a systematic literature review."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This review shows the potential of metabolomic and proteomic analysis to
      discover new disease biomarkers that may influence diagnostics and disease
      management. Further larger-scale research is required to establish the
      validity of the study outcomes, including the several proposed biomarkers.
    explanation: >-
      Supports the existence of a candidate-biomarker field while explicitly
      stating that validity is not yet established; marked PARTIAL for that
      reason.
inheritance:
- name: Complex non-Mendelian inheritance
  description: >-
    Glomerulonephritis as a whole is not a Mendelian disorder. Even in the
    complement-mediated arm, where the largest set of implicated genes is known,
    transmission is complex: familial clustering is the exception, and both
    dominant and recessive patterns have been described within the few
    multiplex families reported. This is the reason the complement genes below
    are curated as SUSCEPTIBILITY rather than as causal Mendelian loci.
  evidence:
  - reference: PMID:20301598
    reference_title: "C3 Glomerulopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      C3G is a complex genetic disorder that is rarely inherited in a simple
      mendelian fashion. Multiple affected persons within a single nuclear
      family are reported only occasionally, with both dominant and recessive
      inheritance being described.
    explanation: >-
      GeneReviews states the transmission pattern directly for the
      complement-mediated arm, and is the attribution for treating the
      complement genes as susceptibility loci rather than Mendelian causes.

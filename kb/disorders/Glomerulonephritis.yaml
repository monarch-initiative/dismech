name: Glomerulonephritis
creation_date: "2026-08-12T00:00:00Z"
category: Complex
parents:
- Kidney Disease
- Autoimmune Disease
disease_term:
  preferred_term: Glomerulonephritis
  term:
    id: MONDO:0002462
    label: glomerulonephritis
synonyms:
- GN
- glomerular nephritis
- Bright's disease
description: >-
  Glomerulonephritis (GN) is not a single disease but a heterogeneous group of
  immune-mediated disorders characterized by inflammation of the glomerulus, the
  filtration unit of the kidney, and collectively a leading cause of chronic
  kidney disease worldwide. Mechanistically distinct initiating lesions — immune
  complexes deposited from the circulation or formed in situ against a planted or
  intrinsic glomerular antigen, directly pathogenic anti-glomerular basement
  membrane (anti-GBM) autoantibody, ANCA-driven pauci-immune neutrophil
  activation, or uncontrolled alternative-pathway complement activation — converge
  on complement activation, leukocyte recruitment, and injury to the glomerular
  capillary wall. The resulting nephritic presentation combines hematuria (often
  with dysmorphic red cells), proteinuria, hypertension, edema, and a falling
  glomerular filtration rate. Severe necrotizing injury ruptures the capillary
  wall and drives parietal epithelial cell proliferation into crescents, producing
  rapidly progressive glomerulonephritis; unresolved injury leads to
  glomerulosclerosis, tubulointerstitial fibrosis, and progressive kidney failure.
  Because histopathological lesion patterns align poorly with these underlying
  mechanisms, contemporary practice increasingly groups GN by immunopathogenesis
  (infection-related, autoimmune, alloimmune, autoinflammatory/complement-mediated,
  and monoclonal gammopathy-related), which is what links mechanism to therapy.
notes: >-
  This is a deliberately mechanism-level root entry for the glomerulonephritis
  concept (MONDO:0002462). Syndrome-wide statements about a single causal gene,
  inheritance pattern, incidence, or prognosis are not biologically valid for GN
  as a whole; those belong on the etiologic subtype entries. Several subtypes are
  curated as standalone dismech entries in their own right — IgA_Nephropathy,
  Membranous_Nephropathy, Lupus_Nephritis, Anti-GBM_Disease,
  Granulomatosis_with_Polyangiitis, and Microscopic_Polyangiitis — and this entry
  models the shared final common pathway rather than duplicating them.

  Relationship to the `nephrotic_podocyte_injury` module: nephritic glomerular
  inflammation and nephrotic podocytopathy are distinct mechanisms and are kept
  distinct here. The main causal chain in this entry is the nephritic arm
  (immune deposition -> complement -> leukocyte recruitment -> capillary wall
  injury -> crescents). Only the single node representing subepithelial
  deposition with podocyte injury — the membranous/nephrotic arm — declares
  `conforms_to` against that module, which is where nephrotic-range proteinuria
  from podocyte foot process effacement is properly modeled. This entry therefore
  relates to, rather than duplicates, `nephrotic_podocyte_injury`.

  Deep research for this entry was run with Edison (falcon). The automated NEC
  preflight returned SKIP because MONDO records no causal gene for MONDO:0002462
  (correctly — GN is not monogenic), so the manual gene/OMIM/synonym check of
  CLAUDE.md section 2b was used instead and passed. Two ontology errors in the
  Edison report were caught and not propagated: it labelled HP:0031263 as
  "Crescentic glomerulonephritis" (that ID is actually "Abnormal renal corpuscle
  morphology"; the correct term is HP:0008653), and it gave HP:0003774 the stale
  label "End-stage renal disease" (current label is "Stage 5 chronic kidney
  disease").
has_subtypes:
- name: IgA Nephropathy
  display_name: IgA nephropathy (Berger disease)
  description: >-
    Mesangial deposition of galactose-deficient IgA1-containing immune complexes
    arising from mucosal immune dysregulation. Curated in full as the standalone
    dismech entry IgA_Nephropathy.
  subtype_term:
    preferred_term: IgA nephropathy
    term:
      id: MONDO:0005342
      label: IgA glomerulonephritis
- name: Membranous Nephropathy
  description: >-
    In-situ subepithelial immune-complex formation against podocyte surface
    antigens, chiefly PLA2R1 and THSD7A, presenting with nephrotic-range
    proteinuria rather than a nephritic picture. Curated in full as the standalone
    dismech entry Membranous_Nephropathy.
  subtype_term:
    preferred_term: Membranous nephropathy
    term:
      id: MONDO:0005376
      label: membranous glomerulonephritis
  evidence:
  - reference: PMID:35484394
    reference_title: "Membranous nephropathy: new pathogenic mechanisms and their clinical implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Membranous nephropathy (MN) is characterized histomorphologically by the
      presence of immune deposits in the subepithelial space of the glomerular
      filtration barrier; its clinical hallmarks are nephrotic range proteinuria
      with oedema.
    explanation: >-
      Establishes membranous nephropathy as a subepithelial immune-deposit lesion
      whose presentation is nephrotic rather than nephritic.
- name: Post-Streptococcal GN
  display_name: Acute post-streptococcal glomerulonephritis
  description: >-
    Acute infection-related immune-complex glomerulonephritis following group A
    streptococcal throat or skin infection, with streptococcal pyrogenic exotoxin
    B (SpeB) and nephritis-associated plasmin receptor (NAPlr) as the identified
    nephritogenic antigens.
  subtype_term:
    preferred_term: Acute poststreptococcal glomerulonephritis
    term:
      id: MONDO:0001870
      label: acute poststreptococcal glomerulonephritis
  evidence:
  - reference: PMID:39341789
    reference_title: "Mechanisms that potentially contribute to the development of post-streptococcal glomerulonephritis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Streptococcal pyrogenic exotoxin B and nephritis-associated plasmin
      receptor are identified nephritogenic antigens (nephritogens).
    explanation: >-
      Names the two established streptococcal nephritogens that initiate the
      post-streptococcal immune-complex lesion.
- name: Anti-GBM Disease
  display_name: Anti-glomerular basement membrane (Goodpasture) disease
  description: >-
    Directly pathogenic autoantibody against the NC1 domain of the alpha-3 chain
    of type IV collagen in the glomerular and alveolar basement membrane, causing
    widespread crescent formation with frequent alveolar hemorrhage. Curated in
    full as the standalone dismech entry Anti-GBM_Disease.
  subtype_term:
    preferred_term: Anti-glomerular basement membrane disease
    term:
      id: MONDO:0009303
      label: anti-glomerular basement membrane disease
  evidence:
  - reference: PMID:28515156
    reference_title: "Anti-Glomerular Basement Membrane Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It is an archetypic autoimmune disease, caused by the development of
      directly pathogenic autoantibodies targeting a well characterized
      autoantigen expressed in the basement membranes of these organs
    explanation: >-
      Establishes anti-GBM disease as a directly antibody-mediated basement
      membrane lesion, distinguishing it from immune-complex GN.
- name: ANCA-Associated GN
  display_name: ANCA-associated pauci-immune necrotizing crescentic GN
  description: >-
    Pauci-immune necrotizing and crescentic glomerulonephritis driven by
    anti-neutrophil cytoplasmic antibodies targeting proteinase-3 or
    myeloperoxidase, with little or no glomerular immunoglobulin deposition.
  subtype_term:
    preferred_term: Pauci-immune glomerulonephritis with ANCA
    term:
      id: MONDO:0019988
      label: pauci-immune glomerulonephritis with ANCA
  evidence:
  - reference: PMID:36109667
    reference_title: "Genetics of ANCA-associated vasculitis: role in pathogenesis, classification and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      that share features of pauci-immune small-vessel vasculitis and the
      positivity of ANCA targeting proteinase-3 (PR3-ANCA) or myeloperoxidase
      (MPO-ANCA)
    explanation: >-
      Defines the pauci-immune, ANCA-specificity-based character of this GN
      subtype.
- name: Membranoproliferative GN
  display_name: Membranoproliferative glomerulonephritis (including C3 glomerulopathy)
  description: >-
    Mesangial proliferation with capillary wall double contours on light
    microscopy. Divided by immunofluorescence into immune-complex-mediated MPGN
    and complement-mediated C3 glomerulopathy, the latter driven by uncontrolled
    alternative-pathway activation.
  subtype_term:
    preferred_term: Membranoproliferative glomerulonephritis
    term:
      id: MONDO:0002461
      label: membranoproliferative glomerulonephritis
  evidence:
  - reference: PMID:42284585
    reference_title: "C3 Glomerulopathy: recent advances and an update on management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      C3 glomerulopathy (C3G) is a clinicopathologic entity characterized by
      glomerular inflammation with dominant staining for C3 on immunofluorescence
      microscopy.
    explanation: >-
      Defines the complement-mediated arm of the membranoproliferative pattern by
      its C3-dominant immunofluorescence signature.
pathophysiology:
- name: Nephritogenic Antigen Exposure and Loss of Tolerance
  description: >-
    The initiating step is the appearance of a nephritogenic antigen-antibody
    pairing. This may be a foreign antigen from infection (streptococcal SpeB or
    NAPlr, hepatitis B or C, staphylococcal or endocarditis-associated antigen), a
    self antigen against which tolerance is lost (the alpha-3 chain of type IV
    collagen in anti-GBM disease, myeloperoxidase or proteinase-3 in ANCA disease,
    PLA2R1 in membranous nephropathy, nuclear antigens in lupus nephritis), or an
    aberrantly glycosylated self immunoglobulin (galactose-deficient IgA1). GN is
    correspondingly grouped by immunopathogenesis rather than by histological
    pattern, because the lesion pattern does not identify the cause.
  role: trigger
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: adaptive immune response
    term:
      id: GO:0002250
      label: adaptive immune response
    modifier: ABNORMAL
  - preferred_term: immunoglobulin production
    term:
      id: GO:0002377
      label: immunoglobulin production
  cell_types:
  - preferred_term: plasma cell
    term:
      id: CL:0000786
      label: plasma cell
  - preferred_term: B cell
    term:
      id: CL:0000236
      label: B cell
  evidence:
  - reference: PMID:36635359
    reference_title: "Glomerulonephritis: immunopathogenesis and immunotherapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These disorders are currently classified largely on the basis of
      histopathological lesion patterns, but these patterns do not align well
      with their diverse pathological mechanisms and hence do not inform optimal
      therapy.
    explanation: >-
      Supports modeling GN by initiating immunopathogenic mechanism rather than by
      histological lesion pattern.
  - reference: PMID:37764071
    reference_title: "Autoimmunity and Infection in Glomerular Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The mechanisms responsible range from the direct damage of glomerular cells
      to the formation and deposition of immunocomplexes to molecular mimicry to
      the secretion of superantigens.
    explanation: >-
      Enumerates the distinct routes by which an infectious trigger initiates
      glomerular injury, supporting a multi-route trigger node.
  downstream:
  - target: Glomerular Immune Complex Deposition
    causal_link_type: DIRECT
    description: >-
      Antigen-antibody complexes formed in the circulation or in situ localize
      within the glomerulus.
  - target: Anti-GBM Autoantibody Binding to Type IV Collagen
    causal_link_type: DIRECT
    description: >-
      Loss of tolerance to the alpha-3(IV)NC1 autoantigen yields directly
      pathogenic antibody that binds the basement membrane.
  - target: ANCA-Mediated Neutrophil Activation
    causal_link_type: DIRECT
    description: >-
      Autoantibody against myeloperoxidase or proteinase-3 activates primed
      neutrophils at the glomerular capillary.
  - target: Subepithelial Immune Deposition and Podocyte Injury
    causal_link_type: DIRECT
    description: >-
      Antibody against a podocyte surface antigen forms in-situ subepithelial
      deposits, the membranous/nephrotic arm.

- name: Glomerular Immune Complex Deposition
  description: >-
    Circulating immune complexes are trapped in the glomerulus, or complexes form
    in situ when antibody binds an antigen already planted in the capillary wall.
    Deposit location determines the clinical syndrome: mesangial and subendothelial
    deposits sit on the blood side of the basement membrane, where they are
    accessible to circulating inflammatory cells and produce a nephritic,
    proliferative lesion; subepithelial deposits are separated from the circulation
    by the basement membrane and instead injure the podocyte.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: mesangial cell
    term:
      id: CL:0000650
      label: mesangial cell
  - preferred_term: glomerular capillary endothelial cell
    term:
      id: CL:1001005
      label: glomerular capillary endothelial cell
  biological_processes:
  - preferred_term: immune complex clearance
    term:
      id: GO:0002434
      label: immune complex clearance
    modifier: DECREASED
  locations:
  - preferred_term: renal glomerulus
    term:
      id: UBERON:0000074
      label: renal glomerulus
  evidence:
  - reference: PMID:39341789
    reference_title: "Mechanisms that potentially contribute to the development of post-streptococcal glomerulonephritis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Deposition of circulating immune complexes or in situ formation of immune
      complexes in glomeruli, or both, results in glomerulonephritis.
    explanation: >-
      States both routes — circulating deposition and in-situ formation — by which
      immune complexes produce glomerulonephritis.
  downstream:
  - target: Complement Activation
    causal_link_type: DIRECT
    description: >-
      Deposited immunoglobulin fixes complement via the classical pathway.

- name: Anti-GBM Autoantibody Binding to Type IV Collagen
  description: >-
    In anti-GBM disease, autoantibody binds a conformational epitope on the
    non-collagenous (NC1) domain of the alpha-3 chain of type IV collagen, an
    antigen normally sequestered within the hexameric collagen network of the
    glomerular and alveolar basement membrane. Because the antibody engages a
    fixed structural antigen along the whole capillary wall, injury is
    near-simultaneous across all glomeruli, which is why this subtype so
    characteristically produces widespread crescents and rapidly progressive
    disease, frequently with concurrent alveolar hemorrhage.
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: antigen binding
    term:
      id: GO:0003823
      label: antigen binding
  locations:
  - preferred_term: glomerular basement membrane
    term:
      id: UBERON:0005777
      label: glomerular basement membrane
  evidence:
  - reference: PMID:28515156
    reference_title: "Anti-Glomerular Basement Membrane Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The majority of patients develop widespread glomerular crescent formation,
      presenting with features of rapidly progressive GN, and 40%-60% will have
      concurrent alveolar hemorrhage.
    explanation: >-
      Links the anti-GBM lesion to widespread crescent formation, RPGN, and
      pulmonary involvement.
  downstream:
  - target: Complement Activation
    causal_link_type: DIRECT
    description: >-
      Basement-membrane-bound IgG fixes complement along the capillary wall.
  - target: Glomerular Capillary Wall Injury and Necrosis
    causal_link_type: DIRECT
    description: >-
      Direct antibody-mediated injury to the basement membrane breaches the
      capillary wall.

- name: ANCA-Mediated Neutrophil Activation
  description: >-
    In pauci-immune GN, cytokine-primed neutrophils translocate myeloperoxidase
    and proteinase-3 to their surface, where circulating ANCA engages them and
    triggers full activation: adhesion to the glomerular endothelium, respiratory
    burst, degranulation, and release of neutrophil extracellular traps. Because
    injury is delivered by the activated neutrophil rather than by deposited
    complexes, immunofluorescence shows little or no immunoglobulin — the defining
    "pauci-immune" feature. Complement, particularly the C5a-C5aR axis, amplifies
    the priming loop and is the target of avacopan.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  biological_processes:
  - preferred_term: neutrophil activation
    term:
      id: GO:0042119
      label: neutrophil activation
    modifier: INCREASED
  - preferred_term: neutrophil degranulation
    term:
      id: GO:0043312
      label: neutrophil degranulation
    modifier: INCREASED
  - preferred_term: neutrophil extracellular trap formation
    term:
      id: GO:0140645
      label: neutrophil extracellular trap formation
    modifier: INCREASED
  evidence:
  - reference: PMID:36109667
    reference_title: "Genetics of ANCA-associated vasculitis: role in pathogenesis, classification and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In patients with GPA and MPA, the genetic associations are stronger with
      ANCA specificity (PR3- versus MPO-ANCA) than with the clinical diagnosis
    explanation: >-
      Supports ANCA specificity, rather than clinical syndrome label, as the
      mechanistically meaningful axis of this arm.
  downstream:
  - target: Glomerular Capillary Wall Injury and Necrosis
    causal_link_type: DIRECT
    description: >-
      Neutrophil oxidants and granule proteases produce fibrinoid necrosis of the
      capillary tuft.

- name: Alternative Pathway Complement Dysregulation
  description: >-
    In C3 glomerulopathy the fluid-phase alternative pathway escapes regulation,
    through acquired autoantibodies such as C3 nephritic factor that stabilize the
    C3 convertase, or through rare variants in complement genes (C3, CFH, CFI,
    CFB, CD46, CFHR1, CFHR5, DGKE). Continuous C3 turnover deposits C3 fragments
    in the glomerulus without accompanying immunoglobulin, giving the C3-dominant
    immunofluorescence pattern that defines the entity. This is an
    autoinflammatory route into GN: no adaptive antigen-antibody pairing is
    required.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: complement activation, alternative pathway
    term:
      id: GO:0006957
      label: complement activation, alternative pathway
    modifier: INCREASED
  evidence:
  - reference: PMID:20301598
    reference_title: "C3 Glomerulopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      C3 glomerulopathy (C3G) is a complex ultra-rare complement-mediated renal
      disease caused by uncontrolled activation of the complement alternative
      pathway (AP) in the fluid phase
    explanation: >-
      Establishes uncontrolled fluid-phase alternative-pathway activation as the
      causal mechanism of the complement-mediated arm.
  downstream:
  - target: Complement Activation
    causal_link_type: DIRECT
    description: >-
      Unregulated convertase activity drives sustained C3 cleavage and glomerular
      C3 deposition.

- name: Complement Activation
  description: >-
    Complement is the principal amplifier converting antibody or convertase
    deposition into tissue injury. Classical-pathway activation by deposited IgG
    or IgM, lectin-pathway activation, and alternative-pathway amplification all
    converge on C3 cleavage, generating the anaphylatoxins C3a and C5a and the
    C5b-9 membrane attack complex. C5a is a potent neutrophil chemoattractant and
    primer; C5b-9 injures glomerular cells sublytically. Consumption of complement
    is clinically visible as a depressed serum C3 in post-infectious GN, C3
    glomerulopathy, and lupus nephritis.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: complement activation
    term:
      id: GO:0006956
      label: complement activation
    modifier: INCREASED
  - preferred_term: complement activation, classical pathway
    term:
      id: GO:0006958
      label: complement activation, classical pathway
    modifier: INCREASED
  evidence:
  - reference: PMID:20301598
    reference_title: "C3 Glomerulopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Individuals with C3G typically present with hematuria, proteinuria,
      hematuria and proteinuria, acute nephritic syndrome or nephrotic syndrome,
      and low levels of the complement component C3.
    explanation: >-
      Links complement consumption to the measurable low serum C3 and to the
      nephritic presentation.
  downstream:
  - target: Leukocyte Recruitment and Glomerular Inflammation
    causal_link_type: DIRECT
    description: >-
      C3a and C5a recruit and prime neutrophils and monocytes at the glomerulus.

- name: Leukocyte Recruitment and Glomerular Inflammation
  description: >-
    Complement fragments, Fc-receptor engagement on deposited complexes, and
    activated resident glomerular cells recruit neutrophils and monocytes into the
    capillary tuft and mesangium. Infiltrating and resident cells release
    cytokines, chemokines, reactive oxygen species, and proteases. Effector CD4 T
    cell (Th1/Th17) and CD8 T cell responses contribute substantially to the
    severe crescentic phenotype. Mesangial and endothelial cells proliferate,
    producing the endocapillary and mesangial hypercellularity seen on biopsy.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  - preferred_term: CD4-positive T cell
    term:
      id: CL:0000624
      label: CD4-positive, alpha-beta T cell
  - preferred_term: CD8-positive T cell
    term:
      id: CL:0000625
      label: CD8-positive, alpha-beta T cell
  biological_processes:
  - preferred_term: leukocyte migration
    term:
      id: GO:0050900
      label: leukocyte migration
    modifier: INCREASED
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  evidence:
  - reference: PMID:39300109
    reference_title: "Immune profiling-based targeting of pathogenic T cells with ustekinumab in ANCA-associated glomerulonephritis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Immune profiling-based targeting of pathogenic T cells with ustekinumab in
      ANCA-associated glomerulonephritis.
    explanation: >-
      Title-level support that pathogenic T cells are an identified,
      therapeutically addressable component of the glomerular infiltrate in
      ANCA-associated GN; marked PARTIAL because it is specific to that subtype
      rather than to GN generally.
  downstream:
  - target: Glomerular Capillary Wall Injury and Necrosis
    causal_link_type: DIRECT
    description: >-
      Leukocyte-derived oxidants and proteases damage the endothelium and basement
      membrane.

- name: Glomerular Capillary Wall Injury and Necrosis
  description: >-
    The converging effector mechanisms damage the three-layered filtration
    barrier. Endothelial injury and basement membrane degradation breach the
    capillary wall, allowing erythrocytes to escape into the urinary space — the
    dysmorphic hematuria and red cell casts that define a glomerular bleeding
    source — and permitting protein leak. In severe necrotizing disease, fibrinoid
    necrosis and frank rupture of the capillary wall spill fibrin and plasma
    proteins into Bowman's space.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: glomerular capillary endothelial cell
    term:
      id: CL:1001005
      label: glomerular capillary endothelial cell
  biological_processes:
  - preferred_term: glomerular filtration
    term:
      id: GO:0003094
      label: glomerular filtration
    modifier: ABNORMAL
  locations:
  - preferred_term: glomerular basement membrane
    term:
      id: UBERON:0005777
      label: glomerular basement membrane
  evidence:
  - reference: PMID:36635359
    reference_title: "Glomerulonephritis: immunopathogenesis and immunotherapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      'Glomerulonephritis' (GN) is a term used to describe a group of
      heterogeneous immune-mediated disorders characterized by inflammation of the
      filtration units of the kidney (the glomeruli).
    explanation: >-
      Establishes inflammatory injury of the glomerular filtration unit as the
      defining lesion shared across GN.
  downstream:
  - target: Crescent Formation
    causal_link_type: DIRECT
    description: >-
      Capillary wall rupture spills fibrin and plasma into Bowman's space,
      triggering parietal epithelial proliferation.
  - target: Hematuria
    causal_link_type: DIRECT
    description: >-
      Breaches in the capillary wall allow erythrocytes to enter the urinary
      space.
  - target: Proteinuria
    causal_link_type: DIRECT
    description: >-
      Loss of barrier integrity permits protein leak into the filtrate.
  - target: Decreased glomerular filtration rate
    causal_link_type: DIRECT
    description: >-
      Inflammatory occlusion of the capillary tuft reduces filtration surface.

- name: Subepithelial Immune Deposition and Podocyte Injury
  description: >-
    The nephrotic arm of GN, exemplified by membranous nephropathy. Antibody
    against a podocyte surface antigen (PLA2R1, THSD7A, and a growing list of
    minor antigens) forms immune deposits in the subepithelial space. Because the
    basement membrane separates these deposits from the circulation, circulating
    leukocytes are not recruited and the lesion is not inflammatory; instead,
    locally generated C5b-9 injures the podocyte, disorganizing its actin
    cytoskeleton. The consequence is nephrotic-range proteinuria without the
    hematuria-dominant nephritic picture. This node is the point of contact with
    the conserved podocytopathy module.
  biological_scale: CELLULAR
  conforms_to: "nephrotic_podocyte_injury#Podocyte Injury"
  cell_types:
  - preferred_term: podocyte
    term:
      id: CL:0000653
      label: podocyte
  biological_processes:
  - preferred_term: actin cytoskeleton organization
    term:
      id: GO:0030036
      label: actin cytoskeleton organization
    modifier: ABNORMAL
  evidence:
  - reference: PMID:35484394
    reference_title: "Membranous nephropathy: new pathogenic mechanisms and their clinical implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In patients with primary MN, autoimmunity is driven by circulating
      autoantibodies that bind to one or more antigens on the surface of
      glomerular podocytes.
    explanation: >-
      Establishes the podocyte as the direct antibody target in this arm,
      justifying conformance to the podocyte-injury module rather than to the
      nephritic inflammatory chain.
  - reference: PMID:35484394
    reference_title: "Membranous nephropathy: new pathogenic mechanisms and their clinical implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the discovery of pathogenic circulating autoantibodies against phospholipase
      A2 receptor 1 (PLA2R1) and thrombospondin type 1 domain-containing protein
      7A (THSD7A)
    explanation: >-
      Names the two established podocyte autoantigens of primary membranous
      nephropathy.
  downstream:
  - target: Proteinuria
    causal_link_type: DIRECT
    description: >-
      Podocyte injury and foot process effacement break the size-selective
      filtration barrier.

- name: Crescent Formation
  description: >-
    Where the capillary wall has ruptured, fibrin, plasma proteins, and
    inflammatory cells enter Bowman's space and drive proliferation of parietal
    epithelial cells, with recruited macrophages, into the characteristic
    crescent. Crescents are the histological correlate of rapidly progressive
    glomerulonephritis: they compress the tuft, obliterate Bowman's space, and, if
    they organize into fibrous crescents, render the glomerulus irrecoverable.
    Crescentic disease is the shared severe endpoint of anti-GBM disease,
    ANCA-associated GN, and severe immune-complex GN, and is what makes prompt
    immunosuppression time-critical.

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Close monitoring of renal function by a nephrologist with familiarity with
      the C3G disease spectrum, complete biannual assessment of the complement
      pathway, periodic eye examinations to evaluate the fundus.
    explanation: >-
      GeneReviews Surveillance schedule, the source for the monitoring
      components curated here.

- name: Nephron Loss and Progressive Kidney Failure
  description: >-
    Glomeruli that are not repaired sclerose. Loss of filtering units imposes
    hyperfiltration on those remaining, and persistent proteinuria drives
    tubulointerstitial inflammation and fibrosis. The result is progressive
    nephron loss and chronic kidney disease, which for a substantial minority of
    patients ends in kidney failure requiring dialysis or transplantation. This
    convergent endpoint is why glomerulonephritis collectively accounts for a
    large share of the global chronic kidney disease burden.

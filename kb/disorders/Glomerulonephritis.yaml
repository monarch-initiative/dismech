  name: Hematuria
  description: >-
    Glomerular bleeding through breaches in the capillary wall. Characteristically
    the red cells are dysmorphic and accompanied by red cell casts formed in the
    tubule, which together localize the bleeding to the glomerulus. May be
    microscopic or macroscopic; in IgA nephropathy visible hematuria classically
    occurs synchronously with a mucosal infection.
  phenotype_term:
    preferred_term: Hematuria
    term:
      id: HP:0000790
      label: Hematuria
  evidence:

    snippet: >-
      Chromosome 2q24 contains the gene encoding M-type phospholipase A(2)
      receptor (PLA(2)R1) (SNP rs4664308, P=8.6×10(-29)), previously shown to be
      the target of an autoimmune response.
    explanation: >-

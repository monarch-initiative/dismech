      hematuria and proteinuria, acute nephritic syndrome or nephrotic syndrome,
      and low levels of the complement component C3.
    explanation: >-
      Documents hematuria as a presenting feature of glomerulonephritis.
- category: Laboratory
  name: Proteinuria
  description: >-
    Protein leak across the damaged filtration barrier, ranging from modest
    amounts in proliferative nephritic lesions to nephrotic-range proteinuria when
    the podocyte is the primary target. Proteinuria is both the main prognostic
    marker and the principal treatment response endpoint across GN subtypes.

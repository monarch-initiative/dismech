inheritance:
- name: Autosomal dominant
  description: >-
    HNRNPU-NDD is expressed in an autosomal dominant manner and is typically caused
    by a de novo variant, so recurrence risk to siblings is low. Presumed parental
    germline mosaicism has been reported in one family with two affected siblings,
    which is why the risk is low rather than negligible.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:35274911
    reference_title: "HNRNPU-Related Neurodevelopmental Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "HNRNPU-NDD is expressed in an autosomal dominant manner and typically caused by a de novo HNRNPU pathogenic variant."
    explanation: >-
      GeneReviews states the inheritance mode and the de novo origin.
  - reference: PMID:35274911
    reference_title: "HNRNPU-Related Neurodevelopmental Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Presumed parental germline mosaicism has been reported in one family with two affected sibs."
    explanation: >-
      The documented exception that keeps recurrence risk above zero.

pathophysiology:
- name: Heterozygous HNRNPU Loss-of-Function Lesion
  biological_scale: MOLECULAR
  description: >-
    A de novo heterozygous loss-of-function point variant in HNRNPU, or a 1q44
    microdeletion encompassing the gene, is present. Both routes reduce HNRNPU to a
    single functional copy, which is the starting point this node records - but they
    are not the same lesion, because a 1q44 deletion also removes AKT3 and ZBTB18
    (see the genetic section). This node records the HNRNPU lesion only, not its
    consequences.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:35864088
    reference_title: "Heterogeneous nuclear ribonucleoprotein U (HNRNPU) safeguards the developing mouse cortex."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Microdeletions in the 1q44 locus encompassing HNRNPU and other genes and point mutations in HNRNPU cause brain disorders, including early-onset seizures and severe intellectual disability."
    explanation: >-
      Establishes both lesion types as causes of the same clinical picture.
  - reference: PMID:36594023
    reference_title: "Evidence of shared transcriptomic dysregulation of HNRNPU-related disorder between human organoids and embryonic mice."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "De novo loss-of-function variants in HNRNPU have been found to cause a neurodevelopmental syndrome"
    explanation: >-
      Confirms the de novo loss-of-function mechanism.
  downstream:
  - target: Reduced hnRNP U Protein Dose
    causal_link_type: DIRECT
    description: >-
      One functional allele produces roughly half the normal protein.

- name: Reduced hnRNP U Protein Dose
  biological_scale: MOLECULAR
  description: >-
    Haploinsufficiency for an abundant, ubiquitously expressed nuclear protein.
    Because hnRNP U is required for mammalian development - complete knockout mice
    die early - the disease is specifically a dose problem rather than an absence
    problem, and the relevant question is which of its several functions are most
    dose-sensitive.
  evidence:
  - reference: PMID:35864088
    reference_title: "Heterogeneous nuclear ribonucleoprotein U (HNRNPU) safeguards the developing mouse cortex."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "HNRNPU is critical in mammalian development, and knockout mice exhibit early lethality"
    explanation: >-
      Establishes that complete loss is lethal, so human disease is a partial-dose
      state.
  downstream:
  - target: Disrupted Alternative Splicing Program
    causal_link_type: DIRECT
    description: >-
      hnRNP U participates directly in spliceosomal RNA processing.
  - target: Destabilized SAF-A/RNA Nuclear Mesh and Chromatin Architecture
    causal_link_type: DIRECT
    description: >-
      hnRNP U oligomerises with RNA to form the nuclear mesh that organizes
      chromatin; this is a separate function from splicing.

- name: Disrupted Alternative Splicing Program
  biological_scale: MOLECULAR
  description: >-
    Expression and alternative splicing of many genes are altered, with the
    affected transcripts concentrated in cell survival, cell motility, and synapse
    formation. This is the post-transcriptional arm.
  biological_processes:
  - preferred_term: regulation of alternative mRNA splicing, via spliceosome
    term:
      id: GO:0000381
      label: regulation of alternative mRNA splicing, via spliceosome
    modifier: ABNORMAL
  evidence:
  - reference: PMID:35864088
    reference_title: "Heterogeneous nuclear ribonucleoprotein U (HNRNPU) safeguards the developing mouse cortex."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "expression and alternative splicing of multiple genes involved in cell survival, cell motility, and synapse formation are affected following Hnrnpu's conditional truncation"
    explanation: >-
      Names the splicing consequence and the functional categories affected.
  downstream:
  - target: Neural Progenitor Cell Death
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Mis-splicing of cell-survival regulators precedes the death of progenitors,
      and the pharmacological rescue data support a causal rather than incidental
      link.
  - target: Impaired Radial Neuronal Migration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Mis-splicing of cell-motility regulators accompanies the migration defect.

- name: Destabilized SAF-A/RNA Nuclear Mesh and Chromatin Architecture
  biological_scale: MOLECULAR
  description: >-
    hnRNP U oligomerises in an ATP-dependent manner and binds RNA to form a dynamic
    nuclear mesh that regulates chromatin organization in interphase and mitosis.
    Reduced protein destabilizes that mesh. Nothing in a splicing assay measures
    this arm, which is why it is modeled separately.
  biological_processes:
  - preferred_term: chromatin organization
    term:
      id: GO:0006325
      label: chromatin organization
    modifier: ABNORMAL
  evidence:
  - reference: PMID:34823151
    reference_title: "The role of SAF-A/hnRNP U in regulating chromatin structure."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "SAF-A can oligomerise in an ATP-dependent manner and interact with RNA to form a dynamic nuclear mesh."
    explanation: >-
      States the oligomerisation and mesh-formation function that reduced protein
      dose compromises.
  downstream:
  - target: Widespread Transcriptional Dysregulation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Altered chromatin architecture is one proposed route to the observed
      transcriptional changes, though the mechanism is not established.

- name: Widespread Transcriptional Dysregulation
  biological_scale: CELLULAR
  description: >-
    Transcriptome-wide changes across functionally relevant pathways. The
    dysregulation is notable for being broad but individually modest rather than
    a small number of large effects, which is why no single downstream gene
    explains the phenotype.
  biological_processes:
  - preferred_term: regulation of DNA-templated transcription
    term:
      id: GO:0006355
      label: regulation of DNA-templated transcription
    modifier: ABNORMAL
  evidence:
  - reference: PMID:36594023
    reference_title: "Evidence of shared transcriptomic dysregulation of HNRNPU-related disorder between human organoids and embryonic mice."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We identified widespread dysregulation in functionally relevant pathways"
    explanation: >-
      Documents the breadth of transcriptional dysregulation in a human model.
  downstream:
  - target: Impaired Synapse Formation and Circuit Maturation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Dysregulation of synaptic transcripts is proposed to degrade circuit assembly.

- name: Neural Progenitor Cell Death
  biological_scale: CELLULAR
  description: >-
    Loss of HNRNPU function causes rapid cell death of both postmitotic neurons and
    neural progenitors, with progenitors apparently the more sensitive population.
    This differential vulnerability matters: it means the lesion subtracts cells
    that would each have produced many neurons, not just the cells directly lost.
  cell_types:
  - preferred_term: neural progenitor cell
    term:
      id: CL:0011020
      label: neural progenitor cell
  biological_processes:
  - preferred_term: apoptotic process
    term:
      id: GO:0006915
      label: apoptotic process
    modifier: INCREASED
  evidence:
  - reference: PMID:35864088
    reference_title: "Heterogeneous nuclear ribonucleoprotein U (HNRNPU) safeguards the developing mouse cortex."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "HNRNPU loss of function leads to rapid cell death of both postmitotic neurons and neural progenitors, with an apparent higher sensitivity of the latter"
    explanation: >-
      Reports the cell death and the progenitor-selective vulnerability.
  - reference: PMID:35864088
    reference_title: "Heterogeneous nuclear ribonucleoprotein U (HNRNPU) safeguards the developing mouse cortex."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We suppressed cell death by pan-Caspase inhibitors, p53 inhibitors, and necroptosis inhibitors, demonstrating the involvement of p53-dependent canonical and noncanonical death mechanisms in neural progenitors"
    explanation: >-
      Identifies the death mechanism as p53-dependent through both canonical and
      non-canonical routes, established by pharmacological suppression rather than
      correlation.
  - reference: PMID:35864088
    reference_title: "Heterogeneous nuclear ribonucleoprotein U (HNRNPU) safeguards the developing mouse cortex."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We showed that reducing the levels of the splicing factor SRSF3 opposes HNRNPU’s loss of function effects and improves neural progenitors’ viability and neuronal migration"
    explanation: >-
      Lowering the competing splicing factor SRSF3 rescues progenitor viability and
      migration, which ties the death back to the splicing arm specifically.
  - reference: PMID:36594023
    reference_title: "Evidence of shared transcriptomic dysregulation of HNRNPU-related disorder between human organoids and embryonic mice."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we performed compositional analyses and identified significant reductions in progenitor populations"
    explanation: >-
      The same endpoint measured in heterozygous human organoids rather than in the
      mouse truncation.
  downstream:
  - target: Loss of Cortical Structure
    causal_link_type: DIRECT
    description: >-
      Depleting the progenitor pool removes the cells that build the cortex.

- name: Impaired Radial Neuronal Migration
  biological_scale: CELLULAR
  description: >-
    Neurons that survive migrate abnormally along the radial axis. This is a
    positioning defect distinct from the cell-death arm, and it is separately
    rescuable in the model.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:35864088
    reference_title: "Heterogeneous nuclear ribonucleoprotein U (HNRNPU) safeguards the developing mouse cortex."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "ameliorate radial neuronal migration defects"
    explanation: >-
      The rescue experiments identify radial migration as a separately measurable
      and separately correctable defect.
  downstream:
  - target: Loss of Cortical Structure
    causal_link_type: DIRECT
    description: >-
      Mispositioned neurons contribute to disturbed cortical architecture.

- name: Loss of Cortical Structure
  biological_scale: TISSUE
  description: >-
    Cortical structures are lost in the mutant embryonic brain. In the mouse
    conditional knockout this is severe; the human heterozygous condition produces
    the much milder nonspecific findings seen on MRI, so this node represents the
    same process at a different dose.
  biological_processes:
  - preferred_term: cell population proliferation
    term:
      id: GO:0008283
      label: cell population proliferation
    modifier: DECREASED
  evidence:
  - reference: PMID:35864088
    reference_title: "Heterogeneous nuclear ribonucleoprotein U (HNRNPU) safeguards the developing mouse cortex."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "we identified pharmaceutical and genetic agents that can partially reverse the loss of cortical structures in Hnrnpu mutated embryonic brains"
    explanation: >-
      Names the loss of cortical structures as the tissue-level outcome.
  downstream:
  - target: Impaired Synapse Formation and Circuit Maturation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      A structurally compromised cortex assembles circuits abnormally.

- name: Impaired Synapse Formation and Circuit Maturation
  biological_scale: TISSUE
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Ion Channel and Synaptic Dysfunction"
  description: >-
    Synapse formation is among the functional categories whose genes are
    mis-spliced, and the resulting circuits mature abnormally. This is the
    synaptic-level convergence point for the splicing, transcriptional, and
    structural arms.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:35864088
    reference_title: "Heterogeneous nuclear ribonucleoprotein U (HNRNPU) safeguards the developing mouse cortex."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "expression and alternative splicing of multiple genes involved in cell survival, cell motility, and synapse formation are affected"
    explanation: >-
      Names synapse formation among the affected functional categories.
  downstream:
  - target: Cortical Network Hyperexcitability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Abnormally assembled circuits are epileptogenic, though the specific
      excitatory-inhibitory imbalance has not been characterized in this disorder.
  - target: Developmental Delay and Intellectual Disability
    causal_link_type: DIRECT
    description: >-
      Disturbed circuit maturation underlies the cognitive phenotype.

- name: Cortical Network Hyperexcitability
  biological_scale: TISSUE
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Neuronal Hyperexcitability and Hypersynchrony"
  description: >-
    Cortical networks become seizure-prone. In patients this is inferred from the
    clinical seizure frequency rather than measured directly; no electrophysiological
    characterization of the human excitatory-inhibitory balance in this disorder has
    been published. The direct excitability measurement comes instead from the
    dose-matched heterozygous mouse, in which the threshold for electrically evoked
    seizures is significantly reduced.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:36594023
    reference_title: "Evidence of shared transcriptomic dysregulation of HNRNPU-related disorder between human organoids and embryonic mice."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "with patients exhibiting developmental delay (∼95%), intellectual disability (52%), craniofacial dysmorphism (54–95%) including microcephaly (14–20%) and seizures (83–95%)"
    explanation: >-
      Establishes the very high seizure frequency that this node accounts for.
  - reference: PMID:37782669
    reference_title: "Neurodevelopmental deficits and cell-type-specific transcriptomic perturbations in a mouse model of HNRNPU haploinsufficiency."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Hnrnpu+/113DEL mice demonstrated a significantly lower threshold for induction of maximal tonic hindlimb extension seizures, consistent with a greater seizure predisposition"
    explanation: >-
      The one direct excitability measurement available at the human gene dose: a
      lowered evoked-seizure threshold is the operational definition of network
      hyperexcitability this node asserts.
  downstream:
  - target: Recurrent Seizures
    causal_link_type: DIRECT
    description: >-
      A hyperexcitable cortex generates recurrent seizures.

- name: Recurrent Seizures
  biological_scale: ORGANISM
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Recurrent Unprovoked Seizures"
  description: >-
    Seizures affect 83-95% of individuals, most commonly tonic-clonic or absence,
    and may be refractory to treatment.
  evidence:
  - reference: PMID:35274911
    reference_title: "HNRNPU-Related Neurodevelopmental Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Affected individuals are likely to experience seizures (most commonly tonic-clonic or absence) that may be refractory to treatment."
    explanation: >-
      GeneReviews gives the seizure semiology and refractoriness.
  downstream:
  - target: Developmental Delay and Intellectual Disability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Seizure burden plausibly compounds the developmental phenotype, which the
      splicing and structural arms already produce independently.

- name: Developmental Delay and Intellectual Disability
  biological_scale: ORGANISM
  description: >-
    Developmental delay in around 95% of individuals and intellectual disability -
    typically moderate to severe - with speech and language delay or absent speech.
    Two upstream routes converge here, the developmental lesion and the seizure
    burden, and the published data do not separate their contributions.
  evidence:
  - reference: PMID:35274911
    reference_title: "HNRNPU-Related Neurodevelopmental Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "HNRNPU-related neurodevelopmental disorder (HNRNPU-NDD) is characterized by developmental delay and intellectual disability"
    explanation: >-
      GeneReviews defines the core developmental phenotype.


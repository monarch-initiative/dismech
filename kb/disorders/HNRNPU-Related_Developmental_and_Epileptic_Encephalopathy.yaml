name: HNRNPU-Related Developmental and Epileptic Encephalopathy
creation_date: "2026-08-19T00:00:00Z"
category: Mendelian
synonyms:
- DEE54
- EIEE54
- HNRNPU-related neurodevelopmental disorder
- HNRNPU-NDD
- developmental and epileptic encephalopathy 54
description: >-
  HNRNPU-related developmental and epileptic encephalopathy (DEE54) is an
  autosomal dominant neurodevelopmental disorder caused by de novo heterozygous
  loss-of-function variants in HNRNPU, or by 1q44 microdeletions encompassing it.
  HNRNPU encodes heterogeneous nuclear ribonucleoprotein U, also called scaffold
  attachment factor A - an abundant nuclear RNA- and DNA-binding protein that
  oligomerises with RNA into a dynamic nuclear mesh and so acts as a bridge
  between chromatin, nascent transcripts, and the nuclear matrix. It is therefore
  not a channel, receptor, or enzyme of any single pathway: halving its dose
  perturbs alternative splicing, chromatin architecture, and transcription at
  once, and the disease phenotype is what emerges from that diffuse perturbation
  rather than from one broken step. Affected individuals have developmental delay
  in around 95% of cases and seizures in 83-95%, with intellectual disability,
  craniofacial dysmorphism, hypotonia, and nonspecific brain MRI findings
  including ventriculomegaly and a thin corpus callosum. Seizures are commonly
  tonic-clonic or absence and may be refractory.

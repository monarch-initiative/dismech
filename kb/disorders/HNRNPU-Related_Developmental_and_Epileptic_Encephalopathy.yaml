animal_models:
- name: Hnrnpu conditional cortical knockout mouse
  species: Mouse
  genotype: Hnrnpu conditional truncation in embryonic cortical neuroepithelium
  publication: PMID:35864088
  description: >-
    Conditional truncation of Hnrnpu in the developing cortex causes rapid death of
    neural progenitors and postmitotic neurons, radial migration defects, and loss
    of cortical structures, each partially reversible with pharmacological or
    genetic intervention.
  modeled_mechanisms:
  - target: Neural Progenitor Cell Death
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Provides the direct evidence for progenitor-selective cell death and, through
      the rescue experiments, for its causal role in the cortical phenotype.
    limitations: >-
      This is a conditional truncation removing HNRNPU function outright, whereas
      human disease is heterozygous loss of function; complete Hnrnpu knockout is
      embryonic lethal in mice, so the model sits at a far more severe point on the
      dose-response curve than any human genotype and produces near-complete cortical
      loss rather than the nonspecific MRI findings seen in patients.
    readouts:
    - name: Neural progenitor viability after Cre-mediated truncation
      target: Neural Progenitor Cell Death
      direction: DECREASED
      interpretation: >-
        Progenitors die rapidly and more readily than postmitotic neurons.
      evidence:
      - reference: PMID:35864088
        reference_title: "Heterogeneous nuclear ribonucleoprotein U (HNRNPU) safeguards the developing mouse cortex."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "HNRNPU loss of function leads to rapid cell death of both postmitotic neurons and neural progenitors, with an apparent higher sensitivity of the latter"
        explanation: >-
          Reports the viability measurement behind this readout.
    - name: Cortical structure after rescue intervention
      target: Neural Progenitor Cell Death
      direction: RESTORED
      interpretation: >-
        Pharmacological and genetic agents partially reverse the cortical loss,
        supporting cell death as its cause rather than a correlate.
      evidence:
      - reference: PMID:35864088
        reference_title: "Heterogeneous nuclear ribonucleoprotein U (HNRNPU) safeguards the developing mouse cortex."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "we identified pharmaceutical and genetic agents that can partially reverse the loss of cortical structures in Hnrnpu mutated embryonic brains, ameliorate radial neuronal migration defects and rescue cultured neural progenitors' cell death"
        explanation: >-
          Reports the rescue result behind this readout.
    evidence:
    - reference: PMID:35864088
      reference_title: "Heterogeneous nuclear ribonucleoprotein U (HNRNPU) safeguards the developing mouse cortex."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We aimed to understand HNRNPU's roles in the developing brain."
      explanation: >-
        Establishes the model's purpose as characterizing HNRNPU in cortical
        development.

- name: Hnrnpu+/113DEL heterozygous mouse
  species: Mouse
  genotype: Hnrnpu heterozygous 113-bp out-of-frame exon 1 deletion (Hnrnpu+/113DEL)
  publication: PMID:37782669
  description: >-
    A CRISPR-induced constitutive heterozygous truncating deletion in exon 1 of mouse
    Hnrnpu, targeting the region where at least five human patient truncating variants
    fall. This is the dose-matched counterpart of the conditional cortical knockout
    above: it models the human genotype rather than complete loss of function, and it
    is informative as much for what it fails to reproduce as for what it does.
  modeled_mechanisms:
  - target: Cortical Network Hyperexcitability
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Supplies the only direct excitability measurement at the human gene dose. The
      lowered electroconvulsive threshold is a measurement of network excitability
      rather than an inference from seizure counts, which is what the patient
      evidence on this node otherwise rests on.
    limitations: >-
      Excitability is measured as susceptibility to an electrically evoked seizure,
      not as spontaneous epileptiform activity, so it establishes a lowered seizure
      threshold rather than the ongoing hyperexcitable state patients are presumed to
      carry. The model also under-represents the human lesion: cortical hnRNP U falls
      by only about 20-26% rather than the expected half, which the authors read as
      evidence of compensation, so the measured effect is likely a floor.
    readouts:
    - name: Maximal seizure electroconvulsive threshold
      target: Cortical Network Hyperexcitability
      direction: DECREASED
      interpretation: >-
        Less current is required to evoke a maximal tonic hindlimb extension seizure
        in heterozygous mutants than in wild-type littermates.
      evidence:
      - reference: PMID:37782669
        reference_title: "Neurodevelopmental deficits and cell-type-specific transcriptomic perturbations in a mouse model of HNRNPU haploinsufficiency."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Hnrnpu+/113DEL mice demonstrated a significantly lower threshold for induction of maximal tonic hindlimb extension seizures, consistent with a greater seizure predisposition"
        explanation: >-
          Reports the threshold measurement behind this readout.
      - reference: PMID:37782669
        reference_title: "Neurodevelopmental deficits and cell-type-specific transcriptomic perturbations in a mouse model of HNRNPU haploinsufficiency."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "In epilepsy mouse models, neuronal hyperexcitability can also manifest as greater susceptibility to induced seizure events"
        explanation: >-
          States the assay's interpretive basis, which is why a threshold shift is
          read here as network hyperexcitability.
    evidence:
    - reference: PMID:37782669
      reference_title: "Neurodevelopmental deficits and cell-type-specific transcriptomic perturbations in a mouse model of HNRNPU haploinsufficiency."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Heterozygous mutants demonstrated global developmental delay, impaired ultrasonic vocalizations, cognitive dysfunction and increased seizure susceptibility, thus modeling aspects of the human disease."
      explanation: >-
        Establishes the model as informative for the seizure arm, in the authors' own
        deliberately partial phrasing.
  - target: Recurrent Seizures
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      The clinical endpoint does not appear. Patients have seizures in 83-95% of
      cases, but the dose-matched mouse never develops spontaneous ones - only a
      lowered threshold for evoked seizures. The model reproduces seizure
      susceptibility, not epilepsy.
    limitations: >-
      This is a substantive negative result, not an unexamined gap: over 300 hours of
      video EEG in adults found no spontaneous epileptiform activity, and no
      seizure-like behaviour was seen in routine handling at any age. The likeliest
      reasons are the shortfall in Hnrnpu reduction noted above and species
      differences in seizure threshold, but neither has been tested, so this link
      should not be read as evidence against the human mechanism.
    readouts:
    - name: Spontaneous epileptiform activity on video EEG
      target: Recurrent Seizures
      direction: UNCHANGED
      interpretation: >-
        No spontaneous generalized epileptiform activity was detected in heterozygous
        adults despite extended recording.
      evidence:
      - reference: PMID:37782669
        reference_title: "Neurodevelopmental deficits and cell-type-specific transcriptomic perturbations in a mouse model of HNRNPU haploinsufficiency."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Despite over 300 total hours of video EEG recordings among Hnrnpu+/113DEL adults, there was no evidence of spontaneous generalized epileptiform activity"
        explanation: >-
          The negative EEG result behind this readout, and the reason the link is
          typed as a failure to recapitulate.
      - reference: PMID:37782669
        reference_title: "Neurodevelopmental deficits and cell-type-specific transcriptomic perturbations in a mouse model of HNRNPU haploinsufficiency."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "no spontaneous seizure-like behaviors or sudden death were observed following routine handling of this mouse line at any age"
        explanation: >-
          Confirms the negative result behaviourally as well as electrographically,
          and across the lifespan rather than only in the recorded adults.
    evidence:
    - reference: PMID:37782669
      reference_title: "Neurodevelopmental deficits and cell-type-specific transcriptomic perturbations in a mouse model of HNRNPU haploinsufficiency."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Despite over 300 total hours of video EEG recordings among Hnrnpu+/113DEL adults, there was no evidence of spontaneous generalized epileptiform activity"
      explanation: >-
        Substantiates treating this model as uninformative for the spontaneous-seizure
        endpoint.
  - target: Loss of Cortical Structure
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      No gross cortical phenotype appears at the human gene dose. Brain size, corpus
      callosum morphology, cortical thickness and hippocampal width are all
      unchanged, in sharp contrast to the near-complete cortical loss the conditional
      truncation produces.
    limitations: >-
      The measurements are gross morphometry at postnatal day 0, and the authors say
      explicitly that higher-resolution studies able to detect subtler abnormalities
      are still warranted - so this is evidence against a gross structural phenotype,
      not against a structural contribution as such. It is nonetheless the most
      directly relevant datum available for the dose question, since it is the only
      structural measurement made at the human genotype in vivo.
    readouts:
    - name: Gross brain morphometry at postnatal day 0
      target: Loss of Cortical Structure
      direction: UNCHANGED
      interpretation: >-
        Neither brain size nor callosal morphology differs from wild type at birth.
      evidence:
      - reference: PMID:37782669
        reference_title: "Neurodevelopmental deficits and cell-type-specific transcriptomic perturbations in a mouse model of HNRNPU haploinsufficiency."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "we did not observe differences in brain size and corpus callosum morphology compared to WT at postnatal day 0"
        explanation: >-
          The negative morphometric result behind this readout.
    - name: Cortical thickness and hippocampal width
      target: Loss of Cortical Structure
      direction: UNCHANGED
      interpretation: >-
        The two regional measures most relevant to a progenitor-depletion mechanism
        are also unaffected.
      evidence:
      - reference: PMID:37782669
        reference_title: "Neurodevelopmental deficits and cell-type-specific transcriptomic perturbations in a mouse model of HNRNPU haploinsufficiency."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Further examination of Hnrnpu+/113DEL brains also showed no significant change in cortical thickness and hippocampal width"
        explanation: >-
          The negative regional measurement behind this readout.
    evidence:
    - reference: PMID:37782669
      reference_title: "Neurodevelopmental deficits and cell-type-specific transcriptomic perturbations in a mouse model of HNRNPU haploinsufficiency."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Further examination of Hnrnpu+/113DEL brains also showed no significant change in cortical thickness and hippocampal width"
      explanation: >-
        Substantiates the failure to recapitulate the cortical-structure node at the
        heterozygous dose.

experimental_models:
- name: Isogenic HNRNPU heterozygous human iPSC-derived brain organoid
  experimental_model_type: ORGANOID
  description: >-
    Human iPSC-derived brain organoids carrying a heterozygous HNRNPU

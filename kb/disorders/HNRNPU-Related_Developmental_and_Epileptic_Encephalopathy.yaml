discussions:
- discussion_id: gap_which_hnrnpu_function_drives_the_phenotype
  prompt: >-
    Which of hnRNP U's functions - alternative splicing, chromatin architecture via
    the SAF-A/RNA nuclear mesh, or transcriptional regulation - is the dose-sensitive
    one that produces the neurodevelopmental phenotype, and are they separable at all?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Disrupted Alternative Splicing Program
  - pathophysiology#Destabilized SAF-A/RNA Nuclear Mesh and Chromatin Architecture
  - pathophysiology#Widespread Transcriptional Dysregulation
  rationale: >-
    The pathograph here carries three parallel molecular arms because the protein has
    three documented functions, not because three have been shown to matter for
    disease. No study has separated them: the splicing evidence comes from a
    conditional truncation that removes all functions at once, and the chromatin
    literature explicitly says a mechanistic understanding is lacking. The domain
    architecture offers a route, since the DNA/RNA-binding, oligomerisation, and
    protein-interaction functions map to separable domains, so this is a tractable
    question rather than a permanent unknown. It matters because a therapy would have
    to target the dose-sensitive arm, and at present a screen would have no defined
    molecular endpoint to screen against.
  evidence:
  - reference: PMID:34823151
    reference_title: "The role of SAF-A/hnRNP U in regulating chromatin structure."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "This mesh is thought to regulate nuclear and chromatin architecture, yet a mechanistic understanding is lacking."
    explanation: >-
      States directly that the chromatin arm's mechanism is not understood.
  - reference: PMID:34823151
    reference_title: "The role of SAF-A/hnRNP U in regulating chromatin structure."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "we infer possible links between diseases emerging from SAF-A mutations and its role in chromatin organisation and regulation"
    explanation: >-
      The link from the chromatin function to disease is explicitly an inference,
      not a demonstrated result.
  - reference: PMID:35864088
    reference_title: "Heterogeneous nuclear ribonucleoprotein U (HNRNPU) safeguards the developing mouse cortex."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The HNRNPU protein binds to RNA, DNA, and other proteins, and these interactions facilitate its functions in organizing and stabilizing nuclear chromatin, regulating gene transcription"
    explanation: >-
      Enumerates the multiple functions that the disease models cannot currently
      disentangle.
  proposed_experiments:
  - experiment_id: exp_domain_separation_of_function_alleles
    name: Domain-selective HNRNPU separation-of-function alleles in human neurons
    description: >-
      Generate isogenic iPSC lines carrying alleles that selectively disable the
      DNA/RNA-binding domain, the ATP-dependent oligomerisation function required for
      mesh formation, or the RNA-binding motifs, and compare splicing changes,
      chromatin accessibility, transcriptional dysregulation, and progenitor
      viability across them, to establish which function the neurodevelopmental
      phenotype tracks.

- discussion_id: mismatch_conditional_truncation_versus_human_haploinsufficiency
  prompt: >-
    How much of the mouse cortical phenotype - rapid progenitor death and
    near-complete loss of cortical structures - reflects human HNRNPU disease, given
    that patients are heterozygous with nonspecific MRI findings and only 14-20%
    have microcephaly?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Neural Progenitor Cell Death
  - pathophysiology#Loss of Cortical Structure
  rationale: >-
    The mouse model is a conditional truncation that removes HNRNPU function
    outright, and complete knockout is embryonic lethal. Human disease is
    heterozygous, and the great majority of patients do not have microcephaly at all,
    which is hard to reconcile with a mechanism whose defining feature in the model
    is rapid, near-complete progenitor elimination. Either the human dose is far
    enough above the death threshold that the cell-death arm contributes little, or
    it operates at a much lower intensity than the model shows. The heterozygous human organoid does
    reach the same endpoint - it shows significant reductions in progenitor
    populations and generates significantly smaller organoids - so the mismatch is
    narrower than a bare dose argument suggests: progenitor loss is real at the human
    gene dose, and the open question is one of magnitude rather than of kind. The
    dose-matched heterozygous mouse now bears on this directly, and it lands on the
    patient side: brain size, callosal morphology, cortical thickness and hippocampal
    width are all unchanged, so an in vivo animal at the human genotype shows no
    gross structural phenotype at all. That measurement carries its own caveat, since
    it is gross morphometry at postnatal day 0 and the authors call for
    higher-resolution work, and the same mouse loses only about a fifth to a quarter
    of cortical hnRNP U rather than half - which may itself be why the phenotype is
    absent. What remains unexplained is why organoid size reduction is universal
    across mutant lines while microcephaly reaches only 14-20% of patients and the
    heterozygous mouse has none; the difference between an organoid and an intact
    brain, where compensation and continued growth are both available, is the obvious
    place to look.
  evidence:
  - reference: PMID:35864088
    reference_title: "Heterogeneous nuclear ribonucleoprotein U (HNRNPU) safeguards the developing mouse cortex."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "HNRNPU is critical in mammalian development, and knockout mice exhibit early lethality"
    explanation: >-
      Establishes that the model sits at a dose no human patient occupies.
  - reference: PMID:36594023
    reference_title: "Evidence of shared transcriptomic dysregulation of HNRNPU-related disorder between human organoids and embryonic mice."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "with patients exhibiting developmental delay (∼95%), intellectual disability (52%), craniofacial dysmorphism (54–95%) including microcephaly (14–20%) and seizures (83–95%)"
    explanation: >-
      Most patients do not have microcephaly, which is the observation the
      progenitor-death mechanism has to be reconciled with.
  - reference: PMID:36594023
    reference_title: "Evidence of shared transcriptomic dysregulation of HNRNPU-related disorder between human organoids and embryonic mice."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we performed compositional analyses and identified significant reductions in progenitor populations"
    explanation: >-
      Corrects a natural but wrong assumption: the heterozygous human organoid does
      report progenitor loss, not only transcriptional change.
  - reference: PMID:37782669
    reference_title: "Neurodevelopmental deficits and cell-type-specific transcriptomic perturbations in a mouse model of HNRNPU haploinsufficiency."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: "Further examination of Hnrnpu+/113DEL brains also showed no significant change in cortical thickness and hippocampal width"
    explanation: >-
      The dose-matched mouse shows no gross cortical phenotype, which is the
      strongest in vivo evidence that the truncation model's structural severity does
      not transfer to the human genotype.
  - reference: PMID:37782669
    reference_title: "Neurodevelopmental deficits and cell-type-specific transcriptomic perturbations in a mouse model of HNRNPU haploinsufficiency."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "revealed a decrease in Hnrnpu expression of approximately 20–25% in Hnrnpu+/113DEL mice"
    explanation: >-
      Qualifies the negative result above: the heterozygous mouse does not achieve a
      full halving of hnRNP U, so an absent phenotype there is not conclusive for the
      human dose.
  - reference: PMID:36594023
    reference_title: "Evidence of shared transcriptomic dysregulation of HNRNPU-related disorder between human organoids and embryonic mice."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The reduction in size of hCOs may phenocopy the subset of human patients with microcephaly"
    explanation: >-
      The organoid authors themselves connect the size reduction to the microcephalic
      subset of patients, which is the link the dose argument has to account for.
  proposed_experiments:
  - experiment_id: exp_heterozygous_progenitor_viability
    name: Progenitor viability in heterozygous rather than truncated models
    description: >-
      Measure neural progenitor apoptosis and proliferation directly in
      Hnrnpu-heterozygous mouse cortex and in isogenic heterozygous human organoids,
      using the same time-lapse and marker readouts as the conditional truncation
      study, to establish whether the cell-death arm operates at all at the human
      gene dose.

- discussion_id: gap_organoid_developmental_window_limits
  prompt: >-
    Do human brain organoids model HNRNPU-related disorder only within a narrow
    embryonic developmental window, and if so what system should be used to study
    the postnatal seizure phenotype that dominates the clinical picture?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Widespread Transcriptional Dysregulation
  - pathophysiology#Cortical Network Hyperexcitability
  rationale: >-
    The organoid study found co-dysregulation enriched against embryonic but
    explicitly not perinatal mouse cortex, and the authors conclude that organoids may
    only be suitable for certain cell types within a specific developmental window.
    That is a problem for this disorder specifically, because seizures affect 83-95%
    of patients and are a postnatal phenomenon, while the one human model system
    appears to lose fidelity exactly as development moves past the embryonic period.
    A therapeutic screen run in organoids would therefore be optimizing against an
    embryonic transcriptional signature while the target phenotype is postnatal
    epilepsy.
  evidence:
  - reference: PMID:36594023
    reference_title: "Evidence of shared transcriptomic dysregulation of HNRNPU-related disorder between human organoids and embryonic mice."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Thus, hnRNPU deficient human organoids may only be suitable to model transcriptional dysregulation in certain cell types within a specific developmental time window."
    explanation: >-
      The authors state the limitation of their own model system.
  - reference: PMID:36594023
    reference_title: "Evidence of shared transcriptomic dysregulation of HNRNPU-related disorder between human organoids and embryonic mice."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "An emerging drug discovery approach for neurodevelopmental disorders is to characterize transcriptome-wide dysregulation in an appropriate model system and screen therapeutics based on their capacity to restore functionally relevant expression patterns."
    explanation: >-
      Describes the screening paradigm whose validity depends on the model matching
      the target developmental stage.
  proposed_experiments:
  - experiment_id: exp_extended_organoid_timecourse
    name: Extended organoid time course against postnatal cortex
    description: >-
      Profile HNRNPU-heterozygous organoids at successively later maturation stages,
      including sliced or vascularized long-term cultures, and test co-dysregulation
      against perinatal and postnatal mouse cortex, to determine whether fidelity can
      be recovered at later stages or whether a different system is required for the
      seizure phenotype.

- discussion_id: gap_valproate_efficacy_mechanism
  prompt: >-
    Why is sodium valproate reported as frequently effective in HNRNPU-related
    disorder, when seizures in most developmental and epileptic encephalopathies are
    refractory, and does that reflect a mechanistic relationship between valproate's
    chromatin effects and the HNRNPU lesion?
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - pathophysiology#Recurrent Seizures
  - pathophysiology#Destabilized SAF-A/RNA Nuclear Mesh and Chromatin Architecture
  rationale: >-
    GeneReviews describes valproate as often used and frequently effective here,
    which stands out against the pharmacoresistance typical of DEEs. Valproate also
    has chromatin-level activity as a histone deacetylase inhibitor, and the HNRNPU
    lesion is partly a chromatin-architecture lesion, so a mechanistic rather than
    coincidental relationship is worth asking about. The question is speculative and
    is recorded as an open question, not a hypothesis with supporting evidence: it may
    simply be that this disorder's seizure types, commonly tonic-clonic and absence,
    are ones valproate treats well in any aetiology. Distinguishing those two
    explanations would need a comparison against matched seizure types in other DEEs.
  evidence:
  - reference: PMID:35274911
    reference_title: "HNRNPU-Related Neurodevelopmental Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Standard treatment of seizures with anti-seizure medications (sodium valproate is often used and is frequently effective)"
    explanation: >-
      The observation of unusual valproate efficacy that prompts the question.
  - reference: PMID:35274911
    reference_title: "HNRNPU-Related Neurodevelopmental Disorder."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Affected individuals are likely to experience seizures (most commonly tonic-clonic or absence) that may be refractory to treatment."
    explanation: >-
      Gives the seizure semiology behind the simpler alternative explanation, and
      notes that refractoriness still occurs, so the efficacy is not universal.
  proposed_experiments:
  - experiment_id: exp_valproate_response_versus_matched_dees
    name: Valproate response rate against seizure-type-matched DEE controls
    description: >-
      Compare valproate response rates in HNRNPU-related disorder against other DEEs
      matched for seizure semiology, to test whether the reported efficacy exceeds
      what the seizure types alone predict; if it does, assay whether valproate's
      HDAC inhibition normalizes chromatin accessibility in HNRNPU-heterozygous human
      neurons.


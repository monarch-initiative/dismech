genetic:
- name: HNRNPU
  association: De novo heterozygous loss-of-function variants
  presence: Positive
  relationship_type: CAUSATIVE
  variant_origin: DE_NOVO
  notes: >-
    HNRNPU encodes heterogeneous nuclear ribonucleoprotein U, also known as scaffold
    attachment factor A. The protein binds RNA, DNA, and other proteins, and those
    interactions support its roles in organizing and stabilizing nuclear chromatin,
    regulating transcription, and RNA splicing and stability. Disease arises from de
    novo heterozygous loss-of-function point variants or from 1q44 microdeletions
    encompassing the gene; both converge on haploinsufficiency for HNRNPU itself, but
    they are NOT interchangeable at the phenotype level: in the 1q43q44 contiguous-gene
    region, AKT3 haploinsufficiency is the main driver of microcephaly and ZBTB18 of
    corpus callosum anomalies, while HNRNPU alteration mostly drives the epilepsy and
    sets the degree of intellectual disability. A deletion patient's microcephaly or
    callosal anomaly may therefore be attributable to a neighbouring gene rather than
    to HNRNPU. Complete loss is embryonic lethal in mice, so no null human genotype
    exists. A DNA methylation episignature has been developed for this disorder and
    can serve as a diagnostic biomarker, including for variant reclassification.
  gene_term:
    preferred_term: HNRNPU
    term:
      id: hgnc:5048
      label: HNRNPU
  evidence:
  - reference: PMID:36594023
    reference_title: "Evidence of shared transcriptomic dysregulation of HNRNPU-related disorder between human organoids and embryonic mice."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "De novo loss-of-function variants in HNRNPU have been found to cause a neurodevelopmental syndrome"
    explanation: >-
      Establishes HNRNPU as the causal gene and the variant class.
  - reference: PMID:35864088
    reference_title: "Heterogeneous nuclear ribonucleoprotein U (HNRNPU) safeguards the developing mouse cortex."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Microdeletions in the 1q44 locus encompassing HNRNPU and other genes and point mutations in HNRNPU cause brain disorders"
    explanation: >-
      Documents the two lesion routes to the same disorder.
  - reference: PMID:28283832
    reference_title: "Genetic and phenotypic dissection of 1q43q44 microdeletion syndrome and neurodevelopmental phenotypes associated with mutations in ZBTB18 and HNRNPU."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our study demonstrates that AKT3 haploinsufficiency is the main driver for microcephaly, whereas HNRNPU alteration mostly drives epilepsy and determines the degree of intellectual disability"
    explanation: >-
      Apportions the 1q43q44 phenotype across contiguous genes, showing HNRNPU drives
      the epilepsy and the degree of intellectual disability while AKT3 drives the
      microcephaly.
  - reference: PMID:28283832
    reference_title: "Genetic and phenotypic dissection of 1q43q44 microdeletion syndrome and neurodevelopmental phenotypes associated with mutations in ZBTB18 and HNRNPU."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "ZBTB18 may also contribute to microcephaly and HNRNPU to thin corpus callosum, but with a lower penetrance"
    explanation: >-
      Qualifies the split: HNRNPU does contribute to thin corpus callosum, but with
      lower penetrance than the primary drivers.
  - reference: PMID:37120726
    reference_title: "DNA methylation episignature and comparative epigenomic profiling of HNRNPU-related neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We performed genome-wide DNA methylation (DNAm) analysis in a cohort of individuals to develop a diagnostic biomarker and gain functional insights into the molecular pathophysiology of HNRNPU-related disorder"
    explanation: >-
      Establishes the DNA methylation episignature as a diagnostic biomarker for the
      disorder.
  - reference: PMID:35864088
    reference_title: "Heterogeneous nuclear ribonucleoprotein U (HNRNPU) safeguards the developing mouse cortex."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The HNRNPU protein binds to RNA, DNA, and other proteins, and these interactions facilitate its functions in organizing and stabilizing nuclear chromatin, regulating gene transcription"
    explanation: >-
      Describes the multifunctional protein whose dose is halved.


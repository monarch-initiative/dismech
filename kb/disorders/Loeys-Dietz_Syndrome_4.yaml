    reference_title: "A Novel Mutation of TGFB2 Gene Responsible of Loeys-Dietz 4 Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We emphasize the relevance of genetic counseling and molecular analysis to
      identify genetic diseases subtending sudden deaths
    explanation: >-
      Frames genetic counselling and molecular testing as the intervention that
      identifies at-risk relatives in families ascertained through sudden death.
- name: Subacute Bacterial Endocarditis Prophylaxis
  description: >-
    Antibiotic prophylaxis before dental work or other procedures expected to
    cause bacteraemia. Relevant in LDS4 because of the valve disease curated
    here - mitral valve prolapse with regurgitation, bicuspid aortic valve - and
    because prosthetic material is present in anyone who has undergone
    prophylactic aortic root replacement. GeneReviews frames this as a
    consideration rather than a blanket recommendation.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antibiotic Prophylaxis
    term:
      id: NCIT:C51993
      label: Antibiotic Prophylaxis
  evidence:
  - reference: PMID:20301312
    reference_title: "Loeys-Dietz Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Consider subacute bacterial endocarditis prophylaxis in those undergoing
      dental work or other procedures expected to contaminate the bloodstream
      with bacteria.
    explanation: >-
      GeneReviews states the prophylaxis recommendation and its trigger
      procedures for Loeys-Dietz syndrome.
- name: Hernia Repair with Supporting Mesh
  description: >-
    Surgical hernia repair reinforced with a supporting mesh. The mesh is not a
    surgical preference here but a response to the disease mechanism: the same
    connective-tissue matrix defect that produced the hernia also compromises the
    repair, so recurrence is expected without reinforcement. This pairs directly
    with the recurrent hernia phenotype curated above.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Herniorrhaphy
    term:
      id: NCIT:C168249
      label: Herniorrhaphy
  evidence:
  - reference: PMID:20301312
    reference_title: "Loeys-Dietz Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hernias tend to recur after surgical intervention; a supporting mesh can
      be used during surgical repair to minimize recurrence risk.
    explanation: >-
      GeneReviews states both the recurrence problem and the mesh-reinforced
      repair that addresses it.
- name: Pregnancy Risk Counselling and Intensified Peripartum Aortic Imaging
  description: >-
    Preconception counselling on aortic and uterine rupture risk, review and
    substitution of angiotensin receptor blocker therapy before conception, and
    increased frequency of aortic imaging both during pregnancy and in the weeks
    after delivery. The postpartum arm matters as much as the antenatal one:
    reported Loeys-Dietz peripartum catastrophes cluster in late pregnancy and
    the puerperium, and in a recent cohort the vascular events that did occur
    around pregnancy were postpartum. No LDS4-specific pregnancy outcome rate
    exists, so this is spectrum-level management applied to a subtype whose own
    risk is uncharacterised.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Supportive Care

    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The aortic phenotype in patients with SMAD3 mutations is very similar to
      TGFBR1/2 patients, whereas TGFB2 and TGFB3 cardiovascular features tend to
      be milder, although severe aortic presentation at young age has also been
      observed.
    explanation: >-
      Places the TGFB2 aortic phenotype at the milder end of the spectrum while
      explicitly preserving the exception - severe young-onset disease occurs.
  downstream:
  - target: Aortic Dissection and Rupture
    description: >-
      A dilated, degenerate root can dissect or rupture, though less frequently
      in LDS4 than in the receptor-related subtypes.
- name: Aortic Dissection and Rupture
  biological_scale: ORGANISM
  conforms_to: "aortopathy_tgfbeta_dysregulation#Aortic Dissection and Rupture"
  description: >-
    The lethal endpoint. Type A dissection extending the full length of the
    aorta, dissection of abdominal aortic aneurysm, and sudden death have all
    been reported in TGFB2 pedigrees, and it was the occurrence of dissection and
    death across multiple generations that led to gene identification. Relative
    to LDS1/LDS2, dissection in LDS4 is less frequent, but it is not absent -
    families ascertained through sudden death are on record, and descending
    aortic dissection can occur while root dilation is still relatively mild.

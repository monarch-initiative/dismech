      molecular genetic testing
    explanation: >-
      States the GeneReviews recommendation for evaluation of at-risk relatives.
  - reference: PMID:41170304
    reference_title: "A Novel Mutation of TGFB2 Gene Responsible of Loeys-Dietz 4 Syndrome."

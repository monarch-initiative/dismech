    explanation: >-
      Independent confirmation in a missense-allele pedigree that both TGF-beta
      1 and TGF-beta 2 are up-regulated in the LDS4 aorta.
  - reference: PMID:29392890
    reference_title: "A mutation update on the LDS-associated genes TGFB2/3 and SMAD2/3."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Western blot of Tgfb2+/− mouse aortas showed a similar increase in
      phosphorylation of Smad2/3 and Erk1/2, recapitulating the observations in
      the human aorta
    explanation: >-
      Shows both canonical and non-canonical arms are activated in the
      haploinsufficient mouse aorta, matching the human tissue signature.
  downstream:
  - target: Aortic Medial Degeneration
    description: >-
      Sustained excess TGF-beta signalling in the media drives elastic fibre
      breakdown and proteoglycan accumulation.
- name: Impaired Aortic Root Smooth Muscle Cell Differentiation
  biological_scale: CELLULAR
  description: >-
    A developmental arm that helps explain why the aneurysm in LDS4 is
    concentrated at the aortic root. In human iPSC-derived smooth muscle cells,
    TGFB2 signals distinctively through TGFBR3 (betaglycan) rather than only the
    canonical type I/II receptors, and both TGFB2 and TGFBR3 are enriched in the
    tunica media of the aortic root specifically. TGFB2 haploinsufficiency and
    TGFB2 neutralisation impair differentiation of second heart field-derived
    smooth muscle cells - the lineage that populates the root - and a missense
    TGFB2 variant produced measurable mechanical defects in engineered smooth
    muscle tissue rings that were rescued by adding back TGFB2. This arm is
    grounded entirely in an in vitro human system; it complements rather than
    replaces the paradoxical-signalling arm.
  biological_processes:
  - preferred_term: smooth muscle cell differentiation
    term:
      id: GO:0051145
      label: smooth muscle cell differentiation
    modifier: DECREASED

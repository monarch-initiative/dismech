definitions:
- name: Molecular and clinical diagnosis of LDS4
  definition_type: DIAGNOSTIC_CRITERIA
  description: >-
    The diagnosis of Loeys-Dietz syndrome is established by identification of a
    heterozygous pathogenic variant in one of the six Loeys-Dietz genes in a
    proband with aortic root enlargement, type A dissection, or other
    characteristic clinical features. LDS4 is the designation applied when that
    gene is TGFB2. Because the cardiovascular phenotype in TGFB2 families is
    milder and later-onset than in TGFBR1/TGFBR2 disease, and because
    non-penetrance is comparatively common, molecular testing rather than the
    clinical aortic threshold is frequently what establishes the diagnosis.
  evidence:
  - reference: PMID:20301312
    reference_title: "Loeys-Dietz Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      by the identification of a heterozygous pathogenic variant in SMAD2,
      SMAD3, TGFB2, TGFB3, TGFBR1, or TGFBR2 or biallelic pathogenic variants in
      IPO8 in a proband with aortic root enlargement, type A dissection, other
      characteristic clinical features of LDS, or a family history of an
      established diagnosis of LDS
    explanation: >-
      GeneReviews states the molecular diagnostic criterion for Loeys-Dietz
      syndrome, naming TGFB2 among the causal genes.
  - reference: PMID:29392890
    reference_title: "A mutation update on the LDS-associated genes TGFB2/3 and SMAD2/3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      patients with mutations in TGFB2 share clinical manifestations with LDS,
      and are for this reason now diagnosed with LDS type 4 (LDS4)
    explanation: >-
      Establishes that the LDS4 designation is defined by the causal gene being
      TGFB2, which is the concept MONDO:0013897 models.
  - reference: PMID:36832261
    reference_title: "The Role of Genetic Testing in Patients with Heritable Thoracic Aortic Diseases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To date, six subtypes of LDS are currently described.
    explanation: >-
      Confirms the six-subtype molecular partition of Loeys-Dietz syndrome
      within which LDS4 is the TGFB2 subtype.

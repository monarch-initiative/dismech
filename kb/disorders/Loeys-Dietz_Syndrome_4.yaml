    snippet: >-
      immunoblot analysis of the TGF-β2 proprotein in cellular lysates from
      these cells showed reduced TGF-β2 proprotein levels in the mutant cells
      compared with the wildtype cells and no evidence of the truncated protein
    explanation: >-
      Direct measurement of reduced TGF-beta 2 proprotein in patient-derived
      smooth muscle cells and fibroblasts, with no truncated species - the
      biochemical definition of haploinsufficiency here.
  - reference: PMID:22772371
    reference_title: "TGFB2 mutations cause familial thoracic aortic aneurysms and dissections associated with mild systemic features of Marfan syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the initial pathway driving disease is decreased cellular TGF-β2 levels
      leading to a secondary increase in TGF-β2 production in the diseased aorta
    explanation: >-
      States the authors' sequencing of the two directions: cellular loss first,
      aortic overshoot second. This is the causal ordering this node encodes.
  downstream:
  - target: Paradoxical Aortic TGF-beta Signaling Dysregulation
    description: >-
      Reduced cellular TGF-beta 2 provokes a compensatory response in the aortic
      wall that overshoots into excess TGF-beta signalling.
    hypothesis_groups:
    - compensatory_ligand_overshoot
    evidence:
    - reference: PMID:22772371
      reference_title: "TGFB2 mutations cause familial thoracic aortic aneurysms and dissections associated with mild systemic features of Marfan syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        aortic tissue from cases paradoxically shows increased TGF-β2
        expression and immunostaining
      explanation: >-
        Establishes the edge: the same haploinsufficient allele that lowers
        cellular ligand raises aortic TGF-beta 2 expression.
  - target: Impaired Aortic Root Smooth Muscle Cell Differentiation
    description: >-
      TGF-beta 2 is required, via TGFBR3, for differentiation of the second
      heart field-derived smooth muscle cells that populate the aortic root.
    hypothesis_groups:

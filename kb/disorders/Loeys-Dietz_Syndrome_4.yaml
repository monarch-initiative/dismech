      and TGFBR3 enrichment in the aortic root tunica media.
    explanation: >-
      Provides the regional explanation for root-predominant disease: the
      TGFB2-TGFBR3 axis is enriched exactly where the aneurysm forms.
  downstream:
  - target: Aortic Medial Degeneration
    description: >-
      A structurally deficient root media is more vulnerable to the degenerative
      process.
- name: Aortic Medial Degeneration
  biological_scale: TISSUE
  conforms_to: "aortopathy_tgfbeta_dysregulation#Aortic Medial Degeneration and Wall Weakening"
  description: >-
    The histological lesion of LDS4 is the medial degeneration common to the
    heritable aortopathies: fragmentation and loss of elastic fibres in the
    tunica media with accumulation of proteoglycans, described in both of the
    2012 defining cohorts and independently as cystic medial necrosis in a
    dissected LDS4 aorta. The result is a media that has lost its recoil and
    tensile competence.

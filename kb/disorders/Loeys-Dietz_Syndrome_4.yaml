genetic:
- name: TGFB2
  gene_term:
    preferred_term: TGFB2
    term:
      id: hgnc:11768
      label: TGFB2
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    TGFB2 (1q41) encodes the transforming growth factor beta 2 ligand.
    Heterozygous loss-of-function variants - nonsense, frameshift, splice-site,
    intragenic and whole-gene deletions, and a minority of missense alleles -
    cause LDS4. Thirty distinct variants had been catalogued by the 2018
    mutation update. Reported alleles cluster in the latency-associated peptide
    domain and at the RKKR furin cleavage motif needed to release the mature
    cytokine, and 23% fall in the exons encoding the active cytokine itself.
    Deep-intronic and near-splice-site variants that shift acceptor choice are
    an under-recognised class and are a reason genome rather than panel
    sequencing resolves some families.
  evidence:
  - reference: PMID:22772368
    reference_title: "Loss-of-function mutations in TGFB2 cause a syndromic presentation of thoracic aortic aneurysm."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report heterozygous mutations or deletions in the gene encoding
      the TGF-β2 ligand for a phenotype within the LDS spectrum
    explanation: >-
      The primary gene-disease assertion for LDS4.
  - reference: PMID:29392890
    reference_title: "A mutation update on the LDS-associated genes TGFB2/3 and SMAD2/3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report 7, 67, 30, and 15 different variants for SMAD2, SMAD3, TGFB2,
      and TGFB3, respectively
    explanation: >-
      Gives the catalogued TGFB2 variant count as of the field's mutation
      update.
  - reference: PMID:39737004
    reference_title: "Novel variant alters splicing of TGFB2 in family with features of Loeys-Dietz syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Molecular validation of the splicing products suggests that the TGFB2
      variants tested impact splicing by reducing efficiency of the canonical
      acceptor in favor of an alternate acceptor within the exon.
    explanation: >-
      Functional characterisation of a near-splice-site intronic TGFB2 variant
      class that panel sequencing would classify as uncertain.
  - reference: ORPHA:60030
    reference_title: "Loeys-Dietz syndrome (Orphanet)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "TGFB2 | transforming growth factor beta 2 | hgnc:11768 | Disease-causing germline mutation(s) in"
    explanation: >-
      Orphanet curates TGFB2 as a disease-causing germline gene for Loeys-Dietz
      syndrome.
animal_models:
- name: Tgfb2 heterozygous null mouse (Tgfb2+/-)
  species: Mouse
  genotype: Tgfb2 heterozygous knockout
  publication: PMID:22772368
  description: >-
    The genotype-matched mouse model of LDS4. Heterozygous Tgfb2 null mice
    develop aortic annulus and aortic root dilation, establishing that loss of a
    single Tgfb2 allele is sufficient to cause aortic root aneurysm, and their
    aortas show increased canonical (pSmad2/3) and non-canonical (pErk1/2)
    signalling - reproducing the human paradox in a system where the genetics
    are unambiguous. Compound Tgfb2+/-;Fbn1C1039G/+ mice show phenotypic
    worsening with high Tgfb1 expression, which is the experimental basis for
    the compensatory-ligand-shift model.
  modeled_mechanisms:
  - target: Paradoxical Aortic TGF-beta Signaling Dysregulation
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      The heterozygous null genotype matches the human haploinsufficiency
      mechanism exactly, and the aortic tissue reproduces both the canonical and
      non-canonical signalling increase seen in patient aorta.
    limitations: >-
      Mice do not develop the craniofacial or articular features of LDS4, and
      the aortic phenotype has been characterised at fixed early timepoints
      rather than across the fourth-decade-equivalent natural history that
      defines the human disorder.
    readouts:
    - name: Aortic pSmad2/3 and pErk1/2 phosphorylation
      target: Paradoxical Aortic TGF-beta Signaling Dysregulation
      direction: INCREASED
      interpretation: >-
        Western blot of Tgfb2+/- aorta shows activation of both TGF-beta
        signalling arms, the model's structural correlate of the human aortic
        tissue signature.
      evidence:
      - reference: PMID:29392890
        reference_title: "A mutation update on the LDS-associated genes TGFB2/3 and SMAD2/3."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Western blot of Tgfb2+/− mouse aortas showed a similar increase in
          phosphorylation of Smad2/3 and Erk1/2, recapitulating the observations
          in the human aorta
        explanation: >-
          Reports the measurement and its direction in the haploinsufficient
          mouse aorta.
    evidence:
    - reference: PMID:22772368
      reference_title: "Loss-of-function mutations in TGFB2 cause a syndromic presentation of thoracic aortic aneurysm."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        haploinsufficient Tgfb2(+/-) mice have aortic root aneurysm and
        biochemical evidence of increased canonical and noncanonical TGF-β
        signaling
      explanation: >-
        Supports treating the heterozygous null mouse as informative for the
        paradoxical signalling node.
  - target: Progressive Aortic Root Dilation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Tgfb2+/- mice develop dilation of the aortic annulus and aortic root,
      matching the anatomical distribution of human LDS4 aneurysm.
    limitations: >-
      Progression to dissection or rupture - the clinical endpoint that matters
      in patients - is not established in the heterozygous mouse, so the model
      captures dilation rather than the full natural history.
    readouts:
    - name: Aortic root and annulus dimension
      target: Progressive Aortic Root Dilation
      direction: INCREASED
      interpretation: >-
        Anatomical dilation at the aortic annulus and root in the heterozygous
        null mouse.
      evidence:
      - reference: PMID:29392890
        reference_title: "A mutation update on the LDS-associated genes TGFB2/3 and SMAD2/3."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Tgfb2+/− mice showed dilatations of the aortic annulus and aortic
          root, a pattern similar to that of LDS and MFS patients
        explanation: >-
          Reports the dimensional readout and its correspondence to the human
          anatomical pattern.
    evidence:
    - reference: PMID:29392890
      reference_title: "A mutation update on the LDS-associated genes TGFB2/3 and SMAD2/3."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        confirming that loss‐of‐function of one Tgfb2 allele is sufficient to
        cause aortic root aneurysm
      explanation: >-
        States the model's central inference - single-allele loss suffices for
        aortic root aneurysm.
experimental_models:
- name: TGFB2-KO/+ human iPSC-derived smooth muscle cells and 3D tissue rings
  experimental_model_type: IPSC_DERIVED_MODEL
  description: >-
    A human, non-animal model of the LDS4 genotype: CRISPR/Cas9-engineered
    TGFB2KO/+ and TGFB2G276R/+ human iPSC lines differentiated to smooth muscle
    cells and assembled into three-dimensional tissue ring constructs, alongside
    TGFBR3KO/KO lines for epistasis. It supplies the mechanistic arm that
    patient tissue cannot - controlled genotype, isogenic comparison, and a
    rescue arm (TGFB2 supplementation or genetic correction).
  publication: PMID:40139558
  modeled_mechanisms:
  - target: Impaired Aortic Root Smooth Muscle Cell Differentiation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces impaired differentiation of second heart field-derived smooth
      muscle cells under the exact human genotype (TGFB2 haploinsufficiency),
      with epistasis showing the effect runs through TGFBR3.
    limitations: >-
      iPSC-derived smooth muscle cells and engineered tissue rings lack the
      haemodynamic loading, adventitia and immune compartment of a real aorta,
      and the differentiation defect has not been demonstrated in patient aortic
      tissue - so the arm remains an in vitro inference about human disease.
    readouts:
    - name: Mechanical competence of engineered SMC tissue rings
      target: Impaired Aortic Root Smooth Muscle Cell Differentiation
      direction: RESTORED
      interpretation: >-
        The TGFB2G276R/+ mechanical defect was reversed by TGFB2 supplementation
        or genetic correction, establishing that the deficit is TGFB2 dose
        dependent and reversible in this system.
      evidence:
      - reference: PMID:40139558
        reference_title: "TGFBR3 dependent mechanism of TGFB2 in smooth muscle cell differentiation and implications for TGFB2-related aortic aneurysm."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          a missense TGFB2 variant (TGFB2G276R/+) caused mechanical defects in
          SMC tissue ring constructs that were rescued by TGFB2 supplementation
          or genetic correction
        explanation: >-
          Reports the rescue measurement underlying this readout.
    evidence:
    - reference: PMID:40139558
      reference_title: "TGFBR3 dependent mechanism of TGFB2 in smooth muscle cell differentiation and implications for TGFB2-related aortic aneurysm."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        TGFBR3KO/KO prevented the molecular rescue of TGFB2KO/+ by TGFB2
        supplementation indicating the involvement of TGFBR3 in TGFB2-mediated
        SMC differentiation
      explanation: >-
        The epistasis result that makes this model informative for the
        TGFBR3-dependent differentiation node.
progression:
- phase: Childhood and adolescence
  age_range: Birth to second decade
  notes: >-
    Craniofacial (hypertelorism, bifid uvula, high palate), skeletal (scoliosis,
    pectus, arachnodactyly, clubfoot) and articular findings may be present from
    early life, and hernias often present in childhood. Aortic disease is
    typically not yet manifest, so a child carrying a familial TGFB2 variant may
    be clinically normal on echocardiography.
  evidence:
  - reference: PMID:25163805
    reference_title: "Further delineation of Loeys-Dietz syndrome type 4 in a family with mild vascular involvement and a TGFB2 splicing mutation."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Her 39- and 34-year-old daughters presented with a variable degree of
      musculoskeletal involvement.
    explanation: >-
      Documents musculoskeletal involvement as the manifestation in younger
      TGFB2 variant carriers who had not developed vascular disease. Marked
      PARTIAL because the daughters were adults, so this supports the
      musculoskeletal-first pattern rather than a specifically childhood onset.
- phase: Adulthood - aortic phase
  age_range: Fourth decade onwards
  notes: >-
    Aortic root dilation characteristically becomes apparent in the fourth
    decade and progresses more slowly than in TGFBR1/TGFBR2-related disease.
    This is the window in which surveillance imaging changes management, and it
    is also why a normal echocardiogram in a young carrier gives no reassurance
    about later risk.
  evidence:
  - reference: PMID:25163805
    reference_title: "Further delineation of Loeys-Dietz syndrome type 4 in a family with mild vascular involvement and a TGFB2 splicing mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      aneurysms are usually observed in fourth decade and the progression of the
      disease is slower than in the other forms
    explanation: >-
      States the characteristic timing and tempo of the aortic phase in LDS4.
- phase: Complication phase
  age_range: Variable, typically after the fourth decade
  notes: >-
    Dissection, rupture and sudden death are the terminal events. They are less
    frequent than in the receptor-related subtypes but do occur, sometimes as
    the presenting event in a previously undiagnosed family.
  evidence:
  - reference: PMID:41170304
    reference_title: "A Novel Mutation of TGFB2 Gene Responsible of Loeys-Dietz 4 Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      responsible of LDS4 in a family with sudden death and vascular lesions
    explanation: >-
      Records sudden death as an outcome in a TGFB2 pedigree.
treatments:
- name: Angiotensin Receptor Blocker Therapy
  description: >-
    Angiotensin receptor blockers are used across the Loeys-Dietz spectrum to
    reduce haemodynamic stress on the aortic wall, and losartan additionally
    antagonises TGF-beta signalling - the pathway implicated in the disorder.
    Note that the direction of the underlying signalling defect in LDS4 is
    unresolved (see the tgfb2_signaling_direction_paradox discussion), so the
    rationale for TGF-beta-directed therapy here rests on the observed aortic
    high-TGF-beta tissue signature rather than on a settled model, and there are
    no TGFB2-specific efficacy trials.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: losartan
      term:
        id: CHEBI:6541
        label: losartan
    - preferred_term: angiotensin II receptor antagonist
      term:
        id: NCIT:C66930
        label: Angiotensin II Receptor Antagonist
  target_mechanisms:
  - target: Paradoxical Aortic TGF-beta Signaling Dysregulation
    treatment_effect: INHIBITS
    description: >-
      Losartan reduces haemodynamic wall stress and has TGF-beta-antagonist
      activity, targeting the dysregulated aortic signalling node.
  evidence:
  - reference: PMID:20301312
    reference_title: "Loeys-Dietz Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      angiotensin receptor blockers, beta-adrenergic receptor blockers, or other
      medications are used to reduce hemodynamic stress
    explanation: >-
      GeneReviews states the medical management of the cardiovascular features
      of Loeys-Dietz syndrome, of which LDS4 is a subtype.
- name: Beta-Blocker Therapy
  description: >-
    Beta-adrenergic receptor blockade to reduce the rate of rise of aortic
    pressure and thereby haemodynamic stress on a dilating aortic root.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: beta-adrenergic antagonist
      term:
        id: NCIT:C29576
        label: Beta-Adrenergic Antagonist
  target_mechanisms:
  - target: Progressive Aortic Root Dilation
    treatment_effect: INHIBITS
    description: >-
      Reducing haemodynamic stress slows the rate of aortic root dilation.
  evidence:
  - reference: PMID:20301312
    reference_title: "Loeys-Dietz Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      angiotensin receptor blockers, beta-adrenergic receptor blockers, or other
      medications are used to reduce hemodynamic stress
    explanation: >-
      GeneReviews names beta-adrenergic receptor blockers as part of the medical
      management of Loeys-Dietz cardiovascular disease.
- name: Prophylactic Aortic Root Replacement
  description: >-
    Elective surgical replacement of the aortic root before dissection occurs.
    Across the Loeys-Dietz spectrum the threshold for intervention is lower than
    in Marfan syndrome because dissection can occur at smaller diameters, and
    the vascular disease is not confined to the root. Because dissection risk in
    TGFB2 disease is lower than in TGFBR1/TGFBR2 disease, the most aggressive
    Loeys-Dietz thresholds should be individualised rather than applied
    automatically in LDS4.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Surgical Procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Aortic Dissection and Rupture
    treatment_effect: INHIBITS
    description: >-
      Replacing the dilated root removes the segment at risk of dissection.
  evidence:
  - reference: PMID:20301312
    reference_title: "Loeys-Dietz Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      aortic dissection can occur at smaller aortic diameters and at younger ages
      than observed in Marfan syndrome; vascular disease is not limited to the
      aortic root; angiotensin receptor blockers, beta-adrenergic receptor
      blockers, or other medications are used to reduce hemodynamic stress; and
      aneurysms are amenable to early and aggressive surgical intervention
    explanation: >-
      States the rationale for early and aggressive surgical intervention and
      the lower diameter threshold that applies across Loeys-Dietz syndrome.
  - reference: PMID:38919319
    reference_title: "Hereditary Aortic Aneurysms and Dissections."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the risk of dissection is not so high when the causative gene is any of
      the latter three genes
    explanation: >-
      Supports individualising rather than automatically applying the most
      aggressive Loeys-Dietz surgical threshold in TGFB2 disease. Marked PARTIAL
      because the review states the risk difference, not a TGFB2-specific
      diameter threshold.
- name: Whole-Arterial-Tree Surveillance Imaging
  description: >-
    Annual echocardiography of the aortic root and ascending aorta plus MR or CT
    angiography of the entire arterial tree at least every other year. This is
    not optional adjunct care in LDS4: the disorder's arterial tortuosity and
    non-root aneurysms are invisible to echocardiography, descending aortic
    dissection can occur while root dilation is still mild, and in at least one
    reported case an extra-aortic finding on angiography is what corrected the
    diagnosis.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: Diagnostic Imaging Testing
    term:
      id: NCIT:C16502
      label: Diagnostic Imaging Testing
  evidence:
  - reference: PMID:20301312
    reference_title: "Loeys-Dietz Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Echocardiography to monitor the status of the aortic root and ascending
      aorta (at least annually) and magnetic resonance angiography or
      computerized tomography angiography to assess the entire arterial tree (at
      least every other year)
    explanation: >-
      States the surveillance schedule recommended for Loeys-Dietz syndrome.
  - reference: PMID:29392890
    reference_title: "A mutation update on the LDS-associated genes TGFB2/3 and SMAD2/3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This is essential because aneurysms distant from the aortic root can be
      easily overlooked using echocardiography.
    explanation: >-
      States why whole-arterial-tree imaging rather than echocardiography alone
      is required in TGFB2-related disease.

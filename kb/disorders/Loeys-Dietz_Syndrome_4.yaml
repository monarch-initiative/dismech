      occur even if dilatation at the root is relatively mild
    explanation: >-
      The clinically decisive qualifier on the milder-phenotype framing:
      dissection risk in the non-root aorta is not indexed to root diameter.
mechanistic_hypotheses:
- hypothesis_group_id: compensatory_ligand_overshoot
  hypothesis_label: Compensatory ligand overshoot (canonical model of the TGF-beta paradox)
  status: CANONICAL
  description: >-
    The canonical reconciliation of the LDS4 paradox. Loss of one TGFB2 allele
    lowers cellular TGF-beta 2; the aortic wall responds with autocrine and/or
    paracrine compensation - increased expression of TGF-beta 2 itself and a
    shift towards TGF-beta 1 - that overshoots, producing a net high-TGF-beta
    tissue signature (nuclear pSMAD2, CTGF) in the diseased aorta. Under this
    model the sequence is decrease first, secondary increase second, and it is
    the secondary excess that drives medial degeneration. Both 2012 defining
    papers converge on it, and the Tgfb2+/- mouse reproduces the same increase
    in canonical and non-canonical signalling.
  evidence:
  - reference: PMID:22772371
    reference_title: "TGFB2 mutations cause familial thoracic aortic aneurysms and dissections associated with mild systemic features of Marfan syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the initial pathway driving disease is decreased cellular TGF-β2 levels
      leading to a secondary increase in TGF-β2 production in the diseased aorta
    explanation: >-
      States the two-step model exactly: cellular decrease first, aortic
      compensatory increase second.
  - reference: PMID:22772368
    reference_title: "Loss-of-function mutations in TGFB2 cause a syndromic presentation of thoracic aortic aneurysm."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      these data support the hypothesis that compensatory autocrine and/or
      paracrine events contribute to the pathogenesis of TGF-β-mediated
      vasculopathies
    explanation: >-
      Names the compensatory autocrine/paracrine mechanism this hypothesis
      group encodes, on the strength of the Tgfb2+/- and Fbn1/Tgfb2 double
      mutant mouse data.
- hypothesis_group_id: tgfbr3_smc_differentiation
  hypothesis_label: TGFBR3-dependent aortic root smooth muscle differentiation defect
  status: EMERGING
  description: >-
    An emerging, developmentally framed alternative that does not require the
    paradox to be resolved at all. TGFB2 signal transduction in smooth muscle
    cells is distinctively TGFBR3 (betaglycan)-dependent, and the TGFB2-TGFBR3
    axis is enriched in the aortic root tunica media. Under this model, TGFB2
    haploinsufficiency impairs the differentiation of second heart field-derived
    smooth muscle cells that build the root, yielding a regionally deficient
    media - which would explain both the root-predominant distribution of LDS4
    aneurysm and, through redundancy among the TGF-beta isoforms, its milder
    aggressiveness compared with receptor-gene disease. The evidence is entirely
    from a human iPSC/CRISPR system; it has not been shown in patient aortic
    tissue, so this is recorded as EMERGING rather than as a competitor to the
    canonical model.
  evidence:
  - reference: PMID:40139558
    reference_title: "TGFBR3 dependent mechanism of TGFB2 in smooth muscle cell differentiation and implications for TGFB2-related aortic aneurysm."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      siRNA experiments revealed that TGFB2 distinctively displays TGFBR3
      dependence for signal transduction, an understudied TGFβ receptor in TAAD
    explanation: >-
      Establishes the TGFBR3 dependence that is the distinguishing claim of this
      hypothesis.
  - reference: PMID:40139558
    reference_title: "TGFBR3 dependent mechanism of TGFB2 in smooth muscle cell differentiation and implications for TGFB2-related aortic aneurysm."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      redundant activities of TGFβ isoforms provide implications about the
      milder TAAD aggressiveness of pathogenic TGFB2 variants
    explanation: >-
      Offers the model's explanation for why LDS4 is clinically milder than
      receptor-gene Loeys-Dietz. Marked PARTIAL because it is an inference the
      authors draw from isoform redundancy in vitro, not a measured clinical
      comparison.
discussions:
- discussion_id: tgfb2_signaling_direction_paradox
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    By what mechanism does heterozygous loss of function of TGFB2 produce aortic
    tissue with increased canonical and non-canonical TGF-beta signalling, and
    is that excess the cause of medial degeneration or a marker of it?
  attaches_to:
  - pathophysiology#Paradoxical Aortic TGF-beta Signaling Dysregulation
  rationale: >-
    Every measurement in LDS4 that is made in a peripheral cell shows less
    TGF-beta 2; every measurement made in the diseased aorta shows more
    TGF-beta signalling. Several non-exclusive explanations are on the table -
    relief of a canonical negative-feedback loop driving ligand expression and
    non-canonical overactivation; a shift in isoform usage towards TGF-beta 1; a
    non-cell-autonomous paracrine effect between smooth muscle populations of
    different embryonic origin at the transition zones where aneurysms form; and
    recruitment of angiotensin II or activin signalling. The 2018 mutation
    update states explicitly that the mechanism remains elusive. This is not an
    academic point: it determines whether a TGF-beta-directed therapy should
    augment or suppress signalling, and the observed excess may equally be a
    repair response to matrix damage rather than its cause.
  proposed_experiments:
  - experiment_id: lds4_compartment_matched_signalling
    name: Compartment-matched signalling measurement
    description: >-
      Measure TGF-beta 2 ligand, pSMAD2 and pERK1/2 in aortic media, adventitia
      and dermal fibroblasts from the same TGFB2-variant individuals, to
      establish whether the direction of the signalling change is
      tissue-compartment-specific rather than a whole-organism property.
  - experiment_id: lds4_temporal_ordering_mouse
    name: Temporal ordering in the haploinsufficient mouse
    description: >-
      Determine in Tgfb2+/- mice whether the rise in aortic pSmad2/3 and Erk1/2
      precedes or follows the first detectable elastic fibre fragmentation, to
      discriminate a causal excess from a reparative response.
  evidence:
  - reference: PMID:29392890
    reference_title: "A mutation update on the LDS-associated genes TGFB2/3 and SMAD2/3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although TGFB2 mutations are predicted to result in haploinsufficiency,
      the exact mechanisms on how loss‐of‐function mutations lead to a
      paradoxical activation of TGF‐β signaling remain elusive.
    explanation: >-
      An explicit statement from the field's mutation update that this mechanism
      is unresolved - the definition of the gap recorded here.
- discussion_id: tgfb2_deletion_neurodevelopmental_phenotype
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is the hypotonia, gross motor delay and speech delay/intellectual disability
    reported in patients with 1q41 deletions encompassing TGFB2 attributable to
    TGFB2 haploinsufficiency itself, or to the neighbouring genes also removed by
    the deletion?
  attaches_to:
  - pathophysiology#TGFB2 Loss-of-Function Variant
  rationale: >-
    Neurodevelopmental abnormalities are not a recognised feature of Loeys-Dietz
    syndrome, yet seven of nine reported patients with pure 1q41 deletions
    involving TGFB2 had hypotonia and gross motor delay and three had speech
    delay and/or intellectual disability. The smallest common deletion contains
    two genes, RRP15 and TGFB2, so the deletion series cannot on its own assign
    the phenotype to TGFB2. This matters directly for how an LDS4 diagnosis is
    counselled: whether a child with a whole-gene deletion carries a
    neurodevelopmental risk that a child with an intragenic TGFB2 point mutation
    does not.
  proposed_experiments:
  - experiment_id: lds4_intragenic_vs_deletion_neurodev
    name: Intragenic-variant neurodevelopmental cohort comparison
    description: >-
      Systematically assess development in a cohort of patients with intragenic
      TGFB2 loss-of-function variants and compare with the 1q41 whole-gene
      deletion series; a neurodevelopmental signal restricted to deletion
      carriers would implicate the contiguous genes rather than TGFB2.
  evidence:
  - reference: PMID:35426477
    reference_title: "Loeys-Dietz syndrome caused by 1q41 deletion including TGFB2 is associated with a neurodevelopmental phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The smallest deletion common to all patients is a 785 kb locus that
      contains two genes: RRP15 and TGFB2.
    explanation: >-
      States the contiguous-gene ambiguity that makes the attribution question
      open.
  - reference: PMID:35426477
    reference_title: "Loeys-Dietz syndrome caused by 1q41 deletion including TGFB2 is associated with a neurodevelopmental phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Seven of the nine patients present with some degree of hypotonia and gross
      motor delay, and three of the nine present with speech delay and/or
      intellectual disability (ID).
    explanation: >-
      Quantifies the neurodevelopmental findings in the deletion series that
      prompt the question.
differential_diagnoses:
- name: Marfan syndrome
  disease_term:
    preferred_term: Marfan syndrome
    term:
      id: MONDO:0007947
      label: Marfan syndrome
  description: >-
    LDS4 is the Loeys-Dietz subtype most easily mistaken for Marfan syndrome:
    both feature aortic root aneurysm at the sinuses of Valsalva, pectus
    deformity, scoliosis, arachnodactyly and striae, and the LDS4 aortic
    phenotype is comparatively mild and late-onset. Patients have carried a
    clinical Marfan diagnosis for years before a TGFB2 lesion was found.
  distinguishing_features:
  - >-
    Marfan syndrome is caused by FBN1 variants; LDS4 by TGFB2 variants or
    whole-gene deletion, so molecular testing - including copy-number analysis,
    since whole-gene deletions are a recognised LDS4 mechanism and are missed by
    sequencing alone - is the definitive discriminator.
  - >-
    Ectopia lentis is characteristic of Marfan syndrome and was not observed in
    the original TGFB2 families.
  - >-
    Hypertelorism, bifid uvula and cleft palate point to the Loeys-Dietz
    spectrum rather than Marfan syndrome.
  - >-
    Widespread arterial tortuosity and aneurysm beyond the aortic root favour
    LDS4; in one reported case it was the appearance of iliac artery ectasia and
    tortuosity at age 38 that prompted revision of a Marfan diagnosis.
  evidence:
  - reference: PMID:34680857
    reference_title: "Differential Diagnosis between Marfan Syndrome and Loeys-Dietz Syndrome Type 4: A Novel Chromosomal Deletion Covering TGFB2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At the age of 38, the appearance of ectasia of the left common iliac
      artery and tortuosity of the iliac arteries suggested the presence of
      LDS4.
    explanation: >-
      Documents the clinical feature that redirected a long-standing Marfan
      diagnosis towards LDS4, and the case in which array-CGH found a whole-gene
      TGFB2 deletion.
  - reference: PMID:34680857
    reference_title: "Differential Diagnosis between Marfan Syndrome and Loeys-Dietz Syndrome Type 4: A Novel Chromosomal Deletion Covering TGFB2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MFS displays ectopia lentis as a distinguishing, characterising feature,
      and thoracic aortic ectasia, aneurysm, dissection, and systemic features as
      manifestations overlapping with LDS4.
    explanation: >-
      States which features separate and which overlap between the two
      disorders.
- name: Loeys-Dietz syndrome (other genetic subtypes)
  disease_term:
    preferred_term: Loeys-Dietz syndrome
    term:
      id: MONDO:0018954
      label: Loeys-Dietz syndrome
  description: >-
    The TGFBR1 (LDS1), TGFBR2 (LDS2), SMAD3 (LDS3), TGFB3 (LDS5), SMAD2 (LDS6)
    and IPO8 subtypes share hypertelorism, bifid uvula/cleft palate, skeletal
    features, arterial tortuosity and aortic aneurysm with LDS4, and are
    distinguished by the causal gene together with severity and a few
    discriminating features.
  distinguishing_features:
  - >-
    The LDS1/LDS2 cardiovascular phenotype is more aggressive, with dissection at
    younger ages and smaller diameters; LDS4 aneurysms typically appear in the
    fourth decade.
  - >-
    Cervical spine instability, a recognised feature of the receptor-related
    subtypes, has not been reported in TGFB2 patients.
  - >-
    Reduced penetrance is more common in TGFB2 families than in the
    receptor-related subtypes.
  - >-
    Discrimination requires identification of the causal gene.
  evidence:
  - reference: PMID:29392890
    reference_title: "A mutation update on the LDS-associated genes TGFB2/3 and SMAD2/3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      For example cervical spine instability has not yet been seen in TGFB2/3
      mutations patients, and craniosynostosis has only been reported once in a
      SMAD3 patient.
    explanation: >-
      Names a concrete feature that separates TGFB2-related disease from the
      receptor-related Loeys-Dietz subtypes.
  - reference: PMID:38919319
    reference_title: "Hereditary Aortic Aneurysms and Dissections."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the clinical course somewhat differs depending on the causative gene, and
      in particular, the risk of dissection is not so high when the causative
      gene is any of the latter three genes
    explanation: >-
      States the gene-dependent difference in dissection risk that separates
      TGFB2 (one of the "latter three" with TGFB3 and SMAD2) from
      TGFBR1/TGFBR2.
- name: Familial thoracic aortic aneurysm and dissection
  disease_term:
    preferred_term: familial thoracic aortic aneurysm and aortic dissection
    term:
      id: MONDO:0019625
      label: familial thoracic aortic aneurysm and aortic dissection
  description: >-
    Because non-penetrance and minimal systemic features are common in TGFB2
    families, LDS4 is regularly ascertained as apparently nonsyndromic familial
    thoracic aortic disease. TGFB2 was in fact discovered by linkage in two
    families ascertained exactly that way, and the systemic features were
    recognised only afterwards.
  distinguishing_features:
  - >-
    Nonsyndromic familial TAAD is most often caused by smooth muscle contractile
    apparatus genes (ACTA2, MYH11, MYLK, PRKG1); LDS4 by TGFB2.
  - >-
    Careful examination for hypertelorism, bifid uvula, high palate, joint
    hypermobility and skin findings will often reclassify an apparently
    nonsyndromic TGFB2 family as LDS4.
  - >-
    TGFB2 is a rare cause of familial thoracic aortic disease: only 2 of 276
    familial probands in the original screen.
  evidence:
  - reference: PMID:22772371
    reference_title: "TGFB2 mutations cause familial thoracic aortic aneurysms and dissections associated with mild systemic features of Marfan syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Therefore, TGFB2 mutations were identified in 2 out of 276 probands with
      familial thoracic aortic disease.
    explanation: >-
      Quantifies how rare TGFB2 is among familial thoracic aortic disease
      probands, which is why it is usually found only on a gene panel.
  - reference: PMID:36832261
    reference_title: "The Role of Genetic Testing in Patients with Heritable Thoracic Aortic Diseases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The risk of acute aortic events differs according to the gene involved and
      to the specific type of mutation.
    explanation: >-
      Establishes that distinguishing LDS4 from other heritable thoracic aortic
      disease is not a nomenclature exercise - the causal gene changes the event
      risk and therefore management.

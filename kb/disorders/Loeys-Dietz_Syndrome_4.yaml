- name: Genetic Counseling and Cascade Testing
  description: >-
    Cascade molecular testing of at-risk relatives is disproportionately
    important in LDS4 because non-penetrance is comparatively common in TGFB2
    families: clinical examination and echocardiography alone will miss carriers
    who have not yet developed - or never develop - aortic disease but who can
    transmit the variant. Copy-number analysis must be included, since
    whole-gene deletions are an established LDS4 mechanism that sequencing alone
    misses.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling

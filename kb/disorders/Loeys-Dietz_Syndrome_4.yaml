- name: Impaired Aortic Root Smooth Muscle Cell Differentiation
  biological_scale: CELLULAR
  description: >-
    A developmental arm that helps explain why the aneurysm in LDS4 is
    concentrated at the aortic root. In human iPSC-derived smooth muscle cells,
    TGFB2 signals distinctively through TGFBR3 (betaglycan) rather than only the
    canonical type I/II receptors, and both TGFB2 and TGFBR3 are enriched in the
    tunica media of the aortic root specifically. TGFB2 haploinsufficiency and
    TGFB2 neutralisation impair differentiation of second heart field-derived
    smooth muscle cells - the lineage that populates the root - and a missense
    TGFB2 variant produced measurable mechanical defects in engineered smooth
    muscle tissue rings that were rescued by adding back TGFB2. This arm is
    grounded entirely in an in vitro human system; it complements rather than
    replaces the paradoxical-signalling arm.

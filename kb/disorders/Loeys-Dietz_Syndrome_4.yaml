prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: UNKNOWN
  notes: >-
    No population prevalence has been established for LDS4 specifically. The
    2018 mutation update catalogued 30 distinct TGFB2 variants; the original
    screen found TGFB2 mutations in only 2 of 276 familial thoracic aortic
    disease probands. Loeys-Dietz syndrome as a whole has been quoted at roughly
    1 in 100,000, of which LDS4 is one of six genetic subtypes and not the
    commonest. Because non-penetrance is comparatively common in TGFB2 families,
    ascertained case counts almost certainly understate the number of variant
    carriers.
  evidence:
  - reference: PMID:22772371
    reference_title: "TGFB2 mutations cause familial thoracic aortic aneurysms and dissections associated with mild systemic features of Marfan syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Therefore, TGFB2 mutations were identified in 2 out of 276 probands with
      familial thoracic aortic disease.
    explanation: >-
      The only systematic denominator available for TGFB2 among familial
      thoracic aortic disease probands.
  - reference: PMID:39737004
    reference_title: "Novel variant alters splicing of TGFB2 in family with features of Loeys-Dietz syndrome."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Loeys-Dietz syndrome (LDS) is a rare connective tissue disorder with a
      prevalence of 1 in 100,000 individuals
    explanation: >-
      Gives the prevalence of Loeys-Dietz syndrome as a whole. Marked PARTIAL
      because it is not specific to the TGFB2 subtype, which is one of six and
      not the commonest.

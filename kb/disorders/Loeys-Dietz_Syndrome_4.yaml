  - reference: PMID:27782106
    reference_title: "A missense TGFB2 variant p.(Arg320Cys) causes a paradoxical and striking increase in aortic TGFB1/2 expression."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Histologic examination showed fragmentation and disruption of the aortic
      elastic fibers and cystic medial necrosis
    explanation: >-

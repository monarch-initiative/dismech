- name: Paradoxical Aortic TGF-beta Signaling Dysregulation
  biological_scale: MOLECULAR
  conforms_to: "aortopathy_tgfbeta_dysregulation#TGF-beta Signaling Dysregulation"
  description: >-
    Despite the loss-of-function genetics, aortic wall tissue from TGFB2-variant
    patients shows the same high-TGF-beta tissue signature as the rest of the
    Loeys-Dietz spectrum: increased nuclear phosphorylated SMAD2 in medial
    smooth muscle cells and increased CTGF expression, together with
    paradoxically increased TGF-beta 2 and TGF-beta 1 ligand expression and
    protein. In the Tgfb2 heterozygous mouse both the canonical (pSmad2/3) and
    non-canonical (pErk1/2) arms are activated, so the dysregulation is not
    confined to the SMAD branch. This node is the conserved hub of the
    heritable-aortopathy module, reached here from a ligand rather than a
    receptor lesion.

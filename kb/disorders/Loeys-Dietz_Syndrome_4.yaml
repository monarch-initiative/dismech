name: Loeys-Dietz Syndrome 4
creation_date: "2026-08-18T00:00:00Z"
category: Mendelian
description: >-
  Loeys-Dietz syndrome 4 (LDS4) is the TGFB2-related subtype of the Loeys-Dietz
  spectrum: an autosomal dominant heritable thoracic aortic disease caused by
  heterozygous loss-of-function variants in TGFB2, the gene encoding the
  transforming growth factor beta 2 ligand. It was defined in 2012 by two
  simultaneous reports - Lindsay et al. described heterozygous TGFB2 mutations
  and deletions producing a phenotype within the Loeys-Dietz spectrum, and
  Boileau et al. mapped familial thoracic aortic aneurysm and dissection with
  mild systemic Marfan-like features to the same gene. LDS4 sits at the milder
  end of the Loeys-Dietz spectrum: aortic root aneurysm is the principal
  cardiovascular lesion but typically presents in the fourth decade rather than
  in childhood, dissection is less frequent than in TGFBR1/TGFBR2-related
  disease, and non-penetrance within families is comparatively common, so
  apparently unaffected obligate carriers are recurrently reported. Skeletal and
  articular features - joint hypermobility, scoliosis, pectus deformity,
  arachnodactyly, recurrent hernia, chronic pain - are often the presenting
  complaint and may be the only manifestation. Craniofacial features
  (hypertelorism, bifid uvula, high palate, and, as first reported in the 2018
  mutation update, cleft palate) place the disorder in the Loeys-Dietz rather
  than the Marfan category, while cervical spine instability - characteristic of
  LDS1/LDS2 - has not yet been reported in TGFB2 patients. The defining
  mechanistic paradox of the disorder is that predicted haploinsufficient TGFB2
  alleles produce aortic tissue with increased TGF-beta signalling (nuclear
  pSMAD2, CTGF) and paradoxically increased TGF-beta 2 and TGF-beta 1
  expression, so the proximal defect and the tissue signature run in opposite
  directions.

- name: Progressive Aortic Root Dilation
  biological_scale: ORGANISM
  conforms_to: "aortopathy_tgfbeta_dysregulation#Progressive Aortic Dilation and Aneurysm"
  description: >-
    Aortic root dilation at the sinuses of Valsalva is the principal
    cardiovascular manifestation. In LDS4 it characteristically appears later
    than in the receptor-related subtypes - typically in the fourth decade - and
    progresses more slowly, which is the clinical basis for calling LDS4 the mild
    end of the Loeys-Dietz spectrum. Aneurysm and ectasia elsewhere in the
    arterial tree (iliac, carotid, vertebral, cerebral, pulmonary) and arterial
    tortuosity also occur, so surveillance cannot be limited to
    echocardiography of the root.
  evidence:
  - reference: PMID:25163805
    reference_title: "Further delineation of Loeys-Dietz syndrome type 4 in a family with mild vascular involvement and a TGFB2 splicing mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      LDS4 represents the mildest end of the LDS spectrum, since aneurysms are

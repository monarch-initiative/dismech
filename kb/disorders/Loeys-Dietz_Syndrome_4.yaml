    reference_title: "Loeys-Dietz Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Increased frequency of aortic imaging is recommended, both during
      pregnancy and in the weeks following delivery.
    explanation: >-
      GeneReviews states the peripartum imaging intensification recommended for
      Loeys-Dietz syndrome.
  - reference: PMID:20301312
    reference_title: "Loeys-Dietz Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pregnancy and the postpartum period can be dangerous for women with LDS
      because of increased risk of aortic dissection/rupture and uterine
      rupture.
    explanation: >-
      States the risk that the counselling and intensified imaging are directed
      at.
  - reference: PMID:30725712
    reference_title: "Angiotensin II Receptor Blockers (ARB)."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These medications are contraindicated during pregnancy
    explanation: >-
      Supports the medication-review component: the angiotensin receptor blocker
      that is first-line therapy outside pregnancy cannot be continued through
      one. Marked PARTIAL as a class-level safety statement, not
      Loeys-Dietz-specific evidence.
- name: Allergy and Gastrointestinal Inflammation Management
  description: >-
    Standard treatment of allergic and gastrointestinal inflammatory
    complications, with referral to allergy/immunology in severe disease. Two
    LDS-specific caveats make this more than generic atopy care: the
    agents-to-avoid list for the aorta includes routine decongestants, which
    constrains symptomatic management, and the immuno-allergic phenotype is
    itself an active research question rather than settled biology. No
    disease-modifying therapy directed at the allergic arm exists.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Supportive Care

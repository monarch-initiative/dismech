      Standard treatment for allergic complications with consideration of
      referral to an allergy/immunology specialist in those with severe disease.
    explanation: >-
      GeneReviews states the management approach to the allergic manifestations
      of Loeys-Dietz syndrome.
clinical_trials:
- name: NCT05472519
  phase: NOT_APPLICABLE
  status: COMPLETED
  description: >-
    I-LoDiS, a descriptive clinical-biological study of the immune
    subpopulations affected in Loeys-Dietz syndrome, measuring follicular helper
    T cells and intracellular phosphorylated SMAD2/3. It is the only registered
    study addressing the paradox curated in this entry - that an
    immunosuppressive cytokine pathway produces an atopic phenotype - and it
    reads out the same pSMAD2/3 signal whose direction is the subject of the
    tgfb2_signaling_direction_paradox discussion. It is not LDS4-specific: no
    TGFB2-restricted trial exists, and the registration names TGFBR1/TGFBR2 as
    the primary genotypes.
  target_phenotypes:
  - preferred_term: Allergic and inflammatory disease predisposition
    term:
      id: HP:0012393
      label: Allergy
  - preferred_term: Asthma
    term:
      id: HP:0002099
      label: Asthma
  evidence:
  - reference: clinicaltrials:NCT05472519
    reference_title: "Immunopathology of Loeys-Dietz Syndrome"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      the investigators propose to perform a descriptive clinical-biological
      study to identify and study the immune subpopulations most impacted by the
      causative mutations of LDS
    explanation: >-
      States the study objective, which is the immunological arm of the LDS
      phenotype curated in this entry.
  - reference: clinicaltrials:NCT05472519
    reference_title: "Immunopathology of Loeys-Dietz Syndrome"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The immuno-allergic complications appear paradoxical because of the major
      immunosuppressive role of this cytokine on lymphoid and myeloid immune
      lineages.
    explanation: >-
      States the paradox that motivates the trial, the immunological counterpart
      of the aortic signalling-direction paradox recorded in the discussions.
  notes: >-
    Included despite not being TGFB2-restricted because no LDS4-specific trial
    is registered and because its readouts bear directly on two curated open
    questions. Its evidence is marked OTHER throughout: a registration record
    describes a planned study, it is not study evidence, and no results are
    quoted here.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: UNKNOWN
  notes: >-
    No population prevalence has been established for LDS4 specifically. The
    2018 mutation update catalogued 30 distinct TGFB2 variants; the original
    screen found TGFB2 mutations in only 2 of 276 familial thoracic aortic
    disease probands. Loeys-Dietz syndrome as a whole has been quoted at roughly
    1 in 100,000, of which LDS4 is one of six genetic subtypes and not the
    commonest. Because non-penetrance is comparatively common in TGFB2 families,
    ascertained case counts almost certainly understate the number of variant
    carriers.
  evidence:
  - reference: PMID:22772371
    reference_title: "TGFB2 mutations cause familial thoracic aortic aneurysms and dissections associated with mild systemic features of Marfan syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Therefore, TGFB2 mutations were identified in 2 out of 276 probands with
      familial thoracic aortic disease.
    explanation: >-
      The only systematic denominator available for TGFB2 among familial
      thoracic aortic disease probands.
  - reference: PMID:39737004
    reference_title: "Novel variant alters splicing of TGFB2 in family with features of Loeys-Dietz syndrome."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Loeys-Dietz syndrome (LDS) is a rare connective tissue disorder with a
      prevalence of 1 in 100,000 individuals
    explanation: >-
      Gives the prevalence of Loeys-Dietz syndrome as a whole. Marked PARTIAL
      because it is not specific to the TGFB2 subtype, which is one of six and
      not the commonest.

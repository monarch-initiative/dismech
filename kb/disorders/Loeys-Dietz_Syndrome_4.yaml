    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The aortic pathology typical for thoracic aortic disease was found, which
      is characterized by fragmentation and loss of elastin fibers and
      accumulation of proteoglycans in the tunica media
    explanation: >-
      Describes the medial lesion directly in aortic tissue from two TGFB2

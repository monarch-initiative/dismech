  - reference: PMID:29392890
    reference_title: "A mutation update on the LDS-associated genes TGFB2/3 and SMAD2/3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      increased pSMAD2 and CTGF expression was observed in the aortic media of
      patients with either loss‐of‐function TGFB2 or TGFB3 mutations, further
      confirming the paradoxical observation of increased TGF‐β signaling in
      vivo
    explanation: >-
      Localises the increased canonical signalling and its transcriptional
      output (CTGF) specifically to the aortic media of TGFB2 patients.
  - reference: PMID:27782106
    reference_title: "A missense TGFB2 variant p.(Arg320Cys) causes a paradoxical and striking increase in aortic TGFB1/2 expression."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There was striking upregulation of TGFB1 and TGFB2 expression on

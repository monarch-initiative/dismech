name: Loeys-Dietz Syndrome 4
creation_date: "2026-08-18T00:00:00Z"
category: Mendelian
description: >
  Loeys-Dietz syndrome 4 (LDS4) is an autosomal dominant connective tissue
  disorder caused by heterozygous loss-of-function variants in TGFB2.
disease_term:
  preferred_term: Loeys-Dietz syndrome 4
  term:
    id: MONDO:0013897
    label: Loeys-Dietz syndrome 4
pathophysiology:
- name: TGFB2 Haploinsufficiency
  description: >
    Heterozygous TGFB2 loss-of-function reduces TGF-beta 2 ligand availability.
phenotypes:
- name: Thoracic aortic aneurysm
  description: >
    Aortic root aneurysm with risk of dissection.

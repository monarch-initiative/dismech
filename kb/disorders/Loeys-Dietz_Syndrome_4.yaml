inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    LDS4 is inherited in an autosomal dominant manner. Heterozygous TGFB2
    loss-of-function variants segregate with thoracic aortic disease in large
    multigenerational pedigrees, and whole-gene deletions at 1q41 produce the
    same phenotype through haploinsufficiency. Penetrance is incomplete and
    expressivity is highly variable even within a single family: reduced
    penetrance is more common in TGFB2 families than in the receptor-related
    Loeys-Dietz subtypes, so an obligate carrier may be entirely unaffected.
    This is the key practical consequence of the genetics - cascade testing,
    not clinical screening alone, is what identifies at-risk relatives.
  evidence:
  - reference: PMID:20301312
    reference_title: "Loeys-Dietz Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      LDS caused by a pathogenic variant in SMAD2, SMAD3, TGFB2, TGFB3, TGFBR1,
      or TGFBR2 is inherited in an autosomal dominant manner.
    explanation: >-
      GeneReviews states autosomal dominant inheritance for the TGFB2-related
      subtype among the other Loeys-Dietz genes.
  - reference: PMID:22772371
    reference_title: "TGFB2 mutations cause familial thoracic aortic aneurysms and dissections associated with mild systemic features of Marfan syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These mutations-a frameshift mutation in exon 6 and a nonsense mutation in
      exon 4-segregated with disease with a combined logarithm of odds (LOD)
      score of 7.7.
    explanation: >-
      Quantifies the dominant segregation of TGFB2 loss-of-function alleles with
      thoracic aortic disease in two large unrelated families.
  - reference: PMID:29392890
    reference_title: "A mutation update on the LDS-associated genes TGFB2/3 and SMAD2/3."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Non‐penetrance seems more common in TGFB2/3 families.
    explanation: >-
      Qualifies the dominant inheritance: penetrance is reduced relative to the
      TGFBR1/2 subtypes, which is why apparently sporadic presentations and
      clinically unaffected obligate carriers recur in TGFB2 families.
  - reference: PMID:41170304
    reference_title: "A Novel Mutation of TGFB2 Gene Responsible of Loeys-Dietz 4 Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The pedigree analysis highlighted the high clinical variability of LDS
      signs even within the same family.
    explanation: >-
      Documents intrafamilial variable expressivity in a TGFB2 pedigree, the
      companion observation to reduced penetrance.
pathophysiology:
- name: TGFB2 Loss-of-Function Variant
  biological_scale: MOLECULAR
  conforms_to: "aortopathy_tgfbeta_dysregulation#Aortic Wall ECM or Contractile Apparatus Defect"
  description: >-
    Heterozygous TGFB2 variants are the genetic trigger of LDS4. The reported
    allelic spectrum is dominated by predicted loss-of-function classes -
    nonsense, frameshift, splice-site and whole- or partial-gene deletion - with
    a minority of missense alleles; deletions at 1q41 encompassing the whole
    gene produce the same phenotype, which is the strongest human argument that
    the mechanism is simple haploinsufficiency rather than a dominant-negative
    protein. A substantial share of the reported variants fall in the
    latency-associated peptide (LAP) domain or the RKKR furin cleavage motif
    required to release the mature TGF-beta 2 cytokine from LAP. Where a
    frameshift escapes nonsense-mediated decay, the mutant transcript is present
    but the proprotein is degraded, so the net effect is still reduced cellular
    TGF-beta 2.
  genes:
  - preferred_term: TGFB2
    term:
      id: hgnc:11768
      label: TGFB2
  evidence:
  - reference: PMID:22772368
    reference_title: "Loss-of-function mutations in TGFB2 cause a syndromic presentation of thoracic aortic aneurysm."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report heterozygous mutations or deletions in the gene encoding
      the TGF-β2 ligand for a phenotype within the LDS spectrum
    explanation: >-
      The defining observation for LDS4: heterozygous TGFB2 mutations and
      whole-gene deletions produce a Loeys-Dietz-spectrum phenotype.
  - reference: PMID:22772371
    reference_title: "TGFB2 mutations cause familial thoracic aortic aneurysms and dissections associated with mild systemic features of Marfan syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the mutations are predicted to cause haploinsufficiency for TGFB2
    explanation: >-
      States the predicted molecular consequence of the identified alleles.
  - reference: PMID:22772371
    reference_title: "TGFB2 mutations cause familial thoracic aortic aneurysms and dissections associated with mild systemic features of Marfan syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These data suggest that although the deleted transcript is expressed, the
      mutant protein is rapidly degraded by an endoplasmic reticulum-associated
      degradation pathway, resulting in decreased cellular levels of wildtype
      TGF-β2.
    explanation: >-
      Explains how a frameshift allele that escapes nonsense-mediated decay
      still yields functional haploinsufficiency - the protein, not the message,
      is lost.
  - reference: PMID:29392890
    reference_title: "A mutation update on the LDS-associated genes TGFB2/3 and SMAD2/3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      For TGFB2, 23% of mutations are located in the exons coding for the active
      TGF‐β2 cytokine and 28% reside in the RKKR‐motif, a proteolytic cleavage
      site responsible for releasing mature TGF‐β2 from the latency‐associated
      peptide (LAP).
    explanation: >-
      Describes the domain distribution of TGFB2 alleles, including the
      enrichment at the furin cleavage motif needed to liberate the mature
      ligand.
  downstream:
  - target: Reduced TGF-beta 2 Ligand Availability
    description: >-
      Loss of one functional TGFB2 allele halves the cellular supply of mature
      TGF-beta 2 ligand.
- name: Reduced TGF-beta 2 Ligand Availability
  biological_scale: MOLECULAR
  description: >-
    The proximal biochemical consequence of a TGFB2 loss-of-function allele is
    reduced cellular TGF-beta 2 proprotein and mature ligand. In smooth muscle
    cells and dermal fibroblasts from affected family members, TGFB2 transcript
    levels were comparable to control but TGF-beta 2 proprotein was reduced and
    no truncated protein was detectable. Crucially, this reduction is measured in
    peripheral cells and is the opposite of what the diseased aorta shows, which
    is what sets up the disorder's central paradox.

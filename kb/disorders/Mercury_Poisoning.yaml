diagnosis:
- name: Blood, hair, and toenail mercury measurement
  description: >-
    Mercury concentration in blood, hair, and toenail samples documents exposure
    and is the standard laboratory approach to suspected mercury poisoning.
    Interpretation is bounded: in patients presenting with established chronic
    neurological disease these matrices may not reflect the remote exposure that
    caused the neuronal injury, so a normal result late in the course does not
    exclude prior methylmercury poisoning.
  diagnosis_term:
    preferred_term: Laboratory Procedure
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  evidence:
  - reference: PMID:30278852
    reference_title: "Chronic Neurological Disease Due to Methylmercury Poisoning."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Laboratory tests (e.g., on blood and hair and toenail samples) are of limited
      value in the assessment of chronic neurological disease due to mercury
      poisoning because they may not reflect remote neuronal injury due to mercury.
    explanation: >-
      Names the standard exposure matrices while explicitly bounding their value
      in chronic disease; marked PARTIAL because the source qualifies rather than
      endorses the test.
- name: Umbilical cord mercury concentration for prenatal exposure
  description: >-
    Archived umbilical cord tissue provides a retrospective measure of in-utero
    methylmercury exposure and has been used to grade prenatal exposure against
    neuropsychological outcome in the Minamata population.
  diagnosis_term:
    preferred_term: Laboratory Procedure
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  evidence:
  - reference: PMID:37372760
    reference_title: "Neurological and Neurocognitive Impairments in Adults with a History of Prenatal Methylmercury Poisoning: Minamata Disease."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The average umbilical cord methylmercury concentrations were 1.67 parts per
      million (ppm) for CMD patients and 0.77 ppm for moderately exposed participants.
    explanation: >-
      Umbilical cord methylmercury concentration is used as the quantitative index
      of prenatal exposure in this Minamata cohort.
treatments:
- name: Exposure cessation and source control
  description: >-
    Identifying and eliminating the mercury source is the primary intervention.
    For methylmercury this means removing the contaminated dietary source; for
    the inorganic/elemental arm it means removing the occupational or product
    exposure. This prevents further accumulation but does not reverse established
    neuronal injury.
  treatment_term:
    preferred_term: therapeutic procedure
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  evidence:
  - reference: PMID:37372760
    reference_title: "Neurological and Neurocognitive Impairments in Adults with a History of Prenatal Methylmercury Poisoning: Minamata Disease."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      is a well-known case of food poisoning caused by methylmercury-contaminated
      fish
    explanation: >-
      The snippet establishes the contaminated dietary exposure route but does
      not directly evaluate cessation or source control as an intervention.
- name: Supportive and rehabilitative care for established neurological injury
  description: >-
    Management of established methylmercury neurological disease is supportive:
    there is no effective disease-modifying treatment for the neuronal injury
    once it has occurred. Care targets the resulting ataxia, sensory disturbance,
    visual field loss, dysarthria, and cognitive impairment.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:30278852
    reference_title: "Chronic Neurological Disease Due to Methylmercury Poisoning."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There is no effective treatment."
    explanation: >-
      The source states plainly that no effective treatment exists for chronic
      neurological disease from methylmercury, which is why management is
      supportive.
discussions:
- discussion_id: gap_mercury_inorganic_arm_not_curated
  prompt: >-
    What are the pathophysiology nodes, phenotypes, and treatments of the
    elemental and inorganic mercury arms, which this entry names but does not
    yet model?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Methylmercury CNS Accumulation and Neuronal Injury
  rationale: >-
    The entry is scoped to mercury poisoning generally and its description
    contrasts the organic and inorganic clinical profiles, but every
    pathophysiology node, phenotype, and exposure record curated so far concerns
    methylmercury and Minamata disease. The inorganic/elemental arm — mercury
    vapour pneumonitis, erethism, acrodynia, and mercury-associated membranous
    nephropathy — has a distinct mechanism, a distinct target-organ profile, and
    (unlike established methylmercury neuronal injury) a chelation-responsive
    course. Leaving it unmodelled makes the entry read as complete for a disease
    for which only one arm is represented.
  proposed_experiments:
  - experiment_id: exp_mercury_curate_inorganic_arm
    name: Curate the elemental/inorganic mercury arm
    description: >-
      Build the inorganic/elemental pathograph from primary literature: vapour
      inhalation to chemical pneumonitis; mercuric ion binding to renal tubular
      and glomerular targets to membranous nephropathy and nephrotic syndrome;
      and CNS deposition to erethism and tremor. Add the chelation treatments
      (succimer/DMSA, unithiol/DMPS) that apply to that arm and not to
      established methylmercury injury.
  evidence:
  - reference: PMID:30278852
    reference_title: "Chronic Neurological Disease Due to Methylmercury Poisoning."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In contrast, peripheral nerve disease is more characteristic of inorganic
      mercury intoxication.
    explanation: >-
      Establishes that the inorganic arm has a clinically distinct profile from
      the methylmercury arm modelled here, which is what makes its absence a gap.

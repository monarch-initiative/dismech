    reference_title: "Prognostic significance of somatic mutations in myeloid cells of men with chronic heart failure - interaction between loss of Y chromosome and clonal haematopoiesis."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "Age-associated clonal haematopoiesis of indeterminate potential (CHIP) has been linked to increased incidence and worse prognosis of chronic heart failure (CHF)."
    explanation: >-
      The study's background states the human association between CHIP and
      chronic heart failure incidence and prognosis.

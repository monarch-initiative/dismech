      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "Accelerated atherosclerosis and neutrophil extracellular trap formation (NETosis) in Tet2 CH mice were reversed by holomycin, a BRCC3 deubiquitinase inhibitor, and also by hematopoietic deficiency of Abro1, an essential scaffolding protein in the BRCC3-containing cytosolic complex."
      explanation: >-
        Blocking the BRCC3-NLRP3 step reverses Tet2 CH atherosclerosis in
        mice. INDIRECT for the human phenotype because it is a mouse model.
  - target: Heart failure
    description: >-
      In mouse pressure-overload and coronary-ligation models, hematopoietic
      or myeloid Tet2 deficiency worsens cardiac remodelling with raised

treatments:
- name: Surveillance and Comorbidity Management
  description: >-
    No CH-specific therapy is approved and there are no consensus management
    guidelines, so care is individualized. Its usual elements are risk
    stratification, surveillance for progression and mitigation of
    cardiovascular and other comorbidities.
  action_category: MONITORING
  treatment_term:
    preferred_term: hematologic surveillance and comorbidity management
  notes: >-
    Left unbound: NCIT:C15719 Surveillance sits under Clinical Study rather
    than Clinical Intervention or Procedure, so it is outside the
    TreatmentActionTerm dynamic enum.
  evidence:
  - reference: PMID:42735000
    reference_title: "Clinical management of clonal hematopoiesis."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: "In the absence of consensus guidelines and approved therapies, management remains individualized, underscoring the need for continued research and clinical trials to guide evidence-based care and improve patient outcomes."
    explanation: States that CH has no approved therapy or consensus guideline and that management is individualized.
  - reference: PMID:42735000
    reference_title: "Clinical management of clonal hematopoiesis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In this review, we focus on the clinical management of clonal hematopoiesis, including approaches to diagnosis, tools for risk stratification, and strategies for surveillance and comorbidity mitigation."
    explanation: Lists the components of current CH management covered by the review.
- name: Low-Dose Colchicine (Investigational)
  description: >-
    Not an approved CH therapy. In an exploratory substudy of the LoDoCo2
    trial in chronic coronary disease, low-dose colchicine was associated
    with slower expansion of TET2-mutant clones than placebo. A cardiology
    review suggests that IL-1β inhibition and colchicine may benefit TET2
    CHIP carriers in particular, but no prospective genotype-stratified trial
    has tested this.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:

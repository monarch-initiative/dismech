    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "inhibition of the inflammasome product interleukin-1β appeared to particularly benefit patients with TET2 CH in CANTOS"
    explanation: The background of a mechanistic study summarises the CANTOS finding for TET2 CH.
  - reference: PMID:38701435
    reference_title: "Effect of Clonal Hematopoiesis Mutations and Canakinumab Treatment on Incidence of Solid Tumors in the CANTOS Randomized Clinical Trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with TET2 mutations treated with canakinumab had the lowest incidence of non-hematological malignancy across cancer types."
    explanation: In CANTOS, TET2 carriers on canakinumab had the lowest incidence of non-hematological cancer.
discussions:
- discussion_id: knowledge_gap_ch_bacterial_infection_mechanism
  prompt: >-
    By what mechanism does clonal hematopoiesis raise the risk of serious
    bacterial infection, and why is the risk specific to bacterial rather
    than viral infection?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - phenotypes#Serious bacterial infection
  - pathophysiology#Altered Hematopoietic Progenitor Signalling
  rationale: >-
    The association is large, graded by gene and clone size, and survives
    adjustment for comorbidity, cytopenia and cancer, but no mechanism is
    established. The only mechanistic lead is a cross-sectional proteomic
    perturbation of the FLT3/FLT3 ligand axis. That CH is associated with
    bacterial but not viral infection, and with all common bacterial species
    alike, points to a defect in a general antibacterial effector arm, such
    as neutrophil or monocyte function, rather than a pathogen-specific
    response. Functional studies of mutant myeloid cells from carriers
    stratified by gene and clone size would test this.
  evidence:
  - reference: PMID:42982834
    reference_title: "Clonal haematopoiesis subtypes confer dose-dependent risk of serious bacterial infection."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "however, the mechanisms by which CH leads to immune system dysfunction remain poorly understood"
    explanation: States that the mechanism of CH-associated immune dysfunction is unknown.
  - reference: PMID:42982834
    reference_title: "Clonal haematopoiesis subtypes confer dose-dependent risk of serious bacterial infection."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Interestingly, no association was identified between CH and viral infections, including severe COVID-19 infection, in this study"
    explanation: The infection risk is specific to bacteria.

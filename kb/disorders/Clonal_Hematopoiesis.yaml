    reference_title: "Clonal haematopoiesis subtypes confer dose-dependent risk of serious bacterial infection."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "displayed greatly elevated rates of SBI once expanded"
    explanation: Expanded DNMT3A clones carry raised infection risk despite DNMT3A being the mildest subtype.
  - reference: PMID:42982834
    reference_title: "Clonal haematopoiesis subtypes confer dose-dependent risk of serious bacterial infection."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Large clonal R882 expansions were more common but only 9% of individuals developed a SBI in the same time-frame"
    explanation: Absolute 10-year infection risk for large DNMT3A R882 clones.

name: Clonal Hematopoiesis
creation_date: "2026-11-10T00:00:00Z"
category: Complex
categories:
- Hematologic Disorder
- Premalignant Condition
synonyms:
- Clonal haematopoiesis
- CH
- Age-related clonal hematopoiesis
description: >-
  Clonal hematopoiesis (CH) is the expansion in blood of a clone derived from a
  single hematopoietic stem cell that has acquired a somatic driver mutation,
  most often in DNMT3A, TET2 or ASXL1, and less often in JAK2, in the
  splicing-factor genes SRSF2 and SF3B1 or at recurrent hotspots such as IDH2
  R140 and NRAS G12.
  It is common and age-dependent, detectable in roughly a tenth of people in
  their seventies, and is defined by the absence of a diagnosed hematological
  neoplasm. CH raises the risk of myeloid malignancy and is also associated
  with non-malignant outcomes, including coronary heart disease, stroke,
  heart failure and serious bacterial infection (sepsis and bacterial
  pneumonia). Risk is not uniform:
  it depends on which gene or residue is mutated and on clone size, measured
  as variant allele fraction. Large splicing-factor clones carry the highest
  infection risk, and co-occurring mutations add to it. The mechanism linking
  CH to impaired host defence against bacteria is not established. For TET2
  clones, mouse and cell studies trace the cardiovascular risk to NLRP3
  inflammasome activation and IL-1β signalling in mutant macrophages. No
  CH-specific therapy is approved: management is individualized surveillance
  and comorbidity care, and anti-inflammatory treatment of TET2 CH is
  investigational.
parents:
- premalignant hematological system disease
disease_term:
  preferred_term: clonal hematopoiesis
  term:
    id: MONDO:0100542
    label: clonal hematopoiesis
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0100542
      label: clonal hematopoiesis
    mapping_predicate: skos:exactMatch
    mapping_source: MONDO
    mapping_justification: >-
      Primary MONDO class for clonal expansion of hematopoietic cells derived
      from a single stem-cell lineage, without a diagnosed hematological
      neoplasm. CHIP and age-related CH are its MONDO children and are carried
      as subtypes here.
review_notes: >-
  Anchored at clonal hematopoiesis rather than CHIP because the infection
  study that motivates the entry calls CH by its own somatic-variant pipeline
  at all clone sizes, including clones below the 2% variant-allele-fraction
  threshold that defines CHIP. Gene- and hotspot-level risk differences are
  recorded on the genetic rows rather than as separate subtypes, because the
  field does not name them as separate conditions.
has_subtypes:
- name: CHIP
  display_name: Clonal hematopoiesis of indeterminate potential
  description: >-
    Clonal hematopoiesis with a somatic driver mutation in blood or marrow
    cells, without morphologic evidence of hematological neoplasia.
  subtype_term:
    preferred_term: clonal hematopoiesis of indeterminate potential
    term:
      id: MONDO:0100543
      label: clonal hematopoiesis of indeterminate potential
- name: ARCH
  display_name: Age-related clonal hematopoiesis
  description: >-
    Gradual, age-associated clonal expansion of hematopoietic stem and
    progenitor cells carrying recurrent driver variants, in people without a
    diagnosed hematological malignancy.
  subtype_term:
    preferred_term: age-related clonal hematopoiesis
    term:
      id: MONDO:0100544
      label: age-related clonal hematopoiesis
inheritance:
- name: Somatic mosaicism (not inherited)
  inheritance_term:
    preferred_term: Typified by somatic mosaicism
    term:
      id: HP:0001442
      label: Typified by somatic mosaicism
  description: >-
    CH is an acquired somatic mosaic of the blood: a post-zygotic driver
    mutation in one hematopoietic stem cell expands into a clone, leaving a
    mixture of mutant and normal blood cells. It is not transmitted through
    the germline.
  evidence:
  - reference: PMID:42982834
    reference_title: "Clonal haematopoiesis subtypes confer dose-dependent risk of serious bacterial infection."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clonal haematopoiesis (CH) arises from somatic mutations in haematopoietic stem cells that drive clonal expansion and increase haematological malignancy risk."
    explanation: >-
      States that CH arises from somatic, not germline, mutations in
      hematopoietic stem cells.
prevalence:
- population: >-
    UK Biobank, Genomics England and Alliance for Genomic Discovery
    participants (590,537 individuals)
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 6870.0
  notes: >-
    6.87% of participants carried at least one CH driver mutation across 43
    genes at the time of sampling. Prevalence depends on the variant-calling
    threshold and on cohort age; median cohort ages were 49 to 60 years.
  evidence:
  - reference: PMID:42982834
    reference_title: "Clonal haematopoiesis subtypes confer dose-dependent risk of serious bacterial infection."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified 19,822 mutations across 43 CH genes in 40,560 of 590,537 individuals from three population cohorts (6.87%)"
    explanation: Population prevalence of CH in the discovery cohorts.
- population: Adults aged 70 to 79 years (exome sequencing, 17,182 individuals unselected for hematologic phenotype)
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 9500.0
  notes: >-
    Age-graded: 9.5% at 70-79, 11.7% at 80-89 and 18.4% at 90-108 years;
    rare below 40.
  evidence:
  - reference: PMID:25426837
    reference_title: "Age-related clonal hematopoiesis associated with adverse outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among persons 70 to 79 years of age, 80 to 89 years of age, and 90 to 108
      years of age, these clonal mutations were observed in 9.5% (219 of 2300
      persons), 11.7% (37 of 317), and 18.4% (19 of 103), respectively.
    explanation: Age-specific prevalence of detectable clonal mutations.
diagnosis:
- name: Somatic mutation detection in peripheral blood (CHIP working definition)
  description: >-
    CH is found by sequencing blood or marrow for somatic variants in genes
    recurrently mutated in hematological cancer. The CHIP subtype has a
    working definition: a hematological-malignancy-associated somatic
    mutation at a variant allele fraction of at least 2% in peripheral blood,
    with no other diagnostic criteria for a hematological malignancy. The 2%
    cutoff is a convention set by the sensitivity of sequencing and by the
    clone sizes in the outcome studies. It is not a biological boundary, and
    clones below it are still CH (ARCH) and still carry risk in this entry's
    infection data. Excluding MDS needs the absence of dysplasia on marrow
    morphology and of an MDS-defining karyotype.
  evidence:
  - reference: PMID:25931582
    reference_title: "Clonal hematopoiesis of indeterminate potential and its distinction from myelodysplastic syndromes."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: PRIMARY_RESULT
    snippet: "We propose the term clonal hematopoiesis of indeterminate potential (CHIP) to describe individuals with a hematologic malignancy-associated somatic mutation in blood or marrow, but without other diagnostic criteria for a hematologic malignancy."
    explanation: The expert proposal that defines CHIP by a malignancy-associated somatic mutation without other criteria for a hematological malignancy.
  - reference: PMID:25931582
    reference_title: "Clonal hematopoiesis of indeterminate potential and its distinction from myelodysplastic syndromes."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: PRIMARY_RESULT
    snippet: "We also propose that as a working definition, the mutant allele fraction must be ≥2% in the peripheral blood, because with deep enough sequencing, a mutation can be found in every individual, and current outcomes data are based on a minimum variant allele fraction of >2% in peripheral blood."
    explanation: Sets the 2% variant allele fraction threshold and states why it is a convention.
differential_diagnoses:
- name: Myelodysplastic syndrome
  description: >-
    MDS shares the somatic driver mutations of CH but is defined by
    cytopenia together with dysplastic blood and marrow morphology. A person
    with cytopenia and an MDS-associated mutation who lacks dysplasia does not
    meet MDS criteria. This intermediate state is clonal cytopenia of
    undetermined significance (CCUS), which the cited proposal reports to be
    at least as common as MDS itself. See the Myelodysplastic_Syndrome entry.
  disease_term:
    preferred_term: myelodysplastic syndrome
    term:
      id: MONDO:0018881
      label: myelodysplastic syndrome
  evidence:
  - reference: PMID:25931582
    reference_title: "Clonal hematopoiesis of indeterminate potential and its distinction from myelodysplastic syndromes."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: PRIMARY_RESULT
    snippet: "Therefore, acquisition of somatic mutations that drive clonal expansion in the absence of cytopenias and dysplastic hematopoiesis can be considered clonal hematopoiesis of indeterminate potential (CHIP), analogous to monoclonal gammopathy of undetermined significance and monoclonal B-cell lymphocytosis, which are precursor states for hematologic neoplasms but are usually benign and do not progress."
    explanation: Separates CHIP from MDS by the absence of cytopenia and dysplasia.
  - reference: PMID:25931582
    reference_title: "Clonal hematopoiesis of indeterminate potential and its distinction from myelodysplastic syndromes."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: PRIMARY_RESULT
    snippet: "Other patients with ICUS may have CHIP, differing only from lower risk MDS by their lack of dysplasia and, currently, an undetermined disease risk."
    explanation: Places cytopenic carriers without dysplasia between CHIP and lower-risk MDS.
  - reference: PMID:25931582
    reference_title: "Clonal hematopoiesis of indeterminate potential and its distinction from myelodysplastic syndromes."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: PRIMARY_RESULT
    snippet: "Emerging data indicate that clonal cytopenias without morphologic or cytogenetic evidence of MDS are at least as common as bona fide MDS."
    explanation: Clonal cytopenia without MDS-defining morphology or karyotype (CCUS) is a common state distinct from MDS.
progression:
- phase: Clonal hematopoiesis without hematological neoplasm
  notes: >-
    Most carriers never develop a hematological cancer. Progression to a
    myeloid neoplasm such as MDS or AML runs at about 0.5% to 1% per year,
    comparable with MGUS and monoclonal B-cell lymphocytosis, and rises with
    clone size.
  evidence:
  - reference: PMID:25931582
    reference_title: "Clonal hematopoiesis of indeterminate potential and its distinction from myelodysplastic syndromes."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Individuals with CHIP have an increased risk of disease progression to hematologic neoplasia compared with individuals without detectable mutations, and this risk appears to be proportional to the size of the somatic clone; however, the rate of progression appears to be only 0.5% to 1% per year, similar to MBL and MGUS."
    explanation: Gives the annual rate of progression to hematological neoplasia and its dependence on clone size.
- phase: Long-term outcome (mortality)
  notes: >-
    Carrying a CH mutation was associated with higher all-cause mortality
    (hazard ratio 1.4; 95% CI 1.1 to 1.8) in the founding exome cohorts. The
    excess was not explained by deaths from hematological cancer. In a
    cause-specific analysis, carriers had a higher risk of death from
    cardiovascular causes, which fits the coronary and stroke associations
    recorded in this entry.
  evidence:
  - reference: PMID:25426837
    reference_title: "Age-related clonal hematopoiesis associated with adverse outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "an increase in all-cause mortality (hazard ratio, 1.4; 95% CI, 1.1 to 1.8)"
    explanation: All-cause mortality hazard ratio for CH mutation carriers.
  - reference: PMID:25426837
    reference_title: "Age-related clonal hematopoiesis associated with adverse outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "When we performed a cause-specific mortality analysis, we found that persons with mutations had a higher risk of death from cardiovascular causes but not from cancer"
    explanation: The excess mortality is cardiovascular rather than from cancer.
pathophysiology:
- name: Somatic Driver Mutation in a Hematopoietic Stem Cell
  description: >-
    A hematopoietic stem cell acquires a somatic mutation in a CH driver gene.
    DNMT3A, TET2 and ASXL1 are the most frequently mutated; SRSF2, SF3B1, IDH2
    and NRAS mutations are rarer but carry higher risk.
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: SOMATIC
    description: >-
      Somatic driver mutation in one of the recurrent CH genes, most often
      DNMT3A, TET2 or ASXL1.
  cell_types:
  - preferred_term: hematopoietic stem cell
    term:
      id: CL:0000037
      label: hematopoietic stem cell
  notes: >-
    No genes are bound on this node. The recurrent CH driver genes are a
    DNA methyltransferase (DNMT3A), a methylcytosine dioxygenase (TET2), a
    chromatin regulator (ASXL1) and two splicing factors (SRSF2, SF3B1),
    which share no single molecular function, so each is recorded on its own
    genetic row with variant_origin SOMATIC. TET2 is wired into the graph
    through its own activity node, the one driver whose downstream mechanism
    the cited sources describe.
  downstream:
  - target: Loss of TET2 Methylcytosine Dioxygenase Activity
    description: >-
      When the driver gene is TET2, the mutation is loss of function, removing
      the enzyme's DNA hydroxymethylation activity in the stem cell and its
      progeny.
    evidence:
    - reference: PMID:25426837
      reference_title: "Age-related clonal hematopoiesis associated with adverse outcomes."
      supports: SUPPORT
      quote_role: BACKGROUND
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Murine models of DNMT3A or TET2 loss of function have shown that mutant
        hematopoietic stem cells have altered methylation patterns in pluripotency
        genes and a competitive advantage over wild-type stem cells, but cancer
        rarely develops in mice, and when it does, it develops only after a long
        latency period.
      explanation: >-
        The introduction of this human cohort study summarises mouse work
        modelling CH drivers as loss of function, with altered DNA methylation
        in the mutant stem cells. Model-organism background, so not the only
        support for the human claim.
  - target: Clonal Expansion of Mutant Hematopoietic Stem Cells
    description: >-
      The driver mutation gives the stem cell a growth or survival advantage,
      and its progeny expand into a detectable clone.
    evidence:
    - reference: PMID:28636844
      reference_title: "Clonal Hematopoiesis and Risk of Atherosclerotic Cardiovascular Disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        These mutations, which are also common in the myelodysplastic syndrome and acute
        myeloid leukemia4, provide a selective advantage to the hematopoietic stem cells
        in which they occur5,6, and are detectable as clones in peripheral blood samples
        because the mutated stem cells maintain the ability to differentiate into
        circulating granulocytes, monocytes, and lymphocytes7,8.
      explanation: >-
        The driver mutations give a selective advantage to the stem cell, which
        is why a clone becomes detectable in blood.
  evidence:
  - reference: PMID:42982834
    reference_title: "Clonal haematopoiesis subtypes confer dose-dependent risk of serious bacterial infection."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DNMT3A, TET2, and ASXL1 were the most frequently mutated"
    explanation: Names the most frequently mutated CH driver genes in the discovery cohorts.
- name: Clonal Expansion of Mutant Hematopoietic Stem Cells
  description: >-
    The mutant clone expands and contributes a growing share of blood cells.
    Clone size, measured as variant allele fraction (VAF), grades risk: clones
    with VAF above 0.4 substantially contribute to mature blood cells and carry
    the highest risks of malignancy and of serious bacterial infection.
    Splicing-factor clones (SRSF2) expand quickly and are often found large.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: hematopoietic stem cell
    term:
      id: CL:0000037
      label: hematopoietic stem cell
  locations:
  - preferred_term: bone marrow
    term:
      id: UBERON:0002371
      label: bone marrow
  - preferred_term: blood
    term:
      id: UBERON:0000178
      label: blood
  biological_processes:
  - preferred_term: hematopoietic stem cell proliferation
    modifier: INCREASED
    term:
      id: GO:0071425
      label: hematopoietic stem cell proliferation
  downstream:
  - target: Altered Hematopoietic Progenitor Signalling
    description: >-
      CH carriers show a perturbed FLT3/FLT3 ligand axis in plasma. The authors
      read this as a correlate of clonal expansion, not as an established
      cause of infection risk.
    evidence:
    - reference: PMID:42982834
      reference_title: "Clonal haematopoiesis subtypes confer dose-dependent risk of serious bacterial infection."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "These findings point toward altered haematopoietic progenitor biology as a potential correlate of clonal expansion, although further mechanistic studies will be required to define causal pathways linking CH subtypes to SBI risk."
      explanation: >-
        Frames the proteomic signal as a correlate of clonal expansion and
        states that the causal pathway is undefined.
  - target: Hematological neoplasm
    description: >-
      Clonal expansion is the precursor state of myeloid malignancy, with risk
      rising with clone size and highest for splicing-factor clones.
    evidence:
    - reference: PMID:42982834
      reference_title: "Clonal haematopoiesis subtypes confer dose-dependent risk of serious bacterial infection."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Notably, subtypes defined by molecular lesions in DNMT3A, TET2, ASXL1, SRSF2, and SF3B1 exhibited strong, dose-dependent (size of clonal expansion) relationships with haematological malignancy"
      explanation: Malignancy risk scales with clone size within each major gene subtype.
  - target: Serious bacterial infection
    description: >-
      Carriers have a higher incidence of serious bacterial infection, graded
      by gene and clone size and independent of a diagnosed malignancy. The
      intervening mechanism is unknown, so this edge records the association
      rather than a pathway.
    evidence:
    - reference: PMID:42982834
      reference_title: "Clonal haematopoiesis subtypes confer dose-dependent risk of serious bacterial infection."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Here we show that CH confers mutation- and dose-dependent risk of serious bacterial infection (SBI)."
      explanation: States the gene- and dose-dependent association between CH and SBI.
    - reference: PMID:42982834
      reference_title: "Clonal haematopoiesis subtypes confer dose-dependent risk of serious bacterial infection."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Dose-dependent associations between CH subtypes and SBI were preserved in the cancer-free population"
      explanation: >-
        The association is not explained by occult or diagnosed cancer.
  - target: Coronary artery atherosclerosis
    description: >-
      CH is associated with incident coronary heart disease. For TET2-mutant
      clones, mouse work supplies a mechanism through pro-inflammatory
      macrophages (see TET2-Deficient Macrophage Inflammatory Gene
      Expression); for other driver genes the mechanism is not modelled here.
    evidence:
    - reference: PMID:25426837
      reference_title: "Age-related clonal hematopoiesis associated with adverse outcomes."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The presence of a somatic mutation was associated with an increase in the
        risk of hematologic cancer (hazard ratio, 11.1; 95% confidence interval [CI],
        3.9 to 32.6), an increase in all-cause mortality (hazard ratio, 1.4; 95% CI,
        1.1 to 1.8), and increases in the risks of incident coronary heart disease
        (hazard ratio, 2.0; 95% CI, 1.2 to 3.4) and ischemic stroke (hazard ratio,
        2.6; 95% CI, 1.4 to 4.8).
      explanation: Reports the increased risk of incident coronary heart disease in CH carriers.
  - target: Ischemic stroke
    description: >-
      CH is associated with incident ischemic stroke. The intervening
      mechanism is not established, so this edge records the association.
    evidence:
    - reference: PMID:25426837
      reference_title: "Age-related clonal hematopoiesis associated with adverse outcomes."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The presence of a somatic mutation was associated with an increase in the
        risk of hematologic cancer (hazard ratio, 11.1; 95% confidence interval [CI],
        3.9 to 32.6), an increase in all-cause mortality (hazard ratio, 1.4; 95% CI,
        1.1 to 1.8), and increases in the risks of incident coronary heart disease
        (hazard ratio, 2.0; 95% CI, 1.2 to 3.4) and ischemic stroke (hazard ratio,
        2.6; 95% CI, 1.4 to 4.8).
      explanation: Reports the increased risk of incident ischemic stroke in CH carriers.
  - target: Heart failure
    description: >-
      CH carriers have a higher incidence and a worse prognosis of chronic
      heart failure. For TET2 clones the mouse mechanism runs through the
      NLRP3 inflammasome (see NLRP3 Inflammasome Activation in TET2-Deficient
      Macrophages); for other driver genes it is not modelled here.
    evidence:
    - reference: PMID:40702883
      reference_title: "Prognostic significance of somatic mutations in myeloid cells of men with chronic heart failure - interaction between loss of Y chromosome and clonal haematopoiesis."
      supports: SUPPORT
      quote_role: BACKGROUND
      evidence_source: HUMAN_CLINICAL
      snippet: "Age-associated clonal haematopoiesis of indeterminate potential (CHIP) has been linked to increased incidence and worse prognosis of chronic heart failure (CHF)."
      explanation: >-
        The study's background states the human association between CHIP
        and chronic heart failure incidence and prognosis.
  evidence:
  - reference: PMID:42982834
    reference_title: "Clonal haematopoiesis subtypes confer dose-dependent risk of serious bacterial infection."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SRSF2 clones expand quickly, and are therefore often identified with larger clone sizes, and are preferentially linked to myelodysplastic syndrome (MDS)."
    explanation: Clone growth rate differs by driver gene.
- name: Altered Hematopoietic Progenitor Signalling
  description: >-
    In 53,030 UK Biobank participants with plasma proteomics, CH carriers had
    lower circulating FLT3 ligand and higher FLT3 receptor abundance, while
    the classical inflammatory cytokines IL6 and TNF were not altered after
    multiple-testing correction. This points to altered progenitor signalling
    rather than a systemic inflammatory cytokine signature. It is a
    cross-sectional correlate; whether it lies on the path to infection risk
    is untested.
  biological_scale: ORGANISM
  notes: >-
    No GO biological process is bound. The observation is a plasma
    FLT3LG/FLT3 abundance shift, and nothing in the source measured
    progenitor differentiation, so GO:0002244 hematopoietic progenitor cell
    differentiation would claim more than was observed. OLS searches of GO
    for "FLT3 signaling pathway", "FLT3" and "fms-like tyrosine kinase 3
    signaling" returned no FLT3 or FLT3 ligand signalling process.
  downstream:
  - target: Serious bacterial infection
    description: >-
      Proposed, untested link: altered progenitor signalling as a possible
      route to impaired defence against bacteria.
    hypothesis_groups:
    - ch_progenitor_signalling_infection
    evidence:
    - reference: PMID:42982834
      reference_title: "Clonal haematopoiesis subtypes confer dose-dependent risk of serious bacterial infection."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "These findings point toward altered haematopoietic progenitor biology as a potential correlate of clonal expansion, although further mechanistic studies will be required to define causal pathways linking CH subtypes to SBI risk."
      explanation: >-
        The authors raise progenitor signalling as a candidate correlate but
        state that the causal path to SBI is undefined, hence INDIRECT.
  evidence:
  - reference: PMID:42982834
    reference_title: "Clonal haematopoiesis subtypes confer dose-dependent risk of serious bacterial infection."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast, classical inflammatory cytokines including IL6 and TNF were not significantly altered after correction for multiple testing."
    explanation: >-
      The proteomic signature of CH is not a general inflammatory cytokine
      elevation.
- name: Loss of TET2 Methylcytosine Dioxygenase Activity
  description: >-
    Loss-of-function TET2 mutation removes the enzyme's oxidation of
    5-methylcytosine to 5-hydroxymethylcytosine in DNA, an epigenetic
    modification that influences gene transcription. In myeloid progeny of
    the clone this changes how macrophages respond to cholesterol.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: TET2
    term:
      id: hgnc:25941
      label: TET2
  molecular_functions:
  - preferred_term: DNA 5-methylcytosine dioxygenase activity
    modifier: DECREASED
    term:
      id: GO:0070579
      label: DNA 5-methylcytosine dioxygenase activity
  downstream:
  - target: TET2-Deficient Macrophage Inflammatory Gene Expression
    description: >-
      Without TET2, macrophages exposed to cholesterol raise expression of
      chemokine and pro-inflammatory cytokine genes.
    evidence:
    - reference: PMID:28636844
      reference_title: "Clonal Hematopoiesis and Risk of Atherosclerotic Cardiovascular Disease."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Analyses of macrophages from Tet2 knockout mice showed elevated expression
        of several chemokine and cytokine genes that contribute to atherosclerosis.
      explanation: >-
        Tet2 loss in mouse macrophages raises chemokine and cytokine gene
        expression.
  - target: NLRP3 Inflammasome Activation in TET2-Deficient Macrophages
    description: >-
      TET2 loss raises promoter methylation of the gene for the
      JNK-inactivating phosphatase Dusp10 and lowers its expression, which
      leaves JNK1 active in cholesterol-loaded macrophages.
    evidence:
    - reference: PMID:37781816
      reference_title: "BRCC3-Mediated NLRP3 Deubiquitylation Promotes Inflammasome Activation and Atherosclerosis in Tet2 Clonal Hematopoiesis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The mechanism of JNK (c-Jun N-terminal kinase) activation in TET2 deficiency was increased promoter methylation and decreased expression of the JNK-inactivating dual-specificity phosphatase Dusp10."
      explanation: >-
        Links the lost TET2 activity to JNK1 activation through Dusp10
        promoter methylation, shown in cultured Tet2-deficient macrophages.
  evidence:
  - reference: PMID:28636844
    reference_title: "Clonal Hematopoiesis and Risk of Atherosclerotic Cardiovascular Disease."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: IN_VITRO
    snippet: >-
      Tet2 catalyzes DNA hydroxymethylation22, an epigenetic modification that can
      influence gene transcription.
    explanation: >-
      States the molecular activity lost when TET2 is mutated. The sentence
      restates established biochemistry from a cited source rather than a
      result of this study.
- name: TET2-Deficient Macrophage Inflammatory Gene Expression
  description: >-
    In mice, Tet2-deficient macrophages exposed to low-density lipoprotein
    up-regulate chemokine (Cxcl1, Cxcl2, Cxcl3, Pf4) and pro-inflammatory
    cytokine (Il1b, Il6) genes, and hematopoietic Tet2 loss enlarges
    atherosclerotic lesions. This is the proposed route from TET2-mutant CH
    to coronary heart disease; the human association is established, while
    the macrophage mechanism rests on mouse data.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: interleukin-1 beta production
    modifier: INCREASED
    term:
      id: GO:0032611
      label: interleukin-1 beta production

      evidence_source: HUMAN_CLINICAL
      snippet: "The clinical implications of CH are most relevant in therapy-related myeloid neoplasms (t-MN), with antecedent CH clones in genes such as TP53, PPM1D, and/or CHEK2 having a clear selection advantage."
      explanation: DNA-damage-response clones are selected in the setting of therapy-related myeloid neoplasms.

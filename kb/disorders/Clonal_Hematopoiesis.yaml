- name: NLRP3 Inflammasome Activation in TET2-Deficient Macrophages
  description: >-
    In cholesterol-loaded TET2-deficient macrophages, active JNK1 leads the
    deubiquitinase BRCC3 to deubiquitylate and activate NLRP3, so the
    inflammasome assembles and releases IL-1β. Isogenic human TET2-knockout
    macrophages derived from embryonic stem cells behave the same way. In
    mice, blocking BRCC3 reverses the accelerated atherosclerosis of Tet2 CH,
    and NLRP3 inhibition removes the worse cardiac remodelling of
    Tet2-deficient mice in heart failure models. The in vivo steps rest on
    mouse data.

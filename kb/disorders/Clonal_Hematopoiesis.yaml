      term:
        id: CHEBI:23359
        label: colchicine
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Clonal Expansion of Mutant Hematopoietic Stem Cells
    treatment_effect: INHIBITS
    description: >-
      Exploratory association with attenuated growth of TET2-mutant clones.

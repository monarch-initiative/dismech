- name: Cytotoxic chemotherapy
  exposure_term:
    preferred_term: exposure to antineoplastic agent
    term:
      id: ECTO:9001737
      label: exposure to antineoplastic agent
  description: >-
    Clones carrying mutations in DNA-damage-response genes such as TP53, PPM1D
    and CHEK2 have a selection advantage under cytotoxic cancer therapy, and
    such clones precede therapy-related myeloid neoplasms.
  influences_mechanisms:
  - target: Clonal Expansion of Mutant Hematopoietic Stem Cells
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Cytotoxic therapy favours the expansion of clones with
      DNA-damage-response mutations.
    evidence:

      reference_title: "Colchicine and Longitudinal Dynamics of Clonal Hematopoiesis: An Exploratory Substudy of the LoDoCo2 Trial."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In this exploratory analysis, treatment with low-dose colchicine was associated with attenuated clonal expansion in TET2 CH."
      explanation: Randomized-trial substudy evidence that colchicine slows TET2 clone growth; exploratory.
  evidence:
  - reference: PMID:40892620
    reference_title: "Colchicine and Longitudinal Dynamics of Clonal Hematopoiesis: An Exploratory Substudy of the LoDoCo2 Trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this exploratory analysis, treatment with low-dose colchicine was associated with attenuated clonal expansion in TET2 CH."
    explanation: The only human evidence on colchicine in CH is this exploratory trial substudy.
  - reference: PMID:42039360
    reference_title: "Clonal hematopoiesis of indeterminate potential and cardiovascular disease: mechanistic insights, clinical implications, and the dawn of precision cardio-hematology."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "The CANTOS trial exploratory analyses and subsequent studies suggest that IL-1β inhibition with canakinumab and colchicine may preferentially benefit TET2-mutant CHIP carriers, suggesting a future of mutation-guided cardiovascular prevention."
    explanation: A review frames colchicine and IL-1β blockade as candidate genotype-guided therapies for TET2 CHIP.
- name: Canakinumab (Investigational IL-1β Blockade)
  description: >-
    Not an approved CH therapy. In exploratory analyses of the CANTOS trial
    of the anti-IL-1β antibody canakinumab after myocardial infarction,
    patients with TET2 CH appeared to benefit particularly from IL-1β
    inhibition, and TET2 carriers treated with canakinumab had the lowest
    incidence of non-hematological cancer.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:

    Most frequently mutated CH gene. DNMT3A clones usually expand slowly and
    carry the mildest risk, but expanded clones still have a substantially
    raised risk of serious bacterial infection. Hotspot R882: about 9% of
    carriers of a large clone developed SBI within 10 years. DNMT3A also
    carries weaker cardiovascular associations than TET2, for example with
    stroke, and the macrophage inflammatory mechanism described for TET2 is
    not established for it.

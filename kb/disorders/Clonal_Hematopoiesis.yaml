name: Clonal Hematopoiesis
creation_date: "2026-11-10T00:00:00Z"
category: Complex
categories:
- Hematologic Disorder
- Premalignant Condition
synonyms:
- Clonal haematopoiesis
- CH
- Age-related clonal hematopoiesis
description: >-
  Clonal hematopoiesis (CH) is the expansion in blood of a clone derived from a
  single hematopoietic stem cell that has acquired a somatic driver mutation,
  most often in DNMT3A, TET2 or ASXL1, and less often in the splicing-factor
  genes SRSF2 and SF3B1 or at recurrent hotspots such as IDH2 R140 and NRAS G12.
  It is common and age-dependent, detectable in roughly a tenth of people in
  their seventies, and is defined by the absence of a diagnosed hematological
  neoplasm. CH raises the risk of myeloid malignancy and is also associated
  with non-malignant outcomes, including coronary heart disease and serious
  bacterial infection (sepsis and bacterial pneumonia). Risk is not uniform:
  it depends on which gene or residue is mutated and on clone size, measured
  as variant allele fraction. Large splicing-factor clones carry the highest
  infection risk, and co-occurring mutations add to it. The mechanism linking
  CH to impaired host defence against bacteria is not established.
parents:
- premalignant hematological system disease
disease_term:
  preferred_term: clonal hematopoiesis
  term:
    id: MONDO:0100542
    label: clonal hematopoiesis
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0100542
      label: clonal hematopoiesis
    mapping_predicate: skos:exactMatch
    mapping_source: MONDO
    mapping_justification: >-
      Primary MONDO class for clonal expansion of hematopoietic cells derived
      from a single stem-cell lineage, without a diagnosed hematological
      neoplasm. CHIP and age-related CH are its MONDO children and are carried
      as subtypes here.
review_notes: >-
  Anchored at clonal hematopoiesis rather than CHIP because the infection
  study that motivates the entry calls CH by its own somatic-variant pipeline
  at all clone sizes, including clones below the 2% variant-allele-fraction
  threshold that defines CHIP. Gene- and hotspot-level risk differences are
  recorded on the genetic rows rather than as separate subtypes, because the
  field does not name them as separate conditions.
has_subtypes:
- name: CHIP
  display_name: Clonal hematopoiesis of indeterminate potential
  description: >-
    Clonal hematopoiesis with a somatic driver mutation in blood or marrow
    cells, without morphologic evidence of hematological neoplasia.
  subtype_term:
    preferred_term: clonal hematopoiesis of indeterminate potential
    term:
      id: MONDO:0100543
      label: clonal hematopoiesis of indeterminate potential
- name: ARCH
  display_name: Age-related clonal hematopoiesis
  description: >-
    Gradual, age-associated clonal expansion of hematopoietic stem and
    progenitor cells carrying recurrent driver variants, in people without a
    diagnosed hematological malignancy.
  subtype_term:
    preferred_term: age-related clonal hematopoiesis
    term:
      id: MONDO:0100544
      label: age-related clonal hematopoiesis
inheritance:
- name: Somatic mosaicism (not inherited)
  inheritance_term:
    preferred_term: Typified by somatic mosaicism
    term:
      id: HP:0001442
      label: Typified by somatic mosaicism
  description: >-
    CH is an acquired somatic mosaic of the blood: a post-zygotic driver
    mutation in one hematopoietic stem cell expands into a clone, leaving a
    mixture of mutant and normal blood cells. It is not transmitted through
    the germline.
  evidence:
  - reference: PMID:42982834
    reference_title: "Clonal haematopoiesis subtypes confer dose-dependent risk of serious bacterial infection."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clonal haematopoiesis (CH) arises from somatic mutations in haematopoietic stem cells that drive clonal expansion and increase haematological malignancy risk."
    explanation: >-
      States that CH arises from somatic, not germline, mutations in
      hematopoietic stem cells.
prevalence:
- population: >-
    UK Biobank, Genomics England and Alliance for Genomic Discovery
    participants (590,537 individuals)
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 6870.0
  notes: >-
    6.87% of participants carried at least one CH driver mutation across 43
    genes at the time of sampling. Prevalence depends on the variant-calling
    threshold and on cohort age; median cohort ages were 49 to 60 years.
  evidence:
  - reference: PMID:42982834
    reference_title: "Clonal haematopoiesis subtypes confer dose-dependent risk of serious bacterial infection."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified 19,822 mutations across 43 CH genes in 40,560 of 590,537 individuals from three population cohorts (6.87%)"
    explanation: Population prevalence of CH in the discovery cohorts.
- population: Adults aged 70 to 79 years (exome sequencing, 17,182 individuals unselected for hematologic phenotype)
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 9500.0
  notes: >-
    Age-graded: 9.5% at 70-79, 11.7% at 80-89 and 18.4% at 90-108 years;
    rare below 40.
  evidence:
  - reference: PMID:25426837
    reference_title: "Age-related clonal hematopoiesis associated with adverse outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among persons 70 to 79 years of age, 80 to 89 years of age, and 90 to 108
      years of age, these clonal mutations were observed in 9.5% (219 of 2300
      persons), 11.7% (37 of 317), and 18.4% (19 of 103), respectively.
    explanation: Age-specific prevalence of detectable clonal mutations.
pathophysiology:
- name: Somatic Driver Mutation in a Hematopoietic Stem Cell
  description: >-
    A hematopoietic stem cell acquires a somatic mutation in a CH driver gene.
    DNMT3A, TET2 and ASXL1 are the most frequently mutated; SRSF2, SF3B1, IDH2
    and NRAS mutations are rarer but carry higher risk.
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: SOMATIC
    description: >-
      Somatic driver mutation in one of the recurrent CH genes, most often
      DNMT3A, TET2 or ASXL1.
  cell_types:
  - preferred_term: hematopoietic stem cell
    term:
      id: CL:0000037
      label: hematopoietic stem cell
  genes:
  - preferred_term: DNMT3A
    term:
      id: hgnc:2978
      label: DNMT3A
  - preferred_term: TET2
    term:
      id: hgnc:25941
      label: TET2
  - preferred_term: ASXL1
    term:
      id: hgnc:18318
      label: ASXL1
  - preferred_term: SRSF2
    term:
      id: hgnc:10783
      label: SRSF2
  - preferred_term: SF3B1
    term:
      id: hgnc:10768
      label: SF3B1
  downstream:
  - target: Clonal Expansion of Mutant Hematopoietic Stem Cells
    description: >-
      The driver mutation gives the stem cell a growth or survival advantage,
      and its progeny expand into a detectable clone.
    evidence:
    - reference: PMID:28636844
      reference_title: "Clonal Hematopoiesis and Risk of Atherosclerotic Cardiovascular Disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        These mutations, which are also common in the myelodysplastic syndrome and acute
        myeloid leukemia4, provide a selective advantage to the hematopoietic stem cells
        in which they occur5,6, and are detectable as clones in peripheral blood samples
        because the mutated stem cells maintain the ability to differentiate into
        circulating granulocytes, monocytes, and lymphocytes7,8.
      explanation: >-
        The driver mutations give a selective advantage to the stem cell, which
        is why a clone becomes detectable in blood.
  evidence:
  - reference: PMID:42982834
    reference_title: "Clonal haematopoiesis subtypes confer dose-dependent risk of serious bacterial infection."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DNMT3A, TET2, and ASXL1 were the most frequently mutated"
    explanation: Names the most frequently mutated CH driver genes in the discovery cohorts.
- name: Clonal Expansion of Mutant Hematopoietic Stem Cells
  description: >-
    The mutant clone expands and contributes a growing share of blood cells.
    Clone size, measured as variant allele fraction (VAF), grades risk: clones
    with VAF above 0.4 substantially contribute to mature blood cells and carry
    the highest risks of malignancy and of serious bacterial infection.
    Splicing-factor clones (SRSF2) expand quickly and are often found large.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: hematopoietic stem cell
    term:
      id: CL:0000037
      label: hematopoietic stem cell
  locations:
  - preferred_term: bone marrow
    term:
      id: UBERON:0002371
      label: bone marrow
  - preferred_term: blood
    term:
      id: UBERON:0000178
      label: blood
  biological_processes:
  - preferred_term: hematopoietic stem cell proliferation
    modifier: INCREASED
    term:
      id: GO:0071425
      label: hematopoietic stem cell proliferation
  downstream:
  - target: Altered Hematopoietic Progenitor Signalling
    description: >-
      CH carriers show a perturbed FLT3/FLT3 ligand axis in plasma. The authors
      read this as a correlate of clonal expansion, not as an established
      cause of infection risk.
    evidence:
    - reference: PMID:42982834
      reference_title: "Clonal haematopoiesis subtypes confer dose-dependent risk of serious bacterial infection."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "These findings point toward altered haematopoietic progenitor biology as a potential correlate of clonal expansion, although further mechanistic studies will be required to define causal pathways linking CH subtypes to SBI risk."
      explanation: >-
        Frames the proteomic signal as a correlate of clonal expansion and
        states that the causal pathway is undefined.
  - target: Hematological neoplasm
    description: >-
      Clonal expansion is the precursor state of myeloid malignancy, with risk
      rising with clone size and highest for splicing-factor clones.
    evidence:
    - reference: PMID:42982834
      reference_title: "Clonal haematopoiesis subtypes confer dose-dependent risk of serious bacterial infection."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Notably, subtypes defined by molecular lesions in DNMT3A, TET2, ASXL1, SRSF2, and SF3B1 exhibited strong, dose-dependent (size of clonal expansion) relationships with haematological malignancy"
      explanation: Malignancy risk scales with clone size within each major gene subtype.
  - target: Serious bacterial infection
    description: >-
      Carriers have a higher incidence of serious bacterial infection, graded
      by gene and clone size and independent of a diagnosed malignancy. The
      intervening mechanism is unknown, so this edge records the association
      rather than a pathway.
    evidence:
    - reference: PMID:42982834
      reference_title: "Clonal haematopoiesis subtypes confer dose-dependent risk of serious bacterial infection."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Here we show that CH confers mutation- and dose-dependent risk of serious bacterial infection (SBI)."
      explanation: States the gene- and dose-dependent association between CH and SBI.
    - reference: PMID:42982834
      reference_title: "Clonal haematopoiesis subtypes confer dose-dependent risk of serious bacterial infection."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Dose-dependent associations between CH subtypes and SBI were preserved in the cancer-free population"
      explanation: >-
        The association is not explained by occult or diagnosed cancer.
  - target: Coronary artery atherosclerosis
    description: >-
      CH is associated with incident coronary heart disease. The mechanism is
      not modelled in this entry.
    evidence:
    - reference: PMID:25426837
      reference_title: "Age-related clonal hematopoiesis associated with adverse outcomes."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The presence of a somatic mutation was associated with an increase in the
        risk of hematologic cancer (hazard ratio, 11.1; 95% confidence interval [CI],
        3.9 to 32.6), an increase in all-cause mortality (hazard ratio, 1.4; 95% CI,
        1.1 to 1.8), and increases in the risks of incident coronary heart disease
        (hazard ratio, 2.0; 95% CI, 1.2 to 3.4) and ischemic stroke (hazard ratio,
        2.6; 95% CI, 1.4 to 4.8).
      explanation: Reports the increased risk of incident coronary heart disease in CH carriers.
  evidence:
  - reference: PMID:42982834
    reference_title: "Clonal haematopoiesis subtypes confer dose-dependent risk of serious bacterial infection."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SRSF2 clones expand quickly, and are therefore often identified with larger clone sizes, and are preferentially linked to myelodysplastic syndrome (MDS)."
    explanation: Clone growth rate differs by driver gene.
- name: Altered Hematopoietic Progenitor Signalling
  description: >-
    In 53,030 UK Biobank participants with plasma proteomics, CH carriers had
    lower circulating FLT3 ligand and higher FLT3 receptor abundance, while
    the classical inflammatory cytokines IL6 and TNF were not altered after
    multiple-testing correction. This points to altered progenitor signalling
    rather than a systemic inflammatory cytokine signature. It is a
    cross-sectional correlate; whether it lies on the path to infection risk
    is untested.
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: hematopoietic progenitor cell differentiation
    modifier: ABNORMAL
    term:
      id: GO:0002244
      label: hematopoietic progenitor cell differentiation
  downstream:
  - target: Serious bacterial infection
    description: >-
      Proposed, untested link: altered progenitor signalling as a possible
      route to impaired defence against bacteria.
    hypothesis_groups:
    - ch_progenitor_signalling_infection
    evidence:
    - reference: PMID:42982834
      reference_title: "Clonal haematopoiesis subtypes confer dose-dependent risk of serious bacterial infection."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "These findings point toward altered haematopoietic progenitor biology as a potential correlate of clonal expansion, although further mechanistic studies will be required to define causal pathways linking CH subtypes to SBI risk."
      explanation: >-
        The authors raise progenitor signalling as a candidate correlate but
        state that the causal path to SBI is undefined, hence INDIRECT.
  evidence:
  - reference: PMID:42982834
    reference_title: "Clonal haematopoiesis subtypes confer dose-dependent risk of serious bacterial infection."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast, classical inflammatory cytokines including IL6 and TNF were not significantly altered after correction for multiple testing."
    explanation: >-
      The proteomic signature of CH is not a general inflammatory cytokine
      elevation.
mechanistic_hypotheses:
- hypothesis_group_id: ch_progenitor_signalling_infection
  hypothesis_label: Altered progenitor signalling links CH to bacterial infection risk
  status: EMERGING
  description: >-
    CH-associated perturbation of the FLT3/FLT3 ligand axis reflects altered
    hematopoietic progenitor biology that may impair antibacterial host
    defence. Currently supported only by a cross-sectional proteomic
    association.
phenotypes:
- name: Serious bacterial infection
  category: Immunologic
  description: >-
    Incident sepsis or bacterial pneumonia. In 590,537 individuals without a
    diagnosed hematological malignancy, CH was associated with serious
    bacterial infection (HR 1.22) and with 28-day post-infection mortality
    (RR 1.84). Risk is graded by gene and clone size: within 10 years, about
    25% of people with a large SRSF2 P95 clone, 23% with a large IDH2 R140
    clone, 18% with a large SF3B1 K700 clone and 9% with a large DNMT3A R882
    clone developed an infection. The association held after adjustment for
    inflammatory comorbidities and ancestry, after excluding people with
    cytopenias, and in a cancer-free subset. It was largely independent of
    the causative bacterium. CH was not associated with viral infection.
  phenotype_term:
    preferred_term: Serious bacterial infection
    term:
      id: HP:5210000
      label: Unusual bacterial infection
  evidence:
  - reference: PMID:42982834
    reference_title: "Clonal haematopoiesis subtypes confer dose-dependent risk of serious bacterial infection."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "finding a significant (FDR < 0.05) association between CH and SBI, which includes sepsis and bacterial pneumonia"
    explanation: Defines SBI as sepsis and bacterial pneumonia and reports its association with CH.
  - reference: PMID:42982834
    reference_title: "Clonal haematopoiesis subtypes confer dose-dependent risk of serious bacterial infection."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Associations between CH subtypes and SBI remained significant after adjustment, with hazard ratios attenuated by ~10–15% but preserving the observed dose-dependent relationships"
    explanation: The association survives adjustment for prevalent coronary, kidney and liver disease.
  - reference: PMID:42982834
    reference_title: "Clonal haematopoiesis subtypes confer dose-dependent risk of serious bacterial infection."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In a mega-analysis, 25% of individuals with no diagnosed haematological malignancy and a large clonal P95 expansion developed a SBI within 10 years of follow-up time"
    explanation: Absolute 10-year risk for the highest-risk subtype.
  - reference: PMID:42982834
    reference_title: "Clonal haematopoiesis subtypes confer dose-dependent risk of serious bacterial infection."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The proportion of strains did not differ by CH status (P = 0.88), nor were there any apparent strain-specific differences in SBI rates across CH subtypes"
    explanation: The infection risk is not specific to a bacterial species.
  - reference: PMID:42982834
    reference_title: "Clonal haematopoiesis subtypes confer dose-dependent risk of serious bacterial infection."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Restricting to individuals with a hotspot subtype, we observed that expanded clone sizes were significantly associated with 28-day mortality"
    explanation: Clone size also grades the severity of infection, measured as 28-day mortality.
- name: Hematological neoplasm
  category: Hematologic
  description: >-
    Progression to myeloid malignancy, including myelodysplastic syndrome.
    Risk rises with clone size. Among carriers, a serious bacterial infection
    is followed by a higher risk of subsequent hematological malignancy, not
    explained by clone size alone.
  phenotype_term:
    preferred_term: Hematological neoplasm
    term:
      id: HP:0004377
      label: Hematological neoplasm
  evidence:
  - reference: PMID:42982834
    reference_title: "Clonal haematopoiesis subtypes confer dose-dependent risk of serious bacterial infection."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As expected, CH was strongly associated with the risk of developing haematological malignancy"
    explanation: Replicates the malignancy risk of CH.
  - reference: PMID:42982834
    reference_title: "Clonal haematopoiesis subtypes confer dose-dependent risk of serious bacterial infection."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SBI was associated with a substantially higher risk of subsequent haematological malignancy after adjustment for age and sex"
    explanation: Infection in a CH carrier marks higher risk of later malignancy.
- name: Coronary artery atherosclerosis
  category: Cardiovascular
  description: >-
    CH carriers have a higher incidence of coronary heart disease, an
    association replicated in the large biobank cohorts.
  phenotype_term:
    preferred_term: Coronary heart disease
    term:
      id: HP:0001677
      label: Coronary artery atherosclerosis
  evidence:
  - reference: PMID:42982834
    reference_title: "Clonal haematopoiesis subtypes confer dose-dependent risk of serious bacterial infection."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "replicating previous associations with coronary heart disease (CHD)"
    explanation: Replication of the CH-coronary heart disease association.
genetic:
- name: DNMT3A
  association: >-
    Most frequently mutated CH gene. DNMT3A clones usually expand slowly and
    carry the mildest risk, but expanded clones still have a substantially
    raised risk of serious bacterial infection. Hotspot R882: about 9% of
    carriers of a large clone developed SBI within 10 years.
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  gene_term:

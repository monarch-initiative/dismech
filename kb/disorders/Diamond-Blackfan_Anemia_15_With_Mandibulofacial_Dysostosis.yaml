inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Heterozygous, and de novo in every reported case. The founding study
    described the two probands' variants as de novo, and the third reported
    patient carries a heterozygous start-codon variant. No transmitted pedigree
    has been published, so dominance is inferred from heterozygosity and de novo
    occurrence rather than from observed transmission.
  evidence:
  - reference: PMID:24942156
    reference_title: Diamond-Blackfan anemia with mandibulofacial dystostosis is heterogeneous, including
      the novel DBA genes TSR2 and RPS28.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'De novo mutations affecting the RPS28 start codon were found in two unrelated probands,
      identifying RPS28 as a novel disease gene.'
    explanation: Establishes both the de novo origin and the heterozygous single-gene basis in the
      two founding probands.
epidemiology:
- name: Reported case count
  description: >-
    Three patients in the literature at the time of this curation: two founding
    probands and one later case report. RPS28 is correspondingly one of the
    rarest DBA genotypes.
  evidence:
  - reference: PMID:24942156
    reference_title: Diamond-Blackfan anemia with mandibulofacial dystostosis is heterogeneous, including
      the novel DBA genes TSR2 and RPS28.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'De novo mutations affecting the RPS28 start codon were found in two unrelated probands,
      identifying RPS28 as a novel disease gene.'
    explanation: The two founding probands.
  - reference: PMID:40135709
    reference_title: Diagnosis and treatment of Diamond-Blackfan anemia and Pierre-Robin sequence caused
      by a novel mutation of RPS28 gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Whole exome sequencing of peripheral blood revealed a heterozygous mutation in the RPS28
      gene (c.2T > C, p.Met1?), a novel pathogenic mutation in RPS28.'
    explanation: The third reported patient, and the source describes the allele as novel, which
      supports the small total count.
- name: Position within the DBA gene panel
  description: >-
    Context for how small a slice of DBA this genotype is. RPS19 accounts for
    about a quarter of DBA; nine further ribosomal genes plus GATA1 account for
    another quarter to 30%, and a substantial proportion of DBA remains
    genetically unexplained. RPS28 sits inside that second, thinly populated
    group.
  evidence:
  - reference: PMID:24942156
    reference_title: Diamond-Blackfan anemia with mandibulofacial dystostosis is heterogeneous, including
      the novel DBA genes TSR2 and RPS28.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'In about 25% of DBA patients a RPS19 mutation is present. Mutations in nine additional
      ribosomal genes and the erythroid transcription factor GATA1 account for another 25-30% of
      cases, leaving a substantial proportion unaccounted for.'
    explanation: Gives the denominator that places RPS28 among the rare DBA genotypes rather than
      quantifying RPS28 itself, which no source does.
genetic:
- name: RPS28
  gene_term:
    preferred_term: RPS28
    term:
      id: hgnc:10418
      label: RPS28
  relationship_type: CAUSATIVE
  notes: >-
    Heterozygous, de novo, and in every reported case affecting the translation
    initiation codon. The founding probands carried start-codon variants; the
    third patient carries c.2T>C, p.Met1?. Whether non-start-codon RPS28 alleles
    can cause disease is unknown - with three patients this is an observation
    about the reported spectrum, not a demonstrated constraint on the gene.
  evidence:
  - reference: PMID:24942156
    reference_title: Diamond-Blackfan anemia with mandibulofacial dystostosis is heterogeneous, including
      the novel DBA genes TSR2 and RPS28.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'De novo mutations affecting the RPS28 start codon were found in two unrelated probands,
      identifying RPS28 as a novel disease gene.'
    explanation: Names the gene, the allele class and the de novo origin in one statement.
  - reference: PMID:40135709
    reference_title: Diagnosis and treatment of Diamond-Blackfan anemia and Pierre-Robin sequence caused
      by a novel mutation of RPS28 gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'A heterozygous mutation in the RPS28 gene (c.2T > C, p.Met1?) is a novel pathogenic
      mutation associated with DBA.'
    explanation: An independent start-codon allele in a third patient, which is what makes the
      allelic pattern worth recording.
pathophysiology:
- name: RPS28 Start-Codon Disruption
  biological_scale: MOLECULAR
  description: >-
    The initiating lesion. A heterozygous de novo variant destroys the RPS28
    translation initiation codon, so eS28 cannot be translated from that allele.
    Every reported patient carries a variant of this class.
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  genes:
  - preferred_term: RPS28
    term:
      id: hgnc:10418
      label: RPS28
  evidence:
  - reference: PMID:24942156
    reference_title: Diamond-Blackfan anemia with mandibulofacial dystostosis is heterogeneous, including
      the novel DBA genes TSR2 and RPS28.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'De novo mutations affecting the RPS28 start codon were found in two unrelated probands,
      identifying RPS28 as a novel disease gene.'
    explanation: The lesion itself, in the two founding probands.
  - reference: PMID:40135709
    reference_title: Diagnosis and treatment of Diamond-Blackfan anemia and Pierre-Robin sequence caused
      by a novel mutation of RPS28 gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Whole exome sequencing of peripheral blood revealed a heterozygous mutation in the RPS28
      gene (c.2T > C, p.Met1?), a novel pathogenic mutation in RPS28.'
    explanation: A third, independently reported allele of the same class, with the p.Met1?
      annotation naming the loss of the initiator methionine directly.
  downstream:
  - target: Impaired Ribosome Biogenesis
    causal_link_type: DIRECT
    description: >-
      Reduced eS28 available for assembly into the small ribosomal subunit
      compromises subunit production.
    evidence:
    - reference: PMID:24942156
      reference_title: Diamond-Blackfan anemia with mandibulofacial dystostosis is heterogeneous, including
        the novel DBA genes TSR2 and RPS28.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'Each of the pathogenic variants identified is predicted to impede ribosome biogenesis,
        which in turn could result in altered cell growth and proliferation, causing abnormal
        embryologic development, defective erythropoiesis and reduced growth.'
      explanation: The authors' own causal chain, covering this edge and the two downstream branches.
        Note the hedged verbs - predicted, could result - which is why the nodes below are graded as
        they are.
- name: Impaired Ribosome Biogenesis
  biological_scale: CELLULAR
  description: >-
    Reduced production of the small ribosomal subunit. Experimental depletion of
    RPS28 in human cells, in a panel alongside the other DBA ribosomal proteins,
    reduces the corresponding subunit, fully assembled ribosomes and polysomes,
    and perturbs rRNA processing. The generalisation the same study draws is that
    what the DBA proteins share is a compromised rate of ribosome production
    rather than a single common processing step.
  biological_processes:
  - preferred_term: ribosome biogenesis
    modifier: DECREASED
    term:
      id: GO:0042254
      label: ribosome biogenesis
  - preferred_term: rRNA processing
    modifier: DYSREGULATED
    term:
      id: GO:0006364
      label: rRNA processing
  evidence:
  - reference: PMID:18697920
    reference_title: The role of human ribosomal proteins in the maturation of rRNA and ribosome production.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'Depleting r-proteins in one of the subunits caused, with a few exceptions, a decrease
      in all r-proteins of the same subunit and a decrease in the corresponding subunit, fully
      assembled ribosomes, and polysomes.'
    explanation: The measured consequence of depleting a small-subunit ribosomal protein in human
      cells. RPS28 is one of the small-subunit proteins in this depletion panel.
  - reference: PMID:18697920
    reference_title: The role of human ribosomal proteins in the maturation of rRNA and ribosome production.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'We depleted HeLa cells using siRNA for several individual r-proteins of the small
      (RPS6, RPS7, RPS15, RPS16, RPS17, RPS19, RPS24, RPS25, RPS28) or large subunit'
    explanation: Names RPS28 explicitly in the depleted panel, which is what makes the preceding
      result applicable to this gene rather than to ribosomal proteins in general.
  - reference: PMID:18697920
    reference_title: The role of human ribosomal proteins in the maturation of rRNA and ribosome production.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: 'Depletion of r-proteins mutated in DBA always compromised ribosome biogenesis while
      affecting either subunit and disturbing rRNA processing at different levels'
    explanation: The study's generalisation across DBA genes. Marked INDIRECT because it is a
      statement about the DBA gene set as a class, from which the claim about RPS28 follows rather
      than being made directly.
  downstream:
  - target: Defective Erythropoiesis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Why a general shortage of ribosomes selectively fails red cell production
      is the central unsolved question of the ribosomopathies, and these sources
      say so rather than resolving it.
  - target: Abnormal Craniofacial Embryonic Development
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Attributed by the founding authors to altered cell growth and proliferation
      during embryogenesis, with no intermediate steps established.
- name: Defective Erythropoiesis
  biological_scale: TISSUE
  mechanism_confidence: HYPOTHETICAL
  description: >-
    Failure of red cell production, giving the macrocytic anemia that defines
    DBA. The link from a general ribosome shortage to a specifically erythroid
    failure is explicitly named as unknown in the mechanism literature, which is
    why this node is graded HYPOTHETICAL despite the anemia itself being beyond
    doubt: it is the explanation that is provisional, not the finding.
  cell_types:
  - preferred_term: erythroid progenitor cell
    term:
      id: CL:0000038
      label: erythroid progenitor cell
  biological_processes:
  - preferred_term: erythrocyte differentiation
    modifier: DECREASED
    term:
      id: GO:0030218
      label: erythrocyte differentiation
  evidence:
  - reference: PMID:18697920
    reference_title: The role of human ribosomal proteins in the maturation of rRNA and ribosome production.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: 'How defects in r-proteins, essential for proliferation in all cells, lead to a human
      disease with a specific defect in red cell development is unknown.'
    explanation: States the gap directly. It is cited here as the reason for the HYPOTHETICAL
      grading rather than as support for a mechanism.
  - reference: PMID:24942156
    reference_title: Diamond-Blackfan anemia with mandibulofacial dystostosis is heterogeneous, including
      the novel DBA genes TSR2 and RPS28.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Diamond-Blackfan anemia typically presents in early infancy with macrocytic anemia,
      elevated erythrocyte adenosine deaminase (eADA) and hemoglobin F, and less commonly associated
      physical findings such as short stature or thumb anomalies.'
    explanation: Describes the erythroid phenotype this node produces, which is well established even
      though its mechanism is not.
  downstream:
  - target: Macrocytic anemia
    causal_link_type: DIRECT
- name: Abnormal Craniofacial Embryonic Development
  biological_scale: TISSUE
  mechanism_confidence: HYPOTHETICAL
  description: >-
    The developmental arm. Impaired ribosome biogenesis is proposed to alter cell
    growth and proliferation during embryogenesis, producing the mandibulofacial
    dysostosis phenotype. Graded HYPOTHETICAL because the founding study offers
    this as a prediction covering all five genotypes in the series and no
    experiment in these sources tests it for RPS28.
  evidence:
  - reference: PMID:24942156
    reference_title: Diamond-Blackfan anemia with mandibulofacial dystostosis is heterogeneous, including
      the novel DBA genes TSR2 and RPS28.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Each of the pathogenic variants identified is predicted to impede ribosome biogenesis,
      which in turn could result in altered cell growth and proliferation, causing abnormal
      embryologic development, defective erythropoiesis and reduced growth.'
    explanation: The only statement in these sources linking the ribosomal lesion to the craniofacial
      phenotype, and it is framed as a prediction.
  downstream:
  - target: Micrognathia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Cleft palate
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Downslanted palpebral fissures
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

treatments:
- name: Hematopoietic Stem Cell Transplantation
  description: >-
    The definitive treatment for the haematologic component. In the one reported
    RPS28 patient who received it, from a 9/10 HLA-matched donor, both neutrophil
    and haemoglobin levels normalised. It does not address the craniofacial
    malformations or the hearing loss.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: hematopoietic stem cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_mechanisms:
  - target: Defective Erythropoiesis
    description: Replaces the RPS28-deficient haematopoietic compartment with donor cells, restoring
      erythropoiesis at its source.
  evidence:
  - reference: PMID:40135709
    reference_title: Diagnosis and treatment of Diamond-Blackfan anemia and Pierre-Robin sequence caused
      by a novel mutation of RPS28 gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'The boy underwent HSCT from 9/10 HLA-matched donor and his neutrophil and hemoglobin
      levels returned to normal.'
    explanation: The only reported treatment outcome in an RPS28 patient. It is a single case, so it
      establishes that transplant worked here, not an expected response rate.
  - reference: PMID:40135709
    reference_title: Diagnosis and treatment of Diamond-Blackfan anemia and Pierre-Robin sequence caused
      by a novel mutation of RPS28 gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'HSCT is an effective treatment for hematological abnormalities in DBA.'
    explanation: The authors' generalisation to DBA as a whole, which is the broader basis for
      offering transplant in this genotype.
- name: Corticosteroid Therapy
  description: >-
    Standard first-line therapy for the anemia of DBA, to which roughly 40% of
    patients respond. No steroid-response data exist for RPS28 patients
    specifically, so this is offered on the basis of the DBA literature rather
    than of genotype-specific evidence.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: corticosteroid
      term:
        id: CHEBI:50858
        label: corticosteroid
  target_mechanisms:
  - target: Defective Erythropoiesis
    description: Improves red cell output in steroid-responsive DBA. The mechanism of the steroid
      response in DBA is itself not established.
  evidence:
  - reference: PMID:24942156
    reference_title: Diamond-Blackfan anemia with mandibulofacial dystostosis is heterogeneous, including
      the novel DBA genes TSR2 and RPS28.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: 'The anemia remits spontaneously in about 20%, is steroid responsive in 40% and requires
      long term transfusions in about 40%'
    explanation: Gives the steroid-response rate for DBA as a whole. Marked INDIRECT because the
      claim about RPS28 patients follows from their being DBA patients rather than from any
      RPS28-specific observation.
- name: Red Cell Transfusion
  description: >-
    Long-term transfusion support is required by roughly 40% of DBA patients and
    is the alternative when the anemia does not respond to steroids.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: red blood cell transfusion
    term:
      id: NCIT:C15192
      label: Blood Transfusion
  target_mechanisms:
  - target: Macrocytic anemia
    description: Replaces the red cells the marrow does not produce. Purely supportive; it does not
      act on the ribosomal defect.
  evidence:
  - reference: PMID:24942156
    reference_title: Diamond-Blackfan anemia with mandibulofacial dystostosis is heterogeneous, including
      the novel DBA genes TSR2 and RPS28.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: 'The anemia remits spontaneously in about 20%, is steroid responsive in 40% and requires
      long term transfusions in about 40%'
    explanation: Same DBA-wide figure as above, read for the transfusion-dependent fraction. INDIRECT
      for the same reason.
diagnosis:
- name: Exome sequencing
  description: >-
    The route by which this disease is identified. The founding study reached
    RPS28 by whole exome analysis of probands whose combined DBA and
    mandibulofacial dysostosis phenotype had no molecular explanation, and the
    third patient was diagnosed the same way.
  evidence:
  - reference: PMID:24942156
    reference_title: Diamond-Blackfan anemia with mandibulofacial dystostosis is heterogeneous, including
      the novel DBA genes TSR2 and RPS28.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Combining exome analysis and Sanger sequencing, we identified likely pathogenic
      mutations in 5/6 families.'
    explanation: Describes the diagnostic approach and its yield in the founding series.
  - reference: PMID:40135709
    reference_title: Diagnosis and treatment of Diamond-Blackfan anemia and Pierre-Robin sequence caused
      by a novel mutation of RPS28 gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'It is crucial to perform a genetic evaluation for syndromic bone marrow failure with
      congenital anomalies.'
    explanation: The recommendation this diagnostic entry exists to record - genetic evaluation when
      marrow failure occurs with congenital anomalies.
differential_diagnoses:
- name: Treacher Collins syndrome
  description: >-
    The phenotype these patients are first taken for. TCS is usually caused by a
    heterozygous TCOF1 variant, with POLR1D and biallelic POLR1C accounting for
    further cases. It does not carry the DBA erythroid phenotype, and the anemia
    is what should prompt reconsideration.
  evidence:
  - reference: PMID:24942156
    reference_title: Diamond-Blackfan anemia with mandibulofacial dystostosis is heterogeneous, including
      the novel DBA genes TSR2 and RPS28.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Most TCS patients have a heterozygous TCOF1 mutation, while heterozygous POLR1D and
      biallelic POLR1C mutations account for additional cases'
    explanation: Names the genes that have to be excluded, which is what makes this a differential
      rather than a synonym.
- name: Diamond-Blackfan anemia 14 with mandibulofacial dysostosis (TSR2)
  description: >-
    The X-linked sibling entity, defined in the same six-family series. It is
    indistinguishable on the craniofacial phenotype alone; the discriminators are
    the segregation pattern and the gene. Curated separately in this knowledge
    base.
  evidence:
  - reference: PMID:24942156
    reference_title: Diamond-Blackfan anemia with mandibulofacial dystostosis is heterogeneous, including
      the novel DBA genes TSR2 and RPS28.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'In another family a likely pathogenic X-linked mutation affecting a highly conserved
      residue was found in TSR2, which encodes a direct binding partner of RPS26.'
    explanation: The TSR2 family from the same series, and the note that TSR2 partners RPS26 - which
      is why these genotypes converge on one phenotype.
- name: Diamond-Blackfan anemia 10 (RPS26)
  description: >-
    Two of the six families in the founding series carried RPS26 variants, one
    affecting splicing and one truncating. RPS26 is the binding partner of the
    TSR2 protein, so DBA10, DBA14 and DBA15 all disturb small-subunit assembly by
    different routes.
  evidence:
  - reference: PMID:24942156
    reference_title: Diamond-Blackfan anemia with mandibulofacial dystostosis is heterogeneous, including
      the novel DBA genes TSR2 and RPS28.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Two mutations in unrelated families were seen in RPS26, the known DBA10 gene. One
      variant was predicted to affect mRNA splicing, and the other to lead to protein truncation.'
    explanation: The RPS26 families and their allele classes, establishing this as the most common
      genotype behind the combined phenotype.
discussions:
- discussion_id: rps28_start_codon_only
  kind: KNOWLEDGE_GAP
  attaches_to:
  - genetic#RPS28
  prompt: >-
    Is the RPS28 disease spectrum genuinely restricted to start-codon variants,
    or does that pattern simply reflect three reported patients?
  rationale: >-
    All three reported RPS28 alleles destroy the translation initiation codon. If
    that restriction is real it would be mechanistically interesting - it might
    mean only a specific consequence of start-codon loss, such as initiation at a
    downstream methionine producing an N-terminally truncated eS28, causes
    disease, while a simple null is tolerated or lethal. If it is an artefact of
    three patients, RPS28 should be read like any other DBA gene. The two readings
    imply different variant-interpretation practice for a novel RPS28 missense
    allele, and nothing in the current literature separates them.
- discussion_id: rps28_erythroid_specificity
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Defective Erythropoiesis
  prompt: >-
    Why does a general reduction in ribosome production cause a specifically
    erythroid failure rather than a uniform proliferative defect?
  rationale: >-
    This is the central unsolved question of the ribosomopathies and it is named
    as unknown in the mechanism literature cited here. It is recorded on this
    entry because the same experimental work shows RPS28 depletion behaves like
    the other DBA proteins - compromising the rate of ribosome production
    generally, without a distinctive processing signature - so nothing specific to
    RPS28 explains the erythroid selectivity either.
notes: >-
  Curated de novo as the sibling of the existing DBA14 entry, which was created
  from the same founding paper (PMID:24942156) and which already carried a
  differential-diagnosis entry anticipating this genotype. Structure, the ICD10CM
  broadMatch mapping and the parents list deliberately mirror DBA14 so the two
  read as a pair.

  Evidence rests on three papers: the founding six-family series (PMID:24942156),
  the single subsequent case report (PMID:40135709), and the human ribosomal
  protein depletion study (PMID:18697920), which is the only source here that
  measures anything about RPS28 rather than predicting it.

  Two gradings a reviewer may want to check. Both Defective Erythropoiesis and
  Abnormal Craniofacial Embryonic Development are mechanism_confidence
  HYPOTHETICAL. In the first case it is the explanation and not the finding that
  is provisional - the anemia is beyond doubt, but why a general ribosome shortage
  selectively fails erythropoiesis is stated as unknown in the cited literature.
  In the second, the founding authors' link from the ribosomal lesion to the
  craniofacial phenotype is explicitly a prediction ("is predicted to impede",
  "could result in"), covering all five genotypes in their series collectively,
  and no experiment in these sources tests it for RPS28.

  Frequency bands are unusually weak here and should be read as such: there are
  three reported patients, and most of the dysmorphic features are documented in
  exactly one of them. They are banded OCCASIONAL to reflect single observations
  rather than to assert a rate.

  The DBA GeneReviews chapter (PMID:20301769) was retrieved. Its PubMed record is
  a bibliographic stub with no abstract text, so there is nothing cached to quote
  and it is not cited here.

treatments:
- name: Hematopoietic Stem Cell Transplantation
  description: >-
    The definitive treatment for the haematologic component. In the one reported
    RPS28 patient who received it, from a 9/10 HLA-matched donor, both neutrophil
    and haemoglobin levels normalised. It does not address the craniofacial
    malformations or the hearing loss.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: hematopoietic stem cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_mechanisms:
  - target: Defective Erythropoiesis
    description: Replaces the RPS28-deficient haematopoietic compartment with donor cells, restoring
      erythropoiesis at its source.
  evidence:
  - reference: PMID:40135709
    reference_title: Diagnosis and treatment of Diamond-Blackfan anemia and Pierre-Robin sequence caused
      by a novel mutation of RPS28 gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'The boy underwent HSCT from 9/10 HLA-matched donor and his neutrophil and hemoglobin
      levels returned to normal.'
    explanation: The only reported treatment outcome in an RPS28 patient. It is a single case, so it
      establishes that transplant worked here, not an expected response rate.
  - reference: PMID:40135709
    reference_title: Diagnosis and treatment of Diamond-Blackfan anemia and Pierre-Robin sequence caused
      by a novel mutation of RPS28 gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'HSCT is an effective treatment for hematological abnormalities in DBA.'
    explanation: The authors' generalisation to DBA as a whole, which is the broader basis for
      offering transplant in this genotype.
- name: Corticosteroid Therapy
  description: >-
    Standard first-line therapy for the anemia of DBA, started at age 12 months
    or older. Deliberately deferred through the first year, with chronic
    transfusion used instead, to avoid steroid-induced growth deficiency.

    The two sources give different response rates and the entry cites both rather
    than picking one: the 2014 series says 40%, GeneReviews says 60-80%. They are
    not directly comparable - the GeneReviews figure describes improvement in red
    blood cell count on a treatment given at a specified age, while the 2014
    figure describes patients categorised as steroid-responsive alongside
    spontaneous remitters and transfusion-dependent patients. No steroid-response
    data exist for RPS28 patients specifically, so either way this is offered on
    the basis of the DBA literature rather than genotype-specific evidence.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: corticosteroid
      term:
        id: CHEBI:50858
        label: corticosteroid
  target_mechanisms:
  - target: Defective Erythropoiesis
    description: Improves red cell output in steroid-responsive DBA. The mechanism of the steroid
      response in DBA is itself not established.
  evidence:
  - reference: PMID:24942156
    reference_title: Diamond-Blackfan anemia with mandibulofacial dystostosis is heterogeneous, including
      the novel DBA genes TSR2 and RPS28.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: 'The anemia remits spontaneously in about 20%, is steroid responsive in 40% and requires
      long term transfusions in about 40%'
    explanation: Gives the steroid-response rate for DBA as a whole. Marked INDIRECT because the
      claim about RPS28 patients follows from their being DBA patients rather than from any
      RPS28-specific observation.
  - reference: PMID:20301769
    reference_title: DBA Syndrome.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Corticosteroid treatment, recommended in children at age 12 months or older, improves
      the red blood cell count in approximately 60%-80% of affected individuals.'
    explanation: The GeneReviews response rate, higher than the 40% figure above and measured
      differently. Both are curated so a reader sees the range rather than whichever number the
      curator happened to meet first; also the source of the age-12-months recommendation.
- name: Iron Chelation Therapy
  description: >-
    Transfusion-related iron overload is the most common complication in
    transfusion-dependent patients, and chelation is recommended after ten to
    twelve transfusions. Deferasirox orally or desferrioxamine subcutaneously are
    the standard agents.

    Deferiprone is the agent to avoid. GeneReviews lists it explicitly under
    agents/circumstances to avoid in DBA because it can cause neutropenia - which
    is pointed for this genotype specifically, since the one reported RPS28
    patient was granulocytopenic from birth.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: deferasirox
      term:
        id: CHEBI:49005
        label: deferasirox
  target_mechanisms:
  - target: Macrocytic anemia
    description: Does not treat the anemia. It manages the iron burden that chronic transfusion
      creates, so it is downstream of the treatment rather than of the disease.
  evidence:
  - reference: PMID:20301769
    reference_title: DBA Syndrome.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Iron chelation therapy with deferasirox orally or desferrioxamine subcutaneously is
      recommended after ten to 12 transfusions.'
    explanation: Names both agents and the transfusion count that triggers chelation.
  - reference: PMID:20301769
    reference_title: DBA Syndrome.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Agents/circumstances to avoid: Deferiprone for the treatment of iron overload (which
      can cause neutropenia)'
    explanation: The drug-safety warning. Curated because this entry also records neutropenia in the
      only reported RPS28 patient, so the caution is not generic here.
- name: Malignancy Surveillance
  description: >-
    Lifelong cancer surveillance: history, examination and blood counts every four
    to six months. A rapid fall in any cell line triggers bone marrow aspirate
    with biopsy and cytogenetics, looking for acquired abnormalities of
    chromosomes 5, 7 and 8 that mark myelodysplastic syndrome or leukemia.

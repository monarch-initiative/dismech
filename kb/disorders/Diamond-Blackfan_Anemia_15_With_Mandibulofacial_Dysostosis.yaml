      ICD-10-CM has no code for any individual DBA genotype. D61.01 is the code
      the whole of Diamond-Blackfan anemia falls under, so it is broader than
      this entry by the full width of the DBA gene panel; recorded as a
      broadMatch cross-reference for billing and registry lookup, not as an
      equivalence. This mirrors the mapping on the sibling DBA14 entry.

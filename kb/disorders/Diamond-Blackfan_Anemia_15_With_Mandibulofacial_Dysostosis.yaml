name: Diamond-Blackfan Anemia 15 with Mandibulofacial Dysostosis
creation_date: '2026-09-10T19:00:00Z'
category: Mendelian
disease_term:
  preferred_term: Diamond-Blackfan anemia 15 with mandibulofacial dysostosis
  term:
    id: MONDO:0011639
    label: Diamond-Blackfan anemia 15 with mandibulofacial dysostosis
description: >-
  Diamond-Blackfan anemia 15 with mandibulofacial dysostosis (DBA15) is the
  RPS28-related form of Diamond-Blackfan anemia, in which the erythroid failure
  of DBA occurs together with a craniofacial phenotype that reads clinically as
  a mandibulofacial dysostosis - micrognathia, cleft palate, downslanted
  palpebral fissures, ear anomalies and hearing loss.

  It was defined in the same six-family series that defined DBA14, and the two
  entries are siblings: that study set out to explain patients who combined
  Treacher Collins-like faces with DBA, found the combination was genetically
  heterogeneous, and named both TSR2 and RPS28 as new disease genes in the
  process. RPS28 is the more conventional of the two - it encodes eS28, a small
  ribosomal subunit protein, so the lesion is in a structural component rather
  than in a chaperone.

  The striking allelic feature is that every reported variant destroys the RPS28
  start codon. Two de novo start-codon variants defined the disease, and the only
  subsequently reported case carries c.2T>C, p.Met1?. That is a narrower allelic
  spectrum than most DBA genes show, and the entry records it as an observation
  rather than as an established requirement - three patients is not a spectrum.

  Mechanistically it belongs to the ribosomopathies: an RPS28 lesion impedes
  ribosome biogenesis, and the founding authors attribute both halves of the
  phenotype - the anemia and the craniofacial malformation - to that single
  upstream defect acting on cell growth and proliferation.
synonyms:
- DBA15
- Diamond-Blackfan anemia caused by mutation in RPS28
- RPS28 Diamond-Blackfan anemia
categories:
- Ribosomopathy
- Inherited Bone Marrow Failure Syndrome
parents:

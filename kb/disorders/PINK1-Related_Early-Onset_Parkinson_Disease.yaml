      term:
        id: CHEBI:15765
        label: L-dopa
    - preferred_term: carbidopa
      term:
        id: CHEBI:3395
        label: carbidopa
  target_mechanisms:
  - target: Nigrostriatal Dopamine Deficiency
    treatment_effect: RESTORES
    description: >-
      Levodopa is decarboxylated to dopamine in surviving nigrostriatal terminals
      and other striatal cells, replacing the missing transmitter downstream of
      the degenerated neurons. It restores striatal dopaminergic transmission
      without touching the upstream mitophagy defect, which is why the response
      is symptomatic rather than disease-modifying.
    evidence:
    - reference: PMID:20301792
      reference_title: PINK1 Type of Young-Onset Parkinson Disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Individuals have a marked and sustained response to oral administration of levodopa (L-dopa), frequently associated with L-dopa-induced fluctuations and dyskinesias."
      explanation: The clinical response that shows the striatal deficit is the pharmacological target.

    evidence_source: HUMAN_CLINICAL
    snippet: "Single photon emission computed tomography quantification of striatal dopamine transporter binding (123I-Ioflupane) revealed a posterior-anterior gradient similar to that of idiopathic Parkinson's disease, but there was no correlation between striatal reduced uptake and disease duration."
    explanation: In vivo evidence of the striatal presynaptic dopaminergic deficit in biallelic PINK1 patients.
  - reference: PMID:17563363
    reference_title: Impaired dopamine release and synaptic plasticity in the striatum of PINK1-deficient mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Amperometric recordings, however, revealed decreases in evoked DA release in striatal slices and reductions in the quantal size and release frequency of catecholamine in dissociated chromaffin cells."
    explanation: The mouse shows reduced evoked striatal dopamine release without neuron loss, supporting a release deficit as a component of the dopamine deficiency.
  - reference: PMID:17563363
    reference_title: Impaired dopamine release and synaptic plasticity in the striatum of PINK1-deficient mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Intracellular recordings of striatal medium spiny neurons, the major dopaminergic target, showed specific impairments of corticostriatal long-term potentiation and long-term depression in PINK1(-/-) mice."
    explanation: Downstream circuit consequence in the medium spiny neurons bound on this node.
  downstream:

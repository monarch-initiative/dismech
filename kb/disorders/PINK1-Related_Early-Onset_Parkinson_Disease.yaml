- name: Mitochondrial Calcium Overload and ROS Production
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    In PINK1-deficient neurons, impaired mitochondrial calcium efflux produces
    mitochondrial calcium overload, which stimulates reactive oxygen species
    production through NADPH oxidase; the ROS inhibit glucose transport and
    impair respiration. Reduced calcium capacity and raised ROS together lower
    the threshold for opening of the mitochondrial permeability transition pore,
    so that physiological calcium stimuli become sufficient to trigger it. This
    is a proposed cell-death mechanism from cultured neurons, carried as the one
    named intermediate between mitochondrial dysfunction and nigral neuron loss;
    confidence is PROVISIONAL because it has not been shown in human nigral
    tissue.

    The common sporadic alpha-synucleinopathy, curated in the `Parkinsons_Disease`
    entry. Motor signs, levodopa response and dopamine transporter imaging can be
    indistinguishable; onset before 45, slow progression, early dyskinesias,
    dystonia at onset, hyperreflexia, relative sparing of cognition and
    autonomic function, consanguinity or an affected sib point to a recessive
    monogenic form, and molecular testing discriminates.
  disease_term:
    preferred_term: Parkinson disease
    term:
      id: MONDO:0005180
      label: Parkinson disease
  evidence:
  - reference: PMID:20301792
    reference_title: PINK1 Type of Young-Onset Parkinson Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "early onset (median age at onset 32 years) of tremor, bradykinesia, and rigidity that are often indistinguishable from other causes of Parkinson disease"
    explanation: GeneReviews states that the motor syndrome is often indistinguishable from other causes of Parkinson disease.
  - reference: PMID:19815446
    reference_title: Parkin and PINK1 parkinsonism may represent nigral mitochondrial cytopathies distinct from Lewy body Parkinson's disease.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "This contrasts with homozygous parkin, PINK1 or DJ1 parkinsonism, characterized by young-onset (usually <40 years), and a comparatively benign course of predominantly levodopa-responsive symptoms without dementia or prominent dysautonomia."
    explanation: A review's statement of the clinical features separating the recessive forms, taken together, from clinic Parkinson disease.
  - reference: PMID:22956510
    reference_title: Systematic review and UK-based study of PARK2 (parkin), PINK1, PARK7 (DJ-1) and LRRK2 in early-onset Parkinson's disease.
    supports: SUPPORT

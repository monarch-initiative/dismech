- name: Nigrostriatal Dopamine Deficiency
  conforms_to: "parkinsonism_dopaminergic_degeneration#Striatal Dopamine Deficiency and Basal Ganglia Circuit Dysfunction"
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED
  description: >-
    Striatal dopaminergic denervation, demonstrated in vivo by reduced dopamine
    transporter binding with a putamen-predominant gradient, deprives striatal
    medium spiny neurons of dopaminergic input. PINK1-null mice, which lose no
    neurons, still show reduced evoked striatal dopamine release and impaired
    corticostriatal plasticity, suggesting that a presynaptic release deficit
    precedes and compounds the denervation.
  biological_processes:

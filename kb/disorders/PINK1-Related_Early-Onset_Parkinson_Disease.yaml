    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Post-mortem neuropathological examination of an early-onset Parkinson's disease carrier of two heterozygous compound phosphatase and tensin homolog-induced putative kinase 1 mutations showed neuronal loss in the substantia nigra pars compacta, Lewy bodies and aberrant neurites in the reticular nuclei of the brainstem, substantia nigra pars compacta and Meynert nucleus, but the locus ceruleus and the amygdala were spared."
    explanation: A second autopsy confirming neuronal loss in the substantia nigra pars compacta.
  - reference: PMID:16672980
    reference_title: Mitochondrial dysfunction in Drosophila PINK1 mutants is complemented by parkin.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here, we show that PINK1 mutants exhibit indirect flight muscle and dopaminergic neuronal degeneration accompanied by locomotive defects."
    explanation: Dopaminergic neuron degeneration from PINK1 loss in an invertebrate model; see the human-model mismatch discussion for the mouse, which does not reproduce it.
  downstream:

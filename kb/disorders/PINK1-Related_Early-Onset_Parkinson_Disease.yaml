    snippet: "Single photon emission computed tomography quantification of striatal dopamine transporter binding (123I-Ioflupane) revealed a posterior-anterior gradient similar to that of idiopathic Parkinson's disease, but there was no correlation between striatal reduced uptake and disease duration."
    explanation: The imaging phenotype in a six-patient family with biallelic PINK1 variants.
diagnosis:
- name: PINK1 Molecular Genetic Testing with Exon-Dosage Analysis
  description: >-
    The diagnosis is established by identifying biallelic pathogenic PINK1
    variants. Because whole-exon deletions are part of the mutational spectrum,
    sequence analysis should be paired with a copy-number method (for example
    MLPA) when only one sequence variant is found in a patient with a compatible
    phenotype.

name: PINK1-Related Early-Onset Parkinson Disease
creation_date: "2026-11-11T05:00:00Z"
description: >-
  PINK1-related early-onset Parkinson disease (PARK6, PARK-PINK1) is an autosomal
  recessive parkinsonism caused by biallelic loss-of-function variants in PINK1,
  which encodes a mitochondrially targeted serine/threonine kinase. PINK1 is the
  upstream damage sensor of the PINK1-parkin mitochondrial quality-control
  pathway: it escapes proteolysis and accumulates on depolarized mitochondria,
  phosphorylates ubiquitin and the parkin ubiquitin-like domain at Ser65, and so
  recruits and activates parkin to tag damaged organelles for mitophagy. Loss of
  PINK1 kinase activity disables that pathway at its first step, leaving damaged
  mitochondria undetected and uncleared, and is followed by degeneration of
  substantia nigra pars compacta dopaminergic neurons. The clinical picture is an
  early-onset (median about 32 years), slowly progressive, markedly
  levodopa-responsive parkinsonism, often with lower-limb dystonia at onset,
  hyperreflexia and psychiatric features, and with early levodopa-induced
  dyskinesias. Unlike PRKN-related disease, the few autopsied PINK1 cases mostly
  show Lewy body pathology.
category: Mendelian
parents:
- Neurodegenerative Disease
- Movement Disorder
disease_term:
  preferred_term: autosomal recessive early-onset Parkinson disease 6
  term:
    id: MONDO:0011613
    label: autosomal recessive early-onset Parkinson disease 6
synonyms:
- autosomal recessive early-onset Parkinson disease 6
- autosomal recessive early-onset Parkinson disease type 6
- Parkinson disease 6, autosomal recessive early-onset
- PARK6
- PARK-PINK1
- PINK1 Parkinson disease
- PINK1 type of young-onset Parkinson disease
- PINK1-associated Parkinson disease
- PINK1-linked parkinsonism
classifications:
  harrisons_chapter:
  - classification_value: NEUROLOGIC
notes: >-
  Lump-vs-split rationale: this entry is deliberately kept separate from the
  `Parkinsons_Disease` entry (MONDO:0005180), which is the basket for the common,
  clinically diagnosed, mostly idiopathic late-onset alpha-synucleinopathy, and
  it parallels the `PRKN-Related_Juvenile_Parkinson_Disease` and
  `PARK7-Related_Early-Onset_Parkinson_Disease` entries. The case for a separate
  entry is mechanistic and genetic rather than clinical. (1) Different mechanism
  anchor: the basket's graph is built on alpha-synuclein aggregation and Lewy
  pathology, whereas this disease is a monogenic failure of the PINK1-parkin
  mitophagy pathway at its sensing step, with a fully resolved molecular chain
  (voltage-dependent PINK1 stabilization, Ser65 phosphorylation of ubiquitin and
  parkin, parkin recruitment and activation, substrate ubiquitination, mitophagy).
  (2) Different genetics: biallelic PINK1 variants are necessary; the entry
  accounts for a few percent of early-onset Parkinson disease and for none of the
  late-onset basket. (3) Different clinical signature: median onset about 32
  years, dystonia at onset, hyperreflexia, a marked and sustained levodopa
  response with early dyskinesias, slow progression and relative cognitive
  sparing. (4) Neuropathology does NOT separate it from the basket: three of the
  four autopsied biallelic PINK1 cases carried Lewy bodies, in contrast to
  PRKN-related disease where Lewy bodies are usually absent. That is recorded in
  `histopathology` and in the conformance of the `Lewy Body Pathology` node to the
  parkinsonism module, and is a reason to keep this entry and the PRKN entry
  distinct from each other as well as from the basket. The basket keeps a thin
  PARK6 row in `has_subtypes` pointing at MONDO:0011613 and a one-paragraph PINK1
  row in `genetic`; the mechanism is curated only here. ClinGen note: the
  ClinGen Parkinson's Disease GCEP classifies the PINK1 gene-disease pair as
  Definitive, autosomal recessive, against the broad term Parkinson disease
  (MONDO:0005180), not against MONDO:0011613. That assertion is quoted as
  evidence on the `genetic` row but is deliberately NOT copied into
  `gene_disease_validity`, because the repository rule admits a ClinGen tier only
  when its MONDO term is the entry's own `disease_term`, a subtype term or an
  exactMatch mapping; an entry-level MONDO:0011613 assertion does not exist.
  Entry naming: the dyadic name follows design decision 18. It is not a MONDO
  synonym verbatim (MONDO carries "PINK1 Parkinson disease" and the abbreviation
  "PARK6"; the ClinGen-sourced synonym is the MONDO label itself), and the
  GeneReviews chapter is titled "PINK1 Type of Young-Onset Parkinson Disease", so
  the name rests on recurring literature use: a PubMed phrase search on
  2026-11-11 returned 13 records for "PINK1-related early-onset Parkinson" and 30
  for "PINK1-related Parkinson" (for example PMID:39973502, PMID:39294919,
  PMID:38508312, PMID:34686591), against 3 for the GeneReviews title. The MONDO
  label, the GeneReviews title and the MDSGene designation PARK-PINK1 are kept in
  `synonyms`. Named-entity-confusion preflight: the PARK numbered series is a
  high-NEC-risk class in which PARK2/PRKN, PARK6/PINK1 and PARK7/DJ-1 are
  routinely conflated. MONDO:0011613 was read from OLS on 2026-11-11: label
  "autosomal recessive early-onset Parkinson disease 6", xref OMIM:605909,
  synonyms "PARK6", "PINK1 Parkinson disease" and "Parkinson disease caused by
  mutation in PINK1", parent MONDO:0017279. Every evidence item in this entry was
  checked to be about PINK1 rather than parkin or DJ-1; where a source reports
  the three genes jointly (PMID:29644727, PMID:22956510, PMID:19815446) the
  joint scope is stated in the item's explanation. Heterozygous PINK1 variants:
  whether a single PINK1 allele confers Parkinson disease risk is unsettled and
  is a claim about the basket disease, not about this recessive entry; it is
  recorded as a KNOWLEDGE_GAP discussion attached to the `genetic` row rather
  than as a second relationship, with the positive G411S association
  (PMID:27807026) and the large negative meta-analysis (PMID:32249012) both
  quoted. Mutational spectrum: whole-exon deletions occur in PINK1 (an exon 7
  deletion in PMID:20356854 and an exon 4-5 deletion in PMID:32814227), so
  sequence analysis alone can miss one allele; this is recorded on the
  `diagnosis` row. Term-binding notes: `HP:0000708` Atypical behavior is bound
  for the GeneReviews phrase "abnormal behavior, and psychiatric manifestations"
  because the chapter abstract names no specific psychiatric diagnosis; no
  narrower term is asserted. The histopathology `finding_term` is bound to the
  generic NCIT morphologic finding Tissue Degeneration, as in the PRKN entry,
  because the HistopathologyFindingTerm branch offers no term for nigral
  neuronal loss or for Lewy bodies; the specific finding is carried in
  `preferred_term`, the description and the evidence. Snippets are quoted from
  abstracts only. Deep-research provenance: a falcon run was requested and
  failed on authentication, so the run fell back to openscientist
  (`research/PINK1-Related_Early-Onset_Parkinson_Disease-deep-research-openscientist.md`,
  `fell_back: true`, 40 citations, all 40 resolved, 4 of 27 quotes not found of
  which two are typography and two misattributed; its term-validation section
  could not be added because OLS timed out repeatedly on 2026-11-11). It was
  used as a completeness cross-check only; every claim here is sourced to a
  cached primary reference read directly. `just preflight-dr` returned WARN on
  the report for writing HGNC:14581 beside the symbol PTEN (PINK1's full name
  is PTEN-induced kinase 1), so no identifier was copied from it. Deliberately
  omitted: the cGAS-STING innate-immune arm, because its primary mouse source
  (PMID:30135585) was retracted in 2025, as the PRKN entry records; and
  disease-modifying PINK1 activators or parkin molecular glues, which are
  preclinical and not treatments.
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Affected individuals carry biallelic (homozygous or compound heterozygous)
    pathogenic PINK1 variants. Pseudo-dominant transmission has been observed in a
    family segregating two different variants. Whether heterozygous carriers are
    at increased risk of Parkinson disease is unresolved (see the discussion
    attached to the PINK1 genetic row).
  evidence:
  - reference: PMID:20301792
    reference_title: PINK1 Type of Young-Onset Parkinson Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PINK1 type of young-onset Parkinson disease is inherited in an autosomal recessive manner."
    explanation: GeneReviews states the mode of inheritance directly, supporting the HP:0000007 binding.
  - reference: PMID:16401616
    reference_title: Mutational analysis of the PINK1 gene in early-onset parkinsonism in Europe and North Africa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All the mutations were in the homozygous or compound heterozygous states. Interestingly, pseudo-dominant inheritance was observed in a family with two different mutations."
    explanation: Confirms biallelic gene action in a 177-family screen and records the pseudo-dominant pedigree noted in the description.
prevalence:
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: RARE
  notes: >-
    No population-based prevalence estimate for PINK1-related Parkinson disease
    was identified in the sources used for this entry, so only the qualitative
    band is asserted. The rarity can be bounded indirectly: only a small minority
    of Parkinson disease is early-onset, and PINK1 explains only a few percent of
    that subgroup (see the structured `case_fractions` on the PINK1 genetic row,
    which is the quantified dimension). Do not read this record as a measured
    rate.
  evidence:
  - reference: PMID:22956510
    reference_title: Systematic review and UK-based study of PARK2 (parkin), PINK1, PARK7 (DJ-1) and LRRK2 in early-onset Parkinson's disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "Approximately 3.6% of patients with Parkinson's disease develop symptoms before age 45."
    explanation: >-
      Supports the rarity band only indirectly. It quantifies the early-onset
      Parkinson disease denominator, of which PINK1-attributable cases are a
      minority; it does not measure this disease's own occurrence.
progression:
- phase: Age at onset
  notes: >-
    Median age at onset about 32 years (GeneReviews), with a reported family range
    of 14-45 years; onset after 50 is uncommon. Progression is slow and the
    levodopa response is sustained over decades.
  evidence:
  - reference: PMID:20301792
    reference_title: PINK1 Type of Young-Onset Parkinson Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "early onset (median age at onset 32 years) of tremor, bradykinesia, and rigidity that are often indistinguishable from other causes of Parkinson disease"
    explanation: GeneReviews gives the median age at onset.
  - reference: PMID:20356854
    reference_title: PINK1-linked parkinsonism is associated with Lewy body pathology.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The phenotype was characterized by an early-onset (mean: 31.6, standard deviation: 9.6 years, range: 14-45 years), slowly progressive levodopa-responsive parkinsonism, initial gait impairment and psychiatric symptoms."
    explanation: Mean and range of onset in a six-patient Spanish family with biallelic PINK1 variants.
  - reference: PMID:29644727
    reference_title: "Genotype-Phenotype Relations for the Parkinson's Disease Genes Parkin, PINK1, DJ1: MDSGene Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "median age at onset of ∼30 years for carriers of at least 2 mutations in any of the 3 genes"
    explanation: >-
      Systematic-review confirmation of the early median onset. The MDSGene
      figure pools carriers of biallelic variants in Parkin, PINK1 or DJ1 rather
      than PINK1 alone.
- phase: Disease course
  notes: >-
    Slowly progressive; disease durations of two to three decades with preserved
    levodopa responsiveness are reported, and dementia and prominent dysautonomia
    are not typical features of the biallelic recessive forms.
  evidence:
  - reference: PMID:20301792
    reference_title: PINK1 Type of Young-Onset Parkinson Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The disease is usually slowly progressive."
    explanation: GeneReviews statement of the tempo of progression.
  - reference: PMID:11748730
    reference_title: Phenotypic characterisation of autosomal recessive PARK6-linked parkinsonism in three unrelated Italian families.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Affected individuals had a mean age of 57 +/- 8.5 years, and average disease duration was 21 +/- 7.8 years."
    explanation: Documents a mean disease duration of two decades in nine PARK6-linked patients.
  - reference: PMID:19815446
    reference_title: Parkin and PINK1 parkinsonism may represent nigral mitochondrial cytopathies distinct from Lewy body Parkinson's disease.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "This contrasts with homozygous parkin, PINK1 or DJ1 parkinsonism, characterized by young-onset (usually <40 years), and a comparatively benign course of predominantly levodopa-responsive symptoms without dementia or prominent dysautonomia."
    explanation: >-
      A review's synthesis of the course of the three recessive forms taken
      together; it is not a PINK1-specific cohort result and is graded OTHER with
      quote_role REVIEW_SYNTHESIS for that reason.
genetic:
- name: PINK1
  gene_term:
    preferred_term: PINK1
    term:
      id: hgnc:14581
      label: PINK1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: present
  association: >-
    Biallelic loss-of-function variants in PINK1 (PTEN-induced kinase 1) at
    1p36, encoding a 581-residue mitochondrially targeted serine/threonine
    kinase, cause autosomal recessive early-onset Parkinson disease. The locus was
    mapped as PARK6 in a Sicilian kindred in 2001 and the gene identified in 2004.
    Missense, nonsense, frameshift and whole-exon deletion alleles are all
    reported; most missense alleles fall in the kinase domain.
  notes: >-
    Whole-exon deletions are part of the mutational spectrum (an exon 7 deletion
    segregating in PMID:20356854 and a heterozygous exon 4-5 deletion in
    PMID:32814227), so an apparently single heterozygous sequence variant in a
    patient with a compatible phenotype should prompt dosage analysis for a
    second, rearrangement allele in trans. The ClinGen Definitive tier quoted
    below is asserted against Parkinson disease (MONDO:0005180), not against this
    entry's MONDO term, and is therefore not recorded in `gene_disease_validity`
    (see the entry-level notes).
  evidence:
  - reference: PMID:15087508
    reference_title: Hereditary early-onset Parkinson's disease caused by mutations in PINK1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we show that mutations in PINK1 (PTEN-induced kinase 1) are associated with PARK6."
    explanation: The gene-identification report establishing PINK1 as the PARK6 gene.
  - reference: PMID:15087508
    reference_title: Hereditary early-onset Parkinson's disease caused by mutations in PINK1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We have identified two homozygous mutations affecting the PINK1 kinase domain in three consanguineous PARK6 families: a truncating nonsense mutation and a missense mutation at a highly conserved amino acid."
    explanation: The founding alleles, both homozygous and both in the kinase domain, supporting recessive loss of kinase function as the genetic mechanism.
  - reference: PMID:11254447
    reference_title: Localization of a novel locus for autosomal recessive early-onset parkinsonism, PARK6, on human chromosome 1p35-p36.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This region contains a novel locus for autosomal recessive early-onset parkinsonism, PARK6."
    explanation: The linkage study that defined the PARK6 locus later resolved to PINK1.
  - reference: PMID:16401616
    reference_title: Mutational analysis of the PINK1 gene in early-onset parkinsonism in Europe and North Africa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In 7 unrelated families, we identified 10 pathogenic PINK1 mutations (5 missense, 2 nonsense and 3 frameshift deletion mutations), 8 of which were novel."
    explanation: Independent replication across 177 recessive families and a description of the allelic classes.
  - reference: PMID:15349870
    reference_title: Novel PINK1 mutations in early-onset parkinsonism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified six pathogenic mutations (R246X, H271Q, E417G, L347P, and Q239X/R492X) in six unrelated families."
    explanation: Early replication in eight PARK6-linked inbred families, with nonsense and missense alleles.
  - reference: CGGV:assertion_1999e6c4-eb15-438a-a4ea-98989112dcbb-2023-01-18T190000.000Z
    reference_title: PINK1 / Parkinson disease (Definitive)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "PINK1 | HGNC:14581 | Parkinson disease | MONDO:0005180 | AR | Definitive"
    explanation: >-
      ClinGen's Parkinson's Disease GCEP classifies the PINK1 gene-disease
      relationship as Definitive with autosomal recessive inheritance. The
      assertion is made against the broad term MONDO:0005180 rather than against
      MONDO:0011613, so it is quoted here as supporting evidence and not copied
      into `gene_disease_validity`.
  case_fractions:
  - population: Early-onset Parkinson disease, pooled systematic review of previously reported studies
    case_fraction_percent: 3.7
    cohort_size: 5800
    notes: >-
      Weighted mean proportion of early-onset Parkinson disease cases carrying
      PINK1 mutations across a systematic review of more than 5800 unique cases.
      The same review reports that PINK1 mutations were more common in Asian
      subjects, so the pooled figure averages over ancestry-dependent rates.
    evidence:
    - reference: PMID:22956510
      reference_title: Systematic review and UK-based study of PARK2 (parkin), PINK1, PARK7 (DJ-1) and LRRK2 in early-onset Parkinson's disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Overall, the weighted mean proportion of cases with PARK2 (parkin), PINK1, and PARK7 (DJ-1) mutations was 8.6%, 3.7%, and 0.4%, respectively."
      explanation: Directly quantifies the PINK1 share of early-onset Parkinson disease cases in a pooled systematic review.
    - reference: PMID:22956510
      reference_title: Systematic review and UK-based study of PARK2 (parkin), PINK1, PARK7 (DJ-1) and LRRK2 in early-onset Parkinson's disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "PINK1 mutations were more common in Asian subjects."
      explanation: Records the ancestry dependence that the pooled figure averages over.
  - population: Italian sporadic early-onset parkinsonism (onset before 50 years)
    case_fraction_percent: 4.4
    cohort_size: 90
    notes: >-
      Homozygous pathogenic PINK1 mutations in 4 of 90 Italian sporadic cases
      (4.4%); the four additional patients carrying a single heterozygous variant
      are not counted here because the authors could not establish that those
      alleles were disease-causing.
    evidence:
    - reference: PMID:16009891
      reference_title: "Early-onset parkinsonism associated with PINK1 mutations: frequency, genotypes, and phenotypes."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Homozygous pathogenic mutations were identified in 4 of 90 Italian sporadic cases, including the novel Gln456Stop mutation"
      explanation: The numerator and denominator behind the 4.4% figure.
    - reference: PMID:16009891
      reference_title: "Early-onset parkinsonism associated with PINK1 mutations: frequency, genotypes, and phenotypes."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "PINK1 homozygous mutations are a relevant cause of disease among Italian sporadic patients with early-onset parkinsonism."
      explanation: The authors' own reading of the frequency.
  - population: Multi-ethnic Malaysian early-onset Parkinson disease cohort (onset at or before 50 years)
    case_fraction_percent: 3.7
    cohort_size: 161
    notes: Pathogenic or likely pathogenic PINK1 variants in 6 of 161 index patients, found by a gene panel plus MLPA.
    evidence:
    - reference: PMID:37209484
      reference_title: Genetic study of early-onset Parkinson's disease in the Malaysian population.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Pathogenic/likely pathogenic variants in GBA1 were identified in thirteen patients (8.1%), and were also commonly found in PRKN and PINK1 (11/161 = 6.8% and 6/161 = 3.7%, respectively)."
      explanation: The PINK1 numerator and denominator in a Southeast Asian cohort.
  variants:
  - name: p.A217D
    description: >-
      Homozygous p.A217D has been reported in a large Sudanese kindred and in a
      consanguineous family of Moroccan origin, which the authors read as a North
      African founder allele. The phenotype is mild, slowly progressive
      parkinsonism.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:28789629
      reference_title: "Early Onset Parkinson's Disease in a family of Moroccan origin caused by a p.A217D mutation in PINK1: a case report."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Together, reports of p.A217D in families of Moroccan and Sudanese origin suggest that p.A217D is a North African mutation due to a founder effect."
      explanation: The founder-effect inference from two North African families.
    - reference: PMID:28789629
      reference_title: "Early Onset Parkinson's Disease in a family of Moroccan origin caused by a p.A217D mutation in PINK1: a case report."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Homozygous p.A217D PINK1 mutations were previously shown to cause EOPD in a large Sudanese kindred."
      explanation: The earlier Sudanese kindred behind the founder claim.
  - name: p.Leu347Pro
    description: >-
      p.L347P was among the first PINK1 alleles reported in PARK6-linked families
      and appears to be common among Malay patients with early-onset Parkinson
      disease in a multi-ethnic Malaysian cohort.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:37209484
      reference_title: Genetic study of early-onset Parkinson's disease in the Malaysian population.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "PRKN exon 7 deletion and the PINK1 p.Leu347Pro variant appear to be common among Malay patients."
      explanation: Population enrichment of the allele in Malay patients.
    - reference: PMID:15349870
      reference_title: Novel PINK1 mutations in early-onset parkinsonism.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We identified six pathogenic mutations (R246X, H271Q, E417G, L347P, and Q239X/R492X) in six unrelated families."
      explanation: L347P among the earliest reported pathogenic PINK1 alleles.
pathophysiology:
- name: PINK1 Biallelic Loss of Function
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Biallelic pathogenic PINK1 variants abolish or reduce the activity of the
    PINK1 serine/threonine kinase. The founding alleles were a nonsense truncation
    and a kinase-domain missense change, and later series add frameshift and
    whole-exon deletion alleles. This is the root lesion of the entry: every
    downstream node describes what fails when the pathway's upstream sensor and
    kinase is missing.
  genes:
  - preferred_term: PINK1
    term:
      id: hgnc:14581
      label: PINK1
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: Homozygous or compound heterozygous loss-of-function PINK1 alleles; the schema zygosity slot is single-valued, so neither value is asserted.
  molecular_functions:
  - preferred_term: PINK1 serine/threonine kinase activity
    term:
      id: GO:0004674
      label: protein serine/threonine kinase activity
    modifier: DECREASED
  evidence:
  - reference: PMID:15087508
    reference_title: Hereditary early-onset Parkinson's disease caused by mutations in PINK1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We have identified two homozygous mutations affecting the PINK1 kinase domain in three consanguineous PARK6 families: a truncating nonsense mutation and a missense mutation at a highly conserved amino acid."
    explanation: The disease alleles disrupt the kinase domain, placing loss of kinase function at the root of the pathograph.
  - reference: PMID:22724072
    reference_title: PINK1 is activated by mitochondrial membrane potential depolarization and stimulates Parkin E3 ligase activity by phosphorylating Serine 65.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: "Missense mutations in PTEN-induced kinase 1 (PINK1) cause autosomal-recessive inherited Parkinson's disease (PD)."
    explanation: Opening statement of a biochemical study, quoted for the framing that the disease alleles are loss-of-function kinase mutations; graded IN_VITRO for the study type and BACKGROUND because the sentence restates established genetics.
  - reference: PMID:21138942
    reference_title: PINK1 cleavage at position A103 by the mitochondrial protease PARL.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: "PINK1 is a 63 kDa protein kinase, which exerts a neuroprotective function and is known to localize to mitochondria."
    explanation: States the protein's identity as a mitochondrially localized kinase, the activity that the biallelic variants remove.
  downstream:
  - target: Failure of PINK1 Stabilization on Damaged Mitochondria
    causal_link_type: DIRECT
    description: >-
      With no functional PINK1, the voltage-dependent accumulation of active
      kinase on a depolarized mitochondrion cannot occur, so the damage signal is
      never generated.
    evidence:
    - reference: PMID:20098416
      reference_title: PINK1/Parkin-mediated mitophagy is dependent on VDAC1 and p62/SQSTM1.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "PINK1 kinase activity and its mitochondrial localization sequence are prerequisites to induce translocation of the E3 ligase Parkin to depolarized mitochondria."
      explanation: Both the kinase activity and the mitochondrial targeting of PINK1 are required for the sensing step that loss-of-function alleles remove.
- name: Mitochondrial Depolarization
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    The physiological trigger of the pathway. In a healthy, polarized
    mitochondrion PINK1 is imported, cleaved by the inner-membrane rhomboid
    protease PARL and degraded, so its steady-state level is very low. Loss of
    membrane potential blocks import and cleavage, allowing full-length PINK1 to
    accumulate on the outer membrane of that individual organelle. This node is
    normal biology rather than a lesion; it is included because the disease is
    defined by what fails to happen in response to it.
  biological_processes:
  - preferred_term: mitochondrial depolarization
    term:
      id: GO:0051882
      label: mitochondrial depolarization
  cellular_components:
  - preferred_term: mitochondrial outer membrane
    term:
      id: GO:0005741
      label: mitochondrial outer membrane
  evidence:
  - reference: PMID:21115803
    reference_title: Mitochondrial membrane potential regulates PINK1 import and proteolytic destabilization by PARL.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the mitochondrial inner membrane rhomboid protease presenilin-associated rhomboid-like protein (PARL) mediates cleavage of PINK1 dependent on mitochondrial membrane potential"
    explanation: Identifies PARL as the protease that keeps PINK1 low on polarized mitochondria, and membrane potential as the switch.

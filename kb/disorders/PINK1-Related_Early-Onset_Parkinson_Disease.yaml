biochemical:
- name: Phospho-Ser65-ubiquitin
  presence: DECREASED
  context: >-
    Research-grade pathway readout in cells and tissue; not a clinical
    laboratory test, and no reference interval exists.
  biomarker_term:
    preferred_term: phospho-Ser65-ubiquitin (pS65-Ub)
  notes: >-
    Ubiquitin phosphorylated at Ser65 is the direct product of PINK1 kinase
    activity and is detected only in the presence of PINK1 and after
    mitochondrial depolarization, so its absence reads out loss of the pathway's
    first step. No NCIT biomarker term is bound: an OLS search of NCIT for
    "phosphorylated ubiquitin" on 2026-11-11 returned no phospho-ubiquitin
    concept, and the KB's NCIT cache holds none.
  evidence:
  - reference: PMID:24784582
    reference_title: Ubiquitin is phosphorylated by PINK1 to activate parkin.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "PINK1 phosphorylated ubiquitin at Ser 65 both in vitro and in cells, and a Ser 65 phosphopeptide derived from endogenous ubiquitin was only detected in cells in the presence of PINK1 and following a decrease in mitochondrial membrane potential."
    explanation: The phosphopeptide is PINK1-dependent, so it is absent where PINK1 is lost.
  - reference: PMID:22724072
    reference_title: PINK1 is activated by mitochondrial membrane potential depolarization and stimulates Parkin E3 ligase activity by phosphorylating Serine 65.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our findings indicate that monitoring phosphorylation of Parkin at Ser(65) and/or PINK1 at Thr(257) represent the first biomarkers for examining activity of the PINK1-Parkin signalling pathway in vivo."
    explanation: The authors' proposal of Ser65 phosphorylation as a pathway-activity biomarker; the sister substrate, parkin Ser65, is named here.
  readouts:
  - target: Loss of Ubiquitin and Parkin Ser65 Phosphorylation
    relationship: READOUT_OF
    direction: PRESENT_ABSENT
    interpretation: >-
      Absence of pS65-Ub after depolarization indicates loss of PINK1 kinase
      activity on mitochondria; its presence excludes complete loss of the
      pathway's first step.
    evidence:
    - reference: PMID:24784582
      reference_title: Ubiquitin is phosphorylated by PINK1 to activate parkin.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Here we report that ubiquitin is the genuine substrate of PINK1."
      explanation: Ubiquitin Ser65 phosphorylation is the PINK1 reaction the node describes.
histopathology:
- name: Nigral Neuronal Loss with Lewy Body Pathology
  description: >-
    Severe loss of pigmented neurons with gliosis in the substantia nigra pars
    compacta, accompanied in three of the four reported autopsies by Lewy bodies
    and Lewy neurites. The Lewy distribution differs between cases: the first
    report spared the locus ceruleus and amygdala, while the longest-duration
    case involved the locus coeruleus and temporal and parahippocampal cortex,
    and one patient had no Lewy-related pathology. This contrasts with
    PRKN-related disease, in which Lewy bodies are usually absent, and means
    that Lewy pathology cannot be used to separate PINK1-related disease from
    idiopathic Parkinson disease at autopsy.
  finding_term:
    preferred_term: nigral neuronal loss with Lewy bodies and Lewy neurites
    term:
      id: NCIT:C50774
      label: Tissue Degeneration
  diagnostic: false
  notes: >-
    The finding_term is bound to the generic NCIT morphologic finding Tissue
    Degeneration because the HistopathologyFindingTerm branch provides no term
    for nigral neuronal loss or for Lewy bodies. The specific finding is carried
    by preferred_term, the description and the evidence.
  evidence:
  - reference: PMID:20356854
    reference_title: PINK1-linked parkinsonism is associated with Lewy body pathology.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Post-mortem neuropathological examination of an early-onset Parkinson's disease carrier of two heterozygous compound phosphatase and tensin homolog-induced putative kinase 1 mutations showed neuronal loss in the substantia nigra pars compacta, Lewy bodies and aberrant neurites in the reticular nuclei of the brainstem, substantia nigra pars compacta and Meynert nucleus, but the locus ceruleus and the amygdala were spared."
    explanation: The first autopsy report of a biallelic PINK1 patient.
  - reference: PMID:32814227
    reference_title: Neuropathological findings in PINK1-associated Parkinson's disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Post-mortem neuropathological examination after more than 30 years of disease revealed gliosis and a large loss of melanin-containing neurons in the substantia nigra."
    explanation: Nigral loss and gliosis in the longest-duration autopsied case.
  - reference: PMID:32814227
    reference_title: Neuropathological findings in PINK1-associated Parkinson's disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Lewy body pathology was evident in substantia nigra, temporal cortex, locus coeruleus and the parahippocampal region."
    explanation: Lewy pathology extending to cortex in that case.
  - reference: PMID:32814227
    reference_title: Neuropathological findings in PINK1-associated Parkinson's disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Previous reports describe two patients with Lewy-related pathologies, albeit with differential distribution, and one patient with no Lewy-related pathology."
    explanation: The tally that makes Lewy pathology usual but not invariant in this disease.

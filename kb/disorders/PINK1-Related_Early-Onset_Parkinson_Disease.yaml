    explanation: Establishes the three-gene recessive differential.
discussions:
- discussion_id: hmm_pink1_knockout_mouse_no_nigral_degeneration
  prompt: >-
    Why do PINK1-null mice show impaired striatal dopamine release and
    corticostriatal plasticity but no loss of substantia nigra dopaminergic
    neurons, when biallelic PINK1 patients show severe nigral neuron loss at
    autopsy and Drosophila pink1 mutants show dopaminergic neuron degeneration?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Accumulation of Dysfunctional Mitochondria and Oxidative Stress
  - pathophysiology#Selective Dopaminergic Neuron Loss in the Substantia Nigra Pars Compacta
  - pathophysiology#Nigrostriatal Dopamine Deficiency
  rationale: >-
    The mismatch sits on the load-bearing edge of the pathograph. PINK1-null mice
    reproduce the upstream biology (mitochondrial dysfunction, a presynaptic
    dopamine release deficit, impaired striatal plasticity) but have normal
    numbers of nigral dopaminergic neurons and normal striatal dopamine content,
    whereas the four autopsied human cases show severe nigral loss. The fly, by
    contrast, does lose dopaminergic neurons. Evidence is therefore present and
    discordant rather than absent, which is why this is a HUMAN_MODEL_MISMATCH
    and not a KNOWLEDGE_GAP, and it is why the edge from mitochondrial
    dysfunction to nigral neuron loss is typed INDIRECT_UNKNOWN_INTERMEDIATES.
    The same dissociation is seen in parkin-null mice, so it is a property of
    the pathway in the mouse rather than of one gene. Candidate explanations are
    rodent lifespan too short to accumulate the required mitochondrial burden,
    redundancy from other mitophagy routes, and species differences in nigral
    neuron vulnerability. Translationally, protection in this model cannot be
    read as protection against nigral degeneration.
  proposed_experiments:
  - experiment_id: exp_pink1_ipsc_nigral_neuron_survival
    name: Isogenic patient-derived iPSC midbrain dopaminergic neuron survival under chronic mitochondrial stress
    description: >-
      Differentiate midbrain dopaminergic neurons from biallelic PINK1 patient
      iPSCs and isogenic gene-corrected controls, apply chronic low-grade
      mitochondrial stress with extended culture, and measure phospho-Ser65
      ubiquitin, mitophagic flux, mitochondrial DNA damage and neuron survival.
      This asks directly whether human nigral-type neurons convert the PINK1-loss
      mitochondrial phenotype into cell death.
  - experiment_id: exp_pink1_aged_stressed_mouse_nigral_counts
    name: Stereological nigral counts in aged and mitochondrially stressed PINK1-null mice
    description: >-
      Blinded stereological tyrosine-hydroxylase-positive nigral counts in
      PINK1-null mice aged to the limit of lifespan and sensitized with an
      independent mitochondrial stressor, with longitudinal striatal dopamine
      release measurements. A positive result would support the cumulative-burden
      explanation; a persistently negative result would argue for species-specific
      compensation.
  evidence:
  - reference: PMID:17563363
    reference_title: Impaired dopamine release and synaptic plasticity in the striatum of PINK1-deficient mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We found that numbers of dopaminergic neurons and levels of striatal dopamine (DA) and DA receptors are unchanged in PINK1(-/-) mice."
    explanation: The primary statement of the mismatch on the model side.
  - reference: PMID:17563363
    reference_title: Impaired dopamine release and synaptic plasticity in the striatum of PINK1-deficient mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These results reveal a critical role for PINK1 in DA release and striatal synaptic plasticity in the nigrostriatal circuit and suggest that altered dopaminergic physiology may be a pathogenic precursor to nigrostriatal degeneration."
    explanation: The authors' reading that the mouse captures a precursor state rather than the degeneration itself.
  - reference: PMID:32814227
    reference_title: Neuropathological findings in PINK1-associated Parkinson's disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Post-mortem neuropathological examination after more than 30 years of disease revealed gliosis and a large loss of melanin-containing neurons in the substantia nigra."
    explanation: The human side of the mismatch.
  - reference: PMID:16672980
    reference_title: Mitochondrial dysfunction in Drosophila PINK1 mutants is complemented by parkin.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here, we show that PINK1 mutants exhibit indirect flight muscle and dopaminergic neuronal degeneration accompanied by locomotive defects."
    explanation: The fly does reproduce dopaminergic neuron degeneration, so the mismatch is specific to the mouse rather than to all models.

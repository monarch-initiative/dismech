treatments:
- name: Levodopa
  description: >-
    Dopamine replacement is the mainstay of therapy and PINK1-related disease
    responds markedly and durably, usually at modest doses. Levodopa is given
    with a peripheral decarboxylase inhibitor; GeneReviews lists it with
    dopamine agonists as first-line, combinable with COMT inhibitors, MAO-B
    inhibitors, anticholinergics and amantadine. Dyskinesias and fluctuations
    are frequent and early, so the dose is kept to what gives a satisfactory
    response. Neuroleptics may exacerbate parkinsonism and are avoided.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:

    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of PINK1 type of young-onset Parkinson disease is established by the identification of biallelic PINK1 pathogenic variants on molecular genetic testing."
    explanation: States the diagnostic standard.
  - reference: PMID:20356854
    reference_title: PINK1-linked parkinsonism is associated with Lewy body pathology.
    supports: SUPPORT

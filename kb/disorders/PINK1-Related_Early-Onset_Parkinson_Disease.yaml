  status: OPEN
  attaches_to:
  - genetic#PINK1
  rationale: >-
    This is a question about the basket disease, not about the recessive entity
    this entry curates, but it is attached here because it concerns the same
    gene and the carrier relatives of every proband. Single heterozygous
    variants were found in 4 of 90 Italian sporadic early-onset patients, with a
    later onset than homozygotes, and a case-control study of p.G411S reported
    an odds ratio of 2.92 with a dominant-negative kinase defect in carrier
    cells. A subsequent assessment of 13,708 cases and 362,850 controls found no
    evidence for heterozygous PINK1 variants as a robust risk factor, while
    unaffected heterozygotes show a subclinical temporal-discrimination
    endophenotype. The evidence items below are graded against the claim "heterozygous PINK1
    variants increase Parkinson disease risk". The question is left open rather
    than resolved, and no RISK_FACTOR relationship is recorded for PINK1 in the
    basket entry on this evidence.
  evidence:
  - reference: PMID:27807026
    reference_title: Heterozygous PINK1 p.G411S increases risk of Parkinson's disease via a dominant-negative mechanism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Heterozygous PINK1 p.G411S mutations markedly increased Parkinson's disease risk (odds ratio = 2.92, P = 0.032); significance remained when supplementing with results from previous studies on 4437 additional subjects (odds ratio = 2.89, P = 0.027)."
    explanation: The positive association for one allele, from 2560 patients and 2145 controls.
  - reference: PMID:27807026
    reference_title: Heterozygous PINK1 p.G411S increases risk of Parkinson's disease via a dominant-negative mechanism.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "By contrast, PINK1 p.G411S heterozygotes showed no decrease of PINK1 protein levels but a sustained, significant reduction in kinase activity."
    explanation: The functional finding in carrier fibroblasts and induced neurons that distinguishes p.G411S from ordinary recessive loss-of-function alleles.
  - reference: PMID:32249012
    reference_title: Comprehensive assessment of PINK1 variants in Parkinson's disease.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "After combining these data, we did not find evidence to support a role for heterozygous PINK1 mutations as a robust risk factor for Parkinson's disease."
    explanation: The large negative assessment, refuting the general claim; it does not exclude a small or allele-specific effect.
  - reference: PMID:16009891
    reference_title: "Early-onset parkinsonism associated with PINK1 mutations: frequency, genotypes, and phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "The role of mutations found in single heterozygous state is difficult to interpret. Our study suggests that, at least in some patients, these mutations are disease causing, in combination with additional, still unknown factors."
    explanation: The early observation that framed the question; graded INDIRECT because the authors themselves present it as suggestive.
  - reference: PMID:18584234
    reference_title: Subclinical sensory abnormalities in unaffected PINK1 heterozygotes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "Higher mean tactile and visuo-tactile TDTs and TOJs were detected in PINK1 mutation carriers, including not only homozygous patients but also healthy heterozygotes, compared to control subjects (for all comparisons, p < 0.001)."
    explanation: A subclinical sensory endophenotype in unaffected heterozygotes; it shows a measurable effect of one allele without showing disease risk, hence INDIRECT.
animal_models:
- name: Drosophila pink1 loss-of-function mutant
  species: Drosophila melanogaster
  genotype: pink1 null (CG4523 deletion or P-element) alleles
  genes:
  - preferred_term: Pink1
    term:
      id: FB:FBgn0029891
      label: Pink1
  publication: PMID:16672981
  description: >-
    Loss of the fly PINK1 orthologue produces male sterility, apoptotic
    indirect-flight-muscle degeneration, fragmented mitochondrial cristae,
    oxidative-stress sensitivity and dopaminergic neuron degeneration with
    locomotor defects. Overexpression of parkin rescues the pink1 phenotypes but
    not the reverse, and double mutants are no worse than either single mutant,
    the genetic epistasis that placed PINK1 upstream of parkin in one pathway.
  modeled_mechanisms:
  - target: Accumulation of Dysfunctional Mitochondria and Oxidative Stress
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Abnormal mitochondrial morphology and stress sensitivity from loss of PINK1 in vivo.
    limitations: >-
      Invertebrate; the most studied tissues are flight muscle and testis rather
      than dopaminergic neurons, and the human disease alleles are mostly
      missense rather than null.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: Drosophila lacks the mammalian nigrostriatal system; the mitochondrial phenotype is read in muscle and testis as well as in dopaminergic clusters.
    evidence:
    - reference: PMID:16672981
      reference_title: Drosophila pink1 is required for mitochondrial function and interacts genetically with parkin.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Here we show that removal of Drosophila PINK1 homologue (CG4523; hereafter called pink1) function results in male sterility, apoptotic muscle degeneration, defects in mitochondrial morphology and increased sensitivity to multiple stresses including oxidative stress."
      explanation: The mitochondrial and oxidative-stress phenotype of the model.
    - reference: PMID:16672981
      reference_title: Drosophila pink1 is required for mitochondrial function and interacts genetically with parkin.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These observations suggest that pink1 and parkin function, at least in part, in the same pathway, with pink1 functioning upstream of parkin."
      explanation: The epistasis result that ordered the pathway, which the node chain of this entry follows.
  - target: Selective Dopaminergic Neuron Loss in the Substantia Nigra Pars Compacta
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: CELLULAR
    description: Degeneration of dopaminergic neuron clusters with locomotor defects.
    limitations: Fly dopaminergic clusters are not a substantia nigra; the loss is of a different neuronal population in a different circuit.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: The degenerating neurons are Drosophila dopaminergic clusters, not nigral neurons projecting to a striatum.
    evidence:
    - reference: PMID:16672980
      reference_title: Mitochondrial dysfunction in Drosophila PINK1 mutants is complemented by parkin.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Here, we show that PINK1 mutants exhibit indirect flight muscle and dopaminergic neuronal degeneration accompanied by locomotive defects."
      explanation: Dopaminergic neuron degeneration in the fly model.
    - reference: PMID:16672980
      reference_title: Mitochondrial dysfunction in Drosophila PINK1 mutants is complemented by parkin.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Transgenic expression of Parkin markedly ameliorated all PINK1 loss-of-function phenotypes, but not vice versa, suggesting that Parkin functions downstream of PINK1."
      explanation: Directional rescue placing parkin downstream of PINK1.
- name: PINK1-null mouse
  species: Mouse
  genotype: Pink1-/- (germline knockout)
  genes:
  - preferred_term: Pink1
    term:
      id: MGI:1916193
      label: Pink1
  publication: PMID:17563363
  description: >-
    Germline Pink1 knockout mice have normal numbers of nigral dopaminergic
    neurons and normal striatal dopamine and receptor levels, but reduced evoked
    striatal dopamine release, reduced catecholamine quantal size in chromaffin
    cells, and impaired corticostriatal long-term potentiation and depression
    that are rescued by dopamine agonists or levodopa.
  modeled_mechanisms:
  - target: Nigrostriatal Dopamine Deficiency
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: A presynaptic release deficit with intact neurons, reproducing the functional dopamine deficiency without the denervation.
    limitations: Striatal dopamine content is normal; the deficit is in evoked release, not in tissue dopamine, and there is no denervation.
    divergences:
    - divergence_type: PROXY_QUANTITY
      materiality: QUALIFYING
      description: The model quantity is evoked dopamine release in slices; the node's quantity in patients is striatal dopaminergic denervation measured by transporter imaging.
    readouts:
    - name: Evoked striatal dopamine release (amperometry)
      target: Nigrostriatal Dopamine Deficiency
      direction: DECREASED
      interpretation: Functional dopamine release deficit in the absence of neuron loss.
      evidence:
      - reference: PMID:17563363
        reference_title: Impaired dopamine release and synaptic plasticity in the striatum of PINK1-deficient mice.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Amperometric recordings, however, revealed decreases in evoked DA release in striatal slices and reductions in the quantal size and release frequency of catecholamine in dissociated chromaffin cells."
        explanation: The measurement behind this readout.
    evidence:
    - reference: PMID:17563363
      reference_title: Impaired dopamine release and synaptic plasticity in the striatum of PINK1-deficient mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These results reveal a critical role for PINK1 in DA release and striatal synaptic plasticity in the nigrostriatal circuit and suggest that altered dopaminergic physiology may be a pathogenic precursor to nigrostriatal degeneration."
      explanation: Supports treating the model as informative for the dopamine-deficiency node.
  - target: Selective Dopaminergic Neuron Loss in the Substantia Nigra Pars Compacta
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: CELLULAR
    description: Nigral dopaminergic neuron numbers are normal in the knockout.
    limitations: >-
      The defining human neuropathology, nigral neuron loss, does not occur in
      the germline knockout; see the HUMAN_MODEL_MISMATCH discussion for the
      candidate explanations.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: INVALIDATING
      description: The mouse does not convert the PINK1-loss mitochondrial phenotype into nigral neuron death, so it cannot be used to study or to test protection against this node.
    readouts:
    - name: Nigral dopaminergic neuron count
      target: Selective Dopaminergic Neuron Loss in the Substantia Nigra Pars Compacta
      direction: UNCHANGED
      interpretation: A real negative result; neuron numbers are preserved.
      evidence:
      - reference: PMID:17563363
        reference_title: Impaired dopamine release and synaptic plasticity in the striatum of PINK1-deficient mice.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "We found that numbers of dopaminergic neurons and levels of striatal dopamine (DA) and DA receptors are unchanged in PINK1(-/-) mice."
        explanation: The measurement behind this readout.
    evidence:
    - reference: PMID:17563363
      reference_title: Impaired dopamine release and synaptic plasticity in the striatum of PINK1-deficient mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We found that numbers of dopaminergic neurons and levels of striatal dopamine (DA) and DA receptors are unchanged in PINK1(-/-) mice."
      explanation: The negative finding that substantiates the FAILS_TO_RECAPITULATE relationship.

    snippet: "Our study shows an increased likelihood of mutations in patients with lower AAO, family history, or parental consanguinity."
    explanation: The clinical features that raise the prior for a recessive gene in an early-onset patient.
- name: PRKN-related and PARK7-related early-onset Parkinson disease
  description: >-
    The other two autosomal recessive early-onset Parkinson disease genes.
    PRKN-related disease is clinically indistinguishable, sharing early onset,
    dystonia at onset, increased reflexes, excellent levodopa response and slow
    progression; PINK1 acts directly upstream of parkin in the same mitophagy
    pathway, which explains the convergence. At autopsy PRKN-related disease
    usually lacks Lewy bodies whereas PINK1-related disease usually has them.

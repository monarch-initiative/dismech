name: Heavy Chain Disease
creation_date: "2026-08-01T05:30:00Z"
description: >-
  Heavy chain disease (HCD) is a group of three rare acquired B-cell
  lymphoplasmacytic neoplasms unified by a single molecular lesion: the clone
  secretes a structurally abnormal, truncated immunoglobulin heavy chain that
  cannot bind light chain. Somatic deletions, insertions, and point mutations
  acquired during somatic hypermutation of the rearranged IGH locus remove most
  or all of the first constant (CH1) domain. CH1 is the domain that normally
  keeps an unpaired heavy chain out of the circulation: it is intrinsically
  unfolded until it pairs with the light-chain constant (CL) domain, and while
  unfolded it is held in the endoplasmic reticulum by the chaperone BiP/GRP78 and
  routed to degradation. A CH1-deleted heavy chain can bind neither light chain
  nor BiP, escapes ER quality control, and is secreted into serum and urine as a
  light-chain-free paraprotein - the diagnostic hallmark. The three subtypes are
  defined by the isotype of the truncated chain and are clinically distinct:
  alpha-HCD (IgA), the commonest, presents as immunoproliferative small
  intestinal disease (IPSID) / Mediterranean lymphoma, is associated with
  Campylobacter jejuni and other chronic enteric infection, responds to
  antibiotics in early stages, and transforms to aggressive lymphoma if
  untreated; gamma-HCD (IgG, Franklin disease) accompanies a lymphoplasmacytic
  neoplasm and frequently coexists with autoimmune disease, especially rheumatoid
  arthritis and Sjogren syndrome; mu-HCD (IgM), the rarest, arises in a
  CLL/SLL-like or lymphoplasmacytic marrow neoplasm, shows vacuolated marrow
  plasma cells, and - despite the heavy-chain assembly defect - is frequently
  accompanied by Bence Jones proteinuria because unassembled free light chains
  are still produced.
categories:
- Hematologic Malignancy
- B-cell Neoplasm
- Lymphoplasmacytic Neoplasm
- Monoclonal Gammopathy
parents:

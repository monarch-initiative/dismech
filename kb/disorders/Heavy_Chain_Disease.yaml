- name: Secretion of Truncated Light Chain Free Heavy Chain
  role: consequence
  biological_scale: ORGANISM
  description: >-
    The CH1-deleted heavy chain is exported into serum and urine as a monoclonal
    paraprotein that reacts with isotype-specific anti-IgA, anti-IgG, or anti-mu
    antiserum but with neither anti-kappa nor anti-lambda antiserum. This
    light-chain-free monoclonal heavy chain is the pathognomonic and
    diagnosis-defining finding of heavy chain disease. Because the truncated
    chain is small and may fail to form a discrete band, serum protein
    electrophoresis is frequently normal or shows only a broad band, so
    immunofixation with immunoselection - not electrophoresis - is the diagnostic
    test.

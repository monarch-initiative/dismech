environmental:
- name: Chronic Campylobacter jejuni infection
  influences_mechanisms:
  - target: Chronic Enteric Antigenic Stimulation
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      The node names this organism as the most convincingly implicated source
      of the sustained antigenic drive it describes, so colonisation by it is
      the node's own content. Both items are graded partial rather than
      supporting, and the exposure's own description gives the reason better
      than the grade can: the causal weight remains debated, and the organism
      is neither necessary nor sufficient in every case. What the evidence
      establishes is detection and persistence, not causation. The triggering
      effect and the directness are therefore inherited from the node, which
      names this organism as the antigenic drive it describes, rather than
      asserted by any cited sentence.
    evidence:
    - reference: PMID:14724303
      reference_title: "Immunoproliferative small intestinal disease associated with Campylobacter jejuni."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "A follow-up retrospective analysis of archival intestinal-biopsy specimens disclosed campylobacter species in four of six additional patients with immunoproliferative small intestinal disease."
      explanation: >-
        Retrospective analysis finding the organism in four of six further
        archival cases beyond the index patient. Detection in a small series,
        which is the evidential ceiling for this exposure.
    - reference: PMID:14724303
      reference_title: "Immunoproliferative small intestinal disease associated with Campylobacter jejuni."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "These results indicate that campylobacter and immunoproliferative small intestinal disease are associated and that C. jejuni should be added to the growing list of human pathogens responsible for immunoproliferative states"
      explanation: >-
        The study's own conclusion, which is the strongest wording it offers:
        the organism and the disease are associated, and it should be added to
        the list of pathogens responsible for immunoproliferative states.
        Associated is the operative word, and it is why this is partial.
    - reference: PMID:29372346
      reference_title: "Heavy Chain Disease of the Small Bowel."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "A link between Campylobacter jejuni infection and IPSID has been established, but there is controversy as to the role played by this organism in disease pathogenesis"
      explanation: >-
        Carried on this link so that the dispute travels with the claim rather
        than sitting apart from it: the link is established, and the
        organism's role in pathogenesis is contested. That is the honest state
        of this exposure and the reason no item here is graded supporting.
    - reference: PMID:39176219
      reference_title: "Gastrointestinal Alpha Heavy Chain Disease With Persistent Campylobacter Jejuni Colonization and Refractory Giardiasis."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "We report a rare case of GI αHCD with 5 concomitant pathogens identified on a GI multiplex real-time polymerase chain reaction panel, featured by persistent Campylobacter jejuni colonization and refractory giardiasis."
      explanation: >-
        A contemporary case documenting persistent colonisation alongside
        other enteric pathogens. One patient, and the co-pathogens make
        attribution to this organism harder rather than easier.
  presence: Positive
  description: >-
    Persistent small-bowel colonisation by Campylobacter jejuni is the
    best-supported environmental factor in alpha-HCD/IPSID. It was identified by
    PCR, sequencing, FISH, and immunohistochemistry in an index patient with a
    dramatic response to antibiotics and in four of six further archival cases,
    and persistent colonisation has since been documented in contemporary cases.
    Its causal weight remains debated and it is neither necessary nor sufficient
    in every case.
  evidence:
  - reference: PMID:14724303
    reference_title: Immunoproliferative small intestinal disease associated with Campylobacter jejuni.
    supports: SUPPORT

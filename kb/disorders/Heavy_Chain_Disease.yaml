- name: Lymphoplasmacytic Tissue Infiltration
  role: effector
  biological_scale: TISSUE
  description: >-
    The neoplastic clone infiltrates tissue in a subtype-specific distribution.
    In alpha-HCD a dense plasma-cell-rich lymphoplasmacytic infiltrate fills the
    lamina propria of the duodenum and jejunum, admixed with marginal-zone-like
    small lymphocytes and sometimes lymphoepithelial lesions; the infiltrate
    causes villous atrophy and hence malabsorption. In gamma-HCD the infiltrate
    involves bone marrow, spleen, lymph nodes, and extranodal sites including
    skin and the Waldeyer's ring lymphoid tissue. In mu-HCD marrow infiltration
    by a CLL/SLL-like population with vacuolated plasma cells produces
    cytopenias, with splenomegaly and hepatomegaly.

  - target: Chronic Diarrhea
    description: Mucosal infiltration and malabsorption produce chronic diarrhoea.
  - target: Abdominal Pain
    description: Bowel wall infiltration causes abdominal discomfort and pain.
  - target: Weight Loss
    description: Malabsorption and mucosal disease drive progressive weight loss.
  - target: Growth Delay
    description: >-
      Chronic malabsorption in adolescents and young adults retards growth.
  - target: Lymphadenopathy
    description: >-
      Nodal infiltration produces mesenteric and generalised lymphadenopathy.
  - target: Splenomegaly
    description: Splenic infiltration produces splenomegaly.
  - target: Hepatomegaly
    description: Hepatic and portal infiltration produces hepatomegaly.
  - target: Anemia

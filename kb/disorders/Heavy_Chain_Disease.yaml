    carries clone-specific somatic deletions removing the variable region and
    part of the CH1 domain, with additional insertions of unknown origin. These
    are acquired, clone-restricted structural lesions of a rearranged
    immunoglobulin gene - not constitutional variants - so germline allele
    frequency and ACMG variant classification do not apply.

classifications:
  icdo_morphology:
    classification_value: Lymphoma
    notes: >-
      MONDO:0019464 carries the ICD-O morphology xref ICDO:9762/3 (heavy chain
      disease), which has no dedicated value in this repository's closed
      ICDOMorphologyEnum. `Lymphoma` (ICDO:9590/3) is the closest correct parent
      and is supported by the primary literature, which classifies the HCDs as
      variant types of non-Hodgkin lymphoma. `Multiple Myeloma` (ICDO:9732/3)
      was deliberately NOT used: it would mis-assert a plasma-cell-myeloma
      morphology that HCD does not have.
    evidence:
    - reference: PMID:16026747
      reference_title: Heavy chain diseases.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        HCDs can be thought of as variant types of non-Hodgkin lymphoma:
        alpha-HCD presents as an extranodal marginal-zone lymphoma of
        mucosa-associated lymph-node tissue, gamma-HCD as lymphoplasmacytoid
        non-Hodgkin lymphoma, and mu-HCD as small lymphocytic non-Hodgkin
        lymphoma or chronic lymphocytic leukemia.
      explanation: >-
        Supports assigning HCD to the lymphoma morphology axis rather than to a
        plasma-cell-myeloma morphology.

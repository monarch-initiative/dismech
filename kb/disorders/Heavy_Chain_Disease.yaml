pathophysiology:
- name: Chronic Enteric Antigenic Stimulation
  conforms_to: "tumor_promoting_inflammation#Chronic Inflammatory Stimulus"
  role: trigger
  biological_scale: ORGANISM
  subtypes:
  - Alpha-HCD
  description: >-
    In alpha-HCD/IPSID, persistent bacterial (most convincingly Campylobacter
    jejuni, sometimes Helicobacter pylori) or parasitic colonisation of the
    proximal small bowel provides sustained antigenic drive to mucosa-associated
    lymphoid tissue. The epidemiological concentration of the disease in
    low-socioeconomic Mediterranean, North African, and Middle Eastern
    populations, and the responsiveness of early disease to antimicrobials, both
    support an antigen-driven initiating step. This is the same
    chronic-infection-driven lymphomagenesis logic as Helicobacter pylori and
    gastric MALT lymphoma. Neither organism has been shown to be necessary or
    sufficient in every case.
  locations:
  - preferred_term: lamina propria of small intestine
    term:
      id: UBERON:0001238
      label: lamina propria of small intestine
  biological_processes:
  - preferred_term: Inflammatory Response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  - preferred_term: immunoglobulin production in mucosal tissue
    modifier: INCREASED
    term:
      id: GO:0002426
      label: immunoglobulin production in mucosal tissue
  downstream:
  - target: Clonal Lymphoplasmacytic B-Cell Expansion
    description: >-
      Sustained mucosal antigen exposure selects and expands an IgA-committed
      mucosal B-cell/plasma-cell clone.
  evidence:
  - reference: PMID:14724303
    reference_title: Immunoproliferative small intestinal disease associated with Campylobacter jejuni.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Analysis of frozen intestinal tissue obtained from an index patient with
      immunoproliferative small intestinal disease who had a dramatic response
      to antibiotics revealed the presence of Campylobacter jejuni.
    explanation: >-
      The landmark observation linking C. jejuni to antibiotic-responsive IPSID,
      establishing chronic enteric infection as the antigenic trigger.
  - reference: PMID:14724303
    reference_title: Immunoproliferative small intestinal disease associated with Campylobacter jejuni.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These results indicate that campylobacter and immunoproliferative small
      intestinal disease are associated and that C. jejuni should be added to
      the growing list of human pathogens responsible for immunoproliferative
      states.
    explanation: >-
      States the association explicitly and places IPSID among the
      infection-driven immunoproliferative disorders.
  - reference: PMID:29372346
    reference_title: Heavy Chain Disease of the Small Bowel.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A link between Campylobacter jejuni infection and IPSID has been
      established, but there is controversy as to the role played by this
      organism in disease pathogenesis.
    explanation: >-
      Confirms the association while explicitly qualifying its causal weight,
      which is why this node is modelled as a trigger rather than a necessary
      cause.
- name: Chronic Autoimmune B-Cell Stimulation
  conforms_to: "tumor_promoting_inflammation#Chronic Inflammatory Stimulus"
  role: trigger
  biological_scale: ORGANISM
  subtypes:
  - Gamma-HCD
  mechanism_confidence: PROVISIONAL
  description: >-
    In gamma-HCD, a coexisting autoimmune disease - rheumatoid arthritis most
    often, then Sjogren syndrome, systemic lupus erythematosus, vasculitis,
    myasthenia gravis, and autoimmune cytopenias - is present in about a quarter
    of patients and its manifestations typically precede the HCD diagnosis by
    years. Chronic autoimmune B-cell stimulation is therefore the plausible
    gamma-HCD counterpart of the enteric-infection drive in alpha-HCD, but the
    temporal ordering is not proof of causation and the direction of the
    relationship remains formally unresolved.
  biological_processes:
  - preferred_term: Inflammatory Response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  - preferred_term: positive regulation of B cell proliferation
    modifier: INCREASED
    term:
      id: GO:0030890
      label: positive regulation of B cell proliferation
  downstream:
  - target: Clonal Lymphoplasmacytic B-Cell Expansion
    description: >-
      Chronic autoimmune B-cell stimulation is proposed to favour emergence of
      the lymphoplasmacytic clone; directionality is not established.
  - target: Rheumatoid Arthritis
    description: >-
      Rheumatoid arthritis is the commonest clinical expression of the
      autoimmune context in gamma-HCD.
  evidence:
  - reference: PMID:29326807
    reference_title: "Heavy-Chain Diseases and Myeloma-Associated Fanconi Syndrome: an Update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The manifestations of the associated autoimmune disease often herald the
      diagnosis of γ -HCD by many years.
    explanation: >-
      Documents that autoimmune manifestations typically precede the gamma-HCD
      diagnosis, motivating the trigger role assigned to this node.
  - reference: PMID:22301495
    reference_title: "Gamma heavy-chain disease: defining the spectrum of associated lymphoproliferative disorders through analysis of 13 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinically, patients showed a female predominance (85%) with frequent
      occurrence of autoimmune disease (69%).
    explanation: >-
      Quantifies the autoimmune association in a dedicated gamma-HCD pathology
      series.
- name: Clonal Lymphoplasmacytic B-Cell Expansion
  role: driver
  biological_scale: CELLULAR
  description: >-
    A mature B-cell/plasmacytic clone expands in the small-intestinal lamina
    propria (alpha-HCD), in marrow, spleen, lymph nodes, and extranodal sites
    (gamma-HCD), or in the bone marrow as a CLL/SLL-like or lymphoplasmacytic
    neoplasm (mu-HCD). The expanding clone is the substrate within which the
    heavy-chain gene lesion is acquired and selected.
  cell_types:
  - preferred_term: plasma cell
    term:
      id: CL:0000786
      label: plasma cell
  - preferred_term: neoplastic B cell
    term:
      id: CL:0000236
      label: B cell
  genes:
  - preferred_term: MYD88
    term:
      id: hgnc:7562
      label: MYD88
  biological_processes:
  - preferred_term: positive regulation of B cell proliferation
    modifier: INCREASED
    term:
      id: GO:0030890
      label: positive regulation of B cell proliferation
  - preferred_term: immunoglobulin production
    modifier: INCREASED
    term:
      id: GO:0002377
      label: immunoglobulin production
  downstream:
  - target: Somatic Immunoglobulin Heavy Chain Gene Deletion
    description: >-
      Somatic hypermutation acting on the expanding clone generates the
      CH1-disrupting IGH lesion.
  - target: Lymphoplasmacytic Tissue Infiltration
    description: >-
      The expanding clone infiltrates gut lamina propria, marrow, spleen, and
      lymph nodes.
  evidence:
  - reference: PMID:29326807
    reference_title: "Heavy-Chain Diseases and Myeloma-Associated Fanconi Syndrome: an Update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The heavy chain diseases (HCDs) are rare B-cell malignancies
      characterized by the production of a monoclonal immunoglobulin heavy chain
      without an associated light chain.
    explanation: >-
      Establishes that HCD is a clonal B-cell neoplasm secreting the abnormal
      heavy chain, i.e. that a neoplastic clone is the cell of origin.
  - reference: PMID:15542584
    reference_title: "Immunoproliferative small intestinal disease (IPSID): a model for mature B-cell neoplasms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cytogenetic studies demonstrated clonal rearrangements involving
      predominantly the heavy and light chain genes, including t(9;14)
      translocation involving the PAX5 gene.
    explanation: >-
      Demonstrates clonality of the proliferating population in alpha-HCD/IPSID.
- name: Somatic Immunoglobulin Heavy Chain Gene Deletion
  role: central_effector
  biological_scale: MOLECULAR
  description: >-
    Deletions, insertions, and point mutations acquired somatically during
    somatic hypermutation of the rearranged IGH locus (14q32.33) remove a large
    portion of the sequence encoding the first constant (CH1) domain, and in
    alpha-HCD frequently the variable (VH) region as well. These are
    clone-specific somatic structural lesions of the rearranged immunoglobulin
    genes, not constitutional pathogenic variants; no germline predisposing
    variant is established for HCD. Terminology caveat: GO:0016446 is defined
    for hypermutation of the rearranged V regions, whereas the HCD lesion falls
    in the CH1 constant domain. The term is used here for the somatic
    hypermutation machinery that the source identifies as the origin of the
    lesion, not to assert that the mutations lie in V.
  genes:
  - preferred_term: IGHA1
    term:
      id: hgnc:5478
      label: IGHA1
  - preferred_term: IGHG1
    term:
      id: hgnc:5525
      label: IGHG1
  - preferred_term: IGHM
    term:
      id: hgnc:5541
      label: IGHM
  biological_processes:
  - preferred_term: somatic hypermutation of immunoglobulin genes
    modifier: ABNORMAL
    term:
      id: GO:0016446
      label: somatic hypermutation of immunoglobulin genes
  downstream:
  - target: Loss of the CH1 Domain and Failure of Light Chain Pairing
    description: >-
      Deletion of CH1-encoding sequence yields a heavy chain protein lacking the
      light-chain-binding domain.
  evidence:
  - reference: PMID:29326807
    reference_title: "Heavy-Chain Diseases and Myeloma-Associated Fanconi Syndrome: an Update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The altered heavy chains contain deletions, insertions, and point
      mutations that are acquired during somatic hypermutation.
    explanation: >-
      Identifies somatic hypermutation of the rearranged IGH locus as the origin
      of the structural lesion.
  - reference: PMID:15542584
    reference_title: "Immunoproliferative small intestinal disease (IPSID): a model for mature B-cell neoplasms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The encoding gene sequence reveals a deletion of V region and parts of
      C(H)1 domain.
    explanation: >-
      Direct sequence-level demonstration that the CH1-encoding region is
      deleted in the alpha-HCD clone.
- name: Loss of the CH1 Domain and Failure of Light Chain Pairing
  role: central_effector
  biological_scale: MOLECULAR
  description: >-
    CH1 is the heavy-chain constant domain that pairs with the light-chain
    constant (CL) domain, and the two are covalently joined by an interchain
    disulfide bond. CH1 is unusual among immunoglobulin domains in being
    intrinsically unfolded in isolation: it acquires structure only on
    association with a folded CL domain, in a reaction rate-limited by
    isomerisation of a conserved proline. A heavy chain that has lost CH1 has
    therefore lost the only interface through which it can engage light chain,
    and the resulting molecule is a light-chain-free heavy chain - the defining
    lesion shared by all three HCD subtypes.
  cellular_components:
  - preferred_term: endoplasmic reticulum lumen
    term:
      id: GO:0005788
      label: endoplasmic reticulum lumen
  downstream:
  - target: Escape from BiP-Dependent ER Quality Control
    description: >-
      Without CH1 there is no stably unfolded domain for BiP to hold, so the
      chain is no longer retained.
  - target: Antigen-Independent B-Cell Receptor Aggregation
    description: >-
      The same CH1-deleted chain, in its membrane-anchored form, is the
      substrate proposed to aggregate within the B-cell receptor without
      antigen.
    hypothesis_groups:
    - antigen_independent_bcr_signaling
  evidence:
  - reference: PMID:29326807
    reference_title: "Heavy-Chain Diseases and Myeloma-Associated Fanconi Syndrome: an Update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These structural abnormalities typically result in loss of a large
      portion of the constant -1 (CH1) domain of the Ig heavy chain molecule
      responsible for LC binding
    explanation: >-
      States that CH1 loss is the typical structural abnormality and that CH1 is
      the domain responsible for light-chain binding.
  - reference: PMID:33596645
    reference_title: "Light chain proteinuria revealing mu-heavy chain disease: an atypical presentation of Waldenström macroglobulinemia in two cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Normal immunoglobulin is composed of two heavy chains and two light chains
      joined by disulfide bonds at the heavy chain constant domain 1 (CH1).
    explanation: >-
      Establishes CH1 as the heavy-chain/light-chain pairing interface whose
      loss abolishes assembly.
  - reference: PMID:19524537
    reference_title: An unfolded CH1 domain controls the assembly and secretion of IgG antibodies.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In vivo experiments demonstrate that requirements identified for folding
      the C(H)1 domain in vitro, including association with a folded C(L)
      domain and isomerization of a conserved proline residue, are essential for
      antibody assembly and secretion in the cell.
    explanation: >-
      Biophysical and cell-biological demonstration that CH1 folds only on
      association with CL, explaining why CH1 loss abolishes pairing.
- name: Escape from BiP-Dependent ER Quality Control
  role: mediator
  biological_scale: CELLULAR
  description: >-
    Normally, an unpaired heavy chain is trapped in the endoplasmic reticulum:
    the unfolded CH1 domain permanently exposes chaperone-binding sites, the
    Hsp70 chaperone BiP/GRP78 binds it stably (its ATPase cycle stalled until
    light chain arrives), and the retained chain is routed to proteasomal
    degradation, which is why free heavy chains are never found in normal serum
    or urine. A CH1-deleted chain presents no such binding surface. It binds
    neither light chain nor BiP, bypasses ER retention and degradation, and
    enters the secretory pathway. This is the mechanistic core of every heavy
    chain disease.
  cellular_components:
  - preferred_term: endoplasmic reticulum lumen
    term:
      id: GO:0005788
      label: endoplasmic reticulum lumen
  molecular_functions:
  - preferred_term: BiP chaperone binding by the unpaired heavy chain
    modifier: DECREASED
    term:
      id: GO:0051087
      label: protein-folding chaperone binding
  biological_processes:
  - preferred_term: protein folding in endoplasmic reticulum
    modifier: ABNORMAL
    term:
      id: GO:0034975
      label: protein folding in endoplasmic reticulum
  - preferred_term: ERAD pathway
    modifier: DECREASED
    term:
      id: GO:0036503
      label: ERAD pathway
  downstream:
  - target: Secretion of Truncated Light Chain Free Heavy Chain
    description: >-
      Having escaped retention and degradation, the truncated chain transits the
      secretory pathway and reaches serum and urine.
  evidence:
  - reference: PMID:33596645
    reference_title: "Light chain proteinuria revealing mu-heavy chain disease: an atypical presentation of Waldenström macroglobulinemia in two cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the absence of light chains, the heat shock protein BiP binds to CH1
      and retains the heavy chain in the endoplasmic reticulum.
    explanation: >-
      States the normal BiP/CH1 retention mechanism that the HCD lesion
      subverts.
  - reference: PMID:33596645
    reference_title: "Light chain proteinuria revealing mu-heavy chain disease: an atypical presentation of Waldenström macroglobulinemia in two cases."
    supports: SUPPORT

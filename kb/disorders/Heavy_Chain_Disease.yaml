- name: Unassembled Free Light Chain Excess
  role: consequence
  biological_scale: MOLECULAR
  subtypes:
  - Mu-HCD
  description: >-
    A mu-HCD-specific and superficially paradoxical consequence of the same
    lesion. The clone continues to synthesise monoclonal light chains, usually
    kappa, but the CH1-deleted mu chain cannot assemble with them. The
    unassembled light chains are secreted freely, filtered at the glomerulus, and
    appear in the urine as Bence Jones protein - so a disease defined by a
    heavy-chain defect commonly presents with light-chain proteinuria, sometimes
    with cast nephropathy or amyloidosis. This does not occur in alpha-HCD, where
    Bence Jones proteinuria has never been reported.
  downstream:
  - target: Bence Jones Proteinuria
    description: >-
      Free unassembled monoclonal light chains are filtered and excreted as
      Bence Jones protein.
  evidence:
  - reference: PMID:29326807
    reference_title: "Heavy-Chain Diseases and Myeloma-Associated Fanconi Syndrome: an Update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the neoplastic cells also produce monoclonal LCs, usually of kappa type,
      that fail to assemble with the truncated heavy chain
    explanation: >-
      States the mechanism: light chains are still made but cannot assemble with
      the truncated heavy chain, so they are excreted free.
  - reference: PMID:29326807
    reference_title: "Heavy-Chain Diseases and Myeloma-Associated Fanconi Syndrome: an Update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      as well as in urine in only small amounts, but Bence Jones proteinuria has
      never been detected.
    explanation: >-
      Establishes the contrast with alpha-HCD, in which free light chains are
      not excreted.
- name: Transformation to Aggressive Lymphoma
  role: outcome
  biological_scale: ORGANISM
  description: >-
    IPSID is generally regarded as a pre-lymphomatous condition. Untreated or
    antibiotic-refractory alpha-HCD progresses from an antigen-dependent mucosal
    lesion to lymphoplasmacytic and immunoblastic lymphoma invading the bowel
    wall and mesenteric nodes, with distant spread; the same transformation
    accounts for constitutional symptoms and for death from obstruction,
    perforation, cachexia, and infection. Gamma-HCD shows an analogous spectrum,
    with disseminated lymphoma and constitutional symptoms in roughly two-thirds
    of patients. Recent reports of longstanding non-progressive IPSID show the
    transformation is not obligate.
  downstream:
  - target: Fever
    description: >-
      Disseminated lymphoma produces constitutional symptoms including fever.
  - target: Intestinal Obstruction
    description: >-
      Enlargement of the lymphomatous mass obstructs the small bowel, and may
      also perforate or intussuscept.
  evidence:
  - reference: PMID:15542584
    reference_title: "Immunoproliferative small intestinal disease (IPSID): a model for mature B-cell neoplasms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most untreated IPSID patients progress to lymphoplasmacytic and
      immunoblastic lymphoma invading the intestinal wall and mesenteric lymph
      nodes, and may metastasize to a distant organ.
    explanation: Documents the transformation step and its anatomic pattern.
  - reference: PMID:29372346
    reference_title: Heavy Chain Disease of the Small Bowel.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      IPSID is typically regarded as a pre-lymphomatous condition with eventual
      progression to frank lymphoma; however, recent reports of longstanding
      non-progressive cases have expanded its clinical spectrum.
    explanation: >-
      Supports the pre-lymphomatous framing while establishing that
      transformation is not obligate.

    explanation: >-
      Establishes the defective mu heavy chain as the gene product defining the
      subtype.
- name: MYD88
  notes: >-
    MYD88 L265P, the hallmark mutation of lymphoplasmacytic lymphoma /
    Waldenstrom macroglobulinaemia, has been reported in mu-HCD together with 6q
    deletion. This is a co-occurring somatic driver of the underlying clone
    rather than the cause of the heavy-chain defect. It has been argued to place
    at least some mu-HCD closer to lymphoplasmacytic lymphoma than to CLL,
    though the evidence is two case reports rather than a series.
  relationship_type: COOPERATING
  variant_origin: SOMATIC

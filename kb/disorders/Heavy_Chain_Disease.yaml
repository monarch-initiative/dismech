- name: Polymorphous Lymphoplasmacytic Neoplasm
  subtype: Gamma-HCD
  description: >-
    Gamma-HCD is most often associated with a polymorphous neoplasm of small
    lymphocytes, plasmacytoid lymphocytes, and plasma cells that is hard to
    classify with certainty and overlaps with "vaguely nodular, polymorphous"
    lymphoplasmacytic lymphoma; a minority of cases show the features of another
    defined WHO entity. Immunoblasts, eosinophils, histiocytes, and occasional
    Reed-Sternberg-like cells may be present, which is why Hodgkin lymphoma and
    peripheral T-cell lymphoma enter the differential.
  evidence:
  - reference: PMID:22301495
    reference_title: "Gamma heavy-chain disease: defining the spectrum of associated lymphoproliferative disorders through analysis of 13 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Histologically, 8 cases (61%) contained a morphologically similar neoplasm
      of small lymphocytes, plasmacytoid lymphocytes, and plasma cells that was
      difficult to classify with certainty, whereas the remaining 5 cases (39%)
      showed the typical features of one of several other well-defined entities
      in the 2008 WHO classification.
    explanation: >-
      Defines the morphological spectrum of the gamma-HCD-associated neoplasm.
biochemical:
- name: Light Chain Free Monoclonal Heavy Chain on Immunofixation
  notes: >-
    The diagnosis-defining laboratory finding across all three subtypes: an
    isotype-specific monoclonal heavy chain (anti-IgA, anti-IgG, or anti-mu
    reactive) with no corresponding kappa or lambda reactivity, demonstrated in
    serum or urine. Immunoselection - electrophoresis through agar containing
    anti-kappa and anti-lambda antibodies to trap free light chains and intact
    immunoglobulin - is required, because serum protein electrophoresis alone can
    be entirely normal and therefore cannot exclude HCD. Two-dimensional
    immunoelectrophoresis is a useful tool for all three types.
  specificity: Pathognomonic for heavy chain disease
  assays:
  - preferred_term: serum and urine immunofixation with immunoselection
  evidence:
  - reference: PMID:16026747
    reference_title: Heavy chain diseases.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Diagnosis of HCD requires documentation of a deleted immunoglobulin heavy
      chain without a bound light chain in the serum or urine.
    explanation: >-
      States the diagnostic requirement that defines this biochemical marker.
  - reference: PMID:33596645
    reference_title: "Light chain proteinuria revealing mu-heavy chain disease: an atypical presentation of Waldenström macroglobulinemia in two cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In order to detect heavy chains devoid of light chains on
      immuno-electrophoresis, immuno-selection techniques and the use of
      specific anti-light chains anti-serum are required.
    explanation: >-
      Explains why immunoselection rather than routine electrophoresis is
      required to make the diagnosis.
- name: Elevated Serum Free Light Chains
  subtype: Mu-HCD
  notes: >-
    In mu-HCD the unassembled monoclonal light chains accumulate as markedly
    elevated serum free light chains with a skewed kappa/lambda ratio, often in
    striking dissociation from an absent or trivial serum protein electrophoresis
    peak. That dissociation - high free light chains with no or a tiny M-spike -
    is the clue that should prompt immunoselection for a free heavy chain.
  evidence:
  - reference: PMID:33596645
    reference_title: "Light chain proteinuria revealing mu-heavy chain disease: an atypical presentation of Waldenström macroglobulinemia in two cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The dissociation between the sFLC level and the absence of a peak on SPEP
      was unusual.
    explanation: >-
      Describes the free-light-chain/electrophoresis dissociation that
      characterises mu-HCD.
- name: Malabsorptive Biochemical Deficit
  subtype: Alpha-HCD
  notes: >-
    Common laboratory abnormalities in alpha-HCD reflect the malabsorption
    syndrome rather than the paraprotein: hypochromic anaemia, vitamin and
    mineral deficiency, raised intestinal alkaline phosphatase, hypoalbuminaemia,
    hypocalcaemia, hypokalaemia, and hypomagnesaemia. Serum protein
    electrophoresis may show hypogammaglobulinaemia rather than a monoclonal
    spike.
  evidence:
  - reference: PMID:29326807
    reference_title: "Heavy-Chain Diseases and Myeloma-Associated Fanconi Syndrome: an Update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      electrolytic disorders (i.e., hypoalbuminemia, hypocalcemia, hypokalemia,
      and hypomagnesemia).
    explanation: >-
      Lists the biochemical deficits produced by malabsorption in alpha-HCD.

      disclosed campylobacter species in four of six additional patients with
      immunoproliferative small intestinal disease.
    explanation: >-
      Quantifies detection of campylobacter in an IPSID case series beyond the
      index patient.
  - reference: PMID:39176219
    reference_title: "Gastrointestinal Alpha Heavy Chain Disease With Persistent Campylobacter Jejuni Colonization and Refractory Giardiasis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report a rare case of GI αHCD with 5 concomitant pathogens identified
      on a GI multiplex real-time polymerase chain reaction panel, featured by
      persistent Campylobacter jejuni colonization and refractory giardiasis.
    explanation: >-
      A contemporary case documenting persistent C. jejuni colonisation in
      alpha-HCD alongside other enteric pathogens.
- name: Low socioeconomic conditions and poor sanitation
  exposure_term:
    preferred_term: exposure to adverse socioeconomic factors
    term:
      id: ECTO:6000028
      label: exposure to socioeconomic factors
  influences_mechanisms:
  - target: Chronic Enteric Antigenic Stimulation
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Graded below the organism link into this same node, which is the right
      order but worth stating plainly: this exposure is an epidemiological
      pattern rather than an agent. Its value is that the pattern itself
      argues for an environmental and probably infectious mechanism, which is
      what makes it a claim about this node at all rather than only about who
      gets the disease. The entry is candid that improved sanitation has never
      been shown prospectively to prevent it.
    evidence:
    - reference: PMID:29326807
      reference_title: "Heavy-Chain Diseases and Myeloma-Associated Fanconi Syndrome: an Update."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "particularly those of low socio-economic background, suggesting an environmental, possibly infectious, pathogenetic mechanism."
      explanation: >-
        States the socioeconomic concentration of the disease and reads it as
        suggesting an environmental, possibly infectious, mechanism. The
        inference to this node is the source's own, and it is offered as a
        suggestion.
  presence: Positive
  description: >-
    Alpha-HCD is strikingly concentrated in Mediterranean, North African, and
    Middle Eastern populations of low socioeconomic background, an
    epidemiological pattern that itself argues for an environmental, probably
    infectious, pathogenetic mechanism. Improved sanitation is biologically
    plausible as primary prevention but has never been shown prospectively to
    prevent HCD.
  evidence:
  - reference: PMID:29326807
    reference_title: "Heavy-Chain Diseases and Myeloma-Associated Fanconi Syndrome: an Update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      particularly those of low socio-economic background, suggesting an
      environmental, possibly infectious, pathogenetic mechanism.
    explanation: >-
      States the socioeconomic association and its interpretation as evidence
      for an environmental/infectious mechanism.
infectious_agent:
- name: Campylobacter jejuni
  description: >-
    The bacterial species most convincingly associated with alpha-HCD/IPSID.
    Helicobacter pylori and intestinal parasites (including Giardia) have also
    been reported. No organism has been shown to be necessary or sufficient.
  infectious_agent_term:
    preferred_term: Campylobacter jejuni
    term:
      id: NCBITaxon:197
      label: Campylobacter jejuni
  evidence:
  - reference: PMID:14724303
    reference_title: Immunoproliferative small intestinal disease associated with Campylobacter jejuni.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These results indicate that campylobacter and immunoproliferative small
      intestinal disease are associated and that C. jejuni should be added to
      the growing list of human pathogens responsible for immunoproliferative
      states.
    explanation: >-
      Establishes C. jejuni as the infectious agent associated with
      alpha-HCD/IPSID.
- name: Helicobacter pylori
  description: >-
    A second bacterium reported in association with alpha-HCD/IPSID, by analogy
    with its established role in gastric MALT lymphoma. The evidence is weaker
    than for C. jejuni and amounts to co-detection rather than a demonstrated
    causal role.
  infectious_agent_term:
    preferred_term: Helicobacter pylori
    term:
      id: NCBITaxon:210
      label: Helicobacter pylori
  evidence:
  - reference: PMID:29326807
    reference_title: "Heavy-Chain Diseases and Myeloma-Associated Fanconi Syndrome: an Update."

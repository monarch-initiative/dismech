has_subtypes:
- name: Alpha-HCD
  display_name: Alpha Heavy Chain Disease (IPSID / Mediterranean Lymphoma)
  subtype_term:
    preferred_term: alpha-heavy chain disease
    term:
      id: MONDO:0015045
      label: alpha-heavy chain disease
  description: >-
    The commonest heavy chain disease, secreting a truncated IgA (alpha) heavy
    chain. It presents as immunoproliferative small intestinal disease (IPSID),
    an extranodal marginal zone (MALT-type) lymphoma of the proximal small bowel
    causing chronic diarrhoea, malabsorption, and weight loss in young adults of
    Mediterranean, North African, and Middle Eastern origin. Chronic enteric
    infection - Campylobacter jejuni most convincingly - drives the
    antigen-dependent early phase, which is antibiotic responsive; untreated
    disease progresses to lymphoplasmacytic and immunoblastic lymphoma invading
    the bowel wall and mesenteric nodes.
  geography:
  - Mediterranean basin
  - North Africa
  - Middle East
  evidence:
  - reference: PMID:29326807
    reference_title: "Heavy-Chain Diseases and Myeloma-Associated Fanconi Syndrome: an Update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Alpha-HCD is the most common and usually occurs as intestinal
      malabsorption in a young adult from a country of the Mediterranean area.
    explanation: >-
      Defines alpha-HCD as the commonest subtype with its characteristic
      malabsorptive presentation and geographic distribution.
  - reference: PMID:15542584
    reference_title: "Immunoproliferative small intestinal disease (IPSID): a model for mature B-cell neoplasms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most untreated IPSID patients progress to lymphoplasmacytic and
      immunoblastic lymphoma invading the intestinal wall and mesenteric lymph
      nodes, and may metastasize to a distant organ.
    explanation: >-
      Establishes the progression from antibiotic-responsive early disease to
      aggressive lymphoma that defines the alpha-HCD natural history.
- name: Gamma-HCD
  display_name: Gamma Heavy Chain Disease (Franklin Disease)
  subtype_term:
    preferred_term: gamma-heavy chain disease
    term:
      id: MONDO:0015046
      label: gamma-heavy chain disease
  description: >-
    Franklin disease, secreting a truncated IgG (gamma) heavy chain. It is
    diagnosed at a median age in the seventh decade with a female predominance
    and is nearly always accompanied by an underlying lymphoplasmacytic neoplasm.
    Roughly a quarter of patients have a coexisting autoimmune disease - most
    often rheumatoid arthritis, less often Sjogren syndrome, systemic lupus
    erythematosus, vasculitis, myasthenia gravis, or autoimmune cytopenias -
    whose manifestations frequently precede the HCD diagnosis by years. Clinical
    patterns range from disseminated lymphoma with constitutional symptoms,
    generalised lymphadenopathy, splenomegaly, and hepatomegaly, to localised
    medullary or extramedullary (commonly cutaneous) disease. Palatal oedema from
    involvement of the Waldeyer's ring lymphoid tissue is a classically reported
    sign.
  evidence:
  - reference: PMID:29326807
    reference_title: "Heavy-Chain Diseases and Myeloma-Associated Fanconi Syndrome: an Update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It is uncommon, with approximately 130 cases reported in the literature,
      being the age at diagnosis between 51 and 68 years, with a female
      predominance.
    explanation: >-
      Establishes the rarity, age range, and female predominance that
      characterise gamma-HCD.
  - reference: PMID:22301495
    reference_title: "Gamma heavy-chain disease: defining the spectrum of associated lymphoproliferative disorders through analysis of 13 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Gamma heavy-chain disease (gHCD) is defined as a lymphoplasmacytic
      neoplasm that produces an abnormally truncated immunoglobulin gamma
      heavy-chain protein that lacks associated light chains.
    explanation: >-
      Pathology-series definition of gamma-HCD as a lymphoplasmacytic neoplasm
      secreting a truncated, light-chain-free gamma chain.
- name: Mu-HCD
  display_name: Mu Heavy Chain Disease
  subtype_term:
    preferred_term: mu-heavy chain disease
    term:
      id: MONDO:0015044
      label: mu-heavy chain disease
  description: >-
    The rarest heavy chain disease, with only 30-40 reported cases, secreting a
    truncated IgM (mu) heavy chain. It occurs predominantly in older men and
    almost always arises in a marrow lymphoid neoplasm resembling chronic
    lymphocytic leukaemia / small lymphocytic lymphoma; MYD88 L265P has been
    reported in individual cases, which has been argued to place at least some
    of them closer to lymphoplasmacytic lymphoma / Waldenstrom
    macroglobulinaemia than to CLL.
    Vacuolated bone marrow plasma cells admixed with small round lymphocytes are
    the characteristic morphology. Unlike the other subtypes, Bence Jones
    proteinuria is frequent, because the clone continues to make monoclonal
    (usually kappa) light chains that cannot assemble with the CH1-deleted heavy
    chain.
  evidence:
  - reference: PMID:29326807
    reference_title: "Heavy-Chain Diseases and Myeloma-Associated Fanconi Syndrome: an Update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The disease occurs predominantly in Caucasian males, with a median age of
      58 years at diagnosis.
    explanation: Establishes the demographic profile of mu-HCD.
  - reference: PMID:35932039
    reference_title: "Mu heavy chain disease with MYD88 L265P mutation: an unusual manifestation of lymphoplasmacytic lymphoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mu heavy chain disease is a rare lymphoid neoplasm characterized by
      vacuolated bone marrow plasma cells and secretion of defective mu
      immunoglobulin heavy chains.
    explanation: >-
      Defines mu-HCD by its two hallmarks: vacuolated marrow plasma cells and
      secretion of a defective mu heavy chain.

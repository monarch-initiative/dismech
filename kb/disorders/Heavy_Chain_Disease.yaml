    snippet: "Campylobacter jejuni or Helicobacter pylori) can be associated."
    explanation: >-
      Names H. pylori alongside C. jejuni as an organism that "can be
      associated" with alpha-HCD. Marked PARTIAL because the phrasing asserts
      association only, with no case counts or causal claim.
diagnosis:
- name: Immunofixation with immunoselection of serum and urine
  description: >-
    The diagnostic cornerstone. Serum protein electrophoresis is performed first
    but can be entirely normal, hypogammaglobulinaemic, or show only a broad band
    in the alpha-2/beta region, and therefore cannot exclude HCD. The diagnosis
    requires demonstrating isotype-specific heavy chain reactivity (anti-IgA,
    anti-IgG, or anti-mu) with no corresponding kappa or lambda reactivity in
    serum or urine, using immunoselection or two-dimensional
    immunoelectrophoresis. Mass spectrometry of serum is a modern alternative for
    identifying the truncated chain.
  evidence:
  - reference: PMID:16026747
    reference_title: Heavy chain diseases.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Diagnosis of HCD requires documentation of a deleted immunoglobulin heavy
      chain without a bound light chain in the serum or urine.
    explanation: States the diagnostic criterion.
  - reference: PMID:29326807
    reference_title: "Heavy-Chain Diseases and Myeloma-Associated Fanconi Syndrome: an Update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      dimensional immunoelectrophoresis has been shown to be a useful diagnostic
      tool for all three types of HCD.
    explanation: >-
      Establishes two-dimensional immunoelectrophoresis as a diagnostic tool
      across subtypes.
- name: Upper endoscopy with multiple duodenal and jejunal biopsies
  description: >-
    Required in suspected alpha-HCD, because the disease is centred on the
    proximal small bowel. Endoscopy shows one of five patterns - infiltrative,
    nodular, ulcerative, mosaic, or isolated mucosal fold thickening - of which
    the infiltrative and nodular patterns are the most sensitive and
    characteristic. Biopsies should also be examined and cultured for bacteria
    and parasites.
  evidence:
  - reference: PMID:29326807
    reference_title: "Heavy-Chain Diseases and Myeloma-Associated Fanconi Syndrome: an Update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      endoscopy is mandatory and can reveal five different patterns: i)
      infiltrative, ii) nodular, iii) ulcerations, iv) mosaic, v) isolated
      mucosal fold thickening.
    explanation: >-
      Establishes endoscopy as mandatory and enumerates the diagnostic patterns.
differential_diagnoses:
- name: MALT Lymphoma
  disease_term:
    preferred_term: MALT lymphoma
    term:
      id: MONDO:0007650
      label: MALT lymphoma
  description: >-
    Alpha-HCD is itself a variant of extranodal marginal zone (MALT) lymphoma and
    shares its antigen-driven pathogenesis, indolent early course, and antibiotic
    responsiveness - the same logic as Helicobacter pylori and gastric MALT
    lymphoma. Conventional MALT lymphoma of the gut is therefore the closest
    neighbour rather than a distant mimic.
  distinguishing_features:
  - >-
    Only alpha-HCD secretes a truncated, light-chain-free alpha heavy chain;
    conventional MALT lymphoma expresses a complete, light-chain-restricted
    immunoglobulin.
  - >-
    Alpha-HCD is centred on the proximal small bowel with diffuse plasmacytic
    lamina propria infiltration and villous atrophy, whereas the stomach is the
    commonest conventional MALT lymphoma site.
  - >-
    Conventional MALT lymphoma carries recurrent NF-kB-activating translocations
    such as t(11;18)/BIRC3::MALT1 that are not features of alpha-HCD.
  evidence:
  - reference: PMID:15542584
    reference_title: "Immunoproliferative small intestinal disease (IPSID): a model for mature B-cell neoplasms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      IPSID lymphoma shares clinical, morphologic, and molecular features with
      MALT lymphoma, lymphoplasmacytic lymphoma, and plasma cell neoplasms.
    explanation: >-
      States the overlap with MALT lymphoma, lymphoplasmacytic lymphoma, and
      plasma cell neoplasms that generates this differential.
- name: Waldenstrom Macroglobulinemia
  disease_term:
    preferred_term: Waldenstrom macroglobulinemia
    term:
      id: MONDO:0100280
      label: Waldenstrom macroglobulinemia
  description: >-
    Mu-HCD overlaps Waldenstrom macroglobulinaemia closely: both are
    IgM-secreting marrow lymphoplasmacytic neoplasms, both may carry MYD88 L265P,
    and mu-HCD has been reported as an atypical presentation of Waldenstrom
    macroglobulinaemia. Gamma-HCD may likewise arise during the course of
    Waldenstrom macroglobulinaemia.
  distinguishing_features:
  - >-
    Waldenstrom macroglobulinaemia secretes an intact monoclonal IgM with an
    assembled light chain; mu-HCD secretes a free truncated mu chain demonstrable
    only by immunoselection.
  - >-
    Vacuolated marrow plasma cells and the dissociation between very high serum
    free light chains and an absent or trivial SPEP peak favour mu-HCD.
  - >-
    Hyperviscosity, cryoglobulinaemia, and anti-MAG neuropathy favour Waldenstrom
    macroglobulinaemia.
  evidence:
  - reference: PMID:33596645
    reference_title: "Light chain proteinuria revealing mu-heavy chain disease: an atypical presentation of Waldenström macroglobulinemia in two cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Waldenström macroglobulinemia (WM) is a lymphoplasmacytic lymphoma
      secreting monoclonal IgM, mainly κ, which is strongly associated with the
      MYD88 L265P somatic mutation.
    explanation: >-
      Defines Waldenstrom macroglobulinaemia and the shared MYD88 L265P
      association that makes the distinction difficult.
- name: Multiple Myeloma
  disease_term:
    preferred_term: multiple myeloma
    term:
      id: MONDO:0009693
      label: plasma cell myeloma
  description: >-
    Both are monoclonal gammopathies of the plasma-cell/lymphoplasmacytic
    lineage, and mu-HCD in particular can be mistaken for light-chain myeloma
    because it presents with hypogammaglobulinaemia, very high serum free light
    chains, and Bence Jones proteinuria.
  distinguishing_features:
  - >-
    Multiple myeloma secretes an intact monoclonal immunoglobulin or free light
    chains from a marrow plasma-cell clone; HCD secretes a truncated heavy chain
    with no bound light chain.
  - >-
    Lytic bone lesions, hypercalcaemia, and the other CRAB features are myeloma
    findings that HCD does not produce.
  - >-
    The underlying HCD neoplasm is lymphoplasmacytic or MALT-type rather than a
    plasma cell myeloma.
  evidence:
  - reference: PMID:33596645
    reference_title: "Light chain proteinuria revealing mu-heavy chain disease: an atypical presentation of Waldenström macroglobulinemia in two cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Free light chain multiple myeloma was suspected and bone marrow aspiration
      was performed
    explanation: >-
      A worked example in which mu-HCD was initially mistaken for free
      light-chain myeloma.
- name: Monoclonal Gammopathy of Undetermined Significance
  disease_term:
    preferred_term: monoclonal gammopathy of uncertain significance
    term:
      id: MONDO:0004225
      label: monoclonal gammopathy of uncertain significance
  description: >-
    Gamma- and mu-HCD patients without an overt lymphoma may be labelled as MGUS,
    and asymptomatic mu-HCD is managed by watchful waiting exactly as MGUS is.
  distinguishing_features:
  - >-
    MGUS involves an intact monoclonal immunoglobulin with normal light-chain
    pairing, whereas the HCD paraprotein is a truncated heavy chain with no bound
    light chain, demonstrable only by immunoselection.
  - >-
    Making the distinction matters because HCD carries a defined risk of
    progression to overt lymphoma.
  evidence:
  - reference: PMID:29326807
    reference_title: "Heavy-Chain Diseases and Myeloma-Associated Fanconi Syndrome: an Update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These patients may occasionally be diagnosed with a monoclonal gammopathy
      of undetermined significance (MGUS).
    explanation: >-
      States directly that HCD patients may be misclassified as MGUS.
- name: Chronic Lymphocytic Leukemia
  disease_term:
    preferred_term: chronic lymphocytic leukemia/small lymphocytic lymphoma
    term:
      id: MONDO:0003864
      label: chronic lymphocytic leukemia/small lymphocytic lymphoma
  description: >-
    Mu-HCD almost always arises in a marrow lymphoid neoplasm with CLL/SLL
    features and has historically been described as CLL-like, so CLL/SLL is the
    default alternative diagnosis. A systematic review of published mu-HCD cases
    nevertheless found lymphocytosis to be uncommon, and recurrent MYD88 mutation
    points many cases toward lymphoplasmacytic lymphoma instead.
  distinguishing_features:
  - >-
    CLL/SLL shows peripheral lymphocytosis with a CD5-positive, CD23-positive
    clone and no free heavy chain.
  - >-
    Mu-HCD shows vacuolated marrow plasma cells, frequent Bence Jones
    proteinuria, usually no lymphocytosis, and a free truncated mu chain on
    immunoselection.
  evidence:
  - reference: PMID:35932039
    reference_title: "Mu heavy chain disease with MYD88 L265P mutation: an unusual manifestation of lymphoplasmacytic lymphoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mu heavy chain disease has been described as similar to chronic
      lymphocytic leukemia; however, the frequency of lymphocytosis in mu heavy
      chain disease has not been previously reported. We reviewed all previously
      published mu heavy chain disease reports and found that lymphocytosis is
      uncommon in the entity.
    explanation: >-
      Establishes both the historical CLL comparison and the evidence that
      distinguishes the two.
- name: Celiac Disease
  disease_term:
    preferred_term: celiac disease
    term:
      id: MONDO:0005130
      label: celiac disease
  description: >-
    The principal non-neoplastic differential for the alpha-HCD malabsorption
    presentation. Both cause chronic diarrhoea, malabsorption, weight loss, and
    small-bowel villous atrophy with a lamina propria lymphoid infiltrate, and
    both involve chronic mucosal antigenic stimulation with an increased risk of
    lymphoid malignancy; celiac disease predominates in Northwestern Europe and
    North America where IPSID is rare, and vice versa.
  distinguishing_features:
  - >-
    Celiac disease responds to gluten withdrawal, whereas alpha-HCD does not
    respond to a gluten-free diet.
  - >-
    Celiac disease shows serological markers (anti-tissue transglutaminase,
    anti-endomysial antibodies) and HLA-DQ2/DQ8, with a polyclonal plasma-cell
    population and intraepithelial lymphocytosis.
  - >-
    Alpha-HCD shows a monoclonal alpha-chain-positive, light-chain-negative
    plasma-cell population on immunohistochemistry and is confirmed by anti-IgA
    immunofixation.
  evidence:
  - reference: PMID:10235185
    reference_title: "Alpha-heavy chain disease, Mediterranean lymphoma, and immunoproliferative small intestinal disease: a review of clinicopathological features, pathogenesis, and differential diagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In Middle-Eastern and Mediterranean countries immunoproliferative small
      intestinal disease is endemic, whereas in other parts of the world
      (including Northwestern Europe and North America) celiac sprue, and other
      sprue-like syndromes refractory to dietary gluten withdrawal, predominate.
    explanation: >-
      Frames celiac sprue and IPSID as the geographically complementary causes
      of the same malabsorption syndrome.
  - reference: PMID:10235185
    reference_title: "Alpha-heavy chain disease, Mediterranean lymphoma, and immunoproliferative small intestinal disease: a review of clinicopathological features, pathogenesis, and differential diagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All of these syndromes appear to involve chronic stimulation of intestinal
      mucosa-associated lymphoid tissue and are associated with a heightened
      risk of malignant transformation.
    explanation: >-
      Identifies the shared mechanism (chronic MALT stimulation) that makes the
      distinction mechanistically as well as clinically important.
- name: Heavy Chain Deposition Disease
  disease_term:
    preferred_term: heavy chain deposition disease
    term:
      id: MONDO:0019728
      label: heavy chain deposition disease
  description: >-
    The most commonly confused entity, and a genuinely distinct one. Heavy chain
    deposition disease shares the CH1-deleted truncated heavy chain but the
    abnormal chain deposits in tissue - typically producing nodular
    glomerulosclerosis - rather than circulating as a detectable serum or urine
    paraprotein.
  distinguishing_features:
  - >-
    In heavy chain disease the truncated chain is demonstrable in serum or urine;
    in heavy chain deposition disease and heavy chain amyloidosis it is
    demonstrable in tissue.
  - >-
    The clinical picture of heavy chain deposition disease is a monoclonal
    immunoglobulin deposition nephropathy rather than a lymphoproliferative
    syndrome.
  evidence:
  - reference: PMID:32245744
    reference_title: "Heavy Lifting: Nomenclature and Novel Therapy for Gamma Heavy Chain Disease and Other Heavy Chain Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These disorders share the pathognomonic finding of a truncated
      immunoglobulin heavy chain without an associated light chain in the serum
      or urine in the case of heavy chain disease or in the tissues in the case
      of heavy chain deposition disease and heavy chain amyloidosis but are
      clinically distinct entities.
    explanation: >-
      States precisely the serum/urine versus tissue distinction that separates
      heavy chain disease from heavy chain deposition disease.
treatments:
- name: Antimicrobial Therapy for Early Alpha-HCD
  description: >-
    First-line treatment of early-stage alpha-HCD/IPSID, and the therapeutic
    expression of its antigen-driven pathogenesis. Any documented bacterial or
    parasitic gastrointestinal infection is eradicated; empirical treatment with
    metronidazole, ampicillin, or tetracycline is commonly given even without a
    demonstrated organism. A six-month course is recommended, since shorter
    courses relapse. Clinical, laboratory, and histological remission is achieved
    in 33-71% of early-stage patients, though recurrence is frequent. These are
    historical regimen choices and require contemporary susceptibility, safety,
    and antimicrobial-stewardship review.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: antibiotic therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
    therapeutic_agent:
    - preferred_term: metronidazole
      term:
        id: CHEBI:6909
        label: metronidazole
    - preferred_term: ampicillin
      term:
        id: CHEBI:28971
        label: ampicillin
    - preferred_term: tetracycline
      term:
        id: CHEBI:27902
        label: tetracycline
  target_mechanisms:
  - target: Chronic Enteric Antigenic Stimulation
    treatment_effect: INHIBITS
    description: >-
      Eradicating the driving enteric organism removes the antigenic stimulus
      sustaining the clone, which is why early antigen-dependent disease
      regresses.
  evidence:
  - reference: PMID:29326807
    reference_title: "Heavy-Chain Diseases and Myeloma-Associated Fanconi Syndrome: an Update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Metronidazole, ampicillin, or tetracycline are the antibiotics of choice
      for this empiric therapy.
    explanation: Names the empirical antimicrobial regimens used in alpha-HCD.
  - reference: PMID:15542584
    reference_title: "Immunoproliferative small intestinal disease (IPSID): a model for mature B-cell neoplasms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Early-stage IPSID responds to antibiotics (30%-70% complete remission)."
    explanation: >-
      Quantifies the complete remission rate of early-stage IPSID with
      antibiotics.
- name: Doxorubicin-Containing Combination Chemotherapy
  description: >-
    For alpha-HCD that is refractory to antimicrobials, bulky, or transformed,
    and for aggressive gamma-HCD. CHOP (cyclophosphamide, doxorubicin,

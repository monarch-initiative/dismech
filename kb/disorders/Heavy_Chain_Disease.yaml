progression:
- phase: Early antigen-dependent phase
  subtype: Alpha-HCD
  notes: >-
    Mucosal, non-bulky disease with a plasma-cell-rich lamina propria infiltrate.
    This is the therapeutic window: 33-71% of early-stage patients achieve
    clinical, laboratory, and histological remission on prolonged antimicrobial
    therapy.
  evidence:
  - reference: PMID:15542584
    reference_title: "Immunoproliferative small intestinal disease (IPSID): a model for mature B-cell neoplasms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Early-stage IPSID responds to antibiotics (30%-70% complete remission)."
    explanation: >-
      Defines the antibiotic-responsive early phase and quantifies its remission
      rate.
- phase: Transformed lymphomatous phase
  subtype: Alpha-HCD
  notes: >-
    Progression to lymphoplasmacytic and immunoblastic lymphoma invading the
    bowel wall and mesenteric nodes, with possible distant metastasis. Requires
    chemotherapy or radiation; death results from progressive lymphoma,
    obstruction, perforation, intussusception, cachexia, or infection.
  evidence:
  - reference: PMID:15542584
    reference_title: "Immunoproliferative small intestinal disease (IPSID): a model for mature B-cell neoplasms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most untreated IPSID patients progress to lymphoplasmacytic and
      immunoblastic lymphoma invading the intestinal wall and mesenteric lymph
      nodes, and may metastasize to a distant organ.
    explanation: Defines the transformed phase and its anatomic extent.
- phase: Heterogeneous gamma-HCD course
  subtype: Gamma-HCD
  notes: >-
    Prognosis is highly variable and depends on the associated neoplasm.
    Occasional spontaneous remissions occur in patients with no overt lymphoma,
    who may survive for long periods untreated; treated localised lymphoma
    usually achieves sustained complete clinical and immunologic remission;
    gamma-HCD with systemic lymphoma may be either aggressive and rapidly
    progressive or indolent. Median survival in the Mayo series was 7.4 years.
  evidence:
  - reference: PMID:29326807
    reference_title: "Heavy-Chain Diseases and Myeloma-Associated Fanconi Syndrome: an Update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Occasional spontaneous remissions have been reported in patients with no
      overt lymphoma, who are nonetheless expec ted to undergo a prolonged
      survival without treatment.
    explanation: >-
      Documents the indolent, sometimes spontaneously remitting end of the
      gamma-HCD spectrum.
  - reference: PMID:12861101
    reference_title: "Gamma-heavy chain disease: review of 23 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Median survival was 7.4 years."
    explanation: >-
      Provides the survival benchmark for gamma-HCD from the largest published
      single-institution series.
- phase: Mu-HCD course
  subtype: Mu-HCD
  notes: >-
    Reported median overall survival is approximately two years, with a very
    wide range. This figure is probably an underestimate, because the truncated
    mu chain is frequently missed on serum protein electrophoresis and
    indolent cases go unrecognised.
  evidence:
  - reference: PMID:29326807
    reference_title: "Heavy-Chain Diseases and Myeloma-Associated Fanconi Syndrome: an Update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Reported median overall survival is approximately two years"
    explanation: Provides the survival benchmark for mu-HCD.
epidemiology:
- name: Geographic and demographic distribution
  description: >-
    Alpha-HCD is concentrated in Mediterranean, North African, and Middle Eastern
    populations of low socioeconomic background and presents in the second and
    third decades with a slight male predominance. Gamma-HCD presents between 51
    and 68 years with a marked female predominance. Mu-HCD occurs predominantly
    in older Caucasian men, with a median age of 58 years. These distributions
    may partly reflect ascertainment and publication bias; no modern
    population-based incidence estimate exists for any subtype.
  evidence:
  - reference: PMID:29326807
    reference_title: "Heavy-Chain Diseases and Myeloma-Associated Fanconi Syndrome: an Update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      is most prevalent during the second and third decades of life, with a
      slight male predominance, typically affects the gastrointestinal system and
      rarely the respiratory tract.
    explanation: >-
      Documents the age distribution and sex ratio of alpha-HCD and its organ
      tropism.
  - reference: PMID:29326807
    reference_title: "Heavy-Chain Diseases and Myeloma-Associated Fanconi Syndrome: an Update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The disease occurs predominantly in Caucasian males, with a median age of
      58 years at diagnosis.
    explanation: Documents the demographic distribution of mu-HCD.
discussions:
- discussion_id: hcd_ch1_membrane_form_oncogenic_driver
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is the CH1-deleted heavy chain merely a secretory-escape by-product, or is
    its membrane form an oncogenic driver that sustains the clone through
    antigen-independent B-cell receptor signalling?
  attaches_to:
  - "pathophysiology#Antigen-Independent B-Cell Receptor Aggregation"
  rationale: >-
    The distinction determines whether the CH1 lesion is a diagnostic marker or a
    therapeutic target, and whether antimicrobial therapy alone can be curative
    once the lesion is established. It would also explain why a subset of
    alpha-HCD progresses despite eradication of the driving organism. The
    proposal currently rests on suggestion in a review rather than direct
    demonstration in human HCD tissue.
  proposed_experiments:
  - experiment_id: hcd_single_cell_bcr_tonic_signalling
    name: Single-cell BCR and transcriptomic profiling of HCD clones
    description: >-
      Profile HCD clones at single-cell resolution alongside matched
      lymphoplasmacytic and MALT lymphoma controls, testing whether the HCD clone
      shows tonic, ligand-independent BCR pathway activation.
    decision_criterion: >-
      Selective enrichment of BCR-pathway activation signatures in HCD clones
      relative to light-chain-competent controls would support the driver model.
  - experiment_id: hcd_ch1_deleted_construct_aggregation
    name: Engineered CH1-deleted heavy chain constructs in B-cell lines
    description: >-
      Express CH1-deleted heavy chain constructs in B-cell lines and assay
      directly for antigen-independent receptor aggregation and downstream
      signalling.
    decision_criterion: >-
      Demonstration of spontaneous receptor clustering and downstream signalling
      in the absence of antigen would establish the mechanism in a controlled
      system.
  evidence:
  - reference: PMID:29326807
    reference_title: "Heavy-Chain Diseases and Myeloma-Associated Fanconi Syndrome: an Update."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In addition, recent work suggests that the altered heavy chain, which
      forms part of the transmembrane B -cell receptor, may facilitate antigen
      -independent aggregation and
    explanation: >-
      Documents the state of the art: the mechanism is offered as a suggestion,
      not a demonstration, which is what leaves the gap open.
  - reference: PMID:29326807
    reference_title: "Heavy-Chain Diseases and Myeloma-Associated Fanconi Syndrome: an Update."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      down-stream signaling by the receptor, thereby conferring a growth
      advantage to neoplastic cells.
    explanation: >-
      The continuation of the same sentence across a PDF page break in the
      cached review, carrying the growth-advantage claim itself. Quoted as a
      separate item because the page break makes a single contiguous quote
      impossible.
- discussion_id: hcd_population_incidence_unknown
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What is the true population incidence of each heavy chain disease subtype,
    and how much of the reported geographic and sex skew is ascertainment bias?
  attaches_to:
  - "pathophysiology#Clonal Lymphoplasmacytic B-Cell Expansion"
  rationale: >-
    Every published figure is a cumulative literature case count (more than 400
    alpha, about 130 gamma, 30-40 mu), not a rate. Mu-HCD is explicitly suspected
    to be under-ascertained because the truncated chain is missed on serum
    protein electrophoresis, so its reported median survival of about two years
    is probably an underestimate. Without denominators, neither prognosis nor
    treatment effect can be estimated reliably.
  proposed_experiments:
  - experiment_id: hcd_international_registry
    name: International HCD registry with centralised confirmation
    description: >-
      Establish a multinational registry with centralised mass-spectrometric and
      immunofixation confirmation of every submitted case and contemporary
      outcome capture.
    decision_criterion: >-
      Denominator-based incidence estimates and outcome curves that are stable
      across contributing regions.
  - experiment_id: hcd_reflex_immunoselection_ascertainment
    name: Reflex immunoselection in discordant monoclonal gammopathies
    description: >-
      Apply systematic reflex immunoselection in laboratories reporting
      monoclonal gammopathies with discordant heavy-chain and light-chain
      quantitation, to estimate how many HCD cases current practice misses.
    decision_criterion: >-
      A measurable yield of previously unrecognised free heavy chains would
      quantify the ascertainment shortfall.
  evidence:
  - reference: PMID:29326807
    reference_title: "Heavy-Chain Diseases and Myeloma-Associated Fanconi Syndrome: an Update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It is the most common of the three HCDs, with more than 400 cases
      described in the literature since its initial description in 1968.
    explanation: >-
      Illustrates that the best available epidemiological figures are cumulative
      literature case counts rather than population rates.
- discussion_id: hcd_campylobacter_causality
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is Campylobacter jejuni causal in alpha-HCD/IPSID, or a marker of the poor
    sanitation and polymicrobial enteric colonisation that constitute the real
    antigenic drive?
  attaches_to:
  - "pathophysiology#Chronic Enteric Antigenic Stimulation"
  rationale: >-
    The C. jejuni association is well documented and antibiotic responsiveness is
    consistent with an antigen-driven mechanism, but reviewers explicitly note
    controversy about the organism's pathogenetic role, and contemporary cases
    have found several concomitant enteric pathogens rather than C. jejuni alone.
    Resolving this determines whether targeted eradication or broad
    decolonisation is the rational therapy.
  proposed_experiments:
  - experiment_id: hcd_ipsid_metagenomics
    name: Metagenomic sequencing of IPSID small-bowel biopsies
    description: >-
      Sequence the small-bowel microbiome of IPSID patients and geographically
      matched controls to test whether C. jejuni is specifically enriched
      relative to overall enteric microbial burden.
    decision_criterion: >-
      Specific enrichment of C. jejuni beyond the general increase in enteric
      burden would support a causal role.
  - experiment_id: hcd_targeted_eradication_cohort
    name: Organism-specific eradication versus histological remission
    description: >-
      Prospectively correlate documented organism-specific eradication with
      histological remission versus persistence in a multicentre IPSID cohort.
    decision_criterion: >-
      Remission tracking C. jejuni clearance specifically, rather than broad
      antimicrobial exposure, would support causality.
  evidence:
  - reference: PMID:29372346
    reference_title: Heavy Chain Disease of the Small Bowel.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A link between Campylobacter jejuni infection and IPSID has been
      established, but there is controversy as to the role played by this
      organism in disease pathogenesis.
    explanation: >-
      States the controversy explicitly, which is the gap this discussion
      records.
notes: >-
  Modelling decisions. (1) The CH1 mechanism is modelled as an explicit five-node
  causal chain - somatic IGH deletion, loss of CH1 and failure of light-chain
  pairing, escape from BiP-dependent ER quality control, secretion of the
  truncated chain, and the excess free light chains that follow in mu-HCD -
  because it is the single lesion that unifies three clinically dissimilar
  diseases. (2) Conformance to `tumor_promoting_inflammation` is claimed only at
  the module's `Chronic Inflammatory Stimulus` node, for the alpha-HCD enteric
  infection and gamma-HCD autoimmune triggers. Conformance to the module's
  `Pro-Tumorigenic Inflammatory Microenvironment` node was deliberately NOT
  claimed: that node is defined by tumour-associated macrophages, neutrophils,
  and mast cells secreting growth and pro-angiogenic factors, and no such
  myeloid-microenvironment evidence exists for HCD. (3) The Ria 2018 review names
  the ER chaperone "HSP78"; this is a naming slip for BiP/GRP78 (HSPA5), and the
  chaperone identity in this entry is taken from the primary sources (Vanhove
  2001, Feige 2009, Vergneault 2021) rather than from the review. (4) Heavy chain
  deposition disease (MONDO:0019728) and heavy chain amyloidosis are curated here
  only as differential diagnoses; they share the CH1 lesion but deposit in tissue
  rather than circulating, and are separate entities. (5) The cached full text of
  PMID:33596645 renders Greek mu as the Latin letter "m" throughout (m-HCD,
  m-heavy chain); snippets quoted from it preserve that rendering. (6) The ICD-O
  morphology assignment uses `Lymphoma` because the closed enum has no value for
  ICDO:9762/3 (heavy chain disease); see the `classifications.notes`. (7)
  Nosological tension, recorded rather than resolved: MONDO places
  MONDO:0019464 under MONDO:0004959 plasma cell neoplasm, and `parents` records
  that placement faithfully. The primary literature disagrees - Ria 2018 states
  "Each HCD appears to represent an unusual variant of a type of lymphoma, and
  none of them can be defined a true plasma cell neoplasms" - and Wahner-Roedler
  & Kyle likewise classify the HCDs as non-Hodgkin lymphoma variants. The
  `categories` list and the ICD-O assignment therefore follow the literature
  (lymphoplasmacytic/lymphoma), while `parents` follows MONDO. This is a
  candidate MONDO placement issue rather than a curation error in this entry.
  (8) Villous atrophy is deliberately curated twice: as a `histopathology`
  finding (the microscopic observation, bound to NCIT:C38731) and as a
  `phenotypes` entry (bound to HP:0011473), because `histopathology` entries are
  not nodes in the causal graph and the infiltration -> villous atrophy ->
  malabsorption chain would otherwise dangle.

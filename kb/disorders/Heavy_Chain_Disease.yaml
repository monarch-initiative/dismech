      underlying Waldenstrom macroglobulinaemia clone.
- name: PAX5
  notes: >-
    A t(9;14) translocation involving PAX5 has been reported among the clonal
    cytogenetic rearrangements of alpha-HCD/IPSID. No recurrent, disease-defining
    translocation has been established for any HCD subtype; the reported
    abnormalities come from rare single cases.

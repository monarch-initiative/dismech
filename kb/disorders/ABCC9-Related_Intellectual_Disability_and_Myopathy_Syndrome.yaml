diagnosis:
- name: Molecular genetic testing of ABCC9
  description: >-
    Diagnosis rests on identifying biallelic loss-of-function ABCC9 variants,
    with comprehensive clinical exome sequencing used in the index families.
    Direction of effect and zygosity must be established because dominant
    gain-of-function ABCC9 variants cause Cantu syndrome rather than AIMS.
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:31575858
    reference_title: ABCC9-related Intellectual disability Myopathy Syndrome is a K(ATP) channelopathy with loss-of-function mutations in ABCC9.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients are homozygous for a splice-site mutation in ABCC9 (c.1320 + 1 G > A), which encodes the sulfonylurea receptor 2 (SUR2) subunit of KATP channels."
    explanation: The diagnosis in the index families was made by identifying the biallelic ABCC9 allele.
  - reference: PMID:38217872
    reference_title: Novel loss-of-function variants expand ABCC9-related intellectual disability and myopathy syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we identify nine additional subjects, from seven unrelated families, harbouring different homozygous loss-of-function variants in ABCC9 and presenting with a conserved range of clinical features."
    explanation: Confirms that homozygous loss-of-function ABCC9 genotyping is the diagnostic route.
  - reference: PMID:31575858
    reference_title: ABCC9-related Intellectual disability Myopathy Syndrome is a K(ATP) channelopathy with loss-of-function mutations in ABCC9.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "families are investigated by comprehensive clinical exome sequencing"
    explanation: Identifies clinical exome sequencing as the test used to solve the index families.
- name: Brain MRI
  description: >-
    Brain MRI shows cerebral white matter hyperintensities, often with a
    periventricular-leukomalacia-like or small-vessel-disease pattern. This

    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "Consistent with defective VSMC development, Kcnj8 knockout mice showed deficiency in vasoconstrictive capacity and neuronal-evoked vasodilation leading to local hyperemia."
    explanation: >-
      Marked PARTIAL because the in vivo neurovascular-coupling deficit was shown

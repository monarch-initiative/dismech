treatments:
- name: Supportive and multidisciplinary care
  description: >-
    No AIMS-specific disease-modifying treatment is reported in the cited
    cohorts. The most recent cohort recommends monitoring older individuals for
    motor and cognitive decline and highlights deterioration following surgical
    procedures; manifestation-directed treatments reported elsewhere in this
    entry remain case-based rather than AIMS-specific protocols.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:42290677
    reference_title: "Cognitive Decline, Neurologic Involvement, and Neonatal Crisis in ABCC9-Related Intellectual Disability and Myopathy Syndrome."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "These latest findings also highlight neonatal presentation of disease, deterioration following surgical procedures, and the potential for motor and cognitive decline, which should be monitored in older individuals."
    explanation: >-
      Supports monitoring for decline and peri-procedural caution, but not a
      complete multidisciplinary-care protocol; therefore marked PARTIAL.
- name: Avoidance of calcium channel blockers
  description: >-
    Calcium channel blockers warrant strong caution on current preclinical
    evidence. Verapamil was tested in SUR2 loss-of-function mice on the
    hypothesis that excess
    CaV1.1-mediated calcium entry drove the myopathy; instead of rescuing the
    phenotype it caused premature death, and genetically rendering CaV1.1
    non-permeable also failed to reverse the pathology. The authors state
    explicitly that this cautions against calcium channel blockers in AIMS.
    This is a model-organism safety signal, not a human trial result, and is
    recorded here because it is the only actionable drug-safety statement in
    the AIMS literature.
  treatment_term:
    preferred_term: avoidance of calcium channel blocker therapy
    term:
      id: NCIT:C15747
      label: Supportive Care
    therapeutic_agent:
    - preferred_term: verapamil
      term:
        id: CHEBI:9948
        label: verapamil
    - preferred_term: calcium channel blocker
      term:
        id: NCIT:C333
        label: Calcium Channel Blocker
  evidence:
  - reference: PMID:37154692
    reference_title: Skeletal muscle delimited myopathy and verapamil toxicity in SUR2 mutant mouse models of AIMS.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "results which caution against the use of calcium channel blockers in AIMS."
    explanation: The authors' explicit safety recommendation.
  - reference: PMID:37154692
    reference_title: Skeletal muscle delimited myopathy and verapamil toxicity in SUR2 mutant mouse models of AIMS.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "found that the Ca2+ channel blocker verapamil unexpectedly resulted in premature death of AIMS mice"
    explanation: The experimental basis for the warning.
- name: Physiotherapy and activity pacing
  description: >-
    Physiotherapy and graded, paced activity address the fatigability, balance
    deficits and reduced walking distance objectively documented in the index
    cohort. No trial evidence exists in AIMS; this is standard neuromuscular
    rehabilitation applied to a documented functional deficit.
  treatment_term:
    preferred_term: Physical Therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  evidence:
  - reference: PMID:31575858
    reference_title: ABCC9-related Intellectual disability Myopathy Syndrome is a K(ATP) channelopathy with loss-of-function mutations in ABCC9.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "and walking distance in the 6-min walk test is reduced in all individuals."
    explanation: >-
      Marked PARTIAL: this documents the functional deficit that physiotherapy
      targets, but no study has tested physiotherapy in AIMS.
- name: Heart failure pharmacotherapy
  description: >-
    Standard heart-failure pharmacotherapy for the reduced systolic function
    that emerges in older individuals: an ACE inhibitor plus a beta-blocker was
    started in the index patient found to have biventricular systolic
    dysfunction with an ejection fraction of 35-40%. This is a single reported
    case managed by conventional heart-failure practice, not an AIMS-specific
    regimen, and no outcome is reported. Note the direction-of-effect contrast
    with Cantu syndrome, where ACE inhibitors appear on the GeneReviews
    agents-to-avoid list because they open KATP channels that are already
    overactive; in AIMS the channels carry no measurable current, so that
    rationale does not transfer.
  treatment_term:
    preferred_term: heart failure pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ACE inhibitor
      term:
        id: NCIT:C247
        label: ACE Inhibitor
    - preferred_term: beta-blocker
      term:
        id: NCIT:C29576
        label: Beta-Adrenergic Antagonist
  notes: >-
    Curated as reported management of a documented complication, not as a
    recommendation: the source describes what was done for one patient. The
    Cantu contrast is recorded in the description because the two diseases
    share a gene and invert the direction of effect, and a reader who
    transfers the Cantu avoid-list to AIMS would withhold appropriate therapy.
  evidence:
  - reference: PMID:31575858
    reference_title: ABCC9-related Intellectual disability Myopathy Syndrome is a K(ATP) channelopathy with loss-of-function mutations in ABCC9.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

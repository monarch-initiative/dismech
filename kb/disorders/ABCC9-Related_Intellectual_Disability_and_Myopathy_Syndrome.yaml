- name: Impaired Brain Vascular Smooth Muscle Differentiation and Neurovascular Coupling
  biological_scale: CELLULAR
  description: >-
    KCNJ8/ABCC9-containing KATP channels are expressed on brain mural cell
    progenitors and are required cell-autonomously for arterial and arteriolar
    smooth muscle differentiation. Loss of channel function suppresses that
    differentiation and, in the corresponding knockout, degrades vasoconstrictive
    capacity and neuronally evoked vasodilation - the machinery that fine-tunes
    cerebral blood flow.

genetic:
- name: ABCC9
  gene_term:
    preferred_term: ABCC9
    term:
      id: hgnc:60
      label: ABCC9
  association: Causative
  inheritance:
  - name: Autosomal recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
    evidence:
    - reference: PMID:38217872
      reference_title: Novel loss-of-function variants expand ABCC9-related intellectual disability and myopathy syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Loss-of-function mutation of ABCC9, the gene encoding the SUR2 subunit of ATP sensitive-potassium (KATP) channels, was recently associated with autosomal recessive ABCC9-related intellectual disability and myopathy syndrome (AIMS)."
      explanation: States the recessive inheritance of the ABCC9 loss-of-function syndrome.
  features: >-
    Only loss-of-function ABCC9 alleles cause AIMS, and only in the biallelic
    state. The founding allele is the homozygous splice-site variant
    c.1320+1G>A, which causes in-frame skipping of exon 8 and a SUR2 protein
    missing 52 amino acids with no plasmalemmal KATP function. The expanded
    cohorts add homozygous nonsense and frameshift alleles predicted to trigger
    nonsense-mediated decay or severe truncation of SUR2; recombinant testing
    confirms complete loss of function for the truncations. Gain-of-function
    missense ABCC9 alleles, several clustering at Arg1154, cause Cantu syndrome
    instead and are dominant - direction of effect, not the gene, is the
    discriminator. Heterozygous ABCC9 loss-of-function carriers in AIMS families
    have no conserved clinical pathology but report an excess of intra-uterine
    fetal death; the fetal genotypes were not established, so this remains a
    reproductive observation rather than an established heterozygote phenotype.
    The founding c.1320+1G>A allele is enriched in the Finnish population -
    gnomAD heterozygote allele frequency 0.0007 (18/24,850), against 0.00004 in
    non-Finnish Europeans and absent in Asian and African populations, with no
    homozygotes recorded - which matches the probable Finnish ancestry of the
    index families and predicts that AIMS is more prevalent in that population.
  evidence:
  - reference: PMID:31575858
    reference_title: ABCC9-related Intellectual disability Myopathy Syndrome is a K(ATP) channelopathy with loss-of-function mutations in ABCC9.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients are homozygous for a splice-site mutation in ABCC9 (c.1320 + 1 G > A), which encodes the sulfonylurea receptor 2 (SUR2) subunit of KATP channels."
    explanation: The founding homozygous splice-site allele.
  - reference: PMID:31575858
    reference_title: ABCC9-related Intellectual disability Myopathy Syndrome is a K(ATP) channelopathy with loss-of-function mutations in ABCC9.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This mutation results in an in-frame deletion of exon 8, which results in non-functional KATP channels in recombinant assays."
    explanation: Functional consequence of the founding allele.
  - reference: PMID:31575858

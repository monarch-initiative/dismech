mechanistic_hypotheses:
- hypothesis_group_id: aims_cerebrovascular_white_matter
  hypothesis_label: Cerebral small-vessel origin of the AIMS white matter injury and cognitive phenotype
  status: EMERGING
  description: >-
    The leading explanation for the CNS arm of AIMS is that loss of
    SUR2-containing KATP channels in brain vascular smooth muscle degrades
    cerebral autoregulation and neurovascular coupling, producing chronic
    small-vessel ischaemic white matter injury and, through it, the
    intellectual disability and pyramidal signs. The supporting facts are
    consistent but indirect: KCNJ8/ABCC9-containing channels are required for
    brain vascular smooth muscle differentiation in animals, the human imaging
    resembles small vessel disease, MR angiography is normal so the lesion is
    functional rather than macrovascular, and the same white matter change is
    seen in Cantu syndrome where the channel defect is opposite. What is
    missing is any direct measurement of cerebral blood flow or neurovascular
    coupling in an AIMS patient, and the in vivo coupling deficit was
    demonstrated in a Kcnj8 rather than an Abcc9 knockout. The original authors
    state the hypothesis with the hedge "it is conceivable".
  evidence:
  - reference: PMID:31575858
    reference_title: ABCC9-related Intellectual disability Myopathy Syndrome is a K(ATP) channelopathy with loss-of-function mutations in ABCC9.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "it is conceivable that KATP loss of function may impact the cerebral vasculature"
    explanation: The authors' own statement of the hypothesis, framed as a conjecture.
  - reference: PMID:31575858
    reference_title: ABCC9-related Intellectual disability Myopathy Syndrome is a K(ATP) channelopathy with loss-of-function mutations in ABCC9.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Interestingly, white matter hyperintensities are observed in both Cantú syndrome and AIMS."
    explanation: >-
      That the same white matter change appears in the gain-of-function disease
      is what makes a shared cerebrovascular route plausible, but it also means
      the finding does not discriminate direction of effect.
  - reference: PMID:35588738
    reference_title: KCNJ8/ABCC9-containing K-ATP channel modulates brain vascular smooth muscle development and neurovascular coupling.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "Our results demonstrate a role for KCNJ8/ABCC9-containing K-ATP channels in the differentiation of brain VSMC, which in turn is necessary for fine-tuning of cerebral blood flow."
    explanation: >-
      Supplies the developmental cerebrovascular role, but in animal and cell
      models rather than AIMS patients.
- hypothesis_group_id: cav1_1_calcium_influx_myopathy
  hypothesis_label: CaV1.1-mediated calcium influx as the driver of AIMS myopathy
  status: DEPRECATED
  description: >-
    Excessive calcium influx through skeletal-muscle CaV1.1 channels was tested
    as the downstream cause of the SUR2 loss-of-function myopathy. The model is
    not retained as the current mechanism: making CaV1.1 non-permeable did not
    reverse the pathology, while verapamil caused premature death in AIMS mice.
    The directly observed unstimulated-force phenotype remains established, but
    its downstream effector is unresolved.
  evidence:
  - reference: PMID:37154692
    reference_title: Skeletal muscle delimited myopathy and verapamil toxicity in SUR2 mutant mouse models of AIMS.
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: "We sought to determine whether excessive Ca2+ influx through CaV 1.1 channels was responsible for myopathology but found that the Ca2+ channel blocker verapamil unexpectedly resulted in premature death of AIMS mice and that rendering CaV 1.1 channels nonpermeable by mutation failed to reverse pathology; results which caution against the use of calcium channel blockers in AIMS."
    explanation: >-
      Direct pharmacologic and genetic tests failed to support CaV1.1-mediated
      calcium influx as the cause of the myopathy; the drug intervention was
      additionally harmful.
discussions:
- discussion_id: aims_id_anxiety_model_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Why do SUR2-null mice show no learning, memory or anxiety phenotype when
    intellectual disability and anxiety are defining features of AIMS in
    humans, and does that mean the murine model cannot be used to study the
    cognitive arm of the disease?
  attaches_to:
  - pathophysiology#Intellectual Disability and Developmental Delay
  rationale: >-
    This is a model-evidence-exists-and-is-negative situation, not an absence
    of data. The SUR2-STOP mouse was formally tested for spatial learning and
    memory in a Morris water maze and for anxiety-like behaviour in an elevated
    plus maze and was negative on both, while every human patient tested has
    intellectual disability and several have anxiety. The original authors also
    note that it is not obvious how myocyte KATP dysfunction could produce
    intellectual disability at all, and that neuronal KATP channels are
    predominantly Kir6.2/SUR1 rather than SUR2-containing. Together these make
    the cognitive arm the least secure part of the AIMS mechanism: either the
    murine assays are too coarse for a mild human intellectual disability, or
    the human cognitive phenotype is mediated by something (most plausibly the
    cerebrovascular route) that the mouse does not reproduce.
  proposed_experiments:
  - experiment_id: exp_aims_mouse_working_memory
    name: Higher-sensitivity cognitive phenotyping of SUR2-null mice
    description: >-
      Test SUR2-null mice with working-memory and fear-conditioning paradigms
      rather than the Morris water maze alone, on the hypothesis that a mild
      human intellectual disability may be below the resolution of standard
      spatial-learning assays.
  - experiment_id: exp_aims_knockin_human_allele
    name: Knock-in mouse carrying an actual human AIMS allele
    description: >-
      Generate a mouse carrying a human AIMS variant rather than an
      independently engineered premature stop, so that the model's genetic
      lesion matches the patients' and residual-protein effects are preserved.
  - experiment_id: exp_aims_human_cbf_measurement
    name: Direct cerebral blood flow and neurovascular coupling measurement in AIMS patients
    description: >-
      Measure resting cerebral perfusion and task-evoked neurovascular coupling
      (arterial spin labelling, BOLD reactivity) in genotyped AIMS patients
      against controls, to test the cerebrovascular hypothesis directly in the
      species that actually has the cognitive phenotype.
  evidence:
  - reference: PMID:31575858
    reference_title: ABCC9-related Intellectual disability Myopathy Syndrome is a K(ATP) channelopathy with loss-of-function mutations in ABCC9.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "nor in tests of spatial learning and memory, evaluated using a Morris water maze"
    explanation: The mouse spatial-learning result is formally negative.
  - reference: PMID:31575858
    reference_title: ABCC9-related Intellectual disability Myopathy Syndrome is a K(ATP) channelopathy with loss-of-function mutations in ABCC9.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "show any obvious anxiety-like behaviors."
    explanation: The mouse anxiety result is likewise negative, against a human phenotype that includes anxiety.
  - reference: PMID:31575858
    reference_title: ABCC9-related Intellectual disability Myopathy Syndrome is a K(ATP) channelopathy with loss-of-function mutations in ABCC9.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "and there are no reports of cognitive impairment in previous SUR2 mutant animal models."
    explanation: >-
      The authors state, in the same sentence, both that the route from channel
      loss to intellectual disability is not obvious and that no earlier SUR2
      mutant animal model showed cognitive impairment.
- discussion_id: aims_natural_history_gap
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What is the natural history of AIMS across the lifespan, and at what
    interval should cardiac and cerebral imaging surveillance be performed?
  rationale: >-
    Around twenty patients have ever been reported, in three cross-sectional
    series with no prospective follow-up. Two features are known to be
    age-dependent - systolic dysfunction, present only in the oldest patients
    of the index cohort, and cognitive and motor decline reported in a
    sexagenarian - but neither has a defined onset distribution, so no
    surveillance interval can be evidence-based. No registry, survival
    analysis, or quality-of-life instrument has ever been applied.
  proposed_experiments:
  - experiment_id: exp_aims_prospective_registry
    name: International AIMS natural-history registry
    description: >-
      Enrol genotyped AIMS patients with standardised serial cardiac imaging,
      brain MRI, neuropsychological testing and functional measures, to
      establish onset distributions for the age-dependent complications and to
      set surveillance intervals.
  evidence:
  - reference: PMID:42290677
    reference_title: "Cognitive Decline, Neurologic Involvement, and Neonatal Crisis in ABCC9-Related Intellectual Disability and Myopathy Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These latest findings also highlight neonatal presentation of disease, deterioration following surgical procedures, and the potential for motor and cognitive decline, which should be monitored in older individuals."
    explanation: >-
      The most recent series calls for monitoring of older individuals without
      being able to specify what or how often, which is the gap.
differential_diagnoses:
- name: Cantu syndrome
  description: >-
    The other ABCC9 disease and the single most important entity to separate
    from AIMS. Cantu syndrome is caused by GAIN-of-function ABCC9 variants and
    is autosomal dominant, whereas AIMS is caused by biallelic LOSS-of-function
    variants and is autosomal recessive. The two are therefore allelic in the
    trivial sense of sharing a gene but are mechanistically opposite, and the
    Cantu literature is far larger, so a paper that says only "ABCC9 variant"
    without stating direction of effect cannot be used for either disease.
    Clinically Cantu is dominated by congenital hypertrichosis, coarse facial
    features, cardiomegaly with enhanced systolic function and
    osteochondrodysplasia, with intellect typically normal - none of which
    describes AIMS. Conversely no AIMS patient has had hypertrichosis, and AIMS
    cardiac disease is reduced rather than enhanced systolic function.
  distinguishing_features:
  - Gain-of-function ABCC9 variants, not loss-of-function
  - Autosomal dominant with de novo missense alleles clustering at Arg1154, not autosomal recessive truncating or splice alleles
  - Congenital hypertrichosis is characteristic; no AIMS patient has had hypertrichosis
  - Coarse facial features and osteochondrodysplasia, versus the distinct AIMS facies with prominent supraorbital ridges
  - Cardiomegaly with enhanced systolic function and patent ductus arteriosus, versus reduced systolic function in older AIMS patients
  - Intellect typically normal despite common developmental delay, versus intellectual disability in essentially all AIMS patients
  - Cerebral white matter hyperintensity resembling periventricular leukomalacia is an AIMS hallmark, not a Cantu feature
  - The Cantu GeneReviews "agents to avoid" list (minoxidil, diazoxide, ACE inhibitors) is specific to KATP overactivity and must not be transferred to AIMS
  disease_term:
    preferred_term: Cantu syndrome
    term:
      id: MONDO:0009406
      label: hypertrichotic osteochondrodysplasia Cantu type
  notes: >-
    MONDO:0009406 is the canonical MONDO term for Cantu syndrome, carries
    "Cantu syndrome" as an exact synonym, is bound to the same gene
    (RO:0004003 HGNC:60 ABCC9), is not obsolete, and is not an ancestor of this
    entry's anchor MONDO:0859224 - the anchor's only ontological ancestors are
    MONDO:0003847 (hereditary disease) and its superclasses. There is no Cantu
    syndrome entry in the dismech KB to cross-reference, so this differential is
    the only place the contrast is recorded.
  evidence:
  - reference: PMID:31575858
    reference_title: ABCC9-related Intellectual disability Myopathy Syndrome is a K(ATP) channelopathy with loss-of-function mutations in ABCC9.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The phenotype differs from Cantú syndrome, which is caused by gain-of-function ABCC9 mutations, reflecting the opposing consequences of KATP loss- versus gain-of-function."
    explanation: States the direction-of-effect discriminator directly.
  - reference: PMID:31575858
    reference_title: ABCC9-related Intellectual disability Myopathy Syndrome is a K(ATP) channelopathy with loss-of-function mutations in ABCC9.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Therefore, Cantú syndrome and AIMS, arising from opposing molecular mechanisms, are both dysmorphologically and mechanistically distinct."
    explanation: The AIMS authors' own conclusion that the two entities are distinct on both counts.
  - reference: PMID:31575858
    reference_title: ABCC9-related Intellectual disability Myopathy Syndrome is a K(ATP) channelopathy with loss-of-function mutations in ABCC9.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "None of our patients have hypertrichosis, unlike Cantú syndrome patients."
    explanation: The single most discriminating clinical sign between the two ABCC9 diseases.
  - reference: PMID:25275207
    reference_title: Cantú Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cantú syndrome is characterized by congenital hypertrichosis; distinctive coarse facial features (including broad nasal bridge, wide mouth with thick vermilion of the upper and lower lips, and macroglossia); enlarged heart with enhanced systolic function, as well as pericardial effusion and, in many, a large patent ductus arteriosus (PDA) requiring repair; and musculoskeletal abnormalities (thickening of the calvaria, broad ribs, scoliosis, flaring of the metaphyses, and low muscle tone)."
    explanation: The GeneReviews Clinical Characteristics baseline for Cantu syndrome, used here only as the differential's reference phenotype.
  - reference: PMID:25275207
    reference_title: Cantú Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Developmental delays are common, but intellect is typically normal"
    explanation: >-
      The cognitive discriminator: intellect is typically normal in Cantu
      syndrome, whereas intellectual disability is present in essentially all
      AIMS patients.
  - reference: PMID:25275207
    reference_title: Cantú Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of Cantú syndrome can be established in a proband with characteristic clinical and imaging findings and/or a heterozygous gain-of-function pathogenic variant in ABCC9 or KCNJ8 identified by molecular genetic testing."
    explanation: >-
      The molecular discriminator: heterozygous gain-of-function versus the
      biallelic loss-of-function required for AIMS.
- name: ABCC8-related congenital hyperinsulinism
  description: >-
    ABCC8 encodes SUR1, the pancreatic sulfonylurea receptor, and differs from
    ABCC9 by one character in the gene symbol and one paralogue in the same KATP
    family. Biallelic ABCC8 loss of function is the commonest genetic cause of
    congenital hyperinsulinism, which is a neonatal hypoglycaemia disorder with
    no myopathy and no primary white matter disease. The mechanistic parallel is
    real - both are recessive loss-of-function sulfonylurea-receptor
    channelopathies - which is exactly why the literature is easy to
    misattribute, and why every mechanistic sentence in this entry was checked
    for which receptor it names.
  distinguishing_features:
  - Caused by ABCC8 (SUR1), not ABCC9 (SUR2)
  - Presents with severe persistent neonatal hyperinsulinaemic hypoglycaemia, which is not a feature of AIMS
  - Tissue of action is the pancreatic beta cell, not skeletal muscle, brain vasculature or myocardium
  - Focal and diffuse histological forms with 18F-DOPA PET localisation, a workup with no AIMS counterpart
  - Any brain injury is secondary to hypoglycaemia, whereas AIMS white matter disease is primary and present without hypoglycaemia
  disease_term:
    preferred_term: autosomal recessive hyperinsulinism due to SUR1 deficiency
    term:
      id: MONDO:0019333
      label: autosomal recessive hyperinsulinism due to SUR1 deficiency
  notes: >-
    MONDO:0019333 is bound rather than the broader congenital hyperinsulinism
    term because it names the SUR1 (ABCC8) recessive form specifically, which is
    the precise mirror-image entity. It is not obsolete and is not an ancestor
    of MONDO:0859224.
  evidence:
  - reference: PMID:38791571
    reference_title: "Congenital Hyperinsulinism Caused by Mutations in ABCC8 Gene Associated with Early-Onset Neonatal Hypoglycemia: Genetic Heterogeneity Correlated with Phenotypic Variability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Congenital hyperinsulinism (CHI) is a rare disorder of glucose metabolism and is the most common cause of severe and persistent hypoglycemia (hyperinsulinemic hypoglycemia, HH) in the neonatal period and childhood."
    explanation: Defines the clinical entity, which is metabolic and neonatal rather than neuromuscular.
  - reference: PMID:38791571
    reference_title: "Congenital Hyperinsulinism Caused by Mutations in ABCC8 Gene Associated with Early-Onset Neonatal Hypoglycemia: Genetic Heterogeneity Correlated with Phenotypic Variability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most cases are caused by mutations in the ABCC8 and KCNJ11 genes that encode the ATP-sensitive potassium channel (KATP)."
    explanation: Names ABCC8, not ABCC9, as the causative subunit gene.
- name: DEND syndrome
  description: >-
    Developmental delay, epilepsy and neonatal diabetes - the KATP
    gain-of-function neurodevelopmental syndrome caused by activating variants
    in KCNJ11 or ABCC8. It is the sharpest phenocopy trap in the KATP family for
    the neurological arm of AIMS, because developmental delay plus epilepsy is
    exactly the AIMS presentation, and the gene name ABCC8 is one character from
    ABCC9. It is separated by the obligatory neonatal diabetes, by the opposite
    direction of channel effect, by dominant rather than recessive inheritance,
    and by dramatic responsiveness to oral sulfonylureas, which have no
    established role in AIMS.
  distinguishing_features:
  - Caused by gain-of-function KCNJ11 or ABCC8 variants, not loss-of-function ABCC9
  - Neonatal diabetes mellitus within the first six months of life is obligatory and has never been reported in AIMS
  - KATP overactivity, the opposite direction of effect to AIMS
  - Typically dominant (often de novo), not autosomal recessive
  - Responds to oral sulfonylureas, which close KATP channels and have no rationale in a channel-null disease
  - Myopathy with fatigability and painful spasms is an AIMS feature, not a DEND feature
  disease_term:
    preferred_term: DEND syndrome
    term:
      id: MONDO:0019207
      label: DEND syndrome
  notes: >-
    MONDO:0019207 is bound rather than the gene-specific children DEND1
    (MONDO:0800375) or DEND2 (MONDO:0800376) because neither child carries a
    gene relationship in MONDO, so binding one of them would assert a gene
    attribution the ontology does not make. MONDO:0019207 is not obsolete and is
    not an ancestor of MONDO:0859224.
  evidence:
  - reference: PMID:20301620
    reference_title: Permanent Neonatal Diabetes Mellitus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Permanent neonatal diabetes mellitus (PNDM) is characterized by the onset of hyperglycemia within the first six months of life (mean age: 7 weeks; range: birth to age 26 weeks)."
    explanation: The neonatal diabetes that defines the DEND spectrum and is absent from AIMS.
  - reference: PMID:20301620
    reference_title: Permanent Neonatal Diabetes Mellitus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Targeted therapy: Oral sulfonylureas after initial management with insulin in those with ABCC8- or KCNJ11-related PNDM."
    explanation: >-
      Names ABCC8 and KCNJ11 as the KATP genes of this entity and gives the
      sulfonylurea response that has no counterpart in AIMS.
- name: Heterozygous ABCC9 loss-of-function cardiac phenotypes
  description: >-
    A cluster of monoallelic ABCC9 loss-of-function associations - dilated
    cardiomyopathy, Brugada and early repolarization syndromes, and idiopathic
    ventricular fibrillation - reported in adults with no intellectual
    disability, no myopathy and no white matter disease. These share both the
    gene and the direction of effect with AIMS, which makes them the subtlest
    confusion in the ABCC9 literature: a paper titled "loss-of-function ABCC9
    variant" may be describing a heterozygous adult arrhythmia case, not AIMS.
    Zygosity is the discriminator. AIMS carriers in the published families have
    no conserved clinical pathology.
  distinguishing_features:
  - Monoallelic (heterozygous) ABCC9 loss of function, versus the biallelic state required for AIMS
  - Isolated cardiac presentation in adults - arrhythmia or cardiomyopathy - without intellectual disability, myopathy or white matter disease
  - AIMS heterozygous parents show no conserved clinical pathology, so these associations are not simply the AIMS carrier state
  - Some of the reported alleles sit in the SUR2A-specific exon, a cardiac-restricted isoform region
  notes: >-
    Deliberately left unbound. There is no single MONDO term for "heterozygous
    ABCC9 loss-of-function cardiac phenotype": the reported associations span
    dilated cardiomyopathy, Brugada syndrome, early repolarization syndrome and
    idiopathic ventricular fibrillation, and binding any one of those general
    disease terms would misrepresent the group and would also bind a term whose
    gene attribution is not ABCC9-specific. The dismech entries
    Dilated_Cardiomyopathy and Familial_Atrial_Fibrillation already carry the
    ABCC9 heterozygous-cardiac material in their own gene sections; this
    differential exists to keep that literature out of the AIMS phenotype set,
    not to duplicate it.
  evidence:
  - reference: PMID:35495129
    reference_title: "Case Report: Loss-of-Function ABCC9 Genetic Variant Associated With Ventricular Fibrillation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The loss-of-function mutations in the ABCC9 gene were associated with the Brugada syndrome, early repolarization syndrome, and dilated cardiomyopathy."
    explanation: Enumerates the cardiac phenotypes attributed to ABCC9 loss of function outside the AIMS recessive syndrome.
  - reference: PMID:35495129
    reference_title: "Case Report: Loss-of-Function ABCC9 Genetic Variant Associated With Ventricular Fibrillation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The female proband presented with several episodes of ventricular fibrillation and hypokalemia upon emotional stress."
    explanation: An isolated adult cardiac presentation with no neurodevelopmental or myopathic features.
  - reference: PMID:38217872
    reference_title: Novel loss-of-function variants expand ABCC9-related intellectual disability and myopathy syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Heterozygous parents do not show any conserved clinical pathology but report multiple incidences of intra-uterine fetal death, which were also observed in an eighth family included in this study."
    explanation: Establishes that the AIMS carrier state is not itself a recognisable clinical phenotype.
- name: Periventricular leukomalacia of perinatal hypoxic-ischaemic origin
  description: >-
    The most recent AIMS cohort describes its white matter abnormalities as
    resembling periventricular leukomalacia, making acquired perinatal injury
    an important radiological differential. AIMS is distinguished by its
    biallelic ABCC9 loss-of-function cause and accompanying myopathic phenotype;
    pregnancy and birth were uneventful in a documented index patient.
  distinguishing_features:
  - Acquired perinatal insult typically has a relevant perinatal history, whereas a documented AIMS index patient had an uneventful pregnancy and birth
  - Acquired perinatal leukomalacia is non-progressive, whereas serial MRI documented progression of AIMS white matter lesions in an index patient
  - No accompanying fatigable myopathy with painful post-exercise spasms
  - No familial recurrence pattern; AIMS is recessive with affected siblings
  - No late systolic cardiac dysfunction
  notes: >-
    Deliberately left unbound. The confusable entity here is an acquired
    perinatal aetiology rather than a nosological disease with a defensible
    MONDO term: HP:0006970 (Periventricular leukomalacia) is the appropriate
    ontology binding and is already used above as an AIMS phenotype, and binding
    a broad cerebral palsy MONDO term would assert a specific alternative
    diagnosis that the AIMS literature does not name. The distinguishing
    features are recorded instead.
  evidence:
  - reference: PMID:42290677
    reference_title: "Cognitive Decline, Neurologic Involvement, and Neonatal Crisis in ABCC9-Related Intellectual Disability and Myopathy Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These new cases further demonstrate the prominence of white matter abnormalities resembling periventricular leukomalacia or small vessel disease as a key hallmark of the disorder, alongside developmental delay, intellectual impairment, seizures, and fatigability."
    explanation: >-
      The AIMS authors themselves describe the imaging as resembling
      periventricular leukomalacia, which is what makes the acquired form the
      operative differential.
  - reference: PMID:31575858
    reference_title: ABCC9-related Intellectual disability Myopathy Syndrome is a K(ATP) channelopathy with loss-of-function mutations in ABCC9.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pregnancy and birth were uneventful."
    explanation: >-
      Documents the absence of an acquired perinatal explanation in an index
      patient with the genetic syndrome.
  - reference: PMID:31575858
    reference_title: ABCC9-related Intellectual disability Myopathy Syndrome is a K(ATP) channelopathy with loss-of-function mutations in ABCC9.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Lesions have increased signiﬁcantly since the ﬁrst investigation."
    explanation: >-
      Documents progression on serial imaging, distinguishing the AIMS pattern
      from a static acquired perinatal lesion.
- name: Tuberous sclerosis
  description: >-
    A documented misdiagnosis in AIMS, not a hypothetical one. One index
    patient was worked up for tuberous sclerosis on the basis of periventricular
    white matter change together with depigmented skin patches, and the
    diagnosis was later abandoned. The combination of white matter lesions,
    developmental delay, seizures and hypopigmented macules is genuinely
    TSC-like on a first pass.
  distinguishing_features:
  - Caused by TSC1 or TSC2, not ABCC9
  - Autosomal dominant with frequent de novo variants, not autosomal recessive
  - Cortical tubers, subependymal nodules and subependymal giant cell astrocytoma on MRI, a different lesion pattern from confluent periventricular white matter change
  - Renal angiomyolipoma, cardiac rhabdomyoma, facial angiofibroma and retinal hamartoma have no AIMS counterpart
  - Fatigable myopathy with painful exercise-induced spasms is an AIMS feature, not a TSC feature
  disease_term:
    preferred_term: tuberous sclerosis
    term:
      id: MONDO:0001734
      label: tuberous sclerosis
  notes: >-
    MONDO:0001734 is the current non-obsolete term (MONDO:0019341 "tuberous
    sclerosis complex" is obsolete and must not be used). It is not an ancestor
    of MONDO:0859224.
  evidence:
  - reference: PMID:31575858
    reference_title: ABCC9-related Intellectual disability Myopathy Syndrome is a K(ATP) channelopathy with loss-of-function mutations in ABCC9.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "showed periventricular white matter changes, and a diagnosis of tuberous sclerosis was considered"
    explanation: >-
      Records tuberous sclerosis as an actual competing diagnosis entertained on
      the childhood brain MRI of an AIMS patient.
- name: Mitochondrial disease
  description: >-
    Mitochondrial disease is an important alternative for the combination of
    myopathy, exercise intolerance and cerebral white matter change. In several
    index patients, mitochondrial DNA sequence/deletion testing and screening
    for inborn errors of metabolism were among investigations reported as
    normal before ABCC9 was identified.
  distinguishing_features:
  - Caused by biallelic nuclear ABCC9 variants, not by mtDNA or nuclear-encoded mitochondrial gene defects
  - Normal mitochondrial DNA sequencing and deletion screening in the AIMS index families
  - Baseline serum lactate, creatine kinase, nerve conduction and electromyography were normal in the index cohort
  - Strictly autosomal recessive, without the maternal transmission or heteroplasmy-dependent variability of mtDNA disease
  disease_term:
    preferred_term: mitochondrial disease
    term:
      id: MONDO:0044970
      label: mitochondrial disease
  notes: >-
    Bound at the broad grouping level deliberately. The competing clinical
    consideration in the published AIMS families was "mitochondrial disease" as
    a category rather than any one named mitochondrial disorder, and binding a
    specific entity would assert a differential the literature does not name.
    MONDO:0044970 is not obsolete and is not an ancestor of MONDO:0859224.
  evidence:
  - reference: PMID:31575858
    reference_title: ABCC9-related Intellectual disability Myopathy Syndrome is a K(ATP) channelopathy with loss-of-function mutations in ABCC9.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "S-CK, B-lactate, nerve conduction velocities, and electromyography, including repetitive nerve stimulation, are normal in all individuals"
    explanation: >-
      The normal baseline lactate and creatine kinase are the practical
      discriminators against a primary mitochondrial myopathy.
  - reference: PMID:31575858
    reference_title: ABCC9-related Intellectual disability Myopathy Syndrome is a K(ATP) channelopathy with loss-of-function mutations in ABCC9.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "described as similar to leucodystrophy"
    explanation: >-
      The imaging in one index patient was read as leukodystrophy-like, which
      is the same white-matter route by which mitochondrial and leukodystrophic
      diagnoses are reached before AIMS is considered.
  - reference: PMID:31575858
    reference_title: ABCC9-related Intellectual disability Myopathy Syndrome is a K(ATP) channelopathy with loss-of-function mutations in ABCC9.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "performed with normal results in several of the patients"
    explanation: Establishes that the extensive pre-exome investigations were normal in several index patients.
  - reference: PMID:31575858
    reference_title: ABCC9-related Intellectual disability Myopathy Syndrome is a K(ATP) channelopathy with loss-of-function mutations in ABCC9.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "screening for mitochondrial DNA sequence variants/deletions, and screening for inborn errors of metabolism."
    explanation: Identifies mitochondrial DNA and metabolic testing among those normal investigations.

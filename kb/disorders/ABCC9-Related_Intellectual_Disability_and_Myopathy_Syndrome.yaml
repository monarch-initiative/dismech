  - reference: PMID:31575858
    reference_title: ABCC9-related Intellectual disability Myopathy Syndrome is a K(ATP) channelopathy with loss-of-function mutations in ABCC9.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cardiac systolic dysfunction is found in the two oldest patients."

    reference_title: Novel loss-of-function variants expand ABCC9-related intellectual disability and myopathy syndrome.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Affected individuals show psychomotor delay and intellectual disability of variable severity, microcephaly, corpus callosum and white matter abnormalities, seizures, spasticity, short stature, muscle fatigability and weakness."

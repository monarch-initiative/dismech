name: ABCC9-Related Intellectual Disability and Myopathy Syndrome
creation_date: '2026-08-01T00:00:00Z'
category: Mendelian
synonyms:
- AIMS
- ABCC9-related Intellectual disability Myopathy Syndrome
- intellectual developmental disorder and myopathy syndrome
- IDMYS
- SUR2 loss-of-function channelopathy
description: >-
  ABCC9-related Intellectual disability Myopathy Syndrome (AIMS) is a rare
  autosomal recessive ATP-sensitive potassium (KATP) channelopathy caused by
  biallelic loss-of-function variants in ABCC9, the gene encoding the
  sulfonylurea receptor 2 (SUR2) regulatory subunit. Reported individuals have
  psychomotor delay with intellectual disability of variable severity, muscle
  weakness and fatigability with painful spasms, and cerebral white matter
  abnormalities that radiologically resemble periventricular leukomalacia or
  small vessel disease. Seizures, spasticity, hyperreflexia, microcephaly,
  short stature, corpus callosum abnormalities and anxiety occur in a
  proportion of patients, and cardiac systolic dysfunction has been documented
  in older individuals. AIMS is the loss-of-function pole of ABCC9 disease and
  is mechanistically opposite to Cantu syndrome, which arises from
  gain-of-function variants in the same gene.
disease_term:
  preferred_term: ABCC9-related intellectual disability and myopathy syndrome
  term:
    id: MONDO:0859224
    label: intellectual disability and myopathy syndrome
parents:
- Channelopathy
- Neurodevelopmental Disorder
classifications:
  channelopathy_category:
    classification_value: skeletal muscle channelopathy
    notes: >-
      ChannelopathyOrganSystemEnum is single-valued in the schema and AIMS is
      a multi-organ KATP channelopathy (skeletal muscle, brain and heart). The
      skeletal-muscle value is chosen because tissue-selective suppression
      experiments localised the myopathy specifically to skeletal muscle
      (PMID:37154692), making it the one arm with a demonstrated cell-autonomous
      site of action. The neurological arm (white matter injury, intellectual
      disability, seizures) and the cardiac arm are modeled instead as separate
      pathophysiology nodes.
    evidence:
    - reference: PMID:37154692
      reference_title: Skeletal muscle delimited myopathy and verapamil toxicity in SUR2 mutant mouse models of AIMS.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Given the roles of KATP channels in all muscles, we sought to determine how myopathy arises using tissue-selective suppression of KATP and found that LoF in skeletal muscle, specifically, underlies myopathy."
      explanation: Tissue-selective suppression localises the myopathic arm of AIMS to skeletal muscle.
  harrisons_chapter:
  - classification_value: NEUROLOGIC
    evidence:
    - reference: PMID:42290677
      reference_title: "Cognitive Decline, Neurologic Involvement, and Neonatal Crisis in ABCC9-Related Intellectual Disability and Myopathy Syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This new cohort underscores that AIMS is characterized by the combination of periventricular leukomalacia, developmental delay and intellectual disability, and muscle weakness and fatigability - and is driven by biallelic loss-of-function variants in ABCC9."
      explanation: >-
        The defining triad is neurological (white matter disease, developmental
        delay/intellectual disability) plus neuromuscular, placing the disorder
        in the neurologic chapter.
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    evidence:
    - reference: PMID:38217872
      reference_title: Novel loss-of-function variants expand ABCC9-related intellectual disability and myopathy syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Loss-of-function mutation of ABCC9, the gene encoding the SUR2 subunit of ATP sensitive-potassium (KATP) channels, was recently associated with autosomal recessive ABCC9-related intellectual disability and myopathy syndrome (AIMS)."
      explanation: A single-gene autosomal recessive disorder diagnosed by sequencing belongs to the genetics chapter.
notes: >-
  Scope, named-entity and provenance notes for this entry.

  (1) Named-entity confusion is the central curation risk here, and the
  discriminator is direction of effect, not gene identity. ABCC9 causes two
  mechanistically opposite diseases. Cantu syndrome (MONDO:0009406,
  hypertrichotic osteochondrodysplasia Cantu type) is autosomal dominant and
  caused by GAIN-of-function ABCC9 variants; AIMS is autosomal recessive and
  caused by LOSS-of-function variants. Cantu dominates the ABCC9 literature by
  volume, so every citation used in this entry was checked to confirm the
  reported variants are loss-of-function and, where the paper reports patients,
  that the patients are biallelic. Papers that say only "ABCC9 variant" without
  stating direction of effect were not used. Cantu-specific citations appear in
  this entry only inside the Cantu differential-diagnosis entry and in the
  contrast sentences of AIMS papers themselves, and are labelled as such.

  (2) ABCC8 versus ABCC9. ABCC8 (SUR1) is one character away from ABCC9 (SUR2)
  and is the other sulfonylurea-receptor KATP subunit. ABCC8 loss of function
  causes congenital hyperinsulinism and ABCC8 gain of function causes neonatal
  diabetes and DEND syndrome; none of these is an ABCC9 disorder. Both are
  curated here as bound differentials so the distinction is machine-readable.
  No snippet in this entry that is attributed to ABCC9 comes from an
  ABCC8-only paper.

  (3) No GeneReviews chapter exists for AIMS. PubMed searches on 2026-08-01 for
  "ABCC9 GeneReviews[All Fields]", "\"intellectual disability and myopathy
  syndrome\"[TI] AND GeneReviews[All Fields]" and "GeneReviews[TI] AND (SUR2 OR
  AIMS)" returned no AIMS chapter; the only GeneReviews chapter returned by the
  ABCC9 search is Cantu Syndrome (PMID:25275207), which is the gain-of-function
  disease and is therefore cited here only as the differential baseline, never
  as the AIMS phenotype baseline. The AIMS phenotype baseline used instead is
  the union of the three primary human cohorts: PMID:31575858 (6 patients,
  2 families), PMID:38217872 (9 patients, 7 families) and PMID:42290677
  (5 patients). Cantu's GeneReviews "Agents/circumstances to avoid" list
  (minoxidil, diazoxide, ACE inhibitors) is a Cantu recommendation and is
  deliberately NOT transferred to AIMS - those are KATP openers whose rationale
  is the opposite direction of effect.

  (4) Phenotype frequency bands are derived only where a published denominator
  exists and the derivation is recorded on each phenotype. The three cohorts
  above give 20 reported patients in total, but they do not report a uniform
  feature-by-feature table, so bands are given only for features that a paper
  explicitly quantifies over its own cohort ("all patients", "all but one",
  "the two oldest patients", "the oldest four"). Where a feature is listed in a
  narrative series without a denominator (for example anxiety, hearing loss,
  dementia), the frequency slot is omitted rather than guessed.

  (5) Heterozygous ABCC9 loss-of-function is a separate question from AIMS and
  is not curated as an AIMS phenotype. Heterozygous carriers in the AIMS
  families "do not show any conserved clinical pathology" (PMID:38217872), and
  the separately reported heterozygous ABCC9 loss-of-function cardiac
  associations (dilated cardiomyopathy, Brugada/early repolarization syndrome,
  ventricular fibrillation) are recorded here as differentials rather than as
  features of the recessive syndrome. Two existing KB entries
  (Dilated_Cardiomyopathy, Familial_Atrial_Fibrillation) already mention ABCC9
  in that heterozygous-cardiac context; neither is an ABCC9-specific entry and
  there is no Cantu syndrome entry in the KB to cross-reference, so the Cantu
  differential below carries its own bound MONDO term instead.

  (6) The excess of intra-uterine fetal death reported in AIMS families
  (PMID:38217872) is recorded as a reproductive observation in the genetic
  section rather than as a patient phenotype, because the paper reports it in
  heterozygous parents and does not establish the fetal genotypes.

  (7) No ORPHA, ClinGen (CGGV) or ClinGen Dosage (CGDS) structured-source
  citation is used in this entry. Both structured-source pins are stale and
  un-refreshable (tracked in GitHub issue 7622), and bumping data/*/MANIFEST.yaml is
  out of scope for a curation PR, so any row that would have needed a manifest
  refresh was skipped rather than cited from a stale snapshot. The deep-research
  run additionally reports that no Orphanet code exists for AIMS at all, so no
  ORPHA prevalence class would have been citable even with a fresh pin.

  (8) Provenance. Deep research was run with the claude_code provider; the
  report is at
  research/ABCC9-Related_Intellectual_Disability_and_Myopathy_Syndrome-deep-research-claude_code.md.
  A substantial part of that report is flagged by its own author as
  "[FULL-TEXT - RE-VERIFY]" because it came through a summarising intermediary
  rather than a cached abstract. None of those flagged claims are asserted here
  as evidence. Specifically NOT curated for that reason: the full published
  allelic series (per-family variant tables for the 2024 and 2026 cohorts); the
  pooled per-feature frequency table attributed to the 2024 paper; the
  phenytoin/fosphenytoin, propofol and lacosamide drug hazards; the
  perioperative decompensation detail; and the reported death of the oldest
  patient. PMID:38217872 and PMID:42290677 are cached abstract-only, so those
  full-text details cannot be quoted verbatim from the cache. The verapamil /
  calcium-channel-blocker hazard IS curated because it is stated in the
  PMID:37154692 abstract and verifies byte-exact.

  (9) A KATP-opener therapy (diazoxide, pinacidil, minoxidil, nicorandil) is
  deliberately NOT listed as a candidate treatment, despite being the inviting
  inference from "loss of KATP function". The recombinant data show the disease
  alleles produce channels with no measurable current at all, so there is no
  channel left for an opener to open. No published source proposes this in
  AIMS, so recording it as a treatment would be curator inference rather than
  evidence.
inheritance:
- name: Autosomal recessive
  description: >-
    AIMS requires biallelic ABCC9 loss-of-function alleles. Reported families
    include homozygotes for a splice-site allele and homozygotes for truncating
    alleles; heterozygous parents are clinically unaffected.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:38217872
    reference_title: Novel loss-of-function variants expand ABCC9-related intellectual disability and myopathy syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Loss-of-function mutation of ABCC9, the gene encoding the SUR2 subunit of ATP sensitive-potassium (KATP) channels, was recently associated with autosomal recessive ABCC9-related intellectual disability and myopathy syndrome (AIMS)."
    explanation: States the autosomal recessive mode of inheritance for AIMS explicitly.
  - reference: PMID:38217872
    reference_title: Novel loss-of-function variants expand ABCC9-related intellectual disability and myopathy syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Heterozygous parents do not show any conserved clinical pathology but report multiple incidences of intra-uterine fetal death, which were also observed in an eighth family included in this study."
    explanation: Confirms that single-allele carriers are clinically unaffected, consistent with recessive transmission.
  - reference: PMID:31575858
    reference_title: ABCC9-related Intellectual disability Myopathy Syndrome is a K(ATP) channelopathy with loss-of-function mutations in ABCC9.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients are homozygous for a splice-site mutation in ABCC9 (c.1320 + 1 G > A), which encodes the sulfonylurea receptor 2 (SUR2) subunit of KATP channels."
    explanation: The index families are homozygous for a single ABCC9 allele, the classic recessive configuration.
prevalence:
- population: Worldwide, published cases
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Derivation from published denominators only; no population-based rate has
    ever been reported for AIMS, so no rate_per_100000 is recorded. The
    published series are: PMID:31575858 (2019) six patients from two
    non-consanguineous Northern Norwegian families; PMID:38217872 (2024) nine
    additional subjects from seven unrelated families, plus an eighth family
    ascertained only through intra-uterine fetal deaths; PMID:42290677 (2026)
    five further cases. Summing the genotyped, clinically described patients
    across the three series gives 20, which supports the qualitative
    ULTRA_RARE tier and nothing more precise.
  evidence:
  - reference: PMID:31575858
    reference_title: ABCC9-related Intellectual disability Myopathy Syndrome is a K(ATP) channelopathy with loss-of-function mutations in ABCC9.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report a syndrome in six patients from two families with a consistent phenotype of mild intellectual disability, similar facies, myopathy, and cerebral white matter hyperintensities, with cardiac systolic dysfunction present in the two oldest patients."
    explanation: Provides the first published denominator, six patients from two families.
  - reference: PMID:38217872
    reference_title: Novel loss-of-function variants expand ABCC9-related intellectual disability and myopathy syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we identify nine additional subjects, from seven unrelated families, harbouring different homozygous loss-of-function variants in ABCC9 and presenting with a conserved range of clinical features."
    explanation: Adds nine patients from seven families to the published denominator.
  - reference: PMID:42290677
    reference_title: "Cognitive Decline, Neurologic Involvement, and Neonatal Crisis in ABCC9-Related Intellectual Disability and Myopathy Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report 5 cases of AIMS, including a neonate, and a woman who presented as a sexagenarian with signs of dementia."
    explanation: Adds five further published cases.
- population: Finnish and Northern Norwegian populations
  measure_type: UNKNOWN
  prevalence_class: UNKNOWN
  notes: >-
    Not a rate. The index families came from the same area of Northern Norway
    with probable Finnish ancestry and were homozygous for the same
    c.1320+1G>A allele, and the original authors suggested on that basis that
    the syndrome may be more prevalent in Finns. No prevalence, incidence or
    carrier-screening study has ever been performed in any population, so no
    band and no rate is recorded here; the record exists only to capture the
    documented founder signal rather than to assert an occurrence estimate.
  evidence:
  - reference: PMID:31575858
    reference_title: ABCC9-related Intellectual disability Myopathy Syndrome is a K(ATP) channelopathy with loss-of-function mutations in ABCC9.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Considering the probable Finnish ancestry of all patients, the syndrome might be more prevalent in the Finnish population than others."
    explanation: >-
      Marked PARTIAL because the authors state this as a possibility inferred
      from shared ancestry and allele frequency, not as a measured prevalence.
pathophysiology:
- name: Biallelic ABCC9 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic loss-of-function variants in ABCC9 - splice-site alleles causing
    in-frame exon skipping, and nonsense or frameshift alleles causing
    nonsense-mediated decay or drastic truncation - abolish production of
    functional SUR2 protein. This is the root lesion of AIMS and is the
    opposite direction of effect to the gain-of-function ABCC9 variants that
    cause Cantu syndrome.
  genes:
  - preferred_term: ABCC9
    term:
      id: hgnc:60
      label: ABCC9
    modifier: DECREASED
  evidence:
  - reference: PMID:31575858
    reference_title: ABCC9-related Intellectual disability Myopathy Syndrome is a K(ATP) channelopathy with loss-of-function mutations in ABCC9.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients are homozygous for a splice-site mutation in ABCC9 (c.1320 + 1 G > A), which encodes the sulfonylurea receptor 2 (SUR2) subunit of KATP channels."
    explanation: Identifies the founding biallelic ABCC9 lesion.
  - reference: PMID:38217872
    reference_title: Novel loss-of-function variants expand ABCC9-related intellectual disability and myopathy syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All variants are predicted to result in severe truncations or in-frame deletions within SUR2, leading to the generation of non-functional SUR2-dependent KATP channels."
    explanation: Establishes the truncating/in-frame-deletion allele class across seven further families.
  - reference: PMID:42290677
    reference_title: "Cognitive Decline, Neurologic Involvement, and Neonatal Crisis in ABCC9-Related Intellectual Disability and Myopathy Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All variants are predicted to lead to nonsense mediated decay of ABCC9 transcripts and/or drastic truncation of SUR2."
    explanation: Confirms nonsense-mediated decay and truncation as the mechanism of allele inactivation in the most recent cohort.
  - reference: PMID:31575858
    reference_title: ABCC9-related Intellectual disability Myopathy Syndrome is a K(ATP) channelopathy with loss-of-function mutations in ABCC9.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The phenotype differs from Cantú syndrome, which is caused by gain-of-function ABCC9 mutations, reflecting the opposing consequences of KATP loss- versus gain-of-function."
    explanation: >-
      Anchors the direction of effect that separates AIMS from the other ABCC9
      disease, Cantu syndrome.
  downstream:
  - target: Non-Functional SUR2-Containing KATP Channels
    description: Absence of functional SUR2 protein prevents assembly of working SUR2-containing KATP channels.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:31575858
      reference_title: ABCC9-related Intellectual disability Myopathy Syndrome is a K(ATP) channelopathy with loss-of-function mutations in ABCC9.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "This mutation results in an in-frame deletion of exon 8, which results in non-functional KATP channels in recombinant assays."
      explanation: Recombinant reconstitution shows the patient allele yields non-functional channels.
    - reference: PMID:42290677
      reference_title: "Cognitive Decline, Neurologic Involvement, and Neonatal Crisis in ABCC9-Related Intellectual Disability and Myopathy Syndrome."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Functional tests of recombinant channels confirm that disease-associated SUR2 truncations cause a complete loss-of-function."
      explanation: Independent recombinant testing of newer alleles confirms complete loss of channel function.
- name: Non-Functional SUR2-Containing KATP Channels
  biological_scale: MOLECULAR
  description: >-
    SUR2 is the regulatory subunit that confers ATP/ADP sensitivity and
    trafficking competence on Kir6.x pore subunits in skeletal muscle, cardiac
    muscle and vascular smooth muscle. Without functional SUR2, the
    SUR2-containing KATP channels of those tissues are absent or non-conducting,
    so cellular metabolic state can no longer be translated into membrane
    potassium conductance.
  genes:
  - preferred_term: ABCC9
    term:
      id: hgnc:60
      label: ABCC9
    modifier: DECREASED
  molecular_functions:
  - preferred_term: ATP-activated inward rectifier potassium channel activity
    term:
      id: GO:0015272
      label: ATP-activated inward rectifier potassium channel activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: potassium ion transmembrane transport
    term:
      id: GO:0071805
      label: potassium ion transmembrane transport
    modifier: DECREASED
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  - preferred_term: vascular associated smooth muscle cell
    term:
      id: CL:0000359
      label: vascular associated smooth muscle cell
  evidence:
  - reference: PMID:31575858
    reference_title: ABCC9-related Intellectual disability Myopathy Syndrome is a K(ATP) channelopathy with loss-of-function mutations in ABCC9.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We term this channelopathy resulting from loss-of-function of SUR2-containing KATP channels ABCC9-related Intellectual disability Myopathy Syndrome (AIMS)."
    explanation: Names the loss of SUR2-containing KATP channel function as the defining lesion of the syndrome.
  - reference: PMID:37154692
    reference_title: Skeletal muscle delimited myopathy and verapamil toxicity in SUR2 mutant mouse models of AIMS.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "KATP channels are found throughout the cardiovascular system and skeletal muscle and couple cellular metabolism to excitability."
    explanation: >-
      States the tissue distribution and the metabolism-to-excitability coupling
      role that is lost when SUR2 is absent.
  downstream:
  - target: Loss of Sarcolemmal KATP Conductance in Skeletal Muscle
    description: >-
      Fast-twitch skeletal muscle depends on noncanonical Kir6.2/SUR2
      sarcolemmal KATP channels, so SUR2 loss removes essentially the whole
      sarcolemmal KATP conductance.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:42159583
      reference_title: Subunit composition of the KATP channels that modulate contractility of skeletal muscle during fatigue.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Under fatiguing conditions, isometric tetanic contraction experiments on murine extensor digitorum longus (EDL) revealed delayed loss of stimulated forces, and significant development of unstimulated forces, in muscles lacking Kir6.2 or SUR2 subunits, whereas loss of the SUR1 subunit did not impact muscle functionality."
      explanation: >-
        Subunit dissection shows that removing SUR2 (but not SUR1) abolishes the
        functionally relevant sarcolemmal KATP conductance of fast-twitch muscle.
    - reference: PMID:42159583
      reference_title: Subunit composition of the KATP channels that modulate contractility of skeletal muscle during fatigue.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "ATP-sensitive potassium (KATP) channels are among the most expressed ion channels in skeletal muscle sarcolemma."
      explanation: Establishes the sarcolemmal abundance of the channel that is lost.
  - target: Loss of Cardiomyocyte KATP Conductance
    description: SUR2A is the cardiac sulfonylurea receptor, so its loss removes cardiomyocyte KATP current.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:31575858
      reference_title: ABCC9-related Intellectual disability Myopathy Syndrome is a K(ATP) channelopathy with loss-of-function mutations in ABCC9.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "SUR2 loss-of-function causes fatigability and cardiac dysfunction in mice, and reduced activity, cardiac dysfunction and ventricular enlargement in zebrafish."
      explanation: >-
        Two independent animal models lacking functional SUR2 develop cardiac
        dysfunction, linking absent cardiomyocyte SUR2 to the cardiac arm.
  - target: Impaired Brain Vascular Smooth Muscle Differentiation and Neurovascular Coupling
    description: >-
      KCNJ8/ABCC9-containing KATP channels are required cell-autonomously for
      brain arterial and arteriolar smooth muscle differentiation, so their loss
      compromises cerebral vascular maturation.
    causal_link_type: DIRECT
    hypothesis_groups:
    - aims_cerebrovascular_white_matter
    evidence:
    - reference: PMID:35588738
      reference_title: KCNJ8/ABCC9-containing K-ATP channel modulates brain vascular smooth muscle development and neurovascular coupling.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We show that genetic/chemical inhibition or activation of KCNJ8/ABCC9-containing K-ATP channel function leads to brain-selective suppression or promotion of arterial/arteriolar vascular smooth muscle cell (VSMC) differentiation, respectively."
      explanation: >-
        Inhibition of the ABCC9-containing channel suppresses brain VSMC
        differentiation, the direction of effect relevant to AIMS.
  - target: Increased Seizure Susceptibility
    description: >-
      Loss of abcc9 lowers the threshold for chemically provoked seizure-like
      motor activity in vivo.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:38217872
      reference_title: Novel loss-of-function variants expand ABCC9-related intellectual disability and myopathy syndrome.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In vivo studies of abcc9 loss-of-function in zebrafish revealed an exacerbated motor response to pentylenetetrazole, a pro-convulsive drug, consistent with impaired neurodevelopment associated with an increased seizure susceptibility."
      explanation: >-
        Directly ties abcc9 loss of function to increased seizure susceptibility,
        though the neuronal intermediates are not identified.
- name: Loss of Sarcolemmal KATP Conductance in Skeletal Muscle
  biological_scale: CELLULAR
  description: >-
    In healthy skeletal muscle the sarcolemmal KATP channel is closed at rest
    and opens as intracellular ATP falls during metabolic stress or fatigue. In
    AIMS muscle this metabolically gated conductance is absent.
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  biological_processes:
  - preferred_term: response to muscle activity
    term:
      id: GO:0014850
      label: response to muscle activity
    modifier: ABNORMAL
  evidence:
  - reference: PMID:31575858
    reference_title: ABCC9-related Intellectual disability Myopathy Syndrome is a K(ATP) channelopathy with loss-of-function mutations in ABCC9.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In skeletal muscle, K ATP channels are typically closed at rest but open in response to metabolic stress or fatigue"
    explanation: >-
      States the normal metabolic gating of the sarcolemmal channel that AIMS
      abolishes. Quoted with the space that the cached PDF text carries between
      "K" and "ATP".
  downstream:
  - target: Failure of Membrane Potential Stabilization During Fatigue
    description: >-
      Without KATP opening, the fatiguing fibre cannot shorten its action
      potential or stabilise its resting membrane potential.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:31575858
      reference_title: ABCC9-related Intellectual disability Myopathy Syndrome is a K(ATP) channelopathy with loss-of-function mutations in ABCC9.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Channel activation results in action potential shortening and stabilization of the resting membrane potential during the development of fatigue"
      explanation: >-
        Describes the protective electrical adaptation that cannot occur once
        the channel is lost.

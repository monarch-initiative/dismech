review_notes: >-
  Duplicate preflight against current origin/main found no standalone
  kb/disorders entry, kb/groupings entry, or stub for MONDO:0006881 or orbital
  cellulitis. Live open-claim and open-PR checks before filing #16441 likewise
  found no Orbital_Cellulitis or MONDO:0006881 lock or PR. This entry scopes
  orbital cellulitis as postseptal bacterial orbital infection. Rhino-orbital
  fungal syndromes, including mucormycosis, use angioinvasive fungal mechanisms
  and antifungal-debridement management that should be curated separately.

  Deliberately lumped. Staphylococcus aureus, Streptococcus spp., historic
  Haemophilus influenzae, and anaerobic or Gram-negative adult and odontogenic
  pathogens are kept in one bacterial orbital-cellulitis entry because the
  literature treats them as alternate organisms in the same postseptal
  spread/abscess/compartment-syndrome skeleton.

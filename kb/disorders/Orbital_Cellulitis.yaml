diagnosis:
- name: Orbital CT or MRI
  description: >-
    Orbital computed tomography or magnetic resonance imaging localizes
    postseptal inflammation, subperiosteal or orbital abscess, spread from
    paranasal sinuses or other adjacent structures, intracranial extension, and
    complications requiring drainage.
  diagnosis_term:
    preferred_term: Diagnostic Imaging Testing
    term:
      id: NCIT:C16502
      label: Diagnostic Imaging Testing
  evidence:
  - reference: PMID:37417106
    reference_title: Bacterial orbital cellulitis - A review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Computed tomography (CT) and magnetic resonance imaging (MRI) are the main
      modalities to identify the extent, route of spread from adjacent
      structures, and poor response to intravenous antibiotics and to confirm the
      presence of complications.
    explanation: >-
      The review identifies CT and MRI as the main imaging tests for staging
      orbital infection, tracing its anatomic source, and confirming
      complications.
- name: CT abscess-size surgical risk assessment
  description: >-
    Computed tomography measurements of subperiosteal-abscess volume and linear
    dimensions help identify pediatric patients whose abscess is large enough to
    favor surgical drainage.
  diagnosis_term:
    preferred_term: Computed Tomography
    term:
      id: NCIT:C17204
      label: Computed Tomography
  evidence:
  - reference: PMID:21778515
    reference_title: Dimension of subperiosteal orbital abscess as an indication for surgical management in children.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Children presenting with significant or progressing ocular findings or
      failure to improve after 48 hours of medical therapy, together with an
      abscess volume of more than 0.5 mL, a length greater than 17 mm, and a
      width greater than 4.5 mm, should be strongly considered to have surgical
      drainage.
    explanation: >-
      The pediatric SPOA study provides CT-derived abscess thresholds that can
      favor drainage after ocular progression or failure of medical therapy.
- name: CRP, NLR, and abscess-volume surgical prediction
  description: >-
    Elevated C-reactive protein, leukocytosis, neutrophil-to-lymphocyte ratio,
    proptosis, and abscess volume are severity markers that help estimate the
    likelihood that a severe pediatric orbital infection will require surgery.
  evidence:
  - reference: PMID:35568061
    reference_title: Factors Associated with Surgery and Imaging Characteristics in Severe Orbital Infections.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      In the adjusted analysis, the risk of surgical intervention was associated
      with older age (age 9 to <14: aOR 3.9, 95% CI 2.3-6.6; and age 14 to ≤18
      years: aOR 7.0, 95% CI 3.4-14.1), elevated C-reactive protein >120 mg/L
      (aOR 2.8, 95% CI 1.3-5.9), elevated white blood cell count of 12-20
      000/μL (aOR 1.7, 95% CI 1.1-2.6), proptosis (aOR 2.6, 95% CI 1.7-4.0),
      and subperiosteal/orbital abscess (aOR 5.3, 95% CI 3.6-7.9).
    explanation: >-
      The 10-hospital cohort identifies inflammatory and orbital findings
      associated with surgery in severe pediatric orbital infections.
  - reference: PMID:40582701
    reference_title: "Management of subperiosteal orbital abscess in pediatric population: a comparative study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      NLR and radiological parameters, particularly proptosis and abscess
      volume, are valuable predictors of surgical intervention in children with
      SPOA.
    explanation: >-
      The comparative SPOA study supports combining NLR with CT-derived
      proptosis and abscess-volume measures when estimating surgical need.
biochemical:
- name: Elevated C-reactive protein
  presence: INCREASED
  biomarker_term:
    preferred_term: C-Reactive Protein
    term:
      id: NCIT:C60651
      label: C-Reactive Protein
  notes: >-
    CRP is not diagnostic for orbital cellulitis itself, but markedly elevated
    CRP can act as a risk marker for surgical intervention in severe pediatric
    orbital infections.
  evidence:
  - reference: PMID:35568061
    reference_title: Factors Associated with Surgery and Imaging Characteristics in Severe Orbital Infections.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      In children hospitalized with severe orbital infections, older age,
      elevated C-reactive protein, elevated white blood cell count, proptosis,
      and subperiosteal/orbital abscess were predictors of surgical
      intervention.
    explanation: >-
      The 10-hospital cohort found elevated C-reactive protein to be a
      predictor of surgical intervention.
treatments:
- name: Intravenous Broad-Spectrum Antibiotics
  description: >-
    Hospital admission with intravenous antibiotics is first-line therapy for
    orbital cellulitis, with empiric regimens chosen to cover Gram-positive,
    Gram-negative, and sometimes anaerobic organisms until cultures identify a
    narrower target.
  treatment_term:
    preferred_term: antibiotic therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
    therapeutic_agent:
    - preferred_term: vancomycin
      term:
        id: CHEBI:28001
        label: vancomycin
    - preferred_term: ceftriaxone
      term:
        id: CHEBI:29007
        label: ceftriaxone
    - preferred_term: clindamycin
      term:
        id: CHEBI:3745
        label: clindamycin
    - preferred_term: metronidazole
      term:
        id: CHEBI:6909
        label: metronidazole
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Postseptal Orbital Soft-Tissue Infection
    treatment_effect: INHIBITS
    description: >-
      Systemic antibiotics suppress bacterial replication in postseptal orbital
      soft tissues and adjacent infected sinuses.
  evidence:
  - reference: PMID:37417106
    reference_title: Bacterial orbital cellulitis - A review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      There has been a generally widely accepted practice of using a
      broad-spectrum antibiotic coverage for Gram-positive and Gram-negative
      organisms as the empirical first-line therapy at presentation, even before
      any culture sensitivity of the organisms is available.
    explanation: >-
      Review synthesis supports broad-spectrum empiric antibiotic therapy before
      culture sensitivities are available.
  - reference: PMID:39172646
    reference_title: Microbiology and Epidemiology of Orbital Cellulitis in Pediatric and Young Adult Patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Empiric antibiotic selection should include an anti-methicillin-resistant
      S. aureus agent combined with a broad-spectrum beta-lactam and anaerobic
      coverage.
    explanation: >-
      The Military Health System cohort supports combining anti-MRSA,
      broad-spectrum beta-lactam, and anaerobic empiric coverage in pediatric
      orbital cellulitis.
  - reference: PMID:35438766
    reference_title: Epidemiology and Management of Orbital Cellulitis in Children.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      On HD 0, ampicillin/sulbactam was the most commonly prescribed regimen
      (175/220, 79.5%), followed by clindamycin (33/220, 15.0%) and
      ceftriaxone/vancomycin/metronidazole (28/220, 12.7%).
    explanation: >-
      The 11-year pediatric cohort documents clindamycin use and the combined
      ceftriaxone, vancomycin, and metronidazole regimen among initial
      parenteral antibiotic choices for orbital cellulitis.
  - reference: PMID:35438766
    reference_title: Epidemiology and Management of Orbital Cellulitis in Children.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      In a large cohort of children with orbital cellulitis over an 11-year
      period, we found that nearly all (95.9%) experienced resolution of disease
      within 30 days of completing antibiotic therapy.
    explanation: >-
      A pediatric orbital-cellulitis cohort supports antibiotic therapy as the
      core treatment and found disease resolution in most treated patients.
- name: Adjunctive Systemic Corticosteroids
  description: >-
    Systemic corticosteroids have been tested as adjuncts after initial
    antibiotic response to reduce orbital inflammation, but systematic-review
    evidence remains conflicting and they are not standard first-line therapy.
  treatment_term:
    preferred_term: Systemic Corticosteroid Therapy
    term:
      id: NCIT:C122080
      label: Systemic Corticosteroid Therapy
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Orbital Compartment Syndrome
    treatment_effect: MODULATES
    description: >-
      Corticosteroids can reduce inflammatory edema after antibiotics have begun
      controlling the orbital infection, but may be harmful when they are used
      in confounded or fungal cases.
  evidence:
  - reference: PMID:23622565
    reference_title: Role of oral corticosteroids in orbital cellulitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Use of oral steroids as an adjunct to intravenous antibiotic therapy for
      orbital cellulitis may hasten resolution of inflammation with a low risk
      of exacerbating infection.
    explanation: >-
      The small randomized trial found faster inflammatory resolution when oral
      steroids were added after initial response to intravenous antibiotics.
  - reference: PMID:42088754
    reference_title: "Adjunctive systemic corticosteroids in pediatric orbital cellulitis: a systematic review and meta-analysis."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Adjunctive corticosteroids were not associated with shorter
      hospitalization and may be associated with increased risks of adverse
      outcomes.
    explanation: >-
      The later pediatric meta-analysis did not confirm a length-of-stay benefit
      and found higher adverse-outcome risks in the mostly observational
      evidence base.
- name: Abscess Drainage and Sinus Ventilation
  description: >-
    Drainage of orbital or subperiosteal pus and ventilation of infected sinuses
    are surgical options when imaging or the clinical course shows a large
    abscess, intracranial extension, visual compromise, or failure of initial
    antibiotics.
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  therapeutic_modality: SURGERY
  target_mechanisms:
  - target: Orbital Abscess Formation
    treatment_effect: INHIBITS
    description: >-
      Surgical drainage removes pus from a subperiosteal or orbital abscess and
      endoscopic sinus surgery re-establishes sinus drainage when sinusitis is
      the source.
  evidence:
  - reference: PMID:37417106
    reference_title: Bacterial orbital cellulitis - A review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The principles of surgical management are drainage of any pus and
      establishment of ventilation to the sinus.
    explanation: >-
      Review synthesis supports pus drainage and sinus ventilation as the
      surgical mechanisms used for complicated orbital cellulitis.
  - reference: PMID:29859573
    reference_title: "Management of pediatric orbital cellulitis: A systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Pre-septal and post-septal cellulitis can generally be managed
      non-surgically, while orbital abscess and cavernous sinus thrombosis are
      managed surgically.
    explanation: >-
      Systematic review supports reserving surgery for complicated cases,
      including orbital abscess.
  - reference: PMID:33390058
    reference_title: "Orbital cellulitis secondary to sinusitis in upstate New York: current incidence, seasonality, severity, management and outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Our findings suggest that cases requiring surgical management for SRC
      should undergo coinitial orbitotomy with FESS to reduce re-operation
      rates.
    explanation: >-
      The sinusitis-related orbital cellulitis cohort supports combined
      orbitotomy and functional endoscopic sinus surgery when surgery is
      required.

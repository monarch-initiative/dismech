- name: Haemophilus influenzae
  description: >-
    Haemophilus influenzae type b was a historically important pediatric
    pathogen in periorbital and orbital cellulitis before Hib vaccination
    sharply reduced H. influenzae-related cases.
  infectious_agent_term:
    preferred_term: Haemophilus influenzae
    term:
      id: NCBITaxon:727
      label: Haemophilus influenzae
  evidence:
  - reference: PMID:10919886
    reference_title: Periorbital and orbital cellulitis before and after the advent of Haemophilus influenzae type B vaccination.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Before 1990, there were 27 cases of Hib-related cellulitis (11.7% of
      total in that period), whereas after 1990, there were only three (3.5% of
      total; P = 0.028).
    explanation: >-
      The pre/post-Hib-vaccine pediatric series supports H. influenzae type b as
      a historical contributor to orbital and periorbital cellulitis.
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
transmission:
- name: Contiguous sinonasal spread
  description: >-
    Bacteria in adjacent paranasal sinuses, especially the ethmoid sinuses,
    extend through thin bony walls or valveless venous channels into the
    postseptal orbit.
  evidence:
  - reference: PMID:37417106
    reference_title: Bacterial orbital cellulitis - A review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      More than 90% of the cases of orbital cellulitis are sequela to paranasal
      sinusitis (specifically, ethmoid sinusitis).
    explanation: >-
      Review synthesis identifies paranasal, especially ethmoid, sinusitis as
      the dominant source for orbital cellulitis.
- name: Direct traumatic or procedural inoculation
  description: >-
    Trauma, retained orbital foreign bodies, and orbital, dental, maxillofacial,
    retinal, or lacrimal procedures can introduce bacteria into periocular
    tissues or adjacent spaces that then involve the postseptal orbit.
  evidence:
  - reference: PMID:37417106
    reference_title: Bacterial orbital cellulitis - A review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Other causes are trauma, orbital foreign bodies, preexisting dental
      infections, dental procedures, maxillofacial surgeries, Open Reduction and
      Internal Fixation (ORIF), and retinal buckling procedures.
    explanation: >-
      Review synthesis identifies direct injury, foreign bodies, and periocular
      procedures as non-sinus routes to orbital cellulitis.
- name: Odontogenic contiguous spread
  description: >-
    Dental infections can seed the maxillary sinus or adjacent tissues with oral
    flora, including anaerobes, before rapidly spreading into the orbit.
  evidence:
  - reference: PMID:37417106
    reference_title: Bacterial orbital cellulitis - A review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Orbital cellulitis resulting from infection of the maxillary sinus
      secondary to dental infections can be caused by microorganisms indigenous
      to the mouth, including anaerobes, commonly Bacteroides species.
    explanation: >-
      Review synthesis links odontogenic maxillary-sinus infection and oral
      anaerobes to orbital cellulitis.
pathophysiology:
- name: Sinonasal Bacterial Extension
  role: trigger
  biological_scale: TISSUE
  description: >-
    Upper-respiratory inflammation narrows the sinus ostia and allows resident
    upper-respiratory bacteria to proliferate, then cross ethmoid and other
    paranasal boundaries into the postseptal orbit.
  downstream:
  - target: Postseptal Orbital Soft-Tissue Infection
    causal_link_type: DIRECT
    description: >-
      Bacteria from the infected sinus enter the orbit through thin bones,
      dehiscences, or venous channels and seed orbital fat, extraocular muscle,
      or subperiosteal spaces.
    evidence:
    - reference: PMID:37417106
      reference_title: Bacterial orbital cellulitis - A review.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        These then gain access to the orbit through thin bones of the orbital
        walls, dehiscences, or venous channels.
      explanation: >-
        Review synthesis describes how proliferating sinus microorganisms reach
        the orbit.
- name: Postseptal Orbital Soft-Tissue Infection
  biological_scale: TISSUE
  description: >-
    Bacteria replicate behind the orbital septum and provoke inflammation in
    orbital fat, extraocular muscle, or subperiosteal tissues.
  downstream:
  - target: Orbital Abscess Formation
    causal_link_type: DIRECT
    description: >-
      Inflammatory necrosis can consolidate into a pus collection inside the
      tight orbital compartment.
    evidence:
    - reference: PMID:37417106
      reference_title: Bacterial orbital cellulitis - A review.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        The complex cell surface of Gram-positive organisms as well as their
        toxins and enzymes provoke an inflammatory response, leading to early
        and extensive tissue necrosis. The necrotic material either undergoes
        consolidation to form abscess or spreads intracranially depending on the
        virulence of the infecting agent and the host defense mechanism.
      explanation: >-
        Review synthesis links Gram-positive bacterial factors to destructive
        orbital inflammation and links necrotic material to abscess formation.
  - target: Periorbital Edema
    causal_link_type: DIRECT
    description: >-
      Postseptal inflammation causes diffuse periocular and lid edema.
  - target: Eyelid Erythema
    causal_link_type: DIRECT
    description: >-
      Acute orbital inflammation can erythematously involve the eyelids.
  - target: Fever
    causal_link_type: DIRECT
    description: >-
      Bacterial orbital infection can trigger a systemic febrile inflammatory
      response.
- name: Orbital Abscess Formation
  biological_scale: TISSUE
  description: >-
    Necrotic inflammatory material can consolidate as a subperiosteal or
    intraorbital abscess that further expands the orbital inflammatory mass.
  downstream:
  - target: Orbital Compartment Syndrome
    causal_link_type: DIRECT
    description: >-
      Abscess and edema increase orbital volume inside the tight bony orbit,
      producing raised intraorbital pressure.
    evidence:
    - reference: PMID:37417106
      reference_title: Bacterial orbital cellulitis - A review.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Owing to the tight compartments, the intraorbital pressure is raised,
        which augments the virulence of the infecting organism.
      explanation: >-
        Review synthesis links bacterial orbital spread within the tight orbital
        compartments to raised intraorbital pressure.
  - target: Cavernous Sinus Septic Thrombosis
    causal_link_type: DIRECT
    description: >-
      Postseptal infection can extend through the superior ophthalmic venous
      drainage into the cavernous sinus and cause septic cavernous-sinus
      thrombosis.
    evidence:
    - reference: PMID:37417106
      reference_title: Bacterial orbital cellulitis - A review.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Stage V: Cavernous sinus thrombosis (CST) resulting after the extension
        of the infection through the superior ophthalmic veins
      explanation: >-
        Chandler staging places cavernous-sinus thrombosis after orbital and
        subperiosteal abscess because infection can extend through superior
        ophthalmic veins.
- name: Orbital Compartment Syndrome
  biological_scale: TISSUE
  description: >-
    Raised pressure within the inextensible bony orbit displaces the globe,
    congests the conjunctiva and eyelids, restricts extraocular muscles, and
    compresses orbital neurovascular structures.
  downstream:
  - target: Proptosis
    causal_link_type: DIRECT
    description: >-
      Inflammatory volume expansion within the orbit pushes the globe forward.
  - target: Chemosis
    causal_link_type: DIRECT
    description: >-
      Orbital congestion and raised pressure produce conjunctival edema.
  - target: Ophthalmoplegia
    causal_link_type: DIRECT
    description: >-
      Edema and pressure impair extraocular muscle excursion.
  - target: Diplopia
    causal_link_type: DIRECT
    description: >-
      Restricted and misaligned ocular movement produces double vision.
  - target: Eye Movement-Induced Pain
    causal_link_type: DIRECT
    description: >-
      Inflamed postseptal tissues and extraocular muscles cause pain when the
      eye moves.
  - target: Optic Nerve and Vascular Compression
    causal_link_type: DIRECT
    description: >-
      Elevated pressure in the bony orbit compresses the optic nerve and its
      vascular supply.
    evidence:
    - reference: PMID:33908631
      reference_title: Corticosteroids for periorbital and orbital cellulitis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Complications occur in part due to inflammatory swelling from the
        infection creating a compartment syndrome within the bony orbit, leading
        to elevated ocular pressure and compression of vasculature and the optic
        nerve.
      explanation: >-
        The Cochrane review links orbital inflammatory swelling to bony-orbit
        compartment physiology and compression of the optic nerve and
        vasculature.
- name: Optic Nerve and Vascular Compression
  biological_scale: TISSUE
  description: >-
    Pressure-mediated optic-nerve compression, ischemic thrombophlebitis, or
    central retinal artery occlusion injures the optic pathway and can reduce or
    abolish vision.
  downstream:
  - target: Optic Neuropathy
    causal_link_type: DIRECT
    description: >-
      Compression, thrombophlebitis, or ischemia injure the optic nerve during
      complicated orbital infection.
    evidence:
    - reference: PMID:37417106
      reference_title: Bacterial orbital cellulitis - A review.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Mechanism of vision loss may involve reactive optic neuritis due to
        infection, ischemic thrombophlebitis, or compressive ischemia resulting
        in central retinal artery occlusion.
      explanation: >-
        Review synthesis identifies optic neuritis, thrombophlebitis, and
        compressive ischemia as routes from orbital infection to optic
        neuropathy.
  - target: Visual Loss
    causal_link_type: DIRECT
    description: >-
      Optic neuritis, vascular occlusion, and compressive ischemia can produce
      visual loss.
    evidence:
    - reference: PMID:37417106
      reference_title: Bacterial orbital cellulitis - A review.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Mechanism of vision loss may involve reactive optic neuritis due to
        infection, ischemic thrombophlebitis, or compressive ischemia resulting
        in central retinal artery occlusion.
      explanation: >-
        Review synthesis identifies optic neuritis, thrombophlebitis, and
        compressive ischemia as mechanisms of vision loss.
- name: Cavernous Sinus Septic Thrombosis
  biological_scale: TISSUE
  description: >-
    Orbital infection can spread posteriorly through ophthalmic veins into the
    cavernous sinus, causing septic thrombosis and enabling extension to the
    meninges or brain.
  downstream:
  - target: Meningitis
    causal_link_type: DIRECT
    description: >-
      Septic posterior spread can involve the meninges.
  - target: Brain Abscess
    causal_link_type: DIRECT
    description: >-
      Septic posterior spread can seed intracranial abscesses.
progression:
- phase: Acute postseptal cellulitis
  notes: >-
    Bacterial infection extends posterior to the orbital septum, causing
    orbital edema and inflammatory signs without a formed abscess.
  evidence:
  - reference: PMID:37417106
    reference_title: Bacterial orbital cellulitis - A review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Stage II: Orbital cellulitis with the extension of the inflammation and
      edema beyond the orbital septum
    explanation: >-
      Chandler staging distinguishes postseptal cellulitis as the orbital
      inflammation stage before abscess and cavernous-sinus extension.
- phase: Abscess or cavernous-sinus extension
  notes: >-
    Localized pus beneath the periosteum or within the orbit and later spread to
    the cavernous sinus represent advanced orbital cellulitis complications.
  evidence:
  - reference: PMID:37417106
    reference_title: Bacterial orbital cellulitis - A review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Stage III: Subperiosteal abscess (SPA) beneath the periosteum of lamina
      papyracea Stage IV: Orbital abscess within the intraconal space of orbit
      Stage V: Cavernous sinus thrombosis (CST) resulting after the extension of
      the infection through the superior ophthalmic veins
    explanation: >-
      Chandler staging places subperiosteal abscess, orbital abscess, and
      cavernous-sinus thrombosis after postseptal cellulitis.

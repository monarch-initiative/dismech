name: Orbital Cellulitis
creation_date: "2026-09-30T10:00:51Z"
description: >-
  Orbital cellulitis is a bacterial infection of the postseptal orbital soft
  tissues. It most often follows ethmoid or other paranasal sinusitis, whose
  bacteria can cross thin medial orbital walls or valveless venous channels and
  seed an acute orbital infection that causes chemosis, proptosis, painful
  ophthalmoplegia, subperiosteal or orbital abscess, and sight- or
  life-threatening intracranial complications.
category: Infectious Disease
disease_term:
  preferred_term: orbital cellulitis
  term:
    id: MONDO:0006881
    label: orbital cellulitis
synonyms:
- Postseptal cellulitis
- Retroseptal cellulitis
parents:
- Cellulitis
- Bacterial infectious disease
infectious_agent:
- name: Staphylococcus aureus
  description: >-
    Staphylococcus aureus is a leading Gram-positive pathogen isolated from
    pediatric orbital-cellulitis cultures.
  infectious_agent_term:
    preferred_term: Staphylococcus aureus
    term:
      id: NCBITaxon:1280
      label: Staphylococcus aureus
  evidence:
  - reference: PMID:31311311
    reference_title: Microbiology of Pediatric Orbital Cellulitis and Trends in Methicillin-Resistant Staphylococcus aureus Cases.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Staphylococcus aureus was the most common pathogen isolated (n = 19),
      followed by Streptococcus species, most commonly Streptococcus anginosus
      (n = 8).
    explanation: >-
      Culture-positive pediatric cases identified S. aureus and Streptococcus as
      the two leading bacterial groups in orbital cellulitis.
- name: Streptococcus
  description: >-
    Streptococcal species, including the Streptococcus anginosus group, are
    common sinonasal and orbital pathogens in pediatric orbital cellulitis.
  infectious_agent_term:
    preferred_term: Streptococcus
    term:
      id: NCBITaxon:1301
      label: Streptococcus
  evidence:
  - reference: PMID:31311311
    reference_title: Microbiology of Pediatric Orbital Cellulitis and Trends in Methicillin-Resistant Staphylococcus aureus Cases.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-

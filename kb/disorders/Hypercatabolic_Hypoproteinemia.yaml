name: Hypercatabolic Hypoproteinemia
creation_date: "2026-08-23T21:45:00Z"
category: Mendelian
disease_term:
  preferred_term: hypercatabolic hypoproteinemia
  term:
    id: MONDO:0009434
    label: hypoproteinemia, hypercatabolic
description: >-
  A recessive disorder in which serum albumin and IgG are low not because too little is
  made but because too much is destroyed. Biallelic loss of function at B2M removes
  beta-2-microglobulin, the invariant light chain shared by every member of the MHC class
  I fold - and one of those members is FcRn, the receptor that rescues albumin and IgG
  from lysosomal degradation and returns them to the circulation.

  The entity is worth curating in its own right because the same single lesion produces
  two clinically separate diseases that were discovered twenty-five years apart. The
  hypercatabolic arm was defined first, by protein-turnover studies in two siblings whose
  IgG synthetic rates were normal while their fractional catabolic rates were five times
  normal, with proteinuria and gastrointestinal protein loss both formally excluded. The
  immunological arm - absent classical MHC class I and absent CD1a/b/c, with the CD8
  compartment and NK licensing that depend on them - was characterised only in 2015, in a
  second consanguineous family. Neither arm is a complication of the other; they are
  parallel consequences of one missing light chain.

  It is also the human loss-of-function experiment behind a drug class. FcRn blockade is
  now a deliberate therapeutic strategy for lowering pathogenic IgG in autoimmune disease,
  and this disease is what the pharmacology reproduces.
parents:
- Primary Immunodeficiency
- MHC Class I Deficiency

classifications:
  iuis_category:
    classification_value: combined immunodeficiency
    notes: >-
      The IUIS 2022 phenotypic classification lists B2M under MHC class I deficiency,
      alongside the TAP1/TAP2/TAPBP defects, in the combined-immunodeficiency tables.
      The quoted row comes from the classification tables in the cached full text rather
      than from the abstract.
    evidence:
    - reference: PMID:35748970
      reference_title: "Human Inborn Errors of Immunity: 2022 Update on the Classification from the International Union of Immunological Societies Expert Committee."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "MHC class I deficiency B2M AR 109700"
      explanation: >-
        The IUIS table row assigning B2M, autosomal recessive, to MHC class I deficiency.

pathophysiology:

- name: Biallelic B2M Loss-of-Function Variant
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    Both described families are consanguineous and the variants are homozygous. In the
    family that defined the disease the lesion is a single nucleotide transversion
    replacing a conserved alanine with proline in the middle of the beta-2-microglobulin
    signal sequence - that is, it does not alter the mature protein at all, it prevents
    the protein from being made properly in the first place.

    The signal-peptide position matters for how the entry is read downstream. This is not
    an allele that produces a subtly altered beta-2-microglobulin which then fails to bind
    one particular heavy chain; it lowers the supply of the light chain itself, which is
    why every heterodimer that needs it is affected together.
  evidence:
  - reference: PMID:16549777
    reference_title: "Familial hypercatabolic hypoproteinemia caused by deficiency of the neonatal Fc receptor, FcRn, due to a mutant beta2-microglobulin gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the beta(2)m genes contained a single nucleotide transversion that would mutate a
      conserved alanine to proline at the midpoint of the signal sequence
    explanation: The molecular lesion, and its position in the signal sequence rather than the mature protein.
  - reference: PMID:16549777
    reference_title: "Familial hypercatabolic hypoproteinemia caused by deficiency of the neonatal Fc receptor, FcRn, due to a mutant beta2-microglobulin gene."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Transfection assays of beta(2)m-deficient cultured cells with beta(2)m cDNA indicated
      that the mutant beta(2)m supported <20% of normal expression of beta(2)m, MHC class I,
      and FcRn proteins.
    explanation: >-
      Functional demonstration that the allele is hypomorphic rather than null, and that the
      same allele depresses MHC class I and FcRn together - the branch point this entry turns on.
  downstream:
  - target: Depletion of the Shared MHC Class I Light Chain
    causal_link_type: DIRECT
    description: Loss of function at the only gene encoding beta-2-microglobulin.

- name: Depletion of the Shared MHC Class I Light Chain
  role: central_effector
  biological_scale: MOLECULAR
  description: >-
    Beta-2-microglobulin is not a component of one receptor; it is the non-polymorphic
    light chain of the whole MHC class I fold. Classical HLA-A/B/C, the lipid-presenting
    CD1 molecules, and FcRn are all heterodimers of a class-I-like heavy chain with the
    same light chain, so a shortage of it destabilises all of them at once.

    This node is the reason the disease has two arms rather than one, and it is why the
    immunological defect is broader than in the commoner TAP-deficient form of MHC class I
    deficiency: TAP loss leaves the heterodimer intact and starves it of peptide, whereas
    beta-2-microglobulin loss removes the shared subunit that CD1 and FcRn need too.
  molecular_functions:
  - preferred_term: beta-2-microglobulin binding to the MHC class I-fold heavy chain
    term:
      id: GO:0042288
      label: MHC class I protein binding
    modifier: DECREASED
  evidence:
  - reference: PMID:16549777
    reference_title: "Familial hypercatabolic hypoproteinemia caused by deficiency of the neonatal Fc receptor, FcRn, due to a mutant beta2-microglobulin gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Concentrations of soluble beta(2)m and HLA in the siblings' sera were <1% of normal."
    explanation: Direct measurement of the light-chain deficit and its effect on classical class I.
  - reference: PMID:25702838
    reference_title: "β2-Microglobulin deficiency causes a complex immunodeficiency of the innate and adaptive immune system."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Not only polymorphic MHC-I but also the related CD1a, CD1b, CD1c, and neonatal Fc
      receptor molecules were absent from the surfaces of β2m-deficient cells.
    explanation: >-
      The single observation that establishes the shared-subunit model: three different
      receptor families disappear from the cell surface together.
  - reference: PMID:25702838
    reference_title: "β2-Microglobulin deficiency causes a complex immunodeficiency of the innate and adaptive immune system."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The clinical presentation of patients with β2m deficiency resembles that of patients
      with other forms of MHC-I deficiency, but because of the missing stabilizing effect of
      β2m on other members of the MHC-I family, the immunologic defect is more extensive
      than in patients with TAP deficiency.
    explanation: >-
      The authors' own statement of why this lesion is broader than TAP deficiency, which is
      the contrast this node exists to record.
  downstream:
  - target: Loss of FcRn from the Cell Surface
    causal_link_type: DIRECT
    description: >-
      FcRn cannot reach the plasma membrane without its light chain.
  - target: Loss of Classical MHC Class I and CD1 Surface Expression
    causal_link_type: DIRECT
    description: >-
      The antigen-presentation arm, parallel to and independent of the FcRn arm.

- name: Loss of FcRn from the Cell Surface
  role: effector
  biological_scale: CELLULAR
  description: >-
    FcRn is expressed on vascular endothelium, epithelium and most haematopoietic cells.
    Endothelium alone accounts for roughly half of IgG salvage in mice, which is why a
    defect in a receptor usually discussed in immunological terms produces a
    whole-body protein-kinetic phenotype.
  cell_types:
  - preferred_term: vascular endothelial cell
    term:
      id: CL:0002139
      label: endothelial cell of vascular tree
  evidence:
  - reference: PMID:25702838
    reference_title: "β2-Microglobulin deficiency causes a complex immunodeficiency of the innate and adaptive immune system."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Absent neonatal Fc receptor surface expression led to low serum IgG and albumin levels
      in both siblings, whereas the heterozygous parents had normal results for all tested
      parameters except β2m mRNA (B2M) expression.
    explanation: >-
      Links absent surface FcRn to the biochemical phenotype in patients, and records that
      heterozygotes are biochemically normal.
  - reference: PMID:30903736
    reference_title: "The neonatal Fc receptor: Key to homeostasic control of IgG and IgG-related biopharmaceuticals."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      More detailed studies on mice with the FcRn deficiency limited to endothelial cells
      demonstrated that vascular endothelium was responsible for about half of the IgG salvage
    explanation: Establishes the endothelial compartment as a major site of the salvage this node removes.
  downstream:
  - target: Failure of pH-Dependent FcRn Salvage of IgG and Albumin
    causal_link_type: DIRECT
    description: No receptor at the membrane, no salvage cycle.

- name: Failure of pH-Dependent FcRn Salvage of IgG and Albumin
  role: central_effector
  biological_scale: MOLECULAR
  description: >-
    The salvage cycle is a pH switch. IgG and albumin are pinocytosed indiscriminately
    along with other plasma proteins; in the acidified endosome FcRn binds them, and
    everything it does not bind continues to the lysosome. Returned to the neutral pH of
    the cell surface, the ligands are released back into the circulation. This is the whole
    mechanism by which two proteins get half-lives of about three weeks when comparable
    plasma proteins get days.

    Two features of the receptor explain the shape of this disease. It binds IgG and
    albumin at separate sites, so one lesion in the shared receptor takes out both ligands
    without either competing with the other; and because the receptor pool is finite, the
    system is concentration-dependent, which is why catabolic rate rather than synthetic
    rate is the variable that moves.
  biological_processes:
  - preferred_term: FcRn-mediated receptor recycling of IgG and albumin
    term:
      id: GO:0001881
      label: receptor recycling
    modifier: LOSS_OF_FUNCTION
  molecular_functions:
  - preferred_term: pH-dependent IgG binding by FcRn
    term:
      id: GO:0019864
      label: IgG binding
    modifier: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:30903736
    reference_title: "The neonatal Fc receptor: Key to homeostasic control of IgG and IgG-related biopharmaceuticals."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "FcRn protects IgG and albumin from intracellular degradation and recycles them back into the circulation."
    explanation: The salvage function this node models.
  - reference: PMID:30903736
    reference_title: "The neonatal Fc receptor: Key to homeostasic control of IgG and IgG-related biopharmaceuticals."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Although FcRn is present on the plasma membrane of these cells, it does not bind IgG at
      pH7.4, but at acidic pH of 6 and lower.
    explanation: The pH switch that makes the cycle work, and that this node is named for.
  - reference: PMID:30903736
    reference_title: "The neonatal Fc receptor: Key to homeostasic control of IgG and IgG-related biopharmaceuticals."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Importantly, the binding sites for IgG and albumin on FcRn are different and can be
      independently blocked
    explanation: >-
      Why one receptor defect produces two independent ligand deficits rather than a
      competition between them.
  - reference: PMID:12566415
    reference_title: "The major histocompatibility complex-related Fc receptor for IgG (FcRn) binds albumin and prolongs its lifespan."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We show here that albumin binds FcRn in a pH dependent fashion, that the lifespan of
      albumin is shortened in FcRn-deficient mice, and that the plasma albumin concentration
      of FcRn-deficient mice is less than half that of wild-type mice.
    explanation: >-
      The albumin arm specifically. Albumin salvage by FcRn was hypothesised long before it
      was shown, and this is the experiment that established it.
  - reference: PMID:16549777
    reference_title: "Familial hypercatabolic hypoproteinemia caused by deficiency of the neonatal Fc receptor, FcRn, due to a mutant beta2-microglobulin gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      FcRn is a heterodimeric receptor composed of a nonclassical MHC class I alpha-chain and
      beta(2)-microglobulin (beta(2)m) that binds two ligands, IgG and albumin, and extends
      the catabolic half-lives of both.
    explanation: The receptor's composition, which is what connects this node to the B2M lesion.
  downstream:
  - target: Accelerated Endogenous Catabolism of IgG and Albumin
    causal_link_type: DIRECT
    description: >-
      Unsalvaged ligand is delivered to the lysosome by default.

- name: Accelerated Endogenous Catabolism of IgG and Albumin
  role: effector
  biological_scale: ORGANISM
  description: >-
    The defining measurement of the disease, and the one that names it. In the index
    siblings the fractional catabolic rate of IgG was about five times normal while
    synthesis was normal - so the low serum concentrations are a clearance phenotype, not
    a production phenotype.

    The two classical alternative causes of low serum protein were excluded by direct
    measurement rather than by inference: there was no proteinuria, and faecal
    chromium-labelled albumin studies were normal, ruling out gastrointestinal loss.
    That exclusion is what made "hypercatabolic" a claim about mechanism rather than a
    label for unexplained hypoproteinaemia.
  biological_processes:
  - preferred_term: lysosomal catabolism of unsalvaged IgG and albumin
    term:
      id: GO:0030163
      label: protein catabolic process
    modifier: INCREASED
  evidence:
  - reference: PMID:2254461
    reference_title: "Familial hypercatabolic hypoproteinemia. A disorder of endogenous catabolism of albumin and immunoglobulin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The IgG synthetic rates were within the normal range. However, the IgG survival was
      short, with their respective fractional catabolic rates increased fivefold to 31% and
      36% of the intravenous pool per day
    explanation: >-
      The quantitative core of the entry: normal synthesis, fivefold catabolism. This is the
      measurement that separates the disease from every cause of reduced production.
  - reference: PMID:2254461
    reference_title: "Familial hypercatabolic hypoproteinemia. A disorder of endogenous catabolism of albumin and immunoglobulin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Furthermore, the patients had reduced total body pools, normal synthetic rates, and
      increased fractional catabolic rates for albumin.
    explanation: The same kinetic pattern for albumin, establishing that both ligands behave alike.
  - reference: PMID:2254461
    reference_title: "Familial hypercatabolic hypoproteinemia. A disorder of endogenous catabolism of albumin and immunoglobulin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There was no proteinuria or abnormality of renal or liver function.
    explanation: Renal protein loss excluded.
  - reference: PMID:2254461
    reference_title: "Familial hypercatabolic hypoproteinemia. A disorder of endogenous catabolism of albumin and immunoglobulin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      both patients had normal fecal 51Cr-labeled albumin tests, thus excluding excessive
      gastrointestinal protein loss
    explanation: Enteric protein loss excluded, by direct measurement rather than by absence of symptoms.
  downstream:
  - target: Hypoalbuminaemia and Hypogammaglobulinaemia with Preserved Synthesis
    causal_link_type: DIRECT
    description: A steady state in which clearance outruns an unimpaired synthetic rate.

- name: Hypoalbuminaemia and Hypogammaglobulinaemia with Preserved Synthesis
  role: outcome
  biological_scale: ORGANISM
  description: >-
    The biochemical endpoint. Because the receptor pool is finite and shared, heterozygous
    carriers sit on a gradient rather than a threshold: eight relatives of the index
    siblings were moderately IgG-deficient, while the parents in the second family were
    normal on every tested parameter except B2M message. The gene is dose-sensitive but
    the clinical phenotype is not simply proportional to dose.
  evidence:
  - reference: PMID:16549777
    reference_title: "Familial hypercatabolic hypoproteinemia caused by deficiency of the neonatal Fc receptor, FcRn, due to a mutant beta2-microglobulin gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two siblings, products of a consanguineous marriage, were markedly deficient in both
      albumin and IgG because of rapid degradation of these proteins, suggesting a lack of
      the neonatal Fc receptor, FcRn.
    explanation: The phenotype and the inference that led from it to the receptor.
  - reference: PMID:16549777
    reference_title: "Familial hypercatabolic hypoproteinemia caused by deficiency of the neonatal Fc receptor, FcRn, due to a mutant beta2-microglobulin gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Eight relatives of the siblings were moderately IgG-deficient."
    explanation: The intermediate carrier phenotype in the first family.

- name: Loss of Classical MHC Class I and CD1 Surface Expression
  role: effector
  biological_scale: CELLULAR
  description: >-
    The antigen-presentation arm. Both the peptide-presenting classical class I molecules
    and the lipid-presenting CD1a, CD1b and CD1c disappear from the cell surface, because
    all of them are built on the same light chain.

    This arm was invisible for the first twenty-five years of the disease's history. The
    1990 protein-turnover study did not look for it, and the 2006 sequencing study measured
    serum HLA but did not characterise the cellular compartments; the immunological
    phenotype was described only in 2015.
  cell_types:
  - preferred_term: professional antigen-presenting cell
    term:
      id: CL:0000145
      label: professional antigen presenting cell
  biological_processes:
  - preferred_term: MHC class I antigen presentation
    term:
      id: GO:0002474
      label: antigen processing and presentation of peptide antigen via MHC class I
    modifier: DECREASED
  evidence:
  - reference: PMID:25702838
    reference_title: "β2-Microglobulin deficiency causes a complex immunodeficiency of the innate and adaptive immune system."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we provide the first extensive clinical and immunologic description of β2m
      deficiency in 2 siblings.
    explanation: >-
      Establishes that the immunological arm was first characterised in 2015, which the
      description above depends on.
  - reference: PMID:25702838
    reference_title: "β2-Microglobulin deficiency causes a complex immunodeficiency of the innate and adaptive immune system."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most patients with MHC class I (MHC-I) deficiency carry genetic defects in transporter
      associated with antigen processing 1 (TAP1) or TAP2.
    explanation: >-
      Places this disease within MHC class I deficiency while identifying the commoner
      mechanism it is not.
  downstream:
  - target: Distorted T and NK Cell Compartments
    causal_link_type: DIRECT
    description: >-
      CD8 selection and NK licensing both read surface class I.

- name: Distorted T and NK Cell Compartments
  role: consequence
  biological_scale: CELLULAR
  description: >-
    Two lymphocyte compartments are shaped by surface class I and both are abnormal. The
    conventional CD8 alpha-beta T cell compartment fails, and CD8-positive gamma-delta
    T cells expand strongly in its place - the same substitution seen in TAP deficiency.
    NK cells are present in normal numbers but are not licensed, a state in which the cells
    exist and can be counted but have not been educated by class I to kill.

    The NK finding is the reason a cell count is not a sufficient investigation here. A
    normal NK number and an absent NK function are the same laboratory result unless
    licensing is specifically assessed.
  cell_types:
  - preferred_term: CD8-positive gamma-delta T cell
    term:
      id: CL:0000798
      label: gamma-delta T cell
    modifier: INCREASED
  - preferred_term: natural killer cell
    term:
      id: CL:0000623
      label: natural killer cell
  evidence:
  - reference: PMID:25702838
    reference_title: "β2-Microglobulin deficiency causes a complex immunodeficiency of the innate and adaptive immune system."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Similar to TAP deficiency in the absence of a regular CD8 T-cell compartment, CD8(+) γδ
      T cells were strongly expanded.
    explanation: The CD8 compartment failure and the gamma-delta substitution.
  - reference: PMID:25702838
    reference_title: "β2-Microglobulin deficiency causes a complex immunodeficiency of the innate and adaptive immune system."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Natural killer cells were normal in number but not "licensed to kill."
    explanation: >-
      The dissociation between NK number and NK function, which is what makes the count
      misleading on its own.
  downstream:
  - target: Recurrent Sinopulmonary Infection and Chronic Skin Disease
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Impaired cellular immunity, compounded by the low IgG arriving from the other branch.

- name: Recurrent Sinopulmonary Infection and Chronic Skin Disease
  role: outcome
  biological_scale: ORGANISM
  description: >-
    The clinical endpoint, and it is strikingly variable within a single genotype. In the
    2015 family the sister had recurrent respiratory infection and severe skin disease
    while her brother, carrying the same homozygous defect, was largely asymptomatic and
    was found to have bronchiectasis. Bronchiectasis in an otherwise well sibling is the
    reminder that structural lung damage here can accumulate without a symptomatic
    infection history.
  evidence:
  - reference: PMID:25702838
    reference_title: "β2-Microglobulin deficiency causes a complex immunodeficiency of the innate and adaptive immune system."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The sister had recurrent respiratory tract infections and severe skin disease, whereas
      the brother was fairly asymptomatic but had bronchiectasis.
    explanation: >-
      Intrafamilial variability at a single genotype, and the silent bronchiectasis this node
      is written around.


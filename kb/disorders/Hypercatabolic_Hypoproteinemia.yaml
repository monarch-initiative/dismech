    The eponymous phenotype. Redundant with the albumin and IgG terms in one sense - those
    are the two proteins that are low - but the disease is named for the aggregate, and an
    entry that curated only the components would not surface under the name.
  phenotype_term:
    preferred_term: Hypoproteinemia
    term:
      id: HP:0003075
      label: Hypoproteinemia
  evidence:
  - reference: PMID:2254461
    reference_title: "Familial hypercatabolic hypoproteinemia. A disorder of endogenous catabolism of albumin and immunoglobulin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We propose that these siblings have a previously unrecognized familial disorder
      characterized by reduced serum concentrations of IgG and albumin caused by a defect in
      endogenous catabolism
    explanation: >-
      Reduced serum concentrations of both major proteins, which is the aggregate this term
      names.

genetic:
- name: B2M
  gene_term:
    preferred_term: B2M
    term:
      id: hgnc:914
      label: B2M
  relationship_type: CAUSATIVE
  notes: >-
    The only gene encoding beta-2-microglobulin. Both reported families are consanguineous
    with homozygous variants; the first family's allele is a signal-peptide missense change
    that lowers the amount of protein produced rather than altering its sequence.
  inheritance:
  - name: Autosomal recessive
  evidence:
  - reference: PMID:16549777
    reference_title: "Familial hypercatabolic hypoproteinemia caused by deficiency of the neonatal Fc receptor, FcRn, due to a mutant beta2-microglobulin gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We concluded that a beta(2)m gene mutation underlies the hypercatabolism and reduced
      serum levels of albumin and IgG in the two siblings with familial hypercatabolic
      hypoproteinemia.
    explanation: The causal assignment of the disease to B2M.

inheritance:
- name: Autosomal recessive
  description: >-
    Both described families are consanguineous with homozygous variants. Carriers are not
    uniformly normal: eight relatives of the first family were moderately IgG-deficient,
    whereas the parents in the second family were normal on all tested parameters except
    B2M message. A carrier with a mildly low IgG is therefore consistent with this
    diagnosis in the family, and is not evidence against it.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:25702838
    reference_title: "β2-Microglobulin deficiency causes a complex immunodeficiency of the innate and adaptive immune system."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Absent neonatal Fc receptor surface expression led to low serum IgG and albumin levels
      in both siblings, whereas the heterozygous parents had normal results for all tested
      parameters except β2m mRNA (B2M) expression.
    explanation: Affected homozygous siblings, biochemically unaffected heterozygous parents.
  - reference: PMID:16549777
    reference_title: "Familial hypercatabolic hypoproteinemia caused by deficiency of the neonatal Fc receptor, FcRn, due to a mutant beta2-microglobulin gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Eight relatives of the siblings were moderately IgG-deficient."
    explanation: >-
      The contrasting carrier observation in the first family, which is why the description
      above declines to call heterozygotes uniformly normal.

animal_models:
- name: beta-2-microglobulin knockout mouse (B6.129P2-B2m tm1Unc)
  species: Mouse
  genotype: B2m knockout, homozygous
  publication: PMID:12566415
  description: >-
    The mouse counterpart of the human lesion: no beta-2-microglobulin, therefore no assembled
    FcRn, studied by radioiodinated albumin and immunoglobulin turnover - the same experimental
    design Waldmann and Terry used in the patients.
  modeled_mechanisms:
  - target: Accelerated Endogenous Catabolism of IgG and Albumin
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Reproduces the defining kinetic abnormality, and reproduces its selectivity: albumin and
      IgG half-lives are shortened while IgA and IgM are unchanged, which is exactly what a
      lesion in a receptor that salvages only those two ligands predicts.
    limitations: >-
      Beta-2-microglobulin knockout removes the whole MHC class I fold, so the strain also
      lacks classical class I and CD1 and is not a clean FcRn model. The paper addresses this
      by studying an FcRn alpha-chain knockout in parallel, which isolates the receptor. Murine
      protein half-lives are far shorter than human ones, so the absolute numbers do not
      transfer; the ratios do.
    readouts:
    - name: Plasma albumin half-life
      target: Accelerated Endogenous Catabolism of IgG and Albumin
      direction: DECREASED
      interpretation: >-
        Albumin survives 25 hours against 35 in wild type, while IgA over the same experiment
        is unchanged - the negative control that makes the result specific rather than a
        general catabolic phenotype.
      evidence:
      - reference: PMID:12566415
        reference_title: "The major histocompatibility complex-related Fc receptor for IgG (FcRn) binds albumin and prolongs its lifespan."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          It can be seen that the half-life of albumin is shortened in the b2m KO strain (t1/2
          25 h vs. 35 h in WT, Fig. 4 A) whereas the half-lives of IgA are not different in the
          two strains
        explanation: >-
          The albumin measurement together with its internal IgA control, in one sentence.
    - name: Plasma IgG half-life
      target: Accelerated Endogenous Catabolism of IgG and Albumin
      direction: DECREASED
      interpretation: >-
        IgG falls from 95 hours to 19 - a far larger proportional loss than albumin's, which
        is consistent with IgG depending on FcRn salvage more heavily.
      evidence:
      - reference: PMID:12566415
        reference_title: "The major histocompatibility complex-related Fc receptor for IgG (FcRn) binds albumin and prolongs its lifespan."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          As well, the half-life of IgG is shortened (t1/2 19 h vs. 95 h in WT, Fig. 3 C), as
          has already been reported
        explanation: The IgG arm of the same turnover experiment.
    - name: Urinary albumin loss
      target: Accelerated Endogenous Catabolism of IgG and Albumin
      direction: UNCHANGED
      interpretation: >-
        The mice are not albuminuric, so the rapid decay is degradation rather than renal loss
        - the same exclusion the human study made with proteinuria testing.
      evidence:
      - reference: PMID:12566415
        reference_title: "The major histocompatibility complex-related Fc receptor for IgG (FcRn) binds albumin and prolongs its lifespan."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          As b2m KO mice are not albuminuric (30, 31), we suggest the rapid decay represents
          degradation.
        explanation: >-
          A negative result doing real work: it converts a shortened half-life into a
          catabolism claim.
    evidence:
    - reference: PMID:12566415
      reference_title: "The major histocompatibility complex-related Fc receptor for IgG (FcRn) binds albumin and prolongs its lifespan."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        we infused radioiodinated mouse albumin intravenously into mice of two strains deficient
        in FcRn, both the b2m KO strain (26) and the FcRn α-chain KO strain (unpublished data).
      explanation: >-
        Establishes the two strains and the design, and shows the authors treated the
        beta-2-microglobulin knockout as an FcRn-deficient strain - which is the join between
        this model and the human disease.

- name: FcRn alpha-chain knockout mouse (B6.129X1/SvJ-Fcgrt Tm1Dcr)
  species: Mouse
  genotype: Fcgrt knockout, homozygous
  publication: PMID:12566415
  description: >-
    The controlled complement of the beta-2-microglobulin strain. Deleting the FcRn heavy
    chain leaves the rest of the MHC class I fold intact, so any phenotype it shares with the
    beta-2-microglobulin knockout is attributable to FcRn rather than to class I generally.
  modeled_mechanisms:
  - target: Failure of pH-Dependent FcRn Salvage of IgG and Albumin
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Isolates the receptor. This strain is why the human disease can be read as an FcRn
      phenotype rather than as an unspecified consequence of losing MHC class I.
    limitations: >-
      A heavy-chain knockout is not the human genotype, which removes the light chain and
      therefore also classical class I and CD1. The strain models one arm of the human disease
      and is silent on the other.
    readouts:
    - name: Plasma albumin concentration
      target: Failure of pH-Dependent FcRn Salvage of IgG and Albumin
      direction: DECREASED
      interpretation: >-
        Under half of wild-type concentration, establishing that FcRn sets the steady-state
        albumin level and not only its half-life.
      evidence:
      - reference: PMID:12566415
        reference_title: "The major histocompatibility complex-related Fc receptor for IgG (FcRn) binds albumin and prolongs its lifespan."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          the lifespan of albumin is shortened in FcRn-deficient mice, and that the plasma
          albumin concentration of FcRn-deficient mice is less than half that of wild-type mice
        explanation: Both the kinetic and the steady-state readout in the isolated-receptor strain.
    evidence:
    - reference: PMID:12566415
      reference_title: "The major histocompatibility complex-related Fc receptor for IgG (FcRn) binds albumin and prolongs its lifespan."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        These results affirm the hypothesis that the major histocompatibility complex-related Fc
        receptor protects albumin from degradation just as it does IgG, prolonging the
        half-lives of both.
      explanation: >-
        The authors' conclusion from the two strains together, which is the mechanism this node
        models.

diagnosis:
- name: Plasma Protein Turnover Study
  description: >-
    The measurement that made the diagnosis in 1968 and that still distinguishes this
    disease from every cause of reduced synthesis or external loss: radiolabelled IgG and
    albumin kinetics showing a normal synthetic rate with a markedly raised fractional
    catabolic rate. Proteinuria and faecal albumin loss must be excluded in the same
    workup, since either would produce low serum protein with a normal FcRn.
  evidence:
  - reference: PMID:2254461
    reference_title: "Familial hypercatabolic hypoproteinemia. A disorder of endogenous catabolism of albumin and immunoglobulin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The metabolism of radioiodinated IgG and albumin was studied in the two patients.
    explanation: The assay itself.

- name: Cell Surface Immunophenotyping for MHC Class I, CD1 and FcRn
  description: >-
    Flow cytometry for surface class I, CD1a/b/c and FcRn separates this disease from TAP
    deficiency, the commoner cause of MHC class I deficiency, in which CD1 and FcRn are
    intact. NK licensing has to be assessed functionally, because NK numbers are normal.
  evidence:
  - reference: PMID:25702838
    reference_title: "β2-Microglobulin deficiency causes a complex immunodeficiency of the innate and adaptive immune system."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Not only polymorphic MHC-I but also the related CD1a, CD1b, CD1c, and neonatal Fc
      receptor molecules were absent from the surfaces of β2m-deficient cells.
    explanation: The panel that distinguishes beta-2-microglobulin deficiency from TAP deficiency.

progression:
- phase: Terminal illness of the index patient
  notes: >-
    A single data point, and recorded as one. The proband of the founding family died at 40
    after bilateral pneumonia with pulmonary and oral bleeding on a background of
    thrombocytopenia, and septic shock. Infection and bleeding are both consistent with what
    is now understood of the disease - failed cellular immunity from the MHC class I arm, low
    IgG from the FcRn arm - but one death in one patient establishes no mortality pattern, and
    the second family's siblings were alive at report.

    The thrombocytopenia is worth flagging as unexplained rather than assimilated: nothing in
    the FcRn or MHC class I mechanism predicts it, this patient had been splenectomised, and
    no other source in this entry reports thrombocytopenia in beta-2-microglobulin deficiency.
  evidence:
  - reference: PMID:2254461
    reference_title: "Familial hypercatabolic hypoproteinemia. A disorder of endogenous catabolism of albumin and immunoglobulin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the patient developed bilateral pneumonia, pulmonary and
      oral bleeding associated with thrombocytopenia, and septic shock and
    explanation: >-
      The terminal illness. The quote stops before the age at death because the cached PDF text
      runs "40 yr ofage" together at that point; the age of 40 is stated in the same sentence of
      the source.

discussions:
- discussion_id: fcrn_antagonist_pharmacological_mirror
  kind: INTERPRETATION
  status: OPEN
  prompt: >-
    Should this disease be curated as the human loss-of-function counterpart of the
    FcRn-antagonist drug class, and does that parallel license any clinical claim about
    giving such a drug to an affected patient?
  attaches_to:
  - pathophysiology#Failure of pH-Dependent FcRn Salvage of IgG and Albumin
  rationale: >-
    Efgartigimod is an engineered IgG1 Fc fragment that lowers circulating IgG by
    occupying FcRn, and it is an approved treatment for generalised myasthenia gravis. The
    mechanism it exploits is the one this disease lacks: blocking FcRn-mediated salvage
    drives IgG catabolism up and serum IgG down.

    Recording the parallel is useful in both directions. It gives a pharmacological
    demonstration, in a large randomised population, of the physiology that two families
    established genetically. It also implies that FcRn antagonists would be expected to
    aggravate the biochemical phenotype here.

    That last point is an inference from mechanism, not a reported observation. No cited
    source describes FcRn-antagonist exposure in a patient with beta-2-microglobulin
    deficiency, and this entry does not curate it as a contraindication.
  evidence:
  - reference: PMID:34146511
    reference_title: "Safety, efficacy, and tolerability of efgartigimod in patients with generalised myasthenia gravis (ADAPT): a multicentre, randomised, placebo-controlled, phase 3 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      efgartigimod (ARGX-113), a human IgG1 antibody Fc fragment engineered to reduce
      pathogenic IgG autoantibody levels
    explanation: >-
      Establishes that deliberate FcRn blockade to lower IgG is an approved therapeutic
      strategy. It supports the parallel only; it says nothing about this disease.
  - reference: PMID:30903736
    reference_title: "The neonatal Fc receptor: Key to homeostasic control of IgG and IgG-related biopharmaceuticals."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Clinical trials have confirmed that pathogenic antibodies can be depleted by blocking
      this homeostatic function of FcRn.
    explanation: The same point stated as the general principle rather than for one drug.

- discussion_id: gap_diabetes_and_skeletal_deformity_attribution
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Are the chemical diabetes and skeletal deformity reported in the index family
    pleiotropic consequences of beta-2-microglobulin deficiency, or unrelated traits
    segregating in a consanguineous pedigree?
  attaches_to:
  - pathophysiology#Depletion of the Shared MHC Class I Light Chain
  rationale: >-
    The founding report noted chemical diabetes and a skeletal deformity in the index
    family, and explicitly attributed them to that family rather than to the disorder -
    the authors wrote that the protein phenotype "is associated in this family with"
    these features. With two reported families in thirty-five years there is no way to tell
    a pleiotropic consequence of beta-2-microglobulin deficiency from an unrelated
    segregating trait in a consanguineous pedigree.

    They are therefore not curated as phenotypes of this disease. Resolving it needs
    additional unrelated families, or a mechanistic account linking a class-I-fold
    heterodimer to glucose handling or skeletal development.
  evidence:
  - reference: PMID:2254461
    reference_title: "Familial hypercatabolic hypoproteinemia. A disorder of endogenous catabolism of albumin and immunoglobulin."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      leading to a short survival of these proteins that is associated in this family with
      chemical diabetes and a skeletal deformity
    explanation: >-
      The authors' own hedged phrasing, which is the reason this is a gap rather than a
      phenotype.

notes: >-
  Curated from a Perplexity sonar-deep-research report
  (research/Hypercatabolic_Hypoproteinemia-deep-research-perplexity.md), which passed
  `just preflight-dr` against MONDO:0009434 with the canonical gene B2M mentioned 84 times
  and the report's OMIM identifiers including the MONDO xref 241600.

  The report was used to locate literature, not as a source of text. Its own citation list
  is mostly non-PubMed URLs (Wikipedia, ScienceDirect topic pages, MedGen), and its
  treatment section is synthesis without primary citations, so every reference cited in
  this entry was found and read independently. Three PMIDs recalled from memory during
  that search turned out to point at unrelated papers and were discarded after fetching
  them; the six references here were located by PubMed query and each abstract was read
  before use.

  No treatments are curated. The report describes immunoglobulin replacement, albumin
  infusion and antibiotic prophylaxis, but attributes them to no primary source, and none
  of the six references read for this entry reports a treatment given to a patient with
  this disease - PMID:2254461 and PMID:16549777 are metabolic and molecular studies, and
  PMID:25702838's therapy content concerns the immunological workup. Asserting a standard
  of care from a synthesis with no citable source is the failure mode the evidence SOP
  exists to prevent, so the section is left empty rather than filled speculatively.

  Four curation decisions that a later editor is likely to want to reverse, and the reasons
  not to.

  The trigger node carries no molecular function. `GO:0042605 peptide antigen binding` is the
  tempting one and it is wrong: beta-2-microglobulin is the invariant light chain, and the
  peptide groove belongs to the heavy chain's alpha-1/alpha-2 domains. The MF anchor that is
  true sits on the depletion node instead - `GO:0042288 MHC class I protein binding`, with
  `modifier: DECREASED` rather than `LOSS_OF_FUNCTION`, because the lesion lowers the supply
  of the light chain rather than altering the activity of the protein it produces. That
  distinction is the quantitative/qualitative line: nothing here escapes regulation, there is
  simply less of it.

  The skin phenotype is deliberately unbound. `HP:0200042 Skin ulcer` was drafted and
  withdrawn: the only quotable source says "severe skin disease", and the ulcer specificity
  came from the record's MeSH indexing rather than from the authors, with no full text to
  appeal to. A paper characterising the rash would justify binding it; MeSH indexing does not.

  The MHC class I surface phenotype leads with the cell-surface measurement from PMID:25702838
  and keeps the soluble-HLA serum measurement as a second item at PARTIAL. The serum figure is
  real corroborating data measuring a different thing, and `PARTIAL` records that structurally
  rather than in prose.

  Both knockout strains are curated, not just the beta-2-microglobulin one. The FcRn
  alpha-chain knockout is what licenses reading the human disease as an FcRn phenotype rather
  than as an unspecified consequence of losing class I. The `direction: UNCHANGED` albuminuria
  readout is doing real work: it is what converts a shortened albumin half-life into a
  catabolism claim, mirroring the proteinuria exclusion in the 1990 human turnover study.

  On the identity of the families: PMID:16549777 sequenced sera "archived for 35 years"
  from the two siblings, and Waldmann is an author of both it and PMID:2254461, so the
  molecular diagnosis was made on the family that defined the disease. PMID:25702838
  describes a separate Turkish family.

  MONDO:0009434 xrefs OMIM:241600, which OMIM now titles as an immunodeficiency entry;
  the dismech entry keeps the MONDO label's historical framing in `disease_term` while the
  description and pathograph carry both arms.


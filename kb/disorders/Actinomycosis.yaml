      granules and filamentous Gram-positive fungal-like pathogens.
    explanation: The review states that histopathology of sulfur granules is the characteristic diagnostic finding.
- name: Prolonged anaerobic bacterial culture
  description: >-
    Recovery of Actinomyces requires prolonged culture under anaerobic
    conditions; the fastidious, slow-growing organism is frequently missed on
    routine culture, contributing to diagnostic delay.
  diagnosis_term:

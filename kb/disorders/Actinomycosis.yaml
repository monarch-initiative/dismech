- name: Actinomyces Peptidoglycan Cross-Linking (Beta-Lactam Target)
  description: >-
    Actinomyces are bacteria with peptidoglycan cell walls. Penicillin and
    amoxicillin inhibit the penicillin-binding protein DD-transpeptidases that
    cross-link peptidoglycan, leaving growing organisms unable to maintain the
    load-bearing sacculus.
  role: therapeutic_vulnerability
  conforms_to: "bacterial_cell_wall_synthesis_inhibition#Peptidoglycan Cross-Linking by Penicillin-Binding Proteins"
  biological_processes:
  - preferred_term: peptidoglycan-based cell wall biogenesis
    term:
      id: GO:0009273
      label: peptidoglycan-based cell wall biogenesis
  evidence:
  - reference: PMID:22203377
    reference_title: "From the regulation of peptidoglycan synthesis to bacterial growth and morphology."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Peptidoglycan synthesis requires glycosyltransferases (GTases) to
      polymerize the glycan chains and DD-transpeptidases (DD-TPases) to
      crosslink the peptides
    explanation: >-
      Establishes the conserved bacterial peptidoglycan cross-linking step that
      beta-lactams inhibit. The Actinomyces-specific review establishes that
      Actinomyces are Gram-positive bacteria responsive to penicillin G or
      amoxicillin.

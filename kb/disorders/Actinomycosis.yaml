name: Actinomycosis
creation_date: '2026-09-25T00:00:00Z'
category: Infectious Disease
description: >-
  Actinomycosis is a rare, chronic, suppurative and granulomatous bacterial
  infection caused by endogenous Actinomyces species after disruption of the
  oral, gastrointestinal, or genital mucosal barrier. The anaerobic,
  filamentous Gram-positive organisms survive phagocytosis, form sulfur-granule
  lesions with necrosis and chronic inflammation, spread contiguously across
  tissue planes, form abscesses and sinus tracts, and often mimic malignancy in
  cervicofacial, pulmonary, abdominopelvic, or central nervous system sites.
  Prolonged high-dose beta-lactam therapy kills Actinomyces by inhibiting
  peptidoglycan cross-linking, and surgical resection or drainage is used for
  bulky, necrotic, or anatomically complicated disease.

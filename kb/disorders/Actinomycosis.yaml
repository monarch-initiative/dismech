transmission:
- name: Endogenous infection after mucosal barrier disruption
  description: >-
    Human actinomycosis is usually not acquired by person-to-person or animal
    transmission. Disease begins when commensal Actinomyces cross a disrupted
    oral, gastrointestinal, or genital mucosal barrier into deep tissue.
  evidence:
  - reference: PMID:24905109
    reference_title: "[Abdominal actinomycosis: a rare differential diagnosis to colon carcinoma and Morbus Crohn]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Actinomyces are considered to be residential saprophytes in the
      gastroinstetinal tract and require a mucosal lesion to cause an
      opportunistic infection.
    explanation: Supports endogenous opportunistic infection after gastrointestinal mucosal injury.
environmental:
- name: Long-standing intrauterine device use
  description: >-
    Prolonged intrauterine device (IUD) use is the best-quantified risk factor
    for pelvic actinomycosis: Actinomyces-like organisms colonize the cervix of
    IUD users, and colonization clears after the device is removed.
  influences_mechanisms:
  - target: Mucosal Barrier Breach and Endogenous Inoculation
    environmental_effect: PREDISPOSES
    causal_link_type: DIRECT
    description: >-
      A long-standing IUD provides a chronic nidus and a mucosal breach that lets
      commensal genital-tract Actinomyces colonize and invade pelvic tissue.
    evidence:
    - reference: PMID:3526779
      reference_title: "Actinomyces in cervical smears of women using intrauterine contraceptive devices."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Among 815 intrauterine contraceptive device (IUD) users, the repeat
        smears from 57 women were positive for Actinomyces-like organisms,
        giving a prevalence rate of 6.99%.
      explanation: Quantifies Actinomyces colonization in IUD users as a predisposing factor.
  evidence:
  - reference: PMID:3526779

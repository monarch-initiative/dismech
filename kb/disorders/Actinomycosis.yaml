- name: Pulmonary
  display_name: Pulmonary or thoracic actinomycosis
  description: >-
    Thoracic infection linked to aspiration and poor dental hygiene; it can
    mimic lung cancer with mass-like or cavitary lesions and symptoms such as
    cough, dyspnea, fever, hemoptysis, malaise, and weight loss.
  evidence:
  - reference: PMID:25045274
    reference_title: "Actinomycosis: etiology, clinical features, diagnosis, treatment, and management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "pulmonary actinomycosis in smokers with poor dental hygiene"
    explanation: The review identifies the pulmonary form and a characteristic dental-hygiene risk context.
- name: Abdominopelvic
  display_name: Abdominal and pelvic actinomycosis
  description: >-
    Infection of gastrointestinal or genital sites after a mucosal lesion or
    long-standing intrauterine device use; abdominal and pelvic cases can
    resemble inflammatory bowel disease or pelvic and colonic malignancy.
  evidence:
  - reference: PMID:24905109
    reference_title: "[Abdominal actinomycosis: a rare differential diagnosis to colon carcinoma and Morbus Crohn]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The clinical presentation of abdominal actinomycosis shows a great
      variability and it often mimics other intraabdominal pathologies like
      chronic inflammatory bowel diseases or malignancies.
    explanation: The case report abstract characterizes the abdominal presentation and its malignancy/IBD mimicry.
  - reference: PMID:42287450
    reference_title: "Pelvic actinomycosis: diagnostic challenges and management strategies based on a retrospective case series and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pelvic actinomycosis is a rare, chronic infection caused by Actinomyces
      species, most associated with prolonged intrauterine device (IUD) use.
    explanation: The retrospective case series and literature review characterize the IUD-associated pelvic form.
- name: Central Nervous System
  display_name: Central nervous system actinomycosis
  description: >-
    A rare severe form of actinomycosis involving the brain, meninges, or spinal
    epidural space. A systematic review found brain abscess to be the most common
    neuroimaging finding and reported meaningful fatality and neurological
    sequelae rates.
  evidence:
  - reference: PMID:37269006
    reference_title: "The epidemiology, clinical presentation and treatment outcomes in CNS actinomycosis: a systematic review of reported cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Brain abscess (55%) followed by leptomeningeal enhancement (22%) were the most common neuroimaging findings."
    explanation: The 118-case systematic review defines brain abscess as the dominant CNS presentation.

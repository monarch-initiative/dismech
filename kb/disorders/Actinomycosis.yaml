progression:
- phase: Indolent mass-forming infection
  notes: >-
    Actinomycosis progresses slowly over weeks to months and often reaches
    diagnosis only after a prolonged workup or surgery for suspected tumor or
    inflammatory bowel disease.
  evidence:
  - reference: PMID:41712794
    reference_title: "Actinomycosis: A diagnosis not to be forgotten."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mean time to diagnosis was 110 (30-540) days."
    explanation: A 17-case series quantified a months-long diagnostic delay.
- phase: Central nervous system disease outcomes
  notes: >-
    CNS actinomycosis carries measurable mortality and lasting neurological
    morbidity even with treatment; a systematic review reported an overall
    case-fatality rate of 11% and neurological sequelae in 22% of survivors.
  evidence:
  - reference: PMID:37269006
    reference_title: "The epidemiology, clinical presentation and treatment outcomes in CNS actinomycosis: a systematic review of reported cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The overall case-fatality rate was 11%"

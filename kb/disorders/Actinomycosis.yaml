treatments:
- name: Prolonged Penicillin or Amoxicillin Therapy
  description: >-
    Prolonged high-dose beta-lactam treatment with intravenous penicillin G or
    oral amoxicillin is the standard Actinomyces-directed antimicrobial
    strategy; courses usually last 6-12 months and may be shortened after
    complete surgical resection of infected tissue.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: benzylpenicillin
      term:
        id: CHEBI:18208
        label: benzylpenicillin
    - preferred_term: amoxicillin
      term:
        id: CHEBI:2676
        label: amoxicillin
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Actinomyces Peptidoglycan Cross-Linking (Beta-Lactam Target)
    description: >-
      Penicillin G and amoxicillin acylate bacterial penicillin-binding proteins
      and block peptidoglycan cross-linking in susceptible Actinomyces.
  evidence:
  - reference: PMID:25045274
    reference_title: "Actinomycosis: etiology, clinical features, diagnosis, treatment, and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Patients with actinomycosis require prolonged (6- to 12-month) high doses
      (to facilitate the drug penetration in abscess and in infected tissues) of
      penicillin G or amoxicillin
    explanation: Review support for prolonged high-dose penicillin G or amoxicillin therapy.
- name: Surgical Resection or Drainage
  description: >-
    Surgery drains abscesses, removes necrotic or fibrotic infected tissue, and
    establishes a histologic diagnosis when actinomycosis mimics cancer; in CNS
    disease, surgery combined with antimicrobials is associated with better
    survival than antimicrobials alone.
  therapeutic_modality: SURGERY
  target_mechanisms:
  - target: Reactive Fibrosis
    description: Surgery excises bulky fibrotic or necrotic infected tissue.
  - target: Abscess and Fistula Formation
    description: Surgery drains abscesses and marsupializes chronic sinus tracts.
  treatment_term:
    preferred_term: Surgical Procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  evidence:
  - reference: PMID:25045274
    reference_title: "Actinomycosis: etiology, clinical features, diagnosis, treatment, and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      the duration of antimicrobial therapy could probably be shortened to 3
      months in patients in whom optimal surgical resection of infected tissues
      has been performed.
    explanation: The review describes surgical resection as a way to reduce infected tissue burden and shorten antimicrobial therapy.
  - reference: PMID:37269006
    reference_title: "The epidemiology, clinical presentation and treatment outcomes in CNS actinomycosis: a systematic review of reported cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      patients who underwent surgery with antimicrobials had better survival
      (adjusted OR 0.14, 95% CI 0.04-0.28, p value 0.039) compared to those
      treated with antimicrobials alone.
    explanation: The CNS systematic review reports improved survival with combined surgery and antimicrobials.
- name: Intrauterine device removal
  description: >-
    In IUD-associated pelvic actinomycosis, removing the device eliminates the
    nidus of Actinomyces colonization; colonization clears after removal even
    without antibiotics.
  target_mechanisms:
  - target: Mucosal Barrier Breach and Endogenous Inoculation
    description: >-
      Removing the intrauterine device eliminates the chronic device-associated
      nidus that seeds pelvic Actinomyces colonization and invasion.
  evidence:
  - reference: PMID:6529911
    reference_title: "Influence of removal of intrauterine contraceptive devices on colonisation of the cervix by actinomyces-like organisms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      After removal of the IUCD, and without antibiotic therapy, in 100%
      (20/20) of the women, ALO colonisation was no longer found six to twelve
      months later.
    explanation: Colonization cleared in all women after IUD removal, supporting removal as management.
notes: >-
  MONDO provides a specific term for cervicofacial actinomycosis
  (MONDO:0005699), but a search of MONDO via OLS (runoak -i ols:mondo search
  "l~actinomycosis") on 2026-09-26 returned only MONDO:0005631 (actinomycosis),
  MONDO:0005699 (cervicofacial actinomycosis), and MONDO:1013487 (actinomycosis,
  non-human animal) - no thoracic, pulmonary, abdominal, pelvic, or CNS
  actinomycosis subtype terms exist. Those anatomical forms are therefore
  represented as ungrounded subtypes until suitable MONDO classes exist. The
  cross-site "infiltrative mass mimicking malignancy" hallmark is modeled as the
  "Mass Mimicking Malignancy" pathophysiology node because no HP term for an
  infection-related infiltrative soft-tissue mass exists across sites; the
  concrete Abdominal mass phenotype (HP:0031500) grounds the gastrointestinal
  presentation.

  title: "Actinomycosis: etiology, clinical features, diagnosis, treatment, and management."
  found_in:
  - Actinomycosis-deep-research-openscientist.md
  findings:
  - statement: >-
      Actinomycosis is an endogenous Actinomyces infection whose cervicofacial,
      pelvic, and pulmonary forms map to dental, IUD-associated, and pulmonary
      aspiration or poor-dental-hygiene contexts.
    supporting_text: >-
      Actinomycosis is a rare chronic disease caused by Actinomyces spp.,
      anaerobic Gram-positive bacteria that normally colonize the human mouth
      and digestive and genital tracts.
- reference: PMID:24905109
  title: "[Abdominal actinomycosis: a rare differential diagnosis to colon carcinoma and Morbus Crohn]."
  found_in:
  - Actinomycosis-deep-research-openscientist.md
  findings:
  - statement: >-
      Gastrointestinal Actinomyces require a mucosal lesion to cause
      opportunistic abdominal infection.
    supporting_text: >-
      Actinomyces are considered to be residential saprophytes in the
      gastroinstetinal tract and require a mucosal lesion to cause an
      opportunistic infection.
- reference: PMID:28684963
  title: "Pelvic Actinomycosis."
  found_in:
  - Actinomycosis-deep-research-openscientist.md
  findings:
  - statement: >-
      Pelvic actinomycosis is a chronic opportunistic Actinomyces infection
      associated with abscesses, fistulas, and altered mucosal barriers.
    supporting_text: >-
      Actinomycoses are opportunistic infections and require normal mucous
      barriers to be altered.
- reference: PMID:37269006
  title: "The epidemiology, clinical presentation and treatment outcomes in CNS actinomycosis: a systematic review of reported cases."
  found_in:
  - Actinomycosis-deep-research-openscientist.md
  findings:
  - statement: >-
      CNS actinomycosis is a rare severe form with brain abscesses, neurologic
      sequelae, and survival improved by surgery plus prolonged antimicrobials.
    supporting_text: >-
      CNS actinomycosis carries significant morbidity and mortality despite its
      indolent nature.
- reference: PMID:18976399
  title: "Mucocutaneous Splendore-Hoeppli phenomenon."
  found_in:
  - Actinomycosis-deep-research-openscientist.md
  findings:
  - statement: >-
      Actinomycosis can elicit Splendore-Hoeppli material, a localized
      antigen-antibody-rich inflammatory reaction around organisms.
    supporting_text: >-
      The bacterial infections include botryomycosis, nocardiosis and
      actinomycosis.
- reference: PMID:41712794
  title: "Actinomycosis: A diagnosis not to be forgotten."
  found_in:
  - Actinomycosis-deep-research-openscientist.md
  findings:
  - statement: >-
      A 17-case retrospective series documented a mean 110-day diagnostic delay
      and favorable outcome in 16 patients.
    supporting_text: "The mean time to diagnosis was 110 (30-540) days."

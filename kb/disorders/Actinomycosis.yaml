has_subtypes:
- name: Cervicofacial
  display_name: Cervicofacial actinomycosis
  description: >-
    The classic dental-focus form, often arising after odontogenic infection or
    dental procedures and presenting as a mandibular, maxillary, or neck mass
    with possible sinus-tract drainage.
  subtype_term:
    preferred_term: cervicofacial actinomycosis

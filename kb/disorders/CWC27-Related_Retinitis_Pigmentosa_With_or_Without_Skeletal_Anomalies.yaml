- name: Photoreceptor Degeneration
  conforms_to: "spliceosome_component_dysfunction#Failure of Splicing-Sensitive Cell Populations"
  description: >-
    Photoreceptors degenerate, with loss of the outer nuclear layer and outer
    segments in patients. In mice the evidence comes from the hypomorphic
    K338fs model, whose degeneration is driven mainly by photoreceptor death,
    includes cones, and is reduced by AAV8 delivery of Cwc27 to
    photoreceptors. Whether the retinal pigment epithelium fails independently
    has not been studied.
  biological_scale: CELLULAR

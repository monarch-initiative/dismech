name: CWC27-Related Retinitis Pigmentosa With or Without Skeletal Anomalies
creation_date: "2026-10-28T05:22:39Z"
category: Mendelian
description: >-
  CWC27-related retinitis pigmentosa with or without skeletal anomalies (RPSKA)
  is an autosomal recessive spliceosomopathy caused by biallelic
  protein-truncating or splice-disrupting variants in CWC27, a
  spliceosome-associated cyclophilin-like protein that joins the activated (Bact)
  spliceosome together with its partner CWC22. Its N-terminal cyclophilin
  domain has lost the catalytic residue and is thought to bind proline rather
  than isomerize it. The disease spans isolated retinal degeneration
  (retinitis pigmentosa, or Leber congenital amaurosis in one child) to a
  syndrome adding brachydactyly, craniofacial anomalies, short stature,
  developmental delay with intellectual disability, and ectodermal features
  such as sparse hair, eyebrows and eyelashes and dental anomalies. Night
  blindness typically begins near age ten and is followed by constriction of
  the visual fields. Severity tracks allele position: C-terminal truncations
  give the retina-restricted form, earlier truncations the syndrome, and the
  same split is reproduced by a hypomorphic C-terminal frameshift mouse
  (late-onset retinal degeneration) versus Cwc27 knockout mice (embryonic
  lethality with growth, craniofacial and limb defects). CWC27 is unusual among
  spliceosome genes in causing both the retinal and the craniofacial-skeletal
  spliceosomopathy phenotypes.

animal_models:
- name: Cwc27 K338fs hypomorphic mouse
  species: Mouse
  genotype: Cwc27(K338fs/K338fs), CRISPR-Cas9 frameshift in exon 11
  publication: PMID:28285769
  description: >-
    Carries a C-terminal frameshift close to the recurrent human
    p.Val335Serfs*13 allele. It is viable and develops late-onset retinal
    degeneration without extraocular disease, matching the retina-restricted
    human form.
  modeled_mechanisms:
  - target: Photoreceptor Degeneration
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Reproduces retinal dysfunction and outer retinal thinning, and its
      degeneration is reduced by AAV8 Cwc27 augmentation.
    limitations: >-
      The allele is hypomorphic and does not model the syndromic disease; mouse
      retina has no macula, and the mice were followed only to about six months.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        The mouse retina is rod-dominated and lacks a macula, so cone-rich
        central retinal involvement seen in patients cannot be assessed.
    readouts:
    - name: Scotopic ERG a-wave and b-wave amplitude
      target: Photoreceptor Degeneration
      direction: DECREASED
      interpretation: Reduced photoreceptor and bipolar responses reflect the retinal dysfunction.
      evidence:
      - reference: PMID:28285769
        reference_title: "Mutations in the Spliceosome Component CWC27 Cause Retinal Degeneration with or without Additional Developmental Anomalies."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "ERG showed that the Cwc27K338fs/K338fs mice have about 50% reduction of a-wave and b-wave amplitudes compared with Cwc27K338fs/+ littermates, indicating a compromised retinal function (Figure 4B)."
        explanation: The measured ERG reduction.
    - name: Outer retina thickness
      target: Photoreceptor Degeneration
      direction: DECREASED
      interpretation: Outer retinal thinning is the histological correlate of photoreceptor loss.
      evidence:
      - reference: PMID:28285769
        reference_title: "Mutations in the Spliceosome Component CWC27 Cause Retinal Degeneration with or without Additional Developmental Anomalies."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "(C) H&E staining shows thinning of outer retina in Cwc27K338fs/K338fs mice at the age of 6 months, suggesting photoreceptor degeneration."
        explanation: Histology at six months.
    evidence:
    - reference: PMID:28285769
      reference_title: "Mutations in the Spliceosome Component CWC27 Cause Retinal Degeneration with or without Additional Developmental Anomalies."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In mice, disruption of exon 1 (tm1Lex) or exon 3 (tm1b) resulted in a wide range of developmental abnormalities with nearly complete embryonic lethality, while the mice with a homozygous frameshift mutation in exon 11 display a late-onset retinal degeneration phenotype."
      explanation: The exon 11 frameshift mouse models the retinal disease.
  - target: Retinal Mis-Splicing With Intron Retention
    relationship: MEASURES
    fidelity: UNKNOWN
    model_scale: CELLULAR
    description: >-
      Retinal bulk and single-cell RNA sequencing reports splicing changes in
      this model.
    limitations: >-
      The splicing changes have not been compared with patient retina, and
      which changes cause photoreceptor death is not shown.
    readouts:
    - name: Retinal alternative splice-site usage and intron retention
      target: Retinal Mis-Splicing With Intron Retention
      direction: ALTERED
      interpretation: Splicing pattern changes in mutant retina.
      evidence:
      - reference: PMID:34726245
        reference_title: "Cwc27, associated with retinal degeneration, functions as a splicing factor in vivo."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Bulk RNA and single cell RNA-sequencing of the mouse retina showed that there were gene expression and splicing pattern changes, including alternative splice site usage and intron retention."
        explanation: The measured splicing changes.
- name: Cwc27 tm1b knockout mouse
  species: Mouse
  genotype: Cwc27(tm1b/tm1b), exon 3 deletion (KOMP)
  publication: PMID:28285769
  description: >-
    A null allele with near-complete pre-weaning lethality. Surviving and
    embryonic homozygotes show growth retardation, dystrophic photoreceptors,
    neural tube closure failure, limb bud and digit defects.
  modeled_mechanisms:
  - target: Impaired Embryonic Growth and Craniofacial-Limb Development
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      Shows a developmental requirement for Cwc27 in growth and in
      craniofacial and limb development.
    limitations: >-
      The null phenotype is far more severe than the human syndrome, whose
      truncating alleles escape complete nonsense-mediated decay and may retain
      residual function; neural tube defects and exencephaly are not human
      features.
    evidence:
    - reference: PMID:28285769
      reference_title: "Mutations in the Spliceosome Component CWC27 Cause Retinal Degeneration with or without Additional Developmental Anomalies."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These phenotypes, though much more severe than the human clinical manifestations, demonstrate the delayed growth as well as compromised craniofacial and limb development in the Cwc27 mutants."
      explanation: The authors' own statement of fidelity and its limit.

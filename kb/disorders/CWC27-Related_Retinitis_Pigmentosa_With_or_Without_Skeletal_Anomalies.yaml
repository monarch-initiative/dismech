- name: Retinal Mis-Splicing With Intron Retention
  conforms_to: "spliceosome_component_dysfunction#Mis-Splicing of a Sensitive Transcript Subset"
  description: >-
    Evidence comes from the Cwc27 K338fs/K338fs mouse retina, where bulk and
    single-cell RNA sequencing found altered splice-site usage and intron
    retention alongside gene expression changes, the first in vivo evidence that
    CWC27 acts as a splicing factor. In a human RPE cell line (hTERT RPE-1),
    CWC27 knock-down changed expression of many of the same genes as CWC22
    knock-down. Which mis-spliced transcripts explain photoreceptor loss is not
    established.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: mRNA splicing, via spliceosome
    term:
      id: GO:0000398
      label: mRNA splicing, via spliceosome
    modifier: ABNORMAL
  evidence:
  - reference: PMID:34726245
    reference_title: "Cwc27, associated with retinal degeneration, functions as a splicing factor in vivo."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Bulk RNA and single cell RNA-sequencing of the mouse retina showed that there were gene expression and splicing pattern changes, including alternative splice site usage and intron retention."
    explanation: Mis-splicing in the hypomorphic mouse retina.
  - reference: PMID:32329775
    reference_title: "Structural and functional insights into CWC27/CWC22 heterodimer linking the exon junction complex to spliceosomes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Knock-down of either CWC27 or CWC22 in immortalized retinal pigment epithelial cells affects numerous common genes, indicating that these proteins cooperate, targeting the same pathways."
    explanation: Gene expression changes after CWC27 depletion in human RPE cells.
  downstream:

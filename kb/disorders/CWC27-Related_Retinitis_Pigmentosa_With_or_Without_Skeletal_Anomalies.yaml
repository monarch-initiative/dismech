    explanation: ClinGen summary of segregation across the curated probands.
pathophysiology:
- name: Biallelic CWC27 Loss-of-Function Variants
  conforms_to: "spliceosome_component_dysfunction#Germline Spliceosome Component Variant"
  description: >-
    Biallelic nonsense, frameshift and canonical splice-site variants truncate
    CWC27. Patient blood RNA and mouse retina show that the mutant transcripts
    escape complete nonsense-mediated decay, so truncated protein may persist.
    CWC27 binds CWC22 directly through its C-terminal region, forming a
    heterodimer that sits in the Bact spliceosome and stabilizes eIF4A3
    binding; the protein binding term records that shown interaction. No
    peptidyl-prolyl isomerase activity term is bound, because the human
    cyclophilin domain lacks a conserved active-site residue and is described
    as catalytically inactive. Allele position predicts severity: C-terminal
    truncations such as p.Val335Serfs*13 cause retina-restricted disease, while
    earlier truncations cause the syndromic form.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: CWC27
    term:
      id: hgnc:10664
      label: CWC27
  molecular_functions:
  - preferred_term: CWC22 binding
    term:
      id: GO:0005515
      label: protein binding
  cellular_components:
  - preferred_term: spliceosomal complex
    term:
      id: GO:0005681
      label: spliceosomal complex
  evidence:
  - reference: CGGV:assertion_95089ec9-1b91-4ee0-a743-a780d123aad0-2025-07-03T160000.000Z
    reference_title: "CWC27 / metaphyseal chondrodysplasia-retinitis pigmentosa syndrome (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "This curation includes ten variants (five nonsense, three frameshift, and two disrupting splicing) that have collectively been reported in ten probands in four publications"
    explanation: The variant spectrum across reported probands.
  - reference: PMID:28285769
    reference_title: "Mutations in the Spliceosome Component CWC27 Cause Retinal Degeneration with or without Additional Developmental Anomalies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Similarly, the affected individuals in families 3 and 7 with a frameshift mutation (p.Val335Serfs∗13) in the C-terminal part of the protein have a milder phenotype, whereas affected individuals with earlier CWC27 protein truncations have craniofacial defects, brachydactyly, short stature, and neurological defects as common features."
    explanation: Genotype-phenotype correlation by truncation position.
  - reference: PMID:28285769
    reference_title: "Mutations in the Spliceosome Component CWC27 Cause Retinal Degeneration with or without Additional Developmental Anomalies."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Furthermore, qRT-PCR on the RNA of the two affected individuals from family 4 showed that the CWC27 mRNA quantity was reduced by only 33%–43% compared with a control subject"
    explanation: In patient fibroblasts, mutant CWC27 transcripts are only partly degraded.
  - reference: PMID:32329775
    reference_title: "Structural and functional insights into CWC27/CWC22 heterodimer linking the exon junction complex to spliceosomes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "By biochemical and structural approaches, we showed that the interaction between the two proteins is direct and mediated by the C-terminus of CWC27 and the MIF4G domain of CWC22."
    explanation: Direct CWC27-CWC22 binding, the basis of the protein binding term.
  - reference: PMID:32329775
    reference_title: "Structural and functional insights into CWC27/CWC22 heterodimer linking the exon junction complex to spliceosomes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "CWC27 and CWC22 are bound together outside of the spliceosome before being integrated together in the Bact spliceosome in which the heterodimer forms a stable landing platform for eIF4A3."
    explanation: Places the heterodimer in the Bact spliceosome.
  - reference: PMID:25478830
    reference_title: "Structure and evolution of the spliceosomal peptidyl-prolyl cis-trans isomerase Cwc27."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "This analysis revealed the specific loss of a crucial active-site residue in higher eukaryotic Cwc27 proteins, suggesting that the protein evolved from a prolyl isomerase to a pure proline binder."
    explanation: Why no isomerase activity term is bound on this node.
  downstream:

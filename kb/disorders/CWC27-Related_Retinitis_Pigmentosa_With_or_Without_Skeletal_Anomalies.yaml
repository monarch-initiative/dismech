discussions:
- discussion_id: cwc27_gene_augmentation_human_translation
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Photoreceptor Degeneration
  prompt: >-
    Would AAV gene augmentation of CWC27 in photoreceptors, which reduces
    degeneration in the hypomorphic K338fs mouse, help patients with the
    retina-restricted or syndromic disease?
  rationale: >-
    The rescue was shown only in a hypomorphic mouse allele with late-onset
    degeneration, while most patients carry earlier truncations and many have
    systemic disease. Whether human photoreceptors are still present at the
    age of diagnosis, and whether the truncated proteins interfere with the
    transgene, are untested.
  evidence:
  - reference: PMID:37479075
    reference_title: "Gene augmentation therapy to rescue degenerative photoreceptors in a Cwc27 mutant mouse model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In this study, we demonstrated that subretinal injection of AAV8-GRK-Cwc27-FLAG in mutant mice can improve the functionality and morphology of the retina."
    explanation: The mouse rescue result whose human relevance is open.
notes: >-
  MONDO names this disease metaphyseal chondrodysplasia-retinitis pigmentosa
  syndrome after the historical OMIM title; ClinGen lumps isolated and
  syndromic CWC27 cases under one disease because the mechanism and
  inheritance do not differ, and this entry does the same. Metaphyseal
  chondrodysplasia itself is not described in the CWC27 reports used here, so
  it is not curated as a phenotype.

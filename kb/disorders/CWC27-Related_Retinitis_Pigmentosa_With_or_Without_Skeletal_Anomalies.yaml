- name: Impaired Embryonic Growth and Craniofacial-Limb Development
  description: >-
    Complete loss of Cwc27 in knockout mice (tm1b, tm1Lex) causes near-complete
    embryonic lethality, growth retardation, neural tube closure failure,
    absent limb buds and delayed digit separation. These are much more severe
    than the human syndrome but point to a developmental requirement for CWC27
    that the hypomorphic retinal mouse does not show. Whether mis-splicing in
    neural crest, limb or brain precursors is the operative step has not been
    shown, so this node is linked to the variant node without a mis-splicing
    intermediate, and the neurodevelopmental features are attached to it
    without a known mechanism.
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:28285769
    reference_title: "Mutations in the Spliceosome Component CWC27 Cause Retinal Degeneration with or without Additional Developmental Anomalies."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Specifically, at E12.5, we observed marked growth retardation, neural tube closure failure, and absence of limb buds in Cwc27tm1b/tm1b embryos with the most severe defects (Figure 3I)."
    explanation: Developmental defects in knockout embryos.
  - reference: PMID:28285769
    reference_title: "Mutations in the Spliceosome Component CWC27 Cause Retinal Degeneration with or without Additional Developmental Anomalies."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These phenotypes, though much more severe than the human clinical manifestations, demonstrate the delayed growth as well as compromised craniofacial and limb development in the Cwc27 mutants."
    explanation: Authors relate the knockout defects to the human syndrome.
  downstream:

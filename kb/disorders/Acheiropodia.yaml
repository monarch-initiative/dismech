name: Acheiropodia
creation_date: '2026-10-08T15:37:22Z'
description: >-
  Acheiropodia is a very rare autosomal recessive congenital limb reduction
  disorder in which all four limbs show a stereotyped bilateral terminal
  transverse deficiency: the distal humerus and the distal tibial diaphysis are
  truncated, the radius, ulna and fibula are absent, and the hands and feet do
  not form. No other organ system is involved and heterozygous carriers are
  unaffected. Nearly all reported families are Brazilian and carry a homozygous
  deletion of about 12 kb that removes exon 4 of LMBR1 while leaving the
  intron-5 ZRS enhancer of SHH intact. The deleted interval has no enhancer
  activity of its own; it carries three CTCF sites that anchor the long-range
  contact between the ZRS and the SHH promoter, and in patient cells that
  contact is lost. The disease is therefore modelled as a
  loss-of-regulatory-contact disorder in which limb-bud SHH expression is presumed to fail, the
  opposite direction of travel from the gain-of-ectopic-expression ZRS
  malformations curated in ZRS-Related Limb Malformation.
category: Mendelian
parents:
- Congenital Disorder
- Limb Malformation
synonyms:
- acheiropody
- ACHP
- handless and footless families of Brazil

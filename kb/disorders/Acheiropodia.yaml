pathophysiology:
- name: LMBR1 Exon 4 Region Deletion
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    Homozygous deletion of the interval surrounding LMBR1 exon 4 (about 12 kb in
    the Brazilian founder allele). The deletion removes three CTCF-bound sites
    (LSC3-5) in convergent orientation to SHH, which lies about 1 Mb away and is
    itself intact. LMBR1 is the host of the deleted sequence, not the proposed
    effector.
  genetic_context:
    allele_type: homozygous ~12 kb deletion encompassing LMBR1 exon 4
    variant_type: deletion

diagnosis:
- name: Skeletal radiography of the limb stumps
  description: >-
    Plain radiographs define which skeletal elements are truncated or absent and
    identify residual ossicles such as the Bohomoletz bone, which distinguishes
    the acheiropodia pattern from other transverse limb deficiencies.
  diagnosis_term:
    preferred_term: radiography of the limbs
    term:
      id: NCIT:C38101
      label: X-Ray Imaging
  evidence:
  - reference: PMID:11090342
    reference_title: "Acheiropodia is caused by a genomic deletion in C7orf2, the human orthologue of the Lmbr1 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      small fingerlike appendages, bilaterally, which, on x-ray have been
      recognized as the Bohomoletz bone.
    explanation: >-
      Radiographs were used to identify residual stump structures as the
      Bohomoletz bone in an affected proband.
- name: Molecular detection of the LMBR1 exon 4 deletion
  description: >-
    Confirmation by detecting the homozygous deletion around LMBR1 exon 4, by a
    targeted genomic or transcript assay for the known founder allele or by
    whole-genome sequencing that can resolve structural variants. Coding-only
    exome analysis may miss a deletion whose effect is regulatory.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:11090342
    reference_title: "Acheiropodia is caused by a genomic deletion in C7orf2, the human orthologue of the Lmbr1 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The deletion was identified at both the genomic-DNA and mRNA level.
    explanation: >-
      The founder deletion is detectable in genomic DNA and as an
      exon-4-skipped transcript.
  - reference: PMID:33863876
    reference_title: "Deletion of CTCF sites in the SHH locus alters enhancer-promoter interactions and leads to acheiropodia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Using whole-genome sequencing, we fine-mapped the acheiropodia-associated
      region to 12 kb and show that it does not function as an enhancer.
    explanation: >-
      Whole-genome sequencing resolved the deletion breakpoints in a proband.
animal_models:
- name: Mouse ZRS targeted deletion
  species: Mus musculus
  genotype: Homozygous targeted deletion of the ZRS in Lmbr1 intron 5
  publication: PMID:15677727
  description: >-
    Targeted deletion of the conserved intronic limb enhancer abolishes limb-bud
    Shh expression and truncates the limbs distal to the stylopod-zeugopod
    junction, phenocopying acheiropodia.
  modeled_mechanisms:
  - target: Loss of Limb-Bud SHH Expression
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: >-
      Removing the enhancer abolishes limb-bud Shh expression, the presumed
      consequence of the human deletion.
    limitations: >-
      The mouse allele deletes the enhancer itself, whereas the Brazilian human
      allele spares the ZRS and removes CTCF scaffold sites; it models the
      expression endpoint, not the contact-loss route.
    evidence:
    - reference: PMID:15677727
      reference_title: "Elimination of a long-range cis-regulatory module causes complete loss of limb-specific Shh expression and truncation of the mouse limb."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        deletion of this conserved intronic sequence by targeted mutation in the
        mouse results in a complete loss of Shh expression in the limb bud
      explanation: >-
        Directly measures loss of limb-bud Shh in the model.
  - target: Failure of Distal Limb Skeletal Element Formation
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: TISSUE
    description: >-
      Distal skeletal elements degenerate at the same proximodistal level as in
      acheiropodia.
    evidence:
    - reference: PMID:15677727
      reference_title: "Elimination of a long-range cis-regulatory module causes complete loss of limb-specific Shh expression and truncation of the mouse limb."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        complete loss of Shh expression in the limb bud and degeneration of
        skeletal elements distal to the stylopod/zygopod junction
      explanation: >-
        The skeletal outcome matches the human truncation pattern.
- name: Mouse orthologous 12 kb acheiropodia-region knockout
  species: Mus musculus
  genotype: Homozygous deletion of the mouse sequence orthologous to the human 12 kb acheiropodia deletion
  publication: PMID:33863876
  description: >-
    Knockout of the orthologous 12 kb region has no limb phenotype and no change
    in limb Shh expression, attributed to differences in CTCF site number and
    orientation between the mouse and human loci.
  modeled_mechanisms:
  - target: Loss of ZRS-SHH Promoter Chromatin Contact
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      The orthologous deletion does not reproduce the human disease, so the
      mouse cannot be used to test the contact-loss mechanism.
    limitations: >-
      The mouse orthologous region carries a different set of CTCF motifs and
      shows poor conservation with the human interval.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: INVALIDATING
      description: >-
        Mouse has one CTCF peak in the orthologous interval where human has
        three convergent sites (LSC3-5), so the deletion does not remove the
        scaffold the human allele removes.
    evidence:
    - reference: PMID:33863876
      reference_title: "Deletion of CTCF sites in the SHH locus alters enhancer-promoter interactions and leads to acheiropodia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Mouse knockouts of the orthologous 12 kb sequence have no apparent
        abnormalities, showcasing the challenges in modelling CTCF alterations in
        animal models due to inherent motif differences between species.
      explanation: >-
        Reports the negative mouse result and its species-difference
        explanation.
references:
- reference: PMID:11090342
  title: Acheiropodia is caused by a genomic deletion in C7orf2, the human orthologue of the Lmbr1 gene.
- reference: PMID:33863876
  title: Deletion of CTCF sites in the SHH locus alters enhancer-promoter interactions and leads to acheiropodia.
notes: >-
  Acheiropodia is curated separately from ZRS-Related Limb Malformation. Both
  map to the LMBR1-SHH locus, but the ZRS spectrum arises from heterozygous
  gain-of-ectopic-expression alleles producing polydactyly, while acheiropodia
  arises from homozygous deletions that remove regulatory contact and produce
  limb reduction. No treatment is curated: no source describing management
  beyond case descriptions was found in a PubMed search for acheiropodia
  (32 records, 2026-10-08). The orthopaedic case report PMID:7929505 has no
  PubMed abstract, so it could not be quoted.
  The falcon deep-research report (research/Acheiropodia-deep-research-falcon.md)
  agreed with the curated phenotype pattern and causal chain and added one
  mechanistic source used here (PMID:40604280). It also describes general
  prosthetic and rehabilitation care, but with no acheiropodia-specific
  outcome source, so no treatment is curated from it.

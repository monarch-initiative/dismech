      lesion.
  - reference: PMID:33863876
    reference_title: "Deletion of CTCF sites in the SHH locus alters enhancer-promoter interactions and leads to acheiropodia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Using whole-genome sequencing, we fine-mapped the acheiropodia-associated
      region to 12 kb and show that it does not function as an enhancer.
    explanation: >-
      Refines the deletion to 12 kb and shows it is not an enhancer, pointing to
      a structural rather than enhancer-loss mechanism.
  downstream:
  - target: Loss of ZRS-SHH Promoter Chromatin Contact
    causal_link_type: DIRECT
    description: >-
      Removing the CTCF scaffold sites abolishes the ZRS-SHH promoter contact in
      patient cells.
    evidence:
    - reference: PMID:33863876
      reference_title: "Deletion of CTCF sites in the SHH locus alters enhancer-promoter interactions and leads to acheiropodia."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        CTCF and RAD21 ChIP-seq together with 4C-seq and DNA FISH identify three
        CTCF sites within the acheiropodia-deleted region that mediate the
        interaction between the ZRS and the SHH promoter.
      explanation: >-
        Chromatin assays in patient and control lymphoblastoid cells show that
        the deleted CTCF sites mediate the ZRS-SHH promoter interaction.
- name: Loss of ZRS-SHH Promoter Chromatin Contact
  biological_scale: MOLECULAR
  description: >-
    In cells homozygous for the deletion, the SHH promoter no longer interacts
    with the ZRS and instead shows increased interaction with a CTCF site (LSC1)
    centromeric to the ZRS. This was measured in lymphoblastoid cells, not in
    embryonic limb mesenchyme.
  biological_processes:
  - preferred_term: CTCF-mediated ZRS-SHH promoter looping
    term:
      id: GO:0140588
      label: chromatin looping
    modifier: ABNORMAL
  genes:
  - preferred_term: SHH
    term:
      id: hgnc:10848
      label: SHH
  evidence:
  - reference: PMID:33863876
    reference_title: "Deletion of CTCF sites in the SHH locus alters enhancer-promoter interactions and leads to acheiropodia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      we did not observe interactions with the ZRS and instead saw increased
      interactions between the SHH promoter and LSC1
    explanation: >-
      4C-seq from the SHH promoter in proband cells shows loss of ZRS contact
      and a substituted contact with LSC1.
  - reference: PMID:33863876
    reference_title: "Deletion of CTCF sites in the SHH locus alters enhancer-promoter interactions and leads to acheiropodia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      This interaction is substituted with other CTCF sites centromeric to the
      ZRS in the disease state.
    explanation: >-
      Summarizes the rewired contact in the disease state.
  downstream:
  - target: Loss of Limb-Bud SHH Expression
    causal_link_type: UNKNOWN
    description: >-
      Loss of enhancer-promoter contact is proposed to prevent ZRS-driven SHH
      transcription in the limb bud. This step is inferred. SHH expression in
      the embryonic limb bud has not been measured for the human allele; the
      only human measurement is in EBV-transformed lymphoblastoid cells, where
      SHH mRNA was low overall and lower in proband than wild-type cells. The
      orthologous mouse deletion leaves Shh expression unchanged because mouse
      CTCF architecture differs. Mouse data cut both ways: deleting CTCF sites
      around the ZRS reduced limb Shh by about half with no limb phenotype,
      whereas an inversion that disrupted ZRS-Shh contact abolished ZPA Shh
      and truncated the limb. A partial contact defect may therefore not be
      enough, and how completely the human deletion silences limb SHH is
      unknown.
    evidence:
    - reference: PMID:33863876
      reference_title: "Deletion of CTCF sites in the SHH locus alters enhancer-promoter interactions and leads to acheiropodia."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: >-
        We also checked the mRNA expression of SHH in the wild-type and mutant
        cells, observing overall low expression levels that were significantly
        higher in wild-type versus proband cells
      explanation: >-
        Reduced SHH expression in proband cells is consistent with the lost
        contact lowering SHH output. It is indirect because these are
        EBV-transformed lymphoblastoid cells, not limb-bud mesenchyme, and SHH
        is barely expressed in them.
    - reference: PMID:33863876
      reference_title: "Deletion of CTCF sites in the SHH locus alters enhancer-promoter interactions and leads to acheiropodia."
      supports: REFUTE
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      quote_role: BACKGROUND
      snippet: >-
        Although these triple deletions led to a 52% reduction of Shh expression
        in E10.5 limb buds, no limb abnormalities were observed.
      explanation: >-
        Summarizes an earlier mouse study (Paliou et al.) in which deleting CTCF
        sites around the ZRS weakened ZRS-Shh interaction and halved limb Shh
        without truncating the limb. This argues that losing CTCF-mediated
        contact does not by itself abolish limb SHH, at least in mouse.
    - reference: PMID:33863876
      reference_title: "Deletion of CTCF sites in the SHH locus alters enhancer-promoter interactions and leads to acheiropodia."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      quote_role: BACKGROUND
      snippet: >-
        This led to a complete loss of Shh expression in the ZPA and a limb
        truncation phenotype, similar to the ZRS homozygous knockout.
      explanation: >-
        Summarizes an earlier mouse study (Symmons et al.) in which a 450 kb
        inversion disrupting ZRS-Shh interaction abolished ZPA Shh and
        truncated the limb, showing that losing the contact can be enough to
        cause an acheiropodia-like phenotype.
    - reference: PMID:33863876
      reference_title: "Deletion of CTCF sites in the SHH locus alters enhancer-promoter interactions and leads to acheiropodia."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: OTHER
      snippet: >-
        We reasoned that the likely cause of the acheiropodia in this proband is
        altered SHH expression during limb development.
      explanation: >-
        The authors' inference linking the lost contact to altered limb SHH
        expression, made from the chromatin data and prior knockout models
        rather than from a limb expression measurement.
    - reference: PMID:40604280
      reference_title: "Range extender mediates long-distance enhancer activity."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        maintains limb activity at short range, but loses its long-range
        activity, resulting in severe limb reduction in knock-in mice.
      explanation: >-
        In mouse, a ZRS with mutated homeodomain motifs that keeps its enhancer activity but cannot act over
        long range still produces severe limb reduction. This shows that
        failure of the long-distance ZRS-SHH communication, rather than loss of
        the enhancer itself, is sufficient for limb reduction; it is indirect
        because the mouse lesion alters ZRS motifs, not the CTCF sites deleted
        in acheiropodia.
- name: Loss of Limb-Bud SHH Expression
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  regulatory_category: mLOE
  conforms_to: limb_digit_patterning_serial_homology#Limb Patterning Signal Perturbation
  description: >-
    Limb-specific loss of SHH expression from the zone of polarizing activity,
    with SHH expression elsewhere unaffected (hence modular loss of
    expression). Direct support comes from mouse: deleting the ZRS abolishes
    limb-bud Shh expression and truncates the limb distal to the
    stylopod-zeugopod junction. Unlike the patterning conformers of the module,
    the consequence here is failure of distal outgrowth rather than altered
    digit number or identity.

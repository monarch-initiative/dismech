        term:
          id: hgnc:13243
          label: LMBR1
      description: >-
        Deleted CTCF sites LSC3-5; the intron-5 ZRS enhancer lies outside the
        deletion.
    zygosity: HOMOZYGOUS
    variant_origin: GERMLINE

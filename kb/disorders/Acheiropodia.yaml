genetic:
- name: LMBR1
  gene_term:
    preferred_term: LMBR1
    term:
      id: hgnc:13243
      label: LMBR1
  affected_regions:
  - name: LMBR1 exon 4 CTCF scaffold region
    chromosomal_region: 7q36
    within_gene:
      preferred_term: LMBR1
      term:
        id: hgnc:13243
        label: LMBR1
    description: >-
      The roughly 12 kb interval around LMBR1 exon 4 removed by the Brazilian
      acheiropodia allele. It carries three CTCF sites (LSC3-5) in convergent
      orientation to SHH and showed no limb enhancer activity in a transgenic
      assay. The ZRS enhancer in LMBR1 intron 5 lies outside the deletion and
      is intact.
  association: >-
    Homozygous deletions within LMBR1 cause acheiropodia. The common Brazilian
    allele removes LMBR1 exon 4 and the CTCF sites that tether the ZRS to the
    SHH promoter; SHH, about 1 Mb away, is the presumed regulatory target.
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    LMBR1 is bound here because the causal deletions physically remove LMBR1
    sequence and because OMIM and MONDO assign acheiropodia to LMBR1. The
    functional evidence does not support loss of the LMBR1 protein as the
    mechanism: Ushiki et al. note that a mouse deletion of Lmbr1 exons 1-3 has
    no limb phenotype and attribute the disease to loss of the CTCF-mediated
    ZRS-SHH promoter contact. The exon-4-skipped transcript and premature stop
    codon reported by Ianakiev et al. are therefore recorded as a consequence of
    the deletion, not as the disease mechanism.
  evidence:
  - reference: PMID:11090342
    reference_title: "Acheiropodia is caused by a genomic deletion in C7orf2, the human orthologue of the Lmbr1 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Analysis of C7orf2, the human orthologue of the mouse Lmbr1 gene,
      identified a deletion in all five families, thus identifying a common
      acheiropodia mutation.
    explanation: >-
      Identifies a shared homozygous LMBR1 (C7orf2) deletion in five Brazilian
      acheiropodia families.
  - reference: PMID:10780921
    reference_title: "A minimalist approach to gene mapping: locating the gene for acheiropodia, by homozygosity analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this region, a maximum two-point LOD score of 3.81 (4.2 with multipoint
      analysis) was achieved, and a homozygous haplotype spanning a region of
      11.7 cM was seen in all affected in this pedigree.
    explanation: >-
      Homozygosity mapping and linkage place the acheiropodia locus at 7q36,
      the region containing LMBR1 and SHH.
  variants:
  - name: Homozygous 12 kb deletion encompassing LMBR1 exon 4
    description: >-
      The common Brazilian founder allele, found homozygous in all five families
      studied by Ianakiev et al. Whole-genome sequencing of one proband refined
      it to a 12 kb deletion surrounding LMBR1 exon 4. At the RNA level it
      produces an LMBR1 transcript lacking exon 4 with a downstream premature
      stop codon. It removes three CTCF sites that tether the ZRS to the SHH
      promoter; the ZRS itself is not deleted and carried no rare variant in
      the sequenced proband.
    gene:
      preferred_term: LMBR1
      term:
        id: hgnc:13243
        label: LMBR1
    regulatory_target_gene:

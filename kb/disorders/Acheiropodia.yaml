    - name: LMBR1 exon 4 CTCF scaffold region
      chromosomal_region: 7q36
      within_gene:
        preferred_term: LMBR1
        term:
          id: hgnc:13243
          label: LMBR1
      description: >-
        The deleted interval containing CTCF sites LSC3-5; it lies within
        LMBR1, centromeric to the intact ZRS enhancer.
    clinical_significance: PATHOGENIC
    functional_effects:
    - function: CTCF-mediated contact between the ZRS enhancer and the SHH promoter
      description: >-
        In patient lymphoblastoid cells the SHH promoter no longer contacts the
        ZRS and instead contacts a CTCF site centromeric to it. Reduced
        limb-bud SHH expression is inferred from this and from mouse ZRS and
        Shh knockouts; limb-bud SHH expression has not been measured for the
        human allele. In patient lymphoblastoid cells SHH mRNA was low overall
        and lower than in wild-type cells.
      type: loss of enhancer-promoter contact
      affected_developmental_stage: embryonic limb development
      regulatory_mechanism: >-
        Deletion of three convergent CTCF sites that act as a scaffold
        bringing the ZRS to the SHH promoter.
    evidence:
    - reference: PMID:33863876
      reference_title: "Deletion of CTCF sites in the SHH locus alters enhancer-promoter interactions and leads to acheiropodia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Using whole-genome sequencing, we fine-mapped the acheiropodia-associated
        region to 12 kb and show that it does not function as an enhancer.
      explanation: >-
        Defines the deletion boundaries in a patient genome and establishes that
        the deleted interval is not itself an enhancer.
    - reference: PMID:11090342
      reference_title: "Acheiropodia is caused by a genomic deletion in C7orf2, the human orthologue of the Lmbr1 gene."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        It leads to the production of a C7orf2 transcript lacking exon 4 and
        introduces a premature stop codon downstream of exon 3.
      explanation: >-
        Reports the transcript-level consequence of the deletion for LMBR1.
  - name: Homozygous 102 kb deletion at 7q36.3 spanning LMBR1
    description: >-
      A nullizygous 102 kb deletion spanning LMBR1, found by molecular
      karyotyping in a Saudi patient with acheiropodia. Ushiki et al. state that
      homozygous ZRS deletion in humans causes acheiropodia; the abstract of the
      original report does not give the breakpoints, so whether this allele
      removes the ZRS itself is recorded from that secondary statement only.
    gene:
      preferred_term: LMBR1
      term:

differential_diagnoses:
- name: Autoimmune hepatitis
  disease_term:
    preferred_term: autoimmune hepatitis
    term:
      id: MONDO:0016264
      label: autoimmune hepatitis
  description: >-
    Early-onset juvenile autoimmune hepatitis shares acute hepatocellular injury
    and jaundice with GCH-AHA but lacks diffuse giant-cell hepatocyte
    transformation, pan-lobular C5b-9 deposition, and Coombs-positive hemolytic
    anemia, while typically exhibiting classic serum autoantibodies and dense
    portal T-cell and B-cell interface inflammation.
  distinguishing_features:
  - Presence of Coombs-positive hemolytic anemia and absence of classic autoimmune hepatitis autoantibodies in GCH-AHA
  - Diffuse hepatocyte giant-cell transformation with pan-lobular C5b-9 complement staining and lobular macrophage-neutrophil infiltrate rather than lymphocyte-rich portal interface hepatitis
  - Less favorable response to conventional immunosuppressive therapy compared with classical juvenile autoimmune hepatitis, alongside potential for permanent treatment-free cure after intensive therapy
  evidence:
  - reference: PMID:23969541
    reference_title: "Humoral immune mechanism of liver injury in giant cell hepatitis with autoimmune hemolytic anemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinical and biochemical features at presentation were generally similar;
      however, the absence of autoantibodies and the presence of Coombs positivity
      did distinguish GCH-AHA from early-onset AIH. Liver biopsy pathology in
      CGH-AHA showed giant cells and little inflammation, whereas AIH showed the
      opposite.
    explanation: Directly contrasts serologic and histopathologic features separating GCH-AHA from early-onset autoimmune hepatitis.
  - reference: PMID:33824929
    reference_title: "Giant cell hepatitis associated with autoimmune hemolytic anemia: an update."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      GCH-AIH has a less favorable response to immunosuppressive treatment
      compared to classical juvenile autoimmune hepatitis (JAIH) and it is
      burdened by high mortality despite aggressive immunosuppression and
      recurrence after liver transplant
    explanation: Contrasts the poorer response to conventional immunosuppression and higher mortality with classical juvenile autoimmune hepatitis.
  - reference: PMID:33824929
    reference_title: "Giant cell hepatitis associated with autoimmune hemolytic anemia: an update."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      While GCH-AHA is progressive in nature as other autoimmune liver disorders,
      it differs significantly from juvenile autoimmune hepatitis (JAIH) in that a
      cure can be achieved after several years of intensive treatment in a portion
      of patients.
    explanation: Highlights the distinct natural history and potential for permanent treatment-free cure compared with juvenile autoimmune hepatitis.

name: Giant Cell Hepatitis With Autoimmune Hemolytic Anemia
creation_date: '2026-05-07T02:03:20Z'
description: >-
  Giant cell hepatitis with autoimmune hemolytic anemia is a rare autoimmune
  disease of infancy and early childhood in which severe liver disease with
  giant-cell transformation of hepatocytes occurs together with Coombs-positive
  autoimmune hemolytic anemia. This entry is scoped to the combined hepatic and
  hematologic syndrome rather than isolated autoimmune hemolytic anemia.
category: Autoimmune Disease
disease_term:
  preferred_term: giant cell hepatitis with autoimmune hemolytic anemia
  term:
    id: MONDO:1060166
    label: giant cell hepatitis with autoimmune hemolytic anemia
parents:
- Autoimmune hepatitis
- Autoimmune hemolytic anemia
synonyms:
- GCH-AHA
- GCH-AIHA
- Giant cell hepatitis associated with autoimmune hemolytic anemia
- Giant cell hepatitis with autoimmune haemolytic anaemia
classifications:
  harrisons_chapter:
  - classification_value: GASTROINTESTINAL
  - classification_value: ONCOLOGY_HEMATOLOGY
  - classification_value: IMMUNE_RHEUMATOLOGIC
prevalence:
- population: Global
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Ultra-rare acquired autoimmune syndrome restricted to infancy and early
    childhood; 54 cases had been reported in the English medical literature
    across Europe, North America, Asia, Africa, and Oceania as of the 2021
    review, primarily as single case reports and small pediatric series.
  evidence:
  - reference: PMID:33824929
    reference_title: "Giant cell hepatitis associated with autoimmune hemolytic anemia: an update."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Giant cell hepatitis associated with autoimmune hemolytic anemia (GCH-AHA) is
      a rare and severe disease characterized by autoimmune hemolysis associated
      with acute liver injury, histologically defined by widespread giant cell
      transformation. It occurs after the neonatal period, most commonly in the
      first year of life and uniquely affects pediatric patients.
    explanation: Establishes that GCH-AHA is a rare disease uniquely affecting pediatric patients, most commonly in the first year of life.
  - reference: PMID:33824929
    reference_title: "Giant cell hepatitis associated with autoimmune hemolytic anemia: an update."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Since its first description, 54 cases have been reported in the English
      medical literature from Europe, North America, Asia, Africa and Oceania
      mainly in the forms of single case reports and more recently as small case
      series.
    explanation: Quantifies cumulative reported cases in the English medical literature across five continents.
pathophysiology:
- name: Systemic B-cell autoimmunity
  biological_scale: CELLULAR
  description: >-
    The syndrome is best supported as a systemic humoral autoimmune disorder:
    Coombs-positive hemolysis distinguishes it from early-onset autoimmune
    hepatitis, and liver injury responds in many refractory cases to B-cell
    depletion.
  downstream:
  - target: Complement-mediated hepatocyte injury
    description: B-cell autoimmunity can drive antibody and complement injury in the liver.
  - target: Coombs-positive erythrocyte destruction
    description: Humoral autoimmunity also produces Coombs-positive hemolytic anemia.
  cell_types:
  - preferred_term: B cell
    term:
      id: CL:0000236
      label: B cell
  locations:
  - preferred_term: blood
    term:
      id: UBERON:0000178
      label: blood
  - preferred_term: spleen
    term:
      id: UBERON:0002106
      label: spleen
  - preferred_term: liver
    term:
      id: UBERON:0002107
      label: liver
  biological_processes:
  - preferred_term: immunoglobulin mediated immune response
    modifier: ABNORMAL
    term:
      id: GO:0016064
      label: immunoglobulin mediated immune response
  - preferred_term: B cell activation
    modifier: INCREASED
    term:
      id: GO:0042113
      label: B cell activation
  evidence:
  - reference: PMID:23969541
    reference_title: "Humoral immune mechanism of liver injury in giant cell hepatitis with autoimmune hemolytic anemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Widespread complement-mediated hepatocyte injury and typical C3a and C5a
      complement-driven liver inflammation along with Coombs-positive hemolytic
      anemia in GCH-AHA provide convincing evidence that systemic B-cell
      autoimmunity plays a central pathologic mechanism in the disease.
    explanation: This mechanistic case series directly identifies systemic B-cell autoimmunity as central to GCH-AHA.
- name: Complement-mediated hepatocyte injury
  biological_scale: TISSUE
  description: >-
    Complement activation injures hepatocytes across the lobule, with C5b-9
    membrane attack complex deposition and an inflammatory pattern enriched for
    macrophages and neutrophils rather than classic portal autoimmune hepatitis.
  downstream:
  - target: Giant cell transformation of hepatocytes
    description: Complement-associated hepatocyte injury contributes to giant-cell transformation on biopsy.
  - target: Elevated hepatic transaminases
    description: Pan-lobular complement-mediated hepatocyte necrosis releases hepatic aminotransferases into the circulation.
  - target: Hepatomegaly
    description: Acute lobular hepatocyte injury and macrophage-neutrophil inflammation produce hepatic enlargement.
  - target: Jaundice
    description: Complement-driven hepatocellular injury impairs bilirubin clearance and contributes to cholestatic jaundice.
  cell_types:

name: Erysipelas
creation_date: "2026-09-26T06:42:40Z"
updated_date: "2026-09-26T06:42:40Z"
category: Infectious Disease
description: >-
  Erysipelas is an acute bacterial infection of the superficial dermis and
  dermal lymphatics caused predominantly by beta-hemolytic streptococci. Skin
  barrier disruption and edema or lymphatic impairment predispose to dermal
  streptococcal inoculation, local streptococcal spread, and
  recurrence driven by persistent or infection-damaged lymphatic drainage.
synonyms:
- St. Anthony's fire
disease_term:
  preferred_term: erysipelas
  term:
    id: MONDO:0001266
    label: erysipelas
parents:
- Bacterial Infection
infectious_agent:
- name: Streptococcus pyogenes
  description: >-
    Group A Streptococcus is one of the principal beta-hemolytic streptococci
    isolated from erysipelas lesions and blood cultures.
  infectious_agent_term:
    preferred_term: Streptococcus pyogenes
    term:
      id: NCBITaxon:1314
      label: Streptococcus pyogenes
  evidence:
  - reference: PMID:26424182
    reference_title: "Erysipelas, a large retrospective study of aetiology and clinical presentation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Wound cultures were taken in 343 episodes and 56 grew group A
      streptococci (GAS), 53 grew group G streptococci (GGS), 11 grew group C
      streptococci (GCS), and 153 grew Staphylococcus aureus.
    explanation: >-
      Large erysipelas cohort identifying group A streptococci among the
      streptococcal isolates cultured from erysipelas episodes.
- name: Streptococcus dysgalactiae subsp. equisimilis
  description: >-
    Group C and group G streptococci, represented by Streptococcus
    dysgalactiae subsp. equisimilis, are frequent beta-hemolytic streptococcal
    agents in lower-extremity cellulitis/erysipelas presentations.
  infectious_agent_term:
    preferred_term: Streptococcus dysgalactiae subsp. equisimilis
    term:
      id: NCBITaxon:119602
      label: Streptococcus dysgalactiae subsp. equisimilis
  evidence:
  - reference: PMID:26734653
    reference_title: "Etiology of Cellulitis and Clinical Prediction of Streptococcal Disease: A Prospective Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      beta-hemolytic group C or G streptococci (GCS/GGS) were more commonly
      isolated than GAS (36 vs 22 cases).
    explanation: >-
      Prospective cellulitis/erysipelas-adjacent data support group C/G
      streptococci as common beta-hemolytic streptococcal causes, especially in
      lower-extremity infection.
pathophysiology:
- name: Predisposing Lymphatic Impairment
  description: >-
    Subclinical or overt lymphatic impairment and leg edema lower local
    clearance capacity in the skin and make the limb susceptible to a first or
    recurrent erysipelas episode.
  locations:
  - preferred_term: lymphatic vessel
    term:
      id: UBERON:0001473
      label: lymphatic vessel
  downstream:
  - target: Cutaneous Barrier Portal of Entry
    description: >-
      Edema and impaired lymphatic drainage act with cutaneous barrier defects
      to permit streptococcal entry and expansion in the dermis.
    evidence:
    - reference: PMID:16484815
      reference_title: "Risk factors for erysipelas of the leg in Tunisia: a multicenter case-control study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        disruption of the cutaneous barrier (i.e. traumatic wound, toe-web
        intertrigo, excoriated leg dermatosis or plantar squamous lesions) and
        leg edema were independently associated with erysipelas of the leg,
        with respective odds ratios of 13.6 (95% confidence interval: 6.0-31)
        and 7.0 (1.3-38).
      explanation: >-
        Case-control data support edema and skin-barrier disruption as
        independent, upstream risk factors for leg erysipelas.
  evidence:
  - reference: PMID:40542699
    reference_title: Prevalence of Pre-Existing Subclinical Leg Lymphedema in Patients with Erysipelas.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Subclinical lymphedema on the unaffected leg was found in 82% of
      patients, with a similar prevalence in all genders and age groups, and in
      patients with or without erysipelas risk factors.
    explanation: >-
      Lymphoscintigraphy shows frequent subclinical lymphatic dysfunction even
      in the clinically unaffected limb of people with erysipelas.
- name: Cutaneous Barrier Portal of Entry
  description: >-
    Traumatic wounds, toe-web intertrigo, excoriated dermatoses, and plantar
    scaling lesions breach the skin and create portals through which
    streptococci can reach the superficial dermis.
  locations:
  - preferred_term: skin
    term:
      id: UBERON:0002097
      label: skin of body
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  downstream:
  - target: Streptococcal Dermal Infection
    description: >-
      A compromised skin barrier enables beta-hemolytic streptococci to enter
      and establish infection in superficial dermis and dermal lymphatics.
    evidence:
    - reference: PMID:15822466
      reference_title: "[Erysipelas. Retrospective study of 647 patients]."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Erysipelas predominately involved in the lower limbs (91.2%).
        Antecedents of erysipelas were found in 26.12 %. Portal of entry was
        found in 76.66% represented essentially by toe-web intertrigo.
      explanation: >-
        Large erysipelas series linking lower-limb disease to portals of entry,
        most often toe-web intertrigo.
  evidence:
  - reference: PMID:16484815
    reference_title: "Risk factors for erysipelas of the leg in Tunisia: a multicenter case-control study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      disruption of the cutaneous barrier (i.e. traumatic wound, toe-web
      intertrigo, excoriated leg dermatosis or plantar squamous lesions) and
      leg edema were independently associated with erysipelas of the leg, with
      respective odds ratios of 13.6 (95% confidence interval: 6.0-31) and 7.0
      (1.3-38).
    explanation: >-
      Demonstrates skin-barrier disruption as a strong, independent risk factor
      for leg erysipelas.
- name: Streptococcal Dermal Infection
  description: >-
    Beta-hemolytic streptococci proliferate in the superficial dermis and
    dermal lymphatics after barrier entry.
  locations:
  - preferred_term: dermis
    term:
      id: UBERON:0002067
      label: dermis
  - preferred_term: lymphatic vessel
    term:
      id: UBERON:0001473
      label: lymphatic vessel
  downstream:
  - target: Post-Erysipelas Lymphatic Damage
    description: >-
      Erysipelas episodes can worsen lymphatic drainage and feed a
      recurrence-prone edema-infection cycle.
    evidence:
    - reference: PMID:40542699
      reference_title: Prevalence of Pre-Existing Subclinical Leg Lymphedema in Patients with Erysipelas.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Moreover, the prevalence of subclinical lymphedema increased
        proportionally with the number of erysipelas episodes: among those with
        a single episode, 74% exhibited subclinical lymphedema, whereas among
        those with 3 or more episodes, the prevalence was 100%.
      explanation: >-
        Episode-count association supports the recurrent erysipelas and
        lymphatic dysfunction amplification cycle.
  evidence:
  - reference: PMID:26734653
    reference_title: "Etiology of Cellulitis and Clinical Prediction of Streptococcal Disease: A Prospective Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Serology or blood or tissue culture confirmed beta-hemolytic
      streptococcal (BHS) etiology in 72% (146 of 203) of cases.
    explanation: >-
      Confirms beta-hemolytic streptococcal etiology for most clinically
      diagnosed cellulitis cases, the diagnostic neighborhood that includes
      erysipelas.
- name: Post-Erysipelas Lymphatic Damage
  description: >-
    Erysipelas episodes can leave or amplify chronic lymphatic impairment,
    predisposing to recurrent infections and chronic swelling.
  locations:
  - preferred_term: lymphatic vessel
    term:
      id: UBERON:0001473
      label: lymphatic vessel
  evidence:
  - reference: PMID:18069381
    reference_title: "[Erysipelas--course of disease, recurrence, complications; a 10 years retrospective study]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Complications, such as abscess formation, lymphangitis, venous
      insufficiency, osteitis, arthritis, septic tendonitis and elephantiasis
      were found in 25%.
    explanation: >-
      Documents lymphatic and chronic swelling complications in a 10-year
      erysipelas cohort.
environmental:
- name: Skin barrier disruption
  presence: PRESENT
  description: >-
    Wounds, toe-web intertrigo, excoriated dermatoses, and plantar scaling
    lesions predispose to leg erysipelas by opening portals of entry in skin.
  influences_mechanisms:
  - target: Cutaneous Barrier Portal of Entry
    environmental_effect: PREDISPOSES
    description: >-
      Mechanical or inflammatory barrier defects increase susceptibility to
      streptococcal dermal entry.
  evidence:
  - reference: PMID:16484815
    reference_title: "Risk factors for erysipelas of the leg in Tunisia: a multicenter case-control study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      disruption of the cutaneous barrier (i.e. traumatic wound, toe-web
      intertrigo, excoriated leg dermatosis or plantar squamous lesions) and
      leg edema were independently associated with erysipelas of the leg, with
      respective odds ratios of 13.6 (95% confidence interval: 6.0-31) and 7.0
      (1.3-38).
    explanation: >-
      Quantifies skin barrier disruption as an upstream erysipelas risk factor.
- name: Leg edema and lymphatic impairment
  presence: PRESENT
  description: >-
    Leg edema, lymphedema, varicose veins, and obesity increase susceptibility
    to lower-limb cellulitis/erysipelas.
  influences_mechanisms:
  - target: Predisposing Lymphatic Impairment
    environmental_effect: PREDISPOSES
    description: >-
      Edematous and lymphatically impaired tissue has diminished local fluid
      clearance and is prone to recurrent streptococcal infection.
  evidence:
  - reference: PMID:29427797
    reference_title: "Severe lower limb cellulitis: defining the epidemiology and risk factors for primary episodes in a population-based case-control study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      varicose veins (AOR 2.95, 95% CI 2.50-3.48, p < 0.001), lymphoedema (AOR
      2.65, 95% CI 1.71-4.10, p < 0.001), tinea pedis (AOR 3.05, 95% CI
      1.45-6.42, p 0.003)
    explanation: >-
      Population-based case-control data identify lymphatic, venous, and fungal
      foot conditions as lower-limb cellulitis/erysipelas risk factors.
treatments:
- name: Penicillin G therapy
  description: >-
    Benzylpenicillin is a narrow-spectrum beta-lactam used for acute
    streptococcal erysipelas.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: benzylpenicillin
      term:
        id: CHEBI:18208
        label: benzylpenicillin
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Streptococcal Dermal Infection
    treatment_effect: INHIBITS
    description: >-
      Penicillin G inhibits the beta-hemolytic streptococci driving the acute
      dermal infection.
  evidence:
  - reference: PMID:15822466
    reference_title: "[Erysipelas. Retrospective study of 647 patients]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Erysipelas can be controlled with antibiotics; treatment is essentially
      based on penicillin G 4 mega units intramuscularly every day (60.58%) for
      mean duration of 10.13 days.
    explanation: >-
      Large erysipelas series supporting intramuscular penicillin G as a common
      erysipelas antibiotic regimen in that cohort.
- name: Penicillin V recurrence prophylaxis
  description: >-
    Oral phenoxymethylpenicillin can be used as low-dose prophylaxis to reduce
    recurrent leg cellulitis/erysipelas episodes while prophylaxis continues.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: phenoxymethylpenicillin
      term:
        id: CHEBI:27446
        label: phenoxymethylpenicillin
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Streptococcal Dermal Infection
    treatment_effect: INHIBITS
    description: >-
      Suppressive oral penicillin reduces recurrence of streptococcal lower-limb
      cellulitis/erysipelas during prophylaxis.
  evidence:
  - reference: PMID:23635049
    reference_title: Penicillin to prevent recurrent leg cellulitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      During the prophylaxis phase, 30 of 136 participants in the penicillin
      group (22%) had a recurrence, as compared with 51 of 138 participants in
      the placebo group (37%) (hazard ratio, 0.55; 95% confidence interval
      [CI], 0.35 to 0.86; P=0.01), yielding a number needed to treat to prevent
      one recurrent cellulitis episode of 5 (95% CI, 4 to 9).
    explanation: >-
      Randomized trial evidence that penicillin V prophylaxis reduces
      recurrence in the overlapping recurrent leg cellulitis/erysipelas
      syndrome.
notes: >-
  MONDO:0001266 refers to streptococcal erysipelas, not erysipeloid or swine
  erysipelas caused by Erysipelothrix rhusiopathiae. The OpenScientist report
  surfaced several Erysipelothrix papers, but those were deliberately excluded
  from this human streptococcal skin-infection entry.

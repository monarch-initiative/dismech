environmental:
- name: Skin barrier disruption
  presence: PRESENT
  description: >-
    Wounds, toe-web intertrigo, excoriated dermatoses, and plantar scaling
    lesions predispose to leg erysipelas by opening portals of entry in skin.
  influences_mechanisms:
  - target: Cutaneous Barrier Portal of Entry
    environmental_effect: PREDISPOSES
    description: >-
      Mechanical or inflammatory barrier defects increase susceptibility to
      streptococcal dermal entry.
  evidence:
  - reference: PMID:16484815
    reference_title: "Risk factors for erysipelas of the leg in Tunisia: a multicenter case-control study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      disruption of the cutaneous barrier (i.e. traumatic wound, toe-web
      intertrigo, excoriated leg dermatosis or plantar squamous lesions) and
      leg edema were independently associated with erysipelas of the leg, with
      respective odds ratios of 13.6 (95% confidence interval: 6.0-31) and 7.0
      (1.3-38).
    explanation: >-
      Quantifies skin barrier disruption as an upstream erysipelas risk factor.
- name: Leg edema and lymphatic impairment
  presence: PRESENT
  description: >-
    Leg edema, lymphedema, varicose veins, and obesity increase susceptibility
    to lower-limb cellulitis/erysipelas.
  influences_mechanisms:
  - target: Predisposing Lymphatic Impairment
    environmental_effect: PREDISPOSES
    description: >-
      Edematous and lymphatically impaired tissue has diminished local fluid
      clearance and is prone to recurrent streptococcal infection.
  evidence:
  - reference: PMID:29427797
    reference_title: "Severe lower limb cellulitis: defining the epidemiology and risk factors for primary episodes in a population-based case-control study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      varicose veins (AOR 2.95, 95% CI 2.50-3.48, p < 0.001), lymphoedema (AOR
      2.65, 95% CI 1.71-4.10, p < 0.001), tinea pedis (AOR 3.05, 95% CI
      1.45-6.42, p 0.003)
    explanation: >-
      Population-based case-control data identify lymphatic, venous, and fungal
      foot conditions as lower-limb cellulitis/erysipelas risk factors.
treatments:
- name: Penicillin G therapy
  description: >-
    Benzylpenicillin is a narrow-spectrum beta-lactam used for acute
    streptococcal erysipelas.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: benzylpenicillin
      term:
        id: CHEBI:18208
        label: benzylpenicillin
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Streptococcal Dermal Infection
    treatment_effect: INHIBITS
    description: >-
      Penicillin G inhibits the beta-hemolytic streptococci driving the acute
      dermal infection.
  evidence:
  - reference: PMID:15822466
    reference_title: "[Erysipelas. Retrospective study of 647 patients]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Erysipelas can be controlled with antibiotics; treatment is essentially
      based on penicillin G 4 mega units intramuscularly every day (60.58%) for
      mean duration of 10.13 days.
    explanation: >-
      Large erysipelas series supporting intramuscular penicillin G as a common
      erysipelas antibiotic regimen in that cohort.
- name: Penicillin V recurrence prophylaxis
  description: >-
    Oral phenoxymethylpenicillin can be used as low-dose prophylaxis to reduce
    recurrent leg cellulitis/erysipelas episodes while prophylaxis continues.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: phenoxymethylpenicillin
      term:
        id: CHEBI:27446
        label: phenoxymethylpenicillin
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Streptococcal Dermal Infection
    treatment_effect: INHIBITS
    description: >-
      Suppressive oral penicillin reduces recurrence of streptococcal lower-limb
      cellulitis/erysipelas during prophylaxis.
  evidence:
  - reference: PMID:23635049
    reference_title: Penicillin to prevent recurrent leg cellulitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      During the prophylaxis phase, 30 of 136 participants in the penicillin
      group (22%) had a recurrence, as compared with 51 of 138 participants in
      the placebo group (37%) (hazard ratio, 0.55; 95% confidence interval
      [CI], 0.35 to 0.86; P=0.01), yielding a number needed to treat to prevent
      one recurrent cellulitis episode of 5 (95% CI, 4 to 9).
    explanation: >-
      Randomized trial evidence that penicillin V prophylaxis reduces
      recurrence in the overlapping recurrent leg cellulitis/erysipelas
      syndrome.
notes: >-
  MONDO:0001266 refers to streptococcal erysipelas, not erysipeloid or swine
  erysipelas caused by Erysipelothrix rhusiopathiae. The OpenScientist report
  surfaced several Erysipelothrix papers, but those were deliberately excluded
  from this human streptococcal skin-infection entry.

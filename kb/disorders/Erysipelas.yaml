name: Erysipelas
creation_date: "2026-09-26T06:42:40Z"
category: Infectious Disease
description: >-
  Erysipelas is an acute bacterial infection of the superficial dermis and
  dermal lymphatics caused predominantly by beta-hemolytic streptococci. Skin
  barrier disruption and edema or lymphatic impairment predispose to dermal
  streptococcal inoculation, local streptococcal spread, and
  recurrence driven by persistent or infection-damaged lymphatic drainage.
synonyms:
- St. Anthony's fire
disease_term:
  preferred_term: erysipelas
  term:
    id: MONDO:0001266
    label: erysipelas
parents:
- Bacterial Infection
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
    evidence:
    - reference: PMID:40542699
      reference_title: Prevalence of Pre-Existing Subclinical Leg Lymphedema in Patients with Erysipelas.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Erysipelas is a common bacterial infection of the skin and subcutaneous
        tissue.
      explanation: >-
        A clinical erysipelas imaging study frames the disorder as a bacterial
        skin infection, supporting its Harrison's infectious-disease
        classification.
infectious_agent:
- name: Streptococcus pyogenes
  description: >-
    Group A Streptococcus is one of the principal beta-hemolytic streptococci
    isolated from erysipelas lesions and blood cultures.
  infectious_agent_term:
    preferred_term: Streptococcus pyogenes
    term:
      id: NCBITaxon:1314
      label: Streptococcus pyogenes
  evidence:
  - reference: PMID:26424182
    reference_title: "Erysipelas, a large retrospective study of aetiology and clinical presentation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Wound cultures were taken in 343 episodes and 56 grew group A
      streptococci (GAS), 53 grew group G streptococci (GGS), 11 grew group C
      streptococci (GCS), and 153 grew Staphylococcus aureus.
    explanation: >-
      Large erysipelas cohort identifying group A streptococci among the
      streptococcal isolates cultured from erysipelas episodes.
- name: Streptococcus dysgalactiae subsp. equisimilis
  description: >-
    Group C and group G streptococci, represented by Streptococcus
    dysgalactiae subsp. equisimilis, are frequent beta-hemolytic streptococcal
    agents in erysipelas.
  infectious_agent_term:
    preferred_term: Streptococcus dysgalactiae subsp. equisimilis
    term:
      id: NCBITaxon:119602
      label: Streptococcus dysgalactiae subsp. equisimilis
  evidence:
  - reference: PMID:26424182
    reference_title: "Erysipelas, a large retrospective study of aetiology and clinical presentation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The GGS isolates as well as the three GCS isolates were determined to be
      Streptococcus dysgalactiae using MALDI-TOF MS.
    explanation: >-
      Large erysipelas cohort identifying Streptococcus dysgalactiae among the
      group G and group C streptococci recovered from positive blood cultures.
pathophysiology:
- name: Predisposing Lymphatic Impairment
  description: >-
    Subclinical or overt lymphatic impairment and leg edema lower local
    clearance capacity in the skin and make the limb susceptible to a first or
    recurrent erysipelas episode.
  locations:
  - preferred_term: lymphatic vessel
    term:
      id: UBERON:0001473
      label: lymphatic vessel
  downstream:
  - target: Streptococcal Dermal Infection
    description: >-
      Leg edema and impaired lymphatic drainage act as an independent local
      susceptibility factor that favors dermal infection after a barrier break
      admits streptococci.
    evidence:
    - reference: PMID:16484815
      reference_title: "Risk factors for erysipelas of the leg in Tunisia: a multicenter case-control study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        disruption of the cutaneous barrier (i.e. traumatic wound, toe-web
        intertrigo, excoriated leg dermatosis or plantar squamous lesions) and
        leg edema were independently associated with erysipelas of the leg,
        with respective odds ratios of 13.6 (95% confidence interval: 6.0-31)
        and 7.0 (1.3-38).
      explanation: >-
        Case-control data support edema and skin-barrier disruption as
        independent, upstream risk factors for leg erysipelas.
  evidence:
  - reference: PMID:40542699
    reference_title: Prevalence of Pre-Existing Subclinical Leg Lymphedema in Patients with Erysipelas.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Subclinical lymphedema on the unaffected leg was found in 82% of
      patients, with a similar prevalence in all genders and age groups, and in
      patients with or without erysipelas risk factors.
    explanation: >-
      Lymphoscintigraphy shows frequent subclinical lymphatic dysfunction even
      in the clinically unaffected limb of people with erysipelas.
- name: Cutaneous Barrier Portal of Entry
  description: >-
    Traumatic wounds, toe-web intertrigo, excoriated dermatoses, and plantar
    scaling lesions breach the skin and create portals through which
    streptococci can reach the superficial dermis.
  locations:
  - preferred_term: skin
    term:
      id: UBERON:0002097
      label: skin of body
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  downstream:
  - target: Streptococcal Dermal Infection
    description: >-
      A compromised skin barrier enables beta-hemolytic streptococci to enter
      and establish infection in superficial dermis and dermal lymphatics.
    evidence:
    - reference: PMID:15822466
      reference_title: "[Erysipelas. Retrospective study of 647 patients]."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Erysipelas predominately involved in the lower limbs (91.2%).
        Antecedents of erysipelas were found in 26.12 %. Portal of entry was
        found in 76.66% represented essentially by toe-web intertrigo.
      explanation: >-
        Large erysipelas series linking lower-limb disease to portals of entry,
        most often toe-web intertrigo.
  evidence:
  - reference: PMID:16484815
    reference_title: "Risk factors for erysipelas of the leg in Tunisia: a multicenter case-control study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      disruption of the cutaneous barrier (i.e. traumatic wound, toe-web
      intertrigo, excoriated leg dermatosis or plantar squamous lesions) and
      leg edema were independently associated with erysipelas of the leg, with
      respective odds ratios of 13.6 (95% confidence interval: 6.0-31) and 7.0
      (1.3-38).
    explanation: >-
      Demonstrates skin-barrier disruption as a strong, independent risk factor
      for leg erysipelas.
- name: Streptococcal Dermal Infection
  description: >-
    Beta-hemolytic streptococci proliferate in the superficial dermis and
    dermal lymphatics after barrier entry.
  locations:
  - preferred_term: dermis
    term:
      id: UBERON:0002067
      label: dermis
  - preferred_term: lymphatic vessel
    term:
      id: UBERON:0001473
      label: lymphatic vessel
  downstream:
  - target: Acute Dermal Inflammatory Response
    description: >-
      Streptococcal infection in superficial dermis and dermal lymphatics
      produces the sharply demarcated inflammatory erythema and early
      constitutional symptoms of acute erysipelas.
    evidence:
    - reference: PMID:26424182
      reference_title: "Erysipelas, a large retrospective study of aetiology and clinical presentation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The clinical picture is characterized by an inflammatory reaction of
        the upper dermis with a sharp demarcation of the erythema.
      explanation: >-
        The cohort review places erysipelas' characteristic erythema at the
        inflammatory upper-dermal response downstream of infection.
  - target: Post-Erysipelas Lymphatic Damage
    description: >-
      Erysipelas episodes can worsen lymphatic drainage and feed a
      recurrence-prone edema-infection cycle.
    evidence:
    - reference: PMID:40542699
      reference_title: Prevalence of Pre-Existing Subclinical Leg Lymphedema in Patients with Erysipelas.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Moreover, the prevalence of subclinical lymphedema increased
        proportionally with the number of erysipelas episodes: among those with
        a single episode, 74% exhibited subclinical lymphedema, whereas among
        those with 3 or more episodes, the prevalence was 100%.
      explanation: >-
        Episode-count association supports the recurrent erysipelas and
        lymphatic dysfunction amplification cycle.
  evidence:
  - reference: PMID:26734653
    reference_title: "Etiology of Cellulitis and Clinical Prediction of Streptococcal Disease: A Prospective Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Serology or blood or tissue culture confirmed beta-hemolytic
      streptococcal (BHS) etiology in 72% (146 of 203) of cases.
    explanation: >-
      Confirms beta-hemolytic streptococcal etiology for most clinically
      diagnosed cellulitis cases, the diagnostic neighborhood that includes
      erysipelas.
- name: Acute Dermal Inflammatory Response
  description: >-
    The acute host response to streptococcal growth in the superficial dermis
    produces bright, well-demarcated erythema and early systemic symptoms such
    as fever and chills.
  locations:
  - preferred_term: dermis
    term:
      id: UBERON:0002067
      label: dermis
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  biological_processes:
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
  downstream:
  - target: Erythema
    description: >-
      Upper-dermal inflammation produces the bright red, shiny erythema used to
      diagnose erysipelas clinically.
    evidence:
    - reference: PMID:41562377
      reference_title: Constitutional symptoms and response to Penicillin G in erysipelas and cellulitis - a monocentric, retrospective, explorative study.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        erysipelas presents clinically as acute, warm, more or less painful,
        bright red erythema with a shiny surface, relatively well-defined
        borders
      explanation: >-
        The retrospective comparison describes the visible erythematous lesion
        that follows acute dermal infection.
  - target: Fever
    description: >-
      Systemic inflammatory signaling during acute erysipelas commonly
      manifests with fever among the early constitutional symptoms.
    evidence:
    - reference: PMID:41562377
      reference_title: Constitutional symptoms and response to Penicillin G in erysipelas and cellulitis - a monocentric, retrospective, explorative study.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Of the patients with erysipelas, 92.1% (70 of 76) reported that they
        had experienced constitutional symptoms in the form of fever, chills,
        shivers, and feeling fatigued or ill at or before detection of the
        erythema
      explanation: >-
        The study documents fever within the early constitutional symptom
        complex that accompanies erysipelas onset.
  - target: Chills
    description: >-
      The same early constitutional inflammatory response can present with
      chills or shivers around erythema onset.
    evidence:
    - reference: PMID:41562377
      reference_title: Constitutional symptoms and response to Penicillin G in erysipelas and cellulitis - a monocentric, retrospective, explorative study.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Of the patients with erysipelas, 92.1% (70 of 76) reported that they
        had experienced constitutional symptoms in the form of fever, chills,
        shivers, and feeling fatigued or ill at or before detection of the
        erythema
      explanation: >-
        Chills were one component of the constitutional syndrome present at or
        before the skin lesion in nearly all erysipelas cases in this cohort.
  - target: Pain
    description: >-
      Local dermal inflammation can make the erythematous lesion painful or
      tender in acute erysipelas.
    evidence:
    - reference: PMID:41562377
      reference_title: Constitutional symptoms and response to Penicillin G in erysipelas and cellulitis - a monocentric, retrospective, explorative study.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Pain was reported in 47 patients with erysipelas (59.5%), the other 34
        patients (43%) had denied having pain.
      explanation: >-
        The cohort documents pain in the infected erythematous site of more than
        half of the erysipelas cases.
- name: Post-Erysipelas Lymphatic Damage
  description: >-
    Erysipelas episodes can leave or amplify chronic lymphatic impairment,
    predisposing to recurrent infections and chronic swelling.
  locations:
  - preferred_term: lymphatic vessel
    term:
      id: UBERON:0001473
      label: lymphatic vessel
  downstream:
  - target: Predisposing Lymphatic Impairment
    description: >-
      Repeated erysipelas episodes increase the prevalence of subclinical
      lymphedema, feeding the lymphatic susceptibility that permits subsequent
      episodes.
    evidence:
    - reference: PMID:40542699
      reference_title: Prevalence of Pre-Existing Subclinical Leg Lymphedema in Patients with Erysipelas.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Moreover, the prevalence of subclinical lymphedema increased
        proportionally with the number of erysipelas episodes: among those with
        a single episode, 74% exhibited subclinical lymphedema, whereas among
        those with 3 or more episodes, the prevalence was 100%.
      explanation: >-
        Episode-count association supports cumulative lymphatic impairment as a
        link from one erysipelas episode to greater susceptibility to the next.
  - target: Lymphedema
    description: >-
      Erysipelas-associated lymphatic damage can persist as chronic lymphedema
      and, in severe cases, elephantiasis.
    evidence:
    - reference: PMID:18069381
      reference_title: "[Erysipelas--course of disease, recurrence, complications; a 10 years retrospective study]."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Complications, such as abscess formation, lymphangitis, venous
        insufficiency, osteitis, arthritis, septic tendonitis and elephantiasis
        were found in 25%.
      explanation: >-
        The 10-year erysipelas cohort lists elephantiasis among complications,
        supporting severe chronic lymphedema as a downstream manifestation.
  - target: Lymphangitis
    description: >-
      Erysipelas involving superficial dermal lymphatics can be complicated by

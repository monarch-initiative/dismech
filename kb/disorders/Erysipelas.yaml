      help differentiate erysipelas from uncomplicated cellulitis.
  - reference: PMID:41562377
    reference_title: Constitutional symptoms and response to Penicillin G in erysipelas and cellulitis - a monocentric, retrospective, explorative study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      erysipelas presents clinically as acute, warm, more or less painful,
      bright red erythema with a shiny surface, relatively well-defined borders
    explanation: >-
      The quoted morphology describes the core clinical lesion used to recognize
      erysipelas.
- name: Streptococcal serology
  description: >-
    Paired acute and convalescent antistreptolysin O and anti-DNase B titers can
    support beta-hemolytic streptococcal etiology when cultures are negative.
  diagnosis_term:
    preferred_term: Diagnostic Serology Testing
    term:
      id: NCIT:C217458
      label: Diagnostic Serology Testing
  results: >-
    Rising or persistently elevated ASO or anti-DNase B titers provide evidence
    of beta-hemolytic streptococcal skin infection.
  evidence:
  - reference: PMID:26734653
    reference_title: "Etiology of Cellulitis and Clinical Prediction of Streptococcal Disease: A Prospective Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Acute and convalescent sera were available in 200 cases. Positive BHS
      serology was found in 71% of cases; 60% of cases were positive for ASO,
      and 30% of cases were positive for ADB (Figure 2B).
    explanation: >-
      Prospective cellulitis and erysipelas-adjacent data show that paired
      streptococcal serology often identifies beta-hemolytic streptococcal
      etiology.
treatments:
- name: Penicillin G therapy
  description: >-
    Benzylpenicillin is a narrow-spectrum beta-lactam used for acute
    streptococcal erysipelas.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: benzylpenicillin
      term:
        id: CHEBI:18208
        label: benzylpenicillin
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Streptococcal Dermal Infection
    treatment_effect: INHIBITS
    description: >-
      Penicillin G inhibits the beta-hemolytic streptococci driving the acute
      dermal infection.
  evidence:
  - reference: PMID:15822466
    reference_title: "[Erysipelas. Retrospective study of 647 patients]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Erysipelas can be controlled with antibiotics; treatment is essentially
      based on penicillin G 4 mega units intramuscularly every day (60.58%) for
      mean duration of 10.13 days.
    explanation: >-
      Large erysipelas series supporting intramuscular penicillin G as a common
      erysipelas antibiotic regimen in that cohort.
  - reference: PMID:41562377
    reference_title: Constitutional symptoms and response to Penicillin G in erysipelas and cellulitis - a monocentric, retrospective, explorative study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of the 60 patients treated with penicillin, 59 patients (98.3%) responded
      within 2 days, revealing fine wrinkling of the skin, followed by fading of
      redness and then reduction of the erythematous area accompanied by an
      improvement of still existing constitutional symptoms.
    explanation: >-
      A retrospective erysipelas cohort documents rapid clinical response in
      nearly all patients treated with penicillin.
- name: Penicillin V recurrence prophylaxis
  description: >-
    Oral phenoxymethylpenicillin can be used as low-dose prophylaxis to reduce
    recurrent leg cellulitis/erysipelas episodes while prophylaxis continues.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: phenoxymethylpenicillin
      term:
        id: CHEBI:27446
        label: phenoxymethylpenicillin
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Streptococcal Dermal Infection
    treatment_effect: INHIBITS
    description: >-
      Suppressive oral penicillin reduces recurrence of streptococcal lower-limb
      cellulitis/erysipelas during prophylaxis.
  evidence:
  - reference: PMID:23635049
    reference_title: Penicillin to prevent recurrent leg cellulitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      During the prophylaxis phase, 30 of 136 participants in the penicillin
      group (22%) had a recurrence, as compared with 51 of 138 participants in
      the placebo group (37%) (hazard ratio, 0.55; 95% confidence interval
      [CI], 0.35 to 0.86; P=0.01), yielding a number needed to treat to prevent
      one recurrent cellulitis episode of 5 (95% CI, 4 to 9).
    explanation: >-
      Randomized trial evidence that penicillin V prophylaxis reduces
      recurrence in the overlapping recurrent leg cellulitis/erysipelas
      syndrome.
  - reference: PMID:28631307
    reference_title: Interventions for the prevention of recurrent erysipelas and cellulitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In terms of recurrence, incidence, and time to next episode, antibiotic is
      probably an effective preventive treatment for recurrent cellulitis of the
      lower limbs in those under prophylactic treatment, compared with placebo
      or no treatment (moderate-certainty evidence).
    explanation: >-
      Cochrane review evidence supports antibiotic prophylaxis for recurrent
      lower-limb cellulitis/erysipelas while treatment continues.
- name: Toe-web intertrigo and wound care
  description: >-
    Detecting and treating toe-web intertrigo, fungal foot disease, and
    traumatic wounds reduces the portal-of-entry substrate for leg erysipelas.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  therapeutic_modality: OTHER
  target_mechanisms:
  - target: Cutaneous Barrier Portal of Entry
    treatment_effect: INHIBITS
    description: >-
      Treating interdigital and traumatic skin lesions closes portals through
      which streptococci enter the dermis.
  evidence:
  - reference: PMID:16484815
    reference_title: "Risk factors for erysipelas of the leg in Tunisia: a multicenter case-control study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Detecting and treating toe-web intertrigo and traumatic wounds should be
      considered in the prevention of erysipelas of the leg.
    explanation: >-
      The case-control study conclusion directly supports portal-of-entry
      management to prevent leg erysipelas.
- name: Compression therapy for lymphedema prevention
  description: >-
    Bilateral leg compression can be used after erysipelas to counter
    lymphedema and reduce the lymphatic susceptibility to recurrence.
  treatment_term:
    preferred_term: Compression Therapy
    term:
      id: NCIT:C157735
      label: Compression Therapy
  therapeutic_modality: BEHAVIORAL
  target_mechanisms:
  - target: Predisposing Lymphatic Impairment
    treatment_effect: INHIBITS
    description: >-
      Compression therapy reduces leg lymphedema, limiting the lymphatic
      drainage impairment that predisposes to recurrent erysipelas.
  evidence:
  - reference: PMID:40542699
    reference_title: Prevalence of Pre-Existing Subclinical Leg Lymphedema in Patients with Erysipelas.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thus, our clinical recommendation suggests bilateral leg compression
      therapy in erysipelas patients to prevent recurrence and lymphedema
      exacerbation.
    explanation: >-
      Lymphoscintigraphy findings led the investigators to recommend bilateral
      leg compression for recurrence prevention and lymphedema control.
notes: >-
  MONDO:0001266 refers to streptococcal erysipelas, not erysipeloid or swine
  erysipelas caused by Erysipelothrix rhusiopathiae. The OpenScientist report
  surfaced several Erysipelothrix papers, but those were deliberately excluded
  from this human streptococcal skin-infection entry.

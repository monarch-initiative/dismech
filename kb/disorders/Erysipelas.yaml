progression:
- phase: Recurrent erysipelas
  notes: >-
    Episodes often recur, especially in limbs with edema or lymphatic
    impairment, maintaining an edema-infection cycle.
  evidence:
  - reference: PMID:18069381
    reference_title: "[Erysipelas--course of disease, recurrence, complications; a 10 years retrospective study]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The recurrent cases occurred in 67.3% cases with lower limb localisation
      in 69.44% cases.
    explanation: >-
      A 10-year retrospective erysipelas cohort documents frequent recurrent

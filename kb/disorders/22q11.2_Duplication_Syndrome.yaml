name: 22q11.2 Duplication Syndrome
creation_date: "2026-08-22T00:00:00Z"
description: >-
  22q11.2 duplication syndrome is a variably penetrant genomic disorder caused by a proximal
  copy-number gain at 22q11.2, commonly involving the reciprocal interval of the 22q11.2 deletion
  syndrome. Recurrent rearrangements arise through nonallelic homologous recombination between
  low-copy repeats. Carriers range from apparently unaffected to individuals with developmental
  or learning difficulties, autism, hypotonia, and congenital anomalies. Cardiac, palatal, endocrine,
  hearing, immune, and other medical findings can be clinically important even when developmental
  concerns prompted testing. Specific gene-to-phenotype mechanisms remain incompletely resolved,
  and an apparently unaffected transmitting parent does not predict a mild outcome in a child.
category: Genetic
synonyms:
- chromosome 22q11.2 microduplication syndrome
- dup22q11 syndrome
- 22q11.2 microduplication syndrome
parents:
- hereditary disease
- chromosomal disorder

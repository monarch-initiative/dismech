- reference: PMID:36648576
  title: >-
    Clinical Practice Guidelines for the Immunological Management of Chromosome 22q11.2 Deletion
    Syndrome and Other Defects in Thymic Development.
notes: >-
  The clinical baseline here is the proximal duplication, including the common LCR22A-D and
  shorter proximal duplication. Central nested LCR22B-D duplications are considered as comparative
  evidence about candidate genes; their cohort frequencies are not pooled with typical proximal
  duplications. The GeneReviews chapter is retired and is cited as a historical baseline; later
  duplication-specific cohorts support the broader medical screening recommendations.
discussions:
- kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Increased Dosage of 22q11.2 Genes
  prompt: >-
    Which duplicated genes and modifying factors account for the different neurodevelopmental
    and congenital outcomes among carriers?
  rationale: >-
    TBX1 is a candidate contributor to cardiac findings, but this does not establish a hypermorphic
    allele or a complete mechanism for proximal duplication syndrome. Comparative central-duplication
    studies nominate other candidates such as PI4KA and explicitly leave functional effects
    and additional diagnoses unresolved.
  evidence:
  - reference: PMID:30614210
    reference_title: >-
      Atypical nested 22q11.2 duplications between LCR22B and LCR22D are associated with neurodevelopmental
      phenotypes including autism spectrum disorder with incomplete penetrance.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The functional effect of this duplication and the clinical significance is currently unclear.
    explanation: >-
      The discussion of a partial PI4KA duplication cautions against equating genomic gain with
      established functional gain.

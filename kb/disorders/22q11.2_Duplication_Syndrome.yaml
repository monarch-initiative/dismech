    reference_title: >-
      22q11.2 duplication syndrome: elevated rate of autism spectrum disorder and need for medical
      screening.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      These practitioners should be aware of the need for children with 22q11.2DupS to undergo
      medical
      screening including echocardiogram, renal ultrasound, cervical spine x-rays, immunologic
      testing

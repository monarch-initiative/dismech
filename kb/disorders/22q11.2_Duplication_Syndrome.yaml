name: 22q11.2 Duplication Syndrome
creation_date: "2026-08-22T00:00:00Z"
description: >-
  22q11.2 duplication syndrome is the reciprocal copy-number gain of the region
  deleted in 22q11.2 deletion syndrome (DiGeorge / velocardiofacial syndrome),
  generated by non-allelic homologous recombination between the same flanking
  low-copy repeats (LCR22s). Increased dosage of the interval genes — including the
  dosage-sensitive gene TBX1 — produces an extremely variable phenotype ranging from
  normal or minimally affected through learning disability and congenital defects.
  Penetrance is markedly reduced: the duplication is frequently inherited from a
  phenotypically normal or minimally affected parent. Affected individuals are at
  increased risk of congenital heart disease, palatal anomalies, and a range of
  gastrointestinal, endocrine, ophthalmologic, musculoskeletal, and neurologic
  problems, and are managed according to 22q11.2 deletion syndrome guidelines.
category: Genetic

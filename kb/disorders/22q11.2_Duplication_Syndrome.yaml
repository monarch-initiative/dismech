pathophysiology:
- name: Nonallelic Homologous Recombination at LCR22
  biological_scale: MOLECULAR
  description: >-
    Homologous low-copy repeats at chromosome 22q11.2 provide substrates for recurrent nonallelic
    recombination.
  evidence:
  - reference: PMID:30614210
    reference_title: >-
      Atypical nested 22q11.2 duplications between LCR22B and LCR22D are associated with neurodevelopmental
      phenotypes including autism spectrum disorder with incomplete penetrance.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Chromosome 22q11.2 contains eight highly homologous low copy repeat (LCR) sequences that
      are
      named LCR22A to LCR22H and that predispose the region to recurrent deletions and duplications
      by nonallelic homologous recombination (NAHR)
    explanation: >-
      The introduction describes the established rearrangement mechanism of the proximal 22q11.2
      region.
  downstream:
  - target: 22q11.2 Microduplication
    causal_link_type: DIRECT
    description: Recombination between these repeats can generate the reciprocal copy-number gain.
    evidence:
    - reference: PMID:30614210
      reference_title: >-
        Atypical nested 22q11.2 duplications between LCR22B and LCR22D are associated with neurodevelopmental
        phenotypes including autism spectrum disorder with incomplete penetrance.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: >-
        Chromosome 22q11.2 contains eight highly homologous low copy repeat (LCR) sequences
        that are
        named LCR22A to LCR22H and that predispose the region to recurrent deletions and duplications
        by nonallelic homologous recombination (NAHR)
      explanation: >-
        Supports the recurrent duplication as a product of LCR-mediated recombination.
- name: 22q11.2 Microduplication
  biological_scale: MOLECULAR
  description: >-
    A proximal tandem duplication adds a copy of the affected chromosome 22q11.2 interval. Common
    duplications are approximately 3 Mb or 1.5 Mb; the larger recurrent interval extends from
    LCR22A to LCR22D.
  evidence:
  - reference: PMID:20301749
    reference_title: 22q11.2 Duplication – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      22q11.2 duplication is defined for this GeneReview as the presence of a common 3-Mb or
      1.5-Mb
      proximal tandem duplication.
    explanation: >-
      Defines the common proximal tandem duplications.
  - reference: PMID:27158440
    reference_title: >-
      22q11.2 duplication syndrome: elevated rate of autism spectrum disorder and need for medical
      screening.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      All participants in the 22q11.2DupS and 22q11.2DS groups had a typical (LCR-A to LCR-D)
      duplication
      or deletion as confirmed with clinical or research testing via SNP microarray or multiplex
      ligation
      probe amplification.
    explanation: >-
      The typical duplication cohort was confirmed to carry LCR-A to LCR-D gains.
  downstream:
  - target: Increased Dosage of 22q11.2 Genes
    causal_link_type: DIRECT
    description: The additional interval increases genomic copy number for genes contained within it.
- name: Increased Dosage of 22q11.2 Genes
  biological_scale: MOLECULAR
  description: >-
    Genes within the duplicated interval have increased genomic copy number. This does not establish
    proportional RNA or protein overexpression for every gene, or a hypermorphic TBX1 allele.
    The contribution of individual genes and intervening developmental processes to the variable
    clinical phenotype remains incompletely resolved.
  evidence:
  - reference: PMID:20301749
    reference_title: 22q11.2 Duplication – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      22q11.2 duplication is defined for this GeneReview as the presence of a common 3-Mb or
      1.5-Mb
      proximal tandem duplication.
    explanation: >-
      A tandem duplication increases the genomic dosage of its included loci.
    directness: INDIRECT
  downstream:

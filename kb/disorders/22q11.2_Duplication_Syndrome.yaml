pathophysiology:
- name: 22q11.2 Microduplication
  biological_scale: MOLECULAR
  description: >-
    A copy-number gain of the 22q11.2 (LCR22A-D) interval — the reciprocal event of
    the 22q11.2 deletion — generated by non-allelic homologous recombination between
    the same flanking low-copy repeats. It raises the dosage of the interval genes,
    including the dosage-sensitive gene TBX1.
  evidence:
  - reference: PMID:18707033
    reference_title: "Clinical variability of the 22q11.2 duplication syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The 22q11.2 duplication syndrome is an extremely variable disorder with a phenotype ranging from normal to learning disability and congenital defects."
    explanation: Establishes the reciprocal duplication as an extremely variable disorder.
  downstream:
  - target: Increased Dosage of 22q11.2 Genes
    causal_link_type: DIRECT
    description: The duplication raises the dosage of the interval genes, including TBX1.
- name: Increased Dosage of 22q11.2 Genes
  biological_scale: MOLECULAR
  description: >-
    Increased dosage of the 22q11.2 interval genes (notably TBX1, dosage-sensitive
    for cardiac/pharyngeal development) drives a variably penetrant multisystem
    phenotype. Penetrance is markedly reduced, so the same duplication can be
    minimally symptomatic in one carrier and cause congenital defects in another.
  genetic_context:
    gene:
      preferred_term: TBX1
      term:
        id: hgnc:11592
        label: TBX1
    functional_impact_category: HYPERMORPHIC
  evidence:
  - reference: PMID:18707033
    reference_title: "Clinical variability of the 22q11.2 duplication syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In a majority of the reported cases where parents have been tested, the duplication seems to have been inherited from a normal parent with minor abnormalities."
    explanation: Documents the markedly reduced penetrance (inheritance from minimally affected parents).
  downstream:
  - target: Congenital Heart Defects
    causal_link_type: DIRECT
  - target: Palatal Anomalies
    causal_link_type: DIRECT
  - target: Learning Disability
    causal_link_type: DIRECT

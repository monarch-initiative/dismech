genetic:
- name: 22q11.2 duplication (LCR22A-D)
  association: Causal
  notes: >-
    Copy-number gain of the 22q11.2 (LCR22A-D) interval — the reciprocal of the
    22q11.2 deletion — mediated by non-allelic homologous recombination between the
    flanking low-copy repeats. Frequently inherited from a phenotypically normal or
    minimally affected parent, reflecting markedly reduced penetrance. No coordinate
    slot exists in the schema; the duplication is recorded here in prose.
  evidence:
  - reference: PMID:18707033
    reference_title: "Clinical variability of the 22q11.2 duplication syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In a majority of the reported cases where parents have been tested, the duplication seems to have been inherited from a normal parent with minor abnormalities."
    explanation: Documents frequent inheritance from a minimally affected parent (reduced penetrance).
- name: TBX1
  gene_term:
    preferred_term: TBX1
    term:
      id: hgnc:11592
      label: TBX1
  association: Risk Factor
  relationship_type: SUSCEPTIBILITY
  notes: >-
    TBX1 is the dosage-sensitive gene of the 22q11.2 interval, central to cardiac
    and pharyngeal-apparatus development. Increased TBX1 dosage from the duplication
    is the presumed driver of the cardiac/palatal features (the copy-number inverse
    of TBX1 loss in 22q11.2 deletion syndrome).
diagnosis:
- name: Chromosomal Microarray
  presence: 22q11.2 copy-number gain
  notes: >-
    Detected by chromosomal microarray. Family members should be offered testing
    because of the frequent inheritance from minimally affected parents; management
    follows 22q11.2 deletion syndrome guidelines.
  evidence:
  - reference: PMID:34845825
    reference_title: "22q11.2 duplications: Expanding the clinical presentation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "managed according to the 22q11.2 deletion syndrome guidelines."
    explanation: Management follows the established 22q11.2 deletion syndrome guidelines.

genetic:
- name: Proximal 22q11.2 duplication
  association: Causal
  notes: >-
    A recurrent copy-number gain, commonly approximately 3 Mb or 1.5 Mb. This is a contiguous
    genomic interval rather than a demonstrated single-gene hypermorphic disorder. Both inherited
    and de novo events occur; the inherited genomic change can be associated with markedly different
    phenotypes within one family.
  evidence:
  - reference: PMID:20301749
    reference_title: 22q11.2 Duplication – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      22q11.2 duplication is defined for this GeneReview as the presence of a common 3-Mb or
      1.5-Mb
      proximal tandem duplication.
    explanation: >-
      Defines the causal copy-number variant class.
  - reference: PMID:18707033
    reference_title: "Clinical variability of the 22q11.2 duplication syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In a majority of the reported cases where parents have been tested, the
      duplication seems to have been inherited from a normal parent with minor
      abnormalities.
    explanation: >-
      Establishes that inheritance from a minimally affected parent predominates, the basis
      for the reduced-penetrance classification.
diagnosis:
- name: Chromosomal Microarray
  presence: Proximal 22q11.2 copy-number gain
  description: >-
    Chromosomal microarray identifies the duplication and its extent. Clinical appearance alone
    is insufficiently distinctive, and routine G-banded karyotyping does not reliably detect
    the common microduplication.
  evidence:
  - reference: PMID:20301749
    reference_title: 22q11.2 Duplication – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The phenotype is not sufficiently distinct to be specifically suspected on clinical grounds
      alone. 22q11.2 duplication is not detectable by routine G-banded karyotyping. Most individuals
      with 22q11.2 duplication are identified by a chromosomal microarray.
    explanation: >-
      Historical GeneReviews states the diagnostic limitations and principal test.
  - reference: PMID:18707033
    reference_title: Clinical variability of the 22q11.2 duplication syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      In this study we present two familial cases with a 3Mb 22q11.2 duplication detected by
      array-CGH.
    explanation: >-
      The familial case series directly demonstrates microarray detection.
- name: Family Testing
  description: >-

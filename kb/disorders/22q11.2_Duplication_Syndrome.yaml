inheritance:
- name: Autosomal dominant duplication with markedly reduced penetrance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  expressivity: VARIABLE
  de_novo_rate: >-
    Both de novo and inherited duplications are reported; unlike the reciprocal
    deletion, most tested cases are inherited.
  description: >-
    The duplication can arise de novo or be inherited in an autosomal dominant manner with incomplete
    penetrance and variable expressivity. A carrier has a 50% chance of transmitting the duplication
    to each offspring; this is a transmission probability, not a probability of clinical impairment.
    Prenatal detection establishes the copy-number gain but cannot reliably predict the phenotype.
  evidence:
  - reference: PMID:18707033
    reference_title: "Clinical variability of the 22q11.2 duplication syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both patients with a de novo 22q11.2 duplication and patients in whom the
      duplication has been inherited from a phenotypically normal parent have
      been reported.
    explanation: Documents that both de novo and inherited duplications occur.
  - reference: PMID:18707033
    reference_title: "Clinical variability of the 22q11.2 duplication syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In a majority of the reported cases where parents have been tested, the
      duplication seems to have been inherited from a normal parent with minor
      abnormalities.
    explanation: >-
      Establishes that inheritance from a minimally affected parent predominates, the basis
      for the reduced-penetrance classification.
  - reference: PMID:20301749
    reference_title: 22q11.2 Duplication – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Offspring of individuals with the 22q11.2 duplication have a 50% chance of inheriting
      the duplication.
    explanation: >-
      Historical GeneReviews states the Mendelian transmission risk; this does not quantify
      penetrance.
  - reference: PMID:20301749
    reference_title: 22q11.2 Duplication – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Prenatal testing is technically feasible; however, it is not possible to predict the phenotype
      from a laboratory finding of 22q11.2 duplication.
    explanation: >-
      A prenatal result cannot predict clinical severity.

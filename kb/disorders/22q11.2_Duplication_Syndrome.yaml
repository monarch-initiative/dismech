- name: Baseline Medical Screening
  description: >-
    Duplication-specific cohort evidence supports baseline cardiac, renal, cervical spine, immune,
    calcium, thyroid, hearing, and ophthalmologic evaluation in children, including those identified
    because of developmental concerns alone. Screening selection and subsequent follow-up should
    be individualized to clinical findings.

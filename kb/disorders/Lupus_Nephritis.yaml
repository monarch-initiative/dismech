review_notes: >-
  Lupus nephritis is curated as a distinct renal manifestation-level entry
  (MONDO:0005556, a manifestation of SLE, MONDO:0007915) separate from the base
  Systemic_Lupus_Erythematosus and Neuropsychiatric_SLE entries. The mechanistic
  chain modeled here (anti-dsDNA/anti-chromatin autoantibodies -> glomerular
  immune-complex deposition -> complement activation and inflammation -> graded
  ISN/RPS glomerular and tubulointerstitial injury) is grounded in the Lech & Anders
  review (PMID:22192660, full text), the Nat Rev Dis Primers primer (PMID:31974366),
  the ISN/RPS classification (PMID:14747370, available in cache for future
  class-level subtyping), and the trigger review on chromatin-directed autoantibodies
  (PMID:42413709). Follow-ups: (1) add ISN/RPS class I-VI as has_subtypes with
  per-class differentiating mechanisms; (2) add hematuria, nephrotic syndrome, and
  hypocomplementemia phenotypes with dedicated quantitative snippets; (3) evaluate
  conforms_to nephrotic_podocyte_injury for the membranous (class V) arm.

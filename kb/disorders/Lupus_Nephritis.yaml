      reference_title: "Lupus Nephritis: Immune Cells and the Kidney Microenvironment."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "The kidney in LN is characterized by a significant immune infiltrate and proinflammatory cytokine milieu that affects intrinsic renal cells"
      explanation: Establishes that the intrarenal infiltrate and cytokine milieu act upon intrinsic renal cells.

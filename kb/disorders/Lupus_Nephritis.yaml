- name: Complement Activation and Glomerular Inflammation
  description: >-
    Glomerular immune complexes activate the complement cascade — deposition of
    complement proteins in glomeruli is a hallmark of lupus nephritis — and recruit
    macrophages and other leukocytes, producing an inflammatory glomerular
    microenvironment. Concurrent anti-C1q antibodies accelerate renal disease.

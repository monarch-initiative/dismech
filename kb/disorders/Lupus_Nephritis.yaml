- accession: dbgap:phs001609
  title: Genetic Contributions of Lupus Nephritis in A Multi-Ethnic Cohort
  description:  Lupus nephritis (LN) is a severe manifestation of systemic lupus erythematosus (SLE) and it occurs at a much higher rate in patients that are not of European descent. The purpose of this study is to identify genetic variants contributing to the risk of LN in a multi-ethnic cohort of SLE patients. We used a comprehensive genome-wide screen and 1244 SLE patients from 5 different ethnic groups. In genome-wide gene-based and candidate SNP analyses, we found distinct genes and pathways, and established risk SNPs associated with lupus nephritis for each ethnic group.
  notes: Located via OmicsDI, which aggregates across omics repositories; this record comes from dbgap. Only repositories with no other discovery route in this project and with a working accession resolver are curated from OmicsDI -- GEO, ArrayExpress, PRIDE, MetaboLights and EGA hits are excluded as duplicates of dedicated passes. Matched because the disease is named in the dataset's own title ("Lupus Nephritis"). Retrieved 2026-08-02.

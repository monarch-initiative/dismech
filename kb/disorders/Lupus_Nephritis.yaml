- accession: geo:GSE322527
  title: Single-cell transcriptomes and T cell receptor sequences of CD4 or CD8 single positive T lymphocytes from peripheral blood or urine of lupus nephritis patients at flare.
  description: Proliferative lupus nephritis (LN) is triggered by deposition of autoantibodies in glomeruli and paralleled by a T cell-rich kidney infiltrate. Although these T cells have been attributed with propagation of tissue injury, it is unclear how they are activated and whether T cell autoreactivity drives the local inflammation. Kidney-infiltrating T cells are also observed in urine, where they have high resemblance with interstitial T cells. Therefore, urinary T cells are a proxy to investigate tissue pathogenesis. Here, we analyzed urinary T cells to elucidate if a kidney-specific T cell autoimmune reaction contributes to tubulointerstitial inflammation in LN.

- accession: geo:GSE296560
  title: 'Lupus nephritis serum induces changes in gene expression in human glomerular endothelial cells, which is modulated by L-sepiapterin: Implications for redox-mediated endothelial dysfunction'
  description: Lupus nephritis (LN) is characterized by renal endothelial dysfunction, which contributes to progressive kidney injury. Endothelial nitric oxide synthase (eNOS) plays a modulating role in LN, as genetic ablation of the eNOS enzyme worsens disease. Serum from patients with active LN induces uncoupling of eNOS homodimers, leading to superoxide (SO) rather than nitric oxide (NO) production by eNOS. This uncoupling is reversed with L-sepiapterin (L-Sep). This study was designed to further examine changes in gene expression in glomerular endothelial cells induced by LN serum and whether treatment with L-Sep can ameliorate these changes.

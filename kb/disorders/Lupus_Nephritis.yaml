treatments:
- name: Immunosuppressive Induction Therapy
  description: >-
    Standard induction therapy for proliferative lupus nephritis combines
    mycophenolate mofetil or cyclophosphamide with glucocorticoids to suppress the
    immune-mediated glomerular injury. Mycophenolate mofetil is teratogenic and
    absolutely contraindicated in the first trimester of pregnancy.
  treatment_term:
    preferred_term: immune suppressant agent therapy
    term:
      id: MAXO:0000297
      label: immune suppressant agent therapy
    therapeutic_agent:
    - preferred_term: mycophenolate mofetil
      term:
        id: CHEBI:8764
        label: mycophenolate mofetil
    - preferred_term: cyclophosphamide
      term:
        id: CHEBI:4027
        label: cyclophosphamide
  evidence:
  - reference: PMID:31974366
    reference_title: "Lupus nephritis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Treatment of LN usually involves immunosuppressive therapy, typically with mycophenolate mofetil or cyclophosphamide and with glucocorticoids"
    explanation: Establishes mycophenolate mofetil or cyclophosphamide plus glucocorticoids as standard immunosuppressive therapy for LN.
  - reference: PMID:42420832
    reference_title: "Navigating the therapeutic landscape: Biologics and immunosuppressive therapy in lupus nephritis during pregnancy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Mycophenolate mofetil is teratogenic and absolutely contraindicated in the first trimester."
    explanation: Documents mycophenolate mofetil teratogenicity and pregnancy contraindication for lupus nephritis management.
- name: Corticosteroid Therapy
  description: Glucocorticoids are a backbone of both induction and maintenance immunosuppression in lupus nephritis.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: glucocorticoid
      term:
        id: CHEBI:24261
        label: glucocorticoid
  notes: Used with mycophenolate mofetil or cyclophosphamide as part of standard LN regimens.
- name: BAFF Pathway Inhibition (Belimumab)
  description: >-
    Belimumab, a monoclonal antibody against B-cell activating factor (BAFF), added to
    standard therapy improves renal responses in active lupus nephritis, consistent with
    the central role of B-cell activation and autoantibody production. Pregnancy registry
    data for belimumab have not raised major safety signals, allowing selective use in
    refractory cases.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: belimumab
      term:
        id: NCIT:C91385
        label: Belimumab
  evidence:
  - reference: PMID:32937045
    reference_title: "Two-Year, Randomized, Controlled Trial of Belimumab in Lupus Nephritis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "and a complete renal response (30% vs. 20%; odds ratio, 1.7"
    explanation: The BLISS-LN trial showed belimumab added to standard therapy improved complete renal response versus placebo.
  - reference: PMID:42420832
    reference_title: "Navigating the therapeutic landscape: Biologics and immunosuppressive therapy in lupus nephritis during pregnancy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Belimumab data from the pregnancy registry have not raised major signals; selective use may be considered in refractory cases."
    explanation: Pregnancy registry data support selective belimumab use in refractory lupus nephritis during pregnancy.
- name: Calcineurin Inhibition (Voclosporin)
  description: >-
    Voclosporin, a calcineurin inhibitor, added to mycophenolate mofetil and
    glucocorticoids significantly increases complete renal response rates in active
    lupus nephritis. However, voclosporin lacks pregnancy safety data and should be
    avoided during pregnancy.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986

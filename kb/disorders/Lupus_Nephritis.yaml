discussions:
- discussion_id: gap_kidney_targeted_ln_therapy
  prompt: >-
    Can the intrarenal kidney-immune crosstalk loop be interrupted by kidney-targeted
    therapy without systemic immunosuppression, and does doing so improve renal
    outcomes relative to the current systemic regimens?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Renal Biochemical Niche (Low Oxygen Tension and Hypertonicity)
  - pathophysiology#Intrinsic Renal Cell Antigen Presentation and Cytokine Production
  - pathophysiology#Intrarenal Immune Infiltration and Proinflammatory Cytokine Milieu
  rationale: >-
    Every treatment currently curated on this entry — mycophenolate/cyclophosphamide
    induction, corticosteroids, belimumab, voclosporin, obinutuzumab, rituximab,
    azathioprine — acts systemically, which follows from the unidirectional model in
    which the kidney is a passive target. If the reciprocal arm is a genuine driver,
    the loop is in principle interruptible at renal-restricted nodes (the hypoxic and
    hypertonic niche, renal antigen presentation, renal cytokine production) that
    systemic immunosuppression does not specifically address. The gap is that no
    kidney-targeted agent acting on these nodes has been shown to change renal
    outcomes in patients, so the therapeutic claim remains a prediction of the model
    rather than a curated treatment.
  proposed_experiments:
  - experiment_id: exp_ln_renal_restricted_target_engagement
    name: Renal-restricted target engagement with paired kidney biopsy readouts
    description: >-
      Test an agent directed at a renal-restricted node of the loop (for example
      renal antigen presentation or the hypoxia/hypertonicity response) using paired
      pre- and post-treatment kidney biopsies, scoring change in the intrarenal
      immune infiltrate and local cytokine milieu alongside proteinuric response, and
      comparing against a systemically immunosuppressed control arm to establish
      whether renal-compartment engagement is separable from systemic effect.
  evidence:
  - reference: PMID:39120952
    reference_title: "Lupus Nephritis: Immune Cells and the Kidney Microenvironment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "An understanding of these mechanisms can lead to the design of more kidney-targeted treatments and the avoidance of systemic immunosuppressive effects and may represent the next frontier of LN therapies."
    explanation: >-
      Frames kidney-targeted therapy as a prospective consequence of these mechanisms
      ("can lead to", "may represent"), i.e. an open question rather than a
      demonstrated therapeutic result.
review_notes: >-
  Lupus nephritis is curated as a distinct renal manifestation-level entry
  (MONDO:0005556, a manifestation of SLE, MONDO:0007915) separate from the base
  Systemic_Lupus_Erythematosus and Neuropsychiatric_SLE entries. The mechanistic
  chain is now modeled with an upstream trigger (impaired nuclear self-antigen
  clearance) driving excessive TLR and interferon pathway signaling, followed by
  B cell hyperactivation, autoantibody production, glomerular immune-complex
  deposition, complement activation, and progressive glomerular/tubulointerstitial
  injury. This upstream-to-downstream cascade is grounded in the van Schaik et al.
  Nature Reviews Nephrology review (PMID:42493613, on disease-modification and
  pathophysiology-based paradigm), the Lech & Anders review (PMID:22192660), the
  Nat Rev Dis Primers primer (PMID:31974366), the ISN/RPS classification
  (PMID:14747370, available in cache for future class-level subtyping), and the
  chromatin-directed autoantibodies review (PMID:42413709). The disease-modification
  paradigm emphasizes early addition of immunomodulatory drugs (BAFF inhibition,
  anti-CD20, calcineurin inhibition, as documented in treatments) to prevent
  progression and kidney damage. Follow-ups: (1) add ISN/RPS class I-VI as
  has_subtypes with per-class differentiating mechanisms; (2) add hematuria,
  nephrotic syndrome, and hypocomplementemia phenotypes with dedicated quantitative
  snippets; (3) evaluate conforms_to nephrotic_podocyte_injury for the membranous
  (class V) arm; (4) model disease-modification treatment paradigm with target_mechanisms
  links to upstream and central nodes.

name: Lupus Nephritis
creation_date: '2026-07-10T18:30:00Z'
description: >-
  Lupus nephritis is an immune-complex glomerulonephritis that is one of the most
  severe organ manifestations of systemic lupus erythematosus (SLE). Anti-dsDNA and
  anti-chromatin (anti-nucleosome) autoantibodies form immune complexes that deposit
  in — or bind in situ to nucleosomes/DNA within — the glomerulus, driving complement
  activation, Fc-receptor and Toll-like-receptor engagement, and inflammatory tissue
  injury. The clinicopathologic spectrum is graded by the ISN/RPS classification from
  mild mesangial involvement (class I/II) through focal and diffuse proliferative
  disease (class III/IV) and membranous disease (class V) to advanced sclerosis
  (class VI), and manifests clinically with proteinuria, an active urinary sediment,
  hypertension, and progression to chronic kidney disease or end-stage kidney disease.
category: Complex
disease_term:
  preferred_term: lupus nephritis
  term:
    id: MONDO:0005556
    label: lupus nephritis
classifications:
  harrisons_chapter:
  - classification_value: KIDNEY_URINARY_TRACT
  - classification_value: IMMUNE_RHEUMATOLOGIC
inheritance:
- name: Polygenic / multifactorial susceptibility
  inheritance_term:
    preferred_term: Polygenic inheritance
    term:
      id: HP:0010982
      label: Polygenic inheritance
  description: >-
    Lupus nephritis has no simple Mendelian inheritance. Renal susceptibility within
    SLE is multifactorial, with contributions from complement-pathway genes, Fc-gamma
    receptor (FcgR) gene variants and copy-number changes, and HLA and interferon-axis
    loci, modified by sex and ancestry. Rare early-complement-component (e.g. C1q)
    deficiency is a strong monogenic risk factor for lupus.
  evidence:
  - reference: PMID:22192660
    reference_title: "Mechanisms of tissue injury in lupus nephritis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Similarly, reports of associations of FcγR genetic changes with nephritis appear linked to specific ethnicities"
    explanation: Supports a polygenic, ancestry-modified genetic contribution (FcgR variants) to lupus nephritis susceptibility.
prevalence:
- population: Patients with systemic lupus erythematosus
  measure_type: PERIOD_PREVALENCE
  prevalence_class: COMMON
  rate_per_100000: 50000.0
  notes: >-
    Nephritis develops in roughly half of SLE patients, with higher rates and worse
    outcomes in men and in people of color; most LN develops within 5 years of SLE
    diagnosis and LN is frequently the presenting manifestation.
  evidence:
  - reference: PMID:22192660
    reference_title: "Mechanisms of tissue injury in lupus nephritis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nephritis occurs in approximately 50% of lupus patients, but rates vary significantly between genders (men more than women) and ethnicities (more common in people of color)."
    explanation: Quantifies the fraction of SLE patients who develop nephritis and its demographic variation.
  - reference: PMID:31974366
    reference_title: "Lupus nephritis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most patients with SLE who develop LN do so within 5 years of an SLE diagnosis and, in many cases, LN is the presenting manifestation resulting in the diagnosis of SLE"
    explanation: Supports the early-onset timing of LN within the SLE disease course.
mechanistic_hypotheses:
- hypothesis_group_id: unidirectional_immune_injury_model
  hypothesis_label: Unidirectional Immune-Complex Injury Model
  status: CANONICAL
  description: >-
    The classical account treats the kidney as a passive target of systemic
    autoimmunity: autoreactive B cells and plasma cells generate anti-dsDNA and
    anti-chromatin antibodies, the resulting immune complexes deposit in — or bind
    in situ within — the glomerulus, and complement, Fc-receptor, and
    Toll-like-receptor engagement drive inflammatory glomerular and
    tubulointerstitial injury. Causal flow runs in one direction, from systemic
    autoimmunity to renal tissue damage, and this model underwrites systemic
    immunosuppression as the therapeutic strategy.
  evidence:
  - reference: PMID:22192660
    reference_title: "Mechanisms of tissue injury in lupus nephritis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pathogenic anti-dsDNA antibodies deposit as immune complexes"
    explanation: Supports the autoantibody-to-deposition step that opens the unidirectional chain.
  - reference: PMID:39120952
    reference_title: "Lupus Nephritis: Immune Cells and the Kidney Microenvironment."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "It is now increasingly appreciated that LN is not due to unidirectional immune cell activation with subsequent kidney damage."
    explanation: >-
      This review does not dispute that immune-complex-driven activation causes renal
      injury, but holds the strictly unidirectional framing to be an incomplete account
      of lupus nephritis — hence PARTIAL rather than SUPPORT for the model as a whole.
- hypothesis_group_id: bidirectional_kidney_immune_crosstalk
  hypothesis_label: Bidirectional Kidney Microenvironment-Immune Cell Crosstalk Model
  status: EMERGING
  description: >-
    An extension in which the kidney is an active participant rather than a passive
    target. The renal biochemical niche (low oxygen tension and hypertonicity) together
    with intrinsic renal cell types — which can present antigen and produce cytokines —
    shapes the recruitment, survival, differentiation, and activation of the intrarenal
    immune infiltrate; those conditioned immune cells in turn modify kidney cell
    function, closing a self-amplifying loop. The model does not replace the
    immune-complex cascade; it adds a reciprocal arm downstream of it, and it predicts
    that kidney-targeted rather than systemic intervention could interrupt the loop.
  evidence:
  - reference: PMID:39120952
    reference_title: "Lupus Nephritis: Immune Cells and the Kidney Microenvironment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "the kidney microenvironment influences the recruitment, survival, differentiation, and activation of immune cells, which, in turn, modify kidney cell function"
    explanation: States the reciprocal kidney-to-immune-cell and immune-cell-to-kidney arms that define this model.
  notes: >-
    Status is EMERGING rather than CANONICAL because the supporting citation is a
    narrative review synthesizing largely mechanistic and model-system work; the
    reciprocal arm has not been shown to drive human renal outcomes independently of
    the immune-complex cascade.
pathophysiology:
- name: Impaired Nuclear Self-Antigen Clearance and Innate Immune Activation
  description: >-
    Defective clearance of nuclear self-antigens in SLE initiates a cascade of innate
    immune activation. Impaired clearance drives excessive Toll-like receptor signaling
    and type I interferon pathway upregulation, establishing a permissive inflammatory
    environment for B cell hyperactivation and loss of B-cell tolerance. These innate
    immune mechanisms sustain autoantibody production and complement activation.
  biological_processes:
  - preferred_term: Inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  cell_types:
  - preferred_term: B cell
    term:
      id: CL:0000236
      label: B cell
  downstream:
  - target: Autoantibody Production and Immune Complex Formation
    description: Innate immune activation through impaired nuclear antigen clearance drives B cell hyperactivation and autoantibody production.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:42493613
      reference_title: "Disease modification in lupus nephritis: towards a pathophysiology-based treatment paradigm."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "impaired clearance of nuclear self-antigens drives innate immune activation, including excessive Toll-like receptor signalling, interferon pathway upregulation and B cell hyperactivation"
      explanation: Establishes impaired nuclear antigen clearance and subsequent TLR/interferon upregulation as drivers of B cell hyperactivation and autoantibody production in lupus nephritis.
  evidence:
  - reference: PMID:42493613
    reference_title: "Disease modification in lupus nephritis: towards a pathophysiology-based treatment paradigm."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Advances in our understanding of the pathophysiology of lupus nephritis have provided insights into the mechanisms by which the impaired clearance of nuclear self-antigens drives innate immune activation"
    explanation: Identifies impaired nuclear self-antigen clearance as a fundamental upstream mechanism driving the inflammatory cascade in lupus nephritis pathogenesis.
- name: Autoantibody Production and Immune Complex Formation
  description: >-
    Failure of B-cell tolerance in SLE, driven by innate immune activation through
    impaired nuclear antigen clearance and excessive Toll-like receptor signaling,
    generates anti-dsDNA and anti-chromatin (anti-nucleosome) autoantibodies from
    hyperactivated autoreactive B cells and plasma cells. These antibodies to
    DNA/nucleosomes are the autoantibody species most closely linked to the development
    of nephritis and form circulating and in-situ immune complexes.
  biological_processes:

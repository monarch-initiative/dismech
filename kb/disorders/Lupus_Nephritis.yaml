      label: T cell
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  downstream:
  - target: Intrinsic Renal Cell Antigen Presentation and Cytokine Production
    description: >-
      Infiltrating immune cells and their cytokines act on intrinsic renal cells,
      engaging the renal-cell arm of the reciprocal loop. Note this edge deliberately
      targets the induced renal-cell activity, not the renal biochemical niche, which
      is constitutive rather than immune-induced. Evidence caveat: the cited abstract
      states a general effect on intrinsic renal cells ("affects intrinsic renal
      cells") and describes antigen presentation and cytokine production in the
      renal-to-immune direction; that the infiltrate specifically induces those two
      pathways is a reasonable inference from the review's framing rather than a
      sentence it states, so the specificity of this edge is weaker than its direction.
    causal_link_type: DIRECT
    hypothesis_groups:

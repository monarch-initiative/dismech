name: Lupus Nephritis
creation_date: '2026-07-10T18:30:00Z'
description: >-
  Lupus nephritis is an immune-complex glomerulonephritis that is one of the most
  severe organ manifestations of systemic lupus erythematosus (SLE). Anti-dsDNA and
  anti-chromatin (anti-nucleosome) autoantibodies form immune complexes that deposit
  in — or bind in situ to nucleosomes/DNA within — the glomerulus, driving complement
  activation, Fc-receptor and Toll-like-receptor engagement, and inflammatory tissue
  injury. The clinicopathologic spectrum is graded by the ISN/RPS classification from
  mild mesangial involvement (class I/II) through focal and diffuse proliferative
  disease (class III/IV) and membranous disease (class V) to advanced sclerosis
  (class VI), and manifests clinically with proteinuria, an active urinary sediment,
  hypertension, and progression to chronic kidney disease or end-stage kidney disease.
category: Complex
disease_term:
  preferred_term: lupus nephritis
  term:
    id: MONDO:0005556
    label: lupus nephritis
classifications:
  harrisons_chapter:
  - classification_value: KIDNEY_URINARY_TRACT
  - classification_value: IMMUNE_RHEUMATOLOGIC
inheritance:
- name: Polygenic / multifactorial susceptibility
  inheritance_term:
    preferred_term: Polygenic inheritance
    term:
      id: HP:0010982
      label: Polygenic inheritance
  description: >-
    Lupus nephritis has no simple Mendelian inheritance. Renal susceptibility within
    SLE is multifactorial, with contributions from complement-pathway genes, Fc-gamma
    receptor (FcgR) gene variants and copy-number changes, and HLA and interferon-axis
    loci, modified by sex and ancestry. Rare early-complement-component (e.g. C1q)
    deficiency is a strong monogenic risk factor for lupus.
  evidence:
  - reference: PMID:22192660
    reference_title: "Mechanisms of tissue injury in lupus nephritis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Similarly, reports of associations of FcγR genetic changes with nephritis appear linked to specific ethnicities"
    explanation: Supports a polygenic, ancestry-modified genetic contribution (FcgR variants) to lupus nephritis susceptibility.
prevalence:
- population: Patients with systemic lupus erythematosus
  measure_type: PERIOD_PREVALENCE
  prevalence_class: COMMON
  rate_per_100000: 50000.0
  notes: >-
    Nephritis develops in roughly half of SLE patients, with higher rates and worse
    outcomes in men and in people of color; most LN develops within 5 years of SLE
    diagnosis and LN is frequently the presenting manifestation.
  evidence:
  - reference: PMID:22192660
    reference_title: "Mechanisms of tissue injury in lupus nephritis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nephritis occurs in approximately 50% of lupus patients, but rates vary significantly between genders (men more than women) and ethnicities (more common in people of color)."
    explanation: Quantifies the fraction of SLE patients who develop nephritis and its demographic variation.
  - reference: PMID:31974366
    reference_title: "Lupus nephritis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most patients with SLE who develop LN do so within 5 years of an SLE diagnosis and, in many cases, LN is the presenting manifestation resulting in the diagnosis of SLE"
    explanation: Supports the early-onset timing of LN within the SLE disease course.
pathophysiology:
- name: Autoantibody Production and Immune Complex Formation
  description: >-
    Failure of B-cell tolerance in SLE generates anti-dsDNA and anti-chromatin
    (anti-nucleosome) autoantibodies from autoreactive B cells and plasma cells.
    These antibodies to DNA/nucleosomes are the autoantibody species most closely
    linked to the development of nephritis and form circulating and in-situ immune
    complexes.
  biological_processes:
  - preferred_term: Immunoglobulin production
    term:
      id: GO:0002377
      label: immunoglobulin production
    modifier: INCREASED
  - preferred_term: Humoral immune response mediated by circulating immunoglobulin
    term:
      id: GO:0002455
      label: humoral immune response mediated by circulating immunoglobulin
    modifier: ABNORMAL
  cell_types:
  - preferred_term: B cell
    term:
      id: CL:0000236
      label: B cell
  - preferred_term: plasma cell
    term:
      id: CL:0000786
      label: plasma cell
  downstream:
  - target: Glomerular Immune Complex Deposition
    description: Pathogenic anti-dsDNA/anti-chromatin antibodies deposit as immune complexes in the glomerulus.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:22192660
      reference_title: "Mechanisms of tissue injury in lupus nephritis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Pathogenic anti-dsDNA antibodies deposit as immune complexes"
      explanation: Links the autoantibody response directly to glomerular immune-complex deposition.
  evidence:
  - reference: PMID:22192660
    reference_title: "Mechanisms of tissue injury in lupus nephritis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Antibodies to dsDNA/nucleosomes are most closely linked with development of nephritis"
    explanation: Identifies anti-dsDNA/nucleosome antibodies as the autoantibody species most associated with lupus nephritis.
  - reference: PMID:42413709
    reference_title: "Reflections on chromatin structures, corresponding autoantibodies - And conflicting dogmas impacting pathogenesis of lupus nephritis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "anti-DNA antibody structures and anti-chromatin antibodies; their origins, and their impact on operational molecular and cellular processes accounting for lupus nephritis"
    explanation: Situates chromatin-directed autoantibodies at the center of the molecular and cellular processes producing lupus nephritis.
- name: Glomerular Immune Complex Deposition
  description: >-
    Immune complexes accumulate in the glomerulus both by deposition of circulating
    complexes and by in-situ binding of anti-dsDNA/chromatin antibodies to nucleosomes
    and DNA present in the glomerular matrix, engaging mesangial cells, glomerular
    endothelium, and podocytes across the mesangial, subendothelial, and subepithelial
    compartments that define the ISN/RPS histologic classes.
  cell_types:
  - preferred_term: glomerular mesangial cell
    term:
      id: CL:1000742
      label: glomerular mesangial cell
  - preferred_term: glomerular capillary endothelial cell
    term:
      id: CL:1001005
      label: glomerular capillary endothelial cell
  - preferred_term: podocyte
    term:
      id: CL:0000653
      label: podocyte
  downstream:
  - target: Complement Activation and Glomerular Inflammation
    description: Deposited immune complexes co-stimulate Fc receptors and endosomal TLRs and activate complement.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:22192660
      reference_title: "Mechanisms of tissue injury in lupus nephritis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "These complexes can then lead to further activation of immune pathways by co-stimulation of FcγRs and endosomal Toll-like receptors (TLRs) and/or by activating the complement cascade"
      explanation: Connects glomerular immune-complex deposition to downstream Fc-receptor, TLR, and complement activation.
  evidence:
  - reference: PMID:22192660
    reference_title: "Mechanisms of tissue injury in lupus nephritis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "anti-dsDNA/chromatin antibodies binding to nucleosomes/DNA present in the glomerular matrix, as the most compelling"
    explanation: Supports the in-situ binding mechanism of glomerular immune-complex formation.
- name: Complement Activation and Glomerular Inflammation
  description: >-
    Glomerular immune complexes activate the complement cascade — deposition of
    complement proteins in glomeruli is a hallmark of lupus nephritis — and recruit
    macrophages and other leukocytes, producing an inflammatory glomerular
    microenvironment. Concurrent anti-C1q antibodies accelerate renal disease.
  biological_processes:
  - preferred_term: Complement activation, classical pathway
    term:
      id: GO:0006958
      label: complement activation, classical pathway
    modifier: INCREASED
  - preferred_term: Inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  downstream:
  - target: Glomerular and Tubulointerstitial Injury
    description: Complement activation and inflammatory infiltration are deleterious, driving glomerular and tubular tissue injury.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:22192660
      reference_title: "Mechanisms of tissue injury in lupus nephritis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "There is strong evidence that complement activation is deleterious in lupus nephritis"
      explanation: Links complement activation to tissue injury in lupus nephritis.
  evidence:
  - reference: PMID:22192660
    reference_title: "Mechanisms of tissue injury in lupus nephritis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Deposition of complement proteins in glomeruli is a key feature of lupus nephritis."
    explanation: Establishes glomerular complement deposition as a defining feature of lupus nephritis.
  - reference: PMID:22192660
    reference_title: "Mechanisms of tissue injury in lupus nephritis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "When anti-C1q antibodies are present along with anti-dsDNA antibodies, development of renal disease is accelerated"
    explanation: Supports anti-C1q antibodies as an accelerant of complement-driven renal disease.
- name: Glomerular and Tubulointerstitial Injury
  description: >-
    Sustained immune-complex, complement, and inflammatory injury produces the graded
    ISN/RPS histologic spectrum — from mesangial (class I/II) through proliferative
    (class III/IV) and membranous (class V) disease to end-stage fibrosis (class VI) —
    with tubulointerstitial disease that also impacts prognosis. Loss of glomerular and
    tubular function through renal cell death and fibrosis underlies progression to
    end-stage kidney disease.
  biological_processes:
  - preferred_term: Inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  cell_types:
  - preferred_term: podocyte
    term:
      id: CL:0000653
      label: podocyte
  evidence:
  - reference: PMID:22192660
    reference_title: "Mechanisms of tissue injury in lupus nephritis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The pathologic classes vary from mild mesangial involvement (Class I) to diffuse proliferative disease (Class IV) to membranous disease (Class V) to end-stage fibrosis (Class VI)."
    explanation: Describes the graded histopathologic spectrum of glomerular injury in lupus nephritis.
  - reference: PMID:22192660
    reference_title: "Mechanisms of tissue injury in lupus nephritis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "End-stage renal disease in lupus is secondary to loss of glomerular and tubular function due to renal cell death and resultant fibrosis."
    explanation: Links glomerular and tubulointerstitial injury to end-stage renal disease.

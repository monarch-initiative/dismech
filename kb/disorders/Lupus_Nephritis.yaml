  title: Based on single-cell sequencing analysis of CD4+ T cells and B cells in patients with lupus nephritis, the heterogeneity of these cells was investigated.
  description: Utilizing single-cell technology to analyze the heterogeneity of CD4+ T cells and B cells in patients with lupus nephritis.We have delineated the immune cell profile of PBMC in LN patients, and focused on describing the heterogeneity characteristics of CD4+ T cells and B cells. Some specific cell subtypes and ligand-receptor pairs were identified, which indicate potential therapeutic targets for lupus erythematosus.

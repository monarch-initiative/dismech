- name: Intrarenal Immune Infiltration and Proinflammatory Cytokine Milieu
  biological_scale: TISSUE
  description: >-
    Downstream of complement and Fc-receptor activation, the lupus kidney accumulates
    a substantial infiltrate of T cells, macrophages, and other leukocytes together
    with a proinflammatory cytokine milieu. This intrarenal compartment is not merely
    a bystander readout of systemic autoimmunity: the infiltrating cells and the
    cytokines they produce act directly on intrinsic renal cells, and are in part
    responsible for the tissue damage seen in lupus nephritis.
  biological_processes:
  - preferred_term: Leukocyte migration into the kidney
    term:
      id: GO:0050900
      label: leukocyte migration
    modifier: INCREASED
  - preferred_term: Proinflammatory cytokine production
    term:
      id: GO:0001816
      label: cytokine production
    modifier: INCREASED
  cell_types:
  - preferred_term: T cell
    term:

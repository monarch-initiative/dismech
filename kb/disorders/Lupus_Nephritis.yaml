- accession: ega:EGAS00001007117
  title: Identification of Long Non-coding RNA Biomarker of Human Lupus Nephritis Disease Activity
  description: Total RNA sequencing was performed on whole blood samples from 74 Lupus nephritis (LN) patients and 20 healthy controls. Differential expression analysis and weighted gene co-expression network analysis were performed to characterise expression changes of long non-coding RNAs (lncRNAs) in LN and identify lncRNAs with a key role in disease activity that could be used as potential blood-based biomarkers.

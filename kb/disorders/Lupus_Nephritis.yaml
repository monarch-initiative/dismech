- name: Glomerular and Tubulointerstitial Injury
  description: >-
    Sustained immune-complex, complement, and inflammatory injury produces the graded
    ISN/RPS histologic spectrum — from mesangial (class I/II) through proliferative
    (class III/IV) and membranous (class V) disease to end-stage fibrosis (class VI) —
    with tubulointerstitial disease that also impacts prognosis. Loss of glomerular and
    tubular function through renal cell death and fibrosis underlies progression to
    end-stage kidney disease.

- name: Renal Biochemical Niche (Low Oxygen Tension and Hypertonicity)
  biological_scale: TISSUE
  description: >-
    The kidney's distinctive biochemical environment — the low oxygen tension of the
    corticomedullary gradient and the hypertonicity of the medullary interstitium —
    is a constitutive feature of normal renal physiology, not a state induced by
    lupus. It is modelled here as an initiating, contextual node because it is the
    pre-existing environment that infiltrating immune cells arrive into, and it shapes
    how those cells behave once they are there. It therefore carries no incoming edge
    from the immune infiltrate.
  biological_processes:
  - preferred_term: Renal cellular response to low oxygen tension
    term:
      id: GO:0071456
      label: cellular response to hypoxia
  - preferred_term: Response to medullary hypertonicity
    term:
      id: GO:0006972
      label: hyperosmotic response
  cell_types:
  - preferred_term: kidney epithelial cell
    term:
      id: CL:0002518
      label: kidney epithelial cell
  - preferred_term: kidney tubule cell
    term:
      id: CL:1000507
      label: kidney tubule cell
  downstream:
  - target: Intrarenal Immune Cell Conditioning and Activation
    description: >-
      The renal biochemical niche acts on the immune cells that enter it, shaping
      their behaviour within the kidney.
    causal_link_type: DIRECT
    hypothesis_groups:
    - bidirectional_kidney_immune_crosstalk
    evidence:
    - reference: PMID:39120952
      reference_title: "Lupus Nephritis: Immune Cells and the Kidney Microenvironment."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "low oxygen tension and hypertonicity) and unique kidney cell types affect the intrarenal immune cells in LN"
      explanation: States that the renal biochemical environment affects the intrarenal immune cells.
  evidence:
  - reference: PMID:39120952
    reference_title: "Lupus Nephritis: Immune Cells and the Kidney Microenvironment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "low oxygen tension and hypertonicity) and unique kidney cell types affect the intrarenal immune cells in LN"
    explanation: Identifies low oxygen tension and hypertonicity as the biochemical environment of the kidney in this model.
  notes: >-
    No modifier is asserted on either process: the review treats these as the kidney's
    normal biochemical conditions, so neither is curated as increased or decreased
    relative to a healthy kidney. Term choice: GO:0071456 and GO:0006972 name the
    cells' responses to hypoxia and hypertonicity, whereas this node models the niche
    itself as an environment. No better handle exists — an environment is a PATO/ENVO
    concept and this is intrinsic renal physiology rather than an exposure, so ECTO
    does not apply either — and per the "no term beats a bad one" rule these are kept
    with preferred_term values that name the niche.

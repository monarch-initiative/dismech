- accession: ega:EGAS50000000159
  title: ScRNA-seq of human kidney immune cells of patients with ANCA-associated glomerulonephritis, Lupus Nephritis against a "healthy" nephrectomy control
  description: ANCA-associated glomerulonephritis (AGN) associates with a high risk of end-stage kidney disease. The role of kidney immune cells in local inflammation remains unclear. Here, we investigate kidney immune cell diversity and function. Kidney tissue from AGN patients (n=5) and a lupus nephritis (LN) patient (n=1) were aquired during a biopsy procedure for a clinical indication. Needle-core biopsies were obtained for histopathological examination, and an additional pass was performed to retrieve kidney tissue for scRNA-seq. Healthy kidney tissue (n=1) was obtained from a kidney that was surgically removed do tue due to a (non-invasive) papillary urothelial carcinoma.

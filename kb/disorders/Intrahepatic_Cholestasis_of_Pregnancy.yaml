  notes: >-
    0.2-2% of pregnancies (200-2,000 per 100,000). Modeled as a period prevalence
    across the pregnancy episode. Incidence varies substantially by ancestry and
    geography, being notably higher in Chile and in South Asian populations.
  evidence:
  - reference: PMID:42178310
    reference_title: "Genome-wide meta-analysis identifies genetic drivers of bile acid metabolism in intrahepatic cholestasis of pregnancy."
    supports: SUPPORT

treatments:
- name: Ursodeoxycholic Acid
  description: >-
    A hydrophilic bile acid, historically the mainstay of ICP treatment. It reliably
    improves maternal pruritus and lowers biochemical markers, and is antiarrhythmic
    in fetal cardiac model systems. However the PITCHES randomised placebo-controlled
    trial found no reduction in the composite perinatal outcome of perinatal death,
    preterm birth or neonatal unit admission. UDCA is therefore best curated as a
    maternal symptomatic therapy with a mechanistically attractive but clinically
    unproven fetal-protective rationale.
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Fetal Cardiomyocyte Electrophysiological Disturbance
    treatment_effect: INHIBITS
    description: >-
      UDCA prevents taurocholic-acid-induced cardiomyocyte dysfunction in vitro,
      acting in part by hyperpolarising cardiac myofibroblasts. Note this
      target_mechanisms edge records the proposed mechanism of action, which the
      PITCHES trial did not translate into a perinatal outcome benefit.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ursodeoxycholic acid
      term:
        id: CHEBI:9907
        label: ursodeoxycholic acid
  evidence:
  - reference: PMID:31378395
    reference_title: "Ursodeoxycholic acid versus placebo in women with intrahepatic cholestasis of pregnancy (PITCHES): a randomised controlled trial."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Treatment with ursodeoxycholic acid does not reduce adverse perinatal outcomes in women with intrahepatic cholestasis of pregnancy."
    explanation: >-
      The PITCHES randomised placebo-controlled trial refutes a perinatal-outcome
      benefit of UDCA, the claim on which its routine use had rested.
  - reference: PMID:31378395
    reference_title: "Ursodeoxycholic acid versus placebo in women with intrahepatic cholestasis of pregnancy (PITCHES): a randomised controlled trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ursodeoxycholic acid is widely used as a treatment without an adequate evidence base."
    explanation: >-
      Documents that widespread clinical use preceded, and was not justified by,
      outcome evidence.
  - reference: PMID:26777584
    reference_title: "The protective effect of ursodeoxycholic acid in an in vitro model of the human fetal heart occurs via targeting cardiac fibroblasts."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "Ursodeoxycholic acid (UDCA), a drug clinically used to treat ICP, prevents adverse effects of TC."
    explanation: >-
      Supports the proposed fetal cardioprotective mechanism in vitro. This is
      mechanism-level, not outcome-level, support and does not offset the PITCHES result.
- name: Bile-Acid-Guided Timed Delivery
  description: >-
    Because the stillbirth hazard is concentrated late in gestation and rises with
    bile acid concentration, planned early-term or preterm delivery timed to the
    maximum measured bile acid concentration is the principal intervention that
    plausibly reduces fetal death. This trades an iatrogenic prematurity cost against
    stillbirth risk, and the balance is explicitly concentration-dependent.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: labor induction
    term:
      id: NCIT:C92814
      label: Induction of Labor
  evidence:
  - reference: PMID:30773280
    reference_title: "Association of adverse perinatal outcomes of intrahepatic cholestasis of pregnancy with biochemical markers: results of aggregate and individual patient data meta-analyses."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The risk of stillbirth is increased in women with intrahepatic cholestasis of pregnancy and singleton pregnancies when serum bile acids concentrations are of 100 μmol/L or more."
    explanation: >-
      Provides the concentration-threshold rationale for risk-stratified delivery
      timing. This is observational evidence for the risk gradient, not trial evidence
      that any particular delivery policy reduces stillbirth.
discussions:
- discussion_id: gap_icp_fetal_arrhythmia_human_translation
  prompt: >-
    Bile-acid-induced cardiomyocyte calcium dysregulation and conduction slowing are
    demonstrated in neonatal rat cardiomyocytes and in in vitro human fetal cardiac
    cell models. Is a bile-acid-triggered arrhythmia the actual terminal event in
    human ICP stillbirth, or is the rodent and in vitro cardiotoxicity a
    model-system phenomenon that does not reproduce the in vivo human fetal
    myocardium at clinically observed bile acid concentrations?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Fetal Cardiomyocyte Electrophysiological Disturbance
  - pathophysiology#Transplacental Bile Acid Transfer and Fetal Accumulation
  - phenotypes#Stillbirth
  rationale: >-
    This is not an absence of evidence but a translational-validity question: positive
    mechanistic evidence exists in model systems, and the human epidemiology is
    strongly consistent with it (a sharp concentration threshold, sudden death in
    appropriately grown fetuses, no antecedent Doppler abnormality). What is missing is
    any direct in vivo human observation, because the terminal event is by definition
    unwitnessed and antenatal fetal ECG monitoring at the relevant moment is not
    feasible. The mismatch is mechanistically meaningful because rodent and human fetal
    myocardium differ in ion channel repertoire and in bile acid handling, and because
    the in vitro work uses taurocholic acid concentrations that may not reflect fetal
    myocardial exposure. Resolving it matters clinically: if the arrhythmia model is
    correct, an antiarrhythmic or bile-acid-lowering strategy could in principle avert
    stillbirth without iatrogenic prematurity, whereas if it is not, timed delivery
    remains the only lever. The negative PITCHES result is at least consistent with the
    possibility that lowering maternal bile acids pharmacologically does not reach the
    relevant fetal compartment.
  proposed_experiments:
  - experiment_id: exp_icp_fetal_myocardium_bile_acid_exposure
    name: Fetal compartment bile acid exposure and cardiac electrophysiology in human ICP
    description: >-
      Pair cord-blood and amniotic-fluid bile acid speciation at delivery with
      antenatal fetal electrocardiographic or magnetocardiographic recording across the
      maternal bile acid range, including the 100 micromol/L or greater stratum. Test
      whether measurable conduction or repolarisation changes appear in human fetuses
      at the concentrations associated with excess stillbirth, and whether they track
      fetal rather than maternal bile acid concentration. Complement with human
      iPSC-derived fetal-like cardiomyocytes exposed to physiologically measured fetal
      bile acid concentrations and species mixtures rather than supraphysiological
      taurocholic acid alone.
    experiment_type:
      preferred_term: prospective mechanistic cohort study with human cardiac model arm
    decision_criterion: >-
      The model is supported if human fetal conduction or repolarisation abnormalities
      appear at fetal bile acid concentrations reached in severe ICP and scale with
      concentration. Absence of any electrophysiological signal across the full
      clinical range, despite confirmed fetal bile acid accumulation, would argue that
      the rodent and in vitro cardiotoxicity does not translate and would redirect the
      search for the terminal event.
    would_support:
    - pathophysiology#Fetal Cardiomyocyte Electrophysiological Disturbance
- discussion_id: gap_icp_transporter_variant_evidence
  prompt: >-
    What is the quantified contribution of heterozygous ABCB4, ABCB11 and ATP8B1
    variants to ICP susceptibility, relative to the polygenic bile-acid-synthesis and
    lipid-metabolism signal identified by genome-wide meta-analysis?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Genetic and Hormonal Susceptibility of Hepatobiliary Transport
  rationale: >-
    The genome-wide meta-analysis establishes these susceptibility signals at
    *locus* level - ABCB11 (2q31), ABCG5/8 (2p21), CYP8B1 (3p22) and ABCB1/4 (7q21)
    each reach genome-wide significance and are cited on the corresponding gene
    entries. What remains unquantified is the *variant* level: the contribution of
    individual rare heterozygous coding variants in ABCB4, ABCB11 and ATP8B1, which
    are curated here on the strength of the PFIC hepatology rather than ICP-specific
    effect sizes, and which a common-variant GWAS is not powered to resolve. Two
    further limits apply specifically to ABCB4: the 7q21 locus annotation does not
    discriminate it from the adjacent ABCB1, and ATP8B1 still carries no ICP-specific
    evidence item at all. Curation follow-up should
    attach variant-level citations (Dixon et al., reference 24 of PMID:42178310, is
    the obvious next fetch), or downgrade those gene entries if the effect sizes turn
    out to be small relative to the polygenic background.

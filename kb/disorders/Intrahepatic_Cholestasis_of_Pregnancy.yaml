- name: Stillbirth
  category: Obstetric
  description: >-
    Sudden intrauterine fetal death, typically late in the third trimester and
    typically in an appropriately grown fetus without preceding surveillance
    abnormality. Risk is concentrated in women whose maximum total bile acid
    concentration reaches 100 micromol/L or more; below 40 micromol/L the risk
    approximates the background population rate.
  notes: >-
    No phenotype_term is asserted. HP:0003826 Stillbirth is a real HPO term but sits
    under Mortality/Aging and Prenatal death rather than under the HP:0000118
    phenotypic-abnormality root, so it is outside the PhenotypeTerm dynamic enum, and
    MONDO has no stillbirth class. Binding to a coarser available parent would
    misrepresent the single most important outcome of this disorder, so the phenotype
    is left unbound and the ontology gap recorded here.
  evidence:
  - reference: PMID:30773280
    reference_title: "Association of adverse perinatal outcomes of intrahepatic cholestasis of pregnancy with biochemical markers: results of aggregate and individual patient data meta-analyses."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The risk of stillbirth is increased in women with intrahepatic cholestasis of pregnancy and singleton pregnancies when serum bile acids concentrations are of 100 μmol/L or more."
    explanation: >-
      Establishes both the stillbirth association and its concentration threshold, the
      basis for bile-acid-guided delivery timing.
  - reference: PMID:30773280
    reference_title: "Association of adverse perinatal outcomes of intrahepatic cholestasis of pregnancy with biochemical markers: results of aggregate and individual patient data meta-analyses."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Because most women with intrahepatic cholestasis of pregnancy have bile acids below this concentration, they can probably be reassured that the risk of stillbirth is similar to that of pregnant women in the general population, provided repeat bile acid testing is done until delivery."
    explanation: >-
      Documents that the excess stillbirth risk is confined to the severe tail, which
      is why the phenotype carries no overall frequency band.
- name: Premature birth
  category: Obstetric
  frequency: FREQUENT
  description: >-
    Both spontaneous preterm labour and iatrogenic preterm delivery undertaken to
    pre-empt stillbirth. The iatrogenic component means preterm birth rates in ICP
    partly reflect management policy rather than disease biology alone.
  phenotype_term:
    preferred_term: Premature birth
    term:
      id: HP:0001622
      label: Premature birth
  evidence:
  - reference: PMID:31378395
    reference_title: "Ursodeoxycholic acid versus placebo in women with intrahepatic cholestasis of pregnancy (PITCHES): a randomised controlled trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A systematic review and individual patient data meta-analysis1 from 2019 showed that intrahepatic cholestasis of pregnancy is associated with increased rates of spontaneous and iatrogenic preterm birth, meconium-stained amniotic fluid, and neonatal unit admission."
    explanation: >-
      Documents both the spontaneous and iatrogenic components of preterm birth in ICP,
      as well as the meconium and neonatal-unit outcomes.
biochemical:
- name: Total serum bile acids
  presence: Elevated
  context: Diagnostic and risk-stratifying measurement, repeated until delivery
  notes: >-
    The single most important measurement in ICP. Risk stratification uses the maximum
    antenatal value: below 40 micromol/L the stillbirth risk approximates background;
    40-99 micromol/L is intermediate; 100 micromol/L or more carries a markedly
    elevated risk and prompts earlier delivery.
  evidence:
  - reference: PMID:30773280
    reference_title: "Association of adverse perinatal outcomes of intrahepatic cholestasis of pregnancy with biochemical markers: results of aggregate and individual patient data meta-analyses."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In singleton pregnancies, stillbirth was associated with maximum total bile acid concentration"
    explanation: >-
      Shows that stillbirth risk tracks the maximum total bile acid concentration,
      justifying bile-acid-led monitoring. The same sentence reports that alanine
      aminotransferase does not discriminate (ROC AUC 0.46), which is why transaminases
      are not used for risk stratification; that clause is omitted from the quoted
      snippet only because its bracketed confidence intervals break substring matching.
genetic:
- name: ABCB4
  gene_term:
    preferred_term: ABCB4
    term:
      id: hgnc:45
      label: ABCB4
  association: Susceptibility (heterozygous canalicular transporter variants)
  relationship_type: SUSCEPTIBILITY
  variant_origin: GERMLINE
  notes: >-
    Encodes MDR3, the canalicular phospholipid floppase. Biallelic loss causes
    progressive familial intrahepatic cholestasis type 3; heterozygous carriage
    reduces biliary phospholipid reserve and predisposes to ICP when the
    third-trimester sex steroid load is applied. Two independent 7q21 signals reach
    genome-wide significance in the ICP meta-analysis, so the association is
    established at locus level; the locus annotation is 'ABCB1/4' and does not
    discriminate between the adjacent ABCB1 and ABCB4 genes, and the effect of
    individual rare heterozygous coding variants against that polygenic background
    remains open (see the discussions block).
  evidence:
  - reference: PMID:42178310
    reference_title: "Genome-wide meta-analysis identifies genetic drivers of bile acid metabolism in intrahepatic cholestasis of pregnancy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "7q21 chr7:87487153 rs59934297 T/G 0.13 1.7E-49 0.60 (0.56-0.64) ABCB1/4"
    explanation: >-
      Genome-wide significant ICP association (p=1.7e-49) at the 7q21 locus annotated
      to ABCB1/4, with the effect allele minor (frequency 0.13) and protective
      (OR 0.60, 95% CI 0.56-0.64). A second independent 7q21 signal (rs58238559,
      p=1.1e-17, OR 0.49) is reported in the same table. This is ICP-specific human
      genetic evidence at the 7q21 locus, distinct from the PFIC3 literature. Note
      the annotation names ABCB1 and ABCB4 jointly and does not resolve which of the
      two adjacent genes carries the signal.
- name: ABCB11
  gene_term:
    preferred_term: ABCB11
    term:
      id: hgnc:42
      label: ABCB11
  association: Susceptibility (bile salt export pump variants)
  relationship_type: SUSCEPTIBILITY
  variant_origin: GERMLINE
  notes: >-
    Encodes BSEP, the rate-limiting canalicular bile salt export pump and the direct
    target of inhibitory sulfated progesterone metabolites. The 2q31 locus reaches
    genome-wide significance in the ICP meta-analysis, so the association is
    established at locus level; the effect of individual rare heterozygous coding
    variants against that polygenic background remains open (see the discussions
    block).
  evidence:
  - reference: PMID:42178310
    reference_title: "Genome-wide meta-analysis identifies genetic drivers of bile acid metabolism in intrahepatic cholestasis of pregnancy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "2q31 chr2:169001056 rs6733156 C/T 0.07 7.6E-36 0.57 (0.53-0.63) ABCB11"
    explanation: >-
      Genome-wide significant ICP association (p=7.6e-36) at the 2q31 locus for which
      ABCB11 is the annotated gene, with the minor allele protective (OR 0.57,
      95% CI 0.53-0.63). This is ICP-specific human genetic evidence for BSEP
      involvement, distinct from the PFIC2 literature.
- name: ATP8B1
  gene_term:
    preferred_term: ATP8B1
    term:
      id: hgnc:3706
      label: ATP8B1
  association: Susceptibility
  relationship_type: SUSCEPTIBILITY
  variant_origin: GERMLINE
  notes: >-

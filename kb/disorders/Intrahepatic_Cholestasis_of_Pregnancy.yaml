    explanation: Provides the per-pregnancy occurrence range used for this record.
mechanistic_hypotheses:
- hypothesis_group_id: fetal_bile_acid_cardiotoxicity_model
  hypothesis_label: Fetal Bile Acid Cardiotoxicity Model of ICP Stillbirth
  status: CANONICAL
  description: >-
    ICP stillbirth is not caused by progressive placental insufficiency (which would
    be preceded by growth restriction and abnormal Dopplers) but by an acute,
    bile-acid-mediated fetal cardiac event. Bile acids transferred across the
    placenta accumulate in fetal serum and myocardium, where taurocholic acid
    disturbs cardiomyocyte calcium dynamics, slows conduction and promotes
    arrhythmia. This explains the characteristic clinical signature of ICP loss:
    sudden death in an appropriately grown fetus, near term, without antecedent
    surveillance abnormalities. It also explains why bile acid concentration rather
    than pruritus severity or transaminase level stratifies risk.
  notes: >-
    Strongest supporting strands are (1) the concentration-threshold epidemiology
    (stillbirth risk rises sharply at total bile acids of 100 micromol/L or more)
    and (2) direct cardiomyocyte electrophysiology in model systems. The principal
    gap is that the arrhythmia mechanism is demonstrated in rodent cardiomyocytes
    and in vitro human fetal cardiac cells, not in human fetuses in vivo, where the
    terminal event is by definition unobserved. See the HUMAN_MODEL_MISMATCH
    discussion below.
  evidence:
  - reference: PMID:30773280
    reference_title: "Association of adverse perinatal outcomes of intrahepatic cholestasis of pregnancy with biochemical markers: results of aggregate and individual patient data meta-analyses."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The risk of stillbirth is increased in women with intrahepatic cholestasis of pregnancy and singleton pregnancies when serum bile acids concentrations are of 100 μmol/L or more."
    explanation: >-
      Individual-patient-data meta-analysis establishes the bile-acid concentration
      dependence of stillbirth risk, the epidemiological signature this model predicts.
  - reference: PMID:26777584
    reference_title: "The protective effect of ursodeoxycholic acid in an in vitro model of the human fetal heart occurs via targeting cardiac fibroblasts."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Bile acids are elevated in the blood of women with intrahepatic cholestasis of pregnancy (ICP) and this may lead to fetal arrhythmia, fetal hypoxia and potentially fetal death in utero."
    explanation: >-
      States the fetal-arrhythmia route from maternal bile acid elevation to
      intrauterine death that this hypothesis group models.
pathophysiology:
- name: Genetic and Hormonal Susceptibility of Hepatobiliary Transport
  biological_scale: MOLECULAR
  description: >-
    Heterozygous variants in canalicular transporter genes - ABCB4 (phospholipid
    floppase MDR3), ABCB11 (bile salt export pump BSEP) and ATP8B1 - reduce the
    reserve capacity of hepatocellular bile export without causing disease outside
    pregnancy. Genome-wide meta-analysis implicates a broader set of loci acting
    through bile acid synthesis and lipid metabolism. In the third trimester,
    sulfated progesterone metabolites and estrogen glucuronides inhibit BSEP and
    antagonise the bile acid sensor FXR (NR1H4), converting this latent reserve
    deficit into overt cholestasis. The strictly gestational timing of ICP, and its
    resolution after delivery, follow from this gene-by-hormone interaction.
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  genes:
  - preferred_term: ABCB4
    term:
      id: hgnc:45
      label: ABCB4
  - preferred_term: ABCB11
    term:
      id: hgnc:42
      label: ABCB11
  - preferred_term: ATP8B1
    term:
      id: hgnc:3706
      label: ATP8B1
  - preferred_term: NR1H4
    term:
      id: hgnc:7967
      label: NR1H4
  biological_processes:
  - preferred_term: response to estrogen
    modifier: INCREASED
    term:
      id: GO:0043627
      label: response to estrogen
  - preferred_term: bile acid metabolic process
    modifier: DYSREGULATED
    term:
      id: GO:0008206
      label: bile acid metabolic process
  evidence:
  - reference: PMID:42178310
    reference_title: "Genome-wide meta-analysis identifies genetic drivers of bile acid metabolism in intrahepatic cholestasis of pregnancy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The associated loci implicate bile acid synthesis, LDL cholesterol, and lipid metabolism."
    explanation: >-
      GWAS meta-analysis of 4,738 cases anchors the genetic component of susceptibility
      in bile acid synthesis and lipid metabolism pathways.
  - reference: PMID:42178310
    reference_title: "Genome-wide meta-analysis identifies genetic drivers of bile acid metabolism in intrahepatic cholestasis of pregnancy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Previous studies have implicated liver-enriched genes in intrahepatic cholestasis of pregnancy."
    explanation: >-
      Supports a liver-intrinsic genetic contribution. The specific ABCB4/ABCB11/ATP8B1
      transporter variants named in this node description are not individually
      enumerated in this snippet and would benefit from a dedicated citation.
  - reference: PMID:42486596
    reference_title: "Intrahepatic Cholestasis of Pregnancy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Etiology is likely related to effects of estrogen and progesterone."
    explanation: >-
      Review support for the sex-steroid arm of the gene-by-hormone interaction that
      makes this a pregnancy-restricted disorder.
  downstream:
  - target: Impaired Hepatocellular Bile Acid Export
    description: >-
      Reduced transporter reserve, further inhibited by third-trimester sex steroid
      metabolites, lowers canalicular bile acid efflux capacity.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - sulfated progesterone metabolite inhibition of BSEP
    - FXR antagonism reducing transporter transcription
- name: Impaired Hepatocellular Bile Acid Export
  conforms_to: "cholestatic_liver_injury#Impaired Bile Formation and Secretion"
  biological_scale: CELLULAR
  description: >-
    Canalicular export of bile salts and phospholipid falls below the load presented
    to the hepatocyte, producing intrahepatic cholestasis with retention of bile
    acids inside the hepatocyte and a modest hepatocellular injury signature
    (raised aminotransferases). Unlike the biliary-obstruction cholestases, jaundice
    is uncommon and hepatic architecture is preserved, and the process reverses
    within days to weeks of delivery.
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  biological_processes:
  - preferred_term: bile acid and bile salt transport
    modifier: DECREASED
    term:
      id: GO:0015721
      label: bile acid and bile salt transport
  evidence:
  - reference: PMID:42486596
    reference_title: "Intrahepatic Cholestasis of Pregnancy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Intrahepatic cholestasis of pregnancy is the most common liver disorder induced by pregnancy."
    explanation: Establishes ICP as a hepatic cholestatic disorder of pregnancy.
  downstream:
  - target: Maternal Bile Acid Accumulation
    description: Failure of hepatic clearance raises circulating total bile acid concentration.
    causal_link_type: DIRECT
- name: Maternal Bile Acid Accumulation
  conforms_to: "cholestatic_liver_injury#Hepatocellular and Biliary Bile Acid Retention"
  biological_scale: ORGANISM
  description: >-
    Total serum bile acids rise, typically from the end of the second trimester.
    This is simultaneously the diagnostic biochemical abnormality, the driver of
    maternal pruritus, and - critically - the quantitative determinant of fetal
    risk. Because symptom intensity correlates poorly with concentration, serial
    quantitative bile acid measurement rather than clinical severity governs
    management.
  biological_processes:
  - preferred_term: bile acid metabolic process
    modifier: DYSREGULATED
    term:
      id: GO:0008206
      label: bile acid metabolic process
  evidence:
  - reference: PMID:31378395
    reference_title: "Ursodeoxycholic acid versus placebo in women with intrahepatic cholestasis of pregnancy (PITCHES): a randomised controlled trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Intrahepatic cholestasis of pregnancy, characterised by maternal pruritus and increased serum bile acid concentrations, is associated with increased rates of stillbirth, preterm birth, and neonatal unit admission."
    explanation: >-
      Links the maternal bile acid elevation to the pruritus phenotype and to the
      perinatal outcome set modeled downstream.
  downstream:
  - target: Transplacental Bile Acid Transfer and Fetal Accumulation
    description: >-
      A maternal-to-fetal concentration gradient drives bile acid transfer across the
      placenta once maternal clearance is impaired.
    hypothesis_groups:
    - fetal_bile_acid_cardiotoxicity_model
    causal_link_type: DIRECT
  - target: Pruritus
    description: >-
      Retained bile acids and associated pruritogens activate cutaneous itch
      pathways, characteristically on the palms and soles and worse at night.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Transplacental Bile Acid Transfer and Fetal Accumulation
  biological_scale: ORGANISM
  description: >-
    The fetus normally exports bile acids to the maternal circulation across the
    placenta. When the maternal compartment is loaded, this gradient flattens or
    reverses and bile acids accumulate in fetal serum, amniotic fluid and meconium.
    Fetal accumulation is the necessary link between a maternal hepatic disorder and
    a fetal cardiac event, and accounts for the meconium-stained liquor that
    accompanies severe disease.
  cell_types:
  - preferred_term: syncytiotrophoblast
    term:
      id: CL:0000525
      label: syncytiotrophoblast cell
  biological_processes:
  - preferred_term: bile acid and bile salt transport
    modifier: DYSREGULATED
    term:
      id: GO:0015721
      label: bile acid and bile salt transport
  evidence:
  - reference: PMID:26777584
    reference_title: "The protective effect of ursodeoxycholic acid in an in vitro model of the human fetal heart occurs via targeting cardiac fibroblasts."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "Bile acids are elevated in the blood of women with intrahepatic cholestasis of pregnancy (ICP) and this may lead to fetal arrhythmia, fetal hypoxia and potentially fetal death in utero."
    explanation: >-
      Supports the maternal-bile-acid-to-fetal-harm axis. The snippet does not itself
      quantify transplacental transfer or fetal compartment concentrations, which
      remain to be cited directly.
  downstream:
  - target: Fetal Cardiomyocyte Electrophysiological Disturbance
    description: >-
      Fetal myocardial exposure to taurocholic acid and related bile acids perturbs
      calcium handling and conduction.
    hypothesis_groups:
    - fetal_bile_acid_cardiotoxicity_model
    causal_link_type: DIRECT
- name: Fetal Cardiomyocyte Electrophysiological Disturbance
  biological_scale: CELLULAR
  description: >-
    Taurocholic acid produces abnormal calcium dynamics and impaired contraction in
    cardiomyocytes, slows ventricular conduction, and promotes arrhythmia. Cardiac
    fibroblast-cardiomyocyte coupling contributes: bile acids and hypoxia promote
    fibroblast-to-myofibroblast transition and gap-junctional depolarisation of
    cardiomyocytes, and ursodeoxycholic acid acts partly by hyperpolarising these
    myofibroblasts. This node is the mechanistic core of the stillbirth model and is
    where the human-translation uncertainty is concentrated.
  cell_types:
  - preferred_term: fetal cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: cardiac muscle cell action potential
    modifier: ABNORMAL
    term:
      id: GO:0086001
      label: cardiac muscle cell action potential
  evidence:
  - reference: PMID:26777584
    reference_title: "The protective effect of ursodeoxycholic acid in an in vitro model of the human fetal heart occurs via targeting cardiac fibroblasts."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The bile acid taurocholic acid (TC) causes abnormal calcium dynamics and contraction in neonatal rat cardiomyocytes."
    explanation: >-
      Direct cardiomyocyte-level evidence that the accumulating bile acid species
      disturbs excitation-contraction coupling.
  - reference: PMID:26777584
    reference_title: "The protective effect of ursodeoxycholic acid in an in vitro model of the human fetal heart occurs via targeting cardiac fibroblasts."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Ursodeoxycholic acid (UDCA), a drug clinically used to treat ICP, prevents adverse effects of TC."
    explanation: >-
      Pharmacological rescue in the same system supports the causal direction from
      bile acid exposure to the cardiac disturbance.
  downstream:
  - target: Stillbirth
    description: >-
      A bile-acid-triggered fetal arrhythmia is the proposed terminal event in the
      sudden intrauterine death characteristic of severe ICP.
    hypothesis_groups:
    - fetal_bile_acid_cardiotoxicity_model
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - fetal arrhythmia
    - fetal hypoxia
phenotypes:
- name: Pruritus
  category: Dermatological
  frequency: OBLIGATE
  diagnostic: true
  description: >-
    Intense itching without a primary rash, classically involving the palms and
    soles and worse at night, beginning most often at the end of the second
    trimester. It is the presenting symptom and is required for the diagnosis, but
    its severity does not track bile acid concentration or fetal risk.
  phenotype_term:
    preferred_term: Pruritus
    term:
      id: HP:0000989
      label: Pruritus
  evidence:
  - reference: PMID:42486596
    reference_title: "Intrahepatic Cholestasis of Pregnancy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "It is characterized by pruritus, with onset typically at the end of the second trimester."
    explanation: Establishes pruritus as the defining symptom and its typical timing.
- name: Increased serum bile acid concentration
  category: Biochemical
  frequency: OBLIGATE
  diagnostic: true
  description: >-

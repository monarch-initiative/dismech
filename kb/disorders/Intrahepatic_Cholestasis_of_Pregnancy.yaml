name: Intrahepatic Cholestasis of Pregnancy
creation_date: "2026-08-02T00:00:00Z"
category: Complex
synonyms:
- ICP
- Obstetric cholestasis
- Cholestasis of pregnancy
description: >-
  Intrahepatic cholestasis of pregnancy (ICP) is the most common pregnancy-specific
  liver disorder, affecting roughly 0.2-2% of pregnancies. Genetically susceptible
  biliary transport (notably ABCB4, ABCB11 and ATP8B1 variants, and the wider
  bile-acid-synthesis and lipid-metabolism loci identified by genome-wide analysis)
  is unmasked by the high estrogen and progesterone metabolite load of the third
  trimester, impairing hepatocellular bile acid export. Maternal serum bile acids
  rise, producing the cardinal symptom of pruritus and raised aminotransferases.
  Bile acids cross the placenta and accumulate in the fetal compartment, where they
  disturb cardiomyocyte calcium handling and conduction; this is the leading
  mechanistic explanation for the sudden, unpredictable stillbirth that defines the
  clinical danger of the condition. Stillbirth risk is concentrated in women whose
  maximum total bile acid concentration reaches 100 micromol/L or more, which is why
  serial bile acid measurement rather than symptom severity drives management.
  Ursodeoxycholic acid is widely prescribed and is antiarrhythmic in fetal cardiac
  models, but the PITCHES randomised trial found no reduction in adverse perinatal
  outcomes, so timed delivery remains the principal risk-reduction strategy.

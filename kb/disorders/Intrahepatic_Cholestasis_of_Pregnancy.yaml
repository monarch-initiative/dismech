    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Intrahepatic cholestasis of pregnancy, which affects 0.2-2% of pregnancies, is characterized by pruritus, increased aminotransferase activity and elevated serum bile acids."
    explanation: Establishes elevated serum bile acids as a defining biochemical feature.
- name: Elevated hepatic transaminases
  category: Biochemical

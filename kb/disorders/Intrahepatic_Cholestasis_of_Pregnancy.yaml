  phenotype_term:
    preferred_term: Elevated circulating hepatic transaminase concentration
    term:
      id: HP:0002910
      label: Elevated circulating hepatic transaminase concentration
  evidence:
  - reference: PMID:42178310
    reference_title: "Genome-wide meta-analysis identifies genetic drivers of bile acid metabolism in intrahepatic cholestasis of pregnancy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Intrahepatic cholestasis of pregnancy, which affects 0.2-2% of pregnancies, is characterized by pruritus, increased aminotransferase activity and elevated serum bile acids."
    explanation: >-
      Supports raised aminotransferase activity as a characteristic feature. The
      snippet does not quantify a frequency, so the FREQUENT band reflects general

- name: Acute thrombotic vascular occlusion and ischemic tissue injury
  description: >-
    In the locally occlusive arterial branch of thrombotic APS, arterial
    thrombosis can reduce perfusion and cause acute ischemia or infarction. This
    conforming node does not claim a distant embolic mechanism, does not apply
    to every nonocclusive or venous thrombus, and excludes cumulative damage
    accrual and nonthrombotic placental immune injury.
  conforms_to: "thrombogenesis#Thrombotic Vascular Occlusion and Ischemic Tissue Injury"
  locations:
  - preferred_term: heart
    term:
      id: UBERON:0000948

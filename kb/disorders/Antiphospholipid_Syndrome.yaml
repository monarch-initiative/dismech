treatments:
- name: Long-term warfarin anticoagulation
  action_category: THERAPEUTIC
  description: >-
    Vitamin K antagonist therapy is standard secondary prevention for
    thrombotic APS. For a first unprovoked venous event, the usual target INR is
    2-3; after an arterial event, INR 2-3 versus 3-4 is individualized to
    thrombosis and bleeding risk. Recurrent thrombosis despite adequate therapy
    prompts adherence/INR review and selected escalation rather than assuming
    universal treatment failure.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: warfarin
      term:
        id: CHEBI:10033
        label: warfarin
  target_phenotypes:
  - preferred_term: Venous thrombosis
    term:
      id: HP:0004936
      label: Venous thrombosis
  - preferred_term: Arterial thrombosis
    term:
      id: HP:0004420
      label: Arterial thrombosis
  target_mechanisms:
  - target: Coagulation cascade activation and thrombin-driven fibrin formation
    treatment_effect: INHIBITS
    description: Vitamin K antagonism reduces thrombin generation and recurrence risk; it does not remove aPL or normalize upstream autoimmunity.
    evidence:
    - reference: PMID:31092409
      reference_title: EULAR recommendations for the management of antiphospholipid syndrome in adults.
      supports: PARTIAL
      evidence_source: OTHER
      snippet: Patients with APS and first unprovoked venous thrombosis should receive long-term treatment with vitamin K antagonists (VKA) with a target international normalised ratio (INR) of 2-3.
      explanation: The recommendation supports targeting the coagulation arm, while the molecular treatment effect is a pharmacologic inference.
  evidence:
  - reference: PMID:31092409
    reference_title: EULAR recommendations for the management of antiphospholipid syndrome in adults.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Patients with APS and first unprovoked venous thrombosis should receive long-term treatment with vitamin K antagonists (VKA) with a target international normalised ratio (INR) of 2-3.
    explanation: This directly supports long-term VKA therapy and the usual venous target INR.
  - reference: PMID:31092409
    reference_title: EULAR recommendations for the management of antiphospholipid syndrome in adults.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: In patients with APS with first arterial thrombosis, treatment with VKA with INR 2-3 or INR 3-4 is recommended, considering the individual's bleeding/thrombosis risk.
    explanation: This supports individualized VKA intensity after arterial thrombosis.
  - reference: PMID:36328154
    reference_title: "Direct Oral Anticoagulants vs Vitamin K Antagonists in Patients With Antiphospholipid Syndromes: Meta-Analysis of Randomized Trials."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Patients with thrombotic antiphospholipid syndrome randomized to DOACs compared with VKAs appear to have increased risk for arterial thrombosis.
    explanation: Randomized-trial meta-analysis argues against routine DOAC substitution, especially when arterial risk is relevant.
  notes: >-
    Rivaroxaban should not be used in triple-aPL-positive APS. Evidence for DOACs
    in lower-risk single- or double-positive venous-only populations is less
    definitive, so anticoagulant choice is individualized rather than implying
    that every DOAC exposure has identical risk.
- name: Heparin plus low-dose aspirin in pregnancy
  action_category: THERAPEUTIC
  description: >-
    Low-dose aspirin plus prophylactic-dose heparin is recommended during
    pregnancy for women with prior obstetric APS. Dosing and peripartum timing
    require individualized obstetric and thrombosis planning; this statement
    does not extend the regimen to every aPL-positive pregnancy.
  treatment_term:
    preferred_term: aspirin therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: heparin
      term:
        id: CHEBI:28304
        label: heparin
    - preferred_term: aspirin
      term:
        id: CHEBI:15365
        label: acetylsalicylic acid
  target_phenotypes:
  - preferred_term: Miscarriage
  - preferred_term: Stillbirth
  - preferred_term: Preterm Birth
    term:
      id: HP:0001622
      label: Premature birth
  target_mechanisms:
  - target: Platelet activation
    treatment_effect: INHIBITS
    description: Low-dose aspirin inhibits platelet thromboxane signaling within the obstetric regimen.
    evidence:
    - reference: PMID:31092409
      reference_title: EULAR recommendations for the management of antiphospholipid syndrome in adults.
      supports: PARTIAL
      evidence_source: OTHER
      snippet: In women with prior obstetric APS, combination treatment with LDA and prophylactic dosage heparin during pregnancy is recommended.
      explanation: The clinical recommendation supports the regimen; platelet-pathway attribution follows aspirin pharmacology.
  - target: Coagulation cascade activation and thrombin-driven fibrin formation
    treatment_effect: INHIBITS
    description: Heparin suppresses coagulation within the combined regimen and may have additional placental effects.
    evidence:
    - reference: PMID:31092409
      reference_title: EULAR recommendations for the management of antiphospholipid syndrome in adults.
      supports: PARTIAL
      evidence_source: OTHER
      snippet: In women with prior obstetric APS, combination treatment with LDA and prophylactic dosage heparin during pregnancy is recommended.
      explanation: The clinical recommendation supports heparin use; this does not prove that anticoagulation is the sole placental mechanism.
  evidence:
  - reference: PMID:31092409
    reference_title: EULAR recommendations for the management of antiphospholipid syndrome in adults.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: In women with prior obstetric APS, combination treatment with LDA and prophylactic dosage heparin during pregnancy is recommended.
    explanation: This directly supports the standard obstetric regimen and its population boundary.
- name: Adjunct hydroxychloroquine
  action_category: THERAPEUTIC
  description: >-
    Hydroxychloroquine may be considered as an add-on when pregnancy
    complications recur despite aspirin plus heparin. It is not a substitute
    for anticoagulation in thrombotic APS, and evidence for APS-specific benefit
    remains limited.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: hydroxychloroquine
      term:
        id: CHEBI:5801
        label: hydroxychloroquine
  target_phenotypes:
  - preferred_term: Miscarriage
  target_mechanisms:
  - target: Placental immune injury
    treatment_effect: INHIBITS
    description: Hydroxychloroquine is used as an immunomodulatory adjunct, but the clinical recommendation does not establish one placental molecular target.
    evidence:
    - reference: PMID:31092409
      reference_title: EULAR recommendations for the management of antiphospholipid syndrome in adults.
      supports: PARTIAL
      evidence_source: OTHER
      snippet: In patients with recurrent pregnancy complications, increase of heparin to therapeutic dose, addition of hydroxychloroquine or addition of low-dose prednisolone in the first trimester may be considered.
      explanation: This supports use as an obstetric add-on while leaving the specific placental mechanism uncertain.
  evidence:
  - reference: PMID:31092409
    reference_title: EULAR recommendations for the management of antiphospholipid syndrome in adults.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: In patients with recurrent pregnancy complications, increase of heparin to therapeutic dose, addition of hydroxychloroquine or addition of low-dose prednisolone in the first trimester may be considered.
    explanation: The guideline frames hydroxychloroquine as an option for recurrence, not routine first-line monotherapy.
- name: Catastrophic APS combination therapy
  action_category: THERAPEUTIC
  description: >-
    Suspected catastrophic APS is a medical emergency. Standard combination
    treatment uses therapeutic intravenous heparin plus glucocorticoids and
    plasma exchange and/or IVIG while the precipitating factor and organ failure
    are treated. Diagnostic testing should not delay therapy when suspicion is
    high.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: heparin
      term:
        id: CHEBI:28304
        label: heparin
    - preferred_term: glucocorticoid
      term:
        id: CHEBI:24261
        label: glucocorticoid
  target_mechanisms:
  - target: Coagulation cascade activation and thrombin-driven fibrin formation
    treatment_effect: INHIBITS
    description: Intravenous heparin suppresses the coagulation arm of catastrophic thromboinflammation.
    evidence:
    - reference: PMID:39644034
      reference_title: "Catastrophic antiphospholipid syndrome: a CAPS-tivating hematologic disease."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: Management of CAPS requires "triple therapy" with glucocorticoids, intravenous heparin, therapeutic plasma exchange, and/or intravenous immunoglobulin.
      explanation: This supports heparin as a required component; the target-mechanism statement reflects anticoagulant pharmacology.
  - target: Complement activation
    treatment_effect: INHIBITS
    description: Plasma exchange, IVIG, and glucocorticoids broadly modulate antibody-driven inflammation; their benefit is not proof that one complement step dominates every CAPS case.
    evidence:
    - reference: PMID:27886797
      reference_title: "Catastrophic antiphospholipid syndrome: The current management approach."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: from the experimental or basic point of view, there is only indirect evidence to advocate the use of these immunomodulatory therapies (GC, PE, and IVIG) in CAPS.
      explanation: This explicitly limits mechanistic confidence for the immunomodulatory components.
  evidence:
  - reference: PMID:39644034
    reference_title: "Catastrophic antiphospholipid syndrome: a CAPS-tivating hematologic disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Management of CAPS requires "triple therapy" with glucocorticoids, intravenous heparin, therapeutic plasma exchange, and/or intravenous immunoglobulin.
    explanation: This directly supports current combination management.
- name: Rituximab or eculizumab for refractory catastrophic APS
  action_category: THERAPEUTIC
  description: >-
    B-cell depletion with rituximab or C5 inhibition with eculizumab may be used
    in selected refractory CAPS, but support is based on poor-quality evidence
    rather than randomized trials. These agents are escalation options, not
    routine substitutes for combination therapy.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: rituximab
      term:
        id: NCIT:C1702
        label: Rituximab
    - preferred_term: eculizumab
      term:
        id: NCIT:C48386
        label: Eculizumab
  target_mechanisms:
  - target: Autoantibody generation against beta2GPI and phospholipid complexes
    treatment_effect: INHIBITS
    description: Rituximab depletes CD20-positive B cells upstream of ongoing autoantibody production.
    evidence:
    - reference: PMID:27886797
      reference_title: "Catastrophic antiphospholipid syndrome: The current management approach."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: The first blocks CD20, a surface protein expressed on the cytoplasmic membrane of B cells, and decreases the generation of pathogenic autoantibodies such as antiphospholipid (aPL) antibodies.
      explanation: This supports the proposed B-cell/aPL target, but clinical outcome evidence remains limited.
  - target: Complement activation
    treatment_effect: INHIBITS
    description: Eculizumab blocks C5 cleavage and terminal-complement-complex generation.
    evidence:
    - reference: PMID:27886797
      reference_title: "Catastrophic antiphospholipid syndrome: The current management approach."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: The second binds with high affinity to C5 complement protein, inhibiting its cleavage and thus preventing the generation of C5b-C9 complex.
      explanation: This directly supports the molecular target, while clinical efficacy evidence is limited to reports.
  evidence:
  - reference: PMID:39644034
    reference_title: "Catastrophic antiphospholipid syndrome: a CAPS-tivating hematologic disease."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: Treatment for refractory disease is based on poor-quality evidence but includes anti-CD20 (rituximab) or anticomplement (eculizumab) monoclonal antibodies and other immunosuppressant agents, either alone or in combination.
    explanation: This supports selected refractory use and explicitly records the evidence limitation.
differential_diagnoses:
- name: Thrombotic thrombocytopenic purpura
  description: >-
    Thrombotic thrombocytopenic purpura can closely mimic catastrophic APS
    through thrombocytopenia, microangiopathic hemolysis, neurologic injury,
    renal dysfunction, and multiorgan ischemia.
  distinguishing_features:
  - Undetectable ADAMTS13 activity strongly favors thrombotic thrombocytopenic purpura.
  - >-
    Rapid multisite thrombosis and organ dysfunction in a patient with a
    qualifying APS clinical and persistent laboratory context support CAPS;
    aPL positivity alone and empiric anticoagulation do not distinguish CAPS
    from TTP.
  disease_term:
    preferred_term: thrombotic thrombocytopenic purpura
    term:
      id: MONDO:0018896
      label: thrombotic thrombocytopenic purpura
  evidence:
  - reference: PMID:10483019
    reference_title: "Relapsing catastrophic antiphospholipid antibody syndrome: a mimic for thrombotic thrombocytopenic purpura?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The differential diagnosis of CAPS includes thrombotic thrombocytopenic purpura (TTP) and this distinction may be difficult, but essential, for appropriate therapy.
    explanation: This directly identifies TTP as a core differential diagnosis for catastrophic APS.
  - reference: PMID:25879992
    reference_title: "Differentiation between severe HELLP syndrome and thrombotic microangiopathy, thrombotic thrombocytopenic purpura and other imitators."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The definitive marker for thrombotic thrombocytopenic purpura is undetectable ADAMTS 13 activity.
    explanation: This supports ADAMTS13 deficiency as a key laboratory feature distinguishing TTP from APS-related thrombotic microangiopathy.
- name: HELLP syndrome
  description: >-
    HELLP syndrome overlaps with obstetric APS and catastrophic APS through
    thrombocytopenia, hemolysis, liver injury, and severe pregnancy-associated
    maternal morbidity.
  distinguishing_features:
  - A pregnancy-specific pre-eclampsia context with hemolysis, elevated liver enzymes, and low platelet count favors HELLP syndrome.
  - Neurologic involvement, dialysis requirement, or absent disseminated intravascular coagulation raise concern for thrombotic microangiopathy or APS mimics rather than isolated HELLP.
  disease_term:
    preferred_term: HELLP syndrome
    term:
      id: MONDO:0008585
      label: HELLP syndrome
  evidence:
  - reference: PMID:25879992
    reference_title: "Differentiation between severe HELLP syndrome and thrombotic microangiopathy, thrombotic thrombocytopenic purpura and other imitators."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Pre-eclampsia complicated by severe HELLP (hemolysis, elevated liver enzymes and low platelet count) syndrome is a multi-organ disease, and can be difficult to differentiate from thrombotic microangiopathy (appearing as thrombotic thrombocytopenic purpura or hemolytic uremic syndrome), acute fatty liver, systemic erythematous lupus, antiphospholipid syndrome and severe sepsis.
    explanation: This review explicitly names antiphospholipid syndrome among the major disorders that can be confused with severe HELLP syndrome.
  - reference: PMID:25879992
    reference_title: "Differentiation between severe HELLP syndrome and thrombotic microangiopathy, thrombotic thrombocytopenic purpura and other imitators."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Relevant identifiers to establish the most accurate diagnosis include the frequency of each disease and anamnestic data. Frank hemolysis, need for dialysis, neurological involvement and absence of disseminated intravascular coagulation are indicative of thrombotic microangiopathy.
    explanation: This supports specific distinguishing features that help separate HELLP syndrome from APS-related thrombotic microangiopathy.
- name: Systemic lupus erythematosus
  description: >-
    Systemic lupus erythematosus frequently co-occurs with APS and may be
    mistaken for primary APS when antiphospholipid antibodies are present
    alongside broader systemic autoimmune findings.
  distinguishing_features:
  - SLE-specific nephropathy, arthritis, cutaneous or neurologic lupus manifestations, anti-dsDNA, anti-Sm, or high-titer ANA favor systemic lupus erythematosus.
  - Strictly defined primary APS can satisfy some lupus classification items without progressing to clinical SLE on long-term follow-up.
  disease_term:
    preferred_term: systemic lupus erythematosus
    term:
      id: MONDO:0007915
      label: systemic lupus erythematosus
  evidence:
  - reference: PMID:30005859
    reference_title: "Classification of primary antiphospholipid syndrome as systemic lupus erythematosus: Analysis of a cohort of 214 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We successively excluded patients with (1) at least one "SLE-specific" manifestation (biopsy-proven SLE nephropathy, arthritis, cutaneous, or neurologic SLE manifestations, pericarditis, autoimmune haemolytic anaemia, oral and nasal ulcers, non-scarring alopecia, anti-dsDNA, and anti-Sm antibodies), (2) any other autoimmune connective tissue disease, and/or (3) antinuclear antibodies >1/320.
    explanation: This cohort analysis outlines the clinical and serologic features used to distinguish SLE from primary APS.
  - reference: PMID:30005859
    reference_title: "Classification of primary antiphospholipid syndrome as systemic lupus erythematosus: Analysis of a cohort of 214 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Because 28% of our patients with longstanding and strictly defined PAPS could be mistakenly classified as SLE, they were at risk of deleterious therapeutic management.
    explanation: This directly supports SLE as an important diagnostic pitfall and differential diagnosis for primary APS.

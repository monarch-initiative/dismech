name: Antiphospholipid Syndrome
creation_date: '2025-12-04T16:57:31Z'
synonyms:
- APS
- antiphospholipid antibody syndrome
- Hughes syndrome
description: >-
  An acquired systemic autoimmune thrombophilia in which persistent,
  clinically relevant antiphospholipid antibodies occur in association with
  arterial, venous, or microvascular thrombosis and/or defined pregnancy
  morbidity. Competing causes affect clinical attribution; antibody positivity
  without an associated manifestation is an aPL-carrier state, not
  "asymptomatic APS." The thrombogenesis conformance below is confined to the
  thrombotic branch: thrombosis is neither necessary in obstetric-only APS nor
  sufficient for APS diagnosis without persistent clinically relevant aPL and
  appropriate clinical attribution.
notes: >-
  Conformance to thrombogenesis is intentionally node-level and limited to the
  platelet, coagulation/thrombin/fibrin, pathological fibrin-platelet thrombus,
  and local thrombotic-occlusion/ischemic-injury steps of thrombotic APS.
  Impaired fibrinolysis is represented as a parallel, nonconforming persistence
  amplifier, and cumulative damage accrual is a downstream, nonconforming
  outcome rather than part of the acute ischemic anchor. No node is mapped to
  the module's Virchow-triad trigger because the APS evidence supports
  heterogeneous aPL-dependent thromboinflammatory priming rather than one exact
  triad limb that is necessary in every event. The obstetric-only branch can
  proceed through placental immune injury without thrombosis. Module treatments
  are not inherited: APS therapy remains disease-specific, including vitamin K
  antagonist secondary prevention and the existing warning against rivaroxaban
  in triple-aPL-positive APS.
definitions:
- name: 2023 ACR/EULAR APS classification criteria
  definition_type: OTHER
  description: >-
    A weighted research-classification system designed for high specificity.
    It is not a stand-alone diagnostic rule and should not override clinical
    judgment or exclude otherwise clinically diagnosed patients.
  scope: Research classification of people with suspected APS
  criteria_sets:
  - name: Entry criterion
    description: >-
      At least one positive aPL test must occur within three years of an
      aPL-associated clinical criterion.
    minimum_required: 1
    evidence:
    - reference: PMID:37640450
      reference_title: 2023 ACR/EULAR antiphospholipid syndrome classification criteria.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: The 2023 ACR/EULAR APS classification criteria include an entry criterion of at least one positive antiphospholipid antibody (aPL) test within 3 years of identification of an aPL-associated clinical criterion
      explanation: This is the temporal entry gate for applying the weighted criteria.
  - name: Weighted clinical and laboratory domains
    description: >-
      After the entry criterion, classification requires at least three points
      from clinical domains and at least three points from laboratory domains.
      Clinical domains are macrovascular venous, macrovascular arterial,
      microvascular, obstetric, cardiac-valve, and hematologic; laboratory
      domains are lupus-anticoagulant functional assays and solid-phase aCL or
      anti-beta2GPI assays.
    evidence:
    - reference: PMID:37640450
      reference_title: 2023 ACR/EULAR antiphospholipid syndrome classification criteria.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Patients accumulating at least three points each from the clinical and laboratory domains are classified as having APS.
      explanation: This gives the two independent score thresholds.
  evidence:
  - reference: PMID:37640450
    reference_title: 2023 ACR/EULAR antiphospholipid syndrome classification criteria.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: To develop new antiphospholipid syndrome (APS) classification criteria with high specificity for use in observational studies and trials, jointly supported by the American College of Rheumatology (ACR) and EULAR.
    explanation: The stated purpose confines this tool to classification for research rather than clinical diagnosis.
- name: 2006 revised Sapporo (Sydney) classification criteria
  definition_type: OTHER
  description: >-
    The historical research criteria require at least one qualifying thrombosis
    or pregnancy-morbidity criterion and at least one qualifying laboratory
    criterion, with persistent aPL demonstrated on two tests at least 12 weeks
    apart. They remain clinically informative but are classification criteria.
  scope: Historical research classification of thrombotic or obstetric APS
  criteria_sets:
  - name: Clinical criterion
    description: >-
      At least one objectively documented vascular thrombosis or qualifying
      pregnancy-morbidity criterion is required.
    minimum_required: 1
    evidence:
    - reference: PMID:24461539
      reference_title: Diagnosis and classification of the antiphospholipid syndrome.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: At least one clinical (vascular thrombosis or pregnancy morbidity) and one laboratory (anticardiolipin antibodies, lupus anticoagulant or anti-β2-glycoprotein I antibodies) criterion had to be met for the classification of APS.
      explanation: This states the required clinical arm and distinguishes classification from diagnosis.
  - name: Persistent laboratory criterion
    description: >-
      At least one qualifying lupus anticoagulant, IgG/IgM anticardiolipin, or
      IgG/IgM anti-beta2GPI result is required, with positivity demonstrated on
      two tests at least 12 weeks apart.
    minimum_required: 1
    evidence:
    - reference: PMID:24461539
      reference_title: Diagnosis and classification of the antiphospholipid syndrome.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: At least one clinical (vascular thrombosis or pregnancy morbidity) and one laboratory (anticardiolipin antibodies, lupus anticoagulant or anti-β2-glycoprotein I antibodies) criterion had to be met for the classification of APS.
      explanation: This supplies the three laboratory families and the clinical-laboratory pairing.
    - reference: PMID:37640450
      reference_title: 2023 ACR/EULAR antiphospholipid syndrome classification criteria.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: the definition of aPL “persistence” (ie, 2 positive tests for aPL at least 12 weeks apart)
      explanation: This states the historical persistence interval retained in current criteria work.
  evidence:
  - reference: PMID:24461539
    reference_title: Diagnosis and classification of the antiphospholipid syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The Sapporo criteria, as they are often called, were revised at another workshop in Sydney, Australia, in 2004, during the 11th International Congress on aPL.
    explanation: This supports the historical Sydney revision represented by this definition.
category: Complex
parents:
- Autoimmune Disease
has_subtypes:
- name: Primary antiphospholipid syndrome
  description: APS occurring without another associated autoimmune disease.
  subtype_term:
    preferred_term: primary antiphospholipid syndrome
    term:
      id: MONDO:0005204
      label: primary antiphospholipid syndrome
  evidence:
  - reference: PMID:27550302
    reference_title: Kidney disease in primary anti-phospholipid antibody syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: APS can be isolated (primary APS) or associated with other autoimmune diseases.
    explanation: This supports the primary-versus-associated distinction.
- name: Secondary antiphospholipid syndrome
  description: >-
    APS occurring with another autoimmune disease, most often systemic lupus
    erythematosus; the associated disease does not remove the requirement for
    clinical APS manifestations and persistent aPL.
  subtype_term:
    preferred_term: secondary antiphospholipid syndrome
    term:
      id: MONDO:0021008
      label: secondary antiphospholipid syndrome
  evidence:
  - reference: PMID:27550302
    reference_title: Kidney disease in primary anti-phospholipid antibody syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: APS can be isolated (primary APS) or associated with other autoimmune diseases.
    explanation: This supports APS associated with another autoimmune disease.
- name: Catastrophic antiphospholipid syndrome
  description: >-
    A rare, life-threatening form with rapidly developing large- and
    small-vessel thrombosis at multiple sites and acute multiorgan dysfunction.
  subtype_term:
    preferred_term: catastrophic antiphospholipid syndrome
    term:
      id: MONDO:0018737
      label: catastrophic antiphospholipid syndrome
  evidence:
  - reference: PMID:39644034
    reference_title: "Catastrophic antiphospholipid syndrome: a CAPS-tivating hematologic disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Catastrophic antiphospholipid syndrome (CAPS) is a rare but life-threatening form of antiphospholipid syndrome (APS) defined by the rapid onset of large and small vessel thrombosis occurring simultaneously across multiple sites, resulting in multiorgan dysfunction.
    explanation: This provides the current clinical boundary for catastrophic APS.
prevalence:
- population: Adults in Olmsted County, Minnesota, 2000-2015
  measure_type: POINT_PREVALENCE
  prevalence_class: BAND_1_5_PER_10000
  rate_per_100000: 50.0
  percentage: 0.05
  notes: >-
    Estimate from 33 incident Sydney-classified cases in a predominantly White
    US population; it should not be treated as a universal global rate.
  evidence:
  - reference: PMID:30957430
    reference_title: "The Epidemiology of Antiphospholipid Syndrome: A Population-Based Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The estimated prevalence of APS was 50 (95% CI 42-58) per 100,000 population, and was similar in both sexes.
    explanation: This supports the point estimate and its cohort-specific uncertainty interval.
- population: Adults in Olmsted County, Minnesota, 2000-2015
  measure_type: ANNUAL_INCIDENCE
  rate_per_100000: 2.1
  notes: Age- and sex-adjusted annual incidence; 95% CI 1.4-2.8 per 100,000.
  evidence:
  - reference: PMID:30957430
    reference_title: "The Epidemiology of Antiphospholipid Syndrome: A Population-Based Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The annual incidence of APS in adults ages ≥18 years was 2.1
    explanation: This is a population-based annual incidence estimate rather than a prevalence measure.
epidemiology:
- name: Sex distribution depends on ascertainment
  description: >-
    Population-based incidence in one US study was similar in women and men;
    female predominance in autoimmune referral cohorts should not be generalized
    to population incidence.
  factors:
  - sex
  evidence:
  - reference: PMID:30957430
    reference_title: "The Epidemiology of Antiphospholipid Syndrome: A Population-Based Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Incidence rates were similar in both sexes.
    explanation: This directly supports the population-based sex boundary.
diagnosis:
- name: Clinical diagnosis integrating manifestations, persistence, and alternatives
  description: >-
    Diagnose APS clinically by integrating objectively documented thrombosis or
    characteristic pregnancy morbidity with a persistent, clinically relevant
    aPL profile, while assessing whether another cause better explains the
    event. A positive aPL test alone is not APS, and neither the 2006 nor 2023
    research-classification criteria should be used as an inflexible diagnostic
    exclusion rule.
  evidence:
  - reference: PMID:37640450
    reference_title: 2023 ACR/EULAR antiphospholipid syndrome classification criteria.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Classification of APS, for the identification of homogeneous research cohorts
    explanation: This explicitly identifies the criteria's research-classification purpose.
  - reference: PMID:15290736
    reference_title: "Antiphospholipid syndrome and asymptomatic carriers of antiphospholipid antibody: prospective analysis of 404 individuals."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: patients with primary or secondary antiphospholipid syndrome (APS, n = 226); and (2) asymptomatic carriers of aPL (n = 178).
    explanation: The study treats aPL carriers as distinct from patients with APS.
- name: Core antiphospholipid laboratory panel
  description: >-
    Test lupus anticoagulant by functional coagulation assays and test IgG/IgM
    anticardiolipin and IgG/IgM anti-beta2GPI by solid-phase immunoassay. Lupus
    anticoagulant is an assay-defined functional phenomenon, not the name of one
    antibody species.
  evidence:
  - reference: PMID:37640450
    reference_title: 2023 ACR/EULAR antiphospholipid syndrome classification criteria.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: laboratory domains (lupus anticoagulant functional coagulation assays, and solid-phase enzyme-linked immunosorbent assays for IgG/IgM anticardiolipin and/or IgG/IgM anti-β2-glycoprotein I antibodies).
    explanation: This defines the core functional and solid-phase assay families without mislabeling lupus anticoagulant as a single antibody.
- name: Confirm persistent antibody positivity
  description: >-
    Repeat a positive criterion aPL result after at least 12 weeks. Persistence
    reduces misclassification from transient aPL, including antibodies detected
    around infection; laboratory interpretation must also account for assay and
    anticoagulant-related interference.
  evidence:
  - reference: PMID:37640450
    reference_title: 2023 ACR/EULAR antiphospholipid syndrome classification criteria.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: '"persistent" aPL test results (at least 12 weeks apart) should be scored based on two consecutive positive lupus anticoagulant (LAC)'
    explanation: The current criteria retain consecutive testing for persistence.
  - reference: PMID:37640450
    reference_title: 2023 ACR/EULAR antiphospholipid syndrome classification criteria.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: the definition of aPL “persistence” (ie, 2 positive tests for aPL at least 12 weeks apart)
    explanation: This supplies the minimum repeat-testing interval.
pathophysiology:
- name: CD4+ T cell dysregulation and autoreactive B cell licensing
  description: >-
    Altered helper, regulatory, and follicular CD4+ T-cell profiles are reported
    in primary APS, but whether they initiate persistent aPL production or arise
    after established autoimmunity remains unresolved.
  cell_types:
  - preferred_term: helper T cell
    term:
      id: CL:0000912
      label: helper T cell
  - preferred_term: regulatory T cell
    term:
      id: CL:0000815
      label: regulatory T cell
  - preferred_term: T follicular helper cell
    term:
      id: CL:0002038
      label: T follicular helper cell
  downstream:
  - target: Autoantibody generation against beta2GPI and phospholipid complexes
    description: >-
      Autoreactive CD4+ T-cell help is a plausible contributor to aPL-specific
      B-cell responses; human observations are associative and the upstream
      trigger is unknown.
    causal_link_type: UNKNOWN
    evidence:
    - reference: PMID:42229606
      reference_title: "Dysregulation of helper, regulatory, and follicular CD4(+) T cells in primary antiphospholipid syndrome: Immunopathology and implications for targeted immunomodulatory therapy."
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: Experimental studies demonstrate that autoreactive aPL-specific CD4+ T cells are critical for initiating and maintaining aPL responses.
      explanation: Experimental studies support T-cell dependence, but do not establish the direction of causality in human APS.
  evidence:
  - reference: PMID:42229606
    reference_title: "Dysregulation of helper, regulatory, and follicular CD4(+) T cells in primary antiphospholipid syndrome: Immunopathology and implications for targeted immunomodulatory therapy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: APS is skewed toward Th1 and Th17 polarization, diminished Treg frequency or function, and a dysregulated Tfh/Tfr axis. Specifically, increased activated Tfh cells alongside reduced Tfr cells and skewing toward Tfh17-like subsets, have been linked to increased aPL titres and disease burden.
    explanation: The human associations support immune imbalance but do not show that it drives aPL production.
  - reference: PMID:42229606
    reference_title: "Dysregulation of helper, regulatory, and follicular CD4(+) T cells in primary antiphospholipid syndrome: Immunopathology and implications for targeted immunomodulatory therapy."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: the cumulative data support a model in which APS involves a coordinated disruption of CD4+ T cell homeostasis, encompassing both effector and regulatory arms.
    explanation: The authors propose a coordinated-imbalance model while explicitly noting inconsistent findings.
- name: Autoantibody generation against beta2GPI and phospholipid complexes
  description: >-
    Persistent aPL responses are heterogeneous but clinically important
    reactivity is commonly directed against phospholipid-binding proteins,
    especially beta2GPI. The immune events that initiate and sustain these
    responses are incompletely established.
  cell_types:
  - preferred_term: B cell
    term:
      id: CL:0000236
      label: B cell
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  biological_processes:
  - preferred_term: immunoglobulin production
    term:
      id: GO:0002377
      label: immunoglobulin production
  downstream:
  - target: Cell-surface beta2GPI binding
    description: Circulating aPL bind beta2GPI and phospholipid-associated targets on vascular and placental surfaces.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:29867951
      reference_title: "Cellular and Molecular Mechanisms of Anti-Phospholipid Syndrome."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: Clinically, the binding of antibodies to β2GPI could contribute to pathogenesis by formation of immune complexes or modification of coagulation steps that operate along cell surfaces.
      explanation: This supports the transition from antibody generation to pathogenic beta2GPI binding on cell surfaces.
  - target: Impaired fibrinolysis
    description: >-
      aPL directed against annexin-2, tissue-type plasminogen activator, and
      plasminogen can directly compromise fibrinolytic activity.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:33878780
      reference_title: "Impaired Fibrinolysis in the Antiphospholipid Syndrome."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: Increased levels of plasminogen activator inhibitor-1 and thrombin-activatable fibrinolysis inhibitor, together with the presence of aPL against annexin-2, tissue-type plasminogen activator, and plasminogen contribute to the compromised fibrinolytic activity in these patients.
      explanation: >-
        The cited aPL specificities link the autoantibody-generation node to
        reduced fibrinolytic activity and reconnect the split persistence arm
        without treating impaired fibrinolysis as an independent initiating
        lesion.
  - target: Antiphospholipid antibody positivity
    description: Autoantibody generation manifests clinically as antiphospholipid antibody positivity.
    causal_link_type: DIRECT
    evidence:
    - reference: ORPHA:80
      reference_title: Antiphospholipid syndrome
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "HP:0003613 | Antiphospholipid antibody positivity | Frequent (79-30%)"
      explanation: Orphanet records antiphospholipid antibody positivity as a frequent APS phenotype.
  - target: Anticardiolipin IgG antibody positivity
    description: Autoantibody generation includes anticardiolipin IgG antibodies.
    causal_link_type: DIRECT
    evidence:
    - reference: ORPHA:80
      reference_title: Antiphospholipid syndrome
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "HP:0020136 | Anticardiolipin IgG antibody positivity | Frequent (79-30%)"
      explanation: Orphanet records anticardiolipin IgG antibody positivity as a frequent APS phenotype.
  - target: Anticardiolipin IgM antibody positivity
    description: Autoantibody generation includes anticardiolipin IgM antibodies.
    causal_link_type: DIRECT
    evidence:
    - reference: ORPHA:80
      reference_title: Antiphospholipid syndrome
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "HP:0020137 | Anticardiolipin IgM antibody positivity | Frequent (79-30%)"
      explanation: Orphanet records anticardiolipin IgM antibody positivity as a frequent APS phenotype.
  - target: Lupus anticoagulant
    description: Autoantibody generation includes lupus anticoagulant activity detected in APS laboratory testing.
    causal_link_type: DIRECT
    evidence:
    - reference: ORPHA:80
      reference_title: Antiphospholipid syndrome
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "HP:0025343 | Lupus anticoagulant | Frequent (79-30%)"
      explanation: Orphanet records lupus anticoagulant as a frequent APS phenotype.
  - target: Anti-beta 2 glycoprotein I antibody positivity
    description: Autoantibody generation includes anti-beta2 glycoprotein I antibodies.
    causal_link_type: DIRECT
    evidence:
    - reference: ORPHA:80
      reference_title: Antiphospholipid syndrome
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "HP:0032376 | Anti-beta 2 glycoprotein I antibody positivity | Frequent (79-30%)"
      explanation: Orphanet records anti-beta 2 glycoprotein I antibody positivity as a frequent APS phenotype.
  - target: Anti-beta-2-Glycoprotein I IgG antibody positivity
    description: Autoantibody generation includes anti-beta2 glycoprotein I IgG antibodies.
    causal_link_type: DIRECT
    evidence:
    - reference: ORPHA:80
      reference_title: Antiphospholipid syndrome
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "HP:0034156 | Anti-beta-2-Glycoprotein I IgG antibody positivity | Frequent (79-30%)"
      explanation: Orphanet records anti-beta-2-Glycoprotein I IgG antibody positivity as a frequent APS phenotype.
  evidence:
  - reference: PMID:29867951
    reference_title: "Cellular and Molecular Mechanisms of Anti-Phospholipid Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The primary anti-phospholipid syndrome (APS) is characterized by the production of antibodies that bind the phospholipid-binding protein β2 glycoprotein I (β2GPI) or that directly recognize negatively charged membrane phospholipids in a manner that may contribute to arterial or venous thrombosis.
    explanation: This review supports aPL availability as an upstream disease feature while preserving antibody heterogeneity.
  - reference: PMID:33722752
    reference_title: "B cells in primary antiphospholipid syndrome: Review and remaining challenges."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: It is now widely accepted that antiphospholipid antibodies (aPL) have direct pathogenic effects and that B cells, notably through aPL production, play a key role in the development of antiphospholipid syndrome (APS).
    explanation: This supports the role of adaptive immune cells, especially B cells, in generating pathogenic antiphospholipid antibodies.
- name: Cell-surface beta2GPI binding
  description: >-
    Anti-beta2GPI/beta2GPI complexes can assemble along phospholipid-rich cell
    surfaces. Receptor usage and the importance of particular antibody
    specificities vary across experimental systems.
  downstream:
  - target: Innate receptor signaling
    description: Surface-bound immune complexes engage receptors such as TLR4 and trigger downstream inflammatory signaling cascades.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:22055541
      reference_title: "Examining how antiphospholipid antibodies activate intracellular signaling pathways: a systematic review."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: TLR4, p38 MAPK and NFκB are involved in mediating pathogenic effects of aPL on different cell types and may be potential therapeutic targets in antiphospholipid syndrome.
      explanation: This supports the edge from surface beta2GPI binding to receptor-mediated pathogenic signaling.
  - target: Placental immune injury
    description: >-
      Beta2GPI-dependent antibodies can bind trophoblast and decidual surfaces
      and perturb placental-cell function without requiring placental thrombosis.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - trophoblast binding and signaling
    - altered trophoblast proliferation, differentiation, and survival
    evidence:
    - reference: PMID:29867951
      reference_title: "Cellular and Molecular Mechanisms of Anti-Phospholipid Syndrome."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Binding of β2GPI-dependent antibodies to human trophoblasts inhibits cell proliferation and syncitia formation, decreases production of chorionic gonadotrophin, perturbs secretion of growth factors, and induces apoptosis
      explanation: This supports a direct placental-cell branch distinct from macrovascular thrombosis.
  evidence:
  - reference: PMID:29867951
    reference_title: "Cellular and Molecular Mechanisms of Anti-Phospholipid Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Clinically, the binding of antibodies to β2GPI could contribute to pathogenesis by formation of immune complexes or modification of coagulation steps that operate along cell surfaces.
    explanation: This supports pathogenic antibody binding along cellular surfaces as a distinct intermediate APS event.
- name: Innate receptor signaling
  description: >-
    Experimental systems implicate TLR4, p38 MAPK, NF-kappaB, and related
    pathways after aPL-beta2GPI binding; no single receptor-signaling route has
    been established as universal across APS patients.
  downstream:
  - target: Endothelial activation
    description: Intracellular signaling induces a proadhesive and procoagulant endothelial phenotype.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:20822807
      reference_title: "Antiphospholipid syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Antiphospholipid antibodies promote activation of endothelial cells, monocytes, and platelets; and overproduction of tissue factor and thromboxane A2.
      explanation: This supports endothelial activation as a downstream consequence of pathogenic aPL signaling.
  - target: Monocyte tissue factor induction
    description: Signaling in monocytes induces tissue factor expression and amplifies coagulation.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:20822807
      reference_title: "Antiphospholipid syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Antiphospholipid antibodies promote activation of endothelial cells, monocytes, and platelets; and overproduction of tissue factor and thromboxane A2.
      explanation: This supports monocyte activation with tissue factor induction as a discrete prothrombotic mechanism in APS.
  - target: Platelet activation
    description: Signaling promotes platelet activation and thromboxane production in thrombotic APS.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:20822807
      reference_title: "Antiphospholipid syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Antiphospholipid antibodies promote activation of endothelial cells, monocytes, and platelets; and overproduction of tissue factor and thromboxane A2.
      explanation: This supports platelet activation as a distinct downstream consequence of aPL signaling.
  - target: Neutrophil extracellular-trap amplification
    description: >-
      Anti-beta2GPI can promote NET release, adding a neutrophil-mediated
      immunothrombotic amplifier.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:29867951
      reference_title: "Cellular and Molecular Mechanisms of Anti-Phospholipid Syndrome."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: In vitro, neutrophils respond to incubation with anti-β2GPI antibodies by an intensified NET release
      explanation: This is direct in-vitro support; its quantitative contribution in patients remains uncertain.
  evidence:
  - reference: PMID:22055541
    reference_title: "Examining how antiphospholipid antibodies activate intracellular signaling pathways: a systematic review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Diverse experimental evidence exists implicating the activation of various different cell surface receptors and intracellular pathways by antiphospholipid antibodies (aPL).
    explanation: This review supports a distinct signaling step between antibody binding and overt thrombosis.
  - reference: PMID:22055541
    reference_title: "Examining how antiphospholipid antibodies activate intracellular signaling pathways: a systematic review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: TLR4, p38 MAPK and NFκB are involved in mediating pathogenic effects of aPL on different cell types and may be potential therapeutic targets in antiphospholipid syndrome.
    explanation: This identifies a specific innate signaling axis activated by aPL-beta2GPI complexes.
- name: Neutrophil extracellular-trap amplification
  description: >-
    APS neutrophils can release excess neutrophil extracellular traps (NETs),
    whose chromatin and granule proteins provide a candidate immunothrombotic
    scaffold. Human, in-vitro, and animal observations support this amplifier,
    but do not establish NETs as necessary in every thrombotic event.
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  biological_processes:
  - preferred_term: neutrophil extracellular trap formation
    term:
      id: GO:0140645
      label: neutrophil extracellular trap formation
  downstream:
  - target: Arterial and venous thrombosis
    description: NET-derived material can amplify coagulation and thrombus growth.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - extracellular chromatin scaffold
    - platelet and coagulation-factor recruitment
    evidence:
    - reference: PMID:29867951
      reference_title: "Cellular and Molecular Mechanisms of Anti-Phospholipid Syndrome."

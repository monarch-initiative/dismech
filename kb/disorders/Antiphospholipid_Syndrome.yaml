genetic:
- name: HLA class II regulatory locus near HLA-DRA
  subtype: Primary antiphospholipid syndrome
  association: Genome-wide-significant common-variant susceptibility locus
  relationship_type: SUSCEPTIBILITY
  variant_origin: GERMLINE
  notes: >-
    This is a locus-level association in a European-ancestry GWAS with 482
    affected individuals. It does not establish HLA-DRA itself as the causal
    gene or imply Mendelian causation.
  evidence:
  - reference: PMID:38973605
    reference_title: "A Genome-Wide Association Study Suggests New Susceptibility Loci for Primary Antiphospholipid Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We revealed genetic associations with PAPS in a regulatory locus within
      the HLA class II region near HLA-DRA and in STAT1-STAT4 with a genome-wide
      level of significance; 34 additional suggestive genetic susceptibility
      loci for PAPS were also identified.
    explanation: >-
      The primary GWAS directly supports a genome-wide-significant HLA class II
      region susceptibility signal while leaving the causal gene unresolved.

discussions:
- discussion_id: gap_aps_apl_production_cd4_dysregulation
  prompt: >-
    The antiphospholipid antibodies that define APS are pathogenic, yet the
    immune mechanisms that initiate and sustain their production remain poorly
    understood. Which upstream antigenic, environmental, or genetic trigger
    activates autoreactive aPL-specific CD4+ T cells, and is the observed CD4+
    T cell dysregulation (Th1/Th17 skewing, diminished Treg, a disturbed
    Tfh/Tfr axis) a primary driver of aPL production or a secondary consequence
    of established autoimmunity? Do the contradictory subset findings across
    cohorts reflect true APS phenotypic heterogeneity or unresolved
    methodological confounding?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#CD4+ T cell dysregulation and autoreactive B cell licensing
  - pathophysiology#Autoantibody generation against beta2GPI and phospholipid complexes
  - pathophysiology#Cell-surface beta2GPI binding
  rationale: >-
    aPL drive thrombosis and obstetric morbidity, but the autoimmune program
    that maintains chronic aPL production is unresolved, limiting
    mechanism-based therapy beyond anticoagulation. The Gaspar et al. (2026)
    review synthesizes candidate links between autoreactive aPL-specific CD4+ T
    cells and sustained aPL responses, alongside reports of Th1/Th17
    polarization, reduced Treg frequency or function, and a dysregulated
    follicular T-cell (Tfh/Tfr) axis in primary APS. A deliberately
    non-directional CD4+ T-cell dysregulation node represents this evidence in
    the pathophysiology graph.
    However, two gaps persist. First, the upstream trigger that activates
    aPL-specific CD4+ T cells is unknown, so the pathophysiology lacks a
    defined event upstream of the CD4+ dysregulation node. Second, the
    literature disagrees on which CD4+ T cell subsets dominate, and it is
    unclear whether CD4+ T cell dysregulation causes aPL production or follows
    it. Resolving the directionality and the trigger would determine whether
    T-B crosstalk is a viable therapeutic target and whether distinct immune
    profiles define APS subtypes.
  proposed_experiments:
  - experiment_id: exp_aps_cd4_longitudinal_apl_directionality
    name: Longitudinal CD4+ T cell immunophenotyping with aPL-specific T cell tracking in primary APS
    description: >-
      Enroll aPL-positive individuals spanning asymptomatic carriers, new-onset
      primary APS, and established primary APS, plus matched controls, and follow
      them longitudinally. At each visit, deep-immunophenotype circulating CD4+ T
      cell subsets (Th1, Th17, Treg, Tfh, Tfr, Tfh17-like) by spectral flow
      cytometry, quantify beta2GPI-reactive CD4+ T cells with antigen-specific
      assays, and measure aPL titres (anticardiolipin, anti-beta2GPI, lupus
      anticoagulant). Use standardized gating across sites to control the
      methodological variability the review highlights, and apply cross-lagged
      analysis to test whether T cell dysregulation precedes or follows changes
      in aPL titre.
    experiment_type:
      preferred_term: longitudinal immunophenotyping observational cohort study
    readouts:
    - name: aPL-specific CD4+ T cell frequency and polarization
      target: pathophysiology#Autoantibody generation against beta2GPI and phospholipid complexes
      description: >
        Measure the frequency and Th1/Th17/Tfh polarization of beta2GPI-reactive
        CD4+ T cells and test whether their expansion temporally precedes rising
        aPL titres, supporting a primary-driver role in autoantibody generation.
      assays:
      - preferred_term: antigen-specific T cell stimulation assay
      - preferred_term: spectral flow cytometry immunophenotyping
      direction: POSITIVE
    - name: Regulatory T and follicular regulatory cell deficit
      target: pathophysiology#Autoantibody generation against beta2GPI and phospholipid complexes
      description: >
        Quantify Treg and Tfr frequency and suppressive function to test whether
        a regulatory deficit accompanies the loss of tolerance that permits
        sustained aPL production.
      assays:
      - preferred_term: regulatory T cell suppression assay
      direction: NEGATIVE
    - name: aPL titre trajectory relative to T cell changes
      target: pathophysiology#Cell-surface beta2GPI binding
      description: >
        Track anticardiolipin, anti-beta2GPI, and lupus anticoagulant levels and
        relate their trajectory to preceding CD4+ T cell subset shifts to resolve
        directionality between T cell dysregulation and pathogenic antibody
        availability for cell-surface binding.
      assays:
      - preferred_term: antiphospholipid antibody titre assay
      direction: POSITIVE
    decision_criterion: >-
      A primary-driver model is supported if expansion of aPL-specific CD4+ T
      cells and a Tfh/Tfr imbalance reproducibly precede rises in aPL titre in
      converters across sites; a secondary-consequence model is supported if
      T cell dysregulation appears only after aPL elevation. Reproducible,
      site-concordant subset signatures that segregate patients into distinct
      immune profiles would favor true phenotypic heterogeneity over
      methodological artifact.
    would_support:
    - pathophysiology#Autoantibody generation against beta2GPI and phospholipid complexes
    - pathophysiology#Cell-surface beta2GPI binding

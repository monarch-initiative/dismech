review_notes: >-
  Full evidence and mechanism review completed 2026-07-21. The disease boundary
  now separates APS from isolated aPL positivity, and diagnostic practice from
  research classification. Thrombotic, microvascular, valvular, hematologic,
  and narrowly defined obstetric manifestations are retained without assigning
  cohort-specific frequencies globally. Mechanistic edges distinguish
  antibody availability, cell activation, NET, complement, coagulation, and
  placental branches and explicitly preserve uncertain directionality.
  Treatment coverage is limited to guideline-supported anticoagulation and
  obstetric regimens, emergency combination treatment for CAPS, and clearly
  qualified refractory options.

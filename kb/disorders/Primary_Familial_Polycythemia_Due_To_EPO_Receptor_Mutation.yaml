    description: >-
      Replacement of the murine Epor with a mutant human EPOR truncated after the
      first intracellular tyrosine reproduced the human disorder: heterozygous
      mice mimicked the disease and homozygous mice were severely polycythemic,
      establishing the truncated receptor as a gain-of-function cause of
      polycythemia in vivo.
    limitations: >-
      Erythropoiesis differs between mouse and human, and the phenotype required
      the human receptor rather than a truncated mouse receptor; consequences of
      EPOR truncation in non-erythroid tissues were unknown in this study.

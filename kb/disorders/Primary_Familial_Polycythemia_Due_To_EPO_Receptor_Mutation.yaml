differential_diagnoses:
- name: Polycythemia Vera
  description: >-
    The principal differential. Polycythemia vera is an acquired JAK2-mutated
    myeloproliferative neoplasm with trilineage expansion and low erythropoietin
    and adult onset. PFCP is congenital, JAK2-negative, confined to the erythroid
    lineage (normal white cell and platelet counts), and also has subnormal
    erythropoietin - so the discriminators are JAK2 status, lineage involvement
    and age of onset rather than the erythropoietin level alone.
  distinguishing_features:
  - JAK2 V617F or exon 12 mutation present in polycythemia vera, absent here
  - Trilineage expansion in polycythemia vera; isolated erythrocytosis here
  - Acquired adult onset versus congenital lifelong erythrocytosis
  evidence:
  - reference: PMID:41123216
    reference_title: "JAK2 Unmutated Erythrocytosis: 2026 Update on Diagnosis and Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The foremost step is excluding polycythemia vera (PV) with JAK2 mutation screening (exons 12-15)."
    explanation: >-
      Polycythemia vera is excluded first by JAK2 screening, the key separation
      from JAK2-negative hereditary erythrocytosis.
- name: Oxygen-Sensing and High-Oxygen-Affinity Erythrocytoses
  description: >-
    The other congenital erythrocytoses - VHL (Chuvash), EGLN1/PHD2, EPAS1/HIF2A,
    high-oxygen-affinity haemoglobin variants, 2,3-bisphosphoglycerate deficiency
    - are secondary, EPO-driven, and have inappropriately normal or elevated
    erythropoietin. EPOR-related disease is the one with uniquely subnormal
    erythropoietin.
  distinguishing_features:
  - Subnormal erythropoietin in EPOR disease; normal-to-elevated in the others
  - Primary (erythroid-intrinsic) lesion versus secondary EPO-driven mechanism
  - High-affinity haemoglobinopathy and BPGM deficiency give a left-shifted p50
  evidence:
  - reference: PMID:41123216
    reference_title: "JAK2 Unmutated Erythrocytosis: 2026 Update on Diagnosis and Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "causes include EPOR mutations (subnormal Epo), high oxygen affinity hemoglobin variants, PIEZO1 mutations, 2,3-bisphosphoglycerate deficiency, methemoglobinemia, and germline oxygen sensing pathway mutations (HIF2A-PHD2-VHL)"
    explanation: >-
      Lists the hereditary erythrocytoses alongside EPOR, with subnormal
      erythropoietin flagged as the EPOR-specific feature.
treatments:
- name: Therapeutic phlebotomy
  description: >-
    Phlebotomy reduces the red cell mass and relieves hyperviscosity symptoms
    (headache, dizziness, visual disturbance). The haematocrit threshold is
    debated and is best guided by symptom relief rather than a fixed polycythemia
    vera target. Current guidance for JAK2-unmutated erythrocytosis advises
    phlebotomy for symptom control and against cytoreductive therapy.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: phlebotomy
    term:
      id: NCIT:C28221
      label: Phlebotomy
  target_mechanisms:
  - target: Increased Red Cell Mass
    treatment_effect: INHIBITS
    description: >-
      Phlebotomy removes red cell mass to relieve hyperviscosity symptoms without
      addressing the receptor defect.
  evidence:
  - reference: PMID:38546672
    reference_title: Benefit of phlebotomy and low-dose aspirin in the prevention of vascular events in patients with EPOR primary familial polycythemia on the island of New Caledonia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "over 50% of patients treated with phlebotomies (9/17) reported improvements in headaches, dizziness, tinnitus and visual disturbance"
    explanation: >-
      Phlebotomy relieved hyperviscosity symptoms in over half of treated EPOR
      carriers.
  - reference: PMID:41123216
    reference_title: "JAK2 Unmutated Erythrocytosis: 2026 Update on Diagnosis and Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Cytoreductive therapy should be avoided. Phlebotomy should be considered for symptom control."
    explanation: >-
      Current guidance for JAK2-unmutated erythrocytosis: phlebotomy for symptom
      control, no cytoreduction.
- name: Low-dose aspirin and cardiovascular risk management
  description: >-
    Low-dose aspirin, together with cardiovascular risk-factor optimisation, is
    advised to reduce the arterial and venous thrombotic risk. In the New
    Caledonian founder cohort, phlebotomy plus low-dose aspirin was associated
    with a decreased risk of vascular events.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: aspirin
      term:
        id: CHEBI:15365
        label: acetylsalicylic acid
  target_mechanisms:
  - target: Thromboembolism
    treatment_effect: INHIBITS
    description: Antiplatelet prophylaxis against thrombotic vascular events.
  evidence:
  - reference: PMID:38546672
    reference_title: Benefit of phlebotomy and low-dose aspirin in the prevention of vascular events in patients with EPOR primary familial polycythemia on the island of New Caledonia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Overall, the use of aspirin (or oral anticoagulant in 2 patients) and phlebotomy was associated with a decreased risk of vascular events (P<0.001, Fisher exact test)."
    explanation: >-
      Direct cohort evidence associating aspirin plus phlebotomy with a decreased
      vascular-event risk in EPOR-related disease.
  - reference: PMID:41123216
    reference_title: "JAK2 Unmutated Erythrocytosis: 2026 Update on Diagnosis and Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Cardiovascular risk optimization and low-dose aspirin are advised"
    explanation: >-
      Current guidance advising low-dose aspirin and cardiovascular risk
      optimisation in JAK2-unmutated erythrocytosis.
- name: Supportive care and avoidance of exacerbating exposures
  description: >-
    GeneReviews management is largely supportive: maintain good hydration, take
    deep-vein-thrombosis precautions in higher-risk situations, and avoid
    circumstances that increase blood viscosity or cardiovascular risk - notably
    dehydration, prolonged stay at high altitude, scuba diving, smoking, and
    erythropoiesis-stimulating agents. Where phlebotomy is used, iron deficiency
    (which itself can cause lassitude and may increase thrombotic risk) should be
    corrected.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Blood Hyperviscosity
    treatment_effect: INHIBITS
    description: >-
      Good hydration and avoidance of viscosity-raising exposures reduce the
      hyperviscosity burden.
  evidence:
  - reference: PMID:27831681
    reference_title: Primary Familial and Congenital Erythrocytosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Agents/circumstances to avoid: Dehydration; activities that could increase blood viscosity (e.g., living or prolonged stay at high altitudes, scuba diving, and smoking); additional cardiovascular risks (e.g., hypertension, hyperlipidemia, diabetes, and obesity); erythropoiesis-stimulating agents."
    explanation: >-
      GeneReviews "agents/circumstances to avoid", the drug-safety and exposure
      guidance for PFCE.
- name: Genetic counseling
  description: >-
    Autosomal dominant transmission with incomplete penetrance makes genetic
    counseling and cascade testing of relatives appropriate once a causal EPOR
    variant is identified.
  therapeutic_modality: BEHAVIORAL
  treatment_term:

name: Primary Familial Polycythemia Due to EPO Receptor Mutation
creation_date: "2026-10-15T00:00:00Z"
category: Mendelian
parents:
- Hereditary Erythrocytosis
- Congenital Primary Erythrocytosis
disease_term:
  preferred_term: primary familial and congenital polycythemia
  term:
    id: MONDO:0007572
    label: primary familial polycythemia due to EPO receptor mutation
synonyms:
- PFCP
- ECYT1
- primary familial and congenital polycythemia
- familial erythrocytosis type 1
- familial erythrocytosis, 1
- congenital erythrocytosis due to erythropoietin receptor mutation
- EPOR-related erythrocytosis
- familial polycythemia caused by mutation in EPOR
description: >-
  Primary familial and congenital polycythemia (PFCP; familial erythrocytosis
  type 1, ECYT1) is an autosomal dominant primary erythrocytosis caused by
  heterozygous germline truncating variants in EPOR, the gene encoding the
  erythropoietin receptor. Almost all reported variants are nonsense or
  frameshift changes clustered in the last exon (exon 8) that truncate the
  cytoplasmic C-terminus of the receptor, removing the negative regulatory
  region that normally down-modulates signalling. The disease is "primary"
  because the lesion is intrinsic to the erythroid progenitor rather than to
  oxygen sensing or to erythropoietin production: the truncated receptor is not
  properly down-regulated after ligand binding, so erythropoietin-triggered
  JAK2 phosphorylation and STAT5 activation are prolonged and erythroid
  progenitors (BFU-E) become hypersensitive to erythropoietin, growing with
  little or no added hormone. The red cell mass rises, and the resulting
  physiological negative feedback suppresses endogenous erythropoietin, so serum
  erythropoietin is characteristically low or subnormal - the biochemical
  feature that distinguishes PFCP from the oxygen-sensing (VHL, EGLN1, EPAS1)
  and high-oxygen-affinity haemoglobin erythrocytoses, in which erythropoietin
  is inappropriately normal or elevated. White cell and platelet counts are
  normal, separating it from polycythemia vera. Patients present from infancy or
  childhood with isolated erythrocytosis; penetrance of the clinical phenotype
  is incomplete. Although long regarded as benign, EPOR-related erythrocytosis
  carries a real risk of arterial and venous vascular events, and management is
  supportive - phlebotomy for hyperviscosity symptoms together with low-dose
  aspirin, by analogy with other erythrocytoses, while avoiding cytoreductive
  therapy.
pathophysiology:
- name: EPOR C-Terminal Cytoplasmic Truncation
  biological_scale: MOLECULAR
  description: >-
    A heterozygous germline nonsense or frameshift variant, almost always in the
    last exon (exon 8) of EPOR, truncates the cytoplasmic C-terminus of the
    erythropoietin receptor. The classic example is a G-to-A transition at
    nucleotide 6002 that converts a tryptophan codon to a stop codon, truncating
    the 70 C-terminal amino acids; frameshift insertions and deletions in the
    same region act similarly.
  genes:
  - preferred_term: EPOR
    term:
      id: hgnc:3416
      label: EPOR
  molecular_functions:
  - preferred_term: erythropoietin receptor activity
    term:
      id: GO:0004900
      label: erythropoietin receptor activity
    modifier: GAIN_OF_FUNCTION
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: GAIN_OF_FUNCTION
  downstream:
  - target: Loss of EPOR C-Terminal Negative Regulatory Domain
    causal_link_type: DIRECT
    description: >-
      The truncation removes the C-terminal region that carries the negative
      regulatory domains of the receptor.
  - target: Frameshift-Generated Novel C-Terminal Tail
    causal_link_type: DIRECT
    description: >-
      Frameshift variants additionally create a novel C-terminal peptide, a
      distinct gain-of-function mechanism from simple truncation.
  evidence:
  - reference: PMID:8506290
    reference_title: Truncated erythropoietin receptor causes dominantly inherited benign human erythrocytosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we describe a G to A transition in nucleotide 6002 of the EPOR gene that converts a TGG codon for tryptophan into a TAG stop codon, predicting the truncation of the 70 C-terminal amino acids of the EPOR molecule."
    explanation: >-
      The sentinel human report identifying a germline EPOR nonsense variant that
      truncates the C-terminal cytoplasmic tail as the cause of dominant
      erythrocytosis.
  - reference: PMID:29269524
    reference_title: New pathogenic mechanisms induced by germline erythropoietin receptor mutations in primary erythrocytosis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "erythropoietin hypersensitivity of erythroid progenitors due to germline nonsense or frameshift mutations in the erythropoietin receptor gene. All mutations so far described lead to the truncation of the C-terminal receptor sequence that contains negative regulatory domains."
    explanation: >-
      States that the causal variants are germline nonsense or frameshift
      mutations truncating the C-terminal negative regulatory region.
- name: Loss of EPOR C-Terminal Negative Regulatory Domain
  biological_scale: MOLECULAR
  description: >-
    Truncation removes the receptor's C-terminal negative regulatory domains,
    which in the intact receptor exert down-modulation of erythropoietin
    signalling. Loss of this negative control is sufficient, for nonsense
    variants, to cause the erythropoietin hypersensitivity phenotype.
  biological_processes:
  - preferred_term: negative regulation of EPOR/JAK-STAT signalling
    term:
      id: GO:0046426
      label: negative regulation of receptor signaling pathway via JAK-STAT
    modifier: DECREASED
  downstream:
  - target: Impaired EPOR Down-Regulation and Surface Accumulation
    causal_link_type: DIRECT
  - target: Prolonged JAK2 Phosphorylation
    causal_link_type: DIRECT
    description: >-
      Loss of the negative-control domain removes the brake on receptor-proximal
      signalling.
  evidence:
  - reference: PMID:8506290
    reference_title: Truncated erythropoietin receptor causes dominantly inherited benign human erythrocytosis.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "As shown experimentally, its intracellular C-terminal part contains a domain exerting negative control on erythropoiesis."
    explanation: >-
      Directly reports that the receptor's C-terminal part carries a domain exerting
      negative control on erythropoiesis, the domain this node loses.
  - reference: PMID:29269524
    reference_title: New pathogenic mechanisms induced by germline erythropoietin receptor mutations in primary erythrocytosis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the truncation of the C-terminal receptor sequence that contains negative regulatory domains. Their removal is presented as sufficient to cause the erythropoietin hypersensitivity phenotype."
    explanation: >-
      Establishes that removal of the C-terminal negative regulatory domains is
      the accepted mechanism for the hypersensitivity phenotype in truncating
      variants.
- name: Frameshift-Generated Novel C-Terminal Tail
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: erythropoietin receptor activity
    modifier: GAIN_OF_FUNCTION
    term:
      id: GO:0004900
      label: erythropoietin receptor activity
  description: >-
    For frameshift variants, the phenotype is not explained by truncation alone
    but requires a novel C-terminal peptide generated by the frameshift. This new
    tail increases receptor dimerization, stability and cell-surface localization
    and pre-activates the receptor, a mechanism distinct from simple loss of the
    negative regulatory domain and proposed to be common to EPOR frameshift
    mutations.
  downstream:
  - target: Impaired EPOR Down-Regulation and Surface Accumulation
    causal_link_type: DIRECT
    description: >-
      The novel tail increases receptor stability and cell-surface localization.
  - target: Prolonged JAK2 Phosphorylation
    causal_link_type: DIRECT
    description: >-
      The novel tail pre-activates the receptor and JAK2, producing constitutive
      signalling.
  evidence:
  - reference: PMID:29269524
    reference_title: New pathogenic mechanisms induced by germline erythropoietin receptor mutations in primary erythrocytosis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "by the appearance of a new C-terminal tail. The latter, by increasing erythropoietin receptor dimerization, stability and cell-surface localization, causes pre-activation of erythropoietin receptor and JAK2, constitutive signaling and hypersensitivity to erythropoietin."
    explanation: >-
      Defines the frameshift-specific mechanism: a novel C-terminal tail that
      increases dimerization, stability and surface localization and pre-activates
      EPOR and JAK2.
- name: Impaired EPOR Down-Regulation and Surface Accumulation
  biological_scale: CELLULAR
  description: >-
    The mutant receptor is not properly internalized or degraded after
    stimulation, so it is down-regulated poorly and accumulates at the cell
    surface. Normal down-regulation depends on internalization mediated through
    the p85 regulatory subunit of PI3-kinase and on ubiquitin-based proteasomal
    degradation, both of which the truncated receptor escapes.
  biological_processes:
  - preferred_term: receptor internalization
    term:
      id: GO:0031623
      label: receptor internalization
    modifier: DECREASED
  - preferred_term: receptor catabolic process
    term:
      id: GO:0032801
      label: receptor catabolic process
    modifier: DECREASED
  downstream:
  - target: Prolonged JAK2 Phosphorylation
    causal_link_type: DIRECT
    description: >-
      A receptor that persists at the surface keeps signalling after ligand
      binding.
  evidence:
  - reference: PMID:20096014
    reference_title: Advances in understanding the pathogenesis of primary familial and congenital polycythaemia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: "One mechanism depends on internalization mediated through the p85 regulatory subunit of the Phosphoinositide 3-Kinase, and the other utilizes ubiquitin-based proteasomal degradation. Truncated PFCP EpoRs are not properly down-regulated upon stimulation"
    explanation: >-
      Review summarising the two down-regulation mechanisms the truncated receptor
      escapes, so that it is not properly down-regulated after stimulation.
  - reference: PMID:24533580
    reference_title: "Polycythaemia-inducing mutations in the erythropoietin receptor (EPOR): mechanism and function as elucidated by epidermal growth factor receptor-EPOR chimeras."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These include slower degradation rate, higher levels of glycan-mature chimeric receptors, increased sensitivity to low levels of EGF (replacing EPO in this system) and extended signalling cascades."
    explanation: >-
      Chimeric-receptor assays show PFCP EPOR mutations slow receptor degradation
      and raise surface mature receptor, extending signalling.
- name: Prolonged JAK2 Phosphorylation
  biological_scale: MOLECULAR
  description: >-
    Because the receptor is pre-activated and poorly down-regulated,
    erythropoietin binding produces prolonged tyrosine phosphorylation of the
    receptor-associated kinase JAK2, rather than the transient, self-limited
    signal of the wild-type receptor.
  molecular_functions:
  - preferred_term: JAK2 non-receptor tyrosine kinase activity
    term:
      id: GO:0004715
      label: non-membrane spanning protein tyrosine kinase activity
    modifier: INCREASED
  biological_processes:
  - preferred_term: peptidyl-tyrosine phosphorylation
    term:
      id: GO:0018108
      label: peptidyl-tyrosine phosphorylation
    modifier: INCREASED
  downstream:
  - target: Prolonged STAT5 Activation
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:29269524
    reference_title: New pathogenic mechanisms induced by germline erythropoietin receptor mutations in primary erythrocytosis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "causes pre-activation of erythropoietin receptor and JAK2, constitutive signaling and hypersensitivity to erythropoietin"
    explanation: >-
      Documents pre-activation of JAK2 and constitutive signalling downstream of
      the mutant receptor.
  - reference: PMID:38546672
    reference_title: Benefit of phlebotomy and low-dose aspirin in the prevention of vascular events in patients with EPOR primary familial polycythemia on the island of New Caledonia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "The lack of EPOR cytoplasmic suppressors results in overexpression of the receptor and thereby prolonged phosphorylation of JAK2 with excessive activation of STAT5 and the RAS-MAPK signal transduction pathway."
    explanation: >-
      States the canonical chain from loss of the receptor's cytoplasmic
      suppressors to prolonged JAK2 phosphorylation.
- name: Prolonged STAT5 Activation
  biological_scale: MOLECULAR
  description: >-
    Prolonged JAK2 activity drives excessive and sustained activation of STAT5
    (with contribution from the RAS-MAPK pathway), the transcriptional output
    that translates receptor hyperactivity into an amplified proliferative
    signal. The cytoplasmic tyrosine Y344 of the receptor is required for
    EPO-induced STAT5 phosphorylation in the PFCP context.
  biological_processes:
  - preferred_term: positive regulation of EPOR/JAK-STAT signalling
    term:
      id: GO:0046427
      label: positive regulation of receptor signaling pathway via JAK-STAT
    modifier: INCREASED
  downstream:
  - target: Erythroid Progenitor Hypersensitivity to Erythropoietin
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:38546672
    reference_title: Benefit of phlebotomy and low-dose aspirin in the prevention of vascular events in patients with EPOR primary familial polycythemia on the island of New Caledonia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "prolonged phosphorylation of JAK2 with excessive activation of STAT5 and the RAS-MAPK signal transduction pathway"
    explanation: >-
      Names excessive STAT5 activation (and RAS-MAPK) as the signalling
      consequence of the hyperactive receptor.
  - reference: PMID:15878737
    reference_title: "Erythropoietin hypersensitivity in primary familial and congenital polycythemia: role of tyrosines Y285 and Y344 in erythropoietin receptor cytoplasmic domain."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In the context of EPOR-ME, Y344 was required for Epo-induced Stat5 tyrosine phosphorylation."
    explanation: >-
      Functional dissection showing receptor tyrosine Y344 is required for the
      EPO-induced STAT5 phosphorylation that drives the hypersensitivity
      phenotype.
- name: Erythroid Progenitor Hypersensitivity to Erythropoietin
  biological_scale: CELLULAR
  description: >-
    The amplified, sustained signal makes erythroid progenitors (BFU-E and CFU-E)
    hypersensitive to erythropoietin: they proliferate and form colonies with
    little or no added hormone, the cellular hallmark of PFCP.
  cell_types:
  - preferred_term: erythroid progenitor cell
    term:
      id: CL:0000038
      label: erythroid progenitor cell
  biological_processes:
  - preferred_term: erythropoietin-mediated signaling pathway
    term:
      id: GO:0038162
      label: erythropoietin-mediated signaling pathway
    modifier: INCREASED
  downstream:
  - target: Expansion of Erythroid Progenitor Proliferation
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:20096014
    reference_title: Advances in understanding the pathogenesis of primary familial and congenital polycythaemia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: "characterized by erythrocytosis and hypersensitivity of erythroid progenitors to erythropoietin (Epo)"
    explanation: >-
      States erythroid progenitor hypersensitivity to erythropoietin as the
      defining cellular feature of PFCP.
  - reference: PMID:7795221
    reference_title: "Primary familial polycythemia: a frameshift mutation in the erythropoietin receptor gene and increased sensitivity of erythroid progenitors to erythropoietin."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Burst-forming units-erythroid from patients exhibited increased colony size and sensitivity to EPO."
    explanation: >-
      Direct patient-derived evidence that BFU-E show increased colony size and
      erythropoietin sensitivity.
- name: Expansion of Erythroid Progenitor Proliferation
  biological_scale: CELLULAR
  description: >-
    Hypersensitive progenitors expand the erythroid compartment, increasing
    erythrocyte production. The white cell and platelet lineages are not
    expanded, because the lesion is confined to the erythropoietin receptor.
  cell_types:
  - preferred_term: erythroid progenitor cell
    term:
      id: CL:0000038
      label: erythroid progenitor cell
  biological_processes:
  - preferred_term: positive regulation of erythrocyte differentiation
    term:
      id: GO:0045648
      label: positive regulation of erythrocyte differentiation
    modifier: INCREASED
  downstream:
  - target: Increased Red Cell Mass
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:7795221
    reference_title: "Primary familial polycythemia: a frameshift mutation in the erythropoietin receptor gene and increased sensitivity of erythroid progenitors to erythropoietin."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Burst-forming units-erythroid from patients exhibited increased colony size and sensitivity to EPO."
    explanation: >-
      Increased colony size reflects the expanded erythroid proliferation driven
      by the hypersensitive progenitors.
  - reference: PMID:8506290
    reference_title: Truncated erythropoietin receptor causes dominantly inherited benign human erythrocytosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Erythropoietin regulates the proliferation and differentiation of erythroid precursor cells."
    explanation: >-
      Establishes that the receptor drives erythroid proliferation, the step that
      is excessive here.
- name: Increased Red Cell Mass
  biological_scale: ORGANISM
  description: >-
    Expanded erythropoiesis raises the total red cell mass, producing the
    polycythemia and the elevated haemoglobin and haematocrit seen clinically.
    The raised red cell mass also drives physiological negative feedback on
    erythropoietin production and raises whole-blood viscosity.
  downstream:
  - target: Polycythemia
    causal_link_type: DIRECT
  - target: Increased red blood cell mass
    causal_link_type: DIRECT
  - target: Increased circulating hemoglobin concentration
    causal_link_type: DIRECT
  - target: Increased hematocrit
    causal_link_type: DIRECT
  - target: Plethora
    causal_link_type: DIRECT
    description: >-
      Rubor/plethora relates directly to the raised red cell mass.
  - target: Hypertension
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Arterial hypertension is among the severe cardiovascular complications in a
      minority of affected individuals.
  - target: Suppression of Endogenous Erythropoietin Production
    causal_link_type: DIRECT
    description: >-
      The raised red cell mass triggers physiological negative feedback on renal
      erythropoietin output.
  - target: Blood Hyperviscosity
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:11158582
    reference_title: "Mouse model of congenital polycythemia: Homologous replacement of murine gene by mutant human erythropoietin receptor gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "This disorder is characterized by increased numbers of erythrocytes (polycythemia) and by in vitro hypersensitivity of erythroid precursors to erythropoietin."
    explanation: >-
      States the raised erythrocyte count (polycythemia) as the defining
      organism-level consequence.
- name: Suppression of Endogenous Erythropoietin Production
  biological_scale: ORGANISM
  description: >-
    The raised red cell mass suppresses endogenous erythropoietin production
    through the normal oxygen-sensing feedback loop, which is itself intact.
    Serum erythropoietin is therefore characteristically low or subnormal - the
    biochemical hallmark that separates this primary erythrocytosis from the
    oxygen-sensing and high-oxygen-affinity haemoglobin erythrocytoses.
  cell_types:
  - preferred_term: EPO-producing kidney interstitial fibroblast
    term:
      id: CL:1000692
      label: kidney interstitial fibroblast
  downstream:
  - target: Reduced circulating erythropoietin concentration
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:41123216
    reference_title: "JAK2 Unmutated Erythrocytosis: 2026 Update on Diagnosis and Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "causes include EPOR mutations (subnormal Epo)"
    explanation: >-
      Current review identifying subnormal erythropoietin as the characteristic
      finding in EPOR-related hereditary erythrocytosis.
- name: Blood Hyperviscosity
  biological_scale: ORGANISM
  description: >-
    The raised haematocrit increases whole-blood viscosity, which produces
    hyperviscosity symptoms (headache, dizziness, visual disturbance) and
    contributes to the increased risk of arterial and venous thrombotic events.
  downstream:
  - target: Headache
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Vertigo
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Tinnitus
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Visual impairment
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Thromboembolism
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Hyperviscosity contributes to the thrombotic risk; the mechanism of
      thrombosis in congenital erythrocytosis is acknowledged to be complex.
  evidence:
  - reference: PMID:38546672
    reference_title: Benefit of phlebotomy and low-dose aspirin in the prevention of vascular events in patients with EPOR primary familial polycythemia on the island of New Caledonia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "over 50% of patients treated with phlebotomies (9/17) reported improvements in headaches, dizziness, tinnitus and visual disturbance"
    explanation: >-
      Relief of these symptoms by red-cell-reducing phlebotomy identifies them as
      hyperviscosity manifestations of the erythrocytosis.

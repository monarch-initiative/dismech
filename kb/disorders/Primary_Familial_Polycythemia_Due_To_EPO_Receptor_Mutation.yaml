genetic:
- name: EPOR truncating variants
  gene_term:
    preferred_term: EPOR
    term:
      id: hgnc:3416
      label: EPOR
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    Heterozygous germline truncating variants in EPOR, almost all nonsense or
    frameshift changes in the last exon (exon 8), which encodes the negative
    regulatory region of the cytoplasmic tail. The net effect is gain of function
    through loss of negative regulation. Among the roughly 35 reported variants,
    most are classified pathogenic or likely pathogenic. EPOR mutations are found
    in only about 1% of JAK2-negative erythrocytosis cases.
  notes: >-
    The specific negative regulator removed by the truncation is often summarised
    as the SHP-1 (PTPN6) docking tyrosine, with loss of internalization and
    degradation signals, but the abstracts cited here establish only the loss of
    the C-terminal negative regulatory domain and the escape from PI3K/p85-mediated
    internalization and ubiquitin-proteasomal degradation (PMID:20096014), not the
    SHP-1 identity, so SHP-1 is named here as context rather than curated as a node.
  variants:
  - name: W439X (G6002A)
    description: >-
      The sentinel allele from the original large kindred: a G-to-A transition at
      nucleotide 6002 creating a premature stop and truncating the 70 C-terminal
      amino acids.
  - name: 5974insG
    description: >-
      A heterozygous G insertion at EPOR nucleotide 5975 that shifts the reading
      frame at codon 430 and truncates the last 64 amino acids; erythroid
      progenitors showed increased EPO sensitivity.
  - name: C5964G (Y426X)
    description: >-
      An exon 8 nonsense variant changing tyrosine codon 426 to a stop, truncating
      the receptor by 83 amino acids; reported in a family with one mutation
      carrier who did not develop polycythemia despite progenitor hypersensitivity.
  - name: p.Gln434Profs*11
    description: >-
      A frameshift allele whose hypersensitivity depends on a novel C-terminal
      tail rather than on truncation alone, defining the frameshift-specific
      mechanism.
  - name: c.1293del (p.Ser432Alafs*21)
    description: >-
      A frameshift allele observed exclusively in patients from New Caledonia,
      a founder variant underlying a regional cluster.
  evidence:
  - reference: PMID:8506290
    reference_title: Truncated erythropoietin receptor causes dominantly inherited benign human erythrocytosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mutation occurs in heterozygous form in the germ-line DNA of members of a large kindred in which primary erythrocytosis is segregating as a mild autosomal dominant trait. The mutation cosegregates with the disease phenotype in all 29 affected family members studied"
    explanation: >-
      Establishes the heterozygous germline EPOR nonsense variant cosegregating
      with dominant erythrocytosis across a large kindred.
  - reference: PMID:7795221
    reference_title: "Primary familial polycythemia: a frameshift mutation in the erythropoietin receptor gene and increased sensitivity of erythroid progenitors to erythropoietin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A heterozygous insertion of G at EPOR nucleotide 5975 was identified in genomic DNA from polycythemic members of family no. 2. 5974insG shifts the reading frame at codon 430, predicting amino acid substitutions and truncation of the last 64 amino acids."
    explanation: >-
      Documents the 5974insG frameshift variant and its predicted C-terminal
      truncation.
  - reference: PMID:9649565
    reference_title: Absence of polycythemia in a child with a unique erythropoietin receptor mutation in a family with autosomal dominant primary polycythemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "found a C5964G mutation in exon VIII that changes tyrosine codon 426 to a translation termination codon resulting in an EPOR protein truncated by 83 amino acids"
    explanation: >-
      Documents the C5964G (Y426X) nonsense variant truncating the receptor by 83
      amino acids.
  - reference: PMID:38546672
    reference_title: Benefit of phlebotomy and low-dose aspirin in the prevention of vascular events in patients with EPOR primary familial polycythemia on the island of New Caledonia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We recently reported a new EPOR mutation (c.1293del, p.Ser432Alafs*21) in patients from different unrelated families. Interestingly, this mutation has been exclusively observed in patients from the island of New Caledonia, strongly supporting a founder effect."
    explanation: >-
      Documents the c.1293del founder frameshift variant in the New Caledonian
      cluster.
  - reference: PMID:38546672
    reference_title: Benefit of phlebotomy and low-dose aspirin in the prevention of vascular events in patients with EPOR primary familial polycythemia on the island of New Caledonia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in EPOR are relatively rare among patients with JAK2-negative erythrocytosis, and are found in only approximately 1% of cases."
    explanation: >-
      Quantifies the rarity of EPOR mutations among JAK2-negative erythrocytosis.
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Autosomal dominant. A single heterozygous truncating EPOR allele is
    sufficient to cause the erythrocytosis and cosegregates with the phenotype
    across generations. Penetrance of the clinical phenotype is incomplete: a
    mutation-carrying child has been reported who did not develop polycythemia
    despite erythroid progenitor hypersensitivity, implying unidentified genetic
    or environmental modifiers. Many affected individuals have an affected
    parent, but a significant proportion (likely exceeding 10%) carry a de novo
    pathogenic variant.
  evidence:
  - reference: PMID:27831681
    reference_title: Primary Familial and Congenital Erythrocytosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Many individuals diagnosed with PFCE have an affected parent; a significant proportion of individuals (likely exceeding 10%) have the disorder as the result of a de novo pathogenic variant."
    explanation: >-
      GeneReviews establishes autosomal dominant transmission with a substantial
      de novo rate.
  - reference: PMID:8506290
    reference_title: Truncated erythropoietin receptor causes dominantly inherited benign human erythrocytosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "primary erythrocytosis is segregating as a mild autosomal dominant trait"
    explanation: >-
      States the autosomal dominant transmission of the EPOR-related
      erythrocytosis.
  - reference: PMID:9649565
    reference_title: Absence of polycythemia in a child with a unique erythropoietin receptor mutation in a family with autosomal dominant primary polycythemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Failure of this child to develop polycythemia suggests the existence of as yet unidentified environmental or genetic factors that may suppress disease development."
    explanation: >-
      Documents incomplete clinical penetrance and the inference of modifying
      factors.

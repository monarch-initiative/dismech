notes: >-
  Lump/split. This entry is the primary (EPO-low) counterpart of the secondary,
  EPO-high congenital erythrocytoses already curated: Chuvash polycythemia
  (germline VHL) and Familial Erythrocytosis 4 (germline EPAS1/HIF2A
  gain-of-function). All three present as isolated erythrocytosis, but the lesion
  here is intrinsic to the erythroid progenitor's own receptor rather than to the
  oxygen-sensing pathway, so erythropoietin is suppressed (low/subnormal) rather
  than inappropriately normal or elevated. That biochemical sign is the single
  cleanest discriminator and is carried both as a phenotype
  (Reduced circulating erythropoietin concentration) and as a dedicated
  pathophysiology node. It is kept as one disease (ECYT1 / PFCP = MONDO:0007572,
  OMIM 133100), not split by variant: the different EPOR variants converge on the
  same clinical entity, and the one mechanistic split worth recording - simple
  truncation versus the frameshift novel-C-terminal-tail mechanism (PMID:29269524)
  - is modelled as two parallel upstream pathophysiology nodes rather than as
  separate diseases.

  SHP-1. The classic teaching names the SHP-1 (PTPN6) docking tyrosine as the
  negative regulator lost by the truncation. The abstracts cited establish loss
  of the C-terminal negative regulatory domain and escape from PI3K/p85-mediated
  internalization and ubiquitin-proteasomal degradation (PMID:20096014), but not
  the SHP-1 identity, so SHP-1 is named only as context in the genetic notes and
  is not asserted as a node.

  Thrombosis mechanism. The edge from Blood Hyperviscosity to Thromboembolism is
  marked INDIRECT_UNKNOWN_INTERMEDIATES: the New Caledonia report notes that the
  mechanisms of thrombosis in congenital erythrocytosis are complex and that
  phlebotomy benefit is debated (it is harmful in Chuvash polycythemia), so
  hyperviscosity is one contributor rather than the sole cause.

  Deep research. Curated from a thin claude_code deep-research report
  (research/Primary_Familial_Polycythemia_Due_To_EPO_Receptor_Mutation-deep-research-claude_code.md),
  which ran three web searches and explicitly flagged almost all of its content as
  unverified leads. The report's three verified PMIDs (29269524, 20096014,
  11158582) plus independent PubMed searches supplied the backbone: de la Chapelle
  et al. 1993 (PMID:8506290), Sokol et al. 1995 (PMID:7795221), Kralovics et al.
  1998 (PMID:9649565), Arcasoy and Karayal 2005 (PMID:15878737), the New Caledonia
  cohort (PMID:38546672) and the 2026 JAK2-unmutated erythrocytosis review
  (PMID:41123216). Every snippet was verified against the cached record. A
  GeneReviews chapter exists and was used as the phenotype and management
  baseline (PMID:27831681, "Primary Familial and Congenital Erythrocytosis");
  the committed offline Bookshelf index snapshot did not list it, but PubMed
  genereviews[book] returns it and it is tagged below.

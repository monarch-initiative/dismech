experimental_models:
- name: Patient-specific hiPSC-derived cardiomyocyte model
  experimental_model_type: IPSC_DERIVED_MODEL
  description: >-
    Human induced pluripotent stem cell-derived cardiomyocytes (hiPSC-CMs)
    generated from a patient with short-coupled torsade de pointes exhibit
    diastolic calcium early after transients (EATs), increased EAT incidence at
    febrile temperature (39 degrees C), and shortened action potential
    durations.
  modeled_mechanisms:
  - target: Short-coupled premature ventricular trigger
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    limitations: >-
      Monolayer hiPSC-derived cardiomyocytes lack the three-dimensional
      His-Purkinje and moderator-band tissue architecture that localizes the
      clinical trigger in vivo.
  findings:
  - statement: >-
      Patient-derived hiPSC-CMs exhibit diastolic calcium early after transients
      (EATs) at physiological temperature (37 degrees C) with further increase
      at 39 degrees C, alongside shortened action potential durations.
    supporting_text: >-
      Calcium transients measured in patient lines at a physiological
      temperature indicated the occurrence of early after transients (EATs).
      Strikingly, at 39 °C the incidence of EATs further increased. Membrane
      potential data from the patient also revealed shorter action potentials
      that, combined with the EATs, indicate the premature release of calcium
      during diastole, which could be responsible for the extrasystoles in the
      patient.
  evidence:
  - reference: DOI:10.1186/s13287-024-04074-8
    reference_title: An hiPSC-CM approach for electrophysiological phenotyping of a patient-specific case of short-coupled TdP
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Calcium transients measured in patient lines at a physiological
      temperature indicated the occurrence of early after transients (EATs).
      Strikingly, at 39 °C the incidence of EATs further increased. Membrane
      potential data from the patient also revealed shorter action potentials
      that, combined with the EATs, indicate the premature release of calcium
      during diastole, which could be responsible for the extrasystoles in the
      patient.
    explanation: >-
      Establishes a patient-derived cellular disease model linking premature
      diastolic calcium release and shortened repolarization to short-coupled
      extrasystolic triggers.
differential_diagnoses:
- name: Familial long QT syndrome
  disease_term:
    preferred_term: familial long QT syndrome
    term:
      id: MONDO:0019171
      label: familial long QT syndrome
  description: >-
    Classic congenital or acquired long QT syndrome causes torsade de pointes
    associated with baseline or pause-dependent QTc prolongation and longer
    initiating coupling intervals, whereas short-coupled torsade de pointes
    occurs despite a normal resting QTc and is initiated by an R-on-T premature
    ventricular beat with a short coupling interval (245 +/- 28 ms, range 220
    to 300 ms in the founding 1994 series; mean 302 +/- 62 ms across 103
    patients in a 2022 systematic review; and <350 ms in contemporary
    multicenter short-coupled idiopathic VF criteria).
  distinguishing_features:
  - Normal baseline QTc interval on resting ECG in short-coupled torsade de pointes versus prolonged QTc in long QT syndrome
  - Short initiating PVC coupling interval (245 +/- 28 ms in the founding series; 302 +/- 62 ms in pooled case series; <350 ms in multicenter short-coupled idiopathic VF criteria)
  evidence:
  - reference: DOI:10.1161/01.cir.89.1.206
    reference_title: Short-coupled variant of torsade de pointes. A new electrocardiographic entity in the spectrum of idiopathic ventricular tachyarrhythmias.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, there was no evidence of long QT syndrome, and the torsade had
      the unusual particularity of an extremely short coupling interval of the
      first beat or of the isolated premature beats (245 +/- 28 milliseconds).
    explanation: >-
      Directly contrasts the absence of QT prolongation and the extremely short
      initiating coupling interval with classic long QT syndrome.
  - reference: DOI:10.3389/fcvm.2022.922525
    reference_title: "Short-coupled variant of torsade de pointes: A systematic review of case reports and case series"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The ECGs of all selected patients showed a short first-coupling interval
      (302 ± 62 ms)
    explanation: >-
      Provides the pooled mean first-coupling interval across 103 reported
      short-coupled torsade de pointes cases.
  - reference: DOI:10.15420/aer.2025.34
    reference_title: "Idiopathic Ventricular Fibrillation: Substrates, Mechanisms and Treatment"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      More recently, Steinberg et al. reported the prevalence of short-coupled
      idiopathic VF in a multicenter study involving 364 patients with
      idiopathic VF. Selecting a coupling interval <350 ms, they found 24
      (6.6%) patients. These patients had a very high risk of sudden cardiac
      death.
    explanation: >-
      Documents the <350 ms coupling-interval threshold used in multicenter
      short-coupled idiopathic VF classification.
- name: Brugada syndrome
  disease_term:
    preferred_term: Brugada syndrome
    term:
      id: MONDO:0015263
      label: Brugada syndrome
  description: >-
    Brugada syndrome is characterized by coved ST-segment elevation in right
    precordial leads at baseline or after sodium-channel blocker (ajmaline)
    provocation, whereas short-coupled torsade de pointes lacks spontaneous or
    ajmaline-provoked Brugada ECG findings and is initiated by short-coupled
    PVCs.
  distinguishing_features:
  - Absence of spontaneous or ajmaline-induced type 1 Brugada ECG pattern
  - Initiation of polymorphic VT/VF by short-coupled PVCs without Brugada ECG features
  evidence:
  - reference: DOI:10.15420/aer.2025.34
    reference_title: "Idiopathic Ventricular Fibrillation: Substrates, Mechanisms and Treatment"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The goals of the ajmaline test are to exclude Brugada syndrome and
      document potential short-coupled PVCs.
    explanation: >-
      Sodium-channel blocker (ajmaline) provocation is used in the workup of
      short-coupled PVC/VF to exclude Brugada syndrome.
  - reference: DOI:10.3389/fcvm.2022.922525
    reference_title: "Short-coupled variant of torsade de pointes: A systematic review of case reports and case series"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Despite the unique ECG features at the TdP onset, other ECG findings
      specific to Brugada, long QT , or short QT syndrome are lacking.
    explanation: >-
      Confirms that diagnostic ECG signatures of Brugada, long QT, and short QT
      syndromes must be absent.
- name: Short QT syndrome
  disease_term:
    preferred_term: short QT syndrome
    term:
      id: MONDO:0000453
      label: short QT syndrome
  description: >-
    Short QT syndrome predisposes to ventricular fibrillation and atrial
    fibrillation in the setting of a persistently abbreviated QTc interval and
    tall peaked T waves on resting ECG, whereas short-coupled torsade de
    pointes exhibits a normal baseline QTc interval.
  distinguishing_features:
  - Normal resting QTc interval in short-coupled torsade de pointes versus abnormally shortened QTc in short QT syndrome
  evidence:
  - reference: DOI:10.3389/fcvm.2022.922525
    reference_title: "Short-coupled variant of torsade de pointes: A systematic review of case reports and case series"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Despite the unique ECG features at the TdP onset, other ECG findings
      specific to Brugada, long QT , or short QT syndrome are lacking.
    explanation: >-
      Excludes short QT syndrome ECG abnormalities in patients diagnosed with
      short-coupled variant torsade de pointes.
- name: Catecholaminergic polymorphic ventricular tachycardia
  disease_term:
    preferred_term: catecholaminergic polymorphic ventricular tachycardia
    term:
      id: MONDO:0017990
      label: catecholaminergic polymorphic ventricular tachycardia
  description: >-
    Catecholaminergic polymorphic ventricular tachycardia (CPVT) is
    characterized by stress-induced arrhythmias associated with enhanced RyR2
    calcium release under adrenergic stimulation, whereas short-coupled torsade
    de pointes occurs at rest, is associated with a negative exercise stress
    test, and has been linked to RYR2 variants that cause channel leak under
    non-stress conditions (such as RYR2-I784F) or loss of function (such as
    RYR2-S4938F).
  distinguishing_features:
  - Negative exercise stress test and occurrence of arrhythmia at rest rather than under adrenergic or exercise stimulation
  - Unmasking of CPVT by exercise testing in contrast to resting R-on-T initiation in short-coupled torsade de pointes
  evidence:
  - reference: DOI:10.1038/s41598-021-84373-9
    reference_title: A SPRY1 domain cardiac ryanodine receptor variant associated with short-coupled torsade de pointes
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      RyR2 mutations have largely been associated with CPVT characterized by
      stress-induced arrhythmias, and associated with an enhanced Ca2+ release
      under adrenergic stimulation
    explanation: >-
      Directly contrasts adrenergically stimulated CPVT arrhythmias with
      resting short-coupled torsade de pointes associated with RYR2 variation.
  - reference: DOI:10.1038/s41598-021-84373-9
    reference_title: A SPRY1 domain cardiac ryanodine receptor variant associated with short-coupled torsade de pointes
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Noteworthy, the patient's exercise-stress test was negative.
    explanation: >-
      Contrasts the negative exercise stress test in RYR2-associated
      short-coupled torsade de pointes with adrenergically triggered CPVT.
  - reference: DOI:10.1038/s41598-021-84373-9
    reference_title: A SPRY1 domain cardiac ryanodine receptor variant associated with short-coupled torsade de pointes
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Three other RyR2 variants were identified in scTdP patients, two of which
      displayed a slight increase in sensitivity to cytosolic Ca2+ (RyR2-V1024I
      and RyR2-N1551S) and one of which resulted in an almost complete loss of
      function (RyR2-S4938F)
    explanation: >-
      Documents functional heterogeneity among scTdP-linked RYR2 variants,
      including cytosolic calcium sensitization and near-complete loss of
      function.
  - reference: DOI:10.15420/aer.2025.34
    reference_title: "Idiopathic Ventricular Fibrillation: Substrates, Mechanisms and Treatment"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      An exercise test is useful to unmask subclinical primary electrical
      disorders (long QT syndrome, CPVT).
    explanation: >-
      Exercise testing is part of the diagnostic workup to exclude CPVT and
      long QT syndrome before diagnosing idiopathic/short-coupled VF.

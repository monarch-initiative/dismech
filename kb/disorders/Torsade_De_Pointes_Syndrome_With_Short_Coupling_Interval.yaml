name: Torsade de Pointes Syndrome With Short Coupling Interval
creation_date: "2026-05-06T17:40:18Z"
updated_date: "2026-10-16T23:40:00Z"
description: >-
  Torsade-de-pointes syndrome with short coupling interval is a rare primary
  electrical heart disease in which very short-coupled premature ventricular
  contractions initiate torsade de pointes, polymorphic ventricular
  tachycardia, or ventricular fibrillation despite a normal QT interval and no
  overt structural heart disease. The disorder creates risk for syncope,
  electrical storm, cardiac arrest, and sudden cardiac death; genetic evidence
  supports heterogeneous susceptibility rather than a single uniform cause.
category: Genetic
disease_term:
  preferred_term: torsade-de-pointes syndrome with short coupling interval
  term:
    id: MONDO:0013317
    label: torsade-de-pointes syndrome with short coupling interval
parents:
- Cardiac Arrhythmia
- Channelopathy
synonyms:
- Short-coupled torsade de pointes
- Short-coupled variant torsade de pointes
- Short-coupled idiopathic ventricular fibrillation
- Short-coupled ventricular fibrillation
- Torsade de pointes with short coupling interval
- TdP with short coupling interval
notes: >-
  Scope is limited to the short-coupled TdP/short-coupled idiopathic
  ventricular fibrillation phenotype. This entry intentionally distinguishes
  the disorder from classic congenital or acquired long-QT torsade de pointes,
  catecholaminergic polymorphic ventricular tachycardia, Brugada syndrome, and
  short-QT syndrome, which have separate diagnostic criteria and mechanisms.
classifications:
  harrisons_chapter:
  - classification_value: CARDIOVASCULAR
  channelopathy_category:
    classification_value: cardiac channelopathy
inheritance:
- name: Sporadic majority
  inheritance_term:
    preferred_term: Sporadic
    term:
      id: HP:0003745
      label: Sporadic
  description: >-
    Most reported patients with short-coupled torsade de pointes or
    short-coupled idiopathic ventricular fibrillation lack a family history of
    cardiac disease or sudden death and present sporadically.
  evidence:
  - reference: DOI:10.3389/fcvm.2022.922525
    reference_title: "Short-coupled variant of torsade de pointes: A systematic review of case reports and case series"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A majority of patients without sex differences had no high-risk factors
      for coronary artery disease (97%), no presence of structural heart
      disease (99%), no family history of cardiac disease or sudden death
      (85%), and no emotional stress (94%)
    explanation: >-
      Systematic review of 103 reported patients demonstrates that 85% had no
      family history of cardiac disease or sudden death.
  - reference: DOI:10.1038/s41598-021-84373-9
    reference_title: A SPRY1 domain cardiac ryanodine receptor variant associated with short-coupled torsade de pointes
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most IVF cases are sporadic and some patients present with short-coupled
      torsade de pointes, the genetics of which are poorly understood.
    explanation: >-
      Confirms that most idiopathic ventricular fibrillation and short-coupled
      torsade de pointes cases occur sporadically.
- name: Familial susceptibility
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Approximately 15% of patients in pooled case series (the complement of the
    85% without a family history across 103 reported cases) and up to 30% (4 of
    14) in the founding 1994 series have a family history of sudden cardiac
    death or cardiac disease, with rare heterozygous variants in RYR2 or SCN5A,
    founder risk haplotypes in DPP6, and oligogenic modifiers in GJA5 and
    TNNI3K affecting Purkinje calcium handling and conduction.
  evidence:
  - reference: DOI:10.1161/01.cir.89.1.206
    reference_title: Short-coupled variant of torsade de pointes. A new electrocardiographic entity in the spectrum of idiopathic ventricular tachyarrhythmias.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In 10 cases they deteriorated into ventricular fibrillation. Four
      patients had a familial history of sudden death.
    explanation: >-
      Documents familial sudden death in 4 of 14 patients in the original
      series.
  - reference: DOI:10.1038/s41598-021-84373-9
    reference_title: A SPRY1 domain cardiac ryanodine receptor variant associated with short-coupled torsade de pointes
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the first reported series of 14 patients, 30% of scTdP patients had a
      family history of sudden death, suggesting a genetic susceptibility to
      this pathology10.
    explanation: >-
      Highlights familial clustering of sudden death in roughly 30% of the
      founding cohort as evidence for inherited susceptibility.
  - reference: DOI:10.3389/fcvm.2022.922525
    reference_title: "Short-coupled variant of torsade de pointes: A systematic review of case reports and case series"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A majority of patients without sex differences had no high-risk factors
      for coronary artery disease (97%), no presence of structural heart
      disease (99%), no family history of cardiac disease or sudden death
      (85%), and no emotional stress (94%)
    explanation: >-
      Establishes the lower bound (~15% with a positive family history, as the
      complement of 85% without family history) across 103 pooled literature
      cases.
prevalence:
- population: Published case reports and case series worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    A 2022 systematic review identified 103 published patients with
    short-coupled variant torsade de pointes across 22 studies (median age
    38 +/- 12 years; 52% female).
  evidence:
  - reference: DOI:10.3389/fcvm.2022.922525
    reference_title: "Short-coupled variant of torsade de pointes: A systematic review of case reports and case series"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this review, 103 patients diagnosed with scTdP were included from 22
      published studies (2, 3, 5–24). The median age of the included patients
      was 38± 12 years, and 52% of them were female.
    explanation: >-
      Provides the pooled literature case count and demographic distribution
      from 22 published studies.
- population: Multicenter idiopathic ventricular fibrillation cohort (n = 364)
  measure_type: POINT_PREVALENCE
  notes: >-
    Among 364 patients with idiopathic ventricular fibrillation in a
    multicenter registry, 24 (6.6%) met criteria for short-coupled idiopathic
    VF (coupling interval <350 ms).
  evidence:
  - reference: DOI:10.15420/aer.2025.34
    reference_title: "Idiopathic Ventricular Fibrillation: Substrates, Mechanisms and Treatment"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      More recently, Steinberg et al. reported the prevalence of short-coupled
      idiopathic VF in a multicenter study involving 364 patients with
      idiopathic VF. Selecting a coupling interval <350 ms, they found 24
      (6.6%) patients. These patients had a very high risk of sudden cardiac
      death.
    explanation: >-
      Quantifies the proportion of idiopathic VF cases attributable to the
      short-coupled phenotype in a multicenter cohort.
progression:
- phase: Adult onset
  age_range: Young to middle adulthood (mean 34.6 +/- 10 years in original series; median 38 +/- 12 years in systematic review)
  notes: >-
    Most patients present in young or middle adulthood with unheralded syncope,
    polymorphic ventricular tachycardia, or cardiac arrest due to ventricular
    fibrillation.
  evidence:
  - reference: DOI:10.1161/01.cir.89.1.206
    reference_title: Short-coupled variant of torsade de pointes. A new electrocardiographic entity in the spectrum of idiopathic ventricular tachyarrhythmias.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We observed 14 patients aged 34.6 +/- 10 years (mean +/- SD) with no
      structural heart disease who presented with syncope related to a typical
      ECG aspect of torsade de pointes.
    explanation: >-
      Establishes young-adult presentation in the founding clinical series.
  - reference: DOI:10.3389/fcvm.2022.922525
    reference_title: "Short-coupled variant of torsade de pointes: A systematic review of case reports and case series"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this review, 103 patients diagnosed with scTdP were included from 22
      published studies (2, 3, 5–24). The median age of the included patients
      was 38± 12 years, and 52% of them were female.
    explanation: >-
      Confirms young-to-middle adult median age at presentation across 103
      reported cases.
- phase: Infantile onset
  age_range: Infancy (rare presentation as early as 10 months of age)
  notes: >-
    Rare pediatric and infantile presentations with ventricular fibrillation and
    electrical storm have been reported and respond to verapamil.
  evidence:
  - reference: DOI:10.1002/joa3.12071
    reference_title: Electrical storm in an infant with short-coupled variant of torsade de pointes
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A 10‐month‐old infant experienced cardiac arrest caused by ventricular
      fibrillation (VF). His electrocardiogram (ECG) at rest was within the
      normal range.
    explanation: >-
      Documents rare infantile onset of short-coupled variant torsade de
      pointes presenting with cardiac arrest and electrical storm.
genetic:
- name: RYR2 calcium-release susceptibility
  association: Susceptibility
  features: >-
    Rare RYR2 variants have been reported in individual short-coupled TdP or
    short-coupled idiopathic ventricular fibrillation cases. Functional
    evidence from RYR2-I784F supports abnormal calcium release as a plausible
    trigger substrate, but the evidence remains case-based and may be
    oligogenic in some patients.
  gene_term:
    preferred_term: RYR2
    term:
      id: hgnc:10484
      label: RYR2
  evidence:
  - reference: DOI:10.1038/s41598-021-84373-9
    reference_title: A SPRY1 domain cardiac ryanodine receptor variant associated with short-coupled torsade de pointes
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: enhanced store overload-induced Ca2+ release in response to cytosolic Ca2+ was observed in RyR2-I784F cells.
    explanation: >-
      Supports a functional RYR2 calcium-release mechanism in a patient-linked
      variant, while remaining limited to a rare case-based susceptibility
      model.
  - reference: DOI:10.1038/s41598-021-84373-9
    reference_title: A SPRY1 domain cardiac ryanodine receptor variant associated with short-coupled torsade de pointes
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The novel RyR2-I784F variant in SPRY1 domain causes a leaky channel under non-stress conditions.
    explanation: >-
      Directly supports abnormal diastolic RyR2 channel behavior as a plausible
      arrhythmogenic substrate.
- name: SCN5A sodium-channel candidate susceptibility
  association: Susceptibility
  features: >-
    SCN5A-R800H has been reported in a patient with short-coupled TdP and
    functional testing showed altered recovery from inactivation. Current
    evidence supports SCN5A as a candidate susceptibility gene rather than a
    definitive monogenic explanation for all cases.
  gene_term:
    preferred_term: SCN5A
    term:
      id: hgnc:10593
      label: SCN5A
  evidence:
  - reference: DOI:10.1111/pace.13924
    reference_title: "<i>SCN5A</i> mutation identified in a patient with short-coupled variant of torsades de pointes"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We identified an SCN5A mutation R800H
    explanation: >-
      Documents a patient-level SCN5A variant in short-coupled TdP with
      malignant ventricular arrhythmia.
  - reference: DOI:10.1111/pace.13924
    reference_title: "<i>SCN5A</i> mutation identified in a patient with short-coupled variant of torsades de pointes"
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: showed a significantly shortened recovery time from inactivation.
    explanation: >-
      Supports altered sodium-channel gating as a candidate mechanism in a
      subset of short-coupled TdP.
- name: DPP6 risk haplotype Purkinje transient outward current susceptibility
  association: Susceptibility
  features: >-
    A chromosome 7q36 founder haplotype encompassing DPP6 (encoding
    dipeptidyl-aminopeptidase-like protein 6, an auxiliary subunit of the
    cardiac transient outward potassium current I(to)) is associated with
    idiopathic ventricular fibrillation initiated by extremely short-coupled
    Purkinje premature ventricular contractions, accounting for roughly 10% of
    cases in Dutch-enriched cohorts with 50% sudden cardiac death risk before
    age 58.
  gene_term:
    preferred_term: DPP6
    term:
      id: hgnc:3010
      label: DPP6
  evidence:
  - reference: DOI:10.1038/s41598-021-84373-9
    reference_title: A SPRY1 domain cardiac ryanodine receptor variant associated with short-coupled torsade de pointes
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      DPP6, a protein associated with the I(to) current, was first shown to
      contribute to IVF
    explanation: >-
      Links DPP6 to idiopathic VF via modulation of the Purkinje transient
      outward potassium current I(to).
  - reference: DOI:10.15420/aer.2025.34
    reference_title: "Idiopathic Ventricular Fibrillation: Substrates, Mechanisms and Treatment"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Dipeptidyl-aminopeptidase-like protein 6 (DPP6)-specific haplotype has
      been associated with idiopathic VF, mainly in the Netherlands (founder
      effect).37It is present in 10% of cases. The prognosis is poor as 50% of
      carriers experience sudden cardiac death before the age of 58.
    explanation: >-
      Documents the DPP6 founder risk haplotype frequency (10% of idiopathic VF
      cases) and severe prognosis.
- name: GJA5 oligogenic Purkinje conduction modifier susceptibility
  association: Susceptibility
  features: >-
    A rare missense variant in GJA5 (connexin 40, p.A96S), reported to affect
    gap-junctional electrical coupling and cardiac conduction, was co-inherited
    with RYR2-I784F and TNNI3K-R244X in a patient with short-coupled torsade de
    pointes, supporting an oligogenic model of Purkinje-fiber conduction and
    calcium-handling susceptibility.
  gene_term:
    preferred_term: GJA5
    term:
      id: hgnc:4279
      label: GJA5
  evidence:
  - reference: DOI:10.1038/s41598-021-84373-9
    reference_title: A SPRY1 domain cardiac ryanodine receptor variant associated with short-coupled torsade de pointes
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      By exome sequencing, we identified three rare variants: p.I784F in the
      SPRY1 of the ryanodine receptor 2 (RyR2), p.A96S in connexin 40 (Cx40),
      reported to affect electrical coupling and cardiac conduction, and a
      nonsense p.R244X in the cardiac-specific troponin I-interacting kinase
      (TNNI3K).
    explanation: >-
      Identifies the GJA5 (connexin 40) p.A96S conduction-impairing variant in
      exome sequencing of a patient with short-coupled torsade de pointes.
  - reference: DOI:10.1038/s41598-021-84373-9
    reference_title: A SPRY1 domain cardiac ryanodine receptor variant associated with short-coupled torsade de pointes
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The presence of several variants affecting Ca2+ handling and cardiac
      conduction suggests a possible oligogenic origin for the ectopies
      originating from Purkinje fibres.
    explanation: >-
      Supports an oligogenic susceptibility model combining GJA5 conduction
      impairment with abnormal calcium handling in Purkinje fibers.
- name: TNNI3K oligogenic conduction modifier susceptibility
  association: Susceptibility
  features: >-
    A heterozygous nonsense variant in TNNI3K (p.R244X), encoding
    cardiac-specific troponin I-interacting kinase, was identified alongside
    RYR2-I784F and GJA5-A96S in exome sequencing of a patient with
    short-coupled torsade de pointes, contributing to a proposed oligogenic
    susceptibility architecture in the His-Purkinje system.
  gene_term:
    preferred_term: TNNI3K
    term:
      id: hgnc:19661
      label: TNNI3K
  evidence:
  - reference: DOI:10.1038/s41598-021-84373-9
    reference_title: A SPRY1 domain cardiac ryanodine receptor variant associated with short-coupled torsade de pointes
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      By exome sequencing, we identified three rare variants: p.I784F in the
      SPRY1 of the ryanodine receptor 2 (RyR2), p.A96S in connexin 40 (Cx40),
      reported to affect electrical coupling and cardiac conduction, and a
      nonsense p.R244X in the cardiac-specific troponin I-interacting kinase
      (TNNI3K).
    explanation: >-
      Documents the heterozygous TNNI3K p.R244X nonsense variant co-occurring
      with RYR2 and GJA5 variants in short-coupled torsade de pointes.
  - reference: DOI:10.1038/s41598-021-84373-9
    reference_title: A SPRY1 domain cardiac ryanodine receptor variant associated with short-coupled torsade de pointes
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The presence of several variants affecting Ca2+ handling and cardiac
      conduction suggests a possible oligogenic origin for the ectopies
      originating from Purkinje fibres.
    explanation: >-
      Frames the co-inherited TNNI3K, GJA5, and RYR2 variants as an oligogenic
      basis for Purkinje-origin ectopy.

  features: >-
    Loss-of-function variants (nonsense, frameshift, splice-site, start-lost,
    and multi-exon deletions) and missense variants affecting the N-terminal
    tubulin-folding cofactor C (TBCC)-like ARL3-GAP domain or the C-terminal
    nucleoside diphosphate kinase (NDK)-like domain of RP2 on Xp11.3. Missense
    variants show variable pathogenic potential rather than uniform loss of
    function.

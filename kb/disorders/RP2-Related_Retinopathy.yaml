name: RP2-Related Retinopathy
creation_date: "2026-07-20T18:00:00Z"
updated_date: "2026-11-14T01:50:00Z"
category: Mendelian
description: >-
  RP2-related retinopathy is an X-linked inherited retinal dystrophy caused by
  loss-of-function variants in RP2, the second most common cause of X-linked
  retinitis pigmentosa (XLRP) after RPGR. RP2 encodes a dual-domain protein:
  an N-terminal domain structurally homologous to tubulin-folding cofactor C
  (TBCC) that functions as a GTPase-activating protein (GAP) for the small
  GTPase ARL3 at the photoreceptor connecting cilium, and a C-terminal domain
  homologous to nucleoside diphosphate kinase (NDK). RP2 and ARL3 regulate the
  ciliary-tip trafficking of kinesin motor proteins (Kif7, Kif17) and
  lipidated phototransduction cargo, and loss of RP2 disrupts this ciliary
  trafficking checkpoint, causing mislocalization of ciliary and
  phototransduction proteins and progressive photoreceptor degeneration.
  RP2-RP typically causes early-onset (mean ~9.6 years), severe rod-cone
  dystrophy in hemizygous males, with disproportionately early macular
  involvement, complete loss of the foveal photoreceptor layer by the third
  decade, and frequent associated myopia. Carrier females show a highly
  variable phenotype -- from normal to overt RP -- due to X-inactivation
  mosaicism (lyonization), so a family history limited to affected males does
  not exclude symptomatic female carriers.

treatments:
- name: AAV Gene Replacement Therapy (Investigational)
  description: >-
    AAV-mediated RP2 gene augmentation has produced long-term (18-month)
    rescue of cone photoreceptor function and correction of opsin/PDE6
    mistrafficking in Rp2-knockout mice, and has rescued the degeneration
    phenotype (preventing outer nuclear layer thinning, restoring rhodopsin
    expression) in patient-derived iPSC retinal organoids. As of the
    literature reviewed, no RP2-specific gene therapy has yet reached a
    registered human clinical trial (in contrast to RPGR, for which several
    trials are active).
  therapeutic_modality: GENE_THERAPY
  treatment_term:
    preferred_term: gene therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: RP2 Loss of ARL3 GAP Activity
    description: Restores functional RP2 expression in photoreceptors via AAV gene augmentation.
  - target: Disrupted Ciliary Trafficking of Phototransduction Proteins
    description: Corrects M-cone opsin mistrafficking and restores PDE6 and rhodopsin expression.
  - target: Rod Photoreceptor Apoptosis
    description: Prevents outer nuclear layer thinning and rod photoreceptor loss in human retinal organoids.
  - target: Secondary Cone Degeneration
    description: Preserves long-term cone photoreceptor viability and photopic ERG function in Rp2-knockout mice.
  evidence:
  - reference: PMID:26358772
    reference_title: "Long-term rescue of cone photoreceptor degeneration in retinitis pigmentosa 2 (RP2)-knockout mice by gene replacement therapy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Preservation of cone function was achieved with a wide dose range over 18-month duration, as evidenced by photopic ERG and optomotor tests."
    explanation: >-
      Demonstrates long-term functional cone rescue with AAV-RP2 gene
      replacement in the Rp2-knockout mouse model.
  - reference: PMID:26358772
    reference_title: "Long-term rescue of cone photoreceptor degeneration in retinitis pigmentosa 2 (RP2)-knockout mice by gene replacement therapy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Morphologically, the treatment preserved cone viability, corrected mis-trafficking of M-cone opsin and restored cone PDE6 expression."
    explanation: >-
      Demonstrates structural rescue of cone viability and phototransduction
      protein trafficking after AAV-RP2 delivery.
  - reference: PMID:32531192
    reference_title: "Modeling and Rescue of RP2 Retinitis Pigmentosa Using iPSC-Derived Retinal Organoids."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Adeno-associated virus-mediated gene augmentation with human RP2 rescued the degeneration phenotype of the RP2 KO organoids, to prevent ONL thinning and restore rhodopsin expression."
    explanation: >-
      Demonstrates AAV-RP2 rescue in a human iPSC-derived retinal organoid
      disease model, complementing the mouse gene-therapy data.

- name: Translational Read-Through Inducing Drug Therapy (PTC124, Investigational)
  description: >-
    For the subset of RP2-RP caused by nonsense (premature termination
    codon) variants, translational read-through inducing drugs (TRIDs) such
    as PTC124 have restored ciliary-tip kinesin (Kif7) trafficking in
    fibroblasts and iPSC-derived cells from a patient with an RP2 nonsense
    mutation, suggesting a potential genotype-specific small-molecule
    strategy. This remains a preclinical/investigational approach.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ataluren (PTC124)
      term:
        id: CHEBI:94805
        label: 3-[5-(2-fluorophenyl)-1,2,4-oxadiazol-3-yl]benzoic acid
  target_mechanisms:
  - target: RP2 Loss of ARL3 GAP Activity
    description: Promotes ribosomal read-through of premature termination codons in RP2 transcripts.
  - target: Disrupted Ciliary Trafficking of Phototransduction Proteins
    description: Restores Kif7 ciliary-tip localization in nonsense-variant RP2-null cells.
  evidence:
  - reference: PMID:28444310
    reference_title: "Arl3 and RP2 regulate the trafficking of ciliary tip kinesins."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Translational read-through inducing drugs (TRIDs), such as PTC124, were able to restore Kif7 levels at the ciliary tip of RP2 null cells."
    explanation: >-
      Demonstrates that PTC124 restores ciliary-tip kinesin trafficking in
      RP2-null cells from a nonsense-variant patient.


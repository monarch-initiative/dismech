      label: retina
  cell_types:
  - preferred_term: retinal rod cell
    term:
      id: CL:0000604
      label: retinal rod cell
  publication: PMID:32531192
  description: >-
    Isogenic CRISPR-generated RP2 knockout and RP2 nonsense-variant
    patient-derived induced pluripotent stem cells differentiated into 3D
    retinal organoids recapitulate rod-predominant photoreceptor degeneration
    with defined kinetics (peak rod cell death at day 150 and outer nuclear
    layer thinning by day 180) and are rescued by AAV-RP2 gene augmentation.
  modeled_mechanisms:
  - target: Rod Photoreceptor Apoptosis
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: Reproduces human rod photoreceptor apoptosis kinetics and outer nuclear layer thinning in 3D human retinal tissue.
    limitations: >-
      In vitro organoid culture lacks mature retinal pigment epithelium
      apposition, vascularization, and long-term adult macular foveal
      architecture.
    evidence:
    - reference: PMID:32531192
      reference_title: "Modeling and Rescue of RP2 Retinitis Pigmentosa Using iPSC-Derived Retinal Organoids."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "the RP2 KO and RP2 patient-derived organoids showed a peak in rod photoreceptor cell death at day 150 (D150) with subsequent thinning of the organoid outer nuclear layer (ONL) by D180 of culture"
      explanation: Demonstrates rod cell death and outer nuclear layer thinning in human 3D retinal organoids.
  evidence:
  - reference: PMID:32531192
    reference_title: "Modeling and Rescue of RP2 Retinitis Pigmentosa Using iPSC-Derived Retinal Organoids."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The mechanism of RP2-associated retinal degeneration in humans is unclear, and animal models of RP2 XLRP do not recapitulate this severe phenotype. Here, we developed gene-edited isogenic RP2 knockout (RP2 KO) induced pluripotent stem cells (iPSCs) and RP2 patient-derived iPSC to produce 3D retinal organoids as a human retinal disease model."
    explanation: >-
      Establishes the iPSC-derived retinal organoid model as a human cellular
      disease platform.

animal_models:
- name: Rp2-knockout mouse
  species: Mouse
  genotype: Rp2-knockout (Rp2-KO)
  publication: PMID:26358772
  description: >-
    Rp2-knockout mice show early-onset cone dysfunction followed by
    progressive cone degeneration, with mistrafficking of M-cone opsin and
    reduced cone PDE6, mimicking cone vision impairment in human XLRP
    patients. This early cone-selective vulnerability contrasts with the
    predominantly rod-first presentation in humans, an important
    species difference to note when extrapolating model data. AAV-mediated
    RP2 gene replacement produces long-term (18-month) functional and
    structural rescue in this model.
  modeled_mechanisms:
  - target: Disrupted Ciliary Trafficking of Phototransduction Proteins
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Exhibits M-cone opsin mistrafficking and loss of cone PDE6 expression rescued by AAV-RP2.
    limitations: >-
      Mouse photoreceptors lack a cone-rich macula and show cone-predominant
      early vulnerability rather than the severe childhood rod-first
      degeneration observed in humans.
    evidence:
    - reference: PMID:26358772
      reference_title: "Long-term rescue of cone photoreceptor degeneration in retinitis pigmentosa 2 (RP2)-knockout mice by gene replacement therapy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Morphologically, the treatment preserved cone viability, corrected mis-trafficking of M-cone opsin and restored cone PDE6 expression."
      explanation: Confirms ciliary mistrafficking of cone opsin and PDE6 in Rp2-knockout mice and its reversal by RP2 replacement.
  - target: Secondary Cone Degeneration
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Models progressive cone dysfunction and degeneration, though without antecedent severe rod loss.
    limitations: >-
      Cone degeneration occurs early without the severe primary rod-cone
      dystrophy sequence and foveal loss characteristic of human RP2 disease.
    evidence:
    - reference: PMID:26358772
      reference_title: "Long-term rescue of cone photoreceptor degeneration in retinitis pigmentosa 2 (RP2)-knockout mice by gene replacement therapy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "we first performed detailed characterization of the Rp2-knockout (Rp2-KO) mice and observed early-onset cone dysfunction, which was followed by progressive cone degeneration, mimicking cone vision impairment in XLRP patients"
      explanation: Documents early cone dysfunction and progressive cone degeneration in Rp2-knockout mice.
  evidence:
  - reference: PMID:26358772
    reference_title: "Long-term rescue of cone photoreceptor degeneration in retinitis pigmentosa 2 (RP2)-knockout mice by gene replacement therapy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "we first performed detailed characterization of the Rp2-knockout (Rp2-KO) mice and observed early-onset cone dysfunction, which was followed by progressive cone degeneration, mimicking cone vision impairment in XLRP patients"
    explanation: >-
      Establishes the cone-predominant phenotype of the Rp2-knockout mouse
      model and its translational relevance to human XLRP.
- name: rp2 morphant zebrafish
  species: Zebrafish
  genotype: rp2 morpholino knockdown in embryos with human RP2 variant mRNA rescue
  publication: PMID:21738648
  description: >-
    Morpholino knockdown of rp2 in zebrafish perturbs rod and cone
    photoreceptor development and causes microphthalmia; co-injection of human
    RP2 missense variants reveals graded defects in photoreceptor rescue.
  modeled_mechanisms:
  - target: RP2 Loss of ARL3 GAP Activity
    relationship: PERTURBS
    fidelity: LOW
    model_scale: CELLULAR
    description: Perturbs RP2 function via embryonic knockdown and tests developmental photoreceptor rescue capacity of human RP2 missense alleles without directly assaying ARL3 GAP enzymatic activity.
    limitations: >-
      Transient embryonic knockdown causes developmental microphthalmia and
      photoreceptor differentiation defects rather than postnatal progressive
      retinitis pigmentosa.
    evidence:
    - reference: PMID:21738648
      reference_title: "Functional analysis of retinitis pigmentosa 2 (RP2) protein reveals variable pathogenic potential of disease-associated missense variants."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "the tested RP2 mutants exhibited variable degrees of rescue of rod versus cone photoreceptor development as well as microphthalmia"
      explanation: Demonstrates differential rescue of rod and cone photoreceptor development across human RP2 variants in zebrafish.
  evidence:
  - reference: PMID:21738648
    reference_title: "Functional analysis of retinitis pigmentosa 2 (RP2) protein reveals variable pathogenic potential of disease-associated missense variants."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "the tested RP2 mutants exhibited variable degrees of rescue of rod versus cone photoreceptor development as well as microphthalmia"
    explanation: Functional in vivo assay of RP2 loss and missense variant pathogenicity in zebrafish.

references:
- reference: CGGV:assertion_75e3203d-3841-49eb-84d4-e6238eda55ea-2022-03-02T214941.540Z
  title: "RP2 / RP2-related retinopathy (Definitive)"
- reference: clinicaltrials:NCT06982417
  title: "InsightRP2: a Global Patient Registry for RP2-associated Retinitis Pigmentosa"
- reference: PMID:36423731
  title: "RP2-Associated X-linked Retinopathy: Clinical Findings, Molecular Genetics, and Natural History."
  findings:
  - statement: >-
      In a cohort of 54 molecularly confirmed male patients from 38
      pedigrees, RP2-related retinopathy presents as an early-onset (mean
      9.6 years), severe rod-cone dystrophy with generalized early cone
      involvement, quantifiable OCT-based structural decline, and loss of
      measurable ellipsoid zone after age 26 in all childhood-onset cases.
    supporting_text: >-
      Fifty-four molecularly confirmed patients were identified from 38
      pedigrees... The most common first symptom was night blindness
      (68.8%)... No patient with childhood-onset disease had an identifiable
      ellipsoid zone (EZ) after the age of 26 years at baseline or
      follow-up.
    evidence:
    - reference: PMID:36423731
      reference_title: "RP2-Associated X-linked Retinopathy: Clinical Findings, Molecular Genetics, and Natural History."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Fifty-four molecularly confirmed patients were identified from 38 pedigrees. Twenty-eight disease-causing variants were identified, with 20 not previously clinically characterized."
      explanation: >-
        The largest published natural history cohort for RP2-related
        retinopathy in hemizygous males.
- reference: PMID:28444310
  title: "Arl3 and RP2 regulate the trafficking of ciliary tip kinesins."
  findings:
  - statement: >-
      RP2 is the GTPase-activating protein for ARL3 and, together with
      ARL3, regulates trafficking of the ciliary-tip kinesins Kif7 and
      Kif17; loss of RP2 reduces ciliary-tip Kif7 levels, and translational
      read-through inducing drugs can restore this trafficking in
      nonsense-variant patient cells.
    supporting_text: >-
      We identified the ciliary tip kinesins Kif7 and Kif17 as novel
      interaction partners of the small GTPase Arl3 and its regulatory
      GTPase activating protein (GAP) Retinitis Pigmentosa 2 (RP2)...
      Translational read-through inducing drugs (TRIDs), such as PTC124,
      were able to restore Kif7 levels at the ciliary tip of RP2 null cells.
    evidence:
    - reference: PMID:28444310
      reference_title: "Arl3 and RP2 regulate the trafficking of ciliary tip kinesins."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Translational read-through inducing drugs (TRIDs), such as PTC124, were able to restore Kif7 levels at the ciliary tip of RP2 null cells."
      explanation: >-
        Mechanistic and therapeutic basis for the ciliary trafficking
        pathophysiology and the investigational TRID treatment entry.

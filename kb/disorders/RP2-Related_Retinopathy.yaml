  description: >-
    Hemizygous males present with early-onset, severe rod-cone dystrophy with
    progressive peripheral visual field constriction, paracentral or
    pericentral scotomas, and early macular involvement; the majority have
    childhood-onset disease with a mean age of onset around 9.6 years (7.6
    years among the childhood-onset subgroup).
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Rod-cone dystrophy

diagnosis:
- name: Full-Field Electroretinography (ERG)
  description: >-
    Full-field and pattern ERG document the rod-cone dystrophy pattern and
    near-universal loss of macular (pattern ERG) function.
  diagnosis_term:
    preferred_term: electroretinogram procedure
    term:
      id: MAXO:0035099
      label: electroretinogram procedure
  evidence:
  - reference: PMID:36423731
    reference_title: "RP2-Associated X-linked Retinopathy: Clinical Findings, Molecular Genetics, and Natural History."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The majority (17/22) showed electroretinogram (ERG) evidence of a rod-cone dystrophy. Pattern ERG P50 was undetectable in all but 2 patients."
    explanation: >-
      Establishes ERG as the core functional diagnostic test for RP2-RP.

- name: Optical Coherence Tomography (OCT)
  description: >-
    OCT quantifies ellipsoid zone width and outer nuclear layer thickness as
    structural progression biomarkers, useful for staging disease and as
    candidate trial endpoints.
  diagnosis_term:
    preferred_term: optical coherence tomography
    term:
      id: MAXO:0000969
      label: optical coherence tomography
  evidence:

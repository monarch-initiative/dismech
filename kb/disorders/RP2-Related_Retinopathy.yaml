name: RP2-Related Retinopathy
creation_date: "2026-07-20T18:00:00Z"
category: Mendelian
description: >-
  RP2-related retinopathy is an X-linked inherited retinal dystrophy caused by
  loss-of-function variants in RP2, the second most common cause of X-linked
  retinitis pigmentosa (XLRP) after RPGR. RP2 encodes a dual-domain protein:
  an N-terminal domain structurally homologous to tubulin-folding cofactor C
  (TBCC), and a C-terminal domain that functions as a GTPase-activating
  protein (GAP) for the small GTPase ARL3 at the photoreceptor connecting
  cilium. RP2 and ARL3 regulate the ciliary-tip trafficking of kinesin motor
  proteins (Kif7, Kif17) and lipidated phototransduction cargo, and loss of
  RP2 disrupts this ciliary trafficking checkpoint, causing mislocalization
  of ciliary and phototransduction proteins and progressive photoreceptor
  degeneration. RP2-RP typically causes early-onset (mean ~9.6 years), severe
  rod-cone dystrophy in hemizygous males, with disproportionately early
  macular involvement, complete loss of the foveal photoreceptor layer by
  the third decade, and frequent associated myopia. Carrier females show a
  highly variable phenotype -- from normal to overt RP -- due to
  X-inactivation mosaicism (lyonization), so a family history limited to
  affected males does not exclude symptomatic female carriers.
disease_term:
  preferred_term: RP2-related retinopathy
  term:
    id: MONDO:0100442
    label: RP2-related retinopathy
synonyms:
- RP2 retinopathy
- retinitis pigmentosa 2
- RP2 retinitis pigmentosa
- retinitis pigmentosa caused by mutation in RP2
- retinitis pigmentosa type 2
- X-linked retinitis pigmentosa due to RP2
parents:
- Retinitis pigmentosa
- Inherited Retinal Dystrophy
notes: >-
  RP2 accounts for roughly 10-20% of X-linked RP, making it the second most
  common XLRP gene after RPGR. Unlike RPGR, which has a mutational hotspot in
  the ORF15 exon, RP2 pathogenic variants are largely private/family-specific
  with no major founder allele reported. Inheritance is best described as
  X-linked with variable, sex-limited penetrance rather than "true" recessive
  inheritance: hemizygous males are consistently and severely affected, but a
  meaningful minority of heterozygous female carriers are symptomatic (up to
  15% in one large cohort), governed by X-inactivation skewing rather than a
  modifier gene. Translational read-through inducing drugs (TRIDs, e.g.
  PTC124) have shown proof-of-concept restoration of RP2-dependent ciliary
  kinesin trafficking in cells from a patient with a nonsense (premature
  termination codon) variant, suggesting a genotype-specific small-molecule
  strategy for that variant class.
inheritance:
- name: X-linked, variable penetrance
  inheritance_term:
    preferred_term: X-linked recessive inheritance
    term:
      id: HP:0001419
      label: X-linked recessive inheritance
  description: >-
    RP2 is located on the X chromosome (Xp11.3). Hemizygous males are
    consistently and severely affected. Heterozygous carrier females show
    highly variable expressivity, from asymptomatic with normal fundus to
    overt retinitis pigmentosa, governed by random X-inactivation
    (lyonization) rather than a modifier gene; family history limited to
    affected males does not exclude symptomatic female carriers.
  evidence:
  - reference: PMID:37977507
    reference_title: "RP2-Associated X-linked Retinopathy: Clinical Findings, Molecular Genetics, and Natural History in a Large Cohort of Female Carriers."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "female carriers of RP2 variants can manifest RP. Family history of affected females with RP does not exclude X-linked disease."
    explanation: >-
      Documents that a meaningful proportion of female RP2 carriers are
      symptomatic, establishing the variable-penetrance inheritance pattern.

genetic:
- name: RP2 Loss-of-Function Variants
  association: Causative
  gene_term:
    preferred_term: RP2
    term:
      id: hgnc:10274
      label: RP2
  features: >-
    Loss-of-function variants (nonsense, frameshift, splice-site) and
    missense variants affecting either the N-terminal tubulin-folding
    cofactor C (TBCC)-like domain or the C-terminal ARL3-GAP domain of RP2,
    located on the X chromosome (Xp11.3). Missense variants show variable
    pathogenic potential rather than uniform loss of function.
  evidence:
  - reference: PMID:36423731
    reference_title: "RP2-Associated X-linked Retinopathy: Clinical Findings, Molecular Genetics, and Natural History."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Twenty-eight disease-causing variants were identified, with 20 not previously clinically characterized."
    explanation: >-
      Documents the diversity of disease-causing RP2 variants in a large
      natural history cohort.
  - reference: PMID:21738648
    reference_title: "Functional analysis of retinitis pigmentosa 2 (RP2) protein reveals variable pathogenic potential of disease-associated missense variants."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "the tested RP2 mutants exhibited variable degrees of rescue of rod versus cone photoreceptor development as well as microphthalmia"
    explanation: >-
      Zebrafish rescue assay demonstrates that RP2 missense variants have
      variable, rather than uniform, pathogenic potential.

pathophysiology:
- name: RP2 Loss of ARL3 GAP Activity
  description: >-
    RP2 functions as a GTPase-activating protein (GAP) for the small GTPase
    ARL3 at the photoreceptor connecting cilium. RP2 and ARL3 regulate the
    trafficking of the ciliary-tip kinesins Kif7 and Kif17, which are
    required for normal intraflagellar transport and delivery of cargo to
    the cilium tip. Loss-of-function RP2 variants abolish or reduce this
    GAP/trafficking-regulatory activity.
  gene:
    preferred_term: RP2
    modifier: ABSENT
    term:
      id: hgnc:10274
      label: RP2
  cell_types:
  - preferred_term: rod photoreceptor cell
    term:
      id: CL:0000604
      label: retinal rod cell
  cellular_components:
  - preferred_term: photoreceptor connecting cilium
    term:
      id: GO:0032391
      label: photoreceptor connecting cilium
  molecular_functions:
  - preferred_term: GTPase activator activity
    term:
      id: GO:0005096
      label: GTPase activator activity
    modifier: DECREASED
  evidence:
  - reference: PMID:28444310
    reference_title: "Arl3 and RP2 regulate the trafficking of ciliary tip kinesins."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we identified the ciliary tip kinesins Kif7 and Kif17 as novel interaction partners of the small GTPase Arl3 and its regulatory GTPase activating protein (GAP) Retinitis Pigmentosa 2 (RP2). We show that Arl3 and RP2 mediate the localization of GFP-Kif17 to the cilia tip"
    explanation: >-
      Identifies RP2 as the GAP for Arl3 and establishes its role in
      ciliary-tip kinesin localization.
  downstream:
  - target: Disrupted Ciliary Trafficking of Phototransduction Proteins
    description: >-
      Loss of RP2 GAP activity and its role in ciliary-tip kinesin
      recruitment disrupts the trafficking checkpoint that normally
      delivers cargo to the connecting cilium and outer segment.
    causal_link_type: DIRECT

- name: Disrupted Ciliary Trafficking of Phototransduction Proteins
  conforms_to: "ciliopathy_dysfunction#Basal Body and Transition Zone Dysfunction"
  description: >-
    Without functional RP2, ciliary-tip kinesin levels (Kif7) are reduced at
    the cilium tip, and lipidated phototransduction cargo normally released
    by ARL3-GTP at the connecting cilium is mistrafficked. In RP2-null
    patient cells and RP2-knockout mouse photoreceptors, this manifests as
    mislocalization of cone opsin and phosphodiesterase (PDE6) away from the
    outer segment.
  cell_types:
  - preferred_term: rod photoreceptor cell
    term:
      id: CL:0000604
      label: retinal rod cell
  cellular_components:
  - preferred_term: photoreceptor outer segment
    term:
      id: GO:0001750
      label: photoreceptor outer segment
  biological_processes:
  - preferred_term: protein localization to cilium
    term:
      id: GO:0061512
      label: protein localization to cilium
    modifier: ABNORMAL
  evidence:
  - reference: PMID:28444310
    reference_title: "Arl3 and RP2 regulate the trafficking of ciliary tip kinesins."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "siRNA-mediated loss of RP2 or Arl3 reduced the level of Kif7 at the cilia tip. This was further validated by reduced levels of Kif7 at cilia tips detected in fibroblasts and induced pluripotent stem cell (iPSC) 3D optic cups derived from a patient carrying an RP2 nonsense mutation"
    explanation: >-
      Demonstrates reduced ciliary-tip kinesin localization in patient-derived
      RP2-null cells, directly linking RP2 loss to ciliary trafficking defects.
  - reference: PMID:26358772
    reference_title: "Long-term rescue of cone photoreceptor degeneration in retinitis pigmentosa 2 (RP2)-knockout mice by gene replacement therapy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "the treatment preserved cone viability, corrected mis-trafficking of M-cone opsin and restored cone PDE6 expression"
    explanation: >-
      Demonstrates that AAV-RP2 gene replacement corrects opsin and PDE6
      mistrafficking in Rp2-knockout mouse photoreceptors, confirming that
      loss of RP2 causes phototransduction-protein mistrafficking.
  downstream:
  - target: Rod Photoreceptor Apoptosis
    description: >-
      Chronic mislocalization of ciliary and phototransduction proteins
      impairs photoreceptor outer segment maintenance, driving progressive
      rod photoreceptor degeneration.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - failure of ciliary-tip kinesin and phototransduction protein delivery
    - loss of outer segment structural and functional maintenance

- name: Rod Photoreceptor Apoptosis
  conforms_to: "photoreceptor_degeneration#Rod Photoreceptor Apoptosis"
  description: >-
    Progressive rod photoreceptor death follows chronic ciliary trafficking
    dysfunction, producing the early-onset, severe rod-cone dystrophy
    characteristic of RP2-related retinopathy. In human patients, rod
    photoreceptor cell models (patient-derived retinal organoids) show a
    peak of rod cell death by day 150 of culture, with subsequent thinning
    of the photoreceptor layer.
  cell_types:
  - preferred_term: rod photoreceptor cell
    term:
      id: CL:0000604
      label: retinal rod cell
  biological_processes:
  - preferred_term: neuron apoptotic process
    term:
      id: GO:0051402
      label: neuron apoptotic process
    modifier: INCREASED
  evidence:
  - reference: PMID:32531192
    reference_title: "Modeling and Rescue of RP2 Retinitis Pigmentosa Using iPSC-Derived Retinal Organoids."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the RP2 KO and RP2 patient-derived organoids showed a peak in rod photoreceptor cell death at day 150 (D150) with subsequent thinning of the organoid outer nuclear layer (ONL) by D180 of culture"
    explanation: >-
      Directly quantifies the kinetics of rod photoreceptor apoptosis in a
      human iPSC-derived RP2-deficient retinal organoid model.
  downstream:
  - target: Secondary Cone Degeneration
    description: >-
      Progressive rod loss and direct cone-intrinsic trafficking defects
      together drive generalized peripheral cone system involvement,
      converting nyctalopia and peripheral field loss into central vision
      impairment; central/macular involvement occurs disproportionately
      early in RP2-RP.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - loss of rod-derived trophic support for cones
    - cone-intrinsic ciliary trafficking dysfunction

- name: Secondary Cone Degeneration
  description: >-
    Cone photoreceptors are affected both indirectly (loss of rod-derived
    trophic support) and directly (cone-intrinsic RP2-dependent ciliary
    trafficking dysfunction), producing generalized peripheral cone system
    involvement of widely varying severity within the first two decades of
    life and converting the initial rod-dominant disease into progressive
    central vision loss with complete loss of the foveal photoreceptor
    layer by the third decade in most patients.
  cell_types:
  - preferred_term: cone photoreceptor cell
    term:
      id: CL:0000573
      label: retinal cone cell
  biological_processes:
  - preferred_term: neuron apoptotic process
    term:
      id: GO:0051402
      label: neuron apoptotic process
    modifier: INCREASED
  evidence:
  - reference: PMID:36423731
    reference_title: "RP2-Associated X-linked Retinopathy: Clinical Findings, Molecular Genetics, and Natural History."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Full-field ERGs revealed rod-cone dystrophy in the vast majority, but with generalized (peripheral) cone system involvement of widely varying severity in the first 2 decades of life."
    explanation: >-
      Documents early and widespread cone system involvement in a large
      natural history cohort of RP2-RP patients.


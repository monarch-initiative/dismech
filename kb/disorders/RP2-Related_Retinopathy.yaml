experimental_models:
- name: RP2-knockout and patient-derived human iPSC 3D retinal organoids
  experimental_model_type: ORGANOID
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  tissue_term:

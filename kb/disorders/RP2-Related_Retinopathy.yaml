classifications:
  harrisons_chapter:
  - classification_value: NEUROLOGIC
    notes: >-
      Inherited photoreceptor ciliopathy; Harrison's has no dedicated
      ophthalmology part, so inherited retinal dystrophies are placed under
      neurologic disorders.
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
  mechanistic_category:
  - classification_value: ciliopathy
prevalence:
- population: Published natural history cohorts and X-linked retinitis pigmentosa series
  measure_type: CASES_IN_LITERATURE
  notes: >-
    Population-wide point prevalence specific to RP2-related retinopathy has
    not been directly measured; the largest published natural history cohorts
    comprise 54 molecularly confirmed male patients from 38 pedigrees alongside
    27 examined female carriers from 21 pedigrees.
  evidence:
  - reference: PMID:36423731
    reference_title: "RP2-Associated X-linked Retinopathy: Clinical Findings, Molecular Genetics, and Natural History."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Fifty-four molecularly confirmed patients were identified from 38 pedigrees."
    explanation: Largest published natural history cohort of molecularly confirmed affected males.
  - reference: PMID:37977507
    reference_title: "RP2-Associated X-linked Retinopathy: Clinical Findings, Molecular Genetics, and Natural History in a Large Cohort of Female Carriers."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Twenty-seven females from 21 pedigrees were examined by a retinal genetics specialist."
    explanation: Largest published cohort of clinically examined female RP2 carriers.
notes: >-
  RP2 is the second most common X-linked retinitis pigmentosa gene after RPGR.
  Unlike RPGR, which has a mutational hotspot in the ORF15 exon, RP2
  pathogenic variants are largely private and family-specific with no major
  founder allele reported. Inheritance is X-linked with variable penetrance in
  females: hemizygous males are consistently and severely affected, whereas a
  minority of heterozygous female carriers develop overt RP governed by
  X-inactivation skewing rather than a modifier gene. Translational
  read-through inducing drugs (TRIDs, e.g. PTC124) have shown proof-of-concept
  restoration of RP2-dependent ciliary kinesin trafficking in cells from a
  patient with a nonsense (premature termination codon) variant, suggesting a
  genotype-specific small-molecule strategy for that variant class.
inheritance:
- name: X-linked, variable penetrance
  inheritance_term:
    preferred_term: X-linked recessive inheritance
    term:
      id: HP:0001419
      label: X-linked recessive inheritance
  description: >-
    RP2 is located on the X chromosome (Xp11.3). Hemizygous males are
    consistently and severely affected. Heterozygous carrier females show
    highly variable expressivity, from asymptomatic with normal fundus to
    overt retinitis pigmentosa (15% symptomatic in a 27-carrier cohort),
    governed by random X-inactivation (lyonization) rather than a modifier
    gene; family history limited to affected males does not exclude
    symptomatic female carriers.
  evidence:
  - reference: PMID:37977507
    reference_title: "RP2-Associated X-linked Retinopathy: Clinical Findings, Molecular Genetics, and Natural History in a Large Cohort of Female Carriers."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "female carriers of RP2 variants can manifest RP. Family history of affected females with RP does not exclude X-linked disease."
    explanation: >-
      Documents that female RP2 carriers can manifest overt RP, establishing
      the variable-penetrance X-linked inheritance pattern.
  - reference: PMID:37977507
    reference_title: "RP2-Associated X-linked Retinopathy: Clinical Findings, Molecular Genetics, and Natural History in a Large Cohort of Female Carriers."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Twenty-three patients (85%) reported no complaints and had normal vision and 4 patients had RP-associated complaints (15%)."
    explanation: >-
      Quantifies symptomatic RP manifestations in 15% of examined female RP2
      carriers.


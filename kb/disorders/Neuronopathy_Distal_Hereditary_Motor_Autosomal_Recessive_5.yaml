    snippet: "In total, 25 distinct DNAJB2 variants were identified across 46 families in the literature, with most occurring in the homozygous state."
    explanation: Gives the number of reported families.
progression:
- phase: Adolescent to early adult onset
  age_range: late first to early fourth decade
  notes: >-
    Onset is typically in the second decade, with a reported range from the
    late first to the early fourth decade, usually with gait difficulty and
    distal leg weakness.
  evidence:
  - reference: PMID:32093037
    reference_title: "Neuromuscular Diseases Due to Chaperone Mutations: A Review and Some New Results."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The onset of symptoms is typically in the 2nd decade of life, and has been reported to range from the late 1st to early 4th decades"
    explanation: Age-of-onset range across reported families.
  - reference: PMID:41549766
    reference_title: "Broadening the Clinical Spectrum of Axonal Hereditary Neuropathies: A Comparative Case Study on DNAJB2- and HINT1-Related Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most patients developed symptoms during late adolescence, with initial manifestation occurring in the lower limbs in all cases."
    explanation: Late-adolescent onset in the lower limbs in a recent series.
- phase: Slow progression with proximal and sensory spread
  age_range: second decade onward
  notes: >-
    Motor function declines slowly and continuously; in one family the MRC sum
    score fell by an average of 0.78 points per year over up to 10 years of
    follow-up. Weakness spreads to the proximal legs and the hands, sensory
    involvement appears, and severely affected patients become wheelchair-bound
    by the fifth to sixth decade, with bulbar involvement at advanced stages.
  evidence:
  - reference: PMID:41549766
    reference_title: "Broadening the Clinical Spectrum of Axonal Hereditary Neuropathies: A Comparative Case Study on DNAJB2- and HINT1-Related Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Over the observation period, motor function declined on average by 0.78 points per year (on MRC-SS scale)"
    explanation: The only quantitative natural-history estimate.
  - reference: PMID:35286755
    reference_title: "DNAJB2-related Charcot-Marie-Tooth disease type 2: Pathomechanism insights and phenotypic spectrum widening."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients were wheelchair-bound from their fifth to sixth decade of life."
    explanation: Late-stage loss of ambulation in a severe family.

  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population prevalence has been published. A 2026 systematic review
    counted 46 reported families carrying 25 distinct variants. That is a case
    count, not a prevalence.
  evidence:

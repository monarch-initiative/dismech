diagnosis:
- name: Nerve conduction studies and needle electromyography
  description: >
    Nerve conduction shows a length-dependent axonal pattern, pure motor in dHMN
    presentations and sensorimotor in CMT2 presentations; needle EMG shows
    chronic denervation with very large motor unit potentials.
  diagnosis_term:
    preferred_term: nerve conduction studies
    term:
      id: NCIT:C88502
      label: Nerve Conduction Velocity Test
  evidence:
  - reference: PMID:27449489
    reference_title: "Identification of a Large DNAJB2 Deletion in a Family with Spinal Muscular Atrophy and Parkinsonism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Electromyography (EMG) and nerve conduction testing revealed an active chronic motor neuron axonal disorder with huge motor unit action potentials (MUAPs) compatible with a SMA."
    explanation: The electrodiagnostic finding that frames the disease as a distal SMA.
- name: Multigene neuropathy panel sequencing
  description: >
    The diagnosis is made by finding biallelic DNAJB2 variants, typically on a
    CMT/hereditary motor neuropathy gene panel or exome. In a Spanish cohort
    screened with a 56-gene panel, the c.352+1G>A founder allele was found in
    two index cases and then in three further families. The 3.8 kb deletion was
    found by whole-genome sequencing, so copy-number-aware analysis is needed
    when sequencing finds a single or no variant.
  diagnosis_term:

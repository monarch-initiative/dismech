    evidence_source: HUMAN_CLINICAL
    snippet: "Notably, IHC study of the proband's skin biopsy showed abnormal accumulation of p-alpha-syn along the nerve fiber, which was absent in the control"
    explanation: Phospho-alpha-synuclein accumulation in the patient with parkinsonism.
  - reference: PMID:26936937
    reference_title: "The heat shock response plays an important role in TDP-43 clearance: evidence for dysfunction in amyotrophic lateral sclerosis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "To determine which chaperones were mediating TDP-43 clearance we over-expressed a range of heat shock proteins (HSPs) and identified DNAJB2a (encoded by DNAJB2, and also known as HSJ1a) as a potent anti-aggregation chaperone for TDP-43."
    explanation: Identifies TDP-43 as an HSJ1a client, which makes its accumulation in patient tissue mechanistically plausible.
  downstream:

- name: Impaired Ubiquitin-Proteasome Targeting of HSP70 Client Proteins
  biological_scale: CELLULAR
  role: cellular consequence
  mechanism_confidence: PROVISIONAL
  description: >
    HSJ1 promotes ubiquitylation of HSP70-bound clients by STUB1 (CHIP),
    protects the chains from deubiquitylation and delivers the clients to the
    proteasome; HSJ1b additionally promotes ER-associated degradation of
    membrane and secretory proteins. In cell and animal systems,
    HSJ1 overexpression increases client ubiquitylation and degradation and
    lowers inclusion formation by polyglutamine proteins and mutant SOD1. The
    disease-relevant client proteins are not known, and impaired degradation
    has been inferred rather than measured in patient tissue.

- name: Loss of HSJ1 Co-chaperone Protein
  biological_scale: MOLECULAR
  role: molecular consequence of the lesion
  mechanism_confidence: ESTABLISHED
  description: >
    Absence of both HSJ1 isoforms: HSJ1a (277 aa, cytosolic and nuclear) and
    HSJ1b (324 aa, geranylgeranyl-anchored to the cytoplasmic face of the
    endoplasmic reticulum, the predominant isoform in neurons). Each carries an
    N-terminal J domain that binds HSP70 and stimulates its ATPase activity,
    and two C-terminal ubiquitin-interacting motifs that bind polyubiquitin
    chains and the proteasome. Loss of the protein therefore removes an
    HSP70 ATPase activator, an HSP70-binding client-delivery factor and a
    polyubiquitin-binding adaptor at once. Expression is highest in neurons,
    which fits the neural restriction of the disease.

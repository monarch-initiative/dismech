pathophysiology:
- name: Biallelic DNAJB2 Loss-of-Function Variants
  biological_scale: MOLECULAR
  role: initiating genetic lesion
  mechanism_confidence: ESTABLISHED
  description: >
    Two loss-of-function alleles of DNAJB2. The reported spectrum is dominated
    by splice-site variants (the c.352+1G>A founder allele, c.229+1G>A,
    c.446-1G>A and others), single-nucleotide deletions causing frameshift, and
    a 3.8 kb deletion removing the exons that encode the J domain, with a small
    number of missense changes such as c.14A>G p.(Tyr5Cys) in the J domain.
    Most patients are homozygous, often from consanguineous families; compound
    heterozygosity is reported.
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Biallelic germline loss of function, usually homozygous; one compound
      heterozygous patient (c.352+1G>A with c.175+2T>A) has been reported.

differential_diagnoses:
- name: HINT1-related autosomal recessive axonal neuropathy with neuromyotonia
  description: >
    The other recessive axonal neuropathy that presents as CMT2 or dHMN with
    lower-limb onset.
  distinguishing_features:
  - >
    HINT1 neuropathy begins earlier (childhood or early adolescence) and has
    neuromyotonia as a hallmark; DNAJB2 patients start later but develop more
    severe neuropathy.
  evidence:
  - reference: PMID:41549766
    reference_title: "Broadening the Clinical Spectrum of Axonal Hereditary Neuropathies: A Comparative Case Study on DNAJB2- and HINT1-Related Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Disease onset was typically later in patients with DNAJB2 variants (late adolescence or early adulthood) compared to patients with HINT1 variants (childhood or early adolescence), yet patients with DNAJB2 variants more frequently developed severe neuropathy, as reflected by higher CMTNS scores."
    explanation: Direct clinical comparison of the two disorders.
- name: Perry syndrome (DCTN1)
  description: >
    Relevant when parkinsonism accompanies the neuropathy: DCTN1 causes both a
    distal motor neuropathy and Perry syndrome, which combines early-onset
    parkinsonism with TDP-43 proteinopathy.
  distinguishing_features:
  - >
    Perry syndrome adds depression or apathy and central hypoventilation.
  evidence:
  - reference: PMID:35286755
    reference_title: "DNAJB2-related Charcot-Marie-Tooth disease type 2: Pathomechanism insights and phenotypic spectrum widening."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "It is characterized clinically by early-onset parkinsonism, depression/apathy and central hypoventilation, and pathologically by degeneration of dopaminergic neurons and TDP-43 proteinopathy"
    explanation: The authors' comparison of Perry syndrome with the DNAJB2 phenotype.
- name: MME-related Charcot-Marie-Tooth disease type 2T
  description: >
    A nomenclature hazard rather than a biological mimic. The homozygous
    DNAJB2 p.(Tyr5Cys) CMT2 family was labelled CMT2T, a designation now used
    for MME-related neuropathy, so a historical "CMT2T" citation must be checked
    for which gene it means.
  evidence:
  - reference: PMID:28018906
    reference_title: "Chaperonopathies: Spotlight on Hereditary Motor Neuropathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Two additional homozygous mutations were later described in the DNAJB2 gene, c.229+1G>A and c.14A>G (p.Y5C), in a family diagnosed with dHMN (dHMN5) and another with CMT2 (CMT2T), respectively (Gess et al., 2014)."
    explanation: Shows the CMT2T label applied to a DNAJB2 family.
discussions:
- discussion_id: dnajb2_axon_loss_mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Which HSJ1 client proteins and which downstream process link loss of HSJ1
    to motor and sensory axon degeneration?
  attaches_to:
  - pathophysiology#Impaired Ubiquitin-Proteasome Targeting of HSP70 Client Proteins
  - pathophysiology#Accumulation of Aggregation-Prone Client Proteins
  - pathophysiology#Length-Dependent Degeneration of Lower Motor Neuron Axons
  rationale: >
    Every functional study of HSJ1 is an overexpression or construct experiment
    in non-neuronal or cultured neuronal cells, and the only patient tissue
    examined is skin, lymphoblastoid cells and fibroblasts. Phospho-TDP-43 in
    patient skin is the one direct link to a client protein, but loss of HSJ1
    from dermal axons was not accompanied by neurofilament impairment. The
    review literature leaves open whether the lesion is proteotoxic or a defect
    of HSJ1b-dependent trafficking and secretion. No patient-derived motor
    neuron model or Dnajb2-null animal phenotype has been reported.
  evidence:
  - reference: PMID:35286755
    reference_title: "DNAJB2-related Charcot-Marie-Tooth disease type 2: Pathomechanism insights and phenotypic spectrum widening."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Consistent with these data, skin biopsy analysis showed a complete loss of DNAJB2 expression in patients that was not associated with an impairment of NF, leaving the pathomechanism of the axonal loss still unclear."
    explanation: The authors state the gap directly.
  - reference: PMID:32093037
    reference_title: "Neuromuscular Diseases Due to Chaperone Mutations: A Review and Some New Results."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The client protein(s) and processes relevant for the disease remain to be established: the pathomechanism could be envisioned to depend on cytotoxicity due to impaired protein quality control and turnover or a specific defect in protein trafficking or secretion caused by loss of DNAJB2b."
    explanation: Names the two competing mechanistic hypotheses.
- discussion_id: dnajb2_cns_features_attribution
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Are parkinsonism and other CNS features part of DNAJB2-related disease, or
    coincidental in a few families?
  attaches_to:
  - pathophysiology#Nigrostriatal Dopaminergic Terminal Degeneration
  - phenotypes#Parkinsonism
  rationale: >
    Parkinsonism with presynaptic dopaminergic deficit has now been reported
    in patients from several unrelated families with different alleles,
    including a compound heterozygote, and phospho-alpha-synuclein deposits
    were found in skin nerves of the patient with Parkinson disease but not in
    an affected sibling without parkinsonism. Against this, the numbers are very small, the deletion family's
    allele also overlaps a TUBA4A isoform, and the review literature considers
    the attribution unresolved.
  evidence:
  - reference: PMID:32093037
    reference_title: "Neuromuscular Diseases Due to Chaperone Mutations: A Review and Some New Results."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Due to the small number of cases, it remains unclear whether the CNS symptoms in these patients are indeed due to the DNAJB2 mutations or additional factors"
    explanation: States the uncertainty.
  - reference: PMID:41799927
    reference_title: "Co-Existing Charcot-Marie-Tooth Disease Type II and Parkinson's Disease Linked to a Novel DNAjB2 Pathogenic Variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To our knowledge, this is the first case report describing the dual phenotype of CMT2 and young-onset PD linked to compound heterozygosity in DNAjB2."
    explanation: An additional unrelated patient with the dual phenotype.
notes: >-
  The dHMN and CMT2 presentations are curated as one disease rather than as
  subtypes: the same alleles produce both, MONDO lists DNAJB2-related CMT2 as an
  exact synonym of this term, and patients diagnosed with dHMN can evolve into
  CMT2. No GeneReviews chapter covers this disease. PMID:27083531 (Frasquet et
  al. 2016) has no available abstract text and is listed without evidence
  items. The 2026 series of two DNAJB2 families also
  reported depression in all assessed patients, fatigue in most and reduced
  quality of life, but its authors note that the patients were refugees and
  that migration stressors may contribute, so those features are not curated
  as disease phenotypes.

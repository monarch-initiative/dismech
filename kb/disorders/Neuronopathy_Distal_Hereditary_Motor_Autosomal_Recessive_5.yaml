name: Neuronopathy, Distal Hereditary Motor, Autosomal Recessive 5
creation_date: "2026-10-01T00:00:00Z"
category: Genetic
description: >
  Autosomal recessive distal hereditary motor neuronopathy type 5 (distal
  spinal muscular atrophy, autosomal recessive 5; DSMA5) is caused by biallelic
  loss-of-function variants in DNAJB2, which encodes HSJ1, a neuron-enriched
  J-domain co-chaperone of HSP70. HSJ1 stimulates the ATPase activity of HSP70
  (HSPA8) and, through two C-terminal ubiquitin-interacting motifs, binds
  polyubiquitylated clients and the proteasome, so that it steers HSP70 clients
  to degradation by the ubiquitin-proteasome system rather than to refolding;
  the membrane-anchored HSJ1b isoform also takes part in ER-associated
  degradation. Reported alleles are splice-site, frameshift and deletion
  variants that abolish HSJ1 protein, plus rare missense changes. The founding
  family, a large Moroccan Jewish kindred, had a pure lower motor neuron disease
  with early-adult onset and predominantly lower-limb paralysis, and carried a
  homozygous splice-donor variant later shown to be a founder allele shared with
  Spanish families. Subsequent families showed that the same genotypes produce a
  continuum from pure distal motor neuropathy to axonal sensorimotor
  Charcot-Marie-Tooth disease type 2, with sensory loss commonly appearing with
  age and dHMN presentations evolving into CMT2. Onset is typically in the
  second decade; weakness and wasting begin in the distal legs, spread slowly to
  the proximal legs and hands, and lead to wheelchair dependence in severe
  families, with bulbar involvement at advanced stages. A minority of patients
  have early-onset parkinsonism with presynaptic dopaminergic deficit, and one
  family had sensorineural deafness. Which client proteins matter is not
  established; phospho-TDP-43 accumulation in patient skin and the potent
  anti-aggregation activity of HSJ1a toward TDP-43 and mutant SOD1 in
  experimental systems implicate failed clearance of aggregation-prone proteins.

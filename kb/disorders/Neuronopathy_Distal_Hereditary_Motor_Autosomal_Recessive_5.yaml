      Homozygous single-nucleotide deletion (reported as c.145delG) in the J
      domain, causing a frameshift and absent protein in an Italian CMT2 family
      with deafness and parkinsonism.
    clinical_significance: PATHOGENIC
    gene:
      preferred_term: DNAJB2
      term:
        id: hgnc:5228
        label: DNAJB2
    evidence:
    - reference: PMID:35286755
      reference_title: "DNAJB2-related Charcot-Marie-Tooth disease type 2: Pathomechanism insights and phenotypic spectrum widening."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The CMT gene panel analysis in the proband (II.2) revealed the novel homozygous pathogenic variant c.145delG in the DNAJB2 gene (NM_006736.6), resulting in the frameshift p. Val49TrpfsTer25."
      explanation: Identifies the allele and its consequence.
  - name: 3.8 kb deletion of the 5' DNAJB2 exons
    description: >
      Homozygous ~3.8 kb deletion removing the first coding exons, which encode
      the J domain, found by whole-genome sequencing in a consanguineous family
      with SMA-like distal motor neuropathy, axonal sensorimotor neuropathy in
      two siblings and juvenile parkinsonism in one. It most likely abolishes
      expression; it also overlaps a predicted TUBA4A isoform.
    clinical_significance: PATHOGENIC
    gene:
      preferred_term: DNAJB2
      term:
        id: hgnc:5228
        label: DNAJB2
    evidence:
    - reference: PMID:27449489
      reference_title: "Identification of a Large DNAJB2 Deletion in a Family with Spinal Muscular Atrophy and Parkinsonism."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "After performing homozygosity mapping and whole genome sequencing, we identified a 3.8 kb deletion, spanning the entire DnaJ domain of the HSJ1 protein, as the disease-segregating mutation."
      explanation: Identifies the structural allele and its segregation.
    - reference: PMID:32093037
      reference_title: "Neuromuscular Diseases Due to Chaperone Mutations: A Review and Some New Results."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Moreover, the deletion also affects a predicted isoform of the TUBA4A gene, mutations in which are associated with ALS"
      explanation: Records the overlap with TUBA4A as a possible contributor to the phenotype.
  notes: >-
    Missense alleles are rare: c.14A>G p.(Tyr5Cys) in the J domain was reported
    homozygous in a CMT2 family (labelled CMT2T in the original report), with
    a phenotype comparable to the null alleles but no functional data; a
    homozygous c.184C>T variant was reported with dHMN and rimmed-vacuolar
    myopathy. Two variants were deliberately not curated as alleles of this
    disease. A heterozygous c.823+6C>T variant in an adult with severe
    sensorimotor polyneuropathy (PMID:40423229) was studied in fibroblasts but
    is a single heterozygous allele in a recessive gene. A dominant stop-loss
    variant, c.832T>G p.(*278Glyext*83), extends the HSJ1a isoform and causes a
    late-onset neuromyopathy with a dominant-negative mechanism in one German
    family (PMID:37070754); it is a distinct allelic disorder rather than this
    recessive loss-of-function disease.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >
    Both alleles must be inactivated; most patients are homozygous and several
    families are consanguineous. Heterozygous carriers with about 40% of normal
    protein were clinically unaffected in the Italian family.
  evidence:
  - reference: PMID:22522442
    reference_title: "A rare recessive distal hereditary motor neuropathy with HSJ1 chaperone mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report here a novel rare variant of dHMN with autosomal recessive inheritance in a large Jewish family originating from Morocco."
    explanation: Recessive inheritance in the founding family.
  - reference: PMID:35286755
    reference_title: "DNAJB2-related Charcot-Marie-Tooth disease type 2: Pathomechanism insights and phenotypic spectrum widening."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Consistently, WB analysis showed an absence of DNAJB2 protein in the homozygous patient and a significant reduction of protein level in the heterozygous carrier (40% of the control's protein level; Figure 3a–b)."
    explanation: Quantifies protein in an unaffected heterozygous carrier, consistent with recessive loss of function.

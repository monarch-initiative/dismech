    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Immunosuppressive therapy is ineffective; instead, lipid-lowering measures reduce intraglomerular lipoprotein deposition and preserve kidney function."
    explanation: >-

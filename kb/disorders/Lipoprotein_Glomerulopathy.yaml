name: Lipoprotein Glomerulopathy
creation_date: '2026-10-12T18:40:00Z'
category: Mendelian
parents:
- Glomerular Disease
- Renal Lipidosis
- Inherited Dyslipidemia
disease_term:
  preferred_term: lipoprotein glomerulopathy
  term:
    id: MONDO:0012725
    label: lipoprotein glomerulopathy
synonyms:
- LPG
- apoE-associated lipoprotein glomerulopathy
description: >-
  Lipoprotein glomerulopathy is a rare autosomal dominant kidney disease with
  incomplete penetrance, caused by heterozygous (rarely homozygous) missense
  or small in-frame variants in APOE that cluster around the low-density
  lipoprotein receptor-binding region of apolipoprotein E. The variant
  proteins, named after the places they were found (Sendai, Kyoto, Osaka or
  Kurashiki, Chicago, Tokyo or Maebashi, Kanto and others), are
  thermodynamically destabilised, expose hydrophobic surface and aggregate,
  and they form abnormal, unstable lipoprotein particles. These deposit as
  lamellated, apoE-rich lipoprotein thrombi in markedly dilated glomerular
  capillaries, without foam cells and without immunoglobulin or complement.
  Patients, mostly adults and mostly from Japan and China, present with
  proteinuria often reaching the nephrotic range, microscopic haematuria and
  a type III hyperlipoproteinaemia-like profile with high serum apoE, though
  some are normolipidaemic. About half reach end-stage kidney disease within
  1 to 27 years. The disease is not steroid-responsive; intensive
  lipid-lowering therapy, especially fibrates, can reduce proteinuria and
  induce remission. Because the abnormal apoE circulates, the disease recurs
  in kidney transplants.
inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Heterozygous APOE variants cause disease with low penetrance, so many
    carriers in affected families are unaffected. Homozygosity for APOE Kyoto
    in a child of consanguineous parents caused very early-onset disease.
  evidence:
  - reference: PMID:38438730
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is a monogenic disorder with autosomal dominant inheritance and the average age of presentation is 32 years (4-69 years)."
    explanation: >-
      States autosomal dominant inheritance and the age range at presentation.
  - reference: PMID:42417997
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic analysis revealed homozygosity for the APOE Kyoto variant and prompted discontinuation of prednisolone."
    explanation: >-
      A homozygous case with infantile onset.
- name: Incomplete penetrance
  inheritance_term:
    preferred_term: Typified by incomplete penetrance
    term:
      id: HP:0003829
      label: Typified by incomplete penetrance
  evidence:
  - reference: PMID:23407349
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In addition to APOE mutation, other genetic and/or epigenetic factors are considered to be involved in the pathogenesis of LPG because of its low penetrance."
    explanation: >-
      States low penetrance of the APOE variants.
prevalence:
- population: Worldwide (published case reports)
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    About 150 cases had been reported worldwide by 2013, most from Japan and
    East Asia. No population-based estimate exists.
  evidence:
  - reference: PMID:24149835
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To date, approximately 150 cases of LPG have been reported worldwide."
    explanation: >-
      Count of reported cases.
  - reference: PMID:16431249
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At present, 65 cases have been reported worldwide, although most patients are found in Japan and east Asian countries."
    explanation: >-
      Earlier count showing the East Asian concentration.
genetic:
- name: APOE
  gene_term:
    preferred_term: APOE
    term:
      id: hgnc:613
      label: APOE
  relationship_type: CAUSATIVE
  notes: >-
    Heterozygous missense substitutions (often arginine to proline) and small
    in-frame deletions or duplications in APOE near the LDL-receptor-binding
    region. APOE Sendai (Arg145Pro) is a founder allele in eastern Japan and
    APOE Kyoto (Arg25Cys) the commonest Chinese allele.
  evidence:
  - reference: PMID:23407349
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "More than 12 APOE mutations have been identified as causes of LPG, and APOE-Sendai (Arg145Pro) mutation was frequently detected in patients from the eastern part of Japan including Yamagata prefecture."
    explanation: >-
      Many APOE variants cause the disease, with a common Japanese allele.
  - reference: PMID:23407349
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We determined the haplotype structure of APOE-Sendai in 13 patients from 9 unrelated families with LPG, and found that the haplotype of all APOE-Sendai mutations was identical, suggesting that APOE-Sendai mutation is common in Japanese patients probably through a founder effect."
    explanation: >-
      Founder effect for APOE Sendai.
  - reference: PMID:39141311
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Direct DNA sequencing analyses for apo E identified a duplication of amino acid 151, aspartic acid, and the gene mutation was named APOE Kanto."
    explanation: >-
      An in-frame duplication allele.
pathophysiology:
- name: APOE Variants Near the LDL-Receptor-Binding Region
  biological_scale: MOLECULAR
  description: >-
    Heterozygous missense and small in-frame APOE variants cluster around the
    receptor-binding region of the N-terminal domain of apolipoprotein E.
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
  genes:
  - preferred_term: APOE
    term:
      id: hgnc:613
      label: APOE
  evidence:
  - reference: PMID:31874799
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "LPG is primarily associated with heterozygous apoE mutations surrounding the low-density lipoprotein-receptor binding site, and it is histologically characterized by lamellated lipoprotein thrombi that lack foam cells."
    explanation: >-
      Locates the causal variants and the defining lesion.
  downstream:
  - target: Thermodynamic Destabilisation and Aggregation of Variant apoE
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:23110818
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "All three variants were found to have significantly reduced helical content, to expose a larger portion of hydrophobic surface to the solvent, and to be significantly thermodynamically destabilized, often lacking functionally relevant unfolding intermediates."
      explanation: >-
        Three proline-substitution variants are destabilised in vitro.
- name: Thermodynamic Destabilisation and Aggregation of Variant apoE
  biological_scale: MOLECULAR
  description: >-
    Proline and non-proline LPG variants reduce helical content of the
    N-terminal domain, push it toward a molten-globule-like state, expose
    hydrophobic surface and make the protein aggregation-prone and
    protease-sensitive, both lipid-free and on lipoprotein particles.
  biological_processes:
  - preferred_term: protein destabilization
    modifier: INCREASED
    term:
      id: GO:0031648
      label: protein destabilization
  evidence:
  - reference: PMID:23110818
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Furthermore, all variants were aggregation prone and had enhanced sensitivity to protease digestion."
    explanation: >-
      Aggregation propensity of the variants.
  - reference: PMID:30309894
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Overall, our data suggest that the LPG-associated apoE3 mutations R25C, R114C, and A152D induce protein misfolding, which may contribute to protein aggregation in glomerular capillaries."
    explanation: >-
      The same mechanism for non-proline variants including Kyoto.
  downstream:
  - target: Aberrant Unstable apoE-Rich Lipoprotein Particles
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:23110818
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Finally, although the variants were able to form discoidal lipoprotein particles, discrete subpopulations of poorly formed or aberrant particles were evident."
      explanation: >-
        Variant apoE forms aberrant lipoprotein particles.
- name: Aberrant Unstable apoE-Rich Lipoprotein Particles
  biological_scale: ORGANISM
  description: >-
    Variant apoE forms poorly formed, destabilised, aggregation-prone
    lipoprotein particles. Plasma shows a type III hyperlipoproteinaemia-like
    profile with raised triglycerides, apoB and apoE, although apoE can be
    normal with some variants.
  biological_processes:
  - preferred_term: lipoprotein metabolic process
    modifier: ABNORMAL
    term:
      id: GO:0042157
      label: lipoprotein metabolic process
  evidence:
  - reference: PMID:23110818
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Furthermore, these lipoprotein particles were thermodynamically destabilized and aggregation prone."
    explanation: >-
      Lipoprotein particles carrying variant apoE are unstable.
  - reference: PMID:16431249
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Lipoprotein glomerulopathy (LPG) is a unique entity of renal lipidosis characterized by peculiar histopathologic characteristics of lipoprotein thrombi and an abnormal plasma lipoprotein profile resembling type III hyperlipoproteinemia, with a marked increase in serum apolipoprotein E (apoE) concentrations."
    explanation: >-
      The plasma lipoprotein phenotype.
  downstream:
  - target: Glomerular Lipoprotein Thrombi in Dilated Capillaries
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:16431249
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The virus-mediated transduction of apoE Sendai resulting in the development of LPG in apoE-deficient mice confirms the etiologic role of apoE mutation in LPG."
      explanation: >-
        Circulating variant apoE is sufficient to produce the glomerular
        lesion in mice.
  - target: Hypertriglyceridemia
  - target: Elevated serum apolipoprotein E
- name: Glomerular Lipoprotein Thrombi in Dilated Capillaries
  biological_scale: TISSUE
  description: >-
    Markedly dilated glomerular capillary loops are filled with pale,
    lamellated, vacuolated thrombi that stain for lipid (Oil Red O, Sudan) and
    for apoA, apoB and apoE, lack foam cells, and are negative for
    immunoglobulins and complement. Impaired macrophage handling of
    lipoproteins has been proposed to explain why foam cells are absent.
  cell_types:
  - preferred_term: glomerular endothelial cell
    term:
      id: CL:0002188
      label: glomerular endothelial cell
  evidence:
  - reference: PMID:15498375
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Immunofluorescence staining showed that the thrombi were strongly positive for apo A, B, and E."
    explanation: >-
      Composition of the thrombi.
  - reference: PMID:41405262
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These capillary luminal contents stained reddish with Oil-red O confirming lipid contents."
    explanation: >-
      Lipid nature of the capillary contents.
  - reference: PMID:24149835
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Moreover, the macrophage impairment in LPG may provide another mechanism for lipoprotein thrombi in which massive lipoproteins accumulate in the glomerulus without foam cells."
    explanation: >-
      Proposed macrophage contribution, stated as a hypothesis.
  downstream:
  - target: Glomerular Filtration Barrier Injury and Progressive Kidney Damage
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Glomerular lipoprotein thrombi
- name: Glomerular Filtration Barrier Injury and Progressive Kidney Damage
  biological_scale: ORGANISM
  description: >-
    Occlusion of glomerular capillaries is accompanied by proteinuria,
    haematuria and declining filtration; about half of patients reach
    end-stage kidney disease. Patients whose proteinuria falls by more than
    half lose kidney function more slowly.
  evidence:
  - reference: PMID:42417997
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Lipoprotein glomerulopathy is a rare, inherited kidney disorder caused by pathogenic APOE variants that leads to obstruction of glomerular capillaries by lipoprotein thrombi, steroid-resistant nephrotic syndrome, and progressive chronic kidney disease."
    explanation: >-
      Links capillary obstruction to nephrotic syndrome and CKD.
  - reference: PMID:38769490
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Without appropriate treatment, chronic kidney disease (CKD) caused by LPG progresses, and approximately half of the patients develop end-stage kidney disease within 1-27 years of disease onset."
    explanation: >-
      Natural history toward end-stage kidney disease.
  - reference: PMID:32441489
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "LPG patients with urine protein reduced more than 50% had a slower decrease in renal function than those with less urine protein reduction"
    explanation: >-
      Proteinuria reduction tracks slower decline.
  downstream:
  - target: Proteinuria
  - target: Nephrotic syndrome
  - target: Microscopic hematuria
  - target: Edema
  - target: Chronic kidney disease progressing to kidney failure
  - target: Hypertension
  - target: Enlarged kidneys
  - target: Anemia

diagnosis:
- name: Kidney biopsy and APOE sequencing
  description: >-
    Biopsy shows the characteristic dilated capillaries with lipid-positive,
    apoE-positive, immunoglobulin-negative thrombi; APOE sequencing confirms
    the diagnosis and is needed because the histology is not unique.
  evidence:
  - reference: PMID:40306438
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although kidney biopsy presents typical findings, such as dilated capillary loops containing lipoprotein thrombi, definitive diagnosis requires molecular genetic analysis of APOE."
    explanation: >-
      Biopsy plus genetic confirmation.
  - reference: PMID:41405262
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Glomerular tufts were negative for all antisera on direct immunoflorescence."
    explanation: >-
      Negative immunofluorescence separates it from immune-complex disease.
treatments:
- name: Fibrate therapy
  description: >-
    Fibrates (fenofibrate, bezafibrate, pemafibrate) lower triglycerides and
    apoE-rich lipoproteins and are the most consistently reported effective
    therapy, with proteinuria reduction and occasional complete remission,
    best started early.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: fenofibrate
      term:
        id: CHEBI:5001
        label: fenofibrate
    - preferred_term: bezafibrate
      term:
        id: CHEBI:47612
        label: bezafibrate
    - preferred_term: pemafibrate
      term:
        id: CHEBI:228365
        label: pemafibrate
  target_mechanisms:
  - target: Aberrant Unstable apoE-Rich Lipoprotein Particles
    treatment_effect: INHIBITS
    description: >-
      Intensive lowering of triglyceride-rich, apoE-rich lipoproteins reduces
      the supply of material that forms glomerular thrombi.
  evidence:
  - reference: PMID:24149835
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "On the other hand, the administration of fibrate with the intensive control of triglyceride and apolipoprotein E particularly from the early phase will ameliorate LPG and prevent renal dysfunction."
    explanation: >-
      Review recommending early intensive fibrate therapy.
  - reference: PMID:42371225
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Complete remission (0.05 g/gCr) was achieved within 7 months, and she remained stable thereafter."
    explanation: >-
      Complete remission on pemafibrate in a single case.
  - reference: PMID:38438730
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Complete response was achieved with Angiotensin-converting Enzyme inhibitor and fenofibrates."
    explanation: >-
      Complete response with fenofibrate plus an ACE inhibitor in a child.
- name: Renin-angiotensin system blockade
  description: >-
    ACE inhibitors or angiotensin receptor blockers are used with
    lipid-lowering therapy to reduce proteinuria. No agent is bound because
    the CHEBI angiotensin receptor antagonist class term is a role, not a
    chemical entity, and is not admissible in therapeutic_agent.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:38438730
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Complete response was achieved with Angiotensin-converting Enzyme inhibitor and fenofibrates."
    explanation: >-
      ACE inhibition combined with fenofibrate.
- name: Statin therapy
  description: >-
    Statins are used as lipid-lowering therapy with heterogeneous responses.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: statin
      term:
        id: CHEBI:87631
        label: statin
  evidence:
  - reference: PMID:40306438
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As in previously described cases, the clinical response was heterogeneous despite the use of statins and antiproteinuric agents, with proteinuria remission or persistence and progression to different stages of chronic kidney disease."
    explanation: >-
      Variable response to statins in transplant recipients.
- name: Kidney transplantation
  description: >-
    Used for end-stage disease, but the disease recurs in the graft because
    the abnormal apoE circulates.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: kidney transplantation
    term:
      id: NCIT:C15265
      label: Kidney Transplantation
  evidence:
  - reference: PMID:40306438
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Herein we reported 4 cases of post-transplant recurrence of LPG in Brazilian patients, including 1 case of early relapse (in the first year following transplantation) and 3 cases of late relapse."
    explanation: >-
      Recurrence after transplantation.
- name: Glucocorticoids (ineffective)
  description: >-
    Immunosuppression, including prednisolone, does not help and was stopped
    once the diagnosis was made in the reported child.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986

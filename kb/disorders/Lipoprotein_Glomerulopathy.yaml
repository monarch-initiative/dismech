animal_models:
- name: Adenoviral APOE Sendai in Apoe-deficient mice
  species: Mouse
  genotype: Apoe-/- transduced with adenovirus expressing human APOE Sendai (Arg145Pro)
  publication: PMID:19459027
  description: >-
    Transient expression of human APOE Sendai in Apoe-deficient mice
    produces glomerular lipoprotein thrombi resembling the human lesion.
    Aged Apoe-deficient mice develop superficially similar dilated lumens that
    on special stains are not lipid-rich.
  modeled_mechanisms:
  - target: Glomerular Lipoprotein Thrombi in Dilated Capillaries
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Lipid-positive glomerular thrombi in most transduced mice.
    limitations: >-
      Expression is adenoviral and transient on an Apoe-null background, so
      the model does not reproduce heterozygous germline disease or
      progression to kidney failure.

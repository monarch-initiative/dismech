prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    No population rate has been estimated. Published PLIN4-confirmed cases come
    from two large Italian kindreds and one Italian sporadic case, three Chinese
    families and one Chinese sporadic case, and two Spanish families.
  evidence:
  - reference: PMID:40693562
    reference_title: Repeat Expansions in PLIN4 Cause Autosomal Dominant Vacuolar Myopathy With Sarcolemmal Features.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "More recently, other groups in China described three additional families and one sporadic case with an autosomal dominant vacuolar myopathy that harbor the same or other 99-mer repeat expansions"
    explanation: Counts the Chinese families reported after the Italian index kindred, supporting a cases-in-literature record with no population rate.
progression:
- phase: Presymptomatic carrier with biopsy changes
  notes: >-
    Expansion carriers can show rimmed vacuoles on biopsy before any weakness is
    detectable.
  evidence:
  - reference: PMID:37145156
    reference_title: "PLIN4-related myopathy: clinical, histological and imaging data in a large cohort of patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Their muscle biopsies revealed the presence of rimmed vacuoles despite demonstrating no detectable muscle weakness."
    explanation: Two minimally affected carriers already had rimmed vacuoles on biopsy.
- phase: Adult-onset focal weakness
  notes: >-
    Onset is between the third and seventh decade, most often with distal
    lower-limb weakness in the Italian family and with proximal lower-limb
    weakness in the Spanish and Chinese families.
  evidence:
  - reference: PMID:37145156
    reference_title: "PLIN4-related myopathy: clinical, histological and imaging data in a large cohort of patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This disease is characterized by adult presentation between the fourth and the seventh decade of life with distal lower and less frequently upper limb muscle weakness in most of the cases"
    explanation: Defines the age range and usual distal pattern of the presenting phase in the largest family.
  - reference: PMID:40693562
    reference_title: Repeat Expansions in PLIN4 Cause Autosomal Dominant Vacuolar Myopathy With Sarcolemmal Features.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients presented around the age of 30 with mild proximal weakness followed by prominent distal weakness in lower legs, eventually spreading to other muscle groups."
    explanation: Describes a proximal-then-distal onset in the Spanish families.
- phase: Slow spread and loss of ambulation
  notes: >-
    Weakness spreads slowly to scapular, pelvic and upper-limb muscles and
    reaches its maximum in the seventh decade; a large minority of patients
    become wheelchair users.
  evidence:
  - reference: PMID:37145156
    reference_title: "PLIN4-related myopathy: clinical, histological and imaging data in a large cohort of patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Disease progression is slow over the years, reaching its maximum severity within the beginning of the seventh decade of life"
    explanation: Describes the slow progression of the later phase.
  - reference: PMID:37145156
    reference_title: "PLIN4-related myopathy: clinical, histological and imaging data in a large cohort of patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, 40% of the patients were wheelchaired-bound after a mean period of around 17 years from the onset."
    explanation: Gives the proportion and timing of loss of ambulation.
inheritance:
- name: Autosomal dominant inheritance
  expressivity: VARIABLE
  description: >
    The expansion segregates as an autosomal dominant trait through multiple
    generations in the Italian, Chinese and Spanish families. Expressivity is
    variable in topography (distal versus limb-girdle onset) and severity, and
    the Spanish report notes women seem less severely affected. No penetrance
    figure is given because no source reports one; carriers with biopsy changes
    but no weakness show that clinical expression is age-dependent.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:32451610
    reference_title: Multiomic elucidation of a coding 99-mer repeat-expansion skeletal muscle disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Twenty-two individuals across four generations suffer a chromosome 19p13.3-linked autosomal dominant progressive myopathy with distinctive pathology including rimmed ubiquitin-positive autophagic vacuolation"
    explanation: Four-generation dominant segregation in the index kindred in which the PLIN4 expansion was found.
  - reference: PMID:40693562
    reference_title: Repeat Expansions in PLIN4 Cause Autosomal Dominant Vacuolar Myopathy With Sarcolemmal Features.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of note, female patients seem to be less severely affected."
    explanation: Supports variable expressivity, with an apparent sex difference in severity.
pathophysiology:
- name: PLIN4 Amphipathic Repeat Expansion
  biological_scale: MOLECULAR
  description: >
    A heterozygous in-frame expansion or duplication of the 99-nucleotide coding
    repeat of PLIN4 lengthens the amphipathic-helix domain of perilipin-4 by 6 to
    19 units of 33 amino acids (40 x 99 in the Italian index kindred, 39 and 37 x
    99 in the Spanish families, 50 units in one Chinese family, and a 14-unit
    duplication giving 45 units in an Italian sporadic case). The amphipathic
    repeats are the part of perilipin-4 that binds the lipid droplet surface.
    Loss of function is unlikely to be the mechanism, because Plin4-null mice
    have no skeletal-muscle phenotype.
  genes:
  - preferred_term: PLIN4
    term:
      id: hgnc:29393
      label: PLIN4
  molecular_functions:
  - preferred_term: lipid droplet surface binding by amphipathic helices
    term:
      id: GO:0008289
      label: lipid binding
  evidence:
  - reference: PMID:32451610
    reference_title: Multiomic elucidation of a coding 99-mer repeat-expansion skeletal muscle disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Oxford Nanopore long-read sequencing, which confirmed that the higher band is an expansion of the normal 31 × 99-nucleotide sequence to 40 × 99 bases, resulting in 297 (9 × 33) extra amino acids"
    explanation: Identifies the expansion and its in-frame protein consequence in the index kindred.
  - reference: PMID:40693562
    reference_title: Repeat Expansions in PLIN4 Cause Autosomal Dominant Vacuolar Myopathy With Sarcolemmal Features.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Targeted long-read sequencing of PLIN4 in affected individuals revealed a single expanded allele of 39 × 99 bp repeats in family 1 and of 37 × 99 bp repeats in family 2."
    explanation: Replicates the mechanism with two further expansion sizes in unrelated families.
  - reference: PMID:41624901
    reference_title: "Genetic variability in the PLIN4 gene: A new sequence duplication causing autophagic vacuolar myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the novel pathogenetic mutation characterized by a duplication of 14 repeats, producing a final protein with 45 repeats in the amphipatic region"
    explanation: Extends the allelic spectrum to a tandem duplication in a different part of the repeat region.
  - reference: PMID:42849727
    reference_title: "Reading the Lipid Code: Cooperative Domain Functions in Perilipin Targeting to Lipid Droplets."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The 11-mer amphipathic helices, often weakly hydrophobic and highly repetitive, especially in PLIN4, recognize lipid packing defects and enable dynamic, tension-responsive binding"
    explanation: Grounds the lipid-binding molecular function of the repeat domain that the expansion lengthens.
  - reference: PMID:32451610
    reference_title: Multiomic elucidation of a coding 99-mer repeat-expansion skeletal muscle disease.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    directness: INDIRECT
    snippet: "Perilipin-4 is the most abundantly expressed perilipin in muscle, notwithstanding which, aside from reduced cardiac triacylglycerol levels, its absence in mouse results in no cardiac, skeletal muscle or other impairment"
    explanation: >-
      Plin4-null mice have no muscle disease, which argues against loss of
      function and for a gain-of-function effect of the expanded protein. The
      knockout data come from earlier mouse studies the paper cites.
  downstream:
  - target: Perilipin-4 Subsarcolemmal Accumulation and Aggregation
    description: >
      The expanded protein accumulates beneath the sarcolemma and in vacuoles.
      Misfolding is the proposed link; one hypothesis is that the longer
      amphipathic domain changes lipid-droplet binding and mistargets
      perilipin-4 to the plasma membrane.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:40693562
      reference_title: Repeat Expansions in PLIN4 Cause Autosomal Dominant Vacuolar Myopathy With Sarcolemmal Features.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This would explain the increase of PLIN4 observed at the sarcolemma, likely as a result of protein misfolding and aggregation."
      explanation: Links the expansion to sarcolemmal perilipin-4 accumulation through misfolding and aggregation, stated as the authors' interpretation.
- name: Perilipin-4 Subsarcolemmal Accumulation and Aggregation
  biological_scale: CELLULAR
  description: >
    Expanded perilipin-4 accumulates in the subsarcolemmal region and within
    vacuoles of affected fibres, mainly slow-twitch type I fibres, which hold the
    most intramyocellular lipid. Lipid content itself is normal on Oil Red O
    staining, so this is a proteinopathy rather than a lipid-storage myopathy.
    The accumulation is specific: perilipin-4 is not increased in other
    vacuolar myopathies.
  cell_types:
  - preferred_term: type I skeletal muscle fiber
    term:
      id: CL:0002211
      label: type I muscle cell
  evidence:
  - reference: PMID:32451610
    reference_title: Multiomic elucidation of a coding 99-mer repeat-expansion skeletal muscle disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Immunohistochemistry with the same antibody showed a major increase in perilipin-4 positivity in subsarcolemmal regions and vacuoles of patients compared to controls."
    explanation: Shows the accumulation of perilipin-4 in patient muscle.
  - reference: PMID:32451610
    reference_title: Multiomic elucidation of a coding 99-mer repeat-expansion skeletal muscle disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These staining correlated with the diseased muscle fiber type, namely, slow-twitch Type I fibers, known to contain the highest amounts of intramyocellular lipids."
    explanation: Identifies type I fibres as the affected cell type.
  - reference: PMID:32451610
    reference_title: Multiomic elucidation of a coding 99-mer repeat-expansion skeletal muscle disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Oil Red O staining showed normal lipid content and distribution"
    explanation: Normal lipid content shows the defect is protein accumulation, not lipid storage.
  - reference: PMID:37145156
    reference_title: "PLIN4-related myopathy: clinical, histological and imaging data in a large cohort of patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "this positivity is solely present in our patients and not in other tested vacuolar myopathies such as those caused by mutations in DNAJB6, VMA21, GAA, GNE and LAMP2"
    explanation: The perilipin-4 accumulation is specific to this disease among the vacuolar myopathies tested.
  - reference: PMID:36151849
    reference_title: Subsarcolemmal and cytoplasmic p62 positivity and rimmed vacuoles are distinctive for PLIN4-myopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Moreover, we found novel myopathological features that were ultrastructural subsarcolemmal filamentous materials and membrane-bound granulofilamentous inclusions formed by the co-deposition of disrupted lipid droplets and p62 protein aggregates."
    explanation: Ultrastructure shows p62-positive protein aggregates deposited together with disrupted lipid droplets.
  downstream:
  - target: Sustained Aggrephagy Activation
    description: >
      Ubiquitinated perilipin-4 aggregates recruit the aggrephagy receptors
      p62/SQSTM1 and NBR1, and the scaffold WDFY3.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:32451610
      reference_title: Multiomic elucidation of a coding 99-mer repeat-expansion skeletal muscle disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The present disease is characterized by dominantly inherited progressively increasing mobilization of aggrephagy at sites of progressive accumulation of a mutated protein, suggesting that the mutation is leading to aggregation, likely through misfolding, exceeding aggrephagic capacity."
      explanation: Places aggrephagy mobilization at the sites where the mutant protein accumulates.
- name: Sustained Aggrephagy Activation
  biological_scale: CELLULAR
  description: >
    The aggrephagy machinery is upregulated and co-localizes with perilipin-4 at
    the sarcolemma and in vacuoles: ubiquitinated proteins (FK2), p62/SQSTM1,
    NBR1 and WDFY3, with increased LC3 and lysosomal markers at the vacuoles.
    The number of positive fibres rises with clinical severity. The proposed
    failure is that aggregate load exceeds aggrephagic capacity.
  biological_processes:
  - preferred_term: aggrephagy
    modifier: INCREASED
    term:
      id: GO:0035973
      label: aggrephagy
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  evidence:
  - reference: PMID:32451610
    reference_title: Multiomic elucidation of a coding 99-mer repeat-expansion skeletal muscle disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Aggrephagy pathway components beyond FK2 and p62/SQSTM1, namely, NBR1 and WDFY3, were upregulated"
    explanation: Shows upregulation of the aggrephagy pathway in patient muscle.
  - reference: PMID:32451610
    reference_title: Multiomic elucidation of a coding 99-mer repeat-expansion skeletal muscle disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The number of stained fibers correlated with clinical severity"
    explanation: The load of FK2- and p62-positive fibres tracks disease severity.
  - reference: PMID:40693562
    reference_title: Repeat Expansions in PLIN4 Cause Autosomal Dominant Vacuolar Myopathy With Sarcolemmal Features.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "p62 and NBR1 co-localized with PLIN4 at the sarcolemma and vacuoles. LC3 immunoreactivity and other lysosomal markers were increased at the vacuoles."
    explanation: Replicates the aggrephagy and autophagosome-lysosome marker pattern in two unrelated families.
  downstream:
  - target: Rimmed Autophagic Vacuole Formation
    description: >
      Continuous formation and fusion of failing aggrephagic vesicles produces
      progressively larger autophagic vacuoles.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:32451610
      reference_title: Multiomic elucidation of a coding 99-mer repeat-expansion skeletal muscle disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Continuous formation and fusion of failing aggrephagic vesicles possibly leads to ever larger vacuoles, which disrupt the organization of myofibers and alter their contractile abilities, resulting in atrophy."
      explanation: States the proposed step from failing aggrephagy to vacuole formation; the authors hedge it with "possibly".
- name: Rimmed Autophagic Vacuole Formation
  biological_scale: CELLULAR
  description: >
    Rimmed vacuoles form beneath the sarcolemma and within the sarcoplasm. They
    are lined by sarcolemmal markers (dystrophin, caveolin-3, laminin alpha2)
    and acetylcholinesterase activity, placing the disease among the autophagic
    vacuolar myopathies with sarcolemmal features, and contain membranous
    bodies and granular debris.
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  evidence:
  - reference: PMID:40693562
    reference_title: Repeat Expansions in PLIN4 Cause Autosomal Dominant Vacuolar Myopathy With Sarcolemmal Features.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Muscle biopsies showed unique pathological features characterized by numerous rimmed vacuoles that displayed sarcolemmal features and were located beneath the sarcolemma and within the cytoplasm."
    explanation: Describes the vacuoles and their sarcolemmal features.
  downstream:
  - target: Myofiber Disorganization and Atrophy
    description: >
      Enlarging vacuoles disrupt myofibre organization and contractility,
      leading to atrophy.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:32451610
      reference_title: Multiomic elucidation of a coding 99-mer repeat-expansion skeletal muscle disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Continuous formation and fusion of failing aggrephagic vesicles possibly leads to ever larger vacuoles, which disrupt the organization of myofibers and alter their contractile abilities, resulting in atrophy."
      explanation: States that the vacuoles disrupt myofibre organization and lead to atrophy.
  - target: Rimmed vacuoles
- name: Myofiber Disorganization and Atrophy
  biological_scale: TISSUE
  description: >
    Affected muscles show fibre size variation, internal nuclei and
    progressive fatty replacement, with a selective pattern on
    MRI. Increased MHC class I and membrane attack complex deposition with minor
    inflammatory infiltrates are reported and are thought to be secondary.
  biological_processes:
  - preferred_term: skeletal muscle atrophy
    modifier: INCREASED
    term:
      id: GO:0014732
      label: skeletal muscle atrophy
  evidence:
  - reference: PMID:36151849
    reference_title: Subsarcolemmal and cytoplasmic p62 positivity and rimmed vacuoles are distinctive for PLIN4-myopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "revealed myopathic changes characterized by RVs, mild fiber size variation, and internal nucleation"
    explanation: Documents the myopathic tissue changes accompanying the vacuoles.
  - reference: PMID:36151849
    reference_title: Subsarcolemmal and cytoplasmic p62 positivity and rimmed vacuoles are distinctive for PLIN4-myopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Increased MHC-I expression and membrane attack complex (MAC) deposition were also observed in all patients with minor inflammatory infiltrates"
    explanation: Records the secondary inflammatory changes in the tissue.
  downstream:

genetic:
- name: PLIN4
  relationship_type: CAUSATIVE
  notes: >
    PLIN4 encodes perilipin-4, a lipid-droplet coat protein that is the most
    abundant perilipin in skeletal muscle and sits beneath the sarcolemma. Its
    amphipathic domain is encoded by about 31 tandem 99-nucleotide repeats in a
    single exon (numbered exon 3 or exon 5 depending on transcript). All
    reported disease alleles are heterozygous in-frame expansions or
    duplications of this repeat. Standard short-read exome and genome
    sequencing does not size the repeat, so the variant is easily missed; an
    unusually high read depth over the repeat exon is a clue. No ClinGen
    gene-disease validity assertion exists for PLIN4.
  gene_term:
    preferred_term: PLIN4
    term:
      id: hgnc:29393
      label: PLIN4
  evidence:
  - reference: PMID:32451610
    reference_title: Multiomic elucidation of a coding 99-mer repeat-expansion skeletal muscle disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Oxford Nanopore long-read sequencing, which confirmed that the higher band is an expansion of the normal 31 × 99-nucleotide sequence to 40 × 99 bases, resulting in 297 (9 × 33) extra amino acids"
    explanation: Discovery of the PLIN4 expansion in the index kindred.
  - reference: PMID:36151849
    reference_title: Subsarcolemmal and cytoplasmic p62 positivity and rimmed vacuoles are distinctive for PLIN4-myopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole-exome sequencing of F-II7, F-III3, and Patient S in 2019 revealed negative results."
    explanation: Exome sequencing missed the expansion in the Chinese patients.
  - reference: PMID:40693562
    reference_title: Repeat Expansions in PLIN4 Cause Autosomal Dominant Vacuolar Myopathy With Sarcolemmal Features.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In skeletal muscle, perilipin 4 is normally located beneath the sarcolemma where it is thought to bind to lipid droplets (LD), but its role in muscle tissue is not completely understood"
    explanation: Normal location and presumed lipid-droplet function of perilipin-4 in muscle.
  - reference: PMID:41624901
    reference_title: "Genetic variability in the PLIN4 gene: A new sequence duplication causing autophagic vacuolar myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Interestingly, one of these families with a longer expansion of the same repeat (19 additional repeats, 50 repeats in total) was associated with a more severe phenotype and an earlier presentation."
    explanation: Reports the 50-unit allele found in a Chinese family and its more severe course, as summarized from the earlier report.
  - reference: PMID:40693562
    reference_title: Repeat Expansions in PLIN4 Cause Autosomal Dominant Vacuolar Myopathy With Sarcolemmal Features.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No correlation between the size of the expansion and clinical severity can be clearly established."
    explanation: Across the reported families, expansion size does not clearly predict severity.

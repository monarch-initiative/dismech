discussions:
- discussion_id: vnm_1999_family_plin4_status
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >
    Does the original 1999 Italian "vacuolar neuromyopathy" family, which gave
    the disease its name, carry a PLIN4 expansion?
  attaches_to:
  - disease#Vacuolar Neuromyopathy
  - genetic#PLIN4
  rationale: >
    Two Italian kindreds were linked to 19p13.3: the 1999 family described as a
    vacuolar neuromyopathy (ten affected, mixed neurogenic and myopathic EMG,
    dysphonia, dysphagia, areflexia) and a second kindred described in 2004, in
    which the PLIN4 expansion was later found. No publication found here
    reports PLIN4 testing in the 1999 family. Its bulbar features (dysphonia
    and dysphagia) are therefore not attributed to PLIN4 in this entry; they are
    absent in the PLIN4-confirmed Chinese patients. Areflexia and mixed
    neurogenic-myogenic EMG have since been seen in PLIN4-confirmed patients
    (Chinese and Spanish respectively), which makes a shared cause plausible but
    not shown.
  evidence:
  - reference: PMID:10489050
    reference_title: A distinctive autosomal dominant vacuolar neuromyopathy linked to 19p13.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The disease was characterized by onset from the late teens to early 50s with distal leg weakness and atrophy, development of generalized muscle weakness with distal-to-proximal progression sparing facial and ocular muscles, dysphonia and dysphagia, pes cavus and areflexia, variable clinical expression ranging from subclinical myopathy to severely disabling weakness, and mixed neurogenic and myopathic abnormalities on electromyography."
    explanation: Phenotype of the original vacuolar neuromyopathy family, including features not seen in the PLIN4 cohorts.
  - reference: PMID:11039585
    reference_title: Fine mapping of a distinctive autosomal dominant vacuolar neuromyopathy using 11 novel microsatellite markers from chromosome band 19p13.3.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We now report the fine mapping of the disease locus within an interval of 250 Kb by haplotype analysis performed using a set of 11 novel microsatellite markers isolated from the candidate region."
    explanation: The 1999 family's locus was narrowed on 19p13.3, but no gene was reported.
  - reference: PMID:15236412
    reference_title: Abnormal lysosomal and ubiquitin-proteasome pathways in 19p13.3 distal myopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe a second large Italian kindred with autosomal dominant vacuolar myopathy characterized by variable severity, adult-onset weakness of distal limb muscles, and no cardiac involvement."
    explanation: The 2004 kindred is described as a second family, distinct from the 1999 one.
  - reference: PMID:40693562
    reference_title: Repeat Expansions in PLIN4 Cause Autosomal Dominant Vacuolar Myopathy With Sarcolemmal Features.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Interestingly, we observed mixed neurogenic-myogenic features on electromyography in most of the patients"
    explanation: Mixed EMG patterns also occur in PLIN4-confirmed patients, so this feature does not separate the two families.
  - reference: PMID:36151849
    reference_title: Subsarcolemmal and cytoplasmic p62 positivity and rimmed vacuoles are distinctive for PLIN4-myopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Deep tendon reflexes | Absent | Absent | Brisk | Absent"
    explanation: Areflexia also occurs in PLIN4-confirmed patients, so it does not separate the two families either.
- discussion_id: plin4_expansion_model_gap
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >
    How does lengthening the perilipin-4 amphipathic domain cause it to
    aggregate at the sarcolemma, and can an expansion model reproduce the
    disease?
  attaches_to:
  - pathophysiology#PLIN4 Amphipathic Repeat Expansion
  - pathophysiology#Perilipin-4 Subsarcolemmal Accumulation and Aggregation
  rationale: >
    The causal step from expansion to aggregation is inferred from patient
    biopsies. One proposal is that the longer, more hydrophobic amphipathic
    domain changes lipid-droplet binding and mistargets perilipin-4 to cellular
    membranes. The Plin4 knockout mouse has no muscle phenotype, which argues
    against loss of function but leaves the gain-of-function mechanism untested;
    no expansion knock-in or patient-derived muscle cell model has been
    reported.
  evidence:
  - reference: PMID:40693562
    reference_title: Repeat Expansions in PLIN4 Cause Autosomal Dominant Vacuolar Myopathy With Sarcolemmal Features.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This would explain the increase of PLIN4 observed at the sarcolemma, likely as a result of protein misfolding and aggregation."
    explanation: The misfolding and aggregation step is proposed, not demonstrated.
notes: >
  No GeneReviews chapter exists for this disease (just check-genereviews
  --online returned NO_CHAPTER). The OMIM entry for this MONDO term is 601846;
  the separate MONDO:0014945 "myopathy, distal, with rimmed vacuoles" is the
  SQSTM1-related disease (OMIM:617158) and is not this entry. Cardiac
  involvement has not been found in any reported family apart from late atrial
  fibrillation without cardiomyopathy in one Italian patient. No
  disease-specific treatment or trial exists. PMID:35499779 (Chinese families,
  including the 50-unit allele) was fetched with no quotable text, so its
  findings are cited through later papers that summarize them.

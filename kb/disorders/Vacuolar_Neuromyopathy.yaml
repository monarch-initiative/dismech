  - target: Proximal muscle weakness
  - target: Neck flexor weakness
  - target: Fatty replacement of skeletal muscle
  - target: Increased variability in muscle fiber diameter
  - target: Centrally nucleated skeletal muscle fibers
  - target: Ankle contracture
  - target: Loss of ambulation
  - target: Restrictive ventilatory defect

    explanation: Recommends hearing surveillance in at-risk children.
animal_models:
- name: Nog heterozygous mouse
  species: Mouse
  genotype: Nog+/-
  publication: PMID:18096605
  description: >-
    Depending on genetic background, heterozygous null mice show mild conductive
    hearing loss from an ectopic bone bridge fixing the stapes, and carpal and
    tarsal fusions.
  modeled_mechanisms:
  - target: Stapes Fixation to the Otic Capsule
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    limitations: >-
      The penetrance of the hearing loss depends on genetic background, and the
      mouse bone bridge joins the stapes to the posterior wall of the tympanum,
      whereas the one human temporal bone showed calcified cartilage across the
      stapedovestibular joint.
    evidence:
    - reference: PMID:18096605
      reference_title: "Noggin heterozygous mice: an animal model for congenital conductive hearing loss in humans."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "More importantly, these results establish Nog(+/-) mice as the first animal model for the study of conductive rather than neurosensory hearing loss that has direct relevance to human genetic disorders."
      explanation: Positions the heterozygous mouse as a model of NOG-related conductive hearing loss.
  - target: Failure of Joint Interzone Formation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    limitations: >-
      Heterozygous mice show carpal and tarsal fusions but are otherwise
      described as largely normal; the proximal symphalangism that defines the
      human disease is not reported in them.
    evidence:
    - reference: PMID:16598734
      reference_title: The Noggin null mouse phenotype is strain dependent and haploinsufficiency leads to skeletal defects.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "we have discovered Noggin haploinsufficiency leading to carpal and tarsal fusions reminiscent of some phenotypes reported for NOGGIN haploinsufficiency in humans."
      explanation: Halving Nog dose in mice reproduces the carpal and tarsal fusions.

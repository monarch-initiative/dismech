diagnosis:
- name: Clinical-radiographic and molecular diagnosis
  description: >-
    Suspect NOG-SSD in a person with conductive hearing loss and proximal
    symphalangism, carpal or tarsal coalition, broad thumbs or hyperopia,
    especially with a dominant family history. Hand and foot radiographs show
    the fusions. Confirmation is by NOG sequencing or by detecting a 17q22
    deletion. Genetic testing separates syndromic stapes ankylosis from
    otosclerosis, which it can closely resemble, and even mild skeletal
    findings should prompt testing.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:22288654
    reference_title: "Mutations in the NOG gene are commonly found in congenital stapes ankylosis with symphalangism, but not in otosclerosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "None of the otosclerosis patients without symphalangism had NOG mutations, indicating that NOG mutations may be restrictively found within patients with various skeletal abnormalities."
    explanation: NOG variants were absent from 33 otosclerosis patients without symphalangism.
  - reference: PMID:22288654
    reference_title: "Mutations in the NOG gene are commonly found in congenital stapes ankylosis with symphalangism, but not in otosclerosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Molecular genetic testing is useful to differentiate syndromic stapes ankylosis from otosclerosis, and even mild skeletal anomalies can be a diagnostic indicator of NOG-associated disease."
    explanation: Recommends genetic testing to separate NOG-SSD from otosclerosis.
  - reference: PMID:25815513
    reference_title: "A 1.6-Mb microdeletion in chromosome 17q22 leads to NOG-related symphalangism spectrum disorder without intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "genomic deletions in chromosome 17q22 should be screened in the NOG-SSD patients in which no pathogenic mutation is identified by conventional sequencing methods"
    explanation: Supports deletion testing when sequencing is negative.
treatments:
- name: Stapes Surgery
  description: >-
    Stapedotomy or stapedectomy for conductive hearing loss. Hearing improves,
    and in one family the improvement lasted for decades without re-fixation,
    although other reports describe hearing declining again from bone regrowth
    two to five years after surgery. In the one NOG-SSD temporal bone measured,
    the distance from the incus to the footplate was longer than in
    otosclerosis, so surgeons are advised to have longer prostheses available.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: stapes surgery
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_phenotypes:
  - preferred_term: Conductive hearing impairment
    term:
      id: HP:0000405
      label: Conductive hearing impairment
  target_mechanisms:
  - target: Stapes Fixation to the Otic Capsule
  evidence:
  - reference: PMID:29605356
    reference_title: "Autosomal dominant stapes fixation, syndactyly, and symphalangism in a family with NOG mutation: Long term follow-up on surgical treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this family, surgery with stapedectomy had lasting effect without renewed fixation of the stapes in a follow up period of 18 months-38 years."
    explanation: Long-term durability of stapedectomy in a NOG family.
  - reference: PMID:33588412
    reference_title: "Is the Conductive Hearing Loss in NOG-Related Symphalangism Spectrum Disorder Congenital?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Stapes surgery was performed, and his post-operative hearing threshold improved to normal in both ears."
    explanation: Hearing returned to normal after stapes surgery in an SABTT patient.
  - reference: PMID:22288654
    reference_title: "Mutations in the NOG gene are commonly found in congenital stapes ankylosis with symphalangism, but not in otosclerosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "most of the patients in these three families with NOG mutations showed remarkable air-bone gap recovery after stapes surgery"
    explanation: Surgical benefit across three NOG families.
  - reference: PMID:34049328
    reference_title: "Genetic Heterogeneity and Core Clinical Features of NOG-Related-Symphalangism Spectrum Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Based on temporal bone findings, we recommend that surgeons obtain longer stapes prostheses before stapes surgery in individuals with NOG-SSD stapes ankylosis."
    explanation: A surgical consideration specific to NOG-SSD.
  - reference: PMID:33308208
    reference_title: "Genetic and clinical phenotypic analysis of familial stapes sclerosis caused by an NOG mutation."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Some reports describe progressive hearing loss due to bone regrowth 2-5 years after surgery."
    explanation: Other reports describe hearing declining again from bone regrowth a few years after surgery, which qualifies the claim that the benefit lasts.

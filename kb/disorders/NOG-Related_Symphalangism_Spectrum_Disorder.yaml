name: NOG-Related Symphalangism Spectrum Disorder
synonyms:
- NOG-SSD
- NOG-related symphalangism spectrum disorder
- noggin-related symphalangism spectrum disorder
creation_date: "2026-10-14T00:00:00Z"
category: Mendelian
description: >-
  NOG-related symphalangism spectrum disorder (NOG-SSD) is the autosomal dominant
  disorder of joint formation caused by heterozygous loss-of-function variants in
  NOG, which encodes noggin, a secreted antagonist of bone morphogenetic proteins
  (BMPs). Its hallmark is proximal symphalangism, bony fusion of the proximal
  interphalangeal joints. Conductive hearing loss from stapes ankylosis,
  hyperopia, carpal and tarsal coalitions, broad thumbs and great toes, and a
  hemicylindrical nose are frequent but inconsistent. Five syndromes once
  described separately, all later traced to NOG, form one spectrum: proximal
  symphalangism (SYM1A), multiple synostoses syndrome 1 (SYNS1), stapes ankylosis
  with broad thumbs and toes (SABTT), tarsal-carpal coalition syndrome (TCC) and
  brachydactyly type B2 (BDB2). Expression varies within families that carry the
  same variant. Without enough noggin, BMP signalling at the sites of future
  joints goes unopposed, so the joint interzone fails to form and adjacent
  skeletal elements, including the stapes footplate and the otic capsule, stay
  fused.
disease_term:
  preferred_term: NOG-related symphalangism spectrum disorder
  term:
    id: MONDO:0100521
    label: NOG-related symphalangism spectrum disorder
parents:
- Joint Disorders
- Limb Development Disorders
notes: >-
  No GeneReviews chapter exists for this disorder: a PubMed search for
  "symphalangism[TI] AND genereviews[book]" returns nothing, and no title in
  cache/bookshelf/genereviews.csv names symphalangism, synostoses, stapes
  ankylosis or NOG. The single-spectrum term comes from the Potti et al. 2011
  review (PMID:21538686), and ClinGen adopted it when it merged the five MIM
  phenotypes into MONDO:0100521. A small 17q22 deletion that removes NOG
  produces a phenotype comparable to a NOG point variant and is in scope here.
  The larger 17q22 microdeletion syndromes, which add intellectual disability
  and other anomalies from neighbouring genes, are a differential diagnosis.
inheritance:
- name: Autosomal Dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  expressivity: VARIABLE
  description: >-
    Heterozygous NOG variants segregate dominantly. Expression varies widely
    within and between families, including among relatives who carry the same
    variant, which is why the five historical syndromes are treated as one
    spectrum. Penetrance is reported as complete in at least one family. De
    novo variants occur, and recurrence in two brothers of unaffected parents
    points to parental gonadal or low-level somatic mosaicism.
  evidence:
  - reference: PMID:10080184
    reference_title: "Heterozygous mutations in the gene encoding noggin affect human joint morphogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We have identified five dominant human NOG mutations in unrelated families segregating proximal symphalangism (SYM1; OMIM 185800) and a de novo mutation in a patient with unaffected parents."
    explanation: Establishes dominant segregation of heterozygous NOG variants and the occurrence of de novo variants.
  - reference: PMID:21538686
    reference_title: "A comprehensive review of reported heritable noggin-associated syndromes and proposed clinical utility of one broadly inclusive diagnostic term: NOG-related-symphalangism spectrum disorder (NOG-SSD)."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Due to the variable phenotypic spectrum within families and among families with the same mutation, we propose a unifying term, NOG-related symphalangism spectrum disorder (NOG-SSD)"
    explanation: Documents variable expressivity within families and among families carrying the same variant.
  - reference: PMID:26474326
    reference_title: "Temporal Bone Histopathology in NOG-Symphalangism Spectrum Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "inherited in an autosomal dominant pattern with complete penetrance"
    explanation: Complete penetrance in one NOG-SSD family.
  - reference: PMID:15736221
    reference_title: Carpal and tarsal synostoses and transverse reduction defects of the toes in two brothers heterozygous for a double de novo NOGGIN mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This indicates the presence of gonadal mosaicism or a low level of somatic mosaicism in one of the parents."
    explanation: Recurrence in siblings of unaffected parents implies parental mosaicism.

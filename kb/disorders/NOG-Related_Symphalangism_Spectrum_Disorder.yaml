    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "According to hearing test results, the stapes ankylosis in our SABTT patient seemed to be incomplete at birth and progressive in early childhood."
    explanation: Single-patient report that stapes ankylosis was incomplete at birth and progressed in early childhood.
discussions:
- discussion_id: nog_heterozygous_mouse_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Why does loss of one NOG copy fuse the proximal interphalangeal joints in
    humans, while Nog+/- mice show carpal and tarsal fusion and conductive
    hearing loss only on some genetic backgrounds, with no proximal
    symphalangism reported?
  attaches_to:
  - pathophysiology#Failure of Joint Interzone Formation
  - animal_models#Nog heterozygous mouse
  rationale: >-
    The human disorder is dominant and the core mechanism is haploinsufficiency,
    so the heterozygous mouse is the genotype-matched model. Its phenotype
    depends on strain. On the first background studied, heterozygotes were
    described as normal. After the null allele was crossed into outbred CD1 and
    inbred DBA1 and C57BL/6 strains, heterozygotes showed carpal and tarsal
    fusions, and on some backgrounds a mild conductive hearing loss from a
    stapes bone bridge. The abstracts describing these mice do not report
    fusion of the digit joints, which is the defining human feature. The null
    allele is lethal at 18.5 dpc with multiple joint fusions, so the mouse joint
    still depends on noggin; what differs is how much loss each joint
    tolerates. The papers that identified the human variants and tested their
    effect on noggin secretion both concluded that noggin dosage requirements
    differ between species and between joints. Strain-dependent
    modifiers in the mouse, and the variable expressivity seen among human
    relatives who carry the same NOG variant, may reflect the same kind of
    genetic modification. Until that is tested, a normal mouse joint is not
    evidence against a dosage mechanism in a human joint.
  evidence:
  - reference: PMID:10080184
    reference_title: "Heterozygous mutations in the gene encoding noggin affect human joint morphogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "suggest that NOG requirements during skeletogenesis differ between species and between specific skeletal elements within species."
    explanation: >-
      The paper that first tied heterozygous NOG variants to proximal
      symphalangism and multiple synostoses concludes that the amount of
      noggin a skeletal element needs differs between humans and mice and
      between elements, which is the question this discussion records.
  - reference: PMID:11562478
    reference_title: "Human disease-causing NOG missense mutations: effects on noggin secretion, dimer formation, and bone morphogenetic protein binding."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: "In mice, a complete loss of noggin protein leads to multiple malformations including joint fusion, whereas mice heterozygous for Nog loss-of-function mutations are normal."
    explanation: >-
      States the mismatch in its original form: humans with one faulty copy
      have joint fusions, while heterozygous mice were reported as normal. The
      sentence summarizes earlier mouse work in the paper's introduction.
  - reference: PMID:11562478
    reference_title: "Human disease-causing NOG missense mutations: effects on noggin secretion, dimer formation, and bone morphogenetic protein binding."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: PRIMARY_RESULT
    snippet: "Therefore, we conclude that noggin has both species-specific and joint-specific dosage-dependent roles during joint formation."
    explanation: >-
      The authors' own conclusion from comparing hypomorphic human alleles with
      the heterozygous mouse: the dose of noggin a joint needs differs between
      species and between joints. Graded OTHER because it is an inference
      across human genetics, cell experiments and mouse data rather than a
      measurement of one kind.
  - reference: PMID:16598734
    reference_title: The Noggin null mouse phenotype is strain dependent and haploinsufficiency leads to skeletal defects.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: "The null allele was lethal at 18.5 dpc and resulted in severe hyperplasia of the cartilage together with multiple joint fusions."
    explanation: >-
      Describes the original Nog-null mouse on the inbred 129X1/SvJ background,
      not the heterozygote. Shows that complete loss does fuse mouse joints, so
      the mismatch concerns the dosage threshold rather than whether the mouse
      joint needs noggin at all.
  - reference: PMID:16598734
    reference_title: The Noggin null mouse phenotype is strain dependent and haploinsufficiency leads to skeletal defects.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "we have discovered Noggin haploinsufficiency leading to carpal and tarsal fusions reminiscent of some phenotypes reported for NOGGIN haploinsufficiency in humans."
    explanation: >-
      After crossing onto other strains, heterozygotes develop carpal and
      tarsal fusions. The authors call these reminiscent of some human
      phenotypes, which is a partial match that does not include the digit
      joints.
  - reference: PMID:18096605
    reference_title: "Noggin heterozygous mice: an animal model for congenital conductive hearing loss in humans."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Depending on the genetic background, some of the Nog(+/-) mice display mild hearing loss, that is, conductive in nature."
    explanation: >-
      The conductive hearing loss in heterozygous mice is mild, incompletely
      penetrant and background-dependent, a second sign that strain modifiers
      shape the heterozygous phenotype.
  proposed_experiments:
  - experiment_id: exp_nog_dosage_series_across_strains
    experiment_design: TARGETED_PERTURBATION
    name: Nog dosage series across inbred mouse backgrounds, scored at the digit joints
    description: >-
      Place a graded series of Nog alleles (heterozygous null, hypomorphic, and
      limb-mesenchyme conditional heterozygous or compound alleles) on several
      inbred backgrounds. Score the proximal interphalangeal joints as well as
      the carpus, tarsus and stapes, using Gdf5 interzone expression at the
      time of joint specification and skeletal preparations after birth.
      Measure noggin protein and BMP pathway activity (phospho-SMAD1/5/9) in
      the digit rays, and map any background that changes digit-joint
      outcome.
    would_support:
    - pathophysiology#Failure of Joint Interzone Formation
    supporting_outcome:
    - >-
      Some background, or an allele slightly below 50% function, fuses the
      proximal interphalangeal joints with loss of Gdf5 interzone expression.
      That would show the mouse digit joint follows the same dosage mechanism
      as the human one, with a threshold set by modifiers.
    refuting_outcome:
    - >-
      No background or allele short of near-complete loss fuses the digit
      joints, even where carpal and tarsal fusions appear. That would point to
      a species difference in how the digit joint is specified or buffered,
      such as other BMP antagonists, rather than a modifier effect.
  - experiment_id: exp_nog_human_mouse_digit_joint_comparison
    experiment_design: DESCRIPTIVE_PROFILING
    name: Comparison of NOG and other BMP antagonist expression at human and mouse digit joints
    description: >-
      Compare NOG expression and that of other BMP antagonists (for example
      GREM1 and CHRD) in the developing proximal interphalangeal interzone of
      human fetal limb tissue and of mouse limbs at the matching stage, by
      single-cell or spatial transcriptomics. Repeat in human iPSC-derived
      limb-bud mesenchyme or chondrogenic cultures with one NOG copy
      inactivated, reading out BMP pathway activity and interzone markers.
    would_support:
    - pathophysiology#Unopposed BMP Signaling at Prospective Joint Sites
    supporting_outcome:
    - >-
      Human digit interzones rely more on NOG, with less expression of other
      BMP antagonists, than mouse interzones do, and heterozygous human cells
      show raised BMP pathway activity. That would explain why halving NOG is
      enough to fuse human but not mouse digit joints.
    refuting_outcome:
    - >-
      Antagonist expression is similar in the two species and heterozygous
      human cells show no change in BMP pathway activity. That would leave the
      species difference unexplained at the level of BMP antagonism.

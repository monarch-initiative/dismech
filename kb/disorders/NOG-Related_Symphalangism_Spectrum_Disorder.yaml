genetic:
- name: NOG
  gene_term:
    preferred_term: NOG
    term:
      id: hgnc:7866
      label: NOG
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Missense, nonsense and frameshift variants and whole-gene deletions are all
    reported. Heterozygous loss of function is the established mechanism. The
    BDB2 missense variants are the exception: they appear to change noggin's
    binding to BMPs and GDFs rather than abolish its activity.

- name: SYNS1
  display_name: Multiple synostoses syndrome 1
  curated_in: Multiple_Synostoses_Syndrome
  description: >-
    The more extensive form of the spectrum: proximal symphalangism with
    carpal, tarsal, humeroradial and vertebral fusions and conductive hearing
    loss. Curated in full in Multiple_Synostoses_Syndrome, which covers all
    four multiple synostoses genes (NOG, GDF5, FGF9 and GDF6). That entry's
    disease term is the broader multiple synostoses syndrome (MONDO:0017923),
    and it maps SYNS1 (MONDO:0008519) as a narrower match.
  evidence:
  - reference: PMID:10080184
    reference_title: "Heterozygous mutations in the gene encoding noggin affect human joint morphogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We also found a dominant NOG mutation in a family segregating multiple synostoses syndrome (SYNS1; OMIM 186500); both SYM1 and SYNS1 have multiple joint fusion as their principal feature."
    explanation: Places NOG-caused SYNS1 in the same multiple-joint-fusion spectrum as SYM1.
- name: SABTT
  display_name: Stapes ankylosis with broad thumbs and toes
  subtype_term:
    preferred_term: stapes ankylosis with broad thumbs and toes
    term:
      id: MONDO:0008484
      label: stapes ankylosis with broad thumbs and toes
  description: >-
    Congenital or early-onset stapes ankylosis with hyperopia, a hemicylindrical
    nose, and broad thumbs and great toes, and sometimes without symphalangism.
    Includes Teunissen-Cremers syndrome. The variants reported in the defining
    families truncate or disrupt the cysteine-rich C-terminal domain.
  evidence:
  - reference: PMID:12089654
    reference_title: "Autosomal dominant stapes ankylosis with broad thumbs and toes, hyperopia, and skeletal anomalies is caused by heterozygous nonsense and frameshift mutations in NOG, the gene encoding noggin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast to most NOG mutations that have been reported in kindreds with SYM1 and SYNS1, the mutations observed in these families with stapes ankylosis without symphalangism are predicted to disrupt the cysteine-rich C-terminal domain."
    explanation: Defines the SABTT presentation and the variant class reported in its founding families.
- name: TCC
  display_name: Tarsal-carpal coalition syndrome
  subtype_term:
    preferred_term: tarsal-carpal coalition syndrome
    term:
      id: MONDO:0008521
      label: tarsal-carpal coalition syndrome
  description: >-
    Carpal and tarsal coalitions as the dominant feature, with variable
    symphalangism and toe anomalies.
  evidence:
  - reference: PMID:29159868
    reference_title: "Tarsal-carpal coalition syndrome: Report of a novel missense mutation in NOG gene and phenotypic delineation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sanger sequencing revealed a novel heterozygous missense mutation in NOG gene (NM_005450.4:c.611G>A) in all the affected individuals of the family."
    explanation: A NOG variant segregates with tarsal-carpal coalition syndrome in a dominant family.
  - reference: PMID:15736221
    reference_title: Carpal and tarsal synostoses and transverse reduction defects of the toes in two brothers heterozygous for a double de novo NOGGIN mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe two siblings with carpal and tarsal synostoses associated with transverse deficiencies of the toes."
    explanation: Carpal and tarsal synostoses with toe anomalies as the presenting features in NOG variant carriers.
- name: BDB2
  display_name: Brachydactyly type B2
  curated_in: Brachydactyly_Type_B2
  subtype_term:
    preferred_term: brachydactyly type B2
    term:
      id: MONDO:0012658
      label: brachydactyly type B2
  description: >-
    Terminal deficiency of fingers and toes II-V together with proximal
    symphalangism and carpal synostosis. Curated in full in
    Brachydactyly_Type_B2. The BDB2 missense variants do not appear to cause a
    major loss of noggin function, so this stratum departs most from the
    haploinsufficiency mechanism described below.
  evidence:
  - reference: PMID:17668388
    reference_title: "A new subtype of brachydactyly type B caused by point mutations in the bone morphogenetic protein antagonist NOGGIN."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In a subset of ROR2-negative patients with BDB, clinically defined by the additional occurrence of proximal symphalangism and carpal synostosis, we identified six different point mutations (P35A, P35S, A36P, E48K, R167G, and P187S) in the bone morphogenetic protein (BMP) antagonist NOGGIN (NOG)."
    explanation: Defines BDB2 and its NOG point mutations.
pathophysiology:
- name: NOG Loss of Function
  description: >-
    Heterozygous NOG variants reduce the amount of functional noggin. Truncating
    variants act as null alleles, and the missense variants tested reduce or
    abolish secretion of functional dimeric noggin without interfering with the
    wild-type protein. NOG is a single-exon gene, and heterozygous null mice
    develop carpal and tarsal fusions and stapes fixation, depending on strain,
    so haploinsufficiency is the core mechanism. Variants in the heparin-binding
    site, and the BDB2 missense variants, alter how noggin binds rather than how
    much is secreted.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: NOG
    term:
      id: hgnc:7866
      label: NOG
  molecular_functions:
  - preferred_term: BMP binding
    term:
      id: GO:0036122
      label: BMP binding
    modifier: DECREASED
  evidence:
  - reference: PMID:16598734
    reference_title: The Noggin null mouse phenotype is strain dependent and haploinsufficiency leads to skeletal defects.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: "Noggin is a secreted peptide that binds and inactivates Bone Morphogenetic Proteins, members of the transforming growth factor beta superfamily of secreted signaling molecules."
    explanation: States noggin's molecular function, BMP binding, which variants that reduce the amount of secreted noggin diminish.
  - reference: PMID:11562478
    reference_title: "Human disease-causing NOG missense mutations: effects on noggin secretion, dimer formation, and bone morphogenetic protein binding."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These data indicate that the human disease-causing mutations are hypomorphic alleles that reduce secretion of functional dimeric noggin."
    explanation: Shows that disease-causing missense variants are hypomorphic and reduce secretion of functional noggin.
  - reference: PMID:11562478
    reference_title: "Human disease-causing NOG missense mutations: effects on noggin secretion, dimer formation, and bone morphogenetic protein binding."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Coexpression of mutant noggin with wild-type noggin, to resemble the heterozygous state, did not interfere with wild-type noggin secretion."
    explanation: Argues against a dominant-negative mechanism for these variants.
  - reference: PMID:18096605
    reference_title: "Noggin heterozygous mice: an animal model for congenital conductive hearing loss in humans."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Since Noggin is a single exon gene, this data strongly suggest that the autosomal dominant disorders associated with NOG mutations are due to haploinsufficiency of NOGGIN."
    explanation: Heterozygous null mice reproduce the conductive hearing loss, supporting haploinsufficiency.
  downstream:
  - target: Unopposed BMP Signaling at Prospective Joint Sites
    causal_link_type: DIRECT
    description: Less noggin leaves BMP ligands free to signal where noggin would normally antagonize them.
    evidence:
    - reference: PMID:18096605
      reference_title: "Noggin heterozygous mice: an animal model for congenital conductive hearing loss in humans."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "This failure of bone separation in the Nog(+/-) mice reveals another consequence of chondrocyte hyperplasia due to unopposed Bmp activities in these mutants such as Bmp4 and Bmp14 (Gdf5)."
      explanation: In heterozygous null mice, halving noggin dose is enough to leave BMP activity unopposed.
    - reference: PMID:24735539
      reference_title: "A mutation in the heparin-binding site of noggin as a novel mechanism of proximal symphalangism and conductive hearing loss."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      directness: INDIRECT
      snippet: "We propose that the decreased binding affinity of NOG with the p.R136C mutation to HSPG leads to an excess of BMP signaling and underlies the SYM1 and conductive hearing loss phenotype of carriers."
      explanation: Links a NOG variant to excess BMP signalling through in silico docking; a proposed rather than demonstrated step.
- name: Unopposed BMP Signaling at Prospective Joint Sites
  description: >-
    Noggin binds BMP and GDF ligands, including BMP4 and GDF5, and keeps them
    from their receptors. With less noggin, BMP activity in condensing cartilage
    is higher than normal. More cells are recruited into cartilage, and
    chondrocytes stop responding to the positional cues that would make a joint.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: BMP signaling pathway
    term:
      id: GO:0030509
      label: BMP signaling pathway
    modifier: INCREASED
  - preferred_term: negative regulation of BMP signaling pathway
    term:
      id: GO:0030514
      label: negative regulation of BMP signaling pathway
    modifier: DECREASED
  cell_types:
  - preferred_term: chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  evidence:
  - reference: PMID:9603738
    reference_title: "Noggin, cartilage morphogenesis, and joint formation in the mammalian skeleton."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Excess BMP activity in the absence of Noggin antagonism may enhance the recruitment of cells into cartilage, resulting in oversized growth plates; chondrocytes are also refractory to joint-inducing positional cues."
    explanation: In Nog-null mice, unopposed BMP activity expands cartilage and makes chondrocytes unresponsive to joint-inducing cues.
  - reference: PMID:18096605
    reference_title: "Noggin heterozygous mice: an animal model for congenital conductive hearing loss in humans."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "This failure of bone separation in the Nog(+/-) mice reveals another consequence of chondrocyte hyperplasia due to unopposed Bmp activities in these mutants such as Bmp4 and Bmp14 (Gdf5)."
    explanation: The heterozygous state, which matches the human genotype, also shows unopposed BMP activity.
  downstream:
  - target: Failure of Joint Interzone Formation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:9603738
      reference_title: "Noggin, cartilage morphogenesis, and joint formation in the mammalian skeleton."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In mice lacking Noggin, cartilage condensations initiated normally but developed hyperplasia, and initiation of joint development failed as measured by the expression of growth and differentiation factor-5."
      explanation: Without noggin, cartilage condensations form but joint initiation fails.
- name: Failure of Joint Interzone Formation
  description: >-
    The joint interzone, which normally separates adjacent cartilage elements and
    later cavitates, does not form. The elements remain continuous and ossify as
    one, causing symphalangism and carpal and tarsal coalition. In the middle
    ear, the same failure of separation fuses the stapes to surrounding bone.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: embryonic skeletal joint development
    term:
      id: GO:0072498
      label: embryonic skeletal joint development
    modifier: DECREASED
  locations:
  - preferred_term: interphalangeal joint
    term:
      id: UBERON:0006658
      label: interphalangeal joint
  evidence:
  - reference: PMID:10080184
    reference_title: "Heterozygous mutations in the gene encoding noggin affect human joint morphogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The findings reported here confirm that NOG is essential for joint formation"
    explanation: Human genetic evidence that noggin is required for joint formation.
  downstream:
  - target: Proximal Symphalangism
    causal_link_type: DIRECT
  - target: Carpal Synostosis
    causal_link_type: DIRECT
    evidence:

      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "we have discovered Noggin haploinsufficiency leading to carpal and tarsal fusions reminiscent of some phenotypes reported for NOGGIN haploinsufficiency in humans."
      explanation: Halving Noggin dose in mice is enough to fuse carpal and tarsal bones.
  - target: Tarsal Synostosis
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:16598734
      reference_title: The Noggin null mouse phenotype is strain dependent and haploinsufficiency leads to skeletal defects.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "we have discovered Noggin haploinsufficiency leading to carpal and tarsal fusions reminiscent of some phenotypes reported for NOGGIN haploinsufficiency in humans."
      explanation: Halving Noggin dose in mice is enough to fuse carpal and tarsal bones.
  - target: Stapes Fixation to the Otic Capsule
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:18096605
      reference_title: "Noggin heterozygous mice: an animal model for congenital conductive hearing loss in humans."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Our analyses suggest that the ectopic bone formation is caused by a failure of the stapes and styloid process to separate completely during development."
      explanation: The middle-ear fusion arises from the same failure of skeletal elements to separate.
- name: Stapes Fixation to the Otic Capsule
  description: >-
    The stapes footplate is fixed to the surrounding bone. In the one human
    temporal bone examined, the stapedovestibular joint space was bridged by a
    ring of calcified cartilage. In heterozygous Nog mice, an ectopic bone bridge
    joins the stapes to the wall of the tympanum. Fixation may be incomplete at
    birth and progress in early childhood.
  biological_scale: TISSUE
  locations:
  - preferred_term: stapes
    term:
      id: UBERON:0001687
      label: stapes bone
  evidence:
  - reference: PMID:26474326
    reference_title: "Temporal Bone Histopathology in NOG-Symphalangism Spectrum Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The temporal bone pathologic correlate for conductive hearing loss in this patient with a NOG mutation was circumferentially calcified cartilage bridging the stapedovestibular joint space."
    explanation: Human histopathology of the stapes fixation.
  - reference: PMID:18096605
    reference_title: "Noggin heterozygous mice: an animal model for congenital conductive hearing loss in humans."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The conductive hearing loss in Nog(+/-) mice is caused by an ectopic bone bridge located between the stapes and the posterior wall of the tympanum, which affects the normal mobility of the ossicle."
    explanation: The mouse counterpart of the human stapes fixation.
  downstream:

genetic:
- name: FGFR2 Mutations
  association: Causative
  gene_term:
    preferred_term: FGFR2
    term:
      id: hgnc:3689
      label: FGFR2
  notes: >
    Two adjacent mutations in FGFR2 exon 7 account for more than 98% of cases:
    S252W (c.755C>G) in roughly two thirds and P253R (c.758C>G) in roughly one
    third. Both affect the linker region between Ig-II and Ig-III domains.
    Cohort-level genotype associations are feature-specific rather than evidence
    for a globally more severe allele: S252W was associated with cleft palate and
    more severe communicative-participation difficulty in one genotype-confirmed cohort.
  evidence:
  - reference: PMID:7719344
    reference_title: "Apert syndrome results from localized mutations of FGFR2 and is allelic with Crouzon syndrome."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We have identified specific missense substitutions involving adjacent amino acids
      (Ser252Trp and Pro253Arg) in the linker between the second and third extracellular
      immunoglobulin (Ig) domains of fibroblast growth factor receptor 2 (FGFR2) in all
      40 unrelated cases of Apert syndrome studied.
    explanation: >-
      Landmark study identifying S252W and P253R as the causative mutations in 100%
      of 40 unrelated Apert syndrome cases examined.
  - reference: CGGV:assertion_2aa63602-d820-4fee-893b-b807e7b62f28-2021-12-14T221137.192Z
    reference_title: "FGFR2 / Apert syndrome (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "FGFR2 | HGNC:3689 | Apert syndrome | MONDO:0007041 | AD | Definitive"
    explanation: ClinGen classifies the FGFR2-Apert syndrome gene-disease relationship as definitive with autosomal dominant inheritance.
  - reference: PMID:34310431
    reference_title: "Hearing, Speech, Language, and Communicative Participation in Patients With Apert Syndrome: Analysis of Correlation With Fibroblast Growth Factor Receptor 2 Mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The 2 adjacent substitutions, designated p.Ser252Trp (S252W) and p.Pro253Arg
      (P253R), account for more than 98% of cases.
    explanation: >-
      This genotype-confirmed cohort supports the combined predominance of the two
      recurrent hotspot alleles.

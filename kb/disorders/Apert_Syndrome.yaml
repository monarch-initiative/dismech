epidemiology:
- name: Mean paternal age in California Apert syndrome cohort
  description: Fathers of affected children were older on average in the large California cohort.
  mean_range: "34.1"
  unit: years
  notes: Almost half of fathers were older than 35 years when the child was born.
  evidence:
  - reference: PMID:9375719
    reference_title: "Birth prevalence, mutation rate, sex ratio, parents' age, and ethnicity in Apert syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      For all cases, the mean age of mothers was 28.9+/-6.0 years, and of fathers was 34.1+/-6.2
      years.
    explanation: >-
      This provides a cohort-level paternal age estimate relevant to Apert
      syndrome epidemiology.
- name: Sex ratio in the population-based California cohort
  description: The population-based cohort showed an approximately balanced sex distribution.
  mean_range: "0.94"
  unit: male to female ratio
  evidence:
  - reference: PMID:9375719
    reference_title: "Birth prevalence, mutation rate, sex ratio, parents' age, and ethnicity in Apert syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the large population-based CBDMP subsample, there was an almost equal number of affected
      males and females, (sex ratio 0.94) but in the clinical CCA subsample, there were more
      affected females (sex ratio 0.79).
    explanation: >-
      This provides a population-based sex ratio estimate for Apert syndrome.
inheritance:
- name: Autosomal Dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >
    Autosomal dominant inheritance with complete penetrance. Most cases arise from
    de novo mutations, with advanced paternal age as a risk factor due to selective
    advantage of mutant spermatogonial cells.
  evidence:
  - reference: PMID:2061407
    reference_title: "Genetic and family study of the Apert syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The familial cases, the equal number of affected males and females, and the
      increased paternal age in sporadic cases strongly suggest autosomal dominant inheritance.
    explanation: >-
      This family study directly supports autosomal dominant inheritance in Apert syndrome.
  - reference: PMID:31145570
    reference_title: "Apert Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, most individuals with Apert syndrome have the disorder as the result of
      a de novo FGFR2 pathogenic variant. Advanced paternal age has been shown to be
      associated with de novo pathogenic variants for Apert syndrome. Affected individuals
      have a 50% chance of passing the pathogenic variant to each child.
    explanation: >-
      GeneReviews supports the usual de novo origin, paternal-age association, and the
      50% offspring risk for an affected individual.
  - reference: PMID:15840724
    reference_title: Gain-of-function amino acid substitutions drive positive selection of FGFR2 mutations in human spermatogonia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Taken together, these observations show that specific FGFR2 mutations attain high
      levels in sperm because they encode proteins with gain-of-function properties,
      favoring clonal expansion of mutant spermatogonial cells.
    explanation: >-
      Human sperm data support paternal germline enrichment by selfish spermatogonial
      selection; this affects recurrence at the population level rather than making the
      receptor mutation ligand independent.
progression:
- phase: Congenital craniosynostosis-syndactyly malformation phase
  age_range: prenatal to birth
  notes: >-
    Apert syndrome is present as a congenital craniofacial and limb malformation
    syndrome, with recognizable craniosynostosis, midfacial anomaly, and
    symmetric syndactyly at birth.
  evidence:
  - reference: PMID:25206244
    reference_title: "Apert's Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Apert's syndrome (acrocephalosyndactyly) is a rare congenital disorder
      characterized by craniosynostosis, midfacial malforma-tion and symmetrical
      syndactyly of hands and feet.
    explanation: >-
      This directly supports congenital onset of the characteristic Apert
      malformation pattern.
- phase: Postnatal craniofacial growth-restriction phase
  age_range: infancy through childhood
  notes: >-
    Early coronal suture fusion distorts cranial growth and contributes to
    brachyturricephalic skull shape and impaired skull-base growth during
    postnatal development.
  evidence:
  - reference: PMID:26330906
    reference_title: "Treatment timing and multidisciplinary approach in Apert syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Abnormalities associated with Apert syndrome include premature fusion of
      coronal sutures system (coronal sutures and less frequently lambdoid suture)
      resulting in brachiturricephalic dismorphism and impaired skull base growth.
    explanation: >-
      This supports a distinct postnatal craniofacial growth-restriction phase in
      Apert syndrome.
pathophysiology:
- name: FGFR2 linker-region activating mutations
  conforms_to: "fgfr_gain_of_function_skeletal_dysplasia#Constitutive FGFR Activation"
  description: >
    Apert syndrome is caused almost exclusively by the adjacent FGFR2 S252W and P253R
    substitutions in the linker between immunoglobulin-like domains II and III, defining
    a recurrent activating receptor genotype.
  gene:
    preferred_term: FGFR2
    modifier: INCREASED
    term:
      id: hgnc:3689
      label: FGFR2
  downstream:
  - target: Altered FGFR2 ligand affinity and specificity
    description: The recurrent linker-region substitutions change how FGFR2 engages FGF ligands.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:11390973
      reference_title: "Structural basis for fibroblast growth factor receptor 2 activation in Apert syndrome."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        These structures demonstrate that both mutations introduce additional
        interactions between FGFR2 and FGF2, thereby augmenting FGFR2-FGF2 affinity.
      explanation: >-
        This directly supports a causal edge from the recurrent Apert mutations to
        altered FGFR2 ligand binding behavior.
  - target: Intellectual Disability
    description: >
      Activating FGFR2 mutations can contribute to variable neurodevelopmental
      impairment through intermediates not represented in this craniosynostosis-focused
      pathograph.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:3351902
      reference_title: "Intellectual development in Apert's syndrome: a long term follow up of 29 patients."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Fourteen patients (48%) had a normal or borderline IQ (greater than 70), nine
        patients (31%) were mildly mentally retarded (IQ 50 to 70), four patients (14%)
        were moderately retarded (IQ 35 to 49), and two patients (7%) were severely
        retarded (IQ less than 35).
      explanation: The human cohort supports variable cognitive outcome while leaving the developmental intermediates unresolved.
  - target: Middle-ear ventilation dysfunction
    description: FGFR2-related craniofacial development contributes to persistent middle-ear disease through unresolved intermediates.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:15949104
      reference_title: Management of hearing loss in Apert syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Almost all patients had otitis media with effusion (glue ear), which tended to
        persist into adult life.
      explanation: The clinical association is direct although the intervening developmental mechanism is unresolved.
  - target: Palatal morphogenesis disruption
    description: Activating FGFR2 variants perturb palatal development through unresolved developmental intermediates.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:34310431
      reference_title: "Hearing, Speech, Language, and Communicative Participation in Patients With Apert Syndrome: Analysis of Correlation With Fibroblast Growth Factor Receptor 2 Mutation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The S252W mutation was significantly-associated with the presence of cleft palate
        (including bifid uvula) (P =0.05).
      explanation: A genotype-confirmed cohort supports the FGFR2-to-palatal-development association.
  - target: Ventricular enlargement
    description: FGFR2-related development is associated with structural CNS findings through unresolved intermediates.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:26861132
      reference_title: Central nervous system and cervical spine abnormalities in Apert syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Multiple CNS and cervical spine (c-spine) abnormalities are common in Apert syndrome.
        The significance of these abnormalities remains largely unknown.
      explanation: Imaging supports the association while explicitly leaving the mechanism and significance unresolved.
  - target: Cervical vertebral synostosis
    description: Activating FGFR2 variants cause progressive cervical skeletal synostosis through unresolved intermediates.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence: &cervical_association_edge_evidence
    - reference: PMID:26861132
      reference_title: Central nervous system and cervical spine abnormalities in Apert syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Major C-spine findings were present in 50.8 % of patients and included fusion of
        posterior elements of C5/C6 (50 %) and C3/4 (27 %).
      explanation: The Apert imaging cohort directly supports the syndrome-to-cervical-fusion association.
  - target: Ptosis
    description: Ptosis is associated with the Apert ocular phenotype through unresolved developmental intermediates.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:17189145
      reference_title: "Ocular abnormalities in Apert syndrome: genotype/phenotype correlations with fibroblast growth factor receptor type 2 mutations."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In the P253R group, 85% had strabismus (14% required surgery), 71% had ptosis,
        43% had amblyopia
      explanation: The genotype-stratified series supports ptosis association but not a resolved developmental intermediate.
  evidence:
  - reference: PMID:7719344
    reference_title: "Apert syndrome results from localized mutations of FGFR2 and is allelic with Crouzon syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We have identified specific missense substitutions involving adjacent amino acids
      (Ser252Trp and Pro253Arg) in the linker between the second and third extracellular
      immunoglobulin (Ig) domains of fibroblast growth factor receptor 2 (FGFR2) in all
      40 unrelated cases of Apert syndrome studied.
    explanation: >-
      Original identification of S252W and P253R mutations in FGFR2 linker region
      in all 40 Apert syndrome cases, establishing causative role of these mutations.
  - reference: PMID:11121055
    reference_title: Loss of fibroblast growth factor receptor 2 ligand-binding specificity in Apert syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These data demonstrate loss of ligand specificity of FGFR2 with retained ligand
      dependence for receptor activation.
    explanation: >-
      This directly constrains the activating mechanism: Apert FGFR2 variants broaden
      ligand recognition but do not make receptor activation ligand independent.
- name: Altered FGFR2 ligand affinity and specificity
  description: >
    The S252W and P253R FGFR2 mutations create gain-of-function receptor states with
    increased FGF affinity and altered ligand specificity, enabling inappropriate
    autocrine or paracrine receptor activation.
  downstream:
  - target: FGF2 autocrine loop and constitutive FGFR2 activation
    description: Altered ligand affinity and specificity permit persistent local receptor activation in Apert osteoblast-lineage cells.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:11390973
      reference_title: "Structural basis for fibroblast growth factor receptor 2 activation in Apert syndrome."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Alterations in FGFR2 ligand affinity and specificity may allow inappropriate
        autocrine or paracrine activation of FGFR2.
      explanation: >-
        This directly links altered FGFR2 ligand binding behavior to inappropriate
        autocrine or paracrine receptor activation.
  - target: Acne
    description: >-
      Broadened signaling through epithelial FGFR2b contributes to pilosebaceous
      proliferation and acne through androgen-sensitive dermal-epithelial intermediates.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - androgen-dependent dermal-epithelial FGFR2b signaling
    evidence:
    - reference: PMID:20436882
      reference_title: Role of FGFR2-signaling in the pathogenesis of acne.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        The FGFR2-gain-of-function mutations in Apert syndrome and unilateral acneiform
        nevus are most helpful model diseases pointing the way to androgen-dependent
        dermalepithelial FGFR2-signaling in acne.
      explanation: >-
        This mechanistic review supports a ligand-responsive FGFR2b-to-pilosebaceous
        connection while leaving the intervening human tissue events indirect.
  evidence:
  - reference: PMID:11390973
    reference_title: "Structural basis for fibroblast growth factor receptor 2 activation in Apert syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These structures demonstrate that both mutations introduce additional
      interactions between FGFR2 and FGF2, thereby augmenting FGFR2-FGF2 affinity.
    explanation: >-
      Structural analysis directly shows that the recurrent Apert mutations increase
      FGFR2 ligand affinity.
  - reference: PMID:11390973
    reference_title: "Structural basis for fibroblast growth factor receptor 2 activation in Apert syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Alterations in FGFR2 ligand affinity and specificity may allow inappropriate
      autocrine or paracrine activation of FGFR2.
    explanation: >-
      This directly supports altered ligand specificity as the receptor-level
      mechanism that drives aberrant FGFR2 activation in Apert syndrome.
- name: FGF2 autocrine loop and constitutive FGFR2 activation
  description: >
    Apert-mutant osteoblast-lineage cells show increased constitutive receptor activity

discussions:
- discussion_id: gap_apert_targeted_therapy_human_translation
  prompt: >-
    Can molecular rescue observed in Apert mouse models be translated into a safe,
    locally delivered therapy that changes human cranial-suture outcomes?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#ERK1/2 cascade activation
  - clinical_trials#NCT07535372
  rationale: >-
    MEK inhibition and PIN1 modulation rescue craniosynostosis-related phenotypes in
    mice, while the current NAUTILUS study proposes cellular and mouse validation of
    mutation-specific ASOs. None of these sources reports human administration or clinical
    efficacy in Apert syndrome, and prenatal systemic interventions raise distinct safety
    and timing problems. These results therefore establish preclinical plausibility only.
  evidence:
  - reference: PMID:17694057
    reference_title: RNA interference and inhibition of MEK-ERK signaling prevent abnormal skeletal phenotypes in a mouse model of craniosynostosis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Furthermore, treatment of the mutant mice with U0126, an inhibitor of
      mitogen-activated protein (MAP) kinase kinase 1 and 2 (MEK1/2) that blocks
      phosphorylation and activation of ERK1/2, significantly inhibits craniosynostosis.
    explanation: MEK-ERK inhibition rescued a model phenotype but supplies no human safety or efficacy evidence.
  - reference: PMID:30007339
    reference_title: PIN1 is a new therapeutic target of craniosynostosis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Both approaches successfully attenuated CS phenotypes in the disease model mice,
      suggesting that PIN1 represents a promising molecular target for overcoming CS without surgery.
    explanation: Genetic and pharmacologic PIN1 interventions remain confined to a prenatal mouse model.
  - reference: clinicaltrials:NCT07535372
    reference_title: Nano-ink Based Antisense oligonUcleoTIde deLivery for Ultra-personaIized Treatment of Syndromic Craniosynostoses
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      However, clinical translation remains limited by inefficient delivery and lack of sustained therapeutic activity.
    explanation: The current registry explicitly states the translational delivery and durability gap.
- discussion_id: gap_apert_adult_natural_history
  prompt: What are the adult survival, morbidity, and cancer risks across contemporary Apert syndrome populations?
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: >-
    The newest long-term report traces only 24 UK patients first described in 1960. Its
    reassuring conclusion argues against assuming a markedly shortened lifespan or a
    syndrome-specific cancer predisposition in every affected person, but the small,
    historical cohort cannot precisely estimate current adult risks or subgroup effects.
  evidence:
  - reference: PMID:42082645
    reference_title: Long-term survival without high cancer risk in a cohort of 24 patients with Apert syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We conclude that Apert syndrome is not, in many affected individuals, associated
      either with substantial shortening of lifespan, or with a high risk of developing
      particular types of cancer.
    explanation: The 53-year follow-up is reassuring but explicitly limited to a cohort of 24 historical patients.
review_notes: >-
  Publication-readiness review through 2026-08-05 included a fresh D2P audit. Of the
  source-backed suggestions, the review added airway obstruction, obstructive sleep apnea,
  chronic otitis media, conductive hearing impairment, cleft palate, abnormal speech pattern,
  ventriculomegaly, fused cervical vertebrae, strabismus, ptosis, amblyopia, hyperhidrosis,
  feeding difficulties, and acne using exact primary-cohort or GeneReviews evidence. Broader
  local terms were retained for thumb morphology, hand/foot syndactyly, feeding difficulty,
  and proptosis because their evidence does not justify replacing them with every narrower
  source term. The remaining 88 D2P issues were reviewed but not imported: many are redundant
  morphologic children of existing core phenotypes (craniosynostosis/skull shape, midface
  retrusion, syndactyly, broad thumb), isolated or occasional manifestations without adequate
  claim-level evidence in the reviewed sources, source-only frequency assertions, or findings
  whose separate clinical significance is uncertain (for example absent septum pellucidum,
  corpus-callosum agenesis, and other CNS imaging variants). Hyperhidrosis remains intentionally
  unlinked because no defensible mechanism was found. Rare cardiac, gastrointestinal, and
  genitourinary anomalies are acknowledged by GeneReviews but were not expanded into atomic
  phenotypes without stronger Apert-specific cohort evidence. GeneReviews also calls dental
  abnormalities common, but that category was not converted into a single HPO claim because
  it does not specify which dental abnormality; the D2P suggestions for delayed eruption,
  crowding, and malocclusion require separate claim-level evidence. No candidate was added
  merely to eliminate an audit warning.
datasets:
- accession: geo:GSE97828
  title: RNA expression in anterior nasal septum cartilage of wildtype and Fgfr2+/S252W Apert syndrome model mice at embryonic day (E)14.5.
  description: The nasal capsule cartilage of Apert Fgfr2+/S252W mice increases in size compared to wildtype cartilage during embryonic craniofacial development. Increased levels of markers of cell proliferation can be detected in the Apert Fgfr2+/S252W anterior nasal septum cartilage compared to wildtype at E14.5. We have performed laser capture microdissection of this cartilage in these genotypes at this age to generate RNA-Seq libraries and compare gene expression. Expression analysis shows increased expression of genes related to chromosome condensation, nuclear division, and the cell cycle in Apert Fgfr2+/S252W anterior nasal septum cartilage compared to wildtype.

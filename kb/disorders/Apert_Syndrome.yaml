- name: Cleft Palate Repair
  description: >-
    Repair is timed before development of pressure consonants when feasible and is
    integrated with ongoing speech and velopharyngeal assessment.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Palatorrhaphy
    term:
      id: NCIT:C168380
      label: Palatorrhaphy
    located_in:
      preferred_term: secondary palate
      term:
        id: UBERON:0001716
        label: secondary palate
  evidence:
  - reference: PMID:31145570
    reference_title: "Apert Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cleft palate repair may be performed prior to the development of pressure consonants.
    explanation: GeneReviews directly supports cleft-palate repair and its speech-related timing.
- name: Hearing Aid Usage
  description: >-
    Early hearing optimization, including hearing aids when indicated, is favored over
    assuming that repeated tympanostomy tubes will prevent permanent conductive loss.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: hearing aid usage
  evidence:
  - reference: PMID:15949104
    reference_title: Management of hearing loss in Apert syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This study, of the largest number of Apert syndrome cases assembled to date,
      showed that early optimization of hearing with possible hearing aids needs to be
      considered. Repeated grommet insertion does not help in optimizing hearing,
      especially if ear discharge complicates the picture.
    explanation: The cohort supports early amplification consideration and cautions against repeated grommets as a preventive strategy.
- name: Speech and Language Therapy
  description: Early speech-language intervention is indicated for speech abnormalities and developmental delay.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: speech and language therapy
    term:
      id: NCIT:C159273
      label: Speech Language Therapy
  evidence:
  - reference: PMID:31145570
    reference_title: "Apert Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Early intervention services for speech abnormalities and developmental delay should be initiated.
    explanation: GeneReviews directly recommends early intervention for speech and developmental needs.
- name: Temporizing Positive Airway Pressure
  description: >-
    CPAP can control persistent obstructive sleep apnea while awaiting optimally timed
    craniofacial surgery; it is curated as bridge therapy, not a definitive long-term treatment.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: continuous positive airway pressure
    term:
      id: NCIT:C124040
      label: Continuous Positive Airway Pressure
  evidence:
  - reference: PMID:40246667
    reference_title: Respiratory and craniofacial management in children with Apert syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CPAP was effective to treat persistent OSA and wait for optimal timing of craniofacial surgery.
    explanation: The 2025 center cohort supports CPAP specifically as a temporizing bridge to surgery.
  - reference: PMID:31145570
    reference_title: "Apert Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Agents/circumstances to avoid: Contact sports and activities that involve neck
      hyperflexion or extension for those with cervical spine anomalies; factors that
      potentiate hearing loss; use of CPAP/BiPAP for long-term treatment of sleep apnea.
    explanation: >-
      GeneReviews directly supports the distinction between short-term bridge use and
      avoidance of CPAP/BiPAP as long-term therapy.
- name: Cervical Spine Injury Precautions
  description: >-
    Individuals with cervical spine anomalies should avoid contact sports and activities
    involving neck hyperflexion or extension to reduce spinal-cord injury risk.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: cervical spine injury precautions
  evidence:
  - reference: PMID:31145570
    reference_title: "Apert Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Agents/circumstances to avoid: Contact sports and activities that involve neck
      hyperflexion or extension for those with cervical spine anomalies; factors that
      potentiate hearing loss; use of CPAP/BiPAP for long-term treatment of sleep apnea.
    explanation: GeneReviews directly supports activity and neck-motion precautions for cervical anomalies.
differential_diagnoses:
- name: Crouzon syndrome
  description: >-
    Crouzon syndrome is a closely related FGFR2-associated craniosynostosis
    syndrome that overlaps with Apert syndrome in craniofacial phenotype but
    lacks the characteristic severe hand and foot syndactyly.
  distinguishing_features:
  - Crouzon syndrome causes craniosynostosis with normal limbs rather than the severe symmetric syndactyly seen in Apert syndrome.
  - Both disorders are FGFR2-related, so the presence or absence of limb anomalies is a key discriminator.
  disease_term:
    preferred_term: Crouzon syndrome
    term:
      id: MONDO:0007405
      label: Crouzon syndrome
  evidence:
  - reference: PMID:7719344
    reference_title: "Apert syndrome results from localized mutations of FGFR2 and is allelic with Crouzon syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Crouzon syndrome, characterized by craniosynostosis but normal limbs, was
      previously shown to result from allelic mutations of the third Ig domain of FGFR2.
    explanation: >-
      This directly supports Crouzon syndrome as a major FGFR2-related differential
      diagnosis distinguished from Apert syndrome by the absence of limb anomalies.
- name: Pfeiffer syndrome
  description: >-
    Pfeiffer syndrome is another FGFR-related craniosynostosis syndrome with
    overlapping skull and midface features, but it is usually distinguished from
    Apert syndrome by broad digits and less severe limb fusion.
  distinguishing_features:
  - Broad and deviated thumbs and great toes with only partial syndactyly favor Pfeiffer syndrome over Apert syndrome.
  - Apert syndrome typically causes severe symmetric mitten-hand and sock-foot syndactyly.
  disease_term:
    preferred_term: Pfeiffer syndrome
    term:
      id: MONDO:0007043
      label: Pfeiffer syndrome
  evidence:
  - reference: PMID:16740155
    reference_title: "Pfeiffer syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pfeiffer syndrome is a rare autosomal dominantly inherited disorder that
      associates craniosynostosis, broad and deviated thumbs and big toes, and
      partial syndactyly on hands and feet.
    explanation: >-
      This syndrome review supports Pfeiffer syndrome as a clinically important
      differential whose digit pattern differs from the complex syndactyly of Apert syndrome.
- name: Saethre-Chotzen syndrome
  description: >-
    Saethre-Chotzen syndrome can resemble milder Apert presentations because it
    commonly causes coronal craniosynostosis and limb anomalies, but it is
    usually distinguished by TWIST1-related ear and eyelid findings with less
    severe syndactyly.
  distinguishing_features:
  - Ptosis and characteristic ear anomalies favor Saethre-Chotzen syndrome over Apert syndrome.
  - Hand syndactyly is usually limited and variable rather than the severe complex fusion typical of Apert syndrome.
  disease_term:
    preferred_term: Saethre-Chotzen syndrome
    term:
      id: MONDO:0007042
      label: Saethre-Chotzen syndrome
  evidence:
  - reference: PMID:20301368
    reference_title: "Saethre-Chotzen Syndrome"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Classic Saethre-Chotzen syndrome (SCS) is characterized by coronal synostosis
      (unilateral or bilateral), facial asymmetry (particularly in individuals with
      unicoronal synostosis), strabismus, ptosis, and characteristic appearance of
      the ear (small pinna with a prominent superior and/or inferior crus). Syndactyly
      of digits two and three of the hand is variably present.
    explanation: >-
      This directly supports Saethre-Chotzen syndrome as a coronal craniosynostosis
      differential with ptosis, ear anomalies, and milder hand syndactyly.
clinical_trials:
- name: NCT07535372
  phase: NOT_APPLICABLE
  status: NOT_RECRUITING
  description: >-
    NAUTILUS is an observational biospecimen and preclinical platform study that includes
    Apert syndrome. It plans patient-tailored antisense-oligonucleotide testing in
    patient-derived cells and relevant mouse models; it is not a human dosing or efficacy trial.
    The registry status was Not yet recruiting on 2026-08-05, represented by the schema's
    broader NOT_RECRUITING value.
  evidence:
  - reference: clinicaltrials:NCT07535372
    reference_title: Nano-ink Based Antisense oligonUcleoTIde deLivery for Ultra-personaIized Treatment of Syndromic Craniosynostoses
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The project will design and validate patient-tailored ASOs targeting the molecular
      drivers of SCS, with the goal of either silencing pathogenic gain-of-function alleles
      or restoring physiological expression in loss-of-function contexts. Functional efficacy
      will be assessed in patient-derived cellular models by evaluating transcript modulation
      and rescue of protein function.
    explanation: >-
      The registry record supports patient-derived experimental work but does not describe
      administration of an ASO to participants.
  - reference: clinicaltrials:NCT07535372
    reference_title: Nano-ink Based Antisense oligonUcleoTIde deLivery for Ultra-personaIized Treatment of Syndromic Craniosynostoses
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Preclinical validation in relevant mouse models will assess the capacity of this
      platform to delay or prevent pathological suture ossification, ultimately reducing
      the need for repeated surgical interventions.
    explanation: The registered future efficacy assessment is explicitly preclinical.
- name: NCT00340964
  phase: NOT_APPLICABLE
  status: COMPLETED
  description: >-
    Observational psychosocial intervention study using photography and video
    interviews to improve self-perception and stigma-related outcomes in
    adolescents and young adults with craniofacial differences, explicitly
    including Apert syndrome.
  evidence:
  - reference: clinicaltrials:NCT00340964
    reference_title: "Positive Exposure: A Photography and Video Intervention for Individuals With Craniofacial Differences"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The conditions that participants in this study have will include cleft lip
      and palate, Apert syndrome, hemifacial microsomia, Treacher Collins syndrome,
      Mobius syndrome and Sturge-Weber syndrome.
    explanation: >-
      This official trial summary explicitly names Apert syndrome among the study
      population, supporting inclusion as a directly relevant clinical study.

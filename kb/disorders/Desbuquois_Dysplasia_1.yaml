    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In the Cant1-/- tendons, the DS/CS content was significantly reduced, and the DC/CS chains attached to the decorin core protein became shorter than those in the Ctrl tendons."
    explanation: Shows reduced DS/CS and shortened decorin chains in CANT1-deficient tendon.
  downstream:
  - target: Generalized joint laxity
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - tendon/ligament fragility from abnormal collagen fibrillogenesis
    description: Tendon fragility from defective decorin-regulated collagen fibrillogenesis is the inferred basis of joint laxity.
    evidence:

- name: Growth Plate Chondrocyte Dysfunction and Loss of Zonal Organisation
  conforms_to: "growth_plate_chondrocyte_failure#Loss of Growth Plate Zonal Organisation"
  description: >-
    In the growth plate, GAG content and extracellular matrix space are reduced,
    proliferating chondrocytes lose their flat columnar shape, and chondrocyte
    proliferation and maturation are deregulated. Terminal differentiation into
    hypertrophic chondrocytes is specifically impaired, so the physis stalls at
    the step CANT1-deficient cartilage cannot complete. This is the
    chondrocyte-biosynthetic-input instance of the shared growth-plate failure
    mechanism, with the program stalling at terminal hypertrophic
    differentiation.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: growth plate chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  - preferred_term: hypertrophic chondrocyte
    term:

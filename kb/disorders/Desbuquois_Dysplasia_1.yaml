discussions:
- discussion_id: cant1_udp_to_proteoglycan_mechanism
  prompt: >-
    How exactly does loss of a Golgi UDP-hydrolysing nucleotidase cause a
    glycosaminoglycan-synthesis defect in DBQD1 chondrocytes?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired Golgi UDP Hydrolysis
  - pathophysiology#Impaired Glycosaminoglycan Chain Synthesis
  - mechanistic_hypotheses#canonical_cant1_gag_synthesis_growth_plate_model
  rationale: >-
    The upstream enzymology (CANT1 hydrolyses UDP to UMP and phosphate) and the
    downstream readout (reduced GAG synthesis, shorter chains) are both
    established, but the step linking them is inferred rather than measured. The
    proposed logic is that undischarged UDP product-inhibits the
    glycosyltransferases that elongate GAG chains and that reduced UMP starves
    the nucleotide-sugar antiporter that imports cytosolic UDP-sugar donors. This
    has not been demonstrated by measuring Golgi UDP, UDP-sugar pools, or
    glycosyltransferase activity in patient or knock-out chondrocytes, and the
    enzyme's exact subcellular site of action (ER versus Golgi) is itself still
    debated. Settling it would convert the central node of the canonical model
    from inference to measurement and identify where a therapeutic bypass could
    act.
  proposed_experiments:
  - experiment_id: exp_cant1_golgi_nucleotide_sugar_flux
    name: Golgi nucleotide-sugar flux in CANT1-deficient chondrocytes
    description: >-
      In patient fibroblasts/chondrocytes and Cant1 knock-out chondrocytes,
      quantify Golgi-luminal UDP and UDP-sugar pools and assay glycosyltransferase
      activity under controlled UDP concentrations, to test whether UDP product
      inhibition and antiporter starvation account for the measured GAG-synthesis
      defect.
  evidence:
  - reference: PMID:39334831
    reference_title: "Cant1 Affects Cartilage Proteoglycan Properties: Aggrecan and Decorin Characterization in a Mouse Model of Desbuquois Dysplasia Type 1."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "the exact function(s) of CANT1 and its specific role in the pathogenesis of DBQD1 is far from complete."
    explanation: States directly that the precise function of CANT1 in DBQD1 pathogenesis is not fully resolved.
- discussion_id: dbqd_subtype_gene_boundaries
  prompt: >-
    Do the clinical/radiographic Desbuquois subtypes (type 1, type 2, Kim
    variant) map onto the causal genes CANT1 and XYLT1, and where is the
    DBQD1/DBQD2 boundary drawn?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - disease#Desbuquois Dysplasia 1
  - has_subtypes#Kim variant
  rationale: >-
    The historical hand-based classification (type 1 = accessory metacarpal
    ossification; type 2 = normal hands; Kim variant = short metacarpals with
    long phalanges) does not map cleanly onto genotype. CANT1 variants are found
    in all type 1 cases, in the Kim variant, and in some atypical type 2 cases,
    so the hand sign does not predict the molecular basis. dismech follows the
    MONDO split in which DBQD1 (MONDO:0009629) is the CANT1 form and DBQD2
    (MONDO:0014343) is the XYLT1 form, but at least one review describes DBQD2 as
    resulting from CANT1 or XYLT1, so the gene-to-subtype assignment at the
    boundary is not universally stated the same way. This entry curates the
    CANT1 form; the ambiguity is why the Kim variant and the MED-like
    presentation are modelled as subtypes of DBQD1 rather than separate diseases.
  evidence:
  - reference: PMID:21037275
    reference_title: "CANT1 mutation is also responsible for Desbuquois dysplasia, type 2 and Kim variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "this sign is not a distinctive criterion to predict the molecular basis in DD."
    explanation: Shows the hand-based subtype sign does not predict which gene is mutated.
  - reference: PMID:22539336
    reference_title: Further delineation of CANT1 phenotypic spectrum and demonstration of its role in proteoglycan synthesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "found CANT1 mutations in all DD type 1 cases, the Kim variant and in one atypical DD type 2"
    explanation: Shows CANT1 spans type 1, the Kim variant, and an atypical type 2 case, crossing the clinical subtype boundaries.
- discussion_id: dbqd_hand_anomaly_catel_manzke_overlap
  prompt: >-
    How specific is the DBQD1 hand signature (accessory metacarpal ossification
    center, delta phalanx) given overlapping accessory hand bones in other
    syndromes such as Catel-Manzke syndrome?
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - phenotypes#Delta phalanx of the thumb
  rationale: >-
    The hand anomaly used to define DBQD type 1 is an accessory ossification
    center distal to the second metacarpal, often with a delta (triangular) thumb
    phalanx. A superficially similar accessory bone defines Catel-Manzke syndrome
    (TGDS-related Manzke dysostosis), where an accessory bone sits between the
    second metacarpal and the proximal phalanx of the index finger. The two are
    distinct disorders with different genes, radiographic context, and systemic
    features, but the shared vocabulary of an "accessory metacarpal/hand bone"
    makes the hand sign a differential rather than a specific diagnostic finding;
    molecular testing, not the hand radiograph alone, assigns the diagnosis.
  evidence:
  - reference: PMID:21037275
    reference_title: "CANT1 mutation is also responsible for Desbuquois dysplasia, type 2 and Kim variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "two subtypes have been distinguished based on the presence (type 1) or absence (type 2) of an accessory metacarpal bone"
    explanation: Defines the accessory metacarpal bone as the DBQD type-1 hand sign that overlaps with accessory hand bones in other syndromes.
- discussion_id: cant1_mouse_fidelity_and_inferred_branches
  prompt: >-
    Do the Cant1 mouse models and the inferred tendon/cardiovascular branches
    faithfully represent the human DBQD1 mechanism, given the unexplained ER
    dilation and the lack of human-tissue confirmation for joint laxity and
    aortopathy?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Tendon and Ligament Dermatan Sulfate Deficiency
  - pathophysiology#Cardiac Valve and Aortic Wall Proteoglycan Defect
  rationale: >-
    Two independent Cant1 knock-out mouse lines reproduce the skeletal and
    GAG-synthesis phenotype well, which is strong support for the core axis. But
    two translational gaps remain. First, knock-out chondrocytes show dilated ER
    cisternae yet no canonical ER stress/unfolded-protein response, so the
    cellular-stress step is observed in mouse without a known mechanism. Second,
    the joint-laxity branch is inferred from mouse tendon decorin data and the
    aortopathy branch from a human echocardiographic cohort, neither of which
    directly measures the proteoglycan defect in human tendon, ligament, valve,
    or aortic tissue. The mechanism connecting the molecular defect to the two
    most disabling non-skeletal features is therefore model- or
    association-based, not demonstrated in the relevant human tissue.
  proposed_experiments:
  - experiment_id: exp_human_tissue_proteoglycan_dbqd
    name: Decorin GAG analysis in human DBQD1 connective and cardiovascular tissue
    description: >-
      Characterize decorin dermatan/chondroitin sulfate chain length and collagen
      fibril morphology in patient-derived tendon, ligament, and dermal
      fibroblasts, and, where tissue is available, in valve/aortic wall, to test
      whether the mouse tendon defect and the proposed cardiovascular
      proteoglycan defect are present in human DBQD1 tissue.
  evidence:
  - reference: PMID:30439444
    reference_title: "Calcium activated nucleotidase 1 (CANT1) is critical for glycosaminoglycan biosynthesis in cartilage and endochondral ossification."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "knock-out chondrocytes had dilated ER cisternae suggesting delayed protein secretion and cellular stress; however, no canonical ER stress response was detected"
    explanation: Documents the dilated ER without a canonical ER stress response, an observed-but-unexplained step in the mouse model.
  - reference: PMID:40141107
    reference_title: CANT1 Is Involved in Collagen Fibrogenesis in Tendons by Regulating the Synthesis of Dermatan/Chondroitin Sulfate Attached to the Decorin Core Protein.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "The multiple joint dislocations associated with this genetic disorder may be attributed to tendon fragility resulting from CANT1 dysfunction."
    explanation: The joint-laxity link is proposed from mouse tendon data as an inference, not shown in human tissue.
- discussion_id: cant1_shared_gag_biosynthesis_family
  prompt: >-
    Does DBQD1 share a final common mechanism with other glycosaminoglycan
    biosynthesis chondrodysplasias, and what distinguishes the chain-elongation
    defect of CANT1 from the sulfation and linker defects of related genes?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired Glycosaminoglycan Chain Synthesis
  - disease#Desbuquois Dysplasia 1
  rationale: >-
    DBQD1 belongs to a family of skeletal dysplasias caused by defective
    glycosaminoglycan biosynthesis, alongside XYLT1 (DBQD2), the sulfation
    defects (SLC26A2 diastrophic dysplasia, CHST3), and the linkeropathies
    (B3GAT3 and others). These converge on an undersulfated or undersized
    proteoglycan in cartilage matrix, which is why DBQD overlaps clinically and
    radiographically with CHST3-related spondyloepiphyseal dysplasia with joint
    dislocations. What is not resolved is how a chain-elongation defect (CANT1)
    produces a phenotype distinct from, yet overlapping with, the sulfation and
    linker defects, and whether the shared matrix endpoint offers a common
    therapeutic target. A shared mechanism module for proteoglycan-synthesis
    chondrodysplasia is a candidate for factoring this out.
  evidence:
  - reference: PMID:42094029
    reference_title: Genetic Skeletal Disorders with Defects in Glycosaminoglycan Biosynthesis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The prototype of this group includes diastrophic dysplasia and Desbuquois dysplasia. The former is attributed to abnormal GAG sulfation, while the latter to impaired GAG chain elongation."
    explanation: Places DBQD in the GAG-biosynthesis disorder family and names its chain-elongation defect against the sulfation defect of diastrophic dysplasia.
  - reference: PMID:22539336
    reference_title: Further delineation of CANT1 phenotypic spectrum and demonstration of its role in proteoglycan synthesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DD has overlapping features with spondyloepiphyseal dysplasia with congenital joint dislocations (SDCD) due to Carbohydrate (chondroitin 6) Sulfotransferase 3 (CHST3) mutations."
    explanation: Documents the clinical overlap between DBQD and the CHST3 sulfation disorder within the GAG-biosynthesis family.

name: Desbuquois Dysplasia 1
creation_date: "2026-11-09T19:45:19Z"
category: Mendelian
description: >-
  Desbuquois dysplasia 1 (DBQD1) is an autosomal recessive osteochondrodysplasia
  of the multiple-dislocation group, caused by biallelic loss-of-function
  variants in CANT1, which encodes an ER/Golgi calcium-activated nucleotidase
  that hydrolyses UDP. Loss of this activity impairs glycosaminoglycan chain
  synthesis on cartilage proteoglycans, derailing the growth plate and producing
  severe prenatal-onset short stature with short limbs, generalized joint laxity
  with multiple dislocations, a "monkey-wrench" proximal femur, advanced carpal
  ossification, and characteristic hand anomalies.
disease_term:
  preferred_term: Desbuquois dysplasia 1
  term:
    id: MONDO:0009629
    label: Desbuquois dysplasia 1
synonyms:
- Desbuquois dysplasia type 1
- DBQD1
- CANT1-related Desbuquois dysplasia
- Desbuquois syndrome
parents:
- osteochondrodysplasia
- dysplasia with multiple joint dislocations
has_subtypes:
- name: Kim variant
  display_name: Desbuquois dysplasia, Kim variant (DDKV)
  description: >-
    A CANT1-related presentation with almost normal hands apart from short
    metacarpals and elongated phalanges (no accessory metacarpal ossification
    center), rather than the type-1 hand anomalies. Originally reported in
    Japanese and Korean patients carrying the c.676G>A (p.Val226Met) founder
    allele, but subsequently found in other populations. No separate MONDO leaf
    term exists, so no subtype_term is asserted.
- name: CANT1-related multiple epiphyseal dysplasia
  display_name: CANT1-related multiple epiphyseal dysplasia (MED, EDM7)
  description: >-
    The mild end of the CANT1 spectrum: a multiple epiphyseal dysplasia (MED)-like
    presentation associated with the p.Trp125Cys variant. ClinGen's Lumping and
    Splitting assessment folded "epiphyseal dysplasia, multiple, 7" into DBQD1 as
    one disease entity, so this is treated as a sub-presentation of DBQD1 rather
    than a separate disease. No separate MONDO leaf term is asserted here.
notes: >-
  No GeneReviews chapter exists for Desbuquois dysplasia or for CANT1
  (just check-genereviews, offline Bookshelf index and online PubMed
  genereviews[book] title/gene search both negative), so no expert-curated
  phenotype baseline is available; phenotypes here are taken from the primary
  case series and a 111-case systematic review (Piwar 2024, PMID:39273648).
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    DBQD1 is inherited as an autosomal recessive trait: affected individuals
    carry homozygous or compound heterozygous pathogenic CANT1 variants, and
    parental consanguinity is reported in roughly 60% of published cases.
  evidence:
  - reference: PMID:39273648
    reference_title: "Clinical and Genetic Insights into Desbuquois Dysplasia: Review of 111 Case Reports."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Desbuquois dysplasia is inherited in an autosomal recessive manner, with both the DBQD1 (MIM 251450) and DBQD2 (MIM 615777) forms resulting from biallelic mutations."
    explanation: A 111-case review states that DBQD1 is autosomal recessive and results from biallelic mutations.
  - reference: PMID:39273648
    reference_title: "Clinical and Genetic Insights into Desbuquois Dysplasia: Review of 111 Case Reports."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "approximately 60% of patients had a history of parental consanguinity"
    explanation: Supports the high rate of parental consanguinity consistent with autosomal recessive inheritance.
mechanistic_hypotheses:
- hypothesis_group_id: canonical_cant1_gag_synthesis_growth_plate_model
  hypothesis_label: Canonical CANT1 Loss / Impaired GAG Synthesis / Growth-Plate Failure Model
  status: CANONICAL
  description: >-
    Biallelic loss-of-function CANT1 variants abolish the ER/Golgi
    calcium-activated nucleotidase that hydrolyses UDP to UMP and phosphate. The
    inferred proximal consequence is that undischarged UDP accumulates in the
    Golgi lumen, product-inhibiting the glycosyltransferases that elongate
    glycosaminoglycan chains and reducing the UMP available for exchange of
    cytosolic UDP-sugars through the nucleotide-sugar antiporter. The measured
    downstream consequence is impaired glycosaminoglycan synthesis on cartilage
    proteoglycans (aggrecan, decorin), with shorter GAG chains, increased
    sulfation and delayed proteoglycan secretion. The depleted, abnormal
    growth-plate matrix deregulates chondrocyte proliferation and impairs
    terminal hypertrophic differentiation, so endochondral ossification fails
    and the skeleton is short with the DBQD1 signature. Patient fibroblasts and
    two independent Cant1 knock-out mouse lines reproduce the GAG-synthesis
    defect and skeletal phenotype, corroborating the axis.
  notes: >-
    The upstream enzymology (UDP hydrolysis, loss of activity/dimerization for
    missense alleles) and the downstream GAG-synthesis defect are both
    experimentally established; the intervening step linking a Golgi
    nucleotidase to a glycosyltransferase product-inhibition/antiporter defect
    is inferred from enzyme function and substrate preference and has not been
    measured directly in patient chondrocytes. The extension of the same
    proteoglycan defect to joint laxity (via tendon decorin) and to aortopathy
    is a reasonable but still inferential branch, recorded in the discussions.
  evidence:
  - reference: PMID:30439444
    reference_title: "Calcium activated nucleotidase 1 (CANT1) is critical for glycosaminoglycan biosynthesis in cartilage and endochondral ossification."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "the pathogenic mechanism of DBQD1 comprises deregulated chondrocyte performance due to defective intracellular proteoglycan synthesis and altered proteoglycan properties in the extracellular matrix."
    explanation: States the canonical pathogenic mechanism, from defective proteoglycan synthesis to deregulated chondrocyte behaviour.
pathophysiology:
- name: CANT1 Loss-of-Function
  description: >-
    Biallelic pathogenic CANT1 variants (nonsense, frameshift and missense)
    abolish or severely reduce the activity of calcium-activated nucleotidase 1,
    a soluble UDP-preferring nucleotidase resident in the endoplasmic reticulum
    and Golgi. Missense alleles reduce enzyme activity and, for some, abolish the
    calcium-induced dimerization required for full activity.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: CANT1
    term:
      id: hgnc:19721
      label: CANT1
  molecular_functions:
  - preferred_term: UDP phosphatase activity
    term:
      id: GO:0045134
      label: UDP phosphatase activity
    modifier: DECREASED
  cellular_components:
  - preferred_term: Golgi apparatus
    term:
      id: GO:0005794
      label: Golgi apparatus
  - preferred_term: endoplasmic reticulum
    term:
      id: GO:0005783
      label: endoplasmic reticulum
  evidence:
  - reference: PMID:19853239
    reference_title: Identification of CANT1 mutations in Desbuquois dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Studying nine Desbuquois families, we identified seven distinct mutations in the Calcium-Activated Nucleotidase 1 gene (CANT1), which encodes a soluble UDP-preferring nucleotidase belonging to the apyrase family."
    explanation: Establishes CANT1 as the causal gene and identifies its product as a UDP-preferring nucleotidase.
  - reference: PMID:32907608
    reference_title: "Cloning, expression and enzyme activity delineation of two novel CANT1 mutations: the disappearance of dimerization may indicate the change of protein conformation and even function."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The CANT1 dimer of mut2 was significantly reduced and even undetectable."
    explanation: Shows a missense allele abolishes CANT1 dimerization, the structural basis of its loss of function.
  - reference: PMID:21037275
    reference_title: "CANT1 mutation is also responsible for Desbuquois dysplasia, type 2 and Kim variant."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Measurement of nucleotidase activity in vitro showed that the missense mutations were all associated with loss-of-function."
    explanation: Directly demonstrates that DBQD1 missense variants are loss-of-function for nucleotidase activity.
  downstream:
  - target: Impaired Golgi UDP Hydrolysis
    causal_link_type: DIRECT
    description: Loss of CANT1 activity removes the ER/Golgi hydrolysis of UDP to UMP and phosphate.
    evidence:
    - reference: PMID:32277574
      reference_title: CANT1 deficiency in a mouse model of Desbuquois dysplasia impairs glycosaminoglycan synthesis and chondrocyte differentiation in growth plate cartilage.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The causative gene has been identified as calcium-activated nucleotidase 1 (CANT1), which encodes a nucleotidase that preferentially hydrolyzes UDP to UMP and phosphate."
      explanation: Identifies the enzymatic reaction (UDP to UMP and phosphate) lost when CANT1 is deficient.
- name: Impaired Golgi UDP Hydrolysis
  description: >-
    Loss of CANT1 hydrolysis is inferred to let UDP, the by-product of
    glycosyltransferase reactions, accumulate in the Golgi lumen, where it
    product-inhibits the glycosyltransferases and reduces the UMP available to
    exchange cytosolic UDP-sugar donors through the nucleotide-sugar antiporter.
    This step is inferred from the enzyme's substrate preference and localization
    and has not been measured directly in patient chondrocytes.
  biological_scale: MOLECULAR
  chemical_entities:

- name: Tendon and Ligament Dermatan Sulfate Deficiency
  description: >-
    The decorin dermatan/chondroitin sulfate defect reaches tendon and ligament
    matrix, where shorter DS/CS chains on decorin impair its regulation of
    collagen fibrillogenesis. In Cant1 knock-out tendons this produces hypoplasia
    and abnormally large, angular collagen fibrils; the extension to human joint
    laxity is inferred from this mouse tendon data.
  biological_scale: TISSUE

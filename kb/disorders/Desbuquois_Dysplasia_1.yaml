  downstream:
  - target: Mitral valve prolapse
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Valve matrix proteoglycan deficiency is the proposed basis of mitral valve prolapse.
  - target: Aortic root dilatation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Aortic wall matrix proteoglycan deficiency is the proposed basis of aortic root dilatation.

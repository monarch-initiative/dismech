      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "The multiple joint dislocations associated with this genetic disorder may be attributed to tendon fragility resulting from CANT1 dysfunction."
      explanation: Proposes tendon fragility as the mechanism linking CANT1 loss to the joint laxity/dislocations, explicitly as an inference.
  - target: Multiple joint dislocations
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - ligamentous laxity
    description: Ligamentous laxity predisposes to dislocation of multiple joints.
- name: Cardiac Valve and Aortic Wall Proteoglycan Defect
  description: >-
    A matrix proteoglycan defect in the heart valves and aortic wall is the
    proposed basis of the cardiovascular involvement (mitral valve prolapse,
    aortic root and ascending aortic dilatation) reported in a DBQD cohort. The
    link is proposed on the strength of the systemic proteoglycan defect, not
    demonstrated in cardiovascular tissue.
  biological_scale: TISSUE
  evidence:
  - reference: PMID:40461715

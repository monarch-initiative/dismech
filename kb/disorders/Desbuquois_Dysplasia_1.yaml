  - reference: PMID:30439444
    reference_title: "Calcium activated nucleotidase 1 (CANT1) is critical for glycosaminoglycan biosynthesis in cartilage and endochondral ossification."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The observed proteoglycan defects caused deregulated chondrocyte proliferation and maturation in the growth plate resulting in the reduced skeletal growth."
    explanation: Links the proteoglycan defect to deregulated growth-plate proliferation and maturation.
  downstream:
  - target: Defective Endochondral Ossification
    causal_link_type: DIRECT
    description: A disorganised growth plate reduces the longitudinal growth produced by endochondral ossification.
  - target: Accelerated carpal and tarsal ossification
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Dysregulated chondrocyte proliferation and maturation produce abnormal,
      locally advanced ossification of the carpal and tarsal bones; why the
      disrupted growth plate yields accelerated rather than delayed ossification
      in these bones is not established.
  - target: Delta phalanx of the thumb
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The delta (triangular) thumb phalanx is a localized manifestation of the
      dysregulated chondro-osseous development, through intermediate steps that
      are not established.
  - target: Short metacarpals
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Short metacarpals (the Kim-variant hand pattern) arise from the same
      dysregulated growth-plate chondrocyte biology, through intermediate steps
      that are not established.
- name: Defective Endochondral Ossification
  description: >-
    Failure of the growth-plate program reduces endochondral bone formation,
    the proximate cause of the short, mis-shapen skeleton: severe short stature,
    short long bones, the characteristic proximal femur, and a small thorax with
    pulmonary hypoplasia.
  biological_scale: TISSUE

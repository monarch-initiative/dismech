- name: Reduced IHH signaling to periocular mesenchyme and RPE
  description: >-
    IHH is made by non-pigmented cells of the developing choroid next to the
    retinal pigment epithelium and acts on the periocular mesenchyme and the RPE
    itself, where it is required for normal RPE pigmentation and for the
    mesenchymal condensation that forms the sclera. Reduced hedgehog input to
    that compartment disturbs the retina-periocular mesenchyme interaction on
    which optic fissure closure depends, which is how a regulatory lesion at the
    IHH locus reaches the same final common pathway as the coding MAC genes.

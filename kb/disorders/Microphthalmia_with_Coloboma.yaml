name: Microphthalmia with Coloboma
creation_date: "2026-06-15T00:00:00Z"
description: >-
  Microphthalmia with coloboma is a congenital structural eye malformation in
  which a small eye (microphthalmia) is combined with a colobomatous defect —
  missing ocular tissue, classically inferonasal, that results from failure of
  the embryonic optic (choroid) fissure to close. It sits within the
  microphthalmia–anophthalmia–coloboma (MAC, also called AMC) spectrum and is
  curated here in its isolated / non-syndromic form, distinct from the
  syndromic microphthalmia entries (e.g. STRA6-related Matthew-Wood syndrome,
  CHARGE syndrome). The disorder is genetically heterogeneous: dominant,
  recessive, and X-linked alleles in eye-development transcription factors and
  signaling genes (SOX2, OTX2, PAX6, MAB21L2, FOXE3, ALDH1A3, FZD5, and others),
  copy-number variants, and non-coding regulatory variants all converge on
  disrupted optic-cup morphogenesis and optic-fissure closure. MAC accounts for
  roughly 15–20% of severe childhood visual impairment and blindness worldwide.
category: Mendelian
parents:
- hereditary disease
- developmental eye disorder
synonyms:
- MAC spectrum
- microphthalmia-anophthalmia-coloboma spectrum
- AMC spectrum
- isolated microphthalmia with coloboma
- colobomatous microphthalmia
disease_term:
  preferred_term: Microphthalmia with coloboma
  term:
    id: MONDO:0000170
    label: microphthalmia, isolated, with coloboma
notes: >-
  Scope: this entry covers the ISOLATED / non-syndromic MAC presentation
  centered on the optic-fissure-closure defect mechanism. Syndromic forms in
  which MAC is one feature of a multisystem disorder (Matthew-Wood/STRA6,
  CHARGE, branchiooculofacial syndrome, etc.) are curated as their own entries
  and are referenced here only as differential diagnoses. The numbered MCOPCB
  (microphthalmia/coloboma) OMIM loci and the gene-defined forms are modeled as
  subtypes. GeneReviews has a retired "Microphthalmia/Anophthalmia/Coloboma
  Spectrum" chapter (PMID:20301552) used as the clinical baseline. The MCOPCB13 arm (MONDO:0975809, OMIM 620968) is curated here as the
  IHH-Enhancer-MCOPCB13 subtype rather than as its own disease entry: its MONDO
  parent is this entry's own term, its clinical picture is isolated MAC
  indistinguishable from the rest of the spectrum, and both this file and
  Isolated_Anophthalmia-Microphthalmia_Syndrome already state that the numbered
  MCOPCB loci belong here. The stub for it named NHEJ1 as the causal gene;
  that is a positional artifact of where the variant's coordinates fall, and
  the gene whose expression is disturbed is IHH. NHEJ1's own established
  disease is Cernunnos-XLF deficiency, curated separately as
  Cernunnos-XLF_deficiency, and nothing about DNA double-strand-break repair is
  claimed here.

  MCOPCB SERIES RECONCILIATION (OLS4, 2026-09-25). MONDO:0000170 has twelve
  hierarchical descendants, the numbered MCOPCB loci 1 to 11 and 13; MONDO has
  no MCOPCB12 term. Five carry a causal gene edge and are curated here as
  gene-bound subtype rows: MCOPCB7 (MONDO:0013783, ABCB6), MCOPCB9
  (MONDO:0014059, TENM3), MCOPCB10 (MONDO:0014635, RBP4), MCOPCB11
  (MONDO:0958239, FZD5) and MCOPCB13 (MONDO:0975809, recorded by MONDO against
  NHEJ1 and curated here against IHH for the reason given above). A sixth,
  MCOPCB5 (MONDO:0012709, SHH), is deliberately not duplicated here: it is
  already anchored as a skos:closeMatch on SHH_Holoprosencephaly_Spectrum, whose
  Microform HPE subtype covers microphthalmia with coloboma as the mild end of
  the SHH holoprosencephaly spectrum, and the report OMIM indexes for this locus
  describes iris and uveoretinal colobomas without microphthalmia. The remaining
  six descendants - MCOPCB1 (MONDO:0024549), MCOPCB2 (MONDO:0011589), MCOPCB3
  (MONDO:0012408), MCOPCB4 (MONDO:0009630), MCOPCB6 (MONDO:0013376) and MCOPCB8
  (MONDO:0800324) - carry no causal gene edge in MONDO and are mapped loci
  rather than gene-defined entities, so no row is created for them.

  Two of the gene-disease relationships curated here are weak, and are labelled
  rather than presented as settled. ClinGen rates ABCB6 for MCOPCB7 Limited, and
  TENM3 rests on a single consanguineous pedigree with no ClinGen assertion at
  all. Across the eleven genes in this entry the committed ClinGen gene-validity
  snapshot carries assertions for only four - ABCB6, MAB21L2, PAX6 and FOXE3 -
  and apart from ABCB6/MCOPCB7 every one of them is against a different disease
  term: MAB21L2 against colobomatous microphthalmia-rhizomelic dysplasia
  syndrome (Definitive), PAX6 against PAX6-related ocular dysgenesis
  (Definitive), and FOXE3 against anterior segment dysgenesis (Moderate) and
  familial thoracic aortic aneurysm and aortic dissection (Moderate). ClinGen is
  therefore largely silent on the isolated MAC concept this entry models, and
  absence of an assertion here is not evidence against a gene.


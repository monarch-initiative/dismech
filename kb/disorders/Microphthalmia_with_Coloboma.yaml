- name: MCOPCB10
  display_name: Microphthalmia with coloboma 10 — RBP4 (OMIM:616428)
  subtype_term:
    preferred_term: microphthalmia, isolated, with coloboma 10
    term:
      id: MONDO:0014635
      label: microphthalmia, isolated, with coloboma 10
  description: >-
    Dominant eye malformation caused by RBP4 missense variants, with a mode of
    inheritance unlike anything else in this entry. RBP4 encodes serum retinol
    binding protein, which delivers retinol from hepatic stores to the placenta
    and the fetal eye. The disease alleles bind retinol poorly but bind the cell
    surface receptor STRA6 more tightly, so the mutant protein occupies STRA6
    without delivering its cargo. Because a transmitting mother's circulating
    mutant protein blocks retinol delivery at the placenta as well as in the
    fetus, penetrance is incomplete and maternal transmission raises the
    probability that an allele-carrying fetus is affected — a maternal effect the
    authors distinguish from imprinting and from oocyte-derived mRNA. The
    separate recessive RBP4 phenotype, in which serum RBP4 is undetectable and
    the result is a progressive retinal dystrophy rather than a malformation, is
    curated as Progressive_Retinal_Dystrophy_Due_To_Retinol_Transport_Defect.
  genes:
  - preferred_term: RBP4
    term:
      id: hgnc:9922
      label: RBP4
  evidence:
  - reference: PMID:25910211
    reference_title: "Biochemical Basis for Dominant Inheritance, Variable Penetrance, and Maternal Effects in RBP4 Congenital Eye Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "We identified missense mutations in RBP4, encoding serum retinol binding protein, in three families with eye malformations of differing severity, including bilateral anophthalmia."
    explanation: The gene-discovery report and the source of the phenotypic range stated here.
  - reference: PMID:25910211
    reference_title: "Biochemical Basis for Dominant Inheritance, Variable Penetrance, and Maternal Effects in RBP4 Congenital Eye Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "RBP normally delivers retinol from hepatic stores to peripheral tissues, including the placenta and fetal eye."
    explanation: >-
      The normal function this row's description states, and the reason a
      transmitting mother's protein can act at the placenta.
  - reference: PMID:25910211
    reference_title: "Biochemical Basis for Dominant Inheritance, Variable Penetrance, and Maternal Effects in RBP4 Congenital Eye Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "The mutant phenotypes exhibit dominant inheritance, but incomplete penetrance. Maternal transmission significantly increases the probability of phenotypic expression."
    explanation: >-
      The inheritance pattern this row records, including the maternal effect
      that separates it from ordinary autosomal dominant transmission.
  - reference: PMID:25910211
    reference_title: "Biochemical Basis for Dominant Inheritance, Variable Penetrance, and Maternal Effects in RBP4 Congenital Eye Disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "By occupying STRA6 nonproductively, the dominant-negative proteins disrupt vitamin A delivery from wild-type proteins within the fetus, but also, in the case of maternal transmission, at the placenta."
    explanation: >-
      The biochemical mechanism behind both the dominant-negative action and the
      maternal effect, which is what makes this row's inheritance claim
      mechanistic rather than descriptive.
- name: IHH-Enhancer-MCOPCB13
  display_name: Microphthalmia/coloboma 13 (IHH enhancer variant hosted in an NHEJ1 intron)
  subtype_term:
    preferred_term: Microphthalmia/coloboma 13
    term:
      id: MONDO:0975809
      label: microphthalmia/coloboma 13
  description: >-
    Autosomal recessive isolated MAC reported in two consanguineous Jewish
    Iranian pedigrees from the Mashhad region. The homozygous founder allele is
    a deep intronic single-nucleotide variant in NHEJ1
    (NM_024782.2:c.588+18131A>G) that is not predicted to affect NHEJ1 itself:
    it sits inside "i8", a conserved enhancer of the neighbouring gene IHH.
    Transgenic mouse reporter assays and chicken ATAC-seq/electroporation show
    that i8 drives expression in the developing eye and that the patient allele
    abolishes that eye-specific activity, so the gene whose expression is
    disturbed is IHH and NHEJ1 is only the element's host. Ocular features range
    from optic disc coloboma to microphthalmia and anophthalmia and differ
    between the two eyes of the same patient; no skeletal or cranial abnormality
    was reported, even though the same enhancer cluster is required for IHH
    expression in limb and skull.
  genes:
  - preferred_term: IHH
    term:
      id: hgnc:5956
      label: IHH
  evidence:
  - reference: PMID:37580330
    reference_title: "IHH enhancer variant within neighboring NHEJ1 intron causes microphthalmia anophthalmia and coloboma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a spectrum of isolated ocular manifestations, ranging from a milder phenotype of optic nerve coloboma to a severe phenotype of microphthalmia and even anophthalmia"
    explanation: >-
      Defines the subtype's ocular spectrum in the two reported pedigrees.
  - reference: PMID:37580330
    reference_title: "IHH enhancer variant within neighboring NHEJ1 intron causes microphthalmia anophthalmia and coloboma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "None of the affected individuals had skeletal or cranial abnormalities."
    explanation: >-
      Supports classifying this subtype as isolated rather than syndromic MAC,
      despite the enhancer cluster's known skeletal role.
  - reference: PMID:37580330
    reference_title: "IHH enhancer variant within neighboring NHEJ1 intron causes microphthalmia anophthalmia and coloboma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "an intronic founder variant in NHEJ1, not predicted to affect NHEJ1"
    explanation: >-
      States that the causal allele is not an NHEJ1 functional variant, which is
      why this subtype is named for the IHH enhancer rather than for NHEJ1.

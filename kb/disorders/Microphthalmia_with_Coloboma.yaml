- name: IHH i8 enhancer disruption
  description: >-
    In microphthalmia/coloboma 13 the initiating lesion is a homozygous deep
    intronic substitution, NHEJ1 NM_024782.2:c.588+18131A>G, that falls inside a
    conserved non-coding element of the IHH enhancer cluster named "i8". The
    element was originally characterised as a limb enhancer; the human variant
    lies at a position overlapped by a predicted transcription-factor binding
    motif and by the summit of the chromatin-accessibility peak seen in
    developing chicken retinal pigment epithelium. Wild-type i8 drives reporter
    expression in the eye of transgenic mouse embryos at E11.5 and the patient
    allele does not, so the molecular consequence is loss of eye-specific
    enhancer output rather than any change to NHEJ1 protein. Because the same
    cluster remains able to support IHH expression in limb and skull, the
    expression defect is restricted to a subset of tissues.
  biological_scale: MOLECULAR

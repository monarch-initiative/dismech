- name: RBP4
  association: Causal dominant-negative variant with incomplete penetrance and a maternal effect
  subtype: MCOPCB10
  gene_term:
    preferred_term: RBP4
    term:
      id: hgnc:9922
      label: RBP4
  relationship_type: CAUSATIVE
  notes: >-
    RBP4 encodes serum retinol binding protein, which carries retinol from
    hepatic stores to peripheral tissues including the placenta and the fetal
    eye. The malformation alleles bind retinol poorly yet bind the cell-surface
    receptor STRA6 with higher affinity, so they occupy the receptor without
    delivering vitamin A; that is the dominant-negative step. A transmitting
    mother's mutant protein acts at the placenta as well as in the fetus, so
    maternal transmission raises the chance an allele-carrying fetus is affected,
    and the authors present this as a mode of maternal inheritance distinct from
    imprinting and from oocyte-derived mRNA. This is a distinct RBP4 phenotype
    from the recessive one in which serum RBP4 is undetectable and the result is
    a progressive retinal dystrophy, curated as
    Progressive_Retinal_Dystrophy_Due_To_Retinol_Transport_Defect. The committed
    ClinGen gene-validity snapshot carries no assertion for RBP4.

animal_models:
- species: Dog
  genotype: Homozygous 7.8 kb deletion in NHEJ1 intron 4 (Collie eye anomaly allele)
  category: Naturally occurring
  description: >-
    Collie eye anomaly is a naturally occurring autosomal recessive canine
    ocular malformation - choroidal hypoplasia with optic nerve head coloboma -
    that maps to a homozygous 7.8 kb deletion inside an intron of the canine
    NHEJ1 orthologue. The human MCOPCB13 report placed that canine deletion on
    the human genome and found it removes a different member of the same IHH
    enhancer cluster, i9, where the human variant disrupts i8. The dog is
    therefore a natural experiment in the same enhancer cluster, at a
    neighbouring element, with a lesion of a different class.
  publication: PMID:17916641
  modeled_mechanisms:
  - target: Failure of optic fissure closure
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      The affected dog shows optic nerve head coloboma with choroidal
      hypoplasia, so it reproduces the failure-of-optic-fissure-closure outcome
      after a lesion in the same intronic enhancer cluster. It is partial
      because the canine disease is confined to the posterior pole and does not
      include the microphthalmia or anophthalmia seen in MCOPCB13.
    limitations: >-
      The canine lesion is a 7.8 kb deletion of i9, not the human single
      nucleotide substitution in i8, so it does not model the human allele. The
      canine deletion's own causal status is contested: it is discordant with
      the phenotype in some breeds and populations, where it behaves as a linked
      marker rather than the causal variant. IHH has not been shown to be the
      canine target; the 2007 report describes the deleted sequence as a
      conserved protein-binding domain without naming a regulated gene.
    divergences:
    - divergence_type: CAUSE_UNREPRESENTED
      materiality: QUALIFYING
      description: >-
        The element disrupted is i9 in the dog and i8 in the human patients,
        and the canine lesion is a 7.8 kb deletion rather than a single
        nucleotide substitution. These are separate enhancers of the same
        cluster, so the MCOPCB13 allele is not encoded in this model and the
        dog does not report on the activity of the element that is lesioned in
        MCOPCB13.
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        Optic fissure closure is read out in the canine eye. Dogs have no
        macula and a tapetal fundus, and the canine phenotype is choroidal
        hypoplasia with optic nerve head coloboma rather than the microphthalmia
        and anophthalmia that dominate the human pedigrees, so the severity and
        distribution of the human malformation are not reproduced.
    evidence:
    - reference: PMID:17916641
      reference_title: "Breed relationships facilitate fine-mapping studies: a 7.8-kb deletion cosegregates with Collie eye anomaly across multiple dog breeds."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Sequence analysis revealed that all affected dogs share a homozygous deletion of 7.8 kb in the NHEJ1 gene. This intronic deletion spans a highly conserved binding domain to which several developmentally important proteins bind."
      explanation: >-
        Establishes the canine lesion as a deletion of conserved regulatory
        sequence inside an NHEJ1 intron rather than an NHEJ1 coding lesion.
    - reference: PMID:37580330
      reference_title: "IHH enhancer variant within neighboring NHEJ1 intron causes microphthalmia anophthalmia and coloboma."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: "it encompasses another experimentally verified enhancer of Ihh (in mice), termed 'i9' by Will et al"
      explanation: >-
        The human report's own mapping of the canine deletion onto the IHH
        enhancer cluster, which is what makes the dog informative here.
    - reference: PMID:26732749
      reference_title: "Discrepancy in compliance between the clinical and genetic diagnosis of choroidal hypoplasia in Danish Rough Collies and Shetland Sheepdogs."
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: "the intronic deletion in NHEJ1 is not the causative mutation but, rather, a marker linked to the locus underlying the trait in some populations"
      explanation: >-
        Argues the canine deletion is a linked marker rather than the causal
        variant in Danish Rough Collies, which limits how far this model can be
        pushed as corroboration.
  evidence:
  - reference: PMID:28702949
    reference_title: "Genetic analysis of optic nerve head coloboma in the Nova Scotia Duck Tolling Retriever identifies discordance with the NHEJ1 intronic deletion (collie eye anomaly mutation)."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: "Collection of ONH coloboma-affected NSDTR showed lack of concordance of the NHEJ1 intronic deletion with ONH coloboma"
    explanation: >-
      A second breed in which optic nerve head coloboma does not track with the
      deletion, recorded here so the cross-species argument is not read as
      stronger than it is.
discussions:
- discussion_id: mcopcb13_ihh_enhancer_human_evidence
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Is IHH expression actually reduced in the human developing eye in
    microphthalmia/coloboma 13, or is the reduction inferred entirely from
    mouse and chicken assays of the enhancer?
  attaches_to:
  - pathophysiology#IHH i8 enhancer disruption
  - pathophysiology#Reduced IHH signaling to periocular mesenchyme and RPE
  rationale: >-
    Every step from the variant to reduced IHH output rests on non-human
    systems: a transgenic mouse reporter assay at E11.5, chicken RPE ATAC-seq
    and electroporation, and mouse genetics for the requirement of Ihh in RPE
    and scleral mesenchyme. No measurement of IHH transcript or protein in
    human ocular tissue from an affected individual has been reported, and the
    variant has been described in two related consanguineous pedigrees from one
    founder community, with no independent family reported since. The
    translational question is sharpened rather than settled by the human
    phenotype: the same enhancer cluster is required for IHH expression in limb
    and skull, yet the affected individuals have no skeletal or cranial
    abnormality, so either the element's eye and limb activities are separable
    sub-modules or the human allele spares the limb-active part. Neither
    possibility has been tested.
  notes: >-
    This is recorded as a model-to-human translation question rather than as an
    absent mechanism. The enhancer's eye activity, the allele's effect on it,
    and the dependence of periocular mesenchyme and RPE on Ihh are each
    supported by experiments; what is missing is a human tissue measurement and
    a second, unrelated family.

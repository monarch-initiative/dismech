name: Lone Star Virus Infection
creation_date: '2026-08-08T20:38:51Z'
category: Infectious Disease
synonyms:
- LSV infection
description: 'This is a provisional record for one published human observation associated with Lone Star
  virus. The report concerned an immunocompromised adult with fatal meningoencephalitis, but etiologic
  attribution remains uncertain: an initial cerebrospinal-fluid detection was reproduced only at the originating
  laboratory and was not reproduced by later testing at a second laboratory; additional confirmation was
  negative. The record does not define a general clinical spectrum, established human transmission route,
  diagnostic case definition, or established causal disease entity.'

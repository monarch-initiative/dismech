      tick source; NCBI Taxonomy remains the authority for the ontology identifier.
agent_life_cycle:
  description: What is recorded of the Lone Star virus cycle is one arthropod association and nothing
    more. The virus was isolated from, and is named for, the lone star tick Amblyomma americanum, which
    the literature describes as a putative vector; that tick feeds on a wide range of wild vertebrates,
    but no vertebrate reservoir has been identified, and transmission from the tick to humans has not
    been established. No reservoir host is recorded here, because none has been reported.
  hosts:
  - preferred_term: lone star tick
    role: Arthropod host from which the virus was originally isolated, described in the literature as
      a putative vector; vector competence is not established
    term:
      id: NCBITaxon:6943
      label: Amblyomma americanum
  - preferred_term: Homo sapiens
    role: Incidental host in two reported fatal meningoencephalitis cases detected by metagenomic sequencing;
      causation was not established
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  vectors:
  - Lone star tick (Amblyomma americanum), described in the literature as a putative vector
  life_cycle_stages:
  - name: Isolation from and association with the lone star tick
    description: The virus is known from isolation out of Amblyomma americanum. The tick feeds on many
      wild vertebrate hosts, but which of them if any maintains the virus has not been reported.
    evidence:
    - reference: PMID:23637969
      reference_title: The genome sequence of Lone Star virus, a highly divergent bunyavirus found in
        the Amblyomma americanum tick.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: an unclassified bunyavirus originally isolated from the lone star tick Amblyomma americanum
      explanation: 'Records the one firm fact about the cycle: the virus was isolated from this tick species.'
    - reference: PMID:23637969
      reference_title: The genome sequence of Lone Star virus, a highly divergent bunyavirus found in
        the Amblyomma americanum tick.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: americanum tick is well-suited as a zoonotic disease vector because it feeds on a wide
        assortment of wild animal hosts as well as humans.
      explanation: Establishes that the tick's vertebrate host range is broad, which is why no single
        reservoir can be named from the tick association alone.
  - name: Putative tick-borne transmission to humans
    description: The lone star tick is described as the putative vector to humans. The source hedges this
      assignment, and tick-to-human transmission of this virus has not been demonstrated.
    evidence:
    - reference: PMID:39983710
      reference_title: Two Human Cases of Fatal Meningoencephalitis Associated with Potosi and Lone Star
        Virus Infections, United States, 2020-2023.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: Both Heartland virus and LSV use A. americanum ticks as a putative tick vector.
      explanation: The source states the vector assignment as putative, which is the strength of claim
        this stage records.
  evidence:
  - reference: PMID:39983710
    reference_title: Two Human Cases of Fatal Meningoencephalitis Associated with Potosi and Lone Star
      Virus Infections, United States, 2020-2023.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Potosi virus has been isolated from mosquito vectors and Lone Star virus from tick vectors.
    explanation: Frames the cycle as tick-associated, which is the extent of what is recorded for this
      virus.
  notes: No reservoir or amplifying vertebrate host is recorded, and none is inferred from the tick's
    host range. Searches of the two sources this entry cites (PMID:23637969, PMID:39983710) found no reported
    vertebrate reservoir for Lone Star virus; both describe the tick association only. Record one here
    when a study reports it.

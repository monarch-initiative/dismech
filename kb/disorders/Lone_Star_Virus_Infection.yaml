treatments:
- name: Supportive Care
  description: No approved antiviral therapy exists for bunyavirus or Lone Star virus infection; management
    in the single reported case consisted of empiric antimicrobials during diagnostic evaluation followed
    by supportive inpatient care and comfort measures.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:39983710
    reference_title: Two Human Cases of Fatal Meningoencephalitis Associated with Potosi and Lone Star
      Virus Infections, United States, 2020-2023.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Although no approved treatment for bunyavirus infection is available, the experimental drug
      favipravir (T-705) is effective against orthobunyaviruses in vitro and in rodent models (25–28)
      and efficiently crosses the blood–brain barrier (29).
    explanation: Establishes that no approved antiviral treatment exists for bunyavirus infections.
  - reference: PMID:39983710
    reference_title: Two Human Cases of Fatal Meningoencephalitis Associated with Potosi and Lone Star
      Virus Infections, United States, 2020-2023.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The patient remained confused and uncommunicative, and his neurologic status deteriorated
      such that he could no longer eat or walk. In discussions with his family, we decided to place the
      patient on comfort measures, and he died 26 days after admission.
    explanation: Documents supportive inpatient management and transition to comfort measures in Case
      2.
mechanistic_hypotheses:
- hypothesis_group_id: lsv_etiologic_attribution
  hypothesis_label: Lone Star virus etiologic attribution in the reported case
  status: EMERGING
  description: Lone Star virus may have caused or contributed to the reported fatal meningoencephalitis,
    but the detection was reproduced only at the originating laboratory and is insufficient to establish
    causality; later testing at a second laboratory did not confirm it.
  evidence:
  - reference: PMID:39983710
    reference_title: Two Human Cases of Fatal Meningoencephalitis Associated with Potosi and Lone Star
      Virus Infections, United States, 2020-2023.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: CSF mNGS testing, which we performed twice on a hospital day 3 sample, was positive for Lone
      star virus (LSV).
    explanation: Records the initial observation supporting an LSV association in the reported case without
      treating it as proof of etiology.
  - reference: PMID:39983710
    reference_title: Two Human Cases of Fatal Meningoencephalitis Associated with Potosi and Lone Star
      Virus Infections, United States, 2020-2023.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: Additional testing of residual CSF by CDC did not detect reads from LSV on mNGS, and confirmatory
      testing with viral isolation and plaque reduction neutralization testing was negative.
    explanation: The non-reproduced result and negative additional confirmation weaken a definitive etiologic
      interpretation.
discussions:
- discussion_id: lsv_etiologic_attribution_uncertainty
  prompt: Did Lone Star virus cause the fatal meningoencephalitis in the single reported human observation?
  kind: INTERPRETATION
  status: OPEN
  attaches_to:
  - mechanistic_hypotheses#lsv_etiologic_attribution
  - phenotypes#Meningoencephalitis
  rationale: The initial result supports an association, but later testing at a second laboratory did
    not reproduce it and other confirmation was negative. The source itself cautions that molecular detection
    alone does not establish causality in a highly susceptible host. Independent human observations and
    reproducible confirmation would be needed before asserting a causal entity or a broader clinical spectrum.
  evidence:
  - reference: PMID:39983710
    reference_title: Two Human Cases of Fatal Meningoencephalitis Associated with Potosi and Lone Star
      Virus Infections, United States, 2020-2023.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Because mNGS is a molecular detection technique and positive testing alone is insufficient
      to fulfill Koch’s postulates (23), caution is warranted with clinical interpretation of mNGS results,
      especially with detection of a novel agent of unclear pathogenicity in highly susceptible immunocompromised
      hosts.
    explanation: The authors explicitly limit the causal interpretation of the positive molecular result.
  - reference: PMID:39983710
    reference_title: Two Human Cases of Fatal Meningoencephalitis Associated with Potosi and Lone Star
      Virus Infections, United States, 2020-2023.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Additional testing of residual CSF by CDC did not detect reads from LSV on mNGS, and confirmatory
      testing with viral isolation and plaque reduction neutralization testing was negative.
    explanation: Documents the unresolved discordant confirmation.
- discussion_id: lsv_nonhuman_evidence_translation_gap
  prompt: Can currently available nonhuman studies establish a mechanism for human Lone Star virus infection?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - mechanistic_hypotheses#lsv_etiologic_attribution
  rationale: PPR:PPR1272399 contains nonhuman experimental findings but remains a 2026 preprint, so those
    findings are deliberately not modeled as disease mechanisms in this provisional human record. The
    peer-reviewed PMID:41636781 is an in vitro virus-host study and explicitly calls for further mechanistic
    work. Neither source independently confirms the single discordant human observation or establishes
    a mechanism in humans.
  evidence:
  - reference: PMID:41636781
    reference_title: Exploring the Relationship Between Lone Star Virus and Synaptogyrin-2 Using Novel
      Viral and Host Models of Infections.
    supports: NO_EVIDENCE
    evidence_source: IN_VITRO
    snippet: Our data illustrate key distinctions from previous Bandavirus reports and underline the need
      for future studies to explore the mechanisms of LSV replication and pathogenesis.
    explanation: The peer-reviewed in vitro report leaves LSV mechanisms unresolved and does not independently
      support a mechanism for human disease.
notes: No exact MONDO term for Lone Star virus infection was found, so disease_term is intentionally omitted
  rather than bound to a broader or invented concept. The exact agent is NCBITaxon:1219465 (Lone Star
  virus). PPR:PPR1272399 is the bioRxiv preprint posted on 2026-07-07 that triggered issue 6521; it is
  included as bibliographic provenance but supports no structured disease mechanism or human phenotype,
  diagnosis, transmission, or causality claim in this entry. PMID:39983710 is the peer-reviewed report
  of the single LSV-associated human observation. PMID:5810802 and PMID:23637969 provide foundational
  bibliographic provenance for the virus and its A. americanum association. PMID:41636781 was assessed
  but does not independently support human disease pathophysiology. The putative vector association is
  curated as virus ecology, not as an established route of human transmission. No experimental-model mechanism,
  LSV-specific treatment, or unsupported clinical generalization is curated.

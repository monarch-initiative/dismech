pathophysiology:
- name: Central Nervous System Inflammation
  biological_scale: TISSUE
  description: In the single reported immunocompromised adult (Case 2) with Lone Star virus sequences
    detected in cerebrospinal fluid on hospital day 3, central nervous system inflammation manifested
    with lymphocytic CSF pleocytosis (6 cells/mm3 on admission with 79% lymphocytes, 16% monocytes, and
    5% neutrophils, rising to 40 cells/mm3 on hospital day 3), elevated CSF protein (80-92 mg/dL), mild
    interval T2/FLAIR hyperintensity of the basal ganglia and posterior hippocampi on hospital day 14,
    and mild-to-moderate generalized EEG background slowing without seizure activity; whether Lone Star
    virus was the causal pathogen remains unconfirmed because CDC repeat mNGS, viral isolation, and serology
    were negative.
  locations:
  - preferred_term: central nervous system
    term:
      id: UBERON:0001017
      label: central nervous system
  - preferred_term: cerebrospinal fluid
    term:
      id: UBERON:0001359
      label: cerebrospinal fluid
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  evidence:
  - reference: PMID:39983710
    reference_title: Two Human Cases of Fatal Meningoencephalitis Associated with Potosi and Lone Star
      Virus Infections, United States, 2020-2023.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: CSF obtained on admission showed a lymphocytic pleocytosis with leukocyte count of 6 cells/mm3
      and 79% lymphocytes, 16% monocytes, and 5% neutrophils; elevated protein of 80 mg/dL, and unremarkable
      glucose of 66 mg/dL.
    explanation: Documents lymphocytic CSF pleocytosis and elevated CSF protein in Case 2 (the patient
      in whom LSV sequences were detected on hospital day 3).
  - reference: PMID:39983710
    reference_title: Two Human Cases of Fatal Meningoencephalitis Associated with Potosi and Lone Star
      Virus Infections, United States, 2020-2023.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We performed brain MRI 3 times; the first 2 results were unremarkable, but the third result,
      obtained on hospital day 14, showed mild interval hyperintensity of the basal ganglia and posterior
      hippocampi without contrast enhancement (Figure, panels C, D).
    explanation: Documents basal ganglia and posterior hippocampal MRI hyperintensity in Case 2.
  downstream:
  - target: Meningoencephalitis
    causal_link_type: DIRECT
    description: Central nervous system inflammation in the reported patient manifested clinically as
      fatal meningoencephalitis.

name: Lone Star Virus Infection
creation_date: "2026-08-08T20:38:51Z"
category: Infectious Disease
synonyms:
- LSV infection
description: >-
  This is a provisional record for one published human observation associated
  with Lone Star virus. The report concerned an immunocompromised adult with
  fatal meningoencephalitis, but etiologic attribution remains uncertain: an
  initial cerebrospinal-fluid detection was reproduced only at the originating
  laboratory and was not reproduced by later testing at a second laboratory;
  additional confirmation was negative. The record does not define a general
  clinical spectrum, established human transmission route, diagnostic case
  definition, or established causal disease entity.
parents:
- Viral Infection
references:
- reference: PMID:39983710
  title: Two Human Cases of Fatal Meningoencephalitis Associated with Potosi and Lone Star Virus Infections, United States, 2020-2023.
- reference: PPR:PPR1272399
  title: Reverse genetics and comparative pathogenesis of Lone star virus
- reference: PMID:5810802
  title: "Arbovirus studies in the Ohio-Mississippi Basin, 1964-1967. VII. Lone Star virus, a hitherto unknown agent isolated from the tick Amblyomma americanum (Linn)."
- reference: PMID:23637969
  title: "The genome sequence of Lone Star virus, a highly divergent bunyavirus found in the Amblyomma americanum tick."
- reference: PMID:41636781
  title: Exploring the Relationship Between Lone Star Virus and Synaptogyrin-2 Using Novel Viral and Host Models of Infections.
infectious_agent:
- name: Lone Star virus
  infectious_agent_term:
    preferred_term: Lone Star virus
    term:
      id: NCBITaxon:1219465
      label: Lone Star virus
  description: >-
    NCBI Taxonomy identifies NCBITaxon:1219465 as Lone Star virus, within the
    species Bandavirus amblyommae. This exact virus identity is used instead of
    similarly named tick-associated viruses.
  evidence:
  - reference: PMID:23637969
    reference_title: "The genome sequence of Lone Star virus, a highly divergent bunyavirus found in the Amblyomma americanum tick."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Here we sought to characterize the growth characteristics and genome of
      Lone Star virus (LSV), an unclassified bunyavirus originally isolated
      from the lone star tick Amblyomma americanum.
    explanation: >-
      The peer-reviewed genome report independently identifies the named virus
      and its original tick source; NCBI Taxonomy remains the authority for the
      ontology identifier.
transmission:
- name: Putative Amblyomma americanum vector association
  description: >-
    Lone Star virus has been isolated from Amblyomma americanum, and the human
    case-report authors describe that tick as a putative vector. This records
    virus ecology only; transmission from this tick to humans has not been
    established.
  evidence:
  - reference: PMID:23637969
    reference_title: "The genome sequence of Lone Star virus, a highly divergent bunyavirus found in the Amblyomma americanum tick."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Here we sought to characterize the growth characteristics and genome of
      Lone Star virus (LSV), an unclassified bunyavirus originally isolated
      from the lone star tick Amblyomma americanum.
    explanation: >-
      Isolation from A. americanum supports a tick association but does not by
      itself demonstrate a transmission route to humans.
  - reference: PMID:39983710
    reference_title: Two Human Cases of Fatal Meningoencephalitis Associated with Potosi and Lone Star Virus Infections, United States, 2020-2023.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Both Heartland virus and LSV use A. americanum ticks as a putative tick
      vector.
    explanation: >-
      The source explicitly hedges the vector assignment as putative; PARTIAL
      preserves that uncertainty and does not imply proven human transmission.
phenotypes:
- category: Neurologic
  name: Meningoencephalitis
  description: >-
    Fatal meningoencephalitis was reported in the single human observation
    associated with Lone Star virus. The association is not modeled as proven
    causation or as an established phenotype frequency.
  phenotype_term:
    preferred_term: Infectious encephalitis
    term:
      id: HP:0002383
      label: Infectious encephalitis
  context: >-
    One immunocompromised adult; no general Lone Star virus clinical spectrum
    can be inferred from this observation.
  evidence:
  - reference: PMID:39983710
    reference_title: Two Human Cases of Fatal Meningoencephalitis Associated with Potosi and Lone Star Virus Infections, United States, 2020-2023.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified 2 bunyaviruses, POTV and LSV, associated with fatal cases
      of meningoencephalitis in immunocompromised patients.
    explanation: >-
      The paper associates one of its two fatal cases with LSV. PARTIAL is used
      because association in a single case does not establish that LSV caused
      the syndrome or that it is a recurring LSV phenotype.
mechanistic_hypotheses:
- hypothesis_group_id: lsv_etiologic_attribution
  hypothesis_label: Lone Star virus etiologic attribution in the reported case
  status: EMERGING
  description: >-
    Lone Star virus may have caused or contributed to the reported fatal
    meningoencephalitis, but the detection was reproduced only at the
    originating laboratory and is insufficient to establish causality; later
    testing at a second laboratory did not confirm it.
  evidence:
  - reference: PMID:39983710
    reference_title: Two Human Cases of Fatal Meningoencephalitis Associated with Potosi and Lone Star Virus Infections, United States, 2020-2023.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CSF mNGS testing, which we performed twice on a hospital day 3 sample,
      was positive for Lone star virus (LSV).
    explanation: >-
      Records the initial observation supporting an LSV association in the
      reported case without treating it as proof of etiology.
  - reference: PMID:39983710
    reference_title: Two Human Cases of Fatal Meningoencephalitis Associated with Potosi and Lone Star Virus Infections, United States, 2020-2023.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Additional testing of residual CSF by CDC did not detect reads from LSV
      on mNGS, and confirmatory testing with viral isolation and plaque
      reduction neutralization testing was negative.
    explanation: >-
      The non-reproduced result and negative additional confirmation weaken a
      definitive etiologic interpretation.
discussions:
- discussion_id: lsv_etiologic_attribution_uncertainty
  prompt: >-
    Did Lone Star virus cause the fatal meningoencephalitis in the single
    reported human observation?
  kind: INTERPRETATION
  status: OPEN
  attaches_to:
  - mechanistic_hypotheses#lsv_etiologic_attribution
  - phenotypes#Meningoencephalitis
  rationale: >-
    The initial result supports an association, but later testing at a second
    laboratory did not reproduce it and other confirmation was negative. The
    source itself cautions that molecular detection alone does not establish
    causality in a highly susceptible host. Independent human observations and
    reproducible confirmation would be needed before asserting a causal entity
    or a broader clinical spectrum.
  evidence:
  - reference: PMID:39983710
    reference_title: Two Human Cases of Fatal Meningoencephalitis Associated with Potosi and Lone Star Virus Infections, United States, 2020-2023.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Because mNGS is a molecular detection technique and positive testing
      alone is insufficient to fulfill Koch’s postulates (23), caution is
      warranted with clinical interpretation of mNGS results, especially with
      detection of a novel agent of unclear pathogenicity in highly susceptible
      immunocompromised hosts.
    explanation: >-
      The authors explicitly limit the causal interpretation of the positive
      molecular result.
  - reference: PMID:39983710
    reference_title: Two Human Cases of Fatal Meningoencephalitis Associated with Potosi and Lone Star Virus Infections, United States, 2020-2023.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Additional testing of residual CSF by CDC did not detect reads from LSV
      on mNGS, and confirmatory testing with viral isolation and plaque
      reduction neutralization testing was negative.
    explanation: Documents the unresolved discordant confirmation.
- discussion_id: lsv_nonhuman_evidence_translation_gap
  prompt: >-
    Can currently available nonhuman studies establish a mechanism for human
    Lone Star virus infection?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - mechanistic_hypotheses#lsv_etiologic_attribution
  rationale: >-
    PPR:PPR1272399 contains nonhuman experimental findings but remains a 2026
    preprint, so those findings are deliberately not modeled as disease
    mechanisms in this provisional human record. The peer-reviewed
    PMID:41636781 is an in vitro virus-host study and explicitly calls for
    further mechanistic work. Neither source independently confirms the single
    discordant human observation or establishes a mechanism in humans.
  evidence:
  - reference: PMID:41636781
    reference_title: Exploring the Relationship Between Lone Star Virus and Synaptogyrin-2 Using Novel Viral and Host Models of Infections.
    supports: NO_EVIDENCE
    evidence_source: IN_VITRO
    snippet: >-
      Our data illustrate key distinctions from previous Bandavirus reports and
      underline the need for future studies to explore the mechanisms of LSV
      replication and pathogenesis.
    explanation: >-
      The peer-reviewed in vitro report leaves LSV mechanisms unresolved and
      does not independently support a mechanism for human disease.
notes: >-
  No exact MONDO term for Lone Star virus infection was found, so disease_term
  is intentionally omitted rather than bound to a broader or invented concept.
  The exact agent is NCBITaxon:1219465 (Lone Star virus). PPR:PPR1272399 is the
  bioRxiv preprint posted on 2026-07-07 that triggered issue 6521; it is included
  as bibliographic provenance but supports no structured disease mechanism or
  human phenotype, diagnosis, transmission, or causality claim in this entry.
  PMID:39983710 is the peer-reviewed report of the single LSV-associated human
  observation. PMID:5810802 and PMID:23637969 provide foundational
  bibliographic provenance for the virus and its A. americanum association.
  PMID:41636781 was assessed but does not independently support human disease
  pathophysiology. The putative vector association is curated as virus ecology,
  not as an established route of human transmission. No experimental-model
  mechanism, LSV-specific treatment, or unsupported clinical generalization is
  curated.

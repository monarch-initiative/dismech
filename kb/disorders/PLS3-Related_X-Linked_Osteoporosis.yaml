- name: Cortical and Trabecular Bone Deficit
  role: consequence
  biological_scale: TISSUE
  conforms_to: "osteoporosis_bone_resorption#Net Bone Loss and Skeletal Fragility"
  description: >-
    The structural end state, and one with a distinctive geometry. HR-pQCT in
    adults with PLS3 variants shows a large total bone area driven by an enlarged
    trabecular compartment with a small, thin cortex, low volumetric bone mineral
    density in both compartments, fewer and more widely separated trabeculae with
    normal trabecular thickness, and low failure load. Cortical porosity is
    normal, so the cortical deficit is one of thickness rather than of
    intracortical remodeling. Women deviate less from reference data than men.
  locations:
  - preferred_term: compact bone tissue
    term:
      id: UBERON:0001439
      label: compact bone tissue
  - preferred_term: trabecular bone tissue
    term:
      id: UBERON:0002483
      label: trabecular bone tissue
  biological_processes:
  - preferred_term: Bone remodeling
    term:
      id: GO:0046849
      label: bone remodeling
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:39658012
    reference_title: Bone microarchitecture and strength in men and women with PLS3 gene variants assessed with HR-pQCT.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In men, total bone area was large (median Z-score: 1.33 radius; 1.46 tibia)
      due to a large trabecular area (+1.73 radius; +1.87 tibia), while the
      cortical area was small (-2.61 radius; -2.84 tibia).
    explanation: >-
      The compartment-resolved geometry of the deficit, which a DXA areal density
      cannot show.
  - reference: PMID:39658012
    reference_title: Bone microarchitecture and strength in men and women with PLS3 gene variants assessed with HR-pQCT.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the largest deviations were found in trabecular number (-2.18 radius; -1.64
      tibia), trabecular separation (+2.32 radius; +1.65 tibia), and cortical
      thickness (-2.99 radius; -2.46 tibia), whereas trabecular thickness and
      cortical porosity were normal
    explanation: >-
      Locates the microarchitectural lesion in trabecular number and cortical
      thickness while excluding intracortical porosity, which constrains which
      mechanisms are plausible.
  - reference: PMID:39658012
    reference_title: Bone microarchitecture and strength in men and women with PLS3 gene variants assessed with HR-pQCT.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Additionally, failure load was low (-2.39 radius; -2.2 tibia).
    explanation: >-
      Converts the structural findings into a mechanical strength deficit, the
      quantity that actually predicts fracture.
  - reference: PMID:31678489
    reference_title: Mice lacking plastin-3 display a specific defect of cortical bone acquisition.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Remarkably however, the cortical thickness in both, tibia and femur, was
      significantly reduced in Pls3-deficient mice in all age groups.
    explanation: >-
      The cortical-thinning half of this node reproduces in Pls3-null mice at every
      age examined.
  downstream:
  - target: Reduced Bone Mineral Density
    causal_link_type: DIRECT
    description: >-
      Low volumetric density in both compartments is what densitometry measures as
      a low areal bone mineral density Z-score.
  - target: Recurrent Peripheral Fractures
    causal_link_type: DIRECT
    description: >-
      Reduced failure load at the distal radius and tibia is the mechanical basis
      for long-bone fragility fractures under ordinary loading.
  - target: Vertebral Compression Fractures
    causal_link_type: DIRECT
    description: >-
      Loss of trabecular number in the vertebral body, whose strength is
      trabecular-dominated, produces compression fractures from childhood.
phenotypes:
- category: Skeletal
  name: Reduced Bone Mineral Density
  frequency: FREQUENT
  description: >-
    Low areal bone mineral density at the lumbar spine and femoral neck, present
    from childhood in affected males. Most heterozygous females have normal
    densitometry, which is why a normal maternal scan does not exclude carrier
    status. The band is sex-driven rather than uniform: in the 28-patient Dutch
    cohort the 18 men had low lumbar spine and femoral neck Z-scores while only
    3 of 10 women had osteoporosis or osteopenia, so roughly three-quarters of
    variant carriers are affected overall.
  phenotype_term:
    preferred_term: Reduced bone mineral density
    term:
      id: HP:0004349
      label: Reduced bone mineral density
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:24616189
    reference_title: "Osteoporosis caused by mutations in PLS3: clinical and bone tissue characteristics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Lumbar spine areal bone mineral density (LS-aBMD) Z-scores ranged from -1.7
      to -3.5, but height was normal.
    explanation: >-
      Quantifies the densitometric deficit in affected boys and records that it is
      not accompanied by short stature.
  - reference: PMID:40353206
    reference_title: "Phenotypic and genetic characteristics of a Dutch cohort of patients with X-linked osteoporosis due to PLS3 genetic variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      had normal BMD, two had osteoporosis and one osteopenia. Moreover, men
      experienced a higher total number of fractures than women (men: 12.0, IQR:
      6.7, 18.5, women: 2.0, IQR: 0.7, 5.2).
    explanation: >-
      Shows that most adult heterozygous women in the largest cohort had normal
      bone mineral density, supporting the sex-dependent penetrance recorded here.

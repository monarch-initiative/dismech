biochemical:
- name: Serum dickkopf-1 (DKK1)
  presence: Elevated
  notes: >-
    Circulating DKK1, a secreted WNT antagonist, is significantly elevated in
    PLS3 variant carriers relative both to healthy family members and to WNT1
    osteoporosis patients. It is the only reported biochemical abnormality that
    is specific to this disease, and it is mechanistically interesting because it
    implies a link from an actin-bundling protein to WNT pathway inhibition. It is
    not a validated diagnostic assay.
  evidence:
  - reference: PMID:31968132
    reference_title: "Biomarkers in WNT1 and PLS3 Osteoporosis: Altered Concentrations of DKK1 and FGF23."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      DKK1 concentrations were significantly elevated in PLS3 mutation-positive
      subjects compared with WNT1 mutation-positive subjects
    explanation: >-
      Establishes the elevation and, by contrasting with the WNT1 group, that it is
      not a generic feature of monogenic osteoporosis.
  - reference: PMID:31968132
    reference_title: "Biomarkers in WNT1 and PLS3 Osteoporosis: Altered Concentrations of DKK1 and FGF23."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both intact and C-terminal FGF23 were significantly elevated in WNT1
      mutation-positive subjects (p = .039 and p = .027, respectively) and normal
      in PLS3 subjects.
    explanation: >-
      The reciprocal negative result: FGF23 separates WNT1 from PLS3 osteoporosis,
      so the two monogenic forms have distinguishable biochemical signatures.
- name: Conventional serum bone turnover markers
  presence: Normal
  notes: >-
    Standard formation and resorption markers are normal despite severe skeletal
    disease, which is consistent with the low, balanced turnover seen on
    histomorphometry. Clinically this means routine bone biochemistry cannot be
    used to screen for or monitor the disease.
  evidence:
  - reference: PMID:31968132
    reference_title: "Biomarkers in WNT1 and PLS3 Osteoporosis: Altered Concentrations of DKK1 and FGF23."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Results confirmed normal concentrations of conventional metabolic bone
      markers in both groups.
    explanation: >-
      Direct measurement of the conventional marker panel in 14 PLS3 variant
      carriers against 34 variant-negative relatives.
  - reference: PMID:28379384
    reference_title: Osteocyte Protein Expression Is Altered in Low-Turnover Osteoporosis Caused by Mutations in WNT1 and PLS3.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      DMP1, sclerostin, and phospho-β-catenin expression did not differ between
      groups.
    explanation: >-
      Tissue-level counterpart: the osteocyte regulatory proteins most often
      proposed as mechanistic mediators were not differentially expressed in PLS3
      bone relative to the WNT1 comparison group.
treatments:
- name: Bisphosphonate Therapy
  description: >-
    Oral alendronate or intravenous zoledronic acid, the mainstay of treatment.
    Both raise bone mineral density and zoledronic acid has been reported to
    reshape already-compressed vertebral bodies in a growing child. Note the
    mechanistic mismatch: bisphosphonates suppress resorption, but the underlying
    lesion here is a formation and mineralization defect with low turnover, so
    the density gain does not follow from correcting the mechanism. No trial has
    tested fracture reduction in this disease.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: alendronate
      term:
        id: CHEBI:2567
        label: alendronic acid
    - preferred_term: zoledronic acid
      term:
        id: CHEBI:46557
        label: zoledronic acid
  target_mechanisms:
  - target: Cortical and Trabecular Bone Deficit
    description: >-
      Antiresorptive therapy acts on the structural end state by slowing further
      loss, not on the upstream mineralization defect.
    evidence:
    - reference: PMID:24616189
      reference_title: "Osteoporosis caused by mutations in PLS3: clinical and bone tissue characteristics."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The 2 boys from family 1 received oral alendronate for 6 years, which
        normalized LS-aBMD.
      explanation: >-
        Densitometric normalisation under long-term oral alendronate in two
        affected boys; the outcome measured is bone mineral density, not fracture.
  evidence:
  - reference: PMID:28620780
    reference_title: A novel large fragment deletion in PLS3 causes rare X-linked early-onset osteoporosis and response to zoledronic acid.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Zoledronic acid treatment could significantly increase the Z-score of BMD and
      reshape the compressed vertebral bodies.
    explanation: >-
      Single-patient report of the intravenous option, including vertebral
      reshaping, which is the outcome that matters most in childhood spinal disease.
  - reference: PMID:40353206
    reference_title: "Phenotypic and genetic characteristics of a Dutch cohort of patients with X-linked osteoporosis due to PLS3 genetic variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Adult men demonstrated a 16.6% mean increase in the BMD of the lumbar spine
      (p = .03)
    explanation: >-
      Cohort-level confirmation of the densitometric response, in adult men mostly
      treated with oral bisphosphonates.
  - reference: PMID:37083757
    reference_title: Impaired bone strength and bone microstructure in a novel early-onset osteoporotic rat model with a clinically relevant PLS3 mutation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Treatment with alendronate (1.0 µg/kg/day) or teriparatide (40 µg/kg five
      times weekly) for 8 weeks significantly improves bone mass and bone
      microarchitecture, and bone strength is significantly increased after
      teriparatide treatment
    explanation: >-
      Controlled comparison in a rat carrying a patient-derived PLS3 deletion;
      both agents improve mass and microarchitecture, but only teriparatide
      significantly improved strength.
- name: Teriparatide
  description: >-
    Recombinant PTH(1-34), an anabolic agent, given off-label. A 24-month
    uncontrolled pilot in adults with WNT1 or PLS3 variants showed rises in
    formation and resorption markers and gains at the lumbar spine and femoral
    neck. Two cautions are recorded on the evidence itself: distal radius
    cortical volumetric density fell in the same study, and the histomorphometric
    osteoid response was less consistent in the PLS3 patients than in the WNT1
    patients - which is what a primary mineralization defect would predict.
  therapeutic_modality: PEPTIDE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: teriparatide
      term:
        id: NCIT:C61966
        label: Teriparatide
  target_mechanisms:
  - target: Low-Turnover Bone Remodeling
    description: >-
      An anabolic agent is the mechanistically motivated choice against a
      low-formation, low-turnover lesion, in contrast to antiresorptives.
    evidence:
    - reference: PMID:27732335
      reference_title: "Teriparatide Treatment in Patients With WNT1 or PLS3 Mutation-Related Early-Onset Osteoporosis: A Pilot Study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        All patients showed increases in formation markers procollagen type 1
        amino-terminal propeptide (90% to 398%) and osteocalcin (50% to 280%)
      explanation: >-
        Direct evidence that the drug lifts the suppressed formation limb, which
        is the mechanism this link asserts.
  evidence:
  - reference: PMID:27732335
    reference_title: "Teriparatide Treatment in Patients With WNT1 or PLS3 Mutation-Related Early-Onset Osteoporosis: A Pilot Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Lumbar spine BMD increased 5.2% to 7.9% in 5 patients and femoral neck BMD
      2.6% to 7.8% in 4 patients in 24 months.
    explanation: >-
      The primary densitometric result of the pilot study, in six adults of whom
      three carried the PLS3 c.73-24T>A splice variant.
  - reference: PMID:27732335
    reference_title: "Teriparatide Treatment in Patients With WNT1 or PLS3 Mutation-Related Early-Onset Osteoporosis: A Pilot Study."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Distal radius cortical volumetric BMD decreased 5.4% to 26.1%.
    explanation: >-
      A site-discordant loss at the cortical radius in the same study, quoted as a
      REFUTE item because it argues against an unqualified benefit claim - and the
      cortex is the compartment most affected in this disease.
  - reference: PMID:27732335
    reference_title: "Teriparatide Treatment in Patients With WNT1 or PLS3 Mutation-Related Early-Onset Osteoporosis: A Pilot Study."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In histomorphometric analyses, osteoid indices increased more consistently in
      patients with WNT1 vs PLS3 mutation.
    explanation: >-
      Genotype-differential tissue response; supports treating PLS3 osteoporosis as
      mechanistically distinct from WNT1 osteoporosis rather than as one
      monogenic-osteoporosis treatment class.
animal_models:
- name: Pls3-null mouse (cortical-restricted phenotype)
  species: Mouse
  genotype: Pls3 knockout
  publication: PMID:31678489
  description: >-
    Deep-phenotyped Pls3-deficient mice studied at several ages with undecalcified
    histology and bone-specific histomorphometry, the analysis missing from earlier
    micro-CT-only reports. The result is a selectively cortical model.
  modeled_mechanisms:
  - target: Cortical and Trabecular Bone Deficit
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces the cortical-thinning half of the human structural phenotype at
      every age examined, and nothing else.
    limitations: >-
      Trabecular bone mass and every histomorphometric parameter at 12 weeks were
      indistinguishable from wild-type littermates, whereas severe trabecular and
      vertebral disease is the dominant human finding. The authors themselves scope
      the model to cortical bone acquisition.
    readouts:
    - name: Cortical thickness of tibia and femur
      target: Cortical and Trabecular Bone Deficit
      description: Undecalcified histology and bone histomorphometry across age groups.
      direction: DECREASED
      interpretation: >-
        The one structural parameter that tracks the human disease in this model.
      evidence:
      - reference: PMID:31678489
        reference_title: Mice lacking plastin-3 display a specific defect of cortical bone acquisition.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Remarkably however, the cortical thickness in both, tibia and femur, was
          significantly reduced in Pls3-deficient mice in all age groups.
        explanation: Reports the measurement and its consistency across ages.
    - name: Trabecular bone mass
      target: Cortical and Trabecular Bone Deficit
      description: Undecalcified histology with full histomorphometry at 12 weeks.
      direction: UNCHANGED
      interpretation: >-
        A genuine negative result: the compartment most affected in patients is
        unaffected in this model.
      evidence:
      - reference: PMID:31678489
        reference_title: Mice lacking plastin-3 display a specific defect of cortical bone acquisition.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Surprisingly, we did not detect significant differences between wildtype
          and Pls3-deficient littermates with respect to trabecular bone mass, and
          the same was the case for all histomorphometric parameters determined at
          12 weeks of age.
        explanation: The negative trabecular and histomorphometric result.
    evidence:
    - reference: PMID:31678489
      reference_title: Mice lacking plastin-3 display a specific defect of cortical bone acquisition.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Pls3-deficiency in mice only recapitulates the cortical bone phenotype of
        individuals with X-linked osteoporosis by negatively affecting the early
        stage of cortical bone acquisition
      explanation: >-
        The authors' own scoping of what this model does and does not model, which
        is the basis for PARTIALLY_RECAPITULATES.
- name: Pls3-deficient mouse (bone vascular phenotype)
  species: Mouse
  genotype: Pls3 hemizygous null (Pls3y/-)
  publication: PMID:42432248
  description: >-
    Male hemizygous Pls3-null mice used in the endosteal single-cell mapping study
    to ask which cell type Pls3 acts through. The reported phenotype is vascular
    rather than osteoblast-intrinsic. The same model is curated in the
    osteoporosis_bone_resorption module against the generic module node; here it is
    linked to this disease's own vascular node.
  modeled_mechanisms:
  - target: Endosteal Vascular Niche Dysfunction
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Loss of the gene that causes this disease produces abnormal bone vasculature
      in mice, which is the entire observational basis of the vascular arm.
    limitations: >-
      No human study has examined bone vasculature in PLS3 variant carriers, so the
      translational step is untested; the authors state it as "might result from".
      Pls3 is expressed in osteoblast lineage cells as well as in the vasculature,
      so the model does not isolate the vascular contribution. Male hemizygous only,
      giving no information about heterozygous carriers.
    readouts:
    - name: Bone blood vessel size
      target: Endosteal Vascular Niche Dysfunction
      description: >-
        Anti-CD31 immunohistochemistry of mid-femur sections, confirmed by
        backscattered scanning electron microscopy and micro-CT.
      direction: DECREASED
      interpretation: >-
        Smaller bone blood vessels are the structural correlate of the vascular node.
      evidence:
      - reference: PMID:42432248
        reference_title: "Multiscale analysis and functional validation of the cellular and genetic determinants of skeletal disease."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          mice showed smaller blood vessels in bone compared to controls (CTRLs)
          (Fig. 6a), which was confirmed by backscattered scanning electron
          microscopy (SEM) and micro-CT analysis
        explanation: The measurement, across three independent modalities.
    evidence:
    - reference: PMID:42432248
      reference_title: "Multiscale analysis and functional validation of the cellular and genetic determinants of skeletal disease."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        These data suggest that X-linked osteoporosis might result from
        abnormalities in bone vasculature.
      explanation: >-
        Names this disease as the intended target of the inference; the hedged
        phrasing is why fidelity is MODERATE.
- name: PLS3 E10-16del rat
  species: Rat
  genotype: PLS3 E10-16del hemizygous (PLS3E10-16del/0)
  publication: PMID:37083757
  description: >-
    The only animal model carrying a patient-derived PLS3 allele - a deletion of
    exons 10-16 matching a reported human large-fragment deletion - rather than a
    complete gene knockout. Used both to phenotype and to compare antiresorptive
    with anabolic treatment.
  modeled_mechanisms:
  - target: Cortical and Trabecular Bone Deficit
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces thinner cortical bone and reduced mechanical strength at three
      ages.
    limitations: >-
      As with the mouse, the deficit is cortical and the bone phenotype is milder
      than the human disease; the authors attribute the mildness to residual
      truncated PLS3 protein, since exon 1-9 transcript levels were comparable to
      wild-type. Vertebral disease, the dominant human feature, is not the reported
      readout.
    readouts:
    - name: Femoral cortical thickness and failure loads
      target: Cortical and Trabecular Bone Deficit
      description: Micro-CT and three-point bending at 3, 6 and 9 months.
      direction: DECREASED
      interpretation: >-
        Couples the structural deficit to a measured loss of mechanical strength.
      evidence:
      - reference: PMID:37083757
        reference_title: Impaired bone strength and bone microstructure in a novel early-onset osteoporotic rat model with a clinically relevant PLS3 mutation.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          we have constructed a novel rat model with clinically relevant hemizygous
          E10-16del mutation in PLS3 (PLS3E10-16del/0) that recapitulates the
          osteoporotic phenotypes with obviously thinner cortical thickness
        explanation: Reports the structural and biomechanical measurements.
  - target: Low-Turnover Bone Remodeling
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces the reduced mineral apposition rate that is the defining
      histomorphometric abnormality in patients.
    limitations: >-
      Histomorphometry in this model was reported for long bone; the human
      measurements come from transiliac biopsy, so the skeletal site differs.
    readouts:
    - name: Mineral apposition rate
      target: Low-Turnover Bone Remodeling
      description: Dynamic bone histomorphometry.
      direction: DECREASED
      interpretation: >-
        The direct animal counterpart of the human low-formation finding.
      evidence:
      - reference: PMID:37083757
        reference_title: Impaired bone strength and bone microstructure in a novel early-onset osteoporotic rat model with a clinically relevant PLS3 mutation.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Histomorphometric analysis indicates a significantly lower mineral
          apposition rate in PLS3E10-16del/0 rats.
        explanation: Reports the measurement.
experimental_models:
- name: PLS3-knockdown MC3T3-E1 pre-osteoblast line
  experimental_model_type: CELL_LINE
  publication: PMID:38089885
  description: >-
    MC3T3-E1 murine pre-osteoblasts stably depleted of PLS3 by lentiviral shRNA,
    differentiated on polyacrylamide hydrogels spanning the stiffness range from
    unmineralized to mineralized bone. The system that separates matrix deposition
    from matrix mineralization and tests rescue with patient alleles.
  cell_types:
  - preferred_term: Pre-osteoblast
    term:
      id: CL:0000062
      label: osteoblast
  modeled_mechanisms:
  - target: Impaired Osteoblast Mechanosensation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      PLS3-depleted osteoblasts lose the scaling of cell size and focal-adhesion
      number and length with substrate stiffness that control cells show, and
      wild-type but not patient actin-bundling-defective PLS3 restores it.
    limitations: >-
      A murine immortalised pre-osteoblast line, not patient-derived cells, and
      substrate stiffness on a hydrogel is a proxy for the in vivo mineralizing
      front. Osteocyte mechanosensation, which senses fluid shear rather than
      substrate stiffness, is not modelled at all.
    readouts:
    - name: Cell spreading response to substrate stiffness
      target: Impaired Osteoblast Mechanosensation
      description: >-
        Cell area and focal-adhesion metrics on 6 kPa versus 100 kPa
        Matrigel-coated polyacrylamide hydrogels.
      direction: ABOLISHED
      interpretation: >-
        Loss of the stiffness response, rather than a shifted setpoint, is what
        makes this a mechanosensation defect.
      evidence:
      - reference: PMID:38089885
        reference_title: The actin-bundling protein, PLS3, is part of the mechanoresponsive machinery that regulates osteoblast mineralization.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          we observed that depletion of PLS3 rendered osteoblasts unresponsive to
          changes in ECM stiffness
        explanation: The measurement this readout records.
    - name: Rescue of spreading by wild-type versus patient PLS3 alleles
      target: Impaired Osteoblast Mechanosensation
      description: >-
        Re-expression of EGFP-tagged wild-type PLS3 or the patient alleles A368D,
        N446S and L478P in the knockdown background on stiff substrate.
      direction: RESTORED
      interpretation: >-
        Rescue by wild-type but not by bundling-defective patient alleles ties the
        cellular phenotype to the disease-causing molecular lesion.
      evidence:
      - reference: PMID:38089885
        reference_title: The actin-bundling protein, PLS3, is part of the mechanoresponsive machinery that regulates osteoblast mineralization.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Defective cell spreading of PLS3 KD cells on stiff substrates could be
          rescued by expression of wildtype PLS3, but not by expression of three
          PLS3 mutations that were identified in patients with early onset
          osteoporosis and that have aberrant actin-bundling activity.
        explanation: The allele-specific rescue experiment.
  - target: Defective Bone Matrix Mineralization
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces the human tissue finding that collagen matrix is deposited
      normally but is not subsequently mineralized.
    limitations: >-
      In vitro alizarin-red mineralization in a murine cell line; no osteoclasts,
      osteocytes, vasculature or mechanical loading are present.
    readouts:
    - name: Hydroxyapatite deposition on deposited collagen matrix
      target: Defective Bone Matrix Mineralization
      description: >-
        Picrosirius red for collagen and alizarin red for mineral over 1-3 weeks of
        osteogenic differentiation.
      direction: DECREASED
      interpretation: >-
        Collagen output is preserved while mineral output collapses, which is the
        in vitro image of the patient biopsy.
      evidence:
      - reference: PMID:38089885
        reference_title: The actin-bundling protein, PLS3, is part of the mechanoresponsive machinery that regulates osteoblast mineralization.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          depletion of PLS3 does not alter the first stage of osteoblast
          mineralization in which a collagen matrix is deposited, but severely
          affects the subsequent mineralization of that matrix
        explanation: The phase-resolved mineralization result.
diagnosis:
- name: Molecular Genetic Testing
  description: >-
    Diagnosis is established by identifying a hemizygous or heterozygous PLS3
    variant, in practice through a next-generation sequencing panel aimed at
    osteogenesis imperfecta and other monogenic bone disease rather than through
    a PLS3-directed test. Because PLS3 is absent from many first-line
    fragility-fracture panels, families are typically ascertained on the OI
    diagnostic pathway and reach the PLS3 diagnosis only once collagen genes
    return negative. Sequence analysis alone is not sufficient: partial and
    whole-gene PLS3 deletions are an established cause, so a panel without
    exon-level copy-number calling can return negative in an affected boy.
  diagnosis_term:
    preferred_term: next-generation sequencing panel for monogenic bone disease
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  results: Hemizygous (males) or heterozygous (females) PLS3 variant
  evidence:
  - reference: PMID:40353206
    reference_title: "Phenotypic and genetic characteristics of a Dutch cohort of patients with X-linked osteoporosis due to PLS3 genetic variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genetic analysis was performed, in most of the patients, through next
      generation sequencing (NGS), followed by analysis of variants implicated in
      OI and other monogenic bone diseases.
    explanation: >-
      Establishes the testing modality actually used to diagnose the largest
      reported cohort, and that PLS3 is reached through an OI-oriented panel.
  - reference: PMID:24088043
    reference_title: PLS3 mutations in X-linked osteoporosis with fractures.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      in an additional five families (described in less detail) referred for
      diagnosis or ruling out of osteogenesis imperfecta type I, a rare variant
      (rs140121121) in PLS3 was found
    explanation: >-
      Documents the referral route: these families entered testing as suspected
      osteogenesis imperfecta, which is why the diagnosis depends on PLS3 being
      present on the panel that is ordered.
  - reference: PMID:28777485
    reference_title: PLS3 Deletions Lead to Severe Spinal Osteoporosis and Disturbed Bone Matrix Mineralization.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we describe for the first time PLS3 deletions as the underlying cause
      for childhood-onset primary osteoporosis in 3 boys from 2 families.
    explanation: >-
      Establishes gene deletion as a disease-causing allele class, which is why
      a sequencing-only panel is an incomplete test for this gene.
- name: Bone Densitometry
  description: >-
    Dual-energy X-ray absorptiometry of the lumbar spine and femoral neck,
    reported as age- and sex-adjusted Z-scores, is the primary quantitative
    measure and the basis for monitoring. A normal scan does not exclude the
    diagnosis in a female carrier, and axial DXA can miss the appendicular
    cortical deficit that peripheral quantitative CT detects.
  diagnosis_term:
    preferred_term: dual-energy X-ray absorptiometry of lumbar spine and femoral neck
    term:
      id: NCIT:C48789
      label: Dual X-ray Absorptiometry
  results: Low lumbar spine and femoral neck areal BMD Z-scores in affected males
  evidence:
  - reference: PMID:40353206
    reference_title: "Phenotypic and genetic characteristics of a Dutch cohort of patients with X-linked osteoporosis due to PLS3 genetic variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      BMD measurements by DXA were for most of the patients performed using GE
      Lunar Prodigy Advance equipment (H8950AN enCORE, Version 17 SP4); Z-scores
      were calculated using equipment-specific and age- and sex adjusted
      reference data
    explanation: >-
      Specifies DXA as the densitometric modality and age- and sex-adjusted
      Z-scores as the reported metric in the largest cohort.
  - reference: PMID:24616189
    reference_title: "Osteoporosis caused by mutations in PLS3: clinical and bone tissue characteristics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, one of these mothers had low bone mass at the distal radius, as
      measured by peripheral quantitative computed tomography (pQCT).
    explanation: >-
      Shows that a carrier with unremarkable axial densitometry can still have a
      detectable peripheral cortical deficit, which is the limitation of relying
      on DXA alone to assess carriers.
- name: Transiliac Bone Biopsy with Histomorphometry
  description: >-
    Tetracycline-labelled transiliac biopsy resolves the tissue-level lesion and
    is the investigation that separates this disease from osteogenesis
    imperfecta. It shows accumulated unmineralized osteoid with a prolonged
    mineralizing lag time on a low-turnover background - the opposite
    mineralization direction to collagen type I defects.
  diagnosis_term:
    preferred_term: transiliac bone biopsy with tetracycline labelling
    term:
      id: NCIT:C15189
      label: Biopsy Procedure
  results: >-
    Increased osteoid volume and thickness, prolonged mineralizing lag time, low
    trabecular bone volume, normal-to-reduced osteoclast surface
  evidence:
  - reference: PMID:28777485
    reference_title: PLS3 Deletions Lead to Severe Spinal Osteoporosis and Disturbed Bone Matrix Mineralization.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Extensive analyses of a transiliac bone biopsy from 1 patient showed a
      prominent increase in osteoid volume, osteoid thickness, and in mineralizing
      lag time.
    explanation: >-
      The mineralization-defect signature that the biopsy is performed to
      demonstrate.
  - reference: PMID:24616189
    reference_title: "Osteoporosis caused by mutations in PLS3: clinical and bone tissue characteristics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Iliac bone histomorphometry in 2 patients showed low trabecular bone volume
      and a low osteoid maturation time but normal bone formation rate and
      osteoclast surface.
    explanation: >-
      Records the normal osteoclast surface, which is the histomorphometric
      finding that argues against a resorption-driven mechanism.
- name: Spinal Magnetic Resonance Imaging
  description: >-
    Spinal MRI detects the vertebral compression burden, which is present in both
    sexes from childhood and is systematically under-recognised because carriers
    are often asymptomatic. In the one systematic series the readers were blinded
    to genotype, so the reported findings are not the product of expectation.
  diagnosis_term:
    preferred_term: magnetic resonance imaging of the spine
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  results: Biconcave vertebral compression fractures, most abundant in upper thoracic spine
  evidence:
  - reference: PMID:32655496
    reference_title: PLS3 Mutations Cause Severe Age and Sex-Related Spinal Pathology.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we set out to evaluate their spinal pathology using magnetic resonance
      imaging (MRI)
    explanation: Establishes spinal MRI as the modality used to assess the vertebral disease.
  - reference: PMID:32655496
    reference_title: PLS3 Mutations Cause Severe Age and Sex-Related Spinal Pathology.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The MRIs were first independently assessed for spinal changes by an
      orthopedic surgeon and three experienced radiologists who were blinded to
      the subjects' genotype and phenotype.
    explanation: >-
      Records the blinded read, which is what makes the MRI findings usable as a
      diagnostic characterisation rather than a genotype-driven impression.
differential_diagnoses:
- name: Osteogenesis Imperfecta Type I
  description: >-
    The main clinical mimic: childhood fractures, low bone mineral density, blue
    sclerae and joint hypermobility occur in both, and PLS3 families have been
    referred for OI testing. The discriminating tissue finding is mineralization
    direction - collagen type I defects give hypermineralized matrix, PLS3 gives
    hypomineralized matrix with prolonged mineralizing lag time.
  evidence:
  - reference: PMID:24616189
    reference_title: "Osteoporosis caused by mutations in PLS3: clinical and bone tissue characteristics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      in contrast to bone fragility caused by mutations in collagen type I encoding
      genes, there is no hypermineralization of mineralized bone matrix
    explanation: >-
      The tissue-level discriminator between PLS3 osteoporosis and collagen-related
      osteogenesis imperfecta.
  - reference: PMID:24088043
    reference_title: PLS3 mutations in X-linked osteoporosis with fractures.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      in an additional five families (described in less detail) referred for
      diagnosis or ruling out of osteogenesis imperfecta type I, a rare variant
      (rs140121121) in PLS3 was found
    explanation: >-
      Documents that PLS3 families present through the OI diagnostic pathway, which
      is why the differential matters operationally.
- name: WNT1-Related Early-Onset Osteoporosis
  description: >-
    The other monogenic low-turnover early-onset osteoporosis, and the comparison
    group in most PLS3 biomarker and treatment studies. Distinguished
    biochemically - FGF23 is elevated in WNT1 and normal in PLS3, DKK1 the reverse
    - and by inheritance pattern.
  evidence:
  - reference: PMID:31968132
    reference_title: "Biomarkers in WNT1 and PLS3 Osteoporosis: Altered Concentrations of DKK1 and FGF23."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both intact and C-terminal FGF23 were significantly elevated in WNT1
      mutation-positive subjects (p = .039 and p = .027, respectively) and normal
      in PLS3 subjects.
    explanation: >-
      The biochemical discriminator between the two monogenic early-onset
      osteoporoses.
discussions:
- discussion_id: pls3_primary_cell_type
  kind: KNOWLEDGE_GAP
  prompt: >-
    Which bone cell type carries the primary lesion in PLS3-related osteoporosis -
    the osteoblast, the osteocyte, the osteoclast, or the endosteal vascular cell?
  attaches_to:
  - pathophysiology#PLS3 Loss of Actin-Bundling Function
  - pathophysiology#Impaired Osteoblast Mechanosensation
  - pathophysiology#Dysregulated Osteoclast NFATc1 Signaling
  - pathophysiology#Endosteal Vascular Niche Dysfunction
  rationale: >-
    PLS3 is expressed in osteoblasts, osteocytes and osteoclasts, and in bone
    endothelial and vascular smooth muscle cells, so expression cannot adjudicate.
    Each candidate arm has a study behind it and none has a conditional knockout.
    The four arms make different predictions - an osteoclast-primary mechanism
    predicts high turnover, which human biopsies contradict; an osteocyte-primary
    mechanism predicts altered sclerostin or DMP1, which the one human
    immunohistochemistry study did not find; the vascular arm predicts a bone
    vascular abnormality that has never been looked for in a patient. The
    resolving experiment is cell-type-conditional deletion, which has not been
    published for any lineage.
  proposed_experiments:
  - experiment_id: pls3_conditional_knockouts
    name: Lineage-restricted conditional Pls3 deletion series
    description: >-
      Generate osteoblast (Col1a1-Cre or Osx-Cre), osteocyte (Dmp1-Cre),
      osteoclast (Ctsk-Cre or LysM-Cre) and endothelial (Cdh5-CreERT2)
      conditional Pls3 knockouts on one background, phenotyped with the same
      undecalcified histology, dynamic histomorphometry, micro-CT and CD31 bone
      vascular imaging.
    decision_criterion: >-
      An arm is supported if its conditional deletion reproduces reduced mineral
      apposition rate and cortical thinning at a magnitude comparable to the
      germline null, and refuted if that lineage's deletion is
      indistinguishable from wild-type.
    would_support:
    - pathophysiology#Impaired Osteoblast Mechanosensation
    - pathophysiology#Endosteal Vascular Niche Dysfunction
    would_refute:
    - pathophysiology#Dysregulated Osteoclast NFATc1 Signaling
    supporting_outcome:
    - >-
        Osteoblast- or osteocyte-restricted deletion reproduces the low mineral
        apposition rate and cortical deficit; endothelial deletion reproduces the
        small-vessel phenotype and a bone deficit.
    refuting_outcome:
    - >-
        Only osteoclast-restricted deletion produces a bone phenotype, and it is
        resorption-dominant, which would overturn the low-turnover model built from
        human biopsies.
  evidence:
  - reference: PMID:32655496
    reference_title: PLS3 Mutations Cause Severe Age and Sex-Related Spinal Pathology.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the exact pathomechanisms of impaired PLS3 function in bone are still unknown
    explanation: >-
      Explicit statement from the field that the mechanism is unresolved, which is
      the gap this discussion records.
  - reference: PMID:37083757
    reference_title: Impaired bone strength and bone microstructure in a novel early-onset osteoporotic rat model with a clinically relevant PLS3 mutation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Immunohistochemical staining of femoral sections also unraveled that PLS3 was
      present in osteocytes, osteoblasts, and osteoclasts in cortical and
      trabecular bone of WT rats
    explanation: >-
      Shows that expression pattern cannot narrow the candidate cell types, which
      is why a conditional-deletion series rather than more expression work is
      proposed.
- discussion_id: pls3_mouse_human_mismatch
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Do the available Pls3 animal models reproduce human PLS3 osteoporosis well
    enough to support mechanistic inference, given that they are cortical-selective
    while the human disease is dominated by trabecular and vertebral collapse?
  attaches_to:
  - animal_models#Pls3-null mouse (cortical-restricted phenotype)
  - animal_models#PLS3 E10-16del rat
  - pathophysiology#Cortical and Trabecular Bone Deficit
  rationale: >-
    Deep-phenotyped Pls3-null mice show reduced cortical thickness at every age but
    no trabecular bone loss and no histomorphometric abnormality at 12 weeks; the
    patient-allele rat is likewise cortical and explicitly milder than the human
    disease. Patients, by contrast, present with severe vertebral compression from
    early childhood, and HR-pQCT finds the largest deviations in trabecular number
    and separation as well as cortical thickness. Two Pls3-null mouse studies also
    disagree with each other on osteoclasts. This is not a general caveat about
    mouse models: it means that the compartment where the human disease does its
    damage is the one the models do not reproduce, so any mechanism inferred from
    a mouse trabecular readout - including the osteoclast NFATc1 arm - is not
    anchored in the human phenotype.
  proposed_experiments:
  - experiment_id: pls3_vertebral_phenotyping
    name: Vertebral and site-matched phenotyping of Pls3 models
    description: >-
      Phenotype the vertebral bodies, not only long bones, in the Pls3-null mouse
      and the PLS3 E10-16del rat, using micro-CT trabecular morphometry and dynamic
      histomorphometry at the same skeletal site sampled in human transiliac and
      vertebral studies, with sex as an explicit variable.
    decision_criterion: >-
      Model fidelity is supported if vertebral trabecular number and mineral
      apposition rate are reduced in the models, and the mismatch stands if
      vertebral bone is spared as long bone trabecular bone was.
    would_support:
    - pathophysiology#Cortical and Trabecular Bone Deficit
    would_refute:
    - pathophysiology#Dysregulated Osteoclast NFATc1 Signaling
    supporting_outcome:
    - >-
        Vertebral trabecular deficits appear in both models, making them usable for
        mechanistic inference about the human spinal disease.
    refuting_outcome:
    - >-
        Vertebral bone is spared in both models, confining them to cortical bone
        acquisition and leaving the dominant human lesion without an animal model.
  evidence:
  - reference: PMID:31678489
    reference_title: Mice lacking plastin-3 display a specific defect of cortical bone acquisition.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Pls3-deficiency in mice only recapitulates the cortical bone phenotype of
      individuals with X-linked osteoporosis by negatively affecting the early
      stage of cortical bone acquisition
    explanation: >-
      The authors' own statement of the scope limit that this mismatch records.
  - reference: PMID:28777485
    reference_title: PLS3 Deletions Lead to Severe Spinal Osteoporosis and Disturbed Bone Matrix Mineralization.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The 3 patients presented in early childhood with severe spinal compression
      fractures involving all vertebral bodies.
    explanation: >-
      The human phenotype the models do not reproduce, stated at its most severe.
- discussion_id: pls3_bone_vasculature_in_humans
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is bone vasculature abnormal in humans carrying PLS3 loss-of-function variants,
    as it is in Pls3-deficient mice?
  attaches_to:
  - pathophysiology#Endosteal Vascular Niche Dysfunction
  - mechanistic_hypotheses#endosteal_vascular_niche_model
  rationale: >-
    The entire vascular arm rests on mouse and zebrafish observations plus a
    computationally predicted endothelial-to-osteoblast interaction. Transiliac
    bone biopsy is already part of the diagnostic workup in this disease, so
    vascular assessment could be added to material that is being collected anyway
    rather than requiring a new invasive procedure. Until it is done, the arm
    stays EMERGING and no human-anchored causal claim can be made from it.
  proposed_experiments:
  - experiment_id: pls3_human_bone_vascular_imaging
    name: Bone vascular assessment in PLS3 variant carriers
    description: >-
      Assess vessel density and calibre by CD31 immunohistochemistry on archived
      and prospectively collected transiliac biopsies from PLS3 variant carriers
      against age- and sex-matched controls, with dynamic contrast-enhanced MRI of
      marrow perfusion as a non-invasive comparator.
    decision_criterion: >-
      The vascular arm is supported if vessel calibre or density is reduced
      relative to matched controls, and weakened if bone vasculature is
      indistinguishable while the mineralization defect is present in the same
      biopsy.
    would_support:
    - pathophysiology#Endosteal Vascular Niche Dysfunction
    would_refute:
    - mechanistic_hypotheses#endosteal_vascular_niche_model
    supporting_outcome:
    - >-
        Reduced bone vessel calibre or density in carriers, matching the murine
        finding.
    refuting_outcome:
    - >-
        Normal bone vasculature alongside the expected osteoid and mineralization
        abnormalities, confining the vascular phenotype to the mouse.
  evidence:
  - reference: PMID:42432248
    reference_title: "Multiscale analysis and functional validation of the cellular and genetic determinants of skeletal disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These data suggest that X-linked osteoporosis might result from abnormalities
      in bone vasculature.
    explanation: >-
      The hypothesis, stated by its authors in hedged form, that this gap proposes
      to test in humans.
- discussion_id: pls3_antiresorptive_mechanism_mismatch
  kind: OPEN_QUESTION
  prompt: >-
    Why do antiresorptives raise bone mineral density in a disease whose tissue
    lesion is a formation and mineralization defect with low turnover, and do they
    reduce fractures?
  attaches_to:
  - treatments#Bisphosphonate Therapy
  - pathophysiology#Low-Turnover Bone Remodeling
  rationale: >-
    Bisphosphonates are first-line here and reliably raise densitometric measures,
    yet they suppress a resorption limb that histomorphometry shows is already
    low. Densitometric gain under an antiresorptive can reflect secondary
    mineralization of retained matrix rather than restored bone formation, which in
    a disease of defective mineralization is not obviously the same as improved
    strength. No study has reported fracture outcomes, and the one anabolic trial
    reported a cortical volumetric density loss at the radius. The question is
    practical, not academic: it determines whether antiresorptive or anabolic
    therapy should be first-line.
  evidence:
  - reference: PMID:37083757
    reference_title: Impaired bone strength and bone microstructure in a novel early-onset osteoporotic rat model with a clinically relevant PLS3 mutation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Treatment with alendronate (1.0 µg/kg/day) or teriparatide (40 µg/kg five
      times weekly) for 8 weeks significantly improves bone mass and bone
      microarchitecture, and bone strength is significantly increased after
      teriparatide treatment
    explanation: >-
      The only head-to-head comparison in a PLS3 model, and it separates mass from
      strength: both agents improved mass and microarchitecture, only the anabolic
      significantly improved strength.
  - reference: PMID:27732335
    reference_title: "Teriparatide Treatment in Patients With WNT1 or PLS3 Mutation-Related Early-Onset Osteoporosis: A Pilot Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Future studies are needed to evaluate whether observed changes translate to
      fracture resistance.
    explanation: >-
      The pilot study's own statement that densitometric response has not been
      shown to translate into fracture reduction, which is the core of this
      question.
notes: >-
  Ontology and scope notes.

  MONDO:0018315 "X-linked osteoporosis with fractures" carries Orphanet:391330,
  MedGen and UMLS cross-references but, as of this curation, no OMIM cross-reference
  and no gene association in MONDO, so the PLS3 link is asserted here from the
  primary literature rather than inherited from the ontology. The corresponding OMIM
  entity is bone mineral density quantitative trait locus 18 (BMND18); PLS3 itself is
  OMIM 300131.

  Relation to the osteoporosis_bone_resorption module. Three nodes declare
  conformance: Defective Bone Matrix Mineralization to Impaired Osteoblastic Bone
  Formation, Low-Turnover Bone Remodeling to Bone Remodeling Imbalance, and Cortical
  and Trabecular Bone Deficit to Net Bone Loss and Skeletal Fragility. The module's
  RANKL-Driven Osteoclastogenesis and Increased Osteoclastic Bone Resorption steps
  are deliberately not instantiated, because this disease reaches remodeling
  imbalance through a low-formation route with normal-to-reduced osteoclast activity.
  This entry is the first disorder conformer to the module's EMERGING
  Endosteal Vascular Niche Dysfunction node, which was added from Chai et al. 2026
  (PMID:42432248) - the same paper whose Pls3 mouse motivates the vascular arm here.

  Not curated. Sequence-level variant records are omitted: reported families almost
  all carry private alleles and the largest genotype-phenotype analysis found no
  variant-class rule, so a variant list would be a catalogue rather than a mechanism.
  Autism spectrum disorder has been reported in PLS3 carriers but the association has
  not been systematically studied and is not curated as a phenotype.

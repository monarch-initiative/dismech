  - reference: PMID:28777485
    reference_title: PLS3 Deletions Lead to Severe Spinal Osteoporosis and Disturbed Bone Matrix Mineralization.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Results from quantitative backscattered electron imaging and Raman
      microspectroscopy showed a significant hypomineralization of the bone.
    explanation: >-
      Two independent physical measurements of mineral content confirming the
      histomorphometric inference.
  - reference: PMID:38089885
    reference_title: The actin-bundling protein, PLS3, is part of the mechanoresponsive machinery that regulates osteoblast mineralization.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      depletion of PLS3 does not alter the first stage of osteoblast mineralization
      in which a collagen matrix is deposited, but severely affects the subsequent
      mineralization of that matrix
    explanation: >-
      Separates the two phases of bone formation and shows the defect is confined

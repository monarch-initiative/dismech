    snippet: >-
      in contrast to bone fragility caused by mutations in collagen type I encoding
      genes, there is no hypermineralization of mineralized bone matrix
    explanation: >-
      The explicit contrast with osteogenesis imperfecta that makes this a distinct
      tissue mechanism rather than a collagen disorder variant.

name: PLS3-Related X-Linked Osteoporosis
creation_date: "2026-09-02T00:00:00Z"
category: Mendelian
description: >-
  A monogenic, X-linked form of primary early-onset osteoporosis caused by
  loss-of-function variants in PLS3, which encodes the calcium-regulated
  actin-bundling protein plastin 3. Hemizygous males present in childhood with
  low bone mineral density, recurrent peripheral fractures and vertebral
  compression fractures, often progressing to thoracic kyphosis and height loss;
  heterozygous females range from unaffected to overtly osteoporotic. Unlike
  osteogenesis imperfecta, the lesion is not in type I collagen: bone matrix is
  laid down but is hypomineralized, with prolonged mineralizing lag time and low
  bone turnover. Which cell type carries the primary defect is unsettled - the
  osteoblast mineralization/mechanosensing arm, an osteoclast NKRF-NFkB-NFATc1
  arm seen in Pls3-null mice, and an emerging endosteal vascular arm are curated
  here as competing mechanistic hypotheses rather than as one settled chain.
parents:

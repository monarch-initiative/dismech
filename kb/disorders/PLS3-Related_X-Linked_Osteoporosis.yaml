prevalence:
- population: Worldwide, families reported in the literature
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population-based prevalence estimate exists. The literature count is the
    only occurrence measure available and is a lower bound on true frequency,
    since PLS3 is not on many first-line fragility-fracture gene panels.
  evidence:
  - reference: PMID:40353206
    reference_title: "Phenotypic and genetic characteristics of a Dutch cohort of patients with X-linked osteoporosis due to PLS3 genetic variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: To date, only 47 families have been described with 47 different genetic variants.
    explanation: >-
      Gives the cumulative published family count as of 2025, the basis for the
      ULTRA_RARE band and for recording this as a literature-case count rather
      than a rate.
  - reference: PMID:40353206
    reference_title: "Phenotypic and genetic characteristics of a Dutch cohort of patients with X-linked osteoporosis due to PLS3 genetic variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our cohort comprises of 28 patients from 11 families, 18 men and 10 women,
      with a different PLS3 variant in each family.
    explanation: >-
      The largest single reported series, which also shows the near
      one-variant-per-family allelic heterogeneity of the disease.
inheritance:
- name: X-linked
  description: >-
    X-linked inheritance with a dose-dependent, non-strictly-recessive
    phenotype. Hemizygous males are consistently and more severely affected;
    heterozygous females range from normal bone mineral density through
    osteopenia to overt osteoporosis with fractures, so carrier status is not
    clinically silent. PLS3 is at Xq23.
  inheritance_term:
    preferred_term: X-linked inheritance
    term:
      id: HP:0001417
      label: X-linked inheritance
  expressivity: VARIABLE
  evidence:
  - reference: PMID:25209159
    reference_title: A novel splice mutation in PLS3 causes X-linked early onset low-turnover osteoporosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Osteoporosis had its onset in childhood and was characterized by recurrent
      peripheral fractures, low bone mineral density (BMD), vertebral compression
      fractures, and significant height loss in adulthood. Males were in general
      more severely affected than females.
    explanation: >-
      Establishes both the childhood onset and the male-predominant severity
      gradient that the X-linked assignment rests on, in a large multigenerational
      pedigree.
  - reference: PMID:40353206
    reference_title: "Phenotypic and genetic characteristics of a Dutch cohort of patients with X-linked osteoporosis due to PLS3 genetic variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      had normal BMD, two had osteoporosis and one osteopenia. Moreover, men
      experienced a higher total number of fractures than women (men: 12.0, IQR:
      6.7, 18.5, women: 2.0, IQR: 0.7, 5.2).
    explanation: >-
      Quantifies the sex difference and shows that heterozygous females are
      mostly but not uniformly spared, which is why this is recorded as X-linked
      rather than X-linked recessive.
  - reference: PMID:24088043
    reference_title: PLS3 mutations in X-linked osteoporosis with fractures.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This variant was also associated with a risk of fracture among elderly
      heterozygous women that was two times as high as that among noncarriers
    explanation: >-
      Independent evidence that heterozygosity carries measurable fracture risk,
      supporting a dosage-sensitive rather than fully recessive X-linked model.
genetic:
- name: PLS3 loss-of-function variants
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: PLS3 (plastin 3, T-plastin)
    term:
      id: hgnc:9091
      label: PLS3
  notes: >-
    PLS3 (Xq23) encodes plastin 3, a calcium-regulated F-actin bundling protein
    of the plastin/fimbrin family with two N-terminal EF-hand domains and two
    tandem actin-binding domains. Reported disease alleles span nonsense,
    frameshift, splice, missense and whole- or partial-gene deletions, and each
    reported family typically carries a private variant. Missense alleles cluster
    in the actin-binding domains and have been shown biochemically to disturb
    calcium-sensitive actin bundling. No consistent genotype-phenotype rule has
    been established, although frameshift/nonsense alleles trend toward more
    deviant microarchitecture than missense alleles.
  evidence:
  - reference: PMID:24088043
    reference_title: PLS3 mutations in X-linked osteoporosis with fractures.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Plastin 3 (PLS3), a protein involved in the formation of filamentous actin
      (F-actin) bundles, appears to be important in human bone health, on the
      basis of pathogenic variants in PLS3 in five families with X-linked
      osteoporosis and osteoporotic fractures that we report here.
    explanation: >-
      The founding gene-disease report, identifying PLS3 as causative in five
      independent X-linked osteoporosis families.
  - reference: PMID:28777485
    reference_title: PLS3 Deletions Lead to Severe Spinal Osteoporosis and Disturbed Bone Matrix Mineralization.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In family 1, the 2 affected brothers had a deletion of exons 4-16
      (NM_005032) in PLS3, inherited from their healthy mother.
    explanation: >-
      Documents whole-exon deletion as a disease mechanism, establishing that
      the allelic spectrum extends beyond point variants to copy-number loss.
  - reference: PMID:40353206
    reference_title: "Phenotypic and genetic characteristics of a Dutch cohort of patients with X-linked osteoporosis due to PLS3 genetic variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No relation was found between types and locations of variants and various
      clinical endpoints in men, using data from our cohort and the literature.
    explanation: >-
      The largest genotype-phenotype analysis to date finds no variant-class rule
      for clinical outcome, which is why no allele-stratified subtypes are curated.
  - reference: PMID:39658012
    reference_title: Bone microarchitecture and strength in men and women with PLS3 gene variants assessed with HR-pQCT.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Men with frameshift/nonsense variants seemed to have more deviant trabecular
      and cortical microarchitecture and strength, at both scan locations, than
      those with missense/in-frame insertion variants.
    explanation: >-
      A hedged imaging-level trend in the opposite direction to the clinical-endpoint
      analysis above; recorded because it is the only reported allele-class signal,
      not because it establishes one.
mechanistic_hypotheses:
- hypothesis_group_id: osteoblast_mineralization_mechanosensing_model
  hypothesis_label: Osteoblast mineralization and mechanosensation defect
  status: CANONICAL
  description: >-
    PLS3 acts in the osteoblast/osteocyte lineage, where actin bundling at focal
    adhesions is required for the cell to sense the stiffening collagen matrix
    and to sustain the second, mineralizing phase of bone formation. Loss of
    PLS3 leaves collagen deposition intact but blocks mineralization, which is
    what patient bone biopsies show. This is the best-supported account and the
    one most directly anchored in human tissue.
- hypothesis_group_id: osteoclast_nkrf_nfatc1_model
  hypothesis_label: Osteoclast NKRF-NFkB-NFATc1 dysregulation
  status: ALTERNATIVE
  description: >-
    In Pls3-null mice the primary lesion is placed in the osteoclast: reduced
    nuclear NKRF de-represses Nfatc1 transcription and augments resorption. This
    predicts a high-resorption disease, which is the opposite of the low-turnover,
    reduced-osteoclast-number picture reported in human PLS3 bone biopsies, so it
    is curated as a competing account rather than as an additional step.
- hypothesis_group_id: endosteal_vascular_niche_model
  hypothesis_label: Endosteal vascular niche contribution
  status: EMERGING
  description: >-
    Cross-species single-cell mapping of the endosteal compartment places Pls3
    among genes expressed in bone endothelial and vascular smooth muscle cells,
    and Pls3-deficient mice have smaller bone blood vessels, with a pls3 zebrafish
    vascular phenotype preceding bone cells. Under this model the vascular lesion
    is upstream of the remodeling defect. Shares its identifier with the group of
    the same name in the osteoporosis_bone_resorption module, whose
    Endosteal Vascular Niche Dysfunction node this entry conforms to.
pathophysiology:
- name: PLS3 Loss of Actin-Bundling Function
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    Loss-of-function variants in PLS3 remove or disable plastin 3, a
    calcium-regulated F-actin bundling protein expressed in osteoblasts,
    osteocytes and osteoclasts and, in bone, also in vascular endothelial and
    smooth muscle cells. Patient-derived missense alleles retain protein but have
    aberrant calcium-sensitive actin-bundling activity, so the shared molecular
    lesion across nonsense, frameshift, deletion and missense alleles is loss of
    F-actin crosslinking rather than loss of the transcript alone.
  genetic_context:
    gene:
      preferred_term: PLS3
      term:
        id: hgnc:9091
        label: PLS3
    variant_origin: GERMLINE
    zygosity: HEMIZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Hemizygous in affected males; heterozygous in females, where the phenotype
      is variable rather than absent.
  molecular_functions:
  - preferred_term: F-actin binding by plastin 3
    term:
      id: GO:0051015
      label: actin filament binding
    modifier: DECREASED
  biological_processes:
  - preferred_term: Actin filament bundling
    term:
      id: GO:0051017
      label: actin filament bundle assembly
    modifier: DECREASED
  evidence:
  - reference: PMID:24088043
    reference_title: PLS3 mutations in X-linked osteoporosis with fractures.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Plastin 3 (PLS3), a protein involved in the formation of filamentous actin
      (F-actin) bundles, appears to be important in human bone health, on the
      basis of pathogenic variants in PLS3 in five families with X-linked
      osteoporosis and osteoporotic fractures that we report here.
    explanation: >-
      Names the molecular activity of the protein and ties its loss to the human
      bone phenotype, which is the claim this node makes.
  - reference: PMID:38089885
    reference_title: The actin-bundling protein, PLS3, is part of the mechanoresponsive machinery that regulates osteoblast mineralization.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Defective cell spreading of PLS3 KD cells on stiff substrates could be
      rescued by expression of wildtype PLS3, but not by expression of three PLS3
      mutations that were identified in patients with early onset osteoporosis and
      that have aberrant actin-bundling activity.
    explanation: >-
      Rescue with wild-type but not with patient actin-bundling-defective alleles
      is what makes loss of bundling, rather than loss of the protein per se, the
      operative molecular lesion.
  - reference: PMID:37083757
    reference_title: Impaired bone strength and bone microstructure in a novel early-onset osteoporotic rat model with a clinically relevant PLS3 mutation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Immunohistochemical staining of femoral sections also unraveled that PLS3
      was present in osteocytes, osteoblasts, and osteoclasts in cortical and
      trabecular bone of WT rats
    explanation: >-
      Establishes that the protein is present in all three bone cell lineages,
      which is why the downstream arms of this node are curated as competing
      cell-type hypotheses rather than resolved.
  downstream:
  - target: Impaired Osteoblast Mechanosensation
    causal_link_type: DIRECT
    hypothesis_groups:
    - osteoblast_mineralization_mechanosensing_model
    description: >-
      PLS3 localizes to the proximal end of mature focal adhesions where they
      transition into actin stress fibers, so loss of bundling activity is
      directly upstream of the cell's ability to read matrix stiffness.
  - target: Dysregulated Osteoclast NFATc1 Signaling
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    hypothesis_groups:
    - osteoclast_nkrf_nfatc1_model
    description: >-
      Via reduced nuclear translocation of the PLS3 interactor NKRF and
      consequent de-repression of Nfatc1. Demonstrated in mouse osteoclasts only.
  - target: Endosteal Vascular Niche Dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - endosteal_vascular_niche_model
    description: >-
      Pls3 is expressed in bone endothelial and vascular smooth muscle cells and
      its loss produces smaller bone blood vessels in mice; the intervening steps
      between actin bundling and vascular patterning are not defined.
- name: Impaired Osteoblast Mechanosensation
  role: amplifier
  biological_scale: CELLULAR
  description: >-
    In osteoblasts, PLS3 concentrates at focal adhesions, the structures through
    which the cell reads the stiffness of the extracellular matrix it is
    building. Osteoblasts depleted of PLS3 no longer scale their spreading or
    focal-adhesion number and length with substrate stiffness, so the
    feed-forward loop in which progressive matrix mineralization stiffens the
    substrate and drives further mineral deposition is broken. The same
    mechanosensory argument has been extended to osteocytes, where PLS3 is
    abundant in dendritic processes, but that step is inference rather than
    measurement in this disease.
  cell_types:
  - preferred_term: Osteoblast
    term:
      id: CL:0000062
      label: osteoblast
  - preferred_term: Osteocyte
    term:
      id: CL:0000137
      label: osteocyte
  biological_processes:
  - preferred_term: Cellular response to matrix stiffness
    term:
      id: GO:0071260
      label: cellular response to mechanical stimulus
    modifier: DECREASED
  evidence:
  - reference: PMID:38089885
    reference_title: The actin-bundling protein, PLS3, is part of the mechanoresponsive machinery that regulates osteoblast mineralization.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      we observed that depletion of PLS3 rendered osteoblasts unresponsive to
      changes in ECM stiffness
    explanation: >-
      The direct measurement behind this node: loss of PLS3 abolishes the
      osteoblast's stiffness response.
  - reference: PMID:38089885
    reference_title: The actin-bundling protein, PLS3, is part of the mechanoresponsive machinery that regulates osteoblast mineralization.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      PLS3 prominently localizes to focal adhesions (FAs), which are intricately
      linked to mechanosensation.
    explanation: >-
      Localizes the protein to the structure that carries the mechanosensory
      function, which is what makes this a mechanistic node rather than a
      correlation.
  - reference: PMID:28379384
    reference_title: Osteocyte Protein Expression Is Altered in Low-Turnover Osteoporosis Caused by Mutations in WNT1 and PLS3.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Abnormal osteocyte function may play a role in the pathogenesis of
      monogenetic forms of osteoporosis.
    explanation: >-
      Human iliac-crest immunohistochemistry framing osteocyte dysfunction as
      contributory; marked INDIRECT because the study's own PLS3-specific finding
      is that sclerostin, DMP1 and phospho-beta-catenin did not differ from the
      WNT1 comparison group.
  - reference: PMID:25209159
    reference_title: A novel splice mutation in PLS3 causes X-linked early onset low-turnover osteoporosis.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The mechanism whereby PLS3 affects bone health is unclear, but it may be
      linked to osteocyte dendrite function and skeletal mechanosensing.
    explanation: >-
      States the mechanosensing hypothesis explicitly as a hypothesis; quoted here
      so the node records that the osteocyte limb is proposed rather than shown.
  downstream:
  - target: Defective Bone Matrix Mineralization
    causal_link_type: DIRECT
    hypothesis_groups:
    - osteoblast_mineralization_mechanosensing_model
    description: >-
      Failure to respond to increasing matrix stiffness removes the feed-forward
      signal that sustains hydroxyapatite deposition on the already-deposited
      collagen scaffold.
- name: Endosteal Vascular Niche Dysfunction

  - reference: PMID:32655496
    reference_title: PLS3 Mutations Cause Severe Age and Sex-Related Spinal Pathology.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Bone tissue is characterized by low bone turnover with reduced osteoblast and

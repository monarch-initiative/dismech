- name: Low-Turnover Bone Remodeling
  role: effector
  biological_scale: TISSUE
  conforms_to: "osteoporosis_bone_resorption#Bone Remodeling Imbalance"
  description: >-
    Bone remodeling in PLS3-related osteoporosis is slow on both limbs, not
    resorption-dominant. Histomorphometry shows a reduced mineral apposition
    rate, scant osteoid, and reduced osteoblast and osteoclast numbers, while
    serum bone turnover markers are typically normal.
  notes: >-
    Divergence from the module worth recording: the module chain runs
    Bone Remodeling Imbalance -> RANKL-Driven Osteoclastogenesis -> Increased
    Osteoclastic Bone Resorption, whereas here the imbalance is reached with
    normal-to-reduced osteoclast activity. Conformance is declared on the
    imbalance node only, and the RANKL/resorption steps are deliberately not
    instantiated.

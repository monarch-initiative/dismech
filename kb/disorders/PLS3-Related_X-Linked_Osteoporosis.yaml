- name: Dysregulated Osteoclast NFATc1 Signaling
  role: amplifier
  biological_scale: CELLULAR
  description: >-
    A competing, mouse-derived arm in which the primary lesion is in the
    osteoclast. PLS3 binds NFkB repressing factor (NKRF); in Pls3-null
    osteoclasts less NKRF reaches the nucleus, Nfatc1 - the master regulator of
    osteoclastogenesis - is de-repressed, and resorption is augmented. The
    reciprocal experiment supports the axis: PLS3-overexpressing mice show
    increased nuclear NKRF, suppressed osteoclast function and thicker, stronger
    cortical bone. This arm is deliberately not conformed to the module's
    RANKL-Driven Osteoclastogenesis node, because human PLS3 bone biopsies show
    the opposite phenotype - reduced osteoclast number and low turnover.
  cell_types:
  - preferred_term: Osteoclast
    term:
      id: CL:0000092
      label: osteoclast
  biological_processes:
  - preferred_term: Osteoclast differentiation
    term:
      id: GO:0030316
      label: osteoclast differentiation
    modifier: INCREASED
  mechanism_confidence: HYPOTHETICAL
  evidence:
  - reference: PMID:30204862
    reference_title: Plastin 3 influences bone homeostasis through regulation of osteoclast activity.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We show that unbalanced PLS3 levels affect osteoclast development and
      function, by misregulating the NFκB pathway.
    explanation: >-
      States the osteoclast-centred claim this node encodes, in the mouse system
      where it was demonstrated.
  - reference: PMID:30204862
    reference_title: Plastin 3 influences bone homeostasis through regulation of osteoclast activity.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We found the opposite in Pls3 knockout osteoclasts, where decreased nuclear
      NKRF augmented Nfatc1 transcription, causing osteoporosis.
    explanation: >-
      Gives the specific NKRF-to-Nfatc1 step and directionality that make this a
      mechanistic arm rather than a general osteoclast observation.
  - reference: PMID:30204862
    reference_title: Plastin 3 influences bone homeostasis through regulation of osteoclast activity.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      while Pls3 knockout mice exhibit osteoporosis, PLS3 overexpressing mice show
      thickening of cortical bone and increased bone strength
    explanation: >-
      The bidirectional dosage experiment; gain and loss of PLS3 move bone mass in
      opposite directions, which is the strongest support for the axis.
  - reference: PMID:24616189
    reference_title: "Osteoporosis caused by mutations in PLS3: clinical and bone tissue characteristics."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Iliac bone histomorphometry in 2 patients showed low trabecular bone volume
      and a low osteoid maturation time but normal bone formation rate and
      osteoclast surface.
    explanation: >-
      Human bone histomorphometry finds normal osteoclast surface, which is what a
      primary osteoclast-activation mechanism predicts against. Recorded as REFUTE
      on this node rather than omitted, because the negative human result is the
      reason this arm is ALTERNATIVE.
  - reference: PMID:31678489
    reference_title: Mice lacking plastin-3 display a specific defect of cortical bone acquisition.
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Surprisingly, we did not detect significant differences between wildtype and
      Pls3-deficient littermates with respect to trabecular bone mass, and the same
      was the case for all histomorphometric parameters determined at 12 weeks of
      age.
    explanation: >-
      An independent Pls3-null mouse line failed to reproduce the trabecular and
      histomorphometric phenotype an osteoclast-driven resorptive mechanism
      predicts, so the two mouse studies disagree with each other as well as with
      the human tissue.
  downstream:
  - target: Cortical and Trabecular Bone Deficit
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    hypothesis_groups:
    - osteoclast_nkrf_nfatc1_model
    description: >-
      Under this model, augmented Nfatc1-driven osteoclast activity removes bone
      faster than it is replaced. Shown in mice; the human low-turnover picture is
      not consistent with it.
- name: Defective Bone Matrix Mineralization
  role: central_effector
  biological_scale: TISSUE
  conforms_to: "osteoporosis_bone_resorption#Impaired Osteoblastic Bone Formation"
  description: >-
    The defining tissue lesion. Osteoblasts deposit a normal collagen matrix but
    fail to mineralize it: patient transiliac biopsies show increased osteoid
    volume and thickness with a prolonged mineralizing lag time, and quantitative
    backscattered electron imaging plus Raman microspectroscopy show frank
    hypomineralization. This is the mirror image of osteogenesis imperfecta,
    where the collagen defect produces hypermineralized matrix, and is the basis

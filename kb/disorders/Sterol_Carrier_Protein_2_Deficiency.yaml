    mapping_predicate: skos:broadMatch
    mapping_source: MONDO
    mapping_justification: >-
      One of the two parents MONDO asserts for MONDO:0013391, and the one that names the
      lesion. Recorded as broadMatch because it is a broader class covering the other
      single-enzyme beta-oxidation defects as well. ClinGen's Peroxisomal GCEP independently
      places SCP2 deficiency as a subclass of this same term.
  - term:
      id: MONDO:0019046
      label: leukodystrophy
    mapping_predicate: skos:broadMatch
    mapping_source: MONDO
    mapping_justification: >-
      The second parent MONDO asserts for MONDO:0013391. Recorded as broadMatch: it reflects
      the white matter imaging finding that gave the disease its original LKDMN name, and it
      is a much broader class. This entry builds its causal chain on the peroxisomal parent
      instead, because that is the parent that names the enzyme defect.
  icd10cm_mappings:

diagnosis:
- name: Plasma branched-chain fatty acid profiling
  description: >-
    The step that makes the diagnosis reachable, and the step that is skipped when the
    workup stops at a very-long-chain fatty acid screen. What identifies this disease is a
    raised pristanic acid with a disproportionately low phytanic acid and normal
    very-long-chain fatty acids. Pristanic acid accumulation is not specific to this
    enzyme, because the same 2-methyl-branched beta-oxidation stream runs through ACOX2,
    D-bifunctional protein and alpha-methylacyl-CoA racemase as well, so the profile
    localises the pathway rather than the gene.
  markers: >-
    Plasma pristanic acid; plasma phytanic acid; plasma very-long-chain fatty acids.
  diagnosis_term:
    preferred_term: plasma branched-chain fatty acid profiling
    term:
      id: NCIT:C25294
      label: Laboratory Procedure

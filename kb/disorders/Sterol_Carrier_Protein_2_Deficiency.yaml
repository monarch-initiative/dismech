    reference_title: "Case report: Episodic psychosis caused by a novel SCP2 splicing mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Psychiatric symptoms gradually improved after 3-6 months of treatment with antipsychotic drugs such as olanzapine or quetiapine."
    explanation: The symptomatic response reported in the third patient.
clinical_burden:
  burden_level: MODERATE
  rationale: >-
    Recorded as MODERATE and with low confidence. Every reported patient has a chronic
    neurological disorder with a structural brain lesion, and two of the three have a
    disabling motor or psychiatric syndrome; the third patient was repeatedly hospitalised
    and misdiagnosed across three admissions before the cause was found, which is a burden in
    itself. Against that, none of the published reports describes liver involvement, and the
    second patient's illness began in his thirties. With
    three patients there is no natural history, no disability measure and no survival data,
    so this level is an impression from three case reports rather than an assessment.
  evidence:
  - reference: PMID:37905191
    reference_title: "Case report: Episodic psychosis caused by a novel SCP2 splicing mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient was previously diagnosed with viral encephalitis, cerebral infarction, or mitochondrial encephalopathy."
    explanation: >-
      The diagnostic odyssey in the third patient - three separate wrong diagnoses across
      repeated admissions before the metabolic cause was identified.
animal_models:
- name: Scp2 knockout mouse
  species: Mouse
  genotype: Scp2-/- (combined SCP2 and SCPx deficiency)
  description: >-
    The original and most-used model, and the one that identified the blocked reaction. It
    ablates the whole locus, so both gene products are lost, which is not the human lesion -
    the reported patients lose the thiolase while the small SCP2 protein is made from its
    own promoter. The phenotype is dominated by phytanic acid accumulation, where the human
    disease accumulates pristanic acid.
  publication: PMID:9553048
  modeled_mechanisms:
  - target: Block of Peroxisomal Thiolytic Cleavage of 2-Methyl-Branched 3-Ketoacyl-CoA
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: >-
      The model demonstrates the specific enzymatic lesion: defective thiolytic cleavage of
      3-ketopristanoyl-CoA.
    limitations: >-
      The knockout removes SCP2 as well as SCPx, so an observed phenotype cannot be assigned
      to the thiolase alone, and the model also shows impaired peroxisomal import of
      phytanoyl-CoA, which is a function of the lipid-carrier product rather than of the
      thiolase.
    evidence:
    - reference: PMID:9553048
      reference_title: Defective peroxisomal catabolism of branched fatty acyl coenzyme A in mice lacking the sterol carrier protein-2/sterol carrier protein-x gene function.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Further characterization supported that the gene disruption led to inefficient import of phytanoyl-CoA into peroxisomes and to defective thiolytic cleavage of 3-ketopristanoyl-CoA."
      explanation: The blocked reaction, demonstrated in the model.
  - target: Pristanic Acid Accumulation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      Branched-chain fatty acid accumulation occurs, but the species that accumulates is
      phytanic acid.
    limitations: >-
      The mouse accumulates phytanic acid up to ten-fold, whereas the human disease is
      defined by a marked pristanic acid rise with phytanic acid only mildly elevated. The
      direction of the branched-chain lesion is reproduced; its composition is not.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        Mouse and human differ in which branched-chain species dominates the accumulation.
        The model's readout is phytanic acid; the human diagnostic analyte is pristanic acid.
    - divergence_type: PROXY_QUANTITY
      materiality: QUALIFYING
      description: >-
        The quantity measured in the model is tissue and plasma phytanic acid. The quantity
        this node asserts is plasma pristanic acid. They are adjacent metabolites in one
        pathway, not the same measurement.
    evidence:
    - reference: PMID:9553048
      reference_title: Defective peroxisomal catabolism of branched fatty acyl coenzyme A in mice lacking the sterol carrier protein-2/sterol carrier protein-x gene function.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The defect became evident from up to 10-fold accumulation of the tetramethyl-branched fatty acid phytanic acid in Scp2(-/-) mice."
      explanation: The accumulating species and its magnitude in the model.
  evidence:
  - reference: PMID:9553048
    reference_title: Defective peroxisomal catabolism of branched fatty acyl coenzyme A in mice lacking the sterol carrier protein-2/sterol carrier protein-x gene function.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Complete deficiency of SCP2 and SCPx was associated with marked alterations in gene expression, peroxisome proliferation, hypolipidemia, impaired body weight control, and neuropathy."
    explanation: >-
      The whole-animal phenotype, including the neuropathy that is the model's closest
      approach to the human neurological disease. It is cited to bound what the model
      represents: hypolipidemia and impaired body weight control have no counterpart in any
      reported patient.
- name: SCP-x-null mouse
  species: Mouse
  genotype: SCP-x-null (SCPx ablated, SCP2 expression preserved)
  description: >-
    The model that matches the human lesion, because it removes the thiolase while leaving
    SCP2 expression intact. That separation is itself one of its findings. It was
    characterised under a phytol-enriched diet, which is a substrate challenge rather than
    the steady state a patient lives in.
  publication: PMID:17068117
  modeled_mechanisms:
  - target: Block of Peroxisomal Thiolytic Cleavage of 2-Methyl-Branched 3-Ketoacyl-CoA
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Establishes at whole-animal level that losing SCPx alone impairs branched-chain lipid
      metabolism, which is the claim the human disease rests on.
    limitations: >-
      The branched-chain phenotype was elicited by a phytol-enriched diet, so it measures
      reserve capacity under load rather than the unchallenged state, and the reported
      consequences are hepatic and nutritional rather than neurological. No brain phenotype
      is reported for this model.
    evidence:
    - reference: PMID:17068117
      reference_title: Effect of SCP-x gene ablation on branched-chain fatty acid metabolism.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In summary, the present work with SCP-x gene-ablated mice demonstrates, for the first time, a direct physiological relationship between lack of SCP-x and decreased ability to metabolize branched-chain lipids."
      explanation: >-
        The model's own summary of what it established: SCPx loss alone impairs
        branched-chain lipid metabolism.
  evidence:
  - reference: PMID:17068117
    reference_title: Effect of SCP-x gene ablation on branched-chain fatty acid metabolism.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "It was shown that SCP-x gene ablation 1) did not result in reduced expression of SCP-2 (previously thought to be derived in considerable part by posttranslational cleavage of SCP-x)"
    explanation: >-
      Why this model is the better analogue of the human genotype: ablating SCPx does not
      take SCP2 with it, so the two gene products can be separated.
- name: Scp2-null mouse on a phytol-enriched diet, cardiac phenotype
  species: Mouse
  genotype: Scp2-/- (combined SCP2 and SCPx deficiency), phytol-enriched diet
  description: >-
    A cardiac electrophysiology study of the combined knockout under phytol loading. It is
    recorded here because one of the four reported human cases - the disputed heterozygous
    patient - had a cardiac dysrhythmia, and because this is the only model result that
    would predict one. Nothing connects them yet: none of the reports of the three patients with a confirmed
    biallelic SCP2 genotype describes an arrhythmia or a cardiac assessment.
  publication: PMID:15574183
  evidence:
  - reference: PMID:15574183
    reference_title: Phytanic acid accumulation is associated with conduction delay and sudden cardiac death in sterol carrier protein-2/sterol carrier protein-x deficient mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Accumulation of phytanic acid in myocardial phospholipid membranes is associated with bradycardia and impaired AV nodal and intraventricular impulse conduction, which could provide an explanation for sudden cardiac death in this model."
    explanation: >-
      The cardiac phenotype of the combined knockout under phytol loading, and the mechanism
      the authors propose for it. Recorded without a modeled_mechanisms link because no node
      in this entry corresponds to it.
discussions:
- discussion_id: scp2-imaging-lesion-mechanism-unknown
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    By what route does the block in peroxisomal branched-chain beta-oxidation produce
    symmetrical thalamic and brainstem lesions?
  attaches_to:
  - pathophysiology#Symmetrical Thalamic, Brainstem and White Matter Lesions
  rationale: >-
    The lesion is the one finding common to all three reported patients and nothing is known
    about how it arises. None of the published reports carries neuropathology, a measurement of
    branched-chain fatty acid concentration in brain tissue, spectroscopy, or a correlation
    between metabolite level and imaging burden - the third patient had the
    same lesion pattern with a pristanic acid only marginally above the reference range,
    which is the one observation bearing on the question and it argues against a simple
    dose-response. The edge this entry draws from the metabolic block to the lesion is
    therefore a disease-level attribution and not a mechanism. Why the thalamus and pons specifically is also
    unexplained in any of the reports.
  evidence:
  - reference: PMID:37905191
    reference_title: "Case report: Episodic psychosis caused by a novel SCP2 splicing mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients in the literature exhibited elevated pristanic acid levels, whereas the index patient showed a mild increase."
    explanation: >-
      The dissociation that makes the question live: the same imaging lesion at markedly
      different metabolite concentrations.
- discussion_id: scp2-mouse-accumulates-the-wrong-metabolite
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Is the Scp2 knockout mouse a valid model of human SCP2 deficiency, given that it deletes
    both gene products and accumulates phytanic rather than pristanic acid?
  attaches_to:
  - pathophysiology#Pristanic Acid Accumulation
  - animal_models#Mouse
  rationale: >-
    The mouse literature is older and far larger than the human literature, so it is the
    default source of mechanism for this disease - and it diverges from the human lesion in
    two ways at once. First, the widely used knockout ablates the whole Scp2 locus, removing
    both the thiolase and the small lipid-carrier protein, whereas the human disease-causing
    variants lie in the SCPx-coding region and leave SCP2 transcribed from its own promoter;
    the SCP-x-null mouse showed directly that the two can be separated. Second, the combined
    knockout's defining biochemical abnormality is a ten-fold phytanic acid accumulation,
    while the human disease is defined by a marked pristanic acid rise with phytanic acid
    only mildly raised - the opposite emphasis. Neither mouse has a reported brain
    phenotype resembling the human thalamic and pontine lesions. What follows practically:
    a mouse finding should not be carried into this entry as a human mechanism without
    saying which model it came from, and the SCP-x-null model is the one that matches the
    human genotype.
  evidence:
  - reference: PMID:9553048
    reference_title: Defective peroxisomal catabolism of branched fatty acyl coenzyme A in mice lacking the sterol carrier protein-2/sterol carrier protein-x gene function.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The defect became evident from up to 10-fold accumulation of the tetramethyl-branched fatty acid phytanic acid in Scp2(-/-) mice."
    explanation: The model's accumulating species, which is not the human one.
  - reference: PMID:17068117
    reference_title: Effect of SCP-x gene ablation on branched-chain fatty acid metabolism.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "It was shown that SCP-x gene ablation 1) did not result in reduced expression of SCP-2 (previously thought to be derived in considerable part by posttranslational cleavage of SCP-x)"
    explanation: >-
      Demonstrates that the two gene products are separable, which is what makes the
      combined knockout the wrong genotype for this disease.
  proposed_experiments:
  - experiment_id: scp2-scpx-null-brain-phenotyping
    name: Brain phenotyping of the SCP-x-null mouse
    description: >-
      Characterise brain imaging and neuropathology in the SCPx-selective knockout, with and
      without a phytol load, and measure pristanic and phytanic acid in brain tissue. This
      is the model whose genotype matches the human disease, and no brain phenotype has been
      reported for it.
    would_support:
    - pathophysiology#Symmetrical Thalamic, Brainstem and White Matter Lesions
    supporting_outcome:
    - >-
      Symmetrical thalamic or brainstem lesions, or regional white matter pathology,
      appearing in SCPx-null but not wild-type animals and tracking with brain branched-chain
      fatty acid content.
    refuting_outcome:
    - >-
      No brain lesion and no regional branched-chain fatty acid accumulation in SCPx-null
      animals even under sustained phytol loading, which would argue the human lesion is not
      a direct consequence of the thiolase block.
- discussion_id: scp2-heterozygous-case-disputed
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Does a single heterozygous SCP2 missense variant cause SCPx deficiency, as the fourth
    reported case claims?
  attaches_to:
  - genetic#SCP2
  rationale: >-
    A fourth patient has been reported, with progressive brainstem neurodegeneration,
    cardiac dysrhythmia, muscle wasting and azoospermia, carrying a single heterozygous
    SCP2 missense variant that the report itself classified as of uncertain significance.
    The paper's supporting evidence is cellular - reduced SCPx protein and transcript in
    patient fibroblasts, fewer peroxisomes, and altered lipid and transcript profiles - and
    it makes a real claim, since a dominant-negative or haploinsufficiency mechanism is not
    excluded a priori. But every other reported patient is biallelic, a subsequent review
    states that whether this patient has SCPx deficiency remains to be established, and
    ClinGen's expert panel scored only two individuals when it curated the gene. This entry
    therefore records the disease as autosomal recessive and does not curate that patient's
    features as phenotypes of it; the cardiac and muscle findings in particular appear
    nowhere else in this disease.
  evidence:
  - reference: PMID:35996156
    reference_title: "SCP2 variant is associated with alterations in lipid metabolism, brainstem neurodegeneration, and testicular defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report herein the first patient with a heterozygous SCP2 mutation leading to SCPx deficiency."
    explanation: The claim itself, in the words of the report making it.
  - reference: PMID:35996156
    reference_title: "SCP2 variant is associated with alterations in lipid metabolism, brainstem neurodegeneration, and testicular defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical presentations of the patient included progressive brainstem neurodegeneration, cardiac dysrhythmia, muscle wasting, and azoospermia."
    explanation: >-
      The features attributed to that patient, none of which except azoospermia is reported
      in a biallelic patient.
  - reference: PMID:38693715
    reference_title: Disorders of fatty acid homeostasis.
    supports: REFUTE
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "A third patient with presumed SCPx deficiency was recently reported by Galano et al., but it remains to be established whether this patient is truly affected by SCPx deficiency."
    explanation: >-
      A review of the peroxisomal fatty acid disorders declining to accept the case, which is
      why this entry does not curate it.
- discussion_id: scp2-phenotype-expansion
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What is the phenotype of SCP2 deficiency, given that the three reported patients share
    almost nothing except an MRI pattern?
  attaches_to:
  - phenotypes#
  rationale: >-
    Torticollis with a motor neuropathy, an adult-onset ataxia with deafness and brain iron
    accumulation, and infection-triggered episodic psychosis with status epilepticus are
    three different clinical pictures. Only stutter, tremor and the imaging lesion recur.
    This entry consequently records no frequency on any phenotype and calls none of them
    typical, because with an n of three every feature is either universal or unique
    depending on how it is counted. ClinGen's expert panel renamed the disease from the
    descriptive LKDMN label to SCP2 deficiency for the same reason - to leave room for the
    phenotype to expand - and that rename is the clearest statement available that the
    clinical definition is not settled. A further retinal phenotype has been described in
    the second patient and is not curated here, because the report has no abstract in the
    reference cache and nothing quotable could be verified.
  evidence:
  - reference: PMID:37236006
    reference_title: Evaluating the strength of evidence for genes implicated in peroxisomal disorders using the ClinGen clinical validity framework and providing updates to the peroxisomal disease nomenclature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For instance, the disorder associated with SCP2 variants was termed SCP2 deficiency to replace the phenotype-based nomenclature, leukoencephalopathy-dystonia-motor neuropathy syndrome."
    explanation: >-
      The expert panel's rename, made explicitly to allow for phenotype expansion.
  - reference: PMID:38693715
    reference_title: Disorders of fatty acid homeostasis.
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "An unusual retinal phenotype was later described in the same patient."
    explanation: >-
      Records that a further organ system has been reported in one patient. The primary
      report is cited in `references` but nothing from it is quoted, for the reason given in
      the rationale.
notes: >-
  Lump/split. Curated as a standalone Disease entry. MONDO:0013391 is a leaf with no
  descendants and one causal gene, and the knowledge base already curates each single-enzyme
  peroxisomal beta-oxidation defect separately - ACOX1, HSD17B4, AMACR, ABCD3 - so a
  has_subtypes row on one of those would have been a different lump than the ones already
  made. The peroxisomal entries in kb/disorders/ were checked individually and none is the
  right parent: Congenital_Bile_Acid_Synthesis_Defect_5 is the ABCD3 transporter defect
  (its mention of SCPx is a line in a fibroblast enzyme panel that was normal in that
  patient, not a binding), alpha-Methylacyl-CoA_Racemase_Deficiency and
  D-Bifunctional_Protein_Deficiency are the enzymes immediately upstream of SCPx in the same
  spiral, and the Zellweger and rhizomelic entries are biogenesis and ether-lipid disorders.
  ClinGen's Peroxisomal Gene Curation Expert Panel likewise curates SCP2 as its own
  gene-disease entity and places it as a subclass of peroxisomal beta oxidation.

  Module conformance. The entry conforms at
  peroxisomal_metabolic_failure#Peroxisomal Biogenesis or Enzyme Defect, entering that module
  by its single-enzyme arm. It deliberately does not conform at the module's central effector
  node, "Toxic Fatty-Acid Accumulation with Ether-Lipid Deficiency", because that node asserts
  substrate accumulation and ether-lipid deficiency together and this disease has only the
  accumulation half - plasmalogen synthesis is not part of the lesion and has not been
  reported as abnormal in any patient. Conformance to cns_myelin_failure and to
  peripheral_axonal_degeneration was considered and rejected: the white matter finding is an
  MRI signal abnormality with no reported neuropathology behind it, and the neuropathy occurs
  in one of three patients, so in both cases conforming would assert a cellular mechanism
  that nothing in the literature establishes.

  What is not here, and why. No prevalence rate, because none has been published. No
  phenotype frequencies, because three patients cannot support a frequency band. No
  histopathology section, because none of the published reports describes a biopsy or
  autopsy. No
  environmental section: dietary phytol is the precursor of the accumulating metabolite and a
  restricted diet was tried in one patient, but no exposure has been reported as triggering
  or modifying the disease, so an environmental entry would be an inference rather than an
  observation. The acute episodes of the third patient followed respiratory infections, which
  the author compares to metabolic decompensation in other disorders; nothing was measured
  during an episode, so that comparison is not curated as a mechanism. Four organ-system
  findings reported only in the disputed heterozygous case - cardiac dysrhythmia, muscle
  wasting, reduced testosterone with raised follicle-stimulating hormone, and the
  fibroblast lipidomic and transcriptomic changes - are described in the relevant discussion
  and are not curated as phenotypes of this disease.
review_notes: >-
  Term provenance. Every CURIE in this entry was looked up at the moment it was written:
  HP, GO and CHEBI terms with `runoak -i sqlite:obo:<onto>`, NCIT terms against
  `cache/ncit/terms.csv`, MONDO and HGNC with `runoak info`. hgnc:10606 was confirmed to be
  SCP2 and distinguished from SCP2D1, which is hgnc:16211.

  Terms deliberately not bound. Two claims in this entry have no ontology term and are
  carried as free text rather than bound to an approximate one. The pontine lesions are
  bound to HP:0012748 Focal T2 hyperintense brainstem lesion, the most specific available:
  `runoak -i sqlite:obo:hp descendants HP:0012747 -p i` returns only brainstem-level terms
  and no pons-specific T2-hyperintensity term exists, while HP:4000169 Pontine T2
  hypointensity is the wrong direction. The urinary finding is bound to HP:6001007 Elevated
  urinary bile alcohol level; `runoak -i sqlite:obo:hp search "t~bile alcohol"` returns only
  that term and HP:6000821 for the circulating measure, with no glucuronide-specific term.

  Evidence coverage and its limits. Two of the four human reports have no quotable text in
  the reference cache: PMID:26497993, the second patient's Neurology report, cached with
  `content_type: unavailable`, and PMID:28033445, the retinal follow-up on the same patient,
  likewise. Both are listed under `references` with titles copied from the cache frontmatter,
  and every claim about the second patient in this entry is therefore sourced to a third
  party - the 2023 case report's comparison table or the 2025 review - and graded
  accordingly. Nothing in this entry quotes either paper.

  ORPHA:163684 was not cited. MONDO cross-references it and Orphanet is the source of
  MONDO's own definition of this disease, but `just fetch-reference ORPHA:163684` in this
  checkout returns "No source found for reference type", so no cache file could be
  generated and no snippet verified.

  GeneReviews baseline. There is no GeneReviews chapter for this disease, and no StatPearls
  article. That was verified offline with `just check-genereviews` against the committed
  Bookshelf index in `cache/bookshelf/` (snapshot 2026-09-10, 958 GeneReviews and 9646
  StatPearls titles), which reports NO_CHAPTER for both collections. The absence is expected
  for a disease with three published patients and is not a gap in this entry.

  What was searched. PubMed was searched for `"sterol carrier protein X" AND deficiency`,
  `SCPx deficiency human`, `"sterol carrier protein 2" deficiency patient`, `SCP2 AND
  (macula* OR retina* OR fundus)` and the phytol/knockout mouse queries, and the 55 papers
  citing PMID:16685654 were listed and screened by title. That search found four human case
  reports in total - three biallelic and one heterozygous and disputed - plus the retinal
  follow-up on the second patient, and no further patient.

  Not searched, and so not asserted. No claim is made anywhere in this entry about carrier
  frequency, population distribution, ancestry, or age or cause of death, because none was
  searched for. No claim is made about the nationality or ancestry of any reported patient.

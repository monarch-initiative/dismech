treatments:
- name: Phytanic Acid-Restricted Diet
  description: >-
    The only disease-directed treatment reported. The third patient was discharged on a
    phytanic-acid-restricted diet, which is the intervention used in adult Refsum disease
    and is mechanistically reasonable here because dietary phytol and phytanic acid are the
    source of the pristanic acid that accumulates. No outcome of the diet has been reported
    in this disease, in this patient or any other, so this record establishes that it has
    been tried and nothing more.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Dietary Intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  evidence:
  - reference: PMID:37905191
    reference_title: "Case report: Episodic psychosis caused by a novel SCP2 splicing mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Subsequently, the patient was discharged while being placed on a phytanic acid-restricted diet."
    explanation: >-
      The single reported use of dietary restriction in this disease. No follow-up result is
      given.
  target_mechanisms:
  - target: Pristanic Acid Accumulation
    description: >-
      Restricting dietary phytol and phytanic acid limits the supply of the precursor from
      which pristanic acid is made. Whether this lowers plasma pristanic acid in SCP2
      deficiency has not been reported.
- name: Symptomatic Management of Episodic Psychosis and Seizures
  description: >-
    In the third patient the psychiatric episodes improved over three to six months on
    olanzapine or quetiapine and the status epilepticus was terminated with diazepam. That
    is symptomatic treatment of the presentation, with no effect on the metabolic lesion,
    and it is a single patient's experience.

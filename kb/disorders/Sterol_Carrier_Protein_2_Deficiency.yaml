- name: Plasma phytanic acid
  presence: MILDLY INCREASED
  notes: >-
    Raised only mildly, and in the third patient not at all. This is the discriminator
    against adult Refsum disease, where the alpha-oxidation block puts phytanic acid rather
    than pristanic acid at the front of the profile.

name: Sterol Carrier Protein 2 Deficiency
category: Mendelian
creation_date: '2026-09-19T05:40:32Z'
synonyms:
- SCP2 deficiency
- SCPx deficiency
- sterol carrier protein X deficiency
- leukoencephalopathy with dystonia and motor neuropathy
- leukoencephalopathy-dystonia-motor neuropathy syndrome
- LKDMN
description: >-
  Sterol carrier protein 2 deficiency is an autosomal recessive single-enzyme peroxisomal
  beta-oxidation defect caused by biallelic SCP2 variants. The SCP2 locus is transcribed
  from two promoters and yields two distinct proteins - the 58 kDa peroxisomal thiolase
  SCPx and the small lipid-binding protein SCP2 - and the disease is a loss of the thiolase
  arm, which is why the older literature calls it SCPx deficiency. SCPx catalyses the final
  thiolytic step of the peroxisomal beta-oxidation spiral for 2-methyl-branched substrates,
  so losing it blocks the degradation of pristanic acid and the side-chain shortening of
  the C27 bile acid intermediates.

  The biochemical signature that follows is narrow and is what makes the disease findable:
  a marked rise in plasma pristanic acid with phytanic acid only mildly raised, normal
  plasma very-long-chain fatty acids, and abnormal bile alcohol glucuronides in urine. It
  is a beta-oxidation lesion alone, and not the two-sided picture of a peroxisome
  biogenesis disorder, in which substrate accumulation and ether-lipid deficiency occur
  together.

  Clinically the reported picture is a childhood- or adult-onset central nervous
  system disease with symmetrical thalamic and brainstem lesions on MRI. Beyond that shared
  imaging finding the three published patients differ from one another considerably -
  torticollis, head tremor, nystagmus, hyposmia and a motor neuropathy in the first;
  ataxia, gait disturbance, deafness and brain iron accumulation in the second; episodic
  infection-triggered psychosis and status epilepticus in the third - and with three
  patients there is no basis for calling any of these features typical.

  The evidence base is correspondingly thin and this entry is deliberately short. ClinGen's
  Peroxisomal Gene Curation Expert Panel scored the SCP2 gene-disease relationship as
  Moderate on 6 genetic and 4 experimental evidence points, and renamed the entity from the
  descriptive LKDMN phenotype label to SCP2 deficiency to leave room for the phenotype to
  expand. The mouse literature predates the human literature and is larger, and the widely used
  knockout ablates SCP2 and SCPx together, which is not the human lesion.

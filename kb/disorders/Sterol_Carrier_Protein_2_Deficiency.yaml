classifications:
  harrisons_chapter:
  - classification_value: NEUROLOGIC
    notes: >-
      Every reported patient presented neurologically, and the shared finding across all
      three is a central nervous system imaging abnormality.
  - classification_value: ENDOCRINOLOGY_METABOLISM
    notes: >-
      An inborn error of peroxisomal fatty acid metabolism, diagnosed on a plasma
      branched-chain fatty acid profile.
  icimd_category:
  - classification_value: peroxisomal_fatty_acid_oxidation
    notes: >-
      SCPx catalyses the final thiolytic step of peroxisomal beta-oxidation for
      2-methyl-branched substrates, so the lesion sits squarely in this ICIMD group rather
      than in peroxisomal biogenesis.
    evidence:
    - reference: PMID:37905191
      reference_title: "Case report: Episodic psychosis caused by a novel SCP2 splicing mutation."
      supports: SUPPORT
      quote_role: BACKGROUND
      evidence_source: OTHER
      snippet: "SCPx functions as a peroxisomal enzyme with thiolase activity involved in peroxisomal beta-oxidation."
      explanation: >-
        Places the enzyme in the peroxisomal beta-oxidation pathway, which is what the
        category asserts. Quoted from the case report's introduction, where it restates
        established enzymology rather than reporting the study's own result.
inheritance:
- name: Autosomal recessive inheritance
  description: >-
    Biallelic SCP2 variants. Two of the three reported patients were homozygous and one was
    a compound heterozygote; in the third patient the father and sisters were heterozygous
    carriers. Penetrance and expressivity are recorded as UNKNOWN: with three
    patients there is no unaffected biallelic carrier to argue from, and the three
    phenotypes are too dissimilar to characterise a range.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  penetrance: UNKNOWN
  expressivity: UNKNOWN
  evidence:
  - reference: PMID:16685654
    reference_title: Mutations in the gene encoding peroxisomal sterol carrier protein X (SCPx) cause leukencephalopathy with dystonia and motor neuropathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutation analysis revealed a homozygous 1-nucleotide insertion, 545_546insA, leading to a frameshift and premature stop codon (I184fsX7)."
    explanation: The homozygous biallelic genotype of the first reported patient.
  - reference: PMID:35996156
    reference_title: "SCP2 variant is associated with alterations in lipid metabolism, brainstem neurodegeneration, and testicular defects."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "Previously, there have been two reports of SCPx deficiency, which resulted from a homozygous or compound heterozygous SCP2 mutation."
    explanation: >-
      States the biallelic requirement across the two then-published patients. Quoted from
      the introduction of a paper whose own subject is a different, heterozygous case, so
      this sentence restates prior clinical reports rather than its own result.
  - reference: PMID:37905191
    reference_title: "Case report: Episodic psychosis caused by a novel SCP2 splicing mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Through whole-exome sequencing, we identified a homozygous splicing mutation in SCP2 (c.674 + 1G > C), and further RNA sequencing revealed exon 8 skipping in the mature transcripts of SCP2."
    explanation: The homozygous biallelic genotype of the third reported patient.
genetic:
- name: SCP2
  relationship_type: CAUSATIVE
  notes: >-
    The locus is transcribed from two promoters and encodes two proteins, so "SCP2
    deficiency" and "SCPx deficiency" name the same disease from different ends of the same
    gene. All three reported disease-causing genotypes lie in the SCPx-coding region.
    Searching by symbol is a Named Entity Confusion hazard in two directions: SCP2D1
    (hgnc:16211) is a different gene, and much of the SCP2 literature is mouse lipid
    physiology rather than human disease.
  gene_term:
    preferred_term: SCP2
    term:
      id: hgnc:10606
      label: SCP2
  evidence:
  - reference: PMID:37236006
    reference_title: Evaluating the strength of evidence for genes implicated in peroxisomal disorders using the ClinGen clinical validity framework and providing updates to the peroxisomal disease nomenclature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Loss of function variants in another tier 2 gene, SCP2, have been reported in two individuals"
    explanation: >-
      ClinGen's Peroxisomal Gene Curation Expert Panel states the human genetic evidence it
      scored - two individuals with loss-of-function variants.
  - reference: PMID:37236006
    reference_title: Evaluating the strength of evidence for genes implicated in peroxisomal disorders using the ClinGen clinical validity framework and providing updates to the peroxisomal disease nomenclature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "With an overall score of 10 points, this gene-disease relationship earned a Moderate classification."
    explanation: >-
      The expert-panel verdict on the strength of the SCP2 gene-disease relationship. It is
      Moderate, not Definitive, and this entry is written to that standard.
  variants:
  - name: c.545_546insA (p.I184fsX7)
    description: >-
      Homozygous in the first reported patient, producing a frameshift and premature stop
      codon. SCPx protein was undetectable by western blot in that patient's fibroblasts.
    evidence:
    - reference: PMID:16685654
      reference_title: Mutations in the gene encoding peroxisomal sterol carrier protein X (SCPx) cause leukencephalopathy with dystonia and motor neuropathy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Mutation analysis revealed a homozygous 1-nucleotide insertion, 545_546insA, leading to a frameshift and premature stop codon (I184fsX7)."
      explanation: The variant and its predicted consequence as reported.
  - name: c.674+1G>C
    description: >-
      Homozygous in the third reported patient. RNA sequencing and cDNA analysis showed
      skipping of exon 8 in the mature transcript, deleting a block of residues that
      overlaps the thiolase N-terminal domain; the authors argue the enzyme may therefore
      retain partial function, which would fit that patient's only marginally raised
      pristanic acid.
    evidence:
    - reference: PMID:37905191
      reference_title: "Case report: Episodic psychosis caused by a novel SCP2 splicing mutation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Through whole-exome sequencing, we identified a homozygous splicing mutation in SCP2 (c.674 + 1G > C), and further RNA sequencing revealed exon 8 skipping in the mature transcripts of SCP2."
      explanation: The variant and the transcript consequence demonstrated for it.
  - name: c.121G>T and c.349C>T
    description: >-
      The compound heterozygous pair reported in the second patient, tabulated as
      c.121G>T and c.349C>T. Both were initially classified as variants of unknown
      significance; immunoblotting showing near-absent SCPx protein is what established the
      diagnosis rather than the variant classification.
    evidence:
    - reference: PMID:37905191
      reference_title: "Case report: Episodic psychosis caused by a novel SCP2 splicing mutation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "| Genetics | c.545_546insA(hom); | c.121G>T &c.349C>T(comhet); | c.674 + 1g>c(hom); |"
      explanation: >-
        The genotype row of the three-patient comparison table, giving the second patient's
        compound heterozygous pair.
    - reference: PMID:38693715
      reference_title: Disorders of fatty acid homeostasis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "This prompted molecular analysis, which revealed two variants of unknown significance in the SCP2 gene."
      explanation: >-
        A review's account of how the second patient's variants were classified when found,
        which is why protein-level confirmation was needed.
pathophysiology:
- name: SCPx Loss of Function
  role: trigger
  biological_scale: MOLECULAR
  conforms_to: "peroxisomal_metabolic_failure#Peroxisomal Biogenesis or Enzyme Defect"
  description: >-
    Biallelic SCP2 variants remove the peroxisomal 3-ketoacyl-CoA thiolase SCPx. The
    organelle itself is not the lesion: this entry enters the peroxisomal module by its
    single-enzyme arm, with one matrix enzyme lost rather than a failure of assembly or
    import. In the first reported patient the loss was demonstrated at both levels - no
    SCPx protein on western blot and no thiolytic activity in cultured fibroblasts - and in
    the second it was the immunoblot that converted two variants of unknown significance
    into a diagnosis.
  genetic_context:
    zygosity: HOMOZYGOUS
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Homozygous in two of the three reported patients and compound heterozygous in the
      third; the zygosity recorded here is that of the better-characterised genotypes rather
      than a property of the disease.
  molecular_functions:
  - preferred_term: peroxisomal 3-ketoacyl-CoA thiolase (SCPx) activity
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0003988
      label: acetyl-CoA C-acyltransferase activity
  cellular_components:
  - preferred_term: peroxisome
    term:
      id: GO:0005777
      label: peroxisome
  evidence:
  - reference: PMID:16685654
    reference_title: Mutations in the gene encoding peroxisomal sterol carrier protein X (SCPx) cause leukencephalopathy with dystonia and motor neuropathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In cultured skin fibroblasts, the thiolytic activity of SCPx was deficient, and no SCPx protein could be detected by western blotting."
    explanation: >-
      Demonstrates the lesion at the protein and activity level in patient cells, which is
      what makes this a proven enzyme deficiency rather than a variant association.
  downstream:
  - target: Block of Peroxisomal Thiolytic Cleavage of 2-Methyl-Branched 3-Ketoacyl-CoA
    description: >-
      Losing the thiolase removes the enzyme that performs the last step of the
      beta-oxidation cycle for these substrates.
    evidence:
    - reference: PMID:37905191
      reference_title: "Case report: Episodic psychosis caused by a novel SCP2 splicing mutation."
      supports: SUPPORT
      quote_role: BACKGROUND
      evidence_source: OTHER
      snippet: "SCPx functions as a peroxisomal enzyme with thiolase activity involved in peroxisomal beta-oxidation."
      explanation: >-
        Names the reaction the enzyme performs, which is the step this edge says is lost.
- name: Block of Peroxisomal Thiolytic Cleavage of 2-Methyl-Branched 3-Ketoacyl-CoA
  role: amplifier
  biological_scale: MOLECULAR
  description: >-
    The thiolytic cleavage that completes each round of peroxisomal beta-oxidation for
    2-methyl-branched acyl-CoA esters no longer occurs. The direct evidence that this is the
    reaction lost comes from the mouse: gene disruption impaired thiolytic cleavage of
    3-ketopristanoyl-CoA specifically. In humans the step is inferred from the absent
    fibroblast thiolase activity plus the substrate pattern that accumulates.
  biological_processes:
  - preferred_term: peroxisomal beta-oxidation of 2-methyl-branched acyl-CoA esters
    modifier: DECREASED
    term:
      id: GO:0006635
      label: fatty acid beta-oxidation
  cellular_components:
  - preferred_term: peroxisome
    term:
      id: GO:0005777
      label: peroxisome
  evidence:
  - reference: PMID:9553048
    reference_title: Defective peroxisomal catabolism of branched fatty acyl coenzyme A in mice lacking the sterol carrier protein-2/sterol carrier protein-x gene function.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "Further characterization supported that the gene disruption led to inefficient import of phytanoyl-CoA into peroxisomes and to defective thiolytic cleavage of 3-ketopristanoyl-CoA."
    explanation: >-
      Identifies the blocked reaction directly, in mice lacking both SCP2 and SCPx. Marked
      INDIRECT because the mouse lesion removes both gene products while the human disease
      removes only the thiolase.
  - reference: PMID:16685654
    reference_title: Mutations in the gene encoding peroxisomal sterol carrier protein X (SCPx) cause leukencephalopathy with dystonia and motor neuropathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this report, we describe the first known patient with a deficiency of sterol carrier protein X (SCPx), a peroxisomal enzyme with thiolase activity, which is required for the breakdown of branched-chain fatty acids."
    explanation: >-
      Assigns branched-chain fatty acid breakdown to this enzyme in the report that
      established the human deficiency.
  downstream:
  - target: Pristanic Acid Accumulation
    description: >-
      With the cycle unable to complete, its branched-chain substrate accumulates upstream
      of the block.
  - target: Incomplete Side-Chain Shortening of C27 Bile Acid Intermediates
    description: >-
      The same thiolytic step shortens the C27 bile acid side chain, so that conversion is
      also left incomplete.
- name: Pristanic Acid Accumulation
  role: amplifier
  biological_scale: ORGANISM
  description: >-
    Plasma pristanic acid rises markedly while phytanic acid rises only mildly and
    very-long-chain fatty acids stay normal. That combination is the diagnostic fingerprint
    and it distinguishes this disease from adult Refsum disease, where phytanic acid is the
    accumulating species, and from the biogenesis disorders, where very-long-chain fatty
    acids are also raised. The third reported patient is the exception that bounds the rule:
    his pristanic acid was only marginally above the control range, consistent with a
    partially functional enzyme.
  chemical_entities:
  - preferred_term: pristanic acid
    modifier: INCREASED
    term:
      id: CHEBI:51340
      label: pristanic acid
  - preferred_term: phytanic acid
    modifier: INCREASED
    term:
      id: CHEBI:16285
      label: phytanic acid
  evidence:
  - reference: PMID:16685654
    reference_title: Mutations in the gene encoding peroxisomal sterol carrier protein X (SCPx) cause leukencephalopathy with dystonia and motor neuropathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Metabolite analyses of plasma revealed an accumulation of the branched-chain fatty acid pristanic acid, and abnormal bile alcohol glucuronides were excreted in urine."
    explanation: The accumulation in the first reported patient, alongside the bile-acid finding.
  - reference: PMID:38693715
    reference_title: Disorders of fatty acid homeostasis.
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Pristanic acid was markedly elevated in the patient's plasma, whereas phytanic acid was only mildly elevated. Plasma VLCFA were normal."
    explanation: >-
      The same pattern in the second patient, as summarised by a review of the peroxisomal
      fatty acid disorders. It is the sentence that fixes the discriminating profile.
  downstream:
  - target: Elevated circulating pristanic acid concentration
    description: >-
      The accumulation is what the diagnostic plasma assay measures.
  - target: Symmetrical Thalamic, Brainstem and White Matter Lesions
    description: >-
      Asserted as the route from the metabolic block to the imaging lesion because every
      patient with proven SCPx deficiency has both, and because that is the inference the
      founding report and the expert-panel curation rest on. No intermediate step has been
      demonstrated in humans - there is no neuropathology, no measurement of branched-chain
      fatty acid in brain tissue, and no imaging-metabolite correlation - so this edge is a
      disease-level attribution rather than a mechanism. See the open discussion attached to
      the downstream node.
    evidence:
    - reference: PMID:37236006
      reference_title: Evaluating the strength of evidence for genes implicated in peroxisomal disorders using the ClinGen clinical validity framework and providing updates to the peroxisomal disease nomenclature.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "With an overall score of 10 points, this gene-disease relationship earned a Moderate classification."
      explanation: >-
        The expert-panel judgement that SCP2 loss of function causes this phenotype at all.
        Marked INDIRECT because it grades the gene-disease relationship as a whole and says
        nothing about the steps between the metabolic block and the lesion.
- name: Incomplete Side-Chain Shortening of C27 Bile Acid Intermediates
  role: amplifier
  biological_scale: MOLECULAR
  description: >-
    The peroxisomal thiolytic step that SCPx performs is also the one that shortens the C27
    bile acid side chain to the mature C24 primary bile acids. In the first reported patient
    the consequence seen was the urinary excretion of abnormal bile alcohol glucuronides.
    What route produces those glucuronides in this disease has not been investigated, so
    the node stops at the blocked step and the abnormal excretion that follows it. None of
    the published reports describes liver disease in any patient, so unlike the other
    peroxisomal bile-acid defects this arm has so far been biochemical only.
  biological_processes:
  - preferred_term: peroxisomal side-chain shortening of C27 bile acid intermediates
    modifier: DECREASED
    term:
      id: GO:0006699
      label: bile acid biosynthetic process
  evidence:
  - reference: PMID:16685654
    reference_title: Mutations in the gene encoding peroxisomal sterol carrier protein X (SCPx) cause leukencephalopathy with dystonia and motor neuropathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Metabolite analyses of plasma revealed an accumulation of the branched-chain fatty acid pristanic acid, and abnormal bile alcohol glucuronides were excreted in urine."
    explanation: >-
      The abnormal bile alcohol excretion that is the only reported readout of this arm of
      the block.
  downstream:
  - target: Elevated urinary bile alcohol level
    description: >-
      Bile alcohols accumulate and are excreted as glucuronides when the peroxisomal route
      cannot complete the side-chain shortening.
- name: Symmetrical Thalamic, Brainstem and White Matter Lesions
  role: effector
  biological_scale: TISSUE
  description: >-
    The one finding shared by all three reported patients: bilateral T2-hyperintense
    thalamic signal and pontine lesions, without gadolinium enhancement, with cerebral
    white matter involvement in the first patient. It is defined entirely by imaging. None
    of the published reports describes a biopsy or autopsy, so whether this represents
    demyelination, oedema, gliosis or neuronal loss is unknown, and the node is named for
    what was observed rather than for a pathological process.
  evidence:
  - reference: PMID:37905191
    reference_title: "Case report: Episodic psychosis caused by a novel SCP2 splicing mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MRI findings were consistent among all three patients, revealing symmetrical thalamus and brainstem lesions without gadolinium enhancement."
    explanation: >-
      States the shared imaging finding across the three reported patients, which is the
      claim this node makes.
  - reference: PMID:16685654
    reference_title: Mutations in the gene encoding peroxisomal sterol carrier protein X (SCPx) cause leukencephalopathy with dystonia and motor neuropathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Magnetic resonance imaging showed leukencephalopathy and involvement of the thalamus and pons."
    explanation: The imaging description in the first reported patient, including white matter.
  downstream:
  - target: Focal T2 hyperintense thalamic lesion
    description: The thalamic component of the shared imaging finding.
  - target: Focal T2 hyperintense brainstem lesion
    description: The pontine and mesencephalic component of the shared imaging finding.
  - target: Leukoencephalopathy
    description: >-
      The cerebral white matter component, reported in the first patient and the feature the
      disease was originally named for.

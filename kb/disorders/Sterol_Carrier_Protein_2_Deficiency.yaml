    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The current diagnostic approach relies heavily on biochemical genetic tests measuring peroxisomal metabolites, including very long-chain and branched-chain fatty acids in plasma and plasmalogens in red blood cells."
    explanation: >-
      The professional-society statement of what the first-line biochemical workup for a
      peroxisomal disorder consists of.
  - reference: PMID:38693715
    reference_title: Disorders of fatty acid homeostasis.
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Pristanic acid was markedly elevated in the patient's plasma, whereas phytanic acid was only mildly elevated. Plasma VLCFA were normal."
    explanation: The discriminating profile itself, as it presented in the second patient.
- name: Fibroblast SCPx protein and thiolase activity assay
  description: >-
    What converts a sequencing result into a diagnosis. In the second patient the two SCP2
    variants were of unknown significance and it was the near-absence of SCPx protein on
    immunoblot that established the deficiency. Where sequencing is the first-tier test,
    biochemical confirmation is the general expectation in peroxisomal disease and not a
    peculiarity of this gene.
  markers: >-
    SCPx immunoblot in cultured skin fibroblasts; SCPx thiolytic activity.
  diagnosis_term:
    preferred_term: peroxisomal enzyme studies in cultured fibroblasts
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  evidence:
  - reference: PMID:16685654
    reference_title: Mutations in the gene encoding peroxisomal sterol carrier protein X (SCPx) cause leukencephalopathy with dystonia and motor neuropathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In cultured skin fibroblasts, the thiolytic activity of SCPx was deficient, and no SCPx protein could be detected by western blotting."
    explanation: The two fibroblast readouts as performed in the first patient.
  - reference: PMID:31822849

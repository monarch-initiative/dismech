- name: Plasma pristanic acid
  presence: INCREASED
  notes: >-
    The single most useful analyte. In the two patients with complete enzyme deficiency it
    was far above the upper reference limit; in the third, whose variant is argued to leave
    partial function, it was only marginally raised. The published concentrations and their
    laboratory reference ranges differ between reports and none is quoted here, so no
    numeric value is asserted.

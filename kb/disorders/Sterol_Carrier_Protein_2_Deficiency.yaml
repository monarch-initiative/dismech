    snippet: "Pristanic acid was markedly elevated in the patient's plasma, whereas phytanic acid was only mildly elevated. Plasma VLCFA were normal."
    explanation: >-
      States the relative behaviour of the two branched-chain acids, and in the same
      sentence the normal very-long-chain fatty acids that complete the profile.
- name: Plasma very-long-chain fatty acids
  presence: NORMAL
  notes: >-
    Normal, which is a positive diagnostic feature rather than a missing one: it separates
    this disease from the peroxisome biogenesis disorders and from X-linked
    adrenoleukodystrophy, where very-long-chain fatty acids are the accumulating species.
    A plasma very-long-chain fatty acid screen alone will therefore miss SCP2 deficiency.

animal_models:
- name: Kcc2 constitutive knockout mouse
  species: Mouse
  genotype: Slc12a5 homozygous null
  publication: PMID:11395011
  description: >-
    Homozygous Kcc2-null mice die immediately after birth from motor deficits that
    abolish respiration, and embryonic spinal motoneurons show excitatory rather
    than inhibitory GABA and glycine responses.
  modeled_mechanisms:
  - target: Depolarizing Shift in the GABA-A and Glycine Reversal Potential
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Direct demonstration that removing KCC2 makes GABA and glycine depolarizing.
    limitations: >-
      Complete loss of function is perinatally lethal in the mouse, whereas human
      DEE34 genotypes retain partial transport activity and affected children survive
      infancy; the null model therefore represents a more extreme lesion than the
      human disease.
    readouts:
    - name: GABA and glycine response polarity in spinal motoneurons
      target: Depolarizing Shift in the GABA-A and Glycine Reversal Potential
      direction: ALTERED
      interpretation: >-
        Loss of KCC2 converts inhibitory transmitter responses to excitatory ones.
      evidence:
      - reference: PMID:11395011
        reference_title: "Disruption of KCC2 reveals an essential role of K-Cl cotransport already in early synaptic inhibition."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Patch-clamp measurements of embryonic day 18.5 spinal cord motoneurons demonstrated an excitatory GABA and glycine action in the absence, but not in the presence, of KCC2"
        explanation: >-
          Reports the patch-clamp measurement behind this readout.
    evidence:
    - reference: PMID:11395011
      reference_title: "Disruption of KCC2 reveals an essential role of K-Cl cotransport already in early synaptic inhibition."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We show that KCC2 knockout mice died immediately after birth due to severe motor deficits that also abolished respiration."
      explanation: >-
        Establishes the model and its severity.
- name: Dlx5-lineage conditional Kcc2 knockout mouse
  species: Mouse
  genotype: Dlx5-Cre; Slc12a5 conditional knockout (GABAergic neurons)
  publication: PMID:35370549
  description: >-
    Deleting KCC2 from forebrain GABAergic neurons produces early seizures, failure
    to thrive, and death in the second and third postnatal weeks, with a shift in
    cortical interneuron subtype composition despite normal interneuron migration.
  modeled_mechanisms:
  - target: Cortical Interneuron Subtype Imbalance
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Provides the direct evidence for the interneuron subtype imbalance node.
    limitations: >-
      The deletion is restricted to Dlx5-lineage GABAergic neurons, whereas human
      DEE34 variants affect KCC2 in all neurons; the model therefore isolates the
      GABAergic contribution rather than reproducing the human genotype.
    readouts:
    - name: Cortical interneuron subtype distribution by layer
      target: Cortical Interneuron Subtype Imbalance
      direction: ALTERED
      interpretation: >-
        Somatostatin-expressing neurons are in excess in layer 5 while
        parvalbumin-expressing neurons are reduced in layers 2/3 and 6.
      evidence:
      - reference: PMID:35370549
        reference_title: "Loss of KCC2 in GABAergic Neurons Causes Seizures and an Imbalance of Cortical Interneurons."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "an excess number of somatostatin neurons in layer 5 and a decrease in parvalbumin-expressing neurons in layer 2/3 and layer 6"
        explanation: >-
          Reports the quantified subtype imbalance.
    evidence:
    - reference: PMID:35370549
      reference_title: "Loss of KCC2 in GABAergic Neurons Causes Seizures and an Imbalance of Cortical Interneurons."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "the mice had early seizures, failure to thrive, and premature death in the second and third weeks of life"
      explanation: >-
        Establishes the seizure phenotype that makes this model informative.
- name: Kcc2b isoform-specific knockout mouse
  species: Mouse
  genotype: Slc12a5 KCC2b-isoform-specific knockout
  publication: PMID:27436767
  description: >-
    Mice lacking only the neuron-specific KCC2b splice isoform, while retaining
    KCC2a, survive the neonatal period and die around two weeks of age from
    spontaneous seizures. Because it leaves residual KCC2 function, this model sits
    closer to the human partial-loss genotypes than the constitutive null does.
  modeled_mechanisms:
  - target: Reduced KCC2-Mediated Chloride Extrusion
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Models a survivable partial reduction in KCC2 function with spontaneous
      seizures, unlike the perinatally lethal complete null.
    limitations: >-
      The residual function comes from retaining a whole isoform rather than from a
      hypomorphic missense allele as in patients, and death at two weeks is still far
      earlier than the human course; the model also cannot address the
      chloride-independent structural arm.
    evidence:
    - reference: PMID:27436767
      reference_title: "Impaired neuronal KCC2 function by biallelic SLC12A5 mutations in migrating focal seizures and severe developmental delay."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "KCC2b-specific knockout mice survive for up to 2 weeks, but die due to spontaneous seizures"
      explanation: >-
        Establishes the model's survival and seizure phenotype.


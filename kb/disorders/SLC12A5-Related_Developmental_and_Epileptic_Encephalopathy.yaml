  description: >-
    The diagnosis is established by identifying two pathogenic SLC12A5 alleles.
    Because affected individuals carry private variants and EIMFS is genetically
    heterogeneous, exome or genome sequencing rather than single-gene testing is the
    practical first-tier route.
  diagnosis_term:

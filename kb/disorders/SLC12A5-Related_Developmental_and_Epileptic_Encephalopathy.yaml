inheritance:
- name: Autosomal recessive
  description: >-
    DEE34 requires two pathogenic SLC12A5 alleles (homozygous or compound
    heterozygous). Parents are typically unaffected heterozygous carriers, and
    consanguinity is a recognized contributor to homozygous presentations.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:30763027
    reference_title: "SLC12A5-Related Epilepsy of Infancy with Migrating Focal Seizures."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SLC12A5-EIMFS is inherited in an autosomal recessive manner."
    explanation: >-
      GeneReviews states the mode of inheritance directly.
  - reference: PMID:26333769
    reference_title: "Mutations in SLC12A5 in epilepsy of infancy with migrating focal seizures."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we show recessive loss-of-function SLC12A5 mutations in patients with a severe infantile-onset pharmacoresistant epilepsy syndrome"
    explanation: >-
      The founding study established the recessive loss-of-function mechanism.

pathophysiology:
- name: Biallelic SLC12A5 Loss-of-Function Variant
  biological_scale: MOLECULAR
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Ion Channel and Synaptic Dysfunction"
  description: >-
    Two pathogenic SLC12A5 alleles - homozygous or compound heterozygous missense,
    splice-site, or in-frame deletion variants - are present in the affected
    individual. This node records only the genomic lesion; its separate protein-level
    consequences are modeled downstream.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:26333769
    reference_title: "Mutations in SLC12A5 in epilepsy of infancy with migrating focal seizures."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we report a novel genetic cause of EIMFS, identifying recessive SLC12A5 mutations in four affected children from two unrelated families"
    explanation: >-
      Establishes biallelic SLC12A5 variants as the causal genomic lesion.
  - reference: PMID:27436767
    reference_title: "Impaired neuronal KCC2 function by biallelic SLC12A5 mutations in migrating focal seizures and severe developmental delay."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole exome sequencing (WES) in ten sporadic and one familial case of EIMFS revealed compound heterozygous SLC12A5"
    explanation: >-
      Independent replication of the biallelic genotype in unrelated families.
  downstream:
  - target: Impaired KCC2 Folding, Glycosylation, and Membrane Trafficking
    causal_link_type: DIRECT
    description: >-
      Some variants act by preventing the transporter from reaching the plasma
      membrane in normal amounts.
  - target: Reduced Intrinsic KCC2 Chloride Transport Activity
    causal_link_type: DIRECT
    description: >-
      Other variants reach the surface normally but transport chloride poorly, so
      the transport deficit is not explained by trafficking alone.
  - target: Disrupted Transport-Independent KCC2 Structural Function
    causal_link_type: DIRECT
    description: >-
      Variants affecting the intracellular C-terminal domain disturb KCC2's
      scaffolding role independently of ion transport.

- name: Impaired KCC2 Folding, Glycosylation, and Membrane Trafficking
  biological_scale: MOLECULAR
  description: >-
    Misfolded KCC2 variants are under-glycosylated and retained in the endoplasmic
    reticulum, where they are degraded by ER-associated degradation, so less
    transporter reaches the neuronal plasma membrane. This is a trafficking defect
    only; the residual transport competence of the protein that does arrive is a
    separate question.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: ERAD pathway
    term:
      id: GO:0036503
      label: ERAD pathway
    modifier: INCREASED
  evidence:
  - reference: PMID:26333769
    reference_title: "Mutations in SLC12A5 in epilepsy of infancy with migrating focal seizures."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Decreased KCC2 surface expression, reduced protein glycosylation and impaired chloride extrusion contribute to loss of KCC2 activity"
    explanation: >-
      Directly reports reduced surface expression and glycosylation of mutant KCC2.
  - reference: PMID:38660387
    reference_title: "A novel pathogenic SLC12A5 missense variant in epilepsy of infancy with migrating focal seizures causes impaired KCC2 chloride extrusion."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Based on surface immunolabeling, the variant showed a reduction in membrane expression."
    explanation: >-
      Surface immunolabeling of the R231H variant confirms reduced membrane delivery.
  downstream:
  - target: Reduced KCC2-Mediated Chloride Extrusion
    causal_link_type: DIRECT
    description: >-
      Fewer transporters at the membrane means less total chloride extrusion capacity.

- name: Reduced Intrinsic KCC2 Chloride Transport Activity
  biological_scale: MOLECULAR
  description: >-
    Variants that reach the plasma membrane at normal density can still transport
    chloride poorly, so the per-molecule catalytic activity of the cotransporter is
    reduced independently of how much protein is present. Saitsu and colleagues
    documented mutant KCC2 with surface expression comparable to wild type but
    strongly suppressed chloride extrusion.
  molecular_functions:
  - preferred_term: potassium:chloride symporter activity
    term:
      id: GO:0015379
      label: potassium:chloride symporter activity
    modifier: DECREASED
  evidence:
  - reference: PMID:27436767
    reference_title: "Impaired neuronal KCC2 function by biallelic SLC12A5 mutations in migrating focal seizures and severe developmental delay."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Cell surface expression levels of these KCC2 mutants were similar to wildtype KCC2."
    explanation: >-
      Establishes that transport loss can occur without any trafficking deficit,
      justifying this node as separate from the trafficking node.
  - reference: PMID:27436767
    reference_title: "Impaired neuronal KCC2 function by biallelic SLC12A5 mutations in migrating focal seizures and severe developmental delay."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Gramicidin-perforated patch-clamp analysis demonstrated strongly suppressed Cl(-) extrusion function of E50_Q93del and M415V mutants, with mildly impaired function of A191V and S323P mutants."
    explanation: >-
      Quantifies variant-specific loss of intrinsic transport activity.
  downstream:
  - target: Reduced KCC2-Mediated Chloride Extrusion
    causal_link_type: DIRECT
    description: >-
      Lower catalytic activity per transporter reduces net chloride extrusion.

- name: Reduced KCC2-Mediated Chloride Extrusion
  biological_scale: CELLULAR
  description: >-
    The neuron's total capacity to move chloride out against its electrochemical
    gradient falls. Human variants produce partial rather than complete loss, which
    is why affected children survive infancy whereas Kcc2-null mice do not.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: chloride transmembrane transport
    term:
      id: GO:1902476
      label: chloride transmembrane transport
    modifier: DECREASED
  evidence:
  - reference: PMID:38660387
    reference_title: "A novel pathogenic SLC12A5 missense variant in epilepsy of infancy with migrating focal seizures causes impaired KCC2 chloride extrusion."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "gramicidin-perforated patch-clamp experiments and ammonium flux assay, both of which indicated a significant reduction in chloride extrusion"
    explanation: >-
      Two independent assays show reduced chloride extrusion by the variant transporter.
  - reference: PMID:27436767
    reference_title: "Impaired neuronal KCC2 function by biallelic SLC12A5 mutations in migrating focal seizures and severe developmental delay."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Functional analysis using the gramicidin-perforated patch-clamp technique confirmed significant, but not complete, loss of KCC2 function in the patients."
    explanation: >-
      Establishes that the loss is partial, which is the key contrast with the
      perinatally lethal complete-null mouse.
  downstream:
  - target: Elevated Intraneuronal Chloride Concentration
    causal_link_type: DIRECT
    description: >-
      Chloride entering the neuron is no longer cleared at the normal rate.

- name: Elevated Intraneuronal Chloride Concentration
  biological_scale: CELLULAR
  description: >-
    Intracellular chloride rises above the roughly 4-8 mM maintained in healthy
    mature neurons. This is a change in the ionic setpoint itself, distinct from its
    electrophysiological consequence for receptor-mediated currents.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: chloride ion homeostasis
    term:
      id: GO:0055064
      label: chloride ion homeostasis
    modifier: ABNORMAL
  evidence:
  - reference: PMID:27436767
    reference_title: "Impaired neuronal KCC2 function by biallelic SLC12A5 mutations in migrating focal seizures and severe developmental delay."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Heterologous expression of two KCC2 mutants, mimicking the patient status, produced a significantly greater intracellular Cl(-) level than with wildtype KCC2"
    explanation: >-
      Directly measures the elevated intracellular chloride produced by the patient
      genotype.
  downstream:
  - target: Depolarizing Shift in the GABA-A and Glycine Reversal Potential
    causal_link_type: DIRECT
    description: >-
      Because chloride flux through these receptors is passive, the reversal
      potential follows the chloride gradient.

- name: Depolarizing Shift in the GABA-A and Glycine Reversal Potential
  biological_scale: CELLULAR
  description: >-
    The reversal potential for GABA-A and glycine receptor currents moves positive
    of the resting membrane potential, so opening these channels drives chloride out
    of the cell and depolarizes it. This is the electrophysiological state change;
    the resulting failure of synaptic inhibition is modeled separately.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: regulation of membrane potential
    term:
      id: GO:0042391
      label: regulation of membrane potential
    modifier: ABNORMAL
  evidence:
  - reference: PMID:11395011
    reference_title: "Disruption of KCC2 reveals an essential role of K-Cl cotransport already in early synaptic inhibition."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "demonstrated an excitatory GABA and glycine action in the absence, but not in the presence, of KCC2"
    explanation: >-
      Shows that removing KCC2 converts GABA and glycine responses from inhibitory
      to excitatory.
  - reference: PMID:38660387
    reference_title: "A novel pathogenic SLC12A5 missense variant in epilepsy of infancy with migrating focal seizures causes impaired KCC2 chloride extrusion."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "is essential for this Cl--mediated signaling to be inhibitory as Cl- flux through these receptor channels is passive"
    explanation: >-
      States the biophysical dependence of the reversal potential on intracellular
      chloride.
  downstream:
  - target: Failure of Fast Synaptic Inhibition
    causal_link_type: DIRECT
    description: >-
      A depolarized reversal potential removes the hyperpolarizing and shunting
      effect of GABAergic input.

- name: Failure of Fast Synaptic Inhibition
  biological_scale: CELLULAR
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Excitation-Inhibition Imbalance"
  description: >-
    GABAergic and glycinergic synapses no longer raise the action-potential
    threshold of their targets. Excitatory drive is unopposed even though
    glutamatergic transmission itself is not primarily affected.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  - preferred_term: GABAergic neuron
    term:
      id: CL:0000617
      label: GABAergic neuron
  biological_processes:
  - preferred_term: inhibitory postsynaptic potential
    term:
      id: GO:0060080
      label: inhibitory postsynaptic potential
    modifier: DECREASED
  - preferred_term: gamma-aminobutyric acid signaling pathway
    term:
      id: GO:0007214
      label: gamma-aminobutyric acid signaling pathway
    modifier: ABNORMAL
  evidence:
  - reference: PMID:26333769
    reference_title: "Mutations in SLC12A5 in epilepsy of infancy with migrating focal seizures."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "thereby impairing normal synaptic inhibition and promoting neuronal excitability in this early-onset epileptic encephalopathy"
    explanation: >-
      Links loss of KCC2 activity to impaired synaptic inhibition.
  - reference: PMID:11395011
    reference_title: "Disruption of KCC2 reveals an essential role of K-Cl cotransport already in early synaptic inhibition."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "revealing a crucial role of KCC2 for synaptic inhibition"
    explanation: >-
      Genetic removal of KCC2 abolishes functional synaptic inhibition.
  downstream:
  - target: Neuronal Hyperexcitability and Hypersynchrony
    causal_link_type: DIRECT
    description: >-
      Unopposed excitation lowers the threshold for synchronized network discharge.
  - target: Impaired Termination of Ictal Discharges
    causal_link_type: DIRECT
    description: >-
      Chloride loading during a discharge cannot be cleared, so the discharge is not
      curtailed.

- name: Disrupted Transport-Independent KCC2 Structural Function
  biological_scale: MOLECULAR
  description: >-
    Beyond ion transport, KCC2 interacts through its large intracellular C-terminal
    domain with cytoskeletal and synaptic proteins to regulate dendritic spine
    formation and glutamatergic synapse plasticity. Variants can compromise this
    scaffolding role, and this arm is not captured by any chloride measurement.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: dendritic spine morphogenesis
    term:
      id: GO:0060997
      label: dendritic spine morphogenesis
    modifier: ABNORMAL
  evidence:
  - reference: PMID:35370549
    reference_title: "Loss of KCC2 in GABAergic Neurons Causes Seizures and an Imbalance of Cortical Interneurons."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Independently of its transporter function, KCC2 facilitates a number of processes that are central to circuit development, such as actin re-arrangement/formation of dendritic spines and plasticity of glutamatergic synapses"
    explanation: >-
      States the transport-independent structural role of KCC2 explicitly.
  - reference: PMID:26333769
    reference_title: "Mutations in SLC12A5 in epilepsy of infancy with migrating focal seizures."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SLC12A5 encodes the potassium-chloride co-transporter KCC2, which plays an integral role in neuronal inhibition4567 and maturation of cortical dendritic spines8."
    explanation: >-
      The founding disease paper names dendritic spine maturation as a second KCC2 role.
  downstream:
  - target: Impaired Excitatory Synapse and Dendritic Spine Maturation
    causal_link_type: DIRECT
    description: >-
      Loss of the scaffolding interaction disturbs spine and synapse formation.

- name: Impaired Excitatory Synapse and Dendritic Spine Maturation
  biological_scale: CELLULAR
  description: >-
    Dendritic spines and glutamatergic synapses form and mature abnormally. This is
    a structural developmental deficit that would persist even if chloride handling
    were corrected.
  cell_types:
  - preferred_term: pyramidal neuron
    term:
      id: CL:0000598
      label: pyramidal neuron
  biological_processes:
  - preferred_term: dendritic spine morphogenesis
    term:
      id: GO:0060997
      label: dendritic spine morphogenesis
    modifier: DECREASED
  evidence:
  - reference: PMID:35370549
    reference_title: "Loss of KCC2 in GABAergic Neurons Causes Seizures and an Imbalance of Cortical Interneurons."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "KCC2 directly interacts with a number of proteins to regulate dendritic spine formation, cell survival, synaptic plasticity, neuronal excitability, and other processes."
    explanation: >-
      Supports spine formation as a KCC2-dependent process disturbed by its loss.
  downstream:
  - target: Impaired Neurodevelopment
    causal_link_type: DIRECT
    description: >-
      Abnormal synapse maturation contributes to the developmental phenotype
      independently of seizure burden.

- name: Cortical Interneuron Subtype Imbalance
  biological_scale: TISSUE
  description: >-
    In mice lacking KCC2 in Dlx5-lineage GABAergic neurons, cortical interneurons
    reach their normal laminar positions but their subtype composition is skewed -
    excess somatostatin-expressing neurons in layer 5 and fewer parvalbumin-expressing
    neurons in layers 2/3 and 6. This is a change in inhibitory circuit composition
    rather than in the moment-to-moment strength of inhibition.
  cell_types:
  - preferred_term: cerebral cortex GABAergic interneuron
    term:
      id: CL:0010011
      label: cerebral cortex GABAergic interneuron
  evidence:
  - reference: PMID:35370549
    reference_title: "Loss of KCC2 in GABAergic Neurons Causes Seizures and an Imbalance of Cortical Interneurons."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "we found an underlying change in IN distribution, including an excess number of somatostatin neurons in layer 5 and a decrease in parvalbumin-expressing neurons in layer 2/3 and layer 6"
    explanation: >-
      Reports the specific interneuron subtype imbalance in the conditional knockout.
  downstream:
  - target: Neuronal Hyperexcitability and Hypersynchrony
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      An altered inhibitory circuit composition is proposed to contribute to
      hyperexcitability, though the cellular basis is not yet established.

- name: Impaired Termination of Ictal Discharges
  biological_scale: TISSUE
  description: >-
    KCC2-mediated chloride transport normally restores the chloride equilibrium
    after intense GABA-A receptor activation, which helps bring an ictal discharge
    to an end. With reduced KCC2, chloride accumulated during a discharge is cleared
    slowly and the discharge is prolonged. This concerns seizure offset, not seizure
    onset.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:33239270
    reference_title: "KCC2 Chloride Transport Contributes to the Termination of Ictal Epileptiform Activity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the putative KCC2 upregulator CLP257 improved chloride homeostasis and reduced the duration and frequency of ILDs in a concentration-dependent manner"
    explanation: >-
      Pharmacologically enhancing KCC2 shortens ictal discharges, supporting a role
      for KCC2-mediated chloride transport in seizure termination.
  - reference: PMID:33239270
    reference_title: "KCC2 Chloride Transport Contributes to the Termination of Ictal Epileptiform Activity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "increased ILD duration, and induced status epilepticus"
    explanation: >-
      The reciprocal manipulation - blocking KCC2 - prolongs ictal discharges and
      precipitates status epilepticus.
  downstream:
  - target: Migrating Multifocal Seizure Activity
    causal_link_type: DIRECT
    description: >-
      Discharges that fail to self-terminate become prolonged and recurrent.

- name: Neuronal Hyperexcitability and Hypersynchrony
  biological_scale: TISSUE
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Neuronal Hyperexcitability and Hypersynchrony"
  description: >-
    Cortical networks discharge at lower threshold and in synchrony. Because KCC2 is
    expressed throughout the cortex, susceptibility is diffuse rather than confined
    to one epileptogenic focus.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: modulation of chemical synaptic transmission
    term:
      id: GO:0050804
      label: modulation of chemical synaptic transmission
    modifier: ABNORMAL
  evidence:
  - reference: PMID:38660387
    reference_title: "A novel pathogenic SLC12A5 missense variant in epilepsy of infancy with migrating focal seizures causes impaired KCC2 chloride extrusion."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These findings implicate pathogenicity of the SLC12A5 variant that leads to impaired inhibitory neurotransmission, increasing probability for hyperexcitability and epileptogenesis."
    explanation: >-
      Connects the transport deficit to network hyperexcitability and epileptogenesis.
  downstream:
  - target: Migrating Multifocal Seizure Activity
    causal_link_type: DIRECT
    description: >-
      Diffuse hyperexcitability with no fixed focus produces seizures that arise
      independently at successive cortical sites.

- name: Migrating Multifocal Seizure Activity
  biological_scale: ORGANISM
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Seizure Generation and Epileptogenesis"
  description: >-
    Seizures begin as focal motor events, typically with head and eye deviation, and
    evolve into near-continuous multifocal discharges that migrate from one cortical
    region to another - the defining electroclinical signature of EIMFS - and resist
    conventional anti-seizure medication.
  evidence:
  - reference: PMID:30763027
    reference_title: "SLC12A5-Related Epilepsy of Infancy with Migrating Focal Seizures."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In most children epilepsy begins as focal motor seizures (typically involving head and eye deviation) that become multifocal and intractable to conventional anti-seizure medication (ASM)."
    explanation: >-
      GeneReviews describes the seizure evolution and its pharmacoresistance.
  - reference: PMID:27436767
    reference_title: "Impaired neuronal KCC2 function by biallelic SLC12A5 mutations in migrating focal seizures and severe developmental delay."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "partially disrupted neuronal Cl(-) extrusion, mediated by two types of differentially impaired KCC2 mutant in an individual, causes EIMFS"
    explanation: >-
      Attributes the migrating focal seizure phenotype to partial chloride-extrusion loss.
  downstream:
  - target: Impaired Neurodevelopment
    causal_link_type: DIRECT
    description: >-
      High seizure burden in the first months of life compounds the developmental
      consequences of the underlying synaptic defect.

- name: Impaired Neurodevelopment
  biological_scale: ORGANISM
  description: >-
    Development either arrests or regresses at the time of seizure onset, yielding
    severe to profound intellectual disability, axial hypotonia, and postnatal
    microcephaly. Two upstream routes converge here - the seizure burden itself and
    the transport-independent synapse maturation defect - and the published cases do
    not resolve their relative contributions.
  evidence:
  - reference: PMID:30763027
    reference_title: "SLC12A5-Related Epilepsy of Infancy with Migrating Focal Seizures."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "is characterized by onset of seizures before age six months and either developmental delay or developmental regression with seizure onset"
    explanation: >-
      GeneReviews couples the developmental phenotype to seizure onset.
  - reference: PMID:38660387
    reference_title: "A novel pathogenic SLC12A5 missense variant in epilepsy of infancy with migrating focal seizures causes impaired KCC2 chloride extrusion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified a novel recessively inherited SLC12A5 c.692G>A, p. (R231H) variant in a patient diagnosed with severe and drug-resistant EIMFS and profound intellectual disability"
    explanation: >-
      Documents profound intellectual disability accompanying the epilepsy.


name: SLC12A5-Related Developmental and Epileptic Encephalopathy
creation_date: "2026-08-19T00:00:00Z"
category: Mendelian
synonyms:
- DEE34
- EIEE34
- SLC12A5-EIMFS
- SLC12A5-related epilepsy of infancy with migrating focal seizures
- KCC2 deficiency disorder
- developmental and epileptic encephalopathy 34
description: >-
  SLC12A5-related developmental and epileptic encephalopathy (DEE34) is an
  ultra-rare autosomal recessive epileptic encephalopathy caused by biallelic
  loss-of-function variants in SLC12A5, which encodes KCC2, the neuron-specific
  K+-Cl- cotransporter. KCC2 uses the outward potassium gradient established by
  the Na+/K+-ATPase to extrude chloride from neurons, keeping intracellular
  chloride low enough that opening a GABA-A or glycine receptor drives chloride
  inward and hyperpolarizes the cell. When KCC2 function is reduced, intraneuronal
  chloride rises, the GABA-A reversal potential shifts depolarized, and fast
  synaptic inhibition fails. The clinical counterpart is epilepsy of infancy with
  migrating focal seizures (EIMFS, formerly malignant migrating partial seizures
  of infancy): focal motor seizures beginning in the first months of life that
  become multifocal and migrating, are pharmacoresistant, and are accompanied by
  developmental delay or regression, axial hypotonia, and postnatal microcephaly.
  KCC2 additionally has transport-independent structural roles in dendritic spine
  and excitatory-synapse maturation, so some variant combinations disturb
  neurodevelopment through a second, chloride-independent route. Fewer than twenty
  genetically confirmed individuals have been published, so the phenotype is
  described qualitatively rather than with frequency percentages.

progression:
- phase: Course and mortality
  age_range: Infancy to childhood
  notes: >-
    The course is severe and static-to-progressive rather than relapsing. Reported
    individuals range from profound disability with early death to somewhat milder
    courses with late acquisition of ambulation or single words. Death is usually
    from respiratory infection, the terminus of the hypotonia, unsafe-swallow, and
    recurrent-aspiration branch already modeled in the phenotypes.
  evidence:
  - reference: PMID:38660387
    reference_title: "A novel pathogenic SLC12A5 missense variant in epilepsy of infancy with migrating focal seizures causes impaired KCC2 chloride extrusion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "She died due to pneumonia at the age of 4 years and 5 months."
    explanation: >-
      Documents death from pneumonia, connecting the aspiration phenotype to mortality.
  - reference: PMID:30763027
    reference_title: "SLC12A5-Related Epilepsy of Infancy with Migrating Focal Seizures."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of these nine children, six had severe developmental delay with no progress of abilities and three made notable neurodevelopmental progress."
    explanation: >-
      Gives the range of developmental outcome across the published cohort.

discussions:
- discussion_id: controversy_kcc2_setpoint_vs_impermeant_anions
  prompt: >-
    Is the elevated intraneuronal chloride in KCC2 deficiency principally the direct
    consequence of lost cation-chloride cotransport, or is the neuronal chloride
    setpoint dominated by the distribution of impermeant intracellular anions, with
    KCC2 acting mainly to restore that setpoint after activity-driven chloride loads?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#Reduced KCC2-Mediated Chloride Extrusion
  - pathophysiology#Elevated Intraneuronal Chloride Concentration
  rationale: >-
    The disease model curated here treats reduced KCC2 transport as the proximate
    cause of a raised chloride setpoint. An alternative account holds that the
    resting setpoint is fixed largely by fixed impermeant anionic charge, with KCC2
    responsible for clearing dynamic chloride loads rather than for setting resting
    chloride. The two readings predict different therapeutic targets: restoring KCC2
    transport capacity would be central under the first, whereas under the second the
    critical variable is the neuron's ability to recover from activity-driven loading,
    which would foreground interventions aimed at seizure-associated chloride
    accumulation. Both readings are compatible with the human variant data, since
    patient assays measure extrusion capacity rather than resting setpoint in vivo.
  evidence:
  - reference: PMID:35370549
    reference_title: "Loss of KCC2 in GABAergic Neurons Causes Seizures and an Imbalance of Cortical Interneurons."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "has been debated in favor of alternative mechanisms, such as distribution of impermeable anionic charges"
    explanation: >-
      States the existence and content of the disagreement.
  proposed_experiments:
  - experiment_id: exp_chloride_imaging_patient_neurons
    name: Separate resting chloride setpoint from chloride recovery kinetics in patient neurons
    description: >-
      Measure resting intracellular chloride and post-load chloride recovery kinetics
      separately, using ratiometric chloride imaging in patient-derived iPSC neurons
      carrying DEE34 genotypes alongside isogenic controls, to determine whether the
      resting setpoint or the recovery rate is the parameter that the variants change.

- discussion_id: gap_kcc2_bidirectional_seizure_effect
  prompt: >-
    Given that both proconvulsant and anticonvulsant effects of KCC2 inhibition have
    been reported, under what circumstances does reduced KCC2 activity worsen rather
    than limit seizure activity, and does that boundary apply to the constitutive,
    lifelong partial deficiency of DEE34?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired Termination of Ictal Discharges
  rationale: >-
    KCC2 extrudes chloride at the cost of raising extracellular potassium, which can
    itself depolarize neurons and potentiate seizures. Experimental KCC2 blockade has
    therefore been reported to be both pro- and anticonvulsant depending on which step
    is rate-limiting. All of that evidence comes from acute pharmacological
    manipulation in slice preparations; DEE34 is instead a constitutive partial
    deficiency present throughout development. Whether the acute-blockade findings
    transfer to the chronic genetic condition is unresolved, and it bears directly on
    whether KCC2-enhancing compounds would be expected to help these patients.
  evidence:
  - reference: PMID:33239270
    reference_title: "KCC2 Chloride Transport Contributes to the Termination of Ictal Epileptiform Activity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Thus, KCC2 may either diminish or facilitate seizure activity, and both proconvulsant and anticonvulsant effects of KCC2 inhibition have been reported."
    explanation: >-
      States the unresolved bidirectionality directly.
  - reference: PMID:33239270
    reference_title: "KCC2 Chloride Transport Contributes to the Termination of Ictal Epileptiform Activity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Anticonvulsant effects predominate when KCC2-mediated chloride transport rather than potassium buffering is the rate-limiting step in restoring ECl"
    explanation: >-
      Identifies the condition that determines the direction of effect, which is what
      would need to be established for the chronic genetic deficiency.
  proposed_experiments:
  - experiment_id: exp_kcc2_enhancer_in_hypomorphic_model
    name: Test a KCC2 enhancer in a constitutive hypomorphic Slc12a5 model
    description: >-
      Test a KCC2-enhancing compound against seizure burden in a hypomorphic Slc12a5
      knock-in mouse carrying a patient variant, rather than in acute pharmacological
      blockade models, measuring both electrographic seizure duration and
      extracellular potassium to establish which step is rate-limiting in a
      constitutive partial deficiency.

- discussion_id: mismatch_kcc2_null_mouse_versus_human_partial_loss
  prompt: >-
    Do the Kcc2 knockout mouse models, which are perinatally lethal or die within
    weeks, model DEE34 faithfully, given that surviving human patients retain partial
    KCC2 transport activity and that the perinatal NKCC1-to-KCC2 switch occurs at a
    different relative developmental stage in mouse and human?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Reduced KCC2-Mediated Chloride Extrusion
  - pathophysiology#Cortical Interneuron Subtype Imbalance
  rationale: >-
    Complete Kcc2 loss kills mice at birth, whereas every published human DEE34
    genotype retains measurable residual chloride extrusion and the children survive
    into childhood. The mouse models therefore sit at a more severe point on the
    dose-response curve than the human disease. Independently, the developmental
    window matters: in human neocortex the shift from depolarizing to hyperpolarizing
    GABA reaches maturity around six months after birth, and mouse postnatal age does
    not map one-to-one onto that timeline. Any inference from knockout phenotypes to
    the timing or severity of human disease - including the interneuron subtype
    imbalance, which has been shown only in mouse - has to carry this caveat.
  evidence:
  - reference: PMID:11395011
    reference_title: "Disruption of KCC2 reveals an essential role of K-Cl cotransport already in early synaptic inhibition."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We show that KCC2 knockout mice died immediately after birth due to severe motor deficits that also abolished respiration."
    explanation: >-
      Establishes the severity gap between the null mouse and surviving human patients.
  - reference: PMID:27436767
    reference_title: "Impaired neuronal KCC2 function by biallelic SLC12A5 mutations in migrating focal seizures and severe developmental delay."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Functional analysis using the gramicidin-perforated patch-clamp technique confirmed significant, but not complete, loss of KCC2 function in the patients."
    explanation: >-
      Confirms that human disease is a partial, not complete, loss of function.
  - reference: PMID:38660387
    reference_title: "A novel pathogenic SLC12A5 missense variant in epilepsy of infancy with migrating focal seizures causes impaired KCC2 chloride extrusion."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In the human neocortex, this transition takes place perinatally and reaches maturation at roughly 6 months after birth"
    explanation: >-
      Gives the human developmental timing that mouse postnatal age does not directly
      match.
  proposed_experiments:
  - experiment_id: exp_hypomorphic_knockin_allelic_series
    name: Graded Slc12a5 knock-in allelic series against the null phenotype
    description: >-
      Generate an allelic series of Slc12a5 knock-in mice carrying human DEE34
      variants of graded residual transport activity, and compare seizure onset,
      survival, and cortical interneuron composition against the null, to establish
      how much of the null phenotype is an artefact of complete loss.

- discussion_id: gap_relative_contribution_transport_vs_structural_arm
  prompt: >-
    How much of the developmental phenotype in DEE34 is attributable to the
    transport-independent structural role of KCC2 in dendritic spine and excitatory
    synapse maturation, as opposed to the chloride-extrusion deficit and the seizure
    burden it causes?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Disrupted Transport-Independent KCC2 Structural Function
  - pathophysiology#Impaired Neurodevelopment
  rationale: >-
    Two upstream arms converge on the developmental phenotype in this model, and the
    published cases cannot separate them: every reported genotype impairs chloride
    extrusion, so no patient provides the natural experiment of an isolated structural
    defect. The distinction is not academic - if the structural arm carries substantial
    weight, then even complete seizure control or full restoration of chloride
    transport would leave part of the developmental disability untouched, which
    changes what a KCC2-targeted therapy could be expected to achieve.
  evidence:
  - reference: PMID:26333769
    reference_title: "Mutations in SLC12A5 in epilepsy of infancy with migrating focal seizures."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SLC12A5 encodes the potassium-chloride co-transporter KCC2, which plays an integral role in neuronal inhibition4567 and maturation of cortical dendritic spines8."
    explanation: >-
      Names both KCC2 roles, which is the basis for treating them as separate arms.
  - reference: PMID:35370549
    reference_title: "Loss of KCC2 in GABAergic Neurons Causes Seizures and an Imbalance of Cortical Interneurons."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "More work will be needed to define the specific cellular basis for these findings, including whether they are due to abnormal circuit formation versus the sequela of defective IN inhibition."
    explanation: >-
      The authors of the conditional knockout state the same unresolved separation
      between circuit-formation and inhibition-failure explanations.
  proposed_experiments:
  - experiment_id: exp_transport_dead_structural_intact_knockin
    name: Transport-dead versus structure-disrupting KCC2 knock-in comparison
    description: >-
      Compare knock-in mice carrying a transport-dead but structurally intact KCC2
      against mice carrying a C-terminal variant that preserves transport while
      disrupting protein interactions, scoring dendritic spine density, excitatory
      synapse number, seizure burden, and behavioural development, to apportion the
      developmental phenotype between the two arms.


    reference_title: Molecular Profiling Reveals Involvement of ESCO2 in Intermediate Progenitor Cell Maintenance in the Developing Mouse Cortex.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Loss-of-function experiments in cortex-specific mutants of Esco2, one of
      the novel IPC genes, demonstrate its critical role in IPC maintenance
    explanation: Conditional Esco2 loss depletes cortical intermediate progenitors.
  - reference: PMID:33798452
    reference_title: Molecular Profiling Reveals Involvement of ESCO2 in Intermediate Progenitor Cell Maintenance in the Developing Mouse Cortex.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The expression of Esco2 is required for the viability of these cell
      populations and their progenies to afford proper cortical histogenesis.
    explanation: Progenitor and neuronal survival requires Esco2.
  downstream:

animal_models:
- name: Esco2 constitutive knockout mouse
  species: Mouse
  genotype: Esco2 null (Cre-mediated deletion of exons 2-3)
  publication: PMID:22101327
  description: >-
    Constitutive loss of Esco2 ends development at pre- and post-implantation
    stages; Esco2-deficient embryonic fibroblasts show reduced Smc3
    acetylation and Sororin recruitment, loss of pericentric cohesion,
    railroad-track chromosomes, prometaphase delay and apoptosis.
  modeled_mechanisms:
  - target: Failed Pericentric Sister Chromatid Cohesion Establishment
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: Reproduces the pericentric cohesion defect and railroad chromosomes.
    limitations: >-
      Complete loss is lethal in early embryos, whereas patients survive, so
      the organismal phenotype cannot be studied without conditional
      deletion.
    evidence:
    - reference: PMID:22101327
      reference_title: Cohesin acetyltransferase Esco2 is a cell viability factor and is required for cohesion in pericentric heterochromatin.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Here, we show that Esco2 deficiency leads to termination of mouse
        development at pre- and post-implantation stages, indicating that
        Esco2 functions non-redundantly with Esco1.
      explanation: The model and its lethality.
- name: Esco2 limb mesenchyme conditional knockout mouse (Prrx1-Cre)
  species: Mouse
  genotype: Esco2fl/fl;Prrx1-CreTg/0 (exon 4 deletion modeled on human c.879_880delAG)
  publication: PMID:39168984
  description: >-
    Deletion of Esco2 in limb mesenchyme produces fully penetrant phocomelia
    with skull flattening and micrognathia, most animals dying perinatally.
    p53 signaling in a pre-apoptotic mesenchymal population from E9.5,
    apoptosis from E10.5, vascular disorganization and hemorrhage by E12.5;
    in utero pifithrin-alpha reduced apoptosis and prevented hemorrhage but
    did not restore chondrogenesis.
  modeled_mechanisms:
  - target: Limb Bud Outgrowth Failure
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: TISSUE
    description: Reproduces symmetric limb reduction resembling the human phenotype.
    limitations: >-
      Deletion restricted to Prrx1-expressing mesenchyme, so contributions
      from other limb lineages (ectoderm, endothelium) and systemic effects
      are not modeled.
    evidence:
    - reference: PMID:39168984
      reference_title: Limb reduction in an Esco2 cohesinopathy mouse model is mediated by p53-dependent apoptosis and vascular disruption.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Esco2fl/fl;Prrx1-CreTg/0 pups at P0 were born with striking limb
        reduction that resembled the human RBS phenotype
      explanation: Model faithfully shows the limb phenotype.
  - target: Limb Bud Vascular Disruption and Hemorrhage
    relationship: RECAPITULATES
    fidelity: UNKNOWN
    model_scale: TISSUE
    description: The only model in which the vascular arm has been shown.
    limitations: No human embryonic tissue is available to confirm a vascular component.
    evidence:
    - reference: PMID:39168984
      reference_title: Limb reduction in an Esco2 cohesinopathy mouse model is mediated by p53-dependent apoptosis and vascular disruption.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Our results reveal morphological and vascular defects culminating in
        hemorrhage of mutant limbs at E12.5.
      explanation: Vascular phenotype in the model.
  - target: p53 Pathway Activation
    relationship: PERTURBS
    fidelity: MODERATE
    model_scale: TISSUE
    description: Pifithrin-alpha p53 inhibition in utero.
    limitations: >-
      Rescued hemorrhage and reduced apoptosis but did not restore
      chondrogenesis or full limb morphology.
    evidence:
    - reference: PMID:39168984
      reference_title: Limb reduction in an Esco2 cohesinopathy mouse model is mediated by p53-dependent apoptosis and vascular disruption.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The morphology of the limb was not fully recovered, which suggests a
        more primary role of p53 in supporting the vascular phenotype.
      explanation: Partial rescue after p53 inhibition.
- name: Esco2 cortex conditional knockout mouse (Emx1-Cre)
  species: Mouse
  genotype: Esco2fl/fl;Emx1-Cre
  publication: PMID:33798452
  description: >-
    Cortex-specific Esco2 deletion causes apoptosis of radial glial and
    intermediate progenitors and their neurons and failure of cortical
    layering.
  modeled_mechanisms:
  - target: Cortical Progenitor Loss
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Progenitor apoptosis and neuron loss in the developing cortex.
    limitations: >-
      Complete deletion in cortical progenitors is more severe than the
      human microcephaly, in which ESCO2 function is reduced systemically but
      patients may have normal intelligence.
    evidence:
    - reference: PMID:33798452
      reference_title: Molecular Profiling Reveals Involvement of ESCO2 in Intermediate Progenitor Cell Maintenance in the Developing Mouse Cortex.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Taking our data together, we show that ESCO2 expression is essential
        for the maintenance of IPCs and proper neurogenesis during cortical
        development.
      explanation: Summary of the cortical model.
- name: esco2 morphant zebrafish
  species: Zebrafish
  genotype: esco2 morpholino knockdown
  publication: PMID:21637801
  description: >-
    Esco2-depleted embryos show mitotic defects, craniofacial abnormalities
    and fin truncations, with high cell death and cell-cycle and apoptosis
    gene expression changes distinct from those after rad21 loss.
  modeled_mechanisms:
  - target: Apoptosis of Proliferating Embryonic Progenitors
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Widespread cell death accompanies RBS-like craniofacial and fin defects.
    limitations: >-
      Morpholino knockdown can cause off-target p53 activation and toxicity;
      fish fins are not homologous in detail to tetrapod limb segments.
    evidence:
    - reference: PMID:21637801
      reference_title: A zebrafish model of Roberts syndrome reveals that Esco2 depletion interferes with development by disrupting the cell cycle.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Esco2 depleted zebrafish embryos exhibit features that resemble RBS,
        including mitotic defects, craniofacial abnormalities and limb
        truncations.
      explanation: The model shows RBS-like features.
- name: esco2 mutant zebrafish
  species: Zebrafish
  genotype: esco2 embryonic-lethal mutant from a genomic-instability screen
  publication: PMID:26044958
  description: >-
    Live imaging shows premature chromatid separation, chromosome scattering,
    prolonged mitotic delay, anaphase bridges, micronuclei and aneuploidy,
    with p53-dependent neural tube apoptosis; 10-20% of cells keep weakened
    cohesion without Esco2.
  modeled_mechanisms:
  - target: Prolonged Mitosis and Chromosome Missegregation
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: Direct in vivo observation of the mitotic defect.
    limitations: Embryonic lethal; limb and palate phenotypes cannot be assessed.
    evidence:
    - reference: PMID:26044958
      reference_title: Variations in dysfunction of sister chromatid cohesion in esco2 mutant zebrafish reflect the phenotypic diversity of Roberts syndrome.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        These studies provide a unique in vivo vertebrate view of the mitotic
        defects and consequences of cohesion establishment loss, and they
        provide a compensation-based model to explain the RBS phenotypes.
      explanation: The model's contribution.
- name: esco2 R80S mutant medaka
  species: Medaka
  genotype: esco2 R80S homozygous (TILLING)
  publication: PMID:22694322
  description: >-
    Developmental arrest with craniofacial and chromosomal abnormalities,
    embryonic lethality, widespread apoptosis and reduced notch1a expression.
  modeled_mechanisms:
  - target: Apoptosis of Proliferating Embryonic Progenitors
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Apoptosis and craniofacial defects in a missense mutant.
    limitations: Embryonic lethal; fish lack tetrapod limbs.
    evidence:
    - reference: PMID:22694322
      reference_title: Establishment and characterization of Roberts syndrome and SC phocomelia model medaka (Oryzias latipes).
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The medaka mutant carrying the homozygous mutation at R80S in the
        conserved region of ESCO2 exhibited clinical variety (i.e.
        developmental arrest with craniofacial and chromosomal abnormalities
        and embryonic lethality) as characterized in RBS/SC.
      explanation: RBS-like features in the medaka model.

name: Roberts Syndrome
creation_date: "2026-09-25T13:56:18Z"
category: Mendelian
synonyms:
- Roberts-SC phocomelia syndrome
- ESCO2 spectrum disorder
- Roberts syndrome/SC phocomelia
- RBS
- SC phocomelia syndrome
- SC pseudothalidomide syndrome
- pseudothalidomide syndrome
- phocomelia-pseudothalidomide syndrome
- Roberts tetraphocomelia syndrome
- tetraphocomelia-cleft palate syndrome
- Appelt-Gerken-Lenz syndrome
description: >-
  Roberts syndrome, now also called ESCO2 spectrum disorder, is an autosomal
  recessive cohesinopathy caused by biallelic loss-of-function variants in
  ESCO2, the acetyltransferase that acetylates the SMC3 subunit of cohesin
  during S phase so that sister chromatids stay paired until anaphase. The
  clinical picture is prenatal-onset growth restriction, symmetric limb
  reduction in which the upper limbs are more often and more severely affected
  than the lower (from bilateral tetraphocomelia to mesomelic shortening,
  oligodactyly and thumb aplasia), flexion contractures, and a characteristic
  face with microcephaly, bilateral cleft lip and palate, micrognathia, widely
  spaced prominent eyes, malar flattening and underdeveloped nasal alae.
  Microphthalmia and corneal opacities, intellectual disability, cardiac and
  renal malformations, and in survivors cerebrovascular disease, are also
  reported.

  Severity is a continuum. The severe end (historically Roberts syndrome,
  OMIM 268300) includes stillbirth and neonatal death; the mild end
  (historically SC phocomelia, OMIM 269000) has lesser limb reduction and
  survival into adulthood. Both ends carry the same cytogenetic sign,
  premature centromere separation (heterochromatin repulsion, or "railroad
  track" chromosomes), and the same class of truncating ESCO2 alleles, so
  genotype does not predict severity and the two are curated here as one
  disease.

  The cellular lesion is failure to establish cohesion at pericentric
  heterochromatin. In patient cells and in fish and mouse models this is
  followed by prolonged mitosis, chromosome missegregation and aneuploidy,
  p53 activation and death or reduced proliferation of rapidly dividing
  embryonic progenitors, which is the most widely held explanation for the
  limb and craniofacial reduction. Impaired ribosome biogenesis with mTORC1
  repression, cohesin-dependent transcriptional dysregulation, and, in the
  developing mouse limb, p53-dependent vascular disruption and hemorrhage are
  documented additional mechanisms whose relative weight is unresolved.

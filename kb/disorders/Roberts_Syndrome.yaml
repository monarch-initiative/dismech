- name: Failed Pericentric Sister Chromatid Cohesion Establishment
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Sister chromatids are not held together at pericentric heterochromatin
    and the Yq heterochromatin. In metaphase spreads this is seen as premature
    centromere separation and heterochromatin repulsion (puffing), giving the

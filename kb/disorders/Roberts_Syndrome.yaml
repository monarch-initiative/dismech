notes: >-
  Lump/split. MONDO:0100253 carries both OMIM 268300 (Roberts syndrome) and
  OMIM 269000 (SC phocomelia) as cross-references, and the GeneReviews chapter
  (PMID:20301332) treats them as one ESCO2 spectrum disorder. The two names
  describe the severe and mild ends of one continuum with the same gene, the
  same allele class and the same cytogenetic sign (PMID:16380922,
  PMID:20101700), so no has_subtypes are declared; severity variation is
  described in the phenotype entries instead.

  Juberg-Hayward syndrome (MONDO:0008992, OMIM 216100) is caused by biallelic
  ESCO2 variants as well (a homozygous p.Arg552Ter allele in the reported
  families) and shows premature centromere separation, but it is kept as a
  separate, allelic entity with cleft lip and palate, thumb hypoplasia and
  humeroradial synostosis or radial head dislocation, following MONDO and the
  authors who described it (PMID:32255174, PMID:32977150). It is listed as a
  differential diagnosis here and is discussed as a syndromic context in
  kb/disorders/Humeroradial_Synostosis.yaml.

  Tetraphocomelia with a normal karyotype and no ESCO2 variant has been
  reported as "pseudo-Roberts syndrome" (PMID:33026893); such cases are not
  this disease.

  The limb and cerebral-cortex progenitor loss described in this entry is
  supported by conditional Esco2 knockout mice (PMID:39168984, PMID:33798452);
  constitutive Esco2 loss is lethal before or shortly after implantation in
  the mouse (PMID:22101327), whereas human patients survive, which is recorded
  as a model-mismatch discussion.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic ESCO2 variants, homozygous (often with parental consanguinity)
    or compound heterozygous. Parents of an affected child are asymptomatic
    heterozygotes and each sib has a 25% risk of being affected. Carrier,
    prenatal and preimplantation testing are possible once both variants are
    known; prenatal diagnosis is also possible by cytogenetic detection of
    premature centromere separation in amniocytes or chorionic villi with
    ultrasound for limb reduction.
  evidence:
  - reference: PMID:20301332
    reference_title: ESCO2 Spectrum Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      ESCO2 spectrum disorder is inherited in an autosomal recessive manner.
    explanation: GeneReviews genetic counseling statement of the mode of inheritance.
  - reference: PMID:20301332
    reference_title: ESCO2 Spectrum Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      If both parents are known to be heterozygous for an ESCO2 pathogenic
      variant, each sib of an affected individual has at conception a 25%
      chance of inheriting both pathogenic variants and being affected, a 50%
      chance of inheriting one pathogenic variant and being an asymptomatic
      carrier, and a 25% chance of being unaffected and not a carrier.
    explanation: GeneReviews recurrence-risk figures for sibs.
  - reference: PMID:20301332
    reference_title: ESCO2 Spectrum Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Prenatal testing for pregnancies at increased risk is also possible by
      cytogenetic testing of fetal cells obtained by amniocentesis or
      chorionic villus sampling in conjunction with ultrasound examination.
    explanation: GeneReviews on cytogenetic prenatal diagnosis.
  - reference: PMID:15821733
    reference_title: Roberts syndrome is caused by mutations in ESCO2, a human homolog of yeast ECO1 that is essential for the establishment of sister chromatid cohesion.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Roberts syndrome is an autosomal recessive disorder characterized by
      craniofacial anomalies, tetraphocomelia and loss of cohesion at
      heterochromatic regions of centromeres and the Y chromosome.
    explanation: Gene-discovery paper stating recessive inheritance.
  - reference: PMID:18186147
    reference_title: Prenatal diagnosis of Roberts syndrome and detection of an ESCO2 frameshift mutation in a Pakistani family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A homozygous mutation leading to a frameshift in ESCO2 was identified in
      the fetal DNA sample. Both parents are heterozygous carriers of the same
      mutation.
    explanation: Recurrence in sibs with heterozygous carrier parents.

genetic:
- name: ESCO2
  gene_term:
    preferred_term: ESCO2
    term:
      id: hgnc:27230
      label: ESCO2
  association: Causative
  variant_origin: GERMLINE
  features: >-
    ESCO2 at 8p21.1. Biallelic variants, homozygous or compound
    heterozygous. Almost all reported alleles truncate the protein
    (frameshift, nonsense, splice site), often in exon 3, and remove all or
    part of the C-terminal acetyltransferase domain; rare missense or
    in-frame changes in that domain (W539G) abolish acetyltransferase
    activity. The previously reported exon 3 alleles c.760_761insA and
    c.764_765delTT were found again, homozygous, in consanguineous Egyptian
    families. Genotype does not predict severity: the same truncating
    classes occur at both ends of the spectrum, and variation in the
    efficiency of nonsense-mediated decay between tissues and individuals
    has been proposed to contribute to the variability. Facial severity
    correlates with limb severity, and corneal opacity may track specific
    alleles. The allelic Juberg-Hayward syndrome is caused by homozygous
    p.Arg552Ter.
  evidence:
  - reference: PMID:19574259
    reference_title: Phenotypic variability in 49 cases of ESCO2 mutations, including novel missense and codon deletion in the acetyltransferase domain, correlates with ESCO2 expression and establishes the clinical criteria for Roberts syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of 26 mutations described to date, only one missense mutation has been
      reported and all others are predicted to be truncating mutations.
    explanation: The variant class spectrum.
  - reference: PMID:18411254
    reference_title: The molecular mechanism underlying Roberts syndrome involves loss of ESCO2 acetyltransferase activity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We observed that these mutations result in complete or partial loss of
      the acetyltransferase domain except for the only missense mutation that
      occurs in this domain (c.1615T>G, W539G).
    explanation: Truncations remove the acetyltransferase domain.
  - reference: PMID:26710928
    reference_title: Expanding the mutation and clinical spectrum of Roberts syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      sequencing of the ESCO2 gene identified a novel mutation c.244_245dupCT
      (p.T83Pfs*20) in one family besides two previously reported mutations
      c.760_761insA (p.T254Nfs*27) and c.764_765delTT (p.F255Cfs*25)
    explanation: Recurrent exon 3 frameshift alleles.
  - reference: PMID:16380922
    reference_title: "Inactivating mutations in ESCO2 cause SC phocomelia and Roberts syndrome: no phenotype-genotype correlation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Since only protein-truncating mutations were identified, regardless of
      clinical severity, we conclude that genotype does not predict phenotype.
    explanation: No genotype-phenotype correlation.
  - reference: PMID:30204960
    reference_title: "ROBERTS SYNDROME: CLINICAL AND CYTOGENETIC STUDIES IN 8 EGYPTIAN PATIENTS AND MOLECULAR STUDIES IN 4 PATIENTS WITH GENOTYPE/PHENOTYPE CORRELATION."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We confirmed previous results of lack of genotype/phenotype correlation.
      We also confirmed that the severity of limb malformation correlates with
      craniofacial manifestations.
    explanation: Independent confirmation in an Egyptian series.
  - reference: PMID:16775838
    reference_title: "A homozygous frameshift mutation in the ESCO2 gene: evidence of intertissue and interindividual variation in Nmd efficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The existence of such a variation in the NMD efficiency could explain
      the broad intrafamilial and interfamilial variability in the clinical
      presentation of RS patients
    explanation: A proposed modifier of severity.
  - reference: PMID:20101700
    reference_title: The Roberts syndrome/SC phocomelia spectrum--a case report of an adult with review of the literature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The syndrome is caused by mutations in the ESCO2 (establishment of
      cohesion 1 homolog 2) (Entrez 609353) gene, which is located at 8p21.1
    explanation: Chromosomal location.

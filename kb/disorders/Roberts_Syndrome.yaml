- name: Premature Centromere Separation on Metaphase Spreads
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Cytogenetic manifestation of the cohesion defect: centromeres of most
    chromosomes are separated in metaphase and the pericentric heterochromatin
    of chromosomes 1, 9 and 16 and distal Yq appears puffed or repelled. Seen
    in lymphocytes, fibroblasts, amniocytes and chorionic villi, and used as a
    diagnostic test. Also modeled as a Cellular phenotype.
  evidence:
  - reference: PMID:8291532
    reference_title: "Roberts syndrome: a review of 100 cases and a new rating system for severity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Mitotic cells from many individuals with RS display a characteristic
      cytogenetic phenomenon consisting of repulsion of heterochromatic
      regions near centromeres, particularly of chromosomes 1, 9, 16, and
      splaying of the short arms of the acrocentrics and of the distal Yq.
    explanation: Describes the heterochromatin repulsion seen in patient mitoses.
  - reference: PMID:26710928
    reference_title: Expanding the mutation and clinical spectrum of Roberts syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cytogenetic analysis showed the characteristic premature separation of
      centromeres and puffing of heterochromatic regions.
    explanation: Found in three molecularly confirmed patients.
  downstream:

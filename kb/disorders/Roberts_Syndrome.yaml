mechanistic_hypotheses:
- hypothesis_group_id: mitotic_failure_progenitor_apoptosis
  hypothesis_label: Mitotic failure and p53-dependent loss of embryonic progenitors
  status: CANONICAL
  description: >-
    Loss of pericentric cohesion prolongs mitosis and causes missegregation
    and aneuploidy; the resulting stress activates p53, and rapidly dividing
    progenitors in the limb buds, face and cortex die or proliferate too
    little, so the structures they build are reduced. Supported by patient
    cytogenetics and by fish and mouse models. It is qualified by the finding
    that patient lymphoblastoid lines show cell death without lengthened cell
    cycles, and by the Esco2 limb mouse, where p53 inhibition reduced
    apoptosis without restoring chondrogenesis.
  evidence:
  - reference: PMID:8291532
    reference_title: "Roberts syndrome: a review of 100 cases and a new rating system for severity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Therefore, RS has been interpreted as a human mitotic mutation syndrome
      which leads to secondary developmental defects.
    explanation: The classical formulation of the mitotic model.
  - reference: PMID:21637801
    reference_title: A zebrafish model of Roberts syndrome reveals that Esco2 depletion interferes with development by disrupting the cell cycle.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We propose that cell proliferation defects and apoptosis could be the
      primary cause of the features of RBS.
    explanation: Zebrafish support for the proliferation-and-apoptosis model.
  - reference: PMID:39168984
    reference_title: Limb reduction in an Esco2 cohesinopathy mouse model is mediated by p53-dependent apoptosis and vascular disruption.
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We had presumed that the extensive cell death in the mesenchyme was the
      underlying cause of the limb deficiency, but pifithrin-α treatment only
      recovered the hemorrhage in mutant limbs and not the chondrogenesis.
    explanation: Limits the apoptosis model as a complete explanation of limb reduction.
- hypothesis_group_id: ribosome_biogenesis_translation_defect
  hypothesis_label: Nucleolar dysfunction and mTORC1-dependent translational deficit
  status: ALTERNATIVE
  description: >-
    Reduced cohesin acetylation impairs nucleolar organization and rRNA
    production; the resulting translational deficit and mTORC1 repression
    reduce cell division and survival. L-leucine stimulation of mTORC1
    partially rescues patient cells and esco2 mutant fish. Not tested in a
    mammalian embryo. Not mutually exclusive with the mitotic model.
  evidence:
  - reference: PMID:24098154
    reference_title: Stimulation of mTORC1 with L-leucine rescues defects associated with Roberts syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Our data support the idea that RBS can be attributed in part to defects
      in ribosome biogenesis, and stimulation of the TOR pathway has
      therapeutic potential.
    explanation: The authors' conclusion from patient cells and zebrafish.
  - reference: PMID:24098154
    reference_title: Stimulation of mTORC1 with L-leucine rescues defects associated with Roberts syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Stimulation of the TOR pathway with L-leucine rescued many developmental
      defects of ESCO2-mutant embryos.
    explanation: In vivo rescue in fish.
- hypothesis_group_id: cohesin_transcriptional_dysregulation
  hypothesis_label: Cohesin-dependent transcriptional dysregulation of developmental genes
  status: EMERGING
  description: >-
    As in Cornelia de Lange syndrome, part of the phenotype may come from
    altered transcription of developmental genes rather than from cell loss;
    candidate targets include cx43 in regenerating bone and ddb1 in the
    thalidomide-sensitive CRL4 pathway. Evidence is from zebrafish knockdowns
    and patient cell lines.
  evidence:
  - reference: PMID:29084713
    reference_title: Cohesin mediates Esco2-dependent transcriptional regulation in a zebrafish regenerating fin model of Roberts Syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      A popular model states that RBS arises due to mitotic failure and loss
      of progenitor stem cells through apoptosis. Previous findings in the
      zebrafish regenerating fin, however, suggest that Esco2-knockdown
      results in transcription dysregulation, independent of apoptosis,
      similar to that observed in CdLS patients.
    explanation: States the transcriptional model as an alternative to the apoptosis model.
  - reference: PMID:26434741
    reference_title: Esco2 regulates cx43 expression during skeletal regeneration in the zebrafish fin.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These results conceptually link ODDD to cohesinopathies and provide
      evidence that ESCO2 may play a transcriptional role critical for human
      development.
    explanation: Transcriptional role of Esco2 in skeletal growth.
- hypothesis_group_id: limb_vascular_disruption
  hypothesis_label: p53-dependent vascular disruption in the developing limb
  status: EMERGING
  description: >-
    In the Esco2 limb mouse, p53-dependent disorganization of the limb bud
    vasculature and hemorrhage accompany the reduction, and genes linked to
    thalidomide embryopathy are dysregulated, suggesting a shared vascular
    component with the teratogenic phocomelia. Single study; human tissue not
    examined.
  evidence:
  - reference: PMID:39168984
    reference_title: Limb reduction in an Esco2 cohesinopathy mouse model is mediated by p53-dependent apoptosis and vascular disruption.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Our data show how loss of ESCO2 causes limb reduction phenotypes,
      through p53 induction, cell death, and vascular disruption.
    explanation: The vascular arm as proposed by the authors.
- hypothesis_group_id: macromolecular_damage
  hypothesis_label: Accumulated DNA and macromolecular damage
  status: EMERGING
  description: >-
    ESCO2-deficient cells are hypersensitive to DNA-damaging agents and show
    impaired double-strand break repair; a review proposes that DNA and other
    macromolecular damage contribute to the developmental phenotype, feeding
    into p53 activation. Evidence is from patient cell lines and yeast
    models.
  evidence:
  - reference: PMID:33382686
    reference_title: "An ever-changing landscape in Roberts syndrome biology: Implications for macromolecular damage."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In this review, we highlight current models of RBS and reflect on data
      that suggests a novel role for macromolecular damage in the molecular
      etiology of RBS.
    explanation: Review proposing the macromolecular-damage model.
  - reference: PMID:30508616
    reference_title: A Roberts Syndrome Individual With Differential Genotoxin Sensitivity and a DNA Damage Response Defect.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In addition to its developmental features, RBS can be, like ataxia
      telangiectasia, considered a DDR-defective syndrome, which contributes
      to its cellular, molecular, and clinical phenotype.
    explanation: DNA damage response defect proposed to contribute to the phenotype.
  - reference: PMID:34897432
    reference_title: Genetically induced redox stress occurs in a yeast model for Roberts syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Here, we report evidence that supports an emerging model rooted in
      defective DNA damage responses.
    explanation: Yeast support for the damage-response model.

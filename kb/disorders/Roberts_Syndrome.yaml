- name: Juberg-Hayward syndrome
  description: >-
    Allelic ESCO2 disorder (homozygous p.Arg552Ter in the reported families)
    with cleft lip and palate, ptosis, short stature, thumb hypoplasia and
    humeroradial synostosis or radial head dislocation, and premature
    centromere separation; microcephaly is inconsistent. Treated as a
    distinct allelic entity by MONDO and by its describers.
  disease_term:
    preferred_term: Juberg-Hayward syndrome
    term:
      id: MONDO:0008992
      label: Juberg-Hayward syndrome
  distinguishing_features:
  - Humeroradial synostosis or radial head dislocation rather than phocomelia.
  - Ptosis; microcephaly inconsistent.
  evidence:
  - reference: PMID:32255174
    reference_title: Juberg-Hayward syndrome is a cohesinopathy, caused by mutation in ESCO2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-

    causal_link_type: DIRECT
    description: The cellular state is recorded as a Cellular phenotype used diagnostically.
- name: Prolonged Mitosis and Chromosome Missegregation
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    Cells lacking ESCO2 spend longer in prometaphase and metaphase and show
    scattered, lagging and prematurely advancing chromosomes, anaphase bridges
    and micronuclei. PROVISIONAL because the mitotic delay is shown in reviews
    of patient cells, in fish embryos and in mouse cells, but a study of
    patient lymphoblastoid lines found reduced proliferation with cell death
    and no increase in cell-cycle duration (PMID:18411254); see
    mechanistic_hypotheses.

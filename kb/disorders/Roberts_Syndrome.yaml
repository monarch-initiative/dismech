pathophysiology:
- name: ESCO2 Biallelic Loss of Function
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Homozygous or compound heterozygous ESCO2 variants that remove all or part
    of the C-terminal acetyltransferase domain (frameshift, nonsense and
    splice-site alleles, often in exon 3), or, rarely, missense changes in
    that domain such as W539G that abolish autoacetylation. Truncating alleles
    lower mRNA through nonsense-mediated decay and no truncated protein is
    detected in patient cells.

discussions:
- discussion_id: rbs_genotype_severity_gap
  prompt: >-
    Why do the same truncating ESCO2 alleles give tetraphocomelia and
    perinatal death in one patient and mild limb shortening with survival to
    adulthood in another, sometimes within one family?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - genetic#ESCO2
  - phenotypes#Tetraphocomelia
  rationale: >-
    Nearly all alleles are loss of function, yet severity spans the whole
    Roberts-to-SC phocomelia range with no genotype correlation. Proposed
    modifiers include tissue and individual variation in nonsense-mediated
    decay and residual cohesion in a subset of cells, but none has been
    tested against clinical severity.
  evidence:
  - reference: PMID:16380922
    reference_title: "Inactivating mutations in ESCO2 cause SC phocomelia and Roberts syndrome: no phenotype-genotype correlation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Since only protein-truncating mutations were identified, regardless of
      clinical severity, we conclude that genotype does not predict phenotype.
    explanation: States the gap.
  - reference: PMID:26044958
    reference_title: Variations in dysfunction of sister chromatid cohesion in esco2 mutant zebrafish reflect the phenotypic diversity of Roberts syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Surprisingly, although many cells required Esco2 to establish cohesion,
      10-20% of cells had only weakened cohesion in the absence of Esco2,
      suggesting that compensatory cohesion mechanisms exist in these cells
      that undergo a normal mitotic division.
    explanation: Compensatory cohesion as a candidate modifier.
- discussion_id: rbs_mouse_lethality_mismatch
  prompt: >-
    Constitutive Esco2 loss is lethal in early mouse embryos, while humans
    with biallelic truncating ESCO2 variants are born and some reach
    adulthood. What supplies the residual function in human embryos, and how
    faithfully do tissue-restricted mouse knockouts model the human
    systemic-but-partial deficiency?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - animal_models#Mouse
  - pathophysiology#Reduced SMC3 Acetylation of Chromatin-Bound Cohesin
  rationale: >-
    The mismatch concerns the Esco2 constitutive knockout mouse; the
    animal_models#Mouse anchor resolves by species and so also matches the two
    conditional knockouts listed in this entry. The mouse data argue that Esco2
    is not redundant with Esco1, whereas
    human survival implies partial redundancy or residual activity. The limb
    and cortex conclusions in this entry rest on conditional knockouts that
    delete Esco2 completely in one lineage, which is a different state from
    the human deficiency.
  evidence:
  - reference: PMID:22101327
    reference_title: Cohesin acetyltransferase Esco2 is a cell viability factor and is required for cohesion in pericentric heterochromatin.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: >-
      Partial redundancy between ESCO1 and ESCO2 may also occur in Roberts
      syndrome (RBS), an ESCO2 deficiency in humans that does not lead to the
      loss of viability
    explanation: The authors frame the species difference.
  proposed_experiments:
  - experiment_id: rbs_patient_allele_knockin_mouse
    name: Patient-allele Esco2 knock-in mouse
    description: >-
      Introduce a recurrent human truncating allele constitutively and test
      whether embryos survive to show limb, craniofacial and cortical
      phenotypes, and whether Esco1 dosage modifies severity.
    supporting_outcome:
    - >-
      Viable homozygous embryos with symmetric limb reduction, clefting and
      microcephaly whose severity varies with Esco1 dosage.
    refuting_outcome:
    - >-
      Early embryonic lethality as in the null, indicating that the human
      allele retains no function in the mouse.
- discussion_id: rbs_limb_reduction_mechanism
  prompt: >-
    Is limb reduction caused mainly by death of limb mesenchyme, by a
    proliferation shortfall, by p53-dependent vascular disruption, or by
    transcriptional dysregulation of limb genes?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#Limb Bud Outgrowth Failure
  - mechanistic_hypotheses#mitotic_failure_progenitor_apoptosis
  - mechanistic_hypotheses#limb_vascular_disruption
  rationale: >-
    In the Esco2 limb mouse, p53 inhibition reduced apoptosis and rescued
    hemorrhage but not chondrogenesis, so apoptosis alone does not explain
    the reduction; the fin-regeneration and translation studies propose
    apoptosis-independent routes. No study has compared these arms in one
    mammalian system.
  evidence:
  - reference: PMID:39168984
    reference_title: Limb reduction in an Esco2 cohesinopathy mouse model is mediated by p53-dependent apoptosis and vascular disruption.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We had presumed that the extensive cell death in the mesenchyme was the
      underlying cause of the limb deficiency, but pifithrin-α treatment only
      recovered the hemorrhage in mutant limbs and not the chondrogenesis.
    explanation: The observation that leaves the question open.
- discussion_id: rbs_cerebrovascular_gap
  prompt: >-
    How often do ischemic stroke, aneurysm and small-vessel disease occur in
    surviving patients, and how does ESCO2 loss damage cerebral vessels?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Cerebral Small-Vessel Vasculopathy
  - phenotypes#Intracranial aneurysm
  rationale: >-
    The cerebrovascular phenotype rests on case reports, yet GeneReviews now
    recommends neurovascular surveillance. The vasculopathy node has no
    upstream mechanism in this entry; the p53-dependent vascular disruption
    seen in the embryonic mouse limb is a possible lead but has not been
    examined in cerebral vessels.
  evidence:
  - reference: PMID:37002187
    reference_title: Complex cerebrovascular diseases in Roberts syndrome caused by novel biallelic ESCO2 variations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This case expands not only the cerebral involvement in Roberts syndrome
      but also the disease spectrum of the neuroimaging triad with
      leukoencephalopathy, calcifications, and cysts.
    explanation: The phenotype is newly described.

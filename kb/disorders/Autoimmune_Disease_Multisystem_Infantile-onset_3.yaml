      that of HCs
    explanation: >-
      Quantifies the partial expression defect of the SH2-subdomain allele, the
      one that was also modelled in the mouse.
  - reference: PMID:21248250
    reference_title: Essential role of E3 ubiquitin ligase activity in Cbl-b-regulated T cell functions.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      selective genetic inactivation of Cbl-b E3 ligase activity phenocopies the
      T cell responses observed when total Cbl-b is ablated, resulting in T cell
      hyperactivation, spontaneous autoimmunity, and impaired induction of T
      cell anergy in vivo
    explanation: >-
      Establishes that it is the ligase activity, not the protein's presence,
      that has to be lost. That is what licenses grading an allele with
      preserved protein expression as loss of function, which is the question
      the third family's p.C464W allele raises.
    directness: INDIRECT
  downstream:
  - target: Loss of CBL-B Restraint on Antigen Receptor Signalling
    causal_link_type: DIRECT
    description: >-
      CBL-B acts by ubiquitinating proteins recruited to engaged immune
      receptors so that they are degraded, so losing the ligase removes that
      brake.
    evidence:
    - reference: PMID:36006710
      reference_title: Immune dysregulation caused by homozygous mutations in CBLB.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: BACKGROUND
      snippet: >-
        CBL-B facilitates ubiquitination of receptor-activated signaling
        proteins, expediting their degradation, and plays an important role in
        peripheral T cell tolerance and curbing autoimmunity
      explanation: >-
        States the molecular job of the protein and therefore what its loss
        removes. Taken from the paper's introductory framing of established
        work rather than from its own experiments, which is why it is marked
        BACKGROUND.
- name: Loss of CBL-B Restraint on Antigen Receptor Signalling
  description: >-
    CBL-B is a negative regulator of antigen receptor signalling, and its
    expression in T cells is itself controlled by signals downstream of the
    T-cell receptor and CD28. Without it, receptor-proximal signalling proteins
    escape ubiquitin-dependent degradation. The affected step is selective
    rather than global: in Cbl-b-null T cells the main T-cell receptor
    pathways, Zap-70 and Lck, the Ras/MAP kinase cascade, phospholipase
    C-gamma-1 and calcium mobilisation, are unaffected, while Vav activation is
    enhanced; and in the knock-in mouse carrying the patient allele, LAT and
    PLC-gamma-1 phosphorylation, calcium flux, and ERK1/2 and AKT
    phosphorylation after anti-CD3 stimulation are all normal despite the
    hyperproliferation. In B cells the picture is the opposite: BCR ligation
    produces increased and prolonged SYK phosphorylation.
  biological_scale: MOLECULAR

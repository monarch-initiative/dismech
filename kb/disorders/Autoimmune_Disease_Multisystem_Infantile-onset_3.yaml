    term:
      id: CL:0000624
      label: CD4-positive, alpha-beta T cell
  cell_source: Primary CD4+ T cells from healthy human donors, CBLB knocked out by gene editing
  publication: PMID:36165179
  modeled_mechanisms:
  - target: Effector T Cell Resistance to Regulatory T Cell Suppression
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      Produces the patient's Treg-resistance phenotype in human cells from the
      gene knockout alone, which is what attributes the property to CBLB loss
      rather than to anything else about the patient.
    limitations: >-
      A complete knockout in healthy-donor cells rather than any patient's
      missense or nonsense genotype, and the cells are not from a person with
      the disease, so nothing about disease expression follows from it.
    evidence:
    - reference: PMID:36165179
      reference_title: CBLB Deficiency in Human CD4(+) T Cells Results in Resistance to T Regulatory Suppression through Multiple Mechanisms.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        We found that CBLB-knockout (CBLB-KO) CD4+ T cells were
        hyperproliferative and produced excessive amounts of IL-2. CBLB-KO CD4+
        T cells were resistant to Treg suppression in vitro, which was partially
        reversed by blockade of IL-2.
      explanation: >-
        Both phenotypes and the interleukin-2 dependence of the resistance, in
        human cells, which is the claim this link makes.
  evidence:
  - reference: PMID:36165179
    reference_title: CBLB Deficiency in Human CD4(+) T Cells Results in Resistance to T Regulatory Suppression through Multiple Mechanisms.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here, we used trackable gene editing approaches to knock out CBLB in
      primary human CD4+ T cells.
    explanation: The system itself, as the authors describe it.
prevalence:
- population: Worldwide, published literature
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Three unrelated children in three families, from Saudi Arabia and Oman, in
    a single 2022 report, and no second report since. There is no population
    estimate and no series to pool, so this record states the size of the
    literature rather than a rate.
  evidence:
  - reference: PMID:36006710
    reference_title: Immune dysregulation caused by homozygous mutations in CBLB.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In summary, we have identified 3 unrelated children with early-onset
      autoimmunity and homozygous mutations in CBLB predicted to affect protein
      function and/or expression.

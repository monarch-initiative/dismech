- name: Breakdown of Peripheral T Cell Tolerance
  description: >-
    Cbl-b is upregulated in T cells by tolerising signals and is required for
    anergy induction, so without it self-reactive T cells that should be
    silenced in the periphery remain able to respond. Mice lacking it fail to
    induce T-cell tolerance in vitro and in vivo, develop spontaneous
    autoimmunity with autoantibodies and lymphocytic infiltration of multiple
    organs, and are strikingly susceptible to experimental autoimmune
    encephalomyelitis. This is the step at which a cell-intrinsic signalling
    abnormality becomes an autoimmune disease, and it is also the weakest step
    in the human chain: the patients' tolerance was never assayed directly, and
    the knock-in mouse that reproduces their cellular phenotype does not develop
    autoimmune disease in clean housing.

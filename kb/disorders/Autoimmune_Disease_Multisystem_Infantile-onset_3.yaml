treatments:
- name: Corticosteroid and Azathioprine Immunosuppression
  description: >-
    What actually controlled disease in two of the three children. The second
    child's presenting fever-and-serositis illness responded to corticosteroids,
    antibiotics, intravenous immunoglobulin and azathioprine; his later febrile
    episode with hemophagocytosis responded to steroids and azathioprine, and a
    further admission was controlled by increasing the azathioprine dose. The
    third child's immune thrombocytopenia responded to steroids with
    intravenous immunoglobulin, both at diagnosis and at relapse. No treatment
    is reported to have modified the underlying defect, and nobody in the
    series was transplanted.

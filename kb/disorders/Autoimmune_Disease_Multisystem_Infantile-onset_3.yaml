        | Autoimmune polyendocrinopathy (thyroid and type I DM), autoimmune
        cytopenias (AIHA, ITP), vitiligo, fevers, and polyserositis. Multiple
        autoantibodies
      explanation: >-
        The IUIS 2024 row for this entity, carrying the recessive inheritance
        annotation, the OMIM number this entry is keyed on, the normal cell
        counts with hyperproliferation, and the autoimmune clinical column.
    - reference: PMID:41608114

name: Autoimmune Disease Multisystem Infantile-onset 3
creation_date: "2026-10-30T12:00:00Z"
category: Mendelian
synonyms:
- ADMIO3
- CBL-B deficiency
- CBLB deficiency
- autoimmune disease, multisystem, infantile-onset, type 3
description: >-
  An early-onset multisystem autoimmune disease caused by biallelic
  loss-of-function variants in CBLB, which encodes the E3 ubiquitin ligase
  CBL-B. CBL-B ubiquitinates signalling proteins recruited by engaged antigen
  and Fc receptors so that they are degraded, and in doing so it sets the
  activation threshold of lymphocytes: a T cell lacking it proliferates and
  makes interleukin-2 in response to receptor cross-linking alone, without the
  CD28 costimulation a normal T cell requires. The patients' effector T cells
  hyperproliferate on anti-CD3 stimulation and, in the one patient in whom it
  was tested, resist suppression by healthy-donor regulatory T cells. Both
  properties are long-standing features of Cbl-b-deficient mice, which develop
  spontaneous autoimmunity, and the Treg-resistance property has since been
  reproduced by knocking CBLB out of primary human CD4+ T cells.

  The reported presentation is autoimmunity rather than infection, and it is
  heterogeneous across organ systems: autoimmune polyendocrinopathy
  (hypothyroidism in the first years of life, then type I diabetes), vitiligo
  and chronic urticaria in one child; recurrent fevers with lung infiltrates,
  serositis, hepatomegaly and marrow hemophagocytosis alongside the same
  endocrinopathy in a second; and autoimmune cytopenias (hemolytic anemia then
  immune thrombocytopenia) from six months of age in a third. Serum IgG
  reactive against broad autoantigen panels, insulin and GAD65 among them, is
  raised. T, B and NK cell numbers are normal, which is the point of contrast
  with the receptor-proximal signalling deficiencies this disease otherwise
  sits beside. Only one of the three children had hypogammaglobulinemia and
  recurrent infection, and the published work does not explain that arm.

  The knock-in mouse built to carry the patient allele reproduces the cellular
  phenotype and not the disease: it has T and B cell hyperproliferation and
  Treg-resistant effector T cells but, under specific-pathogen-free housing, no
  autoimmunity. Autoantibodies and spontaneous disease also differ between the
  two independently generated Cblb-null lines. So a second, non-genetic
  requirement for the autoimmune phenotype is proposed but not identified.

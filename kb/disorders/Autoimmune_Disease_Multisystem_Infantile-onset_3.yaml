inheritance:
- name: Autosomal recessive inheritance
  description: >-
    All three reported children are homozygous for a CBLB variant, and in each
    family both parents are heterozygous and well. Two of the three families
    are first-cousin consanguineous; the third reported no consanguinity. No
    heterozygous carrier has been reported with the disease.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:36006710
    reference_title: Immune dysregulation caused by homozygous mutations in CBLB.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Distinct homozygous mutations in CBLB were identified in 3 unrelated
      children with early-onset autoimmunity, one of whom also had chronic
      urticaria.
    explanation: >-
      Homozygosity in three unrelated probands is the genetic observation this
      inheritance record rests on.
  - reference: PMID:36006710
    reference_title: Immune dysregulation caused by homozygous mutations in CBLB.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      P1 was homozygous for CBLB c.854A>T:p.H285L (NM_001321786.1). Both parents
      were heterozygous.
    explanation: >-
      The carrier state of both parents beside an affected homozygous child,
      which is what makes the pattern recessive rather than dominant.
  - reference: PMID:41608114
    reference_title: "Human inborn errors of immunity: 2024 update on the classification from the International Union of Immunological Societies Expert Committee."
    quote_role: REVIEW_SYNTHESIS
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "CBLB deficiency | CBLB | AR | 620430"
    explanation: >-
      IUIS annotates the inheritance of this entity as autosomal recessive.
references:
- reference: PMID:36006710
  title: Immune dysregulation caused by homozygous mutations in CBLB.
  findings:
  - statement: >-
      The founding and, to date, only report of the disease: three unrelated
      children with distinct homozygous CBLB variants, the protein-expression
      and T-cell proliferation studies on their cells, and the CblbH257L
      knock-in mouse built to carry the allele of the first patient. Every
      patient-level claim in this entry comes from this paper.
    supporting_text: >-
      This study establishes CBL-B deficiency as a cause of immune
      dysregulation.
pathophysiology:
- name: Biallelic CBLB Loss of Function
  description: >-
    Three distinct homozygous CBLB variants were found, one per family, and they
    damage the protein in three different ways. p.R496X truncates it and no
    product is detectable with an N-terminal antibody. p.H285L sits in the SH2
    binding subdomain of the tyrosine kinase binding domain, the part of CBL-B
    that engages its substrates, and is expressed at about half the normal
    level. p.C464W, between the RING domain and the proline-rich region, leaves
    protein expression intact; no functional study of that allele was possible,
    so for it the loss of function is inferred from the clinical and genetic
    evidence rather than measured. None of the three variants is present in
    gnomAD v2.1.1 or in the sequencing laboratory's own 60,234-individual
    databank.
  biological_scale: MOLECULAR
  genetic_context:
    gene:
      preferred_term: CBLB
      term:
        id: hgnc:1542
        label: CBLB
    allele_type: "nonsense and missense: c.1486C>T p.R496X, c.854A>T p.H285L, c.1392C>G p.C464W"
    variant_origin: GERMLINE

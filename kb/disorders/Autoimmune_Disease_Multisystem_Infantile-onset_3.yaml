    reference_title: Cbl-b regulates the CD28 dependence of T-cell activation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The main TCR signalling pathways, such as tyrosine kinases Zap-70 and Lck,
      Ras/mitogen-activated kinases, phospholipase Cgamma-1 and Ca2+
      mobilization, were not affected in Cbl-b(-/-) T cells. In contrast, the
      activation of Vav, a guanine nucleotide exchange factor for
      Rac1/Rho/CDC42, was significantly enhanced.
    explanation: >-
      Identifies which arm of receptor signalling is released when Cbl-b is
      absent, and which arms are not, which is what this node asserts about the
      selectivity of the defect.
  - reference: PMID:36006710
    reference_title: Immune dysregulation caused by homozygous mutations in CBLB.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Despite hyperproliferation in response to anti-CD3 stimulation, CblbH257L
      T cells demonstrated no increase in phosphorylation of LAT and PLC-γ1
    explanation: >-
      The patient-allele knock-in reproduces the same dissociation: the
      proliferative phenotype appears without a measurable change in
      receptor-proximal phosphorylation.
  - reference: PMID:20637659
    reference_title: K33-linked polyubiquitination of T cell receptor-zeta regulates proteolysis-independent T cell signaling.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      TCR-zeta was polyubiquitinated via a K33-linkage, which affected its
      phosphorylation and association with the zeta chain-associated protein
      kinase Zap-70.
    explanation: >-
      Identifies a substrate and a non-degradative mechanism for the restraint
      this node says is lost: ubiquitin chains on the receptor chain itself
      limit its phosphorylation and its engagement of ZAP-70. The result comes
      from mice lacking both Cbl-b and Itch, in which the phosphorylation
      increase was not seen in the Cbl-b single knockout, so it describes the
      pathway rather than the effect of losing CBL-B alone.
    directness: INDIRECT
  downstream:

differential_diagnoses:
- name: ITCH deficiency (syndromic multisystem autoimmune disease)
  description: >-
    The closest mechanistic neighbour: another recessive E3-ubiquitin-ligase
    defect of immune dysregulation, in which the same anergy and
    tolerance-induction machinery fails. ITCH deficiency is syndromic, with
    dysmorphism and early-onset chronic lung disease alongside the
    autoimmunity, so the discriminator is the syndromic features rather than
    the immunology.
  disease_term:
    preferred_term: syndromic multisystem autoimmune disease due to ITCH deficiency
    term:
      id: MONDO:0013245
      label: syndromic multisystem autoimmune disease due to ITCH deficiency
  evidence:
  - reference: PMID:41608114
    reference_title: "Human inborn errors of immunity: 2024 update on the classification from the International Union of Immunological Societies Expert Committee."
    quote_role: REVIEW_SYNTHESIS
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Itch deficiency may cause immune dysregulation by affecting both anergy
      induction in autoreactive effector T cells and generation of Tregs
    explanation: >-
      IUIS states the shared mechanism, anergy induction in autoreactive
      effector T cells, which is why this entity is the nearest differential.
- name: CTLA4 haploinsufficiency
  description: >-
    The other immune-dysregulation entity that presents with autoimmune
    cytopenias, enteropathy and hypogammaglobulinemia in childhood, and the one
    a trial of abatacept would normally be aimed at. It is dominant rather than
    recessive, the lesion is in the regulatory T cell rather than in the
    effector cell, and lymphoproliferation with lymphocytic organ infiltration
    is characteristic. The abatacept trial in the first CBLB patient failed,
    which is consistent with the difference in where the two lesions sit.
  disease_term:
    preferred_term: CTLA4 haploinsufficiency
    term:
      id: MONDO:0014493
      label: autoimmune lymphoproliferative syndrome due to CTLA4 haploinsufficiency
  evidence:
  - reference: PMID:41608114
    reference_title: "Human inborn errors of immunity: 2024 update on the classification from the International Union of Immunological Societies Expert Committee."
    quote_role: REVIEW_SYNTHESIS
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      CTLA4 haploinsufficiency (ALPS-V) | CTLA4 | AD | 123890 | Decreased |
      Decreased | Impaired function of Tregs | Autoimmune cytopenias,
      enteropathy, interstitial lung disease, extralymphoid lymphocytic
      infiltration, recurrent infections
    explanation: >-
      The IUIS row for the differential, carrying the dominant inheritance, the
      decreased lymphocyte counts and the Treg-intrinsic lesion that distinguish
      it from this disease.
- name: Autoimmune disease, multisystem, infantile-onset, 2
  description: >-
    The serially numbered sibling concept, and a different gene: ZAP70, with one
    hypomorphic and one activating allele in trans rather than biallelic loss of
    function. The numbering is a nosological accident and says nothing about
    shared mechanism, but the two sit at opposite ends of the same signalling
    axis — too little receptor-proximal kinase restraint here, too much kinase
    activity there — and both present as infantile autoimmunity without
    infectious susceptibility. The presentations differ: that disease is
    antibody-defined, with bullous pemphigoid and an acquired factor VIII
    inhibitor, reduced CD8 T cells, and it required transplantation, where this
    one is endocrine and cytopenic with normal lymphocyte counts. The genotype
    separates them.
  disease_term:
    preferred_term: autoimmune disease, multisystem, infantile-onset, 2
    term:
      id: MONDO:0014861
      label: autoimmune disease, multisystem, infantile-onset, 2
  evidence:
  - reference: PMID:41608114
    reference_title: "Human inborn errors of immunity: 2024 update on the classification from the International Union of Immunological Societies Expert Committee."
    quote_role: REVIEW_SYNTHESIS
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      ZAP-70 combined hypomorphic and activating mutations | ZAP70 | AR
      (LOF/GOF) | 617006 | Decreased CD8, normal or decreased CD4 cells
    explanation: >-
      The IUIS row for the differential, carrying the gene, the two-allele
      inheritance annotation and the CD8 deficit that this disease does not
      have.
- name: Familial hemophagocytic lymphohistiocytosis
  description: >-
    The differential actually worked through in the second patient, whose
    fevers, organomegaly, serositis and marrow hemophagocytosis are the
    syndrome's presentation. A targeted HLH gene panel was negative and no
    infectious trigger was found, and he responded to corticosteroids and
    azathioprine rather than needing HLH-directed therapy. Any CBLB patient
    presenting this way will be investigated for HLH first.
  evidence:
  - reference: PMID:36006710
    reference_title: Immune dysregulation caused by homozygous mutations in CBLB.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Targeted panel gene sequencing for hemophagocytic lymphohistiocytosis
      (HLH) mutations was negative. An infectious trigger for HLH could not be
      identified.
    explanation: >-
      The differential and how it was excluded in the patient who presented
      with it.
discussions:
- discussion_id: cblb_second_requirement_for_autoimmunity
  prompt: >-
    What does a CBL-B-deficient mouse need, beyond the genotype, before it
    develops the autoimmune disease its human counterparts have?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Breakdown of Peripheral T Cell Tolerance
  - pathophysiology#Multi-organ Autoantibody Production and Autoimmune Tissue Injury
  rationale: >-
    The knock-in mouse built on the patient allele has the full cellular
    phenotype and no disease: healthy at one year, no organ infiltrate, no
    autoantibody excess. The complete null does develop multi-organ
    autoimmunity, but only in one of the two independently generated lines. So
    the step this entry draws from unrestrained effector T cells to autoimmune
    disease is demonstrated in one animal, absent in another with the patient's
    own allele, and inconsistent between two nulls. The authors propose
    environment, microbiome and modifier genes, and name the experiment,
    cohousing with pet-store mice to supply common murine pathogens, without
    having done it. Until that is settled, the human disease's dependence on a
    non-genetic second requirement is a hypothesis.
  evidence:
  - reference: PMID:36006710
    reference_title: Immune dysregulation caused by homozygous mutations in CBLB.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Additional experiments, including cohousing with pet-store mice, will be
      utilized to explore the development of autoimmunity in CblbH257L mice.
    explanation: >-
      The authors state the gap and the experiment they intend for it, which is
      what this discussion records.
  proposed_experiments:
  - experiment_id: cblb_knockin_pathogen_exposure
    experiment_design: TARGETED_PERTURBATION
    name: Expose Cblb H257L knock-in mice to common murine pathogens and follow for autoimmunity
    description: >-
      Cohouse knock-in mice with pet-store mice, alongside specific-pathogen-free
      knock-in and wild-type controls, and follow autoantibody titres, organ
      histology and endocrine function. The prediction under this entry's
      mechanism is that microbial exposure converts the cellular phenotype into
      autoimmune disease in the knock-in and not in the wild type.
    perturbations:
    - name: Microbial exposure by cohousing with pet-store mice
      target: pathophysiology#Breakdown of Peripheral T Cell Tolerance
    readouts:
    - name: Autoantibody titre and multi-organ histology after exposure
      target: pathophysiology#Multi-organ Autoantibody Production and Autoimmune Tissue Injury
      direction: INCREASED
      interpretation: >-
        Autoantibody and organ infiltration appearing in exposed knock-in mice
        but not in exposed wild-type mice would support the environmental
        second requirement.
    would_support:
    - pathophysiology#Breakdown of Peripheral T Cell Tolerance
    supporting_outcome:
    - >-
      Exposed knock-in mice develop autoantibodies and organ infiltration that
      specific-pathogen-free knock-ins and exposed wild-type mice do not.
    refuting_outcome:
    - >-
      Exposed knock-in mice remain disease-free, which would mean the allele's
      cellular phenotype does not reach autoimmunity in the mouse at all and
      that the human chain needs a different account.
    decision_criterion: >-
      Autoimmune disease in exposed knock-in mice, absent in both control arms.
- discussion_id: cblb_c464w_mechanism_unmeasured
  prompt: >-
    How does p.C464W cause disease, given that CBL-B protein expression in that
    patient's cells is intact?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Biallelic CBLB Loss of Function
  rationale: >-
    Two of the three alleles have a measured consequence: no protein for
    p.R496X, half-normal protein for p.H285L. The third, p.C464W, leaves
    protein expression intact, no further patient sample was available for
    functional work, and the region of the protein containing the residue is
    absent from the Protein Data Bank so it could not be modelled either. Its
    position between the RING domain and the proline-rich region is suggestive
    of an effect on ligase activity rather than on abundance, but nothing was
    assayed, and this entry's gene-level mechanism is described as loss of
    function partly on the strength of the other two alleles. A ligase activity
    or substrate-ubiquitination assay on the C464W protein would say whether the
    third family's disease has the same molecular basis as the first two.
  evidence:
  - reference: PMID:36006710
    reference_title: Immune dysregulation caused by homozygous mutations in CBLB.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Immunoblotting of the patient's EBV-B cells demonstrated intact CBL-B
      protein expression (Figure 1J). Additional patient samples were not
      available for functional studies.
    explanation: >-
      States both halves of the gap: the protein is present, and the functional
      question was not answered.
  proposed_experiments:
  - experiment_id: cblb_c464w_ligase_activity
    name: Measure ubiquitin ligase activity of the C464W CBL-B protein
    description: >-
      Express wild-type, C464W and H285L CBL-B in a CBLB-null cell background
      and compare autoubiquitination and substrate ubiquitination, alongside
      antigen-receptor-induced proliferation and interleukin-2 production. The
      prediction is that C464W is catalytically defective despite normal
      abundance.
    perturbations:
    - name: C464W CBL-B expressed in a CBLB-null background
      target: pathophysiology#Biallelic CBLB Loss of Function
      gene:
        preferred_term: CBLB
        term:
          id: hgnc:1542
          label: CBLB
    readouts:
    - name: Substrate ubiquitination by the reconstituted ligase
      target: pathophysiology#Biallelic CBLB Loss of Function
      direction: DECREASED
      interpretation: >-
        Reduced ubiquitination with preserved protein would place this allele's
        defect in catalysis and confirm the loss-of-function mechanism for the
        third family.
    would_support:
    - pathophysiology#Biallelic CBLB Loss of Function
    supporting_outcome:
    - >-
      Reduced substrate ubiquitination by the C464W protein relative to wild
      type, at comparable protein abundance.
    decision_criterion: >-
      Reduced substrate ubiquitination by C464W relative to wild type, with
      comparable protein abundance.
notes: >-
  No GeneReviews chapter covers this disease or CBLB. The authoritative source
  is a single 2022 J Clin Invest report of three children (PMID:36006710), and
  the entity's only other authoritative description is its row in the IUIS 2024
  inborn-errors-of-immunity classification (PMID:41608114), which admitted CBLB
  deficiency as a new recessive loss-of-function cause of immune dysregulation.
  The OMIM number IUIS records, 620430, is the one this entry's MONDO term is
  keyed to; note that the CBLB gene has its own, different OMIM entry, 604491.

  The pathograph's human evidence is thinner than its length suggests. Patient
  measurements exist for exactly three things: T-cell hyperproliferation on
  anti-CD3 (two patients), resistance to healthy-donor regulatory T cells (one
  patient), and the autoantibody and cytokine panels (two patients each). Every
  other mechanistic step comes from the mouse or from gene-edited human cells.
  The B-cell and mast-cell arms have no patient signalling data at all.

  Two findings in the only patient series do not follow from the mechanism
  curated here and are recorded without being explained: the
  hypogammaglobulinemia with recurrent infection in the first child, which the
  authors themselves suggest may have a second genetic cause, and the
  non-protective vaccine responses in two of the three children. A mechanism of
  excessive lymphocyte activation does not predict either.

  Two mechanisms described for CBL-B are deliberately not modelled here. CBL-B
  ubiquitinates the TAM receptors Tyro3, Axl and Mer in NK cells, and NK
  activation rises when it is lost; that is mouse work, NK numbers were normal
  in the patient in whom they were measured, and no NK readout in these
  children is reported, so there is no node for it. Likewise, abatacept and
  mTOR inhibition are discussed in the literature as mechanistic
  extrapolations for this disease; the abatacept arm is curated because it was
  actually tried in a patient and failed, and no mTOR inhibitor was given to
  anyone in the series, so none is listed.

  A homozygous 2.5 Mb 3q13.11-q13.12 deletion spanning ALCAM and CBLB has been
  reported in one child with ocular, craniofacial and skeletal anomalies plus
  humoral immunodeficiency (PMID:42847748). That is a contiguous-gene deletion
  whose phenotype the authors attribute to the two genes together, so it is
  noted as context rather than curated as this disease.

  CBLB is also a drug target in the opposite direction: CBL-B inhibitors are in
  development to lift the brake on T cells for cancer immunotherapy. That
  literature is a large part of the PubMed results for the gene and is not
  curated here, since it bears on the pharmacology of inhibiting CBL-B rather
  than on this disease. It is worth knowing when searching, because a query for
  CBLB returns far more oncology than immunology.

  No mechanism module was declared. The candidates in kb/modules/ were checked.
  molecular_mimicry_autoimmunity requires a cross-reactive foreign antigen,
  which nothing in this disease supplies; cdc1_tolerogenic_maturation is about
  dendritic-cell-driven tolerance, where this lesion is T-cell-intrinsic; and
  immune_checkpoint_blockade is the tumour-immune cycle. A module for
  effector-T-cell-intrinsic loss of activation-threshold control, which this
  disease and ITCH deficiency would both conform to, does not exist yet and
  would be the right home for the shared chain.

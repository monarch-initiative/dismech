        cell anergy in vivo
      explanation: >-
        The ligase-dead knock-in reproduces the null phenotype, which is the
        basis for treating lost ligase activity as the operative lesion.
- name: Komeda diabetes-prone (KDP) rat
  species: Rat
  genotype: Cblb nonsense mutation (Iddm/kdp1), homozygous, naturally occurring
  publication: PMID:15897618
  description: >-
    A naturally occurring Cblb-mutant animal disease rather than an engineered
    model. Positional cloning of the KDP rat's major non-MHC type 1 diabetes
    locus, Iddm/kdp1, identified a nonsense mutation in Cblb, and the strain's
    diabetes is accounted for by that gene together with the MHC haplotype. It
    is the closest animal counterpart of this disease's organ pattern: moved
    onto an MHC class II 'a' background, Cblb-homozygous congenic rats develop
    autoimmune thyroiditis without diabetes, and on the original 'u' background
    they develop diabetes. So the same lesion gives thyroid or islet
    autoimmunity depending on the MHC haplotype, while the patients have both.
    Those congenics also show alopecia, which the patients do not, and the
    thyroiditis occurred without clinical hypothyroidism, which the patients
    have.
  genes:
  - preferred_term: CBLB
    term:
      id: hgnc:1542
      label: CBLB
  evidence:
  - reference: PMID:15897618
    reference_title: Identification of a major gene responsible for type 1 diabetes in the Komeda diabetes-prone rat.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      we identified a nonsense mutation in the Casitas B-lineage lymphoma b
      (Cblb) gene by positional cloning of Iddm/kdp1
    explanation: >-
      Assigns the strain's autoimmune diabetes locus to a Cblb nonsense
      mutation, which is what makes this rat a model of the same gene defect.
  modeled_mechanisms:
  - target: Multi-organ Autoantibody Production and Autoimmune Tissue Injury
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      The only model whose target organs match the patients': thyroid and
      pancreatic islet. It also shows what sets the organ, which the human
      series cannot: the MHC class II haplotype, with the Cblb lesion held
      constant.
    limitations: >-
      A rat, and a strain in which a second locus, the MHC haplotype, is part
      of the disease rather than background. The patients have thyroid and
      islet autoimmunity together, where each congenic line has one or the
      other, and the congenic rats add alopecia that the patients do not have.
      No HLA association has been reported for this disease, so the two-gene
      reading is the rat's and not yet the patients'.
    evidence:
    - reference: PMID:21918539
      reference_title: Role of major histocompatibility complex class II in the development of autoimmune type 1 diabetes and thyroiditis in rats.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The congenic rats with homozygous Cblb mutation showed autoimmune
        thyroiditis without T1D and slight to severe alopecia
      explanation: >-
        The Cblb lesion on a permissive MHC background produces thyroid
        autoimmunity, which is one of this disease's two endocrine
        manifestations.
    - reference: PMID:21918539
      reference_title: Role of major histocompatibility complex class II in the development of autoimmune type 1 diabetes and thyroiditis in rats.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        These data indicate that MHC class II is involved in the tissue-specific
        development of autoimmune diseases, including T1D and thyroiditis.
      explanation: >-
        The authors' conclusion, and the reason this model is cited for which
        organ is hit rather than for whether autoimmunity occurs.
      directness: INDIRECT
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        Rat, and the organ outcome is set by the rat MHC class II haplotype.
        The claim that this lesion produces endocrine autoimmunity carries
        over; which endocrine organ, and the role of a second locus, does not.
    - divergence_type: POPULATION_MISMATCH
      materiality: QUALIFYING
      description: >-
        An inbred strain in which the Cblb mutation is fixed alongside a
        defined MHC haplotype, where the three patients are unrelated children
        of two populations with three different alleles and no reported HLA
        association.
experimental_models:
- name: CBLB-knockout primary human CD4+ T cells
  description: >-
    CBLB knocked out of primary human CD4+ T cells from healthy donors by
    trackable gene editing. It is the only human system in which the disease's
    central cellular property has been produced without a patient: the edited
    cells are hyperproliferative, overproduce interleukin-2, and resist
    regulatory T cell suppression, which is partially reversed by blocking
    interleukin-2. RNA-sequencing and puromycin incorporation locate the
    resistance at the transcriptional and translational levels.
  experimental_model_type: PRIMARY_CELL_CULTURE
  organism:
    preferred_term: Homo sapiens
    term:
      id: NCBITaxon:9606
      label: Homo sapiens

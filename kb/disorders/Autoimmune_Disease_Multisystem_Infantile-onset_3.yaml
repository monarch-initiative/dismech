      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Mutation of Cbl-b uncouples T-cell proliferation, interleukin-2
        production and phosphorylation of the GDP/GTP exchange factor Vav1 from
        the requirement for CD28 co-stimulation.
      explanation: >-
        The defining consequence of losing the ligase, stated as a result in the
        paper that first targeted the gene.
  - target: B Cell Receptor Hyperresponsiveness
    causal_link_type: DIRECT

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      He was diagnosed with idiopathic thrombocytopenia purpura (ITP) when 1
      year old that was successfully treated with steroids and IVIg.
    explanation: >-
      The cytopenia response in the third child, which is the other arm this
      treatment entry covers.
- name: Intravenous Immunoglobulin
  description: >-
    Started at thirteen years in the first patient for her hypogammaglobulinemia
    and recurrent infection, and her infections and her chronic urticaria both
    improved on it. Also given to the second child in his presenting illness and
    to the third with steroids for his thrombocytopenia. The urticarial
    improvement is the interesting part, since replacement would not be expected
    to treat it, but the source reports the two together without separating the
    mechanisms.

- name: Cbl-b E3 ligase-dead knock-in mouse
  species: Mouse
  genotype: Cblb E3 ligase-defective (RING finger) knock-in, homozygous
  publication: PMID:21248250
  description: >-
    A clean genetic separation of the two ways the human variants are loss of
    function: it preserves the protein but abolishes only its E3 ligase
    activity, and still phenocopies the null. It is the animal result that
    licenses grading a CBLB allele with preserved protein expression, such as
    the third family's p.C464W, as loss of function rather than requiring
    absent protein.
  genes:
  - preferred_term: CBLB
    term:
      id: hgnc:1542
      label: CBLB
  modeled_mechanisms:
  - target: Biallelic CBLB Loss of Function
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Shows that abolishing the ligase activity alone, with protein still
      present, reproduces the T-cell hyperactivation, spontaneous autoimmunity
      and failed anergy of the null. This grounds the entry's reading of the
      human variants as loss of ligase function.

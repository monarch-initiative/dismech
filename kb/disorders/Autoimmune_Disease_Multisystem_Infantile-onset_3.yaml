genetic:
- name: CBLB
  notes: >-
    CBLB at 3q13.11 encodes CBL-B, a RING-type E3 ubiquitin ligase of the Cbl
    family expressed in immune cells, which ubiquitinates proteins recruited to
    activated antigen and Fc receptors so that they are degraded. The three
    reported disease alleles hit three different parts of the protein: the SH2
    binding subdomain of the substrate-binding tyrosine kinase binding domain, a
    truncation before the C-terminus, and the segment between the RING domain
    and the proline-rich region. Only the first two were characterised
    functionally.

    The gene also carries common susceptibility alleles for polygenic
    autoimmune disease, which is context rather than content for this entry: a
    Sardinian multiple sclerosis GWAS hit, rs9657904 (PMID:20453840), replicated
    in Italy (PMID:21037273); rs12487066, associated with lower CBL-B
    expression (PMID:25261476); and a type 1 diabetes association in Danish
    families (PMID:15629882). Those are associations with other diseases, not
    with this one, so they are recorded here and not as a susceptibility row.

    No gene_disease_validity assertion is recorded. ClinGen has not published a
    gene-disease validity classification for CBLB with this or any disease, so
    there is no external tier to copy; IUIS's inclusion of the gene as a new
    recessive loss-of-function entity in its 2024 update is a classification of
    the disease, not a validity tier for the pair.
  gene_term:
    preferred_term: CBLB
    term:
      id: hgnc:1542
      label: CBLB
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  inheritance:
  - name: Autosomal recessive inheritance
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
    evidence:
    - reference: PMID:41608114
      reference_title: "Human inborn errors of immunity: 2024 update on the classification from the International Union of Immunological Societies Expert Committee."
      quote_role: REVIEW_SYNTHESIS
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "CBLB deficiency | CBLB | AR | 620430"
      explanation: >-
        The gene-level inheritance annotation for this entity in the IUIS
        classification.
  variants:
  - name: CBLB c.854A>T p.H285L
    description: >-
      Homozygous in the first patient, with both parents heterozygous. The
      residue sits in the SH2 binding subdomain of the tyrosine kinase binding
      domain, the part of CBL-B that engages substrates; structural modelling
      suggested the substitution distorts a water-binding pocket. The mutant is
      expressed at about half the normal level in the patient's
      EBV-transformed B cells. This is the only allele modelled in a mouse, as
      the corresponding Cblb p.H257L knock-in.
    clinical_significance: PATHOGENIC
    functional_effects:
    - function: substrate engagement by the tyrosine kinase binding domain
      description: >-
        Partial loss of protein abundance, with the substitution falling in the
        substrate-binding subdomain. Ligase activity itself was not assayed.
      type: hypomorphic
    evidence:
    - reference: PMID:36006710
      reference_title: Immune dysregulation caused by homozygous mutations in CBLB.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The CBL-B H285 residue is within the SH2 binding subdomain (Figure 1B).
        This mutation is predicted to be deleterious (Supplemental Table 2).
      explanation: Locates the substitution within the substrate-binding domain.
    - reference: PMID:36006710
      reference_title: Immune dysregulation caused by homozygous mutations in CBLB.
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: >-
        Structural modeling indicated that H285L may distort a water binding
        pocket in CBL-B (Figure 1C).
      explanation: >-
        The structural prediction for this allele, stated conditionally in the
        source and graded as the modelling result it is.
  - name: CBLB c.1486C>T p.R496X
    description: >-
      Homozygous in the second patient, with both parents heterozygous. A
      57 kDa truncated product was expected, and an antibody against the CBL-B
      N-terminus detected none in the patient's EBV-transformed B cells. This
      is the allele that establishes the mechanism as loss of function: no
      protein, and the same T-cell hyperproliferation as the other patients.
    clinical_significance: PATHOGENIC
    functional_effects:
    - function: CBL-B protein expression
      description: >-
        No protein detectable with an N-terminal antibody, so the expected
        truncated product is absent rather than merely non-functional.
      type: loss of function
    evidence:
    - reference: PMID:36006710
      reference_title: Immune dysregulation caused by homozygous mutations in CBLB.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Translation of the p.R496X CBL-B mutant was expected to be a 57 kDa
        truncated product. An antibody directed against the N-terminus of CBL-B
        failed to detect a truncated product in the EBV-B cells from P2
      explanation: >-
        The immunoblot result, and the expectation it tested, which together
        make this a protein-null allele.
    - reference: PMID:36006710
      reference_title: Immune dysregulation caused by homozygous mutations in CBLB.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        One of the mutations, p.R496X, abolished CBL-B expression, and a second
        mutation, p.C464W, resulted in preserved CBL-B expression.
      explanation: >-
        The contrast the authors draw between the two alleles, which is why the
        nonsense one carries the mechanistic weight.
  - name: CBLB c.1392C>G p.C464W
    description: >-
      Homozygous in the third patient, with both parents heterozygous. The
      residue lies between the RING domain and the proline-rich region. Protein
      expression is intact and no further patient sample was available, so no
      functional consequence was measured; the region containing this residue
      is not in the Protein Data Bank, so it could not be modelled either. Its
      pathogenicity rests on homozygosity in an affected child, absence from
      population and in-house databases, and the T-cell phenotype shared with
      the other two patients.
    clinical_significance: LIKELY_PATHOGENIC
    evidence:
    - reference: PMID:36006710
      reference_title: Immune dysregulation caused by homozygous mutations in CBLB.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Immunoblotting of the patient's EBV-B cells demonstrated intact CBL-B
        protein expression (Figure 1J). Additional patient samples were not
        available for functional studies.
      explanation: >-
        Records both that protein is present and that the functional question
        was not answered, which is why this allele is graded one tier lower
        here.
    - reference: PMID:36006710
      reference_title: Immune dysregulation caused by homozygous mutations in CBLB.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The C464 residue is situated between the RING and PRR (Figure 1B). The
        region containing human CBL-B C464 is not available in the RCSB Protein
        Data Bank for modeling.
      explanation: >-
        The position of the residue and the reason no structural prediction was
        made for it.
  evidence:
  - reference: PMID:36006710
    reference_title: Immune dysregulation caused by homozygous mutations in CBLB.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The variants were not present in gnomAD (v.2.1.1) nor our bio/databank of
      60,234 individuals.
    explanation: >-
      All three alleles are absent from a population database and from the
      sequencing laboratory's own cohort, which is part of the case for
      causality.
  - reference: PMID:36006710
    reference_title: Immune dysregulation caused by homozygous mutations in CBLB.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Early-onset autoimmunity and T cell hyperproliferation in response to CD3
      ligation in 3 unrelated patients with distinct homozygous variants in
      CBL-B, one of which abolished protein expression, support a role for CBL-B
      deficiency in causing human immune dysregulation.
    explanation: >-
      The authors' statement of the gene-disease argument: three unrelated
      families, distinct alleles, one protein-null, and a shared cellular
      phenotype.
diagnosis:
- name: Exome sequencing
  description: >-
    How the disease was found in all three children, and the only route to the
    diagnosis at present. In each case exome analysis had already excluded
    variants in known disease-causing genes, which matters because two of the
    three presentations, polyendocrinopathy with cytopenias and a
    fever-and-serositis illness with hemophagocytosis, would ordinarily be
    worked up against other inborn errors of immunity first.
  diagnosis_term:
    preferred_term: exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:36006710
    reference_title: Immune dysregulation caused by homozygous mutations in CBLB.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Exome sequencing did not identify any relevant variants in known
      disease-causing genes in the patients. Three different homozygous variants
      in CBLB were identified.
    explanation: >-
      Both halves of what the test did here: excluded the known causes and
      found the new one.
- name: Lymphocyte subset flow cytometry
  description: >-
    Normal in this disease, and that is the diagnostic point. Peripheral T, B
    and NK cell numbers were normal in the first patient and T and B cell
    numbers in the other two, so the panel that would identify a combined
    immunodeficiency reads normal here. The one subset abnormality found was a
    reduced regulatory T cell percentage, in one patient.
  diagnosis_term:
    preferred_term: immunological flow cytometry
    term:
      id: NCIT:C113003
      label: Immunological Flow Cytometry
  evidence:
  - reference: PMID:36006710
    reference_title: Immune dysregulation caused by homozygous mutations in CBLB.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Peripheral blood T, B, and NK cell numbers were normal (Supplemental Table
      1; supplemental material available online with this article;
      https://doi.org/10.1172/JCI154487DS1).
    explanation: The normal subset counts in the first patient.
  - reference: PMID:41608114
    reference_title: "Human inborn errors of immunity: 2024 update on the classification from the International Union of Immunological Societies Expert Committee."
    quote_role: REVIEW_SYNTHESIS
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "CBLB deficiency | CBLB | AR | 620430 | Normal counts, hyperproliferative"
    explanation: >-
      IUIS records normal counts as the expected cytometry result for this
      entity, which is what makes the test informative by being normal.
- name: T cell proliferation assay with anti-CD3 and anti-CD28
  description: >-
    The functional test that distinguishes this disease from the
    immunodeficiencies it would otherwise be mistaken for: the patients' CD4+ T
    cells proliferate more than control cells on anti-CD3 cross-linking, where
    a receptor-proximal signalling deficiency gives less. In the one patient
    tested further, effector T cells also resisted suppression by healthy-donor
    regulatory T cells. Neither assay is routine, and both were done in a
    research laboratory.
  diagnosis_term:
    preferred_term: lymphocyte proliferation assay
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  notes: >-
    The binding is deliberately the broad laboratory-procedure term. NCIT's own
    assay terms for this test are not reachable from NCIT:C25218 (Clinical
    Intervention or Procedure), the root of the TreatmentActionTerm enum that
    diagnosis_term binds to, so NCIT:C116553 Cell Proliferation Assay and
    NCIT:C17636 Antigen Proliferation Assay both fail term validation in this
    slot. The specificity is carried by preferred_term and this entry's name.
  evidence:
  - reference: PMID:36006710
    reference_title: Immune dysregulation caused by homozygous mutations in CBLB.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      CD4+ T cells from P1 had enhanced proliferation in response to anti-CD3
      compared with controls (Figure 1E). Further increase in the proliferation
      was observed upon addition of anti-CD28 (Figure 1E).
    explanation: >-
      The assay and its result in the first patient, including the point that
      human cells still responded to added costimulation.
- name: CBL-B protein immunoblot
  description: >-
    Immunoblotting of patient EBV-transformed B cells with N-terminal and
    C-terminal CBL-B antibodies, which separated the three alleles into absent,
    half-normal and intact protein. It is the test that established the
    truncating allele as protein-null, and it is also what showed that normal
    protein abundance does not exclude the diagnosis.
  diagnosis_term:
    preferred_term: immunoblot for CBL-B protein

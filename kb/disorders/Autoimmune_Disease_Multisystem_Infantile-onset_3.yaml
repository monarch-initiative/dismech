- name: Abatacept
  description: >-
    Tried in the first patient and ineffective. Abatacept is CTLA4-Ig and acts
    by blocking CD80/CD86-dependent costimulation, so its failure here is
    mechanistically coherent rather than merely disappointing: a T cell without
    CBL-B proliferates on receptor cross-linking alone, with the costimulation
    requirement already relaxed, so removing costimulation should not help. The
    source reports the trial and its outcome without offering that reading, and
    the inference is recorded in this description rather than as evidence.

animal_models:
- name: Cblb H257L knock-in mouse
  species: Mouse
  genotype: Cblb c.770A>T p.H257L homozygous knock-in
  publication: PMID:36006710
  description: >-
    CRISPR/Cas9 knock-in of the mouse residue corresponding to the first
    patient's p.H285L, generated to test whether that allele predisposes to
    immune dysregulation. It reproduces the expression defect, at about half
    wild-type protein, and the cellular phenotype: effector T cell
    hyperproliferation with increased interleukin-2 and no further gain from
    anti-CD28, resistance of those effector cells to wild-type regulatory T
    cells, increased and prolonged B-cell SYK phosphorylation with
    hyperproliferation after IgM cross-linking, hyperactivated
    bone-marrow-derived mast cells, and exaggerated IgE-mediated passive
    anaphylaxis. What it does not reproduce is the disease. At one year the mice
    were healthy, without lymphadenopathy or organomegaly, with no cellular
    infiltrate in salivary gland, liver or kidney and HEp-2-reactive
    autoantibody titres no different from wild type. Two findings also run
    against the patient: splenic regulatory T cells are increased where the
    patient's were decreased, and the B-cell signalling gain produced no
    increase in germinal-centre B cells or antibody.
  genes:
  - preferred_term: CBLB
    term:
      id: hgnc:1542
      label: CBLB
  evidence:
  - reference: PMID:36006710
    reference_title: Immune dysregulation caused by homozygous mutations in CBLB.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Mice homozygous for the CBL-B p.H257L mutation, which corresponds to the
      patient's p.H285L mutation, had T and B cell hyperproliferation in
      response to antigen receptor cross-linking.
    explanation: >-
      The model's identity and its core result, stated as the correspondence to
      the patient allele that motivated building it.
  - reference: PMID:36006710
    reference_title: Immune dysregulation caused by homozygous mutations in CBLB.
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: >-
      CblbH257L mice were healthy with normal weight gain. At 1 year old, they
      did not display lymphadenopathy or organomegaly, and histologic studies
      did not reveal cellular infiltrates in their salivary glands, livers, or
      kidneys.
    explanation: >-
      The model does not develop the autoimmune disease it was built to model.
      Recorded against the model as a whole so that its cellular results are
      not read as a demonstration of the disease.
  modeled_mechanisms:
  - target: T Cell Hyperproliferation Uncoupled from CD28 Costimulation
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      Reproduces the patients' T-cell phenotype on the matched allele, and adds
      the interleukin-2 and costimulation-independence measurements that patient
      material could not supply.
    limitations: >-
      The mouse uncoupling is more complete than the patients': anti-CD28 added
      nothing to its effector cells' proliferation, whereas patient cells still
      responded further to it.
    evidence:
    - reference: PMID:36006710
      reference_title: Immune dysregulation caused by homozygous mutations in CBLB.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        CD4+CD25– Teffs from CblbH257L mice demonstrated hyperproliferation and
        increased IL-2 secretion after anti-CD3 stimulation (Figure 2D). Unlike
        WT T cells, they did not demonstrate increased proliferation upon
        addition of anti-CD28
      explanation: >-
        The measurement behind this link, and the one that goes beyond what was
        shown in the patients.
  - target: Effector T Cell Resistance to Regulatory T Cell Suppression
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      Reproduces the patient finding and dissects it: the model's own regulatory
      T cells suppress wild-type effector cells normally, while its effector
      cells resist wild-type regulatory T cells, which localises the lesion to
      the effector cell.
    limitations: >-
      The regulatory T cell compartment behaves oppositely in the two: increased
      in the mouse spleen, decreased in the patient's blood. The suppression
      result is unaffected by that, but it means the model does not predict the
      patient's Treg percentage.
    evidence:
    - reference: PMID:36006710
      reference_title: Immune dysregulation caused by homozygous mutations in CBLB.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        CblbH257L Teffs showed significant resistance to suppression by WT Tregs
      explanation: >-
        The result this link rests on, which matches the patient assay directly.
  - target: Mast Cell Hyperactivation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      The only arm where the model goes all the way to a whole-animal outcome:
      Fc-epsilon-receptor-proximal hyperphosphorylation and LAMP-1 mobilisation
      in cultured mast cells, and exaggerated IgE-mediated passive anaphylaxis
      with raised mast cell protease 1 in the animal.
    limitations: >-
      The human counterpart is chronic urticaria with a basophil-activating
      plasma factor, not IgE-mediated anaphylaxis: the patient had no atopy and
      no detectable IgE to environmental allergens. The model therefore
      demonstrates the cell's hyperreactivity through a trigger the patient's
      disease does not use.
    evidence:
    - reference: PMID:36006710
      reference_title: Immune dysregulation caused by homozygous mutations in CBLB.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Bone marrow-derived mast cells from CblbH257L mice were hyperactivated
        after FcεRI cross-linking, and CblbH257L mice demonstrated exaggerated
        IgE-mediated passive anaphylaxis.
      explanation: >-
        Both levels of the mast-cell result, cultured cells and whole animal.
  - target: Breakdown of Peripheral T Cell Tolerance
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      The step at which the model stops. It carries the cellular abnormalities
      that this entry proposes break tolerance, and does not break tolerance.
    limitations: >-
      Housing is the authors' own candidate explanation: the mice were kept
      under specific-pathogen-free conditions, and the two independently
      generated Cblb-null lines also differ from each other in whether they
      develop autoimmunity. So the negative result may reflect the absence of an
      environmental trigger rather than the absence of the mechanism, and the
      planned test, cohousing with pet-store mice, had not been done.
    evidence:
    - reference: PMID:36006710
      reference_title: Immune dysregulation caused by homozygous mutations in CBLB.
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: >-
        CblbH257L mice did not develop autoimmune disease under specific
        pathogen–free (SPF) conditions.
      explanation: >-
        The negative result stated plainly, with the housing condition the
        authors attach to it.
    - reference: PMID:36006710
      reference_title: Immune dysregulation caused by homozygous mutations in CBLB.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Autoantibodies and spontaneous autoimmune disease have been detected in
        one, but not the other of 2 independently generated lines of Cblb–/–
        mice (3, 10), suggesting that environmental and genetic factors play an
        important role in the development of autoimmune disease in CBL-B
        deficiency.
      explanation: >-
        Supports the interpretation that the failure is conditional on
        environment and background rather than showing the mechanism is wrong.
      directness: INDIRECT
    divergences:
    - divergence_type: BOUNDARY_OMISSION
      materiality: INVALIDATING
      description: >-
        Whatever second requirement turns the cellular phenotype into
        autoimmunity, microbial exposure or modifier alleles or both, is
        outside this model as housed. The authors name cohousing with pet-store
        mice as the experiment that would bring it inside.
- name: Cbl-b null mouse
  species: Mouse
  genotype: Cblb knockout (homozygous null)
  publication: PMID:10646608
  description: >-
    The original gene-targeted null, and the animal counterpart of the human
    disease rather than of a particular allele. It develops spontaneous
    autoimmunity with autoantibody production, infiltration of activated T and B
    lymphocytes into multiple organs and parenchymal damage; its resting
    lymphocytes hyperproliferate on antigen receptor stimulation, its T cells
    overproduce interleukin-2 specifically, and T-cell proliferation,
    interleukin-2 production and Vav1 phosphorylation are uncoupled from the
    requirement for CD28 costimulation. It fails to induce T-cell tolerance in
    vitro and in vivo, is strikingly susceptible to experimental autoimmune
    encephalomyelitis, and its effector T cells resist regulatory T cells in
    vivo including when genuinely naive, while its regulatory T cells function
    normally. Whether it develops autoimmunity is not fully reproducible: of the
    two independently generated null lines, autoantibodies and spontaneous
    disease were found in one and not the other.
  genes:
  - preferred_term: CBLB
    term:
      id: hgnc:1542
      label: CBLB
  evidence:
  - reference: PMID:10646608
    reference_title: Negative regulation of lymphocyte activation and autoimmunity by the molecular adaptor Cbl-b.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Cbl-b is thus a key regulator of activation thresholds in mature
      lymphocytes and immunological tolerance and autoimmunity.
    explanation: >-
      The authors' conclusion from the null mouse, and the statement of the
      gene's function that the human disease later bore out.
  modeled_mechanisms:
  - target: Breakdown of Peripheral T Cell Tolerance
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      The only model that reaches the disease: spontaneous multi-organ
      autoimmunity with autoantibodies and lymphocytic infiltration, plus
      demonstrated failure of tolerance and anergy induction.
    limitations: >-
      A complete null rather than any patient genotype, and its autoimmune
      phenotype is itself line-dependent, present in one of the two
      independently generated lines and not the other. The organ pattern is also
      not the patients': infiltration with parenchymal damage and
      encephalomyelitis susceptibility, rather than polyendocrinopathy and
      cytopenias.
    evidence:
    - reference: PMID:10646608
      reference_title: Negative regulation of lymphocyte activation and autoimmunity by the molecular adaptor Cbl-b.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Here we show that gene-targeted mice lacking the adaptor Cbl-b develop
        spontaneous autoimmunity characterized by auto-antibody production,
        infiltration of activated T and B lymphocytes into multiple organs, and
        parenchymal damage.
      explanation: >-
        The autoimmune phenotype that makes this model informative for the
        tolerance node.
    - reference: PMID:15308098
      reference_title: Essential role of the E3 ubiquitin ligase Cbl-b in T cell anergy induction.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Importantly, rechallenge of Cbl-b mutant mice with the tolerizing antigen
        results in massive lethality. Moreover, ablation of Cbl-b resulted in
        exacerbated autoimmunity.
      explanation: >-
        The tolerance-induction failure measured directly in this model, which is
        the mechanism the node names rather than its downstream disease.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        The autoimmune target organs differ between the null mouse and the
        patients, so the model supports the loss of tolerance without
        predicting which organs a given patient will lose tolerance to.
  - target: T Cell Hyperproliferation Uncoupled from CD28 Costimulation
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      The model in which the costimulation-independence was first demonstrated,
      including the restoration of T-cell-dependent antibody responses in
      CD28-null mice by crossing in the Cbl-b null mutation.
    evidence:
    - reference: PMID:10646609
      reference_title: Cbl-b regulates the CD28 dependence of T-cell activation.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Here we show that T cells that are deficient in the adaptor molecule
        Cbl-b (ref. 3) do not require CD28 engagement for interleukin-2
        production, and that the Cbl-b-null mutation (Cbl-b(-/-)) fully restores
        T-cell-dependent antibody responses in CD28-/- mice.
      explanation: >-
        The genetic demonstration that losing Cbl-b removes the costimulation
        requirement, which is stronger than a proliferation assay alone.
  - target: Effector T Cell Resistance to Regulatory T Cell Suppression
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: ORGANISM
    description: >-
      Extends the resistance from culture into the living animal and to naive
      effector cells, and separates it from any defect in the regulatory
      population.
    evidence:
    - reference: PMID:20624942
      reference_title: Cbl-b(-/-) T cells demonstrate in vivo resistance to regulatory T cells but a context-dependent resistance to TGF-beta.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Additionally, we show that Cbl-b(-/-) Tregs are fully functional in vivo,

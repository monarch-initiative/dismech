- name: T Cell Hyperproliferation Uncoupled from CD28 Costimulation
  description: >-
    The one functional abnormality demonstrated in more than one patient. CD4+
    T cells from the patient with p.H285L and from the patient with p.R496X
    both hyperproliferated on anti-CD3 stimulation relative to controls. In the
    knock-in mouse the same cells also secrete more interleukin-2 and, unlike
    wild-type T cells, gain nothing further from added anti-CD28, so the
    costimulation requirement is already satisfied. Human patient cells did
    show a further increase with anti-CD28, so the mouse's complete uncoupling
    is not reproduced in the patients.

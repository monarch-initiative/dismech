      in the regulatory T-cell defect subtable, as a new entity in the 2024
      update. Its row records normal lymphocyte counts with hyperproliferation,
      resistance to Treg suppression with increased B-cell signalling, and an
      autoimmune rather than infectious clinical column, which is how the
      disease is curated here.

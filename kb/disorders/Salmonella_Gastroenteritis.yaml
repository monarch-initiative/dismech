transmission:
- name: Fecal-Oral Foodborne Exposure
  description: >-
    Humans usually acquire nontyphoidal Salmonella by ingesting contaminated
    animal-derived foods, contaminated produce, milk, or water, or by oral
    exposure after contact with colonized animals or people.
  evidence:
  - reference: PMID:31321641
    reference_title: Non-typhoidal Salmonella aortitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Human infection occurs by fecal-oral transmission through ingestion of
      contaminated food, milk, or water (inter-human or zoonotic
      transmission).
    explanation: >-
      Directly states the fecal-oral, food/milk/water, and zoonotic acquisition
      routes for nontyphoidal Salmonella.
pathophysiology:
- name: Proton Pump Inhibitor Gastric Acid Suppression
  role: susceptibility_factor
  biological_scale: ORGANISM
  description: >-
    Proton-pump inhibitor use suppresses gastric acidity, weakening the stomach
    barrier that normally kills ingested Salmonella and raising susceptibility to
    Salmonella gastroenteritis.
  downstream:
  - target: Foodborne Salmonella Ingestion
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      By reducing the acid barrier, PPI exposure lets a larger fraction of
      ingested Salmonella survive gastric transit to reach the intestine.
  evidence:
  - reference: PMID:18054750
    reference_title: Use of acid-suppressing drugs and the risk of bacterial gastroenteritis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      When analyzed separately, both species reproduced the increased risk
      associated with PPI use and not H2RA use.
    explanation: >-
      In a population case-control study, Salmonella gastroenteritis showed the
      same PPI-associated risk signal as the overall bacterial-gastroenteritis
      cohort.
  - reference: PMID:21999643
    reference_title: "Systematic review: the use of proton pump inhibitors and increased susceptibility to enteric infection."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Severe hypochlorhydria generated by PPI use leads to bacterial
      colonisation and increased susceptibility to enteric bacterial infection.
    explanation: >-
      A systematic review supports acid suppression as a plausible
      susceptibility factor for Salmonella and other enteric bacterial
      infections.
- name: Foodborne Salmonella Ingestion
  role: trigger
  biological_scale: ORGANISM
  description: >-
    Viable nontyphoidal Salmonella organisms are swallowed with contaminated
    food, water, milk, or material from colonized animals.
  downstream:
  - target: M-Cell FimH-GP2 Uptake
    causal_link_type: DIRECT
    description: >-
      Organisms that survive gastric transit reach Peyer's-patch follicle
      associated epithelium and can bind GP2 on M cells through type 1 fimbriae.
  - target: SPI-1 Type III Secretion and Enterocyte Invasion
    causal_link_type: DIRECT
    description: >-
      Luminal Salmonella can directly invade enterocytes after SPI-1 type III
      secretion system assembly and effector translocation.
  evidence:
  - reference: PMID:31321641
    reference_title: Non-typhoidal Salmonella aortitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Human infection occurs by fecal-oral transmission through ingestion of
      contaminated food, milk, or water (inter-human or zoonotic
      transmission).
    explanation: >-
      Supports ingestion of contaminated material as the initiating exposure for
      nontyphoidal Salmonella infection.
- name: M-Cell FimH-GP2 Uptake
  biological_scale: CELLULAR
  description: >-
    Salmonella uses type 1-pilus FimH to bind glycoprotein 2 on intestinal
    M cells, which can transcytose luminal bacteria into gut lymphoid tissue.
  cell_types:
  - preferred_term: M cell of gut
    term:
      id: CL:0000682
      label: M cell of gut
  biological_processes:
  - preferred_term: adhesion of symbiont to host
    term:
      id: GO:0044406
      label: adhesion of symbiont to host
  downstream:
  - target: Neutrophilic Enterocolitis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      M-cell uptake moves Salmonella across the epithelium, contributing to
      mucosal invasion that triggers acute intestinal inflammation.
  evidence:
  - reference: PMID:21468225
    reference_title: "Glycoprotein 2 (GP2): grabbing the FimH bacteria into M cells for mucosal immunity."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: >-
      GP2 interacts with FimH, a major component of the type 1 pilus on the
      outer membrane of a subset of gram-negative enterobacilli such as E. coli
      and Salmonella enterica.
    explanation: >-
      Identifies the GP2-FimH receptor pair that links Salmonella to intestinal
      M-cell uptake.
  - reference: PMID:19828638
    reference_title: RANKL is necessary and sufficient to initiate development of antigen-sampling M cells in the intestinal epithelium.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      Sections of the intestinal wall taken 2 hours after the introduction of
      the bacteria revealed substantially enhanced uptake of both Salmonella
      enterica serovar Typhimurium (35-fold) and Yersinia enterocolitica
      (46-fold) as a consequence of villous M cell induction by RANKL
    explanation: >-
      Shows that experimentally expanded M cells take up S. Typhimurium from
      the gut lumen.
- name: SPI-1 Type III Secretion and Enterocyte Invasion
  biological_scale: CELLULAR
  description: >-
    Salmonella pathogenicity island 1 encodes a type III secretion system that
    injects Sip and Sop effectors into intestinal epithelial cells, rearranges
    the actin cytoskeleton, and drives enterocyte invasion.
  cell_types:
  - preferred_term: enterocyte
    term:
      id: CL:0000584
      label: enterocyte
  downstream:
  - target: SipB Caspase-1 IL-1β Activation
    causal_link_type: DIRECT
    description: >-
      SPI-1 translocation delivers SipB, which binds caspase-1 and activates
      IL-1β processing.
  - target: SopB-Dependent Fluid Secretion
    causal_link_type: DIRECT
    description: >-
      SPI-1 translocation delivers SopB, which contributes to Salmonella-driven
      intestinal fluid secretion and inflammation.
  evidence:
  - reference: PMID:41212225
    reference_title: Inhibition of the Type III Secretion System of Salmonella Enterica Serovar Typhimurium and Alleviation Pathogenicity Via Treatment with Xanthotoxol.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: >-
      The Type III secretion system (T3SS) of Salmonella is a syringe-like
      protein injection apparatus that translocates bacterial effector proteins
      into host cells and is essential for epithelial invasion and early stages
      of pathogenesis.
    explanation: >-
      Supports SPI-1 type III secretion as the Salmonella machinery that
      delivers effectors and initiates epithelial invasion.
  - reference: PMID:29522566
    reference_title: Minimal SPI1-T3SS effector requirement for Salmonella enterocyte invasion and intracellular proliferation in vivo.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      Our results demonstrate the critical but redundant role of SopE2 and SipA
      for enterocyte invasion, prerequisite for transcriptional stimulation and
      mucosal translocation in vivo.
    explanation: >-
      Defines individual SPI-1 effectors required for Salmonella enterocyte
      invasion in vivo.
- name: SipB Caspase-1 IL-1β Activation
  biological_scale: CELLULAR
  description: >-
    Translocated Salmonella SipB binds host caspase-1, enabling cleavage and
    activation of pro-IL-1β as part of the early inflammatory response.
  biological_processes:
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
  downstream:
  - target: Neutrophilic Enterocolitis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      IL-1β signaling contributes to neutrophil recruitment into the infected
      distal bowel.
  evidence:
  - reference: PMID:11402005
    reference_title: Salmonella-induced cell death is not required for enteritis in calves.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: >-
      SipB binds and activates caspase-1, which in turn activates the
      proinflammatory cytokine interleukin-1beta through cleavage.
    explanation: >-
      Links the Salmonella SipB effector to caspase-1 and inflammatory IL-1β
      activation.
- name: SopB-Dependent Fluid Secretion
  biological_scale: CELLULAR
  description: >-
    The Salmonella SopB inositol phosphate phosphatase contributes to the
    intestinal fluid secretion and inflammatory response induced by
    S. Typhimurium in the ileal mucosa.
  downstream:
  - target: Neutrophilic Enterocolitis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      SopB contributes to the inflammatory component of Salmonella enteritis.
  - target: Inflammatory-Secretory Diarrhea
    causal_link_type: DIRECT
    description: >-
      SopB-linked fluid secretion is one effector-level input into acute
      Salmonella diarrhea.
  evidence:
  - reference: PMID:11402005
    reference_title: Salmonella-induced cell death is not required for enteritis in calves.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      The sopB mutant induced the same amount of TUNEL-positive cells as the
      wild type, but it was attenuated for induction of fluid secretion and
      inflammation.
    explanation: >-
      Shows SopB contributes to secretory and inflammatory enteritis in a calf
      ileal-loop Salmonella model.
- name: Neutrophilic Enterocolitis
  biological_scale: TISSUE
  description: >-
    SPI-1-dependent epithelial invasion and inflammatory signaling recruit
    neutrophils into the distal ileal and colonic mucosa, producing acute
    inflammatory enterocolitis.
  locations:
  - preferred_term: ileum
    term:
      id: UBERON:0002116
      label: ileum
  - preferred_term: colon
    term:
      id: UBERON:0001155
      label: colon
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  biological_processes:
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
  downstream:
  - target: Inflammatory-Secretory Diarrhea
    causal_link_type: DIRECT
    description: >-
      Neutrophilic mucosal inflammation and SopB-associated secretion generate
      the watery or inflammatory diarrhea of Salmonella gastroenteritis.
  - target: Tetrathionate-Respiring Salmonella Bloom
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      The inflamed gut oxidizes thiosulfate to tetrathionate, creating a
      respiratory electron acceptor that Salmonella can exploit anaerobically.
  evidence:
  - reference: PMID:21327114
    reference_title: Salmonella SPI-1-mediated neutrophil recruitment during enteric colitis is associated with reduction and alteration in intestinal microbiota.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      Large numbers of luminal neutrophils were observed in the ceca of
      WT-infected, but not in invAmut or ssaRmut infected mice.
    explanation: >-
      Supports neutrophil recruitment as a SPI-1-linked tissue response in
      enteric Salmonella infection.
- name: Tetrathionate-Respiring Salmonella Bloom
  biological_scale: MOLECULAR
  description: >-
    Reactive chemistry in the inflamed intestine converts host thiosulfate to
    tetrathionate; S. Typhimurium then uses tetrathionate as an electron
    acceptor to respire ethanolamine and outgrow fermentative gut microbiota.
  downstream:
  - target: Inflammatory-Secretory Diarrhea
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Respiratory growth in the inflamed lumen helps maintain high Salmonella
      burdens during acute transmissible enterocolitis.
  evidence:
  - reference: PMID:21969563
    reference_title: Intestinal inflammation allows Salmonella to use ethanolamine to compete with the microbiota.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      By inducing intestinal inflammation, S. Typhimurium sidesteps nutritional
      competition and gains the ability to use an abundant simple substrate,
      ethanolamine, which is provided by the host.
    explanation: >-
      Shows how inflammation supplies Salmonella with a metabolic advantage in
      the gut lumen.
- name: Inflammatory-Secretory Diarrhea
  biological_scale: ORGANISM
  description: >-
    Combined mucosal exudation and epithelial fluid secretion produce acute
    diarrhea, abdominal cramping, fever, and sometimes visibly bloody diarrhea.
  downstream:
  - target: Nontyphoidal Salmonella Bacteremia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      In a minority of patients, enteric infection progresses past the gut into
      bloodstream infection.
  evidence:
  - reference: PMID:36449648
    reference_title: "Salmonella gastroenteritis in children: six-year experience in İstanbul, Turkey."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The most common clinical symptoms were diarrhea (n = 166, 96.5%), fever
      (n = 113, 65.7%) and abdominal pain (n = 73, 42.4%).
    explanation: >-
      Documents the core symptomatic phenotype produced by acute Salmonella
      enterocolitis.
- name: Nontyphoidal Salmonella Bacteremia
  biological_scale: ORGANISM
  description: >-
    About five percent of nontyphoidal Salmonella gastroenteritis cases progress
    to bacteremia, which can seed focal infections such as aortitis,
    endovascular infection, osteomyelitis, or meningitis.
  evidence:
  - reference: PMID:31321641
    reference_title: Non-typhoidal Salmonella aortitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Approximately 5% of patients with NTS gastroenteritis develop bacteremia
      and the incidence of extra-intestinal focal infection in NTS bacteremia is
      about 40%.
    explanation: >-
      Quantifies the bloodstream and extraintestinal-focal complication branch
      of nontyphoidal Salmonella gastroenteritis.

name: Salmonella Gastroenteritis
creation_date: "2026-09-30T10:00:51Z"
updated_date: "2026-11-03T00:00:00Z"
description: >-
  Salmonella gastroenteritis is acute nontyphoidal Salmonella enteric infection
  acquired when contaminated food, milk, water, or animal contact delivers
  Salmonella enterica serovars to the distal ileum and colon. The organism uses
  M-cell uptake and SPI-1 type III secretion effectors to cross and invade the
  epithelium, activates caspase-1 and neutrophilic inflammation, exploits the
  inflamed gut lumen as a tetrathionate-supported respiratory niche, and causes
  diarrhea, fever, abdominal pain, and occasional bloody diarrhea, with rare
  bacteremia in susceptible hosts.

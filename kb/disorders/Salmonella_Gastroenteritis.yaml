progression:
- phase: Acute Incubation and Enterocolitis
  age_range: any age
  duration: 6 to 72 hour incubation followed by several days of diarrhea
  evidence:
  - reference: PMID:8119352
    reference_title: Dose-response effects in an outbreak of Salmonella enteritidis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      As dose increased, median incubation period decreased (37 h in the low
      exposure group v. 21 h in the medium exposure group v. 17.5 h in the high
      exposure group, P = 0.006)
    explanation: >-
      Supports dose-dependent acute incubation timing after Salmonella
      Enteritidis exposure.
- phase: Invasive Extraintestinal Branch
  age_range: very young, elderly, or immunocompromised hosts
  evidence:
  - reference: PMID:31321641
    reference_title: Non-typhoidal Salmonella aortitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Approximately 5% of patients with NTS gastroenteritis develop bacteremia
      and the incidence of extra-intestinal focal infection in NTS bacteremia is
      about 40%.
    explanation: >-
      Supports bacteremia and focal seeding as a distinct invasive complication
      branch after enteric nontyphoidal Salmonella infection.
diagnosis:
- name: Stool Culture and Multiplex PCR Detection
  description: >-
    Stool culture provides a reference diagnostic method for Salmonella
    gastroenteritis and can be supplemented by multiplex PCR gastrointestinal
    panels that detect Salmonella DNA even when culture is negative.
  diagnosis_term:
    preferred_term: Stool Culture
  evidence:
  - reference: PMID:27668899
    reference_title: Report of data on children with non-typhi Salmonella gastroenteritis in a three-year period.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The definitive diagnosis was made with positive stool culture (n = 65)
      and/or PCR test (n = 4).
    explanation: >-
      Documents stool culture and PCR confirmation in a pediatric non-typhoidal
      Salmonella gastroenteritis cohort.
treatments:
- name: Severe or High-Risk Case Antimicrobial Therapy
  description: >-
    Moderate uncomplicated Salmonella gastroenteritis generally does not require
    antibiotics, but severe cases and high-risk patients are treated with active
    agents such as ciprofloxacin or ceftriaxone.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: Ciprofloxacin
      term:
        id: NCIT:C375
        label: Ciprofloxacin
    - preferred_term: Ceftriaxone
      term:
        id: NCIT:C62020
        label: Ceftriaxone
  target_mechanisms:
  - target: Nontyphoidal Salmonella Bacteremia
    treatment_effect: INHIBITS
    description: >-
      Susceptible antibiotics reduce invasive bloodstream and focal
      nontyphoidal Salmonella burden in severe or high-risk disease.
  evidence:
  - reference: PMID:19000862
    reference_title: "[Bacterial diarrheas and antibiotics: European recommendations]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      There is no argument to treat moderate salmonella gastroenteritis or
      carriage. However, the severe cases and those occurring in high risk
      patient must be treated (ciprofloxacin or ceftriaxone).
    explanation: >-
      Supports reserving ciprofloxacin or ceftriaxone treatment for severe and
      high-risk Salmonella gastroenteritis rather than routine moderate disease.
animal_models:
- name: Streptomycin-Pretreated S. Typhimurium Mouse Colitis
  species: Mouse
  genotype: Streptomycin-pretreated C57BL/6 mice
  publication: PMID:21327114
  description: >-
    Streptomycin-pretreated mice infected orally with S. Typhimurium model acute
    cecal and colonic inflammation and defined-microbiota studies test
    microbiota protection against systemic spread.
  associated_phenotypes:
  - Neutrophilic cecal inflammation
  - Salmonella-induced colitis
  - Microbiota-sensitive intestinal inflammation
  modeled_mechanisms:
  - target: Neutrophilic Enterocolitis
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: TISSUE
    description: >-
      The model produces SPI-1-linked luminal neutrophil accumulation in the
      cecum, matching the acute inflammatory enterocolitis node.
    evidence:
    - reference: PMID:21327114
      reference_title: Salmonella SPI-1-mediated neutrophil recruitment during enteric colitis is associated with reduction and alteration in intestinal microbiota.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: >-
        Large numbers of luminal neutrophils were observed in the ceca of
        WT-infected, but not in invAmut or ssaRmut infected mice.
      explanation: >-
        The mouse model recapitulates the neutrophilic luminal response of
        enteric Salmonella infection.
  evidence:
  - reference: PMID:26531327
    reference_title: Administration of defined microbiota is protective in a murine Salmonella infection model.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      Infected mice receiving MET-1 lost less weight, had reduced serum
      cytokines, reduced NF-κB nuclear staining, and decreased neutrophil
      infiltration in the cecum.
    explanation: >-
      Supports microbiota-sensitive inflammatory Salmonella colitis as a
      manipulable mouse disease model.

review_notes: >-
  Duplicate preflight found no exact MONDO:0005950 or exact
  Salmonella-gastroenteritis standalone entry in ignored-inclusive kb/disorders,
  stubs, research, history, .github, and docs searches; no origin/main disorder
  or stub hit; and no all-state GitHub PR or issue hit carrying the same MONDO
  identifier or exact label before this entry was seeded. Existing local
  Salmonella entries cover typhoid, paratyphoid, and invasive nontyphoidal
  salmonellosis rather than acute luminal gastroenteritis. This curation uses
  the acute nontyphoidal gastroenteritis scope and deliberately leaves invasive
  nontyphoidal salmonellosis as a downstream complication, not an alternate
  primary disease class.

prevalence:
- population: Worldwide (published literature and 100,000 Genomes Project)
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    General population incidence and prevalence are not yet established. A 2021
    synthesis compiled 112 previously published patients, 14 self-reporting
    cohort patients, and 19 patients from the UK 100,000 Genomes Project for a
    total of 145 molecularly confirmed individuals from 144 unrelated families
    carrying 108 unique disease-causing DYRK1A variants.
  evidence:
  - reference: PMID:33562844
    reference_title: "Ocular Phenotype Associated with DYRK1A Variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DYRK1A-related intellectual disability syndrome is a rare disease. An accurate estimation of the incidence compared to the general population is yet to be established."
    explanation: >-
      Confirms that DYRK1A syndrome is a rare disorder whose general population
      incidence has not yet been determined.
  - reference: PMID:33562844
    reference_title: "Ocular Phenotype Associated with DYRK1A Variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The 112 reported patients were added to our self-reporting cohort of 14 patients and the 19 patients from the 100,000 Genomes Project to generate a total of 145 patients from 144 unrelated families with 108 unique disease-causing variants involving DYRK1A (Figure 1)."
    explanation: >-
      Documents 145 molecularly confirmed patients across 144 unrelated families
      in the combined literature and Genomics England synthesis.
progression:
- phase: Prenatal and neonatal onset
  age_range: Prenatal to neonatal period
  notes: >-
    Disease manifestations frequently begin prenatally with intrauterine growth
    restriction, low birth weight, and primary congenital microcephaly evident
    at birth, accompanied by neonatal hypotonia and severe early feeding
    difficulties (sucking/swallowing dysfunction and gastroesophageal reflux).
  evidence:
  - reference: PMID:37740550
    reference_title: "Growth charts in DYRK1A syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In accordance with the literature, the charts show that individuals are more likely to present intrauterine growth restriction with low birth weight and microcephaly. The growth is then characterized by severe microcephaly, low weight, and short stature."
    explanation: >-
      Syndrome-specific growth charts from 92 individuals confirm prenatal
      onset with intrauterine growth restriction, low birth weight, and
      congenital microcephaly followed by persistent postnatal growth
      deficiency.
  - reference: PMID:25944381
    reference_title: "DYRK1A haploinsufficiency causes a new recognizable syndrome with microcephaly, intellectual disability, speech impairment, and distinct facies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All individuals shared congenital microcephaly at birth, intellectual disability, developmental delay, severe speech impairment, short stature, and distinct facial features."
    explanation: >-
      Demonstrates that microcephaly is congenital at birth across the
      foundational cohort.
- phase: Infantile febrile seizures and evolution to epilepsy
  age_range: Infancy to childhood
  notes: >-
    Febrile seizures typically present in infancy and frequently evolve into
    chronic epilepsy with generalized tonic-clonic, atonic, absence, and
    generalized myoclonic seizure types alongside global motor and language
    delays.
  evidence:
  - reference: PMID:26677511
    reference_title: "DYRK1A Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Other medical concerns relate to febrile seizures in infancy; the development of epilepsy with seizures of the atonic, absence, and generalized myoclonic types; short stature; and gastrointestinal problems."
    explanation: >-
      Documents the characteristic progression from infantile febrile seizures
      to childhood epilepsy with atonic, absence, and generalized myoclonic
      seizures.
  - reference: PMID:38179410
    reference_title: "Identification of two novel and one rare mutation in DYRK1A and prenatal diagnoses in three Chinese families with intellectual Disability-7."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Intellectual disability-7 (MRD7) is a subtype disorder of intellectual disability (MRD) involving feeding difficulties, hypoactivity, and febrile seizures at an age of early onset, then progressive intellectual and physical development deterioration."
    explanation: >-
      Describes the early-onset infantile triad of feeding difficulties,
      hypoactivity, and febrile seizures followed by ongoing developmental
      impairment.
- phase: Childhood to adulthood neurodevelopmental and musculoskeletal course
  age_range: Childhood through adulthood
  notes: >-
    Distal musculoskeletal and foot abnormalities—including long tapered
    fingers, small hands and feet, toe syndactyly, and high arched feet—may not
    become evident until adulthood. During childhood and adolescence, the
    neurobehavioral profile includes prominent attentional and depressive
    features relative to other syndromic neurodevelopmental cohorts.
  evidence:
  - reference: PMID:33562844
    reference_title: "Ocular Phenotype Associated with DYRK1A Variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Hand and foot abnormalities include long tapered fingers, small hands and feet, toe syndactyly and high arched feet ... These features may not be seen until adulthood"
    explanation: >-
      Documents that distal musculoskeletal and foot abnormalities (long tapered
      fingers, small hands and feet, toe syndactyly, and high arched feet) may
      not appear until adulthood.
  - reference: PMID:38622540
    reference_title: "Shared and divergent mental health characteristics of ADNP-, CHD8- and DYRK1A-related neurodevelopmental conditions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patterns of mental health features varied by group, with anxiety most prominent for CHD8, oppositional features overrepresented among ADNP, and attentional and depressive features most prominent for DYRK1A."
    explanation: >-
      Characterizes the behavioral profile in DYRK1A syndrome, where
      attentional and depressive symptoms are prominent relative to ADNP and
      CHD8 cohorts.

inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  expressivity: VARIABLE
  description: >-
    DYRK1A syndrome is inherited in an autosomal dominant manner, with the vast
    majority of cases resulting from a de novo heterozygous pathogenic variant
    or 21q22.13 microdeletion. When neither parent carries the proband's
    pathogenic variant on leukocyte DNA testing, sibling recurrence risk is
    estimated at approximately 1% due to the theoretical possibility of parental
    germline mosaicism.
  evidence:
  - reference: PMID:26677511
    reference_title: "DYRK1A Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DYRK1A syndrome is an autosomal dominant disorder typically caused by a de novo pathogenic variant."
    explanation: >-
      Establishes autosomal dominant inheritance with predominantly de novo
      origin.
  - reference: PMID:26677511
    reference_title: "DYRK1A Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "If the DYRK1A pathogenic variant identified in the proband is not identified in either parent, the recurrence risk to sibs is estimated to be 1% because of the theoretic possibility of parental germline mosaicism."
    explanation: >-
      Documents the ~1% theoretical sibling recurrence risk attributable to
      potential parental germline mosaicism.

pathophysiology:
- name: DYRK1A Haploinsufficiency
  description: >
    DYRK1A-related intellectual disability syndrome is caused by heterozygous
    loss-of-function variants (truncating mutations, deletions, and disruptive
    missense changes) in DYRK1A, typically arising de novo. DYRK1A encodes a
    dosage-sensitive dual-specificity tyrosine-phosphorylation-regulated kinase
    that maps to the Down syndrome critical region on chromosome 21q22.13.
    Whereas copy-number gain (trisomy 21) increases DYRK1A dosage,
    loss-of-function variants produce haploinsufficiency, establishing DYRK1A as
    a dosage-sensitive gene in which both increased and decreased dosage impair
    neurodevelopment.

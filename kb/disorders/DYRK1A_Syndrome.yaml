differential_diagnoses:
- name: Angelman syndrome
  disease_term:
    preferred_term: Angelman syndrome
    term:
      id: MONDO:0007113
      label: Angelman syndrome
  description: >-
    Shares severe intellectual disability, absent or minimal speech,
    microcephaly, febrile and afebrile seizures, and a broad-based ataxic or
    hypertonic gait, leading several DYRK1A probands to be evaluated for
    Angelman syndrome prior to exome sequencing.
  distinguishing_features:
  - Characteristic DYRK1A facial gestalt (deep-set eyes, bitemporal narrowing, prominent nasal root, thin upper vermilion, microretrognathia) rather than Angelman facies.
  - Congenital microcephaly and intrauterine growth restriction are typical of DYRK1A syndrome, whereas microcephaly in Angelman syndrome usually develops postnatally.
  - Heterozygous pathogenic variant in DYRK1A at 21q22.13 rather than 15q11-q13 maternal deletion, UBE3A mutation, or imprinting defect.
  evidence:
  - reference: PMID:25944381
    reference_title: "DYRK1A haploinsufficiency causes a new recognizable syndrome with microcephaly, intellectual disability, speech impairment, and distinct facies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our study demonstrates that haploinsufficiency of DYRK1A results in a new recognizable syndrome, which should be considered in individuals with Angelman syndrome-like features and distinct facial features."
    explanation: >-
      Explicitly identifies Angelman syndrome as a key clinical differential
      diagnosis for DYRK1A haploinsufficiency.
- name: ADNP-related neurodevelopmental disorder (Helsmoortel-van der Aa syndrome)
  disease_term:
    preferred_term: ADNP-related multiple congenital anomalies - intellectual disability - autism spectrum disorder
    term:
      id: MONDO:0014379
      label: ADNP-related multiple congenital anomalies - intellectual disability - autism spectrum disorder
  description: >-
    Autosomal dominant de novo neurodevelopmental disorder sharing global
    developmental delay, intellectual disability, autism spectrum disorder,
    and overlapping psychiatric and neurobehavioral features with DYRK1A
    syndrome.
  distinguishing_features:
  - Primary microcephaly and short stature strongly favor DYRK1A syndrome.
  - Behavioral profile in ADNP syndrome shows a higher burden of oppositional and externalizing behaviors, whereas attentional and depressive features are more prominent in DYRK1A syndrome.
  - Pathogenic variant in ADNP rather than DYRK1A.
  evidence:
  - reference: PMID:38622540
    reference_title: "Shared and divergent mental health characteristics of ADNP-, CHD8- and DYRK1A-related neurodevelopmental conditions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patterns of mental health features varied by group, with anxiety most prominent for CHD8, oppositional features overrepresented among ADNP, and attentional and depressive features most prominent for DYRK1A."
    explanation: >-
      Directly contrasts the neurobehavioral profiles of ADNP-, CHD8-, and
      DYRK1A-related neurodevelopmental disorders.
  - reference: PMID:38622540
    reference_title: "Shared and divergent mental health characteristics of ADNP-, CHD8- and DYRK1A-related neurodevelopmental conditions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Despite shared associations with autism and intellectual disability, disruptive variants in ADNP, CHD8, and DYRK1A may yield variable psychiatric phenotypes among children and adolescents."
    explanation: >-
      Documents the shared autism and intellectual disability presentation alongside
      distinct psychiatric profiles across ADNP, CHD8, and DYRK1A syndromes.
- name: CHD8-related neurodevelopmental disorder with overgrowth
  disease_term:
    preferred_term: intellectual developmental disorder with autism and macrocephaly
    term:
      id: MONDO:0014017
      label: intellectual developmental disorder with autism and macrocephaly
  description: >-
    Monogenic de novo autism-associated neurodevelopmental disorder sharing
    autism spectrum disorder and intellectual disability with DYRK1A syndrome,
    while diverging sharply in head growth and internalizing psychiatric profile.
  distinguishing_features:
  - Larger head circumference (macrocephaly) characterizes CHD8-related disorder, whereas congenital microcephaly and short stature characterize DYRK1A syndrome.
  - Lower cognitive and adaptive functioning scores in DYRK1A syndrome compared with idiopathic ASD and smaller head size compared with both idiopathic ASD and CHD8 cases.
  - Anxiety is the most prominent mental health feature in CHD8, whereas attentional and depressive symptoms predominate in DYRK1A.
  evidence:
  - reference: PMID:29034068
    reference_title: "Clinical phenotype of ASD-associated DYRK1A haploinsufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "When compared quantitatively, DYRK1A cases presented with significantly lower IQ and adaptive functioning compared to idiopathic cases and significantly smaller head size compared to both idiopathic and CHD8 cases."
    explanation: >-
      Quantitative head-circumference and cognitive comparison distinguishing
      DYRK1A haploinsufficiency from CHD8-related ASD.
  - reference: PMID:29034068
    reference_title: "Clinical phenotype of ASD-associated DYRK1A haploinsufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cases with DYRK1A mutations are also distinguishable from disruptive mutations to CHD8 by head size."
    explanation: >-
      Establishes head circumference (microcephaly vs macrocephaly) as a direct
      clinical discriminator between DYRK1A and CHD8 mutations.
  - reference: PMID:38622540
    reference_title: "Shared and divergent mental health characteristics of ADNP-, CHD8- and DYRK1A-related neurodevelopmental conditions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patterns of mental health features varied by group, with anxiety most prominent for CHD8, oppositional features overrepresented among ADNP, and attentional and depressive features most prominent for DYRK1A."
    explanation: >-
      Distinguishes the anxiety-predominant mental health profile of CHD8 from
      the attentional and depressive profile of DYRK1A syndrome.
- name: Idiopathic autism spectrum disorder
  disease_term:
    preferred_term: autism spectrum disorder
    term:
      id: MONDO:0005258
      label: autism spectrum disorder
  description: >-
    Between 40% and 88% of individuals with molecularly confirmed DYRK1A
    syndrome initially receive a clinical diagnosis of autism spectrum disorder
    before genetic testing identifies the underlying syndromic etiology.
  distinguishing_features:
  - Congenital microcephaly, intrauterine and postnatal growth retardation, febrile seizures/epilepsy, neonatal feeding difficulties, distinct facial dysmorphism, and ocular anomalies distinguish DYRK1A syndrome from nonsyndromic ASD.
  - Significantly lower nonverbal and verbal IQ and adaptive functioning compared with idiopathic ASD cohorts.
  evidence:
  - reference: PMID:33562844
    reference_title: "Ocular Phenotype Associated with DYRK1A Variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Between 40 and 88% of patients with molecularly confirmed DYRK1A-related intellectual disability syndrome are initially misdiagnosed with ASD, due to its overlapping clinical features and it being more common"
    explanation: >-
      Documents the high rate of initial clinical misdiagnosis as nonsyndromic
      autism spectrum disorder.
  - reference: PMID:29034068
    reference_title: "Clinical phenotype of ASD-associated DYRK1A haploinsufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Results confirm a core clinical phenotype for DYRK1A disruptions, with a combination of features that is distinct from idiopathic ASD."
    explanation: >-
      Quantitative comparison with idiopathic ASD confirms a distinct syndromic
      cluster in DYRK1A haploinsufficiency.


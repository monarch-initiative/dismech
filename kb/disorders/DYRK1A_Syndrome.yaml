    single-nucleotide variant, small insertion/deletion, or intragenic deletion
    in DYRK1A via molecular genetic testing in a proband with suggestive
    neurodevelopmental and craniofacial findings.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  results: >-
    Heterozygous pathogenic loss-of-function (nonsense, frameshift, canonical
    splice-site, or intragenic deletion) or kinase-domain missense variant in

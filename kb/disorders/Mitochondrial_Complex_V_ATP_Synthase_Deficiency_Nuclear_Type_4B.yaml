- name: Destabilised F1 Assembly with Reduced Complex V Content
  biological_scale: MOLECULAR
  description: >-
    Patient fibroblasts have a strongly reduced content of fully assembled
    complex V and reduced levels of the individual subunits, without the free
    F1 subcomplexes that accumulate when assembly stalls later. This fits a
    defect at the first step of assembly, the formation of the alpha3beta3
    hexamer, for which the alpha subunit is required.

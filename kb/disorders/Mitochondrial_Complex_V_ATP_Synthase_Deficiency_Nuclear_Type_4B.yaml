diagnosis:
- name: Complex V assay and assembly analysis in fibroblasts
  diagnosis_term:
    preferred_term: Skin biopsy for fibroblast culture
    term:
      id: NCIT:C51692
      label: Skin Biopsy
  description: >-
    The diagnosis in the family was reached by combining enzyme testing in
    fibroblasts, which showed an isolated complex V deficiency, with exome
    sequencing; complementation of patient fibroblasts with wild-type ATP5F1A
    confirmed the variant. Because the second allele is silent rather than
    mutated in its coding sequence, sequencing alone reports only a
    heterozygous variant, so allele-specific expression or functional studies
    are needed to explain the disease.
  evidence:
  - reference: PMID:23599390
    reference_title: "A complex V ATP5A1 defect causes fatal neonatal mitochondrial encephalopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "At the messenger RNA level, only the mutated allele was expressed in the patients, whereas the father expressed both the wild-type and the mutant allele."
    explanation: Allele-specific expression was what explained a heterozygous finding on exome sequencing.
  - reference: PMID:41124875
    reference_title: "Clinical utility of the ATP hydrolysis assay for the diagnosis of complex V deficiency in cultured skin fibroblasts."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This assay was able to identify all nuclear DNA-encoded complex V deficiencies, whereas a decrease in complex V activity was observed in some patient cell lines with combined deficiencies."
    explanation: The fibroblast ATP hydrolysis assay detects nuclear complex V deficiencies.

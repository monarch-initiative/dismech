    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Both ATP5F1A alleles are affected in the patients: the paternal allele
    carries p.Arg329Cys and the maternal allele is silent. The carrier father
    and the mother, whose ATP5F1A expression is about half of normal, are
    healthy, so one functional allele is sufficient and the disease needs loss
    of both.

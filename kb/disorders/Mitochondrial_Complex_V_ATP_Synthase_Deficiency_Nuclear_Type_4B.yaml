genetic:
- name: ATP5F1A
  notes: >-
    ATP5F1A (18q21.1; previous symbol ATP5A1) encodes the alpha subunit of the
    F1 domain. The only family with this form carries c.985C>T (p.Arg329Cys) on
    the paternal allele and a silenced maternal allele whose only detected
    change is the intronic variant c.-49+418C>T, about 5.4 kb from the core
    promoter, with no evidence that it alters regulation. ClinGen has no
    gene-disease validity record for ATP5F1A. relationship_type is UNKNOWN
    because the evidence is a single family, even though complementation with
    wild-type ATP5F1A restored complex V in the patients' fibroblasts. Dominant
    ATP5F1A disease is the separate entry for nuclear type 4A.

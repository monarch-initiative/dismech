differential_diagnoses:
- name: ATP5F1A-related complex V deficiency, nuclear type 4A
  description: >-
    The dominant ATP5F1A disorder, usually from de novo heterozygous missense
    variants at the alpha-beta interface or, less often, a heterozygous
    loss-of-function allele. It presents as a neonatal crisis with
    hyperlactataemia and hyperammonaemia that often remits, or as a
    neurodevelopmental disorder with dystonia or spasticity.
  distinguishing_features:
  - A single heterozygous ATP5F1A variant with an expressed wild-type allele
  - Survival beyond infancy, often with remission of the metabolic crisis
- name: Combined oxidative phosphorylation deficiency 22
  description: >-
    Two sisters homozygous for ATP5F1A p.Tyr321Cys, with combined respiratory
    chain deficiency; yeast modelling supported pathogenicity.
  distinguishing_features:
  - Combined respiratory chain deficiency rather than an isolated complex V defect
  evidence:
  - reference: PMID:23596069
    reference_title: "Targeted exome sequencing of suspected mitochondrial disorders."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In one case, we modeled patient mutations in yeast to provide evidence that recessive mutations in ATP5A1 can underlie combined respiratory chain deficiency."
    explanation: The recessive ATP5F1A family with a combined deficiency.
- name: TMEM70-related complex V deficiency (MC5DN2) and other nuclear complex V disorders
  description: >-
    Other recessive causes of isolated complex V deficiency in the newborn,
    separated by the gene involved; in TMEM70 deficiency the assembly stalls
    later, with accumulation of free F1.
  distinguishing_features:
  - Biallelic variants in TMEM70, ATPAF2, ATP5F1E, ATP5F1D, ATP5MK or ATP5PO
notes: >-
  Lump/split: this entry covers only the recessive ATP5F1A disease of MONDO
  and OMIM 615228. The dominant disorder (MC5DN4A, MONDO:0957254, OMIM 620358)
  is a separate entry, because it differs in inheritance, in mechanism (an
  expressed mutant subunit acting against the wild type, or loss of one copy),
  and in course, and MONDO and OMIM give it its own term; the same split is
  used for SLC25A4 (Mitochondrial_DNA_Depletion_Syndrome_12B). The MONDO term's
  design-pattern synonyms ("ATP5F1A mitochondrial complex deficiency") and its
  logical definition (any mitochondrial complex deficiency caused by ATP5F1A)
  are broader than its OMIM-derived scope and would also cover type 4A, so they
  are not used as synonyms here. No GeneReviews chapter covers ATP5F1A; the
  clinical description rests on the founding report's abstract (PMID:23599390)
  and on two reviews that summarise its full text (PMID:24564666,
  PMID:39016153).

pathophysiology:
- name: ATP5F1A p.Arg329Cys with a Silenced Second Allele
  biological_scale: MOLECULAR
  conforms_to: "primary_oxphos_deficiency#OXPHOS Subunit or Assembly Factor Defect"
  description: >-
    The alpha subunit is one of the six that make up the F1 catalytic head:
    three non-catalytic alpha subunits alternate with three catalytic beta
    subunits around the central stalk, and the head supports the rotary ATP
    synthase activity of the whole complex. In the patients only the paternal
    p.Arg329Cys allele is expressed. Arginine 329 is predicted to take part in
    the alpha-beta contact, and the mutant subunit disturbs that interaction.
  genes:
  - preferred_term: ATP5F1A

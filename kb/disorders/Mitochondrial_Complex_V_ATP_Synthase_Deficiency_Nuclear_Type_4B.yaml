name: Mitochondrial Complex V (ATP Synthase) Deficiency, Nuclear Type 4B
creation_date: "2026-11-27T13:57:44Z"
category: Mendelian
disease_term:
  preferred_term: Mitochondrial complex V (ATP synthase) deficiency, nuclear type 4B
  term:
    id: MONDO:0014091
    label: mitochondrial complex V (ATP synthase) deficiency, nuclear type 4B
description: >-
  Mitochondrial complex V (ATP synthase) deficiency nuclear type 4B (MC5DN4B) is
  the recessive form of ATP5F1A-related complex V deficiency. ATP5F1A encodes
  the alpha subunit of ATP synthase; three alpha and three beta subunits
  alternate to form the F1 catalytic head, in which the beta subunits carry the
  catalytic sites.

  The disorder is defined by one family: two siblings of non-consanguineous
  parents with a severe neonatal encephalopathy who both died in the first week
  of life, with extensive brain damage, small renal cysts and hypoplastic
  lungs. Both carried the paternal missense variant c.985C>T (p.Arg329Cys),
  which their healthy father also carried, while the ATP5F1A allele they
  inherited from their mother was not expressed, for a reason that remains
  unknown (an intronic variant, c.-49+418C>T, was the only change found on
  it). Arginine 329 lies at the interface with the beta subunit; the mutant
  alpha subunit destabilises the enzyme, and patient fibroblasts have a
  strongly reduced content of fully assembled complex V, low ATP hydrolytic
  activity and low oxygen consumption. Expressing wild-type ATP5F1A in the
  patients' fibroblasts restored complex V.

  This entry is kept separate from the dominant ATP5F1A disorder, nuclear type
  4A, which arises mostly from de novo heterozygous missense variants and
  presents as a neonatal metabolic crisis that often remits, or as a
  neurodevelopmental movement disorder. A second recessive family, two sisters
  homozygous for p.Tyr321Cys with a combined respiratory chain deficiency, is
  classified by MONDO and OMIM as combined oxidative phosphorylation
  deficiency 22 and is not covered here.
parents:

name: Stiff Skin Syndrome
creation_date: "2026-08-16T00:00:00Z"
description: >-
  Stiff skin syndrome is a rare fibrotic disorder in which the skin becomes
  rock-hard and bound to underlying tissue, producing joint contractures,
  restricted mobility, and in severe cases a restrictive chest wall. The
  widespread form is caused by missense variants in FBN1, the same gene that
  causes Marfan syndrome, and the relationship between those two diseases is the
  most instructive thing about this entry.

  In Marfan syndrome the problem is too little functional fibrillin-1. Here the
  mutant protein is made, secreted, and assembled into microfibrils perfectly
  well. The variants cluster in one domain, the fourth TGF-beta-binding-like
  domain, which is the domain carrying the RGD motif through which fibrillin-1
  binds cell-surface integrins. What is lost is not the protein but a specific
  conversation between the matrix and the cell: the fibroblast can no longer grip
  its own scaffold properly, and the restraint that integrin engagement normally
  places on latent TGF-beta is released. Same gene, different domain, opposite
  protein behaviour, and a fibrotic skin disease instead of an aortopathy.

  Downstream the fibroblast activates, pours out collagen and fibronectin, and
  degrades less matrix than it should, so dense disorganised collagen accumulates
  through the reticular dermis and into the subcutaneous septa and fascia,
  entrapping fat lobules. The skin stops sliding over what lies beneath it.

  Two things are worth flagging for anyone reading further. Human lesional
  histology is famously bland, with no inflammatory infiltrate, while the mouse
  knock-in carrying the equivalent substitution is emphatically inflammatory and
  makes autoantibodies. Nobody has reconciled that, and it is recorded here as an
  open human-model mismatch rather than smoothed over. And no therapy modifies the
  disease: physiotherapy is the mainstay, the drug evidence is anecdotal, and the
  one result pointing at regression of established lesions rather than prevention
  exists only in mice.
category: Mendelian
disease_term:
  preferred_term: Stiff Skin Syndrome
  term:
    id: MONDO:0008492
    label: stiff skin syndrome
synonyms:
- SSS
- Congenital fascial dystrophy
- FBN1-related stiff skin syndrome
notes: >-
  Relationship to other FBN1 disease. This is not a Marfan variant and should not
  be curated as one. Marfan syndrome arises from reduced functional fibrillin-1,
  whereas the stiff-skin variants produce a protein that is secreted and assembled
  normally but has lost integrin binding through its RGD-bearing TB4 domain. The
  clinical consequence is opposite in the tissue that matters: Marfan produces
  lax, distensible connective tissue and aortic dilation, this produces rigid
  skin without reported aortopathy.

  Segmental stiff skin syndrome. A localised form exists in which no FBN1 variant
  is found. Most of the best downstream signalling data, including the losartan
  response in patient fibroblasts, come from segmental cases, and that provenance
  is stated wherever those data are used rather than being quietly generalised to
  the FBN1-driven widespread form.

  Datasets deliberately left empty. No SSS-specific transcriptomic, proteomic,
  metabolomic, or single-cell dataset exists in the public repositories. Searching
  on the gene symbol would surface Marfan and thoracic-aortic-aneurysm datasets,
  which is the named-entity-confusion-through-dataset-search trap the curation SOP
  warns about, so the absence is recorded here instead.

  A therapeutic rationale that does not hold up. Secukinumab has been reported to
  help in segmental disease, and one such case carried a variant in IL17C.
  Secukinumab blocks IL-17A, a different cytokine signalling through a different
  receptor from IL-17C. The drug may well work, but the apparent mechanistic link
  between that variant and that drug is not established, and it is recorded here
  as a caution rather than repeated as mechanism.

  No clinical trials exist for this disease. The clinical_trials block is
  deliberately empty rather than populated with a large multi-condition screening
  study that merely lists the disease among hundreds.
pathophysiology:
- name: FBN1 TB4 Domain Missense Variant
  biological_scale: MOLECULAR
  description: >-
    Missense substitutions clustering in the fourth TGF-beta-binding protein-like
    domain of fibrillin-1, the domain that carries the RGD motif mediating cell
    adhesion through integrin binding. The critical and easily missed point is that
    these variants do not impair production: the mutant protein is secreted and
    incorporated into microfibrils. The lesion is functional rather than
    quantitative, which is what separates this disease mechanistically from the
    fibrillinopathies caused by fibrillin-1 deficiency.
  evidence:
  - reference: PMID:31640988
    reference_title: "A disease-associated mutation in fibrillin-1 differentially regulates integrin-mediated cell adhesion."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Fibrillin-1 is a modular glycoprotein that includes 7 latent transforming growth factor β (TGFβ)-binding protein-like (TB) domains and mediates cell adhesion through integrin binding to the RGD motif in its 4th TB domain."
    explanation: >-
      Locates the RGD motif in the TB4 domain and states its role in integrin
      mediated adhesion, which is why variants in this specific domain produce this
      specific disease.
  - reference: PMID:25979247
    reference_title: "A microfibril assembly assay identifies different mechanisms of dominance underlying Marfan syndrome, stiff skin syndrome and acromelic dysplasias."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we investigated whether or not there were differences in the secretion and microfibril assembly profiles of fibrillin-1 variants"
    explanation: >-
      The assay that tested secretion and assembly of variant fibrillin-1 directly.
      Cited for the question asked, which is the one that distinguishes a functional
      lesion from a deficiency.
  downstream:
  - target: Loss of Integrin Binding by Fibrillin-1
    causal_link_type: DIRECT
    description: >-
      Conformational alteration of the RGD loop removes the binding surface for
      cell-surface integrins while leaving the microfibril intact.
- name: Loss of Integrin Binding by Fibrillin-1
  biological_scale: MOLECULAR
  description: >-
    Selective loss of fibrillin-1 engagement with cell-surface integrins. This is
    the pivot of the disease, and it has two consequences that then run in
    parallel: the fibroblast loses proper adhesion to its own matrix, and the
    restraint that integrin engagement places on latent TGF-beta held in that
    matrix is released. The fibrotic phenotype is thought to be regulated by
    exactly this change in fibrillin-1's ability to mediate integrin binding.
  molecular_functions:
  - preferred_term: integrin binding
    modifier: DECREASED
    term:
      id: GO:0005178
      label: integrin binding
  biological_processes:
  - preferred_term: cell-matrix adhesion
    modifier: DECREASED
    term:
      id: GO:0007160
      label: cell-matrix adhesion
  evidence:
  - reference: PMID:31640988
    reference_title: "A disease-associated mutation in fibrillin-1 differentially regulates integrin-mediated cell adhesion."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The fibrotic phenotype is thought to be regulated by changes in the ability of fibrillin-1 to mediate integrin binding."
    explanation: >-
      States the proposed mechanism at the level this node models. Note the authors'
      own hedge, "is thought to be", which is preserved rather than flattened.
  downstream:
  - target: Increased Dermal TGF-beta Signalling
    causal_link_type: DIRECT
    description: >-
      Release of restraint on latent TGF-beta sequestered in the matrix.
  - target: Fibroblast Activation and Matrix Overproduction
    causal_link_type: DIRECT
    description: >-
      Loss of normal adhesive signalling contributes to the activated fibroblast
      phenotype independently of the TGF-beta arm.
- name: Increased Dermal TGF-beta Signalling
  biological_scale: MOLECULAR
  description: >-
    Increased TGF-beta pathway activity in the dermis, evidenced at the level of
    signal transduction rather than of cytokine synthesis. Patient fibroblasts show
    nuclear accumulation of phosphorylated Smad2 alongside raised ERK1/2
    phosphorylation and NF-kB. The distinction between activity and synthesis
    matters and is discussed below: an early human study found no difference in
    TGF-beta transcript, which is what a model of released latent cytokine would
    predict, since the mechanism liberates TGF-beta that is already present rather
    than making more of it.
  biological_processes:
  - preferred_term: transforming growth factor beta receptor signaling pathway
    modifier: INCREASED
    term:
      id: GO:0007179
      label: transforming growth factor beta receptor signaling pathway
  evidence:
  - reference: PMID:32698527
    reference_title: "Pro-Fibrotic Phenotype in a Patient with Segmental Stiff Skin Syndrome via TGF-β Signaling Overactivation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Lesional fibroblast studies showed a higher phosphorylation level of extracellular signal-regulated kinase 1/2 (ERK1/2), increased levels of nuclear factor-kB (NFkB), and a nuclear accumulation of phosphorylated Smad2"
    explanation: >-
      Direct measurement of pathway activity in patient lesional fibroblasts,
      including nuclear phospho-Smad2, which is the readout of active TGF-beta
      signalling. From segmental disease rather than FBN1-confirmed widespread
      disease.
  - reference: PMID:19468049
    reference_title: "Stiff skin syndrome: evidence for an inflammation-independent fibrosis?"
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "No differences were observed for TGF-beta, CTGF and ET-1."
    explanation: >-
      An early human skin study found no elevation of TGF-beta transcript. Curated
      as PARTIAL rather than REFUTE because it constrains the claim rather than
      contradicting it: this node asserts increased pathway ACTIVITY, and unchanged
      transcript alongside increased downstream signalling is precisely what a
      release-of-sequestered-latent-cytokine mechanism predicts. It would only be a
      refutation of a claim about increased TGF-beta synthesis, which is not the
      claim made here. Note also n=1 and predating the identification of FBN1 as
      causal.
  downstream:
  - target: Fibroblast Activation and Matrix Overproduction
    causal_link_type: DIRECT
    description: >-
      TGF-beta is the principal driver of the fibrotic fibroblast programme.
- name: Fibroblast Activation and Matrix Overproduction
  biological_scale: CELLULAR
  description: >-
    Dermal fibroblasts adopt an activated, matrix-producing phenotype: collagen I
    and III, fibronectin, and thrombospondin transcripts rise, while
    matrix-degrading activity falls. Both halves matter, since accumulation is a
    balance and this disease pushes both terms in the same direction.
  cell_types:
  - preferred_term: dermal fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  biological_processes:
  - preferred_term: collagen biosynthetic process
    modifier: INCREASED
    term:
      id: GO:0032964
      label: collagen biosynthetic process
  evidence:
  - reference: PMID:32698527
    reference_title: "Pro-Fibrotic Phenotype in a Patient with Segmental Stiff Skin Syndrome via TGF-β Signaling Overactivation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "revealed increased levels of COL1A1, COL3A1, AGT, LTBP and ITGB1, while zymography assay reported a reduced metalloproteinase 2 enzymatic activity"
    explanation: >-
      Gives both halves of the imbalance in one measurement: matrix transcripts up,
      matrix-degrading enzyme activity down.
  - reference: PMID:19468049
    reference_title: "Stiff skin syndrome: evidence for an inflammation-independent fibrosis?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "col1A2, fibronectin-1 and thrombospondin-1 were overexpressed in the SSS dermis"
    explanation: >-
      Independent human confirmation of matrix overexpression in lesional skin, from
      the same study that found no cytokine transcript elevation, which is why the
      matrix arm is better supported in humans than the cytokine arm.
  downstream:
  - target: Dermal and Fascial Collagen Accumulation
    causal_link_type: DIRECT
    description: >-
      Sustained overproduction with reduced turnover accumulates matrix in tissue.
- name: Dermal and Fascial Collagen Accumulation
  biological_scale: TISSUE
  description: >-
    Dense, disorganised collagen accumulates through the reticular dermis and
    extends into the subcutaneous septa and fascia, entrapping fat lobules. The
    depth of involvement is what distinguishes this from a purely dermal fibrosis
    and explains why the skin becomes bound to underlying tissue rather than merely
    thickened.
  biological_processes:
  - preferred_term: extracellular matrix assembly
    modifier: INCREASED
    term:
      id: GO:0085029
      label: extracellular matrix assembly
  evidence:
  - reference: PMID:19468049
    reference_title: "Stiff skin syndrome: evidence for an inflammation-independent fibrosis?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "col1A2, fibronectin-1 and thrombospondin-1 were overexpressed in the SSS dermis"
    explanation: >-
      Molecular correlate of the accumulated matrix described histologically in the
      same patient.
  downstream:
  - target: Stiff skin
    causal_link_type: DIRECT
    description: >-
      The accumulated matrix is what the clinician palpates.
  - target: Flexion contracture
    causal_link_type: DIRECT
    description: >-
      Fibrosis crossing joints restricts movement and fixes them in flexion.
phenotypes:
- name: Stiff skin
  category: Dermatological
  description: >-
    Rock-hard skin bound to the underlying tissue, often with a peau d'orange
    surface, characteristically over the buttocks, thighs, and shoulders. Unlike
    scleroderma there is no Raynaud phenomenon, no sclerodactyly, no telangiectasia,
    and no visceral involvement, and routine laboratory tests are normal.
  phenotype_term:
    preferred_term: Stiff skin
    term:
      id: HP:0030053
      label: Stiff skin
  evidence:
  - reference: PMID:32698527
    reference_title: "Pro-Fibrotic Phenotype in a Patient with Segmental Stiff Skin Syndrome via TGF-β Signaling Overactivation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "an ultrarare and untreatable condition"
    explanation: >-
      Cited for the characterisation of the disease in the paper that generated the
      lesional fibroblast data. The phrase also states plainly the therapeutic
      position recorded in the treatments section.
- name: Flexion contracture
  category: Musculoskeletal
  description: >-
    Joint contractures follow directly from fibrosis crossing the joint, and are
    the main source of disability. They progress as the fibrosis does, and are the
    target of the only intervention with consistent support.
  phenotype_term:
    preferred_term: Flexion contracture
    term:
      id: HP:0001371
      label: Flexion contracture
  evidence:
  - reference: PMID:40551142
    reference_title: "The clinical phenotypes and therapeutic strategies for stiff skin syndrome: a case series with literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients were primarily treated with physical therapy"
    explanation: >-
      Physiotherapy is directed at preserving range of motion against contracture,
      so its position as the primary treatment across a case series is evidence that
      contracture is the dominant clinical problem.
- name: Absence of inflammatory infiltrate
  category: Histological
  description: >-
    A curated negative with real diagnostic and mechanistic weight. Lesional skin
    shows fibrosis without inflammatory cells, which separates this from
    scleroderma and from the inflammatory fibrosing dermatoses, and which stands in
    unresolved contrast to the mouse model of the same substitution.
  evidence:
  - reference: PMID:19468049
    reference_title: "Stiff skin syndrome: evidence for an inflammation-independent fibrosis?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "no inflammatory infiltrates or up-regulation of pro-fibrotic cytokines were found"
    explanation: >-
      States the absence of both inflammatory infiltrate and cytokine upregulation
      in human lesional skin.
  - reference: PMID:19468049
    reference_title: "Stiff skin syndrome: evidence for an inflammation-independent fibrosis?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The data suggest that fibrosis in SSS might be independent from inflammation."
    explanation: >-
      The authors' own inference from that absence, and the human half of the
      mismatch with the mouse model.
genetic:
- name: FBN1
  gene_term:
    preferred_term: FBN1
    term:
      id: hgnc:3603
      label: FBN1
  relationship_type: CAUSATIVE
  inheritance:
  - name: Autosomal dominant
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
  notes: >-
    Encodes fibrillin-1. Stiff skin syndrome variants cluster in the fourth
    TGF-beta-binding protein-like domain, which carries the RGD motif mediating
    integrin binding, and reported substitutions include W1570C, C1564S, and
    C1577G. The mutant protein is secreted and assembled into microfibrils, so this
    is a functional defect in matrix-cell communication rather than a deficiency of
    fibrillin-1. That is the mechanistic separation from Marfan syndrome, which
    arises from reduced functional fibrillin-1 and produces lax connective tissue
    and aortopathy rather than rigid skin. Segmental stiff skin syndrome, the
    localised form, is not associated with FBN1 variants and remains genetically
    unexplained.
  evidence:
  - reference: PMID:31640988
    reference_title: "A disease-associated mutation in fibrillin-1 differentially regulates integrin-mediated cell adhesion."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Fibrillin-1 is a modular glycoprotein that includes 7 latent transforming growth factor β (TGFβ)-binding protein-like (TB) domains and mediates cell adhesion through integrin binding to the RGD motif in its 4th TB domain."
    explanation: >-
      Establishes the domain architecture and the location of the integrin-binding
      motif in which the disease-causing variants sit.
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    The widespread FBN1-associated form is autosomal dominant, arising from
    heterozygous missense variants, with both inherited and de novo cases reported.
    Segmental disease is not inherited in a recognised Mendelian pattern.
treatments:
- name: Physical Therapy and Rehabilitation
  description: >-
    The mainstay, and the only intervention with consistent support across every
    reported series. Stretching, splinting, and mobility work aim to preserve range
    of motion and delay contracture. It is supportive rather than disease-modifying,
    and its evidence base is uncontrolled: everyone uses it and it appears to help.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Physical Therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  evidence:
  - reference: PMID:40551142
    reference_title: "The clinical phenotypes and therapeutic strategies for stiff skin syndrome: a case series with literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients were primarily treated with physical therapy"
    explanation: >-
      Records physiotherapy as the primary treatment actually received across a
      recent case series.
- name: Losartan
  description: >-
    An angiotensin II type 1 receptor blocker that reduces TGF-beta signalling,
    borrowed from Marfan aortopathy and the most mechanistically motivated oral
    agent here. It has supporting data in the right cell type, which most agents in
    this disease lack: patient lesional fibroblasts exposed to losartan show partial
    restoration of normal TGF-beta marker protein levels. Human evidence remains
    anecdotal.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: losartan
      term:
        id: CHEBI:6541
        label: losartan
  target_mechanisms:
  - target: Increased Dermal TGF-beta Signalling
    treatment_effect: INHIBITS
    description: >-
      Reduces TGF-beta signalling in dermal fibroblasts, addressing the node rather
      than the accumulated matrix downstream of it.
    evidence:
    - reference: PMID:32698527
      reference_title: "Pro-Fibrotic Phenotype in a Patient with Segmental Stiff Skin Syndrome via TGF-β Signaling Overactivation."
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: "In vitro exposure of patient's fibroblasts to losartan led to the partial restoration of normal transforming growth factor"
      explanation: >-
        PARTIAL for two reasons stated in the sentence itself: the restoration was
        partial, and the experiment was in vitro in fibroblasts from segmental
        disease rather than in patients with the FBN1-associated form.
  evidence:
  - reference: PMID:40551142
    reference_title: "The clinical phenotypes and therapeutic strategies for stiff skin syndrome: a case series with literature review."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "these treatments are not capable of reversing established skin lesions"
    explanation: >-
      The most careful available statement of what these agents can and cannot do.
      Recorded on this treatment so the limitation travels with the option rather
      than sitting only in prose.
- name: Mycophenolate Mofetil
  description: >-
    An antimetabolite used for its broad antifibrotic and antiproliferative effect.
    Reported with positive response in segmental cases and used in reported cohorts,
    on anecdotal evidence only.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: mycophenolate mofetil
      term:
        id: CHEBI:8764
        label: mycophenolate mofetil
  evidence:
  - reference: PMID:40551142
    reference_title: "The clinical phenotypes and therapeutic strategies for stiff skin syndrome: a case series with literature review."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "there is limited evidence supporting the use of systemic treatment options targeting the transforming growth factor-β or interleukin-17 pathways (such as MMF, losartan, and secukinumab) to slow disease progression"
    explanation: >-
      Names this agent among those with limited supporting evidence for slowing
      progression, which is the honest strength of the claim.
- name: Secukinumab
  description: >-
    An anti-IL-17A monoclonal antibody reported to improve segmental disease in
    isolated cases. Recorded because it is used and reported, not because a
    mechanism connects it to the disease.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:36825671
    reference_title: "Segmental stiff skin syndrome treated with secukinumab."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "we report a patient that showed improvement with anti-IL17 biologic therapy"
    explanation: >-
      A single reported responder, in segmental disease. PARTIAL because one case
      cannot establish efficacy and the mechanistic rationale is unsettled.
  notes: >-
    The mechanistic rationale usually offered for this drug does not survive
    scrutiny and is recorded here rather than repeated. One reported responder
    carried a variant in IL17C, while secukinumab blocks IL-17A. These are different
    cytokines signalling through different receptors, IL-17C acting through IL-17RE,
    so the variant does not explain the response. The drug may still work; the
    proposed link between that variant and that drug is a plausible-sounding leap
    rather than an established mechanism.
animal_models:
- name: Fbn1 W1572C knock-in mouse (stiff skin syndrome substitution)
  species: Mouse
  genotype: Fbn1 knock-in carrying the stiff-skin-syndrome-analogous TB4 substitution
  publication: PMID:24107997
  description: >-
    Knock-in mice carrying the amino acid substitution analogous to the human
    disease variant develop aggressive skin fibrosis. The model is the source of the
    only evidence that established fibrosis can be reversed rather than merely
    prevented, and simultaneously the source of the entry's principal unresolved
    problem, since its immune phenotype has no human counterpart.
  modeled_mechanisms:
  - target: Fibroblast Activation and Matrix Overproduction
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces the aggressive dermal fibrosis of the human disease from the
      equivalent substitution, and supports intervention experiments the human
      disease cannot. Two distinct results emerged, and the verbs matter:
      integrin-modulating therapy PREVENTED the fibrosis, while TGF-beta antagonism
      REVERSED it. The second is the only lead anywhere in this disease pointing at
      regression of established lesions.
    limitations: >-
      The model develops a prominent inflammatory infiltrate and produces
      autoantibodies, neither of which is a feature of human lesional skin, so the
      immune component of the mouse phenotype cannot be assumed to operate in
      patients. Whether the therapeutic responses depend on that immune component is
      therefore unknown, which directly limits how far the prevention and reversal
      results can be translated.
    evidence:
    - reference: PMID:24107997
      reference_title: "Integrin-modulating therapy prevents fibrosis and autoimmunity in mouse models of scleroderma."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "mouse lines harbouring analogous amino acid substitutions in fibrillin-1 recapitulate aggressive skin fibrosis that is prevented by integrin-modulating therapies and reversed by antagonism of the pro-fibrotic cytokine transforming growth factor"
      explanation: >-
        Establishes both that the model reproduces the fibrosis and the distinction
        between prevention by integrin modulation and reversal by TGF-beta
        antagonism.
  evidence:
  - reference: PMID:24107997
    reference_title: "Integrin-modulating therapy prevents fibrosis and autoimmunity in mouse models of scleroderma."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mutant mice show skin infiltration of pro-inflammatory immune cells including plasmacytoid dendritic cells, T helper cells and plasma cells, and also autoantibody production"
    explanation: >-
      Documents the immune phenotype of the model. Curated on the model rather than
      on a pathophysiology node precisely because it has no established human
      counterpart, and it is the substance of the human-model mismatch discussion.
discussions:
- discussion_id: sss_mouse_immune_mismatch
  prompt: >-
    Why is the mouse model of stiff skin syndrome inflammatory and autoantibody
    producing when human lesional skin shows no inflammatory infiltrate at all?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Fibroblast Activation and Matrix Overproduction
  - phenotypes#Absence of inflammatory infiltrate
  rationale: >-
    Evidence exists on both sides and neither is in doubt. The knock-in mouse shows
    dermal infiltration by plasmacytoid dendritic cells, T helper cells, and plasma
    cells, together with autoantibody production. Human lesional histology is
    repeatedly described as bland, with an early study concluding that fibrosis here
    may be independent of inflammation. These do not obviously coexist. Several
    reconciliations are available and none has been tested: the mouse may be
    homozygous or on a permissive background; human biopsies are typically taken
    years into established disease and could miss an early inflammatory window;
    dermal immune surveillance differs between species; or the immune arm may
    genuinely require something mice have and humans do not. This matters beyond
    tidiness, because in the mouse the therapeutic responses were reported alongside
    normalisation of the immune infiltrate, so if that infiltrate is a mouse-specific
    feature, it is unclear what the prevention and reversal results predict for
    patients.
  proposed_experiments:
  - experiment_id: sss_early_lesion_immunophenotyping
    name: Early-lesion biopsy series with immunophenotyping
    description: >-
      Collect skin biopsies from molecularly confirmed patients as early in the
      disease course as ascertainment allows, and immunophenotype them for the cell
      populations reported in the mouse, rather than relying on established-lesion
      histology. If an early inflammatory window exists, this is the only design
      that can see it.
  - experiment_id: sss_single_cell_lesional_skin
    name: Single-cell RNA sequencing of stiff skin syndrome lesional skin
    description: >-
      No single-cell dataset of this disease exists in any public repository.
      Sequencing lesional and non-lesional skin from the same patients would
      establish whether immune populations are present below the threshold of
      histological detection, and would characterise the fibroblast states driving
      the matrix programme.
- discussion_id: sss_tgfb_activity_versus_synthesis
  prompt: >-
    Is TGF-beta signalling in stiff skin syndrome increased through release of
    sequestered latent cytokine rather than through increased synthesis, and does
    that explain why transcript levels appear unchanged?
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - pathophysiology#Increased Dermal TGF-beta Signalling
  rationale: >-
    The proposed mechanism is that loss of integrin engagement releases restraint on
    latent TGF-beta already held in the matrix. If that is right, pathway activity
    should rise while TGF-beta transcription need not change at all. The available
    human data are consistent with exactly that pattern, since lesional fibroblasts
    show nuclear phospho-Smad2 accumulation while an earlier study of lesional skin
    found no difference in TGF-beta transcript. But the two observations come from
    different patients, different forms of the disease, and different assays, so the
    pattern is suggestive rather than demonstrated. Establishing it would matter for
    therapy, because agents that reduce TGF-beta synthesis and agents that block
    signalling would be expected to behave differently.
  proposed_experiments:
  - experiment_id: sss_latent_tgfb_activation_assay
    name: Active versus total TGF-beta in lesional skin and fibroblast matrix
    description: >-
      Measure active and total TGF-beta separately in lesional and control skin, and
      in matrix deposited by patient fibroblasts, alongside transcript levels in the
      same samples. The prediction of the release model is that the ratio of active
      to total rises while transcript stays flat, and that measurement has not been
      made in this disease.
differential_diagnoses:
- name: Systemic sclerosis (scleroderma)
  description: >-
    The main clinical mimic, since both produce hard, bound-down skin.
    Distinguished on multiple axes that are all negative here: no Raynaud
    phenomenon, no sclerodactyly, no nailfold capillary changes, no visceral
    involvement, no autoantibodies, and normal routine laboratory tests. The
    histological distinction is the absence of inflammatory infiltrate.
- name: Marfan syndrome and other fibrillinopathies
  description: >-
    Caused by variants in the same gene, and the contrast is mechanistically
    instructive rather than merely diagnostic. Marfan arises from reduced functional
    fibrillin-1 and produces lax, distensible connective tissue with aortic root
    dilation; the stiff-skin variants leave protein production and microfibril
    assembly intact and abolish integrin binding instead, producing rigid skin
    without reported aortopathy. Same gene, different domain, opposite tissue
    behaviour.
- name: Segmental stiff skin syndrome
  description: >-
    The localised form, in which no FBN1 variant is identified and the genetic basis
    is unknown. It is included here because most of the best downstream mechanistic
    data, including the fibroblast signalling profile and the losartan response,
    were generated in segmental cases, so the boundary matters for how far those
    findings can be generalised to the FBN1-associated disease.
- name: Eosinophilic fasciitis
  description: >-
    Also produces indurated skin with fascial involvement and joint restriction, but
    is inflammatory, typically features peripheral eosinophilia, and often follows
    unaccustomed exertion. Responds to corticosteroids, which this disease does not.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Fewer than a hundred cases have been reported, and no population-based rate
    exists. The literature is composed of case reports and small series, with the
    widespread FBN1-associated form and the segmental form often reported together,
    which further limits what can be said about either separately. Recorded as
    CASES_IN_LITERATURE rather than converted into a rate.
  evidence:
  - reference: PMID:32698527
    reference_title: "Pro-Fibrotic Phenotype in a Patient with Segmental Stiff Skin Syndrome via TGF-β Signaling Overactivation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "an ultrarare and untreatable condition"
    explanation: >-
      Characterises the disease as ultrarare. Cited for that qualitative claim only,
      since no quantitative estimate exists.

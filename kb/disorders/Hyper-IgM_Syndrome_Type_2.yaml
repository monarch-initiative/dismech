name: Hyper-IgM Syndrome Type 2
creation_date: "2026-08-29T00:00:00Z"
category: Mendelian
synonyms:
- HIGM2
- AID deficiency
- AICDA deficiency
- Activation-induced cytidine deaminase deficiency
- Immunoglobulin class switch recombination deficiency 1
description: >-
  Hyper-IgM syndrome type 2 (HIGM2) is a primary antibody deficiency caused by
  biallelic loss-of-function variants in AICDA, encoding activation-induced
  cytidine deaminase (AID). AID is a B-cell-restricted cytidine deaminase
  expressed in germinal center B cells that initiates both immunoglobulin
  class-switch recombination (CSR) and somatic hypermutation (SHM) by
  deaminating cytosine residues in immunoglobulin switch and variable regions.
  Its loss therefore abolishes two distinct arms of antigen-driven antibody
  maturation at once: patients cannot switch from IgM to IgG, IgA, or IgE, and
  cannot introduce the mutations that underpin affinity maturation. The serum
  profile is the diagnostic signature — normal or elevated IgM with absent or
  very low IgG, IgA, and IgE, and normal numbers of circulating B cells.
  Clinically this produces recurrent bacterial sinopulmonary and mucosal
  infection from infancy, together with a hallmark massive lymphoid hyperplasia
  (lymphadenopathy and tonsillar enlargement driven by giant germinal centers)
  that is far more prominent than in most other antibody deficiencies. A
  substantial minority develop autoimmune or inflammatory disease, which is now
  understood mechanistically: AID is independently required for the removal of
  developing autoreactive B cells, so its loss breaches both central and
  peripheral B-cell tolerance.

  SCOPE AND CONTRAST. The defect is strictly B-cell intrinsic. This is the key
  distinction from the CD40L (HIGM1) and CD40 (HIGM3) hyper-IgM syndromes,
  where the same CSR block arises from failed T-cell-to-B-cell licensing and
  the same CD40 pathway is additionally required for macrophage and dendritic
  cell activation. Because T-cell and macrophage effector function is intact in
  AID deficiency, HIGM2 patients are not susceptible to the opportunistic
  infections (Pneumocystis, Cryptosporidium, and other fungal or protozoal
  organisms) that define the CD40L/CD40 forms, and hematopoietic cell
  transplantation is correspondingly not a routine indication. The IUIS 2022
  classification records the same split: AID deficiency sits in Table 3
  (predominantly antibody deficiencies) whereas CD40LG and CD40 deficiency sit
  in Table 1 (combined immunodeficiencies). This entry covers the autosomal
  recessive disease as its primary subject; a rarer autosomal dominant form
  caused by heterozygous C-terminal AICDA variants, in which the CSR defect
  occurs with preserved SHM, is curated here as a distinct genetic and
  inheritance context rather than as a separate entry.

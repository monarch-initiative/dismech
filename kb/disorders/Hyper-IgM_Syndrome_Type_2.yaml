genetic:
- name: AICDA
  notes: >-
    AICDA encodes activation-induced cytidine deaminase. Biallelic
    loss-of-function variants cause the classic autosomal recessive HIGM2, with
    combined loss of class-switch recombination and somatic hypermutation.
    Fifteen distinct mutations were identified in the largest cohort with no
    significant genotype-phenotype correlation.
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: AICDA
    term:
      id: hgnc:13203
      label: AICDA
  association: Causative
  evidence:
  - reference: PMID:11007475
    reference_title: "Activation-induced cytidine deaminase (AID) deficiency causes the autosomal recessive form of the Hyper-IgM syndrome (HIGM2)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We herein report mutations in the human counterpart of AID in patients
      with the autosomal recessive form of hyper-IgM syndrome (HIGM2).
    explanation: >-
      The gene-discovery study identifying AICDA mutations as causative for
      HIGM2.
  - reference: PMID:14962793
    reference_title: "Clinical, immunologic and genetic analysis of 29 patients with autosomal recessive hyper-IgM syndrome due to Activation-Induced Cytidine Deaminase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Fifteen distinct AID mutations were found but there was no significant
      genotype-phenotype correlation.
    explanation: >-
      Documents allelic heterogeneity at AICDA without a genotype-phenotype
      correlation.
- name: AICDA C-terminal heterozygous variants (autosomal dominant HIGM2)
  notes: >-
    Heterozygous nonsense variants affecting the C-terminal region of AID —
    classically R190X, which disrupts the nuclear export signal — cause a
    dominantly inherited form of HIGM2. The C-terminus is dispensable for the
    deaminase activity that drives somatic hypermutation but required for the
    DNA-repair steps specific to class-switch recombination, so these patients
    have a CSR-only defect with preserved SHM. Switch-region double-strand
    breaks are still generated, placing the block downstream of the breaks
    rather than at their creation. This is curated as a distinct genetic
    context of the same disease rather than a separate entry.
  gene_term:
    preferred_term: AICDA
    term:
      id: hgnc:13203
      label: AICDA
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  variants:
  - name: AICDA R190X
    type: nonsense
    description: >-
      Heterozygous C-terminal nonsense variant removing the AID nuclear export
      signal. Causes a class-switch-recombination defect with preserved somatic
      hypermutation, inherited as an autosomal dominant trait.
    gene:
      preferred_term: AICDA

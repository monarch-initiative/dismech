treatments:
- name: Immunoglobulin Replacement Therapy
  description: >-
    Regular intravenous or subcutaneous immunoglobulin replacement is the
    cornerstone of management. It supplies the IgG that patients cannot make
    and produces a marked reduction in infection frequency; early initiation
    may also prevent the lymphoid hyperplasia. It does not correct the
    underlying enzymatic defect.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: immunoglobulin replacement therapy
    term:
      id: NCIT:C62710
      label: Immunoglobulin Therapy
  target_mechanisms:
  - target: Loss of Opsonizing and Mucosal Antibody Function
    treatment_effect: BYPASSES
    description: >-
      Passive IgG supplies the opsonizing antibody the patient cannot generate,
      bypassing rather than repairing the class-switch block.
    evidence:
    - reference: PMID:14962793
      reference_title: "Clinical, immunologic and genetic analysis of 29 patients with autosomal recessive hyper-IgM syndrome due to Activation-Induced Cytidine Deaminase deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        intravenous immunoglobulin (IVIG) replacement therapy resulted in a
        dramatic decrease in the number of infections
      explanation: >-
        IVIG replacement dramatically reduced infections in the cohort,
        confirming it substitutes for the missing antibody function.
  - target: Massive Lymphoid Hyperplasia
    treatment_effect: INHIBITS
    description: >-
      Early-onset immunoglobulin replacement may prevent the lymphoid
      hyperplasia as well as the infections.
    evidence:
    - reference: PMID:14962793
      reference_title: "Clinical, immunologic and genetic analysis of 29 patients with autosomal recessive hyper-IgM syndrome due to Activation-Induced Cytidine Deaminase deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        AID-deficient patients are prone to infections and lymphoid
        hyperplasia, which may be prevented by early-onset IVIG replacement
      explanation: >-
        The authors conclude that early IVIG may prevent lymphoid hyperplasia
        as well as infection; "may" is preserved here as a hedged claim.
  evidence:
  - reference: PMID:36931691
    reference_title: "Type 2 hyper-IgM syndrome with a rare variant of AICDA gene mutation in a young woman."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patient was started on monthly intravenous immunoglobulin replacement
      therapy and is currently symptomatically better
    explanation: >-
      Monthly IVIG is the treatment given to a genetically confirmed HIGM2
      patient, with symptomatic improvement.
- name: Antibiotic Therapy and Prophylaxis
  description: >-
    Antibiotics treat the recurrent bacterial sinopulmonary and mucosal
    infections, and prophylactic regimens are used alongside immunoglobulin
    replacement in patients with continuing infection or established
    bronchiectasis.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: antibiotic therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
  target_mechanisms:
  - target: Recurrent Bacterial Sinopulmonary and Mucosal Infection
    treatment_effect: INHIBITS
    description: >-
      Antibiotics eradicate or suppress the bacterial infections that the
      missing switched antibody cannot prevent or clear.
  notes: >-
    No AID-deficiency-specific antibiotic trial exists; use follows general
    primary-antibody-deficiency practice, so no evidence item is attached to
    this treatment rather than citing a source that does not address HIGM2.
- name: Hematopoietic Cell Transplantation (rarely indicated)
  description: >-
    Unlike the CD40L and CD40 hyper-IgM syndromes — where the combined
    immunodeficiency and its opportunistic infections make transplantation a
    standard consideration — HIGM2 is a B-cell-intrinsic antibody deficiency
    that is generally well controlled by immunoglobulin replacement, and
    transplantation is not a routine indication. This entry records the
    contrast rather than asserting a HIGM2 transplantation indication: in the
    Latin American registry the transplanted patients were CD40L-deficient, and
    all AID-deficient patients were alive on conventional management.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: hematopoietic cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  evidence:
  - reference: PMID:24402618
    reference_title: "First report of the Hyper-IgM syndrome Registry of the Latin American Society for Immunodeficiencies: novel mutations, unique infections, and outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Four CD40L-deficient patients underwent successful bone marrow
      transplantation.
    explanation: >-
      In the registry transplantation was performed in CD40L-deficient
      patients; none of the AID-deficient patients was transplanted, supporting
      the statement that HSCT is not a routine HIGM2 indication.
discussions:
- discussion_id: higm2_population_prevalence_unknown
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - prevalence#Worldwide
  prompt: >-
    What is the population prevalence of AID deficiency, and does it differ
    between populations with high and low rates of consanguinity?
  rationale: >-
    Every published estimate of HIGM2 frequency is a referral-based case count
    rather than a denominator-based rate, so the disease's true prevalence is
    unknown. Because it is autosomal recessive, prevalence should be markedly
    higher in populations with high consanguinity — the original cohorts drew
    heavily on Turkish and Middle Eastern families — but no population-based
    screening study has tested this. Without a denominator it is impossible to
    say what fraction of AID-deficient people are diagnosed, and the
    consistently mild infectious phenotype relative to CD40L deficiency makes
    under-ascertainment plausible.
- discussion_id: higm2_aid_tolerance_direct_or_indirect
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Breakdown of B-Cell Self-Tolerance
  prompt: >-
    Is the tolerance defect in AID deficiency a direct consequence of losing
    deaminase activity in developing B cells, or an indirect consequence of the
    abnormal germinal-center environment?
  rationale: >-
    AID is required for removal of autoreactive B cells at both the central and
    peripheral checkpoints, but the central checkpoint operates in the bone
    marrow, before B cells enter a germinal center and before AID is
    conventionally described as being expressed. Whether the tolerance defect
    reflects a distinct, low-level developmental role for AID or is secondary
    to systemic effects of the failed germinal-center reaction is unresolved,
    and it determines whether autoimmunity in HIGM2 could be predicted from
    genotype or only observed.

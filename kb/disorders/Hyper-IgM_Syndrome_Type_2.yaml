      explanation: >-
        Links AID deficiency to a predisposition to clinical autoimmune disease.
- name: Autoimmune and Inflammatory Disease
  biological_scale: ORGANISM
  description: >-
    A substantial minority of AID-deficient patients develop autoimmune or
    inflammatory disease. The reported spectrum is broad and not confined to
    one organ — autoimmune cytopenias (hemolytic anemia, immune
    thrombocytopenia), polyarthritis, autoimmune hepatitis, type 1 diabetes,
    Crohn's disease, and chronic uveitis have all been described in a single
    cohort.
  evidence:

classifications:
  harrisons_chapter:
  - classification_value: IMMUNE_RHEUMATOLOGIC
    notes: >-
      A primary immunodeficiency; Harrison's covers the primary
      immunodeficiency diseases in the immunology/rheumatology Part.
    evidence:
    - reference: PMID:17560278
      reference_title: "Pathophysiology of B-cell intrinsic immunoglobulin class switch recombination deficiencies."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        B-cell intrinsic immunoglobulin class switch recombination (Ig-CSR)
        deficiencies, previously termed hyper-IgM syndromes, are genetically
        determined conditions characterized by normal or elevated serum IgM
        levels and an absence or very low levels of IgG, IgA, and IgE.
      explanation: >-
        Characterizes the hyper-IgM syndromes as genetically determined
        immunodeficiency disorders, placing HIGM2 in the immunologic Part.
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: >-
      Monogenic autosomal recessive disorder of AICDA.
  iuis_category:
    classification_value: predominantly antibody deficiency
    notes: >-
      IUIS 2022 phenotypic classification Table 3 (predominantly antibody
      deficiencies), section 3 "Severe Reduction in Serum IgG and IgA with
      Normal/Elevated IgM and Normal Numbers of B cells, Hyper IgM". Both the
      autosomal recessive and the autosomal dominant AICDA rows sit in this
      section. NOTE THE CONTRAST: the CD40LG and CD40 hyper-IgM syndromes are
      NOT in Table 3 — IUIS 2022 places them in Table 1 (combined
      immunodeficiencies), because the CD40 pathway defect impairs T-cell and
      macrophage activation as well as B-cell class switching. Curating
      "hyper-IgM syndrome" as a single disease would therefore straddle two
      IUIS tables. The AICDA recessive row in the source PDF is corrupted by
      text extraction — its disease label was lifted onto a later line and its
      OMIM is misprinted as a 7-digit "6055258" (the correct identifier is
      OMIM:605258, confirmed against MONDO:0011528) — so the section heading
      and the label line are quoted here instead of the recessive row itself.
    evidence:
    - reference: PMID:35748970
      reference_title: "Human Inborn Errors of Immunity: 2022 Update on the Classification from the International Union of Immunological Societies Expert Committee."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "3. Severe Reduction in Serum IgG and IgA with Normal/Elevated IgM and Normal Numbers of B cells, Hyper IgM"
      explanation: >-
        The section-3 heading of IUIS 2022 Table 3, the table of predominantly
        antibody deficiencies, defines the hyper-IgM section that contains the
        two AICDA rows ("AID deficiency AICDA", recessive and dominant). The
        heading is quoted rather than the recessive row itself because that row
        is corrupted in the source PDF (see notes).
inheritance:
- name: Autosomal recessive inheritance
  description: >-
    The classic form of HIGM2 is inherited as an autosomal recessive trait,
    caused by mutations affecting both AICDA alleles.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:11007475
    reference_title: "Activation-induced cytidine deaminase (AID) deficiency causes the autosomal recessive form of the Hyper-IgM syndrome (HIGM2)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We herein report mutations in the human counterpart of AID in patients
      with the autosomal recessive form of hyper-IgM syndrome (HIGM2).
    explanation: >-
      The gene-discovery study establishes AICDA mutations as the cause of the
      autosomal recessive form of hyper-IgM syndrome.
  - reference: PMID:15893695
    reference_title: "Analysis of class switch recombination and somatic hypermutation in patients affected with autosomal dominant hyper-IgM syndrome type 2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Autosomal recessive form of hyper-IgM syndrome type 2 (AR-HIGM2) is
      secondary to mutations affecting both alleles of AICDA gene encoding
      activation-induced cytidine deaminase
    explanation: >-
      Confirms that the recessive disease requires mutation of both AICDA
      alleles.
- name: Autosomal dominant inheritance
  description: >-
    A rarer autosomal dominant form (AD-HIGM2) is caused by heterozygous
    variants affecting the C-terminal region of AID, classically the R190X
    nonsense variant. The C-terminus is required for the DNA-repair steps
    specific to class-switch recombination but not for somatic hypermutation,
    so these patients have a variable CSR defect with preserved SHM. IUIS 2022
    Table 3 lists this dominant AICDA form as its own row (OMIM 605257)
    alongside the recessive row, and records that the causal variants localise
    uniquely to the nuclear export signal; those row fragments are too short
    and too corrupted by PDF text extraction to quote as standalone evidence,
    so the published patient series are cited instead.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:15893695
    reference_title: "Analysis of class switch recombination and somatic hypermutation in patients affected with autosomal dominant hyper-IgM syndrome type 2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Variable defect in in vivo CSR inherited as an autosomal dominant (AD)
      trait strongly suggests that this heterozygous AICDA mutation causes
      HIGM (AD-HIGM2).
    explanation: >-
      Establishes a dominantly inherited form of HIGM2 caused by a single
      heterozygous AICDA variant.
  - reference: PMID:32423680
    reference_title: "From Dysgammaglobulinemia to Autosomal-Dominant Activation-Induced Cytidine Deaminase Deficiency: Unraveling an Inherited Immunodeficiency after 50 Years."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The genetic investigation of a family presenting with a dominant form of
      hyper IgM syndrome published in 1963 and 1975 revealed a R190X nonsense
      mutation in activation-induced cytidine deaminase.
    explanation: >-
      An independent kindred with dominantly inherited hyper-IgM syndrome
      resolved to a heterozygous R190X AICDA variant.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population-based prevalence estimate for HIGM2 has been published. The
    disease is known from small international case series: the largest
    dedicated cohort assembled 29 patients from 22 families across multiple
    European and Middle Eastern referral centres. Registry data give a sense of
    its rarity relative to the CD40L form — in the Latin American HIGM registry
    only 2 of 37 molecularly defined hyper-IgM patients had AID deficiency,
    against 35 with CD40L deficiency. Both figures are referral-based counts,
    not denominators, so no rate per 100,000 is asserted here.
  evidence:
  - reference: PMID:14962793
    reference_title: "Clinical, immunologic and genetic analysis of 29 patients with autosomal recessive hyper-IgM syndrome due to Activation-Induced Cytidine Deaminase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We retrospectively analyzed clinical, immunologic and genetic
      characteristics of 29 patients from 22 families with AID deficiency.
    explanation: >-
      The largest dedicated AID-deficiency cohort comprises 29 patients from 22
      families worldwide, consistent with an ultra-rare disease reported as
      case series rather than population rates.
  - reference: PMID:24402618
    reference_title: "First report of the Hyper-IgM syndrome Registry of the Latin American Society for Immunodeficiencies: novel mutations, unique infections, and outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CD40 ligand (CD40L) deficiency was found in 35 patients from 25 families
      and activation-induced cytidine deaminase (AID) deficiency in 2 unrelated
      patients.
    explanation: >-
      In a multinational hyper-IgM registry AID deficiency accounted for only 2
      of 37 genetically defined patients, indicating it is a small minority of
      an already rare syndrome.
pathophysiology:
- name: AID Enzymatic Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Activation-induced cytidine deaminase is a member of the cytidine deaminase
    family whose expression is restricted to germinal center B cells. It
    initiates antibody diversification by deaminating cytosine to uracil in
    single-stranded DNA at the immunoglobulin switch and variable regions,
    creating the U:G mismatches that downstream repair pathways convert into
    either switch-region double-strand breaks or point mutations. Biallelic
    loss-of-function AICDA variants abolish this enzymatic activity, removing
    the single upstream trigger for both antibody-diversification programs.
  cell_types:
  - preferred_term: Germinal center B cell
    term:
      id: CL:0000844
      label: germinal center B cell
  molecular_functions:
  - preferred_term: cytidine deaminase activity
    term:
      id: GO:0004126
      label: cytidine deaminase activity
    modifier: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:11007475
    reference_title: "Activation-induced cytidine deaminase (AID) deficiency causes the autosomal recessive form of the Hyper-IgM syndrome (HIGM2)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The activation-induced cytidine deaminase (AID) gene, specifically
      expressed in germinal center B cells in mice, is a member of the cytidine
      deaminase family.
    explanation: >-
      Identifies AID as a germinal-center-B-cell-restricted cytidine deaminase,
      grounding the enzymatic activity and cell type of this node.
  downstream:
  - target: Failed Immunoglobulin Class-Switch Recombination
    causal_link_type: DIRECT
    description: >-
      Without AID-mediated deamination of switch regions, the DNA lesions that
      initiate class-switch recombination are never generated.
    evidence:
    - reference: PMID:11007475
      reference_title: "Activation-induced cytidine deaminase (AID) deficiency causes the autosomal recessive form of the Hyper-IgM syndrome (HIGM2)."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Three major abnormalities characterize AID deficiency: (1) the absence
        of immunoglobulin class switch recombination
      explanation: >-
        Absence of class-switch recombination is listed as the first cardinal
        abnormality caused by AID deficiency.
  - target: Failed Somatic Hypermutation
    causal_link_type: DIRECT
    description: >-
      The same deamination step seeds the point mutations of somatic
      hypermutation in immunoglobulin variable regions, so SHM fails in
      parallel with CSR rather than as a consequence of it.
    evidence:
    - reference: PMID:11007475
      reference_title: "Activation-induced cytidine deaminase (AID) deficiency causes the autosomal recessive form of the Hyper-IgM syndrome (HIGM2)."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "(2) the lack of immunoglobulin somatic hypermutations"
      explanation: >-
        Lack of somatic hypermutation is the second cardinal abnormality of AID
        deficiency, establishing it as a parallel consequence of enzyme loss.
- name: Failed Immunoglobulin Class-Switch Recombination
  biological_scale: MOLECULAR
  description: >-
    Class-switch recombination replaces the IgM/IgD constant region with a
    downstream constant region, converting a naive B cell's output to IgG, IgA,
    or IgE without altering antigen specificity. In AID deficiency this
    recombination does not occur. The block is B-cell intrinsic: germline
    switch transcripts are still produced and the upstream T-cell help signal
    is intact, so the lesion lies at the DNA-modification step itself.
  cell_types:
  - preferred_term: Germinal center B cell
    term:
      id: CL:0000844
      label: germinal center B cell
  biological_processes:
  - preferred_term: Immunoglobulin isotype switching
    term:
      id: GO:0045190
      label: isotype switching
    modifier: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:11007474
    reference_title: "Class switch recombination and hypermutation require activation-induced cytidine deaminase (AID), a potential RNA editing enzyme."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      AID-/- spleen cells stimulated in vitro with LPS and cytokines failed to
      undergo class switch recombination although they expressed germline
      transcripts.
    explanation: >-
      The AID-knockout mouse shows the switch block is at the recombination
      step itself, downstream of germline transcription — evidence from a model
      organism that defines where in the pathway the lesion sits.
  - reference: PMID:17560278
    reference_title: "Pathophysiology of B-cell intrinsic immunoglobulin class switch recombination deficiencies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      the description of the activation-induced cytidine deaminase (AID)
      deficiency (Ig-CSR deficiency 1), caused by recessive mutations of AICDA
      gene, characterized by a defect in CSR and SHM
    explanation: >-
      A review of the CSR deficiencies characterizes recessive AICDA mutation
      as producing a combined CSR and SHM defect.
  downstream:
  - target: IgM-Restricted Antibody Repertoire
    causal_link_type: DIRECT
    description: >-
      With switching blocked, plasma cells can only secrete the IgM isotype
      encoded by the unrearranged constant region.
    evidence:
    - reference: PMID:17560278
      reference_title: "Pathophysiology of B-cell intrinsic immunoglobulin class switch recombination deficiencies."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        characterized by normal or elevated serum IgM levels and an absence or
        very low levels of IgG, IgA, and IgE
      explanation: >-
        The failure to switch produces exactly this serum profile — retained
        IgM with loss of the switched isotypes.
  - target: Giant Germinal Center Formation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      B cells that cannot complete the switching program continue to be
      stimulated and re-enter the germinal center reaction instead of exiting
      it as switched memory or plasma cells, so germinal centers enlarge rather
      than resolve.
    evidence:
    - reference: PMID:11007474
      reference_title: "Class switch recombination and hypermutation require activation-induced cytidine deaminase (AID), a potential RNA editing enzyme."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        AID deficiency caused a complete defect in class switching and showed a
        hyper-IgM phenotype with enlarged germinal centers containing strongly
        activated B cells before or after immunization.
      explanation: >-
        In AID-deficient mice the switching defect is accompanied by enlarged
        germinal centers holding strongly activated B cells, linking the failed
        switch to germinal-center overgrowth.
- name: Failed Somatic Hypermutation
  biological_scale: MOLECULAR
  description: >-
    Somatic hypermutation introduces point mutations into immunoglobulin
    variable-region genes, generating the sequence variation on which
    affinity-based selection acts in the germinal center. AID deficiency
    abolishes it. Memory B cells are still generated in normal numbers but
    carry unmutated variable regions. This arm is independent of the CSR arm:
    C-terminal AICDA variants can spare it while still blocking CSR.
  cell_types:
  - preferred_term: Germinal center B cell
    term:
      id: CL:0000844
      label: germinal center B cell
  - preferred_term: Memory B cell
    term:
      id: CL:0000787
      label: memory B cell
  biological_processes:
  - preferred_term: Somatic hypermutation of immunoglobulin genes
    term:
      id: GO:0016446
      label: somatic hypermutation of immunoglobulin genes
    modifier: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:35748970
    reference_title: "Human Inborn Errors of Immunity: 2022 Update on the Classification from the International Union of Immunological Societies Expert Committee."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "memory B cells but lacking"
    explanation: >-
      The IUIS Table 3 immunologic column for the recessive AICDA row records
      normal memory B cells that nonetheless lack somatic hypermutation.
  - reference: PMID:11007474
    reference_title: "Class switch recombination and hypermutation require activation-induced cytidine deaminase (AID), a potential RNA editing enzyme."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Immunization of AID-/- chimera with 4-hydroxy-3-nitrophenylacetyl (NP)
      chicken gamma-globulin induced neither accumulation of mutations in the
      NP-specific variable region gene nor class switching.
    explanation: >-
      Antigen challenge of AID-deficient mice produced no variable-region
      mutation, demonstrating that AID is required for somatic hypermutation
      in vivo.
  downstream:
  - target: Absent Affinity Maturation
    causal_link_type: DIRECT
    description: >-
      Without variable-region mutation there is no sequence variation for
      germinal-center selection to act on, so antibody affinity cannot improve
      with successive antigen exposure.
    evidence:
    - reference: PMID:11007475
      reference_title: "Activation-induced cytidine deaminase (AID) deficiency causes the autosomal recessive form of the Hyper-IgM syndrome (HIGM2)."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        demonstrates the absolute requirement for AID in several crucial steps
        of B cell terminal differentiation necessary for efficient antibody
        responses
      explanation: >-
        AID is required for the terminal B-cell differentiation steps that
        produce efficient antibody responses, of which affinity maturation is
        one.
  - target: Breakdown of B-Cell Self-Tolerance
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Beyond diversification, AID is separately required to purge developing
      autoreactive B cells. Its loss leaves an abnormal repertoire enriched for
      self-reactive specificities at both the central and peripheral tolerance
      checkpoints.
    evidence:
    - reference: PMID:21700883
      reference_title: "Activation-induced cytidine deaminase (AID) is required for B-cell tolerance in humans."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        New emigrant/transitional and mature naive B cells from AID-deficient
        patients express an abnormal Ig repertoire and high frequencies of
        autoreactive antibodies, demonstrating that AID is required for the
        establishment of both central and peripheral B-cell tolerance.
      explanation: >-
        Single-cell antibody cloning from AID-deficient patients shows loss of
        both tolerance checkpoints, linking the enzyme defect to autoreactivity.
- name: IgM-Restricted Antibody Repertoire
  biological_scale: ORGANISM
  description: >-
    The systemic consequence of the switching block is a humoral compartment
    that produces only IgM. Serum IgM is normal or elevated — partly because
    unswitched B cells continue to be driven by antigen — while IgG, IgA, and
    IgE are absent or very low. Circulating B-cell numbers are normal, which
    distinguishes HIGM2 from the agammaglobulinemias, where the lesion is a
    developmental block upstream of B-cell egress.
  cell_types:
  - preferred_term: Plasma cell
    term:
      id: CL:0000786
      label: plasma cell
  - preferred_term: B cell
    term:
      id: CL:0000236
      label: B cell
  biological_processes:
  - preferred_term: Immunoglobulin production
    term:
      id: GO:0002377
      label: immunoglobulin production
    modifier: DECREASED
  evidence:
  - reference: PMID:35748970
    reference_title: "Human Inborn Errors of Immunity: 2022 Update on the Classification from the International Union of Immunological Societies Expert Committee."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "3. Severe Reduction in Serum IgG and IgA with Normal/Elevated IgM and Normal Numbers of B cells, Hyper IgM"
    explanation: >-
      The IUIS section heading defining this disease group states the exact
      composition of this node: severely reduced IgG and IgA, normal or
      elevated IgM, and normal numbers of circulating B cells.
  - reference: PMID:36931691
    reference_title: "Type 2 hyper-IgM syndrome with a rare variant of AICDA gene mutation in a young woman."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Blood investigations revealed increased IgM levels with reduced IgG, IgA
      and IgE levels.
    explanation: >-
      A genetically confirmed HIGM2 patient shows the characteristic isotype
      profile of raised IgM with all three switched isotypes reduced.
  downstream:
  - target: Loss of Opsonizing and Mucosal Antibody Function
    causal_link_type: DIRECT
    description: >-
      IgM is a poor opsonin relative to IgG and cannot be transported across
      mucosal epithelium in place of secretory IgA, so an IgM-only repertoire
      cannot perform the effector functions those isotypes provide.
    evidence:
    - reference: PMID:17560278
      reference_title: "Pathophysiology of B-cell intrinsic immunoglobulin class switch recombination deficiencies."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        CSR and SHM, the major events of antigen-triggered antibody maturation
      explanation: >-
        CSR and SHM are identified as the major events of antibody maturation,
        so losing both leaves antibody function immature and ineffective.
- name: Absent Affinity Maturation
  biological_scale: CELLULAR
  description: >-
    Memory B cells are produced but their variable regions remain in germline
    configuration, so the antibody repertoire never improves in affinity across
    repeated antigen encounters. Secondary responses are therefore no better
    than primary ones, compounding the isotype deficit.
  cell_types:
  - preferred_term: Memory B cell
    term:
      id: CL:0000787
      label: memory B cell
  biological_processes:
  - preferred_term: Somatic hypermutation of immunoglobulin genes
    term:
      id: GO:0016446
      label: somatic hypermutation of immunoglobulin genes
    modifier: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:11007475
    reference_title: "Activation-induced cytidine deaminase (AID) deficiency causes the autosomal recessive form of the Hyper-IgM syndrome (HIGM2)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The phenotype observed in HIGM2 patients (and in AID-/- mice)
      demonstrates the absolute requirement for AID in several crucial steps of
      B cell terminal differentiation necessary for efficient antibody
      responses.
    explanation: >-
      AID is required for the terminal B-cell differentiation steps underlying
      efficient antibody responses; affinity maturation is the step this node
      represents.
  downstream:
  - target: Loss of Opsonizing and Mucosal Antibody Function
    causal_link_type: DIRECT
    description: >-
      Low-affinity germline-encoded antibody binds pathogens poorly, further
      degrading the protective quality of the residual IgM response.
- name: Loss of Opsonizing and Mucosal Antibody Function
  biological_scale: ORGANISM
  description: >-
    The two arms converge here. The patient retains antibody, but it is of the
    wrong isotype and of germline affinity: no IgG to opsonize encapsulated
    bacteria and fix complement efficiently in tissue, no secretory IgA to
    exclude organisms at respiratory and gastrointestinal mucosal surfaces, and
    no affinity-matured binding to compensate. Humoral protection against
    extracellular bacteria is therefore lost, while cellular immunity is
    untouched.
  biological_processes:
  - preferred_term: Complement activation and opsonization by antibody
    term:
      id: GO:0006956
      label: complement activation
    modifier: DECREASED
  evidence:
  - reference: PMID:14962793
    reference_title: "Clinical, immunologic and genetic analysis of 29 patients with autosomal recessive hyper-IgM syndrome due to Activation-Induced Cytidine Deaminase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most patients had suffered from recurrent and severe infections, however,
      intravenous immunoglobulin (IVIG) replacement therapy resulted in a
      dramatic decrease in the number of infections.
    explanation: >-
      That replacing IgG largely abolishes the infections demonstrates the
      infections are caused by the missing antibody function rather than by any
      cellular defect.
  downstream:
  - target: Recurrent Bacterial Sinopulmonary and Mucosal Infection
    causal_link_type: DIRECT
    description: >-
      Absent opsonizing and mucosal antibody permits recurrent infection by
      extracellular and encapsulated bacteria at respiratory and
      gastrointestinal surfaces.
    evidence:
    - reference: PMID:35748970
      reference_title: "Human Inborn Errors of Immunity: 2022 Update on the Classification from the International Union of Immunological Societies Expert Committee."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Bacterial infections, enlarged lymph nodes and"
      explanation: >-
        The IUIS Table 3 associated-features column for AID deficiency lists
        bacterial infections as the cardinal clinical consequence.
- name: Recurrent Bacterial Sinopulmonary and Mucosal Infection
  biological_scale: ORGANISM
  description: >-
    Clinically the infections are bacterial and mucosal — recurrent sinusitis,
    otitis media, and pneumonia progressing to bronchiectasis, with
    gastrointestinal involvement. The spectrum is narrower than in the
    CD40L/CD40 hyper-IgM syndromes: because AID acts only in B cells and leaves
    T-cell and macrophage effector function intact, HIGM2 patients do not show
    the Pneumocystis, Cryptosporidium, and other opportunistic infections that
    characterize the CD40 pathway defects. Immunoglobulin replacement markedly
    reduces infection frequency.
  evidence:
  - reference: PMID:24402618
    reference_title: "First report of the Hyper-IgM syndrome Registry of the Latin American Society for Immunodeficiencies: novel mutations, unique infections, and outcomes."

- name: Giant Germinal Center Formation
  biological_scale: TISSUE
  description: >-
    The histological hallmark of AID deficiency. B cells that cannot complete
    the diversification program are repeatedly restimulated and re-enter the
    germinal center rather than exiting as switched or affinity-matured
    progeny. Germinal centers consequently become greatly enlarged and are
    packed with strongly activated B cells — the "giant germinal centers"
    described in the original report and reproduced in AID-null mice.
  cell_types:
  - preferred_term: Germinal center B cell
    term:
      id: CL:0000844
      label: germinal center B cell
  biological_processes:
  - preferred_term: Germinal center formation
    term:
      id: GO:0002467
      label: germinal center formation
    modifier: INCREASED
  evidence:
  - reference: PMID:11007475
    reference_title: "Activation-induced cytidine deaminase (AID) deficiency causes the autosomal recessive form of the Hyper-IgM syndrome (HIGM2)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      lymph node hyperplasia caused by the presence of giant germinal centers
    explanation: >-
      Names giant germinal centers as the third cardinal abnormality of AID
      deficiency and as the cause of the lymph node hyperplasia.
  downstream:
  - target: Massive Lymphoid Hyperplasia
    causal_link_type: DIRECT
    description: >-
      Enlargement of germinal centers throughout secondary lymphoid tissue
      produces clinically apparent lymph node and tonsillar enlargement.
    evidence:
    - reference: PMID:11007475
      reference_title: "Activation-induced cytidine deaminase (AID) deficiency causes the autosomal recessive form of the Hyper-IgM syndrome (HIGM2)."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        lymph node hyperplasia caused by the presence of giant germinal centers
      explanation: >-
        States the causal relation directly: the giant germinal centers are
        what produce the lymph node hyperplasia.
- name: Massive Lymphoid Hyperplasia
  biological_scale: ORGANISM
  description: >-
    Generalized enlargement of secondary lymphoid tissue — lymphadenopathy and
    tonsillar enlargement — is present in the majority of patients and is
    disproportionate to that seen in other primary antibody deficiencies. It
    can regress on immunoglobulin replacement but persists in a minority.
  evidence:
  - reference: PMID:14962793
    reference_title: "Clinical, immunologic and genetic analysis of 29 patients with autosomal recessive hyper-IgM syndrome due to Activation-Induced Cytidine Deaminase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Lymphoid hyperplasia developed in 22 patients and persisted in 7 at last
      follow-up.
    explanation: >-
      Quantifies lymphoid hyperplasia in 22 of the 29-patient cohort, and shows
      that it resolves in most but persists in some.
- name: Breakdown of B-Cell Self-Tolerance
  biological_scale: CELLULAR
  description: >-
    AID has a role in B-cell tolerance that is separable from its
    diversification role. In AID-deficient patients both the central checkpoint
    (new emigrant/transitional B cells) and the peripheral checkpoint (mature
    naive B cells) fail to remove autoreactive clones, and anti-nuclear IgM is
    detectable in serum. This provides the mechanistic explanation for the
    autoimmunity seen in a disease that is otherwise one of immune deficiency.
  cell_types:
  - preferred_term: B cell
    term:
      id: CL:0000236
      label: B cell
  biological_processes:
  - preferred_term: B cell tolerance induction
    term:
      id: GO:0002514
      label: B cell tolerance induction
    modifier: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:21700883
    reference_title: "Activation-induced cytidine deaminase (AID) is required for B-cell tolerance in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      B-cell tolerance was further breached in AID-deficient patients as
      illustrated by the detection of anti-nuclear IgM antibodies in the serum
      of all patients.
    explanation: >-
      Anti-nuclear IgM in all patients tested demonstrates a breached tolerance
      checkpoint in human AID deficiency.
  downstream:
  - target: Autoimmune and Inflammatory Disease
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Retained autoreactive B-cell clones provide the substrate from which
      clinical autoimmune and inflammatory disease develops in a substantial
      minority of patients.
    evidence:
    - reference: PMID:21700883
      reference_title: "Activation-induced cytidine deaminase (AID) is required for B-cell tolerance in humans."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        patients with hyper-IgM syndromes who are deficient in
        activation-induced cytidine deaminase (AID), which is required for

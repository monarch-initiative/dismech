- name: Multimodal Ophthalmic Examination and Ocular Ultrasonography
  description: >-
    Primary clinical diagnosis relies on slit-lamp biomicroscopy, indirect
    ophthalmoscopy/fundus photography, and A/B-scan ocular ultrasonography to
    characterize tumor location, apical thickness, largest basal diameter, and
    associated exudative retinal detachment.
  diagnosis_term:
    preferred_term: ultrasound imaging
    term:
      id: NCIT:C17230
      label: Ultrasound Imaging
  evidence:
  - reference: DOI:10.1007/s00432-021-03851-9
    reference_title: "Vasculogenic mimicry correlates to presenting symptoms and mortality in uveal melanoma"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The tumor eye had also been examined with slit lamp biomicroscopy, ultrasonography, and fundus photography. The tumor's ... thickness, largest basal diameter (LBD), and location in the choroid had been noted."
    explanation: Documents multimodal ophthalmic evaluation with slit-lamp biomicroscopy, ocular ultrasonography, and fundus photography for primary tumor measurement and staging.
- name: Tumor Biopsy and Molecular Prognostic Profiling (15-GEP, PRAME, and Driver Panel)
  description: >-
    Fine-needle or incisional transscleral/transretinal tumor biopsy (or
    enucleation tissue) enables cytogenetic chromosome 3/8q analysis, somatic
    mutation profiling (BAP1, SF3B1, EIF1AX), and prospective metastatic risk
    stratification via the integrated 15-gene expression profile (15-GEP) and
    PRAME RNA classifier.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: DOI:10.1200/jco.24.00447
    reference_title: "15-Gene Expression Profile and <i>PRAME</i> as Integrated Prognostic Test for Uveal Melanoma: First Report of Collaborative Ocular Oncology Group Study No. 2 (COOG2.1)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "By multivariable Cox proportional hazards analysis, 15-GEP was the most important independent predictor of MFS (hazard ratio [HR], 5.95 [95% CI, 4.43 to 7.99]; P < .001), followed by PRAME status (HR, 1.82 [95% CI, 1.42 to 2.33]; P < .001)."
    explanation: Prospective COOG2 multicenter study validating integrated 15-GEP and PRAME testing as independent predictors of metastasis-free survival.
  - reference: PMID:23877823
    reference_title: "[Uveal melanoma: current insights into clinical relevance of genetic testing]."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "If a patient wishes to know about his individual risk, prognostic testing of the primary tumour tissue can be performed after obtaining tumour material via transscleral or transretinal biopsy, or by enucleation."
    explanation: Describes tissue acquisition via transscleral/transretinal biopsy or enucleation for molecular prognostic testing.
- name: Hepatic Metastatic Surveillance Imaging
  description: >-
    Risk-adapted post-treatment systemic surveillance with liver-focused imaging
    (contrast-enhanced abdominal MRI or CT, or hepatic ultrasonography) detects
    metastatic liver disease, stratified by molecular class (15-GEP and PRAME).
  diagnosis_term:
    preferred_term: diagnostic imaging
    term:
      id: NCIT:C16502
      label: Diagnostic Imaging Testing
  evidence:
  - reference: DOI:10.3390/cancers18010121
    reference_title: "Metastatic Uveal Melanoma Surveillance: A Delphi Panel Consensus"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "A multidisciplinary steering committee developed statements addressing risk-based surveillance using both molecular and clinical prognostic factors, including gene expression profiling (GEP) and PRAME status."
    explanation: Multidisciplinary Delphi consensus establishing molecular risk-adapted imaging surveillance for metastatic uveal melanoma.
  - reference: DOI:10.1007/s00432-021-03851-9
    reference_title: "Vasculogenic mimicry correlates to presenting symptoms and mortality in uveal melanoma"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "After diagnosis, patients underwent radiological screening for metastases either with a combination of chest X-ray and an ultrasonography of the liver, or by computed ... (CT) of the chest and abdomen."
    explanation: Documents baseline and longitudinal hepatic radiological screening after primary uveal melanoma diagnosis.
treatments:
- name: Tebentafusp
  description: >-
    Bispecific gp100xCD3 ImmTAC fusion protein that binds an HLA-A*02:01-restricted
    gp100 peptide on uveal melanoma cells and CD3 on T cells, redirecting
    polyclonal T cells to lyse tumor cells. First systemic therapy demonstrated
    to improve overall survival in HLA-A*02:01-positive adults with unresectable
    or metastatic uveal melanoma.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: tebentafusp
      term:
        id: NCIT:C94208
        label: Tebentafusp
  target_mechanisms:
  - target: Hepatic Metastatic Colonization
    treatment_effect: INHIBITS
    description: Redirects CD3+ T cells against gp100/HLA-A*02:01-expressing metastatic uveal melanoma cells, overcoming low endogenous immunogenicity.
  target_phenotypes:
  - preferred_term: Hepatic Metastasis
    term:
      id: HP:0002896
      label: Neoplasm of the liver
  evidence:
  - reference: DOI:10.1136/jitc-2024-009028
    reference_title: "Long-term survival follow-up for tebentafusp in previously treated metastatic uveal melanoma"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Tebentafusp, a bispecific (gp100×CD3) ImmTAC, significantly improved overall survival (OS) outcomes for HLA-A*02:01+ adult patients with untreated metastatic uveal melanoma (mUM) and showed promising survival in previously treated mUM with 1-year OS of 62% in the primary analysis of study IMCgp100-102."
    explanation: Establishes tebentafusp's gp100xCD3 mechanism and overall survival benefit in HLA-A*02:01-positive metastatic uveal melanoma.
  - reference: DOI:10.1136/jitc-2024-009028
    reference_title: "Long-term survival follow-up for tebentafusp in previously treated metastatic uveal melanoma"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "146 patients were treated with tebentafusp: 19 in phase 1 and 127 in phase 2. With a median follow-up duration of 48.5 months, the median OS was 17.4 months (95% CI, 13.1 to 22.8), and the 1-year, 2-year, 3-year and 4-year OS rates were 62%, 40%, 23% and 14%, respectively."
    explanation: Long-term phase 1/2 follow-up demonstrating durable multi-year survival with tebentafusp in previously treated metastatic uveal melanoma.
- name: Plaque Brachytherapy
  description: >-
    Globe-sparing episcleral radiation therapy using a radioactive plaque
    (such as iodine-125 or ruthenium-106) sutured to the sclera overlying the
    tumor. Standard first-line local therapy for small- and medium-sized uveal
    melanomas, achieving survival equivalent to enucleation while preserving the
    eye.
  therapeutic_modality: RADIOTHERAPY
  treatment_term:
    preferred_term: brachytherapy
    term:
      id: NCIT:C15195
      label: Brachytherapy
  target_mechanisms:
  - target: Uncontrolled Uveal Melanocyte Proliferation
    treatment_effect: INHIBITS
    description: Delivers localized ionizing radiation to arrest proliferation and ablate primary intraocular tumor cells.
  target_phenotypes:
  - preferred_term: Uveal Melanoma
    term:
      id: HP:0007716
      label: Uveal melanoma
  evidence:
  - reference: DOI:10.3390/cancers16051074
    reference_title: "Current and Emerging Radiotherapy Options for Uveal Melanoma"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "A randomized, prospective, multi-institutional clinical trial (COMS) showed no difference in survival between brachytherapy and enucleation for medium-sized lesions."
    explanation: Summarizes the Collaborative Ocular Melanoma Study trial establishing episcleral plaque brachytherapy as survival-equivalent to enucleation for medium-sized tumors.
- name: Proton Beam Therapy
  description: >-
    Charged-particle external-beam radiotherapy providing a rapid Bragg-peak
    dose fall-off that achieves high local control while sparing adjacent
    critical structures, particularly advantageous for thicker tumors (>8 mm) or
    lesions close to the optic nerve.
  therapeutic_modality: RADIOTHERAPY
  treatment_term:
    preferred_term: proton beam radiation therapy
    term:
      id: NCIT:C66897
      label: Proton Beam Radiation Therapy
  target_mechanisms:
  - target: Uncontrolled Uveal Melanocyte Proliferation
    treatment_effect: INHIBITS
    description: Charged-particle irradiation ablates proliferating primary uveal melanoma cells with sharp dose fall-off.
  target_phenotypes:
  - preferred_term: Uveal Melanoma
    term:
      id: HP:0007716
      label: Uveal melanoma
  evidence:
  - reference: DOI:10.3390/cancers16203497
    reference_title: "Proton Therapy in Uveal Melanoma"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Proton therapy offers significant advantages for thicker uveal melanomas (over 8 mm) due to its unique physical properties, including a rapid dose fall-off that protects critical structures like the retina and optic nerve."
    explanation: Establishes proton beam radiotherapy for localized uveal melanoma, especially large or juxtapapillary tumors.
- name: Enucleation
  description: >-
    Surgical removal of the globe, indicated for very large tumors, extensive
    optic nerve or extraocular invasion, blind painful eyes, or local progression
    after globe-sparing radiotherapy. Provides definitive local control without
    preventing preexisting micrometastatic spread.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: eye enucleation
    term:
      id: NCIT:C198837
      label: Eye Enucleation
  target_mechanisms:
  - target: Uncontrolled Uveal Melanocyte Proliferation
    treatment_effect: INHIBITS

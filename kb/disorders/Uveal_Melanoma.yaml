- category: Hepatic
  name: Hepatic Metastasis
  frequency: FREQUENT
  description: >-
    Secondary malignant involvement of the liver develops in up to 50% of
    patients despite local ocular tumor control and represents the predominant
    site of metastatic spread and disease-related mortality.
  phenotype_term:
    preferred_term: Neoplasm of the liver
    term:
      id: HP:0002896
      label: Neoplasm of the liver
  evidence:

    reference_title: "Proton Therapy in Uveal Melanoma"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Treatment options for localized, early-stage disease include enucleation, brachytherapy, and proton beam therapy."
    explanation: Establishes surgical enucleation alongside brachytherapy and proton beam therapy as definitive primary local treatment.
- name: Immune Checkpoint Inhibitors
  description: >-
    Anti-PD-1 and anti-CTLA-4 monoclonal antibodies have low single-agent
    response rates (0-3.6%) in unselected metastatic uveal melanoma due to low
    mutational burden and an immunosuppressive liver microenvironment, whereas
    dual ipilimumab plus nivolumab achieves modest activity (~11.5-18% response
    rate) and MBD4-deficient hypermutated tumors show exceptional sensitivity to
    PD-1 blockade.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: immunotherapy
    term:
      id: NCIT:C15262
      label: Immunotherapy
    therapeutic_agent:
    - preferred_term: ipilimumab
      term:
        id: NCIT:C2654
        label: Ipilimumab
    - preferred_term: nivolumab
      term:
        id: NCIT:C68814
        label: Nivolumab
    - preferred_term: pembrolizumab
      term:
        id: NCIT:C106432
        label: Pembrolizumab
  target_mechanisms:
  - target: Hepatic Metastatic Colonization
    treatment_effect: INHIBITS
    description: Blocks CTLA-4 and PD-1 inhibitory checkpoints to promote T-cell-mediated anti-tumor responses against hepatic metastases.
  - target: CpG-to-TpG Hypermutation
    treatment_effect: MODULATES
    description: Exploits the high CpG>TpG neoantigenic mutational load of MBD4-deficient uveal melanomas to induce T-cell-mediated tumor regression under PD-1 blockade.
    evidence:
    - reference: PMID:29760383
      reference_title: "Outlier response to anti-PD1 in uveal melanoma reveals germline MBD4 mutations in hypermutated tumors."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Hence, while the limited activity of PD1inh in UM patients may be explained by a low mutation burden, the MBD4-related high mutation load probably contributed to the dramatic response in the UVM_IC patient."
      explanation: Connects the MBD4-related CpG>TpG hypermutator load directly to sensitivity to PD-1 checkpoint blockade in metastatic uveal melanoma.
  target_phenotypes:
  - preferred_term: Hepatic Metastasis
    term:
      id: HP:0002896
      label: Neoplasm of the liver
  evidence:
  - reference: DOI:10.1007/s10238-024-01497-8
    reference_title: "Immunotherapy response and resistance in patients with advanced uveal melanoma: a retrospective cohort study"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Clinical trials of single-agent immune checkpoint ... (ICIs) have demonstrated low overall response rates (ORR) of 0-3.6% and mOS between 6.8 and 7.6 months for single-agent ipilimumab and anti-PD1, respectively"
    explanation: Background summary in a clinical cohort study quantifying the limited single-agent efficacy of ipilimumab and anti-PD-1 therapy in unselected metastatic uveal melanoma.
  - reference: DOI:10.1007/s10238-024-01497-8
    reference_title: "Immunotherapy response and resistance in patients with advanced uveal melanoma: a retrospective cohort study"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "in a small phase II study of 35 patients with mUM, systemic treatment with ipilimumab/nivolumab yielded an ORR of 18% with median ... survival (mPFS) of 5.5 months (95% CI 3.4-9.5 months) and mOS 19.1 months (95% CI 9.6-NR months)"
    explanation: Background summary in a clinical cohort study reporting phase II activity of combined ipilimumab plus nivolumab in metastatic uveal melanoma.
  - reference: PMID:29760383
    reference_title: "Outlier response to anti-PD1 in uveal melanoma reveals germline MBD4 mutations in hypermutated tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we present a metastatic uveal melanoma patient with an exceptional high sensitivity to a PD-1 inhibitor associated with outlier CpG>TpG mutation burden, MBD4 germline deleterious mutation, and somatic MBD4 inactivation in the tumor."
    explanation: Establishes outlier sensitivity to PD-1 checkpoint blockade (pembrolizumab) in MBD4-deficient hypermutated metastatic uveal melanoma.

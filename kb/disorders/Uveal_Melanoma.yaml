  association: Somatic Oncogenic Mutation
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  notes: >-
    Most common initiating somatic driver mutation in uveal melanoma (~45-50% of
    cases). Hotspot Q209L/Q209P and R183 mutations lock the Gq alpha subunit in
    an active GTP-bound state by disrupting GTPase activity.
  evidence:
  - reference: PMID:23877823
    reference_title: "[Uveal melanoma: current insights into clinical relevance of genetic testing]."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Recently, major key genes involved in uveal melanoma development, GNAQ, GNA11, BAP1, SF3B1 and EIF1AX, have been identified."
    explanation: Establishes GNAQ as a recurrent somatic driver gene in uveal melanoma.
  - reference: PMID:26778290
    reference_title: "Mosaic Activating Mutations in GNA11 and GNAQ Are Associated with Phakomatosis Pigmentovascularis and Extensive Dermal Melanocytosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Somatic mutations in GNAQ are frequent in uveal melanoma and single blue nevi (Van Raamsdonk et al., 2009)."
    explanation: Confirms frequent somatic GNAQ mutations in uveal melanoma.

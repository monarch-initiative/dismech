- accession: massive:MSV000087437
  title: Proteomics of Primary Uveal Melanoma:Insights to Metastasis and Protein Biomarkers
  description: Uveal melanoma metastases are lethal and remain incurable. Quantitative proteomic analysis of 53 metastasizing and 47 non-metastasizing primary uveal melanoma (pUM) was pursued for insights into UM metastasis and protein biomarkers. The metastatic status of the pUM specimens was defined based on clinical data, survival histories, prognostic analyses, and liver histopathology.
  notes: Located via OmicsDI, which aggregates across omics repositories; this record comes from massive. Only repositories with no other discovery route in this project and with a working accession resolver are curated from OmicsDI -- GEO, ArrayExpress, PRIDE, MetaboLights and EGA hits are excluded as duplicates of dedicated passes. Matched because the disease is named in the dataset's own title ("Uveal Melanoma"). Retrieved 2026-08-02.
- accession: massive:MSV000090700
  title: Oncogenic pathways in uveal melanoma identified by phosphoproteomic analysis
  description: The uveal melanoma cell lines MP41 and MP46 driven by oncogenic G11 (Q209L) and Gq (Q209L), respectively, and a control cell line OCM-1A driven by oncogenic BRAF (V600E) were treated for 24 hours with FR900359, a highly specific inhibitor of Gq/11. Protein extracts were collected and TMT labeled prior to LC-MS analysis. The enrichment of phosphopeptides from fractions of each sample was performed using IMAC prior to LC-MS. Proteomic and phospho-proteomic data analyses were performed to identify changes in post-translational modification in signaling pathways regulated by Gq/11 in these cells.
  notes: Located via OmicsDI, which aggregates across omics repositories; this record comes from massive. Only repositories with no other discovery route in this project and with a working accession resolver are curated from OmicsDI -- GEO, ArrayExpress, PRIDE, MetaboLights and EGA hits are excluded as duplicates of dedicated passes. Matched because the disease is named in the dataset's own title ("Uveal Melanoma"). Retrieved 2026-08-02.
- accession: dbgap:phs001370
  title: Whole Exome Sequencing of Uveal Melanoma
  description: Uveal melanoma is a rare form of melanoma that occurs in the eye and has no effective treatment once metastatic. To further characterize the genomic events driving uveal melanoma, whole exome sequencing was performed on 61 primary tumors derived from enucleations, 3 liver metasases, and paired normal DNA. Recurrent somatic genetic alterations including point mutations, small insertions and deletions, as well as copy number variations were identified.

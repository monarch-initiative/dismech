  description: >-
    As the primary uveal tumor enlarges, vascular hyperpermeability and
    disruption of Bruch's membrane and the retinal pigment epithelium allow
    serous exudate to accumulate in the subretinal space, detaching and
    mechanically irritating the overlying neurosensory retina.

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The serous exudate has leaked from the tumor (T) through Bruch's membrane and the retinal pigment ... (arrowheads) and pushed the retina (R) away."
    explanation: Histopathology of primary choroidal uveal melanoma showing subretinal serous exudation from the tumor mass across Bruch's membrane and the RPE detaching the retina.
  downstream:
  - target: Exudative Retinal Detachment
    description: Subretinal serous fluid accumulation separates the neurosensory retina from the retinal pigment epithelium.
  - target: Decreased Visual Acuity
    description: Subretinal fluid and tumor mass distortion near the macula or visual axis reduce central visual acuity.
  - target: Visual Field Defect
    description: Serous retinal detachment and intraocular mass effect produce a corresponding visual field shadow.
  - target: Photopsia
    description: Mechanical and exudative traction/irritation of the neurosensory retina causes flashes of light.
- name: Somatic Monosomy 3
  biological_scale: CELLULAR
  genetic_context:
    variant_origin: SOMATIC
  description: >-
    Whole-chromosome loss of one copy of chromosome 3 (monosomy 3, or acquired
    isodisomy 3) is the defining cytogenetic bifurcation separating high-risk
    metastasizing uveal melanomas from low-risk disomy-3 tumors. Because both
    BAP1 (3p21.1) and MBD4 (3q21.3) reside on chromosome 3, monosomy 3 removes
    the wild-type allele to complete biallelic inactivation of somatic BAP1
    mutations and, in germline MBD4 variant carriers, biallelic MBD4 loss.
  cell_types:
  - preferred_term: melanocyte
    term:
      id: CL:0000148
      label: melanocyte
  locations:
  - preferred_term: uvea
    term:
      id: UBERON:0001768
      label: uvea
  evidence:
  - reference: PMID:23877823
    reference_title: "[Uveal melanoma: current insights into clinical relevance of genetic testing]."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Based on the chromosome 3 status uveal melanomas can be divided into two major classes that differ in their metastatic potential. Tumours with a high risk to metastasise usually show monosomy 3, whereas tumours showing disomy 3 rarely metastasise."
    explanation: Establishes chromosome 3 copy-number loss (monosomy 3 versus disomy 3) as the primary cytogenetic determinant of metastatic risk in uveal melanoma.
  - reference: PMID:29760383
    reference_title: "Outlier response to anti-PD1 in uveal melanoma reveals germline MBD4 mutations in hypermutated tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Inactivation of BAP1 (3p21), through both deleterious mutations and monosomy 3, is frequent in UM and is associated with a high risk of metastasis4."
    explanation: Documents how monosomy 3 cooperates with deleterious BAP1 mutations on 3p21 to inactivate BAP1 in high-metastatic-risk uveal melanoma.
  downstream:
  - target: BAP1 Loss and Metastatic Progression
    description: Loss of chromosome 3 deletes the remaining BAP1 allele on 3p21.1, completing biallelic BAP1 tumor-suppressor inactivation.
    evidence:
    - reference: PMID:29760383
      reference_title: "Outlier response to anti-PD1 in uveal melanoma reveals germline MBD4 mutations in hypermutated tumors."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Inactivation of BAP1 (3p21), through both deleterious mutations and monosomy 3, is frequent in UM and is associated with a high risk of metastasis4."
      explanation: Links somatic monosomy 3 directly to biallelic BAP1 inactivation and metastatic progression.
  - target: MBD4 Glycosylase Deficiency
    description: In germline MBD4 loss-of-function carriers, somatic monosomy 3 eliminates the wild-type MBD4 allele on 3q21.3 in tumor cells.
    evidence:
    - reference: PMID:29760383
      reference_title: "Outlier response to anti-PD1 in uveal melanoma reveals germline MBD4 mutations in hypermutated tumors."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We identified a germline deleterious frameshift deletion of MBD4 (3q21.3; c.1441delT:p.F481Dfs*9) with loss of the second allele by monosomy 3 in all tumor samples (Fig. 2c, f)."
      explanation: Demonstrates loss of the wild-type MBD4 allele via somatic monosomy 3 across tumor samples in germline MBD4-mutant uveal melanoma.
- name: BAP1 Loss and Metastatic Progression
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: SOMATIC
  description: >-
    BAP1 (BRCA1-associated protein 1) on chromosome 3p21.1 encodes a nuclear
    ubiquitin carboxyl-terminal hydrolase (cysteine-type deubiquitinase)
    involved in chromatin remodeling and transcriptional regulation. Biallelic
    BAP1 inactivation—typically combining somatic loss-of-function mutation with
    monosomy 3—occurs in over 80% of metastasizing uveal melanomas, driving a
    dedifferentiated class 2 transcriptional program and hematogenous
    dissemination.

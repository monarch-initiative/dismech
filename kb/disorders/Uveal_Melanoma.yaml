phenotypes:
- category: Ocular
  name: Uveal Melanoma
  frequency: OBLIGATE
  diagnostic: true
  description: >-
    Intraocular melanoma arising from uveal melanocytes, most commonly in the
    choroid (~90%), followed by the ciliary body (~6%) and iris (~4%).
  phenotype_term:
    preferred_term: Uveal melanoma
    term:
      id: HP:0007716
      label: Uveal melanoma
  evidence:
  - reference: DOI:10.1038/eye.2016.275
    reference_title: "Uveal melanoma: relatively rare but deadly cancer"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Although it is a relatively rare disease, primarily found in the Caucasian population, uveal melanoma is the most common primary intraocular tumor in adults with a mean age-adjusted incidence of 5.1 cases per million per year. Tumors are located either in iris (4%), ciliary body (6%), or choroid (90%)."
    explanation: Establishes primary uveal melanoma and its anatomic distribution across the choroid, ciliary body, and iris.
- category: Ocular
  name: Decreased Visual Acuity
  frequency: FREQUENT
  description: >-
    Blurred vision (decreased visual acuity) is the most common presenting
    symptom of uveal melanoma (~38-49% of patients), occurring when the tumor
    involves the macula, causes exudative retinal detachment, or distorts the
    visual axis.
  phenotype_term:
    preferred_term: Reduced visual acuity
    term:
      id: HP:0007663
      label: Reduced visual acuity
  evidence:
  - reference: DOI:10.1007/s00432-021-03851-9
    reference_title: "Vasculogenic mimicry correlates to presenting symptoms and mortality in uveal melanoma"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thirty-four patients (49%) presented with blurred vision. 18 (26%) with a shadow in the visual field, 7 (10%) with photopsia and/or floaters, and 2 (3%) with metamorphopsia. Nine patients (13%) had no symptoms at all."
    explanation: Cohort of 69 enucleated uveal melanoma patients documenting blurred vision (recorded as decreased visual acuity) in 49%.
- category: Ocular
  name: Visual Field Defect
  frequency: OCCASIONAL
  description: >-
    A shadow or defect in the visual field is reported at presentation by
    approximately 26% of enucleated uveal melanoma patients and correlates with
    exudative retinal detachment and tumor vasculogenic mimicry.
  phenotype_term:
    preferred_term: Visual field defect
    term:
      id: HP:0001123
      label: Visual field defect
  evidence:
  - reference: DOI:10.1007/s00432-021-03851-9
    reference_title: "Vasculogenic mimicry correlates to presenting symptoms and mortality in uveal melanoma"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thirty-four patients (49%) presented with blurred vision. 18 (26%) with a shadow in the visual field, 7 (10%) with photopsia and/or floaters, and 2 (3%) with metamorphopsia. Nine patients (13%) had no symptoms at all."
    explanation: Documents a visual field shadow in 26% (18/69) of presenting uveal melanoma patients.
- category: Ocular
  name: Exudative Retinal Detachment
  frequency: FREQUENT
  description: >-
    Non-rhegmatogenous (serous/exudative) detachment of the neurosensory retina
    caused by subretinal fluid leaking from the uveal tumor across Bruch's
    membrane and the retinal pigment epithelium; observed in 35 of 69 (51%)
    enucleated eyes.
  phenotype_term:
    preferred_term: Serous retinal detachment
    term:
      id: HP:0012231
      label: Serous retinal detachment
  evidence:
  - reference: DOI:10.1007/s00432-021-03851-9

- accession: ega:EGAS00001002761
  title: Comprehensive genetic analysis of uveal melanoma heterogeneity during metastatic progression
  description: Uveal melanoma (UM) is the most common primary intraocular malignancy in adults. Despite improvement of diagnosis and treatment of the primary tumor, there is no effective treatment of metastatic disease and approximately half of patients will die within one year or less following metastases detection. Tumor heterogeneity has been proposed as a key factor of drug resistance. However, it has been scarcely studied in UM. The present project aims searching for specific drivers of the metastatic progression, describing the genomic and transcriptomic landscape of metastatic UM, exploring tumor heterogeneity and investigating its role in drug resistance.

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Much of the nasal, temporal, and inferior retina have detached in an exudative retinal detachment by fluid leaking from the tumor (outlined by the red dotted line)."
    explanation: Documents tumor-associated exudative (serous) retinal detachment in uveal melanoma.
- category: Ocular
  name: Photopsia
  frequency: OCCASIONAL
  description: >-

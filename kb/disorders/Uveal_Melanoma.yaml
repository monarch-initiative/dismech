pathophysiology:
- name: GNAQ/GNA11 Oncogenic Mutations
  biological_scale: MOLECULAR
  conforms_to: sustaining_proliferative_signaling#Oncogenic Growth-Signal Lesion
  genetic_context:
    variant_origin: SOMATIC
  description: >-
    GNAQ and GNA11 encode alpha subunits of heterotrimeric Gq/11 G-proteins.
    Somatic missense mutations at Q209 (most common) or R183 impair intrinsic
    GTPase activity, locking the subunit in a constitutively active GTP-bound
    state and driving persistent downstream signaling. These mutations are
    mutually exclusive early initiating events in uveal melanomagenesis.
  genes:
  - preferred_term: GNAQ
    term:
      id: hgnc:4390
      label: GNAQ
  - preferred_term: GNA11
    term:
      id: hgnc:4379
      label: GNA11
  molecular_functions:
  - preferred_term: GTPase activity
    modifier: DECREASED
    term:
      id: GO:0003924
      label: GTPase activity
  cell_types:
  - preferred_term: melanocyte
    term:
      id: CL:0000148
      label: melanocyte
  biological_processes:
  - preferred_term: signal transduction
    modifier: INCREASED
    term:
      id: GO:0007165
      label: signal transduction
  locations:
  - preferred_term: uvea
    term:
      id: UBERON:0001768
      label: uvea
  evidence:
  - reference: PMID:23877823
    reference_title: "[Uveal melanoma: current insights into clinical relevance of genetic testing]."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Recently, major key genes involved in uveal melanoma development, GNAQ, GNA11, BAP1, SF3B1 and EIF1AX, have been identified."
    explanation: Identifies GNAQ and GNA11 as major driver genes in uveal melanoma development.
  - reference: PMID:26778290
    reference_title: "Mosaic Activating Mutations in GNA11 and GNAQ Are Associated with Phakomatosis Pigmentovascularis and Extensive Dermal Melanocytosis."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: "Codon 183 in both GNA11 and GNAQ is located within the guanosine triphosphate binding region of the human Gα subunit, a region required for hydrolysis of guanosine triphosphate to guanosine diphosphate and an essential step for inactivation of G-protein coupled receptor signaling. Therefore, these mutations lead to decreased function of guanosine triphosphatase and to constitutive activation of downstream effector pathways."
    explanation: Explains how hotspot GNAQ/GNA11 mutations abolish GTPase hydrolysis and lock Galpha subunits in a constitutively active signaling state.
  - reference: DOI:10.3390/diagnostics14090958
    reference_title: "Pathological and Molecular Diagnosis of Uveal Melanoma"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Recent genetic understanding of oncogene-initiation mutations in GNAQ, GNA11, PLCB4, and CYSLTR2 and secondary progression drivers of BAP1 inactivation and SF3B1 and EIF1AX mutations offers an appealing explanation to the high prognostic impact of adding genetic profiling to clinical UM classification."
    explanation: Establishes GNAQ and GNA11 mutations as oncogenic initiation events distinct from secondary progression drivers.
  downstream:
  - target: PKC-MAPK Pathway Activation
    description: Constitutively active Gq/11 signaling activates PLC-beta, PKC, and downstream MAPK cascades.

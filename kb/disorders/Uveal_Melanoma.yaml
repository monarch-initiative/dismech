disease_term:
  preferred_term: uveal melanoma
  term:
    id: MONDO:0006486
    label: uveal melanoma
notes: >-
  Uveal melanoma is molecularly distinct from cutaneous melanoma, driven by
  initiating somatic mutations in GNAQ, GNA11, PLCB4, or CYSLTR2 rather than
  BRAF or NRAS mutations, and stratified prognostically by chromosome 3/8q
  copy-number status, secondary mutations in BAP1, SF3B1, or EIF1AX, and
  15-gene expression profile (15-GEP)/PRAME status. Despite high local control
  rates with plaque brachytherapy, proton beam therapy, or enucleation, up to
  50% of patients develop metastases—predominantly in the liver—due to early
  hematogenous micrometastatic seeding. Autosomal dominant germline MBD4
  predisposition to hypermutated monosomy-3 uveal melanoma is curated in full in
  sibling entry MBD4-Related Uveal Melanoma Predisposition (MONDO:0011695). No
  disease-specific GeneReviews chapter exists for sporadic uveal melanoma
  (existing GeneReviews chapters cover only the distinct hereditary
  predisposition syndromes germline BAP1 tumor predisposition syndrome,
  MONDO:0013692, and biallelic MBD4-related tumor predisposition syndrome,
  MONDO:0957249).


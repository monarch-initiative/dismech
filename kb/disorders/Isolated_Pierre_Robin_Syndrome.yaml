genetic:
- name: SOX9
  subtype: SOX9 regulatory
  association: Regulatory target of pathogenic noncoding deletions in a subset of isolated Robin sequence
  gene_term:
    preferred_term: SOX9
    term:
      id: hgnc:11204
      label: SOX9
  notes: SOX9 coding sequence is intact in the distal enhancer deletion discussed here. Experimental enhancer-cluster
    deletions establish a restricted expression mechanism, but no patient-cell expression assay for the
    complete F1 deletion is reported in the cited studies.
  variants:
  - name: Distal SOX9 enhancer deletion in family F1 (Benko 2009; refined Gordon 2014)
    variant_type: deletion
    type: Deletion with a 9 bp junction insertion
    genomic_contexts:
    - intergenic region
    affected_regions:
    - name: EC1.45 craniofacial enhancer cluster
      regulatory_element_type: ENHANCER
      description: Enhancer cluster approximately 1.45 Mb upstream of SOX9 within the intervening gene
        desert. This feature overlaps the family F1 deletion and does not describe its complete extent.
        EC1.25 is a separate experimentally studied cluster, not part of the F1 deletion.
    regulatory_target_gene:
      preferred_term: SOX9
      term:
        id: hgnc:11204
        label: SOX9
    description: The historical approximately 75 kb F1 deletion was resolved by breakpoint-spanning sequencing
      as hg19 chr17:68,663,923-68,748,011 inclusive, approximately 84 kb, accompanied by a 9 bp insertion.
      It overlaps EC1.45 in the SOX9 upstream gene desert and leaves SOX9 coding sequence intact. POSTRE
      Table 1 patient Nr2 uses the earlier 75 kb representation chr17:68,663,405-68,738,405 (hg19), citing
      Long 2020, whose Figure 1 identifies the original F1 deletion. The POSTRE input interval is retained
      as benchmark provenance and is not treated as identical nucleotide-resolved boundaries or as a second
      allele.
    functional_effects:
    - function: SOX9 expression during cranial neural crest development
      type: Reduced gene expression
      regulatory_element_type: ENHANCER
      regulatory_mechanism: Deletion of distal craniofacial enhancer DNA
      description: The F1 deletion overlaps a cranial neural crest enhancer cluster. Engineered EC1.45
        deletion, which is smaller than the patient deletion, reduces SOX9 expression in hESC-derived
        cranial neural crest cells but not in derived chondrocytes. Modular loss of expression is therefore
        a supported model for the patient's regulatory defect rather than a direct patient expression
        measurement.
    evidence:
    - reference: PMID:24934569
      reference_title: Identification of novel craniofacial regulatory domains located far upstream of
        SOX9 and disrupted in Pierre Robin sequence.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: This analysis indicated a deletion of 84 kb (chr17:68,663,923-68,748,011 inclusive; Hg19),
        accompanied by an insertion of 9 bp
      explanation: Defines the refined patient deletion and its junction insertion.
    - reference: PMID:32991838
      reference_title: Loss of Extreme Long-Range Enhancers in Human Neural Crest Drives a Craniofacial
        Disorder.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: In summary, EC1.45 and EC1.25 are required for normal expression of SOX9 in the cranial
        neural crest
      explanation: Functional perturbation of enhancer clusters supports SOX9 as the regulatory target
        without claiming an assay of the complete F1 allele.
experimental_models:
- name: Engineered SOX9 enhancer deletions in hESC-derived cranial neural crest cells
  experimental_model_type: OTHER
  cell_source: Genome-edited human embryonic stem cells differentiated into cranial neural crest cells
    and subsequently cranial chondrocytes
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  publication: PMID:32991838
  description: Heterozygous EC1.45 or EC1.25 deletions were engineered in hESCs. Allele-specific RT-ddPCR
    during differentiation demonstrated reduced SOX9 expression in cranial neural crest cells with loss
    of allelic skew after differentiation into chondrocytes. These engineered enhancer-cluster deletions
    are distinct from the larger clinical deletions, including the F1 allele.
  modeled_mechanisms:
  - target: Modular Loss of SOX9 Expression in Cranial Neural Crest
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    limitations: Engineered enhancer-cluster deletions reproduce the expression mechanism but not the
      full patient F1 deletion or its genetic background.
    evidence:
    - reference: PMID:32991838
      reference_title: Loss of Extreme Long-Range Enhancers in Human Neural Crest Drives a Craniofacial
        Disorder.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: we generated hESC lines with heterozygous deletions of EC1.45 or EC1.25
      explanation: Establishes the provenance of the engineered cellular models.
diagnosis:
- name: Polysomnography (Sleep Study) for Upper Airway Obstruction
  description: Polysomnography (sleep study) and/or continuous pulse oximetry objectively quantify intermittent
    and sleep-related upper airway obstruction and obstructive sleep apnea to guide airway management
    in infants with Robin sequence.
  diagnosis_term:
    preferred_term: Polysomnography
    term:
      id: NCIT:C114185
      label: Polysomnography
  evidence:
  - reference: PMID:37728101
    reference_title: Non-Surgical Respiratory Management in Relation to Feeding and Growth in Patients
      with Robin Sequence; a Prospective Longitudinal Study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In our center, therapeutic decisions in the management of RS were based on clinical symptoms
      of UAO and results from the polysomnography (PSG), which is the gold standard to diagnose obstructive
      sleep apnea (OSA).
    explanation: Establishes polysomnography as the gold standard for diagnosing obstructive sleep apnea
      and guiding respiratory management in Robin sequence.
  - reference: PMID:27429161
    reference_title: 'Best Practices for the Diagnosis and Evaluation of Infants With Robin Sequence:
      A Clinical Consensus Report.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Signs of upper airway obstruction can be intermittent and are more likely to be present when
      the infant is asleep. Therefore, sleep studies are recommended.
    explanation: Consensus guidelines recommend sleep studies to evaluate intermittent sleep-related upper
      airway obstruction in infants with Robin sequence.
- name: Clinical Craniofacial and Airway Examination
  description: Physical examination of the neonate establishes the clinical triad of mandibular hypoplasia
    (micrognathia), glossoptosis, and upper airway obstruction, evaluates for accompanying cleft palate,
    and excludes syndromic features.
  diagnosis_term:
    preferred_term: Clinical Evaluation
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  evidence:
  - reference: PMID:27429161
    reference_title: 'Best Practices for the Diagnosis and Evaluation of Infants With Robin Sequence:
      A Clinical Consensus Report.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Robin sequence (RS) is a congenital condition characterized by micrognathia, glossoptosis,
      and upper airway obstruction.
    explanation: Clinical evaluation of the congenital triad defines the diagnosis of Robin sequence.
  - reference: PMID:37728101
    reference_title: Non-Surgical Respiratory Management in Relation to Feeding and Growth in Patients
      with Robin Sequence; a Prospective Longitudinal Study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: It is characterized by a typical triad of symptoms, including mandibular hypoplasia (MH),
      glossoptosis, and tongue-based upper airway obstruction (UAO) (2).
    explanation: Clinical characterization of mandibular hypoplasia, glossoptosis, and tongue-based upper
      airway obstruction establishes the diagnosis.
- name: Chromosomal Microarray Analysis of the 17q24.3 Upstream SOX9 Region
  description: Chromosomal microarray analysis (CMA) detects noncoding microdeletions in the 17q24.3 gene
    desert upstream of SOX9 (including the ~1.2-1.5 Mb craniofacial regulatory region) in patients with
    the SOX9 regulatory subtype of isolated Pierre Robin sequence.
  diagnosis_term:
    preferred_term: Microarray Analysis
    term:
      id: NCIT:C18477
      label: Microarray Analysis
  evidence:
  - reference: PMID:23532965
    reference_title: Familial microdeletion of 17q24.3 upstream of SOX9 is associated with isolated Pierre
      Robin sequence due to position effect.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Clinical chromosome microarray analysis (CMA) revealed a maternally inherited ~623 kb microdeletion
      that is -725 kb upstream of 5' SOX9 at chromosome locus 17q24.3.
    explanation: Demonstrates clinical chromosomal microarray detection of upstream 17q24.3 microdeletions
      in isolated Pierre Robin sequence.
treatments:
- name: Individualized airway support
  description: Airway management is guided by respiratory severity and sleep studies. A prospective cohort
    that included isolated Robin sequence used non-surgical support such as nasopharyngeal airways and
    non-invasive ventilation. This evidence concerns clinical Robin sequence management and is not specific
    to the SOX9 regulatory subtype.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Upper Airway Obstruction
    description: Non-surgical respiratory support bypasses or relieves upper airway obstruction resulting
      from mandibular hypoplasia and glossoptosis.
  evidence:
  - reference: PMID:37728101
    reference_title: Non-Surgical Respiratory Management in Relation to Feeding and Growth in Patients
      with Robin Sequence; a Prospective Longitudinal Study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Non-surgical respiratory treatment resulted in an improvement of respiratory outcomes to
      near normal during the first year of life in patients with RS.
    explanation: Reports clinical outcomes in a cohort including isolated and non-isolated cases.
- name: Feeding assessment and nutritional support
  description: Feeding assessment, growth monitoring, and supplemental enteral feeding address inadequate
    intake when required; persistent feeding difficulty can outlast the period of airway support.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Nutritional Support
    term:
      id: NCIT:C15433
      label: Nutritional Support
  target_mechanisms:
  - target: Feeding Difficulties
    description: Nutritional and enteral tube support compensates for feeding impairment secondary to
      mandibular hypoplasia, glossoptosis, and cleft palate.
  evidence:
  - reference: PMID:37728101
    reference_title: Non-Surgical Respiratory Management in Relation to Feeding and Growth in Patients
      with Robin Sequence; a Prospective Longitudinal Study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: A total of 31 (86%) patients required tube feeding during their first year of life.
    explanation: Documents use of tube feeding in the mixed clinical cohort; no subtype-specific treatment
      effect or frequency is inferred.
- name: Surgical Airway Management (Mandibular Distraction Osteogenesis or Tracheostomy)
  description: Surgical intervention, such as mandibular distraction osteogenesis or placement of a tracheal
    cannula, is used to relieve severe upper airway obstruction when conservative positional or non-invasive
    respiratory management is insufficient.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Surgical Procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Upper Airway Obstruction
    description: Tracheostomy bypasses the obstructed upper airway, and mandibular distraction osteogenesis
      lengthens the hypoplastic postnatal mandible to advance the tongue base; both act on the established
      obstruction rather than on embryonic mandibular outgrowth.
  evidence:
  - reference: PMID:37728101
    reference_title: Non-Surgical Respiratory Management in Relation to Feeding and Growth in Patients
      with Robin Sequence; a Prospective Longitudinal Study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Patients were excluded from further analysis if they received any surgical treatment like
      placement of a tracheal cannula or mandibular distraction osteogenesis.
    explanation: An exclusion criterion of a non-surgical management study. It shows only that tracheal
      cannula placement and mandibular distraction osteogenesis are used in infants with Robin sequence;
      it reports no outcome for either procedure.
  - reference: PMID:37728101
    reference_title: Non-Surgical Respiratory Management in Relation to Feeding and Growth in Patients
      with Robin Sequence; a Prospective Longitudinal Study.
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: In literature, various treatment strategies to treat the UAO have been described, ranging
      from positional therapy to more invasive, surgical intervention.
    explanation: The introduction places surgical intervention at the invasive end of the range of treatments
      for upper airway obstruction in Robin sequence, which is the escalation this treatment describes.

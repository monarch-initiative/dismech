name: Isolated Pierre Robin Syndrome
creation_date: '2026-09-21T16:55:00Z'
category: Developmental
synonyms:
- Isolated Pierre Robin sequence
- Nonsyndromic Robin sequence
disease_term:
  preferred_term: isolated Pierre-Robin syndrome
  term:
    id: MONDO:0009869
    label: isolated Pierre-Robin syndrome
description: >-
  Isolated Pierre Robin sequence is a congenital craniofacial disorder in
  which mandibular hypoplasia, glossoptosis, and upper airway obstruction
  occur without a recognized broader syndrome. Cleft palate and feeding
  difficulties may accompany the sequence. Pathogenic noncoding variants
  affecting SOX9 regulation account for a subset of cases. Deletions of
  distal craniofacial enhancers can reduce SOX9 expression during neural
  crest development while sparing its coding sequence; this mechanism is
  distinct from the widespread skeletal and sex-development abnormalities
  associated with SOX9 coding variants in campomelic dysplasia. Other
  isolated cases have unresolved or different etiologies.
notes: >-
  This entry covers isolated Robin sequence, not Robin sequence occurring
  within Stickler syndrome, campomelic dysplasia, or another recognized
  syndrome. SOX9-associated regulatory mechanisms are scoped to the SOX9
  regulatory subtype.
parents:
- Congenital craniofacial disorder
has_subtypes:
- name: SOX9 regulatory
  subtype_term:
    preferred_term: SOX9-associated isolated Robin sequence
  description: >-
    Isolated Robin sequence associated with disruption of noncoding
    regulatory DNA controlling SOX9. Distal enhancer deletions and
    rearrangements can perturb craniofacial expression without deleting
    SOX9 coding sequence. This etiologic subtype does not encompass all
    isolated Robin sequence.
  genes:
  - preferred_term: SOX9
    term:
      id: hgnc:11204
      label: SOX9
  inheritance:
  - name: Autosomal dominant
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
    evidence:
    - reference: PMID:23532965
      reference_title: Familial microdeletion of 17q24.3 upstream of SOX9 is associated with isolated Pierre Robin sequence due to position effect.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Clinical chromosome microarray analysis (CMA) revealed a maternally inherited ~623 kb microdeletion"
      explanation: >-
        A daughter with isolated Robin sequence and her mother with cleft
        palate shared an upstream SOX9 deletion, supporting dominant
        transmission with variable expression in this regulatory subtype.
  evidence:
  - reference: PMID:19234473
    reference_title: Highly conserved non-coding elements on either side of SOX9 associated with Pierre Robin sequence.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Some cases of PRS may thus result from developmental misexpression of SOX9 due to disruption of very-long-range cis-regulatory elements."
    explanation: Establishes that SOX9 regulatory disruption explains a subset of Robin sequence.
pathophysiology:
- name: Deletion of Distal SOX9 Craniofacial Enhancers
  biological_scale: MOLECULAR
  subtypes:
  - SOX9 regulatory
  genetic_context:
    variant_type: deletion
    genomic_contexts:
    - intergenic region
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    description: >-
      Deletion in the gene desert upstream of SOX9, with intact SOX9 coding
      sequence. The family F1 allele was initially estimated at 75 kb and
      subsequently resolved as an 84 kb deletion with a 9 bp junction
      insertion. Other families have different upstream deletions.
  description: >-
    Disease-associated deletions remove parts of the distant SOX9
    craniofacial regulatory landscape. The F1 deletion overlaps enhancer
    cluster EC1.45, approximately 1.45 Mb upstream of SOX9. The deletion
    eliminates enhancer DNA rather than altering the SOX9 protein sequence.
  evidence:
  - reference: PMID:24934569
    reference_title: Identification of novel craniofacial regulatory domains located far upstream of SOX9 and disrupted in Pierre Robin sequence.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This analysis indicated a deletion of 84 kb (chr17:68,663,923-68,748,011 inclusive; Hg19), accompanied by an insertion of 9 bp"
    explanation: Breakpoint-spanning sequencing refined the family F1 deletion and identified the small junction insertion.
  downstream:
  - target: Modular Loss of SOX9 Expression in Cranial Neural Crest
    causal_link_type: DIRECT
    description: Loss of craniofacial enhancer DNA can reduce expression of the intact SOX9 allele during neural crest development.
    evidence:
    - reference: PMID:32991838
      reference_title: Loss of Extreme Long-Range Enhancers in Human Neural Crest Drives a Craniofacial Disorder.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: "enhancer deletion was associated with a striking allelic skew in SOX9 expression, indicating that loss of EC1.45 or EC1.25 disrupted normal regulation of SOX9"
      explanation: >-
        Engineered heterozygous enhancer-cluster deletions establish the
        causal expression effect in human stem-cell-derived neural crest;
        they do not reproduce the entire patient F1 deletion.
- name: Modular Loss of SOX9 Expression in Cranial Neural Crest
  biological_scale: MOLECULAR
  subtypes:
  - SOX9 regulatory
  mechanism_confidence: PROVISIONAL
  regulatory_category: mLOE
  description: >-
    Loss of distal enhancer activity is proposed to reduce SOX9 expression
    during a restricted cranial neural crest developmental window in
    affected individuals. In engineered hESC-derived cells, heterozygous
    EC1.45 deletion reduced expression from the edited allele by 50-55% in
    late cranial neural crest cells; EC1.25 deletion had a smaller effect.
    Neither deletion produced allelic expression skew after differentiation
    into cranial chondrocytes. These paired contexts support modular loss
    of expression in the experimental system. The provisional confidence
    records extrapolation to the larger patient F1 deletion, whose
    embryonic expression effect was not directly measured.
  genes:
  - preferred_term: SOX9
    term:
      id: hgnc:11204
      label: SOX9
  cell_types:
  - preferred_term: cranial neural crest cell
    term:
      id: CL:0000333
      label: migratory neural crest cell
  biological_processes:
  - preferred_term: SOX9 gene expression during cranial neural crest development
    modifier: DECREASED
    term:
      id: GO:0010467
      label: gene expression
  evidence:
  - reference: PMID:32991838
    reference_title: Loss of Extreme Long-Range Enhancers in Human Neural Crest Drives a Craniofacial Disorder.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "The effect of EC1.45 enhancer deletion on SOX9 expression was larger than that of EC1.25 deletion, especially in passage 3 (P3)–P4 late hCNCCs, where it led to 50%–55% lower expression of the mutated allele."
    explanation: Quantifies the allele-specific reduction after engineered EC1.45 deletion in late hCNCCs, rather than in patient material.
  - reference: PMID:32991838
    reference_title: Loss of Extreme Long-Range Enhancers in Human Neural Crest Drives a Craniofacial Disorder.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "cranial chondrocytes derived from hCNCCs heterozygous for EC1.45 or EC1.25 enhancer deletions did not show allelic skew in SOX9 expression"
    explanation: Retained balanced expression in derived chondrocytes supports developmental restriction of the enhancer requirement.
  downstream:
  - target: Impaired Mandibular Outgrowth
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Reduced SOX9 dosage in neural crest progenitors can impair mandibular
      morphogenesis. The intermediate cellular defects connecting the
      patient enhancer deletion to jaw undergrowth remain incompletely
      resolved.
    evidence:
    - reference: PMID:32991838
      reference_title: Loss of Extreme Long-Range Enhancers in Human Neural Crest Drives a Craniofacial Disorder.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "the mandible exhibits heightened and fully penetrant sensitivity to a 50% reduction of Sox9 gene dosage during mouse neural crest development"
      explanation: Neural crest-specific Sox9 dosage perturbation in mice supports the developmental link; it is not the exact human deletion.
- name: Impaired Mandibular Outgrowth
  biological_scale: TISSUE
  description: >-
    Underdevelopment of the mandible is the principal structural abnormality
    in Robin sequence. Reduced jaw dimensions can alter tongue position
    and airway geometry. This anatomical step can occur through etiologies
    other than SOX9 enhancer disruption.
  biological_processes:
  - preferred_term: Embryonic mandibular morphogenesis
    modifier: DECREASED
    term:
      id: GO:0048704
      label: embryonic skeletal system morphogenesis
  evidence:
  - reference: PMID:37728101
    reference_title: Non-Surgical Respiratory Management in Relation to Feeding and Growth in Patients with Robin Sequence; a Prospective Longitudinal Study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "clinical mandibular hypoplasia, clinical glossoptosis, and the presence of UAO, objectified by a polysomnography (PSG) and/or pulse oximetry"
    explanation: The clinical study defined both isolated and non-isolated Robin sequence using mandibular hypoplasia, glossoptosis, and objectively assessed obstruction.
  downstream:
  - target: Micrognathia
    causal_link_type: DIRECT
  - target: Glossoptosis
    causal_link_type: DIRECT
    description: Mandibular hypoplasia is thought to initiate posterior tongue displacement in the classical Robin sequence model.
    evidence:
    - reference: PMID:27429161
      reference_title: 'Best Practices for the Diagnosis and Evaluation of Infants With Robin Sequence: A Clinical Consensus Report.'
      supports: SUPPORT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: OTHER
      snippet: "Micrognathia is hypothesized as the initiating event"
      explanation: The consensus explicitly treats the initiating anatomical sequence as a hypothesis rather than a universal demonstrated mechanism.
phenotypes:
- name: Micrognathia
  category: Craniofacial
  description: Congenital mandibular hypoplasia is a defining feature of Robin sequence.
  phenotype_term:
    preferred_term: Micrognathia
    term:
      id: HP:0000347
      label: Micrognathia
  evidence:
  - reference: PMID:37728101
    reference_title: Non-Surgical Respiratory Management in Relation to Feeding and Growth in Patients with Robin Sequence; a Prospective Longitudinal Study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "clinical mandibular hypoplasia, clinical glossoptosis, and the presence of UAO, objectified by a polysomnography (PSG) and/or pulse oximetry"
    explanation: Mandibular hypoplasia was a clinical inclusion criterion for the cohort, including its isolated cases.
- name: Glossoptosis
  category: Craniofacial
  description: Posterior displacement of the tongue contributes to tongue-base airway obstruction.
  phenotype_term:
    preferred_term: Glossoptosis
    term:
      id: HP:0000162
      label: Glossoptosis
  evidence:
  - reference: PMID:37728101
    reference_title: Non-Surgical Respiratory Management in Relation to Feeding and Growth in Patients with Robin Sequence; a Prospective Longitudinal Study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "clinical mandibular hypoplasia, clinical glossoptosis, and the presence of UAO, objectified by a polysomnography (PSG) and/or pulse oximetry"
    explanation: Glossoptosis was clinically documented as part of the cohort definition.
  sequelae:
  - target: Upper Airway Obstruction
    causal_link_type: DIRECT
    description: A posteriorly positioned tongue can obstruct the upper airway.
- name: Upper Airway Obstruction
  category: Respiratory
  description: >-
    Obstruction may be intermittent and become more apparent during sleep;
    severity varies and is assessed with clinical examination and sleep
    studies.
  phenotype_term:
    preferred_term: Upper airway obstruction
    term:
      id: HP:0002781
      label: Upper airway obstruction
  evidence:
  - reference: PMID:37728101
    reference_title: Non-Surgical Respiratory Management in Relation to Feeding and Growth in Patients with Robin Sequence; a Prospective Longitudinal Study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "clinical mandibular hypoplasia, clinical glossoptosis, and the presence of UAO, objectified by a polysomnography (PSG) and/or pulse oximetry"
    explanation: Objective airway obstruction was documented in the clinical cohort, which included isolated Robin sequence.
- name: Cleft Palate
  category: Craniofacial
  description: Cleft palate may accompany isolated Robin sequence but is not required for the clinical diagnosis.
  phenotype_term:
    preferred_term: Cleft palate
    term:
      id: HP:0000175
      label: Cleft palate
  evidence:
  - reference: PMID:37728101
    reference_title: Non-Surgical Respiratory Management in Relation to Feeding and Growth in Patients with Robin Sequence; a Prospective Longitudinal Study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thirty (83%) patients presented with a cleft palate"
    explanation: Cleft palate occurred in only part of a mixed isolated and non-isolated cohort; its pooled frequency is not assigned to the isolated subtype.
- name: Feeding Difficulties
  category: Gastrointestinal
  description: >-
    Feeding impairment can require supplemental tube feeding and may
    persist after respiratory improvement. Craniofacial anatomy and
    swallowing function both contribute.
  phenotype_term:
    preferred_term: Feeding difficulties
    term:
      id: HP:0011968
      label: Feeding difficulties
  evidence:
  - reference: PMID:37728101
    reference_title: Non-Surgical Respiratory Management in Relation to Feeding and Growth in Patients with Robin Sequence; a Prospective Longitudinal Study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Eight out of 9 patients who had persisting FD at the age of 1 year, presented with non-isolated RS."
    explanation: Persistent feeding difficulty also occurred in an isolated case; this mixed cohort does not establish an isolated-case frequency.
genetic:
- name: SOX9
  subtype: SOX9 regulatory
  association: Regulatory target of pathogenic noncoding deletions in a subset of isolated Robin sequence
  gene_term:
    preferred_term: SOX9
    term:
      id: hgnc:11204
      label: SOX9
  notes: >-
    SOX9 coding sequence is intact in the distal enhancer deletion
    discussed here. Experimental enhancer-cluster deletions establish a
    restricted expression mechanism, but no patient-cell expression assay
    for the complete F1 deletion is reported in the cited studies.
  variants:
  - name: Distal SOX9 enhancer deletion in family F1 (Benko 2009; refined Gordon 2014)
    variant_type: deletion
    type: Deletion with a 9 bp junction insertion
    genomic_contexts:
    - intergenic region
    regulatory_target_gene:
      preferred_term: SOX9
      term:
        id: hgnc:11204
        label: SOX9
    description: >-
      The historical approximately 75 kb F1 deletion was resolved by
      breakpoint-spanning sequencing as hg19 chr17:68,663,923-68,748,011
      inclusive, approximately 84 kb, accompanied by a 9 bp insertion.
      It overlaps EC1.45 in the SOX9 upstream gene desert and leaves SOX9
      coding sequence intact. POSTRE Table 1 patient Nr2 uses the earlier
      75 kb representation chr17:68,663,405-68,738,405 (hg19), citing Long
      2020, whose Figure 1 identifies the original F1 deletion. The POSTRE
      input interval is retained as benchmark provenance and is not treated
      as identical nucleotide-resolved boundaries or as a second allele.
    functional_effects:
    - function: SOX9 expression during cranial neural crest development
      type: Reduced gene expression
      regulatory_element_type: ENHANCER
      regulatory_mechanism: Deletion of distal craniofacial enhancer DNA
      description: >-
        The F1 deletion overlaps a cranial neural crest enhancer cluster.
        Engineered EC1.45 deletion, which is smaller than the patient
        deletion, reduces SOX9 expression in hESC-derived cranial neural
        crest cells but not in derived chondrocytes. Modular loss of
        expression is therefore a supported model for the patient's
        regulatory defect rather than a direct patient expression measurement.
    evidence:
    - reference: PMID:24934569
      reference_title: Identification of novel craniofacial regulatory domains located far upstream of SOX9 and disrupted in Pierre Robin sequence.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This analysis indicated a deletion of 84 kb (chr17:68,663,923-68,748,011 inclusive; Hg19), accompanied by an insertion of 9 bp"
      explanation: Defines the refined patient deletion and its junction insertion.
    - reference: PMID:32991838
      reference_title: Loss of Extreme Long-Range Enhancers in Human Neural Crest Drives a Craniofacial Disorder.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: "In summary, EC1.45 and EC1.25 are required for normal expression of SOX9 in the cranial neural crest"
      explanation: Functional perturbation of enhancer clusters supports SOX9 as the regulatory target without claiming an assay of the complete F1 allele.
experimental_models:
- name: Engineered SOX9 enhancer deletions in hESC-derived cranial neural crest cells
  experimental_model_type: OTHER
  cell_source: Genome-edited human embryonic stem cells differentiated into cranial neural crest cells and subsequently cranial chondrocytes
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  publication: PMID:32991838
  description: >-
    Heterozygous EC1.45 or EC1.25 deletions were engineered in hESCs.
    Allele-specific RT-ddPCR during differentiation demonstrated reduced
    SOX9 expression in cranial neural crest cells with loss of allelic
    skew after differentiation into chondrocytes. These engineered
    enhancer-cluster deletions are distinct from the larger clinical
    deletions, including the F1 allele.
  modeled_mechanisms:
  - target: Modular Loss of SOX9 Expression in Cranial Neural Crest
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    limitations: Engineered enhancer-cluster deletions reproduce the expression mechanism but not the full patient F1 deletion or its genetic background.
    evidence:
    - reference: PMID:32991838
      reference_title: Loss of Extreme Long-Range Enhancers in Human Neural Crest Drives a Craniofacial Disorder.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "we generated hESC lines with heterozygous deletions of EC1.45 or EC1.25"
      explanation: Establishes the provenance of the engineered cellular models.
treatments:
- name: Individualized airway support
  description: >-
    Airway management is guided by respiratory severity and sleep studies.
    A prospective cohort that included isolated Robin sequence used
    non-surgical support such as nasopharyngeal airways and non-invasive
    ventilation. This evidence concerns clinical Robin sequence management
    and is not specific to the SOX9 regulatory subtype.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:37728101
    reference_title: Non-Surgical Respiratory Management in Relation to Feeding and Growth in Patients with Robin Sequence; a Prospective Longitudinal Study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Non-surgical respiratory treatment resulted in an improvement of respiratory outcomes to near normal during the first year of life in patients with RS."
    explanation: Reports clinical outcomes in a cohort including isolated and non-isolated cases.
- name: Feeding assessment and nutritional support
  description: >-
    Feeding assessment, growth monitoring, and supplemental enteral
    feeding address inadequate intake when required; persistent feeding
    difficulty can outlast the period of airway support.
  treatment_term:
    preferred_term: Nutritional Support
    term:
      id: NCIT:C15433
      label: Nutritional Support
  evidence:
  - reference: PMID:37728101
    reference_title: Non-Surgical Respiratory Management in Relation to Feeding and Growth in Patients with Robin Sequence; a Prospective Longitudinal Study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A total of 31 (86%) patients required tube feeding during their first year of life."
    explanation: Documents use of tube feeding in the mixed clinical cohort; no subtype-specific treatment effect or frequency is inferred.

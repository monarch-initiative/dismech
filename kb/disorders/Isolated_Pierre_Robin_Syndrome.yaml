pathophysiology:
- name: Deletion of Distal SOX9 Craniofacial Enhancers
  biological_scale: MOLECULAR
  subtypes:
  - SOX9 regulatory
  genetic_context:
    variant_type: deletion
    genomic_contexts:
    - intergenic region
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    affected_regions:
    - name: Distal SOX9 craniofacial regulatory landscape
      description: Noncoding gene-desert sequence upstream of SOX9 containing distinct craniofacial enhancer
        clusters. Patient deletions affect different parts of this landscape; the family F1 deletion overlaps
        EC1.45.
    description: Deletion in the gene desert upstream of SOX9, with intact SOX9 coding sequence. The family
      F1 allele was initially estimated at 75 kb and subsequently resolved as an 84 kb deletion with a
      9 bp junction insertion. Other families have different upstream deletions.
  description: Disease-associated deletions remove parts of the distant SOX9 craniofacial regulatory landscape.
    The F1 deletion overlaps enhancer cluster EC1.45, approximately 1.45 Mb upstream of SOX9. The deletion
    eliminates enhancer DNA rather than altering the SOX9 protein sequence.
  cell_types:
  - preferred_term: cranial neural crest cell
    term:
      id: CL:0000333
      label: migratory neural crest cell
  locations:
  - preferred_term: pharyngeal arch 1
    term:
      id: UBERON:0004362
      label: pharyngeal arch 1
  - preferred_term: mandible
    term:
      id: UBERON:0001684
      label: mandible
  evidence:
  - reference: PMID:24934569
    reference_title: Identification of novel craniofacial regulatory domains located far upstream of SOX9
      and disrupted in Pierre Robin sequence.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: This analysis indicated a deletion of 84 kb (chr17:68,663,923-68,748,011 inclusive; Hg19),
      accompanied by an insertion of 9 bp
    explanation: Breakpoint-spanning sequencing refined the family F1 deletion and identified the small
      junction insertion.
  downstream:
  - target: Modular Loss of SOX9 Expression in Cranial Neural Crest
    causal_link_type: DIRECT
    description: Loss of craniofacial enhancer DNA can reduce expression of the intact SOX9 allele during
      neural crest development.
    evidence:
    - reference: PMID:32991838
      reference_title: Loss of Extreme Long-Range Enhancers in Human Neural Crest Drives a Craniofacial
        Disorder.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: enhancer deletion was associated with a striking allelic skew in SOX9 expression, indicating
        that loss of EC1.45 or EC1.25 disrupted normal regulation of SOX9
      explanation: Engineered heterozygous enhancer-cluster deletions establish the causal expression
        effect in human stem-cell-derived neural crest; they do not reproduce the entire patient F1 deletion.
- name: Modular Loss of SOX9 Expression in Cranial Neural Crest
  biological_scale: MOLECULAR
  subtypes:
  - SOX9 regulatory
  mechanism_confidence: PROVISIONAL
  regulatory_category: mLOE
  description: Loss of distal enhancer activity is proposed to reduce SOX9 expression during a restricted
    cranial neural crest developmental window in affected individuals. In engineered hESC-derived cells,
    heterozygous EC1.45 deletion reduced expression from the edited allele by 50-55% in late cranial neural
    crest cells; EC1.25 deletion had a smaller effect. Neither deletion produced allelic expression skew
    after differentiation into cranial chondrocytes. These paired contexts support modular loss of expression
    in the experimental system. The provisional confidence records extrapolation to the larger patient
    F1 deletion, whose embryonic expression effect was not directly measured.
  genes:
  - preferred_term: SOX9
    term:
      id: hgnc:11204
      label: SOX9
  molecular_functions:
  - preferred_term: DNA-binding transcription factor activity, RNA polymerase II-specific
    term:
      id: GO:0000981
      label: DNA-binding transcription factor activity, RNA polymerase II-specific
  locations:
  - preferred_term: pharyngeal arch 1
    term:
      id: UBERON:0004362
      label: pharyngeal arch 1
  - preferred_term: mandible
    term:
      id: UBERON:0001684
      label: mandible
  cell_types:
  - preferred_term: cranial neural crest cell
    term:
      id: CL:0000333
      label: migratory neural crest cell
  biological_processes:
  - preferred_term: SOX9 gene expression during cranial neural crest development
    modifier: DECREASED
    term:
      id: GO:0010467
      label: gene expression
  evidence:
  - reference: PMID:32991838
    reference_title: Loss of Extreme Long-Range Enhancers in Human Neural Crest Drives a Craniofacial
      Disorder.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: The effect of EC1.45 enhancer deletion on SOX9 expression was larger than that of EC1.25
      deletion, especially in passage 3 (P3)–P4 late hCNCCs, where it led to 50%–55% lower expression
      of the mutated allele.
    explanation: Quantifies the allele-specific reduction after engineered EC1.45 deletion in late hCNCCs,
      rather than in patient material.
  - reference: PMID:32991838
    reference_title: Loss of Extreme Long-Range Enhancers in Human Neural Crest Drives a Craniofacial
      Disorder.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: cranial chondrocytes derived from hCNCCs heterozygous for EC1.45 or EC1.25 enhancer deletions
      did not show allelic skew in SOX9 expression
    explanation: Retained balanced expression in derived chondrocytes supports developmental restriction
      of the enhancer requirement.
  downstream:
  - target: Impaired Mandibular Outgrowth
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Reduced SOX9 dosage in neural crest progenitors can impair mandibular morphogenesis.
      The intermediate cellular defects connecting the patient enhancer deletion to jaw undergrowth remain
      incompletely resolved.
    evidence:
    - reference: PMID:32991838
      reference_title: Loss of Extreme Long-Range Enhancers in Human Neural Crest Drives a Craniofacial
        Disorder.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: the mandible exhibits heightened and fully penetrant sensitivity to a 50% reduction of
        Sox9 gene dosage during mouse neural crest development
      explanation: Neural crest-specific Sox9 dosage perturbation in mice supports the developmental link;
        it is not the exact human deletion.
- name: Impaired Mandibular Outgrowth
  biological_scale: TISSUE
  description: Underdevelopment of the mandible is the principal structural abnormality in Robin sequence.
    Reduced jaw dimensions can alter tongue position and airway geometry. This anatomical step can occur
    through etiologies other than SOX9 enhancer disruption. Chondrocytes are listed as the affected skeletal
    tissue, not as the site of the SOX9 expression defect; derived cranial chondrocytes show balanced allelic
    SOX9 expression.
  cell_types:
  - preferred_term: chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  - preferred_term: cranial neural crest cell
    term:
      id: CL:0000333
      label: migratory neural crest cell
  locations:
  - preferred_term: mandible
    term:
      id: UBERON:0001684
      label: mandible
  biological_processes:

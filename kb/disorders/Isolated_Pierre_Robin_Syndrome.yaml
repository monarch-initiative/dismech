disease_term:
  preferred_term: isolated Pierre-Robin syndrome
  term:
    id: MONDO:0009869
    label: isolated Pierre-Robin syndrome
description: Isolated Pierre Robin sequence is a congenital craniofacial disorder in which mandibular
  hypoplasia, glossoptosis, and upper airway obstruction occur without a recognized broader syndrome.
  Cleft palate and feeding difficulties may accompany the sequence. Pathogenic noncoding variants affecting
  SOX9 regulation account for a subset of cases. Deletions of distal craniofacial enhancers can reduce
  SOX9 expression during neural crest development while sparing its coding sequence; this mechanism is
  distinct from the widespread skeletal and sex-development abnormalities associated with SOX9 coding
  variants in campomelic dysplasia. Other isolated cases have unresolved or different etiologies.
notes: This entry covers isolated Robin sequence, not Robin sequence occurring within Stickler syndrome,
  campomelic dysplasia, or another recognized syndrome. SOX9-associated regulatory mechanisms are scoped
  to the SOX9 regulatory subtype.
parents:
- Congenital craniofacial disorder
has_subtypes:
- name: SOX9 regulatory
  subtype_term:
    preferred_term: SOX9-associated isolated Robin sequence
  description: Isolated Robin sequence associated with disruption of noncoding regulatory DNA controlling
    SOX9. Distal enhancer deletions and rearrangements can perturb craniofacial expression without deleting
    SOX9 coding sequence. This etiologic subtype does not encompass all isolated Robin sequence.
  genes:

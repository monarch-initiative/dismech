      label: cartilage development
  evidence:
  - reference: PMID:37728101
    reference_title: Non-Surgical Respiratory Management in Relation to Feeding and Growth in Patients
      with Robin Sequence; a Prospective Longitudinal Study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: clinical mandibular hypoplasia, clinical glossoptosis, and the presence of UAO, objectified
      by a polysomnography (PSG) and/or pulse oximetry
    explanation: The clinical study defined both isolated and non-isolated Robin sequence using mandibular
      hypoplasia, glossoptosis, and objectively assessed obstruction.
  downstream:
  - target: Micrognathia
    causal_link_type: DIRECT
    description: Impaired embryonic mandibular outgrowth manifests directly as congenital micrognathia.
  - target: Glossoptosis
    causal_link_type: DIRECT
    description: Mandibular hypoplasia is thought to initiate posterior tongue displacement in the classical
      Robin sequence model.
    evidence:
    - reference: PMID:27429161
      reference_title: 'Best Practices for the Diagnosis and Evaluation of Infants With Robin Sequence:
        A Clinical Consensus Report.'
      supports: SUPPORT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: OTHER
      snippet: Micrognathia is hypothesized as the initiating event
      explanation: The consensus explicitly treats the initiating anatomical sequence as a hypothesis
        rather than a universal demonstrated mechanism.
  - target: Upper Airway Obstruction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Mandibular hypoplasia and secondary posterior displacement of the tongue narrow the pharyngeal
      airway and cause upper airway obstruction.
  - target: Cleft Palate
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Underdevelopment of the mandible and superior-posterior tongue displacement are proposed
      to mechanically impede elevation and fusion of the embryonic palatal shelves, producing cleft palate.
  - target: Feeding Difficulties
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Mandibular hypoplasia, glossoptosis, upper airway obstruction, and palatal clefting disrupt
      suck-swallow-breathe coordination and cause neonatal feeding difficulties.

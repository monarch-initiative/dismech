  rate_low: 2.0
  rate_high: 6.7
  notes: >-
    Incidence ~1 in 15,000 to 1 in 50,000 live births (2-6.7 per 100,000); one of
    the more common contiguous-gene deletion syndromes.
  evidence:
  - reference: PMID:16953888
    reference_title: "Cri du Chat syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The incidence ranges from 1:15,000 to 1:50,000 live-born infants."
    explanation: Provides the cited incidence range for the syndrome.
pathophysiology:
- name: 5p Terminal Deletion (Monosomy 5p)
  biological_scale: MOLECULAR
  description: >-
    A partial deletion of the short arm of chromosome 5, of variable size, removing
    one copy of the genes in the deleted interval and producing haploinsufficiency
    across 5p. The deletion spans one or both of the two 5p15 critical regions.
  evidence:
  - reference: PMID:16953888
    reference_title: "Cri du Chat syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The Cri du Chat syndrome (CdCS) is a genetic disease resulting from a deletion of variable size occurring on the short arm of chromosome 5 (5p-)."
    explanation: Defines the causal lesion as a variable-size deletion of 5p.
  downstream:
  - target: Haploinsufficiency of 5p Neurodevelopmental Genes
    causal_link_type: DIRECT
    description: Loss of one copy of 5p15.2 genes involved in cerebral development.
  - target: Deletion of the Cat-Cry Critical Region
    causal_link_type: DIRECT
    description: Loss of the 5p15.3 region required for normal cry/laryngeal-neurological development.
- name: Haploinsufficiency of 5p Neurodevelopmental Genes
  biological_scale: MOLECULAR
  description: >-
    Hemizygous loss of dosage-sensitive 5p15.2 genes. SEMA5A (semaphorin F) and
    CTNND2 (delta-catenin) map to the critical regions and are implicated in
    cerebral development; their loss is proposed to underlie the intellectual
    disability. TERT (telomerase reverse transcriptase) at 5p15.33 may modify the
    phenotype.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: brain development
    term:
      id: GO:0007420
      label: brain development
    modifier: DECREASED
  genes:
  - preferred_term: SEMA5A
    term:
      id: hgnc:10736
      label: SEMA5A
  - preferred_term: CTNND2
    term:
      id: hgnc:2516
      label: CTNND2
  - preferred_term: TERT
    term:
      id: hgnc:11730
      label: TERT
  evidence:
  - reference: PMID:16953888
    reference_title: "Cri du Chat syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "are potentially involved in cerebral development and their deletion may be associated with mental retardation in CdCS patients."
    explanation: Attributes intellectual disability to deletion of SEMA5A/CTNND2, cerebral-development genes in the critical regions.
  - reference: PMID:16953888
    reference_title: "Cri du Chat syndrome."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Deletion of the telomerase reverse transcriptase (hTERT) gene, localised to 5p15.33, could contribute to the phenotypic changes in CdCS."
    explanation: Implicates TERT (5p15.33) as a possible phenotypic modifier.
  downstream:
  - target: Impaired Cerebral Development
    causal_link_type: DIRECT
    description: Reduced dosage of cerebral-development genes impairs brain development.
- name: Impaired Cerebral Development
  biological_scale: TISSUE
  description: >-
    Deficient cerebral development resulting from 5p gene haploinsufficiency,
    producing severe intellectual disability and psychomotor delay.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540

name: Cri-du-chat Syndrome
creation_date: "2026-08-22T00:00:00Z"
description: >-
  Cri-du-chat syndrome (5p- syndrome, monosomy 5p) is a contiguous-gene deletion
  syndrome caused by a partial deletion of the short arm of chromosome 5, of
  variable size. It is named for the distinctive high-pitched, cat-like cry of
  affected infants. The deletion produces haploinsufficiency of 5p genes and a
  phenotype of severe intellectual disability and psychomotor delay, microcephaly,
  and characteristic facial dysmorphism. Genotype-phenotype studies define two
  critical regions on 5p15 — the cat-cry critical region at 5p15.3 and a region for
  dysmorphism and intellectual disability at 5p15.2 — and show that clinical
  severity increases with deletion size. Candidate dosage-sensitive genes include
  SEMA5A (semaphorin F) and CTNND2 (delta-catenin), implicated in cerebral
  development, and TERT at 5p15.33. Most cases are de novo; a minority are familial,
  usually via a parental balanced translocation.
category: Genetic
synonyms:
- 5p deletion syndrome
- 5p- syndrome
- monosomy 5p
- Lejeune syndrome
parents:
- hereditary disease
- chromosomal disorder

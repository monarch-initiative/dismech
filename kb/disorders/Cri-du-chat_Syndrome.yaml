- name: Deletion of the Cat-Cry Critical Region
  biological_scale: MOLECULAR
  description: >-
    Loss of the 5p15.3 cat-cry critical region, distinct from the 5p15.2
    dysmorphism/intellectual-disability region, producing the characteristic
    high-pitched, cat-like cry attributed to laryngeal and neurological development.
  evidence:
  - reference: PMID:15733271
    reference_title: "A variant Cri du Chat phenotype and autism spectrum disorder in a subject with de novo cryptic microdeletions involving 5p15.2 and 3p24.3-25 detected using whole genomic array CGH."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The critical region for CdCs has been mapped to 5p15, with the hallmark cat-like cry sublocalized to 5p15.3 and the remaining clinical features to 5p15.2."
    explanation: Localizes the cat-cry critical region to 5p15.3, separate from the 5p15.2 region for the other features.
  downstream:
  - target: Cat Cry
    causal_link_type: DIRECT

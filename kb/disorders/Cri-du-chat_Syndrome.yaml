genetic:
- name: 5p terminal deletion
  association: Causal
  notes: >-
    Partial deletion of the short arm of chromosome 5 (copy-number loss), of
    variable size; severity correlates with deletion size. About 85% are de novo;
    10-15% are familial, most often from a parental balanced translocation (and ~5%
    a parental inversion). The deleted chromosome is of paternal origin in ~90% of
    de novo cases. No coordinate slot exists in the schema; the structural event is
    recorded here in prose (copy-number loss, 5p15).
  evidence:
  - reference: PMID:10678657
    reference_title: "Cri du chat syndrome: changing phenotype in older patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A de novo deletion is present in 85% of the patients. Ten to 15% are familial cases with more than 90% due to a parental translocation and 5% due to an inversion of chromosome 5."
    explanation: Gives the de novo vs familial breakdown and the mechanisms of familial cases.
  - reference: PMID:11238681
    reference_title: "Clinical and molecular characterisation of 80 patients with 5p deletion: genotype-phenotype correlation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The origin of the deleted chromosome 5 was paternal in 55 out of 61 patients (90.2%)."
    explanation: Documents the predominantly paternal origin of the deleted chromosome.

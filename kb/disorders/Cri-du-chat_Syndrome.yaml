    reference_title: "Cri du Chat syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The main clinical features are a high-pitched monochromatic cry, microcephaly, broad nasal bridge, epicanthal folds, micrognathia, abnormal dermatoglyphics, and severe psychomotor and mental retardation."
    explanation: Documents severe psychomotor and mental retardation as core features.

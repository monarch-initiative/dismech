has_subtypes:
- name: Terminal deletion
  display_name: 5p terminal deletion
  description: >-
    The most common form — a terminal deletion of 5p, of variable breakpoint and
    size. Clinical severity and psychomotor retardation increase progressively
    with the size of the deletion.
  evidence:
  - reference: PMID:11238681
    reference_title: "Clinical and molecular characterisation of 80 patients with 5p deletion: genotype-phenotype correlation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genotype-phenotype correlation in 62 patients with terminal deletions highlighted a progressive severity of clinical manifestation and psychomotor retardation related to the size of the deletion."
    explanation: Establishes terminal deletions as the predominant class and links deletion size to clinical severity.
- name: Interstitial deletion
  display_name: 5p interstitial deletion
  description: >-
    A less common interstitial deletion of 5p. Analysis of interstitial deletions
    helped define the two separate critical regions (dysmorphism/intellectual
    disability at 5p15.2 and the cat cry at 5p15.3).
  evidence:
  - reference: PMID:11238681
    reference_title: "Clinical and molecular characterisation of 80 patients with 5p deletion: genotype-phenotype correlation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the existence of two critical regions, one for dysmorphism and mental retardation in p15.2 and the other for the cat cry in p15.3."
    explanation: Interstitial-deletion patients delineated the two distinct 5p15 critical regions.
inheritance:
- name: De novo 5p terminal deletion, with a familial rearrangement minority
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  de_novo_rate: >-
    A de novo deletion is present in about 85% of patients; 10-15% are familial.
  description: >-
    The 5p deletion acts in the heterozygous state. Most cases are sporadic, but
    the familial minority matters for counselling because it is overwhelmingly
    driven by a balanced parental rearrangement rather than by transmission of
    the deletion itself, so parental karyotyping is indicated.
  evidence:
  - reference: PMID:10678657
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: A de novo deletion is present in 85% of the patients.
    explanation: Gives the de novo rate.
  - reference: PMID:10678657
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ten to 15% are familial cases with more than 90% due to a parental
      translocation and 5% due to an inversion of chromosome 5.
    explanation: >-
      Establishes that the familial minority arises from parental structural
      rearrangements, which is what makes parental karyotyping informative.
prevalence:
- population: Live births

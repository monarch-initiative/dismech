        Coffin-Lowry syndrome (CLS) classically manifests in males with developmental delay, intellectual disability, neurologic manifestations (hypotonia, stimulus-induced drop attacks, spastic paraparesis, and seizures), musculoskeletal manifestations (kyphoscoliosis and pectus deformity), and characteristic craniofacial and hand findings.
      explanation: GeneReviews documents prominent neurodevelopmental and paroxysmal/motor neurologic manifestations as core features of Coffin-Lowry syndrome.
inheritance:
- name: X-linked dominant inheritance
  inheritance_term:
    preferred_term: X-linked dominant inheritance
    term:
      id: HP:0001423
      label: X-linked dominant inheritance
  description: >-
    Coffin-Lowry syndrome follows X-linked inheritance with severe expression in
    hemizygous males and variable clinical expression in heterozygous females;
    approximately two thirds of CLS-associated RPS6KA3 pathogenic variants arise
    de novo, while maternal heterozygotes carry a 50% transmission risk to male
    and female offspring and maternal germline mosaicism has been recognized as a
    counseling consideration.
  evidence:
  - reference: PMID:41589305
    reference_title: "Coffin-Lowry syndrome: a systematic review of RPS6KA3 confirmed cases and implications for diagnosis and counseling."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Coffin-Lowry syndrome (CLS) is a rare X-linked disorder caused by pathogenic variants in RPS6KA3, presenting with intellectual disability, distinctive facial and skeletal features, and variable systemic involvement.
    explanation: >-
      The systematic review directly supports X-linked inheritance and the core
      causal gene.
  - reference: PMID:20301520
    reference_title: "RPS6KA3-Related Intellectual Disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Heterozygous females often exhibit clinical manifestations that can be consistent with clinically defined CLS but are typically less severe than those seen in affected males.
    explanation: >-
      Explains why RPS6KA3-related Coffin-Lowry syndrome is classified as
      X-linked dominant with milder female heterozygote expression.
  - reference: PMID:20301520
    reference_title: "RPS6KA3-Related Intellectual Disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Approximately two thirds of pathogenic variants associated with CLS arise de novo, while the remainder are inherited.
    explanation: >-
      GeneReviews Genetic Counseling section quantifies the de novo (~2/3) versus
      inherited (~1/3) origin of RPS6KA3 pathogenic variants in Coffin-Lowry
      syndrome.
  - reference: PMID:20301520
    reference_title: "RPS6KA3-Related Intellectual Disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      If the mother of an affected male or female proband is known to have a pathogenic variant in RPS6KA3, each of the proband's male sibs has a 50% chance of being hemizygous for the variant and clinically affected, while each of the proband's female sibs has a 50% chance of being heterozygous for the variant and at high risk to exhibit at least some manifestations of the disorder.
    explanation: >-
      GeneReviews Genetic Counseling section establishes 50% sibling recurrence
      risk for hemizygous affected males and heterozygous females born to a
      carrier mother.
  - reference: PMID:41589305
    reference_title: "Coffin-Lowry syndrome: a systematic review of RPS6KA3 confirmed cases and implications for diagnosis and counseling."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The findings emphasize the value of comprehensive genomic testing, raise awareness of maternal germline mosaicism, and underscore the utility of reproductive technologies such as PGT-A/M for at-risk families.
    explanation: >-
      Systematic review highlights maternal germline mosaicism as an important
      recurrence-risk consideration in genetic counseling for Coffin-Lowry
      syndrome.

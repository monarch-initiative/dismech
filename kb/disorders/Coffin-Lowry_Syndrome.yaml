- name: Abnormal ERK-RSK2-Sp1 transcriptional signaling
  biological_scale: MOLECULAR
  description: >-
    RSK2 physiologically exerts feedback inhibition on ERK1/2 signaling. RSK2
    depletion causes abnormally elevated ERK1/2 phosphorylation and increased
    phosphorylation of transcription factor Sp1 (Thr453/Thr739) in neural-lineage
    cells and in Rsk2-knockout adult mouse hippocampus, altering Sp1-dependent
    gene transcription.

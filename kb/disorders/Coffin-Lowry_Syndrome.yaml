notes: >-
  Approximately two thirds of RPS6KA3 pathogenic variants associated with
  Coffin-Lowry syndrome arise de novo while one third are inherited, with
  maternal germline mosaicism noted as a counseling consideration in
  systematic-review cohorts (PMID:20301520; PMID:41589305). Heterozygous
  females display variable clinical expressivity that is typically milder than
  in hemizygous affected males.

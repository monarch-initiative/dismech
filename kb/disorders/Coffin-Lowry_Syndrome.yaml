name: Coffin-Lowry syndrome
creation_date: '2026-04-11T19:38:25Z'
category: Mendelian
description: >-
  Coffin-Lowry syndrome is an X-linked dominant neurodevelopmental and skeletal
  disorder caused by loss-of-function pathogenic variants in RPS6KA3, which
  encodes ribosomal protein S6 kinase A3 (RSK2). Deficiency of RSK2 perturbs
  downstream ERK1/2-Sp1 transcriptional regulation and glutamatergic AMPA
  receptor expression in neural tissue as well as skeletal development. Hemizygous
  males classically manifest global developmental delay, moderate-to-severe
  intellectual disability, characteristic craniofacial dysmorphism, soft hands
  with tapered fingers, postnatal short stature, progressive kyphoscoliosis and
  pectus deformity, hypotonia, seizures, and stimulus-induced drop episodes,
  whereas heterozygous females show variable, generally milder expressivity.
synonyms:
- Coffin-Lowry syndrome, X-linked dominant
- CLS
- Coffin Lowry Syndrome

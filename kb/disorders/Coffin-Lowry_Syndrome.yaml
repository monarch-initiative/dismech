  - reference: PMID:23389038
    reference_title: "Rsk2 Knockdown in PC12 Cells Results in Sp1 Dependent Increased Expression of the Gria2 Gene, Encoding the AMPA Receptor Subunit GluR2."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We show that Rsk2 silencing leads also to an elevation of ERK1/2 phosphorylation as well as of GluR2 expression and that the increased level of GluR2 expression results from the increased ERK1/2 activity on the transcription factor Sp1.
    explanation: >-
      Demonstrates in Rsk2-silenced PC12 cells that RSK2 loss disinhibits ERK1/2
      and drives Sp1-dependent transcriptional upregulation of Gria2/GluR2.
  - reference: PMID:23389038
    reference_title: "Rsk2 Knockdown in PC12 Cells Results in Sp1 Dependent Increased Expression of the Gria2 Gene, Encoding the AMPA Receptor Subunit GluR2."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Western blot analysis of total protein extracts from hippocampi of Rsk2-KO adult mice also revealed significantly increased levels of P-Sp1 (T453) as compared to WT littermate.
    explanation: >-
      Confirms in vivo in Rsk2-knockout adult mouse hippocampus that RSK2 loss
      increases Sp1 Thr453 phosphorylation, supporting hippocampal location for
      dysregulated ERK-Sp1 signaling.

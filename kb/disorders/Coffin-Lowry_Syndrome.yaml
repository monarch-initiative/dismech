    Coffin-Lowry syndrome is initiated by loss-of-function variants in the
    X-linked gene RPS6KA3, abolishing or attenuating the serine/threonine kinase
    activity of RSK2 at the distal end of the Ras-MAPK/ERK signaling cascade.

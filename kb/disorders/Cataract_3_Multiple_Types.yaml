      explanation: Genotype-phenotype observation for Q155X across populations.
  - name: R145W, Q147R, T150M (exon 5 gene conversion)
    description: Three exon 5 changes copied from CRYBB2P1 by a de novo gene conversion in an Ashkenazi Jewish family.
    evidence:
    - reference: PMID:25489230
      reference_title: "Congenital cataracts: de novo gene conversion event in CRYBB2."

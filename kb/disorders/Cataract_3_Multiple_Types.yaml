name: Cataract 3, Multiple Types
creation_date: "2026-10-31T12:00:00Z"
category: Mendelian
parents:
- Early-onset non-syndromic cataract
synonyms:
- CTRCT3
- cataract 3, multiple types
- cataract 3 multiple types
- CRYBB2 cataract
- CRYBB2-related cataract
- cataract (disease) caused by mutation in CRYBB2
- betaB2-crystallin cataract
description: >-
  Autosomal dominant, non-syndromic early-onset cataract caused by
  heterozygous variants in CRYBB2, which encodes betaB2-crystallin, the most
  abundant beta-crystallin of the lens fiber cell cytoplasm. The first allele,
  the exon 6 nonsense change Q155X, was found in 1997 in a family with
  cerulean cataract and has since been reported in many families of different
  ancestries. It is identical to the reference sequence of the adjacent
  pseudogene CRYBB2P1 and is thought to arise repeatedly by gene conversion.
  Missense alleles throughout the protein, in-frame deletions, further
  truncations and a splice-site variant have also been reported. The same
  allele can give clinically distinct opacities: cerulean (blue-dot),
  pulverulent, Coppock-like, coronary, nuclear, membranous, posterior
  subcapsular, posterior polar, cortical and total cataracts have all been
  described, often progressive and variable within a family. Cerulean
  cataract may leave vision good until adulthood, whereas dense congenital
  nuclear or total opacities need surgery in infancy and leave nystagmus and
  strabismus. Microcornea and microphthalmia occur in some patients.
  Biophysical and cellular studies of mutant betaB2-crystallin show reduced
  stability, disturbed oligomer assembly and intracellular aggregation, and
  Crybb2 mutant mice develop dominant progressive cataract. Management is
  surgical lens extraction.

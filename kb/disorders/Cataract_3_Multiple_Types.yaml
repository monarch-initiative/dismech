    evidence:
    - reference: PMID:15889016
      reference_title: "Interaction and biophysical properties of human lens Q155* betaB2-crystallin mutant."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The Q155* mutant shows decreased ordered structure and stability but the partially unfolded protein retains some dimer structure."
      explanation: The recombinant Q155X protein is partly unfolded and less stable.
    - reference: PMID:28528950
      reference_title: "Effects of cataract-causing mutations W59C and W151C on βB2-crystallin structure, stability and folding."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "two congenital cataract-causing mutations, W59C and W151C, dramatically decreased βB2-crystallin solubility and stability against thermal and guanidine hydrochloride-induced denaturation."
      explanation: Two patient missense alleles destabilize the recombinant protein.
- name: BetaB2-Crystallin Destabilization and Impaired Oligomer Assembly
  biological_scale: MOLECULAR
  conforms_to: cataract_lens_opacification#Loss of Crystallin Solubility and Chaperone Capacity
  description: >-
    Recombinant mutant betaB2-crystallins are less stable than wild type and
    assemble abnormally. Q155X loses ordered structure and interacts less
    with other crystallins; W59C and W151C lose solubility and stability;
    A2V slows tetramer formation; G119R and R188C shift the oligomer balance
    toward smaller species; and S31W, R145W and G149V loosen the fold and
    raise sensitivity to heat, UV and oxidative stress. Not every allele
    unfolds the protein: A2V leaves secondary and tertiary structure intact.
  cell_types:
  - preferred_term: lens fiber cell
    term:
      id: CL:0011004
      label: lens fiber cell
  biological_processes:
  - preferred_term: protein folding
    term:
      id: GO:0006457
      label: protein folding
    modifier: ABNORMAL
  - preferred_term: protein homooligomerization
    term:
      id: GO:0051260
      label: protein homooligomerization
    modifier: DECREASED
  evidence:
  - reference: PMID:15889016
    reference_title: "Interaction and biophysical properties of human lens Q155* betaB2-crystallin mutant."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We detected a decrease in protein-protein interactions for the Q155* betaB2-crystallin mutant."
    explanation: Q155X loses interactions with partner crystallins in a two-hybrid assay.
  - reference: PMID:23236454
    reference_title: "The congenital cataract-linked A2V mutation impairs tetramer formation and promotes aggregation of βB2-crystallin."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "However, the tetramerization of βB2-crystallin at high protein concentrations was retarded by the A2V mutation."
    explanation: A2V impairs higher-order homo-oligomer assembly.
  - reference: PMID:40585754
    reference_title: "Cataract-Causing Mutant R188C of βB2 Crystallin With Low Structural Stability is Sensitive to Environmental Stresses and Prone to Aggregates Formation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The mutation disrupted the oligomerization equilibrium, causing dissociation of dimers into monomers."
    explanation: R188C dissociates betaB2 dimers.
  - reference: PMID:40513746
    reference_title: "Cataract-causing variant G119R impaired the oligomeric homeostasis of βB2-crystallin with lower structural stability and more sensitivity to the environmental stress."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "As a result, this mutation disrupted the oligomerization balance of βB2-crystallin and reduced both its structural and thermal stability."
    explanation: G119R destabilizes the protein and its oligomers.
  - reference: PMID:30219234
    reference_title: "Introduction of an extra tryptophan fluorophore by cataract-associating mutations destabilizes βB2-crystallin and promotes aggregation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Both mutations impaired oligomerization, decreased stability and promote thermal aggregation, while S31W was more deleterious."
    explanation: S31W and R145W impair oligomerization and stability.
  - reference: PMID:37238733
    reference_title: "Insight into Pathogenic Mechanism Underlying the Hereditary Cataract Caused by βB2-G149V Mutation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The G149V mutation made the protein structure loose and the interaction between oligomers was reduced, which decreased the stability of the protein."
    explanation: G149V loosens the fold and weakens oligomer contacts.
  downstream:
  - target: BetaB2-Crystallin Aggregation in Lens Cells
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:37238733
      reference_title: "Insight into Pathogenic Mechanism Underlying the Hereditary Cataract Caused by βB2-G149V Mutation."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We found that the G149V mutation makes βB2-crystallin more sensitive to environmental stresses (oxidative stress, UV irradiation, and heat shock) and more likely to aggregate and form precipitation."
      explanation: The destabilized protein aggregates under stress.
    - reference: PMID:40585754
      reference_title: "Cataract-Causing Mutant R188C of βB2 Crystallin With Low Structural Stability is Sensitive to Environmental Stresses and Prone to Aggregates Formation."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "In summary, the R188C mutation promotes abnormal aggregation by destabilizing βB2-crystallin and disrupting oligomerization equilibrium, potentially leading to cataract formation."
      explanation: The authors link destabilization and disturbed oligomers to aggregation.
- name: BetaB2-Crystallin Aggregation in Lens Cells
  biological_scale: CELLULAR
  conforms_to: cataract_lens_opacification#Crystallin Aggregation and High-Molecular-Weight Complex Deposition
  description: >-
    Mutant betaB2-crystallin forms intracellular aggregates when expressed in
    human lens epithelial cells and other cells, and lentoid bodies grown
    from a patient's induced pluripotent stem cells (P24T) show more protein
    aggregation and less soluble protein. Alpha-B crystallin and the sterol
    lanosterol partly reduce aggregation of R188C and W151R in vitro, which
    is consistent with alpha-crystallin chaperone capacity limiting
    aggregation in the lens.
  cell_types:
  - preferred_term: lens fiber cell
    term:
      id: CL:0011004
      label: lens fiber cell
  - preferred_term: lens epithelial cell
    term:
      id: CL:0002224
      label: lens epithelial cell
  evidence:
  - reference: PMID:24312286
    reference_title: "A missense mutation in CRYBB2 leads to progressive congenital membranous cataract by impacting the solubility and function of βB2-crystallin."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Wt-βB2-crystallin was evenly distributed throughout the cells, whereas approximately 34.7% of cells transfected with the W151C mutant βB2-crystallin formed intracellular aggregates."
    explanation: W151C aggregates in human lens epithelial cells.
  - reference: PMID:33246011
    reference_title: "βB2 W151R mutant is prone to degradation, aggregation and exposes the hydrophobic side chains in the fourth Greek Key motif."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Due to its low solubility and poor structural stability, the βB2 W151R mutation was prone to aggregation."
    explanation: W151R is insoluble and aggregation-prone.
  - reference: PMID:40585754
    reference_title: "Cataract-Causing Mutant R188C of βB2 Crystallin With Low Structural Stability is Sensitive to Environmental Stresses and Prone to Aggregates Formation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Notably, lanosterol treatment or αB-crystallin partially reversed aggregation."
    explanation: A chaperone partly prevents R188C aggregation.
  - reference: PMID:34599192
    reference_title: "Modeling congenital cataract in vitro using patient-specific induced pluripotent stem cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Increased protein aggregation and decreased protein solubility corresponding to the patients' cataract severity were observed in the patient-specific LBs and were attenuated by lanosterol treatment."
    explanation: Patient iPSC-derived lentoid bodies carrying CRYBB2 P24T aggregate protein.
  downstream:

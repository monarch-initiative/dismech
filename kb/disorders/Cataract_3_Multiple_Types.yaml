genetic:
- name: CRYBB2
  gene_term:
    preferred_term: CRYBB2
    term:
      id: hgnc:2398
      label: CRYBB2
  relationship_type: CAUSATIVE
  association: Causative
  variant_origin: GERMLINE
  presence: PRESENT
  notes: >-
    The recurrent Q155X allele is numbered c.463C>T or c.475C>T in different
    reports. CRYBB2P1 is over 97% identical to CRYBB2, so short-read
    sequencing can mismap reads between them, and gene-specific primers are
    needed to confirm an exon 5 or exon 6 call. No ClinGen gene-disease
    validity record for CRYBB2 is cached in this repository, so
    gene_disease_validity is omitted; the published ClinGen-protocol curation
    cited below is not a ClinGen-issued assertion. One consanguineous
    Pakistani family had recessive nuclear cataract from a homozygous 228-kb
    deletion that fuses CRYBB2 exons 1 to 5 to the Q155X-carrying exon 6 of
    CRYBB2P1, with unaffected heterozygous carriers; that family is described
    here but recessive inheritance is not asserted for this dominant entry.
  evidence:
  - reference: PMID:9158139
    reference_title: "Autosomal dominant cerulean cataract is associated with a chain termination mutation in the human beta-crystallin gene CRYBB2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we report that a chain-termination mutation in CRYBB2 is associated with ADCC in this family."
    explanation: First report implicating CRYBB2.
  - reference: PMID:8812489
    reference_title: "A second gene for cerulean cataracts maps to the beta crystallin region on chromosome 22."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report linkage in this family to the region on chromosome 22q that includes two beta crystallin genes (CRYBB2, CRYBB3) and one pseudogene (CRYBB2P1)."
    explanation: Linkage of the first cerulean cataract family to the beta-crystallin cluster.
  - reference: PMID:22312185
    reference_title: "Identification of a novel CRYBB2 missense mutation causing congenital autosomal dominant cataract."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This variant cosegregated with the disease phenotype in all affected individuals but was not present in the unaffected family members and 100 healthy control subjects."
    explanation: R188H segregates with cataract in a Croatian family.
  - reference: PMID:42091610
    reference_title: "Evaluating gene-disease relationship strength in crystallin genes in association with pediatric cataracts."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Seven genes (CRYAA, CRYAB, CRYBA1, CRYBB1, CRYBB2, CRYGC, CRYGD) scored as Definitively associated with autosomal dominant (AD) inherited pediatric cataracts."
    explanation: Published curation using ClinGen protocols scores CRYBB2 as definitive for dominant pediatric cataract.
  - reference: PMID:25489230
    reference_title: "Congenital cataracts: de novo gene conversion event in CRYBB2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The identification of these changes was complicated by possible mismapping of some mutated CRYBB2 sequences to CRYBB2P1."
    explanation: Pseudogene homology complicates variant detection by exome sequencing.
  - reference: PMID:36075891
    reference_title: "A genomic deletion encompassing CRYBB2-CRYBB2P1 is responsible for autosomal recessive congenital cataracts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All three affected individuals were homozygous for the variant, whereas unaffected individuals were either heterozygous or homozygous for the wild-type allele"
    explanation: Recessive CRYBB2-CRYBB2P1 fusion family in which heterozygous carriers are unaffected.
  variants:
  - name: Q155X (c.463C>T)
    description: >-
      Recurrent exon 6 nonsense allele identical to the CRYBB2P1 sequence;
      cerulean, Coppock-like, pulverulent, coronary and polymorphic
      opacities in families of many ancestries.
    evidence:
    - reference: PMID:19321936
      reference_title: "Autosomal-dominant cerulean cataract in a chinese family associated with gene conversion mutation in beta-B2-crystallin."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "By sequencing, a cytosine to thymine transition (NM_000496.2:c.463C>T) was detected in exon 6 of CRYBB2, which resulted in the insertion of a premature stop codon (p.Q155X)."
      explanation: HGVS description of the recurrent allele.
    - reference: PMID:27385965
      reference_title: "Whole Exome Sequencing Reveals a Mutation in CRYBB2 in a Large Mexican Family with Autosomal Dominant Pulverulent Cataract."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL

    explanation: Exome sequencing with Sanger confirmation identified the E167X allele.
animal_models:
- name: Philly mouse
  species: Mouse
  genotype: Crybb2 Philly, in-frame 12-nucleotide deletion removing four amino acids near the C-terminus
  publication: PMID:1707874
  description: >-
    Inherited cataract strain whose betaB2-crystallin lacks four residues in
    the region needed for the C-terminal domain fold, giving an unstable
    protein.
  modeled_mechanisms:
  - target: Loss of Lens Transparency
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    limitations: >-
      The deletion is not a human allele, and the abstract proposes rather
      than shows that the abnormal protein causes the cataract.
    evidence:
    - reference: PMID:1707874
      reference_title: "Deletion mutation in an eye lens beta-crystallin. An animal model for inherited cataracts."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "An in-frame deletion of 12 nucleotides has occurred in the Philly mouse cDNA, which results in the loss of 4 amino acids."
      explanation: Defines the Philly Crybb2 lesion.
- name: Crybb2 Aey2 mouse
  species: Mouse
  genotype: Crybb2 Aey2, ENU-induced c.553T>A (Val to Glu) in exon 6; dominant
  publication: PMID:11381063
  description: >-
    Dominant progressive cataract, cortical at eye opening, then anterior
    sutural, and total by 8 weeks; heterozygotes and homozygotes do not
    differ obviously.
  modeled_mechanisms:
  - target: Loss of Lens Transparency
    relationship: RECAPITULATES
    fidelity: MODERATE
    limitations: >-
      The mouse allele is not a human variant, and the mouse cataract becomes
      total within weeks, faster than most human CRYBB2 cataracts.
    evidence:
    - reference: PMID:11381063
      reference_title: "Aey2, a new mutation in the betaB2-crystallin-encoding gene of the mouse."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The cortical opacification visible at eye opening progressed to an anterior suture cataract and reached its final phenotype as total opacity at 8 weeks of age."
      explanation: Progressive dominant cataract from a Crybb2 point mutation.
- name: Crybb2 O377 mouse
  species: Mouse
  genotype: Crybb2 O377, intron 5 splice acceptor change adding 19 amino acids in exon 6; dominant
  publication: PMID:18385073
  description: >-
    Radiation-induced dominant cataract allele that alters the fourth Greek
    key motif through aberrant splicing.
  modeled_mechanisms:
  - target: CRYBB2 Pathogenic Variant
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    limitations: >-
      The abstract reports the molecular lesion and brain expression rather
      than a detailed lens phenotype, and the allele is not a human variant.
    evidence:
    - reference: PMID:18385073
      reference_title: "Novel allele of crybb2 in the mouse and its expression in the brain."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "It led to alternative splicing with a 57-bp insertion in the mRNA and to 19 additional amino acids in the protein."
      explanation: A third dominant Crybb2 allele affecting exon 6.
- name: Crybb2 knockout mouse
  species: Mouse
  genotype: Crybb2 targeted deletion
  publication: PMID:18719080
  description: >-
    Lenses develop normally but are smaller and develop cortical cataract
    months after birth that worsens with age, with lower resistance of
    crystallins to heat and oxidative stress.
  modeled_mechanisms:
  - target: Loss of Lens Transparency
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    limitations: >-
      Complete absence of betaB2-crystallin is not the human genotype, and
      the late-onset cataract differs from the congenital dominant disease;
      it shows that loss of the protein can cause opacity, not that human
      alleles act by loss of function.
    evidence:
    - reference: PMID:18719080
      reference_title: "Targeted knockout of the mouse betaB2-crystallin gene (Crybb2) induces age-related cataract."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "BetaB2-crystallin is not essential for the normal development of a transparent lens in the mouse."
      explanation: Loss of betaB2 spares development, consistent with a later role in transparency.
- name: Zebrafish crybb2 disruption
  species: Zebrafish
  genotype: crybb2 disruption in zebrafish larvae
  publication: PMID:41989229
  description: >-
    Disruption of zebrafish crybb2, studied alongside a human splice-site
    allele, causes lens fiber differentiation defects and abnormal hyaloid
    vessel patterning, partly rescued by crybb2 mRNA.
  modeled_mechanisms:
  - target: Loss of Lens Transparency
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    limitations: >-
      Gene disruption in zebrafish models loss of crybb2 rather than a
      heterozygous human allele, and the hyaloid vascular findings have not
      been examined in patients.
    evidence:
    - reference: PMID:41989229
      reference_title: "A Novel CRYBB2 Splicing Mutation Is Associated With Lens Extracellular Matrix Remodeling and Vascular Alterations in Congenital Cataract."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In zebrafish, crybb2 disruption caused lens fiber cell differentiation defects and was accompanied by abnormal hyaloid vascular patterning and altered tracer distribution around the lens; these phenotypes were partially improved by crybb2 mRNA rescue."
      explanation: Lens defects after crybb2 disruption with partial rescue.

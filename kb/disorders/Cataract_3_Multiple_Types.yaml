inheritance:
- name: Autosomal Dominant
  description: >-
    Heterozygous CRYBB2 variants segregate with cataract in multigenerational
    families with full penetrance in most reports. A de novo gene conversion
    event has been documented in one family.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:10634616
    reference_title: "Genetic heterogeneity of the Coppock-like cataract: a mutation in CRYBB2 on chromosome 22q11.2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The disease was autosomal dominant and appeared to be fully penetrant."
    explanation: Dominant, fully penetrant transmission of the CRYBB2 Q155X Coppock-like cataract in a Swiss family.
  - reference: PMID:16179907
    reference_title: "Progressive polymorphic congenital cataract caused by a CRYBB2 mutation in a Chinese family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutation screening of the CRYBB2 gene in this family revealed an C-->T transition at position 475 (Q155X) of the cDNA sequence, creating a novel SpeI restriction site that cosegregated with affected members of the pedigree, but was not present in unaffected members or any of the 100 unrelated individuals tested."
    explanation: Heterozygous Q155X co-segregates with cataract across a five-generation family.
  - reference: PMID:25489230
    reference_title: "Congenital cataracts: de novo gene conversion event in CRYBB2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our data are consistent with a de novo gene conversion event, transferring 270 base pairs at most from CRYBB2P1 to exon 5 of CRYBB2."
    explanation: A new dominant allele arose de novo by gene conversion and then segregated with cataract.
pathophysiology:
- name: CRYBB2 Pathogenic Variant
  biological_scale: MOLECULAR
  conforms_to: cataract_lens_opacification#Lens Homeostasis Insult
  description: >-
    Heterozygous variants in CRYBB2. The recurrent exon 6 nonsense allele
    Q155X (c.463C>T, also numbered c.475C>T) truncates the protein within
    the fourth Greek key motif. It, and the exon 5 changes R145W, Q147R and
    T150M, match the sequence of the pseudogene CRYBB2P1 about 230 kb away
    and are explained by gene conversion from the pseudogene. Other alleles
    are missense changes across both domains (for example A2V, I21N, S31W,
    W59C, G119R, D128V, S143F, V146L, G149V, W151C, W151R, V187M, R188H,
    R188C) and further truncations such as Y154* and E167X. Most alleles
    cluster in exons 5 and 6, which encode the C-terminal domain.
  genes:
  - preferred_term: CRYBB2
    term:
      id: hgnc:2398
      label: CRYBB2
  molecular_functions:
  - preferred_term: structural constituent of eye lens
    term:
      id: GO:0005212
      label: structural constituent of eye lens
    modifier: ABNORMAL
    description: >-
      BetaB2-crystallin is a densely packed, soluble structural protein of
      the lens. Mutant protein is still made but is destabilized or
      aggregation-prone, so the structural role is altered qualitatively
      rather than only reduced; hence ABNORMAL.
  cell_types:
  - preferred_term: lens fiber cell
    term:
      id: CL:0011004
      label: lens fiber cell
  evidence:
  - reference: PMID:9158139
    reference_title: "Autosomal dominant cerulean cataract is associated with a chain termination mutation in the human beta-crystallin gene CRYBB2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we report that a chain-termination mutation in CRYBB2 is associated with ADCC in this family."
    explanation: First disease-causing CRYBB2 allele, Q155X, in a cerulean cataract family.
  - reference: PMID:17234267
    reference_title: "Gene conversion mutation in crystallin, beta-B2 (CRYBB2) in a Chilean family with autosomal dominant cataract."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "as the 2 variations in CRYBB2 are identical to the reference sequence of pseudogene CRYBB2P1, which has over 97% homology to CRYBB2, a gene conversion probably has occurred."
    explanation: The recurrent exon 6 allele matches the pseudogene sequence, pointing to gene conversion.
  - reference: PMID:19321936
    reference_title: "Autosomal-dominant cerulean cataract in a chinese family associated with gene conversion mutation in beta-B2-crystallin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This supports the possibility of gene conversion between CRYBB2 and CRYBB2P1 as a mechanism responsible for congenital cataract."
    explanation: Independent Chinese family with Q155X plus a pseudogene-identical synonymous change.
  - reference: PMID:15452067
    reference_title: "Mutation analysis of congenital cataracts in Indian families: identification of SNPS and a new causative allele in CRYBB2 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exon 6 of CRYBB2 appears to be a critical region susceptible for mutations leading to lens opacity."
    explanation: W151C in exon 6 in an Indian nuclear cataract family; the authors note the clustering of alleles in exon 6.
  - reference: PMID:29395391
    reference_title: "A CRYBB2 mutation in a Taiwanese family with autosomal dominant cataract."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The Q155 residue is 100% conserved across the evolutionary tree, indicating its crucial function."
    explanation: Conservation of the residue truncated by the recurrent allele.
  downstream:

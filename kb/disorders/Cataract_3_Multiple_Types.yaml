- name: Loss of Lens Transparency
  biological_scale: TISSUE
  conforms_to: cataract_lens_opacification#Loss of Lens Refractive Transparency and Light Scattering
  description: >-
    Aggregated betaB2-crystallin and damaged lens cells scatter light. In
    patients the result is a lens opacity whose morphology varies widely
    with the same allele, which led the first authors to propose an
    unidentified modifier. Dominant Crybb2 mouse alleles that alter exon 6
    and the fourth Greek key motif (Philly, Aey2, O377) are associated with
    progressive cataract, and Crybb2 knockout mice develop age-related
    cortical cataract.

discussions:
- discussion_id: crybb2_q155x_dominance
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#CRYBB2 Pathogenic Variant
  - inheritance#Autosomal Dominant
  prompt: >-
    Why does heterozygous Q155X cause dominant cataract when it arises by
    gene conversion, while heterozygous carriers of a CRYBB2-CRYBB2P1 fusion
    carrying the same exon 6 stop codon are unaffected?
  rationale: >-
    Q155X segregates as a dominant trait in many families, which together
    with the biophysical data suggests a harmful truncated protein. In one
    recessive family the same stop codon sits in a fusion gene whose 3' end
    comes from the pseudogene, and only homozygotes are affected; the authors
    suggest the fusion transcript may be unstable, but this has not been
    tested. Knockout mice show that loss of betaB2 alone causes a later
    cataract. Whether dominant alleles act by a toxic gain or a
    dominant-negative effect, and what level of mutant protein is needed, is
    unresolved.
  evidence:
  - reference: PMID:36075891
    reference_title: "A genomic deletion encompassing CRYBB2-CRYBB2P1 is responsible for autosomal recessive congenital cataracts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The precise pathogenic mechanism of cataractogenesis due to the fusion of CRYBB2 and CRYBB2P1 remains unclear."
    explanation: The authors state the mechanism of the fusion allele is unknown.
  - reference: PMID:36075891
    reference_title: "A genomic deletion encompassing CRYBB2-CRYBB2P1 is responsible for autosomal recessive congenital cataracts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All three affected individuals were homozygous for the variant, whereas unaffected individuals were either heterozygous or homozygous for the wild-type allele"
    explanation: Heterozygous fusion carriers are unaffected.
- discussion_id: crybb2_phenotypic_variability
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Loss of Lens Transparency
  prompt: >-
    What modifies the opacity produced by one CRYBB2 allele, so that Q155X
    gives cerulean, Coppock-like, pulverulent or coronary cataract in
    different families?
  rationale: >-
    The same allele produces clinically distinct cataracts, and the first
    authors proposed a modifier factor that remains unidentified. Nothing in
    this entry explains how the site or pattern of opacity is determined.
  evidence:
  - reference: PMID:10634616
    reference_title: "Genetic heterogeneity of the Coppock-like cataract: a mutation in CRYBB2 on chromosome 22q11.2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This work provides evidence for a modifier factor that influences cataract formation and that remains to be identified."
    explanation: Authors propose an unidentified modifier.
- discussion_id: crybb2_ocular_growth
  kind: KNOWLEDGE_GAP
  attaches_to:
  - phenotypes#Microcornea
  - phenotypes#Microphthalmia
  - phenotypes#Increased axial length of the globe
  prompt: >-
    How does a mutant lens crystallin alter the size of the cornea or globe?
  rationale: >-
    Microcornea and microphthalmia occur in some CRYBB2 patients and axial
    elongation in one family, but the mechanistic studies here describe only
    protein aggregation and lens cell stress. A zebrafish study links crybb2
    loss to abnormal hyaloid vessel patterning, but nothing connects these
    lens events to eye growth in patients, so these phenotypes have no causal
    edge.
  evidence:
  - reference: PMID:42919179
    reference_title: "Variants and genotype-phenotype correlation of CRYBB2 gene in eight Chinese families with congenital cataract and other congenital ocular anomalies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three of eight patients (37.5%) exhibited microcornea and/or microphthalmia"
    explanation: Ocular growth anomalies co-occur with CRYBB2 cataract.
notes: >-
  No GeneReviews chapter covers non-syndromic CRYBB2 cataract. Sutural
  opacities with cerulean features were reported with Q155X in an Indian
  family (PMID:11424921), but no quotable text was retrieved for that record,
  so it is not cited as evidence. The Coppock-like dust-like opacity has no
  specific HPO term and is carried under Pulverulent cataract. Cataract 2,
  multiple types (CRYGC) and Cataract 4, multiple types (CRYGD) are curated
  separately.

treatments:
- name: Cataract Surgery
  description: >-
    Lens extraction is the standard management of visually significant
    CRYBB2 cataract. Dense congenital opacities are removed in infancy,
    whereas cerulean cataract may not need surgery until adulthood. For
    dense bilateral congenital cataract, the timing of surgery in the first
    weeks of life governs visual outcome; that evidence comes from cohorts
    that were not genotyped. No CRYBB2-specific therapy exists; lanosterol
    reduces mutant betaB2 aggregation only in vitro.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: cataract surgery
    term:
      id: NCIT:C157809
      label: Cataract Surgery
  target_phenotypes:
  - preferred_term: Developmental cataract
    term:
      id: HP:0000519
      label: Developmental cataract
  evidence:
  - reference: PMID:34650623
    reference_title: "Whole-exome sequencing identification of a recurrent CRYBB2 variant in a four-generation Chinese family with congenital nuclear cataracts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the proband IV.1 was a 4-year-old boy who was found to have congenital binocular nuclear cataracts at birth and underwent cataract phacoemulsification without intraocular lens implantation at the age of 2 months"
    explanation: Early lens extraction in an I21N carrier.
  - reference: PMID:9158139
    reference_title: "Autosomal dominant cerulean cataract is associated with a chain termination mutation in the human beta-crystallin gene CRYBB2."

      snippet: "Mutation screening of the candidate genes detected a heterozygous c.465G → C change in the exon6 of the βB2-crystallin gene (CRYBB2) in all family members affected with cataracts, resulting in the substitution of a highly conserved Tryptophan to Cystine (p.W151C)."

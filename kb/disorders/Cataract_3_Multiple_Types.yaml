    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sequencing with gene-specific primers confirmed that the changes"
    explanation: Gene-specific primers were needed to confirm exome calls against the pseudogene.
  - reference: PMID:28025620

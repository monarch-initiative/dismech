    CRYBB2 cataract is diagnosed by sequencing, usually exome or a multigene
    cataract panel, with Sanger confirmation and family segregation. Because
    CRYBB2P1 is nearly identical, reads can mismap and exon 5 and 6 calls
    should be confirmed with gene-specific primers. Lens morphology does not
    identify the gene.

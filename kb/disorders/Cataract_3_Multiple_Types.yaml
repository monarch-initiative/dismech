phenotypes:
- category: Ophthalmologic
  name: Developmental cataract
  description: >-
    Bilateral lens opacity present at birth or arising in childhood. Dense
    nuclear or total opacities may need surgery in the first weeks or months
    of life.
  phenotype_term:
    preferred_term: Congenital cataract
    term:
      id: HP:0000519
      label: Developmental cataract
  evidence:
  - reference: PMID:17653036
    reference_title: "Mutation analysis in a German family identified a new cataract-causing allele in the CRYBB2 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Her two children (a boy and a girl) also suffer from congenital cataracts and have been operated within the first weeks of birth."
    explanation: Congenital cataract in a German D128V family.
  - reference: PMID:42919179
    reference_title: "Variants and genotype-phenotype correlation of CRYBB2 gene in eight Chinese families with congenital cataract and other congenital ocular anomalies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The associated cataract phenotypes included total cataract, cerulean cataract, and perinuclear cataract."
    explanation: Congenital cataract, including total cataract, in eight Chinese families with CRYBB2 variants.
  sequelae:
  - target: Nystagmus
    description: >-
      A dense opacity in early infancy deprives the developing visual system
      of a formed image; nystagmus follows, more often when surgery is
      delayed.
    evidence:
    - reference: PMID:19084444
      reference_title: "The critical period for surgical treatment of dense congenital bilateral cataracts."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: "Surgery after 4 weeks was associated with a greater prevalence of strabismus and nystagmus than surgery before 4 weeks"
      explanation: >-
        Cohort of infants with dense bilateral congenital cataract of
        unspecified cause; indirect because it was not genotyped for CRYBB2.
  - target: Esotropia
    description: Strabismus develops after early visual deprivation from a dense opacity.
    evidence:
    - reference: PMID:19084444
      reference_title: "The critical period for surgical treatment of dense congenital bilateral cataracts."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: "Surgery after 4 weeks was associated with a greater prevalence of strabismus and nystagmus than surgery before 4 weeks"
      explanation: >-
        Cohort of infants with dense bilateral congenital cataract of
        unspecified cause; indirect because it was not genotyped for CRYBB2,
        and the cohort reports strabismus without specifying esotropia.

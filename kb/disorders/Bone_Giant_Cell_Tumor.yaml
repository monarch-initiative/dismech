pathophysiology:
- name: Somatic H3-3A G34W Oncohistone Mutation in Mesenchymal Stromal Cells
  description: >-
    The initiating and, in conventional GCTB, essentially the only recurrent
    genetic lesion is a somatic missense mutation at codon 34 of histone H3.3,
    canonically H3-3A (H3F3A) c.103G>T p.Gly34Trp. Critically for everything
    downstream, the mutation is confined to the mononuclear mesenchymal stromal
    cell population and is absent from the osteoclast-like giant cells and
    their myelomonocytic precursors: the cells that give the tumor its name are
    not the tumor. Rarer substitutions at the same codon (G34L, G34V, G34R)
    account for a small remainder of cases.
  biological_scale: MOLECULAR
  role: trigger
  cell_types:
  - preferred_term: Neoplastic mesenchymal stromal cell
    term:
      id: CL:0000134
      label: mesenchymal stem cell
  evidence:
  - reference: PMID:24162739
    reference_title: Distinct H3F3A and H3F3B driver mutations define chondroblastoma and giant cell tumor of bone.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      in 92% (49/53) of giant cell tumors of bone, we found histone H3.3
      alterations exclusively in H3F3A, leading to p.Gly34Trp or, in one case,
      p.Gly34Leu alterations
    explanation: >-
      Establishes the H3F3A G34 substitution, predominantly G34W, as the
      near-universal recurrent driver of GCTB.
  - reference: PMID:24162739
    reference_title: Distinct H3F3A and H3F3B driver mutations define chondroblastoma and giant cell tumor of bone.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The mutations were restricted to the stromal cell population and were not
      detected in osteoclasts or their precursors.
    explanation: >-
      Directly localizes the driver mutation to the stromal compartment and
      excludes the giant cells, which is the mechanistic premise of every
      downstream node in this entry.
  - reference: PMID:32967858
    reference_title: H3.3 G34W Promotes Growth and Impedes Differentiation of Osteoblast-Like Mesenchymal Progenitors in Giant Cell Tumor of Bone.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Glycine 34-to-tryptophan (G34W) substitutions in H3.3 arise in
      approximately 90% of giant cell tumor of bone (GCT). Here, we show H3.3
      G34W is necessary for tumor formation.
    explanation: >-
      CRISPR-Cas9 editing of patient-derived cells establishes that G34W is not
      merely a marker but is required for tumor formation.
  - reference: PMID:33021329
    reference_title: H3F3A G34 mutation DNA sequencing and G34W immunohistochemistry analysis in 366 cases of giant cell tumors of bone and other bone tumors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      DNA sequencing results revealed H3F3A mutations in 95.00% of GCTBs
      (171/180), including glycine 34 to tryptophan (G34W, 163/180, 90.56%),
      glycine 34 to leucine (G34L, 3/180, 1.67%), glycine 34 to valine (G34V,
      3/180, 1.67%), and glycine 34 to arginine (G34R, 2/180, 1.11%).
    explanation: >-
      Quantifies the mutational spectrum at codon 34 in a large sequenced
      series, supporting G34W dominance and the rarer alternative substitutions.
  downstream:
  - target: Genome-Wide Epigenetic Reprogramming by Mutant Histone H3.3
    causal_link_type: DIRECT
    description: >-
      Mutant H3.3 is incorporated into chromatin and perturbs the histone-mark
      landscape from within the nucleosome.
    evidence:
    - reference: PMID:33110075
      reference_title: Globally altered epigenetic landscape and delayed osteogenic differentiation in H3.3-G34W-mutant giant cell tumor of bone.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: in patient-derived stromal cells H3.3-G34W is incorporated into the chromatin and associates with massive epigenetic alterations on the DNA methylation, chromatin accessibility and histone modification level
      explanation: Shows chromatin incorporation of the mutant histone producing the genome-wide epigenetic change this edge asserts.

- name: Genome-Wide Epigenetic Reprogramming by Mutant Histone H3.3
  description: >-
    Incorporated H3.3-G34W acts in cis on its own tail - the bulky tryptophan at
    position 34 impairs H3K36 trimethylation of the mutant histone - and the
    consequences propagate genome-wide. The repressive H3K27me3 mark is
    redistributed from intergenic to genic regions, and DNA methylation,
    chromatin accessibility, and other histone modifications shift with it,
    most markedly over heterochromatic and bivalent domains. The result is
    aberrant transcription across a broad program rather than dysregulation of
    a single target gene.
  biological_scale: MOLECULAR
  role: mediator
  biological_processes:
  - preferred_term: Chromatin remodeling
    term:
      id: GO:0006338
      label: chromatin remodeling
    modifier: ABNORMAL
  - preferred_term: Heterochromatin organization
    term:
      id: GO:0070828
      label: heterochromatin organization
    modifier: ABNORMAL
  evidence:
  - reference: PMID:32967858
    reference_title: H3.3 G34W Promotes Growth and Impedes Differentiation of Osteoblast-Like Mesenchymal Progenitors in Giant Cell Tumor of Bone.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      we show that H3.3K36me3 loss on mutant H3.3 alters the deposition of the
      repressive H3K27me3 mark from intergenic to genic regions, beyond areas of
      H3.3 deposition
    explanation: >-
      States the specific chromatin-mark redistribution that defines this node,
      including its spread beyond sites of mutant H3.3 deposition.
  - reference: PMID:33110075
    reference_title: Globally altered epigenetic landscape and delayed osteogenic differentiation in H3.3-G34W-mutant giant cell tumor of bone.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      in patient-derived stromal cells H3.3-G34W is incorporated into the
      chromatin and associates with massive epigenetic alterations on the DNA
      methylation, chromatin accessibility and histone modification level
    explanation: >-
      Independently confirms genome-wide, multi-layer epigenetic disruption in
      patient-derived stromal cells.
  - reference: PMID:33110075
    reference_title: Globally altered epigenetic landscape and delayed osteogenic differentiation in H3.3-G34W-mutant giant cell tumor of bone.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These epigenetic alterations affect mainly heterochromatic and bivalent
      regions and provide possible explanations for the genomic instability, as
      well as the osteolytic phenotype of GCTB.
    explanation: >-
      Localizes the changes to heterochromatic and bivalent domains and links
      them to the osteolytic phenotype curated downstream.
  downstream:
  - target: Arrested Osteogenic Differentiation of the Neoplastic Stroma
    causal_link_type: DIRECT
    description: >-
      Aberrant transcription redirects mesenchymal cell fate away from mature
      osteoblastic differentiation.
    evidence:
    - reference: PMID:32967858
      reference_title: H3.3 G34W Promotes Growth and Impedes Differentiation of Osteoblast-Like Mesenchymal Progenitors in Giant Cell Tumor of Bone.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: This promotes redistribution of other chromatin marks and aberrant transcription, altering cell fate in mesenchymal progenitors and hindering differentiation.
      explanation: States the causal step from chromatin-mark redistribution to altered mesenchymal cell fate and impaired differentiation.
  - target: Enhancer-Level SCUBE3 Repression
    causal_link_type: DIRECT
    description: >-
      Mutant-H3.3 enrichment and altered histone marks at SCUBE3 enhancers
      silence a paracrine restraint on osteoclast recruitment.
    evidence:
    - reference: PMID:36138226
      reference_title: Aberrant paracrine signalling for bone remodelling underlies the mutant histone-driven giant cell tumour of bone.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Transcriptional changes in SCUBE3 are associated with altered histone marks and H3.3G34W enrichment at its enhancer regions.
      explanation: Links the altered histone marks to SCUBE3 transcriptional repression, the specific edge curated here.

- name: Arrested Osteogenic Differentiation of the Neoplastic Stroma
  description: >-
    The mutation arises in a differentiating mesenchymal stem cell and holds it
    short of mature osteoblast identity. Mutant stromal cells retain
    proliferative capacity while failing to complete osteogenic differentiation,
    tracing a neoplastic trajectory from an SPP1-positive osteoblast-like
    progenitor state toward an ACTA2-positive myofibroblast-like state that
    secretes the matrix ligands recruiting osteoclasts. This is the neoplastic
    compartment of the tumor, and it is histologically the least conspicuous.
  biological_scale: CELLULAR
  role: mediator
  cell_types:
  - preferred_term: Osteoblast-like mesenchymal progenitor
    term:
      id: CL:0000134
      label: mesenchymal stem cell
  biological_processes:
  - preferred_term: Osteoblast differentiation
    term:
      id: GO:0001649
      label: osteoblast differentiation
    modifier: DECREASED
  - preferred_term: Stromal cell proliferation
    term:
      id: GO:0008283
      label: cell population proliferation
    modifier: INCREASED
  evidence:
  - reference: PMID:33110075
    reference_title: Globally altered epigenetic landscape and delayed osteogenic differentiation in H3.3-G34W-mutant giant cell tumor of bone.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The mutation occurs in differentiating mesenchymal stem cells and
      associates with an impaired osteogenic differentiation.
    explanation: >-
      Identifies the cell of origin as a differentiating mesenchymal stem cell
      and the differentiation block that defines this node.
  - reference: PMID:32967858
    reference_title: H3.3 G34W Promotes Growth and Impedes Differentiation of Osteoblast-Like Mesenchymal Progenitors in Giant Cell Tumor of Bone.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      This promotes redistribution of other chromatin marks and aberrant
      transcription, altering cell fate in mesenchymal progenitors and hindering
      differentiation.
    explanation: >-
      Connects the upstream epigenetic node to the altered mesenchymal cell fate
      and differentiation block curated here.
  - reference: PMID:32967858
    reference_title: H3.3 G34W Promotes Growth and Impedes Differentiation of Osteoblast-Like Mesenchymal Progenitors in Giant Cell Tumor of Bone.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Single-cell transcriptomics reveals that H3.3 G34W stromal cells
      recapitulate a neoplastic trajectory from a SPP1+ osteoblast-like
      progenitor population toward an ACTA2+ myofibroblast-like population,
      which secretes extracellular matrix ligands predicted to recruit and
      activate osteoclasts.
    explanation: >-
      Provides the single-cell resolved identity of the neoplastic stromal
      compartment and its link to osteoclast recruitment.
  - reference: PMID:22662295
    reference_title: 'Modern interpretation of giant cell tumor of bone: predominantly osteoclastogenic stromal tumor.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The modern interpretation of GCT is predominantly osteoclastogenic stromal
      cell tumors of mesenchymal origin.
    explanation: >-
      Review framing that the neoplastic compartment is the mesenchymal stromal
      cell, not the giant cell. Evidence source is OTHER because this is a
      review article.
  downstream:
  - target: Stromal RANKL Overexpression
    causal_link_type: DIRECT
    description: >-
      The arrested, transformed stroma expresses RANKL and monocyte-recruiting
      chemokines at levels that drive osteoclastogenesis.

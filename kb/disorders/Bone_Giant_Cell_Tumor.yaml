experimental_models:
- name: Patient-derived GCTB stromal cell culture
  description: >-
    Primary mononuclear stromal cells outgrown from surgical GCTB specimens,
    carrying the endogenous H3.3-G34W mutation at physiological expression
    levels. This is the workhorse system of the field: essentially all
    mechanistic knowledge of the oncohistone's chromatin effects, the
    osteogenic differentiation block, and the SCUBE3/SEMA4D paracrine axis
    derives from it.
  experimental_model_type: PRIMARY_CELL_CULTURE
  cell_source: Surgical giant cell tumor of bone specimens
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  publication: PMID:33110075
  evidence:
  - reference: PMID:33110075
    reference_title: Globally altered epigenetic landscape and delayed osteogenic differentiation in H3.3-G34W-mutant giant cell tumor of bone.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The neoplastic stromal cells of giant cell tumor of bone (GCTB) carry a
      mutation in H3F3A, leading to a mutant histone variant, H3.3-G34W, as a
      sole recurrent genetic alteration.
    explanation: >-
      Establishes that cells cultured from GCTB specimens carry the
      disease-defining lesion, which is what makes this culture system a valid
      model of the human disease.
  modeled_mechanisms:
  - target: Genome-Wide Epigenetic Reprogramming by Mutant Histone H3.3
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Reproduces the chromatin incorporation of mutant H3.3 and the genome-wide
      DNA methylation, accessibility, and histone-mark changes in cells carrying
      the endogenous mutation.
    limitations: >-
      Cultured stromal cells are isolated from the osteoclast compartment and
      bone matrix that shape their behaviour in vivo, so the paracrine loop
      curated in this entry cannot operate in monoculture. Outgrowth also
      selects for proliferative cells, and the differentiation stage of the
      cultured population is itself a confounder the source study raises.
    readouts:
    - name: Genome-wide DNA methylation, chromatin accessibility, and histone modification profiles
      target: Genome-Wide Epigenetic Reprogramming by Mutant Histone H3.3
      direction: ALTERED
      interpretation: >-
        Multi-layer epigenomic profiling is the measurement that grounds this
        node.
      evidence:
      - reference: PMID:33110075
        reference_title: Globally altered epigenetic landscape and delayed osteogenic differentiation in H3.3-G34W-mutant giant cell tumor of bone.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          in patient-derived stromal cells H3.3-G34W is incorporated into the
          chromatin and associates with massive epigenetic alterations on the
          DNA methylation, chromatin accessibility and histone modification
          level
        explanation: >-
          Names the three measurement layers reported for this readout.
    evidence:
    - reference: PMID:33110075
      reference_title: Globally altered epigenetic landscape and delayed osteogenic differentiation in H3.3-G34W-mutant giant cell tumor of bone.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        These epigenetic alterations affect mainly heterochromatic and bivalent
        regions and provide possible explanations for the genomic instability,
        as well as the osteolytic phenotype of GCTB.
      explanation: >-
        Reports what the model shows about this node and how the authors connect
        it to the disease phenotype.
  - target: Arrested Osteogenic Differentiation of the Neoplastic Stroma
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Mutant patient-derived cells show impaired osteogenic differentiation
      under differentiation conditions.
    limitations: >-
      Differentiation assays are driven by supraphysiological osteogenic media
      rather than the in vivo niche, and the source study frames the finding as
      a delay in differentiation stage, which is a weaker claim than a
      permanent block.
    readouts:
    - name: Osteogenic differentiation capacity of mutant versus wild-type stromal cells
      target: Arrested Osteogenic Differentiation of the Neoplastic Stroma
      direction: DECREASED
      interpretation: >-
        Reduced osteogenic differentiation is the direct cellular correlate of
        the differentiation-block node.
      evidence:
      - reference: PMID:33110075
        reference_title: Globally altered epigenetic landscape and delayed osteogenic differentiation in H3.3-G34W-mutant giant cell tumor of bone.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          The mutation occurs in differentiating mesenchymal stem cells and
          associates with an impaired osteogenic differentiation.
        explanation: >-
          Reports the measured impairment of osteogenic differentiation.
    evidence:
    - reference: PMID:33110075
      reference_title: Globally altered epigenetic landscape and delayed osteogenic differentiation in H3.3-G34W-mutant giant cell tumor of bone.
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: >-
        We propose that the observed epigenetic alterations reflect distinct
        differentiation stages of H3.3 WT and H3.3 MUT stromal cells
      explanation: >-
        The authors' own framing of what the model shows, preserved with its
        hedging. Recorded as PARTIAL because it qualifies the differentiation
        claim rather than simply confirming it.

- name: CRISPR-Cas9 H3.3 G34W-edited GCTB tumor-derived cells
  description: >-
    Tumor-derived cells in which the G34W allele is introduced or removed by
    genome editing. This is what converts the mutation from a correlate into a
    demonstrated requirement, and it is the only system in which necessity for
    tumor formation has been tested.
  experimental_model_type: CELL_LINE
  cell_source: GCTB tumor-derived cells edited for H3.3 G34W
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  publication: PMID:32967858
  evidence:
  - reference: PMID:32967858
    reference_title: H3.3 G34W Promotes Growth and Impedes Differentiation of Osteoblast-Like Mesenchymal Progenitors in Giant Cell Tumor of Bone.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      By profiling the epigenome, transcriptome, and secreted proteome of
      patient samples and tumor-derived cells CRISPR-Cas9-edited for H3.3 G34W
    explanation: >-
      Describes the edited tumor-derived system and the multi-omic profiling
      that establish it as a model of the driver mutation.
  modeled_mechanisms:
  - target: Somatic H3-3A G34W Oncohistone Mutation in Mesenchymal Stromal Cells
    relationship: PERTURBS
    fidelity: HIGH
    description: >-
      Directly manipulates the driver allele, establishing that G34W is
      necessary for tumor formation rather than merely associated with it.
    limitations: >-
      Editing is performed in established tumor-derived cells that already carry
      the tumor's other acquired changes, so the experiment tests the mutation's
      requirement for maintaining the transformed state more directly than its
      sufficiency to initiate one in a normal mesenchymal progenitor.
    readouts:
    - name: Tumor formation by G34W-edited versus unedited cells
      target: Somatic H3-3A G34W Oncohistone Mutation in Mesenchymal Stromal Cells
      direction: ABOLISHED
      interpretation: >-
        Loss of tumor formation on removing the allele is the necessity test.
      evidence:
      - reference: PMID:32967858
        reference_title: H3.3 G34W Promotes Growth and Impedes Differentiation of Osteoblast-Like Mesenchymal Progenitors in Giant Cell Tumor of Bone.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Glycine 34-to-tryptophan (G34W) substitutions in H3.3 arise in
          approximately 90% of giant cell tumor of bone (GCT). Here, we show
          H3.3 G34W is necessary for tumor formation.
        explanation: >-
          States the necessity result this readout records.
    evidence:
    - reference: PMID:32967858
      reference_title: H3.3 G34W Promotes Growth and Impedes Differentiation of Osteoblast-Like Mesenchymal Progenitors in Giant Cell Tumor of Bone.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Our findings suggest that H3.3 G34W leads to GCT by sustaining a
        transformed state in osteoblast-like progenitors, which promotes
        neoplastic growth, pathologic recruitment of giant osteoclasts, and bone
        destruction.
      explanation: >-
        The authors' summary of what perturbing the allele in this system
        establishes about the driver node.

- name: Monocyte osteoclastogenesis co-culture with GCTB stromal cells
  description: >-
    Peripheral monocytes cultured with GCTB stromal cells or their secreted
    factors, reading out multinucleated osteoclast formation. This is the
    system in which the paracrine arm of the disease is actually measured -
    including the recombinant-SCUBE3 add-back that tests the de-repression
    mechanism directly - and it is the one place the two compartments are
    reconstituted together.
  experimental_model_type: CO_CULTURE
  cell_source: Human peripheral blood monocytes with GCTB stromal cells
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  publication: PMID:36138226
  evidence:
  - reference: PMID:36138226
    reference_title: Aberrant paracrine signalling for bone remodelling underlies the mutant histone-driven giant cell tumour of bone.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      While these striking features imply a pathogenic interaction between
      mesenchymal and myelomonocytic lineages during GCT development, the
      underlying mechanisms remain unknown.
    explanation: >-
      States the two-compartment interaction this co-culture system exists to
      reconstitute and measure.
  modeled_mechanisms:
  - target: Enhancer-Level SCUBE3 Repression
    relationship: MEASURES
    fidelity: MODERATE
    description: >-
      Quantifies osteoclast formation as a function of stromal SCUBE3, the
      readout that establishes SCUBE3 as a restraint rather than a bystander.
    limitations: >-
      An in vitro reconstitution of two purified compartments cannot reproduce
      the bone matrix, vasculature, or the recruitment step that precedes fusion
      in vivo; osteoclast number and size in a dish are a proxy for tumor
      osteolysis, not a measurement of it.
    readouts:
    - name: Osteoclast number and size generated from monocyte precursors
      target: Enhancer-Level SCUBE3 Repression
      direction: INCREASED
      interpretation: >-
        Osteoclast output rises as stromal SCUBE3 falls, the direction the
        de-repression model predicts.
      evidence:
      - reference: PMID:36138226
        reference_title: Aberrant paracrine signalling for bone remodelling underlies the mutant histone-driven giant cell tumour of bone.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          We show that the changes in the transcriptome and epigenome in the
          mesenchymal cells caused by the H3.3-G34W mutation contribute to
          increase osteoclast recruitment in part via reduced expression of the
          TGFβ-like soluble factor, SCUBE3.
        explanation: >-
          Reports the measured increase in osteoclast recruitment attributable
          to reduced SCUBE3.
    evidence:
    - reference: PMID:34556636
      reference_title: Serglycin induces osteoclastogenesis and promotes tumor growth in giant cell tumor of bone.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Stromal-derived SRGN promotes osteoclast differentiation from monocytes."
      explanation: >-
        An independent use of the same co-culture readout, supporting it as the
        established assay for the stromal-to-osteoclast axis.

animal_models:
- name: Naturally occurring canine vertebral giant cell tumor of bone
  description: >-
    A spontaneous primary lumbar extradural giant cell tumor in a 10-year-old
    Poodle, characterized by imaging, necropsy, histology, histochemistry, and
    immunohistochemistry. It reproduces the human tumor's cellular architecture
    - TRAP-positive osteoclastic giant cells evenly distributed among
    alpha-SMA-positive spindled mononuclear cells and IBA-1-positive histiocytic
    cells - and its destructive osteolysis. It is the only naturally occurring
    non-human example identified in this curation pass, and it is included for
    what it fails to show as much as for what it shows.
  species: Dog
  genotype: Not determined; spontaneous tumor in a wild-type animal
  publication: PMID:41908959
  evidence:
  - reference: PMID:41908959
    reference_title: 'Case Report: Histochemical and immunohistochemical characterization of a canine giant cell bone tumor in lumbar spine.'
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The final diagnosis was a primary lumbar extradural giant cell tumor of
      bone.
    explanation: >-
      Confirms the diagnosis in the animal, the basis for treating this
      spontaneous case as informative about the human disease.
  modeled_mechanisms:
  - target: Recruitment and Fusion of Reactive Osteoclast-Like Giant Cells
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The canine tumor contains the same tripartite cellular composition as the
      human disease, with abundant osteoclast-type multinucleated giant cells
      distributed among mononuclear stromal and histiocytic populations.
    limitations: >-
      A single spontaneous case, characterized only at necropsy. Fidelity is
      capped at MODERATE rather than HIGH because the compositional match is
      morphological and immunophenotypic; no genotyping was performed, so the
      canine giant cells are not shown to be reactive to a mutant stromal
      population in the way that defines the human mechanism.
    readouts:
    - name: TRAP-positive multinucleated giant cells distributed among mononuclear cells
      target: Recruitment and Fusion of Reactive Osteoclast-Like Giant Cells
      direction: INCREASED
      interpretation: >-
        Histochemical confirmation of an osteoclast-type giant cell population
        in the canine tumor.
      evidence:
      - reference: PMID:41908959
        reference_title: 'Case Report: Histochemical and immunohistochemical characterization of a canine giant cell bone tumor in lumbar spine.'
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          The tumor comprised numerous multinucleated giant cells of the
          osteoclastic type (positive for tartrate-resistant acid
          phosphatase- TRAP- and lysozyme), evenly distributed among
          mononuclear cells (both rounded and spindle-shaped).
        explanation: >-
          Reports the TRAP-positive giant cell population and its even
          distribution among mononuclear cells.
    evidence:
    - reference: PMID:41908959
      reference_title: 'Case Report: Histochemical and immunohistochemical characterization of a canine giant cell bone tumor in lumbar spine.'
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Alpha smooth muscle actin (SMA) was expressed in mononuclear cells,
        while IBA-1 staining highlighted mononuclear histiocytic cells.
      explanation: >-
        Documents the two mononuclear populations alongside the giant cells,
        establishing the compositional match that makes this animal informative
        for the node.
  - target: Somatic H3-3A G34W Oncohistone Mutation in Mesenchymal Stromal Cells
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      Immunohistochemistry with the H3.3 G34W mutation-specific antibody showed
      no nuclear reactivity in the canine tumor. The animal reproduces the
      disease's cellular architecture without demonstrating the molecular driver
      that defines it in humans, so it cannot serve as a model of the
      oncohistone mechanism curated at this node.
    limitations: >-
      The negative result is not decisive about canine biology. The antibody is
      validated for human tissue only, so a species difference in the H3.3
      sequence context or simple loss of cross-reactivity would produce the same
      absent stain as a genuinely different driver. No sequencing was performed,
      and this is a single case. The honest reading is that the driver is
      undetermined in the dog, not that it is absent - which is precisely why
      the link is FAILS_TO_RECAPITULATE at LOW fidelity rather than a
      species-divergence claim.
    evidence:
    - reference: PMID:41908959
      reference_title: 'Case Report: Histochemical and immunohistochemical characterization of a canine giant cell bone tumor in lumbar spine.'
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Both masses exhibited whitish areas interspersed with blood-filled
        spaces.
      explanation: >-
        Establishes from the abstract that this is the canine tumor in question.
        Recorded as PARTIAL because the abstract does not itself report the
        G34W immunohistochemistry; that result appears in the report body, and
        the failure-to-recapitulate claim rests on it rather than on this quote.
  notes: >-
    The G34W-negative immunohistochemistry is stated in the case report's
    results and discussion rather than its abstract, so it is not quoted as a
    snippet here - abstract-only reference validation would not verify it. The
    open question it raises is curated as a HUMAN_MODEL_MISMATCH discussion.

discussions:
- discussion_id: gctb_no_in_vivo_g34w_model
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - "pathophysiology#Somatic H3-3A G34W Oncohistone Mutation in Mesenchymal Stromal Cells"
  - "pathophysiology#Enhancer-Level SCUBE3 Repression"
  prompt: >-
    Does the H3.3-G34W oncohistone initiate a giant cell tumor in vivo, and does
    the stromal-to-osteoclast paracrine loop operate as modeled when both
    compartments are present in a living skeleton?
  rationale: >-
    Every mechanistic step curated in this entry between the mutation and the
    osteoclast compartment - the epigenetic reprogramming, the differentiation
    block, SCUBE3 de-repression, the SEMA4D return signal - rests on
    patient-derived cultures, edited tumor-derived cell lines, and monocyte
    co-cultures. No genetically engineered animal carrying a knock-in G34W
    allele was identified in this curation pass. That matters more here than in
    most diseases, because the central claim is specifically about cross-talk
    between two cell compartments: a monoculture cannot test it, and a
    co-culture reconstitutes it only in the absence of bone matrix, vasculature,
    and an intact recruitment step. The tumor-formation experiment that
    establishes necessity was performed in cells that were already
    tumor-derived, so initiation from a normal mesenchymal progenitor remains
    untested.
  proposed_experiments:
  - experiment_id: gctb_conditional_g34w_knockin
    name: Conditional H3-3A G34W knock-in in the osteoblast lineage
    description: >-
      Generate a conditional knock-in of the G34W allele driven in mesenchymal
      or osteoprogenitor lineages and determine whether a giant-cell-rich
      osteolytic lesion arises, whether the recruited osteoclasts are
      genotypically wild type, and whether Scube3 is repressed in the mutant
      stroma in situ.
    readouts:
    - name: Formation of a giant-cell-rich osteolytic lesion
      target: Somatic H3-3A G34W Oncohistone Mutation in Mesenchymal Stromal Cells
      direction: INCREASED
      interpretation: >-
        Lesion formation from a normal progenitor would establish sufficiency,
        which the existing edited-cell experiment cannot.
      evidence:
      - reference: PMID:32967858
        reference_title: H3.3 G34W Promotes Growth and Impedes Differentiation of Osteoblast-Like Mesenchymal Progenitors in Giant Cell Tumor of Bone.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Here, we show H3.3 G34W is necessary for tumor formation."
        explanation: >-
          The existing necessity result this proposed readout would extend to
          sufficiency in vivo.
    - name: Scube3 expression in mutant stroma in situ
      target: Enhancer-Level SCUBE3 Repression
      direction: DECREASED
      interpretation: >-
        In vivo confirmation that the de-repression step operates outside
        culture.
      evidence:
      - reference: PMID:36138226
        reference_title: Aberrant paracrine signalling for bone remodelling underlies the mutant histone-driven giant cell tumour of bone.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Transcriptional changes in SCUBE3 are associated with altered histone
          marks and H3.3G34W enrichment at its enhancer regions.
        explanation: >-
          The in vitro finding this readout is designed to test in a living
          skeleton.
    evidence:
    - reference: PMID:36138226
      reference_title: Aberrant paracrine signalling for bone remodelling underlies the mutant histone-driven giant cell tumour of bone.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        While these striking features imply a pathogenic interaction between
        mesenchymal and myelomonocytic lineages during GCT development, the
        underlying mechanisms remain unknown.
      explanation: >-
        States the two-compartment interaction that only an in vivo model can
        test intact, motivating this experiment.
  evidence:
  - reference: PMID:32967858
    reference_title: H3.3 G34W Promotes Growth and Impedes Differentiation of Osteoblast-Like Mesenchymal Progenitors in Giant Cell Tumor of Bone.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      By profiling the epigenome, transcriptome, and secreted proteome of
      patient samples and tumor-derived cells CRISPR-Cas9-edited for H3.3 G34W
    explanation: >-
      Documents that the necessity evidence comes from edited tumor-derived
      cells, the limitation this gap identifies.

- discussion_id: gctb_canine_driver_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - "pathophysiology#Somatic H3-3A G34W Oncohistone Mutation in Mesenchymal Stromal Cells"
  prompt: >-
    Is the only naturally occurring animal counterpart of this disease driven by
    the same oncohistone, or does the canine tumor reach the same histology by a
    different molecular route?
  rationale: >-
    The canine vertebral case reproduces the human tumor's architecture -
    osteoclastic giant cells evenly distributed among spindled mononuclear cells
    - and its destructive osteolysis, yet showed no nuclear reactivity with the
    H3.3 G34W mutation-specific antibody. Three readings are compatible with
    that result and they have different consequences. If the antibody, validated
    only in human tissue, simply fails to cross-react, the dog is a usable model
    of the human mechanism. If canine H3.3 differs in sequence context around
    codon 34, the species is uninformative about this driver. If canine giant
    cell tumors are genuinely driven by something else, then the shared
    histology is convergent, and the tumor's architecture is a general outcome
    of stromal-osteoclast cross-talk rather than a specific consequence of this
    oncohistone - which would be the most interesting result of the three, and
    would argue that the histology is not diagnostic of the mechanism. Nothing
    short of sequencing distinguishes them.
  proposed_experiments:
  - experiment_id: gctb_canine_h3f3a_sequencing
    name: Targeted sequencing of H3-3A codon 34 in canine giant cell tumors
    description: >-
      Sequence the H3-3A codon 34 region in a series of canine giant cell bone
      tumors, alongside alignment of the canine H3.3 epitope against the human
      sequence the antibody was raised to, to separate assay failure from true
      molecular divergence.
    readouts:
    - name: Presence of a codon 34 substitution in canine tumor stromal cells
      target: Somatic H3-3A G34W Oncohistone Mutation in Mesenchymal Stromal Cells
      direction: UNCHANGED
      interpretation: >-
        Absence of any codon 34 change with a conserved epitope would establish
        genuine divergence; presence with a negative stain would establish assay
        failure. Direction is recorded as UNCHANGED because the informative
        result is the wild-type one.
      evidence:
      - reference: PMID:33021329
        reference_title: H3F3A G34 mutation DNA sequencing and G34W immunohistochemistry analysis in 366 cases of giant cell tumors of bone and other bone tumors.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Furthermore, one case of GCTB and one case of recurrent GCTB showed
          positive G34W immunostaining results despite being negative for the
          genetic mutation.
        explanation: >-
          Demonstrates in human tissue that stain and sequence can disagree,
          which is why sequencing rather than immunohistochemistry is the
          discriminating readout proposed here.
    evidence:
    - reference: PMID:41908959
      reference_title: 'Case Report: Histochemical and immunohistochemical characterization of a canine giant cell bone tumor in lumbar spine.'
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The final diagnosis was a primary lumbar extradural giant cell tumor of
        bone.
      explanation: >-
        Establishes the canine case that would supply the material for this
        experiment. PARTIAL because the abstract does not report the
        immunohistochemistry that motivates it.
  evidence:
  - reference: PMID:41908959
    reference_title: 'Case Report: Histochemical and immunohistochemical characterization of a canine giant cell bone tumor in lumbar spine.'
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The final diagnosis was a primary lumbar extradural giant cell tumor of
      bone.
    explanation: >-
      Establishes the diagnosis in the animal. PARTIAL because the abstract does
      not report the G34W immunohistochemistry on which the mismatch rests; that
      appears in the report body.

- discussion_id: gctb_denosumab_recurrence_after_withdrawal
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - "pathophysiology#Stromal RANKL Overexpression"
  - "pathophysiology#Local Recurrence After Incomplete Removal"
  prompt: >-
    Does neoadjuvant denosumab increase the risk of local recurrence after
    subsequent curettage, and if so, is that an artefact of indication bias or a
    real consequence of leaving mutant stroma in a drug-induced quiescent state?
  rationale: >-
    The mechanism predicts the problem. Denosumab acts on RANKL, depleting the
    reactive osteoclast compartment; in cell-line work it neither inhibits the
    growth of nor kills the neoplastic stromal cells, and it does not alter
    their RANKL or OPG expression. The compartment that carries the driver
    mutation is therefore untouched, and the new bone the drug induces may make
    residual tumor harder to identify and clear at surgery. Reported recurrence
    after denosumab-then-surgery ranges from 20% to 100% across a systematic
    review - a spread wide enough to be uninformative on its own, and one that
    could equally reflect indication bias, since the drug is given to the worst
    tumors. Resolving this needs a design that controls for baseline tumor
    severity, which no published study has.
  evidence:
  - reference: PMID:24060052
    reference_title: Comparison of the anti-tumor effects of denosumab and zoledronic acid on the neoplastic stromal cells of giant cell tumor of bone.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In contrast, denosumab only exerted a minimal inhibitory effect in one
      cell line and did not induce any apoptosis.
    explanation: >-
      Establishes that the drug does not kill the neoplastic stromal cells, the
      mechanistic basis of the recurrence concern.
  - reference: PMID:24060052
    reference_title: Comparison of the anti-tumor effects of denosumab and zoledronic acid on the neoplastic stromal cells of giant cell tumor of bone.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Our findings provide new insights in the anti-tumor effect of denosumab on
      GCT stromal cells and raise a concern that tumor recurrence may occur
      after the withdrawal of the drug.
    explanation: >-
      The authors state the withdrawal-recurrence concern that this discussion
      records.
  - reference: PMID:32541321
    reference_title: Current concepts in the treatment of giant cell tumour of bone.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Concerns have arisen that recurrence rates would be higher than after
      conventional treatment, ranging from 20 to 100% in a systematic review,
      although this may be because of bias.
    explanation: >-
      Gives both the reported range and the bias caveat, which is why this is
      recorded as an open controversy rather than a settled effect. Evidence
      source is OTHER because this is a review article.
  - reference: PMID:35837707
    reference_title: Updated concepts in treatment of giant cell tumor of bone.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Increased experience with use of denosumab raised concern on elevated
      recurrence rates. However, conclusions of meta-analyses should be
      interpreted with risk of indication bias in mind.
    explanation: >-
      An independent review reaching the same unresolved position, naming
      indication bias explicitly. Evidence source is OTHER because this is a
      review article.

- discussion_id: gctb_paget_associated_familial_subset
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - "pathophysiology#Somatic H3-3A G34W Oncohistone Mutation in Mesenchymal Stromal Cells"
  prompt: >-
    What inherited factor predisposes to giant cell tumor arising in Paget
    disease of bone, and does that subset share the H3-3A G34W driver curated
    for conventional sporadic GCTB?
  rationale: >-
    This entry models conventional sporadic GCTB and asserts no inheritance. A
    distinct subset contradicts that framing at the level of the disease name,
    and is recorded here rather than silently dropped. Giant cell tumor arising
    in Paget disease clusters strongly in families, is disproportionately
    multifocal, favours flat bones over the long-bone epiphyses this entry
    describes, and carries roughly 50 percent five-year mortality against 0 to 5
    percent for GCT without Paget disease. The predisposition is most plausibly
    inherited through Paget disease genetics rather than through anything in the
    mechanism graph curated here, but the retrieved literature does not
    establish the germline basis of the GCT phenotype specifically, and does not
    report whether these tumors carry H3-3A G34W at all. Until that is known it
    is not possible to say whether PDB-associated GCT is the same disease
    arising on a permissive background, or a mechanistically separate entity
    sharing a histological name - which is why it is scoped out of this entry
    rather than merged into it, and why a separate entry would be the right
    home for it.
  proposed_experiments:
  - experiment_id: gctb_pdb_associated_driver_and_germline
    name: H3-3A genotyping and germline sequencing of PDB-associated giant cell tumors
    description: >-
      Genotype H3-3A codon 34 in a series of PDB-associated giant cell tumors
      and sequence germline DNA from affected kindreds, to determine whether the
      subset shares the sporadic driver and whether a segregating predisposition
      allele accounts for the familial clustering.
    readouts:
    - name: H3-3A codon 34 mutation status in PDB-associated giant cell tumors
      target: Somatic H3-3A G34W Oncohistone Mutation in Mesenchymal Stromal Cells
      direction: UNCHANGED
      interpretation: >-
        Wild-type codon 34 would establish PDB-associated GCT as a
        mechanistically distinct entity; G34W would place it on the same
        pathograph with an inherited permissive background. Direction is
        recorded as UNCHANGED because the entity-separating result is the
        wild-type one.
      evidence:
      - reference: PMID:33021329
        reference_title: H3F3A G34 mutation DNA sequencing and G34W immunohistochemistry analysis in 366 cases of giant cell tumors of bone and other bone tumors.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Sanger DNA sequencing analysis was used to detect H3F3A mutations.
        explanation: >-
          The established assay this readout would apply to the PDB-associated
          subset.
  evidence:
  - reference: PMID:25196811
    reference_title: "Clinical characteristics and evolution of giant cell tumor occurring in Paget's disease of bone."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with Paget's bone disease (PDB) have an increased risk of
      developing giant cell tumor (GCT).
    explanation: >-
      Establishes the existence of the subset this discussion scopes out.
  - reference: PMID:25196811
    reference_title: "Clinical characteristics and evolution of giant cell tumor occurring in Paget's disease of bone."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The mortality rate of PDB-GCT patients was higher than those occurring in
      GCT patients without PDB (about 50% versus 0% to 5% at 5 years)
    explanation: >-
      Quantifies the prognostic gulf between the subset and conventional GCTB,
      the strongest argument that the two should not be modeled as one entry.
  - reference: PMID:25196811
    reference_title: "Clinical characteristics and evolution of giant cell tumor occurring in Paget's disease of bone."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      one-fourth of them (24.8%) had multifocal GCTs
    explanation: >-
      Documents the multifocality that distinguishes the subset from the
      typically monostotic sporadic disease.

stages:
- name: Campanacci Grade I (latent)
  description: >-
    A well-marginated intraosseous lesion with an intact cortex. Managed with
    extended intralesional curettage plus adjuvant; recurrence risk is lowest in
    this group.
  role: early
- name: Campanacci Grade II (active)
  description: >-
    A relatively well-defined lesion without a radiopaque rim, with cortical
    thinning and moderate expansion. Still the domain of joint-preserving
    intralesional surgery.
  role: intermediate
- name: Campanacci Grade III (aggressive)
  description: >-
    Ill-defined margins, cortical destruction, and soft-tissue extension. Grade
    III is the point at which the curettage-versus-resection calculation flips:
    intralesional treatment carries a markedly higher recurrence risk here, and
    grade III is independently a risk factor for pulmonary implantation. It is
    also the setting where neoadjuvant denosumab is used to downstage before
    surgery.
  role: advanced
  evidence:
  - reference: PMID:22773395
    reference_title: 'Which treatment is the best for giant cell tumors of the distal radius? A meta-analysis.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      intralesional excision appears to be more appropriate for the treatment of
      local lesions (e.g., grades 1 and 2) than grade 3 GCTs of the distal
      radius
    explanation: >-
      Establishes grade III as the threshold at which intralesional treatment
      becomes the less appropriate option.
  - reference: PMID:28443231
    reference_title: Clinical characteristics and risk factors analysis of lung metastasis of benign giant cell tumor of bone.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The Campanacci stage of all tumors was stage 3."
    explanation: >-
      Every tumor in a 46-patient lung-metastasis series was Campanacci stage 3,
      supporting the association between this stage and pulmonary implantation.
  - reference: PMID:20934816
    reference_title: Features of grade 3 giant cell tumors of the distal radius associated with successful intralesional treatment.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with a single site of cortical perforation who received CCC
      treatment achieved local control with intralesional treatment alone.
    explanation: >-
      Qualifies the grade III rule: a subset with limited cortical perforation
      can still be managed intralesionally, so the grade is a guide rather than
      a hard boundary. Recorded as PARTIAL for that reason.
  notes: >-
    Campanacci grading is radiographic-surgical rather than an oncological
    stage; it describes local aggressiveness, not the benign/malignant
    distinction, which is captured separately by the Malignant Sarcomatous
    Transformation node.

diagnosis:
- name: Radiographic signature of giant cell tumor of bone
  description: >-
    The lesion is diagnosed largely on its radiographic pattern in a specific
    clinical context: a purely lytic, geographically destructive lesion with
    circumscribed non-sclerotic borders, centred in the epiphysis but reaching
    the metaphysis and extending to the adjacent articular cortex, with no
    mineralized tumor matrix, in a patient with closed physes. Skeletal maturity
    is doing real diagnostic work here - it is the main clinical discriminator
    from chondroblastoma, which is also epiphyseal but occurs before physeal
    closure.
  evidence:
  - reference: PMID:21139758
    reference_title: Imaging of giant cell tumor of bone.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      On radiographs, GCT demonstrates a lytic lesion centered in the epiphysis
      but involving the metaphysis and extending at least in part to the
      adjacent articular cortex.
    explanation: >-
      States the defining radiographic location and extent. Evidence source is
      OTHER because this is a review article.
  - reference: PMID:21139758
    reference_title: Imaging of giant cell tumor of bone.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Most cases show circumscribed borders or so-called geographical
      destruction with no periosteal reaction unless a pathological fracture is
      present. There is no mineralized tumor matrix.
    explanation: >-
      Gives the margin and matrix characteristics that separate this lesion from
      matrix-forming and permeative bone tumors. Evidence source is OTHER
      because this is a review article.
  - reference: PMID:21139758
    reference_title: Imaging of giant cell tumor of bone.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Giant cell tumor (GCT) of bone is a benign but locally aggressive and
      destructive lesion generally occurring in skeletally mature individuals.
    explanation: >-
      Establishes skeletal maturity as part of the diagnostic context. Evidence
      source is OTHER because this is a review article.
  notes: >-
    Imaging narrows the differential but does not close it. The definitive
    discriminator against giant-cell-rich mimics is H3.3 G34W mutant-protein
    immunohistochemistry or H3-3A sequencing, curated under histopathology.


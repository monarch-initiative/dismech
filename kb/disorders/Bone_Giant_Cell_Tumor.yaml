  description: >-
    The pivotal open-label multicentre phase 2 study of denosumab in GCTB, 532
    patients across 30 sites in 12 countries, which established the safety
    profile and long-term disease control underpinning approval. Its published
    results are curated as PMID:31704134.
  target_phenotypes:

name: Bone Giant Cell Tumor
description: >-
  Giant cell tumor of bone (GCTB, historically "osteoclastoma") is a locally
  aggressive, rarely metastasizing primary bone neoplasm that arises in the
  epiphyseal-metaphyseal region of long bones in skeletally mature young
  adults. It is defined by a somatic H3-3A (H3F3A) p.Gly34Trp oncohistone
  mutation confined to a neoplastic mesenchymal stromal cell population, which
  is arrested in osteoblastic differentiation and drives paracrine recruitment
  of a large, non-neoplastic osteoclast compartment. The multinucleated
  osteoclast-like giant cells that give the tumor its name are therefore
  reactive rather than neoplastic, and their RANKL-driven resorptive activity
  produces the defining geographic osteolysis. The disease is the clearest
  human example of a neoplasm whose destructive phenotype is executed almost
  entirely by a recruited bystander cell type - the mechanistic basis for
  treating it with the anti-RANKL antibody denosumab, and for the tumor's
  regrowth when that drug is withdrawn while the mutant stroma persists.
creation_date: "2026-08-15T23:45:00Z"
disease_term:
  preferred_term: bone giant cell tumor
  term:

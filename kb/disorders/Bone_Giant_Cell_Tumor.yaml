- name: NCT00889590
  phase: PHASE_II
  status: UNKNOWN
  description: >-
    Randomised phase 2 trial of adjuvant zoledronic acid in high-risk GCTB,
    testing whether systemic bisphosphonate lowers the 2-year recurrence rate
    against standard care. Directly tests the anti-stromal rationale curated on
    the zoledronic acid treatment entry.
  target_phenotypes:
  - preferred_term: Giant cell tumor of bone
    term:
      id: HP:0011847
      label: Giant cell tumor of bone
  evidence:
  - reference: clinicaltrials:NCT00889590
    reference_title: Adjuvant Zoledronic Acid in 'High Risk' Giant Cell Tumour of Bone (GCT) - A Randomized Phase II Study
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Determine if adjuvant zoledronic acid improves the 2 years recurrence rate
      of 'high risk' GCT as compared to standard care
    explanation: >-
      States the primary objective, the recurrence endpoint this entry's
      recurrence node is concerned with.
  notes: >-
    `status: UNKNOWN` because the cached ClinicalTrials.gov summary does not

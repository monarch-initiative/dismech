  evidence:
  - reference: clinicaltrials:NCT00680992
    reference_title: An Open-label, Multi-center, Phase 2 Study of Denosumab in Subjects With Giant Cell Tumor of Bone
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To determine how safe denosumab is in treating subjects with giant cell
      tumor of bone (GCTB)
    explanation: >-
      States the trial's objective, confirming it as the denosumab safety study

- name: NCT05595603
  phase: NOT_APPLICABLE
  status: UNKNOWN
  description: >-
    Randomised trial of zoledronic-acid-loaded bone cement as a local adjuvant
    after intralesional curettage. The local-delivery design is the direct
    response to the recurrence problem curated at the curettage treatment
    entry: it aims at the residual mutant stroma in the cavity wall while
    avoiding systemic bisphosphonate exposure.
  target_phenotypes:
  - preferred_term: Giant cell tumor of bone
    term:
      id: HP:0011847
      label: Giant cell tumor of bone
  evidence:
  - reference: clinicaltrials:NCT05595603
    reference_title: 'Zoledronic Acid-loaded Bone Cement as a Local Adjuvant Therapy for Giant Cell Bone Tumor After Intralesional Curettage: a Prospective, Multicenter, Single Blinded, Randomized Control Trial.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The purpose of this study is to investigate whether zoledronic acid-loaded
      bone cement (4mg ZOL+ gentamicin PMMA ) as adjuvant method can decrease
      local recurrence in patients with giant cell bone tumor following
      intralesional curettage surgery.
    explanation: >-
      States the intervention and the local-recurrence endpoint.
  notes: >-
    `phase: NOT_APPLICABLE` because this is a device/local-delivery adjuvant
    trial that does not follow the standard drug-phase classification;
    `status: UNKNOWN` because the cached summary does not report one.


      supports: SUPPORT
      evidence_source: OTHER
      snippet: mononuclear stromal cells in GCTB express fundamental RANKLs and various chemokines and cytokines associated with monocyte recruitment
      explanation: Places RANKL and monocyte-recruiting signal output in the neoplastic stromal compartment. Evidence source is OTHER because this is a review article.
  - target: Malignant Sarcomatous Transformation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      A small minority of these neoplastic stromal populations acquire

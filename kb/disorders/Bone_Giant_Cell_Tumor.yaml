- name: Osteoclast-Derived SEMA4D Feedback onto the Mutant Stroma
  description: >-
    The stroma-to-osteoclast axis is not one-way. Osteoclasts in GCTB secrete
    unregulated amounts of SEMA4D, which enhances proliferation of the mutant
    osteoprogenitors while arresting their maturation - reinforcing the very
    differentiation block that generated the osteoclast pool. The loop makes
    the neoplastic stroma partly dependent on the reactive compartment it
    creates, and this dependency is what makes depleting osteoclasts a
    therapeutically meaningful intervention rather than a purely symptomatic one.
  biological_scale: MOLECULAR
  role: amplifier
  cell_types:
  - preferred_term: Osteoclast-like multinucleated giant cell
    term:
      id: CL:0000092
      label: osteoclast
  evidence:
  - reference: PMID:36138226
    reference_title: Aberrant paracrine signalling for bone remodelling underlies the mutant histone-driven giant cell tumour of bone.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In turn, osteoclasts secrete unregulated amounts of SEMA4D which enhances
      proliferation of mutated osteoprogenitors arresting their maturation.
    explanation: >-
      States the reverse arm of the paracrine loop, both the proliferative
      effect and the maturation arrest, exactly as curated here.
  - reference: PMID:36138226

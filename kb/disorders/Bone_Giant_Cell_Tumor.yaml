    evidence:
    - reference: PMID:34785767
      reference_title: 'Histological and immunohistochemical features and genetic alterations in the malignant progression of giant cell tumor of bone: a possible association with TP53 mutation and loss of H3K27 trimethylation.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: The results suggested that p53 alteration and dysfunction of histone methylation as evidenced by H3K27me3 loss may play an important role in the malignant progression of GCTB
      explanation: Supports progression of the neoplastic compartment to malignancy through additional acquired alterations, with the authors' hedging preserved - which is why the target node carries mechanism_confidence PROVISIONAL.

- name: Enhancer-Level SCUBE3 Repression
  description: >-
    Among the transcriptional consequences of the oncohistone, one has been
    resolved to a specific paracrine mediator. Mutant H3.3 is enriched at the
    enhancer regions of SCUBE3, which encodes a secreted TGF-beta-like factor,
    and the accompanying histone-mark changes reduce its expression. Loss of
    stromal SCUBE3 removes a brake on osteoclast recruitment, so this node is a
    de-repression step rather than an activating one - the tumor recruits
    osteoclasts partly by ceasing to restrain them.
  biological_scale: MOLECULAR
  role: mediator
  biological_processes:
  - preferred_term: Positive regulation of osteoclast differentiation
    term:
      id: GO:0045672
      label: positive regulation of osteoclast differentiation
    modifier: INCREASED
  evidence:
  - reference: PMID:36138226
    reference_title: Aberrant paracrine signalling for bone remodelling underlies the mutant histone-driven giant cell tumour of bone.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We show that the changes in the transcriptome and epigenome in the
      mesenchymal cells caused by the H3.3-G34W mutation contribute to increase
      osteoclast recruitment in part via reduced expression of the TGFβ-like
      soluble factor, SCUBE3.
    explanation: >-
      States the causal chain from the oncohistone through reduced SCUBE3 to
      increased osteoclast recruitment that this node represents.
  - reference: PMID:36138226
    reference_title: Aberrant paracrine signalling for bone remodelling underlies the mutant histone-driven giant cell tumour of bone.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Transcriptional changes in SCUBE3 are associated with altered histone
      marks and H3.3G34W enrichment at its enhancer regions.
    explanation: >-
      Provides the enhancer-level chromatin mechanism linking mutant H3.3
      occupancy to SCUBE3 repression.
  downstream:
  - target: Recruitment and Fusion of Reactive Osteoclast-Like Giant Cells
    causal_link_type: DIRECT
    description: >-
      Loss of the SCUBE3 restraint permits greater osteoclast recruitment to the
      tumor site.
    evidence:
    - reference: PMID:36138226
      reference_title: Aberrant paracrine signalling for bone remodelling underlies the mutant histone-driven giant cell tumour of bone.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: We show that the changes in the transcriptome and epigenome in the mesenchymal cells caused by the H3.3-G34W mutation contribute to increase osteoclast recruitment in part via reduced expression of the TGFβ-like soluble factor, SCUBE3.
      explanation: Attributes increased osteoclast recruitment specifically to reduced SCUBE3, the edge asserted here.

- name: Stromal RANKL Overexpression
  description: >-
    The neoplastic stromal cells express RANKL (TNFSF11), the master
    differentiation and survival signal for the osteoclast lineage, alongside
    monocyte-recruiting chemokines such as SDF-1 and MCP-1 and pro-osteoclastic
    cytokines including IL-6 and TNF. RANKL engages RANK on myelomonocytic
    precursors that the tumor has recruited. This is the therapeutically
    actionable step: it is the node that denosumab occupies.
  biological_scale: MOLECULAR
  role: amplifier
  conforms_to: "osteoporosis_bone_resorption#RANKL-Driven Osteoclastogenesis"

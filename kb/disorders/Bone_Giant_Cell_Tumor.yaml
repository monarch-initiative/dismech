    label: bone giant cell tumor
synonyms:
- Giant cell tumor of bone
- GCTB
- Osteoclastoma
- Benign bone giant cell tumor
notes: >-
  Scoped to conventional sporadic GCTB, which is modeled as a somatic-driver
  neoplasm: no germline predisposition allele is established for it, so no
  `inheritance:` block is asserted. HPO's "Somatic mutation" term (HP:0001428)
  is obsolete and is deliberately not used.


  That "no inheritance" claim is deliberately narrow and does not extend to the
  whole disease name. A distinct familial/multicentric subset arises in Paget
  disease of bone, with strong familial clustering, flat-bone predilection, and
  a far worse prognosis; it is curated here as an out-of-scope KNOWLEDGE_GAP
  discussion (`gctb_paget_associated_familial_subset`) rather than folded into
  this entry, because its predisposition is most plausibly inherited through
  Paget disease genetics rather than through anything in the GCTB mechanism
  graph, and the retrieved literature does not establish the germline basis of
  the GCT phenotype specifically. A separate entry for PDB-associated GCT would
  be the right home for it.


  Distinguish carefully from two same-named but mechanistically distinct
  entities: tenosynovial giant cell tumor (CSF1-driven, of joints and tendon
  sheaths) and giant cell tumor of soft tissue. Chondroblastoma is the
  epiphyseal H3-3B/H3F3B p.Lys36Met counterpart and is a separate disease.

      reference_title: Aberrant paracrine signalling for bone remodelling underlies the mutant histone-driven giant cell tumour of bone.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: In turn, osteoclasts secrete unregulated amounts of SEMA4D which enhances proliferation of mutated osteoprogenitors arresting their maturation.
      explanation: 'The same sentence supplies the return arm: SEMA4D acting on the mutant osteoprogenitors to sustain proliferation and maturation arrest.'

- name: Excessive Osteoclastic Bone Resorption
  description: >-
    The recruited osteoclast pool degrades mineralized matrix at a rate the
    arrested, non-differentiating stroma cannot replace with new bone. Because
    the stroma is held short of mature osteoblast identity, the formative arm
    of remodeling is simultaneously suppressed, so resorption is uncoupled in
    both directions at once. This is the shared effector step this entry has
    in common with metabolic bone disease, and the reason the tumor's
    radiographic signature is purely lytic.
  biological_scale: TISSUE
  role: effector
  conforms_to: "osteoporosis_bone_resorption#Increased Osteoclastic Bone Resorption"
  cell_types:
  - preferred_term: Osteoclast-like multinucleated giant cell
    term:
      id: CL:0000092
      label: osteoclast
  biological_processes:
  - preferred_term: Bone resorption
    term:
      id: GO:0045453
      label: bone resorption
    modifier: INCREASED
  - preferred_term: Bone remodeling
    term:
      id: GO:0046849
      label: bone remodeling
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:22662295
    reference_title: 'Modern interpretation of giant cell tumor of bone: predominantly osteoclastogenic stromal tumor.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      A diverse array of inflammatory cytokines and chemokines disrupts
      osteoblastic differentiation and promotes the formation of excessive
      multi-nucleated osteoclastic cells.
    explanation: >-
      Captures both arms of the uncoupling curated here, suppressed osteoblastic
      differentiation alongside excessive osteoclast formation. Evidence source
      is OTHER because this is a review article.
  - reference: PMID:20149736
    reference_title: 'Denosumab in patients with giant-cell tumour of bone: an open-label, phase 2 study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Giant-cell tumour (GCT) of bone is a primary osteolytic bone tumour with
      low metastatic potential and is associated with substantial skeletal
      morbidity.
    explanation: >-
      Establishes the osteolytic character and skeletal morbidity that follow
      from unopposed resorption.
  downstream:
  - target: Locally Aggressive Osteolytic Tumor Mass
    causal_link_type: DIRECT
    description: >-
      Sustained resorption produces the expanding, cortex-thinning lytic lesion.
    evidence:
    - reference: PMID:20149736
      reference_title: 'Denosumab in patients with giant-cell tumour of bone: an open-label, phase 2 study.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Giant-cell tumour (GCT) of bone is a primary osteolytic bone tumour with low metastatic potential and is associated with substantial skeletal morbidity.
      explanation: Characterizes the lesion produced by unopposed resorption as an osteolytic tumor causing skeletal morbidity.

- name: Locally Aggressive Osteolytic Tumor Mass
  description: >-
    The combined neoplastic and reactive compartments form an expanding
    epiphyseal-metaphyseal mass that erodes trabecular bone, thins and expands
    the cortex, and in advanced (Campanacci grade III) disease breaches it into
    the surrounding soft tissue. Subchondral extension threatens the adjacent
    joint. Secondary aneurysmal-bone-cyst-like change with blood-filled spaces
    is a common accompaniment. The mass, not any systemic effect, causes the
    disease's clinical phenotype: pain, swelling, restricted joint motion,
    pathologic fracture, and - in axial lesions - neural compression.
  biological_scale: TISSUE
  role: outcome
  evidence:
  - reference: PMID:29987945
    reference_title: 'Incidence and demographics of giant cell tumor of bone in The Netherlands: First nationwide Pathology Registry Study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Giant cell tumors of bone (GCT-B) are rare, locally aggressive tumors
      characterized by an abundance of giant cells.
    explanation: >-
      Characterizes the lesion as locally aggressive with abundant giant cells,
      the tissue-level outcome curated at this node.
  - reference: PMID:29987945
    reference_title: 'Incidence and demographics of giant cell tumor of bone in The Netherlands: First nationwide Pathology Registry Study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most common localization was the femur (35%), followed by the tibia (18%).
    explanation: >-
      Gives the nationwide-registry anatomical distribution of the tumor mass.
  downstream:
  - target: Local Recurrence After Incomplete Removal
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Residual mutant stroma left in the cavity after intralesional surgery
      regenerates the lesion.
    evidence:
    - reference: PMID:39236154
      reference_title: 'The Role of Bone Grafting vs. Bone Cement in the Treatment of Giant Cell Tumor of Bone: A Systematic Review and Meta-Analysis on the Risk of Recurrence in 1,454 Patients.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Giant cell tumor of bone (GCTB) presents a challenge in management due to its invasive nature and propensity for local recurrence.
      explanation: States the propensity for local recurrence that follows from the tumor's invasive local behaviour.
  - target: Pulmonary Implantation of Histologically Benign Tumor
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      A minority of tumors seed the lung, most strongly associated with local
      recurrence, high Campanacci stage, and curettage rather than resection.
    evidence:
    - reference: PMID:28443231
      reference_title: Clinical characteristics and risk factors analysis of lung metastasis of benign giant cell tumor of bone.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: The recurrence rate, Campanacci stage, and surgical method were significant risk factors for lung metastasis.
      explanation: Identifies tumor stage and surgical handling as risk factors, which is the strongest evidence available here and the reason the target node carries mechanism_confidence PROVISIONAL rather than ESTABLISHED.

- name: Local Recurrence After Incomplete Removal
  description: >-
    Because the neoplastic stromal cells are histologically inconspicuous and
    diffusely distributed through the cavity wall, intralesional curettage
    reliably leaves some behind, and the tumor regrows. Recurrence is the
    dominant clinical problem in GCTB and the reason for high-speed burring,
    chemical or physical adjuvants, and cementation. It also raises the risk of
    the two rarer downstream outcomes, pulmonary implantation and malignant
    transformation.
  biological_scale: TISSUE
  role: outcome
  evidence:
  - reference: PMID:39236154
    reference_title: 'The Role of Bone Grafting vs. Bone Cement in the Treatment of Giant Cell Tumor of Bone: A Systematic Review and Meta-Analysis on the Risk of Recurrence in 1,454 Patients.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The overall rate of recurrence for GCTB after intralesional curettage with
      BC was 20.05% vs. 29.74% with BG
    explanation: >-
      Quantifies post-curettage recurrence in a 1,454-patient meta-analysis for
      both cavity-filling strategies.
  - reference: PMID:21301899
    reference_title: 'The prognostic factors of recurrent GCT: a cooperative study by the Eastern Asian Musculoskeletal Oncology Group.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The median interval between initial surgery and the first recurrence of
      GCT was 16 months (2-180 months).
    explanation: >-
      Gives the timing of recurrence, supporting the surveillance interval
      implied by this node.
  - reference: PMID:21301899
    reference_title: 'The prognostic factors of recurrent GCT: a cooperative study by the Eastern Asian Musculoskeletal Oncology Group.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Repeat recurrence also correlates with lung metastasis.
    explanation: >-
      Supports the curated edge from recurrence toward pulmonary implantation.
  downstream:
  - target: Pulmonary Implantation of Histologically Benign Tumor
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Repeated recurrence is among the strongest identified risk factors for
      lung involvement.
    evidence:
    - reference: PMID:21301899
      reference_title: 'The prognostic factors of recurrent GCT: a cooperative study by the Eastern Asian Musculoskeletal Oncology Group.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Repeat recurrence also correlates with lung metastasis.
      explanation: Directly reports the association between repeat recurrence and lung involvement. The wording is correlational, matching the PROVISIONAL mechanism_confidence carried by the target node.

- name: Pulmonary Implantation of Histologically Benign Tumor
  mechanism_confidence: PROVISIONAL
  description: >-
    A minority of GCTBs produce lung nodules that are histologically identical
    to the primary tumor yet behave nothing like carcinomatous metastasis:
    survival remains near-normal, and spontaneous regression has been
    documented. Whether these represent true metastasis or mechanical
    embolization of tumor fragments during surgical manipulation is unresolved,
    which is why the curated confidence is PROVISIONAL and the node is named
    for implantation rather than metastasis. The observed risk factors - local
    recurrence, high Campanacci stage, and curettage over resection - are
    equally compatible with either reading.
  biological_scale: ORGANISM
  role: outcome
  evidence:
  - reference: PMID:28443231
    reference_title: Clinical characteristics and risk factors analysis of lung metastasis of benign giant cell tumor of bone.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The recurrence rate, Campanacci stage, and surgical method were
      significant risk factors for lung metastasis.
    explanation: >-
      Identifies the three risk factors curated in this node's description.
  - reference: PMID:28443231
    reference_title: Clinical characteristics and risk factors analysis of lung metastasis of benign giant cell tumor of bone.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The 5-year overall survival rate was 94.4%."
    explanation: >-
      Quantifies the indolent behavior that distinguishes these deposits from
      conventional malignant metastasis.
  - reference: PMID:21301899
    reference_title: 'The prognostic factors of recurrent GCT: a cooperative study by the Eastern Asian Musculoskeletal Oncology Group.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The incidence of lung metastasis and malignant transformation were 7.5%
      (8 out of 107 patients) and 2.7% (3 out of 110 patients), respectively.
    explanation: >-
      Provides cohort frequencies for both rare outcomes curated in this entry.

- name: Malignant Sarcomatous Transformation
  mechanism_confidence: PROVISIONAL
  description: >-
    Rarely, GCTB progresses to a high-grade sarcoma, either arising alongside a
    conventional component (primary malignant GCTB) or years after treatment of
    a conventional tumor (secondary malignant GCTB). Transformation requires
    genetic events beyond the oncohistone: TP53 mutation with p53 nuclear
    accumulation, and loss of H3K27me3, are each found in subsets and appear
    mutually exclusive. Telomerase alterations are a distinct route, and carry a
    specific therapeutic implication - they render the neoplastic cells
    independent of osteoclasts for proliferation, predicting denosumab
    unresponsiveness. In a substantial fraction of cases the malignant component
    has lost the H3-3A G34W mutation the benign component carried, so the
    transformed tumor is not simply a more aggressive version of its precursor.
  biological_scale: CELLULAR
  role: outcome
  evidence:
  - reference: PMID:34785767
    reference_title: 'Histological and immunohistochemical features and genetic alterations in the malignant progression of giant cell tumor of bone: a possible association with TP53 mutation and loss of H3K27 trimethylation.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      NGS on four MGCTBs revealed pathogenic mutations in TP53 (n = 3), EZH2
      (n = 1) and several other genes.
    explanation: >-
      Identifies the additional driver alterations found in malignant
      transformation.
  - reference: PMID:34785767
    reference_title: 'Histological and immunohistochemical features and genetic alterations in the malignant progression of giant cell tumor of bone: a possible association with TP53 mutation and loss of H3K27 trimethylation.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The results suggested that p53 alteration and dysfunction of histone
      methylation as evidenced by H3K27me3 loss may play an important role in
      the malignant progression of GCTB
    explanation: >-
      States the two mechanistic routes to malignant progression curated at this
      node, with the authors' own hedging preserved.
  - reference: PMID:31285528
    reference_title: Absence of H3F3A mutation in a subset of malignant giant cell tumor of bone.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, in the remaining five cases, in contrast to their associated
      H3F3A G34W-mutant giant cell tumor, the sarcoma lacked the H3F3A G34W
      mutation, either entirely or sub-clonally in the samples tested.
    explanation: >-
      Documents loss of the founding driver in the malignant component, the
      basis for the claim that transformation is not simple progression.
  - reference: PMID:36138226
    reference_title: Aberrant paracrine signalling for bone remodelling underlies the mutant histone-driven giant cell tumour of bone.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In contrast, hTERT alterations, commonly found in malignant GCT, result in
      the histone-mutated neoplastic cells being independent of osteoclasts for
      their proliferation, predicting unresponsiveness to denosumab.
    explanation: >-
      Supplies the telomerase route and its predicted consequence for
      RANKL-directed therapy, the mechanistic reason denosumab is not expected
      to control transformed disease.

phenotypes:
- category: Neoplasm
  name: Giant Cell Tumor of Bone
  description: >-
    The defining lesion: a geographic, purely osteolytic, eccentric
    epiphyseal-metaphyseal mass extending to subchondral bone in a skeletally
    mature patient. Present by definition in every affected individual.
  frequency: OBLIGATE
  phenotype_term:
    preferred_term: Giant cell tumor of bone
    term:
      id: HP:0011847
      label: Giant cell tumor of bone
  evidence:
  - reference: PMID:29987945
    reference_title: 'Incidence and demographics of giant cell tumor of bone in The Netherlands: First nationwide Pathology Registry Study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Giant cell tumor of bone (GCT-B) is a locally aggressive neoplasm composed
      of sheets of mononuclear cells admixed with uniformly distributed large
      osteoclast-like giant cells, primarily affecting the metaphysis of long
      bones
    explanation: >-
      Describes the defining lesion and its characteristic long-bone location.

- category: Skeletal
  name: Localized Bone Pain
  description: >-
    Insidious pain at the affected site, developing over weeks to months, is
    the usual presenting symptom and reflects cortical thinning and periosteal
    stretching by the expanding lytic mass rather than any systemic process.
  phenotype_term:
    preferred_term: Bone pain
    term:
      id: HP:0002653
      label: Bone pain
    temporality: CHRONIC
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:21139931
    reference_title: 'The epidemiology of malignant giant cell tumors of bone: an analysis of data from the Surveillance, Epidemiology and End Results Program (1975-2004).'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with GCT of bone typically present with mechanical difficulty and
      pain as a result of bone destruction and are at an increased risk for
      fracture.
    explanation: >-
      Attributes the presenting pain and mechanical difficulty directly to bone
      destruction, and links it to fracture risk.
  - reference: PMID:28905737
    reference_title: Giant cell tumor of bone revisited.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Clinical symptoms are nonspecific and may include local pain, swelling,
      and limited range of motion of the adjacent joint.
    explanation: >-
      Names local pain first among the presenting symptoms. Evidence source is
      OTHER because this is a review article.
  notes: >-
    No frequency band is asserted. Pain is described as the typical presenting
    symptom in every source consulted, but none of the cached abstracts reports
    a proportion, and a FrequencyEnum value would be a quantitative claim the
    evidence does not make.

- category: Skeletal
  name: Pathologic Fracture
  description: >-
    Cortical thinning and destruction weaken the bone sufficiently that fracture
    may occur with trivial trauma, sometimes as the presenting event. Fracture
    complicates surgical decision-making, since the cavity is no longer
    contained.
  phenotype_term:
    preferred_term: Pathologic fracture
    term:
      id: HP:0002756
      label: Pathologic fracture
  evidence:
  - reference: PMID:21139931
    reference_title: 'The epidemiology of malignant giant cell tumors of bone: an analysis of data from the Surveillance, Epidemiology and End Results Program (1975-2004).'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with GCT of bone typically present with mechanical difficulty and
      pain as a result of bone destruction and are at an increased risk for
      fracture.
    explanation: >-
      States the increased fracture risk arising from tumor-mediated bone
      destruction.

- category: Musculoskeletal
  name: Local Swelling and Joint Effusion
  description: >-
    Because the tumor is characteristically juxta-articular, extending to the
    subchondral plate, local swelling and effusion at the adjacent joint are
    common presenting findings.
  phenotype_term:
    preferred_term: Joint swelling
    term:
      id: HP:0001386
      label: Joint swelling
  evidence:
  - reference: PMID:23378375
    reference_title: Giant cell tumor of bone.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Most patients present with pain, swelling, joint effusion, and disability
      in the third and fourth decades of life.
    explanation: >-
      Names swelling and joint effusion among the usual presenting findings.
      Evidence source is OTHER because this is a review article.

- category: Musculoskeletal
  name: Limitation of Joint Mobility
  description: >-
    Restricted range of motion at the joint adjacent to the tumor. Joint
    preservation is a central goal of management precisely because this tumor
    sits against the articular surface.
  phenotype_term:
    preferred_term: Limitation of joint mobility
    term:
      id: HP:0001376
      label: Limitation of joint mobility
  evidence:
  - reference: PMID:28905737
    reference_title: Giant cell tumor of bone revisited.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Clinical symptoms are nonspecific and may include local pain, swelling,
      and limited range of motion of the adjacent joint.
    explanation: >-
      Directly names limited range of motion of the adjacent joint among the
      presenting symptoms. Evidence source is OTHER because this is a review.

- category: Respiratory
  name: Pulmonary Nodules
  description: >-
    Nodules histologically identical to the primary tumor, usually multiple and
    frequently bilateral, most often peripherally located. Despite radiographic
    resemblance to metastatic disease, survival is near-normal.
  phenotype_term:
    preferred_term: Pulmonary nodule
    term:
      id: HP:0033608
      label: Pulmonary nodule
  evidence:
  - reference: PMID:28443231
    reference_title: Clinical characteristics and risk factors analysis of lung metastasis of benign giant cell tumor of bone.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Eighteen patients had unilateral metastasis and 28 had bilateral
      metastasis. Most lesions (n=38) were located in the peripheral lung.
    explanation: >-
      Describes the laterality and peripheral distribution of the pulmonary
      deposits curated here.

- category: Neoplasm
  name: Secondary Sarcoma
  description: >-
    A high-grade sarcoma arising within or at the site of a giant cell tumor,
    most often osteosarcoma. Prognosis is that of the sarcoma, not of the
    original tumor.
  phenotype_term:
    preferred_term: Sarcoma
    term:
      id: HP:0100242
      label: Sarcoma
  evidence:
  - reference: PMID:21301899
    reference_title: 'The prognostic factors of recurrent GCT: a cooperative study by the Eastern Asian Musculoskeletal Oncology Group.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The incidence of lung metastasis and malignant transformation were 7.5%
      (8 out of 107 patients) and 2.7% (3 out of 110 patients), respectively.
    explanation: >-
      Reports the frequency of malignant transformation in a recurrent-GCT
      cohort.

- category: Skeletal
  name: Secondary Aneurysmal Bone Cyst Change
  description: >-
    Blood-filled cystic spaces developing within the tumor, producing
    fluid-fluid levels on MRI. This is a secondary change within a giant cell
    tumor, not a primary aneurysmal bone cyst, and the distinction matters
    because primary aneurysmal bone cyst is a differential diagnosis.
  phenotype_term:
    preferred_term: Aneurysmal bone cyst
    term:
      id: HP:0012063
      label: Aneurysmal bone cyst
  evidence:
  - reference: PMID:23708046
    reference_title: 'Giant cell tumor with secondary aneurysmal bone cyst: a unique presentation with an ossified extraosseous soft tissue mass.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MRI demonstrates a multiloculated lesion in the distal femur with multiple
      fluid-fluid levels and cortical penetration of the lesion.
    explanation: >-
      Human case documenting the multiple fluid-fluid levels that are the
      radiological signature of secondary aneurysmal bone cyst change within a
      giant cell tumor.
  - reference: PMID:21139758
    reference_title: Imaging of giant cell tumor of bone.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Giant cell tumor can produce wide-ranging appearances depending on site,
      complications such as hemorrhage or pathological fracture and after
      surgical intervention.
    explanation: >-
      Imaging review noting that haemorrhagic complication changes the tumor's
      appearance, the general phenomenon of which secondary aneurysmal bone cyst
      change is the specific form. Evidence source is OTHER because this is a
      review article.
  - reference: PMID:41908959
    reference_title: 'Case Report: Histochemical and immunohistochemical characterization of a canine giant cell bone tumor in lumbar spine.'
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Both masses exhibited whitish areas interspersed with blood-filled spaces.
    explanation: >-
      The same blood-filled cystic change in the naturally occurring canine
      disease, recorded as a second, species-labelled observation rather than as
      the sole support for a human phenotype. Evidence source is MODEL_ORGANISM
      because the observation is in a dog.

- category: Neurological
  name: Spinal Cord or Nerve Root Compression
  description: >-
    Vertebral and sacral tumors compress neural structures, producing pain
    followed by neurological deficit. This anatomical subset accounts for much
    of the disease's serious morbidity and is where surgery is least feasible,
    making it the principal indication for denosumab.
  phenotype_term:
    preferred_term: Spinal cord compression
    term:
      id: HP:0002176
      label: Spinal cord compression
  evidence:
  - reference: PMID:21045974
    reference_title: 'Giant cell tumor of the sacrum and spine: series of 23 cases and a review of the literature.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most patients presented with pain or neurologic deficit at the site of
      tumor involvement, and symptoms were usually present for many months prior
      to diagnosis.
    explanation: >-
      Human series of 23 spinal and sacral giant cell tumors reporting
      neurological deficit as a usual presenting feature, with the insidious
      time course curated in this description.
  - reference: PMID:29745092
    reference_title: 'Therapeutic benefits of neoadjuvant and post-operative denosumab on sacral giant cell tumor: a retrospective cohort study of 30 cases.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A system (MUD system) proposed by our center was applied to score the
      sacral nerve deficit changes before surgery in group 3.
    explanation: >-
      A sacral giant cell tumor cohort in which nerve deficit is a scored
      clinical endpoint of neoadjuvant denosumab, supporting both the phenotype
      and the treatment rationale that depends on it.
  - reference: PMID:41908959
    reference_title: 'Case Report: Histochemical and immunohistochemical characterization of a canine giant cell bone tumor in lumbar spine.'
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Necropsy findings confirmed the presence of a nodular soft mass below the
      left kidney and a firm mass compressing the medullary canal at L1-L3.
    explanation: >-
      An explicit anatomical demonstration of neural-canal compression by a
      vertebral giant cell tumor, retained as a second observation alongside the
      human series. Evidence source is MODEL_ORGANISM because this is the canine
      case.

genetic:
- name: H3-3A
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  gene_term:
    preferred_term: H3-3A
    term:
      id: hgnc:4764
      label: H3-3A
  variants:
  - name: H3-3A c.103G>T p.Gly34Trp
    type: MISSENSE
    description: >-
      The canonical oncohistone substitution. It does not raise the activity of
      a normal H3.3 function; it creates a chromatin behaviour wild-type H3.3
      does not have - impaired H3K36 trimethylation in cis and consequent
      genome-wide redistribution of H3K27me3 - so it is best read as neomorphic
      rather than as a simple gain of function.
    evidence:
    - reference: PMID:32967858
      reference_title: H3.3 G34W Promotes Growth and Impedes Differentiation of Osteoblast-Like Mesenchymal Progenitors in Giant Cell Tumor of Bone.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        we show that H3.3K36me3 loss on mutant H3.3 alters the deposition of the
        repressive H3K27me3 mark from intergenic to genic regions, beyond areas
        of H3.3 deposition
      explanation: >-
        Describes the specific chromatin consequence of the substitution that
        makes it neomorphic rather than merely hyperactive.
  case_fractions:
  - population: Sequenced GCTB series, 180 cases
    case_fraction_percent: 90.56
    cohort_size: 180
    notes: >-
      G34W specifically; a further 4.4% carried G34L, G34V, or G34R, for 95.0%
      of cases mutated at codon 34 overall.
    evidence:
    - reference: PMID:33021329
      reference_title: H3F3A G34 mutation DNA sequencing and G34W immunohistochemistry analysis in 366 cases of giant cell tumors of bone and other bone tumors.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        DNA sequencing results revealed H3F3A mutations in 95.00% of GCTBs
        (171/180), including glycine 34 to tryptophan (G34W, 163/180, 90.56%),
        glycine 34 to leucine (G34L, 3/180, 1.67%), glycine 34 to valine (G34V,
        3/180, 1.67%), and glycine 34 to arginine (G34R, 2/180, 1.11%).
      explanation: >-
        Reports the per-variant case fractions in a 180-case sequenced series.
  evidence:
  - reference: PMID:24162739
    reference_title: Distinct H3F3A and H3F3B driver mutations define chondroblastoma and giant cell tumor of bone.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The mutations were restricted to the stromal cell population and were not
      detected in osteoclasts or their precursors.
    explanation: >-
      Establishes the somatic, stroma-restricted nature of the driver that this
      genetic entry records.
  - reference: PMID:32967858
    reference_title: H3.3 G34W Promotes Growth and Impedes Differentiation of Osteoblast-Like Mesenchymal Progenitors in Giant Cell Tumor of Bone.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Glycine 34-to-tryptophan (G34W) substitutions in H3.3 arise in
      approximately 90% of giant cell tumor of bone (GCT). Here, we show H3.3
      G34W is necessary for tumor formation.
    explanation: >-
      Demonstrates by genome editing that the variant is required for tumor
      formation, supporting SOMATIC_DRIVER rather than a bystander annotation.
  notes: >-
    The somatic driver of conventional GCTB, confined to the neoplastic stromal
    cells. Because it is somatic and tumor-restricted it carries no recurrence
    risk for relatives and is not a germline testing target; its clinical role
    is diagnostic, through mutation-specific immunohistochemistry or sequencing.

- name: TP53
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  gene_term:
    preferred_term: TP53
    term:
      id: hgnc:11998
      label: TP53
  evidence:
  - reference: PMID:34785767
    reference_title: 'Histological and immunohistochemical features and genetic alterations in the malignant progression of giant cell tumor of bone: a possible association with TP53 mutation and loss of H3K27 trimethylation.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Immunohistochemical analysis of the nine MGCTBs confirmed the p53 nuclear
      accumulation (n = 5) and loss of H3K27me3 expression (n = 3) and showed
      that they were mutually exclusive.
    explanation: >-
      Documents both progression routes and their mutual exclusivity in
      malignant giant cell tumor of bone.
  notes: >-
    Not involved in conventional GCTB. TP53 mutation with p53 nuclear
    accumulation is one of two routes associated with progression to malignant
    giant cell tumor of bone, and appears mutually exclusive with the
    H3K27me3-loss route. Scoped to malignant transformation only; curating this
    as a driver of conventional GCTB would be wrong.

- name: TERT
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  gene_term:
    preferred_term: TERT
    term:
      id: hgnc:11730
      label: TERT
  evidence:
  - reference: PMID:36138226
    reference_title: Aberrant paracrine signalling for bone remodelling underlies the mutant histone-driven giant cell tumour of bone.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In contrast, hTERT alterations, commonly found in malignant GCT, result in
      the histone-mutated neoplastic cells being independent of osteoclasts for
      their proliferation, predicting unresponsiveness to denosumab.
    explanation: >-
      States both the association with malignant GCT and the loss of osteoclast
      dependence that carries the therapeutic implication.
  notes: >-
    Telomerase alterations are found in malignant GCTB and define a biologically
    distinct route: they free the histone-mutated neoplastic cells from their
    dependence on osteoclasts for proliferation, which is the mechanistic
    prediction that such tumors will not respond to RANKL blockade.

- name: TNFSF11
  relationship_type: BIOMARKER
  gene_term:
    preferred_term: TNFSF11
    term:
      id: hgnc:11926
      label: TNFSF11
  evidence:
  - reference: PMID:20149736
    reference_title: 'Denosumab in patients with giant-cell tumour of bone: an open-label, phase 2 study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      GCT is rich in osteoclast-like giant cells and contains mononuclear
      (stromal) cells that express RANK ligand (RANKL), a key mediator of
      osteoclast activation.
    explanation: >-
      Records stromal RANKL expression, the basis for treating this gene as a
      mechanistic and therapeutic marker rather than a mutated driver.
  notes: >-
    RANKL. Not mutated in GCTB; it is overexpressed by the neoplastic stromal
    cells as a consequence of the oncohistone-driven transcriptional program,
    and it is the drug target that defines modern systemic therapy for this
    disease.

- name: SCUBE3
  relationship_type: BIOMARKER
  gene_term:
    preferred_term: SCUBE3
    term:
      id: hgnc:13655
      label: SCUBE3
  evidence:
  - reference: PMID:36138226
    reference_title: Aberrant paracrine signalling for bone remodelling underlies the mutant histone-driven giant cell tumour of bone.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Transcriptional changes in SCUBE3 are associated with altered histone
      marks and H3.3G34W enrichment at its enhancer regions.
    explanation: >-
      Ties reduced SCUBE3 expression to mutant-H3.3 occupancy at its enhancers.
  notes: >-
    Epigenetically repressed rather than mutated. Mutant H3.3 enrichment at
    SCUBE3 enhancers reduces expression of its secreted TGF-beta-like product,
    removing a restraint on osteoclast recruitment.

- name: SEMA4D
  relationship_type: BIOMARKER
  gene_term:
    preferred_term: SEMA4D
    term:
      id: hgnc:10732
      label: SEMA4D
  evidence:
  - reference: PMID:36138226
    reference_title: Aberrant paracrine signalling for bone remodelling underlies the mutant histone-driven giant cell tumour of bone.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In turn, osteoclasts secrete unregulated amounts of SEMA4D which enhances
      proliferation of mutated osteoprogenitors arresting their maturation.
    explanation: >-
      Documents the osteoclast-derived signal and its effect on the neoplastic
      compartment.
  notes: >-
    Secreted by the reactive osteoclast compartment, not by the tumor cells.
    SEMA4D drives proliferation of the mutant osteoprogenitors and holds their
    maturation in arrest, closing the paracrine loop.

histopathology:
- name: Osteoclast-Like Multinucleated Giant Cells on a Mononuclear Background
  description: >-
    The diagnostic histology is a uniform distribution of very large
    multinucleated osteoclast-like giant cells, often with dozens of nuclei,
    scattered evenly through sheets of mononuclear cells. The mononuclear
    population is itself two populations that light microscopy does not
    separate: reactive monocyte-macrophage lineage cells, and the spindled
    neoplastic stromal cells that carry the mutation. Even distribution of the
    giant cells is a useful discriminator from other giant-cell-rich lesions,
    where they tend to cluster.
  diagnostic: true
  evidence:
  - reference: PMID:29987945
    reference_title: 'Incidence and demographics of giant cell tumor of bone in The Netherlands: First nationwide Pathology Registry Study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Giant cell tumor of bone (GCT-B) is a locally aggressive neoplasm composed
      of sheets of mononuclear cells admixed with uniformly distributed large
      osteoclast-like giant cells, primarily affecting the metaphysis of long
      bones
    explanation: >-
      Describes the sheets of mononuclear cells with uniformly distributed giant
      cells that define the histology.
  - reference: PMID:23378375
    reference_title: Giant cell tumor of bone.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Mononuclear stromal cells are the physiologically active and diagnostic
      cell type.
    explanation: >-
      Identifies the mononuclear stromal cell rather than the giant cell as the
      biologically decisive population. Evidence source is OTHER because this is
      a review article.

- name: H3.3 G34W Mutant-Protein Immunoreactivity
  description: >-
    Nuclear staining with a mutation-specific antibody in the neoplastic
    mononuclear cells, absent from the giant cells - immunohistochemistry that
    directly visualizes the compartment restriction of the driver. It has
    become the practical diagnostic discriminator against giant-cell-rich
    mimics. Discordance in both directions exists: rare tumors stain positive
    without a detectable mutation, and sequencing can be falsely negative when
    neoplastic cells are sparse in the sample.
  diagnostic: true
  evidence:
  - reference: PMID:33021329
    reference_title: H3F3A G34 mutation DNA sequencing and G34W immunohistochemistry analysis in 366 cases of giant cell tumors of bone and other bone tumors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Immunohistochemistry showed that GCTBs harboring G34W also expressed the
      mutant protein in tumor cell nuclei.
    explanation: >-
      Establishes concordance between the mutation and nuclear mutant-protein
      staining in tumor cells.
  - reference: PMID:33021329
    reference_title: H3F3A G34 mutation DNA sequencing and G34W immunohistochemistry analysis in 366 cases of giant cell tumors of bone and other bone tumors.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although DNA sequencing analysis detected rare mutation types of H3F3A,
      false-negative results were also present due to the small number of cells
      in the samples.
    explanation: >-
      Documents the sequencing false-negative mode caused by low neoplastic-cell
      content. Recorded as PARTIAL because it qualifies the assay rather than
      supporting it.
  - reference: PMID:35837707
    reference_title: Updated concepts in treatment of giant cell tumor of bone.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The most frequent mutation (G34W) can be detected using
      immunohistochemistry and is highly specific in differentiating GCTB from
      other giant cell containing tumors.
    explanation: >-
      Supports the diagnostic discriminating role of the immunohistochemical
      stain. Evidence source is OTHER because this is a review article.

prevalence:
- population: Netherlands, nationwide pathology registry 2009-2013
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: BELOW_1_IN_1000000
  rate_per_100000: 0.17
  notes: >-
    1.7 per million inhabitants per year, converted to 0.17 per 100,000. The
    first incidence estimate from a pathology database with complete national
    coverage, so it is less subject to the referral bias of doctor-driven
    registries.
  evidence:
  - reference: PMID:29987945
    reference_title: 'Incidence and demographics of giant cell tumor of bone in The Netherlands: First nationwide Pathology Registry Study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      For GCT-B the incidence was 1.7 per million inhabitants per year with a
      male to female ratio of 1:1.38 and a median age of 35 years (9-77).
    explanation: >-
      Provides the incidence rate, sex ratio, and age distribution recorded
      here.

- population: United States, SEER 1975-2004, malignant giant cell tumor only
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: BELOW_1_IN_1000000
  rate_per_100000: 0.016
  notes: >-
    1.6 per 10,000,000 per year for the malignant form specifically, roughly a
    tenth of the incidence of conventional GCTB. Do not compare this figure
    with the Dutch rate above as though they measured the same thing.
  evidence:
  - reference: PMID:21139931
    reference_title: 'The epidemiology of malignant giant cell tumors of bone: an analysis of data from the Surveillance, Epidemiology and End Results Program (1975-2004).'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Based on analyses of 117 malignant GCT cases, the estimated annual
      incidence in the United States was 1.6 per 10,000,000 persons per year.
    explanation: >-
      Population-based SEER incidence estimate for malignant giant cell tumor.

progression:
- phase: Local growth, treatment, and surveillance for recurrence
  notes: >-
    The usual course is a single episode of insidious local growth over months,
    surgical treatment, and then a surveillance period dominated by recurrence
    risk. Recurrence clusters early - median around 16 months - which sets the
    intensity of early follow-up, though the reported range extends to 15
    years. Chest surveillance runs in parallel because pulmonary deposits
    appear later and are strongly associated with recurrence. Malignant
    transformation is a late and rare event.
  evidence:
  - reference: PMID:21301899
    reference_title: 'The prognostic factors of recurrent GCT: a cooperative study by the Eastern Asian Musculoskeletal Oncology Group.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The median interval between initial surgery and the first recurrence of
      GCT was 16 months (2-180 months).
    explanation: >-
      Gives the timing and spread of first recurrence that shapes the
      surveillance schedule.
  - reference: PMID:21301899
    reference_title: 'The prognostic factors of recurrent GCT: a cooperative study by the Eastern Asian Musculoskeletal Oncology Group.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Early local recurrence of GCT is a risk factor for repeat recurrence.
    explanation: >-
      Establishes that early recurrence predicts further recurrence, the basis
      for intensified follow-up after a first relapse.

treatments:
- name: Extended Intralesional Curettage with Adjuvant and Cementation
  description: >-
    The standard operation for most Campanacci grade I and II lesions:
    curettage of the cavity, high-speed burring of its walls, a chemical or
    physical adjuvant, and filling with polymethylmethacrylate bone cement or
    bone graft. It preserves the joint at the cost of a substantial recurrence
    rate, because the neoplastic stroma is inconspicuous and diffuse.
    Meta-analytic evidence favours cement over graft for local control, though
    recurrence remains high either way, and a distal-radius meta-analysis found
    no cement advantage in that site - so the choice is not settled across all
    locations.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: curettage procedure
    term:
      id: NCIT:C15216
      label: Curettage Procedure
  target_mechanisms:
  - target: Locally Aggressive Osteolytic Tumor Mass
    treatment_effect: INHIBITS
    description: >-
      Physically removes the tumor mass while preserving the adjacent joint.
    evidence:
    - reference: PMID:39236154
      reference_title: 'The Role of Bone Grafting vs. Bone Cement in the Treatment of Giant Cell Tumor of Bone: A Systematic Review and Meta-Analysis on the Risk of Recurrence in 1,454 Patients.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        While either bone grafting (BG) or bone cement (BC) can be utilized to
        fill defects after intralesional curettage, the optimal treatment
        remains contested.
      explanation: >-
        Describes the procedure acting directly on the tumor cavity, the mass
        node this link targets.
  evidence:
  - reference: PMID:39236154
    reference_title: 'The Role of Bone Grafting vs. Bone Cement in the Treatment of Giant Cell Tumor of Bone: A Systematic Review and Meta-Analysis on the Risk of Recurrence in 1,454 Patients.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Intralesional curettage with BG had a recurrence risk ratio of 1.68 (95%
      confidence interval [CI], 1.22-2.31, p = 0.001) when compared with BC.
    explanation: >-
      Quantifies the cement-versus-graft difference in a 1,454-patient
      meta-analysis: curettage plus bone graft carries a 68% higher recurrence
      risk than curettage plus cement.
  - reference: PMID:39236154
    reference_title: 'The Role of Bone Grafting vs. Bone Cement in the Treatment of Giant Cell Tumor of Bone: A Systematic Review and Meta-Analysis on the Risk of Recurrence in 1,454 Patients.'
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, the rates of recurrence remain substantial for both groups,
      necessitating careful consideration of the benefits and potential pitfalls
      associated with BC vs. BG when considering salvage options after
      recurrences.
    explanation: >-
      Supports the procedure while explicitly qualifying it: recurrence stays
      substantial regardless of filler, which is why this is PARTIAL.
  - reference: PMID:22773395
    reference_title: Which treatment is the best for giant cell tumors of the distal radius? A meta-analysis.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The use of PMMA versus bone graft did not affect the recurrence rate (RR,
      0.98; 95% CI, 0.44-2.17).
    explanation: >-
      A distal-radius meta-analysis that did not reproduce the cement advantage,
      recorded as PARTIAL because it qualifies the general recommendation by
      anatomical site.

- name: En Bloc Wide Resection
  description: >-
    Complete removal with a margin of normal tissue, giving markedly better
    local control than curettage at the cost of joint sacrifice and a
    reconstruction. Reserved for Campanacci grade III lesions, extensively
    destructive tumors, and some recurrences - the trade is fewer recurrences
    for more major complications, and the balance shifts with grade.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: orthopedic surgical procedure
    term:
      id: NCIT:C16186
      label: Orthopedic Surgical Procedure
  target_mechanisms:
  - target: Local Recurrence After Incomplete Removal
    treatment_effect: INHIBITS
    description: >-
      Removing the lesion with a margin eliminates the residual mutant stroma
      that drives recurrence after intralesional surgery.
    evidence:
    - reference: PMID:22773395
      reference_title: Which treatment is the best for giant cell tumors of the distal radius? A meta-analysis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Overall, patients in the intralesional excision group had a higher
        recurrence rate (relative risk [RR], 2.80; 95% CI, 1.17-6.71),
        especially for Campanacci grade 3 GCTs (RR, 4.90; 95% CI, 1.36-17.66)
      explanation: >-
        Quantifies the recurrence advantage of resection over intralesional
        excision, largest in high-grade tumors, the effect this mechanism link
        asserts.
  evidence:
  - reference: PMID:22773395
    reference_title: Which treatment is the best for giant cell tumors of the distal radius? A meta-analysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Overall, patients in the intralesional excision group had a higher
      recurrence rate (relative risk [RR], 2.80; 95% CI, 1.17-6.71), especially
      for Campanacci grade 3 GCTs (RR, 4.90; 95% CI, 1.36-17.66), yet fewer
      major complications (RR, 0.21; 95% CI, 0.09-0.54) than the en bloc
      resection group.
    explanation: >-
      Quantifies both sides of the trade-off, the far higher recurrence risk of
      intralesional excision overall and for Campanacci grade 3 tumors in
      particular, and the lower rate of major complications that is its
      counterweight.
  - reference: PMID:22773395
    reference_title: Which treatment is the best for giant cell tumors of the distal radius? A meta-analysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      intralesional excision appears to be more appropriate for the treatment of
      local lesions (e.g., grades 1 and 2) than grade 3 GCTs of the distal
      radius
    explanation: >-
      States the grade-dependent selection rule that assigns resection to
      higher-grade disease.

- name: Denosumab
  description: >-
    A fully human monoclonal antibody against RANKL, and the clearest example
    in this entry of a mechanism-directed therapy. By blocking RANKL it starves
    the reactive osteoclast compartment, eliminating the giant cells and
    halting resorption; the arrested stroma then differentiates and new bone
    forms in the lesion. It permits surgery to be downstaged or deferred in
    tumors that would otherwise require a morbid operation, and it is the
    principal option in unresectable axial disease. Two limits follow directly
    from the mechanism: it does not eliminate the mutant stroma, so tumors
    regrow when it stops; and tumors that have escaped osteoclast dependence
    through telomerase alterations are predicted not to respond.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: denosumab
      term:
        id: NCIT:C61313
        label: Denosumab
  target_mechanisms:
  - target: Stromal RANKL Overexpression
    treatment_effect: INHIBITS
    description: >-
      Denosumab binds RANKL directly, preventing engagement of RANK on
      osteoclast precursors. This is the node the drug occupies.
    evidence:
    - reference: PMID:20149736
      reference_title: 'Denosumab in patients with giant-cell tumour of bone: an open-label, phase 2 study.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We investigated the potential therapeutic effect of denosumab, a fully
        human monoclonal antibody against RANKL, on tumour-cell survival and
        growth in patients with GCT.
      explanation: >-
        Identifies RANKL as the molecular target of the antibody, matching the
        curated mechanism node.
  - target: Recruitment and Fusion of Reactive Osteoclast-Like Giant Cells
    treatment_effect: INHIBITS
    description: >-
      Downstream of RANKL blockade the giant cells are depleted, which is how
      histological response was defined in the first trial.
    evidence:
    - reference: PMID:20149736
      reference_title: 'Denosumab in patients with giant-cell tumour of bone: an open-label, phase 2 study.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The primary endpoint was tumour response, defined as elimination of at
        least 90% of giant cells or no radiological progression of the target
        lesion up to week 25.
      explanation: >-
        Shows that giant cell elimination is the measured effect of the drug,
        supporting this specific mechanism link.
  evidence:
  - reference: PMID:20149736
    reference_title: 'Denosumab in patients with giant-cell tumour of bone: an open-label, phase 2 study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      30 of 35 (86%; 95% CI 70-95) of evaluable patients had a tumour response:
      20 of 20 assessed by histology and 10 of 15 assessed by radiology.
    explanation: >-
      Quantifies the response rate in the proof-of-concept phase 2 study.
  - reference: PMID:26033180
    reference_title: Surgical downstaging in an open-label phase II trial of denosumab in patients with giant cell tumor of bone.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At the data cutoff date, most patients had not yet undergone surgery
      (n = 106; 48 %) or had a less morbid procedure (n = 84; 38 %) than
      originally planned.
    explanation: >-
      Documents the surgical-downstaging benefit that is the main reason for
      neoadjuvant use.
  - reference: PMID:31704134
    reference_title: 'Denosumab in patients with giant-cell tumour of bone: a multicentre, open-label, phase 2 study.'
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      28 (5%) patients had positively adjudicated osteonecrosis of the jaw, four
      (1%) had atypical femur fracture, and four (1%) had hypercalcaemia
      occurring 30 days after denosumab discontinuation.
    explanation: >-
      The large phase 2 safety dataset. Recorded as PARTIAL because it reports
      the toxicity that bounds long-term use rather than efficacy.
  - reference: PMID:31704134
    reference_title: 'Denosumab in patients with giant-cell tumour of bone: a multicentre, open-label, phase 2 study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      227 (92%; 95% CI 87-95) of 248 patients who received at least one dose of
      denosumab in cohort 2 had no surgery in the first 6 months of the study.
    explanation: >-
      Quantifies surgery avoidance in the surgically salvageable cohort.
  notes: >-
    Approved for adults and skeletally mature adolescents with unresectable
    GCTB, or where surgery would cause severe morbidity. Whether neoadjuvant
    denosumab raises post-curettage recurrence is genuinely unsettled and is
    curated as an explicit discussion below rather than asserted here.

- name: Zoledronic Acid
  description: >-
    A bisphosphonate used as a systemic or cement-loaded local adjuvant. Its
    mechanism in GCTB is not the same as denosumab's: in cell-line work it
    directly inhibits growth of and induces apoptosis in the neoplastic stromal
    cells, whereas denosumab does neither. That difference makes it
    conceptually attractive as an adjuvant against the compartment denosumab
    leaves behind, but the clinical evidence is small-trial and meta-analytic
    rather than definitive, so it is curated as a supported adjunct and not as
    standard of care.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: zoledronic acid
      term:
        id: CHEBI:46557
        label: zoledronic acid
  target_mechanisms:
  - target: Arrested Osteogenic Differentiation of the Neoplastic Stroma
    treatment_effect: INHIBITS
    description: >-
      Zoledronic acid acts on the neoplastic stromal compartment itself,
      inhibiting growth and inducing apoptosis in cell lines - the compartment
      that RANKL blockade does not touch.
    evidence:
    - reference: PMID:24060052
      reference_title: Comparison of the anti-tumor effects of denosumab and zoledronic acid on the neoplastic stromal cells of giant cell tumor of bone.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        ZOL was found to exhibit a dose-dependent inhibition in cell growth in
        all GCT stromal cell lines tested and cause apoptosis in two out of
        three cell lines.
      explanation: >-
        Demonstrates a direct anti-stromal effect, the basis for targeting this
        mechanism node rather than the RANKL node.
  evidence:
  - reference: PMID:32541321
    reference_title: Current concepts in the treatment of giant cell tumour of bone.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Also, the bisphosphonate zoledronic acid has activity in GCTB by directly
      targeting the neoplastic stromal cells.
    explanation: >-
      States the drug's activity and its stromal target. Evidence source is
      OTHER because this is a review article.
  - reference: PMID:32541321
    reference_title: Current concepts in the treatment of giant cell tumour of bone.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      In a small RCT, bisphosphonates were successful in controlling tumour
      growth and a higher apoptotic index of tumour cells was seen after
      zoledronic acid versus controls.
    explanation: >-
      The clinical support is a small randomized trial, so this is recorded as
      PARTIAL rather than SUPPORT. Evidence source is OTHER because the citing
      article is a review.

- name: Radiation Therapy
  description: >-
    Reserved for tumors that cannot be resected and where denosumab,
    bisphosphonates, and embolization are unavailable or have failed - largely
    spinal and sacral disease. The reason for that narrow indication is
    mechanistic rather than merely one of efficacy: irradiation is itself
    associated with later sarcomatous transformation of a tumor whose baseline
    transformation risk is already the most feared outcome.
  therapeutic_modality: RADIOTHERAPY
  treatment_term:
    preferred_term: radiation therapy
    term:
      id: NCIT:C15313
      label: Radiation Therapy
  target_mechanisms:
  - target: Locally Aggressive Osteolytic Tumor Mass
    treatment_effect: INHIBITS
    description: >-
      Achieves local control of an unresectable mass.
  evidence:
  - reference: PMID:21139931
    reference_title: 'The epidemiology of malignant giant cell tumors of bone: an analysis of data from the Surveillance, Epidemiology and End Results Program (1975-2004).'
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Malignant giant cell tumor (GCT) of bone is a rare tumor with debilitating
      consequences.
    explanation: >-
      Establishes the severity of the malignant outcome that motivates
      restricting radiotherapy. Recorded as PARTIAL because it characterizes
      the risk this treatment is limited by, not the treatment's efficacy.
  notes: >-
    A quotable statement of the radiotherapy-to-sarcoma association from a
    cached abstract was not identified in this curation pass. The association is
    long-standing in the literature and is the stated reason for restricting the
    modality; it is left as description and notes rather than attached to a
    snippet that does not say it.

- name: Embolization Therapy
  description: >-
    Selective arterial embolization, used preoperatively to reduce blood loss
    during surgery on a highly vascular tumor and, in some inoperable axial
    lesions, as a primary modality.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: embolization therapy
    term:
      id: NCIT:C15230
      label: Embolization Therapy
  target_mechanisms:
  - target: Locally Aggressive Osteolytic Tumor Mass
    treatment_effect: INHIBITS
    description: >-
      Devascularizes the tumor mass.
    evidence:
    - reference: PMID:21045974
      reference_title: 'Giant cell tumor of the sacrum and spine: series of 23 cases and a review of the literature.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        One sacral GCT patient was treated only with serial arterial embolization
        with good disease control.
      explanation: >-
        Embolization alone controlled the tumor mass in a patient who received no
        other treatment, the clearest available demonstration that
        devascularization acts on this node rather than merely assisting surgery.
  evidence:
  - reference: PMID:21045974
    reference_title: 'Giant cell tumor of the sacrum and spine: series of 23 cases and a review of the literature.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Six of the sacral GCT patients were treated with pre-operative arterial
      embolization and intralesional surgical resection, and two developed a
      recurrence.
    explanation: >-
      Documents the preoperative-adjunct use of embolization in sacral disease,
      the setting in which this treatment is standard practice.
  - reference: PMID:21045974
    reference_title: 'Giant cell tumor of the sacrum and spine: series of 23 cases and a review of the literature.'
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      conservative therapy involving arterial embolization and intralesional
      resection offers the best results.
    explanation: >-
      The authors' conclusion favouring embolization plus intralesional
      resection. Recorded as PARTIAL because the same abstract also concludes
      that en bloc resection should be preferred whenever possible, so this
      statement is a qualified recommendation for the sacral subset rather than
      a general one.
  notes: >-
    Evidence was attached on re-review. The earlier note recorded that no cached
    abstract stated the practice in quotable form; PMID:21045974, fetched in the
    same commit for the spinal-compression phenotype, does - a reminder that a
    "no evidence available" note can go stale the moment the cache grows, and
    should be re-checked rather than trusted.

differential_diagnoses:
- name: Chondroblastoma
  description: >-
    The other epiphyseal giant-cell-rich bone tumor, and the sharpest
    mechanistic contrast in this entry: it is driven by a p.Lys36Met
    substitution in H3-3B rather than p.Gly34Trp in H3-3A. The two oncohistone
    lesions are mutually exclusive and tumor-type specific, so the molecular
    test separates them definitively. Clinically, chondroblastoma occurs before
    physeal closure, whereas GCTB occurs after.
  distinguishing_features:
  - Driven by H3-3B p.Lys36Met rather than H3-3A p.Gly34Trp
  - Occurs in the skeletally immature, before physeal closure
  - Negative for H3.3 G34W mutant-protein immunohistochemistry
  evidence:
  - reference: PMID:24162739
    reference_title: Distinct H3F3A and H3F3B driver mutations define chondroblastoma and giant cell tumor of bone.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In 73 of 77 cases of chondroblastoma (95%), we found p.Lys36Met
      alterations predominantly encoded in H3F3B, which is one of two genes for
      histone H3.3.
    explanation: >-
      Establishes the distinct driver alteration and gene that separate
      chondroblastoma from GCTB.
  - reference: PMID:33021329
    reference_title: H3F3A G34 mutation DNA sequencing and G34W immunohistochemistry analysis in 366 cases of giant cell tumors of bone and other bone tumors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Other bone tumors all showed wild-type expression in both DNA sequencing
      and immunohistochemistry.
    explanation: >-
      Confirms that the non-GCTB tumors in the series, chondroblastoma among
      them, were negative by both assays.

- name: Tenosynovial Giant Cell Tumor
  description: >-
    Shares the words "giant cell tumor" and nothing mechanistic. TGCT arises
    from joints, bursae, and tendon sheaths rather than bone, and is driven by
    CSF1 rather than an oncohistone - so its targeted therapy is CSF1R
    inhibition, not RANKL blockade. Conflating the two is a real risk when
    searching the literature by name.
  distinguishing_features:
  - Arises from synovium, bursa, or tendon sheath rather than within bone
  - CSF1-driven, treated with CSF1R inhibitors rather than anti-RANKL antibody
  - Not associated with H3-3A p.Gly34Trp
  evidence:
  - reference: PMID:36502615
    reference_title: 'Best clinical management of tenosynovial giant cell tumour (TGCT): A consensus paper from the community of experts.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Tenosynovial giant cell tumour (TGCT) is a rare, locally aggressive,
      mesenchymal tumor arising from the joints, bursa and tendon sheaths.
    explanation: >-
      Establishes the distinct anatomical origin that separates TGCT from a
      primary bone tumor. Evidence source is OTHER because this is a consensus
      paper.
  - reference: PMID:36502615
    reference_title: 'Best clinical management of tenosynovial giant cell tumour (TGCT): A consensus paper from the community of experts.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      CSFR1 inhibitors are effective with benefit on symptoms and QoL but are
      not available in most countries.
    explanation: >-
      Documents the entirely different drug target, the practical consequence of
      confusing the two entities. Evidence source is OTHER because this is a
      consensus paper.

- name: Aneurysmal Bone Cyst
  description: >-
    A blood-filled cystic lytic lesion that both mimics GCTB radiographically
    and occurs as a secondary change within one. Fluid-fluid levels on MRI
    favour it, but their presence does not exclude a giant cell tumor with
    secondary cystic change - which is why the H3.3 G34W stain matters here.
  distinguishing_features:
  - Fluid-fluid levels on MRI, though these also occur in GCTB with secondary cystic change
  - Negative for H3.3 G34W mutant-protein immunohistochemistry
  evidence:
  - reference: PMID:33021329
    reference_title: H3F3A G34 mutation DNA sequencing and G34W immunohistochemistry analysis in 366 cases of giant cell tumors of bone and other bone tumors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Other bone tumors all showed wild-type expression in both DNA sequencing
      and immunohistochemistry.
    explanation: >-
      The nine aneurysmal bone cysts in this series were among the non-GCTB
      tumors negative by both assays, supporting the molecular discriminator.

- name: Malignant Giant Cell Tumor of Bone
  description: >-
    Not a mimic but a progression, and the distinction that changes management
    most. A high-grade sarcoma arising primarily alongside or secondarily at the
    site of a conventional tumor. It may retain or lose the H3.3 G34W stain, so
    a negative stain in a giant-cell-rich sarcoma does not exclude it.
  distinguishing_features:
  - High-grade sarcomatous histology, most often osteosarcoma
  - May carry TP53 mutation or loss of H3K27me3
  - The H3-3A G34W mutation is lost in a substantial fraction of malignant components
  evidence:
  - reference: PMID:31285528
    reference_title: Absence of H3F3A mutation in a subset of malignant giant cell tumor of bone.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, in the remaining five cases, in contrast to their associated
      H3F3A G34W-mutant giant cell tumor, the sarcoma lacked the H3F3A G34W
      mutation, either entirely or sub-clonally in the samples tested.
    explanation: >-
      Documents the mutation loss that makes a negative stain uninformative for
      excluding malignant transformation.


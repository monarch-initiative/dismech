pathophysiology:
- name: KIZ c.226C>T Exonic Splicing Enhancer Disruption
  biological_scale: MOLECULAR
  description: >-
    Besides creating a premature stop codon in exon 3, the founder c.226C>T
    (p.Arg76*) change lies in a predicted SRSF5-recognized exonic splicing
    enhancer. Patient fibroblasts show less full-length transcript and more
    transcripts lacking exon 3, all of which are out of frame, so the allele
    removes kizuna by two routes.
  biological_processes:
  - preferred_term: alternative mRNA splicing
    term:
      id: GO:0000380
      label: alternative mRNA splicing, via spliceosome
    modifier: DYSREGULATED
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  evidence:
  - reference: PMID:38927740
    reference_title: "Genetic and Clinical Analyses of the KIZ-c.226C>T Variant Resulting in a Dual Mutational Mechanism."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Our data indicate that p.R76* affect an ESE which in turn results in the
      pronounced skipping of exon 3.
    explanation: The founder allele causes exon 3 skipping in patient fibroblasts.
  - reference: PMID:38927740
    reference_title: "Genetic and Clinical Analyses of the KIZ-c.226C>T Variant Resulting in a Dual Mutational Mechanism."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: It should be noted here that transcripts 2–4, in which exon 3 is skipped, are out of frame.
    explanation: The exon 3-skipped transcripts cannot encode functional kizuna either.
  downstream:
  - target: Biallelic KIZ Loss of Function
    causal_link_type: DIRECT
    description: >-
      Exon 3 skipping adds a second, splicing-based route to loss of
      functional kizuna for the founder allele.
    evidence:
    - reference: PMID:38927740
      reference_title: "Genetic and Clinical Analyses of the KIZ-c.226C>T Variant Resulting in a Dual Mutational Mechanism."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Surprisingly, both analyses revealed lower expression of Transcript 1
        in patients compared to controls.
      explanation: Less canonical full-length KIZ transcript in homozygous patient cells.
- name: Biallelic KIZ Loss of Function
  biological_scale: MOLECULAR
  conforms_to: "photoreceptor_degeneration#Photoreceptor Gene Defect"
  description: >-
    Biallelic nonsense, frameshift and start-loss variants remove functional
    kizuna. Kizuna is a centrosomal protein phosphorylated by PLK1; in
    dividing cells it keeps the pericentriolar material attached to the
    centrioles so that the mitotic spindle stays bipolar. Its function in
    post-mitotic photoreceptors is not known. ClinGen records biallelic loss
    of function as the mechanism. Patient fibroblasts compound heterozygous
    for two truncating alleles showed no detectable change in KIZ transcript
    level, protein localization or cilium length, so the expected loss of
    protein has not been demonstrated in patient cells.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION

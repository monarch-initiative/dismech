name: KIZ-related Retinopathy
creation_date: "2026-10-30T18:00:00Z"
category: Mendelian
description: >-
  KIZ-related retinopathy is an autosomal recessive, non-syndromic retinitis
  pigmentosa (rod-cone dystrophy) caused by biallelic loss-of-function variants
  in KIZ, which encodes kizuna, a centrosomal substrate of the mitotic kinase
  PLK1. In photoreceptors the mouse ortholog localizes to the base of the
  connecting cilium, so the disease is classed with the retinal ciliopathies,
  although how loss of kizuna damages photoreceptors has not been shown
  directly. Patients have night blindness followed by progressive visual field
  constriction, a rod-greater-than-cone ERG, a perifoveal ring of
  hyperautofluorescence with surrounding RPE atrophy, and outer retinal thinning
  with a centrally preserved ellipsoid zone; central acuity is often retained
  into the sixth decade and cone responses into the seventh, so the disease is
  milder on average than DHDDS- or FAM161A-associated retinitis pigmentosa,
  although some patients lose acuity earlier. Cystoid macular edema occurs in a
  minority and responds to carbonic anhydrase inhibitors. Nearly all reported
  patients carry the nonsense allele c.226C>T (p.Arg76*), a founder allele in
  Ashkenazi Jews that also disrupts an exonic splicing enhancer and causes
  exon 3 skipping. No disease-specific therapy exists.

genetic:
- name: KIZ
  gene_term:
    preferred_term: KIZ
    term:
      id: hgnc:15865
      label: KIZ
  relationship_type: CAUSATIVE
  association: Causative
  variant_origin: GERMLINE
  features: >-
    Biallelic loss-of-function variants: the founder nonsense allele
    c.226C>T (p.Arg76*), nonsense c.52G>T (p.Glu18*) and c.247C>T (p.Arg83*),
    frameshift c.119_122del (p.Lys40Ilefs*14), and start-loss c.3G>A
    (p.Met1?). ClinGen counted four variants in 14 probands from six
    publications.
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_f0705bfe-f3fa-495f-8a5d-77561d0afe91-2023-02-02T170000.000Z
    evidence:
    - reference: CGGV:assertion_f0705bfe-f3fa-495f-8a5d-77561d0afe91-2023-02-02T170000.000Z
      reference_title: KIZ / KIZ-related retinopathy (Definitive)
      supports: SUPPORT
      evidence_source: OTHER
      snippet: KIZ | HGNC:15865 | KIZ-related retinopathy | MONDO:0700232 | AR | Definitive
      explanation: ClinGen Retina GCEP classification row.
  case_fractions:
  - population: Israeli and Palestinian RP families (Israeli IRD cohort)
    case_fraction_percent: 3.6
    cohort_size: 839
    notes: >-
      30 of 839 RP families carried biallelic KIZ variants; the percentage is
      computed from those two counts.
    evidence:
    - reference: PMID:38927740
      reference_title: "Genetic and Clinical Analyses of the KIZ-c.226C>T Variant Resulting in a Dual Mutational Mechanism."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Our cohort of IRD cases within the Israeli and Palestinian populations
        comprises 839 families affected by RP (with 1163 recruited patients).
      explanation: Denominator of RP families.
    - reference: PMID:38927740
      reference_title: "Genetic and Clinical Analyses of the KIZ-c.226C>T Variant Resulting in a Dual Mutational Mechanism."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        we identified 30 families with RP (Table 1 and Figure S1), including
        31 RP patients harbouring biallelic pathogenic variants in KIZ
      explanation: Numerator, 30 RP families with biallelic KIZ variants, stated directly in the source.
  variants:
  - name: c.226C>T p.Arg76*
    description: >-
      Nonsense variant in exon 3 and the most common allele, carried
      homozygously by 28 of 31 patients in the largest cohort; a founder allele
      among patients of Jewish descent. It also disrupts an exonic splicing
      enhancer and causes exon 3 skipping, which the authors expect to limit
      RNA-based therapies.
    variant_type: single nucleotide variant
    synonyms:
    - p.R76*
    - p.Arg76Ter
    evidence:
    - reference: PMID:38927740
      reference_title: "Genetic and Clinical Analyses of the KIZ-c.226C>T Variant Resulting in a Dual Mutational Mechanism."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: c.226C>T is a founder mutation among patients of Jewish descent.
      explanation: Founder effect.
    - reference: PMID:38927740
      reference_title: "Genetic and Clinical Analyses of the KIZ-c.226C>T Variant Resulting in a Dual Mutational Mechanism."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Thirty-one patients with biallelic KIZ mutations were identified: 28
        homozygous for c.226C>T (p.R76*), 2 compound heterozygous for p.R76*
        and c.3G>A (p.M1?), and one homozygous for c.247C>T (p.R83*).
      explanation: Genotype distribution in the largest cohort.
  - name: c.3G>A p.Met1?
    description: >-
      Start-loss variant, first found homozygous in a patient whose parents
      were cousins of Sephardic Jewish origin from Tunisia, later in trans
      with p.Arg76*, and in a 62-year-old homozygote with a relatively mild
      course.
    variant_type: single nucleotide variant
    evidence:
    - reference: PMID:29057815
      reference_title: Further Insights into the Ciliary Gene and Protein KIZ and Its Murine Ortholog PLK1S1 Mutated in Rod-Cone Dystrophy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Analyses of additional RCD patients enabled the identification of two
        homozygous mutations in KIZ, the known c.226C>T (p.Arg76*) mutation and
        a novel variant, the c.3G>A (p.Met1?) mutation.
      explanation: First report of the start-loss allele.
    - reference: PMID:41557064
      reference_title: Retained cone-responses in homozygous start codon variant in KIZ-associated retinitis pigmentosa.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        This case expands the clinical spectrum of KIZ-associated RP by
        describing the phenotype associated with a homozygous start codon
        variant.
      explanation: Phenotype of a homozygote.
  - name: c.119_122del p.Lys40Ilefs*14 and c.52G>T p.Glu18*
    description: >-
      Frameshift and nonsense alleles found together in a compound
      heterozygote; the frameshift was later found homozygous in an unrelated
      patient.
    variant_type: deletion
    evidence:
    - reference: PMID:24680887
      reference_title: Whole-exome sequencing identifies KIZ as a ciliary gene associated with autosomal-recessive rod-cone dystrophy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        another with compound-heterozygous mutations c.119_122delAACT
        (p.Lys40Ilefs(∗)14) and c.52G>T (p.Glu18(∗)).
      explanation: Compound heterozygous truncating alleles.
    - reference: PMID:32052671
      reference_title: Progressive RPE atrophy and photoreceptor death in KIZ-associated autosomal recessive retinitis pigmentosa.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Two homozygous variants in KIZ-a c.226C>T mutation as well as a
        previously unreported c.119_122delAACT mutation-were identified in four
        unrelated patients.
      explanation: The frameshift in the homozygous state.
diagnosis:
- name: Molecular Genetic Testing
  description: >-
    Biallelic KIZ variants confirm the diagnosis, found by Sanger sequencing,
    gene panels or exome sequencing. The authors of the largest cohort suggest
    considering KIZ in RP patients of Ashkenazi or North African Jewish
    ancestry with a rod-greater-than-cone ERG and a low EOG Arden ratio.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  evidence:
  - reference: PMID:38927740
    reference_title: "Genetic and Clinical Analyses of the KIZ-c.226C>T Variant Resulting in a Dual Mutational Mechanism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hence, patients who belong to Ashkenazi or North-African Jewish ancestry
      may potentially carry biallelic KIZ mutation(s) as the underlying cause
      of their disease.
    explanation: Ancestry-guided testing.
  - reference: PMID:41557064
    reference_title: Retained cone-responses in homozygous start codon variant in KIZ-associated retinitis pigmentosa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings support the inclusion of KIZ in diagnostic panels for
      autosomal recessive RP and contribute valuable genotype-phenotype
      correlation data for this rare ciliopathy.
    explanation: KIZ belongs on recessive RP panels.
- name: Fundus Autofluorescence Imaging
  description: >-
    Fundus changes can be subtle, but autofluorescence abnormalities, a
    macular hyperautofluorescent ring with surrounding hypoautofluorescence,
    were found in every patient of the largest cohort.
  diagnosis_term:
    preferred_term: fundus autofluorescence imaging
    term:
      id: NCIT:C162465
      label: Fundus Autofluorescence Imaging
  evidence:
  - reference: PMID:38927740
    reference_title: "Genetic and Clinical Analyses of the KIZ-c.226C>T Variant Resulting in a Dual Mutational Mechanism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The retinal manifestations of KIZ patients are often subtle and may be
      missed on routine clinical examination; hence, it should be noted that
      all patients exhibited retinal changes that were readily identifiable on
      fundus autofluorescence.
    explanation: Autofluorescence detects disease that fundus examination can miss.
- name: Full-Field Electroretinography
  description: >-
    Full-field ERG shows a rod-cone pattern, with reduced or extinguished rod
    responses and relatively preserved but delayed cone flicker responses.
  diagnosis_term:
    preferred_term: full-field electroretinography
    term:
      id: NCIT:C101217
      label: Retinal Examination
  notes: >-
    NCIT has no electroretinography term (an OLS4 search of NCIT for
    "electroretinography" returned no results), so the broader Retinal
    Examination is bound, as in MAK-related_Retinopathy.
  evidence:
  - reference: PMID:38927740
    reference_title: "Genetic and Clinical Analyses of the KIZ-c.226C>T Variant Resulting in a Dual Mutational Mechanism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Full-field ERG (ffERG) was performed in 14 patients (Figure 1B–D),
      revealing a pattern consistent with rod-cone dystrophy.
    explanation: The ERG pattern in KIZ-related RP.
treatments:
- name: Topical Carbonic Anhydrase Inhibitor for Cystoid Macular Edema
  description: >-
    Topical dorzolamide or other carbonic anhydrase inhibitors reduced
    cystoid macular changes in reported patients. This treats a complication
    and does not alter the retinal degeneration.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: dorzolamide
      term:
        id: CHEBI:4702
        label: dorzolamide
  target_mechanisms:
  - target: Cystoid macular edema
    treatment_effect: INHIBITS
    description: Reduces cystoid macular fluid.
  evidence:
  - reference: PMID:31556760
    reference_title: Retinal dystrophy associated with a Kizuna (KIZ) mutation and a predominantly macular phenotype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patient was treated with topical dorzolamide and showed significant
      improvement in the degree of macular cysts.
    explanation: Response of macular cysts to dorzolamide in a case report.
  - reference: PMID:38927740
    reference_title: "Genetic and Clinical Analyses of the KIZ-c.226C>T Variant Resulting in a Dual Mutational Mechanism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Two patients had cystoid macular oedema (CME) with a good response to carbonic anhydrase inhibitors.
    explanation: Response of CME in two cohort patients.
- name: Site-Directed RNA Editing of p.Arg76* (Preclinical)
  description: >-
    Guide RNAs recruiting endogenous ADAR were selected to recode the
    p.Arg76* premature stop codon (UGA to UGG, tryptophan) in a yeast and
    human cell reporter system; this has not been tested in retina or
    patients. Because the founder allele also causes exon 3 skipping, the
    authors of the largest cohort expect RNA-based approaches to have low
    efficacy against it.
  therapeutic_modality: OTHER
  target_mechanisms:
  - target: Biallelic KIZ Loss of Function
    treatment_effect: RESTORES
    description: Would restore a full-length reading frame from the founder allele.
  evidence:
  - reference: PMID:38375504
    reference_title: A pipeline for identifying guide RNA sequences that promote RNA editing of nonsense mutations that cause inherited retinal diseases.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We have used this pipeline to modify the sequence of transcripts
      carrying nonsense mutations that cause inherited retinal diseases in the
      FAM161A, KIZ, TRPM1, and USH2A genes.
    explanation: RNA editing of KIZ nonsense transcripts in reporter cells.
  - reference: PMID:38927740
    reference_title: "Genetic and Clinical Analyses of the KIZ-c.226C>T Variant Resulting in a Dual Mutational Mechanism."
    supports: REFUTE
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: Therefore, RNA-based therapies might show low efficacy since the mutant transcripts are spliced.
    explanation: Exon 3 skipping is predicted to limit RNA-based correction of the founder allele.
experimental_models:
- name: Patient-derived KIZ-mutant dermal fibroblasts
  experimental_model_type: PRIMARY_CELL_CULTURE
  publication: PMID:29057815
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_source: Serum-deprived dermal fibroblasts from a patient compound heterozygous for c.52G>T and c.119_122del, and from c.226C>T homozygotes
  description: >-
    Compound heterozygous patient fibroblasts showed KIZ at the basal body of
    primary cilia, normal KIZ expression and normal cilium length; fibroblasts
    homozygous for c.226C>T showed exon 3 skipping.
  modeled_mechanisms:
  - target: Photoreceptor Connecting Cilium Dysfunction
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: CELLULAR
    description: No ciliary defect was detected in patient fibroblasts.
    limitations: >-
      Fibroblast primary cilia lack the connecting cilium and outer segment,
      and the truncating alleles did not lower KIZ expression in these cells,
      so the cells may not model the photoreceptor deficit at all.
    divergences:
    - divergence_type: BOUNDARY_OMISSION
      materiality: INVALIDATING
      description: >-
        The photoreceptor connecting cilium and outer segment, where the
        disease is thought to act, do not exist in a fibroblast; only a
        primary cilium is present.
    evidence:
    - reference: PMID:29057815
      reference_title: Further Insights into the Ciliary Gene and Protein KIZ and Its Murine Ortholog PLK1S1 Mutated in Rod-Cone Dystrophy.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Furthermore, the averaged monocilia length in the two fibroblast cell
        lines was similar, consistent with the preserved immunolocalization of
        KIZ at the basal body of the primary cilia.
      explanation: Normal cilium length in patient fibroblasts.
  - target: KIZ c.226C>T Exonic Splicing Enhancer Disruption
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: Fibroblasts homozygous for c.226C>T show exon 3 skipping.
    limitations: >-
      Splicing was measured in fibroblasts, not in retina, where KIZ is most
      highly expressed and splicing factor levels may differ.
    evidence:
    - reference: PMID:38927740
      reference_title: "Genetic and Clinical Analyses of the KIZ-c.226C>T Variant Resulting in a Dual Mutational Mechanism."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Hence, pronounced skipping of exon 3 which carries the pathogenic
        nonsense variant was evident in patients compared to healthy controls.
      explanation: Exon 3 skipping in patient fibroblasts.
discussions:
- discussion_id: kiz_photoreceptor_function
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Loss of Kizuna at the Photoreceptor Ciliary Base
  - pathophysiology#Photoreceptor Connecting Cilium Dysfunction
  prompt: >-
    What does kizuna do in post-mitotic photoreceptors, and does its loss
    damage the connecting cilium or outer segment?
  rationale: >-
    Kizuna's only characterized function is stabilizing pericentriolar
    material in dividing cells. The photoreceptor mechanism rests on
    localization of the mouse ortholog to the base of the connecting cilium,
    patient fibroblasts show no ciliary defect, and no KIZ-deficient animal or
    retinal organoid model has been described, so the steps between loss of
    kizuna and rod degeneration are inferred.
  evidence:
  - reference: PMID:29057815
    reference_title: Further Insights into the Ciliary Gene and Protein KIZ and Its Murine Ortholog PLK1S1 Mutated in Rod-Cone Dystrophy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Together, our findings unveil the limitations of fibroblasts as a
      cellular model for RCD and call for other models such as induced
      pluripotent stem cells to shed light on retinal pathogenic mechanisms of
      KIZ mutations.
    explanation: The authors state that the retinal mechanism is unresolved.
  proposed_experiments:
  - experiment_id: kiz_patient_retinal_organoid_cilium
    name: Connecting cilium and outer segment structure in KIZ patient retinal organoids
    description: >-
      Compare connecting cilium length, basal body and pericentriolar
      material organization, outer segment formation and opsin localization
      in photoreceptors of retinal organoids from c.226C>T homozygous patient
      iPSCs against gene-corrected isogenic controls.
    would_support:
    - pathophysiology#Photoreceptor Connecting Cilium Dysfunction
- discussion_id: kiz_rpe_atrophy_origin
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - pathophysiology#Progressive Retinal Pigment Epithelium Atrophy
  prompt: >-
    Is RPE atrophy in KIZ-related retinopathy secondary to photoreceptor loss,
    or partly a primary RPE defect?
  rationale: >-
    RPE atrophy advances together with photoreceptor loss, KIZ transcript is
    present in the RPE, and the EOG is lower than the ERG predicts in most
    patients tested, so a primary RPE contribution has not been excluded.
  evidence:
  - reference: PMID:38927740
    reference_title: "Genetic and Clinical Analyses of the KIZ-c.226C>T Variant Resulting in a Dual Mutational Mechanism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      EOG was performed in 6 patients, showing a reduced Arden ratio to values
      that were lower than those expected by the amplitudes of the ffERG in
      five out of the six cases
    explanation: EOG reduction beyond the photoreceptor deficit.
differential_diagnoses:
- name: Retinitis pigmentosa 59 (DHDDS)
  description: >-
    A recessive RP common in Jewish patients; on average more severe than KIZ
    disease. FAM161A-associated RP (retinitis pigmentosa 28) is similarly
    more severe.
  distinguishing_features:
  - More severe disease on average, by a principal component score of onset, ERG and acuity.
  disease_term:
    preferred_term: retinitis pigmentosa 59
    term:
      id: MONDO:0013468
      label: retinitis pigmentosa 59
  evidence:
  - reference: PMID:38927740
    reference_title: "Genetic and Clinical Analyses of the KIZ-c.226C>T Variant Resulting in a Dual Mutational Mechanism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There were discernible differences in the PCA1 scores between 2 groups;
      patients with mutations in DHDDS and FAM161A exhibited lower PCA1
      scores, indicative of a more severe retinal disease compared to patients
      with mutations in KIZ and MAK.
    explanation: DHDDS and FAM161A disease is more severe than KIZ disease.
- name: MAK-related retinopathy
  description: >-
    The most common founder cause of recessive RP in Ashkenazi Jews, with a
    similarly mild course; MAK patients have a later onset and better acuity
    on average.
  distinguishing_features:
  - Later age of onset and better visual acuity on average.
  disease_term:
    preferred_term: MAK-related retinopathy
    term:
      id: MONDO:0700229
      label: MAK-related retinopathy
  evidence:
  - reference: PMID:38927740
    reference_title: "Genetic and Clinical Analyses of the KIZ-c.226C>T Variant Resulting in a Dual Mutational Mechanism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pairwise t-test analysis comparing VA and ERG responses of patients with
      KIZ mutations to previously described cases harbouring mutations in
      DHDDS, FAM161A, or MAK ... revealed that KIZ patients have on
      average higher cone and mixed ERG responses, while the MAK group showed
      higher age of onset and better VA compared to the other three groups
    explanation: MAK disease starts later with better acuity.
notes: >-
  No GeneReviews chapter covers this disease; the GeneReviews nonsyndromic
  retinitis pigmentosa overview is not disease-specific and is not cited.
  About 51 patients have been reported, 31 of them in one Israeli cohort, so
  phenotype frequencies come mainly from that cohort, in which not every test
  was done in every patient. Late-onset hearing loss in two patients has been
  suggested as an extra-ocular feature but is not established.

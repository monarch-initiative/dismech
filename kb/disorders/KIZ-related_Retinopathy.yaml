phenotypes:
- name: Rod-cone dystrophy
  category: Ocular
  description: >-
    Every reported patient has retinitis pigmentosa with a rod-cone ERG
    pattern; severity and age of onset vary. In the largest cohort the disease
    was on average milder than DHDDS- or FAM161A-associated RP, while a
    four-patient series described it as early-onset and severe.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Rod-cone dystrophy
    term:
      id: HP:0000510
      label: Rod-cone dystrophy
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:38927740
    reference_title: "Genetic and Clinical Analyses of the KIZ-c.226C>T Variant Resulting in a Dual Mutational Mechanism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Full-field ERG (ffERG) was performed in 14 patients (Figure 1B–D),
      revealing a pattern consistent with rod-cone dystrophy.
    explanation: Rod-cone ERG pattern in the 14 patients tested.
  - reference: PMID:38927740
    reference_title: "Genetic and Clinical Analyses of the KIZ-c.226C>T Variant Resulting in a Dual Mutational Mechanism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The clinical parameters were less severe in KIZ compared to DHDDS and FAM161A cases.
    explanation: Relative severity in the 31-patient cohort.
  - reference: PMID:32052671
    reference_title: Progressive RPE atrophy and photoreceptor death in KIZ-associated autosomal recessive retinitis pigmentosa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: KIZ-associated RP is an early-onset severe rod-cone dystrophy.
    explanation: A smaller series reports a more severe course.

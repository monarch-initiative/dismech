    term:
      id: GO:0019901
      label: protein kinase binding
    modifier: DECREASED
  evidence:
  - reference: CGGV:assertion_f0705bfe-f3fa-495f-8a5d-77561d0afe91-2023-02-02T170000.000Z
    reference_title: KIZ / KIZ-related retinopathy (Definitive)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The mechanism of pathogenicity appears to be biallelic loss of function.
    explanation: ClinGen records biallelic loss of function as the disease mechanism.
  - reference: PMID:16980960
    reference_title: The Plk1 target Kizuna stabilizes mitotic centrosomes to ensure spindle bipolarity.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: >-
      Here, we identify a novel centrosomal substrate of Plk1, Kizuna (Kiz),
      depletion of which causes fragmentation and dissociation of the
      pericentriolar material from centrioles at prometaphase, resulting in
      multipolar spindles.
    explanation: >-
      Kizuna is a PLK1 substrate needed for pericentriolar material integrity
      in mitotic cells; the protein kinase binding term records the
      kinase-substrate relationship, which is the only activity of kizuna
      that has been characterized.
  - reference: PMID:29057815
    reference_title: Further Insights into the Ciliary Gene and Protein KIZ and Its Murine Ortholog PLK1S1 Mutated in Rod-Cone Dystrophy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      However, albeit the mutations were predicted to lead to nonsense mediated
      mRNA decay, we could not detect changes upon expression levels, protein
      localization or cilia length in KIZ-mutated fibroblast cells.
    explanation: >-
      The truncating alleles are predicted null, but the predicted loss could
      not be shown in patient fibroblasts.
  downstream:
  - target: Loss of Kizuna at the Photoreceptor Ciliary Base
    causal_link_type: DIRECT
- name: Loss of Kizuna at the Photoreceptor Ciliary Base
  biological_scale: CELLULAR
  conforms_to: "ciliopathy_dysfunction#Basal Body and Transition Zone Dysfunction"
  description: >-
    KIZ is expressed most highly in retina, and the mouse transcript is found
    in rod photoreceptors of the outer nuclear layer. Mouse PLK1S1 localizes
    to the base of the rod connecting cilium, and human KIZ to the basal body
    of primary cilia in fibroblasts. Loss of kizuna is therefore expected to
    remove a component of the photoreceptor ciliary base; this step rests on
    localization, not on a demonstrated defect.

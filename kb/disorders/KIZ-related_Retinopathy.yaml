    reference_title: Whole-exome sequencing identifies KIZ as a ciliary gene associated with autosomal-recessive rod-cone dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Herein, we applied whole-exome sequencing to a consanguineous family with
      one subject affected with RCD and identified a homozygous nonsense
      mutation, c.226C>T (p.Arg76(∗)), in KIZ, which encodes centrosomal
      protein kizuna.
    explanation: Defines KIZ as a rod-cone dystrophy (retinitis pigmentosa) gene.
  - reference: PMID:38927740
    reference_title: "Genetic and Clinical Analyses of the KIZ-c.226C>T Variant Resulting in a Dual Mutational Mechanism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All subjects with biallelic KIZ mutations were diagnosed with RP but
      displayed clinical variability in the age of onset and disease
      progression
    explanation: All 31 patients in the largest cohort had retinitis pigmentosa.

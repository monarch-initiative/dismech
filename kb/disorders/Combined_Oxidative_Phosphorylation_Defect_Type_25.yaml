pathophysiology:
- name: MARS2 Loss of Function
  biological_scale: MOLECULAR
  conforms_to: "mitochondrial_translation_deficiency#Mitochondrial Translation Machinery Lesion"
  description: >-
    Biallelic MARS2 variants reduce mitochondrial methionyl-tRNA synthetase.
    In the first family a nonsense allele and a missense allele left
    patient lymphoblasts with less MARS2 protein. Because mitochondria have a
    single tRNA-Met for both initiation and elongation, less charging limits
    every mitochondrially translated polypeptide.
  genes:
  - preferred_term: MARS2
    term:
      id: hgnc:25133
      label: MARS2
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  molecular_functions:
  - preferred_term: methionine-tRNA ligase activity
    modifier: DECREASED
    term:
      id: GO:0004825
      label: methionine-tRNA ligase activity
  biological_processes:
  - preferred_term: mitochondrial methionyl-tRNA aminoacylation
    modifier: DECREASED
    term:
      id: GO:0070155
      label: mitochondrial methionyl-tRNA aminoacylation
  evidence:
  - reference: PMID:25754315
    reference_title: Novel, compound heterozygous, single-nucleotide variants in MARS2 associated with developmental delay, poor growth, and sensorineural hearing loss.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We show that compound heterozygous mutations c.550C>T:p.Gln 184* and
      c.424C>T:p.Arg142Trp in MARS2 lead to decreased MARS2 protein levels in
      patient lymphoblasts.
    explanation: Less MARS2 protein in patient cells.
  - reference: PMID:39995633
    reference_title: A girl with intragenic variants in MARS2 and a chondrodysplasia phenotype.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: >-
      Human mitochondrial methionyl-tRNA is particularly important in
      mitochondrial translation because it is the only molecule that acts as
      both a polypeptide chain initiator and chain elongator.
    explanation: Why loss of tRNA-Met charging affects all of mitochondrial translation.
  downstream:
  - target: Impaired Mitochondrial Translation
    causal_link_type: DIRECT
    description: Less charged tRNA-Met limits initiation and elongation of mitochondrial translation.
- name: Impaired Mitochondrial Translation
  biological_scale: CELLULAR
  conforms_to: "mitochondrial_translation_deficiency#Impaired Synthesis of mtDNA-Encoded OXPHOS Subunits"
  description: >-
    Mitochondrially encoded subunits of complexes I and IV fall in patient
    fibroblasts and lymphoblasts, and wild-type MARS2 restores them.
  biological_processes:
  - preferred_term: mitochondrial translation
    modifier: DECREASED
    term:
      id: GO:0032543
      label: mitochondrial translation
  evidence:
  - reference: PMID:25754315
    reference_title: Novel, compound heterozygous, single-nucleotide variants in MARS2 associated with developmental delay, poor growth, and sensorineural hearing loss.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Immunoblotting of patient fibroblast and lymphoblast samples revealed
      reduced protein levels of NDUFB8 and COXII, representing complex I and
      IV, respectively.
    explanation: Reduced complex I and IV subunits, COXII being mitochondrially encoded.
  - reference: PMID:25754315
    reference_title: Novel, compound heterozygous, single-nucleotide variants in MARS2 associated with developmental delay, poor growth, and sensorineural hearing loss.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Additionally, overexpression of wild-type MARS2 in patient fibroblasts
      increased NDUFB8 and COXII protein levels.
    explanation: Complementation restores the subunits.
  downstream:
  - target: Combined Respiratory Chain Deficiency
    causal_link_type: DIRECT
    description: Too few mitochondrially encoded subunits are made for complexes I and IV.
- name: Combined Respiratory Chain Deficiency
  biological_scale: CELLULAR
  conforms_to: "mitochondrial_translation_deficiency#Combined Respiratory Chain Complex Deficiency"
  description: >-
    Complex I and IV activities were reduced in fibroblasts of the first
    family. In the second family fibroblast respiratory chain activity and
    oxygen consumption were in the normal range, while plasma lactate and urine
    organic acids pointed to mitochondrial disease.
  biological_processes:
  - preferred_term: oxidative phosphorylation
    modifier: DECREASED
    term:
      id: GO:0006119
      label: oxidative phosphorylation
  evidence:
  - reference: PMID:25754315
    reference_title: Novel, compound heterozygous, single-nucleotide variants in MARS2 associated with developmental delay, poor growth, and sensorineural hearing loss.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Analysis of respiratory complex enzyme activities in patient fibroblasts
      revealed decreased complex I and IV activities.
    explanation: Combined complex I and IV deficiency in patient fibroblasts.
  - reference: PMID:39995633
    reference_title: A girl with intragenic variants in MARS2 and a chondrodysplasia phenotype.
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: >-
      The results of the mitochondrial respiratory chain activity examination
      using skin fibroblasts were within the normal range.
    explanation: The second patient's fibroblasts showed no respiratory chain defect.
  downstream:
  - target: Systemic Energy Failure
    causal_link_type: DIRECT
    description: The respiratory chain defect limits oxidative ATP supply in high-demand tissues.
  - target: Increased circulating lactate concentration
    causal_link_type: DIRECT
    description: With oxidative phosphorylation constrained, pyruvate is reduced to lactate.
  - target: Decreased activity of mitochondrial complex I
    causal_link_type: DIRECT
    description: Complex I activity is reduced in patient fibroblasts.
  - target: Decreased activity of mitochondrial complex IV
    causal_link_type: DIRECT
    description: Complex IV activity is reduced in patient fibroblasts.
- name: Systemic Energy Failure
  biological_scale: ORGANISM
  conforms_to: "mitochondrial_translation_deficiency#Tissue-Selective Energy Failure"
  description: >-
    The reported features span the brain (developmental delay, hypotonia,
    ventricular dilatation and white matter change), hearing, growth and
    growth hormone secretion. Which tissues the defect reaches, and why it
    also seems to involve the skeleton, has not been studied; the authors of
    the first report raised a second genetic change as an alternative
    explanation for the pectus carinatum.
  evidence:
  - reference: PMID:25754315
    reference_title: Novel, compound heterozygous, single-nucleotide variants in MARS2 associated with developmental delay, poor growth, and sensorineural hearing loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The proband and his affected sibling have clinical features consistent
      with a mitochondrial disorder including neuromuscular abnormalities,
      multi-system involvement, failure to thrive, and involvement of hearing,
      endocrine, and gastrointestinal systems.
    explanation: The multisystem picture in the first family.
  downstream:
  - target: Global developmental delay
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Energy failure in the developing brain presents as global developmental delay.
  - target: Generalized hypotonia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: The neuromuscular involvement presents as hypotonia.
  - target: Sensorineural hearing impairment
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Cochlear involvement is presumed; it has not been studied.
  - target: Postnatal growth retardation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Growth fails after the first months of life.
  - target: Ventriculomegaly
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Brain imaging shows ventricular dilatation.
  - target: Abnormal cerebral white matter morphology
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Brain imaging shows symmetric white matter change.

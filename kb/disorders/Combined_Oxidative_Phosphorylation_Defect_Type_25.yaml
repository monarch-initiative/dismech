  notes: >-
    The relationship is typed UNKNOWN rather than CAUSATIVE, which this schema
    reserves for Definitive or Strong gene-disease validity: ClinGen rates
    MARS2 Definitive (autosomal recessive) for mitochondrial disease
    (MONDO:0044970), a broader concept that also takes in the rearrangement
    disease spastic ataxia 3, so no tier is recorded in gene_disease_validity,
    and this disease rests on two families. Reported genotypes are
    p.Gln184* with p.Arg142Trp, and p.Asp93Asn with p.Arg137Cys. Copy number
    rearrangements of MARS2 cause spastic ataxia 3 (MONDO:0012664), which
    MONDO keeps as a separate disease and which is not a subtype of this
    entry.

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The former variant was detected in her mother, whereas the latter was
      detected in her father, both heterozygous variants.
    explanation: Each parent carries one of the two variants.
  - reference: PMID:25754315
    reference_title: Novel, compound heterozygous, single-nucleotide variants in MARS2 associated with developmental delay, poor growth, and sensorineural hearing loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings suggest that recessive single-nucleotide mutations in
      MARS2 are causative for a new mitochondrial translation deficiency
      disorder with a primary phenotype including developmental delay and
      hypotonia.
    explanation: Recessive inheritance in the first family.

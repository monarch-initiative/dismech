notes: >-
  No GeneReviews chapter covers MARS2. Only two families are reported (PMID:25754315,
  PMID:39995633), so features seen in one family, the pectus carinatum and the
  skeletal dysplasia, may not prove characteristic. An induced pluripotent stem
  cell line from the first family's proband (ISMMSi060-A, PMID:39874649) and
  an isogenic corrected line (PMID:42361764) are available as research
  resources; no phenotype of either has been published.

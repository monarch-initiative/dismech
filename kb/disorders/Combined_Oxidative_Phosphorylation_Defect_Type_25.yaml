diagnosis:
- name: Exome sequencing for biallelic MARS2 variants
  description: >-
    The diagnosis is molecular. Both families were found by exome sequencing;
    in the second a first exome was unrevealing and a repeat exome found the
    variants. Fibroblast respiratory chain studies can be normal.
  evidence:
  - reference: PMID:39995633
    reference_title: A girl with intragenic variants in MARS2 and a chondrodysplasia phenotype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The whole mitochondrial DNA sequence and second whole-exome sequencing
      showed compound heterozygous missense variants
    explanation: A repeat exome made the diagnosis in the second family.

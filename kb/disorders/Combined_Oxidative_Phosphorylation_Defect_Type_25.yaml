name: Combined Oxidative Phosphorylation Defect Type 25
creation_date: "2026-11-27T14:21:19Z"
category: Mendelian
disease_term:
  preferred_term: combined oxidative phosphorylation defect type 25
  term:
    id: MONDO:0014636
    label: combined oxidative phosphorylation defect type 25
synonyms:
- COXPD25
- combined oxidative phosphorylation deficiency type 25
- combined oxidative phosphorylation deficiency 25
- MARS2 combined oxidative phosphorylation deficiency
- combined oxidative phosphorylation deficiency caused by mutation in MARS2
parents:
- Combined Oxidative Phosphorylation Deficiency
- Mitochondrial Disease
description: >-
  Combined oxidative phosphorylation defect type 25 (COXPD25) is an autosomal
  recessive mitochondrial disease caused by biallelic single-nucleotide or
  small variants in MARS2, which encodes the mitochondrial methionyl-tRNA
  synthetase. The enzyme charges the single mitochondrial tRNA-Met, which
  serves both to initiate and to elongate every mitochondrially translated
  polypeptide. In the first family the variants lowered MARS2 protein and
  complex I and IV subunits and activities, and expressing wild-type MARS2 in
  patient fibroblasts restored the subunits.

  Two families are reported. Two brothers had global developmental delay,
  hypotonia, poor growth with growth hormone deficiency, bilateral
  sensorineural hearing loss with a conductive component, pectus carinatum,
  ventricular dilatation and white matter changes. A Japanese girl had failure
  to thrive, psychomotor delay, hyperlactatemia and a skeletal dysplasia with
  platyspondyly and anterior vertebral beaking, and improved on vitamin and
  cofactor supplementation. Complex rearrangements of MARS2 cause a different
  disease, autosomal recessive spastic ataxia with leukoencephalopathy (spastic
  ataxia 3), which MONDO classifies separately and which is not covered here.

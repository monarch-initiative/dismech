      supports: SUPPORT
      evidence_source: OTHER
      snippet: "The toxic carbonyls due to photo-oxidative degradation of accumulated bisretinoids within lysosomes initiate a series of events including protein adduct formation, impaired autophagy flux, complement activation, and chronic inflammation, which is implicated in dry AMD."
      explanation: This states the known intermediate sequence connecting lysosomal oxidative injury to complement activation and chronic inflammation.
  - target: Photoreceptor Degeneration and Outer-Retinal Atrophy
    description: >-
      RPE injury and disrupted cellular homeostasis impair support of the outer
      retina and contribute to photoreceptor degeneration and atrophy.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES

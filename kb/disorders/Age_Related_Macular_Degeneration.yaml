    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In fact, it is well established that drusen are the hallmark of precursor lesion of AMD and a major risk factor for AMD progression mainly based on their size and number."
    explanation: The review supports macular drusen as a hallmark precursor lesion and progression marker.
- name: Macular Geographic Atrophy
  category: Eye
  subtype: Dry AMD
  description: Advanced dry AMD with geographic outer-retinal atrophy in the macula.
  diagnostic: true
  phenotype_term:

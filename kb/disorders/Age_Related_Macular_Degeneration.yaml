    evidence_source: OTHER
    snippet: "The common genetic variants linked to AMD are found on chromosome 1q32 (in the complement factor H gene) and 10q26 (age-related maculopathy susceptibility 2 and high-temperature requirement A serine peptidase 1 genes) loci, along with several other risk variants."

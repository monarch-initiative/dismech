datasets:
- accession: geo:GSE275494
  title: Non-canonical roles of CFH in retinal pigment epithelial cells revealed by dysfunctional rare CFH variants
  description: Complement Factor H (CFH) common genetic variants have been associated with age-related macular degeneration (AMD). While most previous in vitro RPE studies focused on the common p.His402Tyr CFH variant, we characterized rare CFH variants that are highly penetrant for AMD using induced pluripotent stem cell derived retinal pigment epithelium (iPSC-RPE). Our results show that lower FH levels were detected in AMD RPE, which potentially disrupted canonical and non-canonical roles of FH. Specifically, AMD RPE displayed higher inflammation rate and a reduced set of differentially expressed genes compared to control RPE upon A2E and blue light challenge.

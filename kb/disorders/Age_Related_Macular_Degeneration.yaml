    explanation: The review describes the focal macular lesion and its exudative imaging appearance.
  - reference: PMID:39222802
    reference_title: Macular neovascularization.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Neovascularization of the macula, a common complication of many chorioretinal diseases such as
      neovascular age-related macular degeneration, polypoidal choroidal vasculopathy, and
      pathologic myopia, results from increased synthesis of vascular endothelial growth factor
      (VEGF) by the retinal pigment epithelium and/or Müller cells because of localized ischemia and
      inflammation. The Consensus on Neovascular AMD Nomenclature (CONAN) study group acknowledged
      that these vessels may originate from either the choriocapillaris or the retinal
      microvasculature, prompting them to propose the term 'macular neovascularization' (MNV) to
      include intraretinal, subretinal, and sub-pigment epithelial neovascularization localized to
      the macula. MNV frequently appears as a grey-green macular lesion with overlying intraretinal
      thickening and/or subretinal exudation, causing metamorphopsia, reduced central vision,
      relative central scotoma, decreased reading speed, and problems with color recognition.
      Multimodal imaging with optical coherence tomography (OCT), OCT angiography, dye-based
      angiographies, fundus autofluorescence, and multiwavelength photography help establish the
      diagnosis and aid in selecting an appropriate treatment.
    explanation: >-
      Restores the disease context, macular-neovascularization definition and lesion appearance
      before the imaging modalities. The source includes both retinal and choroidal vessel origins
      and does not equate all MNV with choroidal neovascularization.

name: Age-Related Macular Degeneration
creation_date: '2025-12-18T17:01:35Z'
description: >-
  Age-related macular degeneration (AMD) is a multifactorial disease of the
  macula in which age, smoking, and polygenic susceptibility converge on
  retinal pigment epithelial stress, dysregulated complement-mediated
  para-inflammation, outer-retinal extracellular deposits, and photoreceptor
  degeneration. Advanced dry AMD manifests as geographic atrophy, whereas wet
  AMD is driven by macular neovascularization with intraretinal or subretinal
  exudative injury. Both pathways can impair central vision.
category: Complex
parents:
- Ophthalmological Disease
disease_term:
  preferred_term: age-related macular degeneration
  term:
    id: MONDO:0005150
    label: age-related macular degeneration
notes: >-
  Lump/split ruling for the MONDO subtype series filed under this entry. The
  "age related macular degeneration N" series (MONDO:0007932, MONDO:0012145,
  MONDO:0012419, MONDO:0012540, MONDO:0012659, MONDO:0012767, MONDO:0013406,
  MONDO:0013416, MONDO:0013420) consists of locus designations inherited from the
  OMIM phenotype series, not of clinically distinguishable gene-defined forms of
  disease. None is curated as a has_subtypes row here. Each named gene is curated
  instead as a genetic record with an explicit relationship_type, so a
  susceptibility allele is not presented as defining a subtype and a contested
  association is not presented as a susceptibility allele. The two clinical forms
  that AMD does split into, dry and neovascular, remain the has_subtypes rows, now
  anchored to MONDO:0100114 and MONDO:0005417.
  Enumerating the hierarchical children of MONDO:0005150 in OLS on 2026-09-24
  returns fifteen terms, five more than the ten this job was given. Two are the
  dry and neovascular forms just named. The other three are locus designations of
  the same series that carry no causal-gene edge in MONDO, which is why they are
  absent from a gene-keyed gap list: MONDO:0011285 (ARMD1, an HMCN1 variant),
  MONDO:0012674 (ARMD10, synonym "TLR4 age-related macular degeneration") and
  MONDO:0014207 (ARMD14, defined as variation at or near C2 and CFB). HMCN1 and
  TLR4 are curated here as DISPUTED genetic records with the case-control and
  meta-analytic evidence behind that ruling; the C2/CFB locus was already curated
  as a susceptibility record before this pass, so ARMD14 needs no new content.
  MONDO:0014515 "macular dystrophy with central cone involvement" is also filed
  as a child of age-related macular degeneration in MONDO, and is recorded there
  as equivalent to OMIM:616170. Its gene, MFSD8, is an autosomal recessive cause
  of nonsyndromic macular dystrophy (PMID:25227500) and is curated in this
  knowledge base as the gene of neuronal ceroid lipofuscinosis 7
  (kb/disorders/Neuronal_Ceroid_Lipofuscinosis_7.yaml). No subtype row or gene
  record is created for it here, because a recessive Mendelian macular dystrophy
  is a different disease from age-related macular degeneration rather than a form
  of it.
has_subtypes:
- name: Dry AMD
  display_name: Dry AMD (Atrophic)
  subtype_term:
    preferred_term: dry age related macular degeneration
    term:
      id: MONDO:0100114
      label: dry age related macular degeneration
  description: >-
    The non-neovascular form, with gradual outer-retinal degeneration that can
    progress to geographic atrophy.
  evidence:
  - reference: PMID:38928273
    reference_title: Immunogenetic and Environmental Factors in Age-Related Macular Disease.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "This disease can occur in two clinical forms, i.e., dry (progression is slowly and gradually) and exudative (wet, progression is acute and severe), which usually started as dry form."
    explanation: The review distinguishes the gradual dry course from the acute exudative form.
- name: Wet AMD
  display_name: Wet AMD (Neovascular)
  subtype_term:
    preferred_term: wet age related macular degeneration
    term:
      id: MONDO:0005417
      label: wet macular degeneration
  description: >-
    The exudative neovascular form, characterized by macular neovascularization
    with subretinal and/or intraretinal exudation and potentially rapid visual
    decline.
  evidence:
  - reference: PMID:38193957
    reference_title: "Age-Related Macular Degeneration: A Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The late stages of AMD are characterized by outer retinal atrophy, termed geographic atrophy, or neovascularization associated with subretinal and/or intraretinal exudation, termed exudative neovascular AMD."
    explanation: The review defines exudative neovascular AMD by neovascularization and retinal exudation.

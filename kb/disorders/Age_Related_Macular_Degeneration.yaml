    Rare amino-acid-altering variants in FBLN5 (fibulin 5), one of five fibulin
    family genes screened in the reported series, were found in 1.7% of AMD cases
    and in none of the controls. All seven carriers had small circular drusen of
    the basal laminar or cuticular type, so this gene is associated with a
    specific deposit phenotype rather than with AMD in general.
  relationship_type: SUSCEPTIBILITY
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:15269314
    reference_title: Missense variations in the fibulin 5 gene and age-related macular degeneration.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Seven of the 402 patients with AMD had amino acid-altering sequence
      variations in the fibulin 5 gene, whereas none were observed among 429
      control subjects
    explanation: Case-control counts behind the FBLN5 association, in the clinic population from which both groups were drawn.
  - reference: PMID:15269314
    reference_title: Missense variations in the fibulin 5 gene and age-related macular degeneration.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      these seven patients all had small, circular drusen, which are commonly
      referred to as basal laminar or cuticular drusen
    explanation: Ties the FBLN5 genotype to a particular drusen phenotype, which is why this gene is wired to the deposit node.
  case_fractions:
  - population: AMD case series from a single clinic population (402 patients)
    case_fraction_percent: 1.7
    cohort_size: 402
    notes: >-
      Share of an AMD case series carrying an amino-acid-altering FBLN5 variant.
      The cohort is ascertained for AMD by ophthalmoscopy, slit-lamp microscopy
      and fundus photography.
    evidence:
    - reference: PMID:15269314
      reference_title: Missense variations in the fibulin 5 gene and age-related macular degeneration.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Missense mutations in the fibulin 5 gene were found in 1.7 percent of patients with AMD."
      explanation: States the case fraction directly.
- name: CST3
  gene_term:
    preferred_term: CST3
    term:
      id: hgnc:2475
      label: CST3
  association: >-
    The CST3 p.Ala25Thr variant, in the cysteine proteinase inhibitor cystatin C,
    is associated with exudative AMD with a recessive effect. Cystatin C is
    abundantly secreted by the retinal pigment epithelium and has been proposed to
    regulate protein turnover in Bruch's membrane, and the risk variant shows
    reduced secretion from retinal pigment epithelium, which is the mechanistic
    link this entry wires.
  relationship_type: SUSCEPTIBILITY
  variant_origin: GERMLINE
  notes: >-
    This is a candidate-gene association with a replication, not a genome-wide
    significant locus. The combined recessive estimate rests on 350 newly
    genotyped exudative AMD cases plus one previously published association
    study, so the effect size should be read as provisional.
  evidence:
  - reference: PMID:25893795
    reference_title: "A missense variant in CST3 exerts a recessive effect on susceptibility to age-related macular degeneration resembling its association with Alzheimer's disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Bringing together our data with the previously reported AMD-CST3
      association study, the evidence of a recessive effect on AMD risk is
      strengthened (OR = 1.89, P = 0.005).
    explanation: Gives the combined recessive effect estimate for the CST3 variant in AMD.
  - reference: PMID:24458156
    reference_title: "Age-related changes of cystatin C expression and polarized secretion by retinal pigment epithelium: potential age-related macular degeneration links."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      A cystatin C variant associated with increased risk of developing AMD and
      Alzheimer's disease (AD) presents reduced secretion levels from RPE.
    explanation: Supplies the cellular consequence of the risk variant that connects CST3 genotype to retinal pigment epithelium secretory function.
- name: CX3CR1
  gene_term:
    preferred_term: CX3CR1
    term:
      id: hgnc:2558
      label: CX3CR1
  association: >-
    The CX3CR1 V249I and T280M variants have been proposed as AMD risk alleles,
    but two meta-analyses of the same two variants published in 2015 reached
    opposite conclusions, so the association is recorded here as contested rather
    than as susceptibility.
  relationship_type: DISPUTED
  variant_origin: GERMLINE
  notes: >-
    MONDO:0013420 (age related macular degeneration 12) records CX3CR1 as a
    causal gene. This entry does not treat it as one and does not wire it into
    the pathograph, because the two 2015 meta-analyses of V249I and T280M
    disagree with each other.
  evidence:
  - reference: PMID:26305531
    reference_title: Associations Between the T280M and V249I SNPs in CX3CR1 and the Risk of Age-Related Macular Degeneration.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Significant evidence for a relationship between T280M and V249I variants in
      CX3CR1 in the homozygote state with increased susceptibility to AMD was
      reported.
    explanation: A meta-analysis of eight studies reporting a significant homozygote-state association.
  - reference: PMID:26651305
    reference_title: "Association of CX3CR1 (V249I and T280M) polymorphisms with age-related macular degeneration: a meta-analysis."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This meta-analysis suggested that CX3CR1 T280M and V249I polymorphisms may
      not be associated with an increased risk of AMD based on current published
      data.
    explanation: A meta-analysis of six studies of the same two variants finding no association, which is why the relationship is graded DISPUTED.
- name: ABCA4
  gene_term:
    preferred_term: ABCA4
    term:
      id: hgnc:34
      label: ABCA4
  association: >-
    ABCA4 was proposed as an AMD susceptibility gene on the basis of heterozygous
    variants in patients, the association behind the OMIM and MONDO "age related
    macular degeneration 2" designation. A survey that screened the whole gene in
    200 individuals with late-stage AMD and in 220 unaffected individuals with the
    same methodology found no significant excess of candidate variants in cases,
    so this entry records the relationship as contested.
  relationship_type: DISPUTED
  variant_origin: GERMLINE
  notes: >-
    ABCA4's established disease is Stargardt disease, curated separately as
    kb/disorders/Stargardt_Disease.yaml. MONDO:0007932 is filed as a child of
    age-related macular degeneration; this entry declines it as an AMD subtype
    rather than curating a subtype row for it. The negative study states its own
    limit: 18 of the AMD patients and 12 of the controls carried possible
    disease-associated alterations, and the authors add that detecting modest
    effects of rare alleles may require larger cohorts. DISPUTED therefore records
    a failed replication, not a demonstrated absence of effect.
  evidence:
  - reference: PMID:10958763
    reference_title: A comprehensive survey of sequence variation in the ABCA4 (ABCR) gene in Stargardt disease and age-related macular degeneration.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we have assessed the proposed role for ABCA4 in age-related macular
      degeneration (AMD), a common cause of late-onset blindness, by studying 200
      affected individuals with late-stage disease
    explanation: >-
      Records that an ABCA4 role in AMD was a standing proposal, and that this
      study tested it by screening the whole gene in 200 individuals with
      late-stage AMD.
  - reference: PMID:10958763
    reference_title: A comprehensive survey of sequence variation in the ABCA4 (ABCR) gene in Stargardt disease and age-related macular degeneration.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "This represents no significant difference between the two groups"
    explanation: >-
      The comparison of candidate ABCA4 alterations between 200 AMD cases and 220
      controls found no excess in cases, which is the finding that puts the AMD
      association in dispute.
- name: RAX2
  gene_term:
    preferred_term: RAX2
    term:
      id: hgnc:18286
      label: RAX2
  association: >-
    RAX2, originally described as QRX, was linked to macular degeneration by rare
    heterozygous sequence changes in three individuals with retinal degeneration,
    a finding the authors framed as raising a possibility. The gene's established
    disease associations are Mendelian inherited retinal disease: monoallelic
    variants in autosomal dominant cone-dominated retinal disease and biallelic
    variants in autosomal recessive retinitis pigmentosa.
  relationship_type: DISPUTED
  variant_origin: GERMLINE
  notes: >-
    MONDO:0013406 (age related macular degeneration 6) records RAX2 as a causal
    gene. This entry declines it as an AMD subtype and does not wire RAX2 into
    the pathograph: the supporting observation is three individuals with
    unspecified retinal degeneration, and the subsequent RAX2 literature places
    the gene in inherited retinal dystrophy rather than in age-related macular
    degeneration.
  evidence:
  - reference: PMID:15028672
    reference_title: "QRX, a novel homeobox gene, modulates photoreceptor gene expression."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      the finding of rare heterozygous QRX sequence changes in three individuals
      with retinal degeneration raises the possibility that QRX may be involved
      in disease pathogenesis
    explanation: >-
      The whole human genetic basis for a RAX2 retinal-degeneration association,
      stated by its authors as a possibility in three individuals and not
      specific to age-related macular degeneration.
  - reference: PMID:30377383
    reference_title: Biallelic sequence and structural variants in RAX2 are a novel cause for autosomal recessive inherited retinal disease.
    supports: NO_EVIDENCE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      RAX2 encodes a homeobox-containing transcription factor, in which four
      monoallelic pathogenic variants have been described in autosomal dominant
      cone-dominated retinal disease.
    explanation: >-
      Establishes the gene's recognised disease associations as Mendelian
      inherited retinal disease. It does not bear on an age-related macular
      degeneration association either way, which is the point: the AMD claim has
      not been revisited.
- name: HMCN1
  gene_term:
    preferred_term: HMCN1
    term:
      id: hgnc:19194
      label: HMCN1
  association: >-
    The HMCN1 Gln5345Arg variant, reported in one large AMD family, is the basis
    of the OMIM and MONDO "age related macular degeneration 1" designation. Two
    later case-control studies in different populations found the variant in
    almost nobody, and found no difference in the distribution of the
    polymorphism between cases and controls, so this entry records the
    relationship as contested.
  relationship_type: DISPUTED
  variant_origin: GERMLINE
  notes: >-
    MONDO:0011285 (age related macular degeneration 1) is a child of
    age-related macular degeneration and its definition names an HMCN1
    polymorphism at 1q25.3-q31.1, which is the gene's HGNC-recorded location. It
    is not in the reconciliation checklist for this job, because MONDO records no
    causal-gene edge for the term. This entry declines it as an AMD subtype and
    does not wire HMCN1 into the pathograph.
  evidence:
  - reference: PMID:17057786
    reference_title: "Analysis of Hemicentin-1, hOgg1, and E-selectin single nucleotide polymorphisms in age-related macular degeneration."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The distribution of the Hemicentin-1 Q5345R, hOgg1 S326C, and E-selectin
      S149R SNPs did not differ significantly (all P values > .05) between the AMD
      patients and controls.
    explanation: >-
      A case-control comparison in 89 advanced AMD patients against age-matched
      and unscreened controls found no association for the variant MONDO records
      for this term.
  - reference: PMID:16885922
    reference_title: "Analysis of variants in the complement factor H, the elongation of very long chain fatty acids-like 4 and the hemicentin 1 genes of age-related macular degeneration in the Finnish population."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      None of our subjects (258 AMD cases, 72 non-AMD controls) had the Gln5345Arg
      variant in the HMCN1 gene.
    explanation: >-
      An independent population found the variant in none of 258 AMD cases, in the
      same study that replicated the CFH association strongly, so the negative
      result is not explained by an insensitive assay.
- name: TLR4
  gene_term:
    preferred_term: TLR4
    term:
      id: hgnc:11850
      label: TLR4
  association: >-
    TLR4 rs4986790 (Asp299Gly) and rs4986791 (Thr399Ile) have been tested
    repeatedly against AMD risk, and are the genes behind the OMIM and MONDO
    "age related macular degeneration 10" designation. Two meta-analyses of
    overlapping study sets disagree: one reports rs4986790 as associated under
    recessive and overdominant models, the other finds that no TLR4 association
    survives correction for multiple testing.
  relationship_type: DISPUTED
  variant_origin: GERMLINE
  notes: >-
    MONDO:0012674 (age related macular degeneration 10) is a child of
    age-related macular degeneration and carries "TLR4 age-related macular
    degeneration" as an exact synonym generated by MONDO's
    disease_series_by_gene design pattern; it records no causal-gene edge, so it
    is not in the reconciliation checklist for this job. This entry declines it
    as an AMD subtype and does not wire TLR4 into the pathograph.
  evidence:
  - reference: PMID:32102594
    reference_title: "Toll-like receptor 4 gene polymorphisms rs4986790 and rs4986791 and age-related macular degeneration susceptibility: a meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The recessive and overdominant models showed that rs4986790 was
      significantly associated with AMD susceptibility, with odds ratios (ORs) of
      0.73 and 1.41, respectively.
    explanation: >-
      The positive side of the disagreement: a meta-analysis of six studies
      reporting an rs4986790 association under two of its four genetic models.
  - reference: PMID:34287094
    reference_title: "Associations of TLR4 and IL-8 genes polymorphisms with age-related macular degeneration (AMD): a systematic review and meta-analysis."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we found associations under the genotypic model of TLR4 c.896A>G ... although
      after Bonferroni correction (P'-value<0.02) none of these associations
      remained significant.
    explanation: >-
      The negative side: a larger meta-analysis of the same two variants finds
      that the nominal TLR4 associations, including the one for rs4986790
      (c.896A>G), do not survive multiple-testing correction.
inheritance:
- name: Polygenic inheritance
  inheritance_term:
    preferred_term: Polygenic inheritance
    term:
      id: HP:0010982
      label: Polygenic inheritance
  description: >-
    AMD risk is distributed across many loci rather than transmitted as a single
    Mendelian locus. A genome-wide association study of 16,144 patients and
    17,832 controls identified 52 independently associated common and rare
    variants across 34 loci, and found that the dry and neovascular forms share
    most of their genetics. Very rare coding variants at a few of those loci are
    read by that study as identifying the causal gene, so the architecture is
    polygenic with a rare-variant component rather than common-variant
    polygenicity alone.
  evidence:
  - reference: PMID:26691988
    reference_title: A large genome-wide association study of age-related macular degeneration highlights contributions of rare and common variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Analyzing 16,144 patients and 17,832 controls, we identify 52 independently
      associated common and rare variants ... distributed across 34 loci.
    explanation: >-
      Establishes the cohort size, the variant count and the locus count quoted in
      the description, and so that AMD susceptibility is carried by many
      independent variants rather than one locus. The elision skips the
      genome-wide significance threshold, which is typeset with a multiplication
      sign and a superscript.
  - reference: PMID:26691988
    reference_title: A large genome-wide association study of age-related macular degeneration highlights contributions of rare and common variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although wet and dry AMD subtypes exhibit predominantly shared genetics"
    explanation: Supports treating the polygenic architecture as shared across the two clinical forms rather than stratifying inheritance by subtype.
  - reference: PMID:26691988
    reference_title: A large genome-wide association study of age-related macular degeneration highlights contributions of rare and common variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Very rare coding variants (frequency <0.1%) in CFH, CFI and TIMP3 suggest
      causal roles for these genes, as does a splice variant in SLC16A8.
    explanation: Supports the rare-variant component of the architecture alongside the common-variant background.
environmental:
- name: Older Age
  presence: Risk factor
  description: AMD incidence rises steeply across older age strata.
  evidence:
  - reference: PMID:38193957
    reference_title: "Age-Related Macular Degeneration: A Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Older age, genetic factors, and environmental factors, such as cigarette smoking, are associated with development of AMD."
    explanation: The review identifies older age as an AMD-associated factor.
- name: Cigarette Smoking
  influences_mechanisms:
  - target: RPE Oxidative and Lysosomal Stress
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Pointed at retinal pigment epithelium oxidative and lysosomal stress
      because that is where this entry places the earliest acquired injury,
      and oxidative stress is the route by which smoking is understood to
      reach it. The intermediates are recorded as known on that mapped route
      rather than on the quoted sentence, which reaches only the disease.
      Predisposing rather than triggering because the item is an incidence
      comparison between smokers and never-smokers, which is a statement about
      risk.
    evidence:
    - reference: PMID:38193957
      reference_title: "Age-Related Macular Degeneration: A Review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Long-term prospective cohort studies show a significantly higher AMD incidence in people who smoke more than 20 cigarettes per day compared with people who never smoked."
      explanation: >-
        Long-term prospective cohorts showing significantly higher disease
        incidence in people smoking more than twenty cigarettes a day than in
        never-smokers. A dose-related incidence difference for the disease,
        which does not reach the retinal pigment epithelium at this node.
  presence: Risk factor
  description: Long-term cigarette smoking is associated with higher AMD incidence.
  exposure_term:
    preferred_term: exposure to cigarette smoking
    term:
      id: ECTO:0100003
      label: exposure to cigarette smoking
  evidence:
  - reference: PMID:38193957
    reference_title: "Age-Related Macular Degeneration: A Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Long-term prospective cohort studies show a significantly higher AMD incidence in people who smoke more than 20 cigarettes per day compared with people who never smoked."
    explanation: Prospective cohort evidence summarized in the review supports cigarette smoking as an environmental risk factor.

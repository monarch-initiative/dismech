- accession: massive:MSV000088713
  title: Retinal pigment epithelium extracellular vesicles are potent inducers of age-related macular degeneration disease phenotype in the outer retina
  description: Age-related macular degeneration (AMD) is a leading cause of blindness. Vision loss is caused by the loss of the retinal pigment epithelium (RPE) and photoreceptors and/or retinal and choroidal angiogenesis. Here we use AMD patient specific RPE cells with the Y402H high-risk polymorphism in the complement factor H to perform a comprehensive analysis of EVs, their cargo and role in disease pathology. We show that AMD RPE is characterised by enhanced and polarised EV secretion.

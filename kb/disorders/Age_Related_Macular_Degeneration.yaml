- accession: dbgap:phs001361
  title: Genetics of Age-Related Macular Degeneration in the Amish
  description:  Identifying genetic risk loci for Age-Related Macular Degeneration is important. Most of the loci identified to date have been found through the interrogation of common variants. This study initiates the identification of rare variants in a founder population, the Amish, and will use genotyping of known risk loci and ultimately use the whole exome chip to assess the association of Age-related Macular Degeneration with coding variants.

- name: Bruch Membrane Protein Homeostasis Gene Variation
  description: >-
    Variation in three genes whose products act on extracellular protein
    homeostasis at Bruch's membrane contributes to AMD susceptibility. Rare
    missense variants in FBLN5, a member of the fibulin gene family, were found
    only in AMD cases in a screen of five fibulin genes, and every carrier had
    cuticular drusen. CST3 encodes cystatin C, a cysteine proteinase inhibitor
    abundantly secreted by the retinal pigment epithelium and proposed to regulate
    protein turnover in Bruch's membrane; its AMD risk variant is secreted at
    reduced levels. TIMP3 is constitutively expressed by retinal pigment
    epithelium, resides in Bruch's membrane in healthy eyes where it regulates the
    membrane's thickness by inhibiting matrix metalloproteinases, and is
    implicated in AMD by rare coding variants. The node groups the three by the
    compartment they act in, and does not claim that they converge on one
    molecular step.
  biological_scale: MOLECULAR
  locations:
  - preferred_term: Bruch's membrane
    term:
      id: UBERON:0003957
      label: Bruch's membrane
  genes:
  - preferred_term: FBLN5
    term:
      id: hgnc:3602
      label: FBLN5
  - preferred_term: CST3
    term:
      id: hgnc:2475
      label: CST3
  - preferred_term: TIMP3
    term:
      id: hgnc:11822
      label: TIMP3
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:15269314
    reference_title: Missense variations in the fibulin 5 gene and age-related macular degeneration.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Seven of the 402 patients with AMD had amino acid-altering sequence
      variations in the fibulin 5 gene, whereas none were observed among 429
      control subjects
    explanation: Case-control evidence that rare FBLN5 coding variation contributes to AMD.
  - reference: PMID:24458156
    reference_title: "Age-related changes of cystatin C expression and polarized secretion by retinal pigment epithelium: potential age-related macular degeneration links."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Cystatin C, a potent cysteine proteinase inhibitor, is abundantly secreted
      by the RPE and may contribute to regulating protein turnover in the Bruch's
      membrane (BrM).
    explanation: Places cystatin C, the CST3 product, in Bruch's membrane protein turnover, which is the compartment this node names.
  - reference: PMID:24458156
    reference_title: "Age-related changes of cystatin C expression and polarized secretion by retinal pigment epithelium: potential age-related macular degeneration links."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      A cystatin C variant associated with increased risk of developing AMD and
      Alzheimer's disease (AD) presents reduced secretion levels from RPE.
    explanation: Gives the cellular consequence of the CST3 risk variant that links genotype to this compartment.
  - reference: PMID:26691988
    reference_title: A large genome-wide association study of age-related macular degeneration highlights contributions of rare and common variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Very rare coding variants (frequency <0.1%) in CFH, CFI and TIMP3 suggest
      causal roles for these genes, as does a splice variant in SLC16A8.
    explanation: Supports TIMP3 as a causal AMD gene implicated by rare coding variants.
  - reference: PMID:28847738
    reference_title: Sorsby fundus dystrophy - A review of pathology and disease mechanisms.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "TIMP3 is constitutively expressed by RPE cells and, in healthy eyes, resides in Bruch's membrane."
    explanation: >-
      Places TIMP3 in Bruch's membrane, which is what justifies binding it to this
      node rather than to a generic susceptibility node.
  - reference: PMID:15269314
    reference_title: Missense variations in the fibulin 5 gene and age-related macular degeneration.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DNA samples were screened for sequence variations in five members of the fibulin gene family."
    explanation: Supports describing FBLN5 as one of five fibulin family genes screened in that series.
  downstream:
  - target: Outer-Retinal Extracellular Deposit Accumulation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Variation in these genes is placed upstream of extracellular deposit
      accumulation because the FBLN5 carriers are defined clinically by cuticular
      drusen and the CST3 risk variant reduces secretion of a protease inhibitor
      into the same compartment. The steps between genotype and deposit
      composition are not resolved.
    intermediate_mechanisms:
    - altered extracellular protein turnover at Bruch's membrane
    evidence:
    - reference: PMID:15269314
      reference_title: Missense variations in the fibulin 5 gene and age-related macular degeneration.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        these seven patients all had small, circular drusen, which are commonly
        referred to as basal laminar or cuticular drusen
      explanation: Every FBLN5 carrier in the series had a defined drusen phenotype, which is the deposit outcome this edge asserts.

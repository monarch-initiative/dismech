  notes: Located via OmicsDI, which aggregates across omics repositories; this record comes from metabolomics_workbench. Only repositories with no other discovery route in this project and with a working accession resolver are curated from OmicsDI -- GEO, ArrayExpress, PRIDE, MetaboLights and EGA hits are excluded as duplicates of dedicated passes. Matched because the disease is named in the dataset's own title ("Age-Related Macular Degeneration"). Retrieved 2026-08-02.
- accession: massive:MSV000088713
  title: Retinal pigment epithelium extracellular vesicles are potent inducers of age-related macular degeneration disease phenotype in the outer retina
  description: Age-related macular degeneration (AMD) is a leading cause of blindness. Vision loss is caused by the loss of the retinal pigment epithelium (RPE) and photoreceptors and/or retinal and choroidal angiogenesis. Here we use AMD patient specific RPE cells with the Y402H high-risk polymorphism in the complement factor H to perform a comprehensive analysis of EVs, their cargo and role in disease pathology. We show that AMD RPE is characterised by enhanced and polarised EV secretion.
  notes: Located via OmicsDI, which aggregates across omics repositories; this record comes from massive. Only repositories with no other discovery route in this project and with a working accession resolver are curated from OmicsDI -- GEO, ArrayExpress, PRIDE, MetaboLights and EGA hits are excluded as duplicates of dedicated passes. Matched because the disease is named in the dataset's own title ("Age-Related Macular Degeneration"). Retrieved 2026-08-02.
- accession: dbgap:phs001361
  title: Genetics of Age-Related Macular Degeneration in the Amish
  description:  Identifying genetic risk loci for Age-Related Macular Degeneration is important. Most of the loci identified to date have been found through the interrogation of common variants. This study initiates the identification of rare variants in a founder population, the Amish, and will use genotyping of known risk loci and ultimately use the whole exome chip to assess the association of Age-related Macular Degeneration with coding variants.
  notes: Located via OmicsDI, which aggregates across omics repositories; this record comes from dbgap. Only repositories with no other discovery route in this project and with a working accession resolver are curated from OmicsDI -- GEO, ArrayExpress, PRIDE, MetaboLights and EGA hits are excluded as duplicates of dedicated passes. Matched because the disease is named in the dataset's own title ("Age-Related Macular Degeneration"). Retrieved 2026-08-02.

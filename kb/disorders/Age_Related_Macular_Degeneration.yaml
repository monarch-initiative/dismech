pathophysiology:
- name: Complement-Pathway Genetic Susceptibility
  description: >-
    Common variation at CFH and in other complement-pathway genes, including C3
    and CFB, alters susceptibility to AMD. CFB is not modeled as uniformly
    risk-increasing because human haplotype studies identify both risk and
    protective complement-region haplotypes. Very rare coding variants in CFH and
    in CFI, the complement factor I gene, carry the additional weight of
    identifying the causal gene within its locus rather than only tagging it.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: CFH
    term:
      id: hgnc:4883
      label: CFH
  - preferred_term: C3
    term:
      id: hgnc:1318
      label: C3
  - preferred_term: CFB
    term:
      id: hgnc:1037
      label: CFB
  - preferred_term: CFI
    term:
      id: hgnc:5394
      label: CFI
  biological_processes:
  - preferred_term: complement activation
    term:
      id: GO:0006956
      label: complement activation
  evidence:
  - reference: DOI:10.3390/biomedicines12071479
    reference_title: Genetic Insights into Age-Related Macular Degeneration
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The common genetic variants linked to AMD are found on chromosome 1q32 (in the complement factor H gene) and 10q26 (age-related maculopathy susceptibility 2 and high-temperature requirement A serine peptidase 1 genes) loci, along with several other risk variants."
    explanation: The review supports CFH as a major common AMD susceptibility locus.
  - reference: PMID:17634448
    reference_title: Complement C3 variant and the risk of age-related macular degeneration.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The common functional polymorphism rs2230199 (Arg80Gly) in the C3 gene, corresponding to the electrophoretic variants C3S (slow) and C3F (fast), was strongly associated with age-related macular degeneration in both the English group (603 cases and 350 controls, P=5.9x10(-5)) and the Scottish group (244 cases and 351 controls, P=5.0x10(-5))."
    explanation: Replicated case-control association supports C3 as a human AMD susceptibility gene.
  - reference: PMID:16518403
    reference_title: Variation in factor B (BF) and complement component 2 (C2) genes is associated with age-related macular degeneration.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Haplotype analyses identify a statistically significant common risk haplotype (H1) and two protective haplotypes."
    explanation: Human haplotype data support a mixed risk/protective association at the CFB/C2 region.
  - reference: PMID:26691988
    reference_title: A large genome-wide association study of age-related macular degeneration highlights contributions of rare and common variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Very rare coding variants (frequency <0.1%) in CFH, CFI and TIMP3 suggest
      causal roles for these genes, as does a splice variant in SLC16A8.
    explanation: >-
      Supports CFI as a complement-pathway gene with a causal role in AMD, and
      supports CFH itself at the rare-variant level rather than only as a tagged
      common locus.
  downstream:
  - target: Complement-Mediated Para-inflammation
    description: >-
      Complement-pathway susceptibility is placed upstream of dysregulated local
      complement activity, but the intervening genotype-to-tissue mechanisms are
      incompletely resolved.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - altered regulation of alternative complement activity
    evidence:
    - reference: PMID:38690727
      reference_title: "Complement regulation in the eye: implications for age-related macular degeneration."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Dysregulated complement activation contributes to parainflammation, a low level of inflammation triggered by cellular damage that functions to reestablish homeostasis, or outright inflammation that disrupts the visual axis."
      explanation: The review supports complement dysregulation as an upstream contributor to ocular para-inflammation, while not resolving variant-specific intermediates.
- name: 10q26 ARMS2/HTRA1 Genetic Susceptibility
  description: >-
    Common variants at the chromosome 10q26 ARMS2/HTRA1 locus confer AMD
    susceptibility. The association is modeled at both candidate genes without
    selecting one causal gene or assigning an unsupported downstream molecular
    mechanism.
  biological_scale: MOLECULAR

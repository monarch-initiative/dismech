- name: C3
  gene_term:
    preferred_term: C3
    term:
      id: hgnc:1318
      label: C3
  association: Common complement-pathway susceptibility variant
  relationship_type: SUSCEPTIBILITY
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:17634448
    reference_title: Complement C3 variant and the risk of age-related macular degeneration.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The common functional polymorphism rs2230199 (Arg80Gly) in the C3 gene, corresponding to the electrophoretic variants C3S (slow) and C3F (fast), was strongly associated with age-related macular degeneration in both the English group (603 cases and 350 controls, P=5.9x10(-5)) and the Scottish group (244 cases and 351 controls, P=5.0x10(-5))."
    explanation: Replication in two human case-control cohorts supports C3 susceptibility.
- name: CFB
  gene_term:
    preferred_term: CFB
    term:
      id: hgnc:1037
      label: CFB
  association: Complement-region susceptibility with both risk and protective haplotypes
  relationship_type: SUSCEPTIBILITY
  variant_origin: GERMLINE
  notes: >-
    The CFB/C2 region contains a common risk haplotype as well as protective
    haplotypes; CFB is therefore not represented as uniformly risk-increasing.
  evidence:
  - reference: PMID:16518403
    reference_title: Variation in factor B (BF) and complement component 2 (C2) genes is associated with age-related macular degeneration.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Haplotype analyses identify a statistically significant common risk haplotype (H1) and two protective haplotypes."
    explanation: Human haplotype analysis supports a mixed risk/protective association at the CFB/C2 locus.
  - reference: PMID:16518403
    reference_title: Variation in factor B (BF) and complement component 2 (C2) genes is associated with age-related macular degeneration.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The L9H variant of BF and the E318D variant of C2 (H10), as well as a variant in intron 10 of C2 and the R32Q variant of BF (H7), confer a significantly reduced risk of AMD (odds ratio = 0.45 and 0.36, respectively)."
    explanation: The protective BF/CFB haplotypes prevent oversimplifying the locus as risk-only.
environmental:
- name: Older Age
  presence: Risk factor
  description: AMD incidence rises steeply across older age strata.
  evidence:
  - reference: PMID:38193957
    reference_title: "Age-Related Macular Degeneration: A Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Older age, genetic factors, and environmental factors, such as cigarette smoking, are associated with development of AMD."
    explanation: The review identifies older age as an AMD-associated factor.
- name: Cigarette Smoking
  influences_mechanisms:
  - target: RPE Oxidative and Lysosomal Stress
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Pointed at retinal pigment epithelium oxidative and lysosomal stress
      because that is where this entry places the earliest acquired injury,
      and oxidative stress is the route by which smoking is understood to
      reach it. The intermediates are recorded as known on that mapped route
      rather than on the quoted sentence, which reaches only the disease.
      Predisposing rather than triggering because the item is an incidence
      comparison between smokers and never-smokers, which is a statement about
      risk.
    evidence:
    - reference: PMID:38193957
      reference_title: "Age-Related Macular Degeneration: A Review."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Long-term prospective cohort studies show a significantly higher AMD incidence in people who smoke more than 20 cigarettes per day compared with people who never smoked."
      explanation: >-
        Long-term prospective cohorts showing significantly higher disease
        incidence in people smoking more than twenty cigarettes a day than in
        never-smokers. A dose-related incidence difference for the disease,
        which does not reach the retinal pigment epithelium at this node.
  presence: Risk factor
  description: Long-term cigarette smoking is associated with higher AMD incidence.
  exposure_term:
    preferred_term: exposure to cigarette smoking
    term:
      id: ECTO:0100003
      label: exposure to cigarette smoking
  evidence:
  - reference: PMID:38193957
    reference_title: "Age-Related Macular Degeneration: A Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Long-term prospective cohort studies show a significantly higher AMD incidence in people who smoke more than 20 cigarettes per day compared with people who never smoked."
    explanation: Prospective cohort evidence summarized in the review supports cigarette smoking as an environmental risk factor.
treatments:
- name: Intravitreal Anti-VEGF Therapy
  action_category: THERAPEUTIC
  description: >-
    Intravitreal VEGF inhibition is first-line therapy for exudative neovascular
    AMD and preserves visual acuity relative to sham treatment.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: Angiogenesis inhibitor
      term:

- name: RPE Oxidative and Lysosomal Stress
  description: >-
    Age-related photo-oxidative products and reactive oxygen species stress
    retinal pigment epithelial cells. Protein-adduct formation and impaired
    autophagic flux compromise lysosomal clearance and cellular homeostasis.
  biological_scale: CELLULAR
  subtypes:
  - Dry AMD
  cell_types:
  - preferred_term: retinal pigment epithelial cell
    term:
      id: CL:0002586
      label: retinal pigment epithelial cell
  biological_processes:
  - preferred_term: response to oxidative stress
    term:
      id: GO:0006979
      label: response to oxidative stress
    modifier: INCREASED
  - preferred_term: autophagy
    term:
      id: GO:0006914
      label: autophagy
    modifier: DECREASED
  evidence:
  - reference: DOI:10.3390/antiox13050568
    reference_title: Antioxidants and Mechanistic Insights for Managing Dry Age-Related Macular Degeneration
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The toxic carbonyls due to photo-oxidative degradation of accumulated bisretinoids within lysosomes initiate a series of events including protein adduct formation, impaired autophagy flux, complement activation, and chronic inflammation, which is implicated in dry AMD."
    explanation: The review links lysosomal bisretinoid photo-oxidation to adducts, impaired autophagy, complement activation, and inflammation in dry AMD.
  - reference: DOI:10.3390/ijms26083463
    reference_title: "Role of Oxidative Stress and Inflammation in Age Related Macular Degeneration: Insights into the Retinal Pigment Epithelium (RPE)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "A key contributor to disease progression is the excessive accumulation of reactive oxygen species (ROS), which damage retinal pigment epithelium (RPE) cells and disrupt cellular homeostasis."
    explanation: The review directly supports ROS-mediated RPE damage and loss of homeostasis.
  downstream:
  - target: Complement-Mediated Para-inflammation
    description: >-
      Photo-oxidative lysosomal injury can activate complement and chronic
      inflammatory responses through protein-adduct formation and impaired
      autophagic clearance.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - photo-oxidative degradation of accumulated bisretinoids
    - protein-adduct formation
    - impaired autophagic flux
    evidence:

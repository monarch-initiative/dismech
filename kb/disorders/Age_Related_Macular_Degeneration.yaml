    term:
      id: HP:0011506
      label: Choroidal neovascularization
  target_mechanisms:
  - target: VEGF-Driven Macular Neovascularization
    treatment_effect: INHIBITS
    description: Anti-VEGF agents inhibit the VEGF-dependent neovascular pathway.
    evidence:
    - reference: PMID:39222802
      reference_title: Macular neovascularization.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The standard of care for MNV is usually intravitreal anti-vascular endothelial growth factor injections, though thermal laser photocoagulation, verteporfin photodynamic therapy, and vitreoretinal surgery are occasionally used."
      explanation: The review identifies intravitreal anti-VEGF therapy as standard care for MNV.
  evidence:
  - reference: PMID:38193957
    reference_title: "Age-Related Macular Degeneration: A Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Intravitreally administered anti-VEGF treatment is first-line therapy for exudative neovascular AMD."
    explanation: The review identifies intravitreal anti-VEGF as first-line wet-AMD therapy.
  - reference: PMID:38193957
    reference_title: "Age-Related Macular Degeneration: A Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In exudative neovascular AMD, 94.6% of patients receiving monthly intravitreal anti-vascular endothelial growth factor (anti-VEGF) injections experience less than a 15-letter visual acuity loss after 12 months compared with 62.2% receiving sham treatment."
    explanation: The review reports controlled comparative evidence for preservation of visual acuity.
- name: AREDS/AREDS2 Nutritional Supplementation
  action_category: THERAPEUTIC
  description: >-
    High-dose antioxidant vitamins, carotenoids, and zinc reduce progression to
    late-stage AMD in appropriately selected patients; this is not modeled as a
    direct correction of one molecular node.
  treatment_term:
    preferred_term: nutritional supplementation
    term:
      id: NCIT:C15433
      label: Nutritional Support
  evidence:
  - reference: PMID:38193957
    reference_title: "Age-Related Macular Degeneration: A Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Individuals with AMD who take nutritional supplements consisting of high-dose vitamin C, vitamin E, carotenoids, and zinc have a 20% probability to progress to late-stage AMD at 5 years vs a 28% probability for those taking a placebo."
    explanation: The review reports lower five-year progression with AREDS-type supplementation than placebo.
- name: Complement-Inhibitor Therapy for Geographic Atrophy
  action_category: THERAPEUTIC
  description: >-
    Intravitreal complement inhibitors reduce geographic-atrophy lesion growth,
    but the cited network meta-analysis found no significant BCVA benefit and
    identified an increased macular-neovascularization risk with monthly
    pegcetacoplan.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: Complement inhibitor
      term:
        id: NCIT:C199456
        label: Complement Inhibitor
  target_phenotypes:
  - preferred_term: Macular Geographic Atrophy
    term:
      id: HP:0031609
      label: Macular geographic atrophy
  target_mechanisms:
  - target: Complement-Mediated Para-inflammation
    treatment_effect: INHIBITS
    description: Complement inhibitors pharmacologically suppress the complement arm implicated in atrophic AMD.
    evidence:
    - reference: DOI:10.3389/fphar.2024.1410172
      reference_title: "Efficacy and safety of complement inhibitors in patients with geographic atrophy associated with age-related macular degeneration: a network meta-analysis of randomized controlled trials"
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Clinical trials in recent years have shown significant effectiveness of complement inhibitors for geographic atrophy (GA) treatment."
      explanation: The clinical-trial synthesis supports pharmacologic inhibition of the complement arm as a treatment strategy for GA.
  evidence:
  - reference: DOI:10.3389/fphar.2024.1410172
    reference_title: "Efficacy and safety of complement inhibitors in patients with geographic atrophy associated with age-related macular degeneration: a network meta-analysis of randomized controlled trials"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Comparison with sham and SUCRA analysis showed that avacincaptad pegol 2 mg (MD: −0.58, 95% CrI: −0.97 to −0.18, SUCRA: 93.55), pegcetacoplan monthly (MD: −0.38, 95% CrI: −0.57 to −0.20, SUCRA: 81.37), and pegcetacoplan every other month (MD: −0.30, 95% CrI: −0.49 to −0.11, SUCRA: 70.16) have significant changes in GA lesion reduction."
    explanation: The network meta-analysis directly reports reduced geographic-atrophy lesion growth relative to sham.
  - reference: DOI:10.3389/fphar.2024.1410172
    reference_title: "Efficacy and safety of complement inhibitors in patients with geographic atrophy associated with age-related macular degeneration: a network meta-analysis of randomized controlled trials"
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "No treatments showed significant changes in BCVA and SAE compared with sham. Pegcetacoplan monthly (OR: 4.30, 95% CrI: 1.48–16.72) increased the risk of MNV."
    explanation: The meta-analysis limits the benefit claim to anatomy and records the absence of BCVA improvement and an MNV safety signal.

  description: >-
    Standard antipsoriatic treatment does not work in MSMO1 deficiency. In the
    index patient topical corticosteroids, calcipotriene, cyclosporine A,
    etanercept, phototherapy and oral isotretinoin were all tried without
    durable response. Anti-TNF therapy is mechanistically inappropriate because
    serum TNF-alpha is normal in this disorder. Recorded here as negative
    evidence so that the entry documents what NOT to do.

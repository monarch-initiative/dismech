name: MSMO1 Deficiency
creation_date: '2026-08-01T00:00:00Z'
category: Mendelian
synonyms:
- MCCPD
- microcephaly, congenital cataract, and psoriasiform dermatitis
- SC4MOL deficiency
- sterol-C4-methyl oxidase deficiency
- SMO deficiency
description: >-
  MSMO1 deficiency is an ultrarare autosomal recessive post-squalene disorder of
  cholesterol biosynthesis caused by biallelic missense variants in MSMO1 (older
  literature: SC4MOL), which encodes methylsterol monooxygenase 1. The enzyme
  performs the first oxidative step of C4 demethylation, converting
  C4-methylsterols to cholesterol precursors. Loss of activity produces a dual
  biochemical lesion: accumulation of 4-monomethyl and 4,4-dimethylsterols
  (the meiosis-activating sterols) upstream of the block, and impaired distal
  cholesterol synthesis downstream of it. The clinical picture reported across
  the small published cohort combines microcephaly, congenital cataracts,
  growth and developmental delay, intellectual disability, immune dysfunction
  and a treatment-refractory psoriasiform dermatitis. Combined cholesterol
  supplementation plus statin therapy, given orally and topically, has improved
  the biochemical, immunological and cutaneous findings in reported patients.

treatments:
- name: Systemic cholesterol supplementation with statin therapy
  description: >-
    Oral cholesterol supplementation replaces the deficient end product while an
    oral statin reduces flux into the blocked pathway and thereby the toxic
    methylsterol load. Reported regimens have combined systemic cholesterol,
    statin and bile acid. This combination is documented specifically in
    MSMO1-genotyped patients, not extrapolated from the other post-squalene
    disorders.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: cholesterol
      term:
        id: CHEBI:16113
        label: cholesterol
    - preferred_term: simvastatin
      term:
        id: CHEBI:9150
        label: simvastatin
  target_mechanisms:
  - target: C4-Methylsterol Accumulation
    treatment_effect: INHIBITS
    description: Statin therapy reduces flux into the pathway and lowers the toxic methylsterol pool.
    evidence:
    - reference: PMID:41413001
      reference_title: P10 Treatment-refractory psoriasiform dermatitis resulting from a rare genetic alteration in MSMO1 with marked improvement with combined cholesterol and statin use.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Topical (2% simvastatin/2% cholesterol cream) and oral statin was commenced to reduce the toxic accumulation of methylsterols, along with cholesterol replacement to replace the downstream deficiency."
      explanation: States the mechanistic rationale of the statin arm in a genotyped MSMO1 patient.
  - target: Impaired Distal Cholesterol Biosynthesis
    treatment_effect: BYPASSES
    description: Exogenous cholesterol supplies the end product that the blocked pathway cannot make.
    evidence:
    - reference: PMID:41413001
      reference_title: P10 Treatment-refractory psoriasiform dermatitis resulting from a rare genetic alteration in MSMO1 with marked improvement with combined cholesterol and statin use.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Topical (2% simvastatin/2% cholesterol cream) and oral statin was commenced to reduce the toxic accumulation of methylsterols, along with cholesterol replacement to replace the downstream deficiency."
      explanation: States the mechanistic rationale of the cholesterol-replacement arm.
  evidence:
  - reference: PMID:37195326
    reference_title: "MSMO1 deficiency: a potentially partially treatable, ultrarare neurodevelopmental disorder with psoriasiform dermatitis, alopecia and polydactyly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Treatment with oral and topical cholesterol supplements and statins was reported to improve the biochemical, immunological, and cutaneous findings, supporting a potential treatment following the precision diagnosis of MSMO1 deficiency."
    explanation: The disease-specific review summarises improvement of biochemical, immunological and cutaneous findings in MSMO1 patients.
  - reference: PMID:37195326

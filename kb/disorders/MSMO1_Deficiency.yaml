notes: >-
  Scope and provenance notes for this entry.


  (1) No GeneReviews chapter exists for MSMO1 deficiency. PubMed searches for
  "MSMO1 GeneReviews[All Fields]", "microcephaly congenital cataract
  psoriasiform dermatitis AND GeneReviews[All Fields]" and a sterol-wide
  GeneReviews title search all returned zero records on 2026-08-01, so the
  mandatory GeneReviews phenotype baseline does not apply here. The phenotype
  baseline used instead is the union of the published case reports and the two
  disease-specific reviews (PMID:24144731, PMID:37195326).


  (2) Named-entity-confusion discipline. MSMO1 deficiency sits inside the
  post-squalene cholesterol-biosynthesis family (DHCR7/Smith-Lemli-Opitz,
  NSDHL/CHILD and CK syndrome, DHCR24/desmosterolosis, SC5D/lathosterolosis),
  whose papers share near-identical sterol-pathway and statin-plus-cholesterol
  language. Every citation in this entry was checked for the enzyme the reported
  cohort actually has variants in. Family-wide reviews are cited only for
  sentences that name SC4MOL/MSMO1 explicitly (PMID:23042573, PMID:21695019),
  and the one cited SC4MOL mechanism paper that co-implicates NSDHL
  (PMID:23125191, cancer-cell siRNA study) is recorded as PARTIAL because it is
  neither MSMO1-patient material nor SC4MOL-specific in its NSDHL arm. The three
  treatment citations (PMID:33161406, PMID:37195326, PMID:41413001) are all
  MSMO1-genotyped patients, so the cholesterol-plus-statin evidence here is
  attributed to MSMO1 disease and not borrowed from CHILD syndrome, where the
  same topical formulation is better known.


  (3) Phenotype frequency bands are deliberately omitted throughout. Fewer than
  ten patients have been reported in total (PMID:37195326 counts five cases as
  of 2023) and the reviews disagree on denominators, so no published
  denominator supports an HPO frequency band. Recording the observation without
  a band is preferred to guessing one.


  (4) Hypocholesterolemia is curated as a variable, non-obligate finding, not
  as the diagnostic signature. Unlike Smith-Lemli-Opitz syndrome, low
  cholesterol is inconsistent across MSMO1 patients: the index patient had a
  persistently low total cholesterol (PMID:21285510), but the deep-research
  review of the full published series records normal total cholesterol in
  several later patients. Methylsterol elevation, not hypocholesterolemia, is
  the obligate biochemical signature, so normal cholesterol must not be treated
  as excluding the diagnosis. The evidence item for hypocholesterolemia is
  marked PARTIAL for that reason.


  (5) Published case tallies conflict and none is repeated here as fact.
  PMID:24144731 (2014) reported four patients from three families;
  PMID:33161406 (2020) said five patients from four unrelated families;
  PMID:37195326 (2023) said five cases and then added two siblings. Summing the
  primary reports cited here gives a larger total. The prevalence record
  therefore uses the qualitative ULTRA_RARE tier with the individual
  denominators recorded in its notes rather than asserting a single count.


  (6) No Orphanet (ORPHA:488168) or ClinGen (CGGV/CGDS) structured-source
  record could be cited. Neither identifier is present in references_cache and
  generating one would require a data MANIFEST bump, which is blocked by the
  stale, un-refreshable pins tracked in #7622. The structured-source citation
  is skipped rather than fabricated.


  (7) The Impaired Chondrocyte Hypertrophy node is deliberately terminal. Its
  only support is the zebrafish msmo1 mutant (PMID:32430393); the human
  skeletal findings reported so far (delayed skeletal maturation in
  PMID:21285510, polydactyly in PMID:37195326, an inward curving little
  finger in PMID:41413001) have not been mechanistically tied to
  that chondrocyte defect, so no causal edge is drawn between them.


  (8) Scope of the differential_diagnoses block. All five autosomal or
  X-linked post-squalene disorders whose evidence is most at risk of being
  attributed to MSMO1 are modelled here, each with the deficient enzyme and
  the accumulating sterol as the discriminator: DHCR7/7-dehydrocholesterol
  (Smith-Lemli-Opitz), NSDHL/methyl sterols (CHILD syndrome and its allelic
  disorder CK syndrome), SC5D/lathosterol (lathosterolosis) and
  DHCR24/desmosterol (desmosterolosis). Because CHILD syndrome and CK syndrome
  are allelic NSDHL disorders that share methyl sterol accumulation
  (PMID:21129721), they are discriminated from each other clinically rather
  than biochemically. Three further members of the family tabulated in the
  deep-research artifact are deliberately not modelled: CDPX2/EBP,
  HEM-Greenberg dysplasia/LBR and Antley-Bixler/POR. Each is defined by a
  skeletal or craniofacial feature that has not been reported in any MSMO1
  patient cited here (chondrodysplasia punctata, moth-eaten lethal skeletal
  dysplasia, craniosynostosis with disordered steroidogenesis). Grepping
  references_cache across the fourteen references cited by this entry for
  EBP, LBR, POR, CDPX2, Conradi, Greenberg and Antley-Bixler returns hits only
  in PMID:21285510, PMID:21695019 and PMID:23125191, and in each case the
  neighbouring disorder is discussed as a contrast rather than as a source of
  MSMO1 findings; PMID:21285510 in particular reports that SC4MOL- and
  NSDHL-deficient patients accumulate 4,4'-dimethylsterols in skin while
  EBP-deficient patients do not, which is the molecular discriminator against
  CDPX2. The chondrodysplasia punctata contrast is additionally recorded on
  the Delayed skeletal maturation phenotype, where normal bone morphology is
  the discriminating observation.

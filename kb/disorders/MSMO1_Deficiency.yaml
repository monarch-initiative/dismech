genetic:
- name: MSMO1
  gene_term:
    preferred_term: MSMO1
    term:
      id: hgnc:10545
      label: MSMO1
  association: Causative
  inheritance:
  - name: Autosomal recessive
    evidence:
    - reference: PMID:33161406
      reference_title: New Homozygous Missense MSMO1 Mutation in Two Siblings with SC4MOL Deficiency Presenting with Psoriasiform Dermatitis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Segregation analysis in all available family members confirmed recessive inheritance of the mutation."
      explanation: Segregation in a consanguineous family confirms recessive transmission of the MSMO1 allele.
  features: >-
    Biallelic missense variants in MSMO1 (also called SC4MOL) reduce
    methylsterol monooxygenase 1 activity. Reported alleles include c.731A>G
    p.Tyr244Cys and c.605G>A p.Gly202Glu in compound heterozygosity, homozygous
    c.81A>C p.Asn27Thr, and homozygous c.548A>C p.Glu183Ala. All reported
    disease alleles to date are missense.
  evidence:
  - reference: PMID:21285510
    reference_title: Mutations in the human SC4MOL gene encoding a methyl sterol oxidase cause psoriasiform dermatitis, microcephaly, and developmental delay.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report here the identification of mutations in sterol-C4-methyl oxidase-like gene (SC4MOL) as the cause of an autosomal recessive syndrome in a human patient with psoriasiform dermatitis, arthralgias, congenital cataracts, microcephaly, and developmental delay."
    explanation: Landmark study identifying SC4MOL/MSMO1 as the causative gene.
  - reference: PMID:28673550
    reference_title: "A rare case of sterol-C4-methyl oxidase deficiency in a young Italian male: Biochemical and molecular characterization."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

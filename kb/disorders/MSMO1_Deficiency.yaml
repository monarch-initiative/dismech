diagnosis:
- name: Plasma sterol profiling by gas chromatography-mass spectrometry
  presence: PRESENT
  description: >-
    Quantitative plasma sterol analysis by GC-MS is the definitive biochemical
    test, showing marked elevation of C4-monomethyl and C4-dimethyl sterols.
    Cultured fibroblasts and skin scales are alternative sample types, with
    dimethylsterol accumulating preferentially in skin. Because most MSMO1
    missense alleles are initially reported as variants of uncertain
    significance, the sterol profile also functions as the practical
    functional assay for variant classification.
  evidence:
  - reference: PMID:28673550
    reference_title: "A rare case of sterol-C4-methyl oxidase deficiency in a young Italian male: Biochemical and molecular characterization."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Analysis of the blood sterol profile showed accumulation of C4-monomethyl and C4-dimethyl sterols suggesting a deficiency of the SC4MOL enzyme."
    explanation: Blood sterol profiling established the biochemical diagnosis in this patient.
  - reference: PMID:28673550
    reference_title: "A rare case of sterol-C4-methyl oxidase deficiency in a young Italian male: Biochemical and molecular characterization."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Consequently, we suggest that these two analyses should be performed as soon as possible in all undiagnosed patients affected by bilateral cataracts and developmental delay."
    explanation: Gives the explicit clinical indication for combined sterol profiling and MSMO1 sequencing.
  - reference: PMID:21285510
    reference_title: Mutations in the human SC4MOL gene encoding a methyl sterol oxidase cause psoriasiform dermatitis, microcephaly, and developmental delay.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These data strongly indicated a block at the step of SMO in the cholesterol synthesis pathway."
    explanation: The sterol profile localises the metabolic block to the SMO step, which is what makes it diagnostic.
- name: MSMO1 sequencing
  presence: PRESENT
  description: >-
    Molecular confirmation by exome sequencing or targeted MSMO1 sequencing.
    Whole-exome sequencing is the current first-line route to diagnosis; all
    reported disease alleles are coding missense variants, so exome coverage is
    adequate.
  evidence:
  - reference: PMID:33161406
    reference_title: New Homozygous Missense MSMO1 Mutation in Two Siblings with SC4MOL Deficiency Presenting with Psoriasiform Dermatitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We undertook whole-exome sequencing and identified a new homozygous missense mutation c.81A>C; p.Asn27Thr in MSMO1."
    explanation: Exome sequencing established the molecular diagnosis in these siblings.
  - reference: PMID:37195326
    reference_title: "MSMO1 deficiency: a potentially partially treatable, ultrarare neurodevelopmental disorder with psoriasiform dermatitis, alopecia and polydactyly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole-exome sequencing revealed a novel, homozygous c.548A > C, p.(Glu183Ala) variant."
    explanation: Exome sequencing likewise established the diagnosis in an independent family.
animal_models:
- species: Danio rerio
  genotype: msmo1nu81 homozygous loss-of-function
  category: Loss-of-function zebrafish mutant
  description: >-
    A 37-base-pair insertion producing a functional msmo1 null. Homozygotes are
    larval lethal, and lethality is partly relieved by additionally blocking
    lanosterol synthase upstream, genetically separating a cholesterol
    deprivation arm from a toxic sterol intermediate arm. Because complete loss
    is lethal in this model while human patients survive, all human MSMO1
    alleles reported so far are inferred to be hypomorphic.
  genes:
  - preferred_term: MSMO1
    term:
      id: hgnc:10545
      label: MSMO1
  evidence:
  - reference: PMID:32430393
    reference_title: Zebrafish models of skeletal dysplasia induced by cholesterol biosynthesis deficiency.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Generated msmo1nu81 knockdown mutation resulted in lethality at larval stage."
    explanation: Establishes the lethality of the complete msmo1 loss-of-function allele.
  - reference: PMID:32430393
    reference_title: Zebrafish models of skeletal dysplasia induced by cholesterol biosynthesis deficiency.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Our results indicate that double lssnu60;msmo1nu81 and single lssnu60 mutants survive significantly longer than msmo1nu81 homozygotes."
    explanation: >-
      Blocking the pathway further upstream partially rescues lethality, the
      cleanest in vivo evidence that accumulated sterol intermediates are toxic
      rather than merely inert markers of the block.
- species: Danio rerio
  genotype: kolibernu7 cis-regulatory msmo1 mutant
  category: Tissue-restricted regulatory zebrafish mutant
  description: >-
    A cis-acting regulatory mutation that removes msmo1 expression specifically
    from pre-hypertrophic chondrocytes, producing a viable late-onset skeletal
    phenotype. No equivalent human regulatory allele has been described.
  genes:
  - preferred_term: MSMO1
    term:
      id: hgnc:10545
      label: MSMO1
  evidence:
  - reference: PMID:32430393
    reference_title: Zebrafish models of skeletal dysplasia induced by cholesterol biosynthesis deficiency.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In a forward-genetic approach, we have found that a late-onset skeletal mutant, named kolibernu7 , is the result of a cis-acting regulatory mutation leading to loss of methylsterol monooxygenase 1 (msmo1) expression within pre-hypertrophic chondrocytes."
    explanation: Defines the allele and the tissue in which msmo1 expression is lost.
mechanistic_hypotheses:
- hypothesis_group_id: msmo1_psors9_common_skin_disease
  hypothesis_label: MSMO1 as a PSORS9 candidate and heterozygote susceptibility factor
  status: EMERGING
  description: >-
    MSMO1 lies within the PSORS9 psoriasis susceptibility interval, and
    obligate carriers in the index family had raised plasma methylsterols and,
    in the father, granulocyte activation approaching the proband's. Together
    these raise the hypothesis that a single hypomorphic MSMO1 allele is a
    susceptibility factor for common inflammatory skin disease rather than
    being fully recessive. This is explicitly an unproven hypothesis and is not
    asserted as a mechanism anywhere in the pathophysiology graph.
  evidence:
  - reference: PMID:24144731
    reference_title: The role of sterol-C4-methyl oxidase in epidermal biology.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "SC4MOL is situated within the psoriasis susceptibility locus PSORS9, and may be a genetic risk factor for common skin conditions."
    explanation: States the PSORS9 candidacy as a possibility, not an established association.
  - reference: PMID:21285510
    reference_title: Mutations in the human SC4MOL gene encoding a methyl sterol oxidase cause psoriasiform dermatitis, microcephaly, and developmental delay.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Methylsterol levels were also increased (though less so) in the plasma of the patient's parents (Table 2), particularly the father, who carries the active site H173Q mutation, suggesting a subclinical effect in the heterozygous state."
    explanation: Documents a subclinical biochemical effect in heterozygotes, the observation underpinning the hypothesis.
discussions:
- discussion_id: msmo1_no_mouse_model
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does any available Msmo1 mouse allele model human MSMO1 deficiency, given
    that every reported human allele is a hypomorphic missense change while the
    available mouse alleles are nulls and gene traps, and zebrafish msmo1 nulls
    are larval lethal?
  attaches_to:
  - pathophysiology#MSMO1 Deficiency
  rationale: >-
    The zebrafish null is lethal, so a mouse null would most plausibly be
    embryonic or perinatal lethal, and an absence of adult phenotypes in a
    knockout pipeline would reflect absent homozygotes rather than a benign
    knockout. No published mouse model reproducing the human microcephaly,
    cataract and psoriasiform dermatitis phenotype was identified. The
    informative mammalian in vivo data come from Nsdhl mice, which model CHILD
    syndrome and are a paralog, not an MSMO1 model.
  proposed_experiments:
  - experiment_id: exp_msmo1_hypomorphic_knockin_mouse
    name: Hypomorphic Msmo1 knock-in mouse
    description: >-
      Generate and characterise a mouse carrying a recurrent human hypomorphic
      allele such as p.Tyr244Cys or p.Gly115Arg, and test whether it reproduces
      the cutaneous, ocular and neurodevelopmental phenotype.
  - experiment_id: exp_msmo1_null_lethality_staging
    name: Staging of Msmo1 null lethality in mouse
    description: >-
      Determine homozygous viability for existing Msmo1 null and gene-trap
      alleles and stage any embryonic or perinatal lethality, so that an absence
      of adult phenotypes is not misread as a benign knockout.
  evidence:
  - reference: PMID:32430393
    reference_title: Zebrafish models of skeletal dysplasia induced by cholesterol biosynthesis deficiency.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Generated msmo1nu81 knockdown mutation resulted in lethality at larval stage."
    explanation: The lethality of the complete null in zebrafish is what makes a mammalian null a poor model of the hypomorphic human disease.
- discussion_id: msmo1_natural_history_gap
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What is the natural history of MSMO1 deficiency, and does treatment started
    presymptomatically change neurodevelopmental outcome?
  rationale: >-
    No registry, natural history study, survival analysis or quality-of-life
    measurement exists. All prognostic statements derive from a handful of
    individually reported patients. The cataract and microcephaly appear fixed
    before current diagnosis is possible, which is why the disorder is
    described as only partially treatable, but whether presymptomatic therapy
    following cascade testing of a sibling would alter the neurodevelopmental
    trajectory has never been tested.
  proposed_experiments:
  - experiment_id: exp_msmo1_natural_history_registry
    name: International MSMO1 deficiency registry
    description: >-
      Establish a registry with standardised developmental, ophthalmologic,
      dermatologic and growth outcome measures to build the first natural
      history dataset for this disorder.
  - experiment_id: exp_msmo1_presymptomatic_cascade_treatment
    name: Presymptomatic treatment of cascade-identified siblings
    description: >-
      Systematically offer cascade testing at proband diagnosis and start
      cholesterol plus statin therapy in presymptomatic biallelic siblings,
      with prospective developmental and cutaneous follow-up.
  evidence:
  - reference: PMID:37195326
    reference_title: "MSMO1 deficiency: a potentially partially treatable, ultrarare neurodevelopmental disorder with psoriasiform dermatitis, alopecia and polydactyly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MSMO1 deficiency (OMIM #616834) is an ultrarare autosomal recessive disorder of distal cholesterol metabolism with only five cases reported to date."
    explanation: The tiny reported cohort is the reason no natural history evidence exists.
differential_diagnoses:
- name: Smith-Lemli-Opitz syndrome
  description: >-
    The best-known post-squalene cholesterol biosynthesis disorder, caused by
    DHCR7 deficiency at the terminal step. It shares microcephaly, growth
    restriction and intellectual disability with MSMO1 deficiency but is
    distinguished biochemically by elevated 7-dehydrocholesterol with low
    cholesterol rather than accumulated C4-methylsterols, and clinically by
    2-3 toe syndactyly and male genital underdevelopment rather than
    psoriasiform dermatitis with congenital cataract.
  distinguishing_features:
  - Caused by DHCR7 rather than MSMO1
  - Elevated 7-dehydrocholesterol with low cholesterol, not elevated C4-methylsterols
  - 2-3 toe syndactyly and male genital underdevelopment are characteristic
  - Psoriasiform dermatitis and congenital cataract are not core features
  disease_term:
    preferred_term: Smith-Lemli-Opitz syndrome
    term:
      id: MONDO:0010035
      label: Smith-Lemli-Opitz syndrome
  evidence:
  - reference: PMID:23042573
    reference_title: "Disorders of sterol synthesis: beyond Smith-Lemli-Opitz syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This review will focus primarily on the clinical aspects of these disorders, highlighting newly described syndromes, such as SC4MOL deficiency and CK syndrome."
    explanation: >-
      Positions SC4MOL deficiency as a distinct entity within the group of
      post-squalene sterol synthesis disorders that also contains
      Smith-Lemli-Opitz syndrome.
- name: CHILD syndrome
  description: >-
    Congenital hemidysplasia with ichthyosiform erythroderma and limb defects,
    caused by NSDHL variants. NSDHL is the immediate partner of MSMO1 in the
    same C4-demethylation complex and CHILD syndrome is the disorder for which
    topical cholesterol plus statin therapy is best known, so treatment and
    mechanism literature is easily misattributed between the two. CHILD
    syndrome is X-linked dominant with characteristically lateralised skin and
    limb involvement, whereas MSMO1 deficiency is autosomal recessive with
    generalised psoriasiform dermatitis.
  distinguishing_features:
  - Caused by NSDHL, the immediate C4-demethylation partner of MSMO1, rather than MSMO1 itself
  - X-linked dominant with male lethality, not autosomal recessive
  - Strikingly lateralised (hemidysplastic) skin and ipsilateral limb defects
  - Congenital cataract, microcephaly and immune dysfunction are not its defining triad
  - Allelic with CK syndrome - both are NSDHL disorders that accumulate methyl sterols, so the discriminator against CK syndrome is clinical (lateralised cutaneous/limb disease in females) and not biochemical
  disease_term:
    preferred_term: CHILD syndrome
    term:
      id: MONDO:0010621
      label: CHILD syndrome
  evidence:
  - reference: PMID:21695019
    reference_title: "Pathogenesis of the cutaneous phenotype in inherited disorders of cholesterol metabolism: Therapeutic implications for topical treatment of these disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Finally, a prominent skin phenotype has been described in two patients with SC4MOL deficiency, who present with a severe ichthyosiform dermatosis and psoriasiform features."
    explanation: >-
      This family-wide cutaneous review separates SC4MOL deficiency from CHILD
      syndrome and the other distal cholesterol disorders it covers.
  - reference: PMID:21129721
    reference_title: Hypomorphic temperature-sensitive alleles of NSDHL cause CK syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As described for the allelic disorder CHILD syndrome, cells and cerebrospinal fluid from CKS patients have increased methyl sterol levels."
    explanation: >-
      Establishes that CHILD syndrome and CK syndrome are allelic NSDHL
      disorders sharing methyl sterol accumulation, so the two cannot be
      separated from each other on the accumulating sterol alone.
- name: CK syndrome
  description: >-
    The second, brain-predominant NSDHL disorder. Like CHILD syndrome it is
    caused by variants in NSDHL, the partner of MSMO1 in the same
    C4-demethylation complex, and like MSMO1 deficiency it accumulates methyl
    sterols and presents with intellectual disability - so both the mechanism
    sentences and the sterol-profile sentences of this literature are easy to
    misattribute to MSMO1. It is separated from MSMO1 deficiency by X-linked
    recessive inheritance in males, by cortical brain malformation with an
    asthenic build rather than psoriasiform dermatitis with congenital
    cataract, and by the deficient enzyme being NSDHL (the C4 decarboxylase
    step) rather than MSMO1 (the C4 methyl oxidase step).
  distinguishing_features:
  - Deficient enzyme is NSDHL, not the MSMO1 sterol-C4-methyl oxidase
  - Accumulating sterols are methyl sterols shared with CHILD syndrome, whereas MSMO1 deficiency accumulates both 4-monomethyl and 4,4-dimethylsterols upstream of the NSDHL step
  - X-linked recessive, affecting males, rather than autosomal recessive
  - Cortical brain malformation, dysmorphism and asthenic build dominate; the psoriasiform/ichthyosiform skin phenotype of MSMO1 deficiency is not its presenting feature
  - Separated from its allelic disorder CHILD syndrome by the absence of lateralised ichthyosiform skin and ipsilateral limb defects
  disease_term:
    preferred_term: CK syndrome
    term:
      id: MONDO:0010441
      label: CK syndrome
  evidence:
  - reference: PMID:21129721
    reference_title: Hypomorphic temperature-sensitive alleles of NSDHL cause CK syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CK syndrome (CKS) is an X-linked recessive intellectual disability syndrome characterized by dysmorphism, cortical brain malformations, and an asthenic build."
    explanation: >-
      Gives the inheritance pattern and the brain-predominant clinical core
      that separate CK syndrome from MSMO1 deficiency.
  - reference: PMID:21129721
    reference_title: Hypomorphic temperature-sensitive alleles of NSDHL cause CK syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As described for the allelic disorder CHILD syndrome, cells and cerebrospinal fluid from CKS patients have increased methyl sterol levels."
    explanation: >-
      Names the accumulating sterol class in CK syndrome and its allelism with
      CHILD syndrome, the molecular discriminator against both CHILD syndrome
      and MSMO1 deficiency.
  - reference: PMID:23042573
    reference_title: "Disorders of sterol synthesis: beyond Smith-Lemli-Opitz syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This review will focus primarily on the clinical aspects of these disorders, highlighting newly described syndromes, such as SC4MOL deficiency and CK syndrome."
    explanation: >-
      A family-wide review treats SC4MOL deficiency and CK syndrome as the two
      newly described members of the same post-squalene group, which is the
      shared-language setting in which their evidence gets mixed up.
- name: Lathosterolosis
  description: >-
    A post-squalene disorder caused by deficiency of sterol-C5-desaturase
    (SC5D), two steps downstream of the MSMO1 block. Like MSMO1 deficiency it
    is autosomal recessive, is diagnosed on a plasma sterol profile and has
    been treated with a statin, so its therapeutic and biochemical language
    closely parallels this entry. The discriminator is which sterol
    accumulates: lathosterol in lathosterolosis versus 4-monomethyl and
    4,4-dimethylsterols in MSMO1 deficiency.
  distinguishing_features:
  - Deficient enzyme is SC5D (3-beta-hydroxysteroid-delta-5-desaturase / sterol-C5-desaturase), not MSMO1
  - Lathosterol accumulates in plasma and fibroblasts, whereas MSMO1 deficiency accumulates 4-monomethyl and 4,4-dimethylsterols
  - Presents as a Smith-Lemli-Opitz-like malformation syndrome with dysmorphism and multiple congenital anomalies rather than the microcephaly-cataract-psoriasiform-dermatitis triad
  disease_term:
    preferred_term: Lathosterolosis
    term:
      id: MONDO:0011816
      label: lathosterolosis
  evidence:
  - reference: PMID:24142275
    reference_title: "Lathosterolosis: a disorder of cholesterol biosynthesis resembling smith-lemli-opitz syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Lathosterolosis is an inborn error of cholesterol biosynthesis due to deficiency of the enzyme 3-beta-hydroxysteroid-delta-5-desaturase (or sterol-C5-desaturase or SC5D)."
    explanation: Names the deficient enzyme and gene that separate lathosterolosis from MSMO1 deficiency.
  - reference: PMID:24142275
    reference_title: "Lathosterolosis: a disorder of cholesterol biosynthesis resembling smith-lemli-opitz syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report a patient with dysmorphism, multiple congenital anomalies, and developmental delay, initially suspected to have Smith-Lemli-Opitz syndrome, who was later found to have elevated levels of lathosterol in both plasma and fibroblasts."
    explanation: >-
      Documents the accumulating sterol in a genotyped patient - the
      biochemical discriminator on the same sterol profile used to diagnose
      MSMO1 deficiency.
  - reference: PMID:21695019
    reference_title: "Pathogenesis of the cutaneous phenotype in inherited disorders of cholesterol metabolism: Therapeutic implications for topical treatment of these disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although the PI is unaware of lathosterolosis cases in the US, several patients have been described in Europe, and all have prominent ichthyosis."
    explanation: >-
      Lathosterolosis shares prominent ichthyosis with MSMO1 deficiency, so the
      cutaneous phenotype does not separate them and the sterol profile must.
- name: Desmosterolosis
  description: >-
    A post-squalene disorder caused by deficiency of
    3beta-hydroxysterol-Delta24-reductase (DHCR24). It sits in the same
    autosomal recessive, sterol-profile-diagnosed group as MSMO1 deficiency and
    is routinely tabulated alongside it, but desmosterol rather than
    C4-methylsterol is the accumulating species, and it presents with prominent
    congenital anomalies and minimal skin disease - close to the inverse of the
    MSMO1 cutaneous-predominant phenotype.
  distinguishing_features:
  - Deficient enzyme is DHCR24 (3beta-hydroxysterol Delta24-reductase), not MSMO1
  - Desmosterol accumulates in plasma, tissue and cultured cells, whereas MSMO1 deficiency accumulates 4-monomethyl and 4,4-dimethylsterols
  - Prominent congenital anomalies with minimal skin abnormality, the opposite emphasis to the severe ichthyosiform/psoriasiform dermatitis of MSMO1 deficiency
  disease_term:
    preferred_term: Desmosterolosis
    term:
      id: MONDO:0011217
      label: desmosterolosis
  evidence:
  - reference: PMID:11519011
    reference_title: Mutations in the 3beta-hydroxysterol Delta24-reductase gene cause desmosterolosis, an autosomal recessive disorder of cholesterol biosynthesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with desmosterolosis have elevated levels of the cholesterol precursor desmosterol, in plasma, tissue, and cultured cells; this abnormality suggests a deficiency of the enzyme 3beta-hydroxysterol Delta24-reductase (DHCR24), which, in cholesterol biosynthesis, catalyzes the reduction of the Delta24 double bond of sterol intermediates."
    explanation: >-
      Gives both halves of the molecular discriminator - the deficient enzyme
      and the accumulating sterol.
  - reference: PMID:21695019
    reference_title: "Pathogenesis of the cutaneous phenotype in inherited disorders of cholesterol metabolism: Therapeutic implications for topical treatment of these disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Furthermore, a US kindred38 and several additional patients in Europe14 have been described with desmosterolosis, a disorder that displays prominent congenital anomalies, but minimal evidence of skin abnormalities."
    explanation: >-
      The cutaneous contrast against the severe ichthyosiform dermatosis
      described for SC4MOL deficiency in the same review.

treatments:
- name: Prosthodontic and restorative dental management
  description: >-
    Management of ECTD13 is symptomatic and centers on the oligodontia: early
    multidisciplinary dental and prosthodontic care, including removable
    prostheses, overdentures, and later dental implants, to restore function and
    appearance. There is no disease-modifying therapy that targets the Wnt
    pathway defect, and no treatment-specific outcome evidence is reported in the
    KREMEN1 case series, so no evidence snippet is attached to this row.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: prosthodontic dental rehabilitation
    term:
      id: NCIT:C38052
      label: Dental Procedure
  target_mechanisms:
  - target: Oligodontia
    description: >-
      Prosthetic rehabilitation addresses the clinical consequence of tooth
      agenesis rather than its molecular cause.

genetic:
- name: KREMEN1
  gene_term:
    preferred_term: KREMEN1
    term:
      id: hgnc:17550
      label: KREMEN1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Biallelic loss-of-function and hypomorphic missense KREMEN1 variants cause
    ECTD13. Reported alleles include the homozygous WSC-domain missense
    p.Phe209Ser (c.626T>C) in Palestinian families; Kringle-domain missense
    p.T49R (c.146C>G) and an in-frame CUB-domain deletion (c.773_778del) in
    Turkish families; compound heterozygous variants in a Thai family; and the
    homozygous p.Gly166Asp and p.Gln46* alleles characterized functionally by
    Rosen et al. In the Turkish families, heterozygous genotypes were found in
    both affected and unaffected relatives, so expressivity of the tooth-agenesis
    phenotype is variable. No ClinGen gene-disease validity assertion is recorded
    for this ultra-rare pair, so no validity tier is copied here.
  evidence:
  - reference: PMID:27049303
    reference_title: "Mutation of KREMEN1, a modulator of Wnt signaling, is responsible for ectodermal dysplasia including oligodontia in Palestinian families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the phenotype is due to homozygosity for KREMEN1 p.F209S (c.626 T>C) on chromosome 22"
    explanation: >-
      Identifies homozygous KREMEN1 p.F209S as the cause in the originally
      described Palestinian families.
  variants:
  - name: p.Phe209Ser (c.626T>C)
    description: >-
      Homozygous missense variant in the conserved extracellular WSC domain of
      KREMEN1, identified in consanguineous Palestinian families.
    evidence:
    - reference: PMID:27049303
      reference_title: "Mutation of KREMEN1, a modulator of Wnt signaling, is responsible for ectodermal dysplasia including oligodontia in Palestinian families."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The variant occurs in the highly conserved extracellular WSC domain of KREMEN1, which is known to be a high affinity receptor of Dickkopf-1, a component of the Dickkopf-Kremen-LRP6 complex, and a potent regulator of Wnt signaling."
      explanation: >-
        Locates p.F209S in the WSC domain and describes KREMEN1 as a
        high-affinity DKK1 receptor in the DKK-KREMEN-LRP6 complex.
  - name: p.T49R (c.146C>G)
    description: >-
      Kringle-domain missense variant identified in a Turkish family with
      syndromic tooth agenesis; segregation showed variable expressivity among
      heterozygous relatives.
    evidence:
    - reference: PMID:28813618
      reference_title: "Whole-Exome Sequencing Identifies Novel Variants for Tooth Agenesis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "(p.T49R), was identified in the proband, while heterozygous genotypes were found in both affected and unaffected relatives."
      explanation: >-
        Reports the p.T49R allele and the variable expressivity seen among
        heterozygous relatives.
  - name: c.773_778del
    description: >-
      Homozygous in-frame deletion in a second Turkish family with syndromic
      tooth agenesis.
    evidence:
    - reference: PMID:28813618
      reference_title: "Whole-Exome Sequencing Identifies Novel Variants for Tooth Agenesis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "a homozygous in-frame deletion (c.773_778del) was identified in the proband"
      explanation: >-
        Reports the homozygous in-frame CUB-domain deletion allele.
  - name: p.Gly166Asp (c.497G>A)
    description: >-
      Homozygous missense variant characterized functionally by Rosen et al.;
      reduces KREMEN1 glycosylation and ternary-complex formation with DKK1 and
      LRP6.
    evidence:
    - reference: PMID:40553753
      reference_title: "KREMEN1 Variants Associated with Ectodermal Dysplasia Impair Complex Formation of KREMEN1 with DKK1 and LRP6 and Attenuate WNT3A Response."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "previously unreported homozygous KREMEN1 variants c.497G>A; p.(Gly166Asp) and c.136C>T; p.(Gln46"
      explanation: >-
        Reports the homozygous p.Gly166Asp and p.Gln46* alleles in two
        additional families.
pathophysiology:
- name: KREMEN1 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic KREMEN1 variants reduce or abolish functional KREMEN1 protein.
    Null alleles (such as a splice-donor variant triggering nonsense-mediated
    decay) eliminate the protein, while missense alleles in the extracellular
    domains reduce its activity as a DKK1/LRP5/6 receptor. The founder alleles
    are mostly homozygous, but compound-heterozygous genotypes also occur.
  genes:
  - preferred_term: KREMEN1
    term:
      id: hgnc:17550
      label: KREMEN1
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  molecular_functions:
  - preferred_term: KREMEN1 transmembrane receptor activity
    term:
      id: GO:0004888
      label: transmembrane signaling receptor activity
    modifier: DECREASED
  downstream:
  - target: Impaired KREMEN1-DKK1-LRP6 Ternary Complex Formation
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:34028942
    reference_title: "Novel homozygous KREMEN1 mutation causes ectodermal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This mutation would result in a lack of functional KREMEN1 due to the nonsense-mediated mRNA decay."
    explanation: >-
      A homozygous splice-donor variant is predicted to abolish functional
      KREMEN1 via nonsense-mediated decay, establishing loss of function.
- name: Impaired KREMEN1-DKK1-LRP6 Ternary Complex Formation
  biological_scale: MOLECULAR
  description: >-
    Disease-associated KREMEN1 missense variants are under-glycosylated
    (especially O-glycosylation) and form the KREMEN1-DKK1-LRP6 ternary complex
    less efficiently than wild-type KREMEN1, while binding of KREMEN1 to LRP6
    alone is preserved.
  downstream:
  - target: Deregulated Canonical Wnt Signaling
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:40553753
    reference_title: "KREMEN1 Variants Associated with Ectodermal Dysplasia Impair Complex Formation of KREMEN1 with DKK1 and LRP6 and Attenuate WNT3A Response."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Ternary complex formation of all 4 KREMEN1 protein variants with DKK1 and LRP6 was reduced compared with that of wild type, whereas formation of the KREMEN1-LRP6 complex was not affected by the nonsynonymous variants."
    explanation: >-
      Co-expression in HEK293T cells shows reduced ternary-complex formation for
      all tested variants.
  - reference: PMID:40553753
    reference_title: "KREMEN1 Variants Associated with Ectodermal Dysplasia Impair Complex Formation of KREMEN1 with DKK1 and LRP6 and Attenuate WNT3A Response."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "KREMEN1 wild type was extensively N- and O-glycosylated, whereas the 4 protein variants showed a significant reduction in glycosylation, in particular of O-glycans."
    explanation: >-
      Reduced glycosylation of the variant proteins underlies their impaired
      complex formation.
- name: Deregulated Canonical Wnt Signaling
  biological_scale: CELLULAR
  description: >-
    Loss of normal KREMEN1 function deregulates canonical Wnt/beta-catenin
    signaling. KREMEN1 has context-dependent biphasic activity in the
    DKK1-KREMEN-LRP5/6 system, and patient cells show elevated baseline Wnt
    activity with a blunted response to WNT3A rather than a simple uniform
    increase or decrease.
  biological_processes:
  - preferred_term: canonical Wnt signaling pathway
    term:
      id: GO:0060070
      label: canonical Wnt signaling pathway
    modifier: ABNORMAL
  downstream:
  - target: Disrupted Ectodermal Appendage Morphogenesis
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:40553753
    reference_title: "KREMEN1 Variants Associated with Ectodermal Dysplasia Impair Complex Formation of KREMEN1 with DKK1 and LRP6 and Attenuate WNT3A Response."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Primary fibroblasts from the 3 patients with KREMEN1 pathogenic variants showed a higher WNT pathway activity under starved culture condition that was followed by attenuated signaling response to WNT3A, suggesting a more general WNT pathway deregulation."
    explanation: >-
      Patient-derived fibroblasts show Wnt-pathway deregulation (elevated
      baseline, attenuated WNT3A response).
  - reference: PMID:34028942
    reference_title: "Novel homozygous KREMEN1 mutation causes ectodermal dysplasia."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: "Kremen potentiates Wnt/β-catenin signaling by maintaining LRP5/6 at the plasma membrane in the absence of Dickkof1 (Dkk1); however, Kremen increases Dkk1-mediated Wnt inhibition in the presence of Dkk1"
    explanation: >-
      Background cell-biology establishing KREMEN1's context-dependent biphasic
      effect on canonical Wnt signaling, which is why loss of function
      deregulates rather than uniformly raising or lowering the pathway.
- name: Disrupted Ectodermal Appendage Morphogenesis
  biological_scale: TISSUE
  description: >-
    Wnt/beta-catenin signaling is required for the epithelial-mesenchymal
    interactions that drive development of ectodermal appendages, including tooth
    germs and hair follicles. Deregulated Wnt signaling from KREMEN1 loss
    disrupts this morphogenesis, producing tooth agenesis and hair defects.
  biological_processes:
  - preferred_term: odontogenesis
    term:
      id: GO:0042476
      label: odontogenesis
    modifier: ABNORMAL
  - preferred_term: hair follicle development
    term:
      id: GO:0001942
      label: hair follicle development
    modifier: ABNORMAL
  downstream:
  - target: Oligodontia
    causal_link_type: DIRECT
  - target: Sparse scalp hair
    causal_link_type: DIRECT
  - target: Sparse eyebrow
    causal_link_type: DIRECT
  - target: Sparse eyelashes
    causal_link_type: DIRECT
  - target: Curly hair
    causal_link_type: DIRECT
  - target: Brittle hair
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:27049303
    reference_title: "Mutation of KREMEN1, a modulator of Wnt signaling, is responsible for ectodermal dysplasia including oligodontia in Palestinian families."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "The Wnt signaling pathway is critical to development of ectodermal structures."
    explanation: >-
      Establishes the dependence of ectodermal appendage development on Wnt
      signaling, the link from deregulated Wnt to the clinical phenotype.

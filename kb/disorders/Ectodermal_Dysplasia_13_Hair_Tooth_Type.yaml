review_notes: >-
  No GeneReviews chapter exists for ECTD13 / KREMEN1 (verified against the
  committed Bookshelf index and a live PubMed genereviews[book] title search
  with synonyms present; NO_CHAPTER). The Wnt-pathway effect of KREMEN1 loss is
  recorded as "deregulation" rather than simply increased or decreased signaling:
  KREMEN1 has context-dependent biphasic activity (it potentiates Wnt signaling
  by retaining LRP5/6 at the plasma membrane when DKK1 is absent, but enhances
  DKK1-mediated Wnt inhibition when DKK1 is present), and patient fibroblasts
  show elevated baseline Wnt activity together with an attenuated response to
  WNT3A (PMID:40553753). Nail dystrophy and hypohidrosis are part of the broad
  ectodermal dysplasia definition; classic hypohidrosis is not consistently
  reported in the small KREMEN1 series, though Dinckan et al. (PMID:28813618)
  reported heat intolerance (now curated as a phenotype), so that feature is no
  longer characterized here as absent.
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    ECTD13 is inherited in an autosomal recessive manner; affected individuals
    carry biallelic (homozygous or compound heterozygous) KREMEN1 variants, and
    the phenotype segregated with recessive inheritance in the originally
    described consanguineous families. Expressivity is variable: in the Turkish
    families, heterozygous relatives were found both among affected and
    unaffected individuals.
  evidence:
  - reference: PMID:27049303
    reference_title: "Mutation of KREMEN1, a modulator of Wnt signaling, is responsible for ectodermal dysplasia including oligodontia in Palestinian families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Appearance of ectodermal dysplasia was consistent with autosomal recessive inheritance."
    explanation: >-
      The segregation pattern in four consanguineous Palestinian families is
      consistent with autosomal recessive inheritance.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Ultra-rare. Only a small number of affected individuals from a handful of
    consanguineous families (Palestinian, Turkish, Thai, and Egyptian) have been
    reported since the gene was implicated in 2016.
  evidence:
  - reference: PMID:40553753
    reference_title: "KREMEN1 Variants Associated with Ectodermal Dysplasia Impair Complex Formation of KREMEN1 with DKK1 and LRP6 and Attenuate WNT3A Response."

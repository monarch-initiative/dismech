name: Ectodermal Dysplasia 13 Hair Tooth Type
creation_date: "2026-10-26T00:00:00Z"
category: Mendelian
synonyms:
- ECTD13
- ectodermal dysplasia 13, hair/tooth type
- KREMEN1-related ectodermal dysplasia
description: >-
  Ectodermal dysplasia 13, hair/tooth type (ECTD13; OMIM 617392) is a rare
  autosomal recessive ectodermal dysplasia caused by biallelic variants in
  KREMEN1, which encodes Kringle-containing transmembrane protein 1, a
  transmembrane receptor that binds Dickkopf-1 (DKK1) and the Wnt co-receptors
  LRP5/6 and participates in regulation of canonical Wnt/beta-catenin signaling.
  The disorder predominantly affects the teeth and hair: the core feature is
  oligodontia (severe tooth agenesis) of both primary and permanent dentition,
  accompanied by mild ectodermal features such as sparse scalp hair, sparse
  eyebrows and eyelashes, and variable skin changes. It was first described in
  consanguineous Palestinian families and has since been confirmed in Turkish
  and Thai families, and functionally characterized as a disorder of KREMEN1
  loss of function with reduced KREMEN1-DKK1-LRP6 ternary complex formation and
  general deregulation of the Wnt pathway.

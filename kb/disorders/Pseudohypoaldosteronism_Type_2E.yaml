      explanation: >-
        Reports the predicted rise in WNK kinase levels in the nephron-specific
        knockout.
  - target: Increased Distal Nephron Salt Reabsorption
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: ORGANISM
    limitations: >-
      Instead of the salt retention and hypertension of the human disease, these
      mice end up with salt-sensitive hypotension, hypochloraemic alkalosis and
      diabetes insipidus, with renal inflammation and fibrosis. Removing
      cullin-3 entirely from the nephron is toxic in ways the patient allele is
      not, so this model cannot stand in for the disease at the physiological

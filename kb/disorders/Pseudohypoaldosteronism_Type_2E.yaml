  description: >-
    Every reported PHA2E allele is heterozygous and transmits as an autosomal
    dominant trait. A high proportion arise de novo, which distinguishes the
    CUL3 subtype from the KLHL3 subtype, where both dominant and recessive
    alleles occur.

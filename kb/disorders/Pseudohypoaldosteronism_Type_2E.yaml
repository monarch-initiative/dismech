    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "KLHL3 mutations are either recessive or dominant, whereas CUL3 mutations are dominant and predominantly de novo."
    explanation: >-
      States the inheritance difference between the two subtypes, which is one
      of the two discriminators.
  - reference: PMID:26286618
    reference_title: "Characterisation of the Cullin-3 mutation that causes a severe form of familial hypertension and hyperkalaemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "While FHHt patients with CUL3, KLHL3 or WNK mutations present with the same disease, those with mutations in CUL3 display a more severe phenotype, evident in terms of both an earlier age-of-onset and the degree of hypertension and electrolyte disturbance reported"
    explanation: >-
      States the severity difference against the KLHL3 and WNK subtypes.

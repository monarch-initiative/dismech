animal_models:
- name: CUL3 exon 9 deletion knock-in mouse
  species: Mouse
  genotype: Cul3 WT/delta403-459 heterozygous knock-in
  publication: PMID:26286618
  description: >-
    A heterozygous knock-in carrying the same in-frame exon 9 deletion found in
    patients. It reproduces the human electrolyte and blood pressure phenotype
    and, unlike earlier WNK and KLHL3 models, also shows arterial pulse waveform
    changes, which is the finding that put a vascular component into the
    mechanism. An independently generated knock-in of the same deletion

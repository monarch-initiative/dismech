- name: Increased Distal Nephron Salt Reabsorption
  biological_scale: TISSUE
  description: >-
    Overactive NCC reabsorbs sodium and chloride in the distal convoluted
    tubule. Because sodium delivered more distally is the driving force for
    potassium and hydrogen ion secretion in the collecting duct, taking it up
    earlier both expands volume and reduces the gradient available for
    potassium and acid excretion. This single step therefore produces the
    hypertension and the electrolyte picture together, and it is salt-dependent:
    dietary salt restriction alone improves it.
  biological_processes:
  - preferred_term: sodium ion transmembrane transport
    term:
      id: GO:0035725
      label: sodium ion transmembrane transport
    modifier: INCREASED
  downstream:

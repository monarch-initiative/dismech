pathophysiology:
- name: CUL3 Exon 9 Skipping
  biological_scale: MOLECULAR
  description: >-
    Heterozygous CUL3 variants of several different types, intronic, canonical
    splice donor, splice acceptor and synonymous exonic, all cause skipping of
    exon 9 during splicing of the CUL3 transcript. The transcript stays in
    frame, so a stable protein lacking residues 403 to 459 is produced rather
    than a null allele.
  genes:
  - preferred_term: CUL3
    term:
      id: hgnc:2553
      label: CUL3
  molecular_functions:
  - preferred_term: cullin-3 ubiquitin ligase complex scaffold activity
    term:
      id: GO:0160072
      label: ubiquitin ligase complex scaffold activity
    description: >-
      What the affected protein does: cullin-3 assembles the CRL3 complex,
      binding BTB-domain substrate adaptors at its N terminus and RBX1 at its C
      terminus, and does not itself catalyse ubiquitin transfer. No modifier is
      set because the direction is exactly what the literature disputes:
      adaptor binding is retained, and reported as increased, while the ligase
      output of the complex falls.
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: DOMINANT_NEGATIVE
    description: >-
      Heterozygous germline alleles. The deleted protein acts on the
      wild-type allele's activity as well as losing its own, which is why the
      impact is recorded as dominant negative rather than as a simple loss of
      function.
  downstream:
  - target: Loss of CUL3-delta9 Interaction with Cullin Regulators
    causal_link_type: DIRECT
    description: >-
      The 57-residue deletion sits at the border of the cullin N-terminal and
      C-terminal domains and alters folding there, which is what removes the
      regulator binding sites.
    evidence:
    - reference: PMID:29897280
      reference_title: "Dual gain and loss of cullin 3 function mediates familial hyperkalemic hypertension."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We first identified that the catalytically active CSN subunit jun activation domain-binding protein-1 (JAB1) does not associate with the deleted Cul3 4-helix bundle domain but instead with the adjacent α/β1 domain, suggesting that altered protein folding underlies the impaired binding."
      explanation: >-
        Connects the deletion to loss of COP9 signalosome binding through
        altered folding, which is the step this edge asserts.
  evidence:
  - reference: PMID:22266938
    reference_title: "Mutations in kelch-like 3 and cullin 3 cause hypertension and electrolyte abnormalities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Diverse CUL3 mutations all result in skipping of exon 9, producing an in-frame deletion."
    explanation: >-
      Establishes both the shared splicing consequence and that the product is
      an in-frame deletion rather than a truncation.
  - reference: PMID:29869755
    reference_title: "Decreased KLHL3 expression is involved in the pathogenesis of pseudohypoaldosteronism type II caused by cullin 3 mutation in vivo."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "PHAII-causing CUL3 mutations mediate exon9 skipping, producing a CUL3 protein with a 57-amino acid deletion (Δ403-459)."
    explanation: >-
      Gives the residue span of the deletion. The quote is the background
      statement of the human genetics in a mouse paper, so the evidence it
      describes is human clinical rather than the paper's own mouse work.
- name: Loss of CUL3-delta9 Interaction with Cullin Regulators
  biological_scale: MOLECULAR
  description: >-
    CUL3-delta9 loses its interaction with the COP9 signalosome, which
    deneddylates cullins, and with CAND1, which exchanges substrate adaptors.
    Cullin-RING ligase activity depends on cycling between neddylated and
    deneddylated states rather than on neddylation alone, so losing both
    regulators dysregulates the cycle. The direction of the resulting
    neddylation change is disputed in the literature and is recorded as an open
    question rather than asserted here.
  biological_processes:
  - preferred_term: protein neddylation
    term:
      id: GO:0045116
      label: protein neddylation
  cellular_components:
  - preferred_term: Cul3-RING ubiquitin ligase complex
    term:
      id: GO:0031463
      label: Cul3-RING ubiquitin ligase complex
  downstream:
  - target: CUL3-delta9 Ubiquitin Ligase Dysfunction
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:26286618
    reference_title: "Characterisation of the Cullin-3 mutation that causes a severe form of familial hypertension and hyperkalaemia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Instead, CUL3(Δ403-459) auto-ubiquitylates and loses interaction with two important Cullin regulators: the COP9-signalosome and CAND1."
    explanation: >-
      Reports the loss of both regulator interactions, and the
      auto-ubiquitination that accompanies it.
  - reference: PMID:26286618
    reference_title: "Characterisation of the Cullin-3 mutation that causes a severe form of familial hypertension and hyperkalaemia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "While neddylation is required for efficient ubiquitylation, studies show that the cycling between a neddylated and deneddylated state is crucial in a cellular context"
    explanation: >-
      Supports the claim that it is the neddylation cycle rather than
      neddylation level alone that activity depends on, which is why losing the
      deneddylase complex matters.
- name: CUL3-delta9 Ubiquitin Ligase Dysfunction
  biological_scale: MOLECULAR
  description: >-
    CUL3-delta9 retains RBX1 binding and KLHL3 binding but cannot ubiquitinate
    WNK kinases efficiently, and it cannot degrade WNK4 on its own. It also
    binds substrate adaptors more avidly than wild-type cullin-3 and forms
    unstable dimers with the wild-type protein, reducing the amount of active
    wild-type complex, so the single mutant allele impairs the normal allele as
    well.
  biological_processes:
  - preferred_term: protein ubiquitination
    term:
      id: GO:0016567
      label: protein ubiquitination
    modifier: DECREASED
  downstream:
  - target: KLHL3 Depletion
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:29897280
      reference_title: "Dual gain and loss of cullin 3 function mediates familial hyperkalemic hypertension."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "In conclusion, deletion of exon 9 from Cul3 generates a protein that is itself ubiquitin-ligase defective but also capable of enhanced autophagocytic KLHL3 degradation, thereby exerting dominant-negative effects on the WT allele."
      explanation: >-
        States both halves of this edge: the ligase defect, and the enhanced
        degradation of KLHL3 that follows from it.
  - target: RhoA Accumulation in Vascular Smooth Muscle
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:26100637
      reference_title: "Hypertension-causing Mutations in Cullin3 Protein Impair RhoA Protein Ubiquitination and Augment the Association with Substrate Adaptors."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We conclude that Cul3Δ9-associated ubiquitin ligase activity toward RhoA is impaired and suggest that Cul3Δ9 mutations may act dominantly by sequestering substrate adaptors and disrupting Cul3WT complexes."
      explanation: >-
        Reports impaired ligase activity toward RhoA specifically, which is the
        step from the general ligase defect to RhoA accumulation.
  evidence:
  - reference: PMID:26286618
    reference_title: "Characterisation of the Cullin-3 mutation that causes a severe form of familial hypertension and hyperkalaemia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We report here that the PHA2E mutant, CUL3(Δ403-459), is severely compromised in its ability to ubiquitylate WNKs, possibly due to altered structural flexibility."
    explanation: >-
      Reports the loss of WNK ubiquitination activity by the disease protein,
      which is the defect this node names.
  - reference: PMID:29897280
    reference_title: "Dual gain and loss of cullin 3 function mediates familial hyperkalemic hypertension."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In the absence of WT Cul3, WNK4 was not degraded, demonstrating that Cul3Δ403-459 itself cannot degrade WNK4; conversely, when WT Cul3 was present, as in diseased humans, WNK4 degradation was restored."
    explanation: >-
      Shows directly that the mutant protein alone cannot degrade WNK4, and
      that the heterozygous state is what the disease actually depends on.
  - reference: PMID:26100637
    reference_title: "Hypertension-causing Mutations in Cullin3 Protein Impair RhoA Protein Ubiquitination and Augment the Association with Substrate Adaptors."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Cul3Δ9 also forms unstable dimers with Cul3WT, disrupting dimers of Cul3WT complexes that are required for efficient ubiquitination of some substrates."
    explanation: >-
      Supports the dominant-negative component of this node, that the mutant
      protein reduces active wild-type complex rather than only failing itself.
- name: KLHL3 Depletion
  biological_scale: MOLECULAR
  description: >-
    KLHL3, the substrate adaptor that presents WNK kinases to cullin-3, falls in
    abundance in the presence of CUL3-delta9. Degradation runs through both the
    proteasome and autophagy. In knock-in mice the fall is specific to KLHL3:
    other KLHL family proteins such as KLHL2 are unchanged. Because the adaptor
    is what recruits the substrate, losing it blocks WNK degradation even by the
    remaining wild-type cullin-3.
  biological_processes:
  - preferred_term: proteasome-mediated ubiquitin-dependent protein catabolic process
    term:
      id: GO:0043161
      label: proteasome-mediated ubiquitin-dependent protein catabolic process
    modifier: INCREASED
  downstream:
  - target: WNK Kinase Accumulation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:25250572
      reference_title: "Hyperkalemic hypertension-associated cullin 3 promotes WNK signaling by degrading KLHL3."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "These results indicate that FHHt-associated CUL3 Δ403-459 targets KLHL3 for degradation, thereby preventing WNK degradation"
      explanation: >-
        States the causal step from KLHL3 degradation to failure of WNK
        degradation, which is exactly this edge.
  evidence:
  - reference: PMID:29869755
    reference_title: "Decreased KLHL3 expression is involved in the pathogenesis of pseudohypoaldosteronism type II caused by cullin 3 mutation in vivo."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These findings indicate that the decreased abundance of KLHL3 is a specific phenomenon caused by mutant CUL3 (Δexon9)."
    explanation: >-
      Confirms the KLHL3 fall in vivo in knock-in mice and that it is specific
      to KLHL3 rather than a general effect on KLHL proteins.
  - reference: PMID:29897280
    reference_title: "Dual gain and loss of cullin 3 function mediates familial hyperkalemic hypertension."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Proteasomal KLHL3 degradation was enhanced by Cul3Δ403-459; however, autophagic degradation was also upregulated by this Cul3 mutant."
    explanation: >-
      Supports that KLHL3 is removed by two routes, proteasomal and autophagic,
      rather than by the proteasome alone.
- name: WNK Kinase Accumulation
  biological_scale: MOLECULAR
  description: >-
    WNK1 and WNK4, normally held at low abundance by CUL3-KLHL3 mediated
    ubiquitination and proteasomal degradation, accumulate in the distal
    nephron. The accumulation is of protein level rather than of intrinsic
    kinase activity, and it is the common endpoint shared with the WNK1, WNK4
    and KLHL3 subtypes of the disease.
  cell_types:
  - preferred_term: kidney distal convoluted tubule epithelial cell
    term:
      id: CL:1000849
      label: kidney distal convoluted tubule epithelial cell
  downstream:
  - target: SPAK and OSR1 Activation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:26286618
      reference_title: "Characterisation of the Cullin-3 mutation that causes a severe form of familial hypertension and hyperkalaemia."
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: BACKGROUND
      snippet: "When activated by phosphorylation, the WNK kinases phosphorylate and activate the downstream kinases, SPAK (SPS1-related proline/alanine-rich kinase) and OSR1 (oxidative stress-responsive kinase 1)"
      explanation: >-
        States the WNK to SPAK/OSR1 step. The sentence is the paper's
        background summary of established pathway work it cites rather than its
        own result, and the kinase cascade it describes was established by
        biochemical and cell-based assay, so the evidence described is in vitro.
  evidence:
  - reference: PMID:27378813
    reference_title: "ROMK expression remains unaltered in a mouse model of familial hyperkalemic hypertension caused by the CUL3Δ403-459 mutation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The loss of functionality of CUL3(Δ403-459) and secondary accumulation of WNK kinases causes substantial NCC activation."
    explanation: >-
      Names the secondary accumulation of WNK kinases as the consequence of the
      CUL3 defect in the knock-in model.
  - reference: PMID:25250572
    reference_title: "Hyperkalemic hypertension-associated cullin 3 promotes WNK signaling by degrading KLHL3."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "As predicted, nephron-specific deletion of Cul3 in mice did increase WNK kinase levels and the abundance of phosphorylated Na-Cl cotransporter (NCC)."
    explanation: >-
      Shows in vivo that removing cullin-3 activity from the nephron raises WNK
      kinase levels and phosphorylated NCC together.
- name: SPAK and OSR1 Activation
  biological_scale: MOLECULAR
  description: >-
    Accumulated WNK kinases phosphorylate and activate the downstream

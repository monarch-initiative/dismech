  name: Decreased circulating aldosterone concentration
  description: >-
    This is the atypical finding, not the rule, and the entry carries it because
    it is what produced a documented misdiagnosis. The usual report in
    pseudohypoaldosteronism type 2 is a normal or high aldosterone alongside the
    low renin, which is the paradox the disease name obscures: the kidney
    behaves as though aldosterone were absent while it is not. One CUL3 patient
    had aldosterone suppressed along with renin and was treated with
    fludrocortisone for a presumed aldosterone deficiency. Both readings are

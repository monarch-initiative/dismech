      explanation: Reports the KLHL3 fall in the knock-in mouse kidney.
  - target: Impaired Vasodilation and Enhanced Vasoconstriction
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    limitations: >-
      The model's vascular readout is an arterial pulse waveform change, which

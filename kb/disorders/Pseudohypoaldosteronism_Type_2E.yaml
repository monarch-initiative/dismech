- name: Pseudohypoaldosteronism type 1 (ENaC and NR3C2-related)
  disease_term:
    preferred_term: pseudohypoaldosteronism type 1
    term:
      id: MONDO:0019161
      label: pseudohypoaldosteronism type 1
  description: >-
    Shares hyperkalaemia and metabolic acidosis but is the mirror image
    physiologically: renal salt wasting with hypovolaemia and markedly elevated
    renin and aldosterone, rather than salt retention with hypertension and
    suppressed renin. Blood pressure and renin separate them immediately, and
    treatment is opposite, sodium supplementation rather than a thiazide. The
    distinction matters because a child presenting with hyperkalaemia and
    acidosis can be started on fludrocortisone for a presumed aldosterone
    deficiency, which is documented in a CUL3 patient.
  distinguishing_features:
  - Hypertension with suppressed renin, versus hypovolaemia with elevated renin
    and aldosterone
  - Thiazide and salt restriction, versus sodium and bicarbonate supplementation
  evidence:
  - reference: PMID:41380172
    reference_title: "Diagnostic pitfalls in aldosterone defects: a 9-year follow-up of early-onset pseudohypoaldosteronism type 2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient, first evaluated at 2 years and 7 months of age for recurrent vomiting, was found to have hyponatremia, hyperkalemia, and metabolic acidosis, initially treated with fludrocortisone."
    explanation: >-
      Documents the actual misdiagnosis this differential guards against, a CUL3
      patient treated as an aldosterone deficiency state.
  - reference: PMID:41982973

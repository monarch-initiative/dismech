    fidelity: MODERATE
    model_scale: MOLECULAR
    limitations: >-
      A complete nephron deletion, not the in-frame deletion patients carry, and
      patients retain one wild-type allele. The same paper shows WNK4
      degradation is restored when wild-type cullin-3 is present, so the
      heterozygous human state is not reproduced by the null.
    evidence:
    - reference: PMID:25250572

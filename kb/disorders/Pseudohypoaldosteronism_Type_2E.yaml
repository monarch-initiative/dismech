    evidence:
    - reference: PMID:25250572
      reference_title: "Hyperkalemic hypertension-associated cullin 3 promotes WNK signaling by degrading KLHL3."
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: "Over time, however, Cul3 deletion caused renal dysfunction, including hypochloremic alkalosis, diabetes insipidus, and salt-sensitive hypotension, with depletion of sodium potassium chloride cotransporter 2 and aquaporin 2."
      explanation: >-
        Records the opposite physiological outcome to the human disease, which
        is why this link is a failure to recapitulate rather than a partial one.
  evidence:
  - reference: PMID:25250572
    reference_title: "Hyperkalemic hypertension-associated cullin 3 promotes WNK signaling by degrading KLHL3."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "whereas general loss of CUL3 activity - while also impairing WNK degradation - has widespread toxic effects in the kidney."
    explanation: >-

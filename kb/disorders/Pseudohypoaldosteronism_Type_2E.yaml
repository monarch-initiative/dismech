name: Pseudohypoaldosteronism Type 2E
category: Mendelian
creation_date: "2026-10-30T00:00:00Z"
synonyms:
- PHA2E
- CUL3 pseudohypoaldosteronism type 2
- pseudohypoaldosteronism type 2 caused by mutation in CUL3
- pseudohypoaldosteronism type IIE
- familial hypertension with hyperkalaemia - CUL3
description: >-
  Pseudohypoaldosteronism type 2E is the CUL3-related form of familial
  hyperkalaemic hypertension (FHHt, also called pseudohypoaldosteronism type 2
  or Gordon syndrome), and the most severe of its four genetic subtypes.
  Heterozygous and frequently de novo CUL3 variants clustered around the exon 9
  splice sites all converge on skipping of exon 9, producing an in-frame
  deletion of residues 403 to 459 from cullin-3 (CUL3-delta9). Cullin-3 is the
  scaffold of a cullin-RING E3 ubiquitin ligase that, bound to the substrate
  adaptor KLHL3, ubiquitinates WNK1 and WNK4 for proteasomal degradation in the
  distal convoluted tubule. CUL3-delta9 cannot ubiquitinate WNK kinases
  efficiently and also depletes KLHL3, so WNK kinases accumulate, activate the
  downstream kinases SPAK and OSR1, and these phosphorylate and activate the
  thiazide-sensitive Na-Cl cotransporter NCC. The resulting salt retention
  raises blood pressure while reducing potassium and hydrogen ion secretion,
  giving hypertension with hyperkalaemia, hyperchloraemic metabolic acidosis and
  suppressed renin despite a normal glomerular filtration rate. Cullin-3 also
  turns over RhoA and phosphodiesterase 5 in vascular smooth muscle, and a
  knock-in mouse model shows arterial pulse waveform changes, so a vascular
  contribution to the hypertension is recognised alongside the renal one.
  Children typically present earlier and more severely than in the WNK and
  KLHL3 subtypes, sometimes with short stature, and low-dose thiazide diuretics
  correct both the electrolyte disturbance and the blood pressure.
disease_term:
  preferred_term: pseudohypoaldosteronism type 2E
  term:
    id: MONDO:0013782
    label: pseudohypoaldosteronism type 2E
parents:
- Pseudohypoaldosteronism type 2
- Autosomal dominant disease
notes: >-
  No GeneReviews chapter covers pseudohypoaldosteronism type 2E, familial
  hyperkalaemic hypertension or Gordon syndrome, and no StatPearls chapter names
  the disease either (`just check-genereviews --online` against the committed
  Bookshelf index snapshot of 2026-09-10 reported NO_CHAPTER on both lines with
  the entry's five synonyms in place). The phenotype baseline here is therefore
  the Boyden 2012 discovery cohort, the Orphanet record, individual case
  reports and the mechanism literature.

  Name collision. "Gordon syndrome" is an eponym for two unrelated diseases:
  this renal tubular disorder, and the PIEZO2 distal arthrogryposis type 3
  curated as `Gordon_Syndrome` (MONDO:0007252). A literature search on the
  eponym returns both. Papers cited here were each checked for which entity
  they describe; PMID:34480842 uses the eponym in its title for the renal
  disease and reports a CUL3 intron 9 variant, hyperkalaemia and hypertension,
  so it is this disease.

  Allele spectrum. Every reported PHA2E allele acts through exon 9 skipping,
  but the variants that cause it are heterogeneous in type: canonical splice
  donor and acceptor variants, deeper intronic variants, and at least one
  synonymous exonic variant (c.1221A>G p.Glu407Glu) that removes exonic
  splicing enhancer sequence. A CUL3 variant list is therefore not interpretable
  for this disease without a splicing readout.

  Mechanism direction is contested, and the entry records that rather than
  choosing. Whether CUL3-delta9 is hyperneddylated or under-neddylated is
  directly disputed between PMID:25250572 and PMID:26100637; see the
  `cul3_delta9_neddylation_direction` discussion. ClinGen's own evidence summary
  for this gene-disease pair calls the mechanism loss of function, while the
  cell-based work describes dominant-negative action on the wild-type allele,
  which is why `functional_impact_category` is `DOMINANT_NEGATIVE` here and the
  ClinGen wording is noted on the validity assertion rather than overwritten.

  Aldosterone direction is disputed too, and the disease name misleads about it.
  Despite "pseudohypoaldosteronism", the usual report in type 2 is a normal or
  high aldosterone with a low renin: the kidney behaves as though aldosterone
  were absent while it is not. PMID:27369102 states aldosterone is most
  frequently normal or high, while PMID:41380172 reports a CUL3 patient whose
  aldosterone was suppressed along with renin, which is what led to
  fludrocortisone being given for a presumed aldosterone deficiency. The
  `Decreased circulating aldosterone concentration` phenotype carries both, one
  as SUPPORT and one as REFUTE, and no frequency.

  Hypercalciuria is recorded as a phenotype but deliberately left out of the
  causal graph. Activated NCC raising distal calcium excretion, the mirror of
  thiazide-induced hypocalciuria, is the obvious reading, but none of the
  sources cited here states it, so no edge is drawn.

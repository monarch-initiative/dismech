      materiality: QUALIFYING
      description: >-
        The measured quantity is the arterial pulse waveform of the intact
        mouse. The node's quantity is vasodilator and vasoconstrictor function
        of vascular smooth muscle. The waveform is a downstream composite of
        tone, stiffness and cardiac output rather than a measurement of
        dilation.
    evidence:
    - reference: PMID:26286618
      reference_title: "Characterisation of the Cullin-3 mutation that causes a severe form of familial hypertension and hyperkalaemia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These mice also show changes in the arterial pulse waveform, suggesting a vascular contribution to their hypertension not reported in previous FHHt models."
      explanation: >-
        The vascular finding in this model, reported by the authors as
        suggestive of a vascular contribution.
  evidence:
  - reference: PMID:26286618
    reference_title: "Characterisation of the Cullin-3 mutation that causes a severe form of familial hypertension and hyperkalaemia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM

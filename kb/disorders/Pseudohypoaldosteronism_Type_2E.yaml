    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Management was tailored to the subtype, including aggressive salt supplementation for systemic PHAI and thiazide diuretics for PHAII."
    explanation: >-
      States the opposite management of the two types, which is why the
      distinction is clinically consequential.
discussions:
- discussion_id: cul3_delta9_neddylation_direction
  kind: CONTROVERSY
  status: OPEN
  posed_by: "dismech curation"
  prompt: >-
    Is CUL3-delta9 hyperneddylated and over-activated, or under-neddylated and
    under-activated, and does the answer change what the dominant mechanism in
    patients is?
  rationale: >-
    Two cell-based studies report opposite directions for the same
    modification on the same mutant protein. McCormick et al. report that
    CUL3-delta9 is more heavily neddylated and more activated than wild-type,
    with the disease arising because that over-active ligase destroys its own
    adaptor KLHL3. Ibeawuchi et al. report that neddylation of the same mutant
    and its binding to RBX1 are both significantly impaired, with the disease
    arising because the mutant sequesters adaptors and poisons wild-type dimers.
    Cornelius et al. set out to resolve it, name hyperneddylation as one of
    several postulated mechanisms, and conclude for a protein that is itself
    ligase-defective while driving autophagic KLHL3 degradation. The two
    accounts are not merely different emphases: they disagree on the sign of the
    measured modification. Both are compatible with the clinical phenotype
    because both end in failed WNK degradation, which is why the disagreement
    has persisted without being decisive for diagnosis or treatment. It matters
    for anything that would target the pathway pharmacologically, since a
    neddylation inhibitor would be expected to act in opposite directions under
    the two models.
  attaches_to:
  - pathophysiology#Loss of CUL3-delta9 Interaction with Cullin Regulators
  - pathophysiology#CUL3-delta9 Ubiquitin Ligase Dysfunction
  evidence:
  - reference: PMID:25250572
    reference_title: "Hyperkalemic hypertension-associated cullin 3 promotes WNK signaling by degrading KLHL3."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here, we demonstrated that an FHHt-causing CUL3 mutant (CUL3 Δ403-459) not only retains the ability to bind and ubiquitylate WNK kinases and KLHL3 in cells, but is also more heavily neddylated and activated than WT CUL3."
    explanation: >-
      One side of the disagreement, that the mutant is more heavily neddylated
      and more active than wild-type.
  - reference: PMID:26100637
    reference_title: "Hypertension-causing Mutations in Cullin3 Protein Impair RhoA Protein Ubiquitination and Augment the Association with Substrate Adaptors."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "Consistent with its reduced activity, binding of Cul3Δ9 to the E3 ubiquitin ligase Rbx1 and neddylation of Cul3Δ9 were impaired significantly compared with Cul3WT."
    explanation: >-
      The other side, that neddylation of the same mutant is significantly
      impaired rather than increased. Cited as refuting the hyperneddylation
      reading.
  - reference: PMID:29897280
    reference_title: "Dual gain and loss of cullin 3 function mediates familial hyperkalemic hypertension."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Although the mechanisms by which WNK and KLHL3 mutations cause the disease are now clear, the effects of the disease-causing CUL3Δ403-459 mutation remain controversial."
    explanation: >-
      An independent statement that the mechanism is unresolved, which is what
      makes this a recorded controversy rather than a settled node.
  - reference: PMID:31813255
    reference_title: "Hypertension-causing cullin 3 mutations disrupt COP9 signalosome binding."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "New data have identified a possible novel mechanism involving dysregulation of CUL3 activity by the COP9 signalosome (CSN). The CSN interaction with mutant CUL3 is diminished, causing hyperneddylation of the CRL."
    explanation: >-
      A dedicated review of this question, taking the hyperneddylation side via
      loss of COP9 signalosome binding and describing it as a possible mechanism
      rather than a settled one. Records where the field stood when the review
      was written.
  - reference: PMID:30301860
    reference_title: "Renal COP9 Signalosome Deficiency Alters CUL3-KLHL3-WNK Signaling Pathway."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "Western blot analysis demonstrated that Jab1 deletion increased the abundance of neddylated CUL3."
    explanation: >-
      In vivo support for the hyperneddylation side, and the only such evidence
      from an animal rather than from cultured cells. It is indirect because the
      experiment deletes the CSN subunit Jab1 along the nephron rather than
      carrying CUL3-delta9: it shows that losing CSN function raises neddylated
      CUL3 and depletes KLHL3, which is the mechanism proposed for the mutant,
      not a measurement made on the mutant itself.
- discussion_id: pha2e_hyperkalemia_origin
  kind: KNOWLEDGE_GAP
  status: OPEN
  posed_by: "dismech curation"
  prompt: >-
    What accounts for the part of the hyperkalaemia in PHA2E that NCC
    activation does not explain, given that reduced ROMK expression was tested
    in the knock-in mouse and not found?
  rationale: >-
    The hypertension in this disease follows cleanly from NCC activation, but
    the hyperkalaemia does not. Two sources state that the electrolyte
    abnormalities are only partly driven by NCC. The obvious candidate was
    reduced expression of the distal secretory potassium channel ROMK, and that
    was the explicit target of a dedicated study: CUL3-delta9 did fail to
    prevent WNK4 suppression of ROMK currents in oocytes and did not support
    ROMK surface expression in collecting duct cells, yet in the knock-in mouse
    no change in ROMK expression could be shown by western blotting or confocal
    microscopy. So the in vitro result did not transfer to the animal, and the
    residual mechanism is unidentified. This is a gap rather than a controversy
    because no competing positive account has been offered.
  attaches_to:
  - phenotypes#Hyperkalemia
  - pathophysiology#Increased Distal Nephron Salt Reabsorption
  evidence:
  - reference: PMID:27378813
    reference_title: "ROMK expression remains unaltered in a mouse model of familial hyperkalemic hypertension caused by the CUL3Δ403-459 mutation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "This accounts for the hypertension in FHHt but the origin of the hyperkalemia is less clear."
    explanation: >-
      States the gap directly, that NCC activation explains the hypertension but
      not the hyperkalaemia.
  - reference: PMID:27378813
    reference_title: "ROMK expression remains unaltered in a mouse model of familial hyperkalemic hypertension caused by the CUL3Δ403-459 mutation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "This suggests that the hyperkalemia in our knock-in mouse and human PHA2E subjects with the CUL3(Δ403-459) mutation is not caused by reduced ROMK expression in the distal nephron."
    explanation: >-
      The negative result that closes off the leading candidate explanation and
      leaves the gap open.

diagnosis:
- name: Molecular genetic testing of CUL3
  description: >-
    Next-generation sequencing establishes the diagnosis and the subtype.
    Because every PHA2E allele acts by exon 9 skipping and the variants that do
    so include deep intronic and synonymous changes, a protein-level
    interpretation can miss them, and a splicing readout on patient RNA is the
    confirmatory step where the variant is not a canonical splice-site change.
  evidence:
  - reference: PMID:41380172
    reference_title: "Diagnostic pitfalls in aldosterone defects: a 9-year follow-up of early-onset pseudohypoaldosteronism type 2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Next generation sequencing has emerged as a valuable tool for establishing a definitive diagnosis, particularly in cases with aldosterone defects."
    explanation: Supports sequencing as the route to a definitive diagnosis here.
  - reference: PMID:29511623
    reference_title: "A novel mutation in exon 9 of Cullin 3 gene contributes to aberrant splicing in pseudohypoaldosteronism type II."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "explored its effects on exon 9 abnormal splicing through an in vitro splicing assay and study of the patients' RNA"
    explanation: >-
      Describes the splicing readout on patient RNA that was needed to call a
      synonymous variant pathogenic.
- name: Biochemical profile of hyperkalemia with suppressed renin
  description: >-
    Hyperkalaemia and hyperchloraemic metabolic acidosis with suppressed renin,
    preserved renal function and hypertension. The pattern is easily misread:
    one reported child was treated with fludrocortisone for a presumed
    aldosterone deficiency before the hypertension was weighed.
  evidence:
  - reference: PMID:41380172
    reference_title: "Diagnostic pitfalls in aldosterone defects: a 9-year follow-up of early-onset pseudohypoaldosteronism type 2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Aldosterone pathway defects may be misdiagnosed during the initial clinical assessment. This underscores the importance of a comprehensive diagnostic approach incorporating biochemical profiling and genetic testing to ensure accurate identification."
    explanation: >-
      Supports both the role of biochemical profiling and the documented risk of
      misdiagnosis at first assessment.
treatments:

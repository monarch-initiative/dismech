- name: Nephron-specific Cul3 knockout mouse
  species: Mouse
  genotype: Nephron-specific Cul3 deletion
  publication: PMID:25250572
  description: >-
    A conditional deletion used to test whether losing cullin-3 activity in the
    nephron phenocopies the disease. It reproduces the proximal part of the
    mechanism, raising WNK kinase levels and phosphorylated NCC, but then
    diverges: over time the mice develop hypochloraemic alkalosis, diabetes
    insipidus, salt-sensitive hypotension, renal inflammation and fibrosis. The
    divergence is informative rather than a failure of the model, because it is
    what shows that the human disease is not a simple nephron loss of cullin-3
    function.
  genes:
  - preferred_term: CUL3
    term:
      id: hgnc:2553
      label: CUL3

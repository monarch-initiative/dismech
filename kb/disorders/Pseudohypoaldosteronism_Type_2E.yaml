      label: pseudohypoaldosteronism type 2D
  description: >-
    The adjacent subtype, caused by variants in the substrate adaptor that
    CUL3-delta9 depletes, so the two converge on the same failure of WNK
    degradation and are clinically indistinguishable feature by feature. They

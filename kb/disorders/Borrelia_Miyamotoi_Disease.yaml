agent_life_cycle:
  description: >-
    B. miyamotoi is maintained by horizontal blood-feeding transmission among
    Ixodes hard ticks and small-rodent reservoir hosts, transtadial tick
    persistence, and transovarial passage from infected female ticks into larval
    offspring. Humans are incidental clinical hosts infected when an infected
    Ixodes tick feeds.
  hosts:
  - preferred_term: Homo sapiens
    role: incidental clinical host
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  - preferred_term: White-footed mouse
    role: natural reservoir host
    term:
      id: NCBITaxon:10041
      label: Peromyscus leucopus
  - preferred_term: Blacklegged tick
    role: vector host and transovarial maintenance host
    term:
      id: NCBITaxon:6945
      label: Ixodes scapularis
  - preferred_term: Western blacklegged tick
    role: vector host
    term:
      id: NCBITaxon:29930
      label: Ixodes pacificus
  - preferred_term: Castor bean tick
    role: vector host
    term:
      id: NCBITaxon:34613
      label: Ixodes ricinus
  - preferred_term: Taiga tick
    role: vector host
    term:
      id: NCBITaxon:34615
      label: Ixodes persulcatus
  vectors:
  - Ixodes scapularis
  - Ixodes pacificus
  - Ixodes ricinus
  - Ixodes persulcatus
  evidence:
  - reference: PMID:34412488
    reference_title: Borrelia miyamotoi - another emerging tick-borne pathogen.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      It is primarily transmitted by ticks from the Ixodes ricinus complex,
      similarly to borreliae causing Lyme borreliosis. Small rodents can serve
      as reservoir hosts.
    explanation: >-
      The review places B. miyamotoi in an Ixodes ricinus-complex vector cycle
      with small rodents as vertebrate reservoirs.
  - reference: PMID:35858517
    reference_title: >-
      A comparison of horizontal and transovarial transmission efficiency of
      Borrelia miyamotoi by Ixodes scapularis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The pathogen is acquired either transovarially (vertically) or
      horizontally through blood-feeding and passed transtadially across life
      stages.
    explanation: >-
      Ixodes scapularis and rodent transmission experiments support the
      horizontal, transstadial, and transovarial routes that maintain B.
      miyamotoi in hard-tick cycles.

transmission:
- name: Ixodes hard-tick transmission
  description: >-
    Ixodes hard ticks transmit B. miyamotoi from reservoir cycles to humans; in
    the United States, I. scapularis transmits the organism in the Northeast and
    Midwest and I. pacificus transmits it on the Pacific Coast.
  evidence:
  - reference: PMID:37610298
    reference_title: >-
      Characteristics of Hard Tick Relapsing Fever Caused by Borrelia
      miyamotoi, United States, 2013-2019.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Borrelia miyamotoi, transmitted by Ixodes spp. ticks, was recognized as an
      agent of hard tick relapsing fever in the United States in 2013.
    explanation: >-
      Establishes Ixodes spp. ticks as vectors of B. miyamotoi hard-tick
      relapsing fever.

epidemiology:
- name: Ixodes exposure in Holarctic Lyme disease regions
  description: >-
    B. miyamotoi disease is reported across North America and Eurasia in areas
    where Ixodes vectors of Lyme disease circulate; recognized illness is often
    nonspecific and concentrated in the same tick season as other Ixodes-borne
    infections.
  factors:
  - Ixodes tick exposure
  - residence or travel in Lyme disease endemic regions
  evidence:
  - reference: PMID:25700888
    reference_title: Borrelia miyamotoi infection in nature and in humans.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      B. miyamotoi infection should be considered in patients with acute febrile
      illness who have been exposed to Ixodes ticks in a region where Lyme
      disease occurs.
    explanation: >-
      The review identifies the main exposure context for B. miyamotoi disease.

clinical_burden:
  burden_level: LOW
  rationale: >-
    B. miyamotoi hard-tick relapsing fever usually presents as an acute febrile
    outpatient illness; US surveillance during 2013-2019 recorded
    hospitalization in roughly one eighth of cases and no reported deaths, while
    meningoencephalitis has been reported rarely, especially in
    immunocompromised patients.
  evidence:
  - reference: PMID:37610298
    reference_title: >-
      Characteristics of Hard Tick Relapsing Fever Caused by Borrelia
      miyamotoi, United States, 2013-2019.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Approximately one eighth (39/300, 13%) of persons who had HTRF were
      hospitalized; the percentage hospitalized was similar among persons who
      had confirmed (20/166, 12%) and possible (19/134, 12%) illness (p =
      0.78). There were no deaths.
    explanation: >-
      CDC surveillance quantifies hospitalization and mortality in the first
      standardized US hard-tick relapsing-fever case series.
  - reference: PMID:38916722
    reference_title: >-
      Acute Meningoencephalitis Associated with Borrelia miyamotoi, Minnesota,
      USA.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Borrelia miyamotoi is an emerging tickborne pathogen that has been
      associated with central nervous system infections in immunocompromised
      patients, albeit infrequently.
    explanation: >-
      This 2024 case report documents that severe CNS infection is a rare part
      of the recognized clinical spectrum.

pathophysiology:
- name: Ixodes-Mediated Borrelia miyamotoi Inoculation
  role: trigger
  description: >-
    Feeding Ixodes hard ticks deliver B. miyamotoi from a reservoir tick cycle
    into human skin, initiating hard-tick relapsing-fever borreliosis.
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: symbiont entry into host
    term:
      id: GO:0044409
      label: symbiont entry into host
  downstream:
  - target: CbiA-Mediated Complement Evasion
    causal_link_type: DIRECT
    description: >-
      Tick inoculation introduces B. miyamotoi into human tissues and blood,
      where the spirochete surface can block complement attack.
  evidence:
  - reference: PMID:37610298
    reference_title: >-
      Characteristics of Hard Tick Relapsing Fever Caused by Borrelia
      miyamotoi, United States, 2013-2019.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Borrelia miyamotoi, transmitted by Ixodes spp. ticks, was recognized as an
      agent of hard tick relapsing fever in the United States in 2013.
    explanation: >-
      The human surveillance report establishes the upstream Ixodes-transmitted
      B. miyamotoi infection this node represents.
- name: CbiA-Mediated Complement Evasion
  role: immune_evasion
  description: >-
    B. miyamotoi resists human complement-mediated killing; the outer-surface
    protein CbiA binds Factor H and complement components, preserving Factor H
    cofactor activity and inhibiting complement deposition and terminal-complex
    assembly on the spirochete surface.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: negative regulation of complement activation
    modifier: INCREASED
    term:
      id: GO:0045916
      label: negative regulation of complement activation
  downstream:
  - target: B. miyamotoi Spirochetemia
    causal_link_type: DIRECT
    description: >-
      Complement evasion lets spirochetes resist innate bacteriolysis long
      enough to establish bloodstream infection.
  evidence:
  - reference: PMID:25104575
    reference_title: >-
      The relapsing fever spirochete Borrelia miyamotoi resists
      complement-mediated killing by human serum.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Growth inhibition assays revealed that B. miyamotoi is strongly resistant
      to complement-mediated bacteriolysis.
    explanation: >-
      Human-serum assays show that B. miyamotoi withstands complement-mediated
      lysis and can therefore survive the innate serum barrier upstream of
      spirochetemia.
  - reference: PMID:28331202
    reference_title: >-
      Immune evasion of Borrelia miyamotoi: CbiA, a novel outer surface protein
      exhibiting complement binding and inactivating properties.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Functional analyses revealed that CbiA interacted with complement
      regulator Factor H (FH), C3, C3b, C4b, C5, and C9.
    explanation: >-
      The CbiA functional study identifies the B. miyamotoi surface protein
      that binds complement regulators and effectors to inhibit human
      complement attack.
- name: B. miyamotoi Spirochetemia
  role: primary_infection
  description: >-
    B. miyamotoi persists as a bloodstream relapsing-fever Borrelia infection
    whose bacteremic burden drives fever, systemic symptoms, thrombocytopenia,
    leukopenia, and elevated hepatic transaminases.
  biological_scale: ORGANISM
  downstream:
  - target: Vmp-Switched Relapsing Bacteremia
    causal_link_type: DIRECT
    description: >-
      The bacteremic relapsing-fever Borrelia population carries variable
      major-protein systems that can switch expressed surface antigens.
  - target: Fever
    description: Bacteremia manifests as acute high fever.
  - target: Chills
    description: The systemic febrile syndrome commonly includes chills.
  - target: Headache
    description: The systemic febrile syndrome commonly includes headache.
  - target: Arthralgia
    description: The systemic febrile syndrome commonly includes joint pain.
  - target: Thrombocytopenia
    description: Acute infection commonly lowers the platelet count.
  - target: Leukopenia
    description: Acute infection commonly lowers the leukocyte count.
  - target: Elevated hepatic transaminase
    description: Acute infection commonly raises circulating hepatic transaminases.
  - target: B. miyamotoi CNS Infection
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Rare disseminated infections reach the central nervous system, especially
      in immunocompromised patients.
  evidence:
  - reference: PMID:37610298
    reference_title: >-
      Characteristics of Hard Tick Relapsing Fever Caused by Borrelia
      miyamotoi, United States, 2013-2019.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Specific laboratory diagnosis of B. miyamotoi infection is achieved
      through PCR detection of B. miyamotoi DNA
    explanation: >-
      PCR confirmation in blood specimens establishes spirochetemia as the
      directly detected state in acute B. miyamotoi disease.
- name: Vmp-Switched Relapsing Bacteremia
  role: immune_evasion
  description: >-
    B. miyamotoi belongs to the relapsing-fever Borrelia clade whose variable
    major proteins mediate antigenic variation, allowing rare switched
    spirochete variants to escape the antibody response and drive recurrent
    bacteremic fever waves.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: antigenic variation
    modifier: INCREASED
    term:
      id: GO:0020033
      label: antigenic variation
  downstream:
  - target: Recurrent Fever
    description: Bacteremic waves drive relapsing febrile episodes.
  evidence:
  - reference: PMID:41026790
    reference_title: >-
      Antigenic variation is caused by long plasmid segment conversion in a
      hard tick-borne relapsing fever Borrelia miyamotoi.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Our analyses revealed that the switch occurred by replacing the
      expression cassette and its downstream silent cassettes with the long
      segment from archival plasmid.
    explanation: >-
      B. miyamotoi clones reisolated from experimentally infected mice directly
      showed Vmp long-segment conversion as the switching mechanism for
      expressed surface-antigen cassettes.
  - reference: PMID:37610298
    reference_title: >-
      Characteristics of Hard Tick Relapsing Fever Caused by Borrelia
      miyamotoi, United States, 2013-2019.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All relapsing fever group borreliae display antigenic variation, a shift
      in expressed proteins that creates recurring febrile episodes
    explanation: >-
      The CDC surveillance paper explains why antigenic variation is the
      mechanism that makes relapsing-fever Borrelia bacteremias recur.
  - reference: PMID:26821411
    reference_title: "[Relapsing (recurrent) disease caused by Borrelia miyamotoi]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Relapses occurred in all the 8 patients before antibiotic treatment.
    explanation: >-
      The PCR-confirmed Russian inpatient cohort documents untreated recurrent
      B. miyamotoi fever episodes, anchoring the recurrent-fever branch in human
      clinical disease.
- name: B. miyamotoi CNS Infection
  description: >-
    In rare severe presentations, B. miyamotoi disseminates to cerebrospinal
    fluid and produces meningoencephalitis, most often reported in
    immunocompromised hosts.
  biological_scale: ORGANISM
  downstream:
  - target: Meningoencephalitis
    description: CNS infection manifests with meningeal or encephalitic disease.
  evidence:
  - reference: PMID:38916722
    reference_title: >-
      Acute Meningoencephalitis Associated with Borrelia miyamotoi, Minnesota,
      USA.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe a case-patient in Minnesota, USA, who had meningeal symptoms
      of 1 month duration. B. miyamotoi infection was diagnosed by Gram staining
      on cerebrospinal fluid and confirmed by sequencing.
    explanation: >-
      The Minnesota case report confirms B. miyamotoi in CSF in a patient with
      meningeal disease.


diagnosis:
- name: PCR with GlpQ serologic support
  description: >-
    Acute infection is confirmed by PCR detection of B. miyamotoi DNA in blood
    or CSF. Serologic testing against GlpQ can support relapsing-fever Borrelia
    exposure, but GlpQ assays do not distinguish hard-tick B. miyamotoi disease
    from soft-tick relapsing fever.
  diagnosis_term:
    preferred_term: polymerase chain reaction
    term:
      id: NCIT:C17003
      label: Polymerase Chain Reaction
  results: >-
    Detection of B. miyamotoi DNA by PCR confirms active infection; GlpQ
    reactivity is supportive only in the correct exposure context.
  evidence:
  - reference: PMID:37610298
    reference_title: >-
      Characteristics of Hard Tick Relapsing Fever Caused by Borrelia
      miyamotoi, United States, 2013-2019.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Specific laboratory diagnosis of B. miyamotoi infection is achieved
      through PCR detection of B. miyamotoi DNA
    explanation: >-
      The CDC surveillance report summarizes PCR as the specific laboratory
      test for B. miyamotoi disease.
  - reference: PMID:37610298
    reference_title: >-
      Characteristics of Hard Tick Relapsing Fever Caused by Borrelia
      miyamotoi, United States, 2013-2019.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      GlpQ cannot distinguish between B. miyamotoi infection and infections
      caused by other relapsing fever group Borrelia spp.
    explanation: >-
      GlpQ serology is a relapsing-fever-group assay rather than a
      B. miyamotoi-specific diagnostic result.

treatments:
- name: Doxycycline or ceftriaxone
  description: >-
    Antibiotic therapy clears B. miyamotoi spirochetemia and prevents further
    relapse; doxycycline is used for uncomplicated acute disease, and
    ceftriaxone has clinical and in vitro support for severe or CNS disease.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: doxycycline
      term:
        id: CHEBI:50845
        label: doxycycline
    - preferred_term: ceftriaxone
      term:
        id: CHEBI:29007
        label: ceftriaxone
  target_mechanisms:
  - target: B. miyamotoi Spirochetemia
    treatment_effect: INHIBITS
    description: Antibiotic killing clears bloodstream B. miyamotoi.
  evidence:
  - reference: PMID:22000350
    reference_title: >-
      Humans infected with relapsing fever spirochete Borrelia miyamotoi,
      Russia.
    supports: SUPPORT

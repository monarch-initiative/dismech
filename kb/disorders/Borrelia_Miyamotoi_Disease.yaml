name: Borrelia Miyamotoi Disease
creation_date: "2026-09-29T04:07:16Z"
category: Infectious Disease
description: >-
  Borrelia miyamotoi disease is a hard-tick relapsing-fever borreliosis caused
  by the spirochete Borrelia miyamotoi. Ixodes ticks inoculate the organism into
  humans, where CbiA-mediated complement resistance helps spirochetes survive
  innate serum killing and produce an acute systemic syndrome with fever,
  chills, headache, arthralgia, cytopenias, transaminitis, and occasional
  recurrent fever waves as variable-major-protein-switched bacteremic variants
  escape the antibody response to the prior serotype.

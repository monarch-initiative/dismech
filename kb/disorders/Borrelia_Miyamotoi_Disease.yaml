  preferred_term: Borrelia miyamotoi disease
  term:
    id: MONDO:0958150
    label: Borrelia miyamotoi disease
parents:
- Relapsing Fever
synonyms:
- Hard-tick relapsing fever
- Borrelia miyamotoi infection

classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
    evidence:
    - reference: PMID:37610298
      reference_title: >-
        Characteristics of Hard Tick Relapsing Fever Caused by Borrelia
        miyamotoi, United States, 2013-2019.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Borrelia miyamotoi, transmitted by Ixodes spp. ticks, was recognized as
        an agent of hard tick relapsing fever in the United States in 2013.
      explanation: >-
        CDC surveillance frames B. miyamotoi disease as a bacterial
        hard-tick-borne relapsing fever, placing it in Harrison's Infectious
        Diseases Part.


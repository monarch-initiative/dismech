- name: Storage-Driven Cardiac Hypertrophy
  biological_scale: TISSUE
  role: downstream_consequence
  description: >-
    Ventricular and atrial wall mass increases mainly because myocytes are
    filled with stored glycogen, rather than through sarcomeric hypertrophy
    with myofibre disarray. The hypertrophy is biventricular, progresses after
    birth, enlarges the heart enough to compress the developing lungs, and ends
    in cardiac failure. Clinically it presents as a hypertrophic cardiomyopathy
    phenocopy.
  cell_types:
  - preferred_term: Cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  evidence:
  - reference: PMID:17667862
    reference_title: "Fatal infantile cardiac glycogenosis with phosphorylase kinase deficiency and a mutation in the gamma2-subunit of AMP-activated protein kinase."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Postmortem examination revealed ventricular hypertrophy and massive atrial wall thickening due to glycogen accumulation."
    explanation: >-
      Autopsy evidence of glycogen-driven ventricular and atrial hypertrophy
      in a lethal-form infant.
  - reference: PMID:12782567
    reference_title: "Transgenic mice overexpressing mutant PRKAG2 define the cause of Wolff-Parkinson-White syndrome in glycogen storage cardiomyopathy."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "Transgenic mutant mice showed elevated AMP-activated protein kinase activity, accumulated large amounts of cardiac glycogen (30-fold above normal), developed dramatic left ventricular hypertrophy, and exhibited ventricular preexcitation and sinus node dysfunction."
    explanation: >-
      An activating PRKAG2 allele (N488I) produces AMPK activation, cardiac
      glycogen accumulation and left ventricular hypertrophy in vivo. Different
      allele and species, hence INDIRECT.

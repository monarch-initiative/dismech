notes: >-
  RELATIONSHIP TO PRKAG2 CARDIAC SYNDROME. This disorder is allelic with
  `PRKAG2_Cardiac_Syndrome` (MONDO:0800484), where it also appears as the
  `has_subtypes` row "Lethal Congenital"; MONDO asserts MONDO:0009867 is_a
  MONDO:0800484. It is the severity extreme of the same gamma-2 CBS-domain
  lesion: the defining study describes the classic PRKAG2 alleles, which give
  juvenile-to-adult onset, moderate glycogenosis, conduction disturbance and
  midlife sudden-death risk, as producing perturbations similar to but less
  severe than those of R531Q. Features of the classic syndrome that are not
  tied to this form by a source - adult-onset progressive conduction disease
  requiring pacing, atrial fibrillation, late heart failure - are deliberately
  not curated here; they belong to the parent entry.

  OBSOLETE SYNONYM. MONDO (from OMIM 261740) still carries "phosphorylase
  kinase deficiency of heart" as a synonym. It is kept in `synonyms` for
  lookup only; PMID:15877279 found no mutations in the eight phosphorylase
  kinase subunit genes or in the muscle and brain glycogen phosphorylase genes,
  and questions whether a heart-specific primary phosphorylase kinase
  deficiency exists at all. This entry is not a form of glycogen storage
  disease type IX.

  GENETIC HETEROGENEITY. R531Q was found in three of five patients; the
  remaining cases had no PRKAG2 variant, so PRKAG2 is the only gene known to
  cause the disorder but does not explain every case. The cached abstract
  calls the variants heterozygous and the patients sporadic but does not state
  parental testing, so `variant_origin` is left unset rather than recorded as
  de novo.

  MECHANISM DIRECTION. The parent entry leaves the direction of the
  AMPK-activity change in classic PRKAG2 disease unresolved. For R531Q
  specifically, recombinant-protein data show increased basal activity, so the
  AMPK node here asserts activation. The steps from AMPK activation to glucose
  uptake and glycogen synthesis, and from glycogen-laden myocytes to
  accessory atrioventricular conduction, are supported only by work on other
  PRKAG2 alleles (R302Q, N488I) and are marked `directness: INDIRECT`.

  EVIDENCE GAPS. The only cached primary source on this form is the
  abstract of PMID:15877279. It gives no per-patient frequencies, so no
  `frequency` bands are asserted. Death in infancy is recorded in
  `progression` rather than as a phenotype because the HPO mortality terms sit
  outside the phenotypic-abnormality branch this schema admits. Cardiomegaly
  and congestive heart failure are part of the OMIM description but have no
  quotable sentence in the cached abstract and are not curated. No treatment
  is curated: no cached source reports management of this form, and the parent
  entry's interventions (pacing, accessory-pathway ablation, transplantation)
  are drawn from the adult disease.
inheritance:
- name: Autosomal dominant
  description: >-
    Affected infants are heterozygous for an activating PRKAG2 missense
    variant, and the gain of basal AMPK activity explains why a single allele
    suffices. Reported cases are sporadic, consistent with the fatal course
    precluding transmission.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:15877279
    reference_title: "Fatal congenital heart glycogenosis caused by a recurrent activating R531Q mutation in the gamma 2-subunit of AMP-activated protein kinase (PRKAG2), not by phosphorylase kinase deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "R531Q and other PRKAG2 mutations enhance the basal activity and alpha -subunit phosphorylation of AMP-activated protein kinase, explaining the dominant nature of PRKAG2 disease mutations."
    explanation: >-
      The activating biochemistry of R531Q is offered as the explanation for
      dominant action of a single heterozygous allele.
  - reference: PMID:15877279
    reference_title: "Fatal congenital heart glycogenosis caused by a recurrent activating R531Q mutation in the gamma 2-subunit of AMP-activated protein kinase (PRKAG2), not by phosphorylase kinase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "in three of five patients, we identified identical heterozygous R531Q missense mutations of the PRKAG2 gene"
    explanation: >-
      Affected infants carry a single heterozygous R531Q allele.
genetic:
- name: PRKAG2
  association: Causative
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: PRKAG2
    term:
      id: hgnc:9386
      label: PRKAG2
  notes: >-
    PRKAG2 encodes the gamma-2 regulatory subunit of AMPK. Only the recurrent
    p.Arg531Gln allele has been linked to this lethal congenital form in the
    cached literature. No ClinGen gene-disease validity record for
    MONDO:0009867 is cached, so `gene_disease_validity` is not recorded.
  case_fractions:
  - population: Sporadic, unrelated patients with fatal congenital nonlysosomal cardiac glycogenosis
    case_fraction_percent: 60.0
    cohort_size: 5
    notes: >-
      Three of five patients carried PRKAG2 R531Q. A single small series; the
      PRKAG2-negative cases show the disorder is genetically heterogeneous.
    evidence:
    - reference: PMID:15877279
      reference_title: "Fatal congenital heart glycogenosis caused by a recurrent activating R531Q mutation in the gamma 2-subunit of AMP-activated protein kinase (PRKAG2), not by phosphorylase kinase deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "in three of five patients, we identified identical heterozygous R531Q missense mutations of the PRKAG2 gene"
      explanation: >-
        Gives the numerator and denominator (3 of 5) for the PRKAG2 case
        fraction.
  variants:
  - name: p.Arg531Gln
    description: >-
      Recurrent CBS-domain missense allele found as an identical heterozygous
      substitution in unrelated sporadic patients. The recombinant protein loses
      more than 100-fold of its binding affinity for AMP and ATP while gaining
      basal kinase activity. At the same codon, p.Arg531Gly causes a
      hypertrophy-free childhood-onset pre-excitation phenotype (see
      `PRKAG2_Cardiac_Syndrome`).
    evidence:
    - reference: PMID:15877279
      reference_title: "Fatal congenital heart glycogenosis caused by a recurrent activating R531Q mutation in the gamma 2-subunit of AMP-activated protein kinase (PRKAG2), not by phosphorylase kinase deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "recurrent heterozygous R531Q missense mutations in PRKAG2 give rise to a massive nonlysosomal cardiac glycogenosis of fetal symptomatic onset and rapidly fatal course"
      explanation: >-
        Ties the recurrent R531Q allele to the lethal congenital phenotype.
  evidence:
  - reference: PMID:15877279
    reference_title: "Fatal congenital heart glycogenosis caused by a recurrent activating R531Q mutation in the gamma 2-subunit of AMP-activated protein kinase (PRKAG2), not by phosphorylase kinase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "in three of five patients, we identified identical heterozygous R531Q missense mutations of the PRKAG2 gene"
    explanation: >-
      Identifies PRKAG2 as a causative gene for the disorder.
  - reference: PMID:15877279
    reference_title: "Fatal congenital heart glycogenosis caused by a recurrent activating R531Q mutation in the gamma 2-subunit of AMP-activated protein kinase (PRKAG2), not by phosphorylase kinase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we found no mutations either in the eight genes encoding phosphorylase kinase subunits or in the two genes encoding the muscle and brain isoforms of glycogen phosphorylase"
    explanation: >-
      Excludes the phosphorylase kinase and glycogen phosphorylase genes once
      thought to underlie the disorder.

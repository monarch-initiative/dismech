      Fetal ultrasound identified the cardiac phenotype at 25 weeks.
- name: Molecular genetic testing
  description: >-
    PRKAG2 sequencing (panel or exome) establishes the diagnosis. It replaced
    the myocardial phosphorylase kinase assay of the historical literature and
    separates this disorder from infantile Pompe disease, which it can mimic,
    and from the other genetic causes of fetal hydrops and cardiomyopathy.
  diagnosis_term:
    preferred_term: Genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:39215506
    reference_title: "PRKAG2 -Related Lethal Congenital Glycogen Storage Disease of the Heart as Rare Cause of Fetal Hydrops With Bradycardia and Cardiomyopathy: Clinical Report and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "underlines the clinical utility of comprehensive molecular testing in the investigation of nonimmune foetal hydrops and fetal cardiomyopathy"
    explanation: >-
      Molecular testing established the diagnosis in a prenatally presenting
      case.
  - reference: PMID:28801758
    reference_title: "PRKAG2 mutations presenting in infancy."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "We highlight the potential for patients with PRKAG2 mutations to mimic Pompe disease in infancy and the need for confirmatory testing when diagnosing Pompe disease."
    explanation: >-
      Infant-onset PRKAG2 disease can be mistaken for Pompe disease. The
      abstract does not state the alleles or outcomes of these infants, hence
      INDIRECT for the lethal form.
  - reference: PMID:10368461
    reference_title: "Infantile hypertrophic cardiomyopathy of glycogenosis type IX: isolated cardiac phosphorylase kinase deficiency."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Conclusive diagnosis requires biochemical analysis of myocardium, which may not be possible premortem due to the amount of tissue required."
    explanation: >-
      Records the superseded myocardial enzyme-based diagnosis and why it was
      impractical before death.
treatments:
- name: Heart Transplantation
  description: >-
    The historical literature names cardiac transplantation as the only
    treatment. No transplanted case of this form was found; other reported
    management is supportive and did not prevent death.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Heart transplantation
    term:
      id: NCIT:C15246
      label: Heart Transplantation
  target_mechanisms:
  - target: Storage-Driven Cardiac Hypertrophy
    treatment_effect: RESTORES
    description: >-
      Replacing the storage-affected heart removes the hypertrophic organ.
  evidence:
  - reference: PMID:10368461
    reference_title: "Infantile hypertrophic cardiomyopathy of glycogenosis type IX: isolated cardiac phosphorylase kinase deficiency."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "There is no current treatment except a heart transplant."
    explanation: >-
      States transplantation as the only option for the clinical entity under
      its historical attribution; reports no transplanted case, hence
      INDIRECT.
- name: Supportive Heart Failure Pharmacotherapy
  description: >-
    Beta-blockers and diuretics have been used to manage the hypertrophic
    cardiomyopathy and volume status of affected infants. In the reported R531Q
    case they did not prevent death at about 7 weeks; no disease-specific
    therapy exists.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: beta-blocker
      term:
        id: NCIT:C29576
        label: Beta-Adrenergic Antagonist
    - preferred_term: diuretic
      term:
        id: NCIT:C448
        label: Diuretic
  target_mechanisms:
  - target: Congestive heart failure
    treatment_effect: MODULATES
    description: >-
      Symptomatic management of heart failure and fluid overload; no effect on
      the underlying glycogen storage is claimed.
  evidence:
  - reference: PMID:30430036
    reference_title: "Infantile Onset Hypertrophic Cardiomyopathy Secondary to PRKAG2 Gene Mutation is Associated with Poor Prognosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In view of the echocardiographic findings, the infant was started on β-blockers and diuretics."
    explanation: >-
      Beta-blockers and diuretics were started in an R531Q infant with severe
      hypertrophic cardiomyopathy.

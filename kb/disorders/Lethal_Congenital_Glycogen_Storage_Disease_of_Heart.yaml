name: Lethal Congenital Glycogen Storage Disease of Heart
creation_date: "2026-10-14T16:46:15Z"
category: Mendelian
synonyms:
- Fatal congenital nonlysosomal cardiac glycogenosis
- Fatal congenital heart glycogenosis
- Lethal congenital cardiac glycogenosis
- Phosphorylase kinase deficiency of heart
description: >-
  Lethal congenital glycogen storage disease of heart is a massive
  non-lysosomal glycogenosis of the myocardium with symptomatic onset in fetal
  life and a rapidly fatal course. It was long attributed to a heart-specific
  form of phosphorylase kinase deficiency, but no phosphorylase kinase or
  glycogen phosphorylase mutations were found in affected infants. Instead, a
  recurrent heterozygous PRKAG2 missense substitution, p.Arg531Gln (R531Q), in
  the gamma-2 regulatory subunit of AMP-activated protein kinase (AMPK) was
  identified in three of five sporadic, unrelated patients. The R531Q protein
  binds the regulatory nucleotides AMP and ATP more than 100-fold less avidly
  yet shows increased basal kinase activity and alpha-subunit phosphorylation,
  so the kinase escapes adenine-nucleotide control. The resulting
  storage-driven cardiac hypertrophy is the severe, fetal-onset extreme of the
  PRKAG2 cardiac glycogenosis spectrum, and the defining study classes it as a
  genotypically and clinically distinct variant of hypertrophic cardiomyopathy
  with Wolff-Parkinson-White syndrome. Cases without a PRKAG2 variant exist, so
  the disorder appears genetically heterogeneous.

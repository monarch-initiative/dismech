  downstream:
  - target: Constitutive AMPK Activation Escaping Nucleotide Control
    causal_link_type: DIRECT
    description: >-
      Without nucleotide sensing, the heterotrimer's activity is uncoupled from
      the cellular energy charge and its basal activity rises.
    evidence:
    - reference: PMID:15877279
      reference_title: "Fatal congenital heart glycogenosis caused by a recurrent activating R531Q mutation in the gamma 2-subunit of AMP-activated protein kinase (PRKAG2), not by phosphorylase kinase deficiency."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "showed >100-fold reduction of binding affinities for the regulatory nucleotides AMP and ATP but an enhanced basal activity and increased phosphorylation of the alpha -subunit"
      explanation: >-
        The same recombinant protein shows both the binding loss and the gain
        in basal activity.
- name: Constitutive AMPK Activation Escaping Nucleotide Control
  biological_scale: MOLECULAR
  role: central_effector
  description: >-
    AMPK carrying the R531Q gamma-2 subunit shows enhanced basal activity and
    increased phosphorylation of the alpha catalytic subunit. The defining study
    reports that the classic PRKAG2 alleles push in the same direction to a
    lesser degree.
  molecular_functions:
  - preferred_term: AMP-activated protein kinase activity
    term:
      id: GO:0004679
      label: AMP-activated protein kinase activity
    modifier: INCREASED
  cell_types:
  - preferred_term: Cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  evidence:
  - reference: PMID:15877279
    reference_title: "Fatal congenital heart glycogenosis caused by a recurrent activating R531Q mutation in the gamma 2-subunit of AMP-activated protein kinase (PRKAG2), not by phosphorylase kinase deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "R531Q and other PRKAG2 mutations enhance the basal activity and alpha -subunit phosphorylation of AMP-activated protein kinase"
    explanation: >-
      Direct biochemical demonstration that R531Q activates AMPK.
  downstream:
  - target: Massive Non-Lysosomal Cardiomyocyte Glycogen Accumulation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - >-
      Increased GLUT4 translocation and hexokinase activity raise myocardial
      glucose uptake.
    - >-
      Upregulated glycogen synthase converts the imported glucose into stored
      glycogen.
    evidence:
    - reference: PMID:11827995
      reference_title: "Constitutively active AMP kinase mutations cause glycogen storage disease mimicking hypertrophic cardiomyopathy."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: OTHER
      snippet: "Nonphysiologic activation of cardiac AMP kinase by these mutations should increase glucose uptake (by stimulating translocation of the glucose transporter GLUT-4 to the plasma membrane) and increase hexokinase activity, thereby leading to glycogen accumulation"
      explanation: >-
        States the glucose-uptake route from AMPK activation to glycogen
        accumulation. Written about other PRKAG2 alleles (Thr400Asn,
        Asn488Ile) and framed as an expectation, hence OTHER and INDIRECT for
        R531Q.
    - reference: PMID:20031621
      reference_title: "Distinct early signaling events resulting from the expression of the PRKAG2 R302Q mutant of AMPK contribute to increased myocardial glycogen."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: "acute expression of gamma(2)R302Q induces AMPK activation and upregulation of glycogen synthase and AS160, with an associated increase in glycogen content"
      explanation: >-
        In cultured cardiomyocytes, an activating PRKAG2 allele raises glycogen
        synthase and AS160 together with glycogen content. A different allele
        (R302Q), so INDIRECT for R531Q.
- name: Massive Non-Lysosomal Cardiomyocyte Glycogen Accumulation
  biological_scale: CELLULAR
  role: central_effector
  description: >-
    Cardiomyocytes fill with glycogen stored outside lysosomes, already
    symptomatic before birth. The extent of storage is greater than the
    moderate glycogenosis of the classic PRKAG2 syndrome.
  cell_types:
  - preferred_term: Cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: Glycogen biosynthetic process
    term:
      id: GO:0005978
      label: glycogen biosynthetic process
    modifier: INCREASED
  evidence:
  - reference: PMID:15877279
    reference_title: "Fatal congenital heart glycogenosis caused by a recurrent activating R531Q mutation in the gamma 2-subunit of AMP-activated protein kinase (PRKAG2), not by phosphorylase kinase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "recurrent heterozygous R531Q missense mutations in PRKAG2 give rise to a massive nonlysosomal cardiac glycogenosis of fetal symptomatic onset and rapidly fatal course"
    explanation: >-
      Establishes massive non-lysosomal cardiac glycogen storage as the
      lesion produced by R531Q.
  downstream:
  - target: Increased myocardial glycogen content
    causal_link_type: DIRECT
  - target: Storage-Driven Cardiac Hypertrophy
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:11827995
      reference_title: "Constitutively active AMP kinase mutations cause glycogen storage disease mimicking hypertrophic cardiomyopathy."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "Excess glycogen storage and water in cardiomyocytes appear to account for increased cardiac mass in affected individuals"
      explanation: >-
        Attributes the increased cardiac mass in PRKAG2 disease to stored
        glycogen and water. Observed in carriers of other PRKAG2 alleles, hence
        INDIRECT for R531Q.
  - target: Ventricular pre-excitation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - >-
      Glycogen-filled myocytes breach the annulus fibrosus and form accessory
      atrioventricular muscle connections.
    evidence:
    - reference: PMID:12782567
      reference_title: "Transgenic mice overexpressing mutant PRKAG2 define the cause of Wolff-Parkinson-White syndrome in glycogen storage cardiomyopathy."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "Cardiac histopathology revealed that the annulus fibrosis, which normally insulates the ventricles from inappropriate excitation by the atria, was disrupted by glycogen-filled myocytes."
      explanation: >-
        In the N488I transgenic mouse, glycogen-filled myocytes disrupt the
        annulus fibrosus, the anatomical substrate of pre-excitation. Mouse
        model of a different allele, hence INDIRECT for R531Q.
- name: Storage-Driven Cardiac Hypertrophy
  biological_scale: TISSUE
  role: downstream_consequence
  description: >-
    Ventricular mass increases mainly because myocytes are filled with stored
    glycogen, rather than through sarcomeric hypertrophy with myofibre
    disarray. Clinically this presents as a hypertrophic cardiomyopathy
    phenocopy.
  cell_types:
  - preferred_term: Cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  evidence:
  - reference: PMID:12782567
    reference_title: "Transgenic mice overexpressing mutant PRKAG2 define the cause of Wolff-Parkinson-White syndrome in glycogen storage cardiomyopathy."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "Transgenic mutant mice showed elevated AMP-activated protein kinase activity, accumulated large amounts of cardiac glycogen (30-fold above normal), developed dramatic left ventricular hypertrophy, and exhibited ventricular preexcitation and sinus node dysfunction."
    explanation: >-
      An activating PRKAG2 allele (N488I) produces AMPK activation, cardiac
      glycogen accumulation and left ventricular hypertrophy in vivo. Different
      allele and species, hence INDIRECT.
  downstream:
  - target: Hypertrophic cardiomyopathy
    causal_link_type: DIRECT

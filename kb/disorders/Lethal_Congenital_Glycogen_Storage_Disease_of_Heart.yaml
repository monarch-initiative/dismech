name: Lethal Congenital Glycogen Storage Disease of Heart
creation_date: "2026-10-14T16:46:15Z"
category: Mendelian
synonyms:
- Fatal congenital nonlysosomal cardiac glycogenosis
- Fatal congenital heart glycogenosis
- Lethal congenital cardiac glycogenosis
- Fatal congenital hypertrophic cardiomyopathy due to glycogenosis
- Phosphorylase kinase deficiency of heart
description: >-
  Lethal congenital glycogen storage disease of heart is a massive
  non-lysosomal glycogenosis of the myocardium with symptomatic onset in fetal
  life and death in early infancy. Affected fetuses show biventricular
  hypertrophy, cardiomegaly, bradycardia and pericardial effusion, often
  progressing to nonimmune hydrops fetalis, and infants die of cardiac failure
  within weeks to a few months of birth. The disorder was long attributed to a
  heart-specific form of phosphorylase kinase deficiency, but no phosphorylase
  kinase or glycogen phosphorylase mutations were found in affected infants.
  Instead, heterozygous, typically de novo PRKAG2 missense variants in the
  nucleotide-binding CBS domains of the gamma-2 regulatory subunit of
  AMP-activated protein kinase (AMPK) cause it. The recurrent p.Arg531Gln
  (R531Q) allele accounts for most molecularly confirmed cases, and the
  arginine-384 substitutions R384T and R384G have also been reported. These
  substitutions reduce binding of the regulatory nucleotides AMP and ATP, so
  the kinase escapes adenine-nucleotide control. The resulting storage-driven
  cardiac hypertrophy is the severe, fetal-onset extreme of the PRKAG2 cardiac
  glycogenosis spectrum, distinct from the classic PRKAG2 syndrome of
  adolescent or adult onset. Cases without a PRKAG2 variant exist, so the
  disorder appears genetically heterogeneous.
disease_term:
  preferred_term: lethal congenital glycogen storage disease of heart
  term:
    id: MONDO:0009867
    label: lethal congenital glycogen storage disease of heart
parents:
- Glycogen Storage Disease
- Cardiomyopathy
- Genetic Disorder
notes: >-
  RELATIONSHIP TO PRKAG2 CARDIAC SYNDROME. This disorder is allelic with
  `PRKAG2_Cardiac_Syndrome` (MONDO:0800484), where it also appears as the
  `has_subtypes` row "Lethal Congenital"; MONDO asserts MONDO:0009867 is_a
  MONDO:0800484. It is the severity extreme of the same gamma-2 CBS-domain
  lesion. PMID:39569283 describes the classic syndrome as typically presenting
  with pre-excitation and hypertrophy in adolescence and adulthood, and only
  rarely with fetal- or infantile-onset hypertrophic cardiomyopathy. Features
  of the classic syndrome that no source ties to this form - adult-onset
  progressive conduction disease requiring pacing, atrial fibrillation, late
  heart failure - are deliberately not curated here. Infant-onset PRKAG2 cases
  that survive infancy (E506Q, PMID:19787389; K475E, PMID:28550180) are also
  not treated as this disorder.

  SUPERSEDED PHOSPHORYLASE KINASE ATTRIBUTION. Between 1984 and 1999 the
  disorder was reported as cardiac-specific phosphorylase kinase deficiency
  (PMID:6424667, PMID:3918928, PMID:8236826, PMID:10368461), on the basis of
  undetectable phosphorylase kinase activity in heart with normal activity in
  liver and skeletal muscle. Those cases predate molecular testing, so their
  genotype is unknown; they are cited here only for the clinical picture
  (heart-restricted glycogen storage, in-utero cardiomegaly, short PR
  interval, death from heart failure), with `directness: INDIRECT`.
  PMID:15877279 found no mutations in the eight phosphorylase kinase subunit
  genes or in the muscle and brain glycogen phosphorylase genes, and
  PMID:17667862 found a PRKAG2 variant in an infant whose skeletal muscle
  showed reduced phosphorylase kinase activity, describing the enzyme
  deficiency as apparent rather than primary. "Phosphorylase kinase
  deficiency of heart" is kept in `synonyms` for lookup only; this entry is
  not a form of glycogen storage disease type IX.

  GENETIC HETEROGENEITY. R531Q was found in three of five patients in the
  defining series; the remaining cases had no PRKAG2 variant, so PRKAG2 is the
  only gene known to cause the disorder but does not explain every case.

  VARIANT ORIGIN. Reported cases are sporadic. De novo origin is confirmed by
  trio exome sequencing for one R531Q case (PMID:39569283) and stated for the
  R384G case (PMID:39215506); for R384T only the father was tested
  (PMID:17667862).

  MECHANISM DIRECTION. For R531Q, recombinant-protein data show increased
  basal AMPK activity, so the AMPK node asserts activation. R384T reduces
  nucleotide binding in the same way but was reported to prevent
  stress-induced activation of the heterotrimer in intact cells, so the net
  activity change may differ between alleles. The steps from AMPK activation to
  glucose uptake and glycogen synthesis, and from glycogen-laden myocytes to
  accessory atrioventricular conduction, are supported only by work on other
  PRKAG2 alleles (R302Q, N488I) and are marked `directness: INDIRECT`.

  EVIDENCE GAPS. No source gives per-feature frequencies across a defined
  cohort, so no `frequency` bands are asserted; the case-level findings come
  from single reports and from the case table compiled in PMID:39569283.
  Death in infancy is recorded in `progression` rather than as a phenotype
  because the HPO mortality terms sit outside the phenotypic-abnormality
  branch this schema admits. Ventricular pre-excitation is reported per
  patient only in a secondary summary of the three original R531Q infants
  (PMID:30430036), while a short PR interval is reported in primary case
  descriptions. One R531Q
  infant had refractory chylous ascites with a lymphatic malformation
  (PMID:39569283), whose authors call the association with PRKAG2 unclear; it
  is not curated as a phenotype.
inheritance:
- name: Autosomal dominant
  description: >-
    Affected infants are heterozygous for an activating PRKAG2 missense
    variant, and the gain of basal AMPK activity explains why a single allele
    suffices. Reported cases are sporadic and arise de novo, consistent with the
    fatal course precluding transmission.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:15877279
    reference_title: "Fatal congenital heart glycogenosis caused by a recurrent activating R531Q mutation in the gamma 2-subunit of AMP-activated protein kinase (PRKAG2), not by phosphorylase kinase deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "R531Q and other PRKAG2 mutations enhance the basal activity and alpha -subunit phosphorylation of AMP-activated protein kinase, explaining the dominant nature of PRKAG2 disease mutations."
    explanation: >-
      The activating biochemistry of R531Q is offered as the explanation for
      dominant action of a single heterozygous allele.
  - reference: PMID:15877279
    reference_title: "Fatal congenital heart glycogenosis caused by a recurrent activating R531Q mutation in the gamma 2-subunit of AMP-activated protein kinase (PRKAG2), not by phosphorylase kinase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "in three of five patients, we identified identical heterozygous R531Q missense mutations of the PRKAG2 gene"
    explanation: >-
      Affected infants carry a single heterozygous R531Q allele.
  - reference: PMID:39215506
    reference_title: "PRKAG2 -Related Lethal Congenital Glycogen Storage Disease of the Heart as Rare Cause of Fetal Hydrops With Bradycardia and Cardiomyopathy: Clinical Report and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a rare autosomal dominant non lysosomal cardiac glycogenosis caused by a novel de novo likely pathogenic variant in the Protein Kinase AMP-Activated Non-Catalytic Subunit Gamma 2 (PRKAG2) gene"
    explanation: >-
      Names this disorder as autosomal dominant and reports a de novo PRKAG2
      variant in an affected pregnancy.
genetic:
- name: PRKAG2
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: DE_NOVO
  gene_term:
    preferred_term: PRKAG2
    term:
      id: hgnc:9386
      label: PRKAG2
  notes: >-
    PRKAG2 encodes the gamma-2 regulatory subunit of AMPK. Reported lethal
    alleles are the recurrent p.Arg531Gln and two substitutions at arginine
    384 (p.Arg384Thr, p.Arg384Gly), all in the nucleotide-binding CBS domains.
    `variant_origin` is DE_NOVO because the cases are sporadic and parental
    testing, where done, found the variant absent (one R531Q trio, the R384G
    case; father only for R384T). No ClinGen gene-disease validity record for
    MONDO:0009867 is cached, so `gene_disease_validity` is not recorded.
  case_fractions:
  - population: Sporadic, unrelated patients with fatal congenital nonlysosomal cardiac glycogenosis
    case_fraction_percent: 60.0
    cohort_size: 5
    notes: >-
      Three of five patients carried PRKAG2 R531Q. A single small series; the
      PRKAG2-negative cases show the disorder is genetically heterogeneous.
    evidence:
    - reference: PMID:15877279
      reference_title: "Fatal congenital heart glycogenosis caused by a recurrent activating R531Q mutation in the gamma 2-subunit of AMP-activated protein kinase (PRKAG2), not by phosphorylase kinase deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "in three of five patients, we identified identical heterozygous R531Q missense mutations of the PRKAG2 gene"
      explanation: >-
        Gives the numerator and denominator (3 of 5) for the PRKAG2 case
        fraction.
  variants:
  - name: p.Arg531Gln
    description: >-
      Recurrent CBS-domain missense allele (c.1592G>A) found as an identical
      heterozygous substitution in unrelated sporadic patients, de novo where
      parents were tested. The recombinant protein loses more than 100-fold of
      its binding affinity for AMP and ATP while gaining basal kinase activity.
      Every reported carrier with fetal or infantile presentation died within
      months. At the same codon, p.Arg531Gly causes a hypertrophy-free
      childhood-onset pre-excitation phenotype (see `PRKAG2_Cardiac_Syndrome`).
    evidence:
    - reference: PMID:15877279
      reference_title: "Fatal congenital heart glycogenosis caused by a recurrent activating R531Q mutation in the gamma 2-subunit of AMP-activated protein kinase (PRKAG2), not by phosphorylase kinase deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "recurrent heterozygous R531Q missense mutations in PRKAG2 give rise to a massive nonlysosomal cardiac glycogenosis of fetal symptomatic onset and rapidly fatal course"
      explanation: >-
        Ties the recurrent R531Q allele to the lethal congenital phenotype.
    - reference: PMID:39569283
      reference_title: "Severe Hypertrophic Cardiomyopathy Caused by a Protein Kinase Adenosine Monophosphate-Activated Non-catalytic Subunit Gamma 2 (PRKAG2) Mutation With Refractory Chylous Effusions in a Neonate: A Case Report and Literature Review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Next-generation whole exome sequencing of the patient and her parents revealed a pathogenic de novo c.1592G>A (p.Arg531Gln) heterozygous variant in the PRKAG2 gene."
      explanation: >-
        Trio exome sequencing establishes de novo origin of R531Q in a neonate
        with prenatal-onset hypertrophic cardiomyopathy who died at 77 days.
    - reference: PMID:39569283
      reference_title: "Severe Hypertrophic Cardiomyopathy Caused by a Protein Kinase Adenosine Monophosphate-Activated Non-catalytic Subunit Gamma 2 (PRKAG2) Mutation With Refractory Chylous Effusions in a Neonate: A Case Report and Literature Review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Of these, five cases showed a heterozygous c.1592G>A (p.Arg531Gln) mutation in PRKAG2, and all of them died within several months of age."
      explanation: >-
        Literature review of fetal and infantile PRKAG2 cases finds that every
        previously reported R531Q carrier died within months.
  - name: p.Arg384Thr
    description: >-
      Heterozygous substitution of an arginine in the N-terminal AMP-binding
      CBS domain, reported in an infant who died at 5 months with massive
      cardiac glycogen storage. Like R531Q it reduces AMP and ATP binding;
      in intact cells it prevented activation of the heterotrimer by
      metabolic stress. Absent from the father, the only parent tested.
    evidence:
    - reference: PMID:17667862
      reference_title: "Fatal infantile cardiac glycogenosis with phosphorylase kinase deficiency and a mutation in the gamma2-subunit of AMP-activated protein kinase."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We found a novel (R384T) heterozygous mutation in PRKAG2, affecting an arginine residue in the N-terminal AMP-binding domain."
      explanation: >-
        Identifies R384T in an infant with fatal cardiac glycogenosis.
    - reference: PMID:17667862
      reference_title: "Fatal infantile cardiac glycogenosis with phosphorylase kinase deficiency and a mutation in the gamma2-subunit of AMP-activated protein kinase."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The mutation was not found in DNA from the patient's father, the only available parent, and is likely to have arisen de novo."
      explanation: >-
        Paternal testing supports, without proving, de novo origin.
  - name: p.Arg384Gly
    description: >-
      De novo likely pathogenic c.1150A>G substitution at the same arginine 384,
      reported in a pregnancy presenting with nonimmune hydrops fetalis,
      bradycardia and cardiomyopathy.
    evidence:
    - reference: PMID:39215506
      reference_title: "PRKAG2 -Related Lethal Congenital Glycogen Storage Disease of the Heart as Rare Cause of Fetal Hydrops With Bradycardia and Cardiomyopathy: Clinical Report and Literature Review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "a rare autosomal dominant non lysosomal cardiac glycogenosis caused by a novel de novo likely pathogenic variant in the Protein Kinase AMP-Activated Non-Catalytic Subunit Gamma 2 (PRKAG2) gene"
      explanation: >-
        Reports a de novo PRKAG2 variant (p.Arg384Gly per the abstract) as the
        cause of this disorder in a prenatally presenting case.
  evidence:
  - reference: PMID:15877279
    reference_title: "Fatal congenital heart glycogenosis caused by a recurrent activating R531Q mutation in the gamma 2-subunit of AMP-activated protein kinase (PRKAG2), not by phosphorylase kinase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "in three of five patients, we identified identical heterozygous R531Q missense mutations of the PRKAG2 gene"
    explanation: >-
      Identifies PRKAG2 as a causative gene for the disorder.
  - reference: PMID:15877279
    reference_title: "Fatal congenital heart glycogenosis caused by a recurrent activating R531Q mutation in the gamma 2-subunit of AMP-activated protein kinase (PRKAG2), not by phosphorylase kinase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we found no mutations either in the eight genes encoding phosphorylase kinase subunits or in the two genes encoding the muscle and brain isoforms of glycogen phosphorylase"
    explanation: >-
      Excludes the phosphorylase kinase and glycogen phosphorylase genes once
      thought to underlie the disorder.
  - reference: PMID:17667862
    reference_title: "Fatal infantile cardiac glycogenosis with phosphorylase kinase deficiency and a mutation in the gamma2-subunit of AMP-activated protein kinase."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our studies confirm that mutations in PRKAG2 can cause fatal infantile cardiomyopathy, often associated with apparent PHK deficiency."
    explanation: >-
      An independent case with a second PRKAG2 allele confirms PRKAG2 as a
      cause of the fatal infantile form and frames the phosphorylase kinase
      deficiency as apparent.
progression:
- phase: Fetal onset
  notes: >-
    Hypertrophy, bradycardia, pericardial effusion and in some cases hydrops
    are detected on fetal ultrasound, reported from 25 to 31 weeks of gestation
    in the R531Q cases tabulated in PMID:39569283 and at 28 weeks in the R531Q
    case of PMID:30430036.
  evidence:
  - reference: PMID:15877279
    reference_title: "Fatal congenital heart glycogenosis caused by a recurrent activating R531Q mutation in the gamma 2-subunit of AMP-activated protein kinase (PRKAG2), not by phosphorylase kinase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "recurrent heterozygous R531Q missense mutations in PRKAG2 give rise to a massive nonlysosomal cardiac glycogenosis of fetal symptomatic onset and rapidly fatal course"
    explanation: >-
      States the fetal symptomatic onset.
  - reference: PMID:39569283
    reference_title: "Severe Hypertrophic Cardiomyopathy Caused by a Protein Kinase Adenosine Monophosphate-Activated Non-catalytic Subunit Gamma 2 (PRKAG2) Mutation With Refractory Chylous Effusions in a Neonate: A Case Report and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Fetal ultrasonography performed at 25 weeks of gestation revealed biventricular hypertrophy, pericardial effusion, and bradycardia."
    explanation: >-
      Documents the prenatal presentation of an R531Q case at 25 weeks.
  - reference: PMID:30430036
    reference_title: "Infantile Onset Hypertrophic Cardiomyopathy Secondary to PRKAG2 Gene Mutation is Associated with Poor Prognosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The hypertrophy of the heart was noted as early as 28 weeks of gestation"
    explanation: >-
      Fetal echocardiography detected the hypertrophy of an R531Q case at 28
      weeks of gestation.
- phase: Death in early infancy
  notes: >-
    Reported R531Q carriers died between 21 days and 4 months of age, the R384T
    infant at 5 months; the historical phosphorylase-kinase-attributed infant in
    PMID:8236826 died at 47 days. Deaths are from cardiac failure, respiratory
    compromise, or intercurrent infection.
  evidence:
  - reference: PMID:39569283
    reference_title: "Severe Hypertrophic Cardiomyopathy Caused by a Protein Kinase Adenosine Monophosphate-Activated Non-catalytic Subunit Gamma 2 (PRKAG2) Mutation With Refractory Chylous Effusions in a Neonate: A Case Report and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Of these, five cases showed a heterozygous c.1592G>A (p.Arg531Gln) mutation in PRKAG2, and all of them died within several months of age."
    explanation: >-
      All previously reported R531Q cases died within months of birth.
  - reference: PMID:17667862
    reference_title: "Fatal infantile cardiac glycogenosis with phosphorylase kinase deficiency and a mutation in the gamma2-subunit of AMP-activated protein kinase."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A 10-wk-old infant girl with severe hypertrophy of the septal and atrial walls by cardiac ultrasound, developed progressive ventricular wall thickening and died of aspiration pneumonia at 5 mo of age."
    explanation: >-
      The R384T infant had progressive wall thickening and died at 5 months.
  - reference: PMID:30430036
    reference_title: "Infantile Onset Hypertrophic Cardiomyopathy Secondary to PRKAG2 Gene Mutation is Associated with Poor Prognosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Despite aggressive medical management, the infant developed progressively worsening respiratory failure, pulmonary edema, and hypotension. In spite of our aggressive resuscitative efforts, he suffered a cardiac arrest and eventually died at around 7 weeks of age."
    explanation: >-
      An R531Q infant died at about 7 weeks despite medical management, within
      the reported range for this form.
  - reference: PMID:10368461
    reference_title: "Infantile hypertrophic cardiomyopathy of glycogenosis type IX: isolated cardiac phosphorylase kinase deficiency."
    supports: SUPPORT
    directness: INDIRECT

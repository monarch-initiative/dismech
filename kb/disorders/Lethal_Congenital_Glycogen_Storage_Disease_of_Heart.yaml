    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "The disease phenotype was characterized by severe glycogenosis restricted to the heart muscle with secondary rapidly progressive hypertrophic cardiomyopathy causing death at the age of 47 days."
    explanation: >-
      Historical case under the superseded phosphorylase kinase attribution,
      without genotype, hence INDIRECT; death at 47 days from rapidly
      progressive storage cardiomyopathy.
pathophysiology:
- name: PRKAG2 p.Arg531Gln Variant in the Gamma-2 CBS Domain
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    A heterozygous p.Arg531Gln substitution in the cystathionine-beta-synthase
    (CBS) nucleotide-binding module of the AMPK gamma-2 subunit sharply reduces
    binding of the regulatory nucleotides AMP and ATP. The arginine-384
    substitutions of the N-terminal CBS domain have the same effect on
    nucleotide binding.
  gene:
    preferred_term: PRKAG2
    term:
      id: hgnc:9386
      label: PRKAG2
  molecular_functions:
  - preferred_term: AMP binding by the gamma-2 CBS domain
    term:
      id: GO:0016208
      label: AMP binding
    modifier: DECREASED
  cell_types:
  - preferred_term: Cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  evidence:
  - reference: PMID:15877279
    reference_title: "Fatal congenital heart glycogenosis caused by a recurrent activating R531Q mutation in the gamma 2-subunit of AMP-activated protein kinase (PRKAG2), not by phosphorylase kinase deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Biochemical characterization of the recombinant R531Q mutant protein showed >100-fold reduction of binding affinities for the regulatory nucleotides AMP and ATP"
    explanation: >-
      Recombinant-protein assay quantifying the loss of AMP and ATP binding.
  - reference: PMID:17667862
    reference_title: "Fatal infantile cardiac glycogenosis with phosphorylase kinase deficiency and a mutation in the gamma2-subunit of AMP-activated protein kinase."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Like R531Q, this mutation reduces the binding of AMP and ATP to the isolated nucleotide-binding domains, and prevents activation of the heterotrimer by metabolic stress in intact cells."
    explanation: >-
      R384T, a second lethal allele, reproduces the loss of nucleotide binding
      seen with R531Q in isolated nucleotide-binding domains.
  downstream:
  - target: Constitutive AMPK Activation Escaping Nucleotide Control
    causal_link_type: DIRECT
    description: >-
      Without nucleotide sensing, the heterotrimer's activity is uncoupled from
      the cellular energy charge and its basal activity rises.
    evidence:
    - reference: PMID:15877279
      reference_title: "Fatal congenital heart glycogenosis caused by a recurrent activating R531Q mutation in the gamma 2-subunit of AMP-activated protein kinase (PRKAG2), not by phosphorylase kinase deficiency."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "showed >100-fold reduction of binding affinities for the regulatory nucleotides AMP and ATP but an enhanced basal activity and increased phosphorylation of the alpha -subunit"
      explanation: >-
        The same recombinant protein shows both the binding loss and the gain
        in basal activity.
- name: Constitutive AMPK Activation Escaping Nucleotide Control
  biological_scale: MOLECULAR
  role: central_effector
  description: >-
    AMPK carrying the R531Q gamma-2 subunit shows enhanced basal activity and
    increased phosphorylation of the alpha catalytic subunit, so its activity
    no longer tracks the cellular energy charge. The defining study reports
    that the classic PRKAG2 alleles push in the same direction to a lesser
    degree. For R384T, loss of stress-induced activation was reported instead,
    so the activity change may not be uniform across lethal alleles.
  molecular_functions:
  - preferred_term: AMP-activated protein kinase activity
    term:
      id: GO:0004679
      label: AMP-activated protein kinase activity
    modifier: INCREASED
  cell_types:
  - preferred_term: Cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  evidence:
  - reference: PMID:15877279
    reference_title: "Fatal congenital heart glycogenosis caused by a recurrent activating R531Q mutation in the gamma 2-subunit of AMP-activated protein kinase (PRKAG2), not by phosphorylase kinase deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "R531Q and other PRKAG2 mutations enhance the basal activity and alpha -subunit phosphorylation of AMP-activated protein kinase"
    explanation: >-
      Direct biochemical demonstration that R531Q activates AMPK.
  downstream:
  - target: Massive Non-Lysosomal Cardiomyocyte Glycogen Accumulation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - >-
      Increased GLUT4 translocation and hexokinase activity raise myocardial
      glucose uptake.
    - >-
      Upregulated glycogen synthase converts the imported glucose into stored
      glycogen.
    evidence:
    - reference: PMID:11827995
      reference_title: "Constitutively active AMP kinase mutations cause glycogen storage disease mimicking hypertrophic cardiomyopathy."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: OTHER
      snippet: "Nonphysiologic activation of cardiac AMP kinase by these mutations should increase glucose uptake (by stimulating translocation of the glucose transporter GLUT-4 to the plasma membrane) and increase hexokinase activity, thereby leading to glycogen accumulation"
      explanation: >-
        States the glucose-uptake route from AMPK activation to glycogen
        accumulation. Written about other PRKAG2 alleles (Thr400Asn,
        Asn488Ile) and framed as an expectation, hence OTHER and INDIRECT for
        R531Q.
    - reference: PMID:20031621
      reference_title: "Distinct early signaling events resulting from the expression of the PRKAG2 R302Q mutant of AMPK contribute to increased myocardial glycogen."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: "acute expression of gamma(2)R302Q induces AMPK activation and upregulation of glycogen synthase and AS160, with an associated increase in glycogen content"
      explanation: >-
        In cultured cardiomyocytes, an activating PRKAG2 allele raises glycogen
        synthase and AS160 together with glycogen content. A different allele
        (R302Q), so INDIRECT for R531Q.
- name: Massive Non-Lysosomal Cardiomyocyte Glycogen Accumulation
  biological_scale: CELLULAR
  role: central_effector
  description: >-
    Cardiomyocytes fill with glycogen stored outside lysosomes, already
    symptomatic before birth. Storage is massive in the ventricular and atrial
    walls, greater than the moderate glycogenosis of the classic PRKAG2
    syndrome. Skeletal muscle may also show increased free glycogen.
  cell_types:
  - preferred_term: Cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: Glycogen biosynthetic process
    term:
      id: GO:0005978
      label: glycogen biosynthetic process
    modifier: INCREASED
  evidence:
  - reference: PMID:15877279
    reference_title: "Fatal congenital heart glycogenosis caused by a recurrent activating R531Q mutation in the gamma 2-subunit of AMP-activated protein kinase (PRKAG2), not by phosphorylase kinase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "recurrent heterozygous R531Q missense mutations in PRKAG2 give rise to a massive nonlysosomal cardiac glycogenosis of fetal symptomatic onset and rapidly fatal course"
    explanation: >-
      Establishes massive non-lysosomal cardiac glycogen storage as the
      lesion produced by R531Q.
  - reference: PMID:17667862
    reference_title: "Fatal infantile cardiac glycogenosis with phosphorylase kinase deficiency and a mutation in the gamma2-subunit of AMP-activated protein kinase."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A skeletal muscle biopsy showed increased free glycogen and decreased activity of phosphorylase b kinase (PHK)."
    explanation: >-
      In the R384T infant, free glycogen was also increased in skeletal
      muscle, together with the apparent phosphorylase kinase deficiency.

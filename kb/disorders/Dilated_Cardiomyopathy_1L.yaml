genetic:
- name: SGCD
  gene_term:
    preferred_term: SGCD
    term:
      id: hgnc:10807
      label: SGCD
  variant_origin: GERMLINE
  notes: >-
    relationship_type is left unset. ClinGen rates SGCD for MONDO:0011702 Limited, below
    the Definitive/Strong threshold that CAUSATIVE implies. The assertion (AD, Limited,
    2026-03-04) is for exactly MONDO:0011702 and matches the committed ClinGen ingest
    table. Reported heterozygous alleles: S151A
    (c.451T>G), contested by an independent family and a knock-in mouse; p.Lys238del
    (Tsubata's delta-K238, 710-712delAGA or 711-713delGAA), two sporadic children with
    unaffected parents and no functional data; R71T, one small Finnish family; and
    c.4-1G>A, reclassified likely pathogenic in a Dutch cardiomyopathy cohort, with no
    reported carrier phenotype or zygosity. A
    canonical splice variant would most likely act as loss of function, which sits
    uneasily with the proposed dominant-negative mechanism and with unaffected LGMD2F
    heterozygotes. A Chinese promoter-deletion plus p.Q283R haplotype associated with DCM
    risk is a susceptibility finding, not evidence for Mendelian CMD1L.
  gene_disease_validity:
  - validity_classification: LIMITED
    classified_by: CLINGEN
    external_id: CGGV:assertion_59326e1b-5cc1-4dfe-8d67-3379aa305c40-2026-03-04T170000.000Z
    evidence:
    - reference: CGGV:assertion_59326e1b-5cc1-4dfe-8d67-3379aa305c40-2026-03-04T170000.000Z
      reference_title: "SGCD / dilated cardiomyopathy 1L (Limited)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "SGCD | HGNC:10807 | dilated cardiomyopathy 1L | MONDO:0011702 | AD | Limited"
      explanation: >-
        ClinGen's Dilated Cardiomyopathy GCEP classifies the autosomal dominant
        SGCD-CMD1L relationship as Limited (2026-03-04).
  evidence:
  - reference: CGGV:assertion_59326e1b-5cc1-4dfe-8d67-3379aa305c40-2026-03-04T170000.000Z
    reference_title: "SGCD / dilated cardiomyopathy 1L (Limited)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "SGCD | HGNC:10807 | dilated cardiomyopathy 1L | MONDO:0011702 | AD | Limited"
    explanation: The current expert-panel classification of this gene-disease pair.
  - reference: PMID:10974018
    reference_title: "Mutations in the human delta-sarcoglycan gene in familial and sporadic dilated cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      In two patients, a 3-bp deletion (either 710–712delAGA or 711–713delGAA) of
      δ-sarcoglycan exon 9p was identified (Figure 3) that deletes a codon encoding the
      amino acid lysine at position 238 (ΔK238); screening 200 control individuals, as
      well as the phenotypically normal parents of these children, did not identify the
      same abnormality.
    explanation: The two sporadic carriers and the absence of the deletion in their parents.
  - reference: PMID:10974018
    reference_title: "Mutations in the human delta-sarcoglycan gene in familial and sporadic dilated cardiomyopathy."
    supports: NO_EVIDENCE
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      In one case, a 290G→A transition in exon 4, which changes the arginine at codon 97
      to glutamine (R97Q), was identified. This 290G→A transition was previously reported
      to be a polymorphism (45).
    explanation: >-
      The founding authors treated R97Q as a polymorphism. It is therefore not counted as
      a CMD1L allele, although Campbell et al. later tested it as a DCM mutant.
  - reference: PMID:14564412
    reference_title: "A novel mutation, Arg71Thr, in the delta-sarcoglycan gene is associated with dilated cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      We detected a novel mutation, Arg71Thr, in the delta-sarcoglycan gene in two members
      of a small DCM family.
    explanation: The R71T family.
  - reference: PMID:36270459
    reference_title: "SEPT-GD: A decision tree to prioritise potential RNA splice variants in cardiomyopathy genes for functional splicing assays in diagnostics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Based on all outcomes, the SGCD c.4-1G > A and CSRP3 c.282-5_285del variants were
      reclassified as likely pathogenic.
    explanation: >-
      A functionally tested splice variant, likely pathogenic in a cardiomyopathy
      diagnostic cohort; no carrier phenotype or zygosity is reported. The
      abstract does not specify the carrier's cardiomyopathy subtype.
  - reference: PMID:19259135
    reference_title: "Does delta-sarcoglycan-associated autosomal-dominant cardiomyopathy exist?"
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      This finding questions the pathological relevance of this sequence variant for
      causing familial autosomal-dominant dilated cardiomyopathy and thereby the role of
      the delta-sarcoglycan gene in general as a disease-causing gene for
      autosomal-dominant dilated cardiomyopathy.
    explanation: The principal published challenge to the gene-disease relationship.
  - reference: PMID:12794684
    reference_title: "Mutational analysis of the beta- and delta-sarcoglycan genes in a large number of patients with familial and sporadic dilated cardiomyopathy."
    supports: NO_EVIDENCE
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      New polymorphisms, as well as already described ones, were found in these two genes,
      but none appeared to be responsible for dilated cardiomyopathy.
    explanation: >-
      A negative screen of 99 DCM patients. It shows that causal SGCD variants are rare in
      DCM, not that heterozygous SGCD variants cannot cause it, so it neither supports nor
      refutes the gene-disease relationship.
  - reference: PMID:26720722
    reference_title: "A Haplotype of Two Novel Polymorphisms in δ-Sarcoglycan Gene Increases Risk of Dilated Cardiomyopathy in Mongoloid Population."
    supports: NO_EVIDENCE
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      Haplotype -_G consisting c.-100~-110 and A848G was associated with increased risk of
      DCM (OR = 17.27; 95%CI = 3.19-93.56; p = 0.001) but not associated with HCM
    explanation: >-
      A single association study of common SGCD polymorphisms. It concerns susceptibility
      and provides no evidence for or against Mendelian CMD1L.

    snippet: >-
      Therefore carriers of the Arg71Thr mutation had a relatively mild phenotype and a
      late onset of the disease.
    explanation: Variable expressivity across alleles or families.
diagnosis:
- name: Cardiac and neuromuscular clinical evaluation
  description: >-
    The founding study evaluated patients by examination focused on the cardiac and
    neuromuscular systems, ECG, chest radiography and echocardiography, with
    catheterization and endomyocardial biopsy where clinically indicated. A normal
    neuromuscular examination and the absence of skeletal myopathy separate CMD1L from
    LGMD2F. CK may still be mildly elevated, as in one patient.
  evidence:
  - reference: PMID:10974018
    reference_title: "Mutations in the human delta-sarcoglycan gene in familial and sporadic dilated cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      All patients were evaluated by physical examination (particularly focused in the
      cardiac and neuromuscular systems), chest radiography, electrocardiography, and
      echocardiography.
    explanation: The clinical workup used in the founding cohort.
  - reference: PMID:10974018
    reference_title: "Mutations in the human delta-sarcoglycan gene in familial and sporadic dilated cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: No skeletal muscle disease occurred in any of these patients.
    explanation: Absence of skeletal myopathy is part of the definition of this isolated DCM.
- name: Genetic testing and variant interpretation
  description: >-
    SGCD may appear on DCM multigene panels. Because gene-disease validity is Limited,
    and the founding allele did not cause disease in an independent family, a heterozygous
    SGCD variant should not on its own be taken as diagnostic. Functional splicing assays
    can resolve candidate splice variants.
  evidence:
  - reference: CGGV:assertion_59326e1b-5cc1-4dfe-8d67-3379aa305c40-2026-03-04T170000.000Z
    reference_title: "SGCD / dilated cardiomyopathy 1L (Limited)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "SGCD | HGNC:10807 | dilated cardiomyopathy 1L | MONDO:0011702 | AD | Limited"
    explanation: The Limited classification governs how a heterozygous SGCD finding is interpreted.
  - reference: PMID:36270459
    reference_title: "SEPT-GD: A decision tree to prioritise potential RNA splice variants in cardiomyopathy genes for functional splicing assays in diagnostics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Based on all outcomes, the SGCD c.4-1G > A and CSRP3 c.282-5_285del variants were
      reclassified as likely pathogenic.
    explanation: A minigene assay used to reclassify an SGCD splice variant in diagnostics.
- name: Myocardial delta-sarcoglycan immunostaining
  description: >-
    A research test. In the one explant examined, delta-sarcoglycan staining was reduced
    while the other sarcoglycans and dystrophin were preserved. It is not validated as a
    diagnostic test.
  evidence:
  - reference: PMID:10974018
    reference_title: "Mutations in the human delta-sarcoglycan gene in familial and sporadic dilated cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      the staining for δ-sarcoglycan was significantly reduced in the patient with the
      ΔK238 mutation (Figure 4).
    explanation: The single tissue observation.
differential_diagnoses:
- name: Autosomal recessive limb-girdle muscular dystrophy type 2F (LGMD R6)
  description: >-
    Biallelic SGCD variants cause recessive LGMD with elevated CK and proximal
    weakness. Cardiac involvement varies. The CMD1L patients had no skeletal muscle
    disease, and the two conditions are curated separately (see Sarcoglycanopathy).
  disease_term:
    preferred_term: autosomal recessive limb-girdle muscular dystrophy type 2F
    term:
      id: MONDO:0011028
      label: autosomal recessive limb-girdle muscular dystrophy type 2F
  evidence:
  - reference: PMID:19259135
    reference_title: "Does delta-sarcoglycan-associated autosomal-dominant cardiomyopathy exist?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      We identified a novel missense mutation in exon 6 (p.A131P) of the delta-sarcoglycan
      gene, which in a homozygous state leads to the clinical picture of a limb girdle
      muscular dystrophy.
    explanation: The allelic recessive disorder.
  - reference: PMID:10974018
    reference_title: "Mutations in the human delta-sarcoglycan gene in familial and sporadic dilated cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    quote_role: BACKGROUND
    snippet: Thus, LGMD associated with sarcoglycan mutations appears to be inherited as a recessive disease.
    explanation: The founding authors contrast recessive LGMD with the proposed dominant DCM.
- name: Other sarcoglycanopathies (LGMD R3-R5)
  description: >-
    Alpha-, beta- and gamma-sarcoglycan deficiencies also cause recessive LGMD with
    possible cardiomyopathy. Skeletal myopathy and elevated CK point to these rather
    than isolated DCM.
  disease_term:
    preferred_term: sarcoglycanopathy
    term:
      id: MONDO:0016140
      label: sarcoglycanopathy
  evidence:
  - reference: PMID:19259135
    reference_title: "Does delta-sarcoglycan-associated autosomal-dominant cardiomyopathy exist?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    quote_role: BACKGROUND
    snippet: >-
      Patients with LGMD2C-F, in particular with β-sarcoglycan-deficient LGMD2E and
      δ-sarcoglycan-deficient LGMD2F, often develop a progressive and potentially fatal
      dilated cardiomyopathy (DCM) in association with muscular dystrophy.
    explanation: Cardiomyopathy in the recessive sarcoglycanopathies, which also have muscular dystrophy.
- name: Other genetic and acquired causes of dilated cardiomyopathy
  description: >-
    Most DCM has other genetic or acquired causes, including myocarditis, which was found
    on biopsy in part of the founding sporadic series. SGCD accounts for under 1% of
    idiopathic DCM.
  disease_term:
    preferred_term: dilated cardiomyopathy
    term:
      id: MONDO:0005021
      label: dilated cardiomyopathy
  evidence:
  - reference: PMID:12794684
    reference_title: "Mutational analysis of the beta- and delta-sarcoglycan genes in a large number of patients with familial and sporadic dilated cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      we could estimate the prevalence of delta-sarcoglycan gene mutations to be less
      than 1% in idiopathic dilated cardiomyopathy, demonstrating that this gene is only
      marginally implicated in the disease.
    explanation: Most idiopathic DCM is due to other causes.
treatments:
- name: Guideline-directed heart failure pharmacotherapy
  description: >-
    Standard therapy for heart failure with reduced ejection fraction.
  therapeutic_modality: SMALL_MOLECULE
  notes: >-
    No CMD1L- or SGCD-specific treatment data exist. This is generic DCM care, and no
    evidence item is attached.
  target_mechanisms:
  - target: Congestive Heart Failure
    description: Supportive. It does not address the SGCD lesion.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
- name: Implantable cardioverter-defibrillator
  description: >-
    Considered for sudden-death prevention under general DCM criteria.
  therapeutic_modality: DEVICE
  notes: >-
    No CMD1L-specific evidence exists. Sudden deaths in the founding family make the
    question relevant, but no source evaluates ICD use in SGCD carriers.
  target_mechanisms:
  - target: Sudden Cardiac Death
    description: Supportive. It addresses arrhythmic death only.
  treatment_term:
    preferred_term: Implantable Cardioverter-Defibrillator Placement
    term:
      id: NCIT:C80435
      label: Implantable Cardioverter-Defibrillator Placement
- name: Heart transplantation
  description: >-
    Performed for end-stage disease in the founding family.
  therapeutic_modality: SURGERY
  target_mechanisms:
  - target: Congestive Heart Failure
    description: Replaces the failing heart.
  treatment_term:
    preferred_term: Heart Transplantation
    term:
      id: NCIT:C15246
      label: Heart Transplantation
  evidence:
  - reference: PMID:10974018
    reference_title: "Mutations in the human delta-sarcoglycan gene in familial and sporadic dilated cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: Cardiac transplantation was necessary in the 21-year-old son (III:7) of the proband (II:5) as seen in the pedigree (Figure 1).
    explanation: Transplantation in a CMD1L patient. This is a case report, not an outcome study.
- name: Genetic counseling
  description: >-
    Counseling should convey that the SGCD-DCM relationship is Limited and contested.
  therapeutic_modality: BEHAVIORAL
  notes: >-
    No CMD1L-specific counseling studies exist. The evidence item supports only the
    uncertainty that counseling must convey.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: CGGV:assertion_59326e1b-5cc1-4dfe-8d67-3379aa305c40-2026-03-04T170000.000Z
    reference_title: "SGCD / dilated cardiomyopathy 1L (Limited)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "SGCD | HGNC:10807 | dilated cardiomyopathy 1L | MONDO:0011702 | AD | Limited"
    explanation: Limited validity is the central fact counseling must communicate.
- name: AAV delta-sarcoglycan gene transfer (preclinical, null models only)
  description: >-
    AAV delivery of wild-type delta-sarcoglycan rescues cardiomyopathy in Sgcd-null mice
    and TO-2 hamsters.
  therapeutic_modality: GENE_THERAPY
  notes: >-
    Preclinical only, and only in complete-loss models. Gene replacement has not been
    tested against a heterozygous dominant-negative allele, and it has not been used in
    humans with CMD1L.
  target_mechanisms:
  - target: Strain-Induced Cardiomyocyte Sarcolemmal Fragility
    description: Restores sarcolemmal integrity in null hamsters.
  treatment_term:
    preferred_term: Gene Therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  evidence:
  - reference: PMID:19218289
    reference_title: "Prevention of cardiomyopathy in delta-sarcoglycan knockout mice after systemic transfer of targeted adeno-associated viral vectors."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: >-
      Left ventricular function remained stable in mice expressing Sgcd while it
      deteriorated in EGFP controls within 6 months, paralleled by increased expression of
      brain natriuretic peptide, a molecular marker of heart failure.
    explanation: Rescue of a knockout mouse, which is not the human heterozygous genotype.
  - reference: PMID:11805334
    reference_title: "Rescue of hereditary form of dilated cardiomyopathy by rAAV-mediated somatic gene therapy: amelioration of morphological findings, sarcolemmal permeability, cardiac performances, and the prognosis of TO-2 hamsters."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: >-
      The transgene preserved sarcolemmal permeability detected in situ by mutual
      exclusivity between cardiomyocytes taking up intravenously administered Evans blue
      dye and expressing the delta-SG transgene throughout life.
    explanation: Rescue of sarcolemmal permeability in null TO-2 hamsters.
animal_models:
- name: Sgcd-null mouse
  species: Mus musculus
  genotype: Sgcd homozygous knockout
  publication: PMID:10481911
  description: >-
    Complete delta-sarcoglycan loss causes cardiomyopathy with focal necrosis and
    muscular dystrophy, together with vascular smooth muscle sarcoglycan loss and
    coronary irregularities. It models the recessive null state, not a heterozygous
    dominant allele.
  modeled_mechanisms:
  - target: Cardiomyocyte Degeneration
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    description: Myocardial necrosis develops without delta-sarcoglycan.
    limitations: >-
      This is a complete-loss genotype with skeletal muscle disease. The human CMD1L
      genotype is heterozygous without myopathy, so the model shows what loss of the
      protein can do, not what a heterozygous variant does. Necrosis in this mouse is
      driven at least partly by coronary vascular smooth muscle dysfunction, which a
      vasodilator prevents; CMD1L patients had normal coronary arteries and no ischemia.
    divergences:
    - divergence_type: CAUSE_UNREPRESENTED
      materiality: QUALIFYING
      description: The heterozygous missense or in-frame lesion of CMD1L is not encoded. Both alleles are null.
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: Mouse myocardium.
    - divergence_type: POPULATION_MISMATCH
      materiality: QUALIFYING
      description: >-
        The null mouse's vascular route to necrosis belongs to the recessive state;
        patients with heterozygous variants showed normal coronaries and no ischemia.
    evidence:
    - reference: PMID:10481911
      reference_title: "Disruption of the sarcoglycan-sarcospan complex in vascular smooth muscle: a novel mechanism for cardiomyopathy and muscular dystrophy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      snippet: >-
        We found that only Sgcd null mice developed cardiomyopathy with focal areas of
        necrosis as the histological hallmark in cardiac and skeletal muscle.
      explanation: Necrotic cardiomyopathy in the null mouse.
- name: Cardiomyopathic Syrian hamster (BIO14.6 and TO-2)
  species: Mesocricetus auratus
  genotype: Homozygous Sgcd deletion of exon 1 and the promoter (natural null)
  publication: PMID:9391120
  description: >-
    Inbred hypertrophic (BIO14.6) and dilated (TO-2) sublines share a deletion that
    abolishes delta-sarcoglycan. Cardiomyopathy and muscular dystrophy are inherited as
    an autosomal recessive trait. AAV delta-sarcoglycan restores sarcolemmal integrity
    and prolongs survival in TO-2.
  modeled_mechanisms:
  - target: Strain-Induced Cardiomyocyte Sarcolemmal Fragility
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: CELLULAR
    description: >-
      Cardiomyocytes take up Evans blue dye, a sign of sarcolemmal permeability, which
      gene transfer prevents.
    limitations: >-
      This is a recessive null. Membrane leak here reflects absent protein, not
      dominant-negative interference by a co-expressed mutant.
    divergences:
    - divergence_type: CAUSE_UNREPRESENTED
      materiality: QUALIFYING
      description: No heterozygous or missense allele. Both alleles lack delta-sarcoglycan.
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: Hamster myocardium.
    evidence:
    - reference: PMID:11805334
      reference_title: "Rescue of hereditary form of dilated cardiomyopathy by rAAV-mediated somatic gene therapy: amelioration of morphological findings, sarcolemmal permeability, cardiac performances, and the prognosis of TO-2 hamsters."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      snippet: >-
        The transgene preserved sarcolemmal permeability detected in situ by mutual
        exclusivity between cardiomyocytes taking up intravenously administered Evans
        blue dye and expressing the delta-SG transgene throughout life.
      explanation: Sarcolemmal permeability in untreated TO-2 cardiomyocytes, reversed by the transgene.
  - target: Left Ventricular Dilatation and Systolic Dysfunction
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    description: The TO-2 subline develops DCM, while BIO14.6 develops HCM from the same deletion.
    limitations: >-
      A recessive null with muscular dystrophy. One deletion yields either HCM or DCM
      depending on subline.
    divergences:
    - divergence_type: CAUSE_UNREPRESENTED
      materiality: QUALIFYING
      description: Complete loss rather than a heterozygous variant.
    evidence:
    - reference: PMID:9391120
      reference_title: "Both hypertrophic and dilated cardiomyopathies are caused by mutation of the same gene, delta-sarcoglycan, in hamster: an animal model of disrupted dystrophin-associated glycoprotein complex."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      snippet: >-
        This deletion included the major transcription initiation site, resulting in a
        deficiency of delta-SG transcripts with the consequent loss of delta-SG protein in
        all the CM hamsters
      explanation: Establishes the hamster as a complete-loss model.
    - reference: PMID:9391120
      reference_title: "Both hypertrophic and dilated cardiomyopathies are caused by mutation of the same gene, delta-sarcoglycan, in hamster: an animal model of disrupted dystrophin-associated glycoprotein complex."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      snippet: >-
        Syrian hamsters with CM are known to inherit both CM and muscular dystrophy as an
        autosomal recessive trait
      explanation: Recessive inheritance with skeletal disease, unlike CMD1L.
- name: Cardiac S151A delta-sarcoglycan transgenic mouse
  species: Mus musculus
  genotype: alpha-MHC promoter-driven S151A delta-sarcoglycan transgene on a wild-type background
  publication: PMID:17164264
  description: >-
    Cardiac overexpression of the founding human allele produces young-onset DCM with
    increased lethality, nuclear retention of delta-sarcoglycan, and mislocalized lamin
    A/C and emerin.
  modeled_mechanisms:
  - target: Nuclear Sequestration of Delta-Sarcoglycan with Lamin A/C Mislocalization
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: CELLULAR
    description: Nuclear sequestration of the mutant and its partner sarcoglycans.
    limitations: >-
      Up to sevenfold overexpression (per Bauer et al.). The phenotype may reflect dosage
      rather than the variant, and a native-dosage knock-in was mild.
    divergences:
    - divergence_type: CONTESTED_ASSUMPTION
      materiality: QUALIFYING
      description: >-
        The model assumes that overexpressed mutant protein reflects the heterozygous
        state. Independent family and knock-in data dispute this.
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: Mouse cardiomyocytes.
    evidence:
    - reference: PMID:17164264
      reference_title: "Nuclear sequestration of delta-sarcoglycan disrupts the nuclear localization of lamin A/C and emerin in cardiomyocytes."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      snippet: >-
        Instead of placement at the plasma membrane, delta-sarcoglycan was found in the
        nucleus of S151A delta-sarcoglycan cardiomyocytes. Retention of delta-sarcoglycan
        in the nucleus was accompanied by partial nuclear sequestration of beta- and
        gamma-sarcoglycan.
      explanation: The mechanism observed in this transgenic line.
  - target: Left Ventricular Dilatation and Systolic Dysfunction
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    description: The transgenic mice develop DCM.
    limitations: The same overexpression caveat applies.
    divergences:
    - divergence_type: CONTESTED_ASSUMPTION
      materiality: QUALIFYING
      description: Overexpression rather than a heterozygous allele at native dosage.
    evidence:
    - reference: PMID:17164264
      reference_title: "Nuclear sequestration of delta-sarcoglycan disrupts the nuclear localization of lamin A/C and emerin in cardiomyocytes."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      snippet: >-
        Similar to the human delta-sarcoglycan gene mutation, S151A delta-sarcoglycan

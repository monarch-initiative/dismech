    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    snippet: >-
      Its mRNA expression is abundant in striated and smooth muscles, with a main 8 kb
      transcript, encoding a predicted basic transmembrane glycoprotein of 290 amino
      acids.
    explanation: >-
      The gene-identification paper's own expression result: SGCD mRNA is abundant in
      striated and smooth muscle and encodes a transmembrane glycoprotein.
  - reference: PMID:9391120
    reference_title: "Both hypertrophic and dilated cardiomyopathies are caused by mutation of the same gene, delta-sarcoglycan, in hamster: an animal model of disrupted dystrophin-associated glycoprotein complex."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    snippet: >-
      We elucidated the molecular interaction of dystrophin-associated glycoproteins
      including delta-SG, by using an in vitro pull-down study and ligand overlay assay,
      which indicates the functional role of delta-SG in stabilizing sarcolemma.
    explanation: >-
      Supports the structural, sarcolemma-stabilizing molecular function bound on this
      node. The assay is in vitro and does not involve a human variant.
  - reference: PMID:19259135
    reference_title: "Does delta-sarcoglycan-associated autosomal-dominant cardiomyopathy exist?"
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Our findings demonstrate that, even in the presence of a second disease-causing
      mutation, the p.S151A mutation in the delta-sarcoglycan gene does not result in
      cardiomyopathy.
    explanation: Independent family evidence against the founding allele being causal.
  downstream:
  - target: Dominant-Negative Disturbance of the Sarcoglycan Complex
    causal_link_type: DIRECT
    description: >-
      Mutant delta-sarcoglycan, co-expressed with the wild-type protein, is proposed to
      interfere with sarcoglycan complex function. This is shown only where the mutant is
      overexpressed.
    evidence:
    - reference: PMID:26968544
      reference_title: "Dilated cardiomyopathy mutations in δ-sarcoglycan exert a dominant-negative effect on cardiac myocyte mechanical stability."
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: INDIRECT
      snippet: >-
        These studies demonstrate that DCM mutations in δ-sarcoglycan can exert a dominant
        negative effect on dystrophin-glycoprotein complex function leading to myocardial
        mechanical instability that may underlie the pathogenesis of
        δ-sarcoglycan-associated DCM.
      explanation: >-
        Adenoviral expression of R97Q or R71T in adult rat cardiomyocytes. The
        dominant-negative inference applies to the human heterozygous state only by
        extrapolation.
    - reference: PMID:17164264
      reference_title: "Nuclear sequestration of delta-sarcoglycan disrupts the nuclear localization of lamin A/C and emerin in cardiomyocytes."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: >-
        Therefore, the S151A delta-sarcoglycan gene mutation acts in a dominant negative
        manner to produce trafficking defects that disrupt nuclear localization of lamin
        A/C and emerin, thus linking together two common mechanisms of inherited
        cardiomyopathy.
      explanation: >-
        Conclusion drawn from transgenic mice overexpressing S151A from the alpha-MHC
        promoter, not from a heterozygous allele at its native dosage.
- name: Dominant-Negative Disturbance of the Sarcoglycan Complex
  biological_scale: MOLECULAR
  role: central_effector
  mechanism_confidence: HYPOTHETICAL
  description: >-
    The proposed molecular effect is interference by the mutant protein with the
    sarcoglycan-sarcospan subcomplex of the dystrophin-glycoprotein complex. The two
    experimental systems disagree on how this happens. In rat cardiomyocytes, R97Q and
    R71T traffic normally and the complex assembles, but the membrane is fragile under
    strain. In transgenic mice, S151A is retained in the nucleus and sequesters beta- and
    gamma-sarcoglycan. Both systems overexpress the mutant, and R97Q was called a
    polymorphism in the founding report. In the one p.Lys238del explant, delta-sarcoglycan
    staining was reduced while alpha-, beta-, gamma-sarcoglycan and dystrophin staining
    was preserved.
  protein_complexes:
  - preferred_term: sarcoglycan complex
    term:
      id: GO:0016012
      label: sarcoglycan complex
  - preferred_term: dystrophin-associated glycoprotein complex
    term:
      id: GO:0016010
      label: dystrophin-associated glycoprotein complex

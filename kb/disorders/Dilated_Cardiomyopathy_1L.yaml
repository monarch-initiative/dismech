discussions:
- discussion_id: cmd1l_does_sgcd_dominant_dcm_exist
  kind: CONTROVERSY
  status: OPEN
  prompt: >-
    Do heterozygous SGCD variants cause Mendelian autosomal dominant DCM, or were the
    founding observations chance co-occurrences of rare variants with DCM?
  attaches_to:
  - pathophysiology#Heterozygous SGCD Variant
  rationale: >-
    Support comes from one three-carrier family, two apparently de novo sporadic
    children, one small Finnish family, and one splice variant of unreported phenotype.
    Against it are seven S151A carriers aged 3-64 years in an LGMD2F family who showed
    no clinical signs of cardiomyopathy, with normal ECG and echocardiography in the four
    compound heterozygotes (the others had clinical examination only); negative screens of 99 and 52 DCM patients, and a
    mild knock-in mouse. ClinGen rates the relationship Limited.
  evidence:
  - reference: PMID:19259135
    reference_title: "Does delta-sarcoglycan-associated autosomal-dominant cardiomyopathy exist?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Comprehensive clinical and cardiac investigation in all of the compound heterozygous
      family members revealed no signs of cardiomyopathy or limb girdle muscular
      dystrophy.
    explanation: The central counter-observation behind the controversy.
  - reference: PMID:19259135
    reference_title: "Does delta-sarcoglycan-associated autosomal-dominant cardiomyopathy exist?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Even the oldest family member carrying the mutation (pedigree no. II:4; 64 years
      old) did not show any clinical signs of DCM.
    explanation: Absence of disease at an age when DCM would be expected.
  - reference: PMID:23695275
    reference_title: "S151A δ-sarcoglycan mutation causes a mild phenotype of cardiomyopathy in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: >-
      So far, the role of mutations in the δ-sarcogylcan (Sgcd) gene in causing autosomal
      dominant dilated cardiomyopathy (DCM) remains inconclusive.
    explanation: A later model study that also calls the question open.
  - reference: PMID:19259135
    reference_title: "Does delta-sarcoglycan-associated autosomal-dominant cardiomyopathy exist?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The other sequence variant (ΔK238) in the SGCD gene described by Tsubata et al was
      found in two patients with sporadic DCM but in the absence of clear functional data
      and cosegregation with the phenotype in an autosomal-dominant manner no final
      conclusion can be drawn.
    explanation: The sporadic cases are also unresolved.
  proposed_experiments:
  - experiment_id: exp_cmd1l_case_control_burden
    name: SGCD rare-variant burden in large DCM case-control data
    description: >-
      Compare the burden of rare SGCD missense, in-frame and splice variants in DCM
      probands against population controls, stratified by variant class and protein
      domain. Collect cardiac phenotypes from heterozygous parents of LGMD2F patients as
      an internal penetrance check.
- discussion_id: cmd1l_null_models_vs_heterozygous_disease
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    How informative are complete-loss and overexpression models for a disease attributed
    to one heterozygous SGCD allele?
  attaches_to:
  - pathophysiology#Cardiomyocyte Degeneration
  - pathophysiology#Nuclear Sequestration of Delta-Sarcoglycan with Lamin A/C Mislocalization
  rationale: >-
    The hamster, Sgcd-null mouse and SGCD-knockout pig are recessive nulls with skeletal
    myopathy, modeling LGMD R6 biology. The S151A transgenic mouse and fly overexpress
    the mutant, while the genotype-matched knock-in mouse shows only mild, subclinical
    change. The vascular mechanism of the null mouse is contradicted by normal coronaries
    in patients.
  evidence:
  - reference: PMID:19259135
    reference_title: "Does delta-sarcoglycan-associated autosomal-dominant cardiomyopathy exist?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Heydemann et al found up to sevenfold overexpression of the S151A sequence variant
      in hearts of their mice, which may suggest that rather the overall level of gene
      expression than the expression of the sequence variant has been responsible for
      the pathology in mice.
    explanation: The dosage caveat for the transgenic evidence.
  - reference: PMID:23695275
    reference_title: "S151A δ-sarcoglycan mutation causes a mild phenotype of cardiomyopathy in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: Heterozygous S151A knock-in mice developed a rather mild phenotype of cardiomyopathy.
    explanation: The genotype-matched model diverges from the severe human founding family.
  - reference: PMID:10974018
    reference_title: "Mutations in the human delta-sarcoglycan gene in familial and sporadic dilated cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Coronary angiography and echocardiography (transthoracic and in some cases
      transesophageal) identified normal coronary arteries in all patients with
      δ-sarcoglycan mutations, and no evidence of ischemia was found in the myocardium.
    explanation: The human finding that contradicts the null-mouse vascular route.
  - reference: PMID:10481911
    reference_title: "Disruption of the sarcoglycan-sarcospan complex in vascular smooth muscle: a novel mechanism for cardiomyopathy and muscular dystrophy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: >-
      Our data indicate that disruption of the SG-SSPN complex in vascular smooth muscle
      perturbs vascular function, which initiates cardiomyopathy and exacerbates
      muscular dystrophy.
    explanation: >-
      In the null mouse, cardiomyopathy starts from vascular smooth muscle sarcoglycan
      loss, a mechanism not seen in CMD1L patients.
  proposed_experiments:
  - experiment_id: exp_cmd1l_isogenic_ipsc_cardiomyocytes
    name: Isogenic heterozygous SGCD variants in human iPSC cardiomyocytes
    description: >-
      Introduce S151A, p.Lys238del, R71T and a null allele heterozygously into one
      control iPSC line. Measure sarcoglycan localization, membrane permeability under
      cyclic stretch, and nuclear lamin A/C distribution against isogenic wild-type and
      heterozygous-null controls. This would separate a dominant-negative effect from
      haploinsufficiency and from overexpression artifacts.
- discussion_id: cmd1l_dominant_negative_vs_haploinsufficiency
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    If heterozygous SGCD variants cause DCM, by what molecular mechanism, given that
    LGMD2F heterozygous carriers are not known to be affected?
  attaches_to:
  - pathophysiology#Dominant-Negative Disturbance of the Sarcoglycan Complex
  rationale: >-
    A dominant-negative effect is proposed because heterozygous null carriers in LGMD2F
    families are not described as affected. The two overexpression systems disagree on
    the mechanism: normal trafficking with fragile membranes in one, nuclear
    sequestration in the other. A functionally confirmed canonical splice variant
    (c.4-1G>A), reclassified likely pathogenic in a cardiomyopathy cohort, is a likely
    loss-of-function allele. If it is causal, a dominant-negative-only mechanism does
    not explain it; its carrier's phenotype is not reported. A native-dosage S151A
    knock-in showed an intact sarcolemma, and S151A rescued Sgcd-null hearts. Systematic cardiac data on heterozygous LGMD2F relatives
    are lacking.
  evidence:
  - reference: PMID:10974018
    reference_title: "Mutations in the human delta-sarcoglycan gene in familial and sporadic dilated cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      Although heterozygotes within LGMD2F families have not been described to be
      affected, it is possible that cardiac evaluation overlooked cardiac pathology or the
      cardiac dysfunction had not become apparent at the time of evaluation
    explanation: The founding authors acknowledge the missing heterozygote cardiac data.
  - reference: PMID:26968544
    reference_title: "Dilated cardiomyopathy mutations in δ-sarcoglycan exert a dominant-negative effect on cardiac myocyte mechanical stability."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: >-
      This study demonstrates that DCM mutant δ-sarcoglycans can be stably expressed in
      adult rat cardiac myocytes and traffic similarly to wild-type δ-sarcoglycan to the
      plasma membrane, without perturbing assembly of the dystrophin-glycoprotein complex.
    explanation: This system shows normal trafficking, unlike the nuclear retention seen in transgenic mice.
  - reference: PMID:36270459
    reference_title: "SEPT-GD: A decision tree to prioritise potential RNA splice variants in cardiomyopathy genes for functional splicing assays in diagnostics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      Based on all outcomes, the SGCD c.4-1G > A and CSRP3 c.282-5_285del variants were
      reclassified as likely pathogenic.
    explanation: >-
      A likely loss-of-function SGCD allele classified likely pathogenic in a
      cardiomyopathy cohort; the carrier's phenotype and zygosity are not reported.

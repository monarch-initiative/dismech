      explanation: >-
        In delta-sarcoglycan-null TO-2 hamsters, rescuing membrane integrity improves
        myocardial structure. This links the two nodes in a recessive null model only.
- name: Nuclear Sequestration of Delta-Sarcoglycan with Lamin A/C Mislocalization
  biological_scale: CELLULAR

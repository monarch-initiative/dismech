      explanation: The DCM phenotype of the transgenic line.
- name: Heterozygous S151A knock-in mouse
  species: Mus musculus
  genotype: Sgcd S151A/+ knock-in
  publication: PMID:23695275
  description: >-
    The founding allele at native dosage gave only increased heart-to-body weight at one
    year, with preserved echocardiographic function and no histopathology. Crossing

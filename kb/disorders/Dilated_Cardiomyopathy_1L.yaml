name: Dilated Cardiomyopathy 1L
creation_date: "2026-10-08T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: dilated cardiomyopathy 1L
  term:
    id: MONDO:0011702
    label: dilated cardiomyopathy 1L
synonyms:
- CMD1L
- cardiomyopathy, dilated, 1L
- cardiomyopathy, dilated, type 1L
- dilated cardiomyopathy type 1L
- SGCD familial isolated dilated cardiomyopathy
- familial isolated dilated cardiomyopathy caused by mutation in SGCD
description: >-
  Dilated cardiomyopathy 1L (CMD1L) is the proposed autosomal dominant, isolated
  dilated cardiomyopathy attributed to heterozygous variants in SGCD, which encodes
  delta-sarcoglycan, a transmembrane glycoprotein of the sarcoglycan subcomplex of
  the dystrophin-glycoprotein complex. The entity rests on one 2000 report: a
  heterozygous S151A missense variant in three affected relatives of one family with
  young-onset heart failure, transplantation and sudden death, and an in-frame
  deletion of lysine 238 in two sporadic pediatric patients, none with skeletal
  muscle disease. A small Finnish family carried R71T with a mild, late-onset course.
  The association is weak and contested. Cohort screens found SGCD variants to be a
  marginal cause of DCM. In a large family with recessive LGMD2F, S151A carriers,
  including compound heterozygotes, showed no clinical signs of cardiomyopathy, and
  echocardiography was normal in the four compound heterozygotes. A heterozygous S151A knock-in
  mouse showed only a mild, subclinical phenotype. ClinGen rates SGCD for this disease
  Limited (autosomal dominant). A dominant-negative mechanism has been proposed from
  overexpression studies in rat cardiomyocytes, transgenic mice and flies. The strong
  animal phenotypes (BIO14.6 and TO-2 hamsters, Sgcd-null mice, SGCD-knockout pigs)
  are complete-loss models of the separate recessive disorder. Biallelic SGCD loss
  causes limb-girdle muscular dystrophy R6 (LGMD2F), curated under Sarcoglycanopathy.
parents:
- Dilated Cardiomyopathy
- Genetic Disorder
classifications:
  harrisons_chapter:
  - classification_value: CARDIOVASCULAR
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
notes: >-
  Scope. This entry covers only the proposed heterozygous (autosomal dominant) isolated
  DCM. Recessive LGMD R6 / LGMD2F (MONDO:0011028) is curated in Sarcoglycanopathy and
  Autosomal Recessive Limb-Girdle Muscular Dystrophy, and its cardiac findings are not
  cited here as CMD1L facts.

  Case count, from the cached sources. Tsubata et al. (PMID:10974018) reported one
  family (FDCM no. 1100) in which three affected individuals carried S151A by SSCP,
  while the unaffected relatives tested did not. The text does not say how many
  relatives were tested by SSCP. CK was measured in five unaffected relatives (II:2,
  II:3, III:3, III:4 and III:5), all normal. Two of 50 sporadic pediatric DCM patients carried the
  in-frame deletion of lysine 238 (p.Lys238del), which was absent from their
  phenotypically normal parents and from 200 controls. That pattern suggests de novo
  occurrence, although parentage was not reported as confirmed. A third sporadic
  patient's R97Q was called a polymorphism by the authors. A fourth abnormal conformer,
  an intron 4 T>A change 38 nucleotides from the exon 5 boundary, was also found in 1 of
  200 controls and was judged a likely polymorphism. Bauer et al.
  (PMID:19259135) summarize the S151A family as two sudden deaths (ages 17-37 years)
  and one transplantation at 21 years. The Finnish screen (PMID:14564412) found one
  small family with two R71T carriers, one meeting DCM criteria and one with slight
  LV dilatation. A Dutch diagnostic cohort (PMID:36270459) reclassified SGCD
  c.4-1G>A as likely pathogenic after a minigene assay. The abstract does not report
  the carrier's phenotype, cardiomyopathy subtype, zygosity or the number of carriers,
  so this carrier is not counted among patients with DCM.

  ClinGen's Dilated Cardiomyopathy GCEP classification is Limited (2026-03-04,
  CGGV:assertion_59326e1b-5cc1-4dfe-8d67-3379aa305c40-2026-03-04T170000.000Z),
  autosomal dominant, for exactly MONDO:0011702. It matches the committed ClinGen
  ingest table (kb/genes/ingest/clingen_gene_validity.tsv). An earlier version of the
  same assertion in the committed cache/clingen/gene_validity.csv, dated 2025-03-28,
  classified SGCD as No Known Disease Relationship for the umbrella term dilated
  cardiomyopathy (MONDO:0005021, AD). The 2026-03-04 Limited record for CMD1L is the
  current one. The Definitive SGCD record is for autosomal recessive LGMD
  (MONDO:0015152), a different disease, and is not used here. relationship_type is
  deliberately left unset.

  GeneReviews. `just check-genereviews --online` found no CMD1L- or SGCD-specific
  chapter. The disease-level Dilated Cardiomyopathy Overview (PMID:20301486) is tagged
  in references. Its cached record has only the chapter's purpose statement, so it is
  not quoted.

  Arrhythmia (HP:0011675) is not curated as a phenotype. None of the human CMD1L
  reports cited here (PMID:10974018, PMID:14564412, PMID:19259135) describes a rhythm
  disturbance in a carrier; the founding paper mentions conduction disease only for
  other DCM loci, and its sudden deaths are reported without a documented rhythm.

  Deep research. The report came from claude_code, after the falcon provider was not
  configured. Its quantitative ClinGen details (scored points, a case-control p value)
  and GenCC Disputed listing are not in any cached source here, so they are not
  curated.
inheritance:
- name: Autosomal dominant
  description: >-
    The proposed mode is autosomal dominant, based on one three-carrier family and two
    apparently de novo sporadic cases. Penetrance is unproven. In an unrelated LGMD2F
    family, seven S151A carriers aged 3-64 years showed no clinical signs of
    cardiomyopathy, and ECG and echocardiography were normal in the four compound
    heterozygotes (the others had clinical examination only). R71T carriers
    showed a mild, late-onset phenotype. ClinGen evaluates the relationship under
    autosomal dominant inheritance and rates it Limited.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: UNKNOWN
  evidence:
  - reference: CGGV:assertion_59326e1b-5cc1-4dfe-8d67-3379aa305c40-2026-03-04T170000.000Z
    reference_title: "SGCD / dilated cardiomyopathy 1L (Limited)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "SGCD | HGNC:10807 | dilated cardiomyopathy 1L | MONDO:0011702 | AD | Limited"
    explanation: >-
      ClinGen evaluates SGCD for this disease under autosomal dominant inheritance and
      classifies the relationship as Limited.
  - reference: PMID:10974018
    reference_title: "Mutations in the human delta-sarcoglycan gene in familial and sporadic dilated cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      In family FDCM no. 1100, three affected individuals were identified with abnormal
      SSCP conformers (Figure 2). None of the unaffected members of the family and none
      of the 200 control individuals had this abnormal conformer.
    explanation: >-
      The only familial segregation offered for dominant transmission. Three affected
      carriers is a small number and gives no LOD score.
  - reference: PMID:19259135
    reference_title: "Does delta-sarcoglycan-associated autosomal-dominant cardiomyopathy exist?"
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      This finding calls into question the pathological relevance of this p.S151A
      sequence variant for causing familial autosomal-dominant DCM and thereby the
      existence of an autosomal-dominant mode of inheritance for the pathogenic mutations
      in the SGCD gene.
    explanation: >-
      The authors' conclusion from an LGMD2F family in which S151A carriers, including
      compound heterozygotes, had no cardiomyopathy. It directly disputes dominant
      inheritance for SGCD.
  - reference: PMID:19259135
    reference_title: "Does delta-sarcoglycan-associated autosomal-dominant cardiomyopathy exist?"
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Comprehensive clinical examination of seven family members carrying the p.S151A
      sequence variant did not reveal any clinical signs of cardiomyopathy.
    explanation: >-
      Seven carriers aged 3-64 years without clinical cardiomyopathy argue against full
      penetrance of the founding allele. Only the compound heterozygotes had ECG and
      echocardiography.
  - reference: PMID:14564412
    reference_title: "A novel mutation, Arg71Thr, in the delta-sarcoglycan gene is associated with dilated cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Therefore carriers of the Arg71Thr mutation had a relatively mild phenotype and a
      late onset of the disease.
    explanation: Variable, milder expression in a second small family.
prevalence:
- population: Published patients with heterozygous SGCD variants and DCM
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    The cached primary reports describe the S151A family (three affected carriers), two
    sporadic p.Lys238del children and two R71T carriers in one Finnish family. A Dutch
    c.4-1G>A carrier is not counted, because no phenotype is reported. Across two cohort screens of 99 and 52 DCM patients, no
    causal SGCD variant was found apart from the single Finnish family. Sylvius et al.
    estimated SGCD variants at less than 1% of idiopathic DCM. ULTRA_RARE is a
    qualitative tier inferred from this handful of published cases; no population
    prevalence has been measured.
  evidence:
  - reference: PMID:12794684
    reference_title: "Mutational analysis of the beta- and delta-sarcoglycan genes in a large number of patients with familial and sporadic dilated cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      we could estimate the prevalence of delta-sarcoglycan gene mutations to be less
      than 1% in idiopathic dilated cardiomyopathy, demonstrating that this gene is only
      marginally implicated in the disease.
    explanation: A pooled estimate from published and new screening data.
  - reference: PMID:12794684
    reference_title: "Mutational analysis of the beta- and delta-sarcoglycan genes in a large number of patients with familial and sporadic dilated cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      We screened these two genes for mutations in 99 unrelated patients with sporadic or
      familial DCM.
    explanation: Size of the negative French screen.
  - reference: PMID:14564412
    reference_title: "A novel mutation, Arg71Thr, in the delta-sarcoglycan gene is associated with dilated cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      All coding regions of the desmin and delta-sarcoglycan genes and the
      metavinculin-specific exon of the vinculin gene were screened in 52 DCM patients
      from eastern Finland by PCR-SSCP.
    explanation: Size of the Finnish screen that yielded one R71T family.
  - reference: PMID:10974018
    reference_title: "Mutations in the human delta-sarcoglycan gene in familial and sporadic dilated cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Mutations affecting the secondary structure were identified in one family and two
      sporadic cases, whereas immunofluorescence analysis of myocardium from one of these
      patients demonstrated significant reduction in delta-sarcoglycan staining.
    explanation: The founding case series of one family and two sporadic patients.
pathophysiology:
- name: Heterozygous SGCD Variant
  biological_scale: MOLECULAR
  role: trigger
  mechanism_confidence: PROVISIONAL
  description: >-
    The proposed initiating lesion is a single germline SGCD missense or in-frame variant
    (S151A, p.Lys238del, R71T), plus one canonical splice variant. Delta-sarcoglycan is a
    sarcolemmal transmembrane glycoprotein of striated and smooth muscle that helps
    stabilize the sarcolemma. The causal status of every reported allele is uncertain:
    ClinGen rates the gene-disease relationship Limited, and the founding S151A allele
    was not associated with cardiac disease in an independent family.

      explanation: Function was preserved and histology was normal in the genotype-matched model.
    - reference: PMID:23695275
      reference_title: "S151A δ-sarcoglycan mutation causes a mild phenotype of cardiomyopathy in mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: DIRECT

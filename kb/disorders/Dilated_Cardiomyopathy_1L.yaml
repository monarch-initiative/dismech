  evidence:
  - reference: PMID:26968544
    reference_title: "Dilated cardiomyopathy mutations in δ-sarcoglycan exert a dominant-negative effect on cardiac myocyte mechanical stability."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: >-
      This study demonstrates that DCM mutant δ-sarcoglycans can be stably expressed in
      adult rat cardiac myocytes and traffic similarly to wild-type δ-sarcoglycan to the
      plasma membrane, without perturbing assembly of the dystrophin-glycoprotein complex.
    explanation: >-
      In this system the mutants assemble normally, so any dominant effect is functional
      rather than a loss of the complex.
  - reference: PMID:26968544
    reference_title: "Dilated cardiomyopathy mutations in δ-sarcoglycan exert a dominant-negative effect on cardiac myocyte mechanical stability."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: >-
      Additionally, the R71T mutation creates an ectopic N-linked glycosylation site that
      results in aberrant glycosylation of the extracellular domain of δ-sarcoglycan.
    explanation: A variant-specific biochemical defect for the Finnish allele.
  - reference: PMID:10974018
    reference_title: "Mutations in the human delta-sarcoglycan gene in familial and sporadic dilated cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      the staining for δ-sarcoglycan was significantly reduced in the patient with the
      ΔK238 mutation (Figure 4).
    explanation: >-
      The only patient myocardium examined showed reduced delta-sarcoglycan, while the
      other sarcoglycans stained normally. Reduced staining is not specific to a
      dominant-negative effect; it is equally compatible with reduced abundance of the
      mutant protein.
  - reference: PMID:10974018
    reference_title: "Mutations in the human delta-sarcoglycan gene in familial and sporadic dilated cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      However, in the patients with DCM described in this report, we propose that
      dominant negative mutations in δ-sarcoglycan result in absent skeletal myopathy in
      the face of late-onset DCM.
    explanation: The dominant-negative hypothesis as first proposed, without functional data.
  - reference: PMID:23695275
    reference_title: "S151A δ-sarcoglycan mutation causes a mild phenotype of cardiomyopathy in mice."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: >-
      Myocardial expression of p.S151A cDNA, similar to intact Sgcd cDNA, restores cardiac
      function, although not being able to prevent myocardial histopathology in Sgcd-null
      mice completely.
    explanation: >-
      S151A delta-sarcoglycan restored cardiac function in Sgcd-null mice much as the
      wild-type protein did. A protein that can substitute for the wild type is unlikely
      to poison the complex, so the result argues against a dominant-negative effect of
      this allele.
  downstream:
  - target: Strain-Induced Cardiomyocyte Sarcolemmal Fragility
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:26968544
      reference_title: "Dilated cardiomyopathy mutations in δ-sarcoglycan exert a dominant-negative effect on cardiac myocyte mechanical stability."
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: DIRECT
      snippet: >-
        However, expression of DCM mutant δ-sarcoglycan in adult rat cardiac myocytes is
        sufficient to alter cardiac myocyte plasma membrane stability in the presence of
        mechanical strain.
      explanation: >-
        Mutant expression is sufficient to destabilize the membrane under strain, in
        rodent cells with wild-type protein present.
  - target: Nuclear Sequestration of Delta-Sarcoglycan with Lamin A/C Mislocalization
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:17164264
      reference_title: "Nuclear sequestration of delta-sarcoglycan disrupts the nuclear localization of lamin A/C and emerin in cardiomyocytes."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      snippet: >-
        Instead of placement at the plasma membrane, delta-sarcoglycan was found in the
        nucleus of S151A delta-sarcoglycan cardiomyocytes. Retention of delta-sarcoglycan
        in the nucleus was accompanied by partial nuclear sequestration of beta- and
        gamma-sarcoglycan.
      explanation: Mislocalized S151A pulls its partner sarcoglycans into the nucleus in transgenic hearts.
- name: Strain-Induced Cardiomyocyte Sarcolemmal Fragility
  biological_scale: CELLULAR
  role: effector
  mechanism_confidence: HYPOTHETICAL
  description: >-
    Cardiomyocytes expressing mutant delta-sarcoglycan take up membrane-impermeant dye
    and develop contractures under cyclic stretch. This parallels the sarcolemmal
    instability that complete delta-sarcoglycan loss causes. It has not been measured in
    patient tissue or in patient-derived cardiomyocytes.

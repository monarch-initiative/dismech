    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Vacuolization of fibroblasts was rescued by transfection of wild-type VAC14 cDNA."
    explanation: Rescue by wild-type VAC14 ties the vacuolation specifically to VAC14 dysfunction.
  - reference: PMID:31591492
    reference_title: >-
      Homozygous variant, p.(Arg643Trp) in VAC14 causes striatonigral
      degeneration: report of a novel variant and review of VAC14-related
      disorders.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The patient fibroblasts showed extensive vacuolization, characteristic of VAC14-related disorders."
    explanation: Replicates fibroblast vacuolation in an independent homozygous patient.
  - reference: PMID:32949958
    reference_title: >-
      Altered homodimer formation and increased iron accumulation in
      VAC14-related disease: Case report and review of the literature.
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "In contrast to previous reports, no enlarged vacuoles were detected in fibroblasts of our patient."
    explanation: >-
      Fibroblasts from an adolescent-onset compound heterozygote lacked the
      vacuole phenotype, so vacuolation is not demonstrable in every patient's

      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: "Together, these findings establish that early neuroinflammation is a defining - and likely initiating - feature of neurodegeneration caused by disruption of lysosomal PI(3,5)P2."
      explanation: >-
        Mouse whole-brain data propose neuroinflammation as the initiator of
        PI(3,5)P2-deficiency neurodegeneration; applying this to the human
        basal ganglia lesion is an inference.
- name: Basal Ganglia Neuronal Degeneration
  description: >-
    Neurons of the caudate nucleus, putamen and globus pallidus degenerate with
    prominent lysosomal vacuolation, and imaging and clinical reports add the
    substantia nigra and, in one child, the brainstem. This is the lesion from
    which the movement disorder and regression follow. Why striatal and nigral
    neurons are selectively vulnerable is not known.
  biological_scale: TISSUE

      label: Autosomal recessive inheritance
  description: >-
    Affected children carry biallelic VAC14 variants, compound heterozygous or
    homozygous, inherited from unaffected heterozygous parents.
  evidence:
  - reference: PMID:27292112
    reference_title: Biallelic Mutations of VAC14 in Pediatric-Onset Neurological Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exome sequencing identified biallelic variants of VAC14 that were inherited from unaffected heterozygous parents in both families."
    explanation: >-
      Both index families show biallelic VAC14 variants with unaffected
      heterozygous carrier parents, the pattern of recessive inheritance.
  - reference: PMID:27292112
    reference_title: Biallelic Mutations of VAC14 in Pediatric-Onset Neurological Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The similar age of onset and neurological decline in the two unrelated children define a recessive disorder resulting from compound heterozygosity for deleterious variants of VAC14."
    explanation: The discovery paper defines the disorder as recessive.
  - reference: PMID:33248288
    reference_title: >-
      Expanding the spectrum of VAC14 related pediatric-onset neurological
      disease; striatonigral degeneration with brainstem involvement.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we present a patient with a homozygous pathogenic VAC14 variant, whose symptoms started at an early age and who had both basal ganglia and brain stem involvement."
    explanation: A homozygous affected child extends the recessive genotype beyond compound heterozygosity.
pathophysiology:
- name: Biallelic VAC14 Variants
  description: >-
    The initiating lesion is biallelic germline variation in VAC14: splice-site,
    truncating and missense alleles, many of them in the C-terminal
    dimerization domain. Loss of function is supported by rescue of the
    fibroblast vacuole phenotype with wild-type VAC14; one adult patient's
    missense variants instead enhanced VAC14 homodimerization without
    fibroblast vacuoles, so the functional consequence may not be uniform
    across alleles.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: VAC14
    term:
      id: hgnc:25507
      label: VAC14
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Biallelic compound heterozygous or homozygous alleles. Loss of function is
      inferred from wild-type cDNA rescue of patient fibroblasts.
  evidence:
  - reference: PMID:27292112
    reference_title: Biallelic Mutations of VAC14 in Pediatric-Onset Neurological Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Proband 2 inherited two missense variants in the dimerization domain of VAC14, p.Ala582Ser and p.Ser583Leu, that have not been previously reported."
    explanation: Documents dimerization-domain missense alleles in an affected child.
  - reference: PMID:31876398
    reference_title: Novel VAC14 variants identified in two Chinese siblings with childhood-onset striatonigral degeneration.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patients were compound heterozygotes for two novel variants in the VAC14 gene, p.Ala582Thr and p.Arg681His."
    explanation: An independent family with compound heterozygous VAC14 missense variants.
  - reference: PMID:32949958
    reference_title: >-
      Altered homodimer formation and increased iron accumulation in
      VAC14-related disease: Case report and review of the literature.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Enhanced VAC14 homodimer formation was observed for two missense variants (p.Leu648Phe and p.Ala562Val, a published mutation), but not for p.Arg623His, compared to wildtype VAC14."
    explanation: >-
      Cell-line work showing that some disease missense alleles increase rather
      than abolish homodimerization, the basis for the caveat in the node
      description.
  downstream:
  - target: Impaired PI(3,5)P2 Synthesis
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:27292112
      reference_title: Biallelic Mutations of VAC14 in Pediatric-Onset Neurological Disease.
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: INDIRECT
      snippet: "Cultured skin fibroblasts exhibited the accumulation of vacuoles that is characteristic of PI(3,5)P2 deficiency."
      explanation: >-
        Patient cells show the vacuolation phenotype that marks PI(3,5)P2
        deficiency, linking the human alleles to reduced PI(3,5)P2; lipid
        levels themselves were not measured.
- name: Impaired PI(3,5)P2 Synthesis
  description: >-
    VAC14 is the scaffold of the PI(3,5)P2 regulatory complex, contacting both
    the PIKFYVE/Fab1 kinase and the FIG4 phosphatase. Without a functional
    scaffold the complex cannot generate normal levels of PI(3,5)P2 on
    endolysosomal membranes. PI(3,5)P2 levels were not measured in patient
    cells; the deficiency is inferred from the yeast and mouse work and from the
    vacuolation phenotype.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: VAC14
    term:
      id: hgnc:25507
      label: VAC14

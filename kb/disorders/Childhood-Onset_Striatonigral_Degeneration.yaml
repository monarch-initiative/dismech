name: Childhood-Onset Striatonigral Degeneration
creation_date: "2026-09-30T00:00:00Z"
category: Mendelian
description: >-
  Childhood-onset striatonigral degeneration (SNDC; OMIM 617054) is an
  ultra-rare autosomal recessive neurodegenerative disorder caused by biallelic
  germline variants in VAC14, the scaffold protein that holds the lipid kinase
  PIKFYVE and the phosphatase FIG4 together in the complex that makes the
  endolysosomal signalling lipid PI(3,5)P2. After a period of normal early
  development, affected children develop an abrupt or subacute neurological
  regression with dystonia, loss of walking and speech, and striatal
  abnormalities on MRI, with involvement of the substantia nigra and, in some
  reports, the brainstem. Neuropathology in two siblings showed vacuolation of
  lysosomal structures in degenerating neurons of the caudate, putamen and
  globus pallidus, matching the enlarged endolysosomal vacuoles seen in patient
  fibroblasts and in Vac14-deficient mice. Later-onset patients with slower
  dystonia-parkinsonism and pallidonigral iron deposition have also been
  reported, and the condition is discussed as a form of neurodegeneration with
  brain iron accumulation. Biallelic VAC14 variants can alternatively cause
  Yunis-Varon syndrome, which is curated as a separate entry. The published
  evidence rests on case reports and small sibships.

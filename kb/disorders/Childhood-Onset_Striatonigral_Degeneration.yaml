discussions:
- discussion_id: sndc_selective_basal_ganglia_vulnerability
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Basal Ganglia Neuronal Degeneration
  - pathophysiology#Defective Endosome-to-TGN Retrograde Trafficking
  prompt: >-
    Which consequence of PI(3,5)P2 deficiency kills striatal and nigral neurons,
    and why these neurons rather than others?
  rationale: >-
    VAC14 and the PI(3,5)P2 complex are ubiquitous, and patient fibroblasts show
    the same vacuoles as neurons, yet degeneration in patients concentrates in
    the caudate, putamen, globus pallidus and substantia nigra. Candidate links
    include osmotic endolysosomal swelling, defective endosome-to-TGN traffic
    and impaired autophagy, but none has been tested in striatal neurons from
    patients.
- discussion_id: sndc_mouse_neuroinflammation_translation
  kind: HUMAN_MODEL_MISMATCH
  attaches_to:
  - pathophysiology#Early Neuroinflammation
  prompt: >-
    Does the early neuroinflammation that precedes neurodegeneration in Fig4
    and Vac14 mutant mice also occur in the human basal ganglia in SNDC?
  rationale: >-
    The mouse data propose inflammation as the initiating event, but Vac14
    mutant mice lose midbrain and peripheral sensory neurons, which is not the
    striatal distribution seen in children. The single human autopsy study
    describes lysosomal vacuolation and autophagy markers and does not report
    on inflammation, so the model and the human lesion have not been compared.
- discussion_id: sndc_iron_and_genotype_phenotype
  kind: KNOWLEDGE_GAP
  attaches_to:
  - phenotypes#Pallidonigral Iron Accumulation
  - pathophysiology#Biallelic VAC14 Variants
  prompt: >-
    What causes pallidonigral iron deposition in VAC14 disease, and does it
    track with allele type or age of onset?
  rationale: >-
    Iron deposition is reported mainly in later-onset patients, and one of them
    had missense alleles that enhanced VAC14 homodimerization with no
    fibroblast vacuoles. Whether iron accumulation follows from lysosomal
    dysfunction, and whether later-onset disease reflects a different
    functional class of allele, has not been studied in a series large enough
    to compare.
notes: >-
  No GeneReviews chapter names this disorder or its synonyms.

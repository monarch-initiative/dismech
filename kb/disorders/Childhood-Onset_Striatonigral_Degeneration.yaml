      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Strikingly, profound neuroinflammation was already present at postnatal day 5 (before significant neurodegeneration), characterized by complement activation, interferon signaling, and parenchymal infiltration of peripheral myeloid cells and T-cells."
      explanation: In Fig4 and Vac14 mutant mice, PI(3,5)P2 insufficiency is followed by early neuroinflammation.
- name: Endolysosomal Vacuolation
  description: >-
    Reduced PI(3,5)P2 leaves late endosomes and lysosomes enlarged and swollen,
    seen as cytoplasmic vacuoles in patient skin fibroblasts and in neurons.
    Wild-type VAC14 rescues the fibroblast phenotype. The finding is not
    universal: fibroblasts from one adolescent-onset patient showed no enlarged
    vacuoles.

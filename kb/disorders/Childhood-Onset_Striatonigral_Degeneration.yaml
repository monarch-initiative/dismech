    quote_role: REVIEW_SYNTHESIS
    snippet: "It is characterized by a period of apparent normalcy followed by abrupt onset neuroregression, dystonia, involuntary movements and degenerative brain lesions involving caudate nucleus, putamen and substantia nigra."
    explanation: Review of reported cases places the lesions in the caudate, putamen and substantia nigra.

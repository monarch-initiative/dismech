    evidence_source: MODEL_ORGANISM
    snippet: "Isolated mutant microglia exhibited a markedly pro-oxidative transcriptional state with elevated reactive oxygen species, a partly non-cell-autonomous phenotype, being present in microglia from mice with conditional Fig4 inactivation in just neurons and astrocytes."
    explanation: Microglia in PI(3,5)P2-deficient mouse brain are in a pro-oxidative activated state.
  downstream:
  - target: Basal Ganglia Neuronal Degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:42242586
      reference_title: >-
        Early-onset neuroinflammation drives neurodegeneration caused by

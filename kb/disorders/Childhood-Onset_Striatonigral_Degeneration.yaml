  downstream:
  - target: Basal Ganglia Neuronal Degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:29296614
      reference_title: Neuropathology of childhood-onset basal ganglia degeneration caused by mutation of VAC14.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We identified upregulation of ubiquitinated granules within the cell cytoplasm and lysosomal-associated membrane protein (LAMP2) around the vacuole edge to suggest a process of vacuolation of lysosomal structures associated with active autophagocytic-associated neuronal degeneration."
      explanation: >-
        Autopsy tissue links lysosomal vacuolation to degenerating basal ganglia
        neurons, although the step from vacuole to cell death is not resolved.
- name: Defective Endosome-to-TGN Retrograde Trafficking
  description: >-
    In Vac14-deficient mouse cells, selective membrane trafficking routes are
    impaired, especially retrograde transport from endosomes to the trans-Golgi
    network. This has not been examined in patient cells, and no source links it
    directly to neuronal death, so the node has no downstream edge.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: retrograde transport, endosome to Golgi
    term:

    causal_link_type: DIRECT
    evidence:
    - reference: PMID:17956977
      reference_title: >-
        Loss of Vac14, a regulator of the signaling lipid phosphatidylinositol
        3,5-bisphosphate, results in neurodegeneration in mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Cell bodies of affected neurons are vacuolated, and apparently empty spaces are present in areas where neurons should be present."
      explanation: Loss of the PI(3,5)P2 regulator Vac14 in mice produces vacuolated neurons.
  - target: Defective Endosome-to-TGN Retrograde Trafficking
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:19037259
      reference_title: VAC14 nucleates a protein complex essential for the acute interconversion of PI3P and PI(3,5)P(2) in yeast and mouse.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: BACKGROUND
      snippet: "The signalling lipid PI(3,5)P(2) is generated on endosomes and regulates retrograde traffic to the trans-Golgi network."
      explanation: PI(3,5)P2 regulates endosome-to-TGN retrograde traffic, so its loss is expected to impair that route.
  - target: Early Neuroinflammation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

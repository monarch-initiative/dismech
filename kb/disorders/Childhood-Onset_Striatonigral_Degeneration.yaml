  evidence:
  - reference: PMID:27292112
    reference_title: Biallelic Mutations of VAC14 in Pediatric-Onset Neurological Disease.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: "In the PI(3,5)P2 biosynthetic complex, the lipid kinase PIKFYVE and the phosphatase FIG4 are bound to the dimeric scaffold protein VAC14, which is composed of multiple heat-repeat domains."
    explanation: States the scaffold role of VAC14 in the PI(3,5)P2 biosynthetic complex.
  - reference: PMID:19037259
    reference_title: VAC14 nucleates a protein complex essential for the acute interconversion of PI3P and PI(3,5)P(2) in yeast and mouse.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we predict that yeast and mammalian Vac14 are composed entirely of HEAT repeats and demonstrate that Vac14 exerts an effect as a scaffold for the PI(3,5)P(2) regulatory complex by direct contact with the known regulators of PI(3,5)P(2): Fig4, Fab1, Vac7 and Atg18."
    explanation: Protein-interaction work establishing Vac14 as the scaffold that contacts the kinase and phosphatase.
  - reference: PMID:11889142
    reference_title: >-
      Osmotic stress-induced increase of phosphatidylinositol
      3,5-bisphosphate requires Vac14p, an activator of the lipid kinase
      Fab1p.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These findings demonstrate that Vac14p regulates the levels of PtdIns(3,5)P(2) and provide insight into why PtdIns(3,5)P(2) levels rise in response to osmotic stress."
    explanation: Yeast genetics showing Vac14 is required to regulate PI(3,5)P2 levels.
  downstream:

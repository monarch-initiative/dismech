    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both children developed impaired movement with dystonia, became nonambulatory and nonverbal, and exhibited striatal abnormalities on MRI."
    explanation: Dystonia in both index patients.
  - reference: PMID:29296614
    reference_title: Neuropathology of childhood-onset basal ganglia degeneration caused by mutation of VAC14.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified compound heterozygous variants in VAC14 in two deceased siblings with early childhood onset of severe, progressive dystonia, and neurodegeneration."
    explanation: Severe progressive dystonia in a second family.

    quote_role: REVIEW_SYNTHESIS
    snippet: "The onset of regression of motor skills is marked by toe-walking, followed by generalized dystonia, and, in some cases, associated parkinsonism and spasticity."
    explanation: >-
      Literature review of 18 reported cases describes generalized dystonia as
      the typical course, supporting a very frequent occurrence.

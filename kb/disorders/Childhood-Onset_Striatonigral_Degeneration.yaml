    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Selective membrane trafficking pathways, especially endosome-to-TGN retrograde trafficking, are defective."
    explanation: The Vac14 knockout mouse study reports defective endosome-to-TGN trafficking.
- name: Early Neuroinflammation
  description: >-
    In mice carrying loss-of-function Fig4 or Vac14 alleles, complement
    activation, interferon signalling and infiltration of myeloid and T cells
    are present before substantial neuron loss, and the authors propose that
    neuroinflammation initiates the degeneration. This is mouse evidence only;
    it has not been examined in patients.

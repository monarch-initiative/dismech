      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Upon exercise, this results in a lack of NAD+ leading to a substrate limitation and stalling of the TCA cycle and mitochondrial respiration, further limiting skeletal muscle mitochondrial respiration."
      explanation: >
        In ANT1-deficient mice exercise drives NAD+ depletion and TCA-cycle
        stalling, the proposed basis of exercise intolerance.
  - target: Mitochondrial Cardiomyopathy with Cardiomyocyte Degeneration
    description: >
      Chronic energy deficiency in cardiomyocytes drives hypertrophic
      remodelling and later cardiomyocyte loss and fibrosis.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:21232697
      reference_title: "Adenine nucleotide translocase 1 deficiency results in dilated cardiomyopathy with defects in myocardial mechanics, histopathological alterations, and activation of apoptosis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "our results demonstrate that mitochondrial energy deficiency is sufficient to cause dilated cardiomyopathy, confirming that energy defects are a factor in this disease."
      explanation: >
        In the Ant1 knockout mouse, energy deficiency alone produces
        cardiomyopathy. The mouse heart dilates, whereas the human heart is

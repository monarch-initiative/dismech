genetic:
- name: SLC25A4
  gene_term:
    preferred_term: SLC25A4
    term:
      id: hgnc:10990
      label: SLC25A4
  association: >
    Biallelic loss-of-function variants: homozygous c.368C>A (p.Ala123Asp),
    c.111+1G>A, c.523delC (p.Gln175ArgfsTer38, Mennonite founder allele),
    c.653A>C (p.Gln218Pro), c.112-1G>C (in-frame p.Gln37_Val38del) and
    c.167_170del, and compound heterozygous c.707G>C (p.Arg236Pro) with
    c.116_137del.
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >
    ClinGen's Hypertrophic Cardiomyopathy Gene Curation Expert Panel rates
    SLC25A4 Definitive for MONDO:0014175 (AR, SOP5, 2017-08-30;
    cache/clingen/gene_validity.csv; the live ClinGen gene-validity download
    retrieved 2026-11-05 lists the same row and no newer CGGV record for this
    pair). That assertion carries the legacy
    identifier CGGCIEX:assertion_10062 rather than a CGGV identifier, and the
    repository's ClinGen structured source indexes only CGGV records, so it
    cannot be cited as a snippet-validated reference and is not recorded in
    gene_disease_validity. Heterozygous SLC25A4 variants cause separate
    diseases (PEOA2 and the de novo dominant MTDPS12A); phenotype and
    management claims should not be transferred between them and this entry.
  evidence:
  - reference: PMID:16155110
    reference_title: "Complete loss-of-function of the heart/muscle-specific adenine nucleotide translocator is associated with mitochondrial myopathy and cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This is the first report of a recessive mutation in the ANT1 gene."
    explanation: First recessive SLC25A4 disease allele.
  - reference: PMID:42876936
    reference_title: "Mitochondrial DNA depletion syndrome 12B: role of photon-counting computed tomography in detection of cardiac involvement-a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic analysis identified a previously unreported homozygous SLC25A4 frameshift mutation (c.167_170del)."
    explanation: A further homozygous null allele.

- name: Maternal mtDNA Haplogroup Modification of Cardiac Severity
  biological_scale: MOLECULAR
  description: >
    Among patients homozygous for the same null allele, the rate and severity
    of cardiomyopathy segregate with maternal lineage: haplogroup U is
    associated with faster, more severe disease than haplogroup H. A mouse
    experiment combining Ant1 loss with a mild mtDNA ND6 variant reproduced a
    worsening of cardiomyopathy.

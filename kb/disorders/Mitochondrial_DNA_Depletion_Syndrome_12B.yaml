    term:
      id: GO:0006119
      label: oxidative phosphorylation
    modifier: DECREASED
  evidence:
  - reference: PMID:42589632
    reference_title: "A Novel SLC25A4 Variant Causing Mitochondrial Dysfunction, Myopathy and Cardiomyopathy: A Functional and Molecular Characterization."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Furthermore, Seahorse assays revealed marked reductions in both oxygen consumption rate (OCR) and extracellular acidification rate (ECAR) in patient-derived FCLs compared with controls."
    explanation: >
      Patient fibroblasts show reduced respiration and glycolytic flux. The same
      paper reports that these differences did not reach statistical
      significance, and fibroblasts express little ANT1.
  - reference: PMID:35940554
    reference_title: "Nicotinamide riboside alleviates exercise intolerance in ANT1-deficient mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We demonstrate a peripheral limitation of skeletal muscle mitochondrial respiration and a reduced complex I respiration in ANT1-deficient mice."
    explanation: >
      Mouse skeletal muscle lacking Ant1 has limited mitochondrial respiration.
  downstream:
  - target: Lactic Acidosis
    description: >
      Failed mitochondrial energy delivery shifts muscle toward glycolysis and
      raises circulating lactate.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:

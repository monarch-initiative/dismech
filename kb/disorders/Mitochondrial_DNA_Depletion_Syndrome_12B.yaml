    reference_title: "Mitochondrial DNA Variation Dictates Expressivity and Progression of Nuclear DNA Mutations Causing Cardiomyopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The ND6P25L variant significantly increased the severity of cardiomyopathy while the COIV421A variant was phenotypically neutral."
    explanation: >
      Experimental mouse support that an mtDNA variant can worsen Ant1-null
      cardiomyopathy. The mouse variant is not the human haplogroup U.
  downstream:
  - target: Mitochondrial Cardiomyopathy with Cardiomyocyte Degeneration

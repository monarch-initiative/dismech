    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with the haplogroup U mtDNAs had more rapid and severe cardiomyopathy than those with haplogroup H."
    explanation: Human observation of haplogroup-associated severity.

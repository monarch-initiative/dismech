pathophysiology:
- name: Biallelic SLC25A4 Loss of Function
  biological_scale: MOLECULAR
  description: >
    Recessive SLC25A4 alleles remove ANT1 function. The homozygous p.Ala123Asp
    missense allele gives no measurable ATP uptake in proteoliposomes
    reconstituted from patient muscle; the homozygous c.111+1G>A splice-donor
    allele leaves no detectable ANT1 transcript in muscle or fibroblasts; and
    the Mennonite founder frameshift c.523delC is a null allele. In a bacterial
    expression assay the recessive missense alleles retained less than 1% of
    wild-type transport, lower than either the adPEO or the de novo dominant
    alleles, even though the recessive disease is clinically milder than the de
    novo disorder. One compound heterozygous patient (p.Arg236Pro with a
    frameshift) with a milder course is thought to retain some functional
    protein.

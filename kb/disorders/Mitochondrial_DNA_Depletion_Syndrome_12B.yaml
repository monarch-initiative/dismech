  - reference: PMID:25732997
    reference_title: "Two Novel Mutations in the SLC25A4 Gene in a Patient with Mitochondrial Myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most likely in our patient, although severely reduced, SLC25A4 is still partially present and functional."
    explanation: >
      The authors' interpretation of a milder compound heterozygous case as
      retaining partial function; this is an inference from the phenotype, not
      a measured transport activity.
  downstream:
  - target: Failure of Mitochondrial ADP/ATP Exchange in Striated Muscle
    description: >
      Loss of the heart/muscle carrier removes the main route for exchanging
      matrix ATP for cytosolic ADP in cardiomyocytes and skeletal muscle fibres.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:16155110
      reference_title: "Complete loss-of-function of the heart/muscle-specific adenine nucleotide translocator is associated with mitochondrial myopathy and cardiomyopathy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The equivalent mutation in AAC2, the yeast ortholog of human ANT1, resulted in a complete loss of transport activity and in the inability to rescue the severe Oxidative Phosphorylation phenotype displayed by WB-12, an AAC1/AAC2 defective strain."
      explanation: >
        In yeast the equivalent mutation abolishes transport and cannot support
        oxidative phosphorylation, linking the allele to the exchange defect.
- name: Failure of Mitochondrial ADP/ATP Exchange in Striated Muscle
  biological_scale: CELLULAR
  description: >
    ANT1 exports ATP made in the mitochondrial matrix to the cytosol in exchange
    for ADP. It is the predominant isoform in heart and skeletal muscle, which is
    why loss of ANT1 affects these tissues while other organs are largely
    spared. In the expression-null patient there was no compensating rise in the
    ubiquitous ANT3 isoform in muscle.
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  biological_processes:
  - preferred_term: mitochondrial ATP transmembrane transport
    term:
      id: GO:1990544
      label: mitochondrial ATP transmembrane transport
    modifier: DECREASED
  - preferred_term: mitochondrial ADP transmembrane transport
    term:
      id: GO:0140021
      label: mitochondrial ADP transmembrane transport
    modifier: DECREASED
  evidence:
  - reference: PMID:18439414
    reference_title: "MITOCHIP assessment of differential gene expression in the skeletal muscle of Ant1 knockout mice: coordinate regulation of OXPHOS, antioxidant, and apoptotic genes."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: OTHER
    snippet: "Genetic inactivation of the nuclear-encoded mitochondrial heart-muscle adenine nucleotide translocator-1 (ANT1), which exports mitochondrial ATP to the cytosol in both humans (ANT1-/-) and mice (Ant1-/-), results in lactic acidosis and mitochondrial cardiomyopathy and myopathy"
    explanation: >
      Background statement of ANT1's ATP-export function and the consequence of
      its inactivation in both humans and mice. Graded OTHER because the one
      sentence summarises human and mouse evidence together and cannot be split.
  - reference: PMID:42589632
    reference_title: "A Novel SLC25A4 Variant Causing Mitochondrial Dysfunction, Myopathy and Cardiomyopathy: A Functional and Molecular Characterization."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "SLC25A4 (ANT1; OMIM 610849) is known as a predominant isoform in the heart and skeletal muscle and also expressed at a low level in proliferating cells and skin cells"
    explanation: >
      Tissue distribution of ANT1 accounts for the striated-muscle restriction
      of the disease.
  - reference: PMID:22187496
    reference_title: "Complete loss of expression of the ANT1 gene causing cardiomyopathy and myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No compensating increase in the transcript level of the ANT3 gene, which encodes the human ubiquitous isoform of the ADP/ATP translocase, was observed."
    explanation: >
      The ubiquitous isoform does not rise to cover the loss in patient muscle.
  downstream:
  - target: Bioenergetic Failure of Cardiac and Skeletal Muscle
    description: >
      Without ADP/ATP exchange, ATP produced in mitochondria cannot reach
      cytosolic consumers and ADP cannot return to ATP synthase.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:35940554
      reference_title: "Nicotinamide riboside alleviates exercise intolerance in ANT1-deficient mice."
      supports: SUPPORT
      quote_role: BACKGROUND
      evidence_source: HUMAN_CLINICAL
      snippet: "ANT1-null patients show elevated serum lactate levels, decreased phosphocreatine levels in muscle and exercise intolerance consistent with an impaired ATP export from the mitochondria."
      explanation: >
        Summarises the patient findings (low muscle phosphocreatine, raised
        lactate) that indicate an energetic deficit from impaired ATP export.
  - target: Compensatory Mitochondrial Proliferation
    description: >
      Muscle responds to the energetic block by proliferating mitochondria and
      inducing respiratory chain and antioxidant enzymes; restoring Ant1 in the
      mouse heart reverses the induced mitochondrial metabolic program.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:41398158
      reference_title: "Partial restoration of mitochondrial dysfunction by AAV-Ant1 protects from dilated cardiomyopathy in Ant1(-/-) plus mtDNA mutant mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Proteomics and single-nucleus RNA sequencing reveal the reversal of dysregulated mitochondrial metabolic genes, including PGC1α, as well as cardiac contractile and extracellular matrix proteins."
      explanation: >
        Re-expressing Ant1 reverses the dysregulated mitochondrial biogenesis
        program, showing that it is driven by the loss of exchange activity.
  - target: Increased Mitochondrial Oxidative Stress
    description: >
      Increased redox stress is proposed to follow loss of ANT1 function, on the
      basis of yeast rescue by ROS scavengers and mouse muscle data.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:16155110
      reference_title: "Complete loss-of-function of the heart/muscle-specific adenine nucleotide translocator is associated with mitochondrial myopathy and cardiomyopathy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Interestingly, exposure to reactive oxygen species (ROS) scavengers dramatically increased the viability of the WB-12 transformant, suggesting that increased redox stress is involved in the pathogenesis of the disease"
      explanation: >
        ROS scavengers rescue yeast carrying the equivalent mutation, implicating
        redox stress downstream of the transport defect.
  - target: Muscle mtDNA Deletion Accumulation
    description: >
      Multiple mtDNA deletions accumulate in muscle of most recessive patients.
      How loss of ADP/ATP exchange compromises mtDNA maintenance is not
      established; the de novo dominant literature describes the link only as
      probable.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:30013777
      reference_title: "Phenotypic spectrum of SLC25A4 mutations."
      supports: SUPPORT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: HUMAN_CLINICAL
      snippet: "SLC25A4 mutations may result in mtDNA depletion or multiple mitochondrial (mt)DNA deletions."
      explanation: >
        Review-level statement that SLC25A4 defects compromise mtDNA integrity
        or quantity; it does not specify the mechanism.
  - target: L-2-Hydroxyglutaric Aciduria
    description: >
      In one patient the authors proposed that disturbed ADP/ATP transport lets
      TCA-cycle intermediates such as 2-ketoglutarate accumulate, from which
      L-2-hydroxyglutarate is formed. This is the authors' hypothesis from a
      single case.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:29654543
      reference_title: "Muscle Weakness, Cardiomyopathy, and L-2-Hydroxyglutaric Aciduria Associated with a Novel Recessive SLC25A4 Mutation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The disturbed ADP/ATP transport across the inner mitochondrial membrane may lead to an accumulation of different TCA-cycle intermediates such as 2-ketoglutarate (2-KG) in our patient."
      explanation: >
        States the proposed route from the transport defect to the organic
        aciduria.
- name: Bioenergetic Failure of Cardiac and Skeletal Muscle
  conforms_to: "primary_oxphos_deficiency#Cellular Energy Failure in High-Demand Tissues"
  biological_scale: CELLULAR
  description: >
    Coupled mitochondrial energy supply to the cytosol fails in the striated
    muscles that depend on ANT1. Unlike a primary respiratory chain defect, the
    respiratory chain enzymes themselves are increased in patient muscle, so the
    deficit lies in delivering mitochondrial ATP rather than in making it. In
    patient fibroblasts (which express little ANT1) basal respiration and ATP
    production were reduced, though not significantly in a small sample; in
    ANT1-deficient mouse muscle exercise stalls the TCA cycle through NAD+
    limitation.
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002

    mapping_justification: >
      MTDPS12A is the allelic, de novo dominant SLC25A4 disorder (neonatal
      onset, ventilator dependence, marked mtDNA copy-number loss). It shares
      the gene and the numbered MTDPS12 designation but is a separate OMIM
      phenotype with a different mechanism (severely impaired but dominant-acting
      carriers rather than biallelic null alleles), so it is recorded as related,
      not as a subtype of this entry.
  - term:

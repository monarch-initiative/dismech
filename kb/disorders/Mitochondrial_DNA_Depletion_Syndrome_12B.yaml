    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole-exome sequencing identified a homozygous pathogenic SLC25A4 frameshift mutation (c.167_170del), absent in population databases."
    explanation: Diagnosis by exome sequencing.
- name: Muscle Biopsy
  description: >
    Shows ragged-red fibres, subsarcolemmal mitochondrial aggregates and
    increased (rather than reduced) respiratory chain enzyme activities;
    long-range PCR or Southern blot usually shows multiple mtDNA deletions.
  presence: PRESENT
  evidence:
  - reference: PMID:28823815
    reference_title: "Two new cases of mitochondrial myopathy with exercise intolerance, hyperlactatemia and cardiomyopathy, caused by recessive SLC25A4 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The phenotype of recessive SLC25A4 (ANT1) mutations although rare, is homogenous and easily recognizable and could help orientate the molecular analysis in adults with exercise intolerance associated with hyperlactatemia."
    explanation: The clinical and biopsy pattern is recognisable enough to direct genetic testing.
- name: Cardiac Imaging
  description: >
    Echocardiography and cardiac MRI document hypertrophy, relaxation and
    systolic function, and fibrosis; photon-counting CT has been used to
    characterise fibrosis and microvascular obstruction in one patient.
  presence: PRESENT
  evidence:
  - reference: PMID:42876936
    reference_title: "Mitochondrial DNA depletion syndrome 12B: role of photon-counting computed tomography in detection of cardiac involvement-a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cardiac magnetic resonance (CMR) confirmed these findings."
    explanation: CMR confirmed the photon-counting CT findings.
differential_diagnoses:
- name: Mitochondrial DNA Depletion Syndrome 12A (de novo dominant SLC25A4)
  description: >
    Recurrent de novo heterozygous SLC25A4 variants (p.Arg80His, p.Arg235Gly)
    cause a far more severe disorder presenting at birth, with ventilator
    dependence, combined respiratory chain deficiency and marked loss of mtDNA
    copy number in muscle.
  distinguishing_features:
  - Single de novo heterozygous variant rather than biallelic variants
  - Neonatal presentation with ventilator dependence
  - Marked mtDNA depletion and respiratory chain deficiency in muscle
  evidence:
  - reference: PMID:27693233
    reference_title: "Recurrent De Novo Dominant Mutations in SLC25A4 Cause Severe Early-Onset Mitochondrial Disease and Loss of Mitochondrial DNA Copy Number."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All affected individuals presented at birth, were ventilator dependent and, where tested, revealed severe combined mitochondrial respiratory chain deficiencies associated with a marked loss of mitochondrial DNA copy number in skeletal muscle."
    explanation: Features of the de novo dominant disorder.
- name: SLC25A4 Autosomal Dominant Progressive External Ophthalmoplegia (PEOA2)
  description: >
    Heterozygous SLC25A4 missense variants cause adult-onset ptosis and external
    ophthalmoplegia with multiple mtDNA deletions, without the childhood
    hypertrophic cardiomyopathy of the recessive disease.
  distinguishing_features:
  - Heterozygous inheritance
  - Adult onset with prominent external ophthalmoplegia
  evidence:
  - reference: PMID:27693233
    reference_title: "Recurrent De Novo Dominant Mutations in SLC25A4 Cause Severe Early-Onset Mitochondrial Disease and Loss of Mitochondrial DNA Copy Number."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Several heterozygous SLC25A4 mutations cause adult-onset autosomal-dominant progressive external ophthalmoplegia associated with multiple mitochondrial DNA deletions, whereas recessive SLC25A4 mutations cause childhood-onset mitochondrial myopathy and cardiomyopathy."
    explanation: Contrasts the dominant and recessive SLC25A4 diseases.
treatments:
- name: Heart Failure Pharmacotherapy
  description: >
    Standard heart failure drugs are used for the cardiomyopathy. In one adult,
    metoprolol, sacubitril/valsartan, dapagliflozin and diuretics stabilised
    symptoms but systolic function continued to decline; potassium citrate was
    added for metabolic acidosis. No disease-specific therapy exists.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: metoprolol
      term:
        id: CHEBI:6904
        label: metoprolol
  evidence:
  - reference: PMID:42876936
    reference_title: "Mitochondrial DNA depletion syndrome 12B: role of photon-counting computed tomography in detection of cardiac involvement-a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pharmacotherapy for heart failure was initiated with metoprolol succinate, sacubitril/valsartan, dapagliflozin, furosemide, and spironolactone, consistent with guideline-directed medical therapy."
    explanation: Heart failure therapy used in one patient.
  - reference: PMID:42876936
    reference_title: "Mitochondrial DNA depletion syndrome 12B: role of photon-counting computed tomography in detection of cardiac involvement-a case report."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Guideline-directed medical therapy often provides limited benefit, and early genetic diagnosis with longitudinal surveillance remains essential, though therapeutic options are largely supportive."
    explanation: Limited benefit and the need for longitudinal cardiac surveillance.
- name: Coenzyme Q10 and Carnitine Supplementation
  description: >
    A single child treated with coenzyme Q10 and carnitine reported improved
    endurance and worsening when the supplements lapsed. This is an
    uncontrolled single-patient observation.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: coenzyme Q10
      term:
        id: CHEBI:46245
        label: coenzyme Q10
    - preferred_term: carnitine
      term:
        id: CHEBI:17126
        label: carnitine
  evidence:
  - reference: PMID:42589632
    reference_title: "A Novel SLC25A4 Variant Causing Mitochondrial Dysfunction, Myopathy and Cardiomyopathy: A Functional and Molecular Characterization."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "She was treated with coQ10 100 mg bid and 1.5 mL carnitine bid and showed clear improvement in her endurance, walking distance and ability to carry her school bag."
    explanation: Reported benefit in one uncontrolled case.
animal_models:
- name: Ant1 knockout mouse
  species: Mouse
  genotype: Slc25a4 (Ant1) -/-
  publication: PMID:18439414
  description: >
    The Ant1-null mouse develops lactic acidosis, mitochondrial myopathy with
    mitochondrial proliferation, increased ROS and mtDNA damage, and a
    cardiomyopathy that is concentric but dilated. Extraocular muscle shows
    mitochondrial myopathy without ocular motor deficit, attributed to higher
    Ant2 expression there.
  modeled_mechanisms:
  - target: Compensatory Mitochondrial Proliferation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >
      Skeletal muscle shows mitochondrial proliferation with induction of the
      Pgc-1alpha/Nrf-1/Tfam biogenesis program.
    evidence:
    - reference: PMID:18439414
      reference_title: "MITOCHIP assessment of differential gene expression in the skeletal muscle of Ant1 knockout mice: coordinate regulation of OXPHOS, antioxidant, and apoptotic genes."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The mitochondrial regulatory proteins Pgc-1alpha, Nrf-1, Tfam, and myogenin were up-regulated and could account for the induction of the OXPHOS and antioxidant enzymes."
      explanation: Biogenesis program in knockout muscle.
  - target: Mitochondrial Cardiomyopathy with Cardiomyocyte Degeneration
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >
      Ant1-null mice develop myocardial hypertrophy, fibrosis and progressive
      functional decline.
    limitations: >
      The mouse cardiomyopathy is concentric but dilated, whereas the human
      disease is typically concentric hypertrophic until late stages.
    evidence:
    - reference: PMID:21232697
      reference_title: "Adenine nucleotide translocase 1 deficiency results in dilated cardiomyopathy with defects in myocardial mechanics, histopathological alterations, and activation of apoptosis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "the Ant1-/- mice developed a distinctive concentric dilated cardiomyopathy, characterized by substantial myocardial hypertrophy and ventricular dilation, with cardiac function declining earlier in age as compared to control mice."
      explanation: Cardiac phenotype of the knockout.
  - target: Skeletal Muscle Mitochondrial Dysfunction
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >
      Knockout mice show limited muscle respiration and exercise intolerance
      that nicotinamide riboside partly corrects.
    evidence:
    - reference: PMID:35940554
      reference_title: "Nicotinamide riboside alleviates exercise intolerance in ANT1-deficient mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Treatment of ANT1-deficient mice with nicotinamide riboside increased NAD+ levels in skeletal muscle and liver, which increased the exercise capacity and the mitochondrial respiration."
      explanation: Muscle energetic defect and its pharmacological modulation in the mouse.
  - target: Muscle mtDNA Deletion Accumulation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: MOLECULAR
    description: Knockout muscle accumulates excessive mtDNA damage.
    limitations: >
      The source reports mtDNA damage generally; it is not shown here that the
      mouse accumulates the multiple deletions seen in patients.
    evidence:
    - reference: PMID:18439414
      reference_title: "MITOCHIP assessment of differential gene expression in the skeletal muscle of Ant1 knockout mice: coordinate regulation of OXPHOS, antioxidant, and apoptotic genes."
      supports: SUPPORT
      quote_role: BACKGROUND
      evidence_source: MODEL_ORGANISM
      snippet: "the latter involving hyper-proliferation of mitochondria, induction of oxidative phosphorylation (OXPHOS) enzymes, increased reactive oxygen species (ROS), and excessive mtDNA damage"
      explanation: mtDNA damage in the knockout.
- name: Ant1 knockout mouse with mtDNA ND6 P25L variant (AAV-Ant1 rescue)
  species: Mouse
  genotype: Slc25a4 (Ant1) -/- with homoplasmic mtDNA ND6P25L
  publication: PMID:30174309
  description: >
    Combining Ant1 loss with a mild mtDNA ND6 variant worsens cardiomyopathy,
    modelling the haplogroup effect seen in patients; neonatal AAV delivery of
    Ant1 to these hearts ameliorated the cardiomyopathy.
  modeled_mechanisms:
  - target: Maternal mtDNA Haplogroup Modification of Cardiac Severity
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: An mtDNA variant on an Ant1-null background increases cardiac severity.
    limitations: >
      The ND6P25L variant is not a human haplogroup U variant; the model shows
      that mtDNA background can modify Ant1-null disease, not which human
      variants do.
    evidence:
    - reference: PMID:30174309
      reference_title: "Mitochondrial DNA Variation Dictates Expressivity and Progression of Nuclear DNA Mutations Causing Cardiomyopathy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The ND6P25L variant significantly increased the severity of cardiomyopathy while the COIV421A variant was phenotypically neutral."
      explanation: mtDNA modifier effect in the mouse.
  - target: Mitochondrial Cardiomyopathy with Cardiomyocyte Degeneration
    relationship: RESCUES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Partial restoration of Ant1 expression ameliorates the cardiomyopathy.
    limitations: >
      Gene transfer was given neonatally to mice; no human gene therapy data
      exist.
    evidence:
    - reference: PMID:41398158
      reference_title: "Partial restoration of mitochondrial dysfunction by AAV-Ant1 protects from dilated cardiomyopathy in Ant1(-/-) plus mtDNA mutant mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We show that restoration of just 10% of Ant1 gene expression was sufficient to ameliorate the cardiomyopathies in these mice."
      explanation: Preclinical gene replacement rescue.
discussions:
- discussion_id: mtdps12b_deletion_mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >
    How does loss of ANT1 ADP/ATP exchange lead to multiple mtDNA deletions in
    muscle, and why do some recessive patients have none?
  attaches_to:
  - pathophysiology#Muscle mtDNA Deletion Accumulation
  rationale: >
    Multiple deletions are reported in most recessive patients, yet one
    homozygous patient had none in muscle, and no recessive patient reviewed
    here has documented mtDNA depletion despite the disease name. The proposed
    routes (nucleotide pool imbalance, oxidative damage) rest on mouse data or
    on statements made about the de novo dominant disorder, where the link is
    described only as probable.
  evidence:
  - reference: PMID:27693233
    reference_title: "Recurrent De Novo Dominant Mutations in SLC25A4 Cause Severe Early-Onset Mitochondrial Disease and Loss of Mitochondrial DNA Copy Number."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This highly reduced capacity for transport probably affects mitochondrial DNA maintenance and in turn respiration, causing a severe energy crisis."
    explanation: >
      The mechanistic link is stated as probable, and for the de novo dominant
      alleles rather than the recessive ones.
notes: >
  Lump/split: this entry covers only the biallelic (autosomal recessive)
  SLC25A4 disease. The de novo dominant disorder MTDPS12A (MONDO:0014959) and
  heterozygous PEOA2 (MONDO:0012238, a subtype in
  Autosomal_Dominant_Progressive_External_Ophthalmoplegia) are allelic but
  differ in inheritance, onset, mtDNA lesion and residual transport activity,
  and are recorded as related mappings and differentials rather than subtypes.
  The compound heterozygous p.Arg236Pro case and the homozygous p.Gln218Pro case
  with L-2-hydroxyglutaric aciduria and no deletions are kept within this entry.
  Naming: "depletion" in the OMIM/MONDO label reflects the numbered MTDPS
  series; the recessive patients in the sources used here show multiple
  deletions (or none), not depletion. Sources: no GeneReviews chapter for
  SLC25A4 or this disease is in the committed Bookshelf index
  (cache/bookshelf/genereviews.csv), and no Orphanet record was cited. The
  phenotype baseline therefore rests on primary case reports (PMID:16155110,
  PMID:22187496, PMID:23401503, PMID:25732997, PMID:28823815, PMID:29654543,
  PMID:42589632, PMID:42876936). The Finsterer review (PMID:30013777) pools
  dominant, de novo and recessive cases, so its phenotype frequencies are not
  used for this entry.

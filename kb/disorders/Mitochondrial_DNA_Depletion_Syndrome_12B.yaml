name: Mitochondrial DNA Depletion Syndrome 12B (Cardiomyopathic Type)
creation_date: "2026-11-05T18:54:52Z"
category: Mendelian
disease_term:
  preferred_term: mitochondrial DNA depletion syndrome 12B (cardiomyopathic type), autosomal recessive
  term:
    id: MONDO:0014175
    label: mitochondrial DNA depletion syndrome 12B (cardiomyopathic type), autosomal recessive
description: >
  Mitochondrial DNA depletion syndrome 12B (MTDPS12B, OMIM 615418) is an
  ultra-rare autosomal recessive mitochondrial myopathy and cardiomyopathy
  caused by biallelic loss-of-function variants in SLC25A4, which encodes ANT1
  (AAC1), the heart and skeletal muscle isoform of the inner mitochondrial
  membrane ADP/ATP carrier. Recessive alleles reported so far are missense,
  splice-site and frameshift changes that abolish transport or expression;
  one compound heterozygous patient with a milder course is thought to retain
  partial function. Onset is usually in childhood, with fatigue and exercise
  intolerance, lactic acidosis (often with hyperalaninemia), a mild
  mitochondrial myopathy and a progressive, typically concentric hypertrophic
  cardiomyopathy that dominates prognosis; most affected individuals survive
  into adulthood, and in a 13-generation Mennonite founder pedigree the rate
  of cardiac progression segregated with maternal mtDNA haplogroup. Muscle
  biopsy shows ragged-red fibres, subsarcolemmal mitochondrial aggregates and
  increased (not decreased) respiratory chain enzyme activities. Despite the
  name, the published recessive cases show multiple mtDNA deletions in muscle,
  or none, rather than mtDNA depletion; marked loss of mtDNA copy number is the
  feature of the de novo dominant SLC25A4 disorder (MTDPS12A). The recessive
  disease is also distinct from heterozygous SLC25A4 adPEO (PEOA2): external
  ophthalmoplegia is usually absent here, although one patient has had mild
  ptosis and upgaze limitation.
references:
- reference: PMID:30013777

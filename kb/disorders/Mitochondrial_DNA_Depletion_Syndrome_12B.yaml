  - target: Skeletal Muscle Mitochondrial Dysfunction
    description: >
      The same energetic block in skeletal muscle fibres produces the myopathy.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Mitochondrial Cardiomyopathy with Cardiomyocyte Degeneration
  conforms_to: "primary_oxphos_deficiency#Mitochondrial Cardiomyopathy"
  biological_scale: TISSUE
  description: >
    Progressive myocardial thickening with abnormal contractile mechanics and
    impaired relaxation. In end-stage hearts from the Mennonite pedigree there
    was massive symmetric concentric hypertrophy, widespread cardiomyocyte
    degeneration, abundant abnormal mitochondria, subendocardial interstitial
    fibrosis and arteriolar smooth muscle hypertrophy. Cardiac MRI and
    photon-counting CT in an adult showed intramural fibrosis, intramyocardial
    fat and microvascular obstruction with falling ejection fraction.
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  evidence:

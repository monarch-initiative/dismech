      cardiomyopathy.
  - reference: PMID:27693233
    reference_title: "Recurrent De Novo Dominant Mutations in SLC25A4 Cause Severe Early-Onset Mitochondrial Disease and Loss of Mitochondrial DNA Copy Number."
    supports: SUPPORT

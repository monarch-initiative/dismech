    reference_title: "Severity of cardiomyopathy associated with adenine nucleotide translocator-1 deficiency correlates with mtDNA haplogroup."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "End-stage heart disease was characterized by massive, symmetric, concentric cardiac hypertrophy; widespread cardiomyocyte degeneration; overabundant and structurally abnormal mitochondria; extensive subendocardial interstitial fibrosis; and marked hypertrophy of arteriolar smooth muscle."
    explanation: >
      Pathology of end-stage hearts in homozygous null patients.
  - reference: PMID:42876936
    reference_title: "Mitochondrial DNA depletion syndrome 12B: role of photon-counting computed tomography in detection of cardiac involvement-a case report."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "Hypertrophic remodelling in mitochondrial cardiomyopathy is generally considered a compensatory response to chronic energy deficiency"
    explanation: >
      Frames the hypertrophy as a response to chronic energy deficiency.

name: Primary Hyperoxaluria Type 3
creation_date: "2026-07-07T12:00:00Z"
description: >-
  Primary hyperoxaluria type 3 (PH3) is an autosomal recessive disorder of
  glyoxylate metabolism caused by biallelic HOGA1 pathogenic variants. HOGA1
  encodes the mitochondrial enzyme 4-hydroxy-2-oxoglutarate aldolase, which
  catalyzes the final step of the hepatic hydroxyproline degradation pathway,
  cleaving 4-hydroxy-2-oxoglutarate (HOG) into pyruvate and glyoxylate. Loss of
  HOGA1 activity causes accumulation of HOG and related hydroxyproline
  metabolites and, paradoxically, increased endogenous oxalate production
  (proposed to arise from cytosolic conversion of accumulated HOG to glyoxylate
  and/or inhibition of glyoxylate reductase). The resulting hyperoxaluria drives
  calcium oxalate supersaturation and recurrent calcium oxalate nephrolithiasis,
  typically presenting in early childhood. PH3 is generally the mildest of the
  primary hyperoxalurias, with progression to kidney failure uncommon.
category: Metabolic Disorder
parents:
- Inborn Error of Metabolism
- Primary Hyperoxaluria
- Genetic Kidney Disease
synonyms:

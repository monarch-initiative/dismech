mechanistic_hypotheses:
- hypothesis_group_id: cytosolic_hog_cleavage
  hypothesis_label: Cytosolic 4-Hydroxy-2-Oxoglutarate Cleavage Model
  status: CANONICAL
  description: >-
    The leading proposed explanation for increased oxalate production despite a
    block upstream of glyoxylate: 4-hydroxy-2-oxoglutarate accumulating behind
    the absent mitochondrial HOGA1 step is exported to the cytosol and cleaved
    there by a non-HOGA1 aldolase, releasing glyoxylate outside the
    mitochondrial compartment where it would normally be detoxified, so that it
    is instead oxidized to oxalate.
  evidence:
  - reference: PMID:22729392
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "its transport into the cytosol where it is converted to"
    explanation: >-
      States the cytosolic-export-and-conversion route for accumulated
      4-hydroxy-2-oxoglutarate that this hypothesis group names.
    reference_title: Primary hyperoxaluria type III--a model for studying perturbations in glyoxylate metabolism
  - reference: PMID:22771891
    supports: REFUTE
    quote_role: PRIMARY_RESULT
    evidence_source: IN_VITRO
    snippet: "NAL showed minimal activity towards HOG"
    explanation: >-
      N-acetylneuraminate aldolase was the named candidate for the cytosolic
      enzyme this model requires, and it does not cleave HOG at a useful rate.
      Refutes the candidate rather than the model, which can still be carried
      by an enzyme nobody has identified.
    reference_title: 4-Hydroxy-2-oxoglutarate aldolase inactivity in primary hyperoxaluria type 3 and glyoxylate reductase inhibition.
  - reference: PMID:39040543
    supports: REFUTE
    quote_role: PRIMARY_RESULT
    evidence_source: MODEL_ORGANISM
    snippet: "highest in liver mitoplasts, with no activity present in brain tissue lysates"
    explanation: >-
      In the Hoga1-knockout mouse the residual HOG-cleaving activity is
      mitochondrial, not cytosolic, and the cytosol reduces HOG to
      2,4-dihydroxyglutarate instead. Contradicts the compartment logic the
      model is built on, in mouse.
    reference_title: 4-hydroxy-2-oxoglutarate metabolism in a mouse model of Primary Hyperoxaluria Type 3.
  notes: >-
    Treated as the default explanatory model in the literature rather than as an
    established one. The upstream half is established; the step the model is
    named for is not. The cytosolic enzyme has never been identified and the
    one candidate that was tested, N-acetylneuraminate aldolase, does not
    cleave HOG at a useful rate; the HOG-to-glyoxylate-to-oxalate flux has
    never been measured; and in the Hoga1-knockout mouse the residual cleaving
    activity sits in mitochondria while the cytosol reduces HOG to a dead-end
    metabolite. Two further observations the model does not account for: the
    knockout mouse is not hyperoxaluric even when AGT is restricted to
    peroxisomes as in humans (PMID:40578401), and hepatic LDH knockdown lowers
    oxalate in PH1 but not PH3 (PMID:39582099), implying a source outside the
    liver. Reviewed against an OpenScientist hypothesis-exploration run
    (kb/hypotheses/Primary_Hyperoxaluria_Type_3/cytosolic_hog_cleavage), 24
    papers. Retained as CANONICAL because it remains the field's default
    account, not because it is established. See the
    gap_ph3_oxalate_overproduction_mechanism discussion.
- hypothesis_group_id: hog_glyoxylate_reductase_inhibition
  hypothesis_label: Substrate Inhibition of Glyoxylate Reductase Model
  status: ALTERNATIVE
  description: >-
    A competing or superimposed explanation in which accumulated
    4-hydroxy-2-oxoglutarate inhibits glyoxylate reductase (GRHPR), the enzyme
    whose loss causes primary hyperoxaluria type 2. Reduced glyoxylate clearance
    would raise oxalate production from glyoxylate arising by any route, without
    requiring extra glyoxylate to be generated.
  evidence:
  - reference: PMID:22771891
    supports: SUPPORT
    quote_role: PRIMARY_RESULT
    evidence_source: IN_VITRO
    snippet: "GR was inhibited by HOG but not by 2-hydroxyglutarate or 2-oxoglutarate"
    explanation: >-
      The study that measured the inhibition this hypothesis group names, on
      purified recombinant enzyme, with the specificity controls that make it a
      claim about HOG.
    reference_title: 4-Hydroxy-2-oxoglutarate aldolase inactivity in primary hyperoxaluria type 3 and glyoxylate reductase inhibition.
  - reference: PMID:26428388
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: IN_VITRO
    snippet: "a buildup of HOG due to HOGA deficiency may result in an inhibition of GR activity based on results observed in vitro with the purified enzyme"
    explanation: >-
      The same authors restating their purified-enzyme result in this paper's
      introduction, with a citation to it. BACKGROUND because the measurement
      is not this paper's.
    reference_title: Hydroxyproline metabolism in a mouse model of Primary Hyperoxaluria Type 3
  notes: >-
    Supported only by in vitro work with purified enzyme; whether the inhibition
    occurs at intracellular 4-hydroxy-2-oxoglutarate concentrations in human
    liver is untested, and no study has measured glyoxylate reductase activity
    in PH3 patient tissue. The concentration gap is the substantive objection,
    and the source paper states it itself: inhibition needs roughly millimolar
    HOG, while the HOG actually measured in PH3 patients is two to three orders
    of magnitude lower, so a reversible-inhibition estimate puts in vivo
    inhibition under one percent. An OpenScientist run computed that estimate
    from the paper's own numbers
    (kb/hypotheses/Primary_Hyperoxaluria_Type_3/hog_glyoxylate_reductase_inhibition);
    the arithmetic reproduces on independent replay and its inputs are
    confirmed against that paper's Table 2 and Fig. 4, but it is still an
    order-of-magnitude argument rather than a measurement. Two reasons: it
    rests on bulk tissue HOG standing in for the concentration at the enzyme,
    and compartmental enrichment has not been measured; and the PH3 cohorts
    behind those concentrations are five sera and three livers. Also discordant: PH3 is the
    mildest primary hyperoxaluria and can normalise with age, where sustained
    functional loss of the PH2 enzyme would predict a PH2-like course. Retained
    as ALTERNATIVE, at most a contributing mechanism.
- hypothesis_group_id: hoga1_loss_pyruvate_krebs_flux
  hypothesis_label: Reduced Pyruvate Availability and Krebs-Cycle Flux Model
  status: EMERGING
  description: >-
    A third route to the same paradox, requiring neither an unidentified
    cytosolic enzyme nor inhibition of a second enzyme: the lost HOGA1 reaction
    is itself a source of pyruvate, so its absence lowers pyruvate supply and
    Krebs-cycle flux, and oxalate production rises indirectly. HOGA1 also
    carries an oxaloacetate-decarboxylase activity on the same catalytic
    machinery, and pyruvate competitively inhibits the enzyme, so the gene
    sits inside central carbon metabolism rather than only at the end of the
    hydroxyproline pathway.
  evidence:
  - reference: PMID:31696211
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: IN_VITRO
    snippet: "loss of HOGA1 function could increase oxalate production in PH3 by decreasing pyruvate availability"
    explanation: >-
      States the mechanism, proposed from the authors' own characterisation of
      recombinant human HOGA1. INDIRECT because the oxalate consequence is
      inferred from enzymology rather than measured.
    reference_title: "Regulation of human 4-hydroxy-2-oxoglutarate aldolase by pyruvate and α-ketoglutarate: implications for primary hyperoxaluria type-3."
  notes: >-
    Recorded as EMERGING because it is a proposal from in vitro enzymology that
    has not been tested in cells, tissue or an animal, not because it is new -
    it dates from 2019. Surfaced independently by both OpenScientist runs on the
    other two hypothesis groups, each of which judged it more parsimonious than
    the model it was asked about, since it needs no enzyme nobody has found and
    no inhibition at concentrations nobody has measured. That is a reason to
    track it, not a reason to prefer it: nothing yet connects it to oxalate in a
    patient. No causal edge in this entry opts into this group, because the
    entry has no node for pyruvate supply or Krebs-cycle flux to attach one to.
discussions:
- discussion_id: gap_ph3_oxalate_overproduction_mechanism
  prompt: >-
    Given that HOGA1 deficiency blocks the mitochondrial conversion of
    4-hydroxy-2-oxoglutarate to glyoxylate, by what route does endogenous
    oxalate production nonetheless increase in PH3 — cytosolic cleavage of
    accumulated 4-hydroxy-2-oxoglutarate by a non-HOGA1 aldolase, substrate
    inhibition of glyoxylate reductase, or another mechanism — and why do only a
    minority of biallelic HOGA1 carriers develop clinical hyperoxaluria?
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: >-
    The paradox of increased oxalate despite a functional block upstream of
    glyoxylate is unresolved; competing cytosolic-aldolase models and
    glyoxylate-reductase-inhibition models are proposed but not established, and the
    incomplete penetrance of the HOGA1 genotype is unexplained.
    Two OpenScientist hypothesis-exploration runs (kb/hypotheses/) narrowed the
    question without closing it. Against the cytosolic-cleavage account: the
    enzyme is unidentified, its one tested candidate does not cleave HOG, and
    mouse data put the residual activity in mitochondria while the cytosol
    diverts HOG to a dead end. Against glyoxylate-reductase inhibition:
    measured patient HOG sits two to three orders of magnitude below the
    inhibition constant, as the source paper itself notes. A third proposal,
    reduced pyruvate and Krebs-cycle flux, is now tracked as
    hoga1_loss_pyruvate_krebs_flux. Neither run could reach the measurement
    that would discriminate between them, which is the same one in both cases:
    compartment-resolved HOG concentration and HOG-to-oxalate flux in human
    hepatocytes. Two findings also question whether any single hepatocyte-local
    mechanism is the right shape of answer - the knockout mouse is not
    hyperoxaluric even with human-like peroxisomal AGT, and hepatic LDH
    knockdown that works in PH1 does not work in PH3.
  attaches_to:
  - pathophysiology#Cytosolic Glyoxylate-to-Oxalate Overproduction
notes: >-
  IEMbase package seed WP-003, classification code 1.7.02.02
  (HOGA1-related mitochondrial 4-hydroxy-2-oxoglutarate aldolase 1 deficiency);
  OMIM:613616; ORPHA:93600. MONDO provides an exact disease term
  (MONDO:0013327), so PH3 is curated as a separate Disease entry and added to
  the Disorders of Glyoxylate and Oxalate Metabolism grouping alongside PH1 and
  PH2. The gene was originally reported as DHDPSL before being renamed HOGA1.

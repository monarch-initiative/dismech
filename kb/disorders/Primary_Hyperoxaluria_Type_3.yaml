      term:
        id: CHEBI:64733
        label: potassium citrate (anhydrous)
  evidence:
  - reference: PMID:26401545
    reference_title: "Primary Hyperoxaluria Type 3."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "potassium and/or sodium citrate"
    explanation: GeneReviews supports citrate crystallization inhibitors as part of PH3 supportive management.
discussions:
- discussion_id: gap_ph3_oxalate_overproduction_mechanism
  prompt: >-
    Given that HOGA1 deficiency blocks the mitochondrial conversion of
    4-hydroxy-2-oxoglutarate to glyoxylate, by what route does endogenous
    oxalate production nonetheless increase in PH3 — cytosolic cleavage of
    accumulated 4-hydroxy-2-oxoglutarate by a non-HOGA1 aldolase, substrate
    inhibition of glyoxylate reductase, or another mechanism — and why do only a
    minority of biallelic HOGA1 carriers develop clinical hyperoxaluria?
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: >-
    The paradox of increased oxalate despite a functional block upstream of
    glyoxylate is unresolved; competing cytosolic-aldolase models and
    glyoxylate-reductase-inhibition models are proposed but not established, and the
    incomplete penetrance of the HOGA1 genotype is unexplained.
  attaches_to:
  - pathophysiology#Cytosolic Glyoxylate-to-Oxalate Overproduction
notes: >-
  IEMbase package seed WP-003, classification code 1.7.02.02
  (HOGA1-related mitochondrial 4-hydroxy-2-oxoglutarate aldolase 1 deficiency);
  OMIM:613616; ORPHA:93600. MONDO provides an exact disease term
  (MONDO:0013327), so PH3 is curated as a separate Disease entry and added to
  the Disorders of Glyoxylate and Oxalate Metabolism grouping alongside PH1 and
  PH2. The gene was originally reported as DHDPSL before being renamed HOGA1.

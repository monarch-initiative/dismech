treatments:
- name: High Fluid Intake and Crystallization Inhibitors
  description: >-
    Supportive management aims to reduce urinary calcium oxalate supersaturation
    through high fluid intake and urinary crystallization inhibitors (e.g.,
    potassium citrate), with dietary measures to limit stone formation. There is
    no HOGA1-specific targeted therapy approved for PH3.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
    therapeutic_agent:

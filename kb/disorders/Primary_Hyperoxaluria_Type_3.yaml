    evidence_source: HUMAN_CLINICAL
    snippet: "an allelic fragment shared by all patients of Ashkenazi Jewish descent and"
    explanation: Identifies an Ashkenazi Jewish founder allele bearing a 3 bp deletion in HOGA1 (DHDPSL).
    reference_title: Mutations in DHDPSL are responsible for primary hyperoxaluria type III
- name: AGXT
  gene_term:
    preferred_term: AGXT
    term:
      id: hgnc:341
      label: AGXT
  relationship_type: MODIFIER
  notes: >-
    AGXT is not the primary PH3 disease gene, but a reported family with
    homozygous HOGA1 p.P190L plus heterozygous AGXT p.D201E had a more severe
    phenotype than HOGA1 p.P190L alone, suggesting a possible oligogenic
    modifier effect in selected families. Note this entry does NOT bind an
    oligogenic inheritance term (HP:0010983) and is not a member of the Digenic
    and Oligogenic Disorders grouping: biallelic HOGA1 causes PH3 by itself,
    and the quoted "triallelic inheritance" describes a severity difference in
    two sisters, not a third allele the disease requires.
  evidence:
  - reference: PMID:22781098
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The two girls exhibiting triallelic inheritance presented a more severe phenotype"
    explanation: Supports AGXT as a potential modifier of PH3 severity in one triallelic family.
    reference_title: Novel findings in patients with primary hyperoxaluria type III and implications for advanced molecular testing strategies

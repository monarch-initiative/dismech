clinical_burden:
  burden_level: VARIABLE
  rationale: >-
    Sex splits the burden almost completely. In males the condition is lethal in the
    perinatal period or before: three pregnancies were terminated after antenatal
    detection of skeletal abnormalities and hydrocephaly, and the one male born
    alive died at six days. In females it is a survivable condition of short
    stature, sometimes asymmetry, and mild cognitive impairment. VARIABLE is the
    honest level for a disorder whose burden is near-total in one sex and moderate
    in the other; it should not be read as uncertainty about either.
  evidence:
  - reference: PMID:16001442
    reference_title: "X-linked dominant chondrodysplasia with platyspondyly, distinctive brachydactyly, hydrocephaly, and microphthalmia."
    supports: SUPPORT

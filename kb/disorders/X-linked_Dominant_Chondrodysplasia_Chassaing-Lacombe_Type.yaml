discussions:
- discussion_id: hdac6_tubulin_to_growth_plate_gap
  status: OPEN
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Alpha-Tubulin Hypoacetylation
  - phenotypes#Platyspondyly
  prompt: >-
    How does alpha-tubulin hypoacetylation, measured in fetal thymus, produce
    platyspondyly and metaphyseal cupping? No published work examines cartilage,
    the growth plate, or chondrocytes in this disorder.
  rationale: >-
    This is the load-bearing gap in the entry and the reason the pathograph has no
    edge from the molecular node to any skeletal phenotype. Everything upstream is
    measured: the variant, the loss of miR-433 repression, the protein excess, the
    acetylation change. Everything downstream is described clinically. The join
    between them is asserted nowhere, and the tissue in which the biochemistry was
    measured - thymus, taken because it was what was available from a terminated
    pregnancy - is not the tissue the disease is about.

    It would be easy to write an edge here from general knowledge about
    microtubules in chondrocytes, and that edge would validate. It is left out
    deliberately.
  proposed_experiments:
  - experiment_id: hdac6_chondrocyte_acetylation
    name: Acetylated alpha-tubulin and HDAC6 levels in growth-plate cartilage from an affected fetus
    description: >-
      Repeat the measurement made in thymus on cartilage or growth plate from an
      affected male, establishing whether the acetylation change occurs in the
      tissue that is actually malformed. This is the minimum result that would
      license a causal edge from the molecular node to the skeletal phenotypes.
    readouts:
    - name: Acetylated alpha-tubulin in growth-plate chondrocytes
      target: pathophysiology#Alpha-Tubulin Hypoacetylation
      direction: DECREASED
      interpretation: >-
        A reduction in cartilage comparable to that seen in thymus would extend the
        evidenced chain into the affected tissue.
  - experiment_id: hdac6_overexpression_chondrocyte
    name: Chondrocyte-directed HDAC6 over-expression in a mouse
    description: >-
      The disease-matched manipulation, which has never been done. All existing
      mouse work removes or inhibits HDAC6; nothing over-expresses it in cartilage.
      A model over-expressing HDAC6 in chondrocytes would test whether excess is
      sufficient for the skeletal phenotype, and would also test the FGFR3
      hypothesis directly by allowing FGFR3 levels to be measured in the growth
      plate.
    readouts:
    - name: Growth plate architecture and FGFR3 accumulation
      target: pathophysiology#Alpha-Tubulin Hypoacetylation
      direction: ALTERED
      interpretation: >-
        Shortened long bones with raised growth-plate FGFR3 would support the
        FGFR3-stabilization hypothesis; a skeletal phenotype without an FGFR3
        change would refute it while still confirming sufficiency.
- discussion_id: hdac6_single_family_replication
  status: OPEN
  kind: KNOWLEDGE_GAP
  attaches_to:
  - genetic#HDAC6
  prompt: >-
    Has any second family with this disorder, or any other pathogenic HDAC6 3' UTR
    allele, been reported since 2010?
  rationale: >-
    The gene-disease relationship rests entirely on one pedigree. Sixteen years on,
    a PubMed search for HDAC6 with chondrodysplasia, platyspondyly or Chassaing
    (run 2026-09-21) returns no second family. That is expected for an ultra-rare
    condition, but it also means the attribution has never been independently
    tested, and that non-coding variants of this class are systematically invisible
    to the coding-region analyses most diagnostic labs run - so absence of further
    reports is weak evidence either way. Worth revisiting if a UTR-aware
    reanalysis cohort is published.
- discussion_id: hdac6_clinvar_missense_candidate
  status: OPEN
  kind: OPEN_QUESTION
  attaches_to:
  - genetic#HDAC6
  prompt: >-
    ClinVar carries a missense candidate, NM_006044.4(HDAC6):c.2090C>T
    (p.Thr697Ile), annotated to this disease. Is there allelic heterogeneity here
    beyond the single 3' UTR variant?
  rationale: >-
    Surfaced by the deep-research pass for this entry, which reports it as
    RCV001198391 and explicitly notes it was not independently validated there.
    It is not curated in `genetic`, for two reasons. The ClinVar record was not
    retrieved and read as part of this curation, so its assertion criteria,
    submitter and classification are unknown here; and a coding missense allele
    would be a mechanistically different lesion from a 3' UTR dosage variant -
    it would change the protein rather than the amount of it - so adding it to
    the same `genetic` row would assert an allelic series that has not been
    argued.

    Worth resolving, because it bears directly on the entry's framing. The whole
    case for a hypermorphic dosage mechanism rests on the causal allele being
    non-coding and the protein being normal. A validated pathogenic coding allele
    would either widen the disease or indicate that the ClinVar annotation is
    mis-assigned, and which of those it is changes how this entry should read.

    Resolving it means reading the ClinVar record directly - submitter, review
    status, evidence - not taking the count from a report.

name: X-linked Dominant Chondrodysplasia Chassaing-Lacombe Type
creation_date: "2026-09-21T00:00:00Z"
description: >-
  An X-linked dominant chondrodysplasia with severe platyspondyly, a distinctive
  metaphyseal cupping of the short tubular bones, hydrocephaly and microphthalmia,
  described in one four-generation family. It is mechanistically unusual in two
  ways. First, the causal lesion is not in a coding sequence: a single base change
  in the 3' untranslated region of HDAC6 destroys the seed-match for hsa-miR-433,
  so the microRNA can no longer repress the transcript and HDAC6 protein is
  over-produced. It is, as far as the reporting authors could establish, the first
  skeletal disease attributed to the loss of a microRNA-mediated regulatory
  interaction rather than to a change in a protein. Second, the direction of
  effect is a gain rather than a loss: the downstream biochemical consequence
  measured in affected tissue is a profound reduction in acetylated alpha-tubulin,
  which is what an excess of a tubulin deacetylase should do.

  The X-linked dominant pattern is expressed with striking sex difference. Affected
  males died perinatally or had their pregnancies terminated for skeletal
  abnormalities and hydrocephaly; carrier females had short stature, sometimes body
  asymmetry, and mild cognitive impairment. In one affected female the asymmetry
  was traced to X-inactivation: fibroblasts from the hypotrophic left arm expressed
  the mutant allele in about a third of cells and overexpressed HDAC6, while
  fibroblasts from the unaffected right arm did not express it at all.
category: Mendelian
parents:
- Chondrodysplasia
disease_term:
  preferred_term: X-linked dominant chondrodysplasia, Chassaing-Lacombe type
  term:

synonyms:
- CDPX-Chassaing-Lacombe
- X-linked dominant chondrodysplasia with platyspondyly, distinctive brachydactyly, hydrocephaly and microphthalmia
- HDAC6-related X-linked chondrodysplasia
notes: >-
  Entry scope. Curated as a single DISEASE. The stub recorded no MONDO descendants
  and one causal gene, hgnc:14064 HDAC6 (read from
  stubs/X-linked_Dominant_Chondrodysplasia_Chassaing-Lacombe_Type.yaml). The entire
  published literature on the disorder is two papers about one family - the
  clinical description (PMID:16001442) and the molecular identification
  (PMID:20181727) - so there is one pathograph and no basis for subtypes.

  The evidence base is a single pedigree and the entry is written to make that
  visible rather than to read like a characterised disease. Nothing here has been
  replicated in a second family. The genotype-phenotype attribution rests on
  segregation across four generations plus three lines of functional work in the
  molecular paper, which is strong for an n-of-1 family but is not independent
  replication.

  The biggest gap is deliberately left open rather than papered over. There is a
  measured molecular consequence (alpha-tubulin hypoacetylation in affected fetal
  tissue) and a well-described skeletal phenotype, and nothing published connects
  them. No chondrocyte or growth-plate study of this variant exists, and no animal
  model of it has been made. The pathograph therefore stops at the biochemical
  node, and the candidate bridge - HDAC6 acting on FGFR3 stability, which would
  put this disorder on the canonical chondrodysplasia pathway - is recorded as an
  EMERGING hypothesis in `mechanistic_hypotheses` and as a knowledge gap with a
  proposed experiment, not as a causal edge.

  Module conformance checked and left unset. `just list-modules` was read and
  `kb/modules/` grepped for `chondro`, `cartilage`, `growth plate`, `endochondral`,
  `microtubule`, `tubulin`, `cilia` and `deacetyl`. The ciliopathy module
  (`ciliopathy_dysfunction`) is the nearest thematic neighbour and was rejected
  on positive grounds: HDAC6 does act on ciliary disassembly, but nothing in either
  paper about this disease examines cilia, and conforming on the strength of a
  general HDAC6 property would assert a mechanism the disease's own literature
  does not.

  No GeneReviews chapter exists for this disorder. Checked offline with
  `just check-genereviews kb/disorders/X-linked_Dominant_Chondrodysplasia_Chassaing-Lacombe_Type.yaml`
  against the committed Bookshelf index; it reports NO_CHAPTER. The phenotype
  baseline is the 2005 clinical description of the family.

  Deep-research provenance.
  `research/X-linked_Dominant_Chondrodysplasia_Chassaing-Lacombe_Type-deep-research-openscientist.md`
  (provider openscientist, 14 citations, all 14 resolved, confabulation rate 0.0).
  `just preflight-dr` returns PASS against MONDO:0010463, with HDAC6 mentioned 81
  times and no rival gene above 9.

  Reconciling it against this entry contributed two things and was declined on a
  third. It supplied the Hdac6-knockout mouse (PMID:18180281), which sharpens the
  dosage argument considerably and is curated in `animal_models`; and it supplied
  the primary-cilium bridge (PMID:17604723), now carried alongside the FGFR3 one
  as a second EMERGING hypothesis rather than instead of it. Its own causal chain
  marks steps 4-6 [INFERRED] and states that the ciliary-Hedgehog mechanism is
  "inferred, not directly demonstrated in patients", which is the same reading
  this entry had already reached independently and is why `conforms_to
  ciliopathy_dysfunction` stays unset.

  What was NOT taken from it: its phenotype table lists intrauterine growth
  retardation, macrocephaly, frontal bossing, low-set ears, thin ribs, eleven rib
  pairs, iliac wing hypoplasia and poor skull mineralization, attributing them to
  PMID:16001442 and the OMIM 300863 clinical synopsis. Those features are almost
  certainly real, but none of them appears in the cached abstract of
  PMID:16001442, which is the only text this repository can verify a snippet
  against, and OMIM clinical synopses are not a citable quotable source here. They
  are left out rather than curated against a quote that does not exist. The same
  applies to its LOD score of 3.30 and its bone-histology description. This is a
  genuine coverage cost of the exact-quote rule and it is recorded rather than
  worked around.

  It also reports a ClinVar missense candidate, NM_006044.4(HDAC6):c.2090C>T
  (p.Thr697Ile), RCV001198391, annotated to this disease and not independently
  validated. Not curated; recorded in `discussions`.
references:
- reference: PMID:16001442
  title: "X-linked dominant chondrodysplasia with platyspondyly, distinctive brachydactyly, hydrocephaly, and microphthalmia."
  tags: []
  findings:
  - statement: >-
      The clinical description: one family, four affected males and six affected
      females over four generations, with severe platyspondyly and distinctive
      metaphyseal cupping in males who died perinatally, and short stature with
      body asymmetry in the less severely affected females.
- reference: PMID:20181727
  title: "A mutation in the 3'-UTR of the HDAC6 gene abolishing the post-transcriptional regulation mediated by hsa-miR-433 is linked to a new form of dominant X-linked chondrodysplasia."
  tags: []
  findings:
  - statement: >-
      The molecular identification. A 3'-UTR variant in the hsa-miR-433 seed site
      of HDAC6 segregating fully with the disease, reporter assays showing loss of
      miR-433 repression, HDAC6 over-expression with profoundly reduced acetylated
      alpha-tubulin in affected fetal thymus, and allele-specific expression in
      fibroblasts from the two arms of an asymmetric female.
- reference: PMID:12024216
  title: "HDAC6 is a microtubule-associated deacetylase."
  tags: []
  findings:
  - statement: >-
      Establishes the enzymatic identity this disease depends on: HDAC6 is the
      tubulin deacetylase, and its overexpression causes global deacetylation of
      alpha-tubulin.
- reference: PMID:27506979
  title: "HDAC6 deficiency or inhibition blocks FGFR3 accumulation and improves bone growth in a model of achondroplasia."
  tags: []
  findings:
  - statement: >-
      Cited for the untested hypothesis only. Shows that FGFR3 accumulation depends
      on HDAC6 and that deleting or inhibiting HDAC6 improves growth-plate bone
      growth in a mouse chondrodysplasia model - the inverse manipulation to the one
      this disease represents.
- reference: PMID:18180281
  title: "Mice lacking histone deacetylase 6 have hyperacetylated tubulin but are viable and develop normally."
  tags: []
  findings:
  - statement: >-
      The dosage control. Mice with no HDAC6 at all are viable and fertile with
      hyperacetylated tubulin in most tissues, and losing the gene produces only a
      small increase in cancellous bone mineral density - which the authors read as
      a minor role in bone biology. Losing HDAC6 is close to silent in the skeleton;
      having too much of it is lethal in males.
- reference: PMID:17604723
  title: "HEF1-dependent Aurora A activation induces disassembly of the primary cilium."
  tags: []
  findings:
  - statement: >-
      Cited for the second untested hypothesis only. Establishes that HDAC6 is the
      effector of regulated ciliary resorption, activated at the basal body by an
      Aurora A / HEF1 pathway that is necessary and sufficient for disassembly, and
      that inhibiting HDAC6 stabilizes cilia.
inheritance:
- name: X-linked dominant
  inheritance_term:
    preferred_term: X-linked dominant inheritance
    term:
      id: HP:0001423
      label: X-linked dominant inheritance
  description: >-
    Transmitted through four generations with both sexes affected and a marked
    sex difference in severity: affected males died in the perinatal period or had
    pregnancies terminated, affected females survived with a milder phenotype. The
    variant is in the 3' untranslated region and segregates completely with the
    disease in the family.
  evidence:
  - reference: PMID:16001442
    reference_title: "X-linked dominant chondrodysplasia with platyspondyly, distinctive brachydactyly, hydrocephaly, and microphthalmia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe a family with an X-linked dominant chondrodysplasia. Four males and six females were affected through four generations."
    explanation: "Establishes the inheritance pattern and the numbers of affected individuals of each sex."
  - reference: PMID:20181727
    reference_title: "A mutation in the 3'-UTR of the HDAC6 gene abolishing the post-transcriptional regulation mediated by hsa-miR-433 is linked to a new form of dominant X-linked chondrodysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We have identified a variant (c.*281A>T) in the 3' untranslated region (UTR) of the HDAC6 gene that totally segregates with the disease."
    explanation: "Complete segregation of the variant with the phenotype in the pedigree."
mechanistic_hypotheses:
- hypothesis_group_id: hdac6_fgfr3_stabilization
  hypothesis_label: HDAC6 excess acts on the growth plate by stabilizing FGFR3
  status: EMERGING
  description: >-
    Nothing published connects the measured tubulin hypoacetylation in this disease
    to its skeletal phenotype. The most economical bridge is FGFR3. In a mouse model
    of thanatophoric dysplasia, FGFR3 accumulation depends on HDAC6: cells lacking
    HDAC6, or treated with an HDAC6 inhibitor, degrade FGFR3 through a
    lysosome-dependent route, and deleting HDAC6 or giving tubacin reduces FGFR3 in
    the growth plate and improves endochondral bone growth. That is the inverse of
    the manipulation this disease represents, so an excess of HDAC6 would be
    predicted to stabilize FGFR3 and push signalling in the direction that already
    causes the FGFR3 chondrodysplasias - the group this disorder's radiographic
    phenotype most resembles.

    It is recorded as EMERGING and not as a causal edge because it is an inference
    across two literatures. FGFR3 has never been measured in tissue from this
    family, the growth plate has never been examined, and the direction of effect
    has only ever been tested by removing HDAC6, not by over-expressing it in
    chondrocytes. It is offered as the experiment worth doing, not as what is
    happening.
  evidence:
  - reference: PMID:27506979
    reference_title: "HDAC6 deficiency or inhibition blocks FGFR3 accumulation and improves bone growth in a model of achondroplasia."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "Using a mouse model of Thanatophoric Dysplasia Type II (TDII) we show that both HDAC6 deletion and treatment with the small molecule HDAC6 inhibitor tubacin reduced FGFR3 accumulation in the growth plate and improved endochondral bone growth."
    explanation: "The whole basis of the hypothesis, and the reason it is INDIRECT: the manipulation is HDAC6 removal in a different disease model, and the inference to HDAC6 excess in this disease is the curator's, not the authors'."
- hypothesis_group_id: hdac6_ciliary_resorption
  hypothesis_label: HDAC6 excess acts on the growth plate by destabilizing the primary cilium
  status: EMERGING
  description: >-
    The second candidate bridge across the same gap, and the one an independent
    deep-research pass proposed. HDAC6 is the effector of regulated primary-cilium
    disassembly: at the ciliary basal body, HEF1/NEDD9 and Aurora A phosphorylate
    and activate it, and that pathway is reported to be both necessary and
    sufficient for ciliary resorption, with HDAC6 inhibitors stabilizing cilia.
    Growth-plate chondrocytes depend on the primary cilium for Hedgehog signalling,
    so constitutively elevated HDAC6 would be predicted to shorten or destabilize
    chondrocyte cilia and attenuate that signal.

    It is attractive because it explains the tubulin phenotype and the skeletal
    phenotype with one mechanism, where the FGFR3 hypothesis explains the skeletal
    phenotype through a route that does not obviously involve tubulin acetylation
    at all. It is recorded as EMERGING for the same reason: no cilium has been
    examined in any tissue from this family, the Aurora A/HEF1 work is in
    tumour-derived cells rather than chondrocytes, and the inference is from
    HDAC6's general biology rather than from anything measured in this disease.

    The two hypotheses are not mutually exclusive, and are deliberately both
    recorded rather than adjudicated. Neither has been tested.
  evidence:
  - reference: PMID:17604723
    reference_title: "HEF1-dependent Aurora A activation induces disassembly of the primary cilium."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "we show that interactions between the prometastatic scaffolding protein HEF1/Cas-L/NEDD9 and the oncogenic Aurora A (AurA) kinase at the basal body of cilia causes phosphorylation and activation of HDAC6, a tubulin deacetylase, promoting ciliary disassembly"
    explanation: "Establishes HDAC6 as the effector of ciliary disassembly, which is the whole basis of the hypothesis. INDIRECT: the inference to chondrocyte cilia in this disease is the curator's, not the authors'."
  - reference: PMID:17604723
    reference_title: "HEF1-dependent Aurora A activation induces disassembly of the primary cilium."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "Moreover, we demonstrate that small molecule inhibitors of AurA and HDAC6 selectively stabilize cilia from regulated resorption cues, suggesting a novel mode of action for these clinical agents."
    explanation: "Shows the relationship is pharmacologically reversible, which is what would make the hypothesis testable and, if true, actionable."
pathophysiology:
- name: Loss of miR-433 Repression at the HDAC6 3' UTR
  biological_scale: MOLECULAR
  role: Initiating genetic lesion
  description: >-
    The single base substitution c.*281A>T falls inside the seed-match for
    hsa-miR-433 in the HDAC6 3' untranslated region. In reporter assays miR-433
    represses both endogenous HDAC6 and a construct carrying the wild-type 3' UTR,
    and that repression is abolished when the construct carries the mutant 3' UTR.
    The coding sequence is untouched: the protein that gets made is normal, there
    is simply more of it.
  genetic_context:
    gene:
      preferred_term: HDAC6
      term:
        id: hgnc:14064
        label: HDAC6
    variant_origin: GERMLINE
    allele_type: SNV
    zygosity: HEMIZYGOUS
    functional_impact_category: HYPERMORPHIC
    description: >-
      A non-coding regulatory allele. HYPERMORPHIC rather than GAIN_OF_FUNCTION
      because the protein's activity is unaltered - only its abundance increases.
      Zygosity is recorded as hemizygous for the affected males; carrier females are
      heterozygous and mosaic by X-inactivation, which is modelled as its own node.
  genes:
  - preferred_term: HDAC6
    term:
      id: hgnc:14064
      label: HDAC6
  evidence:
  - reference: PMID:20181727
    reference_title: "A mutation in the 3'-UTR of the HDAC6 gene abolishing the post-transcriptional regulation mediated by hsa-miR-433 is linked to a new form of dominant X-linked chondrodysplasia."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "The variant is located in the seed sequence of hsa-miR-433."
    explanation: "Places the variant precisely in the regulatory element whose loss this node asserts."
  - reference: PMID:20181727
    reference_title: "A mutation in the 3'-UTR of the HDAC6 gene abolishing the post-transcriptional regulation mediated by hsa-miR-433 is linked to a new form of dominant X-linked chondrodysplasia."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: "This effect was totally abrogated when the reporter mRNA bore the mutated HDAC6 3'-UTR."
    explanation: "The reporter experiment demonstrating that the variant abolishes miR-433 repression, rather than merely sitting in a predicted binding site."
  downstream:
  - target: HDAC6 Overexpression
    description: Derepression of the transcript raises HDAC6 protein levels.
    evidence:
    - reference: PMID:20181727
      reference_title: "A mutation in the 3'-UTR of the HDAC6 gene abolishing the post-transcriptional regulation mediated by hsa-miR-433 is linked to a new form of dominant X-linked chondrodysplasia."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "hsa-miR-433 (miR433) down-regulated both the expression of endogenous HDAC6 and that of an enhanced green fluorescent protein-reporter mRNA bearing the wild-type 3'-UTR of HDAC6"
      explanation: "Establishes that miR-433 normally holds HDAC6 down, so losing the site raises it."
- name: HDAC6 Overexpression
  biological_scale: MOLECULAR
  role: Primary molecular consequence
  description: >-
    HDAC6 protein is over-expressed in affected tissue. This was shown in two
    independent materials from the family: thymus from an affected male fetus, and
    fibroblasts cultured from the hypotrophic arm of an asymmetric affected female.
  molecular_functions:
  - preferred_term: HDAC6 tubulin deacetylase activity
    term:
      id: GO:0042903
      label: tubulin deacetylase activity
    modifier: INCREASED
  evidence:
  - reference: PMID:20181727
    reference_title: "A mutation in the 3'-UTR of the HDAC6 gene abolishing the post-transcriptional regulation mediated by hsa-miR-433 is linked to a new form of dominant X-linked chondrodysplasia."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "The HDAC6 protein was found to be over-expressed in thymus from an affected male fetus."
    explanation: "Direct measurement of the protein excess in tissue from an affected individual."
  - reference: PMID:12024216
    reference_title: "HDAC6 is a microtubule-associated deacetylase."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "In vivo, the overexpression of HDAC6 leads to a global deacetylation of alpha-tubulin, whereas a decrease in HDAC6 increases alpha-tubulin acetylation."
    explanation: "Independent cell-biology establishing that HDAC6 excess is sufficient to deacetylate alpha-tubulin globally. INDIRECT because it is not this disease's tissue."
  downstream:
  - target: Alpha-Tubulin Hypoacetylation
    description: >-
      An excess of the tubulin deacetylase strips the acetyl mark from alpha-tubulin.
    evidence:
    - reference: PMID:20181727
      reference_title: "A mutation in the 3'-UTR of the HDAC6 gene abolishing the post-transcriptional regulation mediated by hsa-miR-433 is linked to a new form of dominant X-linked chondrodysplasia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Concomitantly, the level of total alpha-tubulin, a target of HDAC6, was found to be increased in the affected fetal thymus, whereas the level of acetylated alpha-tubulin was found to be profoundly decreased."
      explanation: "The acetylation change measured in the same affected tissue as the protein excess."
- name: Alpha-Tubulin Hypoacetylation
  biological_scale: MOLECULAR
  role: Terminal measured molecular abnormality
  description: >-
    Acetylated alpha-tubulin is profoundly reduced in affected fetal tissue while
    total alpha-tubulin rises. Acetylation marks stable microtubule populations, so
    this is a shift of the cytoskeleton toward a more dynamic, less stable state.

    This is where the evidenced chain stops. No published work links this change to
    cartilage, the growth plate, or any of the skeletal features, in this disease or
    in any model of it. The node is curated as the last thing actually measured, and
    the gap between it and the phenotype is recorded in `discussions` rather than
    bridged with a plausible-sounding edge.
  biological_processes:
  - preferred_term: alpha-tubulin deacetylation
    term:
      id: GO:0006476
      label: protein deacetylation
    modifier: INCREASED
  cellular_components:
  - preferred_term: microtubule
    term:
      id: GO:0005874
      label: microtubule
  evidence:
  - reference: PMID:20181727
    reference_title: "A mutation in the 3'-UTR of the HDAC6 gene abolishing the post-transcriptional regulation mediated by hsa-miR-433 is linked to a new form of dominant X-linked chondrodysplasia."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "the level of acetylated alpha-tubulin was found to be profoundly decreased"
    explanation: "The measurement itself, in tissue from an affected fetus."
  - reference: PMID:12024216
    reference_title: "HDAC6 is a microtubule-associated deacetylase."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "Acetylated alpha-tubulin is most abundant in stable microtubules but is absent from dynamic cellular structures such as neuronal growth cones and the leading edges of fibroblasts."
    explanation: "Supplies the interpretation of the measurement - what losing the acetyl mark means for microtubule stability."
- name: Mosaic HDAC6 Overexpression by Random X-Inactivation
  biological_scale: CELLULAR
  role: Modifier of expressivity in females
  description: >-
    Carrier females are cellular mosaics for which X is active, so the proportion of
    cells over-expressing HDAC6 varies between tissues and between body regions. In
    the one female studied this produced measurable left-right asymmetry: fibroblasts
    from the hypotrophic left arm expressed the mutant allele in 31% of cells and
    over-expressed HDAC6, while fibroblasts from the normal right arm did not express
    it at all. This is the mechanism of the milder and patchier female phenotype, and
    it is directly evidenced rather than assumed.
  biological_processes:
  - preferred_term: random X-inactivation in carrier females
    term:
      id: GO:0060816
      label: random inactivation of X chromosome
  evidence:
  - reference: PMID:20181727
    reference_title: "A mutation in the 3'-UTR of the HDAC6 gene abolishing the post-transcriptional regulation mediated by hsa-miR-433 is linked to a new form of dominant X-linked chondrodysplasia."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mutated HDAC6 allele was expressed in 31% of left arm-derived fibroblasts, whereas it was not expressed in the right arm."
    explanation: "Allele-specific expression measured separately in the affected and unaffected limb of the same patient - an internally controlled demonstration that the asymmetry tracks allelic expression."
  - reference: PMID:20181727
    reference_title: "A mutation in the 3'-UTR of the HDAC6 gene abolishing the post-transcriptional regulation mediated by hsa-miR-433 is linked to a new form of dominant X-linked chondrodysplasia."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Skin biopsies were obtained from a female patient who presented a striking body asymmetry with hypotrophy of the left limbs."
    explanation: "Establishes the clinical asymmetry that the allele-specific expression explains."
  downstream:
  - target: Lower limb asymmetry
    description: Regional differences in the proportion of cells over-expressing HDAC6.
    evidence:
    - reference: PMID:20181727
      reference_title: "A mutation in the 3'-UTR of the HDAC6 gene abolishing the post-transcriptional regulation mediated by hsa-miR-433 is linked to a new form of dominant X-linked chondrodysplasia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Overexpression of HDAC6 was observed in left arm-derived fibroblasts."
      explanation: "Links the regional overexpression to the hypotrophic side."
animal_models:
- name: Hdac6-knockout mouse
  species: Mouse
  genotype: Hdac6 global knockout (homologous recombination in ES cells)
  publication: PMID:18180281
  description: >-
    The dosage control rather than a disease model, and it is curated because of
    what it does not show. Mice with no HDAC6 at all are viable and fertile, with
    hyperacetylated tubulin in most tissues - the exact mirror of the biochemical
    state measured in affected fetal tissue in this disease. Losing the gene
    produces only a small increase in cancellous bone mineral density, which the
    authors describe as a minor role in bone biology.

    Two things follow. The skeleton tolerates complete absence of HDAC6 almost
    without comment, so the severe skeletal disease here cannot be a loss of
    function and must be a consequence of excess - which is the argument for
    `HYPERMORPHIC` on the lesion node. And no mouse exists that models the disease:
    every published manipulation removes or inhibits HDAC6, none over-expresses it
    in cartilage.
  modeled_mechanisms:
  - target: HDAC6 Overexpression
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      The knockout is the opposite manipulation to the disease lesion. It is
      informative about HDAC6 dosage and uninformative about this disorder's
      pathogenesis.
    limitations: >-
      Removing HDAC6 cannot model over-expressing it, and the resulting tubulin
      state is hyperacetylation rather than the hypoacetylation measured in
      patients. The animal is normal where the disease is lethal, so the model has
      no phenotype to compare. It is curated as a negative control on the direction
      of effect, not as a model of the disease.
    evidence:
    - reference: PMID:18180281
      reference_title: "Mice lacking histone deacetylase 6 have hyperacetylated tubulin but are viable and develop normally."
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: "HDAC6-deficient mice are viable and fertile and show hyperacetylated tubulin in most tissues."
      explanation: "A REFUTE item against any reading of this disease as HDAC6 loss of function: losing HDAC6 entirely produces a normal, fertile animal."
    - reference: PMID:18180281
      reference_title: "Mice lacking histone deacetylase 6 have hyperacetylated tubulin but are viable and develop normally."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Furthermore, the lack of HDAC6 results in a small increase in cancellous bone mineral density, indicating that this deacetylase plays a minor role in bone biology."
      explanation: "Quantifies how little the skeleton depends on HDAC6 being present, which is what makes the severity of the excess phenotype notable."
phenotypes:
- name: Platyspondyly
  category: Radiographic
  description: >-
    Severe flattening of the vertebral bodies, the dominant radiographic feature in
    affected males.
  diagnostic: true
  phenotype_term:
    preferred_term: Platyspondyly
    term:
      id: HP:0000926
      label: Platyspondyly
  evidence:
  - reference: PMID:16001442
    reference_title: "X-linked dominant chondrodysplasia with platyspondyly, distinctive brachydactyly, hydrocephaly, and microphthalmia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Radiographs showed severe platyspondyly and various bone abnormalities including a distinctive metaphyseal cupping of the metacarpals, metatarsals, and phalanges."
    explanation: "The radiographic finding in the four affected males."
- name: Metaphyseal cupping
  category: Radiographic
  description: >-

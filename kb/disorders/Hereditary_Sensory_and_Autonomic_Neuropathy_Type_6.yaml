    reference_title: "Impaired fast axonal transport in neurons of the sciatic nerves from dystonia musculorum mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Loss of function of dystonin/Bpag1 within neurons leads to a loss in the
      maintenance of cytoskeletal organization and to the development of focal
      axonal swellings prior to death of the neuron.
    explanation: >-
      Places the focal swellings, the morphological signature of transport failure,
      before neuronal death in the sequence.
  downstream:
  - target: Dorsal Root Ganglion Sensory Neuron Degeneration
    causal_link_type: DIRECT

- name: Impaired Autophagic Flux
  biological_scale: CELLULAR
  description: >
    Autophagy depends on stable microtubules and motor-driven transport, so it
    fails for the same structural reason transport does. Autophagosomes accumulate,
    LC3-II rises, and the substrates SQSTM1/p62 and polyubiquitinated proteins are
    not turned over.
  cell_types:

  evidence:
  - reference: PMID:40938507
    reference_title: "Rare autosomal recessive hereditary sensory and autonomic neuropathy type VI in a Pakistani family caused by a novel DST variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      HSAN-VI (OMIM: 614653) is an autosomal recessive subtype which manifests
      severe pain insensitivity, neonatal hypotonia, respiratory and feeding
      difficulties, lack of psychomotor development and autonomic abnormalities.
    explanation: >-
      Cited for the autonomic abnormalities of which alacrima is the classical
      ocular sign. The quote names the class, not alacrima specifically.
- category: Neurological
  name: Sensory ataxia
  description: >
    Ataxia from loss of proprioceptive afferents rather than from cerebellar
    disease. Prominent in the mouse, and part of the adult-onset human picture.
  phenotype_term:
    preferred_term: Sensory ataxia
    term:
      id: HP:0010871
      label: Sensory ataxia
  evidence:
  - reference: PMID:32445516
    reference_title: "Disruption of dystonin in Schwann cells results in late-onset neuropathy and sensory ataxia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Dystonin (Dst) is a causative gene for Dystonia musculorum (dt) mice, which is
      an inherited disorder exhibiting dystonia-like movement and ataxia with sensory
      degeneration.
    explanation: Ties the ataxia to sensory degeneration in the model organism.
animal_models:
- name: Dystonia musculorum mouse (Dst dt-27J)
  species: Mouse
  genotype: Dst dt-27J, disrupting Dst-A1, -A2 and -A3 isoforms
  publication: PMID:29982604
  description: >
    The severe dystonia musculorum allele, disrupting all three neuronal isoforms.
    It is the model behind most of the transport, ER-stress and autophagy results,
    and its severity relative to the Tg4 allele is what established the
    isoform-dosage rule.
  modeled_mechanisms:
  - target: Failure of Cytoskeletal Cross-Linking in Sensory Neurons
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >
      Reproduces the cytoskeletal disorganisation and sensory neuron degeneration
      of the human disease from loss of the orthologous gene.
    limitations: >-
      The mouse alleles are not the human alleles, and the human severity spectrum
      is driven by compound heterozygous combinations that the two mouse alleles do
      not span. The mouse also does not model the arthrogryposis of the severe human
      presentation.
    readouts:
    - name: Tubulin acetylation in sensory neurons
      target: Failure of Cytoskeletal Cross-Linking in Sensory Neurons
      direction: DECREASED
      interpretation: >-
        Reduced tubulin acetylation indicates microtubule instability in the severe
        allele; the milder allele shows no such change.
      evidence:
      - reference: PMID:29982604
        reference_title: "Dystonin-A3 upregulation is responsible for maintenance of tubulin acetylation in a less severe dystonia musculorum mouse model for hereditary sensory and autonomic neuropathy type VI."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          There is a significant reduction in tubulin acetylation in Dstdt-27J
          indicative of microtubule instability and severe microtubule
          disorganization within sensory axons.
        explanation: The measured microtubule readout distinguishing the severe allele.
    evidence:
    - reference: PMID:12859670
      reference_title: "Impaired fast axonal transport in neurons of the sciatic nerves from dystonia musculorum mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Furthermore, ultrastructural studies reveal a perturbed organization of the
        neurofilament and microtubule networks within the axons of sciatic nerves in
        dt27J mice.
      explanation: >-
        Establishes that this allele reproduces the cytoskeletal lesion the node
        describes.
- name: Dystonia musculorum mouse (Dst dt-Tg4)
  species: Mouse
  genotype: Dst dt-Tg4, disrupting Dst-A1 and -A2 but sparing Dst-A3
  publication: PMID:29982604
  description: >
    The milder allele, which spares DST-A3. It is the model that carries the
    negative result: it degenerates without microtubule instability, which is why
    instability cannot be the initiating lesion.
  modeled_mechanisms:
  - target: Impaired Autophagic Flux
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >
      The autophagy defect was demonstrated in this allele: autophagosomes
      accumulate, flux is impaired, and substrates are not turned over.
    limitations: >-
      Autophagic flux was assayed in mouse sensory neurons; no equivalent
      measurement exists in human HSAN-VI tissue, so the human relevance of this arm
      is inferred from the shared gene rather than demonstrated.
    evidence:
    - reference: PMID:26043942
      reference_title: "Disruption in the autophagic process underlies the sensory neuropathy in dystonia musculorum mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        As autophagy is highly reliant upon stable microtubules and motor proteins,
        we assessed the influence of DST loss of function on autophagy using the
        Dst(dt-Tg4) mouse model.
      explanation: Identifies the allele in which the autophagy arm was established.
  - target: Biallelic Loss of Neuronal DST-a Isoforms
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: >
      Models the isoform-selective loss that underlies the milder human phenotype,
      sparing DST-A3 as the milder human genotypes spare isoforms.
    limitations: >-
      Retained DST-A3 makes this allele a model of partial isoform loss rather than
      of the biallelic null state, so it under-represents the severe human
      presentation.
    evidence:
    - reference: PMID:29982604
      reference_title: "Dystonin-A3 upregulation is responsible for maintenance of tubulin acetylation in a less severe dystonia musculorum mouse model for hereditary sensory and autonomic neuropathy type VI."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The less severe Dstdt-Tg4 mice have disrupted expression of Dst-A1 and -A2
        isoforms, while the more severe Dstdt-27J allele affects Dst-A1, -A2 and -A3
        isoforms.
      explanation: >-
        States the isoform difference between the two alleles that makes this pair
        informative about isoform dosage.
- name: Advillin-Cre conditional Dst gene-trap mouse
  species: Mouse
  genotype: Dst gene-trap inactivated in peripheral nervous system neurons (Advillin-Cre)
  publication: PMID:42028226
  description: >
    A conditional model that restricts Dst loss to peripheral neurons and asks
    whether the cardiac phenotype is neurogenic. It is the model that excludes a
    cardiomyopathic explanation for the arrhythmia.
  modeled_mechanisms:
  - target: Autonomic Neuron Degeneration
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: ORGANISM
    description: >
      Reproduces degeneration of sensory and sympathetic ganglionic neurons and the
      resulting arrhythmia, with the cell-type restriction that makes the causal
      attribution possible.
    limitations: >-
      The arrhythmia was most prominent under isoflurane anaesthesia, so the
      unanaesthetised human relevance of the magnitude is uncertain even though the
      mechanism is well localised.
    readouts:
    - name: Heart rate variability and pulse regularity
      target: Autonomic Neuron Degeneration
      direction: ALTERED
      interpretation: >-
        Increased heart rate variability and irregular pulse frequency in the absence
        of cardiomyopathy, indicating a neurogenic arrhythmia.
      evidence:
      - reference: PMID:42028226
        reference_title: "Disruption of afferent neural circuits leads to arrhythmia in the animal model of hereditary sensory and autonomic neuropathy 6."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          This was accompanied by arrhythmia, characterized by increased heart rate
          variability and irregular pulse frequency, which was prominent under
          isoflurane anesthesia and occurred in the absence of protein aggregate
          cardiomyopathy.
        explanation: The measured cardiac readout and its negative control.
    evidence:
    - reference: PMID:42028226
      reference_title: "Disruption of afferent neural circuits leads to arrhythmia in the animal model of hereditary sensory and autonomic neuropathy 6."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Furthermore, selective inactivation of the Dst gene in PNS sensory neurons
        using Vglut2-Cre resulted in similar dysregulation of cardiac rhythm.
      explanation: >-
        A second, sensory-neuron-restricted driver reproduces the phenotype,
        strengthening the attribution to afferent circuits.
- name: Schwann-cell conditional Dst knockout mouse (P0-Cre)
  species: Mouse
  genotype: Dst conditionally inactivated in Schwann cells (P0-Cre)
  publication: PMID:32445516
  description: >
    Tests whether the neuropathy requires neuronal Dst loss or can arise from the
    Schwann cell. It produces a late-onset neuropathy, so glial loss contributes
    but does not reproduce the neonatal disease.
  modeled_mechanisms:
  - target: Dorsal Root Ganglion Sensory Neuron Degeneration
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >
      Schwann-cell-restricted loss gives late-onset neuropathy and sensory ataxia
      with sensory neurons largely intact, so it separates a glial contribution from
      the neuron-intrinsic disease.
    limitations: >-
      Dst expression was preserved in most dorsal root ganglion sensory neurons in
      this model, so it does not reproduce the neuron-intrinsic degeneration that
      drives the human disease and cannot stand in for it.
    evidence:
    - reference: PMID:32445516
      reference_title: "Disruption of dystonin in Schwann cells results in late-onset neuropathy and sensory ataxia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In the Dst cKO mice, Dst mRNA expression was significantly decreased in
        Schwann cells, but it was intact in most of the sensory neurons in the dorsal
        root ganglion.
      explanation: >-
        Establishes the cell-type restriction that both makes the model informative
        and limits what it can model.
diagnosis:
- name: Exome or genome sequencing of DST
  description: >
    Diagnosis is molecular. DST is a very large locus with multiple promoters, so
    isoform coverage and copy-number analysis matter, and the isoform affected
    should be reported because it predicts severity.
  evidence:
  - reference: PMID:22522446
    reference_title: "Hereditary sensory autonomic neuropathy caused by a mutation in dystonin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Homozygosity mapping followed by exome sequencing is a successful approach to
      identify mutated genes in rare monogenic disorders.
    explanation: >-
      The sequencing approach by which the disease gene was found and by which cases
      continue to be identified.
differential_diagnoses:
- name: Familial dysautonomia (HSAN III, IKBKAP/ELP1)
  description: >
    The nearest clinical mimic, and the comparison that named this disease. HSAN-VI
    was distinguished by contractures and a more severe course. There is a
    mechanistic link as well as a clinical one: dystonin is more abundant in
    familial dysautonomia cells, which has been proposed as the reason that disease
    runs milder.
  evidence:
  - reference: PMID:22522446
    reference_title: "Hereditary sensory autonomic neuropathy caused by a mutation in dystonin."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Interestingly, dystonin is significantly more abundant in cells of familial
      dysautonomia patients with IKBKAP (I-κ-B kinase complex-associated protein)
      mutation compared to fibroblasts of controls, suggesting that upregulation of
      dystonin is responsible for the milder course in familial dysautonomia.
    explanation: >-
      Documents the proposed mechanistic relationship between the two disorders,
      measured in patient fibroblasts.
discussions:
- discussion_id: hsan6_microtubule_instability_not_initiating
  kind: KNOWLEDGE_GAP
  prompt: >-
    If microtubule instability is not what initiates degeneration, which of the
    parallel arms (transport failure, ER stress, autophagy block) is the initiating
    lesion?
  attaches_to:
  - pathophysiology#Failure of Cytoskeletal Cross-Linking in Sensory Neurons
  rationale: >
    The obvious reading of a cytolinker disease is that microtubules destabilise and
    everything follows. The mouse data refuse that reading: the milder allele
    degenerates with no change in tubulin acetylation and only mildly impaired
    microtubule organisation, and the authors state directly that instability is not
    central to initiation though it may contribute to severity. The entry therefore
    records four parallel arms rather than one linear chain, and which arm is
    upstream is genuinely unresolved. Distinguishing them needs a time-course in a
    single model with all four readouts measured together, which has not been done.
- discussion_id: hsan6_human_evidence_is_almost_entirely_murine
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Do the transport, ER-stress, autophagy and arrhythmia mechanisms established in
    dystonia musculorum mice actually operate in human HSAN-VI neurons?
  attaches_to:
  - pathophysiology#Impaired Fast Axonal Transport
  - pathophysiology#Impaired Autophagic Flux
  - pathophysiology#Endoplasmic Reticulum and Nuclear Envelope Stress
  rationale: >
    Every mechanistic node in this entry below the gene is evidenced by mouse work.
    The human literature is roughly fifteen patients and contributes the genotype,
    the phenotype and one in vitro actin-binding result; no human neuronal tissue or
    patient-derived neuron has been assayed for axonal transport, ER stress or
    autophagic flux. The mouse and human diseases share the gene and a strikingly
    similar phenotype, so the inference is reasonable, but it is an inference. This
    is recorded as a model mismatch rather than a plain knowledge gap because the
    evidence exists and is good; what is missing is its translation.
  proposed_experiments:
  - experiment_id: hsan6_ipsc_sensory_neuron_transport_autophagy
    name: Axonal transport and autophagic flux in patient iPSC-derived sensory neurons
    description: >
      Differentiate sensory neurons from HSAN-VI patient iPSCs carrying genotypes
      that differ in which DST-a isoforms they ablate, and measure fast axonal
      transport, LC3-II flux and ER chaperone induction against isogenic controls.
    readouts:
    - name: Fast axonal transport rate
      target: pathophysiology#Impaired Fast Axonal Transport
      direction: DECREASED
      interpretation: >-
        A reduced transport rate in patient-derived human neurons would carry the
        mouse result across the species gap for this node.
treatments:
- name: Supportive and multidisciplinary care
  description: >
    There is no disease-modifying therapy. Management is airway and respiratory
    support, nutritional support, corneal protection for alacrima, wound and ulcer
    prevention in insensate limbs, and autonomic monitoring including cardiac
    rhythm.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  notes: >-
    Deliberately carries no evidence item. No trial, cohort or case series of any
    intervention in HSAN-VI was identified. The management components above are
    standard supportive measures inferred from the phenotype rather than a
    published, citable regimen for this disease, and attaching a citation to them
    would overstate what is known.
notes: >
  On the balance of evidence. This entry is unusual in that the mechanism is far
  better evidenced than the disease. The dystonia musculorum mouse has been studied
  since long before the human disease was described, and supplies the axonal
  transport, ER stress, autophagy, arrhythmia and Schwann-cell results. The human
  side is roughly fifteen patients. Every mechanistic node below the gene is graded
  MODEL_ORGANISM for that reason, and a HUMAN_MODEL_MISMATCH discussion records the
  translational gap rather than leaving it implicit in the grading.

  On the shape of the pathograph. The four cellular arms (cytoskeletal
  disorganisation, transport failure, ER and nuclear envelope stress, autophagy
  block) are drawn in parallel converging on neuronal degeneration, not as a single
  chain. That is a deliberate reading of the evidence: the ER defects precede the
  motor phenotype, and the milder allele degenerates without microtubule
  instability, so a linear cytoskeleton-first chain is not supported. A
  KNOWLEDGE_GAP discussion records which arm initiates as unresolved.

  On what the deep-research report was and was not used for. The openscientist
  report supplied the isoform-severity rule, the four-arm structure and the
  conditional-mouse literature, all of which were verified against the primary
  sources before use. It did not cite the founding gene-discovery paper
  (PMID:22522446), which was added from an independent PubMed search. Its causal
  chain also presents microtubule instability as a step leading to degeneration;
  the cited source actually reports the opposite for initiation, and the entry
  follows the source rather than the report.

  On the allelic series. DST also causes epidermolysis bullosa simplex from loss of
  the epithelial DST-e isoform and a congenital myopathy from loss of the muscular
  DST-b isoform. Those are separate diseases from the same locus and are not
  curated here; the isoform-specificity is recorded in the genetic block because it
  is what makes them separable.

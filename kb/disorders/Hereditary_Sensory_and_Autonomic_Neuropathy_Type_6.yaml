- name: Autonomic Neuron Degeneration
  biological_scale: TISSUE
  description: >
    Degeneration extends to sympathetic ganglionic neurons and visceral afferent
    circuits, producing the dysautonomia. The mouse work localises the cardiac
    phenotype specifically to afferent circuit disruption rather than to any
    cardiomyopathy, which is a genuinely informative negative.
  cell_types:

      explanation: >-
        Documents axonal degeneration in the same nerves in which transport was
        measured.
- name: Endoplasmic Reticulum and Nuclear Envelope Stress
  biological_scale: CELLULAR
  description: >
    Dorsal root ganglion neurons mount an ER stress response, with altered ER
    chaperone expression, at a stage before limb incoordination begins. The timing
    is the argument: this is not a late consequence of a dying cell.

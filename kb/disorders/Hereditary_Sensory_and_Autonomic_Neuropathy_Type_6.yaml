    reference_title: "Rare autosomal recessive hereditary sensory and autonomic neuropathy type VI in a Pakistani family caused by a novel DST variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      HSAN-VI (OMIM: 614653) is an autosomal recessive subtype which manifests
      severe pain insensitivity, neonatal hypotonia, respiratory and feeding
      difficulties, lack of psychomotor development and autonomic abnormalities.
    explanation: >-
      States the recessive inheritance and the core clinical picture in one
      sentence.
prevalence:
- population: Worldwide, cases reported in the literature
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Fifteen patients across eleven DST variants as of the 2025 report. There is no
    population-based prevalence estimate and, given that the severe form is
    neonatally lethal and the mild form is easily mistaken for another sensory
    neuropathy, ascertainment is likely incomplete at both ends of the spectrum.
  evidence:
  - reference: PMID:40938507
    reference_title: "Rare autosomal recessive hereditary sensory and autonomic neuropathy type VI in a Pakistani family caused by a novel DST variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thus far, only 15 HSAN-VI patients associated with 11 DST variants, mostly
      compound heterozygous, have been identified in the literature.
    explanation: >-
      Gives the cumulative reported patient and variant count, the only occurrence
      figure available.
genetic:
- name: DST
  notes: >
    DST (6p12.1) encodes dystonin/BPAG1, a plakin-family cytolinker expressed as
    several tissue-restricted isoform classes from alternative promoters: neuronal
    DST-a, epithelial DST-e and muscular DST-b. HSAN-VI is caused by biallelic loss
    of the neuronal DST-a isoforms; loss of the epithelial and muscular isoforms
    produces different diseases from the same locus. Which DST-a isoforms a
    genotype ablates is the principal determinant of severity, so the isoform
    identity of a variant matters more here than its class.
  gene_term:
    preferred_term: DST
    term:
      id: hgnc:1090
      label: DST
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:22522446
    reference_title: "Hereditary sensory autonomic neuropathy caused by a mutation in dystonin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In 4 infants with a new lethal autonomic sensory neuropathy with clinical
      features similar to familial dysautonomia as well as contractures, we
      identified a deleterious mutation in the DST gene, using homozygosity mapping
      followed by exome sequencing.
    explanation: >-
      The founding gene-discovery report establishing DST as the cause of this
      disease in four affected infants.
  - reference: PMID:22522446
    reference_title: "Hereditary sensory autonomic neuropathy caused by a mutation in dystonin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      DST encodes dystonin, a cytoskeleton linker protein, and the mutation results
      in an unstable transcript.
    explanation: >-
      Identifies the gene product as a cytoskeletal linker and the allele's effect
      as transcript instability, i.e. loss of function.
  - reference: PMID:30371979
    reference_title: "Recessive mutations in the neuronal isoforms of DST, encoding dystonin, lead to abnormal actin cytoskeleton organization and HSAN type VI."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report novel biallelic mutations in the DST gene encoding dystonin, a
      large cytolinker protein of the plakin family, in an adult form of HSAN type
      VI.
    explanation: >-
      Extends the allelic spectrum to an adult-onset form, establishing that the
      disease is a severity spectrum rather than a uniformly neonatal lethal one.
pathophysiology:
- name: Biallelic Loss of Neuronal DST-a Isoforms
  biological_scale: MOLECULAR
  description: >
    Loss-of-function variants remove or destabilise the neuronal dystonin-a
    isoforms. The severity of the resulting disease tracks which isoforms are
    ablated rather than the nominal severity of the variant class, which is the
    clearest genotype-phenotype rule in this disorder.
  gene:
    preferred_term: DST
    term:
      id: hgnc:1090
      label: DST
  molecular_functions:
  - preferred_term: microtubule binding
    modifier: DECREASED
    term:
      id: GO:0008017
      label: microtubule binding
  evidence:
  - reference: PMID:29982604
    reference_title: "Dystonin-A3 upregulation is responsible for maintenance of tubulin acetylation in a less severe dystonia musculorum mouse model for hereditary sensory and autonomic neuropathy type VI."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A milder form of HSAN-VI was recently described, resulting from loss of a
      single dystonin isoform (DST-A2).
    explanation: >-
      Establishes that the isoform set lost, not merely the presence of a DST
      variant, determines the human phenotype's severity.
  downstream:
  - target: Failure of Cytoskeletal Cross-Linking in Sensory Neurons
    causal_link_type: DIRECT
    description: >
      Dystonin-a's whole function is to bridge the three filament systems, so
      losing it removes the cross-link directly.
    evidence:
    - reference: PMID:30371979
      reference_title: "Recessive mutations in the neuronal isoforms of DST, encoding dystonin, lead to abnormal actin cytoskeleton organization and HSAN type VI."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Functional studies showed defects in actin cytoskeleton organization and
        consequent delayed cell adhesion, spreading and migration, while recombinant
        p.Ala203Glu dystonin loses the ability to bind actin.
      explanation: >-
        Shows a patient missense allele abolishing actin binding and disorganising
        the actin cytoskeleton, the direct consequence this edge asserts.
- name: Failure of Cytoskeletal Cross-Linking in Sensory Neurons
  biological_scale: CELLULAR
  description: >
    Without the cytolinker the actin, neurofilament and microtubule networks are no
    longer tethered to one another. In the mouse this shows as perturbed
    neurofilament and microtubule organisation in axons and as mislocalisation and
    aggregation of alpha-internexin, whose interaction with dystonin appears to be
    part of what holds the neurofilament network in place.
  cell_types:
  - preferred_term: sensory neuron
    term:
      id: CL:0000101
      label: sensory neuron
  biological_processes:
  - preferred_term: cytoskeleton organization
    modifier: DECREASED
    term:
      id: GO:0007010
      label: cytoskeleton organization
  evidence:
  - reference: PMID:12859670
    reference_title: "Impaired fast axonal transport in neurons of the sciatic nerves from dystonia musculorum mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Furthermore, ultrastructural studies reveal a perturbed organization of the
      neurofilament and microtubule networks within the axons of sciatic nerves in
      dt27J mice.
    explanation: >-
      Direct ultrastructural demonstration of the cytoskeletal disorganisation this
      node asserts, in the mouse model of the disease.
  - reference: PMID:16691115
    reference_title: "A possible cellular mechanism of neuronal loss in the dorsal root ganglia of Dystonia musculorum (dt) mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We found that not only BPAG1, but also alpha-internexin was absent in the DRG
      neurons in adult dt mice.
    explanation: >-
      Shows that loss of the cytolinker is accompanied by loss of a neurofilament
      subunit from the same neurons, evidencing a broader network failure.
  downstream:
  - target: Impaired Fast Axonal Transport
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:12859670
      reference_title: "Impaired fast axonal transport in neurons of the sciatic nerves from dystonia musculorum mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The disrupted cytoskeletal organization suggested that axonal transport is
        affected in dt mice.
      explanation: >-
        States the inference from cytoskeletal disorganisation to transport failure
        that motivated the ligature experiment reported in the same paper.
  - target: Endoplasmic Reticulum and Nuclear Envelope Stress
    causal_link_type: DIRECT
    description: >
      A separate arm, not downstream of transport failure. Dystonin associates with
      the ER and nuclear envelope directly, and the stress response appears before
      the motor phenotype.
    evidence:
    - reference: PMID:18638474
      reference_title: "Dystonin/Bpag1 is a necessary endoplasmic reticulum/nuclear envelope protein in sensory neurons."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Dystonin in sensory neurons localized in association with the ER and nuclear
        envelope (NE).
      explanation: >-
        Places dystonin physically at the ER and nuclear envelope, which is why its
        loss produces organelle stress rather than only a transport defect.
- name: Impaired Fast Axonal Transport
  biological_scale: CELLULAR
  description: >
    Fast axonal transport is slowed in both directions, with focal axonal swellings
    where cargo accumulates. The measurement in the mouse was made by ligature,
    comparing accumulation of acetylcholinesterase proximal and distal to the tie.
  cell_types:
  - preferred_term: sensory neuron
    term:
      id: CL:0000101

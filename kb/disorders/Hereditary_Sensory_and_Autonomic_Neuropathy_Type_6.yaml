        Consequently, Dst(dt-Tg4) sensory neurons displayed impaired protein turnover
        of autophagosome substrate SQTSM1/p62 and of polyubiquitinated proteins.
      explanation: >-
        Names the accumulating substrates that constitute the intermediate step
        between failed autophagy and neuronal loss.

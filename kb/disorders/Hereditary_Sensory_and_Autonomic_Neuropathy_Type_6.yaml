name: Hereditary Sensory and Autonomic Neuropathy Type 6
creation_date: '2026-09-06T15:45:00Z'
category: Mendelian
description: >
  Hereditary sensory and autonomic neuropathy type VI (HSAN-VI) is an ultra-rare
  autosomal recessive neuropathy caused by biallelic loss of the neuronal DST-a
  isoforms of DST, which encodes dystonin (also called bullous pemphigoid antigen
  1). Dystonin-a is a spectraplakin: a very large cytolinker that physically
  tethers the actin, intermediate filament and microtubule networks to each other
  inside the neuron. Losing it does not disable one pathway but removes the
  structural scaffold the axon is built on, and the consequences arrive by several
  routes at once, which is what the pathograph records.

  The classical presentation is neonatal and severe: arthrogryposis, profound
  insensitivity to pain, hypotonia, respiratory and feeding failure, and marked
  dysautonomia including alacrima and cardiac arrhythmia. Milder adult-onset
  disease with painless ulcers also occurs, and the difference tracks which DST-a
  isoforms a given genotype spares rather than any separate modifier gene.

  Two features make this entry unusual. First, almost all of the mechanistic
  evidence is murine: the dystonia musculorum mouse has been studied for decades
  and supplies the transport, ER-stress, autophagy and arrhythmia results, while
  the human literature is roughly fifteen patients. Second, the mouse work
  includes a genuine negative that is easy to overstate in the other direction:
  microtubule instability accompanies the severe allele but is explicitly reported
  as not central to disease initiation.
synonyms:
- HSAN 6
- HSAN VI
- HSAN6
- neuropathy, hereditary sensory and autonomic, type VI
- hereditary sensory and autonomic neuropathy type VI

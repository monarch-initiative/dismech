    reference_title: "Disruption of afferent neural circuits leads to arrhythmia in the animal model of hereditary sensory and autonomic neuropathy 6."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Inactivation of the Dst gene in PNS neurons using Advillin-Cre caused the
      degeneration of sensory and sympathetic ganglionic neurons.
    explanation: >-
      Documents degeneration of both sensory and sympathetic neurons on conditional
      inactivation restricted to peripheral neurons.
  downstream:
  - target: Arrhythmia
    causal_link_type: DIRECT
    description: >
      The arrhythmia is neurogenic. It occurs without protein aggregate
      cardiomyopathy, and is reproduced by inactivating Dst in sensory neurons

    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Electron microscopy (EM) revealed an accumulation of autophagosomes in sensory
      neurons from these mice.
    explanation: Direct morphological evidence of autophagosome accumulation.
  - reference: PMID:26043942
    reference_title: "Disruption in the autophagic process underlies the sensory neuropathy in dystonia musculorum mice."
    supports: SUPPORT

    evidence:
    - reference: PMID:42028226
      reference_title: "Disruption of afferent neural circuits leads to arrhythmia in the animal model of hereditary sensory and autonomic neuropathy 6."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        This was accompanied by arrhythmia, characterized by increased heart rate
        variability and irregular pulse frequency, which was prominent under
        isoflurane anesthesia and occurred in the absence of protein aggregate
        cardiomyopathy.
      explanation: >-
        Establishes the arrhythmia and, importantly, excludes a cardiomyopathic
        explanation for it.

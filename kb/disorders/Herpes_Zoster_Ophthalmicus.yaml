treatments:
- name: Systemic antiviral therapy
  description: >-
    Oral aciclovir, valaciclovir or famciclovir started within 72 hours of rash
    onset speeds resolution, shortens viral shedding, and reduces ocular
    complications.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: aciclovir
      term:
        id: CHEBI:2453
        label: acyclovir
    - preferred_term: valaciclovir
      term:
        id: CHEBI:35854
        label: valacyclovir
  evidence:
  - reference: PMID:3001610
    reference_title: Oral acyclovir in the therapy of acute herpes zoster ophthalmicus. An interim report.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Treatment with oral acyclovir resulted in more prompt resolution of signs and symptoms, particularly in patients treated within 72 hours after onset of skin rash (P less than 0.05), and shortened the duration of viral shedding (P = 0.02)."
    explanation: Randomized-trial evidence that early oral acyclovir speeds resolution and reduces shedding.
  - reference: PMID:27800502
    reference_title: "Eye and Periocular Skin Involvement in Herpes Zoster Infection."
    supports: SUPPORT

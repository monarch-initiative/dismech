name: Herpes Zoster Ophthalmicus
creation_date: "2026-11-25T00:00:00Z"
synonyms:
- Ophthalmic herpes zoster
- Ocular herpes zoster
- Zoster ophthalmicus
description: >-
  Herpes zoster ophthalmicus (HZO) is the reactivation of latent varicella-zoster
  virus (VZV) in the ophthalmic (V1) division of the trigeminal ganglion, with
  anterograde spread along V1 to the forehead/scalp/eyelid dermatome and, when
  the nasociliary branch is involved, to the eye. It accounts for roughly
  10-20% of herpes zoster; about half of HZO patients develop ocular disease
  spanning conjunctivitis, epithelial and stromal keratitis, anterior uveitis
  with trabeculitis and raised intraocular pressure, neurotrophic keratopathy
  from corneal denervation, and - rarely - sight-threatening acute retinal
  necrosis. Neural and vascular sequelae include postherpetic neuralgia and an
  increased risk of stroke from VZV vasculopathy. It shares the conserved
  alphaherpesvirus reactivation-and-neural-spread mechanism with other zoster
  syndromes but is set apart by its sight-threatening ocular-surface and
  intraocular disease and its need for urgent ophthalmic care.
disease_term:
  preferred_term: Herpes zoster ophthalmicus
  term:
    id: MONDO:0005883
    label: ophthalmic herpes zoster
review_notes: >-
  Scoped as a standalone named clinical entity (MONDO:0005883), not a
  has_subtypes row on Herpes_Zoster (MONDO:0005609, its MONDO parent). HZO is a
  named clinical entity the field diagnoses and manages as a unit, with its own
  ocular-specific, sight-threatening mechanisms (viral and immune keratitis,
  trabeculitis with secondary glaucoma, neurotrophic keratopathy, acute retinal
  necrosis) that generic dermatomal zoster does not carry, and a distinct
  management pathway (urgent ophthalmology, topical ocular care, Hutchinson-sign
  risk stratification). The shared VZV reactivation and anterograde-spread spine
  is intended to conform to the alphaherpesvirus_reactivation_neural_spread
  module; that conforms_to anchor is deferred until the module (PR #18947) is on
  main, because the module-node foreign key is gated.
infectious_agent:
- name: Varicella-zoster virus (Human alphaherpesvirus 3)
  description: >-
    Neurotropic human alphaherpesvirus that establishes lifelong latency in
    sensory ganglionic neurons after primary varicella and reactivates to cause
    herpes zoster; HZO is the V1-division reactivation syndrome.
  infectious_agent_term:
    preferred_term: Human alphaherpesvirus 3
    term:
      id: NCBITaxon:10335
      label: Human alphaherpesvirus 3
  evidence:
  - reference: PMID:20874010
    reference_title: "Varicella-zoster virus human ganglionic latency: a current summary."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "the virus establishes a latent infection in trigeminal and dorsal root ganglia that lasts for the life of the individual. VZV subsequently reactivates, spontaneously or after specific triggering factors, to cause herpes zoster (shingles)"
    explanation: Establishes VZV latency in the trigeminal ganglion and reactivation as the etiology.
transmission:
- name: Endogenous reactivation from ganglionic latency
  description: >-
    HZO arises by endogenous reactivation of latent VZV from the ophthalmic
    division of the trigeminal ganglion, not by new transmission; reactivation
    is favoured by waning VZV-specific cell-mediated immunity.
  evidence:
  - reference: PMID:27800502
    reference_title: "Eye and Periocular Skin Involvement in Herpes Zoster Infection."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Herpes zoster ophthalmicus (HZO) is a clinical manifestation of the reactivation of latent varicella zoster virus (VZV) infection and is more common in people with diminished cell-mediated immunity."
    explanation: Establishes HZO as endogenous VZV reactivation favoured by diminished cell-mediated immunity.
prevalence:
- population: Kaiser Permanente Hawaii (population-based, 2006-2007)
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: BAND_1_5_PER_10000
  rate_per_100000: 30.9
  rate_denominator: PERSON_YEARS
  notes: Overall population incidence of HZO; rises to 104.6 per 100,000 person-years at age 65 and over.
  evidence:
  - reference: PMID:23207173
    reference_title: "Incidence of herpes zoster ophthalmicus: results from the Pacific Ocular Inflammation Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "The overall incidence was 30.9 per 100 000 person-years"
    explanation: Population-based HZO incidence estimate.
progression:
- phase: Acute ocular onset
  age_range: first 2 weeks after rash
  notes: Ocular disease (commonly uveitis) is most often diagnosed in the second week after rash onset.
  evidence:
  - reference: PMID:39307262
    reference_title: "Herpes Zoster Ophthalmicus Uveitis: Onset and Complications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Uveitis occurred in approximately half of individuals with HZO and was most frequently diagnosed during the second week following rash onset."
    explanation: Defines the acute ocular-onset timing.
- phase: Chronic or recurrent disease
  notes: Up to a quarter of HZO patients with ocular disease develop chronic or recurrent ocular inflammation.
  evidence:
  - reference: PMID:38834857
    reference_title: "Herpes Zoster Ophthalmicus: Presentation, Complications, Treatment, and Prevention."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Approximately 50% of patients with HZO develop ocular disease, among whom up to 25% develop chronic or recurrent disease."
    explanation: Defines the chronic/recurrent phase and its frequency.
diagnosis:
- name: Clinical diagnosis
  description: >-
    HZO is diagnosed clinically from the characteristic painful vesicular rash in
    the V1 dermatome; confirmatory laboratory testing is generally not required.
    Early referral to ophthalmology is essential where the eye may be involved.
  evidence:
  - reference: PMID:38834857
    reference_title: "Herpes Zoster Ophthalmicus: Presentation, Complications, Treatment, and Prevention."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "HZO is a clinical diagnosis that generally does not require confirmatory laboratory testing."
    explanation: Establishes HZO as a clinical diagnosis.
- name: VZV PCR of lesion or ocular fluid
  description: >-
    When the diagnosis is uncertain (zoster sine herpete, recurrent anterior
    uveitis), VZV DNA detection by PCR of a lesion swab or ocular fluid confirms
    the etiology.
  evidence:
  - reference: PMID:27800502
    reference_title: "Eye and Periocular Skin Involvement in Herpes Zoster Infection."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "To date VZV DNA detection by polymerase chain reaction (PCR) is the most useful laboratory test for diagnosis confirmation"
    explanation: Establishes VZV PCR as the confirmatory laboratory test.
  - reference: PMID:38834857
    reference_title: "Herpes Zoster Ophthalmicus: Presentation, Complications, Treatment, and Prevention."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Swabs of skin or ophthalmic lesions for PCR analysis should only be considered when the diagnosis is uncertain, for example in patients with zoster sine herpete or recurrent anterior uveitis."
    explanation: States when PCR is indicated (uncertain diagnosis).
pathophysiology:
- name: VZV Reactivation in the Ophthalmic Trigeminal Ganglion
  role: trigger
  biological_scale: CELLULAR
  description: >-
    Latent VZV in the ophthalmic (V1) division of the trigeminal ganglion
    de-represses and re-enters the lytic programme when VZV-specific
    cell-mediated immunity wanes with age or immunosuppression.
  biological_processes:
  - preferred_term: release from viral latency
    modifier: INCREASED
    term:
      id: GO:0019046
      label: release from viral latency
  cell_types:
  - preferred_term: sensory neuron
    term:
      id: CL:0000101
      label: sensory neuron
  locations:
  - preferred_term: trigeminal ganglion
    term:
      id: UBERON:0001675
      label: trigeminal ganglion
  downstream:
  - target: Anterograde Spread Along the V1 Nerve to Skin and Eye
    description: Reactivated virus travels anterogradely down the ophthalmic nerve.
  evidence:
  - reference: PMID:20874010
    reference_title: "Varicella-zoster virus human ganglionic latency: a current summary."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "VZV subsequently reactivates, spontaneously or after specific triggering factors, to cause herpes zoster (shingles)"
    explanation: Establishes reactivation of latent VZV as the initiating event.
- name: Anterograde Spread Along the V1 Nerve to Skin and Eye
  role: amplifier
  biological_scale: CELLULAR
  description: >-
    Reactivated virions are carried anterogradely along the ophthalmic nerve to
    the V1 dermatome (forehead, scalp, upper eyelid), producing the dermatomal
    vesicular rash and acute neuritis. Involvement of the nasociliary branch
    (signalled by lesions on the tip of the nose, Hutchinson sign) carries the
    virus to the ocular surface and interior.
  biological_processes:
  - preferred_term: anterograde axonal transport
    modifier: INCREASED
    term:
      id: GO:0008089
      label: anterograde axonal transport
  cell_types:
  - preferred_term: sensory neuron
    term:
      id: CL:0000101
      label: sensory neuron
  downstream:
  - target: Corneal Viral and Immune Keratitis
    description: Nasociliary spread seeds the cornea.
  - target: Anterior Uveitis and Trabeculitis
    description: Spread to the anterior uvea drives intraocular inflammation.
  - target: Necrotizing Retinitis
    description: Neural spread to the posterior segment can cause retinitis.
  - target: VZV Vasculopathy
    description: Trans-vascular spread reaches cerebral arteries.
  - target: Dermatomal vesicular rash
    description: Spread to the V1 dermatome produces the rash.
  - target: Postherpetic neuralgia
    description: Acute neuritis and neuronal injury can leave chronic neuralgia.
  evidence:
  - reference: PMID:38834857
    reference_title: "Herpes Zoster Ophthalmicus: Presentation, Complications, Treatment, and Prevention."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "HZ ophthalmicus (HZO) is a subset of HZ with involvement of the ophthalmic division of the fifth cranial trigeminal nerve."
    explanation: Localizes HZO to the ophthalmic (V1) division, the nerve along which the virus spreads.
  - reference: PMID:27800502
    reference_title: "Eye and Periocular Skin Involvement in Herpes Zoster Infection."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Emergence of skin lesions on the tip of the nose is a finding characteristic for the involvement of the nervus ophthalmicus ramus nasociliaris and a sign highly predictive of HZO"
    explanation: Establishes nasociliary-branch involvement (Hutchinson sign) as the route by which spread reaches the eye.
- name: Corneal Viral and Immune Keratitis
  role: effector
  biological_scale: TISSUE
  description: >-
    VZV reaching the cornea produces direct cytopathic epithelial
    (pseudodendritic) keratitis and, through immune mechanisms, stromal and
    disciform keratitis. Keratitis is among the most common ocular
    manifestations of HZO.
  biological_processes:
  - preferred_term: viral life cycle
    modifier: INCREASED
    term:
      id: GO:0019058
      label: viral life cycle
  cell_types:
  - preferred_term: corneal epithelial cell
    term:
      id: CL:0000575
      label: corneal epithelial cell
  locations:
  - preferred_term: cornea
    term:
      id: UBERON:0000964
      label: cornea
  downstream:
  - target: Corneal Denervation and Neurotrophic Keratopathy
    description: Recurrent corneal infection and inflammation injure the corneal nerves.
  - target: Keratitis
    description: The corneal infection and inflammation are the keratitis.
  - target: Conjunctivitis
    description: Ocular-surface infection also produces conjunctivitis.
  evidence:
  - reference: PMID:38834857
    reference_title: "Herpes Zoster Ophthalmicus: Presentation, Complications, Treatment, and Prevention."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Common manifestations of ocular disease include conjunctivitis, keratitis, and uveitis, whereas optic neuropathy and retinitis are uncommon."
    explanation: Establishes keratitis and conjunctivitis as common ocular-surface manifestations.
- name: Anterior Uveitis and Trabeculitis
  role: effector
  biological_scale: TISSUE
  description: >-
    Intraocular inflammation of the anterior uvea (iritis/uveitis) is frequent
    in HZO and is accompanied by trabeculitis that raises intraocular pressure
    and can lead to secondary glaucoma. Uveitis marks eyes at higher risk of
    other complications and vision loss.
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  locations:
  - preferred_term: uvea
    term:
      id: UBERON:0001768
      label: uvea
  downstream:
  - target: Uveitis
    description: The anterior-uveal inflammation is the uveitis.
  - target: Glaucoma
    description: Trabeculitis raises intraocular pressure, causing secondary glaucoma.
  evidence:
  - reference: PMID:39307262
    reference_title: "Herpes Zoster Ophthalmicus Uveitis: Onset and Complications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "A total of 869 patients with HZO were included for analysis, of whom 413 (47.6%) developed uveitis."
    explanation: Quantifies uveitis in nearly half of HZO patients.
  - reference: PMID:39307262
    reference_title: "Herpes Zoster Ophthalmicus Uveitis: Onset and Complications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Complications were higher in eyes with uveitis, including moderate or severe vision loss, corneal scarring, neurotrophic keratitis, band keratopathy, corneal melt, elevated intraocular pressure, glaucoma, and cataract"
    explanation: Links uveitis with raised intraocular pressure and glaucoma.
- name: Corneal Denervation and Neurotrophic Keratopathy
  role: consequence
  biological_scale: TISSUE
  description: >-
    HZO injures the corneal sensory nerves, causing loss of corneal sensation
    and neurotrophic keratopathy with epithelial breakdown and ulceration.
    Confocal microscopy shows profound loss of the corneal nerve plexus, even
    bilaterally in a clinically unilateral disease.
  cell_types:
  - preferred_term: corneal epithelial cell
    term:
      id: CL:0000575
      label: corneal epithelial cell
  - preferred_term: sensory neuron
    term:
      id: CL:0000101
      label: sensory neuron
  locations:
  - preferred_term: cornea
    term:
      id: UBERON:0000964
      label: cornea
  downstream:
  - target: Corneal ulceration
    description: Neurotrophic keratopathy breaks down the corneal epithelium into ulceration.
  evidence:
  - reference: PMID:22999636
    reference_title: "Unilateral herpes zoster ophthalmicus results in bilateral corneal nerve alteration: an in vivo confocal microscopy study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Herpes zoster ophthalmicus (HZO), thought to be a unilateral disease, results in loss of corneal sensation, leading to neurotrophic keratopathy."
    explanation: States the mechanism - corneal sensory loss leading to neurotrophic keratopathy.
  - reference: PMID:22999636
    reference_title: "Unilateral herpes zoster ophthalmicus results in bilateral corneal nerve alteration: an in vivo confocal microscopy study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Patients with unilateral HZO demonstrated a profound and significant bilateral loss of the corneal nerve plexus as compared with controls"
    explanation: Confocal evidence of profound corneal nerve loss in HZO.
- name: Necrotizing Retinitis
  role: consequence
  biological_scale: TISSUE
  description: >-
    Spread to the posterior segment can cause acute retinal necrosis (ARN) and
    progressive outer retinal necrosis (PORN), the most severe, sight-threatening
    complications of HZO, seen most often in immunocompromised patients.
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  locations:
  - preferred_term: retina
    term:
      id: UBERON:0000966
      label: retina
  downstream:
  - target: Retinitis
    description: The necrotizing posterior-segment inflammation is the retinitis.
  - target: Visual impairment
    description: Retinal necrosis causes severe vision loss.
  evidence:
  - reference: PMID:27800502
    reference_title: "Eye and Periocular Skin Involvement in Herpes Zoster Infection."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Herpes zoster ophthalmicus may affect all the ophthalmic structures, but most severe eye-threatening complications are panuveitis, acute retinal necrosis (ARN) and progressive outer retinal necrosis (PORN) as well."
    explanation: Establishes ARN/PORN as the severe posterior-segment complications.
- name: VZV Vasculopathy
  role: consequence
  biological_scale: ORGANISM
  description: >-
    VZV can spread trans-vascularly into cerebral arteries and cause a
    vasculopathy that raises the risk of stroke in the year after HZO.
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  downstream:
  - target: Stroke
    description: Cerebral-artery vasculopathy raises stroke risk.
  evidence:
  - reference: PMID:20200348
    reference_title: "Herpes zoster ophthalmicus and the risk of stroke: a population-based follow-up study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "HZO patients were found to have a 4.52-fold (95% confidence interval 2.45-8.33) higher risk of stroke than the matched comparison cohort."
    explanation: Quantifies the increased stroke risk after HZO.

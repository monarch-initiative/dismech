name: Brachydactyly Type E1
synonyms:
- BDE1
- HOXD13-related brachydactyly type E
- Isolated brachydactyly type E
creation_date: '2026-08-27T00:00:00Z'
category: Mendelian
description: >
  Brachydactyly type E1 is the HOXD13-related form of isolated brachydactyly type
  E: variable shortening of the metacarpals — classically the fourth, detected by
  the metacarpal sign — with phalanges of roughly normal length, though terminal
  phalanges are often short. Metatarsals may be involved, and affected people are
  often mildly short of stature. Radiographically it is indistinguishable from the
  hand of Albright hereditary osteodystrophy, and the differential is what most of
  the clinical work in BDE consists of: short metacarpals are a feature of Turner
  syndrome, of 2q37 deletion, and of several syndromes, so establishing that the
  brachydactyly is isolated is the diagnosis. Most isolated BDE remains
  molecularly unsolved; the HOXD13 form is defined by a handful of homeodomain
  missense and truncating alleles. This entry is deliberately scoped to the
  HOXD13 form, because the PTHLH-related type E2 is a separate disease that the
  ISDS nosology places in a different group.
disease_term:
  preferred_term: brachydactyly type E1
  term:
    id: MONDO:0007223
    label: brachydactyly type E1
parents:
- Limb Development Disorders
inheritance:
- name: Autosomal Dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Autosomal dominant with variable expressivity, variable involvement of
    metacarpals and metatarsals, and frequent bilateral asymmetry.
  evidence:
  - reference: PMID:18554391
    reference_title: Brachydactyly.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "As an isolated anomaly, type E brachydactyly is inherited as an autosomal dominant trait with variable expressivity"
    explanation: States the inheritance pattern of isolated BDE.
  - reference: PMID:22233338
    reference_title: "Isolated brachydactyly type E caused by a HOXD13 nonsense mutation: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We investigated a Polish female proband and her father, both affected by isolated BDE, in whom we identified a nonsense heterozygous mutation c.820C > T(p.R274X) in the HOXD13 gene."
    explanation: Father-to-daughter transmission of a heterozygous HOXD13 allele.
classifications:
  isds_skeletal_category:
  - classification_value: brachydactyly_without_extraskeletal_manifestations
    notes: >-
      ISDS Nosology of Genetic Skeletal Disorders, 2023 revision (Unger et al.,
      PMID:36779427), group 18 "Brachydactylies (isolated)", which lists
      brachydactyly type E (HOXD13; OMIM 113300 = type E1). The PTHLH-related
      type E2 is placed in the separate 2023 group 28, skeletal disorders of the
      parathyroid hormone signaling cascade, which is why this entry is scoped to
      the HOXD13 form rather than to the umbrella MONDO:0019677 "brachydactyly
      type E" — an umbrella entry would straddle two nosology groups and break
      the committee's one-group-per-disorder rule. Albright hereditary
      osteodystrophy, radiographically the closest mimic, is in group 17
      (acromelic dysplasias). The 2019 revision (PMID:31633310) placed type E in
      group 37 "Brachydactylies (without extraskeletal manifestations)". Per-row
      re-verification against the 2023 Table 1 is tracked in
      monarch-initiative/dismech#7867.
prevalence:
- population: Reported families worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: UNKNOWN
  notes: >-
    Isolated BDE is rare and the HOXD13-related form is rarer still: at the time
    of the fourth reported allele, only four HOXD13 mutations had been associated
    with typical isolated BDE.
  evidence:
  - reference: PMID:22233338
    reference_title: "Isolated brachydactyly type E caused by a HOXD13 nonsense mutation: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Isolated BDE is rare and in the majority of cases the molecular pathogenesis has so far not been resolved."
    explanation: States both the rarity of isolated BDE and its largely unresolved molecular basis.
  - reference: PMID:22233338
    reference_title: "Isolated brachydactyly type E caused by a HOXD13 nonsense mutation: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The variant p.R274X identified in our proband is the fourth HOXD13 mutation, and the second truncating (nonsense) mutation, reported to result in typical isolated BDE."
    explanation: Quantifies how few HOXD13 alleles had been linked to isolated BDE.
- population: Jirel ethnic group, eastern Nepal
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 390.0
  notes: >-
    0.39% of a 2,130-person radiographically phenotyped community sample. This
    counts the BDE phenotype irrespective of molecular cause, so it is an upper
    bound on the HOXD13-related form rather than an estimate of it, and it
    describes a single ethnic group.
  evidence:
  - reference: PMID:24022874
    reference_title: Nonsyndromic brachydactyly type D and type E mapped to 7p15 in healthy children and adults from the Jirel ethnic group in eastern Nepal.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "BDD was present in 3.55%, and BDE was present in 0.39%, of the study sample."
    explanation: >-
      Gives a population frequency for the BDE phenotype; PARTIAL because the
      cohort was phenotyped radiographically without molecular subtyping.
- population: Chinese children attending a paediatric hospital
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 223.0
  notes: >-
    135 BDE cases identified among 60,650 consecutive left-hand wrist
    radiographs (0.22%). This is a radiographic case-finding rate in children
    referred for hand films, not a general-population prevalence, and it counts
    the BDE pattern irrespective of cause - most of these children were not
    molecularly solved.
  evidence:
  - reference: PMID:40589517
    reference_title: Establishing an algorithm for molecular genetic diagnostics in Chinese children with brachydactyly type E.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "From 60,650 films, 135 BDE cases were identified, and their comprehensive phenotypes were collected."
    explanation: >-
      Gives the numerator and denominator for the radiographic case-finding
      rate; PARTIAL because the cohort is hospital-referred and unsubtyped.
pathophysiology:
- name: Altered HOXD13 Homeodomain Function
  conforms_to: "limb_digit_patterning_serial_homology#Limb Patterning Signal Perturbation"
  role: trigger
  biological_scale: MOLECULAR
  description: >
    HOXD13, the most 5' gene of the HOXD cluster, encodes a homeodomain
    transcription factor that patterns the autopod. The alleles associated with
    isolated BDE are of two kinds: homeodomain missense substitutions, of which
    Ile314Leu at homeodomain position 47 has been shown to shift DNA-binding
    preference between related target sequences rather than abolish it, and
    truncating nonsense alleles such as p.E181X and p.R274X. Both classes are
    distinct from the polyalanine expansions and frameshifts that dominate the
    HOXD13 mutation spectrum and cause synpolydactyly — the same gene reaches a
    different limb phenotype through a different kind of lesion.
  gene:
    preferred_term: HOXD13
    term:
      id: hgnc:5136
      label: HOXD13
  biological_processes:
  - preferred_term: Regulation of Transcription by RNA Polymerase II
    term:
      id: GO:0006357
      label: regulation of transcription by RNA polymerase II
    modifier: DYSREGULATED
  molecular_functions:
  - preferred_term: DNA-binding Transcription Factor Activity
    term:
      id: GO:0003700
      label: DNA-binding transcription factor activity
    modifier: ABNORMAL
  evidence:
  - reference: PMID:12649808
    reference_title: Missense mutations in the homeodomain of HOXD13 are associated with brachydactyly types D and E.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "HOXD13, the most 5' gene of the HOXD cluster, encodes a homeodomain transcription factor with important functions in limb patterning and growth."
    explanation: Establishes HOXD13's role in limb patterning.
  - reference: PMID:12649808
    reference_title: Missense mutations in the homeodomain of HOXD13 are associated with brachydactyly types D and E.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Heterozygous mutations of human HOXD13, encoding polyalanine expansions or frameshifts, are believed to act by dominant negative or haploinsufficiency mechanisms and are predominantly associated with synpolydactyly phenotypes."
    explanation: Contrasts the BDE allele class with the synpolydactyly allele class of the same gene.
  - reference: PMID:12649808
    reference_title: Missense mutations in the homeodomain of HOXD13 are associated with brachydactyly types D and E.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the Ile314Leu mutation (which resides at the 47th position of the homeodomain) exhibited increased affinity for a target containing the core recognition sequence 5'-TTAC-3' but decreased affinity for a 5'-TTAT-3' target"
    explanation: Shows the missense allele rebalances rather than abolishes target-site selection.
  - reference: PMID:22233338
    reference_title: "Isolated brachydactyly type E caused by a HOXD13 nonsense mutation: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "So far, only two missense HOXD13 substitutions (p.S308C and p.I314L), localized within the homeodomain of the HOXD13 transcription factor, as well as a single nonsense mutation (p.E181X) were associated with BDE."
    explanation: Enumerates the BDE-associated HOXD13 allele set before the reported case.
  downstream:
  - target: Disturbed Metacarpal and Metatarsal Growth Specification
    description: >-
      Altered HOXD13 output changes how the length of the metacarpal and
      metatarsal segments is specified in the autopod.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:12649808
      reference_title: Missense mutations in the homeodomain of HOXD13 are associated with brachydactyly types D and E.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Both are associated with distinctive limb phenotypes in which brachydactyly of specific metacarpals, metatarsals, and phalangeal bones is the most constant feature, exhibiting overlap with brachydactyly types D and E."
      explanation: Links the HOXD13 alleles to selective metacarpal and metatarsal shortening.
- name: Disturbed Metacarpal and Metatarsal Growth Specification
  conforms_to: "limb_digit_patterning_serial_homology#Disrupted Digit Number and Identity Specification"
  role: central_effector
  biological_scale: TISSUE
  description: >
    The lesion acts on the metacarpal and metatarsal segments rather than on
    phalangeal segmentation, which is what separates type E from types A-C.
    Radiographs attribute the shortening to hypoplastic and partially fused
    metacarpal epiphyses, so as in type D the proximate abnormality is
    growth-plate behaviour in specific skeletal elements. Involvement is
    selective and asymmetric — most often the fourth ray, in variable
    combinations — and is postaxially weighted.
  biological_processes:
  - preferred_term: Endochondral Ossification
    term:
      id: GO:0001958
      label: endochondral ossification
    modifier: ABNORMAL
  - preferred_term: Embryonic Digit Morphogenesis
    term:
      id: GO:0042733
      label: embryonic digit morphogenesis
    modifier: ABNORMAL
  cell_types:
  - preferred_term: Chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  evidence:
  - reference: PMID:18554391
    reference_title: Brachydactyly.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "This results from hypoplastic and partially fused metacarpal epiphyses"
    explanation: Attributes the metacarpal shortening to hypoplastic, partially fused epiphyses.
  - reference: PMID:22233338
    reference_title: "Isolated brachydactyly type E caused by a HOXD13 nonsense mutation: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Brachydactyly type E (BDE; MIM#113300) is characterized by shortening of the metacarpal, metatarsal, and often phalangeal bones, and predominantly affects postaxial ray(s) of the limb."
    explanation: Establishes the postaxial, metacarpal-and-metatarsal distribution of the lesion.
  downstream:
  - target: Short Metacarpals with Preserved Phalangeal Length
    description: >-
      Selective metacarpal and metatarsal shortening produces small hands and
      feet with digits of near-normal proportion.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:20170896
      reference_title: Deletion and point mutations of PTHLH cause brachydactyly type E.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Autosomal-dominant brachydactyly type E (BDE) is a congenital limb malformation characterized by small hands and feet predominantly as a result of shortened metacarpals and metatarsals."
      explanation: States the realised hand and foot morphology of BDE.
- name: Short Metacarpals with Preserved Phalangeal Length
  conforms_to: "limb_digit_patterning_serial_homology#Serially Homologous Autopod Malformation"
  role: consequence
  biological_scale: TISSUE
  description: >
    The realised malformation: variable shortening of the metacarpals with
    phalanges of more or less normal length, terminal phalanges often short,
    metatarsals variably involved, hyperextensible hand joints, and mild short
    stature. The fourth metacarpal is the classic target and gives the metacarpal
    sign — a line touching the heads of the third and fifth metacarpals in the
    closed fist passes over, rather than through, the receding fourth.
  biological_processes:
  - preferred_term: Limb Morphogenesis
    term:
      id: GO:0035108
      label: limb morphogenesis
    modifier: ABNORMAL
  evidence:
  - reference: PMID:18554391
    reference_title: Brachydactyly.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Variable shortening of the metacarpals with more or less normal length of phalanges"
    explanation: Defines the cardinal BDE skeletal pattern.
  - reference: PMID:18554391
    reference_title: Brachydactyly.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Short 4th metacarpal can be diagnosed by a positive metacarpal sign."
    explanation: Names the clinical sign that detects the characteristic fourth-ray shortening.
  downstream:
  - target: Type E Brachydactyly
    causal_link_type: DIRECT
  - target: Short Fourth Metacarpal
    causal_link_type: DIRECT
  - target: Short Metacarpal
    causal_link_type: DIRECT
  - target: Short Metatarsal
    causal_link_type: DIRECT
  - target: Short Distal Phalanx of Finger
    causal_link_type: DIRECT
  - target: Short Broad Thumb (BDD Overlap)
    causal_link_type: DIRECT
  - target: Mild Short Stature
    causal_link_type: DIRECT
  - target: Round Face
    causal_link_type: DIRECT

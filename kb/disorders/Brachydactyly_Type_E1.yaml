genetic:
- name: HOXD13 Homeodomain and Truncating Variants
  gene_term:
    preferred_term: HOXD13
    term:
      id: hgnc:5136
      label: HOXD13
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Heterozygous homeodomain missense substitutions (p.S308C, p.I314L) and
    truncating nonsense alleles (p.E181X, p.R274X). Only four HOXD13 alleles had
    been reported in typical isolated BDE as of the most recent case series, and
    the majority of isolated BDE has no identified molecular cause.
  evidence:
  - reference: PMID:22233338
    reference_title: "Isolated brachydactyly type E caused by a HOXD13 nonsense mutation: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Originally, the molecular cause of isolated BDE has been unravelled in 2 families and shown to result from heterozygous missense mutations in the homeodomain of the HOXD13 gene."
    explanation: Establishes HOXD13 homeodomain missense variants as the original molecular cause of isolated BDE.
  - reference: PMID:22233338
    reference_title: "Isolated brachydactyly type E caused by a HOXD13 nonsense mutation: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this paper, we report on a Polish family exhibiting isolated BDE caused by a novel nonsense heterozygous HOXD13 mutation."
    explanation: Extends the BDE allele class to truncating variants.
- name: PTHLH Variants (Type E2, Not This Entry)
  gene_term:
    preferred_term: PTHLH
    term:
      id: hgnc:9607
      label: PTHLH
  association: Causative for the separate type E2 entity
  relationship_type: DISPUTED
  variant_origin: GERMLINE
  notes: >-
    Recorded here only to mark the boundary of this entry. Loss-of-function
    PTHLH deletions and point mutations cause brachydactyly type E with short
    stature (type E2, MONDO:0013244, OMIM 613382), which the ISDS nosology places
    in the parathyroid hormone signaling cascade group rather than the
    brachydactyly group. PTHLH is not a cause of the HOXD13-related type E1
    curated here; `relationship_type: DISPUTED` flags that this row is a
    boundary marker rather than a gene-disease assertion for this entry.
  evidence:
  - reference: PMID:20170896
    reference_title: Deletion and point mutations of PTHLH cause brachydactyly type E.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thus, loss-of-function mutations in PTHLH cause BDE with short stature."
    explanation: Establishes PTHLH as the cause of the separate short-stature BDE entity.
  - reference: PMID:20170896
    reference_title: Deletion and point mutations of PTHLH cause brachydactyly type E.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In a large pedigree with BDE, short stature, and learning disabilities, we detected a microdeletion of approximately 900 kb encompassing PTHLH, the gene coding for parathyroid hormone related protein (PTHRP)."
    explanation: Describes the PTHLH deletion phenotype that distinguishes type E2 from isolated type E1.
diagnosis:
- name: Clinical-radiographic and molecular diagnosis
  description: >-
    Hand and foot radiographs show variably shortened metacarpals and metatarsals
    with near-normal phalanges; the metacarpal sign detects fourth-ray shortening
    at the bedside. The diagnostic work is mostly exclusion: the same hand occurs
    in Albright hereditary osteodystrophy, in Turner syndrome, in 2q37 deletion,
    and with PTHLH mutations, so isolated BDE is a diagnosis reached after those
    are excluded. HOXD13 sequencing confirms the type E1 form when positive, but
    is negative in most isolated BDE.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  results: >-
    Short metacarpals with preserved phalangeal length and a positive metacarpal
    sign, with a heterozygous HOXD13 variant when molecularly solved.
  evidence:
  - reference: PMID:18554391
    reference_title: Brachydactyly.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Clinical and radiological evaluation of hand bones."
    explanation: States the diagnostic method for BDE.
  - reference: PMID:18554391
    reference_title: Brachydactyly.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "a useful example of genetic heterogeneity, because in addition to the autosomal dominant isolated type and Albright hereditary osteodystrophy, it also occurs with Turner syndrome."
    explanation: Names the principal differential diagnoses that must be excluded.
  - reference: PMID:22233338
    reference_title: "Isolated brachydactyly type E caused by a HOXD13 nonsense mutation: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Isolated BDE is rare and in the majority of cases the molecular pathogenesis has so far not been resolved."
    explanation: Explains why a negative HOXD13 result does not exclude isolated BDE.
  - reference: PMID:40589517
    reference_title: Establishing an algorithm for molecular genetic diagnostics in Chinese children with brachydactyly type E.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnostic yield was 19.1% in patients with isolated brachydactyly; 75% in patients with brachydactyly combined with short stature; 77.8% in patients with brachydactyly combined with facial dysmorphism; 83.3% in patients with brachydactyly combined with intellectual disability."
    explanation: >-
      Quantifies the payoff of sequencing by phenotype: isolated BDE is mostly
      unsolved, while any accompanying feature quadruples the yield - which is
      what makes "is this brachydactyly really isolated?" the decisive question.
  - reference: PMID:40589517
    reference_title: Establishing an algorithm for molecular genetic diagnostics in Chinese children with brachydactyly type E.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "GNAS mutations were the leading cause (four cases), followed by EXT1 and ACAN defects."
    explanation: >-
      In an unselected radiographic BDE cohort the solved cases were mostly
      syndromic genes, not HOXD13 - so a BDE hand is more often a clue to
      another diagnosis than to isolated type E1.

- name: Genetic Counseling
  description: >-
    Counseling for autosomal dominant transmission with variable expressivity,
    once syndromic causes of short metacarpals have been excluded.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:

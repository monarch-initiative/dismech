      label: Genetic Counseling
  evidence:
  - reference: PMID:18554391
    reference_title: Brachydactyly.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The nature of genetic counseling depends both on the pattern of inheritance of the type of brachydactyly present in the family and on the presence or absence of accompanying symptoms."
    explanation: Supports inheritance- and phenotype-specific counseling.
- name: Function- or Cosmesis-Directed Hand Surgery
  description: >-
    Surgery is reserved for meaningful impairment of hand function or selected
    cosmetic indications and is usually unnecessary in isolated BDE.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical procedure

notes: >-
  Although ovarian cancer can spread hematogenously late in its course, its defining
  metastatic
  biology is transcoelomic. High-grade serous tumors dominate this phenotype and explain
  the
  choice of MONDO ovarian serous adenocarcinoma as the structured disease term.
treatments:
- name: PARP Inhibitor Maintenance for BRCA-Mutated or HRD Disease
  description: PARP inhibitor maintenance therapy is used in advanced or metastatic ovarian cancer with BRCA mutation or homologous recombination deficiency, exploiting impaired DNA repair to prolong disease control after platinum-responsive therapy.
  treatment_term:
    preferred_term: targeted therapy
    term:
      id: NCIT:C93352
      label: Targeted Therapy
    therapeutic_agent:
    - preferred_term: olaparib
      term:
        id: CHEBI:83766
        label: olaparib
    - preferred_term: niraparib
      term:
        id: CHEBI:176844
        label: niraparib
    - preferred_term: rucaparib
      term:
        id: CHEBI:134689
        label: rucaparib
  evidence:
  - reference: DOI:10.3390/cancers15123095
    reference_title: Prevalence of Homologous Recombination Deficiency in First-Line PARP Inhibitor Maintenance Clinical Trials and Further Implication of Personalized Treatment in Ovarian Cancer
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Among ovarian cancer patients with BRCA mutation or homologous recombination deficiency (HRD), the efficacy of Poly-ADP-ribose polymerase (PARP) inhibitors such as olaparib, niraparib, veliparib, and rucaparib has been proven in a number of clinical trials.
    explanation: Review-level synthesis supports PARP inhibitor maintenance as a treatment class for BRCA-mutated or HRD ovarian cancer.
- name: Hyperthermic Intraperitoneal Chemotherapy at Interval Cytoreductive Surgery
  description: >-
    Heated cisplatin perfused through the peritoneal cavity at the time of interval
    cytoreductive surgery, after neoadjuvant carboplatin and paclitaxel. The
    rationale is compartmental: metastatic ovarian cancer sits on peritoneal
    surfaces that intravenous drug reaches poorly, so the drug is delivered into
    the compartment that carries the tumour burden. In the OVHIPEC-1 phase 3 trial
    the addition of HIPEC extended median overall survival from 33.9 to 45.7 months
    without increasing grade 3-4 toxicity. Benefit appears specific to the interval
    (post-neoadjuvant) setting; it has not been shown after primary debulking
    surgery, and the mechanism of benefit is not established.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: hyperthermic intraperitoneal chemotherapy
    term:
      id: NCIT:C91835
      label: Hyperthermic Intraperitoneal Chemotherapy
    therapeutic_agent:
    - preferred_term: cisplatin
      term:
        id: CHEBI:27899
        label: cisplatin
  target_mechanisms:
  - target: Transcoelomic Dissemination and Spheroid Formation
    treatment_effect: INHIBITS
    description: >-
      HIPEC attacks transcoelomic disease in its own compartment. Intravenous
      chemotherapy penetrates peritoneal nodules poorly, whereas intraperitoneal
      perfusion places cytotoxic drug in direct contact with the implanted deposits,
      and the peritoneal-plasma barrier holds a high intratumoural concentration
      while keeping systemic exposure low.
    evidence:
    - reference: PMID:36077477
      reference_title: 'Hyperthermic Intraperitoneal Chemotherapy (HIPEC): An Overview of the Molecular and Cellular Mechanisms of Actions and Effects on Epithelial Ovarian Cancers.'
      supports: SUPPORT
      evidence_source: OTHER
      snippet: In a two-compartment model, the peritoneal-plasma barrier blocks the leakage of chemotherapeutic agents from peritoneal cavity and tumor tissues to local vessels, thus maintaining a higher concentration of chemotherapeutic agents within the tumor tissues to facilitate tumor apoptosis and a lower concentration of chemotherapeutic agents within the local vessels to decrease systemic toxicity.
      explanation: States the compartmental pharmacology by which intraperitoneal delivery acts on peritoneally disseminated tumour rather than through the systemic circulation.
    - reference: PMID:36077477
      reference_title: 'Hyperthermic Intraperitoneal Chemotherapy (HIPEC): An Overview of the Molecular and Cellular Mechanisms of Actions and Effects on Epithelial Ovarian Cancers.'
      supports: SUPPORT
      evidence_source: OTHER
      snippet: systemic treatment with intravenous chemotherapeutic agents for peritoneal metastasis appears to be less effective due to the poor blood supply to the peritoneal surface with low drug penetration into tumor nodules
      explanation: States the delivery deficit that intraperitoneal administration is intended to overcome, tying the treatment to the transcoelomic route of spread.
  - target: BRCA-Associated Homologous Recombination Deficiency
    treatment_effect: ACTIVATES
    description: >-
      Beyond delivery, hyperthermia is reported to degrade BRCA2 and suppress
      homologous recombination, pharmacologically inducing an HRD-like state that
      would broaden platinum synergy past the germline-BRCA subset. The link is
      ACTIVATES because HIPEC is proposed to increase, not block, homologous
      recombination deficiency, and the therapeutic gain follows from that
      induced deficiency. Note this is a review-level mechanistic assertion; the
      same review calls for HIPEC outcomes to be correlated with BRCA and HRR
      status precisely because the claim is not yet clinically demonstrated.
    evidence:
    - reference: PMID:36191972
      reference_title: 'Hyperthermic Intraperitoneal Chemotherapy in the Management of Primary Epithelial Ovarian Cancer: A Debated Issue for Gynecologic Oncologists.'
      supports: SUPPORT
      evidence_source: OTHER
      snippet: The hyperthermia enhances drug tissue penetration, synergizes with several cytotoxic drugs including cisplatin, degrades BRCA2, suppresses homologous recombination, and elicits an anticancer immune response.
      explanation: Attributes BRCA2 degradation and homologous-recombination suppression to the hyperthermia component, which is what links HIPEC to the HRD node.
  evidence:
  - reference: PMID:29342393
    reference_title: Hyperthermic Intraperitoneal Chemotherapy in Ovarian Cancer.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: the addition of HIPEC to interval cytoreductive surgery resulted in longer recurrence-free survival and overall survival than surgery alone and did not result in higher rates of side effects
    explanation: OVHIPEC-1, a multicentre phase 3 randomised trial, is the primary clinical evidence for adding HIPEC to interval cytoreductive surgery in stage III epithelial ovarian cancer.
  - reference: PMID:29342393
    reference_title: Hyperthermic Intraperitoneal Chemotherapy in Ovarian Cancer.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The median overall survival was 33.9 months in the surgery group and 45.7 months in the surgery-plus-HIPEC group.
    explanation: Quantifies the survival difference reported in the trial, supporting the effect size stated in the description.
  - reference: PMID:36191972
    reference_title: 'Hyperthermic Intraperitoneal Chemotherapy in the Management of Primary Epithelial Ovarian Cancer: A Debated Issue for Gynecologic Oncologists.'
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: the available data from two phase III trials seem to suggest that the addition of HIPEC to interval debulking surgery after neoadjuvant chemotherapy significantly improves PFS and OS. Conversely, HIPEC does not appear to offer any advantage after primary debulking surgery.
    explanation: Qualifies the indication - the benefit is confined to the interval-debulking setting, so this supports the treatment only as scoped in its name and description.
  notes: >-
    Scoped deliberately to the interval-debulking indication. HIPEC after primary
    debulking surgery, and HIPEC in recurrent disease, are separate questions with
    different and less favourable evidence, and should not be inferred from this
    entry.
- name: Cytoreductive Surgery with Carboplatin-Paclitaxel Chemotherapy
  description: >-
    The first-line standard of care for advanced ovarian cancer, and the
    backbone that every other treatment in this entry is added to: maximal
    cytoreductive surgery aiming for no gross residual disease, combined with
    platinum-taxane chemotherapy. It is delivered either as primary debulking
    surgery followed by chemotherapy, or as neoadjuvant chemotherapy followed by
    interval debulking surgery when tumour load or performance status makes
    upfront complete cytoreduction unlikely. The HIPEC entry below is an adjunct
    administered at that interval surgery, and the bevacizumab and PARP-inhibitor
    entries are added to this same chemotherapy backbone.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: cytoreductive surgery
    term:
      id: NCIT:C132068
      label: Cytoreductive Surgery
    therapeutic_agent:
    - preferred_term: carboplatin
      term:
        id: CHEBI:31355
        label: carboplatin
    - preferred_term: paclitaxel
      term:
        id: CHEBI:45863
        label: paclitaxel
  target_mechanisms:
  - target: Transcoelomic Dissemination and Spheroid Formation
    treatment_effect: INHIBITS
    description: >-
      Cytoreduction physically removes the peritoneal deposits that transcoelomic
      spread has established, and the platinum-taxane backbone targets residual
      and microscopic disease; the surgical goal of no gross residual disease is
      defined against exactly the peritoneal tumour burden this node describes.
    evidence:
    - reference: DOI:10.3390/cancers15020407
      reference_title: Diagnostic and Therapeutic Pathway of Advanced Ovarian Cancer with Peritoneal Metastases
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Aiming to assess the likelihood of leaving no residual disease at the end
        of surgery
      explanation: >-
        States that the surgical objective is elimination of residual peritoneal
        disease, which is the burden this node models.
  evidence:
  - reference: DOI:10.3390/cancers15020407
    reference_title: Diagnostic and Therapeutic Pathway of Advanced Ovarian Cancer with Peritoneal Metastases
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this scenario, standard treatment includes a combination of
      cytoreductive surgery and carboplatinum–paclitaxel-based chemotherapy.
    explanation: >-
      Direct statement of the first-line standard of care for advanced-stage
      disease, which is the intervention the other treatments in this entry
      modify or are added to.
  notes: >-
    The choice between primary debulking surgery and neoadjuvant chemotherapy
    with interval debulking remains debated; the cited review describes the
    upfront-surgery survival advantage as demonstrated but the topic as still a
    matter of debate. This entry records the shared backbone rather than
    adjudicating that choice. Note that the snippets here carry a DOI: prefix,
    which conf/reference_validator_config.yaml lists under skip_prefixes, so they
    are not machine snippet-checked; both were read against the cached abstract
    in references_cache/DOI_10.3390_cancers15020407.md.
- name: Bevacizumab
  description: >-
    A humanised anti-VEGF monoclonal antibody added to carboplatin-paclitaxel
    and continued as maintenance. Two phase 3 trials established a modest but
    reproducible progression-free survival benefit: GOG-0218 (median PFS 14.1 vs
    10.3 months with bevacizumab throughout) and ICON7 (restricted-mean PFS at 42
    months 24.1 vs 22.4 months). Neither trial showed a significant overall
    survival benefit in the whole population; in ICON7 the benefit was larger in
    the subgroup at high risk of progression. Hypertension is the characteristic
    toxicity.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: bevacizumab
      term:
        id: NCIT:C2039
        label: Bevacizumab
  target_mechanisms:
  - target: Tumor Angiogenesis
    treatment_effect: INHIBITS
    description: >-
      Bevacizumab sequesters VEGF, the ligand driving the neovascularisation
      curated at this node. This is the treatment behind the node's own statement
      that anti-VEGF therapy is part of maintenance for advanced-stage disease.
    evidence:
    - reference: PMID:22204724
      reference_title: Incorporation of bevacizumab in the primary treatment of ovarian cancer.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Vascular endothelial growth factor is a key promoter of angiogenesis and
        disease progression in epithelial ovarian cancer. Bevacizumab, a
        humanized anti-vascular endothelial growth factor monoclonal antibody,
        has shown single-agent activity in women with recurrent tumors.
      explanation: >-
        Names VEGF as the driver of the angiogenesis this node describes and
        bevacizumab as the antibody directed against it.
  evidence:
  - reference: PMID:22204724
    reference_title: Incorporation of bevacizumab in the primary treatment of ovarian cancer.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The median progression-free survival was 10.3 months in the control group,
      11.2 in the bevacizumab-initiation group, and 14.1 in the
      bevacizumab-throughout group.
    explanation: >-
      The GOG-0218 primary endpoint result, quoted with all three arms so the
      benefit is attributable to continued maintenance rather than to
      bevacizumab during chemotherapy alone.
  - reference: PMID:22204724
    reference_title: Incorporation of bevacizumab in the primary treatment of ovarian cancer.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At the time of analysis, 76.3% of patients were alive, with no significant
      differences in overall survival among the three groups.
    explanation: >-
      Records the negative overall-survival result, which is why this treatment
      is curated as a progression-free-survival benefit rather than a survival
      benefit.
  - reference: PMID:22204725
    reference_title: A phase 3 trial of bevacizumab in ovarian cancer.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      progression-free survival (restricted mean) at 42 months was 22.4 months
      without bevacizumab versus 24.1 months with bevacizumab
    explanation: >-
      The independent ICON7 confirmation, at a different bevacizumab dose and
      schedule.
  notes: >-
    Both trials report progression-free rather than overall survival benefit in
    the whole population; ICON7 additionally reports a non-proportional hazard
    with maximum effect at 12 months, diminishing by 24 months, and a larger
    benefit in the high-risk-of-progression subgroup. Curated here without
    asserting an overall survival benefit.

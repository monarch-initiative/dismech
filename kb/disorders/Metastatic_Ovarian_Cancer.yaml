animal_models:
- name: Noninvasive external-abdominal-heat HIPEC mouse model
  species: Mouse
  background: C57BL/6J and NSG mice bearing intraperitoneal syngeneic (ID8-luc, IE9)
    ovarian tumour cells
  publication: PPR:PPR1273953
  description: >-
    A model of the HIPEC intervention rather than of the disease. Tumour-bearing
    mice are heated externally across the abdomen to a target of 42 degrees Celsius
    and given cisplatin, substituting external heating for the intraperitoneal
    perfusion circuit used clinically, so that hyperthermic chemotherapy can be
    given without laparotomy and to several animals per procedure. The authors
    report attenuated tumour growth, delayed ascites and longer survival relative
    to normothermic cisplatin. Reported in a non-peer-reviewed preprint.
  evidence:
  - reference: PPR:PPR1273953
    reference_title: Development of a noninvasive murine model of hyperthermic intraperitoneal
      chemotherapy (HIPEC) treatment for ovarian cancer
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: We have developed the first non-invasive animal model by using external abdominal heat with chemotherapy.
    explanation: Describes what the model is and how it differs from clinical HIPEC, which is the basis for treating it as a tractable but non-identical surrogate.
  modeled_mechanisms:
  - target: Transcoelomic Dissemination and Spheroid Formation
    relationship: PERTURBS
    fidelity: LOW
    description: >-
      Intraperitoneal tumour cells establish peritoneal disease with ascites, and
      hyperthermic cisplatin is applied to that compartment as the perturbation.
      The model manipulates peritoneal dissemination under hyperthermic
      chemotherapy; it does not claim to reproduce the human transcoelomic
      mechanism itself.
    limitations: >-
      Heat is applied externally across the abdominal wall rather than by
      intraperitoneal perfusion at laparotomy, so the thermal and drug gradients
      across peritoneal deposits are not the clinical ones; murine peritoneal
      scale, syngeneic ID8/IE9 tumour biology and the absence of prior
      neoadjuvant carboplatin-paclitaxel and cytoreduction all diverge from the
      OVHIPEC-1 setting. The source is a non-peer-reviewed preprint, so these
      results should not be transferred to human disease without corroboration.
    readouts:
    - name: Peritoneal tumour growth, ascites onset and survival under hyperthermic
        versus normothermic cisplatin
      target: Transcoelomic Dissemination and Spheroid Formation
      description: >-
        Composite outcome reported for hyperthermic chemotherapy against a
        normothermic cisplatin comparator in the same model.
      direction: DECREASED
      interpretation: >-
        Reduced tumour growth with delayed ascites is the model's readout on the
        peritoneal-dissemination node; DECREASED refers to tumour burden, with
        ascites onset and survival moving in the corresponding favourable
        direction.
      evidence:
      - reference: PPR:PPR1273953
        reference_title: Development of a noninvasive murine model of hyperthermic intraperitoneal
          chemotherapy (HIPEC) treatment for ovarian cancer
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: significant attenuation of tumor growth, delayed tumor-associated ascites development, and extended survival after treatment with hyperthermic chemotherapy compared to normothermic cisplatin treatment
        explanation: Reports the three measurements behind this readout together with the normothermic comparator they are measured against.
    evidence:
    - reference: PPR:PPR1273953
      reference_title: Development of a noninvasive murine model of hyperthermic intraperitoneal
        chemotherapy (HIPEC) treatment for ovarian cancer
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: A rapid noninvasive animal model is lacking for the study of HIPEC.
      explanation: States the gap this model is built to fill, which is why it is informative for the peritoneal-dissemination node under hyperthermic chemotherapy.
  notes: >-
    Cited from a non-peer-reviewed preprint (PPR:PPR1273953) and used only as
    support for claims about the model itself, never as sole support for a human
    mechanism or phenotype.
discussions:
- discussion_id: hipec_mechanism_of_benefit
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why does adding hyperthermic intraperitoneal chemotherapy to interval
    cytoreductive surgery extend survival in advanced ovarian cancer - is the
    gain compartmental drug delivery, hyperthermic potentiation of cisplatin,
    heat-induced suppression of homologous recombination, or an anticancer
    immune response - and which patients benefit?
  attaches_to:
  - pathophysiology#Transcoelomic Dissemination and Spheroid Formation
  - pathophysiology#BRCA-Associated Homologous Recombination Deficiency
  rationale: >-
    HIPEC is one of the few interventions in this entry with a randomised overall
    survival benefit, yet the pathograph cannot say which node carries that
    benefit. Several candidate mechanisms are proposed together in the review
    literature and are not separated by the clinical trials, and the benefit is
    setting-dependent - present after neoadjuvant chemotherapy and interval
    debulking, absent after primary debulking - which itself argues that the
    effective mechanism is conditional on tumour state rather than a fixed
    property of the perfusion. Resolving this determines whether HIPEC should be
    modelled as acting on peritoneal dissemination, on homologous recombination,
    or on both, and whether BRCA/HRR status is a selection marker. Until then the
    two target_mechanisms links on the HIPEC treatment should be read as
    competing candidate routes, not as an established parallel mechanism.
  evidence:
  - reference: PPR:PPR1273953
    reference_title: Development of a noninvasive murine model of hyperthermic intraperitoneal
      chemotherapy (HIPEC) treatment for ovarian cancer
    supports: SUPPORT
    evidence_source: OTHER
    snippet: extending overall survival by nearly 12 months, yet the mechanisms of benefit remain unknown
    explanation: >-
      States the gap directly - a measured survival benefit whose mechanism is
      unestablished. Tagged OTHER rather than MODEL_ORGANISM because this
      sentence is the preprint's introduction restating the human OVHIPEC-1
      trial result, not a finding from its murine model; the model-derived
      snippets from the same preprint elsewhere in this entry remain
      MODEL_ORGANISM.
  - reference: PMID:36077477
    reference_title: 'Hyperthermic Intraperitoneal Chemotherapy (HIPEC): An Overview of the Molecular and Cellular Mechanisms of Actions and Effects on Epithelial Ovarian Cancers.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: many unknown aspects of HIPEC, including detailed mechanisms of actions, along with the effectiveness and safety for the treatment of EOCs, warrant further investigation
    explanation: A dedicated mechanism review reaches the same conclusion, so the gap is not an artefact of one source.
  - reference: PMID:36191972
    reference_title: 'Hyperthermic Intraperitoneal Chemotherapy in the Management of Primary Epithelial Ovarian Cancer: A Debated Issue for Gynecologic Oncologists.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: A meta-analysis of retrospective studies including both patients with primary advanced EOC and those with recurrent platinum-sensitive EOC failed to detect a benefit in terms of progression-free survival (PFS) or overall survival (OS) from the addition of HIPEC after surgery.
    explanation: Records the negative side of the evidence base, which is why the benefit is scoped to the interval-debulking setting rather than to HIPEC generally.
  - reference: PMID:36191972
    reference_title: 'Hyperthermic Intraperitoneal Chemotherapy in the Management of Primary Epithelial Ovarian Cancer: A Debated Issue for Gynecologic Oncologists.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: the clinical outcome of patients who undergo HIPEC should be correlated with BRCA status and homologous recombination repair status
    explanation: Names the specific stratification that would test the homologous-recombination route against the delivery route.
  notes: >-
    Raised from monarch-initiative/dismech#6426. The preprint's noninvasive murine
    HIPEC model, recorded under animal_models, is one route to separating these
    candidate mechanisms experimentally.

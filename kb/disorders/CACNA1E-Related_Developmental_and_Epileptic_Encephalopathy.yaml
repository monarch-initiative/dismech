- name: Slowed Cav2.3 Inactivation
  description: Phe698Ser, Ile701Val and Ala702Thr slow fast inactivation in the 2018 recombinant-channel assays, prolonging current during depolarization. Ile603Leu and Leu228Pro did not share this kinetic change. Loss of CDKL5-dependent phosphorylation produces a convergent gating effect in engineered models; it is not the genetic lesion of DEE69.
  biological_scale: MOLECULAR
  role: central_effector
  evidence:
  - reference: PMID:30343943
    reference_title: "De Novo Pathogenic Variants in CACNA1E Cause Developmental and Epileptic Encephalopathy with Contractures, Macrocephaly, and Dyskinesias."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Additionally, the time course of fast inactivation was significantly slowed, as indicated by an increased residual current after a 400-ms depolarizing pulse normalized to the peak current (r400) (Figures 2 and S1; Table 2).
    explanation: Slower fast inactivation was measured for the three tested DII-S6 variants.

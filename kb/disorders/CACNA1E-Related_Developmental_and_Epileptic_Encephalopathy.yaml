    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: firing properties were identical between WT and S15A mice under baseline conditions (Fig. 3g–i).
    explanation: Baseline firing was unchanged in S15A mouse CA1 cells; the excess depolarization emerged during cholinergic stimulation.
  - reference: PMID:38081835
    reference_title: "Epilepsy-linked kinase CDKL5 phosphorylates voltage-gated calcium channel Cav2.3, altering inactivation kinetics and neuronal excitability."

name: CACNA1E-Related Developmental and Epileptic Encephalopathy
creation_date: "2026-07-25T00:00:00Z"
description: >-
  CACNA1E-related developmental and epileptic encephalopathy (DEE69) is a predominantly de novo dominant calcium-channel
  disorder, usually presenting with early-onset seizures, severe developmental impairment and axial hypotonia.
  Movement disorders, congenital contractures, spasticity and macrocephaly are recurrent features. Gain-of-function
  effects are established for several missense variants in recombinant Cav2.3 channels, but the affected gating
  parameters differ by variant. The neuronal and developmental consequences are incompletely resolved. This
  entry focuses on the DEE presentation; the wider CACNA1E spectrum also includes developmental disorders without
  ongoing epilepsy and experimentally characterized loss-of-function variants with variable neurological phenotypes.
  Seizure absence at a young assessment age, sustained remission and lifetime absence of seizures are distinct
  clinical histories.

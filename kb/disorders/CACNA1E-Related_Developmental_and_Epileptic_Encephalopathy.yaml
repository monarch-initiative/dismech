  - reference: PMID:38780451
    reference_title: "Seizure and movement disorder in CACNA1E developmental and epileptic encephalopathy: Two sides of the same coin or same side of two different coins?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Long-term video-EEG-monitoring documented subsequent tonic asymmetric

  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    The disorder arises almost exclusively from de novo heterozygous CACNA1E
    missense variants; recurrent gain-of-function variants at the S6 activation
    gate act dominantly, so a single altered allele is sufficient to cause disease.
  evidence:
  - reference: PMID:30343943
    reference_title: "De Novo Pathogenic Variants in CACNA1E Cause Developmental and Epileptic Encephalopathy with Contractures, Macrocephaly, and Dyskinesias."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we identified de novo CACNA1E variants in 30 individuals with DEE,
      characterized by refractory infantile-onset seizures, severe hypotonia, and
      profound developmental impairment, often with congenital contractures,
      macrocephaly, hyperkinetic movement disorders, and early death.
    explanation: >-
      Establishes de novo heterozygous CACNA1E variants as the genetic basis of
      the disorder in a large international cohort.

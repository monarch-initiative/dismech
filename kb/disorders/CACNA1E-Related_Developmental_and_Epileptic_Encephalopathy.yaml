    evidence_source: MODEL_ORGANISM
    snippet: >-
      Cav2.3 is also known to play a role in epileptogenesis in rodents, and its
      deletion reduces susceptibility to chemically induced seizures.
    explanation: >-
      Provides model-organism support that Cav2.3 activity is pro-epileptogenic,
      consistent with gain-of-function causing hyperexcitability.

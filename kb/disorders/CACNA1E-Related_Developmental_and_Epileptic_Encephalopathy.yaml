    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most of the 14, partially recurring, variants cluster within the cytoplasmic
      ends of all four S6 segments, which form the presumed CaV2.3 channel
      activation gate.
    explanation: >-
      Localizes the recurrent pathogenic variants to the S6 activation gate of the
      Cav2.3 channel, the structural basis of the gain-of-function trigger.
  - reference: PMID:30343943
    reference_title: "De Novo Pathogenic Variants in CACNA1E Cause Developmental and Epileptic Encephalopathy with Contractures, Macrocephaly, and Dyskinesias."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Functional analysis of several S6 variants revealed consistent
      gain-of-function effects comprising facilitated voltage-dependent activation
      and slowed inactivation.
    explanation: >-
      Demonstrates the gain-of-function biophysical phenotype (facilitated
      activation, slowed inactivation) of the S6 variants.
  - reference: PMID:30343943
    reference_title: "De Novo Pathogenic Variants in CACNA1E Cause Developmental and Epileptic Encephalopathy with Contractures, Macrocephaly, and Dyskinesias."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Another variant located in the domain II S4-S5 linker results in facilitated
      activation and increased current density.
    explanation: >-
      Shows a second gain-of-function mechanism (facilitated activation with
      increased current density) for a non-S6 variant.
  - reference: PMID:38081835
    reference_title: "Epilepsy-linked kinase CDKL5 phosphorylates voltage-gated calcium channel Cav2.3, altering inactivation kinetics and neuronal excitability."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The properties of unphosphorylated Cav2.3 closely resemble those described
      for CACNA1E gain-of-function mutations causing DEE69, a disorder sharing
      clinical features with CDD. We show that these two single-gene diseases are
      mechanistically related and could be ameliorated with Cav2.3 inhibitors.
    explanation: >-
      Independent CDKL5-deficiency work shows this Cav2.3 gain-of-function state is
      a convergence point: unphosphorylated Cav2.3 arising from CDKL5 loss
      phenocopies the CACNA1E DEE69 gain-of-function channel, marking this trigger
      node as a mechanistic module shared with CDKL5 deficiency disorder and a
      common Cav2.3-inhibitor target.
  downstream:
  - target: Increased Neuronal Calcium Influx
    causal_link_type: DIRECT
- name: Increased Neuronal Calcium Influx
  description: >-
    The gain-of-function Cav2.3 channel conducts excess high-voltage-activated
    R-type calcium current. Because Cav2.3 is expressed at both presynaptic
    terminals and in the somatodendritic compartment, facilitated activation and
    slowed inactivation increase depolarization-evoked calcium entry, raising
    intracellular calcium beyond the physiological range.
  role: central_effector
  biological_scale: CELLULAR

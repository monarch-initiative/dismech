- name: Neuronal Hyperexcitability and Excitation-Inhibition Imbalance
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Neuronal Hyperexcitability and Hypersynchrony"
  description: >-
    Excess R-type calcium current and deranged transmitter release shift cortical
    networks toward hyperexcitability and excitation-inhibition imbalance, the
    substrate for the refractory infantile-onset seizures and abundant
    epileptiform activity that define the encephalopathy. Cav2.3 has an
    established pro-epileptogenic role in rodents, where channel deletion reduces
    seizure susceptibility.

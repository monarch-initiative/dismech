animal_models:
- name: Cav2.3 S15A Phosphomutant Mouse
  species: Mus musculus
  genotype: Homozygous Cacna1e S15A phosphorylation-site substitution
  description: An engineered CDKL5 phosphorylation-site model, not a patient-variant knock-in. Memory, sociability and locomotor effects were observed, with some sex dependence. Female mice had enhanced kainate susceptibility; maximal seizure severity and baseline electrocorticography were unchanged, and spontaneous behavioral seizures were not observed through 40 weeks.
  publication: PMID:38081835
  evidence:
  - reference: PMID:38081835
    reference_title: "Epilepsy-linked kinase CDKL5 phosphorylates voltage-gated calcium channel Cav2.3, altering inactivation kinetics and neuronal excitability."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Interestingly, however, female S15A mice had a reduced threshold to stage 5 behavioural seizures along with an increase in ECoG activity during KA (Fig. 5c).
    explanation: Female phosphomutants had increased kainate susceptibility; this is a small, sex-dependent provoked-seizure result.
  - reference: PMID:38081835
    reference_title: "Epilepsy-linked kinase CDKL5 phosphorylates voltage-gated calcium channel Cav2.3, altering inactivation kinetics and neuronal excitability."
    supports: SUPPORT

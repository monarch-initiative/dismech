- name: CACNA1E
  gene_term:
    preferred_term: CACNA1E
    term:
      id: hgnc:1392
      label: CACNA1E
  association: Predominantly gain-of-function missense variants in DEE; broader allele-specific functional spectrum
  presence: Positive
  variant_origin: DE_NOVO
  inheritance:
  - name: Autosomal Dominant (De Novo)
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
  notes: >-
    Most established DEE69 cases carry de novo missense variants, including Gly352Arg, Ile701Val and Ala702Thr;
    the functional effects must be assessed per allele. The three 2018 truncation cases had milder phenotypes
    and uncertain causal significance: one had a 27% mutant allele fraction (6/22 blood reads), one inherited
    the allele from an apparently unaffected father, and parental samples were unavailable for the third. This
    is not evidence of parental mosaicism. Later recombinant studies identified loss-of-function effects for
    H151L, M163T and R1182C in a broader neurological spectrum; these results do not establish a uniform loss-of-function
    mechanism for DEE69.

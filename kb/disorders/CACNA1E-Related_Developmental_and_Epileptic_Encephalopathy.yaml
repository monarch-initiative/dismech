- name: Epileptogenic Network Dysfunction
  description: Abnormal neuronal network activity produces seizures and epileptiform EEG abnormalities. An excitation-inhibition imbalance is a mechanistic hypothesis rather than a measured patient-specific ratio. Channel effects and experimental seizure susceptibility support this connection without defining all cellular intermediates.
  biological_scale: TISSUE
  role: central_effector

- name: CACNA1E Missense Variant
  description: Heterozygous disease-associated missense substitutions affect the Cav2.3 pore-forming alpha1E subunit. Many cluster near S6 activation-gate regions, but pathogenic substitutions also occur elsewhere. The following gain-of-function branches describe tested DEE-associated variants and do not apply automatically to every CACNA1E allele.

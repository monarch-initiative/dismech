- name: Impaired Neurodevelopment
  description: Severe developmental impairment often precedes or accompanies epilepsy. The broader CACNA1E spectrum includes regression without seizures, supporting a developmental contribution beyond epileptic activity. This does not establish identical molecular mechanisms for the DEE and non-DEE presentations. Clinical movement, tone and congenital abnormalities are associated outcomes with incompletely resolved causal intermediates.

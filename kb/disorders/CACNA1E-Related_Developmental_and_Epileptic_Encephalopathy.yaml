has_subtypes:
- name: DI-S6
  display_name: Domain I S6 (p.Gly352Arg hotspot)
  description: >-
    Missense variants clustering in the domain I S6 segment, most commonly the
    recurrent p.Gly352Arg variant. This subtype is defined by a strong
    genotype-phenotype correlation with hyperkinetic movement disorders, which
    were present in all affected individuals in this domain versus only a small
    minority of individuals with variants elsewhere.
  genes:
  - preferred_term: CACNA1E
    term:
      id: hgnc:1392
      label: CACNA1E
  evidence:
  - reference: PMID:31064215
    reference_title: "Calcium Channel Dysfunction in Epilepsy: Gain of CACNA1E."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ten individuals carried missense variants in the DI-S6 domain, including 9
      individuals with the recurrent p.Gly352Arg variant; all 10 individuals
      presented with hyperkinetic movement disorders, compared with only (2/19)
      individuals with variants outside this domain.
    explanation: >-
      Defines the DI-S6 subtype and its strong association with hyperkinetic
      movement disorders relative to variants in other domains.
- name: DII-S6
  display_name: Domain II S6 (p.Ala702Thr hotspot)
  description: >-
    Missense variants clustering in the domain II S6 segment, most commonly the
    recurrent p.Ala702Thr variant. The majority of affected individuals in this
    domain present with the full clinical spectrum of CACNA1E-related DEE, and
    variants from this domain provided the functional gain-of-function data.
  genes:
  - preferred_term: CACNA1E
    term:
      id: hgnc:1392
      label: CACNA1E
  evidence:
  - reference: PMID:31064215
    reference_title: "Calcium Channel Dysfunction in Epilepsy: Gain of CACNA1E."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the DII-S6 domain, 13 individuals carried missense variants, including 6
      with the p.Ala702Thr variant. The majority of these patients presented with
      all clinical features of the CACNA1E-associated DEE.
    explanation: >-
      Defines the DII-S6 subtype and its association with the full clinical
      spectrum of the disorder.
- name: DIII-S6
  display_name: Domain III S6 (milder phenotype)
  description: >-
    Missense variants in the domain III S6 segment are associated with a milder
    phenotype at the mild end of the spectrum; some affected individuals never
    developed seizures and could achieve single words and independent walking.
  genes:
  - preferred_term: CACNA1E
    term:
      id: hgnc:1392
      label: CACNA1E
  evidence:
  - reference: PMID:31064215
    reference_title: "Calcium Channel Dysfunction in Epilepsy: Gain of CACNA1E."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In contrast, patients with missense variants located in the DIII-S6
      presented with a milder phenotype, as 2 patients never developed seizures
      and one has been seizure-free for 5 years, spoke single words, and walked
      independently.
    explanation: >-
      Defines the DIII-S6 subtype as the milder end of the genotype-phenotype
      spectrum.

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We establish pathogenic variants in CACNA1E as a cause of DEEs and suggest
      facilitated R-type calcium currents as a disease mechanism for human epilepsy
      and developmental disorders.
    explanation: >-
      Attributes the epilepsy phenotype to facilitated R-type calcium currents,
      the mechanism driving hyperexcitability in this node.
  - reference: PMID:31064215
    reference_title: "Calcium Channel Dysfunction in Epilepsy: Gain of CACNA1E."

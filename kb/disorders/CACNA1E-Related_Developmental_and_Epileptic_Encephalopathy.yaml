genetic:
- name: CACNA1E
  gene_term:
    preferred_term: CACNA1E
    term:
      id: hgnc:1392
      label: CACNA1E
  association: Gain-of-Function Mutations
  presence: Positive
  variant_origin: DE_NOVO
  inheritance:
  - name: Autosomal Dominant (De Novo)
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
  notes: >-
    The disease-defining lesions are recurrent de novo gain-of-function missense
    variants (e.g., p.Gly352Arg in domain I S6 and p.Ala702Thr in domain II S6)
    clustering at the cytoplasmic ends of the S6 activation gate; variant_origin
    is set to DE_NOVO to reflect this dominant class. A distinct rare class of
    truncating variants is associated with a much milder phenotype and uncertain
    pathogenic role; notably these were not uniformly de novo germline events —
    one reported truncating case was somatic mosaic (present in 27% of cells) and
    another was inherited from an unaffected parent — so mosaic and inherited
    origins occur in the milder truncating subset.
  evidence:
  - reference: PMID:30343943
    reference_title: "De Novo Pathogenic Variants in CACNA1E Cause Developmental and Epileptic Encephalopathy with Contractures, Macrocephaly, and Dyskinesias."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most of the 14, partially recurring, variants cluster within the cytoplasmic
      ends of all four S6 segments, which form the presumed CaV2.3 channel
      activation gate.
    explanation: >-
      Identifies the recurrent S6-clustered missense variants as the molecular
      lesion, and their gain-of-function effect is shown functionally.
  - reference: PMID:31064215
    reference_title: "Calcium Channel Dysfunction in Epilepsy: Gain of CACNA1E."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      an additional 3 individuals with truncating CACNA1E variants were
      identified, including 1 somatic mosaic (27% of cells), 1 inherited from an
      unaffected parent, and 1 with unknown inheritance. All 3 individuals
      presented with a much milder phenotype
    explanation: >-
      Documents the rare truncating variant class, its milder phenotype, and its
      non-de novo origins (somatic mosaicism, parental inheritance), qualifying
      the variant-origin picture.

differential_diagnoses:
- name: STXBP1 Encephalopathy
  description: >-
    Another de novo dominant developmental and epileptic encephalopathy with
    early-onset refractory seizures and profound developmental impairment;
    distinguished by the causative gene (STXBP1 vs CACNA1E) and its
    synaptic-vesicle-release mechanism.
- name: Other Voltage-Gated Calcium Channel Epileptic Encephalopathies
  description: >-
    De novo gain-of-function variants in CACNA1D and CACNA1G, and the CACNA1A
    spectrum, cause overlapping calcium-channelopathy epileptic encephalopathies;
    gene-specific testing distinguishes them from CACNA1E-related DEE.

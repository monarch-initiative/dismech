discussions:
- discussion_id: gap_cacna1e_rtype_blocker_precision_therapy
  prompt: Can variant-specific Cav2.3 modulation improve seizures and developmental outcomes safely?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Increased R-Type Calcium Entry
  - pathophysiology#Facilitated Cav2.3 Activation
  rationale: Topiramate responses are heterogeneous and uncontrolled, with relapses and sedation; its multiple actions prevent attribution of benefit solely to Cav2.3 blockade. The CDKL5 study proposes inhibitor testing rather than demonstrating pharmacological rescue. Loss-of-function alleles in the broader spectrum further argue for functional assessment before assuming one therapeutic direction.

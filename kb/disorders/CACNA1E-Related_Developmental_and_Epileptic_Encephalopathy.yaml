    explanation: >-
      Attributes the epilepsy phenotype to facilitated R-type calcium currents,
      the mechanism driving hyperexcitability in this node.
  - reference: PMID:31064215
    reference_title: "Calcium Channel Dysfunction in Epilepsy: Gain of CACNA1E."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-

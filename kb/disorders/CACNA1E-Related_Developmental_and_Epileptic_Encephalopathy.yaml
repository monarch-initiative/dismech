name: CACNA1E-Related Developmental and Epileptic Encephalopathy
creation_date: "2026-07-25T00:00:00Z"
description: >-
  CACNA1E-related developmental and epileptic encephalopathy (DEE69) is a severe
  early-onset neurodevelopmental disorder caused by recurrent de novo variants in
  CACNA1E, the gene encoding the pore-forming alpha1 subunit of the voltage-gated
  Cav2.3 R-type calcium channel. Most pathogenic variants cluster at the
  cytoplasmic ends of the four S6 segments that form the channel activation gate
  and are gain-of-function, facilitating voltage-dependent activation and slowing
  inactivation so that neuronal calcium influx through Cav2.3 is increased. The
  resulting disturbance of neuronal excitability and neurotransmitter release
  produces refractory infantile-onset seizures with profound developmental
  impairment, and frequently hyperkinetic movement disorders, congenital
  contractures, macrocephaly, and severe hypotonia.
category: Mendelian
parents:
- Neurodevelopmental Disorder
- Epileptic Encephalopathy

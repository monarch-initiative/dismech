- name: Impaired Neurodevelopment
  description: >-
    Beyond seizures, sustained disruption of calcium-dependent neuronal signaling
    yields profound global developmental impairment (most patients are nonverbal
    and nonambulatory), often accompanied by a hyperkinetic movement disorder,
    congenital contractures, and macrocephaly, indicating a developmental
    encephalopathy independent of the epilepsy.

    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: 'Molecular genetic testing identified 14 missense variants in CACNA1E (GenBank: NM_000721.3) in 30 unrelated individuals (Table 1). For the 29/30 individuals for whom DNA samples were available for both parents, de novo status of the variants and parentage were confirmed.'
    explanation: Thirty missense-variant probands were reported, with de novo status confirmed in all 29 with both parental samples.
  - reference: PMID:30343943
    reference_title: "De Novo Pathogenic Variants in CACNA1E Cause Developmental and Epileptic Encephalopathy with Contractures, Macrocephaly, and Dyskinesias."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Prominent clustering of CACNA1E variants (11/14; 79%) was noted in the cytoplasmic parts of all four S6 segments (Figure 1), which are presumed to form a crucial part of the activation gate in voltage-activated cation channels.
    explanation: Eleven of fourteen distinct discovery variants clustered in cytoplasmic S6 segments.

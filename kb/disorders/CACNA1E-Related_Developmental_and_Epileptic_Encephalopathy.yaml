- name: tsA201 Leu228Pro Channels
  experimental_model_type: CELL_LINE
  organism:
    preferred_term: Homo sapiens
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_source: Recombinant human embryonic kidney-derived cells
  description: Whole-cell patch clamp of Leu228Pro versus wild type shows hyperpolarized activation and steady-state inactivation, with an expanded window current. Peak density, inactivation kinetics and recovery were unchanged. The published abstract supports these channel findings; neuronal or treatment rescue is not demonstrated.
  publication: PMID:42392563
  evidence:
  - reference: PMID:42392563
    reference_title: Gating effects of a Cav2.3 calcium channel variant linked to developmental and epileptic encephalopathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Compared to wild-type, the L228P mutant did not present altered peak current density, inactivation kinetics, or recovery from inactivation, but showed a significant shift towards hyperpolarized voltages in both voltage-dependent activation and steady-state inactivation. This resulted in a broader window current shifted towards more hyperpolarized potentials, which predicts increased channel availability and activity at subthreshold voltages relative to wild-type channels.
    explanation: Leu228Pro changes activation and steady-state inactivation and broadens the predicted window current without changing peak density or inactivation kinetics.
  modeled_mechanisms:
  - target: Expanded Cav2.3 Window Current
    relationship: PARTIALLY_RECAPITULATES

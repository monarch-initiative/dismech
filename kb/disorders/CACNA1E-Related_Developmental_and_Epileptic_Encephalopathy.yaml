    directness: INDIRECT
    snippet: 'We establish pathogenic variants in CACNA1E as a cause of DEEs and suggest facilitated R-type calcium currents as a disease mechanism for human epilepsy and developmental disorders.'
    explanation: Human seizures establish network dysfunction but do not directly measure an excitation-inhibition ratio or the intervening cellular mechanism.

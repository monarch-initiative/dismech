  downstream:
  - target: Altered Neuronal Excitability and Neurotransmitter Release
    causal_link_type: DIRECT
- name: Altered Neuronal Excitability and Neurotransmitter Release
  description: >-
    Cav2.3 R-type channels contribute to both presynaptic neurotransmitter release
    and postsynaptic somatodendritic integration and long-term potentiation.
    Pathologically increased calcium influx therefore perturbs
    depolarization-coupled transmitter release and dendritic excitability,
    deranging synaptic signaling across neuronal networks.
  role: intermediate
  biological_scale: CELLULAR

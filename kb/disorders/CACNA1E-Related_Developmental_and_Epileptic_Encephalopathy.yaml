- name: Cacna1e Knockout Mouse
  species: Mus musculus
  genotype: Constitutive or brain-specific Cacna1e knockout
  description: An inverse perturbation of the predominant DEE gain-of-function mechanism. PTZ seizure susceptibility was reduced while 4-AP sensitivity was unchanged. Kainate produced behavioral limbic seizure resistance and reduced excitotoxic injury, but hippocampal EEG seizure activity was unchanged at the tested suprathreshold dose. These results do not demonstrate neurodegeneration or drug efficacy in human DEE69.
  publication: PMID:16686648
  evidence:
  - reference: PMID:16686648
    reference_title: Altered seizure susceptibility in mice lacking the Ca(v)2.3 E-type Ca2+ channel.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Surprisingly, PTZ-induced seizure susceptibility was dramatically reduced in Ca(v)2.3-deficient mice, whereas 4-AP sensitivity remained unchanged.
    explanation: Knockout reduces PTZ susceptibility without a corresponding 4-AP effect.
  - reference: PMID:17376845
    reference_title: Hippocampal seizure resistance and reduced neuronal excitotoxicity in mice lacking the Cav2.3 E/R-type voltage-gated calcium channel.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Administration of kainic acid (30 mg/kg ip) revealed clear alteration in behavioral seizure architecture and dramatic resistance to limbic seizures in Ca(v)2.3(-/-) mice compared with controls, whereas no difference in hippocampal EEG seizure activity between both genotypes could be detected at this suprathreshold dosage.
    explanation: Behavioral limbic seizure resistance did not translate into reduced hippocampal EEG seizure activity at the tested high dose.
  modeled_mechanisms:
  - target: Epileptogenic Network Dysfunction
    relationship: PERTURBS
    fidelity: LOW
    description: Loss of the channel tests its contribution to provoked seizures in the opposite direction from most characterized DEE variants.

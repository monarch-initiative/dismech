- name: Altered Synaptic Transmission
  description: Cav2.3 participates in presynaptic neurotransmitter release and postsynaptic integration/plasticity. Variant-dependent disruption of these functions is a plausible contributor to DEE. The direction and magnitude of release changes, and their balance in excitatory versus inhibitory neurons, remain unresolved.
  biological_scale: CELLULAR
  role: central_effector
  evidence:

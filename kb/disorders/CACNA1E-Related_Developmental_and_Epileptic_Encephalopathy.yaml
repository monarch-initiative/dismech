treatments:
- name: Topiramate
  description: >-
    Among 18 treated discovery-cohort participants, five were described as having substantial improvement:
    two remained seizure-free for two and five years, two relapsed after four years and 18 months, and one
    had a marked reduction but stopped because of sedation. Ten had no effect and three had reductions without
    seizure freedom. These uncontrolled observations support possible benefit for some patients, not a predictable
    response or demonstrated developmental rescue. The detailed results are more qualified than the abstract's
    statement that five achieved seizure freedom.

    reference_title: "Calcium Channel Dysfunction in Epilepsy: Gain of CACNA1E."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
    snippet: CACNA1E encodes Cav2.3, an R-type VGCC implicated in both presynaptic neurotransmitter release and postsynaptic somatodendritic integration and long-term potentiation.
    explanation: Normal Cav2.3 physiology motivates a synaptic mechanism, but altered transmitter release or plasticity has not been directly measured for the human variants in these studies.

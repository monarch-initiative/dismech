- name: Increased R-Type Calcium Entry
  description: Facilitated activation, prolonged opening or altered window current can increase depolarization-dependent Cav2.3-mediated calcium entry. These routes depend on the variant, voltage and accessory-subunit context. Recombinant channel measurements support the conductance effect; chronic calcium overload in patient neurons has not been demonstrated.
  biological_scale: CELLULAR
  role: central_effector
  evidence:
  - reference: PMID:30343943
    reference_title: "De Novo Pathogenic Variants in CACNA1E Cause Developmental and Epileptic Encephalopathy with Contractures, Macrocephaly, and Dyskinesias."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: INDIRECT
    snippet: Functional analysis revealed dramatic gain-of-function effects, indicating increased calcium inward currents that may affect neuronal excitability and synaptic transmission.
    explanation: Recombinant-channel results motivate increased calcium entry in neurons; sustained intracellular calcium overload was not measured in patients.

- name: Facilitated Cav2.3 Activation
  description: Several DEE-associated variants activate at more negative membrane potentials. The three 2018 DII-S6 variants shifted activation by approximately -10 mV; Ile603Leu and Leu228Pro also facilitate activation under their respective assay conditions. This is a voltage-dependence change, not necessarily faster activation kinetics.
  biological_scale: MOLECULAR
  role: central_effector
  evidence:
  - reference: PMID:30343943
    reference_title: "De Novo Pathogenic Variants in CACNA1E Cause Developmental and Epileptic Encephalopathy with Contractures, Macrocephaly, and Dyskinesias."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: The activation curve was shifted by approximately −10 mV for all three variants (Figure 2), while the time course of activation was not altered.
    explanation: The three DII-S6 variants shifted activation about -10 mV in tsA201 cells.
  - reference: PMID:30343943
    reference_title: "De Novo Pathogenic Variants in CACNA1E Cause Developmental and Epileptic Encephalopathy with Contractures, Macrocephaly, and Dyskinesias."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: This variant resulted in a massive increase in whole-cell current density (Figures 3 and S2) to a level that in many cases precluded functional biophysical characterization. In a subset of cells where the current could be properly clamped, our analysis revealed a >10 mV hyperpolarizing shift in half activation voltage (Figures 3 and S2; Table 2). There was no significant effect on channel inactivation.
    explanation: Ile603Leu increased whole-cell current density and facilitated activation without significantly changing inactivation.
  - reference: PMID:42392563
    reference_title: Gating effects of a Cav2.3 calcium channel variant linked to developmental and epileptic encephalopathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Compared to wild-type, the L228P mutant did not present altered peak current density, inactivation kinetics, or recovery from inactivation, but showed a significant shift towards hyperpolarized voltages in both voltage-dependent activation and steady-state inactivation. This resulted in a broader window current shifted towards more hyperpolarized potentials, which predicts increased channel availability and activity at subthreshold voltages relative to wild-type channels.
    explanation: Leu228Pro changes activation and steady-state inactivation and broadens the predicted window current without changing peak density or inactivation kinetics.
  downstream:

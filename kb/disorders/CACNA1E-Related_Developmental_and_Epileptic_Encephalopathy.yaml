    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      which conducts high voltage-activated R-type calcium currents that initiate
      synaptic transmission.
    explanation: >-
      Background channel physiology establishing the identity of the R-type
      calcium conductance carried by Cav2.3; it supports which current is
      amplified, not the magnitude of the increase (documented by the increased
      current density evidence below).
  - reference: PMID:31064215
    reference_title: "Calcium Channel Dysfunction in Epilepsy: Gain of CACNA1E."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Electrophysiological recordings showed a hyperpolarizing shift in
      voltage-dependent activation, slowed kinetics of inactivation, and increased
      current density.
    explanation: >-
      Documents the increased calcium current (increased current density) produced

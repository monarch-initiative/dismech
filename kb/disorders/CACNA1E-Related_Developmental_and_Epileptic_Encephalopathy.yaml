discussions:
- discussion_id: gap_cacna1e_rtype_blocker_precision_therapy
  prompt: >-
    Given that CACNA1E-related DEE is predominantly a gain-of-function Cav2.3
    channelopathy, are R-type calcium channel blockers a rational precision
    therapy, and can the partial success of topiramate be extended to selective
    Cav2.3 antagonists with acceptable CNS safety?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#CACNA1E Variant and Gain-of-Function Cav2.3 Channel
  - pathophysiology#Increased Neuronal Calcium Influx
  rationale: >-
    The disorder-defining study shows that most pathogenic variants are
    gain-of-function and that topiramate, which blocks R-type calcium channels,
    produced seizure freedom in five patients. This implies that reducing Cav2.3
    current is mechanistically on-target, but topiramate is a broad-spectrum drug
    and no selective Cav2.3 antagonist is clinically available; whether a
    channel-selective blocker would be more effective or tolerable, and whether
    benefit generalizes beyond seizures to the developmental and movement
    phenotypes, is unresolved. The rare truncating (possible loss-of-function)
    variants further complicate a one-directional therapeutic model. More recent
    CDKL5-deficiency work reframes this question at the module level: it shows the
    Cav2.3 gain-of-function state is shared between CACNA1E DEE69 and CDKL5
    deficiency and explicitly proposes Cav2.3 inhibitors as a rational,
    cross-disease precision therapy, strengthening the case for developing a
    selective Cav2.3 antagonist.
  evidence:
  - reference: PMID:30343943
    reference_title: "De Novo Pathogenic Variants in CACNA1E Cause Developmental and Epileptic Encephalopathy with Contractures, Macrocephaly, and Dyskinesias."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Five participants achieved seizure freedom on the anti-epileptic drug
      topiramate, which blocks R-type calcium channels.
    explanation: >-
      Provides the proof-of-concept that lowering R-type calcium current is
      therapeutically beneficial, motivating selective Cav2.3 blockade.
  - reference: PMID:31064215
    reference_title: "Calcium Channel Dysfunction in Epilepsy: Gain of CACNA1E."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Cav2.3 is also known to play a role in epileptogenesis in rodents, and its
      deletion reduces susceptibility to chemically induced seizures.
    explanation: >-
      Supports the rationale that reducing Cav2.3 function is anticonvulsant, the
      basis for a precision R-type-blocker strategy.
  - reference: PMID:38081835
    reference_title: "Epilepsy-linked kinase CDKL5 phosphorylates voltage-gated calcium channel Cav2.3, altering inactivation kinetics and neuronal excitability."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We show that these two single-gene diseases are mechanistically related and
      could be ameliorated with Cav2.3 inhibitors.
    explanation: >-
      Updates this gap beyond the 2018 topiramate result: recent CDKL5 work finds
      CACNA1E DEE69 and CDKL5 deficiency converge on a Cav2.3 gain-of-function
      state and explicitly proposes Cav2.3 inhibitors as a shared,
      mechanism-directed precision therapy.

    directness: DIRECT
    snippet: M163T and R1182C exhibit depolarizing shifts in the voltage-dependence of activation, whereas R1182C also shows a reduced peak current density. H151L selectively slows recovery from inactivation.
    explanation: Three experimentally characterized variants show distinct loss-of-function effects in recombinant channels; their clinical presentations span a broader spectrum than DEE69.

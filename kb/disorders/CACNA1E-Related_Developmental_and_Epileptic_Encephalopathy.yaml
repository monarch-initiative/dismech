- discussion_id: cacna1e_developmental_mechanism_gap
  prompt: Which cell types and developmental processes connect variant-specific channel effects to developmental disability?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired Neurodevelopment
  - pathophysiology#Altered Synaptic Transmission
  rationale: Seizure-independent regression and early motor manifestations indicate that epileptic activity alone does not explain all disability. Recombinant cells establish channel effects, while the CDKL5-linked phosphomutant is an indirect animal model. Patient-variant effects on native excitatory and inhibitory circuits, neurotransmitter release and development remain insufficiently characterized.

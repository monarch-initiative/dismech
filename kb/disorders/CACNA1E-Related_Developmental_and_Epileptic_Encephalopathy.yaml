      deletion reduces susceptibility to chemically induced seizures.
    explanation: >-
      Provides model-organism support that Cav2.3 activity is pro-epileptogenic,
      consistent with gain-of-function causing hyperexcitability.
- name: Impaired Neurodevelopment
  description: >-
    Beyond seizures, sustained disruption of calcium-dependent neuronal signaling
    yields profound global developmental impairment (most patients are nonverbal
    and nonambulatory), often accompanied by a hyperkinetic movement disorder,
    congenital contractures, and macrocephaly, indicating a developmental
    encephalopathy independent of the epilepsy.
  role: outcome
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:31064215
    reference_title: "Calcium Channel Dysfunction in Epilepsy: Gain of CACNA1E."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The 30 patients with pathogenic CACNA1E variants presented with a variable
      DEE characterized by refractory epilepsy (87% of patients) with median
      seizure onset at 4.5 months, movement disorders (60%), spastic quadriplegia
      (53%), congenital joint contractures (43%), macrocephaly (43%), and profound
      developmental impairments (ie, nonverbal and nonambulatory) (88%).
    explanation: >-
      Quantifies the profound developmental impairment and associated
      movement/contracture/macrocephaly features of the disorder.

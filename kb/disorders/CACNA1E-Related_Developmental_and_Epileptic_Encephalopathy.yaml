pathophysiology:
- name: CACNA1E Variant and Gain-of-Function Cav2.3 Channel
  description: >-
    CACNA1E encodes the pore-forming alpha1 subunit of the high-voltage-activated
    Cav2.3 R-type calcium channel. Recurrent de novo missense variants cluster at
    the cytoplasmic ends of the four S6 segments that form the presumed channel
    activation gate. Functional analysis of these variants in heterologous
    expression systems shows consistent gain-of-function effects: facilitated
    (hyperpolarized) voltage-dependent activation and slowed inactivation, with a
    domain II S4-S5 linker variant additionally increasing current density.

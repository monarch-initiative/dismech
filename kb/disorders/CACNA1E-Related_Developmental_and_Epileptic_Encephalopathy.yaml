has_subtypes:
- name: DI-S6
  display_name: Domain I S6 (p.Gly352Arg hotspot)
  description: >-
    Cohort-derived domain I S6 group, particularly Gly352Arg and Gly348Arg. All ten such cases in the original
    series had prominent dystonia, compared with 2/19 other probands. This association is useful for recognition
    but is not a validated deterministic prognostic classification.
  genes:
  - preferred_term: CACNA1E
    term:
      id: hgnc:1392
      label: CACNA1E
  evidence:
  - reference: PMID:30343943
    reference_title: "De Novo Pathogenic Variants in CACNA1E Cause Developmental and Epileptic Encephalopathy with Contractures, Macrocephaly, and Dyskinesias."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Dystonia was a prominent feature in all nine individuals with the recurrent c.1054G>A (p.Gly352Arg) variant. This variant is in close proximity to the c.1042G>C (p.Gly348Arg) variant in individual 2 who also demonstrated profound dystonia. Dystonia was less common in individuals with other variants, only observed in 2/19 (11%) remaining probands, suggesting that variants in the domain I GX3G motif may predispose to prominent hyperkinetic movement disorders.
    explanation: The original cohort associated Gly352Arg/Gly348Arg with dystonia, without establishing a deterministic domain-wide prognosis.
- name: DII-S6
  display_name: Domain II S6 (p.Ala702Thr hotspot)
  description: >-
    Cohort-derived domain II S6 group. Six Ala702Thr cases in the original series had profound impairment and
    refractory epilepsy. Other substitutions, including Ala702Ser and Ala702Val, occur in the broader, milder
    CACNA1E spectrum, so domain or residue alone cannot predict severity.
  genes:
  - preferred_term: CACNA1E
    term:
      id: hgnc:1392
      label: CACNA1E
  evidence:
  - reference: PMID:30343943
    reference_title: "De Novo Pathogenic Variants in CACNA1E Cause Developmental and Epileptic Encephalopathy with Contractures, Macrocephaly, and Dyskinesias."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: The six individuals harboring the recurrent c.2104G>A (p.Ala702Thr) variant had a relatively homogeneous phenotype that was representative of the overall CACNA1E-encephalopathy phenotype. All individuals had refractory infantile-onset epilepsy, epileptic spasms, severe hypotonia, and profound developmental impairment. Five out of six individuals (83%) harboring the c.2104G>A (p.Ala702Thr) variant had congenital joint contractures and macrocephaly; hypsarrhythmia on EEG consistent with a diagnosis of West syndrome was observed in four of these individuals (67%). Two of these six individuals died in early childhood at ages 1 and 3 years.
    explanation: The six Ala702Thr cases shared a severe course; this does not establish the prognosis of other substitutions at residue 702.
  - reference: PMID:34702355
    reference_title: "De novo variants in CACNA1E found in patients with intellectual disability, developmental regression and social cognition deficit but no seizures."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Age of onset of clinical manifestation, presence or absence of regression and degree of severity were variable, and no clear-cut genotype-phenotype association could be recognized.
    explanation: The broader cohort cautions against treating the original domain groups as a universal prognostic taxonomy.
- name: DIII-S6
  display_name: Domain III S6 (milder phenotype)
  description: >-
    Comparatively mild domain III S6 cases in the original series carried Thr1425Asn or Gly1430Arg. Two had
    no seizures by age four; one was seizure-free for five years and off medication at age six. Single words
    and independent or assisted walking were achieved. These observations describe a spectrum boundary and
    do not imply lifetime seizure absence for all DIII-S6 variants.
  genes:
  - preferred_term: CACNA1E
    term:
      id: hgnc:1392
      label: CACNA1E
  evidence:
  - reference: PMID:30343943
    reference_title: "De Novo Pathogenic Variants in CACNA1E Cause Developmental and Epileptic Encephalopathy with Contractures, Macrocephaly, and Dyskinesias."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Two individuals harboring the c.4274C>A (p.Thr1425Asn) variant and one individual with the c.4288G>A (p.Gly1430Arg) variant presented with a comparatively milder clinical picture. All three probands were the only individuals in the cohort to speak single words and walk independently or with assistance, in contrast to the profound impairment in the remainder of the cohort. Two of these probands had not developed seizures by age 4 years, and the other had been seizure free for 5 years and off AEDs at age 6 years.
    explanation: Three DIII-S6 cases were comparatively milder; two had not seized by age four and one had sustained remission. Walking could be assisted.

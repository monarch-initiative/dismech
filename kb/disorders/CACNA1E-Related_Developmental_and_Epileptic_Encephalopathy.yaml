- name: Altered Neuronal Excitability
  description: Cav2.3 gain of function is proposed to alter neuronal excitability. In the engineered S15A phosphomutant mouse, baseline CA1 firing was unchanged, whereas carbachol enhanced depolarizing plateaus and afterdepolarizations; strong stimulation could induce depolarization block. Translation to individual human DEE variants remains provisional.
  biological_scale: CELLULAR
  role: central_effector

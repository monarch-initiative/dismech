- discussion_id: cacna1e_dee_scope_and_allele_specificity
  prompt: How should DEE69 be distinguished from broader CACNA1E neurological presentations?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - genetic#CACNA1E
  rationale: The 2021 seven-person cohort had no ongoing epilepsy, but one adult had successfully treated infantile spasms. Six had no seizure history. Its putative splice effect was not RNA-validated, and variant-specific functional evidence has since emerged for M163T. The 2026 loss-of-function study spans ataxia without epilepsy, neurodevelopmental disorder without epilepsy, and a seizure-associated ClinVar case with limited clinical characterization. These observations expand the gene spectrum without proving that every variant causes DEE69 or that domain location reliably predicts course.
  evidence:
  - reference: PMID:34702355
    reference_title: "De novo variants in CACNA1E found in patients with intellectual disability, developmental regression and social cognition deficit but no seizures."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: One adult patient (Patient 4) had a history of epileptic spasms, successfully treated with adrenocorticotropic hormone, without subsequent seizures in childhood or adulthood.
    explanation: The 2021 cohort lacked ongoing epilepsy, but one adult had successfully treated infantile spasms; it was not uniformly lifetime seizure-free.
  - reference: PMID:34702355
    reference_title: "De novo variants in CACNA1E found in patients with intellectual disability, developmental regression and social cognition deficit but no seizures."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Four patients (4/7, 57%) also presented with developmental regression, unrelated to any seizures or specific electro-encephalographic (EEG) epileptic activity.
    explanation: Regression without concurrent seizures supports a developmental component in the wider CACNA1E spectrum, not a shared proven cellular mechanism for every allele.
  - reference: PMID:42123681

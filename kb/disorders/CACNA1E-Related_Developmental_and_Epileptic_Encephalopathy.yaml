    directness: DIRECT
    snippet: Although seizures were resistant to multiple anti-epileptic drugs (AEDs) in most individuals for whom data were available (20/25; 80%), five individuals (1, 15, 16, 21, 27) reported significant improvement in seizure control with topiramate, the only AED noted to have a substantial effect on seizure control in any participants (Table S1).

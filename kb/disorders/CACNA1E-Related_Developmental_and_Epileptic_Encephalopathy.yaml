      label: neuron
  evidence:
  - reference: PMID:31064215
    reference_title: "Calcium Channel Dysfunction in Epilepsy: Gain of CACNA1E."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The 30 patients with pathogenic CACNA1E variants presented with a variable
      DEE characterized by refractory epilepsy (87% of patients) with median
      seizure onset at 4.5 months, movement disorders (60%), spastic quadriplegia
      (53%), congenital joint contractures (43%), macrocephaly (43%), and profound
      developmental impairments (ie, nonverbal and nonambulatory) (88%).
    explanation: >-
      Quantifies the profound developmental impairment and associated
      movement/contracture/macrocephaly features of the disorder.
  - reference: PMID:34702355
    reference_title: "De novo variants in CACNA1E found in patients with intellectual disability, developmental regression and social cognition deficit but no seizures."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified seven unrelated individuals with intellectual disability,
      developmental regression and ASD-like behavioral profile, and notably
      without epilepsy, who had de novo heterozygous putatively pathogenic
      variants in CACNA1E.
    explanation: >-
      A seizure-free CACNA1E cohort (de novo variants causing intellectual
      disability, developmental regression, and an ASD-like profile without
      epilepsy) shows the developmental arm of CACNA1E disease can occur
      independently of the epilepsy, directly supporting this node's claim of a
      developmental encephalopathy independent of seizures.

  description: >-
    Heterozygous missense variants typically arise de novo. The discovery series confirmed de novo status in
    29/30 probands; both parental samples were unavailable for the remaining proband. Variant interpretation
    and parental testing are required rather than assuming every rare CACNA1E variant is causal.
  evidence:
  - reference: PMID:30343943
    reference_title: "De Novo Pathogenic Variants in CACNA1E Cause Developmental and Epileptic Encephalopathy with Contractures, Macrocephaly, and Dyskinesias."
    supports: SUPPORT

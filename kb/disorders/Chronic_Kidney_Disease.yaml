discussions:
- discussion_id: ckd_pgsxc_reverse_causation
  prompt: >-
    Are the CKD PGS×context interactions driven by adverse exposures causally
    amplifying genetic risk, or are some "contexts" and the eGFR outcome itself
    partly downstream readouts of kidney injury (reverse causation)?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Glomerulosclerosis
  - biochemical#Creatinine
  - environmental#Diabetes
  - environmental#Hypertension
  rationale: >-
    Population PGS×context analyses (Nagpal & Gibson 2026,
    PMID:42443528) are largely unable to establish the causality
    of specific contexts. For CKD the concern is sharpened because the outcome is
    modelled against the PGS for eGFR, and serum creatinine — from which eGFR is
    derived — is already modelled in this entry as a READOUT_OF Nephron Loss,
    i.e. a consequence of injury rather than a driver. Comorbid exposures such as
    diabetes and hypertension are themselves partly on the causal path to CKD and
    partly co-declining with renal function. Distinguishing genuine amplification
    of genetic effects from reverse causation determines whether the modelled
    interventions (reducing glucose, smoking cessation) would actually slow
    progression.
  proposed_experiments:
  - experiment_id: ckd_pgsxc_mr_direction
    name: Mendelian randomization of exposure-to-CKD direction across PGS strata
    description: >-
      Use bidirectional / multivariable Mendelian randomization to test whether
      each candidate context (glucose, smoking, blood pressure) causally affects
      kidney function versus being a consequence of declining eGFR, and whether
      the causal effect estimate scales with polygenic liability as the
      amplification model predicts.
    decision_criterion: >-
      A context is retained as a causal amplifier if MR supports
      exposure-to-disease directionality and the exposure-attributable risk
      difference increases across increasing PGS strata; it is flagged as a
      reverse-causation suspect otherwise.
  - experiment_id: ckd_pgsxc_prospective_temporal
    name: Prospective incident-CKD analysis restricted to pre-diagnosis exposure
      windows
    description: >-
      Restrict exposures to measurements taken well before the first evidence of
      reduced eGFR and repeat the PGS×context liability-threshold modelling on
      incident cases only, to reduce contamination by exposures that co-decline
      with renal function.
    decision_criterion: >-
      Amplification is supported if the PGS×context deviation from additivity
      persists when only pre-diagnosis exposure windows and incident cases are
      used.
datasets:
- accession: geo:GSE272125
  title: Transfer RNAs, not microRNAs, are linked to ischemic stroke and major bleeding in patients with end-stage kidney disease
  description: 'Background: Patients with end-stage kidney disease (ESKD) are at very high risk for thromboembolism and bleeding. This study aimed to identify small non-coding RNAs (sncRNAs), specifically microRNAs and transfer-RNA (tRNA)-derived fragments (tRFs), as potential novel biomarkers for predicting thromboembolism and bleeding in this high-risk population. Methods: In this sncRNA discovery research, we leveraged the VIVALDI cohort, consisting of 625 ESKD patients on hemodialysis, to conduct two nested case-control studies, each comprising 18 participants. The primary outcomes were ischemic stroke in the first study and major bleeding in the second.'
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  data_type: BULK_RNA_SEQ
  sample_count: 34
  publication: PMID:39260398
  notes: Identified by GEO DataSets index search for Chronic Kidney Disease (scripts/discover_datasets.py); accession and metadata verified against NCBI E-utilities on 2026-07-31. Title, sample count, and organism are GEO's own values.
- accession: geo:GSE316126
  title: Distinct immunometabolic signatures in peripheral blood mononuclear cells are linked to systemic inflammation in type 2 diabetes and diabetic kidney disease
  description: Diabetic kidney disease (DKD) is a frequent complication of type 2 diabetes and is closely linked to systemic inflammation. Peripheral blood mononuclear cells (PBMCs) are markers of systemic inflammatory and metabolic stress. It is unknown if metabolism-related transcriptomic alterations in these cells is associated with DKD. Using the nCounter® Human Metabolic Pathways Panel we profiled PBMC metabolic transcripts in individuals with type 2 diabetes or DKD and in controls (n = 12/group), and integrated transcriptomic data with clinical, inflammatory, and mitochondrial parameters.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  data_type: MICROARRAY
  sample_count: 36
  notes: Identified by GEO DataSets index search for Chronic Kidney Disease (scripts/discover_datasets.py); accession and metadata verified against NCBI E-utilities on 2026-07-31. Title, sample count, and organism are GEO's own values.
- accession: ega:EGAS00001007904
  title: Tubulointerstitial fibrosis is the histological hallmark of chronic kidney disease (CKD). Hypoxia and inflammation (i.e., interleukin (IL)-1β signalling) are independent mediators of tubulointerstitial fibrosis. However, the physiological response of human kidney tubular cells to IL-1β/IL-1RI signalling under the hypoxic conditions of CKD is poorly understood and remains a clinical imperative for therapeutic targeting. This study reports that hypoxia and IL-1β act in synergy to trigger cell cycle arrest/cellular senescence of ex vivo patient-derived primary proximal tubular epithelial cells (PTECs).
  description: Hypoxia and interleukin (IL)-1β are independent mediators of tubulointerstitial fibrosis, the histological hallmark of chronic kidney disease (CKD). Here, we examine how hypoxia and IL-1β act in synergy to augment maladaptive proximal tubular epithelial cell (PTEC) repair in human CKD. Ex vivo patient-derived PTECs were cultured under normoxic (21% O2) or hypoxic (1% O2) conditions in the absence or presence of IL-1β and examined for maladaptive repair signatures. Hypoxic PTECs incubated with IL-1β displayed a discrete transcriptomic profile distinct from PTECs cultured under hypoxia alone, IL-1β alone or under normoxia.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  notes: 'European Genome-phenome Archive study, matched because the disease is named in the study''s own title ("Chronic Kidney Disease"); description-level mentions were not accepted. EGA study_type: Other. Controlled access -- data require a Data Access Agreement. EGA metadata retrieved 2026-08-01.'
- accession: ega:EGAS50000000101
  title: WNT-dependent interaction between inflammatory fibroblasts and FOLR2+ macrophages promotes fibrosis in chronic kidney disease
  description: Chronic kidney disease (CKD) is a public health problem driven by myofibroblast accumulation, leading to interstitial fibrosis. Heterogeneity is a recently recognised characteristics in kidney fibroblasts in CKD, but the role of different populations is still unclear. Here, we characterize a proinflammatory fibroblast population (named CXCL-iFibro), which corresponds to an early state of myofibroblast differentiation in CKD.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606

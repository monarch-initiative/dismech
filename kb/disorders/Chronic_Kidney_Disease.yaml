name: Chronic Kidney Disease
creation_date: '2025-12-18T17:01:35Z'
category: Complex
parents:
- Renal Disease
disease_term:
  preferred_term: chronic kidney disease
  term:
    id: MONDO:0005300
    label: chronic kidney disease
description: >-
  Chronic kidney disease (CKD) is the progressive, generally irreversible loss of kidney
  function persisting for at least three months, defined by a reduced glomerular filtration
  rate (GFR < 60 mL/min/1.73 m2) and/or markers of kidney damage such as albuminuria. It
  arises from diverse etiologies, most commonly diabetic nephropathy, hypertensive
  nephrosclerosis, glomerulonephritis, and polycystic kidney disease, that converge on a final
  common pathway of progressive nephron loss, compensatory hyperfiltration,
  glomerulosclerosis, and tubulointerstitial fibrosis. As functional renal mass declines,
  patients develop complications including decreased GFR, metabolic acidosis, mineral and bone
  disorder, anemia, and accelerated cardiovascular disease, with end-stage kidney disease
  ultimately requiring dialysis or transplantation.
has_subtypes:
- name: Diabetic Nephropathy
  description: CKD caused by long-standing diabetes mellitus.
- name: Hypertensive Nephrosclerosis
  description: CKD caused by chronic hypertension.
- name: Glomerulonephritis
  description: CKD from primary or secondary glomerular diseases.
- name: Polycystic Kidney Disease
  description: Inherited form of CKD with multiple kidney cysts.
pathophysiology:
- name: Nephron Loss
  description: >
    Progressive loss of functional nephrons from any cause leads to compensatory
    hyperfiltration in remaining nephrons, which paradoxically accelerates
    further damage and fibrosis.
  locations:
  - preferred_term: Nephron
    term:
      id: UBERON:0001285
      label: nephron
  cell_types:
  - preferred_term: Podocyte
    term:
      id: CL:0000653
      label: podocyte
  - preferred_term: Tubular Epithelial Cell
    term:
      id: CL:0002306
      label: epithelial cell of proximal tubule
  downstream:
  - target: Decreased GFR
    description: Cumulative loss of functional nephrons directly reduces the
      whole-kidney glomerular filtration rate.
  - target: Metabolic Acidosis
    description: Reduced functional renal mass impairs ammoniagenesis and net
      acid excretion, producing metabolic acidosis.
    evidence:
    - reference: PMID:38279993
      reference_title: "Metabolic acidosis in chronic kidney disease: mere consequence or also culprit?"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        nephron loss with reduced ammoniagenesis is the main cause of acid
        retention in non-transplant CKD patients
      explanation: >-
        Nephron loss reduces ammoniagenesis and net acid excretion, the
        mechanism of the downstream metabolic-acidosis edge.
  - target: Glomerulosclerosis
    description: Compensatory hyperfiltration in surviving nephrons imposes
      hemodynamic stress that accelerates glomerular scarring (vicious cycle).
    evidence:
    - reference: PMID:35203616
      reference_title: "Glomerular Biomechanical Stress and Lipid Mediators during Cellular Changes."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Hyperfiltration is an important underlying cause of glomerular
        dysfunction associated with several systemic and intrinsic glomerular
        conditions leading to chronic kidney disease (CKD). These include
        obesity, diabetes, hypertension, focal segmental glomerulosclerosis
        (FSGS), congenital abnormalities and reduced renal mass (low nephron
        number).
      explanation: >-
        Reduced renal mass (low nephron number) drives hyperfiltration that
        underlies glomerulosclerosis, the downstream glomerulosclerosis edge of
        nephron loss.
  evidence:
  - reference: PMID:38653563
    reference_title: "Recent Update on Acute Kidney Injury-to-Chronic Kidney Disease Transition."
    supports: PARTIAL
    snippet: "Patients diagnosed with AKI often undergo diverse clinical trajectories,
      such as early or late recovery, relapses, and even a potential transition from
      AKI to chronic kidney disease (CKD)."
    explanation: This describes how acute injury leads to progressive nephron
      loss and CKD transition, supporting the concept that initial damage
      triggers compensatory mechanisms that accelerate further injury.
  - reference: PMID:38339031
    reference_title: "From Acute to Chronic: Unraveling the Pathophysiological Mechanisms of the Progression from Acute Kidney Injury to Acute Kidney Disease to Chronic Kidney Disease."
    supports: PARTIAL
    snippet: "This article provides a thorough overview of the biomarkers, pathophysiology,
      and molecular pathways involved in the transition from acute kidney injury (AKI)
      and acute kidney disease (AKD) to chronic kidney disease (CKD)."
    explanation: The transition from AKI to CKD involves progressive nephron
      loss with maladaptive repair mechanisms that drive ongoing damage and
      fibrosis.
- name: Glomerulosclerosis
  description: >
    Scarring and hardening of glomeruli impairs filtration function.
    Driven by hemodynamic stress, inflammation, and metabolic factors.
  locations:
  - preferred_term: Renal Glomerulus
    term:
      id: UBERON:0000074
      label: renal glomerulus
  biological_processes:
  - preferred_term: Glomerular Fibrosis
    term:
      id: GO:0030198
      label: extracellular matrix organization
    modifier: INCREASED
  downstream:
  - target: Proteinuria
    description: Scarring and disruption of the glomerular filtration barrier
      permits protein leakage into the urine.
  - target: Nephron Loss
    description: Progressive glomerular scarring renders affected nephrons
      nonfunctional, contributing to nephron loss.
  evidence:
  - reference: PMID:38610646
    reference_title: "Fibrosis in Chronic Kidney Disease: Pathophysiology and Therapeutic Targets."
    supports: PARTIAL
    snippet: "Chronic kidney disease (CKD) is a slowly progressive condition characterized
      by decreased kidney function, tubular injury, oxidative stress, and inflammation."
    explanation: This describes the inflammatory and oxidative stress components
      that drive glomerulosclerosis alongside hemodynamic factors.
  - reference: PMID:37857763
    reference_title: "Oxidative stress and the role of redox signalling in chronic kidney disease."
    supports: PARTIAL
    snippet: "Reactive oxygen species (ROS) are derivatives of oxygen molecules that
      are generated during aerobic metabolism and are involved in a variety of cellular
      functions that are governed by redox conditions."
    explanation: ROS generation contributes to oxidative stress and metabolic
      factors that drive glomerular scarring and impaired filtration.
- name: Klotho Deficiency
  description: >
    Progressive decline in renal Klotho expression with CKD severity. Klotho is a
    renal-protective factor that suppresses TGF-β/Smad3 signaling and maintains
    phosphate homeostasis. Klotho deficiency amplifies tubulointerstitial fibrosis
    and accelerates CKD progression.
  locations:
  - preferred_term: Kidney
    term:
      id: UBERON:0002113
      label: kidney
  biological_processes:
  - preferred_term: TGF-beta Receptor Signaling
    term:
      id: GO:0007179
      label: transforming growth factor beta receptor signaling pathway
    modifier: INCREASED
  downstream:
  - target: Tubulointerstitial Fibrosis
    description: Klotho deficiency permits unchecked TGF-β/Smad3 signaling and
      myofibroblast differentiation, driving tubulointerstitial fibrosis.
    evidence:
    - reference: DOI:10.21203/rs.3.rs-9670512/v1
      reference_title: "AAV-mediated Klotho gene delivery attenuates renal fibrosis in chronic kidney disease by suppressing the TGF-β/Smad3 signaling pathway"
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "High-dose AAV-KL restored Klotho to approximately 78% of sham"
      explanation: Restoration of Klotho by gene therapy reverses CKD fibrosis, demonstrating that Klotho deficiency drives fibrotic progression.
    - reference: DOI:10.21203/rs.3.rs-9670512/v1
      reference_title: "AAV-mediated Klotho gene delivery attenuates renal fibrosis in chronic kidney disease by suppressing the TGF-β/Smad3 signaling pathway"
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The phospho-Smad3/Smad3 ratio declined markedly without change in transforming growth factor-beta 1 ligand, while Smad7 rose approximately 1.9-fold."
      explanation: Klotho restoration suppresses phospho-Smad3 and elevates Smad7, showing that Klotho deficiency drives fibrosis via unchecked TGF-β/Smad3 signaling.
  - target: IL-11 Signalling in Renal Fibroblasts
    description: >-
      Klotho deficiency de-represses TGF-β/Smad3 signalling, which induces
      autocrine IL-11 in renal fibroblasts, placing IL-11 receptor signalling
      downstream of the Klotho-TGF-β axis.
  evidence:
  - reference: DOI:10.21203/rs.3.rs-9670512/v1
    reference_title: "AAV-mediated Klotho gene delivery attenuates renal fibrosis in chronic kidney disease by suppressing the TGF-β/Smad3 signaling pathway"
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Chronic kidney disease (CKD) is characterised by progressive renal fibrosis, Klotho deficiency, and dysregulated transforming growth factor-beta 1/Smad3 signalling."
    explanation: This preprint establishes Klotho deficiency as a key pathophysiologic feature of CKD that dysregulates TGF-β/Smad3 signaling.
- name: IL-11 Signalling in Renal Fibroblasts
  conforms_to: "il11_erk_ampk_mtor_aging#IL-11 Receptor Signalling Activation"
  role: amplifier
  biological_scale: MOLECULAR
  description: >-
    Profibrotic stimulation of kidney interstitial fibroblasts engages
    IL11RA1-mediated, ERK-dependent autocrine IL-11 signalling that drives their
    myofibroblast conversion and fibrogenic protein synthesis. This IL-11
    receptor-signalling arm is an organ-specific instance of the conserved IL-11
    signalling module and feeds tubulointerstitial fibrosis; IL-11 pathway
    antagonism reduces renal fibrosis in vivo.
  locations:
  - preferred_term: Kidney
    term:
      id: UBERON:0002113
      label: kidney
  cell_types:
  - preferred_term: Kidney interstitial fibroblast
    term:
      id: CL:1000692
      label: kidney interstitial fibroblast
  biological_processes:
  - preferred_term: Interleukin-11-mediated signaling pathway
    term:
      id: GO:0038154
      label: interleukin-11-mediated signaling pathway
    modifier: INCREASED
  - preferred_term: ERK1 and ERK2 cascade
    term:
      id: GO:0070371
      label: ERK1 and ERK2 cascade
    modifier: INCREASED
  evidence:
  - reference: PMID:29160304
    reference_title: "IL-11 is a crucial determinant of cardiovascular fibrosis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In mice, fibroblast-specific Il11 transgene expression or Il-11 injection
      causes heart and kidney fibrosis and organ failure, whereas genetic
      deletion of Il11ra1 protects against disease.
    explanation: >-
      Directly evidences that fibroblast IL-11 signalling causes kidney fibrosis
      and organ failure and that receptor deletion is protective, grounding this
      node in renal disease. Evidence source is MODEL_ORGANISM (transgenic and
      Il11ra1-knockout mice).
  - reference: PMID:29160304
    reference_title: "IL-11 is a crucial determinant of cardiovascular fibrosis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      IL-11 and its receptor (IL11RA) are expressed specifically in fibroblasts,
      in which they drive non-canonical, ERK-dependent autocrine signalling that
      is required for fibrogenic protein synthesis.
    explanation: >-
      Establishes the ERK-dependent autocrine IL-11 receptor-signalling arm in
      fibroblasts modeled by this node. Evidence source is IN_VITRO (primary
      human fibroblasts).
  - reference: PMID:29160304
    reference_title: "IL-11 is a crucial determinant of cardiovascular fibrosis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      rhIL-11 strongly activated human renal fibroblasts.
    explanation: >-
      Shows recombinant IL-11 directly activates human renal fibroblasts,
      specializing the conserved mechanism to the kidney compartment. Evidence
      source is IN_VITRO (primary human renal fibroblasts).
  - reference: PMID:40198895
    reference_title: "Development of a Long-Acting Interleukin-11 Antagonist for the Treatment of Renal Fibrosis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      analogue 13 exhibited a prolonged half-life and showed significant
      therapeutic effects in the UUO-induced renal fibrosis model
    explanation: >-
      Confirms that pharmacological IL-11 pathway antagonism reduces renal
      fibrosis in a CKD model, validating the drug-target relevance of this node.
      Evidence source is MODEL_ORGANISM (mouse unilateral ureteral obstruction
      model).
  downstream:
  - target: Tubulointerstitial Fibrosis

- name: Tubulointerstitial Fibrosis
  description: >
    Fibrotic replacement of tubular structures by collagen-producing
    myofibroblasts. The final common pathway of CKD progression.
  locations:
  - preferred_term: Renal Tubule
    term:
      id: UBERON:0009773
      label: renal tubule
  cell_types:
  - preferred_term: Myofibroblast
    term:
      id: CL:0000186
      label: myofibroblast cell
  downstream:
  - target: Anemia
    description: Fibrotic destruction of EPO-producing peritubular interstitial
      fibroblasts reduces erythropoietin synthesis, causing anemia.
    evidence:
    - reference: PMID:38927397
      reference_title: "Anemia of Chronic Kidney Disease-A Narrative Review of Its Pathophysiology, Diagnosis, and Management."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The pathophysiology of anemia in CKD involves the interplay of various
        factors such as erythropoietin (EPO) deficiency, iron dysregulation,
        chronic inflammation, bone marrow dysfunction, and nutritional
        deficiencies.
      explanation: >-
        Erythropoietin deficiency (from loss of EPO-producing renal interstitial
        cells) is the principal driver of CKD anemia, the downstream anemia edge
        of tubulointerstitial fibrosis.
  - target: Nephron Loss
    description: Fibrotic replacement of tubular structures is the final common
      pathway by which nephrons are destroyed.
  evidence:
  - reference: PMID:38610646
    reference_title: "Fibrosis in Chronic Kidney Disease: Pathophysiology and Therapeutic Targets."
    supports: SUPPORT
    snippet: "Transforming growth factor (TGF)-β is a central mediator in promoting
      transdifferentiation of polarized renal tubular epithelial cells into mesenchymal
      cells, resulting in irreversible kidney injury."
    explanation: This supports the mechanism of fibrotic replacement where TGF-β
      drives transdifferentiation of tubular epithelial cells, leading to
      fibrosis and irreversible injury.
  - reference: PMID:38339031
    reference_title: "From Acute to Chronic: Unraveling the Pathophysiological Mechanisms of the Progression from Acute Kidney Injury to Acute Kidney Disease to Chronic Kidney Disease."
    supports: SUPPORT
    snippet: "Key signaling pathways, such as Wnt/β-catenin, TGF-β/SMAD, and Hippo/YAP/TAZ,
      promote fibrosis and impact renal function."
    explanation: This confirms that TGF-β/SMAD and other pathways drive fibrotic
      processes that characterize the final common pathway of CKD progression.
- name: RAAS Activation
  description: >
    Inappropriately activated renin-angiotensin-aldosterone system promotes
    glomerular hypertension, fibrosis, and sodium retention.
  locations:
  - preferred_term: Kidney
    term:
      id: UBERON:0002113
      label: kidney
  biological_processes:
  - preferred_term: RAAS Signaling
    term:
      id: GO:0002018
      label: renin-angiotensin regulation of aldosterone production
  downstream:
  - target: Hypertension
    description: Angiotensin II-mediated vasoconstriction and aldosterone-driven
      sodium retention raise systemic blood pressure.
    evidence:
    - reference: PMID:32635265
      reference_title: "Sodium Intake and Chronic Kidney Disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        RAAS is inappropriately activated in CKD, leading to vasoconstriction
        and sodium retention, which contribute significantly to the raising of
        BP levels
      explanation: >-
        Inappropriate RAAS activation drives vasoconstriction and sodium
        retention that raise blood pressure, the downstream hypertension edge.
  - target: Peripheral Edema
    description: Aldosterone-driven sodium and water retention expands extracellular
      volume, producing peripheral edema.
  - target: Tubulointerstitial Fibrosis
    description: Aldosterone- and angiotensin II-mediated oxidative stress and
      pro-fibrotic signaling drive tubulointerstitial fibrosis.
    evidence:
    - reference: PMID:38339031
      reference_title: "From Acute to Chronic: Unraveling the Pathophysiological Mechanisms of the Progression from Acute Kidney Injury to Acute Kidney Disease to Chronic Kidney Disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The renin-angiotensin-aldosterone system (RAAS) triggers a cascade
        leading to renal fibrosis, with aldosterone exacerbating the oxidative
        stress and cellular changes that promote fibrosis.
      explanation: >-
        RAAS activation triggers a pro-fibrotic cascade with aldosterone-driven
        oxidative stress, the downstream tubulointerstitial-fibrosis edge.
  evidence:
  - reference: PMID:38339031
    reference_title: "From Acute to Chronic: Unraveling the Pathophysiological Mechanisms of the Progression from Acute Kidney Injury to Acute Kidney Disease to Chronic Kidney Disease."
    supports: SUPPORT
    snippet: "The renin-angiotensin-aldosterone system (RAAS) triggers a cascade leading
      to renal fibrosis, with aldosterone exacerbating the oxidative stress and cellular
      changes that promote fibrosis."
    explanation: This directly supports the mechanism by which RAAS activation
      promotes fibrosis through aldosterone-mediated oxidative stress and
      cellular injury in CKD.
  - reference: PMID:38610646
    reference_title: "Fibrosis in Chronic Kidney Disease: Pathophysiology and Therapeutic Targets."
    supports: PARTIAL
    snippet: "Current therapies such as renin-angiotensin blockers, mineralocorticoid
      receptor antagonists, and sodium/glucose cotransporter 2 inhibitors aim to delay
      progression."
    explanation: The therapeutic efficacy of RAAS blockers confirms that RAAS
      activation is a key driver of CKD progression, supporting its role in
      promoting hypertension and fibrosis.
mechanistic_hypotheses:
- hypothesis_group_id: pgs_context_amplification
  hypothesis_label: Amplification of polygenic CKD risk in adverse contexts via
    shared glomerular-injury convergence
  status: EMERGING
  description: >-
    Polygenic-score-by-context (PGS×C) interactions reported for chronic kidney
    disease in the UK Biobank appear to reflect amplification rather than
    context-specific causal variants: the same susceptibility loci (e.g. APOL1,
    PKD1, PKD2) exert systematically larger effects in disease-promoting
    contexts. This entry proposes that the amplification arises because polygenic
    liability and adverse exposures — notably hyperglycemia/diabetes and tobacco
    smoking — converge on the shared Glomerulosclerosis injury node, so their
    joint effect on the liability-threshold scale (here modelled against the PGS
    for eGFR) is super-additive rather than additive. Nagpal & Gibson (Nat Genet
    2026, PMID:42443528) report glucose and past smoking as
    major amplifying contexts for CKD, with the benefit of reducing them
    increasing at higher genetic risk.
  evidence:
  - reference: PMID:42443528
    reference_title: "Pervasive interactions between exposures and polygenic risk can inform more effective clinical and behavioral interventions."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: The predominant mechanism for PGS×C is the amplification of genetic
      effects in adverse contexts, such as low polyunsaturated fatty acids or social
      determinants of ill health
    explanation: >-
      Direct source (Nagpal & Gibson 2026): across seven UK Biobank diseases and
      75 contexts, amplification of genetic effects in adverse contexts is
      identified as the predominant mechanism of PGS×context interaction — the
      mechanism applied in this hypothesis.
  - reference: PMID:37228747
    reference_title: "Amplification is the primary mode of gene-by-sex interaction in complex human traits."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: GxSex is pervasive but acts primarily through systematic sex differences
      in the magnitude of many genetic effects
    explanation: >-
      Establishes amplification — systematic differences in the magnitude of
      polygenic effects rather than in the identity of causal variants — as the
      primary mode of gene-by-context interaction, the mechanism proposed here
      for the CKD PGS×context interactions (sex-adjusted hemoglobin and other
      contexts show amplification for CKD in Nagpal & Gibson 2026).
  notes: >-
    EMERGING hypothesis motivated by population-scale PGS×context analyses
    (primary source PMID:42443528; general amplification mechanism corroborated
    by PMID:37228747). The convergence claim (polygenic liability +
    hyperglycemia/smoking → Glomerulosclerosis) is a mechanistic interpretation
    and is not itself established as causal — see the reverse-causation knowledge
    gap under discussions.
phenotypes:
- name: Decreased GFR
  category: Renal
  frequency: VERY_FREQUENT
  diagnostic: true
  description: >-
    A sustained reduction in the glomerular filtration rate (GFR < 60
    mL/min/1.73 m2 persisting for at least three months) is the defining
    functional abnormality of CKD. It reflects cumulative loss of functional
    nephron mass and is staged G1-G5 to grade severity and predict progression
    to kidney failure.
  phenotype_term:
    preferred_term: Decreased GFR
    term:
      id: HP:0012622
      label: Chronic kidney disease
- name: Proteinuria
  category: Renal
  frequency: VERY_FREQUENT
  description: >-
    Abnormal urinary protein loss, typically quantified as albuminuria, results
    from disruption of the glomerular filtration barrier and impaired tubular
    reabsorption. It is both an early marker of kidney damage and an
    independent driver of progression, as filtered protein is directly toxic to
    tubular epithelium.
  phenotype_term:
    preferred_term: Proteinuria
    term:
      id: HP:0000093
      label: Proteinuria
  evidence:
  - reference: PMID:37857763
    reference_title: "Oxidative stress and the role of redox signalling in chronic kidney disease."
    supports: NO_EVIDENCE
    snippet: "However, excess ROS can be pathological, and contribute to the development
      and progression of chronic diseases."
    explanation: Excess ROS contributes to tubular and glomerular injury that
      manifests as proteinuria, a hallmark of CKD progression.
- name: Hypertension
  category: Cardiovascular
  frequency: VERY_FREQUENT
  description: >-
    Elevated systemic blood pressure is both a common cause and a near-universal
    consequence of CKD. Sodium and volume retention together with
    inappropriate renin-angiotensin-aldosterone system activation raise blood
    pressure, which in turn accelerates glomerular injury, creating a
    self-reinforcing cycle of renal damage.
  phenotype_term:
    preferred_term: Hypertension
    term:
      id: HP:0000822
      label: Hypertension
  evidence:
  - reference: PMID:32635265
    reference_title: "Sodium Intake and Chronic Kidney Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      RAAS is inappropriately activated in CKD, leading to vasoconstriction and
      sodium retention, which contribute significantly to the raising of BP
      levels
    explanation: >-
      Inappropriate RAAS activation with vasoconstriction and sodium retention
      raises blood pressure in CKD, supporting hypertension as a near-universal
      consequence.
- name: Anemia
  category: Hematologic
  frequency: FREQUENT
  notes: Due to reduced erythropoietin production
  description: >-
    Normocytic, normochromic anemia of CKD arises principally from deficient
    erythropoietin production by injured peritubular interstitial fibroblasts,
    compounded by functional iron deficiency from hepcidin-mediated iron
    sequestration and shortened red-cell survival. It contributes substantially
    to the fatigue and reduced quality of life of CKD.
  phenotype_term:
    preferred_term: Anemia
    term:
      id: HP:0001903
      label: Anemia
  sequelae:
  - target: Fatigue
    description: Reduced oxygen-carrying capacity from anemia is a major
      contributor to the fatigue of chronic kidney disease.
  evidence:
  - reference: PMID:38927397
    reference_title: 'Anemia of Chronic Kidney Disease-A Narrative Review of Its Pathophysiology, Diagnosis, and Management.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Anemia is one of the most common chronic kidney disease (CKD) complications.
      It negatively affects patients' quality of life and clinical outcomes."
    explanation: This review establishes anemia as one of the most common complications
      of CKD with significant impact on patient outcomes.
- name: Metabolic Acidosis
  category: Metabolic
  frequency: FREQUENT
  description: >-
    As functional renal mass declines, the kidney's capacity for ammoniagenesis
    and net acid excretion falls, leading to retention of hydrogen ions and a
    high-anion-gap or normal-anion-gap metabolic acidosis. Chronic acidosis
    promotes muscle wasting, bone demineralization, and accelerated CKD
    progression.
  phenotype_term:
    preferred_term: Metabolic Acidosis
    term:
      id: HP:0001942
      label: Metabolic acidosis
  evidence:
  - reference: PMID:38279993
    reference_title: "Metabolic acidosis in chronic kidney disease: mere consequence or also culprit?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      nephron loss with reduced ammoniagenesis is the main cause of acid
      retention in non-transplant CKD patients
    explanation: >-
      Declining nephron mass with reduced ammoniagenesis impairs net acid
      excretion, producing the metabolic acidosis of CKD.
- name: Fatigue
  category: Systemic
  frequency: FREQUENT
  description: >-
    Persistent tiredness and reduced exercise tolerance are among the most
    frequently reported symptoms in CKD. Fatigue is multifactorial, driven by
    anemia-related reduced oxygen delivery, uremic toxin accumulation, metabolic
    acidosis, chronic inflammation, and disordered sleep.
  phenotype_term:
    preferred_term: Fatigue
    term:
      id: HP:0012378
      label: Fatigue
- name: Peripheral Edema
  category: Cardiovascular
  frequency: FREQUENT
  description: >-
    Soft-tissue swelling, most prominent in the dependent lower extremities,
    results from renal sodium and water retention that expands the extracellular
    fluid volume. Edema is aggravated by hypoalbuminemia from heavy proteinuria
    and by the volume overload of advanced CKD.
  phenotype_term:
    preferred_term: Peripheral Edema
    term:
      id: HP:0012398
      label: Peripheral edema
biochemical:
- name: Creatinine
  presence: Elevated
  context: Reflects decreased filtration
  readouts:
  - target: Nephron Loss
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: PROGNOSTIC
    regulatory_endpoint_refs:
    - FDA-SE-adult-noncancer-012
    - FDA-SE-pediatric-noncancer-008
    interpretation: >-
      Elevated serum creatinine (and the correspondingly reduced eGFR derived
      from it) is a quantitative readout of cumulative functional nephron
      loss; higher and rising creatinine reflects more advanced nephron loss
      and predicts progression to kidney failure, which is why eGFR/creatinine
      is an FDA-recognized validated surrogate endpoint in CKD drug
      development.
    evidence:
    - reference: PMID:31292197
      reference_title: 'GFR Slope as a Surrogate End Point for Kidney Disease Progression in Clinical Trials: A Meta-Analysis of Treatment Effects of Randomized Controlled Trials.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "To assess the use of GFR slope as a surrogate end point for CKD progression, we performed a meta-analysis of 47 RCTs that tested 12 interventions in 60,620 subjects."
      explanation: >-
        Trial-level meta-analysis linking treatment effects on GFR slope to
        treatment effects on the CKD clinical end point across 47 RCTs.
    - reference: PMID:37330614
      reference_title: 'A meta-analysis of GFR slope as a surrogate endpoint for kidney failure.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Treatment effects on the clinical endpoint were strongly associated with treatment effects on total slope (median coefficient of determination (R2) = 0.97 (95% Bayesian credible interval (BCI) 0.82-1.00)) and moderately associated with those on chronic slope (R2 = 0.55 (95% BCI 0.25-0.77))."
      explanation: >-
        Updated CKD-EPI meta-analysis (66 studies, 186,312 participants)
        confirming the eGFR-slope readout is a near-perfect trial-level
        surrogate for kidney failure when total slope is used.
    - reference: PMID:31473020
      reference_title: 'Change in Albuminuria and GFR as End Points for Clinical Trials in Early Stages of CKD: A Scientific Workshop Sponsored by the National Kidney Foundation in Collaboration With the US Food and Drug Administration and European Medicines Agency.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The US Food and Drug Administration (FDA) and European Medicines Agency (EMA) are currently willing to consider a 30% to 40% glomerular filtration rate (GFR) decline as a surrogate end point for kidney failure for clinical trials of kidney disease progression under appropriate conditions."
      explanation: >-
        NKF-FDA-EMA joint workshop: regulatory acceptance of 30-40% eGFR
        decline as a surrogate end point for kidney failure in CKD trials.

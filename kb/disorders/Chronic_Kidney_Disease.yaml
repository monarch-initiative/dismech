environmental:
- name: Diabetes
  description: >
    Chronic hyperglycemia in type 1 and type 2 diabetes mellitus is the single
    largest contributor to incident CKD and end-stage kidney disease worldwide,
    acting through the diabetic microvascular injury cascade (glomerular
    hyperfiltration, mesangial expansion, podocyte loss, and albuminuria).
  effect: CAUSATIVE
  evidence:
  - reference: PMID:41263046
    reference_title: Population health management of diabetic kidney disease in Los
      Angeles county municipal health system.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Diabetic kidney disease (DKD) is the leading cause of chronic kidney
      disease (CKD) and end-stage renal disease (ESRD) worldwide
    explanation: Establishes diabetes as the leading antecedent condition for CKD
      and ESRD globally.
- name: Hypertension
  description: >
    Sustained elevated systemic blood pressure drives hypertensive
    nephrosclerosis — afferent arteriolar hyalinosis, glomerulosclerosis, and
    tubulointerstitial fibrosis — and is the second most common antecedent of
    end-stage kidney disease after diabetes. Hypertension is also a consequence
    of CKD, forming a self-reinforcing loop with RAAS activation.
  effect: CAUSATIVE
  evidence:
  - reference: PMID:34831368
    reference_title: 'Molecular Mechanisms of Hypertensive Nephropathy: Renoprotective
      Effect of Losartan through Hsp70.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Hypertensive nephrosclerosis is the second most common cause of end-stage
      renal disease after diabetes.
    explanation: Supports hypertension as the second leading antecedent of ESRD, ranked
      directly after diabetes.
- name: NSAIDs
  description: >
    Non-steroidal anti-inflammatory drugs inhibit cyclooxygenase-derived
    vasodilatory prostaglandins that maintain renal perfusion, producing
    hemodynamically mediated acute kidney injury; a second, dose-independent
    hypersensitivity mechanism produces acute interstitial nephritis. Chronic,
    high-dose use is associated with progression to CKD.
  effect: HARMFUL
  chemicals:
  - Ibuprofen
  - Diclofenac
  - Naproxen
  exposure_term:
    preferred_term: exposure to non-steroidal anti-inflammatory drug
    term:
      id: ECTO:9001720
      label: exposure to non-steroidal anti-inflammatory drug
  evidence:
  - reference: PMID:30281062
    reference_title: Pathophysiological aspects of nephropathy caused by non-steroidal
      anti-inflammatory drugs.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The second form of NSAID-induced AKI is acute interstitial nephritis,
      which may manifest as nephrotic proteinuria.
    explanation: Supports the interstitial-nephritis mechanism attributed to NSAID
      exposure.
  - reference: PMID:30281062
    reference_title: Pathophysiological aspects of nephropathy caused by non-steroidal
      anti-inflammatory drugs.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Long-term NSAID use can lead to chronic kidney disease (CKD).
    explanation: Directly supports chronic NSAID exposure as a cause of CKD rather
      than only of reversible AKI.
- name: Nephrotoxic Medications
  description: >
    Recurrent or high-cumulative-dose exposure to nephrotoxic agents —
    aminoglycosides, iodinated contrast media, cisplatin, calcineurin
    inhibitors, and proton pump inhibitors — causes proximal tubular injury and
    acute kidney injury episodes that leave residual nephron loss; avoidance of
    these agents is a standard component of CKD care.
  effect: HARMFUL
  chemicals:
  - Gentamicin
  - Iodinated contrast media
  - Cisplatin
  - Calcineurin inhibitors
  - Proton pump inhibitors
  exposure_term:
    preferred_term: exposure to nephrotoxic agent
    term:
      id: ECTO:9001878
      label: exposure to nephrotoxic agent
  evidence:
  - reference: PMID:40790782
    reference_title: 'Optimizing care for chronic kidney disease: Considerations from
      A to Z.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Vigilance in avoiding nephrotoxic agents, such as non-steroidal anti-inflammatory
      drugs, proton pump inhibitors, aminoglycosides, and contrast media, is essential
      for preventing renal injury.
    explanation: Names the specific nephrotoxic drug classes whose avoidance protects
      the kidney in CKD, supporting them as modifiable exposures.
- name: Tobacco Smoking
  description: >
    Cigarette smoking is an independent, modifiable risk factor for incident CKD
    and for progression to end-stage renal disease in the general adult
    population, with risk graded by smoking status (current > former > never).
    Smoking cessation is accordingly a standard component of CKD risk-factor
    management, alongside glycemic and blood-pressure control.
  effect: HARMFUL
  exposure_term:
    preferred_term: exposure to tobacco smoking
    term:
      id: ECTO:6000029
      label: exposure to tobacco smoking
  evidence:
  - reference: PMID:28339863
    reference_title: 'Cigarette smoking and chronic kidney disease in the general population:
      a systematic review and meta-analysis of prospective cohort studies.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Compared with never-smokers, the SRRs of incident CKD were 1.27 (95% CI
      1.19-1.35) for ever-smokers, 1.34 (95% CI 1.23-1.47) for current smokers and
      1.15 (95% CI 1.08-1.23) for former smokers.
    explanation: Quantifies the dose-graded increase in incident CKD risk with smoking
      status across 15 prospective cohorts, supporting tobacco smoking as a modifiable
      exposure contributing to CKD.
  - reference: PMID:28339863
    reference_title: 'Cigarette smoking and chronic kidney disease in the general population:
      a systematic review and meta-analysis of prospective cohort studies.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Our meta-analysis suggests evidence for cigarette smoking as an independent
      risk factor for incident CKD.
    explanation: States the meta-analytic conclusion that smoking is an independent
      (not confounded) risk factor for incident CKD.
  notes: >-
    Modifiable behavioural exposure named alongside hyperglycemia and blood
    pressure in this entry's mechanistic hypotheses and proposed experiments.
    The same meta-analysis reports a null smoking-proteinuria association in the
    general population, so the effect is not curated as acting through
    albuminuria.
- name: HIV Infection (HIV-Associated Nephropathy)
  description: >-
    Untreated HIV-1 infection can cause HIV-associated nephropathy (HIVAN), a
    collapsing form of focal segmental glomerulosclerosis presenting with
    nephrotic-range proteinuria that can progress to end-stage kidney disease.
    Susceptibility is strongly tied to the APOL1 G1/G2 renal-risk genotype
    (recorded as the APOL1 risk locus in the genetic section), consistent with a
    gene-environment "second-hit" model in which HIV supplies the environmental
    trigger.
  evidence:
  - reference: PMID:36816427
    reference_title: "HIV-Associated Nephropathy in 2022."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "HIV-associated nephropathy (HIVAN) is a renal parenchymal disease
      that occurs exclusively in people living with HIV. It is a serious kidney
      condition that may possibly lead to end-stage kidney disease"
    explanation: >-
      Establishes HIV infection as a direct cause of a CKD-progressing renal
      parenchymal disease (HIVAN).
  - reference: PMID:36816427
    reference_title: "HIV-Associated Nephropathy in 2022."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The African-American population has increased susceptibility to
      this comorbidity due to a strong association found in the APOL1 gene"
    explanation: >-
      Links HIVAN susceptibility to the APOL1 high-risk genotype already recorded
      in the genetic section, supporting the gene-environment (second-hit) model.
  notes: >-
    Infectious/environmental trigger interacting with the APOL1 renal-risk
    locus; risk is reduced by effective antiretroviral suppression.
- name: Tenofovir Disoproxil Fumarate (TDF) Antiretroviral Therapy
  description: >-
    Tenofovir disoproxil fumarate, a widely used nucleotide reverse
    transcriptase inhibitor, accumulates in proximal tubular epithelial cells
    and causes mitochondrial proximal tubular injury (Fanconi-type tubulopathy
    and glomerular filtration rate decline) - a recognized iatrogenic
    contributor to CKD in people on long-term antiretroviral therapy.
  evidence:
  - reference: PMID:24958564
    reference_title: "Tenofovir-induced nephrotoxicity: incidence, mechanism,
      risk factors, prognosis and proposed agents for prevention."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cellular accumulation through increased entry from the human
      organic anion transporters and decreased efflux into tubular lumen is main
      mechanism of nucleotide analogue antiviral induced nephrotoxicity."
    explanation: >-
      Describes the proximal tubular accumulation mechanism of TDF
      nephrotoxicity that drives GFR decline and CKD.
  - reference: PMID:24958564
    reference_title: "Tenofovir-induced nephrotoxicity: incidence, mechanism,
      risk factors, prognosis and proposed agents for prevention."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Several predisposing factors including elevated baseline SCr,
      concomitant nephrotoxic medications, low body weight, advanced age,
      tenofovir disoproxil fumarate (TDF) dose and duration of treatment and
      lower CD4 cell count were identified as risk factors for development of
      TDF-induced nephrotoxicity."
    explanation: >-
      Enumerates the clinical risk factors that modulate TDF-associated CKD
      risk.
  notes: >-
    Iatrogenic (drug-induced) contributor; risk is mitigated by switching to
    tenofovir alafenamide (TAF) and by baseline and on-treatment renal
    monitoring.

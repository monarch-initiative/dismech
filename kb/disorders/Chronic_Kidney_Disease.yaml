- accession: ega:EGAS50000000646
  title: Host factors dictate gut microbiome alterations in chronic kidney disease more strongly than to kidney function
  description: Despite recent progress, microbial markers in Chronic Kidney Disease (CKD) remain inconclusive. We combined quantitative faecal metagenomics (N=130 CKD cohort) and cross-study biomarker comparisons (Ntotal=4420) to study microbiome associations with glomerular filtration rate (eGFR; kidney function) and 4-year CKD progression. Transit time (TT) and medications primarily explained microbiome variation, trumping eGFR-related effects.

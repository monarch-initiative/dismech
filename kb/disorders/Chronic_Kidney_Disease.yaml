- name: Plasma albumin (Mendelian randomization signal)
  specificity: >
    Distinct from urinary albumin, which is the established CKD marker. This
    entry concerns circulating plasma albumin as a candidate causal metabolite,
    recorded because it had the largest number of potentially causal disease
    links of any metabolite in a 274,241-participant UK Biobank atlas.
  context: >
    The atlas reports a bidirectional causal relationship between albumin level
    and chronic kidney disease, consistent with earlier work. No presence value
    is recorded because the quantity estimated is a genetically instrumented
    effect rather than an observed patient-versus-control level, and because
    bidirectionality means the sign cannot be attributed to one direction of
    the relationship. The authors explicitly flag the therapeutic ambiguity
    that follows: an intervention lowering albumin might reduce chronic kidney
    disease events while raising risk of metabolic disease. Nothing here should
    be read as a treatment recommendation, and it does not change the role of
    albuminuria in CKD staging.
  evidence:
  - reference: PMID:40973818
    reference_title: "Mapping the plasma metabolome to human health and disease in 274,241 adults."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the well-known bidirectional causal relationship between albumin level and CKD"
    explanation: >
      States that the atlas recovered a bidirectional causal relationship
      between albumin and chronic kidney disease, placing it among the
      metabolite-disease pairs with the strongest causal support.
  - reference: PMID:40973818
    reference_title: "Mapping the plasma metabolome to human health and disease in 274,241 adults."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "while lowering albumin levels may decrease CKD events, it might also increase the risk of metabolic diseases"
    explanation: >
      Supports the caveat recorded in the context field. Marked PARTIAL because
      the sentence is the authors' interpretation of a possible therapeutic
      trade-off, not a tested intervention result.

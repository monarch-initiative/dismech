  evidence:
  - reference: PMID:23440042
    reference_title: "Loss-of-function mutations in the IL-21 receptor gene cause a primary immunodeficiency syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The liver biopsy revealed extensive fibrosis (Fig. 1 D), as well as
      cryptosporidia in the bile ducts and duodenum (Fig. 1 E).
    explanation: >-
      Directly demonstrates Cryptosporidium in bile ducts in a patient with
      primary immunodeficiency.
  downstream:
  - target: Cholangitis
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:23440042
      reference_title: "Loss-of-function mutations in the IL-21 receptor gene cause a primary immunodeficiency syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In this study, we report on two unrelated kindreds, with two patients

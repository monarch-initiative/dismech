treatments:
- name: Nitazoxanide
  description: >-
    Antiparasitic therapy for cryptosporidiosis, with limited efficacy in
    severely immunocompromised or malnourished patients.
  action_category: THERAPEUTIC
  evidence:
  - reference: PMID:37764167
    reference_title: "The Gut-Wrenching Effects of Cryptosporidiosis and Giardiasis in Children."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Nitazoxanide is the only Food and Drug Administration (FDA)-approved drug
      with some dual therapeutic effect for the treatment of human and animal
      cryptosporidiosis and giardiasis (Table 2)
    explanation: Supports nitazoxanide as an FDA-approved antiparasitic therapy.
  - reference: PMID:37764167
    reference_title: "The Gut-Wrenching Effects of Cryptosporidiosis and Giardiasis in Children."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Clinical experience with severely immunocompromised patients and
      malnourished children has demonstrated frequent therapeutic failure
    explanation: >-
      Supports the efficacy caveat in severe immunocompromise and malnutrition.

- name: Undernutrition or immunodeficiency
  description: >-
    Impaired cellular immunity from undernutrition or immune deficiency increases
    the likelihood that Cryptosporidium exposure progresses to symptomatic or
    persistent disease.
  disease_effect: PREDISPOSES
  causal_role: RISK_FACTOR

  description: >-
    Drinking or swallowing contaminated recreational water exposes hosts to
    chlorine-resistant infectious Cryptosporidium oocysts.
  disease_effect: PREDISPOSES
  causal_role: RISK_FACTOR
  influences_mechanisms:
  - target: Ingestion and excystation of infectious Cryptosporidium oocysts
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Swallowed contaminated water delivers infectious oocysts directly to the
      gut, where they excyst and invade the small intestine.
    evidence:

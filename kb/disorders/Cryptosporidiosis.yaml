treatments:
- name: Nitazoxanide
  description: >-
    Antiparasitic therapy for cryptosporidiosis; randomized trials support
    benefit in immunocompetent patients and HIV-seronegative children, while
    responses are poor in severely immunocompromised or malnourished patients.
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: nitazoxanide
      term:
        id: CHEBI:94807
        label: acetic acid [2-[[(5-nitro-2-thiazolyl)amino]-oxomethyl]phenyl] ester
  target_mechanisms:
  - target: Intracellular infection of small-intestinal epithelial cells
    treatment_effect: INHIBITS
    description: >-
      Nitazoxanide suppresses intestinal cryptosporidial infection enough to
      shorten diarrheal illness in responsive, non-HIV trial populations.
  evidence:
  - reference: PMID:37764167
    reference_title: "The Gut-Wrenching Effects of Cryptosporidiosis and Giardiasis in Children."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Nitazoxanide is the only Food and Drug Administration (FDA)-approved drug
      with some dual therapeutic effect for the treatment of human and animal
      cryptosporidiosis and giardiasis (Table 2)
    explanation: Supports nitazoxanide as an FDA-approved antiparasitic therapy.
  - reference: PMID:11398117
    reference_title: "Treatment of diarrhea caused by Cryptosporidium parvum: a prospective randomized, double-blind, placebo-controlled study of Nitazoxanide."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At 7 days after initiation of therapy, diarrhea had resolved in 39 (80%)
      of the 49 patients in the nitazoxanide treatment group, compared with 20
      (41%) of 49 in the placebo group (P<.0001).
    explanation: >-
      Supplies randomized placebo-controlled trial evidence that nitazoxanide
      shortened diarrheal illness.
  - reference: PMID:12423984
    reference_title: "Effect of nitazoxanide on morbidity and mortality in Zambian children with cryptosporidiosis: a randomised controlled trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In HIV-seronegative children, diarrhoea resolved in 14 (56%) of 25
      receiving nitazoxanide and 5 (23%) of 22 receiving placebo (difference
      33%, 95% CI 7-59; p=0.037).
    explanation: >-
      Supports nitazoxanide efficacy in HIV-seronegative children in a
      randomized controlled trial.
  - reference: PMID:37764167
    reference_title: "The Gut-Wrenching Effects of Cryptosporidiosis and Giardiasis in Children."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Clinical experience with severely immunocompromised patients and
      malnourished children has demonstrated frequent therapeutic failure
    explanation: >-
      Supports the efficacy caveat in severe immunocompromise and malnutrition.
- name: Antiretroviral therapy for AIDS-related cryptosporidiosis
  description: >-
    In AIDS-related cryptosporidiosis, successful antiretroviral therapy can
    restore enough cellular immunity to eradicate cryptosporidial organisms and
    improve symptoms over months.
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antiretroviral Therapy
    term:
      id: NCIT:C94631
      label: Antiretroviral Therapy
  target_mechanisms:
  - target: Intracellular infection of small-intestinal epithelial cells
    treatment_effect: MODULATES
    description: >-
      Successful antiretroviral therapy restores HIV-associated immune control
      over intestinal opportunistic protozoa rather than directly inhibiting
      Cryptosporidium.
  - target: Biliary epithelial Cryptosporidium persistence in severe immune deficiency
    treatment_effect: RESTORES
    description: >-
      Antiretroviral therapy treats the HIV/AIDS immune defect that permits
      chronic cryptosporidial infection rather than directly killing
      Cryptosporidium.
  evidence:
  - reference: PMID:11103042
    reference_title: Eradication of cryptosporidia and microsporidia following successful antiretroviral therapy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients who responded successfully to HAART eradicated both
      cryptosporidial and microsporidial organisms.
    explanation: >-
      Directly supports organism eradication after successful antiretroviral
      therapy in AIDS-related cryptosporidiosis and microsporidiosis.
  - reference: PMID:19212310
    reference_title: An update on AIDS-related cholangiopathy.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: antiretroviral therapy is a protective factor
    explanation: >-
      Supports antiretroviral therapy as a protective host-context modifier in
      AIDS-related cholangiopathy.

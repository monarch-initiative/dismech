    reference_title: CD40 agonist antibody mediated improvement of chronic Cryptosporidium infection in patients with X-linked hyper IgM syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      X-linked hyper-IgM syndrome (XHM) is a combined immune deficiency disorder
      caused by mutations in CD40 ligand.
    explanation: >-
      Identifies CD40 ligand mutation as the lesion underlying X-linked
      hyper-IgM syndrome.
  - reference: PMID:22459705
    reference_title: CD40 agonist antibody mediated improvement of chronic Cryptosporidium infection in patients with X-linked hyper IgM syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In XHM patients, the liver is the most common extra intestinal site of
      Cryptosporidium infection.
    explanation: >-
      Supports biliary cryptosporidiosis as a recurrent complication in the
      CD40 ligand deficiency syndrome.

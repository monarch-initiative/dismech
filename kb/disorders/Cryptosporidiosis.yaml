agent_life_cycle:
  description: >-
    Environmentally resistant oocysts shed by mammalian hosts initiate infection;
    after ingestion they excyst, invade the small intestine, undergo asexual
    replication, enter a sexual cycle, and produce new oocysts that are passed
    in feces.
  hosts:
  - preferred_term: humans
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
    role: intestinal host
  - preferred_term: mammals
    term:
      id: NCBITaxon:40674
      label: Mammalia
    role: zoonotic reservoir host
  life_cycle_stages:
  - name: Environmentally resistant oocyst
    description: >-
      Dormant infective oocysts survive outside the host, seed waterborne and
      household outbreaks, and initiate human infection after ingestion.
    evidence:
    - reference: PMID:37764167
      reference_title: "The Gut-Wrenching Effects of Cryptosporidiosis and Giardiasis in Children."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        The developmental stage that initiates human infection and outbreaks is
        the environmentally resistant and dormant but infectious oocyst stage.
      explanation: Identifies the oocyst as the environmental infective stage.
  - name: Small-intestinal sporozoite, trophozoite, and merozoite replication
    description: >-
      Ingested oocysts excyst into active forms that invade the small intestine
      and replicate intracellularly.
    evidence:
    - reference: PMID:37764167
      reference_title: "The Gut-Wrenching Effects of Cryptosporidiosis and Giardiasis in Children."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Once oocysts are ingested, they excyst, forming active stages
        (sporozoites, trophozoites, merozoites, etc.) that invade and replicate
        in the mammalian host’s small intestine
      explanation: >-
        Directly supports the intestinal excystation, invasion, and replication
        phase of the parasite life cycle.
  - name: Asexual epithelial replication and fecal oocyst shedding
    description: >-
      Intracellular asexual replication injures intestinal epithelium, then
      sexual reproduction yields oocysts that exit in feces.
    evidence:
    - reference: PMID:37764167
      reference_title: "The Gut-Wrenching Effects of Cryptosporidiosis and Giardiasis in Children."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        The parasite undergoes two rounds of asexual replication, which damages
        the intestinal epithelium, before entering the sexual cycle to produce
        oocysts that are passed in feces.
      explanation: >-
        Supports the epithelial asexual replication and later oocyst-shedding
        stages.
transmission:
- name: Waterborne fecal-oral transmission
  description: >-
    Chlorine-tolerant oocysts persist in recreational or drinking water and
    infect hosts when swallowed.
  evidence:
  - reference: PMID:37764167
    reference_title: "The Gut-Wrenching Effects of Cryptosporidiosis and Giardiasis in Children."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The hardy, highly infectious oocysts can survive for prolonged periods in
      the environment and are not killed by chlorine, facilitating transmission
      via chlorinated water.
    explanation: >-
      Explains why oocysts remain infectious in treated water and support
      waterborne fecal-oral spread.
- name: Foodborne fecal-oral transmission
  description: Acquisition through food contaminated with Cryptosporidium oocysts.
  evidence:
  - reference: PMID:37764167
    reference_title: "The Gut-Wrenching Effects of Cryptosporidiosis and Giardiasis in Children."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The most common method of infection involves the consumption of
      contaminated food or water
    explanation: Names contaminated food as a common route of acquisition.
- name: Household person-to-person fecal-oral transmission
  description: >-
    Household contact with an infected person can deliver fecally shed oocysts to
    susceptible children.
  evidence:
  - reference: PMID:37764167
    reference_title: "The Gut-Wrenching Effects of Cryptosporidiosis and Giardiasis in Children."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The presumed most common method of Cryptosporidium infection for young,
      malnourished children is an infected household contact.
    explanation: >-
      Supports direct household spread as an important pediatric transmission
      route.
prevalence:
- population: Global, especially children under 24 months in Africa and Asia
  measure_type: ANNUAL_INCIDENCE
  notes: >-
    The pediatric global burden is concentrated in low-resource settings with
    unsafe water, poor sanitation, undernutrition, and immunodeficiency; the
    cited review reports estimates of 50 million diarrheal episodes annually and
    more than 200,000 attributable deaths among malnourished children younger
    than 2 years in Africa and Asia.
  evidence:
  - reference: PMID:37764167
    reference_title: "The Gut-Wrenching Effects of Cryptosporidiosis and Giardiasis in Children."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Globally, it is estimated that cryptosporidiosis could be linked to 50
      million diarrheal episodes annually, with over 200,000
      Cryptosporidium-attributable deaths in < 2-year-old malnourished children
      from Africa and Asia due to moderate-to-severe diarrhea
    explanation: >-
      Supports the population and estimated annual pediatric burden carried in
      the notes.
progression:
- phase: Oocyst ingestion and excystation
  notes: >-
    Infection starts when environmentally resistant oocysts are swallowed and
    release active invasive stages in the small intestine.
  evidence:
  - reference: PMID:37764167
    reference_title: "The Gut-Wrenching Effects of Cryptosporidiosis and Giardiasis in Children."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Once oocysts are ingested, they excyst, forming active stages
      (sporozoites, trophozoites, merozoites, etc.) that invade and replicate
      in the mammalian host’s small intestine
    explanation: Supports the initiating post-ingestion phase.
- phase: Acute watery enteritis
  notes: >-
    Intestinal epithelial infection may remain asymptomatic, produce an acute
    self-limited diarrheal illness, or become persistent.
  evidence:
  - reference: PMID:37764167
    reference_title: "The Gut-Wrenching Effects of Cryptosporidiosis and Giardiasis in Children."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Cryptosporidiosis and giardiasis illness can not only be self-limited but
      can also be acute or chronic and persistent
    explanation: Supports acute and self-limited clinical courses.
- phase: Chronic or biliary disease in immunocompromised hosts
  notes: >-
    Impaired cellular immunity increases symptomatic-infection risk and can
    permit persistence beyond intestinal epithelium into the biliary tract.
  evidence:
  - reference: PMID:37764167
    reference_title: "The Gut-Wrenching Effects of Cryptosporidiosis and Giardiasis in Children."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Undernutrition, which impairs cellular immunity, and immunodeficiencies
      increase the risk of infection and developing symptoms
    explanation: >-
      Supports immune impairment as a risk factor for symptomatic disease.
  - reference: PMID:23440042
    reference_title: "Loss-of-function mutations in the IL-21 receptor gene cause a primary immunodeficiency syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The liver biopsy revealed extensive fibrosis (Fig. 1 D), as well as
      cryptosporidia in the bile ducts and duodenum (Fig. 1 E).
    explanation: >-
      Documents simultaneous duodenal and bile-duct Cryptosporidium infection in
      a severely immunocompromised patient.
clinical_burden:
  burden_level: VARIABLE
  rationale: >-
    Infection can be asymptomatic or self-limited, but children with
    undernutrition and patients with immune defects are at risk for persistent
    diarrhea, dehydration, and hepatobiliary disease.
  evidence:
  - reference: PMID:37764167
    reference_title: "The Gut-Wrenching Effects of Cryptosporidiosis and Giardiasis in Children."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The impact on children can be particularly profound, as both parasitic
      infections can contribute to malnutrition, stunted growth, and poor
      cognitive function, with severe cases causing potentially fatal dehydration
    explanation: >-
      Supports a variable but sometimes severe pediatric burden.
pathophysiology:
- name: Ingestion and excystation of infectious Cryptosporidium oocysts
  biological_scale: ORGANISM
  description: >-
    Dormant oocysts swallowed in contaminated water, food, or fecal material
    excyst in the intestinal lumen into invasive sporozoites and other active
    stages.
  locations:
  - preferred_term: small intestine
    term:
      id: UBERON:0002108
      label: small intestine
  evidence:
  - reference: PMID:37764167
    reference_title: "The Gut-Wrenching Effects of Cryptosporidiosis and Giardiasis in Children."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Infections are established after the ingestion of dormant, environmentally
      resistant infective cysts (G. duodenalis) or oocysts (C. parvum and C.
      hominis), passed in the feces of mammalian hosts
    explanation: >-
      Supports fecally shed oocyst ingestion as the event that establishes
      infection.
  downstream:
  - target: Intracellular infection of small-intestinal epithelial cells
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:37764167
      reference_title: "The Gut-Wrenching Effects of Cryptosporidiosis and Giardiasis in Children."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Once oocysts are ingested, they excyst, forming active stages
        (sporozoites, trophozoites, merozoites, etc.) that invade and replicate
        in the mammalian host’s small intestine
      explanation: >-
        Directly links ingestion/excystation to small-intestinal invasion and
        replication.
- name: Intracellular infection of small-intestinal epithelial cells
  biological_scale: CELLULAR
  description: >-
    Sporozoites attach to the ileal brush border and enter epithelial cells,
    creating a parasitophorous vacuole within the host cell plasma membrane.
  cell_types:
  - preferred_term: epithelial cell of small intestine
    term:
      id: CL:0002254
      label: epithelial cell of small intestine
  locations:
  - preferred_term: ileum
    term:
      id: UBERON:0002116
      label: ileum
  evidence:
  - reference: PMID:37764167
    reference_title: "The Gut-Wrenching Effects of Cryptosporidiosis and Giardiasis in Children."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The sporozoite attaches to the intestinal lining using membrane-associated
      glycoproteins, including gp40/15, which bind to the target cells’
      receptors on the ileal brush border, which then enables entry into the
      host cells, particularly in the terminal ileum
    explanation: >-
      Supports attachment and entry at the ileal brush border of intestinal
      epithelial cells.
  downstream:
  - target: Intestinal epithelial damage and fluid-electrolyte disruption
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:37764167
      reference_title: "The Gut-Wrenching Effects of Cryptosporidiosis and Giardiasis in Children."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        The parasite undergoes two rounds of asexual replication, which damages
        the intestinal epithelium, before entering the sexual cycle to produce
        oocysts that are passed in feces.
      explanation: >-
        Directly connects parasite replication in the epithelium to epithelial
        injury.
- name: Intestinal epithelial damage and fluid-electrolyte disruption
  biological_scale: TISSUE
  description: >-
    Cryptosporidium replication damages the small-intestinal epithelium,
    inflames the lamina propria, and disrupts fluid and electrolyte homeostasis,
    yielding watery diarrhea that can progress to dehydration.
  cell_types:
  - preferred_term: epithelial cell of small intestine
    term:
      id: CL:0002254
      label: epithelial cell of small intestine
  locations:
  - preferred_term: epithelium of small intestine
    term:
      id: UBERON:0001902
      label: epithelium of small intestine
  evidence:
  - reference: PMID:37764167
    reference_title: "The Gut-Wrenching Effects of Cryptosporidiosis and Giardiasis in Children."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Cryptosporidium species are obligate, intracellular parasites that can
      damage host intestinal epithelial cells and disrupt the normal balance of
      fluids and electrolytes.
    explanation: >-
      Supports epithelial damage and fluid-electrolyte imbalance as the proximal
      intestinal injury.
  downstream:
  - target: Diarrhea
    causal_link_type: DIRECT

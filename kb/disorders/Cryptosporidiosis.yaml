    - reference: PMID:37764167
      reference_title: "The Gut-Wrenching Effects of Cryptosporidiosis and Giardiasis in Children."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: This could result in watery diarrhea and dehydration.
      explanation: >-
        Directly ties the preceding epithelial injury and inflammation to watery
        diarrhea and dehydration.
  - target: Dehydration
    causal_link_type: DIRECT
    evidence:

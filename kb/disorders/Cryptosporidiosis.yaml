      reference_title: "The Gut-Wrenching Effects of Cryptosporidiosis and Giardiasis in Children."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        The hardy, highly infectious oocysts can survive for prolonged periods in
        the environment and are not killed by chlorine, facilitating transmission
        via chlorinated water.
      explanation: >-
        Supports chlorine-tolerant contaminated water as an exposure that
        carries the infectious stage.
  evidence:

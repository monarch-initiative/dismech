definitions:
- name: Clinical and stool-confirmed cryptosporidiosis
  definition_type: CASE_DEFINITION
  description: >-
    Cryptosporidiosis is intestinal infection with Cryptosporidium that may be
    asymptomatic, acute and self-limited, or chronic and persistent; suspected
    cases are confirmed by detecting oocysts or parasite antigens or nucleic
    acids in feces.
  scope: Clinical framing for intestinal cryptosporidiosis
  evidence:
  - reference: PMID:37764167
    reference_title: "The Gut-Wrenching Effects of Cryptosporidiosis and Giardiasis in Children."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Cryptosporidiosis and giardiasis illness can not only be self-limited but
      can also be acute or chronic and persistent
    explanation: >-
      Supports a case frame that spans self-limited acute illness and chronic or
      persistent infection.
  - reference: PMID:37764167
    reference_title: "The Gut-Wrenching Effects of Cryptosporidiosis and Giardiasis in Children."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Cryptosporidiosis and giardiasis are both often diagnosed through the
      microscopic identification of the cysts and oocysts found in fecal matter.
    explanation: Supports stool oocyst detection as a diagnostic anchor.
  - reference: PMID:37764167
    reference_title: "The Gut-Wrenching Effects of Cryptosporidiosis and Giardiasis in Children."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Rapid (antigen) diagnostic tests (RDTs) are available for Giardia and
      Cryptosporidium, generally using lateral flow techniques.
    explanation: Supports stool antigen testing as a diagnostic modality.
  - reference: PMID:37764167
    reference_title: "The Gut-Wrenching Effects of Cryptosporidiosis and Giardiasis in Children."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Biofire and other commercial nucleic acid detection methods for the
      simultaneous detection of stool pathogens, including Giardia and
      Cryptosporidium, have recently replaced microscopy, culture, and antigen
      diagnostics for stools in many HIC clinical diagnostic laboratories
    explanation: Supports stool nucleic-acid testing as a diagnostic modality.

name: Cryptosporidiosis
creation_date: '2026-11-14T00:00:00Z'
category: Infectious Disease
description: >-
  Cryptosporidiosis is a fecal-orally transmitted protozoal intestinal infection
  caused by Cryptosporidium species, predominantly Cryptosporidium hominis and
  Cryptosporidium parvum. Ingested environmentally resistant oocysts excyst in
  the gut, invade and replicate within small-intestinal epithelial cells, injure
  the epithelium, inflame the lamina propria, disrupt fluid and electrolyte
  balance, and produce watery diarrhea with dehydration risk; persistent biliary
  infection is a severe complication in people with severe cellular immune
  impairment, including advanced HIV/AIDS and CD40L defects.
disease_term:
  preferred_term: cryptosporidiosis
  term:
    id: MONDO:0015474
    label: cryptosporidiosis
parents:
- coccidiosis
- parasitic intestinal disorder
synonyms:
- Cryptosporidium infection
- Intestinal cryptosporidiosis
review_notes: >-
  Deliberately lumped at the genus-level MONDO term: C. hominis and C. parvum
  are modeled as predominant etiologic species, not split into separate disease
  entries, because the curated core intestinal and immunodeficiency-associated
  biliary mechanisms are shared at the current resolution.

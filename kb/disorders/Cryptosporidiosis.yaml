- name: MBL2 low-producing polymorphisms
  relationship_type: SUSCEPTIBILITY
  gene_term:
    preferred_term: MBL2
    term:
      id: hgnc:6922
      label: MBL2
  features: >-
    Review evidence links MBL2 polymorphisms that lower mannose-binding lectin
    production to pediatric susceptibility to diarrheal diseases including
    cryptosporidiosis; this entry records susceptibility only, not a monogenic
    causal claim.
  evidence:
  - reference: PMID:37764167
    reference_title: "The Gut-Wrenching Effects of Cryptosporidiosis and Giardiasis in Children."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Polymorphisms in the MBL2 gene can lead to the low production of MBL,
      making children more prone to diarrheal diseases, including
      cryptosporidiosis
    explanation: >-
      Supports MBL2 variation as a susceptibility modifier for pediatric
      cryptosporidial diarrhea.
- name: CD40LG deficiency
  relationship_type: SUSCEPTIBILITY
  gene_term:
    preferred_term: CD40LG
    term:
      id: hgnc:11935
      label: CD40LG
  features: >-
    CD40 ligand loss causes X-linked hyper-IgM syndrome, a combined
    immunodeficiency in which chronic biliary cryptosporidiosis is a recognized

    modifier: INCREASED
  evidence:
  - reference: PMID:28757235
    reference_title: Adult onset Still's disease-The evidence that anti-interleukin-1 treatment is
      effective and well-tolerated (a comprehensive literature review).
    supports: SUPPORT
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: The compiled data show that treatment with all anti-IL-1 agents is effective in AOSD,
      indicating that IL-1 has a central role in the pathogenesis of AOSD.
    explanation: A literature review infers the central role of IL-1 from the consistent response
      to IL-1 blockade.
  downstream:
  - target: Systemic Hyperinflammation and Multiorgan Involvement
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: IL-1 signaling sustains the systemic inflammatory state; the step is inferred from
      remission under IL-1 blockade.
    evidence:
    - reference: PMID:28757235
      reference_title: Adult onset Still's disease-The evidence that anti-interleukin-1 treatment
        is effective and well-tolerated (a comprehensive literature review).
      supports: SUPPORT
      directness: INDIRECT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: OTHER
      snippet: Rates of full or partial remission with each agent were similar to each other (91-100%)
        and superior to the outcomes published for classical therapies.
      explanation: Therapeutic response to IL-1 blockade, cited as indirect support for IL-1 driving
        systemic disease.

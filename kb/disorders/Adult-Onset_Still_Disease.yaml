- name: IL-6 Inhibitor Therapy (Tocilizumab)
  description: Tocilizumab is a monoclonal antibody against the interleukin-6 receptor. The adult
    trial (Japan, phase 3, 27 glucocorticoid-refractory patients, 8 mg/kg intravenously every 2 weeks)
    did not meet its primary endpoint of ACR50 at week 4, but systemic feature score and glucocorticoid
    dose improved more than with placebo at week 12. In that trial's cytokine sub-analysis, patients
    who did not respond had higher baseline interferon-gamma and IL-1beta, a hypothesis-level pointer
    to which patients need a different target.

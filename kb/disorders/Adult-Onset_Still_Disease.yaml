biochemical:
- name: Hyperferritinemia
  notes: >-
    Markedly elevated serum ferritin is common in active AOSD, but it is a
    nonspecific classification-supporting finding rather than a stand-alone
    diagnostic threshold. A population-wide numeric reference interval is not
    asserted because upper limits are assay- and population-dependent.
  specificity: Low for AOSD when used alone
  evidence:
  - reference: DOI:10.3390/jcm10040733
    reference_title: "Adult-Onset Still’s Disease: Clinical Aspects and Therapeutic Approach"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Adult-onset Still’s disease (AoSD) is a rare systemic autoinflammatory disease characterized by arthritis, spiking fever, skin rash and elevated ferritin levels."
    explanation: >-
      Elevated ferritin is identified as a characteristic laboratory feature of
      AOSD.
  - reference: PMID:27843366
    reference_title: "Adult-onset Still's disease: current challenges and future prospects."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Moreover, although markedly elevated ferritin levels are seen in 70% of those with AOSD, high ferritin levels are also a common feature of malignancy and infection."
    explanation: >-
      Ferritin elevation is common but not specific for AOSD.
  readouts:
  - target: Pro-inflammatory Cytokine Amplification
    relationship: CORRELATES_WITH
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      Higher ferritin tracks the pro-inflammatory cytokine axis in AOSD, but it
      remains nonspecific and must be interpreted in the appropriate clinical and
      exclusion context.
    evidence:
    - reference: PMID:38441807
      reference_title: "Adult-Onset Still's Disease (AOSD): Advances in Understanding Pathophysiology, Genetics and Emerging Treatment Options."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Ferritin levels usually correlate with the increase of IL-1β, IL-18, TNF-α and IFN-γ"
      explanation: >-
        Directly supports a positive association between ferritin and the
        cytokine-amplification axis.
- name: Low Glycosylated Ferritin
  notes: >-
    The glycosylated fraction of serum ferritin is reduced in AOSD cohorts and
    can support classification, but its performance is imperfect and it is not a
    stand-alone diagnostic test.
  evidence:
  - reference: PMID:36078942
    reference_title: "Evaluation of Glycosylated Ferritin in Adult-Onset Still's Disease and Differential Diagnoses."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Compared to controls, the mean GF was significantly lower (22.3% vs. 39.3, p < 0.001) in AOSD patients."
    explanation: >-
      The mean glycosylated ferritin is significantly lower in AOSD patients than
      controls.
  readouts:
  - target: Macrophage Activation Syndrome
    relationship: CORRELATES_WITH
    direction: NEGATIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      Very low glycosylated ferritin is associated with MAS. This readout is
      distinct from the separate 16% threshold used to support AOSD
      classification in the studied differential-diagnosis population.
    evidence:
    - reference: PMID:38441807
      reference_title: "Adult-Onset Still's Disease (AOSD): Advances in Understanding Pathophysiology, Genetics and Emerging Treatment Options."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "its decrease is exacerbated in MAS, where GF levels are usually very low."
      explanation: >-
        Supports the negative association between glycosylated-ferritin fraction
        and MAS severity without conflating it with the AOSD classification
        threshold.
  reference_ranges:
  - unit: "%"
    population: adults
    notes: >-
      Glycosylated ferritin expressed as a percentage of total serum ferritin.
    evidence:
    - reference: PMID:36078942
      reference_title: "Evaluation of Glycosylated Ferritin in Adult-Onset Still's Disease and Differential Diagnoses."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The GF optimal cut-off value for AOSD diagnosis was 16%, yielding a specificity of 89% and a sensitivity of 63%."
      explanation: >-
        Establishes a glycosylated ferritin cut-off of 16% for AOSD diagnosis.
    interpretation_bands:
    - name: At or above the study diagnostic threshold
      lower_bound: 16
      unit: "%"
      interpretation: >-
        Values at or above 16% fall outside the study's below-threshold band;
        this is not asserted to be a universal normal reference interval.
    - name: Below the study diagnostic threshold
      upper_bound: 16
      unit: "%"
      abnormal_flag: LOW
      interpretation: >-
        Values below 16% fall within the study's AOSD-associated band (89%
        specificity, 63% sensitivity); the half-open boundary avoids claiming
        whether an exact value of 16% was treated as inclusive.


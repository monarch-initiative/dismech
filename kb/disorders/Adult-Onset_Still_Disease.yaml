- name: Emapalumab for Macrophage Activation Syndrome
  description: Emapalumab is a human monoclonal antibody that neutralizes interferon-gamma. It was
    studied, with background glucocorticoids, in a prospective single-arm trial of 14 patients with
    MAS secondary to systemic JIA or AOSD who had failed high-dose glucocorticoids; 13 reached MAS
    remission by week 8. The regimen was an intravenous loading dose of 6 mg/kg, then 3 mg/kg every
    3 days until day 15 and twice weekly until day 28. It treats the MAS complication and is not a
    treatment for uncomplicated AOSD. Viral infections, cytomegalovirus in particular, were the safety
    signal.
  action_category: THERAPEUTIC
  therapeutic_modality: MONOCLONAL_ANTIBODY

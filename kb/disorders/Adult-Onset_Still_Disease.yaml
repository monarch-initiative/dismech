progression:
- phase: Alternative clinical courses
  notes: >-
    AOSD does not follow one obligatory sequence. Reported courses include a
    single systemic episode, recurrent systemic episodes, and persistent
    articular disease.
  evidence:
  - reference: PMID:27843366
    reference_title: "Adult-onset Still's disease: current challenges and future prospects."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Traditionally, three patterns of AOSD manifest after initial diagnosis – systemic monocyclic, intermittent/polycyclic, and chronic articular."
    explanation: >-
      This review distinguishes the three commonly described alternative AOSD
      courses without implying that they are sequential phases.
pathophysiology:
- name: Neutrophil Activation and NLRP3 Inflammasome
  biological_scale: CELLULAR
  conforms_to: "nlrp3_inflammasome_activation#NLRP3 Inflammasome Assembly and Caspase-1 Activation"
  description: >
    Neutrophil activation is a fundamental early innate-immune event in AOSD.
    Activated neutrophils release granular enzymes and neutrophil extracellular
    traps (NETs) that activate macrophages and, through NLRP3 inflammasome
    assembly and caspase-1, drive IL-1beta and IL-18 production, feeding the
    macrophage-centered cytokine cascade.
  cell_types:

    explanation: Orphanet frequency class for pleuritis in AOSD.
biochemical:
- name: Hyperferritinemia
  biomarker_term:
    preferred_term: ferritin
    term:
      id: NCIT:C16577
      label: Ferritin
  loinc_term:
    id: LOINC:2276-4
    label: Ferritin [Mass/volume] in Serum or Plasma
  notes: >-
    Markedly elevated serum ferritin is common in active AOSD, but it is a
    nonspecific classification-supporting finding rather than a stand-alone
    diagnostic threshold. A population-wide numeric reference interval is not
    asserted because upper limits are assay- and population-dependent.
  specificity: Low for AOSD when used alone
  evidence:
  - reference: DOI:10.3390/jcm10040733
    reference_title: "Adult-Onset Still’s Disease: Clinical Aspects and Therapeutic Approach"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Adult-onset Still’s disease (AoSD) is a rare systemic autoinflammatory disease characterized by arthritis, spiking fever, skin rash and elevated ferritin levels."
    explanation: >-
      Elevated ferritin is identified as a characteristic laboratory feature of
      AOSD.
  - reference: PMID:27843366
    reference_title: "Adult-onset Still's disease: current challenges and future prospects."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Moreover, although markedly elevated ferritin levels are seen in 70% of those with AOSD, high ferritin levels are also a common feature of malignancy and infection."
    explanation: >-
      Ferritin elevation is common but not specific for AOSD.
  readouts:
  - target: Pro-inflammatory Cytokine Amplification
    relationship: CORRELATES_WITH
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      Higher ferritin tracks the pro-inflammatory cytokine axis in AOSD, but it
      remains nonspecific and must be interpreted in the appropriate clinical and
      exclusion context.
    evidence:
    - reference: PMID:38441807
      reference_title: "Adult-Onset Still's Disease (AOSD): Advances in Understanding Pathophysiology, Genetics and Emerging Treatment Options."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Ferritin levels usually correlate with the increase of IL-1β, IL-18, TNF-α and IFN-γ"
      explanation: >-
        Directly supports a positive association between ferritin and the
        cytokine-amplification axis.
- name: Low Glycosylated Ferritin
  notes: >-
    The glycosylated fraction of serum ferritin is reduced in AOSD cohorts and
    can support classification, but its performance is imperfect and it is not a
    stand-alone diagnostic test.
  evidence:
  - reference: PMID:36078942
    reference_title: "Evaluation of Glycosylated Ferritin in Adult-Onset Still's Disease and Differential Diagnoses."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Compared to controls, the mean GF was significantly lower (22.3% vs. 39.3, p < 0.001) in AOSD patients."
    explanation: >-
      The mean glycosylated ferritin is significantly lower in AOSD patients than
      controls.
  readouts:
  - target: Macrophage Activation Syndrome
    relationship: CORRELATES_WITH
    direction: NEGATIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      Very low glycosylated ferritin is associated with MAS. This readout is
      distinct from the separate 16% threshold used to support AOSD
      classification in the studied differential-diagnosis population.
    evidence:
    - reference: PMID:38441807
      reference_title: "Adult-Onset Still's Disease (AOSD): Advances in Understanding Pathophysiology, Genetics and Emerging Treatment Options."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "its decrease is exacerbated in MAS, where GF levels are usually very low."
      explanation: >-
        Supports the negative association between glycosylated-ferritin fraction
        and MAS severity without conflating it with the AOSD classification
        threshold.
  reference_ranges:
  - unit: "%"
    population: adults
    notes: >-
      Glycosylated ferritin expressed as a percentage of total serum ferritin.
    evidence:
    - reference: PMID:36078942
      reference_title: "Evaluation of Glycosylated Ferritin in Adult-Onset Still's Disease and Differential Diagnoses."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The GF optimal cut-off value for AOSD diagnosis was 16%, yielding a specificity of 89% and a sensitivity of 63%."
      explanation: >-
        Establishes a glycosylated ferritin cut-off of 16% for AOSD diagnosis.
    interpretation_bands:
    - name: At or above the study diagnostic threshold
      lower_bound: 16
      unit: "%"
      interpretation: >-
        Values at or above 16% fall outside the study's below-threshold band;
        this is not asserted to be a universal normal reference interval.
    - name: Below the study diagnostic threshold
      upper_bound: 16
      unit: "%"
      abnormal_flag: LOW
      interpretation: >-
        Values below 16% fall within the study's AOSD-associated band (89%
        specificity, 63% sensitivity); the half-open boundary avoids claiming
        whether an exact value of 16% was treated as inclusive.
- name: Serum Interleukin-18
  biomarker_term:
    preferred_term: interleukin-18
    term:
      id: NCIT:C20520
      label: Interleukin-18
  notes: Total and free serum IL-18 are far higher in Still disease than in other inflammatory and
    autoinflammatory conditions. Reported diagnostic cut-offs differ by an order of magnitude between
    assays and comparator populations (366.1 pg/mL against rheumatoid arthritis and healthy controls;
    18,550 pg/mL against other adult secondary HLH), so no single threshold is recorded as a reference
    range. The assay is not standardized and is not part of routine laboratory panels.
  evidence:
  - reference: PMID:40341183
    reference_title: 'Elevated serum levels of interleukin-18 discriminate Still''s disease from other
      autoinflammatory conditions: results from the European ImmunAID cohort.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Receiver operating characteristic curve analysis showed that total IL-18 was the most
      sensitive and specific marker for the diagnosis of Still's disease (area under the curve=0.91).
    explanation: Diagnostic performance of total IL-18 in the European ImmunAID cohort.
  - reference: PMID:34691064
    reference_title: Usefulness of Interleukin-18 as a Diagnostic Biomarker to Differentiate Adult-Onset
      Still's Disease With/Without Macrophage Activation Syndrome From Other Secondary Hemophagocytic
      Lymphohistiocytosis in Adults.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In the differential diagnosis of both groups, the area under the curve obtained from
      the ROC curve of IL-18 with a cutoff value of 18,550 pg/mL was 0.91 (95% confidence interval
      0.83-1.00; sensitivity 90.3%, specificity 93.5%), and the differential diagnosis ability of
      IL-18 was superior to that of other laboratory data.
    explanation: IL-18 separates AOSD (with or without MAS) from other adult secondary HLH.
  - reference: PMID:22660800
    reference_title: Serum S100A8/A9, but not follistatin-like protein 1 and interleukin 18, may be
      a useful biomarker of disease activity in adult-onset Still's disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The sensitivity and specificity of IL-18 for diagnosing AOSD was highest with a cutoff
      value of 366.1 pg/ml.
    explanation: A much lower cut-off against rheumatoid arthritis and healthy controls, showing that
      thresholds are comparator-dependent.
  readouts:
  - target: Free IL-18 Excess
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: Serum IL-18 is the direct measurement of this node and discriminates Still disease
      from other autoinflammatory diseases.
    evidence:
    - reference: PMID:40341183
      reference_title: 'Elevated serum levels of interleukin-18 discriminate Still''s disease from
        other autoinflammatory conditions: results from the European ImmunAID cohort.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Serum levels of total and free IL-18 were significantly increased in Still's disease
        in comparison to most SAID and non-inflammatory controls.
      explanation: Cohort comparison supporting the diagnostic use.
  - target: Free IL-18 Excess
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: MONITORING
    interpretation: Free IL-18 tracks disease activity and falls with effective treatment; based on
      small paired samples.
    evidence:
    - reference: PMID:27616144
      reference_title: Elevated serum levels of free interleukin-18 in adult-onset Still's disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Free IL-18 serum levels correlated with AOSD activity.
      explanation: Correlation of free IL-18 with disease activity in 37 patients.
    - reference: PMID:40341183
      reference_title: 'Elevated serum levels of interleukin-18 discriminate Still''s disease from
        other autoinflammatory conditions: results from the European ImmunAID cohort.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: In 10 patients with Still's disease who had a second blood collection, we found a significant
        decrease in serum levels of free IL-18 after treatment.
      explanation: Paired samples from ten patients before and after treatment.
- name: Serum S100A8/A9 (Calprotectin)
  biomarker_term:
    preferred_term: calprotectin (S100A8/A9)
    term:
      id: NCIT:C105971
      label: Calprotectin
  notes: S100A8/A9 is a disease-activity marker and is not specific to AOSD. It is not in routine
    clinical use for this indication.
  evidence:
  - reference: PMID:22660800
    reference_title: Serum S100A8/A9, but not follistatin-like protein 1 and interleukin 18, may be
      a useful biomarker of disease activity in adult-onset Still's disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Serum levels of S100A8/A9 (11.77 ± 8.84 μg/ml) in AOSD patients were higher than those
      in RA patients (3.53 ± 3.43 μg/ml; p < 0.001) and controls (2.49 ± 1.83 μg/ml; p < 0.001).
    explanation: Case-control comparison in 36 AOSD patients, 40 rheumatoid arthritis patients and
      33 controls.
  readouts:
  - target: Systemic Hyperinflammation and Multiorgan Involvement
    relationship: CORRELATES_WITH
    direction: POSITIVE
    endpoint_context: MONITORING
    interpretation: S100A8/A9 rises and falls with the systemic disease score and the other inflammatory
      markers.
    evidence:
    - reference: PMID:22660800
      reference_title: Serum S100A8/A9, but not follistatin-like protein 1 and interleukin 18, may
        be a useful biomarker of disease activity in adult-onset Still's disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: S100A8/A9 was decreased after disease activity was resolved in followup of AOSD patients
        (9.96 ± 7.35 μg/ml in active AOSD vs 3.6 ± 4.77 μg/ml in resolved cases; p = 0.001).
      explanation: Follow-up samples from 16 patients after resolution of disease activity.
    - reference: PMID:22660800
      reference_title: Serum S100A8/A9, but not follistatin-like protein 1 and interleukin 18, may
        be a useful biomarker of disease activity in adult-onset Still's disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Serum S100A8/A9 correlated with leukocyte count, erythrocyte sedimentation rate, C-reactive
        protein, ferritin, and systemic disease score
      explanation: Cross-sectional correlation with the systemic disease score.
- name: Serum CXCL9
  biomarker_term:
    preferred_term: CXCL9
    term:
      id: NCIT:C28468
      label: C-X-C Motif Chemokine 9
  notes: CXCL9 is induced by interferon-gamma and is used as a measure of interferon-gamma activity.
    Its role in AOSD is in recognizing and following macrophage activation syndrome, not in diagnosing
    uncomplicated disease.
  evidence:
  - reference: PMID:39317414
    reference_title: 'Systemic juvenile idiopathic arthritis and adult-onset Still''s disease are
      the same disease: evidence from systematic reviews and meta-analyses informing the 2023 EULAR/PReS
      recommendations for the diagnosis and management of Still''s disease.'
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: For MAS diagnosis, novel biomarkers such as IL-18, C-X-C motif ligand 9, adenosine deaminase
      2 activity and activated T cells seemed promising.
    explanation: Systematic review for the EULAR/PReS recommendations; the authors call the marker
      promising, not validated.
  readouts:
  - target: Interferon-gamma Signaling
    relationship: PHARMACODYNAMIC_MARKER_OF
    direction: POSITIVE
    endpoint_context: PHARMACODYNAMIC
    interpretation: Serum CXCL9 falls promptly when interferon-gamma is neutralized, and was the pharmacodynamic
      measure used to confirm the emapalumab dose.
    evidence:
    - reference: PMID:37001971
      reference_title: Efficacy and safety of emapalumab in macrophage activation syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: rapid neutralisation of IFNγ activity, demonstrated by a prompt decrease in serum C-X-C
        motif chemokine ligand 9 (CXCL9) levels
      explanation: Pharmacodynamic result of the emapalumab MAS trial.
    - reference: PMID:39943917
      reference_title: 'Emapalumab in Patients With Macrophage Activation Syndrome Associated With
        Still''s Disease: A Population Pharmacokinetic/Pharmacodynamic Analysis.'
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: 'Emapalumab almost completely suppressed CXCL9, sIL2-Rα, and ferritin production (estimated
        reduction in synthesis rate: 98.3%, 87%, and 99.6%, respectively).'
      explanation: Population pharmacokinetic/pharmacodynamic model fitted to the 14 trial patients.
treatments:
- name: NSAID Therapy
  description: Non-steroidal anti-inflammatory drugs are a traditional symptomatic option used particularly
    early, before the diagnosis is established. Evidence for NSAID monotherapy is insufficient, so
    they are generally adjunctive to glucocorticoids.
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: non-steroidal anti-inflammatory drug
      term:
        id: NCIT:C257
        label: Nonsteroidal Antiinflammatory Drug
  evidence:
  - reference: PMID:38441807
    reference_title: 'Adult-Onset Still''s Disease (AOSD): Advances in Understanding Pathophysiology,
      Genetics and Emerging Treatment Options.'
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: NSAIDs can be employed when the diagnosis is still not clear
    explanation: NSAIDs are used symptomatically, particularly early when the diagnosis is not yet
      established.
  - reference: PMID:38441807
    reference_title: 'Adult-Onset Still''s Disease (AOSD): Advances in Understanding Pathophysiology,
      Genetics and Emerging Treatment Options.'
    supports: NO_EVIDENCE
    evidence_source: OTHER
    snippet: there are no clinical trials or longitudinal studies exhibiting data on the efficacy
      of NSAIDs alone.
    explanation: The review explicitly identifies the absence of monotherapy efficacy data; NSAIDs
      should not be represented as an evidence-established disease-controlling monotherapy.
- name: Glucocorticoid Therapy
  description: Systemic glucocorticoids are the long-standing first-line treatment for the systemic
    manifestations and are given at high dose for macrophage activation syndrome. The 2024 EULAR/PReS
    recommendations keep them but limit them to a short course alongside early IL-1 or IL-6 inhibition,
    because of toxicity at high dose and long duration. They act broadly on inflammatory gene expression
    and are not specific to one cytokine arm.
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: glucocorticoid
      term:
        id: CHEBI:24261
        label: glucocorticoid
  target_mechanisms:
  - target: Systemic Hyperinflammation and Multiorgan Involvement
    treatment_effect: INHIBITS
    description: Glucocorticoids suppress the systemic inflammatory state as a whole, without selectivity
      for one cytokine.
    evidence:
    - reference: PMID:38441807
      reference_title: 'Adult-Onset Still''s Disease (AOSD): Advances in Understanding Pathophysiology,
        Genetics and Emerging Treatment Options.'
      supports: SUPPORT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: OTHER
      snippet: Historically, glucocorticoids have been employed for treating systemic manifestations
        of Still's disease
      explanation: Review statement that glucocorticoids are used against the systemic manifestations.
  - target: Macrophage Activation Syndrome
    treatment_effect: INHIBITS
    description: High-dose glucocorticoids are the backbone of MAS treatment.
    evidence:
    - reference: PMID:39317417
      reference_title: EULAR/PReS recommendations for the diagnosis and management of Still's disease,
        comprising systemic juvenile idiopathic arthritis and adult-onset Still's disease.
      supports: SUPPORT
      quote_role: PRIMARY_RESULT
      evidence_source: OTHER
      snippet: MAS treatment should rely on high-dose GCs, IL-1 inhibitors, ciclosporin and interferon-γ
        inhibitors.
      explanation: EULAR/PReS consensus recommendation.
  evidence:
  - reference: PMID:25382730
    reference_title: Nationwide epidemiological survey of 169 patients with adult Still's disease
      in Japan.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Oral glucocorticoids were used to treat 96% of the patients, while methotrexate was used
      in 41% and biological agents were used in 16%.
    explanation: Nationwide Japanese survey showing how widely glucocorticoids are used.
  - reference: PMID:39317415
    reference_title: 'Efficacy and safety of therapies for Still''s disease and macrophage activation
      syndrome (MAS): a systematic review informing the EULAR/PReS guidelines for the management of
      Still''s disease.'
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: OTHER
    snippet: GCs have been used as anchor therapy for decades, with major safety concerns when employed
      at high doses and for long periods.
    explanation: 'Systematic review background: anchor therapy with a recognized toxicity cost.'
  - reference: PMID:39317417
    reference_title: EULAR/PReS recommendations for the diagnosis and management of Still's disease,
      comprising systemic juvenile idiopathic arthritis and adult-onset Still's disease.
    supports: SUPPORT
    quote_role: PRIMARY_RESULT
    evidence_source: OTHER
    snippet: The optimal therapeutic strategy relies on early use of interleukin (IL-1 or IL-6 inhibitors
      associated to short duration glucocorticoid (GC).
    explanation: The current consensus restricts glucocorticoids to a short course beside an early
      biologic.
- name: Anakinra (IL-1 Receptor Antagonist)
  description: Anakinra is a recombinant, non-glycosylated human interleukin-1 receptor antagonist
    that blocks both IL-1alpha and IL-1beta at the receptor. Adult evidence comes from one small open
    randomized trial against conventional DMARDs in glucocorticoid-dependent disease, many observational
    series, and a network meta-analysis of Still disease trials that pools children and adults. A
    placebo-controlled phase 3 trial in newly diagnosed Still disease (NCT03265132) was terminated
    early for slow enrolment.
  action_category: THERAPEUTIC
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: anakinra
      term:
        id: NCIT:C38717
        label: Anakinra
  target_mechanisms:
  - target: IL-1 Receptor Signaling
    treatment_effect: INHIBITS
    description: Anakinra occupies the IL-1 receptor and so blocks signaling by both IL-1alpha and
      IL-1beta.
    evidence:
    - reference: PMID:38441807
      reference_title: 'Adult-Onset Still''s Disease (AOSD): Advances in Understanding Pathophysiology,
        Genetics and Emerging Treatment Options.'
      supports: SUPPORT
      quote_role: BACKGROUND
      evidence_source: OTHER
      snippet: ANK is a non-glycosylated form of the human receptor antagonist (IL-Ra); ANK therefore
        targets both IL-1α and IL-1β
      explanation: The review states the molecular mechanism.
  evidence:
  - reference: PMID:22859346
    reference_title: Beneficial effect of interleukin 1 inhibition with anakinra in adult-onset Still's
      disease. An open, randomized, multicenter study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: At 8 and 24 weeks, 7/12 and 6/12 receiving anakinra and 5/10 and 2/10 receiving DMARD
      achieved remission.
    explanation: Open randomized trial in 22 patients with glucocorticoid-dependent AOSD; small, unblinded,
      and not powered for a formal comparison.
  - reference: PMID:38775654
    reference_title: 'Efficacy and safety of biologic drugs in Still''s disease: a systematic review
      and network meta-analysis of randomized controlled trials.'
    supports: SUPPORT
    quote_role: PRIMARY_RESULT
    evidence_source: OTHER
    snippet: As per SUCRA rankings, anakinra was the most effective and safe option with respect to
      ACR50 response and occurrence of serious adverse events.
    explanation: Network meta-analysis of nine Still disease trials (430 patients, children and adults);
      the same analysis found no statistically significant difference between biologics.
  - reference: PMID:38441807
    reference_title: 'Adult-Onset Still''s Disease (AOSD): Advances in Understanding Pathophysiology,
      Genetics and Emerging Treatment Options.'
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: IL-1 inhibitors such as anakinra and canakinumab have proven to have high efficacy and
      an excellent safety profile
    explanation: The review synthesizes efficacy and safety evidence for IL-1 inhibition in Still
      disease; it is not interpreted as proof of universal response.
- name: Canakinumab (Anti-IL-1beta Monoclonal Antibody)
  description: Canakinumab is a human monoclonal antibody against interleukin-1-beta. The adult trial
    (CONSIDER, phase 2, placebo-controlled, patients with active joint involvement) was stopped early
    when the drug received marketing authorization and did not meet its primary endpoint; secondary
    ACR response rates favoured canakinumab in the per-protocol analysis. The trial dose was 4 mg/kg
    (maximum 300 mg) subcutaneously every 4 weeks.
  action_category: THERAPEUTIC
  therapeutic_modality: MONOCLONAL_ANTIBODY
  dosing_interval: every 4 weeks
  dosing_interval_days: 28
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: canakinumab
      term:
        id: NCIT:C80971
        label: Canakinumab
  target_mechanisms:
  - target: IL-1 Receptor Signaling
    treatment_effect: INHIBITS
    description: Canakinumab binds IL-1beta and prevents it from engaging the IL-1 receptor; IL-1alpha
      is not neutralized.
    evidence:
    - reference: PMID:38441807
      reference_title: 'Adult-Onset Still''s Disease (AOSD): Advances in Understanding Pathophysiology,
        Genetics and Emerging Treatment Options.'
      supports: SUPPORT
      quote_role: BACKGROUND
      evidence_source: OTHER
      snippet: IL-1 inhibitors include anakinra (ANK), canakinumab (CAM) and rilonacept (RIL).
      explanation: The review classifies canakinumab as an IL-1 inhibitor.
  evidence:
  - reference: PMID:32404342
    reference_title: 'Canakinumab for Treatment of Adult-Onset Still''s Disease to Achieve Reduction
      of Arthritic Manifestation (CONSIDER): phase II, randomised, double-blind, placebo-controlled,
      multicentre, investigator-initiated trial.'
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: In the intention-to-treat analysis, 12 patients (67%) in the canakinumab group and 7
      patients (41%) in the placebo group fulfilled the primary outcome criterion (p=0.18).
    explanation: 'Primary endpoint of the CONSIDER trial, not met: the response was numerically higher but not
      statistically significant, in a trial stopped early with 35 patients. Graded against the efficacy
      claim; it weakens it without excluding a benefit.'
  - reference: PMID:32404342
    reference_title: 'Canakinumab for Treatment of Adult-Onset Still''s Disease to Achieve Reduction
      of Arthritic Manifestation (CONSIDER): phase II, randomised, double-blind, placebo-controlled,
      multicentre, investigator-initiated trial.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Although the study was terminated prematurely and the primary endpoint was not achieved,
      treatment with canakinumab led to an improvement of several outcome measures in AOSD.
    explanation: The authors' own qualified conclusion, quoted with its caveat.
  - reference: PMID:32404342
    reference_title: 'Canakinumab for Treatment of Adult-Onset Still''s Disease to Achieve Reduction
      of Arthritic Manifestation (CONSIDER): phase II, randomised, double-blind, placebo-controlled,
      multicentre, investigator-initiated trial.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Patients with AOSD and active joint involvement (tender and swollen joint counts of ≥4
      each) were treated with canakinumab (4 mg/kg, maximum 300 mg subcutaneous every 4 weeks) or
      placebo.
    explanation: Source for the trial dose and the 4-week dosing interval.
  - reference: PMID:38441807
    reference_title: 'Adult-Onset Still''s Disease (AOSD): Advances in Understanding Pathophysiology,
      Genetics and Emerging Treatment Options.'
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: IL-1 inhibitors such as anakinra and canakinumab have proven to have high efficacy and
      an excellent safety profile
    explanation: This review-level synthesis supports efficacy of IL-1 inhibitors while the description
      preserves the smaller adult-specific evidence base.
- name: Rilonacept (IL-1 Trap)
  description: Rilonacept is a soluble decoy-receptor fusion protein that binds IL-1. Adult data are
    limited to a few refractory cases with predominantly articular disease, treated at 160 mg weekly;
    the controlled evidence is in systemic JIA.
  action_category: THERAPEUTIC
  therapeutic_modality: MONOCLONAL_ANTIBODY
  dosing_interval: once weekly
  dosing_interval_days: 7
  notes: Rilonacept is a receptor-Fc fusion protein, not an antibody. The modality is recorded as
    MONOCLONAL_ANTIBODY because the enum defines that value to include antibody-derived biologics, the
    same reading applied to etanercept under TNF Inhibitor Therapy.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: rilonacept
      term:
        id: NCIT:C84137
        label: Rilonacept
  target_mechanisms:
  - target: IL-1 Receptor Signaling
    treatment_effect: INHIBITS
    description: Rilonacept traps IL-1 before it reaches the cell-surface receptor.
    evidence:
    - reference: PMID:38441807
      reference_title: 'Adult-Onset Still''s Disease (AOSD): Advances in Understanding Pathophysiology,
        Genetics and Emerging Treatment Options.'
      supports: SUPPORT
      quote_role: BACKGROUND
      evidence_source: OTHER
      snippet: IL-1 inhibitors include anakinra (ANK), canakinumab (CAM) and rilonacept (RIL).
      explanation: The review classifies rilonacept as an IL-1 inhibitor.
  evidence:
  - reference: PMID:38441807
    reference_title: 'Adult-Onset Still''s Disease (AOSD): Advances in Understanding Pathophysiology,

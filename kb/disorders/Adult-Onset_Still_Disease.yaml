- name: Neutrophil Extracellular Trap Release
  biological_scale: CELLULAR
  description: Circulating neutrophils from patients with AOSD release neutrophil extracellular traps
    (NETs) spontaneously and at increased levels. NET DNA, enriched in mitochondrial DNA, is the material
    that carries the signal from the neutrophil compartment to monocytes and macrophages. In a mouse
    model, ferritin itself induces NET formation through the scavenger receptor Msr1, which suggests
    a feed-forward loop between hyperferritinemia and NET release; that loop is recorded here as model-organism
    evidence and is not drawn as an edge.
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  biological_processes:
  - preferred_term: Neutrophil extracellular trap formation
    term:
      id: GO:0140645
      label: neutrophil extracellular trap formation
    modifier: INCREASED
  evidence:
  - reference: PMID:30616678
    reference_title: Increased neutrophil extracellular traps activate NLRP3 and inflammatory macrophages
      in adult-onset Still's disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The levels of cell-free DNA and NET-DNA complexes were significantly increased in the
      circulation of patients with AOSD compared with healthy controls, and freshly isolated neutrophils
      from patients with AOSD were predisposed to high levels of spontaneous NET release.
    explanation: Serum from 73 patients and ex vivo neutrophils show increased NET release in AOSD.
  - reference: PMID:36357401
    reference_title: Ferritin triggers neutrophil extracellular trap-mediated cytokine storm through
      Msr1 contributing to adult-onset Still's disease pathogenesis.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: ferritin administration leads to systemic and hepatic inflammation characterized by excessive
      neutrophil leukocyte infiltration and neutrophil extracellular trap (NET) formation in the liver
      tissue
    explanation: Mouse experiment showing that ferritin can itself induce NET formation; cited for
      the proposed ferritin-NET loop, which is not asserted as a human causal edge.
  downstream:
  - target: Macrophage Activation
    causal_link_type: DIRECT
    description: DNA purified from AOSD NETs activates pro-inflammatory macrophages and raises their
      IL-1beta, IL-6 and TNF-alpha expression.
    evidence:
    - reference: PMID:30616678
      reference_title: Increased neutrophil extracellular traps activate NLRP3 and inflammatory macrophages
        in adult-onset Still's disease.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: NET DNA from AOSD also exerted a potent capacity to accelerate the activation of CD68+CD86+
        macrophages and increased the expression of interleukin (IL)-1β, IL-6, and tumor necrosis
        factor (TNF)-α.
      explanation: Cell-culture experiment with NET DNA purified from patient neutrophils.
  - target: Macrophage Activation Syndrome
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: NETs from AOSD patients expand CD14-bright CD16-positive intermediate monocytes and
      activate their inflammasome pathway; the frequency of these monocytes is higher in patients
      with macrophage activation syndrome.
    evidence:
    - reference: PMID:38124139
      reference_title: Neutrophil extracellular trap-induced intermediate monocytes trigger macrophage
        activation syndrome in adult-onset Still's disease.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Stimulation with NETs derived from AOSD induced DNA sensor expression, the expansion
        of IMs, and inflammasome pathway activation.
      explanation: In vitro stimulation of monocytes with patient-derived NETs.
    - reference: PMID:38124139
      reference_title: Neutrophil extracellular trap-induced intermediate monocytes trigger macrophage
        activation syndrome in adult-onset Still's disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: The frequencies of IMs were correlated with disease activity and higher in AOSD patients
        with MAS (AOSD-MAS).
      explanation: Patient flow-cytometry data linking intermediate monocytes to MAS; an association,
        so the edge is typed as indirect.
- name: IL-1 Receptor Signaling
  biological_scale: MOLECULAR
  description: 'Interleukin-1 (IL-1beta and IL-1alpha) acting on the type 1 IL-1 receptor is one arm
    of the cytokine output. It is the arm intercepted by anakinra (receptor antagonist), canakinumab
    (anti-IL-1beta antibody) and rilonacept (IL-1 trap). The main evidence that it is disease-driving
    in AOSD is therapeutic: blocking it induces remission in most treated patients.'

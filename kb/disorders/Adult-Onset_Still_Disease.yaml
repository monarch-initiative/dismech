    reference_title: "Adult-Onset Still's Disease (AOSD): Advances in Understanding Pathophysiology, Genetics and Emerging Treatment Options."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "neutrophils are responsible for the initiation and development of inflammation through the release of a wide variety of granular enzymes and antimicrobial proteins"
    explanation: >-
      Neutrophil activation is identified as a fundamental initiating event in
      AOSD inflammation.
  - reference: PMID:30616678
    reference_title: Increased neutrophil extracellular traps activate NLRP3 and inflammatory macrophages
      in adult-onset Still's disease.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Furthermore, DNA purified from AOSD NETs activated NLRP3 inflammasomes.
    explanation: Primary cell-culture evidence (THP-1 cells) that patient NET DNA activates the NLRP3
      inflammasome.

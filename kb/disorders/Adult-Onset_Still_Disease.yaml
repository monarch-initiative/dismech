- name: Free IL-18 Excess
  biological_scale: MOLECULAR
  description: Interleukin-18 is normally held inactive by IL-18 binding protein (IL-18BP). In AOSD
    total IL-18 is very high and exceeds the binding capacity, so biologically active free IL-18 circulates.
    Free IL-18 is selectively raised in Still disease among autoinflammatory conditions and falls
    with treatment. This is the arm intercepted by tadekinig alfa, a recombinant IL-18BP.

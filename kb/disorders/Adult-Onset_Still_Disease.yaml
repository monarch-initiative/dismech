- name: Methotrexate and Conventional Synthetic DMARDs
  description: Methotrexate is the most used conventional synthetic DMARD, given as a glucocorticoid-sparing
    agent, mainly for joint-predominant disease. The supporting data are retrospective series and
    a registry; there is no randomized trial. The systematic review behind the 2024 EULAR/PReS recommendations
    judged the efficacy of methotrexate, ciclosporin and TNF inhibitors marginal next to IL-1 and
    IL-6 inhibitors. How methotrexate acts in Still disease is not established, so the link below
    is to the joint manifestation it is used for and not to a mechanism node.

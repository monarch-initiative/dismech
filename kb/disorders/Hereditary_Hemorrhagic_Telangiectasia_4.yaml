name: Hereditary Hemorrhagic Telangiectasia Type 4
creation_date: '2026-08-18T00:00:00Z'
synonyms:
- HHT4
- telangiectasia, hereditary hemorrhagic, type 4
- hereditary hemorrhagic telangiectasia type 4
description: >-
  Hereditary hemorrhagic telangiectasia type 4 (HHT4) is a locus-defined member
  of the HHT numbered series with no established causal gene. It was delineated
  in a single family with classic multisystem HHT features - but a milder
  epistaxis and telangiectasia phenotype than typical HHT - in which linkage to
  the HHT1 (ENG), HHT2 (ACVRL1) and HHT3 (chromosome 5) loci had been excluded.
  Whole-genome linkage analysis and fine mapping placed the disease interval in
  a 7 Mb region on the short arm of chromosome 7 (7p14), between the
  microsatellite markers D7S2252 and D7S510, with a maximum two-point LOD score
  of 3.60 at D7S817 and confirmation by haplotype analysis. MONDO
  (MONDO:0012532) and OMIM (610655) therefore define this entity by chromosomal
  region rather than by gene, and the molecular lesion within 7p14 remains
  unidentified. Because no gene has been found, HHT4 cannot be diagnosed
  molecularly: it is recognised clinically, by the Curacao criteria, in a family
  in which the known HHT genes have been excluded. This entry is curated
  deliberately narrowly - it records what the anchoring linkage study reports
  about this family, and does not import ENG/ACVRL1/SMAD4/GDF2 mechanism as
  though it had been demonstrated for HHT4.
category: Mendelian
disease_term:
  preferred_term: hereditary hemorrhagic telangiectasia type 4
  term:
    id: MONDO:0012532
    label: hereditary hemorrhagic telangiectasia type 4
parents:
- Hereditary Hemorrhagic Telangiectasia
- Vascular Malformation
- Genetic Disorder
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0012532
      label: hereditary hemorrhagic telangiectasia type 4
    mapping_predicate: skos:exactMatch
    mapping_source: MONDO
    mapping_justification: >-
      Primary MONDO identifier for the HHT4 locus entity (xref OMIM:610655).
      The MONDO record carries no textual definition and no RO:0004003 causal
      gene relationship, consistent with an entity defined by a chromosomal
      region rather than by a gene.
prevalence:
- population: Worldwide published cases
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population prevalence estimate exists for HHT4. The published evidence
    base is a single family reported in 2006; a dated PubMed sweep on 2026-08-18
    (see the Deep research paragraph in `notes`) found no second family mapped
    to 7p14 since, and because no gene has been identified there is no molecular
    test by which unrelated HHT patients could be assigned to this locus. The
    approximately 1 in 5,000 prevalence quoted for HHT as a whole belongs to the
    parent disease and must not be transferred to this entity.
  evidence:
  - reference: PMID:16969873
    reference_title: A fourth locus for hereditary hemorrhagic telangiectasia maps to chromosome 7.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we report on linkage results on a family with classic features of
      HHT, albeit a less severe phenotype with regards to epistaxis and
      telangiectases, in which linkage to HHT1, HHT2, and HHT3 is ruled out.
    explanation: >-
      Establishes that the entity's published case base is a single family.
inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    HHT4 is catalogued as an autosomal dominant trait (OMIM:610655). The
    assignment rests on the inheritance mode of HHT as a whole and on the
    segregation of a single disease haplotype through the mapped family; the
    anchoring abstract reports linkage and haplotype analysis but does not state
    a segregation model in words, so no HHT4-specific snippet is claimed for the
    mode of inheritance itself.
  evidence:
  - reference: PMID:20301525
    reference_title: Hereditary Hemorrhagic Telangiectasia.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      HHT is inherited in an autosomal dominant manner with considerable
      intrafamilial variability and age-related penetrance of individual
      manifestations.
    explanation: >-
      Supplies the autosomal dominant mode for HHT as a clinical entity. PARTIAL
      because it is a statement about HHT in general, not about the 7p14 family
      specifically.
  - reference: PMID:16969873
    reference_title: A fourth locus for hereditary hemorrhagic telangiectasia maps to chromosome 7.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This region was further confirmed by haplotype analysis.
    explanation: >-
      Documents that a single disease-associated haplotype was tracked through
      the family, which is consistent with (but does not by itself state)
      dominant transmission.
genetic:
- name: HHT4 linkage locus (7p14)
  presence: PRESENT
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    HHT4 is defined by a linkage interval, not by a gene. Whole-genome linkage
    analysis and fine mapping in the index family placed the disease interval in
    a 7 Mb region of 7p14 between markers D7S2252 and D7S510, with a maximum
    two-point LOD score of 3.60 at D7S817. No causal gene or variant within this
    interval has been reported. This block is deliberately curated WITHOUT a
    gene_term. Do not populate a gene here unless a causal gene inside 7p14 is
    established for THIS entity in primary literature and reconciled with the
    MONDO/OMIM record. In particular: ENG (9q34, HHT1), ACVRL1 (12q13, HHT2),
    SMAD4 (18q21, juvenile polyposis/HHT overlap) and GDF2 (10q11, HHT5) are
    genes of OTHER HHT entities and were excluded by linkage or are outside the
    mapped interval; and the HHT3 locus is on chromosome 5, not chromosome 7 -
    see the hht4_not_hht3_chromosome_confusion discussion.
  evidence:
  - reference: PMID:16969873
    reference_title: A fourth locus for hereditary hemorrhagic telangiectasia maps to chromosome 7.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole genome linkage analysis and fine mapping results suggested a 7 Mb
      region on the short arm of chromosome 7 (7p14) between STR markers D7S2252
      and D7S510.
    explanation: >-
      Establishes the locus and its physical boundaries, which is the entire
      genetic basis on which this MONDO/OMIM entity rests.
  - reference: PMID:16969873
    reference_title: A fourth locus for hereditary hemorrhagic telangiectasia maps to chromosome 7.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We obtained a maximum two point LOD score of 3.60 with the STR marker
      D7S817.
    explanation: >-
      Gives the statistical support for the linkage assignment.
  - reference: PMID:16969873
    reference_title: A fourth locus for hereditary hemorrhagic telangiectasia maps to chromosome 7.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we report on linkage results on a family with classic features of
      HHT, albeit a less severe phenotype with regards to epistaxis and
      telangiectases, in which linkage to HHT1, HHT2, and HHT3 is ruled out.
    explanation: >-
      Excludes the previously known HHT loci in this family, which is what makes
      7p14 a distinct entity rather than an allele of HHT1/HHT2/HHT3.
  - reference: PMID:16969873
    reference_title: A fourth locus for hereditary hemorrhagic telangiectasia maps to chromosome 7.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings suggest the presence of another gene causing HHT (HHT4).
    explanation: >-
      The authors name the entity and frame the causal gene as inferred but not
      identified.
pathophysiology:
- name: Unidentified 7p14 Disease Allele
  biological_scale: MOLECULAR
  mechanism_confidence: HYPOTHETICAL
  description: >-
    The proximal lesion is a germline variant segregating with disease within a
    7 Mb interval on the short arm of chromosome 7 (7p14), between D7S2252 and
    D7S510. Neither the gene nor the variant class (coding, regulatory,
    structural) has been identified, so no molecular function, protein complex,
    or biological process can be assigned to this node. It is modelled
    explicitly as an unresolved trigger so that the downstream vascular
    phenotype is not attributed to a fabricated molecular cause - in particular,
    not to the BMP/TGF-beta co-receptor biology established for ENG and ACVRL1,
    which was excluded by linkage in this family.
  evidence:
  - reference: PMID:16969873
    reference_title: A fourth locus for hereditary hemorrhagic telangiectasia maps to chromosome 7.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole genome linkage analysis and fine mapping results suggested a 7 Mb
      region on the short arm of chromosome 7 (7p14) between STR markers D7S2252
      and D7S510.
    explanation: >-
      Defines the physical interval containing the disease allele while leaving
      the gene unspecified.
  - reference: PMID:16969873
    reference_title: A fourth locus for hereditary hemorrhagic telangiectasia maps to chromosome 7.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Further studies of the candidate region and the identification of the gene
      responsible for the vascular anomalies in this family will add to our
      understanding of vascular morphogenesis and related disorders.
    explanation: >-
      The authors state that the responsible gene had not been identified and
      frame its identification as future work.
  downstream:
  - target: Multisystem Vascular Dysplasia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The intermediate steps between the 7p14 allele and the vascular phenotype
      are entirely unknown; the edge records co-segregation of the haplotype
      with an HHT phenotype, not a characterized mechanism.
- name: Multisystem Vascular Dysplasia
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  description: >-
    The family mapping to 7p14 expresses the classic HHT lesion set - a
    hereditary, multisystem vascular dysplasia comprising mucocutaneous
    telangiectases and larger arteriovenous malformations. This node is curated
    at the level of the observed lesion class. Whether the abnormal
    vessels arise through the endothelial BMP/TGF-beta route established for
    ENG- and ACVRL1-related HHT is unknown and is deliberately not asserted
    here: no molecular study of this family or of the 7p14 interval exists, and
    the linkage data exclude the two genes for which that mechanism was worked
    out.
  cell_types:
  - preferred_term: endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  evidence:
  - reference: PMID:16969873
    reference_title: A fourth locus for hereditary hemorrhagic telangiectasia maps to chromosome 7.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The features in this family that strongly suggest the presence of a
      hereditary, multisystem vascular dysplasia would be easily missed during
      the typical evaluation and management of a patient with an AVM.
    explanation: >-
      The authors characterise the family's phenotype as a hereditary
      multisystem vascular dysplasia presenting with arteriovenous malformation.
  - reference: PMID:16969873
    reference_title: A fourth locus for hereditary hemorrhagic telangiectasia maps to chromosome 7.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hereditary hemorrhagic telangiectasia (HHT) is a genetically and
      clinically heterogeneous multisystem vascular dysplasia.
    explanation: >-
      Establishes the lesion class that this family's phenotype belongs to.
      PARTIAL because this is the paper's framing sentence about HHT in
      general, not an observation about the 7p14 family.
  downstream:
  - target: Attenuated Mucocutaneous Bleeding Phenotype
    causal_link_type: DIRECT
    description: >-
      The mucocutaneous component of the dysplasia in this family produced
      nosebleeds and visible telangiectases that were milder and less frequent
      than in typical HHT.
  - target: Arteriovenous Malformation
    causal_link_type: DIRECT
    description: >-
      The large-vessel component of the same dysplasia presents as
      arteriovenous malformation - the lesion that brought this family to
      clinical attention. Routed from the dysplasia node rather than from the
      mucocutaneous node because an AVM is not a mucocutaneous bleeding
      manifestation.
- name: Attenuated Mucocutaneous Bleeding Phenotype
  biological_scale: ORGANISM
  mechanism_confidence: PROVISIONAL
  description: >-
    The clinically distinguishing feature of the 7p14 family is not a different
    lesion type but a lower lesion burden: epistaxis and telangiectases were
    less severe than in typical HHT, to the point that the authors warn the
    diagnosis is easily missed and argue for a targeted family history in
    patients presenting with an AVM and only mild, infrequent nosebleeds and
    subtle telangiectases. Whether this attenuation is a property of the 7p14
    allele or ordinary intrafamilial variability of HHT cannot be decided from a
    single family, and no severity comparison against genotyped HHT1/HHT2
    cohorts has been published.
  evidence:
  - reference: PMID:16969873
    reference_title: A fourth locus for hereditary hemorrhagic telangiectasia maps to chromosome 7.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This family helps emphasize the need to obtain a very detailed, targeted
      medical and family history for even mild, infrequent but recurring
      nosebleed, subtle telangiectases.
    explanation: >-
      Directly documents the attenuated epistaxis and telangiectasia burden that
      characterises this family and the ascertainment problem it creates.
  downstream:
  - target: Recurrent Epistaxis
    causal_link_type: DIRECT
    description: >-
      Bleeding from mucosal telangiectases of the nasal cavity presents as
      recurrent nosebleeds, mild and infrequent in this family.
  - target: Telangiectases
    causal_link_type: DIRECT
    description: >-
      The same mucocutaneous lesions are visible on examination as
      telangiectases, described here as subtle.

  phenotype_term:
    preferred_term: Arteriovenous malformation
    term:
      id: HP:0100026
      label: Arteriovenous malformation
  evidence:
  - reference: PMID:16969873
    reference_title: A fourth locus for hereditary hemorrhagic telangiectasia maps to chromosome 7.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The features in this family that strongly suggest the presence of a
      hereditary, multisystem vascular dysplasia would be easily missed during
      the typical evaluation and management of a patient with an AVM.
    explanation: >-
      Places arteriovenous malformation in this family as the presenting lesion
      around which the hereditary diagnosis was missed.
diagnosis:
- name: Clinical diagnosis by the Curacao criteria
  diagnosis_term:
    preferred_term: Diagnostic Procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  description: >-
    Because HHT4 has no gene, clinical criteria are not one route to diagnosis
    but the only route. A proband is diagnosed on the Curacao criteria -
    recurrent epistaxis, mucocutaneous telangiectases in characteristic sites,
    visceral AVMs, and an affected first-degree relative - and assigned to HHT4
    only by exclusion, in a family in which the known HHT genes have been ruled
    out and linkage points to 7p14. The attenuated phenotype of the index family
    makes this harder than in typical HHT: nosebleeds were mild and infrequent
    and telangiectases subtle, so a criterion-counting evaluation that does not
    actively solicit them can fall short of a definite diagnosis.
  results: >-
    At least three Curacao criteria establish a definite clinical diagnosis of
    HHT. Assignment to HHT4 specifically requires a family in which ENG, ACVRL1
    and SMAD4 have been excluded; there is no confirmatory molecular test.
  evidence:
  - reference: PMID:20301525
    reference_title: Hereditary Hemorrhagic Telangiectasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The clinical diagnosis of HHT can be established in a proband with at
      least three of the following diagnostic criteria: recurrent epistaxis;
      mucocutaneous telangiectases in characteristic locations; visceral AVMs; a
      first-degree relative diagnosed with HHT on the basis of the preceding
      criteria.
    explanation: >-
      States the clinical criteria on which an HHT4 diagnosis necessarily rests.
  - reference: PMID:16969873
    reference_title: A fourth locus for hereditary hemorrhagic telangiectasia maps to chromosome 7.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This family helps emphasize the need to obtain a very detailed, targeted
      medical and family history for even mild, infrequent but recurring
      nosebleed, subtle telangiectases.
    explanation: >-
      Explains why criterion ascertainment must be active in this entity: the
      features that satisfy the criteria are attenuated.
  notes: >-
    The Curacao criteria themselves are parent-disease generic; nothing in them
    is HHT4-specific. What is HHT4-specific is that they cannot be supplemented
    by a molecular test.
- name: Molecular genetic testing (not available for this entity)
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  presence: ABSENT
  description: >-
    Clinical molecular testing for HHT sequences ACVRL1, ENG and SMAD4. A family
    linked to 7p14 is by construction negative on that panel, and no HHT4 gene
    exists to add to it, so a negative HHT gene panel neither confirms nor
    excludes HHT4. The practical consequences are the same ones that follow for
    any gene-unsolved locus entity: at-risk relatives cannot be discharged by a
    negative test and must be evaluated and followed clinically, and
    predictive, prenatal and preimplantation testing are unavailable.
  results: >-
    No pathogenic variant is detectable in ACVRL1, ENG or SMAD4 in an HHT4
    family. There is no assay that reports on the 7p14 locus.
  evidence:
  - reference: PMID:20301525
    reference_title: Hereditary Hemorrhagic Telangiectasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The molecular diagnosis is established by identification of a heterozygous
      pathogenic variant in ACVRL1, ENG, or SMAD4 by molecular genetic testing.
    explanation: >-
      Enumerates the genes on which molecular diagnosis of HHT rests - none of
      which can be the HHT4 gene, since linkage to ENG and ACVRL1 was excluded
      in the 7p14 family and SMAD4 lies outside the mapped interval.
  - reference: PMID:20301525
    reference_title: Hereditary Hemorrhagic Telangiectasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      If the pathogenic variant in the family is not known, at-risk family
      members should be evaluated for signs and symptoms of HHT, and screening
      should be offered to at-risk family members if the diagnosis cannot be
      ruled out.
    explanation: >-
      Gives the fallback pathway that applies to every HHT4 family, since the
      familial variant is unknown by definition in this entity.
  - reference: PMID:31455059
    reference_title: >-
      Current Status of Clinical Diagnosis and Genetic Analysis of Hereditary
      Hemorrhagic Telangiectasia in South Korea: Multicenter Case Series and a
      Systematic Review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Further genetic analyses to detect HHT3, HHT4, and other forms of HHT
      should be implemented.
    explanation: >-
      Independent, later confirmation that HHT4 remains outside routine clinical
      genetic testing - a national multicenter series whose 49 genetically
      tested patients were resolved only as HHT1 (ENG) or HHT2 (ACVRL1), with
      HHT4 named as an unmet testing need rather than an available assay.
discussions:
- discussion_id: hht4_causal_gene_unidentified
  prompt: >-
    Which gene within the 7 Mb 7p14 interval, between D7S2252 and D7S510,
    carries the HHT4 disease allele?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Unidentified 7p14 Disease Allele
  - genetic#HHT4 linkage locus (7p14)
  rationale: >-
    HHT4 is one of two members of the HHT numbered series (with HHT3) that
    remain defined by a chromosomal region rather than a gene. The MONDO record
    for MONDO:0012532 carries no definition text and no RO:0004003 causal-gene
    relationship, and the anchoring linkage study explicitly leaves gene
    identification to future work. No subsequent publication has reported a gene
    for this entity as of a dated PubMed sweep on 2026-08-18; the most recent
    corroboration is a 2019 national series (PMID:31455059) that names HHT4
    testing as an unmet need rather than an available assay. Until a gene is
    established, every downstream node in this
    entry is an observation about a phenotype rather than a molecular pathway,
    and the endothelial BMP/TGF-beta account that explains ENG- and
    ACVRL1-related HHT cannot be transferred here: it is exactly the mechanism
    the linkage data exclude for this family. Nominating a gene from the
    interval on the strength of endothelial expression or of a plausible role in
    angiogenesis would be an unsupported inference - the fine-mapping history of
    the sister HHT3 locus, where the two most attractive angiogenesis candidates
    were both excluded by recombination mapping, is the cautionary case.
  proposed_experiments:
  - experiment_id: hht4_wgs_reanalysis
    name: Whole-genome sequencing and re-analysis of the index family
    description: >-
      Perform whole-genome (not exome-only) sequencing on the affected and
      unaffected members of the original 7p14 family and filter for variants
      segregating with disease inside the D7S2252-D7S510 interval. Genome-wide
      coverage is required because the 2006 study was a marker-based linkage and
      fine-mapping exercise that tested no non-coding, regulatory, or structural
      variation within the interval.
    decision_criterion: >-
      A rare variant segregating with the phenotype inside the D7S2252-D7S510
      interval and absent from population databases would nominate the causal
      gene; finding none under whole-genome coverage would raise the possibility
      that the single-family linkage signal (two-point LOD 3.60) was a false
      positive.
    would_support:
    - pathophysiology#Unidentified 7p14 Disease Allele
  - experiment_id: hht4_second_family_ascertainment
    name: Locus assignment in additional gene-negative HHT families
    description: >-
      Genotype or sequence the 7p14 interval in a cohort of clinically definite
      HHT families that are negative for ENG, ACVRL1, SMAD4 and GDF2, and test
      whether any shows linkage or a shared segregating haplotype at 7p14.
    decision_criterion: >-
      A second independently ascertained family linked to 7p14 would establish
      HHT4 as a replicable locus; a well-powered gene-negative cohort with no
      7p14 signal would argue that the entity rests on one family and should be
      treated accordingly.
    would_support:
    - genetic#HHT4 linkage locus (7p14)
  evidence:
  - reference: PMID:16969873
    reference_title: A fourth locus for hereditary hemorrhagic telangiectasia maps to chromosome 7.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Further studies of the candidate region and the identification of the gene
      responsible for the vascular anomalies in this family will add to our
      understanding of vascular morphogenesis and related disorders.
    explanation: >-
      The authors state that the responsible gene had not been identified and
      frame its identification as future work - the gap this discussion records.
  - reference: PMID:20701797
    reference_title: Fine mapping of the hereditary haemorrhagic telangiectasia (HHT)3 locus on chromosome 5 excludes VE-Cadherin-2, Sprouty4 and other interval genes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Strong candidates VE-cadherin-2 and Sprouty4 cannot be HHT3.
    explanation: >-
      At the sister HHT3 locus, the most attractive angiogenesis candidates in
      the interval were excluded by mapping - evidence that candidate-gene
      plausibility is not a substitute for segregation data at an unsolved HHT
      locus.
- discussion_id: hht4_not_hht3_chromosome_confusion
  prompt: >-
    Should chromosome 5q31.3-q32 content be curated against HHT4?
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - genetic#HHT4 linkage locus (7p14)
  rationale: >-
    No. The 5q31.3-q32 region is the HHT3 locus (OMIM:601101, MONDO:0011186),
    mapped by Cole and colleagues in 2005; HHT4 (OMIM:610655, MONDO:0012532) is
    on chromosome 7p14. The two are adjacent members of a numbered series, both
    are locus-defined with no causal gene, and both are usually mentioned in the
    same sentence of a review, which makes them an easy pair to transpose - and
    a transposition is undetectable by the usual anti-hallucination checks,
    because the citations and quotes for the wrong locus are perfectly real. The
    index HHT4 family was explicitly tested for and excluded from HHT3 linkage,
    so 5q content is not merely off-topic here, it is contradicted. This
    discussion is recorded as RESOLVED because the primary literature settles it
    unambiguously; it is kept rather than dropped so the confusion is documented
    and rejected instead of being silently re-introduced.
  resolution_note: >-
    HHT3 = chromosome 5 (PMID:15994879); HHT4 = chromosome 7p14
    (PMID:16969873); linkage to HHT3 was ruled out in the HHT4 family. Curate
    only 7p14 content against this entry.
  evidence:
  - reference: PMID:15994879
    reference_title: A new locus for hereditary haemorrhagic telangiectasia (HHT3) maps to chromosome 5.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two point LOD scores and recombination mapping identified a 5.4 cM HHT3
      disease gene interval on chromosome 5 in which a single haplotype was
      inherited by all affected members of the pedigree.
    explanation: >-
      Establishes that the HHT3 interval is on chromosome 5, not chromosome 7.
  - reference: PMID:16969873
    reference_title: A fourth locus for hereditary hemorrhagic telangiectasia maps to chromosome 7.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we report on linkage results on a family with classic features of
      HHT, albeit a less severe phenotype with regards to epistaxis and
      telangiectases, in which linkage to HHT1, HHT2, and HHT3 is ruled out.
    explanation: >-
      The HHT4 family was tested against HHT3 and excluded, so HHT3 content is
      not merely different from HHT4 content but incompatible with it.
- discussion_id: hht4_entity_rests_on_a_single_family
  prompt: >-
    Is HHT4 a replicable disease entity, or a single-family linkage result that
    has not been independently confirmed?
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - pathophysiology#Unidentified 7p14 Disease Allele
  rationale: >-
    The entire evidence base for HHT4 is one family reported in 2006 with a
    maximum two-point LOD score of 3.60. No second family mapped to 7p14, no
    gene, and no genotype-phenotype series have been published since. A
    two-point LOD of 3.60 clears the classical significance threshold, and the
    interval was corroborated by haplotype analysis, so the result is not weak
    on its own terms - but a single pedigree cannot distinguish a true novel
    locus from a chance linkage peak, and the absence of replication over nearly
    two decades is itself informative. Curators should treat this entry as a
    faithful record of one linkage study rather than as an established disease
    mechanism, and should not report HHT4 prevalence, penetrance, or
    genotype-phenotype correlation.
  evidence:
  - reference: PMID:16969873
    reference_title: A fourth locus for hereditary hemorrhagic telangiectasia maps to chromosome 7.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We obtained a maximum two point LOD score of 3.60 with the STR marker
      D7S817.
    explanation: >-
      Gives the single statistical result on which the entity rests.
- discussion_id: hht4_omim_synopsis_features_unquotable
  prompt: >-
    Should the OMIM/HPO clinical-synopsis features annotated to OMIM:610655
    (pulmonary, cerebral and spinal AVMs, site-specific telangiectases, stroke,
    migraine, high-output cardiac failure and others) be curated as phenotypes
    of this entry?
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - phenotypes#Arteriovenous Malformation
  rationale: >-
    The HPO annotation set for OMIM:610655 carries 21 phenotype terms, including
    pulmonary (HP:0006548), cerebral (HP:0002408) and spinal (HP:0002390)
    arteriovenous malformation, site-specific telangiectases of lip, tongue,
    palate, nasal mucosa and conjunctiva, ischemic stroke, transient ischemic
    attack, subarachnoid and cerebral hemorrhage, migraine, dyspnea, cyanosis,
    right-to-left shunt, high-output congestive heart failure, and celiac and
    mesenteric vascular anomalies. Two problems block direct curation. First,
    these derive from the OMIM clinical synopsis, which is built from the
    American Journal of Medical Genetics full text; that article is not open
    access and its cached PubMed record is abstract-only, so no exact snippet
    can be verified for any of them and dismech evidence policy forbids
    asserting them unevidenced. Second, most of the set is indistinguishable
    from the generic HHT template, so importing it wholesale would restate the
    parent disease rather than describe this family - and would flatly
    contradict the one phenotypic claim the abstract does make, that epistaxis
    and telangiectases in this family were LESS severe than in typical HHT.
    Resolving this requires the AJMG full text (institutional access), after
    which the synopsis features observed in this specific family can be added
    with real evidence and organ-specific AVM terms can replace the generic one
    curated here.
notes: >-
  Curation guardrail: this entry deliberately contains NO causal gene. MONDO
  (MONDO:0012532) and OMIM (610655) both define HHT4 by the 7p14 region, the
  MONDO record carries no RO:0004003 causal-gene relationship, and the anchoring
  publication (PMID:16969873) is a linkage study that explicitly did not identify
  the gene. Any future edit that adds a gene_term to the `genetic` block must
  cite primary literature establishing that gene for THIS entity and must
  reconcile the assignment with the MONDO and OMIM records.

  Named-entity-confusion guardrail: HHT4 is chromosome 7p14. The chromosome
  5q31.3-q32 locus belongs to HHT3 (OMIM:601101), and linkage to HHT3 was
  explicitly excluded in the HHT4 family - see the
  hht4_not_hht3_chromosome_confusion discussion. Likewise, ENG (HHT1), ACVRL1
  (HHT2), SMAD4 (juvenile polyposis/HHT overlap) and GDF2 (HHT5) belong to other
  members of this numbered series; their mechanism, treatment and
  genotype-phenotype literature must not be curated here. The parent entry
  `Hereditary_Hemorrhagic_Telangiectasia` carries that material, and this entry
  is listed there as the HHT4 subtype.

  Scope: no treatments block is curated. HHT4 management is HHT management -
  epistaxis and gastrointestinal bleeding therapy, pulmonary AVM occlusion,
  cerebral AVM treatment, iron replacement, surveillance - and none of it is
  specific to, or was studied in, this entity. Reproducing it here would
  misrepresent parent-disease practice as HHT4 evidence; it belongs in the
  parent entry, which carries it. The two diagnosis records that ARE curated are
  entity-scoped, because both follow directly from this entity's defining
  feature - that the disease allele has never been identified, so clinical
  criteria are the only diagnostic route and no relative can be discharged by a
  genetic test.

  Deep research: a search-grounded literature sweep was run with the
  `claude_code` provider on 2026-08-18 and is committed as
  `research/Hereditary_Hemorrhagic_Telangiectasia_4-deep-research-claude_code.md`.
  A synthesised provider report was deliberately NOT commissioned: for a
  high-named-entity-confusion target in a numbered series with two gene-unsolved
  members, synthesis is more likely to import HHT1/HHT2/HHT3 mechanism than to
  add anything the anchoring linkage paper does not already state. The sweep was
  therefore used for one purpose only - to date this entry's two load-bearing
  NEGATIVE claims, which the primary literature cannot establish on its own. A
  PubMed query for `"HHT4" OR ("hereditary hemorrhagic telangiectasia" AND
  7p14)` run on 2026-08-18 returned five records, of which only two concern this
  disease: the 2006 anchoring study (PMID:16969873) and a 2019 Korean
  multicenter series (PMID:31455059) noting that HHT4 testing is not
  implemented. The remaining three are homonyms of the "HHT4" string in
  unrelated organisms. No second family mapped to 7p14, and no candidate or
  causal gene for this entity, has been published as of that date. Every
  evidence snippet in this entry is nevertheless quoted from a cached PubMed
  abstract retrieved with `just fetch-reference`, not from the sweep; the sweep
  is provenance for the negatives, not a source of curated claims. The sweep's
  own reference-validation block resolved 31/31 references with one unsupported
  quote (PMID:38357927), which is not cited anywhere in this entry.

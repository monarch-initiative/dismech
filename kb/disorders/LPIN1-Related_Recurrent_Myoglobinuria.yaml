prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Seventy-one patients had been published in 20 clinical studies by 2022. Among children
    with severe early-childhood rhabdomyolysis after exclusion of fatty acid oxidation
    defects, LPIN1 variants were found in 59% of a French series.
  evidence:
  - reference: PMID:36195520
    reference_title: "Two tales of LPIN1 deficiency: from fatal rhabdomyolysis to favorable outcome of acute compartment syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To date, 71 patients have been published in 20 clinical studies in the form of case series."
    explanation: Reported-case denominator as of 2022.
  - reference: PMID:20583302
    reference_title: "LPIN1 gene mutations: a major cause of severe rhabdomyolysis in early childhood."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among the 29 patients studied, 17 (59%) carried recessive nonsense or frameshift mutations, or a large scale intragenic deletion."
    explanation: Share of severe early-childhood rhabdomyolysis attributable to LPIN1 in the discovery cohort.
progression:
- phase: Early-childhood onset of recurrent attacks
  notes: >-
    First episodes occur at 2-7 years in the original series and at a mean of 21 months in
    the French cohort; nearly all patients present before age five. Attacks recur with
    intercurrent illness, fasting or exertion throughout childhood, and roughly a third of
    patients die, usually from cardiac arrest during a crisis.
  evidence:
  - reference: PMID:18817903
    reference_title: "Mutations in LPIN1 cause recurrent acute myoglobinuria in childhood."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using homozygosity mapping, we identified six deleterious mutations in the LPIN1 gene in patients who presented at 2-7 years of age with recurrent, massive rhabdomyolysis."
    explanation: Age at presentation in the gene-discovery series.
  - reference: PMID:20583302
    reference_title: "LPIN1 gene mutations: a major cause of severe rhabdomyolysis in early childhood."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In these 17 patients, episodes of rhabdomyolysis occurred at a mean age of 21 months."
    explanation: Mean age of first episodes in the largest early cohort.
  - reference: PMID:29325813
    reference_title: "Cardiac function and exercise adaptation in 8 children with LPIN1 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The prognosis is poor, with one-third of patients dying from cardiac arrest during a crisis episode."
    explanation: Mortality and its mechanism during attacks.
- phase: Adolescent and adult course
  notes: >-
    Survivors are usually well between attacks but may have exercise intolerance, persistent
    myalgia or a residual distal myopathy; rare patients first present in adolescence or
    adulthood after viral infection or metabolic stress.
  evidence:
  - reference: PMID:32522502
    reference_title: "First presentation of LPIN1 acute rhabdomyolysis in adolescence and adulthood."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we present two cases of acute rhabdomyolysis with a milder phenotype caused by LPIN1 mutation presenting in adolescence (11 years old) and adulthood (40 years old) after Parvovirus infection and metabolic stress, respectively."
    explanation: Documents late first presentations.
  - reference: PMID:22481384
    reference_title: "Study of LPIN1, LPIN2 and LPIN3 in rhabdomyolysis and exercise-induced myalgia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All presented with severe episodes of rhabdomyolysis, starting before age 6 years except two (8 and 42 years). Few patients also suffered from permanent muscle symptoms, including the eldest ones"
    explanation: Age of onset distribution and persistent symptoms in older patients.
genetic:
- name: LPIN1
  gene_term:
    preferred_term: LPIN1
    term:
      id: hgnc:13345
      label: LPIN1
  relationship_type: CAUSATIVE
  notes: >
    Biallelic LPIN1 (2p25.1) variants cause the disease; most are nonsense, frameshift or
    splice variants or intragenic deletions, with a minority of missense and in-frame
    changes that need functional support. A recurrent intragenic deletion,
    c.2295-866_2410-30del (p.Glu766_Ser838del), on a shared haplotype accounted for 47% of
    mutated alleles in Caucasian patients and fails to complement pah1-deficient yeast.
    Heterozygous carriers may have exercise-induced myalgia and one carrier of a pathogenic
    allele developed statin-induced myopathy. Adipose tissue develops normally despite loss
    of lipin-1, unlike the lipodystrophy of Lpin1-null mice.
  variants:
  - name: c.2295-866_2410-30del (p.Glu766_Ser838del)
    description: >
      Recurrent intragenic deletion found in 8 of 17 mutation-positive patients in the French
      cohort, all Caucasian, on a common haplotype suggesting a founder effect; the deleted
      protein is unable to complement pah1-deficient yeast. Its high frequency makes targeted
      testing a fast first diagnostic step.
    type: deletion
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:20583302
      reference_title: "LPIN1 gene mutations: a major cause of severe rhabdomyolysis in early childhood."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The intragenic deletion, c.2295-866_2410-30del, was identified in 8/17 patients (47%), all Caucasians, and occurred on the background of a common haplotype, suggesting a founder effect. This deleted human LPIN1 form was unable to complement Delta pah1 yeast for growth on glycerol, in contrast to normal LPIN1."
      explanation: Frequency, founder haplotype and functional loss of the recurrent deletion.
  evidence:
  - reference: PMID:18817903
    reference_title: "Mutations in LPIN1 cause recurrent acute myoglobinuria in childhood."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in the LPIN1 gene cause recurrent rhabdomyolysis in childhood, and a carrier state may predispose for statin-induced myopathy."
    explanation: Gene discovery and the carrier statin-myopathy observation.
  - reference: PMID:22481384
    reference_title: "Study of LPIN1, LPIN2 and LPIN3 in rhabdomyolysis and exercise-induced myalgia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Heterozygous LPIN1 mutations may cause mild muscular symptoms. No major defects of LPIN2 or LPIN3 genes were associated with muscular manifestations."
    explanation: Carrier phenotype and exclusion of the paralogues.
  - reference: PMID:28986436
    reference_title: "Normal human adipose tissue functions and differentiation in patients with biallelic LPIN1 inactivating mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "White adipose tissue from human LPIN1 mutant patients displayed a dramatic decrease in lipin-1 protein levels and PAP activity, with a concomitant moderate reduction of adipocyte size. Nevertheless, the adipose tissue develops without obvious histological signs of lipodystrophy and with normal qualitative composition of storage lipids."
    explanation: Shows the human phenotype is confined to muscle despite systemic loss of the enzyme.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  penetrance: COMPLETE
  expressivity: VARIABLE
  description: >
    Autosomal recessive; heterozygous relatives may have mild exercise-induced myalgia but
    not rhabdomyolysis.
  evidence:
  - reference: PMID:36195520
    reference_title: "Two tales of LPIN1 deficiency: from fatal rhabdomyolysis to favorable outcome of acute compartment syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "LPIN1 deficiency is an autosomal recessive disease caused by biallelic mutations in LPIN1, where impaired fatty acid metabolism leads to stress in skeletal muscle, resulting in severe rhabdomyolysis, often triggered by fever, exercise, fasting, and anesthesia."
    explanation: States the inheritance pattern.
  - reference: PMID:22481384
    reference_title: "Study of LPIN1, LPIN2 and LPIN3 in rhabdomyolysis and exercise-induced myalgia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At least 40% of heterozygous relatives presented muscular myalgia."
    explanation: Carrier manifestation short of the recessive phenotype.
pathophysiology:
- name: Biallelic LPIN1 Loss of Function
  description: >
    Biallelic LPIN1 variants abolish lipin-1 protein and its Mg2+-dependent phosphatidate
    phosphatase (PAP-1) activity in skeletal muscle, where lipin-1 provides most PAP activity.
    Lipin-1 also acts as a nuclear transcriptional co-regulator of lipid-oxidation genes, but
    in patient myoblasts the expression of its PPAR/PGC-1alpha target genes is preserved,
    so the enzymatic loss is the primary lesion.
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: phosphatidate phosphatase activity
    term:
      id: GO:0008195
      label: phosphatidate phosphatase activity
    modifier: DECREASED
  downstream:
  - target: Phosphatidic Acid Accumulation and Glycerolipid Imbalance
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:18817903
      reference_title: "Mutations in LPIN1 cause recurrent acute myoglobinuria in childhood."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Analysis of phospholipid content disclosed accumulation of phosphatidic acid and lysophospholipids in muscle tissue of the more severe genotype."
      explanation: Substrate accumulation in patient muscle links enzyme loss to the lipid imbalance.
  evidence:
  - reference: PMID:18817903
    reference_title: "Mutations in LPIN1 cause recurrent acute myoglobinuria in childhood."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The LPIN1 gene encodes the muscle-specific phosphatidic acid phosphatase, a key enzyme in triglyceride and membrane phospholipid biosynthesis."
    explanation: Identifies the enzymatic function lost.
  - reference: PMID:23928362
    reference_title: "Combination of lipid metabolism alterations and their sensitivity to inflammatory cytokines in human lipin-1-deficient myoblasts."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here we show that primary myoblasts from lipin-1-deficient patients exhibit a dramatic decrease in LPIN1 expression and phosphatidic acid phosphatase 1 activity, and a significant accumulation of lipid droplets (LD)."
    explanation: Patient-cell demonstration of the enzymatic loss.
- name: Phosphatidic Acid Accumulation and Glycerolipid Imbalance
  description: >
    Without PAP-1, phosphatidic acid and lysophospholipids accumulate in muscle and lipid
    droplets accumulate in myofibres and myoblasts; fatty acid synthesis, oxidation,
    elongation and desaturation are altered, ACACB is up-regulated with free fatty acid
    accumulation, and, paradoxically, diacylglycerol also accumulates in mouse muscle.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: fatty acid metabolic process
    term:
      id: GO:0006631
      label: fatty acid metabolic process
    modifier: DYSREGULATED
  downstream:
  - target: Impaired Mitochondrial Quality Control and Fatty Acid Oxidation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Sarcoplasmic Reticulum Stress
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:30420558
      reference_title: "Lipin1 deficiency causes sarcoplasmic reticulum stress and chaperone-responsive myopathy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The metabolic lipid imbalance can be traced to an altered fatty acid synthesis and fatty acid oxidation, accompanied by a defect in acyl chain elongation and desaturation. As an underlying cause, we reveal a severe sarcoplasmic reticulum (SR) stress"
      explanation: Links the lipid imbalance to SR stress in the mouse model.
  evidence:
  - reference: PMID:22481384
    reference_title: "Study of LPIN1, LPIN2 and LPIN3 in rhabdomyolysis and exercise-induced myalgia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Around 3/4 of muscle biopsies showed accumulation of lipid droplets."
    explanation: Lipid accumulation in patient muscle.
  - reference: PMID:30028636
    reference_title: "Loss of lipin 1-mediated phosphatidic acid phosphohydrolase activity in muscle leads to skeletal myopathy in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In both models, skeletal muscles exhibited a chronic myopathy with ongoing muscle fiber necrosis and regeneration and accumulation of phosphatidic acid and, paradoxically, diacylglycerol."
    explanation: Muscle-specific knockout confirms PA accumulation downstream of PAP loss.
  - reference: PMID:23928362
    reference_title: "Combination of lipid metabolism alterations and their sensitivity to inflammatory cytokines in human lipin-1-deficient myoblasts."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We demonstrated that overexpression of ACACB was associated with free fatty acid accumulation in patients' myoblasts whereas malonyl-carnitine (as a measure of malonyl-CoA) and CPT1 activity were in the normal range in basal conditions accordingly to the normal daily activity reported by the patients."
    explanation: Identifies the ACACB-driven fatty acid accumulation in patient cells.
- name: Impaired Mitochondrial Quality Control and Fatty Acid Oxidation
  description: >
    Lipin-1-deficient myoblasts have reduced phosphatidylinositol-3-phosphate near
    autophagosomes and late endosomes, which prevents Armus recruitment, locks Rab7 in its
    active state and blocks vesicle clearance by lysosomal fusion, so damaged mitochondria and
    their oxidised DNA are not cleared. Muscle-specific knockout mice have abundant but
    abnormal mitochondria attributed to impaired autophagy, and an adult patient showed
    markedly reduced fat oxidation during exercise.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: mitophagy
    term:
      id: GO:0000423
      label: mitophagy
    modifier: DECREASED
  - preferred_term: fatty acid beta-oxidation
    term:
      id: GO:0006635
      label: fatty acid beta-oxidation
    modifier: DECREASED
  downstream:
  - target: Oxidized Mitochondrial DNA-TLR9 Inflammatory Signaling
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:34467247
      reference_title: "Compromised mitochondrial quality control triggers lipin1-related rhabdomyolysis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Oxidized mitochondrial DNA accumulates in late endosomes, where it activates Toll-like receptor 9 (TLR9) and triggers inflammatory signaling and caspase-dependent myolysis."
      explanation: Defective clearance leads directly to endosomal mtDNA accumulation and TLR9 activation.
  - target: Exercise intolerance
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:34467247
    reference_title: "Compromised mitochondrial quality control triggers lipin1-related rhabdomyolysis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We find that lipin1-deficient myoblasts exhibit a reduction in phosphatidylinositol-3-phosphate close to autophagosomes and late endosomes that prevents the recruitment of the GTPase Armus, locks Rab7 in the active state, inhibits vesicle clearance by fusion with lysosomes, and alters their positioning and function."
    explanation: Mechanistic basis of the quality-control defect in patient cells.
  - reference: PMID:30028636
    reference_title: "Loss of lipin 1-mediated phosphatidic acid phosphohydrolase activity in muscle leads to skeletal myopathy in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Additionally, lipin 1-deficient mice had abundant, but abnormal, mitochondria likely because of impaired autophagy."
    explanation: Mouse corroboration of the mitochondrial clearance defect.
  - reference: PMID:31492716
    reference_title: "Fat oxidation is impaired during exercise in lipin-1 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this adult lipin-1-deficient patient, FAO was reduced, which was associated with no increase in plasma free fatty acids during submaximal exercise, and his exercise capacity improved with continuous ingestion of high-dose glucose."
    explanation: In vivo human evidence of impaired fat oxidation.
- name: Sarcoplasmic Reticulum Stress
  description: >
    In muscle-specific Lpin1 mutant mice the lipid imbalance causes severe sarcoplasmic
    reticulum stress with activation of SREBP1c/SREBP2, accumulation of Fgf21 and altered
    SR-mitochondria contacts; the chaperone TUDCA and the fatty acid oxidation activator
    bezafibrate improve muscle histology and strength. This branch is established in mice
    and its contribution to human acute attacks is inferred.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: response to endoplasmic reticulum stress
    term:
      id: GO:0034976
      label: response to endoplasmic reticulum stress
    modifier: INCREASED
  downstream:
  - target: Trigger-Induced Myofibre Necrosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:30420558
    reference_title: "Lipin1 deficiency causes sarcoplasmic reticulum stress and chaperone-responsive myopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "As an underlying cause, we reveal a severe sarcoplasmic reticulum (SR) stress, leading to the activation of the lipogenic SREBP1c/SREBP2 factors, the accumulation of the Fgf21 cytokine, and alterations of SR-mitochondria morphology. Importantly, pharmacological treatments with the chaperone TUDCA and the fatty acid oxidation activator bezafibrate improve muscle histology and strength of lipin1 mutants."
    explanation: Defines the SR-stress branch and its pharmacological reversibility in mice.
- name: Oxidized Mitochondrial DNA-TLR9 Inflammatory Signaling
  description: >
    Oxidised mitochondrial DNA retained in late endosomes engages Toll-like receptor 9,
    driving inflammatory signalling and caspase-dependent myolysis. Febrile illness amplifies
    this: pro-inflammatory cytokines (TNF-alpha plus IL-1beta) mimicking fever raise
    malonyl-carnitine, reduce CPT1 activity and enhance lipid-droplet accumulation in patient
    myoblasts, effects reversed by dexamethasone or cytokine inhibitors. This is the proposed
    convergence point for the metabolic (fasting, exercise) and inflammatory (fever) triggers.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  biological_processes:
  - preferred_term: toll-like receptor 9 signaling pathway
    term:
      id: GO:0034162
      label: toll-like receptor 9 signaling pathway
    modifier: INCREASED
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  triggers:
  - preferred_term: Febrile illness
  - preferred_term: Fasting
  - preferred_term: Strenuous exercise
    term:
      id: ECTO:6000031
      label: exposure to strenuous exercise
  downstream:
  - target: Trigger-Induced Myofibre Necrosis
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:34467247
      reference_title: "Compromised mitochondrial quality control triggers lipin1-related rhabdomyolysis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We suggest a critical role for defective clearance of oxidized mitochondrial DNA that activates TLR9-restricted inflammation in lipin1-related rhabdomyolysis."
      explanation: Authors' causal model linking TLR9 inflammation to myolysis.
  evidence:
  - reference: PMID:23928362
    reference_title: "Combination of lipid metabolism alterations and their sensitivity to inflammatory cytokines in human lipin-1-deficient myoblasts."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Further, pro-inflammatory treatments tumor necrosis factor alpha+Interleukin-1beta(TNF1α+IL-1ß) designed to mimic febrile illness, resulted in increased malonyl-carnitine levels, reduced CPT1 activity and enhanced LD accumulation, a phenomenon reversed by dexamethasone and TNFα or IL-1ß inhibitors."
    explanation: Shows inflammatory cytokines aggravate the lipid defect in patient cells, explaining the febrile trigger.
  - reference: PMID:34467247
    reference_title: "Compromised mitochondrial quality control triggers lipin1-related rhabdomyolysis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Hydroxychloroquine blocks TLR9 activation by mitochondrial DNA in vitro and may attenuate flares of rhabdomyolysis in 6 patients treated."
    explanation: Pharmacological blockade of TLR9 supports its causal role.
- name: Trigger-Induced Myofibre Necrosis
  description: >
    Under catabolic or inflammatory stress the vulnerable lipin-1-deficient myofibre loses
    plasma membrane integrity and dies by caspase-dependent, apoptotic and necroptotic
    pathways, releasing creatine kinase, myoglobin, potassium and transaminases. Attacks
    produce massive hyperCKaemia, myoglobinuria, pain and weakness; myoglobin nephrotoxicity
    causes acute kidney injury, and hyperkalaemia with characteristic high-amplitude T waves
    precedes fatal arrhythmia in the most severe episodes.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  biological_processes:
  - preferred_term: necroptotic process
    term:
      id: GO:0070266
      label: necroptotic process
    modifier: INCREASED
  downstream:
  - target: Rhabdomyolysis
    causal_link_type: DIRECT
  - target: Myoglobinuria
    causal_link_type: DIRECT
  - target: Elevated circulating creatine kinase activity
    causal_link_type: DIRECT
  - target: Myalgia
    causal_link_type: DIRECT
  - target: Muscle weakness
    causal_link_type: DIRECT
  - target: Acute kidney injury
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Cardiac arrest
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Abnormal T-wave
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:33113595
    reference_title: "Loss of membrane integrity drives myofiber death in lipin1-deficient skeletal muscle."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "EBD-positive fibers were strongly colocalized with apoptotic or necroptotic myofibers, suggesting an association between compromised plasma membrane integrity and cell death pathways."
    explanation: Mechanism of myofibre death in muscle-specific knockout mice.
  - reference: PMID:33113595
    reference_title: "Loss of membrane integrity drives myofiber death in lipin1-deficient skeletal muscle."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We found that Lipin1Myf5cKO muscles had significantly elevated proapoptotic factors (Bax, Bak, and cleaved caspase-9) and necroptotic proteins such as RIPK1, RIPK3, and MLKL compared with WT mice."
    explanation: Molecular markers of apoptosis and necroptosis in the knockout muscle.
  - reference: PMID:30028636
    reference_title: "Loss of lipin 1-mediated phosphatidic acid phosphohydrolase activity in muscle leads to skeletal myopathy in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM

name: LPIN1-Related Recurrent Myoglobinuria
category: Genetic
creation_date: "2026-09-05T16:30:00Z"
synonyms:
- Myoglobinuria, acute recurrent, autosomal recessive
- Lipin-1 deficiency
- LPIN1 deficiency
- LPIN1-related rhabdomyolysis
- Acute recurrent myoglobinuria of childhood due to LPIN1 deficiency
description: >
  LPIN1-related recurrent myoglobinuria (OMIM #268200) is an autosomal recessive disorder
  caused by biallelic loss-of-function variants in LPIN1, which encodes lipin-1, the
  Mg2+-dependent phosphatidic acid phosphatase that converts phosphatidic acid to
  diacylglycerol and accounts for most of that activity in skeletal muscle. It is a major
  cause, in some series the commonest, of severe recurrent rhabdomyolysis in early
  childhood: episodes usually begin before age six (mean about 21 months), are precipitated
  by febrile illness, fasting, strenuous exercise or anaesthesia, and produce massive
  creatine kinase elevation (often above 100,000 U/L), myoglobinuria, myalgia and weakness,
  with acute kidney injury, hyperkalaemia and fatal arrhythmia in the most severe attacks;
  about a third of patients have died, most during a crisis. Between attacks most patients
  are clinically well, although exercise intolerance and permanent muscle symptoms occur,
  and rare adolescent- or adult-onset and atypical neuromuscular presentations are
  described. Patient muscle and myoblasts show loss of phosphatidate phosphatase activity,
  phosphatidic acid and lipid-droplet accumulation, impaired fatty acid oxidation during
  exercise, and defective mitochondrial quality control in which oxidised mitochondrial DNA
  accumulating in late endosomes activates TLR9-driven inflammatory signalling and
  caspase-dependent myolysis, a model that also explains the febrile trigger. Muscle-specific
  Lpin1-null mice add sarcoplasmic reticulum stress and loss of membrane integrity with
  apoptotic and necroptotic myofibre death. There is no approved targeted therapy: attacks
  are managed with aggressive intravenous fluid and glucose, electrolyte and cardiac
  monitoring, and, in the largest cohort, intravenous corticosteroids; low-dose
  hydroxychloroquine has been given compassionately, and glucose loading improves exercise
  capacity. The mitochondrially inherited recurrent myoglobinuria attributed to mtDNA
  cytochrome c oxidase gene mutations (MONDO:0010791, OMIM 550500) is a separate entity.

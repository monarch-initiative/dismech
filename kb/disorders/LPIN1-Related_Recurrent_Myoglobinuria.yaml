environmental:
- name: Febrile illness
  description: >
    Intercurrent febrile infection is the commonest precipitant of attacks; inflammatory
    cytokines aggravate the lipid defect in patient myoblasts, and fever worsens exercise
    haemodynamics in patients.
  exposure_term:
    preferred_term: febrile infectious illness
  influences_mechanisms:
  - target: Oxidized Mitochondrial DNA-TLR9 Inflammatory Signaling
    environmental_effect: TRIGGERS
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Fever-associated cytokines (TNF-alpha, IL-1beta) amplify the inflammatory and lipid
      abnormalities in lipin-1-deficient muscle cells.
    evidence:
    - reference: PMID:23928362
      reference_title: "Combination of lipid metabolism alterations and their sensitivity to inflammatory cytokines in human lipin-1-deficient myoblasts."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Further, pro-inflammatory treatments tumor necrosis factor alpha+Interleukin-1beta(TNF1α+IL-1ß) designed to mimic febrile illness, resulted in increased malonyl-carnitine levels, reduced CPT1 activity and enhanced LD accumulation, a phenomenon reversed by dexamethasone and TNFα or IL-1ß inhibitors."
      explanation: Cytokine mimicry of fever aggravates the cellular defect.
  evidence:
  - reference: PMID:23928362
    reference_title: "Combination of lipid metabolism alterations and their sensitivity to inflammatory cytokines in human lipin-1-deficient myoblasts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Lipin-1 deficiency is associated with massive rhabdomyolysis episodes in humans, precipitated by febrile illnesses."
    explanation: States the febrile trigger in patients.
  - reference: PMID:29325813
    reference_title: "Cardiac function and exercise adaptation in 8 children with LPIN1 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Lipin-1 deficiency is a major cause of rhabdomyolysis that are precipitated by febrile illness."
    explanation: Independent clinical statement of the febrile trigger.
  notes: >-
    ECTO was searched through the repository label cache for a fever or febrile-illness
    exposure term and none is cached; the exposure is left unbound rather than bound to an
    unrelated infection term.
- name: Fasting, strenuous exercise and anaesthesia
  description: >
    Catabolic stressors (fasting, prolonged or strenuous exercise) and general anaesthesia
    precipitate attacks; exercise tolerance improves with continuous glucose intake.
  exposure_term:
    preferred_term: exposure to strenuous exercise
    term:
      id: ECTO:6000031
      label: exposure to strenuous exercise
  influences_mechanisms:
  - target: Impaired Mitochondrial Quality Control and Fatty Acid Oxidation
    environmental_effect: TRIGGERS
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Catabolic states increase reliance on fatty acid oxidation, which is impaired, and
      exhaustive unfed exercise provokes CK release in muscle-specific knockout mice.
    evidence:
    - reference: PMID:30028636
      reference_title: "Loss of lipin 1-mediated phosphatidic acid phosphohydrolase activity in muscle leads to skeletal myopathy in mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Finally, these mice exhibited increased plasma creatine kinase following exhaustive exercise when unfed."
      explanation: Exercise-plus-fasting provokes muscle injury in the model.
  evidence:
  - reference: PMID:36195520
    reference_title: "Two tales of LPIN1 deficiency: from fatal rhabdomyolysis to favorable outcome of acute compartment syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "resulting in severe rhabdomyolysis, often triggered by fever, exercise, fasting, and anesthesia"
    explanation: Lists the clinical triggers.
  - reference: PMID:31492716
    reference_title: "Fat oxidation is impaired during exercise in lipin-1 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient's exercise duration increased from 36 to 60 minutes with IV glucose and 46 minutes with oral glucose, and his rating of exertion dropped from 15 to 9 on average (Borg scale)."
    explanation: Glucose supply mitigates the exercise trigger.
  notes: >-
    Bound to the strenuous-exercise ECTO term already used elsewhere in the KB; fasting and
    anaesthesia have no cached ECTO term and are carried in the description.
treatments:
- name: Emergency management of acute rhabdomyolysis
  description: >
    An attack is a medical emergency: stop exertion and reverse catabolism with intravenous
    glucose-containing fluids, monitor CK, potassium, calcium, phosphate, renal function and
    ECG, treat hyperkalaemia and arrhythmia, and use renal replacement therapy for standard
    indications; management in a paediatric intensive care unit is advised because of the
    risk of fatal arrhythmia. A standardised care recommendation has been published.
  treatment_term:
    preferred_term: Supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_phenotypes:
  - preferred_term: Rhabdomyolysis
    term:
      id: HP:0003201
      label: Rhabdomyolysis
  evidence:
  - reference: PMID:22480698
    reference_title: "Fatal rhabdomyolysis in 2 children with LPIN1 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our report underlines the severity of this disease and the need for active management of episodes of rhabdomyolysis in a pediatric intensive care unit."
    explanation: Basis for intensive-care management of attacks.
  - reference: PMID:35242575
    reference_title: "LPIN1 rhabdomyolysis: A single site cohort description and treatment recommendations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This allowed us to compare multiple practice approaches and led to a standardized Care Recommendations."
    explanation: Published standardised care recommendation.
- name: Intravenous corticosteroids during attacks
  description: >
    Since 2015 the Paris cohort has given intravenous corticosteroids during attacks and
    at-risk situations, on the rationale of TLR9-driven inflammation; in a retrospective
    comparison there were no deaths among corticosteroid-treated patients versus four in the
    untreated group, and steroid-treated episodes were fewer per patient, although episodes
    were more severe and stays longer. Considered centre-specific practice rather than
    established standard of care.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: dexamethasone (intravenous corticosteroid)
      term:
        id: CHEBI:41879
        label: dexamethasone
  target_mechanisms:
  - target: Oxidized Mitochondrial DNA-TLR9 Inflammatory Signaling
    description: Suppresses the inflammatory signalling proposed to drive myolysis during attacks.
  evidence:
  - reference: PMID:36680547
    reference_title: "Systemic corticosteroids for the treatment of acute episodes of rhabdomyolysis in lipin-1-deficient patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Four patients in the non-corticosteroid group died during a RM (mean age at death: 5.6 years). There were no deaths in the corticosteroid group."
    explanation: Survival signal in the retrospective comparison.
  - reference: PMID:36680547
    reference_title: "Systemic corticosteroids for the treatment of acute episodes of rhabdomyolysis in lipin-1-deficient patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The peak plasma creatine kinase level and the area under the curve were or tended to be higher in patients treated with corticosteroids-even after the exclusion of deceased patients or focusing on the period after 2015."
    explanation: Records the caveat that treated episodes were more severe, limiting causal inference.
- name: Low-dose hydroxychloroquine (compassionate)
  description: >
    Hydroxychloroquine blocks TLR9 activation by mitochondrial DNA in vitro and was given
    off-label to eleven patients, improving physical capacity and normalising cardiac and
    exercise parameters; two patients with the highest blood concentrations had attacks,
    and in vitro high concentrations block autophagy while low concentrations reduce
    oxidative stress, so dosing must stay low. The registered trial (NCT04007562) was
    withdrawn, and efficacy is unproven.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: hydroxychloroquine
      term:
        id: CHEBI:5801
        label: hydroxychloroquine
  target_mechanisms:
  - target: Oxidized Mitochondrial DNA-TLR9 Inflammatory Signaling
    description: Blocks endosomal TLR9 activation by oxidised mitochondrial DNA and reduces oxidative stress at low concentration.
  evidence:
  - reference: PMID:37150031
    reference_title: "Hydroxychloroquine sulfate: A novel treatment for lipin-1 deficiency?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Under HCQ treatment, patient physical capacities improved. Abnormal cardiac function and peripheral muscle adaptation to exercise were normalized. However, two patients who had the highest mean blood HCQ concentrations experienced RM."
    explanation: Clinical benefit and the dose-related hazard.
  - reference: PMID:37150031
    reference_title: "Hydroxychloroquine sulfate: A novel treatment for lipin-1 deficiency?"
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We confirmed in primary myoblasts from 4 patients that high in vitro HCQ concentration (10 µM) but not low concentration (1 µM and 0.1 µM) induced autophagy blockage by modifying endolysosomal pH. Low HCQ concentration (1 µM) prevented reactive oxygen species (ROS) and oxidized DNA accumulation in myoblasts during starvation."
    explanation: Mechanistic basis for low-dose use.
- name: Glucose supplementation during exercise and avoidance of fasting
  description: >
    Continuous high-dose glucose intake before and during exercise improved exercise duration
    and perceived exertion in an adult patient; avoiding fasting and prolonged exertion, and
    providing carbohydrate during illness, are standard preventive measures.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Dietary intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  target_mechanisms:
  - target: Impaired Mitochondrial Quality Control and Fatty Acid Oxidation
    description: Bypasses impaired fat oxidation by supplying carbohydrate fuel.
  evidence:
  - reference: PMID:31492716
    reference_title: "Fat oxidation is impaired during exercise in lipin-1 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient's exercise duration increased from 36 to 60 minutes with IV glucose and 46 minutes with oral glucose, and his rating of exertion dropped from 15 to 9 on average (Borg scale)."
    explanation: Direct evidence of glucose benefit.
- name: TUDCA and bezafibrate (preclinical)
  description: >
    In muscle-specific Lpin1 mutant mice the chemical chaperone tauroursodeoxycholic acid and
    the PPAR agonist bezafibrate improved muscle histology and strength, proposing SR stress
    and fatty acid oxidation as intervention targets; not tested in patients.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Sarcoplasmic Reticulum Stress
    description: Chaperone relief of SR stress and activation of fatty acid oxidation.
  evidence:
  - reference: PMID:30420558
    reference_title: "Lipin1 deficiency causes sarcoplasmic reticulum stress and chaperone-responsive myopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Importantly, pharmacological treatments with the chaperone TUDCA and the fatty acid oxidation activator bezafibrate improve muscle histology and strength of lipin1 mutants."
    explanation: Preclinical efficacy in the mouse model.
- name: Genetic counseling and carrier advice
  description: >
    Autosomal recessive counselling with targeted testing for the recurrent intragenic
    deletion in Caucasian families; heterozygous carriers may have exercise-induced myalgia and
    a carrier state may predispose to statin-induced myopathy.
  treatment_term:
    preferred_term: Genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:18817903
    reference_title: "Mutations in LPIN1 cause recurrent acute myoglobinuria in childhood."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of six individuals who developed statin-induced myopathy, one was a carrier for Glu769Gly, a pathogenic mutation in the LPIN1 gene."
    explanation: Carrier-relevant counselling point.
diagnosis:
- name: Molecular genetic testing for biallelic LPIN1 variants
  description: >
    LPIN1 should be sequenced in any child with severe recurrent rhabdomyolysis once fatty
    acid oxidation defects are excluded, and included in adult rhabdomyolysis panels; targeted
    testing for the recurrent intragenic deletion allows fast diagnosis before biopsy. Rare
    compound heterozygous variants need functional confirmation.
  evidence:
  - reference: PMID:20583302
    reference_title: "LPIN1 gene mutations: a major cause of severe rhabdomyolysis in early childhood."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The high frequency of the intragenic LPIN1 deletion should provide a valuable criterion for fast diagnosis, prior to muscle biopsy."
    explanation: Diagnostic strategy built on the founder deletion.
  - reference: PMID:32522502
    reference_title: "First presentation of LPIN1 acute rhabdomyolysis in adolescence and adulthood."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "LPIN1 should be included on a panel of genes analysed in the investigation of adult individuals with rhabdomyolysis."
    explanation: Extends testing to adult presentations.
  - reference: PMID:32913636
    reference_title: "Detection of compound heterozygous variants in LPIN1 does not necessarily imply pathogenicity in a patient with rhabdomyolysis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Functional and biochemical tests should be carried out to confirm or exclude pathogenicity of the LPIN1 variants."
    explanation: Caution on variant interpretation.
- name: Serum creatine kinase and urine myoglobin during attacks
  description: Massive CK elevation with myoglobinuria during episodes, with AST paralleling CK, confirms rhabdomyolysis; values may be normal between attacks.
  evidence:
  - reference: PMID:35242575
    reference_title: "LPIN1 rhabdomyolysis: A single site cohort description and treatment recommendations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Creatinine kinase (CK) levels peak during our care averaged 607,725 units/L (range 157,000-1,100,000 units/L)."
    explanation: Laboratory hallmark of attacks.
- name: Cardiac evaluation and exercise testing
  description: >
    Resting echocardiography is usually normal, but exercise testing can reveal impaired
    peripheral muscle adaptation and cardiac MR spectroscopy may show intracardiac steatosis;
    ECG monitoring during attacks detects hyperkalaemic T-wave changes.
  evidence:
  - reference: PMID:29325813
    reference_title: "Cardiac function and exercise adaptation in 8 children with LPIN1 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The four patients assessed by cardiac 1H-magnetic resonance spectroscopy exhibited signs of intracardiac steatosis."
    explanation: Cardiac imaging finding.
differential_diagnoses:
- name: Inborn errors of glycogenolysis, fatty acid oxidation and oxidative phosphorylation
  description: >
    McArdle disease, CPT2 and VLCAD deficiency, and mitochondrial disorders (including the
    mtDNA cytochrome c oxidase-related recurrent myoglobinuria, MONDO:0010791) are the
    classical causes of recurrent myoglobinuria; LPIN1 explains a large share of the remaining
    early-childhood cases.
  distinguishing_features:
  - Onset before age six with normal acylcarnitine profile and no fatty acid oxidation enzyme defect
  - Lipid droplet accumulation without glycogen storage or ragged-red fibres
  - Biallelic LPIN1 variants, often the recurrent intragenic deletion
  evidence:
  - reference: PMID:18817903
    reference_title: "Mutations in LPIN1 cause recurrent acute myoglobinuria in childhood."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Recurrent episodes of life-threatening myoglobinuria in childhood are caused by inborn errors of glycogenolysis, mitochondrial fatty acid beta-oxidation, and oxidative phosphorylation. Nonetheless, approximately half of the patients do not suffer from a defect in any of these pathways."
    explanation: Places LPIN1 deficiency against the classical differential.
animal_models:
- name: Muscle-specific Lpin1 knockout mice
  species: Mouse
  genotype: Lpin1 exon 3-4 deletion (PAP-null hypomorph) or exon 7 deletion (protein-null), skeletal muscle-specific
  publication: PMID:30028636
  description: >
    Muscle-restricted models that avoid the lipodystrophy of the constitutive fld mouse; both
    show chronic myopathy with fibre necrosis and regeneration, phosphatidic acid and
    diacylglycerol accumulation, abnormal mitochondria with impaired autophagy, and increased
    CK after exhaustive unfed exercise. A Myf5-Cre knockout further shows loss of membrane
    integrity with apoptotic and necroptotic fibre death and reduced force.
  modeled_mechanisms:
  - target: Trigger-Induced Myofibre Necrosis
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Chronic necrosis-regeneration myopathy with exercise-provoked CK release rather than discrete life-threatening attacks.
    limitations: >-
      Mice develop a chronic myopathy, whereas patients are usually well between discrete
      catabolism-triggered attacks; the episodic, fever-triggered human phenotype is not
      reproduced.
    readouts:
    - name: Plasma creatine kinase after exhaustive unfed exercise
      target: Trigger-Induced Myofibre Necrosis
      direction: INCREASED
      interpretation: Provoked muscle injury in the model.
      evidence:
      - reference: PMID:30028636
        reference_title: "Loss of lipin 1-mediated phosphatidic acid phosphohydrolase activity in muscle leads to skeletal myopathy in mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Finally, these mice exhibited increased plasma creatine kinase following exhaustive exercise when unfed."
        explanation: Reports the CK readout.
    - name: Evans Blue Dye uptake and IgG staining of myofibres
      target: Trigger-Induced Myofibre Necrosis
      direction: INCREASED
      interpretation: Loss of sarcolemmal integrity in dying fibres.
      evidence:
      - reference: PMID:33113595
        reference_title: "Loss of membrane integrity drives myofiber death in lipin1-deficient skeletal muscle."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Moreover, Lipin1Myf5cKO muscle had significantly higher membrane disruptions, as evidenced by increased IgG staining and elevated uptake of Evans Blue Dye (EBD) and increased serum creatine kinase activity in Lipin1Myf5cKO muscle fibers."
        explanation: Reports the membrane-integrity readout.
    evidence:
    - reference: PMID:30028636
      reference_title: "Loss of lipin 1-mediated phosphatidic acid phosphohydrolase activity in muscle leads to skeletal myopathy in mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These data suggest that mice lacking lipin 1-mediated PAP activity in skeletal muscle may serve as a model for determining the mechanisms by which lipin 1 deficiency leads to myocyte injury and for testing potential therapeutic approaches."
      explanation: Authors' assessment of the model's relevance.
  - target: Sarcoplasmic Reticulum Stress
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Muscle-specific lipin-1 loss is sufficient to trigger SR stress, lipid accumulation and chaperone-responsive myopathy.
    limitations: >-
      The SR-stress branch has not been demonstrated in patient muscle, so its role in human
      attacks is inferred from the mouse.
    evidence:
    - reference: PMID:30420558
      reference_title: "Lipin1 deficiency causes sarcoplasmic reticulum stress and chaperone-responsive myopathy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Here, we show that lipin1 deficiency in mouse skeletal muscles is sufficient to trigger myopathy. Strikingly, muscle fibers display strong accumulation of both neutral and phospholipids."
      explanation: Establishes the model and its lipid phenotype.
experimental_models:
- name: Patient-derived lipin-1-deficient primary myoblasts
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: >
    Primary myoblasts and myotubes from patients, used to show loss of PAP-1 activity, lipid
    droplet accumulation, ACACB up-regulation, cytokine sensitivity, defective
    autophagosome-lysosome clearance and TLR9 activation by oxidised mitochondrial DNA.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  publication: PMID:34467247
  modeled_mechanisms:
  - target: Oxidized Mitochondrial DNA-TLR9 Inflammatory Signaling
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: Patient cells reproduce the endosomal mtDNA accumulation, TLR9 activation and caspase-dependent myolysis, and respond to hydroxychloroquine.
    limitations: >-
      Cultured myoblasts lack the contractile, metabolic and systemic context of an attack;
      the in vivo relevance rests on the compassionate hydroxychloroquine experience.
    evidence:
    - reference: PMID:34467247
      reference_title: "Compromised mitochondrial quality control triggers lipin1-related rhabdomyolysis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Here, we conduct a bedside-to-bench-and-back investigation to study the pathophysiology of lipin1 deficiency."
      explanation: Establishes the patient-cell system used for the mechanism.
discussions:
- discussion_id: lpin1_episodic_attack_mechanism_gap
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Trigger-Induced Myofibre Necrosis
  prompt: >
    What determines the transition from a clinically silent lipin-1-deficient muscle to
    massive acute myolysis during a febrile or catabolic trigger, and why are some patients
    spared between attacks while others develop chronic symptoms?
  rationale: >
    The TLR9 inflammatory model and the SR-stress model each explain part of the picture, but
    neither predicts which trigger will precipitate an attack in a given patient; the cohort
    literature states that the pathophysiological basis of the rhabdomyolysis has not been
    fully elucidated, and attacks can occur without any identified trigger.
  evidence:
  - reference: PMID:35242575
    reference_title: "LPIN1 rhabdomyolysis: A single site cohort description and treatment recommendations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Individuals with LPIN1 deficiency have early recurrent, life-threatening rhabdomyolysis but the full phenotypic spectrum and optimal treatment of the disorder remains unknown."
    explanation: Authors' statement of the outstanding gap.
- discussion_id: lpin1_mouse_chronic_myopathy_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Trigger-Induced Myofibre Necrosis
  prompt: >
    Do lipin-1-deficient mice, which show chronic myopathy and, in the constitutive model,
    lipodystrophy, model the episodic rhabdomyolysis of patients whose adipose tissue and
    interictal muscle are essentially normal?
  rationale: >
    The constitutive fld mouse is confounded by lipodystrophy that patients do not have, and
    muscle-specific knockouts show continuous necrosis-regeneration rather than discrete
    attacks; patient adipose tissue develops normally, and patient myoblasts show only minor
    changes in lipin-1 target gene expression. Findings from mice, including the SR-stress
    branch and TUDCA/bezafibrate responses, therefore need human confirmation.
  evidence:
  - reference: PMID:30028636
    reference_title: "Loss of lipin 1-mediated phosphatidic acid phosphohydrolase activity in muscle leads to skeletal myopathy in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "However, that mouse model is confounded by lipodystrophy not phenocopied in people."
    explanation: Authors acknowledge the mismatch of the constitutive model.
  - reference: PMID:28986436
    reference_title: "Normal human adipose tissue functions and differentiation in patients with biallelic LPIN1 inactivating mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Apparently, fat distribution and weight is normal in humans carrying LPIN1 inactivating mutations, but a detailed analysis of adipose tissue appearance and functions in these patients has not been available so far."
    explanation: Human adipose phenotype differs from the mouse.
notes: >
  Curated as a single Disease entry under MONDO:0009992 (OMIM 268200). The claim was first
  filed against the stub for MONDO:0010791 ("myoglobinuria, recurrent"), whose OMIM
  cross-reference (550500) is the mitochondrially inherited cytochrome c oxidase-related form;
  that stub was annotated and left in the queue, and the concept is recorded here only as a
  skos:relatedMatch. Sources: the 2008 gene-discovery paper, the 2010-2012 French cohort
  papers, the 2021 mechanism paper on mitochondrial quality control and TLR9, mouse
  muscle-specific knockout studies, the 2022 US cohort care recommendations, and the 2023
  corticosteroid and hydroxychloroquine reports. Deep research: Edison/falcon report
  research/LPIN1-Related_Recurrent_Myoglobinuria-deep-research-falcon.md (14/14 references
  verified; preflight-dr SKIP because MONDO records no causal gene for the originally targeted
  term, resolved manually via OMIM). Atypical presentations (adult-onset myasthenia with motor
  neuron dysfunction, PMID:33456573) are noted but not modelled as separate nodes. No
  GeneReviews chapter exists for this disorder.

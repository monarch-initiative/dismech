pathophysiology:
- name: HTT CAG Repeat Expansion
  conforms_to: "polyglutamine_expansion_proteotoxicity#Translated CAG / Polyglutamine Repeat Expansion"
  description: >-
    Huntington disease is caused by expansion of a CAG trinucleotide repeat in exon 1
    of the HTT gene beyond 36 repeats. The expanded repeat produces a mutant huntingtin
    protein with an elongated polyglutamine tract that confers a toxic gain of function.
    Repeat length inversely correlates with age of onset. Normal alleles have 6-26
    repeats; intermediate alleles (27-35) can expand in offspring; 36-39 repeats show
    reduced penetrance; 40+ repeats are fully penetrant.
  evidence:
  - reference: PMID:41130308
    reference_title: "Inhibiting Cytosine-Adenine-Guanine (CAG) repeat expansions as a therapeutic strategy for Huntington's disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Huntington's Disease (HD) became the first disease mapped to a single
      chromosome and associated with mutations in the huntingtin (HTT) gene,
      specifically expansions in the trinucleotide cytosine-adenine-guanine (CAG)
      within exon 1.
    explanation: >-
      Confirms the causative CAG repeat expansion in HTT exon 1.
  - reference: PMID:41233526
    reference_title: "Huntington disease: somatic expansion, pathobiology and therapeutics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Huntington disease is a fatal, inherited, neurodegenerative disease caused
      by a CAG repeat expansion in the huntingtin gene (HTT), resulting in a toxic
      polyglutamine tract in the huntingtin protein.
    explanation: >-
      Confirms the toxic polyglutamine tract from CAG expansion as the primary
      molecular cause.
  downstream:
  - target: Mutant Huntingtin Protein Aggregation
    description: >-
      Expanded CAG repeat produces mutant huntingtin with toxic polyglutamine tract
      that misfolds and aggregates.
  - target: Somatic CAG Repeat Expansion
    description: >-
      Germline CAG repeat undergoes further somatic expansion in post-mitotic
      striatal neurons, accelerating disease onset.
  - target: mHTT Suppression of Non-Homologous End Joining
    description: >-
      The inherited disease-length tract produces mutant huntingtin that
      associates with the Ku70-Ku80 end-joining machinery and inhibits
      double-strand break repair early, before somatic expansion begins.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - mutant huntingtin protein interaction with the Ku70-Ku80 heterodimer
    hypothesis_groups:
    - dsb_expansion_independent_driver
    evidence:
    - reference: PMID:42091595
      reference_title: "Double strand breaks drive toxicity in a Huntington's disease mouse model with or without somatic expansion."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The disease-length CAG tract leads to early inhibition of DSBR and
        accumulating DSBs over time ultimately kill neurons.
      explanation: >-
        Directly links the disease-length tract to early inhibition of
        double-strand break repair.
  - target: Uninterrupted CAG Tract Length and Loss of CAA Interruption
    description: >-
      The inherited expanded allele carries a specific repeat structure, and
      expanding the tract lengthens the run of uninterrupted CAG in alleles
      that lack the penultimate CAA interruption. Note the direction of this
      edge carefully: expansion sets the length of the uninterrupted run, but
      it does NOT create the loss-of-interruption variant, which is an
      independently inherited sequence change. This edge connects the allele to
      its repeat structure; it is not a claim that expansion removes the
      interruption.
    causal_link_type: DIRECT
- name: Uninterrupted CAG Tract Length and Loss of CAA Interruption
  biological_scale: MOLECULAR
  description: >-
    The glutamine-encoding repeat in HTT is normally (CAG)n-CAA-CAG: a
    penultimate CAA codon interrupts the pure CAG tract while encoding the same
    glutamine. Because CAA and CAG are synonymous, two alleles can encode an
    identical polyglutamine length while differing in the length of
    *uninterrupted* CAG at the DNA level. A loss-of-interruption (LOI) variant
    that removes the interrupting adenines yields a pure CAG tract and is
    associated with onset roughly 25 years earlier at matched polyglutamine
    length, and with increased somatic repeat instability. Conversely, patients
    retaining or duplicating the CAA interruption have later onset than their
    polyglutamine length predicts. The determinant of onset is therefore a
    property of the DNA sequence - its propensity for length instability, and
    hence its somatic expansion rate - rather than the length of the
    polyglutamine tract in the protein product. This node is why the KB models
    CAG tract structure separately from polyglutamine proteotoxicity, and it
    sits upstream of somatic expansion rather than of protein aggregation.
  biological_processes:
  - preferred_term: DNA repeat instability of the uninterrupted CAG tract
    modifier: DECREASED
    term:
      id: GO:0035753
      label: maintenance of DNA trinucleotide repeats
  evidence:
  - reference: PMID:31398342
    reference_title: "CAG Repeat Not Polyglutamine Length Determines Timing of Huntington's Disease Onset."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Variable, glutamine-encoding, CAA interruptions indicate that a property
      of the uninterrupted HTT CAG repeat sequence, distinct from the length of
      huntingtin's polyglutamine segment, dictates the rate at which
      Huntington's disease (HD) develops.
    explanation: >-
      The defining statement that onset is set by the uninterrupted CAG repeat
      at the DNA level rather than by polyglutamine length in the protein.
  - reference: PMID:31398342
    reference_title: "CAG Repeat Not Polyglutamine Length Determines Timing of Huntington's Disease Onset."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      suggesting that the special onset-determining property of the
      uninterrupted CAG repeat is a propensity for length instability that
      leads to its somatic expansion
    explanation: >-
      Identifies the mechanism connecting this node to the next: the
      onset-determining property of the uninterrupted tract is its instability,
      acting through somatic expansion.
  - reference: PMID:31104771
    reference_title: "Length of Uninterrupted CAG, Independent of Polyglutamine Size, Results in Increased Somatic Instability, Hastening Onset of Huntington Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      this LOI variant is associated with dramatically earlier AOO (average of
      25 years) despite the same polyglutamine length as in individuals with
      the interrupting penultimate CAA codon
    explanation: >-
      Quantifies the effect and provides the controlled comparison - matched
      polyglutamine length, differing uninterrupted CAG length, 25-year
      difference in age of onset.
  - reference: PMID:31104771

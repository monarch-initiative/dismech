- name: mHTT Suppression of Non-Homologous End Joining
  biological_scale: MOLECULAR
  description: >-
    Mutant huntingtin physically associates with the core non-homologous end
    joining (NHEJ) machinery and suppresses double-strand break repair (DSBR)
    activity. In HdhQ(150/150) mice, immunoprecipitation-mass spectrometry
    recovered the Ku70-Ku80 heterodimer as the principal huntingtin capture
    products (with DNA-PKcs as a minor product, and minor associations with
    Rad50 and RPA), whereas base excision repair, nucleotide excision
    repair/transcription-coupled repair and mismatch repair components showed
    few interactions. Correspondingly, multiplexed host-cell reactivation
    assays found BER, NER/TCR and MMR activity unchanged by genotype, while
    clearance of radiation-induced gamma-H2AX foci was delayed in disease
    striatal cells and tissue - breaks form normally but are repaired
    inefficiently. The deficit is genotype-, cell-type- and region-specific
    (striatum over cerebellum, neurons over glia) and appears before the onset
    of somatic expansion.
  locations:
  - preferred_term: striatum
    term:
      id: UBERON:0002435
      label: striatum
  cell_types:
  - preferred_term: medium spiny neuron
    term:
      id: CL:1001474
      label: medium spiny neuron
  biological_processes:

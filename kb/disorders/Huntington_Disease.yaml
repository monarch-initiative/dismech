- name: XJB-5-131 (Mitochondria-Targeted Antioxidant)
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    PRECLINICAL ONLY - no human trial has been conducted. XJB-5-131 is a
    synthetic antioxidant in which a tempol nitroxide radical-scavenging moiety
    is linked to a mitochondria-targeting carrier peptide derived from
    gramicidin S, concentrating the antioxidant at the mitochondrial membrane.
    By suppressing mitochondrial reactive oxygen species it prevents base
    oxidation and blocks the conversion of base excision repair single-strand
    break intermediates into double-strand breaks. In HdhQ(150/150) mice dosed
    at 2 mg/kg intraperitoneally three times weekly from 60 to 90 weeks - that
    is, started only after double-strand breaks had accumulated and disease was
    well established - it reduced striatal neuronal gamma-H2AX staining and
    neutral comet tail moments, restored NeuN staining, and improved motor
    performance, with no substantial change in somatic CAG tract length. That
    dissociation is the interventional basis for treating double-strand breaks
    as a therapeutic target separable from somatic expansion.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: XJB-5-131
      term:
        id: CHEBI:173099
        label: XJB-5-131
  target_mechanisms:
  - target: Oxidative Single-Strand to Double-Strand Break Conversion
    treatment_effect: INHIBITS
    description: >-
      Mitochondrial localisation of the nitroxide lowers the reactive oxygen
      species load that drives endogenous base oxidation, reducing the supply of
      single-strand break intermediates that convert to double-strand breaks.
      The drug acts on break formation upstream; it does not restore
      non-homologous end joining.
    evidence:
    - reference: PMID:23122961
      reference_title: "Targeting of XJB-5-131 to mitochondria suppresses oxidative DNA damage and motor decline in a mouse model of Huntington's disease."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        XJB-5-131 reduces oxidative damage to mitochondrial DNA, maintains
        mitochondrial DNA copy number, suppresses motor decline and weight loss,
        enhances neuronal survival, and improves mitochondrial function.
      explanation: >-
        Establishes the drug's mechanism as suppression of mitochondrial
        oxidative DNA damage, the input to the SSB-to-DSB conversion node.
  - target: Genome-Wide Double Strand Break Accumulation
    treatment_effect: INHIBITS
    description: >-
      Thirty weeks of treatment begun at 60 weeks lowered striatal neuronal
      double-strand break burden by both gamma-H2AX immunofluorescence and
      neutral comet assay, and rescued striatal neuron number and motor
      performance, while somatic tract length was substantially unchanged.
    evidence:
    - reference: PMID:42091595
      reference_title: "Double strand breaks drive toxicity in a Huntington's disease mouse model with or without somatic expansion."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Conversely, suppression of DSBs is sufficient to reverse neuropathology
        even when somatic expansion is active.
      explanation: >-
        The interventional result linking pharmacological double-strand break
        suppression to reversal of neuropathology with expansion ongoing.
  evidence:
  - reference: PMID:26908614
    reference_title: "Mitochondrial targeting of XJB-5-131 attenuates or improves pathophysiology in HdhQ150 animals with well-developed disease phenotypes."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We have developed a novel synthetic antioxidant, XJB-5-131, which directly
      targets MT, the primary site and primary target of oxidative damage.
    explanation: >-
      Describes the agent and its mitochondrial targeting.
  - reference: PMID:26908614
    reference_title: "Mitochondrial targeting of XJB-5-131 attenuates or improves pathophysiology in HdhQ150 animals with well-developed disease phenotypes."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In animals with well-developed pathology, XJB-5-131 promotes weight gain,
      prevents neuronal death, reduces oxidative damage in neurons, suppresses
      the decline of motor performance or improves it
    explanation: >-
      Establishes efficacy when dosing begins after disease onset in the same
      HdhQ150 model, which is the regimen used in the 2026 double-strand break
      study.
  - reference: PMID:23122961
    reference_title: "Targeting of XJB-5-131 to mitochondria suppresses oxidative DNA damage and motor decline in a mouse model of Huntington's disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      To increase specificity and efficacy, we have designed a synthetic
      antioxidant, XJB-5-131, to target mitochondria.
    explanation: >-
      Original description of the compound's design rationale.
  notes: >-
    Preclinical only - mouse, and in the 2026 double-strand break study male
    mice only. There is no clinical trial and no NCT identifier, so no entry is
    made under clinical_trials. Curators should note an unresolved discrepancy
    in the effect on somatic expansion between two reports from the same group:
    Budworth et al. 2015 (PMID:26247199) reported that XJB-5-131 inhibits
    lengthening of the repeat tract in HdhQ(150) mice treated early, whereas
    Polyzos et al. 2026 (PMID:42091595) reports no substantial impact on somatic
    expansion in congenic HdhQ(150/150) mice treated from 60 weeks. The regimens,
    zygosity and treatment windows differ. This is recorded as the discussion
    controversy_hd_xjb_effect_on_somatic_expansion.
animal_models:
- name: R6/2 transgenic mouse
  species: Mouse
  genotype: R6/2 Transgenic
  description: Mice expressing human mutant huntingtin with expanded CAG repeats used to model motor and cognitive deficits.
  associated_phenotypes:
  - Progressive Motor Dysfunction
  - Cognitive Impairment
  - Weight Loss
  evidence:
  - reference: PMID:18638556
    reference_title: "Rodent genetic models of Huntington disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Huntington disease (HD) is a dominantly inherited human neurodegenerative disorder characterized by motor deficits, cognitive impairment, and psychiatric symptoms leading to inexorable decline and death. Since the identification of the huntingtin gene and the characteristic expanded CAG repeat/polyglutamine mutation, multiple murine genetic models and one rat genetic model have been generated.
    explanation: This reference supports the statement as it describes Huntington's disease as involving motor deficits and cognitive impairment, and mentions the use of murine genetic models, including transgenic ones with expanded CAG repeats like the R6/2 model.
  - reference: PMID:35007790
    reference_title: "Hypothalamic expression of huntingtin causes distinct metabolic changes in Huntington's disease mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: We used the R6/2 and BACHD mouse models that express different lengths of mutant HTT to develop lean- and obese phenotypes, respectively. We utilized adeno-associated viral vectors to overexpress either mutant or wild-type HTT in the hypothalamus of R6/2, BACHD, and their wild-type littermates. The metabolic phenotype was assessed by body weight measurements over time and body composition analysis using dual-energy x-ray absorptiometry at the endpoint.
    explanation: This reference supports the statement by describing the use of R6/2 mice, which express mutant HTT, to study metabolic phenotypes including weight changes, indicating weight loss as part of the disease phenotype.
  - reference: PMID:29856017
    reference_title: "Motor Assessment in Huntington's Disease Mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Motor deficits are a characteristic consequence of striatal damage, whether induced by experimental lesions, or in genetic models of Huntington's disease involving polyglutamine expansion in the huntingtin protein.
    explanation: This reference supports the statement by confirming that motor deficits are a characteristic consequence of genetic models of Huntington's disease, including those with polyglutamine expansion such as the R6/2 model.
  - reference: PMID:31868674
    reference_title: "Correlations Between Mutant Huntingtin Aggregates and Behavioral Changes in R6/1 Mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: 'Huntington''s disease (HD) is a neurodegenerative disorder caused by the expansion of the trinucleotide CAG in the HD gene. While the presence of nuclear aggregates of mutant huntingtin (mHtt) in neurons is a hallmark of HD, the reason behind its toxicity remains elusive. OBJECTIVE: The present study was conducted to assess a correlation between the number of mHtt aggregates and the severity of HD symptoms in R6/1 mice.'
    explanation: This reference supports the statement by describing the use of R6/1 mice, a similar model to R6/2, to study the correlation between mutant huntingtin aggregates and the severity of HD symptoms, including motor and cognitive deficits.
  - reference: PMID:15525658
    reference_title: "Orexin loss in Huntington's disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: We describe for the first time a dramatic atrophy and loss of orexin neurons in the lateral hypothalamus of R6/2 mice. Importantly, we also found a significant atrophy and loss of orexin neurons in Huntington patients.
    explanation: This reference supports the statement by describing the use of R6/2 mice to model Huntington's disease, noting significant neuronal changes that correlate with the disease phenotype.
- name: Congenic HdhQ(150/150) knock-in mouse
  species: Mouse
  genotype: Hdh CAG(150) homozygous knock-in (HdhQ150), congenic on C57BL/6J
  background: C57BL/6J, backcrossed more than 15 generations to a congenic (clonal) line
  publication: PMID:42091595
  description: >-
    Knock-in of an approximately 150-unit CAG tract into the endogenous mouse
    Hdh locus, the closest available genetic replica of the human mutation. The
    congenic derivation is deliberate: because every animal is essentially a
    genetic clone expressing the same proteins at the same level, variance
    between animals in DNA repair protein expression is suppressed, which is
    what makes small repair-activity differences between genotypes detectable.
    Disease course: double-strand breaks from 7-10 weeks, somatic expansion
    onset ~11-12 weeks, motor abnormalities ~20 weeks, striatal neuron loss
    ~60 weeks, with the cerebellum spared.
  associated_phenotypes:
  - Gait Disturbance
  - Involuntary Movements
  - Weight Loss
  modeled_mechanisms:
  - target: mHTT Suppression of Non-Homologous End Joining
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Disease-genotype glia and striatal tissue induce double-strand breaks
      normally after ionising radiation but clear them inefficiently, while
      base excision, nucleotide excision and mismatch repair activities are
      unchanged by genotype - a repair deficit selective for the pathway whose
      components co-immunoprecipitate with huntingtin.
    limitations: >-
      The repair deficit is inferred from clearance of exogenously induced
      (2 Gy in vitro, 5 Gy in vivo) breaks rather than from endogenous repair
      kinetics, so the measured quantity is the response to an acute
      supraphysiological insult. All experiments used male mice only. The model
      carries a mouse Hdh knock-in of ~150 CAG, a repeat length that in humans
      would cause childhood-onset disease, so it does not model the adult-onset
      expansion trajectory. No corresponding NHEJ deficit has been demonstrated
      in human HD tissue.
    readouts:
    - name: Clearance of radiation-induced gamma-H2AX foci in striatal cells
      target: mHTT Suppression of Non-Homologous End Joining
      direction: DECREASED
      interpretation: >-
        Foci induction was equivalent between genotypes, but loss of foci over
        1-24 h in vitro and 2-4 h in vivo was slower in disease striatum,
        indicating suppressed double-strand break repair rather than increased
        break formation.
      evidence:
      - reference: PMID:42091595
        reference_title: "Double strand breaks drive toxicity in a Huntington's disease mouse model with or without somatic expansion."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          The site-specific increases in CAG tract length are driven by active
          mismatch repair (MMR), while DSBs occur genome-wide and are driven by
          mutant huntingtin-mediated suppression of nonhomologous joining of DNA
          broken ends.
        explanation: >-
          Reports suppression of non-homologous end joining as the measured
          defect underlying this readout.
    evidence:
    - reference: PMID:42091595
      reference_title: "Double strand breaks drive toxicity in a Huntington's disease mouse model with or without somatic expansion."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The disease-length CAG tract leads to early inhibition of DSBR and
        accumulating DSBs over time ultimately kill neurons.
      explanation: >-
        Supports treating this model as informative for early inhibition of
        double-strand break repair.
  - target: Genome-Wide Double Strand Break Accumulation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Unrepaired double-strand breaks rise with age in striatal neurons and
      remain modest in cerebellum, reproducing the regional and cell-type
      selectivity of human striatal vulnerability. Concordant across four
      independent markers.
    limitations: >-
      Male mice only. Break burden in human HD striatum has not been quantified
      with comparable methods, so the correspondence to human disease is
      inferred from the matching anatomical pattern rather than measured.
    readouts:
    - name: Striatal neuronal gamma-H2AX immunofluorescence intensity
      target: Genome-Wide Double Strand Break Accumulation
      direction: INCREASED
      interpretation: >-
        Elevated in NeuN-positive striatal neurons of disease animals versus
        wild type at both young and old ages; modest in cerebellum in both
        genotypes.
      evidence:
      - reference: PMID:42091595
        reference_title: "Double strand breaks drive toxicity in a Huntington's disease mouse model with or without somatic expansion."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          we report that DSBs drive neuropathology in male HdhQ(150/150) mice,
          regardless of somatic expansion of the inherited disease allele
        explanation: >-
          Reports elevated double-strand breaks in this model as the basis for
          the neuropathology claim.
    - name: Neutral comet assay tail moment in dispersed striatal cells
      target: Genome-Wide Double Strand Break Accumulation
      direction: INCREASED
      interpretation: >-
        Direct physical measurement of DNA breakage, confirming that the
        antibody-based markers reflect real double-strand breaks rather than
        signalling changes.
      evidence:
      - reference: PMID:42091595
        reference_title: "Double strand breaks drive toxicity in a Huntington's disease mouse model with or without somatic expansion."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          We propose that CAG expansion and DSBs promote downstream neuronal
          pathology as separable drivers.
        explanation: >-
          Frames the measured break burden as an independent pathological
          driver in this model.
    evidence:
    - reference: PMID:11152661
      reference_title: "Neurological abnormalities in a knock-in mouse model of Huntington's disease."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Mice with alleles of approximately 150 units in length exhibit
        late-onset behavioral and neuroanatomic abnormalities consistent with HD.
      explanation: >-
        Establishes the HdhQ150 knock-in line as a phenotypically valid HD model
        for the mechanism claims built on it.
  - target: Oxidative Single-Strand to Double-Strand Break Conversion
    relationship: RESCUES
    fidelity: MODERATE
    description: >-
      The XJB-5-131 treatment arm. Animals aged to 60 weeks to allow break
      accumulation, then dosed 2 mg/kg intraperitoneally three times weekly for
      30 weeks to 90 weeks, against a saline vehicle control. Suppressing
      reactive oxygen species lowered break burden and rescued neuropathology
      without materially changing somatic tract length.
    limitations: >-
      The rescue demonstrates that lowering break burden is sufficient to
      improve outcome; it does not show that non-homologous end joining was
      restored, since the drug acts upstream on break formation. Male mice
      only, n = 3 per group. The reported absence of an effect on somatic
      expansion conflicts with an earlier report from the same group in
      differently treated HdhQ(150) animals - see the discussion
      controversy_hd_xjb_effect_on_somatic_expansion.
    readouts:
    - name: Striatal neuronal gamma-H2AX intensity after 30 weeks of XJB-5-131
      target: Oxidative Single-Strand to Double-Strand Break Conversion
      direction: DECREASED
      interpretation: >-
        Vehicle-treated disease animals showed roughly doubled neuronal
        gamma-H2AX versus wild type; treatment inhibited the increase.
      evidence:
      - reference: PMID:42091595
        reference_title: "Double strand breaks drive toxicity in a Huntington's disease mouse model with or without somatic expansion."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Conversely, suppression of DSBs is sufficient to reverse
          neuropathology even when somatic expansion is active.
        explanation: >-
          Reports the treatment-driven reduction in double-strand breaks and the
          resulting reversal of neuropathology.
    evidence:
    - reference: PMID:42091595
      reference_title: "Double strand breaks drive toxicity in a Huntington's disease mouse model with or without somatic expansion."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Conversely, suppression of DSBs is sufficient to reverse neuropathology
        even when somatic expansion is active.
      explanation: >-
        Supports this model plus treatment arm as informative for the
        oxidation-driven break-formation node.
  - target: Medium Spiny Neuron Degeneration
    relationship: RESCUES
    fidelity: MODERATE
    description: >-
      The downstream survival arm of the same XJB-5-131 treatment experiment.
      Lowering the double-strand break burden rescued striatal neuron number and
      motor performance, which is the outcome that makes break burden a
      therapeutic target rather than merely a correlate.
    limitations: >-
      Neuronal rescue is measured by NeuN immunofluorescence rather than by
      stereological cell counts. Male mice only, n = 3 per group, and treatment
      began at 60 weeks so the result speaks to halting further loss in
      established disease rather than to preventing onset. The drug acts
      upstream on break formation, so this rescue does not show that
      non-homologous end joining was restored.
    readouts:
    - name: Striatal NeuN immunofluorescence after 30 weeks of XJB-5-131
      target: Medium Spiny Neuron Degeneration
      direction: RESTORED
      interpretation: >-
        Neuronal marker staining recovered in treated disease animals,
        indicating rescue of striatal neuron loss alongside the fall in break
        burden.
      evidence:
      - reference: PMID:26908614
        reference_title: "Mitochondrial targeting of XJB-5-131 attenuates or improves pathophysiology in HdhQ150 animals with well-developed disease phenotypes."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          In animals with well-developed pathology, XJB-5-131 promotes weight
          gain, prevents neuronal death, reduces oxidative damage in neurons,
          suppresses the decline of motor performance or improves it
        explanation: >-
          Reports prevention of neuronal death under the same late-start dosing
          regimen in the same model.
    evidence:
    - reference: PMID:26908614
      reference_title: "Mitochondrial targeting of XJB-5-131 attenuates or improves pathophysiology in HdhQ150 animals with well-developed disease phenotypes."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In animals with well-developed pathology, XJB-5-131 promotes weight
        gain, prevents neuronal death, reduces oxidative damage in neurons,
        suppresses the decline of motor performance or improves it
      explanation: >-
        Supports this model plus treatment arm as informative for rescue of
        striatal neuron degeneration.
  notes: >-
    Parental HdhQ(-/150) line a gift from P. Detloff; congenic line generated by
    backcrossing to C57BL/6J for more than 15 generations. All experiments in
    PMID:42091595 used male mice.
- name: zQ175 knock-in mouse
  species: Mouse
  genotype: Htt CAG(175-190) knock-in (zQ175)
  publication: PMID:27378694
  description: >-
    Knock-in model carrying a CAG tract of approximately 175-190 that develops
    transcriptional dysregulation and protein aggregation by 6 months and
    undergoes somatic expansion. Used here as the expansion-competent
    comparator against zQ175/MSH3(-/-).
  modeled_mechanisms:
  - target: Genome-Wide Double Strand Break Accumulation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      53BP1 and gamma-H2AX staining intensity is elevated in zQ175 striatal
      neurons relative to C57BL/6J background controls at 3 months and rises a
      further 30-50% by 6 months.
    limitations: >-
      Break levels were quantified by antibody staining intensity only in this
      strain, without the neutral comet confirmation applied in HdhQ(150/150).
      The strain carries a much longer repeat than adult-onset human disease.
    readouts:
    - name: Striatal neuronal 53BP1 immunofluorescence intensity
      target: Genome-Wide Double Strand Break Accumulation
      direction: INCREASED
      interpretation: >-
        Elevated versus genetic background control and increasing between 3 and
        6 months, in a strain that expresses mutant huntingtin.
      evidence:
      - reference: PMID:42091595
        reference_title: "Double strand breaks drive toxicity in a Huntington's disease mouse model with or without somatic expansion."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          DSBs and transcriptional dysfunction occur in animals that cannot
          somatically expand their inherited allele.
        explanation: >-
          Reports the double-strand break measurements made across the zQ175 and
          zQ175/MSH3(-/-) comparison.
    evidence:
    - reference: PMID:27378694
      reference_title: "An enhanced Q175 knock-in mouse model of Huntington disease with higher mutant huntingtin levels and accelerated disease phenotypes."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The zQ175 model was the first KI mouse to exhibit significant HD-like
        phenotypes when heterozygous.
      explanation: >-
        Establishes zQ175 as a phenotypically validated knock-in HD model.
- name: zQ175/MSH3(-/-) expansion-incompetent knock-in mouse
  species: Mouse
  genotype: Htt CAG(175-190) knock-in on an Msh3 null background
  publication: PMID:38387080
  description: >-
    Separation-of-function cross. Because somatic CAG expansion requires MutS
    beta (MSH2-MSH3), ablating Msh3 abolishes expansion while leaving mutant
    huntingtin expression intact. This dissociates the two candidate drivers:
    any pathology that persists in these animals cannot be attributed to
    ongoing somatic expansion. Double-strand breaks are elevated and rise with
    age here just as in expansion-competent zQ175, and transcriptional
    dysfunction and aggregation still develop.
  modeled_mechanisms:
  - target: Somatic CAG Repeat Expansion
    relationship: FAILS_TO_RECAPITULATE
    fidelity: HIGH
    description: >-
      By design this model does not reproduce somatic CAG expansion - Msh3
      ablation prevents it throughout brain and periphery. The negative result
      is the point of the model, not a shortcoming of it: it is what licenses
      attributing the residual pathology to an expansion-independent driver.
    limitations: >-
      Msh3 is ablated constitutively and germline-wide rather than conditionally
      in striatal neurons, so loss of any expansion-independent MSH3 function is
      not controlled for. The starting repeat of ~185 CAG already exceeds the
      proposed pathogenic threshold, so absence of further expansion may matter
      less in this strain than it would at shorter adult-onset repeat lengths -
      the authors of the source study make exactly this argument.
    readouts:
    - name: Somatic CAG repeat expansion in striatum
      target: Somatic CAG Repeat Expansion
      direction: ABOLISHED
      interpretation: >-
        Msh3 ablation prevents somatic expansion in brain and periphery, while
        50% reduction slows it - a dose-dependent confirmation that the
        expansion arm is switched off in this cross.
      evidence:
      - reference: PMID:38387080
        reference_title: "A CAG repeat threshold for therapeutics targeting somatic instability in Huntington's disease."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Ablation of Msh3 prevented somatic expansion throughout the brain and
          periphery, and reduction of Msh3 by 50% decreased the rate of
          expansion.
        explanation: >-
          Directly reports that this cross does not undergo somatic expansion.
    evidence:
    - reference: PMID:38387080
      reference_title: "A CAG repeat threshold for therapeutics targeting somatic instability in Huntington's disease."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        This had no effect on the deposition of huntingtin aggregation in the
        nuclei of striatal neurons, nor on the dysregulated striatal
        transcriptional profile.
      explanation: >-
        Abolishing somatic expansion leaves striatal aggregation and
        transcriptional dysregulation intact, which is the substantive negative
        result this model contributes.
  - target: Genome-Wide Double Strand Break Accumulation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Double-strand breaks accumulate in these expansion-incompetent animals to
      the same degree as in expansion-competent zQ175 - elevated at 3 months and
      30-50% higher by 6 months relative to Msh3(-/-) background controls. This
      is the strongest genetic evidence that break accumulation does not require
      somatic expansion.
    limitations: >-
      The study established that breaks and transcriptional dysfunction
      co-occur in these animals but did not test whether the breaks cause the
      transcriptional dysfunction. Neuronal death is not observed at these ages
      in either strain, so the model demonstrates expansion-independent break
      accumulation rather than expansion-independent neurodegeneration.
    readouts:
    - name: Striatal neuronal 53BP1 immunofluorescence intensity at 3 and 6 months
      target: Genome-Wide Double Strand Break Accumulation
      direction: INCREASED
      interpretation: >-
        Elevated relative to Msh3(-/-) background controls despite the complete
        absence of somatic expansion, separating break burden from tract length.
      evidence:
      - reference: PMID:42091595
        reference_title: "Double strand breaks drive toxicity in a Huntington's disease mouse model with or without somatic expansion."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          DSBs and transcriptional dysfunction occur in animals that cannot
          somatically expand their inherited allele.
        explanation: >-
          States precisely the result this readout captures.
    evidence:
    - reference: PMID:42091595
      reference_title: "Double strand breaks drive toxicity in a Huntington's disease mouse model with or without somatic expansion."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We propose that CAG expansion and DSBs promote downstream neuronal
        pathology as separable drivers.
      explanation: >-
        Supports treating this cross as informative for expansion-independent
        double-strand break accumulation.

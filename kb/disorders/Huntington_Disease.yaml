    reference_title: "Double strand breaks drive toxicity in a Huntington's disease mouse model with or without somatic expansion."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The site-specific increases in CAG tract length are driven by active
      mismatch repair (MMR), while DSBs occur genome-wide and are driven by
      mutant huntingtin-mediated suppression of nonhomologous joining of DNA
      broken ends.
    explanation: >-
      States the central claim of this node - that mutant huntingtin suppresses
      non-homologous end joining - and separates it from the MMR-driven
      expansion mechanism.
  - reference: PMID:42091595
    reference_title: "Double strand breaks drive toxicity in a Huntington's disease mouse model with or without somatic expansion."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The disease-length CAG tract leads to early inhibition of DSBR and
      accumulating DSBs over time ultimately kill neurons.
    explanation: >-
      Places inhibition of double-strand break repair upstream and early,

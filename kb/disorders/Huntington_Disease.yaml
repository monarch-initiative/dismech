- discussion_id: mismatch_hd_dsbr_absent_from_human_gwas
  prompt: >-
    Mouse data make mutant-huntingtin suppression of non-homologous end joining
    an early driver of HD neuropathology, yet no DSBR or NHEJ gene has emerged
    from human HD onset GWAS, where the modifier signal is dominated by mismatch
    repair and FAN1. Does impaired double-strand break repair operate in human
    HD brain, or is this a property of the mouse models?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#mHTT Suppression of Non-Homologous End Joining
  - pathophysiology#Genome-Wide Double Strand Break Accumulation
  rationale: >-
    This is a translational-validity question rather than an absence of
    evidence: the mouse evidence is direct (huntingtin-Ku70/Ku80
    co-immunoprecipitation, pathway-selective repair deficit, delayed break
    clearance, four concordant break markers), but the corresponding human
    genetic signal is missing. The authors offer a reconciliation that is
    plausible and untested - double-strand breaks form at effectively random
    genomic positions and so vary between patients, and non-homologous end
    joining in mutant-huntingtin-expressing cells is inefficient rather than
    absent, so a partial effect may not reach genome-wide significance in onset
    association studies. Two further considerations cut against dismissing the
    mismatch. GWAS onset modifiers detect variance in the timing of onset, which
    need not be the same quantity as the mechanism driving degeneration once the
    disease-length allele is inherited; and Ligase IV, an NHEJ component, has
    surfaced in a mouse CRISPR screen as a repressor of CAG expansion, implying
    that NHEJ genes may act on both axes and confound a simple modifier readout.
    Until double-strand break burden and end-joining activity are measured
    directly in human HD brain, the expansion-independent driver arm should be
    treated as demonstrated in mouse and unconfirmed in human.
  proposed_experiments:
  - experiment_id: exp_hd_human_striatal_dsb_burden
    name: Quantify double-strand break burden in human HD post-mortem striatum
    description: >-
      Apply the marker panel used in mouse (gamma-H2AX, 53BP1, pKAP-1 with
      NeuN co-staining, plus neutral comet on dispersed cells) to post-mortem
      striatum and cerebellum from HD mutation carriers across disease stages
      and matched controls, testing whether break burden is elevated,
      striatum-selective and neuron-selective as predicted.
  - experiment_id: exp_hd_patient_neuron_repair_landscape
    name: Measure end-joining activity in patient-derived neurons
    description: >-
      Run multiplexed host-cell reactivation across the five major repair
      pathways in isogenic patient-derived and CAG-corrected striatal neurons,
      testing whether the deficit is selective for double-strand break repair
      as it is in mouse glia and whether it scales with repeat length.
  - experiment_id: exp_hd_targeted_dsbr_gene_burden
    name: Targeted DSBR gene burden testing in HD onset cohorts
    description: >-
      Rather than relying on genome-wide significance, test a pre-specified set
      of NHEJ and DSBR genes for association with residual age of onset in
      existing HD GWAS cohorts, which has the power to detect the partial effect
      the authors predict would be missed by an unbiased scan.
  evidence:
  - reference: PMID:42091595
    reference_title: "Double strand breaks drive toxicity in a Huntington's disease mouse model with or without somatic expansion."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The site-specific increases in CAG tract length are driven by active
      mismatch repair (MMR), while DSBs occur genome-wide and are driven by
      mutant huntingtin-mediated suppression of nonhomologous joining of DNA
      broken ends.
    explanation: >-
      The mouse claim whose human counterpart is unconfirmed.
- discussion_id: gap_hd_dsb_transcriptional_causality
  prompt: >-
    Do accumulating double-strand breaks cause the transcriptional dysfunction
    seen in HD striatal neurons - through error-prone end-joining variants and
    transcription blockade at unrepaired breaks - or do the two simply arise in
    parallel from mutant huntingtin?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Genome-Wide Double Strand Break Accumulation
  - pathophysiology#Transcriptional Dysregulation
  rationale: >-
    The source study is explicit that this was not tested: double-strand break
    accumulation was shown to coincide with transcriptional dysfunction in both
    zQ175 and zQ175/MSH3(-/-) mice regardless of somatic expansion, but no
    experiment established the causal direction. The authors also note a
    tension in their own model - transcriptional changes in HD are reproducible
    between studies, which is difficult to derive from breaks distributed at
    random across the genome. Their proposed resolution is that repair at
    preferred sites (clustered single-strand breaks at neuronal gene enhancers,
    where SAR-seq peaks co-localise with PARP and XRCC1) yields recurrent
    variants while random breaks elsewhere contribute undetectably. The edge
    from Genome-Wide Double Strand Break Accumulation to Transcriptional
    Dysregulation is therefore curated with causal_link_type
    INDIRECT_UNKNOWN_INTERMEDIATES and PARTIAL evidence.
  proposed_experiments:
  - experiment_id: exp_hd_dsb_transcriptome_time_course
    name: Temporal ordering of break burden and transcriptome change
    description: >-
      Dense time-course sampling of matched striatal tissue for break markers
      and RNA-seq in HdhQ(150/150) mice, testing whether break burden rises
      before the transcriptional signature diverges.
  - experiment_id: exp_hd_xjb_transcriptome_endpoint
    name: Break suppression as a transcriptome intervention
    description: >-
      Repeat the XJB-5-131 late-start regimen with striatal RNA-seq as the
      primary endpoint, testing whether lowering break burden corrects the
      transcriptional signature and not only neuron number and motor score.
  - experiment_id: exp_hd_repair_junction_mapping
    name: Map repair junctions against dysregulated genes
    description: >-
      Sequence end-joining repair junctions genome-wide in aged disease striatum
      and test whether somatic variants are enriched at the regulatory elements
      of the genes that are transcriptionally dysregulated, as the clustered-SSB
      hypothesis predicts.
  evidence:
  - reference: PMID:42091595
    reference_title: "Double strand breaks drive toxicity in a Huntington's disease mouse model with or without somatic expansion."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      DSBs and transcriptional dysfunction occur in animals that cannot
      somatically expand their inherited allele.
    explanation: >-
      Establishes co-occurrence, which is what makes the causal direction an
      open question rather than a settled edge.
- discussion_id: controversy_hd_xjb_effect_on_somatic_expansion
  prompt: >-
    Does XJB-5-131 suppress somatic CAG expansion? Two reports from the same
    laboratory in the same mouse model disagree.
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#Somatic CAG Repeat Expansion
  - pathophysiology#Oxidative Single-Strand to Double-Strand Break Conversion
  rationale: >-
    Budworth et al. 2015 reported that XJB-5-131 inhibits lengthening of the
    repeat tract in HdhQ(150) mice and that this correlated with rescue of motor
    decline, framing the drug as an expansion suppressor. Polyzos et al. 2026
    reports that in congenic HdhQ(150/150) mice the same compound rescues
    neuropathology with no substantial impact on somatic expansion, and uses
    that dissociation as a central argument for double-strand breaks being an
    expansion-independent driver. The two studies differ in zygosity, in the
    congenic background, and above all in treatment window - early dosing in the
    2015 study versus dosing begun at 60 weeks in the 2026 study, by which point
    most expansion has already occurred. A treatment that slows the rate of
    expansion would look effective when started early and ineffective when
    started late, which would reconcile the reports without either being wrong.
    This matters beyond bookkeeping: if XJB-5-131 does suppress expansion under
    some regimens, then the late-start experiment is the only one that cleanly
    separates the two drivers, and the separability argument rests on it alone.
    Curators should not assert either effect as settled.
  evidence:
  - reference: PMID:26247199
    reference_title: "Suppression of Somatic Expansion Delays the Onset of Pathophysiology in a Mouse Model of Huntington's Disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      a pharmacological inhibitor, XJB-5-131, inhibits the lengthening of the
      repeat tracks, and correlates with rescue of motor decline in these animals
    explanation: >-
      The 2015 claim that XJB-5-131 inhibits repeat lengthening.
  - reference: PMID:42091595
    reference_title: "Double strand breaks drive toxicity in a Huntington's disease mouse model with or without somatic expansion."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Conversely, suppression of DSBs is sufficient to reverse neuropathology
      even when somatic expansion is active.
    explanation: >-
      The 2026 position that rescue occurs while somatic expansion continues,
      which is in tension with XJB-5-131 acting as an expansion suppressor under
      this regimen.
references:
- reference: PMID:20301482
  title: "Huntington Disease."
  tags:
  - GeneReviews
  findings:
  - statement: >-
      HD manifests typically in adult life but childhood onset does occur, with a median
      survival of 15 to 18 years after onset.
    supporting_text: >-
      HD typically manifests in adult life with mean age of onset around 40-50 years,
      although childhood onset and late onset do occur.
  - statement: >-
      Expansion of the HTT CAG repeat is strongly biased toward paternal transmission,
      while contraction is biased toward maternal transmission. This is the general-HD
      basis of the roughly 80% paternal transmission seen in juvenile-onset disease.
    supporting_text: >-
      Expansion and contraction of CAG repeat length can occur with maternal or
      paternal transmission; however, expansion occurs far more commonly in paternal
      transmission and contraction occurs more commonly in maternal transmission.
datasets:
- accession: ega:EGAS00001006472
  title: Multiple Tissue Monitoring in Huntington disease - RNAseq fibroblasts
  description: We examined whether peripheral tissues can serve as a source of readily accessible biological signatures at the RNA and protein level in Huntington disease (HD) patients. Under the MTM-HD study we generated large, high-quality human datasets from skeletal muscle, skin and adipose tissue, as well as primary human fibroblast lines to probe molecular changes in human pre-manifest and early manifest HD patients. We document the involvement of inflammation, energy metabolism and extracellular vesicle homeostasis. This demonstrates the potential to identify biological signatures from peripheral tissues in HD suitable as biomarkers in clinical trials.

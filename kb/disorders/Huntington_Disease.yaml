- name: Paternal Germline CAG Repeat Instability and Anticipation
  subtypes:
  - Juvenile HD
  biological_scale: MOLECULAR
  description: >-
    The HTT CAG tract is meiotically unstable, and the largest intergenerational
    expansions occur during male gametogenesis. Juvenile-onset HD is therefore
    overwhelmingly a paternally transmitted phenomenon: pooled across juvenile-onset
    series the mutant allele is inherited from the father in about 80% of cases, and
    the resulting anticipation is what carries an allele from the adult-onset range
    in the transmitting parent into the very long juvenile range in the child. This
    node is the germline counterpart of the somatic instability that operates within
    an affected individual's own striatal neurons: the same repeat-length-dependent
    instability acts once in the paternal germline to set the inherited allele, and
    again post-zygotically in post-mitotic neurons.
  biological_processes:
  - preferred_term: loss of fidelity in maintaining the HTT CAG trinucleotide repeat
    term:
      id: GO:0035753
      label: maintenance of DNA trinucleotide repeats
    modifier: DECREASED
  - preferred_term: male meiosis, the cell-division context in which the expansion occurs
    term:
      id: GO:0007140
      label: male meiotic nuclear division
  notes: >-
    Ontology note on the two biological_processes terms. GO:0035753 (maintenance of DNA
    trinucleotide repeats) is the node's actual subject: its definition is "sustaining
    the fidelity and copy number of DNA trinucleotide repeats", so repeat instability is
    that process running at DECREASED fidelity. GO:0007140 is retained alongside it only
    as the cell-division context that makes the instability paternal rather than
    maternal; it names the division, not the instability, and should not be read as
    annotating the repeat-expansion claim on its own. GO was searched for a term naming
    repeat instability or expansion directly ("trinucleotide repeat", "repeat
    instability", "DNA repeat") and no such term exists - GO models the maintenance
    process, not its failure - so the DECREASED modifier carries that direction.

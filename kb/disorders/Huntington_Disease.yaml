- name: Juvenile-Onset Brain Morphometric Divergence
  subtypes:
  - Juvenile HD
  biological_scale: TISSUE
  description: >-
    Because the juvenile-range allele is expressed throughout brain development, the
    structural phenotype of juvenile-onset HD is not simply an accelerated version of
    the adult-onset pattern. Juvenile-onset patients have substantially reduced
    intracranial volume - a developmental rather than degenerative signature, since
    intracranial volume is set by brain growth. After correcting for that smaller
    cranial vault, the caudate, putamen, globus pallidus, thalamus and cortical white
    matter are all significantly reduced, while the cerebral cortex is largely spared
    and the cerebellum is proportionately enlarged. The same striatal-down,
    cerebellum-up pattern is reproduced in R6/2, zQ175 and HdhQ250 mouse models, whose
    very long repeats make them better models of juvenile than adult-onset disease.
    This combination - extrastriatal involvement plus relative cerebellar preservation
    or enlargement - is the leading structural explanation for why juvenile-onset
    patients present hypokinetic and rigid rather than choreic. Progression is measurable:
    striatal volume falls about 4% per year in juvenile-onset patients versus essentially
    no change in gene-non-expanded controls.
  locations:
  - preferred_term: striatum
    term:
      id: UBERON:0002435
      label: striatum
  - preferred_term: cerebellum
    term:
      id: UBERON:0002037
      label: cerebellum

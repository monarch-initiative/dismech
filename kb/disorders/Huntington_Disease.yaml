progression:
- phase: Age of onset (juvenile-onset HD)
  subtype: Juvenile HD
  age_range: 20 years or younger, median 9 years at onset
  notes: >-
    Juvenile-onset HD is defined by motor onset at or before age 20. Pooled case
    reports and case series give a median age at onset of 9 years, and onset is
    conventionally split into childhood (0-10 years) and adolescent (11-20 years)
    onset, which differ in presenting features.
  evidence:
  - reference: PMID:31045518
    reference_title: "Clinical Presentation and Features of Juvenile-Onset Huntington's Disease: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Where data were available, the median age of onset was 9 years, 52% were
      female, the mutant HTT allele was transmitted paternally in 80% of cases, and
      the median CAG repeat length was 64.
    explanation: >-
      Systematic review of 285 juvenile-onset individuals reporting the median age
      at onset used here.
- phase: Disease duration and survival (juvenile-onset HD)
  subtype: Juvenile HD
  duration: >-
    Median about 9 years from motor onset in childhood-onset JHD, versus about 18
    years in adolescent- and adult-onset HD.
  notes: >-
    Juvenile-onset HD progresses faster and is fatal sooner than adult-onset
    disease, and the effect is graded by repeat length - the most highly expanded
    cases have the shortest survival.
  evidence:
  - reference: PMID:34636452
    reference_title: "Juvenile-Onset Huntington Disease Pathophysiology and Neurodevelopment: A Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The median disease duration after motor onset in childhood JHD is 9 years,
      compared to 18 years in adolescent and adult HD.
    explanation: >-
      Provides the childhood-onset versus adolescent/adult disease-duration figures
      recorded in this record.
  - reference: PMID:30243861
    reference_title: "Biological and clinical manifestations of juvenile Huntington's disease: a retrospective analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of 121 deceased patients, median survival was shorter in the juvenile
      Huntington's disease (n=17) cohort than in adult-onset Huntington's disease
      (n=104) cohort
    explanation: >-
      REGISTRY/Enroll-HD retrospective analysis showing shorter median survival in
      juvenile-onset than adult-onset HD.
  - reference: PMID:38669553
    reference_title: "Clinical Review of Juvenile Huntington's Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Disease progression of JHD is faster compared to AOHD and the disease duration
      is shorter, particularly in case of higher CAG repeat lengths.
    explanation: >-
      Expert working group review confirming faster progression and shorter duration
      graded by repeat length.
- phase: Motor progression rate (juvenile-onset HD)
  subtype: Juvenile HD
  notes: >-
    Juvenile-onset HD progresses faster than adult-onset HD on the UHDRS Total Motor
    Score, but the chorea subscales do not track that progression - they do not change
    reliably over time in juvenile-onset patients. This is a measurement consequence of
    the hypokinetic-rigid phenotype and is why chorea-based endpoints are poor outcome
    measures in this group.
  evidence:
  - reference: PMID:38142629
    reference_title: "Evaluating motor progression of juvenile-onset Huntington's Disease: An Enroll-HD analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The JOHD cohort had faster TMS progression compared to AOHD (p = 0.006) but no
      group difference in the rate of change of chorea.
    explanation: >-
      Enroll-HD analysis directly comparing juvenile- and adult-onset motor
      progression rates.
  - reference: PMID:38142629
    reference_title: "Evaluating motor progression of juvenile-onset Huntington's Disease: An Enroll-HD analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with JOHD did not show significant change in any of the chorea
      subscales.
    explanation: >-
      Supports the statement that chorea subscales fail to track juvenile-onset
      disease progression.

- name: Seizures
  category: Clinical
  subtype: Juvenile HD
  description: >-
    Epilepsy is one of the features the European Huntington Disease Network working
    group regards as specific to juvenile-onset HD, and it is uncommon in adult-onset
    disease. Within juvenile-onset HD, seizure occurrence is graded by repeat length:
    in a REGISTRY/Enroll-HD retrospective series seizures prevailed over time in 8 of
    10 (80%) highly expanded juvenile patients compared with 3 of 26 (11%) with lower
    expansions. Seizures are also significantly more frequent in childhood-onset
    (0-10 years) than adolescent-onset (11-20 years) juvenile disease.
  phenotype_term:
    preferred_term: Seizures
    term:
      id: HP:0001250
      label: Seizure
  evidence:
  - reference: PMID:38669553
    reference_title: "Clinical Review of Juvenile Huntington's Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      JHD specific features are epilepsy, ataxia, spasticity, pain, itching, and
      possibly liver steatosis.
    explanation: >-
      Expert working group review names epilepsy as a juvenile-onset-specific
      feature, justifying the Juvenile HD subtype scoping of this phenotype.
  - reference: PMID:30243861
    reference_title: "Biological and clinical manifestations of juvenile Huntington's disease: a retrospective analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Compared with the LE subgroup, development delay (0 [0%] in the LE subgroup vs
      nine [90%] in the HE subgroup; p<0·0001), severe gait impairment (nine [35%] in
      the LE subgroup vs nine [90%] in the HE subgroup; p=0·0072), and seizures (three
      [11%] in the LE subgroup vs eight [80%] in the HE subgroup; p<0·0001) prevailed
      over time in the HE subgroup.
    explanation: >-
      Quantifies the repeat-length gradient in seizure occurrence within
      juvenile-onset HD (80% in the highly expanded subgroup vs 11% in the low
      expansion subgroup).
  - reference: PMID:16925544
    reference_title: "Juvenile Huntington disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Juvenile HD is far less common and presents with parkinsonism, dystonia and
      seizures.
    explanation: >-
      Supports seizures as part of the characteristic juvenile-onset presentation,
      contrasted with the chorea of adult-onset HD.
  - reference: ORPHA:399
    reference_title: "Huntington disease (Orphanet structured-database record)"
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "HP:0001250 | Seizure | Frequent (79-30%)"
    explanation: >-
      Orphanet records seizures as a frequent disease-level HPO annotation. This
      partially supports the seizure phenotype here, while this entry retains the
      juvenile-HD subtype context for clinical specificity.
- name: Developmental Regression and Delay
  category: Clinical
  subtype: Juvenile HD
  description: >-
    Loss of previously acquired skills, or failure to acquire them on schedule, is a
    presenting feature of childhood-onset HD that has no counterpart in adult-onset
    disease. It is strongly graded by repeat length - developmental delay was recorded
    in 9 of 10 (90%) highly expanded juvenile patients and in none of 26 with lower
    expansions - and it is significantly more frequent in onset before age 10 than in
    adolescent onset. Speech and language delay may precede other motor signs when
    onset is in the first decade.
  phenotype_term:
    preferred_term: Developmental regression
    term:
      id: HP:0002376
      label: Developmental regression
  evidence:
  - reference: PMID:30243861
    reference_title: "Biological and clinical manifestations of juvenile Huntington's disease: a retrospective analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Compared with the LE subgroup, development delay (0 [0%] in the LE subgroup vs
      nine [90%] in the HE subgroup; p<0·0001), severe gait impairment (nine [35%] in
      the LE subgroup vs nine [90%] in the HE subgroup; p=0·0072), and seizures (three
      [11%] in the LE subgroup vs eight [80%] in the HE subgroup; p<0·0001) prevailed
      over time in the HE subgroup.
    explanation: >-
      Quantifies developmental delay as a high-expansion juvenile feature (90% vs 0%),
      supporting both the phenotype and its repeat-length dependence.
  - reference: PMID:38669553
    reference_title: "Clinical Review of Juvenile Huntington's Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Children with disease-onset between 0–10 years (n = 127) had significantly more
      gait disturbances/ataxia (p = 0.0001), dysarthria (p = 0.008), seizures (p =
      0.0008) and developmental regression/delay (p = 0.0001) compared to those with
      an onset between 11–20 years (n = 101)
    explanation: >-
      Establishes that developmental regression/delay is significantly more frequent
      in childhood-onset than adolescent-onset juvenile HD.
- name: Juvenile-Onset Parkinsonism
  category: Clinical
  subtype: Juvenile HD
  description: >-
    The juvenile-onset motor phenotype is hypokinetic and rigid rather than choreic -
    the inverse of adult-onset HD. Rigidity, axial bradykinesia, dystonia and tremor
    dominate, chorea is uncommon in the first decade of life, and parkinsonian features
    were one of only four sign groups present in more than 15% of pooled juvenile-onset
    presentations. This is the presentation historically named the Westphal variant,
    though that term is no longer recommended as a label for juvenile onset because the
    same hypokinetic-rigid picture also occurs in adult-onset disease.
  phenotype_term:
    preferred_term: Parkinsonism
    term:
      id: HP:0001300
      label: Parkinsonism
  evidence:
  - reference: PMID:31045518
    reference_title: "Clinical Presentation and Features of Juvenile-Onset Huntington's Disease: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Four groups of symptoms or signs were present in more than 15% of cases:
      behavioural disturbance, falls/gait disturbance, cognitive impairment and
      parkinsonian features.
    explanation: >-
      Systematic review of 285 juvenile-onset individuals placing parkinsonian
      features among the four most common presenting sign groups.
  - reference: PMID:30971481
    reference_title: "Brain structure in juvenile-onset Huntington disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Yet, the JOHD motor phenotype often manifests with parkinsonian features, such
      as bradykinesia, rigidity, and tremors.
    explanation: >-
      Specifies the parkinsonian components (bradykinesia, rigidity, tremor) of the
      juvenile-onset motor phenotype.
  - reference: PMID:36318082
    reference_title: "Longitudinal Clinical and Biological Characteristics in Juvenile-Onset Huntington's Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Specifically, patients with JOHD have less chorea and present with prominent
      rigidity and bradykinesia.
    explanation: >-
      Directly contrasts the juvenile hypokinetic-rigid phenotype with the chorea of
      adult-onset HD.
  - reference: PMID:38669553
    reference_title: "Clinical Review of Juvenile Huntington's Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the first decade of life speech difficulties, rigidity, and dystonia are
      common clinical motor symptoms, whereas onset in the second decade motor
      symptoms may sometimes resemble adult-onset Huntington's disease (AOHD).
    explanation: >-
      Establishes the decade-dependent motor presentation, with rigidity and dystonia
      characteristic of first-decade onset.
- name: Declining School Performance
  category: Clinical
  subtype: Juvenile HD
  description: >-
    In juvenile-onset HD, cognitive decline is typically first noticed as falling
    academic attainment rather than as a formal neuropsychological complaint, because
    the affected individual is still of school age. Cognitive impairment was one of the
    four sign groups present in more than 15% of pooled juvenile-onset presentations,
    and declining school performance is part of the long-standing Nance diagnostic
    criteria for juvenile HD.
  phenotype_term:
    preferred_term: Cognitive impairment
    term:
      id: HP:0100543
      label: Cognitive impairment
  evidence:
  - reference: PMID:38669553
    reference_title: "Clinical Review of Juvenile Huntington's Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cognitive decline is mostly detected by declining school performances.
    explanation: >-
      Establishes the age-specific way cognitive decline presents in juvenile-onset
      HD.
  - reference: PMID:31045518
    reference_title: "Clinical Presentation and Features of Juvenile-Onset Huntington's Disease: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Four groups of symptoms or signs were present in more than 15% of cases:
      behavioural disturbance, falls/gait disturbance, cognitive impairment and
      parkinsonian features.
    explanation: >-
      Places cognitive impairment among the most common juvenile-onset presenting
      sign groups.
- name: Behavioural Disturbance Mimicking Neurodevelopmental Disorder
  category: Clinical
  subtype: Juvenile HD
  description: >-
    Behavioural change is the single most common presenting feature of juvenile-onset
    HD, and non-motor features generally precede motor ones in this subtype. The
    behavioural symptoms themselves do not differ greatly from adult-onset HD, but in
    a child they are readily attributed to autism spectrum disorder or ADHD, which is
    a principal driver of misdiagnosis and diagnostic delay in juvenile-onset disease.
  phenotype_term:
    preferred_term: Behavioural disturbance
    term:
      id: HP:0000708
      label: Atypical behavior
  evidence:
  - reference: PMID:38669553
    reference_title: "Clinical Review of Juvenile Huntington's Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Behavioral symptoms in general do not differ from AOHD but may be confused with
      autism spectrum disorder or attention deficit hyperactivity disorder and lead to
      misdiagnosis and/or diagnostic delay.
    explanation: >-
      Directly supports both the behavioural phenotype and the age-specific
      misdiagnosis risk described here.
  - reference: PMID:31045518
    reference_title: "Clinical Presentation and Features of Juvenile-Onset Huntington's Disease: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      JHD can present with a wide variety of symptoms and signs, with non-motor
      characteristics being observed most frequently.
    explanation: >-
      Supports the predominance of non-motor, including behavioural, presenting
      features in juvenile-onset HD.
- name: Ataxia
  category: Clinical
  subtype: Juvenile HD
  description: >-
    Ataxia is listed by the European Huntington Disease Network working group among the
    features specific to juvenile-onset HD, and gait disturbance with ataxia is
    significantly more frequent in childhood-onset than adolescent-onset juvenile
    disease. It is a plausible clinical correlate of the cerebellar involvement seen on
    juvenile-onset brain morphometry, which is not a feature of adult-onset HD.
  phenotype_term:
    preferred_term: Ataxia
    term:
      id: HP:0001251
      label: Ataxia
  evidence:
  - reference: PMID:38669553
    reference_title: "Clinical Review of Juvenile Huntington's Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      JHD specific features are epilepsy, ataxia, spasticity, pain, itching, and
      possibly liver steatosis.
    explanation: >-
      Names ataxia as a juvenile-onset-specific feature.
  - reference: PMID:38669553
    reference_title: "Clinical Review of Juvenile Huntington's Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Children with disease-onset between 0–10 years (n = 127) had significantly more
      gait disturbances/ataxia (p = 0.0001), dysarthria (p = 0.008), seizures (p =
      0.0008) and developmental regression/delay (p = 0.0001) compared to those with
      an onset between 11–20 years (n = 101)
    explanation: >-
      Shows gait disturbance/ataxia is significantly more frequent in childhood-onset
      than adolescent-onset juvenile HD.
- name: Spasticity
  category: Clinical
  subtype: Juvenile HD
  description: >-
    Spasticity is listed among the features the European Huntington Disease Network
    working group regards as specific to juvenile-onset HD, contributing with rigidity
    and dystonia to the hypertonic motor picture that distinguishes juvenile from
    adult-onset disease.
  phenotype_term:
    preferred_term: Spasticity
    term:
      id: HP:0001257
      label: Spasticity
  evidence:
  - reference: PMID:38669553
    reference_title: "Clinical Review of Juvenile Huntington's Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      JHD specific features are epilepsy, ataxia, spasticity, pain, itching, and
      possibly liver steatosis.
    explanation: >-
      Names spasticity as a juvenile-onset-specific feature.
- name: Constipation
  category: Clinical
  subtype: Juvenile HD
  description: >-
    In a linked Swedish national registry cohort covering 2002-2018 (45 juvenile-onset
    among 1,492 incident HD diagnoses), juvenile-onset patients had higher incidence
    rates of constipation than adult-onset patients. Recorded as a juvenile-scoped
    clinical burden rather than a subtype-defining mechanism.
  phenotype_term:
    preferred_term: Constipation
    term:
      id: HP:0002019
      label: Constipation
  evidence:
  - reference: PMID:36253622
    reference_title: "Comorbidities and clinical outcomes in adult- and juvenile-onset Huntington's disease: a study of linked Swedish National Registries (2002-2019)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Individuals with JoHD had higher incidence rates of epilepsy, constipation and
      acute respiratory symptoms.
    explanation: >-
      National registry cohort reporting a higher constipation incidence rate in
      juvenile-onset than adult-onset HD.
- name: Acute Respiratory Symptoms
  category: Clinical
  subtype: Juvenile HD
  description: >-
    The same Swedish national registry cohort found higher incidence rates of acute
    respiratory symptoms in juvenile-onset than adult-onset HD. The registry term is a
    symptom category and does not specify infection, so this is deliberately bound to
    the broad abnormal-respiratory-physiology term rather than to pneumonia or
    respiratory tract infection; note the entry separately records aspiration pneumonia
    as a leading cause of death in HD generally via the dysphagia phenotype.
  phenotype_term:
    preferred_term: Acute respiratory symptoms
    term:
      id: HP:0002795
      label: Abnormal respiratory system physiology
  evidence:
  - reference: PMID:36253622
    reference_title: "Comorbidities and clinical outcomes in adult- and juvenile-onset Huntington's disease: a study of linked Swedish National Registries (2002-2019)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Individuals with JoHD had higher incidence rates of epilepsy, constipation and
      acute respiratory symptoms.
    explanation: >-
      National registry cohort reporting a higher incidence rate of acute respiratory
      symptoms in juvenile-onset than adult-onset HD.
- name: Sleep Disturbances
  category: Clinical
  description: >-
    Sleep disturbances are prevalent in HD, including periodic limb movements (35%),
    poor sleep quality (59%), excessive daytime sleepiness, and circadian rhythm
    disruption. Sleep medication use is reported in 29% of patients.
  phenotype_term:
    preferred_term: Sleep disturbance
    term:
      id: HP:0002360
      label: Sleep disturbance
  evidence:
  - reference: PMID:41722529
    reference_title: "What is the prevalence of sleep disturbances among people with Huntington disease and pre-manifest genetic expansion carriers? A systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Meta-analysed prevalence of objectively-measured sleep disturbances include:
      35% for periodic limb movements (PLM index>15/hour), 3% for REM sleep
      behaviour disorder, 5% for REM sleep without atonia, and 9% for
      sleep-disordered breathing (AHI>5/hour); and of self-reported measures: 29%
      for use of sleep medications, 59% for poor sleep quality (Pittsburgh sleep
      quality index), and 15% for excessive daytime sleepiness (Epworth sleepiness
      scale).
    explanation: >-
      Systematic review with meta-analysis quantifying the prevalence of multiple
      sleep disturbances in HD patients.
  - reference: ORPHA:399
    reference_title: "Huntington disease (Orphanet structured-database record)"
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "HP:0100785 | Insomnia | Occasional (29-5%)"
    explanation: >-
      Orphanet's insomnia annotation supports one component of the broader sleep
      disturbance phenotype.
  - reference: ORPHA:399
    reference_title: "Huntington disease (Orphanet structured-database record)"
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "HP:0001262 | Excessive daytime somnolence | Occasional (29-5%)"
    explanation: >-
      Orphanet's excessive daytime somnolence annotation supports another
      component of the broader sleep disturbance phenotype.
biochemical:
- name: Neurofilament Light Chain (NfL)
  notes: >-
    Plasma and CSF neurofilament light chain is elevated in both pre-manifest
    and manifest HD. NfL meets evidentiary guidelines as a prognostic biomarker
    in premanifest HD and can detect changes in very early disease stages.
  evidence:
  - reference: PMID:41081429
    reference_title: "Systematic Review with Meta-Analysis of Biofluid Markers for Huntington's Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Evidence for neurofilament light (NfL) is sufficient to meet evidentiary
      guidelines as a prognostic biomarker in preHD (ie, before clinical motor
      diagnosis).
    explanation: >-
      Systematic review with meta-analysis establishes NfL as a validated
      prognostic biomarker in pre-manifest HD.
  - reference: PMID:39891767
    reference_title: "Serum neurofilament light chain but not serum glial fibrillary acidic protein is a marker of early Huntington's disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      sNfL levels differed significantly between preHD and early HD, and HC
      (all p values < 0.05)
    explanation: >-
      Confirms serum NfL can distinguish pre-manifest and early HD from
      healthy controls.
- name: Mutant Huntingtin Protein (mHTT)
  notes: >-
    Mutant huntingtin protein is quantifiable in cerebrospinal fluid and serves
    as a pharmacodynamic biomarker for HTT-lowering therapies.
  evidence:
  - reference: PMID:38861215
    reference_title: "Huntington's Disease: Latest Frontiers in Therapeutics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The possibility of quantifying mHTT in CSF, along with the development
      of an integrated biological staging system in HD are important innovations
      applicable to clinical trial design that enhance the drug development process.
    explanation: >-
      Highlights CSF mHTT quantification as a key innovation for HD clinical
      trial design.
- name: Elevated Neuronal Inclusions
  presence: Positive
  notes: Aggregates of mutant huntingtin protein found in neurons.
  evidence:
  - reference: PMID:22200539
    reference_title: "Protein aggregates in Huntington's disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Here we will review the state of knowledge of HD, focusing especially on a hallmark pathological feature-intracellular aggregates of mutant Htt called inclusion bodies (IBs).
    explanation: The article discusses the presence of intracellular aggregates of mutant huntingtin, which are referred to as inclusion bodies, supporting the statement.
  - reference: PMID:38810948
    reference_title: "Evidence of mutant huntingtin and tau-related pathology within neuronal grafts in Huntington's disease cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We confirmed the presence of mHtt aggregates within grafts of all three cases as well as tau neuropil threads in the grafts of two of the three transplanted HD patients.
    explanation: The study confirms the presence of mutant huntingtin (mHtt) aggregates within neurons, supporting the statement.
  - reference: PMID:19172113
    reference_title: "Aggregation of expanded huntingtin in the brains of patients with Huntington disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: It is likely that the aggregates containing expanded huntingtin are toxic to neurons, but it remains to be determined whether the oligomer or the inclusion is the toxic species.
    explanation: The article mentions that aggregates containing expanded huntingtin are found in neurons, supporting the statement.
  - reference: PMID:27886014
    reference_title: "Embryonic Mutant Huntingtin Aggregate Formation in Mouse Models of Huntington's Disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Using highly sensitive immunohistochemical methods we have detected the appearance of diffuse aggregates during embryonic development in the R6/2 and YAC128 mouse models of HD.
    explanation: The study observes the formation of aggregates in neuronal cells during embryonic development in mouse models of HD, supporting the statement.
genetic:
- name: HTT
  association: Causative
  gene_term:
    preferred_term: HTT
    term:
      id: hgnc:4851
      label: HTT
  notes: >-
    The huntingtin gene on chromosome 4p16.3. CAG repeat expansion in exon 1
    beyond 36 repeats causes HD with full penetrance at 40+ repeats (reduced
    penetrance at 36-39). Normal alleles have 6-26 repeats; intermediate alleles
    (27-35) can expand to pathogenic range in offspring. The gene encodes huntingtin,
    a 3,144 amino acid scaffolding protein involved in vesicular transport,
    transcription, autophagy, and cell survival.
  evidence:
  - reference: PMID:41130308
    reference_title: "Inhibiting Cytosine-Adenine-Guanine (CAG) repeat expansions as a therapeutic strategy for Huntington's disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Huntington's Disease (HD) became the first disease mapped to a single
      chromosome and associated with mutations in the huntingtin (HTT) gene,
      specifically expansions in the trinucleotide cytosine-adenine-guanine (CAG)
      within exon 1.
    explanation: >-
      Confirms the CAG repeat expansion in HTT exon 1 as the causative mutation.
  - reference: CGGV:assertion_617c18ee-9476-4bc0-b403-20bc55150c7c-2021-11-08T193955.489Z
    reference_title: "HTT / Huntington disease (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "HTT | HGNC:4851 | Huntington disease | MONDO:0007739 | AD | Definitive"
    explanation: ClinGen classifies the HTT-Huntington disease gene-disease relationship as definitive with autosomal dominant inheritance.
- name: MSH3
  association: Modifier
  gene_term:
    preferred_term: MSH3
    term:
      id: hgnc:7326
      label: MSH3
  notes: >-
    DNA mismatch repair gene identified as a key genetic modifier of HD onset age
    through GWAS. MSH3 drives somatic CAG repeat expansion in striatal neurons;
    variants that reduce MSH3 activity delay onset. A major therapeutic target.
  evidence:
  - reference: PMID:33579859
    reference_title: "DNA Repair in Huntington's Disease and Spinocerebellar Ataxias: Somatic Instability and Alternative Hypotheses."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Validation of leads including the mismatch repair protein MSH3, and
      interstrand cross-link repair protein FAN1, suggest the mechanism is driven
      by somatic CAG instability, which is supported by the protective effect of
      CAA substitutions in the CAG tract.
    explanation: >-
      Identifies MSH3 as a validated modifier driving somatic CAG instability.
- name: FAN1
  association: Modifier
  gene_term:
    preferred_term: FAN1
    term:
      id: hgnc:29170
      label: FAN1
  notes: >-
    Fanconi anemia-associated nuclease 1. FAN1 protects against somatic CAG expansion;
    variants that enhance FAN1 activity are associated with delayed onset of HD.
  evidence:
  - reference: PMID:33579859
    reference_title: "DNA Repair in Huntington's Disease and Spinocerebellar Ataxias: Somatic Instability and Alternative Hypotheses."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Validation of leads including the mismatch repair protein MSH3, and
      interstrand cross-link repair protein FAN1, suggest the mechanism is driven
      by somatic CAG instability, which is supported by the protective effect of
      CAA substitutions in the CAG tract.
    explanation: >-
      Identifies FAN1 as a protective modifier against somatic CAG expansion.
- name: SLC2A3
  association: Modifier
  gene_term:
    preferred_term: SLC2A3
    term:
      id: hgnc:11007
      label: SLC2A3
  notes: >-
    Orphanet lists SLC2A3 as a modifying germline mutation association for
    Huntington disease.
  evidence:
  - reference: ORPHA:399
    reference_title: "Huntington disease (Orphanet structured-database record)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "SLC2A3 | solute carrier family 2 member 3 | hgnc:11007 | Modifying germline mutation in"

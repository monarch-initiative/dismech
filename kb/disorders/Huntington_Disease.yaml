discussions:
- discussion_id: mismatch_jhd_somatic_expansion_dispensable_at_juvenile_repeat_lengths
  prompt: >-
    Does the somatic-CAG-expansion therapeutic rationale, which underpins MSH3- and
    FAN1-directed programmes in adult-onset HD, still apply in the juvenile repeat
    range, where the inherited allele may already exceed the pathogenic threshold and
    further somatic expansion may be dispensable for pathogenesis?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Somatic CAG Repeat Expansion
  - pathophysiology#Juvenile-Range CAG Expansion
  - pathophysiology#Mutant Huntingtin Protein Aggregation
  rationale: >-
    In the zQ175 knock-in model, whose approximately 185-CAG allele sits in the
    juvenile/pediatric rather than adult range, complete Msh3 ablation abolished
    somatic expansion throughout brain and periphery and 50% reduction slowed it - yet
    neither striatal nuclear huntingtin aggregation nor the dysregulated striatal
    transcriptional profile improved. This is the opposite of the result obtained when
    Msh3 is ablated in knock-in models carrying shorter, adult-range repeats, where the
    intervention is beneficial. The authors' own translational argument is that human
    repeats of comparable size cause onset before age 2, so somatic expansion in brain
    cannot be required for pathogenesis at these lengths.
    The mismatch is therefore two-sided and specifically juvenile. Model-to-human: the
    negative result is a mouse result, and no trial of somatic-instability-directed
    therapy has been run in children with juvenile-onset HD - they are excluded from
    most HD trials, so the human counterpart of this experiment does not exist.
    Human-to-model: the repeat length at which the benefit of somatic-expansion
    suppression disappears is unknown in humans, because the trajectory of somatic
    expansion in mutation-carrier brain has not been measured. Until that threshold is
    located, an MSH3- or FAN1-directed agent validated in adult-onset HD must not be
    assumed to transfer to juvenile-onset patients, and the practical implication the
    authors draw - treat as early as possible, before the threshold is crossed - is
    itself untested in this group.
    This discussion deliberately does not resolve the general somatic-expansion gap
    recorded in gap_hd_somatic_expansion_threshold_rescue; it is the juvenile-range
    special case of it, where the sign of the expected effect may differ.
  evidence:
  - reference: PMID:38387080
    reference_title: "A CAG repeat threshold for therapeutics targeting somatic instability in Huntington's disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Ablation of Msh3 prevented somatic expansion throughout the brain and periphery,
      and reduction of Msh3 by 50% decreased the rate of expansion.
    explanation: >-
      Confirms the intervention worked as intended on its molecular target, so the
      absent phenotypic benefit is not an efficacy failure.
  - reference: PMID:38387080
    reference_title: "A CAG repeat threshold for therapeutics targeting somatic instability in Huntington's disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      This had no effect on the deposition of huntingtin aggregation in the nuclei of
      striatal neurons, nor on the dysregulated striatal transcriptional profile.
    explanation: >-
      The negative result at a juvenile-range repeat length that motivates this
      mismatch discussion.
  - reference: PMID:38387080
    reference_title: "A CAG repeat threshold for therapeutics targeting somatic instability in Huntington's disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      It is striking that highly expanded CAG repeats of a similar size in humans cause
      disease onset before 2 years of age, indicating that somatic CAG repeat expansion
      in the brain is not required for pathogenesis.
    explanation: >-
      The authors' explicit bridge from the mouse result to human juvenile-onset
      disease, and the basis for treating this as a translational mismatch rather than
      a model artefact.
  proposed_experiments:
  - experiment_id: exp_jhd_repeat_length_titrated_msh3_suppression
    name: Repeat-length-titrated MSH3 suppression in juvenile-range HD neurons
    description: >-
      Locate the repeat length at which suppressing somatic expansion stops conferring
      benefit, using isogenic human striatal neurons spanning the adult-onset through
      juvenile and highly expanded pediatric ranges. Apply graded MSH3 knockdown to
      each line, then measure somatic expansion alongside the phenotypes that failed to
      respond in zQ175 - nuclear huntingtin aggregation and the striatal transcriptional
      signature - plus survival. The read-out of interest is not whether suppression
      works at any one length but where in the repeat-length series the dose-response
      inverts, which is the number needed to decide whether juvenile-onset patients
      belong in MSH3-directed trials at all.
    experiment_type:
      preferred_term: isogenic allelic-series perturbation experiment
    model_systems:
    - name: Juvenile-range isogenic hPSC-derived striatal neuron allelic series
      description: >-

has_subtypes:
- name: Adult-onset HD
  display_name: Adult-onset Huntington Disease
  description: >-
    Classical form with onset typically between ages 30-50, CAG repeat length
    36-55, characterized by chorea, cognitive decline, and psychiatric symptoms.
- name: Juvenile HD
  display_name: Juvenile-Onset Huntington Disease
  subtype_term:
    preferred_term: juvenile Huntington disease
    term:
      id: MONDO:0016621
      label: juvenile Huntington disease
  subtype_frequency: approximately 1-5% of clinically manifest Huntington disease cases
  genes:
  - preferred_term: HTT
    term:
      id: hgnc:4851
      label: HTT
  description: >-
    Juvenile-onset Huntington disease (JHD/JOHD) is defined by motor symptom onset at
    or before age 20 and accounts for roughly 1-5% of manifest HD. It is driven by the
    longest CAG expansions - repeat length is usually above 55, around half of cases
    carry 60 or more repeats, and childhood-onset cases can exceed 80 - which arise by
    anticipation, most often through paternal transmission (about 80% of cases). The
    motor phenotype inverts that of adult-onset disease: chorea is uncommon early,
    while rigidity, axial bradykinesia, dystonia, dysarthria and gait disturbance
    dominate, and epilepsy, ataxia, spasticity and developmental regression are
    JHD-specific features. Presentation is frequently non-motor first (behavioural
    disturbance, declining school performance), which drives misdiagnosis and
    diagnostic delay. Progression is faster and disease duration shorter than in
    adult-onset HD.
    Terminology note: this subtype is historically called the "Westphal variant",
    but the European Huntington Disease Network JHD working group advises against
    that usage because the hypokinetic-rigid Westphal phenotype also occurs in
    adult-onset HD and so is not specific to juvenile onset. The term is retained
    here only as a synonym, and the preferred label is juvenile-onset HD.
  mappings:
    mondo_mappings:
    - term:
        id: MONDO:0016621
        label: juvenile Huntington disease
      mapping_predicate: skos:exactMatch
      mapping_source: MONDO
      mapping_justification: >-
        MONDO:0016621 (juvenile Huntington disease) is asserted in MONDO as a
        direct subclass of MONDO:0007739 (Huntington disease) and is defined by
        onset of signs and symptoms before 20 years of age, which is exactly the
        boundary used for this subtype.
  evidence:
  - reference: PMID:31045518
    reference_title: "Clinical Presentation and Features of Juvenile-Onset Huntington's Disease: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Juvenile-onset Huntington's disease (JHD) is defined by onset at the age of
      20 or younger and represents approximately 5% of all HD cases.
    explanation: >-
      Establishes the age-at-onset boundary and the approximate share of HD cases
      that define this subtype.
  - reference: PMID:39121132
    reference_title: "Prevalence of Juvenile-Onset and Pediatric Huntington's Disease and Their Availability and Ability to Participate in Trials: A Dutch Population and Enroll-HD Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Juvenile-onset Huntington's disease (JHD) represents 1-5% of Huntington's
      disease (HD) patients, with onset before the age of 21.
    explanation: >-
      Supports the 1-5% subtype frequency band recorded in subtype_frequency.
  - reference: PMID:38669553
    reference_title: "Clinical Review of Juvenile Huntington's Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Repeat length in JHD is usually > 55 and caused by anticipation, usually via
      paternal transmission.
    explanation: >-
      European Huntington Disease Network JHD working group review supporting the
      repeat-length range, anticipation, and paternal transmission bias.
  - reference: PMID:38669553
    reference_title: "Clinical Review of Juvenile Huntington's Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      JHD specific features are epilepsy, ataxia, spasticity, pain, itching, and
      possibly liver steatosis.
    explanation: >-
      Names the features the working group regards as distinctive of juvenile
      onset relative to adult-onset HD.
  - reference: PMID:38669553
    reference_title: "Clinical Review of Juvenile Huntington's Disease."
    supports: WRONG_STATEMENT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thus, the Westphal variant is not specific for JHD exclusively and should
      therefore be avoided to address childhood-onset HD.
    explanation: >-
      Documents why the previous display_name equating this subtype with the
      "Westphal variant" was inaccurate: the EHDN JHD working group states the
      hypokinetic-rigid Westphal phenotype is not exclusive to juvenile onset and
      should not be used as a label for it. The display name has been corrected to
      Juvenile-Onset Huntington Disease.
  - reference: PMID:34636452
    reference_title: "Juvenile-Onset Huntington Disease Pathophysiology and Neurodevelopment: A Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Juvenile-onset patients have distinct symptoms and signs with more severe
      pathology of involved brain structures in comparison with disease onset in
      adulthood.
    explanation: >-
      Supports treating juvenile onset as a clinically and pathologically distinct
      subtype rather than merely an early adult-onset presentation.
- name: Late-onset HD
  display_name: Late-Onset Huntington Disease
  description: >
    Onset over 60 years of age, accounting for roughly 4.4-11.5% of individuals
    with HD, and often with a slower, milder course than the typical fourth-decade
    onset.
  evidence:
  - reference: PMID:28671137
    reference_title: "What do we know about Late Onset Huntington's Disease?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: 'BACKGROUND: Although the typical age of onset for Huntington''s disease (HD) is in the fourth decade, between 4.4-11.5% of individuals with HD have a late onset (over 60 years of age).'
    explanation: Defines late-onset HD as onset over 60 years of age, occurring in 4.4-11.5% of individuals with HD, supporting the corrected subtype description.
  - reference: PMID:17390259
    reference_title: "Huntington's Disease."
    supports: REFUTE
    evidence_source: OTHER
    snippet: Huntington's disease may present at any age, but most typically manifests between the ages of 35 and 45 years as a slowly progressive neurodegenerative movement disorder with cognitive and behavioral impairment.
    explanation: Refutes any characterization of late onset as beginning after age 50; HD most typically manifests between ages 35 and 45, so the late-onset subtype is best defined by onset over 60 rather than over 50.
inheritance:
- name: Autosomal Dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: COMPLETE
  parent_of_origin_effect: >-
    Strong paternal transmission bias for large intergenerational expansions. Male
    meiotic instability of the CAG tract drives anticipation, and the effect is most
    extreme in juvenile-onset HD, where the mutant HTT allele is paternally inherited
    in roughly 80% of cases.
  description: >-
    HD follows autosomal dominant inheritance with complete penetrance at 40+ CAG
    repeats. Reduced penetrance occurs with 36-39 repeats. Anticipation is observed,
    particularly with paternal transmission due to meiotic instability of the CAG repeat.
  evidence:
  - reference: PMID:31045518
    reference_title: "Clinical Presentation and Features of Juvenile-Onset Huntington's Disease: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Where data were available, the median age of onset was 9 years, 52% were
      female, the mutant HTT allele was transmitted paternally in 80% of cases, and
      the median CAG repeat length was 64.
    explanation: >-
      Quantifies the paternal transmission bias and median repeat length recorded in
      parent_of_origin_effect, pooled across 285 juvenile-onset cases.
  - reference: PMID:20301482
    reference_title: "Huntington Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Expansion and contraction of CAG repeat length can occur with maternal or
      paternal transmission; however, expansion occurs far more commonly in paternal
      transmission and contraction occurs more commonly in maternal transmission.
    explanation: >-
      GeneReviews, the authoritative expert clinical reference for HD, corroborates the
      directional parent-of-origin asymmetry recorded here: expansion is
      paternally biased while contraction is maternally biased. This is the general-HD
      statement underlying the more extreme ~80% paternal transmission seen
      specifically in juvenile-onset cases.
  - reference: PMID:41233526
    reference_title: "Huntington disease: somatic expansion, pathobiology and therapeutics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Huntington disease is a fatal, inherited, neurodegenerative disease caused
      by a CAG repeat expansion in the huntingtin gene (HTT), resulting in a toxic
      polyglutamine tract in the huntingtin protein.
    explanation: >-
      Confirms HD is an inherited disorder caused by CAG repeat expansion in HTT.
  - reference: ORPHA:399
    reference_title: "Huntington disease (Orphanet structured-database record)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Autosomal dominant"
    explanation: >-
      Orphanet's inheritance section directly states autosomal dominant
      inheritance for Huntington disease.

genetic:
- name: ELANE
  gene_term:
    preferred_term: ELANE
    term:
      id: hgnc:3309
      label: ELANE
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  association: Heterozygous Missense Mutation, Autosomal Dominant
  notes: >-
    Genotype does not cleanly predict phenotype. Cyclic and severe congenital
    neutropenia have partly distinct mutation spectra, but the severity
    distributions overlap, and one kindred is documented in which the same S97L
    allele on a shared paternal haplotype produced cyclic neutropenia in one child
    and severe congenital neutropenia in seven others. That observation argues for
    modifying genes and for treating the two conditions as a phenotypic spectrum
    rather than as separate diseases.
  evidence:
  - reference: PMID:23463630
    reference_title: The spectrum of ELANE mutations and their implications in severe congenital and cyclic
      neutropenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: CyN-associated mutations were predicted to be more benign than CN-associated
      mutations, but the mutation severity largely overlapped.
    explanation: Establishes that the two mutation spectra differ in tendency but overlap, which
      is why genotype is not predictive.
  - reference: PMID:20582973
    reference_title: 'Cyclic neutropenia and severe congenital neutropenia in patients with a shared ELANE
      mutation and paternal haplotype: evidence for phenotype determination by modifying genes.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: One patient with CN had the same S97L ELANE mutation as seven patients with the
      SCN phenotype.
    explanation: The single strongest piece of evidence that the ELANE allele alone does not
      determine which of the two phenotypes appears.
  - reference: PMID:20582973
    reference_title: 'Cyclic neutropenia and severe congenital neutropenia in patients with a shared ELANE
      mutation and paternal haplotype: evidence for phenotype determination by modifying genes.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The coexistence of CN and SCN phenotypes in this kindred with a shared paternal
      haplotype strongly suggests both a role for modifying genes in determination of congenital
      neutropenia disease phenotypes, and the classification of CN and SCN within a spectrum
      of phenotypes expressing varying degrees of the same disease process.
    explanation: States the modifier-gene interpretation and the spectrum classification that
      this entry adopts.
inheritance:
- name: Autosomal dominant
  description: >-
    Autosomal dominant, occurring both as inherited and as sporadic disease. The
    kindred described by Newburger and colleagues also demonstrates paternal
    gonadal mosaicism as a mechanism of recurrence in apparently sporadic families.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:11957190
    reference_title: Cyclic neutropenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Recent genetic, molecular, and cellular studies have shown that autosomal-dominant
      cyclic neutropenia and sporadic cases of this disease are due to a mutation in the gene
      for neutrophil elastase (ELA2), located at 19p13.3.
    explanation: States the autosomal dominant inheritance and the existence of sporadic cases.
  - reference: PMID:20582973
    reference_title: 'Cyclic neutropenia and severe congenital neutropenia in patients with a shared ELANE
      mutation and paternal haplotype: evidence for phenotype determination by modifying genes.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The mutant allele was detected in the donor's spermatozoa, representing 18% of the
      ELANE gene pool, but not in DNA from his lymphocytes, neutrophils, or buccal mucosa,
      indicating gonadal mosaicism.
    explanation: Documents gonadal mosaicism, which is relevant to recurrence risk counselling in
      families with no detectable parental mutation.
diagnosis:
- name: Serial absolute neutrophil counts
  presence: PRESENT
  description: >-
    The diagnosis rests on demonstrating the oscillation, which requires repeated
    counts over at least six weeks rather than a single measurement. A single
    normal count does not exclude the disease, because it may have been taken at
    the peak.
  evidence:
  - reference: PMID:23855177
    reference_title: Cyclic neutropenia presenting as recurrent oral ulcers and periodontitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Repeated, routine blood tests showed 1-week-long neutropenic periods that occurred
      at intervals of 2 weeks.
    explanation: Shows that repeated sampling is what reveals the pattern, and incidentally that
      the period is not always the textbook twenty-one days.
- name: ELANE molecular genetic testing
  presence: PRESENT
  description: >-
    Identification of a heterozygous pathogenic ELANE variant confirms the
    diagnosis. A negative result does not exclude it, since ELANE mutations are
    found in only about 55% of cyclic neutropenia patients.
  evidence:
  - reference: PMID:20301705
    reference_title: ELANE-Related Neutropenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The diagnosis of ELANE-related neutropenia is established in a proband with
      suggestive clinical findings and the identification of a heterozygous pathogenic variant
      in ELANE through molecular genetic testing.
    explanation: States the molecular diagnostic criterion.
treatments:
- name: Granulocyte Colony-Stimulating Factor
  description: >-
    The mainstay. Long-term daily or alternate-day G-CSF at 1 to 5 micrograms per
    kilogram per day reduces fever, mouth ulcers and other inflammatory events.
    Note the mechanistic irony: G-CSF-driven compensatory proliferation is part of
    the oscillation in the first place, and treatment works by raising the nadir
    rather than by abolishing the cycle.
  treatment_term:
    preferred_term: colony-stimulating factor therapy
    term:
      id: NCIT:C15515
      label: Colony-Stimulating Factor Therapy
    therapeutic_agent:
    - preferred_term: filgrastim
      term:
        id: NCIT:C1474
        label: Filgrastim
  target_mechanisms:
  - target: Oscillatory Granulopoiesis
    treatment_effect: MODULATES
    description: Pharmacological G-CSF drives granulocytic proliferation and differentiation,
      raising the neutrophil count achieved at the nadir.
    evidence:
    - reference: PMID:32083314
      reference_title: New insights into the pathomechanism of cyclic neutropenia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: There is a cyclic balance between ER stress-induced apoptosis of HSPCs and
        compensatory G-CSF-stimulated HSPC proliferation followed by granulocytic differentiation.
      explanation: Identifies G-CSF-stimulated proliferation as the arm of the cycle that this
        treatment augments.
  evidence:
  - reference: PMID:11957190
    reference_title: Cyclic neutropenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Cyclic neutropenia is effectively treated with granulocyte colony-stimulating factor
      (G-CSF), usually at doses of 1 to 5 microg/kg/d (median dose, 2.5 microg/kg/d). Long-term,
      daily, or alternate-day administration reduces fever, mouth ulcers, and other inflammatory
      events associated with this disorder.'
    explanation: Gives the dose range and the clinical benefit obtained.
  - reference: PMID:23855177
    reference_title: Cyclic neutropenia presenting as recurrent oral ulcers and periodontitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: During a 2-year follow-up, his symptoms were well controlled by regular
      administration of granulocyte colony-stimulating factor and periodontal maintenance.
    explanation: Individual-level confirmation of symptom control on maintenance G-CSF, alongside
      dental care.

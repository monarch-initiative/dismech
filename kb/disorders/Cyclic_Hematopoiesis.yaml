name: Cyclic Hematopoiesis
creation_date: '2026-09-03T09:00:00Z'
description: >-
  An autosomal dominant disorder of granulopoiesis in which the absolute
  neutrophil count oscillates on a regular cycle of roughly 21 days, falling to
  severely neutropenic levels and recovering to near normal. Most cases carry a
  heterozygous ELANE mutation. The prevailing model is that mutant neutrophil
  elastase misfolds, provokes endoplasmic reticulum stress and an unfolded
  protein response in granulocytic progenitors, and kills them; the oscillation
  arises because progenitor depletion drives compensatory G-CSF-stimulated
  proliferation, which then repopulates the compartment until the unfolded
  protein response overtakes it again. Clinically the disease is a rhythm of
  fever, mouth ulceration and infection at each nadir, with good health in
  between. Unlike severe congenital neutropenia, which shares the same gene, it
  carries no recognised risk of leukaemic transformation.
categories:
- Inborn Error of Immunity
- Disorder of Granulopoiesis
- Protein Misfolding Disorder
parents:
- congenital neutropenia
synonyms:
- cyclic neutropenia
- periodic neutropenia
- cyclic agranulocytosis
epidemiology:
- name: Age at diagnosis
  description: >-
    Usually recognised within the first year of life, from the pattern of
    approximately three-weekly fever and oral ulceration together with regular
    oscillation of the blood counts. Symptoms tend to improve in adulthood.
  evidence:
  - reference: PMID:20301705
    reference_title: ELANE-Related Neutropenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Cyclic neutropenia is usually diagnosed within the first year of life based on
      approximately three-week intervals of fever and oral ulcerations and regular oscillations
      of blood cell counts.
    explanation: Gives the typical age at diagnosis and the clinical pattern that prompts it.
- name: ELANE mutation frequency
  description: >-
    In the largest screened series, ELANE mutations were found in 55% of cyclic
    neutropenia patients, a higher detection rate than in severe congenital
    neutropenia.
  evidence:
  - reference: PMID:23463630
    reference_title: The spectrum of ELANE mutations and their implications in severe congenital and cyclic
      neutropenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We found 116 different mutations in 162 (41%) CN patients and 26 in 51 (55%) CyN
      patients, 69 of them were novel.
    explanation: Gives the ELANE detection rate in cyclic neutropenia alongside the congenital
      neutropenia comparison.
pathophysiology:
- name: ELANE Mutation and Neutrophil Elastase Misfolding
  description: >-
    The initiating lesion. A heterozygous mutation in ELANE yields a neutrophil
    elastase that misfolds. Elastase is synthesised in neutrophil precursors early
    in primary granule formation, which is why the consequences fall on the
    granulocytic lineage specifically rather than on cells generally.
  genes:
  - preferred_term: ELANE
    term:
      id: hgnc:3309
      label: ELANE
  cell_types:
  - preferred_term: promyelocyte
    term:
      id: CL:0000836
      label: promyelocyte
  evidence:
  - reference: PMID:11957190
    reference_title: Cyclic neutropenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Recent genetic, molecular, and cellular studies have shown that autosomal-dominant
      cyclic neutropenia and sporadic cases of this disease are due to a mutation in the gene
      for neutrophil elastase (ELA2), located at 19p13.3. This enzyme is synthesized in neutrophil
      precursors early in the process of primary granule formation.
    explanation: Names the causal gene and locates elastase synthesis in neutrophil precursors,
      which is the basis for lineage specificity.
  downstream:
  - target: Endoplasmic Reticulum Stress and Unfolded Protein Response
    causal_link_type: DIRECT
    description: Misfolded elastase accumulating in the endoplasmic reticulum triggers the
      stress response.
    evidence:
    - reference: PMID:21285438
      reference_title: Activation of the unfolded protein response is associated with impaired granulopoiesis
        in transgenic mice expressing mutant Elane.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: 'Recent data suggest a model in which ELANE mutations result in NE protein misfolding,
        induction of endoplasmic reticulum (ER) stress, activation of the unfolded protein response
        (UPR), and ultimately a block in granulocytic differentiation.'
      explanation: States the misfolding-to-ER-stress step that this edge asserts, and is
        explicit that it is a model.
- name: Endoplasmic Reticulum Stress and Unfolded Protein Response
  description: >-
    In CD34+ cells taken at the neutrophil nadir, ELANE and the unfolded protein
    response genes ATF6, BiP, CHOP and PERK are all raised while the antiapoptotic
    genes BCL2 and BCL2L1 are reduced, with increased reactive oxygen species and
    gH2AX. The measurement is made in patient marrow at a defined point in the
    cycle, which is what makes this node unusually well grounded for a mechanism
    of this kind.
  biological_processes:
  - preferred_term: response to endoplasmic reticulum stress
    modifier: INCREASED
    term:
      id: GO:0034976
      label: response to endoplasmic reticulum stress
  - preferred_term: PERK-mediated unfolded protein response
    modifier: INCREASED
    term:
      id: GO:0036499
      label: PERK-mediated unfolded protein response
  evidence:
  - reference: PMID:32083314
    reference_title: New insights into the pathomechanism of cyclic neutropenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'we found that mRNA expression levels of ELANE and unfolded protein response (UPR)-related
      genes (ATF6, BiP (HSPA5), CHOP (DDIT3), and PERK (EIF2AK3)) were elevated, but antiapoptotic
      genes (Bcl-2 (BCL2) and bcl-xL (BCL2L1)) were reduced in CD34+ cells tested at the ANC
      nadir.'
    explanation: Direct measurement of unfolded protein response activation and loss of
      antiapoptotic signalling in patient progenitors at the nadir.
  - reference: PMID:32299910
    reference_title: 'Inducible expression of a disease-associated ELANE mutation impairs granulocytic differentiation,
      without eliciting an unfolded protein response.'
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: 'Using an inducible expression system, we observed that this ELANE mutation diminishes
      enzymatic activity and granulocytic differentiation without significantly affecting cell
      proliferation, cell death, or UPR induction in murine myeloblast 32D and human promyelocytic
      NB4 cells.'
    explanation: Argues against the unfolded protein response being necessary, since impaired
      differentiation occurred without it. Recorded here as a genuine challenge to this node,
      with the caveat that the mutation studied (p.G185R) is a severe congenital neutropenia
      allele rather than a cyclic one.
  downstream:
  - target: Apoptosis of Granulocytic Progenitors
    causal_link_type: DIRECT
    description: The unfolded protein response, with antiapoptotic gene expression suppressed,
      kills the progenitors rather than merely stalling them.
    evidence:
    - reference: PMID:32083314
      reference_title: New insights into the pathomechanism of cyclic neutropenia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: There is a cyclic balance between ER stress-induced apoptosis of HSPCs and
        compensatory G-CSF-stimulated HSPC proliferation followed by granulocytic differentiation.
      explanation: Names ER-stress-induced apoptosis of progenitors as one arm of the balance.
- name: Apoptosis of Granulocytic Progenitors
  description: >-
    Accelerated death of neutrophil precursors, producing ineffective granulopoiesis
    and, in the marrow, myeloid maturation arrest. This is the step that converts a
    protein-folding defect into a blood count.
  cell_types:
  - preferred_term: hematopoietic stem cell
    term:
      id: CL:0000037
      label: hematopoietic stem cell
  biological_processes:
  - preferred_term: apoptotic process
    modifier: INCREASED
    term:
      id: GO:0006915
      label: apoptotic process
  - preferred_term: granulocyte differentiation
    modifier: DECREASED
    term:
      id: GO:0030851
      label: granulocyte differentiation
  evidence:
  - reference: PMID:11957190
    reference_title: Cyclic neutropenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: It is currently presumed that the mutant neutrophil elastase functions aberrantly
      within the cells to accelerate apoptosis of the precursors, resulting in effective and
      oscillatory production.
    explanation: States accelerated precursor apoptosis as the mechanism linking the mutant
      protein to oscillatory production. The source is explicit that this is presumed.
  downstream:
  - target: Oscillatory Granulopoiesis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Progenitor depletion raises G-CSF, which drives compensatory proliferation; the
      repopulated compartment is then hit by the unfolded protein response again, and the loop
      repeats with a period of about three weeks.
    evidence:
    - reference: PMID:32083314
      reference_title: New insights into the pathomechanism of cyclic neutropenia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'We suggest that in CyN patients, some HSPCs escape the UPR-induced endoplasmic
        reticulum (ER) stress and proliferate in response to granulocyte colony-stimulating factor
        (G-CSF) to a certain threshold at which UPR again affects the majority of HSPCs.'
      explanation: States the feedback loop that generates the oscillation, and does so as an
        explicit suggestion rather than an established fact.
- name: Oscillatory Granulopoiesis
  description: >-
    The defining feature, and the reason this disease is interesting beyond
    haematology: a genetic lesion producing not a fixed deficit but a stable
    oscillation. Marrow sampling at the two ends of the cycle shows the mechanism
    in motion, with stem and progenitor cells accumulating at the nadir and
    producing fewer granulocyte colonies at the peak.
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  evidence:
  - reference: PMID:32083314
    reference_title: New insights into the pathomechanism of cyclic neutropenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'We performed analysis of bone marrow (BM) subpopulations in CyN patients at the
      peak and the nadir of the ANC cycle and detected high proportions of BM hematopoietic
      stem cells (HSCs) and hematopoietic stem and progenitor cells (HSPCs) at the nadir of
      the ANC cycle, as compared with the peak.'
    explanation: Documents the marrow compartment shifting in antiphase with the blood count,
      which is the direct observation of the oscillation.
  - reference: PMID:11957190
    reference_title: Cyclic neutropenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Fluctuations in blood cells are due to oscillatory production of cells by the bone
      marrow.
    explanation: Locates the oscillation in marrow production rather than in peripheral
      consumption or margination.
  downstream:
  - target: Recurrent Infection and Mucosal Inflammation
    causal_link_type: DIRECT
    description: At each nadir the neutrophil count is severely low for several days, and it is
      during those windows that infection and mucosal breakdown occur.
    evidence:
    - reference: PMID:20301705
      reference_title: ELANE-Related Neutropenia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Cellulitis, especially perianal cellulitis, is common during neutropenic periods.
        Between neutropenic periods, affected individuals are generally healthy.
      explanation: Ties the infectious events specifically to the neutropenic windows, which is
        what makes this edge cyclical rather than constant.
- name: Recurrent Infection and Mucosal Inflammation
  description: >-
    The clinical disease: recurrent fever, mouth ulcers, gingivitis, pharyngitis,
    sinusitis, cervical adenopathy and cellulitis, all timed to the nadirs. It is
    less severe than in congenital neutropenia, and between episodes patients are
    well.
  evidence:
  - reference: PMID:20301705
    reference_title: ELANE-Related Neutropenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'ELANE-related neutropenia includes congenital neutropenia and cyclic neutropenia,
      both of which are primary hematologic disorders characterized by recurrent fever, skin
      and oropharyngeal inflammation (i.e., mouth ulcers, gingivitis, sinusitis, and pharyngitis),
      and cervical adenopathy.'
    explanation: Enumerates the clinical manifestations that constitute this endpoint.
  - reference: PMID:20301705
    reference_title: ELANE-Related Neutropenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Infectious complications are generally more severe in congenital neutropenia than
      in cyclic neutropenia.
    explanation: Grades the severity of this endpoint against the allelic disorder, which is the
      main clinical distinction between the two.
- name: Absence of Leukaemic Transformation Risk
  description: >-
    A negative finding, recorded because it is clinically decisive and because the
    naive inference from the shared gene is wrong. Severe congenital neutropenia
    carries a 15 to 25% risk of myelodysplasia or acute myeloid leukaemia after
    fifteen years of G-CSF; cyclic neutropenia carries no recognised risk, treated
    or untreated. The divergence is attributed to disease severity rather than to
    the ELANE mutation itself.
  evidence:
  - reference: PMID:20301705
    reference_title: ELANE-Related Neutropenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Cyclic neutropenia is not associated with risk of malignancy or conversion to
      leukemia.
    explanation: States the absence of malignant risk directly.
  - reference: PMID:11957190
    reference_title: Cyclic neutropenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Leukemic transformation is not a recognized risk for cyclic neutropenia, with or
      without treatment with G-CSF.
    explanation: Confirms the absence of risk and specifies that it holds under G-CSF treatment,
      which is the clinically relevant question.
  - reference: PMID:23463630
    reference_title: The spectrum of ELANE mutations and their implications in severe congenital and cyclic
      neutropenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Specific ELANE mutations have limited predictive value for leukemogenesis; the risk
      for leukemia was correlated with disease severity rather than with occurrence of an ELANE
      mutation.
    explanation: Attributes leukaemic risk to severity rather than to the gene, which is why the
      allelic disorder diverges here.

disease_term:
  preferred_term: cyclic hematopoiesis
  term:
    id: MONDO:0008090
    label: cyclic hematopoiesis
notes: >-
  Scope and naming. MONDO labels this entity cyclic hematopoiesis; the clinical
  literature almost always calls it cyclic neutropenia. Both are recorded, with
  the MONDO label as the disease_term and the clinical name as a synonym.

  Relationship to severe congenital neutropenia. The two are allelic and are best
  read as a spectrum rather than as separate diseases, on the evidence of a
  kindred in which one S97L allele on a shared paternal haplotype produced both
  phenotypes. They are nevertheless curated separately here, because the clinical
  consequence diverges completely at the point that matters most: severe
  congenital neutropenia carries a 15 to 25% risk of myelodysplasia or acute
  myeloid leukaemia after fifteen years of G-CSF, and cyclic neutropenia carries
  none. That divergence is recorded as its own pathophysiology node rather than
  buried in prose, because the naive inference from a shared gene is wrong and
  worth contradicting explicitly.

  Mechanism confidence. The unfolded protein response model is well supported for
  this disease specifically, because PMID:32083314 measured it in patient CD34+
  cells at defined points in the cycle. It is not unchallenged. PMID:32299910 is
  recorded with supports REFUTE on that node: an inducible system showed impaired
  granulocytic differentiation without any unfolded protein response. That paper
  studied p.G185R, a severe congenital neutropenia allele, so it does not
  straightforwardly transfer, and the caveat is stated in the evidence
  explanation rather than left for a reader to notice. The G193X mouse is
  recorded with one FAILS_TO_RECAPITULATE link for the same reason: it does not
  become neutropenic, and that is more informative than omitting it.

  A quoting note. The snippet taken from PMID:21285438 reads "G913X" where the
  paper means G193X; the typographical error is in the source abstract. It is
  quoted verbatim because snippets must match the cached reference exactly, and
  the discrepancy is flagged in that evidence item's explanation.

  Ontology notes. HPO has an exact term for the defining phenotype
  (HP:0040289 Cyclically decreased total neutrophil count) and a child term that
  adds the marrow finding (HP:0410254), so both are used rather than a generic
  neutropenia parent. MAXO is not used in this repository, so treatments bind to
  NCIT actions with NCIT therapeutic agents; filgrastim has no CHEBI term.

  Known extension points: prevalence, for which no cleanly quotable figure was
  found in the cached abstracts; clinical_trials; the mathematical modelling
  literature on the oscillation, which is substantial and would justify a
  computational_models section; and stem cell transplantation, which is used in
  severe congenital neutropenia but is rarely indicated here and would need
  cyclic-specific evidence rather than borrowed evidence.

  Provenance. Curated directly from PubMed rather than from a deep-research
  report: both configured research providers remain unavailable
  (openscientist.io returns CloudFront 403 on POST and 401 on authenticated GET;
  the cyberian backend returns 500). Every snippet was fetched with
  just fetch-reference and verified as an exact substring of the cached abstract.

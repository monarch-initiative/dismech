animal_models:
- name: G193X Elane transgenic mouse
  species: Mouse
  genotype: G193X Elane
  publication: PMID:21285438
  description: >-
    A targeted Elane mutation reproducing a human severe congenital neutropenia
    allele. It is included here because of what it fails to do: the mice are not
    neutropenic, which is a real problem for the unfolded protein response model as
    a complete account.
  evidence:
  - reference: PMID:21285438
    reference_title: Activation of the unfolded protein response is associated with impaired granulopoiesis
      in transgenic mice expressing mutant Elane.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: 'To test this model, we generated transgenic mice carrying a targeted mutation of
      Elane (G193X) reproducing a mutation found in SCN.'
    explanation: Establishes the model and the human allele it reproduces.
  modeled_mechanisms:
  - target: Endoplasmic Reticulum Stress and Unfolded Protein Response
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      Granulocytic precursors carrying the mutation are selectively sensitive to
      endoplasmic reticulum stress, which supports the mechanism, but they show no
      basal unfolded protein response activation.
    limitations: >-
      The sensitivity is only revealed by chemical or proteasome-inhibitor
      challenge; unstressed animals look normal. The allele is also a severe
      congenital neutropenia allele rather than a cyclic one.
    evidence:
    - reference: PMID:21285438
      reference_title: Activation of the unfolded protein response is associated with impaired granulopoiesis
        in transgenic mice expressing mutant Elane.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: The selective sensitivity of G913X Elane granulocytic cells to ER stress provides
        new and strong support for the UPR model of disease patho-genesis in SCN.
      explanation: The authors' own summary of what the model does and does not establish. Note
        that the abstract itself contains a typographical error, writing G913X for G193X.
  - target: Apoptosis of Granulocytic Progenitors
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      The mice do not develop neutropenia. Basal and stress granulopoiesis are
      normal, so the model does not reproduce the ineffective granulopoiesis that
      defines the human disease.
    limitations: >-
      Recorded as a negative result rather than omitted, because a model that fails
      at the key phenotype constrains the mechanism more informatively than one
      that succeeds.
    evidence:
    - reference: PMID:21285438
      reference_title: Activation of the unfolded protein response is associated with impaired granulopoiesis
        in transgenic mice expressing mutant Elane.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Granulocytic precursors from G193X Elane mice, though without significant basal
        UPR activation, are sensitive to chemical induction of ER stress. Basal and stress
        granulopoiesis after myeloablative therapy are normal in these mice.
      explanation: States directly that granulopoiesis is normal in these animals, which is the
        failure this link records.
- name: Grey Collie canine cyclic hematopoiesis
  species: Dog
  genotype: AP3B1 frameshift, homozygous
  publication: PMID:2979797
  description: >-
    The classical animal model, described in Grey Collies as the lethal grey
    syndrome. It reproduces the oscillation itself, on a twelve-day rather than a
    twenty-one-day cycle, and historically it shaped how the human disease was
    understood. It is genetically distinct: the canine disease is a recessive AP3B1
    defect, not an ELANE one.
  evidence:
  - reference: PMID:2979797
    reference_title: Pathobiology of canine cyclic hematopoiesis (review).
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Canine cyclic hematopoiesis (CH) was first described in Gray Collies as the lethal
      gray syndrome, and was subsequently shown to be a counterpart of human cyclic neutropenia
      (CN).
    explanation: Establishes the model and its relationship to the human disease.
  modeled_mechanisms:
  - target: Oscillatory Granulopoiesis
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces a genuine cyclic oscillation of neutrophils originating in the
      bone marrow, confirmed by reciprocal bone marrow transplantation.
    limitations: >-
      Genetically distinct from the human disease: a homozygous recessive AP3B1
      frameshift rather than a heterozygous dominant ELANE mutation, with a twelve
      to fourteen day period rather than twenty-one, and a lethal course in the
      first months of life. It therefore models the oscillation as a phenomenon of
      marrow regulation, not the ELANE mechanism.
    evidence:
    - reference: PMID:2979797
      reference_title: Pathobiology of canine cyclic hematopoiesis (review).
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Reciprocal bone marrow transplantation indicates that the defect resides in the
        bone marrow, but the actual site and mechanism of the defect has not been established.
      explanation: Localises the defect to the marrow, which is the feature shared with the human
        disease, while stating that the mechanism was unresolved.
    - reference: PMID:35904319
      reference_title: 'Cyclic hematopoiesis in a mixed-breed dog: case report and brief review.'
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: 'Genetic testing determined that the patient was homozygous mutant for the frameshift
        mutation in the adaptor protein complex 3 β-subunit (AP3B1) gene, originally identified
        in gray collies with cyclic hematopoiesis (CH).'
      explanation: Identifies the canine gene as AP3B1, which is the basis for the limitation
        recorded on this link.

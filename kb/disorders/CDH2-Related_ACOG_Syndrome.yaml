mechanistic_hypotheses:
- hypothesis_group_id: acogs_antimorphic_adhesion
  hypothesis_label: ACOGS ectodomain alleles act as antimorphs that poison wild-type N-cadherin adhesion
  status: EMERGING
  description: >-
    The proposal is that the EC4-EC5 missense alleles are not simple
    loss-of-function. A mutant molecule that reaches the cell surface with an
    unhinged ectodomain still occupies the trans-binding partner presented by
    the apposing cell, so it subtracts wild-type molecules from the pool of
    competent bonds rather than merely failing to add to it. The direct
    observation supporting this is that the variants impair binding in trans to
    wild-type N-cadherin, not only to each other. If correct, the effective
    adhesive deficit in a heterozygote exceeds 50%, which would explain why a
    single heterozygous missense change produces a severe malformation syndrome
    while heterozygous N-cadherin-null mice are not reported as abnormal. That
    last contrast is weak evidence: the cached mouse-null report (PMID:9015265)
    is an abstract that describes homozygous mutants only and says nothing
    about heterozygotes, so the heterozygous-null comparison rests on the
    absence of a reported phenotype rather than on a documented normal one.
  evidence:
  - reference: PMID:31585109
    reference_title: "De Novo Pathogenic Variants in N-cadherin Cause a Syndromic Neurodevelopmental Disorder with Corpus Collosum, Axon, Cardiac, Ocular, and Genital Defects."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "defect includes impaired binding in trans with N-cadherin-WT expressed on"
    explanation: >-
      The trans-heterophilic binding failure against wild-type protein is the
      specific observation that motivates the antimorphic hypothesis.
  notes: >-
    Not yet tested by the experiment that would settle it - a dosage series
    comparing wild-type, heterozygous-null and heterozygous-missense cells or
    animals for adhesion strength and for the ACOGS phenotypes.
discussions:
- discussion_id: acogs_truncating_allele_mechanism
  prompt: >-
    Do the truncating CDH2 alleles (two frameshifts and a nonsense variant)
    cause ACOGS by the same dominant-negative route as the EC4-EC5 missense
    alleles, or by haploinsufficiency?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Truncation of the N-cadherin Cytoplasmic Catenin-Binding Tail
  - pathophysiology#Failure of Trans Homophilic Adhesion with Dominant-Negative Interference
  rationale: >-
    The founding cohort's functional work was done exclusively on EC4-EC5
    missense alleles, and the interference argument rests on those experiments.
    The frameshift alleles are described only as predicted to truncate the
    cytoplasmic domain; no protein was measured. A later patient carries a de
    novo nonsense allele, which - depending on its position relative to the last
    exon-exon junction - could instead trigger nonsense-mediated decay and give
    straightforward haploinsufficiency. Two mechanisms that produce the same
    clinical label is not a cosmetic distinction: it changes whether whole-gene
    deletions should be expected to cause ACOGS, whether the disorder is a
    candidate for allele-specific silencing, and how a novel truncating variant
    of uncertain significance should be interpreted. The entry deliberately
    keeps the truncating alleles in their own PROVISIONAL pathophysiology node
    rather than merging them into the antimorphic node.
  proposed_experiments:
  - experiment_id: exp_acogs_truncating_allele_protein
    name: Measure N-cadherin protein and transcript in patient cells carrying truncating CDH2 alleles
    description: >-
      Quantify CDH2 transcript (with and without translation inhibition to
      unmask nonsense-mediated decay) and N-cadherin protein level and surface
      localisation in fibroblasts or reprogrammed cells from individuals with
      the frameshift and nonsense alleles, against EC4-EC5 missense carriers and
      controls. A reduced transcript that is restored by decay inhibition
      indicates haploinsufficiency; a stable truncated protein at the membrane
      indicates interference.
  - experiment_id: exp_acogs_cdh2_deletion_phenotype
    name: Phenotype ascertainment in carriers of whole-gene CDH2 deletions
    description: >-
      Systematically review copy-number databases for individuals with
      heterozygous deletions spanning CDH2 and determine whether any has the
      ACOGS phenotype. Absence of ACOGS among deletion carriers would argue
      strongly against haploinsufficiency as a sufficient mechanism.
  evidence:
  - reference: PMID:35708058
    reference_title: "A Novel nonsense variant in the CDH2 gene associated with ACOGS: A case report."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "reported the fifteenth patient with ACOGS, having a novel de novo nonsense"
    explanation: >-
      The existence of a de novo nonsense allele in a clinically typical patient
      is what makes the mechanism question live rather than academic.
- discussion_id: acogs_organ_level_stochasticity
  prompt: >-
    What determines which organs are affected, and how severely, in an
    individual with a given CDH2 variant?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Structural Congenital Heart Disease
  - phenotypes#Hypoplastic left heart syndrome
  - phenotypes#Ventricular septal defect
  rationale: >-
    A likely monozygotic twin pair sharing one pathogenic CDH2 variant - and
    therefore essentially one genome and one intrauterine environment - had
    hypoplastic left heart syndrome in one twin and a ventricular septal defect
    with pulmonary hypertension in the other. That is close to a controlled
    experiment, and it rules out common genetic background as the sole
    explanation for the well-known variable expressivity of CDH2 variants. What
    remains as candidate explanations is stochastic variation in a threshold
    process (adhesive bond number crossing a critical value at a particular
    place and time), post-zygotic somatic variation, or twin-specific vascular
    factors. None has been tested. Until it is, prognostic counselling for a
    newly diagnosed ACOGS fetus or infant cannot be based on the phenotype of an
    affected relative.
  proposed_experiments:
  - experiment_id: exp_acogs_twin_somatic_sequencing
    name: Deep sequencing of discordant tissues in CDH2-variant twin pairs
    description: >-
      Deep sequence cardiac and blood tissue from discordant CDH2-variant twins
      to test whether post-zygotic somatic variation, mosaic variant allele
      fraction, or a second hit explains the organ-level divergence.
  - experiment_id: exp_acogs_registry_genotype_phenotype
    name: Prospective ACOGS registry with systematic organ-system phenotyping
    description: >-
      Build a registry that phenotypes every ascertained individual across all
      four defining organ systems with a fixed protocol (brain MRI,
      echocardiography, ophthalmology, genitourinary assessment), so that the
      current genotype-phenotype picture stops being an artefact of which
      specialist happened to see the patient.
  evidence:
  - reference: PMID:41997214
    reference_title: "Phenotypic discordance in monozygotic twins with a CDH2 variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "have described such variable expressivity in twins with the same CDH2 variant."
    explanation: >-
      Establishes that this degree of within-genotype discordance had not
      previously been documented, which is why it is recorded as an open gap
      rather than an explained observation.
- discussion_id: acogs_no_model_of_the_human_allele
  prompt: >-
    Does any existing animal or cellular model recapitulate ACOGS, or is the
    causal chain from N-cadherin adhesion failure to the human malformations
    entirely inferential?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Failure of Midline Axon Pathfinding and Callosal Tract Formation
  - pathophysiology#Loss of Neuroepithelial Adherens Junction Integrity and Neuronal Migration Failure
  - pathophysiology#Adhesion Failure in Ocular and Genital Primordia
  rationale: >-
    None of the three Cdh2 mouse models curated in this entry models this
    disease. (Those three are not the whole Cdh2 mouse literature - a
    substantial body of brain-specific conditional-knockout work exists and is
    relevant to the neuroepithelial node, but none of it carries an ACOGS
    allele either.) The
    constitutive null is homozygous lethal by embryonic day 10, before the
    corpus callosum, cortex, eye or genitalia are built, and heterozygous nulls
    are not reported as abnormal - so the model that shows the cardiac
    requirement cannot show the neurodevelopmental one. The cardiac-specific
    inducible knockout addresses the adult working myocardium and produces
    dilated cardiomyopathy, a different disease. The p.H150Y knock-in models the
    allelic recessive ADHD disorder, has no anatomical brain abnormality, and is
    homozygous. No knock-in of an ACOGS EC4-EC5 allele has been made. The
    consequence for this entry is concrete: the pathophysiology nodes linking
    adhesion failure to callosal agenesis, periventricular heterotopia and
    ocular/genital malformation are tagged PROVISIONAL or HYPOTHETICAL, and
    should not be read as demonstrated causal chains.
  proposed_experiments:
  - experiment_id: exp_acogs_knockin_mouse
    name: Heterozygous knock-in of an ACOGS EC4-EC5 allele in mouse
    description: >-
      Generate a mouse heterozygous for one of the recurrent ACOGS calcium-site
      substitutions and score corpus callosum formation, cortical lamination and
      periventricular heterotopia, cardiac septation, anterior-segment
      development and testicular descent. Compare directly against a
      heterozygous null littermate to separate interference from
      haploinsufficiency in vivo.
  - experiment_id: exp_acogs_patient_organoid_adhesion
    name: Patient-derived cortical organoid and cardiac organoid adhesion assay
    description: >-
      Derive iPSCs from ACOGS individuals and controls, and measure apical
      adherens-junction integrity, neuroepithelial rosette architecture and
      neuronal migration in cortical organoids, plus tissue cohesion in cardiac
      organoids, to test the two mechanistic nodes in human cells carrying the
      real allele.
  evidence:
  - reference: PMID:9015265
    reference_title: "Developmental defects in mouse embryos lacking N-cadherin."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "mutant embryos. Homozygous mutant embryos die by Day 10 of gestation. The"
    explanation: >-
      Early embryonic lethality of the homozygous null is the specific reason
      the mouse cannot be used to test the neurodevelopmental arm of the
      mechanism.
  - reference: PMID:34702855
    reference_title: "CDH2 mutation affecting N-cadherin function causes attention-deficit hyperactivity disorder in humans and mice."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "caused by a missense mutation in CDH2, which encodes the adhesion protein"
    explanation: >-
      The only knock-in mouse carrying a human CDH2 missense allele models the
      recessive ADHD disorder, not ACOGS, so it does not fill this gap.
animal_models:
- species: Mouse
  genotype: Cdh2 constitutive null (homozygous)
  genes:
  - preferred_term: CDH2
    term:
      id: hgnc:1759
      label: CDH2
  description: >-
    The classical N-cadherin knockout. Neurulation and somitogenesis begin but
    the resulting structures are malformed, the somitic epithelium loses
    organisation, the neural tube undulates, and the primitive heart tube
    dissociates; embryos die by day 10 of gestation. It is the best evidence
    that N-cadherin is required for tissue cohesion during morphogenesis,
    including specifically in early heart development, and it establishes that
    the cardiac defect is mechanical rather than electrical, since isolated null
    cardiomyocytes still beat synchronously. It is not, however, a model of
    ACOGS: the human disease is heterozygous and caused by expressed missense or
    truncating alleles, and the mouse dies before any of the affected human
    structures are built.
  evidence:
  - reference: PMID:9015265
    reference_title: "Developmental defects in mouse embryos lacking N-cadherin."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "heart; although myocardial tissue forms initially, the myocytes subsequently"
    explanation: >-
      Describes the cardinal cardiac phenotype of the null - initial myocardial
      formation followed by loss of myocyte cohesion.
  - reference: PMID:9015265
    reference_title: "Developmental defects in mouse embryos lacking N-cadherin."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "mutant embryos. Homozygous mutant embryos die by Day 10 of gestation. The"
    explanation: >-
      The lethality window that limits the model's usefulness for the
      neurodevelopmental and ocular arms of ACOGS.
- species: Mouse
  genotype: Cardiac-specific tamoxifen-inducible Cdh2 conditional knockout (adult)
  genes:
  - preferred_term: CDH2
    term:
      id: hgnc:1759
      label: CDH2
  description: >-
    Included as an explicit contrast model, not as an ACOGS model. Deleting
    N-cadherin from the adult working myocardium dissolves the intercalated
    disc, produces modest dilated cardiomyopathy with impaired function, and
    kills most animals within two months from spontaneous ventricular
    tachycardia. This is the biology behind the CDH2 rows on arrhythmogenic and
    dilated cardiomyopathy gene panels, and it is a different phenotype from the
    structural congenital heart disease of ACOGS - a maintenance failure in a
    formed organ rather than a morphogenetic failure during its construction.
  evidence:
  - reference: PMID:15662031
    reference_title: "Induced deletion of the N-cadherin gene in the heart leads to dissolution of the intercalated disc structure."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "N-cadherin was deleted in the adult myocardium. Loss of N-cadherin resulted in"
    explanation: >-
      Establishes the adult, maintenance-phase context of this model, which is
      what distinguishes it from the developmental mechanism of ACOGS.
  - reference: PMID:15662031
    reference_title: "Induced deletion of the N-cadherin gene in the heart leads to dissolution of the intercalated disc structure."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "desmosomes. The mutant mice exhibited modest dilated cardiomyopathy and impaired"
    explanation: >-
      Names the resulting phenotype - dilated cardiomyopathy - which is the
      cardiomyopathy claim that must be kept separate from ACOGS.
- species: Mouse
  genotype: Cdh2 p.H150Y knock-in (homozygous)
  background: C57BL/6JRcc
  genes:
  - preferred_term: CDH2
    term:
      id: hgnc:1759
      label: CDH2
  description: >-
    A CRISPR/Cas9 knock-in carrying the human p.H150Y substitution that causes
    the allelic autosomal recessive CDH2 ADHD disorder. Homozygous mice are
    hyperactive with impaired sensorimotor gating, respond to methylphenidate,
    and show presynaptic vesicle-clustering and dopaminergic deficits - but no
    anatomical or histological brain abnormality. It is recorded here as the
    boundary of the ACOGS phenotype rather than as a model of it: the same gene,
    a different domain (the prodomain furin cleavage motif rather than EC4-EC5),
    a different inheritance mode, and a behavioural rather than malformative
    outcome.
  evidence:
  - reference: PMID:34702855
    reference_title: "CDH2 mutation affecting N-cadherin function causes attention-deficit hyperactivity disorder in humans and mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "generation and analysis of mice homozygous for the human"
    explanation: >-
      Establishes that the model is homozygous for the human allele, in contrast
      to the heterozygous de novo alleles of ACOGS.
  - reference: PMID:34702855
    reference_title: "CDH2 mutation affecting N-cadherin function causes attention-deficit hyperactivity disorder in humans and mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "p.H150Y in CDH2 (transcript variant 1; NM_001792.4)."
    explanation: >-
      Names the specific allele modelled, which is not one of the ACOGS alleles.
differential_diagnoses:
- name: Mowat-Wilson syndrome
  disease_term:
    preferred_term: Mowat-Wilson syndrome
    term:
      id: MONDO:0009341
      label: Mowat-Wilson syndrome
  description: >-
    The closest clinical mimic. Mowat-Wilson syndrome, caused by de novo
    heterozygous loss-of-function ZEB2 variants, combines a distinctive facial
    gestalt, global developmental delay and intellectual disability, agenesis or
    hypoplasia of the corpus callosum and congenital heart defects - three of
    the four organ systems that define ACOGS. A child with callosal agenesis,
    developmental delay and congenital heart disease will be tested for ZEB2
    first.
  distinguishing_features:
  - Caused by ZEB2 (hgnc:14881), a transcription factor, rather than CDH2 (hgnc:1759), an adhesion molecule - verified with OAK against MONDO:0009341.
  - Hirschsprung disease is characteristic of Mowat-Wilson syndrome and is not a reported feature of ACOGS. Epilepsy does not separate the two - it is common in Mowat-Wilson syndrome and is also a minority ACOGS feature (see the Seizure phenotype in this entry).
  - Microcephaly is typical of Mowat-Wilson syndrome, whereas macrocephaly is annotated in half the assessed ACOGS cohort.
  - Mowat-Wilson syndrome has a diagnostically recognisable facial gestalt; the ACOGS facial phenotype is non-specific, with no single feature exceeding about half the cohort.
  - Duane anomaly, mirror movements and periventricular heterotopia are ACOGS features and are not part of the Mowat-Wilson phenotype.
  notes: >-
    MONDO:0009341 and the ZEB2 gene assignment (HGNC:14881) were both verified
    with OAK on 2026-08-01; the term matches the disease_term already bound in
    kb/disorders/Mowat-Wilson_syndrome.yaml. The distinguishing features are
    reasoned contrasts drawn from that existing entry and from the HPO
    annotation set for OMIM:618929, not quotations, so no evidence item is
    attached. Each Mowat-Wilson side of a contrast is curated in that entry:
    distinctive facial features, developmental delay/intellectual disability and
    Hirschsprung disease in its description and phenotypes, and Microcephaly as
    its own phenotype. Claims that are true of Mowat-Wilson syndrome in the
    literature but are not curated in that entry (hypospadias, the specific
    uplifted-earlobe/prominent-chin gestalt) were removed rather than asserted
    without a source.
- name: DCC-related mirror movements and/or agenesis of the corpus callosum
  disease_term:
    preferred_term: mirror movements 1 and/or agenesis of the corpus callosum
    term:
      id: MONDO:0100515
      label: mirror movements 1 and/or agenesis of the corpus callosum
  description: >-
    The mechanistically closest differential rather than merely the clinically
    closest. Heterozygous DCC variants produce congenital mirror movements
    and/or agenesis of the corpus callosum - exactly the two axon-pathfinding
    readouts that ACOGS shares - and DCC is the netrin-1 receptor, i.e. the
    guidance-receptor arm of the same midline-crossing decision that N-cadherin
    contributes adhesion to. The pair is instructive: a receptor lesion and an
    adhesion lesion converge on the same commissural failure.
  distinguishing_features:
  - Caused by DCC (hgnc:2701) rather than CDH2 (hgnc:1759).
  - DCC disease is usually familial and transmitted with reduced penetrance; ACOGS variants are predominantly de novo, with one documented transmission from an apparently unaffected mother (PMID:31650526).
  - DCC disease is confined to the callosal/mirror-movement axis, with no cardiac, ocular-anterior-segment or genital malformation.
  - Intellectual disability is not a consistent feature of DCC-related disease, whereas neurodevelopmental impairment is the characterising feature of ACOGS.
  notes: >-
    MONDO:0100515 was verified with OAK on 2026-08-01; its definition names DCC
    as the causal gene, and hgnc:2701 was independently verified as the DCC
    HGNC identifier. The dismech entry Familial Congenital Mirror Movements
    (MONDO:0016558) is the parent term of MONDO:0100515. No evidence item is
    attached: the contrast is a reasoned cross-reference, not a quoted finding.
    The two clinical contrasts trace to that entry:
    kb/disorders/Familial_Congenital_Mirror_Movements.yaml describes the
    disorder as "typically autosomal dominant" with DCC penetrance "incomplete
    (~68%, higher in males)", and states that "Intelligence and life expectancy
    are typically normal in isolated CMM".
- name: Duane retraction syndrome (isolated)
  disease_term:
    preferred_term: Duane retraction syndrome
    term:
      id: MONDO:0007473
      label: Duane retraction syndrome
  description: >-
    Isolated Duane retraction syndrome is a congenital cranial dysinnervation
    disorder confined to the eye. It matters here because Duane anomaly is one
    of the three axon-pathfinding features of ACOGS, so an ophthalmologist
    seeing a child with Duane anomaly needs a reason to look further.
  distinguishing_features:
  - Isolated Duane retraction syndrome has no callosal anomaly, no developmental delay, and no cardiac or genital malformation; the presence of any of these should prompt syndromic evaluation.
  - Most isolated Duane retraction syndrome is sporadic and non-Mendelian; the syndromic Mendelian forms are attributed to CHN1 (Duane retraction syndrome 2, MONDO:0011444, hgnc:1943) and to SALL4 in Duane-radial ray syndrome, not to CDH2.
  - Duane anomaly is not annotated at all in the HPO annotation set for OMIM:618929 despite being named in the founding report, so it is a minority ACOGS feature and its absence does not exclude ACOGS.
  notes: >-
    MONDO:0007473 matches the disease_term bound in
    kb/disorders/Duane_Retraction_Syndrome.yaml; MONDO:0011444 and its CHN1
    gene assignment (HGNC:1943) were verified with OAK on 2026-08-01. No
    evidence item is attached; the contrast is reasoned. The sporadic/Mendelian
    split traces to that entry, which describes isolated Duane retraction
    syndrome as mostly sporadic with roughly 10% familial and the identified
    Mendelian forms autosomal dominant, citing GeneReviews.
- name: CDH2-related autosomal recessive attention-deficit hyperactivity disorder
  description: >-
    An allelic disorder rather than a phenocopy, and the sharpest illustration
    that "a CDH2 variant" is not one thing. Three siblings of a consanguineous
    kindred with severe childhood-onset ADHD were homozygous for c.355C>T
    (p.H150Y), a substitution in the prodomain furin-cleavage motif that impairs
    proteolytic maturation of N-cadherin rather than its adhesive interface. The
    resulting phenotype is behavioural and synaptic, with no malformation.
  distinguishing_features:
  - Autosomal recessive, homozygous, segregating in a consanguineous family - versus de novo heterozygous in ACOGS.
  - The variant lies in the prodomain cleavage motif and impairs furin-mediated protein maturation, not in the EC4-EC5 adhesive/calcium-binding region.
  - The phenotype is isolated ADHD with normal brain anatomy; there is no corpus callosum, cardiac, ocular or genital malformation.
  - The knock-in mouse for this allele has no anatomical or histological brain abnormality, in contrast to the malformative human ACOGS phenotype.
  notes: >-
    No MONDO term was found for this entity, so no disease_term is bound rather
    than binding an approximate one. OMIM does not list it as a separate
    phenotype series entry in the MONDO record for MONDO:0030065.
  evidence:
  - reference: PMID:34702855
    reference_title: "CDH2 mutation affecting N-cadherin function causes attention-deficit hyperactivity disorder in humans and mice."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we describe three siblings of a consanguineous kindred"
    explanation: >-
      Establishes the recessive, consanguineous family structure that
      distinguishes this entity from the de novo heterozygous ACOGS alleles.
  - reference: PMID:34702855
    reference_title: "CDH2 mutation affecting N-cadherin function causes attention-deficit hyperactivity disorder in humans and mice."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "to segregate within the family as expected for autosomal recessive"
    explanation: >-
      Confirms autosomal recessive segregation, the mode of inheritance contrast
      with ACOGS.
  - reference: PMID:34702855
    reference_title: "CDH2 mutation affecting N-cadherin function causes attention-deficit hyperactivity disorder in humans and mice."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "to interfere with the proteolysis and maturation of the protein."
    explanation: >-
      Names the molecular mechanism - impaired maturation - which is different
      in kind from the adhesive-interface lesion of ACOGS.
- name: CDH2-associated arrhythmogenic right ventricular cardiomyopathy
  disease_term:
    preferred_term: arrhythmogenic right ventricular cardiomyopathy
    term:
      id: MONDO:0016587
      label: arrhythmogenic right ventricular cardiomyopathy
  description: >-
    Not a differential for the ACOGS presentation, but recorded because CDH2
    appears on arrhythmogenic cardiomyopathy gene panels and the two claims are
    routinely conflated. Arrhythmogenic right ventricular cardiomyopathy is an
    adult-onset disease of the desmosomal/adherens-junction complex of the
    working myocardium, presenting with ventricular arrhythmia and fibrofatty
    replacement; the biology is intercalated-disc maintenance, matching the
    adult cardiac-specific Cdh2 knockout. ClinGen classifies the
    CDH2-arrhythmogenic right ventricular cardiomyopathy relationship as
    Limited.
  distinguishing_features:
  - Adult-onset arrhythmia and myocardial replacement versus congenital structural malformation present at birth.
  - No callosal, ocular, genital or neurodevelopmental involvement.
  - ClinGen gene-disease validity for CDH2 in this disease is Limited, whereas the CDH2-ACOGS relationship rests on a nine-individual cohort with functional adhesion assays.
  - The relevant mouse model is the ADULT cardiac-specific conditional knockout, not the constitutive embryonic null.
  evidence:
  - reference: CGGV:assertion_c7a03805-bf73-4d2d-9756-c666c67be119-2018-07-13T160000.000Z
    reference_title: "CDH2 / arrhythmogenic right ventricular cardiomyopathy (Limited)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "CDH2 | HGNC:1759 | arrhythmogenic right ventricular cardiomyopathy | MONDO:0016587 | AD | Limited"
    explanation: >-
      ClinGen classifies the CDH2-arrhythmogenic right ventricular
      cardiomyopathy relationship as Limited, which is the evidence basis for
      keeping that claim separate from and weaker than the ACOGS claim.
  - reference: PMID:15662031
    reference_title: "Induced deletion of the N-cadherin gene in the heart leads to dissolution of the intercalated disc structure."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "disassembly of the intercalated disc structure, including adherens junctions and"
    explanation: >-
      Identifies the intercalated disc as the structure at risk when N-cadherin
      is lost from adult myocardium, the mechanism of the cardiomyopathy claim
      rather than of ACOGS.
- name: CDH2-associated dilated cardiomyopathy
  disease_term:
    preferred_term: dilated cardiomyopathy
    term:
      id: MONDO:0005021
      label: dilated cardiomyopathy
  description: >-
    The second CDH2 cardiomyopathy claim, likewise recorded only as contrast.
    The adult cardiac-specific Cdh2 knockout mouse develops exactly this
    phenotype, which gives the association biological plausibility, but ClinGen
    classifies the human gene-disease relationship as Limited. Nothing in the
    dilated cardiomyopathy literature should be imported into this entry, and
    nothing in this entry implies that ACOGS individuals develop dilated
    cardiomyopathy - no such progression has been reported.
  distinguishing_features:
  - Acquired ventricular dilation and systolic dysfunction in a structurally normally formed heart, versus congenital structural malformation.
  - No neurodevelopmental, ocular or genital involvement.
  - ClinGen gene-disease validity Limited (2025 reassessment by the Dilated Cardiomyopathy Gene Curation Expert Panel).
  evidence:
  - reference: CGGV:assertion_73900af1-14ee-4933-b5dc-832753e6cc6c-2025-05-16T160000.000Z
    reference_title: "CDH2 / dilated cardiomyopathy (Limited)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "CDH2 | HGNC:1759 | dilated cardiomyopathy | MONDO:0005021 | AD | Limited"
    explanation: >-
      ClinGen classifies the CDH2-dilated cardiomyopathy relationship as
      Limited, supporting its treatment here as a separate and weaker claim.
notes: >-
  Scope and boundary. This entry covers the developmental syndrome caused by de
  novo heterozygous CDH2 variants (ACOGS, OMIM:618929, MONDO:0030065). It is
  deliberately kept separate from four other CDH2 claims elsewhere in dismech
  that share the gene and little else. (1) The CDH2 rows in
  kb/disorders/Arrhythmogenic_Right_Ventricular_Cardiomyopathy.yaml and
  kb/disorders/Dilated_Cardiomyopathy.yaml are adult myocardial-maintenance
  claims that ClinGen classifies as Limited; both are cited above as explicit
  contrast and neither file was modified. (2) The CDH2 mention in
  kb/disorders/Chronic_Myeloid_Leukemia.yaml concerns N-cadherin in a
  neoplastic-signalling context and has no bearing on this disorder. (3) The
  autosomal recessive CDH2 ADHD entity (p.H150Y, prodomain cleavage motif) is
  curated above as an allelic differential, not as part of this disease. (4)
  kb/modules/reelin_terminal_translocation_lamination_failure.yaml binds
  hgnc:1759 as part of the Reelin-dependent cortical-lamination mechanism; that
  is the same adhesion biology this entry's neuroepithelial node touches, but
  the module makes no ACOGS claim and was not modified.

  Entity verification. MONDO:0030065 was verified with OAK before any content
  was written: `runoak -i sqlite:obo:mondo info MONDO:0030065 -O obo` returns
  the OMIM xref OMIM:618929 and the synonym ACOGS, and `runoak -i
  sqlite:obo:mondo relationships -p RO:0004003 MONDO:0030065` returns exactly
  one gene, HGNC:1759 CDH2. Every literature source used here names CDH2 as the
  causal gene; no competing gene appears in any of them. Every ontology
  identifier in this entry - HP, GO, CL, MONDO and HGNC - was looked up with
  OAK on 2026-08-01 before being written.

  Frequency provenance, and a caveat that applies to the whole entry. Only the
  abstracts of the three ACOGS clinical papers were retrievable into
  references_cache; the founding report (PMID:31585109) cached as
  abstract_only despite a full-text attempt. Every per-feature count in this
  entry therefore comes from the HPO annotation set for OMIM:618929, retrieved
  from the Human Phenotype Ontology annotation API on 2026-08-01, which HPO
  curators derived from the full text of PMID:31585109 and which is attributed
  to that PMID in every row. Where a feature is named in the cached abstract,
  the evidence item is SUPPORT and the band is stated in the explanation. Where
  the feature exists only in the HPO annotation set, the evidence item is
  deliberately marked PARTIAL, the snippet carries only what it actually
  supports (usually the nine-individual cohort denominator or the
  organ-system-level statement), and the explanation says plainly that the
  per-feature count is not in the cached text. No count in this entry was
  inferred, rounded up, or carried over from a related disorder. The
  denominators differ between features (9 for imaging and examination findings,
  8 for neurobehavioural assessments, 5 for male genital findings) because the
  HPO annotations use whichever subset was assessed; this is stated on each
  phenotype rather than smoothed into a single cohort size.

  Every band now follows its raw fraction. Global developmental delay is
  annotated 6 of 8 (75%) and is banded FREQUENT (30-79%) accordingly. An earlier
  revision of this entry set it to VERY_FREQUENT on the argument that the
  founding report makes developmental delay and/or intellectual disability a
  defining criterion; that argument is retained in the phenotype's description
  and explanation, but it is prose about the syndrome rather than a count for
  HP:0001263, so it no longer overrides the band. No cached source gives a
  combined delay-or-disability numerator.

  Why there is no treatments section. No ACOGS-specific management has been
  published. Care is organ-directed and generic - surgical repair of the
  cardiac lesion, developmental and educational support, strabismus and
  anterior-segment surgery, orchidopexy - and none of it is attested for a
  named ACOGS patient in any cached reference. Writing that list would mean
  asserting management that no source in this entry supports, so it is omitted
  and the diagnosis section carries the assessment recommendations instead. If
  a case report documenting what was actually done for an ACOGS patient
  appears, the treatments section should be added.

  What is genuinely uncertain. Three things, each curated as an open
  discussion rather than smoothed over: whether the truncating alleles work by
  interference or by haploinsufficiency
  (acogs_truncating_allele_mechanism); what determines organ-level severity,
  given that monozygotic twins with one variant had radically different hearts
  (acogs_organ_level_stochasticity); and the fact that no model system carries
  an ACOGS allele at all, so the chain from adhesion failure to callosal
  agenesis, periventricular heterotopia and ocular/genital malformation is
  inference (acogs_no_model_of_the_human_allele). The ocular/genital node is
  tagged HYPOTHETICAL for that reason and is a terminal branch.

  Sources deliberately not used. PubMed searches on 2026-08-01 for CDH2 with
  "agenesis of corpus callosum" and for "CDH2 AND ACOGS" each returned only the
  three clinical papers cited here, so the entire clinical literature is
  curated. A large N-cadherin literature exists in cancer biology
  (epithelial-mesenchymal transition, prostate and neuroblastoma metastasis,
  the N-cadherin/beta-catenin axis in blast-crisis CML); it is dominated by
  somatic and expression-level biology in tumours and says nothing about
  germline developmental disease, so none of it was used. No GeneReviews
  chapter is cited: PubMed searches on 2026-08-01 with "CDH2 AND
  GeneReviews[All Fields]" and "ACOGS AND GeneReviews[All Fields]" each
  returned 0 records. That is a statement about those two searches on that
  date, not a verified fact about the GeneReviews catalogue. No ORPHA record
  for this disorder is present in references_cache/ (and MONDO:0030065 has no
  Orphanet xref), and no ClinGen gene-disease
  validity assertion for CDH2-ACOGS exists in the cached ClinGen snapshot
  (2026-01-24), which holds only the two CDH2 cardiomyopathy assertions cited
  above as contrast.

- name: Truncation of the N-cadherin Cytoplasmic Catenin-Binding Tail
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    A minority of ACOGS alleles are not ectodomain missense changes at all. Two
    frameshift variants in the founding cohort are predicted to produce a
    truncated cytoplasmic domain, and a later patient carried a de novo nonsense
    allele. The cytoplasmic tail of N-cadherin is the docking site for
    beta-catenin and p120-catenin and thus the entire link from the adhesion
    complex to the actin cytoskeleton; a molecule that keeps its ectodomain but
    loses its tail can still engage a partner in trans yet cannot transmit or
    resist force, and cannot be stabilised in a junction. Whether these alleles
    act that way or are instead degraded - producing true haploinsufficiency -
    is not resolved by any published experiment, which is why this node is
    PROVISIONAL and is kept separate from the ectodomain node rather than merged
    into it. The distinction matters because the two readings predict different
    things about modifier therapy and about the phenotype of whole-gene
    deletions.

diagnosis:
- name: Exome or genome sequencing with de novo CDH2 variant interpretation
  description: >-
    Molecular diagnosis rests on finding a heterozygous CDH2 variant, confirmed
    de novo by parental testing, in a child with developmental delay plus a
    midline brain malformation and/or structural congenital heart disease. Two
    interpretation points follow from the published allelic spectrum. First,
    missense changes should be weighted by domain: substitutions of conserved
    residues in EC4-EC5, and particularly at the EC4-EC5 interdomain calcium
    site, are where the reported pathogenic missense alleles sit, and a variant
    there deserves more weight than its in-silico score alone would give it.
    Second, a CDH2 variant found on a cardiomyopathy gene panel is a different
    claim entirely and does not diagnose ACOGS - the panel association is with
    adult arrhythmogenic and dilated cardiomyopathy, is classified by ClinGen as
    Limited, and carries no expectation of callosal, ocular or genital
    involvement.
  diagnosis_term:
    preferred_term: exome or genome sequencing
    term:
      id: NCIT:C101293
      label: Next Generation Sequencing

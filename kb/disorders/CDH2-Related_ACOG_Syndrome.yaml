name: CDH2-Related ACOG Syndrome
creation_date: "2026-08-01T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: agenesis of corpus callosum, cardiac, ocular, and genital syndrome
  term:
    id: MONDO:0030065
    label: agenesis of corpus callosum, cardiac, ocular, and genital syndrome
description: >-
  A multisystem developmental disorder caused by de novo heterozygous variants
  in CDH2, the gene encoding N-cadherin. N-cadherin is a classical type I
  cadherin whose five extracellular cadherin (EC) domains are separated by
  calcium-binding interdomain linkers and which holds apposing cell
  surfaces together through a trans strand-swap interface at EC1 reinforced by
  lateral cis interactions. The founding cohort reported nine individuals
  carrying seven missense and two frameshift variants; six of the seven missense
  changes cluster in EC domains 4 and 5 and four of them hit the calcium-binding
  site of the EC4-EC5 interdomain, and cells expressing these alleles fail to
  bind in trans even to wild-type N-cadherin presented on an apposing cell. The
  clinical consequence is a bundle of defects in exactly those tissues whose
  morphogenesis depends on N-cadherin-mediated cohesion: midline axon
  pathfinding (corpus callosum agenesis or hypoplasia, mirror movements, Duane
  anomaly), the ventricular-zone neuroepithelium (periventricular heterotopia),
  the early myocardium (structural congenital heart disease), and the ocular and
  genital primordia. Global developmental delay and/or intellectual disability
  are the most consistent neurodevelopmental features - the HPO annotation set
  for OMIM:618929 (retrieved 2026-08-01) records global developmental delay in
  6 of 8 and intellectual disability in 4 of 8 assessed individuals, so neither
  is universal. Because the mutant protein is still
  made and still engages wild-type partners unproductively, the mechanism is
  best read as antimorphic interference with adhesion rather than simple loss of
  one allele's worth of protein - although a later report of a de novo nonsense
  allele leaves that reading unsettled. The disorder is ultra-rare: fifteen
  published individuals as of the 2022 case report, with a likely monozygotic
  twin pair added in 2026 whose strikingly discordant cardiac phenotypes
  (hypoplastic left heart syndrome in one, ventricular septal defect with
  pulmonary hypertension in the other) show that the CDH2 genotype does not fix
  the organ-level outcome.

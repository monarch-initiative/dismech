pathophysiology:
- name: Loss of Calcium Coordination at the N-cadherin EC4-EC5 Interdomain Site
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    The N-cadherin ectodomain is a chain of five extracellular cadherin (EC)
    domains whose linkers each bind calcium ions. Calcium occupancy is not
    decorative: the crystallographic work on type I cadherin ectodomains
    attributes what stiffness the interdomain linkers have to bound calcium,
    while noting in the same sentence that the resulting curvature of the rod is
    still "likely to be somewhat variable" and citing unpublished data for the
    rigidification itself. The geometry that presents the distal EC1 tip to a
    partner molecule on the apposing membrane therefore depends on these
    calcium-loaded linkers. Four of the seven ACOGS missense substitutions replace conserved
    residues of the calcium-binding site at the EC4-EC5 interdomain, and six of
    the seven fall within EC4-EC5 overall. This node is the proximal molecular
    lesion for the missense class of ACOGS alleles: the substitutions are not
    predicted to abolish the protein, they are predicted to unhinge it.
  molecular_functions:
  - preferred_term: interdomain calcium ion binding by the N-cadherin ectodomain
    term:
      id: GO:0005509
      label: calcium ion binding
    modifier: DECREASED
  downstream:
  - target: Failure of Trans Homophilic Adhesion with Dominant-Negative Interference
  evidence:
  - reference: PMID:31585109
    reference_title: "De Novo Pathogenic Variants in N-cadherin Cause a Syndromic Neurodevelopmental Disorder with Corpus Collosum, Axon, Cardiac, Ocular, and Genital Defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "consists of extracellular cadherin (EC) domains, separated by calcium binding"
    explanation: >-
      States the architecture that this node depends on - EC domains separated
      by calcium-binding sites.
  - reference: PMID:31585109
    reference_title: "De Novo Pathogenic Variants in N-cadherin Cause a Syndromic Neurodevelopmental Disorder with Corpus Collosum, Axon, Cardiac, Ocular, and Genital Defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "calcium-binding site in the EC4-EC5 interdomain. We show that cells expressing"
    explanation: >-
      Localises the disease substitutions to the EC4-EC5 interdomain calcium
      site, which is precisely what this node models.
  - reference: PMID:21300292
    reference_title: "The extracellular architecture of adherens junctions revealed by crystal structures of type I cadherins."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "ectodomain curvature, which is likely to be somewhat variable despite rigidification by interdomain calcium binding"
    explanation: >-
      Structural work on type I cadherin ectodomains (including N-cadherin)
      treats interdomain calcium binding as what rigidifies the ectodomain,
      which is the biophysical reason a calcium-site substitution is expected to
      be damaging even though it is a single conservative-looking amino acid
      change. Graded PARTIAL rather than SUPPORT because the paper states the
      rigidification in passing, citing unpublished data, and in the same
      sentence says the resulting curvature is still somewhat variable - it does
      not demonstrate the point.
- name: Failure of Trans Homophilic Adhesion with Dominant-Negative Interference
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Adherens junctions are built from a trans strand-swap dimer formed between
    EC1 domains projecting from opposing cells, laterally clustered by a weaker
    cis interface. Cells expressing the ACOGS EC4-EC5 variants have a
    demonstrable cell-cell adhesion defect, and - critically - the defect
    includes impaired trans binding to wild-type N-cadherin displayed on the
    apposing cell. That last observation is what converts this from a
    quantitative dosage problem into an interference problem: in a heterozygote,
    a mutant molecule reaching the surface does not merely fail to contribute,
    it occupies a binding partner's trans interface unproductively, so the
    fraction of competent adhesive bonds falls further than the 50% expected
    from allele dosage alone. Structural work on type I cadherins independently
    shows that trans-interface mutations ablate adhesion outright while
    cis-interface mutations instead destabilise junction assembly, which is the
    framework in which the ACOGS alleles should be read.
  molecular_functions:
  - preferred_term: N-cadherin trans homophilic binding
    term:
      id: GO:0098641
      label: cadherin binding involved in cell-cell adhesion
    modifier: DECREASED

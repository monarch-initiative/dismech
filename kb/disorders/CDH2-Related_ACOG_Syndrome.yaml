- name: Structural Congenital Heart Disease
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  description: >-
    The cardiac output of the syndrome is structural malformation present at
    birth, spanning septation defects (atrioventricular canal defect,
    ventricular septal defect), left-sided obstructive lesions (coarctation of
    the aorta, hypoplastic left heart syndrome), valvar regurgitation and
    situs abnormality (dextrocardia). The severity is not predicted by
    genotype: a likely monozygotic twin pair sharing one pathogenic CDH2
    variant had hypoplastic left heart syndrome in one twin and a ventricular
    septal defect with pulmonary hypertension in the other, which is the
    cleanest available demonstration that stochastic or non-genetic factors set
    the cardiac outcome.

- name: CDH2
  gene_term:
    preferred_term: CDH2
    term:
      id: hgnc:1759
      label: CDH2
  relationship_type: CAUSATIVE
  variant_origin: DE_NOVO
  association: De novo heterozygous variants; sole known cause of ACOGS
  notes: >-
    CDH2 (18q12.1) encodes N-cadherin, a classical type I cadherin. The ACOGS
    allelic spectrum has two structurally distinct classes. The first is
    missense substitutions of highly conserved residues concentrated in the
    membrane-proximal extracellular cadherin domains: p.Asp353Asn, p.Asp597Asn,
    p.Asp597Tyr, p.Asn601Thr, p.Cys613Trp, p.Asp627Gly and p.Tyr676Cys, of which
    six of seven fall in EC4-EC5 and four disrupt the EC4-EC5 interdomain
    calcium site. The second is frameshift alleles that truncate the cytoplasmic
    tail (p.Leu855Valfs and p.Leu856Phefs), plus a later de novo nonsense
    allele. The reference transcript used by the ADHD study for the allelic
    recessive disorder is NM_001792.4. Deliberately excluded from this entry:
    the CDH2 rows that appear in the dismech arrhythmogenic right ventricular
    cardiomyopathy and dilated cardiomyopathy entries are a different
    gene-disease claim (adult myocardial adhesion, ClinGen validity Limited),
    not the developmental syndrome curated here.

- name: Structural Midline Brain Malformation and Neurodevelopmental Impairment
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  description: >-
    The convergent output of the axon-pathfinding and neuroepithelial arms is a
    brain that is structurally miswired at the midline and at the ventricular
    zone: corpus callosum agenesis or hypoplasia, interhemispheric cysts,
    interhypothalamic adhesion, and periventricular heterotopia. Clinically this
    presents as global developmental delay in infancy evolving to intellectual
    disability, with mirror movements, seizures and behavioural phenotypes
    (autistic behaviour, attention deficit hyperactivity disorder) in a minority.
    Because the lesions are malformative rather than degenerative, the expected
    course is static impairment with developmental progress, not regression.

- name: Loss of Neuroepithelial Adherens Junction Integrity and Neuronal Migration Failure
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    N-cadherin is the principal adhesion molecule of the apical adherens
    junction belt that seals the ventricular-zone neuroepithelium and anchors
    radial glial endfeet at the ventricular surface. That belt is both the
    structural scaffold of the neuroepithelium and the launch pad for radially
    migrating neurons. Loss of adhesive competence therefore predicts two
    coupled failures: breaches in the ventricular lining, and neurons that never
    leave the periventricular region - the cell-biological signature of
    periventricular nodular heterotopia, which is present in a substantial
    minority of the ACOGS cohort. The experimental support cited here is the
    N-cadherin-null mouse, in which neurulation begins normally but the neural
    tube is malformed and undulating, showing that N-cadherin is required for
    neuroepithelial integrity rather than for the initiation of neurulation.
    This is model-organism evidence from a homozygous null, so it is directional
    support for the mechanism, not a model of the human heterozygous disease.
  cell_types:

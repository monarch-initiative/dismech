- name: Failure of Myocardial Cell Cohesion During Cardiac Morphogenesis
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  description: >-
    The looping heart tube and the septating chambers are built by sheets of
    cardiomyocytes that must stay mechanically coupled while they deform. In
    N-cadherin-null mouse embryos this is the single most dramatic defect:
    myocardial tissue forms, then the myocytes dissociate and the heart tube
    fails to develop. Notably, isolated null cardiomyocytes still beat
    synchronously, so the primary lesion is mechanical cohesion, not electrical
    coupling. In ACOGS the human phenotype is correspondingly structural -
    atrioventricular canal defect, coarctation, ventricular septal defect,
    hypoplastic left heart, dextrocardia - rather than a cardiomyopathy. This is
    the node that must not be conflated with N-cadherin's separate, postnatal
    role at the intercalated disc of the working myocardium, where induced
    deletion in the adult mouse causes intercalated-disc dissolution, dilated
    cardiomyopathy and fatal ventricular arrhythmia.

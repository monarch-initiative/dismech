diagnosis:
- name: Exome Sequencing
  description: >-
    Diagnosis is molecular: biallelic EEF1D variants found by exome sequencing, in
    consanguineous families usually after autozygosity mapping, or by trio exome
    sequencing. No biochemical marker is known.
  diagnosis_term:
    preferred_term: whole exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  results: Biallelic pathogenic EEF1D variants, homozygous or compound heterozygous.
  evidence:
  - reference: PMID:38083972
    reference_title: Autosomal recessive intellectual disability caused by compound heterozygous variants of the EEF1D gene in a Chinese family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "In this case, compound heterozygous variants of the EEF1D gene were found in the child through trio whole-exome sequencing; one was a splice variant (NM_032378.6:c.1905+1G>A) inherited from his father, and the other was a nonsense variant (NM_032378.6:c.676C>T) inherited from his mother."
    explanation: Trio exome sequencing established the diagnosis in the compound heterozygous patient.
  - reference: PMID:28097321
    reference_title: Diagnostic Yield and Novel Candidate Genes by Exome Sequencing in 152 Consanguineous Families With Neurodevelopmental Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Autozygosity mapping in families and exome sequencing of index patients were performed in 152 consanguineous families"
    explanation: The strategy by which the first EEF1D family was found.
- name: Brain MRI
  description: >-
    Brain MRI is supportive rather than diagnostic, showing a thin, hypoplastic or absent
    corpus callosum and sometimes arachnoid cysts.
  diagnosis_term:

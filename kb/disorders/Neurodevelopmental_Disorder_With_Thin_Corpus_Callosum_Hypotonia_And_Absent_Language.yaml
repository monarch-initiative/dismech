  - target: Seizures
mechanistic_hypotheses:
- hypothesis_group_id: eef1bdeltal_heat_shock_response_loss
  hypothesis_label: Loss of the eEF1BdeltaL Heat-Shock Transcription Factor
  status: EMERGING
  description: >-
    The disease results from loss of the long, brain-enriched isoform eEF1BdeltaL and its
    heat-shock and NRF2-dependent transcriptional stress response, not from a defect in
    translation elongation. Supported by the first variants truncating only the long
    isoform and by the brain phenotype of long-isoform knockout mice; challenged by later
    variants in the domain shared with the translation-factor isoforms.
  evidence:
  - reference: PMID:30787422
    reference_title: Biallelic loss of EEF1D function links heat shock response pathway to autosomal recessive intellectual disability.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Herein, we suggest that the loss of function variants exclusively targeting the long EEF1D isoform may explicate the ARID phenotype through the heat shock response pathway, rather than interfering with the canonical translational elongation."
    explanation: Statement of the hypothesis by the authors of the second family report.
- hypothesis_group_id: eef1b_translation_elongation_defect
  hypothesis_label: Defective eEF1B-Mediated Translation Elongation
  status: EMERGING
  description: >-
    Variants in the C-terminal guanine nucleotide exchange domain, shared by all EEF1D
    isoforms, impair eEF1B recycling of eEF1A and so protein synthesis in developing
    neurons, placing the disorder with other eEF1 complex neurodevelopmental disorders.
    Not tested functionally in patient cells.
  evidence:
  - reference: PMID:36576126
    reference_title: "Expanding the spectrum of EEF1D neurodevelopmental disorders: Biallelic variants in the guanine exchange domain."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "The EEF1D variants reported in this study are localized in the C-terminal GEF domain, suggesting that a disturbed protein translation machinery might contribute to the neurodevelopmental phenotype."
    explanation: Statement of the alternative hypothesis from the exchange-domain families.

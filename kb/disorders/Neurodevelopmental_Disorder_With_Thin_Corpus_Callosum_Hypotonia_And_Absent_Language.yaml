  results: Thin, hypoplastic or absent corpus callosum; arachnoid cyst in some.
  evidence:
  - reference: PMID:38083972
    reference_title: Autosomal recessive intellectual disability caused by compound heterozygous variants of the EEF1D gene in a Chinese family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Cerebral MRI showed agenesis of the corpus callosum/thin corpus callosum (4/4) or arachnoid cyst (2/2)"

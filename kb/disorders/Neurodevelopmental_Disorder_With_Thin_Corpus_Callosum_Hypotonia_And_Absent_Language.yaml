name: Neurodevelopmental Disorder with Thin Corpus Callosum, Hypotonia, and Absent Language
creation_date: "2026-10-19T05:10:00Z"
description: >-
  Autosomal recessive neurodevelopmental disorder caused by biallelic loss-of-function
  variants in EEF1D. The gene encodes two functionally distinct products: the short,
  ubiquitous eEF1Bdelta isoforms, which are subunits of the eEF1B guanine nucleotide
  exchange complex that recycles translation elongation factor eEF1A, and a long isoform
  (eEF1BdeltaL), produced by alternative splicing mainly in brain and testis, that acts
  as a nuclear transcription factor for heat-shock element genes. Affected children have
  severe to profound global developmental delay and intellectual disability, absent
  expressive language, microcephaly, short stature, axial or limb hypotonia that may
  coexist with spasticity, and a thin, hypoplastic or absent corpus callosum; epilepsy,
  optic atrophy, strabismus or nystagmus, and feeding difficulties occur in some. About
  a dozen patients from a handful of mostly consanguineous families have been reported,
  so frequencies are small-cohort figures. Which EEF1D function is lost to cause the
  disease is unsettled: the first variants truncated only the long isoform, pointing to
  the heat-shock response, while later variants lie in the shared guanine nucleotide
  exchange domain and so implicate translation elongation as well.
category: Mendelian
synonyms:
- EEF1D-related neurodevelopmental disorder
parents:
- neurodevelopmental disorder
- autosomal recessive intellectual disability
disease_term:
  preferred_term: neurodevelopmental disorder with thin corpus callosum, hypotonia, and absent language
  term:
    id: MONDO:0976263
    label: neurodevelopmental disorder with thin corpus callosum, hypotonia, and absent language
notes: >-
  MONDO:0976263 is equivalent to OMIM:621150. No GeneReviews chapter covers EEF1D:
  `just check-genereviews --online` returned only two candidate chapters, for NR4A2- and
  UBA5-related disorders, which name different genes. The clinical picture rests on
  roughly a dozen published patients; the per-feature counts quoted in phenotype
  evidence come from one case report's summary table of the ten patients reported before
  it, not from a systematic cohort.
pathophysiology:
- name: Biallelic EEF1D Loss of Function
  description: >-
    Biallelic truncating, splice-site or missense variants in EEF1D. The first variants
    reported, in consanguineous families from Iran and Turkey, truncate the exon unique to
    the long isoform and so remove eEF1BdeltaL while sparing the short translation-factor
    isoforms. Variants reported later lie in the C-terminal guanine nucleotide exchange
    domain that all isoforms share. Most patients are homozygous; one Chinese patient was
    compound heterozygous for a splice variant and a long-isoform nonsense variant.
    The two activities bound below are those of the two EEF1D products, the exchange
    activity of the short isoforms and the DNA-binding transcription factor activity
    of eEF1BdeltaL; which one a given variant removes depends on where it lies, and
    the two downstream nodes carry that distinction.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: EEF1D
    term:
      id: hgnc:3211
      label: EEF1D
  molecular_functions:
  - preferred_term: eEF1B guanine nucleotide exchange activity for eEF1A
    term:
      id: GO:0005085
      label: guanyl-nucleotide exchange factor activity
  - preferred_term: eEF1BdeltaL heat-shock element binding transcription factor activity
    term:
      id: GO:0003700
      label: DNA-binding transcription factor activity
  evidence:
  - reference: PMID:28097321
    reference_title: Diagnostic Yield and Novel Candidate Genes by Exome Sequencing in 152 Consanguineous Families With Neurodevelopmental Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Of these, 14 were homozygous and truncating in GRM7, STX1A, CCAR2, EEF1D, GALNT2, SLC44A1, LRRIQ3, AMZ2, CLMN, SEC23IP, INIP, NARG2, FAM234B, and TRAP1."
    explanation: >-
      First report: a homozygous truncating EEF1D variant in a consanguineous family with
      intellectual disability, identified by autozygosity mapping and exome sequencing.
  - reference: PMID:30787422
    reference_title: Biallelic loss of EEF1D function links heat shock response pathway to autosomal recessive intellectual disability.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Eventually, we have identified a novel pathogenic variant in EEF1D, which has recently been recognised as a novel candidate gene for ARID in a single family."
    explanation: Replication of EEF1D in a second consanguineous family by linkage analysis and exome sequencing.
  - reference: PMID:36576126
    reference_title: "Expanding the spectrum of EEF1D neurodevelopmental disorders: Biallelic variants in the guanine exchange domain."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "The EEF1D variants reported in this study are localized in the C-terminal GEF domain, suggesting that a disturbed protein translation machinery might contribute to the neurodevelopmental phenotype."
    explanation: >-
      Extends the allelic spectrum from long-isoform-specific variants to variants in the
      exchange domain shared by all isoforms.
  - reference: PMID:38083972
    reference_title: Autosomal recessive intellectual disability caused by compound heterozygous variants of the EEF1D gene in a Chinese family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "In this case, compound heterozygous variants of the EEF1D gene were found in the child through trio whole-exome sequencing; one was a splice variant (NM_032378.6:c.1905+1G>A) inherited from his father, and the other was a nonsense variant (NM_032378.6:c.676C>T) inherited from his mother."
    explanation: First compound heterozygous patient, consistent with recessive loss of function.
  downstream:
  - target: Loss of eEF1BdeltaL Heat-Shock Transcriptional Activity
    causal_link_type: DIRECT
    hypothesis_groups:
    - eef1bdeltal_heat_shock_response_loss
    evidence:
    - reference: PMID:38083972
      reference_title: Autosomal recessive intellectual disability caused by compound heterozygous variants of the EEF1D gene in a Chinese family.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: "It should be mentioned that the c.676C>T (p.Gln226*) variation only affects the long isoform, resulting in the production of premature termination."
      explanation: >-
        A patient allele that truncates only the long isoform, which is the product that
        carries the heat-shock transcriptional function.
  - target: Impaired eEF1B Guanine Nucleotide Exchange for eEF1A
    causal_link_type: DIRECT
    hypothesis_groups:
    - eef1b_translation_elongation_defect
    evidence:
    - reference: PMID:36576126
      reference_title: "Expanding the spectrum of EEF1D neurodevelopmental disorders: Biallelic variants in the guanine exchange domain."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: "The EEF1D variants reported in this study are localized in the C-terminal GEF domain, suggesting that a disturbed protein translation machinery might contribute to the neurodevelopmental phenotype."
      explanation: >-
        The inference rests on variant location in the exchange domain; the study did not
        measure exchange activity or translation in patient cells.
- name: Loss of eEF1BdeltaL Heat-Shock Transcriptional Activity
  description: >-
    eEF1BdeltaL is a nuclear isoform that cooperates with HSF1 to induce
    heat-shock-element genes and binds NRF2 to induce heme oxygenase 1. Its loss is
    proposed to blunt the stress response of developing neurons.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: cellular response to heat
    term:
      id: GO:0034605
      label: cellular response to heat
    modifier: DECREASED
  evidence:
  - reference: PMID:21597468
    reference_title: Transformation of eEF1Bδ into heat-shock response transcription factor by alternative splicing.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "The long isoform of eEF1Bδ (eEF1BδL) is localized in the nucleus and induces heat-shock element (HSE)-containing genes in cooperation with heat-shock transcription factor 1 (HSF1)."
    explanation: Establishes the transcriptional heat-shock function that long-isoform variants remove.
  - reference: PMID:21597468
    reference_title: Transformation of eEF1Bδ into heat-shock response transcription factor by alternative splicing.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "Moreover, the amino-terminal domain of eEF1BδL binds to NF-E2-related factor 2 (Nrf2) and induces stress response haem oxygenase 1 (HO1)."
    explanation: Second stress-response target of the long isoform.
  downstream:
  - target: Neuronal Stress Vulnerability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - eef1bdeltal_heat_shock_response_loss
    evidence:
    - reference: PMID:30333725
      reference_title: Deletion of Long Isoform of Eukaryotic Elongation Factor 1Bδ Leads to Audiogenic Seizures and Aversive Stimulus-Induced Long-Lasting Activity Suppression in Mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "After the fear conditioning test, a significant decrease in brain weight, atrophy of the hippocampus and midbrain, and reduced cortical layer thickness were observed in the KO mice."
      explanation: >-
        Selective loss of the long isoform in mice produces brain atrophy, but only after
        an aversive stimulus, which is the stress vulnerability this edge asserts.
- name: Neuronal Stress Vulnerability
  description: >-
    Without eEF1BdeltaL, the brain is less able to withstand external stressors. In
    long-isoform knockout mice this appears as audiogenic seizures and as brain atrophy
    that follows an aversive stimulus but is absent at baseline. Whether the same
    vulnerability operates in patients has not been tested. The node belongs to the
    heat-shock hypothesis only.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:30333725
    reference_title: Deletion of Long Isoform of Eukaryotic Elongation Factor 1Bδ Leads to Audiogenic Seizures and Aversive Stimulus-Induced Long-Lasting Activity Suppression in Mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "Our results suggest that eEF1BδL has an important role in normal brain function especially when exposed to external stimuli."
    explanation: The knockout authors' conclusion that the long isoform protects the brain against external stimuli.
  downstream:
  - target: Abnormal Brain Development
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - eef1bdeltal_heat_shock_response_loss
    evidence:
    - reference: PMID:30787422
      reference_title: Biallelic loss of EEF1D function links heat shock response pathway to autosomal recessive intellectual disability.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: "Herein, we suggest that the loss of function variants exclusively targeting the long EEF1D isoform may explicate the ARID phenotype through the heat shock response pathway, rather than interfering with the canonical translational elongation."
      explanation: >-
        The authors' proposal, from the location of the human variants; it was not tested
        experimentally in patient material.
- name: Impaired eEF1B Guanine Nucleotide Exchange for eEF1A
  description: >-
    The short eEF1Bdelta isoforms are part of the eEF1B complex that exchanges GDP for
    GTP on eEF1A, releasing it from the ribosome so elongation can continue. Variants in
    the C-terminal exchange domain, shared by every isoform, are proposed to impair this
    step and so protein synthesis.
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: guanyl-nucleotide exchange factor activity
    term:
      id: GO:0005085
      label: guanyl-nucleotide exchange factor activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: translational elongation
    term:
      id: GO:0006414
      label: translational elongation
    modifier: DECREASED
  evidence:
  - reference: PMID:36576126
    reference_title: "Expanding the spectrum of EEF1D neurodevelopmental disorders: Biallelic variants in the guanine exchange domain."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "The eukaryotic translation elongation factor 1A (eEF1A) delivers aminoacyl-tRNA to the ribosome, while the eEF1B complex acts as a guanine exchange factor (GEF) of GTP for GDP indirectly catalyzing the release of eEF1A from the ribosome."
    explanation: Background statement of the normal eEF1B function that exchange-domain variants would disrupt.
  - reference: PMID:30370994
    reference_title: The role of translation elongation factor eEF1 subunits in neurodevelopmental disorders.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "However, mutations in the genes encoding these subunits EEF1B2 (eEF1Bα), EEF1D (eEF1Bδ), and VARS (valyl-tRNA synthetase) have also now been identified as causes of neurodevelopmental disorders."
    explanation: Review placing EEF1D among eEF1 complex genes whose disruption causes neurodevelopmental disorders.
  - reference: PMID:25436608
    reference_title: Characterisation of translation elongation factor eEF1B subunit expression in mammalian cells and tissues and co-localisation with eEF1A2.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "We show that ablation of any of the subunits in human cell lines has a small but significant impact on cell viability and cycling."
    explanation: >-
      Removing eEF1B subunits, eEF1Bdelta among them, impairs human cells in culture. The
      cells are not neurons, so this supports a cost of losing the exchange function only
      by inference.
  downstream:
  - target: Abnormal Brain Development
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - eef1b_translation_elongation_defect
    evidence:
    - reference: PMID:36576126
      reference_title: "Expanding the spectrum of EEF1D neurodevelopmental disorders: Biallelic variants in the guanine exchange domain."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: "Pathogenic variants localized in both the alternatively spliced domain or the GEF domain of EEF1D cause a severe neurodevelopmental disorder with microcephaly and spasticity."
      explanation: >-
        Exchange-domain variants cause the same severe disorder, so loss of the shared
        translation-factor function is a candidate route to the brain phenotype.
- name: Abnormal Brain Development
  description: >-
    Impaired growth and development of the brain, seen in patients as microcephaly and a
    thin or absent corpus callosum. It is the endpoint both hypotheses share. The cellular
    steps linking either EEF1D function to this outcome have not been defined.
  biological_scale: TISSUE
  cell_types:

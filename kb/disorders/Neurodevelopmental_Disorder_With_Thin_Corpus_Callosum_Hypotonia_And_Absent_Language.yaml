animal_models:
- name: Eef1d long-isoform knockout mouse
  species: Mouse
  genotype: Eef1d long-isoform-specific exon deletion, homozygous (eEF1BdeltaL KO), C57BL/6J
  publication: PMID:30333725
  modeled_mechanisms:
  - target: Loss of eEF1BdeltaL Heat-Shock Transcriptional Activity
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Deleting the exon specific to the long isoform removes eEF1BdeltaL from brain while
      leaving the short translation-factor isoform in place, which matches the
      long-isoform-only human variants.
    limitations: >-
      Does not model the exchange-domain variants that affect every isoform, and the short
      isoform rose in a compensatory way.
    evidence:
    - reference: PMID:30333725
      reference_title: Deletion of Long Isoform of Eukaryotic Elongation Factor 1Bδ Leads to Audiogenic Seizures and Aversive Stimulus-Induced Long-Lasting Activity Suppression in Mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "These KO mice lacked eEF1BδL, but not eEF1Bδ1, in the brain."
      explanation: Confirms isoform-selective loss in the model.
  - target: Neuronal Stress Vulnerability
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      Knockout mice have audiogenic seizures and, after an aversive conditioning stimulus,
      reduced brain weight, hippocampal and midbrain atrophy and thinner cortex.
    limitations: >-
      Learning and anxiety behaviour were normal at baseline, and the brain atrophy appeared
      only in stimulus-exposed mice, unlike the constitutive microcephaly and severe
      intellectual disability of patients; corpus callosum was not reported.
    evidence:
    - reference: PMID:30333725
      reference_title: Deletion of Long Isoform of Eukaryotic Elongation Factor 1Bδ Leads to Audiogenic Seizures and Aversive Stimulus-Induced Long-Lasting Activity Suppression in Mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "Although the KO mice showed normal anxiety-related and learning behavior in behavioral tests, some showed severe seizures in response to loud sounds (90 dBA), an audiogenic seizures (AGS) response."
      explanation: Seizure susceptibility reproduced, cognitive impairment not.
    - reference: PMID:30333725
      reference_title: Deletion of Long Isoform of Eukaryotic Elongation Factor 1Bδ Leads to Audiogenic Seizures and Aversive Stimulus-Induced Long-Lasting Activity Suppression in Mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "After the fear conditioning test, a significant decrease in brain weight, atrophy of the hippocampus and midbrain, and reduced cortical layer thickness were observed in the KO mice."
      explanation: Stimulus-dependent brain atrophy.
discussions:
- discussion_id: eef1d_function_lost
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does the disorder result from loss of the long-isoform heat-shock transcription
    factor, from defective eEF1B-mediated translation elongation, or from both?
  rationale: >-
    The first variants truncate only the long isoform, but exchange-domain variants that
    hit every isoform give the same severe phenotype. Neither function has been measured in
    patient cells, and the long-isoform knockout mouse reproduces seizures but not the
    microcephaly or intellectual disability.
  attaches_to:
  - mechanistic_hypotheses#eef1bdeltal_heat_shock_response_loss
  - mechanistic_hypotheses#eef1b_translation_elongation_defect

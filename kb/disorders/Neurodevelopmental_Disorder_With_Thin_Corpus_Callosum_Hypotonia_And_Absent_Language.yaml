genetic:
- name: EEF1D
  gene_term:
    preferred_term: EEF1D
    term:
      id: hgnc:3211
      label: EEF1D
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Eukaryotic translation elongation factor 1 delta. Reported pathogenic variants are
    nonsense, frameshift, splice-site and missense changes, most homozygous; some truncate
    only the long isoform, others lie in the shared C-terminal exchange domain. No ClinGen
    gene-disease validity assertion was found for this pair, so no validity tier is
    recorded.
  evidence:
  - reference: PMID:38083972
    reference_title: Autosomal recessive intellectual disability caused by compound heterozygous variants of the EEF1D gene in a Chinese family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "To date, all reported pathogenic variations of EEF1D gene have been found in a homozygous state."
    explanation: Summary of the allelic state of the variants reported before this case.
  - reference: PMID:30787422
    reference_title: Biallelic loss of EEF1D function links heat shock response pathway to autosomal recessive intellectual disability.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Eventually, we have identified a novel pathogenic variant in EEF1D, which has recently been recognised as a novel candidate gene for ARID in a single family."
    explanation: Second family establishing EEF1D as a recessive intellectual disability gene.

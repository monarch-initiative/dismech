- accession: geo:GSE300303
  title: Chikungunya virus persists in joint associated macrophages and promotes chronic disease [Xenium]
  data_type: SPATIAL_TRANSCRIPTOMICS
  description: Arthritogenic alphaviruses, including chikungunya virus (CHIKV), Mayaro virus and Ross River virus, cause long-lasting musculoskeletal pain and inflammation. However, the mechanisms driving chronic disease remain unclear. Here, we used single-cell RNA sequencing, spatial transcriptomics and flow cytometry to investigate joint-associated tissues in alphavirus-infected mice at a late stage of infection. We identified an accumulation of inflammatory macrophages in joint-associated tissues with elevated expression of inflammatory markers. These cells harbour CHIKV RNA, suggesting ongoing viral replication during chronic disease.

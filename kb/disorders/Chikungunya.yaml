discussions:
- discussion_id: hmm_il17a_cardiac_interferon_arm
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does IL-17A restrain the type I interferon response in the human
    chikungunya-infected heart, or is that direction of effect an artefact of
    an interferon-receptor-deficient mouse?
  rationale: >-
    The mismatch here is unusually pointed, because the model system is
    compromised in precisely the axis the hypothesis is about. The directional
    claim rests on a heterozygous interferon alpha, beta and gamma
    receptor-deficient mouse, so the interferon response being measured is
    already operating at reduced receptor dosage; whether the same restraint
    would be visible, or would matter, in a fully interferon-competent host is
    not established. The human arm of the same source is primary cardiac
    fibroblast culture, which supplies the correct species and cell type but
    no immune compartment, no vasculature and no chronic timescale. On the
    peer-reviewed side there is a clean separation of what is known: elevated
    IL-17 in patient sera, and IL-17A dependence of joint and muscle
    inflammation in mice, neither of which speaks to interferon or to the
    heart. Note also that the source is a preprint and has not been peer
    reviewed, so the usual caution about a single unreviewed result applies on
    top of the model question.
  attaches_to:
  - pathophysiology#Restrained Cardiac Type I Interferon Response
  - pathophysiology#IL-17RA Signalling in Cardiac Tissue
  proposed_experiments:
  - experiment_id: exp_chikv_il17a_interferon_competent_host
    name: IL-17A blockade in an interferon-competent chikungunya cardiac model
    description: >-
      Repeat the IL-17RA blockade and Il17a deletion experiments in an
      immunocompetent mouse cardiac infection model of the kind used to
      establish MAVS dependence, measuring cardiac interferon output and viral
      burden. If the interferon restraint is real rather than a consequence of
      reduced receptor dosage, it should be recoverable in a host with an
      intact receptor complement.
  - experiment_id: exp_chikv_human_cardiac_il17_tissue
    name: IL-17 and interferon signatures in human chikungunya cardiac tissue
    description: >-
      Measure IL-17A and type I interferon signatures in myocardial tissue or
      pericardial fluid from patients with chikungunya-associated cardiac
      disease, with arboviral and non-arboviral myocarditis comparators. The
      human evidence at present is serum cytokine measurement in a
      musculoskeletal disease cohort, which cannot localise either signal to
      the heart.
  evidence:
  - reference: PPR:PPR1294570
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Using a novel heterozygous interferon receptor-deficient mouse model
    explanation: >-
      The authors' own statement of the animal system used, which is what
      makes the mismatch explicit: the interferon claim is made in a host with
      an engineered interferon receptor deficiency.
  - reference: PPR:PPR1294570
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: blockade of IL-17RA with an FDA-approved monoclonal antibody for plaque
      psoriasis, Brodalumab, drastically increased type I interferon production and
      reduced viral replication in both human cardiac fibroblasts and human embryonic
      kidney 293 (HEK 293) cells
    explanation: >-
      PARTIAL, and split out from the mouse item because it is the human arm
      of the same study and a different evidence type: primary human cardiac
      fibroblast and HEK 293 culture supplies the right species and cell type
      but no immune compartment, vasculature or chronic timescale.
- discussion_id: gap_il17ra_blockade_untested_in_human_chikungunya
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is IL-17RA blockade a viable therapeutic strategy in chikungunya, and what
    would have to be shown before it could be curated as a treatment?
  rationale: >-
    Brodalumab is an approved IL-17RA antagonist for plaque psoriasis, and the
    preprint reports that it raises interferon production and lowers viral
    replication in human cardiac fibroblasts and in HEK 293 cells, including
    when given after infection. That is a mechanistically coherent
    repurposing proposal and nothing more: there is no clinical study in
    chikungunya, no human safety or dosing data in acute arboviral infection,
    and the intervention is immunosuppressive in a setting where IL-17 also
    contributes to control of infection. This entry therefore deliberately
    carries no treatment record for IL-17RA blockade and records the proposal
    here instead, so that a future curator can see that the omission was a
    decision rather than an oversight. The bar for promoting it to a
    treatment with a target_mechanisms edge is a clinical study in infected
    patients, not a stronger preclinical result.
  attaches_to:
  - pathophysiology#IL-17RA Signalling in Cardiac Tissue
  proposed_experiments:
  - experiment_id: exp_chikv_il17ra_blockade_clinical
    name: Controlled trial of IL-17RA blockade in acute chikungunya with cardiac
      involvement
    description: >-
      A randomised controlled study of IL-17RA blockade in acute chikungunya,
      powered on cardiac endpoints such as troponin, echocardiographic
      function and arrhythmia, with viral load as a mechanistic readout and
      explicit monitoring for the infectious complications that IL-17
      blockade is known to carry.
  evidence:
  - reference: PPR:PPR1294570
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: blockade of IL-17RA with an FDA-approved monoclonal antibody for plaque
      psoriasis, Brodalumab, drastically increased type I interferon production and
      reduced viral replication in both human cardiac fibroblasts and human embryonic
      kidney 293 (HEK 293) cells
    explanation: >-
      The whole of the pharmacological evidence, and it is cell culture in
      human cardiac fibroblasts and a kidney cell line rather than any
      clinical observation.
  - reference: PMID:28503297
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: Cardiac compromise is not so common in isolated episodes
    explanation: >-
      PARTIAL, and included because it bears on feasibility rather than on
      mechanism: the target population for a cardiac endpoint trial is a
      minority of infected patients, which is part of why no such study
      exists.

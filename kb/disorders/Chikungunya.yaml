  locations:
  - preferred_term: heart
    term:
      id: UBERON:0000948
      label: heart
  biological_processes:
  - preferred_term: interleukin-17-mediated signaling pathway
    modifier: INCREASED
    term:
      id: GO:0097400
      label: interleukin-17-mediated signaling pathway
  evidence:
  - reference: PPR:PPR1294570
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Genetic deletion of IL-17A signaling significantly enhanced type I interferon
      responses and decreased viral burden in mouse hearts
    explanation: >-
      Loss of signalling through this axis changes both interferon output and
      viral burden in cardiac tissue, which is what makes it a node rather
      than a bystander observation.
  - reference: PPR:PPR1294570
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: blockade of IL-17RA with an FDA-approved monoclonal antibody for plaque
      psoriasis, Brodalumab, drastically increased type I interferon production and
      reduced viral replication in both human cardiac fibroblasts and human embryonic
      kidney 293 (HEK 293) cells
    explanation: >-
      Pharmacological confirmation in human cardiac fibroblasts that the
      receptor, specifically, carries the effect.
  downstream:
  - target: Restrained Cardiac Type I Interferon Response
    causal_link_type: DIRECT
    hypothesis_groups:
    - il17a_interferon_restraint
    description: >-
      The edge that carries the emerging claim: IL-17RA signalling suppresses
      the local interferon response rather than merely accompanying it.
    evidence:
    - reference: PPR:PPR1294570
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Genetic deletion of IL-17A signaling significantly enhanced type I
        interferon responses and decreased viral burden in mouse hearts
      explanation: >-
        A loss-of-function result in the direction the hypothesis predicts,
        and the strongest single statement of the causal claim.
- name: Restrained Cardiac Type I Interferon Response
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  description: >-
    Clearance of chikungunya virus from the heart depends on a local type I
    interferon response raised by both infected and uninfected cardiac cells.
    Anything that blunts that response therefore converts a self-limiting
    cardiac infection into a persistent one. Two routes to a blunted response
    reach this node and they differ sharply in standing: loss of
    MAVS-dependent innate sensing is a peer-reviewed genetic result and has
    its own upstream node, whereas restraint by IL-17RA signalling is the
    emerging claim and is marked as such on its incoming edge. The node is
    PROVISIONAL because interferon insufficiency has not been measured in the
    hearts of infected humans.
  biological_processes:
  - preferred_term: type I interferon production
    modifier: DECREASED
    term:
      id: GO:0032606
      label: type I interferon production
  evidence:
  - reference: PMID:37537212
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: In immunocompetent mice, CHIKV is cleared from cardiac tissue without
      significant damage through the induction of a local type I interferon response
      from both infected and non-infected cardiac cells
    explanation: >-
      Establishes that the local interferon response is what normally
      prevents cardiac damage, which is what makes its restraint pathogenic.
  - reference: PPR:PPR1294570
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Genetic deletion of IL-17A signaling significantly enhanced type I interferon
      responses and decreased viral burden in mouse hearts
    explanation: >-
      Read in reverse, intact IL-17A signalling holds the interferon response
      below the level the deletion reveals.
  downstream:
  - target: Persistent Cardiac Viral Infection
    causal_link_type: DIRECT
    description: >-
      An interferon response insufficient to clear the virus leaves
      replicating virus in cardiac tissue.
    evidence:
    - reference: PMID:37537212
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: In the absence of MAVS signaling, persistent infection leads to focal
        myocarditis and vasculitis of the large vessels attached to the base of the
        heart
      explanation: >-
        Directly links failed innate antiviral signalling to persistence in
        the heart.
- name: Persistent Cardiac Viral Infection
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  description: >-
    Virus that is not cleared continues to replicate in the myocardium and in
    the vascular tissue at the base of the heart. In the mouse this
    persistence is prolonged, with large vessel vasculitis still present two
    months after infection. Whether human cardiac involvement reflects
    persistence or a single acute insult has not been established, hence
    PROVISIONAL.
  locations:
  - preferred_term: heart
    term:
      id: UBERON:0000948
      label: heart
  biological_processes:
  - preferred_term: viral genome replication
    modifier: INCREASED
    term:
      id: GO:0019079
      label: viral genome replication
  evidence:
  - reference: PMID:37537212
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Large vessel vasculitis was observed for up to 60 days post infection,
      suggesting CHIKV can lead to vascular inflammation and potential long-lasting
      cardiovascular complications
    explanation: >-
      Quantifies how long the consequences of failed clearance persist in the
      model, and is the authors' own hedged extrapolation to humans.
  downstream:
  - target: Cardiac Inflammation and Myocardial Injury
    causal_link_type: DIRECT
    description: >-
      Persistent replication in cardiac tissue recruits the infiltrate that
      produces the myocardial lesion.
- name: Cardiac Inflammation and Myocardial Injury
  biological_scale: TISSUE
  description: >-
    Inflammatory cell infiltration of cardiac tissue with focal myocarditis
    and vasculitis of the great vessels at the base of the heart. Blocking
    IL-17A signalling reduces the pro-inflammatory mediators, the infiltrate
    and the injury together, which is the observation that makes this node
    the endpoint of the IL-17A arm rather than an independent process.
  locations:
  - preferred_term: heart
    term:
      id: UBERON:0000948
      label: heart
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  evidence:
  - reference: PMID:37537212
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: In the absence of MAVS signaling, persistent infection leads to focal
      myocarditis and vasculitis of the large vessels attached to the base of the
      heart
    explanation: >-
      Names the two lesions that constitute this node in the model system.
  - reference: PPR:PPR1294570
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: reduced immune cell infiltration into cardiac tissue, and mitigated cardiac
      injury
    explanation: >-
      Interrupting IL-17A signalling removes the infiltrate and the injury,
      placing this node downstream of the IL-17A arm.
  - reference: PMID:28503297
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: 'Cardiovascular manifestations can be considered common and have been
      reported in France, India, Sri Lanka, Malaysia, Colombia, Venezuela and USA'
    explanation: >-
      PARTIAL because the systematic review establishes that cardiac
      involvement occurs in infected patients but reports no mechanism, and
      its own methods section notes that isolated cardiac compromise is not
      common.
  downstream:
  - target: Myocarditis
    causal_link_type: DIRECT
    description: >-
      The tissue lesion presenting clinically. Myocarditis is the phenotype
      the myocardial inflammation and injury node produces, and is named as
      such both in the mouse histology and in the patient literature.
    evidence:
    - reference: PMID:28503297
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'Cardiovascular manifestations can be considered common and have been
        reported in France, India, Sri Lanka, Malaysia, Colombia, Venezuela and USA,
        including mainly, but no limited to: hypotension, shock and circulatory collapse,
        Raynaud phenomenon, arrhythmias, murmurs, myocarditis, dilated cardiomyopathy,
        congestive insufficiency, heart failure and altered function profile (Troponins,
        CPK).'
      explanation: >-
        Names myocarditis among the cardiovascular manifestations observed in
        infected patients, which is the clinical expression of this node.
- name: Joint and Muscle Inflammation with Neutrophil Infiltration
  biological_scale: TISSUE
  description: >-
    Inflammatory infiltration of joint and muscle tissue, with neutrophils
    prominent, underlying the arthralgia and myalgia of acute chikungunya and
    persisting into the postacute phase. IL-17A is required for it in the
    mouse and is elevated in patients, most strongly during chronic disease;
    that dependence is recorded as evidence on this node rather than as an
    edge from the cardiac IL-17A nodes, because the peer-reviewed result is
    about joint and muscle tissue and the cardiac nodes are explicitly
    localised to the heart.
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  - preferred_term: neutrophil chemotaxis
    modifier: INCREASED
    term:
      id: GO:0030593
      label: neutrophil chemotaxis
  evidence:
  - reference: PMID:35254128
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: CHIKV-infected mice lacking IL-17A showed reduced tissue inflammation
      and neutrophil infiltration, compared to wild-type mice
    explanation: >-
      The genetic result defining both the composition of the infiltrate and
      its dependence on IL-17A.
  - reference: PMID:35254128
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: These investigations showed a role for IL-17 in the acute phase of CHIKV
      infection and also during the postacute disease resolution phase
    explanation: >-
      Extends the requirement beyond the acute phase, which matters because
      the human cytokine signal is strongest in chronic disease.
  downstream:
  - target: Arthralgia
    causal_link_type: DIRECT
    description: >-
      Persistent inflammation of the joint is what patients experience as the
      arthralgia that defines chikungunya and that outlasts the acute
      illness.
    evidence:
    - reference: PMID:35254128
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Up to 40% of patients experience persistent joint inflammation and
        arthralgia, which can persist for months or years after infection
      explanation: >-
        States joint inflammation and arthralgia together in patients, which
        is what links this tissue node to the phenotype.

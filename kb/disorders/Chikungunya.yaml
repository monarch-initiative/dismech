mechanistic_hypotheses:
- hypothesis_group_id: il17a_interferon_restraint
  hypothesis_label: IL-17A signalling restrains the cardiac type I interferon response
  status: EMERGING
  description: >-
    Under this model the IL-17A that chikungunya virus infection induces in
    the heart is not merely a marker of inflammation but an active brake on
    the antiviral response: IL-17A acting through IL-17RA suppresses local
    type I interferon production, so viral clearance from cardiac tissue is
    slowed and the resulting viral burden drives myocardial inflammation and
    injury. The prediction that distinguishes it from a bystander account is
    directional and testable, and has been tested only in a preprint so far:
    removing IL-17A signalling should raise interferon output and lower viral
    burden rather than simply lowering inflammation. Genetic deletion of
    Il17a or Il17ra and antibody blockade of IL-17RA both do exactly that in
    mouse hearts and in primary human cardiac fibroblasts. The status is
    EMERGING rather than CANONICAL because the only source making the
    interferon claim is not peer reviewed, and because the peer-reviewed
    human data show elevated circulating IL-17 in patients without
    establishing its direction of effect on interferon or on the heart.
  evidence:
  - reference: PPR:PPR1294570
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: we demonstrate that IL-17A signaling facilitates CHIKV replication via
      suppressing antiviral type I interferon responses
    explanation: >-
      States the hypothesis in the direction that defines this group, that
      IL-17A acts upstream of the interferon response rather than downstream
      of the damage.
  - reference: PMID:35254128
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: Sera from CHIKV-infected patients who displayed both acute and chronic
      disease showed high levels of IL-17, IL-6, IL-21, IL-22, and IL-23, especially
      during the chronic phase of disease
    explanation: >-
      PARTIAL because it establishes that IL-17 is elevated in infected
      patients, which is the observation the hypothesis starts from, but says
      nothing about interferon or about the heart.
pathophysiology:
- name: CHIKV Replication in Fibroblast-Lineage Target Cells
  biological_scale: CELLULAR
  description: >-
    Chikungunya virus establishes productive replication preferentially in
    fibroblasts of muscle, joint and skin, a tropism recovered from human
    biopsy material as well as from the mouse model. This node is the shared
    root of the entry: the musculoskeletal syndrome and the cardiac arm both
    begin from infection of the same cell lineage in different tissues.
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  biological_processes:
  - preferred_term: viral genome replication
    modifier: INCREASED
    term:
      id: GO:0019079
      label: viral genome replication
  evidence:
  - reference: PMID:18282093
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: CHIKV primarily targets muscle, joint, and skin fibroblasts, a cell
      and tissue tropism similar to that observed in biopsy samples of CHIKV-infected
      humans
    explanation: >-
      Identifies the fibroblast as the predominant target cell and states
      that the mouse tropism matches human biopsy material, which is what
      licenses using this node as the root for both arms.
  downstream:
  - target: Cardiac Fibroblast Infection
    causal_link_type: DIRECT
    description: >-
      The same fibroblast tropism extends to the resident fibroblast
      population of the myocardium.
  - target: Joint and Muscle Inflammation with Neutrophil Infiltration
    causal_link_type: DIRECT
    description: >-
      Infection of joint and muscle fibroblasts is the substrate for the
      arthralgia and myalgia that define acute chikungunya.
- name: Cardiac Fibroblast Infection
  biological_scale: CELLULAR
  description: >-
    Chikungunya virus directly infects and actively replicates in cardiac
    fibroblasts. This is shown in an immunocompetent mouse model and in
    primary human cardiac cells, so the cardiac arm rests on a demonstrated
    cell target rather than on the clinical association alone.
  cell_types:
  - preferred_term: cardiac fibroblast
    term:
      id: CL:0002548
      label: fibroblast of cardiac tissue
  locations:
  - preferred_term: heart
    term:
      id: UBERON:0000948
      label: heart
  biological_processes:
  - preferred_term: viral genome replication
    modifier: INCREASED
    term:
      id: GO:0019079
      label: viral genome replication
  evidence:
  - reference: PMID:37537212
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: we demonstrate that CHIKV directly infects and actively replicates in
      cardiac fibroblasts
    explanation: >-
      Establishes the cardiac fibroblast as a genuine replication site, using
      both an immunocompetent mouse model and human primary cardiac cells.
  downstream:
  - target: IL-17A Production in Infected Heart Tissue
    causal_link_type: DIRECT
    description: >-
      Cardiac infection is itself the stimulus for local IL-17A production.
    evidence:
    - reference: PPR:PPR1294570
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: We found that CHIKV infection induced IL-17A production in the heart
      explanation: >-
        Places IL-17A downstream of cardiac infection rather than as a
        pre-existing host state.
- name: MAVS-Dependent Innate Sensing Failure
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    Loss of signalling through the mitochondrial antiviral-signaling protein
    MAVS, the adaptor for cytoplasmic viral RNA sensing. In the model system
    this state is produced genetically rather than by the virus, which is why
    it is curated as an upstream host lesion with no incoming edge from
    infection: the reviewer-suggested route from cardiac infection to sensing
    failure is not something the source shows. What the source does show is
    the consequence — mice deficient in MAVS signalling fail to clear
    chikungunya virus from the heart — so the outgoing edge, not an incoming
    one, is where the evidence sits. PROVISIONAL because no comparable
    sensing lesion has been demonstrated in patients with chikungunya cardiac
    disease.
  locations:
  - preferred_term: heart
    term:
      id: UBERON:0000948
      label: heart
  biological_processes:
  - preferred_term: cytoplasmic pattern recognition receptor signaling pathway
    modifier: DECREASED
    term:
      id: GO:0002753
      label: cytoplasmic pattern recognition receptor signaling pathway
  evidence:
  - reference: PMID:37537212
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Using mice deficient in major innate immunity signaling components,
      we found that signaling through the mitochondrial antiviral-signaling protein
      (MAVS) is required for viral clearance from the heart
    explanation: >-
      Establishes MAVS-dependent sensing as the innate signalling step whose
      loss prevents cardiac viral clearance, and states that the deficiency
      is a property of the mouse rather than an effect of the infection.
  downstream:
  - target: Restrained Cardiac Type I Interferon Response
    causal_link_type: DIRECT
    description: >-
      The peer-reviewed route to a cardiac interferon response too weak to
      clear the virus, and the counterpart of the emerging IL-17A route into
      the same node.
    evidence:
    - reference: PMID:37537212
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: In the absence of MAVS signaling, persistent infection leads to focal
        myocarditis and vasculitis of the large vessels attached to the base of the
        heart
      explanation: >-
        The loss-of-function result: without MAVS signalling the interferon
        response no longer clears the virus and cardiac disease follows.
- name: IL-17A Production in Infected Heart Tissue
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    IL-17A is produced locally in chikungunya-infected cardiac tissue.
    PROVISIONAL because the cardiac localisation rests solely on a preprint:
    the peer-reviewed human data measure IL-17 in patient sera and the
    peer-reviewed mouse data measure it in joint and muscle, so neither
    places the cytokine in the heart.
  locations:
  - preferred_term: heart
    term:
      id: UBERON:0000948
      label: heart
  biological_processes:
  - preferred_term: interleukin-17 production
    modifier: INCREASED
    term:
      id: GO:0032620
      label: interleukin-17 production
  evidence:
  - reference: PPR:PPR1294570
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: We found that CHIKV infection induced IL-17A production in the heart
    explanation: >-
      The only source that localises IL-17A production to cardiac tissue, and
      the reason this node is marked PROVISIONAL.
  - reference: PMID:35254128
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: Sera from CHIKV-infected patients who displayed both acute and chronic
      disease showed high levels of IL-17, IL-6, IL-21, IL-22, and IL-23, especially
      during the chronic phase of disease
    explanation: >-
      PARTIAL because it establishes that IL-17 rises in infected patients,
      which is the observation this node starts from, but measures serum and
      so cannot place the cytokine in the heart.
  downstream:
  - target: IL-17RA Signalling in Cardiac Tissue
    causal_link_type: DIRECT
    description: >-
      Locally produced IL-17A acts on cardiac cells through its receptor
      IL-17RA, which is the step receptor blockade interrupts.
    evidence:
    - reference: PPR:PPR1294570
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: blockade of IL-17RA with an FDA-approved monoclonal antibody for plaque
        psoriasis, Brodalumab, drastically increased type I interferon production
        and reduced viral replication in both human cardiac fibroblasts and human
        embryonic kidney 293 (HEK 293) cells
      explanation: >-
        Blocking the receptor reverses the effect of the ligand, which is what
        types this as a ligand-to-receptor-signalling edge rather than an
        assumed one.
- name: IL-17RA Signalling in Cardiac Tissue
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    IL-17A signalling through IL-17RA in cardiac tissue. Removing the
    receptor or blocking it pharmacologically raises the local interferon
    response and lowers viral burden, so this is the step the emerging
    hypothesis places upstream of the interferon response rather than
    downstream of the damage. PROVISIONAL because every result placing

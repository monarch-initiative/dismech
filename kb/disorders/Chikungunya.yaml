- accession: massive:MSV000096887
  title: Chikungunya replication and infection is dependent upon and alters cellular hexosylceramide levels in Vero cells
  organism:
    preferred_term: African green monkey
    term:
      id: NCBITaxon:60711
      label: Chlorocebus sabaeus
  data_type: METABOLOMICS
  description: Chikungunya virus (CHIKV), a mosquito-borne alphavirus, causes significant global mor-bidity, including fever, rash, and persistent arthralgia. Utilizing untargeted lipidomics, we investi-gated how CHIKV infection alters host cell lipid metabolism in Vero cells. CHIKV infection induced marked catabolism of hexosylceramides, reducing their levels while increasing ceramide byprod-ucts. Functional studies revealed a reliance on fatty acid synthesis, ?-oxidation, and glycosphin-golipid biosynthesis.
  notes: Located via OmicsDI, which aggregates across omics repositories; this record comes from massive. Only repositories with no other discovery route in this project and with a working accession resolver are curated from OmicsDI -- GEO, ArrayExpress, PRIDE, MetaboLights and EGA hits are excluded as duplicates of dedicated passes. Matched because the disease is named in the dataset's own title ("Chikungunya"). Retrieved 2026-08-02.

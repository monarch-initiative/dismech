name: Developmental and Epileptic Encephalopathy 116
creation_date: "2026-08-27T00:00:00Z"
category: Mendelian
description: >-
  Developmental and epileptic encephalopathy 116 is caused by heterozygous de
  novo variants in GLUL, which encodes glutamine synthetase. It is the
  dominant, gain-of-function counterpart of a disease that had been known for
  twenty years in its recessive, loss-of-function form, and the two are
  mechanistically opposite. Biallelic loss of glutamine synthetase causes
  congenital glutamine deficiency, with brain malformation, multiorgan failure
  and death in infancy. This entity instead makes the enzyme too stable.

  The lesion is in the regulation of protein turnover, not in the enzyme's
  chemistry. Glutamine synthetase carries an N-terminal degron that triggers
  its own ubiquitin-mediated degradation when glutamine is abundant, so the
  enzyme destroys itself in proportion to how much product it has made. The
  disease variants remove the start codon, either by changing it directly or by
  disrupting splicing of the 5' untranslated region so that the initiation
  codon is skipped. Translation then restarts at an in-frame methionine
  seventeen residues downstream, past the degron. The resulting protein is
  shorter, fully enzymatically competent, and deaf to its own feedback signal.
  The authors of the founding study named the mechanism gain of stabilization.

  What follows clinically is a severe early-onset epileptic encephalopathy:
  seizures usually starting in the first months of life and often refractory,
  global developmental delay with little or no milestone progress, and a
  characteristic imaging picture. Markedly enlarged perivascular spaces are the
  most distinctive radiological feature and have been proposed as a diagnostic
  clue; thinning of the corpus callosum, white matter signal abnormality with
  hypomyelination, cerebral atrophy and deep grey matter T2 hyperintensity are
  variably present. Unlike the recessive disease, patients survive: the nine
  individuals in the founding cohort were all alive between 16 months and 16
  years of age.

  A third feature is odd enough to be worth flagging: every one of the nine
  patients in the founding cohort was female. The first male was reported the
  following year with the same phenotype, so males are affected, but with ten
  patients described in total the imbalance is unexplained.

  Two further things about this entity are unresolved and are curated here as
  open questions rather than as mechanism. First, the biochemistry does not do what
  the mechanism predicts. A stabilized, feedback-insensitive glutamine
  synthetase should raise glutamine and lower ammonia; instead plasma and
  cerebrospinal fluid glutamine are usually normal and sometimes low, and some
  patients are hyperammonaemic, so the metabolic consequence of the stabilized
  enzyme in the brain is not captured by the peripheral measurements available.
  Second, the mutational spectrum is widening beyond the start codon: a
  heterozygous missense variant in the catalytic domain and an in-frame
  duplication have both been reported in patients with the same phenotype, the
  latter with a demonstrated regulatory rather than a stability defect, so
  removal of the degron may be one route to the disease rather than the
  definition of it.

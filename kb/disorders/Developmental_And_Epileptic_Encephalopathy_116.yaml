        dominant GLUL disease.

- name: Developmental and Epileptic Encephalopathy
  biological_scale: ORGANISM
  role: consequence
  mechanism_confidence: ESTABLISHED
  description: >-
    The clinical endpoint. Seizures typically begin in the first months of
    life, are often refractory to multiple antiseizure medications, and take
    varied forms across patients: generalized tonic-clonic, myoclonic, tonic,
    clonic, focal, and infantile spasms have all been reported. Global
    developmental delay is universal and severe, with several patients
    achieving head control and little beyond it. Unlike the recessive GLUL
    disease, which kills in infancy, this one is survivable.
  evidence:
  - reference: PMID:39985170
    reference_title: "Male proband with intractable seizures and a de novo start-codon-disrupting variant in GLUL."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Distinct from the recessive form of disease, the dominant form is
      associated with intractable seizures, global developmental delay, and
      hypotonia.
    explanation: >-
      Summarises the clinical endpoint and contrasts it with the recessive
      disease.
  - reference: PMID:39985170
    reference_title: "Male proband with intractable seizures and a de novo start-codon-disrupting variant in GLUL."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Moreover, all nine individuals are alive at current ages of 16 months to
      16 years.
    explanation: >-
      Establishes survival into childhood and adolescence, the sharpest
      clinical difference from congenital glutamine deficiency.

- name: White Matter and Perivascular Space Abnormality
  biological_scale: TISSUE
  role: consequence
  mechanism_confidence: PROVISIONAL
  description: >-
    A structural imaging phenotype consistent enough to be proposed as a
    diagnostic clue. Markedly enlarged perivascular spaces are the most
    distinctive finding and were present in most reported patients with the
    dominant disease; thinning of the corpus callosum accompanies them.
    Hypomyelination or demyelination was described in seven of ten earlier
    patients but absent in a later series of three, while that later series
    found cerebral atrophy in all three and deep grey matter T2 hyperintensity
    in two. The mechanism connecting glutamine synthetase dysregulation to
    these changes is not known, and the reporting authors say so.
  evidence:
  - reference: PMID:42311234
    reference_title: "A Novel Gain-of-Function GLUL Variant Is Associated With Developmental and Epileptic Encephalopathy With Enlarged Perivascular Spaces."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Her brain MRI demonstrated involvement of the white matter
      signal-intensity alterations and markedly enlarged perivascular spaces.
    explanation: >-
      Documents both components of this node in a patient with a confirmed de
      novo GLUL variant.
  - reference: PMID:41083803
    reference_title: "Expanding the clinical and genetic spectrum of GLUL-related developmental and epileptic encephalopathy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings are frequently associated with systemic metabolic
      abnormality and mitochondrial diseases
    explanation: >-
      The only mechanistic framing the literature offers for these imaging
      findings is an analogy to other metabolic disorders, which is why this
      node is PROVISIONAL.
  - reference: PMID:39985170
    reference_title: "Male proband with intractable seizures and a de novo start-codon-disrupting variant in GLUL."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      His brain magnetic resonance imaging (MRI) at ages 1 and 3 years was
      normal.
    explanation: >-
      A genetically confirmed patient with entirely normal imaging at two time
      points in early childhood. Structural change is therefore not obligatory,
      and a normal MRI does not argue against the diagnosis.

phenotypes:
- category: Neurological
  name: Seizures
  description: >-
    Seizures are the presenting feature in most patients. Onset spans the first
    two years of life, most often within the first months, though the one adult
    reported so far began at 24 months. They are frequently refractory:
    multiple antiseizure medications and a ketogenic diet were tried without
    lasting control in several reported patients. The semiology is not uniform.
    Generalized tonic-clonic, myoclonic, tonic, clonic, focal, atonic and
    spasm-like seizures have all been reported, and the mix differs between
    patients; in the adult proband the combination of seizure types and the
    electroencephalographic findings amounted to a clinical diagnosis of
    Lennox-Gastaut syndrome.
  phenotype_term:
    preferred_term: Seizure
    term:

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      GS is pivotal for the generation of the neurotransmitters glutamate and
      gamma-aminobutyric acid and is the primary mechanism of ammonia
      detoxification in the brain.
    explanation: >-
      Establishes the three brain functions that depend on this enzyme and are
      therefore exposed by its dysregulation.
  - reference: PMID:38579670
    reference_title: "Clustered de novo start-loss variants in GLUL result in a developmental and epileptic encephalopathy via stabilization of glutamine synthetase."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings underline the importance of tight regulation of glutamine
      metabolism during neurodevelopment in humans.
    explanation: >-
      The founding study's own conclusion, framed at the level of regulation
      during development rather than of enzyme quantity.
  downstream:
  - target: Developmental and Epileptic Encephalopathy
    causal_link_type: DIRECT
    description: >-
      Perturbed excitatory and inhibitory neurotransmitter supply during
      development produces the seizure and developmental phenotype.
    evidence:
    - reference: PMID:41083803
      reference_title: "Expanding the clinical and genetic spectrum of GLUL-related developmental and epileptic encephalopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        However, the loss of this critical domain disturbs the regulatory

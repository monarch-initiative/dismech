inheritance:
- name: Autosomal dominant inheritance
  description: >-
    Every reported patient carries a heterozygous variant that arose de novo,
    confirmed by trio sequencing of the proband and both parents. No familial
    transmission has been described, which is consistent with the severity of
    the phenotype. This is the point of contrast with the other GLUL disease:
    congenital glutamine deficiency requires biallelic loss-of-function
    variants and is recessive.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:41083803
    reference_title: "Expanding the clinical and genetic spectrum of GLUL-related developmental and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Biallelic loss-of-function variants cause congenital glutamine
      deficiency, leading to developmental and epileptic encephalopathy (DEE)
      in an autosomal recessive manner. In contrast, certain variants of GLUL
      that lead to the loss of the N-terminal degron exert a gain-of-function
      effect, causing an autosomal dominant DEE.
    explanation: >-
      States both the dominant transmission of this entity and its contrast
      with the recessive GLUL disease.
  - reference: PMID:38579670
    reference_title: "Clustered de novo start-loss variants in GLUL result in a developmental and epileptic encephalopathy via stabilization of glutamine synthetase."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We ascertained nine individuals with severe developmental delay,
      seizures, and white matter abnormalities but normal plasma and
      cerebrospinal fluid biochemistry with de novo variants in GLUL.
    explanation: >-
      Establishes the de novo origin of the variants in the founding cohort.

pathophysiology:
- name: GLUL Start-Loss and 5' UTR Splice Variants
  biological_scale: MOLECULAR
  role: trigger
  mechanism_confidence: ESTABLISHED
  description: >-
    The disease alleles cluster on one target: the initiation codon of GLUL.
    They reach it two ways. Seven of the nine founding patients had variants in
    the start codon itself, and two had variants at the canonical splice site of
    the 5' untranslated region that exclude the initiation codon from the
    mature transcript. Later reports add further alleles at the same splice
    acceptor. All are heterozygous and all arose de novo.

    The spectrum has since begun to widen past the start codon. A de novo
    heterozygous missense variant in the catalytic domain and an in-frame
    duplication have each been reported in a patient with the same phenotype.
    The duplication was shown to disrupt regulation of enzyme activity without
    changing protein expression, which is a different route to the same
    endpoint; the missense variant is not functionally characterised. Both are
    single observations and are curated here as spectrum expansion rather than
    as an established second mechanism.
  genes:
  - preferred_term: GLUL
    term:
      id: hgnc:4341
      label: GLUL
  genetic_context:
    functional_impact_category: GAIN_OF_FUNCTION
    variant_origin: DE_NOVO
    zygosity: HETEROZYGOUS
    description: >-
      Heterozygous de novo variants abolishing use of the canonical GLUL start
      codon, either by altering it directly or by excluding it through a 5'
      untranslated region splice defect.
  evidence:
  - reference: PMID:38579670
    reference_title: "Clustered de novo start-loss variants in GLUL result in a developmental and epileptic encephalopathy via stabilization of glutamine synthetase."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Seven out of nine were start-loss variants and two out of nine disrupted
      5' UTR splicing resulting in splice exclusion of the initiation codon.
    explanation: >-
      Defines the two allele classes that converge on loss of the canonical
      start codon.
  - reference: PMID:42311234
    reference_title: "A Novel Gain-of-Function GLUL Variant Is Associated With Developmental and Epileptic Encephalopathy With Enlarged Perivascular Spaces."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All reported dominant mutations are within the start codon or the 5 '
      UTR. Here, we report a DEE patient with a de novo variant, c.522_536dup,
      in the catalytic domain of GLUL.
    explanation: >-
      Records the first reported dominant allele outside the start codon
      region, which extends the allelic spectrum beyond the founding
      description.
  downstream:
  - target: Translation Reinitiation at Methionine 18
    causal_link_type: DIRECT
    description: >-
      With the canonical initiation codon unavailable, the ribosome starts at
      the next in-frame methionine.
    evidence:
    - reference: PMID:38579670
      reference_title: "Clustered de novo start-loss variants in GLUL result in a developmental and epileptic encephalopathy via stabilization of glutamine synthetase."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Using transfection-based expression systems and mass spectrometry,
        these variants were shown to lead to translation initiation of GS from
        methionine 18, downstream of the N-terminal degron motif
      explanation: >-
        Directly demonstrates, by mass spectrometry, that the variants shift
        the initiation site to methionine 18.

- name: Translation Reinitiation at Methionine 18
  biological_scale: MOLECULAR
  role: intermediate
  mechanism_confidence: ESTABLISHED
  description: >-
    The alternative start codon lies seventeen residues into the protein, in
    frame with the rest of it. Reinitiation there produces a glutamine
    synthetase that is complete except for its N-terminal seventeen amino
    acids. That short missing segment is the entire pathogenic consequence: it
    contains the degron, and nothing else about the protein is altered. This is
    why the variants are not loss-of-function despite abolishing the normal
    start codon.
  biological_processes:
  - preferred_term: translational initiation
    modifier: ABNORMAL
    term:
      id: GO:0006413
      label: translational initiation
  evidence:
  - reference: PMID:39985170
    reference_title: "Male proband with intractable seizures and a de novo start-codon-disrupting variant in GLUL."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In both scenarios, a truncated protein is produced by reinitiation of the
      translation at an alternative start codon 17 amino acids downstream
      (Met18), removing a 5′ degron sequence critical to the regulation of
      glutamine synthetase degradation.
    explanation: >-
      States precisely what reinitiation at methionine 18 removes and why it
      matters.
  downstream:
  - target: Escape from Glutamine-Induced Degradation of Glutamine Synthetase
    causal_link_type: DIRECT
    description: >-
      The truncated protein no longer carries the degron that would target it
      for ubiquitin-mediated degradation when glutamine is high.
    evidence:
    - reference: PMID:38579670
      reference_title: "Clustered de novo start-loss variants in GLUL result in a developmental and epileptic encephalopathy via stabilization of glutamine synthetase."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        resulting in a protein that is stable and enzymatically competent but
        insensitive to negative feedback by glutamine
      explanation: >-
        The direct statement of the consequence: stability retained, catalysis
        retained, feedback lost.

- name: Escape from Glutamine-Induced Degradation of Glutamine Synthetase
  biological_scale: MOLECULAR
  role: central_effector
  mechanism_confidence: ESTABLISHED
  description: >-
    Glutamine synthetase is normally held in check by its own product. When
    glutamine is abundant, lysine residues in the N-terminal region are
    acetylated, which triggers ubiquitin-mediated degradation of the enzyme.
    That degron is a negative feedback loop implemented as protein turnover
    rather than as allosteric inhibition, and it is what the disease removes.
    The truncated enzyme is not degraded under high glutamine, so its abundance
    is no longer set by how much product it has made. The founding study named
    this gain of stabilization, and it is the rate-limiting step of the
    disorder: everything upstream converges on it, and everything downstream
    follows from it.
  biological_processes:
  - preferred_term: proteasome-mediated ubiquitin-dependent protein catabolic process
    modifier: DECREASED
    term:
      id: GO:0043161
      label: proteasome-mediated ubiquitin-dependent protein catabolic process
  - preferred_term: protein stabilization
    modifier: INCREASED
    term:
      id: GO:0050821
      label: protein stabilization
  evidence:
  - reference: PMID:38579670
    reference_title: "Clustered de novo start-loss variants in GLUL result in a developmental and epileptic encephalopathy via stabilization of glutamine synthetase."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      GS levels are regulated post-translationally by an N-terminal degron that
      enables the ubiquitin-mediated degradation of GS in a glutamine-induced
      manner.
    explanation: >-
      Describes the normal feedback mechanism whose removal defines the
      disease.
  - reference: PMID:39985170
    reference_title: "Male proband with intractable seizures and a de novo start-codon-disrupting variant in GLUL."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The truncated glutamine synthetase retains its enzymatic activity yet
      fails to undergo degradation in conditions of high glutamine
    explanation: >-
      States the defining property of the stabilized enzyme, and that catalysis
      is unaffected.
  - reference: PMID:41083803
    reference_title: "Expanding the clinical and genetic spectrum of GLUL-related developmental and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Normally, the lysine residues located in the N-terminal region of GS are
      acetylated at high glutamine concentrations, triggering ubiquitin-mediated
      protein degradation and serving as a negative feedback mechanism
    explanation: >-
      Gives the molecular detail of the feedback loop, the acetylation step
      that reads glutamine concentration.
  downstream:
  - target: Unregulated Glutamine Synthetase Activity in Astrocytes and Glial Progenitors
    causal_link_type: DIRECT
    description: >-
      An enzyme that cannot be removed in proportion to its product keeps
      working when it should be switched off.
    evidence:
    - reference: PMID:42311234
      reference_title: "A Novel Gain-of-Function GLUL Variant Is Associated With Developmental and Epileptic Encephalopathy With Enlarged Perivascular Spaces."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        However, under either low or high glutamine concentrations, the mutant
        exhibited significantly higher enzyme activity than the wild-type,
        indicating disrupted regulation of glutamine synthetase activity.
      explanation: >-
        Measures the functional endpoint directly: activity that fails to track
        glutamine concentration in either direction.

- name: Unregulated Glutamine Synthetase Activity in Astrocytes and Glial Progenitors
  biological_scale: CELLULAR
  role: intermediate
  mechanism_confidence: ESTABLISHED
  description: >-
    The cell type matters, and it is not the neuron. Single-cell transcriptomic
    analysis of human tissue shows GLUL expressed in neural and glial progenitor
    cells and in mature astrocytes, and not in post-mitotic neurons. The
    astrocyte is where glutamate taken up from the synaptic cleft is converted
    to glutamine for return to the neuron, so an astrocytic enzyme running
    outside its feedback control acts directly on the supply side of the
    glutamate-glutamine cycle. Expression in progenitors adds a developmental
    dimension: the same dysregulation is present while the brain is being
    built, not only once it is working.
  molecular_functions:
  - preferred_term: glutamine synthetase activity
    modifier: GAIN_OF_FUNCTION
    term:

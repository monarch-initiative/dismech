- name: Disrupted Glutamate-Glutamine Homeostasis in the Developing Brain
  biological_scale: TISSUE
  role: intermediate
  mechanism_confidence: PROVISIONAL
  description: >-
    Glutamine synthetase sits at the junction of three things the brain cannot
    afford to get wrong: it makes the precursor from which both glutamate and
    GABA are regenerated, and it is the principal route by which ammonia is
    detoxified in the brain. Losing regulatory control of it during
    neurodevelopment is the proposed proximate cause of both the epilepsy and
    the developmental arrest.

    The confidence here is PROVISIONAL rather than ESTABLISHED, and
    deliberately so. The step is asserted on the basis of what the enzyme does
    rather than on a measurement of glutamate or glutamine in an affected
    brain, and the peripheral biochemistry that is available does not behave as
    the mechanism predicts. That mismatch is recorded as an open knowledge gap
    rather than resolved here.

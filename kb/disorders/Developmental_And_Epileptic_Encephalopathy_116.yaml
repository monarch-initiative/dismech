genetic:
- name: GLUL
  notes: >-
    GLUL encodes glutamine synthetase. It is the single causative gene, and it
    causes two different diseases by two opposite mechanisms. Biallelic
    loss-of-function missense variants abolish enzyme activity and cause
    congenital glutamine deficiency, an autosomal recessive disorder with brain
    malformation, multiorgan failure and infantile death. Heterozygous de novo
    variants that remove the N-terminal degron stabilize the enzyme and cause
    this entity. Reported dominant alleles include c.1A>C, c.1A>G, c.1A>T and
    c.3G>A affecting the initiation codon directly, c.-13-2A>G and c.-13-1G>A
    and c.-13-1G>C affecting the 5' untranslated region splice acceptor, and
    more recently c.604T>C p.(Trp202Arg) and c.522_536dup in the coding
    sequence. Both diseases are rare: roughly six recessive and thirteen
    dominant patients had been reported by late 2025.
  gene_term:
    preferred_term: GLUL
    term:
      id: hgnc:4341
      label: GLUL
  relationship_type: CAUSATIVE
  variant_origin: DE_NOVO
  evidence:
  - reference: PMID:41083803
    reference_title: "Expanding the clinical and genetic spectrum of GLUL-related developmental and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both loss-of-function and gain-of-function variants of GLUL are known to
      cause genetic disorders in humans.
    explanation: >-
      States the bidirectional genotype-phenotype relationship of the gene.
  - reference: PMID:41083803
    reference_title: "Expanding the clinical and genetic spectrum of GLUL-related developmental and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Only six autosomal recessive cases and ten autosomal dominant cases have
      been reported to date, and knowledge about GLUL-related DEE remains
      limited.
    explanation: >-
      Quantifies how few patients define this entity, which bounds every
      frequency and genotype-phenotype statement in this entry.
  - reference: PMID:41083803
    reference_title: "Expanding the clinical and genetic spectrum of GLUL-related developmental and epileptic encephalopathy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Another novel variant, c.604T > C (p.Trp202Arg), was heterozygous without
      any additional pathogenic or likely pathogenic variant in GLUL, unlike
      all other previously reported missense variants which exhibited a
      biallelic status.
    explanation: >-
      Records the first heterozygous missense allele, which does not fit the
      start-loss mechanism and is uncharacterised functionally.

differential_diagnoses:
- name: Congenital glutamine deficiency
  description: >-
    The other GLUL disease, and the one a clinician is more likely to have
    heard of. It is caused by biallelic loss-of-function variants, is
    autosomal recessive, and presents in the neonatal period with severe brain
    malformation, multiorgan failure and death in infancy. Its biochemistry is
    the mirror image of what this entity was predicted to show: markedly
    reduced plasma and cerebrospinal fluid glutamine with hyperammonaemia.
  distinguishing_features:
  - >-
    Inheritance separates them cleanly: biallelic inherited variants in the
    recessive disease versus a single de novo variant in this one.
  - >-
    Outcome separates them. Congenital glutamine deficiency kills in infancy;
    every reported patient with the dominant disease was alive between 16
    months and 16 years of age.
  - >-
    Biochemistry separates them in principle but not in practice. Low glutamine
    with raised ammonia is expected and usually observed in the recessive
    disease. In the dominant one glutamine is usually normal and ammonia is
    sometimes raised, so the panel neither confirms nor excludes it.
  - >-
    Imaging differs: brain malformation and ventriculomegaly in the recessive
    disease, against enlarged perivascular spaces and a thin corpus callosum in
    this one.
  evidence:
  - reference: PMID:42311234
    reference_title: "A Novel Gain-of-Function GLUL Variant Is Associated With Developmental and Epileptic Encephalopathy With Enlarged Perivascular Spaces."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Recessive forms are associated with congenital glutamine deficiency,
      manifesting with severe brain malformation, multiorgan failure, and early
      death.
    explanation: >-
      Characterises the recessive disease that must be distinguished from this
      one.
  - reference: PMID:41083803
    reference_title: "Expanding the clinical and genetic spectrum of GLUL-related developmental and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In AR cases, low plasma or CSF glutamine and elevated ammonia levels were
      common findings, although two patients (Patients 18 and 19) showed normal
      plasma glutamine levels.
    explanation: >-
      Gives the biochemical profile of the recessive disease, and notes that
      even there it is not universal.

treatments:
- name: Antiseizure Medication
  description: >-
    There is no treatment directed at the mechanism. Seizure control is
    attempted with conventional antiseizure medications and, in some patients,
    a ketogenic diet, and the results are poor and inconsistent: several
    patients remained refractory through multiple agents, while others achieved
    partial control with valproic acid or perampanel added late. Agents
    reported in use include vigabatrin, prednisolone, topiramate, valproic
    acid, lacosamide, perampanel, lamotrigine and levetiracetam. No agent has
    been shown to work better than another in this disorder, and no
    genotype-directed choice is possible on current evidence.

    One practical caution follows from the biochemistry. Some patients are
    hyperammonaemic, and the authors of the series reporting that raise
    valproic acid as a possible cause rather than a disease feature. Since
    valproic acid is among the drugs used here, a rising ammonia in a treated
    patient should not be assumed to reflect the underlying enzyme defect.

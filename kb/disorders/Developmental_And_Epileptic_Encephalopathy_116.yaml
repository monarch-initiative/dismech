diagnosis:
- name: Trio Exome or Genome Sequencing
  description: >-
    Molecular diagnosis is the only reliable route, and it must be trio-based:
    the variants are de novo, so demonstrating that neither parent carries the
    change is what establishes causality for a variant class that is easy to
    overlook. Two features make these variants easy to miss on a standard
    pipeline. Variants in the 5' untranslated region fall outside the coding
    sequence that many analyses prioritise, and start-loss variants are not
    always flagged as high-impact. RNA sequencing was used in one patient to
    confirm that a splice acceptor variant does produce the predicted
    degron-removing transcript.
  evidence:
  - reference: PMID:41083803
    reference_title: "Expanding the clinical and genetic spectrum of GLUL-related developmental and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      An alternative splicing event causing loss of the N-terminal degron of GS
      was confirmed by RNA sequencing in a patient carrying c.-13-1G > C
      variant.
    explanation: >-
      Shows RNA sequencing confirming the functional consequence of a
      non-coding variant, which sequence analysis alone would leave uncertain.
  - reference: PMID:39985170
    reference_title: "Male proband with intractable seizures and a de novo start-codon-disrupting variant in GLUL."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      More than half of individuals with a suspected Mendelian disease remain
      undiagnosed after analysis of the exome or genome.
    explanation: >-
      Context for why this patient was diagnosed only on reanalysis after the
      gene-disease association was published, which is the practical diagnostic
      point for a newly described entity.

- name: Plasma and Cerebrospinal Fluid Amino Acid Analysis
  description: >-
    Worth understanding mainly for what it does not do. Biochemical testing is
    diagnostically useful in the recessive GLUL disease, where low glutamine
    with raised ammonia is the expected and usually observed pattern. In this
    dominant entity it is not: the founding cohort had normal plasma and
    cerebrospinal fluid biochemistry, and a later series found heterogeneous
    profiles including low glutamine and elevated ammonia, which is the
    opposite of what a stabilized enzyme predicts. A normal amino acid panel
    therefore does not exclude the diagnosis, and an abnormal one does not
    confirm it.
  evidence:
  - reference: PMID:38579670
    reference_title: "Clustered de novo start-loss variants in GLUL result in a developmental and epileptic encephalopathy via stabilization of glutamine synthetase."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We ascertained nine individuals with severe developmental delay,
      seizures, and white matter abnormalities but normal plasma and
      cerebrospinal fluid biochemistry with de novo variants in GLUL.
    explanation: >-
      Establishes that biochemistry was normal across the founding cohort, so a
      normal result cannot exclude the diagnosis.
  - reference: PMID:41083803
    reference_title: "Expanding the clinical and genetic spectrum of GLUL-related developmental and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These observations suggest that biochemical testing might have some value
      in confirming the AR type of the disease, but its value in the diagnosis
      of the AD type of the disease remains unclear.
    explanation: >-
      The authors' own conclusion about the diagnostic utility of biochemistry
      in this entity.

discussions:
- discussion_id: dee116_biochemistry_contradicts_mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why does a stabilized, feedback-insensitive glutamine synthetase not
    produce the biochemical profile it predicts, and what is actually happening
    to glutamine and ammonia in the brains of these patients?
  attaches_to:
  - "pathophysiology#Disrupted Glutamate-Glutamine Homeostasis in the Developing Brain"
  - "pathophysiology#Unregulated Glutamine Synthetase Activity in Astrocytes and Glial Progenitors"
  rationale: >-
    The mechanism makes a clear prediction. An enzyme that converts glutamate
    and ammonia into glutamine, and that can no longer be degraded when
    glutamine is high, should raise glutamine and lower ammonia. The recessive
    disease behaves as the mirror of this: loss of the enzyme gives low
    glutamine and high ammonia, and that is what is usually measured.

    The dominant disease does not. The founding cohort of nine had normal
    plasma and cerebrospinal fluid biochemistry. A later series found
    heterogeneous profiles, with plasma glutamine low in one patient and normal
    in two, cerebrospinal fluid glutamine ranging from low to high across
    reported patients, and elevated ammonia in two of three. The reporting
    authors state plainly that the biochemistry did not agree with the
    gain-of-function mechanism.

    Several explanations are available and none has been tested. Peripheral
    blood may simply not report on astrocytic glutamine handling, in which case
    the measurement is wrong rather than the mechanism. The stabilized enzyme
    may be limited by substrate rather than by its own abundance, so more
    enzyme does not mean more product. The hyperammonaemia may be iatrogenic,
    since valproic acid raises ammonia and is among the drugs these patients
    receive, which is the explanation the reporting authors themselves offer.
    Or the pathogenic consequence may be something other than net flux through
    the enzyme, for instance the loss of a regulatory signal that the degron
    itself carries.

    This matters practically as well as mechanistically, because it is why
    biochemical testing cannot be used to screen for or confirm this diagnosis.
  proposed_experiments:
  - experiment_id: dee116_brain_glutamine_mrs
    name: Magnetic resonance spectroscopy of glutamine and glutamate in patient brain
    description: >-
      Measure glutamine and glutamate directly in the brains of patients with
      confirmed dominant GLUL variants, rather than inferring brain metabolism
      from plasma. This distinguishes the two leading explanations: if brain
      glutamine is raised while plasma is normal, the mechanism is right and
      the peripheral measurement is uninformative; if brain glutamine is also
      normal, the mechanism needs revisiting.
  - experiment_id: dee116_astrocyte_flux_assay
    name: Metabolic flux measurement in patient-derived astrocytes
    description: >-
      Differentiate astrocytes from patient induced pluripotent stem cells and
      measure labelled glutamate to glutamine conversion under varying
      glutamine and ammonia loads. Directly tests whether the stabilized enzyme
      increases flux, or whether flux is substrate-limited so that the extra
      enzyme has no metabolic consequence.
  - experiment_id: dee116_ammonia_valproate_stratification
    name: Ammonia measurement stratified by valproic acid exposure
    description: >-
      Compare ammonia levels in patients on and off valproic acid, or before
      and after starting it. This is the cheapest of the three and settles
      whether the hyperammonaemia is a disease feature or a drug effect, which
      currently confounds every biochemical description of the disorder.
  evidence:
  - reference: PMID:38579670
    reference_title: "Clustered de novo start-loss variants in GLUL result in a developmental and epileptic encephalopathy via stabilization of glutamine synthetase."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We ascertained nine individuals with severe developmental delay,
      seizures, and white matter abnormalities but normal plasma and
      cerebrospinal fluid biochemistry with de novo variants in GLUL.
    explanation: >-
      Establishes that biochemistry was normal in the founding cohort despite
      the demonstrated stabilization of the enzyme.
  - reference: PMID:41083803
    reference_title: "Expanding the clinical and genetic spectrum of GLUL-related developmental and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In contrast, the analysis of patients with AD type of the disease did not
      yield consistent results with the gain-of-function mechanism.
    explanation: >-
      The explicit statement that the observed biochemistry contradicts the
      mechanism.
  - reference: PMID:41083803
    reference_title: "Expanding the clinical and genetic spectrum of GLUL-related developmental and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Some showed low glutamine levels in the plasma or CSF and elevation of
      ammonia, although the high ammonia level might have been caused by the
      use of valproic acid
    explanation: >-
      Records both the contradictory finding and the drug-effect explanation
      the authors offer for part of it.

- discussion_id: dee116_female_predominance
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why were all nine individuals in the founding cohort female, and is the
    apparent female predominance real or an artefact of ascertainment?
  attaches_to:
  - "pathophysiology#GLUL Start-Loss and 5' UTR Splice Variants"
  - "pathophysiology#Unregulated Glutamine Synthetase Activity in Astrocytes and Glial Progenitors"
  rationale: >-
    A de novo autosomal dominant disorder has no reason to affect one sex. This
    one appeared to: every one of the nine probands in the founding cohort was
    female, and the reporting authors noted that the phenotype was
    uncharacterized in males. The hypothesis they offered was a reported
    difference in glutamine metabolism between the sexes, which would place the
    modifier downstream of the variant rather than in transmission.

    The first male proband was reported the following year, and his phenotype
    matched the female cases: refractory seizures, global developmental delay,
    hypotonia. That settles the strong version of the question, which was
    whether males are affected at all. It does not settle the weaker one. With
    ten patients in total, nine of one sex, the imbalance could be chance,
    could be ascertainment, or could be real with males either less severely
    affected or affected differently enough to be diagnosed as something else.

    Distinguishing these needs more patients rather than a new experiment, but
    the metabolic hypothesis is separately testable and would be worth testing
    even at the current cohort size, because a sex difference in glutamine
    handling would bear on the biochemistry gap recorded in the other
    discussion here.
  proposed_experiments:
  - experiment_id: dee116_sex_ratio_cohort_accrual
    name: Sex ratio in a prospectively accrued GLUL cohort
    description: >-
      Accrue patients through GeneMatcher and diagnostic laboratories without
      selecting on phenotype, and report the sex ratio. Ten patients cannot
      distinguish a real 9-to-1 imbalance from chance; a few dozen can.
  - experiment_id: dee116_sex_stratified_gs_turnover
    name: Sex-stratified measurement of glutamine synthetase turnover
    description: >-
      Measure glutamine synthetase abundance and glutamine-induced degradation
      in male and female control cells, and in patient cells of both sexes.
      This tests the specific hypothesis the founding authors offered, that
      sex differences in glutamine metabolism modify the consequence of losing
      the degron.
  evidence:
  - reference: PMID:39985170
    reference_title: "Male proband with intractable seizures and a de novo start-codon-disrupting variant in GLUL."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The original study highlighted that all reported individuals were female
      and that the phenotype remains uncharacterized in males. The
      overrepresentation of females was hypothesized to be due to the reported
      difference in glutamine metabolism between sexes.
    explanation: >-
      States the observation and the hypothesis offered for it.
  - reference: PMID:39985170
    reference_title: "Male proband with intractable seizures and a de novo start-codon-disrupting variant in GLUL."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This indicates that this genetic condition clinically affects both male
      and female individuals. The reason for female predominance among reported
      individuals remains an open question.
    explanation: >-
      Settles that males are affected, and states explicitly that the imbalance
      itself is unexplained.

- discussion_id: dee116_heterotopia_mouse_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    A patient with a start-loss GLUL variant had periventricular nodular
    heterotopia, but overexpressing stabilized glutamine synthetase in mouse
    cortex produced no migration defect. Does the human neuronal migration
    phenotype belong to this disease, and if so why does the mouse experiment
    not reproduce it?
  attaches_to:
  - "pathophysiology#Unregulated Glutamine Synthetase Activity in Astrocytes and Glial Progenitors"
  - "pathophysiology#Disrupted Glutamate-Glutamine Homeostasis in the Developing Brain"
  rationale: >-
    The founding study reported one individual with periventricular nodular
    heterotopia, a disorder of neuronal migration, and then tested the obvious
    hypothesis directly: it overexpressed the stabilized enzyme in the
    developing mouse cortex by in utero electroporation and looked for
    migration defects. There were none. The authors report the negative result
    rather than omitting it, which is why it is curated here as a mismatch
    rather than as an absence of evidence.

    Three readings are open. The heterotopia may be coincidental in a single
    patient, in which case it is not a feature of the disease at all. The mouse
    experiment may not model the human condition adequately, since
    electroporation overexpresses the protein in a subset of cells for a
    limited window whereas patients carry the variant in every cell from
    conception, and since GLUL is expressed in progenitors whose human biology
    the mouse cortex represents imperfectly. Or the migration phenotype may
    depend on the astrocytic and progenitor context rather than on the enzyme
    being present in the migrating neuron, in which case overexpressing it in
    the electroporated cells tests the wrong cell type.

    Whether the heterotopia belongs to the disease is not resolvable from one
    patient, and no subsequent series has reported a second case; the more
    recent cohorts describe atrophy, callosal thinning and perivascular space
    enlargement instead.
  proposed_experiments:
  - experiment_id: dee116_knockin_mouse_migration
    name: Germline knock-in mouse carrying the human start-loss allele
    description: >-
      Replace the electroporation overexpression model with a knock-in that
      carries the human variant in every cell from conception, and assess
      cortical lamination and neuronal migration. This tests the leading
      explanation for the negative result, that the model system rather than
      the hypothesis was inadequate.
  - experiment_id: dee116_imaging_review_for_heterotopia
    name: Systematic re-review of brain imaging across all reported patients
    description: >-
      Have a neuroradiologist blinded to genotype look specifically for
      heterotopia in the imaging of every reported patient. Periventricular
      nodular heterotopia is easy to miss when it is not being sought, and a
      second case would change the interpretation from coincidence to
      phenotype.
  evidence:
  - reference: PMID:38579670
    reference_title: "Clustered de novo start-loss variants in GLUL result in a developmental and epileptic encephalopathy via stabilization of glutamine synthetase."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      One individual with a start-loss GLUL variant demonstrated
      periventricular nodular heterotopia, a neuronal migration disorder, yet
      overexpression of stabilized GS in mice using in utero electroporation
      demonstrated no migratory deficits.
    explanation: >-
      Reports both halves of the mismatch: the human finding and the negative
      mouse result that failed to reproduce it.

notes: >-
  One gene, two opposite diseases. GLUL causes congenital glutamine deficiency
  through biallelic loss of function and this entity through heterozygous gain
  of stabilization, and the two differ in inheritance, biochemistry, imaging
  and survival. They are modelled here as separate entities with a
  differential_diagnoses link rather than as subtypes of one disease, because
  the mechanisms run in opposite directions. Congenital glutamine deficiency
  does not currently have a dismech entry.

  Not curated here, and why. No prevalence record: the disorder was described in
  2024 and roughly thirteen dominant patients had been reported by late 2025, so
  no population estimate exists and none can be derived from a case series.
  No environmental section: no exposure has been examined in relation to this
  disorder. No experimental_models or animal_models section: the only model
  reported is the in utero electroporation overexpression experiment, which is
  a single negative result rather than a characterised model, and it is curated
  in the HUMAN_MODEL_MISMATCH discussion where its negative finding carries the
  meaning. No datasets: the entity is too new for a disease-specific omics
  dataset, and the neighbouring GABRB3 entry records that dataset search on the
  phrase "developmental epileptic encephalopathy" returns GLUL-labelled
  accessions by text match, so the reverse error is a live risk here too.

  Targeted therapy is proposed but does not exist, and is deliberately not
  curated as a treatment. Two approaches have been floated in the literature.
  Antisense oligonucleotides could in principle block the aberrant splice event
  or knock down the mis-spliced transcript allele-specifically, which is
  attractive because the recurrent c.-13-2A>G allele produces a defined
  aberrant transcript. Methionine sulfoximine, an irreversible glutamine
  synthetase inhibitor trialled in rats for hyperammonaemic encephalopathy, has
  also been mentioned. Neither has been tested in this disorder, the authors
  proposing the antisense route say extensive experimental validation is needed
  first, and inhibiting an enzyme whose deficiency causes a lethal disease is
  not a manoeuvre to record as a therapy on the strength of a suggestion. No
  conformance to the antisense_oligonucleotide_therapy module is declared for
  the same reason: there is no drug, no trial, and no demonstrated splice
  redirection.

  The mechanistic name "glutamine synthetase stabilization disorder" appears in
  secondary sources attributed to the founding study. The cached record for that
  study is the PubMed abstract only, which does not contain the phrase, so it is
  not curated as a synonym here.

  GeneReviews has no chapter for this entity, and a PubMed search for one
  returned nothing. Given that the disorder was first described in 2024, that is
  expected rather than an omission.

  Frequency bands. Every frequency in this entry rests on a denominator of ten
  to thirteen patients, and two phenotypes reported only in the most recent
  three-patient series (cerebral atrophy, deep grey matter T2 hyperintensity)
  carry no frequency at all, because a feature found in three of three patients
  in one series and in none of the earlier ten cannot be banded honestly.

    explanation: >-
      Supports the use of antiseizure medication while establishing that
      response is inconsistent, which is why the support is PARTIAL.
  - reference: PMID:41083803
    reference_title: "Expanding the clinical and genetic spectrum of GLUL-related developmental and epileptic encephalopathy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Analysis of human single-cell transcriptomes demonstrated that GLUL is
      widely expressed in neuro- and glial-progenitor cells and mature
      astrocytes but not in post-mitotic neurons.
    explanation: >-
      Establishes which cells carry the dysregulated enzyme, and excludes the
      neuron.
  - reference: PMID:42311234
    reference_title: "A Novel Gain-of-Function GLUL Variant Is Associated With Developmental and Epileptic Encephalopathy With Enlarged Perivascular Spaces."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Glutamate is excreted by neurons into the synaptic cleft as a
      neurotransmitter and absorbed by astrocytes, where it is converted into
      glutamine by GS.
    explanation: >-
      Places the enzyme at the astrocytic step of the glutamate-glutamine
      cycle, which is why an astrocytic defect changes neurotransmitter
      handling.
  downstream:
  - target: Disrupted Glutamate-Glutamine Homeostasis in the Developing Brain
    causal_link_type: DIRECT
    description: >-
      Loss of feedback control over the enzyme that sets the glutamine supply

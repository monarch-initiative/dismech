name: RECON Progeroid Syndrome
creation_date: "2026-09-23T00:00:00Z"
category: Mendelian
description: >-
  RECON (RECql ONe) syndrome is an autosomal recessive genome instability
  disorder with a progeroid facial gestalt, caused by biallelic variants in
  RECQL (RECQL1), the RecQ-family 3'-5' DNA helicase that had no associated
  human disease before 2022. The entire published cohort is three girls from
  two Middle Eastern families (one consanguineous), all homozygous for the same
  zinc-binding-domain missense variant, p.Ala459Ser, and all evaluated in
  childhood (4 to 14 years). Growth deficiency is postnatal: birth weights at
  term were normal, while height and especially weight fell below the mean,
  most severely in the one child followed into adolescence. Cutaneous
  photosensitivity, xeroderma, a progeroid face with a tiny pinched
  (hypoplastic) nose and prominent premaxilla, and slender elongated thumbs
  were present in all three; reduced subcutaneous fat, dry eyes, red eyes and
  hirsutism were seen in some. Developmental milestones were age appropriate in
  all three. The variant is hypomorphic: the mutant protein is expressed and
  localizes normally but has reduced ATPase, helicase and reversed-fork
  restoration activity with preserved strand annealing, and patient cells show
  spontaneous replication fork stalling, defective fork restart, impaired
  repair of topoisomerase-poison-induced breaks and increased chromosome
  breakage. How this cellular defect produces the clinical features is not
  established. No cancers have been reported in affected individuals or their
  heterozygous relatives, but the cohort is too small and young to assess
  cancer risk or adult natural history, and no disease-specific management or
  surveillance has been published.
parents:
- Genetic Disease
synonyms:
- RECON syndrome
- RECQL1-related progeroid syndrome
notes: >-
  Lump/split. This entry covers only the biallelic (autosomal recessive)
  progeroid disorder. Heterozygous RECQL loss-of-function variants have been
  proposed as a moderate-penetrance breast cancer susceptibility factor; that
  is a separate, contested gene-disease claim (ClinGen Hereditary Cancer GCEP
  classifies RECQL with hereditary breast carcinoma, autosomal dominant, as
  Disputed, assertion CGGV:assertion_777b2a5c-459f-4eee-8a6d-e8bf15b88aca,
  2023-03-13) and is recorded here only as a discussion attached to the gene,
  never as a phenotype of RECON syndrome. Gene-disease validity for RECQL with
  RECON progeroid syndrome itself has no ClinGen curation; in the GenCC
  submissions export (downloaded 2026-09-23) it is classified Limited by Labcorp
  Genetics (2023-07-13) and Moderate by PanelApp Australia (2025-01-17). No
  Orphanet disorder record for RECON syndrome was found in the Orphadata
  en_product1.xml release pinned in data/orphadata/MANIFEST.yaml (search for
  "RECON" and "RECQL" returned no match). No GeneReviews chapter exists. All
  phenotype data derive from one primary report of three individuals
  (PMID:35025765); frequencies are given as counts only where a source states
  the denominator. Developmental milestones were age appropriate in each of
  the three. No treatment, surveillance protocol, or clinical trial has been
  published, so the entry has no treatments section.

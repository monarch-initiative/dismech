    explanation: >-
      The authors characterize the allele as hypomorphic and caution that the
      phenotype of null alleles is unknown.
pathophysiology:
- name: RECQL1 Zinc-Binding Domain Hypomorphic Missense Variant
  description: >-
    Homozygous germline RECQL c.1375G>T p.(Ala459Ser) substitutes a conserved
    alanine in the RECQL1 zinc-binding domain. Mutant protein is expressed at
    normal levels in patient lymphoblastoid cells, localizes to the nucleus and
    still associates with PARP1, so the defect is catalytic rather than a loss
    of protein.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: RECQL
    term:
      id: hgnc:9948
      label: RECQL
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    variant_type: single nucleotide variant
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
    gene:
      preferred_term: RECQL
      term:
        id: hgnc:9948
        label: RECQL
  evidence:
  - reference: PMID:35025765
    reference_title: "RECON syndrome is a genome instability disorder caused by mutations in the DNA helicase RECQL1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "were homozygous for the same missense mutation in RECQL1 (p.Ala459Ser), located within its zinc binding domain"
    explanation: Identifies the causal variant and its domain location.
  - reference: PMID:35025765
    reference_title: "RECON syndrome is a genome instability disorder caused by mutations in the DNA helicase RECQL1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We observed no obvious differences in the expression of RECQL1 protein in LCLs from the 2 affected patients when compared with the expression of RECQL1 in LCLs from 2 normal individuals"
    explanation: Mutant protein is stably expressed in patient cells.
  downstream:
  - target: Reduced RECQL1 ATPase and Helicase Activity
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:35025765
      reference_title: "RECON syndrome is a genome instability disorder caused by mutations in the DNA helicase RECQL1."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Biochemical analysis of the mutant RECQL1 protein revealed that the p.A459S missense mutation compromised its ATPase, helicase, and fork restoration activity, while its capacity to promote single-strand DNA annealing was largely unaffected."
      explanation: Recombinant mutant protein assays link the variant to the catalytic defect.
- name: Reduced RECQL1 ATPase and Helicase Activity
  description: >-
    Recombinant RECQL1-A459S has reduced ATP turnover, reduced unwinding of
    forked duplexes and reduced restoration of reversed replication forks,
    with modestly reduced DNA binding. Single-strand annealing and
    oligomerization are preserved, so the variant selectively impairs the
    ATP-driven motor function.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: RECQL
    term:
      id: hgnc:9948
      label: RECQL
  molecular_functions:
  - preferred_term: DNA helicase activity

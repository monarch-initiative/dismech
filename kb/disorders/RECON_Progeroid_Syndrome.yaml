      label: DNA helicase activity
  - preferred_term: ATP hydrolysis activity
    modifier: DECREASED
    term:
      id: GO:0016887
      label: ATP hydrolysis activity
  evidence:
  - reference: PMID:35025765
    reference_title: "RECON syndrome is a genome instability disorder caused by mutations in the DNA helicase RECQL1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "At a protein concentration of 2.5 nM, WT RECQL1 unwound nearly 60% of the DNA substrate compared with approximately 20% for mutant RECQL1"
    explanation: Quantifies the helicase deficit of the mutant protein.
  - reference: PMID:35025765
    reference_title: "RECON syndrome is a genome instability disorder caused by mutations in the DNA helicase RECQL1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "WT RECQL1 had a nearly 3-fold higher kcat for ATP hydrolysis in the presence of the M13mp18 ssDNA effector compared with RECQL1-A459S"
    explanation: Quantifies the ATPase deficit of the mutant protein.
  - reference: PMID:35025765
    reference_title: "RECON syndrome is a genome instability disorder caused by mutations in the DNA helicase RECQL1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the strand annealing activity of WT and mutant RECQL1 proteins was nearly identical over a range of protein concentrations"
    explanation: Strand annealing is preserved, so the loss of function is partial and selective.
  downstream:
  - target: Defective Replication Fork Restart
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:35025765
      reference_title: "RECON syndrome is a genome instability disorder caused by mutations in the DNA helicase RECQL1."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "the p.A459S mutant RECQL1 consistently had a reduced ability to restore the replication fork compared with WT RECQL1"
      explanation: >-
        In a reconstituted reversed-fork assay the catalytic defect directly
        reduces fork restoration, the biochemical step underlying restart.
  - target: Stalled Replication Fork Degradation
  - target: Impaired Repair of Topoisomerase-Associated DNA Breaks
    evidence:
    - reference: PMID:35025765
      reference_title: "RECON syndrome is a genome instability disorder caused by mutations in the DNA helicase RECQL1."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "At the cellular level, this mutation in RECQL1 gave rise to a defect in the ability to repair DNA damage induced by exposure to topoisomerase poisons and a failure of DNA replication to progress efficiently in the presence of abortive topoisomerase lesions."
      explanation: Links the variant to the repair defect in patient-derived cells.
- name: Stalled Replication Fork Degradation
  description: >-
    Patient fibroblasts expressing empty vector or RECQL1-A459S show a mild
    increase in nascent-strand degradation after prolonged hydroxyurea
    exposure, corrected by wild-type RECQL1. The authors attribute the
    fork-restart defect partly to this degradation.
  biological_scale: CELLULAR
  evidence:
  - reference: PMID:35025765
    reference_title: "RECON syndrome is a genome instability disorder caused by mutations in the DNA helicase RECQL1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "RECQL-P1-1 fibroblasts complemented with empty vector and the p.A459S exhibited a mild increase in replication fork degradation after prolonged exposure to HU that could be complemented following the expression of WT RECQL1"
    explanation: Fiber-assay evidence of increased fork degradation, rescued by wild-type protein.
  downstream:
  - target: Defective Replication Fork Restart
    evidence:
    - reference: PMID:35025765
      reference_title: "RECON syndrome is a genome instability disorder caused by mutations in the DNA helicase RECQL1."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "the replication fork restart defect present in the cells derived from patients with RECON syndrome was not only due to an inability of the mutant RECQL1 to remodel reversed forks but also resulted from the degradation of stalled forks"
      explanation: The authors attribute part of the restart defect to fork degradation.
- name: Defective Replication Fork Restart
  description: >-
    Patient lymphoblastoid cells show more spontaneously stalled forks
    (endogenous replication stress), and patient cells fail to restart forks
    stalled by topoisomerase I or II poisons, hydroxyurea or MMS. Fork speed
    and origin firing are grossly normal before treatment. The defects are
    corrected by wild-type but not A459S RECQL1.
  biological_scale: CELLULAR
  genes:
  - preferred_term: RECQL
    term:
      id: hgnc:9948
      label: RECQL
  biological_processes:
  - preferred_term: replication fork restart
    modifier: DECREASED
    term:
      id: GO:0031297
      label: replication fork processing
  evidence:
  - reference: PMID:35025765
    reference_title: "RECON syndrome is a genome instability disorder caused by mutations in the DNA helicase RECQL1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "even in the absence of exposure to genotoxins, both RECQL1 LCLs had an increase in spontaneously stalled forks indicative of higher levels of endogenous replication stress"
    explanation: Spontaneous replication stress in patient cells.
  - reference: PMID:35025765
    reference_title: "RECON syndrome is a genome instability disorder caused by mutations in the DNA helicase RECQL1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "these data suggest that the clinically relevant p.A459S mutation in the RECQL1 ZBD, which perturbs its catalytic activity, compromises the ability of RECQL1 to restart reversed replication forks."
    explanation: Fiber analysis in patient LCLs and complemented fibroblasts shows the restart defect.
  - reference: PMID:35025765
    reference_title: "RECON syndrome is a genome instability disorder caused by mutations in the DNA helicase RECQL1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the p.A459S mutation significantly compromised the ability of replication forks transiently stalled by HU to restart efficiently"
    explanation: The restart defect extends beyond topoisomerase lesions to nucleotide-depletion stalling.
  downstream:
  - target: Chromosomal Instability
    evidence:
    - reference: PMID:35025765
      reference_title: "RECON syndrome is a genome instability disorder caused by mutations in the DNA helicase RECQL1."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "the p.A459S mutant also compromised the ability of cells to restart replication in the presence of DNA alkylation damage induced by MMS exposure, accompanied by increased chromosome breakage and cell death"
      explanation: >-
        The restart failure is accompanied by increased chromosome breakage in
        the same cells; this is co-occurrence in one experiment rather than a
        dissected causal step.
- name: Impaired Repair of Topoisomerase-Associated DNA Breaks
  description: >-
    Patient fibroblasts lacking functional RECQL1 retain more 53BP1 foci for 24
    hours after camptothecin or etoposide and have more spontaneous foci.
    ATM-dependent damage signaling is robustly activated in patient cells, so
    the defect lies in repair or replication through the lesion rather than in
    damage sensing. Breakage and translocation at the MLL locus after
    etoposide, the signature of TDP2 deficiency, was not increased.
  biological_scale: CELLULAR
  conforms_to: "genomic_instability_aging#Declining Genome Maintenance and Erroneous Repair"
  biological_processes:
  - preferred_term: double-strand break repair
    modifier: DECREASED
    term:
      id: GO:0006302
      label: double-strand break repair
  evidence:
  - reference: PMID:35025765
    reference_title: "RECON syndrome is a genome instability disorder caused by mutations in the DNA helicase RECQL1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "patients’ cells expressing either the empty vector or the p.A459S-mutant RECQL1 had higher numbers of 53BP1 foci in cells throughout a 24-hour time course following exposure to CPT or ETOP than did cells expressing WT RECQL1"
    explanation: Persistent 53BP1 foci indicate slower repair of topoisomerase-poison-induced breaks.
  - reference: PMID:35025765
    reference_title: "RECON syndrome is a genome instability disorder caused by mutations in the DNA helicase RECQL1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "both RECQL1-mutant cell lines showed robust activation of the ATM-dependent DDR"
    explanation: Damage signaling is intact, localizing the defect downstream of sensing.
  downstream:
  - target: Chromosomal Instability
    evidence:
    - reference: PMID:35025765
      reference_title: "RECON syndrome is a genome instability disorder caused by mutations in the DNA helicase RECQL1."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "cells containing the empty vector or expressing p.A459S-mutant RECQL1 exhibited significantly greater numbers of spontaneous and CPT- or ETOP-induced micronuclei than did their WT RECQL1–expressing counterparts"
      explanation: Unrepaired breaks manifest as micronuclei, a marker of genome instability.
- name: Chromosomal Instability
  description: >-
    Patient lymphoblastoid cells and fibroblasts show increased spontaneous
    and camptothecin- or etoposide-induced chromosome breakage and radial
    exchanges, more micronuclei, and a mild increase in sister chromatid
    exchange; the breakage is corrected by wild-type RECQL1. Constitutional
    karyotype and diepoxybutane-induced breakage were normal in family B, so
    this is a cellular, not a karyotypic, finding. Its link to the clinical
    features has not been demonstrated.
  biological_scale: CELLULAR
  evidence:
  - reference: PMID:35025765
    reference_title: "RECON syndrome is a genome instability disorder caused by mutations in the DNA helicase RECQL1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the RECQL1-P1-1 and RECQL1-P2 LCLs had higher levels of spontaneous and CPT- or ETOP-induced chromosome breakage than did 2 normal LCLs"
    explanation: Increased chromosome breakage in both patients' cell lines.
  - reference: PMID:35025765
    reference_title: "RECON syndrome is a genome instability disorder caused by mutations in the DNA helicase RECQL1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "both the increased spontaneous and CPT- or ETOP-induced chromosome breakages were also observed in fibroblasts from patient RECQL1-P1 and could be complemented by the expression of exogenous WT but not mutant A459S RECQL1"
    explanation: Complementation ties the breakage phenotype to RECQL1 dysfunction.
  downstream:
  - target: Chromosome Breakage
  - target: Increased Sister Chromatid Exchange

animal_models:
- name: Recql-deficient mouse
  species: Mus musculus
  genotype: Recql-/- (targeted disruption)
  publication: PMID:17158923
  description: >-
    Recql-deficient mice have no apparent organismal phenotype, while their
    embryonic fibroblasts show aneuploidy, spontaneous chromosome breakage,
    translocations, radiosensitivity and elevated sister chromatid exchange.
    It is a null model, whereas the only known human allele is hypomorphic.
  associated_phenotypes:
  - No apparent phenotypic difference from wild type
  - Chromosome breakage in embryonic fibroblasts
  modeled_mechanisms:
  - target: Chromosomal Instability
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Embryonic fibroblasts from null mice reproduce spontaneous chromosome breakage.
    limitations: >-
      Null allele rather than the human hypomorphic missense; measured in
      cultured embryonic fibroblasts, not in adult tissues; the mice show no
      organismal phenotype.
    evidence:
    - reference: PMID:17158923
      reference_title: "RECQL, a member of the RecQ family of DNA helicases, suppresses chromosomal instability."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Cytogenetic analyses of embryonic fibroblasts from the RECQL-deficient mice revealed aneuploidy, spontaneous chromosomal breakage, and frequent translocation events."
      explanation: Cultured mouse cells reproduce the cellular chromosome instability.
  evidence:
  - reference: PMID:17158923
    reference_title: "RECQL, a member of the RecQ family of DNA helicases, suppresses chromosomal instability."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "RECQL-deficient mice did not exhibit any apparent phenotypic differences compared to wild-type mice."
    explanation: The null mouse lacks an organismal phenotype.
discussions:
- discussion_id: recon_cellular_to_clinical_gap
  prompt: >-
    How does reduced RECQL1 fork-restart and repair activity produce the
    growth deficiency, progeroid face, xeroderma and photosensitivity of RECON
    syndrome, and why is the developmental phenotype so limited?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Chromosomal Instability
  - phenotypes#Progeroid Facial Appearance
  - phenotypes#Short Stature
  - phenotypes#Cutaneous Photosensitivity
  - phenotypes#Xeroderma
  rationale: >-
    The cellular defect is well characterized in patient cells, but no study
    links it to any clinical feature, so the entry draws no causal edges from
    the cellular nodes to the clinical phenotypes. The authors call the
    progeroid classification speculative.
  evidence:
  - reference: PMID:35025765
    reference_title: "RECON syndrome is a genome instability disorder caused by mutations in the DNA helicase RECQL1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "if RECON syndrome represents a disease of failed replication restart, it is not clear why the clinical symptoms exhibited by the affected patients do not have more of a developmental component"
    explanation: The discovering authors state the unresolved link.
  - reference: PMID:35025765
    reference_title: "RECON syndrome is a genome instability disorder caused by mutations in the DNA helicase RECQL1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "it is likely that the affected patients are currently too young to ascertain whether they have any other clinical signs of premature aging, it is tempting to speculate that this represents another progeroid syndrome"
    explanation: The progeroid framing is explicitly provisional.
- discussion_id: recon_natural_history_gap
  prompt: >-
    What are the adult course, cancer risk, lifespan and surveillance needs in
    RECON syndrome, and do other RECQL alleles cause a broader phenotype?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - disease#RECON Progeroid Syndrome
  - genetic#RECQL
  rationale: >-
    Three children with one shared allele are the whole cohort, the oldest
    last examined at 14 years 9 months; no surveillance or management
    recommendations exist.
  evidence:
  - reference: PMID:36805074
    reference_title: "Discovery of a new hereditary RECQ helicase disorder RECON syndrome positions the replication stress response and genome homeostasis as centrally important processes in aging and age-related disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "all the patients are relatively young, such that many age-related deficits may not have had sufficient time to appear"
    explanation: The discovering group states the natural history is incomplete.
  - reference: PMID:35025765
    reference_title: "RECON syndrome is a genome instability disorder caused by mutations in the DNA helicase RECQL1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the range and severity of the clinical symptoms linked with RECQL1 dysfunction will only be properly determined following the identification of additional patients"
    explanation: The phenotype spectrum awaits further patients.
- discussion_id: recql_null_mouse_mismatch
  prompt: >-
    Why does Recql loss cause chromosome instability in mouse embryonic
    fibroblasts but no organismal phenotype, while a hypomorphic human allele
    causes a growth and progeroid syndrome?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - animal_models#Mus musculus
  - pathophysiology#Chromosomal Instability
  rationale: >-
    The cellular phenotype is conserved while the organismal one is not.
    Proposed explanations in the model paper are genetic background and
    redundancy; a hypomorphic allele could also behave differently from a null.
  evidence:
  - reference: PMID:17158923
    reference_title: "RECQL, a member of the RecQ family of DNA helicases, suppresses chromosomal instability."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Genetic background, functional redundancy, and perhaps other factors may protect the unstressed mouse from the types of abnormalities that might be expected from the severe chromosomal aberrations detected at the cellular level."
    explanation: The model authors state the mismatch and candidate explanations.
- discussion_id: recql_heterozygous_breast_cancer_claim
  prompt: >-
    Do heterozygous RECQL loss-of-function variants increase breast cancer
    risk? This is a separate gene-disease claim from RECON syndrome, not a
    feature of it.
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - genetic#RECQL
  rationale: >-
    Two 2015 studies reported an association, later studies disputed it, and
    ClinGen classifies RECQL with hereditary breast carcinoma as Disputed. No
    cancer has been reported in RECON syndrome patients or their heterozygous
    relatives, but that small observation neither supports nor excludes a
    carrier risk.
  evidence:
  - reference: PMID:25915596
    reference_title: "Germline RECQL mutations are associated with breast cancer susceptibility."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We conclude that RECQL is a breast cancer susceptibility gene."
    explanation: Original case-control report of the heterozygous association.
  - reference: PMID:35025765
    reference_title: "RECON syndrome is a genome instability disorder caused by mutations in the DNA helicase RECQL1."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "although this association has been disputed by several other groups"
    explanation: The RECON authors note subsequent studies disputing the association.
  - reference: PMID:35025765
    reference_title: "RECON syndrome is a genome instability disorder caused by mutations in the DNA helicase RECQL1."
    supports: NO_EVIDENCE
    evidence_source: HUMAN_CLINICAL
    snippet: "none of the heterozygous carriers of the p.A459S mutation in either family A or B has reported developing breast cancer"
    explanation: >-
      Too few carriers to bear on the claim; recorded so the observation is
      not mistaken for evidence either way.

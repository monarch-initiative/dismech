    term:
      id: hgnc:9948
      label: RECQL
  notes: >-
    Only one disease-causing allele is known, NM_032941.2:c.1375G>T
    p.(Ala459Ser), in the zinc-binding domain, found homozygous in two families
    not known to be related. It is absent from gnomAD and the Greater Middle
    East variome. Whether null or other RECQL alleles produce the same or a
    more severe phenotype is unknown.
  evidence:
  - reference: PMID:35025765
    reference_title: "RECON syndrome is a genome instability disorder caused by mutations in the DNA helicase RECQL1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The affected individuals had short stature, progeroid facial features, a hypoplastic nose, xeroderma, and skin photosensitivity and were homozygous for the same missense mutation in RECQL1"
    explanation: Gene discovery report of the homozygous RECQL variant in affected individuals.
  - reference: PMID:35025765
    reference_title: "RECON syndrome is a genome instability disorder caused by mutations in the DNA helicase RECQL1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "this variant is not found in the gnomAD or Greater Middle East (GME) variome databases"
    explanation: Absence from population databases supports a rare pathogenic allele.
  - reference: PMID:35025765
    reference_title: "RECON syndrome is a genome instability disorder caused by mutations in the DNA helicase RECQL1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

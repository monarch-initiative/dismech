      label: Autosomal recessive inheritance
  description: >-
    All three affected individuals were homozygous for RECQL p.Ala459Ser,
    while available parents and eight unaffected siblings were heterozygous or
    wild type. Family A parents were double first cousins; family B reported no
    known consanguinity. No recurrence-risk figure has been published for this
    disease specifically.
  evidence:

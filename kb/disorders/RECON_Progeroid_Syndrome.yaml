diagnosis:
- name: RECQL molecular genetic testing
  description: >-
    The disease was identified by exome sequencing of the family A proband and
    confirmed by Sanger segregation analysis; family B was identified by
    clinical resemblance. No diagnostic criteria have been published, and the
    cellular assays used in the discovery study are research tools, not
    clinical tests.
  diagnosis_term:
    preferred_term: exome sequencing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  evidence:
  - reference: PMID:35025765
    reference_title: "RECON syndrome is a genome instability disorder caused by mutations in the DNA helicase RECQL1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To identify the genetic cause of the disorder found in family A, we performed whole-exome sequencing on DNA from the proband (III-2) of family A."
    explanation: Exome sequencing identified the causal variant.
differential_diagnoses:
- name: Werner syndrome
  disease_term:
    preferred_term: Werner syndrome
    term:
      id: MONDO:0010196
      label: Werner syndrome
  description: >-
    WRN-related progeroid syndrome. The progeroid face, growth deficiency and
    muscle wasting resemble it, and the cellular fork-restart and degradation
    defects are closest to those of WRN-deficient cells. Werner syndrome
    presents later, with loss of the adolescent growth spurt.
  distinguishing_features:
  - Growth failure evident in early childhood favors RECON syndrome.
  - Absence of the pubertal growth spurt as the first sign favors Werner syndrome.
  evidence:
  - reference: PMID:35025765
    reference_title: "RECON syndrome is a genome instability disorder caused by mutations in the DNA helicase RECQL1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the progeroid-like facial appearance, growth retardation, and muscle wasting are somewhat reminiscent of WS"
    explanation: The discovering authors draw the Werner comparison.
  - reference: PMID:36805074
    reference_title: "Discovery of a new hereditary RECQ helicase disorder RECON syndrome positions the replication stress response and genome homeostasis as centrally important processes in aging and age-related disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "the lack of a growth spurt, that usually occurs during the teenage years, is only observed in patients with WS"
    explanation: Distinguishing growth pattern.

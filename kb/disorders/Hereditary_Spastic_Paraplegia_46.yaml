animal_models:
- name: Gba2 knockout mouse
  species: Mouse
  genotype: Gba2 -/-
  publication: PMID:17080196
  description: >
    Gba2-null mice accumulate glucosylceramide in brain, testis, and liver and
    show globozoospermia and impaired male fertility, establishing GBA2 as a
    glucosylceramidase whose loss causes a non-lysosomal (ER) glucolipid storage
    disease. The model recapitulates the storage and male-infertility arms; overt
    neurological signs were not observed, a translational limitation.
  modeled_mechanisms:
  - target: Glucosylceramide Accumulation and Glycosphingolipid Dyshomeostasis
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: Demonstrates non-lysosomal glucosylceramide storage on GBA2 loss.
    limitations: >
      Knockout mice accumulate glucosylceramide but do not develop the overt
      spastic/ataxic neurological phenotype seen in humans, so the model captures
      the biochemical storage step better than the neurodegenerative one.
    evidence:
    - reference: PMID:17080196
      reference_title: "Mutation of beta-glucosidase 2 causes glycolipid storage disease and impaired male fertility."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Glycolipids, identified as glucosylceramides by mass spectrometry, accumulated in the testes, brains, and livers of the knockout mice but did not cause obvious neurological symptoms"
      explanation: Reports the glucosylceramide storage phenotype and its neurological limitation in the model.
- name: Zebrafish gba2 morpholino knockdown
  species: Zebrafish
  genotype: gba2 morpholino knockdown
  publication: PMID:23332916
  description: >
    Antisense morpholino knockdown of the zebrafish gba2 ortholog produces
    abnormal motor behavior and axonal shortening/branching of motoneurons,
    rescued by wild-type human GBA2 mRNA but not by mRNA carrying the disease
    missense variant, providing functional evidence that GBA2 loss of function
    causes the motor axon phenotype.
  modeled_mechanisms:
  - target: Corticospinal Tract Axonal Degeneration
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: Recapitulates motor-axon degeneration on GBA2 loss with wild-type-specific rescue.
    limitations: >
      Zebrafish motoneuron morphology is a proxy for the human corticospinal
      tract; morpholino knockdown is transient and not a stable genetic model.
    evidence:
    - reference: PMID:23332916
      reference_title: "Loss of function of glucocerebrosidase GBA2 is responsible for motor neuron defects in hereditary spastic paraplegia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "abnormal motor behavior and axonal shortening/branching of motoneurons that were rescued by the human wild-type mRNA but not by applying the same mRNA containing the missense mutation"
      explanation: Wild-type-specific rescue establishes GBA2 loss of function as the cause of the motor axon defect.
notes: >
  SPG46 sits within the GBA2-deficiency clinical spectrum, which also includes
  autosomal recessive cerebellar ataxia with spasticity and a Marinesco-Sjogren-like
  syndrome; the same biallelic GBA2 variants can present at any point on this
  spectrum. GBA2 (non-lysosomal glucosylceramidase) is distinct from lysosomal
  GBA1, whose deficiency causes Gaucher disease and is a Parkinson disease risk
  factor. The deep-research report used to draft this entry mislabeled several
  ontology CURIEs (GBA2 as HGNC:4193, which is GCH1; glucosylceramide as
  CHEBI:37683, which is mannopyranose; motor neuron as CL:0000099, an interneuron;
  hypogonadism as HP:0000028, cryptorchidism); all bindings here were verified
  against the source ontologies.

  No GeneReviews chapter specifically covers SPG46 (the pure-HSP GeneReviews
  overview does not address this complex HSP), so no GeneReviews baseline was
  used; the 2024 Italian case series and review (PMID:38334933) is the closest
  comprehensive source.

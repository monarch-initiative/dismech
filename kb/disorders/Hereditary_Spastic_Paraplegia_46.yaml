name: Hereditary Spastic Paraplegia 46
creation_date: "2026-09-03T13:52:01Z"
category: Mendelian
synonyms:
- SPG46
- spastic paraplegia 46, autosomal recessive
- autosomal recessive spastic paraplegia type 46
- GBA2-related complex hereditary spastic paraplegia
- autosomal recessive cerebellar ataxia with spasticity (GBA2)
description: >
  Hereditary spastic paraplegia 46 (SPG46) is a rare, early-onset, autosomal
  recessive complex form of hereditary spastic paraplegia caused by biallelic
  loss-of-function variants in GBA2, the gene encoding the non-lysosomal
  glucosylceramidase beta 2. GBA2 hydrolyzes glucosylceramide to ceramide and
  glucose at the cytosolic face of the endoplasmic reticulum and Golgi; when it
  is lost, glucosylceramide accumulates outside the lysosome and glycosphingolipid
  homeostasis is disturbed, producing a glucosylceramide storage state that
  impairs corticospinal tract and cerebellar circuit development and maintenance.

  Clinically SPG46 is dominated by slowly progressive spastic paraparesis of the
  lower limbs, frequently combined with cerebellar ataxia, cognitive impairment,
  early cataract, and, in males, hypogonadism and infertility. Thinning of the
  corpus callosum with mild cerebral and cerebellar atrophy is a characteristic
  neuroimaging finding. Because GBA2 deficiency spans a clinical spectrum, the
  same variants have been reported under the labels complex HSP, autosomal
  recessive cerebellar ataxia with spasticity, and a Marinesco-Sjogren-like
  syndrome; SPG46 is the HSP-predominant pole of that spectrum. About thirty
  families have been described worldwide. There is no disease-modifying therapy;
  management is symptomatic.

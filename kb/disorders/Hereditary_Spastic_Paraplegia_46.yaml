inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >
    SPG46 is inherited in an autosomal recessive manner; affected individuals
    carry biallelic (homozygous or compound heterozygous) GBA2 variants, often
    in consanguineous families.
  evidence:
  - reference: PMID:23332916
    reference_title: "Loss of function of glucocerebrosidase GBA2 is responsible for motor neuron defects in hereditary spastic paraplegia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified four different mutations in GBA2 (three truncating variants and one missense variant), which were found to cosegregate with the disease and were absent in controls"
    explanation: Cosegregation of biallelic GBA2 variants with disease in three families supports autosomal recessive inheritance.
genetic:
- name: GBA2
  gene_term:
    preferred_term: GBA2
    term:
      id: hgnc:18986
      label: GBA2
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >
    Biallelic loss-of-function GBA2 variants cause SPG46. Reported alleles
    include nonsense variants (p.Tyr121*, p.Arg340*), frameshift variants
    (p.Met510Valfs*17), splice-site variants (c.452-1G>C), and missense
    substitutions in the six-hairpin glycosidase-like catalytic domain
    (p.Arg873His, p.Asp594His). Enzyme assays in patient blood cells show
    absent or drastically reduced GBA2 glucosylceramidase activity.
  evidence:
  - reference: PMID:23332917
    reference_title: "Mutations in GBA2 cause autosomal-recessive cerebellar ataxia with spasticity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We were able to identify mutations responsible for autosomal-recessive ataxia in these families within the gene encoding β-glucosidase 2, GBA2."
    explanation: Identifies biallelic GBA2 mutations as the cause of the recessive disease.
pathophysiology:
- name: GBA2 Loss of Function
  biological_scale: MOLECULAR
  description: >
    Biallelic loss-of-function GBA2 variants abolish or drastically reduce the
    activity of non-lysosomal glucosylceramidase beta 2, an ER/Golgi membrane
    enzyme that hydrolyzes glucosylceramide to ceramide and glucose. Missense
    variants in the catalytic domain and truncating variants both yield
    nonfunctional enzyme; no residual GBA2 glucocerebrosidase activity is
    detectable in blood cells of homozygous patients.
  genetic_context:
    allele_type: SNV
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  molecular_functions:
  - preferred_term: glucosylceramidase activity
    term:
      id: GO:0004348
      label: glucosylceramidase activity
    modifier: LOSS_OF_FUNCTION
  downstream:
  - target: Glucosylceramide Accumulation and Glycosphingolipid Dyshomeostasis
    causal_link_type: DIRECT
    description: Loss of the enzyme that degrades glucosylceramide leads to its accumulation and disturbed glycosphingolipid balance.
    evidence:
    - reference: PMID:23332916
      reference_title: "Loss of function of glucocerebrosidase GBA2 is responsible for motor neuron defects in hereditary spastic paraplegia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The missense variant was also found at the homozygous state in a simplex subject in whom no residual glucocerebrosidase activity of GBA2 could be evidenced in blood cells"
      explanation: Documents complete loss of GBA2 enzymatic activity, the initiating molecular lesion feeding into substrate accumulation.
- name: Glucosylceramide Accumulation and Glycosphingolipid Dyshomeostasis
  biological_scale: MOLECULAR
  description: >
    With GBA2 activity lost, glucosylceramide accumulates at the cytosolic face
    of the ER and Golgi and outside the lysosome, and the broader glycosphingolipid
    profile is perturbed. In GBA2-deficient mice, glucosylceramide accumulates in
    brain, testis, and liver; in patients, reduced GBA2 activity raises
    glucosylceramide to levels comparable with Gaucher disease, defining a
    non-lysosomal glucosylceramide storage state.
  biological_processes:
  - preferred_term: glycosphingolipid metabolic process
    term:
      id: GO:0006687
      label: glycosphingolipid metabolic process
    modifier: DECREASED
  downstream:
  - target: Impaired Neuronal Membrane and Cytoskeletal Dynamics
    causal_link_type: DIRECT
    description: Altered sphingolipid composition perturbs membrane microdomains and cytoskeletal organization in neurons.
    evidence:
    - reference: PMID:28052128
      reference_title: "GBA2 Mutations Cause a Marinesco-Sjögren-Like Syndrome: Genetic and Biochemical Studies."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Our studies show that a reduced activity of GBA2 is sufficient to elevate the levels of glucosylceramide to similar levels as seen in Gaucher disease."
      explanation: Establishes glucosylceramide storage in patients as the substrate-level consequence driving downstream cellular dysfunction.
  - target: Cataract
    causal_link_type: DIRECT
    description: Systemic non-lysosomal glucosylceramide storage extends to the lens, producing early cataract.
  - target: Hypogonadism
    causal_link_type: DIRECT
    description: Glucosylceramide storage in the testis (globozoospermia in the mouse model) underlies male hypogonadism and infertility.
- name: Impaired Neuronal Membrane and Cytoskeletal Dynamics
  biological_scale: CELLULAR
  description: >
    Disturbed glycosphingolipid composition alters membrane microdomain
    organization and cytoskeletal dynamics. In Gba2-null mice, non-lysosomal
    glucosylceramide accumulation disrupts microtubule and F-actin organization
    during spermiogenesis (globozoospermia); by inference the same membrane and
    cytoskeletal perturbation impairs axonal growth in neurons. In a zebrafish
    model, gba2 knockdown causes axonal shortening and aberrant branching of
    motoneurons, rescued by wild-type but not mutant human GBA2.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: axonogenesis
    term:
      id: GO:0007409
      label: axonogenesis
    modifier: DECREASED
  downstream:
  - target: Corticospinal Tract Axonal Degeneration
    causal_link_type: DIRECT
    description: Defective axonal growth and maintenance in the long corticospinal motor axons.
    evidence:
    - reference: PMID:23332916
      reference_title: "Loss of function of glucocerebrosidase GBA2 is responsible for motor neuron defects in hereditary spastic paraplegia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Antisense morpholino oligonucleotides targeting the zebrafish GBA2 orthologous gene led to abnormal motor behavior and axonal shortening/branching of motoneurons that were rescued by the human wild-type mRNA but not by applying the same mRNA containing the missense mutation."
      explanation: Directly links GBA2 loss to motor axon defects, the cellular basis of corticospinal degeneration.
  - target: Peripheral neuropathy
    causal_link_type: DIRECT
    description: The same neuronal sphingolipid disturbance affects peripheral axons, producing peripheral neuropathy.
  - target: Cerebellar Circuit Dysfunction
    causal_link_type: DIRECT
    description: The same neuronal sphingolipid/cytoskeletal disturbance impairs cerebellar circuitry.
    evidence:
    - reference: PMID:23332917
      reference_title: "Mutations in GBA2 cause autosomal-recessive cerebellar ataxia with spasticity."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This study suggests GBA2 mutations are a cause of recessive spastic ataxia and responsible for a form of glucosylceramide storage disease in humans."
      explanation: Attributes the cerebellar (ataxic) arm of the phenotype to GBA2-related glucosylceramide storage.
- name: Corticospinal Tract Axonal Degeneration
  biological_scale: TISSUE
  description: >
    Length-dependent degeneration of the corticospinal upper motor neuron axons
    produces the pyramidal signs of SPG46. Neuroimaging shows thinning of the
    corpus callosum and mild cerebral atrophy, consistent with involvement of
    long central motor and commissural fibers.
  cell_types:
  - preferred_term: upper motor neuron (pyramidal)
    term:
      id: CL:0000598
      label: pyramidal neuron
  downstream:
  - target: Spastic paraparesis
    causal_link_type: DIRECT
    description: Upper motor neuron degeneration produces lower-limb spasticity and weakness.
- name: Cerebellar Circuit Dysfunction
  biological_scale: TISSUE
  description: >
    Cerebellar involvement, with cerebellar atrophy on imaging, produces the
    ataxic component of the SPG46 spectrum, most prominent in families originally
    labeled as autosomal recessive cerebellar ataxia with spasticity.
  cell_types:
  - preferred_term: Purkinje cell
    term:
      id: CL:0000121
      label: Purkinje cell
  downstream:
  - target: Cerebellar ataxia
    causal_link_type: DIRECT
    description: Cerebellar circuit dysfunction produces gait and limb ataxia.

prevalence:
- population: Denmark, January 1, 2011
  measure_type: POINT_PREVALENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 1.6
  notes: >-
    This estimate is restricted to molecularly confirmed XLHED. The broader
    registry-and-algorithm estimate included clinically diagnosed or possible HED
    and is not used as an XLHED-specific prevalence rate.
  evidence:
  - reference: PMID:23416623
    reference_title: "The prevalence of X-linked hypohidrotic ectodermal dysplasia (XLHED) in Denmark, 1995-2010."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The prevalence was 21.9 per 100,000 overall and 1.6 per 100,000 when
      restricting to molecularly-confirmed XLHED cases.
    explanation: >-
      Provides the point-prevalence estimate for molecularly confirmed XLHED in
      the Danish population.
progression:
- phase: Infancy to childhood recognition
  age_range: Infancy through childhood
  notes: >-
    The ectodermal defects are congenital, but the cardinal triad often becomes
    clinically obvious during childhood. Before families learn temperature-control
    measures, markedly deficient sweating can cause episodes of hyperthermia.
  evidence:
  - reference: PMID:20301291
    reference_title: Hypohidrotic Ectodermal Dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The cardinal features of classic HED become obvious during childhood. The
      scalp hair is thin, lightly pigmented, and slow growing. Sweating, although
      present, is greatly deficient, leading to episodes of hyperthermia until the
      affected individual or family acquires experience with environmental
      modifications to control temperature.
    explanation: >-
      GeneReviews describes childhood recognition and the early hyperthermia-prone
      phase before environmental adaptations are established.
- phase: Lifelong complications
  age_range: Childhood through adulthood
  notes: >-
    Dental and appendage abnormalities persist, while respiratory, nasal, skin,
    and voice complications can require continuing supportive care across life.
  evidence:
  - reference: PMID:24664614
    reference_title: "X-linked hypohidrotic ectodermal dysplasia (XLHED): clinical and diagnostic insights from an international patient registry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the registry dataset confirmed a spectrum of life-long XLHED clinical
      complications including recurrent sinus infections (49% males, 52% females),
      nasal congestion often foul smelling and interfering with feeding (73% males,
      27% females), eczema (66% males, 40% females), wheezing (66% males, 45%
      females), and a hoarse, raspy voice (67% males, 23% females).
    explanation: >-
      Registry data document persistent multisystem complications across the
      lifespan and quantify several common manifestations.
inheritance:
- name: X-linked
  description: >-
    EDA-related HED is inherited in an X-linked manner. Hemizygous males who
    inherit the familial pathogenic variant are affected; heterozygous females
    may manifest ectodermal-dysplasia features.
  inheritance_term:
    preferred_term: X-linked inheritance
    term:
      id: HP:0001417
      label: X-linked inheritance
  evidence:
  - reference: PMID:20301291
    reference_title: Hypohidrotic Ectodermal Dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      EDA-related HED is inherited in an X-linked manner.
    explanation: >-
      GeneReviews directly establishes the inheritance mode of EDA-related HED.
  - reference: PMID:20301291
    reference_title: Hypohidrotic Ectodermal Dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      If the mother of a proband is heterozygous for an EDA pathogenic variant,
      the chance of the mother transmitting it in each pregnancy is 50%. If the
      father of the proband has an EDA pathogenic variant, he will transmit it to
      all his daughters and none of his sons. Males who inherit the pathogenic
      variant will be affected; females who inherit the pathogenic variant will
      be heterozygous and may show manifestations of ectodermal dysplasia.
    explanation: >-
      Defines transmission risks and sex-dependent manifestations for X-linked HED.
  - reference: PMID:21357618
    reference_title: Sweating ability and genotype in individuals with X-linked hypohidrotic ectodermal dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In all 5 heterozygous females, some sweat was detected, but generally less
      than in female controls.
    explanation: >-
      Objective sweat testing documents manifestations in heterozygous females,
      supporting the broader X-linked term rather than an assertion that female
      heterozygotes are uniformly unaffected.
pathophysiology:
- name: EDA Ligand Deficiency
  description: >-
    Pathogenic EDA variants cause complete or partial deficiency of ectodysplasin
    A1, removing the extracellular ligand that normally activates EDAR during
    ectodermal-appendage development.

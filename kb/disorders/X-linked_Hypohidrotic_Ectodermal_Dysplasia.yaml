    evidence_source: HUMAN_CLINICAL
    snippet: >-
      X-linked hypohidrotic ectodermal dysplasia (XLHED), caused by a genetic
      deficiency of ectodysplasin A1 (EDA1), is a rare developmental disorder of
      ectodermal derivatives such as hair, sweat glands, and teeth.
    explanation: >-
      Directly identifies EDA1 deficiency as the initiating molecular lesion in XLHED.
  downstream:

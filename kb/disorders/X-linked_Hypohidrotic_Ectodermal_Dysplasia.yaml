    reference_title: Hypohidrotic Ectodermal Dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Classic HED can be diagnosed after infancy based on physical features in most
      affected individuals.
    explanation: >-
      GeneReviews establishes the usual clinical diagnostic route and its timing.
- name: Molecular Confirmation of EDA-Related XLHED
  description: >-
    Identification of a hemizygous pathogenic EDA variant confirms XLHED in an
    affected male and distinguishes it from phenotypically overlapping HED caused
    by EDAR, EDARADD, or WNT10A.
  diagnosis_term:
    preferred_term: Molecular Analysis
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  evidence:
  - reference: PMID:20301291
    reference_title: Hypohidrotic Ectodermal Dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Identification of a hemizygous EDA pathogenic variant in an affected male or
      biallelic EDAR, EDARADD, or WNT10A pathogenic variants in an affected male or
      female confirms the diagnosis.
    explanation: >-
      Defines the molecular confirmation criterion and the major alternative genes.
- name: Phenotype-Guided Molecular Testing and EDA Copy-Number Findings
  description: >-
    In a small mixed ectodermal-dysplasia cohort, classic symptoms supported targeted
    EDA/EDAR sequencing, whereas whole-exome sequencing was considered effective when
    those symptoms were absent. Copy-number variations occurred in 23.1% (3/13) of
    EDA-positive cases, showing that the reported EDA-positive molecular findings were
    not limited to sequence variants. This cohort-specific proportion is not an XLHED
    population prevalence estimate.
  diagnosis_term:
    preferred_term: Molecular Analysis
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  evidence:
  - reference: PMID:39244550
    reference_title: Genetic profiling and diagnostic strategies for patients with ectodermal dysplasias in Korea.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Notably, 23.1% (3/13) of EDA-positive cases exhibited copy number variations.
    explanation: >-
      Demonstrates that EDA-positive findings in this cohort included copy-number
      variation as well as sequence variants.
  - reference: PMID:39244550
    reference_title: Genetic profiling and diagnostic strategies for patients with ectodermal dysplasias in Korea.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      When conducting molecular diagnostics for ED, opting for targeted sequencing
      of EDA/EDAR mutations is advisable for cases with classical symptoms, while WES
      is deemed an effective strategy for cases in which these symptoms are absent.
    explanation: >-
      Supports targeted EDA/EDAR testing with classical symptoms and whole-exome
      sequencing when those symptoms are absent.
- name: Quantitative Sweat-Gland Function Assessment
  description: >-
    Pilocarpine-induced sweat volume, palmar sweat-pore density, and basal and
    stimulated skin conductance can objectively quantify sweat-gland dysfunction.
    These measurements are useful supportive biomarkers but do not determine the
    causal gene.
  evidence:
  - reference: PMID:21357618
    reference_title: Sweating ability and genotype in individuals with X-linked hypohidrotic ectodermal dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In 36 genotyped XLHED patients and 29 control subjects aged 0-57 years,
      pilocarpine-induced sweat volume, palmar sweat pore density, and palmar skin
      conductance before and after stimulation were determined.
    explanation: >-
      Specifies three noninvasive quantitative measures evaluated in genotyped XLHED.
  - reference: PMID:21357618
    reference_title: Sweating ability and genotype in individuals with X-linked hypohidrotic ectodermal dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      this study confirmed a consistent, quantifiable defect of sweat gland function
      in male XLHED subjects as a disease biomarker.
    explanation: >-
      Supports quantitative sweat-gland dysfunction as an objective disease biomarker.
differential_diagnoses:
- name: Autosomal Hypohidrotic Ectodermal Dysplasia
  description: >-
    EDAR-, EDARADD-, and WNT10A-related HED can reproduce the classic hair, sweat,
    and dental triad and may be clinically indistinguishable from XLHED.
  distinguishing_features:
  - Biallelic EDAR, EDARADD, or WNT10A pathogenic variants support autosomal recessive HED rather than EDA-related XLHED.
  - Heterozygous EDAR, EDARADD, or WNT10A variants can establish mild autosomal HED.
  - A pedigree with father-to-son transmission excludes X-linked inheritance.
  evidence:
  - reference: PMID:20301291
    reference_title: Hypohidrotic Ectodermal Dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Identification of a hemizygous EDA pathogenic variant in an affected male or
      biallelic EDAR, EDARADD, or WNT10A pathogenic variants in an affected male or
      female confirms the diagnosis. The diagnosis of mild HED is established in a
      female by identification of a heterozygous EDA, EDAR, EDARADD, or WNT10A
      pathogenic variant. The diagnosis of mild HED is established in a male by
      identification of a heterozygous EDAR, EDARADD, or WNT10A pathogenic variant.
    explanation: >-
      GeneReviews defines the overlapping genetic diagnoses and the variant states
      that distinguish them.
- name: IKBKG-Related Immunodeficiency With or Without Ectodermal Dysplasia
  disease_term:
    preferred_term: IKBKG-related immunodeficiency with or without ectodermal dysplasia
    term:
      id: MONDO:0100162
      label: IKBKG-related immunodeficiency with or without ectodermal dysplasia
  description: >-
    Hypomorphic IKBKG (NEMO) variants can cause an X-linked ectodermal-dysplasia
    phenotype through impaired NF-kappaB signaling, overlapping XLHED clinically
    and mechanistically, but with clinically important immunodeficiency.
  distinguishing_features:
  - Dysgammaglobulinemia and severe or recurrent infections favor IKBKG-related disease.
  - A pathogenic IKBKG variant, rather than an EDA variant, establishes this diagnosis.
  evidence:
  - reference: PMID:11047757
    reference_title: A novel X-linked disorder of immune deficiency and hypohidrotic ectodermal dysplasia is allelic to incontinentia pigmenti and due to mutations in IKK-gamma (NEMO).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Affected males manifest dysgammaglobulinemia and, despite therapy, have
      significant morbidity and mortality from recurrent infections.
    explanation: >-
      Identifies the immune phenotype that distinguishes IKBKG-related HED-ID from XLHED.
  - reference: PMID:11047757
    reference_title: A novel X-linked disorder of immune deficiency and hypohidrotic ectodermal dysplasia is allelic to incontinentia pigmenti and due to mutations in IKK-gamma (NEMO).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The findings define a new X-linked recessive immunodeficiency syndrome,
      distinct from other types of HED and immunodeficiency syndromes.
    explanation: >-
      Establishes HED-ID as a distinct X-linked immunodeficiency syndrome.

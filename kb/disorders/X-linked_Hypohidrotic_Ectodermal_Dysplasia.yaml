name: X-linked Hypohidrotic Ectodermal Dysplasia
creation_date: "2026-04-24T00:00:00Z"
description: >-
  X-linked hypohidrotic ectodermal dysplasia (XLHED, Christ-Siemens-Touraine syndrome)
  is an X-linked disorder caused by pathogenic variants in EDA, which encodes the
  TNF-superfamily ligand ectodysplasin A. Deficient EDA-EDAR-EDARADD signaling reduces
  canonical NF-kappaB activation, disrupting ectodermal placode formation and the
  morphogenesis of hair follicles, teeth, eccrine sweat glands, and other secretory glands.
  Affected males typically have the classic triad of hypohidrosis, sparse hair, and
  hypodontia, often with conical teeth. Heterozygous females may show variable, usually
  milder manifestations. Markedly deficient sweating creates a risk of life-threatening
  hyperthermia, particularly in infancy and early childhood. In a Danish population study,
  molecularly confirmed XLHED had a point prevalence of 1.6 per 100,000.
category: Genetic
parents:
- Ectodermal Dysplasia

genetic:
- name: EDA Pathogenic Variants
  gene_term:
    preferred_term: EDA
    term:
      id: hgnc:3157
      label: EDA
  association: Causative
  relationship_type: CAUSATIVE
  inheritance:
  - name: X-linked
    inheritance_term:
      preferred_term: X-linked inheritance
      term:
        id: HP:0001417
        label: X-linked inheritance
  notes: >-
    Identification of a hemizygous pathogenic EDA variant confirms XLHED in an
    affected male. Heterozygous females can have manifestations. EDA alleles differ
    functionally: some genotypes are consistently associated with anhidrosis, whereas
    others retain enough EDA activity to permit measurable sweating. The entry does
    not assign variant-class frequencies because broad HED cohorts include genetically
    distinct EDAR- and EDARADD-related disease.
  variants:
  - name: EDA alleles with absent versus residual activity
    description: >-
      Genotype-phenotype mapping in molecularly confirmed XLHED distinguishes EDA
      mutations consistently associated with anhidrosis from mutations that allow
      residual EDA-product activity and reduced, but detectable, sweating.
  evidence:
  - reference: PMID:29855039
    reference_title: "Hypohidrotic ectodermal dysplasia: clinical and molecular review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This XL-HED phenotype is associated with mutations in the gene encoding the
      transmembrane protein ectodysplasin-1 (EDA1), a member of the TNFα-related
      signaling pathway. The proteins from this pathway are involved in signal
      transduction from ectoderm to mesenchyme leading to the development of
      ectoderm-derived structures in the fetus such as hair, teeth, skin, nails, and
      eccrine sweat glands.
    explanation: >-
      Identifies EDA1 as the causative gene encoding a TNF-family protein essential
      for ectodermal appendage development.
  - reference: PMID:20301291
    reference_title: Hypohidrotic Ectodermal Dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Identification of a hemizygous EDA pathogenic variant in an affected male or
      biallelic EDAR, EDARADD, or WNT10A pathogenic variants in an affected male or
      female confirms the diagnosis.
    explanation: >-
      GeneReviews distinguishes EDA-confirmed XLHED from phenotypically overlapping
      HED caused by other genes.
  - reference: PMID:21357618
    reference_title: Sweating ability and genotype in individuals with X-linked hypohidrotic ectodermal dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among 26 different EDA genotypes, specific mutations were shown to be
      consistently associated with anhidrosis, implying that systematic mapping of
      EDA mutations together with the analysis of objective clinical data may help
      to distinguish functionally crucial mutations from those allowing residual
      activity of the gene product.
    explanation: >-
      Demonstrates an allelic severity spectrum in which some EDA mutations abolish
      sweating and others preserve residual gene-product activity.
treatments:
- name: Temperature Control and Hyperthermia Prevention
  description: >-
    Maintain access to water and a cool environment during hot weather, avoid
    extreme heat, and teach families to recognize and respond promptly to
    overheating. These measures are especially important in infancy and childhood.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747

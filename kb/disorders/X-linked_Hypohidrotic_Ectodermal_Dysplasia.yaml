    causal_link_type: DIRECT
    evidence:
    - reference: PMID:24070496
      reference_title: "The ectodysplasin pathway: from diseases to adaptations."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        It comprises three main gene products: EDA, a ligand that belongs to the tumor
        necrosis factor (TNF)-α family, EDAR, a receptor related to the TNFα receptors,
        and EDARADD, a specific adaptor. This core pathway relies on downstream NF-κB
        pathway activation to regulate target genes.
      explanation: >-
        Places EDA directly upstream of EDAR, EDARADD, and NF-kappaB activation.
- name: EDA-EDAR-EDARADD Canonical NF-kappaB Signaling Failure
  conforms_to: "eda_edar_nfkb_ectodermal_appendage#EDA-EDAR-EDARADD Canonical NF-kappaB Signaling Failure"
  description: >-
    EDA ligand deficiency prevents effective EDAR activation and EDARADD-dependent
    signaling, reducing canonical NF-kappaB transcriptional activity in developing
    surface ectoderm. This also disrupts downstream Wnt, SHH, FGF, and TGF-beta
    pathway effectors involved in epithelial-mesenchymal interactions.

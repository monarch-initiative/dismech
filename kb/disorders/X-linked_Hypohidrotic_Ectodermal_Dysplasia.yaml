    explanation: >-
      GeneReviews specifies nasal, ocular, and respiratory supportive measures.
- name: Prenatal EDA1 Replacement Therapy
  description: >-
    Investigational intra-amniotic recombinant EDA1 replacement has restored sweat
    gland development and inducible sweating in a small compassionate-use series.
    Six prenatally treated boys have been reported, with normal perspiration persisting
    for six years in the two oldest repeatedly treated participants; this remains an
    investigational approach under prospective study, not routine standard care.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: EDA Ligand Deficiency
    treatment_effect: RESTORES
    description: >-
      Recombinant Fc-EDA supplies the missing ligand during the fetal developmental
      window when ectodermal appendages are being specified.
    evidence:
    - reference: PMID:37108325
      reference_title: "A Causal Treatment for X-Linked Hypohidrotic Ectodermal Dysplasia: Long-Term Results of Short-Term Perinatal Ectodysplasin A1 Replacement."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We previously treated nine male patients with obvious signs of XLHED with a
        recombinant EDA1 replacement protein, Fc-EDA, either shortly after birth (n =
        3) or by prenatal administration in gestational week 26 and beyond (n = 6).
      explanation: >-
        Directly identifies Fc-EDA as recombinant replacement of the deficient EDA1 ligand.
  evidence:
  - reference: PMID:29694819
    reference_title: "Prenatal Correction of X-Linked Hypohidrotic Ectodermal Dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We administered this protein intraamniotically to two affected human twins
      at gestational weeks 26 and 31 and to a single affected human fetus at
      gestational week 26; the infants, born in week 33 (twins) and week 39
      (singleton), were able to sweat normally, and XLHED-related illness had not
      developed by 14 to 22 months of age.
    explanation: >-
      Landmark NEJM study demonstrating successful prenatal correction of XLHED
      sweat gland deficiency by intra-amniotic EDA1 replacement.
  - reference: PMID:37108325
    reference_title: "A Causal Treatment for X-Linked Hypohidrotic Ectodermal Dysplasia: Long-Term Results of Short-Term Perinatal Ectodysplasin A1 Replacement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      prenatal EDA1 replacement resulted in ample sweat gland development and
      pilocarpine-inducible sweating in all treated subjects, who also attained more
      permanent teeth than their untreated affected relatives. Normal perspiration
      has persisted for six years in the two oldest boys treated repeatedly with
      Fc-EDA in utero.
    explanation: >-
      Long-term follow-up confirming permanent correction of sweating ability
      after prenatal EDA1 replacement, with additional dental benefit.
  notes: >-
    Evidence is limited to small nonrandomized treated cohorts. The 2023 follow-up
    reports patent holdings and research funding related to the intervention.
- name: Genetic Counseling
  description: >-
    Explain X-linked transmission after identifying the familial EDA variant. A
    heterozygous mother has a 50% chance of transmitting the variant in each
    pregnancy; sons who inherit it are affected, while daughters who inherit it are
    heterozygous and may manifest features. An affected father transmits the variant
    to all daughters and no sons. Prenatal and preimplantation testing are possible
    once the familial variant is known.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:20301291
    reference_title: Hypohidrotic Ectodermal Dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      If the mother of a proband is heterozygous for an EDA pathogenic variant,
      the chance of the mother transmitting it in each pregnancy is 50%. If the
      father of the proband has an EDA pathogenic variant, he will transmit it to
      all his daughters and none of his sons. Males who inherit the pathogenic
      variant will be affected; females who inherit the pathogenic variant will be
      heterozygous and may show manifestations of ectodermal dysplasia.
    explanation: >-
      GeneReviews provides the correct per-pregnancy transmission and sex-specific risks.
  - reference: PMID:20301291
    reference_title: Hypohidrotic Ectodermal Dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Once the EDA, EDAR, EDARADD, or WNT10A pathogenic variant(s) have been
      identified in an affected family member, prenatal and preimplantation genetic
      testing for HED are possible.
    explanation: >-
      Supports reproductive testing after molecular identification of the familial variant.
diagnosis:
- name: Clinical Diagnosis After Infancy
  description: >-
    Classic HED can usually be recognized after infancy from the combination of
    deficient sweating, sparse hair, and absent or abnormally shaped teeth.
  diagnosis_term:
    preferred_term: Diagnostic Procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  evidence:

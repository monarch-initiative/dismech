      term:
        id: HP:0004322
        label: Short stature
    evidence:
      - reference: PMID:20301693
        reference_title: MERRF.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Common findings are ptosis, hearing loss, short stature, optic atrophy,
          cardiomyopathy, cardiac dysrhythmias such as Wolff-Parkinson-White
          syndrome, and peripheral neuropathy.
        explanation: >-
          Lists short stature among the common findings.
  - category: Laboratory
    name: Elevated creatine kinase
    description: >-
      Leakage of creatine kinase from damaged muscle fibers, a simple and
      frequently abnormal screening test in transfer RNA lysine carriers.
    phenotype_term:
      preferred_term: Elevated circulating creatine kinase concentration
      term:
        id: HP:0003236
        label: Elevated circulating creatine kinase concentration
    frequency: FREQUENT
    evidence:
      - reference: PMID:32577866
        reference_title: >-
          "Myo-neuropathy" is commonly associated with mitochondrial
          tRNA(Lysine) mutation.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          elevated creatine kinase levels (61.5%)
        explanation: >-
          Reports 61.5 percent in symptomatic carriers, within the FREQUENT band.
biochemical:
  - name: Blood and cerebrospinal fluid lactate
    presence: INCREASED
    context: >-
      Raised lactate reflects the shift to anaerobic metabolism when the
      respiratory chain cannot accept electrons. It is elevated at rest and rises
      further with exertion, but it is neither sensitive nor specific, and it is
      also raised in asymptomatic maternal relatives, so a value cannot be used to
      decide who is affected.
    biomarker_term:
      preferred_term: lactate
      term:
        id: CHEBI:24996
        label: lactate
    readouts:
      - target: Respiratory Chain Deficiency and Loss of Mitochondrial Membrane Potential
        relationship: READOUT_OF
        direction: POSITIVE
        endpoint_context: DIAGNOSTIC
        interpretation: >-
          Elevated lactate is the circulating readout of a blocked respiratory
          chain forcing pyruvate toward lactate.
    evidence:
      - reference: PMID:25337734
        reference_title: >-
          When should MERRF (myoclonus epilepsy associated with ragged-red fibers)
          be the diagnosis?
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          The lactic acid level in the blood and cerebrospinal fluid (CSF) is
          elevated at rest in patients with MERFF and can increase moderately
          after physical activity
        explanation: >-
          States directly that lactate is elevated at rest in both compartments and
          rises further with exertion. The source's own spelling of the acronym is
          preserved so the quote remains exact.
histopathology:
  - name: Ragged red fibers with cytochrome c oxidase deficient fibers
    description: >-
      Muscle biopsy shows a substantial proportion of ragged red fibers on Gomori
      trichrome, together with fibers lacking cytochrome c oxidase activity and
      strong succinate dehydrogenase reactivity, including in intramuscular blood
      vessels. The combination is the histological signature of a mitochondrially
      encoded translation defect, since succinate dehydrogenase is entirely
      nuclear-encoded and therefore spared.
    diagnostic: true
    evidence:
      - reference: PMID:25337734
        reference_title: >-
          When should MERRF (myoclonus epilepsy associated with ragged-red fibers)
          be the diagnosis?
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          the presence of vessels with a strong reaction for succinate
          dehydrogenase and COX deficiency
        explanation: >-
          Documents the vascular component of the histological pattern, which is
          part of what makes the biopsy appearance characteristic.
genetic:
  - name: MT-TK m.8344A>G
    gene_term:
      preferred_term: MT-TK
      term:
        id: hgnc:7489
        label: MT-TK
    relationship_type: CAUSATIVE
    association: >-
      The m.8344A>G variant in MT-TK, encoding mitochondrial transfer RNA-lysine,
      accounts for more than eight in ten typical MERRF cases. It is heteroplasmic
      and maternally transmitted, and the clinical expression depends on the
      mutant load in the affected tissue rather than on the variant itself.
    evidence:
      - reference: PMID:20301693
        reference_title: MERRF.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          The m.8344A>G pathogenic variant in the mitochondrial gene MT-TK is
          present in more than 80% of affected individuals with typical findings.
        explanation: >-
          Quantifies the share of MERRF attributable to this variant.
      - reference: PMID:25337734
        reference_title: >-
          When should MERRF (myoclonus epilepsy associated with ragged-red fibers)
          be the diagnosis?
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          It is estimated that point mutations in the tRNALys gene of the DNAmt,
          mainly A8344G, are responsible for almost 90% of MERRF cases.
        explanation: >-
          An independent estimate of the same fraction, from a clinical review.
  - name: MT-TF and other mitochondrial transfer RNA genes
    gene_term:
      preferred_term: MT-TF
      term:
        id: hgnc:7481
        label: MT-TF
    relationship_type: CAUSATIVE
    association: >-
      A minority of MERRF cases arise from variants in other mitochondrial
      transfer RNA genes, including MT-TF, MT-TH, MT-TI, MT-TL1, MT-TP, MT-TS1,
      and MT-TS2. That several different transfer RNAs can produce the same
      syndrome argues that the operative lesion is generic failure of
      mitochondrial translation rather than anything specific to lysine decoding.
      MT-TF is named here as the representative of that group because a MT-TF case
      supplies the treatment evidence used in this entry.
    evidence:
      - reference: PMID:20301693
        reference_title: MERRF.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Pathogenic variants in MT-TF, MT-TH, MT-TI, MT-TL1, MT-TP, MT-TS1, and
          MT-TS2 have also been described in a subset of individuals with MERRF.
        explanation: >-
          Enumerates the alternative causal genes, establishing genetic
          heterogeneity within the syndrome.
      - reference: PMID:16414077
        reference_title: Antimyoclonic effect of levetiracetam in MERRF syndrome.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          a patient with typical clinical, histological, and biochemical features
          of MERRF due to a mutation on the tRNA of Phenilalanine gene
        explanation: >-
          A worked case of typical MERRF caused by the phenylalanine transfer RNA
          gene rather than the lysine one, demonstrating the heterogeneity
          concretely.
prevalence:
  - population: Adults in North East England
    measure_type: POINT_PREVALENCE
    prevalence_class: BAND_1_5_PER_10000
    rate_per_100000: 20.0
    notes: >-
      This is the prevalence of mitochondrial DNA variants as a class, not of
      MERRF specifically. MERRF is one of the rarer syndromes within that class,
      so 20 per 100,000 is an upper bound on it rather than an estimate of it. A
      variant-specific figure does exist in the secondary literature, roughly 0.28
      per 100,000 for m.8344A>G in this same population and zero in a northern
      Finnish survey, but it is not curated as its own record here for two
      reasons: it is a variant frequency rather than a syndrome rate, since most
      carriers do not have MERRF, and the primary source has no abstract text
      against which a snippet could be verified. The honest position is that no
      snippet-verifiable syndrome-specific rate is available, not that no estimate
      exists.
    evidence:
      - reference: PMID:25652200
        reference_title: >-
          Prevalence of nuclear and mitochondrial DNA mutations related to adult
          mitochondrial disease.
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The minimum prevalence rate for mtDNA mutations was 1 in 5,000 (20 per
          100,000), comparable with our previously published prevalence rates.
        explanation: >-
          Gives a population-based rate for mitochondrial DNA disease as a whole.
          Marked PARTIAL because it bounds rather than measures MERRF, which is
          why the notes flag this as an upper bound.
progression:
  - phase: Onset with myoclonus after normal early development
    age_range: Childhood to adulthood
    notes: >-
      Development is typically normal before onset, which can occur any time from
      childhood to adult life. Myoclonus is usually the first symptom. In a
      pediatric MT-TK cohort the median age at onset was five years, with a wide
      spread; adult-onset cohorts report a mean in the mid thirties, so the
      syndrome does not have a single characteristic onset age.
    evidence:
      - reference: PMID:20301693
        reference_title: MERRF.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Onset can occur from childhood to adulthood, occurring after normal
          early development.
        explanation: >-
          States the normal early development and the wide onset window.
      - reference: PMID:39429077
        reference_title: >-
          Clinical characteristics of children with MT-TK gene m.8344A>G
          variation.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The age of onset was 5.00 (2.75, 9.00) years.
        explanation: >-
          Provides the pediatric onset distribution referenced in this phase.
  - phase: Progressive myoclonus, epilepsy, ataxia, and multisystem decline
    age_range: Years to decades after onset
    notes: >-
      Myoclonus worsens and generalized seizures appear, followed by ataxia,
      weakness, and cognitive decline, with multisystem features accruing.
      Progression is the rule; the disease does not stabilize the way many genetic
      generalized epilepsies do, which is what places it in the progressive
      myoclonic epilepsy group.
    evidence:
      - reference: PMID:39429077
        reference_title: >-
          Clinical characteristics of children with MT-TK gene m.8344A>G
          variation.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Myoclonus presented and worsened progressively in all 15 MERRF children,
          with 10 as the initial symptom
        explanation: >-
          Documents progression of the cardinal symptom in a defined cohort.
treatments:
  - name: Levetiracetam for myoclonus
    description: >-
      Levetiracetam suppresses myoclonus in mitochondrial progressive myoclonic
      epilepsy and, unlike valproate, does not interfere with mitochondrial
      respiration. This combination of efficacy and metabolic neutrality is why it
      is favoured as a first choice for the myoclonus of MERRF.
    therapeutic_modality: SMALL_MOLECULE
    treatment_term:
      preferred_term: Pharmacotherapy
      term:
        id: NCIT:C15986
        label: Pharmacotherapy
      therapeutic_agent:
        - preferred_term: levetiracetam
          term:
            id: CHEBI:6437
            label: levetiracetam
    target_mechanisms:
      - target: Cortical Neuronal Hyperexcitability
        treatment_effect: INHIBITS
    evidence:
      - reference: PMID:16414077
        reference_title: Antimyoclonic effect of levetiracetam in MERRF syndrome.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The average myoclonus score improved dramatically, as well as the
          quality of life and no side effects were observed, even after having
          withdrawn VPA.
        explanation: >-
          Documents the antimyoclonic effect in a MERRF patient, including
          maintenance of benefit after valproate withdrawal.
      - reference: PMID:16414077
        reference_title: Antimyoclonic effect of levetiracetam in MERRF syndrome.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          LEV may benefit myoclonus in PME of mitochondrial origin without
          altering mitochondrial function, and it could be considered the drug of
          first choice for the treatment of myoclonus in MERRF.
        explanation: >-
          States the mechanistic rationale for preferring levetiracetam, namely
          that it spares mitochondrial function.
      - reference: PMID:20301693
        reference_title: MERRF.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          levetiracetam or clonazepam for myoclonus
        explanation: >-
          Confirms the recommendation in the management guidance for the syndrome.
  - name: Clonazepam for myoclonus
    description: >-
      A benzodiazepine used as an alternative or adjunct for myoclonus, acting by
      enhancing GABA-A receptor mediated inhibition and so raising the threshold
      for hypersynchronous discharge.
    therapeutic_modality: SMALL_MOLECULE
    treatment_term:
      preferred_term: Pharmacotherapy
      term:
        id: NCIT:C15986
        label: Pharmacotherapy
      therapeutic_agent:
        - preferred_term: clonazepam
          term:
            id: CHEBI:3756
            label: clonazepam
    target_mechanisms:
      - target: Cortical Neuronal Hyperexcitability
        treatment_effect: INHIBITS
    evidence:
      - reference: PMID:20301693
        reference_title: MERRF.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          levetiracetam or clonazepam for myoclonus
        explanation: >-
          Names clonazepam as an accepted option for the myoclonus of MERRF.
  - name: Avoidance of valproic acid
    description: >-
      Valproate is the conventional first choice for progressive myoclonic
      epilepsy but is specifically to be avoided here, because it interferes with
      mitochondrial respiration and beta-oxidation and can precipitate hepatic
      failure in mitochondrial disease. This is a treatment decision that follows
      directly from the mechanism, which is why it is curated as a treatment
      rather than a footnote.
    therapeutic_modality: BEHAVIORAL
    treatment_term:
      preferred_term: Supportive Care
      term:
        id: NCIT:C15747
        label: Supportive Care
    evidence:
      - reference: PMID:20301693
        reference_title: MERRF.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          valproic acid should be avoided in the treatment of seizures
        explanation: >-
          States the contraindication directly in the management guidance.
      - reference: PMID:16414077
        reference_title: Antimyoclonic effect of levetiracetam in MERRF syndrome.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          VPA should be used with caution in PME due to mitochondrial
          dysfunction, i.e. in MERRF (myoclonic epilepsy with ragged red fibers)
          syndrome, because of its interaction with mitochondrial respiration and
          metabolism.
        explanation: >-
          Gives the mechanistic reason for the contraindication, tying it to
          mitochondrial respiration rather than to a generic drug interaction.
  - name: Avoidance of aminoglycosides, linezolid, tobacco, and alcohol
    description: >-
      A second and mechanistically distinct avoidance rule. Aminoglycoside
      antibiotics and linezolid both act on the bacterial ribosome, and because the
      mitochondrial ribosome is an evolutionary descendant of the bacterial one
      they inhibit it too. In a patient whose mitochondrial translation is already
      failing that is a second hit on the very step this disease is defined by.
      Tobacco and alcohol are avoided as general mitochondrial toxins. This is
      curated separately from the valproate rule because the mechanism differs and
      because the clinical situations in which each gets violated differ.
    therapeutic_modality: BEHAVIORAL
    treatment_term:
      preferred_term: Supportive Care
      term:
        id: NCIT:C15747
        label: Supportive Care
    evidence:
      - reference: PMID:20301693
        reference_title: MERRF.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Agents/circumstances to avoid: Mitochondrial toxins (e.g.,
          aminoglycoside antibiotics, linezolid, cigarettes, alcohol)
        explanation: >-
          Names the specific agents to avoid, separately from the valproate
          recommendation.
  - name: Mitochondrial cofactor and supplement therapy
    description: >-
      Coenzyme Q10, L-carnitine, alpha lipoic acid, vitamin E, B vitamins, and
      creatine are widely used on the reasoning that they support electron
      transport, restore carnitine pools, and buffer oxidative damage. The honest
      assessment in the literature is that benefit is modest and inconsistent, and
      no controlled trial has established disease modification.
    therapeutic_modality: SMALL_MOLECULE
    treatment_term:
      preferred_term: Nutritional Support
      term:
        id: NCIT:C15433
        label: Nutritional Support
      therapeutic_agent:
        - preferred_term: coenzyme Q10
          term:
            id: CHEBI:46245
            label: coenzyme Q10
        - preferred_term: L-carnitine
          term:
            id: CHEBI:16347
            label: (R)-carnitine
    target_mechanisms:
      - target: Respiratory Chain Deficiency and Loss of Mitochondrial Membrane Potential
        treatment_effect: MODULATES
    evidence:
      - reference: PMID:20301693
        reference_title: MERRF.
        supports: PARTIAL
        evidence_source: OTHER
        snippet: >-
          Coenzyme Q10 (50-200 mg 2-3x/day), L-carnitine (1000 mg 2-3x/day), alpha
          lipoic acid, vitamin E, vitamin B supplements, and creatine, often used
          to improve mitochondrial function, have been of modest benefit in some
          individuals.
        explanation: >-
          Documents both the practice and its limited effect. Marked PARTIAL
          because the source describes modest benefit in some individuals rather
          than demonstrating efficacy.
      - reference: PMID:35922766
        reference_title: >-
          Rapamycin rescues mitochondrial dysfunction in cells carrying the
          m.8344A > G mutation in the mitochondrial tRNA(Lys).
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Therapy is currently limited to symptomatic management of myoclonic
          epilepsy, and supportive measures to counteract muscle weakness with
          co-factors/supplements.
        explanation: >-
          Independently confirms that cofactor supplementation is supportive
          rather than disease-modifying, which is the framing used here.
  - name: Scheduled multisystem surveillance
    description: >-
      Because the syndrome accrues organ involvement unpredictably, surveillance is
      scheduled rather than symptom-driven, and it is organ-specific: neurological,
      ophthalmological, cardiac including electrocardiogram and echocardiogram, and
      endocrine review annually, with audiology every two to three years. The
      cardiac component matters most, because conduction disease can be silent
      right up until it is not.
    therapeutic_modality: BEHAVIORAL
    treatment_term:
      preferred_term: scheduled multisystem surveillance
      term:
        id: NCIT:C15747
        label: Supportive Care
    evidence:
      - reference: PMID:20301693
        reference_title: MERRF.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Surveillance: Routine evaluations every six to 12 months initially;
          annual neurologic, ophthalmologic, cardiology (electrocardiogram and
          echocardiogram), and endocrinologic evaluations (fasting blood sugar and
          TSH); audiology evaluations every two to three years.
        explanation: >-
          States the full surveillance schedule that this record encodes.
  - name: Hearing aids or cochlear implantation
    description: >-
      Sensorineural hearing loss is managed with amplification or, when the loss is
      severe, cochlear implantation. Worth curating because hearing loss is one of
      the commonest extra-neurological features and, unlike most of this syndrome,
      it is remediable.
    therapeutic_modality: DEVICE
    treatment_term:
      preferred_term: hearing aid or cochlear implantation
      term:
        id: NCIT:C49236
        label: Therapeutic Procedure
    evidence:
      - reference: PMID:20301693
        reference_title: MERRF.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          hearing aids or cochlear implants for hearing loss
        explanation: >-
          States the recommended management for the hearing loss of this syndrome.
  - name: Standard pharmacotherapy for cardiac involvement
    description: >-
      Cardiomyopathy and conduction disease are managed with conventional cardiac
      drugs rather than anything mitochondria-specific. The important point is not
      the drug choice but that cardiac involvement is actively looked for, since it
      contributes disproportionately to mortality.
    therapeutic_modality: SMALL_MOLECULE
    treatment_term:
      preferred_term: Pharmacotherapy
      term:
        id: NCIT:C15986
        label: Pharmacotherapy
    evidence:
      - reference: PMID:20301693
        reference_title: MERRF.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          standard pharmacologic therapy for cardiac symptoms
        explanation: >-
          States the recommended approach to the cardiac manifestations.
  - name: Pregnancy monitoring for diabetes and respiratory insufficiency
    description: >-
      Pregnancy raises both metabolic and respiratory demand, which is precisely the
      axis a mitochondrial disease cannot flex. Affected and at-risk women are
      therefore monitored for diabetes mellitus and respiratory insufficiency
      through pregnancy, either of which may need intervention.
    therapeutic_modality: BEHAVIORAL
    treatment_term:
      preferred_term: pregnancy monitoring
      term:
        id: NCIT:C15747
        label: Supportive Care
    evidence:
      - reference: PMID:20301693
        reference_title: MERRF.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          During pregnancy, affected or at-risk women should be monitored for
          diabetes mellitus and respiratory insufficiency, which may require
          therapeutic interventions.
        explanation: >-
          States the pregnancy-specific monitoring recommendation.
  - name: Genetic counselling for maternal transmission
    description: >-
      Counselling addresses the asymmetry of mitochondrial inheritance: an
      affected man transmits nothing, a carrier woman transmits to every child,
      and the mutant load a child receives cannot be predicted. Prenatal and
      preimplantation testing are technically available but cannot forecast
      phenotype, which is itself the counselling message.
    therapeutic_modality: BEHAVIORAL
    treatment_term:
      preferred_term: Genetic Counseling
      term:
        id: NCIT:C15240
        label: Genetic Counseling
    evidence:
      - reference: PMID:20301693
        reference_title: MERRF.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          because the mutational load in tissues sampled prenatally may shift in
          utero or after birth as a result of random mitotic segregation,
          prediction of the phenotype from prenatal studies is not possible.
        explanation: >-
          States the central limitation that the counselling has to convey.
  - name: Physical therapy and aerobic exercise
    description: >-
      Structured exercise and physiotherapy are used to maintain function. The
      rationale is that aerobic training stimulates mitochondrial biogenesis in
      muscle, though in a tissue where the added mitochondria carry the same
      defect the ceiling on that benefit is real.
    therapeutic_modality: BEHAVIORAL
    treatment_term:
      preferred_term: Physical Therapy
      term:
        id: NCIT:C15302
        label: Physical Therapy
    evidence:
      - reference: PMID:20301693
        reference_title: MERRF.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          physical therapy to improve any impaired motor function; aerobic
          exercise
        explanation: >-
          Names physiotherapy and aerobic exercise in the management guidance.
diagnosis:
  - name: Clinical recognition of the four canonic features
    description: >-
      Before any test, the syndrome is recognized clinically by the co-occurrence
      of myoclonus, generalized epilepsy, ataxia, and ragged red fibers. That
      tetrad remains the clinical case definition and is what should prompt
      molecular testing, since no one of the four is individually specific.
    diagnosis_term:
      preferred_term: clinical diagnostic criteria for MERRF
    results: >-
      A proband with myoclonus, generalized epilepsy, ataxia, and ragged red fibers
      meets the clinical case definition and should proceed to molecular testing.
    evidence:
      - reference: PMID:20301693
        reference_title: MERRF.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          A clinical diagnosis of MERRF can be established in a proband with the
          following four "canonic" features: myoclonus, generalized epilepsy,
          ataxia, and ragged red fibers (RRF) in the muscle biopsy.
        explanation: >-
          States the clinical case definition verbatim.
  - name: Targeted mitochondrial DNA testing for m.8344A>G
    description: >-
      Molecular testing is the definitive step. Because heteroplasmy varies
      between tissues and blood can be falsely reassuring, testing muscle or
      urinary sediment is preferred when blood is negative but suspicion is high.
      The original variant conveniently creates a restriction site, which is why a
      simple molecular test existed from the outset.
    diagnosis_term:
      preferred_term: Genetic Testing
      term:
        id: NCIT:C15709
        label: Genetic Testing
    results: >-
      Detection of m.8344A>G in MT-TK, with a quantified heteroplasmy level in the
      tissue tested.
    evidence:
      - reference: PMID:2112427
        reference_title: >-
          Myoclonic epilepsy and ragged-red fiber disease (MERRF) is associated
          with a mitochondrial DNA tRNA(Lys) mutation.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The mutation alters the T psi C loop of the tRNA(Lys) gene and creates a
          CviJI restriction site, providing a simple molecular diagnostic test for
          the disease.
        explanation: >-
          Establishes the molecular diagnostic basis for the syndrome.
  - name: Muscle biopsy with histochemistry
    description: >-
      Biopsy demonstrates ragged red fibers with cytochrome c oxidase negative
      fibers and strongly succinate dehydrogenase positive vessels. It remains
      useful when genetic testing on blood is negative, when the variant is in an
      unexpected transfer RNA gene, or when the mutant load is confined to muscle.
    diagnosis_term:
      preferred_term: Muscle Biopsy
      term:
        id: NCIT:C51895
        label: Muscle Biopsy
    results: >-
      Ragged red fibers on Gomori trichrome, cytochrome c oxidase deficient fibers,
      and strong succinate dehydrogenase reactivity including in intramuscular
      vessels.
    evidence:
      - reference: PMID:25337734
        reference_title: >-
          When should MERRF (myoclonus epilepsy associated with ragged-red fibers)
          be the diagnosis?
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Diagnostic criteria for MERRF include typical manifestations of the
          disease: myoclonus, generalized epilepsy, cerebellar ataxia and ragged
          red fibers (RRF) on muscle biopsy.
        explanation: >-
          Establishes muscle biopsy as one of the four defining diagnostic
          elements of the syndrome.
  - name: Electroencephalography with myoclonus correlation
    description: >-
      Electroencephalography distinguishes cortical myoclonic seizures from
      myoclonus generated below the cortex, which matters because the two respond
      differently and imply different generators. In a pediatric MT-TK cohort this
      distinction split the myoclonic patients roughly evenly.
    diagnosis_term:
      preferred_term: Electroencephalography
      term:
        id: NCIT:C38054
        label: Electroencephalography
    results: >-
      Generalized epileptiform discharges with a time-locked correlate for
      cortical myoclonus, or absent cortical correlate where the myoclonus is
      subcortical.
    evidence:
      - reference: PMID:39429077
        reference_title: >-
          Clinical characteristics of children with MT-TK gene m.8344A>G
          variation.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Electroencephalogram monitoring in the 15 MERRF children revealed
          myoclonic seizures in 10 children, with 6 classified as myoclonic
          epilepsy, and 4 as subcortical myoclonus.
        explanation: >-
          Demonstrates the diagnostic yield of electroencephalography in
          separating cortical from subcortical myoclonus.
  - name: Brain MRI of the cerebellum and brainstem
    description: >-
      Imaging supports rather than makes the diagnosis, but the pattern is
      suggestive: atrophy of the superior cerebellar peduncles and cerebellum, with
      brainstem atrophy in some. The clinically useful observation is the
      discrepancy in the other direction from most neurology, with disability
      markedly worse than the pictures, so mild imaging should not be used to argue
      against the diagnosis.
    diagnosis_term:
      preferred_term: Magnetic Resonance Imaging
      term:
        id: NCIT:C16809
        label: Magnetic Resonance Imaging
    results: >-
      Atrophy of the superior cerebellar peduncles and cerebellum, sometimes with
      brainstem atrophy; cerebral or cerebellar atrophy is seen in roughly two
      fifths of carriers.
    evidence:
      - reference: PMID:17989367
        reference_title: >-
          Clinical and brain MR imaging features focusing on the brain stem and
          cerebellum in patients with myoclonic epilepsy with ragged-red fibers due
          to mitochondrial A8344G mutation.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Conventional brain MR imaging showed atrophy of the superior cerebellar
          peduncles and the cerebellum in all patients and brain stem atrophy in 2
          patients.
        explanation: >-
          States the imaging findings reported in the results field.
      - reference: PMID:26995359
        reference_title: >-
          Expanded phenotypic spectrum of the m.8344A>G "MERRF" mutation: data from
          the German mitoNET registry.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Brain MRI revealed cerebral and/or cerebellar atrophy in 43 % of our
          patients.
        explanation: >-
          Gives the registry-scale yield of the test, which is what makes it
          supportive rather than diagnostic.
  - name: Blood lactate measurement
    description: >-
      A simple screening test that supports but cannot establish the diagnosis.
      Lactate is elevated at rest and rises further after exertion, but it is also
      raised in asymptomatic maternal relatives, so it functions as a trigger for
      further testing rather than a gate.
    diagnosis_term:
      preferred_term: Lactic Acid Measurement
      term:
        id: NCIT:C79450
        label: Lactic Acid Measurement
    results: >-
      Elevated resting lactate that may rise further after physical activity;
      normal values do not exclude the diagnosis and raised values do not confirm
      it.
    evidence:
      - reference: PMID:25337734
        reference_title: >-
          When should MERRF (myoclonus epilepsy associated with ragged-red fibers)
          be the diagnosis?
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          The lactic acid level in the blood and cerebrospinal fluid (CSF) is
          elevated at rest in patients with MERFF and can increase moderately
          after physical activity
        explanation: >-
          States the expected result of the test directly. The source's own
          spelling of the acronym is preserved so the quote remains exact.
differential_diagnoses:
  - name: MELAS Syndrome
    disease_term:
      preferred_term: MELAS syndrome
      term:
        id: MONDO:0010789
        label: MELAS syndrome
    description: >-
      The nearest mechanistic neighbour: another maternally inherited transfer RNA
      disease with the same wobble modification defect, differing in which transfer
      RNA is hit and in the resulting clinical emphasis. Overlap cases exist.
    distinguishing_features:
      - Caused by m.3243A>G in MT-TL1 rather than m.8344A>G in MT-TK.
      - Stroke-like episodes in non-vascular territories are the cardinal feature.
      - Myoclonus and progressive myoclonic epilepsy are not the defining picture.
    evidence:
      - reference: PMID:17132941
        reference_title: >-
          Human mitochondrial diseases associated with tRNA wobble modification
          deficiency.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          The MERRF mt tRNA(Lys) lacking the wobble modification cannot translate
          either of its codons (AAA and AAG), while the translational activity of
          MELAS mt tRNA(Leu(UUR)) lacking wobble modification is more depressed in
          decoding of UUG codon than UUA codon.
        explanation: >-
          Shows that the two syndromes share a mechanism class but differ in the
          completeness of the decoding failure, which is the molecular basis for
          treating them as separate entities.
  - name: Leigh Syndrome
    disease_term:
      preferred_term: Leigh syndrome
      term:
        id: MONDO:0009723
        label: Leigh syndrome
    description: >-
      The same m.8344A>G variant can produce Leigh syndrome instead of MERRF, and
      overlap presentations occur, so this is not merely a look-alike but a genuine
      alternative outcome of the identical genotype.
    distinguishing_features:
      - Symmetrical necrotizing lesions of basal ganglia and brainstem on imaging.
      - Earlier onset with developmental regression rather than myoclonus first.
      - Ragged red fibers are not the defining muscle finding.
    evidence:
      - reference: PMID:39429077
        reference_title: >-
          Clinical characteristics of children with MT-TK gene m.8344A>G
          variation.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Fifteen children had myoclonic epilepsy with ragged-red fibers (MERRF),
          3 had Leigh syndrome (LS), and 4 had LS-MERRF overlap syndrome
          (LS-MERRF).
        explanation: >-
          Demonstrates directly that the same variant produces both syndromes and
          overlap forms within one cohort.
  - name: Lafora Disease
    disease_term:
      preferred_term: Lafora disease
      term:
        id: MONDO:0009697
        label: Lafora disease
    description: >-
      A progressive myoclonic epilepsy that presents with the same triad of
      myoclonus, seizures, and cognitive decline in adolescence, but from
      pathological glycogen aggregation rather than energy failure.
    distinguishing_features:
      - Autosomal recessive EPM2A or NHLRC1 variants rather than maternal transmission.
      - Periodic acid-Schiff positive Lafora bodies on skin or other biopsy.
      - Prominent occipital seizures and rapid cognitive collapse.
      - No ragged red fibers and no maternal family history pattern.
    evidence:
      - reference: PMID:25337734
        reference_title: >-
          When should MERRF (myoclonus epilepsy associated with ragged-red fibers)
          be the diagnosis?
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          MERRF should be considered in the differential diagnosis of all
          progressive myoclonic epilepsies, including Lafora disease,
          neurolipofuscinose and Unverricht-Lundborg disease
        explanation: >-
          Names Lafora disease explicitly as a differential the clinician has to
          separate MERRF from.
  - name: Unverricht-Lundborg Disease
    disease_term:
      preferred_term: Unverricht-Lundborg syndrome
      term:
        id: MONDO:0009698
        label: Unverricht-Lundborg syndrome
    description: >-
      The other classic progressive myoclonic epilepsy of adolescence, with severe
      stimulus-sensitive myoclonus but comparatively preserved cognition and a much
      slower course than the other members of the group.
    distinguishing_features:
      - Autosomal recessive CSTB dodecamer repeat expansion.
      - Relatively preserved cognition over decades.
      - No myopathy, no ragged red fibers, and no multisystem involvement.
    evidence:
      - reference: PMID:25337734
        reference_title: >-
          When should MERRF (myoclonus epilepsy associated with ragged-red fibers)
          be the diagnosis?
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          MERRF should be considered in the differential diagnosis of all
          progressive myoclonic epilepsies, including Lafora disease,
          neurolipofuscinose and Unverricht-Lundborg disease
        explanation: >-
          Names Unverricht-Lundborg disease explicitly as a differential the
          clinician has to separate MERRF from.
discussions:
  - discussion_id: merrf_heteroplasmy_phenotype_disconnect
    kind: CONTROVERSY
    status: UNDER_DISCUSSION
    prompt: >-
      If the m.8344A>G variant acts through a heteroplasmy threshold, why does the
      heteroplasmy level measured in accessible tissue fail to predict who
      develops MERRF, and is MERRF a discrete syndrome at all rather than one pole
      of a transfer RNA lysine disease spectrum?
    attaches_to:
      - pathophysiology#Mitotic Segregation and Tissue Heteroplasmy Threshold
      - pathophysiology#Progressive Myoclonic Epilepsy
      - genetic#MT-TK m.8344A>G
    rationale: >-
      The threshold model is well supported in cell culture, where membrane
      potential collapses steeply across a narrow band of mutant load. It does not
      transfer cleanly to patients. In a three-generation family, symptomatic
      members did carry significantly more mutant genomes than asymptomatic ones,
      yet asymptomatic relatives were found carrying up to 63 percent mutant
      genomes, and the authors concluded there is no absolute relationship between
      blood mutant load and clinical severity. A larger East Chinese cohort of
      transfer RNA lysine carriers found blood heteroplasmy of a similar high range
      in symptomatic and asymptomatic individuals alike, and, more strikingly,
      found that the classic MERRF syndrome was the exception rather than the rule:
      most symptomatic carriers had a myopathy with neuropathy picture and only
      about a quarter had myoclonus at all. A case report goes further still,
      describing a homoplasmic carrier whose course was milder and later than his
      heteroplasmic sister, the opposite of what a simple dosage model predicts.
      Three interpretations remain live. The first keeps the threshold model and
      blames the measurement, arguing that blood is the wrong tissue and that
      brain or muscle mutant load, ideally at single-cell resolution, would restore
      the correlation. The second holds that heteroplasmy is genuinely only one
      input, with nuclear background, mitochondrial haplogroup, and the cell's
      capacity for compensatory biogenesis or mitophagy setting where the threshold
      sits. The third questions the nosology, treating MERRF as a named region of a
      continuous transfer RNA lysine phenotype landscape rather than an entity with
      its own mechanism. The stakes are practical: a blood heteroplasmy result is
      routinely used to counsel families, and on the second and third readings that
      number carries much less predictive weight than it appears to. The first
      reading is the weakest of the three, because the brain measurement it asks
      for has already been made: single neurons microdissected from a MERRF brain
      carried uniformly high mutant load across regions that differed several-fold
      in cell loss. Moving from blood to brain therefore does not rescue the dosage
      model, which pushes the weight of explanation onto the modifiers of the second
      reading and onto the nosological question of the third.
    proposed_experiments:
      - experiment_id: exp_merrf_nuclear_modifier_association
        name: Nuclear background and haplogroup modifier study at matched heteroplasmy
        description: >-
          Assemble carriers of m.8344A>G matched for mutant load in the same tissue
          but discordant for phenotype, including asymptomatic high-load carriers,
          and test nuclear genome and mitochondrial haplogroup for association with
          expression of the syndrome. Discordant relatives within a single maternal
          line are the most informative stratum, since they share the variant and
          much of the environment.
        decision_criterion: >-
          A reproducible nuclear or haplogroup association at matched heteroplasmy
          would establish that mutant load is one input among several and would
          give counselling something better than a blood percentage to work with.
          No association across an adequately powered matched design would leave
          stochastic developmental segregation as the leading explanation and argue
          that individual prognostication is not achievable in principle.
      - experiment_id: exp_merrf_prospective_multitissue_cohort
        name: Prospective multi-tissue heteroplasmy cohort with defined phenotyping
        description: >-
          A prospective cohort of transfer RNA lysine carriers, symptomatic and
          asymptomatic, with heteroplasmy quantified in blood, urinary sediment,
          and muscle at enrolment and standardized longitudinal phenotyping for
          myoclonus, seizures, ataxia, and myopathy.
        decision_criterion: >-
          If muscle or urinary heteroplasmy predicts subsequent phenotype where
          blood does not, current counselling practice should shift tissue. If no
          tissue predicts phenotype, the determinant lies outside mutant load and
          heteroplasmy-based prognostication should be explicitly qualified.
    evidence:
      - reference: PMID:9272179
        reference_title: >-
          Gene dosage effect in one family with myoclonic epilepsy and ragged-red
          fibers (MERRF).
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Although there seems to be a gene dosage effect in MERRF, we found no
          absolute relationship between the relative proportion of mutant genomes
          in blood and clinical severity.
        explanation: >-
          States the disconnect directly, from a family study designed to test the
          dosage model.
      - reference: PMID:9272179
        reference_title: >-
          Gene dosage effect in one family with myoclonic epilepsy and ragged-red
          fibers (MERRF).
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          high proportions of mutant genomes (up to 63%) were found in
          asymptomatic relatives
        explanation: >-
          Provides the concrete counterexample of asymptomatic carriers with high
          mutant load.
      - reference: PMID:32577866
        reference_title: >-
          "Myo-neuropathy" is commonly associated with mitochondrial
          tRNA(Lysine) mutation.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          heteroplasmy in blood was high both in symptomatic (mean 64.5%, range
          41-82%) and asymptomatic individuals (mean 53.1%, range 21-78%)
        explanation: >-
          Independent cohort evidence that blood heteroplasmy overlaps heavily
          between symptomatic and asymptomatic carriers.
      - reference: PMID:32577866
        reference_title: >-
          "Myo-neuropathy" is commonly associated with mitochondrial
          tRNA(Lysine) mutation.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          the classic syndrome of myoclonic epilepsy with ragged-red fibers (MERRF)
          was rare (23%)
        explanation: >-
          Supports the nosological arm of the controversy, that the named syndrome
          is a minority outcome of the genotype.
      - reference: PMID:26995359
        reference_title: >-
          Expanded phenotypic spectrum of the m.8344A>G "MERRF" mutation: data from
          the German mitoNET registry.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          There was no correlation between the heteroplasmy level in blood and age
          at onset or clinical phenotype.
        explanation: >-
          A third independent registry-scale statement of the disconnect, in 34
          carriers, which is what moves this from an anecdote to a stable finding.
      - reference: PMID:26995359
        reference_title: >-
          Expanded phenotypic spectrum of the m.8344A>G "MERRF" mutation: data from
          the German mitoNET registry.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          In our cohort, the canonical features seizures, myoclonus, cerebellar
          ataxia and ragged-red fibres that are traditionally associated with
          MERRF, occurred in only 61, 59, 70, and 63 % of the patients,
          respectively.
        explanation: >-
          Supports the nosological arm directly: in unselected carriers, no member
          of the defining tetrad reaches three quarters, so the named syndrome is
          not the typical outcome of the genotype.
      - reference: PMID:36176839
        reference_title: >-
          Milder Phenotype of Homoplasmic Versus Heteroplasmic m.8344A>G Variant in
          the Same Family: A Case Report.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          the m.8344A>G variant may manifest milder and with a later onset in the
          homoplasmic as compared to the heteroplasmic form
        explanation: >-
          A within-family observation running opposite to the dosage prediction.
          Single-case evidence, so it motivates the question rather than settling
          it.
      - reference: PMID:10477264
        reference_title: >-
          Defective kinetics of cytochrome c oxidase and alteration of
          mitochondrial membrane potential in fibroblasts and cytoplasmic hybrid
          cells with the mutation for myoclonus epilepsy with ragged-red fibres
          ('MERRF') at position 8344 nt.
        supports: PARTIAL
        evidence_source: IN_VITRO
        snippet: >-
          indicate that the biochemical manifestation of the MERRF mutation exerts
          a very steep threshold of DeltaPsi inhibition
        explanation: >-
          Represents the opposing position, that a sharp threshold does exist.
          Marked PARTIAL because it is a cell-culture result, which is precisely
          the level at which the threshold model works and the clinical data do
          not.
  - discussion_id: merrf_regional_selectivity_gap
    kind: KNOWLEDGE_GAP
    status: OPEN
    prompt: >-
      Why does a mitochondrial variant present in every tissue produce degeneration
      confined to a reproducible set of structures, chiefly the dentate nucleus,
      red nucleus, pallidum, subthalamic nucleus, cerebellar cortex, and inferior
      olive, while sparing most of the brain?
    attaches_to:
      - pathophysiology#Neuronal Energy Failure and Oxidative Stress
      - pathophysiology#Degeneration of Dentate Nucleus and Cerebellar Circuitry
    rationale: >-
      The neuropathology of MERRF is strikingly stereotyped and was recognized as a
      distinct distribution before the causal variant was known, differing from
      dentatorubral-pallidoluysian atrophy, Machado-Joseph disease, and Friedreich
      ataxia despite overlapping anatomy. The most obvious explanation, that the
      vulnerable regions simply carry more mutant mitochondrial DNA, has been
      tested directly and fails. Microdissection of individual neuronal somas from
      a MERRF brain found uniformly high mutant load across every region examined,
      and the relationship to cell loss ran the wrong way: Purkinje cells carried
      the highest mutant load of all, 97.6 percent, yet lost only 7 percent of
      their number, while dentate nucleus neurons lost 46 percent. Mutant load also
      matched between neuronal somas and the surrounding neuropil and glia, so the
      selectivity is not a matter of which cells inherited the bad genomes. What
      remains are cell-intrinsic differences under nuclear control: differing
      bioenergetic demand, with fast-spiking projection neurons running closer to
      their ceiling; differing antioxidant reserve; and differing capacity for
      mitochondrial biogenesis or mitophagy. None of these has been discriminated
      in human tissue. Resolving it matters beyond MERRF, because the same puzzle
      of a ubiquitous lesion with focal degeneration recurs across mitochondrial
      disease and is what makes the genotype so poor a predictor of which
      neurological syndrome a carrier develops.
    proposed_experiments:
      - experiment_id: exp_merrf_regional_bioenergetic_reserve_profiling
        name: Regional bioenergetic reserve profiling in vulnerable versus spared neurons
        description: >-
          Patient-derived induced pluripotent stem cell models differentiated into
          the vulnerable neuronal classes and into a spared comparator, matched for
          mutant load, with measurement of spare respiratory capacity, reactive
          oxygen species handling, and survival under metabolic stress.
        decision_criterion: >-
          If the vulnerable classes show a lower spare respiratory capacity and die
          preferentially at matched mutant load, intrinsic bioenergetic demand
          explains the selectivity. If they behave like the comparator, selectivity
          must come from mutant load distribution or the tissue environment rather
          than from cell-intrinsic demand.
    evidence:
      - reference: PMID:3128314
        reference_title: >-
          An autopsy case of myoclonus epilepsy associated with ragged-red fibers
          (Fukuhara disease).
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The lesions were degenerative in nature, and their distribution was
          different from those of dentato-rubropallidoluysian atrophy, Joseph's
          disease or Friedreich's ataxia.
        explanation: >-
          Establishes that the regional pattern is specific and reproducible enough
          to distinguish MERRF from anatomically neighbouring degenerations, which
          is what makes its unexplained selectivity a genuine gap.
      - reference: PMID:9315896
        reference_title: >-
          Myoclonic epilepsy and ragged red fibers (MERRF) syndrome: selective
          vulnerability of CNS neurons does not correlate with the level of
          mitochondrial tRNAlys mutation in individual neuronal isolates.
        supports: REFUTE
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Neurons and the surrounding neuropil and glia from all CNS regions that
          were analyzed exhibited high proportions of mutant mtDNA, ranging from
          97.6 +/- 0.7% in Purkinje cells to 80.6 +/- 2.8% in the anterior horn
          cells.
        explanation: >-
          Refutes the regional mutant-load explanation at single-cell resolution:
          load is uniformly high everywhere, including in a region that is
          relatively spared.
      - reference: PMID:9315896
        reference_title: >-
          Myoclonic epilepsy and ragged red fibers (MERRF) syndrome: selective
          vulnerability of CNS neurons does not correlate with the level of
          mitochondrial tRNAlys mutation in individual neuronal isolates.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Surprisingly, as compared with controls, neuronal loss ranged from 7% of
          the Purkinje cells to 46% of the neurons of the dentate nucleus in MERRF
          cerebellum.
        explanation: >-
          Quantifies the inverse relationship that makes the puzzle sharp: the
          highest-load population is the least depleted.
      - reference: PMID:9315896
        reference_title: >-
          Myoclonic epilepsy and ragged red fibers (MERRF) syndrome: selective
          vulnerability of CNS neurons does not correlate with the level of
          mitochondrial tRNAlys mutation in individual neuronal isolates.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Thus, factors other than the high proportion of mutant mtDNA, in
          particular nuclear-controlled neuronal differences among various regions
          of the CNS, seem to contribute to the mitochondrial dysfunction and
          ultimate cell death.
        explanation: >-
          States the authors' conclusion, which is the framing this gap now takes:
          the determinant is cell-intrinsic and nuclear, not mitochondrial dosage.
  - discussion_id: merrf_disease_modifying_therapy_gap
    kind: KNOWLEDGE_GAP
    status: OPEN
    prompt: >-
      Preclinical work rescues the MERRF defect in patient-derived cells by three
      independent routes: importing working transfer RNA, stimulating mitophagy
      with rapamycin, and cutting the mutant genome with a targeted nuclease to
      shift heteroplasmy. None has been tested in patients. What would it take to
      move any of them into a trial, and is a bioenergetic rescue still useful once
      neurons have been lost?
    attaches_to:
      - pathophysiology#Defective Mitochondrial Protein Synthesis
      - pathophysiology#Respiratory Chain Deficiency and Loss of Mitochondrial Membrane Potential
    rationale: >-
      Treatment today is entirely symptomatic. Three cell-level strategies have
      shown genuine rescue rather than marginal improvement. Targeting a yeast-derived
      transfer RNA lysine into mitochondria restored translation, respiratory
      complex activity, membrane potential, and respiration rate in patient
      fibroblasts and cybrids, and the rescue disappeared when the transgene was
      knocked down, which is about as clean a causal demonstration as this system
      allows. Separately, chronic rapamycin, acting through enhanced clearance of
      damaged mitochondria rather than through biogenesis, completely rescued the
      bioenergetic defect at intermediate mutant load, while direct stimulation of
      biogenesis failed at high mutant load. The third route attacks the problem at
      its root: a mitochondria-targeted nuclease, a monomeric mitoTev-TALE hybrid
      small enough to be plausibly packaged into a viral vector, cut the mutant
      genome in patient-derived cybrids and shifted the heteroplasmy ratio toward
      wild type, with recovery of oxidative phosphorylation even in a clone at 91
      percent mutant. These results share a limitation relevant to the clinic: they
      were obtained in dividing cells that can shift their heteroplasmy, whereas
      the neurons that matter are postmitotic and cannot dilute anything, and MERRF
      is a degenerative disease in which the target cells may be gone by the time of
      treatment. There is also a strong hint about timing, since rapamycin
      worked well at intermediate but only marginally at high mutant load,
      suggesting a window that closes. Neither strategy has a delivery route to the
      human central nervous system, and no biomarker exists that would show target
      engagement in brain.
    proposed_experiments:
      - experiment_id: exp_merrf_mitophagy_modulation_in_postmitotic_neurons
        name: Mitophagy modulation in postmitotic patient-derived neurons
        description: >-
          Apply chronic mitophagy stimulation to induced pluripotent stem cell
          derived neurons from MERRF donors after terminal differentiation,
          spanning a range of mutant loads, measuring heteroplasmy shift,
          respiration, and survival, and comparing early with delayed treatment.
        decision_criterion: >-
          Rescue in postmitotic neurons at clinically representative mutant loads
          would support translation and define the mutant-load ceiling for benefit.
          Rescue confined to dividing cells would indicate the mechanism depends on
          selective replicative advantage and does not transfer to the tissue that
          matters.
    evidence:
      - reference: PMID:15317755
        reference_title: >-
          Nuclear DNA-encoded tRNAs targeted into mitochondria can rescue a
          mitochondrial DNA mutation associated with the MERRF syndrome in
          cultured human cells.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Import of a tRNALys with a mutation in the anticodon preventing
          recognition of the lysine codons does not lead to any rescue, whereas
          downregulation of the transgenic tRNAs by small interfering RNA (siRNA)
          transiently abolishes the functional rescue, showing that this rescue is
          due to the import.
        explanation: >-
          Establishes the specificity and reversibility of the rescue, which is
          what makes the transfer RNA import strategy worth pursuing rather than a
          nonspecific culture effect.
      - reference: PMID:35922766
        reference_title: >-
          Rapamycin rescues mitochondrial dysfunction in cells carrying the
          m.8344A > G mutation in the mitochondrial tRNA(Lys).
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          The second approach, when administered chronically (4 weeks), induced a
          slight increase of mitochondrial respiration in fibroblasts with
          high-mutation load, and a significant improvement in fibroblasts with
          intermediate-mutation load, rescuing completely the bioenergetics defect.
        explanation: >-
          Documents both the rescue and the mutant-load dependence that motivates
          the timing question posed here.
      - reference: PMID:35922766
        reference_title: >-
          Rapamycin rescues mitochondrial dysfunction in cells carrying the
          m.8344A > G mutation in the mitochondrial tRNA(Lys).
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          This suggests that induction of mitochondrial biogenesis may not be
          sufficient to rescue mitochondrial dysfunction in MERRF cells with
          high-mutation load.
        explanation: >-
          Records the negative result for the biogenesis strategy, which is why
          this gap is framed around mitophagy, transfer RNA supply, and genome
          editing rather than around making more mitochondria.
      - reference: PMID:30012581
        reference_title: >-
          mitoTev-TALE: a monomeric DNA editing enzyme to reduce mutant
          mitochondrial DNA levels.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          When this mitoTev-TALE was tested in a clone with high levels of the
          MERRF mutation (91% mutant), the shift in heteroplasmy resulted in an
          improvement of oxidative phosphorylation function.
        explanation: >-
          Demonstrates the third rescue route in MERRF cells specifically, and at a
          mutant load in the range that defines clinical disease, which is where
          the rapamycin approach was weakest.
      - reference: PMID:30012581
        reference_title: >-
          mitoTev-TALE: a monomeric DNA editing enzyme to reduce mutant
          mitochondrial DNA levels.
        supports: PARTIAL
        evidence_source: IN_VITRO
        snippet: >-
          mitoTALENs are dimeric and relatively large, making it difficult to
          package their coding genes into viral vectors, limiting their clinical
          application.
        explanation: >-
          States the delivery constraint that this monomeric design is meant to
          solve, which is one concrete part of the answer to what it would take to
          reach a trial. Marked PARTIAL because packaging feasibility is argued
          rather than demonstrated in vivo.

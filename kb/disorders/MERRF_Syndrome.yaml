notes: >-
  Scope note. This entry models MERRF as the classic clinical syndrome, and
  treats m.8344A>G in MT-TK as its usual but not exclusive molecular cause. The
  relationship between that variant and the syndrome is deliberately curated as
  many-to-many rather than one-to-one: the same variant also produces Leigh
  syndrome, overlap phenotypes, and an isolated myopathy-with-neuropathy picture
  with no epilepsy at all, while a minority of MERRF cases arise from other
  mitochondrial transfer RNA genes. That mismatch between genotype and syndrome
  is recorded as an explicit controversy in the discussions block rather than
  smoothed over in the mechanism graph.

  Denominator convention for frequency bands. Every frequency band in this entry
  is drawn on a denominator of m.8344A>G carriers ascertained by genotype, not on
  people who already meet the MERRF clinical definition. That is deliberate and it
  is what makes the bands informative: asking how often myoclonus occurs among
  people diagnosed by a definition that requires myoclonus can only return one
  answer. So the 59 percent band on myoclonus is not a claim that two fifths of
  MERRF patients lack the syndrome's cardinal feature; it is a measurement of how
  often the variant produces that feature. The corollary is worth stating plainly,
  because it is the substance of the nosological controversy recorded below: no
  member of the defining tetrad reaches three quarters of carriers, and hearing
  impairment is commoner than any of them.

  Sourcing note. The entry was drafted from the GeneReviews chapter and the
  primary literature, then cross-checked against a deep-research report generated
  with the claude_code provider, which is committed alongside it as
  research/MERRF_Syndrome-deep-research-claude_code.md. That cross-check earned
  its keep. It supplied the genotype-ascertained mitoNET registry cohort, which
  is what allows this entry to put a non-circular frequency band on myoclonus and
  on the rest of the defining tetrad; it surfaced a third preclinical rescue route
  (mitochondrial genome editing) for the therapy gap; and, most usefully, it
  pointed to a 1997 autopsy study showing that the single-cell heteroplasmy
  measurement this entry had proposed as an experiment has already been done, with
  a result that runs opposite to the obvious prediction. The regional-selectivity
  discussion was rewritten accordingly rather than left proposing an experiment
  that exists. One caveat for anyone reading that report as a baseline: it was run
  after the first draft of this entry existed and it says so, organizing itself to
  extend the entry rather than to reconstruct it independently, and its own
  provenance section contradicts its frontmatter on whether a provider was used.
  It is a cross-check, not an independent starting point.

  Module conformance note. Two nodes declare conformance to
  epilepsy_excitation_inhibition_imbalance and two to
  cerebellar_purkinje_degeneration. MERRF departs from the generic epilepsy
  module in its entry point: the module opens on ion channel and synaptic
  dysfunction, whereas here the proximal lesion is a bioenergetic one, and the
  channels are affected only secondarily through failure to maintain ionic
  gradients. The graph therefore joins the module at the hyperexcitability node
  rather than at its trigger, which is a genuine feature of a metabolic epilepsy
  rather than a conformance defect. The module's intermediate Seizure Generation
  and Epileptogenesis node is deliberately not claimed either, because MERRF has
  no distinct epileptogenesis step to model: seizures emerge directly from
  ongoing bioenergetic failure rather than from a latent period of network
  reorganization following a discrete initial insult.
inheritance:
  - name: Maternal mitochondrial inheritance with heteroplasmy
    description: >-
      MERRF is transmitted through the maternal line only, because sperm
      mitochondria are not passed to the embryo. A carrier mother transmits the
      variant to every one of her children, but the proportion of mutant genomes
      each child receives is set by a random bottleneck and subsequent mitotic
      segregation, so severity is not predictable from the mother's status. An
      affected father transmits nothing. This is the practical reason prenatal
      testing cannot forecast the phenotype.
    inheritance_term:
      preferred_term: Mitochondrial inheritance
      term:
        id: HP:0001427
        label: Mitochondrial inheritance
    evidence:
      - reference: PMID:20301693
        reference_title: MERRF.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          MERRF is caused by pathogenic variants in mtDNA and is transmitted by
          maternal inheritance.
        explanation: >-
          States the mode of inheritance directly for the syndrome being modeled.
      - reference: PMID:20301693
        reference_title: MERRF.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          A female with a mtDNA pathogenic variant (whether symptomatic or
          asymptomatic) transmits the pathogenic variant to all of her offspring.
        explanation: >-
          Supports the all-or-none transmission from carrier mothers that
          distinguishes mitochondrial from Mendelian inheritance, and which is
          why asymptomatic carrier mothers still need counselling.
pathophysiology:
  - name: MT-TK m.8344A>G Heteroplasmic Point Variant
    biological_scale: MOLECULAR
    description: >-
      An adenine to guanine transition at position 8344 of the mitochondrial
      genome alters a conserved nucleotide in the T-psi-C loop of the transfer
      RNA for lysine. Because each cell carries hundreds to thousands of
      mitochondrial genomes, the variant is present as a mixture with normal
      genomes rather than in every copy, a state called heteroplasmy. The
      original pedigrees showed that retaining even a small fraction of normal
      genomes is strongly protective, which is the first hint that this is a
      dosage disease rather than a simple loss of function.
    genes:
      - preferred_term: MT-TK
        term:
          id: hgnc:7489
          label: MT-TK
    downstream:
      - target: Loss of Transfer RNA Lysine Wobble Taurine Modification
      - target: Mitotic Segregation and Tissue Heteroplasmy Threshold
    evidence:
      - reference: PMID:2112427
        reference_title: >-
          Myoclonic epilepsy and ragged-red fiber disease (MERRF) is associated
          with a mitochondrial DNA tRNA(Lys) mutation.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          An A to G transition mutation at nucleotide pair 8344 in human
          mitochondrial DNA (mtDNA) has been identified as the cause of MERRF.
        explanation: >-
          The original identification of the variant as the cause of the
          syndrome, in three independent pedigrees and absent from controls.
      - reference: PMID:2112427
        reference_title: >-
          Myoclonic epilepsy and ragged-red fiber disease (MERRF) is associated
          with a mitochondrial DNA tRNA(Lys) mutation.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          This suggests that a small percentage of normal mtDNAs has a large
          protective effect on phenotype.
        explanation: >-
          Establishes the heteroplasmy dosage relationship at the level of the
          founding observation, motivating the threshold node downstream.
      - reference: PMID:20301693
        reference_title: MERRF.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          The m.8344A>G pathogenic variant in the mitochondrial gene MT-TK is
          present in more than 80% of affected individuals with typical findings.
        explanation: >-
          Quantifies how much of the syndrome this node accounts for, and by
          implication how much is left to other mitochondrial transfer RNA genes.
  - name: Loss of Transfer RNA Lysine Wobble Taurine Modification
    biological_scale: MOLECULAR
    description: >-
      Mitochondrial transfer RNAs carry a taurine-containing chemical tag on the
      wobble uridine, the flexible first base of the anticodon that lets one
      transfer RNA read more than one codon. The m.8344A>G variant abolishes this
      tag on transfer RNA lysine. The consequence is unusually complete: unlike
      the analogous MELAS variant, which mainly impairs one of its two codons,
      the untagged MERRF transfer RNA fails to decode either lysine codon.
    biological_processes:
      - preferred_term: tRNA wobble uridine modification
        term:
          id: GO:0002098
          label: tRNA wobble uridine modification
        modifier: DECREASED
    downstream:
      - target: Defective Mitochondrial Protein Synthesis
    evidence:
      - reference: PMID:17132941
        reference_title: >-
          Human mitochondrial diseases associated with tRNA wobble modification
          deficiency.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          revealed the lack of a post-transcriptional taurine-modification at the
          anticodon wobble uridine in two mt tRNAs bearing typical pathogenic
          mutations
        explanation: >-
          Direct demonstration in patient-derived material that the modification
          is missing, which is the molecular content of this node.
      - reference: PMID:17132941
        reference_title: >-
          Human mitochondrial diseases associated with tRNA wobble modification
          deficiency.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          The MERRF mt tRNA(Lys) lacking the wobble modification cannot translate
          either of its codons (AAA and AAG)
        explanation: >-
          Establishes that the decoding failure is complete for both lysine
          codons, which is why the downstream translation defect is severe and
          not codon-selective.
  - name: Mitotic Segregation and Tissue Heteroplasmy Threshold
    biological_scale: CELLULAR
    description: >-
      Mitochondrial genomes are partitioned unequally at each cell division, so
      the mutant fraction drifts upward in some lineages and downward in others.
      Biochemical failure is not proportional to that fraction; it is switch-like.
      In cell lines derived from one patient, moving the mutant load across a
      narrow band collapsed the mitochondrial membrane potential far more sharply
      than it reduced enzyme activity, which is what a threshold looks like
      experimentally. Post-mitotic tissues with high and unremitting energy
      demand cross that threshold first.
    biological_processes:
      - preferred_term: regulation of membrane potential
        term:
          id: GO:0042391
          label: regulation of membrane potential
        modifier: ABNORMAL
    downstream:
      - target: Respiratory Chain Deficiency and Loss of Mitochondrial Membrane Potential
    evidence:
      - reference: PMID:10477264
        reference_title: >-
          Defective kinetics of cytochrome c oxidase and alteration of
          mitochondrial membrane potential in fibroblasts and cytoplasmic hybrid
          cells with the mutation for myoclonus epilepsy with ragged-red fibres
          ('MERRF') at position 8344 nt.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Within the range of 87-73% mutated mtDNA, COX activity was decreased to
          5-35% and DeltaPsi was decreased to 6-78%.
        explanation: >-
          Quantifies how steeply both readouts change across a narrow heteroplasmy
          band, which is the experimental content of a threshold.
      - reference: PMID:10477264
        reference_title: >-
          Defective kinetics of cytochrome c oxidase and alteration of
          mitochondrial membrane potential in fibroblasts and cytoplasmic hybrid
          cells with the mutation for myoclonus epilepsy with ragged-red fibres
          ('MERRF') at position 8344 nt.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          indicate that the biochemical manifestation of the MERRF mutation exerts
          a very steep threshold of DeltaPsi inhibition
        explanation: >-
          States the threshold conclusion explicitly rather than leaving it as an
          inference from the numbers.
  - name: Defective Mitochondrial Protein Synthesis
    biological_scale: MOLECULAR
    description: >-
      Thirteen respiratory chain subunits are encoded by the mitochondrial genome
      and must be built inside the organelle, using its own transfer RNAs. With
      lysine decoding crippled, synthesis of those subunits stalls, and every
      complex that depends on a mitochondrially encoded subunit is left
      incompletely assembled. Nuclear-encoded subunits are unaffected, which is
      why the biochemical signature is a mixed and partial deficiency rather than
      the clean absence of one enzyme.
    biological_processes:
      - preferred_term: mitochondrial translation
        term:
          id: GO:0032543
          label: mitochondrial translation
        modifier: DECREASED
    downstream:
      - target: Respiratory Chain Deficiency and Loss of Mitochondrial Membrane Potential
    evidence:
      - reference: PMID:35922766
        reference_title: >-
          Rapamycin rescues mitochondrial dysfunction in cells carrying the
          m.8344A > G mutation in the mitochondrial tRNA(Lys).
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Defective tRNALys severely impairs mitochondrial protein synthesis and
          respiratory chain when a high percentage of mutant heteroplasmy crosses
          the threshold for full-blown clinical phenotype.
        explanation: >-
          Links the translation defect to the respiratory chain defect and to the
          heteroplasmy threshold in a single statement, which is exactly the
          junction this node sits at.
      - reference: PMID:15317755
        reference_title: >-
          Nuclear DNA-encoded tRNAs targeted into mitochondria can rescue a
          mitochondrial DNA mutation associated with the MERRF syndrome in
          cultured human cells.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          import of tRNALys is accompanied by a partial rescue of mitochondrial
          functions affected by the mutation such as mitochondrial translation,
          activity of respiratory complexes, electrochemical potential across the
          mitochondrial membrane and respiration rate
        explanation: >-
          A rescue experiment supplying working transfer RNA lysine restores
          translation and everything downstream, which is causal evidence that the
          transfer RNA defect is the operative lesion rather than a correlate.
  - name: Respiratory Chain Deficiency and Loss of Mitochondrial Membrane Potential
    biological_scale: CELLULAR
    description: >-
      Incomplete respiratory complexes cannot move electrons efficiently, so the
      proton gradient across the inner mitochondrial membrane collapses and
      adenosine triphosphate synthesis falls. Cytochrome c oxidase, the terminal
      enzyme, is the most conspicuously affected in patient cells and the one
      exploited diagnostically. A leaking, poorly coupled electron transport
      chain also spills more reactive oxygen species, adding oxidative damage to
      simple energy shortfall.
    biological_processes:
      - preferred_term: mitochondrial ATP synthesis coupled electron transport
        term:
          id: GO:0042775
          label: mitochondrial ATP synthesis coupled electron transport
        modifier: DECREASED
      - preferred_term: reactive oxygen species metabolic process
        term:
          id: GO:0072593
          label: reactive oxygen species metabolic process
        modifier: INCREASED
    molecular_functions:
      - preferred_term: cytochrome-c oxidase activity
        term:
          id: GO:0004129
          label: cytochrome-c oxidase activity
        modifier: DECREASED
    downstream:
      - target: Compensatory Mitochondrial Proliferation in Skeletal Muscle
      - target: Neuronal Energy Failure and Oxidative Stress
    evidence:
      - reference: PMID:10477264
        reference_title: >-
          Defective kinetics of cytochrome c oxidase and alteration of
          mitochondrial membrane potential in fibroblasts and cytoplasmic hybrid
          cells with the mutation for myoclonus epilepsy with ragged-red fibres
          ('MERRF') at position 8344 nt.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          The activity of cytochrome c oxidase (COX) in patient fibroblasts with
          89% mutated mtDNA was decreased to 20% of the control levels.
        explanation: >-
          Quantifies the terminal enzyme deficit in patient-derived cells, which
          is the biochemical core of this node.
      - reference: PMID:2112427
        reference_title: >-
          Myoclonic epilepsy and ragged-red fiber disease (MERRF) is associated
          with a mitochondrial DNA tRNA(Lys) mutation.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          This mutation provides molecular confirmation that some forms of
          epilepsy are the result of deficiencies in mitochondrial energy
          production.
        explanation: >-
          States the causal claim this entry is built around, that the epilepsy of
          MERRF is downstream of an energy production defect.
  - name: Compensatory Mitochondrial Proliferation in Skeletal Muscle
    biological_scale: TISSUE
    description: >-
      Muscle fibers respond to the energy shortfall by making more mitochondria,
      which accumulate under the sarcolemma and between myofibrils. Because the
      added organelles carry the same defect, the compensation is futile, and its
      only reliable product is a histological sign: the ragged red fiber seen on
      Gomori trichrome, typically accompanied by fibers that fail to stain for
      cytochrome c oxidase while staining strongly for succinate dehydrogenase.
      Notably the intramuscular blood vessels show the same pattern.
    cell_types:
      - preferred_term: skeletal muscle fiber
        term:
          id: CL:0008002
          label: skeletal muscle fiber
    downstream:
      - target: Skeletal Muscle Respiratory Failure
    evidence:
      - reference: PMID:25337734
        reference_title: >-
          When should MERRF (myoclonus epilepsy associated with ragged-red fibers)
          be the diagnosis?
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Morphological changes seen upon muscle biopsy in MERRF include a
          substantive proportion of RRF, muscle fibers showing a deficient
          activity of cytochrome c oxidase (COX)
        explanation: >-
          Ties the histological hallmark to the enzyme deficiency, which is what
          makes the ragged red fiber a readout of this node rather than an
          unrelated finding.
  - name: Neuronal Energy Failure and Oxidative Stress
    biological_scale: CELLULAR
    description: >-
      Neurons are unusually vulnerable to a bioenergetic deficit because
      maintaining ionic gradients across a large membrane surface consumes most
      of their adenosine triphosphate budget, and because they cannot dilute a
      mutant load by dividing. As supply falls below demand, ion pumping falters,
      resting membrane potential drifts, calcium handling degrades, and cells
      that cross the failure point die. The result is two distinct downstream
      problems: surviving neurons that are too excitable, and populations of
      neurons that are simply lost.
    cell_types:
      - preferred_term: neuron
        term:
          id: CL:0000540
          label: neuron
    biological_processes:
      - preferred_term: apoptotic process
        term:
          id: GO:0006915
          label: apoptotic process
        modifier: INCREASED
    downstream:
      - target: Cortical Neuronal Hyperexcitability
      - target: Degeneration of Dentate Nucleus and Cerebellar Circuitry
      - target: Progressive Multisystem Involvement
    evidence:
      - reference: PMID:2112427
        reference_title: >-
          Myoclonic epilepsy and ragged-red fiber disease (MERRF) is associated
          with a mitochondrial DNA tRNA(Lys) mutation.
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          This mutation provides molecular confirmation that some forms of
          epilepsy are the result of deficiencies in mitochondrial energy
          production.
        explanation: >-
          Supports the causal link from energy failure to epilepsy. Marked PARTIAL
          because it asserts the link at the level of the syndrome and does not
          itself demonstrate the neuronal mechanisms named in this node.
      - reference: PMID:35203288
        reference_title: Mitochondrial Neurodegeneration.
        supports: PARTIAL
        evidence_source: OTHER
        snippet: >-
          Mutations striking either genome can lead to mitochondrial impairment,
          determining infantile, childhood or adult neurodegeneration.
        explanation: >-
          Supports the general principle that mitochondrial impairment produces
          neurodegeneration. Marked PARTIAL because it is a review statement about
          the class of disease rather than a MERRF-specific measurement.
  - name: Cortical Neuronal Hyperexcitability
    biological_scale: CELLULAR
    conforms_to: "epilepsy_excitation_inhibition_imbalance#Neuronal Hyperexcitability and Hypersynchrony"
    description: >-
      Energy-starved cortical neurons cannot sustain the ion gradients that
      normally hold them below firing threshold, and inhibitory interneurons,
      which fire fast and are metabolically expensive, are thought to fail
      disproportionately. The network consequence is hypersynchronous discharge.
      In MERRF this expresses itself both as cortical myoclonus with a matching
      electroencephalographic correlate and as generalized seizures. Importantly
      not all the myoclonus in these patients is cortical; a substantial minority
      is generated below the cortex, which is modeled on the cerebellar and
      brainstem branch instead.
    cell_types:
      - preferred_term: pyramidal neuron
        term:
          id: CL:0000598
          label: pyramidal neuron
    biological_processes:
      - preferred_term: regulation of membrane potential
        term:
          id: GO:0042391
          label: regulation of membrane potential
        modifier: ABNORMAL
    downstream:
      - target: Progressive Myoclonic Epilepsy
    evidence:
      - reference: PMID:39429077
        reference_title: >-
          Clinical characteristics of children with MT-TK gene m.8344A>G
          variation.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Electroencephalogram monitoring in the 15 MERRF children revealed
          myoclonic seizures in 10 children, with 6 classified as myoclonic
          epilepsy, and 4 as subcortical myoclonus.
        explanation: >-
          Provides the electrographic split between cortical myoclonic epilepsy
          and subcortical myoclonus that this node and its cerebellar sibling are
          modeled on, and supports the cortical arm specifically.
      - reference: PMID:37605213
        reference_title: >-
          Mitochondrial impairment and synaptic dysfunction are associated with
          neurological defects in iPSCs-derived cortical neurons of MERRF
          patients.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          MERRF neural cells harboring the m.8344A > G mutation exhibited impaired
          mitochondrial bioenergetic function, elevated ROS levels and imbalanced
          expression of antioxidant enzymes.
        explanation: >-
          Supplies the human-cell bridge from bioenergetic failure to cortical
          neuronal dysfunction that this node otherwise rests on electrographic
          phenomenology alone to assert.
  - name: Degeneration of Dentate Nucleus and Cerebellar Circuitry
    biological_scale: TISSUE
    conforms_to: "cerebellar_purkinje_degeneration#Loss of Cerebellar Cortical Output"
    description: >-
      Autopsy studies show that the neuronal loss in MERRF is not diffuse but
      falls on a reproducible set of structures, with the dentate nucleus, red
      nucleus, globus pallidus, subthalamic nucleus, and pontine tegmentum
      degenerating alongside the cerebellar cortex and inferior olive. This is
      the classic dentatorubral and pallidoluysian distribution, and its
      selectivity is the central unexplained feature of the disease, since the
      causal variant is present throughout the body. Loss of dentate output
      disrupts the cerebello-thalamo-cortical loop, producing ataxia and
      contributing a subcortical component to the myoclonus.
    locations:
      - preferred_term: cerebellum
        term:
          id: UBERON:0002037
          label: cerebellum
    cell_types:
      - preferred_term: Purkinje cell
        term:
          id: CL:0000121
          label: Purkinje cell
    downstream:
      - target: Progressive Cerebellar Ataxia
      - target: Progressive Myoclonic Epilepsy
    evidence:
      - reference: PMID:3128314
        reference_title: >-
          An autopsy case of myoclonus epilepsy associated with ragged-red fibers
          (Fukuhara disease).
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          degeneration of dentate nucleus, red nucleus, globus pallidus,
          subthalamic nucleus and pontine tegmentum
        explanation: >-
          Postmortem documentation of the selective regional degeneration this
          node asserts, in the index Fukuhara case.
      - reference: PMID:3128314
        reference_title: >-
          An autopsy case of myoclonus epilepsy associated with ragged-red fibers
          (Fukuhara disease).
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          degeneration of substantia nigra, locus ceruleus, cerebellar cortex and
          inferior olivary nucleus
        explanation: >-
          Documents cerebellar cortical and olivary involvement specifically,
          which is what licenses conformance to the cerebellar module node.
  - name: Skeletal Muscle Respiratory Failure
    biological_scale: TISSUE
    description: >-
      Muscle with a high mutant load cannot raise oxidative phosphorylation to
      meet the demand of contraction, so patients fatigue early, tolerate exercise
      poorly, and become weak. Because the shortfall is worst under load, the
      complaint is characteristically exertional before it is fixed. Membrane
      leak from damaged fibers releases creatine kinase into the circulation.
    cell_types:
      - preferred_term: skeletal muscle fiber
        term:
          id: CL:0008002
          label: skeletal muscle fiber
    downstream:
      - target: Progressive Multisystem Involvement
    evidence:
      - reference: PMID:32577866
        reference_title: >-
          "Myo-neuropathy" is commonly associated with mitochondrial
          tRNA(Lysine) mutation.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The most frequent symptoms were muscle weakness (76.9%), exercise
          intolerance (76.9%), elevated creatine kinase levels (61.5%), peripheral
          neuropathy (69.2%) and cerebellar ataxia (61.5%)
        explanation: >-
          Quantifies the muscle phenotype in a transfer RNA lysine carrier cohort,
          establishing that exertional failure and creatine kinase leak dominate.
  - name: Progressive Myoclonic Epilepsy
    biological_scale: ORGANISM
    conforms_to: "epilepsy_excitation_inhibition_imbalance#Recurrent Unprovoked Seizures"
    description: >-
      The clinical endpoint on the epilepsy branch. Myoclonus is usually the
      first symptom and is characteristically action-sensitive, worsening with
      fine motor tasks and stress, and it progresses. Generalized seizures
      follow. Because both a cortical and a subcortical generator contribute, and
      because the underlying lesion is degenerative, the syndrome behaves as a
      progressive myoclonic epilepsy rather than a stable seizure disorder.
    evidence:
      - reference: PMID:39429077
        reference_title: >-
          Clinical characteristics of children with MT-TK gene m.8344A>G
          variation.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Myoclonus was predominantly focal, worsening with fine motor tasks or
          stress.
        explanation: >-
          Documents the action-sensitive character of the myoclonus asserted here.
      - reference: PMID:20301693
        reference_title: MERRF.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          MERRF (myoclonic epilepsy with ragged red fibers) is a multisystem
          disorder characterized by myoclonus (often the first symptom) followed
          by generalized epilepsy, ataxia, weakness, exercise intolerance, and
          dementia.
        explanation: >-
          Establishes the sequence in which the syndrome unfolds, with myoclonus
          preceding generalized epilepsy.
  - name: Progressive Cerebellar Ataxia
    biological_scale: ORGANISM
    conforms_to: "cerebellar_purkinje_degeneration#Cerebellar Ataxia"
    description: >-
      The clinical endpoint on the cerebellar branch: gait and limb ataxia,
      dysarthria, and incoordination that worsen as dentate and cortical
      cerebellar neurons are lost. Ataxia is one of the four canonical diagnostic
      features of the syndrome and is common in transfer RNA lysine carriers even
      when the full MERRF picture is absent.
    evidence:
      - reference: PMID:25337734
        reference_title: >-
          When should MERRF (myoclonus epilepsy associated with ragged-red fibers)
          be the diagnosis?
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Diagnostic criteria for MERRF include typical manifestations of the
          disease: myoclonus, generalized epilepsy, cerebellar ataxia and ragged
          red fibers (RRF) on muscle biopsy.
        explanation: >-
          Establishes cerebellar ataxia as one of the four defining features, so
          this endpoint is part of the syndrome definition and not an incidental
          association.
  - name: Progressive Multisystem Involvement
    biological_scale: ORGANISM
    description: >-
      Beyond the defining tetrad, the energy deficit surfaces in any tissue whose
      mutant load crosses threshold, which is why MERRF is a multisystem rather
      than a purely neurological disease. Recognized involvement includes
      sensorineural hearing loss, ptosis and optic atrophy, peripheral neuropathy,
      cardiomyopathy and conduction disease including Wolff-Parkinson-White,
      diabetes mellitus, short stature, and symmetrical lipomatosis. Which of
      these appear in a given patient is not predictable from the variant.
    evidence:
      - reference: PMID:20301693
        reference_title: MERRF.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Common findings are ptosis, hearing loss, short stature, optic atrophy,
          cardiomyopathy, cardiac dysrhythmias such as Wolff-Parkinson-White
          syndrome, and peripheral neuropathy.
        explanation: >-
          Enumerates the multisystem features asserted by this node.
      - reference: PMID:20301693
        reference_title: MERRF.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Pigmentary retinopathy, optic neuropathy, diabetes mellitus, and
          lipomatosis have been observed.
        explanation: >-
          Adds the endocrine, retinal, and adipose features, including the
          lipomatosis that is a recognized marker of this variant.
phenotypes:
  - category: Neurologic
    name: Myoclonus
    description: >-
      Sudden brief involuntary muscle jerks, usually the presenting symptom, often
      focal and action-sensitive, and progressive over the course of the disease.
      Both cortical and subcortical generators contribute.
    phenotype_term:
      preferred_term: Myoclonus
      term:
        id: HP:0001336
        label: Myoclonus
      clinical_course: PROGRESSIVE
    frequency: FREQUENT
    evidence:
      - reference: PMID:39429077
        reference_title: >-
          Clinical characteristics of children with MT-TK gene m.8344A>G
          variation.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Myoclonus presented and worsened progressively in all 15 MERRF children,
          with 10 as the initial symptom
        explanation: >-
          Documents the progressive character and the frequency with which
          myoclonus opens the illness. This cohort is not used for the frequency
          band, because within a MERRF-defined group myoclonus is definitional and
          its rate is circular.
      - reference: PMID:26995359
        reference_title: >-
          Expanded phenotypic spectrum of the m.8344A>G "MERRF" mutation: data from
          the German mitoNET registry.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          In our cohort, the canonical features seizures, myoclonus, cerebellar
          ataxia and ragged-red fibres that are traditionally associated with
          MERRF, occurred in only 61, 59, 70, and 63 % of the patients,
          respectively.
        explanation: >-
          Supplies the FREQUENT band non-circularly. The denominator here is
          carriers of m.8344A>G ascertained by genotype rather than by the MERRF
          clinical definition, so the 59 percent figure for myoclonus measures the
          phenotype instead of restating the case definition.
  - category: Neurologic
    name: Action myoclonus
    description: >-
      The myoclonus of MERRF is characteristically brought out or worsened by
      voluntary movement, particularly fine motor tasks, and by stress. This
      action sensitivity is what makes it functionally disabling out of proportion
      to the jerks seen at rest, and it is the feature levetiracetam and clonazepam
      are aimed at.
    phenotype_term:
      preferred_term: Action myoclonus
      term:
        id: HP:0034360
        label: Action myoclonus
    evidence:
      - reference: PMID:39429077
        reference_title: >-
          Clinical characteristics of children with MT-TK gene m.8344A>G
          variation.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Myoclonus was predominantly focal, worsening with fine motor tasks or
          stress.
        explanation: >-
          Documents the action and stress sensitivity that distinguishes this
          phenotype from myoclonus in general.
  - category: Neurologic
    name: Generalized epilepsy
    description: >-
      Generalized seizures follow the onset of myoclonus and are one of the four
      canonical diagnostic features. Seizure types recorded in MT-TK cohorts
      include myoclonic, generalized tonic-clonic, and occasionally absence
      seizures.
    phenotype_term:
      preferred_term: Generalized-onset seizure
      term:
        id: HP:0002197
        label: Generalized-onset seizure
    frequency: FREQUENT
    evidence:
      - reference: PMID:26995359
        reference_title: >-
          Expanded phenotypic spectrum of the m.8344A>G "MERRF" mutation: data from
          the German mitoNET registry.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          In our cohort, the canonical features seizures, myoclonus, cerebellar
          ataxia and ragged-red fibres that are traditionally associated with
          MERRF, occurred in only 61, 59, 70, and 63 % of the patients,
          respectively.
        explanation: >-
          Seizures in 61 percent of genotype-ascertained carriers, within the
          FREQUENT band. Genotype ascertainment keeps the estimate non-circular.
      - reference: PMID:25337734
        reference_title: >-
          When should MERRF (myoclonus epilepsy associated with ragged-red fibers)
          be the diagnosis?
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Diagnostic criteria for MERRF include typical manifestations of the
          disease: myoclonus, generalized epilepsy, cerebellar ataxia and ragged
          red fibers (RRF) on muscle biopsy.
        explanation: >-
          Establishes generalized epilepsy as a defining feature of the syndrome.
      - reference: PMID:39429077
        reference_title: >-
          Clinical characteristics of children with MT-TK gene m.8344A>G
          variation.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Two children had generalized myoclonic seizures, and 1 each had absence
          seizures and generalized seizures.
        explanation: >-
          Documents the range of generalized seizure types seen in a MT-TK cohort.
  - category: Neurologic
    name: Cerebellar ataxia
    description: >-
      Gait and limb incoordination with dysarthria, reflecting degeneration of the
      dentate nucleus and cerebellar cortex. Present in roughly half to two thirds
      of MT-TK variant carriers who come to attention.
    phenotype_term:
      preferred_term: Progressive cerebellar ataxia
      term:
        id: HP:0002073
        label: Progressive cerebellar ataxia
      clinical_course: PROGRESSIVE
    frequency: FREQUENT
    evidence:
      - reference: PMID:39429077
        reference_title: >-
          Clinical characteristics of children with MT-TK gene m.8344A>G
          variation.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Twelve children had cerebellar ataxia, 10 children exhibited exercise
          intolerance, and 8 children had muscle weakness.
        explanation: >-
          Twelve of the 22 children in this MT-TK cohort had cerebellar ataxia,
          which is 55 percent and falls in the FREQUENT band. The denominator is
          all MT-TK carriers rather than only those meeting MERRF criteria, so the
          estimate is not inflated by the diagnostic definition.
      - reference: PMID:32577866
        reference_title: >-
          "Myo-neuropathy" is commonly associated with mitochondrial
          tRNA(Lysine) mutation.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The most frequent symptoms were muscle weakness (76.9%), exercise
          intolerance (76.9%), elevated creatine kinase levels (61.5%), peripheral
          neuropathy (69.2%) and cerebellar ataxia (61.5%)
        explanation: >-
          An independent adult transfer RNA lysine cohort gives 61.5 percent,
          corroborating the FREQUENT band from a different population.
  - category: Musculoskeletal

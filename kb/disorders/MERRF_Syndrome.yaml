      Subsarcolemmal accumulation of structurally abnormal mitochondria producing
      the ragged red fiber on Gomori trichrome staining, accompanied by
      cytochrome c oxidase negative fibers. One of the four defining features and
      the origin of the syndrome name.
    phenotype_term:
      preferred_term: Ragged-red muscle fibers
      term:
        id: HP:0003200
        label: Ragged-red muscle fibers
    frequency: FREQUENT
    evidence:

name: MERRF Syndrome
creation_date: "2026-08-05T00:00:00Z"
category: Mendelian
description: >-
  MERRF (myoclonic epilepsy with ragged red fibers) is a maternally inherited
  multisystem mitochondrial disease whose canonical tetrad is myoclonus,
  generalized epilepsy, cerebellar ataxia, and ragged red fibers on muscle
  biopsy. More than eight in ten typical cases carry the m.8344A>G point variant
  in MT-TK, the mitochondrial gene for transfer RNA-lysine. The variant strips a
  chemical tag from the part of the transfer RNA that reads lysine codons, so
  the mitochondrion can no longer build its own share of the respiratory chain.
  Energy production fails wherever the proportion of mutant mitochondrial
  genomes crosses a steep threshold, which is why the disease is patchy across
  tissues and highly variable between relatives who carry the same variant.
  Muscle answers the deficit by proliferating defective mitochondria, producing
  the ragged red fiber. In brain the deficit falls hardest on the dentate
  nucleus, cerebellar cortex, and brainstem nuclei, giving the progressive
  myoclonic epilepsy and ataxia that dominate the clinical picture.
parents:
  - Epilepsy
  - Neurological Disease
synonyms:
  - MERRF
  - myoclonic epilepsy with ragged red fibers
  - myoclonus epilepsy associated with ragged-red fibers
  - Fukuhara disease
classifications:
  mechanistic_category:

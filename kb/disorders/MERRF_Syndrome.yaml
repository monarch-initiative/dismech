          MERRF, occurred in only 61, 59, 70, and 63 % of the patients,
          respectively.
        explanation: >-
          Ragged-red fibres in 63 percent of genotype-ascertained carriers, within
          the FREQUENT band. One caveat specific to this feature: the denominator
          is limited to carriers who underwent muscle biopsy, and biopsy is more
          likely to be done when a mitochondrial myopathy is already suspected, so
          this band carries an ascertainment pressure the clinical features do not.
      - reference: PMID:25337734
        reference_title: >-

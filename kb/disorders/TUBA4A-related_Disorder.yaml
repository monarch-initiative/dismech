  gene_term:
    preferred_term: TUBA4A (alpha-tubulin 4A)
    term:
      id: hgnc:12407
      label: TUBA4A
  notes: >-
    A single gene with an unusually wide reach: ALS and frontotemporal dementia,
    hereditary spastic ataxia, isolated congenital-to-adult myopathy, and
    multisystem proteinopathy - across dominant, de novo and recessive
    inheritance.
  evidence:
  - reference: PMID:41678358
    reference_title: Missense variants in TUBA4A cause myo-tubulinopathies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this multi-centre study, we identified one previously reported and 12
      novel TUBA4A missense variants in 31 individuals from 19 unrelated
      families.
    explanation: >-
      The multicentre cohort that establishes the breadth of TUBA4A disease

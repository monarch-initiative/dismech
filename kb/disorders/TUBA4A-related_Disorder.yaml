- name: Molecular genetic testing
  description: >-
    Sequencing identifies the TUBA4A missense variant. Because most reported
    individuals have no CNS involvement, TUBA4A must be on the differential for
    axial myopathy and not only for ALS - which is the practical message of the
    2026 cohort.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing

- name: Myopathy
  description: >-
    Proximal and axial muscle weakness, predominantly affecting axial and
    paraspinal muscles, ranging from mild to severe with onset from congenital to
    late adulthood. This is the presenting and often only feature.
  phenotype_term:
    preferred_term: Myopathy
    term:
      id: HP:0003198
      label: Myopathy
  evidence:
  - reference: PMID:41678358
    reference_title: Missense variants in TUBA4A cause myo-tubulinopathies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Remarkably, individuals in 17 families presented with a myopathy without
      any CNS involvement or history of such disease.
    explanation: >-
      Establishes isolated myopathy as the majority presentation in the cohort.

treatments:
- name: Supportive and Rehabilitative Care
  description: >-
    No disease-modifying therapy exists. Management is supportive: physiotherapy
    and respiratory care for axial and paraspinal weakness, and standard care for
    the neurological features where present. Cardiac function was preserved
    across the reported cohort, which is a meaningful negative for surveillance
    planning in a myopathy.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:41678358
    reference_title: Missense variants in TUBA4A cause myo-tubulinopathies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cardiac function remained preserved across the cohort.
    explanation: >-
      A negative finding that informs surveillance: cardiac involvement was not
      observed, unlike in many other congenital myopathies.
- name: Genetic Counseling
  description: >-
    Counselling is complicated here in a way it is not for most tubulinopathies,
    because the inheritance model is genuinely mixed - dominant transmission, de
    novo variants, and recessive homozygous variants with asymptomatic
    heterozygous carriers all occur in the same gene. Recurrence risk cannot be
    quoted from the gene alone.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:41678358
    reference_title: Missense variants in TUBA4A cause myo-tubulinopathies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      three probands had recessive inheritance due to homozygous variants, while
      the respective heterozygous carriers were asymptomatic
    explanation: >-
      The recessive families are why recurrence risk must be established per
      family rather than assumed dominant.
discussions:
- discussion_id: gap_tuba4a_phenotype_determination
  prompt: >-
    What determines whether a TUBA4A variant produces isolated myopathy, spastic
    ataxia, ALS/FTD, or multisystem proteinopathy?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Altered Alpha-Tubulin 4A (TUBA4A) Function
  - pathophysiology#Skeletal Muscle Myopathic Change
  rationale: >-
    TUBA4A now spans four clinical territories, and the striking fact is the
    proportions: 17 of 19 families in the largest series had myopathy with no CNS
    involvement at all, in a gene originally described as an ALS gene. Something
    determines the tissue that fails. There is a real lead - variant domain
    position correlates with both the pattern of muscle involvement and the extent
    of microtubule disruption - but that analysis was run within the myopathy
    cohort, so it explains variation inside the muscle arm rather than the choice
    between muscle and CNS. Inheritance adds a second unexplained axis: the same
    gene carries dominant, de novo and recessive alleles, and a recessive allele
    with unaffected heterozygous carriers implies a different mechanism from a
    dominant de novo one. Resolving this needs the domain-position analysis
    extended across all four phenotype groups, with tissue-specific expression or
    isotype-compensation data to explain why muscle tolerates or fails to tolerate
    a given lesion differently from motor neurons.
  evidence:
  - reference: PMID:41678358
    reference_title: Missense variants in TUBA4A cause myo-tubulinopathies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Remarkably, individuals in 17 families presented with a myopathy without
      any CNS involvement or history of such disease.
    explanation: >-
      The proportion that makes tissue selectivity the central question for this
      gene.
  - reference: PMID:41678358
    reference_title: Missense variants in TUBA4A cause myo-tubulinopathies.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      Correlation analyses integrating clinical severity, variant location, and
      mechanistic readouts further demonstrated that domain specificity within
      TUBA4A influences both the pattern of muscle involvement and the extent of
      microtubule disruption.
    explanation: >-
      The partial answer available - domain position predicts muscle pattern -
      which does not yet extend to the muscle-versus-CNS choice.
notes: >-
  Created 2026-08-20 while closing out tubulin-family disease coverage, following
  docs/reports/tubulinopathies-grouping-review-2026-08-20.md, which flagged the
  2026 myo-tubulinopathy delineation as a genuinely new tubulin disease entity
  with no DisMech entry.

  MAPPING CAVEAT. disease_term is MONDO:0014531, amyotrophic lateral sclerosis
  type 22, because that is the only MONDO concept for TUBA4A. It under-describes
  this entry substantially: the majority of reported individuals have myopathy
  with no CNS involvement, and MONDO has no concept for TUBA4A-related
  myo-tubulinopathy or for the multisystem proteinopathy presentation. This is an
  upstream ontology gap of the same family as the tubulinopathy-hierarchy gap
  recorded in monarch-initiative/dismech#9113. Curators reusing this
  disease_term should read the entry, not the term label.

  Deliberately NOT a member of the Tubulinopathies grouping and NOT conformed to
  microtubule_dependent_neuronal_migration_failure: there is no cortical
  malformation and no neuronal migration defect in this disorder. The grouping's
  notes already record TUBA4A as out of scope.

  functional_impact_category is UNKNOWN by deliberate choice - a gene carrying
  dominant, de novo and recessive alleles in the same cohort is unlikely to have
  one mechanism class.

  All evidence snippets are quoted from cached abstracts.

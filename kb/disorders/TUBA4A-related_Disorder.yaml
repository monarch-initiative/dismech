name: TUBA4A-related Disorder
creation_date: "2026-08-20T16:30:00Z"
category: Mendelian
disease_term:
  preferred_term: amyotrophic lateral sclerosis type 22
  term:
    id: MONDO:0014531
    label: amyotrophic lateral sclerosis type 22
description: >-
  TUBA4A-related disorder is the tubulinopathy that is not a brain malformation
  and, in most reported families, not a central nervous system disease at all.
  TUBA4A encodes an alpha-tubulin 4A isotype whose disease associations have
  widened repeatedly since it was first linked to familial amyotrophic lateral
  sclerosis and frontotemporal dementia. It now spans three phenotypic groups:
  the original ALS/FTD neurodegenerative presentations; hereditary spastic ataxia
  with variable age of onset; and - newly delineated in 2026 - the
  myo-tubulinopathies, in which a myopathy occurs with no CNS involvement
  whatsoever.

  The myopathy arm is the reason this entry exists as a distinct concept rather
  than as an ALS subtype. In a 31-individual, 19-family multicentre series, 17
  families presented with myopathy and no CNS disease or history of it. Two
  further families showed cerebellar ataxia and epilepsy alongside proximal and
  axial weakness with protein aggregation, which the authors define as a
  multisystem proteinopathy - the first association of TUBA4A with that entity.
  Inheritance is likewise not what an ALS gene would predict: alongside autosomal
  dominant transmission and de novo variants, three probands had recessive
  homozygous variants whose heterozygous carriers were asymptomatic.

  The disease_term is MONDO's ALS type 22, which is the only MONDO concept for
  this gene; it under-describes the entry, and the mapping caveat is recorded in
  the notes. Muscle involvement is predominantly axial and paraspinal, creatine
  kinase ranges from normal to highly elevated, cardiac function is preserved
  across the reported cohort, and biopsies show heterogeneous myopathic change
  including nemaline bodies, core-like regions and internal nuclei with
  accumulations positive for TDP-43, p62 and TUBA4A itself.
parents:
- hereditary neurological disease
- neuromuscular disease
- neurodegenerative disease

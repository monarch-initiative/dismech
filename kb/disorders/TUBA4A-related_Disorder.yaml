    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Remarkably, individuals in 17 families presented with a myopathy without
      any CNS involvement or history of such disease.
    explanation: >-
      Establishes isolated myopathy as the majority presentation in the cohort.
- name: Elevated Creatine Kinase
  description: >-

pathophysiology:
- name: Altered Alpha-Tubulin 4A (TUBA4A) Function
  role: TRIGGER
  biological_scale: MOLECULAR
  description: >-
    Missense variants alter the alpha-tubulin 4A isotype. Patient-derived
    fibroblasts carrying distinct TUBA4A missense variants show significant
    alterations in microtubule organization and dynamics, and in silico and in
    vitro work indicates the variants cause protein abnormalities that may
    differentially affect microtubule dynamics. Domain position matters: variant
    location within TUBA4A correlates both with the pattern of muscle involvement
    and with the extent of microtubule disruption, so this is one of the few
    tubulin genes where a structure-phenotype relationship has been measured
    directly.
  genetic_context:
    functional_impact_category: UNKNOWN
    variant_origin: GERMLINE
    description: >-
      The myopathy and spastic-ataxia cohorts considered at this node carry
      missense variants. The broader ALS literature also includes one nonsense,
      one splice-site and one frameshift variant, so missense is not an accurate
      locus-wide description. The mechanism class remains unresolved: the same
      gene carries dominant, de novo and recessive alleles, and a recessive allele
      whose heterozygous carriers are unaffected may behave differently from a
      dominant de novo allele. A single functional_impact_category is therefore
      unlikely to be correct across the full phenotypic spectrum.
  genes:
  - preferred_term: TUBA4A
    term:
      id: hgnc:12407
      label: TUBA4A
  biological_processes:
  - preferred_term: microtubule cytoskeleton organization
    term:
      id: GO:0000226
      label: microtubule cytoskeleton organization
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:38884572
    reference_title: De novo and inherited monoallelic variants in TUBA4A cause ataxia and spasticity.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Cultured fibroblasts from three patients harbouring distinct TUBA4A
      missense showed significant alterations in microtubule organization and
      dynamics, providing insight of TUBA4A variants pathogenicity.
    explanation: >-
      Direct measurement of the microtubule lesion in patient cells across three
      distinct variants.
  - reference: PMID:41678358
    reference_title: Missense variants in TUBA4A cause myo-tubulinopathies.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Complementary in silico and in vitro investigations suggested that the
      identified TUBA4A variants cause significant protein abnormalities and may
      differentially impact microtubule dynamics.
    explanation: >-
      Supports the molecular lesion and its non-uniformity across variants.
  - reference: PMID:41678358
    reference_title: Missense variants in TUBA4A cause myo-tubulinopathies.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Correlation analyses integrating clinical severity, variant location, and
      mechanistic readouts further demonstrated that domain specificity within
      TUBA4A influences both the pattern of muscle involvement and the extent of
      microtubule disruption.
    explanation: >-
      Establishes a measured relationship between variant domain, microtubule
      disruption and clinical pattern.
  - reference: CGGV:assertion_7349d6e4-f351-4a8a-80f6-af62d3e716e5-2025-03-27T160000.000Z
    reference_title: TUBA4A / amyotrophic lateral sclerosis type 22 (Moderate)
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      TUBA4A mutants appear to disrupt microtubule dynamics and stability through
      a dominant-negative mechanism, however there is an absence of functional
      data from primary tissue of TUBA4A mutation carriers.
    explanation: >-
      Supports a candidate dominant-negative mechanism for ALS-associated
      variants while preserving ClinGen's explicit primary-tissue limitation.
  downstream:
  - target: Skeletal Muscle Myopathic Change
    description: >-
      Perturbed microtubule function in skeletal muscle produces the myopathic
      phenotype that dominates the reported cohort.
  - target: Motor Neuron and Cerebellar Dysfunction
    description: >-
      TUBA4A perturbation is associated with CNS dysfunction rather than, or in
      addition to, myopathy in a minority of the myopathy cohort and in separate
      neurological cohorts.
- name: Skeletal Muscle Myopathic Change
  biological_scale: TISSUE
  description: >-
    The dominant arm. Muscle involvement is predominantly axial and paraspinal.
    Biopsies show heterogeneous myopathic changes - myofibre size variation,
    nemaline bodies, core-like regions and internal nuclei - with
    immunohistochemical accumulations positive for TDP-43, p62 and TUBA4A itself.
    The protein accumulations are what connect this arm to the proteinopathy
    branch rather than leaving it a structural myopathy. Creatine kinase is
    variable from normal to highly elevated, and cardiac function was preserved
    across the whole reported cohort.
  biological_processes:
  - preferred_term: muscle structure development
    term:
      id: GO:0061061
      label: muscle structure development
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:41678358
    reference_title: Missense variants in TUBA4A cause myo-tubulinopathies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Muscle biopsies showed heterogenous myopathic changes, including myofibre
      size variation, nemaline bodies, core-like regions, and internal nuclei.
    explanation: Reports the histopathological substrate of this node.
  - reference: PMID:38413182
    reference_title: Novel TUBA4A variant causes congenital myopathy with focal myofibrillar disorganisation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The prominent myopathological changes in both patients were muscle fibres
      with focal myofibrillar disorganisation and rimmed vacuoles.
    explanation: >-
      Provides independent histopathologic support from two congenital-myopathy
      patients carrying the recurrent de novo p.Leu227Phe variant.
  - reference: PMID:41678358
    reference_title: Missense variants in TUBA4A cause myo-tubulinopathies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Immunohistochemical analysis revealed protein accumulations positive for
      TDP-43 (n=2), p62 (n=5), and TUBA4A (n=6).
    explanation: >-
      Documents the protein aggregates, including TUBA4A itself, that link the
      myopathy to the proteinopathy phenotype.
  - reference: PMID:41678358
    reference_title: Missense variants in TUBA4A cause myo-tubulinopathies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinical phenotypes ranged from mild to severe myopathy, predominantly
      affecting the axial and paraspinal muscles.
    explanation: Establishes the distribution and severity range of muscle involvement.
  downstream:
  - target: Myopathy
    description: The clinical myopathy phenotype.
  - target: Elevated Creatine Kinase
    description: Variable CK elevation reflects the myopathic process.
- name: Motor Neuron and Cerebellar Dysfunction
  biological_scale: TISSUE
  description: >-
    The neurological arm, and historically the first to be recognised.
    TUBA4A has a ClinGen Moderate relationship with autosomal dominant ALS22,
    and a segregating missense variant has been reported in one extended family
    with FTD. A separate 448-proband ataxia screen plus a 100,000 Genomes burden
    analysis support a hereditary spastic-ataxia association with variable age
    of onset. In the myo-tubulinopathy cohort, CNS involvement appeared in two of
    nineteen families, coexisting with muscle weakness and protein aggregation -
    the combination the authors call a multisystem proteinopathy.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:38884572
    reference_title: De novo and inherited monoallelic variants in TUBA4A cause ataxia and spasticity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Taken together, we report 12 patients presenting with spasticity and/or
      cerebellar ataxia and harbouring a predicted pathogenic TUBA4A missense
      mutation, including five confirmed de novo cases and a mutation previously
      reported in a large family presenting with spastic ataxia.
    explanation: >-
      Establishes the spastic ataxia phenotype and its genetic support across 12
      patients.
  - reference: CGGV:assertion_7349d6e4-f351-4a8a-80f6-af62d3e716e5-2025-03-27T160000.000Z
    reference_title: TUBA4A / amyotrophic lateral sclerosis type 22 (Moderate)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In summary, there is moderate evidence to support this gene-disease
      relationship.
    explanation: >-
      Records the current expert-panel assessment of the ALS arm rather than
      relying on an article's historical summary of the association.
  - reference: PMID:34169147
    reference_title: Novel TUBA4A Variant Associated With Familial Frontotemporal Dementia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified a likely pathogenic variant in TUBA4A segregating with
      disease.
    explanation: >-
      Supports the FTD arm with segregation in an extended family; it does not
      establish a Definitive FTD relationship by itself.
  downstream:
  - target: Cerebellar Ataxia
    description: Cerebellar involvement.
  - target: Spasticity
    description: Corticospinal involvement.
  - target: Multisystem Proteinopathy
    description: >-
      Coexisting neurodegenerative and neuromuscular features with protein

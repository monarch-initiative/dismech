phenotypes:
- name: Myopathy
  description: >-
    Proximal and axial muscle weakness, predominantly affecting axial and
    paraspinal muscles, ranging from mild to severe with onset from congenital to
    late adulthood. This is the presenting and often only feature.
  phenotype_term:

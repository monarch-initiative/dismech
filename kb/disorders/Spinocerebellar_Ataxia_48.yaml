imaging_findings:
- name: Dentate nucleus T2 hyperintensity with postero-lateral cerebellar atrophy (crab sign)
  modality: MRI
  imaging_finding_term:
    preferred_term: Abnormal dentate nucleus morphology
    term:
      id: HP:0100321
      label: Abnormal dentate nucleus morphology
  located_in:
    preferred_term: dentate nucleus
    term:
      id: UBERON:0002132
      label: dentate nucleus
  laterality: BILATERAL
  description: >-
    The most specific imaging feature of SCA48 is bilateral T2-weighted
    hyperintensity of the dentate nuclei combined with atrophy predominantly
    of the postero-lateral cerebellar hemispheres; the two together were
    likened to a crab and named the "crab sign". Supratentorial volume loss
    and signal change are typically absent. In a separate series the dentate
    signal change extended into the middle cerebellar peduncles. Term-binding
    caveat: HPO has no dentate-nucleus signal-intensity term (it has thalamic,
    brainstem and basal-ganglia siblings), so this finding is bound to the
    morphology term HP:0100321, which is a different kind of claim from a T2
    signal abnormality; preferred_term carries the intended meaning.
  evidence:
  - reference: PMID:32285148
    reference_title: "The \"crab sign\": an imaging feature of spinocerebellar ataxia type 48."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We propose that the association of such signal change, along with the atrophy of the lateral portion of the cerebellar hemispheres, resembled the appearance of a crab, and therefore, we propose the \"crab sign\" as a neuroradiological sign present in SCA48 patients."
    explanation: >-
      Names and defines the composite imaging sign in the series that
      described it.
  - reference: PMID:32285148
    reference_title: "The \"crab sign\": an imaging feature of spinocerebellar ataxia type 48."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In SCA48 patients, no meaningful supratentorial changes were found, both in terms of volume loss or MRI signal changes."
    explanation: >-
      Supports the negative half of the imaging pattern, which is part of what
      makes the sign discriminating.
  - reference: PMID:31126790
    reference_title: "Spinocerebellar ataxia 48 presenting with ataxia associated with cognitive, psychiatric, and extrapyramidal features: A report of two Italian families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MRI showed a significant cerebellar atrophy, coupled to a T2-weighted hyperintensity affecting the dentate nuclei and extending to the middle cerebellar peduncles"
    explanation: >-
      Independent replication of the dentate signal abnormality with extension
      into the middle cerebellar peduncles.

- name: Cerebellar atrophy in presymptomatic carriers
  modality: MRI
  imaging_finding_term:
    preferred_term: Cerebellar vermis atrophy
    term:
      id: HP:0006855
      label: Cerebellar vermis atrophy
  located_in:
    preferred_term: cerebellar vermis
    term:
      id: UBERON:0004720
      label: cerebellar vermis
  spatial_extent: FOCAL
  description: >-
    Focal atrophy of the vermis, paravermis and medial lobules VI-VII is
    detectable in presymptomatic STUB1 variant carriers, before motor ataxia.
    These are the cerebellar territories serving cognition and emotion, which
    is why the cognitive-affective syndrome precedes the motor syndrome. This
    has practical consequences: it defines an imaging-detectable prodromal
    window that any future disease-modifying therapy would likely need to
    target.
  evidence:
  - reference: PMID:30381368
    reference_title: "Heterozygous STUB1 mutation causes familial ataxia with cognitive affective syndrome (SCA48)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three presymptomatic patients showed focal cerebellar atrophy in the vermian, paravermian, and the medial part of cerebellar lobes VI and VII, suggesting that cerebellar atrophy preceded the ataxia"
    explanation: >-
      Directly documents presymptomatic focal cerebellar atrophy and its
      topography in variant carriers.

histopathology:
- name: Purkinje cell loss with vermian predominance
  finding_term:
    preferred_term: Purkinje cell loss
    term:
      id: NCIT:C120874
      label: Degeneration and Atrophy
  description: >-
    Post-mortem examination in heterozygous STUB1 patients shows marked to
    massive Purkinje cell loss, most severe in the vermis and substantial in
    the hemispheres, with little or no involvement of pons, hippocampus or
    cerebral cortex on gross and microscopic assessment. Term-binding note:
    NCIT:C120874 (Degeneration and Atrophy) is generic, but it is the most
    specific term available under the Histopathology Result branch that the
    schema draws on - NCIT's only cell-loss-specific terms are for sensory hair
    cells and corneal endothelium. preferred_term carries the cell type.
  evidence:
  - reference: PMID:32713943
    reference_title: "Clinical, neuropathological, and genetic characterization of STUB1 variants in cerebellar ataxias: a frequent cause of predominant cognitive impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "showing massive loss of Purkinje cells in the vermis and major loss in the cerebellar hemispheres without atrophy of the pons, hippocampus, or cerebral cortex"
    explanation: >-
      Autopsy findings in a heterozygous STUB1 patient define the
      histopathological signature and its anatomical selectivity.
  - reference: PMID:32211513
    reference_title: "Heterozygous STUB1 missense variants cause ataxia, cognitive decline, and STUB1 mislocalization."
    supports: SUPPORT

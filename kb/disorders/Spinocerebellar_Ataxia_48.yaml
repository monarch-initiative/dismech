genetic:
- name: STUB1 heterozygous pathogenic variants
  gene_term:
    preferred_term: STUB1
    term:
      id: hgnc:11427
      label: STUB1
  association: Causative heterozygous pathogenic variants
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  inheritance:
  - name: Autosomal dominant inheritance
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
    evidence:
    - reference: PMID:32713943
      reference_title: "Clinical, neuropathological, and genetic characterization of STUB1 variants in cerebellar ataxias: a frequent cause of predominant cognitive impairment."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Pathogenic variants in STUB1 were initially described in autosomal recessive spinocerebellar ataxia type 16 and dominant cerebellar ataxia with cerebellar cognitive dysfunction (SCA48)."
      explanation: >-
        States the dominant inheritance of SCA48 and simultaneously names the
        allelic recessive disorder, keeping the pair explicit.
  notes: >-
    Variants are germline, distributed across the coding sequence with no
    hotspot, and include missense, nonsense, frameshift, splice-site and
    in-frame deletion changes. Reported examples include the discovery
    frameshift c.823_824delCT (p.Leu275Aspfs*16), the de novo TPR-domain
    missense c.155C>G (p.Ala52Gly), the U-box frameshift c.832del
    (p.Glu278fs), and the missense c.755A>C (p.Tyr252Ser). Because dominant
    and recessive STUB1 variants are biochemically indistinguishable in vitro,
    zygosity and phenotype - not variant class - separate SCA48 from SCAR16.
  evidence:
  - reference: PMID:30381368
    reference_title: "Heterozygous STUB1 mutation causes familial ataxia with cognitive affective syndrome (SCA48)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among the candidate variants, only the frameshift heterozygous c.823_824delCT STUB1 (p.L275Dfs*16) pathogenic variant cosegregated with the disease."
    explanation: >-
      The founding genetic observation: a single heterozygous STUB1 variant
      cosegregating with SCA48.
  - reference: PMID:34565360
    reference_title: "Clinical and functional characterization of a novel STUB1 frameshift mutation in autosomal dominant spinocerebellar ataxia type 48 (SCA48)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a novel heterozygous frameshift variant, c.832del (p.Glu278fs), in STUB1 in two patients from the same family."
    explanation: >-
      Independent identification of a novel heterozygous U-box frameshift
      variant in an SCA48 family, illustrating allelic heterogeneity.
  - reference: PMID:39707479
    reference_title: "Clinical and functional characterization of a novel STUB1 mutation in a Chinese spinocerebellar ataxia 48 pedigree."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we reported a Chinese SCA48 family exhibited typical features and defined a novel missense mutation STUB1 c.755A>C (CHIP p. Y252S) through whole-exome sequencing."
    explanation: >-
      Extends the reported allelic and geographic spectrum with a functionally
      characterised missense variant.

- name: TBP intermediate CAG/CAA repeat expansion (modifier)
  gene_term:
    preferred_term: TBP
    term:
      id: hgnc:11588
      label: TBP
  association: Modifier of penetrance and severity, not an independent cause of SCA48
  relationship_type: MODIFIER
  variant_origin: GERMLINE
  notes: >-
    Intermediate TBP alleles (approximately 40-49 CAG/CAA repeats) are
    themselves incompletely penetrant for SCA17 and co-occur with STUB1
    variants far more often than expected. Current evidence favours a modifier
    role: repeat length predicts cognitive impairment and speed of
    progression, and the combined genotype is fully penetrant, but SCA48 also
    occurs with normal TBP alleles. TBP repeat sizing is therefore
    recommended alongside STUB1 sequencing for prognosis and counselling, not
    as a diagnostic requirement.
  evidence:
  - reference: PMID:36422518
    reference_title: "Intermediate repeat expansions of TBP and STUB1: Genetic modifier or pure digenic inheritance in spinocerebellar ataxias?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We show that intermediate TBP40-49 alleles act as disease modifiers of SCA48 rather than a STUB1/TBP digenic model. This distinction from what has been proposed before has crucial consequences for genetic counseling in SCA48."
    explanation: >-
      Establishes the modifier relationship_type used here and states its
      counselling consequence.
  - reference: PMID:36422518
    reference_title: "Intermediate repeat expansions of TBP and STUB1: Genetic modifier or pure digenic inheritance in spinocerebellar ataxias?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "STUB1 variants were found in half of the TBP40-49 cohort. Mirroring this finding, TBP40-49 alleles were detected in 40% of STUB1 probands."
    explanation: >-
      Quantifies the reciprocal co-occurrence that makes TBP sizing clinically
      worth doing in STUB1 probands.

prevalence:
- population: Index cerebellar ataxia cases, mostly with dominant inheritance (SPATAX network, 440 index cases)
  measure_type: UNKNOWN
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    STUB1 variants were detected in 50 patients across the 440 index cases, an
    implication of 7% among dominantly inherited cerebellar ataxias. This is a
    diagnostic yield in a selected cohort, not a population prevalence. No population prevalence, incidence or carrier frequency for
    SCA48 has been established; the figure is recorded because it is the best
    available measure of how often SCA48 is encountered among dominant
    ataxias. measure_type is UNKNOWN because diagnostic yield is not one of
    the enumerated epidemiological measures.
  evidence:
  - reference: PMID:32713943
    reference_title: "Clinical, neuropathological, and genetic characterization of STUB1 variants in cerebellar ataxias: a frequent cause of predominant cognitive impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our results reveal an unexpectedly frequent (7%) implication of STUB1 among dominantly inherited cerebellar ataxias, and suggest that the penetrance of STUB1 variants could be modulated by other factors, including sex and variants in other ataxia-related genes."
    explanation: >-
      Source of the 7% figure and of the accompanying caution that penetrance
      is modulated by other factors.

- population: Unrelated patients with adult-onset dominant or sporadic cerebellar ataxia negative for common repeat expansions (Italy, 235 patients)
  measure_type: UNKNOWN
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    SCA48 accounted for 3.4% (8/235) of the cohort. Diagnostic yield, not
    population prevalence. The yield rises to 23.5%
    (4/17) when only familial cases are considered, illustrating how strongly
    the figure depends on cohort ascertainment.
  evidence:
  - reference: PMID:31571321
    reference_title: "The complex phenotype of spinocerebellar ataxia type 48 in eight unrelated Italian families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "giving an estimated overall frequency of 3.4% (8/235) for SCA48 in our study cohort, rising to 23.5% (4/17) when considering only familial cases"
    explanation: >-
      Provides both the overall and familial-only diagnostic yields quoted in
      the notes.

diagnosis:
- name: STUB1 sequencing with parallel TBP repeat sizing
  description: >-
    Diagnosis rests on identifying a heterozygous pathogenic STUB1 variant in
    a patient with a compatible progressive ataxia-plus-cognitive phenotype
    and cerebellar atrophy on MRI. Because STUB1 is a conventional
    (non-repeat) gene it is missed by the repeat-expansion panels used
    first-line in dominant ataxia, so it must be covered by a sequencing panel
    or exome/genome test. TBP CAG/CAA repeat length should be sized in
    parallel: it alters expected penetrance, severity and recurrence-risk
    counselling even though it is not required for the diagnosis.
  evidence:
  - reference: PMID:31571321
    reference_title: "The complex phenotype of spinocerebellar ataxia type 48 in eight unrelated Italian families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Molecular screening was performed in a cohort of 235 unrelated patients with adult-onset, autosomal dominant (17) or sporadic (218) cerebellar ataxia, negative for pathological trinucleotide expansions in the common SCAs, FRDA and FXTAS loci, by using targeted multigene panels or whole-exome sequencing."
    explanation: >-
      Describes the diagnostic route by which SCA48 is actually found -
      sequencing after negative repeat-expansion testing.
  - reference: PMID:36799493
    reference_title: "Complex Ataxia-Dementia Phenotype in Patients with Digenic TBP/STUB1 Spinocerebellar Ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The independent segregation of TBP and STUB1 alleles needs to be considered for recurrence risk and predictive genetic tests."
    explanation: >-
      Supports sizing TBP alongside STUB1 for counselling purposes.

differential_diagnoses:
- name: SCAR16 / Gordon Holmes syndrome (biallelic STUB1)
  disease_term:
    preferred_term: cerebellar ataxia-hypogonadism syndrome
    term:
      id: MONDO:0008935
      label: cerebellar ataxia-hypogonadism syndrome
  description: >-
    The allelic autosomal recessive STUB1 disorder, curated in this knowledge
    base as Cerebellar Ataxia-Hypogonadism Syndrome. It shares the ataxia,
    cognitive dysfunction, hyperkinetic movement disorder and epilepsy of
    SCA48, so the two form a continuous clinical spectrum rather than
    separable syndromes.
  distinguishing_features:
  - >-
    SCAR16 is biallelic and typically earlier in onset, with spastic ataxia,
    peripheral neuropathy and hypogonadotropic hypogonadism; SCA48 is
    heterozygous, adult-onset, and defined by the cerebellar
    cognitive-affective syndrome, with pyramidal and peripheral nervous system
    signs conspicuously absent in some cohorts. Hypogonadism is rare in SCA48
    - the eight-family Italian series reported it in one patient, in whom it
    was accompanied by other autoimmune endocrine dysfunction.
  evidence:
  - reference: PMID:32342324
    reference_title: "Spinocerebellar ataxia type 48: last but not least."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "SCAR16 is characterized by early onset spastic ataxia and a wide disease spectrum, including cognitive dysfunction, hyperkinetic disorders, epilepsy, peripheral neuropathy, and hypogonadism."
    explanation: >-
      Characterises the recessive counterpart and the features that pull a
      case towards it.
  - reference: PMID:32342324
    reference_title: "Spinocerebellar ataxia type 48: last but not least."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The overlap of several clinical signs between SCAR16 and SCA48 indicates the presence of a continuous clinical spectrum among recessively and dominantly inherited mutations of STUB1."
    explanation: >-
      States the continuity of the two entities, which is why zygosity rather
      than phenotype alone settles the distinction.
  - reference: PMID:31571321
    reference_title: "The complex phenotype of spinocerebellar ataxia type 48 in eight unrelated Italian families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CCAS also occurred frequently, whereas definite signs of pyramidal tract dysfunction and peripheral nervous system involvement were absent. One SCA48 patient presented with hypogonadism, associated with other autoimmune endocrine dysfunctions."
    explanation: >-
      Supports both distinguishing points: absent pyramidal/peripheral signs
      in this SCA48 cohort, and hypogonadism as a single-patient exception.

- name: Spinocerebellar ataxia 17 (TBP)
  description: >-
    SCA17 is caused by fully penetrant TBP CAG/CAA expansions above 49
    repeats and is the principal Huntington-disease-like SCA. It is the
    critical differential because intermediate TBP alleles sit at the
    interface between the two disorders.
  distinguishing_features:
  - >-
    SCA17 with TBP>=47 alleles is a monogenic dominant disorder; intermediate
    TBP40-49 alleles are incompletely penetrant and their carriers usually
    also carry a STUB1 variant. Patients with both genotypes have more severe
    multidomain dementia and greater cerebellar and brainstem volume loss than
    those with fully expanded TBP alleles alone.
  evidence:
  - reference: PMID:34906452
    reference_title: "Digenic inheritance of STUB1 variants and TBP polyglutamine expansions explains the incomplete penetrance of SCA17 and SCA48."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "demonstrate a dual inheritance pattern for SCA17, which is a monogenic dominant disorder for TBP≥47 alleles and a digenic TBP/STUB1 disease (SCA17-DI) for intermediate expansions"
    explanation: >-
      Defines the repeat-length boundary that separates monogenic SCA17 from
      the STUB1-associated intermediate-allele form.
  - reference: PMID:36799493
    reference_title: "Complex Ataxia-Dementia Phenotype in Patients with Digenic TBP/STUB1 Spinocerebellar Ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SCATBP/STUB1 patients had multi-domain dementia with a more severe impairment in respect to patient carrying only fully expanded SCA17 alleles."
    explanation: >-
      Supports the severity distinction between the combined genotype and
      monogenic SCA17.

- name: Multiple system atrophy, cerebellar type (MSA-C)
  disease_term:
    preferred_term: multiple system atrophy, cerebellar type
    term:
      id: MONDO:0016418
      label: multiple system atrophy, cerebellar type
  description: >-
    Sporadic adult-onset cerebellar ataxia with parkinsonism and urinary
    symptoms is the MSA-C presentation, and it overlaps closely with the SCA48
    phenotype set. Most SCA48 patients reach genetic testing only after
    repeat-expansion panels come back negative, so MSA-C is a realistic
    competing label at that point.
  distinguishing_features:
  - >-
    MSA-C is a sporadic synucleinopathy with prominent autonomic failure and a
    median survival of 8-10 years; SCA48 is dominantly inherited, slowly
    progressive over decades, and is defined by the cerebellar
    cognitive-affective syndrome rather than by dysautonomia. Dentate T2
    hyperintensity with postero-lateral hemispheric atrophy (the crab sign) and
    a family history point to SCA48; a STUB1 variant settles it.
  evidence:
  - reference: PMID:42501123
    reference_title: "Multiple system atrophy: cure and care."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Multiple system atrophy (MSA) is a rare and rapidly progressive neurodegenerative disorder characterized by a variable combination of autonomic failure, parkinsonism, and cerebellar ataxia, with a median survival of 8-10 years from symptom onset."
    explanation: >-
      Characterises MSA and gives the two features that separate it from SCA48
      - prominent autonomic failure and a rapid course. Graded OTHER because
      this is a narrative review rather than a primary clinical study.
  - reference: PMID:32342324
    reference_title: "Spinocerebellar ataxia type 48: last but not least."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "SCA48 is an adult-onset syndrome characterized by ataxia and cognitive-psychiatric features, variably associated with chorea, parkinsonism, dystonia, and urinary symptoms."
    explanation: >-
      Documents the SCA48 side of the overlap - adult-onset ataxia with
      parkinsonism and urinary symptoms - which is what makes MSA-C a live
      alternative before genetic testing.

- name: Frontotemporal dementia and Huntington disease phenocopies
  description: >-
    Because the cognitive-affective syndrome can dominate and precede ataxia,
    and because chorea occurs, SCA48 can present as an apparent
    frontotemporal dementia or Huntington disease phenocopy.
  distinguishing_features:
  - >-
    Cerebellar atrophy with dentate T2 hyperintensity on MRI, and cerebellar
    signs on examination, redirect the diagnosis. Screening in the reverse
    direction has a low yield: no STUB1 variant was found in 115 patients with
    frontotemporal dementia, so STUB1 should be pursued when the phenotype has
    a cerebellar component rather than in unselected FTD.
  evidence:
  - reference: PMID:32713943
    reference_title: "Clinical, neuropathological, and genetic characterization of STUB1 variants in cerebellar ataxias: a frequent cause of predominant cognitive impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "including five families with Huntington or frontotemporal dementia disease-like phenotypes associated with ataxia, while no STUB1 variant was found in 115 patients with frontotemporal dementia"
    explanation: >-
      Supports both the phenocopy presentation and the negative yield of
      unselected FTD screening.

treatments:
- name: Multidisciplinary Supportive Care
  description: >-
    No disease-modifying therapy exists for SCA48, and no SCA48-specific
    interventional trial has been reported. Management is symptomatic and
    coordinated across neurology, clinical genetics, rehabilitation,
    neuropsychology/psychiatry, speech-language pathology and dietetics.
    Expert consensus for degenerative cerebellar disorders is that no
    medication has been shown to be effective outside episodic ataxia type 2,
    so pharmacological trials should be framed as symptomatic and
    individualised rather than disease-modifying.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:24222635
    reference_title: "Consensus paper: management of degenerative cerebellar disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "There is consensus that up to date, no medication has been proven effective."
    explanation: >-
      Expert consensus across degenerative cerebellar ataxias establishes the
      absence of proven pharmacotherapy, which is the premise of a supportive
      management strategy.

- name: Physiotherapy and Coordinative Training
  description: >-
    Physiotherapy is the mainstay of treatment for degenerative cerebellar
    ataxia, together with occupational therapy and speech therapy. A
    meta-analysis of 18 randomised trials in degenerative cerebellar ataxia
    found a significant reduction in SARA score with physiotherapy, with
    multi-aspect, balance and aerobic training each showing effects; the
    certainty of evidence was low and no trial was SCA48-specific, so this is
    generalised from the degenerative-ataxia population.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Physical Therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  target_phenotypes:
  - preferred_term: Cerebellar ataxia
    term:
      id: HP:0001251
      label: Ataxia
  evidence:
  - reference: PMID:24222635
    reference_title: "Consensus paper: management of degenerative cerebellar disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "As such, all authors agreed that the mainstays of treatment of degenerative cerebellar ataxia are currently physiotherapy, occupational therapy, and speech therapy."
    explanation: >-
      Expert consensus identifies physiotherapy as the mainstay of management
      for this class of disorder.
  - reference: PMID:39866519
    reference_title: "Effects of physiotherapy on degenerative cerebellar ataxia: a systematic review and meta-analysis."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Overall, physiotherapy significantly reduced SARA scores (MD = -1.41, [95% CI: -2.16, -0.66])"
    explanation: >-
      Quantifies the effect in the degenerative-ataxia population. Recorded as
      INDIRECT because the pooled trials were not SCA48-specific, and the
      review itself reports a serious risk of bias and low certainty of
      evidence.

- name: Speech and Swallowing Therapy
  description: >-
    Speech therapy addresses the cerebellar dysarthria that is present in
    essentially all SCA48 patients, and swallowing assessment becomes relevant
    as the disease advances.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: speech and swallowing therapy
    term:
      id: NCIT:C159273
      label: Speech Language Therapy
  target_phenotypes:
  - preferred_term: Dysarthria
    term:
      id: HP:0001260
      label: Dysarthria
  - preferred_term: Dysphagia
    term:
      id: HP:0002015
      label: Dysphagia
  evidence:
  - reference: PMID:24222635
    reference_title: "Consensus paper: management of degenerative cerebellar disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "the mainstays of treatment of degenerative cerebellar ataxia are currently physiotherapy, occupational therapy, and speech therapy"
    explanation: >-
      Speech therapy is named among the consensus mainstays of management for
      degenerative cerebellar ataxia.

- name: Occupational Therapy
  description: >-
    Occupational therapy supports activities of daily living, home safety and
    fall prevention as gait ataxia, tremor and dysmetria progress.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: occupational therapy
    term:
      id: NCIT:C121351
      label: Occupational Therapy
  evidence:
  - reference: PMID:24222635
    reference_title: "Consensus paper: management of degenerative cerebellar disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "the mainstays of treatment of degenerative cerebellar ataxia are currently physiotherapy, occupational therapy, and speech therapy"
    explanation: >-
      Occupational therapy is named among the consensus mainstays of
      management.

- name: Genetic Counselling and Cascade Testing
  description: >-
    Counselling must cover the 50% transmission risk, the incomplete and
    age-dependent penetrance of heterozygous STUB1 variants, the possibility
    of de novo occurrence, and the effect of TBP repeat length on expected
    penetrance and severity. Because TBP and STUB1 alleles segregate
    independently, recurrence-risk calculation and predictive testing in
    families carrying both must account for that independence.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:36799493
    reference_title: "Complex Ataxia-Dementia Phenotype in Patients with Digenic TBP/STUB1 Spinocerebellar Ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The identification of the complex SCATBP/STUB1 phenotype may impact on diagnosis and genetic counseling in the families with both hereditary and sporadic ataxia. The independent segregation of TBP and STUB1 alleles needs to be considered for recurrence risk and predictive genetic tests."
    explanation: >-
      States the specific counselling complication that this treatment entry
      exists to capture.
  - reference: PMID:36422518
    reference_title: "Intermediate repeat expansions of TBP and STUB1: Genetic modifier or pure digenic inheritance in spinocerebellar ataxias?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This distinction from what has been proposed before has crucial consequences for genetic counseling in SCA48."
    explanation: >-
      Confirms that the modifier-versus-digenic resolution changes what
      families are told.

animal_models:
- species: Danio rerio
  genotype: stub1 mutant with truncated Chip U-box domain
  description: >-
    A zebrafish stub1 mutant truncating the functional U-box domain shows
    impaired ubiquitination of Hsc70 and of Chip itself, decreased total brain
    26S proteasome activity, reduced Purkinje cell number and soma size,
    abnormal Purkinje dendrite organisation, and behavioural changes. It
    recapitulates the cellular Purkinje phenotype but not the gross cerebellar
    atrophy of human disease, which is its main limitation. stub1 mRNA is
    predominantly expressed in the cerebellum including the Purkinje cell
    layer, consistent with the cell-type selectivity of the human disorder.
  publication: PMID:34630034
  modeled_mechanisms:
  - target: Impaired Chaperone-Assisted Protein Quality Control
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Truncating the Chip U-box abolishes ubiquitination of Hsc70 and of Chip
      itself and lowers whole-brain 26S proteasome activity, reproducing the
      molecular lesion of U-box SCA48 variants.
    evidence:
    - reference: PMID:34630034
      reference_title: "Chip Protein U-Box Domain Truncation Affects Purkinje Neuron Morphology and Leads to Behavioral Changes in Zebrafish."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Recombinant wild-type zebrafish Chip showed ubiquitin ligase activity highly comparable to human CHIP, while the mutant Chip protein showed impaired ubiquitination of the Hsc70 substrate and Chip itself."
      explanation: >-
        Establishes that the zebrafish enzyme is functionally equivalent to
        human CHIP and that the mutant loses the same activity, which is what
        makes this model informative for the human quality-control node.
  - target: Cerebellar Purkinje Cell Degeneration
    relationship: RECAPITULATES
    fidelity: MODERATE
    limitations: >-
      Purkinje cell number, soma size and dendritic organisation are abnormal,
      but the fish show no gross cerebellar atrophy, so the model captures the
      cellular phenotype without the tissue-level one.
    evidence:
    - reference: PMID:34630034
      reference_title: "Chip Protein U-Box Domain Truncation Affects Purkinje Neuron Morphology and Leads to Behavioral Changes in Zebrafish."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "these fish displayed reduced numbers and sizes of Purkinje cell bodies and abnormal organization of Purkinje cell dendrites"
      explanation: >-
        The measured Purkinje cell phenotype is what licenses treating this
        model as informative for the human Purkinje degeneration node.
  evidence:
  - reference: PMID:34630034
    reference_title: "Chip Protein U-Box Domain Truncation Affects Purkinje Neuron Morphology and Leads to Behavioral Changes in Zebrafish."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In the brain, stub1 mRNA was predominantly detected in the cerebellum, including the Purkinje cell layer and granular layer."
    explanation: >-
      Expression pattern supports cerebellar and Purkinje cell selectivity in
      the model organism.
  - reference: PMID:34630034
    reference_title: "Chip Protein U-Box Domain Truncation Affects Purkinje Neuron Morphology and Leads to Behavioral Changes in Zebrafish."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In conclusion, truncation of the Chip U-box domain leads to impaired ubiquitin ligase activity and behavioral and anatomical changes in zebrafish, illustrating the potential of zebrafish to study STUB1-mediated diseases."
    explanation: >-
      Summarises the model's recapitulation of the molecular lesion and its
      behavioural and anatomical consequences.

- species: Caenorhabditis elegans
  genotype: transgenic expression of human CHIP p.Ala52Gly
  description: >-
    A transgenic C. elegans line expressing the de novo SCA48 CHIP A52G
    variant develops neurodegeneration, providing a variant-specific in vivo
    readout. The organism has no cerebellum, so the model addresses
    proteostatic neurotoxicity rather than the human cerebellar syndrome.
  publication: PMID:35398354
  modeled_mechanisms:
  - target: CHIP Loss of Function from Heterozygous STUB1 Variants
    relationship: RECAPITULATES
    fidelity: LOW
    description: >-
      Expression of the human CHIP A52G SCA48 variant causes neurodegeneration
      in an intact organism.
    limitations: >-
      C. elegans has no cerebellum and no Purkinje cells, so the model speaks
      to proteostatic neurotoxicity rather than to the cerebellar syndrome.
    evidence:
    - reference: PMID:35398354
      reference_title: "The molecular basis of spinocerebellar ataxia type 48 caused by a de novo mutation in the ubiquitin ligase CHIP."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "induces neurodegeneration in a transgenic Caenorhabditis elegans model of SCA48"
      explanation: >-
        The patient-derived variant causes neurodegeneration in the transgenic
        worm, which is the basis for treating the model as informative for the
        CHIP dysfunction node. Recorded as INDIRECT because the organism has no
        cerebellum, so relevance to the human node requires an inference step.
  evidence:
  - reference: PMID:35398354
    reference_title: "The molecular basis of spinocerebellar ataxia type 48 caused by a de novo mutation in the ubiquitin ligase CHIP."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We further show that this mutant decreases cellular fitness in response to certain cellular stressors and induces neurodegeneration in a transgenic Caenorhabditis elegans model of SCA48."
    explanation: >-
      Documents neurodegeneration caused by an SCA48 variant in an intact
      organism.

discussions:
- discussion_id: sca48-tbp-modifier-magnitude
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    How large is the TBP modifier effect on SCA48 penetrance, and does it
    extend to other repeat loci?
  attaches_to:
  - pathophysiology#TBP Intermediate Repeat Expansion as a Genetic Modifier
  rationale: >-
    The modifier reading of the STUB1/TBP interaction is well supported, but
    its magnitude is not quantified: there is no penetrance estimate stratified
    by TBP repeat length, variant domain, age and sex. The same cohort that
    reported the 7% yield also reported second hits in AFG3L2 and PRKCG in
    three families and a 70% female excess, neither of which has been
    replicated. Until these are quantified, prognostic counselling for a
    STUB1-positive individual rests on cohort-level associations rather than
    an individual risk estimate.
  proposed_experiments:
  - experiment_id: exp_sca48_penetrance_registry
    name: Genotype-curated SCA48 penetrance registry with TBP sizing
    description: >-
      Prospective, genotype-curated multicentre registry with TBP repeat sizing
      on all STUB1 variant carriers, including asymptomatic relatives, powered
      to estimate age-specific penetrance stratified by TBP repeat length, CHIP
      domain and sex, with independent replication of the reported female
      excess and of the AFG3L2/PRKCG second hits.
    decision_criterion: >-
      An age-specific penetrance curve that separates by TBP repeat length with
      non-overlapping confidence intervals would establish the magnitude of the
      modifier effect; overlapping curves would place an upper bound on it.
  evidence:
  - reference: PMID:32713943
    reference_title: "Clinical, neuropathological, and genetic characterization of STUB1 variants in cerebellar ataxias: a frequent cause of predominant cognitive impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This screening of STUB1 variants revealed new features: (1) the majority of patients were women (70%) and (2) \"second hits\" in AFG3L2, PRKCG, and TBP were detected in three families suggesting synergic effects."
    explanation: >-
      Source of the unreplicated sex ratio and additional candidate modifier
      loci that this gap asks to be quantified or refuted.

- discussion_id: sca48-mitophagy-human-relevance
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does CHIP-dependent mitophagy dysregulation contribute to Purkinje cell
    loss in human SCA48?
  attaches_to:
  - pathophysiology#Dysregulated PINK1/Parkin-Mediated Mitophagy
  rationale: >-
    CHIP negatively regulates PINK1/Parkin mitophagy and disease-associated
    CHIP variants dysregulate it in cell culture and in C. elegans neurons,
    but no human SCA48 tissue has been examined for mitophagy or mitochondrial
    pathology. The node is therefore recorded with PROVISIONAL confidence and
    an indirect downstream edge. A comparable candidate mechanism - impaired
    heat-shock response - was tested in SCAR16 (biallelic) patient iPSC-derived
    neurons against isogenic STUB1-null controls and did not survive, which is
    the cautionary precedent here.
  proposed_experiments:
  - experiment_id: exp_sca48_mitophagy_human_neurons
    name: Mitophagy flux in SCA48 patient iPSC-derived Purkinje-like neurons
    description: >-
      Measure mitophagy flux, PINK1/Parkin recruitment and mitochondrial
      morphology in iPSC-derived Purkinje-like neurons from patients carrying
      dominant SCA48 STUB1 variants against isogenic corrected controls, and
      stain the existing SCA48 autopsy cerebellum series for mitochondrial and
      PINK1/Parkin pathology.
    decision_criterion: >-
      A mitophagy defect present in patient neurons but absent from isogenic
      controls, and corroborated in autopsy tissue, would move this node from
      PROVISIONAL to ESTABLISHED; a null result matching the heat-shock-response
      precedent would justify removing the node.
  evidence:
  - reference: PMID:33097556
    reference_title: "CHIP mutations affect the heat shock response differently in human fibroblasts and iPSC-derived neurons."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Furthermore, STUB1(-/-) neurons generated by CRISPR/Cas9-mediated genome editing from an isogenic healthy control line showed a similar HSR to patients."
    explanation: >-
      The precedent for the caution: a plausible CHIP-linked mechanism failed
      when tested in the right cell type with isogenic controls. The patient
      lines were SCAR16 (biallelic), so the precedent bears on CHIP biology
      generally rather than on SCA48 zygosity specifically.

datasets:
- accession: geo:GSE310700
  title: Transcriptomic analysis of STUB1 knockdown in HEK293 cells under normal and heat-shock conditions
  data_type: BULK_RNA_SEQ
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  publication: PMID:42567515
  notes: >-
    RNA-seq of STUB1 knockdown under normal and heat-shock conditions, the
    CHIP-insufficiency model reported in the SCA48 domain-uncoupling study
    (PMID:42567515). It is a HEK293 cell system, not a neuronal or patient one,
    so it speaks to the transcriptional consequences of reduced CHIP dosage
    rather than to Purkinje cell biology. No patient-derived SCA48
    transcriptomic, proteomic or single-cell dataset was found.

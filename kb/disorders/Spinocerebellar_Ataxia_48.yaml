- name: Cerebellar Atrophy and Dentate Nucleus Involvement
  description: >-
    At tissue level, SCA48 produces cerebellar atrophy involving both vermis
    and hemispheres with a postero-lateral hemispheric predominance,
    accompanied in around 90% of patients by T2-weighted hyperintensity of
    both dentate nuclei; the combination is described as the "crab sign". The
    topography is not uniform over time. In the discovery pedigree,
    presymptomatic carriers already had focal atrophy restricted to the
    vermis, paravermis and the medial parts of lobules VI and VII - cerebellar
    territories serving cognition and emotion - before any ataxia, with later
    spread to the whole cerebellum. This staged topography is what makes the
    cognitive-affective syndrome precede the motor syndrome.
  biological_scale: TISSUE
  locations:

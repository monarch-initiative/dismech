    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Atrophy of the cerebellum was present in all cases, involving both the vermis and the hemispheres, but particularly affecting the postero-lateral portions of the cerebellar hemispheres."
    explanation: >-
      Defines the tissue-level topography of atrophy in a dedicated SCA48
      imaging series.
  - reference: PMID:32285148
    reference_title: "The \"crab sign\": an imaging feature of spinocerebellar ataxia type 48."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In all patients, with the exception of only one subject (90.0% of the cases), a T2WI hyperintensity of both dentate nuclei was found."
    explanation: >-
      Documents dentate nucleus involvement and quantifies it, supporting the
      inclusion of the dentate nucleus as an affected structure.
  - reference: PMID:30381368
    reference_title: "Heterozygous STUB1 mutation causes familial ataxia with cognitive affective syndrome (SCA48)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three presymptomatic patients showed focal cerebellar atrophy in the vermian, paravermian, and the medial part of cerebellar lobes VI and VII, suggesting that cerebellar atrophy preceded the ataxia, and that the neurodegeneration begins in cerebellar areas related to cognition and emotion, spreading later to the whole cerebellum."
    explanation: >-
      Establishes the staged topography - cognitive/affective cerebellar
      territories first, whole cerebellum later - that this node asserts.
  downstream:
  - target: Disruption of Cerebello-Cerebral Motor and Cognitive Circuits
    description: >-
      Loss of cerebellar cortical output and dentate/efferent pathway
      involvement corrupts the cerebellar contribution to both motor and
      cognitive-affective circuits.
    causal_link_type: DIRECT
  - target: Cerebellar atrophy
    description: >-
      The tissue-level volume loss is what is observed clinically as cerebellar

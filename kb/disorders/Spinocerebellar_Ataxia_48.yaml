      reference_title: "Heterozygous STUB1 mutation causes familial ataxia with cognitive affective syndrome (SCA48)."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We report a heterozygous STUB1 pathogenic genetic variant causing dominant cerebellar ataxia."
      explanation: >-
        The discovery study establishes SCA48 as a Mendelian, dominantly

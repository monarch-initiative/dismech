    term:
      id: UBERON:0002129
      label: cerebellar cortex
  evidence:
  - reference: PMID:32713943
    reference_title: "Clinical, neuropathological, and genetic characterization of STUB1 variants in cerebellar ataxias: a frequent cause of predominant cognitive impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report neuropathological findings of a STUB1 heterozygous patient, showing massive loss of Purkinje cells in the vermis and major loss in the cerebellar hemispheres without atrophy of the pons, hippocampus, or cerebral cortex."
    explanation: >-
      Human autopsy in a heterozygous (i.e. SCA48, not SCAR16) patient
      localises the degeneration to Purkinje cells with a vermian gradient.
  - reference: PMID:32211513
    reference_title: "Heterozygous STUB1 missense variants cause ataxia, cognitive decline, and STUB1 mislocalization."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The normal pattern of polarized somatodendritic STUB1 protein expression in PCs was lost, resulting in aberrant STUB1 localization in the distal PC dendritic arbors."
    explanation: >-
      Adds a cell-autonomous subcellular abnormality in surviving Purkinje
      cells, indicating the degeneration is not only a loss of cell number.
  - reference: PMID:34630034
    reference_title: "Chip Protein U-Box Domain Truncation Affects Purkinje Neuron Morphology and Leads to Behavioral Changes in Zebrafish."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM

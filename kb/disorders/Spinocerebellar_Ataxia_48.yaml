- name: TBP Intermediate Repeat Expansion as a Genetic Modifier
  description: >-
    Intermediate-length CAG/CAA repeat expansions in TBP (roughly 40-49
    repeats), which are themselves incompletely penetrant for SCA17, co-occur
    with heterozygous STUB1 variants far more often than chance. The original
    interpretation was digenic inheritance - TBP41-46 alleles and STUB1
    variants cosegregating, with neither genotype alone associated with
    disease - and this reading questioned whether SCA48 exists as a monogenic
    entity at all. Subsequent work resolved the question in favour of a
    modifier model rather than obligate digenic inheritance: probands with the
    full SCA48 phenotype and normal TBP alleles exclude digenic inheritance as
    the sole mode, while longer TBP repeats predict more cognitive impairment
    and faster progression. Patients carrying both genotypes have a more
    severe, fully penetrant multidomain ataxia-dementia phenotype with reduced
    cerebellar and brainstem volumes. This node therefore modifies the
    severity and penetrance of the main chain rather than initiating it.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  genes:
  - preferred_term: TBP
    term:
      id: hgnc:11588
      label: TBP
  evidence:
  - reference: PMID:34906452
    reference_title: "Digenic inheritance of STUB1 variants and TBP polyglutamine expansions explains the incomplete penetrance of SCA17 and SCA48."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All except 1 (30/31) of the index cases with TBP41-46 alleles carried a heterozygous pathogenic variant in the STUB1 gene associated with spinocerebellar ataxias SCAR16 (autosomal recessive) and SCA48 (autosomal dominant)."
    explanation: >-
      Documents the strong non-random co-occurrence of intermediate TBP
      alleles with STUB1 variants that motivated the digenic hypothesis.
  - reference: PMID:34906452
    reference_title: "Digenic inheritance of STUB1 variants and TBP polyglutamine expansions explains the incomplete penetrance of SCA17 and SCA48."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "raise questions on the existence of SCA48 as a monogenic disease with crucial implications for diagnosis and counseling"
    explanation: >-
      Recorded as REFUTE because this sentence argues against the modifier
      framing this node asserts - the authors read the same STUB1/TBP
      interaction as obligate digenic inheritance rather than as modification
      of a monogenic disorder. It is kept on the node so the position the later
      literature had to answer is visible here; the digenic reading itself is
      curated under the sca48_tbp_digenic hypothesis.
  - reference: PMID:36422518
    reference_title: "Intermediate repeat expansions of TBP and STUB1: Genetic modifier or pure digenic inheritance in spinocerebellar ataxias?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We show that intermediate TBP40-49 alleles act as disease modifiers of SCA48 rather than a STUB1/TBP digenic model."
    explanation: >-
      The direct answer to the digenic hypothesis from the same kind of
      cohort: the interaction is modifier, not obligate digenic.
  - reference: PMID:36422518
    reference_title: "Intermediate repeat expansions of TBP and STUB1: Genetic modifier or pure digenic inheritance in spinocerebellar ataxias?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The longer the TBP repeat length, the more likely the occurrence of cognitive impairment (P = .0129) and the faster the disease progression until death (P = .0003)."
    explanation: >-
      Quantifies the dose-dependent modifier effect on the cognitive phenotype
      and on progression rate.
  - reference: PMID:36799493
    reference_title: "Complex Ataxia-Dementia Phenotype in Patients with Digenic TBP/STUB1 Spinocerebellar Ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cerebellar volume and thickness of cerebellar cortex were reduced in SCATBP/STUB1 compared with SCA17 patients (P = 0.03; P = 0.008). Basal ganglia volumes were reduced in both patient groups, as compared with controls, whereas brainstem volumes were significantly reduced in SCATBP/STUB1 , but not in SCA17 patients."
    explanation: >-
      Characterises the more severe structural phenotype of the combined
      genotype, supporting a modifier effect that is visible on imaging.
  - reference: PMID:39950762
    reference_title: "TBP Repeat Expansion Analysis in Patients Carrying Heterozygous STUB1 Variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Heterozygous STUB1 variants are associated with a milder phenotype and reduced penetrance compared with the cosegregation with intermediate TBP alleles, which causes a fully penetrant complicated form of cerebellar ataxia."
    explanation: >-
      States the penetrance consequence of the modifier: STUB1 alone is milder
      and incompletely penetrant, STUB1 plus intermediate TBP is fully
      penetrant.
  downstream:
  - target: Disruption of Cerebello-Cerebral Motor and Cognitive Circuits
    description: >-
      Co-inherited intermediate TBP expansions increase the penetrance and
      severity of the SCA48 phenotype, particularly its cognitive component,
      rather than causing a separate disease process.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:38973070
      reference_title: "A New Case Series Suggests That SCA48 (ATX/STUB1) Is Primarily a Monogenic Disorder."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Still, co-occurrence of TBP 41-42 or high-normal TBP40 alleles was relatively frequent and associated with marked cognitive defects (28.5%), suggesting a modifying effect on clinical expression in some cases."
      explanation: >-
        Supports the modifier edge specifically - TBP allele length modifying
        the clinical expression of the STUB1 phenotype - in a cohort whose
        main conclusion is that SCA48 is monogenic.

mechanistic_hypotheses:
- hypothesis_group_id: sca48_monogenic
  hypothesis_label: SCA48 as a monogenic STUB1 disorder
  status: CANONICAL
  description: >-
    A heterozygous pathogenic STUB1 variant is by itself sufficient to cause
    the SCA48 phenotype. Multiple independent series report probands with the
    complete clinical picture - ataxia, dysarthria, cerebellar atrophy and
    cognitive impairment - and TBP repeat lengths within the normal range.
  evidence:
  - reference: PMID:36422518
    reference_title: "Intermediate repeat expansions of TBP and STUB1: Genetic modifier or pure digenic inheritance in spinocerebellar ataxias?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Importantly, 13 STUB1 probands presenting with the full SCA48 clinical phenotype had normal TBP37-39 alleles, excluding digenic inheritance as the sole mode."
    explanation: >-
      Thirteen probands with normal TBP alleles and the full phenotype
      directly establish that STUB1 alone suffices.
  - reference: PMID:38973070
    reference_title: "A New Case Series Suggests That SCA48 (ATX/STUB1) Is Primarily a Monogenic Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SCA48 is predominantly a monogenic disorder, because most patients carried an isolated, heterozygous STUB1 variant and presented with the typical combined phenotype of ataxia and cognitive dysfunction."
    explanation: >-
      An independent 21-patient cohort reaches the same conclusion.
  - reference: PMID:39680235
    reference_title: "Case Series of Cerebellar Ataxia with Tremor Due to Heterozygous STUB1 Variants (SCA48) without TBP Expansions: Further Evidence for SCA48 as a Monogenic Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our cases lacked pathological TBP expansions and provide additional evidence that STUB1 (SCA48) can manifest as a monogenic disease."
    explanation: >-
      Three further unrelated probands with normal TBP repeats support the
      monogenic model.
  - reference: PMID:38625442
    reference_title: "Two more families supporting the existence of monogenic spinocerebellar ataxia 48."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This report provides supportive evidence that this specific ataxia can also occur as a monogenic disease, considering classical TBP allelic ranges."
    explanation: >-
      Two additional families with the same STUB1 variant and normal TBP
      alleles.

- hypothesis_group_id: sca48_tbp_digenic
  hypothesis_label: Obligate digenic TBP/STUB1 inheritance
  status: DEPRECATED
  description: >-
    The competing model held that SCA48 is not a monogenic entity but the
    digenic product of a heterozygous STUB1 variant plus an intermediate-length
    TBP expansion, with neither genotype pathogenic alone. This was a serious
    proposal supported by near-complete co-occurrence in one cohort. It is
    recorded as rejected in its strong form: probands with the full phenotype
    and normal TBP alleles exclude obligate digenic inheritance. The weaker
    modifier claim survives and is curated in the "TBP Intermediate Repeat
    Expansion as a Genetic Modifier" pathophysiology node.
  evidence:
  - reference: PMID:34906452
    reference_title: "Digenic inheritance of STUB1 variants and TBP polyglutamine expansions explains the incomplete penetrance of SCA17 and SCA48."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "TBP41-46 expansions and STUB1 variants cosegregate in all affected family members, whereas the presence of either TBP41-46 expansions or STUB1 variants individually was never associated with the disease."
    explanation: >-
      The observation on which the digenic hypothesis rested, quoted from the
      paper that proposed it.
  - reference: PMID:36422518
    reference_title: "Intermediate repeat expansions of TBP and STUB1: Genetic modifier or pure digenic inheritance in spinocerebellar ataxias?"
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Importantly, 13 STUB1 probands presenting with the full SCA48 clinical phenotype had normal TBP37-39 alleles, excluding digenic inheritance as the sole mode."
    explanation: >-
      Direct refutation of obligate digenic inheritance in a cohort assembled
      to test it.

phenotypes:
- category: Neurologic
  name: Ataxia
  description: >-
    Progressive cerebellar ataxia is the core motor phenotype: truncal and
    gait instability with limb incoordination, typically of adult onset and
    slowly progressive. In the discovery pedigree truncal ataxia was a late
    development, appearing after years of cognitive-affective symptoms; in
    other families ataxia is the presenting complaint.
  phenotype_term:
    preferred_term: Cerebellar ataxia
    term:
      id: HP:0001251
      label: Ataxia
    clinical_course: PROGRESSIVE
    onset:
      onset_category: ADULT
      min_age_years: 17
      max_age_years: 74
      notes: >-
        Onset is characteristically adult but the range is wide. An independent
        three-proband series reported onset at 34-65 years; the largest cohort
        (n=50 STUB1 carriers) reported a 17-74 year range and emphasised that
        both age at onset and severity are remarkably variable.
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:31571321
    reference_title: "The complex phenotype of spinocerebellar ataxia type 48 in eight unrelated Italian families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All our SCA48 patients had cerebellar ataxia and dysarthria associated with cerebellar atrophy on brain magnetic resonance imaging; of note, many cases were also associated with parkinsonism, chorea and dystonia."
    explanation: >-
      Cerebellar ataxia was present in all 11 patients across eight independent
      SCA48 index families (11/11 = 100%), which is the derived count
      supporting the VERY_FREQUENT band (80-100%).
  - reference: PMID:39680235
    reference_title: "Case Series of Cerebellar Ataxia with Tremor Due to Heterozygous STUB1 Variants (SCA48) without TBP Expansions: Further Evidence for SCA48 as a Monogenic Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All presented with slowly progressive cerebellar ataxia with tremor and additional findings of dysarthria, parkinsonism, hypertonia, cognitive and psychiatric symptoms. Age of onset varied from 34 to 65 years of age."
    explanation: >-
      Confirms the slowly progressive course and adult onset in an
      independent, TBP-negative case series, and is the source of the 34-65
      year onset range recorded in the onset notes.
  - reference: PMID:32713943
    reference_title: "Clinical, neuropathological, and genetic characterization of STUB1 variants in cerebellar ataxias: a frequent cause of predominant cognitive impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "STUB1 variants were detected in 50 patients. Age at onset and severity were remarkably variable."
    explanation: >-
      The largest cohort documents the variability of age at onset and
      severity that qualifies the adult-onset label.

- category: Neurologic
  name: Dysarthria
  description: >-
    Cerebellar dysarthria accompanies the ataxia and can be a presenting
    symptom. It was present in all patients across the eight-family Italian
    series.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Dysarthria
    term:
      id: HP:0001260
      label: Dysarthria
  evidence:
  - reference: PMID:31571321
    reference_title: "The complex phenotype of spinocerebellar ataxia type 48 in eight unrelated Italian families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All our SCA48 patients had cerebellar ataxia and dysarthria associated with cerebellar atrophy on brain magnetic resonance imaging"
    explanation: >-
      Dysarthria co-occurred with ataxia in all 11 SCA48 patients across eight
      index families (11/11 = 100%), which is the derived count supporting the
      VERY_FREQUENT band (80-100%).

- category: Cognitive
  name: Cerebellar cognitive-affective syndrome
  description: >-
    The cerebellar cognitive-affective syndrome (CCAS) is the phenotype that
    distinguishes SCA48 from most other dominant ataxias. It combines
    executive dysfunction, behavioural and personality change, and affective
    or frankly psychiatric disturbance, and it frequently precedes the ataxia
    by years - in the discovery family a slowly evolving dysexecutive syndrome
    ran ahead of truncal ataxia, and presymptomatic carriers already had focal
    atrophy of cognition- and emotion-related cerebellar territories.
  phenotype_term:
    preferred_term: Impaired executive functioning
    term:
      id: HP:0033051
      label: Impaired executive functioning
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:30381368
    reference_title: "Heterozygous STUB1 mutation causes familial ataxia with cognitive affective syndrome (SCA48)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To describe a new spinocerebellar ataxia (SCA48) characterized by early cerebellar cognitive-affective syndrome (CCAS) and late-onset SCA."
    explanation: >-
      The defining study frames early CCAS with late ataxia as the
      characteristic pairing of the disorder.
  - reference: PMID:31741143
    reference_title: "Cerebellar cognitive-affective syndrome preceding ataxia associated with complex extrapyramidal features in a Turkish SCA48 family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CCAS is a prominent and often early feature of SCA48 which may be followed years after the onset of the disease by other complex neurological signs and symptoms."
    explanation: >-
      Independent replication of the temporal ordering in an unrelated
      (Turkish) family.

- category: Cognitive
  name: Cognitive impairment
  description: >-
    Cognitive impairment in SCA48 is predominantly a frontal/dysexecutive
    syndrome and is common enough to be a leading reason for referral. In the
    largest cohort it was present in 54% of STUB1 variant carriers, and five
    families presented with phenotypes mimicking Huntington disease or
    frontotemporal dementia.
  phenotype_term:
    preferred_term: Cognitive impairment
    term:
      id: HP:0100543
      label: Cognitive impairment
    clinical_course: PROGRESSIVE
  frequency: FREQUENT
  evidence:
  - reference: PMID:32713943
    reference_title: "Clinical, neuropathological, and genetic characterization of STUB1 variants in cerebellar ataxias: a frequent cause of predominant cognitive impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cognitive impairment, predominantly frontal syndrome, was observed in 54% of STUB1 variant carriers, including five families with Huntington or frontotemporal dementia disease-like phenotypes associated with ataxia, while no STUB1 variant was found in 115 patients with frontotemporal dementia."
    explanation: >-
      Direct quantitative support for both the phenotype and the FREQUENT
      band: 54% falls in the 30-79% range.
  - reference: PMID:32211513
    reference_title: "Heterozygous STUB1 missense variants cause ataxia, cognitive decline, and STUB1 mislocalization."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cerebellar atrophy on imaging and cognitive deficits often preceded ataxia."
    explanation: >-
      Confirms cognitive impairment as a core, often pre-ataxic feature in an
      independent dominant STUB1 cohort.

- category: Psychiatric
  name: Behavioural and personality change
  description: >-
    Behavioural change and personality alteration are prominent
    neuropsychiatric features, and in the large Dutch pedigree accompanied
    cognitive decline as a cardinal presenting feature alongside the gait
    disturbance.
  phenotype_term:
    preferred_term: Personality changes
    term:

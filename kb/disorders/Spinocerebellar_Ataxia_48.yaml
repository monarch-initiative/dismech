    evidence_source: HUMAN_CLINICAL
    snippet: "Patients presented with adult-onset gait disturbance (ataxia or parkinsonism), combined with prominent cognitive decline and behavioral changes."
    explanation: >-
      Behavioural change is documented as a presenting feature in a large
      heterozygous STUB1 pedigree.

- category: Psychiatric
  name: Psychiatric symptoms
  description: >-
    Psychiatric disturbance accompanies the cognitive syndrome and is a routine
    part of the clinical picture in SCA48 case series. This entry is the
    residual category: the two named psychiatric features that sources report

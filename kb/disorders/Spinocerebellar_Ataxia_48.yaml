    snippet: "MRI showed a significant cerebellar atrophy, coupled to a T2-weighted hyperintensity affecting the dentate nuclei and extending to the middle cerebellar peduncles, whereas FDG-PET studies revealed glucose hypometabolism in cerebellum, striatum, and cerebral cortex."
    explanation: >-
      Functional imaging shows the cerebellar lesion is accompanied by
      hypometabolism in connected striatal and cortical territories, which is

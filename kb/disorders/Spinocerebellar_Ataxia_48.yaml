  phenotype_term:
    preferred_term: Psychiatric symptoms
    term:
      id: HP:0000708
      label: Atypical behavior
  evidence:
  - reference: PMID:39680235
    reference_title: "Case Series of Cerebellar Ataxia with Tremor Due to Heterozygous STUB1 Variants (SCA48) without TBP Expansions: Further Evidence for SCA48 as a Monogenic Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All presented with slowly progressive cerebellar ataxia with tremor and additional findings of dysarthria, parkinsonism, hypertonia, cognitive and psychiatric symptoms."
    explanation: >-
      Psychiatric symptoms were present in all three probands of this series
      alongside the motor and cognitive features.
  - reference: PMID:31126790
    reference_title: "Spinocerebellar ataxia 48 presenting with ataxia associated with cognitive, psychiatric, and extrapyramidal features: A report of two Italian families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

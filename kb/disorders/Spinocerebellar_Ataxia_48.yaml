      evidence_source: IN_VITRO
      snippet: "These interactions allow CHIP to mediate the ubiquitination of chaperone-bound, misfolded proteins to promote their degradation via the proteasome."
      explanation: >-
        SCA48 arises from loss of the chaperone-coupled degradation of
        misfolded proteins, i.e. a failure of proteostasis, which is what the
        proteotoxic-disease category names.

inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    SCA48 segregates as an autosomal dominant trait: heterozygous STUB1
    variants cosegregate with disease across multiple generations in
    independent pedigrees. Penetrance is incomplete and age-dependent, and de
    novo variants occur, so a negative family history does not exclude the
    diagnosis. This is the dominant counterpart of the recessive STUB1
    disorder SCAR16 / Gordon Holmes syndrome, and dominant and recessive
    variants produce indistinguishable in vitro defects.
  evidence:
  - reference: PMID:30381368
    reference_title: "Heterozygous STUB1 mutation causes familial ataxia with cognitive affective syndrome (SCA48)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Since recessive mutations in STUB1 gene have been previously associated with SCAR16, these findings suggest a previously undescribed SCA locus (SCA48; MIM# 618093)."
    explanation: >-
      The discovery study reports a heterozygous, cosegregating STUB1 variant
      and explicitly distinguishes the new dominant locus from the previously
      known recessive SCAR16 disorder.
  - reference: PMID:32211513
    reference_title: "Heterozygous STUB1 missense variants cause ataxia, cognitive decline, and STUB1 mislocalization."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study confirms a dominant inheritance pattern in STUB1-ataxia in addition to a recessive one and documents its association with cognitive and behavioral disability, including autism."
    explanation: >-
      Independent replication in two further families confirms that dominant
      inheritance coexists with the recessive pattern for the same gene.

- name: De novo variant occurrence
  inheritance_term:
    preferred_term: Sporadic
    term:
      id: HP:0003745
      label: Sporadic
  description: >-
    SCA48 can arise from a de novo heterozygous STUB1 variant in a patient
    with no family history, so the absence of an affected parent does not
    exclude the diagnosis.
  evidence:
  - reference: PMID:35398354
    reference_title: "The molecular basis of spinocerebellar ataxia type 48 caused by a de novo mutation in the ubiquitin ligase CHIP."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we have identified a novel, de novo mutation in STUB1 in a patient with SCA48 encoding for an A52G point mutation in the tetratricopeptide repeat domain of CHIP."
    explanation: >-
      A de novo TPR-domain STUB1 variant in an SCA48 patient establishes that
      the disorder occurs sporadically as well as by transmission. Graded
      HUMAN_CLINICAL because the quoted claim is a patient genetic observation,
      even though the rest of this paper is biochemistry.

pathophysiology:
- name: CHIP Loss of Function from Heterozygous STUB1 Variants
  description: >-
    The initiating lesion is a heterozygous germline pathogenic STUB1 variant.
    STUB1 encodes CHIP, a 35 kDa cytosolic protein whose N-terminal
    tetratricopeptide-repeat (TPR) domain binds the HSC70/HSP70 chaperones and
    whose C-terminal U-box recruits E2 ubiquitin-conjugating enzymes.
    Missense, nonsense, frameshift, splice and in-frame deletion variants are
    distributed across the coding sequence with no hotspot. The functional
    consequence is domain-dependent rather than uniform: TPR-domain variants
    retain intrinsic ligase activity but lose HSP70 binding and protein
    stability, while U-box variants abolish ligase activity, oligomerise
    abnormally and only partly impair co-chaperone function. Dominant SCA48
    variants and recessive SCAR16 variants produce biochemically
    indistinguishable defects in vitro, which is why the two disorders form a
    continuous clinical spectrum rather than two mechanisms.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: STUB1
    term:
      id: hgnc:11427
      label: STUB1
  molecular_functions:
  - preferred_term: ubiquitin protein ligase activity
    term:
      id: GO:0061630
      label: ubiquitin protein ligase activity
    modifier: DECREASED
  - preferred_term: Hsp70 protein binding
    term:
      id: GO:0030544
      label: Hsp70 protein binding
    modifier: DECREASED
  evidence:
  - reference: PMID:30381368
    reference_title: "Heterozygous STUB1 mutation causes familial ataxia with cognitive affective syndrome (SCA48)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among the candidate variants, only the frameshift heterozygous c.823_824delCT STUB1 (p.L275Dfs*16) pathogenic variant cosegregated with the disease."
    explanation: >-
      Identifies the initiating molecular lesion: a single heterozygous STUB1
      frameshift variant cosegregating with SCA48 in the discovery pedigree.
  - reference: PMID:42567515
    reference_title: "Domain-dependent uncoupling of the co-chaperone and E3 ubiquitin ligase CHIP underlies heterogeneity in spinocerebellar ataxia 48."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "TPR variants retained intrinsic ligase activity but showed significantly reduced HSP70 binding, impaired substrate ubiquitination, and decreased stability. Conversely, U-box variants abolished ligase function, promoted the formation of high-molecular-weight oligomers, and often increased CHIP levels while only partially impairing co-chaperone activity."
    explanation: >-
      Systematic biochemical analysis of 13 SCA48 variants shows that the
      molecular consequence is domain-dependent, splitting the initiating
      lesion into a chaperone-binding arm and a ligase arm.
  - reference: PMID:42567515
    reference_title: "Domain-dependent uncoupling of the co-chaperone and E3 ubiquitin ligase CHIP underlies heterogeneity in spinocerebellar ataxia 48."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Meta-analysis of 87 SCA48 patients linked TPR-like biochemical signatures to upper motor neuron involvement and U-box-like profiles to prominent dysarthria."
    explanation: >-
      The first reported genotype-phenotype signal in SCA48: which CHIP domain
      the variant hits tracks with which clinical features dominate. This
      supersedes the earlier position that no genotype-phenotype correlation
      exists, and is the source of the upper-motor-neuron phenotype curated
      below. Graded HUMAN_CLINICAL because the quoted claim is a meta-analysis
      of patient phenotypes, not the paper's biochemistry.
  - reference: PMID:34070858
    reference_title: "Genetic Dominant Variants in STUB1, Segregating in Families with SCA48, Display In Vitro Functional Impairments Indistinctive from Recessive Variants Associated with SCAR16."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These studies revealed that dominantly and recessively inherited STUB1 variants showed similar biochemical defects, including impaired ubiquitin ligase activity and altered oligomerization properties of the CHIP."
    explanation: >-
      Dominant SCA48 variants and recessive SCAR16 variants are biochemically
      indistinguishable in vitro, supporting one shared molecular lesion
      underlying the allelic pair rather than two mechanisms.
  - reference: PMID:34565360
    reference_title: "Clinical and functional characterization of a novel STUB1 frameshift mutation in autosomal dominant spinocerebellar ataxia type 48 (SCA48)."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Further in vitro experiments demonstrated that this novel heterozygous STUB1 frameshift variant impairs the CHIP protein's activity and its interaction with the E2 ubiquitin ligase, UbE2D1, leading to neuronal accumulation of tau and α-synuclein, caspase-3 activation, and promoting cellular apoptosis through a dominant-negative pathogenic effect."
    explanation: >-
      A U-box frameshift variant acts by a dominant-negative mechanism on E2
      recruitment, one of the non-exclusive routes by which a heterozygous
      variant produces CHIP dysfunction.
  downstream:
  - target: Impaired Chaperone-Assisted Protein Quality Control
    description: >-
      Loss of TPR-mediated chaperone engagement and/or U-box-mediated E2
      recruitment removes CHIP from the chaperone-to-proteasome hand-off.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:35398354
      reference_title: "The molecular basis of spinocerebellar ataxia type 48 caused by a de novo mutation in the ubiquitin ligase CHIP."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Utilizing an array of biophysical, biochemical, and cellular assays, we demonstrate that the CHIPA52G point mutant retains E3-ligase activity but has decreased affinity for chaperones."
      explanation: >-
        Shows directly that an SCA48 variant degrades the chaperone-binding
        arm of CHIP function, the step that links the genetic lesion to
        failure of chaperone-assisted quality control.
  - target: Dysregulated PINK1/Parkin-Mediated Mitophagy
    description: >-
      CHIP normally restrains PINK1/Parkin-mediated mitophagy; disease
      variants dysregulate this branch independently of the aggregation arm.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:39117117
      reference_title: "Disease-associated mutations in C-terminus of HSP70 interacting protein (CHIP) impair its ability to negatively regulate mitophagy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "we find that multiple disease-associated mutations in CHIP dysregulate mitophagy both in vitro and in vivo in C. elegans neurons"
      explanation: >-
        Establishes the edge from disease-associated CHIP variants to mitophagy
        dysregulation. Graded MODEL_ORGANISM for the in vivo C. elegans neuronal
        result the sentence rests on; the cell-culture arm of the same paper is
        cited as IN_VITRO on the mitophagy node itself.

- name: Impaired Chaperone-Assisted Protein Quality Control
  description: >-
    CHIP is the physical link between the cytosolic chaperone machinery and
    the ubiquitin-proteasome system. Through its TPR domain it binds HSC70 and
    HSP70 and attenuates their folding cycle; through its U-box it acts as a
    bona fide E3 ubiquitin ligase, recruiting UBCH5-family E2 enzymes and
    ubiquitinating chaperone-bound clients so that terminally misfolded
    proteins are routed to the proteasome instead of being refolded
    indefinitely. Loss of CHIP function therefore removes the triage step of
    cytosolic protein quality control. Loss of Chip ubiquitin ligase activity
    in zebrafish reduces total brain 26S proteasome activity, showing that the
    proteasomal arm is degraded in vivo and not only in reconstituted assays.
  biological_scale: MOLECULAR
  conforms_to: "loss_of_proteostasis#Loss of Proteostasis"
  molecular_functions:
  - preferred_term: ubiquitin protein ligase activity
    term:
      id: GO:0061630
      label: ubiquitin protein ligase activity
    modifier: DECREASED
  - preferred_term: protein-folding chaperone binding
    term:
      id: GO:0051087
      label: protein-folding chaperone binding
    modifier: DECREASED
  biological_processes:
  - preferred_term: protein ubiquitination
    term:
      id: GO:0016567
      label: protein ubiquitination
    modifier: DECREASED
  - preferred_term: proteasome-mediated ubiquitin-dependent protein catabolic process
    term:
      id: GO:0043161
      label: proteasome-mediated ubiquitin-dependent protein catabolic process
    modifier: DECREASED
  - preferred_term: protein quality control for misfolded or incompletely synthesized proteins
    term:
      id: GO:0006515
      label: protein quality control for misfolded or incompletely synthesized proteins
    modifier: DECREASED
  evidence:
  - reference: PMID:10330192
    reference_title: "Identification of CHIP, a novel tetratricopeptide repeat-containing protein that interacts with heat shock proteins and negatively regulates chaperone functions."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In vitro binding assays demonstrated direct interactions between CHIP and both Hsc70 and Hsp70, and complexes containing CHIP and Hsc70 were identified in immunoprecipitates of human skeletal muscle cells in vivo."
    explanation: >-
      Establishes the baseline biology this node depends on: CHIP is a direct
      HSC70/HSP70-binding co-chaperone.
  - reference: PMID:11557750
    reference_title: "CHIP is a U-box-dependent E3 ubiquitin ligase: identification of Hsc70 as a target for ubiquitylation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we demonstrate that CHIP possesses intrinsic E3 ubiquitin ligase activity and promotes ubiquitylation. This activity is dependent on the carboxyl-terminal U-box."
    explanation: >-
      Establishes the second half of the baseline biology: the U-box confers
      genuine E3 ubiquitin ligase activity, the function lost in U-box SCA48
      variants.
  - reference: PMID:35398354
    reference_title: "The molecular basis of spinocerebellar ataxia type 48 caused by a de novo mutation in the ubiquitin ligase CHIP."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "CHIP is known to regulate proteostasis by recruiting chaperones via a N-terminal tetratricopeptide repeat domain and recruiting E2 ubiquitin-conjugating enzymes via a C-terminal U-box domain. These interactions allow CHIP to mediate the ubiquitination of chaperone-bound, misfolded proteins to promote their degradation via the proteasome."
    explanation: >-
      States the coupling of the chaperone machinery to the proteasome that
      this node describes, in the specific context of SCA48.
  - reference: PMID:34630034
    reference_title: "Chip Protein U-Box Domain Truncation Affects Purkinje Neuron Morphology and Leads to Behavioral Changes in Zebrafish."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mutant fish also had decreased total 26S proteasome activity in the brain and showed behavioral changes."
    explanation: >-
      Shows in a whole vertebrate brain that loss of Chip ligase activity
      lowers proteasome throughput, extending the in vitro claim to an in vivo
      nervous system.
  downstream:
  - target: Accumulation of Misfolded Client Proteins and Neuronal Inclusions
    description: >-
      Undegraded chaperone clients accumulate and aggregate; in cellular
      models of SCA48 variants this includes tau and alpha-synuclein.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:39707479
      reference_title: "Clinical and functional characterization of a novel STUB1 mutation in a Chinese spinocerebellar ataxia 48 pedigree."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We found that the variant STUB1 c.755A>C caused a significant reduction of CHIP level and the loss function of ubiquitin ligase activity as the pathogenic STUB1 mutations reported before. Besides, we also found that the CHIP p. Y252S could cause tau aggregation, which is considered to contribute to the progression of neurodegenerative disorders."
      explanation: >-
        Ties loss of ligase activity in an SCA48 variant directly to
        aggregation of a client protein in the same experiment, which is the
        causal step this edge asserts.

- name: Dysregulated PINK1/Parkin-Mediated Mitophagy
  description: >-
    CHIP acts as a negative regulator of PINK1/Parkin-mediated mitophagy,
    promoting PINK1 degradation and limiting Parkin recruitment to stressed
    mitochondria. Disease-associated CHIP variants dysregulate this pathway in
    cell culture and in C. elegans neurons, giving a parallel branch of
    mitochondrial quality control alongside the aggregation branch. This arm
    is mechanistically plausible for SCA48 but has not been demonstrated in
    human SCA48 tissue, so it is recorded as a provisional mechanism.
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  biological_processes:
  - preferred_term: mitophagy
    term:
      id: GO:0000423
      label: mitophagy
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:39117117
    reference_title: "Disease-associated mutations in C-terminus of HSP70 interacting protein (CHIP) impair its ability to negatively regulate mitophagy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here, we demonstrate that CHIP acts as a negative regulator of the PTEN-induced kinase 1 (PINK1)/Parkin-mediated mitophagy pathway, promoting the degradation of PINK1, impairing Parkin translocation to the mitochondria, and suppressing mitophagy in response to mitochondrial stress."
    explanation: >-
      Defines the normal regulatory relationship whose loss constitutes this
      node.
  downstream:
  - target: Cerebellar Purkinje Cell Degeneration
    description: >-
      Loss of mitochondrial quality control is proposed to contribute to
      neuronal vulnerability in CHIP-associated disease. The link to Purkinje
      cell loss in SCA48 specifically is inferred, not demonstrated.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

- name: Accumulation of Misfolded Client Proteins and Neuronal Inclusions
  description: >-
    Failure of CHIP-mediated triage leaves misfolded chaperone clients
    undegraded. In cellular models of SCA48 variants this produces
    accumulation of tau and alpha-synuclein with caspase-3 activation and
    apoptosis. In patients, the corresponding pathology is ubiquitin- and
    p62-positive neuronal inclusions, which are found in the cerebellum,
    neocortex and brainstem and are regarded as a pathological hallmark of the
    disease. Cortical neurons derived from patient iPSCs show dysfunctional
    protein (re)folding and elevated basal oxidative stress, while the same
    study found that impaired heat-shock response - an earlier candidate
    mechanism - was not specific to mutant cells. Those patient lines came from
    the recessive (SCAR16) end of the STUB1 spectrum, so the finding is carried
    here on the strength of the shared molecular lesion rather than observed in
    SCA48 patients directly.
  biological_scale: CELLULAR
  conforms_to: "loss_of_proteostasis#Misfolded-Protein Aggregation"
  cellular_components:
  - preferred_term: inclusion body
    term:
      id: GO:0016234
      label: inclusion body
    modifier: INCREASED
  biological_processes:
  - preferred_term: protein refolding
    term:
      id: GO:0042026
      label: protein refolding
    modifier: DECREASED
  locations:
  - preferred_term: cerebellum
    term:
      id: UBERON:0002037
      label: cerebellum
  evidence:
  - reference: PMID:32337344
    reference_title: "Clinical and pathologic phenotype of a large family with heterozygous STUB1 mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neuropathologic examination of 3 cases revealed a consistent pattern of ubiquitin/p62-positive neuronal inclusions in the cerebellum, neocortex, and brainstem."
    explanation: >-
      Human neuropathology in three heterozygous STUB1 cases documents the
      protein-inclusion pathology this node asserts, and its anatomical
      distribution.
  - reference: PMID:32337344
    reference_title: "Clinical and pathologic phenotype of a large family with heterozygous STUB1 mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The presence of intranuclear inclusions is a pathologic hallmark of the disease."
    explanation: >-
      States that inclusion pathology is a defining feature of SCA48 rather
      than an incidental finding.
  - reference: PMID:34565360
    reference_title: "Clinical and functional characterization of a novel STUB1 frameshift mutation in autosomal dominant spinocerebellar ataxia type 48 (SCA48)."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "leading to neuronal accumulation of tau and α-synuclein, caspase-3 activation, and promoting cellular apoptosis through a dominant-negative pathogenic effect"
    explanation: >-
      Identifies the specific accumulating clients and the downstream
      apoptotic response in a neuronal model of an SCA48 variant.
  - reference: PMID:33097556
    reference_title: "CHIP mutations affect the heat shock response differently in human fibroblasts and iPSC-derived neurons."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Proteomic analysis of CNs showed dysfunctional protein (re)folding and higher basal oxidative stress levels in patients."
    explanation: >-
      Patient iPSC-derived cortical neurons show the folding defect and
      oxidative-stress phenotype expected of failed proteostasis. Note this
      study used STUB1 patient lines from the recessive end of the spectrum.
  - reference: PMID:33097556
    reference_title: "CHIP mutations affect the heat shock response differently in human fibroblasts and iPSC-derived neurons."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "Our results question the role of impaired HSR in SCAR16 neuropathology and highlight the need for careful selection of proper cell types for modeling human diseases."
    explanation: >-
      Recorded as a refutation of the specific candidate mechanism that a
      defective heat-shock response drives STUB1-related neurodegeneration -
      patient and CRISPR STUB1-null neurons behaved like controls. Retained so
      the entry does not silently carry a mechanism the primary data question.
  downstream:
  - target: Peripheral neuropathy
    description: >-
      Where peripheral involvement is reported, failed proteostasis in
      peripheral neurons is the presumed route. No study establishes the
      intermediate steps, and two cohorts report no peripheral involvement at
      all, so this edge is speculative and deliberately uncited.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Cerebellar Purkinje Cell Degeneration
    description: >-
      Accumulated misfolded protein and inclusion pathology in a cell type
      with high proteostatic demand drives Purkinje cell dysfunction and loss.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:32211513
      reference_title: "Heterozygous STUB1 missense variants cause ataxia, cognitive decline, and STUB1 mislocalization."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Unique neuropathologic examination of the 4 brains showed the marked loss of Purkinje cells (PCs) without microscopic evidence of significant pathology outside the cerebellum."
      explanation: >-
        Human neuropathology in dominant STUB1 disease shows that the
        proteostatic lesion is cashed out as selective Purkinje cell loss,
        which is the downstream node.

- name: Cerebellar Purkinje Cell Degeneration
  description: >-
    The Purkinje cell is the selectively vulnerable cell type in SCA48. Human
    neuropathology in heterozygous STUB1 patients shows marked to massive
    Purkinje cell loss, most severe in the vermis and substantial in the
    hemispheres, with strikingly little pathology elsewhere in one series and
    no atrophy of pons, hippocampus or cerebral cortex in another. A second
    cell-autonomous abnormality is loss of the normal polarised somatodendritic
    distribution of CHIP within surviving Purkinje cells, with aberrant
    protein in the distal dendritic arbor. A zebrafish chip U-box truncation
    reproduces the cellular phenotype - reduced Purkinje cell number and soma
    size and disorganised dendrites - without gross cerebellar atrophy.
  biological_scale: CELLULAR
  conforms_to: "cerebellar_purkinje_degeneration#Purkinje Neuron Degeneration"
  cell_types:
  - preferred_term: cerebellar Purkinje cell
    term:
      id: CL:0000121
      label: Purkinje cell
  biological_processes:

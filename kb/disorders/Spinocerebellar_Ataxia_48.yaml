notes: >-
  GeneReviews baseline: no STUB1-, SCA48- or SCAR16-specific GeneReviews
  chapter exists (PubMed searches for "STUB1 GeneReviews", "spinocerebellar
  ataxia 48 GeneReviews" returned no disease-specific chapter). The closest
  authoritative GeneReviews resource is the Hereditary Ataxia Overview
  (PMID:20301317), tagged above; its PubMed record is a scope statement with
  no per-phenotype clinical content, so it could not be used as a phenotype
  baseline and no evidence item quotes it. Phenotype coverage was therefore
  built from the primary cohort literature (Genis 2018, De Michele 2019, Lieto
  2020, Chen 2020, Roux 2020, Mol 2020, Zochowski 2024).

  Deep research: research/Spinocerebellar_Ataxia_48-deep-research-falcon.md
  (Edison/falcon, 33 citations). The report contained no PMIDs at all - 13 of
  its 33 citations carried a DOI and 20 were bare author-year keys. Every DOI
  was converted to a PMID before use and every snippet below was taken from
  the PubMed abstract cached by `just fetch-reference`, not from the report.
  The report's claims sourced only to author-year keys were either
  independently re-sourced or dropped.


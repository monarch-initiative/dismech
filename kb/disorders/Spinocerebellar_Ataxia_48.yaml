name: Spinocerebellar Ataxia 48
creation_date: "2026-08-31T00:00:00Z"
category: Mendelian
description: >-
  Spinocerebellar ataxia 48 (SCA48; ATX-STUB1) is an adult-onset autosomal
  dominant cerebellar ataxia caused by heterozygous pathogenic variants in
  STUB1, which encodes CHIP (C-terminus of HSC70-interacting protein), a
  co-chaperone and U-box E3 ubiquitin ligase that couples the HSP70/HSC70
  chaperone machinery to the ubiquitin-proteasome system. Its distinguishing
  feature is the pairing of progressive cerebellar ataxia and dysarthria with a
  prominent cerebellar cognitive-affective syndrome (dysexecutive and
  psychiatric/behavioural disturbance) that frequently precedes the motor
  syndrome by years; chorea, dystonia, parkinsonism, tremor and urinary
  symptoms broaden the phenotype. Brain MRI shows cerebellar atrophy with a
  postero-lateral hemispheric predominance together with T2 hyperintensity of
  both dentate nuclei (the "crab sign"), and neuropathology shows marked
  Purkinje cell loss with ubiquitin/p62-positive neuronal inclusions.
  Biallelic STUB1 variants cause the allelic autosomal recessive disorder
  SCAR16 / Gordon Holmes syndrome (MONDO:0008935), curated separately in this
  knowledge base as Cerebellar Ataxia-Hypogonadism Syndrome; the two
  presentations form a continuous clinical spectrum; hypogonadism, early
  onset and prominent spastic/pyramidal involvement predominate at the
  recessive end, but pyramidal signs and hypertonia are also reported in SCA48
  and their absence in one cohort should not be read as a rule.
  Intermediate-length CAG/CAA repeat expansions in TBP co-occur with STUB1
  variants often enough that digenic inheritance was proposed, but patients
  with the full SCA48 phenotype and normal TBP alleles establish that SCA48
  also occurs as a monogenic disorder.
disease_term:
  preferred_term: Spinocerebellar ataxia 48
  term:

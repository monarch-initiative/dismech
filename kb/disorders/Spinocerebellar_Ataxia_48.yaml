  - reference: PMID:30381368
    reference_title: "Heterozygous STUB1 mutation causes familial ataxia with cognitive affective syndrome (SCA48)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Six patients fully developed cognitive-affective and complete motor cerebellar syndrome associated with vermian and hemispheric cerebellar atrophy, suggesting a continuum from a dysexecutive syndrome slowly evolving to a complete and severe CCAS with late truncal ataxia."

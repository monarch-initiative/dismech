pathophysiology:
- name: RBSN FYVE-Domain Missense Variant
  biological_scale: MOLECULAR
  role: Initiating genetic lesion
  description: >-
    One of two recessive missense alleles, p.Arg180Gly or p.Gly183Arg, three
    residues apart in the FYVE finger of rabenosyn-5. The FYVE domain is the
    module through which the protein reads phosphatidylinositol 3-phosphate on
    endosomal membranes, so a lesion here is a targeting lesion rather than a
    catalytic one.
  genetic_context:
    gene:
      preferred_term: RBSN
      term:
        id: hgnc:20759
        label: RBSN
    variant_origin: GERMLINE
    allele_type: SNV
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Recorded as LOSS_OF_FUNCTION because PI3P binding is abolished, but the
      enum cannot express what is distinctive here: the loss is selective. One of
      the protein's two downstream functions is lost and the other is retained, on
      the same allele, which is what the authors mean by separation-of-function.
      See `discussions`.
  genes:
  - preferred_term: RBSN
    term:
      id: hgnc:20759
      label: RBSN
  evidence:
  - reference: PMID:35652444
    reference_title: "RABENOSYN separation-of-function mutations uncouple endosomal recycling from lysosomal degradation, causing a distinct Mendelian disorder."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using exome sequencing, we identified recessively acting germline alleles p.Arg180Gly and p.Gly183Arg, which are both situated in the FYVE domain of RBSN."
    explanation: "The alleles and their location in the domain this node is about."
  downstream:
  - target: Loss of PI3P Binding and Failure of Endosomal Recruitment
    description: The FYVE lesion removes the protein's membrane-targeting capability.
    evidence:
    - reference: PMID:35652444
      reference_title: "RABENOSYN separation-of-function mutations uncouple endosomal recycling from lysosomal degradation, causing a distinct Mendelian disorder."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We find that these variants abrogate binding to its cognate substrate phosphatidylinositol 3-phosphate (PI3P) and thus prevent its translocation to early endosomes."
      explanation: "The biochemical consequence measured for both alleles."
- name: Loss of PI3P Binding and Failure of Endosomal Recruitment
  biological_scale: MOLECULAR
  role: Core molecular lesion
  description: >-
    The mutant protein no longer binds phosphatidylinositol 3-phosphate and
    therefore never translocates to the early endosome. Rabenosyn-5 is normally
    recruited there in a PI3-kinase-dependent manner through the FYVE finger, and
    it is what links Rab5 to hVPS45. So the failure is not of rabenosyn-5's
    activity but of its localisation - the protein is present in the cell and
    absent from the membrane where it works.
  molecular_functions:
  - preferred_term: phosphatidylinositol-3-phosphate binding by the RBSN FYVE domain
    term:
      id: GO:0032266
      label: phosphatidylinositol-3-phosphate binding
    modifier: DECREASED
  cellular_components:
  - preferred_term: early endosome
    term:
      id: GO:0005769
      label: early endosome
  evidence:
  - reference: PMID:35652444
    reference_title: "RABENOSYN separation-of-function mutations uncouple endosomal recycling from lysosomal degradation, causing a distinct Mendelian disorder."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: "We find that these variants abrogate binding to its cognate substrate phosphatidylinositol 3-phosphate (PI3P) and thus prevent its translocation to early endosomes."
    explanation: "Both halves of this node - lost PI3P binding, and the failure of translocation that follows."
  - reference: PMID:11062261
    reference_title: "Rabenosyn-5, a novel Rab5 effector, is complexed with hVPS45 and recruited to endosomes through a FYVE finger domain."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "This complex includes a novel protein, Rabenosyn-5, which, like the previously characterized Rab5 effector early endosome antigen 1 (EEA1), contains an FYVE finger domain and is recruited in a phosphatidylinositol-3-kinase-dependent fashion to early endosomes."
    explanation: "Establishes the normal recruitment mechanism the disease alleles break. INDIRECT because it describes wild-type cell biology, not the patient alleles."
  downstream:
  - target: Delayed Endosomal Maturation with Preserved Recycling
    description: >-
      The selective consequence: lysosomal delivery fails while the recycling route
      continues to work.
    evidence:
    - reference: PMID:35652444
      reference_title: "RABENOSYN separation-of-function mutations uncouple endosomal recycling from lysosomal degradation, causing a distinct Mendelian disorder."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Although the endosomal recycling pathway was unaltered, mutant p.Gly183Arg patient fibroblasts show accumulation of cargo tagged for lysosomal degradation."
      explanation: "The measured dissociation, in patient cells: recycling intact, lysosomal cargo accumulating."
- name: Delayed Endosomal Maturation with Preserved Recycling
  biological_scale: CELLULAR
  role: Cellular phenotype, and the disease's distinguishing feature
  description: >-
    In patient fibroblasts, cargo destined for lysosomal degradation accumulates
    while recycling to the plasma membrane proceeds normally. The authors read this
    as a delay in endosomal maturation rather than a block: the early endosome
    still forms and still recycles, it just does not progress efficiently toward the
    degradative route.

    The reason to curate this as its own node rather than folding it into the
    molecular lesion is that it is the claim on which the whole nosology rests. If
    the FYVE alleles impaired both arms, there would be no principled reason to
    separate this disorder from the RBSN myelofibrosis syndrome; it is the
    selectivity that makes the two diseases mechanistically distinct rather than
    merely clinically different.
  biological_processes:
  - preferred_term: endosome to lysosome transport
    term:
      id: GO:0008333
      label: endosome to lysosome transport
    modifier: DECREASED
  cellular_components:
  - preferred_term: endolysosome
    term:
      id: GO:0036019
      label: endolysosome
  evidence:
  - reference: PMID:35652444
    reference_title: "RABENOSYN separation-of-function mutations uncouple endosomal recycling from lysosomal degradation, causing a distinct Mendelian disorder."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: "Our results suggest that these variants are separation-of-function alleles, which cause a delay in endosomal maturation without affecting cargo recycling."
    explanation: "The authors' own statement of the cellular phenotype, including the hedge - a delay, not a block."
  - reference: PMID:22308388
    reference_title: "Rabenosyn-5 defines the fate of the transferrin receptor following clathrin-mediated endocytosis."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "Depletion of Rabenosyn-5, but not of other early endosomal proteins such as early endosome antigen 1, resulted in impaired transferrin uptake and lysosomal degradation of transferrin receptors."
    explanation: "Shows that removing rabenosyn-5 disturbs the fate of internalised cargo between recycling and lysosomal degradation - the decision these disease alleles bisect - and that the effect is specific to rabenosyn-5 rather than general to early-endosomal proteins. INDIRECT because it is depletion in normal cells, not a patient allele."
  downstream:
  - target: Progressive muscle weakness
    description: >-
      The neuromuscular arm. No mechanism links impaired lysosomal delivery to
      muscle specifically; see `discussions`.
    evidence:
    - reference: PMID:35652444
      reference_title: "RABENOSYN separation-of-function mutations uncouple endosomal recycling from lysosomal degradation, causing a distinct Mendelian disorder."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "Here, we present clinical, genetic, cellular and biochemical evidence that two distinct RBSN missense variants are responsible for a novel Mendelian disorder consisting of progressive muscle weakness, facial dysmorphisms, ophthalmoplegia and intellectual disability."
      explanation: "Establishes the phenotype as a consequence of the variants. INDIRECT for this edge specifically: the paper does not connect the cellular defect to muscle."
  - target: Intellectual disability
    description: The cognitive arm, on the same footing as the neuromuscular one.
    evidence:
    - reference: PMID:35652444
      reference_title: "RABENOSYN separation-of-function mutations uncouple endosomal recycling from lysosomal degradation, causing a distinct Mendelian disorder."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "Here, we present clinical, genetic, cellular and biochemical evidence that two distinct RBSN missense variants are responsible for a novel Mendelian disorder consisting of progressive muscle weakness, facial dysmorphisms, ophthalmoplegia and intellectual disability."
      explanation: "Same sentence, same limitation: the phenotype is attributed to the variants, not derived from the cellular defect."
  - target: Ophthalmoplegia
    description: >-
      The ocular arm, on the same footing as the neuromuscular and cognitive ones.
      Named in the same sentence that defines the disorder, and no mechanism links
      the endosomal defect to extraocular muscle specifically; see `discussions`.
    evidence:
    - reference: PMID:35652444
      reference_title: "RABENOSYN separation-of-function mutations uncouple endosomal recycling from lysosomal degradation, causing a distinct Mendelian disorder."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "a novel Mendelian disorder consisting of progressive muscle weakness, facial dysmorphisms, ophthalmoplegia and intellectual disability"
      explanation: "Names ophthalmoplegia as one of the four features constituting the disorder this variant causes."
  - target: Abnormal facial shape
    description: >-
      The dysmorphism, wired on the same footing as the other three defining
      features. A developmental claim with no mechanism behind it - nothing links
      delayed endosomal maturation to craniofacial patterning here.
    evidence:
    - reference: PMID:35652444
      reference_title: "RABENOSYN separation-of-function mutations uncouple endosomal recycling from lysosomal degradation, causing a distinct Mendelian disorder."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "a novel Mendelian disorder consisting of progressive muscle weakness, facial dysmorphisms, ophthalmoplegia and intellectual disability"
      explanation: "Names the facial dysmorphism as one of the four features constituting the disorder."
  - target: Leukoencephalopathy
    description: >-
      The white-matter finding, wired as a further consequence of the same
      cell-biological defect. Inferential in exactly the way the other arms are.
    evidence:
    - reference: PMID:26192890
      reference_title: "Intellectual disability, muscle weakness and characteristic face in three siblings: A newly described recessive syndrome mapping to 3p24.3-p25.3."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "Brain MRIs in two of the sibs showed leukencephalopathy with delayed myelination, frontal and parietal hyperintensities, and hippocampal atrophy in one."
      explanation: "The imaging finding in the founding pedigree. INDIRECT because the sentence reports the observation without deriving it from the endosomal defect."

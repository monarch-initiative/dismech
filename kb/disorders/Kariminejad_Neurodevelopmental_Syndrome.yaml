genetic:
- name: RBSN
  gene_term:
    preferred_term: RBSN
    term:
      id: hgnc:20759
      label: RBSN
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  association: Recessive FYVE-domain missense alleles p.Arg180Gly and p.Gly183Arg
  presence: Positive
  inheritance:
  - name: Autosomal recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
  notes: >-
    RBSN is one gene with two named Mendelian disorders, and which one a patient
    has depends on which residue is hit. The two alleles curated here sit in the
    FYVE domain, three residues apart, and give this neuromuscular-cognitive
    phenotype; p.Gly97Arg gives congenital myelofibrosis with anemia, neutropenia,
    developmental delay and ocular abnormalities (MONDO:0975797), curated
    separately. A third homozygous allele, p.Gly425Arg (PMID:25233840), fits
    neither and is analysed in the sibling entry's `rbsn_allelic_series_nosology`
    discussion rather than re-argued here.

    Practical consequence: an RBSN variant report cannot be interpreted without
    the residue. "Pathogenic variant in RBSN" does not name a disease.
  evidence:
  - reference: PMID:35652444
    reference_title: "RABENOSYN separation-of-function mutations uncouple endosomal recycling from lysosomal degradation, causing a distinct Mendelian disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using exome sequencing, we identified recessively acting germline alleles p.Arg180Gly and p.Gly183Arg, which are both situated in the FYVE domain of RBSN."
    explanation: "The two causal alleles and their shared domain."
  - reference: PMID:35652444
    reference_title: "RABENOSYN separation-of-function mutations uncouple endosomal recycling from lysosomal degradation, causing a distinct Mendelian disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We conclude that distinct germline mutations in RBSN cause non-overlapping phenotypes with specific and discrete endolysosomal cellular defects."
    explanation: "The authors' conclusion that RBSN alleles partition by phenotype, which is the basis for curating this as a separate disease."

    explanation: "Describes the disorder as novel and reports two variants, which is the whole of the clinical literature and the basis for the ULTRA_RARE band."
clinical_burden:
  burden_level: VARIABLE
  rationale: >-
    Set as VARIABLE to record uncertainty rather than measured variability, and
    that distinction is the point. The disorder combines progressive muscle
    weakness with intellectual disability, which is a high-burden combination in
    principle. But the single defining report gives no severity grading, no age of
    onset, no rate of progression and no survival data, and it describes two
    alleles rather than a case series. There is not enough here to place the
    burden on the scale honestly, and an assertion of SEVERE would be a guess
    dressed as a finding.
  evidence:
  - reference: PMID:35652444
    reference_title: "RABENOSYN separation-of-function mutations uncouple endosomal recycling from lysosomal degradation, causing a distinct Mendelian disorder."
    supports: SUPPORT

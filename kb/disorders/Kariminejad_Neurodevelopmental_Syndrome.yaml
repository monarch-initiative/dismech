name: Kariminejad Neurodevelopmental Syndrome
creation_date: "2026-09-21T00:00:00Z"
description: >-
  A recessive endolysosomal disorder caused by germline missense variants in the
  FYVE domain of RBSN, presenting with progressive muscle weakness, facial
  dysmorphism, ophthalmoplegia and intellectual disability. RBSN encodes
  rabenosyn-5, a Rab5 effector that is recruited to early endosomes by binding
  phosphatidylinositol 3-phosphate through that FYVE domain, and which tethers the
  Sec1-like protein hVPS45 to Rab5 - hVPS45 does not bind Rab5 itself.

  What makes this entry worth reading is not the phenotype but the allele
  mechanism. The two causal variants, p.Arg180Gly and p.Gly183Arg, abolish PI3P
  binding and so prevent rabenosyn-5 reaching the early endosome at all - and yet
  the endosomal recycling pathway is unaffected. What accumulates in patient
  fibroblasts is cargo tagged for lysosomal degradation. The reporting authors call
  these separation-of-function alleles: they delay endosomal maturation while
  leaving recycling intact, splitting apart two functions of one protein that had
  not previously been separable.

  That is also why this is a distinct disease rather than a variant of the other
  RBSN disorder. A different germline RBSN allele, p.Gly97Arg, causes congenital
  myelofibrosis with anemia, neutropenia, developmental delay and ocular
  abnormalities - a haematological phenotype with essentially no overlap with this
  one. The authors' conclusion is that distinct germline RBSN mutations cause
  non-overlapping phenotypes with specific and discrete endolysosomal cellular
  defects, and this entry follows that split.
category: Mendelian
parents:
- Neurodevelopmental Disorder
- Endosomal trafficking disorder
disease_term:
  preferred_term: Kariminejad neurodevelopmental syndrome

- rabenosyn-5 FYVE-domain disorder
notes: >-
  Entry scope, and the lump/split decision this entry exists to make. The stub
  (stubs/Kariminejad_Neurodevelopmental_Syndrome.yaml) left `entry_type:
  UNDECIDED` and set out the question: RBSN has two named Mendelian disorders,
  and whether the second is a distinct DISEASE or a `has_subtypes` row on the
  first had not been settled. It is curated here as a DISEASE, on three grounds
  that are independent of each other:

  1. The alleles segregate cleanly by phenotype. ClinVar keys p.Arg180Gly and
     p.Gly183Arg to this condition and p.Gly97Arg to MONDO:0975797, and that
     assignment is recorded in the already-curated sibling entry
     kb/disorders/Congenital_Myelofibrosis_With_Anemia_Neutropenia_Developmental_Delay_And_Ocular_Abnormalities.yaml,
     whose curator read the ClinVar records through the NCBI E-utilities esummary
     API on 2026-09-19. This entry did not re-derive that; it relies on it and says so.
  2. The phenotypes do not overlap. This disorder is neuromuscular and cognitive;
     the sibling is a congenital bone marrow failure syndrome with myelofibrosis,
     neutropenia and anemia. They share developmental delay and little else.
  3. The cellular defects are different and were measured in the same paper.
     PMID:35652444 shows that the FYVE-domain alleles leave endosomal recycling
     intact and impair lysosomal delivery, and concludes explicitly that distinct
     germline RBSN mutations cause non-overlapping phenotypes with discrete
     endolysosomal defects.

  MONDO agrees: the two are separate terms, and neither is a descendant of the
  other. Curating this as a `has_subtypes` row on the sibling would have asserted
  a hierarchy the ontology does not carry - the same error that
  `Usmani-Riazuddin_Syndrome_Autosomal_Dominant` records having avoided, and for
  the same reason.

  What is NOT settled, and is carried forward rather than resolved here: a third
  RBSN patient, homozygous p.Gly425Arg (PMID:25233840), fits neither disorder
  cleanly. The sibling entry analyses this at length in its
  `rbsn_allelic_series_nosology` discussion and declines to count her as a case of
  either. This entry takes the same position and does not re-argue it; see that
  discussion rather than duplicating it.

  Evidence base. One paper, two families, two alleles - PMID:35652444 is the
  defining and essentially the only clinical source. Everything phenotypic in this
  entry traces to it. The supporting cell-biology references describe rabenosyn-5
  in normal cells, not in patients.

  Module conformance checked and left unset. `just list-modules` was read and
  `kb/modules/` grepped for `endosom`, `lysosom`, `traffick`, `vesicle`, `Rab`,
  `autophag` and `sorting`. There is no endosomal-maturation or membrane-trafficking
  module. The lysosomal storage modules are not applicable: this is a delivery
  defect upstream of the lysosome with no storage material described, and
  conforming to one would assert accumulation of an undegraded substrate that
  nobody has reported.

  No GeneReviews chapter exists for this disorder. Checked offline with
  `just check-genereviews kb/disorders/Kariminejad_Neurodevelopmental_Syndrome.yaml`
  against the committed Bookshelf index; NO_CHAPTER for GeneReviews.

  Deep research. `just preflight-dr` returns PASS against MONDO:0975795 (RBSN
  mentioned 31 times, no rival gene above 5, and the report's OMIM 620937 matches
  the MONDO xref). Its single most useful contribution was PMID:26192890 -
  Kariminejad et al. 2015, the founding clinical description the syndrome is named
  after, published seven years before the gene was identified. This entry did not
  cite it. It supplies the electrophysiological myopathy with non-specific
  biopsies, the leukoencephalopathy and delayed myelination on MRI, the unilateral
  abduction deficit behind the ophthalmoplegia, and the only enumeration of the
  facial features anywhere in the literature - every other source calls them
  dysmorphic and stops.

  Two things in the report's own validation output were checked rather than
  accepted. All three of its "terms named as a different term" findings are
  artifacts of the validator reading a phenotype table's *frequency* column as the
  term name ("All (6/6)", "Frequent", "1 patient"); none is a wrong binding. It
  also flags `GO:0017137` as obsolete, replaced by `GO:0031267` - this entry uses
  neither, so nothing followed from it.

  Pathograph wiring. All six phenotypes are wired from
  `Delayed Endosomal Maturation with Preserved Recycling`, and the reason they are
  all wired the same way is that they all rest on the same kind of claim. Four of
  them come from one sentence in PMID:35652444 naming the features that constitute
  the disorder; two come from the founding paper's imaging. None of the six has a
  published mechanism connecting it to the endosomal defect, which is exactly what
  the `rbsn_cellular_defect_to_tissue_phenotype` discussion records. Every edge is
  therefore `directness: INDIRECT` and says so. Wiring two of the four defining
  features and leaving the other two isolated, which is how this entry previously
  stood, asserted a distinction between them that no source makes.
references:
- reference: PMID:35652444
  title: "RABENOSYN separation-of-function mutations uncouple endosomal recycling from lysosomal degradation, causing a distinct Mendelian disorder."
  tags: []
  findings:
  - statement: >-
      The defining report. Clinical, genetic, cellular and biochemical evidence
      that the recessive FYVE-domain alleles p.Arg180Gly and p.Gly183Arg cause a
      novel Mendelian disorder of progressive muscle weakness, facial dysmorphism,
      ophthalmoplegia and intellectual disability, by abolishing PI3P binding and
      preventing rabenosyn-5 from reaching the early endosome - while leaving
      endosomal recycling intact.
- reference: PMID:26192890
  title: "Intellectual disability, muscle weakness and characteristic face in three siblings: A newly described recessive syndrome mapping to 3p24.3-p25.3."
  tags: []
  findings:
  - statement: >-
      The founding clinical description, seven years before the gene was found, and
      the paper the syndrome is named after. Three Iranian siblings with mild
      intellectual disability, progressive muscle weakness and a characteristic
      face; electrophysiological signs of myopathy with non-specific muscle
      biopsies; leukoencephalopathy with delayed myelination on MRI in two of them;
      and homozygosity mapping to a single identical-by-descent block at
      3p24.3-p25.3 containing 57 genes - the interval that later yielded RBSN. It
      is also the only source that enumerates the facial features rather than
      calling them dysmorphic.
- reference: PMID:11062261
  title: "Rabenosyn-5, a novel Rab5 effector, is complexed with hVPS45 and recruited to endosomes through a FYVE finger domain."
  tags: []
  findings:
  - statement: >-
      Characterises the protein and the domain this disease disrupts: rabenosyn-5
      is a Rab5 effector recruited to early endosomes through its FYVE finger in a
      PI3-kinase-dependent manner, and is the molecular link between Rab5 and
      hVPS45, which does not bind Rab5 directly.
- reference: PMID:22308388
  title: "Rabenosyn-5 defines the fate of the transferrin receptor following clathrin-mediated endocytosis."
  tags: []
  findings:
  - statement: >-
      Establishes that rabenosyn-5 determines whether internalised cargo is recycled
      or routed onward - which is the function the disease alleles split in two.
- reference: PMID:15020713
  title: "Rabenosyn-5 and EHD1 interact and sequentially regulate protein recycling to the plasma membrane."
  tags: []
  findings:
  - statement: >-
      The recycling arm of rabenosyn-5 function, cited here for the contrast: this
      is the pathway the FYVE-domain disease alleles leave working.
- reference: PMID:29784638
  title: "Syndromic congenital myelofibrosis associated with a loss-of-function variant in RBSN."
  tags: []
  findings:
  - statement: >-
      The other RBSN disorder, cited only to mark the boundary of this entry. A
      different germline allele produces a haematological syndrome with essentially
      no phenotypic overlap with this one.

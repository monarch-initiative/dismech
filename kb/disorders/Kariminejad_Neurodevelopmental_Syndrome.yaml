    snippet: "a novel Mendelian disorder consisting of progressive muscle weakness, facial dysmorphisms, ophthalmoplegia and intellectual disability"
    explanation: "The only characterisation of the phenotype available. INDIRECT with respect to burden: it names features without grading any of them."
discussions:
- discussion_id: rbsn_separation_of_function_not_expressible
  status: OPEN
  kind: CURATION_TODO
  attaches_to:
  - pathophysiology#RBSN FYVE-Domain Missense Variant
  - pathophysiology#Delayed Endosomal Maturation with Preserved Recycling
  prompt: >-
    `FunctionalImpactEnum` has no value for a separation-of-function allele. Is
    that a gap worth a schema change, or is `LOSS_OF_FUNCTION` plus prose the right
    answer?
  rationale: >-
    The genetic_context on the lesion node records `LOSS_OF_FUNCTION`, which is
    true and loses the point. What these alleles do is abolish one downstream
    function of rabenosyn-5 while leaving another intact, on the same allele, in
    the same cell - the authors' term is separation-of-function, and it is the
    finding the paper exists to report. A query over the KB for
    `LOSS_OF_FUNCTION` will return this variant next to alleles that simply
    destroy their gene product, and nothing in the structured record distinguishes
    them.

    The available enum values do not help: `PARTIAL_LOSS_OF_FUNCTION` means
    reduced activity, not selectively lost activity, and would be a different and
    wrong claim here. `HYPOMORPHIC` has the same problem.

    Whether this warrants a schema change is genuinely open - the pattern may be
    rare enough that prose is adequate, and the `extend-schema` skill's first
    question is whether a curation need warrants one at all. Recorded so that the
    next curator who meets a separation-of-function allele finds a precedent
    rather than inventing a convention.
- discussion_id: rbsn_cellular_defect_to_tissue_phenotype
  status: OPEN
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Delayed Endosomal Maturation with Preserved Recycling
  - phenotypes#Progressive muscle weakness
  prompt: >-
    How does delayed endosome-to-lysosome delivery produce progressive muscle
    weakness, ophthalmoplegia and intellectual disability specifically?
  rationale: >-
    The cellular defect was measured in fibroblasts, which are not an affected
    tissue. Nothing connects it to muscle, to extraocular muscle in particular, or
    to the developing brain, and the defining paper does not attempt the
    connection - it establishes the allele, the biochemistry and the cell
    phenotype, and reports the clinical features alongside them.

    The edges from the cellular node to the phenotypes are therefore marked
    INDIRECT rather than omitted: the phenotypes are certainly caused by the
    variants, and the route from the measured cellular defect to them is not
    established. That distinction is what the `directness` axis is for, and it is
    worth being explicit that these edges assert attribution, not mechanism.
  proposed_experiments:
  - experiment_id: rbsn_patient_myotube_cargo_trafficking
    name: Lysosomal cargo delivery in patient-derived myotubes
    description: >-
      Repeat the fibroblast cargo-accumulation assay in myotubes differentiated
      from patient cells, and in an unaffected cell type from the same patient as a
      within-individual control. If the defect is larger in muscle than in
      fibroblasts, tissue vulnerability is quantitative; if it is the same, the
      explanation lies elsewhere and the fibroblast result is not informative about
      why muscle fails.
    readouts:
    - name: Accumulation of lysosomally-tagged cargo in myotubes
      target: pathophysiology#Delayed Endosomal Maturation with Preserved Recycling
      direction: INCREASED
      interpretation: >-
        Greater accumulation in myotubes than in autologous fibroblasts would
        support differential tissue vulnerability as the explanation for the
        neuromuscular phenotype.
- discussion_id: rbsn_single_report_evidence_base
  status: OPEN
  kind: KNOWLEDGE_GAP
  attaches_to:
  - disease#Kariminejad Neurodevelopmental Syndrome
  prompt: >-
    Has any second family with FYVE-domain RBSN disease been reported, and does the
    phenotype hold up?
  rationale: >-
    Every clinical statement in this entry comes from one paper. That paper is
    unusually strong for a first report - it carries genetic, cellular and
    biochemical evidence rather than segregation alone - but it is still one
    report, and the phenotype description is four features in a single sentence
    with no severity, onset or course attached. A second family would either
    confirm the syndrome or reveal that the four features are the ascertainable
    tip of something broader.

    Relevant to how this entry should be read: the sparseness of the phenotype
    section here is a property of the literature, not of the curation. Nothing was
    left out.
- discussion_id: rbsn_aggregator_phenotypes_include_a_disputed_patient
  status: OPEN
  kind: CONTROVERSY
  attaches_to:
  - disease#Kariminejad Neurodevelopmental Syndrome
  - genetic#RBSN
  prompt: >-
    Monarch's HPO annotation set for MONDO:0975795 is sourced in part to
    PMID:25233840 - the p.Gly425Arg patient that the sibling RBSN entry
    deliberately declined to assign to either named disorder. Should that
    patient's phenotypes be counted as phenotypes of this disease?
  rationale: >-
    This is a disagreement between an automated aggregator and a careful read of
    the primary sources, and it is worth recording because a curator working from
    the aggregated list would not see it.

    The sibling entry
    (kb/disorders/Congenital_Myelofibrosis_With_Anemia_Neutropenia_Developmental_Delay_And_Ocular_Abnormalities.yaml)
    analysed the p.Gly425Arg patient in its `rbsn_allelic_series_nosology`
    discussion and declined to count her as a case of either RBSN disorder,
    because ClinVar does not classify that allele under either named condition and
    her phenotype - intractable seizures, developmental delay, dysmorphism and a
    mild marrow phenotype - fits neither cleanly. Meanwhile some cross-referencing
    pipeline has provisionally pulled her into this disease's phenotype profile.

    The practical consequence is specific. A phenotype list taken from that
    aggregated set would import intention tremor, ptosis, coxa valga and several
    dysmorphic features into this entry on the strength of a patient whose
    membership is disputed, and nothing in the list itself would say which
    phenotypes came from which paper. This entry's `phenotypes` section is
    therefore limited to the four features stated in PMID:35652444, each with an
    exact quote from that paper - which is why it is short.

    Resolving it means reading PMID:25233840 against both disorders and deciding
    where, if anywhere, that patient belongs, then updating the sibling entry's
    discussion node with the answer rather than leaving two entries carrying
    different provisional positions.
  notes: >-
    Raised by the automated second-opinion comment on the claim issue
    (dismech#12393), which surfaced the aggregator's sourcing. The identifiers it
    supplied - OMIM:620937, DOID:0061158, MedGen:1874901, UMLS:C5975371, and the
    ClinVar accessions VCV003340064 (p.Arg180Gly) and VCV003340063 (p.Gly183Arg) -
    are recorded here rather than curated into `mappings`, because none of them was
    independently retrieved during this curation.

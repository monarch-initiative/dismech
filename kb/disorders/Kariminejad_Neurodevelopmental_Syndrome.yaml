  notes: >-
    One report, two alleles. PubMed was searched on 2026-09-21 for RBSN,
    rabenosyn-5 and ZFYVE20; no case series, cohort or second clinical report of
    this disorder was returned beyond the defining paper. No rate is recorded, and
    no case count is asserted either, because the abstract states the number of
    alleles rather than the number of patients.

genetic:
- name: EBP
  gene_term:
    preferred_term: EBP
    term:
      id: hgnc:3133
      label: EBP
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: PRESENT
  notes: >-
    EBP (emopamil-binding protein) at Xp11.23 encodes
    3-beta-hydroxysteroid-delta8,delta7-isomerase. Seven distinct alleles have
    been tabulated across the reported MEND caseload: p.Leu18Pro, p.Trp47Cys,
    p.Trp47Arg, p.Val119Gly, p.Ile75Asn, p.Arg147Cys and p.Trp186Arg, in four
    familial and eight sporadic patients, plus one earlier report in which the
    variant was not stated.

    Those seven are all missense, but the allele class is not uniformly missense
    across the entity: the index MEND case carried the nonsense change p.Y11X,
    quoted below. What the alleles have in common is residual activity, not their
    type - a hemizygous male who survives has partial function by construction,
    whatever the mutation looks like.

    Interpreting a new EBP variant in a male requires two determinations, not
    one. First, is it hypomorphic or null - a null allele is not compatible with
    male survival, so a surviving hemizygous male carries residual activity by
    construction. Second, is it constitutional or mosaic - which decides between
    MEND and a male CDPX2 phenotype, and which changes the prognosis.

    The second determination is the one that biochemistry cannot help with. Both
    disorders accumulate the same sterols, and no correlation exists between
    plasma sterol levels and mutational subgroup or phenotype. Testing tissue
    from a lesional and a non-lesional site, or deep sequencing for allele
    fraction, is what answers it.
  evidence:
  - reference: PMID:22229330
    reference_title: "Conradi-Hünermann-Happle syndrome in males vs. MEND syndrome (male EBP disorder with neurological defects)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We found at position 33 of the EBP gene the variant c.33C>A leading to the
      same nonsense mutation p.Y11X that had previously occurred de novo in a
      female with typical manifestations of CHH syndrome.
    explanation: >-
      The observation that decouples allele identity from phenotype: the same
      nonsense change gave CHH syndrome in a female and MEND in this male, so the
      variant alone does not determine which disorder results.
  - reference: PMID:39754633
    reference_title: "Molecular and computational analysis of a novel pathogenic variant in emopamil-binding protein (EBP) involved in cholesterol biosynthetic pathway causing a rare male EBP disorder with neurologic defects (MEND syndrome)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A novel pathogenic missense EBP variant NM_006579.3:c.556T > C (Trp186Arg)
      was found segregating in the affected family.
    explanation: >-
      A further hypomorphic allele, segregating in an affected family.

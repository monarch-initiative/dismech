- name: Reduced 3-beta-Hydroxysteroid-Delta8,Delta7-Isomerase Activity
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    EBP catalyses the delta8-to-delta7 isomerisation in the final steps of
    cholesterol biosynthesis, converting cholestenol to lathosterol. Partial
    loss of that activity has two consequences at once, and both matter: too
    little cholesterol is made, and the immediate substrates accumulate.

    That the accumulating species are toxic rather than inert is the standard
    reading, and it is worth marking as an assumption the sources state rather
    than demonstrate - "allows potentially toxic byproducts... to build up in
    the body leading to abnormal clinical manifestations" is the strength of the
    claim in the literature.

- category: Skeletal
  name: Epiphyseal Stippling
  description: >-
    Chondrodysplasia punctata - stippled calcification of epiphyses, vertebrae,
    trachea and distal ribs. It is the feature the EBP disorders are named for.
    In MEND it is symmetrical, where in the mosaic CDPX2 phenotype it is often
    asymmetric; that asymmetry is one of the clinical criteria separating the
    two in a male.

    Graded OCCASIONAL rather than FREQUENT deliberately. The only available
    evidence is a GeneReviews sentence describing the feature for EBP-CDPX as a
    whole, and stippling is absent from the clinical table of the one MEND family
    reported in detail. The feature belongs to the gene; its frequency in this
    disorder specifically is not established.
  phenotype_term:
    preferred_term: Epiphyseal stippling
    term:
      id: HP:0010655
      label: Epiphyseal stippling
  frequency: OCCASIONAL
  evidence:
  - reference: PMID:21634086
    reference_title: "EBP-Related X-Linked Chondrodysplasia Punctata."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Characteristic features include growth deficiency; distinctive craniofacial
      appearance; chondrodysplasia punctata (stippling of the epiphyses of the
      long bones, vertebrae, trachea, and distal ends of the ribs); often
      asymmetric rhizomelic shortening of limbs; scoliosis; linear or blotchy
      scaling ichthyosis in the newborn; later appearance of linear or whorled
      atrophic patches involving hair follicles (follicular atrophoderma); coarse
      hair with scarring alopecia; and cataracts.
    explanation: >-
      Defines what chondrodysplasia punctata means anatomically in the EBP
      disorders. Graded INDIRECT because the GeneReviews chapter describes
      EBP-CDPX, of which more than 95 percent of live-born affected individuals
      are female - so this sentence characterises the feature for the gene, not
      the frequency for MEND.

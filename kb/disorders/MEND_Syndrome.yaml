- name: Plasma 8(9)-cholestenol and 8-dehydrocholesterol
  presence: PRESENT
  notes: >-
    The two sterols immediately upstream of the isomerase block, measurable in
    plasma, in scale from skin lesions, or in cultured lymphoblasts or

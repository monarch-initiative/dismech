diagnosis:
- name: Plasma sterols establish the pathway; genetics and mosaicism status establish the disease
  description: >-
    Biochemical diagnosis is by raised 8(9)-cholestenol and 8-dehydrocholesterol
    in plasma, in scales from skin lesions, or in cultured lymphoblasts or
    fibroblasts. Molecular confirmation is a hemizygous EBP variant.

    The step that is easy to skip is establishing whether the variant is mosaic.
    In a male, the same biochemical profile and the same EBP variant can give
    either MEND or a CDPX2 phenotype, and clinical outcome and prognosis differ
    between them. The clinical discriminators are the ones a mosaic disorder
    would predict: Blaschko-linear skin, asymmetric limb shortening and
    unilateral findings point to mosaicism and CDPX2; a symmetrical,
    neurologically weighted picture points to a constitutional hypomorphic
    allele and MEND.
  evidence:
  - reference: PMID:21634086
    reference_title: "EBP-Related X-Linked Chondrodysplasia Punctata."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of EBP-CDPX is established in a male proband with typical
      clinical findings; increased concentration of 8(9)-cholestenol and
      8-dehydrocholesterol in plasma, scales from skin lesions, or cultured
      lymphoblasts or fibroblasts; and/or a mosaic hemizygous pathogenic variant
      in EBP identified by molecular genetic testing.
    explanation: >-
      The diagnostic criteria for an affected male, and note the word "mosaic" in
      the molecular criterion - that is the CDPX2 route, and its absence is what
      makes a case MEND.
  - reference: PMID:22229330
    reference_title: "Conradi-Hünermann-Happle syndrome in males vs. MEND syndrome (male EBP disorder with neurological defects)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Because the clinical outcome and prognosis are different it is important to
      distinguish between males with CHH syndrome that represents a mosaic
      phenotype, and those with MEND syndrome that is a nonmosaic trait.
    explanation: >-
      Why the distinction is worth making clinically rather than only
      nosologically.
  - reference: PMID:24700572
    reference_title: "A novel EBP c.224T>A mutation supports the existence of a male-specific disorder independent of CDPX2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This study expands the current phenotypic spectrum of males with hypomorphic
      EBP mutations and supports to the hypothesis that there exists an X-linked
      recessive entity independent of CDPX2.
    explanation: >-
      The independent-entity argument, and the citation the lump/split decision
      recorded in this entry's notes rests on.
treatments:
- name: Simvastatin
  description: >-
    A mechanistic candidate rather than an established therapy. Statins inhibit
    HMG-CoA reductase upstream of the block, which should reduce flux into the
    accumulating precursors, and this was shown directly: cholest-8(9)-enol was
    raised in patient fibroblasts and suppressed by incubation with simvastatin.
    Therapy was being evaluated in two males from that family at the time of
    writing, and no outcome has been reported.

    The topical route has been used in the allelic disorder: a case of
    Conradi-Hunermann-Happle syndrome treated with simvastatin-cholesterol
    ointment, which pairs substrate-flux reduction with cholesterol replacement.
    That is cited here as a related precedent, not as evidence for MEND.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: simvastatin
      term:
        id: CHEBI:9150
        label: simvastatin
  target_mechanisms:
  - target: Sterol Precursor Accumulation and Cholesterol Deficiency
    treatment_effect: INHIBITS
    description: >-
      Statins inhibit HMG-CoA reductase upstream of the block, reducing flux into
      the pathway and so into the accumulating precursors. This acts on one arm of
      the node only. If the phenotype is driven by cholesterol deficiency rather
      than by precursor excess, reducing flux is the wrong direction - which is
      the unresolved question recorded in the mechanism discussion.
    evidence:
    - reference: PMID:24459067
      reference_title: "An unusual phenotype of X-linked developmental delay and extreme behavioral difficulties associated with a mutation in the EBP gene."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Functional studies showed raised levels of cholest-8(9)-enol in patient's
        cultured fibroblast cells, which were suppressed when the cells were
        incubated with simvastatin.
      explanation: >-
        The measured effect on the node, in the patients' own cells.
  evidence:
  - reference: PMID:24459067
    reference_title: "An unusual phenotype of X-linked developmental delay and extreme behavioral difficulties associated with a mutation in the EBP gene."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Functional studies showed raised levels of cholest-8(9)-enol in patient's
      cultured fibroblast cells, which were suppressed when the cells were
      incubated with simvastatin.
    explanation: >-
      The in vitro rationale: the accumulating sterol is reduced by simvastatin
      in the patients' own cells.

differential_diagnoses:
- name: Conradi-Hunermann-Happle syndrome (CDPX2) in a male
  disease_term:
    preferred_term: X-linked chondrodysplasia punctata 2
    term:
      id: MONDO:0020603
      label: X-linked chondrodysplasia punctata 2
  distinguishing_features:
  - CDPX2 in a male is mosaic; MEND is constitutional and non-mosaic.
  - CDPX2 skin follows Blaschko lines and leaves follicular atrophoderma and scarring alopecia; MEND skin is symmetrical and often transient.
  - CDPX2 limb shortening is often asymmetric; MEND findings are symmetrical.
  - Plasma sterols are identical in both and do not discriminate.
  description: >-
    The differential this entity was created to resolve, and the only one that
    really matters. Same gene, same accumulating sterols, different molecular
    situation: CDPX2 in a male is a mosaic phenotype arising postzygotically,
    MEND is a constitutional hypomorphic allele. Clinical outcome and prognosis
    differ, which is why the distinction was drawn, and clear-cut clinical
    criteria have been set out for making it. Plasma sterols do not help.
  evidence:
  - reference: PMID:22229330
    reference_title: "Conradi-Hünermann-Happle syndrome in males vs. MEND syndrome (male EBP disorder with neurological defects)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      When the known male cases with EBP mutations were reviewed, a striking
      nosological difference between the mosaic and nonmosaic phenotypes was
      evident. Clear-cut clinical criteria are elaborated to distinguish between
      CHH syndrome in males and MEND syndrome.
    explanation: >-
      The mosaic/non-mosaic split and the existence of clinical criteria for
      applying it.
  - reference: PMID:22229330
    reference_title: "Conradi-Hünermann-Happle syndrome in males vs. MEND syndrome (male EBP disorder with neurological defects)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      There is confusion in the literature concerning disorders caused by EBP
      (emopamil-binding protein) mutations in males.
    explanation: >-
      The state of the literature that prompted the distinction. Graded OTHER
      because it is a statement about the field rather than a clinical
      observation.
- name: Smith-Lemli-Opitz syndrome
  disease_term:
    preferred_term: Smith-Lemli-Opitz syndrome
    term:
      id: MONDO:0010035
      label: Smith-Lemli-Opitz syndrome
  distinguishing_features:
  - Caused by DHCR7, a different enzyme in the same post-squalene pathway.
  - Autosomal recessive rather than X-linked.
  - Raised 7-dehydrocholesterol rather than 8(9)-cholestenol and 8-dehydrocholesterol.
  description: >-
    The other post-squalene cholesterol disorder that presents with intellectual
    disability and behavioural problems, caused by DHCR7 variants affecting
    7-dehydrocholesterol reductase. The overlap named in the literature is
    2-3 toe syndactyly, intellectual disability and severe behavioural problems -
    which is close enough that genetic testing rather than pattern recognition
    is what confirms the diagnosis.
  evidence:
  - reference: PMID:39754633
    reference_title: "Molecular and computational analysis of a novel pathogenic variant in emopamil-binding protein (EBP) involved in cholesterol biosynthetic pathway causing a rare male EBP disorder with neurologic defects (MEND syndrome)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Some features of MEND syndrome also potentially overlap with
      Smith-Lemli‐Opitz syndrome (SLOS), such as 2–3 toe syndactyly,
      intellectual disability and severe behavioural problems.
    explanation: >-
      The specific overlapping features, and the reason the differential is
      raised in the first place.

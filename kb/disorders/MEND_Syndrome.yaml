  prompt: >-
    Do variants in other cholesterol-homeostasis genes explain the phenotypic
    range within a MEND family sharing one EBP allele?
  attaches_to:
  - "genetic#EBP"
  - "pathophysiology#Sterol Precursor Accumulation and Cholesterol Deficiency"
  rationale: >-
    Four males in one family, all carrying the same primary EBP variant, showed
    a descending gradient of severity. Exome sequencing found that the gradient
    tracked the number of potentially functional variants each carried in
    cholesterol-homeostasis genes - seventeen in the most severely affected, nine
    in each of the middle two, five in the least affected - with APOA5, ABCA1 and
    APOB proposed as the most relevant candidates.

    The correlation is striking and the study is small. Four individuals from one
    family, an in-house scoring system for ranking variant effect, and no
    functional validation of any candidate. What makes it worth an open
    discussion rather than a dismissal is that it is a testable and specific
    claim about a disease whose expressivity is otherwise unexplained, and that
    the candidates are lipid-handling genes rather than an arbitrary set - which
    is at least mechanistically coherent with a cholesterol-biosynthesis defect.

    It also bears on something the entry cannot otherwise explain: sterol levels
    do not correlate with phenotype, so whatever sets severity is not the
    magnitude of the biochemical block. A modifier-burden model is one of the few
    available candidates for what does.
  evidence:
  - reference: PMID:31397093
    reference_title: "Phenotypic severity in a family with MEND syndrome is directly associated with the accumulation of potentially functional variants of cholesterol homeostasis genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patient 1 exhibited 17 variants, both Patients 2 and 3 exhibited nine
      variants, and Patient 4 exhibited only five variants.
    explanation: >-
      The variant-burden gradient that tracks the severity gradient. It is the
      whole quantitative basis of the modifier proposal, and the counts quoted in
      the rationale above come from here.
  proposed_experiments:
  - experiment_id: exp_mend_modifier_replication
    name: Replication of the cholesterol-homeostasis modifier burden in unrelated MEND families
    description: >-
      Compute the same variant-burden score across cholesterol-homeostasis genes
      in additional MEND families with a shared intrafamilial EBP allele, and
      test whether burden predicts severity independently of family. Even three
      or four further families would distinguish a real modifier effect from a
      chance ordering in four brothers.
- discussion_id: mend_mechanism_stops_at_biochemistry
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    How does a cholesterol-poor, precursor-rich cellular state produce
    intellectual disability, cataract, stippling and ichthyosis - and why do the
    same sterols give a different phenotype in CDPX2?
  attaches_to:
  - "pathophysiology#Sterol Precursor Accumulation and Cholesterol Deficiency"
  rationale: >-
    The mechanism chain in this entry stops at the biochemical abnormality, and
    that is deliberate rather than an omission. Nothing available traces a route
    from raised 8(9)-cholestenol and 8-dehydrocholesterol to any of the four
    organ phenotypes. The toxicity of the accumulating species is stated as
    "potentially toxic" in the source and is not measured.

    Two observations make the gap sharper rather than merely unfilled. First,
    sterol levels do not correlate with mutational subgroup or with phenotypic
    traits, so the phenotype is not simply a dose-response to the biochemical
    abnormality. Second, CDPX2 has the same biochemistry and a substantially
    different phenotype - Blaschko-linear skin, asymmetric limb shortening,
    follicular atrophoderma - which in a mosaic disorder is explained by *which
    cells* are affected rather than by *how much* sterol accumulates. That
    points at a cell-autonomous, spatially patterned mechanism rather than a
    circulating toxic metabolite, but it is a pointer, not a finding.

    A worked mechanism matters here because it would say whether the statin
    rationale is right. Reducing flux into the precursors helps if the
    precursors are the problem; it does not obviously help, and could plausibly
    worsen things, if cholesterol deficiency is.
notes: >-
  Relationship to the CDPX2 entry, and a lump/split decision this entry closes.
  kb/disorders/X-linked_Chondrodysplasia_Punctata_2.yaml previously kept the male
  hypomorphic-allele phenotype inside itself and recorded the question as an open
  discussion, `hypomorphic_male_entity`, on the stated grounds that MONDO carried
  only MONDO:0020603 and that the evidence was a single reported family. Both
  premises have since become false: MONDO:0010498 exists and is the term this
  entry binds, and seven distinct EBP alleles are now tabulated across four
  familial and eight sporadic patients. That discussion is resolved in the same
  pull request as this entry, and the CDPX2 notes updated to say the phenotype
  lives here.

  The split is on mosaicism, not on severity. A male who survives by somatic
  mosaicism, or by a null allele plus a supernumerary X, has enzyme-competent
  clones and presents as a CDPX2 patient - he belongs in the CDPX2 entry. A male
  hemizygous for a constitutional hypomorphic allele has partial activity
  everywhere and no competent clones, and belongs here.

  One correction propagated to the CDPX2 entry as part of this. Its discussion
  described the male hypomorphic phenotype as presenting "without the ichthyosis
  and stippling of CDPX2", generalising from the single 2014 family. Mild
  ichthyosis is documented in later MEND patients and is curated here, so that
  sentence was corrected rather than left to contradict this entry. The real
  distinction is the pattern of the skin and skeletal findings - symmetrical
  here, Blaschko-linear there - not their presence.

  A note on how the overlap was missed. The duplicate preflight for this claim
  searched kb/ by MONDO ID and by disease label, both of which came back clean,
  because the concept was held in another entry under a different name and
  surfaced only in a discussion's prose. Searching by mechanism
  (`rg -il "hypomorphic.*EBP" kb/`) would have found it.

  Curation inputs. One Perplexity deep-research run, committed alongside, plus
  independent PubMed searching, with the GeneReviews chapter PMID:21634086
  ("EBP-Related X-Linked Chondrodysplasia Punctata") as the closest available
  expert baseline. There is no GeneReviews chapter for MEND syndrome
  specifically; the EBP chapter is written for EBP-CDPX, of which more than 95
  percent of live-born affected individuals are female, which is why the two
  evidence items taken from it carry directness INDIRECT with the reason stated
  in place.

  The report was used for orientation only. It contains no PMID or DOI in its
  body, and its term validation reported 26 of 53 checked labels naming a
  different term - the worst ratio of the five reports in this curation batch.
  The failures are concentrated in NCIT and are of the most misleading kind:
  NCIT:C288 offered as "Antiepileptic Agent" is Azacitidine, NCIT:C15382 as
  "Neurosurgical Procedure" is Gamma Knife, NCIT:C96116 as "Cataract Extraction"
  is a plastic container closure. Every CURIE here was verified independently
  against OLS.

  A reference that could not be quoted. PMID:27276700, the scanning electron
  microscopy study of the collodion membrane in MEND, returns a journal error
  page rather than content, so nothing is quoted from it and it is not cited.
  The collodion presentation is instead sourced from PMID:39754633.

  Citation markers inside snippets. The cached full text of PMID:39754633 carries
  inline citation markers ("the four coding exons [1-3] of EBP", "8
  [4]-cholestenol", "traits [9]") which are extraction artefacts rather than the
  authors' prose. The reference validator strips bracketed spans before matching
  unless conf/reference_validator_config.yaml declares them literal, so a snippet
  spanning one of these fails verification even when it is a faithful quote.
  Three snippets were therefore shortened to stop before the marker, or replaced
  by the adjacent sentence carrying the same claim; each says so in its own
  explanation. One snippet with a trailing marker ("cryptorchidism [6]") verifies
  without change, so the constraint applies to markers inside a quoted span
  rather than at its end.

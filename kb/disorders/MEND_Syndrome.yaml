genetic:
- name: EBP
  gene_term:
    preferred_term: EBP
    term:
      id: hgnc:3133
      label: EBP
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: PRESENT
  notes: >-
    EBP (emopamil-binding protein) at Xp11.23 encodes
    3-beta-hydroxysteroid-delta8,delta7-isomerase. Reported MEND alleles are
    hypomorphic missense changes: p.W47R, p.W47C in two separate reports at the
    same residue, and p.W186R.

    Interpreting a new EBP variant in a male requires two determinations, not
    one. First, is it hypomorphic or null - a null allele is not compatible with
    male survival, so a surviving hemizygous male carries residual activity by
    construction. Second, is it constitutional or mosaic - which decides between
    MEND and a male CDPX2 phenotype, and which changes the prognosis.

    The second determination is the one that biochemistry cannot help with. Both
    disorders accumulate the same sterols, and no correlation exists between
    plasma sterol levels and mutational subgroup or phenotype. Testing tissue
    from a lesional and a non-lesional site, or deep sequencing for allele
    fraction, is what answers it.
  evidence:
  - reference: PMID:22229330
    reference_title: "Conradi-Hünermann-Happle syndrome in males vs. MEND syndrome (male EBP disorder with neurological defects)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We found at position 33 of the EBP gene the variant c.33C>A leading to the
      same nonsense mutation p.Y11X that had previously occurred de novo in a
      female with typical manifestations of CHH syndrome.
    explanation: >-
      The observation that decouples allele identity from phenotype: the same
      nonsense change gave CHH syndrome in a female and MEND in this male, so the
      variant alone does not determine which disorder results.
  - reference: PMID:39754633
    reference_title: "Molecular and computational analysis of a novel pathogenic variant in emopamil-binding protein (EBP) involved in cholesterol biosynthetic pathway causing a rare male EBP disorder with neurologic defects (MEND syndrome)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A novel pathogenic missense EBP variant NM_006579.3:c.556T > C (Trp186Arg)
      was found segregating in the affected family.
    explanation: >-
      A further hypomorphic allele, segregating in an affected family.
prevalence:
- population: Worldwide
  measure_type: POINT_PREVALENCE
  prevalence_class: BELOW_1_IN_1000000
  rate_per_100000: 0.1
  notes: >-
    Reported as less than 1 per 1,000,000 worldwide. The estimate should be read
    as an order of magnitude rather than a measurement - it appears in a case
    report's background rather than in an epidemiological study, and the entity
    has only existed as a named diagnosis since 2012.

    Under-ascertainment is likely for a specific reason. In an affected male the
    biochemistry does not distinguish this disorder from CDPX2, so a case
    diagnosed before the mosaic/non-mosaic distinction was drawn, or diagnosed
    without mosaicism testing, may be recorded as CDPX2 in a male.
  evidence:
  - reference: PMID:39754633
    reference_title: "Molecular and computational analysis of a novel pathogenic variant in emopamil-binding protein (EBP) involved in cholesterol biosynthetic pathway causing a rare male EBP disorder with neurologic defects (MEND syndrome)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Male EBP disorder with neurologic defects (MEND syndrome) is an extremely
      rare disorder with a prevalence of less than 1/1,000,000 individuals
      worldwide.
    explanation: >-
      The only prevalence figure available for this entity.
diagnosis:
- name: Plasma sterols establish the pathway; genetics and mosaicism status establish the disease
  description: >-
    Biochemical diagnosis is by raised 8(9)-cholestenol and 8-dehydrocholesterol
    in plasma, in scales from skin lesions, or in cultured lymphoblasts or
    fibroblasts. Molecular confirmation is a hemizygous EBP variant.

    The step that is easy to skip is establishing whether the variant is mosaic.
    In a male, the same biochemical profile and the same EBP variant can give
    either MEND or a CDPX2 phenotype, and clinical outcome and prognosis differ
    between them. The clinical discriminators are the ones a mosaic disorder
    would predict: Blaschko-linear skin, asymmetric limb shortening and
    unilateral findings point to mosaicism and CDPX2; a symmetrical,
    neurologically weighted picture points to a constitutional hypomorphic
    allele and MEND.
  evidence:
  - reference: PMID:21634086
    reference_title: "EBP-Related X-Linked Chondrodysplasia Punctata."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of EBP-CDPX is established in a male proband with typical
      clinical findings; increased concentration of 8(9)-cholestenol and
      8-dehydrocholesterol in plasma, scales from skin lesions, or cultured
      lymphoblasts or fibroblasts; and/or a mosaic hemizygous pathogenic variant
      in EBP identified by molecular genetic testing.
    explanation: >-
      The diagnostic criteria for an affected male, and note the word "mosaic" in
      the molecular criterion - that is the CDPX2 route, and its absence is what
      makes a case MEND.
  - reference: PMID:22229330
    reference_title: "Conradi-Hünermann-Happle syndrome in males vs. MEND syndrome (male EBP disorder with neurological defects)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Because the clinical outcome and prognosis are different it is important to
      distinguish between males with CHH syndrome that represents a mosaic
      phenotype, and those with MEND syndrome that is a nonmosaic trait.
    explanation: >-
      Why the distinction is worth making clinically rather than only
      nosologically.
treatments:
- name: Simvastatin
  description: >-
    A mechanistic candidate rather than an established therapy. Statins inhibit
    HMG-CoA reductase upstream of the block, which should reduce flux into the
    accumulating precursors, and this was shown directly: cholest-8(9)-enol was
    raised in patient fibroblasts and suppressed by incubation with simvastatin.
    Therapy was being evaluated in two males from that family at the time of
    writing, and no outcome has been reported.

    The topical route has been used in the allelic disorder: a case of
    Conradi-Hunermann-Happle syndrome treated with simvastatin-cholesterol
    ointment, which pairs substrate-flux reduction with cholesterol replacement.
    That is cited here as a related precedent, not as evidence for MEND.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: simvastatin
      term:
        id: CHEBI:9150
        label: simvastatin
  evidence:
  - reference: PMID:24459067
    reference_title: "An unusual phenotype of X-linked developmental delay and extreme behavioral difficulties associated with a mutation in the EBP gene."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Functional studies showed raised levels of cholest-8(9)-enol in patient's
      cultured fibroblast cells, which were suppressed when the cells were
      incubated with simvastatin.
    explanation: >-
      The in vitro rationale: the accumulating sterol is reduced by simvastatin
      in the patients' own cells.
  - reference: PMID:24459067
    reference_title: "An unusual phenotype of X-linked developmental delay and extreme behavioral difficulties associated with a mutation in the EBP gene."
    supports: NO_EVIDENCE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Simvastatin therapy is being evaluated in two males from this family.
    explanation: >-
      Graded NO_EVIDENCE deliberately: this states that a trial was under way, not
      that it worked. It is cited so a reader knows the clinical question was
      asked and that no answer has been published.
  - reference: PMID:39168486
    reference_title: "A case of Conradi-Hünermann-Happle syndrome treated with topical simvastatin-cholesterol ointment."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The purpose of this case report is to present a case of a patient treated
      with simvastatin-cholesterol ointment.
    explanation: >-
      A topical precedent in the allelic disorder. Graded INDIRECT because the
      patient has CDPX2 rather than MEND; it establishes that the approach has
      been tried in EBP deficiency, not that it helps in this disease.
- name: Symptomatic and Multidisciplinary Management
  description: >-
    Treatment is symptomatic and individualised: orthopaedic management of
    skeletal manifestations, dermatological care with emollients and
    keratolytics, sun protection, cataract extraction and standard ophthalmic
    care, and standard interventions for hearing loss.

    One avoidance item is specific enough to be worth stating: prolonged sun
    exposure risks dehydration through overheating in a child with ichthyosis,
    and oil-based emollients plus direct sun can cause sunburn - so the two
    routine skin measures interact.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:21634086
    reference_title: "EBP-Related X-Linked Chondrodysplasia Punctata."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Agents/circumstances to avoid: Prolonged sun exposure for individuals with
      ichthyosis, who are at risk of dehydration secondary to overheating. Use of
      emollients (which are oil based) and direct sun exposure can lead to
      sunburn.
    explanation: >-
      The one avoidance item with a stated mechanism. Graded INDIRECT because the
      GeneReviews chapter is written for EBP-CDPX, in which more than 95 percent
      of live-born affected individuals are female - but the advice attaches to
      the ichthyosis, which MEND shares.
differential_diagnoses:
- name: Conradi-Hunermann-Happle syndrome (CDPX2) in a male
  description: >-
    The differential this entity was created to resolve, and the only one that
    really matters. Same gene, same accumulating sterols, different molecular
    situation: CDPX2 in a male is a mosaic phenotype arising postzygotically,
    MEND is a constitutional hypomorphic allele. Clinical outcome and prognosis
    differ, which is why the distinction was drawn, and clear-cut clinical
    criteria have been set out for making it. Plasma sterols do not help.
  evidence:
  - reference: PMID:22229330
    reference_title: "Conradi-Hünermann-Happle syndrome in males vs. MEND syndrome (male EBP disorder with neurological defects)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      When the known male cases with EBP mutations were reviewed, a striking
      nosological difference between the mosaic and nonmosaic phenotypes was
      evident. Clear-cut clinical criteria are elaborated to distinguish between
      CHH syndrome in males and MEND syndrome.
    explanation: >-
      The mosaic/non-mosaic split and the existence of clinical criteria for
      applying it.
  - reference: PMID:22229330
    reference_title: "Conradi-Hünermann-Happle syndrome in males vs. MEND syndrome (male EBP disorder with neurological defects)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      There is confusion in the literature concerning disorders caused by EBP
      (emopamil-binding protein) mutations in males.
    explanation: >-
      The state of the literature that prompted the distinction. Graded OTHER
      because it is a statement about the field rather than a clinical
      observation.
- name: Smith-Lemli-Opitz syndrome
  description: >-
    The other post-squalene cholesterol disorder that presents with intellectual
    disability and behavioural problems, caused by DHCR7 variants affecting
    7-dehydrocholesterol reductase. The overlap named in the literature is
    2-3 toe syndactyly, intellectual disability and severe behavioural problems -
    which is close enough that genetic testing rather than pattern recognition
    is what confirms the diagnosis.
  evidence:
  - reference: PMID:39754633
    reference_title: "Molecular and computational analysis of a novel pathogenic variant in emopamil-binding protein (EBP) involved in cholesterol biosynthetic pathway causing a rare male EBP disorder with neurologic defects (MEND syndrome)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Some features of MEND syndrome also potentially overlap with
      Smith-Lemli‐Opitz syndrome (SLOS), such as 2–3 toe syndactyly,
      intellectual disability and severe behavioural problems.
    explanation: >-
      The specific overlapping features, and the reason the differential is
      raised in the first place.
discussions:
- discussion_id: mend_modifier_genes_explain_variability
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Do variants in other cholesterol-homeostasis genes explain the phenotypic
    range within a MEND family sharing one EBP allele?
  attaches_to:
  - "genetic#EBP"
  - "pathophysiology#Sterol Precursor Accumulation and Cholesterol Deficiency"
  rationale: >-
    Four males in one family, all carrying the same primary EBP variant, showed
    a descending gradient of severity. Exome sequencing found that the gradient
    tracked the number of potentially functional variants each carried in
    cholesterol-homeostasis genes - seventeen in the most severely affected, nine
    in each of the middle two, five in the least affected - with APOA5, ABCA1 and
    APOB proposed as the most relevant candidates.

    The correlation is striking and the study is small. Four individuals from one
    family, an in-house scoring system for ranking variant effect, and no
    functional validation of any candidate. What makes it worth an open
    discussion rather than a dismissal is that it is a testable and specific
    claim about a disease whose expressivity is otherwise unexplained, and that
    the candidates are lipid-handling genes rather than an arbitrary set - which
    is at least mechanistically coherent with a cholesterol-biosynthesis defect.

    It also bears on something the entry cannot otherwise explain: sterol levels
    do not correlate with phenotype, so whatever sets severity is not the
    magnitude of the biochemical block. A modifier-burden model is one of the few
    available candidates for what does.
  proposed_experiments:
  - experiment_id: exp_mend_modifier_replication
    name: Replication of the cholesterol-homeostasis modifier burden in unrelated MEND families
    description: >-
      Compute the same variant-burden score across cholesterol-homeostasis genes
      in additional MEND families with a shared intrafamilial EBP allele, and
      test whether burden predicts severity independently of family. Even three
      or four further families would distinguish a real modifier effect from a
      chance ordering in four brothers.
- discussion_id: mend_mechanism_stops_at_biochemistry
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    How does a cholesterol-poor, precursor-rich cellular state produce
    intellectual disability, cataract, stippling and ichthyosis - and why do the
    same sterols give a different phenotype in CDPX2?
  attaches_to:
  - "pathophysiology#Sterol Precursor Accumulation and Cholesterol Deficiency"
  rationale: >-
    The mechanism chain in this entry stops at the biochemical abnormality, and
    that is deliberate rather than an omission. Nothing available traces a route
    from raised 8(9)-cholestenol and 8-dehydrocholesterol to any of the four
    organ phenotypes. The toxicity of the accumulating species is stated as
    "potentially toxic" in the source and is not measured.

    Two observations make the gap sharper rather than merely unfilled. First,
    sterol levels do not correlate with mutational subgroup or with phenotypic
    traits, so the phenotype is not simply a dose-response to the biochemical
    abnormality. Second, CDPX2 has the same biochemistry and a substantially
    different phenotype - Blaschko-linear skin, asymmetric limb shortening,
    follicular atrophoderma - which in a mosaic disorder is explained by *which
    cells* are affected rather than by *how much* sterol accumulates. That
    points at a cell-autonomous, spatially patterned mechanism rather than a
    circulating toxic metabolite, but it is a pointer, not a finding.

    A worked mechanism matters here because it would say whether the statin
    rationale is right. Reducing flux into the precursors helps if the
    precursors are the problem; it does not obviously help, and could plausibly
    worsen things, if cholesterol deficiency is.
notes: >-
  Curation inputs. One Perplexity deep-research run, committed alongside, plus
  independent PubMed searching, with the GeneReviews chapter PMID:21634086
  ("EBP-Related X-Linked Chondrodysplasia Punctata") as the closest available
  expert baseline. There is no GeneReviews chapter for MEND syndrome
  specifically; the EBP chapter is written for EBP-CDPX, of which more than 95
  percent of live-born affected individuals are female, which is why the two
  evidence items taken from it carry directness INDIRECT with the reason stated
  in place.

  The report was used for orientation only. It contains no PMID or DOI in its
  body, and its term validation reported 26 of 53 checked labels naming a
  different term - the worst ratio of the five reports in this curation batch.
  The failures are concentrated in NCIT and are of the most misleading kind:
  NCIT:C288 offered as "Antiepileptic Agent" is Azacitidine, NCIT:C15382 as
  "Neurosurgical Procedure" is Gamma Knife, NCIT:C96116 as "Cataract Extraction"
  is a plastic container closure. Every CURIE here was verified independently
  against OLS.

  A reference that could not be quoted. PMID:27276700, the scanning electron
  microscopy study of the collodion membrane in MEND, returns a journal error
  page rather than content, so nothing is quoted from it and it is not cited.
  The collodion presentation is instead sourced from PMID:39754633.

  Citation markers inside snippets. The cached full text of PMID:39754633 carries
  inline citation markers ("the four coding exons [1-3] of EBP", "8
  [4]-cholestenol", "traits [9]") which are extraction artefacts rather than the
  authors' prose. The reference validator strips bracketed spans before matching
  unless conf/reference_validator_config.yaml declares them literal, so a snippet
  spanning one of these fails verification even when it is a faithful quote.
  Three snippets were therefore shortened to stop before the marker, or replaced
  by the adjacent sentence carrying the same claim; each says so in its own
  explanation. One snippet with a trailing marker ("cryptorchidism [6]") verifies
  without change, so the constraint applies to markers inside a quoted span
  rather than at its end.

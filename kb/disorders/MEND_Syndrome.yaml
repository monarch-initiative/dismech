prevalence:
- population: Worldwide
  measure_type: POINT_PREVALENCE
  prevalence_class: BELOW_1_IN_1000000
  rate_per_100000: 0.1
  notes: >-
    Reported as less than 1 per 1,000,000 worldwide. The estimate should be read
    as an order of magnitude rather than a measurement - it appears in a case
    report's background rather than in an epidemiological study, and the entity
    has only existed as a named diagnosis since 2012.

    Under-ascertainment is likely for a specific reason. In an affected male the
    biochemistry does not distinguish this disorder from CDPX2, so a case
    diagnosed before the mosaic/non-mosaic distinction was drawn, or diagnosed
    without mosaicism testing, may be recorded as CDPX2 in a male.

inheritance:
- name: X-linked recessive inheritance
  inheritance_term:
    preferred_term: X-linked recessive inheritance
    term:
      id: HP:0001419
      label: X-linked recessive inheritance
  description: >-
    X-linked recessive, and non-mosaic - both halves of that are load-bearing.
    Affected males are hemizygous for a hypomorphic EBP variant inherited from a
    clinically asymptomatic heterozygous mother, and the disorder can run
    through several generations of a family: one reported pedigree has four
    affected males across three generations.

    This is the opposite pattern to the disorder EBP is better known for. EBP
    null variants are inherited in an X-linked *dominant* manner with male
    lethality, so the mothers there are the affected ones. A family in which
    only males are affected and the carrier women are well is itself a pointer
    towards a hypomorphic allele.
  evidence:
  - reference: PMID:39754633
    reference_title: "Molecular and computational analysis of a novel pathogenic variant in emopamil-binding protein (EBP) involved in cholesterol biosynthetic pathway causing a rare male EBP disorder with neurologic defects (MEND syndrome)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The hypomorphic hemizygous non-mosaic EBP variants cause MEND syndrome in
      males who are born to clinically asymptomatic heterozygous mothers whereas
      null EBP variants are associated with intrauterine lethality in males and a
      severe X-linked dominant phenotype in females known as human
      chondrodysplasia punctata 2 (CDPX2; Conradi-Hünermann-Happle syndrome)
    explanation: >-
      The full inheritance contrast in one sentence: hypomorphic hemizygous
      non-mosaic gives MEND, null gives male lethality and female CDPX2.
  - reference: PMID:24459067
    reference_title: "An unusual phenotype of X-linked developmental delay and extreme behavioral difficulties associated with a mutation in the EBP gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report on a family in which four males over three generations are
      affected with X-linked recessive developmental delay, learning
      difficulties, severe behavioral difficulties and mild dysmorphic features.
    explanation: >-
      Multigenerational X-linked recessive transmission, which is what
      distinguishes this from the de novo mosaic situation.
pathophysiology:
- name: Hypomorphic Non-Mosaic EBP Variant
  biological_scale: MOLECULAR
  role: trigger
  mechanism_confidence: ESTABLISHED
  description: >-
    A hemizygous missense or hypomorphic variant in EBP, present in every cell.
    EBP lies at Xp11.23 and encodes a 230-amino-acid protein with four
    functionally important transmembrane domains, resident in the endoplasmic
    reticulum membrane. Reported MEND alleles include p.W47R, p.W47C (twice, at
    the same residue), and p.W186R.

    The defining feature is not which residue is hit but how much activity
    survives and in how many cells. A null allele kills a hemizygous male in
    early gestation; a hypomorphic one leaves enough enzyme for viability. And
    the variant being constitutional rather than postzygotic is what makes the
    phenotype uniform rather than Blaschko-linear.

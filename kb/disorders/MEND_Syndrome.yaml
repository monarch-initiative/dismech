name: MEND Syndrome
creation_date: "2026-08-29T21:45:00Z"
category: Mendelian
disease_term:
  preferred_term: MEND syndrome
  term:
    id: MONDO:0010498
    label: MEND syndrome
description: >-
  MEND syndrome - Male EBP Disorder with Neurologic defects - is an X-linked
  recessive disorder of the post-squalene cholesterol pathway. Hypomorphic,
  non-mosaic hemizygous variants in EBP reduce the activity of
  3-beta-hydroxysteroid-delta8,delta7-isomerase, so cells make too little
  cholesterol while the immediate precursors 8(9)-cholestenol and
  8-dehydrocholesterol accumulate. Affected boys are born to clinically
  asymptomatic carrier mothers and present with intellectual disability,
  developmental delay and behavioural difficulty, short stature, cataracts,
  skeletal anomalies and a neonatal ichthyosiform skin phenotype, sometimes as a
  collodion baby.

  The entity exists because of a nosological argument, and that argument is the
  most useful thing in this entry. EBP variants in males produce three different
  outcomes depending on allele severity and mosaicism, not on the variant's
  position:

  A **null** variant is lethal in a hemizygous male in early gestation, and in a
  heterozygous female produces X-linked dominant chondrodysplasia punctata
  (CDPX2, Conradi-Hunermann-Happle syndrome). A **mosaic** variant in a male -
  arising postzygotically - produces the CDPX2 phenotype in that male, because
  the surviving wild-type cell population rescues viability while the mutant
  clone gives the Blaschko-linear skin and asymmetric skeletal findings. A
  **hypomorphic, non-mosaic** variant produces MEND: uniform partial enzyme
  activity in every cell, which is survivable and gives a symmetrical,
  neurologically weighted phenotype instead.

  The practical consequence is stated plainly in the literature and is worth
  repeating: plasma sterols do not distinguish MEND from CDPX2 in an affected
  male. Both accumulate the same two precursors, and no correlation has been
  found between sterol levels and phenotype. Only genetic testing, plus
  determining whether the variant is mosaic, separates them - and the prognosis
  differs, which is why the distinction was proposed in the first place.

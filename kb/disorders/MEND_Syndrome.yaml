  - reference: PMID:24459067
    reference_title: "An unusual phenotype of X-linked developmental delay and extreme behavioral difficulties associated with a mutation in the EBP gene."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Functional studies showed raised levels of cholest-8(9)-enol in patient's
      cultured fibroblast cells, which were suppressed when the cells were
      incubated with simvastatin.
    explanation: >-
      Confirms the block in patient cells and, in the same experiment, shows it
      is pharmacologically reversible - which is the rationale for the statin
      treatment below.
  downstream:
  - target: pathophysiology#Sterol Precursor Accumulation and Cholesterol Deficiency
    causal_link_type: DIRECT
- name: Sterol Precursor Accumulation and Cholesterol Deficiency
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  description: >-
    Plasma, skin scales and cultured cells show raised 8(9)-cholestenol and
    8-dehydrocholesterol. This is the biochemical signature of the disease and
    the basis of biochemical diagnosis.

    It is also, deliberately, where the mechanism chain in this entry stops. How
    a cholesterol-poor, precursor-rich cellular environment produces
    intellectual disability, cataract, epiphyseal stippling and ichthyosis is
    not established, and the entry does not construct a chain it cannot cite.
    Two things are known that bear on it and neither closes the gap: the same
    biochemistry in CDPX2 produces a very different phenotype, and sterol levels
    do not correlate with phenotype within either disease.
  evidence:
  - reference: PMID:24459067
    reference_title: "An unusual phenotype of X-linked developmental delay and extreme behavioral difficulties associated with a mutation in the EBP gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Plasma sterol analysis in three of the four affected males demonstrated
      increased concentrations of 8-dehydrocholesterol (8-DHC) and
      cholest-8(9)-enol.
    explanation: >-
      The biochemical phenotype measured in affected individuals.
  - reference: PMID:39754633
    reference_title: "Molecular and computational analysis of a novel pathogenic variant in emopamil-binding protein (EBP) involved in cholesterol biosynthetic pathway causing a rare male EBP disorder with neurologic defects (MEND syndrome)."
    supports: NO_EVIDENCE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      So, in affected males, biochemical testing will not be of use in
      differentiating CDPX2 from MEND syndrome.
    explanation: >-
      Graded NO_EVIDENCE because it is the explicit statement that the
      biochemical measurement does not discriminate between the two EBP
      disorders - cited to mark the absence of a usable signal rather than to
      support a claim. The preceding sentence, which says there is no correlation
      between sterol levels and phenotype, carries inline citation markers that
      the reference validator strips, so this consequence sentence is quoted
      instead.

- name: Symptomatic and Multidisciplinary Management
  description: >-
    Treatment is symptomatic and individualised: orthopaedic management of
    skeletal manifestations, dermatological care with emollients and
    keratolytics, sun protection, cataract extraction and standard ophthalmic
    care, and standard interventions for hearing loss.

    One avoidance item is specific enough to be worth stating: prolonged sun
    exposure risks dehydration through overheating in a child with ichthyosis,
    and oil-based emollients plus direct sun can cause sunburn - so the two
    routine skin measures interact.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Supportive Care

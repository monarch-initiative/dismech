name: 2-Methylbutyryl-CoA Dehydrogenase Deficiency
category: Mendelian
creation_date: '2026-02-23T00:00:00Z'
synonyms:
- Short/branched-chain acyl-CoA dehydrogenase deficiency
- SBCADD
- SBCAD deficiency
- 2-methylbutyrylglycinuria
- 2-MBCDD
- 2-methylbutyryl-CoA dehydrogenase deficiency
description: >-
  2-Methylbutyryl-CoA dehydrogenase deficiency (SBCADD) is an autosomal
  recessive biochemical phenotype of L-isoleucine catabolism caused by
  biallelic pathogenic variants in ACADSB. Reduced mitochondrial SBCAD activity
  leads to accumulation of 2-methylbutyrylcarnitine, detected within the
  unresolved C5 signal in blood, and increased 2-methylbutyrylglycine (2-MBG)
  in urine. Because C5 includes isobaric isovalerylcarnitine and can also reflect
  pivaloylcarnitine, confirmatory biochemical and molecular testing is important
  to distinguish SBCADD from isovaleric acidemia or analytic interference.
  Newborn-screening cohorts are overwhelmingly clinically well, and current
  evidence supports a primarily biochemical, largely benign phenotype.
  Neurologic findings and acute metabolic decompensation have been reported in
  symptom-ascertained individuals, but their causal relationship to ACADSB
  deficiency remains unresolved. Clinical benefit from carnitine, protein
  restriction, or illness protocols has not been established. The c.1165A>G
  founder variant accounts for the high genotype-based birth prevalence in the
  Hmong population and is also enriched in some Miao and Dong populations.

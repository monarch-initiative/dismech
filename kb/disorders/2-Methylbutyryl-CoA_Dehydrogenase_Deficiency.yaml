progression:
- phase: Newborn-screening ascertainment
  age_range: Neonatal period
  notes: >-
    SBCADD is usually detected incidentally through elevated C5. Urine organic
    acid or acylglycine analysis and ACADSB testing distinguish it from
    isovaleric acidemia and pivalate-related C5 elevations. C5 and urinary
    metabolites can vary, so a single normal follow-up value does not exclude
    the biochemical phenotype.
  evidence:
  - reference: PMID:41722717
    reference_title: >-
      Outlook on ACADSB variants shaping metabolomic patterns and clinical
      outcomes - experience from a Central European country.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Accurate differentiation from isovaleric acidemia and careful integration
      of biochemical, genetic and clinical data remain essential.
    explanation: >-
      The current clinical series emphasizes integrated confirmation after the
      nonspecific C5 screening signal.
- phase: Predominantly asymptomatic follow-up
  age_range: Infancy through adulthood; long-term data remain limited
  notes: >-
    Most newborn-screened individuals remain clinically well. A 2019 review
    counted symptoms in about 10% of published patients, but that literature is
    enriched for symptom-ascertained cases and later cohorts question whether
    the neurologic findings were caused by SBCADD. Isolated reports of acute
    decompensation justify clinical awareness, but the absolute risk and benefit
    of preventive treatment remain unknown.
  evidence:
  - reference: PMID:20547083
    reference_title: >-
      Characterization of new ACADSB gene sequence mutations and clinical
      implications in patients with 2-methylbutyrylglycinuria identified by
      newborn screening.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our patients have been well without treatment and call for careful
      follow-up studies to learn the true clinical impact of this disorder.
    explanation: >-
      Eleven newborn-screened non-Hmong patients remained well without treatment.
  - reference: PMID:41722717
    reference_title: >-
      Outlook on ACADSB variants shaping metabolomic patterns and clinical
      outcomes - experience from a Central European country.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings support SBCADD as a primarily biochemical phenotype with a
      largely benign course
    explanation: >-
      The newest clinical series supports a largely benign biochemical phenotype.

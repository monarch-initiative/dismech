biochemical:
- name: C5-acylcarnitine signal in blood
  presence: INCREASED
  context: >-
    Elevated C5 is the usual newborn-screening signal. Standard tandem mass
    spectrometry does not resolve 2-methylbutyrylcarnitine from
    isovalerylcarnitine or pivaloylcarnitine, so it is a screening trigger
    rather than proof of SBCADD. C5 can be normal in genetically confirmed cases.
  readouts:
  - target: Impaired isoleucine catabolism via SBCAD loss-of-function
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      In a confirmed case, 2-methylbutyrylcarnitine contributes to the unresolved
      C5 signal and reports the upstream SBCAD-dependent isoleucine block.
    evidence:
    - reference: PMID:20547083
      reference_title: >-
        Characterization of new ACADSB gene sequence mutations and clinical
        implications in patients with 2-methylbutyrylglycinuria identified by
        newborn screening.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        isovaleryl- and 2-methylbutyrylcarnitine share the same mass/charge ratio
      explanation: >-
        The full-text discussion establishes why standard C5 requires confirmation.
  evidence:
  - reference: PMID:40598537
    reference_title: >-
      Usefulness of levels of 2-methylbutyrylglycine and 2-ethylhydracrylic acid
      in urine for diagnosing 2-methylbutyrylglycinuria.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ten individuals showed elevated C5 in blood, ranging from 0.32 to 1.64
      µmol/L; the remaining two individuals showed C5 levels within the normal
      reference range.
    explanation: >-
      C5 was within the local reference interval in two of 12 genotyped cases.
- name: 2-Methylbutyrylglycine (2-MBG) in urine
  presence: INCREASED
  context: >-
    Urinary 2-MBG is the characteristic acylglycine marker and is more specific
    than 2-EHA in the available diagnostic study. Excretion can vary, so
    diagnosis should integrate urine findings with molecular or enzyme confirmation.
  readouts:
  - target: Impaired isoleucine catabolism via SBCAD loss-of-function
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      Urinary 2-MBG reports accumulation and glycine conjugation of
      2-methylbutyryl-CoA-derived material upstream of the SBCAD block.
    evidence:
    - reference: PMID:15615815
      reference_title: >-
        2-ethylhydracrylic aciduria in short/branched-chain acyl-CoA
        dehydrogenase deficiency: application to diagnosis and implications for
        the R-pathway of isoleucine oxidation.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Isolated excretion of 2-methylbutyrylglycine (2-MBG) is the hallmark of
        short/branched-chain acyl-CoA dehydrogenase deficiency (SBCADD)
      explanation: >-
        This links the urinary conjugate to the proximal isoleucine-pathway defect.
  evidence:
  - reference: PMID:40598537
    reference_title: >-
      Usefulness of levels of 2-methylbutyrylglycine and 2-ethylhydracrylic acid
      in urine for diagnosing 2-methylbutyrylglycinuria.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both markers showed 100% diagnostic sensitivity, and 2-MBG showed
      slightly higher specificity than 2-EHA
    explanation: >-
      All 12 genotyped cases in this retrospective study had detectable 2-MBG,
      but the small selected sample limits generalization.
- name: 2-Ethylhydracrylic acid (2-EHA) in urine
  presence: INCREASED
  context: >-
    Increased urinary 2-EHA is a readout of the minor R-pathway and can be
    easier to detect than an acylglycine peak. It is not specific to SBCADD and
    must be combined with 2-MBG, the acylcarnitine pattern, and confirmation.
  readouts:
  - target: Metabolic rerouting via the R-pathway of isoleucine oxidation
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      Urinary 2-EHA reports R-pathway flux associated with interruption or
      overflow of the predominant S-pathway.
    evidence:
    - reference: PMID:15615815
      reference_title: >-
        2-ethylhydracrylic aciduria in short/branched-chain acyl-CoA
        dehydrogenase deficiency: application to diagnosis and implications for
        the R-pathway of isoleucine oxidation.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Approximately 40-46% of total 2-methylbutyric acid conjugates were in
        the form of the R-isomer, indicating significant metabolism via the R-pathway.
      explanation: >-
        Chiral analysis in four patients directly supports R-pathway metabolism.
  evidence:
  - reference: PMID:40598537
    reference_title: >-
      Usefulness of levels of 2-methylbutyrylglycine and 2-ethylhydracrylic acid
      in urine for diagnosing 2-methylbutyrylglycinuria.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      it should be used as a diagnostic marker only in conjunction with other
      markers and clinical factors.
    explanation: >-
      The diagnostic study limits 2-EHA to a combined-marker role.
genetic:
- name: ACADSB pathogenic variants
  gene_term:
    preferred_term: ACADSB
    term:
      id: hgnc:91
      label: ACADSB
  association: Pathogenic Variants
  inheritance:
  - name: Autosomal recessive
    evidence:
    - reference: PMID:12837870
      reference_title: >-
        Prospective diagnosis of 2-methylbutyryl-CoA dehydrogenase deficiency in
        the Hmong population by newborn screening using tandem mass spectrometry.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        2-methylbutyryl-CoA dehydrogenase deficiency, also known as
        short/branched-chain acyl-CoA dehydrogenase (SBCAD) deficiency, is a
        recently described autosomal recessive disorder of L-isoleucine metabolism.
      explanation: Directly states autosomal recessive inheritance.
  variants:
  - name: c.1165A>G (exon 10 skipping), Hmong founder variant
    description: >-
      c.1165A>G causes exon 10 skipping and is a founder variant in the Hmong
      population. In random Wisconsin Hmong newborn cards, 1.3% were homozygous
      and 21.8% heterozygous. The variant is enriched in Miao and Dong groups in
      China, but those data do not prove a separate founder event.
    evidence:
    - reference: PMID:12837870
      reference_title: >-
        Prospective diagnosis of 2-methylbutyryl-CoA dehydrogenase deficiency in
        the Hmong population by newborn screening using tandem mass spectrometry.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Molecular genetic analysis performed for 3 of these patients revealed
        that all are homozygous for an 1165A>G mutation that causes skipping of
        exon 10 of the SBCAD gene.
      explanation: Directly supports the exon-skipping effect.
    - reference: PMID:23712021
      reference_title: >-
        Prevalence and mutation analysis of short/branched chain acyl-CoA
        dehydrogenase deficiency (SBCADD) detected on newborn screening in Wisconsin.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        This corresponds to a prevalence in this ethnic group of being
        homozygous for the mutation of 1.3% (95% confidence interval 0.8-2.2%)
        and of being heterozygous for the mutation of 21.8% (95% confidence
        interval 19.4-24.3%)
      explanation: >-
        Random newborn-card genotyping supplies the Hmong homozygote and carrier estimates.
    - reference: PMID:38784038
      reference_title: >-
        206,977 newborn screening results reveal the ethnic differences in the
        spectrum of inborn errors of metabolism in Huaihua, China.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        NM_001609.4:c.1165A>G in the ACADSB gene for Miao and Dong ethnic groups
      explanation: >-
        The cohort identifies ethnic enrichment but not an independent founder event.
  - name: c.303+3A>G, Somali/Eritrean population-enriched splice variant
    description: >-
      The intron 3 c.303+3A>G splice-region variant was observed homozygously in
      a Somali child and in two previously reported people of Somali and
      Eritrean origin. This small case series suggests population enrichment but
      does not establish a founder effect or penetrance for neurologic findings.
    evidence:
    - reference: PMID:17883863
      reference_title: >-
        2-methylbutyryl-CoA dehydrogenase deficiency associated with autism and
        mental retardation: a case report.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        This mutation was also found in two previously reported cases with
        SBCADD, both originating from Somalia and Eritrea, indicating that it is
        relatively prevalent in this population.
      explanation: >-
        The report supports recurrence of c.303+3A>G in people of Somali and
        Eritrean origin while leaving the population frequency uncertain.
  - name: Diverse ACADSB loss-of-function and missense variants
    description: >-
      Nonsense, splice, frameshift, and missense variants occur outside the
      Hmong founder background. Expression studies of selected missense alleles
      demonstrated inactive or unstable SBCAD protein; genotype-phenotype
      correlations remain unresolved.
    evidence:
    - reference: PMID:20547083
      reference_title: >-
        Characterization of new ACADSB gene sequence mutations and clinical
        implications in patients with 2-methylbutyrylglycinuria identified by
        newborn screening.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Escherichia coli expression studies revealed that the missense mutations
        identified lead to inactivation or instability of the mutant SBCAD enzymes.
      explanation: >-
        Functional expression assays support loss of function for selected alleles.
  features: >-
    Biallelic pathogenic ACADSB variants reduce the activity or stability of the
    mitochondrial short/branched-chain acyl-CoA dehydrogenase. The gene-disease
    relationship is definitive, but variant class does not currently predict
    whether an individual will have attributable clinical symptoms.
  evidence:
  - reference: CGGV:assertion_8bfa3857-c96c-40ac-b4c1-2cf04fd4eb4f-2019-03-22T160000.000Z
    reference_title: >-
      ACADSB / 2-methylbutyryl-CoA dehydrogenase deficiency (Definitive)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      ACADSB | HGNC:91 | 2-methylbutyryl-CoA dehydrogenase deficiency |
      MONDO:0012392 | AR | Definitive
    explanation: >-
      ClinGen classifies the autosomal-recessive gene-disease relationship as definitive.
treatments:
- name: Carnitine supplementation
  description: >-
    L-carnitine has been used or proposed to support acyl-group conjugation. A
    two-patient report used
    100 mg/kg/day, and a small longitudinal cohort observed biochemical changes,
    but no controlled evidence shows clinical benefit and routine treatment of
    clinically well individuals is not established.
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: carnitine supplementation
    term:
      id: NCIT:C15433
      label: Nutritional Support
    therapeutic_agent:
    - preferred_term: (R)-carnitine
      term:
        id: CHEBI:16347
        label: (R)-carnitine
  evidence:
  - reference: PMID:30730842
    reference_title: >-
      Clinical, biochemical, and molecular spectrum of short/branched-chain
      acyl-CoA dehydrogenase deficiency: two new cases and review of literature.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Longitudinal biochemical monitoring of the two patients while on treatment
      with carnitine (100 mg/kg/day) was provided.
    explanation: >-
      This documents use in two cases, not an evidence-based dose range or efficacy.
  - reference: PMID:36147814
    reference_title: >-
      Long-term monitoring for short/branched-chain acyl-CoA dehydrogenase
      deficiency: A single-center 4-year experience and open issues.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the effects of proposed treatments remain uncertain as follow-data are lacking.
    explanation: >-
      The longitudinal study explicitly states that treatment effects remain uncertain.
- name: Precautionary fasting avoidance and illness plan
  description: >-
    Avoiding prolonged fasting and providing an illness or emergency plan have
    been proposed because isolated decompensations occurred during catabolic
    stress. This is a precaution based on uncertain risk, not a strategy with
    demonstrated outcome benefit in SBCADD.
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Possible catabolic-stress susceptibility
    treatment_effect: MODULATES
    description: >-
      The plan is intended to reduce catabolic stress if susceptibility is real;
      both the mechanism and treatment benefit remain unproven.
    evidence:
    - reference: PMID:30730842
      reference_title: >-
        Clinical, biochemical, and molecular spectrum of short/branched-chain
        acyl-CoA dehydrogenase deficiency: two new cases and review of literature.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Providing an emergency protocol for the management of acute catabolic
        episodes seems reasonable in asymptomatic patients with SBCAD deficiency.
      explanation: >-
        “Seems reasonable” is precautionary opinion rather than measured efficacy.
  evidence:
  - reference: PMID:20547083
    reference_title: >-
      Characterization of new ACADSB gene sequence mutations and clinical
      implications in patients with 2-methylbutyrylglycinuria identified by
      newborn screening.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      it would seem more prudent to continue a normal diet in these infants but
      also have the family maintain some level of vigilance during intercurrent illnesses.
    explanation: >-
      The cohort authors advise illness vigilance while emphasizing uncertainty.
- name: Dietary management
  description: >-
    Routine protein restriction for an asymptomatic person is not supported by
    outcome evidence. Early screen-detected infants received presymptomatic
    dietary treatment, but efficacy was explicitly unestablished; one autism
    case had no measurable benefit from a five-month low-protein trial.
  action_category: THERAPEUTIC
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: dietary intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  target_mechanisms:
  - target: Impaired isoleucine catabolism via SBCAD loss-of-function
    treatment_effect: MODULATES
    description: >-
      Protein or isoleucine restriction could reduce precursor input, but no
      clinical benefit has been demonstrated.
    evidence:
    - reference: PMID:12837870
      reference_title: >-
        Prospective diagnosis of 2-methylbutyryl-CoA dehydrogenase deficiency in
        the Hmong population by newborn screening using tandem mass spectrometry.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The continued efficacy of long-term dietary therapy instituted
        presymptomatically remains to be established.
      explanation: The early treated cohort could not establish efficacy.
  evidence:
  - reference: PMID:17883863
    reference_title: >-
      2-methylbutyryl-CoA dehydrogenase deficiency associated with autism and
      mental retardation: a case report.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No beneficial effect was detected after 5 months with a low protein diet.
    explanation: >-
      A single case found no short-term benefit and cannot resolve other outcomes.
  - reference: PMID:20547083
    reference_title: >-
      Characterization of new ACADSB gene sequence mutations and clinical
      implications in patients with 2-methylbutyrylglycinuria identified by
      newborn screening.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      disruptive dietary manipulations for infants identified by newborn
      screening are of questionable indication.
    explanation: >-
      The untreated cohort questions routine restrictive diets in clinically well infants.
- name: Valproate avoidance (theoretical precaution)
  description: >-
    Valproyl-CoA competitively inhibits purified human SBCAD and is also an
    SBCAD substrate in vitro. Some reviews therefore advise avoidance, but no
    SBCADD-specific clinical evidence shows valproate-induced decompensation;
    medication decisions should be individualized with specialists.
  action_category: THERAPEUTIC
  evidence:
  - reference: PMID:21430231
    reference_title: >-
      Role of isovaleryl-CoA dehydrogenase and short branched-chain acyl-CoA
      dehydrogenase in the metabolism of valproic acid: implications for the
      branched-chain amino acid oxidation pathway.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      valproyl-CoA did inhibit SBCAD activity by a purely competitive mechanism
      with a K(i) of 249 ± 29 μM.
    explanation: >-
      Purified-enzyme experiments support the theoretical biochemical precaution.
  - reference: PMID:30730842
    reference_title: >-
      Clinical, biochemical, and molecular spectrum of short/branched-chain
      acyl-CoA dehydrogenase deficiency: two new cases and review of literature.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Carnitine supplementation and valproate avoidance appear to be indicated.
    explanation: >-
      This is a review recommendation without SBCADD-specific clinical outcome data.
- name: Newborn screening via tandem mass spectrometry
  description: >-
    Expanded newborn screening can detect an elevated unresolved C5 signal and
    thereby incidentally identify SBCADD while screening for serious isovaleric
    acidemia. Every abnormal C5 result requires prompt confirmation; the cutoff
    can miss some ACADSB homozygotes.
  action_category: SCREENING
  treatment_term:
    preferred_term: disease screening
    term:
      id: NCIT:C15419
      label: Disease Screening
  evidence:
  - reference: PMID:12837870
    reference_title: >-
      Prospective diagnosis of 2-methylbutyryl-CoA dehydrogenase deficiency in
      the Hmong population by newborn screening using tandem mass spectrometry.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These cases suggest that SBCAD deficiency is another inborn error of
      metabolism detectable by newborn screening using tandem mass spectrometry.
    explanation: Establishes detectability by tandem mass spectrometry.
  - reference: PMID:23712021
    reference_title: >-
      Prevalence and mutation analysis of short/branched chain acyl-CoA
      dehydrogenase deficiency (SBCADD) detected on newborn screening in Wisconsin.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Detection of homozygous individuals who were not identified on newborn
      screening suggests that the C5 screening cut-off would need to be as low
      as 0.20μmol/L to detect all infants homozygous for the ACADSB c.1165 A>G mutation.
    explanation: >-
      Genotype ascertainment demonstrates imperfect sensitivity of the C5 cutoff.
- name: Genetic counseling
  description: >-
    Counseling should explain autosomal-recessive inheritance, a 25% recurrence
    risk when both parents carry a pathogenic variant, familial testing options,
    the high c.1165A>G carrier frequency in Hmong people, and uncertain penetrance.
  action_category: COUNSELING_INFORMATIONAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:23712021
    reference_title: >-
      Prevalence and mutation analysis of short/branched chain acyl-CoA
      dehydrogenase deficiency (SBCADD) detected on newborn screening in Wisconsin.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      being heterozygous for the mutation of 21.8% (95% confidence interval
      19.4-24.3%)
    explanation: >-
      The high Hmong carrier frequency makes population-aware counseling relevant.
- name: Longitudinal clinical follow-up
  description: >-
    Periodic clinical assessment is reasonable to document development,
    intercurrent illnesses, and treatment exposure because natural history is
    incompletely defined. It should not be presented as surveillance for
    established late neurologic complications, which have not been causally linked.
  action_category: MONITORING
  treatment_term:
    preferred_term: clinical monitoring
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  evidence:
  - reference: PMID:31555323
    reference_title: >-
      Biochemical, Clinical, and Genetic Characteristics of Short/Branched Chain
      Acyl-CoA Dehydrogenase Deficiency in Chinese Patients by Newborn Screening.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      longitudinal follow-up may be helpful to further define the natural history of SBCADD.
    explanation: >-
      Follow-up is framed as natural-history data collection under uncertainty.
diagnosis:
- name: Follow-up of an elevated C5 newborn screen
  description: >-
    An elevated C5 result requires prompt follow-up because standard tandem mass
    spectrometry cannot distinguish 2-methylbutyrylcarnitine from
    isovalerylcarnitine, and pivaloylcarnitine can cause an analytic false
    positive. C5 magnitude and ratios may inform triage but do not establish SBCADD.
  diagnosis_term:
    preferred_term: clinical assessment
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  results: >-
    An unresolved elevated C5 signal prompts evaluation for SBCADD, isovaleric
    acidemia, and pivalate-related interference.
  evidence:
  - reference: PMID:23499962
    reference_title: UPLC-MS/MS analysis of C5-acylcarnitines in dried blood spots.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      further differentiation of C5-acylcarnitines in order to separate
      different metabolic disorders and to detect interferents like pivalic acid
      originating from antibiotics.
    explanation: >-
      The study establishes both C5-isomer resolution and pivalate interference.
- name: Urine organic-acid and acylglycine analysis
  description: >-
    Urinary 2-MBG strongly supports SBCADD; 2-EHA is a sensitive but less
    specific adjunct. Normal or fluctuating values do not alone exclude the
    condition, and the whole pattern distinguishes other isoleucine disorders.
  diagnosis_term:
    preferred_term: clinical assessment
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  results: >-
    Increased 2-MBG, often with 2-EHA and without isovalerylglycine, supports SBCADD.
  evidence:
  - reference: PMID:40598537
    reference_title: >-
      Usefulness of levels of 2-methylbutyrylglycine and 2-ethylhydracrylic acid
      in urine for diagnosing 2-methylbutyrylglycinuria.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The urinary markers 2-MBG and 2-EHA show similar sensitivity for
      diagnosing 2-methylbutyrylglycinuria, but the lower specificity of 2-EHA
      and the fact that it can be elevated in several other congenital metabolic disorders
    explanation: >-
      The 12-case study supports both markers while directly limiting 2-EHA.
- name: ACADSB molecular genetic testing
  description: >-
    Identification of biallelic pathogenic ACADSB variants confirms the
    molecular diagnosis in a person with a concordant biochemical profile.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  results: >-
    Biallelic pathogenic or likely pathogenic ACADSB variants confirm the
    molecular diagnosis.
  evidence:
  - reference: PMID:40598537
    reference_title: >-
      Usefulness of levels of 2-methylbutyrylglycine and 2-ethylhydracrylic acid
      in urine for diagnosing 2-methylbutyrylglycinuria.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      12 individuals diagnosed with 2-methylbutyrylglycinuria based on ACADSB genotyping
    explanation: >-
      The diagnostic-marker study used ACADSB genotyping to define its case group.
- name: SBCAD enzyme activity testing
  description: >-
    When molecular results are incomplete or uncertain, direct SBCAD activity
    in patient fibroblasts can demonstrate the functional biochemical defect.
  diagnosis_term:
    preferred_term: clinical assessment
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  results: >-
    Deficient activity toward 2-methylbutyryl-CoA supports functional confirmation.
  evidence:
  - reference: PMID:11013134
    reference_title: >-
      Isolated 2-methylbutyrylglycinuria caused by short/branched-chain acyl-CoA
      dehydrogenase deficiency: identification of a new enzyme defect,
      resolution of its molecular basis, and evidence for distinct acyl-CoA
      dehydrogenases in isoleucine and valine metabolism.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Enzyme assay of the patient's fibroblasts, using 2-methylbutyryl-CoA as
      substrate, confirmed the defect.
    explanation: Directly demonstrates functional confirmation.
differential_diagnoses:
- name: Isovaleric acidemia
  description: >-
    Isovaleric acidemia is the urgent disease differential for elevated C5
    because isovalerylcarnitine and 2-methylbutyrylcarnitine are isobaric.
  distinguishing_features:
  - Isovalerylglycine and 3-hydroxyisovaleric acid favor isovaleric acidemia; 2-MBG favors SBCADD.
  - Pathogenic IVD variants support isovaleric acidemia; ACADSB findings support SBCADD.
  disease_term:
    preferred_term: isovaleric acidemia
    term:
      id: MONDO:0009475
      label: isovaleric acidemia
  evidence:
  - reference: PMID:20547083
    reference_title: >-
      Characterization of new ACADSB gene sequence mutations and clinical
      implications in patients with 2-methylbutyrylglycinuria identified by
      newborn screening.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      it is crucial to differentiate it from isovaleric acidemia as isovaleryl-
      and 2-methylbutyrylcarnitine share the same mass/charge ratio
    explanation: Identifies the clinically important isobaric differential.
- name: Pivaloylcarnitine interference
  description: >-
    Maternal or infant exposure to pivalate-containing products can produce a C5
    signal without SBCADD or isovaleric acidemia.
  distinguishing_features:
  - Chromatographic second-tier testing identifies pivaloylcarnitine as the C5 isomer.
  - Urinary disease-specific metabolites and confirmatory genotypes are absent.
  evidence:
  - reference: PMID:23499962
    reference_title: UPLC-MS/MS analysis of C5-acylcarnitines in dried blood spots.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pivaloylcarnitine was identified in 43 samples, isovalerylcarnitine was
      found in two samples.
    explanation: >-
      Pivaloylcarnitine accounted for most retested C5 elevations in this population.
- name: Other disorders with 2-EHA aciduria
  description: >-
    2-EHA is not specific to SBCADD and can be elevated in distal isoleucine
    defects and other organic acid disorders, including beta-ketothiolase
    deficiency, 2-methyl-3-hydroxybutyryl-CoA dehydrogenase deficiency,
    methylmalonic acidemia, ethylmalonic encephalopathy, and Barth syndrome.
  distinguishing_features:
  - A complete urine organic-acid profile reveals disorder-specific companion metabolites.
  - Molecular or enzyme testing should follow the pattern rather than 2-EHA alone.
  evidence:
  - reference: PMID:40598537
    reference_title: >-
      Usefulness of levels of 2-methylbutyrylglycine and 2-ethylhydracrylic acid
      in urine for diagnosing 2-methylbutyrylglycinuria.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      it should be used as a diagnostic marker only in conjunction with other
      markers and clinical factors.
    explanation: >-
      The diagnostic study warns that multiple disorders can produce 2-EHA.
  - reference: PMID:20547083
    reference_title: >-
      Characterization of new ACADSB gene sequence mutations and clinical
      implications in patients with 2-methylbutyrylglycinuria identified by
      newborn screening.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Three other disorders also accumulate 2-EHA in blood: β-ketothiolase,
      ethylmalonic encephalopathy, and Barth syndrome, though other metabolites
      distinguish these disorders from SBCAD deficiency
    explanation: >-
      This supports the named additional differentials and the need to interpret
      their full metabolite patterns.
discussions:
- discussion_id: openq_sbcadd_clinical_significance
  prompt: >-
    Are neurologic findings and catabolic decompensation causally attributable
    to ACADSB deficiency, and what is the lifetime penetrance of clinically
    meaningful disease among screen-detected individuals?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - phenotypes#Largely asymptomatic course
  - phenotypes#Developmental delay
  - phenotypes#Seizures
  - phenotypes#Autism
  - phenotypes#Metabolic acidosis
  - pathophysiology#Possible catabolic-stress susceptibility
  rationale: >-
    Symptom-ascertained reports describe neurologic disease and occasional
    decompensation, whereas newborn-screening cohorts are overwhelmingly well
    and include symptomatic people sharing genotypes with asymptomatic people.
    Authors explicitly question causation, and follow-up is too short and
    heterogeneous to estimate lifetime penetrance.
  proposed_experiments:
  - experiment_id: exp_sbcadd_natural_history_registry
    name: Genotype-first prospective natural-history registry
    description: >-
      Enroll newborn-screened and genotype-ascertained individuals irrespective
      of symptoms; collect uniform developmental, neurologic, illness,
      biochemical, genomic, and treatment data with population comparators.
  evidence:
  - reference: PMID:31555323
    reference_title: >-
      Biochemical, Clinical, and Genetic Characteristics of Short/Branched Chain
      Acyl-CoA Dehydrogenase Deficiency in Chinese Patients by Newborn Screening.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the association between SBCADD and the presence of symptoms has not yet been established.
    explanation: The cohort states the central causal uncertainty directly.
  - reference: PMID:41722717
    reference_title: >-
      Outlook on ACADSB variants shaping metabolomic patterns and clinical
      outcomes - experience from a Central European country.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings support SBCADD as a primarily biochemical phenotype with a
      largely benign course
    explanation: The newest series reinforces the biochemical-disease distinction.
  posed_date: "2026-07-14T00:00:00Z"
- discussion_id: gap_sbcadd_management_effectiveness
  prompt: >-
    Do carnitine, fasting or illness protocols, dietary restriction, or
    valproate avoidance improve patient-important outcomes in SBCADD?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - treatments#Carnitine supplementation
  - treatments#Precautionary fasting avoidance and illness plan
  - treatments#Dietary management
  - treatments#Valproate avoidance (theoretical precaution)
  rationale: >-
    Studies are uncontrolled, combine interventions, and mainly report
    metabolite values in asymptomatic children. Recommendations are based on
    plausibility and precaution rather than demonstrated clinical prevention.
  proposed_experiments:
  - experiment_id: exp_sbcadd_management_comparison
    name: Prospective pragmatic management comparison
    description: >-
      Within a multicenter natural-history network, compare prespecified
      strategies using clinical outcomes, treatment burden, adverse effects,
      free carnitine, and metabolite trajectories, adjusting for indication.
  evidence:
  - reference: PMID:36147814
    reference_title: >-
      Long-term monitoring for short/branched-chain acyl-CoA dehydrogenase
      deficiency: A single-center 4-year experience and open issues.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the effects of proposed treatments remain uncertain as follow-data are lacking.
    explanation: >-
      The longitudinal cohort explicitly identifies effectiveness as unresolved.
  - reference: PMID:17883863
    reference_title: >-
      2-methylbutyryl-CoA dehydrogenase deficiency associated with autism and
      mental retardation: a case report.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No beneficial effect was detected after 5 months with a low protein diet.
    explanation: >-
      The only cited within-person diet trial was negative and too small to resolve efficacy.
  posed_date: "2026-07-14T00:00:00Z"
notes: >-
  Manual evidence review completed 2026-07-14. Every reference linked by the
  prior entry was checked against its local cache; duplicate DOI/PMID records
  and unrelated mechanistic papers were removed, and newer primary studies were
  added through the repository reference-fetch workflow. The evidence supports
  a definitive ACADSB biochemical defect but does not establish that the rare
  reported neurologic findings are attributable to it. Follow-up in most
  newborn-screening cohorts is limited to childhood, so “largely benign” should
  not be read as proof of zero lifetime risk. The Hmong c.1165A>G founder effect
  is well supported; enrichment in Miao and Dong groups is not labeled as a
  separate founder effect. Carnitine, restrictive diet, illness protocols, and
  valproate avoidance lack SBCADD-specific clinical outcome evidence. The
  2-MBG oxidative-stress branch is restricted to exogenous-metabolite
  experiments in rat cortical preparations and C6 cells and is not connected to
  human phenotypes.

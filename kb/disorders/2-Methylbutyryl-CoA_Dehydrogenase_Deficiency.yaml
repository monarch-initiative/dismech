    Most individuals identified by newborn screening or family studies have
    remained clinically well during available follow-up. A literature review
    described about 10% of reported patients as symptomatic, corresponding to
    about 90% without reported symptoms, but published cases are vulnerable to
    ascertainment bias and do not establish lifetime risk.
  evidence:
  - reference: PMID:30730842

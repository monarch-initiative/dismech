      Clinical, biochemical, and molecular spectrum of short/branched-chain
      acyl-CoA dehydrogenase deficiency: two new cases and review of literature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Based on our experience and the literature review (162 patients), SBCAD
      deficiency is symptomatic in about 10% of reported patients.
    explanation: >-
      About 90% of reported patients had no reported symptoms, which maps to
      VERY_FREQUENT; the explanation preserves the reported-patient denominator.
  - reference: PMID:20547083

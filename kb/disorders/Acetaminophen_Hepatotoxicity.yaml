definitions:
- name: Hepatotoxicity-focused clinical scope
  definition_type: CASE_DEFINITION
  description: >-
    Acetaminophen hepatotoxicity is acute hepatocellular injury attributable to
    a toxic acetaminophen exposure, arising after an acute ingestion or repeated
    supratherapeutic use and ranging from aminotransferase elevation to acute
    liver failure. A detectable exposure without liver injury is not by itself
    the disease state modeled here.
  scope: Disease-level clinical framing for intrinsic acetaminophen liver injury
  evidence:
  - reference: PMID:36670547
    reference_title: The molecular mechanisms of acetaminophen-induced hepatotoxicity and its potential therapeutic targets.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "APAP overdose may lead to fatal acute liver injury."
    explanation: The review directly links overdose to the hepatic injury defining this record.
  - reference: PMID:37552484
    reference_title: "Management of Acetaminophen Poisoning in the US and Canada: A Consensus Statement."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "single or repeated ingestion of acetaminophen"
    explanation: The consensus establishes both acute and repeated-ingestion exposure patterns as clinically relevant.
has_subtypes:
- name: Acute immediate-release ingestion within 24 hours
  description: >-
    An acute ingestion can include one or more doses presenting within 24 hours
    of the initial ingestion. For an immediate-release exposure with a known
    start time, a properly timed serum concentration can be interpreted with the
    Rumack-Matthew nomogram.
  evidence:
  - reference: PMID:40047505
    reference_title: "Out-of-hospital assessment and triage of paracetamol (acetaminophen) exposure in the United States and Canada: a consensus guideline."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Acute ingestion is defined as any ingestion presenting within 24 h of initial ingestion, regardless of ingestion pattern."
    explanation: The consensus definition prevents multiple doses within the first 24 hours from being misclassified as repeated supratherapeutic ingestion.
  - reference: PMID:34053705
    reference_title: Acetaminophen Poisoning.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The acetaminophen nomogram is used to assess the need for treatment in acute immediate-release overdoses with a known time of ingestion."
    explanation: The review defines the acute immediate-release scenario in which nomogram interpretation is appropriate.
- name: Modified-release acute ingestion
  description: >-
    Acute ingestion of a modified- or extended-release formulation can produce
    delayed absorption and requires a different assessment pathway from a
    conventional immediate-release ingestion.
  evidence:
  - reference: PMID:34053705
    reference_title: Acetaminophen Poisoning.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "scenarios that require different management pathways include modified-release"
    explanation: The review explicitly separates modified-release exposure from the standard nomogram pathway.
  - reference: PMID:28421844
    reference_title: Accuracy of the paracetamol-aminotransferase multiplication product to predict hepatotoxicity in modified-release paracetamol overdose.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified 73 modified-release paracetamol exposures treated with acetylcysteine"
    explanation: A human cohort documents the modified-release exposure pattern and liver-injury follow-up.
- name: Repeated supratherapeutic ingestion
  description: >-
    Excess acetaminophen accumulated over an exposure period of 24 hours or
    more. This is distinct from an acute ingestion presenting within 24 hours of
    its start and requires a separate assessment pathway.
  evidence:
  - reference: PMID:40047505
    reference_title: "Out-of-hospital assessment and triage of paracetamol (acetaminophen) exposure in the United States and Canada: a consensus guideline."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Repeated supratherapeutic ingestion is defined as an exposure that occurs over a period of 24 h or more."
    explanation: The consensus directly defines the duration separating repeated supratherapeutic from acute ingestion.
  - reference: PMID:37552484
    reference_title: "Management of Acetaminophen Poisoning in the US and Canada: A Consensus Statement."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The panel developed guidelines for emergency department management of single or repeated ingestion of acetaminophen."
    explanation: The consensus treats repeated ingestion as a distinct clinical assessment pathway.
epidemiology:
- name: Acetaminophen contribution to United States acute liver failure
  description: >-
    In a prospective cohort at 22 United States tertiary centers, acetaminophen
    injury accounted for 275 of 662 enrolled acute liver failure cases. This is
    a proportion within an acute-liver-failure referral cohort, not population
    prevalence of acetaminophen hepatotoxicity.
  unit: proportion of an acute liver failure cohort
  factors:
  - intentional overdose
  - unintentional overdose
  - use of multiple acetaminophen-containing preparations
  evidence:
  - reference: PMID:16317692
    reference_title: "Acetaminophen-induced acute liver failure: results of a United States multicenter, prospective study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "275 (42%) were determined to result from acetaminophen liver injury"
    explanation: The prospective study quantifies acetaminophen-attributed cases within its acute liver failure cohort.
progression:
- phase: Initial nonspecific phase, usually within 24 hours
  notes: >-
    Nausea, vomiting, diaphoresis, and anorexia can begin during the initial
    post-ingestion stage. Exceptionally large exposures can instead produce
    early altered mental status and severe metabolic acidosis before hepatic
    failure develops.
  evidence:
  - reference: PMID:6359859
    reference_title: Acetaminophen overdose.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Symptoms of nausea, vomiting, diaphoresis, and anorexia usually begin within seven to 14 hours after ingestion."
    explanation: The clinical review directly describes the initial symptom cluster and its timing.
  - reference: PMID:25133498
    reference_title: "Extracorporeal treatment for acetaminophen poisoning: recommendations from the EXTRIP workgroup."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "early development of altered mental status and severe metabolic acidosis prior to the onset of hepatic failure"
    explanation: EXTRIP identifies an important exceptional early mitochondrial-toxicity presentation after extremely large exposure.
- phase: Evolving hepatocellular injury, commonly 24 to 72 hours
  notes: >-
    Early symptoms may diminish while aminotransferases, bilirubin, and
    prothrombin time begin to rise. Peak biochemical injury can remain delayed
    for three days or more after overdose.
  evidence:
  - reference: PMID:6359859
    reference_title: Acetaminophen overdose.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "After 24 to 48 hours, these symptoms may diminish, but SGOT, SGPT, bilirubin, and prothrombin time begin to rise."
    explanation: The review directly describes symptom improvement accompanying emerging biochemical and synthetic dysfunction.
  - reference: PMID:37683599
    reference_title: "Paracetamol (acetaminophen) poisoning: The early years."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "maximum abnormalities of liver function were delayed for 3 days or more after an overdose"
    explanation: The historical review independently supports delayed peak laboratory injury.
- phase: Peak injury and possible acute liver failure, commonly 72 to 96 hours
  notes: >-
    Peak hepatotoxicity commonly occurs during this interval. Severe cases can
    cross into acute liver failure with coagulopathy and encephalopathy and can
    develop systemic complications such as cardiovascular collapse, cerebral
    edema, acute kidney injury, respiratory failure, and sepsis.
  evidence:
  - reference: PMID:6359859
    reference_title: Acetaminophen overdose.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Peak hepatotoxicity occurs at 72 to 96 hours"
    explanation: The clinical review directly supplies the commonly described peak-injury interval.
  - reference: PMID:16317692
    reference_title: "Acetaminophen-induced acute liver failure: results of a United States multicenter, prospective study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Severe acetaminophen hepatotoxicity frequently leads to acute liver failure"
    explanation: The prospective cohort confirms acute liver failure as the severe trajectory.
  - reference: PMID:36001996
    reference_title: "Management of Acute Liver Failure: Update 2022."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "cardiovascular collapse, cerebral edema, acute kidney injury, respiratory failure, sepsis"
    explanation: The acute-liver-failure review directly identifies the systemic complications retained in this phase.
- phase: Recovery or outcome after peak injury
  notes: >-
    Survivors can show substantial histologic recovery after severe injury.
    Severe cases may instead die or undergo liver transplantation; cohort
    percentages are contextual rather than individual prognostic guarantees.
  evidence:
  - reference: PMID:1214189
    reference_title: "Histopathological changes in the liver following a paracetamol overdose: correlation with clinical and biochemical parameters."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The histological recovery in even the most severe cases was remarkable"
    explanation: The human biopsy series directly documents post-injury histologic recovery among survivors.
  - reference: PMID:16317692
    reference_title: "Acetaminophen-induced acute liver failure: results of a United States multicenter, prospective study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "178 subjects (65%) survived, 74 (27%) died without transplantation, and 23 subjects (8%) underwent liver transplantation"
    explanation: The multicenter cohort documents the range of severe outcomes.
mechanistic_hypotheses:
- hypothesis_group_id: canonical_napqi_mitochondrial_necrosis_model
  hypothesis_label: Canonical NAPQI-Mitochondrial Necrosis Model
  status: CANONICAL
  description: >-
    Supratherapeutic acetaminophen increases NAPQI formation beyond glutathione
    detoxification capacity. Glutathione depletion and mitochondrial protein
    adduction initiate mitochondrial oxidant and peroxynitrite stress with JNK
    amplification. Mitochondrial permeability transition and release of
    endonucleases cause nuclear DNA fragmentation and centrilobular oncotic
    hepatocyte necrosis, which can progress to acute liver failure.
  evidence:
  - reference: PMID:36670547
    reference_title: The molecular mechanisms of acetaminophen-induced hepatotoxicity and its potential therapeutic targets.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "APAP-induced hepatotoxicity (AIH) is mainly caused by the toxic metabolite N-acetyl-p-benzoquinone imine (NAPQI),"
    explanation: The review identifies NAPQI as the proximal toxic metabolite.
  - reference: PMID:38265880
    reference_title: "Acetaminophen Hepatotoxicity: Paradigm for Understanding Mechanisms of Drug-Induced Liver Injury."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Mitochondria-derived endonucleases trigger nuclear DNA fragmentation, the point of no return for cell death."
    explanation: The review supplies the mitochondrial-to-necrosis commitment step.
- hypothesis_group_id: sterile_inflammation_injury_repair_model
  hypothesis_label: Sterile Inflammation Injury-Repair Context Model
  status: ALTERNATIVE
  description: >-
    Necrotic hepatocytes release damage signals that activate Kupffer cells,
    monocyte-derived macrophages, and neutrophils. This response is established,
    but its net role is context-dependent: inflammatory signaling can accompany
    injury while immune cells also participate in debris clearance and repair.
    The graph therefore does not encode sterile inflammation as an invariably
    injurious linear amplifier.
  evidence:
  - reference: PMID:38265880
    reference_title: "Acetaminophen Hepatotoxicity: Paradigm for Understanding Mechanisms of Drug-Induced Liver Injury."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "sterile inflammation in injury and repair with activation of Kupffer cells, monocyte-derived macrophages, and neutrophils"
    explanation: The review explicitly frames the response as participating in both injury and repair.
  - reference: PMID:35024303
    reference_title: Recommendations for the use of the acetaminophen hepatotoxicity model for mechanistic studies and how to avoid common pitfalls.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "the critical roles of drug metabolism, mitochondrial dysfunction, necrotic cell death, autophagy and the sterile inflammatory response"
    explanation: The model review supports biological relevance while warning that interpretation requires care.
environmental:
- name: Supratherapeutic acetaminophen exposure
  influences_mechanisms:
  - target: Supratherapeutic Acetaminophen Exposure
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      An overdose or repeated supratherapeutic ingestion is what puts
      acetaminophen into the body above the dose safe conjugation can handle.
      The exposure event and the systemic state it produces are the same step,
      which is why the toxicity is dose-defined rather than intrinsic to the
      drug.
    evidence:
    - reference: PMID:36670547
      reference_title: "The molecular mechanisms of acetaminophen-induced hepatotoxicity and its potential therapeutic targets."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "is relatively safe at therapeutic doses; however, APAP overdose may lead to fatal acute liver injury"
      explanation: >-
        Distinguishes therapeutic dosing, which is safe, from overdose, which
        produces fatal acute liver injury, establishing the exposure as
        dose-defined.
  description: >-
    Acute overdose or repeated supratherapeutic ingestion supplies the toxic
    substrate load. Intent may be deliberate or unintentional, and use of
    multiple acetaminophen-containing products can obscure cumulative exposure.
  presence: PRESENT
  chemicals:
  - acetaminophen
  - paracetamol
  exposure_term:
    preferred_term: exposure to paracetamol
    term:
      id: ECTO:9000387
      label: exposure to paracetamol
  effect: Initiates dose-dependent intrinsic hepatocellular injury when detoxification capacity is exceeded.
  evidence:
  - reference: PMID:36670547
    reference_title: The molecular mechanisms of acetaminophen-induced hepatotoxicity and its potential therapeutic targets.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "is relatively safe at therapeutic doses; however, APAP overdose may lead to fatal acute liver injury"
    explanation: The review distinguishes therapeutic exposure from hepatotoxic overdose.
  - reference: PMID:16317692
    reference_title: "Acetaminophen-induced acute liver failure: results of a United States multicenter, prospective study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Unintentional overdoses accounted for 131 (48%) cases, intentional (suicide attempts) 122 (44%)"
    explanation: The cohort documents both unintentional and intentional exposure contexts.
- name: Chronic alcohol use and CYP2E1-inducing comedications
  influences_mechanisms:
  - target: NAPQI Formation, Protein Adduction, and Glutathione Depletion
    environmental_effect: EXACERBATES
    causal_link_type: DIRECT
    description: >-
      Induced CYP2E1 shunts more of a given acetaminophen dose down the
      oxidative route. This does not create the pathway, it increases flux
      through it, which is why it narrows the margin between exposure and
      hepatotoxicity.
    evidence:
    - reference: PMID:36713231
      reference_title: "Acetaminophen-Induced Hepatotoxicity in Obesity and Nonalcoholic Fatty Liver Disease: A Critical Review."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "some of them seem pivotal for the induction of cytochrome P450 2E1 (CYP2E1), which favors the conversion of APAP to the toxic metabolite"
      explanation: >-
        Names CYP2E1 induction as favoring conversion of acetaminophen to its
        toxic metabolite, the reaction this node describes.
  description: >-
    Chronic alcohol use can transiently increase hepatic CYP2E1 content, and
    selected comedications such as antituberculosis and antiepileptic drugs can
    also favor CYP induction. These are susceptibility contexts rather than
    claims that a therapeutic acetaminophen dose is invariably hepatotoxic.
    Simultaneous acute alcohol ingestion has different metabolic effects and is
    not modeled here as equivalent to chronic alcohol use.
  presence: PRESENT
  effect: Can increase bioactivation of acetaminophen to NAPQI and thereby lower the margin between exposure and hepatotoxicity.
  evidence:
  - reference: PMID:12006215
    reference_title: Alcohol exposure and paracetamol-induced hepatotoxicity.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "chronic alcohol use leads to a short-term, two- to threefold increase in hepatic content of cytochrome P4502E1"
    explanation: The review directly supports transient CYP2E1 induction after chronic alcohol use while distinguishing it from simultaneous alcohol ingestion.
  - reference: PMID:36713231
    reference_title: "Acetaminophen-Induced Hepatotoxicity in Obesity and Nonalcoholic Fatty Liver Disease: A Critical Review."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "some of them seem pivotal for the induction of cytochrome P450 2E1 (CYP2E1), which favors the conversion of APAP to the toxic metabolite"
    explanation: The critical review identifies CYP2E1 induction as a shared mechanism through which susceptibility factors can increase NAPQI formation.
- name: Malnutrition and eating disorders
  influences_mechanisms:
  - target: NAPQI Formation, Protein Adduction, and Glutathione Depletion
    environmental_effect: EXACERBATES
    causal_link_type: DIRECT
    description: >-
      A lower baseline pool of intrahepatic glutathione means the same NAPQI
      load exhausts detoxification sooner, worsening the depletion arm of this
      node rather than creating it. The cited source specifically excludes
      ageing and acute fasting from this effect.
    evidence:
    - reference: PMID:27147856
      reference_title: "A review of the evidence concerning hepatic glutathione depletion and susceptibility to hepatotoxicity after paracetamol overdose."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "malnutrition, and eating disorders such as anorexia nervosa are likely to be associated with reduction in intrahepatic glutathione concentrations"
      explanation: >-
        Associates malnutrition and eating disorders with reduced intrahepatic
        glutathione, the substrate whose depletion this node describes.
  description: >-
    Malnutrition, including malnutrition secondary to an eating disorder, can
    reduce intrahepatic glutathione available to detoxify NAPQI. Acute fasting
    alone is not treated as an equivalent risk factor because the focused
    evidence review did not associate it with increased risk through glutathione
    depletion.
  presence: PRESENT
  effect: Can reduce glutathione-dependent NAPQI detoxification and increase susceptibility after acetaminophen overdose.
  evidence:
  - reference: PMID:27147856
    reference_title: A review of the evidence concerning hepatic glutathione depletion and susceptibility to hepatotoxicity after paracetamol overdose.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "malnutrition, and eating disorders such as anorexia nervosa are likely to be associated with reduction in intrahepatic glutathione concentrations"
    explanation: The review supports malnutrition-associated glutathione depletion as a susceptibility mechanism.
  - reference: PMID:27147856
    reference_title: A review of the evidence concerning hepatic glutathione depletion and susceptibility to hepatotoxicity after paracetamol overdose.
    supports: REFUTE
    evidence_source: OTHER
    snippet: "Ageing and acute fasting are not associated with an increased risk of paracetamol-related hepatotoxicity due to reductions in glutathione concentrations."
    explanation: This negative evidence prevents overgeneralizing malnutrition evidence to short-term fasting alone.
- name: Obesity and nonalcoholic fatty liver disease
  influences_mechanisms:
  - target: Acetaminophen-Induced Acute Liver Injury and Failure
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Reported as a higher prevalence of acute liver injury after overdose in
      people with pre-existing fatty liver disease, but the finding is
      inconsistent between studies and no mediating step is established.
      Modelled as PREDISPOSES rather than EXACERBATES because the evidence is
      a susceptibility association, not a demonstrated amplification of any
      particular mechanism.
    evidence:
    - reference: PMID:36713231
      reference_title: "Acetaminophen-Induced Hepatotoxicity in Obesity and Nonalcoholic Fatty Liver Disease: A Critical Review."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "could be more hepatotoxic in obesity and related metabolic diseases, at least after an overdose. Nonetheless, several investigations did not reproduce these data."
      explanation: >-
        States both the reported increase in hepatotoxicity in obesity and
        related metabolic disease and the failure of several investigations to
        reproduce it, which is why this is recorded as a susceptibility
        association rather than a causal amplifier.
  description: >-
    Retrospective hospitalized-overdose cohorts summarized in a critical review
    reported a four- to sevenfold higher prevalence of acute liver injury in
    people with pre-existing NAFLD. The association is heterogeneous: obesity
    and NAFLD can increase CYP2E1-dependent NAPQI formation in some metabolic
    contexts, while other metabolic changes can mitigate toxicity.
  presence: PRESENT
  effect: May increase susceptibility to acute liver injury after acetaminophen overdose, depending on the balance of metabolic factors.
  evidence:
  - reference: PMID:36713231
    reference_title: "Acetaminophen-Induced Hepatotoxicity in Obesity and Nonalcoholic Fatty Liver Disease: A Critical Review."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "could be more hepatotoxic in obesity and related metabolic diseases, at least after an overdose. Nonetheless, several investigations did not reproduce these data."
    explanation: The review supports a clinically reported susceptibility association but explicitly documents inconsistent replication.
  - reference: PMID:36713231
    reference_title: "Acetaminophen-Induced Hepatotoxicity in Obesity and Nonalcoholic Fatty Liver Disease: A Critical Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "some of them seem pivotal for the induction of cytochrome P450 2E1 (CYP2E1), which favors the conversion of APAP to the toxic metabolite"
    explanation: The review supports CYP2E1 induction and increased NAPQI formation as one mechanism that can raise susceptibility in obesity and NAFLD.

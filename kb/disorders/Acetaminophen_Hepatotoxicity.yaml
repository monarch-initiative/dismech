review_notes: >-
  Comprehensively re-reviewed in July 2026. The revision narrows identity from
  broad poisoning to acquired intrinsic acetaminophen liver injury; distinguishes
  acute immediate-release, modified-release, and repeated supratherapeutic
  exposure patterns; adds a source-calibrated four-phase clinical course and
  cohort epidemiology without inferring population prevalence; rebuilds the
  pathograph as a typed NAPQI-protein-adduct, mitochondrial-stress,
  DNA-fragmentation, centrilobular-oncotic-necrosis chain; and separates sterile
  inflammation into a context-dependent injury-and-repair branch. It corrects
  acute-liver-failure and hepatic-encephalopathy ontology bindings, adds early
  and systemic complications, links biomarkers to graph nodes, restricts the
  nomogram to applicable acute-ingestion contexts, and adds serial laboratory
  and specialized adduct diagnosis. Management now distinguishes established
  NAC, early charcoal, rare hemodialysis, supportive critical care, and early
  transplant evaluation from investigational fomepizole, whose routine outcome
  benefit is unsupported by current comparative evidence. Remaining evidence
  gaps include controlled fomepizole efficacy, an optimal intensified NAC
  regimen for selected high-risk exposure, broad clinical access to adduct
  testing, external validation of CXCL14, and resolution of the net human role
  of sterile inflammation across injury and repair.

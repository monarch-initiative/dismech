treatments:
- name: N-acetylcysteine
  description: >-
    N-acetylcysteine (NAC) is the established antidote. It is most protective
    when started early, but treatment remains beneficial when presentation is
    delayed or acute liver failure is established. Regimen selection and
    stopping require clinical assessment; no single intensified regimen or
    bedside stopping protocol is asserted here.
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: antidote agent therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: acetylcysteine
      term:
        id: NCIT:C200
        label: Acetylcysteine
  target_mechanisms:
  - target: NAPQI Formation, Protein Adduction, and Glutathione Depletion
    treatment_effect: INHIBITS
    description: NAC supplies cysteine for glutathione restoration and increases capacity to detoxify reactive metabolite.
    evidence:
    - reference: PMID:24905542
      reference_title: Mechanisms of acetaminophen-induced cell death in primary human hepatocytes.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "improved scavenging of the reactive metabolite NAPQI due to accelerated GSH synthesis"
      explanation: The human-hepatocyte study directly states the early glutathione-dependent mechanism represented by this inhibitory edge.
  target_phenotypes:
  - preferred_term: Acute hepatic failure
    term:
      id: HP:0006554
      label: Acute hepatic failure
  evidence:
  - reference: PMID:3059186
    reference_title: Efficacy of oral N-acetylcysteine in the treatment of acetaminophen overdose. Analysis of the national multicenter study (1976 to 1985).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "When given within eight hours of acetaminophen ingestion, N-acetylcysteine was protective regardless of the initial plasma acetaminophen concentration."
    explanation: The large multicenter study directly supports strong early clinical efficacy.
  - reference: PMID:1954453
    reference_title: "Intravenous acetylcysteine in paracetamol induced fulminant hepatic failure: a prospective controlled trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The rate of survival was significantly higher in the acetylcysteine treated group than in the controls"
    explanation: The prospective controlled trial supports benefit after fulminant hepatic failure is established.
  - reference: PMID:37552484
    reference_title: "Management of Acetaminophen Poisoning in the US and Canada: A Consensus Statement."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "detailed management of acetylcysteine treatment, associated adverse effects, and stopping criteria"
    explanation: The multisociety consensus confirms that treatment management and stopping require explicit criteria, without this entry asserting a bedside protocol.

- accession: geo:GSE305543
  title: Hepatocyte-specific MET deletion exacerbates acetaminophen-induced hepatotoxicity in mice
  description: Despite the well-known role of MET in liver regeneration following partial-hepatectomy (PHx), its role in the clinically-relevant acetaminophen (APAP)-induced liver injury (AILI) model remains unexplored. AILI markedly differs from PHx because it is associated with massive liver necrosis. This study aims to delineate the role of MET specifically in AILI. Hepatocyte-specific MET-KO mice were given a toxic-dose of APAP and assessed for hepatotoxicity/regeneration parameters. MET deletion strikingly exacerbated initial hepatotoxicity and impaired subsequent proliferative response, culminating in significant mortality.

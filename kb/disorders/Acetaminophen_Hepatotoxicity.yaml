diagnosis:
- name: Timed serum acetaminophen concentration and nomogram assessment
  description: >-
    A serum concentration obtained at an interpretable time can be plotted on
    the Rumack-Matthew nomogram for an acute immediate-release overdose with a
    known ingestion time. Modified-release, large, and repeated supratherapeutic
    ingestions require different assessment pathways.
  diagnosis_term:

- accession: massive:MSV000093653
  title: 'Raw data for manuscript : "Serine synthesis via reversed SHMT2 activity drives glycine depletion and acetaminophen hepatotoxicity in MASLD"'
  description: Metabolic dysfunction-associated steatotic liver disease (MASLD) affects one third of the global population. Understanding metabolic pathways involved can provide insights into disease progression and treatment. Untargeted metabolomics of livers from mice with early-stage steatosis uncovered decreased methylated metabolites, suggesting altered one-carbon metabolism. The levels of glycine, a central component of one-carbon metabolism, were lower in mice with hepatic steatosis, consistent with clinical evidence.

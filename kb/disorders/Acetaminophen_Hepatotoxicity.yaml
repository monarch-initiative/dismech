    snippet: "fulfilling standard criteria for ALF (coagulopathy and encephalopathy)"
    explanation: The cohort supports coagulopathy as a defining functional-failure marker.
- name: Serum acetaminophen-protein adducts
  presence: INCREASED
  context: >-
    APAP-cysteine protein adducts report NAPQI-mediated protein binding and may
    help identify acetaminophen etiology when exposure history or the parent-drug

name: Acetaminophen Hepatotoxicity
creation_date: "2026-06-24T00:00:00Z"
category: Environmental
categories:
- Toxic Exposure Disorder
- Intrinsic Drug-Induced Liver Injury
- Hepatic Toxicity
description: >-
  Acetaminophen (paracetamol, APAP) hepatotoxicity is an intrinsic,
  dose-dependent liver injury caused by acute overdose or repeated
  supratherapeutic ingestion. Excess formation of the reactive metabolite
  N-acetyl-p-benzoquinone imine (NAPQI) depletes glutathione, forms protein
  adducts, and initiates mitochondrial oxidant stress. Mitochondrial
  permeability transition and nuclear DNA fragmentation culminate in
  centrilobular oncotic hepatocyte necrosis. Injury ranges from biochemical
  aminotransferase elevation to acute liver failure with coagulopathy,
  encephalopathy, multiorgan dysfunction, death, or transplantation. This entry
  models hepatotoxic injury rather than every acetaminophen exposure or every
  acetaminophen-poisoning presentation.
disease_term:
  preferred_term: acetaminophen hepatotoxicity
  term:
    id: MONDO:0018741
    label: paracetamol poisoning
synonyms:
- acetaminophen-induced liver injury
- acetaminophen-induced acute liver injury
- paracetamol hepatotoxicity
- paracetamol-induced liver injury
- APAP hepatotoxicity
parents:
- poisoning
- drug-induced liver injury
notes: >-
  MONDO:0018741 is broader than this hepatotoxicity-focused record because
  acetaminophen poisoning can be recognized before liver injury and can include
  nonhepatic manifestations. Intentional overdose, unintentional overdose, and
  repeated supratherapeutic ingestion are in scope when they cause or place the
  patient at material risk of hepatic injury. Therapeutic use without
  hepatotoxicity is out of scope.

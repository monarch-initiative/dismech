- name: International normalized ratio
  presence: INCREASED
  context: >-
    Rising INR reflects hepatic synthetic failure rather than the magnitude of
    hepatocyte enzyme release and contributes to serial severity assessment.
  readouts:
  - target: Acetaminophen-Induced Acute Liver Injury and Failure
    relationship: CORRELATES_WITH
    direction: POSITIVE
    endpoint_context: PROGNOSTIC
    interpretation: Higher and worsening INR indicates loss of hepatic synthetic function and more severe disease.
    evidence:
    - reference: PMID:1214189
      reference_title: "Histopathological changes in the liver following a paracetamol overdose: correlation with clinical and biochemical parameters."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "correlated well with the clinical course and both the maximal prolongation of the prothrombin time"
      explanation: Human biopsy data link loss of viable parenchyma to prothrombin-time prolongation.
  evidence:
  - reference: PMID:16317692
    reference_title: "Acetaminophen-induced acute liver failure: results of a United States multicenter, prospective study."
    supports: SUPPORT

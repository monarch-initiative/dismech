datasets:
- accession: geo:GSE284273
  title: Dendritic cell iron overload exacerbates acetaminophen hepatotoxicity
  description: Liver immune homeostasis relies on the coordinated actions of various immune cells including dendritic cells (DCs), which exert regulatory roles in both innate and adaptive immunity. Various pieces of evidence demonstrate that the properties of immune cells are highly influenced by iron metabolism. However, the roles of iron metabolism on DC function remain poorly understood. Here, we show that mice with iron overload in DCs displayed worsening of liver injury and mortality in acetaminophen (APAP) -induced acute hepatitis. Enhanced neutrophil infiltration was observed in these mice during the progression of liver injury.
  organism:
    preferred_term: mouse
    term:
      id: NCBITaxon:10090
      label: Mus musculus
  data_type: BULK_RNA_SEQ

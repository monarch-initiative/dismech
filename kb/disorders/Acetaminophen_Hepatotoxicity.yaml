    explanation: The multisociety consensus is the current North American framework for nomogram-based assessment.
- name: Serial liver-injury and liver-failure assessment
  description: >-
    Serial ALT and AST trends report hepatocellular injury, while bilirubin and
    PT or INR report evolving excretory and synthetic dysfunction. Coagulopathy
    together with encephalopathy identifies progression to acute liver failure.

differential_diagnoses:
- name: Respiratory syncytial virus infection
  description: >-
    Human respiratory syncytial virus (RSV) is a closely related pneumovirus that
    produces an overlapping clinical syndrome of upper respiratory illness,
    bronchiolitis, wheezing, and pneumonia in infants and older adults.
  disease_term:
    preferred_term: respiratory syncytial virus infectious disease
    term:
      id: MONDO:0001577
      label: respiratory syncytial virus infectious disease
  distinguishing_features:
  - Clinical manifestations of hMPV and RSV are largely indistinguishable; definitive differentiation requires molecular viral testing such as RT-PCR.
  evidence:
  - reference: PMID:40034641
    reference_title: "A Re-emerging Respiratory Virus: Human Metapneumovirus (hMPV)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In certain aspects, clinical manifestations of hMPV are indistinguishable
      from clinical manifestations of RSV due to presentation of features like
      fever, cough, breathlessness, rhinorrhoea and hypoxia.
    explanation: >-
      Highlights respiratory syncytial virus infection as the primary clinical
      differential diagnosis for hMPV infection.
  - reference: PMID:11385510
    reference_title: "A newly discovered human pneumovirus isolated from young children with respiratory tract disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The clinical symptoms of the children from whom the virus was isolated were
      similar to those caused by human respiratory syncytial virus infection,
      ranging from upper respiratory tract disease to severe bronchiolitis and
      pneumonia.
    explanation: >-
      Confirms the close clinical overlap between hMPV and RSV respiratory tract
      disease.
notes: >
  Created as part of the Respiratory Infections project (Intercept-aligned endemic
  respiratory viruses). Created without a MONDO disease_term id because no MONDO
  term currently exists for human metapneumovirus infection — flagged for a MONDO
  term request rather than anchored to a too-general parent. Conforms to the
  innate_antiviral_interferon_response module. Closely related to (and clinically
  resembling) Respiratory_Syncytial_Virus_Infection. The infectious_agent
  (NCBITaxon) and transmission blocks were backfilled under dismech#10115.
datasets:
- accession: geo:GSE157240
  title: RNAseq analysis of blood from respiratory viruses-infected patients and healthy controls
  description: The objective of this study was to understand the shared and unique elements of the host transcriptional response to different viral pathogens. We identified 162 subjects in the US and Sri Lanka with infections due to influenza, enterovirus/rhinovirus, human metapneumovirus, dengue virus, cytomegalovirus, Epstein Barr Virus, or adenovirus. Our dataset allowed us to identify common pathways at the molecular level as well as virus-specific differences in the host immune response. Conserved elements of the host response to these viral infections high-lighted the importance of interferon pathway activation. However, the magnitude of the re-sponses varied between pathogens.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  data_type: BULK_RNA_SEQ
  sample_count: 187
  publication: PMID:34777354
  notes: Identified by GEO DataSets index search for Human Metapneumovirus Infection (scripts/discover_datasets.py); accession and metadata verified against NCBI E-utilities on 2026-08-01. Title, sample count, and organism are GEO's own values.

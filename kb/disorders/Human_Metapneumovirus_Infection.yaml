name: Human Metapneumovirus Infection
creation_date: "2026-06-28T00:00:00Z"
description: >
  Human metapneumovirus (hMPV) infection is an acute respiratory infection caused
  by human metapneumovirus, an enveloped negative-sense RNA virus of the family
  Pneumoviridae closely related to respiratory syncytial virus. Discovered in
  2001, hMPV is a common respiratory pathogen, particularly in infants and young
  children, the elderly, and the immunocompromised, and produces illness across
  the spectrum from upper respiratory tract disease to bronchiolitis and pneumonia
  — clinically similar to RSV. Nearly all children have been infected by age five.
  hMPV is also a recognized trigger of asthma exacerbations.
category: Infectious Disease
parents:
- Viral Respiratory Infection
synonyms:
- hMPV infection
- HMPV infection
- Human metapneumovirus
progression:
- phase: Incubation period
  incubation_days: 3-5
  notes: >-
    Following respiratory exposure, human metapneumovirus typically has an
    incubation period of 3 to 5 days before onset of upper or lower respiratory
    symptoms.
  evidence:
  - reference: PMID:40034641
    reference_title: "A Re-emerging Respiratory Virus: Human Metapneumovirus (hMPV)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The virus is propagated from one individual to another primarily through
      aerosol transmission or by direct contact with an infected individual with
      an incubation period ranging from three to five days.
    explanation: >-
      Documents the typical 3-to-5-day incubation period of human
      metapneumovirus infection.
- phase: Primary childhood exposure and recurrent reinfection
  age_range: infancy to 5 years
  notes: >-
    Primary hMPV infection usually occurs during infancy (often by six months of
    age), with near-universal seropositivity by age five; reinfection can occur
    throughout life, and hMPV also induces respiratory tract infections in older
    adults and immunocompromised individuals.
  evidence:
  - reference: PMID:11385510
    reference_title: A newly discovered human pneumovirus isolated from young children with respiratory tract disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Serological studies showed that by the age of five years, virtually all
      children in the Netherlands have been exposed to human metapneumovirus and
      that the virus has been circulating in humans for at least 50 years.
    explanation: >-
      Establishes that primary exposure to hMPV occurs almost universally by five
      years of age.
  - reference: PMID:40034641
    reference_title: "A Re-emerging Respiratory Virus: Human Metapneumovirus (hMPV)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Primary hMPV infection usually occurs by the age of six months, following
      which reinfection can occur throughout life [44].
    explanation: >-
      Supports early childhood primary infection followed by susceptibility to
      reinfection throughout life.
  - reference: PMID:40034641
    reference_title: "A Re-emerging Respiratory Virus: Human Metapneumovirus (hMPV)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In addition to its association with respiratory illnesses in infants and
      children, hMPV may also induce respiratory tract infections in
      immunocompromised individuals and older adults and individuals with
      underlying medical conditions like chronic obstructive pulmonary disorders
      (COPD), asthma or cancer [56,58].
    explanation: >-
      Documents that hMPV causes respiratory tract infections in older adults
      and immunocompromised individuals beyond early childhood.
infectious_agent:
- name: Human metapneumovirus
  infectious_agent_term:
    preferred_term: Human metapneumovirus
    term:
      id: NCBITaxon:162145
      label: human metapneumovirus
  description: >-
    An enveloped, negative-sense single-stranded RNA virus of the family
    Pneumoviridae, first isolated in 2001 from young children with respiratory
    tract disease. It is the sole agent of this entry and is closely related to
    respiratory syncytial virus, which it resembles clinically.
  evidence:
  - reference: PMID:11385510
    reference_title: A newly discovered human pneumovirus isolated from young children with respiratory tract disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      From 28 young children in the Netherlands, we isolated a paramyxovirus that
      was identified as a tentative new member of the Metapneumovirus genus based
      on virological data, sequence homology and gene constellation.
    explanation: >-
      The original isolation of the virus from children with respiratory tract
      disease, establishing human metapneumovirus as the agent of this illness.
  - reference: PMID:16847085
    reference_title: Epidemiology of human metapneumovirus.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      hMPV is a common respiratory pathogen, particularly in infants and young
      children.
    explanation: >-
      Confirms hMPV as a common cause of human respiratory infection rather than
      an incidental detection.
transmission:
- name: Respiratory droplet and aerosol transmission
  description: >-
    hMPV spreads from person to person in respiratory droplets and aerosols
    generated by an infected person, entering through the nasopharyngeal mucosa.
  evidence:
  - reference: PMID:40034641
    reference_title: "A Re-emerging Respiratory Virus: Human Metapneumovirus (hMPV)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Mostly transmitted through droplet or aerosol contamination, this viral
      infection may manifest clinical characteristics indicative of both upper and
      lower respiratory tract infections like fever, cough, rhinorrhea, pneumonia,
      bronchiolitis, and croup.
    explanation: >-
      Names droplet and aerosol contamination as the predominant route by which
      hMPV respiratory infection is acquired.
- name: Direct contact with respiratory secretions and contaminated surfaces
  description: >-
    Close or direct contact with an infected person's respiratory secretions, and
    contact with surfaces those secretions have contaminated, is a second route of
    acquisition. Asymptomatic people also transmit.
  evidence:
  - reference: PMID:40034641
    reference_title: "A Re-emerging Respiratory Virus: Human Metapneumovirus (hMPV)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Transmission of hMPV primarily occurs through direct or proximate contact
      with the respiratory secretions of infected individuals which may be saliva,
      large particles of aerosol or droplets, or by contact with surfaces
      contaminated by their secretion.
    explanation: >-
      Supports direct contact with respiratory secretions and fomite contact as
      routes of hMPV acquisition alongside droplets and aerosols.
- name: Nosocomial person-to-person transmission
  description: >-
    hMPV is transmitted between patients in hospital, and immunocompromised
    inpatients are a group in whom introduced virus spreads and causes severe
    disease.
  evidence:
  - reference: PMID:32092386
    reference_title: Nanopore metagenomic sequencing to investigate nosocomial transmission of human metapneumovirus from a unique genetic group among haematology patients in the United Kingdom.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among these, eight HMPV genomes formed a cluster (differing by ≤3 SNPs),
      likely to reflect nosocomial transmission, while two others were more
      distantly related and may represent independent introductions to the
      haematology unit.
    explanation: >-
      Whole-genome sequencing of a haematology-unit cluster provides molecular
      evidence of patient-to-patient hMPV transmission within the hospital.
pathophysiology:
- name: Respiratory Epithelial Infection and Innate Immune Response
  conforms_to: "innate_antiviral_interferon_response#Interferon-Stimulated Gene Antiviral State"
  description: >
    hMPV infects the ciliated respiratory epithelium of the upper and lower
    airways, where replication is sensed by the innate immune system and elicits a
    type I/III interferon and inflammatory response. Disease ranges from mild upper
    respiratory illness to lower respiratory involvement; the clinical picture
    closely resembles RSV, its close relative in the Pneumoviridae.
  cell_types:
  - preferred_term: respiratory epithelial cell
    term:
      id: CL:0002632
      label: epithelial cell of lower respiratory tract
  - preferred_term: ciliated airway epithelial cell
    term:
      id: CL:0000064
      label: ciliated cell
  biological_processes:
  - preferred_term: viral genome replication
    term:
      id: GO:0019079
      label: viral genome replication
  - preferred_term: defense response to virus
    term:
      id: GO:0051607
      label: defense response to virus
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  locations:
  - preferred_term: respiratory system
    term:
      id: UBERON:0001004
      label: respiratory system
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  evidence:
  - reference: PMID:16847085
    reference_title: "Epidemiology of human metapneumovirus."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      hMPV is a common respiratory pathogen, particularly in infants and young
      children. The virus is associated with both upper and lower respiratory tract
      infections and may be a trigger for asthma.
    explanation: >-
      Establishes hMPV as a common cause of upper and lower respiratory infection
      and an asthma trigger. Evidence source is OTHER as this is a review article.
  downstream:
  - target: Lower Respiratory Tract Involvement
    description: >-
      In infants, the elderly, and immunocompromised hosts, hMPV infection extends
      to the lower airway, producing bronchiolitis and pneumonia.
    causal_link_type: DIRECT
  - target: Rhinorrhea
    description: >-
      Upper respiratory tract epithelial infection and mucosal inflammation
      produce nasal discharge (rhinorrhea).
    causal_link_type: DIRECT
  - target: Acute otitis media
    description: >-
      Upper respiratory tract hMPV infection in children is associated with
      concomitant acute otitis media, with hMPV implicated among the causative
      agents of pediatric otitis media.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES


diagnosis:
- name: Reverse transcription polymerase chain reaction
  description: >-
    Reverse transcription polymerase chain reaction (RT-PCR), including
    real-time RT-PCR on respiratory specimens, is the recommended and
    predominant laboratory diagnostic methodology for identifying hMPV, given
    the difficulty of culturing the virus in vitro.
  diagnosis_term:
    preferred_term: Reverse transcription polymerase chain reaction
    term:
      id: NCIT:C17003
      label: Polymerase Chain Reaction
  results: >-
    Detection of hMPV viral RNA in respiratory specimens identifies hMPV
    infection.
  evidence:
  - reference: PMID:40034641
    reference_title: "A Re-emerging Respiratory Virus: Human Metapneumovirus (hMPV)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The recommended laboratory diagnostic approach is reverse transcription
      polymerase chain reaction, given the challenges associated with culturing
      the virus.
    explanation: >-
      Identifies RT-PCR as the recommended laboratory diagnostic approach for
      hMPV infection.
  - reference: PMID:40034641
    reference_title: "A Re-emerging Respiratory Virus: Human Metapneumovirus (hMPV)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Real-time RT-PCR, which is utilized for the detection of various
      respiratory pathogens, can also be effectively employed for the
      identification of hMPV.
    explanation: >-
      Supports the use of real-time RT-PCR for laboratory identification of

classifications:
  harrisons_chapter:
  - classification_value: ENDOCRINOLOGY_METABOLISM
    notes: >-
      Primary and essentially sole Part. CPP is a disorder of the
      hypothalamic-pituitary-gonadal axis by definition — the diagnosis is made
      on laboratory confirmation of central HPG axis activation, and the
      first-line therapy (GnRH analog) acts on that axis. Harrison's covers
      puberty and its disorders within the endocrinology Part.
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: >-
      Secondary Part, for the monogenic minority. Three of this entry's four
      subtypes are single-gene, and two of them (MKRN3, DLK1) are paternally
      expressed imprinted genes, so parent-of-origin inheritance is a
      substantive mechanistic axis here rather than incidental genetics. The
      entry's category remains Complex because most cases — idiopathic CPP in
      girls — have no identified monogenic cause.
notes: >-
  Classification note. Only `harrisons_chapter` is assigned. Every other slot
  in `DiseaseClassifications` was considered and rejected as inapplicable: CPP
  is not neoplastic (no `icdo_morphology`), not an inborn error of metabolism
  (no `icimd_category`), not a lysosomal storage disorder, not an
  immunodeficiency, not a channelopathy, and not listed in the ISDS skeletal
  nosology despite the accelerated skeletal maturation. `mechanistic_category`
  is also left empty: the natural label would be something like "imprinting
  disorder" for the MKRN3/DLK1 subtypes, and `MechanisticCategoryEnum` has no
  such value — and it would in any case describe only two of four subtypes,
  not the disease.

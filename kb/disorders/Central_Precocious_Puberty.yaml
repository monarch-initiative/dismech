      snippet: "Only family members who inherited the defect from their father have precocious puberty, consistent with the known imprinting of DLK1."
      explanation: >-
        Records the parent-of-origin restriction that this inheritance term
        names, in the family in which the DLK1 defect was found.
  description: >-
    CPP caused by loss-of-function variants in DLK1 (delta like non-canonical Notch ligand
    1), another paternally expressed imprinted gene at the 14q32 locus. Like MKRN3, DLK1
    is transmitted in a parent-of-origin (paternal) pattern and may be associated with a
    broader metabolic phenotype including early obesity, hyperlipidemia, and type 2
    diabetes. In the family in which it was found, the deletion removed the DLK1
    translational start site and left circulating DLK1 undetectable in affected
    members.
  evidence:
  - reference: PMID:28324015
    reference_title: "Paternally Inherited DLK1 Deletion Associated With Familial Central Precocious Puberty."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a genomic defect in DLK1 associated with isolated \nfamilial CPP. MKRN3 and DLK1 are both paternally expressed imprinted genes."
    explanation: Establishes a DLK1 deletion as a cause of familial CPP and confirms its imprinted, paternally expressed nature.
  - reference: PMID:28324015
    reference_title: "Paternally Inherited DLK1 Deletion Associated With Familial Central Precocious Puberty."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Serum DLK1 levels were undetectable in all affected individuals."
    explanation: >-
      Confirms loss of circulating DLK1 in the affected members, the biochemical
      consequence of the deletion this subtype is defined by.
  - reference: PMID:28324015
    reference_title: "Paternally Inherited DLK1 Deletion Associated With Familial Central Precocious Puberty."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This deletion included the 5' untranslated region and the first exon of DLK1, including the translational start site."
    explanation: >-
      Sources the extent of the deletion, which is what makes this subtype a loss
      of the DLK1 product rather than an altered product.

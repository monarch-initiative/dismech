  - reference: PMID:18272894
    reference_title: "A GPR54-activating mutation in a patient with central precocious puberty."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In vitro studies have shown that this mutation leads to prolonged activation of intracellular signaling pathways in response to kisspeptin."
    explanation: >-
      The measured consequence that makes the receptor arm of this node an

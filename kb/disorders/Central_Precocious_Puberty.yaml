pathophysiology:
- name: Loss of Paternally Expressed Imprinted Restraint on the GnRH Pulse Generator
  description: >-
    MKRN3 and DLK1 are both expressed only from the paternal allele, and both act to
    hold the hypothalamic GnRH pulse generator quiescent through childhood.
    Hypothalamic Mkrn3 transcript is abundant in the arcuate nucleus of prepubertal
    mice and falls immediately before puberty, so withdrawal of this brake is part
    of the normal pubertal trigger. A paternally transmitted loss-of-function variant
    in either gene removes the brake before the normal age of puberty; in the
    family in which the DLK1 defect was found, the deletion removed the DLK1
    translational start site and left circulating DLK1 undetectable in every
    affected member.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: MKRN3
    term:
      id: hgnc:7114
      label: MKRN3
  - preferred_term: DLK1
    term:
      id: hgnc:2907
      label: DLK1
  locations:
  - preferred_term: arcuate nucleus of hypothalamus
    term:
      id: UBERON:0001932
      label: arcuate nucleus of hypothalamus
  evidence:
  - reference: PMID:23738509
    reference_title: "Central precocious puberty caused by mutations in the imprinted gene MKRN3."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Levels of Mkrn3 mRNA were high in the arcuate nucleus of prepubertal mice, decreased immediately before puberty, and remained low after puberty."
    explanation: >-
      The prepubertal abundance and pre-pubertal fall of hypothalamic Mkrn3 is
      what identifies MKRN3 as a brake whose withdrawal permits puberty.
  - reference: PMID:23738509
    reference_title: "Central precocious puberty caused by mutations in the imprinted gene MKRN3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Deficiency of MKRN3 causes central precocious puberty in humans."
    explanation: >-
      Establishes that losing MKRN3, rather than merely having low MKRN3, is
      sufficient to produce the disease in people.
  - reference: PMID:28324015
    reference_title: "Paternally Inherited DLK1 Deletion Associated With Familial Central Precocious Puberty."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Serum DLK1 levels were undetectable in all affected individuals."
    explanation: >-
      Confirms that the DLK1 arm of this node is a loss of the gene product, not
      a change in its activity.
  - reference: PMID:28324015
    reference_title: "Paternally Inherited DLK1 Deletion Associated With Familial Central Precocious Puberty."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a genomic defect in DLK1 associated with isolated \nfamilial CPP. MKRN3 and DLK1 are both paternally expressed imprinted genes."
    explanation: >-
      Supplies the DLK1 half of this node's claim: a defect in a paternally
      expressed imprinted gene is reported as a cause of familial CPP.
  - reference: PMID:28324015
    reference_title: "Paternally Inherited DLK1 Deletion Associated With Familial Central Precocious Puberty."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This deletion included the 5' untranslated region and the first exon of DLK1, including the translational start site."
    explanation: >-
      Sources the start-site claim in this node's description.
  downstream:
  - target: Premature Reactivation of Pulsatile GnRH Secretion
    description: >-
      With the paternally expressed inhibitory genes absent, the restraint that
      normally holds the GnRH pulse generator quiescent is gone and pulsatile GnRH
      secretion resumes before the normal age of puberty.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:23738509
      reference_title: "Central precocious puberty caused by mutations in the imprinted gene MKRN3."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Deficiency of MKRN3 causes central precocious puberty in humans."
      explanation: >-
        Edge-level support: the node's loss of MKRN3 is reported as a cause of
        the disease, whose defining event is the premature GnRH pulsatility this
        edge points at. The intermediate steps between absent MKRN3 and renewed
        GnRH pulsatility are not established, which is why the link is typed with
        unknown intermediates.
- name: Enhanced Kisspeptin-KISS1R Drive on GnRH Secretion
  description: >-
    Kisspeptin, the product of KISS1, is the excitatory input for the secretion of
    GnRH, and it acts through the G-protein-coupled receptor KISS1R (previous symbol
    GPR54). Variants that raise the tone of this input cause CPP from the stimulatory
    side rather than by releasing an inhibitory brake, and the reported KISS1R
    Arg386Pro receptor produces a longer intracellular signal than normal for the
    same kisspeptin exposure.
  biological_scale: CELLULAR

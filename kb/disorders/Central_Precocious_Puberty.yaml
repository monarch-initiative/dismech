inheritance:
- name: Autosomal dominant with maternal imprinting
  inheritance_term:
    preferred_term: Autosomal dominant inheritance with maternal imprinting
    term:
      id: HP:0012275
      label: Autosomal dominant inheritance with maternal imprinting
  description: >-
    The monogenic MKRN3 and DLK1 subtypes are autosomal dominant with exclusive
    paternal transmission: the maternal allele is silenced by imprinting, so only
    paternally inherited loss-of-function variants cause disease. Idiopathic CPP,
    the majority of cases in girls, has no Mendelian inheritance pattern.
  evidence:
  - reference: PMID:23738509
    reference_title: "Central precocious puberty caused by mutations in the imprinted gene MKRN3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All affected \npersons inherited the mutations from their fathers, a finding that indicates \nperfect segregation with the mode of inheritance expected for an imprinted gene."
    explanation: >-
      Establishes exclusive paternal transmission of MKRN3 CPP, the signature of
      maternal-allele silencing.
  - reference: PMID:28324015
    reference_title: "Paternally Inherited DLK1 Deletion Associated With Familial Central Precocious Puberty."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Only family \nmembers who inherited the defect from their father have precocious puberty, \nconsistent with the known imprinting of DLK1."
    explanation: Confirms the same parent-of-origin pattern for the DLK1 subtype.
treatments:
- name: GnRH Analog Therapy
  description: >-
    Long-acting GnRH agonists (e.g., leuprolide) are first-line therapy for CPP. Continuous
    (non-pulsatile) GnRH receptor stimulation desensitizes pituitary gonadotrophs,
    suppressing LH/FSH and sex-steroid secretion, halting pubertal progression and
    preserving adult height potential.
  evidence:
  - reference: PMID:30086862
    reference_title: "Central precocious puberty: From genetics to treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "GnRH analogs are the mainstay of treatment and are used \nwith the goal of height preservation."
    explanation: Confirms GnRH analogs as first-line treatment for CPP, aimed at height preservation.
  target_mechanisms:
  - target: Premature Reactivation of Pulsatile GnRH Secretion
    treatment_effect: INHIBITS
    description: >-
      Continuous (non-pulsatile) GnRH-receptor agonism desensitizes pituitary
      gonadotrophs, suppressing the prematurely reactivated GnRH/gonadotropin
      drive and halting pubertal progression.
    evidence:
    - reference: PMID:33745030
      reference_title: "Diagnosis and management of precocious sexual maturation: an updated review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "adequate hormone suppression results in the stabilization of pubertal progression, a decline in growth velocity, and a decrease in bone age advancement"
      explanation: >-
        Evidence for the mechanism link specifically, not just for the drug:
        the measured effect of GnRH-analog therapy is suppression of the
        hormonal drive, with pubertal progression, growth velocity and bone-age
        advancement all reversing — i.e. the therapy acts on the reactivated
        GnRH/gonadotropin node and the whole downstream chain follows.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: leuprolide
      term:
        id: CHEBI:6427
        label: leuprolide

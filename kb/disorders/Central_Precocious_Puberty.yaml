- name: KISS1
  display_name: KISS1-related CPP
  genes:
  - preferred_term: KISS1
    term:
      id: hgnc:6341
      label: KISS1
  inheritance:
  - name: Reported heterozygous and homozygous (KISS1)
    description: >-
      The three reported children were not a single kindred: p.P74S was found in
      the heterozygous state in one boy and p.H90D in the homozygous state in two
      unrelated girls, so no single mode of inheritance is established for this
      subtype and none is asserted here.
    evidence:
    - reference: PMID:20237166
      reference_title: "Mutations of the KISS1 gene in disorders of puberty."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The p.P74S mutation was identified in the heterozygous state in a boy who developed CPP at 1 yr of age. The p.H90D mutation was identified in the homozygous state in two unrelated girls with CPP."
      explanation: >-
        Records the two different zygosity states in which the reported KISS1
        variants were found, which is why no mode of inheritance is asserted.
  description: >-
    Rare CPP associated with missense variants in KISS1, the gene encoding the kisspeptin
    ligand that stimulates GnRH secretion. Two variants, p.P74S and p.H90D, were found in
    three unrelated children with idiopathic CPP. Their effect is not a straightforward
    increase in receptor activation: in vitro the mutant peptides stimulated inositol
    phosphate production about as well as wild-type kisspeptin, and the property the
    authors attribute to p.P74S is greater resistance to degradation in human serum.
  evidence:
  - reference: PMID:20237166
    reference_title: "Mutations of the KISS1 gene in disorders of puberty."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two novel KISS1 missense mutations, p.P74S and p.H90D, were identified in three unrelated children with idiopathic CPP."
    explanation: Identifies the two KISS1 missense variants in children with idiopathic CPP.
  - reference: PMID:20237166
    reference_title: "Mutations of the KISS1 gene in disorders of puberty."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In vitro studies revealed that the capacity of the P74S and H90D mutants to stimulate IP production was similar to the wild type."
    explanation: >-
      Supports the description's caveat that neither variant increased intrinsic
      signalling potency in the receptor assay.
  - reference: PMID:20237166
    reference_title: "Mutations of the KISS1 gene in disorders of puberty."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The p.P74S variant was associated with higher kisspeptin resistance to degradation in comparison with the wild type, suggesting a role for this mutation in the precocious puberty phenotype."
    explanation: >-
      Gives the mechanism the authors propose for p.P74S, namely increased
      peptide stability rather than increased receptor activation.

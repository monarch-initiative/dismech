    reference_title: "[Central precocious puberty]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "acceleration of growth velocity, and rapid bone maturation that often result in reduced adult height"
    explanation: >-
      Rapid bone maturation is named as a characteristic feature of CPP, along
      with the reduced adult height that premature epiphyseal fusion produces.
  - reference: PMID:33745030
    reference_title: "Diagnosis and management of precocious sexual maturation: an updated review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "adequate hormone suppression results in the stabilization of pubertal progression, a decline in growth velocity, and a decrease in bone age advancement"
    explanation: >-
      Corroborates the phenotype from the treatment side: GnRH-analog
      suppression reduces bone age advancement, which presupposes that untreated
      CPP is advancing bone age.
- name: Tall stature in childhood
  description: >-
    Sex-steroid-driven growth acceleration produces tall stature relative to peers during
    childhood, although early epiphyseal fusion may compromise final adult height.
  phenotype_term:
    preferred_term: Tall stature
    term:
      id: HP:0000098
      label: Tall stature
    onset:
      onset_category: CHILDHOOD
  evidence:
  - reference: PMID:19347819
    reference_title: "[Central precocious puberty]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This condition is characterised by early pubertal changes, acceleration of growth velocity"
    explanation: >-
      Indirect rather than direct support, deliberately. The source states the
      accelerated growth velocity that produces height above the age norm during
      childhood, but does not itself say "tall stature"; the phenotype term is
      the entry's reading of that acceleration. The same sentence records the
      opposite endpoint — reduced adult height — so the tall-stature claim holds
      only for childhood, as this phenotype's name and description say.
- name: Premature thelarche
  description: >-
    Early breast development in girls, a common presenting sign of CPP.
  phenotype_term:
    preferred_term: Premature thelarche
    term:
      id: HP:0010314
      label: Premature thelarche
  evidence:
  - reference: PMID:33745030
    reference_title: "Diagnosis and management of precocious sexual maturation: an updated review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The main sign to suspect the onset of puberty is breast tissue development (thelarche) in girls"
    explanation: >-
      Supports thelarche as the presenting sign in girls, which is what makes
      it the common presentation of CPP given that CPP in girls is usually
      idiopathic and follows the normal pubertal sequence.

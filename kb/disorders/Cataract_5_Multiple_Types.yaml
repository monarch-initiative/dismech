- name: Reduced HSF4 Target Gene Transactivation
  biological_scale: MOLECULAR
  description: >-
    HSF4 directly activates lens structural genes (gamma-crystallins including
    gammaS, and the beaded filament genes BFSP1 and BFSP2), the lysosomal DNase
    DLAD (DNASE2B), the autophagy gene ATG9A, and stabilizes p53 to induce p21,
    FAS and BAX. Loss of HSF4 activity reduces each of these outputs; the
    nodes below follow the separate branches.

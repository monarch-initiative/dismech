    reference_title: "HSF4 regulates DLAD expression and promotes lens de-nucleation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These results were confirmed by HSF4 knockdown in zebrafish, which led to incomplete de-nucleation of the lens and decreased expression and activity of DLAD."
    explanation: In vivo loss of denucleation with reduced DLAD.
  - reference: PMID:23507146
    reference_title: "HSF4 regulates DLAD expression and promotes lens de-nucleation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In this study, we found that HSF4 promoted the expression and DNase activity of DLAD by directly binding to the DLAD promoter."
    explanation: Direct promoter regulation.
  downstream:
  - target: Loss of Lens Transparency
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES

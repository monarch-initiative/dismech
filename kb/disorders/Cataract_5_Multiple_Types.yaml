name: Cataract 5 Multiple Types
creation_date: "2026-10-15T12:30:00Z"
category: Mendelian
synonyms:
- CTRCT5
- cataract 5, multiple types
- HSF4-related cataract
- Marner cataract
- lamellar cataract, HSF4-related
description: >-
  Early-onset, usually bilateral and non-syndromic cataract caused by variants
  in HSF4, the lens heat-shock transcription factor on 16q22.1. Heterozygous
  missense variants in the N-terminal DNA-binding domain cause autosomal
  dominant lamellar cataract and the zonular-stellate Marner cataract, with
  marked intra- and interfamilial variation in morphology. Biallelic variants
  that remove the C-terminal regulatory region cause autosomal recessive
  congenital, often total, cataract. HSF4 drives lens crystallin and beaded
  filament gene expression, restrains lens epithelial proliferation through p53,
  and activates the DNase IIbeta (DLAD) and ATG9A programmes that clear nuclei
  and organelles from maturing fiber cells; disease variants impair DNA binding
  or transactivation and disturb these steps, leaving disordered,
  organelle-retaining fibers that scatter light.
disease_term:
  preferred_term: cataract 5 multiple types
  term:
    id: MONDO:0007290
    label: cataract 5 multiple types
parents:
- Early-onset non-syndromic cataract
has_subtypes:
- name: Autosomal dominant
  display_name: Autosomal dominant HSF4 cataract (lamellar and Marner)
  description: >-
    Heterozygous HSF4 missense variants in the DNA-binding domain, segregating
    with lamellar cataract in Chinese and British families and with Marner
    cataract in a large Danish pedigree. Variants are proposed to act as
    dominant negatives on the HSF4 trimer.
  evidence:
  - reference: PMID:12089525
    reference_title: "Mutant DNA-binding domain of HSF4 is associated with autosomal dominant lamellar and Marner cataract."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We screened individuals of three Chinese families for mutations in HSF4 (a gene at this locus that encodes heat-shock transcription factor 4) and discovered that in each family, a distinct missense mutation, predicted to affect the DNA-binding domain of the protein, segregates with the disorder."
    explanation: Gene discovery for the dominant form in three Chinese lamellar cataract families.
- name: Autosomal recessive
  display_name: Autosomal recessive HSF4 cataract
  description: >-
    Homozygous HSF4 splice, frameshift or nonsense variants that truncate or
    remove the C-terminal activation and repression domains, reported in
    consanguineous Tunisian and Pakistani families with congenital cataract.
    MONDO has no separate term for this form; it is kept here because the gene
    and the downstream lens mechanism are shared.
  evidence:
  - reference: PMID:15277496
    reference_title: "A homozygous splice mutation in the HSF4 gene is associated with an autosomal recessive congenital cataract."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This is the first report describing association of an autosomal recessive cataract with the HSF4 locus on 16q21-q22.1"
    explanation: First recessive HSF4 cataract family.
  - reference: PMID:19014451
    reference_title: "A novel HSF4 gene mutation (p.R405X) causing autosomal recessive congenital cataracts in a large consanguineous family from Pakistan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified the first nonsense mutation (p.R405X) in exon 11 of HSF4 in a large consanguineous Pakistani family with autosomal recessive cataract."
    explanation: Independent recessive family with a C-terminal nonsense allele.
inheritance:
- name: Autosomal Dominant
  description: >-
    Dominant transmission of DNA-binding-domain missense variants, including
    multigeneration Chinese, Danish and British pedigrees.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:29243736
    reference_title: "A novel missense mutation in HSF4 causes autosomal-dominant congenital lamellar cataract in a British family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A novel missense mutation NM_001040667.2:c.190A>G;p.K64E was identified in the DNA-binding-domain of heat-shock transcription factor 4 (HSF4) and found to co-segregate with disease."
    explanation: Co-segregation of a dominant DNA-binding-domain variant in a five-generation British family.
- name: Autosomal Recessive
  description: >-
    Recessive transmission of truncating or splice variants affecting the
    C-terminal region, in consanguineous families.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:15277496
    reference_title: "A homozygous splice mutation in the HSF4 gene is associated with an autosomal recessive congenital cataract."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sequencing of HSF4 showed a homozygous mutation in the 5' splice site of intron 12 (c.1327+4A-->G), which causes the skipping of exon 12."
    explanation: Homozygous splice variant in a consanguineous Tunisian family with recessive cataract.
pathophysiology:
- name: HSF4 DNA-Binding Domain Variant
  biological_scale: MOLECULAR
  description: >-
    Dominant disease alleles are missense substitutions clustered in the
    N-terminal DNA-binding domain. Five congenital-cataract substitutions tested
    biochemically inhibited HSF4 DNA binding; because HSF4 acts as a trimer,
    a mutant subunit is proposed to interfere with the wild-type protein.
  genes:
  - preferred_term: HSF4
    term:
      id: hgnc:5227
      label: HSF4
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: DOMINANT_NEGATIVE
  molecular_functions:
  - preferred_term: DNA-binding transcription factor activity
    term:
      id: GO:0003700
      label: DNA-binding transcription factor activity
    modifier: DECREASED
  evidence:
  - reference: PMID:20670914
    reference_title: "DNA-binding and transcriptional activities of human HSF4 containing mutations that associate with congenital and age-related cataracts."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Five missense mutations that have been associated with congenital cataract inhibited DNA-binding of HSF4, which demonstrates the relationship between HSF4 mutations, loss of lens protein gene expression, and cataractogenesis."
    explanation: Biochemical demonstration that dominant cataract alleles impair HSF4 DNA binding.
  - reference: PMID:29243736
    reference_title: "A novel missense mutation in HSF4 causes autosomal-dominant congenital lamellar cataract in a British family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "This mutation is likely to be dominant negative and affect the DNA-binding affinity of HSF4."
    explanation: The dominant-negative mechanism is the authors' interpretation, not a measured result in this paper.
  downstream:
  - target: Reduced HSF4 Target Gene Transactivation
    causal_link_type: DIRECT
    description: Loss of heat shock element binding prevents activation of HSF4 target promoters.
    evidence:
    - reference: PMID:23507146
      reference_title: "HSF4 regulates DLAD expression and promotes lens de-nucleation."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "In contrast, HSF4 cataract causative mutations failed to bind to the DLAD promoter, abrogating the expression and DNase activity of DLAD."
      explanation: Cataract-causing HSF4 mutants fail to bind and activate a lens target promoter.

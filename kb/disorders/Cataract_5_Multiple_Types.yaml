genetic:
- name: HSF4
  gene_term:
    preferred_term: HSF4
    term:
      id: hgnc:5227
      label: HSF4
  association: Causative
  relationship_type: CAUSATIVE
  notes: >-
    Dominant alleles cluster in the DNA-binding domain (p.Lys64Glu on
    NM_001040667.2 in the British family; older reports number residues one
    higher than newer transcripts). Recessive alleles include c.1327+4A>G,
    c.595_599delGGGCC and c.1213C>T p.(Arg405*). The p.Arg116His variant
    reported in age-related cataract and in about 2% of controls produces
    lamellar cataract in transgenic mice, suggesting reduced penetrance or
    under-ascertainment of mild opacities. No ClinGen gene-disease validity
    record for this pair was found in the local cache.
  evidence:
  - reference: PMID:12089525
    reference_title: "Mutant DNA-binding domain of HSF4 is associated with autosomal dominant lamellar and Marner cataract."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We suggest that HSF4 is critical to lens development."
    explanation: Gene discovery report.
  - reference: PMID:19014451
    reference_title: "A novel HSF4 gene mutation (p.R405X) causing autosomal recessive congenital cataracts in a large consanguineous family from Pakistan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The disease phenotype perfectly co-segregated with markers flanking the known cataract gene HSF4, whereas other autosomal recessive loci were excluded."
    explanation: Linkage and segregation in a recessive family.
  - reference: PMID:24975927
    reference_title: "HSF4 mutation p.Arg116His found in age-related cataracts and in normal populations produces childhood lamellar cataract in transgenic mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here, we demonstrate via BAC (bacterial artificial chromosome) transgenesis that p.Arg116His recreates the childhood lamellar cataract in mice suggesting that incomplete penetrance associated with early cataracts may not be an absence but a limitation of the detection of the phenotype."
    explanation: Bears on penetrance of mild DNA-binding-domain alleles.

  genotype: Hsf4-/-
  publication: PMID:15483628
  modeled_mechanisms:
  - target: Reduced Lens Crystallin and Beaded Filament Expression
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Null lenses lose gamma-crystallin and beaded filament expression and develop cataract.
    limitations: >-
      A null allele does not reproduce the heterozygous DNA-binding-domain
      genotype of dominant human disease; the authors describe the model as
      only partially mimicking human HSF4 cataract.
    evidence:
    - reference: PMID:19224648
      reference_title: "Removal of Hsf4 leads to cataract development in mice through down-regulation of gamma S-crystallin and Bfsp expression."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We showed that the Hsf4 knockout mouse (Hsf4-/-) partially mimics the human cataract caused by HSF4 mutations."
      explanation: Authors' own fidelity assessment.
  - target: Failure of p53-Dependent Lens Epithelial Cell Cycle Exit
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Lens epithelial cells overproliferate and differentiate prematurely.
    evidence:
    - reference: PMID:15483628
      reference_title: "HSF4 is required for normal cell growth and differentiation during mouse lens development."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Furthermore, we found increased proliferation and premature differentiation of the mutant lens epithelial cells, which is associated with increased expression of growth factors, FGF-1, FGF-4, and FGF-7."
      explanation: Epithelial phenotype of the null mouse.
- name: Hsf4 DNA-binding domain-EGFP BAC transgenic mouse
  species: Mus musculus
  genotype: BAC transgene with EGFP inserted into the Hsf4 DNA-binding domain
  publication: PMID:25168898
  modeled_mechanisms:
  - target: Loss of Lens Transparency
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: TISSUE
    description: Reproduces the temporal and spatial presentation of human lamellar cataract.
    limitations: >-
      The interfering allele is an engineered EGFP insertion expressed from a
      BAC alongside both endogenous alleles, not a human missense variant.
    evidence:
    - reference: PMID:25168898
      reference_title: "Expression of the HSF4 DNA binding domain-EGFP hybrid gene recreates early childhood lamellar cataract in transgenic mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Molecular and cell biological examination of early postnatal transgenic lens reveals impairment of secondary fiber cell differentiation."
      explanation: Links the lamellar phenotype to secondary fiber differentiation.
- name: HSF4del42 mouse
  species: Mus musculus
  genotype: HSF4del42 (in-frame 42 amino acid deletion)
  publication: PMID:37266953
  modeled_mechanisms:
  - target: Defective Autophagic Organelle Clearance in Lens Fibers
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Congenital cataract with delayed organelle clearance; rapamycin partly rescues clearance.
    limitations: The del42 allele is engineered and is not a reported human variant.
    evidence:
    - reference: PMID:37266953
      reference_title: "HSF4 Transcriptionally Activates Autophagy by Regulating ATG9a During Lens Terminal Differentiation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "HSF4del42 mice displayed delayed organelle clearance and impaired autophagic degradation function in lens fibers."
      explanation: In vivo organelle-clearance defect.
- name: hsf4-null zebrafish
  species: Danio rerio
  genotype: TALEN-generated hsf4 knockout
  publication: PMID:28981088
  modeled_mechanisms:
  - target: Defective Lens Fiber Denucleation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Early-onset cataract with failed organelle and nucleus removal, partly rescued by p53, fas or bax mRNA.
    limitations: Fish lens development and timing differ from human infancy; null rather than dominant allele.
    evidence:
    - reference: PMID:28981088
      reference_title: "HSF4 regulates lens fiber cell differentiation by activating p53 and its downstream regulators."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "More importantly, the terminal differentiation of the lens fiber cell was interrupted as the organelles cannot be cleaved in due time."
      explanation: Terminal differentiation defect in the null fish.
- name: lop11/ldis1 mouse
  species: Mus musculus
  genotype: Hsf4 intron 9 early transposable element insertion, homozygous
  publication: PMID:16595169
  modeled_mechanisms:
  - target: Loss of Lens Transparency
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Spontaneous recessive allele producing total cataract with vacuoles by three weeks, a counterpart of the recessive human form.
    limitations: Mouse lens; truncation arises from aberrant splicing of an insertion allele not seen in humans.
    evidence:
    - reference: PMID:16595169
      reference_title: "Early transposable element insertion in intron 9 of the Hsf4 gene results in autosomal recessive cataracts in lop11 and ldis1 mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The ETn insertion altered splicing and expression of the Hsf4 gene, resulting in the truncated Hsf4 protein."
      explanation: Molecular lesion of the spontaneous recessive model.
- name: Boston Terrier early-onset hereditary cataract
  species: Canis lupus familiaris
  genotype: HSF4 exon 9 1-bp insertion, homozygous
  publication: PMID:17611257
  modeled_mechanisms:
  - target: Loss of Lens Transparency
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Naturally occurring recessive early-onset bilateral progressive cataract in dogs.
    limitations: Frameshift allele and recessive inheritance correspond to the recessive human form only.
    evidence:
    - reference: PMID:17611257
      reference_title: "Mutation in HSF4 associated with early but not late-onset hereditary cataract in the Boston Terrier."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Early-onset hereditary cataract (EHC) affects dogs within the first few months of life, is always progressive and bilateral, and results in total blindness"
      explanation: Clinical picture of the canine HSF4 cataract.
diagnosis:
- name: Multigene congenital cataract testing
  description: >-
    HSF4 cataract is clinically indistinguishable from other inherited
    non-syndromic cataracts and is diagnosed by exome or targeted cataract
    gene panel sequencing with segregation analysis.
  diagnosis_term:
    preferred_term: whole exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:29243736
    reference_title: "A novel missense mutation in HSF4 causes autosomal-dominant congenital lamellar cataract in a British family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole exome sequencing (WES) was performed on two affected individuals of the family and further validated by direct sequencing in family members."
    explanation: Exome sequencing identified the familial variant.
  - reference: PMID:36980880
    reference_title: "Evaluation of Genetic Testing in a Cohort of Diverse Pediatric Patients in the United States with Congenital Cataracts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole exome sequencing and targeted congenital cataract panels showed diagnostic yields of 46.2% and 37.5%, respectively."
    explanation: Diagnostic yield of genetic testing in congenital cataract generally, not HSF4-specific.
treatments:
- name: Cataract Surgery
  description: >-
    Removal of a visually significant opacified lens with optical correction
    and amblyopia therapy is the standard management of early-onset cataract.
    No HSF4-directed therapy exists.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: cataract surgery
    term:
      id: NCIT:C157809
      label: Cataract Surgery
  target_phenotypes:
  - preferred_term: Lamellar cataract
    term:
      id: HP:0007971
      label: Lamellar cataract
  notes: >-
    No HSF4-specific surgical outcome series was found; the deep-research
    report cites only general infant cataract trials for this management.
- name: Autophagy activation (experimental)
  description: >-
    Rapamycin improved organelle clearance in HSF4del42 lenses ex vivo and in
    vivo. Preclinical only; no human data.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: rapamycin
      term:
        id: CHEBI:9168
        label: sirolimus
  target_mechanisms:
  - target: Defective Autophagic Organelle Clearance in Lens Fibers
    description: Activates autophagy downstream of reduced ATG9A.
    evidence:
    - reference: PMID:37266953
      reference_title: "HSF4 Transcriptionally Activates Autophagy by Regulating ATG9a During Lens Terminal Differentiation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Activation of autophagy by rapamycin ameliorated the defects in organelle clearance in HSF4del42 lenses ex vivo and in vivo."
      explanation: Mouse rescue of the clearance defect.
  evidence:
  - reference: PMID:37266953
    reference_title: "HSF4 Transcriptionally Activates Autophagy by Regulating ATG9a During Lens Terminal Differentiation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Our study indicates that autophagy activation is a possible therapeutic strategy for HSF4-related congenital cataracts."
    explanation: Proposed, untested in humans.
notes: >-
  No CTRCT5-specific prevalence estimate exists. The recessive HSF4 families
  are included here because MONDO assigns no separate term to them. Canine
  HSF4 cataract also occurs in Staffordshire Bull Terriers and, as a
  semidominant risk allele, in Australian Shepherds (PMID:19883468).

- name: Failure of p53-Dependent Lens Epithelial Cell Cycle Exit
  biological_scale: CELLULAR
  description: >-
    HSF4 stabilizes nuclear p53 and induces p21, FAS and BAX, promoting G1/S
    arrest of lens epithelial cells and their transition to fiber cells.
    Cataract-causing mutants lose this activity; HSF4-deficient mouse and fish
    lenses show epithelial overproliferation and disordered fibers.
  cell_types:
  - preferred_term: lens epithelial cell
    term:
      id: CL:0002224
      label: lens epithelial cell
  biological_processes:
  - preferred_term: lens fiber cell differentiation
    term:
      id: GO:0070306
      label: lens fiber cell differentiation
    modifier: ABNORMAL
  evidence:
  - reference: PMID:25940838
    reference_title: "HSF4 promotes G1/S arrest in human lens epithelial cells by stabilizing p53."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In contrast, HSF4 with cataract causative mutations fail to cause cell cycle arrest and have no obvious effect on cell proliferation."
    explanation: Mutant HSF4 fails to arrest human lens epithelial cells.
  - reference: PMID:15483628
    reference_title: "HSF4 is required for normal cell growth and differentiation during mouse lens development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Furthermore, we found increased proliferation and premature differentiation of the mutant lens epithelial cells, which is associated with increased expression of growth factors, FGF-1, FGF-4, and FGF-7."
    explanation: Epithelial overproliferation in the null mouse lens.
  - reference: PMID:28981088
    reference_title: "HSF4 regulates lens fiber cell differentiation by activating p53 and its downstream regulators."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The epithelial cells of the lens were overproliferated, resulting in the overabundance of lens fiber cells in hsf4null zebrafish lens."
    explanation: Same phenotype in hsf4-null zebrafish.
  downstream:
  - target: Defective Lens Fiber Denucleation
    causal_link_type: DIRECT
    description: >-
      The p53-FAS-BAX axis also contributes to fiber-cell organelle removal;
      p53, fas or bax mRNA partially rescues denucleation in hsf4-null fish.
    evidence:
    - reference: PMID:28981088
      reference_title: "HSF4 regulates lens fiber cell differentiation by activating p53 and its downstream regulators."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Combined with the finding that the denucleation defect could be partially rescued through microinjection of p53, fas and bax mRNA into the mutant embryos, we directly proved that HSF4 promotes lens fiber cell differentiation by activating p53 and its downstream regulators."
      explanation: Rescue experiment places p53 signalling upstream of denucleation.
  - target: Loss of Lens Transparency
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Overabundant fiber cells become disordered and irregular with age.
    evidence:
    - reference: PMID:28981088
      reference_title: "HSF4 regulates lens fiber cell differentiation by activating p53 and its downstream regulators."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Consequently, the arrangement of the lens fiber cells became more disordered and irregular with age."
      explanation: Disordered fiber architecture follows epithelial overproliferation in hsf4-null fish.

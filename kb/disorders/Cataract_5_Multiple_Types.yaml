    term:
      id: GO:0045893
      label: positive regulation of DNA-templated transcription
    modifier: DECREASED
  evidence:
  - reference: PMID:20670914
    reference_title: "DNA-binding and transcriptional activities of human HSF4 containing mutations that associate with congenital and age-related cataracts."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here, we show that HSF4 activates transcription of genes encoding crystallins and beaded filament structural proteins in lens epithelial cells."
    explanation: Establishes crystallin and beaded filament genes as HSF4 transcriptional targets.
  downstream:

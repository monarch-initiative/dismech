    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Q-PCR analysis revealed down-regulation of several cataract-relevant genes, including gamma S-crystallin (Crygs) and lens-specific beaded filament proteins 1 and 2 (Bfsp1 and Bfsp2), in the lens of the Hsf4-/- mouse."

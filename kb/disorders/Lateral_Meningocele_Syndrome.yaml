- name: Increased RANKL Expression in Osteoblast-Lineage Cells
  description: >-
    NOTCH3 is expressed in osteoblasts and osteocytes but not in the
    myeloid/osteoclast lineage. In LMS mouse models the mutant receptor increases
    Tnfsf11 (RANKL) expression in osteoblasts and osteocytes, and introducing the
    mutation in osteocytes alone is sufficient to cause osteopenia.

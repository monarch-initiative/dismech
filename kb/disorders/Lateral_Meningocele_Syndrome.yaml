pathophysiology:
- name: NOTCH3 Terminal Exon Truncation Escaping Nonsense-Mediated Decay
  description: >-
    Heterozygous nonsense and frameshift variants cluster in the last coding exon
    (exon 33) of NOTCH3. Because they lie in the terminal exon, the mutant mRNAs
    escape nonsense-mediated decay and the mutant allele is expressed, producing a
    NOTCH3 protein truncated upstream of or within the C-terminal PEST domain.
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: GAIN_OF_FUNCTION
    gene:
      preferred_term: NOTCH3
      term:
        id: hgnc:7883
        label: NOTCH3
  genes:
  - preferred_term: NOTCH3
    term:
      id: hgnc:7883
      label: NOTCH3
  evidence:
  - reference: PMID:25394726
    reference_title: Truncating mutations in the last exon of NOTCH3 cause lateral meningocele syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All mutations cluster into the last coding exon, resulting in premature
      termination of the protein and truncation of the negative regulatory
      proline-glutamate-serine-threonine rich PEST domain.
    explanation: >-
      The causal variants in six unrelated patients all lie in the last coding exon
      and truncate the PEST domain.
  - reference: PMID:25394726
    reference_title: Truncating mutations in the last exon of NOTCH3 cause lateral meningocele syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our results suggest that mutant mRNA products escape nonsense mediated decay.
    explanation: >-
      The terminal-exon location of the variants predicts escape from
      nonsense-mediated decay, so the truncated protein is made.
  downstream:
  - target: NOTCH3 Gain of Function Through Loss of PEST-Mediated Degradation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:25394726
      reference_title: Truncating mutations in the last exon of NOTCH3 cause lateral meningocele syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The truncated NOTCH3 may cause gain-of-function through decreased clearance
        of the active intracellular product, resembling NOTCH2 mutations in the
        clinically related Hajdu-Cheney syndrome and contrasting the NOTCH3
        missense mutations causing CADASIL.
      explanation: >-
        The truncation is proposed to cause gain of function by slowing clearance of
        the NOTCH3 intracellular domain.
- name: NOTCH3 Gain of Function Through Loss of PEST-Mediated Degradation
  description: >-
    Loss of the PEST degradation signal is thought to stabilize the NOTCH3
    intracellular domain after receptor activation, increasing transcription of
    canonical Notch target genes (HES1, HEY1, HEY2, HEYL). Enhanced Notch target
    gene expression has been shown in human iPSC-derived cells carrying the
    recurrent c.6692_6693insC variant.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: NOTCH3
    term:
      id: hgnc:7883
      label: NOTCH3
  biological_processes:
  - preferred_term: Notch signaling pathway
    modifier: INCREASED
    term:
      id: GO:0007219
      label: Notch signaling pathway
  evidence:
  - reference: PMID:39752389
    reference_title: A NOTCH3 pathogenic variant influences osteogenesis and can be targeted by antisense oligonucleotides in induced pluripotent stem cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      NOTCH36692-93insC cells displayed enhanced expression of Notch target genes
      HES1, HEY1, 2 and L demonstrating a NOTCH3 gain-of-function.
    explanation: >-
      Human iPSC-derived cells with an LMS variant show increased Notch target gene
      expression, direct evidence of NOTCH3 gain of function.
  - reference: PMID:39119451
    reference_title: A Case of Lateral Meningocele Syndrome without Lateral Meningoceles.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Variants in this final exon of NOTCH3 interrupt the regulatory PEST domain,
      leading to enhanced NOTCH3 signaling due to prolonged cellular half-life.
    explanation: >-
      States the accepted mechanism: PEST disruption prolongs NOTCH3 half-life
      and enhances signaling.
  - reference: PMID:31188489
    reference_title: An antibody to Notch3 reverses the skeletal phenotype of lateral meningocele syndrome in male mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The anti-Notch3 NRR antibody suppressed the expression of Hes1, Hey1, and Hey2
      (Notch target genes), and decreased Tnfsf11 (receptor activator of NF Kappa B
      ligand) messenger RNA in Notch3tm1.1Ecan osteoblast (OB) cultures.
    explanation: >-
      Blocking NOTCH3 activation lowers Notch target genes in mutant osteoblasts,
      showing the mutant receptor still depends on ligand-induced activation.
  downstream:
  - target: Increased RANKL Expression in Osteoblast-Lineage Cells
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:30042232
      reference_title: The lateral meningocele syndrome mutation causes marked osteopenia in mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In conclusion, the Notch3tm1.1Ecan mutation causes osteopenia despite an
        increase in osteoblast proliferation and function and is associated with

      explanation: >-
        The LMS-analogous Notch3 mutation increases Tnfsf11 (RANKL) expression in
        osteoblasts and osteocytes.
  - target: Connective Tissue and Dural Dysplasia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The molecular route from NOTCH3 gain of function to the connective tissue

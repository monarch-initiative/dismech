genetic:
- name: NOTCH3
  association: Causative (gain-of-function terminal-exon truncating variants)
  gene_term:
    preferred_term: NOTCH3
    term:
      id: hgnc:7883
      label: NOTCH3
  notes: >-
    Heterozygous nonsense and frameshift variants in the last coding exon (exon 33)
    of NOTCH3 that truncate the PEST domain. These are distinct from the
    extracellular-domain cysteine-altering missense variants that cause CADASIL.
  evidence:
  - reference: PMID:25394726
    reference_title: Truncating mutations in the last exon of NOTCH3 cause lateral meningocele syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In total, five novel de novo NOTCH3 mutations were identified in six
      unrelated patients.
    explanation: De novo NOTCH3 variants were found in six unrelated patients with LMS.
  - reference: PMID:27336130
    reference_title: NOTCH3-Related Lateral Meningocele Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The diagnosis of NOTCH3-related LMS syndrome is established in a proband with
      consistent clinical findings and a heterozygous pathogenic variant in NOTCH3.
    explanation: A heterozygous NOTCH3 pathogenic variant establishes the diagnosis.
treatments:
- name: Neurosurgical Management of Symptomatic Meningoceles
  description: >-
    Surgery on lateral meningoceles is generally avoided because of the risk of
    nerve injury and CSF leak, and is reserved for neurological deficits caused by
    meningocele size or location. Reported approaches include resection or repair,
    cyst-subarachnoid shunting, and ventriculoperitoneal shunting when CSF

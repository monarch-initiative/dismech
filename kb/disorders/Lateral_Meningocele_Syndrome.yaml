    reference_title: "Lateral meningocele syndrome: vertical transmission and expansion of the phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The existence of an affected mother and daughter supports the hypothesis that

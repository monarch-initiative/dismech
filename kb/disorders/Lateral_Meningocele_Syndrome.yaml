    reference_title: "Neurosurgical management in lateral meningocele syndrome: case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Such a case compels consideration that CSF flow dynamics in addition to
      altered connective tissue play a role in the presence of lateral meningoceles
      in patients within this and similar patient populations.
    explanation: >-
      Meningocele enlargement after a change in CSF flow, reversed by shunting,
      implicates CSF dynamics together with connective tissue weakness.

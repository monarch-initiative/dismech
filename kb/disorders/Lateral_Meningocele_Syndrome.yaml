differential_diagnoses:
- name: Hajdu-Cheney syndrome
  description: >-
    Hajdu-Cheney syndrome is caused by analogous last-exon truncating variants in
    NOTCH2 and overlaps clinically (wormian bones, facial features, osteolysis,
    connective tissue signs), but acro-osteolysis and severe osteoporosis dominate
    and multiple lateral meningoceles are not characteristic.
  disease_term:
    preferred_term: Hajdu-Cheney syndrome
    term:
      id: MONDO:0007057
      label: acroosteolysis dominant type
  evidence:
  - reference: PMID:25394726
    reference_title: Truncating mutations in the last exon of NOTCH3 cause lateral meningocele syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Lateral meningocele syndrome has phenotypic overlap with Hajdu-Cheney syndrome.
    explanation: The two syndromes overlap phenotypically and share a truncating-variant mechanism in paralogous genes.
- name: Ehlers-Danlos and Marfan-spectrum connective tissue disorders
  description: >-
    Joint laxity, dural ectasia, and aortic dilation overlap with Marfan,
    Ehlers-Danlos, and Loeys-Dietz syndromes, but multiple lateral thoracolumbar
    meningoceles distinguish LMS.
  evidence:
  - reference: PMID:31838470
    reference_title: "Neurosurgical Management of Lateral Meningocele Syndrome: A Clinical Update for the Pediatric Neurosurgeon."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Lateral meningocele syndrome (LMS) is an exceedingly rare connective tissue
      disease with phenotypic anomalies similar to those seen in Marfan syndrome,
      Ehler-Danlos syndrome, and Loeys-Dietz syndrome.
    explanation: The review names these connective tissue disorders as the phenotypic differential.
animal_models:
- name: Notch3 6691-TAATGA knock-in mouse
  species: Mus musculus
  genotype: Notch3 tm1.1Ecan (em1Ecan) heterozygous, tandem stop codon at bases 6691-6696 upstream of the PEST domain
  publication: PMID:30042232
  description: >-
    A CRISPR/Cas9 knock-in that truncates Notch3 upstream of the PEST domain,
    reproducing the LMS variant class. Heterozygous mice have cancellous and
    cortical osteopenia with increased osteoclastogenesis and RANKL expression,
    but no neurological phenotype or meningoceles. The osteopenia is reversed by
    an anti-Notch3 negative regulatory region antibody and the cortical
    osteopenia is ameliorated by a mutation-specific Notch3 antisense
    oligonucleotide.
  modeled_mechanisms:
  - target: Increased Osteoclastogenesis and Bone Resorption
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: The model shows RANKL-driven osteoclastogenesis and osteopenia.
    limitations: >-
      Human bone phenotype data in LMS are limited to case reports, so how
      faithfully mouse osteopenia represents the human skeletal disease is
      uncertain; female mice recover bone mass with maturation.
    evidence:
    - reference: PMID:30042232
      reference_title: The lateral meningocele syndrome mutation causes marked osteopenia in mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In conclusion, the Notch3tm1.1Ecan mutation causes osteopenia despite an
        increase in osteoblast proliferation and function and is associated with
        enhanced Tnfsf11 expression in osteoblasts and osteocytes.
      explanation: The model recapitulates the resorptive skeletal mechanism.
  - target: Dural Ectasia and Lateral Meningocele Formation
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: ORGANISM
    description: No neurological alterations or meningoceles were reported in the model.
    limitations: >-
      The defining human lesion is absent, so the model cannot be used to study
      meningocele formation or the connective tissue phenotype.
    evidence:
    - reference: PMID:30042232
      reference_title: The lateral meningocele syndrome mutation causes marked osteopenia in mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        One-month-old male and female heterozygous Notch3tm1.1Ecan mice had
        cancellous and cortical bone osteopenia but exhibited no obvious
        neurological alterations, and histopathology of multiple organs revealed no
        abnormalities.
      explanation: The mice lack the neurological and meningocele phenotype.
  evidence:
  - reference: PMID:37704069
    reference_title: Antisense oligonucleotides targeting a NOTCH3 mutation in male mice ameliorate the cortical osteopenia of lateral meningocele syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In conclusion, a Notch3 ASO that downregulates Notch3 mutant expression
      specifically ameliorates the cortical osteopenia in Notch3em1Ecan mice.
    explanation: A mutation-specific ASO partially rescues the model's bone phenotype.
  - reference: PMID:35536858
    reference_title: Use of antisense oligonucleotides to target Notch3 in skeletal cells.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Microcomputed tomography demonstrated that the administration of Notch3 ASOs
      ameliorates the cortical osteopenia of Notch3em1Ecan mice, and ASOs decreased
      femoral cortical porosity and increased cortical thickness and bone volume.
    explanation: A non-allele-selective Notch3 ASO also ameliorates cortical osteopenia in the model.
  - reference: PMID:31188489
    reference_title: An antibody to Notch3 reverses the skeletal phenotype of lateral meningocele syndrome in male mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The cancellous bone osteopenia was no longer observed after the
      intraperitoneal administration of antibodies directed to the negative
      regulatory region (NRR) of Notch3.
    explanation: A NOTCH3-activation-blocking antibody reverses cancellous osteopenia in the model.
discussions:
- discussion_id: lms_mouse_lacks_meningoceles
  prompt: >-
    Why do mice carrying an LMS-analogous Notch3 truncation develop osteopenia but
    no meningoceles, dural ectasia, or neurological signs, and what tissue carries
    the connective tissue defect in humans?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Connective Tissue and Dural Dysplasia
  - pathophysiology#Dural Ectasia and Lateral Meningocele Formation
  rationale: >-
    The only in vivo models reproduce the skeletal resorptive mechanism but not
    the defining human lesion. The mechanism linking NOTCH3 gain of function to
    dural and connective tissue weakness is therefore untested, and the causal
    edge from NOTCH3 gain of function to connective tissue dysplasia rests on
    genotype-phenotype association alone.
  proposed_experiments:
  - experiment_id: exp_lms_meningeal_fibroblast_notch3
    name: NOTCH3 gain of function in human meningeal and dermal fibroblasts
    description: >-
      Compare extracellular matrix production and mechanical properties of
      patient-derived or isogenic iPSC-derived meningeal and dermal fibroblasts
      carrying an exon 33 NOTCH3 truncation against corrected controls.

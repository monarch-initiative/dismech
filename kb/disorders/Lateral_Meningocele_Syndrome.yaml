- name: Dural Ectasia and Lateral Meningocele Formation
  description: >-
    The weakened dura and arachnoid protrude through the intervertebral and
    intravertebral foramina as lateral meningoceles. They are usually most severe
    in the lower spine, presumably because of hydrostatic CSF pressure, and can
    enlarge when CSF dynamics change (for example after Chiari decompression). The
    expanding sacs erode bone, producing posterior scalloping of the vertebral
    bodies.
  biological_scale: TISSUE
  evidence:
  - reference: PMID:25394726
    reference_title: Truncating mutations in the last exon of NOTCH3 cause lateral meningocele syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-

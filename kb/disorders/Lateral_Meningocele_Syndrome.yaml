    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      All probands reported to date with NOTCH3-related LMS whose parents have
      undergone molecular genetic testing have the disorder as the result of a de
      novo NOTCH3 pathogenic variant.
    explanation: >-
      GeneReviews states that all molecularly tested probands carry a de novo
      NOTCH3 variant.
  - reference: PMID:27336130
    reference_title: NOTCH3-Related Lateral Meningocele Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-

name: Lateral Meningocele Syndrome
creation_date: '2026-09-23T19:10:03Z'
category: Mendelian
synonyms:
- Lehman syndrome
- LMNS
- LMS
- NOTCH3-related lateral meningocele syndrome
description: >-
  Lateral meningocele syndrome (LMS, Lehman syndrome) is an ultra-rare autosomal
  dominant connective-tissue and skeletal disorder caused by heterozygous, usually
  de novo, truncating variants in the last coding exon (exon 33) of NOTCH3. The
  mutant transcripts escape nonsense-mediated decay and encode a NOTCH3 protein
  lacking the C-terminal PEST degradation domain, which is thought to prolong the
  half-life of the NOTCH3 intracellular domain and enhance NOTCH3 signaling. The
  defining finding is multiple lateral spinal meningoceles, protrusions of the
  arachnoid and dura through the spinal foramina that represent the severe end of
  the dural ectasia spectrum and can compress nerve roots, causing neurogenic
  bladder, paresthesia, back pain, and paraparesis. Other features include a
  distinctive facial gestalt (hypertelorism, ptosis, downslanting palpebral
  fissures, micrognathia, high narrow palate), hypotonia, developmental delay,
  joint hyperextensibility, hernias, keloids, scoliosis, wormian bones, mixed or
  conductive hearing loss, cardiovascular anomalies, and cryptorchidism. Mouse
  models carrying an analogous Notch3 truncation show osteopenia driven by
  increased RANKL expression in osteoblast-lineage cells but no neurological
  phenotype. The disorder is allelic to CADASIL, which is caused by NOTCH3
  extracellular-domain missense variants.
notes: >-
  A GeneReviews chapter exists (NOTCH3-Related Lateral Meningocele Syndrome,
  PMID:27336130) and is used as the phenotype baseline. Phenotype frequencies are
  omitted because the published case series are too small to support frequency
  bands. Hypotonia, developmental delay, hearing loss, feeding difficulties,
  short stature, cryptorchidism, congenital heart defects, renal cysts, Chiari I
  malformation, syringomyelia and hydrocephalus have no causal edge because no
  source describes the mechanism linking them to NOTCH3 gain of function. The
  GeneReviews abstract reports mixed or conductive hearing loss, while one case
  report (PMID:32141180) describes sensorineural loss with inner ear anomalies.

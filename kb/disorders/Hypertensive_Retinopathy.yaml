name: Hypertensive Retinopathy
creation_date: "2026-07-14T00:00:00Z"
description: >-
  Hypertensive retinopathy is a chronic and acute retinal vascular disorder
  caused by systemic arterial hypertension. Sustained or severe blood pressure
  elevation produces a spectrum of retinal vascular changes, classically
  graded with the Keith-Wagener-Barker (KWB) system: early arteriolar
  vasoconstriction and narrowing, progressing to arteriosclerotic changes
  (arteriovenous nicking, copper/silver wiring), and in accelerated/malignant
  hypertension, breakdown of the blood-retinal barrier producing flame-shaped
  hemorrhages, cotton-wool spots, hard exudates, and bilateral papilledema
  (grade 4, the defining ophthalmoscopic feature of malignant hypertension).
category: Complex
disease_term:
  preferred_term: hypertensive retinopathy
  term:
    id: MONDO:0006797
    label: hypertensive retinopathy
synonyms:
- retinopathy due to hypertension
- hypertensive retinal vasculopathy
parents:
- Retinal vascular disorder

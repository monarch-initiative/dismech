- name: Acute blood-retinal barrier breakdown in accelerated hypertension
  description: >-
    In severe or rapidly rising blood pressure that exceeds retinal
    autoregulatory capacity, retinal vascular autoregulation fails; humoral
    vasoconstrictors and endothelial injury drive breakdown of the
    blood-retinal barrier. This produces exudation of plasma and blood into
    the retina (flame-shaped hemorrhages, hard exudates), microinfarction of
    the retinal nerve fiber layer (cotton-wool spots), and, in malignant
    hypertension, bilateral optic disc swelling (papilledema).
  locations:
  - preferred_term: retina
    term:
      id: UBERON:0000966
      label: retina
  cell_types:
  - preferred_term: retinal blood vessel endothelial cell
    term:
      id: CL:0002585
      label: retinal blood vessel endothelial cell
  biological_processes:
  - preferred_term: vascular permeability
    modifier: INCREASED
    term:
      id: GO:0043114
      label: regulation of vascular permeability
  evidence:
  - reference: PMID:36418425
    reference_title: "Management of hypertensive crisis: British and Irish Hypertension Society Position document."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Bilateral grade 3 i.e., retinal haemorrhage, hard exudates, cotton
      wool spots and grade 4 i.e., optic disc swelling retinal changes
      essentially depict pathophysiology of severe retinal vascular
      permeability and are associated with poor prognosis.
    explanation: >-
      Defines the KWB grade 3/4 exudative-hemorrhagic-papilledema signs
      modeled by this node and their diagnostic role in malignant
      hypertension.
  - reference: PMID:36418425
    reference_title: "Management of hypertensive crisis: British and Irish Hypertension Society Position document."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The release of humoral vasoconstrictors leading to endothelial damage
      has been implicated. This vascular ischaemic state further leads to
      increased systemic vascular resistance, leading to pressure
      natriuresis which results in further activation of RAAS.
    explanation: >-
      Supports the humoral-vasoconstrictor/endothelial-injury mechanism of
      barrier breakdown in accelerated/malignant hypertension.
  downstream:

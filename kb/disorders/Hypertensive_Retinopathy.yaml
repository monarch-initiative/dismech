diagnosis:
- name: Dilated fundus examination with KWB grading
  description: >-
    Ophthalmoscopic examination of the retina, graded by the
    Keith-Wagener-Barker (or modified Scheie) system, is the standard
    diagnostic method, though it is limited by interobserver variability.
  diagnosis_term:
    preferred_term: dilated fundus examination
    term:
      id: NCIT:C38060
      label: Eye Examination
  results: KWB grade 1-4 based on arteriolar narrowing, AV nicking, hemorrhages/exudates, and papilledema.
  evidence:
  - reference: PMID:36196693
    reference_title: "A literature review of hypertensive retinopathy: systemic correlations and new technologies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      HR is even now diagnosed and classified by its clinical appearance on
      a fundoscopic exam that is limited by interobserver variability.
    explanation: Supports fundoscopic KWB grading as the standard, though subjective, diagnostic method.
- name: OCT angiography quantitative retinal microvascular assessment
  description: >-
    Optical coherence tomography angiography (OCTA) can detect reduced
    retinal microvascular density in hypertension-associated states before
    or alongside overt fundoscopic hypertensive retinopathy, complementing
    classic KWB grading with a quantitative, non-invasive measure.
  diagnosis_term:
    preferred_term: optical coherence tomography
    term:
      id: NCIT:C20828
      label: Optical Coherence Tomography
  results: Superficial and deep macular retinal vascular density (superficial/deep vascular plexus).
  evidence:
  - reference: PMID:39572632
    reference_title: OCTA evaluates changes in retinal microvasculature in renal hypertension patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      in SVP, the density of TMI, MIR, and MAR in the RH group was
      significantly lower compared to the HCs group
    explanation: >-
      Demonstrates OCTA-detectable reduction in retinal microvascular
      density in a renal-hypertension cohort versus healthy controls.
  - reference: PMID:35683999
    reference_title: "Arterial Hypertension and the Hidden Disease of the Eye: Diagnostic Tools and Therapeutic Strategies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      retinal microcirculation offers the unique advantage of being
      directly accessible to non-invasive and relatively simple
      investigation tools
    explanation: >-
      Supports the rationale for retinal imaging (OCT/OCTA) as a
      non-invasive window onto hypertension-mediated vascular change.
treatments:
- name: Systemic blood pressure control
  description: >-
    Management is directed at controlling the underlying systemic
    hypertension rather than treating the retina directly; in uncomplicated
    malignant hypertension (grade 3-4 retinopathy with eye changes only),
    blood pressure should be lowered gradually over days to weeks rather than
    hours, to avoid ischemic complications from disrupted retinal/cerebral
    autoregulation.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: amlodipine
      term:
        id: CHEBI:2668
        label: amlodipine
    - preferred_term: atenolol
      term:
        id: CHEBI:2904
        label: atenolol
  target_mechanisms:
  - target: Retinal arteriolar vasoconstriction
    treatment_effect: MODULATES
    description: >-
      Blood pressure control reduces the vasoconstrictive stimulus on
      retinal arterioles and can reverse early-stage changes.
    evidence:
    - reference: PMID:36418425
      reference_title: "Management of hypertensive crisis: British and Irish Hypertension Society Position document."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Eye changes usually regress with treatment, rarely without treatment."
      explanation: Supports blood pressure control as reversing retinal arteriolar changes.
  - target: Chronic retinal arteriolar sclerosis
    treatment_effect: MODULATES
    description: >-
      Blood pressure control reduces the sclerotic stimulus on retinal
      arterioles and can partially reverse early-stage changes.
    evidence:
    - reference: PMID:36418425
      reference_title: "Management of hypertensive crisis: British and Irish Hypertension Society Position document."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Eye changes usually regress with treatment, rarely without treatment."
      explanation: Supports blood pressure control as reversing retinal arteriolar changes.
  evidence:
  - reference: PMID:36418425
    reference_title: "Management of hypertensive crisis: British and Irish Hypertension Society Position document."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In uncomplicated MHT (eye changes alone) BP is to be lowered within
      days, aiming for gradual reduction to reach target BP within weeks.
      For example: within 24 h lower to <200/120 mmHg, within a week
      <160/100 mmHg, then to <140/90 mmHg within 6-12 weeks.
    explanation: >-
      Defines the graduated blood-pressure-lowering targets for malignant
      hypertension presenting with eye changes (grade 3-4 retinopathy) alone.
  - reference: PMID:36418425
    reference_title: "Management of hypertensive crisis: British and Irish Hypertension Society Position document."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Oral medications calcium channel blockers (CCB) such as amlodipine
      5 mg or long acting nifedipine
    explanation: First-line oral pharmacotherapy for malignant hypertension with eye changes alone.

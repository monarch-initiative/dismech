      reference_title: "Hereditary Combined Deficiency of the Vitamin K-Dependent Coagulation Factors."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        a combination of recombinant activated factor VII and vitamin K may be
        considered.
      explanation: Supports selected use of activated factor VII as an adjunct that bypasses rather than repairs the enzyme defect.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: recombinant activated factor VII (eptacog alfa)
      term:
        id: NCIT:C81125
        label: Eptacog Alfa
  evidence:
  - reference: PMID:40541254
    reference_title: "Hereditary Combined Deficiency of the Vitamin K-Dependent Coagulation Factors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      alternative therapies such as prothrombin complex concentrates (PCCs) or a

- discussion_id: gap_vkcf1_null_mouse_human_fidelity
  prompt: How faithfully does the homozygous-null Ggcx mouse model the viable, usually hypomorphic human VKCFD1 spectrum?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  rationale: >-
    Complete Ggcx loss causes developmental loss and uniform fatal hemorrhage at
    birth in surviving mice, whereas reported human VKCFD1 is generally caused
    by residual-function missense alleles. The null mouse establishes pathway
    essentiality but cannot by itself model chronic treatment response or the
    variable extra-hemostatic phenotype. The current AnimalModel schema also
    lacks a modeled_mechanisms slot, so an evidence-backed typed link from this
    faithful animal-model record to the proximal GGCX mechanism cannot be encoded
    within an entry-only review; moving it to the explicitly non-animal
    ExperimentalModel class would distort the model type.
  attaches_to:
  - pathophysiology#Gamma-glutamyl carboxylase deficiency (VKCFD1)
  proposed_experiments:
  - experiment_id: vkcf1_humanized_hypomorphic_allelic_series
    name: Human VKCFD1 hypomorphic knock-in allelic series
    description: >-
      Generate knock-in mice carrying vitamin K-responsive and low-response
      human GGCX alleles and compare survival, factor activity, bleeding,
      substrate carboxylation, skeletal/skin phenotypes, and response to vitamin K
      under a common protocol.
    decision_criterion: >-
      Human-allele models reproduce the ordered clinical and biochemical
      severity and genotype-dependent vitamin K response observed in patients.
    would_support:
    - pathophysiology#Gamma-glutamyl carboxylase deficiency (VKCFD1)
  evidence:
  - reference: PMID:17327402
    reference_title: "Fatal hemorrhage in mice lacking gamma-glutamyl carboxylase."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      only 50% of expected Ggcx(-/-) offspring surviving to term, with the latter
      animals dying uniformly at birth of massive intra-abdominal hemorrhage.
    explanation: Defines the extreme null-model phenotype whose fidelity to viable human hypomorphs is limited.
  - reference: PMID:19141161
    reference_title: "Familial deficiency of vitamin K-dependent clotting factors."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      the rarity of VKCFD and the fact that only missense mutations have been
      identified suggest embryonic lethality with complete deficiency of either
      enzyme in humans; this is supported by knockout mice results
    explanation: The human review explicitly frames complete enzyme deficiency as likely lethal and contrasts it with reported missense disease.

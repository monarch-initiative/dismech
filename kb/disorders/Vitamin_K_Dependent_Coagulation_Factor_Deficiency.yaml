progression:
- phase: Severe neonatal or infantile presentation
  age_range: Neonatal period through infancy
  notes: >-
    Severe disease can present early with major hemorrhage, including
    intracranial bleeding; the timing and severity vary among affected families.
  evidence:
  - reference: PMID:19141161
    reference_title: "Familial deficiency of vitamin K-dependent clotting factors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      VKCFD may present with intracranial hemorrhage in the neonate or early in
      life
    explanation: The clinical review documents the severe early-life end of the natural-history spectrum.
- phase: Milder later-onset presentation
  age_range: Childhood through adulthood
  notes: >-
    Less severe disease may not be recognized until later, often after
    spontaneous bleeding or a hemostatic challenge such as surgery or trauma.
  evidence:
  - reference: PMID:19141161
    reference_title: "Familial deficiency of vitamin K-dependent clotting factors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Milder cases with later onset of diagnosis have also been reported
    explanation: The review establishes that VKCFD is not invariably a neonatal presentation.
- phase: Treatment-modified longitudinal course
  age_range: Lifelong
  notes: >-
    With regular preventive and episodic hemostatic treatment, many affected
    individuals have favorable outcomes, although vitamin K response and the
    risk of breakthrough bleeding remain variable.
  evidence:
  - reference: PMID:40541254
    reference_title: "Hereditary Combined Deficiency of the Vitamin K-Dependent Coagulation Factors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      With appropriate treatment, individuals with VKCFD generally have a good
      clinical outcome, and the condition has a limited impact on their quality
      of life.
    explanation: The contemporary case synthesis describes the generally favorable treatment-modified course.

has_subtypes:
- name: VKCFD1
  display_name: VKCFD type 1 (GGCX deficiency)
  subtype_term:
    preferred_term: vitamin K-dependent clotting factors, combined deficiency of, type 1
    term:
      id: MONDO:0010187
      label: vitamin K-dependent clotting factors, combined deficiency of, type 1
  description: >-
    VKCFD1 is caused by biallelic pathogenic variants in GGCX, encoding
    gamma-glutamyl carboxylase. In addition to the bleeding diathesis, GGCX
    deficiency can produce non-hemorrhagic skin, skeletal, cardiac, vascular,
    and ocular features because non-coagulation vitamin K-dependent proteins
    are also undercarboxylated.
  genes:
  - preferred_term: GGCX
    term:
      id: hgnc:4247
      label: GGCX
  evidence:
  - reference: PMID:9845520
    reference_title: "A missense mutation in gamma-glutamyl carboxylase gene causes combined deficiency of all vitamin K-dependent blood coagulation factors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A missense mutation in gamma-glutamyl carboxylase gene causes combined
      deficiency of all vitamin K-dependent blood coagulation factors.
    explanation: The first reported GGCX mutation in VKCFD establishes GGCX as the causative gene for VKCFD1.
  - reference: PMID:39496305
    reference_title: "Clinical, Laboratory, and Molecular Characteristics of Inherited Vitamin K-Dependent Coagulation Factors Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients harboring defects in GGCX have VKCFD type 1, while those with

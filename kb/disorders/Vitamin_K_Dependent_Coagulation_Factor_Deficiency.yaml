- name: Undercarboxylation of non-hemostatic vitamin K-dependent proteins
  description: >-
    In VKCFD1, reduced gamma-carboxylation of non-hemostatic substrates such as
    matrix Gla protein (MGP), Gla-rich protein (GRP), and osteocalcin is
    associated with mineralization, skin, skeletal, cardiac, vascular, and ocular
    abnormalities. Markedly reduced GRP carboxylation correlates with skin laxity,
    but the substrate-to-phenotype mapping is not fully resolved.

      considered.
    explanation: Supports recombinant activated factor VII as an alternative therapy for VKCFD bleeding.

animal_models:
- species: Mouse (Mus musculus)
  genotype: Homozygous Ggcx-null (Ggcx-/-)
  category: Knockout
  genes:
  - preferred_term: GGCX
    term:
      id: hgnc:4247
      label: GGCX
  description: >-
    Approximately half of expected homozygous-null embryos survive to term, and
    those survivors die uniformly at birth from massive intra-abdominal
    hemorrhage. The model establishes an essential, nonredundant requirement for
    Ggcx in perinatal coagulation but is more severe than viable human
    hypomorphic VKCFD1.
  associated_phenotypes:
  - Partial embryonic loss
  - Perinatal lethality
  - Massive intra-abdominal hemorrhage
  evidence:
  - reference: PMID:17327402
    reference_title: "Fatal hemorrhage in mice lacking gamma-glutamyl carboxylase."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Analysis of a Ggcx(+/-) intercross revealed a partial developmental block
      with only 50% of expected Ggcx(-/-) offspring surviving to term, with the
      latter animals dying uniformly at birth of massive intra-abdominal
      hemorrhage.
    explanation: The knockout directly demonstrates developmental loss and fatal perinatal hemorrhage after complete Ggcx deficiency.

discussions:
- discussion_id: gap_vkcf1_nonhemostatic_substrate_mapping
  prompt: Which undercarboxylated non-hemostatic substrates drive each skin, skeletal, cardiovascular, and ocular VKCFD1 phenotype?
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: >-
    MGP undercarboxylation alone does not explain all skeletal disease, while
    markedly reduced GRP carboxylation correlates with skin laxity. The causal
    substrate and relevant cell type for each extra-hemostatic manifestation
    remain unresolved, so the graph deliberately stops at an association.
  attaches_to:
  - pathophysiology#Undercarboxylation of non-hemostatic vitamin K-dependent proteins
  proposed_experiments:
  - experiment_id: vkcf1_variant_substrate_cell_atlas
    name: Variant-resolved substrate carboxylation atlas in disease-relevant human cells
    description: >-
      Introduce representative GGCX variants into isogenic human dermal
      fibroblasts, chondrocytes, vascular smooth-muscle cells, and ocular cells;
      quantify MGP, GRP, osteocalcin, and additional Gla-protein carboxylation,
      then test wild-type GGCX rescue alongside cell-specific functional readouts.
    decision_criterion: >-
      A reproducible, cell-specific loss-and-rescue pattern links one or more

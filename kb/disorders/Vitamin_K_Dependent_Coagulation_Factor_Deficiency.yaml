genetic:
- name: GGCX pathogenic variants (VKCFD1)
  gene_term:
    preferred_term: GGCX
    term:
      id: hgnc:4247
      label: GGCX
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  subtype: VKCFD1
  notes: >-
    VKCFD1 results from biallelic point mutations in the gamma-glutamyl
    carboxylase gene (GGCX). The first reported example was a homozygous L394R
    missense variant in a consanguineous kindred.
  evidence:
  - reference: PMID:19141161
    reference_title: "Familial deficiency of vitamin K-dependent clotting factors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      VKCFD1, which is associated with point mutations in the
      gamma-glutamylcarboxylase gene (GGCX)
    explanation: Establishes GGCX point mutations as the genetic basis of VKCFD1.
  variants:
  - name: GGCX p.Leu394Arg (L394R) missense variant
    description: >-
      Homozygous GGCX missense variant in exon 9 at residue 394 (Leu->Arg); the
      first reported VKCFD-causing GGCX mutation, segregating recessively in a
      consanguineous kindred and reducing carboxylase activity ~threefold.
    evidence:
    - reference: PMID:9845520
      reference_title: "A missense mutation in gamma-glutamyl carboxylase gene causes combined deficiency of all vitamin K-dependent blood coagulation factors."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: All 4 patients were homozygous for a point mutation in exon 9
      explanation: Documents homozygosity for the exon 9 variant in all four affected family members without reproducing the abstract's internally reversed codon labels.
    - reference: PMID:9845520
      reference_title: "A missense mutation in gamma-glutamyl carboxylase gene causes combined deficiency of all vitamin K-dependent blood coagulation factors."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        The mutated carboxylase protein expressed in Drosophila cells was stable
        but demonstrated threefold reduced activity compared with WT carboxylase,
        confirming that the L394R mutation results in a defective carboxylase.
      explanation: Provides the source's explicit L394R designation and functional effect.
- name: VKORC1 pathogenic variants (VKCFD2)
  gene_term:
    preferred_term: VKORC1
    term:
      id: hgnc:23663
      label: VKORC1
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  subtype: VKCFD2
  notes: >-
    VKCFD2 results from biallelic missense variants in VKORC1. The same gene
    harbors distinct variants causing autosomal dominant coumarin (warfarin)
    resistance, illustrating allelic heterogeneity.
  evidence:
  - reference: PMID:14765194
    reference_title: "Mutations in VKORC1 cause warfarin resistance and multiple coagulation factor deficiency type 2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations in VKORC1 cause warfarin resistance and multiple coagulation
      factor deficiency type 2.
    explanation: Identifies VKORC1 missense mutations as the cause of VKCFD2 (multiple coagulation factor deficiency type 2).

biochemical:
- name: PIVKA-II / des-gamma-carboxy prothrombin
  presence: INCREASED
  context: >-
    Circulating protein induced by vitamin K absence or antagonism (PIVKA-II),
    also called des-gamma-carboxy prothrombin, is an undercarboxylated prothrombin
    biomarker. Abnormal levels can precede prolongation of prothrombin time, but
    they indicate impaired hepatic vitamin K use rather than uniquely proving
    inherited VKCFD.
  readouts:
  - target: Undercarboxylated, functionally defective coagulation factors
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      Increased undercarboxylated prothrombin reports defective vitamin
      K-dependent gamma-carboxylation upstream of the combined factor defect.
    evidence:
    - reference: PMID:39496305
      reference_title: "Clinical, Laboratory, and Molecular Characteristics of Inherited Vitamin K-Dependent Coagulation Factors Deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        PIVKA-II or DCP levels can thus be adopted as an indirect indicator of
        hepatic vitamin K status, and their abnormal levels precede any
        subsequent change in PT.
      explanation: >-
        The review identifies PIVKA-II/DCP as an early indirect readout of
        impaired hepatic vitamin K status.
  evidence:
  - reference: PMID:39496305
    reference_title: "Clinical, Laboratory, and Molecular Characteristics of Inherited Vitamin K-Dependent Coagulation Factors Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PIVKA-II or DCP levels can thus be adopted as an indirect indicator of
      hepatic vitamin K status, and their abnormal levels precede any subsequent
      change in PT.
    explanation: >-
      This directly supports PIVKA-II/DCP as a biochemical marker that may become
      abnormal before PT.
- name: Oxidized vitamin K response after supplementation
  presence: SUBTYPE_DEPENDENT
  context: >-
    After vitamin K supplementation, oxidized vitamin K remains typically
    undetectable in VKCFD1 but rises in VKCFD2. This response reflects the
    distinct GGCX versus VKORC1 defects and can support biochemical subtype
    discrimination alongside genotype confirmation.
  readouts:
  - target: Gamma-glutamyl carboxylase deficiency (VKCFD1)
    relationship: READOUT_OF
    direction: PRESENT_ABSENT
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      Oxidized vitamin K remaining undetectable after supplementation supports
      the VKCFD1 response pattern.
    evidence:
    - reference: PMID:39496305
      reference_title: "Clinical, Laboratory, and Molecular Characteristics of Inherited Vitamin K-Dependent Coagulation Factors Deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Oxidized vitamin K (KO) is typically undetectable in VKCFD type I, even
        after vitamin K supplementation, but in VKCFD type II, an increase in KO
        serum levels can be observed following VK supplementation.
      explanation: >-
        The subtype-specific post-supplementation absence pattern reports on the
        GGCX-deficient VKCFD1 mechanism.
  - target: Vitamin K epoxide reductase deficiency (VKCFD2)
    relationship: READOUT_OF
    direction: PRESENT_ABSENT
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      An increase in oxidized vitamin K after supplementation supports the
      VKCFD2 response pattern.
    evidence:
    - reference: PMID:39496305
      reference_title: "Clinical, Laboratory, and Molecular Characteristics of Inherited Vitamin K-Dependent Coagulation Factors Deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Oxidized vitamin K (KO) is typically undetectable in VKCFD type I, even
        after vitamin K supplementation, but in VKCFD type II, an increase in KO
        serum levels can be observed following VK supplementation.
      explanation: >-
        The subtype-specific post-supplementation increase pattern reports on
        the VKORC1-deficient VKCFD2 mechanism.
  evidence:
  - reference: PMID:39496305
    reference_title: "Clinical, Laboratory, and Molecular Characteristics of Inherited Vitamin K-Dependent Coagulation Factors Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Oxidized vitamin K (KO) is typically undetectable in VKCFD type I, even
      after vitamin K supplementation, but in VKCFD type II, an increase in KO
      serum levels can be observed following VK supplementation.
    explanation: >-
      The review directly describes the opposing post-supplementation KO response
      in VKCFD1 and VKCFD2.
diagnosis:
- name: PT/INR, aPTT, and plasma mixing study
  diagnosis_term:
    preferred_term: clinical laboratory procedure
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  description: >-
    Suspect a combined factor deficiency when both PT/INR and aPTT are prolonged
    and normalize on mixing with normal plasma, indicating factor deficiency
    rather than a circulating inhibitor.
  results: Prolonged PT/INR and aPTT with correction on plasma mixing
  markers: PT/INR and aPTT
  evidence:
  - reference: PMID:39496305
    reference_title: "Clinical, Laboratory, and Molecular Characteristics of Inherited Vitamin K-Dependent Coagulation Factors Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      First-line coagulation assays, prothrombin time/international normalized
      ratio (PT/INR) and activated partial thromboplastin time (aPTT), are both
      prolonged; mixing test typically normalizes the clotting times; and vitamin
      K-dependent coagulation factors will be variably decreased.
    explanation: The review defines the characteristic screening and mixing-study pattern.
- name: Vitamin K-dependent factor activity profile
  diagnosis_term:
    preferred_term: clinical laboratory procedure
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  description: >-
    Measure factors II, VII, IX, and X and the natural anticoagulants proteins C
    and S after a correcting mixing study. Variably reduced activity across the
    vitamin K-dependent panel supports VKCFD rather than a single-factor defect.
  results: Variably reduced factors II, VII, IX, and X and reduced proteins C and S
  markers: Factor II, VII, IX, and X activities; protein C and S activities
  evidence:
  - reference: PMID:19141161
    reference_title: "Familial deficiency of vitamin K-dependent clotting factors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Factors II, VII, IX, and X activity levels show variably reduced values
      (though usually quite low) that partially improve with vitamin K treatment
      of the patient.
    explanation: The clinical review defines the combined procoagulant-factor activity pattern.
  - reference: PMID:19141161
    reference_title: "Familial deficiency of vitamin K-dependent clotting factors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Proteins C, S, and Z activities are also reduced
    explanation: The clinical review documents reduced natural anticoagulant activity as part of the laboratory profile.
- name: GGCX and VKORC1 molecular genetic testing
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  description: >-
    Identify biallelic pathogenic variants in GGCX or VKORC1 to confirm inherited
    VKCFD and assign type 1 or type 2 after acquired causes have been excluded.
  results: Biallelic pathogenic variants in GGCX or VKORC1
  evidence:
  - reference: PMID:40541254
    reference_title: "Hereditary Combined Deficiency of the Vitamin K-Dependent Coagulation Factors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Timely and accurate diagnosis is essential to differentiate VKCFD from
      other genetic and acquired disorders, and genetic testing is required to
      identify the specific variant.
    explanation: The contemporary review requires molecular testing to define the causative variant.

differential_diagnoses:
- name: Acquired vitamin K deficiency
  disease_term:
    preferred_term: vitamin K deficiency
    term:
      id: MONDO:0001244
      label: vitamin K deficiency hemorrhagic disease
  description: >-
    Malabsorption, liver disease, warfarin or superwarfarin exposure, antibiotic
    effects, and neonatal vitamin K deficiency can produce the same prolonged
    clotting times and low vitamin K-dependent factors.
  distinguishing_features:
  - Exposure, nutritional, gastrointestinal, or hepatic context supports an acquired cause.
  - Persistent disease with biallelic GGCX or VKORC1 variants establishes inherited VKCFD.
  evidence:
  - reference: PMID:19141161
    reference_title: "Familial deficiency of vitamin K-dependent clotting factors."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Warfarin ingestion, malabsorption, and liver disease must be ruled out
    explanation: The clinical review explicitly identifies the principal acquired mimics that must be excluded.
- name: Circulating coagulation inhibitor or disseminated intravascular coagulation
  description: >-
    Inhibitors and severe disseminated intravascular coagulation can prolong both
    PT and aPTT, overlapping the initial coagulation screen.
  distinguishing_features:
  - Failure of PT and aPTT to correct on plasma mixing argues against VKCFD and for an inhibitor or another acquired coagulopathy.
  evidence:
  - reference: PMID:39496305
    reference_title: "Clinical, Laboratory, and Molecular Characteristics of Inherited Vitamin K-Dependent Coagulation Factors Deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      persistently prolonged PT and aPTT suggest inhibitors or acquired
      conditions like high titer lupus anticoagulant or severe disseminated
      intravascular coagulation.
    explanation: The diagnostic algorithm uses non-correction on mixing to separate these acquired coagulopathies from VKCFD.
- name: Other inherited single or combined coagulation factor deficiencies
  description: >-
    Hemophilia B, factor VII deficiency, combined factor II/X or VII/X
    deficiencies, and selected von Willebrand or factor V disorders can have an
    overlapping bleeding presentation.
  distinguishing_features:
  - VKCFD produces the combined II, VII, IX, and X pattern and is confirmed by biallelic GGCX or VKORC1 variants.
  evidence:
  - reference: PMID:39496305
    reference_title: "Clinical, Laboratory, and Molecular Characteristics of Inherited Vitamin K-Dependent Coagulation Factors Deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Other rare inherited bleeding disorders may mimic the
      clinical presentation of VFCKD and they should be kept in
      mind in differential diagnosis.
    explanation: The review explicitly places other inherited bleeding disorders in the VKCFD differential.

treatments:
- name: Vitamin K supplementation
  action_category: THERAPEUTIC
  description: >-
    High oral (or parenteral) doses of vitamin K are the primary treatment and
    prophylaxis, usually resulting in partial correction of the factor
    deficiency. Response depends on residual enzyme activity.
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Defective gamma-carboxylation of vitamin K-dependent proteins
    treatment_effect: RESTORES
    description: >-
      High-dose vitamin K can enhance residual gamma-carboxylation and partially
      improve factor activities; response is genotype-dependent.
    evidence:
    - reference: PMID:33590680
      reference_title: "GGCX mutations show different responses to vitamin K thereby determining the severity of the hemorrhagic phenotype in VKCFD1 patients."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        All GGCX mutations were categorized into responder and low responder
        mutations, thereby determining the efficiency of vitamin K
        supplementation.
      explanation: Variant-function assays demonstrate that residual GGCX response determines the degree of correction by vitamin K.
  treatment_term:
    preferred_term: nutritional supplementation
    term:
      id: NCIT:C15433
      label: Nutritional Support
    therapeutic_agent:
    - preferred_term: vitamin K1 (phylloquinone)
      term:
        id: CHEBI:18067
        label: phylloquinone
  evidence:
  - reference: PMID:19141161
    reference_title: "Familial deficiency of vitamin K-dependent clotting factors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Therapy includes high oral doses of vitamin K for prophylaxis, usually
      resulting in partial correction of factor deficiency
    explanation: Establishes high-dose vitamin K as the mainstay of VKCFD prophylaxis with partial response.
  - reference: PMID:33590680
    reference_title: "GGCX mutations show different responses to vitamin K thereby determining the severity of the hemorrhagic phenotype in VKCFD1 patients."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Most VKCFD1 patients have at least one vitamin K responsive GGCX allele
      that is able to γ-carboxylate clotting factors.
    explanation: Supports the common but non-universal response to high-dose vitamin K in GGCX-related VKCFD1.
- name: Tranexamic acid
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Antifibrinolytic therapy can be used as a single agent in milder disease or
    for minor surgery; it treats the bleeding endpoint rather than correcting
    the inherited carboxylation defect.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: tranexamic acid
      term:
        id: CHEBI:48669
        label: tranexamic acid
  evidence:
  - reference: PMID:39496305
    reference_title: "Clinical, Laboratory, and Molecular Characteristics of Inherited Vitamin K-Dependent Coagulation Factors Deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In milder forms or in minor
      surgery setting, tranexamic acid can be administered as
      single agent
    explanation: The contemporary review supports tranexamic acid for milder disease and minor procedures.
- name: Fresh frozen plasma transfusion
  action_category: THERAPEUTIC
  therapeutic_modality: PROTEIN_REPLACEMENT
  description: >-
    Transfusion of fresh frozen plasma is often required during surgery or in
    cases of severe bleeding to replace the deficient vitamin K-dependent factors.
  target_mechanisms:
  - target: Undercarboxylated, functionally defective coagulation factors
    treatment_effect: BYPASSES
    description: FFP supplies functional vitamin K-dependent coagulation factors, bypassing the patient's defective endogenous factors.
    evidence:
    - reference: PMID:40541254
      reference_title: "Hereditary Combined Deficiency of the Vitamin K-Dependent Coagulation Factors."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        with transfusions of fresh frozen plasma often required during surgery or
        in cases of severe bleeding.
      explanation: Clinical use of plasma supports replacement of the deficient factors during hemostatic challenge.
  treatment_term:
    preferred_term: Fresh Frozen Plasma Transfusion
    term:
      id: NCIT:C116475
      label: Fresh Frozen Plasma Transfusion
  evidence:
  - reference: PMID:40541254
    reference_title: "Hereditary Combined Deficiency of the Vitamin K-Dependent Coagulation Factors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      with transfusions of fresh frozen plasma often required during surgery or
      in cases of severe bleeding.
    explanation: Supports fresh frozen plasma transfusion for acute or perioperative bleeding in VKCFD.
- name: Prothrombin complex concentrate
  action_category: THERAPEUTIC
  therapeutic_modality: PROTEIN_REPLACEMENT
  description: >-
    Prothrombin complex concentrates (PCCs), which contain the vitamin
    K-dependent factors II, VII, IX and X, can be considered as a lower-volume
    alternative to plasma, although VKCFD-specific experience is limited.
  target_mechanisms:
  - target: Undercarboxylated, functionally defective coagulation factors
    treatment_effect: BYPASSES
    description: PCCs supply functional factors II, VII, IX and X, bypassing the patient's undercarboxylated endogenous factors.
    evidence:
    - reference: PMID:19141161
      reference_title: "Familial deficiency of vitamin K-dependent clotting factors."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Alternatively, so-called 4-factor prothrombin complex concentrates (PCCs),
        which contain factors II, VII, IX, and X and proteins C and S in variable
        amounts
      explanation: The factor composition supports direct replacement of the dysfunctional endogenous factors.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:40541254
    reference_title: "Hereditary Combined Deficiency of the Vitamin K-Dependent Coagulation Factors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      alternative therapies such as prothrombin complex concentrates (PCCs) or a
      combination of recombinant activated factor VII and vitamin K may be
      considered.
    explanation: Supports prothrombin complex concentrate as an alternative therapy for VKCFD bleeding.
  - reference: PMID:19141161
    reference_title: "Familial deficiency of vitamin K-dependent clotting factors."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Alternatively, so-called 4-factor prothrombin complex concentrates (PCCs),
      which contain factors II, VII, IX, and X and proteins C and S in variable
      amounts
    explanation: Defines four-factor PCC composition and its proposed VKCFD use.
- name: Recombinant activated factor VII (rFVIIa)
  action_category: THERAPEUTIC
  therapeutic_modality: PROTEIN_REPLACEMENT
  description: >-
    Recombinant activated factor VII (rFVIIa, eptacog alfa) may be combined with
    vitamin K in selected situations; VKCFD-specific experience is limited.
  target_mechanisms:

      explanation: Links VKORC1-dependent vitamin K recycling to the cofactor requirement for gamma-carboxylation.
- name: Gamma-glutamyl carboxylase deficiency (VKCFD1)
  description: >-
    In VKCFD1, biallelic GGCX variants reduce the activity of gamma-glutamyl
    carboxylase, the endoplasmic reticulum enzyme that carboxylates glutamate
    residues of vitamin K-dependent proteins. Functional studies implicate
    variant-dependent impairment of non-hemostatic substrates, but the mapping
    from individual substrate defects to the variable extra-hemostatic phenotype
    remains incomplete.
  gene:
    preferred_term: GGCX
    modifier: DECREASED

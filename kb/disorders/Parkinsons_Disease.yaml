    supports: SUPPORT
    snippet: "Depressive symptoms were similar across groups, but in prodromal PD, higher GDS scores were associated with worse UPDRS III scores (p = 0.02), as well as higher freezing and fall scores."
    explanation: This indicates depressive symptoms are present and clinically relevant in PD, supporting depression as a non-motor phenotype.
- name: REM Sleep Behavior Disorder
  category: Sleep
  notes: >-
    Prodromal non-motor feature that often precedes motor onset by years and
    correlates with greater motor severity.
  phenotype_term:
    preferred_term: REM sleep behavior disorder
    term:
      id: HP:5200291
      label: REM sleep behavior disorder
  evidence:
  - reference: PMID:41301797
    reference_title: "Non-Motor Symptoms as Markers of Disease Severity in Parkinson's Disease: Associations Between Constipation, Depression, REM Sleep Behavior Disorder, and Motor Impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Constipation and REM sleep behavioral disorder were independent correlates of worse motor severity in prodromal and established PD"
    explanation: >-
      This PPMI-cohort study establishes REM sleep behavior disorder as a
      non-motor feature of both prodromal and established Parkinson disease that
      independently correlates with greater motor severity.
- name: Cognitive Impairment
  category: Cognitive
  frequency: FREQUENT
  notes: >-
    Spans mild cognitive impairment (typically executive and visuospatial
    deficits) through to Parkinson disease dementia; the risk of dementia
    rises with disease duration.
  phenotype_term:
    preferred_term: Cognitive impairment
    term:
      id: HP:0100543
      label: Cognitive impairment
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:34210995
    reference_title: "Parkinson disease-associated cognitive impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In addition to the defining motor symptoms of PD, multiple non-motor symptoms occur; among them, cognitive impairment is common and can potentially occur at any disease stage."
    explanation: >-
      This Nature Reviews Disease Primers review establishes cognitive
      impairment as a common non-motor feature of PD that can occur at any
      disease stage.
  - reference: PMID:34210995
    reference_title: "Parkinson disease-associated cognitive impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "executive and visuospatial impairments are typical and can be accompanied by memory impairment, increasing the risk for early progression to dementia"
    explanation: >-
      Describes the mild-cognitive-impairment-to-dementia progression that
      underpins the progressive clinical course of cognitive impairment in PD.
- name: Dystonia
  category: Neurological
  notes: >
    Involuntary sustained or intermittent muscle contractions causing abnormal postures.
    When present in PD, dystonia is predominantly focal, most commonly affecting the lower
    limbs, followed by cervical involvement, and is associated with advanced Hoehn and Yahr
    stage (≥3), younger age at PD onset, and shorter disease duration. A population prevalence
    of dystonia in PD is not established by the cited case-control study, so no frequency band
    is asserted.
  phenotype_term:
    preferred_term: Dystonia
    term:
      id: HP:0001332
      label: Dystonia
  evidence:
  - reference: PMID:42430982
    reference_title: "Dystonia in Parkinson's disease: Clinical characteristics and predictors of treatment response."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Focal dystonia was the predominant phenotype (75.0%), most commonly involving lower limbs, followed by cervical dystonia."
    explanation: >
      This clinical study characterizes the somatotopic distribution of dystonia in PD,
      showing that focal dystonia is the predominant form and lower-limb involvement is most common.
  - reference: PMID:42430982
    reference_title: "Dystonia in Parkinson's disease: Clinical characteristics and predictors of treatment response."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Data on 246 PD patients (164 with and 82 without dystonia) were analyzed."
    explanation: >
      Describes the case-control study composition (164 PD patients with dystonia versus 82
      without, drawn from the same source population). The 164:82 split is the study's
      case:control sampling ratio, not a population prevalence, and does not by itself
      quantify how frequently dystonia occurs in PD.
  - reference: PMID:42430982
    reference_title: "Dystonia in Parkinson's disease: Clinical characteristics and predictors of treatment response."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "advanced H&Y stage ≥3 (OR, 3.61; P = 0.002) was directly associated with it."
    explanation: >-
      Establishes association between dystonia and advanced Hoehn and Yahr stage,
      supporting dystonia as a clinical marker of disease progression.
  - reference: PMID:42430982
    reference_title: "Dystonia in Parkinson's disease: Clinical characteristics and predictors of treatment response."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Levodopa dose increases improved dystonia in 51.6% of patients, and botulinum neurotoxin (BoNT) improved dystonia (OR, 3.01; P = 0.05)."
    explanation: >-
      Documents treatment response patterns for PD-associated dystonia, including
      efficacy of levodopa dose optimization and botulinum neurotoxin injection.
- name: Weight Loss
  category: Constitutional
  notes: >-
    Progressive unintentional weight loss is a well-recognized non-motor feature
    of Parkinson disease, arising from multiple interacting mechanisms (metabolic
    dysregulation, neuroendocrine/appetite-hormone disruption, gastrointestinal
    dysfunction, cognitive decline, and medication effects). It carries
    substantial morbidity and mortality.
  phenotype_term:
    preferred_term: Weight loss
    term:
      id: HP:0001824
      label: Weight loss
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:41781031
    reference_title: "When the Scale Drops: Pathways to Weight Loss in Parkinson's Disease and Future Directions."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "weight loss has long been observed in PD and other neurodegenerative disorders, yet the mechanisms remain incompletely understood. This limited mechanistic insight has left few treatment options for weight loss in PD."
    explanation: >-
      Establishes weight loss as a long-recognized non-motor symptom of Parkinson
      disease with substantial clinical impact.
stages:
- name: "Stage 1: Unilateral Disease"
  description: >
    Symptoms are present on one side of the body only. Mild unilateral involvement
    with minimal or no functional impairment. Patients may exhibit resting tremor,
    rigidity, or bradykinesia on one limb or side. Daily activities are not
    significantly affected.
  evidence:
  - reference: PMID:27918765
    reference_title: "Development of a Biochemical Diagnosis of Parkinson Disease by Detection of α-Synuclein Misfolded Aggregates in Cerebrospinal Fluid."
    supports: SUPPORT
    snippet: "the Hoehn and Yahr scale, with the lowest grade indicating unilateral involvement with minimal or no functional impairment"
    explanation: This describes Stage 1 (the lowest grade) as unilateral involvement with minimal or no functional impairment.
  - reference: PMID:34461264
    reference_title: "The cross-hemispheric nigrostriatal pathway prevents the expression of levodopa-induced dyskinesias."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Clinical findings indicate that LID typically only occurs following the progression of PD motor symptoms from the unilateral (Hoehn and Yahr (HY) Stage I) to the bilateral stage (HY Stage II)."
    explanation: This identifies Stage I as the unilateral phase of PD motor symptoms.
  notes: >
    Original Hoehn and Yahr staging scale from 1967 (PMID:6067254). A modified
    scale with 0.5 increments (Stages 1.5, 2.5) has been widely adopted but
    lacks formal clinimetric validation.
- name: "Stage 2: Bilateral Disease Without Balance Impairment"
  description: >
    Symptoms are present on both sides of the body or at the midline. Bilateral
    involvement without impairment of balance. Patients show bilateral tremor,
    rigidity, and bradykinesia but maintain normal postural reflexes and physical
    independence.
  evidence:
  - reference: PMID:34461264
    reference_title: "The cross-hemispheric nigrostriatal pathway prevents the expression of levodopa-induced dyskinesias."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Clinical findings indicate that LID typically only occurs following the progression of PD motor symptoms from the unilateral (Hoehn and Yahr (HY) Stage I) to the bilateral stage (HY Stage II)."
    explanation: This identifies Stage II as the bilateral stage of PD motor symptom progression.
  - reference: PMID:15372591
    reference_title: "Movement Disorder Society Task Force report on the Hoehn and Yahr staging scale: status and recommendations."
    supports: SUPPORT
    snippet: "the scale fulfills at least some criteria for reliability and validity, especially for the midranges of the scale (Stages 2-4)."
    explanation: The MDS Task Force report validates the reliability of midrange stages (2-4) of the Hoehn and Yahr scale.
- name: "Stage 3: Bilateral Disease With Postural Instability"
  description: >
    Mild to moderate bilateral disease with early postural instability. The first
    sign of impaired righting reflexes appears. Patients remain physically
    independent in daily activities but have clinically evident balance impairment.
  evidence:
  - reference: PMID:20181069
    reference_title: "Depression, extrapyramidal symptoms, dementia and an unexpected outcome: a case report."
    supports: SUPPORT
    snippet: "The modified Hoehn and Yahr scale was 3: mild to moderate bilateral disease; some postural instability; physically independent."
    explanation: This directly defines Stage 3 as mild to moderate bilateral disease with some postural instability while remaining physically independent.
  - reference: PMID:15372591
    reference_title: "Movement Disorder Society Task Force report on the Hoehn and Yahr staging scale: status and recommendations."
    supports: SUPPORT
    snippet: "Because the HY scale is weighted heavily toward postural instability as the primary index of disease severity, it does not capture completely impairments or disability from other motor features of PD and gives no information on nonmotor problems."
    explanation: This highlights that the Hoehn and Yahr scale weights postural instability as a primary severity index, providing context for why balance impairment becomes central at Stage 3.
- name: "Stage 4: Severe Disability, Still Ambulatory"
  description: >
    Fully developed, severely disabling disease. Patients remain ambulatory but
    have marked loss of independence in daily activities. More than half require
    assistance with most activities of daily living, despite retained ability to
    complete walk-based assessments.
  evidence:
  - reference: PMID:34125001
    reference_title: "Effect of Lee Silverman Voice Treatment (LSVT)® BIG on motor symptoms in a patient with severe Parkinson's disease: a case report."
    supports: SUPPORT
    snippet: "Her disease severity was classified as Hoehn and Yahr stage 4. The unified Parkinson's disease rating scale (UPDRS) part 3, 10-m walk test (10MWT), timed up-and-go test (TUG), Berg balance scale (BBS), and 30-s chair stand test (30-s CST) were used for assessment before and after intervention."
    explanation: This stage 4 case report shows that advanced patients can remain ambulatory enough to perform walk-based assessments despite severe motor impairment.
  - reference: PMID:40162911
    reference_title: "Profile of Independence in Activities of Daily Living Among Patients With Parkinson's Disease: A Retrospective Observational Study."
    supports: SUPPORT
    snippet: "In the H-Y Stage 4 group, more than half of the patients required assistance with most ADLs, except feeding and bowel control."
    explanation: This directly supports substantial dependence in daily activities as a defining functional feature of Stage 4 disease.
- name: "Stage 5: Wheelchair-Bound or Bedridden"
  description: >
    Patient is confined to wheelchair or bedridden unless aided. Complete
    dependence on caregivers for all activities. Represents the most severe
    stage of motor disability in Parkinson's disease.
  evidence:
  - reference: PMID:27918765
    reference_title: "Development of a Biochemical Diagnosis of Parkinson Disease by Detection of α-Synuclein Misfolded Aggregates in Cerebrospinal Fluid."
    supports: SUPPORT
    snippet: "the highest grade defining patients with complete confinement to wheelchair or bed."
    explanation: This directly defines Stage 5 (the highest grade) as complete confinement to wheelchair or bed.

    mapping_source: manual curation
    mapping_justification: >
      MONDO:0008199 (late-onset Parkinson disease, OMIM:168600, "PARK"/"LOPD";
      onset after ~age 50) is the common sporadic/idiopathic adult-onset form and
      a child of MONDO:0005180. This entry curates Parkinson disease at the broad
      MONDO:0005180 level, and its pathophysiology (α-synucleinopathy and
      dopaminergic neurodegeneration, SNCA/LRRK2/GBA1) substantively covers the
      late-onset form. Recorded as a narrowMatch so coverage tooling resolves
      MONDO:0008199 to this entry rather than flagging it as uncurated.

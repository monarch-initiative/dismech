name: Parkinson's Disease
creation_date: '2025-12-18T17:01:35Z'
description: >-
  Parkinson's disease is a progressive neurodegenerative movement disorder caused
  by the loss of dopaminergic neurons in the substantia nigra pars compacta,
  producing striatal dopamine deficiency and basal ganglia circuit dysfunction.
  It manifests as bradykinesia, resting tremor, rigidity, and postural instability,
  with non-motor features. The pathological hallmark is intraneuronal aggregation
  of misfolded alpha-synuclein (Lewy bodies), with mitochondrial dysfunction and
  oxidative stress contributing to neurodegeneration.
category: Complex
parents:
- Neurodegenerative Disease
- Movement Disorder

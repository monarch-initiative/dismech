    snippet: "A naturally occurring protective variant, R1398H, provides an alternative route for understanding how reduced disease risk may be achieved by tuning the regulatory GTPase domain rather than the kinase domain itself."
    explanation: Preprint demonstrates that GTPase domain tuning via protective R1398H variant may be a disease-modifying strategy, supporting the model that ROC domain conformational control is critical for LRRK2-related PD.

environmental:
- name: Pesticide Exposure
  exposure_term:
    preferred_term: exposure to pesticide
    term:
      id: ECTO:0000530
      label: exposure to pesticide
  influences_mechanisms:
  - target: Mitochondrial Dysfunction
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Rotenone is a complex I inhibitor, and complex I deficiency is what this
      node is built around, so in the animal model the exposure acts on the
      node with nothing in between. The directness is taken from that model
      and not from the human data, which is worth stating rather than leaving
      to inference: the human evidence here reaches only the association
      between pesticide exposure and developing the disease, and both items
      are graded partial for that reason. The same rat study also reproduced
      alpha-synuclein-containing nigral inclusions, which would support an
      edge into the aggregation node, but that arm is not drawn because rodent
      inclusion pathology would then be its only support.
    evidence:
    - reference: PMID:11100151
      reference_title: "Chronic systemic pesticide exposure reproduces features of Parkinson's disease."
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: "We report that chronic, systemic inhibition of complex I by the lipophilic pesticide, rotenone, causes highly selective nigrostriatal dopaminergic degeneration that is associated behaviorally with hypokinesia and rigidity"
      explanation: >-
        Names the pesticide, the complex I inhibition this node holds, and the
        nigrostriatal degeneration downstream of it. Rat work, so it carries
        the mechanism without establishing it in human disease.
    - reference: PMID:15177059
      reference_title: "Occupational and environmental risk factors for Parkinson's disease."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: "there is general agreement that smoking and exposure to pesticides affect the probability of developing PD."
      explanation: >-
        Review reporting general agreement that pesticide exposure affects the
        probability of developing the disease. It establishes the exposure at
        the level of the disease and says nothing about mitochondria.
  notes: Rotenone and paraquat linked to increased risk
  evidence:
  - reference: PMID:15177059
    reference_title: "Occupational and environmental risk factors for Parkinson's disease."
    supports: SUPPORT
    snippet: "there is general agreement that smoking and exposure to pesticides affect the probability of developing PD."
    explanation: This review supports pesticide exposure as an environmental factor influencing PD risk.
- name: Rural Living
  notes: Associated with pesticide/herbicide exposure
  evidence:
  - reference: PMID:15177059
    reference_title: "Occupational and environmental risk factors for Parkinson's disease."
    supports: PARTIAL
    snippet: "While clear links to rural living, dietary factors, exposure to metals, head injury, and exposure to infectious diseases during childhood have not been established, there is general agreement that smoking and exposure to pesticides affect the probability of developing PD."
    explanation: This review notes that clear links to rural living are not established, indicating mixed evidence for this risk factor.
- name: Head Trauma
  influences_mechanisms:
  - target: Dopaminergic Neuron Loss
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Traumatic brain injury raises later risk of the disease by about half
      again. Pointed at the core neuropathological lesion rather than at a
      mechanism node because no cited sentence follows the injury to any
      particular step: neuroinflammation is the usual proposal and this entry
      holds a node for it, but nothing here measures that route, so the
      intermediates stay unknown.
    evidence:
    - reference: PMID:36781627
      reference_title: "Traumatic brain injury and risk of Parkinson's disease: a meta-analysis."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "The risk ratio of TBI among PD and controls by a combination of 15 studies using a random-effect model was 1.48 (95% CI 1.22-1.74)."
      explanation: >-
        Meta-analysis of 15 studies giving a risk ratio of 1.48 for traumatic
        brain injury. It quantifies the exposure-disease association and not
        the neuronal loss this link targets.
  notes: Possible risk factor
  evidence:
  - reference: PMID:36781627
    reference_title: "Traumatic brain injury and risk of Parkinson's disease: a meta-analysis."
    supports: SUPPORT
    snippet: "The risk ratio of TBI among PD and controls by a combination of 15 studies using a random-effect model was 1.48 (95% CI 1.22-1.74)."
    explanation: This meta-analysis supports head trauma (TBI) as a risk factor for developing PD.

- name: PGC-1alpha Transcriptional Program Repression
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >
    Reduced activity of the PPARGC1A-encoded transcriptional coactivator
    PGC-1alpha downregulates the nuclear-encoded bioenergetic program it
    drives - mitochondrial biogenesis, respiratory-chain subunit expression,
    and antioxidant defenses - in nigral dopaminergic neurons. Two routes
    converge on this node. In the parkin-dependent route, loss of parkin E3
    ligase function allows its substrate PARIS (ZNF746) to accumulate and
    transcriptionally repress the PPARGC1A promoter. In sporadic disease,
    PGC-1alpha-responsive bioenergetic gene sets are already underexpressed
    in laser-captured human nigral dopaminergic neurons at subclinical
    stages, placing this lesion early in the cascade rather than as a
    terminal consequence of neuron loss. The therapeutic corollary is not
    symmetric: restoring PGC-1alpha rescues dopaminergic neurons in cellular
    models, but sustained supraphysiological expression is itself toxic to
    the nigrostriatal system (see the HUMAN_MODEL_MISMATCH discussion
    pd_pgc1a_therapeutic_window).

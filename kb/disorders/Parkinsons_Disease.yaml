discussions:
- discussion_id: pd_pgc1a_therapeutic_window
  prompt: >-
    Does restoring PGC-1alpha signaling protect nigral dopaminergic neurons in
    human Parkinson disease, given that rescue is seen in cellular models while
    sustained supraphysiological expression in the adult rat nigrostriatal
    system is itself dopaminergic-toxic?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#PGC-1alpha Transcriptional Program Repression
  - pathophysiology#Mitochondrial Dysfunction
  rationale: >-
    The direction of the human observation is not in doubt: PGC-1alpha-responsive
    bioenergetic genes are underexpressed in laser-captured human nigral neurons
    early in disease, and the repressor PARIS accumulates in human Parkinson
    disease brain. What does not transfer cleanly from model to patient is the
    therapeutic inverse. Cellular models show that activating PGC-1alpha blocks
    alpha-synuclein- and rotenone-induced dopaminergic loss, but AAV-mediated
    sustained overexpression in the adult rat nigrostriatal system selectively
    impairs dopaminergic function and, at higher levels, causes overt
    degeneration - and it does not rescue alpha-synuclein-induced degeneration.
    PGC-1alpha therefore behaves as a rheostat with an activation-level, cell-type,
    isoform and disease-stage dependence rather than as a monotonic neuroprotective
    switch, so a positive result in one model system cannot be read as evidence
    that pathway activation is protective in patients. Recording this as a
    HUMAN_MODEL_MISMATCH rather than a plain KNOWLEDGE_GAP is deliberate: the
    model evidence exists and is abundant on both sides; it is its translational
    validity, and specifically the existence and width of a therapeutic window,
    that is unresolved. This gap is shared with other neurodegenerative entries
    (Huntington disease, Alzheimer disease, amyotrophic lateral sclerosis) in
    which the same coactivator is implicated.
  proposed_experiments:
  - experiment_id: exp_pd_pgc1a_dose_response_nigrostriatal
    name: Dose-graded PGC-1alpha activation in nigrostriatal models
    description: >-
      Titrate PGC-1alpha activity across a graded range - from partial
      restoration toward physiological levels up to the supraphysiological
      levels used in the AAV overexpression studies - in human iPSC-derived
      midbrain dopaminergic neurons and in an in vivo nigrostriatal model,
      reading out respiratory-chain subunit expression, mitochondrial membrane
      potential, dopamine content and dopaminergic survival at each level.
    experiment_type:
      preferred_term: dose-response perturbation study
    decision_criterion: >-
      A therapeutic window exists if there is a contiguous range of PGC-1alpha
      activity in which bioenergetic readouts improve without loss of
      dopaminergic markers or dopamine content; the rheostat model predicts an
      inverted-U with toxicity at the high end, whereas a simple neuroprotective
      model predicts monotonic benefit.
  - experiment_id: exp_pd_pgc1a_target_engagement_biomarker
    name: Human target-engagement biomarker for PGC-1alpha modulation
    description: >-
      Establish and validate a measurable readout of PGC-1alpha pathway
      engagement in living patients - for example a peripheral or CSF
      transcriptional signature of the PGC-1alpha-responsive gene set benchmarked
      against the postmortem nigral signature - so that a trial of any
      PGC-1alpha-directed agent can distinguish target-engagement failure from
      mechanism failure.
    experiment_type:
      preferred_term: biomarker validation study
    decision_criterion: >-
      The biomarker is usable if it shifts dose-dependently with a known
      PGC-1alpha modulator and correlates with the nigral PGC-1alpha-responsive
      gene-set deficit; absent such a readout, a negative clinical trial cannot
      be interpreted as refuting the mechanism.
  evidence:
  - reference: PMID:22246294
    reference_title: "Sustained expression of PGC-1α in the rat nigrostriatal system selectively impairs dopaminergic function."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In the adult rat nigrostriatal system, adeno-associated virus (AAV)-mediated overexpression of PGC-1α induces the selective loss of dopaminergic markers and increases dopamine (DA) catabolism, leading to a reduction in striatal DA content."
    explanation: >-
      The in vivo counterexample to the cellular rescue result: sustained
      pathway activation is itself dopaminergic-toxic, which is what creates the
      translational uncertainty.
  - reference: PMID:22246294
    reference_title: "Sustained expression of PGC-1α in the rat nigrostriatal system selectively impairs dopaminergic function."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These results highlight the central role of PGC-1α in the function and survival of dopaminergic neurons and the critical need for maintaining physiological levels of PGC-1α activity."
    explanation: >-
      States the therapeutic-window requirement directly - benefit is
      conditional on activity level, not on activation per se.
  - reference: PMID:42430091
    reference_title: "The Role of PGC-1α in Neurodegenerative Diseases: Molecular Mechanisms, Translational Challenges, and Therapeutic Potential."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "These observations suggest that PGC-1α is not a simple neuroprotective switch, but a flexible regulatory hub whose therapeutic value depends on cell type, isoform profile, disease stage, and activation level."
    explanation: >-
      Cross-disease review framing that generalizes the mismatch beyond
      Parkinson disease and names the four context variables that determine
      whether modulation helps.
  notes: >-
    Raised from dismech issue #6114 ([kgap-scan:scope] PGC-1alpha-mediated
    neuroprotection), which asked whether the Parkinson, Alzheimer and
    amyotrophic lateral sclerosis entries should carry a PGC-1alpha node. The
    Huntington disease entry already curates the mHTT-driven PGC-1alpha
    repression chain; Alzheimer disease and amyotrophic lateral sclerosis remain
    uncurated for this mechanism.
- discussion_id: gap_pd_microbiome_causal_direction_body_first
  prompt: >-
    In body-first Parkinson disease, are gut microbiome dysbiosis and
    intestinal barrier/inflammatory changes causal triggers for enteric
    alpha-synuclein seeding, modifiers that amplify an already initiated
    synucleinopathy, or secondary consequences of autonomic gut dysfunction?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Gut Microbiome Dysbiosis
  - pathophysiology#Intestinal Inflammation and Barrier Dysfunction
  - pathophysiology#Enteric Alpha-Synuclein Seeding
  - pathophysiology#Vagal-Brainstem Alpha-Synuclein Propagation
  rationale: >-
    Cross-sectional human studies support PD-associated dysbiosis and elevated
    intestinal inflammatory/permeability markers, while animal studies support
    gut-to-brain alpha-synuclein propagation through the vagus nerve. The
    unresolved step is temporal and causal: whether dysbiosis or barrier
    dysfunction initiates enteric alpha-synuclein misfolding in humans, merely
    accelerates propagation, or appears after autonomic denervation has already
    altered gut physiology.
  proposed_experiments:
  - experiment_id: exp_pd_prodromal_microbiome_barrier_alpha_syn_longitudinal_cohort
    name: Prodromal microbiome-barrier alpha-synuclein longitudinal cohort
    description: >-
      Follow iRBD-, constipation-, and hyposmia-enriched prodromal cohorts with
      serial stool metagenomics, SCFA/metabolite profiling, fecal and serum
      calprotectin/zonulin, autonomic imaging, and standardized enteric
      alpha-synuclein biopsy assays before motor conversion.
    experiment_type:
      preferred_term: longitudinal prodromal multi-omics cohort study
    readouts:
    - name: Microbiome dysbiosis trajectory
      target: pathophysiology#Gut Microbiome Dysbiosis
      description: >
        Determine whether reproducible microbiome shifts precede, track with,
        or follow enteric alpha-synuclein and autonomic biomarker changes.
      assays:
      - preferred_term: shotgun metagenomic sequencing
      - preferred_term: fecal metabolomics
      direction: POSITIVE
    - name: Intestinal inflammation and barrier trajectory
      target: pathophysiology#Intestinal Inflammation and Barrier Dysfunction
      description: >
        Measure whether inflammatory and permeability markers rise before
        enteric alpha-synuclein detection and clinical conversion.
      assays:
      - preferred_term: calprotectin assay
      - preferred_term: zonulin assay
      direction: POSITIVE
    - name: Enteric alpha-synuclein seeding
      target: pathophysiology#Enteric Alpha-Synuclein Seeding
      description: >
        Track phosphorylated or aggregated alpha-synuclein in standardized
        enteric biopsies as a candidate initiating event.
      assays:
      - preferred_term: immunohistochemistry
      - preferred_term: alpha-synuclein seed amplification assay
      direction: POSITIVE
    decision_criterion: >-
      Microbiome and barrier changes would support a trigger model only if they
      reproducibly precede enteric alpha-synuclein positivity and autonomic
      denervation in converters; changes that follow autonomic dysfunction would
      support a consequence or modifier model.
    would_support:
    - pathophysiology#Gut Microbiome Dysbiosis
    - pathophysiology#Intestinal Inflammation and Barrier Dysfunction
    - pathophysiology#Enteric Alpha-Synuclein Seeding
  evidence:
  - reference: PMID:34220443
    reference_title: "Serum and Fecal Markers of Intestinal Inflammation and Intestinal Barrier Permeability Are Elevated in Parkinson's Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A causal relationship has not been established, but gut dysbiosis is prevalent in PD and may lead to intestinal inflammation and barrier dysfunction."
    explanation: >-
      The human marker study states the core causal-direction uncertainty
      motivating this knowledge gap.
  - reference: PMID:36332796
    reference_title: "Gut microbiome and Parkinson's disease: Perspective on pathogenesis and treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "However, it remains unclear how these mechanisms relate to sporadic PD, a more common form of PD."
    explanation: >-
      Review-level synthesis highlights uncertainty about how gut-related
      mechanisms map onto sporadic PD pathogenesis.
- discussion_id: gap_pd_variant_specific_isogenic_hpsc_mechanisms
  prompt: >-
    Which Parkinson disease risk and causal variants produce convergent
    dopaminergic-neuron mechanisms in a controlled human genetic background,
    and which phenotypes are variant-specific, modifier-dependent, or culture
    artifacts?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Dopaminergic Neuron Loss
  - pathophysiology#Alpha-Synuclein Aggregation
  - pathophysiology#Mitochondrial Dysfunction
  - pathophysiology#Autophagy-Lysosome Pathway Dysfunction
  rationale: >-
    Patient-derived iPSC comparisons are powerful but confounded by background
    genetic variation. Large WGS-QC'd isogenic hPSC panels, differentiated into
    midbrain dopaminergic neurons and phenotyped with imaging and sequencing,
    can separate variant-specific causal mechanisms from shared downstream
    neurodegenerative states.
  proposed_experiments:
  - experiment_id: exp_pd_automated_isogenic_hpsc_variant_panel
    name: Automated isogenic hPSC Parkinson variant panel
    description: >-
      Generate or extend a WGS-QC'd isogenic hPSC panel carrying high-risk or
      causal Parkinson disease alleles, differentiate lines into midbrain
      dopaminergic neurons, and benchmark variant-specific effects on
      alpha-synuclein handling, mitochondrial state, lysosomal function, and
      dopaminergic-neuron survival.
    experiment_type:
      preferred_term: high-throughput isogenic stem-cell perturbation experiment
    model_systems:
    - name: Genome-edited hPSC-derived midbrain dopaminergic neuron panel
      description: >-
        Isogenic human pluripotent stem cell collection carrying Parkinson
        disease variants, differentiated into disease-relevant dopaminergic
        neurons for mechanism-resolved phenotyping.
      experimental_model_type: IPSC_DERIVED_MODEL
      organism:
        preferred_term: human
        term:
          id: NCBITaxon:9606
          label: Homo sapiens
      cell_types:
      - preferred_term: midbrain dopaminergic neuron
        term:
          id: CL:0000700
          label: dopaminergic neuron
      publication: PMID:38405931
      notes: >-
        Designed to be compatible with automated hPSC genome-engineering and
        clonal QC workflows such as ATTIS-style high-throughput line generation.
    perturbations:
    - name: Parkinson disease variant editing
      target: pathophysiology#Dopaminergic Neuron Loss
      description: >
        Introduce or compare causal and high-risk Parkinson alleles in a shared
        genetic background.
      genes:
      - preferred_term: SNCA
        term:
          id: hgnc:11138
          label: SNCA
      - preferred_term: LRRK2
        term:
          id: hgnc:18618
          label: LRRK2
      - preferred_term: GBA1
        term:
          id: hgnc:4177
          label: GBA
      - preferred_term: PINK1
        term:
          id: hgnc:14581
          label: PINK1
      - preferred_term: PRKN
        term:
          id: hgnc:8607
          label: PRKN
    - name: Prime-editing generation or correction

- name: LRRK2 GTPase Domain Dysregulation
  description: >
    Leucine-rich repeat kinase 2 (LRRK2) mutations disrupt the conformational dynamics of its ROC
    (Ras of complex proteins) G-domain, impairing GTPase activity and nucleotide (GTP/GDP) cycling.
    The arginine residue at position 1398 acts as a critical GTP-γ-phosphate sensor that regulates
    the ROC domain's active-to-inactive state transition. Pathogenic ROC/GTPase-domain mutations
    (e.g., R1441C/G/H) impair GTP hydrolysis, stabilize the constitutively active GTP-bound state,
    and enhance Rab29-dependent recruitment of LRRK2 to the trans-Golgi network. This dysregulation
    impairs vesicular trafficking, autophagosome-lysosome fusion, and clearance of alpha-synuclein
    aggregates, promoting neurodegeneration. Protective variants (e.g., R1398H) stabilize the
    GDP-bound inactive state and reduce disease risk, suggesting that GTPase domain normalization
    rather than kinase inhibition may be a disease-modifying therapeutic strategy.

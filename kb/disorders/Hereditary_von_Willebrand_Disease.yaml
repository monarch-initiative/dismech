- name: Type 2N von Willebrand Disease
  subtype_term:
    preferred_term: von Willebrand disease type 2N
    term:
      id: MONDO:0015631
      label: von Willebrand disease type 2N
  description: >-
    Defect in von Willebrand factor binding to factor VIII. Because factor VIII
    is cleared rapidly when it is not bound to von Willebrand factor, factor VIII
    activity is low while von Willebrand factor antigen is disproportionately
    higher, and the presentation resembles mild to moderate hemophilia A.
  genes:
  - preferred_term: VWF
    term:
      id: hgnc:12726
      label: VWF
  inheritance:
  - name: Autosomal recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
    description: >-
      Type 2N requires biallelic VWF variants; heterozygous relatives are often
      asymptomatic.
    evidence:
    - reference: PMID:20301765
      reference_title: "Von Willebrand Disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Type 2N and type 3 VWD are caused by biallelic VWF variants and inherited in an autosomal recessive manner."
      explanation: The GeneReviews chapter assigns autosomal recessive inheritance and biallelic VWF variants to type 2N.
    - reference: PMID:20301765
      reference_title: "Von Willebrand Disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Heterozygous sibs of an individual with type 2N VWD are often asymptomatic; however, a small proportion of these heterozygous individuals may have some mild bleeding symptoms and lower factor VIII levels and may be diagnosed with VWD."
      explanation: Sources the statement about heterozygous relatives in this block's description.
  evidence:
  - reference: PMID:33497541
    reference_title: "Von Willebrand disease type 2N: An update."
    supports: SUPPORT
    snippet: "Type 2N VWD is an uncommon recessive disorder that results from gene mutations located in the region coding for the binding site of VWF for factor VIII (FVIII)."
    explanation: The abstract describes type 2N as a qualitative defect affecting FVIII binding.
  - reference: PMID:33497541
    reference_title: "Von Willebrand disease type 2N: An update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Although other VWF-dependent functions like binding to platelets and collagen are preserved, FVIII plasma levels are low due to the rapid clearance of this moiety in the absence or reduction of its binding to VWF."
    explanation: Sources the consequence recorded in this row's description, that unbound factor VIII is cleared rapidly and its plasma level falls while the other von Willebrand factor functions are intact.
  - reference: PMID:33497541
    reference_title: "Von Willebrand disease type 2N: An update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The diagnosis of type 2N should be considered in patients with low FVIII coagulant activity (FVIII:C) and disproportionally higher VWF antigen, especially when they present with an autosomal recessive pattern of inheritance."
    explanation: Sources the laboratory pattern in this row's description, low factor VIII activity against a disproportionately higher von Willebrand factor antigen.

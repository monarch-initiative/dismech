disease_term:
  preferred_term: hereditary von Willebrand disease
  term:
    id: MONDO:0019565
    label: hereditary von Willebrand disease
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0024574
      label: von Willebrand disease (hereditary or acquired)
    mapping_predicate: skos:broadMatch
    mapping_source: MONDO
    mapping_justification: >-
      This entry previously bound MONDO:0024574 as its `disease_term`. MONDO
      defines that class as a "Hereditary or acquired coagulation disorder
      characterized by a qualitative or quantitative deficiency of the von
      Willebrand factor", and its two children are MONDO:0019565 hereditary von
      Willebrand disease and MONDO:0020460 acquired von willebrand syndrome. An
      entry scoped to the hereditary disease therefore asserted identity with a
      class that also covers the acquired syndrome, so the primary binding is
      MONDO:0019565 and the class spanning both is recorded here as a broader
      cross-reference rather than as an exact match.
description: >-
  Hereditary von Willebrand disease is an inherited bleeding disorder caused by
  quantitative or qualitative defects in von Willebrand factor.
notes: >-
  Scope of the bound MONDO class. MONDO:0019565 is the exact class for this
  entry's name, and it contains the four VWF types curated here. Two of its other
  children sit outside that scope. MONDO:0008332 platelet-type von Willebrand
  disease is defined by MONDO as "A bleeding disorder caused by a variation in
  the GP1BA gene" that raises the affinity of the platelet receptor for von
  Willebrand factor, so it is a platelet-receptor disease rather than a VWF
  disease, and MONDO's own record for it opens with the editor note "check
  relationship to vWD". MONDO:0010756 Von Willebrand disease, X-linked form
  carries no
  definition and no causal-gene axiom in MONDO, so there is nothing in the record
  to place it against. Neither is curated here.
prevalence:
- population: General population screening cohorts
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 1000.0
  percentage: 1
  notes: >-
    Epidemiologic screening studies suggest roughly 1% prevalence, whereas
    clinically recognized disease captured by registries or treatment centers is
    much lower.
  evidence:
  - reference: PMID:22102186
    reference_title: "Von Willebrand disease: local diagnosis and management of a globally distributed bleeding disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "VWD prevalence data varies according to methodology used, with epidemiological/population screening estimates approximating 1% of the population (or 10,000 cases per million population), several orders of magnitude higher than estimates from bleeding disorders registry data or regional/center analysis (which instead range from <1 to ~450 cases per million population)."
    explanation: Review abstract distinguishes screening prevalence from clinically recognized prevalence and quantifies both.

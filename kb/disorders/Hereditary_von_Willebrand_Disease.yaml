pathophysiology:
- name: Von Willebrand Factor Deficiency or Dysfunction
  description: >-
    Deficiency or qualitative defects of von Willebrand factor impair primary
    hemostasis and predispose to mucocutaneous bleeding.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: VWF
    term:
      id: hgnc:12726
      label: VWF
  evidence:
  - reference: PMID:21289515
    reference_title: "von Willebrand disease."
    supports: SUPPORT
    snippet: "von Willebrand disease is a common inherited bleeding disorder characterized by excessive mucocutaneous bleeding."
    explanation: The abstract characterizes von Willebrand disease as an inherited bleeding disorder.
  downstream:
  - target: Epistaxis
    causal_link_type: DIRECT
    description: Impaired von Willebrand factor-dependent primary hemostasis produces mucosal bleeding including epistaxis.
  - target: Easy Bruising
    causal_link_type: DIRECT
    description: Defective primary hemostasis increases bruising susceptibility.
  - target: Menorrhagia
    causal_link_type: DIRECT
    description: Mucocutaneous bleeding tendency can manifest as heavy menstrual bleeding.
  - target: Oral Cavity Bleeding
    causal_link_type: DIRECT
    description: The same failure of primary hemostasis produces bleeding from the mucosal surfaces of the mouth.
  - target: Gastrointestinal Bleeding
    causal_link_type: DIRECT
    description: Impaired primary hemostasis at gastrointestinal mucosal surfaces produces gastrointestinal bleeding.
  - target: Prolonged Bleeding After Surgery
    causal_link_type: DIRECT
    description: A surgical wound is a hemostatic challenge that deficient or dysfunctional von Willebrand factor cannot meet, so bleeding is prolonged.
  - target: Prolonged Bleeding After Dental Extraction
    causal_link_type: DIRECT
    description: Dental extraction is a hemostatic challenge that deficient or dysfunctional von Willebrand factor cannot meet, so bleeding is prolonged.
  - target: Postpartum Hemorrhage
    causal_link_type: DIRECT
    description: Childbirth is a hemostatic challenge, and deficient or dysfunctional von Willebrand factor leaves the postpartum hemostatic response inadequate.
  - target: Joint Bleeding
    causal_link_type: DIRECT
    description: At the severe end of the disease the bleeding tendency extends past mucocutaneous sites into joints and soft tissues.

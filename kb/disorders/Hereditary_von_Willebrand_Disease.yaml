datasets:
- accession: geo:GSE195695
  title: Inspecting VWF gene deep intronic region and in-depth study of the endothelial colony-forming cells to identify an underlying pathogenic molecular mechanism in a type 3 VWD patient
  description: A type 3 von Willebrand disease (VWD) index patient (IP) remains mutation-negative after completion of conventional diagnostic analysis, including multiplex ligation-dependent probe amplification and sequencing of the promotor, exons, and flanking intronic regions of VWF gene (VWF). In this study, we intended to elucidate causitive genetic defect through screening of the whole VWF (including complete intronic region), mRNA analysis, and study of the patient-derived endothelial colony-forming cells (ECFCs). The entire VWF was analyzed by next-generation sequencing (NGS) on an Illumina platform. The NGS revealed a novel variant in VWF intron 8 (997+118 T>G).
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  data_type: BULK_RNA_SEQ
  sample_count: 6
  publication: PMID:35328514
  notes: Identified by GEO DataSets index search for Hereditary von Willebrand Disease (scripts/discover_datasets.py); accession and metadata verified against NCBI E-utilities on 2026-08-01. Title, sample count, and organism are GEO's own values.
- accession: geo:GSE161715
  title: Multifaceted Pathomolecular Mechanism of a VWF Large Deletion Involved in the Pathogenesis of Severe VWD
  description: An in-frame heterozygous large deletion of exons 4-34 of the von Willebrand factor (VWF) gene was identified in an index patient (IP) with type 3 von Willebrand disease (VWD), as the only mutation. The IP exhibited severe bleeding episodes despite prophylaxis treatment, with a short VWF half-life after infusion of VWF/FVIII concentrates. This study intends to elucidate the causal molecular mechanism of this large deletion. Transcript analysis confirmed transcription of normal VWF mRNA besides an aberrant deleted transcript. The amount of secreted VWF from blood outgrowth endothelial cells (BOECs) isolated from the IP was not significantly different from that of controls.

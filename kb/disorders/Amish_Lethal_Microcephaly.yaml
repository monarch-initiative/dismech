- name: Mitochondrial Thiamine Pyrophosphate Depletion
  biological_scale: CELLULAR
  description: >-
    With the importer nearly inactive, the mitochondrial matrix is depleted of
    ThPP. Patient cells retain some ThPP, unlike null mouse cells, which is
    consistent with p.Gly177Ala being a severe but not complete loss of
    function. ThPP is the cofactor of the E1 subunits of the mitochondrial
    2-oxoacid dehydrogenases.

discussions:
- discussion_id: alm_null_mouse_vs_hypomorphic_human
  prompt: >-
    Does the Slc25a19 null mouse, which dies at mid-gestation with a neural-tube
    defect, tell us how partial ThPP depletion causes congenital microcephaly
    and a smooth cortex in humans?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired Prenatal Central Nervous System Development
  - animal_models#Mouse
  rationale: >-
    The mouse reproduces the biochemical lesion (ThPP depletion and
    2-oxoglutarate accumulation) but, as a complete null, dies by embryonic day
    12, before cortical neurogenesis. Patients carry a hypomorphic allele with
    residual mitochondrial ThPP and survive to birth with a brain that stopped
    developing at about mid-gestation. The neural phenotype of the model
    (neural-tube closure failure) is therefore not the human one, and the
    cellular route from cofactor deficiency to failed cortical growth remains
    untested in any model.
  evidence:
  - reference: PMID:17035501
    reference_title: "Knockout of Slc25a19 causes mitochondrial thiamine pyrophosphate depletion, embryonic lethality, CNS malformations, and anemia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These animals had 100% prenatal lethality by embryonic day 12.
    explanation: >-
      Embryonic lethality of the null model.
  - reference: PMID:12376931
    reference_title: "Amish lethal microcephaly: a new metabolic disorder with severe congenital microcephaly and 2-ketoglutaric aciduria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cranial magnetic resonance imaging of a single patient showed a smooth,
      immature brain similar to that of a 20-week fetus except for a moderate
      degree of cerebellar vermal hypoplasia.
    explanation: >-
      The human brain phenotype that the null model cannot reach.
  proposed_experiments:
  - experiment_id: slc25a19_g177a_knockin_corticogenesis
    experiment_design: TARGETED_PERTURBATION
    name: Slc25a19 p.Gly177Ala knock-in or human cortical organoid model
    description: >-
      Introduce the founder p.Gly177Ala allele into mouse, or into human iPSC
      cortical organoids, and measure mitochondrial ThPP, 2-oxoglutarate
      dehydrogenase flux, neural progenitor proliferation and cortical size,
      with and without high-dose thiamine.
- discussion_id: alm_thiamine_untested
  prompt: >-
    Does high-dose thiamine, recommended for SLC25A19 deficiency as a whole,
    benefit infants with Amish lethal microcephaly?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - treatments#Thiamine Supplementation
  rationale: >-
    The thiamine recommendation rests on THMD4 cases, in which development is
    normal before episodic striatal injury. In Amish lethal microcephaly the
    carrier has negligible transport activity and the brain malformation is
    established before birth, so any benefit would be expected mainly against
    postnatal metabolic crises. No treated patient has been reported.
  evidence:
  - reference: PMID:31095747
    reference_title: "Genetic defects of thiamine transport and metabolism: A review of clinical phenotypes, genetics, and functional studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In SLC25A19 and TPK1 defects, thiamine has also led to clinical
      stabilization in single cases.
    explanation: >-
      The treated SLC25A19 experience is limited to single cases.
- discussion_id: alm_vs_thmd4_genotype_phenotype
  prompt: >-
    Why does p.Gly177Ala cause a prenatal brain-growth failure while other
    SLC25A19 variants spare development and cause THMD4?
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - pathophysiology#SLC25A19 Thiamine Pyrophosphate Carrier Deficiency
  rationale: >-
    Both phenotypes deplete mitochondrial ThPP, but they differ in timing and
    tissue: congenital microcephaly with organic aciduria here, and episodic
    striatal necrosis with polyneuropathy in an otherwise normal child in
    THMD4. One proposal is that the alleles differ in how well the carrier
    structure tolerates them. The alleles have been compared in the same
    expression system only for uptake and abundance.
  evidence:
  - reference: PMID:19798730
    reference_title: "SLC25A19 mutation as a cause of neuropathy and bilateral striatal necrosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      An SLC25A19 mutation was previously reported in Amish congenital lethal
      microcephaly but the present patients' phenotype is markedly different,
      with normal head circumference, normal early childhood development,
      age-appropriate cognitive skills, and normal urinary organic acid profile.
    explanation: >-
      Contrasts the THMD4 phenotype with Amish lethal microcephaly.
  - reference: PMID:31506564
    reference_title: "Functional analysis of the third identified SLC25A19 mutation causative for the thiamine metabolism dysfunction syndrome 4."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The milder symptoms reported for THMD4 in comparison to the Amish
      microcephaly might suggest that the some aminoacidic changes are better
      tolerated in hMTPPT structure.
    explanation: >-
      States the allele-severity hypothesis.

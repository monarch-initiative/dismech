      responded to treatment with a high fat diet.
    explanation: >-
      Response of crisis lactic acidosis to a high-fat diet in one patient.
  target_mechanisms:
  - target: Lactic Acidosis
    description: >-
      Reported to correct the lactic acidosis of crises; the mechanism of the
      response was not studied.
- name: Thiamine Supplementation
  description: >-
    GeneReviews recommends oral thiamine (400-600 mg daily, increased during
    febrile illness or decompensation) for SLC25A19 deficiency as a whole. The
    reports of benefit come from THMD4, in which high-dose thiamine prevents
    acute episodes; no report of thiamine treatment in a patient with Amish
    lethal microcephaly was found (see notes). Whether thiamine can raise
    mitochondrial ThPP through a carrier with negligible residual activity, or
    affect a brain malformation that is established before birth, is untested.
  notes: >-
    Searched on 2026-10-29: PubMed "Amish lethal microcephaly" (7 records) and
    "Amish microcephaly" (9 records), and Europe PMC ("Amish microcephaly" OR
    "Amish lethal microcephaly") AND thiamine (49 records). None reports a
    patient with this phenotype treated with thiamine; the treated SLC25A19
    patients in these results have the THMD4 phenotype.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: thiamine
      term:
        id: CHEBI:18385
        label: thiamine(1+)
  evidence:
  - reference: PMID:20301539
    reference_title: "SLC25A19-Related Thiamine Metabolism Dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Targeted therapy: Oral thiamine treatment (400-600 mg daily) starting at
      diagnosis.
    explanation: >-
      GeneReviews management recommendation for SLC25A19 deficiency, including
      this phenotype.
  - reference: PMID:20301539
    reference_title: "SLC25A19-Related Thiamine Metabolism Dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Thiamine dose must be increased (by 25%) during febrile illness, surgery,
      or acute decompensation.
    explanation: >-
      GeneReviews dose adjustment during illness, the setting in which the
      metabolic crises of this phenotype occur.
  - reference: PMID:33544541
    reference_title: "SLC25A19 deficiency and bilateral striatal necrosis with polyneuropathy: a new case and review of the literature."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Acute episodes are prevented by high-dose thiamine treatment (600
      mg/day).
    explanation: >-
      Thiamine response in the non-Amish (THMD4) phenotype; evidence for this

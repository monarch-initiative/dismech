- name: Illness-Triggered Acute Metabolic Decompensation
  biological_scale: ORGANISM
  conforms_to: metabolic_intoxication_decompensation#Acute Metabolic Decompensation
  description: >-
    During otherwise minor viral illnesses the infants develop metabolic
    acidosis, with severe lactic acidosis, that can be fatal; this is the usual

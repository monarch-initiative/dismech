  variants:
  - name: c.530G>C (p.Gly177Ala)
    description: >-
      Founder missense variant, homozygous in every reported patient. Gly177 is
      a highly conserved residue in the second signature motif of the
      mitochondrial carrier family. In reconstituted proteoliposomes the mutant

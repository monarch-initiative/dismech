- name: Impaired Prenatal Central Nervous System Development
  biological_scale: TISSUE
  description: >-
    Brain growth fails before birth: microcephaly is visible on ultrasound by
    21 weeks of gestation and the neonatal brain is smooth and immature,
    resembling a 20-week fetal brain, with cerebellar vermis hypoplasia and,
    in one patient, partial agenesis of the corpus callosum and a closed spinal
    dysraphism. The null mouse has a neural-tube closure defect, and knockdown
    of Slc25a19 in cultured rat neurons reduces dendritic growth. How cofactor
    deficiency disrupts human brain development has not been shown.

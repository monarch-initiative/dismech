animal_models:
- name: Slc25a19 knockout mouse
  species: Mouse
  genotype: Slc25a19(-/-)
  publication: PMID:17035501
  description: >-
    Constitutive Slc25a19 knockout. Homozygous embryos have no detectable
    mitochondrial ThPP, elevated 2-oxoglutarate in amniotic fluid, a
    neural-tube closure defect and yolk-sac erythropoietic failure, and all die
    by embryonic day 12. As a complete null it is more severe than the human
    hypomorphic genotype and dies before cortical neurogenesis, so it cannot
    show microcephaly.
  modeled_mechanisms:
  - target: Mitochondrial Thiamine Pyrophosphate Depletion
    relationship: RECAPITULATES
    fidelity: MODERATE
    limitations: >-
      ThPP is undetectable in null mitochondria but only markedly reduced in
      patient cells, so the mouse models a more complete depletion than the
      human disease.
    evidence:
    - reference: PMID:17035501
      reference_title: "Knockout of Slc25a19 causes mitochondrial thiamine pyrophosphate depletion, embryonic lethality, CNS malformations, and anemia."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        The mitochondria of Slc25a19(-/-) and MCPHA cells have undetectable and
        markedly reduced ThPP content, respectively.
      explanation: >-
        Mitochondrial ThPP depletion in the null model and in patient cells.
  - target: 2-Oxoglutarate Dehydrogenase Complex Dysfunction
    relationship: RECAPITULATES
    fidelity: MODERATE
    limitations: >-
      Shown indirectly, through elevated amniotic-fluid 2-oxoglutarate in
      embryos, rather than by enzyme measurement in situ.
    evidence:
    - reference: PMID:17035501
      reference_title: "Knockout of Slc25a19 causes mitochondrial thiamine pyrophosphate depletion, embryonic lethality, CNS malformations, and anemia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Affected embryos at embryonic day 10.5 have a neural-tube closure defect
        with ruffling of the neural fold ridges, a yolk sac erythropoietic
        failure, and elevated alpha-ketoglutarate in the amniotic fluid.
      explanation: >-
        Elevated 2-oxoglutarate reproduces the human biochemical marker.

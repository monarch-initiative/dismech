name: Amish Lethal Microcephaly
creation_date: "2026-10-29T03:40:00Z"
description: >-
  Amish lethal microcephaly is an autosomal recessive inborn error of
  mitochondrial cofactor transport described in the Old Order Amish of Lancaster
  County, Pennsylvania, where it reaches an incidence of at least 1 in 500
  births. Affected infants are born with severe microcephaly that is already
  visible on mid-gestation ultrasound and a smooth, immature-appearing brain,
  and most die within the first year, often during a metabolic acidosis
  precipitated by an ordinary viral illness. The biochemical marker is
  2-oxoglutaric (alpha-ketoglutaric) aciduria. All patients reported so far are
  homozygous for one founder missense variant in SLC25A19, c.530G>C
  (p.Gly177Ala). SLC25A19 was first reported as a mitochondrial deoxynucleotide
  carrier, but knockout and transport studies showed it is the inner-membrane
  importer of thiamine pyrophosphate (ThPP), the cofactor of the
  2-oxoglutarate dehydrogenase complex and the other mitochondrial 2-oxoacid
  dehydrogenases. The variant leaves the carrier correctly targeted but nearly
  inactive, so mitochondrial ThPP falls and 2-oxoglutarate dehydrogenase fails
  in situ, which accounts for the aciduria and, presumably, for the failure of
  prenatal brain growth.
synonyms:
- MCPHA
- Amish microcephaly
- microcephaly, Amish type
category: Mendelian
parents:
- Thiamine Metabolism Dysfunction Syndrome
- Microcephaly
disease_term:
  preferred_term: Amish lethal microcephaly
  term:
    id: MONDO:0011790
    label: Amish lethal microcephaly
notes: >-
  Relationship to thiamine metabolism dysfunction syndrome 4 (THMD4; bilateral
  striatal necrosis and progressive polyneuropathy, OMIM 613710). THMD4 is also
  caused by biallelic SLC25A19 variants, and the GeneReviews chapter treats the
  two as phenotypes of a single disorder, SLC25A19 deficiency. They are curated
  as separate entries here. MONDO and OMIM keep them as distinct diseases, and
  their pathographs differ: Amish lethal microcephaly is a congenital failure of
  brain growth with organic aciduria and infantile death, whereas THMD4
  patients have normal head circumference, normal early development, normal
  urine organic acids and episodic, fever-associated striatal necrosis with a
  chronic axonal neuropathy. The THMD4 mechanism (episodic encephalopathy in a
  previously normal brain) is not true of this disease, so THMD4 cannot be a
  subtype of this entry. A gene-named grouping is the right container if the
  two are later unified.


  A GeneReviews chapter exists (SLC25A19-Related Thiamine Metabolism
  Dysfunction) and is the phenotype baseline. Its management recommendations
  (oral thiamine, valproate avoidance) are written for SLC25A19 deficiency as a
  whole; the published treatment experience behind them comes from THMD4.


  SLC25A19 was named the deoxynucleotide carrier (DNC) when the gene was
  identified, and the 2002 gene-discovery paper interpreted the disease as a
  failure of deoxynucleotide import. That interpretation has been withdrawn:
  Slc25a19 null mice have normal mitochondrial nucleotide pools and the
  reconstituted protein transports ThPP.

pathophysiology:
- name: SLC25A19 Thiamine Pyrophosphate Carrier Deficiency
  biological_scale: MOLECULAR
  description: >-
    SLC25A19 is the mitochondrial inner-membrane carrier that imports thiamine
    pyrophosphate, which is synthesised only in the cytosol. The homozygous
    p.Gly177Ala variant leaves a carrier with negligible transport activity in
    reconstituted vesicles and reduced abundance in cells. The gene-discovery
    paper measured deoxynucleotide transport and concluded that the carrier
    imports deoxynucleotides; the knockout study later showed that nucleotide
    pools are normal without the carrier and that its substrate is ThPP.
  genes:
  - preferred_term: SLC25A19
    term:
      id: hgnc:14409
      label: SLC25A19
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    description: >-
      Homozygous germline SLC25A19 c.530G>C (p.Gly177Ala), an Old Order Amish
      founder allele.
  molecular_functions:
  - preferred_term: thiamine pyrophosphate transmembrane transporter activity
    term:
      id: GO:0090422
      label: thiamine pyrophosphate transmembrane transporter activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: mitochondrial thiamine pyrophosphate transmembrane transport
    term:
      id: GO:1990545
      label: mitochondrial thiamine pyrophosphate transmembrane transport
    modifier: DECREASED
  cellular_components:
  - preferred_term: mitochondrial inner membrane
    term:
      id: GO:0005743
      label: mitochondrial inner membrane
  evidence:
  - reference: PMID:17035501
    reference_title: "Knockout of Slc25a19 causes mitochondrial thiamine pyrophosphate depletion, embryonic lethality, CNS malformations, and anemia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We identified thiamine pyrophosphate (ThPP) transport as a candidate
      function of SLC25A19 through homology searching and confirmed it by using
      transport assays of the recombinant reconstituted protein.
    explanation: >-
      Establishes ThPP as the transported substrate of SLC25A19.
  - reference: PMID:17035501
    reference_title: "Knockout of Slc25a19 causes mitochondrial thiamine pyrophosphate depletion, embryonic lethality, CNS malformations, and anemia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We found that these animals have normal mitochondrial ribo- and
      deoxyribonucleoside triphosphate levels, suggesting that transport of
      these molecules is not the primary role of SLC25A19.
    explanation: >-
      Normal nucleotide pools in null mice argue against the original
      deoxynucleotide-carrier interpretation.
  - reference: PMID:12185364
    reference_title: "Mutant deoxynucleotide carrier is associated with congenital microcephaly."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Functional analysis shows that the mutant DNC protein lacks the normal
      transport activity, implying that failed deoxynucleotide transport across
      the inner mitochondrial membrane causes MCPHA.
    explanation: >-
      The mutant carrier lacks transport activity. The substrate named here,
      deoxynucleotides, was later reassigned to ThPP; the loss of carrier
      activity is the part of this result that stands.
  - reference: PMID:35304818
    reference_title: "Mitochondrial transport and metabolism of the vitamin B-derived cofactors thiamine pyrophosphate, coenzyme A, FAD and NAD(+) , and related diseases: A review."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The recombinant protein harbouring this mutation was found to display a
      negligible transport activity in proteoliposomes by the EPRA method.
    explanation: >-
      Near-absent ThPP transport by the p.Gly177Ala carrier.
  - reference: PMID:18280798
    reference_title: "The evidence that the DNC (SLC25A19) is not the mitochondrial deoxyribonucleotide carrier."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      This diverse body of evidence consistently points to the conclusion that
      SLC25A19 is not the true mitochondrial DNC gene.
    explanation: >-
      Review consolidating the reassignment of SLC25A19 from deoxynucleotide to
      ThPP carrier.
  downstream:
  - target: Mitochondrial Thiamine Pyrophosphate Depletion
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:17035501
      reference_title: "Knockout of Slc25a19 causes mitochondrial thiamine pyrophosphate depletion, embryonic lethality, CNS malformations, and anemia."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        The mitochondria of Slc25a19(-/-) and MCPHA cells have undetectable and

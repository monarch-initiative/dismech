    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The mitochondria of Slc25a19(-/-) and MCPHA cells have undetectable and
      markedly reduced ThPP content, respectively.
    explanation: >-
      Direct measurement of reduced mitochondrial ThPP in patient cells.
  downstream:
  - target: 2-Oxoglutarate Dehydrogenase Complex Dysfunction
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:17035501
      reference_title: "Knockout of Slc25a19 causes mitochondrial thiamine pyrophosphate depletion, embryonic lethality, CNS malformations, and anemia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The reduction of ThPP levels causes dysfunction of the
        alpha-ketoglutarate dehydrogenase complex, which explains the high
        levels of this organic acid in MCPHA and suggests that mitochondrial
        ThPP transport is important for CNS development.
      explanation: >-
        States the causal step from ThPP depletion to 2-oxoglutarate
        dehydrogenase dysfunction.
  - target: Pyruvate Dehydrogenase Complex Insufficiency
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:20583149
      reference_title: "Amish microcephaly: Long-term survival and biochemical characterization."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The biochemical phenotype of MCPHA may be attributable to decreased
        activity of the three mitochondrial enzymes that require TPP as a
        cofactor: pyruvate dehydrogenase, alpha-ketoglutarate dehydrogenase, and
        branched chain amino acid dehydrogenase.
      explanation: >-
        Proposes that ThPP depletion also limits pyruvate dehydrogenase; a
        hypothesis offered to explain the lactic acidosis, not a measurement.
- name: 2-Oxoglutarate Dehydrogenase Complex Dysfunction
  biological_scale: MOLECULAR
  description: >-
    The 2-oxoglutarate dehydrogenase complex cannot work without its ThPP
    cofactor, so 2-oxoglutarate accumulates and is excreted. The enzyme itself
    is intact: its activity was normal when assayed in patient lymphoblasts, so
    the defect lies in cofactor supply rather than in the apoenzyme.

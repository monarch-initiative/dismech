diagnosis:
- name: Urine Organic Acids and SLC25A19 Genetic Testing
  description: >-
    Suspected in an infant with severe congenital microcephaly, particularly
    with a smooth brain, callosal dysgenesis or spinal dysraphism, and Amish
    ancestry. Urine organic acids may show isolated 2-oxoglutaric aciduria, but
    the finding is intermittent, so a normal result does not exclude the
    disease. The diagnosis is confirmed by biallelic pathogenic SLC25A19
    variants; in Amish patients, by homozygosity for c.530G>C (p.Gly177Ala).
    Genotyping also separates it from other lethal congenital microcephalies
    with a similar appearance.
  evidence:
  - reference: PMID:20301539
    reference_title: "SLC25A19-Related Thiamine Metabolism Dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The diagnosis of SLC25A19 deficiency is established in a proband with
      suggestive findings and biallelic pathogenic variants in SLC25A19
      identified by molecular genetic testing.
    explanation: >-
      Molecular confirmation as the diagnostic standard.
  - reference: PMID:20583149
    reference_title: "Amish microcephaly: Long-term survival and biochemical characterization."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis should be considered in patients with severe congenital
      microcephaly, especially in association with lissencephaly, dysgenesis of
      the corpus callosum, or a spinal dysraphic state.
    explanation: >-
      Clinical features that should prompt testing.
  - reference: PMID:17975804
    reference_title: "A novel form of lethal microcephaly with simplified gyral pattern and brain stem hypoplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patients described here do not resemble any other published cases of
      such clinical severity and the locus for the only reported early lethal
      microcephaly gene found in Amish families was excluded.
    explanation: >-
      A clinically similar lethal microcephaly in which the Amish locus was
      excluded, showing that genotyping is needed to make the diagnosis.
treatments:
- name: High-Fat Diet During Metabolic Crisis
  description: >-
    In the Canadian patient the severe lactic acidosis of metabolic crises
    responded to a high-fat diet. This is a single-patient observation.
  therapeutic_modality: BEHAVIORAL
  treatment_term:

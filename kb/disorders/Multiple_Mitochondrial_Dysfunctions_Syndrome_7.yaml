      snippet: "This illustrated that this decrease in lipoylation at the level of PDH and the Krebs cycle impacted the bioenergetics capacity of these cells."
      explanation: Reduced lipoylation of PDH and Krebs-cycle enzymes lowered cellular bioenergetic capacity.
    - reference: PMID:36190515
      reference_title: "Pathogenic variants in GCSH encoding the moonlighting H-protein cause combined nonketotic hyperglycinemia and lipoate deficiency."

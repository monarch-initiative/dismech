name: Multiple Mitochondrial Dysfunctions Syndrome 7
category: Mendelian
creation_date: "2026-11-18T00:00:00Z"
synonyms:
- MMDS7
- GCSH-related nonketotic hyperglycinemia
- GCSH deficiency
- Combined nonketotic hyperglycinemia and lipoate deficiency
description: >
  Multiple mitochondrial dysfunctions syndrome 7 (MMDS7) is an ultra-rare autosomal
  recessive disorder caused by biallelic pathogenic variants in GCSH, which encodes the
  H-protein of the mitochondrial glycine cleavage system. The H-protein is a moonlighting
  lipoyl carrier: it carries the lipoyl arm that shuttles the aminomethyl intermediate
  within the glycine cleavage system, and it is also the lipoyl donor from which LIPT1
  lipoylates the E2 subunits of pyruvate dehydrogenase and 2-ketoglutarate
  dehydrogenase. Hypomorphic GCSH variants therefore combine nonketotic hyperglycinemia
  (raised CSF and plasma glycine with glycine encephalopathy) with a lipoylation defect
  that lowers pyruvate dehydrogenase activity and mitochondrial respiratory reserve. The
  clinical spectrum runs from fatal neonatal apneic coma with burst-suppression seizures
  to an attenuated course of developmental delay, hyperactivity, behavioral problems,
  limited epilepsy and dystonia.
disease_term:
  preferred_term: multiple mitochondrial dysfunctions syndrome 7
  term:
    id: MONDO:0957382
    label: multiple mitochondrial dysfunctions syndrome 7
parents:
- Nonketotic Hyperglycinemia
- Mitochondrial lipoylation defect
notes: >-
  No GeneReviews chapter is specific to GCSH. The Nonketotic Hyperglycinemia chapter
  (PMID:20301531) defines NKH by biallelic variants in any gene encoding a glycine
  cleavage system subunit, which includes GCSH, and is tagged here as the closest
  baseline; its abstract does not name GCSH and excludes cofactor (lipoate)
  deficiencies from classic NKH, so the phenotype list is taken mainly from the two
  published GCSH case series (PMID:33890291, PMID:36190515). GCSH also appears inside
  the Nonketotic_Hyperglycinemia entry's mechanism graph; this entry is the
  disease-level record for the GCSH form, in line with the other numbered multiple
  mitochondrial dysfunctions syndromes. Phenotype frequencies are omitted because the
  published cohort is nine patients and no source states proportions for most features.
  The one exception is raised CSF glycine, which PMID:36190515 reports in all six of its
  patients.
references:
- reference: PMID:20301531
  title: Nonketotic Hyperglycinemia.
  tags:
  - GeneReviews
classifications:
  harrisons_chapter:
  - classification_value: ENDOCRINOLOGY_METABOLISM
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
  - classification_value: NEUROLOGIC
  mechanistic_category:
  - classification_value: mitochondrial disease
    notes: >-
      Loss of the GCSH H-protein impairs two mitochondrial matrix functions: glycine
      cleavage and the transfer of lipoate to 2-oxoacid dehydrogenase E2 subunits.
    evidence:
    - reference: PMID:36190515
      reference_title: "Pathogenic variants in GCSH encoding the moonlighting H-protein cause combined nonketotic hyperglycinemia and lipoate deficiency."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "most variants identified in our cohort produced a hypomorphic effect on both mitochondrial activities, protein lipoylation and glycine metabolism, causing combined deficiency"
      explanation: Functional studies show GCSH variants impair two mitochondrial activities at once.
  icimd_category:
  - classification_value: lipoic_acid_and_iron_sulfur
    notes: >-
      Defect of mitochondrial lipoic acid metabolism at the lipoyl-carrier step (the
      H-protein on which lipoate is assembled and from which it is transferred).
    evidence:
    - reference: PMID:36190515
      reference_title: "Pathogenic variants in GCSH encoding the moonlighting H-protein cause combined nonketotic hyperglycinemia and lipoate deficiency."
      supports: SUPPORT
      quote_role: BACKGROUND
      evidence_source: OTHER
      snippet: "The H-protein encoded by GCSH has a dual role in protein lipoylation required for bioenergetic enzymes including pyruvate dehydrogenase and 2-ketoglutarate"
      explanation: Places GCSH in the protein lipoylation pathway for bioenergetic enzymes.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >
    Biallelic GCSH variants, homozygous in consanguineous families and compound
    heterozygous in non-consanguineous families, with segregation from heterozygous
    parents.
  evidence:
  - reference: PMID:36190515
    reference_title: "Pathogenic variants in GCSH encoding the moonlighting H-protein cause combined nonketotic hyperglycinemia and lipoate deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Compound heterozygous variants were identified in the non-consanguineous families 1, 2 and 3, and homozygous variants in the consanguineous families 4, 5 and 6."
    explanation: Biallelic variants in all six families support autosomal recessive inheritance.
prevalence:
- population: Global reported patients
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population-based estimate exists. ClinGen counts seven probands with GCSH
    variants from two publications, plus one affected sibling.
  evidence:
  - reference: CGGV:assertion_d360db9d-24e7-415e-b4bc-59a2c6231189-2026-01-09T170000.000Z
    reference_title: "GCSH / multiple mitochondrial dysfunctions syndrome 7 (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "At least 7 variants (frameshift, nonsense, and missense) have been reported in 7 probands from 2 publications (PMID:33890291, PMID:36190515)."
    explanation: ClinGen's evidence summary counts the reported probands.
progression:
- phase: Severe neonatal or early infantile presentation
  age_range: Neonatal to infancy
  notes: >-
    Neonatal lethargy and hypotonia progressing to apneic coma with burst-suppression
    seizures, or infantile spasms from about two months. In the reported severe cases
    death came in the first two years: at 18 days, 7 days and just before one year in
    one series, and at 10 days and 22 months in two sisters in the other.
  evidence:
  - reference: PMID:36190515
    reference_title: "Pathogenic variants in GCSH encoding the moonlighting H-protein cause combined nonketotic hyperglycinemia and lipoate deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three patients presented with an early onset severe fatal course."
    explanation: Half of the cohort had an early-onset fatal course.
  - reference: PMID:33890291
    reference_title: "Biallelic start loss variant, c.1A > G in GCSH is associated with variant nonketotic hyperglycinemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "She succumbed at one year ten months due to resistant seizures."
    explanation: Death from refractory seizures in a start-loss patient.
- phase: Attenuated course with long-term survival
  age_range: Infancy to adolescence
  notes: >-
    Developmental delay with hyperactivity and behavioral problems, treatable or absent
    epilepsy, and in some patients dystonia; one patient was stable at age 17 years.
  evidence:
  - reference: PMID:36190515
    reference_title: "Pathogenic variants in GCSH encoding the moonlighting H-protein cause combined nonketotic hyperglycinemia and lipoate deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three cases with an attenuated phenotype had long-term survival."
    explanation: The other half of the cohort had an attenuated course with long-term survival.
pathophysiology:
- name: GCSH H-protein Deficiency
  description: >
    Biallelic GCSH variants (start-loss p.Met1?, splice, nonsense, exon deletion or
    duplication, and missense) reduce the amount or function of the H-protein. Most
    variants are hypomorphic and affect both of its roles; some missense variants affect
    mainly one.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: GCSH
    term:
      id: hgnc:4208
      label: GCSH
  molecular_functions:
  - preferred_term: lipoyl carrier function of the H-protein
    modifier: DECREASED
    term:
      id: GO:0031405
      label: lipoic acid binding
  locations:
  - preferred_term: mitochondrion
    term:
      id: GO:0005739
      label: mitochondrion
  evidence:
  - reference: PMID:36190515
    reference_title: "Pathogenic variants in GCSH encoding the moonlighting H-protein cause combined nonketotic hyperglycinemia and lipoate deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Immunohistochemical staining showed a reduced H-protein amount, and near absence of staining for lipoylated proteins in the mitochondria in all three cell lines"
    explanation: Patient-derived cells show reduced H-protein.
  - reference: PMID:33890291
    reference_title: "Biallelic start loss variant, c.1A > G in GCSH is associated with variant nonketotic hyperglycinemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We herein report three individuals from two unrelated Indian families with clinical, biochemical, and radiological findings of variant NKH, harboring a biallelic start loss variant, c.1A > G in GCSH."
    explanation: First patient report of a biallelic GCSH variant.
  downstream:
  - target: Glycine Cleavage System Deficiency
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:36190515
      reference_title: "Pathogenic variants in GCSH encoding the moonlighting H-protein cause combined nonketotic hyperglycinemia and lipoate deficiency."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "the glycine exchange activity decreased to 25 ± 3.5% of WT but was not absent as observed for p.Glu58*"
      explanation: The recurrent start-loss variant, transiently expressed in COS7 cells, lowers glycine cleavage (glycine exchange) activity.
    - reference: PMID:36190515
      reference_title: "Pathogenic variants in GCSH encoding the moonlighting H-protein cause combined nonketotic hyperglycinemia and lipoate deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Liver GCS activity was decreased 4.3 U/g protein (normal range 12–175 U/g)."
      explanation: Deficient glycine cleavage activity measured in a GCSH patient's liver.
  - target: Deficient Lipoylation of 2-Oxoacid Dehydrogenase E2 Subunits
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:36190515
      reference_title: "Pathogenic variants in GCSH encoding the moonlighting H-protein cause combined nonketotic hyperglycinemia and lipoate deficiency."

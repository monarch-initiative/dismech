      snippet: "On western blot analysis, there was a strongly reduced amount of H-protein (Fig. 5A and D) and strongly reduced lipoylated proteins of the E2 subunits of PDH (DLAT) and 2-KGDH (DLST) in all cells"
      explanation: Reduced H-protein in patient cells is accompanied by loss of E2 subunit lipoylation.

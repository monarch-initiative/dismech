    snippet: "We report that the physiologically relevant LIPT1 enzyme activity is transfer of lipoyl moieties from the H protein of the glycine cleavage system to the E2 subunits of the 2-oxoacid dehydrogenases required for respiration"
    explanation: Establishes the H-protein as the lipoyl donor for the E2 subunits.

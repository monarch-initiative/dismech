genetic:
- name: GCSH
  association: Causative
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: GCSH
    term:
      id: hgnc:4208
      label: GCSH
  variant_origin: GERMLINE
  notes: >
    Reported variants include the recurrent start-loss c.1A>G p.(Met1?) (homozygous in
    two Indian families, and in trans in two further patients), the exon 4 acceptor
    splice insertion c.293-2_293-1insT, nonsense p.(Gln76*), an exon 2 deletion, a
    duplication of exons 4-5, and missense p.(His57Arg), p.(Pro115Leu) and
    p.(Thr148Pro). p.His57Arg retained glycine exchange activity but impaired lipoyl
    transfer, showing that a variant can separate the two H-protein functions.
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_d360db9d-24e7-415e-b4bc-59a2c6231189-2026-01-09T170000.000Z
    evidence:
    - reference: CGGV:assertion_d360db9d-24e7-415e-b4bc-59a2c6231189-2026-01-09T170000.000Z
      reference_title: "GCSH / multiple mitochondrial dysfunctions syndrome 7 (Definitive)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "GCSH | HGNC:4208 | multiple mitochondrial dysfunctions syndrome 7 | MONDO:0957382 | AR | Definitive"
      explanation: ClinGen classifies GCSH for this disease as Definitive, autosomal recessive.
  evidence:
  - reference: PMID:36190515
    reference_title: "Pathogenic variants in GCSH encoding the moonlighting H-protein cause combined nonketotic hyperglycinemia and lipoate deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we report six new patients who presented with NKH and were found to carry bi-allelic variants in GCSH."
    explanation: Six unrelated patients with biallelic GCSH variants.
  - reference: PMID:36190515
    reference_title: "Pathogenic variants in GCSH encoding the moonlighting H-protein cause combined nonketotic hyperglycinemia and lipoate deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the p.His57Arg variant showed an increased level of H-protein on western blot and mitochondrial colocalization with an increased glycine exchange activity"
    explanation: A missense variant that preserves, even raises, glycine exchange activity.
  - reference: PMID:36190515
    reference_title: "Pathogenic variants in GCSH encoding the moonlighting H-protein cause combined nonketotic hyperglycinemia and lipoate deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Although the lipoyl-H-protein amount was similar to controls, the lipoylated DLST levels and even DLAT levels did not recover, reflecting a decrease in lipoyl transfer"
    explanation: The same variant fails to restore E2 lipoylation, separating the two H-protein functions.
animal_models:
- name: Gcsh null mouse
  species: Mouse
  species_term:
    preferred_term: Mouse
    term:
      id: NCBITaxon:10090
      label: Mus musculus
  genotype: Gcsh homozygous null allele
  publication: PMID:33569080
  modeled_mechanisms:
  - target: GCSH H-protein Deficiency
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      Complete loss of Gcsh is embryonic lethal before mid-gestation and is not rescued
      by formate, consistent with an essential role beyond glycine cleavage.
    limitations: >-
      Human GCSH variants are hypomorphic and compatible with birth, whereas the mouse
      null dies before E10.5, so the model cannot show the postnatal NKH or lipoylation
      phenotypes; heterozygotes have normal plasma glycine.
    evidence:
    - reference: PMID:33569080
      reference_title: "Glycine Cleavage System H Protein Is Essential for Embryonic Viability, Implying Additional Function Beyond the Glycine Cleavage System."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Hence, unlike null mutations of Gldc or Amt, which are compatible with embryonic survival despite the presence of NTDs, loss of Gcsh causes embryonic death prior to mid-gestation."
      explanation: Null Gcsh is lethal, a more severe outcome than null Gldc or Amt.
    - reference: PMID:33569080
      reference_title: "Glycine Cleavage System H Protein Is Essential for Embryonic Viability, Implying Additional Function Beyond the Glycine Cleavage System."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Maternal supplementation with formate did not restore embryonic development beyond E7.5, suggesting that the primary cause of lethality was not loss of glycine cleavage activity or suppression of folate one-carbon metabolism."
      explanation: Formate rescue failure points to the non-glycine-cleavage (lipoylation) role.
treatments:
- name: Sodium benzoate therapy
  description: >
    Benzoate conjugates glycine to lower plasma glycine. In GCSH patients it restored
    breathing in one neonate and controlled spasms in another, but was stopped as
    ineffective in a third. The NKH GeneReviews chapter advises avoiding valproate, which
    raises glycine, and vigabatrin.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: sodium benzoate
      term:
        id: CHEBI:113455
        label: sodium benzoate
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Systemic and CNS Glycine Accumulation
  evidence:
  - reference: PMID:36190515
    reference_title: "Pathogenic variants in GCSH encoding the moonlighting H-protein cause combined nonketotic hyperglycinemia and lipoate deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At age 6 months, he developed flexion spasms, unresponsive to antiepileptic treatment, but responding to benzoate treatment for elevated glycine levels"
    explanation: Benzoate controlled spasms that antiepileptic drugs did not.
  - reference: PMID:36190515
    reference_title: "Pathogenic variants in GCSH encoding the moonlighting H-protein cause combined nonketotic hyperglycinemia and lipoate deficiency."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Benzoate treatment was discontinued for ineffectiveness."
    explanation: Benzoate was not effective in one attenuated patient.
  - reference: PMID:20301531
    reference_title: "Nonketotic Hyperglycinemia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "treatment with benzoate to lower glycine improves attentiveness and facilitates seizure management"
    explanation: GeneReviews management statement for NKH, which GCSH deficiency falls under.
  notes: >-
    GeneReviews (PMID:20301531) lists valproate, which raises blood and CSF glycine, and
    vigabatrin as agents to avoid in NKH; this has not been studied in GCSH patients
    specifically.
- name: Dextromethorphan (NMDA receptor antagonist)
  description: >
    Used together with benzoate in one neonatal-onset GCSH patient, who survived with
    moderate developmental delay and dystonia and no seizure disorder.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: dextromethorphan
      term:
        id: CHEBI:4470
        label: dextromethorphan
  therapeutic_modality: SMALL_MOLECULE
  evidence:
  - reference: PMID:36190515
    reference_title: "Pathogenic variants in GCSH encoding the moonlighting H-protein cause combined nonketotic hyperglycinemia and lipoate deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "With continued benzoate and dextromethorphan treatment, the child has moderate global developmental delay and a dystonic movement disorder."
    explanation: Outcome of combined benzoate and dextromethorphan in one patient; a single uncontrolled case.
  - reference: PMID:20301531
    reference_title: "Nonketotic Hyperglycinemia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "administration of sodium benzoate and blockade of overstimulated NMDA receptors"
    explanation: GeneReviews treatment for attenuated NKH combines benzoate with NMDA receptor blockade, the role of dextromethorphan.
- name: Genetic counseling
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:20301531
    reference_title: "Nonketotic Hyperglycinemia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "If both parents are heterozygous for one pathogenic variant, each sib of an affected individual has at conception a 25% chance of being affected"
    explanation: Autosomal recessive recurrence risk for NKH, which applies to GCSH.
diagnosis:
- name: Plasma and CSF glycine measurement
  description: >
    Paired plasma and CSF amino acids show raised glycine with an increased CSF/plasma
    ratio, establishing nonketotic hyperglycinemia.
  evidence:
  - reference: PMID:20301531
    reference_title: "Nonketotic Hyperglycinemia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The diagnosis of NKH is established in a proband with elevated glycine in plasma and CSF, a compatible pattern on brain imaging"
    explanation: GeneReviews diagnostic criteria for NKH.
- name: Exome sequencing for biallelic GCSH variants
  description: >
    Exome sequencing finds biallelic GCSH variants; copy-number changes and a start
    codon in a poorly covered region mean that deletion/duplication analysis and
    inspection of exon 1 coverage are needed.
  results: Biallelic pathogenic variants in GCSH
  evidence:
  - reference: PMID:36190515
    reference_title: "Pathogenic variants in GCSH encoding the moonlighting H-protein cause combined nonketotic hyperglycinemia and lipoate deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exome sequencing identified biallelic GCSH variants in the six unrelated index cases (Table 2)."
    explanation: Exome sequencing was diagnostic in all six families.
  - reference: PMID:33890291
    reference_title: "Biallelic start loss variant, c.1A > G in GCSH is associated with variant nonketotic hyperglycinemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This region was poorly covered with a total of seven reads supporting c.1A>G change in P1"
    explanation: The start codon variant sat in a poorly covered region, a known pitfall.
differential_diagnoses:
- name: Classic nonketotic hyperglycinemia (GLDC or AMT)
  description: >
    Biallelic GLDC or AMT variants cause NKH without a lipoylation defect, so PDH
    activity and E2 lipoylation are normal.
  disease_term:
    preferred_term: glycine encephalopathy
    term:
      id: MONDO:0011612
      label: glycine encephalopathy
  distinguishing_features:
  - Biallelic GLDC or AMT variants
  - Normal lipoylation of DLAT and DLST
  evidence:
  - reference: PMID:36190515
    reference_title: "Pathogenic variants in GCSH encoding the moonlighting H-protein cause combined nonketotic hyperglycinemia and lipoate deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Nearly 80% of classical NKH patients carry biallelic variants in GLDC, encoding the P-protein, with the remaining 20% caused by mutations in the AMT gene"
    explanation: GLDC and AMT account for classic NKH.
- name: Lipoic acid synthetase deficiency
  description: >
    LIAS deficiency is one of the lipoate-synthesis causes of variant NKH, with the same
    combined glycine cleavage, PDH and 2-KGDH deficiency; it is told apart by genotype.
  disease_term:
    preferred_term: lipoic acid synthetase deficiency
    term:
      id: MONDO:0013762
      label: lipoic acid synthetase deficiency
  distinguishing_features:
  - Biallelic LIAS variants rather than GCSH variants
  evidence:
  - reference: PMID:36190515
    reference_title: "Pathogenic variants in GCSH encoding the moonlighting H-protein cause combined nonketotic hyperglycinemia and lipoate deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "is triggered by deficient lipoylation of proteins including the GCS, but also DLAT and DLST, and associated combined deficiency of PDH and 2-KGDH in addition to the GCS, such as caused by biallelic variants in LIAS, BOLA3, NFU1 or GLRX5"
    explanation: Variant NKH from lipoylation defects shares the combined biochemical picture.
- name: Transient neonatal hyperglycinemia
  description: >
    Neonatal hyperglycinemia that resolves within weeks, reported in heterozygous
    carriers of GLDC or GCSH variants; it is indistinguishable from NKH at onset, so a
    single heterozygous GCSH variant should not be read as MMDS7.
  disease_term:
    preferred_term: hyperglycinemia, transient neonatal
    term:
      id: MONDO:0800331
      label: hyperglycinemia, transient neonatal
  distinguishing_features:
  - Plasma and CSF glycine normalize within 2 to 8 weeks
  - Heterozygous rather than biallelic variant
  evidence:
  - reference: PMID:12402263
    reference_title: "Heterozygous GLDC and GCSH gene mutations in transient neonatal hyperglycinemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Heterozygous mutations were identified in all of the three patients, suggesting that transient neonatal hyperglycinemia develops in some heterozygous carriers for nonketotic hyperglycinemia."
    explanation: Transient neonatal hyperglycinemia occurs in heterozygous carriers, including of a GCSH variant.
- name: Lipoyl transferase 1 deficiency
  description: >
    LIPT1 deficiency impairs lipoyl transfer to the E2 subunits but leaves H-protein
    lipoylation intact, so glycine is normal.
  disease_term:
    preferred_term: lipoyl transferase 1 deficiency
    term:
      id: MONDO:0014576
      label: lipoyl transferase 1 deficiency
  distinguishing_features:
  - No glycine cleavage system deficiency
  - Biallelic LIPT1 variants
  evidence:
  - reference: PMID:29987032
    reference_title: "Protein moonlighting elucidates the essential human pathway catalyzing lipoic acid assembly on its cognate enzymes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We report that the physiologically relevant LIPT1 enzyme activity is transfer of lipoyl moieties from the H protein of the glycine cleavage system to the E2 subunits of the 2-oxoacid dehydrogenases required for respiration"
    explanation: LIPT1 acts downstream of lipoyl-H-protein, so its loss leaves H-protein lipoylation in place.
  - reference: PMID:28757203
    reference_title: "Biallelic Mutations in LIPT2 Cause a Mitochondrial Lipoylation Defect Associated with Severe Neonatal Encephalopathy."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "LIPT1 deficiency spares GCS deficiency and has been associated with a biochemical signature of combined 2-oxoacid dehydrogenase deficiency"
    explanation: Patients with LIPT1 deficiency do not have the glycine cleavage defect that GCSH deficiency causes.

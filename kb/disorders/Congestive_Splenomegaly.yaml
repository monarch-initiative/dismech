    reference_title: "The role and evolution of partial splenic embolization over three decades: A multicentric retrospective single cohort study of 90 patients from French nationwide experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The main indications for PSE were (1) an indication of medical treatment or radiological/surgical procedure in the context a severe thrombocytopenia (59.3 %), (2) a chronic hemorrhagic disorder associated with a severe thrombocytopenia (18.7 %), and (3) a chronic pain associated with a major splenomegaly (9.9 %)."
    explanation: Multicenter portal-hypertension cohort documents chronic pain associated with major splenomegaly as a clinical manifestation requiring intervention.
  - reference: PMID:34786165
    reference_title: "Pediatric non-cirrhotic portal hypertension: Endoscopic outcome and perspectives from developing nations."

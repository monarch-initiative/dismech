    environmental_effect: PREDISPOSES
    description: Chronic hepatitis B or C infection drives hepatic cirrhosis and intrahepatic portal venous outflow resistance.
    evidence:
    - reference: PMID:34543610
      reference_title: "Liver cirrhosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Cirrhosis is widely prevalent worldwide and can be a consequence of different causes, such as obesity, non-alcoholic fatty liver disease, high alcohol consumption, hepatitis B or C infection, autoimmune diseases, cholestatic diseases, and iron or copper overload. Cirrhosis develops after a long period of inflammation that results in replacement of the healthy liver parenchyma with fibrotic tissue and regenerative nodules, leading to portal hypertension."
      explanation: Directly links chronic hepatitis B or C infection to hepatic cirrhosis and consequent portal hypertension.
  evidence:
  - reference: PMID:34543610
    reference_title: "Liver cirrhosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Cirrhosis is widely prevalent worldwide and can be a consequence of different causes, such as obesity, non-alcoholic fatty liver disease, high alcohol consumption, hepatitis B or C infection, autoimmune diseases, cholestatic diseases, and iron or copper overload. Cirrhosis develops after a long period of inflammation that results in replacement of the healthy liver parenchyma with fibrotic tissue and regenerative nodules, leading to portal hypertension."
    explanation: Identifies hepatitis B or C infection as a major global cause of cirrhosis and portal hypertension.
treatments:
- name: Treat Underlying Cause
  description: >
    Management of the primary condition causing portal hypertension, such as
    antiviral therapy for hepatitis, alcohol cessation for alcoholic liver
    disease, or anticoagulation for portal or splenic vein thrombosis.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Therapeutic Procedure
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  target_mechanisms:
  - target: Portal and Splenic Venous Congestion
    treatment_effect: INHIBITS
    description: Halting ongoing hepatic injury or recanalizing portal/splenic venous thrombosis reduces upstream portal venous outflow resistance.
  evidence:
  - reference: PMID:41306370
    reference_title: "The Mechanisms behind Thrombocytopenia in Patients with Portal Hypertension and Chronic Liver Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Persistent liver injury halts the regenerative capacity of hepatocytes and activates mechanisms that result in the replacement of normal hepatic parenchyma with extracellular matrix deposits. As liver fibrosis develops, the liver undergoes architectural changes and alterations in microcirculation that lead to increased intrahepatic vascular resistance and portal hypertension."
    explanation: Addressing the underlying cause of liver injury is essential because persistent hepatic damage drives fibrosis and portal hypertension, which in turn causes congestive splenomegaly.
- name: Non-Selective Beta Blockers
  description: >
    Propranolol or carvedilol to reduce portal pressure and prevent variceal
    bleeding in patients with portal hypertension.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: beta-adrenergic antagonist therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: beta-adrenergic antagonist
      term:
        id: NCIT:C29576
        label: Beta-Adrenergic Antagonist
    - preferred_term: propranolol
      term:
        id: CHEBI:8499
        label: propranolol
    - preferred_term: carvedilol
      term:
        id: CHEBI:3441
        label: carvedilol
  target_mechanisms:
  - target: Portal and Splenic Venous Congestion
    treatment_effect: INHIBITS
    description: Non-selective beta-adrenergic blockade attenuates splanchnic inflow and reduces portal and splenic venous pressure.
  evidence:
  - reference: PMID:41306370
    reference_title: "The Mechanisms behind Thrombocytopenia in Patients with Portal Hypertension and Chronic Liver Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Nonselective beta-blockers are the cornerstone of long-term management for clinically significant portal hypertension."
    explanation: Establishes non-selective beta blockers as the standard pharmacological treatment for clinically significant portal hypertension.
- name: Splenectomy
  description: >
    Surgical removal of the spleen for refractory symptomatic hypersplenism
    with severe cytopenias. Carries risks of post-splenectomy sepsis and
    portal vein thrombosis.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: splenectomy
    term:
      id: NCIT:C15328
      label: Splenectomy
  target_mechanisms:
  - target: Hypersplenism
    treatment_effect: INHIBITS
    description: Resection of the congested spleen eliminates splenic pooling and macrophage-mediated cytopenias.
  evidence:
  - reference: PMID:23109457
    reference_title: "Splenectomy in cirrhosis with hypersplenism: improvement in cytopenias, Child's status and institution of specific treatment for hepatitis C with success."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Subsequent to splenectomy platelet count (44,000 to 151,000/mm 3 , p < 0.01) and TLC (2,500 to 13,400/mm 3 , p < 0.01) had sustained increase in all patients except one."
    explanation: Demonstrates sustained correction of hypersplenic thrombocytopenia and leukopenia after splenectomy in patients with cirrhosis and hypersplenism.
- name: Partial Splenic Embolization
  description: >
    Interventional radiology procedure to reduce functional splenic red-pulp
    volume and improve cytopenias while preserving residual splenic immune
    function, though platelet recovery can be partial or transient and severe
    complications may occur in decompensated cirrhosis.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical procedure on vascular system
    term:
      id: NCIT:C157725
      label: Vascular Surgical Procedure
  target_mechanisms:
  - target: Hypersplenism
    treatment_effect: INHIBITS
    description: Selective splenic arterial embolization reduces functional congested red-pulp volume and splenic platelet sequestration.
  evidence:
  - reference: PMID:38679291
    reference_title: "The role and evolution of partial splenic embolization over three decades: A multicentric retrospective single cohort study of 90 patients from French nationwide experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Platelet count increased from a median of 48.0 G/L ... to 100.0 G/L
    explanation: Multicenter cohort of 90 patients with portal hypertension and hypersplenism shows durable platelet count improvement after partial splenic embolization.
  - reference: PMID:27860293
    reference_title: "Thrombocytopenia in chronic liver disease."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "insufficient platelet recovery after relief of portal hypertension by shunt procedures or minor and transient recovery after splenic artery embolization have caused many to question the importance and relative contribution of this mechanism to thrombocytopenia."
    explanation: Notes reports of minor or transient platelet recovery after splenic artery embolization, indicating that non-splenic factors (such as reduced hepatic thrombopoietin) also contribute to thrombocytopenia in chronic liver disease.
- name: Transjugular Intrahepatic Portosystemic Shunt
  description: >
    TIPS procedure to decompress the portal system in patients with portal
    hypertension-related splenomegaly. Reduces splenic congestion by
    lowering portal pressure.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical procedure on vascular system
    term:
      id: NCIT:C157725
      label: Vascular Surgical Procedure
  target_mechanisms:
  - target: Portal and Splenic Venous Congestion
    treatment_effect: INHIBITS
    description: Portosystemic shunting decompresses the portal venous bed and lowers retrograde splenic venous pressure.
  evidence:
  - reference: PMID:41306370
    reference_title: "The Mechanisms behind Thrombocytopenia in Patients with Portal Hypertension and Chronic Liver Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Indications for transjugular intrahepatic portosystemic shunt placement include failure to control portal hypertension-related bleeding, early rebleeding, and refractory or recurrent ascites."
    explanation: Establishes the clinical indications for TIPS in the management of portal hypertension complications.

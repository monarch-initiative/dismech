  diagnosis_term:
    preferred_term: Doppler Ultrasound
    term:
      id: NCIT:C62781
      label: Doppler Ultrasound
  description: >-
    Abdominal ultrasonography with color and spectral Doppler evaluates spleen
    dimensions, portal and splenic vein patency or thrombosis, collateral
    vessels, and splenic artery hemodynamics.
  results: >-
    Splenomegaly, dilated portal/splenic veins or venous thrombosis, and
    selectively elevated splenic artery resistance index in cirrhotic portal
    hypertension.
  evidence:
  - reference: PMID:36908126
    reference_title: "The Role of the Spleen in Portal Hypertension."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The splenic artery resistance index is significantly and selectively elevated in cirrhotic patients."
    explanation: Supports Doppler evaluation of splenic artery resistance in cirrhotic portal hypertension.
- name: Spleen Stiffness Elastography
  diagnosis_term:
    preferred_term: Elastography
    term:
      id: NCIT:C106517
      label: Elastography
  description: >-
    Noninvasive elastographic measurement of spleen stiffness reflects splenic
    venous congestion and red pulp fibrosis and stratifies portal hypertension
    severity and esophageal variceal bleeding risk.
  results: >-
    Elevated spleen stiffness correlating with portal hypertension advancement
    and variceal bleeding risk.
  evidence:
  - reference: PMID:32945524
    reference_title: "Cytoglobin-expressing cells in the splenic cords contribute to splenic fibrosis in cirrhotic patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among several noninvasive evaluation methods of portal hypertension (PH),
      the measurement of spleen stiffness is a reliable method for predicting
      esophageal variceal bleeding
    explanation: >-
      Establishes spleen stiffness elastography as a noninvasive diagnostic and
      risk-stratification modality in portal hypertension.
- name: Complete Blood Cell Count
  diagnosis_term:
    preferred_term: Blood Cell Count
    term:
      id: NCIT:C28133
      label: Blood Cell Count
  markers: Platelets, hemoglobin, total leukocyte count
  description: >-
    Complete blood cell count detects hypersplenism-associated cytopenias, with
    thrombocytopenia typically appearing earliest and serving as an independent
    noninvasive predictor of clinically significant portal hypertension and
    varices.
  results: >-
    Isolated thrombocytopenia or combined anemia, leukopenia, and pancytopenia.
  evidence:
  - reference: PMID:41306370
    reference_title: "The Mechanisms behind Thrombocytopenia in Patients with Portal Hypertension and Chronic Liver Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Various clinical risk scores consider platelet counts as independent
      predictors of adverse liver outcomes, such as the development of
      esophageal varices and the presence of advanced fibrosis.
    explanation: >-
      Supports peripheral blood platelet enumeration in evaluating portal
      hypertension and hypersplenism.
environmental:
- name: Alcohol Use
  exposure_term:
    preferred_term: exposure to alcohol consumption
    term:
      id: ECTO:0001082
      label: exposure to alcohol consumption
  exposure_classifications:
    hazard_agent_type:
    - classification_value: CHEMICAL
    exposure_route:
    - classification_value: ORAL
    exposure_duration:
    - classification_value: CHRONIC
    exposome_domain:
    - classification_value: SPECIFIC_EXTERNAL
  description: >
    Chronic alcohol consumption is a leading cause of liver cirrhosis and
    portal hypertension worldwide, contributing to congestive splenomegaly
    through progressive hepatic fibrosis.
  notes: Major cause of hepatic congestive splenomegaly
  influences_mechanisms:
  - target: Portal and Splenic Venous Congestion
    environmental_effect: PREDISPOSES
    description: Chronic alcohol-induced hepatic fibrosis increases intrahepatic vascular resistance and portal venous pressure.
    evidence:
    - reference: PMID:34543610
      reference_title: "Liver cirrhosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Cirrhosis is widely prevalent worldwide and can be a consequence of different causes, such as obesity, non-alcoholic fatty liver disease, high alcohol consumption, hepatitis B or C infection, autoimmune diseases, cholestatic diseases, and iron or copper overload. Cirrhosis develops after a long period of inflammation that results in replacement of the healthy liver parenchyma with fibrotic tissue and regenerative nodules, leading to portal hypertension."
      explanation: Directly links chronic high alcohol consumption to hepatic fibrosis, cirrhosis, and portal hypertension.
  evidence:
  - reference: PMID:34543610
    reference_title: "Liver cirrhosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Cirrhosis is widely prevalent worldwide and can be a consequence of different causes, such as obesity, non-alcoholic fatty liver disease, high alcohol consumption, hepatitis B or C infection, autoimmune diseases, cholestatic diseases, and iron or copper overload. Cirrhosis develops after a long period of inflammation that results in replacement of the healthy liver parenchyma with fibrotic tissue and regenerative nodules, leading to portal hypertension."
    explanation: Identifies high alcohol consumption as a major cause of liver cirrhosis leading to portal hypertension.

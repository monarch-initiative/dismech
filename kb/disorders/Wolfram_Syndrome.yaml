    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Cisd2 deficiency leads to impairment of glucose-induced extracellular Ca2+ influx, which compromises Ca2+-mediated insulin secretory signaling, causing mitochondrial dysfunction and, thereby impairing insulin secretion in the MIN6-Cisd2KO β-cells."
    explanation: >-
      Defines the calcium-dependent insulin-secretory failure caused by CISD2 loss
      in a beta-cell model.
- name: Retinal Ganglion Cell and CNS Neuron Degeneration
  biological_scale: CELLULAR
  subtypes:
  - WS1
  - WS2
  description: >-
    Cell-intrinsic stress, calcium-transfer defects, and mitochondrial dysfunction
    reduce the survival of retinal ganglion cells and long-projection central
    neurons. Retinal ganglion cell loss thins the retinal nerve fiber layer and
    produces the bilateral progressive optic atrophy that, paired with early
    diabetes, defines the syndrome clinically. WFS1 evidence directly links
    endoplasmic-reticulum stress to cell death; CISD2-knockout human cortical
    neurons show markedly reduced resilience to an apoptosis inducer.
  cell_types:
  - preferred_term: retinal ganglion cell
    term:
      id: CL:0000740
      label: retinal ganglion cell
  biological_processes:
  - preferred_term: neuron apoptotic process
    term:
      id: GO:0051402
      label: neuron apoptotic process
    modifier: INCREASED
  downstream:
  - target: Optic Atrophy
    description: >-
      Loss of retinal ganglion cells produces progressive bilateral optic atrophy.
    causal_link_type: DIRECT
  - target: Brainstem and Cerebellar Volume Loss
    description: >-
      Degeneration of long-projection central neurons contributes to brainstem and
      cerebellar tissue loss.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:22792385
    reference_title: Early brain vulnerability in Wolfram syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "WFS is caused by mutations in the WFS1 gene, which lead to endoplasmic reticulum (ER) stress-mediated cell death."
    explanation: >-
      Attributes the neuronal loss of Wolfram syndrome to endoplasmic reticulum
      stress-mediated cell death.
  - reference: PMID:41299767
    reference_title: "CISD2 ensures adequate ER-mitochondrial coupling, critically supporting mitochondrial function in neurons."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Overall, these deficiencies further impact the resilience of Cisd2-deficient cortical neurons to cell stress as Cisd2-KO neurons were highly sensitive to staurosporine, an inducer of apoptosis."
    explanation: >-
      Links CISD2 loss to reduced survival under apoptotic stress in human
      iPSC-derived cortical neurons.
- name: Hypothalamic Magnocellular Neuron Loss
  biological_scale: CELLULAR
  subtypes:
  - WS1
  description: >-
    Human neuropathology in WS1 shows gliosis and severe loss of magnocellular
    neurons in the supraoptic and paraventricular hypothalamic nuclei. Loss of
    these vasopressin-producing neurons supplies the tissue-level link between the
    molecular WFS1 defect and central diabetes insipidus; the upstream molecular
    steps that create this selective vulnerability are not yet resolved.
  locations:
  - preferred_term: hypothalamus
    term:
      id: UBERON:0001898
      label: hypothalamus
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  downstream:
  - target: Diabetes Insipidus
    description: >-
      Loss of hypothalamic magnocellular neurons depletes central vasopressin
      output and produces central diabetes insipidus.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:39202345
    reference_title: "Wolfram Syndrome 1: A Neuropsychiatric Perspective on a Rare Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In some WS1 cases, the hypothalamus exhibited gliosis and a severe loss of magnocellular neurons in the supraoptic and paraventricular nuclei"
    explanation: >-
      A recent review of human postmortem findings directly localizes the
      magnocellular-neuron loss in WS1.
- name: Cochlear and Auditory Pathway Degeneration
  biological_scale: TISSUE
  subtypes:
  - WS1
  description: >-
    Human WS1 neuropathology shows a continuous pattern of auditory-system injury:
    loss of the organ of Corti in basal cochlear turns, cochlear-nerve fibers, and
    neurons in the cochlear nuclei and inferior colliculus. This regional lesion
    connects WFS1 deficiency to the progressive sensorineural hearing phenotype
    without assuming that every affected person has injury at every listed site.
  locations:
  - preferred_term: cochlea
    term:
      id: UBERON:0001844
      label: cochlea
  downstream:
  - target: Sensorineural Hearing Impairment
    description: >-
      Degeneration of the organ of Corti, cochlear nerve, and central auditory
      nuclei impairs auditory signal transduction and transmission.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:39202345
    reference_title: "Wolfram Syndrome 1: A Neuropsychiatric Perspective on a Rare Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The auditory pathways are characterized by the loss of the organ of Corti in the basal turns of the cochlea, as well as the loss of fibers in the cochlear nerve and neurons in the cochlear nuclei and inferior colliculus"
    explanation: >-
      A recent review of human neuropathology directly describes the peripheral
      and central auditory lesions in WS1.
- name: Lower Urinary Tract Neural Dysfunction
  biological_scale: TISSUE
  subtypes:
  - WS1
  description: >-
    Neurologic and autonomic involvement in WS1 disrupts lower-urinary-tract
    control. Urodynamic studies show both hypocontractile detrusor and
    detrusor-sphincter dyssynergia, explaining how the neural disease produces
    neurogenic bladder and, secondarily, upper-tract dilatation.
  locations:
  - preferred_term: urinary bladder
    term:
      id: UBERON:0001255
      label: urinary bladder
  downstream:
  - target: Neurogenic Bladder
    description: >-
      Impaired detrusor contraction or detrusor-sphincter coordination produces
      the clinically recognized neurogenic bladder.
    causal_link_type: DIRECT
  - target: Hydronephrosis
    description: >-
      Chronic bladder dysfunction can propagate pressure and urinary stasis to the
      upper urinary tract, producing ureterohydronephrosis.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  evidence:

- name: Insulin Deficiency
  biological_scale: CELLULAR
  subtypes:
  - WS1
  - WS2
  description: >-
    Endogenous insulin supply falls through two related but non-identical routes.
    Progressive non-autoimmune beta-cell loss dominates WFS1, whereas CISD2 loss in
    beta cells also impairs beta-granule synthesis, calcium-mediated secretory
    signaling, and glucose-stimulated insulin secretion. The hormone deficit is the
    immediate mechanism producing diabetes mellitus and the mechanism restored by
    exogenous insulin.
  cell_types:
  - preferred_term: pancreatic beta cell
    term:
      id: CL:0000169
      label: type B pancreatic cell
  biological_processes:
  - preferred_term: insulin secretion
    term:
      id: GO:0030073
      label: insulin secretion
    modifier: DECREASED
  downstream:
  - target: Diabetes Mellitus
    description: >-
      Insufficient endogenous insulin produces insulin-requiring diabetes.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:7490992
    reference_title: "Neurodegeneration and diabetes: UK nationwide study of Wolfram (DIDMOAD) syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Non-autoimmune, insulin-deficient diabetes mellitus presented at a median age of 6 years, followed by optic atrophy (11 years)."
    explanation: >-

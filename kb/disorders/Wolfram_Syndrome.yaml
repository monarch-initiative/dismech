- name: WS1
  display_name: Wolfram syndrome 1 (WFS1-related)
  subtype_term:
    preferred_term: Wolfram syndrome 1
    term:
      id: MONDO:0009101
      label: Wolfram syndrome 1
  description: >-
    The classic and by far the commoner form, caused by biallelic WFS1 variants,
    accounting for roughly 90% of cases. Diabetes mellitus and optic atrophy before
    age 16 are the defining pair; diabetes insipidus, sensorineural deafness,
    neurogenic bladder, and brainstem or cerebellar neurodegeneration follow.
  genes:
  - preferred_term: WFS1
    term:
      id: hgnc:12762
      label: WFS1
  evidence:
  - reference: PMID:39202345
    reference_title: "Wolfram Syndrome 1: A Neuropsychiatric Perspective on a Rare Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in the WFS1 gene, located on chromosome 4p16, account for approximately 90% of WS1 cases."
    explanation: >-
      Quantifies the share of Wolfram syndrome attributable to WFS1 variants.
- name: WS2
  display_name: Wolfram syndrome 2 (CISD2-related)
  subtype_term:
    preferred_term: Wolfram syndrome 2
    term:
      id: MONDO:0011502
      label: Wolfram syndrome 2
  description: >-
    A rarer form caused by biallelic variants in CISD2, which encodes ERIS, a small
    protein of the mitochondria-associated endoplasmic reticulum membrane. ERIS
    localizes to the same organelle as wolframin but does not interact with it
    directly, so the two genes converge on the same compartment by separate routes.
    Clinically WS2 typically lacks diabetes insipidus and adds upper intestinal
    ulceration and a bleeding tendency.
  genes:
  - preferred_term: CISD2
    term:
      id: hgnc:24212
      label: CISD2
  evidence:
  - reference: PMID:39527371
    reference_title: SID/SIEDP expert consensus on optimizing clinical strategies for early detection and management of wolfram syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Additionally, a second gene, CISD2, located on chromosome 4q22, has been identified in individuals with WFS type 2 (WFS2), which leads to early onset optic atrophy, diabetes mellitus, deafness, bleeding tendency and upper intestinal ulcers, a shortened lifespan, but notably not diabetes insipidus."
    explanation: >-
      Defines the CISD2-related subtype and its clinical discriminators, including
      the characteristic absence of diabetes insipidus.
pathophysiology:
- name: Loss of Wolframin at the Endoplasmic Reticulum Membrane
  biological_scale: MOLECULAR
  subtypes:
  - WS1
  description: >-
    Biallelic loss-of-function variants in WFS1 remove wolframin, a multipass
    transmembrane glycoprotein of the endoplasmic reticulum. Wolframin holds three
    jobs at once: it negatively regulates the unfolded protein response, it
    maintains endoplasmic reticulum calcium stores, and it supports the contact
    sites where the endoplasmic reticulum meets mitochondria. Nothing downstream in
    this entry is a separate insult; every later node is one of those three jobs
    going unattended.
  genes:
  - preferred_term: WFS1
    term:
      id: hgnc:12762
      label: WFS1
  cellular_components:
  - preferred_term: endoplasmic reticulum membrane
    term:
      id: GO:0005789
      label: endoplasmic reticulum membrane
  downstream:
  - target: Unrestrained ER Stress Signaling Through ATF6-alpha
    description: >-
      Loss of the wolframin brake releases ATF6-alpha and the unfolded protein
      response.
    causal_link_type: DIRECT
  - target: ER-Mitochondria Contact and Calcium Transfer Dysregulation
    description: >-
      Loss of wolframin removes its contribution to endoplasmic reticulum calcium
      handling and to the NCS1-IP3R complex at contact sites.
    causal_link_type: DIRECT
  - target: Hypothalamic Magnocellular Neuron Loss
    description: >-
      In WS1, wolframin deficiency is associated with selective degeneration of
      vasopressin-producing magnocellular neurons in the supraoptic and
      paraventricular hypothalamic nuclei.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:39202345
      reference_title: "Wolfram Syndrome 1: A Neuropsychiatric Perspective on a Rare Disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In some WS1 cases, the hypothalamus exhibited gliosis and a severe loss of magnocellular neurons in the supraoptic and paraventricular nuclei"
      explanation: >-
        A recent review of human neuropathology localizes the neuronal loss that
        provides the anatomical bridge from WFS1 deficiency to central diabetes
        insipidus; the molecular intermediates remain unresolved.
  - target: Cochlear and Auditory Pathway Degeneration
    description: >-
      In WS1, wolframin deficiency is associated with degeneration from the organ
      of Corti through the cochlear nerve and central auditory nuclei.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:39202345
      reference_title: "Wolfram Syndrome 1: A Neuropsychiatric Perspective on a Rare Disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The auditory pathways are characterized by the loss of the organ of Corti in the basal turns of the cochlea, as well as the loss of fibers in the cochlear nerve and neurons in the cochlear nuclei and inferior colliculus"
      explanation: >-
        Human neuropathology supplies the anatomical bridge to hearing impairment,
        while the steps between WFS1 loss and region-selective injury remain
        uncertain.
  - target: Lower Urinary Tract Neural Dysfunction
    description: >-
      In WS1, neurologic and autonomic involvement can disrupt detrusor and
      sphincter control, producing the characteristic bladder phenotype.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:39527371
      reference_title: SID/SIEDP expert consensus on optimizing clinical strategies for early detection and management of wolfram syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "These include ureterohydronephrosis due to bladder dysfunction, as confirmed by urodynamic testing, and autonomic neuropathy."
      explanation: >-
        Clinical and urodynamic observations connect urinary tract dysfunction
        with autonomic neuropathy, but do not resolve the intervening neural lesion.
  evidence:
  - reference: PMID:9771706
    reference_title: A gene encoding a transmembrane protein is mutated in patients with diabetes mellitus and optic atrophy (Wolfram syndrome).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in a novel gene (WFS1) encoding a putative transmembrane protein were found in all affected individuals in six WFS families, and these mutations were associated with the disease phenotype."
    explanation: >-
      The gene-identification study establishing WFS1 variants as the cause of
      Wolfram syndrome.
  - reference: PMID:9771706
    reference_title: A gene encoding a transmembrane protein is mutated in patients with diabetes mellitus and optic atrophy (Wolfram syndrome).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "WFS1 appears to function in survival of islet beta-cells and neurons."
    explanation: >-
      Identifies the two cell populations whose survival depends on wolframin,
      which is the whole shape of the clinical phenotype.
- name: Loss of CISD2 at Organelle Contact Membranes
  biological_scale: MOLECULAR
  subtypes:
  - WS2
  description: >-
    Biallelic loss-of-function variants remove CISD2, an integral membrane protein
    present at the endoplasmic reticulum, mitochondrial outer membrane, and
    mitochondria-associated endoplasmic-reticulum membranes. Unlike wolframin,
    CISD2 does not interact with WFS1 directly. Its loss independently disrupts
    intracellular calcium handling, organelle contacts, mitochondrial function,
    and beta-cell insulin secretion.
  genes:
  - preferred_term: CISD2
    term:
      id: hgnc:24212
      label: CISD2
  cellular_components:
  - preferred_term: mitochondria-associated endoplasmic reticulum membrane
    term:
      id: GO:0044233
      label: mitochondria-associated endoplasmic reticulum membrane contact site
  downstream:
  - target: ER-Mitochondria Contact and Calcium Transfer Dysregulation
    description: >-
      CISD2 loss perturbs contact-site abundance and calcium transfer, with the
      measured direction depending on variant and model context.
    causal_link_type: DIRECT
  - target: Insulin Deficiency
    description: >-
      Beta-cell-specific Cisd2 loss impairs calcium-mediated insulin secretion.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:17846994
    reference_title: "A homozygous mutation in a novel zinc-finger protein, ERIS, is responsible for Wolfram syndrome 2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The ZCD2-encoded protein, ERIS (endoplasmic reticulum intermembrane small protein), is also shown to localize to the endoplasmic reticulum but does not interact directly with Wolframin."
    explanation: >-
      Establishes the separate CISD2 route into the endoplasmic-reticulum
      compartment and its lack of direct interaction with wolframin.
  - reference: PMID:40189101
    reference_title: Wolfram syndrome 2 gene (CISD2) deficiency disrupts Ca(2+)-mediated insulin secretion in β-cells.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "β-cell specific Cisd2KO in mice disrupts systemic glucose homeostasis via impairing β-granules synthesis and insulin secretion; hypertrophy of the β-islets and the presence of a loss of identity that affects certain β-cells."
    explanation: >-
      Directly links beta-cell CISD2 loss to impaired insulin production and
      secretion in vivo.
- name: Unrestrained ER Stress Signaling Through ATF6-alpha
  biological_scale: MOLECULAR
  subtypes:
  - WS1
  description: >-
    Wolframin's mechanism of restraint is specific and now well defined. It
    stabilizes the E3 ubiquitin ligase HRD1, brings the transcription factor
    ATF6-alpha to the proteasome, and enhances its ubiquitination and degradation.
    Without wolframin, ATF6-alpha accumulates, its target genes are derepressed,
    and the endoplasmic reticulum stress response element promoter is activated.
    Patient lymphocytes show the same dysregulation, with ATF6-alpha up and HRD1
    down. A chronically engaged unfolded protein response is not a louder version
    of a normal signal; it is an alarm
    that never stops, and the building is eventually evacuated for good.
  biological_processes:
  - preferred_term: ATF6-mediated unfolded protein response
    term:
      id: GO:0036500
      label: ATF6-mediated unfolded protein response
    modifier: INCREASED
  - preferred_term: ATF6-alpha ubiquitination and proteasomal degradation
    term:
      id: GO:0016567
      label: protein ubiquitination
    modifier: DECREASED
  downstream:
  - target: Beta Cell Apoptosis
    description: >-
      Chronic unresolvable endoplasmic reticulum stress drives beta cell death.
    causal_link_type: DIRECT
  - target: Retinal Ganglion Cell and CNS Neuron Degeneration
    description: >-
      The same chronic stress response drives apoptosis in long-projection
      neurons.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:20160352
    reference_title: Wolfram syndrome 1 gene negatively regulates ER stress signaling in rodent and human cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Moreover, WFS1 stabilized the E3 ubiquitin ligase HRD1, brought ATF6alpha to the proteasome, and enhanced its ubiquitination and proteasome-mediated degradation, leading to suppression of ER stress signaling."
    explanation: >-
      Defines the molecular mechanism by which wolframin restrains the ATF6 arm of
      the unfolded protein response.
  - reference: PMID:20160352
    reference_title: Wolfram syndrome 1 gene negatively regulates ER stress signaling in rodent and human cells.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "lymphocytes from patients with Wolfram syndrome exhibited dysregulated ER stress signaling through upregulation of ATF6alpha and downregulation of HRD1."
    explanation: >-
      Restricts the clinical evidence item to the patient-lymphocyte result; the
      mouse beta-cell observation in the same source sentence is not typed as
      human evidence here.
- name: ER-Mitochondria Contact and Calcium Transfer Dysregulation
  biological_scale: CELLULAR
  subtypes:
  - WS1
  - WS2
  description: >-
    Wolframin forms a complex with neuronal calcium sensor 1 (NCS1) and the
    inositol 1,4,5-trisphosphate receptor to move calcium from the endoplasmic
    reticulum into mitochondria at mitochondria-associated membranes. In WFS1-null
    patient fibroblasts, NCS1 abundance falls, endoplasmic reticulum to
    mitochondria contacts and calcium exchange fall. CISD2 deficiency converges on
    the same compartment: isogenic CISD2-knockout human cortical neurons lose
    contact sites and calcium transfer, whereas one patient CISD2 missense variant
    increased both in fibroblasts. The node therefore records dysregulation, not a
    universal direction of effect across both molecular subtypes.
  biological_processes:
  - preferred_term: endoplasmic reticulum calcium ion homeostasis
    term:
      id: GO:0032469
      label: endoplasmic reticulum calcium ion homeostasis
    modifier: DYSREGULATED
  cellular_components:
  - preferred_term: mitochondria-associated endoplasmic reticulum membrane
    term:
      id: GO:0044233
      label: mitochondria-associated endoplasmic reticulum membrane contact site
  downstream:
  - target: Mitochondrial Dysfunction
    description: >-
      Reduced calcium delivery to mitochondria impairs their function and
      dynamics.
    causal_link_type: DIRECT
  - target: Cytosolic Calcium Dysregulation
    description: >-
      Calcium that is not retained in the endoplasmic reticulum or handed to
      mitochondria raises cytosolic calcium.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:30352948
    reference_title: ER-mitochondria cross-talk is regulated by the Ca(2+) sensor NCS1 and is impaired in Wolfram syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here, we showed that WFS1 formed a complex with neuronal calcium sensor 1 (NCS1) and inositol 1,4,5-trisphosphate receptor (IP3R) to promote Ca2+ transfer between the ER and mitochondria."
    explanation: >-
      Establishes the physical complex through which wolframin supports organelle
      calcium transfer.
  - reference: PMID:30352948
    reference_title: ER-mitochondria cross-talk is regulated by the Ca(2+) sensor NCS1 and is impaired in Wolfram syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In addition, we found that NCS1 abundance was reduced in WFS1-null patient fibroblasts, which showed reduced ER-mitochondria interactions and Ca2+ exchange."
    explanation: >-
      Demonstrates the defect in patient-derived cells rather than only in
      engineered knockdowns.
  - reference: PMID:17846994
    reference_title: "A homozygous mutation in a novel zinc-finger protein, ERIS, is responsible for Wolfram syndrome 2."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "Lymphoblastoid cells from affected individuals show a significantly greater rise in intracellular calcium when stimulated with thapsigargin, compared with controls, although no difference was observed in resting concentrations of intracellular calcium."
    explanation: >-
      Shows that the CISD2 route into this node also produces abnormal calcium
      handling. PARTIAL because the abnormality is a stimulated response in WS2
      lymphoblastoid cells, not the same measured ER-mitochondria transfer defect
      demonstrated for WFS1.
  - reference: PMID:41299767
    reference_title: "CISD2 ensures adequate ER-mitochondrial coupling, critically supporting mitochondrial function in neurons."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "However, studying the impact of Cisd2 deficiency in human induced pluripotent stem cell -derived cortical neurons revealed a severe loss of glutamate-evoked Ca2+ responses in cytosol and associated uptake in mitochondria due to loss of ER-mitochondria contact sites."
    explanation: >-
      Demonstrates reduced contact sites and calcium transfer in a disease-relevant
      human neuronal model of complete CISD2 loss.
  - reference: PMID:28335035
    reference_title: A novel CISD2 mutation associated with a classical Wolfram syndrome phenotype alters Ca2+ homeostasis and ER-mitochondria interactions.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This Ca2+ dysregulation was associated with increased ER-mitochondria contact, a swollen ER lumen and a hyperfused mitochondrial network in the absence of overt ER stress."
    explanation: >-
      Shows the opposite contact-site direction in fibroblasts carrying a specific
      CISD2 missense variant, justifying a direction-neutral dysregulation node.
- name: Mitochondrial Dysfunction
  biological_scale: CELLULAR
  subtypes:
  - WS1
  - WS2
  description: >-
    Disturbed calcium exchange at endoplasmic-reticulum to mitochondria contact
    sites disrupts mitochondrial dynamics and bioenergetics. WFS1 knockdown in
    neurons inhibits mitochondrial fusion, alters trafficking, and augments
    mitophagy. CISD2-knockout human cortical neurons show reduced oxygen
    consumption, ATP production, and mitochondrial membrane-potential maintenance.
    These subtype-specific experiments converge on one atomic mitochondrial
    dysfunction node.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: mitochondrion organization
    term:
      id: GO:0007005
      label: mitochondrion organization
    modifier: DYSREGULATED
  downstream:
  - target: Impaired Neuronal Development
    description: >-
      WFS1-associated mitochondrial dynamics defects delay neuronal development.
    causal_link_type: DIRECT
  - target: Retinal Ganglion Cell and CNS Neuron Degeneration
    description: >-
      Severe mitochondrial failure lowers stress resilience in CISD2-deficient
      neurons and contributes to neuronal loss.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:27434582
    reference_title: "Role of Mitochondrial Dynamics in Neuronal Development: Mechanism for Wolfram Syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We show that down-regulation of WFS1 in neurons leads to dramatic changes in mitochondrial dynamics (inhibited mitochondrial fusion, altered mitochondrial trafficking, and augmented mitophagy), delaying neuronal development."
    explanation: >-
      Documents the specific mitochondrial-dynamics abnormalities caused by WFS1
      deficiency.
  - reference: PMID:27434582
    reference_title: "Role of Mitochondrial Dynamics in Neuronal Development: Mechanism for Wolfram Syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Importantly, ER stress, impaired Ca2+ homeostasis, altered mitochondrial dynamics, and delayed neuronal development are causatively related events because interventions at all these levels improved the downstream processes."
    explanation: >-
      Establishes the causal ordering of stress, calcium, mitochondrial, and
      developmental defects by intervention at each level.
  - reference: PMID:41299767
    reference_title: "CISD2 ensures adequate ER-mitochondrial coupling, critically supporting mitochondrial function in neurons."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Correlating with the profound changes in cellular Ca2+ handling, mitochondrial function (oxygen consumption rate, ATP production, mitochondrial potential maintenance) declined severely, while autophagic flux was increased."
    explanation: >-
      Directly measures severe mitochondrial bioenergetic dysfunction after CISD2
      loss in human iPSC-derived cortical neurons.

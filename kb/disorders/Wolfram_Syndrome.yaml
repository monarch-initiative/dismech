experimental_models:
- name: CRISPR-corrected patient iPSC-derived beta cells
  experimental_model_type: IPSC_DERIVED_MODEL
  description: >-
    CRISPR-Cas9 correction of a pathogenic WFS1 variant in induced pluripotent stem
    cells from a patient with Wolfram syndrome, differentiated to stem-cell-derived
    beta cells. This is the most concrete route to replacing beta cells rather than
    protecting them, and it demonstrates that the beta cell defect is reversible at
    the genetic level.
  publication: PMID:32321868
  modeled_mechanisms:
  - target: Insulin Deficiency
    relationship: RESCUES
    fidelity: MODERATE
    description: >-
      Correcting the WFS1 variant restored robust dynamic insulin secretion in
      vitro. Transplantation of the corrected human beta cells separately reversed
      streptozotocin-induced diabetes in mice.
    limitations: >-
      Transplantation was into mice with streptozocin-induced diabetes rather than
      into patients, so the therapeutic claim is preclinical and the diabetes
      reversed was chemically induced rather than WFS1-driven. The model addresses
      only the beta cell arm and says nothing about the neurodegenerative arm,
      which is what determines survival.
    readouts:
    - name: Glucose-responsive insulin secretion in corrected beta cells
      target: Insulin Deficiency
      direction: RESTORED
      interpretation: >-
        Dynamic insulin secretion in response to glucose is the direct in-vitro
        functional readout for relief of the insulin-deficiency node.
      evidence:
      - reference: PMID:32321868
        reference_title: Gene-edited human stem cell-derived β cells from a patient with monogenic diabetes reverse preexisting diabetes in mice.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "corrected WS SC-β cells performed robust dynamic insulin secretion in vitro in response to glucose"
        explanation: >-
          Isolates the human beta-cell in-vitro secretion result from the mouse
          transplantation result reported in the same source sentence.
    - name: Diabetes after corrected beta-cell transplantation
      target: Insulin Deficiency
      direction: RESTORED
      interpretation: >-
        Reversal of streptozotocin-induced diabetes is an intact-animal functional
        readout of insulin delivery by the transplanted corrected cells.
      evidence:
      - reference: PMID:32321868
        reference_title: Gene-edited human stem cell-derived β cells from a patient with monogenic diabetes reverse preexisting diabetes in mice.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "reversed preexisting streptozocin-induced diabetes after transplantation into mice."
        explanation: >-
          Restricts this evidence item to the in-vivo recipient result and does not
          present it as a human therapeutic outcome.
    evidence:
    - reference: PMID:32321868
      reference_title: Gene-edited human stem cell-derived β cells from a patient with monogenic diabetes reverse preexisting diabetes in mice.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "corrected WS SC-β cells performed robust dynamic insulin secretion in vitro in response to glucose"
      explanation: >-
        Directly supports restoration of insulin secretion in the corrected human
        beta-cell model.
    - reference: PMID:32321868
      reference_title: Gene-edited human stem cell-derived β cells from a patient with monogenic diabetes reverse preexisting diabetes in mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "reversed preexisting streptozocin-induced diabetes after transplantation into mice."
      explanation: >-
        Separately supports the intact-mouse transplantation result.
  - target: Unrestrained ER Stress Signaling Through ATF6-alpha
    relationship: RESCUES
    fidelity: MODERATE
    description: >-
      Genetic correction decreased expression of genes associated with
      endoplasmic reticulum stress in patient-derived beta cells.
    limitations: >-
      The transcriptomic readout is an ER-stress-associated gene set rather than a
      direct ATF6-alpha or HRD1 assay, so it supports relief of this graph branch
      without proving that every molecular step in the node was normalized.
    readouts:
    - name: Endoplasmic reticulum stress gene expression in corrected beta cells
      target: Unrestrained ER Stress Signaling Through ATF6-alpha
      direction: DECREASED
      interpretation: >-
        Reduced expression of ER-stress-associated genes after isogenic correction
        is the measured molecular correlate of relief of the ER-stress node.
      evidence:
      - reference: PMID:32321868
        reference_title: Gene-edited human stem cell-derived β cells from a patient with monogenic diabetes reverse preexisting diabetes in mice.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Single-cell transcriptomics showed that corrected SC-β cells displayed increased insulin and decreased expression of genes associated with endoplasmic reticulum stress."
        explanation: >-
          Reports the measured reduction in ER-stress-associated gene expression
          after correction in the human beta-cell model.
    evidence:
    - reference: PMID:32321868
      reference_title: Gene-edited human stem cell-derived β cells from a patient with monogenic diabetes reverse preexisting diabetes in mice.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Single-cell transcriptomics showed that corrected SC-β cells displayed increased insulin and decreased expression of genes associated with endoplasmic reticulum stress."
      explanation: >-
        Supports the distinct ER-stress rescue assertion without conflating it
        with the insulin-secretion or mouse-transplantation readouts.
- name: CISD2-knockout human iPSC-derived cortical neurons
  experimental_model_type: IPSC_DERIVED_MODEL
  description: >-
    Isogenic CRISPR-Cas9 CISD2-knockout human induced pluripotent stem cells
    differentiated into cortical neurons. The model isolates complete CISD2 loss
    and directly measures organelle contacts, calcium responses, mitochondrial
    bioenergetics, autophagic flux, and stress-induced apoptosis.
  publication: PMID:41299767
  modeled_mechanisms:
  - target: ER-Mitochondria Contact and Calcium Transfer Dysregulation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      CISD2-knockout neurons lose endoplasmic-reticulum to mitochondria contact
      sites and show severe loss of glutamate-evoked cytosolic calcium responses
      and mitochondrial calcium uptake.
    limitations: >-
      Complete engineered knockout may not reproduce every patient missense
      variant; one patient-derived fibroblast model showed increased rather than
      decreased contact-site abundance.
    evidence:
    - reference: PMID:41299767
      reference_title: "CISD2 ensures adequate ER-mitochondrial coupling, critically supporting mitochondrial function in neurons."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "However, studying the impact of Cisd2 deficiency in human induced pluripotent stem cell -derived cortical neurons revealed a severe loss of glutamate-evoked Ca2+ responses in cytosol and associated uptake in mitochondria due to loss of ER-mitochondria contact sites."
      explanation: >-
        Directly reports the contact-site and calcium-transfer phenotype in the
        disease-relevant human neuronal model.
discussions:
- discussion_id: wfs_genotype_phenotype_tension
  kind: CONTROVERSY
  prompt: >-
    Are there established genotype-phenotype correlations in Wolfram syndrome, or
    only emerging ones?
  attaches_to:
  - genetic#WFS1 Biallelic Loss of Function
  rationale: >-
    GeneReviews takes the conservative position that no correlations are
    established, and that remains defensible. A meta-analysis of 412 published
    patients reported genotypic-class correlations, and a 2026 registry analysis
    found a six-level WFS1 severity score informative for diabetes onset and more
    modestly for optic atrophy, but not for hearing loss or central diabetes
    insipidus. The newer analysis lacked time-to-event censoring and derived its
    three-tier simplification in the same dataset, so the score is a research
    instrument rather than a validated individual prognostic test.
  evidence:
  - reference: PMID:23429432
    reference_title: "Genotypic classification of patients with Wolfram syndrome: insights into the natural history of the disease and correlation with phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "New genotype-phenotype correlations were established, disease progression rate for the general population and for the genotypic classes has been calculated, and new diagnostic criteria have been proposed."
    explanation: >-
      The meta-analysis states that it established new correlations, which is the
      claim in tension with the conservative position.
  - reference: PMID:42524523
    reference_title: "Genotype-based severity scoring system in Wolfram Syndrome: correlation with onset of cardinal symptoms and WFS1 gene variant types."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The genotype-based severity score is most informative for diabetes mellitus, modestly informative for optic atrophy, and not currently useful for hearing loss or central diabetes insipidus."
    explanation: >-
      A large recent registry analysis supports phenotype-specific predictive
      signal but not a general genotype-to-course prediction; PARTIAL reflects its
      exploratory, internally assessed design.
- discussion_id: wfs_neurodevelopment_vs_neurodegeneration
  kind: OPEN_QUESTION
  prompt: >-
    How much of the brain deficit in Wolfram syndrome is failed development rather
    than degeneration, and what does that imply for when a disease-modifying
    therapy must start?
  attaches_to:
  - pathophysiology#Brainstem and Cerebellar Volume Loss
  rationale: >-
    Longitudinal morphometry shows both stalled white-matter growth and frank
    degeneration, and abnormalities are present in the youngest and mildest
    patients. If a meaningful share of the deficit is growth that never happened,
    then a neuroprotective therapy started after symptoms appear can at best halt
    decline and can never recover what was not built, which moves the therapeutic
    window earlier than a purely degenerative model implies. The relative
    contribution of the two processes has not been quantified.
  evidence:
  - reference: PMID:30979932
    reference_title: Evidence for altered neurodevelopment and neurodegeneration in Wolfram syndrome using longitudinal morphometry.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These patterns suggest that there may be early, stalled white matter development in Wolfram syndrome, with additional degenerative processes in both white and gray matter."
    explanation: >-
      States the two-process interpretation whose relative weighting is the open
      question.
- discussion_id: wfs_gene_environment_interaction
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does environmental or metabolic stress that raises the unfolded-protein load
    accelerate disease in WFS1-deficient cells in humans?
  attaches_to:
  - pathophysiology#Unrestrained ER Stress Signaling Through ATF6-alpha
  rationale: >-
    Because wolframin's job is buffering endoplasmic reticulum stress, any stressor
    that raises the unfolded-protein load (glucotoxicity, inflammation, hypoxia)
    should in principle hit harder in a WFS1-null cell. There is preclinical
    support in that WFS1 deficiency produces a chronic proinflammatory state, but
    no human data measure whether glycemic control or inflammatory burden modifies
    the rate of neurodegeneration. Until they do, better glycemic control should
    not be curated as a protective factor for the neurological disease.
  proposed_experiments:
  - experiment_id: wfs_glycemic_burden_vs_progression
    name: Glycemic and inflammatory burden versus neurodegeneration rate
    description: >-
      In an existing longitudinal Wolfram cohort with serial brain morphometry,
      relate cumulative glycemic exposure and circulating inflammatory markers to
      the rate of brainstem and ventral pontine volume loss, to test whether
      modifiable stress load changes the neurodegenerative trajectory.
  evidence:
  - reference: PMID:33693650
    reference_title: Novel mutations in the WFS1 gene are associated with Wolfram syndrome and systemic inflammation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The identification of a state of systemic chronic inflammation associated with WFS1 deficiency may pave the way to innovative and personalized therapeutic interventions in WS."
    explanation: >-
      Establishes the chronic inflammatory state that makes the gene-environment
      question mechanistically plausible.
- discussion_id: wfs_nfl_as_progression_marker
  kind: KNOWLEDGE_GAP
  prompt: >-
    Can serum neurofilament light chain serve as a treatment-response marker in
    Wolfram syndrome, given that it is elevated but does not track progression?
  attaches_to:
  - biochemical#Elevated Serum Neurofilament Light Chain
  rationale: >-
    Neurofilament light chain is clearly elevated and glial fibrillary acidic
    protein is not, which is a clean biological signal about axonal injury. But
    within the Wolfram group it did not change over time and did not correlate with
    clinical severity or neuroimaging measures, so it fails as a monitoring
    biomarker on the evidence available. Whether it moves under an effective
    therapy is a different question and remains untested, and the field needs a
    progression marker badly because every trial so far has had to rely on slow
    clinical endpoints.
  evidence:
  - reference: PMID:41929703
    reference_title: Neurofilament light chain but not glial fibrillary acidic protein serum levels are elevated in Wolfram syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Future studies may be warranted to determine if NfL could be a treatment-response marker in Wolfram syndrome clinical trials."
    explanation: >-
      States the open question in the authors' own terms.
- discussion_id: wfs_cisd2_treatment_generalization
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does the PB&TURSO result in WFS1-related Wolfram syndrome generalize to the
    CISD2-related subtype, which this entry models as reaching the same
    organelle-contact and calcium-transfer compartment by an independent route?
  attaches_to:
  - pathophysiology#Loss of CISD2 at Organelle Contact Membranes
  - pathophysiology#ER-Mitochondria Contact and Calcium Transfer Dysregulation
  - pathophysiology#Mitochondrial Dysfunction
  rationale: >-
    The HELIOS trial restricted enrollment to WFS1 Wolfram syndrome deliberately,
    to reduce heterogeneity, and the authors state that CISD2 Wolfram syndrome
    shares similar pathophysiology and may benefit. That is a hypothesis, not a
    result: no CISD2 participant was treated. The question matters here more than
    it would in most entries, because this entry already models CISD2 as an
    independent route into the shared ER-mitochondria contact compartment rather
    than as a WFS1 phenocopy — so convergence at that node is exactly the premise
    the generalization rests on, and exactly what an untested extrapolation would
    be assuming. Note also that the two subtypes diverge clinically (CISD2 disease
    notably lacks diabetes insipidus and adds bleeding tendency), so shared
    upstream mechanism does not by itself predict a shared treatment response
    profile across endpoints.

    The contact-site direction sharpens this further, and cuts against a simple
    read-across. WFS1-null patient fibroblasts show *reduced* ER-mitochondria
    interactions and calcium exchange; a CISD2 missense variant causing classical
    Wolfram phenotype instead shows *increased* ER-mitochondria contact with a
    hyperfused mitochondrial network and no overt ER stress, while complete CISD2
    loss in human cortical neurons shows loss of contact sites again. So the
    direction of the contact-site abnormality is not uniform even within CISD2, let
    alone shared with WFS1 — which is exactly why this entry models the convergence
    node as direction-neutral dysregulation. A chemical chaperone and ER-stress
    modulator tuned to the WFS1 arm has no guaranteed effect on a lesion that
    perturbs the same compartment in the opposite direction, and the CISD2 missense
    finding explicitly reports the absence of overt ER stress that PB&TURSO is meant
    to relieve.
  proposed_experiments:
  - experiment_id: exp_wfs_cisd2_pbturso_response
    name: PB&TURSO response in CISD2-related Wolfram syndrome
    description: >-
      Extend an open-label PB&TURSO cohort to genetically confirmed CISD2 Wolfram
      syndrome with residual beta cell function, using the same stimulated
      C-peptide primary endpoint, and compare the response trajectory against the
      WFS1 cohort. Given the rarity, an n-of-1 series with pre-treatment
      natural-history run-in is more realistic than a parallel-group design.
    decision_criterion: >-
      Whether a stimulated C-peptide response in CISD2 participants falls within
      the range observed in the WFS1 cohort discriminates convergence at the
      shared contact-site node from a WFS1-specific chaperone effect.
    would_support:
    - >-
      A comparable stimulated C-peptide and glycemic response in CISD2
      participants, supporting the shared-compartment premise and licensing
      subtype-agnostic treatment claims.
    would_refute:
    - >-
      Absent or markedly attenuated response in CISD2 participants, which would
      indicate the benefit depends on something specific to wolframin loss rather
      than on the shared ER-mitochondria contact defect.
  evidence:
  - reference: PMID:42138079
    reference_title: Phase II trial of sodium phenylbutyrate and taurursodiol in Wolfram syndrome.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The trial focused on WFS1 WS to reduce heterogeneity, though CISD2 WS shares similar pathophysiology and may benefit."
    explanation: >-
      The authors' own statement of both the restriction and the untested
      generalization, which is what makes this a gap rather than a finding.
  - reference: PMID:28335035
    reference_title: A novel CISD2 mutation associated with a classical Wolfram syndrome phenotype alters Ca2+ homeostasis and ER-mitochondria interactions.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "This Ca2+ dysregulation was associated with increased ER-mitochondria contact, a swollen ER lumen and a hyperfused mitochondrial network in the absence of overt ER stress."
    explanation: >-
      The CISD2 missense arm perturbs the shared compartment in the opposite
      direction from WFS1 loss and without overt ER stress, which is the concrete
      reason a WFS1-tuned ER-stress modulator may not transfer.
  - reference: PMID:30352948
    reference_title: ER-mitochondria cross-talk is regulated by the Ca(2+) sensor NCS1 and is impaired in Wolfram syndrome.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "In addition, we found that NCS1 abundance was reduced in WFS1-null patient fibroblasts, which showed reduced ER-mitochondria interactions and Ca2+ exchange."
    explanation: >-
      The WFS1 comparator direction — reduced interactions and exchange — against
      which the CISD2 missense finding is opposite.
  notes: >-
    Recorded as a gap, not as a treatment claim: PB&TURSO is deliberately not
    curated onto the CISD2 subtype anywhere in this entry, and should not be until
    a CISD2 participant has actually been treated.
differential_diagnoses:
- name: Type 1 Diabetes Mellitus
  description: >-
    The commonest misdiagnosis, and the reason Wolfram syndrome is typically
    identified years late. Distinguished by autoimmunity: islet autoantibodies are
    positive in type 1 diabetes and negative here, HLA risk haplotypes are present
    there and absent here, and C-peptide falls faster. Genetic testing of every
    child with autoantibody-negative, non-HLA-associated insulin-dependent diabetes
    is the highest-yield case-finding intervention available.
  distinguishing_features:
  - Islet autoantibodies positive in type 1 diabetes, negative in Wolfram syndrome
  - HLA-DR3 and DR4 risk haplotypes present in type 1 diabetes only
  - Optic atrophy, diabetes insipidus, and deafness do not occur in isolated type 1 diabetes
  evidence:
  - reference: PMID:20160352
    reference_title: Wolfram syndrome 1 gene negatively regulates ER stress signaling in rodent and human cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Wolfram syndrome is an autosomal-recessive disorder characterized by insulin-dependent diabetes mellitus, caused by nonautoimmune loss of beta cells, and neurological dysfunctions."
    explanation: >-
      The non-autoimmune basis of the beta cell loss is what separates this from
      type 1 diabetes.
- name: Mitochondrial Diabetes and Deafness
  description: >-
    Maternally inherited diabetes and deafness from the m.3243A>G variant overlaps
    clinically and was historically confused with Wolfram syndrome. Distinguished
    by maternal inheritance, the mitochondrial tRNA-Leu 3243 variant, and the
    absence of the autosomal recessive family pattern.
  distinguishing_features:
  - Maternal inheritance pattern rather than autosomal recessive
  - Mitochondrial tRNA-Leu 3243 variant present
  - Optic atrophy is not the typical visual lesion
  evidence:
  - reference: PMID:7490992
    reference_title: "Neurodegeneration and diabetes: UK nationwide study of Wolfram (DIDMOAD) syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Family studies indicate autosomal recessive inheritance with a carrier frequency of one in 354, an absence of a maternal history of diabetes or deafness, and an absence of the mitochondrial tRNA Leu (3243) mutation."
    explanation: >-
      Explicitly excludes the mitochondrial mimic on both inheritance pattern and
      genotype.
- name: Nonclassic (Dominant) WFS1 Spectrum Disorder
  description: >-
    Heterozygous WFS1 variants cause a distinct, dominantly inherited spectrum:
    DFNA6/14/38 low-frequency sensorineural hearing loss, Wolfram-like syndrome
    with adult-onset diabetes plus hearing loss and juvenile optic atrophy, and a
    de novo neonatal diabetes with congenital deafness and cataracts. The
    inheritance, the audiogram shape (low-frequency dominant versus high-frequency
    recessive), and the molecular mechanism (dominant-negative versus null) all
    differ. This entry deliberately covers only the recessive disease; the dominant
    spectrum belongs in separate entries.
  distinguishing_features:
  - Single heterozygous WFS1 variant with dominant transmission
  - Low-frequency rather than high-frequency sensorineural hearing loss
  - Milder or partial phenotype without the full DIDMOAD sequence
  evidence:
  - reference: PMID:20301750
    reference_title: WFS1 Spectrum Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nonclassic WFS1-SD. The diagnosis is established in a proband with suggestive findings and a heterozygous pathogenic (or likely pathogenic) variant identified by molecular genetic testing."
    explanation: >-
      GeneReviews formalizes the heterozygous, nonclassic spectrum as a separate
      diagnostic category from classic biallelic disease.
notes: >-
  Scope. This entry covers classic, autosomal recessive Wolfram syndrome under the
  umbrella MONDO term, with WFS1-related (WS1) and CISD2-related (WS2) forms as
  subtypes. The dominantly inherited nonclassic WFS1 spectrum (DFNA6/14/38,
  Wolfram-like syndrome, and the de novo neonatal diabetes-deafness-cataract
  presentation) is deliberately excluded and recorded as a differential instead.
  Inheritance, audiogram shape, and molecular mechanism all differ between the two,
  and blending them into one entry would misstate all three.

  TREATWOLFRAM. The randomized, double-blind, placebo-controlled sodium valproate
  trial (NCT03717909) is the most rigorous study the field has run, and it is
  reported to have missed its primary endpoint on the rate of visual acuity loss.
  At the time of curation only the trial protocol (PMID:40010822) is indexed in
  PubMed; there is no peer-reviewed results paper to cite. Valproate is therefore
  deliberately absent from treatments rather than being listed with a snippet that
  cannot support the claim, and the reported negative result is recorded here
  instead. It should be curated properly once the results paper appears.

  Nonclassic WFS1 disease accounts for roughly 15% of molecularly confirmed cases
  in UK specialist clinics per GeneReviews, so the recessive-only scope of this
  entry is a real restriction on coverage rather than a technicality.

  Deep research. Curated from a claude_code deep-research report
  (research/Wolfram_Syndrome-deep-research-claude_code.md), whose own reference
  validation reported 51/51 references verified with a confabulation rate of 0.0.
  Every snippet used here was independently re-verified against the cached PubMed
  record.
clinical_trials:
- name: NCT02829268
  phase: PHASE_II
  status: COMPLETED
  description: >-
    Open-label phase Ib/IIa trial of dantrolene sodium, the first clinical trial
    ever conducted in Wolfram syndrome. Safety and tolerability were the primary
    objective, with beta cell function, visual acuity, and neurological function
    as secondary. Published as PMID:34185708. Dantrolene was well tolerated and
    did not improve beta cell function, visual acuity, or neurological function.
  target_phenotypes:
  - preferred_term: Diabetes mellitus
    term:
      id: HP:0000819
      label: Diabetes mellitus
  - preferred_term: Optic atrophy
    term:
      id: HP:0000648
      label: Optic atrophy
  evidence:
  - reference: clinicaltrials:NCT02829268
    reference_title: A Phase 1b/2a Trial of Dantrolene Sodium in Pediatric and Adult Patients With Wolfram Syndrome
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The purpose of this study is to assess the safety and tolerability of dantrolene sodium in patients with Wolfram syndrome."
    explanation: >-
      Registry record establishing the trial and its primary objective.
  - reference: PMID:34185708
    reference_title: A phase Ib/IIa clinical trial of dantrolene sodium in patients with Wolfram syndrome.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Visual acuity and neurological functions were not improved by 6-month dantrolene sodium."
    explanation: >-
      The published result, which was negative on the efficacy endpoints.
- name: NCT05676034
  phase: PHASE_II
  status: ACTIVE_NOT_RECRUITING
  description: >-
    HELIOS, a single-center, single-arm, open-label phase II trial of AMX0035
    (sodium phenylbutyrate and taurursodiol) in twelve adults with Wolfram
    syndrome. Reported improved or stabilized pancreatic function, vision, and
    symptom burden at 24 and 48 weeks (PMID:42138079). The uncontrolled design is
    the reason the entry grades that result PARTIAL.
  target_phenotypes:
  - preferred_term: Diabetes mellitus
    term:
      id: HP:0000819
      label: Diabetes mellitus
  - preferred_term: Optic atrophy
    term:
      id: HP:0000648
      label: Optic atrophy
  evidence:
  - reference: clinicaltrials:NCT05676034
    reference_title: A Phase II Study of Safety and Efficacy of AMX0035 in Adult Patients With Wolfram Syndrome
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study is an open label Phase II study to evaluate the safety and efficacy of AMX0035 in adults with Wolfram syndrome."
    explanation: >-
      Registry record establishing the open-label single-arm design that qualifies
      the reported result.
- name: NCT03717909
  phase: PHASE_II
  status: COMPLETED
  description: >-
    TREATWOLFRAM, a randomized double-blind placebo-controlled trial of sodium
    valproate across six international centers, and the most rigorous study the
    field has run. Recruitment was stopped in November 2022 with 63 of a planned
    70 patients enrolled. The trial is reported to have missed its primary
    endpoint on the rate of visual acuity loss, but only the protocol paper
    (PMID:40010822) is indexed in PubMed at the time of curation, so that result
    is recorded in the entry notes rather than as evidence, and valproate is
    deliberately absent from treatments.
  target_phenotypes:
  - preferred_term: Optic atrophy
    term:
      id: HP:0000648
      label: Optic atrophy
  evidence:
  - reference: clinicaltrials:NCT03717909
    reference_title: "A Pivotal, International, Randomised, Double-blind, Efficacy and Safety Trial of Sodium Valproate, in Paediatric and Adult Patients With Wolfram Syndrome"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "70 paediatric and adult patients were initially planned to be randomised 2:1 to receive either sodium valproate or placebo at 6 international centres. 63 patients were recruited when a decision was made to stop the study recruitment in November 2022."
    explanation: >-
      Registry record establishing the randomized placebo-controlled design and
      the actual enrollment, which is the design context for the reported but
      unpublished negative result.
- name: NCT02882477
  phase: PHASE_III
  status: UNKNOWN
  description: >-
    A combined phase II/III single-group study in genetically diagnosed WFS2 that
    offered deferiprone plus acetylcysteine, with incretin-based therapy added for
    participants with diabetes. The registry status is UNKNOWN as of 2026-08-19,
    and no peer-reviewed efficacy result was identified; this is a trial record,
    not a treatment recommendation.
  target_phenotypes:
  - preferred_term: Diabetes mellitus
    term:
      id: HP:0000819
      label: Diabetes mellitus
  - preferred_term: Abnormal bleeding
    term:
      id: HP:0001892
      label: Abnormal bleeding
  evidence:
  - reference: clinicaltrials:NCT02882477
    reference_title: Treatment of Wolfram Syndrome Type 2 With the Chelator Deferiprone, and Incretin Based Therapy
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients who are genetically diagnosed with the recently reported and rare Wolfram syndrome type 2 ( WFS2) and have the degenerative and symptomatic disease including signs such as diabetes, platelet aggregation defect or visual problems will be asked to participate in this study."
    explanation: >-
      Establishes that the study is specifically WFS2 and targets diabetes,
      bleeding-related platelet dysfunction, and visual disease.
- name: NCT04940572
  phase: PHASE_II
  status: UNKNOWN
  description: >-
    AUDIOWOLF, a nonrandomized open-label phase II study of three years of sodium
    valproate in participants with biallelic WFS1 disease and sensorineural hearing
    loss. The registry status is UNKNOWN as of 2026-08-19, and no peer-reviewed
    efficacy result was identified.
  target_phenotypes:
  - preferred_term: Sensorineural hearing impairment
    term:
      id: HP:0000407
      label: Sensorineural hearing impairment
  evidence:
  - reference: clinicaltrials:NCT04940572
    reference_title: "AUDIOWOLF: A Phase II, Open-label, Efficacy Study of Daily Administration of Sodium Valproate in Patients Clinically Affected by Wolfram Syndrome Due to Monogenic Mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Open label, phase II study non randomized single group assignment of 20 evaluable patients 13 years and older, over 37,5 kg body-weight, with sensorineural hearing loss of at least 20 dB at 8 kHz in high frequency average (HFA), and with documented genetic mutations in the WFS1 gene and with at least one other major documented clinical symptom pertaining to Wolfram syndrome (i.e. diabetes mellitus, diabetes insipidus, optic atrophy)."
    explanation: >-
      Establishes the WFS1 genotype requirement, hearing-loss endpoint population,
      and uncontrolled phase II design.

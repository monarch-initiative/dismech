name: Wolfram Syndrome
creation_date: "2026-08-15T00:00:00Z"
category: Mendelian
parents:
- Neurodegenerative Disease
- Monogenic Diabetes
disease_term:
  preferred_term: Wolfram Syndrome
  term:
    id: MONDO:0018105
    label: Wolfram syndrome
synonyms:
- DIDMOAD
- DIDMOAD syndrome
- diabetes insipidus, diabetes mellitus, optic atrophy and deafness syndrome
description: >-
  Wolfram syndrome is an autosomal recessive neurodegenerative disorder caused by
  failure of either of two endoplasmic-reticulum and organelle-contact proteins.
  The cells that suffer most are insulin-secreting pancreatic beta cells and
  long-projection neurons. Biallelic loss-of-function variants in
  WFS1 account for the large majority of cases; biallelic CISD2 variants cause the
  rarer Wolfram syndrome 2. Wolframin normally restrains the unfolded protein
  response by stabilizing the E3 ubiquitin ligase HRD1 and routing ATF6-alpha to
  the proteasome, maintains endoplasmic reticulum calcium stores, and supports
  endoplasmic-reticulum to mitochondria contact sites. CISD2 loss reaches the same
  calcium-transfer and mitochondrial compartment through a distinct route. These
  defects converge on beta-cell dysfunction or loss and neuronal injury. In WS1,
  this typically reads out as the DIDMOAD sequence: insulin-requiring
  autoantibody-negative diabetes mellitus in the first decade, then optic atrophy,
  then sensorineural hearing loss and central diabetes insipidus, then neurogenic
  bladder and brainstem or cerebellar dysfunction. WS2 shares diabetes mellitus,
  optic atrophy, and hearing impairment but usually lacks diabetes insipidus and
  instead adds upper intestinal ulceration and a bleeding tendency. In the
  historical, predominantly WS1 natural-history cohort, death occurred at a median
  age around 30 years and was usually from central respiratory failure with
  brainstem atrophy. Brain volume abnormalities are already measurable at the
  earliest clinical presentation, so part of the deficit is failed development
  rather than degeneration alone. There is no approved disease-modifying therapy.

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in a novel gene (WFS1) encoding a putative transmembrane protein were found in all affected individuals in six WFS families, and these mutations were associated with the disease phenotype."
    explanation: >-
      Establishes WFS1 variants as causative in all affected individuals across six
      families.
  - reference: PMID:23429432
    reference_title: "Genotypic classification of patients with Wolfram syndrome: insights into the natural history of the disease and correlation with phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "More than 200 different variations in WFS1 have been described in patients with Wolfram syndrome, which complicates the establishment of clear genotype-phenotype correlation."
    explanation: >-
      Documents the allelic heterogeneity that makes genotype and phenotype
      correlation difficult.
  - reference: PMID:23429432
    reference_title: "Genotypic classification of patients with Wolfram syndrome: insights into the natural history of the disease and correlation with phenotype."

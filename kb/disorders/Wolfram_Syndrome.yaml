name: Wolfram Syndrome
creation_date: "2026-08-15T00:00:00Z"
category: Mendelian
parents:
- Neurodegenerative Disease
- Monogenic Diabetes
disease_term:
  preferred_term: Wolfram Syndrome
  term:
    id: MONDO:0018105
    label: Wolfram syndrome
synonyms:
- DIDMOAD
- DIDMOAD syndrome
- diabetes insipidus, diabetes mellitus, optic atrophy and deafness syndrome
description: >-
  Wolfram syndrome is an autosomal recessive neurodegenerative disorder in which a
  single endoplasmic-reticulum housekeeping protein fails, and the cells that
  suffer are the ones with the largest export orders: insulin-secreting pancreatic
  beta cells and long-projection neurons. Biallelic loss-of-function variants in
  WFS1 account for the large majority of cases; biallelic CISD2 variants cause the
  rarer Wolfram syndrome 2. Wolframin normally restrains the unfolded protein
  response by stabilizing the E3 ubiquitin ligase HRD1 and routing ATF6-alpha to
  the proteasome, maintains endoplasmic reticulum calcium stores, and supports
  endoplasmic reticulum to mitochondria contact sites. Its loss leaves the unfolded
  protein response chronically engaged, depletes endoplasmic reticulum calcium,
  uncouples the organelle contact sites that deliver calcium to mitochondria, and
  converges on apoptosis of beta cells and neurons. Clinically this reads out as
  the DIDMOAD sequence: insulin-requiring autoantibody-negative diabetes mellitus
  in the first decade, then optic atrophy, then sensorineural hearing loss and
  central diabetes insipidus, then neurogenic bladder and brainstem or cerebellar
  dysfunction. Death, historically at a median around 30 years, is usually from
  central respiratory failure with brainstem atrophy. Brain volume abnormalities
  are already measurable at the earliest clinical presentation, so part of the
  deficit is failed development rather than degeneration alone. There is no
  approved disease-modifying therapy.
has_subtypes:
- name: WS1
  display_name: Wolfram syndrome 1 (WFS1-related)
  subtype_term:
    preferred_term: Wolfram syndrome 1
    term:
      id: MONDO:0009101
      label: Wolfram syndrome 1
  description: >-
    The classic and by far the commoner form, caused by biallelic WFS1 variants,
    accounting for roughly 90% of cases. Diabetes mellitus and optic atrophy before
    age 16 are the defining pair; diabetes insipidus, sensorineural deafness,
    neurogenic bladder, and brainstem or cerebellar neurodegeneration follow.
  genes:
  - preferred_term: WFS1
    term:
      id: hgnc:12762
      label: WFS1
  evidence:
  - reference: PMID:39202345
    reference_title: "Wolfram Syndrome 1: A Neuropsychiatric Perspective on a Rare Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in the WFS1 gene, located on chromosome 4p16, account for approximately 90% of WS1 cases."
    explanation: >-
      Quantifies the share of Wolfram syndrome attributable to WFS1 variants.
- name: WS2
  display_name: Wolfram syndrome 2 (CISD2-related)
  subtype_term:
    preferred_term: Wolfram syndrome 2
    term:
      id: MONDO:0011502
      label: Wolfram syndrome 2
  description: >-
    A rarer form caused by biallelic variants in CISD2, which encodes ERIS, a small
    protein of the mitochondria-associated endoplasmic reticulum membrane. ERIS
    localizes to the same organelle as wolframin but does not interact with it
    directly, so the two genes converge on the same compartment by separate routes.
    Clinically WS2 typically lacks diabetes insipidus and adds upper intestinal
    ulceration and a bleeding tendency.
  genes:
  - preferred_term: CISD2
    term:
      id: hgnc:24212
      label: CISD2
  evidence:
  - reference: PMID:39527371
    reference_title: SID/SIEDP expert consensus on optimizing clinical strategies for early detection and management of wolfram syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Additionally, a second gene, CISD2, located on chromosome 4q22, has been identified in individuals with WFS type 2 (WFS2), which leads to early onset optic atrophy, diabetes mellitus, deafness, bleeding tendency and upper intestinal ulcers, a shortened lifespan, but notably not diabetes insipidus."
    explanation: >-
      Defines the CISD2-related subtype and its clinical discriminators, including
      the characteristic absence of diabetes insipidus.
pathophysiology:
- name: Loss of Wolframin at the Endoplasmic Reticulum Membrane
  biological_scale: MOLECULAR
  description: >-
    Biallelic loss-of-function variants in WFS1 remove wolframin, a multipass
    transmembrane glycoprotein of the endoplasmic reticulum. Wolframin holds three
    jobs at once: it negatively regulates the unfolded protein response, it
    maintains endoplasmic reticulum calcium stores, and it supports the contact
    sites where the endoplasmic reticulum meets mitochondria. Nothing downstream in
    this entry is a separate insult; every later node is one of those three jobs
    going unattended.
  genes:
  - preferred_term: WFS1
    term:
      id: hgnc:12762
      label: WFS1
  cellular_components:
  - preferred_term: endoplasmic reticulum membrane
    term:
      id: GO:0005789
      label: endoplasmic reticulum membrane
  downstream:
  - target: Unrestrained ER Stress Signaling Through ATF6-alpha
    description: >-
      Loss of the wolframin brake releases ATF6-alpha and the unfolded protein
      response.
    causal_link_type: DIRECT
  - target: ER Calcium Depletion and Failure of ER-Mitochondria Contact
    description: >-
      Loss of wolframin removes its contribution to endoplasmic reticulum calcium
      handling and to the NCS1-IP3R complex at contact sites.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:9771706
    reference_title: A gene encoding a transmembrane protein is mutated in patients with diabetes mellitus and optic atrophy (Wolfram syndrome).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in a novel gene (WFS1) encoding a putative transmembrane protein were found in all affected individuals in six WFS families, and these mutations were associated with the disease phenotype."
    explanation: >-
      The gene-identification study establishing WFS1 variants as the cause of
      Wolfram syndrome.
  - reference: PMID:9771706
    reference_title: A gene encoding a transmembrane protein is mutated in patients with diabetes mellitus and optic atrophy (Wolfram syndrome).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "WFS1 appears to function in survival of islet beta-cells and neurons."
    explanation: >-
      Identifies the two cell populations whose survival depends on wolframin,
      which is the whole shape of the clinical phenotype.
- name: Unrestrained ER Stress Signaling Through ATF6-alpha
  biological_scale: MOLECULAR
  description: >-
    Wolframin's mechanism of restraint is specific and now well defined. It
    stabilizes the E3 ubiquitin ligase HRD1, brings the transcription factor
    ATF6-alpha to the proteasome, and enhances its ubiquitination and degradation.
    Without wolframin, ATF6-alpha accumulates, its target genes are derepressed,
    and the endoplasmic reticulum stress response element promoter is activated.
    Beta cells from WFS1-deficient mice and lymphocytes from patients show the same
    dysregulation, with ATF6-alpha up and HRD1 down. A chronically engaged unfolded
    protein response is not a louder version of a normal signal; it is an alarm
    that never stops, and the building is eventually evacuated for good.
  biological_processes:
  - preferred_term: ATF6-mediated unfolded protein response
    term:
      id: GO:0036500
      label: ATF6-mediated unfolded protein response
    modifier: INCREASED
  - preferred_term: ATF6-alpha ubiquitination and proteasomal degradation
    term:
      id: GO:0016567
      label: protein ubiquitination
    modifier: DECREASED
  downstream:
  - target: Beta Cell Apoptosis and Insulin Deficiency
    description: >-
      Chronic unresolvable endoplasmic reticulum stress drives beta cell death.
    causal_link_type: DIRECT
  - target: Retinal Ganglion Cell and CNS Neuron Degeneration
    description: >-
      The same chronic stress response drives apoptosis in long-projection
      neurons.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:20160352
    reference_title: Wolfram syndrome 1 gene negatively regulates ER stress signaling in rodent and human cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Moreover, WFS1 stabilized the E3 ubiquitin ligase HRD1, brought ATF6alpha to the proteasome, and enhanced its ubiquitination and proteasome-mediated degradation, leading to suppression of ER stress signaling."
    explanation: >-
      Defines the molecular mechanism by which wolframin restrains the ATF6 arm of
      the unfolded protein response.
  - reference: PMID:20160352
    reference_title: Wolfram syndrome 1 gene negatively regulates ER stress signaling in rodent and human cells.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Consistent with these data, beta cells from WFS1-deficient mice and lymphocytes from patients with Wolfram syndrome exhibited dysregulated ER stress signaling through upregulation of ATF6alpha and downregulation of HRD1."
    explanation: >-
      Confirms the same ATF6-alpha and HRD1 dysregulation in patient cells, not
      only in engineered cell lines.
- name: ER Calcium Depletion and Failure of ER-Mitochondria Contact
  biological_scale: CELLULAR
  description: >-
    Wolframin forms a complex with neuronal calcium sensor 1 (NCS1) and the
    inositol 1,4,5-trisphosphate receptor to move calcium from the endoplasmic
    reticulum into mitochondria at mitochondria-associated membranes. In WFS1-null
    patient fibroblasts, NCS1 abundance falls, endoplasmic reticulum to
    mitochondria contacts are reduced, and calcium exchange between the two
    organelles drops. Restoring NCS1 restores both the contacts and the calcium
    transfer, which is what makes this a causal node rather than a correlate.
  biological_processes:
  - preferred_term: endoplasmic reticulum calcium ion homeostasis
    term:
      id: GO:0032469
      label: endoplasmic reticulum calcium ion homeostasis
    modifier: DYSREGULATED
  cellular_components:
  - preferred_term: mitochondria-associated endoplasmic reticulum membrane
    term:
      id: GO:0044233
      label: mitochondria-associated endoplasmic reticulum membrane contact site
  downstream:
  - target: Mitochondrial Dysfunction and Impaired Neuronal Development
    description: >-
      Reduced calcium delivery to mitochondria impairs their function and
      dynamics.
    causal_link_type: DIRECT
  - target: Cytosolic Calcium Dysregulation and Calpain Activation
    description: >-
      Calcium that is not retained in the endoplasmic reticulum or handed to
      mitochondria raises cytosolic calcium.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:30352948
    reference_title: ER-mitochondria cross-talk is regulated by the Ca(2+) sensor NCS1 and is impaired in Wolfram syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here, we showed that WFS1 formed a complex with neuronal calcium sensor 1 (NCS1) and inositol 1,4,5-trisphosphate receptor (IP3R) to promote Ca2+ transfer between the ER and mitochondria."
    explanation: >-
      Establishes the physical complex through which wolframin supports organelle
      calcium transfer.
  - reference: PMID:30352948
    reference_title: ER-mitochondria cross-talk is regulated by the Ca(2+) sensor NCS1 and is impaired in Wolfram syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In addition, we found that NCS1 abundance was reduced in WFS1-null patient fibroblasts, which showed reduced ER-mitochondria interactions and Ca2+ exchange."
    explanation: >-
      Demonstrates the defect in patient-derived cells rather than only in
      engineered knockdowns.
  - reference: PMID:17846994
    reference_title: "A homozygous mutation in a novel zinc-finger protein, ERIS, is responsible for Wolfram syndrome 2."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "Lymphoblastoid cells from affected individuals show a significantly greater rise in intracellular calcium when stimulated with thapsigargin, compared with controls, although no difference was observed in resting concentrations of intracellular calcium."
    explanation: >-
      Shows that the CISD2 route into this node also produces abnormal calcium
      handling. PARTIAL because the abnormality is a stimulated response in WS2
      lymphoblastoid cells, not the same measured ER-mitochondria transfer defect
      demonstrated for WFS1.
- name: Mitochondrial Dysfunction and Impaired Neuronal Development
  biological_scale: CELLULAR
  description: >-
    Reduced calcium delivery starves the calcium-dependent dehydrogenases of the
    tricarboxylic acid cycle and lowers ATP output, but the more distinctive
    consequence is to mitochondrial dynamics. WFS1 knockdown in neurons inhibits
    mitochondrial fusion, alters mitochondrial trafficking, and augments mitophagy,
    and these changes delay neuronal development. Crucially, the chain from
    endoplasmic reticulum stress through calcium dyshomeostasis to altered dynamics
    to delayed development is causal rather than merely associated, because
    intervening at any level improves the downstream steps. This is the cellular
    correlate of the neurodevelopmental limb visible on brain imaging.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: mitochondrion organization
    term:
      id: GO:0007005
      label: mitochondrion organization
    modifier: DYSREGULATED
  downstream:
  - target: Brainstem and Cerebellar Volume Loss
    description: >-
      Impaired mitochondrial function and neuronal development contribute to the
      failure of white-matter growth and to later degeneration.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:27434582
    reference_title: "Role of Mitochondrial Dynamics in Neuronal Development: Mechanism for Wolfram Syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We show that down-regulation of WFS1 in neurons leads to dramatic changes in mitochondrial dynamics (inhibited mitochondrial fusion, altered mitochondrial trafficking, and augmented mitophagy), delaying neuronal development."
    explanation: >-
      Documents the specific mitochondrial-dynamics abnormalities and their effect
      on neuronal development under WFS1 deficiency.
  - reference: PMID:27434582
    reference_title: "Role of Mitochondrial Dynamics in Neuronal Development: Mechanism for Wolfram Syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Importantly, ER stress, impaired Ca2+ homeostasis, altered mitochondrial dynamics, and delayed neuronal development are causatively related events because interventions at all these levels improved the downstream processes."
    explanation: >-
      Establishes the causal ordering of the stress, calcium, mitochondrial, and
      developmental steps by intervention at each level.
- name: Cytosolic Calcium Dysregulation and Calpain Activation
  biological_scale: CELLULAR
  description: >-
    Calcium that escapes endoplasmic reticulum retention raises cytosolic calcium
    and hyperactivates calpain. In WFS1-knockout insulinoma cells this impairs
    calcium homeostasis and Akt signaling and reduces both cell viability and
    glucose-stimulated insulin secretion. The node is defined by what rescues it:
    re-expressing WFS1, overexpressing NCS1, or treating with a calpain inhibitor
    or ibudilast all reverse the deficits, which is why the calcium axis rather
    than the stress axis alone has been the target of every therapeutic attempt so
    far.
  cell_types:
  - preferred_term: pancreatic beta cell
    term:
      id: CL:0000169
      label: type B pancreatic cell
  downstream:
  - target: Beta Cell Apoptosis and Insulin Deficiency
    description: >-
      Calcium dyshomeostasis and calpain activation reduce beta cell viability and
      insulin secretion.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:32632005
    reference_title: Calpain inhibitor and ibudilast rescue β cell functions in a cellular model of Wolfram syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Knockout (KO) of WFS1 in rat insulinoma (INS1) cells impaired calcium homeostasis and protein kinase B/Akt signaling and, subsequently, decreased cell viability and glucose-stimulated insulin secretion."
    explanation: >-
      Links WFS1 loss to calcium dyshomeostasis and to the two beta cell functional
      readouts that matter clinically.
  - reference: PMID:32632005
    reference_title: Calpain inhibitor and ibudilast rescue β cell functions in a cellular model of Wolfram syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Targeting calcium homeostasis with reexpression of WFS1, overexpression of WFS1's interacting partner neuronal calcium sensor-1 (NCS1), or treatment with calpain inhibitor and ibudilast reversed deficits observed in WFS1-KO cells."
    explanation: >-
      Four independent rescues of the same node establish calcium dyshomeostasis as
      causally upstream of the beta cell deficits.
- name: Beta Cell Apoptosis and Insulin Deficiency
  biological_scale: CELLULAR
  description: >-
    Chronic unresolvable endoplasmic reticulum stress and calcium dyshomeostasis
    converge on intrinsic apoptosis in pancreatic beta cells. The loss is
    non-autoimmune, which is the practical diagnostic wedge: islet autoantibodies
    are negative, there is no HLA risk haplotype, and C-peptide is preserved longer
    than in type 1 diabetes. Alpha cells are relatively spared, consistent with the
    idea that the vulnerability tracks secretory load on the endoplasmic reticulum
    rather than anything islet-wide.
  cell_types:
  - preferred_term: pancreatic beta cell
    term:
      id: CL:0000169
      label: type B pancreatic cell
  biological_processes:
  - preferred_term: intrinsic apoptotic signaling in response to ER stress
    term:
      id: GO:0070059
      label: intrinsic apoptotic signaling pathway in response to endoplasmic reticulum stress
    modifier: INCREASED
  - preferred_term: insulin secretion
    term:
      id: GO:0030073
      label: insulin secretion
    modifier: DECREASED
  downstream:
  - target: Diabetes Mellitus
    description: >-
      Progressive non-autoimmune beta cell loss produces insulin-requiring diabetes
      in the first decade.
  evidence:
  - reference: PMID:20160352
    reference_title: Wolfram syndrome 1 gene negatively regulates ER stress signaling in rodent and human cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Wolfram syndrome is an autosomal-recessive disorder characterized by insulin-dependent diabetes mellitus, caused by nonautoimmune loss of beta cells, and neurological dysfunctions."
    explanation: >-
      States that the diabetes of Wolfram syndrome arises from non-autoimmune beta
      cell loss.
  - reference: PMID:7490992
    reference_title: "Neurodegeneration and diabetes: UK nationwide study of Wolfram (DIDMOAD) syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Non-autoimmune, insulin-deficient diabetes mellitus presented at a median age of 6 years, followed by optic atrophy (11 years)."
    explanation: >-
      Provides the median onset ages and confirms the insulin-deficient,
      non-autoimmune character in a national cohort.
- name: Retinal Ganglion Cell and CNS Neuron Degeneration
  biological_scale: CELLULAR
  description: >-
    The same stress and calcium mechanisms drive apoptosis of retinal ganglion
    cells and long-projection central neurons. Retinal ganglion cell loss thins the
    retinal nerve fiber layer and produces the bilateral progressive optic atrophy
    that, paired with early diabetes, defines the syndrome clinically. A parallel
    amplifier runs alongside: WFS1 deficiency drives a proinflammatory cytokine
    profile in patient mononuclear cells and elevated circulating cytokines, so a
    systemic inflammatory component sits on top of the cell-intrinsic stress.
  cell_types:
  - preferred_term: retinal ganglion cell
    term:
      id: CL:0000740
      label: retinal ganglion cell
  biological_processes:
  - preferred_term: neuron apoptotic process
    term:
      id: GO:0051402
      label: neuron apoptotic process
    modifier: INCREASED
  downstream:
  - target: Optic Atrophy
    description: >-
      Loss of retinal ganglion cells produces progressive bilateral optic atrophy.
  - target: Brainstem and Cerebellar Volume Loss
    description: >-
      Degeneration of long-projection central neurons contributes to brainstem and
      cerebellar tissue loss.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:22792385
    reference_title: Early brain vulnerability in Wolfram syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "WFS is caused by mutations in the WFS1 gene, which lead to endoplasmic reticulum (ER) stress-mediated cell death."
    explanation: >-
      Attributes the neuronal loss of Wolfram syndrome to endoplasmic reticulum
      stress-mediated cell death.
  - reference: PMID:33693650
    reference_title: Novel mutations in the WFS1 gene are associated with Wolfram syndrome and systemic inflammation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast, WS proband's PBMCs produced very high levels of proinflammatory cytokines (i.e. TNF-α, IL-1β, and IL-6) in the absence of any stimulus."
    explanation: >-
      Documents the systemic proinflammatory state that accompanies WFS1
      deficiency in a patient.
- name: Brainstem and Cerebellar Volume Loss
  biological_scale: TISSUE
  description: >-
    Volume loss centers on the brainstem, ventral pons, and cerebellum, and it is
    already measurable at the earliest clinical presentation, in the youngest
    patients with the mildest symptoms. Longitudinal morphometry separates two
    processes that clinical intuition tends to blur: controls gained white matter
    volume where the Wolfram group was flat in the optic radiations or shrinking in
    the brainstem and ventral pons, so there is failed developmental growth as well
    as frank degeneration. That distinction is not academic. Because part of the
    deficit is growth that never happened, a disease-modifying therapy plausibly
    has to start before or around the time diabetes is diagnosed to capture the
    full benefit. Progressive bulbar dysfunction and central apnea from this
    territory are what ultimately kill.
  locations:
  - preferred_term: brainstem
    term:
      id: UBERON:0002298
      label: brainstem
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  downstream:
  - target: Brain Atrophy
    description: >-
      Regional volume loss is part of a broader pattern of brain atrophy.
  - target: Myoclonus
    description: >-
      Myoclonus accompanies cerebellar ataxia in the neurological phase.
  - target: Ataxia
    description: >-
      Cerebellar and brainstem tissue loss produces gait ataxia.
  - target: Dysarthria
    description: Bulbar involvement produces dysarthria.
  - target: Dysphagia
    description: Bulbar involvement produces dysphagia.
  evidence:
  - reference: PMID:22792385
    reference_title: Early brain vulnerability in Wolfram syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Compared to healthy and type 1 diabetic control groups, the WFS group had smaller intracranial volume and preferentially affected gray matter volume and white matter microstructural integrity in the brainstem, cerebellum and optic radiations."
    explanation: >-
      Localizes the structural abnormality to brainstem, cerebellum, and optic
      radiations against both healthy and diabetic controls.
  - reference: PMID:22792385
    reference_title: Early brain vulnerability in Wolfram syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Abnormalities were detected in even the youngest patients with mildest symptoms, and some measures did not follow the typical age-dependent developmental trajectory."
    explanation: >-
      Establishes that the abnormality is present at the earliest clinical stage
      and departs from a normal developmental trajectory.
  - reference: PMID:30979932
    reference_title: Evidence for altered neurodevelopment and neurodegeneration in Wolfram syndrome using longitudinal morphometry.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Controls had uniformly increasing volume in white matter, whereas the Wolfram group had stable (optic radiations) or decreasing (brainstem, ventral pons) white matter volumes."
    explanation: >-
      Longitudinal comparison separating failed white-matter growth from frank
      degeneration.
  - reference: PMID:30979932
    reference_title: Evidence for altered neurodevelopment and neurodegeneration in Wolfram syndrome using longitudinal morphometry.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These patterns suggest that there may be early, stalled white matter development in Wolfram syndrome, with additional degenerative processes in both white and gray matter."
    explanation: >-
      States the authors' own two-process interpretation, which is the basis for
      the neurodevelopmental limb of this node.
phenotypes:
- name: Diabetes Mellitus
  category: Endocrine
  description: >-
    Insulin-requiring, autoantibody-negative diabetes mellitus, usually the first
    manifestation, presenting at a median age of 6 years. Antibody-negative
    insulin-dependent diabetes in a child is the single highest-yield trigger for
    considering this diagnosis.
  phenotype_term:
    preferred_term: Diabetes mellitus
    term:
      id: HP:0000819
      label: Diabetes mellitus
    clinical_course: PROGRESSIVE
  frequency: VERY_FREQUENT
  diagnostic: true
  evidence:
  - reference: PMID:7490992
    reference_title: "Neurodegeneration and diabetes: UK nationwide study of Wolfram (DIDMOAD) syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Non-autoimmune, insulin-deficient diabetes mellitus presented at a median age of 6 years, followed by optic atrophy (11 years)."
    explanation: >-
      Establishes diabetes mellitus as the first manifestation with a median onset
      of 6 years in a national cohort.
  - reference: PMID:20301750
    reference_title: WFS1 Spectrum Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Classic WFS1-SD, a progressive neurodegenerative disorder, is characterized by onset of diabetes mellitus and optic atrophy before age 16 years."
    explanation: >-
      GeneReviews states diabetes mellitus before age 16 as a defining feature of
      classic disease, supporting a VERY_FREQUENT band.
- name: Optic Atrophy
  category: Ophthalmologic
  description: >-
    Progressive bilateral optic atrophy from retinal ganglion cell loss, presenting
    at a median age of 11 years and progressing to legal blindness. With diabetes
    mellitus it forms the diagnostic pair.
  phenotype_term:
    preferred_term: Optic atrophy
    term:
      id: HP:0000648
      label: Optic atrophy
    clinical_course: PROGRESSIVE
  frequency: VERY_FREQUENT
  diagnostic: true
  evidence:
  - reference: PMID:7490992
    reference_title: "Neurodegeneration and diabetes: UK nationwide study of Wolfram (DIDMOAD) syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Juvenile-onset diabetes mellitus and optic atrophy are the best available diagnostic criteria for Wolfram syndrome, the differential diagnosis of which includes other causes of neurodegeneration."
    explanation: >-
      Establishes optic atrophy alongside juvenile diabetes as the diagnostic
      criterion pair.
  - reference: PMID:20301750
    reference_title: WFS1 Spectrum Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Classic WFS1-SD, a progressive neurodegenerative disorder, is characterized by onset of diabetes mellitus and optic atrophy before age 16 years."
    explanation: >-
      GeneReviews states optic atrophy before age 16 as a defining feature of
      classic disease.
- name: Diabetes Insipidus
  category: Endocrine
  description: >-
    Central (cranial) diabetes insipidus from involvement of the
    hypothalamo-neurohypophyseal axis, typically appearing in the second decade. On
    MRI the posterior pituitary bright spot is absent.
  phenotype_term:
    preferred_term: Diabetes insipidus
    term:
      id: HP:0000873
      label: Diabetes insipidus
    clinical_course: PROGRESSIVE
  frequency: FREQUENT
  evidence:
  - reference: PMID:7490992
    reference_title: "Neurodegeneration and diabetes: UK nationwide study of Wolfram (DIDMOAD) syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cranial diabetes insipidus occurred in 33 patients (73%) with sensorineural deafness (28, 62%) in the second decade; renal-tract abnormalities (26, 58%) presented in the third decade followed by neurological complications"
    explanation: >-
      Cranial diabetes insipidus in 73% of 45 patients, within the FREQUENT band of
      30 to 79%.
- name: Sensorineural Hearing Impairment
  category: Otologic
  description: >-
    Slowly progressive sensorineural hearing loss, high-frequency in recessive
    Wolfram syndrome, typically appearing in the second decade. Cochlear

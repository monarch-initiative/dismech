inheritance:
- name: Autosomal Recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Classic Wolfram syndrome, both WFS1-related and CISD2-related, is autosomal
    recessive. UK family studies indicate a carrier frequency of about 1 in 354,
    with no maternal history of diabetes or deafness and no mitochondrial tRNA-Leu
    3243 variant, which is what separates this from the maternally inherited
    mitochondrial mimics. Consanguinity is a major driver of case load in regions
    where it is common. Heterozygous WFS1 variants cause a separate, dominantly
    inherited spectrum that is out of scope for this entry.
  evidence:
  - reference: PMID:7490992
    reference_title: "Neurodegeneration and diabetes: UK nationwide study of Wolfram (DIDMOAD) syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Family studies indicate autosomal recessive inheritance with a carrier frequency of one in 354, an absence of a maternal history of diabetes or deafness, and an absence of the mitochondrial tRNA Leu (3243) mutation."
    explanation: >-
      Establishes autosomal recessive inheritance and the carrier frequency, and
      excludes the mitochondrial mimic.

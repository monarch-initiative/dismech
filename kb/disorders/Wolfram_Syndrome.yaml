- phase: First decade - diabetes and optic atrophy
  subtype: WS1
  notes: >-
    Insulin-requiring non-autoimmune diabetes mellitus at a median of 6 years,
    followed by optic atrophy at a median of 11 years. Brainstem and cerebellar
    volume abnormalities are already measurable at this stage, before the
    corresponding symptoms appear.
  evidence:
  - reference: PMID:7490992
    reference_title: "Neurodegeneration and diabetes: UK nationwide study of Wolfram (DIDMOAD) syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Non-autoimmune, insulin-deficient diabetes mellitus presented at a median age of 6 years, followed by optic atrophy (11 years)."
    explanation: >-
      Gives the median onset ages of the two defining features.
- phase: Second decade - diabetes insipidus and deafness
  subtype: WS1
  notes: >-
    Cranial diabetes insipidus and sensorineural deafness appear in the second
    decade, in 73% and 62% of the UK cohort respectively.
  evidence:
  - reference: PMID:7490992
    reference_title: "Neurodegeneration and diabetes: UK nationwide study of Wolfram (DIDMOAD) syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cranial diabetes insipidus occurred in 33 patients (73%) with sensorineural deafness (28, 62%) in the second decade; renal-tract abnormalities (26, 58%) presented in the third decade followed by neurological complications"
    explanation: >-
      Gives the decade-by-decade order and frequencies of the later features.
- phase: Third and fourth decades - urological and neurological
  subtype: WS1
  notes: >-
    Renal-tract abnormalities in the third decade (58%), then neurological
    complications including cerebellar ataxia and myoclonus in the fourth decade
    (62%). Death, most often from central respiratory failure with brainstem
    atrophy, occurred at a median age of 30 years with a range of 25 to 49 in the
    UK cohort.
  evidence:
  - reference: PMID:7490992
    reference_title: "Neurodegeneration and diabetes: UK nationwide study of Wolfram (DIDMOAD) syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Median age at death (commonly central respiratory failure with brain-stem atrophy) was 30 years (range 25-49)."
    explanation: >-
      Gives median age and cause of death in the UK national cohort.
clinical_burden:
  burden_level: HIGH
  rationale: >-
    By the third decade a typical WS1 patient carries insulin-dependent diabetes, legal
    blindness, significant hearing loss, incontinence, and progressive gait and
    speech impairment at the same time, and these do not merely add: losing vision
    and hearing together removes both compensatory channels at once. Median age at
    death was 30 years in the UK national cohort, usually from central respiratory
    failure with brainstem atrophy, and suicide is a documented additional cause.
    No approved disease-modifying therapy exists anywhere.
  evidence:
  - reference: PMID:7490992
    reference_title: "Neurodegeneration and diabetes: UK nationwide study of Wolfram (DIDMOAD) syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The natural history of Wolfram syndrome suggests that most patients will eventually develop most complications of this progressive, neurodegenerative disorder."
    explanation: >-
      Establishes the cumulative, multi-domain nature of the disability.
  - reference: PMID:39202345
    reference_title: "Wolfram Syndrome 1: A Neuropsychiatric Perspective on a Rare Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The rapid clinical course of WS1 results in death by the age of 30. Severe brain atrophy leads to central respiratory failure, which is the main cause of death in WS1 patients."
    explanation: >-
      States the age at death and the dominant mechanism of mortality.
diagnosis:
- name: Clinical Diagnostic Criteria
  description: >-
    Insulin-requiring diabetes mellitus plus optic atrophy, both with onset before
    age 16 and no alternative explanation, is the operative clinical rule. The
    diabetes workup is what separates this from type 1 diabetes: islet
    autoantibodies are negative, there is no HLA-DR3 or DR4 risk association, and
    C-peptide is preserved longer.
  evidence:
  - reference: PMID:7490992
    reference_title: "Neurodegeneration and diabetes: UK nationwide study of Wolfram (DIDMOAD) syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Juvenile-onset diabetes mellitus and optic atrophy are the best available diagnostic criteria for Wolfram syndrome, the differential diagnosis of which includes other causes of neurodegeneration."
    explanation: >-
      States the clinical criterion pair and flags the neurodegenerative
      differential.
- name: Molecular Genetic Testing
  description: >-
    Sequencing of WFS1 is the diagnostic gold standard when the picture is classic,
    with multigene panels for partial presentations and exome or genome sequencing
    for atypical cases, which is also how CISD2 cases are found. Chromosomal
    microarray, karyotype, and repeat-expansion testing have no role; mitochondrial
    DNA testing is indicated only to exclude mimics. The current Italian expert
    consensus explicitly recommends folding genetic testing into the diagnostic
    protocol rather than treating it as confirmatory afterthought.
  evidence:
  - reference: PMID:20301750
    reference_title: WFS1 Spectrum Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis is established in a proband with suggestive findings and biallelic pathogenic (or likely pathogenic) variants in WFS1 identified by molecular genetic testing."
    explanation: >-
      GeneReviews states that molecular identification of biallelic WFS1 variants
      establishes the diagnosis.
  - reference: PMID:39527371
    reference_title: SID/SIEDP expert consensus on optimizing clinical strategies for early detection and management of wolfram syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The consensus recommends the revision of diagnostic protocols to include genetic testing and comprehensive multidisciplinary evaluations to ensure accurate diagnosis of WFS, advocates for personalized management plans tailored to the unique needs of each patient, with an emphasis on exploring new potential drug therapies."
    explanation: >-
      Current expert consensus recommending genetic testing within the diagnostic
      protocol.
- name: Brain MRI
  description: >-
    MRI shows an absent posterior pituitary bright spot on T1, the hallmark of
    central diabetes insipidus, together with brainstem, ventral pontine, and
    cerebellar atrophy and thinning of the optic nerves, chiasm, and tracts. Volume
    abnormalities are detectable at the earliest clinical stage, which makes serial
    imaging the leading candidate progression measure for trials.
  evidence:
  - reference: PMID:22792385
    reference_title: Early brain vulnerability in Wolfram syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These results establish that WFS is associated with smaller intracranial volume with specific abnormalities in the brainstem and cerebellum, even at the earliest stage of clinical symptoms."
    explanation: >-
      Supports MRI detection of the characteristic regional abnormalities from the
      earliest clinical stage.
- name: Optical Coherence Tomography
  description: >-
    Optical coherence tomography quantifies retinal nerve fiber layer and ganglion
    cell complex thinning. Together with best-corrected visual acuity, these
    structural measures support longitudinal monitoring of optic neuropathy; their
    prognostic role remains promising rather than fully validated.
  evidence:
  - reference: PMID:41870390
    reference_title: "Optic Atrophy in Wolfram Syndrome Type 1: A Retrospective Analysis of Visual Outcomes and Biomarker Correlates."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "BCVA correlated inversely with RNFL thickness ( P = 0.0017, R 2 = 0.14), GCC thickness ( P = 0.0018, R 2 = 0.29), and mutation severity score ( P = 0.031, R 2 = 0.14)."
    explanation: >-
      Correlations in a retrospective WS1 cohort support OCT measures as monitoring
      biomarkers, but do not yet validate them as surrogate endpoints.
treatments:
- name: Insulin Therapy
  description: >-
    Insulin replacement, by multiple daily injections or pump, with continuous
    glucose monitoring. The diabetes is insulin-deficient and non-autoimmune, so
    management follows type 1 diabetes practice while the underlying beta cell loss
    is mechanistically different. Insulin replaces the missing hormone and does
    nothing to slow beta cell loss.
  therapeutic_modality: PEPTIDE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Insulin Deficiency
    treatment_effect: RESTORES
    description: >-
      Exogenous insulin restores the hormone that surviving beta cells can no
      longer supply, without acting on the cell loss itself.
  evidence:
  - reference: PMID:39527371
    reference_title: SID/SIEDP expert consensus on optimizing clinical strategies for early detection and management of wolfram syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nearly all diagnosed individuals require insulin therapy to manage their condition."
    explanation: >-
      Current expert consensus directly states that nearly all diagnosed
      individuals require insulin therapy.
- name: Desmopressin for Central Diabetes Insipidus
  description: >-
    In WS1, desmopressin replaces vasopressin lost with degeneration of the
    hypothalamo-neurohypophyseal axis. In a prospective four-patient case series,
    three children with persistent polyuria and polydipsia despite optimized
    glycemic control were diagnosed with diabetes insipidus and treated with
    desmopressin.
  therapeutic_modality: PEPTIDE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:38465704
    reference_title: Long term clinical follow up of four patients with Wolfram syndrome and urodynamic abnormalities.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three children had persistent polyuria and polydipsia despite having optimum glycemic control; hence were diagnosed to have DI and treated with desmopressin."
    explanation: >-
      Directly documents desmopressin treatment of central diabetes insipidus in a
      prospective Wolfram syndrome case series.
- name: Multidisciplinary Supportive Care
  description: >-
    There is no cure. Care is supportive and multidisciplinary, spanning diabetes
    care, endocrinology, ophthalmology and low vision, audiology and cochlear
    implantation, speech and language therapy, neurology, pulmonology, psychiatry,
    urology, gastroenterology, social work, and medical genetics, with regular
    surveillance for emerging manifestations. Urodynamic assessment with clean
    intermittent catheterization for hypocontractile bladder and proactive
    psychiatric and suicide-risk assessment are important components.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301750
    reference_title: WFS1 Spectrum Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There is no cure for WFS1-SD."
    explanation: >-
      States plainly that no curative therapy exists, which is why care is
      supportive.
  - reference: PMID:20301750
    reference_title: WFS1 Spectrum Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Surveillance: For both classic and nonclassic WFS1-SD, regular monitoring of existing manifestations, the response of an individual to supportive care, and the emergence of new manifestations is recommended."
    explanation: >-
      Establishes regular surveillance as the recommended management framework.
  - reference: PMID:38465704
    reference_title: Long term clinical follow up of four patients with Wolfram syndrome and urodynamic abnormalities.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with hypocontractile bladder were taught clean intermittent catheterization and the use of overnight drain."
    explanation: >-
      Provides direct clinical evidence for catheter-based management of
      hypocontractile bladder.
- name: Genetic Counseling and Cascade Testing
  description: >-
    Autosomal recessive counseling with a 25% recurrence risk per pregnancy for
    carrier couples, plus cascade testing of siblings, which is the population in
    whom early diagnosis is actually achievable. Prenatal and preimplantation
    testing are possible once the familial variants are known. Counseling arithmetic
    differs completely if the family variant belongs to the dominant WFS1 allelic
    series, and misclassifying which series a family is in is a real counseling
    error.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:20301750
    reference_title: WFS1 Spectrum Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "If both parents are known to be heterozygous for a WFS1 pathogenic variant, each sib of an affected individual has at conception a 25% chance of being affected, a 50% chance of being a carrier, and a 25% chance of inheriting neither of the familial pathogenic variants."
    explanation: >-
      Gives the recurrence risk figures that drive counseling.
  - reference: PMID:20301750
    reference_title: WFS1 Spectrum Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Evaluation of relatives at risk: It is appropriate to clarify the genetic status of apparently asymptomatic at-risk relatives in order to identify as early as possible those who would benefit from prompt initiation of treatment for the earliest manifestations of WFS1-SD: diabetes mellitus, optic atrophy, and sensorineural hearing loss."
    explanation: >-
      Supports cascade testing of at-risk relatives as the route to early
      intervention.
- name: Dantrolene Sodium
  description: >-
    A ryanodine-receptor blocker trialed on the endoplasmic-reticulum-calcium
    stabilizer rationale, and the first clinical trial ever conducted in Wolfram
    syndrome. It was safe and well tolerated, and it did not work: beta cell
    function was not significantly improved overall, and neither visual acuity nor
    neurological function improved at six months. Recorded here because a negative
    result in a disease with no therapy is information, not an absence of it.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Cytosolic Calcium Dysregulation
    treatment_effect: INHIBITS
    description: >-
      Dantrolene inhibits ryanodine-receptor-mediated endoplasmic reticulum calcium
      efflux, the intended point of action on this node. The pharmacology is
      unambiguous; the clinical trial nonetheless showed no benefit.
  evidence:
  - reference: PMID:34185708
    reference_title: A phase Ib/IIa clinical trial of dantrolene sodium in patients with Wolfram syndrome.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Dantrolene sodium was well tolerated by Wolfram syndrome patients. Overall, β cell functions were not significantly improved, but there was a significant correlation between baseline β cell functions and change in β cell responsiveness (R2, P = 0.004) after 6-month dantrolene therapy."
    explanation: >-
      Reports tolerability but no significant overall improvement in beta cell
      function, refuting an efficacy claim.
  - reference: PMID:34185708
    reference_title: A phase Ib/IIa clinical trial of dantrolene sodium in patients with Wolfram syndrome.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Visual acuity and neurological functions were not improved by 6-month dantrolene sodium."
    explanation: >-
      Directly refutes benefit on the visual and neurological endpoints.
- name: Sodium Phenylbutyrate and Taurursodiol
  description: >-
    An oral combination of a chemical chaperone and an endoplasmic-reticulum-stress
    and apoptosis modulator, acting on the pathway wolframin normally regulates.
    The HELIOS trial reported improved or stabilized pancreatic function, vision,
    and symptom burden at 24 and 48 weeks: stimulated C-peptide (the primary
    endpoint) and the glycemic secondary endpoints improved from baseline, visual
    acuity trended toward stabilization, and every assessable participant was a
    responder on both global-impression scales. Tolerability was acceptable —
    adverse events in eleven of twelve participants, all mild or moderate and
    mostly gastrointestinal, with dose interruption or reduction in three each but
    no discontinuations, serious events, or deaths. The design ceiling has to
    travel with the result: single-center, single-arm, open-label, twelve
    participants, no placebo. Graded PARTIAL for that reason, and the objective
    endpoints are curated separately from the unblinded global-impression scales
    because the latter are the ones open-label expectancy most easily inflates.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Unrestrained ER Stress Signaling Through ATF6-alpha
    treatment_effect: MODULATES
    description: >-
      Phenylbutyrate acts as a chemical chaperone and taurursodiol modulates
      endoplasmic reticulum stress and apoptosis, targeting the pathway wolframin
      normally restrains. MODULATES rather than INHIBITS because the human
      evidence is a single-arm open-label trial that cannot establish the
      direction of effect on this node.
  - target: Mitochondrial Dysfunction
    treatment_effect: MODULATES
    description: >-
      The combination is described as targeting dysfunctional mitochondrial
      pathways alongside the endoplasmic-reticulum arm, taurursodiol being the
      component associated with mitochondrial effects. This link records the
      second half of the drug's stated mechanism, which the entry previously left
      unattached. MODULATES for the same reason as the ER node: no trial readout
      measures mitochondrial function.
    evidence:
    - reference: PMID:42138079
      reference_title: Phase II trial of sodium phenylbutyrate and taurursodiol in Wolfram syndrome.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "An investigational oral combination of sodium phenylbutyrate and taurursodiol (PB&TURSO) targets dysfunctional ER and mitochondrial pathways to reduce pancreatic β cell and neuronal death"
      explanation: >-
        Names the mitochondrial arm of the mechanism. PARTIAL because this is the
        trial report's mechanistic framing citing prior work, not a measurement
        made in this trial.
  - target: Beta Cell Apoptosis
    treatment_effect: INHIBITS
    description: >-
      The stated purpose of acting on the ER and mitochondrial pathways is to
      reduce pancreatic beta cell death. INHIBITS is used here, unlike the two
      upstream nodes, because the trial's primary endpoint is a direct functional
      readout of surviving beta cell mass — stimulated C-peptide — and it improved
      from baseline at both 24 and 48 weeks. The uncontrolled design still means
      this is a within-participant change, not a demonstrated causal effect.
      One caveat belongs on the direction itself: reduced apoptosis predicts
      arrested decline, whereas C-peptide *improving* from baseline is at least as
      consistent with recovered secretory function in beta cells that were still
      alive. The INHIBITS direction therefore rests on the drug's stated mechanism,
      which names cell death explicitly, with the C-peptide result as functional
      corroboration rather than as a measurement of apoptosis.
    evidence:
    - reference: PMID:42138079
      reference_title: Phase II trial of sodium phenylbutyrate and taurursodiol in Wolfram syndrome.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "An investigational oral combination of sodium phenylbutyrate and taurursodiol (PB&TURSO) targets dysfunctional ER and mitochondrial pathways to reduce pancreatic β cell and neuronal death"
      explanation: >-
        The only statement in the source that names beta cell death, and therefore
        what the INHIBITS direction is evidenced on. PARTIAL because it is the trial
        report's mechanistic framing citing prior work, not a measurement made here.
    - reference: PMID:42138079
      reference_title: Phase II trial of sodium phenylbutyrate and taurursodiol in Wolfram syndrome.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "The primary efficacy endpoint — C-peptide response at 120 minutes during a mixed-meal tolerance test (MMTT) — showed overall improvement from baseline at weeks 24 and 48."
      explanation: >-
        Functional corroboration: the primary endpoint indexes residual beta cell
        mass. It does not measure apoptosis, and is PARTIAL for the further reason
        that a single-arm open-label design cannot separate treatment effect from
        natural variation.
  - target: Retinal Ganglion Cell and CNS Neuron Degeneration
    treatment_effect: MODULATES
    description: >-
      The same mechanism sentence names reduction of neuronal death as an intended
      effect, and the trial's visual-acuity readout is the clinical correlate of
      this node. Visual acuity trended toward stabilization rather than improving,
      and the authors themselves note that natural history includes periods of
      stability — so this link is deliberately MODULATES with a stabilization
      claim only.
    evidence:
    - reference: PMID:42138079
      reference_title: Phase II trial of sodium phenylbutyrate and taurursodiol in Wolfram syndrome.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Best-corrected visual acuity trended toward stabilization over 48 weeks in both analysis sets (Figure 1E), consistent with periods of stability in natural history cohorts."
      explanation: >-
        Records stabilization rather than improvement, and carries the authors' own
        natural-history caveat that makes this the weakest of the four links.
  evidence:
  - reference: PMID:42138079
    reference_title: Phase II trial of sodium phenylbutyrate and taurursodiol in Wolfram syndrome.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "PB&TURSO was associated with improved or stabilized pancreatic function, vision, and overall symptom burden in individuals with Wolfram syndrome, a rare and progressive degenerative disease."
    explanation: >-
      Reports the positive result. PARTIAL because the trial is single-arm and
      open-label with twelve participants, which cannot establish disease
      modification.
  - reference: PMID:42138079
    reference_title: Phase II trial of sodium phenylbutyrate and taurursodiol in Wolfram syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report 24- and 48-week results from the ongoing HELIOS trial (ClinicalTrials.gov NCT05676034), a single-center, single-arm, open-label, phase II trial of PB&TURSO."
    explanation: >-
      Documents the trial design, which is the basis for the PARTIAL grading of the
      efficacy claim above.
  - reference: PMID:42138079
    reference_title: Phase II trial of sodium phenylbutyrate and taurursodiol in Wolfram syndrome.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Secondary measures including HbA1c and time in target glucose range improved from baseline at weeks 24 and 48 (Figure 1, C and D)."
    explanation: >-
      Objective glycemic secondary endpoints, recorded separately from the
      subjective global-impression measures because they are the outcomes least
      vulnerable to the open-label design.
  - reference: PMID:42138079
    reference_title: Phase II trial of sodium phenylbutyrate and taurursodiol in Wolfram syndrome.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "All participants with available data were classified as responders on both Participant and Clinician Global Impression of Change (PGI-C and CGI-C) scales at weeks 24 and 48 (Figure 1F)."
    explanation: >-
      The global-impression result. Graded PARTIAL and kept distinct from the
      objective endpoints above: unblinded participant- and clinician-reported
      impressions are the measures most susceptible to open-label expectancy.
  - reference: PMID:42138079
    reference_title: Phase II trial of sodium phenylbutyrate and taurursodiol in Wolfram syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Eleven participants experienced ≥1 treatment-emergent adverse events (TEAEs; Supplemental Table 3), all mild or moderate and mostly gastrointestinal."
    explanation: >-
      Safety and tolerability: adverse events were near-universal but none severe,
      with a predominantly gastrointestinal profile.
  - reference: PMID:42138079
    reference_title: Phase II trial of sodium phenylbutyrate and taurursodiol in Wolfram syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "TEAEs led to treatment interruption or reduction in 3 participants each, but not to discontinuations. No serious TEAEs or deaths were reported."
    explanation: >-
      Completes the tolerability picture: dose interruption or reduction in a
      quarter of participants, but no discontinuations, serious events, or deaths.
  - reference: PMID:42138079
    reference_title: Phase II trial of sodium phenylbutyrate and taurursodiol in Wolfram syndrome.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Limitations include the open-label, single-arm design and small sample size, reflecting WS rarity."
    explanation: >-
      The authors' own statement of the design ceiling this entry grades against.
- name: GLP-1 Receptor Agonists
  description: >-
    A strong preclinical package has not yet translated into demonstrated clinical
    benefit. Dulaglutide, exenatide, and related agents improve beta-cell and
    neuronal readouts in WFS1-deficient models. In the largest human evaluation,
    30 of 84 registry participants had received a GLP-1 receptor agonist, but paired
    retrospective analyses found no glycemic or visual benefit over one to two
    years and gastrointestinal adverse effects were common. The uncontrolled,
    clinically selected sample makes that result preliminary rather than a
    definitive efficacy test.
  therapeutic_modality: PEPTIDE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Beta Cell Apoptosis
    treatment_effect: INHIBITS
    description: >-
      GLP-1 receptor agonism improves beta cell function and prevents apoptosis in
      WFS1-deficient human beta cell models. The evidence is preclinical.
  evidence:
  - reference: PMID:36995380
    reference_title: GLP-1R agonists demonstrate potential to treat Wolfram syndrome in human preclinical models.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "the long-lasting GLP-1R agonist dulaglutide reverses impaired glucose tolerance in WFS1-deficient mice"
    explanation: >-
      Isolates the intact-mouse metabolic result from the human in-vitro findings
      reported in the same source sentence.
  - reference: PMID:36995380
    reference_title: GLP-1R agonists demonstrate potential to treat Wolfram syndrome in human preclinical models.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "exenatide and dulaglutide improve beta cell function and prevent apoptosis in different human WFS1-deficient models including iPSC-derived beta cells from people with Wolfram syndrome."
    explanation: >-
      Isolates the human WFS1-deficient beta-cell-model result without implying
      that these patient-derived cells constitute clinical treatment evidence.
  - reference: PMID:36995380
    reference_title: GLP-1R agonists demonstrate potential to treat Wolfram syndrome in human preclinical models.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Exenatide improved mitochondrial function, reduced oxidative stress and prevented apoptosis in Wolfram syndrome iPSC-derived neural precursors and cerebellar neurons."
    explanation: >-
      Extends the preclinical benefit to the neuronal arm of the disease.
  - reference: PMID:42597412
    reference_title: Evaluating the use of GLP-1 receptor agonists in Wolfram syndrome patients.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Thirty of the 84 participants (35.7%) had received a GLP-1 RA in addition to insulin. No statistically significant changes in HbA1c or body mass index were observed at one or two years. Best-corrected visual acuity (LogMAR) declined significantly at two years, consistent with expected disease progression. Gastrointestinal adverse effects were common (56.7% of users) and were the leading cause of discontinuation."
    explanation: >-
      Refutes an observed one-to-two-year glycemic or visual benefit in the largest
      available human cohort while documenting common gastrointestinal adverse
      effects. The retrospective, uncontrolled design prevents a definitive causal
      conclusion.
animal_models:
- name: Wfs1 exon-8 knockout mouse
  species: Mus musculus
  genotype: Wfs1 exon-8 knockout
  publication: PMID:41998758
  genes:
  - preferred_term: Wfs1
    term:
      id: MGI:1328355
      label: Wfs1
  description: >-
    The Estonian Wfs1 exon-8 knockout mouse develops progressive visual-acuity
    loss, optic-disc pallor, and severe optic-nerve damage. Intravitreal AAV2
    delivery of human WFS1 provides a direct rescue experiment for the retinal
    ganglion-cell branch.
  associated_phenotypes:
  - Optic Atrophy
  modeled_mechanisms:
  - target: Retinal Ganglion Cell and CNS Neuron Degeneration
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The knockout reproduces progressive visual-acuity loss, optic-disc pallor,
      retinal thinning, and severe optic-nerve axon damage; rescue by retinal
      delivery of human WFS1 strengthens the causal interpretation.
    limitations: >-
      This link is restricted to the retinal and optic-nerve branch. The model did
      not show significant retinal-ganglion-cell soma loss at the studied age and
      does not establish fidelity for the broader human CNS phenotype.
    readouts:
    - name: Visual-acuity loss and optic-nerve damage
      target: Retinal Ganglion Cell and CNS Neuron Degeneration
      direction: INCREASED
      interpretation: >-
        Progressive visual loss, pallor, and optic-nerve damage are functional and
        structural readouts of the modeled retinal neurodegeneration.
      evidence:
      - reference: PMID:41998758
        reference_title: WFS1 gene delivery rescues visual function in a mouse model of Wolfram syndrome.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "the Wfs1 knockout mice produced by the Estonian group, in which exon 8 of the Wfs1 gene was disrupted, exhibit a progressive loss of visual acuity, optic disc pallor and severe optic nerve damage."
        explanation: >-
          Directly states the genotype and the functional and structural retinal
          phenotypes represented by this model link.
    evidence:
    - reference: PMID:41998758
      reference_title: WFS1 gene delivery rescues visual function in a mouse model of Wolfram syndrome.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "the Wfs1 knockout mice produced by the Estonian group, in which exon 8 of the Wfs1 gene was disrupted, exhibit a progressive loss of visual acuity, optic disc pallor and severe optic nerve damage."
      explanation: >-
        Establishes that the mouse recapitulates the optic-neuropathy branch.
  evidence:
  - reference: PMID:41998758
    reference_title: WFS1 gene delivery rescues visual function in a mouse model of Wolfram syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Our results provide the first evidence that intravitreal injection of human WFS1 has significant neuroprotective effects on retinal ganglion cells and their axons and slows the loss of visual acuity."
    explanation: >-
      AAV2-WFS1 rescue of retinal ganglion-cell structure and visual function

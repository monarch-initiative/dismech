  evidence:
  - reference: PMID:40189101
    reference_title: Wolfram syndrome 2 gene (CISD2) deficiency disrupts Ca(2+)-mediated insulin secretion in β-cells.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Firstly, β-cell specific Cisd2KO in mice disrupts systemic glucose homeostasis via impairing β-granules synthesis and insulin secretion; hypertrophy of the β-islets and the presence of a loss of identity that affects certain β-cells."
    explanation: >-
      Directly demonstrates impaired insulin synthesis and secretion after

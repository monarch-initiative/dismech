progression:
- phase: First decade - diabetes and optic atrophy
  notes: >-
    Insulin-requiring non-autoimmune diabetes mellitus at a median of 6 years,
    followed by optic atrophy at a median of 11 years. Brainstem and cerebellar
    volume abnormalities are already measurable at this stage, before the
    corresponding symptoms appear.
  evidence:
  - reference: PMID:7490992
    reference_title: "Neurodegeneration and diabetes: UK nationwide study of Wolfram (DIDMOAD) syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Non-autoimmune, insulin-deficient diabetes mellitus presented at a median age of 6 years, followed by optic atrophy (11 years)."
    explanation: >-
      Gives the median onset ages of the two defining features.
- phase: Second decade - diabetes insipidus and deafness
  notes: >-
    Cranial diabetes insipidus and sensorineural deafness appear in the second
    decade, in 73% and 62% of the UK cohort respectively.
  evidence:
  - reference: PMID:7490992
    reference_title: "Neurodegeneration and diabetes: UK nationwide study of Wolfram (DIDMOAD) syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cranial diabetes insipidus occurred in 33 patients (73%) with sensorineural deafness (28, 62%) in the second decade; renal-tract abnormalities (26, 58%) presented in the third decade followed by neurological complications"
    explanation: >-
      Gives the decade-by-decade order and frequencies of the later features.
- phase: Third and fourth decades - urological and neurological
  notes: >-
    Renal-tract abnormalities in the third decade (58%), then neurological
    complications including cerebellar ataxia and myoclonus in the fourth decade
    (62%). Death, most often from central respiratory failure with brainstem
    atrophy, occurred at a median age of 30 years with a range of 25 to 49 in the
    UK cohort.
  evidence:
  - reference: PMID:7490992
    reference_title: "Neurodegeneration and diabetes: UK nationwide study of Wolfram (DIDMOAD) syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Median age at death (commonly central respiratory failure with brain-stem atrophy) was 30 years (range 25-49)."
    explanation: >-
      Gives median age and cause of death in the UK national cohort.
clinical_burden:
  burden_level: HIGH
  rationale: >-
    By the third decade a typical patient carries insulin-dependent diabetes, legal
    blindness, significant hearing loss, incontinence, and progressive gait and
    speech impairment at the same time, and these do not merely add: losing vision
    and hearing together removes both compensatory channels at once. Median age at
    death was 30 years in the UK national cohort, usually from central respiratory
    failure with brainstem atrophy, and suicide is a documented additional cause.
    No approved disease-modifying therapy exists anywhere.
  evidence:
  - reference: PMID:7490992
    reference_title: "Neurodegeneration and diabetes: UK nationwide study of Wolfram (DIDMOAD) syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The natural history of Wolfram syndrome suggests that most patients will eventually develop most complications of this progressive, neurodegenerative disorder."
    explanation: >-
      Establishes the cumulative, multi-domain nature of the disability.
  - reference: PMID:39202345
    reference_title: "Wolfram Syndrome 1: A Neuropsychiatric Perspective on a Rare Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The rapid clinical course of WS1 results in death by the age of 30. Severe brain atrophy leads to central respiratory failure, which is the main cause of death in WS1 patients."
    explanation: >-
      States the age at death and the dominant mechanism of mortality.
diagnosis:
- name: Clinical Diagnostic Criteria
  description: >-
    Insulin-requiring diabetes mellitus plus optic atrophy, both with onset before
    age 16 and no alternative explanation, is the operative clinical rule. The
    diabetes workup is what separates this from type 1 diabetes: islet
    autoantibodies are negative, there is no HLA-DR3 or DR4 risk association, and
    C-peptide is preserved longer.
  evidence:
  - reference: PMID:7490992
    reference_title: "Neurodegeneration and diabetes: UK nationwide study of Wolfram (DIDMOAD) syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Juvenile-onset diabetes mellitus and optic atrophy are the best available diagnostic criteria for Wolfram syndrome, the differential diagnosis of which includes other causes of neurodegeneration."
    explanation: >-
      States the clinical criterion pair and flags the neurodegenerative
      differential.
- name: Molecular Genetic Testing
  description: >-
    Sequencing of WFS1 is the diagnostic gold standard when the picture is classic,
    with multigene panels for partial presentations and exome or genome sequencing
    for atypical cases, which is also how CISD2 cases are found. Chromosomal
    microarray, karyotype, and repeat-expansion testing have no role; mitochondrial
    DNA testing is indicated only to exclude mimics. The current Italian expert
    consensus explicitly recommends folding genetic testing into the diagnostic
    protocol rather than treating it as confirmatory afterthought.
  evidence:
  - reference: PMID:20301750
    reference_title: WFS1 Spectrum Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis is established in a proband with suggestive findings and biallelic pathogenic (or likely pathogenic) variants in WFS1 identified by molecular genetic testing."
    explanation: >-
      GeneReviews states that molecular identification of biallelic WFS1 variants
      establishes the diagnosis.
  - reference: PMID:39527371
    reference_title: SID/SIEDP expert consensus on optimizing clinical strategies for early detection and management of wolfram syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The consensus recommends the revision of diagnostic protocols to include genetic testing and comprehensive multidisciplinary evaluations to ensure accurate diagnosis of WFS, advocates for personalized management plans tailored to the unique needs of each patient, with an emphasis on exploring new potential drug therapies."
    explanation: >-
      Current expert consensus recommending genetic testing within the diagnostic
      protocol.
- name: Brain MRI
  description: >-
    MRI shows an absent posterior pituitary bright spot on T1, the hallmark of
    central diabetes insipidus, together with brainstem, ventral pontine, and
    cerebellar atrophy and thinning of the optic nerves, chiasm, and tracts. Volume
    abnormalities are detectable at the earliest clinical stage, which makes serial
    imaging the leading candidate progression measure for trials.
  evidence:
  - reference: PMID:22792385
    reference_title: Early brain vulnerability in Wolfram syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These results establish that WFS is associated with smaller intracranial volume with specific abnormalities in the brainstem and cerebellum, even at the earliest stage of clinical symptoms."
    explanation: >-
      Supports MRI detection of the characteristic regional abnormalities from the
      earliest clinical stage.
treatments:
- name: Insulin Therapy
  description: >-
    Insulin replacement, by multiple daily injections or pump, with continuous
    glucose monitoring. The diabetes is insulin-deficient and non-autoimmune, so
    management follows type 1 diabetes practice while the underlying beta cell loss
    is mechanistically different. Insulin replaces the missing hormone and does
    nothing to slow beta cell loss.
  therapeutic_modality: PEPTIDE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Beta Cell Apoptosis and Insulin Deficiency
    treatment_effect: RESTORES
    description: >-
      Exogenous insulin restores the hormone that surviving beta cells can no
      longer supply, without acting on the cell loss itself.
  evidence:
  - reference: PMID:7490992
    reference_title: "Neurodegeneration and diabetes: UK nationwide study of Wolfram (DIDMOAD) syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Non-autoimmune, insulin-deficient diabetes mellitus presented at a median age of 6 years, followed by optic atrophy (11 years)."
    explanation: >-
      Establishes the insulin-deficient character of the diabetes that mandates
      insulin replacement.
- name: Desmopressin for Central Diabetes Insipidus
  description: >-
    Desmopressin, oral or intranasal, replaces vasopressin lost with degeneration
    of the hypothalamo-neurohypophyseal axis. Monitoring for diabetes insipidus is
    warranted during pregnancy, when it may first emerge.
  therapeutic_modality: PEPTIDE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:20301750
    reference_title: WFS1 Spectrum Disorder.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Because women with classic WFS1-SD may develop diabetes insipidus during pregnancy, monitoring for diabetes insipidus during pregnancy is warranted."
    explanation: >-
      GeneReviews documents diabetes insipidus as a managed manifestation. PARTIAL
      because this sentence addresses monitoring in pregnancy rather than
      desmopressin efficacy.
- name: Multidisciplinary Supportive Care
  description: >-
    There is no cure. Care is supportive and multidisciplinary, spanning diabetes
    care, endocrinology, ophthalmology and low vision, audiology and cochlear
    implantation, speech and language therapy, neurology, pulmonology, psychiatry,
    urology, gastroenterology, social work, and medical genetics, with regular
    surveillance for emerging manifestations. Two elements of this are genuinely
    life-prolonging rather than merely palliative: upper urinary tract surveillance
    with timely clean intermittent catheterization, and proactive psychiatric and
    suicide-risk assessment.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301750
    reference_title: WFS1 Spectrum Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There is no cure for WFS1-SD."
    explanation: >-
      States plainly that no curative therapy exists, which is why care is
      supportive.
  - reference: PMID:20301750
    reference_title: WFS1 Spectrum Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Surveillance: For both classic and nonclassic WFS1-SD, regular monitoring of existing manifestations, the response of an individual to supportive care, and the emergence of new manifestations is recommended."
    explanation: >-
      Establishes regular surveillance as the recommended management framework.
- name: Genetic Counseling and Cascade Testing
  description: >-
    Autosomal recessive counseling with a 25% recurrence risk per pregnancy for
    carrier couples, plus cascade testing of siblings, which is the population in
    whom early diagnosis is actually achievable. Prenatal and preimplantation
    testing are possible once the familial variants are known. Counseling arithmetic
    differs completely if the family variant belongs to the dominant WFS1 allelic
    series, and misclassifying which series a family is in is a real counseling
    error.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:20301750
    reference_title: WFS1 Spectrum Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "If both parents are known to be heterozygous for a WFS1 pathogenic variant, each sib of an affected individual has at conception a 25% chance of being affected, a 50% chance of being a carrier, and a 25% chance of inheriting neither of the familial pathogenic variants."
    explanation: >-
      Gives the recurrence risk figures that drive counseling.
  - reference: PMID:20301750
    reference_title: WFS1 Spectrum Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Evaluation of relatives at risk: It is appropriate to clarify the genetic status of apparently asymptomatic at-risk relatives in order to identify as early as possible those who would benefit from prompt initiation of treatment for the earliest manifestations of WFS1-SD: diabetes mellitus, optic atrophy, and sensorineural hearing loss."
    explanation: >-
      Supports cascade testing of at-risk relatives as the route to early
      intervention.
- name: Dantrolene Sodium
  description: >-
    A ryanodine-receptor blocker trialed on the endoplasmic-reticulum-calcium
    stabilizer rationale, and the first clinical trial ever conducted in Wolfram
    syndrome. It was safe and well tolerated, and it did not work: beta cell
    function was not significantly improved overall, and neither visual acuity nor
    neurological function improved at six months. Recorded here because a negative
    result in a disease with no therapy is information, not an absence of it.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Cytosolic Calcium Dysregulation and Calpain Activation
    treatment_effect: INHIBITS
    description: >-
      Dantrolene inhibits ryanodine-receptor-mediated endoplasmic reticulum calcium
      efflux, the intended point of action on this node. The pharmacology is
      unambiguous; the clinical trial nonetheless showed no benefit.
  evidence:
  - reference: PMID:34185708
    reference_title: A phase Ib/IIa clinical trial of dantrolene sodium in patients with Wolfram syndrome.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Dantrolene sodium was well tolerated by Wolfram syndrome patients. Overall, β cell functions were not significantly improved, but there was a significant correlation between baseline β cell functions and change in β cell responsiveness (R2, P = 0.004) after 6-month dantrolene therapy."
    explanation: >-
      Reports tolerability but no significant overall improvement in beta cell
      function, refuting an efficacy claim.
  - reference: PMID:34185708
    reference_title: A phase Ib/IIa clinical trial of dantrolene sodium in patients with Wolfram syndrome.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Visual acuity and neurological functions were not improved by 6-month dantrolene sodium."
    explanation: >-
      Directly refutes benefit on the visual and neurological endpoints.
- name: Sodium Phenylbutyrate and Taurursodiol
  description: >-
    An oral combination of a chemical chaperone and an endoplasmic-reticulum-stress
    and apoptosis modulator, acting on the pathway wolframin normally regulates.
    The HELIOS trial reported improved or stabilized pancreatic function, vision,
    and symptom burden at 24 and 48 weeks. The design ceiling has to travel with
    the result: single-center, single-arm, open-label, twelve participants, no
    placebo. Graded PARTIAL for that reason.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Unrestrained ER Stress Signaling Through ATF6-alpha
    treatment_effect: MODULATES
    description: >-
      Phenylbutyrate acts as a chemical chaperone and taurursodiol modulates
      endoplasmic reticulum stress and apoptosis, targeting the pathway wolframin
      normally restrains. MODULATES rather than INHIBITS because the human
      evidence is a single-arm open-label trial that cannot establish the
      direction of effect on this node.
  evidence:
  - reference: PMID:42138079
    reference_title: Phase II trial of sodium phenylbutyrate and taurursodiol in Wolfram syndrome.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "PB&TURSO was associated with improved or stabilized pancreatic function, vision, and overall symptom burden in individuals with Wolfram syndrome, a rare and progressive degenerative disease."
    explanation: >-
      Reports the positive result. PARTIAL because the trial is single-arm and
      open-label with twelve participants, which cannot establish disease
      modification.
  - reference: PMID:42138079
    reference_title: Phase II trial of sodium phenylbutyrate and taurursodiol in Wolfram syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report 24- and 48-week results from the ongoing HELIOS trial (ClinicalTrials.gov NCT05676034), a single-center, single-arm, open-label, phase II trial of PB&TURSO."
    explanation: >-
      Documents the trial design, which is the basis for the PARTIAL grading of the
      efficacy claim above.
- name: GLP-1 Receptor Agonists
  description: >-
    The strongest preclinical package in the field, and still without a controlled
    human trial. Dulaglutide reverses impaired glucose tolerance in WFS1-deficient
    mice; exenatide and dulaglutide improve beta cell function and prevent
    apoptosis across human WFS1-deficient models including patient iPSC-derived
    beta cells; and exenatide improves mitochondrial function and prevents
    apoptosis in patient-derived neural precursors and cerebellar neurons. Human
    evidence remains observational, so this is emerging rather than established.
  therapeutic_modality: PEPTIDE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Beta Cell Apoptosis and Insulin Deficiency
    treatment_effect: INHIBITS
    description: >-
      GLP-1 receptor agonism improves beta cell function and prevents apoptosis in
      WFS1-deficient human beta cell models. The evidence is preclinical.
  evidence:
  - reference: PMID:36995380
    reference_title: GLP-1R agonists demonstrate potential to treat Wolfram syndrome in human preclinical models.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our study shows that the long-lasting GLP-1R agonist dulaglutide reverses impaired glucose tolerance in WFS1-deficient mice, and that exenatide and dulaglutide improve beta cell function and prevent apoptosis in different human WFS1-deficient models including iPSC-derived beta cells from people with Wolfram syndrome."
    explanation: >-
      Documents benefit across mouse and human WFS1-deficient beta cell models.
  - reference: PMID:36995380
    reference_title: GLP-1R agonists demonstrate potential to treat Wolfram syndrome in human preclinical models.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Exenatide improved mitochondrial function, reduced oxidative stress and prevented apoptosis in Wolfram syndrome iPSC-derived neural precursors and cerebellar neurons."
    explanation: >-
      Extends the preclinical benefit to the neuronal arm of the disease.
experimental_models:
- name: CRISPR-corrected patient iPSC-derived beta cells
  experimental_model_type: IPSC_DERIVED_MODEL
  description: >-
    CRISPR-Cas9 correction of a pathogenic WFS1 variant in induced pluripotent stem
    cells from a patient with Wolfram syndrome, differentiated to stem-cell-derived
    beta cells. This is the most concrete route to replacing beta cells rather than
    protecting them, and it demonstrates that the beta cell defect is reversible at
    the genetic level.
  publication: PMID:32321868
  modeled_mechanisms:
  - target: Beta Cell Apoptosis and Insulin Deficiency
    relationship: RESCUES
    fidelity: MODERATE
    description: >-
      Correcting the WFS1 variant restored robust dynamic insulin secretion in
      vitro and reversed pre-existing diabetes after transplantation into mice,
      with single-cell transcriptomics showing increased insulin and decreased
      endoplasmic reticulum stress gene expression.
    limitations: >-
      Transplantation was into mice with streptozocin-induced diabetes rather than
      into patients, so the therapeutic claim is preclinical and the diabetes
      reversed was chemically induced rather than WFS1-driven. The model addresses
      only the beta cell arm and says nothing about the neurodegenerative arm,
      which is what determines survival.
    readouts:
    - name: Endoplasmic reticulum stress gene expression in corrected beta cells
      target: Beta Cell Apoptosis and Insulin Deficiency
      direction: DECREASED
      interpretation: >-
        Falling endoplasmic reticulum stress gene expression after genetic
        correction is the direct molecular correlate of the node being relieved.
      evidence:
      - reference: PMID:32321868
        reference_title: Gene-edited human stem cell-derived β cells from a patient with monogenic diabetes reverse preexisting diabetes in mice.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Single-cell transcriptomics showed that corrected SC-β cells displayed increased insulin and decreased expression of genes associated with endoplasmic reticulum stress."
        explanation: >-
          Reports the measured direction of change in endoplasmic reticulum stress
          gene expression after correction.
    evidence:
    - reference: PMID:32321868
      reference_title: Gene-edited human stem cell-derived β cells from a patient with monogenic diabetes reverse preexisting diabetes in mice.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "After differentiation to β cells with our recent six-stage differentiation strategy, corrected WS SC-β cells performed robust dynamic insulin secretion in vitro in response to glucose and reversed preexisting streptozocin-induced diabetes after transplantation into mice."
      explanation: >-
        Establishes that genetic correction of the WFS1 variant restores beta cell
        function in this model system.
discussions:
- discussion_id: wfs_genotype_phenotype_tension
  kind: CONTROVERSY
  prompt: >-
    Are there established genotype-phenotype correlations in Wolfram syndrome, or
    only emerging ones?
  attaches_to:
  - genetic#WFS1 Biallelic Loss of Function
  rationale: >-
    GeneReviews takes the conservative position that no correlations are
    established, and that remains defensible. But a meta-analysis of 412 published
    patients concluded that age at onset of diabetes mellitus, hearing defects, and
    diabetes insipidus may depend on genotypic class, and that progression rate
    might too. The honest curation is to record the tension rather than to pick a
    side: the conservative statement and the emerging evidence are both current,
    and a curator reading only one of them would draw the wrong conclusion about
    how much a genotype tells you.
  evidence:
  - reference: PMID:23429432
    reference_title: "Genotypic classification of patients with Wolfram syndrome: insights into the natural history of the disease and correlation with phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "New genotype-phenotype correlations were established, disease progression rate for the general population and for the genotypic classes has been calculated, and new diagnostic criteria have been proposed."
    explanation: >-
      The meta-analysis states that it established new correlations, which is the
      claim in tension with the conservative position.
- discussion_id: wfs_neurodevelopment_vs_neurodegeneration
  kind: OPEN_QUESTION
  prompt: >-
    How much of the brain deficit in Wolfram syndrome is failed development rather
    than degeneration, and what does that imply for when a disease-modifying
    therapy must start?
  attaches_to:
  - pathophysiology#Brainstem and Cerebellar Volume Loss
  rationale: >-
    Longitudinal morphometry shows both stalled white-matter growth and frank
    degeneration, and abnormalities are present in the youngest and mildest
    patients. If a meaningful share of the deficit is growth that never happened,
    then a neuroprotective therapy started after symptoms appear can at best halt
    decline and can never recover what was not built, which moves the therapeutic
    window earlier than a purely degenerative model implies. The relative
    contribution of the two processes has not been quantified.
  evidence:
  - reference: PMID:30979932
    reference_title: Evidence for altered neurodevelopment and neurodegeneration in Wolfram syndrome using longitudinal morphometry.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These patterns suggest that there may be early, stalled white matter development in Wolfram syndrome, with additional degenerative processes in both white and gray matter."
    explanation: >-
      States the two-process interpretation whose relative weighting is the open
      question.
- discussion_id: wfs_gene_environment_interaction
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does environmental or metabolic stress that raises the unfolded-protein load
    accelerate disease in WFS1-deficient cells in humans?
  attaches_to:
  - pathophysiology#Unrestrained ER Stress Signaling Through ATF6-alpha
  rationale: >-
    Because wolframin's job is buffering endoplasmic reticulum stress, any stressor
    that raises the unfolded-protein load (glucotoxicity, inflammation, hypoxia)
    should in principle hit harder in a WFS1-null cell. There is preclinical
    support in that WFS1 deficiency produces a chronic proinflammatory state, but
    no human data measure whether glycemic control or inflammatory burden modifies
    the rate of neurodegeneration. Until they do, better glycemic control should
    not be curated as a protective factor for the neurological disease.
  proposed_experiments:
  - experiment_id: wfs_glycemic_burden_vs_progression
    name: Glycemic and inflammatory burden versus neurodegeneration rate
    description: >-
      In an existing longitudinal Wolfram cohort with serial brain morphometry,
      relate cumulative glycemic exposure and circulating inflammatory markers to
      the rate of brainstem and ventral pontine volume loss, to test whether
      modifiable stress load changes the neurodegenerative trajectory.
  evidence:
  - reference: PMID:33693650
    reference_title: Novel mutations in the WFS1 gene are associated with Wolfram syndrome and systemic inflammation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The identification of a state of systemic chronic inflammation associated with WFS1 deficiency may pave the way to innovative and personalized therapeutic interventions in WS."
    explanation: >-
      Establishes the chronic inflammatory state that makes the gene-environment
      question mechanistically plausible.
- discussion_id: wfs_nfl_as_progression_marker
  kind: KNOWLEDGE_GAP
  prompt: >-
    Can serum neurofilament light chain serve as a treatment-response marker in
    Wolfram syndrome, given that it is elevated but does not track progression?
  attaches_to:
  - biochemical#Elevated Serum Neurofilament Light Chain
  rationale: >-
    Neurofilament light chain is clearly elevated and glial fibrillary acidic
    protein is not, which is a clean biological signal about axonal injury. But
    within the Wolfram group it did not change over time and did not correlate with
    clinical severity or neuroimaging measures, so it fails as a monitoring
    biomarker on the evidence available. Whether it moves under an effective
    therapy is a different question and remains untested, and the field needs a
    progression marker badly because every trial so far has had to rely on slow
    clinical endpoints.
  evidence:
  - reference: PMID:41929703
    reference_title: Neurofilament light chain but not glial fibrillary acidic protein serum levels are elevated in Wolfram syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Future studies may be warranted to determine if NfL could be a treatment-response marker in Wolfram syndrome clinical trials."
    explanation: >-
      States the open question in the authors' own terms.
differential_diagnoses:
- name: Type 1 Diabetes Mellitus
  description: >-
    The commonest misdiagnosis, and the reason Wolfram syndrome is typically
    identified years late. Distinguished by autoimmunity: islet autoantibodies are
    positive in type 1 diabetes and negative here, HLA risk haplotypes are present
    there and absent here, and C-peptide falls faster. Genetic testing of every
    child with autoantibody-negative, non-HLA-associated insulin-dependent diabetes
    is the highest-yield case-finding intervention available.
  distinguishing_features:
  - Islet autoantibodies positive in type 1 diabetes, negative in Wolfram syndrome
  - HLA-DR3 and DR4 risk haplotypes present in type 1 diabetes only
  - Optic atrophy, diabetes insipidus, and deafness do not occur in isolated type 1
    diabetes
  evidence:
  - reference: PMID:20160352
    reference_title: Wolfram syndrome 1 gene negatively regulates ER stress signaling in rodent and human cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Wolfram syndrome is an autosomal-recessive disorder characterized by insulin-dependent diabetes mellitus, caused by nonautoimmune loss of beta cells, and neurological dysfunctions."
    explanation: >-
      The non-autoimmune basis of the beta cell loss is what separates this from
      type 1 diabetes.
- name: Mitochondrial Diabetes and Deafness
  description: >-
    Maternally inherited diabetes and deafness from the m.3243A>G variant overlaps
    clinically and was historically confused with Wolfram syndrome. Distinguished
    by maternal inheritance, the mitochondrial tRNA-Leu 3243 variant, and the
    absence of the autosomal recessive family pattern.
  distinguishing_features:
  - Maternal inheritance pattern rather than autosomal recessive
  - Mitochondrial tRNA-Leu 3243 variant present
  - Optic atrophy is not the typical visual lesion
  evidence:
  - reference: PMID:7490992
    reference_title: "Neurodegeneration and diabetes: UK nationwide study of Wolfram (DIDMOAD) syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Family studies indicate autosomal recessive inheritance with a carrier frequency of one in 354, an absence of a maternal history of diabetes or deafness, and an absence of the mitochondrial tRNA Leu (3243) mutation."
    explanation: >-
      Explicitly excludes the mitochondrial mimic on both inheritance pattern and
      genotype.
- name: Nonclassic (Dominant) WFS1 Spectrum Disorder
  description: >-
    Heterozygous WFS1 variants cause a distinct, dominantly inherited spectrum:
    DFNA6/14/38 low-frequency sensorineural hearing loss, Wolfram-like syndrome
    with adult-onset diabetes plus hearing loss and juvenile optic atrophy, and a
    de novo neonatal diabetes with congenital deafness and cataracts. The
    inheritance, the audiogram shape (low-frequency dominant versus high-frequency
    recessive), and the molecular mechanism (dominant-negative versus null) all
    differ. This entry deliberately covers only the recessive disease; the dominant
    spectrum belongs in separate entries.
  distinguishing_features:
  - Single heterozygous WFS1 variant with dominant transmission
  - Low-frequency rather than high-frequency sensorineural hearing loss
  - Milder or partial phenotype without the full DIDMOAD sequence
  evidence:
  - reference: PMID:20301750
    reference_title: WFS1 Spectrum Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nonclassic WFS1-SD. The diagnosis is established in a proband with suggestive findings and a heterozygous pathogenic (or likely pathogenic) variant identified by molecular genetic testing."
    explanation: >-
      GeneReviews formalizes the heterozygous, nonclassic spectrum as a separate
      diagnostic category from classic biallelic disease.
notes: >-
  Scope. This entry covers classic, autosomal recessive Wolfram syndrome under the
  umbrella MONDO term, with WFS1-related (WS1) and CISD2-related (WS2) forms as
  subtypes. The dominantly inherited nonclassic WFS1 spectrum (DFNA6/14/38,
  Wolfram-like syndrome, and the de novo neonatal diabetes-deafness-cataract
  presentation) is deliberately excluded and recorded as a differential instead.
  Inheritance, audiogram shape, and molecular mechanism all differ between the two,
  and blending them into one entry would misstate all three.

  TREATWOLFRAM. The randomized, double-blind, placebo-controlled sodium valproate
  trial (NCT03717909) is the most rigorous study the field has run, and it is
  reported to have missed its primary endpoint on the rate of visual acuity loss.
  At the time of curation only the trial protocol (PMID:40010822) is indexed in
  PubMed; there is no peer-reviewed results paper to cite. Valproate is therefore
  deliberately absent from treatments rather than being listed with a snippet that
  cannot support the claim, and the reported negative result is recorded here
  instead. It should be curated properly once the results paper appears.

  Nonclassic WFS1 disease accounts for roughly 15% of molecularly confirmed cases
  in UK specialist clinics per GeneReviews, so the recessive-only scope of this
  entry is a real restriction on coverage rather than a technicality.

  Deep research. Curated from a claude_code deep-research report
  (research/Wolfram_Syndrome-deep-research-claude_code.md), whose own reference
  validation reported 51/51 references verified with a confabulation rate of 0.0.
  Every snippet used here was independently re-verified against the cached PubMed
  record.
clinical_trials:
- name: NCT02829268
  phase: PHASE_II
  status: COMPLETED
  description: >-
    Open-label phase Ib/IIa trial of dantrolene sodium, the first clinical trial
    ever conducted in Wolfram syndrome. Safety and tolerability were the primary
    objective, with beta cell function, visual acuity, and neurological function
    as secondary. Published as PMID:34185708. Dantrolene was well tolerated and
    did not improve beta cell function, visual acuity, or neurological function.
  target_phenotypes:
  - preferred_term: Diabetes mellitus
    term:
      id: HP:0000819
      label: Diabetes mellitus
  - preferred_term: Optic atrophy
    term:
      id: HP:0000648
      label: Optic atrophy
  evidence:
  - reference: clinicaltrials:NCT02829268
    reference_title: A Phase 1b/2a Trial of Dantrolene Sodium in Pediatric and Adult Patients With Wolfram Syndrome
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The purpose of this study is to assess the safety and tolerability of dantrolene sodium in patients with Wolfram syndrome."
    explanation: >-
      Registry record establishing the trial and its primary objective.
  - reference: PMID:34185708
    reference_title: A phase Ib/IIa clinical trial of dantrolene sodium in patients with Wolfram syndrome.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Visual acuity and neurological functions were not improved by 6-month dantrolene sodium."
    explanation: >-
      The published result, which was negative on the efficacy endpoints.
- name: NCT05676034
  phase: PHASE_II
  status: ACTIVE_NOT_RECRUITING
  description: >-
    HELIOS, a single-center, single-arm, open-label phase II trial of AMX0035
    (sodium phenylbutyrate and taurursodiol) in twelve adults with Wolfram
    syndrome. Reported improved or stabilized pancreatic function, vision, and
    symptom burden at 24 and 48 weeks (PMID:42138079). The uncontrolled design is
    the reason the entry grades that result PARTIAL.
  target_phenotypes:
  - preferred_term: Diabetes mellitus
    term:
      id: HP:0000819
      label: Diabetes mellitus
  - preferred_term: Optic atrophy
    term:
      id: HP:0000648
      label: Optic atrophy
  evidence:
  - reference: clinicaltrials:NCT05676034
    reference_title: A Phase II Study of Safety and Efficacy of AMX0035 in Adult Patients With Wolfram Syndrome
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study is an open label Phase II study to evaluate the safety and efficacy of AMX0035 in adults with Wolfram syndrome."
    explanation: >-
      Registry record establishing the open-label single-arm design that qualifies
      the reported result.
- name: NCT03717909
  phase: PHASE_II
  status: COMPLETED
  description: >-
    TREATWOLFRAM, a randomized double-blind placebo-controlled trial of sodium
    valproate across six international centers, and the most rigorous study the
    field has run. Recruitment was stopped in November 2022 with 63 of a planned
    70 patients enrolled. The trial is reported to have missed its primary
    endpoint on the rate of visual acuity loss, but only the protocol paper
    (PMID:40010822) is indexed in PubMed at the time of curation, so that result
    is recorded in the entry notes rather than as evidence, and valproate is
    deliberately absent from treatments.
  target_phenotypes:
  - preferred_term: Optic atrophy
    term:
      id: HP:0000648
      label: Optic atrophy
  evidence:
  - reference: clinicaltrials:NCT03717909
    reference_title: "A Pivotal, International, Randomised, Double-blind, Efficacy and Safety Trial of Sodium Valproate, in Paediatric and Adult Patients With Wolfram Syndrome"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "70 paediatric and adult patients were initially planned to be randomised 2:1 to receive either sodium valproate or placebo at 6 international centres. 63 patients were recruited when a decision was made to stop the study recruitment in November 2022."
    explanation: >-
      Registry record establishing the randomized placebo-controlled design and
      the actual enrollment, which is the design context for the reported but
      unpublished negative result.

  - reference: clinicaltrials:NCT02841553
    reference_title: Wolfram Syndrome and WFS1-related Disorders International Registry and Clinical Study
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Aim 1. Establish and maintain a registry of patients with Wolfram syndrome. An Internet based registry will be employed to enroll participants with the clinical diagnosis of Wolfram syndrome (insulin dependent DM and bilateral OA). Clinical information regarding age of diagnosis and progression of the disease will be collated and analyzed to better define its natural history, along with potential metabolic phenotypes such as glucose intolerance of heterozygous parents and unaffected sibs."
    explanation: >-
      Establishes the registry, enrollment phenotype, and natural-history purpose.

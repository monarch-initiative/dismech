    snippet: "(i) 15% of published patients do not fulfill the current -inclusion criterion; (ii) genotypic prevalence differences may exist among countries; (iii) diabetes mellitus and optic atrophy might not be the first two clinical features in some patients; (iv) mutations are nonuniformly distributed in WFS1; (v) age at onset of diabetes mellitus, hearing defects, and diabetes insipidus may depend on the patient's genotypic class; and (vi) disease progression rate might depend on genotypic class."
    explanation: >-

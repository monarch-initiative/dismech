biochemical:
- name: Elevated Serum Neurofilament Light Chain
  presence: INCREASED
  context: >-
    Serum neurofilament light chain, a marker of neuroaxonal damage, is elevated in
    Wolfram syndrome relative to parents, unaffected siblings, and individuals with
    and without newly diagnosed type 1 diabetes, whereas glial fibrillary acidic
    protein is not. The specificity is informative about the biology, since it
    points to axonal injury rather than reactive astrogliosis. Its utility as a
    progression marker is limited, however, because levels did not change over time
    and did not correlate reliably with clinical or neuroimaging severity.
  evidence:
  - reference: PMID:41929703
    reference_title: Neurofilament light chain but not glial fibrillary acidic protein serum levels are elevated in Wolfram syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "NfL levels were higher in the Wolfram group relative to all control groups (p < 0.001, η p 2  = 0.51) after adjusting for age and sex, whereas GFAP levels were not different between any of the groups."
    explanation: >-
      Establishes elevated serum neurofilament light chain with unchanged glial
      fibrillary acidic protein.
  - reference: PMID:41929703
    reference_title: Neurofilament light chain but not glial fibrillary acidic protein serum levels are elevated in Wolfram syndrome.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Within the Wolfram group, neither NfL nor GFAP levels changed over time, and NfL levels did not correlate reliably with any measures of clinical disease severity or neurodegeneration (p > 0.05 after excluding outliers)."
    explanation: >-
      Qualifies the marker: elevated but not tracking progression, so it is a state
      marker rather than a monitoring biomarker.
genetic:
- name: WFS1 Biallelic Loss of Function
  gene_term:
    preferred_term: WFS1
    term:
      id: hgnc:12762
      label: WFS1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  subtype: WS1
  features: >-
    WFS1 lies at chromosome 4p16.1 and encodes wolframin, an endoplasmic reticulum
    transmembrane glycoprotein. More than 200 distinct variants have been reported,
    the majority loss of function (nonsense, frameshift, splice-site) with a
    substantial missense contingent in the C-terminal luminal domain. Biallelic
    loss of function accounts for roughly 90% of Wolfram syndrome. Genotype and
    phenotype correlation is emerging rather than settled.
  frequency: OBLIGATE
  evidence:

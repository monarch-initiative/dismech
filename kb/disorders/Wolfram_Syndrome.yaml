- name: CISD2 Biallelic Loss of Function
  gene_term:
    preferred_term: CISD2
    term:
      id: hgnc:24212
      label: CISD2
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  subtype: WS2
  features: >-
    CISD2 (also ZCD2, ERIS, Miner1) encodes a small protein of the
    mitochondria-associated endoplasmic reticulum membrane. The originally
    described homozygous missense change acts not through the amino acid
    substitution but by disrupting splicing, eliminating exon 2 and introducing a
    premature stop codon. CISD2 variants cause Wolfram syndrome 2 in families
    mapped to 4q22-25 who have no WFS1 variant.

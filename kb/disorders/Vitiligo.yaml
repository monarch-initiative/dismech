datasets:
- accession: geo:GSE298871
  title: Transcriptomic profiling of vitiligo patients shows polar immune dysregulation in involved and uninvolved skin
  description: 'Background: Vitiligo is a chronic autoimmune skin depigmenting disorder, with a major impact on quality of life. Therapeutic options are still limited, with only one topical JAK inhibitor being FDA-approved. Although vitiligo is primarily regarded as a Th1/IFN-driven disease, emerging evidence suggests the involvement of additional immune axes, but their relevance to disease pathogenesis remains unclear. Objective: To obtain a global cutaneous transcriptomic profile of lesional and nonlesional vitiligo. Results: Robust inflammatory dysregulation was captured not only in lesional, but also nonlesional vitiligo skin relative to healthy controls.'
  organism:

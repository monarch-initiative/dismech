    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: Patients received Nb-UVB three times per week for 6 months... 90% of lesions showed variable degrees of repigmentation and 10% showed increase in size, indicating increased activity of the disease.
    explanation: UVB treatments result in repigmentation in most cases, though some lesions increased in size, indicating potential exacerbation.
  exposure_term:
    preferred_term: UV light exposure
    term:
      id: ECTO:0000006
      label: exposure to ultraviolet radiation
- name: Stress
  influences_mechanisms:
  - target: Oxidative Stress
    environmental_effect: TRIGGERS
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Pointed at the oxidative stress node rather than at melanocyte
      destruction, because that is the step this entry models as making
      melanocytes vulnerable and it is the plausible entry point for a
      systemic stressor. The animal item is what gives that target choice
      any molecular purchase: restraint stress lowers cutaneous OGG1, the
      glycosylase that repairs oxidative guanine damage, which is this node's
      own currency. The intermediates are still recorded as unknown, because
      that chain was traced in mice whose depigmentation was chemically
      induced, and no human sentence here follows stress to any molecular
      step. Both human items are graded partial for the same reason from
      opposite directions: one is a recommendation from a study with no
      comparison group, the other a cross-sectional difference.
    evidence:
    - reference: PMID:26057504
      reference_title: "Vitiligo disease triggers: psychological stressors preceding the onset of disease."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Psychological stressors should be considered as potential disease triggers in vitiligo patients."
      explanation: >-
        Concludes that psychological stressors should be considered as
        potential disease triggers in affected patients. A recommendation
        about what to consider, from a questionnaire study without a
        comparison group, which is why it is partial rather than support.
    - reference: PMID:31986193
      reference_title: "The relationship between stress and vitiligo: Evaluating perceived stress and electronic medical record data."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Perceived stress was significantly higher among vitiligo individuals compared to those without vitiligo."
      explanation: >-
        Reports significantly higher perceived stress in affected individuals
        than in those without the disease. A cross-sectional difference, which
        cannot separate stress as cause from stress as consequence of a
        visible skin disease.
    - reference: PMID:37481827
      reference_title: "Restraint stress promotes monobenzone-induced depigmentation in mice via the activation of glucocorticoid receptor/macrophage migration inhibitory factor signaling pathway."
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: "restraint stress aggravated anxiety-like behaviors and increased levels of macrophage migration inhibitory factor (MIF) and corticosterone in the circulation, accompanied with decreasing the expression of cutaneous 8-oxoguanine DNA glycosylase (OGG1) in depigmentation mice"
      explanation: >-
        The only sentence in this link that reaches a molecule: restraint
        stress lowers cutaneous OGG1, the glycosylase that excises oxidised
        guanine, which is a step in the oxidative handling this node holds.
        Partial because the model is a mouse whose depigmentation was induced
        chemically, so the finding converges on the human claim without
        establishing it.
  description: Psychological stress is implicated in the exacerbation or onset of the disease.
  evidence:
  - reference: PMID:26057504
    reference_title: "Vitiligo disease triggers: psychological stressors preceding the onset of disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Psychological stressors should be considered as potential disease triggers in vitiligo patients.
    explanation: The study identifies psychological stressors as potential triggers for the onset of vitiligo.
  - reference: PMID:37481827
    reference_title: "Restraint stress promotes monobenzone-induced depigmentation in mice via the activation of glucocorticoid receptor/macrophage migration inhibitory factor signaling pathway."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Psychological stress triggers onset and development of vitiligo in humans.
    explanation: A restraint-stress mouse model shows psychological stress promotes vitiligo-related depigmentation, supporting stress as a disease trigger; the cited study is a mouse-model (plus in vitro) investigation, not a human study.
  - reference: PMID:31986193
    reference_title: "The relationship between stress and vitiligo: Evaluating perceived stress and electronic medical record data."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: Perceived stress was significantly higher among vitiligo individuals compared to those without vitiligo.
    explanation: The data supports the notion that stress is a precipitating factor in vitiligo development.
  exposure_term:
    preferred_term: Psychological stress exposure
    term:
      id: XCO:0001265
      label: stress
- name: Chemical Exposure
  influences_mechanisms:
  - target: Melanocyte Destruction
    environmental_effect: TRIGGERS
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      The best-evidenced exposure in this tranche, and the only one with a
      quantified effect: phenol and catechol derivatives carry a three- to
      fourfold increase in a case-control study. The intervening step is
      recorded as known because one cited sentence names it, describing these
      chemicals as appearing to induce melanocyte autoimmunity, which is the
      route to the destruction this node holds. That sentence also carries
      the resemblance claim, so a third item asserting only resemblance would
      have added a citation without adding a claim and was left on the
      exposure rather than the link.
    evidence:
    - reference: PMID:36433836
      reference_title: "Role of chemical exposure in the incidence of vitiligo: a case-control study in Tunisia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In the binary logistic regression model, household chemicals/colored toothpaste use...and an occupational exposure to phenol/catechol derivatives were significantly associated with vitiligo (three to fourfold increase)."
      explanation: >-
        Case-control study finding household chemicals and occupational
        exposure to phenol and catechol derivatives significantly associated
        with the disease, at a three- to fourfold increase.

- accession: geo:GSE205751
  title: Increased expression of LOC100506314 in T cells from patients with vitiligo and contributed to the pathogenesis of vitiligo
  description: The aim of this study was to investigate the differential expression of long non-coding RNAs (lncRNAs) in T cells from patients with vitiligo and their roles in the pathogenesis of vitiligo. The expression profiles of the RNA transcripts in T cells from three patients with vitiligo and three controls were conducted using microarray analysis. These aberrantly-expressed genes were further validated using T cells from 41 patients with vitiligo and 28 controls. The biologic function of the specific lncRNAs was investigated using transfection, RNA pull-down assay plus proteomic approach and Western blotting.

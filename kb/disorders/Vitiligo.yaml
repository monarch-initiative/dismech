- accession: ega:EGAS50000001317
  title: Immune control of functional memory CD8 T cells in normal-appearing vitiligo skin
  description: This study aimed to characterize immune cell states in nonlesional (NL) and perilesional (PL) skin of patients with vitiligo using single-cell RNA sequencing. Shared CD8⁺ T cell clusters were detected in both regions, with PL-derived cells enriched for immune activation pathways and NL skin showed stronger infiltration of regulatory T cells. These findings reveal functional T cell heterogeneity in vitiligo and highlight regulatory mechanisms that may limit depigmentation in NL skin.

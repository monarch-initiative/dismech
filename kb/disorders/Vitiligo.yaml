environmental:
- name: UV Exposure
  notes: >-
    Curation note: the evidence collected under this entry is entirely
    therapeutic ultraviolet phototherapy rather than an environmental exposure,
    so this arguably belongs under treatments rather than environmental. Kept
    here pending a curator decision; its pathograph link is modelled as
    protective accordingly.
  influences_mechanisms:
  - target: Skin depigmentation
    environmental_effect: PROTECTS_AGAINST
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Therapeutic ultraviolet phototherapy opposes the depigmented phenotype by
      driving repigmentation, stimulating melanocyte precursors out of the
      follicular reservoir to repopulate lesional skin. The target is the
      depigmentation phenotype rather than the melanocyte-destruction process,
      because repopulation after destruction is what the cited evidence
      measures; phototherapy's separate immunomodulatory action on the
      autoreactive attack is not evidenced here.
    evidence:
    - reference: PMID:34245476
      reference_title: "Is targeted UVB as effective as excimer light phototherapy in treatment of vitiligo?"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Targeted phototherapy with EL demonstrated better repigmenting efficacy than TUVB in vitiligo."
      explanation: >-
        Reports repigmenting efficacy for targeted ultraviolet phototherapy in
        vitiligo, an effect opposing the melanocyte loss this node describes.
  description: Promotes the repigmentation process in some cases, but can exacerbate the contrast in others.
  evidence:
  - reference: PMID:29124690
    reference_title: "Impact of Ultraviolet Light on Vitiligo."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: This chapter focuses on the use of ultraviolet light in vitiligo as an established therapeutic option.
    explanation: The reference suggests that UV light is used to treat vitiligo, which implies it can promote repigmentation. However, it does not address the exacerbation of contrast.
  - reference: PMID:34245476

- accession: geo:GSE231794
  title: Single-Cell Transcriptomics Reveals Peripheral Immune Responses in Non-Segmental Vitiligo
  description: Vitiligo is a common autoimmune depigmented dermatology due to the destruction of melanocytes. Much evidence suggests that vitiligo is associated with systemic immune activation. Previous studies have focused on immune cell infiltration in and around lesion areas, while few studies have investigated the cell types and function of circulating immune cells in peripheral blood. We collected peripheral blood from five patients with progressive non-segmental vitiligo (PV) and three healthy controls (HC).Single-cell RNA sequencing(scRNA-seq) is used to investigate the mechanisms of peripheral immune responses in vitiligo patients.

review_notes: >-
  Vitiligo is an acquired disorder of skin pigmentation characterized by the
  development of white patches due to loss of melanocytes. The depigmented
  patches and premature hair whitening are the defining features, alongside a
  frequent association with other autoimmune conditions and a substantial
  psychosocial impact. Curation caveat: several phenotype frequency bands in
  this entry were originally set from typical clinical presentation rather than
  from quantitative evidence, contrary to
  docs/frequency-evidence-guidelines.md. Bands that could not be tied to a
  quantitative source are being progressively removed or re-sourced; treat any
  remaining unsourced band as provisional.

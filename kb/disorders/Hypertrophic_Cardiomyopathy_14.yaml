name: Hypertrophic Cardiomyopathy 14
creation_date: "2026-08-31T00:00:00Z"
synonyms:
- CMH14
- MYH6 hypertrophic cardiomyopathy
- alpha-myosin heavy chain hypertrophic cardiomyopathy
- cardiomyopathy, familial hypertrophic, 14
- cardiomyopathy, hypertrophic, 14
- hypertrophic cardiomyopathy caused by mutation in MYH6
description: >-
  Hypertrophic cardiomyopathy 14 (CMH14) is the MYH6-attributed node of the
  hypertrophic cardiomyopathy gene series. MYH6 encodes the alpha-cardiac myosin
  heavy chain (alpha-MHC), the fast-ATPase sarcomeric motor that sits immediately
  beside MYH7 in a tandem gene pair on chromosome 14q11.2 and differs from its
  neighbour mainly in small pockets of an otherwise highly conserved molecule.

  The entity must be read with an explicit validity caveat, and that caveat is the
  single most important thing about it. ClinGen's Hereditary Cardiovascular Disease
  Gene Curation Expert Panel classifies the MYH6-hypertrophic cardiomyopathy
  gene-disease relationship as **Disputed**, downgraded from Limited in July 2023.
  The association rests on three probands across two publications, four unique
  heterozygous missense variants with limited pathogenicity evidence, and no known
  disease mechanism; further reported variants were excluded from scoring either
  because the proband also carried a variant in an established HCM gene or because
  the variant is common in the population. Dismech therefore curates CMH14 as a
  real MONDO entity whose pathophysiology is a *hypothesis under dispute*, not an
  established mechanism, and every mechanism node below is scoped accordingly.
  The downgrade has a direct clinical consequence, published as a 2025 JACC
  reappraisal by the same expert panel: a variant in a disputed gene should not be
  reported clinically, so a MYH6 variant returned by a legacy broad HCM panel is
  not a molecular diagnosis of this entity and does not support cascade testing.

  The mechanistic reason the association is hard to establish is an expression
  argument. Alpha-MHC is the major myosin of the human atrium and only a minor
  component of the human ventricle, where beta-MHC (MYH7) predominates. A
  heterozygous missense allele in the minor ventricular isoform is therefore a
  weak candidate for a disease defined by ventricular hypertrophy, which is the
  reverse of the situation for MYH7. What phenotypic signal exists is consistent
  across two independent cohorts and is a *late-onset* one: MYH6 variants were
  found in an elderly-onset HCM series in which none of the classic MYH7, TNNT2 or
  TPM1 alleles appeared, and in a second cohort MYH6 variants were confined to the
  late-onset arm while TNNT2 variants were confined to the early-onset arm.

  Named-entity caution, in two directions. First, MYH6 is Definitively associated
  with congenital heart defects and Limited for dilated cardiomyopathy; dismech
  already curates MYH6 as a causative gene in Atrial_Septal_Defect and
  Dilated_Cardiomyopathy_1EE, and as a susceptibility gene in
  Familial_Sick_Sinus_Syndrome and Hypoplastic_Left_Heart_Syndrome. None of those
  is this entry. Second, and more subtly, the classic and highly
  successful mouse models of familial HCM carry an R403Q allele knocked into mouse
  *Myh6* — but the human R403Q is an *MYH7* allele, and the mouse ventricle
  expresses alpha-MHC where the human ventricle expresses beta-MHC. Those mice
  model human MYH7 disease in the mouse's orthologous ventricular isoform; ClinGen
  explicitly declined to score them as MYH6 evidence. Model-organism literature
  retrieved by a text search for "Myh6" and "hypertrophic cardiomyopathy" is
  therefore mostly *not* about this entity.
category: Genetic
notes: >-
  MONDO:0013197 is_a familial hypertrophic cardiomyopathy (MONDO:0024573) and
  carries these cross-references, read from OLS at curation time: OMIM:613251,
  MEDGEN:442484, UMLS:C2750467, MESH:C567684, DOID:0110320, GARD:0024907. They
  are recorded here rather than in `mappings:` because `DiseaseMappings` provides
  only `mondo_mappings`, `ncit_mappings`, `icd10cm_mappings` and
  `icd11f_mappings`, and none of these identifiers belongs to those vocabularies.
  An ICD-10-CM mapping was considered and left out: the candidate codes (I42.1
  obstructive / I42.2 other hypertrophic cardiomyopathy) are HCM-level rather
  than CMH14-level, and neither is present in `cache/icd10cm/terms.csv`, so
  binding one would assert a mapping this repository cannot currently validate. The stub recorded a single causal gene,
  MYH6 (hgnc:7576), and no MONDO descendants, so the entity is a leaf and the
  lump/split call is a straightforward DISEASE at the same granularity as the
  fifteen sibling Hypertrophic_Cardiomyopathy_<N> entries already curated.

  Curation precedent: this entry follows Hypertrophic_Cardiomyopathy_25 (TCAP),
  which is likewise ClinGen Disputed and is curated as a real entity carrying an
  explicit dispute rather than omitted. Two further siblings rest on Limited
  relationships (NEXN in CMH20, TTN in CMH9). Curating a contested entity is
  deliberate: the alternative is that the OMIM-derived name circulates with no
  record anywhere of how thin its evidence is.

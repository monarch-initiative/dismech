      explanation: >-
        The measurement establishing that a lesion in alpha-MHC acts, in the human
        ventricle, on a minor isoform, which is what this edge contributes.
- name: Altered Sarcomere Motor Function
  biological_scale: MOLECULAR
  description: >-
    The hypothesised proximal consequence of an HCM-attributed MYH6 allele is a
    change in the actin-based motor behaviour of the affected myosin molecules
    within the ventricular sarcomere, by analogy with the well-characterised MYH7
    missense alleles. This node carries no direct evidence for any human
    HCM-attributed MYH6 variant: no functional characterisation of such an allele
    has been published, which is one of the stated grounds for ClinGen's Disputed
    classification. It is retained as an explicit hypothesis node rather than
    dropped, so that the gap is visible and addressable.

inheritance:
- name: Autosomal dominant
  description: >-
    Where a mode of inheritance has been assigned to MYH6-attributed hypertrophic
    cardiomyopathy it is autosomal dominant transmission of a heterozygous
    missense allele, which is the mode ClinGen records for the relationship it
    then classified as Disputed. Segregation evidence is correspondingly thin: the
    Q1065H proband's two unaffected offspring did not carry the allele, and the
    elderly-onset series that produced the founding variant was explicitly
    selected for absent family history.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  evidence:
  - reference: CGGV:assertion_ee5380a4-0dee-49aa-b911-141502648144-2023-07-12T020000.000Z
    reference_title: "MYH6 / hypertrophic cardiomyopathy (Disputed)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "MYH6 | HGNC:7576 | hypertrophic cardiomyopathy | MONDO:0005045 | AD | Disputed | SOP9 | Hereditary Cardiovascular Disease Gene Curation Expert Panel"
    explanation: >-
      ClinGen records autosomal dominant as the mode of inheritance for the
      MYH6-HCM relationship, in the same row that classifies that relationship as
      Disputed.
  - reference: PMID:15998695
    reference_title: "Alpha-myosin heavy chain: a sarcomeric gene associated with dilated and hypertrophic phenotypes of cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A Q1065H mutation was detected in 1 of 21 HCM probands and was absent in 2 unaffected offspring."
    explanation: >-
      The only segregation observation reported for an HCM-attributed MYH6 allele
      is the absence of Q1065H in two unaffected offspring of the proband.
prevalence:
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    No population prevalence exists for the MYH6-attributed form of hypertrophic
    cardiomyopathy, and none can responsibly be derived while the gene-disease
    relationship is Disputed. The only quantitative anchors are yields within
    referral HCM cohorts: MYH6 accounted for 3 of 41 clinically selected variants
    (7.5%) in a 70-patient Italian NGS series, and a MYH6 allele was found in 1 of
    21 HCM probands in an earlier candidate-gene screen. ClinGen judged the
    variant behind that second figure to be common in the population, so even
    these cohort yields overstate the disease-attributable fraction.
  evidence:
  - reference: PMID:27483260
    reference_title: "A Next-Generation Sequencing Approach to Identify Gene Mutations in Early- and Late-Onset Hypertrophic Cardiomyopathy Patients of an Italian Cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "TNNT2, CAV3 and MYH6 (3/41 = 7.5% each)"
    explanation: >-
      Gives the MYH6 share of clinically selected variants in a 70-patient
      referral HCM cohort. A cohort variant share is not a population prevalence.
  - reference: CGGV:assertion_ee5380a4-0dee-49aa-b911-141502648144-2023-07-12T020000.000Z
    reference_title: "MYH6 / hypertrophic cardiomyopathy (Disputed)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "or high frequency in the population (Carniel et al. 2005, PMID 15998695)"
    explanation: >-
      ClinGen's reason for excluding the Carniel variants from scoring is why no
      prevalence band is asserted from that cohort's yield.
mechanistic_hypotheses:
- hypothesis_group_id: myh6_minor_ventricular_isoform_hcm
  hypothesis_label: Minor-ventricular-isoform sarcomere model of MYH6 hypertrophic cardiomyopathy
  status: EMERGING
  description: >-
    The proposed model is that a heterozygous missense allele in alpha-MHC alters
    the motor function of the minor myosin isoform of the human ventricle, and
    that this is sufficient to seed the same maladaptive hypertrophic remodeling
    that beta-MHC (MYH7) alleles produce. The model has never been tested
    directly. No functional study of any HCM-attributed human MYH6 allele has been
    published, ClinGen states outright that the disease mechanism is unknown, and
    the model has to explain why a lesion in the ventricle's minor isoform would
    produce a ventricular phenotype at all. The observed late-onset skew is
    consistent with a weak-effect allele requiring decades of accumulated
    remodeling, but that is a post-hoc reading, not a tested prediction. This
    hypothesis group is what every pathophysiology edge in this entry belongs to;
    the entry asserts no established MYH6 mechanism.
  evidence:
  - reference: CGGV:assertion_ee5380a4-0dee-49aa-b911-141502648144-2023-07-12T020000.000Z
    reference_title: "MYH6 / hypertrophic cardiomyopathy (Disputed)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The mechanism for disease remains unknown."
    explanation: >-
      ClinGen's expert-panel judgement that no disease mechanism is established is
      the reason this is curated as a hypothesis rather than as pathophysiology.
  - reference: PMID:6234108
    reference_title: "Myosin types in the human heart. An immunofluorescence study of normal and hypertrophied atrial and ventricular myocardium."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "myosin heavy chain alpha was found to be a major component of atrial myosin and a minor component of ventricular myosin"
    explanation: >-
      Establishes the expression constraint the model must overcome: alpha-MHC is
      the minor ventricular isoform in the human heart.
pathophysiology:
- name: MYH6 Missense Variant in Alpha-Myosin Heavy Chain
  biological_scale: MOLECULAR
  role: trigger
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Primary Cardiomyocyte Insult"
  description: >-
    The proposed initiating lesion in CMH14 is a heterozygous missense variant in
    MYH6, encoding the alpha-cardiac myosin heavy chain. Four unique missense
    alleles have been reported in HCM probands with limited pathogenicity
    evidence. The reported alleles fall in conserved residues and are predicted to
    change the structure or chemical bonding of the protein, but no functional
    assay of any HCM-attributed MYH6 allele has been reported, and this node is
    therefore an attributed lesion rather than a demonstrated one.

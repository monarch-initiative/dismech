diagnosis:
- name: Targeted hypertrophic cardiomyopathy gene panel
  description: >-
    Molecular diagnosis in HCM uses a targeted gene panel on the proband. The
    consequence of the ClinGen reappraisal for this entity is negative rather
    than positive: because MYH6 is classified Disputed for HCM, a MYH6 variant
    returned by a panel that still carries the gene should not be reported as
    causative and should not be used for cascade testing in relatives. There is
    consequently no molecular test that establishes CMH14 in a proband — which is
    a statement about the entity, not about the patient, whose hypertrophy is
    real and is investigated and managed as hypertrophic cardiomyopathy either
    way.
  notes: >-
    The same conclusion was reached empirically, and years before the ClinGen
    reappraisal, by the Italian NGS cohort study, which argued from its own yield
    data for a narrow rather than a broad HCM panel.
  evidence:
  - reference: PMID:39971408
    reference_title: "Genes Associated With Hypertrophic Cardiomyopathy: A Reappraisal by the ClinGen Hereditary Cardiovascular Disease Gene Curation Expert Panel."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Nine (29%) genes were downgraded to disputed, further discouraging clinical reporting of variants in these genes."
    explanation: >-
      States the reporting consequence of a disputed classification, which is what
      this diagnostic entry records for MYH6.
  - reference: PMID:27483260
    reference_title: "A Next-Generation Sequencing Approach to Identify Gene Mutations in Early- and Late-Onset Hypertrophic Cardiomyopathy Patients of an Italian Cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings support the choice of a limited, well-selected panel of HCM genes as the best tool for diagnostic purposes."
    explanation: >-
      Independent, pre-ClinGen support for a narrow HCM panel, reached from the
      same cohort in which MYH6 variants appeared only in the low-yield
      late-onset arm.
experimental_models:
- name: MYH6 c.G3755A patient-derived iPSC line
  experimental_model_type: IPSC_DERIVED_MODEL
  description: >-
    An induced pluripotent stem cell line derived from peripheral blood
    mononuclear cells of a 41-year-old man with hypertrophic cardiomyopathy
    carrying a heterozygous MYH6 G3755A variant. This is a resource report: the
    line was characterised for pluripotency, karyotype and the presence of the
    variant, but no cardiomyocyte phenotype was assayed, so it does not yet
    constitute functional evidence for the allele. It is the closest thing to a
    human model system that exists for this entity, and testing it is the
    experiment ClinGen's Disputed classification is waiting on.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  evidence:
  - reference: PMID:33385793
    reference_title: "Generation of an IPSC line from a patient with hypertrophic cardiomyopathy carrying a mutation in MYH6 gene."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The generated iPSC line expressed pluripotency markers, exhibited a normal karyotype, presented the specific mutation, and demonstrated differentiation potential into three germ layers in vitro."
    explanation: >-
      Characterises the line itself — pluripotency, karyotype, presence of the
      MYH6 variant, and trilineage differentiation capacity — which is what
      qualifies it as a usable model system for this entity.
  modeled_mechanisms:
  - target: MYH6 Missense Variant in Alpha-Myosin Heavy Chain
    relationship: PERTURBS
    fidelity: UNKNOWN
    description: >-
      The line carries the patient's own heterozygous MYH6 allele in a human
      genetic background, so it reproduces the initiating lesion of this entry
      exactly.
    limitations: >-
      No differentiated-cardiomyocyte phenotype has been reported for this line —
      no contractility, sarcomere-organisation, or calcium-handling readout. It
      therefore establishes the lesion is modellable, not that it is pathogenic.
      Fidelity is UNKNOWN rather than HIGH for that reason.
    evidence:
    - reference: PMID:33385793
      reference_title: "Generation of an IPSC line from a patient with hypertrophic cardiomyopathy carrying a mutation in MYH6 gene."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "An induced pluripotent stem cell (iPSC) line was generated from peripheral blood mononuclear cells (PBMCs) of a 41-year-old male patient with hypertrophic cardiomyopathy who carries a G3755A heterozygote mutation in the MYH6 gene."
      explanation: >-
        Establishes the existence and genotype of the line, and that it derives
        from an HCM patient carrying the MYH6 allele.
animal_models:
- name: alpha-MHC 403/+ mouse (Myh6 R403Q knock-in)
  species: Mouse
  genotype: Myh6 R403Q heterozygous knock-in
  publication: PMID:8614836
  description: >-
    The founding mouse model of familial hypertrophic cardiomyopathy, made by
    knocking an Arg403Gln substitution into the mouse alpha-cardiac myosin heavy
    chain gene. Heterozygotes develop myocyte disarray, hypertrophy and fibrosis
    that increase with age and closely resemble human familial HCM.

    This model is listed here for an unusual reason: to record that it is *not*
    evidence for this entry. The R403Q allele it carries is a human MYH7 allele.
    It was placed in mouse Myh6 because the mouse ventricle expresses alpha-MHC
    where the human ventricle expresses beta-MHC — a species substitution intended
    to model human MYH7 disease faithfully, not to model human MYH6 disease at
    all. ClinGen reviewed these mice and explicitly declined to score them as MYH6
    evidence. Because a naive text search for "Myh6" plus "hypertrophic
    cardiomyopathy" retrieves this large and influential literature first, leaving
    it unrecorded would invite exactly the misattribution it represents.
  evidence:
  - reference: PMID:8614836
    reference_title: "A mouse model of familial hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Homozygous alpha MHC 403/403 mice died 7 days after birth, and sedentary heterozygous alpha MHC 403/+ mice survived for 1 year."
    explanation: >-
      Establishes the model's genotype-viability structure, and that the
      heterozygote — the arm analogous to human dominant disease — is the
      long-lived, phenotypable one.
  - reference: CGGV:assertion_ee5380a4-0dee-49aa-b911-141502648144-2023-07-12T020000.000Z
    reference_title: "MYH6 / hypertrophic cardiomyopathy (Disputed)"
    supports: REFUTE
    evidence_source: OTHER
    snippet: "these mice models are not analogous to human MYH6"
    explanation: >-
      Cited as REFUTE against treating this model as informative for the present
      entity. It is the reason the model is listed with a FAILS_TO_RECAPITULATE
      link to the initiating lesion rather than as supporting evidence.
  modeled_mechanisms:
  - target: Maladaptive Ventricular Remodeling
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      For the conserved sarcomeric-HCM remodeling programme — disarray,
      hypertrophy, fibrosis, age-dependent progression — this model is faithful to
      human disease, which is why it became the reference HCM model.
    limitations: >-
      Faithful to sarcomeric HCM in general, not to MYH6 attribution in
      particular. The allele is MYH7-derived and the gene is the mouse's
      orthologous ventricular isoform, so the model speaks to the downstream
      remodeling node only.
    evidence:
    - reference: PMID:8614836
      reference_title: "A mouse model of familial hypertrophic cardiomyopathy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Cardiac histopathology and dysfunction in the alpha MHC 403/+ mice resembled human FHC."
      explanation: >-
        Establishes that the model reproduces the histopathology and dysfunction
        of human familial HCM.
  - target: MYH6 Missense Variant in Alpha-Myosin Heavy Chain
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      The model does not represent the initiating lesion of this entry. It carries
      an MYH7-derived allele in the mouse ventricular myosin isoform, which is a
      different molecular claim from a human MYH6 missense allele in the human
      ventricle's minor isoform.
    limitations: >-
      The species substitution that makes this model good for human MYH7 disease
      is exactly what makes it inapplicable to human MYH6: mouse ventricular
      myosin is alpha-MHC, human ventricular myosin is beta-MHC, so putting a
      beta-MHC allele into mouse alpha-MHC preserves the ventricular context while
      changing the gene. Reading it as MYH6 evidence inverts the intent.
    evidence:
    - reference: PMID:8614836
      reference_title: "A mouse model of familial hypertrophic cardiomyopathy."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "A mouse model of familial hypertrophic cardiomyopathy (FHC) was generated by the introduction of an Arg 403 --> Gln mutation into the alpha cardiac myosin heavy chain (MHC) gene."
      explanation: >-
        The construction described is an R403Q allele in alpha-MHC. R403Q is a
        human MYH7 allele, so this establishes the gene/allele mismatch that makes
        the model inapplicable to human MYH6.
    - reference: CGGV:assertion_ee5380a4-0dee-49aa-b911-141502648144-2023-07-12T020000.000Z
      reference_title: "MYH6 / hypertrophic cardiomyopathy (Disputed)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Additional studies on mice models of HCM using pre-engineered heterozygous, pathogenic MYH7 variant orthologous to the human p.R403Q allele into the mouse MYH6 were reviewed, but not scored because these mice models are not analogous to human MYH6"
      explanation: >-
        ClinGen's expert panel states directly that these mouse models are not
        analogous to human MYH6 and were excluded from scoring on that basis.
discussions:
- discussion_id: myh6_hcm_allele_functional_effect_unknown
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does any HCM-attributed human MYH6 missense allele alter alpha-myosin motor
    function, and if so is the effect large enough to matter in a ventricle where
    alpha-MHC is the minor isoform?
  attaches_to:
  - pathophysiology#Altered Sarcomere Motor Function
  - mechanistic_hypotheses#myh6_minor_ventricular_isoform_hcm
  rationale: >-
    This is the gap that keeps the gene-disease relationship Disputed rather than
    Limited or Moderate. ClinGen states that the mechanism for disease remains
    unknown, and the reason is that no functional characterisation of any
    HCM-attributed MYH6 allele has been published — the supporting functional
    literature it could find was about alpha-MHC's normal biochemistry, not about
    any patient allele. Because alpha-MHC is a minor ventricular isoform, a
    demonstrated functional effect would also need a dosage argument to explain a
    ventricular phenotype, so an assay showing a change is necessary but not
    sufficient. A patient-derived iPSC line carrying an MYH6 HCM allele already
    exists and has never been phenotyped as cardiomyocytes, which makes this an
    unusually tractable gap.
  evidence:
  - reference: CGGV:assertion_ee5380a4-0dee-49aa-b911-141502648144-2023-07-12T020000.000Z
    reference_title: "MYH6 / hypertrophic cardiomyopathy (Disputed)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The mechanism for disease remains unknown."
    explanation: >-
      The expert-panel statement that defines this gap.
  - reference: CGGV:assertion_ee5380a4-0dee-49aa-b911-141502648144-2023-07-12T020000.000Z
    reference_title: "MYH6 / hypertrophic cardiomyopathy (Disputed)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The gene-disease association is supported by expression studies in the human heart"
    explanation: >-
      Shows what the supporting functional literature actually consists of —
      normal-biology expression and biochemistry studies, not characterisation of
      any patient allele, which is precisely the gap.
  - reference: PMID:33385793
    reference_title: "Generation of an IPSC line from a patient with hypertrophic cardiomyopathy carrying a mutation in MYH6 gene."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The generated iPSC line expressed pluripotency markers, exhibited a normal karyotype, presented the specific mutation, and demonstrated differentiation potential into three germ layers in vitro."
    explanation: >-
      Establishes that a characterised patient-derived line carrying an MYH6 HCM
      allele already exists and is differentiation-competent, which is what makes
      this gap tractable.
  proposed_experiments:
  - experiment_id: exp_myh6_ipsc_cardiomyocyte_phenotyping
    name: Cardiomyocyte phenotyping of the MYH6 G3755A patient iPSC line
    description: >-
      Differentiate the existing patient-derived iPSC line and an isogenic
      variant-corrected control to ventricular cardiomyocytes and compare
      contractile and sarcomeric readouts. An isogenic control is essential: the
      line is from a single patient, so any uncorrected comparison confounds the
      allele with genetic background.
    would_support:
    - pathophysiology#Altered Sarcomere Motor Function
    would_refute:
    - pathophysiology#Altered Sarcomere Motor Function
    supporting_outcome:
    - >-
        Variant cardiomyocytes show altered contractile kinetics or sarcomere
        disorganisation relative to the isogenic control, with the effect
        abolished by correction of the allele.
    refuting_outcome:
    - >-
        Variant and isogenic-corrected cardiomyocytes are indistinguishable
        across contractile and sarcomeric readouts, indicating the allele has no
        measurable effect in a human ventricular-like cell.
    perturbations:
    - name: Isogenic correction of the MYH6 G3755A allele
      target: pathophysiology#MYH6 Missense Variant in Alpha-Myosin Heavy Chain
      effect: DECREASED
      gene:
        preferred_term: MYH6
        term:
          id: hgnc:7576
          label: MYH6
      description: >-
        CRISPR correction of the patient allele to wild type in the derived iPSC
        line, giving an isogenic control that differs only at the variant site.
    readouts:
    - name: Sarcomere organisation in differentiated cardiomyocytes
      target: pathophysiology#Altered Sarcomere Motor Function
      interpretation: >-
        Disorganisation in the variant line relative to its isogenic control would
        be the first functional evidence for any HCM-attributed MYH6 allele.
- discussion_id: myh6_mouse_myh6_r403q_is_myh7_disease
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    The reference mouse models of hypertrophic cardiomyopathy carry their
    mutations in Myh6. Does that make them models of human MYH6 disease?
  attaches_to:
  - pathophysiology#MYH6 Missense Variant in Alpha-Myosin Heavy Chain
  - animal_models#alpha-MHC 403/+ mouse (Myh6 R403Q knock-in)
  rationale: >-
    No, and the mismatch is a species-level isoform switch that is easy to miss
    because the gene symbol matches. The human ventricle runs predominantly on
    beta-MHC (MYH7) with alpha-MHC as a minor component; the mouse ventricle runs
    on alpha-MHC. To model a human MYH7 ventricular allele faithfully in a mouse,
    the field therefore put the human MYH7-derived R403Q substitution into mouse
    Myh6 — preserving the ventricular context by changing the gene. The resulting
    alpha-MHC 403/+ mouse and its descendants, including allele-specific silencing
    work targeting mutant Myh6 transcripts, form a large and influential
    literature indexed under Myh6 and hypertrophic cardiomyopathy that is
    substantively about MYH7 biology.

    This matters concretely for curation. A text- or database-driven search for
    MYH6 model evidence returns these mice first, and they look like strong
    support: the phenotype is convincing, the gene symbol is right, and the
    disease term is right. ClinGen reviewed them and declined to score them for
    exactly this reason. Any future strengthening of the MYH6-HCM relationship has
    to come from human alleles or from a model built on a human MYH6 allele, not
    from this body of work.
  evidence:
  - reference: CGGV:assertion_ee5380a4-0dee-49aa-b911-141502648144-2023-07-12T020000.000Z
    reference_title: "MYH6 / hypertrophic cardiomyopathy (Disputed)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "these mice models are not analogous to human MYH6"
    explanation: >-
      ClinGen's explicit statement of the mismatch, and its stated ground for
      excluding the mouse literature from the MYH6 gene-disease evaluation.
  - reference: PMID:6234108
    reference_title: "Myosin types in the human heart. An immunofluorescence study of normal and hypertrophied atrial and ventricular myocardium."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "heavy chain beta was found to be a major component of ventricular myosin and a minor component of atrial myosin"
    explanation: >-
      Establishes the human side of the species isoform difference that creates
      the mismatch.
- discussion_id: myh6_late_onset_skew_allele_or_ascertainment
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is the late-onset skew of MYH6-attributed hypertrophic cardiomyopathy a
    property of the allele, or an artefact of how elderly-onset HCM cohorts are
    ascertained?
  attaches_to:
  - phenotypes#Late-Onset Presentation
  rationale: >-
    The late-onset association is the most reproducible observation about this
    entity — it appears in the founding elderly-onset series and independently in
    a later cohort designed to contrast extreme ages at diagnosis. But the same
    cohorts show that elderly-onset HCM has a far lower genetic yield overall
    (23% versus 86% in the early-onset arm of the Italian series), which is the
    signature of a group enriched for phenocopies and for variants of small or
    absent effect. A weak-effect allele producing genuinely late disease and a
    benign variant surfacing in a low-yield cohort predict the same observation.
    Distinguishing them requires case-control allele-frequency comparison in
    age-stratified cohorts rather than more case series, and the answer bears
    directly on whether the Disputed classification should move in either
    direction.

    The nearest existing approach to that comparison is the ExAC-referenced
    burden analysis of 7,855 cardiomyopathy cases, which found MYH6 rare
    variation indistinguishable from background. It does not settle the question
    here, for a reason worth stating so it is not misread later: MYH6 appears
    only in that study's dilated cardiomyopathy panel and not in its hypertrophic
    panel, and the analysis was not age-stratified. So it constrains the gene's
    general credibility rather than answering the age question, which remains
    open.
  evidence:
  - reference: PMID:27483260
    reference_title: "A Next-Generation Sequencing Approach to Identify Gene Mutations in Early- and Late-Onset Hypertrophic Cardiomyopathy Patients of an Italian Cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mutation detection rate was 85.7% (30/35) in the EO group and 22.9% (8/35) in the LO group."
    explanation: >-
      Quantifies the low genetic yield of the late-onset arm in which MYH6
      variants were exclusively found, which is the basis for the ascertainment
      alternative.
- discussion_id: myh6_cooccurring_established_gene_variants
  kind: KNOWLEDGE_GAP
  prompt: >-
    How much of the reported MYH6 hypertrophic cardiomyopathy signal survives once
    probands carrying a variant in an established HCM gene are excluded?
  attaches_to:
  - pathophysiology#MYH6 Missense Variant in Alpha-Myosin Heavy Chain
  - phenotypes#Sudden Cardiac Death
  rationale: >-
    Co-occurrence is the dominant confounder in this literature rather than an
    occasional complication. ClinGen excluded reported MYH6 variants from scoring
    on the grounds that the proband also carried a variant in another HCM gene, in
    three separate publications — a Japanese family with a MYH6 frameshift
    alongside an MYH7 missense variant, a multi-omics pedigree study in which the
    MYH6 carrier also carried a TNNT2 variant, and part of the Italian NGS series.
    In each case the severe phenotype is at least as attributable to the
    established gene. What remains after those exclusions is three probands, and
    that residue is the whole quantitative basis of the entity.
  evidence:
  - reference: CGGV:assertion_ee5380a4-0dee-49aa-b911-141502648144-2023-07-12T020000.000Z
    reference_title: "MYH6 / hypertrophic cardiomyopathy (Disputed)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "but were not scored because probands have variants in another HCM gene"
    explanation: >-
      States the exclusion criterion and, with the accompanying citation list, its
      scope across the reported literature.
  - reference: PMID:34087240
    reference_title: "Identification of three novel pathogenic mutations in sarcomere genes associated with familial hypertrophic cardiomyopathy based on multi-omics study."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "The proband of Family 1 and his father carried TNNT2-rs397516484 and MYH6-rs372446459 missense mutations"
    explanation: >-
      A worked instance of the confound: the MYH6 carriers in this pedigree also
      carry a TNNT2 variant, so the phenotype cannot be attributed to MYH6.
references:

- name: Maladaptive Ventricular Remodeling
  biological_scale: TISSUE
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Ventricular Remodeling"
  description: >-
    Downstream of a sarcomeric insult the myocardium undergoes the conserved
    maladaptive remodeling programme of hypertrophic cardiomyopathy: cardiomyocyte
    hypertrophy, myocyte disarray, and interstitial fibrosis producing asymmetric
    wall thickening in a non-dilated ventricle. This chain is well established for
    sarcomeric HCM as a class and is imported here from the
    cardiomyopathy_maladaptive_remodeling module; the MYH6-specific claim is only
    that a MYH6 allele is what initiates it, which is the disputed step upstream.

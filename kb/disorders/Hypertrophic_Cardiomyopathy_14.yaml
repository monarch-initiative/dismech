- name: Progressive Contractile Dysfunction and Progression to Dilation
  biological_scale: ORGANISM
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Progressive Contractile Dysfunction"
  description: >-
    In the single cohort that followed MYH6-attributed HCM carriers clinically,
    the reported course was not stable hypertrophy but progression toward chamber
    dilation, left ventricular dysfunction and refractory heart failure — the
    "burnt-out" end of the HCM spectrum. This is also the observation the same
    authors used to argue that MYH6 alleles produce a phenotypic continuum from
    hypertrophic to dilated cardiomyopathy, which is consistent with MYH6 being
    separately, if weakly, associated with dilated cardiomyopathy.

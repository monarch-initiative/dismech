    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "chronic exposure to hemodynamic overload can induce marked changes in the myosin heavy chain composition of human atria, whereas it affects only slightly that of the ventricles"
    explanation: >-
      Shows the isoform distribution is load-responsive in the atrium but largely
      fixed in the ventricle, so ventricular hypertrophy does not recruit alpha-MHC
      into a larger role.
  - reference: PMID:10388558
    reference_title: "Comparative sequence analysis of the complete human sarcomeric myosin heavy chain family: implications for functional diversity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "functional diversity among MyHCs is likely to be accomplished by having small pockets of sequence diversity in an otherwise highly conserved molecule"
    explanation: >-
      Explains why alpha- and beta-MHC are hard to separate functionally by
      sequence alone, which is part of why an MYH6 missense allele is difficult to
      interpret against the well-characterised MYH7 alleles.
  downstream:

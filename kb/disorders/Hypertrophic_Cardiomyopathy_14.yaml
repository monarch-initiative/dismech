phenotypes:
- category: Cardiac
  name: Left Ventricular Hypertrophy
  description: >-
    Asymmetric left ventricular wall thickening in a non-dilated ventricle is the
    defining phenotype of the HCM series and the diagnostic entry criterion for
    every cohort in which an MYH6 allele has been reported. In the elderly-onset
    series that produced the founding MYH6 variant, maximal wall thickness
    averaged 19.9 mm.
  phenotype_term:
    preferred_term: Left ventricular hypertrophy
    term:
      id: HP:0001712
      label: Left ventricular hypertrophy
    onset:
      onset_category: LATE
      mean_age_years: 62.8
      notes: >-
        Mean age at diagnosis in the elderly-onset cohort that yielded the
        founding alpha-MHC variant; mean age at first symptom in that series was
        59.3 years.
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:11815426
    reference_title: "Sarcomere protein gene mutations in hypertrophic cardiomyopathy of the elderly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Echocardiography demonstrated maximal left ventricular wall thickness of 19.9+/-3.8 mm"
    explanation: >-
      Quantifies the hypertrophy in the cohort from which the founding MYH6 HCM
      variant was reported.
  sequelae:
  - target: Left Ventricular Outflow Tract Obstruction
    description: >-
      Septal thickening with systolic anterior motion of the mitral valve is what
      generates the dynamic outflow gradient.
    evidence:
    - reference: PMID:11815426
      reference_title: "Sarcomere protein gene mutations in hypertrophic cardiomyopathy of the elderly."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "systolic anterior motion of the mitral valve (58%), and, in 11 individuals, left ventricular outflow tract gradients"
      explanation: >-
        Reports systolic anterior motion and measurable outflow gradients
        co-occurring with the hypertrophy in the same cohort, which is the
        observed form of this edge.
  - target: Left Ventricular Diastolic Dysfunction
    description: >-
      A hypertrophied, stiffened ventricle fills poorly.
    evidence:
    - reference: PMID:34087240
      reference_title: "Identification of three novel pathogenic mutations in sarcomere genes associated with familial hypertrophic cardiomyopathy based on multi-omics study."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "accompanied by diastolic and systolic dysfunction and impaired myocardial work"
      explanation: >-
        Reports diastolic dysfunction alongside the hypertrophic phenotype.
        INDIRECT: the carriers also carry a TNNT2 variant.
- category: Cardiac
  name: Hypertrophic Cardiomyopathy
  description: >-
    The clinical entity itself: a hypertrophied, non-dilated left ventricle in the
    absence of another cardiac or systemic cause, which is the criterion by which
    every reported MYH6 carrier was ascertained.
  phenotype_term:
    preferred_term: Hypertrophic cardiomyopathy
    term:
      id: HP:0001639
      label: Hypertrophic cardiomyopathy
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:27483260
    reference_title: "A Next-Generation Sequencing Approach to Identify Gene Mutations in Early- and Late-Onset Hypertrophic Cardiomyopathy Patients of an Italian Cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical diagnosis of HCM was based on the echocardiographic demonstration of a hypertrophied and not dilated left ventricle"
    explanation: >-
      States the ascertainment criterion applied to the cohort in which MYH6
      variants were found exclusively in the late-onset arm.
- category: Cardiac
  name: Late-Onset Presentation
  description: >-
    The most reproducible feature of MYH6-attributed HCM is when it is found
    rather than what it looks like. Two independent cohorts converge: the founding
    variant came from a series selected for elderly onset, in which initial
    symptoms occurred at a mean of 59 years and diagnosis at 63 years with no
    family history of cardiomyopathy; and in a later Italian series MYH6 variants
    appeared only in the late-onset arm, while TNNT2 variants appeared only in the
    early-onset arm. Whether this reflects a genuinely weak-effect allele or the
    lower genetic yield and higher phenocopy rate of elderly HCM cohorts is not
    resolved, and is the reason a Disputed relationship can still show a
    consistent phenotypic skew.
  notes: >-
    Deliberately carries no phenotype_term. The observation is an age-of-onset
    statement, and HPO encodes onset under HP:0003674 rather than as a phenotypic
    abnormality, so no term in the PhenotypeTerm enum names it. The structured
    onset data is recorded instead on the Left Ventricular Hypertrophy
    phenotype_term as an OnsetDescriptor (LATE, mean 62.8 years). This node is
    retained because the late-onset skew is the most reproducible observation
    about the entity and is the anchor for a knowledge gap.
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:11815426
    reference_title: "Sarcomere protein gene mutations in hypertrophic cardiomyopathy of the elderly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Initial symptoms occurred at 59.3 (+/-12.3) years, and diagnosis was made at 62.8 (+/-10.8) years."
    explanation: >-
      Gives the age at onset and diagnosis in the elderly-onset cohort that
      yielded the founding alpha-MHC variant.
  - reference: PMID:27483260
    reference_title: "A Next-Generation Sequencing Approach to Identify Gene Mutations in Early- and Late-Onset Hypertrophic Cardiomyopathy Patients of an Italian Cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In fact, mutations in MYH6 were identified in the LO group only, whereas mutations in TNNT2 were identified in the EO group only."
    explanation: >-
      Independent replication of the late-onset skew in a second cohort designed
      to contrast the extremes of age at diagnosis.
  - reference: PMID:11815426
    reference_title: "Sarcomere protein gene mutations in hypertrophic cardiomyopathy of the elderly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The distribution of mutations in elderly-onset disease is strikingly different (P<0.00001) from that of familial, early onset hypertrophic cardiomyopathy."
    explanation: >-
      Establishes that the gene distribution behind elderly-onset HCM, which is
      where MYH6 appears, differs significantly from that of classic familial HCM.
- category: Cardiac
  name: Left Ventricular Outflow Tract Obstruction
  description: >-
    Dynamic outflow tract obstruction with systolic anterior motion of the mitral
    valve, as seen in the elderly-onset HCM cohort from which the founding MYH6
    variant was reported. Recorded as a cohort-level feature of the clinical
    context rather than a MYH6-specific finding.
  phenotype_term:
    preferred_term: Left ventricular outflow tract obstruction
    term:
      id: HP:0032092
      label: Left ventricular outflow tract obstruction
  frequency: FREQUENT
  evidence:
  - reference: PMID:11815426
    reference_title: "Sarcomere protein gene mutations in hypertrophic cardiomyopathy of the elderly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "systolic anterior motion of the mitral valve (58%), and, in 11 individuals, left ventricular outflow tract gradients"
    explanation: >-
      Reports systolic anterior motion and measurable outflow gradients in the
      cohort. This is the general elderly-HCM phenotype, not a MYH6-attributed one.
- category: Cardiac
  name: Congestive Heart Failure
  description: >-
    Progression to refractory heart failure was the reported course in the
    MYH6-attributed HCM lineage, and heart failure was also a presenting feature
    in the family carrying a MYH6 frameshift alongside an MYH7 missense variant.
  phenotype_term:
    preferred_term: Congestive heart failure
    term:
      id: HP:0001635
      label: Congestive heart failure
  evidence:
  - reference: PMID:15998695
    reference_title: "Alpha-myosin heavy chain: a sarcomeric gene associated with dilated and hypertrophic phenotypes of cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "progression toward dilation, left ventricular dysfunction, and refractory heart failure"
    explanation: >-
      Refractory heart failure is the reported endpoint of the MYH6-attributed HCM
      course.
- category: Cardiac
  name: Sudden Cardiac Death
  description: >-
    Sudden cardiac-related death was reported in a Japanese family carrying a MYH6
    frameshift variant together with an MYH7 missense variant. Attribution is
    explicitly confounded: the authors present the severity as a property of the
    double genotype, and ClinGen excluded this family from MYH6 scoring precisely
    because a variant in an established HCM gene was also present.
  notes: >-
    Deliberately left with no incoming pathograph edge. Sudden death in HCM
    arises from an arrhythmic substrate of myocyte disarray and fibrosis, but no
    such node is curated in this entry because no MYH6-specific evidence supports
    one, and the single reported death comes from a family carrying an MYH7
    variant as well. Drawing an edge from the remodeling node would assert a
    mechanism for this entity that its literature does not contain.
  phenotype_term:
    preferred_term: Sudden cardiac death
    term:
      id: HP:0001645
      label: Sudden cardiac death
  evidence:
  - reference: PMID:35911064
    reference_title: "A double heterozygous variant in MYH6 and MYH7 associated with hypertrophic cardiomyopathy in a Japanese Family."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Family members with the double variants demonstrated severe phenotypes, such as sudden cardiac-related death and heart failure."
    explanation: >-
      Graded INDIRECT because the phenotype is attributed to the double MYH6/MYH7
      genotype, so it does not establish sudden death as a consequence of the MYH6
      allele alone.
- category: Cardiac
  name: Left Ventricular Diastolic Dysfunction
  description: >-
    Impaired ventricular filling from a thickened, stiff ventricle. Reported in
    MYH6 variant carriers in a multi-omics pedigree study alongside systolic
    dysfunction and impaired myocardial work, though those carriers also carried a
    TNNT2 variant.
  phenotype_term:
    preferred_term: Left ventricular diastolic dysfunction
    term:
      id: HP:0025168
      label: Left ventricular diastolic dysfunction
  evidence:
  - reference: PMID:34087240
    reference_title: "Identification of three novel pathogenic mutations in sarcomere genes associated with familial hypertrophic cardiomyopathy based on multi-omics study."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "They presented with heart failure and abnormal electrocardiogram, accompanied by diastolic and systolic dysfunction and impaired myocardial work."
    explanation: >-
      Reports diastolic and systolic dysfunction in the pedigrees carrying the
      MYH6 variant. INDIRECT because those carriers also carry a TNNT2 variant, so
      the finding cannot be attributed to MYH6 alone.
- category: Cardiac
  name: Progression to Ventricular Dilation
  description: >-
    Unlike the stable hypertrophy typical of sarcomeric HCM, the reported
    MYH6-attributed carriers progressed toward chamber dilation and systolic
    failure — the "burnt-out" phase of the HCM spectrum. This is also the
    observation behind the claim that MYH6 alleles span a phenotypic continuum
    from hypertrophic to dilated cardiomyopathy.
  phenotype_term:
    preferred_term: Dilated cardiomyopathy
    term:
      id: HP:0001644
      label: Dilated cardiomyopathy
  evidence:
  - reference: PMID:15998695
    reference_title: "Alpha-myosin heavy chain: a sarcomeric gene associated with dilated and hypertrophic phenotypes of cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the HCM phenotype was characterized by progression toward dilation, left ventricular dysfunction, and refractory heart failure"
    explanation: >-
      Reports dilation as the observed course in the MYH6-attributed HCM carriers.
  sequelae:
  - target: Congestive Heart Failure
    description: >-
      Dilation with systolic dysfunction is what produces the refractory heart
      failure endpoint.
    evidence:
    - reference: PMID:15998695
      reference_title: "Alpha-myosin heavy chain: a sarcomeric gene associated with dilated and hypertrophic phenotypes of cardiomyopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "progression toward dilation, left ventricular dysfunction, and refractory heart failure"
      explanation: >-
        States dilation, dysfunction and heart failure as one reported sequence,
        which is the ordering this edge encodes.
genetic:
- name: MYH6
  gene_term:
    preferred_term: MYH6
    term:
      id: hgnc:7576
      label: MYH6
  relationship_type: DISPUTED
  notes: >-
    MYH6 encodes the alpha-cardiac myosin heavy chain, the actin-based sarcomeric
    motor that is the dominant myosin of the human atrium and a minor component of
    the human ventricle. It lies in a tandem pair with MYH7 on chromosome 14q11.2.
    Its attribution as a cause of hypertrophic cardiomyopathy is ClinGen Disputed;
    its attribution to congenital heart defects is ClinGen Definitive, and to
    dilated cardiomyopathy Limited. The reported HCM alleles are heterozygous
    missense changes, with one frameshift reported in a family that also carried an
    MYH7 missense variant.

    Variant-level record, which for a disputed entity is the argument rather than
    a detail. The alleles attributed to HCM are p.Gln1065His (Carniel 2005,
    excluded from ClinGen scoring as too common in the population), the
    alpha-cardiac myosin heavy chain missense variant reported in the
    elderly-onset series (Niimura 2002), c.G3755A (Wang 2020, the iPSC line
    donor), rs372446459 (Liu 2021, co-occurring with a TNNT2 variant), and
    p.Lys364fs (Suzuki 2022, co-occurring with an MYH7 missense variant). Set
    against these, the best-supported human MYH6 variant of any kind is
    p.Arg721Trp, and its phenotype is sick sinus syndrome rather than
    hypertrophy.
  evidence:
  - reference: CGGV:assertion_ee5380a4-0dee-49aa-b911-141502648144-2023-07-12T020000.000Z
    reference_title: "MYH6 / hypertrophic cardiomyopathy (Disputed)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "MYH6 gene encodes alpha heavy chain subunit of cardiac myosin (MHC-α), which are actin-based molecular motors that convert chemical energy released from the hydrolysis of ATP."
    explanation: >-
      ClinGen's statement of the gene product and its molecular function.
  - reference: PMID:11815426
    reference_title: "Sarcomere protein gene mutations in hypertrophic cardiomyopathy of the elderly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Rather, mutations in cardiac myosin binding protein-C, troponin I, and alpha-cardiac myosin heavy chain caused elderly-onset hypertrophic cardiomyopathy."
    explanation: >-
      The founding claim that alpha-cardiac myosin heavy chain variants underlie
      elderly-onset HCM, which is the origin of the CMH14 entity.
  - reference: PMID:27532257
    reference_title: "Reassessment of Mendelian gene pathogenicity using 7,855 cardiomyopathy cases and 60,706 reference samples."
    supports: REFUTE
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "MYH6 121 60328 0.00143 1.06 (0.34-3.34) 0.06 (0.00-0.70)"
    explanation: >-
      Case-excess burden testing against 60,706 ExAC reference samples puts MYH6
      rare variation at essentially background level, with an odds ratio of 1.06
      whose confidence interval spans 1 and an etiological fraction of 0.06.
      Scope note, because it is easy to overstate: this row sits in the paper's
      *dilated* cardiomyopathy panel, and MYH6 does not appear in its hypertrophic
      cardiomyopathy panel at all. It is therefore graded INDIRECT — it shows that
      MYH6 rare variation is not distinguishable from background in a large
      cardiomyopathy case series, which undermines the gene's general credibility
      as a cardiomyopathy gene without being a direct measurement of HCM burden.
  - reference: PMID:27532257
    reference_title: "Reassessment of Mendelian gene pathogenicity using 7,855 cardiomyopathy cases and 60,706 reference samples."
    supports: REFUTE
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "these are in fact genes that have the highest background"
    explanation: >-
      The authors' own reading of that result: genes implicated through candidate
      studies rather than linkage, MYH6 among them, show little excess burden and
      instead carry the highest background variation. Stated in the paper about
      reported contributors to dilated cardiomyopathy, hence INDIRECT here.
  - reference: PMID:39971408
    reference_title: "Genes Associated With Hypertrophic Cardiomyopathy: A Reappraisal by the ClinGen Hereditary Cardiovascular Disease Gene Curation Expert Panel."
    supports: REFUTE
    evidence_source: OTHER
    snippet: "Nine (29%) genes were downgraded to disputed, further discouraging clinical reporting of variants in these genes."
    explanation: >-
      The peer-reviewed publication of the ClinGen reappraisal round that moved
      MYH6 from Limited to Disputed, and its stated consequence for reporting.
      Cited as REFUTE against MYH6 as a reportable HCM gene. Note the abstract
      gives the count of downgraded genes rather than naming them; that MYH6 is
      one of the nine comes from the ClinGen assertion record cited above, which
      records the same expert panel and the same Limited-to-Disputed transition.
  - reference: PMID:21378987
    reference_title: "A rare variant in MYH6 is associated with high risk of sick sinus syndrome."
    supports: NO_EVIDENCE
    evidence_source: HUMAN_CLINICAL
    snippet: "associates with sick sinus syndrome with an odds ratio = 12.53"
    explanation: >-
      Recorded as NO_EVIDENCE for the hypertrophic claim, because it is about a
      different phenotype. It is here for calibration: this is what a
      well-supported MYH6 genotype-phenotype association looks like — a
      population-scale effect size with an odds ratio of 12.53 — against which the
      three-proband hypertrophic claim can be judged.
  - reference: CGGV:assertion_44f4a5ee-8b1d-44b7-87ca-967968d8c0c4-2023-05-09T040000.000Z
    reference_title: "MYH6 / MYH-6 related congenital heart defects (Definitive)"
    supports: NO_EVIDENCE
    evidence_source: OTHER
    snippet: "MYH6 | HGNC:7576 | MYH-6 related congenital heart defects | MONDO:0800442 | AD | Definitive"
    explanation: >-
      Recorded as NO_EVIDENCE for the hypertrophic claim: this assertion is about a
      different MYH6 phenotype entirely. It is cited to make the named-entity
      hazard explicit — MYH6's Definitive disease association is congenital heart
      defects, not hypertrophic cardiomyopathy, and literature searches on the gene
      return that relationship first.
treatments:
- name: Negative Inotropic Pharmacotherapy
  description: >-
    First-line symptomatic therapy for obstructive HCM: a beta-blocker, with a
    non-dihydropyridine calcium channel blocker or disopyramide added or
    substituted when symptoms persist. Management in this entity is the
    management of hypertrophic cardiomyopathy — guideline algorithms branch on
    obstructive versus non-obstructive physiology and on sudden-death risk, not
    on genotype, and no MYH6-directed therapy exists or is in development.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: beta-adrenergic antagonist
      term:
        id: NCIT:C29576
        label: Beta-Adrenergic Antagonist
    - preferred_term: calcium channel blocker
      term:
        id: NCIT:C333
        label: Calcium Channel Blocker
    - preferred_term: disopyramide
      term:
        id: NCIT:C61730
        label: Disopyramide
  evidence:
  - reference: PMID:38718139
    reference_title: "2024 AHA/ACC/AMSSM/HRS/PACES/SCMR Guideline for the Management of Hypertrophic Cardiomyopathy: A Report of the American Heart Association/American College of Cardiology Joint Committee on Clinical Practice Guidelines."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "provides recommendations to guide clinicians in the management of patients with hypertrophic cardiomyopathy"
    explanation: >-
      Establishes the current AHA/ACC guideline as the source of management
      recommendations for HCM, which is how this entity is managed. Cited for the
      guideline's scope rather than for an individual drug recommendation, because
      the cached record is the structured abstract rather than the recommendation
      tables.
- name: Cardiac Myosin Inhibition
  description: >-
    Mavacamten and aficamten are allosteric cardiac myosin inhibitors that
    reduce actin-myosin cross-bridge formation and relieve dynamic outflow
    obstruction, each with a positive phase III trial in symptomatic obstructive
    HCM.

    Worth stating plainly for this entity: these drugs act on beta-cardiac
    myosin, the MYH7 product that dominates the human ventricle. They are not
    targeted at the alpha-myosin this entry is named for. That is not a reason to
    withhold them from a patient with obstructive HCM — the indication is
    physiological, not genotypic — but it does mean the one mechanistically
    targeted therapy in HCM targets the other myosin, which is the same isoform
    asymmetry that makes the MYH6 attribution doubtful in the first place.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: mavacamten
      term:
        id: CHEBI:756998
        label: mavacamten
    - preferred_term: aficamten
      term:
        id: CHEBI:747213
        label: aficamten
  target_mechanisms:
  - target: Alpha-MHC Is the Minor Myosin Isoform of the Human Ventricle
    description: >-
      Linked to the isoform node rather than to the MYH6 lesion, because that is
      where the drugs actually act: they inhibit the beta-MHC that constitutes
      the bulk of ventricular myosin. The link records a mechanistic mismatch
      between the entity's named gene and its most specific available therapy.
    evidence:
    - reference: PMID:32871100
      reference_title: "Mavacamten for treatment of symptomatic obstructive hypertrophic cardiomyopathy (EXPLORER-HCM): a randomised, double-blind, placebo-controlled, phase 3 trial."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "mavacamten, a first-in-class cardiac myosin inhibitor"
      explanation: >-
        Identifies the drug class as a direct cardiac myosin inhibitor, which is
        what makes the isoform it inhibits the relevant mechanistic detail.
  evidence:
  - reference: PMID:32871100
    reference_title: "Mavacamten for treatment of symptomatic obstructive hypertrophic cardiomyopathy (EXPLORER-HCM): a randomised, double-blind, placebo-controlled, phase 3 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We aimed to assess the efficacy and safety of mavacamten, a first-in-class cardiac myosin inhibitor, in symptomatic obstructive hypertrophic cardiomyopathy."
    explanation: >-

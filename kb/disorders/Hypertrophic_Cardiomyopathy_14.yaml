- name: Alpha-MHC Is the Minor Myosin Isoform of the Human Ventricle
  biological_scale: TISSUE
  description: >-
    In the human heart alpha-MHC is the dominant myosin of the atrium and only a
    minor component of ventricular myosin, while beta-MHC (MYH7) is the dominant
    ventricular isoform. This isoform distribution is the central difficulty for
    any MYH6 model of a ventricular hypertrophic phenotype, and it is also why the
    murine literature does not transfer: the mouse ventricle runs on alpha-MHC.
    The same study shows the distribution is not fixed — chronically overloaded
    human atria shift substantially toward beta-MHC, whereas hypertrophied
    ventricles change only slightly.
  molecular_functions:
  - preferred_term: alpha-myosin heavy chain actin-based motor activity
    term:
      id: GO:0000146
      label: microfilament motor activity
  cell_types:
  - preferred_term: ventricular cardiomyocyte
    term:

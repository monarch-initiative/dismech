    evidence_source: IN_VITRO
    snippet: "Sedoheptulose 1-phosphate is shown to be a substrate for aldolase B, which cleaves it to dihydroxyacetone-phosphate and erythrose."
    explanation: The biochemical experiment establishes the central cleavage step in the erythritol bypass.

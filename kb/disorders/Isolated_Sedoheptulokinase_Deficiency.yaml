- name: Fructokinase and aldolase B bypass to erythritol
  role: central_effector
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    In a supported but inferential bypass mechanism, fructokinase
    phosphorylates sedoheptulose at position 1; aldolase B cleaves
    sedoheptulose 1-phosphate to erythrose and dihydroxyacetone phosphate, and
    erythrose is reduced to erythritol. The source describes the final steps
    subjunctively, so this route is provisional rather than established.

diagnosis:
- name: Urinary sugar and polyol profiling
  description: >-
    Gas chromatography-mass spectrometry or liquid chromatography-tandem mass
    spectrometry can identify the paired increase in urinary sedoheptulose and
    erythritol. Biallelic SHPK testing and, when needed, a fibroblast enzyme
    assay confirm the biochemical defect. CTNS-region deletion testing is
    required when cystinosis is clinically or genetically possible.
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  evidence:
  - reference: PMID:25647543
    reference_title: "First two unrelated cases of isolated sedoheptulokinase deficiency: A benign disorder?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Erythritol, sedoheptulose, and sedoheptulose-7P were quantified in urine of both patients by liquid chromatography tandem mass spectrometry (LC-MS/MS)"
    explanation: The defining study documents quantitative urinary-metabolite testing in both cases.
  - reference: PMID:18186520
    reference_title: "Sedoheptulokinase deficiency due to a 57-kb deletion in cystinosis patients causes urinary accumulation of sedoheptulose: elucidation of the CARKL gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "deletion of CARKL causes urinary accumulation of sedoheptulose and erythritol."
    explanation: >-
      Establishes that the same biochemical signature can arise from the
      cystinosis-associated contiguous deletion and therefore must not be used
      alone to infer an isolated SHPK defect.
differential_diagnoses:
- name: Nephropathic cystinosis with the recurrent 57-kb deletion
  disease_term:
    preferred_term: nephropathic cystinosis
    term:
      id: MONDO:0100151
      label: nephropathic cystinosis
  description: >-
    The recurrent cystinosis deletion removes CTNS together with SHPK and part
    of TRPV1, producing the same sedoheptulose/erythritol signature. Renal
    Fanconi syndrome, elevated cellular cystine, corneal cystine crystals, and
    biallelic CTNS loss distinguish cystinosis from isolated SHPK deficiency.
  distinguishing_features:
  - Biallelic CTNS loss and the cystinosis phenotype favor the contiguous-deletion disorder.
  - Intragenic biallelic SHPK variants without CTNS loss favor the isolated biochemical trait.
  evidence:
  - reference: PMID:18186520
    reference_title: "Sedoheptulokinase deficiency due to a 57-kb deletion in cystinosis patients causes urinary accumulation of sedoheptulose: elucidation of the CARKL gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most common mutation in the nephropathic cystinosis (CTNS) gene is a homozygous 57-kb deletion that also includes an adjacent gene carbohydrate kinase-like (CARKL)."
    explanation: Directly establishes SHPK/CARKL loss as part of the recurrent CTNS deletion.
- name: Transaldolase deficiency
  disease_term:
    preferred_term: transaldolase deficiency
    term:
      id: MONDO:0011624
      label: transaldolase deficiency
  description: >-
    Transaldolase deficiency can produce neonatal liver disease and a broad
    urinary sugar/polyol abnormality. TALDO1 testing and especially elevated
    sedoheptulose 7-phosphate distinguish it from isolated SHPK deficiency,
    where sedoheptulose 7-phosphate is low to normal.
  distinguishing_features:
  - Elevated sedoheptulose 7-phosphate and biallelic TALDO1 variants favor transaldolase deficiency.
  - Low-to-normal sedoheptulose 7-phosphate and biallelic SHPK variants favor isolated SHPK deficiency.
  evidence:
  - reference: PMID:25647543
    reference_title: "First two unrelated cases of isolated sedoheptulokinase deficiency: A benign disorder?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "while in patients with TALDO deficiency, sedoheptulose-7P in particular is highly elevated."
    explanation: The defining report supplies the biochemical discriminator from transaldolase deficiency.

name: Isolated Sedoheptulokinase Deficiency
creation_date: '2026-08-09T00:56:17Z'
updated_date: '2026-08-09T00:56:17Z'
category: Mendelian
synonyms:
- Isolated SHPK deficiency
- SHPK deficiency
- SHPKD
- CARKL deficiency
description: >-
  Isolated sedoheptulokinase deficiency is an autosomal recessive biochemical
  trait caused by biallelic loss-of-function variants in SHPK. Loss of
  sedoheptulokinase activity reduces conversion of free sedoheptulose to
  sedoheptulose 7-phosphate and produces elevated urinary sedoheptulose and
  erythritol. Only two unrelated individuals have been reported; their clinical
  presentations were discordant, and the defining study explicitly questioned
  whether SHPK deficiency caused either presentation. The reproducible
  biochemical phenotype is therefore modeled without causal edges to the
  reported clinical findings. This isolated defect is distinct from secondary
  SHPK loss within the recurrent 57-kb CTNS-region deletion that causes
  nephropathic cystinosis.
disease_term:
  preferred_term: isolated sedoheptulokinase deficiency
  term:
    id: MONDO:0014969
    label: isolated sedoheptulokinase deficiency
parents:
- Inborn disorder of pentose phosphate metabolism
- Inborn Error of Metabolism
notes: >-
  MONDO:0014969 cross-references OMIM:617213 and ORPHA:440713 and associates
  SHPK with the entity, matching WP-008 seed row 3.5.05.01. The word
  "isolated" excludes the common cystinosis-associated 57-kb deletion, which
  removes CTNS together with SHPK and part of TRPV1. Clinical features reported
  in the two isolated cases are deliberately not curated as SHPK-deficiency
  phenotypes because the source authors found no shared clinical feature and
  could not establish causality.

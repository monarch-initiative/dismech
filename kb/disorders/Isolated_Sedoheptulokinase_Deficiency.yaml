discussions:
- discussion_id: gap_shpk_clinical_causality
  prompt: >-
    Is isolated SHPK deficiency a clinically penetrant disorder, or a largely
    benign biochemical trait that was incidental to the two reported patients'
    non-overlapping syndromes?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Free sedoheptulose accumulation
  - pathophysiology#Fructokinase and aldolase B bypass to erythritol
  rationale: >-
    The only two reported individuals had distinct clinical presentations, the
    defining authors explicitly could not establish causality, and the
    Shpk-knockout mouse reproduces the biochemical profile without supplying a
    human-like clinical phenotype. The pathograph therefore stops at urinary
    sedoheptulose and erythritol rather than treating cholestasis,
    hypoglycemia, anemia, arthrogryposis, contractures, or dysmorphism as
    downstream consequences.
  evidence:
  - reference: PMID:25647543
    reference_title: "First two unrelated cases of isolated sedoheptulokinase deficiency: A benign disorder?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There remains the question of whether SHPK deficiency is the causal factor for the clinical phenotypes of our patients."
    explanation: The source authors explicitly identify clinical causality as unresolved.
  - reference: PMID:25647543
    reference_title: "First two unrelated cases of isolated sedoheptulokinase deficiency: A benign disorder?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Since both patients presented very differently and without a clear clinical overlap"
    explanation: Non-overlapping presentations argue against a reproducible SHPK-associated syndrome.
  proposed_experiments:
  - experiment_id: exp_shpk_recall_lof_homozygotes
    name: Genotype-first recall and biochemical phenotyping of SHPK loss-of-function homozygotes
    description: >-
      Identify biallelic SHPK loss-of-function carriers in population genomic
      cohorts, confirm urinary sedoheptulose and erythritol, and compare deeply
      phenotyped clinical outcomes with matched controls.
- discussion_id: gap_shpk_human_mouse_clinical_mismatch
  prompt: >-
    Does complete SHPK loss cause any human tissue injury under developmental or
    metabolic stress that is absent from the available Shpk-knockout mouse data?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#SHPK enzymatic activity deficiency
  rationale: >-
    The mouse model reproduces the metabolite signature but not the two human
    presentations. This may reflect a benign human trait, species-specific
    compensation, or unrelated diagnoses in the index cases; current evidence
    cannot distinguish those explanations.
  evidence:
  - reference: PMID:34823997
    reference_title: Deficiency of the sedoheptulose kinase (Shpk) does not alter the ability of hematopoietic stem cells to rescue cystinosis in the mouse model.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "the adjacent sedopheptulose kinase SHPK/CARKL gene encoding a metabolic enzyme that influences macrophage polarization."
    explanation: >-
      Provides the immunometabolic rationale for testing whether complete SHPK
      loss has stress-dependent consequences that are absent from the current
      mouse phenotype; it is not treated as evidence of human tissue injury.
  proposed_experiments:
  - experiment_id: exp_shpk_stress_challenge_mouse
    name: Developmental and metabolic stress phenotyping of Shpk-null mice
    description: >-
      Compare Shpk-null and wild-type mice under dietary sedoheptulose exposure,
      fasting, inflammatory challenge, and ageing while measuring PPP flux,
      urinary metabolites, immune responses, and liver, kidney, muscle, and
      neurodevelopmental outcomes.

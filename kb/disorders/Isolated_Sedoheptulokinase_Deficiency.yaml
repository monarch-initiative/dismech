  features: >-
    The two reported individuals carried different homozygous nonsense variants,
    c.355C>T (p.Arg119Ter) and c.211G>T (p.Glu71Ter). Both variants produced a
    severe functional defect, but the publication did not establish that either
    variant caused the individuals' discordant clinical syndromes.

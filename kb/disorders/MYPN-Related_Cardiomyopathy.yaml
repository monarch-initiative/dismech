name: MYPN-Related Cardiomyopathy
creation_date: "2026-09-02T00:00:00Z"
synonyms:
- dilated cardiomyopathy 1KK
- CMD1KK
- cardiomyopathy, dilated, 1KK
- cardiomyopathy, hypertrophic, 22
- cardiomyopathy, familial restrictive, 4
- MYPN dilated cardiomyopathy
- myopalladin-related cardiomyopathy
description: >-
  Heterozygous variants in MYPN, encoding the Z-disc and I-band protein
  myopalladin, cause an inherited cardiomyopathy that is not confined to a single
  morphological pattern: the same gene produces dilated, hypertrophic and
  restrictive disease, and MONDO:0014100 is the single class carrying all three
  labels (CMD1KK, CMH22 and CMR4). This entry is curated at the gene level for
  that reason. Myopalladin is not a contractile protein. It is a scaffold and a
  messenger: it anchors the Z-disc by binding titin, alpha-actinin-2, nebulette
  and desmin, and it shuttles to the nucleus with the transcriptional cofactor
  CARP/ANKRD1, so a MYPN lesion damages both the mechanical integrity of the
  sarcomere and the stress-responsive gene program that reads its load. The
  branch point that decides which cardiomyopathy pattern a family develops is
  allelic and mechanistic rather than nosological: truncating and dominant-negative
  alleles that disturb myofibrillogenesis (Q529X) produce restrictive
  physiology, while an N-terminal allele that fails to reach the nucleus and
  binds CARP poorly (Y20C) produces hypertrophic remodelling, and
  haploinsufficiency alleles (I83fsX105) produce dilation. Because the pattern is
  downstream of a shared Z-disc lesion, splitting the concept across three
  morphology-named entries would separate branches of one pathograph. The
  gene-disease relationship is real but not strongly evidenced: ClinGen's Dilated
  Cardiomyopathy expert panel classifies MYPN-DCM as Limited, so a MYPN variant of
  uncertain significance does not by itself establish this diagnosis. Biallelic
  MYPN loss-of-function causes a distinct skeletal-muscle disease (nemaline/cap
  myopathy) and is out of scope here.
category: Genetic

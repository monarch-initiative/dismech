      id: HP:0001644
      label: Dilated cardiomyopathy
  evidence:
  - reference: PMID:18006477
    reference_title: Mutations in the Z-band protein myopalladin gene and idiopathic dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Idiopathic dilated cardiomyopathy (DCM) is a cardiac disorder characterized
      by left ventricular dilatation and impaired systolic contraction.
    explanation: >-
      Supplies the case definition of the dilated pattern in the series that
      identified MYPN as a dilated cardiomyopathy gene.
- name: Hypertrophic cardiomyopathy
  category: Cardiovascular
  description: >-
    Unexplained ventricular wall thickening, reached by the Y20C allele in human
    carriers and reproduced in cardiac-restricted transgenic mice. MONDO carries
    "cardiomyopathy, hypertrophic, 22" as a synonym of this entry's anchor class.
  phenotype_term:
    preferred_term: Hypertrophic cardiomyopathy
    term:
      id: HP:0001639
      label: Hypertrophic cardiomyopathy
  evidence:
  - reference: PMID:22286171
    reference_title: Molecular basis for clinical heterogeneity in inherited cardiomyopathies due to myopalladin mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Humans carrying the Y20C-MYPN variant developed HCM or DCM, whereas
      Q529X-MYPN was found in familial RCM.
    explanation: >-
      Human carriers of the Y20C allele developed hypertrophic cardiomyopathy,
      which is the claim this phenotype makes. The same sentence also records
      that Y20C carriers can instead develop the dilated pattern, which is why
      the allele-to-pattern mapping is curated as an open question in
      `mypn_allelic_branch_point_is_underdetermined` rather than as a rule.
  - reference: PMID:22286171
    reference_title: Molecular basis for clinical heterogeneity in inherited cardiomyopathies due to myopalladin mutations.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: >-
      Cardiac-restricted MYPN(Y20C) Tg mice developed HCM and disrupted
      intercalated discs
    explanation: >-
      Model-organism recapitulation of the hypertrophic pattern for the same
      allele. Marked INDIRECT because the human phenotype is asserted by the
      preceding item; this quote adds only the transgenic reproduction the
      description refers to.
- name: Restrictive cardiomyopathy
  category: Cardiovascular
  description: >-
    Restrictive filling with diastolic dysfunction and preserved systolic
    function, found with the Q529X allele in a familial pedigree and reproduced
    in heterozygous knock-in mice. Also curated as a MYPN gene arm in
    `Restrictive_Cardiomyopathy`.
  phenotype_term:
    preferred_term: Restrictive cardiomyopathy
    term:
      id: HP:0001723
      label: Restrictive cardiomyopathy
  evidence:
  - reference: PMID:25541130
    reference_title: "Disturbance in Z-disk mechanosensitive proteins induced by a persistent mutant myopalladin causes familial restrictive cardiomyopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Echocardiographic and CMR imaging signs of diastolic dysfunction with
      preserved systolic function were identified in 12-week-old Mypn(WT/Q526X)
      mice.
    explanation: >-
      Model-organism recapitulation of the restrictive physiology; the human
      pedigree evidence for this allele is carried on the CMR4 subtype and in
      `Restrictive_Cardiomyopathy`.
  - reference: PMID:22286171
    reference_title: Molecular basis for clinical heterogeneity in inherited cardiomyopathies due to myopalladin mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Humans carrying the Y20C-MYPN variant developed HCM or DCM, whereas
      Q529X-MYPN was found in familial RCM.
    explanation: >-
      Human evidence that the restrictive pattern occurs in a MYPN family, so
      this phenotype is not supported by the mouse alone.
- name: Congestive heart failure
  category: Cardiovascular
  description: >-
    Exertional dyspnoea, fatigue, exercise intolerance and congestion follow once
    remodelling outstrips compensation. No MYPN-specific frequency, severity
    distribution or hospitalisation rate has been reported; the symptom set is
    that of cardiomyopathic heart failure generally.
  phenotype_term:
    preferred_term: Congestive heart failure
    term:
      id: HP:0001635
      label: Congestive heart failure
  evidence:
  - reference: PMID:34558411
    reference_title: Myopalladin knockout mice develop cardiac dilation and show a maladaptive response to mechanical pressure overload.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: >-
      MKO mice exhibited a normal hypertrophic response to transaortic
      constriction (TAC), but rapidly developed severe cardiac dilation and
      systolic dysfunction, associated with fibrosis, increased fetal gene
      expression, higher intercalated disc fold amplitude, decreased
      calsequestrin-2 protein levels, and increased desmoplakin and SORBS2
      protein levels.
    explanation: >-
      Model-organism progression to decompensated dilation and fibrosis under
      load. Marked INDIRECT because the human heart-failure syndrome is inferred
      from the mouse phenotype rather than measured in MYPN carriers.
- name: Dyspnea
  category: Cardiovascular
  description: >-
    Breathlessness on exertion, the usual presenting symptom of the heart-failure
    phase. Not quantified in MYPN carriers specifically.
  phenotype_term:
    preferred_term: Dyspnea
    term:
      id: HP:0002094
      label: Dyspnea
    temporality: CHRONIC
- name: Arrhythmia
  category: Cardiovascular
  description: >-
    Atrial and ventricular arrhythmia and conduction disease occurred in a
    minority of the discovery cohort, but were not resolved by MYPN genotype, so
    there is no MYPN-specific arrhythmic risk estimate and no basis for a
    gene-specific device threshold.
  phenotype_term:
    preferred_term: Arrhythmia
    term:
      id: HP:0011675
      label: Arrhythmia
- name: Cardiac conduction abnormality
  category: Cardiovascular
  description: >-
    Conduction disease was reported alongside arrhythmia in a minority of the
    broader screened cardiomyopathy cohort. Like the arrhythmia finding it was
    not resolved by MYPN genotype, and the figure sits in the full text of the
    discovery paper rather than its abstract, so this phenotype is curated
    without an evidence item rather than with a snippet that cannot be verified
    against the cached record. It is modeled separately from `Arrhythmia`
    because conduction disease and tachyarrhythmia carry different management
    consequences, and because the electrocardiographic surveillance curated
    under `diagnosis:` is looking for both.
  phenotype_term:
    preferred_term: Cardiac conduction abnormality
    term:
      id: HP:0031546
      label: Cardiac conduction abnormality
diagnosis:
- name: Electrocardiography and Ambulatory Rhythm Monitoring
  description: >-
    The first-line electrical study, and the cheapest. A cardiomyopathy-oriented
    reading looks for conduction disease, low QRS voltage, QRS fragmentation and
    repolarization change, and ambulatory monitoring adds the atrial and
    ventricular ectopy burden that a resting tracing misses. Nothing here is
    MYPN-specific: the discovery cohorts reported arrhythmia and conduction
    disease in a minority of patients without resolving it by genotype, so there
    is no MYPN electrocardiographic signature to look for and no gene-specific
    monitoring interval to recommend.
  diagnosis_term:
    preferred_term: electrocardiography
    term:
      id: NCIT:C38053
      label: Electrocardiography
  evidence:
  - reference: PMID:37125300
    reference_title: "Pragmatic electrocardiogram tracings in non-ischaemic dilated cardiomyopathy: diagnostic and prognostic role."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      electrocardiogram (ECG) continues to represent a reliable diagnostic tool,
      for specific work up of every single patient
    explanation: >-
      Establishes the ECG as a standing part of the dilated-cardiomyopathy
      workup, which is the claim this diagnostic entry makes. Graded OTHER
      because the source is an expert review built around four illustrative
      tracings rather than a cohort study.
  - reference: PMID:37125300
    reference_title: "Pragmatic electrocardiogram tracings in non-ischaemic dilated cardiomyopathy: diagnostic and prognostic role."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      the strength of electrocardiography lies in the ability to diagnose and
      prognostically stratify DCMs in order to accurately address second and
      third diagnostic investigations
    explanation: >-
      States what the ECG contributes that the later imaging and genetic steps
      do not, which is why it is curated as its own diagnostic entry rather than
      folded into echocardiography.
- name: Echocardiography
  description: >-
    The test that establishes the morphological pattern, and therefore which of
    this entry's three subtypes a family is in: ventricular dimensions and
    ejection fraction for the dilated pattern, wall thickness for the
    hypertrophic pattern, and diastolic filling with preserved systolic function
    for the restrictive pattern. The diagnosis remains a clinical one that
    requires excluding loading conditions and coronary disease sufficient to
    explain the findings. Nothing about the imaging is MYPN-specific.
  diagnosis_term:
    preferred_term: transthoracic echocardiography
    term:
      id: NCIT:C16525
      label: Echocardiography Test
  evidence:
  - reference: PMID:31073128
    reference_title: Dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Echocardiography and other imaging techniques are required to assess
      ventricular dysfunction and adverse myocardial remodelling
    explanation: >-
      Establishes echocardiography as the required modality for assessing the
      ventricular dysfunction and remodelling that this entry's pathograph
      terminates in.
  - reference: PMID:31073128
    reference_title: Dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Dilated cardiomyopathy (DCM) is a clinical diagnosis characterized by left
      ventricular or biventricular dilation and impaired contraction that is not
      explained by abnormal loading conditions (for example, hypertension and
      valvular heart disease) or coronary artery disease.
    explanation: >-
      States the exclusion criteria that define the dilated diagnosis, which is
      what makes echocardiography necessary but not sufficient.
  - reference: PMID:27339497
    reference_title: The Diagnosis and Evaluation of Dilated Cardiomyopathy.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Measurement of LV size and ejection fraction remain central to diagnosis,
      risk stratification, and treatment
    explanation: >-
      Names the two echocardiographic measurements that carry the diagnosis, and
      places them ahead of the tissue characterisation that cardiac MRI adds.
- name: Cardiac Magnetic Resonance Imaging
  description: >-
    Adds what echocardiography cannot: tissue characterisation, and with it the
    risk stratification that drives management in nonischemic dilated
    cardiomyopathy. In a meta-analysis of 103 studies and 29,687 patients, late
    gadolinium enhancement — both its presence and its extent — was associated
    with higher all-cause and cardiovascular mortality, arrhythmic events and
    heart failure events, while ejection fraction was NOT associated with
    all-cause mortality or arrhythmic outcomes. That inversion matters here
    because the fibrosis this measures is the same remodelling endpoint the
    Mypn-null mouse develops under pressure overload. No MYPN carrier series
    with cardiac MRI has been published, so none of this is gene-specific.
  diagnosis_term:
    preferred_term: cardiac magnetic resonance imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:39298146
    reference_title: "Risk Stratification in Nonischemic Dilated Cardiomyopathy Using CMR Imaging: A Systematic Review and Meta-Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Late gadolinium enhancement (LGE) presence and extent (per 1%) were
      associated with higher all-cause mortality
    explanation: >-
      Establishes late gadolinium enhancement as a prognostic marker in
      nonischemic dilated cardiomyopathy, which is what cardiac MRI adds beyond
      echocardiography.
  - reference: PMID:39298146
    reference_title: "Risk Stratification in Nonischemic Dilated Cardiomyopathy Using CMR Imaging: A Systematic Review and Meta-Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Left ventricular ejection fraction (LVEF) (per 1%) was not associated with
      all-cause mortality
    explanation: >-
      The negative result that makes cardiac MRI worth curating separately from
      echocardiography: the echo-derived measure does not carry the mortality
      signal that late gadolinium enhancement does.
  - reference: PMID:27339497
    reference_title: The Diagnosis and Evaluation of Dilated Cardiomyopathy.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Assessment of myocardial fibrosis predicts both risk of sudden cardiac
      death and likelihood of LV functional recovery
    explanation: >-
      Connects the imaging measurement to the two decisions it informs, one of
      which is device therapy — the point at which this entry declines to make a
      MYPN-specific recommendation.
- name: Natriuretic Peptide and Troponin Testing
  description: >-
    BNP or NT-proBNP and high-sensitivity troponin are drawn as part of the
    heart-failure workup, alongside blood count, electrolytes, and renal, liver,
    thyroid and iron studies aimed at the alternative causes that have to be
    excluded. They quantify the heart-failure state rather than identify its
    cause, and no MYPN-specific biomarker, cut-off or reference interval has
    been reported — which is why this entry carries no `biochemical:` block.
  diagnosis_term:
    preferred_term: natriuretic peptide and troponin testing
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  evidence:
  - reference: PMID:31073128
    reference_title: Dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: OTHER
    directness: INDIRECT
    snippet: >-
      new diagnostic tools, such as serum biomarkers, that enable early
      diagnosis and treatment
    explanation: >-
      The cited review treats serum biomarkers as a developing rather than
      established diagnostic route in dilated cardiomyopathy. Marked INDIRECT
      because it supports biomarker testing as part of the workup without
      establishing a diagnostic threshold, and no such threshold exists for
      MYPN.
- name: Molecular Genetic Testing (Multigene Cardiomyopathy Panel)
  description: >-
    A curated multigene cardiomyopathy panel with sequence plus
    deletion/duplication analysis, rather than isolated MYPN sequencing; exome
    or genome sequencing after a negative panel. Every reported MYPN proband was
    ascertained this way — the founding series screened MYPN across 900
    hypertrophic, dilated and restrictive cardiomyopathy patients. THE RESULT
    MUST NOT BE OVER-READ. ClinGen classifies the MYPN-dilated cardiomyopathy
    relationship as Limited, so a MYPN variant should not on its own make or
    exclude a diagnosis, nor direct predictive testing of relatives, and a MYPN
    variant of uncertain significance carries no clinical action at all.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:22286171
    reference_title: Molecular basis for clinical heterogeneity in inherited cardiomyopathies due to myopalladin mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MYPN was genetically screened in 900 patients with HCM, DCM and RCM
    explanation: >-
      Documents the ascertainment route by which MYPN variants reach patients:
      broad genetic screening across all three cardiomyopathy patterns, not a
      MYPN-directed test.
  - reference: PMID:20301725
    reference_title: Nonsyndromic Hypertrophic Cardiomyopathy Overview.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Provide an evaluation strategy to identify (when possible) the genetic
      cause of nonsyndromic HCM in a proband
    explanation: >-
      The GeneReviews hypertrophic-cardiomyopathy overview supplies the proband
      evaluation strategy that a gene-level entry such as this one sits inside.
      Graded OTHER because GeneReviews is an expert-authored review resource;
      note that the cached PubMed record for this chapter contains only its
      stated purpose, so no clinical-characteristics text could be mined from it.
  - reference: DOI:10.3390/biomedicines12081643
    reference_title: "Risk Assessment and Personalized Treatment Options in Inherited Dilated Cardiomyopathies: A Narrative Review"
    supports: SUPPORT
    evidence_source: OTHER
    directness: INDIRECT
    snippet: >-
      It is crucial to select patients who are most probable to gain advantages
      from genetic testing.
    explanation: >-
      Supports testing being offered selectively rather than reflexively, which
      is the caution a Limited-evidence gene requires. Marked INDIRECT because
      the source addresses inherited dilated cardiomyopathy generally rather
      than MYPN.
- name: Cascade Testing and Cardiac Surveillance of At-Risk Relatives
  description: >-
    First-degree relatives of a carrier of a pathogenic or likely pathogenic
    MYPN variant are offered cascade testing, and genotype-positive relatives
    then enter longitudinal electrocardiographic and imaging surveillance even
    while asymptomatic. Where no credible familial variant is identified,
    relatives still need phenotype screening, because a negative panel does not
    exclude inherited disease. The MYPN-specific caveats bite here: the ClinGen
    Limited classification means a MYPN variant of uncertain significance is not
    an indication for predictive testing, and no MYPN-specific screening
    interval or lifetime penetrance figure exists to quote, so the interval is
    the one used for inherited cardiomyopathy generally.
  diagnosis_term:
    preferred_term: cascade screening of at-risk relatives
    term:
      id: NCIT:C15419
      label: Disease Screening
  evidence:
  - reference: PMID:20301486
    reference_title: Dilated Cardiomyopathy Overview.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Provide a basic view of genetic risk assessment of at-risk asymptomatic
      relatives of a proband with DCM to inform cardiac surveillance and allow
      early detection and treatment of DCM to improve long-term outcome
    explanation: >-
      The GeneReviews chapter's stated purpose for relatives of a proband:
      genetic risk assessment driving cardiac surveillance. This is the baseline
      practice this entry follows, with the caveat that a Limited-evidence gene
      cannot carry the risk assessment the recommendation depends on.
  - reference: PMID:20301725
    reference_title: Nonsyndromic Hypertrophic Cardiomyopathy Overview.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Inform genetic counseling of family members of an individual with
      nonsyndromic HCM
    explanation: >-
      The matching GeneReviews purpose on the hypertrophic side, cited because
      this entry spans both patterns and the family-screening obligation does
      not depend on which one a proband presented with.
  - reference: PMID:27339497
    reference_title: The Diagnosis and Evaluation of Dilated Cardiomyopathy.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Detection of pre-clinical DCM could substantially reduce morbidity and
      mortality by allowing early instigation of cardioprotective therapy.
    explanation: >-
      States the rationale for surveillance of asymptomatic relatives, which is
      why this is a diagnostic activity rather than a treatment.
  - reference: PMID:27339497
    reference_title: The Diagnosis and Evaluation of Dilated Cardiomyopathy.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      A rigorous work-up can exclude alternative causes of left ventricular (LV)
      dilation and dysfunction, identify etiologies that may respond to specific
      treatments, and guide family screening.
    explanation: >-
      Ties the proband workup curated in the preceding diagnostic entries to the
      family screening curated here.
genetic:
- name: MYPN
  gene_term:
    preferred_term: MYPN
    term:
      id: hgnc:23246
      label: MYPN
  relationship_type: CAUSATIVE
  frequency: >-
    The sole gene of this entity. MYPN encodes myopalladin, a striated-muscle
    Z-disc and I-band protein that also shuttles to the nucleus, so it acts as
    both a structural anchor and a mechanotransduction messenger. Yield in
    ascertained cardiomyopathy cohorts is 1.66% across HCM, DCM and RCM combined,
    and 3-4% in the original European dilated cardiomyopathy series.
  notes: >-
    Gene-disease validity is Limited, not Definitive. ClinGen's Dilated
    Cardiomyopathy Gene Curation Expert Panel classifies the MYPN-dilated
    cardiomyopathy relationship as Limited under an autosomal dominant model.
    That is a statement about the strength of the aggregate human genetic
    evidence, not a claim that the mechanism described in this entry is wrong —
    the cellular, myocardial and mouse work is substantial. In practice it means
    a MYPN variant of uncertain significance should not be used to make this
    diagnosis, to drive predictive cascade testing, or to justify irreversible
    management. The historical alleles below predate gnomAD and current ACMG/AMP
    criteria and need reclassification against contemporary population data
    before clinical use.
  evidence:
  - reference: CGGV:assertion_ffd924ad-55ce-4b05-8a91-584ef49b4e80-2025-03-05T050000.000Z
    reference_title: "MYPN / dilated cardiomyopathy (Limited)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "MYPN | HGNC:23246 | dilated cardiomyopathy | MONDO:0005021 | AD | Limited"
    explanation: >-
      ClinGen's current classification of this gene-disease relationship, which
      is why the entry states the diagnosis cannot rest on a variant alone.
  - reference: PMID:22286171
    reference_title: Molecular basis for clinical heterogeneity in inherited cardiomyopathies due to myopalladin mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Myopalladin (MYPN) is a Z-disc protein expressed in striated muscle and
      functions as a structural, signaling and gene expression regulating
      molecule in response to muscle stress.
    explanation: >-
      The dual structural and signalling role of the gene product, which is what
      makes a single gene reach three cardiomyopathy patterns.
animal_models:
- name: Myopalladin knockout mouse
  species: Mouse
  genotype: Mypn constitutive knockout (homozygous null)
  publication: PMID:34558411
  description: >-
    Constitutive whole-body Mypn-null mice. They develop mild spontaneous
    dilation and systolic dysfunction with reduced myofibrillar tension and
    delayed calcium handling, and decompensate severely under transaortic
    constriction.
  modeled_mechanisms:
  - target: Impaired Contractile and Passive Mechanics
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Directly measures the reduced active tension, raised passive tension and
      delayed calcium handling that this node asserts.
    limitations: >-
      A homozygous null models haploinsufficiency at best and does not model the
      dominant-negative or CARP-shuttling missense alleles at all; the mouse is
      also far milder at baseline than the human disease and only becomes severe
      when pressure-overloaded.
    readouts:
    - name: Myofibrillar isometric tension and resting tension
      target: Impaired Contractile and Passive Mechanics
      direction: DECREASED
      interpretation: >-
        Active tension falls while resting tension at long sarcomere lengths
        rises, the mechanical signature of this node.
      evidence:
      - reference: PMID:34558411
        reference_title: Myopalladin knockout mice develop cardiac dilation and show a maladaptive response to mechanical pressure overload.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Cardiac analyses of MYPN knockout (MKO) mice showed the development of
          mild cardiac dilation and systolic dysfunction, associated with
          decreased myofibrillar isometric tension generation and increased
          resting tension at longer sarcomere lengths.
        explanation: >-
          The measurement behind this readout.
    evidence:
    - reference: PMID:34558411
      reference_title: Myopalladin knockout mice develop cardiac dilation and show a maladaptive response to mechanical pressure overload.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Cardiomyocyte analyses showed delayed Ca2+ release and reuptake in
        unstressed MKO mice as well as reduced Ca2+ spark amplitude post-TAC,
        suggesting that altered Ca2+ handling may contribute to the development
        of DCM in MKO mice.
      explanation: >-
        Supports treating this model as informative for the contractile and
        calcium-handling node.
  - target: Ventricular Remodeling
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces the dilated, fibrotic branch of this node, but only after
      pressure overload; the hypertrophic and restrictive branches are not
      reached by a null allele.
    limitations: >-
      Baseline remodelling is mild and requires transaortic constriction to
      become severe, so the model conflates the genetic lesion with an imposed
      haemodynamic second hit that human carriers do not necessarily have.
    evidence:
    - reference: PMID:34558411
      reference_title: Myopalladin knockout mice develop cardiac dilation and show a maladaptive response to mechanical pressure overload.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        MKO mice exhibited a normal hypertrophic response to transaortic
        constriction (TAC), but rapidly developed severe cardiac dilation and
        systolic dysfunction, associated with fibrosis, increased fetal gene
        expression, higher intercalated disc fold amplitude, decreased
        calsequestrin-2 protein levels, and increased desmoplakin and SORBS2
        protein levels.
      explanation: >-
        Documents both what the model reproduces (dilation, fibrosis) and the
        load-dependence recorded in the limitation.
- name: MYPN Y20C cardiac-restricted transgenic mouse
  species: Mouse
  genotype: Cardiac-restricted transgenic expression of human MYPN Y20C
  publication: PMID:22286171
  description: >-
    Transgenic mice expressing the human N-terminal Y20C allele under a cardiac
    promoter, the model for the hypertrophic branch of this entity.
  modeled_mechanisms:
  - target: Ventricular Remodeling
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces the hypertrophic geometry and intercalated-disc disruption
      attributed to the CARP-shuttling allele.
    limitations: >-
      Human Y20C carriers develop hypertrophic or dilated disease, but the mouse
      is predominantly hypertrophic, so the model does not capture the allele's
      human variability. Transgenic overexpression may also exaggerate the
      dominant effect relative to a heterozygous endogenous allele.
    evidence:
    - reference: PMID:22286171
      reference_title: Molecular basis for clinical heterogeneity in inherited cardiomyopathies due to myopalladin mutations.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Cardiac-restricted MYPN(Y20C) Tg mice developed HCM and disrupted
        intercalated discs, with disturbed expression of desmin, desmoplakin,
        connexin43 and vinculin being evident.
      explanation: >-
        The remodelling phenotype and junctional disruption this link asserts.
- name: MYPN Q529X knock-in mouse
  species: Mouse
  genotype: Mypn Q526X knock-in, heterozygous (human MYPN Q529X equivalent)
  publication: PMID:25541130
  description: >-
    Heterozygous knock-in of the mouse equivalent of the human restrictive allele,
    the closest available model of the restrictive branch and the only one of the
    three at endogenous expression level in heterozygous state.
  modeled_mechanisms:
  - target: Ventricular Remodeling
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Reproduces restrictive physiology — diastolic dysfunction with preserved
      systolic function and interstitial fibrosis without hypertrophy — at
      endogenous expression level and in the correct heterozygous state.
    limitations: >-
      Models one allele of one branch; nothing about it speaks to the dilated or
      hypertrophic patterns, and the human pedigree behind Q529X is single.
    readouts:
    - name: Diastolic function with preserved ejection fraction
      target: Ventricular Remodeling
      direction: ALTERED
      interpretation: >-
        Restrictive filling with preserved systolic function is the geometric
        outcome this branch of the node predicts.
      evidence:
      - reference: PMID:25541130
        reference_title: "Disturbance in Z-disk mechanosensitive proteins induced by a persistent mutant myopalladin causes familial restrictive cardiomyopathy."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Echocardiographic and CMR imaging signs of diastolic dysfunction with
          preserved systolic function were identified in 12-week-old
          Mypn(WT/Q526X) mice.
        explanation: >-
          The imaging measurement behind this readout.
    evidence:
    - reference: PMID:25541130
      reference_title: "Disturbance in Z-disk mechanosensitive proteins induced by a persistent mutant myopalladin causes familial restrictive cardiomyopathy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Heterozygote Mypn(WT/Q526X) knock-in mice develop RCM due to persistence
        of mutant Mypn(Q526X) protein in the nucleus.
      explanation: >-
        Supports treating this model as informative for the restrictive branch of
        the remodelling node, and names the nuclear-persistence mechanism.
differential_diagnoses:
- name: Biallelic MYPN nemaline and cap myopathy
  description: >-
    The same gene, the opposite inheritance mode, and a different organ. Biallelic
    loss-of-function MYPN variants cause a childhood- to adult-onset, slowly
    progressive skeletal myopathy with nemaline rods or caps, in which cardiac
    involvement is the exception rather than the defining feature. It has its own
    MONDO class and is deliberately not curated as a subtype here: the dominant
    cardiac disease and the recessive skeletal disease are allelic disorders of
    one gene, not one disease with two presentations. Confusing them would let a
    homozygous truncating variant be read as evidence for dominant cardiomyopathy.
  distinguishing_features:
  - Biallelic (homozygous or compound heterozygous) truncating variants, not a single heterozygous allele.
  - Proximal skeletal muscle weakness and walking difficulty as the presenting problem, with cardiac involvement absent or secondary.
  - Nemaline rods, intranuclear rods, or caps on muscle biopsy, with myopalladin absent from the skeletal Z-line.
  evidence:
  - reference: PMID:28220527
    reference_title: Recessive MYPN mutations cause cap myopathy with occasional nemaline rods.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our data uncover that mutations in MYPN cause either a cardiac or a
      congenital skeletal muscle disorder through different modes of inheritance.
    explanation: >-
      States the inheritance-mode split that this differential turns on.
  - reference: PMID:28017374
    reference_title: "Biallelic Mutations in MYPN, Encoding Myopalladin, Are Associated with Childhood-Onset, Slowly Progressive Nemaline Myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Individuals with identified MYPN mutations in all four of these families
      have relatively mild, childhood- to adult-onset NM with slowly progressive
      muscle weakness.
    explanation: >-
      Characterises the recessive skeletal phenotype so it can be separated from
      the dominant cardiac one at the bedside.
- name: Dilated cardiomyopathy from a high-evidence gene
  description: >-
    TTN truncating variants, LMNA, and the desmosomal and FLNC arms account for a
    far larger share of genetic dilated cardiomyopathy than MYPN does and carry
    management consequences MYPN does not — LMNA and FLNC in particular drive
    arrhythmic risk stratification and device decisions. On a multigene panel a
    MYPN variant found alongside a variant in one of these genes is very unlikely
    to be the explanation. Curated as `Dilated_Cardiomyopathy`, where MYPN is
    listed as a gene arm with the same ClinGen Limited classification.
  distinguishing_features:
  - A pathogenic or likely pathogenic variant in a gene ClinGen rates Moderate, Strong, or Definitive for dilated cardiomyopathy.
  - Gene-specific features such as early conduction disease and arrhythmia out of proportion to systolic dysfunction (LMNA), or ring-like subepicardial late gadolinium enhancement (FLNC).
  - Established gene-specific device and surveillance recommendations, which MYPN does not have.
  disease_term:
    preferred_term: dilated cardiomyopathy
    term:
      id: MONDO:0005021
      label: dilated cardiomyopathy
- name: Hypertrophic cardiomyopathy from a sarcomere gene
  description: >-
    MYH7 and MYBPC3 account for the large majority of genotype-positive
    hypertrophic cardiomyopathy. A MYPN allele reaching the hypertrophic pattern
    is rare enough that a thick-walled ventricle should prompt a full sarcomere
    panel before MYPN is accepted as the cause.
  distinguishing_features:
  - Pathogenic variant in MYH7, MYBPC3, or another core sarcomere gene.
  - Asymmetric septal hypertrophy with left ventricular outflow tract obstruction, which has not been described as a MYPN-specific pattern.
  disease_term:
    preferred_term: hypertrophic cardiomyopathy
    term:
      id: MONDO:0005045
      label: hypertrophic cardiomyopathy
treatments:
- name: Guideline-Directed Medical Therapy for Heart Failure with Reduced Ejection Fraction
  description: >-
    Angiotensin receptor-neprilysin inhibition or ACE inhibition/ARB, an
    evidence-based beta blocker, a mineralocorticoid receptor antagonist, an
    SGLT2 inhibitor, and diuretics for congestion. There is no MYPN-specific
    trial and no MYPN pharmacogenomic rule; this is the general heart-failure
    evidence applied to a patient whose cardiomyopathy happens to be MYPN-related,
    and it targets the neurohormonal arm of the pathograph rather than the Z-disc
    lesion.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:

pathophysiology:
- name: MYPN Variant Altering Myopalladin
  biological_scale: MOLECULAR
  role: trigger
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Primary Cardiomyocyte Insult"
  description: >-
    The initiating lesion is a heterozygous MYPN variant that either reduces the
    amount of normal myopalladin or introduces a protein that misbehaves in the
    Z-disc. Three mechanistic classes are evidenced. A frameshift allele
    (I83fsX105) yields no detectable mutant transcript in patient mRNA, so the
    cell is left haploinsufficient. Missense alleles in the C-terminal half
    (R1088H, P1112L, V1195M) are incorporated but mislocalise and behave
    dominant-negatively. An N-terminal allele (Y20C) leaves Z-disc targeting
    largely intact but breaks the protein's second job, nuclear shuttling with
    CARP. Which class an allele belongs to is what predicts the cardiomyopathy
    pattern the family develops.
  genes:
  - preferred_term: MYPN
    term:
      id: hgnc:23246
      label: MYPN
  cell_types:
  - preferred_term: Cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  locations:
  - preferred_term: Myocardium
    term:
      id: UBERON:0002349
      label: myocardium
  genetic_context:
    allele_type: MIXED
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: UNKNOWN
    description: >-
      Germline heterozygous alleles spanning haploinsufficiency (I83fsX105),
      dominant-negative missense (P1112L, V1195M), and a signalling-selective
      N-terminal missense allele (Y20C). Biallelic loss of function produces a
      different disease and is not modelled here.
  evidence:
  - reference: PMID:18006477
    reference_title: Mutations in the Z-band protein myopalladin gene and idiopathic dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Allele-specific expression analysis of mRNA from a patient harbouring the
      I83fsX105 mutation indicated the absence of the mutated transcript,
      suggesting a haploinsufficiency mechanism.
    explanation: >-
      Direct patient-derived evidence for the haploinsufficiency class of allele
      named in this node.
  - reference: PMID:22286171
    reference_title: Molecular basis for clinical heterogeneity in inherited cardiomyopathies due to myopalladin mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MYPN mutations cause various forms of cardiomyopathy via different
      protein-protein interactions.
    explanation: >-
      States the allele-dependent-mechanism principle that makes this a single
      trigger node with divergent downstream branches.
  downstream:
  - target: Z-Disc and I-Band Scaffolding Failure
    causal_link_type: DIRECT
    description: >-
      Loss or malfunction of myopalladin removes a structural node of the Z-disc
      lattice.
- name: Z-Disc and I-Band Scaffolding Failure
  biological_scale: MOLECULAR
  description: >-
    Myopalladin cross-links the Z-disc: it binds the titin Ig domains Z4-Z5,
    alpha-actinin-2, nebulette, the PDZ-LIM proteins, and CARP at the titin N2A
    region. Losing it, or replacing it with a mislocalised mutant, degrades the
    lattice that transmits force between sarcomeres and laterally to the
    sarcolemma, and simultaneously degrades the mechanosensory apparatus that
    reports load. Explanted left ventricular myocardium from an R1088H carrier
    shows reduced myopalladin at alpha-actinin-positive Z-bands, so this node is
    observed in human tissue and not only inferred from models.
  cell_types:
  - preferred_term: Cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  cellular_components:
  - preferred_term: Z disc
    term:
      id: GO:0030018
      label: Z disc
    modifier: ABNORMAL
  evidence:
  - reference: PMID:18006477
    reference_title: Mutations in the Z-band protein myopalladin gene and idiopathic dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Specific immunolabelling of heart tissue from a proband carrying the R1088H
      mutation showed a decreased localization of myopalladin at the Z-band area
      of left ventricular cardiac myofibrils.
    explanation: >-
      Human myocardial evidence that a disease allele depletes myopalladin from
      the Z-band, which is the lesion this node names.
  - reference: PMID:34558411
    reference_title: Myopalladin knockout mice develop cardiac dilation and show a maladaptive response to mechanical pressure overload.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In a yeast two-hybrid screening, MYPN was found to bind to titin in the
      Z-line, which was confirmed by microscale thermophoresis.
    explanation: >-
      Identifies the titin interaction that makes myopalladin a load-bearing
      element of the Z-disc lattice rather than a passive passenger. Graded
      IN_VITRO because the measurement is a yeast two-hybrid and thermophoresis
      binding assay.
  downstream:
  - target: Disturbed Myofibrillogenesis and Sarcomere Disorganization
    causal_link_type: DIRECT
    description: >-
      A degraded Z-disc lattice cannot template orderly myofibril assembly.
  - target: Impaired CARP Nuclear Shuttling
    causal_link_type: DIRECT
    description: >-
      The same lesion removes the shuttle that carries CARP between the I-band
      and the nucleus; the Y20C allele isolates this branch.
- name: Disturbed Myofibrillogenesis and Sarcomere Disorganization
  biological_scale: CELLULAR
  description: >-
    Cardiomyocytes expressing mutant myopalladin build disorganised sarcomeres.
    Q529X strips alpha-actinin-2, desmin and CARP from assembling myofibrils;
    P1112L and V1195M produce frank sarcomeric disorganisation followed by
    premature cell death. The structural failure is the route to the restrictive
    pattern in particular, because a stiff, poorly assembled myofibril raises
    resting tension before it lowers developed tension.
  cell_types:
  - preferred_term: Cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: Myofibril Assembly
    term:
      id: GO:0030239
      label: myofibril assembly
    modifier: ABNORMAL
  - preferred_term: Sarcomere Organization
    term:
      id: GO:0045214
      label: sarcomere organization
    modifier: ABNORMAL
  evidence:
  - reference: PMID:22286171
    reference_title: Molecular basis for clinical heterogeneity in inherited cardiomyopathies due to myopalladin mutations.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Disturbed myofibrillogenesis with disruption of α-actinin2, desmin and cardiac ankyrin repeat protein (CARP) was evident in rat cardiomyocytes expressing MYPN(Q529X)
    explanation: >-
      The measured myofibrillogenesis defect this node names, in cardiomyocytes
      expressing the restrictive allele.
  - reference: PMID:18006477
    reference_title: Mutations in the Z-band protein myopalladin gene and idiopathic dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Analysis of the effects of the mutations after transfection in rat neonate
      cardiomyocytes indicated sarcomere disorganization and premature cell death
      associated with the V1195M and P1112L myopalladin expression.
    explanation: >-
      Extends the same cellular phenotype to the two sporadic dilated-cardiomyopathy
      missense alleles, and adds the cardiomyocyte death this node passes downstream.
  downstream:
  - target: Impaired Contractile and Passive Mechanics
    causal_link_type: DIRECT
    description: >-
      A disorganised myofibril generates less active tension and resists stretch
      more at long sarcomere lengths.
- name: Impaired CARP Nuclear Shuttling
  biological_scale: MOLECULAR
  description: >-
    Myopalladin binds CARP/ANKRD1, a transcriptional cofactor that moves between
    the titin N2A region and the nucleus and is strongly induced by mechanical
    stress. The Y20C allele binds CARP poorly and fails to translocate; the Q529X
    truncation does the opposite, persisting in the nucleus while total and
    nuclear CARP fall. Either way the load-reporting arm of the Z-disc is
    uncoupled from the transcriptional response to load, which is the branch that
    biases remodelling towards hypertrophy rather than dilation.
  cell_types:
  - preferred_term: Cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: Protein Import Into Nucleus
    term:
      id: GO:0006606
      label: protein import into nucleus
    modifier: DECREASED
  evidence:
  - reference: PMID:22286171
    reference_title: Molecular basis for clinical heterogeneity in inherited cardiomyopathies due to myopalladin mutations.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Failed nuclear translocation and reduced binding of Y20C-MYPN to CARP were
      demonstrated using in vitro and in vivo systems.
    explanation: >-
      Direct measurement of the shuttling and CARP-binding defect this node names.
  - reference: PMID:25541130
    reference_title: "Disturbance in Z-disk mechanosensitive proteins induced by a persistent mutant myopalladin causes familial restrictive cardiomyopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Truncated Mypn(Q526X) protein was found to translocate to the nucleus.
    explanation: >-
      The mirror-image nuclear handling of the restrictive allele in knock-in
      mice, which is why this node is described as uncoupling rather than simply
      abolishing the shuttle.
  downstream:
  - target: Ventricular Remodeling
    causal_link_type: DIRECT
    description: >-
      Loss of the CARP-dependent load-reporting arm biases the remodelling
      response, producing hypertrophic rather than dilated geometry for the Y20C
      allele.
- name: Impaired Contractile and Passive Mechanics
  biological_scale: CELLULAR
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Progressive Contractile Dysfunction"
  description: >-
    Myofibrils lacking myopalladin generate less isometric tension and develop
    more resting tension when stretched, and calcium release and reuptake are
    delayed. The combination is a myocyte that contracts weakly and relaxes
    poorly — the shared substrate from which the dilated and the restrictive
    presentations diverge. It is also load-sensitive: the deficit is mild at
    baseline and becomes severe under pressure overload.
  cell_types:
  - preferred_term: Cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: Cardiac Muscle Contraction
    term:
      id: GO:0060048
      label: cardiac muscle contraction
    modifier: DECREASED
  - preferred_term: Intracellular Calcium Ion Homeostasis
    term:
      id: GO:0006874
      label: intracellular calcium ion homeostasis
    modifier: ABNORMAL
  evidence:
  - reference: PMID:34558411
    reference_title: Myopalladin knockout mice develop cardiac dilation and show a maladaptive response to mechanical pressure overload.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Cardiac analyses of MYPN knockout (MKO) mice showed the development of mild
      cardiac dilation and systolic dysfunction, associated with decreased
      myofibrillar isometric tension generation and increased resting tension at
      longer sarcomere lengths.
    explanation: >-
      Measures both halves of this node — reduced active tension and raised
      passive tension — in myofibrils from myopalladin-null hearts.
  - reference: PMID:34558411
    reference_title: Myopalladin knockout mice develop cardiac dilation and show a maladaptive response to mechanical pressure overload.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Cardiomyocyte analyses showed delayed Ca2+ release and reuptake in
      unstressed MKO mice as well as reduced Ca2+ spark amplitude post-TAC,
      suggesting that altered Ca2+ handling may contribute to the development of
      DCM in MKO mice.
    explanation: >-
      The calcium-handling component of this node, and the authors' own hedge
      that it contributes to rather than explains the dilated phenotype.
  downstream:
  - target: Neurohormonal Activation
    causal_link_type: DIRECT
    description: >-
      Falling stroke volume recruits the compensatory neurohormonal axes.
  - target: Ventricular Remodeling
    causal_link_type: DIRECT
    description: >-
      Sustained mechanical underperformance drives chamber geometry change
      directly as well as through neurohormonal signalling.
- name: Neurohormonal Activation
  biological_scale: ORGANISM
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Neurohormonal Activation"
  description: >-
    The renin-angiotensin-aldosterone and sympathetic axes are recruited to
    defend cardiac output. Nothing in this arm is MYPN-specific; it is the shared
    cardiomyopathy response, and it is the arm that current drug therapy for this
    disease actually targets. Myopalladin-null hearts under pressure overload show
    the transcriptional signature of that activation, with induction of the fetal
    gene program including Nppa and Nppb.
  evidence:
  - reference: PMID:34558411
    reference_title: Myopalladin knockout mice develop cardiac dilation and show a maladaptive response to mechanical pressure overload.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      MKO mice exhibited a normal hypertrophic response to transaortic
      constriction (TAC), but rapidly developed severe cardiac dilation and
      systolic dysfunction, associated with fibrosis, increased fetal gene
      expression, higher intercalated disc fold amplitude, decreased
      calsequestrin-2 protein levels, and increased desmoplakin and SORBS2
      protein levels.
    explanation: >-
      Records the fetal gene program readout of stress activation in a
      myopalladin-null heart, and the load-dependence that makes this arm
      decisive rather than incidental.
  downstream:
  - target: Ventricular Remodeling
    causal_link_type: DIRECT
    description: >-
      Chronic neurohormonal drive converts a compensatory response into adverse
      remodelling.
- name: Ventricular Remodeling
  biological_scale: TISSUE
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Ventricular Remodeling"
  description: >-
    The point at which the three clinical patterns separate. Interstitial and
    perivascular fibroblast activation and matrix deposition are common to all
    three; the geometry differs. Haploinsufficiency and dominant-negative alleles
    give chamber dilation with wall thinning; the CARP-shuttling allele gives wall
    thickening; the restrictive allele gives fibrosis and a stiff, normally sized
    ventricle without overt hypertrophy. Because the divergence sits here rather
    than at the trigger, the three MONDO labels on this class are three outcomes
    of one chain.
  cell_types:
  - preferred_term: Cardiac fibroblast
    term:
      id: CL:0002548
      label: fibroblast of cardiac tissue
  - preferred_term: Cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  locations:
  - preferred_term: Myocardium
    term:
      id: UBERON:0002349
      label: myocardium
  evidence:
  - reference: PMID:25541130
    reference_title: "Disturbance in Z-disk mechanosensitive proteins induced by a persistent mutant myopalladin causes familial restrictive cardiomyopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Histology revealed interstitial and perivascular fibrosis without overt
      hypertrophic remodeling.
    explanation: >-
      The restrictive branch of this node: fibrosis without hypertrophy in
      knock-in mice carrying the restrictive human allele.
  - reference: PMID:22286171
    reference_title: Molecular basis for clinical heterogeneity in inherited cardiomyopathies due to myopalladin mutations.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Cardiac-restricted MYPN(Y20C) Tg mice developed HCM and disrupted
      intercalated discs, with disturbed expression of desmin, desmoplakin,
      connexin43 and vinculin being evident.
    explanation: >-
      The hypertrophic branch of the same node, in transgenic mice carrying the
      CARP-shuttling allele.
  downstream:
  - target: Structural Cardiac Impairment and Heart Failure
    causal_link_type: DIRECT
    description: >-
      Remodelled, fibrotic myocardium cannot sustain output or filling.
  - target: Dilated cardiomyopathy
    causal_link_type: DIRECT
    description: >-
      Chamber dilation with reduced systolic contraction is the dilated outcome
      of this node.
  - target: Hypertrophic cardiomyopathy
    causal_link_type: DIRECT
    description: >-
      Wall thickening is the outcome of the CARP-shuttling branch.
  - target: Restrictive cardiomyopathy
    causal_link_type: DIRECT
    description: >-
      Fibrosis with a stiff, non-dilated, non-hypertrophied ventricle is the
      restrictive outcome.
- name: Structural Cardiac Impairment and Heart Failure
  biological_scale: ORGANISM
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Structural Cardiac Impairment and Heart Failure"
  description: >-
    The convergent endpoint. Whichever geometry the family took, the remodelled
    ventricle ends in congestion, exercise limitation and the arrhythmic and
    thromboembolic risk of a structurally abnormal heart. No MYPN-specific event
    rate, transplantation rate or survival curve has been published, so the
    clinical course of this node is currently borrowed from cardiomyopathy in
    general.
  locations:
  - preferred_term: Heart
    term:
      id: UBERON:0000948
      label: heart
  evidence:
  - reference: PMID:34558411
    reference_title: Myopalladin knockout mice develop cardiac dilation and show a maladaptive response to mechanical pressure overload.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      MYPN gene mutations are causative for dilated (DCM), hypertrophic, and
      restrictive cardiomyopathy.
    explanation: >-
      States that all three patterns are MYPN outcomes, which is what makes this
      a single convergent endpoint node rather than three.
  downstream:
  - target: Congestive heart failure
    causal_link_type: DIRECT
    description: >-
      Congestion and low output are the clinical expression of this node.
  - target: Arrhythmia
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Structural and fibrotic remodelling creates the substrate for atrial and
      ventricular arrhythmia and for conduction disease.

        label: spironolactone
  target_mechanisms:
  - target: Neurohormonal Activation
    description: >-
      Neurohormonal blockade acts on this node; nothing in the regimen reaches
      the upstream Z-disc lesion.
  evidence:
  - reference: PMID:25176015
    reference_title: Angiotensin-neprilysin inhibition versus enalapril in heart failure.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      LCZ696 was superior to enalapril in reducing the risks of death and of
      hospitalization for heart failure.
    explanation: >-
      Trial evidence for the neurohormonal arm of this regimen. Marked INDIRECT
      because the trial enrolled heart failure with reduced ejection fraction
      generally, not MYPN carriers.
  - reference: PMID:31535829
    reference_title: Dapagliflozin in Patients with Heart Failure and Reduced Ejection Fraction.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      the risk of worsening heart failure or death from cardiovascular causes was
      lower among those who received dapagliflozin than among those who received
      placebo, regardless of the presence or absence of diabetes
    explanation: >-
      Trial evidence for the SGLT2-inhibitor component. Marked INDIRECT for the
      same reason: an unselected reduced-ejection-fraction population.
- name: Implantable Cardioverter-Defibrillator
  description: >-
    Considered on standard ejection-fraction, arrhythmic and syncope criteria.
    MYPN is not an established high-arrhythmic-risk genotype in the way LMNA and
    FLNC are, so it does not lower the threshold; a gene-specific device rule for
    MYPN would not be supported by anything published.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: implantable cardioverter-defibrillator placement
    term:
      id: NCIT:C80435
      label: Implantable Cardioverter-Defibrillator Placement
    qualifiers:
    - predicate:
        preferred_term: medical device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: implantable cardioverter-defibrillator
        term:
          id: NCIT:C93238
          label: Implantable Cardioverter-Defibrillator
  target_mechanisms:
  - target: Arrhythmia
    description: >-
      Terminates ventricular arrhythmia arising on the remodelled, fibrotic
      substrate; it does not modify the substrate.
- name: Heart Transplantation
  description: >-
    The endpoint therapy for advanced heart failure that no longer responds to
    medical management, with mechanical circulatory support as a bridge. No
    MYPN-specific transplantation rate or listing criterion exists.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: heart transplantation
    term:
      id: NCIT:C15289
      label: Organ Transplantation
  target_mechanisms:
  - target: Structural Cardiac Impairment and Heart Failure
    description: >-
      Replaces the failing organ; it is the only intervention here that removes
      the whole pathograph rather than modulating one node of it.
- name: Genetic Counseling
  description: >-
    Counselling of the proband and family about autosomal dominant transmission,
    variable expressivity across the dilated, hypertrophic and restrictive
    patterns, the recessive skeletal-myopathy phenotype that biallelic MYPN loss
    of function causes, and reproductive options. The counselling has to carry
    the ClinGen Limited classification honestly, which is what constrains what
    can be said about risk to relatives. The cascade testing and longitudinal
    surveillance that follow from it are curated under `diagnosis:` — screening
    an asymptomatic relative is a diagnostic activity, not a therapy.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: DOI:10.3390/biomedicines12081643
    reference_title: "Risk Assessment and Personalized Treatment Options in Inherited Dilated Cardiomyopathies: A Narrative Review"
    supports: SUPPORT
    evidence_source: OTHER
    directness: INDIRECT
    snippet: >-
      Genetic variants that can be transmitted from one generation to another
      can be a significant contributor to causing family or sporadic hereditary
      DCM.
    explanation: >-
      Supports the transmission risk that is the substance of the counselling
      session. Graded OTHER because the source is a narrative review rather than
      a primary study, and INDIRECT because it addresses inherited dilated
      cardiomyopathy generally rather than MYPN.
discussions:
- discussion_id: mypn_gene_disease_validity_is_limited
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does the aggregate human genetic evidence support MYPN as a monogenic cause
    of cardiomyopathy, or only as a modifier or bystander?
  rationale: >-
    ClinGen's Dilated Cardiomyopathy Gene Curation Expert Panel rates
    MYPN-dilated cardiomyopathy as Limited. The mechanistic case in this entry is
    strong — human myocardium, cardiomyocyte assays, three independent mouse
    models — but the human genetic case rests on small pedigrees, historical
    control panels of 400 to 1,020 individuals, and variants classified before
    gnomAD existed. That is exactly the configuration in which a plausible
    mechanism outlives a gene-disease association. Resolving it requires
    reclassification of the historical alleles against contemporary
    population-frequency and ACMG/AMP criteria, plus new segregation data; case
    ascertainment through cardiomyopathy panels alone will not do it, because a
    panel that includes MYPN will keep finding MYPN variants at population
    frequency.
  attaches_to:
  - genetic#MYPN
  - disease#MYPN-Related Cardiomyopathy
- discussion_id: mypn_allelic_branch_point_is_underdetermined
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is the mapping from MYPN allele class to cardiomyopathy pattern reliable
    enough to be predictive, or is it a post-hoc description of a handful of
    families?
  rationale: >-
    This entry is built on the claim that the pattern a family develops is
    determined at the allele level — haploinsufficiency to dilation, CARP-shuttling
    failure to hypertrophy, disturbed myofibrillogenesis to restriction. Each leg
    rests on one or two alleles, and Y20C itself breaks the rule by producing both
    hypertrophic and dilated disease in different human carriers. The branch point
    is therefore a mechanistic hypothesis with model support, not an established
    genotype-phenotype rule, and it should not be used to predict a phenotype from
    a novel allele. What would settle it is a MYPN variant registry with paired
    functional classification and imaging phenotype across many more families.
  attaches_to:
  - pathophysiology#Ventricular Remodeling
  - pathophysiology#Impaired CARP Nuclear Shuttling
  - has_subtypes#CMH22
- discussion_id: mypn_human_mechanism_evidence_is_model_weighted
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Do the mouse models of MYPN cardiomyopathy reproduce the human mechanism, or
    only a load-dependent caricature of it?
  rationale: >-
    All three mouse models diverge from human disease in a specific, stated way.
    The knockout is homozygous null, so it models haploinsufficiency at best and
    the dominant-negative alleles not at all; it is nearly normal at baseline and
    only becomes severe after transaortic constriction, an imposed second hit that
    human carriers do not necessarily have. The Y20C transgenic is
    overexpression-driven and is predominantly hypertrophic, whereas human Y20C
    carriers develop hypertrophic or dilated disease. Only the Q529X knock-in is
    heterozygous at endogenous expression, and it models one allele of one branch.
    The human side of the mechanism is thinner than it looks: two immunolabelling
    observations in explanted myocardium and a set of transfected neonatal rat
    cardiomyocyte assays. No patient-derived iPSC cardiomyocyte or engineered
    heart tissue model of a MYPN allele has been reported, which is the obvious
    missing rung between the rodent work and the human disease.
  attaches_to:
  - pathophysiology#Impaired Contractile and Passive Mechanics
  - pathophysiology#Disturbed Myofibrillogenesis and Sarcomere Disorganization
  - animal_models#Mouse
notes: >-
  Scope and the lump/split decision (issues #10635 and #9865). This entry is
  curated at the gene level, as MYPN-related cardiomyopathy, rather than as
  "dilated cardiomyopathy 1KK", because MONDO:0014100 is not in fact a dilated
  cardiomyopathy class. It has three asserted parents — familial restrictive
  cardiomyopathy (MONDO:0016340), familial hypertrophic cardiomyopathy
  (MONDO:0024573) and familial isolated dilated cardiomyopathy (MONDO:0700335) —
  and carries "cardiomyopathy, hypertrophic, 22" and "cardiomyopathy, familial
  restrictive, 4" as synonyms alongside "cardiomyopathy, dilated, 1KK". The
  MONDO label is one of the three names of the class, not a statement that the
  class is dilated. Curating it under the dilated name would have made the entry
  contradict two of its own three parents.

  Why not a subtype. The alternative shapes were a `has_subtypes` entry on
  `Dilated_Cardiomyopathy`, on `Hypertrophic_Cardiomyopathy`, or on
  `Restrictive_Cardiomyopathy`. Each would have had to pick one of the three
  patterns and drop the other two, which is the specific error
  `Restrictive_Cardiomyopathy` declined to make when it recorded MYPN as a
  `genetic:` gene arm rather than as its RCM4 subtype and left the decision open
  in a note. That note has been updated to point here. MYPN is retained as a gene
  arm in both `Restrictive_Cardiomyopathy` and `Dilated_Cardiomyopathy`, which is
  correct: those entries are curated by morphological pattern and MYPN genuinely
  reaches both, while this entry is curated by gene and holds the mechanism that
  connects them.

  Why not a grouping. A `Grouping` unites existing curated Disease entries.
  There are no separate CMD1KK, CMH22 and CMR4 entries to unite — they are one
  MONDO class with one OMIM anchor (OMIM:615248) — so a grouping would have had
  no members. The three patterns are carried as `has_subtypes` here instead,
  without `subtype_term` bindings, because MONDO has no distinct class for any of
  them.

  The pathograph is one chain with a branch. A MYPN lesion degrades the Z-disc
  and I-band scaffold; the scaffold failure then splits into a structural arm
  (disturbed myofibrillogenesis) and a signalling arm (failed CARP nuclear
  shuttling), and the two recombine at ventricular remodelling, where the
  dilated, hypertrophic and restrictive geometries separate. Splitting the entry
  by morphology would have cut that graph across its branch point and duplicated
  the shared upstream half three times. The entry conforms to
  `cardiomyopathy_maladaptive_remodeling` at four nodes.

  Evidence weighting, stated plainly. The human genetic layer is the weakest part
  of this entity and the entry says so in two places — the `genetic:` block and
  the `mypn_gene_disease_validity_is_limited` discussion. ClinGen rates
  MYPN-dilated cardiomyopathy Limited. The mechanism layer is much better
  supported but is weighted towards models: three mouse lines and a body of
  transfected neonatal rat cardiomyocyte work, against two immunolabelling
  observations in explanted human myocardium. The
  `mypn_human_mechanism_evidence_is_model_weighted` discussion records that
  imbalance and names the missing rung, a patient-derived iPSC cardiomyocyte or
  engineered heart tissue model, which has not been reported for any MYPN allele.

  Out of scope. Biallelic MYPN loss of function causes a recessive skeletal
  myopathy (nemaline myopathy 11 / cap myopathy) that is a distinct allelic
  disorder with its own MONDO class. It is recorded as a differential diagnosis
  so the inheritance-mode boundary is stated rather than assumed, and is not
  curated as a subtype here.

  GeneReviews baseline, and what could be mined from it. There is no
  gene-specific GeneReviews chapter for MYPN. A PubMed E-utilities search on
  2026-09-02 for `MYPN AND GeneReviews[book]` returns exactly one record, and
  the same search on `myopalladin` returns the same one: PMID:20301725, the
  Nonsyndromic Hypertrophic Cardiomyopathy Overview, which is a pattern-level
  chapter that mentions MYPN among the genes screened in HCM rather than a
  chapter about this entity. That chapter and its dilated counterpart are
  therefore both cited and tagged `GeneReviews` in `references:` —
  PMID:20301486 (Dilated Cardiomyopathy Overview) and PMID:20301725 — and both
  are mined in the `diagnosis:` block for the proband
  evaluation strategy and the at-risk-relative surveillance recommendation that
  this entry's diagnostic entries follow. The mining is deliberately thin: both
  cached PubMed records are abstract-only stubs whose entire content is the
  chapter's "the purpose of this overview is to" enumeration, so no clinical
  characteristics, penetrance figures or surveillance intervals could be taken
  from them, and each quoted purpose statement says so in its `explanation`.
  Both chapters are pattern-level rather than gene-level, so they establish the
  practice this entry sits inside; they assert nothing about MYPN.

  No `onset:` age figures. The deep-research artifact reports a mean age at
  diagnosis of 40.2 years with a standard deviation of 18.3 years, attributed to
  the full text of PMID:18006477. That paper's cached record is abstract-only
  and its abstract carries neither number, so the figure cannot be curated with
  a verified snippet and is not asserted here. The qualitative claim it rests on
  — adult onset with wide variability — is already carried by the subtype and
  progression prose. The same applies to the report's suggested binding for
  conduction disease: HP:0001678 is `Atrioventricular block`, not the
  `Abnormality of cardiac conduction` the report named it, so the conduction
  phenotype above is bound to HP:0031546 instead.

  Deliberately not curated. No `clinical_trials:` block: no trial of any
  intervention in a MYPN-selected population was found, and listing general
  heart-failure trials as this disease's trials would misrepresent them. No
  `datasets:` block: no MYPN-stratified transcriptomic, proteomic or single-cell
  dataset was identified, and a general dilated-cardiomyopathy dataset is not a
  dataset about this entity. No `progression:` block with numbers: no
  MYPN-specific survival, transplantation or event rate has been published, so
  the only honest statement is the absence recorded in the
  `Structural Cardiac Impairment and Heart Failure` node. No `environmental:`
  block: the pressure-overload sensitivity of Mypn-null mice is suggestive of a
  two-hit model, but no exposure has been shown to trigger or exacerbate disease
  in a human MYPN carrier, and an unevidenced exposure entry would be worse than
  none.

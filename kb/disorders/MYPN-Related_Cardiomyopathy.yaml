has_subtypes:
- name: CMD1KK
  display_name: Cardiomyopathy, dilated, 1KK
  description: >-
    The dilated pattern, and the label MONDO uses for the whole class. Reported
    alleles include a frameshift (I83fsX105) whose mutant transcript is absent
    from patient mRNA, indicating haploinsufficiency, a familial missense allele
    (R1088H) with reduced myopalladin at the Z-band of explanted left ventricular
    myofibrils, and two sporadic missense alleles (P1112L, V1195M) that
    disorganise the sarcomere and kill neonatal rat cardiomyocytes on expression.
    Onset is adult in the discovery cohort, with a mean age at diagnosis of
    40.2 years and a wide spread.
  genes:
  - preferred_term: MYPN
    term:
      id: hgnc:23246
      label: MYPN
  evidence:
  - reference: PMID:18006477
    reference_title: Mutations in the Z-band protein myopalladin gene and idiopathic dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified four independent heterozygous mutations in two families
      (R1088H and I83fsX105) and two sporadic cases (V1195M, P1112L).
    explanation: >-
      Names the four alleles this subtype is built on and establishes that they
      were found in dilated cardiomyopathy probands, familial and sporadic.
- name: CMH22
  display_name: Cardiomyopathy, hypertrophic, 22
  description: >-
    The hypertrophic pattern, carried by MONDO:0014100 as a synonym rather than
    as a separate class. Its worked allele is Y20C, an N-terminal missense variant
    found in patients with either hypertrophic or dilated disease, which binds
    CARP poorly and fails to translocate to the nucleus; cardiac-restricted
    transgenic mice carrying it develop hypertrophy with disrupted intercalated
    discs. The dual human phenotype of this one allele is the clearest reason the
    gene, not the morphology, is the right level for this entry.
  genes:
  - preferred_term: MYPN
    term:
      id: hgnc:23246
      label: MYPN
  evidence:
  - reference: PMID:22286171
    reference_title: Molecular basis for clinical heterogeneity in inherited cardiomyopathies due to myopalladin mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Humans carrying the Y20C-MYPN variant developed HCM or DCM, whereas
      Q529X-MYPN was found in familial RCM.
    explanation: >-
      Human genotype-phenotype evidence that one MYPN allele reaches both the
      hypertrophic and the dilated pattern, which is what this subtype records.
- name: CMR4
  display_name: Cardiomyopathy, familial restrictive, 4
  description: >-
    The restrictive pattern, carried as a further synonym of MONDO:0014100 and
    also recorded in `Restrictive_Cardiomyopathy` as a gene arm rather than a
    subtype there. Its worked allele is the nonsense variant Q529X, found in a
    familial restrictive pedigree; expression in cardiomyocytes disturbs
    myofibrillogenesis with loss of alpha-actinin-2, desmin and CARP from the
    myofibril, and heterozygous knock-in mice develop diastolic dysfunction with
    preserved systolic function and interstitial fibrosis.
  genes:
  - preferred_term: MYPN
    term:
      id: hgnc:23246
      label: MYPN
  evidence:
  - reference: PMID:22286171
    reference_title: Molecular basis for clinical heterogeneity in inherited cardiomyopathies due to myopalladin mutations.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Disturbed myofibrillogenesis with disruption of α-actinin2, desmin and cardiac ankyrin repeat protein (CARP) was evident in rat cardiomyocytes expressing MYPN(Q529X)
    explanation: >-
      The cellular mechanism attributed to the restrictive MYPN allele, measured
      in transfected neonatal rat cardiomyocytes, which is why this item is
      graded IN_VITRO.
inheritance:
- name: Autosomal dominant
  description: >-
    Cardiomyopathy-causing MYPN variants are heterozygous and cosegregate with
    disease in reported pedigrees. Penetrance is incomplete and age-dependent, and
    expressivity is variable both between families and within one allele — Y20C
    reaches hypertrophic disease in some carriers and dilated disease in others.
    Numerical penetrance has not been established. This dominant cardiac disease
    should not be conflated with the recessive, biallelic MYPN skeletal myopathy.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  evidence:
  - reference: PMID:22286171
    reference_title: Molecular basis for clinical heterogeneity in inherited cardiomyopathies due to myopalladin mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Humans carrying the Y20C-MYPN variant developed HCM or DCM, whereas
      Q529X-MYPN was found in familial RCM.
    explanation: >-
      Documents variable expressivity of a single heterozygous allele across two
      cardiomyopathy patterns, the observation this inheritance block describes.

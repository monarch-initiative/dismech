- name: Gating-Pore Blocking Toxin Hm-3 (Preclinical)
  description: >-
    Hm-3, a gating-modifier peptide toxin from the crab spider Heriaeus
    melloteei, binds the first voltage-sensing domain of NaV1.4 and inhibits
    the gating-pore current produced by variants at the second arginine of
    that domain's S4 helix. It is an experimental tool that shows the
    gating pore can be blocked directly, and applies only to those SCN4A
    variants. No gating-pore blocker has been tested in animals or patients.
  therapeutic_modality: PEPTIDE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Gating-Pore Leak Current
    treatment_effect: INHIBITS
    description: >-
      The toxin binds the voltage-sensing domain and inhibits the anomalous
      current through it.

    term:
      id: UBERON:0001134
      label: skeletal muscle tissue
  evidence:
  - reference: PMID:29125635
    reference_title: Review of the Diagnosis and Treatment of Periodic Paralysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      HypoPP is associated with mutations in calcium channel (CACNA1S; 60% of
      kindreds) and sodium channel (SCN4A; 20% of kindreds) genes.
    explanation: >-
      Establishes CACNA1S and SCN4A as the major channel genes underlying the
      disease.
  - reference: PMID:29125635
    reference_title: Review of the Diagnosis and Treatment of Periodic Paralysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      homologous gene defects of either channel cause an anomalous leakage current, which is active at the resting potential and produces susceptibility to paradoxical depolarization of the fiber and inexcitability in the setting of low extracellular K+ (2.5 to 3.5 Meq/L).
    explanation: >-
      Supports anomalous channel leakage current as the proximal molecular
      mechanism that makes fibers susceptible to low-potassium depolarization.
  downstream:
  - target: Sarcolemmal Depolarization and Sodium-Channel Inactivation
    description: The leak-current susceptibility enables paradoxical sustained depolarization in low extracellular potassium.
    causal_link_type: DIRECT
  - target: Progressive Hypokalemic Periodic Paralysis Myopathy
    description: >-
      Chronic ion-homeostasis disturbance from mutant channel leak currents
      contributes to fixed vacuolar and fatty myopathy that can develop even in
      carriers without clinical paralytic attacks.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:20301512
      reference_title: "Hypokalemic Periodic Paralysis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Individuals with known pathogenic variants in one of the genes
        associated with hypoPP who developed myopathy without having experienced
        episodes of weakness have been reported.
      explanation: >-
        Supports a causal path from the mutant channel genotype to progressive
        myopathy independent of recurrent ictal paralysis.
- name: Extracellular-to-Intracellular Potassium Shift
  biological_scale: CELLULAR
  description: >-
    Dietary carbohydrate loads, rest after strenuous exercise, adrenergic
    stress, or high sodium intake drive extracellular potassium from blood into
    the intracellular skeletal-muscle compartment without depleting total body
    potassium, lowering serum potassium and precipitating paradoxical
    depolarization in gating-pore-susceptible muscle fibers.
  cell_types:
  - preferred_term: skeletal muscle cell
    term:
      id: CL:0000188
      label: cell of skeletal muscle
  biological_processes:
  - preferred_term: potassium ion transmembrane transport
    term:
      id: GO:0071805
      label: potassium ion transmembrane transport
    modifier: ABNORMAL
  locations:
  - preferred_term: skeletal muscle tissue
    term:
      id: UBERON:0001134
      label: skeletal muscle tissue
  evidence:
  - reference: PMID:29125635
    reference_title: Review of the Diagnosis and Treatment of Periodic Paralysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Low serum potassium is not due to low total body potassium but rather
      shifts of potassium from the blood compartment into the intracellular
      muscle compartment.
    explanation: >-
      Establishes transcellular potassium redistribution into skeletal muscle as
      the cellular basis of ictal hypokalemia.
  downstream:
  - target: Hypokalemia During Attacks
    description: >-
      Shift of potassium from blood into skeletal muscle fibers acutely lowers
      extracellular serum potassium concentration during paralytic episodes.
    causal_link_type: DIRECT
  - target: Sarcolemmal Depolarization and Sodium-Channel Inactivation
    description: >-
      Reduced extracellular potassium lowers inward-rectifier outward potassium
      conductance so the anomalous gating-pore inward current depolarizes the
      sarcolemma.
    causal_link_type: DIRECT
- name: Sarcolemmal Depolarization and Sodium-Channel Inactivation
  biological_scale: CELLULAR
  description: >-
    During attacks, sarcolemmal depolarization inactivates sodium channels and
    reduces skeletal-muscle fiber excitability, causing acute paresis.
  cell_types:
  - preferred_term: skeletal muscle cell
    term:
      id: CL:0000188
      label: cell of skeletal muscle
  biological_processes:
  - preferred_term: regulation of membrane potential
    term:
      id: GO:0042391
      label: regulation of membrane potential
    modifier: DYSREGULATED
  - preferred_term: sodium ion transmembrane transport
    term:
      id: GO:0035725
      label: sodium ion transmembrane transport
    modifier: ABNORMAL
  - preferred_term: skeletal muscle contraction
    term:
      id: GO:0003009
      label: skeletal muscle contraction
    modifier: DECREASED
  locations:
  - preferred_term: skeletal muscle tissue
    term:
      id: UBERON:0001134
      label: skeletal muscle tissue
  evidence:
  - reference: PMID:29125635
    reference_title: Review of the Diagnosis and Treatment of Periodic Paralysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In all forms of PP, ictal paresis is caused by depolarization of the muscle sarcolemma, which in turn causes sodium channel inactivation and reduced fiber excitability.
    explanation: >-
      Supports the downstream attack mechanism from sarcolemmal depolarization to
      sodium-channel inactivation, reduced excitability, and paresis.
  downstream:
  - target: Episodic Flaccid Weakness
    description: >-
      Loss of skeletal-muscle excitability during attacks reduces force
      generation and produces focal or generalized flaccid weakness.
    causal_link_type: DIRECT
  - target: Respiratory Muscle Paralysis
    description: Severe generalized loss of skeletal-muscle excitability can include respiratory muscle paralysis.
    causal_link_type: DIRECT
- name: Progressive Hypokalemic Periodic Paralysis Myopathy
  biological_scale: TISSUE
  description: >-
    A subset of affected individuals develop fixed or progressive myopathy with
    permanent weakness and increasing fatty replacement of skeletal muscle, which
    can progress even in people without frequent paralytic attacks.
  cell_types:

- name: Acetazolamide Preventive Pharmacotherapy
  description: >-
    Acetazolamide is a carbonic anhydrase inhibitor used off-label for attack
    prevention for more than 40 years. About half of patients respond, the
    response depends on genotype, and some patients with SCN4A variants
    worsen. It has not been tested in a large randomized trial. How it works
    is not settled: the systemic acidosis it produces reduces potassium entry
    into muscle, it opens calcium-activated potassium channels in a rat model
    by a route that does not depend on carbonic anhydrase inhibition, and it
    lowers muscle sodium overload in patients with permanent weakness.
    Long-term use carries a risk of kidney stones, so blood counts,
    electrolytes and renal ultrasound are monitored.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:

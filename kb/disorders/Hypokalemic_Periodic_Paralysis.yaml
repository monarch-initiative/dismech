      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Fibers from the Ca(V)1.1 R528H mouse had a small anomalous inward
        current at the resting potential, similar to our observations in the
        Na(V)1.4 R669H HypoPP mouse model.
      explanation: >-
        Direct recording of the anomalous current in mutant fibers.
  - target: Paradoxical Sarcolemmal Depolarization
    relationship: RECAPITULATES

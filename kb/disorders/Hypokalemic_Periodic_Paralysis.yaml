- name: KCNA7-related hypokalemic periodic paralysis
  association: Candidate HypoPP gene (single multigenerational family, preprint; not yet a has_subtypes entry)
  variant_origin: GERMLINE
  features: >-
    A KCNA7 missense variant, c.834A>C (p.Arg278Ser), co-segregates with recurrent
    weakness and hypokalemia in one family and produces an anomalous inwardly
    rectifying gating-pore-type current in expression systems. The report is a
    non-peer-reviewed preprint and the family is a single kindred, so the gene
    is recorded as a candidate rather than as an established HypoPP gene.
  gene_term:

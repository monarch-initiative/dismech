  evidence:
  - reference: PMID:29125635
    reference_title: "Review of the Diagnosis and Treatment of Periodic Paralysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      HypoPP is associated with mutations in calcium channel (CACNA1S; 60% of
      kindreds) and sodium channel (SCN4A; 20% of kindreds) genes.
    explanation: >-
      Establishes CACNA1S and SCN4A as the major channel genes underlying the
      disease.
  - reference: PMID:29125635
    reference_title: "Review of the Diagnosis and Treatment of Periodic Paralysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      homologous gene defects of either channel cause an anomalous leakage current, which is active at the resting potential and produces susceptibility to paradoxical depolarization of the fiber and inexcitability in the setting of low extracellular K+ (2.5 to 3.5 Meq/L).
    explanation: >-
      Supports anomalous channel leakage current as the proximal molecular
      mechanism that makes fibers susceptible to low-potassium depolarization.
  - reference: PMID:17330043
    reference_title: "Gating pore current in an inherited ion channelopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      three mutations in gating-charge-carrying arginine residues in an S4
      segment that cause hypokalaemic periodic paralysis induce a
      hyperpolarization-activated cationic leak through the voltage sensor of
      the skeletal muscle Na(V)1.4 channel.
    explanation: >-
      Heterologous-expression electrophysiology that first measured the
      gating-pore current in NaV1.4 channels carrying HypoPP variants.
  - reference: PMID:23187123
    reference_title: "A calcium channel mutant mouse model of hypokalemic periodic paralysis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      Fibers from the Ca(V)1.1 R528H mouse had a small anomalous inward current
      at the resting potential, similar to our observations in the Na(V)1.4
      R669H HypoPP mouse model.
    explanation: >-
      Knock-in mouse fibers show the same anomalous inward current for the
      calcium-channel and sodium-channel forms of the disease.
  - reference: PMID:29769724
    reference_title: "Structural basis for gating pore current in periodic paralysis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: INDIRECT
    snippet: >-
      The R2G and R3G mutations have no effect on the backbone structures of
      the voltage sensor, but they create an aqueous cavity near the
      hydrophobic constriction site that controls gating charge movement
      through the voltage sensor.
    explanation: >-
      Crystal structures of the bacterial channel NavAb carrying the analogous
      gating-charge substitutions show the aqueous cavity that forms the
      gating pore; the inference to the human channels rests on functional
      similarity.
  - reference: PMID:17591984
    reference_title: "A Na+ channel mutation linked to hypokalemic periodic paralysis exposes a proton-selective gating pore."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      We found that the mutation R663H permits transmembrane permeation of
      protons, but not larger cations, similar to the conductance displayed by
      histidine substitution at Shaker K(+) channel S4 sites.
    explanation: >-
      The histidine substitution at the outer arginine of domain II (rat
      R663H, the ortholog of human R669H) produces a gating pore that conducts
      protons, so the permeant ion depends on the substituting residue. The
      authors judged this proton leak too small to account for the
      depolarization on its own.
  downstream:
  - target: Paradoxical Sarcolemmal Depolarization
    description: >-
      The inward gating-pore current adds a standing depolarizing current that
      tips the fiber into its depolarized state when potassium conductance
      falls.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:17330043
      reference_title: "Gating pore current in an inherited ion channelopathy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      directness: INDIRECT
      snippet: >-
        This gain-of-function gating pore current would contribute in an
        important way to the dominantly inherited membrane depolarization,
        action potential failure, flaccid paralysis and cytopathology that are
        characteristic of hypokalaemic periodic paralysis.
      explanation: >-
        The authors infer, from the current measured in expressed channels,
        that the gating-pore current drives membrane depolarization in muscle.
  - target: Myoplasmic Sodium Overload
    description: >-
      Sodium entering through the leak accumulates in the myoplasm.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:19225109
      reference_title: "K+-dependent paradoxical membrane depolarization and Na+ overload, major and reversible contributors to weakness by ion channel leaks."
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: >-
        HypoPP myofibers showed a nonselective cation leak of 12-19.5
        microS/cm(2), which may explain the Na(+) overload.
      explanation: >-
        Measurements on biopsied patient myofibers link the cation leak to
        intracellular sodium accumulation.
  - target: Progressive Hypokalemic Periodic Paralysis Myopathy
    description: >-
      Chronic ion-homeostasis disturbance from mutant channel leak currents
      contributes to fixed vacuolar and fatty myopathy that can develop even in
      carriers without clinical paralytic attacks.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:20301512
      reference_title: "Hypokalemic Periodic Paralysis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Individuals with known pathogenic variants in one of the genes
        associated with hypoPP who developed myopathy without having experienced
        episodes of weakness have been reported.
      explanation: >-
        Supports a causal path from the mutant channel genotype to progressive
        myopathy independent of recurrent ictal paralysis.
- name: Extracellular-to-Intracellular Potassium Shift
  biological_scale: ORGANISM
  description: >-
    Dietary carbohydrate loads, rest after strenuous exercise, adrenergic
    stress, or high sodium intake drive extracellular potassium from blood into
    the intracellular skeletal-muscle compartment without depleting total body
    potassium, lowering serum potassium. Insulin-stimulated uptake through the
    sodium-potassium pump is the best documented route.
  cell_types:

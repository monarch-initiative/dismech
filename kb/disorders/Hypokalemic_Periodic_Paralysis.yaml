biochemical:
- name: Serum Potassium
  presence: Decreased during attacks, normal between attacks
  context: >-
    The defining laboratory finding. A serum potassium below 3.5 mmol/L
    documented during an attack is part of the consensus diagnostic criteria.
    The value reflects redistribution into muscle, not total body depletion.
  biomarker_term:
    preferred_term: serum potassium measurement
    term:
      id: NCIT:C61030
      label: Serum Potassium Measurement
  loinc_term:
    id: LOINC:2823-3
    label: Potassium [Moles/volume] in Serum or Plasma
  readouts:
  - target: Extracellular-to-Intracellular Potassium Shift
    relationship: READOUT_OF
    direction: NEGATIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      A fall in serum potassium during an attack reads out the shift of
      potassium into muscle. It is also what is monitored during potassium
      replacement, because potassium can overshoot as the shift reverses.
  reference_ranges:
  - loinc_term:
      id: LOINC:2823-3
      label: Potassium [Moles/volume] in Serum or Plasma
    unit: mmol/L
    population: Individuals with suspected hypokalemic periodic paralysis, sampled during an attack of weakness
    interpretation_bands:
    - name: Ictal hypokalemia (diagnostic criterion)
      upper_bound: 3.5
      unit: mmol/L
      abnormal_flag: LOW
      phenotype_term:
        preferred_term: Episodic hypokalemia
        term:
          id: HP:0012726
          label: Episodic hypokalemia
      interpretation: >-
        Serum potassium below 3.5 mmol/L during an attack meets the
        biochemical part of the consensus diagnostic criteria.
    evidence:
    - reference: PMID:20301512
      reference_title: "Hypokalemic Periodic Paralysis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        a history of attacks of muscle weakness associated with documented
        serum potassium <3.5 mmol/L during attacks
      explanation: >-
        Source of the diagnostic cut-off. No population reference interval is
        recorded here; only the cut-off the disease owns.
  evidence:
  - reference: PMID:29125635
    reference_title: "Review of the Diagnosis and Treatment of Periodic Paralysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Low serum potassium is not due to low total body potassium but rather
      shifts of potassium from the blood compartment into the intracellular
      muscle compartment.
    explanation: >-
      Supports reading ictal serum potassium as a marker of redistribution.
- name: Muscle Tissue Sodium on Sodium-23 MRI
  presence: Increased
  context: >-
    Research imaging biomarker measured at 3 T or 7 T. Muscle sodium is higher
    in patients than in controls, is highest in the severe CaV1.1-R1239H
    genotype, and fell with acetazolamide in patients with permanent
    weakness. It is not a routine clinical test.
  readouts:
  - target: Myoplasmic Sodium Overload
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: MONITORING
    interpretation: >-
      Raised muscle sodium signal reads out intracellular sodium overload.
      The apparent tissue sodium concentration also includes extracellular
      sodium, so edema contributes to it.
    evidence:
    - reference: PMID:40262126
      reference_title: "Feasibility of 7 T 39 K/ 23 Na Magnetic Resonance Imaging for assessing muscular ion balance in hypokalemic periodic paralysis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        These findings could be helpful for a better pathophysiological
        understanding of HypoPP and may aid in future studies to assess
        disease extent or monitor treatment efficacy.
      explanation: >-
        The authors propose the measurement for monitoring; it is not yet
        validated for that use.
  - target: Myoplasmic Sodium Overload
    relationship: PHARMACODYNAMIC_MARKER_OF
    direction: POSITIVE
    endpoint_context: PHARMACODYNAMIC
    interpretation: >-
      Muscle sodium fell on acetazolamide, so it can serve as a
      pharmacodynamic marker of a drug's effect on the overload. No regulator
      has accepted it as an endpoint.
    evidence:
    - reference: PMID:29125635
      reference_title: "Review of the Diagnosis and Treatment of Periodic Paralysis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      directness: INDIRECT
      snippet: >-
        carbonic anhydrase inhibitors also may be effective for treating
        permanent weakness in HypoPP by reducing intracellular sodium
        accumulation.
      explanation: >-
        The consensus review's summary of a patient sodium-23 MRI study
        (PMID:19225109), in which muscle sodium fell and strength rose on
        acetazolamide without a control arm. The review hedges the effect as
        possible.
  evidence:
  - reference: PMID:27082780
    reference_title: "7-T (35)Cl and (23)Na MR Imaging for Detection of Mutation-dependent Alterations in Muscular Edema and Fat Fraction with Sodium and Chloride Concentrations in Muscular Periodic Paralyses."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      With 7-T MR imaging, changes of Na(+) and Cl(-) homeostasis can be
      visualized in periodic paralyses and are most pronounced in the severe
      phenotype Cav1.1-R1239H, with up to daily paralytic episodes.
    explanation: >-
      Sodium and chloride imaging in genetically confirmed patients, graded by
      genotype severity.
  - reference: PMID:40262126
    reference_title: "Feasibility of 7 T 39 K/ 23 Na Magnetic Resonance Imaging for assessing muscular ion balance in hypokalemic periodic paralysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Across all muscles, the mean aTSC was higher in the HypoPP group
      (median: 33.4 vs 22.5 mM
    explanation: >-
      Apparent tissue sodium concentration in 13 patients against 13
      controls.

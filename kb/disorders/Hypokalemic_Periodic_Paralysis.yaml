    causal_link_type: DIRECT
- name: Loss of Inward-Rectifier Potassium Conductance in Low Extracellular Potassium
  biological_scale: CELLULAR
  description: >-
    The resting potential of a muscle fiber is held by inward-rectifier
    potassium (Kir) channels, whose outward conductance falls as extracellular
    potassium falls. In a normal fiber this matters only at very low potassium.
    In a fiber carrying a gating-pore leak, the remaining potassium conductance
    can no longer balance the inward leak at potassium concentrations reached
    during an attack. Potassium salts restore this conductance, and
    potassium-channel openers (Kv7, KATP or BK) substitute for it. Kir2.1,
    encoded by KCNJ2, is an inward-rectifier channel of skeletal muscle; KCNJ2
    is the Andersen-Tawil syndrome gene and is not a cause of this disease, so
    it is named here in prose and not bound as one of the entry's genes.
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  molecular_functions:
  - preferred_term: inward rectifier potassium channel activity
    term:
      id: GO:0005242
      label: inward rectifier potassium channel activity
    modifier: DECREASED

- name: Perioperative Precautions
  description: >-
    Anesthesia and surgery can precipitate attacks. Precautions are strict
    control of serum potassium, avoidance of large glucose and salt loads,
    maintenance of body temperature and acid-base balance, and careful use of
    neuromuscular blocking agents with monitoring of neuromuscular function.
    A family with the CACNA1S R528H variant has been reported in which one
    member died of an anesthetic complication resembling malignant
    hyperthermia.
  therapeutic_modality: OTHER
  action_category: THERAPEUTIC
  treatment_term:

    explanation: >-
      Establishes transcellular potassium redistribution into skeletal muscle as
      the cellular basis of ictal hypokalemia.
  - reference: PMID:236741
    reference_title: "Acetazolamide treatment of hypokalemic periodic paralysis. Probable mechanism of action."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Following administration of glucose and insulin to three patients with

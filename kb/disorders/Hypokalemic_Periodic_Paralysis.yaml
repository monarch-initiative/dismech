  - reference: PMID:20301512
    reference_title: "Hypokalemic Periodic Paralysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the identification of a heterozygous pathogenic variant in CACNA1S or SCN4A"
    explanation: >-
      The GeneReviews chapter names this gene as one of the two whose heterozygous
      pathogenic variants establish the molecular diagnosis of hypoPP.
- name: KCNA7-related hypokalemic periodic paralysis
  association: Candidate HypoPP gene (single multigenerational family, preprint; not yet a has_subtypes entry)
  variant_origin: GERMLINE
  features: >-
    A KCNA7 missense variant, c.834A>C (p.Arg278Ser), co-segregates with recurrent
    weakness and hypokalemia in one family and produces an anomalous inwardly
    rectifying gating-pore-type current in expression systems. The report is a
    non-peer-reviewed preprint and the family is a single kindred, so the gene
    is recorded as a candidate rather than as an established HypoPP gene.
  gene_term:
    preferred_term: KCNA7
    term:
      id: hgnc:6226
      label: KCNA7
  evidence:
  - reference: DOI:10.64898/2026.09.09.750381
    reference_title: "A New Disease Gene for Hypokalemic Periodic Paralysis, <i>KCNA7</i>, Established in a Multigenerational Family"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "co-segregated with susceptibility to recurrent attacks of weakness in association with hypokalemia as low as 1.3 mEq/L"
    explanation: >-
      Reports co-segregation of the KCNA7 variant with HypoPP-type attacks in a
      multigenerational family, which is the human genetic basis for the
      candidate assignment.
  - reference: DOI:10.64898/2026.09.09.750381
    reference_title: "A New Disease Gene for Hypokalemic Periodic Paralysis, <i>KCNA7</i>, Established in a Multigenerational Family"
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "generated an anomalous inwardly rectifying current at hyperpolarized membrane potentials"
    explanation: >-
      Oocyte and HEK293 electrophysiology showing the mutant channel conducts the
      gating-pore current characteristic of HypoPP.
environmental:
- name: Potassium-shifting attack triggers
  description: >-
    High-carbohydrate meals, high salt intake, alcohol, stress, and rest after
    strenuous exercise can precipitate attacks in genetically susceptible
    skeletal muscle by promoting potassium shifts or sarcolemmal inexcitability.
  influences_mechanisms:
  - target: Extracellular-to-Intracellular Potassium Shift
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Insulin-stimulating carbohydrate loads, post-exercise adrenergic recovery,
      stress, and high salt intake promote potassium uptake into skeletal muscle
      and trigger paralytic episodes.
    evidence:
    - reference: PMID:29125635
      reference_title: Review of the Diagnosis and Treatment of Periodic Paralysis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Positive triggers (high carbohydrate rich meal, rest after exercise,
        stress)
      explanation: >-
        Identifies the classic dietary and physiologic triggers that precipitate
        ictal potassium shifts in HypoPP.
  - target: NKCC1-Dependent Chloride Loading
    environmental_effect: EXACERBATES
    causal_link_type: DIRECT
    description: >-
      High sodium intake, dehydration and hyperglycemia raise extracellular
      osmolality, which stimulates the sodium-potassium-chloride cotransporter
      and worsens low-potassium weakness in mouse muscle.
    evidence:
    - reference: PMID:23427324
      reference_title: "Bumetanide prevents transient decreases in muscle force in murine hypokalemic periodic paralysis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: >-
        Dehydration may aggravate HypoPP by stimulating the Na-K-2Cl
        transporter.
      explanation: >-
        The authors' conclusion from hyperosmolality experiments on mutant
        mouse muscle.
  evidence:
  - reference: PMID:29125635
    reference_title: Review of the Diagnosis and Treatment of Periodic Paralysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Positive triggers (high carbohydrate rich meal, rest after exercise,
      stress)
    explanation: >-
      The review identifies common behavioral and dietary precipitants for
      attacks.
  - reference: PMID:39333966
    reference_title: >-
      Familial hypokalemic periodic paralysis: a case induced by concurrent
      hyperthyroidism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A 40-year-old African American man presented with profound muscle weakness
      after consuming a high-salt meal.
    explanation: >-
      Recent case evidence illustrates a high-salt meal as an attack trigger.
- name: Rest after strenuous exercise
  description: >-
    Weakness that comes on during rest after vigorous exercise is the most
    common trigger. In mouse models, recovery from a period of acidosis, as
    after exercise, produces a loss of force that depends on chloride entry
    into the fiber.
  influences_mechanisms:
  - target: NKCC1-Dependent Chloride Loading
    environmental_effect: TRIGGERS
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      During sustained exercise, acidosis lowers chloride conductance and
      chloride accumulates in the fiber. When exercise stops and pH recovers,
      the raised chloride gradient favors the depolarized state.
    evidence:
    - reference: PMID:30733232
      reference_title: Recovery from acidosis is a robust trigger for loss of force in murine hypokalemic periodic paralysis.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: >-
        Prolonged exposure to low pH (tens of minutes) is required to cause
        susceptibility to post-acidosis loss of force, and the force decrement
        can be prevented by maneuvers that impede Cl- entry.
      explanation: >-
        Mouse muscle experiments; the authors propose this as the mechanism
        of post-exercise weakness and have not tested it in patients.
  evidence:
  - reference: PMID:20301512
    reference_title: "Hypokalemic Periodic Paralysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The major triggering factors are cessation of effort following strenuous
      exercise and carbohydrate-rich evening meals.
    explanation: >-
      GeneReviews names rest after strenuous exercise as a major trigger.
diagnosis:
- name: CACNA1S and SCN4A Molecular Genetic Testing
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    Targeted sequencing of CACNA1S and SCN4A is recommended as the first-line
    confirmatory diagnostic test when hypokalemic periodic paralysis is
    clinically suspected, identifying a heterozygous pathogenic variant in
    approximately 60% to 70% of patients meeting consensus clinical criteria.
  results: >-
    Heterozygous pathogenic variant in CACNA1S or SCN4A; approximately 30% of
    clinically diagnosed individuals lack an identifiable variant in either
    gene.
  evidence:
  - reference: PMID:29125635
    reference_title: Review of the Diagnosis and Treatment of Periodic Paralysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of PP can be confirmed by genetic testing, which we
      recommend as the first diagnostic step when there is an
      intermediate‐to‐high clinical suspicion.
    explanation: >-
      Recommends molecular genetic testing as the primary confirmatory
      diagnostic step.
  - reference: PMID:20301512
    reference_title: "Hypokalemic Periodic Paralysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of hypoPP is established in a proband who meets the
      consensus diagnostic criteria based on a history of attacks of muscle
      weakness associated with documented serum potassium <3.5 mmol/L during
      attacks and/or the identification of a heterozygous pathogenic variant in
      CACNA1S or SCN4A.
    explanation: >-
      GeneReviews diagnostic standard combining clinical/biochemical criteria
      and CACNA1S/SCN4A molecular testing.
- name: Ictal Serum Potassium Measurement
  diagnosis_term:
    preferred_term: serum potassium measurement
    term:
      id: NCIT:C61030
      label: Serum Potassium Measurement
  measurements:
  - preferred_term: serum potassium
    term:
      id: LOINC:2823-3
      label: Potassium [Moles/volume] in Serum or Plasma
  description: >-
    Measurement of serum potassium concentration during an acute attack of
    weakness documents concomitant hypokalemia and distinguishes hypokalemic
    periodic paralysis from hyperkalemic or normokalemic periodic paralysis,
    while thyroid, renal, and adrenal causes of secondary hypokalemia are
    excluded.
  results: >-
    Serum potassium <3.5 mmol/L (often <2.5 mEq/L in severe attacks) during
    episodes of flaccid muscle weakness, with normal interictal potassium.
  evidence:
  - reference: PMID:29125635
    reference_title: Review of the Diagnosis and Treatment of Periodic Paralysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two or more attacks of muscle weakness with documented serum K <3.5 mEq/L
    explanation: >-
      Consensus supportive diagnostic criterion requiring documented ictal
      hypokalemia.
- name: McManis Long-Exercise Electromyography Test
  diagnosis_term:
    preferred_term: long-exercise electromyography
    term:
      id: NCIT:C38056
      label: Electromyography
  description: >-
    Electrodiagnostic testing using the McManis 5-minute isometric exercise
    protocol on a distal hand muscle with serial post-exercise compound muscle
    action potential (CMAP) recordings, alongside needle EMG to exclude
    clinical or latent myotonia outside the eyelids.
  results: >-
    Post-exercise decrement in CMAP amplitude of 40% or greater from maximal
    amplitude (observed in more than 70% of patients) and absence of generalized
    myotonic discharges on needle EMG.
  evidence:
  - reference: PMID:29125635
    reference_title: Review of the Diagnosis and Treatment of Periodic Paralysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A reduction in CMAP amplitude of 40% or more from the maximal during
      exercise or post exercise is considered abnormal and is typically seen in
      >70% of patients.
    explanation: >-
      Defines the diagnostic threshold and sensitivity of the McManis long
      exercise electrodiagnostic test in periodic paralysis.
  - reference: PMID:34817893
    reference_title: The long exercise test as a functional marker of periodic paralysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      A negative test in the context of frequent attacks makes a diagnosis of
      PP unlikely but it does not rule out the condition in less severely
      affected patients.
    explanation: >-
      A cohort of 45 genetically confirmed patients with periodic paralysis of
      all types, in which sensitivity rose with attack frequency.
- name: Electrocardiography
  diagnosis_term:
    preferred_term: electrocardiography
    term:
      id: NCIT:C38053
      label: Electrocardiography
  description: >-
    Resting and ictal 12-lead electrocardiography guides safe potassium
    repletion during severe hypokalemic attacks and evaluates for resting long
    QTc or long QU intervals in the absence of hypokalemia that distinguish
    Andersen-Tawil syndrome.
  results: >-
    Continuous ECG monitoring guides acute potassium repletion during severe
    attacks; absence of resting long QTc or long QU interval in the absence of
    hypokalemia helps exclude Andersen-Tawil syndrome.
  evidence:
  - reference: PMID:20301512
    reference_title: "Hypokalemic Periodic Paralysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Severe attacks typically require more intensive medical management with
      intravenous potassium infusion, serial measurement of serum potassium
      concentration, clinical evaluation of possible respiratory involvement,
      and continuous electrocardiogram monitoring.
    explanation: >-
      Supports ECG monitoring in the evaluation and acute management of severe
      hypokalemic attacks.
  - reference: PMID:29125635
    reference_title: Review of the Diagnosis and Treatment of Periodic Paralysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Typical resting ECG abnormalities include a long QTc or long QU interval
      in the absence of hypokalemia.
    explanation: >-
      Identifies the resting long QTc/QU interval in the absence of hypokalemia
      used to distinguish Andersen-Tawil syndrome from isolated HypoPP on ECG.
- name: Skeletal Muscle Magnetic Resonance Imaging
  diagnosis_term:
    preferred_term: skeletal muscle magnetic resonance imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  description: >-
    Muscle MRI (including 1H-MRI) and muscle ultrasound evaluate fixed
    interictal muscle weakness by distinguishing acute muscle edema from chronic
    fatty degeneration and atrophy.
  results: >-
    Muscle edema early in disease course and progressive fatty replacement and
    atrophy in chronic hypokalemic periodic paralysis myopathy.
  evidence:
  - reference: PMID:20301512
    reference_title: "Hypokalemic Periodic Paralysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Muscle ultrasound and muscle 1H-MRI are reliable image techniques with
      high accuracy for the disease. The weakness can be caused by edemas, fatty
      muscle degeneration, and muscle atrophy or a combination of these
      pathologies.
    explanation: >-
      GeneReviews support for muscle MRI in evaluating interictal myopathic
      weakness in HypoPP.
differential_diagnoses:
- name: Thyrotoxic periodic paralysis
  disease_term:
    preferred_term: thyrotoxic periodic paralysis
    term:
      id: MONDO:0019201
      label: thyrotoxic periodic paralysis
  description: >-
    Acquired hypokalemic periodic paralysis precipitated by hyperthyroidism
    (sometimes associated with KCNJ18 susceptibility variants) that closely
    mimics acute attacks of familial HypoPP.
  distinguishing_features:
  - Suppressed serum TSH and biochemical hyperthyroidism
  - Typically adult onset without autosomal dominant family history of childhood periodic paralysis
  - Resolution of paralytic attacks upon restoration of euthyroidism
  evidence:
  - reference: PMID:32644604
    reference_title: "Hypokalemic Periodic Paralysis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Acquired cases of HypoPP are associated with hyperthyroidism.
    explanation: >-
      Identifies hyperthyroidism as the cause of acquired thyrotoxic periodic
      paralysis in the differential diagnosis of HypoPP.
  - reference: PMID:29125635
    reference_title: Review of the Diagnosis and Treatment of Periodic Paralysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Exclusion of other causes of hypokalemia (renal, adrenal, thyroid
      dysfunction; renal tubular acidosis; diuretic and laxative abuse)
    explanation: >-
      Consensus diagnostic criteria require excluding thyroid dysfunction and
      other secondary causes of hypokalemia before diagnosing primary HypoPP.
- name: Hyperkalemic periodic paralysis
  disease_term:
    preferred_term: hyperkalemic periodic paralysis
    term:
      id: MONDO:0008224
      label: hyperkalemic periodic paralysis
  description: >-
    Autosomal dominant SCN4A gain-of-function skeletal muscle channelopathy
    causing shorter, more frequent episodes of flaccid weakness.
  distinguishing_features:
  - Elevated or normal serum potassium during attacks rather than hypokalemia
  - More frequent and shorter attacks than in HypoPP, with muscle stiffness from myotonia or paramyotonia between attacks in approximately half of patients
  evidence:
  - reference: PMID:29125635
    reference_title: Review of the Diagnosis and Treatment of Periodic Paralysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Characteristic features of HyperPP are attacks of limb weakness and an
      increase of serum potassium during an attack, but some patients have
      normal serum potassium levels during attacks.
    explanation: >-
      Distinguishes HyperPP from HypoPP by ictal serum potassium elevation.
  - reference: PMID:29125635
    reference_title: Review of the Diagnosis and Treatment of Periodic Paralysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Attacks in HyperPP tend to be more frequent and shorter in duration than
      attacks in HypoPP.
    explanation: >-
      Distinguishes HyperPP from HypoPP by higher attack frequency and shorter
      attack duration.
  - reference: PMID:29125635
    reference_title: Review of the Diagnosis and Treatment of Periodic Paralysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Between attacks, approximately half of patients with HyperPP experience
      muscle stiffness arising from myotonia or paramyotonia that does not
      impede voluntary movements.
    explanation: >-
      Distinguishes HyperPP from HypoPP by interictal myotonia or paramyotonia
      in approximately half of patients.
- name: Andersen-Tawil syndrome
  disease_term:
    preferred_term: Andersen-Tawil syndrome
    term:
      id: MONDO:0008222
      label: Andersen-Tawil syndrome
  description: >-
    Autosomal dominant multisystem potassium channelopathy (most often caused by
    KCNJ2 pathogenic variants) that can present with hypokalemic episodes of
    flaccid paralysis resembling HypoPP.
  distinguishing_features:
  - Ventricular arrhythmias and resting ECG long QTc/QU interval or prominent U waves in the absence of hypokalemia
  - Characteristic craniofacial and skeletal anomalies (low-set ears, hypertelorism, micrognathia, fifth-digit clinodactyly, syndactyly)
  - Pathogenic KCNJ2 variant rather than CACNA1S or SCN4A
  evidence:
  - reference: PMID:29125635
    reference_title: Review of the Diagnosis and Treatment of Periodic Paralysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Andersen‐Tawil syndrome is characterized by a triad of episodic flaccid
      muscle weakness (periodic paralysis), cardiac abnormalities (ventricular
      arrhythmias, prolonged QT interval, and prominent U waves), and
      distinctive skeletal features (low‐set ears, ocular hypertelorism, small
      mandible, fifth‐digit clinodactyly, syndactyly, short stature, scoliosis,
      and a broad forehead).
    explanation: >-
      Distinguishes Andersen-Tawil syndrome from isolated skeletal-muscle HypoPP
      by its cardiac and dysmorphic skeletal triad.
treatments:
- name: Oral Potassium Chloride for Acute Attacks
  description: >-
    Oral potassium chloride is the first-line treatment of an acute attack and
    can be self-administered at home for moderate attacks. Immediate-release
    preparations are used; slow-release formulations are usually avoided for
    acute management. Serum potassium and ECG are monitored where possible,
    because total body potassium is not depleted and potassium can overshoot as
    the attack resolves.
  therapeutic_modality: SMALL_MOLECULE
  dosing_interval: every 30 minutes during an attack
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: potassium chloride
      term:
        id: CHEBI:32588
        label: potassium chloride
  target_mechanisms:
  - target: Loss of Inward-Rectifier Potassium Conductance in Low Extracellular Potassium
    treatment_effect: RESTORES
    description: >-
      Raising extracellular potassium restores the potassium conductance that
      holds the resting potential, so depolarized fibers repolarize and their
      sodium channels recover from inactivation.
    evidence:
    - reference: PMID:19225109
      reference_title: "K+-dependent paradoxical membrane depolarization and Na+ overload, major and reversible contributors to weakness by ion channel leaks."
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      directness: INDIRECT
      snippet: >-
        The leak sensitizes myofibers to reduced serum K(+), and the resulting
        membrane depolarization causes the weakness.
      explanation: >-
        Shows that the depolarization depends on reduced extracellular
        potassium; that restoring potassium reverses it is the inference.
  target_phenotypes:
  - preferred_term: Episodic hypokalemia
    term:
      id: HP:0012726
      label: Episodic hypokalemia
  - preferred_term: Episodic flaccid weakness
    term:
      id: HP:0003752
      label: Episodic flaccid weakness
  evidence:
  - reference: PMID:20301512
    reference_title: "Hypokalemic Periodic Paralysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Moderate attacks may be self-treated in a non-medical setting by
      ingestion of oral potassium salts.
    explanation: >-
      GeneReviews supports oral potassium salts for moderate acute attacks.
  - reference: PMID:29125635
    reference_title: "Review of the Diagnosis and Treatment of Periodic Paralysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The dose of oral potassium is 0.2–0.4 mEq/kg every 30 min not to exceed
      200–250 mEq/day.
    explanation: >-
      Source of the dose and dosing interval for oral potassium in an attack.
  - reference: PMID:29125635
    reference_title: "Review of the Diagnosis and Treatment of Periodic Paralysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Oral potassium is recommended for outpatient treatment. Slow‐release
      formulations usually should be avoided for acute management.
    explanation: >-
      Supports the oral route and the avoidance of slow-release formulations
      for acute attacks.
  notes: >-
    PMID:18426576 is not used as the dose source: its PubMed record carries a
    "Dosage error in article text" erratum that does not say which figure was
    corrected. The dose is taken from the 2018 consensus review
    (PMID:29125635).
- name: Intravenous Potassium Chloride for Severe Attacks
  description: >-
    Intravenous potassium is reserved for severe attacks or for patients who
    cannot take potassium by mouth, and is given in hospital with serial serum
    potassium measurement and continuous ECG monitoring. Potassium is infused
    in mannitol; glucose- and saline-containing solutions are avoided because
    they can worsen the weakness.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: intravenous potassium replacement
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: potassium chloride
      term:
        id: CHEBI:32588
        label: potassium chloride
  target_mechanisms:
  - target: Loss of Inward-Rectifier Potassium Conductance in Low Extracellular Potassium
    treatment_effect: RESTORES
    description: >-
      Same mechanism as oral potassium: restoring extracellular potassium
      restores the repolarizing potassium conductance.
  target_phenotypes:
  - preferred_term: Episodic hypokalemia
    term:
      id: HP:0012726
      label: Episodic hypokalemia
  - preferred_term: Episodic flaccid weakness
    term:
      id: HP:0003752
      label: Episodic flaccid weakness
  - preferred_term: Respiratory muscle paralysis
    term:
      id: HP:0002747
      label: Respiratory insufficiency due to muscle weakness
  evidence:
  - reference: PMID:20301512
    reference_title: "Hypokalemic Periodic Paralysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Severe attacks typically require more intensive medical management with
      intravenous potassium infusion, serial measurement of serum potassium
      concentration, clinical evaluation of possible respiratory involvement,
      and continuous electrocardiogram monitoring.
    explanation: >-
      GeneReviews supports intravenous potassium with monitoring for severe
      attacks.
  - reference: PMID:29125635
    reference_title: "Review of the Diagnosis and Treatment of Periodic Paralysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The dose of IV potassium is 40 mEq/L in 5% mannitol solution infused at a
      maximum of 20 mEq/h, not to exceed 200 mEq/day.
    explanation: >-
      Source of the intravenous regimen and the mannitol vehicle.
  - reference: PMID:29125635
    reference_title: "Review of the Diagnosis and Treatment of Periodic Paralysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Use of glucose‐ and saline‐containing IV solutions for administering
      potassium should be avoided, as this may worsen muscle weakness.
    explanation: >-
      Supports avoiding glucose and saline vehicles, which add the
      carbohydrate and sodium loads that trigger attacks.
- name: Slow-Release Potassium Prophylaxis
  description: >-
    A daily slow-release potassium salt is used as chronic preventive therapy,
    alongside trigger avoidance and before a carbonic anhydrase inhibitor is
    added. There are no randomized trials to guide the dose.
  therapeutic_modality: SMALL_MOLECULE
  dosing_interval: daily
  dosing_interval_days: 1
  treatment_term:
    preferred_term: oral potassium supplementation
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: potassium salt
      term:
        id: CHEBI:29103
        label: potassium(1+)
  target_mechanisms:
  - target: Loss of Inward-Rectifier Potassium Conductance in Low Extracellular Potassium
    treatment_effect: RESTORES
    description: >-
      Keeping extracellular potassium higher at baseline leaves more
      repolarizing potassium conductance when a trigger lowers serum
      potassium.
  target_phenotypes:
  - preferred_term: Episodic flaccid weakness
    term:
      id: HP:0003752
      label: Episodic flaccid weakness
  evidence:
  - reference: PMID:29125635
    reference_title: "Review of the Diagnosis and Treatment of Periodic Paralysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Although no randomized controlled studies are available to inform
      dosing, a daily slow‐release potassium salt formulation may be
      considered the standard of care for chronic therapy.
    explanation: >-
      Expert consensus for daily slow-release potassium, with the authors'
      own caveat that no randomized trial informs dosing.
  - reference: PMID:20301512
    reference_title: "Hypokalemic Periodic Paralysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      This may be achieved by avoidance of triggering factors, adherence to a
      diet low in sodium and carbohydrate and rich in potassium, and with the
      use of oral potassium supplementation.
    explanation: >-
      GeneReviews lists oral potassium supplementation among the preventive
      measures.
- name: Trigger Avoidance and Nutrition Counseling
  description: >-
    Dietary and behavioral counseling targets common triggers such as
    high-carbohydrate meals, high salt intake, alcohol, stress, and rest after
    strenuous exercise. Patients with CACNA1S-related disease report that
    regular meals with controlled portions of complex carbohydrate, regular
    mild to moderate exercise with warm-up and cool-down, and avoiding
    inactivity make them less vulnerable, and that triggers add up.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: dietary intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  target_mechanisms:
  - target: Extracellular-to-Intracellular Potassium Shift
    treatment_effect: INHIBITS
    description: >-
      Limiting high-carbohydrate and high-sodium loads and avoiding abrupt rest
      after strenuous exercise prevents transcellular potassium shifts into
      skeletal muscle.
    evidence:
    - reference: PMID:20301512
      reference_title: "Hypokalemic Periodic Paralysis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        This may be achieved by avoidance of triggering factors, adherence to a
        diet low in sodium and carbohydrate and rich in potassium, and with the
        use of oral potassium supplementation.
      explanation: >-
        GeneReviews supports trigger avoidance and a low-sodium,
        low-carbohydrate, potassium-rich diet to prevent ictal potassium shifts.
  - target: NKCC1-Dependent Chloride Loading
    treatment_effect: INHIBITS
    description: >-
      Avoiding high sodium intake, dehydration and hyperglycemia avoids the
      hyperosmolar stimulus to the sodium-potassium-chloride cotransporter.
    evidence:
    - reference: PMID:29125635
      reference_title: "Review of the Diagnosis and Treatment of Periodic Paralysis."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      directness: INDIRECT
      snippet: >-
        The NKCC co‐transporter is activated by hyperosmolarity (hence the
        importance of avoiding high sodium diet, dehydration or hyperglycemia)
        and is inhibited by loop diuretics such as bumetanide.
      explanation: >-
        The review links avoidance of sodium load, dehydration and
        hyperglycemia to the cotransporter; the underlying data are from mouse
        models.
  target_phenotypes:

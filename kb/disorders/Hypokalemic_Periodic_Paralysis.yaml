    snippet: >-
      genetic testing indicated a missense variant, NM_000334.4
      (SCN4A):c.3404G>A (p.R1135H).
    explanation: >-
      Case evidence links a missense SCN4A variant to hypokalemic periodic
      paralysis.
  - reference: PMID:20301512
    reference_title: "Hypokalemic Periodic Paralysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the identification of a heterozygous pathogenic variant in CACNA1S or SCN4A"
    explanation: >-
      The GeneReviews chapter names this gene as one of the two whose heterozygous

discussions:
- discussion_id: gap_hypopp_carbonic_anhydrase_inhibitor_mechanism
  prompt: >-
    By what mechanism do carbonic anhydrase inhibitors prevent attacks in
    hypokalemic periodic paralysis, and why do some patients with SCN4A
    variants worsen on acetazolamide?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - treatments#Acetazolamide Preventive Pharmacotherapy
  - treatments#Dichlorphenamide Preventive Pharmacotherapy
  rationale: >-
    Three mechanisms have evidence and none is established: systemic acidosis
    reducing potassium entry into muscle (a three-patient study), opening of
    the muscle BK channel independent of carbonic anhydrase inhibition
    (potassium-depleted rats, which have no channel variant), and reduction of
    muscle sodium overload (uncontrolled patient imaging). The BK route fits
    acetazolamide better than dichlorphenamide, which is the weakest BK opener
    of the class yet is the drug with randomized-trial evidence. The entry
    records each candidate as a separate target_mechanisms link with its own
    evidence instead of choosing one.
  evidence:
  - reference: PMID:29125635
    reference_title: "Review of the Diagnosis and Treatment of Periodic Paralysis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The mechanism of action in periodic paralyses is incompletely understood.
    explanation: >-
      The consensus review states that the mechanism is not understood.
  - reference: PMID:20123788
    reference_title: "Muscle channelopathies: does the predicted channel gating pore offer new treatment insights for hypokalaemic periodic paralysis?"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The carbonic anhydrase inhibitor acetazolamide has been used as a
      treatment for hypokalaemic periodic paralysis for over 40 years but its
      precise therapeutic mechanism of action is unclear.
    explanation: >-
      An independent review reaches the same conclusion.
- discussion_id: gap_hypopp_attack_prevention_and_myopathy
  prompt: >-
    Does preventing paralytic attacks also prevent or slow the fixed myopathy?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Progressive Hypokalemic Periodic Paralysis Myopathy
  - phenotypes#Permanent Proximal Muscle Weakness
  rationale: >-
    Myopathy develops in people who have never had an attack, and the
    dichlorphenamide trials showed fewer attacks without a change in muscle
    strength or mass over nine weeks. Whether any current treatment changes
    the course of the myopathy is unknown. Answering it needs a longitudinal
    cohort with muscle MRI, not a laboratory assay.
  evidence:
  - reference: PMID:20301512
    reference_title: "Hypokalemic Periodic Paralysis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      It is unknown whether prevention of paralytic attacks also prevents the
      development of myopathy.
    explanation: >-
      GeneReviews states the gap directly.
- discussion_id: gap_hypopp_bumetanide_mouse_to_human
  prompt: >-
    Bumetanide prevents and reverses low-potassium weakness in both knock-in
    mouse models, but a single dose did not abort an exercise-induced focal
    attack in patients. Is NKCC1 inhibition ineffective in human muscle, or
    did the trial design fail to test it?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - treatments#Bumetanide (Investigational)
  - pathophysiology#NKCC1-Dependent Chloride Loading
  rationale: >-
    The mouse evidence is from isolated muscle bathed in drug, and from an
    intact animal given a glucose and insulin infusion. The human trial gave
    one 2 mg oral dose after a focal attack had begun in an immobilized hand,
    enrolled nine completers, and measured a compound muscle action potential.
    The mismatch could come from the route and dose reaching muscle, from
    testing rescue instead of prevention, or from a real species difference
    in how much the chloride gradient matters. The trial's authors say the
    data support further study.
  evidence:
  - reference: PMID:38232533
    reference_title: "Crossover randomized controlled trial of bumetanide to rescue an attack of exercise induced hand weakness in hypokalaemic periodic paralysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Two participants recovered from the attack following bumetanide intake;
      none recovered following placebo.
    explanation: >-
      A signal in two of nine participants alongside a negative primary
      outcome is why the question remains open.
  - reference: PMID:24142145
    reference_title: "Beneficial effects of bumetanide in a CaV1.1-R528H mouse model of hypokalaemic periodic paralysis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      establishes bumetanide as a potential therapy for hypokalaemic periodic
      paralysis arising from either NaV1.4 or CaV1.1 mutations.
    explanation: >-
      The mouse result the human trial was designed to translate.

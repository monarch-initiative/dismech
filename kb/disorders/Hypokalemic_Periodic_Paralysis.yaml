  description: >-
    Knock-in of the most common human CACNA1S variant. Low-potassium challenge
    produces paradoxical depolarization, loss of excitability and weakness;
    fibers carry an anomalous inward current at rest; and the mice develop a
    vacuolar myopathy with mild permanent weakness. Mouse Cacna1s is the
    ortholog of human CACNA1S.

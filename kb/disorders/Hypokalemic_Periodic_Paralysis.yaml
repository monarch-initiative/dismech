    fidelity: UNKNOWN
    model_scale: CELLULAR
    description: >-
      Voltage-dependent calcium release is about two-thirds of wild type.
    limitations: >-
      The reduction has been measured only in this mouse; no measurement in
      patient fibers is available to compare it with.
    evidence:
    - reference: PMID:35759432
      reference_title: "Voltage-dependent Ca(2+) release is impaired in hypokalemic periodic paralysis caused by Ca(V)1.1-R528H but not by Na(V)1.4-R669H."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The peak ΔF/F0 in fibers isolated from CaV1.1-R528H mice was about
        two-thirds of the amplitude observed in WT mice
      explanation: >-
        Calcium-indicator measurement in isolated mutant fibers.
  - target: Progressive Hypokalemic Periodic Paralysis Myopathy
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      The mice develop a vacuolar myopathy with mild permanent weakness.
    limitations: >-
      The abstract reports mild permanent weakness and vacuolar change; it
      does not report the progressive fatty replacement seen on patient MRI.
    evidence:
    - reference: PMID:23187123
      reference_title: "A calcium channel mutant mouse model of hypokalemic periodic paralysis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        A vacuolar myopathy with dilated transverse tubules and disruption of
        the triad junctions impaired Ca2+ release and likely contributed to
        the mild permanent weakness.
      explanation: >-
        Histological and functional evidence of myopathy in the model.
- name: NaV1.4-R669H knock-in mouse
  species: Mouse
  genotype: Scn4a p.R669H knock-in (ortholog of human SCN4A R669H), homozygous
  genes:
  - preferred_term: Scn4a
    term:
      id: MGI:98250
      label: Scn4a
  publication: PMID:21881211
  description: >-
    Knock-in of a human SCN4A variant. Homozygous mice lose muscle
    excitability and force on low-potassium challenge, have no myotonia, and
    carry an anomalous inward current at hyperpolarized potentials. This model
    and the CaV1.1-R528H mouse are the systems in which bumetanide and the Kv7
    openers were tested. Mouse Scn4a is the ortholog of human SCN4A.
  modeled_mechanisms:
  - target: Gating-Pore Leak Current
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      Affected fibers carry an anomalous inward current at hyperpolarized
      potentials, consistent with a leaky gating pore.
    evidence:
    - reference: PMID:21881211
      reference_title: "A sodium channel knockin mutant (NaV1.4-R669H) mouse model of hypokalemic periodic paralysis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Affected fibers had an anomalous inward current at hyperpolarized
        potentials, consistent with the proposal that a leaky gating pore in
        R669H channels triggers attacks
      explanation: >-
        Recording of the anomalous current in mutant fibers.
  - target: Sodium-Channel Inactivation and Loss of Fiber Excitability
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Low-potassium challenge produces transient loss of excitability and
      weakness.
    limitations: >-
      The robust phenotype is reported in homozygous mice, whereas the human
      disease is caused by a heterozygous variant.
    divergences:
    - divergence_type: POPULATION_MISMATCH
      materiality: QUALIFYING
      description: >-
        The mice studied are homozygous for the variant. Patients are
        heterozygous, so the mouse carries twice the dose of mutant channel
        and results on severity or drug potency may not scale to patients.
    evidence:
    - reference: PMID:21881211
      reference_title: "A sodium channel knockin mutant (NaV1.4-R669H) mouse model of hypokalemic periodic paralysis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Homozygous R669H mice had a robust HypoPP phenotype, with transient
        loss of muscle excitability and weakness in low-K+ challenge,
        insensitivity to high-K+ challenge, dominant inheritance, and absence
        of myotonia.
      explanation: >-
        Phenotype of the homozygous knock-in on potassium challenge.
- name: Potassium-deficient-diet rat
  species: Rat
  genotype: Wild type, fed a potassium-deficient diet
  publication: PMID:10976636
  description: >-
    Rats made hypokalemic by diet become paralyzed and their fibers depolarize
    after insulin. This is the model in which acetazolamide and other carbonic
    anhydrase inhibitors were found to open the muscle calcium-activated
    potassium channel. The rats carry no channel variant.
  modeled_mechanisms:
  - target: Paradoxical Sarcolemmal Depolarization
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: CELLULAR
    description: >-
      Insulin induces fiber depolarization and paralysis in potassium-depleted
      rats.
    limitations: >-
      The depolarization arises from dietary potassium depletion in normal
      muscle, with no gating-pore leak, so drug effects in this model may not
      carry over to the inherited disease.
    divergences:
    - divergence_type: CAUSE_UNREPRESENTED
      materiality: QUALIFYING
      description: >-
        The gating-pore leak that causes the human disease is absent. The
        model shares the downstream state, low potassium with insulin-induced
        depolarization, but reaches it through total body potassium depletion,
        which patients do not have.
    evidence:
    - reference: PMID:10976636
      reference_title: "Acetazolamide opens the muscular KCa2+ channel: a novel mechanism of action that may explain the therapeutic effect of the drug in hypokalemic periodic paralysis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The in vivo administration of 2.8- and 5.6-mg/kg(-1)/day(-1)
        concentrations of acetazolamide to K-deficient diet rats prevented
        paralysis and depolarization of the fibers induced by insulin.
      explanation: >-
        Describes the insulin-induced depolarization and paralysis in the
        model and its prevention by acetazolamide.

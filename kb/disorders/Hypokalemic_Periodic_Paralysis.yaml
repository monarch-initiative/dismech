- name: Bumetanide (Investigational)
  description: >-
    Bumetanide is a loop diuretic that inhibits the sodium-potassium-chloride
    cotransporter. In knock-in mouse models of both the sodium-channel and the
    calcium-channel form of the disease it prevented low-potassium weakness
    and restored force during an established attack, and it outperformed
    acetazolamide. The one human trial, a nine-participant crossover study of
    a single 2 mg dose given at the onset of an exercise-induced focal attack
    in the hand, did not meet its primary outcome. Bumetanide is not an
    established treatment for this disease.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: bumetanide
      term:
        id: CHEBI:3213
        label: bumetanide
  target_mechanisms:
  - target: NKCC1-Dependent Chloride Loading
    treatment_effect: INHIBITS
    description: >-
      Blocking the cotransporter blocks the main chloride influx pathway,
      keeps myoplasmic chloride low, and so favors the normally polarized
      state of the fiber.
    evidence:
    - reference: PMID:30733232
      reference_title: "Recovery from acidosis is a robust trigger for loss of force in murine hypokalemic periodic paralysis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: >-
        Bumetanide inhibits the NKCC1 cotransporter and thereby blocks the
        major Cl− influx pathway.
      explanation: >-
        States the drug's action on the cotransporter in the mouse muscle
        preparation.
    - reference: PMID:23427324
      reference_title: "Bumetanide prevents transient decreases in muscle force in murine hypokalemic periodic paralysis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: >-
        Bumetanide prevented the development of weakness in 2 mM K(+) and also
        restored force during an established attack of HypoPP.
      explanation: >-
        Ex vivo contraction tests on soleus muscle from NaV1.4-R669H mice.
  target_phenotypes:
  - preferred_term: Episodic flaccid weakness
    term:
      id: HP:0003752
      label: Episodic flaccid weakness
  evidence:
  - reference: PMID:24142145
    reference_title: "Beneficial effects of bumetanide in a CaV1.1-R528H mouse model of hypokalaemic periodic paralysis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      bumetanide protects against both muscle weakness from low K+ challenge
      in vitro and loss of muscle excitability in vivo from a glucose plus
      insulin infusion.
    explanation: >-
      Efficacy in the CaV1.1-R528H mouse, in isolated muscle and in the living
      animal.
  - reference: PMID:23427324
    reference_title: "Bumetanide prevents transient decreases in muscle force in murine hypokalemic periodic paralysis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      Bumetanide was more efficacious than acetazolamide for preventing
      weakness in low K(+) conditions.
    explanation: >-
      Head-to-head comparison with acetazolamide in mouse muscle.
  - reference: PMID:38232533
    reference_title: "Crossover randomized controlled trial of bumetanide to rescue an attack of exercise induced hand weakness in hypokalaemic periodic paralysis."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Bumetanide was well tolerated but not efficacious to rescue a focal
      attack in an immobilised hand in the majority of patients, although data
      supports further studies of this agent.
    explanation: >-
      The randomized crossover trial did not show efficacy for aborting a
      focal attack. The authors scope the result to a single dose and an
      immobilized hand, and note that two participants recovered after
      bumetanide and none after placebo.
- name: Retigabine (Preclinical)
  description: >-
    Retigabine (ezogabine) is an opener of Kv7 (KCNQ) voltage-gated potassium
    channels. In knock-in mouse models of both genetic forms it prevented the
    loss of force produced by a low-potassium challenge and reversed an
    established loss of force, at low micromolar concentrations. It has not
    been tested in patients with this disease, and it is no longer
    distributed as an antiseizure drug.

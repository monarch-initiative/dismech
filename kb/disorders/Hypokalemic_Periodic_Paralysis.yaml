environmental:
- name: Potassium-shifting attack triggers
  description: >-
    High-carbohydrate meals, high salt intake, alcohol, stress, and rest after
    strenuous exercise can precipitate attacks in genetically susceptible
    skeletal muscle by promoting potassium shifts or sarcolemmal inexcitability.
  influences_mechanisms:
  - target: Extracellular-to-Intracellular Potassium Shift
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Insulin-stimulating carbohydrate loads, post-exercise adrenergic recovery,
      stress, and high salt intake promote potassium uptake into skeletal muscle
      and trigger paralytic episodes.
    evidence:
    - reference: PMID:29125635
      reference_title: Review of the Diagnosis and Treatment of Periodic Paralysis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Positive triggers (high carbohydrate rich meal, rest after exercise,
        stress)
      explanation: >-
        Identifies the classic dietary and physiologic triggers that precipitate
        ictal potassium shifts in HypoPP.
  evidence:
  - reference: PMID:29125635
    reference_title: Review of the Diagnosis and Treatment of Periodic Paralysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Positive triggers (high carbohydrate rich meal, rest after exercise,
      stress)
    explanation: >-
      The review identifies common behavioral and dietary precipitants for
      attacks.
  - reference: PMID:39333966
    reference_title: >-
      Familial hypokalemic periodic paralysis: a case induced by concurrent
      hyperthyroidism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A 40-year-old African American man presented with profound muscle weakness
      after consuming a high-salt meal.
    explanation: >-
      Recent case evidence illustrates a high-salt meal as an attack trigger.
diagnosis:
- name: CACNA1S and SCN4A Molecular Genetic Testing
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    Targeted sequencing of CACNA1S and SCN4A is recommended as the first-line
    confirmatory diagnostic test when hypokalemic periodic paralysis is
    clinically suspected, identifying a heterozygous pathogenic variant in
    approximately 60% to 70% of patients meeting consensus clinical criteria.
  results: >-
    Heterozygous pathogenic variant in CACNA1S or SCN4A; approximately 30% of
    clinically diagnosed individuals lack an identifiable variant in either
    gene.
  evidence:
  - reference: PMID:29125635
    reference_title: Review of the Diagnosis and Treatment of Periodic Paralysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of PP can be confirmed by genetic testing, which we
      recommend as the first diagnostic step when there is an
      intermediate‐to‐high clinical suspicion.
    explanation: >-
      Recommends molecular genetic testing as the primary confirmatory
      diagnostic step.
  - reference: PMID:20301512
    reference_title: "Hypokalemic Periodic Paralysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of hypoPP is established in a proband who meets the
      consensus diagnostic criteria based on a history of attacks of muscle
      weakness associated with documented serum potassium <3.5 mmol/L during
      attacks and/or the identification of a heterozygous pathogenic variant in
      CACNA1S or SCN4A.
    explanation: >-
      GeneReviews diagnostic standard combining clinical/biochemical criteria
      and CACNA1S/SCN4A molecular testing.
- name: Ictal Serum Potassium Measurement
  diagnosis_term:
    preferred_term: serum potassium measurement
    term:
      id: NCIT:C61030
      label: Serum Potassium Measurement
  description: >-
    Measurement of serum potassium concentration during an acute attack of
    weakness documents concomitant hypokalemia and distinguishes hypokalemic
    periodic paralysis from hyperkalemic or normokalemic periodic paralysis,
    while thyroid, renal, and adrenal causes of secondary hypokalemia are
    excluded.
  results: >-
    Serum potassium <3.5 mmol/L (often <2.5 mEq/L in severe attacks) during
    episodes of flaccid muscle weakness, with normal interictal potassium.
  evidence:
  - reference: PMID:29125635
    reference_title: Review of the Diagnosis and Treatment of Periodic Paralysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two or more attacks of muscle weakness with documented serum K <3.5 mEq/L
    explanation: >-
      Consensus supportive diagnostic criterion requiring documented ictal
      hypokalemia.
- name: McManis Long-Exercise Electromyography Test
  diagnosis_term:
    preferred_term: long-exercise electromyography
    term:
      id: NCIT:C38056
      label: Electromyography
  description: >-
    Electrodiagnostic testing using the McManis 5-minute isometric exercise
    protocol on a distal hand muscle with serial post-exercise compound muscle
    action potential (CMAP) recordings, alongside needle EMG to exclude
    clinical or latent myotonia outside the eyelids.
  results: >-
    Post-exercise decrement in CMAP amplitude of 40% or greater from maximal
    amplitude (observed in more than 70% of patients) and absence of generalized
    myotonic discharges on needle EMG.
  evidence:
  - reference: PMID:29125635
    reference_title: Review of the Diagnosis and Treatment of Periodic Paralysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A reduction in CMAP amplitude of 40% or more from the maximal during
      exercise or post exercise is considered abnormal and is typically seen in
      >70% of patients.
    explanation: >-
      Defines the diagnostic threshold and sensitivity of the McManis long
      exercise electrodiagnostic test in periodic paralysis.
- name: Electrocardiography
  diagnosis_term:
    preferred_term: electrocardiography
    term:
      id: NCIT:C38053
      label: Electrocardiography
  description: >-
    Resting and ictal 12-lead electrocardiography evaluates hypokalemia-related
    conduction changes, guides safe potassium repletion during severe attacks,
    and helps exclude baseline QTc/QU prolongation or ventricular ectopy
    characteristic of Andersen-Tawil syndrome.
  results: >-
    Hypokalemic ECG changes during acute attacks without baseline interictal
    long QTc/QU interval or bidirectional ventricular ectopy.
  evidence:
  - reference: PMID:20301512
    reference_title: "Hypokalemic Periodic Paralysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Severe attacks typically require more intensive medical management with
      intravenous potassium infusion, serial measurement of serum potassium
      concentration, clinical evaluation of possible respiratory involvement,
      and continuous electrocardiogram monitoring.
    explanation: >-
      Supports ECG monitoring in the evaluation and acute management of severe
      hypokalemic attacks.
- name: Skeletal Muscle Magnetic Resonance Imaging
  diagnosis_term:
    preferred_term: skeletal muscle magnetic resonance imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  description: >-
    Muscle MRI (including 1H-MRI) and muscle ultrasound evaluate fixed
    interictal muscle weakness by distinguishing acute muscle edema from chronic
    fatty degeneration and atrophy.
  results: >-
    Muscle edema early in disease course and progressive fatty replacement and
    atrophy in chronic hypokalemic periodic paralysis myopathy.
  evidence:
  - reference: PMID:20301512
    reference_title: "Hypokalemic Periodic Paralysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Muscle ultrasound and muscle 1H-MRI are reliable image techniques with
      high accuracy for the disease. The weakness can be caused by edemas, fatty
      muscle degeneration, and muscle atrophy or a combination of these
      pathologies.
    explanation: >-
      GeneReviews support for muscle MRI in evaluating interictal myopathic
      weakness in HypoPP.
differential_diagnoses:
- name: Thyrotoxic periodic paralysis
  disease_term:
    preferred_term: thyrotoxic periodic paralysis
    term:
      id: MONDO:0019201
      label: thyrotoxic periodic paralysis
  description: >-
    Acquired hypokalemic periodic paralysis precipitated by hyperthyroidism
    (sometimes associated with KCNJ18 susceptibility variants) that closely
    mimics acute attacks of familial HypoPP.
  distinguishing_features:
  - Suppressed serum TSH and biochemical hyperthyroidism
  - Typically adult onset without autosomal dominant family history of childhood periodic paralysis
  - Resolution of paralytic attacks upon restoration of euthyroidism
  evidence:
  - reference: PMID:32644604
    reference_title: "Hypokalemic Periodic Paralysis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Acquired cases of HypoPP are associated with hyperthyroidism.
    explanation: >-
      Identifies hyperthyroidism as the cause of acquired thyrotoxic periodic
      paralysis in the differential diagnosis of HypoPP.
  - reference: PMID:29125635
    reference_title: Review of the Diagnosis and Treatment of Periodic Paralysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Exclusion of other causes of hypokalemia (renal, adrenal, thyroid
      dysfunction; renal tubular acidosis; diuretic and laxative abuse)
    explanation: >-
      Consensus diagnostic criteria require excluding thyroid dysfunction and
      other secondary causes of hypokalemia before diagnosing primary HypoPP.
- name: Hyperkalemic periodic paralysis
  disease_term:
    preferred_term: hyperkalemic periodic paralysis
    term:
      id: MONDO:0008224
      label: hyperkalemic periodic paralysis
  description: >-
    Autosomal dominant SCN4A gain-of-function skeletal muscle channelopathy
    causing shorter, more frequent episodes of flaccid weakness.
  distinguishing_features:
  - Elevated or normal serum potassium during attacks rather than hypokalemia, and worsening with potassium administration
  - Shorter attack duration (typically under 2 hours) and clinical or EMG myotonia between attacks in approximately half of patients
  evidence:
  - reference: PMID:29125635
    reference_title: Review of the Diagnosis and Treatment of Periodic Paralysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Characteristic features of HyperPP are attacks of limb weakness and an
      increase of serum potassium during an attack, but some patients have
      normal serum potassium levels during attacks.
    explanation: >-
      Distinguishes HyperPP from HypoPP by ictal serum potassium elevation.
- name: Andersen-Tawil syndrome
  disease_term:
    preferred_term: Andersen-Tawil syndrome
    term:
      id: MONDO:0008222
      label: Andersen-Tawil syndrome
  description: >-
    Autosomal dominant multisystem potassium channelopathy (most often caused by
    KCNJ2 pathogenic variants) that can present with hypokalemic episodes of
    flaccid paralysis resembling HypoPP.
  distinguishing_features:
  - Ventricular arrhythmias and resting ECG long QTc/QU interval or prominent U waves in the absence of hypokalemia
  - Characteristic craniofacial and skeletal anomalies (low-set ears, hypertelorism, micrognathia, fifth-digit clinodactyly, syndactyly)
  - Pathogenic KCNJ2 variant rather than CACNA1S or SCN4A
  evidence:
  - reference: PMID:29125635
    reference_title: Review of the Diagnosis and Treatment of Periodic Paralysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Andersen‐Tawil syndrome is characterized by a triad of episodic flaccid
      muscle weakness (periodic paralysis), cardiac abnormalities (ventricular
      arrhythmias, prolonged QT interval, and prominent U waves), and
      distinctive skeletal features (low‐set ears, ocular hypertelorism, small
      mandible, fifth‐digit clinodactyly, syndactyly, short stature, scoliosis,
      and a broad forehead).
    explanation: >-
      Distinguishes Andersen-Tawil syndrome from isolated skeletal-muscle HypoPP
      by its cardiac and dysmorphic skeletal triad.
treatments:
- name: Potassium Chloride for Acute Attacks
  description: >-
    Oral potassium chloride is used to treat acute hypokalemic attacks when
    clinically appropriate; serum potassium and ECG monitoring are important to
    avoid overshoot or arrhythmia.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: potassium chloride
      term:
        id: CHEBI:32588
        label: potassium chloride
  target_mechanisms:
  - target: Sarcolemmal Depolarization and Sodium-Channel Inactivation
    description: >-
      Restoring extracellular potassium concentration repolarizes the muscle
      sarcolemma and relieves sodium-channel inactivation during acute attacks.
  target_phenotypes:
  - preferred_term: Hypokalemia
    term:
      id: HP:0002900
      label: Hypokalemia
  evidence:
  - reference: PMID:18426576
    reference_title: Practical aspects in the management of hypokalemic periodic paralysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Potassium chloride is the favored potassium salt given at 0.5-1.0 mEq/kg
      for acute attacks.
    explanation: >-
      Management review evidence supports potassium chloride as acute attack
      therapy.
  - reference: PMID:29125635
    reference_title: Review of the Diagnosis and Treatment of Periodic Paralysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Monitor ECG and potassium levels.
    explanation: >-
      Supports monitoring during potassium-modifying acute management.
- name: Trigger Avoidance and Nutrition Counseling
  description: >-
    Dietary and behavioral counseling targets common triggers such as
    high-carbohydrate meals, high salt intake, alcohol, stress, and rest after
    strenuous exercise.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: dietary intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  target_mechanisms:
  - target: Extracellular-to-Intracellular Potassium Shift
    description: >-
      Limiting high-carbohydrate and high-sodium loads and avoiding abrupt rest
      after strenuous exercise prevents transcellular potassium shifts into
      skeletal muscle.
  target_phenotypes:
  - preferred_term: Episodic flaccid weakness
    term:
      id: HP:0001324
      label: Muscle weakness
  evidence:
  - reference: PMID:18426576
    reference_title: Practical aspects in the management of hypokalemic periodic paralysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Avoidance of or potassium prophylaxis for common triggers, such as rest
      after exercise, high carbohydrate meals, and sodium, can prevent attacks.
    explanation: >-
      Supports trigger avoidance and diet counseling as preventive management.
  - reference: PMID:37784084
    reference_title: >-
      A novel CACNA1S gene variant in a child with hypokalemic periodic
      paralysis: a case report and literature review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The attacks of the patient are prevented by lifestyle changes and
      nutritional counseling.
    explanation: >-
      Single-case evidence supports lifestyle and nutrition counseling as useful
      prevention in a CACNA1S case.
- name: Acetazolamide Preventive Pharmacotherapy
  description: >-
    Acetazolamide is a carbonic anhydrase inhibitor used for attack prevention
    in selected patients, with response varying by genotype and lower response
    reported in SCN4A-related disease.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: acetazolamide
      term:
        id: CHEBI:27690
        label: acetazolamide
  target_mechanisms:
  - target: Sarcolemmal Depolarization and Sodium-Channel Inactivation
    description: >-
      Carbonic anhydrase inhibition induces mild systemic metabolic acidosis
      and reduces susceptibility of mutant muscle fibers to paradoxical
      sarcolemmal depolarization.
  target_phenotypes:
  - preferred_term: Episodic flaccid weakness
    term:
      id: HP:0001324
      label: Muscle weakness
  effect_modifiers:
  - effect_modifier_type: GENOTYPE
    stratum: SCN4A pathogenic variant carriers (HypoPP type 2)
    comparator_stratum: CACNA1S pathogenic variant carriers (HypoPP type 1)
    modified_outcome: Reduction in paralytic attack frequency and severity
    effect_in_stratum: SMALLER_EFFECT
    modification_analysis: CROSS_STRATUM_COMPARISON
    description: >-
      In a 74-patient genotyped cohort, 3 of 19 (16%) individuals with SCN4A
      variants reported benefit from acetazolamide compared with 31 of 55 (56%)
      individuals with CACNA1S variants, and clinical worsening on
      acetazolamide has been reported in specific SCN4A alleles.
    evidence:
    - reference: PMID:22094484
      reference_title: >-
        Acetazolamide efficacy in hypokalemic periodic paralysis and the
        predictive role of genotype.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        There was a greater chance of benefit in patients with mutations in
        CACNA1S (31 responded of 55 total) than in those with mutations in SCN4A
        (3 responded of 19 total).
      explanation: >-
        Demonstrates substantially lower acetazolamide response rate in SCN4A
        carriers compared with CACNA1S carriers.
  evidence:
  - reference: PMID:22094484
    reference_title: >-
      Acetazolamide efficacy in hypokalemic periodic paralysis and the
      predictive role of genotype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Only 46% of the total patient cohort (34 of 74) reported benefit from
      acetazolamide.
    explanation: >-
      Human genotyped cohort evidence supports benefit in a subset of patients
      rather than uniform response.
  - reference: PMID:33325393
    reference_title: >-
      Targeted Therapies for Skeletal Muscle Ion Channelopathies: Systematic
      Review and Steps Towards Precision Medicine.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      hypokalemic PP patients carrying sodium channel mutations may have fewer
      benefits from CAI compared to those carrying calcium channel mutations.
    explanation: >-
      Systematic-review evidence supports genotype-aware, cautious use of
      carbonic anhydrase inhibitors.
- name: Dichlorphenamide Preventive Pharmacotherapy
  description: >-
    Dichlorphenamide is a carbonic anhydrase inhibitor with randomized trial
    evidence for reducing episodic weakness in primary periodic paralyses,
    including hypokalemic periodic paralysis.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: dichlorphenamide
      term:
        id: CHEBI:101085
        label: diclofenamide
  target_mechanisms:
  - target: Sarcolemmal Depolarization and Sodium-Channel Inactivation
    description: >-
      Carbonic anhydrase inhibition reduces muscle fiber susceptibility to
      paradoxical depolarization and recurrent loss of excitability.
  target_phenotypes:
  - preferred_term: Episodic flaccid weakness
    term:
      id: HP:0001324
      label: Muscle weakness
  evidence:
  - reference: PMID:10632100
    reference_title: >-
      Randomized trials of dichlorphenamide in the periodic paralyses. Working

- name: Spironolactone Preventive Pharmacotherapy
  description: >-
    Spironolactone is a mineralocorticoid receptor antagonist and
    potassium-sparing diuretic used as a chronic preventive option when
    carbonic anhydrase inhibitors are not tolerated or not effective. It
    reduces renal potassium loss. The recommendation rests on expert opinion;
    no controlled trial has tested it in this disease. It may be combined with
    potassium supplements, with regular monitoring of serum potassium.

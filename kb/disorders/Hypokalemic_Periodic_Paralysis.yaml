- name: Dichlorphenamide Preventive Pharmacotherapy
  description: >-
    Dichlorphenamide is a carbonic anhydrase inhibitor and the only drug
    approved in the United States for primary hypokalemic periodic paralysis.
    Two sets of randomized, placebo-controlled trials showed fewer attacks in
    hypokalemic periodic paralysis, and benefit was maintained over a one-year
    open-label extension. The trials found no effect on muscle strength or
    muscle mass. Paresthesia and cognitive side effects are common and are
    usually managed by lowering the dose. Its mechanism is presumed to be
    that of the class; unlike acetazolamide it is only a weak opener of the
    muscle BK channel.
  therapeutic_modality: SMALL_MOLECULE
  dosing_interval: twice daily
  dosing_interval_days: 0.5
  treatment_term:

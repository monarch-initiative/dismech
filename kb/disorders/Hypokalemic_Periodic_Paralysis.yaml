pathophysiology:
- name: Gating-Pore Leak Current
  biological_scale: MOLECULAR
  description: >-
    Missense variants that replace an outer gating-charge arginine in an S4
    voltage-sensor segment of CaV1.1 (CACNA1S) or NaV1.4 (SCN4A) open an
    accessory ion pathway through the voltage sensor itself. This gating pore
    conducts a small inward cation current at the resting potential, separate
    from the channel's central pore, and makes muscle fibers susceptible to
    paradoxical depolarization in low extracellular potassium.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: GAIN_OF_FUNCTION
    description: >-
      Heterozygous missense substitution of an S4 gating-charge arginine; the
      gain of function is the anomalous gating-pore conductance, not increased
      conduction through the central pore.
  genes:
  - preferred_term: CACNA1S
    term:

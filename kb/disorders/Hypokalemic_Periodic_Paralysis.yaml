references:
- reference: PMID:20301512
  title: "Hypokalemic Periodic Paralysis."
  tags:
  - GeneReviews
  findings:
  - statement: >-
      About 30% of individuals who meet the consensus diagnostic criteria for
      hypokalemic periodic paralysis carry no pathogenic variant in either
      CACNA1S or SCN4A, so the two curated genes do not account for the whole
      clinically defined disorder.
    evidence:
    - reference: PMID:20301512
      reference_title: "Hypokalemic Periodic Paralysis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Of all individuals meeting diagnostic criteria for hypoPP, approximately 30% do not have a pathogenic variant identified in either of these known genes."
      explanation: States the proportion of clinically diagnosed hypoPP without a variant in either known gene.
  - statement: >-
      Penetrance of a hypoPP pathogenic variant is sex-dependent: about 90% in
      males and reduced in females.
    evidence:
    - reference: PMID:20301512
      reference_title: "Hypokalemic Periodic Paralysis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Penetrance is about 90% in males and reduced in females."
      explanation: States the sex-dependent penetrance of the autosomal dominant hypoPP alleles.
- reference: PMID:32644604
  title: "Hypokalemic Periodic Paralysis."
  tags:
  - StatPearls
  findings:
  - statement: >-
      Familial hypokalemic periodic paralysis accounts for the majority of cases
      via skeletal muscle voltage-gated calcium or sodium channel variants,
      whereas acquired hypokalemic periodic paralysis is characteristically
      associated with hyperthyroidism.
    evidence:
    - reference: PMID:32644604
      reference_title: "Hypokalemic Periodic Paralysis."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        The majority of HypoPP cases are familial. The familial form of HypoPP
        is a rare disorder resulting from mutations in either the voltage-gated
        calcium or sodium ion channels, predominantly affecting skeletal muscle
        cells. Acquired cases of HypoPP are associated with hyperthyroidism.
      explanation: >-
        StatPearls chapter distinguishing inherited skeletal muscle ion-channel
        HypoPP from acquired thyrotoxic periodic paralysis.
progression:
- phase: Onset
  age_range: 2 to 30 years
  duration: 1 to 72 hours per attack (mean nearly 24 hours)
  notes: >-
    First paralytic attacks typically begin in childhood or adolescence (ages
    2-30 years), peak in frequency between ages 15 and 35 years, and often
    diminish in frequency later in adulthood while fixed proximal myopathy can
    emerge.
  evidence:
  - reference: PMID:20301512
    reference_title: "Hypokalemic Periodic Paralysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The age of onset of the first attack ranges from two to 30 years; the
      duration of paralytic episodes ranges from one to 72 hours with an average
      of nearly 24 hours.
    explanation: >-
      GeneReviews summary of age at first attack and episode duration.


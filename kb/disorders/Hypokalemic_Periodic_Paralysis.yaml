      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: >-
        The leak sensitizes myofibers to reduced serum K(+), and the resulting
        membrane depolarization causes the weakness.
      explanation: >-
        Ties reduced extracellular potassium, acting on leaky fibers, to
        membrane depolarization.
- name: NKCC1-Dependent Chloride Loading
  biological_scale: CELLULAR
  description: >-
    The sodium-potassium-chloride cotransporter NKCC1 is the main route of
    chloride entry into muscle fibers. A higher myoplasmic chloride
    concentration moves the chloride equilibrium potential in the depolarizing
    direction and favors the depolarized state of a leaky fiber.
    Hyperosmolality stimulates the transporter, and chloride also accumulates
    during the acidosis of sustained exercise. This is a permissive step in the
    disease, not a defect of the transporter.

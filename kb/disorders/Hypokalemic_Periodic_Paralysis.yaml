    - reference: PMID:29636418
      reference_title: "Spider toxin inhibits gating pore currents underlying periodic paralysis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: >-
        We report that a crab spider toxin Hm-3 from Heriaeus melloteei can
        inhibit gating pore currents due to mutations affecting the second
        arginine residue in the S4 helix of VSD-I that we have found in
        patients with HypoPP and describe here.
      explanation: >-
        Electrophysiology on expressed mutant NaV1.4 channels.

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "co-segregated with susceptibility to recurrent attacks of weakness in association with hypokalemia as low as 1.3 mEq/L"
    explanation: >-
      Reports co-segregation of the KCNA7 variant with HypoPP-type attacks in a
      multigenerational family, which is the human genetic basis for the
      candidate assignment.
  - reference: DOI:10.64898/2026.09.09.750381
    reference_title: "A New Disease Gene for Hypokalemic Periodic Paralysis, <i>KCNA7</i>, Established in a Multigenerational Family"
    supports: SUPPORT

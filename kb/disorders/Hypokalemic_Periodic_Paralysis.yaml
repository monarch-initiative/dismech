      term:
        id: CHEBI:27690
        label: acetazolamide
  target_mechanisms:
  - target: Extracellular-to-Intracellular Potassium Shift
    treatment_effect: INHIBITS
    description: >-
      The metabolic acidosis produced by carbonic anhydrase inhibition reduces
      the insulin-driven entry of potassium into muscle, so serum potassium
      falls less after a glucose and insulin load.
    evidence:
    - reference: PMID:236741
      reference_title: "Acetazolamide treatment of hypokalemic periodic paralysis. Probable mechanism of action."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        The metabolic acidosis induced by the drug appears to be responsible
        for the change in decrement of serum K+ and for the amelioration of
        symptoms in the patients.
      explanation: >-
        A three-patient glucose-insulin challenge study; on acetazolamide the
        fall in serum potassium was 0.9 mM against 1.9 mM without it.
    - reference: PMID:29125635
      reference_title: "Review of the Diagnosis and Treatment of Periodic Paralysis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      directness: INDIRECT
      snippet: >-
        Carbonic anhydrase inhibitors promote kaliuresis and a nonanion gap
        acidosis by increasing urinary bicarbonate excretion. The systemic
        acidosis may reduce the susceptibility to periodic paralysis.
      explanation: >-
        The consensus review's statement of the acidosis hypothesis, which it
        presents as possible and not established.
  - target: Loss of Inward-Rectifier Potassium Conductance in Low Extracellular Potassium
    treatment_effect: BYPASSES
    description: >-
      Acetazolamide opens the large-conductance calcium-activated potassium
      (BK) channel of the sarcolemma, adding a potassium conductance that can
      stand in for the lost inward-rectifier conductance. The evidence comes
      from potassium-depleted rats, which carry no channel variant.
    evidence:
    - reference: PMID:10976636
      reference_title: "Acetazolamide opens the muscular KCa2+ channel: a novel mechanism of action that may explain the therapeutic effect of the drug in hypokalemic periodic paralysis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      directness: INDIRECT
      snippet: >-
        In the acetazolamide-treated animals, intense sarcolemma Ca2+-activated
        K+ channel (KCa2+) activity was recorded.
      explanation: >-
        Potassium-deficient-diet rats treated with acetazolamide were protected
        from insulin-induced paralysis and showed calcium-activated potassium
        channel activity.
    - reference: PMID:14766795
      reference_title: "Carbonic anhydrase inhibitors are specific openers of skeletal muscle BK channel of K+-deficient rats."
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      directness: INDIRECT
      snippet: >-
        Our data indicate that the activation of BK channel is a property of
        CA inhibitors that interact with the channel subunit/s and that this
        effect is not related to their capability to inhibit the CA enzymes.
      explanation: >-
        Excised-patch recordings from rat muscle separate BK channel opening
        from carbonic anhydrase inhibition.
  - target: Paradoxical Sarcolemmal Depolarization
    treatment_effect: INHIBITS
    description: >-
      Acetazolamide reduces the fraction of fibers that sit in the depolarized
      state.
    evidence:
    - reference: PMID:19225109
      reference_title: "K+-dependent paradoxical membrane depolarization and Na+ overload, major and reversible contributors to weakness by ion channel leaks."
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      directness: INDIRECT
      snippet: >-
        Acetazolamide normalized this increased frequency of P2 fibers.
      explanation: >-
        Shown in rat myofiber bundles made leaky with gramicidin, a
        pharmacological stand-in for the gating-pore leak.
  - target: Myoplasmic Sodium Overload
    treatment_effect: INHIBITS
    description: >-
      Acetazolamide lowered intracellular sodium in patients with permanent
      weakness.
    evidence:
    - reference: PMID:29125635
      reference_title: "Review of the Diagnosis and Treatment of Periodic Paralysis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      directness: INDIRECT
      snippet: >-
        carbonic anhydrase inhibitors also may be effective for treating
        permanent weakness in HypoPP by reducing intracellular sodium
        accumulation.
      explanation: >-
        The consensus review's summary of a patient sodium-23 MRI study
        (PMID:19225109), in which muscle sodium fell and strength rose on
        acetazolamide without a control arm. The review hedges the effect as
        possible.

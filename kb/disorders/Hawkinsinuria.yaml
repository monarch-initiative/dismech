inheritance:
- name: Autosomal dominant
  description: >
    Hawkinsinuria segregates as a dominant trait, which is unusual for an inborn
    error of metabolism and is explained mechanistically. Because the variant
    enzyme is catalytically active and produces a toxic species rather than
    failing to produce a normal one, a single altered allele is sufficient. The
    wild-type allele cannot compensate for a reactive product it does not make.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:31342835
    reference_title: "Hawkinsinuria clinical practice guidelines: a Mexican case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hawkinsinuria is an autosomal dominant disorder of tyrosine metabolism."
    explanation: States the dominant inheritance pattern.
  - reference: PMID:1519651
    reference_title: "Hawkinsinuria in two families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hawkinsinuria, a disorder of tyrosine metabolism has been documented in two families in the United States, in one of which there was clear evidence of autosomal dominant inheritance."
    explanation: Pedigree evidence for dominant transmission in a reported family.
  - reference: PMID:20677779
    reference_title: "Product analysis and inhibition studies of a causative Asn to Ser variant of 4-hydroxyphenylpyruvate dioxygenase suggest a simple route to the treatment of Hawkinsinuria."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Importantly, the variant enzyme is highly active, establishing the basis for dominant pedigree pattern."
    explanation: Provides the biochemical explanation for why a single allele suffices.
progression:
- phase: Breastfed infancy
  age_range: Birth to weaning
  notes: >
    Most affected infants are asymptomatic during the first weeks of life, so an
    abnormal tyrosine level on newborn screening may be the only finding.
  evidence:
  - reference: PMID:31342835
    reference_title: "Hawkinsinuria clinical practice guidelines: a Mexican case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Because most hawkinsinuria patients remain asymptomatic during their first weeks of life, altered tyrosine levels are the only finding that can lead to an earlier diagnosis."
    explanation: Establishes the asymptomatic early-infancy phase and the screening finding that identifies it.
- phase: Post-weaning decompensation
  age_range: Around weaning, typically from about 18 weeks of age
  notes: >
    Symptoms begin when the protein load rises on weaning from breast milk, with
    persistent metabolic acidosis, failure to thrive, vomiting and diarrhoea.
  evidence:
  - reference: PMID:31342835
    reference_title: "Hawkinsinuria clinical practice guidelines: a Mexican case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "After weaning, the onset of symptoms is characterized by persistent metabolic acidosis, failure to thrive, as well as fine and sparse hair."
    explanation: Ties symptom onset to weaning and names the presenting features.
  - reference: PMID:31342835
    reference_title: "Hawkinsinuria clinical practice guidelines: a Mexican case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These clinical manifestations typically start at approximately 18 weeks of age."
    explanation: Gives the reported age of symptom onset.
- phase: Spontaneous remission
  age_range: From about one year of age
  notes: >
    Clinical and most biochemical abnormalities resolve spontaneously in the
    second year, while urinary hawkinsin excretion continues lifelong. Adults
    have been diagnosed only through family screening or through retrospective
    metabolic workup.
  evidence:
  - reference: PMID:27488560
    reference_title: "Expanding the phenotype of hawkinsinuria: new insights from response to N-acetyl-L-cysteine."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hawkinsinuria is a rare disorder of tyrosine metabolism that can manifest with metabolic acidosis and growth arrest around the time of weaning off breast milk, typically followed by spontaneous resolution of symptoms around 1 year of age."
    explanation: States the characteristic spontaneous resolution at about one year.
  - reference: PMID:11073718
    reference_title: "Mutations in the 4-hydroxyphenylpyruvic acid dioxygenase gene are responsible for tyrosinemia type III and hawkinsinuria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with hawkinsinuria excrete this metabolite in their urine throughout their life, although symptoms of metabolic acidosis and tyrosinemia improve in the first year of life."
    explanation: Separates the lifelong biochemical marker from the transient clinical illness.
clinical_burden:
  burden_level: MODERATE
  rationale: >
    Burden is concentrated in a narrow window. Untreated infants have persistent
    metabolic acidosis, severe growth failure and repeated hospital admissions,
    and one report describes the early-life period as one of extreme frailty.
    The disorder then remits spontaneously, and asymptomatic adult carriers are
    identified by family screening, so lifetime burden is far lower than the
    infantile picture alone suggests.
  evidence:
  - reference: PMID:10412819
    reference_title: "Long-term follow up of a new case of hawkinsinuria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinically the disease is characterised mainly by chronic metabolic acidosis and severe growth retardation as a result of protein overload."
    explanation: Characterizes the severity of the infantile illness.
  - reference: PMID:40789710
    reference_title: "Challenges in diagnosing hawkinsinuria in adulthood: 2 cases from a single family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Furthermore, her mother, who was asymptomatic, was also diagnosed with hawkinsinuria following family screening."
    explanation: Documents an asymptomatic adult carrier, supporting the low lifetime burden after remission.
pathophysiology:
- name: HPD variant producing uncoupled catalytic turnover
  role: TRIGGER
  biological_scale: MOLECULAR
  description: >
    A heterozygous HPD missense variant, prototypically Asn241Ser, leaves the
    enzyme catalytically active but disrupts the coupling of its reaction cycle.
    Asn241 lies in the active site, away from the substrate binding pocket, and
    has been proposed to position the dioxygen molecule for the second,
    hydroxylation half of the reaction. This is a change in what the enzyme
    makes, not in how much enzyme there is, which is why the trait is dominant.
  genes:
  - preferred_term: HPD
    term:
      id: hgnc:5147
      label: HPD
  genetic_context:
    functional_impact_category: NEOMORPHIC
    zygosity: HETEROZYGOUS
    variant_origin: GERMLINE
    description: >
      A single germline HPD allele producing an active enzyme with an altered
      reaction outcome. The impact is recorded as NEOMORPHIC rather than
      LOSS_OF_FUNCTION or GAIN_OF_FUNCTION because the variant enzyme generates
      a product the wild-type enzyme does not make.
  molecular_functions:
  - preferred_term: 4-hydroxyphenylpyruvate dioxygenase activity
    term:
      id: GO:0003868
      label: 4-hydroxyphenylpyruvate dioxygenase activity
    modifier: ABNORMAL
  evidence:
  - reference: PMID:20677779
    reference_title: "Product analysis and inhibition studies of a causative Asn to Ser variant of 4-hydroxyphenylpyruvate dioxygenase suggest a simple route to the treatment of Hawkinsinuria."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Though other causes may exist, an autosomal dominant mutation that alters codon 241 of the 4-hydroxyphenylpyruvate dioxygenase (HPPD) gene from encoding an asparagine to encoding a serine gives rise to the symptoms of the disease."
    explanation: Identifies the prototypical causal allele.
  - reference: PMID:17560158
    reference_title: "Manifestation of hawkinsinuria in a patient compound heterozygous for hawkinsinuria and tyrosinemia III."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The Asn241Ser mutation is situated further away from the 4-hydroxyphenylpyruvate binding pocket. Assuming that Asn241Ser causes hawkinsinuria, we propose positioning the dioxygen molecule in the HPD-catalyzed reaction as a novel role for the Asn residue."
    explanation: Locates the residue and proposes its mechanistic role in oxygen positioning.
  - reference: PMID:20677779
    reference_title: "Product analysis and inhibition studies of a causative Asn to Ser variant of 4-hydroxyphenylpyruvate dioxygenase suggest a simple route to the treatment of Hawkinsinuria."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Importantly, the variant enzyme is highly active, establishing the basis for dominant pedigree pattern."
    explanation: Establishes that the lesion is not reduced enzyme quantity or activity.
  downstream:
  - target: Formation of a reactive ring-oxidized intermediate in place of homogentisate
    description: >
      The uncoupled reaction releases a reactive intermediate rather than
      completing the rearrangement to homogentisate.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:42140431
      reference_title: "Disease associated missense substitutions disrupt structural stability and catalytic function of 4-hydroxyphenylpyruvate dioxygenase."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The biochemical analysis found that the N241S variant underwent an uncoupled reaction, forming an oxepinone intermediate that reacts with cysteine and forms the hawkinsin adduct."
      explanation: Direct biochemical demonstration of the uncoupled reaction in the human enzyme variant.
  - target: Partial block of tyrosine catabolism
    description: >
      Because turnover is diverted away from homogentisate, flux through the
      tyrosine pathway is partially interrupted despite the enzyme remaining
      active.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:10412819
      reference_title: "Long-term follow up of a new case of hawkinsinuria."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Hawkinsinuria is a rarely diagnosed autosomal dominantly transmitted inborn error of tyrosine metabolism with impaired conversion of 4-hydroxyphenylpyruvate to homogentisate."
      explanation: States that the conversion to homogentisate is impaired in patients.
- name: Formation of a reactive ring-oxidized intermediate in place of homogentisate
  role: CENTRAL_EFFECTOR
  biological_scale: MOLECULAR
  description: >
    Instead of completing the oxidative rearrangement to homogentisate, the
    variant enzyme releases a reactive ring-oxidized species. The 2010
    characterization of the equivalent bacterial and rat variants identified it
    as quinolacetic acid; the 2026 study of the human N241S enzyme describes an
    oxepinone intermediate. Both accounts agree on the functional point, which
    is that an electrophilic species escapes the active site.
  chemical_entities:
  - preferred_term: homogentisic acid
    term:
      id: CHEBI:44747
      label: homogentisic acid
    modifier: DECREASED
  evidence:
  - reference: PMID:20677779
    reference_title: "Product analysis and inhibition studies of a causative Asn to Ser variant of 4-hydroxyphenylpyruvate dioxygenase suggest a simple route to the treatment of Hawkinsinuria."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We have made the structurally equivalent mutation in the Streptomyces avermitilis (N245S) and rat (N241S) genes and shown that in both cases the N to S variant enzyme forms quinolacetic acid in place of the native product 2,5-dihydroxyphenylacetic acid (homogentisate)."
    explanation: Demonstrates product substitution in two orthologous enzymes carrying the equivalent substitution.
  - reference: PMID:6619234
    reference_title: "Hawkinsinuria--identification of quinolacetic acid and pyroglutamic acid during an acidotic phase."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is thought that quinolacetic acid is accumulated as a by-product of the partially defective enzyme, 4-hydroxyphenylpyruvate dioxygenase (EC 1.13.11.27) and that pyroglutamic acid indicated lowered glutathione levels."
    explanation: The original patient-derived inference of an aberrant enzymatic by-product and glutathione consumption.
  downstream:
  - target: Thiol conjugation and hawkinsin formation
    description: >
      The escaped electrophile reacts with cellular thiols by Michael addition,
      forming the cysteine adduct hawkinsin.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:20677779
      reference_title: "Product analysis and inhibition studies of a causative Asn to Ser variant of 4-hydroxyphenylpyruvate dioxygenase suggest a simple route to the treatment of Hawkinsinuria."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Quinolacetic acid reacts readily by Michael addition with cellular thiols to form a two-electron oxidized form of hawkinsin."
      explanation: Names the chemistry that couples the aberrant intermediate to thiol consumption.
- name: Thiol conjugation and hawkinsin formation
  role: DOWNSTREAM
  biological_scale: CELLULAR
  description: >
    Conjugation of the reactive intermediate with cysteine, and with the
    cysteine of glutathione, produces hawkinsin, formally
    (2-L-cystein-S-yl, 4-dihydroxycyclohex-5-en-1-yl)acetic acid. Hawkinsin is
    excreted throughout life and is the diagnostic marker of the disorder, but
    the trapping reaction that makes it is also what consumes the thiol pool.
  chemical_entities:
  - preferred_term: glutathione
    term:
      id: CHEBI:16856
      label: glutathione
    modifier: DECREASED
  biological_processes:
  - preferred_term: glutathione metabolic process
    term:
      id: GO:0006749
      label: glutathione metabolic process
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:11073718
    reference_title: "Mutations in the 4-hydroxyphenylpyruvic acid dioxygenase gene are responsible for tyrosinemia type III and hawkinsinuria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hawkinsin is a sulfur amino acid identified as (2-l-cystein-S-yl, 4-dihydroxycyclohex-5-en-1-yl)acetic acid."
    explanation: Gives the chemical identity of the thiol conjugate.
  - reference: PMID:42140431
    reference_title: "Disease associated missense substitutions disrupt structural stability and catalytic function of 4-hydroxyphenylpyruvate dioxygenase."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This process involves an uncoupled reaction in which HPP is converted into the QAA intermediate, which subsequently reacts with cellular thiols through Michael addition to form hawkinsin"
    explanation: Restates the thiol-trapping step that forms hawkinsin.
  downstream:
  - target: Glutathione depletion
    description: >
      Consumption of the thiol pool by adduct formation lowers glutathione,
      which is detected clinically as pyroglutamic aciduria.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:6619234
      reference_title: "Hawkinsinuria--identification of quinolacetic acid and pyroglutamic acid during an acidotic phase."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "An infant in this family presented with metabolic acidosis and excreted quinolacetic acid and pyroglutamic acid in the urine together with the tyrosine derived phenolic acids reported in the original index case."
      explanation: Couples the aberrant intermediate and the glutathione-depletion marker in the same acidotic infant.
- name: Glutathione depletion
  role: CENTRAL_EFFECTOR
  biological_scale: CELLULAR
  description: >
    Depletion of the cellular glutathione pool disinhibits gamma-glutamylcysteine
    synthetase, driving the gamma-glutamyl cycle to overproduce
    5-oxoproline. The resulting massive pyroglutamic aciduria is the
    biochemical fingerprint of the depletion, and the therapeutic response to
    N-acetylcysteine is the clinical evidence that this node, rather than
    hawkinsin itself, carries the pathology.
  chemical_entities:
  - preferred_term: 5-oxo-L-proline
    term:
      id: CHEBI:18183
      label: 5-oxo-L-proline
    modifier: INCREASED
  evidence:
  - reference: PMID:6619234
    reference_title: "Hawkinsinuria--identification of quinolacetic acid and pyroglutamic acid during an acidotic phase."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is thought that quinolacetic acid is accumulated as a by-product of the partially defective enzyme, 4-hydroxyphenylpyruvate dioxygenase (EC 1.13.11.27) and that pyroglutamic acid indicated lowered glutathione levels."
    explanation: Interprets the pyroglutamic aciduria as a marker of lowered glutathione.
  - reference: PMID:27488560
    reference_title: "Expanding the phenotype of hawkinsinuria: new insights from response to N-acetyl-L-cysteine."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The dramatic response to NAC therapy supports the idea that glutathione depletion plays a key role in the pathogenesis of hawkinsinuria."
    explanation: Treatment response evidence placing glutathione depletion on the causal path.
  downstream:
  - target: Increased urinary pyroglutamic acid
    description: Glutathione depletion drives overproduction and urinary loss of 5-oxoproline.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:27488560
      reference_title: "Expanding the phenotype of hawkinsinuria: new insights from response to N-acetyl-L-cysteine."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "along with the characteristic urinary metabolites, including massive pyroglutamic aciduria"
      explanation: Documents the massive pyroglutamic aciduria in affected twins.
  - target: Infantile metabolic decompensation
    description: >
      Thiol depletion under the increased protein load of weaning produces the
      acidotic, growth-arrested infantile illness. The link is supported by the
      response of both acidosis and growth to thiol repletion.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:27488560
      reference_title: "Expanding the phenotype of hawkinsinuria: new insights from response to N-acetyl-L-cysteine."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Treatment with N-acetyl-L-cysteine (NAC) restored normal growth and normalized or improved most biochemical parameters."
      explanation: Repleting thiols reverses the clinical syndrome, supporting the link while leaving the intervening steps unspecified.
    - reference: PMID:27488560
      reference_title: "Expanding the phenotype of hawkinsinuria: new insights from response to N-acetyl-L-cysteine."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "The urinary metabolites hawkinsin, quinolacetic acid, and pyroglutamic acid can aid in identifying this condition, although their relationship to the clinical manifestations is not known."
      explanation: Retained as an explicit limit, since the source states that the metabolite to symptom relationship is unknown.

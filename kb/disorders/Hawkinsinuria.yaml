genetic:
- name: HPD
  gene_term:
    preferred_term: HPD
    term:
      id: hgnc:5147
      label: HPD
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  inheritance:
  - name: Autosomal dominant
    description: >
      A single altered HPD allele suffices, because the variant enzyme remains
      active and generates a toxic product that the wild-type allele cannot
      offset.
    evidence:
    - reference: PMID:20677779
      reference_title: "Product analysis and inhibition studies of a causative Asn to Ser variant of 4-hydroxyphenylpyruvate dioxygenase suggest a simple route to the treatment of Hawkinsinuria."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Importantly, the variant enzyme is highly active, establishing the basis for dominant pedigree pattern."
      explanation: Gives the biochemical basis for dominance.
  variants:
  - name: HPD N241S
    description: >
      Heterozygous missense substitution of asparagine 241 by serine, the only
      hawkinsinuria allele for which the uncoupled-turnover mechanism has been
      directly demonstrated. It has been reported in trans with a tyrosinemia
      type III null allele in a compound heterozygote who manifested
      hawkinsinuria.
    evidence:
    - reference: PMID:17560158
      reference_title: "Manifestation of hawkinsinuria in a patient compound heterozygous for hawkinsinuria and tyrosinemia III."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We identified a novel hawkinsinuria mutation, Asn241Ser, and a known tyrosinemia type III mutation, Ile335Met, in trans configuration."
      explanation: Patient sequencing identifying the allele and its trans partner.
    - reference: PMID:42140431
      reference_title: "Disease associated missense substitutions disrupt structural stability and catalytic function of 4-hydroxyphenylpyruvate dioxygenase."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The biochemical analysis found that the N241S variant underwent an uncoupled reaction, forming an oxepinone intermediate that reacts with cysteine and forms the hawkinsin adduct."
      explanation: Direct biochemical characterization of the allele in the human enzyme.
  - name: HPD A33T
    description: >
      Heterozygous missense substitution of alanine 33 by threonine, identified
      in the two original molecularly characterized hawkinsinuria patients. Its
      pathogenic role is disputed. It has separately been described as benign,
      found homozygous in an asymptomatic mother, and shown in vitro to produce
      no reactive intermediate while merely reducing stability and homogentisate
      output, which is the tyrosinemia type III pattern rather than the
      hawkinsinuria one.
    evidence:
    - reference: PMID:11073718
      reference_title: "Mutations in the 4-hydroxyphenylpyruvic acid dioxygenase gene are responsible for tyrosinemia type III and hawkinsinuria."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A heterozygous missense mutation predicting an Ala to Thr change at codon 33 (A33T) was found in the same HPD gene in the two patients with hawkinsinuria."
      explanation: The original report associating A33T with hawkinsinuria.
    - reference: PMID:42140431
      reference_title: "Disease associated missense substitutions disrupt structural stability and catalytic function of 4-hydroxyphenylpyruvate dioxygenase."
      supports: REFUTE
      evidence_source: IN_VITRO
      snippet: "The A33T and V212M variants, which produced no intermediate product, exhibited similar substrate binding affinity as WT enzymes, but they had decreased structural stability and HG production (aligned with bioassay findings)."
      explanation: Refutes the uncoupled-turnover mechanism for A33T specifically, since no reactive intermediate was formed.
  - name: HPD V212M
    description: >
      Heterozygous missense substitution of valine 212 by methionine, reported
      alongside A33T in Greek and Mexican patients. Like A33T, it produced no
      reactive intermediate in vitro, and it has been described as of uncertain
      clinical significance.
    evidence:
    - reference: PMID:26226126
      reference_title: "Hawkinsinuria in two unrelated Greek newborns: identification of a novel variant, biochemical findings and treatment."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The mutation A33T was identified in both cases, while one neonate carried an additional novel mutation of HPD gene (V212M)."
      explanation: First report of the V212M allele in screening-detected newborns.
    - reference: PMID:31342835
      reference_title: "Hawkinsinuria clinical practice guidelines: a Mexican case report and literature review."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "The V212M variant has been referred to with uncertain clinical significance, although it was identified in one patient whose mutational analysis established it as disease-causing."
      explanation: States the unresolved clinical significance of the allele.
  features: >
    HPD encodes 4-hydroxyphenylpyruvate dioxygenase. Hawkinsinuria alleles are
    heterozygous missense changes that leave the enzyme active. Only N241S has
    direct biochemical support for the uncoupled reaction that defines the
    disorder; the pathogenic status of A33T and V212M is contested and is
    curated as an open question rather than asserted.
  evidence:
  - reference: PMID:32109208
    reference_title: "Variant analysis of HPD genes from two families showing elevated tyrosine upon newborn screening by tandem mass spectrometry (MS/MS)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Alterations in the structure and activity of 4-hydroxyphenylpyruvate dioxygenase (HPD) are causally related to two different metabolic disorders: recessively inherited tyrosinemia type III and dominantly inherited hawkinsinuria."
    explanation: States the two-disorder relationship of the single gene.

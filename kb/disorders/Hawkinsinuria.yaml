mechanistic_hypotheses:
- hypothesis_group_id: glutathione_depletion_model
  hypothesis_label: Glutathione depletion by thiol trapping
  status: CANONICAL
  description: >
    The operative lesion is not hawkinsin itself but the thiol consumption
    required to make it. The reactive intermediate is quenched by glutathione
    and cysteine, the glutathione pool falls, and the gamma-glutamyl cycle
    overproduces 5-oxoproline. This model is supported at both ends, by the
    pyroglutamic aciduria observed since 1983 and by the response of growth and
    biochemistry to N-acetylcysteine.
  evidence:
  - reference: PMID:27488560
    reference_title: "Expanding the phenotype of hawkinsinuria: new insights from response to N-acetyl-L-cysteine."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The dramatic response to NAC therapy supports the idea that glutathione depletion plays a key role in the pathogenesis of hawkinsinuria."
    explanation: The therapeutic result that anchors the model.
  - reference: PMID:6619234
    reference_title: "Hawkinsinuria--identification of quinolacetic acid and pyroglutamic acid during an acidotic phase."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is thought that quinolacetic acid is accumulated as a by-product of the partially defective enzyme, 4-hydroxyphenylpyruvate dioxygenase (EC 1.13.11.27) and that pyroglutamic acid indicated lowered glutathione levels."
    explanation: The original biochemical inference of glutathione depletion in a patient.
discussions:
- discussion_id: hawkinsinuria_metabolite_symptom_link
  kind: KNOWLEDGE_GAP
  prompt: >
    Which of the accumulating species in hawkinsinuria actually causes the
    infantile illness, and why does the illness remit while hawkinsin excretion
    continues for life?
  rationale: >
    The disorder has an unusual dissociation at its centre. The diagnostic
    metabolite is excreted lifelong, yet the disease lasts under a year. That
    rules out hawkinsin itself as the direct toxin and points at something
    transient, most plausibly the thiol depletion needed to make it, or the
    unconjugated reactive intermediate upstream of it. The literature states the
    gap explicitly, and the proposed remission mechanism, maturation of the
    4-hydroxycyclohexylacetic acid route, is an inference from the timing of
    metabolite appearance rather than a demonstrated pathway.
  attaches_to:
  - pathophysiology#Glutathione depletion
  - pathophysiology#Maturation of an alternative disposal route
  proposed_experiments:
  - experiment_id: hawkinsinuria_longitudinal_thiol_panel
    name: Longitudinal thiol and metabolite panel across the remission window
    description: >
      Serially measure erythrocyte and plasma glutathione, urinary 5-oxoproline,
      hawkinsin and 4-hydroxycyclohexylacetic acid in affected infants from
      diagnosis through remission, to test whether symptom resolution tracks
      recovery of the thiol pool and the appearance of the alternative disposal
      product rather than any fall in hawkinsin output.
  evidence:
  - reference: PMID:27488560
    reference_title: "Expanding the phenotype of hawkinsinuria: new insights from response to N-acetyl-L-cysteine."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The urinary metabolites hawkinsin, quinolacetic acid, and pyroglutamic acid can aid in identifying this condition, although their relationship to the clinical manifestations is not known."
    explanation: States the gap directly.
  - reference: PMID:11073718
    reference_title: "Mutations in the 4-hydroxyphenylpyruvic acid dioxygenase gene are responsible for tyrosinemia type III and hawkinsinuria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with hawkinsinuria excrete this metabolite in their urine throughout their life, although symptoms of metabolic acidosis and tyrosinemia improve in the first year of life."
    explanation: Documents the dissociation between lifelong excretion and transient illness that motivates the gap.
- discussion_id: hawkinsinuria_a33t_allele_dispute
  kind: CONTROVERSY
  prompt: >
    Is A33T a hawkinsinuria allele at all, or has the original genotype to
    phenotype assignment been carried forward without support?
  rationale: >
    A33T was the allele found in the two patients of the first molecular study,
    and much of the subsequent literature treats it as the common hawkinsinuria
    variant. Three independent observations sit awkwardly with that. It has been
    described as benign; in the Mexican family it was found in cis with V212M
    and homozygous in an asymptomatic mother; and in the 2026 biochemical study
    it produced no reactive intermediate, behaving instead like a mildly
    destabilizing loss-of-function allele, which is the tyrosinemia type III
    pattern. Only N241S has a demonstrated uncoupled reaction. This matters for
    curation because it means the disorder is mechanistically defined by one
    allele, and it matters clinically because a patient reported as
    hawkinsinuria on an A33T genotype alone may not have the mechanism this
    entry describes. One reported patient with a heterozygous A33T genotype
    presented with direct hyperbilirubinemia and a biochemical picture the
    authors read as tyrosinemia type III, which is exactly the ambiguity at
    issue.
  attaches_to:
  - pathophysiology#HPD variant producing uncoupled catalytic turnover
  evidence:
  - reference: PMID:42140431
    reference_title: "Disease associated missense substitutions disrupt structural stability and catalytic function of 4-hydroxyphenylpyruvate dioxygenase."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The A33T and V212M variants, which produced no intermediate product, exhibited similar substrate binding affinity as WT enzymes, but they had decreased structural stability and HG production (aligned with bioassay findings)."
    explanation: The biochemical result that separates A33T from the defining mechanism.
  - reference: PMID:31342835
    reference_title: "Hawkinsinuria clinical practice guidelines: a Mexican case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The A33T variant of HPD has been described as benign, but it may produce a partially effective enzyme that is not capable of undergoing the rearrangement phase."
    explanation: States that the allele has been called benign and that its mechanism is uncertain.
  - reference: PMID:31342835
    reference_title: "Hawkinsinuria clinical practice guidelines: a Mexican case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neither parent had associated findings in their clinical history."
    explanation: The A33T-carrying parents, including one homozygote, were clinically unaffected.
  - reference: PMID:30984715
    reference_title: "Hawkinsinuria With Direct Hyperbilirubinemia in Egyptian-Lebanese Boy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "genetic testing revealed a P.A33T heterozygous mutation, a cause of hawkinsinuria"
    explanation: A reported patient whose biochemistry was read as tyrosinemia type III while carrying only the disputed A33T allele.
- discussion_id: hawkinsinuria_reactive_intermediate_identity
  kind: OPEN_QUESTION
  prompt: >
    Is the escaping electrophile quinolacetic acid or an oxepinone, and does the
    distinction matter for the disorder?
  rationale: >
    The 2010 product analysis, performed on Streptomyces avermitilis and rat
    enzymes carrying the equivalent substitution, identified quinolacetic acid.
    The 2026 study of the human N241S enzyme describes an oxepinone intermediate
    that reacts with cysteine to give the hawkinsin adduct. The two accounts
    agree that turnover uncouples and that the escaping species is trapped by
    thiols, so the downstream pathograph is unaffected, and this entry
    deliberately names the node for the functional property rather than for
    either candidate structure. The identity would matter if a scavenger therapy
    were being designed against the intermediate rather than against the thiol
    deficit it creates.
  attaches_to:
  - pathophysiology#Formation of a reactive ring-oxidized intermediate in place of homogentisate
  evidence:
  - reference: PMID:20677779
    reference_title: "Product analysis and inhibition studies of a causative Asn to Ser variant of 4-hydroxyphenylpyruvate dioxygenase suggest a simple route to the treatment of Hawkinsinuria."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We have made the structurally equivalent mutation in the Streptomyces avermitilis (N245S) and rat (N241S) genes and shown that in both cases the N to S variant enzyme forms quinolacetic acid in place of the native product 2,5-dihydroxyphenylacetic acid (homogentisate)."
    explanation: The ortholog-based identification of quinolacetic acid.
  - reference: PMID:42140431
    reference_title: "Disease associated missense substitutions disrupt structural stability and catalytic function of 4-hydroxyphenylpyruvate dioxygenase."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The biochemical analysis found that the N241S variant underwent an uncoupled reaction, forming an oxepinone intermediate that reacts with cysteine and forms the hawkinsin adduct."
    explanation: The human-enzyme identification of an oxepinone intermediate.
- discussion_id: hawkinsinuria_nitisinone_proposal
  kind: EMERGING_HYPOTHESIS
  prompt: >
    Could nitisinone be repurposed to treat hawkinsinuria by shutting down the
    aberrant enzyme?
  rationale: >
    The logic is the mirror image of tyrosinemia type III, where nitisinone is
    contraindicated because it inhibits an already deficient enzyme. Here the
    enzyme is active and making a toxic product, so inhibiting it should stop
    production of the reactive intermediate at source and convert the patient to
    a tyrosinemia type III biochemical state, which is comparatively benign and
    dietarily manageable. The N241S variant is inhibited by nitisinone with
    binding kinetics similar to the wild-type enzyme, and the drug has extensive
    infant safety experience from tyrosinemia type I. This is recorded as a
    hypothesis and not as a treatment, because no human use in hawkinsinuria has
    been reported. Any trial would need to weigh it against a disorder that
    remits spontaneously within a year on diet alone.
  attaches_to:
  - pathophysiology#HPD variant producing uncoupled catalytic turnover
  proposed_experiments:
  - experiment_id: hawkinsinuria_nitisinone_n_of_1
    name: Monitored n-of-1 nitisinone trial in refractory infantile hawkinsinuria
    description: >
      In an infant with biochemically confirmed hawkinsinuria and continuing
      acidosis and growth failure despite diet and N-acetylcysteine, give
      nitisinone with serial urinary hawkinsin, quinolacetic acid and
      5-oxoproline, plasma tyrosine, and growth velocity, predicting loss of the
      hawkinsin and 5-oxoproline signals with a rise in tyrosine.
  evidence:
  - reference: PMID:20677779
    reference_title: "Product analysis and inhibition studies of a causative Asn to Ser variant of 4-hydroxyphenylpyruvate dioxygenase suggest a simple route to the treatment of Hawkinsinuria."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The N to S variant undergoes an apparent three-step binding mechanism with NTBC that forms with rate constants similar to those observed for the wild-type enzyme."
    explanation: Demonstrates that the variant enzyme remains a nitisinone target with wild-type-like binding kinetics.
  - reference: PMID:20677779
    reference_title: "Product analysis and inhibition studies of a causative Asn to Ser variant of 4-hydroxyphenylpyruvate dioxygenase suggest a simple route to the treatment of Hawkinsinuria."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "NTBC has been approved for use in the treatment of type I tyrosinemia and as such has an extensive history of use with infants."
    explanation: Establishes the existing infant safety experience that makes the repurposing proposal tractable.
  - reference: PMID:20677779
    reference_title: "Product analysis and inhibition studies of a causative Asn to Ser variant of 4-hydroxyphenylpyruvate dioxygenase suggest a simple route to the treatment of Hawkinsinuria."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "the extreme stability of the HPPD.NTBC complex suggests that NTBC would be a potent therapeutic for Hawkinisinuria that would alleviate the extreme frailty experienced in the early life period."
    explanation: The authors propose the therapy, but the claim is a suggestion from in vitro kinetics with no human data.
- discussion_id: hawkinsinuria_vs_tyrosinemia_iii_split
  kind: INTERPRETATION
  prompt: >
    Why are hawkinsinuria and tyrosinemia type III curated as two disease
    entries rather than one HPD-related entry with two subtypes?
  rationale: >
    They share a gene but not a pathograph. Tyrosinemia type III is recessive
    loss of enzyme, with hypertyrosinemia and phenolic aciduria leading to a
    lifelong and variable neurological phenotype. Hawkinsinuria is a dominant
    change in reaction outcome, with an aberrant electrophile, thiol depletion
    and a self-limiting infantile acidosis. The treatments diverge in opposite
    directions, since nitisinone is contraindicated in one and proposed in the
    other. The decisive genetic observation is a compound heterozygote carrying
    a null tyrosinemia type III allele in trans with N241S, who manifested
    hawkinsinuria and not tyrosinemia type III, which is what a dominant
    toxic-product mechanism predicts and a severity-gradient model does not.
  attaches_to:
  - pathophysiology#HPD variant producing uncoupled catalytic turnover
  evidence:
  - reference: PMID:17560158
    reference_title: "Manifestation of hawkinsinuria in a patient compound heterozygous for hawkinsinuria and tyrosinemia III."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report a 6-month-old Indian infant who is compound heterozygous for both alleles and who has hawkinsinuria but not tyrosinemia type III based on biochemical investigations."
    explanation: The compound heterozygote whose phenotype discriminates the two mechanisms.
  - reference: PMID:17560158
    reference_title: "Manifestation of hawkinsinuria in a patient compound heterozygous for hawkinsinuria and tyrosinemia III."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in the gene for 4-hydroxyphenylpyruvic acid dioxygenase (HPD) cause either autosomal recessive tyrosinemia type III or autosomal dominant hawkinsinuria."
    explanation: States that one gene gives rise to two disorders with different inheritance.
notes: >
  Naming. Hawkinsin is named for the Hawkins family, in whom the metabolite was
  first identified, and not for a chemical feature. The disorder name therefore
  carries no mechanistic information, which is worth stating because the
  literature sometimes treats hawkinsin excretion and hawkinsinuria as
  interchangeable when the excretion is lifelong and the disease is not.
  Scope of the dominance claim. The entry asserts dominance and gives its
  biochemical basis, but the demonstrated mechanism rests on the N241S allele.
  Whether the more frequently reported A33T allele acts by the same route, or at
  all, is curated as an open controversy rather than assumed.
  Related entries. Tyrosinemia Type III is the recessive allelic disorder at the
  same locus and should be read alongside this entry. Tyrosinemia Type II (TAT)
  and Alkaptonuria (HGD) occupy the adjacent steps of the same pathway.
  Frequencies are omitted. Roughly ten to fifteen patients have been reported
  worldwide, and one report explicitly numbers its case as the tenth, so no
  denominator supports a frequency band for any feature.
review_notes: >
  Curated from ten cached references anchored to MONDO:0007700 and HPD
  (hgnc:5147). No deep-research provider report was used, so the DR-specific
  checks in CLAUDE.md sections 2a and 2b do not apply, and every reference came
  from a PubMed search followed by just fetch-reference. Three modelling
  decisions are worth a reviewer's attention. First, the trigger node uses
  functional_impact_category NEOMORPHIC rather than GAIN_OF_FUNCTION, because
  the enzyme makes a product the wild type does not make; a 2025 case report
  does call it a gain-of-function variant, and that wording was deliberately not
  followed. Second, the A33T allele carries a REFUTE evidence item against the
  defining mechanism and a CONTROVERSY discussion, rather than being listed as a
  plain pathogenic variant, because the original association and the current
  biochemistry disagree. Third, nitisinone is curated only as an
  EMERGING_HYPOTHESIS discussion and deliberately not as a treatment, since the
  proposal rests on in vitro inhibition kinetics with no reported human use.
  PMID:7278885, the 1981 New England Journal of Medicine report that established
  the disorder, caches with no retrievable content, so it is cited nowhere in
  this entry and the historical points it would support are instead evidenced
  from the 1983 and 1992 reports.

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in the 4-hydroxyphenylpyruvate dioxygenase gene (HPD) result in an altered HPD enzyme, causing hawkinsin and tyrosine accumulation."

name: Hawkinsinuria
category: Mendelian
creation_date: '2026-08-21T00:00:00Z'
synonyms:
- 4-Hydroxyphenylpyruvate dioxygenase deficiency, autosomal dominant form
- HPD-related hawkinsinuria
description: >
  Hawkinsinuria is an autosomal dominant inborn error of tyrosine metabolism and
  the allelic counterpart of tyrosinemia type III, both caused by variants in
  HPD. Where tyrosinemia type III is loss of enzyme, hawkinsinuria is loss of
  reaction fidelity. The variant enzyme remains highly active but its catalytic
  cycle uncouples partway, releasing a reactive ring-oxidized intermediate
  instead of the normal product homogentisate. That electrophile is scavenged by
  cellular thiols through Michael addition, generating the sulfur amino acid
  hawkinsin that names the disorder and consuming glutathione in the process.
  Affected infants are well while breastfed and decompensate on weaning with
  persistent metabolic acidosis, failure to thrive, vomiting and diarrhoea,
  accompanied by hawkinsin, quinolacetic acid and massive pyroglutamic aciduria
  in the urine. Symptoms characteristically remit around one year of age as an
  alternative disposal route to 4-hydroxycyclohexylacetic acid matures, although
  hawkinsin excretion continues for life. Management is dietary, and the
  striking response of growth and biochemistry to N-acetylcysteine is the main
  clinical evidence that glutathione depletion is the operative lesion.

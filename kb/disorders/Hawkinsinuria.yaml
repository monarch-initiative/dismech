- name: Maturation of an alternative disposal route
  role: DOWNSTREAM
  biological_scale: ORGANISM
  description: >
    With time, affected individuals begin to excrete cis- and
    trans-4-hydroxycyclohexylacetic acid, and this alternative handling of the
    reactive intermediate coincides with the disappearance of symptoms. This is
    a protective arm of the pathograph rather than a pathological one, and it is
    what makes the disorder self-limiting. It is retained because it also
    explains why treatment is only needed in the first year.
  evidence:
  - reference: PMID:10412819
    reference_title: "Long-term follow up of a new case of hawkinsinuria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As the ability to form 4-hydroxycyclohexylacetic acid and thereby to cope with the still not very well defined reactive and toxic intermediates increases, clinical symptoms vanish."
    explanation: States the proposed adaptive route and its coincidence with symptom resolution.
  - reference: PMID:1519651
    reference_title: "Hawkinsinuria in two families."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Metabolic acidosis and failure to thrive appear to be confined to infancy."
    explanation: Independent observation of the time course, without itself demonstrating the mechanism of remission.

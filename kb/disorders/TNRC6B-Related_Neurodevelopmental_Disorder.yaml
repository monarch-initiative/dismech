- name: Dysregulated Post-Transcriptional Control of Neurodevelopmental Genes
  biological_scale: CELLULAR
  mechanism_confidence: HYPOTHETICAL
  description: >-
    Reduced miRISC effector output is proposed to disturb miRNA-dependent
    regulation of gene networks that are highly expressed in the developing
    brain, including transcripts translated locally at synapses. The specific
    targets, cell types and developmental window are unknown. TNRC6B is
    expressed in the developing and adult brain, and TNRC6B belongs to a
    co-expression module of speech-related regulatory genes highly expressed
    in embryonic human brain.

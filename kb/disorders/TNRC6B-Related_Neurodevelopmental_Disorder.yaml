name: TNRC6B-Related Neurodevelopmental Disorder
creation_date: "2026-10-20T23:34:23Z"
category: Mendelian
synonyms:
- global developmental delay with speech and behavioral abnormalities
- GDSBA
- TNRC6B deficiency syndrome
description: >-
  TNRC6B-related neurodevelopmental disorder (OMIM 619243, global
  developmental delay with speech and behavioral abnormalities) is an
  autosomal dominant condition caused by heterozygous loss-of-function
  variants in TNRC6B (22q13.1), which encodes a GW182-family scaffold of the
  microRNA-induced silencing complex (miRISC). TNRC6B binds Argonaute proteins
  through its N-terminal GW repeats and recruits the PAN2-PAN3 and CCR4-NOT
  deadenylase complexes, so that miRNA-bound transcripts are translationally
  repressed and degraded. Reported alleles are mostly nonsense, frameshift,
  splice-site and intragenic or whole-gene deletions, with a few missense
  variants, consistent with haploinsufficiency. All 17 individuals of the
  founding series had developmental delay or intellectual disability, with
  IQ values ranging from the moderately impaired to the normal range, while
  some later-reported carriers have only learning difficulties or
  behavioral features. Speech delay is the most frequent developmental
  feature. Autism or autistic traits, ADHD and other
  behavioral problems are common. Hypotonia, joint hypermobility and other
  musculoskeletal or connective tissue findings occur in many patients, and
  seizures, short stature, aortic root dilation and nonspecific dysmorphic
  features are reported in a minority. Most variants arise de novo, but about
  a quarter are inherited from mildly affected parents, and expressivity is
  variable within families.
disease_term:
  preferred_term: global developmental delay with speech and behavioral abnormalities
  term:
    id: MONDO:0030995
    label: global developmental delay with speech and behavioral abnormalities
parents:
- hereditary disease
- neurodevelopmental disorder
notes: >-
  Entry named by its gene, following the convention for gene-defined
  neurodevelopmental disorders in kb/disorders; the MONDO label is kept as
  the disease_term and as a synonym. The disorder shares the endogenous miRNA
  effector pathway with AGO2-related Lessel-Kreienkamp syndrome (kb entry
  Lessel-Kreienkamp_Syndrome) and AGO1-related neurodevelopmental disorder.
  The rnai_gene_silencing module was considered for conformance and not used:
  it models therapeutic siRNA delivery and AGO2 slicing of a target
  transcript, not loss of the GW182 scaffold of the endogenous miRNA pathway.
  ClinGen classifies TNRC6B as Definitive for the broader concept complex
  neurodevelopmental disorder (MONDO:0100038, autosomal dominant), which is
  not this entry's disease_term, so no gene_disease_validity assertion is
  recorded. No disease-specific treatment, guideline or clinical trial was
  found, so the treatments section is intentionally absent; management is
  supportive (developmental, speech and behavioral therapies). Two siblings
  homozygous for a TNRC6B missense variant who were also homozygous for an
  ADSL variant, and individuals carrying a second diagnosis (MECP2 deletion,
  TCF20 disruption), are not used as evidence for core phenotypes. The
  openscientist deep-research report gives the gene identifier as
  HGNC:28368, which HGNC's REST service resolves to METTL22; HGNC's
  identifier for TNRC6B is hgnc:29190, which is what is bound here.
inheritance:
- name: Autosomal dominant inheritance
  description: >-
    Heterozygous TNRC6B variants act dominantly. Most arise de novo, but a
    substantial minority are inherited from parents with milder features
    (learning difficulties, ADHD, behavioral dysregulation), which is
    relevant to recurrence-risk counselling.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance

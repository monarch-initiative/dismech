    snippet: "The father and paternal grandmother had learning difficulties and neurobehavioral features, while the proband exhibited a more severe phenotype."
    explanation: Vertical transmission of a TNRC6B deletion across three generations with variable expressivity.
pathophysiology:
- name: TNRC6B Haploinsufficiency
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  role: trigger
  description: >-
    Heterozygous nonsense, frameshift, splice-site, intragenic or whole-gene
    deletion alleles remove one functional copy of TNRC6B. Truncating
    variants upstream of the last exon junction are predicted to undergo
    nonsense-mediated decay, a synonymous variant that causes exon skipping
    has been shown to be pathogenic, and a deletion removing exons 2-23
    segregates with the phenotype, so reduced TNRC6B dosage is the proposed
    disease mechanism. Rare missense variants are also reported.
  genes:
  - preferred_term: TNRC6B
    term:
      id: hgnc:29190
      label: TNRC6B
  genetic_context:
    gene:
      preferred_term: TNRC6B
      term:
        id: hgnc:29190
        label: TNRC6B
    allele_type: nonsense, frameshift, splice-site, intragenic or gene deletion, rare missense
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Mostly predicted null alleles; the original 17-patient series comprised
      7 nonsense, 5 frameshift, 2 splice-site, 2 intragenic deletion and 1
      missense variant.
  evidence:
  - reference: PMID:32152250
    reference_title: Pathogenic variants in TNRC6B cause a genetic disorder characterised by developmental delay/intellectual disability and a spectrum of neurobehavioural phenotypes including autism and ADHD.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The variants were nonsense (7), frameshift (5), splice site (2), intragenic deletions (2) and missense (1)."
    explanation: The allelic spectrum of the founding cohort is dominated by predicted loss-of-function alleles.
  - reference: PMID:32152250
    reference_title: Pathogenic variants in TNRC6B cause a genetic disorder characterised by developmental delay/intellectual disability and a spectrum of neurobehavioural phenotypes including autism and ADHD.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our data highly suggest that haploinsufficiency is the most likely pathogenic mechanism."
    explanation: The founding cohort proposes haploinsufficiency as the disease mechanism.
  - reference: PMID:42074582
    reference_title: Expansion of the Phenotypic Spectrum of TNRC6B-Related Neurodevelopmental Disorder in a Three-Generation Family with 22q13.1 Deletion.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report a three-generation family with a 22q13.1 deletion encompassing only exons 2-23 of TNRC6B."
    explanation: A deletion removing nearly the whole gene, and no other gene, segregates with the disorder, supporting dosage loss.
  - reference: PMID:39115759
    reference_title: "Identification of the synonymous variant c.3141G > A in TNRC6B gene that altered RNA splicing by minigene assay."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Through minigene assay and Sanger sequencing, we demonstrated that c.3141G > A variant induced exon 7 skipping and the synonymous variant was pathogenic."
    explanation: A splice-disrupting synonymous allele in a patient with seizures and developmental delay adds a further loss-of-function mechanism.
  downstream:
  - target: Reduced miRISC Scaffold Function
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:42074582
      reference_title: Expansion of the Phenotypic Spectrum of TNRC6B-Related Neurodevelopmental Disorder in a Three-Generation Family with 22q13.1 Deletion.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "More broadly, TNRC6B dosage can be limiting for RNA-silencing output, supporting a dosage-sensitive model in which partial loss of TNRC6B disrupts finely balanced post-transcriptional regulation of neurodevelopmental gene networks."
      explanation: >-
        The authors' synthesis links reduced TNRC6B dosage to reduced RNA
        silencing output; this is a model drawn from the literature, not a
        measurement in patient cells.
    - reference: PMID:34108231
      reference_title: Impact of scaffolding protein TNRC6 paralogs on gene expression and splicing.
      supports: REFUTE
      evidence_source: IN_VITRO
      snippet: "We find that the paralogs are largely functionally redundant and changes in levels of gene expression are well-correlated with those observed in AGO knockout cell lines."
      explanation: >-
        In knockout cell lines TNRC6A, TNRC6B and TNRC6C are largely
        redundant, which argues against a large, TNRC6B-specific loss of
        silencing in a single cell type and leaves the dosage-sensitive model
        unproven (see discussions).
- name: Reduced miRISC Scaffold Function
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    TNRC6B is a GW182-family scaffold that binds Argonaute proteins through
    its N-terminal GW repeats and, through its C-terminal silencing domain,
    recruits the PAN2-PAN3 and CCR4-NOT deadenylase complexes to miRNA
    targets, causing translational repression and deadenylation-dependent
    decay. Loss of one copy is proposed to reduce this effector output of
    the miRNA pathway. That the scaffold function is reduced in patient
    tissue has not been measured.
  genes:
  - preferred_term: TNRC6B
    term:
      id: hgnc:29190
      label: TNRC6B
  molecular_functions:
  - preferred_term: Argonaute-to-deadenylase adaptor (scaffold) activity
    term:
      id: GO:0060090
      label: molecular adaptor activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: miRNA-mediated post-transcriptional gene silencing
    term:
      id: GO:0035195
      label: miRNA-mediated post-transcriptional gene silencing
    modifier: DECREASED
  - preferred_term: miRNA-mediated gene silencing by mRNA destabilization
    term:
      id: GO:0035279
      label: miRNA-mediated gene silencing by mRNA destabilization
    modifier: DECREASED
  evidence:
  - reference: PMID:16289642
    reference_title: Identification of novel argonaute-associated proteins.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Several known Ago1- and/or Ago2-associated proteins including Dicer were identified, but also two novel factors, the putative RNA helicase MOV10, and the RNA recognition motif (RRM)-containing protein TNRC6B/KIAA1093."
    explanation: TNRC6B was identified as a component of human Argonaute-containing silencing complexes.
  - reference: PMID:19383768
    reference_title: "The C-terminal domains of human TNRC6A, TNRC6B, and TNRC6C silence bound transcripts independently of Argonaute proteins."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our findings indicate that TNRC6A, TNRC6B, and TNRC6C are recruited to miRNA targets through an interaction between their N-terminal domain and an Argonaute protein; the TNRC6s then promote translational repression and/or degradation of miRNA targets through a C-terminal silencing domain."
    explanation: Defines the two-part scaffold function of TNRC6B in miRNA-mediated silencing.
  - reference: PMID:21981923
    reference_title: GW182 proteins directly recruit cytoplasmic deadenylase complexes to miRNA targets.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We found that human GW182 proteins recruit the PAN2-PAN3 and CCR4-CAF1-NOT deadenylase complexes through direct interactions with PAN3 and NOT1, respectively."
    explanation: GW182-family proteins, which include TNRC6B, directly recruit the deadenylases that execute miRNA-mediated decay.
  - reference: PMID:19838187
    reference_title: Ago-TNRC6 triggers microRNA-mediated decay by promoting two deadenylation steps.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we show that let-7 miRNA-induced silencing complexes (miRISCs), which contain the proteins Argonaute (Ago) and TNRC6 (also known as GW182), trigger very rapid mRNA decay by inducing accelerated biphasic deadenylation mediated by Pan2-Pan3 and Ccr4-Caf1 deadenylase complexes followed by Dcp1-Dcp2 complex-directed decapping in mammalian cells."
    explanation: Ago-TNRC6 complexes trigger deadenylation-dependent decay of miRNA targets in mammalian cells.
  - reference: PMID:19470757
    reference_title: Functional dissection of the human TNRC6 (GW182-related) family of proteins.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In contrast, the C-terminal domain containing the RNA recognition motif plays a critical role in the silencing mediated by the TNRC6B protein."
    explanation: Maps the silencing activity of TNRC6B to its C-terminal domain.
  - reference: PMID:32661162
    reference_title: The biochemical basis for the cooperative action of microRNAs.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Thus, the multivalent binding of TNRC6 enables cooperative binding of miRNA-AGO complexes to target RNAs, thereby explaining the basis of cooperative action."
    explanation: The AGO-binding region of TNRC6B makes miRNA-AGO binding to targets with neighbouring sites cooperative.
  - reference: PMID:29576456
    reference_title: Phase Transitions in the Assembly and Function of Human miRISC.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Phase separation is promoted by multivalent interactions between the glycine/tryptophan (GW)-rich domain of TNRC6B and three evenly spaced tryptophan-binding pockets in the Ago2 PIWI domain."
    explanation: TNRC6B and AGO2 condense into miRISC droplets through multivalent GW-domain contacts, a process that accelerates target deadenylation.
  downstream:
  - target: Dysregulated Post-Transcriptional Control of Neurodevelopmental Genes

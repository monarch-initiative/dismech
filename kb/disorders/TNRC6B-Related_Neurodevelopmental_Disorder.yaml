    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "It is caused by heterozygous variant in the TNRC6B gene (NM_001162501.2, MIM 610740), which encodes the trinucleotide repeat-containing adaptor 6B protein."
    explanation: States that the disorder is caused by heterozygous TNRC6B variants, the dominant mode of action.
  - reference: PMID:38404251
    reference_title: "Novel variants in TNRC6B cause global developmental delay with speech and behavioral abnormalities, short stature, low body weight, café-au-lait spots, and metabolic abnormality."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These variants were not identified in patients' parents by Sanger sequencing, suggesting that they were de novo variants."
    explanation: Two unrelated patients carried de novo heterozygous TNRC6B variants.

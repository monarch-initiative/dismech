discussions:
- discussion_id: tnrc6b_dosage_vs_paralog_redundancy
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does heterozygous loss of TNRC6B measurably reduce miRNA-mediated
    silencing in human neurons, given that TNRC6A and TNRC6C are largely
    redundant with it in knockout cell lines?
  attaches_to:
  - pathophysiology#Reduced miRISC Scaffold Function
  rationale: >-
    The human genetics (predominantly null alleles, a segregating
    near-whole-gene deletion) point to haploinsufficiency, but the only
    systematic knockout study of the three paralogs, done in a non-neuronal
    cell line, found them largely redundant. Constitutive knockout mice point
    the other way: the paralogs are not redundant in vivo, and most
    homozygous Tnrc6b knockout mice die within a day of birth. No
    heterozygous, patient-derived cell, neuronal or animal model of TNRC6B
    haploinsufficiency has been reported, so the reduction in silencing
    output and the neurodevelopmental targets that would carry it remain
    inferred.
  proposed_experiments:
  - experiment_id: tnrc6b_het_ipsc_neuron_silencing
    experiment_design: TARGETED_PERTURBATION
    name: miRNA target repression in TNRC6B heterozygous iPSC-derived neurons
    description: >-
      Compare miRNA-reporter repression and AGO-CLIP target occupancy in
      isogenic TNRC6B heterozygous and wild-type iPSC-derived cortical
      neurons, measuring TNRC6A and TNRC6C levels to test for paralog
      compensation.
  evidence:
  - reference: PMID:34108231
    reference_title: Impact of scaffolding protein TNRC6 paralogs on gene expression and splicing.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We find that the paralogs are largely functionally redundant and changes in levels of gene expression are well-correlated with those observed in AGO knockout cell lines."
    explanation: Paralog redundancy in cell lines is what makes TNRC6B dosage sensitivity an open question.
  - reference: PMID:28811219
    reference_title: Trinucleotide repeat containing 6c (TNRC6c) is essential for microvascular maturation during distal airspace sacculation in the developing lung.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "However, the majority of TNRC6b and all TNRC6c mutants die within 24h after birth, the latter with respiratory failure."
    explanation: >-
      Homozygous Tnrc6b knockout is mostly perinatally lethal, which shows a
      non-redundant in vivo requirement but does not model the viable
      heterozygous human disorder.
  - reference: PMID:28811219
    reference_title: Trinucleotide repeat containing 6c (TNRC6c) is essential for microvascular maturation during distal airspace sacculation in the developing lung.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Together, these results demonstrate that GW182 paralogs are not functionally redundant in vivo."
    explanation: In vivo evidence against full paralog redundancy, in contrast to the cell-line data.
  - reference: PMID:42074582
    reference_title: Expansion of the Phenotypic Spectrum of TNRC6B-Related Neurodevelopmental Disorder in a Three-Generation Family with 22q13.1 Deletion.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Variable buffering by paralogues (TNRC6A and TNRC6C), together with genetic modifiers within the miRNA pathway, likely further shapes the clinical spectrum observed in TNRC6B-related disorder."
    explanation: Clinical authors also invoke paralog buffering to explain variable expressivity.

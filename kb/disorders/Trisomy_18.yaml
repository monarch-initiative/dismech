has_subtypes:
- name: Full trisomy 18
  display_name: Full (complete) trisomy 18
  description: >-
    The most common form — three complete copies of chromosome 18 in all cells,
    usually arising from meiotic nondisjunction; associated with the full,
    severe phenotype and high mortality.
  evidence:
  - reference: PMID:23088440
    reference_title: "The trisomy 18 syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "also known as Edwards syndrome, is a common chromosomal disorder due to the presence of an extra chromosome 18, either full, mosaic trisomy, or partial trisomy 18q."
    explanation: Distinguishes full trisomy from mosaic and partial 18q forms.
- name: Mosaic or partial trisomy 18
  display_name: Mosaic trisomy 18 or partial trisomy 18q
  description: >-
    Mosaic trisomy (two cell lines) or partial trisomy of 18q. These forms are
    generally associated with a milder and more variable phenotype and longer
    survival than full trisomy 18.
  evidence:
  - reference: PMID:23088440
    reference_title: "The trisomy 18 syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "also known as Edwards syndrome, is a common chromosomal disorder due to the presence of an extra chromosome 18, either full, mosaic trisomy, or partial trisomy 18q."
    explanation: Establishes mosaic and partial 18q as recognized cytogenetic forms.
prevalence:
- population: Live births
  measure_type: BIRTH_PREVALENCE
  prevalence_class: BAND_1_5_PER_10000
  rate_per_100000: 14.0
  rate_low: 12.5
  rate_high: 16.7
  notes: >-
    Live-born prevalence ~1 in 6,000 to 1 in 8,000 (12.5-16.7 per 100,000). Overall
    prevalence is higher (~1 in 2,500-2,600) because of frequent fetal loss and
    pregnancy termination after prenatal diagnosis. Risk rises with maternal age.
  evidence:
  - reference: PMID:23088440
    reference_title: "The trisomy 18 syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The live born prevalence is estimated as 1/6,000-1/8,000"
    explanation: Provides the live-born prevalence estimate.
  - reference: PMID:23088440
    reference_title: "The trisomy 18 syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The prevalence of trisomy 18 rises with the increasing maternal age."
    explanation: Documents the maternal-age effect on prevalence.
pathophysiology:
- name: Trisomy 18 (Extra Chromosome 18)
  biological_scale: MOLECULAR
  description: >-
    Presence of a third copy of chromosome 18 (full, mosaic, or partial 18q),
    most often from meiotic nondisjunction. It is the second most common
    autosomal trisomy syndrome.
  evidence:
  - reference: PMID:23088440
    reference_title: "The trisomy 18 syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The condition is the second most common autosomal trisomy syndrome after trisomy 21."
    explanation: Establishes trisomy 18 as the second most common autosomal trisomy.
  downstream:
  - target: Chromosome 18 Gene Dosage Imbalance
    causal_link_type: DIRECT
    description: The extra chromosome raises the dosage of all chromosome 18 genes.
- name: Chromosome 18 Gene Dosage Imbalance
  biological_scale: MOLECULAR
  description: >-
    Increased dosage across the genes of chromosome 18 produces a genome-wide
    developmental disturbance affecting multiple organ systems (cardiac, renal,
    craniofacial, skeletal, and central nervous system), rather than acting
    through a single critical gene.
  evidence:
  - reference: PMID:23088440
    reference_title: "The trisomy 18 syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The recognizable syndrome pattern consists of major and minor anomalies, prenatal and postnatal growth deficiency, an increased risk of neonatal and infant mortality, and marked psychomotor and cognitive disability."
    explanation: Describes the multisystem developmental pattern resulting from the trisomy.
  downstream:
  - target: Impaired Organogenesis
    causal_link_type: DIRECT
    description: Dosage imbalance disrupts development of the heart and kidneys in particular.
  - target: Growth Deficiency

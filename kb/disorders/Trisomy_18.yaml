genetic:
- name: Trisomy 18 (extra chromosome 18)
  association: Causal
  notes: >-
    Presence of an extra copy of chromosome 18 — full trisomy (most cases,
    typically from meiotic nondisjunction), mosaic trisomy, or partial trisomy
    18q (copy-number gain). The recurrence risk after a child with full trisomy 18
    is about 1%; prevalence rises with maternal age. No coordinate slot exists in
    the schema; the whole-chromosome gain is recorded here in prose.
  evidence:
  - reference: PMID:23088440
    reference_title: "The trisomy 18 syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The recurrence risk for a family with a child with full trisomy 18 is about 1%."
    explanation: Provides the recurrence risk for full trisomy 18.
diagnosis:
- name: Karyotype Analysis
  presence: 47,XX,+18 or 47,XY,+18
  notes: Most cases are now diagnosed prenatally (maternal-age/serum screening, sonographic markers) and confirmed by karyotype.
  evidence:
  - reference: PMID:23088440
    reference_title: "The trisomy 18 syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Currently most cases of trisomy 18 are prenatally diagnosed, based on screening by maternal age, maternal serum marker screening, or detection of sonographic abnormalities"
    explanation: Establishes prenatal screening and diagnosis as the usual ascertainment route.
treatments:
- name: Supportive and Palliative Care
  description: >-
    No curative therapy exists. Management is supportive and individualized —
    feeding/nutritional support (often enteral), respiratory and airway care, and
    diligent health supervision, especially in the first year of life. Decisions
    about the intensity of care are made with the family.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:23088440
    reference_title: "The trisomy 18 syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Health supervision should be diligent, especially in the first 12 months of life, and can require multiple pediatric and specialist evaluations."
    explanation: Supports diligent multidisciplinary health supervision as the management approach.
references:
- reference: PMID:23088440
  title: "The trisomy 18 syndrome."
- reference: PMID:32522368

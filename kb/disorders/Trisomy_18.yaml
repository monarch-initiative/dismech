name: Trisomy 18
creation_date: "2026-08-22T00:00:00Z"
description: >-
  Trisomy 18 (Edwards syndrome) is a common autosomal trisomy caused by the
  presence of an extra chromosome 18 — full trisomy in most cases, or mosaic or
  partial trisomy 18q. It is the second most common autosomal trisomy syndrome
  after trisomy 21. Whole-chromosome gene-dosage imbalance disrupts development
  across multiple organ systems, producing prenatal and postnatal growth
  deficiency, characteristic craniofacial features, a clenched hand with overriding
  fingers, major malformations (most often cardiac and renal), consistent feeding
  problems, and marked psychomotor and cognitive disability. Neonatal and infant
  mortality is high, though a minority of children survive beyond the first year.
category: Genetic
synonyms:
- Edwards syndrome
- trisomy 18 syndrome
- complete trisomy 18
parents:
- hereditary disease
- chromosomal disorder

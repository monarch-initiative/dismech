    A New Approach Methodology built specifically because animal models and murine
    preadipocyte lines were poor substrates for type 2 diabetes drug discovery.
    Human pluripotent stem cells are differentiated into three-dimensional adipose
    tissue in a microphysiological system, and — the finding that makes the platform
    usable — previously published differentiation protocols were shown to yield
    tissue that is already insulin resistant, which cannot report a further loss of
    insulin sensitivity. Revised conditions plus chip optimization gave hormonally
    responsive tissue with larger, more unilocular lipid droplets and a dynamic range
    the authors report as competent against in vivo and ex vivo comparators, wide
    enough to identify both insulin sensitizers and desensitizers.

      evidence_source: IN_VITRO
      snippet: >-
        Using three independent insulin sensitivity assays, i.e., glucose and fatty
        acid uptake and suppression of lipolysis, as the functional readouts new
        differentiation conditions yielding hormonally responsive iADIPO are derived.
      explanation: >-
        Establishes fatty acid uptake as a first-class validated readout of the
        platform, which is why this model is linked to the fatty acid arm and not
        only to the glucose arm.
- name: Isogenic iPSC macrophage-adipocyte microphysiological system (iMAC-iADIPO-MPS)
  description: >-
    Human adipose tissue inflammation reconstructed from isogenic induced
    pluripotent stem cells. Macrophages migrate into three-dimensional adipocyte
    clusters and form crown-like structures around damaged adipocytes, reproducing
    the defining histology of obese human adipose tissue, and the number of such
    structures increases with adipocyte age and with palmitic acid exposure so
    inflammatory severity is gradable. Polarization is the operative variable: M1
    but not M2 macrophages induce adipocyte insulin resistance and dysregulated
    lipolysis, and transcriptomic and cytokine profiling identify a reciprocal
    proinflammatory loop between the two cell types.
  experimental_model_type: ORGAN_ON_CHIP
  namo_type: namo:OrganOnChip
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  tissue_term:
    preferred_term: white adipose tissue
    term:
      id: UBERON:0001347
      label: white adipose tissue
  cell_types:
  - preferred_term: iPSC-derived white adipocyte (iADIPO)
    term:
      id: CL:0000448
      label: white adipocyte
  - preferred_term: iPSC-derived macrophage (iMAC), M1 and M2 polarized
    term:
      id: CL:0000235
      label: macrophage
  conditions:
  - chronic white adipose tissue inflammation
  - M1 versus M2 macrophage polarization
  - palmitic acid lipotoxic exposure
  - adipocyte aging in culture
  cell_source: >-
    Isogenic human induced pluripotent stem cell-derived macrophages and adipocytes
  culture_system: >-
    Microphysiological system supporting three-dimensional adipocyte clusters with
    macrophage infiltration
  publication: PMID:37104853
  modeled_mechanisms:
  - target: White Adipose Tissue Inflammation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces this node in human cells down to its histologic signature, and
      supplies the polarization control the rodent literature reaches by cytokine
      neutralization: M2 macrophages present in the same numbers do not produce the
      phenotype.
    limitations: >-
      Inflammation is imposed by adding pre-polarized macrophages rather than
      arising from resident immune recruitment, so the model reproduces the inflamed
      state without reproducing how patients arrive at it. There is no vasculature,
      no lymphocyte compartment and no adipose expansion over time. Isogenic by
      design, so it cannot speak to donor variation in inflammatory susceptibility.
    readouts:
    - name: Crown-like structure formation around damaged adipocytes
      target: White Adipose Tissue Inflammation
      direction: INCREASED
      interpretation: >-
        The histologic hallmark named in this node, reproduced in a non-animal human
        system and gradable with exposure severity rather than scored present or
        absent.
      evidence:
      - reference: PMID:37104853
        reference_title: Human iPSC-Derived Proinflammatory Macrophages cause Insulin
          Resistance in an Isogenic White Adipose Tissue Microphysiological System.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          iMACs migrate toward and infiltrate into the 3D iADIPOs cluster to form
          crown-like structures (CLSs)-like morphology around damaged iADIPOs,
          recreating classic histological features of WAT inflammation seen in
          obesity.
        explanation: >-
          States the structural correspondence between the model and obese human
          adipose tissue.
    - name: Dysregulated adipocyte lipolysis under proinflammatory macrophage co-culture
      target: White Adipose Tissue Inflammation
      direction: INCREASED
      biological_processes:
      - preferred_term: Dysregulated Adipocyte Lipolysis
        term:
          id: GO:0019433
          label: triglyceride catabolic process
      interpretation: >-
        Dysregulated lipolysis is the step by which this node exports fatty acids to
        liver and muscle, and the M1-versus-M2 contrast shows it is specific to
        proinflammatory polarization.
      evidence:
      - reference: PMID:37104853
        reference_title: Human iPSC-Derived Proinflammatory Macrophages cause Insulin
          Resistance in an Isogenic White Adipose Tissue Microphysiological System.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          M1 (proinflammatory) but not M2 (tissue repair) iMACs induced insulin
          resistance and dysregulated lipolysis in iADIPOs.
        explanation: >-
          The polarization-controlled comparison that grounds this readout.
    evidence:
    - reference: PMID:37104853
      reference_title: Human iPSC-Derived Proinflammatory Macrophages cause Insulin
        Resistance in an Isogenic White Adipose Tissue Microphysiological System.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        This iMAC-iADIPO-MPS thus successfully recreates pathological conditions of
        chronically inflamed human WAT
      explanation: >-
        The authors' summary of what the model reproduces, which is the content of
        this node.
- name: Isogenic iPSC adipocyte-hepatocyte-macrophage microphysiological system (M1-iADIPO-iHEP-MPS)
  description: >-
    The adipose compartment above fluidically connected to an induced pluripotent
    stem cell-derived hepatocyte compartment by circulating media, with all three
    cell types from one donor line. Because adipose expansion (set by the
    adipocyte-to-hepatocyte ratio) and adipose inflammation (set by macrophage
    polarization) are varied independently, the system separates two variables that
    animal models confound, and finds inflammation rather than expansion to be the
    driver of hepatic insulin resistance. It also carries the drug panel: metformin
    and rosiglitazone improve the hepatic compartment, dexamethasone does not, and
    the GLP-1 receptor agonist semaglutide works through the adipocyte compartment
    alone.
  experimental_model_type: ORGAN_ON_CHIP
  namo_type: namo:OrganOnChip
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  tissue_term:
    preferred_term: white adipose tissue
    term:
      id: UBERON:0001347
      label: white adipose tissue
  cell_types:
  - preferred_term: iPSC-derived white adipocyte (iADIPO)
    term:
      id: CL:0000448
      label: white adipocyte
  - preferred_term: iPSC-derived hepatocyte (iHEP)
    term:
      id: CL:0000182
      label: hepatocyte
  - preferred_term: iPSC-derived proinflammatory (M1) macrophage (iMAC)
    term:
      id: CL:0000863
      label: M1 macrophage
  conditions:
  - white adipose tissue inflammation imposed by proinflammatory macrophages
  - graded adipose expansion set by adipocyte-to-hepatocyte ratio
  - hepatic insulin resistance and hepatic glucose production
  - pharmacological intervention with metformin, rosiglitazone, dexamethasone and semaglutide
  cell_source: >-
    Isogenic human induced pluripotent stem cell-derived white adipocytes,
    hepatocytes and macrophages from a single donor line
  culture_system: >-
    Interconnected two-chamber microphysiological system with circulating media at
    20 microlitres per hour, and a non-circulating flow-through configuration for
    compartment-selective drug exposure
  publication: PMID:39266553
  modeled_mechanisms:
  - target: Insulin Resistance
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Produces insulin resistance across two connected human tissues from a single
      upstream manipulation, and adjudicates between adipose inflammation and
      adipose expansion as its cause. Expansion alone produced hepatic insulin
      resistance only at an extreme adipocyte-to-hepatocyte ratio; inflammation
      produced it readily.
    limitations: >-
      Two tissues only — no muscle and no islet, so neither the largest site of
      insulin-stimulated glucose disposal nor the beta-cell arm of this entry is
      represented. Insulin resistance is imposed over days by macrophage
      polarization rather than developing over years, and the iPSC-derived cells
      retain a fetal-like maturation state. There is no central control of feeding
      or body weight, which is precisely why the semaglutide result is interpretable
      here and confounded in rodents.
    readouts:
    - name: Insulin suppression of hepatic glucose production under adipose inflammation
      target: Insulin Resistance
      direction: DECREASED
      biological_processes:
      - preferred_term: Insulin Receptor Signaling
        term:
          id: GO:0008286
          label: insulin receptor signaling pathway
      interpretation: >-
        Measured in the hepatocyte compartment after manipulating only the adipose
        compartment, so it reads the transfer of insulin resistance between tissues
        rather than a cell-autonomous defect.
      evidence:
      - reference: PMID:39266553
        reference_title: Adipocyte inflammation is the primary driver of hepatic insulin
          resistance in a human iPSC-based microphysiological system.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Analysis of insulin regulation of HGP after 48 h of iADIPO-iHEP-MPS
          interconnection showed insulin resistance only at the highest
          iADIPO-iHEP ratio of 30:1
        explanation: >-
          The expansion arm, recorded as the weaker of the two: mass alone produced
          hepatic insulin resistance only at an extreme ratio, which is the
          comparison that makes inflammation the primary driver.
    evidence:
    - reference: PMID:39266553
      reference_title: Adipocyte inflammation is the primary driver of hepatic insulin
        resistance in a human iPSC-based microphysiological system.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        macrophage-induced adipocyte inflammation causes lipid accumulation in
        hepatocytes and MPS-wide insulin resistance, corresponding to initiation of
        metabolic dysfunction-associated steatotic liver disease.
      explanation: >-
        States that the manipulation produces system-wide insulin resistance, which
        is the node this link asserts the model is informative for.
  - target: White Adipose Tissue Inflammation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Carries the same inflamed adipose compartment as the two-cell system, now with
      a downstream tissue attached, so the consequences of this node can be measured
      outside the tissue in which it occurs.
    limitations: >-
      Same limitation as the two-cell configuration: inflammation is imposed by
      adding pre-polarized macrophages rather than arising from recruitment, and the
      system is isogenic so donor variation is excluded by design.
    readouts:
    - name: Adipose tumor necrosis factor alpha secretion into shared circulation
      target: White Adipose Tissue Inflammation
      direction: INCREASED
      biological_processes:
      - preferred_term: Tumor Necrosis Factor Production
        term:
          id: GO:0032640
          label: tumor necrosis factor production
      interpretation: >-
        The cytokine this node produces, measured in the circulating media that
        reaches the second tissue, which is the mechanism by which a local adipose
        lesion becomes systemic.
      evidence:
      - reference: PMID:39266553
        reference_title: Adipocyte inflammation is the primary driver of hepatic insulin
          resistance in a human iPSC-based microphysiological system.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          As expected, inflammation markers were increased in the M1-iADIPO-MPS,
          including gene expression of the proinflammatory cytokine TNF.
        explanation: >-
          Confirms the cytokine content of the inflamed adipose compartment in this
          configuration.
    evidence:
    - reference: PMID:39266553
      reference_title: Adipocyte inflammation is the primary driver of hepatic insulin
        resistance in a human iPSC-based microphysiological system.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Consistent with our previous results8,34 and human studies44, our model shows
        that M1-iMAC-mediated inflammation readily induces metabolic dysfunction,
        including increased WAT lipolysis and induction of systemic insulin
        resistance.
      explanation: >-
        The authors' own statement that the inflamed adipose compartment drives
        lipolysis and systemic insulin resistance, which is what this node asserts.
  - target: Hepatic Glucose Overproduction
    relationship: MEASURES
    fidelity: MODERATE
    description: >-
      Hepatic glucose production and its suppression by insulin are primary endpoints
      of the chip, alongside PCK1 expression, so this node has a direct human
      non-animal assay. The chip also shows the node responding to metformin.
    limitations: >-
      Hepatocyte compartment only, with no pancreatic alpha cell and no counterregulatory
      hormone axis, so glucagon-driven hepatic glucose production is absent. Absolute
      production rates in an iPSC-derived hepatocyte compartment are not calibrated
      against human liver.
    readouts:
    - name: PCK1 expression and hepatic glucose production
      target: Hepatic Glucose Overproduction
      direction: INCREASED
      biological_processes:
      - preferred_term: Insulin Receptor Signaling
        term:
          id: GO:0008286
          label: insulin receptor signaling pathway
      interpretation: >-
        Rising gluconeogenic gene expression alongside loss of insulin suppression is
        the molecular and functional pair this node describes.
      evidence:
      - reference: PMID:39266553
        reference_title: Adipocyte inflammation is the primary driver of hepatic insulin
          resistance in a human iPSC-based microphysiological system.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          whereas PCK1 gene expression was increased in the iHEP-MPS, suggesting
          activation of gluconeogenesis and development of insulin resistance
        explanation: >-
          The gluconeogenic readout in the hepatocyte compartment, which is the
          content of this node.
    evidence:
    - reference: PMID:39266553
      reference_title: Adipocyte inflammation is the primary driver of hepatic insulin
        resistance in a human iPSC-based microphysiological system.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        We found that inclusion of iADIPOs worsened the metabolic alterations in
        iHEP-MPS, including higher HGP, earlier onset of insulin resistance, higher
        lipid levels and higher expression of genes reflecting inflammation,
        gluconeogenesis, lipogenesis and lipid transport
      explanation: >-
        Names hepatic glucose production as a measured endpoint that responds to the
        adipose manipulation, which is why this model is linked to the hepatic node.
  notes: >-
    Fully curated for its MASLD arm in the
    Metabolic_Dysfunction-Associated_Steatotic_Liver_Disease entry, where the same
    chip is linked to hepatocyte lipid overload and hepatic fatty acid uptake. The
    links here are the type 2 diabetes arm of the same system, and the two entries
    should be kept consistent if either is revised.

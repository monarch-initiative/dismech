  modeled_mechanisms:
  - target: Insulin Resistance
    description: >-
      Reduced whole-body insulin sensitivity is the model parameter si; lowering
      si (or PPARG/thiazolidinedione perturbation of si) reproduces the
      insulin-resistance driver of type 2 diabetes.
  - target: Beta Cell Dysfunction
    description: >-
      Maximal per-beta-cell secretory capacity (sigma) and the beta-cell-mass
      state variable (B) capture secretory failure and glucotoxic beta-cell-mass
      loss; TCF7L2/KCNJ11/HNF1A perturbations act here.
  - target: Hepatic Glucose Overproduction
    description: >-
      Insulin-independent hepatic glucose output is the parameter R0, the target
      reduced by metformin in the simulated treatment scenarios.
  evidence:
  - reference: PMID:11013117
    reference_title: "A model of beta-cell mass, insulin, and glucose kinetics: pathways to diabetes."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      which consists of a system of three nonlinear ordinary differential
      equations, where glucose and insulin dynamics are fast relative to
      beta-cell mass dynamics
    explanation: >-
      Establishes the Topp model as a three-ODE dynamical model of beta-cell
      mass, insulin, and glucose - the substrate used here for simulating type 2
      diabetes mechanisms and treatments.
  findings:
  - statement: >-
      For normal parameters the model is bistable, with a physiological
      (euglycemic) and a pathological (hyperglycemic, beta-cell-collapse) steady
      state separated by a saddle - the dynamical basis for decompensation to
      overt diabetes.
    evidence:
    - reference: PMID:11013117
      reference_title: "A model of beta-cell mass, insulin, and glucose kinetics: pathways to diabetes."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: >-
        For normal parameter values, the model has two stable fixed points
        (representing physiological and pathological steady states), separated on
        a slow manifold by a saddle point
      explanation: >-
        Confirms the bistable, saddle-separated structure that lets an impairing
        perturbation tip the at-risk state to overt diabetes while a corrective
        treatment restores euglycemia.
  - statement: >-
      The model defines three routes to prolonged hyperglycemia (regulated
      hyperglycemia, saddle-node bifurcation, and dynamical hyperglycemia),
      mapping onto insulin-resistance, secretory-failure, and hepatic-output
      drivers of type 2 diabetes.
    evidence:
    - reference: PMID:11013117
      reference_title: "A model of beta-cell mass, insulin, and glucose kinetics: pathways to diabetes."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: >-
        The model predicts that there are three pathways in prolonged
        hyperglycemia
      explanation: >-
        Grounds the perturbation scenarios: each disease driver corresponds to
        one of the model's predicted pathways into sustained hyperglycemia.
  notes: >-
    Wired for dismech-perturb (models/BIOMD0000000341.config.yaml). The
    disease-severity dial is insulin sensitivity si (baseline_gfr 0.72 = healthy);
    the deposited initial state (G=250 mg/dL) sits on the model's unstable saddle,
    i.e. the metabolically at-risk / impaired-fasting tipping point.
    Glucose-lowering treatments are simulated as parameter changes: metformin
    (R0 down),
    thiazolidinedione (si up), SGLT2 inhibitor (Eg0 up, insulin-independent),
    sulfonylurea/GLP-1 (sigma up), insulin therapy (net insulin action up).
    Insulin-independent therapies (SGLT2 inhibition, metformin) and sensitizers
    (TZD) recompensate the model to euglycemia, whereas a pure secretagogue fails
    once beta-cell mass has collapsed - reproducing secondary secretagogue
    failure in advanced disease. Thresholds are calibrated to model steady-state
    values, not clinical reference ranges.

  - target: Insulin-Stimulated Adipocyte Fatty Acid Uptake via FATP1
    relationship: PERTURBS
    fidelity: MODERATE
    description: >-
      Removes the hormone-responsive arm of adipocyte fatty acid uptake
      genetically, and shows the loss is specific to the insulin-stimulated
      component rather than to fatty acid handling generally.
    limitations: >-
      A germline null cannot separate lifelong adaptation from the acute
      consequence of losing the transporter, which matters here because the
      whole-animal outcome is protection rather than harm. Lipid is redistributed
      to the liver rather than simply not absorbed, so adipose and muscle are
      spared at a hepatic cost this entry does not model. Murine, and no human
      SLC27A1 variant evidence is curated here.

  evidence:
  - reference: PMID:38831203
    reference_title: "GLP1-GIP receptor co-agonists: a promising evolution in the treatment of type 2 diabetes."
    supports: SUPPORT
    snippet: "Tirzepatide, characterized by its ability to selectively bind and activate receptors for the intestinal hormones GIP and GLP-1, has been tested in numerous clinical studies and is already currently authorized in several countries for the treatment of type 2 diabetes and obesity."
    explanation: This confirms tirzepatide as an authorized dual GLP-1/GIP agonist for T2D and obesity treatment.
discussions:
- discussion_id: t2d_pgsxc_reverse_causation
  prompt: >-
    Are the T2D PGS×context interactions driven by adverse exposures causally
    amplifying genetic risk, or are some "contexts" (notably circulating glucose)
    actually downstream readouts of incipient disease (reverse causation)?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Insulin Resistance
  - environmental#Sedentary Lifestyle
  - environmental#High-Calorie Diet
  rationale: >-
    Population PGS×context analyses (Nagpal & Gibson 2026,
    PMID:42443528) are largely unable to establish the
    causality of specific contexts. For T2D this is especially acute for
    circulating glucose, a major amplifying "context" in the paper that is also
    nearly definitional of the disease and therefore substantially downstream of
    incipient hyperglycemia rather than a purely upstream driver. Behavioural
    contexts such as reduced physical activity and higher-calorie diet may also
    be partly responses to early metabolic decline. Distinguishing genuine
    amplification from reverse causation determines whether the modelled
    lifestyle interventions would actually reduce risk.
  proposed_experiments:
  - experiment_id: t2d_pgsxc_mr_direction
    name: Mendelian randomization of exposure-to-T2D direction across PGS strata
    description: >-
      Use bidirectional / multivariable Mendelian randomization to test whether
      each candidate context (glucose, omega-6 fatty acids, sex-adjusted
      testosterone, physical activity) causally affects T2D versus being a
      consequence of subclinical disease, and whether the causal effect estimate
      scales with polygenic liability as the amplification model predicts.
    decision_criterion: >-
      A context is retained as a causal amplifier if MR supports
      exposure-to-disease directionality and the exposure-attributable risk
      difference increases across increasing PGS strata; it is flagged as a
      reverse-causation suspect otherwise.
  - experiment_id: t2d_pgsxc_prospective_temporal
    name: Prospective incident-T2D analysis restricted to pre-diagnosis exposure windows
    description: >-
      Restrict exposures to measurements taken well before diagnosis and repeat
      the PGS×context liability-threshold modelling on incident cases only, to
      reduce the chance that exposure values (particularly glucose) reflect early
      disease rather than antecedent risk.
    decision_criterion: >-
      Amplification is supported if the PGS×context deviation from additivity
      persists when only pre-diagnosis exposure windows and incident cases are
      used.

pathophysiology:
- name: White Adipose Tissue Inflammation
  biological_scale: TISSUE
  description: >
    With expanding adiposity, bone-marrow-derived macrophages accumulate in white
    adipose tissue, shift toward classical (M1) proinflammatory activation, and
    surround damaged adipocytes as crown-like structures. The resulting local and
    systemic tumor necrosis factor alpha, together with other proinflammatory
    cytokines, impairs adipocyte insulin signalling and releases lipolysis from
    insulin restraint, so non-esterified fatty acids and cytokines are exported to
    liver and muscle. This node is the adipose-tissue origin of the insulin
    resistance the entry otherwise begins with: the Insulin Resistance node names
    adipose as a resistant tissue but does not say what makes it resistant.
    The causal direction is anchored by an intervention rather than an
    association: neutralizing tumor necrosis factor alpha in obese rats restores
    insulin-stimulated peripheral glucose uptake.

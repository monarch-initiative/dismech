- discussion_id: kgap_t2d_fatp1_insulin_stimulated_fatty_acid_uptake
  prompt: >-
    Inflamed adipose tissue loses the insulin-stimulated fatty acid uptake arm —
    tumor necrosis factor alpha suppresses it and lowers FATP1 protein — yet mice
    that lack that arm from birth are completely protected from diet-induced
    obesity and insulin desensitization. Is losing it a pathogenic feature of the
    insulin-resistant adipocyte, a protective adaptation, or an epiphenomenon?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Insulin-Stimulated Adipocyte Fatty Acid Uptake via FATP1
  - pathophysiology#White Adipose Tissue Inflammation
  rationale: >-
    The two curated results point in opposite directions and the entry does not
    resolve them, which is why no causal edge is drawn from the fatty acid uptake
    node into Insulin Resistance. On one side, tumor necrosis factor alpha — the
    cytokine the adipose inflammation node produces — inhibits both basal and
    insulin-stimulated long-chain fatty acid uptake in adipocytes and reduces FATP1
    and FATP4 protein, so the inflamed adipocyte demonstrably loses this arm
    alongside the GLUT4 arm. Read straightforwardly, that makes the loss part of
    the insulin-resistant phenotype. On the other side, FATP1-null mice, in which
    insulin-stimulated adipocyte fatty acid uptake is abolished outright, are
    completely protected from diet-induced obesity and insulin desensitization, and
    the authors propose FATP1 as an antidiabetic target. If the loss were simply
    pathogenic, that experiment should have gone the other way.
    Three readings survive the curated evidence and it does not discriminate
    between them. The loss may be a compensatory brake that limits adipocyte lipid
    loading, in which case it is protective and the cytokine effect is not the
    lesion. It may be pathogenic acutely but confounded in the knockout by lifelong
    adaptation and by the redistribution of postprandial lipid to the liver that
    the same paper reports — a redistribution that spares adipose at a hepatic cost
    this entry does not model. Or the timing may matter: a transient suppression
    during an established inflammatory state is not the same intervention as
    congenital absence.
    The discriminating experiment is unusually close to hand. Human adipose
    microphysiological systems already use insulin-stimulated fatty acid uptake as
    one of their three validated insulin-sensitivity assays, so the readout exists
    in a human non-animal system; what has not been reported is that assay run
    against an acute FATP1 knockdown, with and without the inflammatory stimulus.
  evidence:
  - reference: PMID:11970897
    reference_title: Insulin causes fatty acid transport protein translocation and
      enhanced fatty acid uptake in adipocytes.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In contrast, treatment with TNF-alpha inhibited basal and insulin-induced
      LCFA uptake and reduced FATP1 and -4 levels.
    explanation: >-
      The arm of the tension that makes loss of this transport step look like part
      of the inflamed, insulin-resistant adipocyte phenotype.
  - reference: PMID:16611988
    reference_title: FATP1 is an insulin-sensitive fatty acid transporter involved in
      diet-induced obesity.
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: >-
      led to a complete protection from diet-induced obesity and insulin
      desensitization.
    explanation: >-
      Graded REFUTE against the reading that losing this arm drives insulin
      resistance: animals lacking it entirely are protected, not harmed. This is the
      result that keeps the node terminal rather than wired into Insulin Resistance.
  - reference: PMID:16611988
    reference_title: FATP1 is an insulin-sensitive fatty acid transporter involved in
      diet-induced obesity.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      causing a redistribution of lipids from adipocyte tissue and muscle to the
      liver
    explanation: >-
      Names the confound in the knockout that a whole-animal protection result
      cannot separate from the adipocyte effect, and the hepatic cost that this
      entry, having no steatosis node, would otherwise not record at all.
  - reference: PMID:34761526
    reference_title: Probing Insulin Sensitivity with Metabolically Competent Human
      Stem Cell-Derived White Adipose Tissue Microphysiological Systems.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Using three independent insulin sensitivity assays, i.e., glucose and fatty
      acid uptake and suppression of lipolysis, as the functional readouts new
      differentiation conditions yielding hormonally responsive iADIPO are derived.
    explanation: >-
      Establishes that the required human readout already exists and is validated,
      which is what makes this a reachable experiment rather than an open-ended call
      for human data.
  proposed_experiments:
  - experiment_id: exp_t2d_fatp1_knockdown_human_adipose_mps
    name: Acute FATP1 knockdown in the human iPSC adipose microphysiological system
      with and without proinflammatory macrophages
    description: >-
      Silence SLC27A1 in the iPSC-derived adipocyte compartment of the metabolically
      competent adipose microphysiological system, after the tissue has been shown
      insulin-responsive on all three validated assays, and run the same assays in
      four arms: knockdown or control, each with and without co-cultured M1
      macrophages. Because the knockdown is acute and applied to already-mature
      tissue, it separates the consequence of losing the transport arm from the
      lifelong adaptation that confounds the germline knockout, and because the chip
      has no liver compartment, the hepatic lipid redistribution seen in the mouse
      cannot rescue or mask the adipose readout.
    experiment_type:
      preferred_term: transporter knockdown in a human adipose microphysiological system
    perturbations:
    - name: Adipocyte SLC27A1 knockdown
      target: pathophysiology#Insulin-Stimulated Adipocyte Fatty Acid Uptake via FATP1
      description: >-
        RNA-interference or CRISPR-interference silencing of SLC27A1 in mature
        iPSC-derived adipocytes, applied after insulin responsiveness has been
        confirmed.
      genes:
      - preferred_term: SLC27A1
        term:
          id: hgnc:10995
          label: SLC27A1
    - name: Proinflammatory macrophage co-culture
      target: pathophysiology#White Adipose Tissue Inflammation
      description: >-
        Addition of M1-polarized iPSC-derived macrophages to impose the inflammatory
        state, with M0 macrophages as the polarization control.
    readouts:
    - name: Insulin-stimulated fatty acid uptake after knockdown
      target: pathophysiology#Insulin-Stimulated Adipocyte Fatty Acid Uptake via FATP1
      direction: DECREASED
      biological_processes:
      - preferred_term: Insulin-Stimulated Long-Chain Fatty Acid Import
        term:
          id: GO:0044539
          label: long-chain fatty acid import into cell
      interpretation: >-
        On-target confirmation, and the test of whether human FATP1 carries the
        hormone-responsive arm as mouse FATP1 does.
    - name: Insulin-stimulated glucose uptake and lipolysis suppression
      target: pathophysiology#Insulin Resistance
      direction: UNCHANGED
      biological_processes:
      - preferred_term: Insulin Receptor Signaling
        term:
          id: GO:0008286
          label: insulin receptor signaling pathway
      interpretation: >-
        The discriminating measurement. Direction is written as the compensatory
        reading — if losing the fatty acid arm is a brake rather than a lesion, the
        other two insulin-sensitivity assays should not deteriorate and may improve
        under inflammation.
    controls:
    - name: Non-targeting knockdown construct
      description: >-
        Scrambled construct on the same delivery schedule, controlling for the
        procedure rather than for the transporter.
    - name: M0 macrophage arm
      description: >-
        Non-activated macrophages in matched numbers, the polarization control that
        distinguishes an inflammatory effect from the presence of a second cell type.
    - name: Uninflamed knockdown arm
      description: >-
        Knockdown without macrophages, so the effect of losing the transport arm is
        measured against a healthy background as well as an inflamed one.
    decision_criterion: >-
      If knockdown worsens insulin-stimulated glucose uptake and lipolysis
      suppression, the loss of this arm is pathogenic and an edge into Insulin
      Resistance should be drawn. If knockdown leaves them unchanged or improves them
      under inflammation, the loss is a brake or an epiphenomenon, the node stays
      terminal, and the FATP1-null protection is explained without appealing to
      lifelong adaptation. A result that depends on whether macrophages are present
      supports the timing reading and neither of the other two.
    would_support:
    - pathophysiology#Insulin-Stimulated Adipocyte Fatty Acid Uptake via FATP1
    would_refute:
    - pathophysiology#Insulin-Stimulated Adipocyte Fatty Acid Uptake via FATP1
    supporting_outcome:
    - >-
      Confirmed SLC27A1 knockdown reduces insulin-stimulated fatty acid uptake and is
      accompanied by deterioration of insulin-stimulated glucose uptake and loss of
      lipolysis suppression, most markedly in the inflamed arm.
    refuting_outcome:
    - >-
      Confirmed knockdown reduces insulin-stimulated fatty acid uptake while glucose
      uptake and lipolysis suppression are unchanged or improved, reproducing in
      human tissue the protection seen in FATP1-null mice.
    - >-
      Knockdown fails to reduce insulin-stimulated fatty acid uptake in human
      adipocytes despite confirmed loss of transcript, which would mean the human
      hormone-responsive arm is not carried by FATP1 and the node needs rewriting
      rather than rewiring.
animal_models:
- name: FATP1 (Slc27a1) knockout mouse on high-fat diet
  species: Mouse
  genotype: Slc27a1 (FATP1) targeted deletion, homozygous null
  background: Diet-induced obesity
  publication: PMID:16611988
  genes:
  - preferred_term: SLC27A1

name: Type 2 Diabetes Mellitus
creation_date: '2025-12-18T17:01:35Z'
description: >-
  Type 2 diabetes mellitus is a common metabolic disease defined by chronic
  hyperglycemia arising from the combination of peripheral insulin resistance
  and progressive pancreatic beta-cell dysfunction. Excess adiposity, physical
  inactivity, and polygenic susceptibility drive impaired insulin signaling in
  muscle, liver, and adipose tissue, with compensatory hyperinsulinemia that
  eventually fails as beta-cell secretory capacity declines. Hepatic glucose
  overproduction and incretin axis dysfunction further worsen glycemic control,
  and sustained hyperglycemia leads to microvascular and macrovascular
  complications such as retinopathy, nephropathy, and peripheral neuropathy.
category: Complex
parents:
- Diabetes Mellitus
- Metabolic Disease
- Endocrine Disease

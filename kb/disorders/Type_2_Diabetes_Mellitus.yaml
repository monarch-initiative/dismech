treatments:
- name: Metformin
  description: First-line oral medication that reduces hepatic glucose production and improves insulin sensitivity.
  treatment_term:
    preferred_term: targeted therapy
    term:
      id: NCIT:C93352
      label: Targeted Therapy
    therapeutic_agent:
    - preferred_term: metformin
      term:
        id: CHEBI:6801
        label: metformin
  target_mechanisms:
  - target: Hepatic Glucose Overproduction
    treatment_effect: INHIBITS
    description: >-
      Metformin's primary action is suppression of excessive hepatic
      gluconeogenesis, so it targets the hepatic-glucose-overproduction node
      directly (with a secondary insulin-sensitizing effect), lowering fasting
      glucose upstream of chronic hyperglycemia.
    evidence:
    - reference: PMID:39266553
      reference_title: Adipocyte inflammation is the primary driver of hepatic insulin
        resistance in a human iPSC-based microphysiological system.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: >-
        However, only metformin and rosiglitazone decreased TNF and PCK1 gene
        expression in the iHEP-MPS and improved insulin response
      explanation: >-
        Human, non-animal support for the hepatic arm of this edge: in an
        interconnected adipose-liver chip metformin lowered expression of the
        gluconeogenic gene PCK1 in the hepatocyte compartment and restored its
        insulin response, while dexamethasone in the same panel did not. Graded
        INDIRECT because gluconeogenic gene expression in a chip is a step removed
        from the fasting glucose lowering the edge describes in patients.
- name: Lifestyle Modification
  description: Diet and exercise interventions to reduce weight and improve metabolic health.
  treatment_term:
    preferred_term: Lifestyle Therapy
    term:
      id: NCIT:C15900
      label: Lifestyle Therapy
  target_mechanisms:
  - target: Insulin Resistance
    treatment_effect: INHIBITS
    description: >-
      Weight loss and exercise improve peripheral insulin sensitivity, acting on
      the insulin-resistance node that is the primary upstream driver of type 2
      diabetes rather than merely lowering glucose downstream.
- name: GLP-1 Receptor Agonists
  description: Injectable medications that enhance insulin secretion and promote weight loss.
  treatment_term:
    preferred_term: targeted therapy
    term:
      id: NCIT:C93352
      label: Targeted Therapy
  target_mechanisms:
  - target: Incretin Axis Dysfunction
    treatment_effect: INHIBITS
    description: >-
      GLP-1 receptor agonists restore the deficient incretin signal, correcting
      the incretin-axis-dysfunction node to enhance glucose-dependent insulin
      secretion (with weight loss and appetite effects), upstream of chronic
      hyperglycemia.
  - target: White Adipose Tissue Inflammation
    treatment_effect: INHIBITS
    description: >-
      Beyond restoring the incretin signal, GLP-1 receptor agonism acts on the
      adipocyte itself to reduce adipose inflammation, and the reduction in
      cytokine output is what improves insulin action in the connected tissue. The
      edge is drawn from a human non-animal system rather than from clinical trial
      data, because the tissue-attribution question it answers is confounded in
      patients and in rodents by the drug's effects on appetite and body weight.
    evidence:
    - reference: PMID:39266553
      reference_title: Adipocyte inflammation is the primary driver of hepatic insulin
        resistance in a human iPSC-based microphysiological system.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: >-
        While selective semaglutide treatment of the M1-iADIPO-MPS component was as
        effective as treatment of the entire M1-iADIPO-iHEP-MPS, selective
        semaglutide treatment of the iHEP-MPS component was largely ineffective
      explanation: >-
        The compartment-selective result that localizes the drug's action to adipose
        tissue: dosing the adipocyte compartment alone reproduced the whole-system
        benefit, dosing the hepatocyte compartment alone did not. Graded INDIRECT
        because the tissue attribution is established in a human model system rather
        than in patients.
    - reference: PMID:39266553
      reference_title: Adipocyte inflammation is the primary driver of hepatic insulin
        resistance in a human iPSC-based microphysiological system.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: >-
        Studying the specific role of the WAT-liver axis in the semaglutide response
        using mouse models has been difficult due to the strong effects on feeding
        behavior and body weight
      explanation: >-
        States why this claim rests on a non-animal human system: the tissue-specific
        question is confounded in rodents by the drug's central effects, which is the
        case for curating a New Approach Methodology result as the primary support
        for a mechanism edge.
  evidence:
  - reference: PMID:38831203
    reference_title: "GLP1-GIP receptor co-agonists: a promising evolution in the treatment of type 2 diabetes."
    supports: SUPPORT
    snippet: "Dual glucagon like peptide 1 (GLP1) and glucose-dependent insulinotropic peptide (GIP) receptor agonists are among the new pharmacological strategies recently developed to address this challenge."
    explanation: This establishes GLP-1/GIP receptor agonists as effective pharmacological strategies for T2D treatment.
- name: SGLT2 Inhibitors
  description: Oral medications that increase urinary glucose excretion.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Chronic Hyperglycemia
    treatment_effect: INHIBITS
    description: >-
      SGLT2 inhibitors act insulin-independently, increasing urinary glucose
      excretion to lower chronic hyperglycemia directly (with additional
      cardiorenal protection), targeting the shared hyperglycemia node that feeds
      the diabetic vascular-complication cascade.
- name: Insulin Therapy
  description: Required when beta cell function declines significantly.
  treatment_term:
    preferred_term: insulin therapy
    term:
      id: NCIT:C179441
      label: Injected Insulin Diabetes Therapy
  target_mechanisms:
  - target: Chronic Hyperglycemia
    treatment_effect: INHIBITS
    description: >-
      When beta-cell secretory capacity has declined enough that endogenous
      insulin is inadequate, exogenous insulin replaces the shortfall and lowers
      chronic hyperglycemia directly — a later-line glucose-node intervention
      once upstream insulin-sensitizing and incretin approaches no longer suffice.
- name: GLP-1/GIP Dual Agonists
  description: Tirzepatide and similar agents that activate both GLP-1 and GIP receptors for enhanced glycemic control and weight loss.
  treatment_term:
    preferred_term: targeted therapy
    term:
      id: NCIT:C93352
      label: Targeted Therapy
  target_mechanisms:
  - target: Incretin Axis Dysfunction
    treatment_effect: INHIBITS

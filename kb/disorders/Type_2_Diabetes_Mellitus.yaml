discussions:
- discussion_id: t2d_pgsxc_reverse_causation
  prompt: >-
    Are the T2D PGS×context interactions driven by adverse exposures causally
    amplifying genetic risk, or are some "contexts" (notably circulating glucose)
    actually downstream readouts of incipient disease (reverse causation)?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Insulin Resistance
  - environmental#Sedentary Lifestyle
  - environmental#High-Calorie Diet
  rationale: >-
    Population PGS×context analyses (Nagpal & Gibson 2026,
    PMID:42443528) are largely unable to establish the
    causality of specific contexts. For T2D this is especially acute for
    circulating glucose, a major amplifying "context" in the paper that is also
    nearly definitional of the disease and therefore substantially downstream of
    incipient hyperglycemia rather than a purely upstream driver. Behavioural
    contexts such as reduced physical activity and higher-calorie diet may also
    be partly responses to early metabolic decline. Distinguishing genuine
    amplification from reverse causation determines whether the modelled
    lifestyle interventions would actually reduce risk.
  proposed_experiments:
  - experiment_id: t2d_pgsxc_mr_direction
    name: Mendelian randomization of exposure-to-T2D direction across PGS strata
    description: >-
      Use bidirectional / multivariable Mendelian randomization to test whether
      each candidate context (glucose, omega-6 fatty acids, sex-adjusted
      testosterone, physical activity) causally affects T2D versus being a
      consequence of subclinical disease, and whether the causal effect estimate
      scales with polygenic liability as the amplification model predicts.
    decision_criterion: >-
      A context is retained as a causal amplifier if MR supports
      exposure-to-disease directionality and the exposure-attributable risk
      difference increases across increasing PGS strata; it is flagged as a
      reverse-causation suspect otherwise.
  - experiment_id: t2d_pgsxc_prospective_temporal
    name: Prospective incident-T2D analysis restricted to pre-diagnosis exposure windows
    description: >-
      Restrict exposures to measurements taken well before diagnosis and repeat
      the PGS×context liability-threshold modelling on incident cases only, to
      reduce the chance that exposure values (particularly glucose) reflect early
      disease rather than antecedent risk.
    decision_criterion: >-
      Amplification is supported if the PGS×context deviation from additivity
      persists when only pre-diagnosis exposure windows and incident cases are
      used.
- discussion_id: gap_t2d_beta_cell_dedifferentiation_reversibility
  prompt: >-
    Is beta-cell dedifferentiation and beta-to-alpha-like trajectory switching
    in type 2 diabetes a reversible driver of beta-cell failure, or mostly a
    late marker of intrapancreatic adiposity, inflammation, and metabolic stress?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Beta Cell Dysfunction
  - pathophysiology#Insulin Resistance
  - pathophysiology#Incretin Axis Dysfunction
  rationale: >-
    The entry links insulin resistance to beta-cell dysfunction, but recent
    human-islet work points to a specific beta-cell identity-loss axis involving
    intrapancreatic adipocytes, immune recruitment, alpha-like trajectories, and
    SMOC1. Resolving whether this state is causally reversible would determine
    whether beta-cell recovery should be modeled as a targetable mechanism
    rather than only as clinical glycemic improvement.
  proposed_experiments:
  - experiment_id: exp_t2d_islet_adipocyte_beta_dedifferentiation_rescue
    name: Human islet-adipocyte beta-cell dedifferentiation rescue assay
    description: >-
      Co-culture human pancreatic islets with intrapancreatic adipocytes and
      autologous immune cells in a microphysiological system; impose
      glucolipotoxic stress; perturb SMOC1 and incretin signaling; and test
      whether beta-cell identity, insulin secretion, and beta-to-alpha-like
      trajectory markers recover when the adipocyte-inflammatory niche is
      removed or therapeutically modulated.
    experiment_type:
      preferred_term: human islet microphysiological perturbation experiment
    model_systems:
    - name: Human islet-adipocyte-immune microphysiological system
      description: >-
        Human islet organ-on-chip or perifusion coculture pairing islets with
        adipocytes and immune cells to model the pancreatic fat-associated
        microenvironment implicated in beta-cell identity loss.
      experimental_model_type: ORGAN_ON_CHIP
      namo_type: namo:OrganOnChip
      organism:
        preferred_term: human
        term:
          id: NCBITaxon:9606
          label: Homo sapiens
      tissue_term:
        preferred_term: pancreas
        term:
          id: UBERON:0001264
          label: pancreas
      cell_types:
      - preferred_term: pancreatic beta cell
        term:
          id: CL:0000169
          label: type B pancreatic cell
      - preferred_term: pancreatic alpha cell
        term:
          id: CL:0000171
          label: pancreatic A cell
      - preferred_term: adipocyte
        term:
          id: CL:0000136
          label: adipocyte
      - preferred_term: T cell
        term:
          id: CL:0000084
          label: T cell
      cell_source: donor human islets with matched or donor-compatible pancreatic adipocytes and immune cells
      culture_system: perfused islet-on-chip or dynamic perifusion coculture
    perturbations:
    - name: Pancreatic adipocyte inflammatory niche
      target: pathophysiology#Beta Cell Dysfunction
      description: >-
        Adipocyte proximity plus inflammatory immune-cell recruitment used to
        model intrapancreatic fat-associated beta-cell stress.
      biological_processes:
      - preferred_term: inflammatory response
        term:
          id: GO:0006954
          label: inflammatory response
    - name: SMOC1 gain and loss of function
      target: pathophysiology#Beta Cell Dysfunction
      description: >-
        Beta-cell SMOC1 overexpression and knockdown used to test whether the
        alpha-cell-associated trajectory gene is sufficient and necessary for
        beta-cell dedifferentiation.
      gene:
        preferred_term: SMOC1
        term:
          id: hgnc:20318
          label: SMOC1
    - name: GLP-1/GIP receptor agonist rescue
      target: pathophysiology#Incretin Axis Dysfunction
      description: >-
        Incretin receptor agonist exposure used to test whether clinically
        relevant treatment restores beta-cell function and identity under an
        adipocyte-inflammatory niche.
      treatment_term:
        preferred_term: targeted therapy
        term:
          id: NCIT:C93352
          label: Targeted Therapy
    readouts:
    - name: Glucose-stimulated insulin secretion
      target: pathophysiology#Beta Cell Dysfunction
      description: Dynamic insulin secretion normalized to beta-cell abundance.
      biological_processes:
      - preferred_term: insulin secretion
        term:
          id: GO:0030073
          label: insulin secretion
      assays:
      - preferred_term: glucose-stimulated insulin secretion assay
      direction: NEGATIVE
    - name: Beta-cell identity and alpha-like trajectory markers
      target: pathophysiology#Beta Cell Dysfunction
      description: >-
        Single-cell expression of INS, MAFA, INSM1, NPY, ALDH1A3, GCG, and
        SMOC1 interpreted as mature beta-cell identity versus dedifferentiated
        or alpha-like trajectory state.
      assays:
      - preferred_term: single-cell transcriptomic profiling
      - preferred_term: immunofluorescence assay
      direction: POSITIVE
    - name: Adipocyte-associated immune recruitment
      target: pathophysiology#Insulin Resistance
      description: T-cell proximity and inflammatory-cytokine readouts around adipocyte-islet interfaces.
      biological_processes:
      - preferred_term: inflammatory response
        term:
          id: GO:0006954
          label: inflammatory response
      assays:
      - preferred_term: multiplex cytokine profiling
      - preferred_term: spatial transcriptomic profiling
      direction: POSITIVE
    controls:
    - name: Islet-only culture
      description: Donor-matched islets cultured without adipocytes or immune cells.
    - name: Non-diabetic donor islet-adipocyte coculture
      description: Parallel coculture built from non-diabetic donor material.
    - name: Vehicle-treated stressed coculture
      description: Stressed coculture receiving vehicle instead of incretin or SMOC1 perturbation.
    decision_criterion: >-
      Dedifferentiation is supported as a reversible causal mechanism if
      adipocyte-inflammatory challenge induces beta-cell identity loss and
      impaired insulin secretion, and if SMOC1 suppression or incretin rescue
      restores mature beta-cell markers and insulin secretion before cell-loss
      dominates.
    would_support:
    - pathophysiology#Beta Cell Dysfunction
    - pathophysiology#Incretin Axis Dysfunction
    evidence:
    - reference: PMID:40072535
      reference_title: "Intrapancreatic adipocytes and beta cell dedifferentiation in human type 2 diabetes."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Higher pancreatic fat content was accompanied by increased beta cell dedifferentiation in the individuals with diabetes."
      explanation: >-
        Supports the human association between pancreatic adiposity and
        beta-cell dedifferentiation that this experiment tries to make causal
        and reversible.
    - reference: PMID:40072535
      reference_title: "Intrapancreatic adipocytes and beta cell dedifferentiation in human type 2 diabetes."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "the interactions among adipocytes, immune cells and beta cells in the pancreas microenvironment might contribute to beta cell failure and dedifferentiation"
      explanation: >-
        Motivates modeling the islet-adipocyte-immune microenvironment rather
        than studying isolated beta cells alone.
    - reference: PMID:41057332
      reference_title: "Human pancreatic α-cell heterogeneity and trajectory inference analyses reveal SMOC1 as a β-cell dedifferentiation gene."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Enhanced SMOC1 expression in β-cells decreased insulin expression and secretion and increased β-cell dedifferentiation markers."
      explanation: >-
        Provides a perturbational handle for testing whether the alpha-like
        trajectory is mechanistically upstream of beta-cell dysfunction.

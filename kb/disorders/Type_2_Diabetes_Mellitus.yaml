- name: Insulin-Stimulated Adipocyte Fatty Acid Uptake via FATP1
  biological_scale: MOLECULAR
  description: >
    Insulin acts on the adipocyte through two transporter arms, not one. Alongside
    GLUT4, insulin drives translocation of fatty acid transport proteins — FATP1
    (SLC27A1) and FATP4 (SLC27A4) — from an intracellular perinuclear compartment
    to the plasma membrane within minutes, and long-chain fatty acid uptake rises
    in parallel. In FATP1-null adipocytes the insulin-stimulated component of
    fatty acid uptake is entirely absent while basal uptake is unaffected, so
    FATP1 specifically carries the hormone-responsive arm. Tumor necrosis factor
    alpha from inflamed adipose tissue suppresses this arm and lowers FATP1 and
    FATP4 protein.
    This node is deliberately terminal. Whether losing the arm drives systemic
    insulin resistance is genuinely unsettled — FATP1-null mice, which lack it
    from birth, are completely protected from diet-induced insulin desensitization
    — so no edge is drawn into Insulin Resistance and the tension is carried by
    the kgap_t2d_fatp1_insulin_stimulated_fatty_acid_uptake discussion instead. The
    node is curated because it is a real, measurable arm of adipocyte insulin
    action that the entry otherwise omits, and because it is one of the three
    functional assays the human adipose microphysiological systems use to score
    insulin sensitivity.

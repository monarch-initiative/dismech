      label: SLC27A1
  description: >-
    Germline loss of the insulin-responsive fatty acid transporter. Insulin-stimulated
    long-chain fatty acid uptake is abolished in adipocytes and greatly reduced in
    skeletal muscle while basal uptake is untouched, postprandial fatty acids are
    redistributed from adipose and muscle to the liver, and the animals are
    completely protected from diet-induced obesity and insulin desensitization. The
    protection is the reason this model is curated: it is the result that prevents
    the adipocyte fatty acid uptake node from being drawn as a straightforward
    driver of insulin resistance.

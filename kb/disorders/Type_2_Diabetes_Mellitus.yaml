computational_models:
- name: Topp Beta-Cell Mass / Insulin / Glucose Model
  description: >-
    Minimal three-ODE dynamical model of the glucose regulatory system (Topp et
    al. 2000): plasma glucose, plasma insulin, and beta-cell mass, with fast
    glucose/insulin dynamics on a slow beta-cell-mass manifold. For normal
    parameters the system is bistable - a physiological steady state (euglycemia)
    and a pathological, insulinopenic steady state (beta-cell-mass collapse and
    severe hyperglycemia) separated by a saddle. This makes it the reference
    dynamical substrate for type 2 diabetes: reduced insulin sensitivity,
    impaired secretion, or hepatic glucose overproduction decompensates the
    at-risk state to overt diabetes, and it is wired for perturbation analysis
    (see the model config sidecar) so that both risk genes and glucose-lowering
    treatments can be simulated as parameter changes.
  model_type: KINETIC
  repository_url: https://www.ebi.ac.uk/biomodels/BIOMD0000000341
  model_id: BIOMD0000000341
  model_software: COPASI
  model_format: SBML
  publication: PMID:11013117
  perturbations:
  - preferred_term: PPARG
    term:
      id: hgnc:9236
      label: PPARG
  - preferred_term: TCF7L2
    term:
      id: hgnc:11641
      label: TCF7L2
  - preferred_term: KCNJ11
    term:
      id: hgnc:6257
      label: KCNJ11
  - preferred_term: HNF1A
    term:
      id: hgnc:11621
      label: HNF1A
  - preferred_term: GCK
    term:
      id: hgnc:4195
      label: GCK
  - preferred_term: SLC5A2
    term:
      id: hgnc:11037
      label: SLC5A2
  modeled_mechanisms:
  - target: Insulin Resistance
    description: >-
      Reduced whole-body insulin sensitivity is the model parameter si; lowering
      si (or PPARG/thiazolidinedione perturbation of si) reproduces the
      insulin-resistance driver of type 2 diabetes.
  - target: Beta Cell Dysfunction
    description: >-
      Maximal per-beta-cell secretory capacity (sigma) and the beta-cell-mass
      state variable (B) capture secretory failure and glucotoxic beta-cell-mass
      loss; TCF7L2/KCNJ11/HNF1A perturbations act here.
  - target: Hepatic Glucose Overproduction
    description: >-
      Insulin-independent hepatic glucose output is the parameter R0, the target
      reduced by metformin in the simulated treatment scenarios.
  evidence:
  - reference: PMID:11013117
    reference_title: "A model of beta-cell mass, insulin, and glucose kinetics: pathways to diabetes."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      which consists of a system of three nonlinear ordinary differential
      equations, where glucose and insulin dynamics are fast relative to
      beta-cell mass dynamics
    explanation: >-
      Establishes the Topp model as a three-ODE dynamical model of beta-cell
      mass, insulin, and glucose - the substrate used here for simulating type 2
      diabetes mechanisms and treatments.
  findings:
  - statement: >-
      For normal parameters the model is bistable, with a physiological
      (euglycemic) and a pathological (hyperglycemic, beta-cell-collapse) steady
      state separated by a saddle - the dynamical basis for decompensation to
      overt diabetes.
    evidence:
    - reference: PMID:11013117
      reference_title: "A model of beta-cell mass, insulin, and glucose kinetics: pathways to diabetes."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: >-
        For normal parameter values, the model has two stable fixed points
        (representing physiological and pathological steady states), separated on
        a slow manifold by a saddle point
      explanation: >-
        Confirms the bistable, saddle-separated structure that lets an impairing
        perturbation tip the at-risk state to overt diabetes while a corrective
        treatment restores euglycemia.
  - statement: >-
      The model defines three routes to prolonged hyperglycemia (regulated
      hyperglycemia, saddle-node bifurcation, and dynamical hyperglycemia),
      mapping onto insulin-resistance, secretory-failure, and hepatic-output
      drivers of type 2 diabetes.
    evidence:
    - reference: PMID:11013117
      reference_title: "A model of beta-cell mass, insulin, and glucose kinetics: pathways to diabetes."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: >-
        The model predicts that there are three pathways in prolonged
        hyperglycemia
      explanation: >-
        Grounds the perturbation scenarios: each disease driver corresponds to
        one of the model's predicted pathways into sustained hyperglycemia.
  notes: >-
    Wired for dismech-perturb (models/BIOMD0000000341.config.yaml). The
    disease-severity dial is insulin sensitivity si (baseline_gfr 0.72 = healthy);
    the deposited initial state (G=250 mg/dL) sits on the model's unstable saddle,
    i.e. the metabolically at-risk / impaired-fasting tipping point.
    Glucose-lowering treatments are simulated as parameter changes: metformin
    (R0 down),
    thiazolidinedione (si up), SGLT2 inhibitor (Eg0 up, insulin-independent),
    sulfonylurea/GLP-1 (sigma up), insulin therapy (net insulin action up).
    Insulin-independent therapies (SGLT2 inhibition, metformin) and sensitizers
    (TZD) recompensate the model to euglycemia, whereas a pure secretagogue fails
    once beta-cell mass has collapsed - reproducing secondary secretagogue
    failure in advanced disease. Thresholds are calibrated to model steady-state
    values, not clinical reference ranges.
  variables:
  - name: Fasting_Plasma_Glucose
    dataset_identifier: G
    description: Plasma glucose concentration at steady state.
    unit: mg/dL
    mappings_list:
    - preferred_term: glucose
      term:
        id: CHEBI:17234
        label: glucose
    - preferred_term: Hyperglycemia
      description: >-
        Steady-state plasma glucose above the model's decompensation level. The
        pathological fixed point runs near 600 mg/dL; the physiological fixed
        point near 100 mg/dL. Bands are calibrated to model steady states, not
        clinical fasting-glucose cutoffs.
      term:
        id: HP:0003074
        label: Hyperglycemia
      threshold: 126
      threshold_direction: above
      severity_scale:
      - threshold: 126
        name: mild
      - threshold: 200
        name: moderate
      - threshold: 400
        name: severe
  - name: Plasma_Insulin
    dataset_identifier: I
    description: >-
      Plasma insulin concentration at steady state. Elevated in the compensated
      insulin-resistant regime and near-zero after glucotoxic beta-cell-mass
      collapse.
    unit: uU/mL
    mappings_list:
    - preferred_term: Hyperinsulinemia
      description: >-
        Compensatory hyperinsulinemia in the insulin-resistant regime before
        beta-cell-mass collapse. Threshold calibrated to model steady state
        (healthy ~10 uU/mL).
      term:
        id: HP:0000842
        label: Hyperinsulinemia
      threshold: 18
      threshold_direction: above
      severity_scale:
      - threshold: 18
        name: mild
      - threshold: 30
        name: moderate
      - threshold: 60
        name: severe
  - name: Beta_Cell_Mass
    dataset_identifier: B
    description: >-
      Functional beta-cell mass (slow state variable). Expands under mild
      hyperglycemia (compensation) and collapses toward zero under sustained
      extreme hyperglycemia (glucotoxicity), the positive-feedback route to
      insulinopenic diabetes.
    unit: mg
- name: Pancreatic Beta Cell Genome-Scale Metabolic Model
  description: >
    First comprehensive genome-scale metabolic reconstruction of human pancreatic
    beta cells,
    integrating transcriptomic data from healthy and type 2 diabetic islets. The model
    captures
    beta cell-specific metabolic pathways and identifies metabolic alterations in
    T2D including
    impaired glucose-stimulated insulin secretion mechanisms.
  model_type: GENOME_SCALE_METABOLIC
  publication: PMID:35276551
  notes: PLOS Computational Biology 2022 - context-specific reconstruction using RNA-seq from healthy and T2D beta cells
- name: Whole-Body Human Metabolic Model for Diabetes
  description: >
    Multi-organ metabolic model (Harvey/Harvetta) capturing inter-organ metabolic
    fluxes in
    diabetes. Models liver, muscle, adipose, and pancreas metabolism with tissue-specific
    constraints derived from omics data.
  model_type: GENOME_SCALE_METABOLIC
  base_model: Recon3D
  repository_url: https://www.vmh.life/
  publication: PMID:32472720
  notes: Predicts diabetes biomarkers and drug effects across multiple organs
- name: PBPK Model for GLP-1 Receptor Agonists
  description: >
    Physiologically-based pharmacokinetic model for GLP-1 receptor agonists (semaglutide,
    tirzepatide) in T2D patients. Incorporates drug absorption, distribution, and
    receptor
    binding kinetics to optimize dosing regimens.
  model_type: PHYSIOLOGICAL
  notes: Used in clinical trial design and dose optimization for incretin-based therapies
- name: AGORA2 Gut Microbiome Metabolic Models
  description: >
    Collection of 7,302 strain-resolved genome-scale metabolic reconstructions of
    human
    gut microorganisms. Enables personalized microbiome-host metabolic modeling by
    integrating with human metabolic models (Recon3D). Captures strain-level variation
    in SCFA production, bile acid metabolism, and drug biotransformation relevant
    to T2D.
  model_type: GENOME_SCALE_METABOLIC
  repository_url: https://www.vmh.life/
  publication: PMID:36543475
  notes: Nature Biotechnology 2022 - includes drug metabolism capabilities for 98 drugs; enables community-level FBA with MICOM
- name: MICOM Community Metabolic Model
  description: >
    Metagenome-scale modeling framework for simulating metabolic interactions in the
    gut microbiota. Integrates dietary constraints and taxon abundances from metagenomic
    data to predict personalized SCFA production, cross-feeding networks, and metabolic
    fluxes. Applied to T2D to study dysbiosis effects on butyrate production and
    glucose-insulin signaling.
  model_type: GENOME_SCALE_METABOLIC

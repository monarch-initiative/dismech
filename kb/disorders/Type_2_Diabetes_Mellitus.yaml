  evidence:
  - reference: PMID:14679176
    reference_title: Obesity is associated with macrophage accumulation in adipose tissue.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      the percentage of cells expressing the macrophage marker F4/80 (F4/80+) was
      significantly and positively correlated with both adipocyte size and body
      mass
    explanation: >-
      Establishes the macrophage accumulation that defines this node, and scales
      it with adiposity rather than treating it as present or absent.
  - reference: PMID:14679176
    reference_title: Obesity is associated with macrophage accumulation in adipose tissue.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Similar relationships were found in human subcutaneous adipose tissue
      stained for the macrophage antigen CD68.
    explanation: >-
      The human arm of the same study, cited separately so the node does not rest
      on rodent adipose tissue alone.
  - reference: PMID:7678183
    reference_title: 'Adipose expression of tumor necrosis factor-alpha: direct role
      in obesity-linked insulin resistance.'
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      An induction of TNF-alpha messenger RNA expression was observed in adipose
      tissue from four different rodent models of obesity and diabetes.
    explanation: >-
      Supplies the cytokine content of the node across four independent obesity
      and diabetes models, which is what makes it a general feature rather than a
      property of one model.
  - reference: PMID:21633179
    reference_title: Inflammatory links between obesity and metabolic disease.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Adipose tissue insulin resistance and dysfunctional lipid storage in
      adipocytes are sentinel events in the progression toward metabolic
      dysregulation with obesity.
    explanation: >-
      A review placing adipose insulin resistance and disordered lipid storage
      early in the sequence, which is why this node is modeled upstream of the
      systemic Insulin Resistance node rather than as one of its consequences.
  downstream:
  - target: Insulin Resistance
    description: >-
      Macrophage-derived tumor necrosis factor alpha and the accompanying
      cytokines impair insulin action in adipose tissue and, through cytokine and
      fatty acid export, in muscle and liver. The edge is drawn causally because
      the cytokine can be removed and the insulin response recovers.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:7678183
      reference_title: 'Adipose expression of tumor necrosis factor-alpha: direct role
        in obesity-linked insulin resistance.'
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Neutralization of TNF-alpha in obese fa/fa rats caused a significant
        increase in the peripheral uptake of glucose in response to insulin.
      explanation: >-
        An intervention, not an association: removing the cytokine restores
        insulin-stimulated glucose uptake, which is the direction this edge
        asserts.
    - reference: PMID:21633179
      reference_title: Inflammatory links between obesity and metabolic disease.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Over time, ectopic lipid accumulation in muscle, liver, and blood vessels
        activates tissue leukocytes, contributes to organ-specific disease, and
        exacerbates systemic insulin resistance.
      explanation: >-
        Names the route by which a local adipose lesion becomes systemic insulin
        resistance, which is the step this edge crosses.
  - target: Insulin-Stimulated Adipocyte Fatty Acid Uptake via FATP1
    description: >-
      Tumor necrosis factor alpha suppresses both basal and insulin-stimulated
      long-chain fatty acid uptake in adipocytes and lowers FATP1 and FATP4
      protein levels, so the inflamed adipocyte loses the fatty acid arm of the
      insulin response as well as the glucose arm.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:11970897
      reference_title: Insulin causes fatty acid transport protein translocation and
        enhanced fatty acid uptake in adipocytes.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        In contrast, treatment with TNF-alpha inhibited basal and insulin-induced
        LCFA uptake and reduced FATP1 and -4 levels.
      explanation: >-
        The direct measurement behind this edge: the cytokine this node produces
        suppresses the transport step the target node represents, at both the
        activity and the protein level.
- name: Impaired GLUT4-Mediated Glucose Uptake
  description: >
    Dysregulation of GLUT4 trafficking in adipocytes and skeletal muscle reduces
    insulin-stimulated glucose uptake. GULP1 facilitates GLUT4 translocation to
    the plasma membrane by counteracting ACAP1 inhibition of ARF6 activity.
    Reduced GULP1 activity therefore decreases peripheral glucose disposal and
    contributes to systemic insulin resistance.

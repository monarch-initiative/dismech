    description: Reduced beta-cell sensitivity to incretins impairs oral-glucose-stimulated insulin secretion.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:19934000
      reference_title: "TCF7L2 variant rs7903146 affects the risk of type 2 diabetes by modulating incretin action."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This is not due to reduced secretion of GLP-1 and GIP but rather due to the effect of TCF7L2 on the sensitivity of the beta-cell to incretins."
      explanation: Directly supports a TCF7L2-associated incretin-sensitivity defect at the beta cell.
- name: Chronic Hyperglycemia
  description: >-
    Sustained hyperglycemia arising from the combined insulin resistance,
    beta-cell secretory failure, and hepatic glucose overproduction is the shared
    driver of long-term diabetic tissue injury and the entry point to the
    conserved diabetic vascular-complication cascade captured by the
    diabetic_vascular_complications module (chronic hyperglycemia -> oxidative
    and AGE-RAGE stress -> endothelial dysfunction and vascular inflammation ->
    micro- and macrovascular injury -> end-organ complications). In type 2
    diabetes this cascade manifests clinically as diabetic retinopathy,
    neuropathy, nephropathy, and atherosclerotic cardiovascular disease.
  conforms_to: "diabetic_vascular_complications#Chronic Hyperglycemia"
  biological_processes:
  - preferred_term: glucose homeostasis
    term:
      id: GO:0042593
      label: glucose homeostasis
    modifier: ABNORMAL
  downstream:
  - target: Diabetic Retinopathy
    description: >-
      Sustained hyperglycemia drives the microvascular injury that produces
      diabetic retinopathy, one of the shared end-organ complications captured by
      the diabetic_vascular_complications module this node conforms to.
    evidence:
    - reference: PMID:39158206
      reference_title: "Serum biomarkers for predicting microvascular complications of diabetes mellitus."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Diabetic microvascular complications such as retinopathy, nephropathy, and neuropathy are primary causes of blindness, terminal renal failure, and neuropathic disorders in type 2 diabetes mellitus patients."
      explanation: >-
        Supports chronic hyperglycemia driving retinopathy as a microvascular
        end-organ complication in type 2 diabetes.
  - target: Peripheral Neuropathy
    description: >-
      Sustained hyperglycemia drives the microvascular and metabolic nerve injury
      that produces diabetic peripheral neuropathy, another shared end-organ
      complication of the conserved vascular-complication cascade.
    evidence:
    - reference: PMID:39158206
      reference_title: "Serum biomarkers for predicting microvascular complications of diabetes mellitus."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Diabetic microvascular complications such as retinopathy, nephropathy, and neuropathy are primary causes of blindness, terminal renal failure, and neuropathic disorders in type 2 diabetes mellitus patients."
      explanation: >-
        Supports chronic hyperglycemia driving neuropathy as a microvascular
        end-organ complication in type 2 diabetes.
  evidence:
  - reference: PMID:29939616
    reference_title: "Insulin Resistance."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "This vicious cycle continues until pancreatic beta-cell activity can no longer adequately meet the insulin demand created by insulin resistance, resulting in hyperglycemia."
    explanation: >-
      Supports sustained hyperglycemia arising from beta-cell failure to
      compensate for insulin resistance, the shared trigger that feeds the
      diabetic vascular-complication cascade.
mechanistic_hypotheses:
- hypothesis_group_id: pgs_context_amplification
  hypothesis_label: Amplification of polygenic T2D risk in adverse metabolic contexts via shared insulin-resistance convergence
  status: EMERGING
  description: >-
    Polygenic-score-by-context (PGS×C) interactions reported for type 2 diabetes
    in the UK Biobank appear to reflect amplification rather than
    context-specific causal variants: the same susceptibility loci (e.g. TCF7L2,
    PPARG, KCNJ11, SLC30A8) exert systematically larger effects in
    disease-promoting metabolic contexts. This entry proposes that the
    amplification arises because polygenic liability and adverse exposures
    converge on the shared Insulin Resistance node (with Beta Cell Dysfunction as
    a parallel target), so their joint effect on the liability-threshold scale is
    super-additive rather than additive. Nagpal & Gibson (Nat Genet 2026,
    PMID:42443528) highlight the interaction between reduced
    polyunsaturated fatty acids (low omega-6) and high glucose, which elevates
    T2D risk increasingly as the PGS rises, and identify sex and sex-adjusted
    testosterone as further amplifying contexts.
  evidence:
  - reference: PMID:42443528
    reference_title: "Pervasive interactions between exposures and polygenic risk can inform more effective clinical and behavioral interventions."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: The predominant mechanism for PGS×C is the amplification of genetic effects in adverse contexts, such as low polyunsaturated fatty acids or social determinants of ill health
    explanation: >-
      Direct source (Nagpal & Gibson 2026): across seven UK Biobank diseases and
      75 contexts, amplification of genetic effects in adverse contexts is
      identified as the predominant mechanism of PGS×context interaction — the
      mechanism applied in this hypothesis.
  - reference: PMID:37228747
    reference_title: "Amplification is the primary mode of gene-by-sex interaction in complex human traits."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: GxSex is pervasive but acts primarily through systematic sex differences in the magnitude of many genetic effects
    explanation: >-
      Establishes amplification — systematic differences in the magnitude of
      polygenic effects rather than in the identity of causal variants — as the
      primary mode of gene-by-sex interaction across physiological traits, and
      notes that testosterone may mediate this amplification. Cited as general
      support for amplification as a mode of PGS×context interaction; the paper
      is not T2D-specific.
  notes: >-
    EMERGING hypothesis motivated by population-scale PGS×context analyses
    (primary source PMID:42443528; general amplification mechanism corroborated
    by PMID:37228747, which documents testosterone-mediated amplification). The
    convergence claim (polygenic liability + adverse metabolic context → Insulin
    Resistance) is a mechanistic interpretation and is not itself established as
    causal — see the reverse-causation knowledge gap under discussions.

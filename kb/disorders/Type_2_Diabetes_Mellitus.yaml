  - name: Plasma_Insulin
    dataset_identifier: I
    description: >-
      Plasma insulin concentration at steady state. Elevated in the compensated
      insulin-resistant regime and near-zero after glucotoxic beta-cell-mass
      collapse.
    unit: uU/mL
    mappings_list:
    - preferred_term: Hyperinsulinemia
      description: >-
        Compensatory hyperinsulinemia in the insulin-resistant regime before

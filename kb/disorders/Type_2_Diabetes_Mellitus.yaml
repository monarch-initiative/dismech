biochemical:
- name: Myeloid Lineage Plasma Proteomic Age Gap
  biomarker_term:
    preferred_term: myeloid lineage plasma proteomic aging clock (age gap)
    term:
      id: NCIT:C97139
      label: Proteomic Profile
  presence: Elevated
  context: >-
    Blood-based cell-type-specific aging clock. Plasma proteins are mapped to
    their putative cell of origin using Human Protein Atlas single-cell
    transcriptomic data, and a machine-learning model estimates myeloid lineage
    biological age; the age gap is the difference between that estimate and
    chronological age. "Extreme" agers are those in the upper tail of the age-gap
    distribution.
  cell_types:
  - preferred_term: Myeloid lineage cell
    term:
      id: CL:0000763
      label: myeloid cell
  notes: >-
    Myeloid lineage aging was the strongest cellular-aging predictor of incident
    type 2 diabetes in UK Biobank (HR 3.88, 95% CI 3.33-4.52) and remained
    significant after adjustment for established risk factors including HbA1c,
    BMI, smoking and renal function. Its distinctive value is that it stratified
    risk among people who were still normoglycemic, so it identifies future cases
    before the glycemic measures used to diagnose them move. Type 1 diabetes and
    other specified diabetes were excluded from the incidence analysis. This is
    an observational prognostic association; the islet-inflammation reading below
    is the authors' mechanistic interpretation, not something the clock measures.
  evidence:
  - reference: PMID:42297981
    reference_title: "Plasma proteomic signatures of cellular aging predict human disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: myeloid lineage extreme aging demonstrated the strongest prognostic value
    explanation: >-
      Establishes myeloid lineage aging as the leading cellular-aging predictor
      of incident type 2 diabetes among the cell types tested.
  - reference: PMID:42297981
    reference_title: "Plasma proteomic signatures of cellular aging predict human disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: myeloid lineage aging identified normoglycemic individuals at higher type 2 diabetes risk
    explanation: >-
      States the clinically distinctive claim: risk stratification before
      glycemic criteria are met, which is what would make the marker useful for
      targeted surveillance.
  readouts:
  - target: Beta Cell Dysfunction
    relationship: PREDICTS
    direction: POSITIVE
    endpoint_context: PROGNOSTIC
    interpretation: >-
      An elevated myeloid lineage age gap predicts incident type 2 diabetes in
      still-normoglycemic individuals, and is read against beta cell dysfunction
      via the proposed route of myeloid-derived cytokines inflaming the islet
      microenvironment. The prognostic association is measured; the islet route
      is inference and should not be curated as an established causal edge.
    evidence:
    - reference: PMID:42297981
      reference_title: "Plasma proteomic signatures of cellular aging predict human disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: consistent with a role of myeloid-derived cytokines in the initiation of an inflamed pancreatic islet microenvironment and increased susceptibility to type 2 diabetes
      explanation: >-
        The authors' stated mechanistic rationale linking the myeloid aging
        signature to the islet compartment, offered as consistency rather than
        as demonstrated causation.
- name: NMR metabolomic risk score (MetRS)
  specificity: >
    A research composite, not a clinical assay. MetRS is a machine-learning
    score built from the top 30 of 313 Nightingale Health NMR plasma measures,
    derived and replicated in UK Biobank. It is not validated for clinical use
    and does not replace fasting glucose or HbA1c.
  context: >
    In the UK Biobank metabolome-phenome atlas, MetRS classified prevalent type
    2 diabetes with an area under the curve of 0.941 and predicted incident
    diabetic complications, including diabetic maculopathy (0.921), diabetic
    kidney failure (0.919) and type 2 diabetes with peripheral circulatory
    complications (0.913). No presence value is recorded because MetRS is a
    derived multi-analyte score rather than a measured analyte. Two limits
    matter for interpretation: the score is trained and tested in a single,
    predominantly European-ancestry volunteer cohort, and a high classification
    area under the curve for prevalent disease partly reflects the metabolic
    consequences of established diabetes rather than antecedent risk.
  readouts:
  - target: Chronic Hyperglycemia
    relationship: CORRELATES_WITH
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >
      The lipid, amino-acid and glycolysis-related measures that dominate MetRS
      shift with sustained hyperglycemia and insulin resistance, so the score
      reads out the systemic metabolic state rather than any single mechanism.
  evidence:
  - reference: PMID:40973818
    reference_title: "Mapping the plasma metabolome to human health and disease in 274,241 adults."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "MetRS offered favourable diagnostic and predictive performance, particularly in T2D"
    explanation: >
      Names type 2 diabetes as one of the conditions in which the
      machine-learning metabolomic risk score performed best, both for
      classification of prevalent disease and for prediction of incident
      disease.
  - reference: PMID:40973818
    reference_title: "Mapping the plasma metabolome to human health and disease in 274,241 adults."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "The MetRS witnessed excellent diagnosis for type 1 diabetes (T1D; AUC = 0.944), T2D (AUC = 0.941), diabetic maculopathy (AUC = 0.940) and chronic kidney disease (CKD; AUC = 0.933)."
    explanation: >
      Quotes the prevalent-disease classification figure of 0.941 for type 2
      diabetes that the context field reports.
  - reference: PMID:40973818
    reference_title: "Mapping the plasma metabolome to human health and disease in 274,241 adults."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "the MetRS excellently predicted future diabetic complications, for example, diabetic maculopathy (AUC = 0.921 (95% CI, 0.914-0.928)), diabetic kidney failure (AUC = 0.919 (0.906-0.930)) and type 2 diabetes (T2D) with peripheral circulatory complications (AUC = 0.913 (0.898-0.926))."
    explanation: >
      Quotes all three incident-complication figures reported in the context
      field, so the predictive claim and its numbers both rest on source text.

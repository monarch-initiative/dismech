    explanation: States the African-ancestry estimate.
  - reference: PMID:33073460
    reference_title: "c.451dupT in KLKB1 is common in Nigerians, confirming a higher prevalence of severe prekallikrein deficiency in Africans compared to Europeans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study underlines the higher prevalence of PK deficiency among people with African descent compared to Europeans."
    explanation: >-
      Genotyping of two population collectives supports the ancestry difference
      independently of the database-derived estimate.
- population: Reported cases in the literature
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    111 cases from 89 families had been assembled as of 2020, including gray
    literature. Because the deficiency is asymptomatic, the case count is a
    floor on occurrence rather than a measure of it.
  evidence:
  - reference: PMID:32202057
    reference_title: "Severe plasma prekallikrein deficiency: Clinical characteristics, novel KLKB1 mutations, and estimated prevalence."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We assembled a cohort of 111 cases from 89 families and performed new genetic analyses in eight families (three unpublished)."
    explanation: The size of the assembled literature cohort.

pathophysiology:
- name: KLKB1 Biallelic Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Homozygous or compound heterozygous KLKB1 variants abolish production of
    functional prekallikrein. The reported spectrum is dominated by truncating
    alleles, with nonsense, frameshift and missense classes all represented and
    a concentration in the exons encoding the catalytic domain. Missense alleles
    act by two routes: some prevent secretion of the protein, while others leave
    a circulating but non-functional molecule.
  genes:
  - preferred_term: KLKB1
    term:
      id: hgnc:6371
      label: KLKB1
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  molecular_functions:
  - preferred_term: plasma kallikrein serine protease activity
    modifier: DECREASED
    term:
      id: GO:0004252
      label: serine-type endopeptidase activity
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:29165051
    reference_title: A structure-function analysis in patients with prekallikrein deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The total number of missense mutation was 10, together with 3 stop codons and 2 insertions. These mutations involved mainly exons 11 and 14."
    explanation: The variant classes and their distribution across all molecularly studied families at the time.
  - reference: PMID:19404525
    reference_title: "[Severe prekallikrein deficiency due to a compound heterozygosis in the KLKB1-gene]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The prekallikrein deficiency results from two mutations in the KLKB 1-gene: first, an insertion of 1 bp in codon 149 in exon 5 and, second, a base exchange Cys 548 (TGC) > Tyr (TAC) in exon 14."
    explanation: A worked compound-heterozygous genotype, with each allele traced to one parent.
  downstream:
  - target: Plasma Prekallikrein Deficiency
    causal_link_type: DIRECT
    description: >-
      Loss of functional KLKB1 product removes prekallikrein activity from
      plasma. In the usual quantitative defect the antigen falls with it.
    evidence:
    - reference: PMID:15461630
      reference_title: Severe prekallikrein deficiency associated with homozygosity for an Arg94Stop nonsense mutation.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Plasma prekallikrein (PK) activity and antigen were <5 u/dL. Molecular analysis showed a homozygous Arg94Stop substitution in the PK gene, predicted to prevent expression of the mutant allele."
      explanation: >-
        Links the genotype to the plasma state in one patient, with a nonsense
        allele predicted to prevent expression and both activity and antigen
        absent.

- name: Plasma Prekallikrein Deficiency
  biological_scale: MOLECULAR
  description: >-
    Plasma prekallikrein activity is absent or near-absent. This is the measured
    biochemical state that defines the disease, and in most patients it is the
    only abnormality that can be found. Immunological testing splits the
    deficiency in two: cross-reactive-material-negative cases, roughly 70 per
    cent of the total, have no detectable antigen, while
    cross-reactive-material-positive cases carry a non-functional molecule at
    reduced but measurable concentration.
  genes:
  - preferred_term: KLKB1
    term:
      id: hgnc:6371
      label: KLKB1
  evidence:
  - reference: PMID:6792540
    reference_title: "Heterogeneity of human prekallikrein deficiency (Fletcher trait): evidence that five of 18 cases are positive for cross-reacting material."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In the five other subjects, however, nonfunctional material immunologically indistinguishable from normal prekallikrein was detected by radioimmunoassays at concentrations of 13 to 30 per cent (CRM+ variant)."
    explanation: >-
      Establishes the cross-reactive-material-positive class, in which antigen
      is present and non-functional rather than absent.
  - reference: PMID:21091145
    reference_title: Congenital prekallikrein deficiency.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Immunological studies allow differentiation into two types, namely cases of true deficiency, which are approximately 70% of the total, and cases with abnormal forms."
    explanation: The proportion of the two immunological classes across the reported literature.
  - reference: PMID:3487556
    reference_title: "Characterization of a variant prekallikrein, prekallikrein Long Beach, from a family with mixed cross-reacting material-positive and cross-reacting material-negative prekallikrein deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The variant was cleaved by beta-Factor XIIa 200 times slower than the normal molecule, and no amidolytic activity was detected for the cleaved variant."
    explanation: >-
      How a cross-reactive-material-positive molecule fails: it is a poor
      substrate for factor XIIa and has no activity even once cleaved.
  downstream:
  - target: Severely Reduced Plasma Prekallikrein Activity
    causal_link_type: DIRECT
    description: >-
      The laboratory phenotype is the direct measurement of this plasma state,
      by coagulant activity and by antigen.
    evidence:
    - reference: PMID:42454615
      reference_title: "Normal thromboelastography with a markedly prolonged activated partial thromboplastin time in severe prekallikrein deficiency: Implications for perioperative hemostatic assessment."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Western immunoblotting showed absent PK antigen, establishing cross-reactive material-negative PK deficiency."
      explanation: The measurement step from plasma state to recorded phenotype, here by immunoblot.
  - target: Loss of Kallikrein Feedback Activation of Factor XII
    causal_link_type: DIRECT
    description: >-
      Kallikrein is the enzyme that activates further factor XII, so without the
      zymogen there is no kallikrein to close that loop.
    evidence:
    - reference: PMID:11344577
      reference_title: "Fletcher factor deficiency. A diminished rate of Hageman factor activation caused by absence of prekallikrein with abnormalities of coagulation, fibrinolysis, chemotactic activity, and kinin generation."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "It is the absence of this feedback in Fletcher factor-deficient plasma that accounts for the diminished rate of activation of Hageman factor and therefore a diminished rate of activation of the coagulation and fibrinolytic pathways."
      explanation: >-
        States this edge directly, in the reconstitution experiments that
        identified Fletcher factor as prekallikrein.
  - target: Reduced Kallikrein-Dependent Bradykinin Generation
    causal_link_type: DIRECT
    description: >-
      Kallikrein is also the protease that cleaves high-molecular-weight
      kininogen, so deficient plasma cannot release bradykinin on contact
      activation.
    evidence:
    - reference: PMID:4762550
      reference_title: Prekallikrein deficiency in man.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The plasma failed to generate kinin upon exposure to kaolin, a defect which was also corrected by addition of prekallikrein."
      explanation: >-
        The defect and its correction by the purified protein, which is what
        attributes the lost kinin generation to prekallikrein itself.
  - target: Diminished Surface-Activated Fibrinolysis In Vitro
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Kallikrein activates pro-urokinase and contributes to contact-activated
      plasmin generation, so deficient plasma lyses fibrin more slowly after
      surface activation. The intermediates are the urokinase and plasminogen
      activation steps.
    evidence:
    - reference: PMID:4762550
      reference_title: Prekallikrein deficiency in man.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The formation of plasmin in dilute, acidified plasma incubated with kaolin was also abnormal in Fletcher factor-deficient plasma. Plasmin generation was normalized by addition of prekallikrein or small quantities of Hageman factor-deficient plasma."
      explanation: The fibrinolytic arm of the same reconstitution experiment.

- name: Loss of Kallikrein Feedback Activation of Factor XII
  biological_scale: MOLECULAR
  description: >-
    On a negatively charged surface, factor XII first autoactivates, converts
    prekallikrein to kallikrein, and kallikrein then activates much more factor
    XII. That reciprocal step is the amplifier of the contact phase, and it is
    what prekallikrein deficiency removes.
  biological_processes:
  - preferred_term: Factor XII activation
    modifier: DECREASED
    term:
      id: GO:0002542
      label: Factor XII activation
  evidence:
  - reference: PMID:11344577
    reference_title: "Fletcher factor deficiency. A diminished rate of Hageman factor activation caused by absence of prekallikrein with abnormalities of coagulation, fibrinolysis, chemotactic activity, and kinin generation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Although the Hageman factor-dependent pathways appear to be initiated by contact activation of Hageman factor, the kallikrein generated activates more Hageman factor; this feedback is necessary for the Hageman factor-dependent pathways to proceed at a normal rate."
    explanation: >-
      States both halves of this node: factor XII starts the process, and
      kallikrein feedback is what makes it run at a normal rate.
  - reference: PMID:42454615
    reference_title: "Normal thromboelastography with a markedly prolonged activated partial thromboplastin time in severe prekallikrein deficiency: Implications for perioperative hemostatic assessment."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: "PK is converted to kallikrein by FXIIa, and kallikrein in turn activates additional FXII, amplifying the contact process"
    explanation: >-
      The reciprocal step stated as established contact-system biology. The
      quoted sentence describes surface-activation biochemistry and sits in the
      introduction of a case report rather than being that report's own result.
  downstream:
  - target: Rate-Limited Factor XII Autoactivation as the Sole Contact Trigger
    causal_link_type: DIRECT
    description: >-
      With the amplifier gone, surface autoactivation of factor XII is the only
      way into the pathway, which makes contact activation slow rather than
      absent.
    evidence:
    - reference: PMID:12091043
      reference_title: "Prekallikrein deficiency: the characteristic normalization of the severely prolonged aPTT following increased preincubation time is due to autoactivation of factor XII."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Autoactivation of FXII in PK-deficient plasma in the presence of kaolin paralleled the normalization of aPTT."
      explanation: >-
        Shows the remaining route carrying the pathway in deficient plasma: the
        clotting time recovers as factor XII autoactivates.

- name: Rate-Limited Factor XII Autoactivation as the Sole Contact Trigger
  biological_scale: MOLECULAR
  description: >-
    Contact activation still happens, but only as fast as factor XII can
    autoactivate on the surface. The whole laboratory picture follows from this
    being a kinetic defect rather than an absolute one. In the standard aPTT,
    with its brief preincubation, too little factor XIIa has formed and the
    clotting time is grossly prolonged. Extending the preincubation lets
    autoactivation proceed and the aPTT shortens towards normal, a behaviour
    seen in prekallikrein-deficient plasma and not in plasma deficient in factor
    XII, high-molecular-weight kininogen or factor XI, and abolished by an
    antibody against activated factor XII.
  biological_processes:
  - preferred_term: "blood coagulation, intrinsic pathway"
    modifier: DECREASED
    term:
      id: GO:0007597
      label: "blood coagulation, intrinsic pathway"
  evidence:
  - reference: PMID:12091043
    reference_title: "Prekallikrein deficiency: the characteristic normalization of the severely prolonged aPTT following increased preincubation time is due to autoactivation of factor XII."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We conclude that the normalization of a severely prolonged aPTT upon increased preincubation time (PIT), characteristic of PK deficiency, is due to FXII autoactivation."
    explanation: Attributes the time-dependent correction to the residual autoactivation route.
  - reference: PMID:12091043
    reference_title: "Prekallikrein deficiency: the characteristic normalization of the severely prolonged aPTT following increased preincubation time is due to autoactivation of factor XII."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Addition of OT-2, a monoclonal antibody inhibiting activated FXII, prevented the normalization of aPTT."
    explanation: >-
      The blocking experiment that identifies factor XIIa, rather than some
      other protease, as the enzyme carrying the recovery.
  - reference: PMID:40125216
    reference_title: A Case of Severe Prekallikrein Deficiency Manifesting as Isolated Activated Partial Thromboplastin Time (aPTT) Prolongation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: "Factor XII is able to autoactivate without the presence of kallikrein"
    explanation: >-
      The autoactivation property itself, which is biochemistry rather than a
      clinical observation, stated as established background in a case report
      where it is given as the reason patients do not bleed.
  downstream:
  - target: Prolonged Partial Thromboplastin Time
    causal_link_type: DIRECT
    description: >-
      The aPTT reagent initiates clotting by contact activation, so an assay
      that depends on the rate of factor XII activation is prolonged when the
      kallikrein amplifier is missing.
    evidence:
    - reference: PMID:12091043
      reference_title: "Prekallikrein deficiency: the characteristic normalization of the severely prolonged aPTT following increased preincubation time is due to autoactivation of factor XII."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Normalization of a severely increased aPTT (>120 s) after prolonged preincubation with aPTT reagent occurred in plasma deficient in PK but not in plasma deficient in factor XII (FXII), high-molecular-weight kininogen (HK), factor XI (FXI), factor IX, factor VIII, Passovoy trait plasma or plasma containing lupus anticoagulant."
      explanation: >-
        Ties the prolonged aPTT and its time dependence to prekallikrein
        specifically, by showing no other contact-factor deficiency behaves this
        way.
  - target: Hemostasis Preserved Despite the Contact Defect
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Because factor XII still autoactivates, factor XI and factor IX are still
      reached and thrombin is still generated in vivo. The known intermediates
      are the factor XI and factor IX activation steps.
    evidence:
    - reference: PMID:40125216
      reference_title: A Case of Severe Prekallikrein Deficiency Manifesting as Isolated Activated Partial Thromboplastin Time (aPTT) Prolongation.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: "Because patients with prekallikrein deficiency have preserved auto-activation of factor XII, they rarely manifest with increased bleeding risk or thrombotic risk."
      explanation: >-
        States this edge: the preserved autoactivation route is given as the
        reason the clinical phenotype is empty.

- name: Hemostasis Preserved Despite the Contact Defect
  biological_scale: ORGANISM
  description: >-
    Thrombin generation after injury is unaffected, both because the tissue
    factor and factor VIIa route is untouched and because the contact pathway
    is slowed rather than blocked. Patients come through major operations
    without hemostatic support, and whole-blood viscoelastic testing, which also
    depends on contact activation, can be entirely normal in the same patient
    whose plasma aPTT is doubled or tripled. This node is why an alarming
    laboratory value has no hemorrhagic consequence.
  biological_processes:
  - preferred_term: tissue factor and factor VIIa initiated coagulation, unaffected
    term:
      id: GO:0007598
      label: "blood coagulation, extrinsic pathway"
  evidence:
  - reference: PMID:42454615
    reference_title: "Normal thromboelastography with a markedly prolonged activated partial thromboplastin time in severe prekallikrein deficiency: Implications for perioperative hemostatic assessment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Severe PK deficiency may markedly prolong the plasma-based aPTT without parallel abnormalities on TEG 6s, highlighting assay-specific differences in sensitivity to PK deficiency."
    explanation: >-
      The dissociation this node records, measured in one patient with two
      assays rather than inferred from the absence of symptoms.
  - reference: PMID:42454615
    reference_title: "Normal thromboelastography with a markedly prolonged activated partial thromboplastin time in severe prekallikrein deficiency: Implications for perioperative hemostatic assessment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient underwent surgery without hemostatic complications or transfusion."
    explanation: The clinical end point of the same case.
  - reference: PMID:39720820
    reference_title: Rare Prekallikrein Deficiency Identified During Workup of Isolated Prolonged Activated Partial Thromboplastin Time.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "However, a contact factor (ie, factor XII, prekallikrein, and high molecular weight kininogen) deficiency, which may also cause a prolonged aPTT, is not associated with clinical bleeding."
    explanation: >-
      The general clinical position, stated as background in a case report: the
      contact factors as a group are bleeding-silent.

- name: Reduced Kallikrein-Dependent Bradykinin Generation
  biological_scale: MOLECULAR
  description: >-
    Kallikrein liberates bradykinin from high-molecular-weight kininogen, so
    deficient plasma generates none on contact activation and prekallikrein-null
    mice have reduced circulating bradykinin. No clinical phenotype in deficient
    humans has been established for this arm, and bradykinin generation in vivo
    is clearly not abolished: a patient with complete absence of plasma
    prekallikrein developed angiotensin-converting-enzyme-inhibitor angioedema,
    which is bradykinin-mediated, so other enzymes including factor XIIa,
    plasmin and tissue kallikreins can supply kinin. The weight of this arm is
    instead established from the opposite direction, because inhibiting
    kallikrein or lowering prekallikrein treats bradykinin-mediated hereditary
    angioedema.
  biological_processes:
  - preferred_term: plasma kallikrein-kinin cascade
    modifier: DECREASED
    term:
      id: GO:0002353
      label: plasma kallikrein-kinin cascade
  - preferred_term: bradykinin biosynthetic process
    modifier: DECREASED
    term:
      id: GO:0002936
      label: bradykinin biosynthetic process
  evidence:
  - reference: PMID:11344577
    reference_title: "Fletcher factor deficiency. A diminished rate of Hageman factor activation caused by absence of prekallikrein with abnormalities of coagulation, fibrinolysis, chemotactic activity, and kinin generation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Fletcher factor-deficient plasma is deficient in prekallikrein and therefore generates no bradykinin upon activation with kaolin."
    explanation: The in vitro form of this node, in patient plasma.
  - reference: PMID:25339356
    reference_title: "Reduced thrombosis in Klkb1-/- mice is mediated by increased Mas receptor, prostacyclin, Sirt1, and KLF4 and decreased tissue factor."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "Klkb1(-/-) mice have reduced plasma BK levels and renal B2R mRNA."
    explanation: >-
      The same reduction measured in circulating plasma rather than in an assay
      tube; indirect for humans because it is a mouse measurement.
  - reference: PMID:31984307
    reference_title: Lisinopril-Induced Angioedema in a Patient with Plasma Prekallikrein Deficiency.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Occurrence of angioedema in a patient with complete deficiency of plasma prekallikrein shows other possible enzymes capable of liberating bradykinin such as factor XIIa, plasmin, or tissue kallikreins may also play a role in generating bradykinin during ACE inhibitor therapy"
    explanation: >-
      Contradicts any reading of this node as abolished bradykinin generation in
      vivo: a bradykinin-mediated event occurred in a patient with no detectable
      prekallikrein.
  downstream:
  - target: Reduced Kallikrein-Driven Thromboinflammation in Model Systems
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      In mice, the lower bradykinin tone that follows prekallikrein deletion
      runs through compensating vasoprotective signalling, with increased Mas
      receptor expression and plasma prostacyclin, and ends in delayed arterial
      thrombosis.
    evidence:
    - reference: PMID:25339356
      reference_title: "Reduced thrombosis in Klkb1-/- mice is mediated by increased Mas receptor, prostacyclin, Sirt1, and KLF4 and decreased tissue factor."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "This pathway arises when bradykinin delivery to vasculature is compromised and mediated by increased receptor Mas, prostacyclin, Sirt1, and KLF4, leading to reduced vascular TF."
      explanation: >-
        States the route from compromised bradykinin delivery to the
        antithrombotic phenotype, which is the intermediate chain this edge
        asserts.
  - target: Hypertension
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - pk_bradykinin_vascular_tone
    description: >-
      Proposed, not established. Bradykinin is a vasodilator, so losing its
      kallikrein-dependent production has been offered as the reason reported
      patients carry an excess of hypertension. No study has measured blood
      pressure against bradykinin or kinin-receptor signalling in deficient
      patients, and prekallikrein-null mice are normotensive, so the
      intermediates are unknown and the edge belongs to the hypothesis group
      rather than to the established chain.
    evidence:
    - reference: PMID:25075649
      reference_title: "The old and the new in prekallikrein deficiency: historical context and a family from Argentina with PK deficiency due to a new mutation (Arg541Gln) in exon 14 associated with a common polymorphysm (Asn124Ser) in exon 5."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: "The significance of the presence of hypertension in the two homozygotes is discussed in view of the extra coagulation effects of PK on vasodilation, vessel permeability, and the control of blood pressure."
      explanation: >-
        The proposal itself, attached to two homozygous patients with essential
        hypertension. Indirect because the paper reasons from prekallikrein's
        known vascular effects rather than measuring the step.
    - reference: PMID:22398951
      reference_title: "Effects of plasma kallikrein deficiency on haemostasis and thrombosis in mice: murine ortholog of the Fletcher trait."
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: "Blood pressure and heart rate were normal in plasma kallikrein-deficient mice"
      explanation: >-
        The murine counterpart of the disease shows no blood-pressure phenotype,
        which argues against a simple loss-of-vasodilation account.

- name: Reduced Kallikrein-Driven Thromboinflammation in Model Systems
  biological_scale: TISSUE
  description: >-
    Prekallikrein-null mice are protected across thrombotic and
    thromboinflammatory challenges while bleeding essentially normally: arterial
    occlusion is delayed or prevented, and protection extends to models far from
    coagulation, including brain edema in experimental cerebral malaria and
    atherosclerotic plaque development. This node is a model-system claim and is
    named as one, because the corresponding human protection has not been
    demonstrated. Patients with the deficiency are not protected from
    thrombosis, which is recorded as an open question rather than resolved here.
  cell_types:
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  biological_processes:
  - preferred_term: "blood coagulation, intrinsic pathway"
    modifier: DECREASED
    term:
      id: GO:0007597
      label: "blood coagulation, intrinsic pathway"
  evidence:
  - reference: PMID:22398951
    reference_title: "Effects of plasma kallikrein deficiency on haemostasis and thrombosis in mice: murine ortholog of the Fletcher trait."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These studies confirm and extend studies with prekallikrein ASO, and demonstrate that plasma kallikrein deletion prevents occlusive thrombus formation in mice with a minimal role in provoked bleeding."
    explanation: The dissociation of thrombosis from hemostasis in the knockout.
  - reference: PMID:26950760
    reference_title: A comparison of the effects of factor XII deficiency and prekallikrein deficiency on thrombus formation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "PK-deficient mice were resistant at 3.5% FeCl3 and partially resistant at 5% FeCl3."
    explanation: >-
      Quantifies the protection and shows it is stimulus-strength dependent,
      from the study that compared it head to head with factor XII deficiency.
  - reference: PMID:42446942
    reference_title: Bradykinin contributes to vasogenic edema in murine experimental cerebral malaria.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Prekallikrein-null (Klkb1-/-), prolylcarboxypeptidase hypomorph (Prcpgt/gt), and brain endothelial cell conditional KO of PRCP (Prcpfl/fl Cre) mice with ECM had reduced neurologic deterioration and brain edema."
    explanation: >-
      Protection in a thromboinflammatory model with no coagulation end point,
      which is why this node is about more than thrombus formation.
  - reference: PMID:35189703
    reference_title: Ablation of Plasma Prekallikrein Decreases Low-Density Lipoprotein Cholesterol by Stabilizing Low-Density Lipoprotein Receptor and Protects Against Atherosclerosis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Ablation of Klkb1 slowed the progression of atherosclerosis in mice on Apoe-deficient background."
    explanation: >-
      Protection from atherosclerosis in a further model, through a
      lipid-receptor mechanism rather than through the contact cascade. It points
      the opposite way from the cardiovascular excess reported in patients.

- name: Diminished Surface-Activated Fibrinolysis In Vitro
  biological_scale: MOLECULAR
  description: >-
    Kaolin-activated plasmin generation and fibrinolysis are slow in deficient
    plasma and correct on adding prekallikrein, because kallikrein activates
    pro-urokinase and contributes to contact-dependent plasminogen activation.
    In patients, reported fibrinolysis has been normal or defective rather than
    consistently impaired, and testing of one deficient sibling concluded that
    prekallikrein is not important for fibrinolysis in vivo, where tissue and
    vessel-wall activators do the work. The node is therefore kept as an in
    vitro finding and no clinical consequence is claimed for it.
  biological_processes:
  - preferred_term: fibrinolysis
    modifier: DECREASED
    term:
      id: GO:0042730
      label: fibrinolysis
  evidence:
  - reference: PMID:11344577
    reference_title: "Fletcher factor deficiency. A diminished rate of Hageman factor activation caused by absence of prekallikrein with abnormalities of coagulation, fibrinolysis, chemotactic activity, and kinin generation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "It also possesses a diminished rate of kaolin-activable coagulation and fibrinolysis and possesses a defect in kaolin-activable chemotactic activity."
    explanation: The in vitro fibrinolytic defect in deficient plasma.
  - reference: PMID:21091145
    reference_title: Congenital prekallikrein deficiency.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Kallikrein can mainly affect the formation of bradykinin from high-molecular-weight kininogen and the activation of pro-urokinase to urokinase."
    explanation: The enzymatic step through which kallikrein reaches fibrinolysis.
  - reference: PMID:3849258
    reference_title: "Multiple cerebral thrombosis in Fletcher factor (prekallikrein) deficiency: a case report."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Prekallikrein deficiency is found not to be important in normal in vivo fibrinolysis, which possibly operates via tissue or vessel wall fibrinolytic activator release."
    explanation: >-
      Refutes extending this node from the test tube to the patient, using
      sensitive fibrinolysis assays in a deficient sibling.

phenotypes:
- name: Severely Reduced Plasma Prekallikrein Activity
  category: Hematologic
  frequency: OBLIGATE
  description: >-
    Plasma prekallikrein coagulant activity is severely reduced, typically
    reported as under 1 to 5 per cent of normal, and this is the finding that
    defines the disease. Antigen falls in parallel in the
    cross-reactive-material-negative form and is present but non-functional in
    the cross-reactive-material-positive form, so antigen alone does not
    exclude the diagnosis. The bound HPO term names the concentration, while
    activity is the measurement actually used.
  phenotype_term:
    preferred_term: Decreased circulating prekallikrein concentration
    term:
      id: HP:0034371
      label: Decreased circulating prekallikrein concentration
  evidence:
  - reference: PMID:12091043
    reference_title: "Prekallikrein deficiency: the characteristic normalization of the severely prolonged aPTT following increased preincubation time is due to autoactivation of factor XII."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hereditary PK deficiency was demonstrated by very low PK values in the propositus (PK clotting activity 5%, PK amidolytic activity 5%, PK antigen 2% of normal plasma, respectively) and half normal PK values in his children."
    explanation: >-
      The three measurements that establish the phenotype in a proband, with the
      intermediate values in heterozygous children.
  - reference: PMID:19404525
    reference_title: "[Severe prekallikrein deficiency due to a compound heterozygosis in the KLKB1-gene]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As the cause for the prolonged aPTT we identified a severe prekallikrein deficiency (prekallikrein activity < 1%)."
    explanation: An independent proband at the lower end of the reported activity range.
- name: Prolonged Partial Thromboplastin Time
  category: Hematologic
  frequency: OBLIGATE
  description: >-
    Isolated, markedly prolonged aPTT with a normal prothrombin time and
    thrombin time. Values in the patients cited here run from about 87 to 146
    seconds against upper reference limits near 35 seconds. It corrects fully on mixing with
    normal plasma, which separates a factor deficiency from an inhibitor, and it
    shortens on prolonged preincubation with the contact activator, which is the
    feature that points to prekallikrein rather than to another contact factor.
  phenotype_term:
    preferred_term: Prolonged partial thromboplastin time
    term:
      id: HP:0003645
      label: Prolonged partial thromboplastin time
  evidence:
  - reference: PMID:32202057
    reference_title: "Severe plasma prekallikrein deficiency: Clinical characteristics, novel KLKB1 mutations, and estimated prevalence."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Severe plasma prekallikrein (PK) deficiency is an autosomal-recessive defect characterized by isolated activated partial thromboplastin time prolongation."
    explanation: >-
      The largest assembled cohort states this as the defining feature, which
      supports the obligate frequency.
  - reference: PMID:42454615
    reference_title: "Normal thromboelastography with a markedly prolonged activated partial thromboplastin time in severe prekallikrein deficiency: Implications for perioperative hemostatic assessment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient had a markedly prolonged aPTT (87.4 s, reference range [RR]: 24.5-34.0 s) with normal PT, thrombin time, and a negative anti-factor Xa assay."
    explanation: A measured example, with the normal prothrombin and thrombin times that make it isolated.
  - reference: PMID:21091145
    reference_title: Congenital prekallikrein deficiency.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The long partial thromboplastin time is fully corrected by the addition of normal plasma or normal serum and presents the unusual feature of shortening on long incubation times."
    explanation: The two behaviours of the prolonged clotting time that the diagnosis rests on.
- name: Abnormal Bleeding
  category: Hematologic
  frequency: VERY_RARE
  description: >-
    Not a feature of the disease, and the frequency band records the measured
    residue rather than an attributable phenotype. In the assembled cohort of
    111 cases, 4 major bleeding events occurred among 96 individuals, three of
    them provoked, for a prevalence of 4 per cent and an annualized rate of 0.1
    per cent, which is in the range expected in an unselected population.
    Molecularly confirmed series report no bleeding at all beyond isolated
    epistaxis in one proband, and no reported patient has needed hemostatic
    support for surgery on account of the deficiency.
  phenotype_term:
    preferred_term: Abnormal bleeding
    term:
      id: HP:0001892
      label: Abnormal bleeding
  evidence:
  - reference: PMID:32202057
    reference_title: "Severe plasma prekallikrein deficiency: Clinical characteristics, novel KLKB1 mutations, and estimated prevalence."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Four major bleeding events were described in 96 individuals, of which 3 were provoked, for a prevalence of 4% and an annualized rate of 0.1%."
    explanation: >-
      The quantitative basis for the very rare band, including that most events
      were provoked.
  - reference: PMID:29165051
    reference_title: A structure-function analysis in patients with prekallikrein deficiency.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "No bleeding manifestations were present in 11 of the 12 probands."
    explanation: >-
      The molecularly confirmed series argues against bleeding as a feature. The
      twelfth proband had epistaxis and also had hypertension.
  - reference: CGGV:assertion_ada3e3e0-165c-4bfb-af20-d811b7b8d9b8-2022-12-05T170000.000Z
    reference_title: "KLKB1 / inherited prekallikrein deficiency (Definitive)"
    supports: REFUTE
    evidence_source: OTHER
    snippet: "No patients with bleeding were described so far, except one with epistaxis"
    explanation: >-
      ClinGen's reading of the same literature when it classified the
      gene-disease pair.
- name: Hypertension
  category: Cardiovascular
  description: >-
    Reported patients carry an excess of hypertension and of its vascular
    complications, which is the one clinical association that has repeatedly
    been noticed. Across all 89 published cases of proven deficiency,
    hypertension or a vascular complication of it was found in 21 patients, 21
    of the 64 aged over 25 years. No frequency band is recorded, because the two
    denominators fall in different bands and hypertension is age-dependent, so a
    single figure for the disease would be a guess. In the assembled cohort of 111 cases,
    cardiovascular events occurred in 15 per cent overall and rose with age
    across bands. Whether the association is causal is unsettled: these are
    analyses of reported cases with no matched comparison group, the authors who
    describe it say explicitly that association is not causation, and
    prekallikrein-null mice are normotensive. It is recorded as a phenotype
    because it is a consistent observation, not because a mechanism is
    established.
  phenotype_term:
    preferred_term: Hypertension
    term:
      id: HP:0000822
      label: Hypertension
  evidence:
  - reference: PMID:25886833
    reference_title: "Prevalence of hypertension and its complications in congenital prekallikrein deficiency: analysis of all reported cases and clinical significance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Altogether, 89 cases of proven prekallikrein deficiency have been described in the literature. Hypertension or vascular complications of it were found in 21 patients"
    explanation: The all-ages numerator and denominator, which is the wider of the two figures in the description.
  - reference: PMID:25886833
    reference_title: "Prevalence of hypertension and its complications in congenital prekallikrein deficiency: analysis of all reported cases and clinical significance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "If the analysis is limited to patients over 25 years of age, the number becomes 21 out of 64 cases (38.2%)."
    explanation: >-
      The quantitative basis for the frequent band, in the age range where
      hypertension is detectable.
  - reference: PMID:25886833
    reference_title: "Prevalence of hypertension and its complications in congenital prekallikrein deficiency: analysis of all reported cases and clinical significance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This prevalence is much higher than that seen for other conditions occasionally found in patients with prekallikrein deficiency, namely hyperthyroidism, lupus erythematosus, chronic lymphocytic leukemia, kidney malformation, peptic ulcer, and myelofibrosis (1-2%)."
    explanation: >-
      The internal comparison that makes hypertension stand out from the other
      incidental findings in the same case literature.
  - reference: PMID:29762144
    reference_title: "Cardiovascular diseases in congenital prekallikrein deficiency: comparison with other chance-associated morbidities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The significance of these findings is critically discussed as association between two diseases does not necessarily indicate the existence of a causative relation between the two."
    explanation: >-
      The authors who report the association state its limit, which is why the
      description stops short of a causal claim.
  - reference: PMID:32202057
    reference_title: "Severe plasma prekallikrein deficiency: Clinical characteristics, novel KLKB1 mutations, and estimated prevalence."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The prevalence of cardiovascular events was 15% (6% <40 years; 21% 40-65 years; 33% >65 years) for an annualized rate of 0.4%."
    explanation: >-
      The age gradient of cardiovascular events in the largest cohort, which is
      the wider finding this phenotype sits inside.

mechanistic_hypotheses:
- hypothesis_group_id: pk_bradykinin_vascular_tone
  hypothesis_label: Loss of kallikrein-dependent bradykinin raises vascular tone and blood pressure
  status: EMERGING
  description: >-
    A proposed explanation for the hypertension and cardiovascular events
    reported in prekallikrein-deficient patients: bradykinin is a vasodilator
    that also raises vascular permeability and contributes to blood-pressure
    control, so losing its kallikrein-dependent production would shift vascular
    tone upward. The supporting evidence is the clinical association plus
    bradykinin's known vascular pharmacology, not a measurement in patients.
    Two findings cut against it. Prekallikrein-null mice have normal blood
    pressure despite reduced plasma bradykinin, and the same mice are protected
    from atherosclerosis rather than predisposed to it. Ascertainment is the
    competing explanation, since reported cases are enriched for older patients
    investigated for other reasons.
  evidence:
  - reference: PMID:25075649
    reference_title: "The old and the new in prekallikrein deficiency: historical context and a family from Argentina with PK deficiency due to a new mutation (Arg541Gln) in exon 14 associated with a common polymorphysm (Asn124Ser) in exon 5."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Future research activities will probably concentrate on the effect of PK and other contact phase factors on the vascular system."
    explanation: >-
      The hypothesis stated as the open research direction by the group that
      raised it.
  - reference: PMID:22398951
    reference_title: "Effects of plasma kallikrein deficiency on haemostasis and thrombosis in mice: murine ortholog of the Fletcher trait."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: "Blood pressure and heart rate were normal in plasma kallikrein-deficient mice"
    explanation: The murine counterpart has no blood-pressure phenotype.


name: Inherited Prekallikrein Deficiency
creation_date: "2026-10-31T14:00:00Z"
category: Mendelian
description: >-
  Inherited prekallikrein deficiency (Fletcher factor deficiency) is an
  autosomal recessive defect of the plasma contact system caused by biallelic
  loss-of-function variants in KLKB1, the gene encoding the liver-synthesized
  zymogen plasma prekallikrein. Activated factor XII converts prekallikrein to
  plasma kallikrein, which then feeds two arms: it activates further factor XII,
  amplifying contact-phase coagulation, and it cleaves high-molecular-weight
  kininogen to liberate bradykinin.

  The disease is a laboratory finding rather than a clinical one. Losing the
  kallikrein feedback loop leaves factor XII autoactivation as the only route
  into the contact pathway, which slows that pathway without abolishing it. In
  the aPTT reaction, with its short preincubation, the result is a markedly
  prolonged clotting time, commonly more than twice the upper reference limit,
  with a normal prothrombin time. Prolonging the preincubation lets factor XII
  autoactivate and the aPTT shortens, which is the diagnostic signature. In
  vivo, thrombin generation through tissue factor and factor VIIa is untouched,
  so patients do not bleed abnormally and tolerate surgery without hemostatic
  support.

  The practical hazard is iatrogenic. An alarming aPTT found before an operation
  invites plasma transfusion or deferral of the procedure, and several reported
  patients received fresh frozen plasma that their hemostasis did not need. The
  one setting where replacement has a stated purpose is not hemostasis but
  assay repair: replenishing prekallikrein restores a usable activated clotting
  time for intraoperative heparin monitoring.

  Two claims about the disease are unsettled and are recorded here as
  discussions rather than as mechanisms. Reported cases carry an excess of
  hypertension and cardiovascular events, which may reflect loss of
  bradykinin-dependent vasodilation or may be ascertainment, and the deficiency
  does not protect patients from thrombosis even though prekallikrein-null mice
  are strikingly protected.

  The opposite direction of the same biology is a drug target: plasma kallikrein
  inhibitors and a prekallikrein-lowering antisense oligonucleotide treat
  bradykinin-mediated hereditary angioedema, curated in Hereditary_Angioedema.
  The sibling contact-factor deficiencies are Congenital_Factor_XII_Deficiency
  and high-molecular-weight kininogen deficiency.

  prevalence_class: BAND_1_9_PER_1000000
  rate_per_100000: 0.64
  notes: >-
    Reported as 1 in 155,668. The estimate is model-based, computed from KLKB1
    variant frequencies in the Genome Aggregation Database together with the
    population-based Gutenberg Health Study, not from direct population
    screening.
  evidence:
  - reference: PMID:32202057
    reference_title: "Severe plasma prekallikrein deficiency: Clinical characteristics, novel KLKB1 mutations, and estimated prevalence."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified new KLKB1 mutations, excluded the pathogenicity of some of the previously described ones, and estimated a prevalence of severe PK deficiency of 1/155 668 overall and 1/4725 among Africans."
    explanation: The source of both the worldwide figure and the African-ancestry figure recorded in the next record.
- population: People of African ancestry
  measure_type: POINT_PREVALENCE
  prevalence_class: BAND_1_5_PER_10000
  rate_per_100000: 21.2
  notes: >-

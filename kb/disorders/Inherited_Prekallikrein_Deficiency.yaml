      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The frequency of 451dupT was 1.17% in the Nigerian collective (7/600 alleles); none had Cys548Tyr."
      explanation: The measured allele frequency in a Nigerian population collective.
    - reference: PMID:33073460
      reference_title: "c.451dupT in KLKB1 is common in Nigerians, confirming a higher prevalence of severe prekallikrein deficiency in Africans compared to Europeans."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "To date, all genotyped PK-deficient patients of African ancestry were homozygous for 451dupT."
      explanation: Supports treating it as the recurrent African-ancestry allele rather than one of several.
  - name: c.1643G>A (p.Cys548Tyr)
    description: >-
      Recurrent missense allele reported in unrelated European and American
      patients, including as a homozygote in two consecutive unrelated cases
      with no known consanguinity, and as one half of a compound heterozygous
      genotype. It was absent from a European population collective, so its
      recurrence among patients is not explained by high population frequency.
    clinical_significance: PATHOGENIC
    variant_type: single nucleotide variant
    gene:
      preferred_term: KLKB1
      term:
        id: hgnc:6371
        label: KLKB1
    evidence:
    - reference: PMID:17413767
      reference_title: Severe prekallikrein deficiencies due to homozygous C529Y mutations.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A homozygous C529Y mutation was identified for both cases, whereas they are unrelated and no consanguineous marriage is known from the patients."
      explanation: >-
        Two unrelated homozygous patients, which is the basis for calling the
        allele recurrent. The paper numbers the residue 529 by the convention
        that omits the prepro sequence, so the same substitution is Cys548Tyr
        when the full precursor is counted.
    - reference: PMID:19404525
      reference_title: "[Severe prekallikrein deficiency due to a compound heterozygosis in the KLKB1-gene]."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "a base exchange Cys 548 (TGC) > Tyr (TAC) in exon 14"
      explanation: The same substitution in trans with a frameshift allele, under the full-precursor numbering.
  - name: p.Gly104Arg with p.Asn124Ser (apple domain 2)
    description: >-
      Homozygous pair of substitutions in the second apple domain of the heavy
      chain, reported in Japanese patients as PKD Seki. It is the mechanistically
      distinct class: the apple domains mediate binding to high-molecular-weight
      kininogen, and recombinant mutant domain binds kininogen poorly, so the
      defect is in assembly of the prekallikrein-kininogen complex rather than in
      the catalytic domain. Asn124Ser was subsequently shown to be a common
      polymorphism, so the pairing matters rather than either substitution alone.
    clinical_significance: PATHOGENIC
    variant_type: single nucleotide variant
    gene:
      preferred_term: KLKB1
      term:
        id: hgnc:6371
        label: KLKB1
    evidence:
    - reference: PMID:17598838
      reference_title: A new type of plasma prekallikrein deficiency associated with homozygosity for Gly104Arg and Asn124Ser in apple domain 2 of the heavy-chain region.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We clearly demonstrated that the Gly104Arg-substitution with the Asn124Ser-substitution in A2 reduce the binding activity of A2 to HMWK."
      explanation: >-
        The functional experiment, on recombinant apple domain 2, that locates
        this allele class's defect in kininogen binding.
  - name: p.Trp499Ter
    description: >-
      Homozygous nonsense allele truncating the protein within the catalytic
      domain, a worked example of the dominant truncating class.
    clinical_significance: PATHOGENIC
    variant_type: single nucleotide variant
    gene:
      preferred_term: KLKB1
      term:
        id: hgnc:6371
        label: KLKB1
    evidence:
    - reference: PMID:21415712
      reference_title: Severe prekallikrein deficiency due to a homozygous Trp499Stop nonsense mutation.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The mutant allele is predicted to encode a truncated protein lacking half of the catalytic domain of prekallikrein, suggesting that the truncated protein causes prekallikrein deficiency in the patient."
      explanation: The predicted consequence of this allele at the protein level.
  notes: >-
    Residue numbering in this literature is inconsistent and the same allele
    appears under two names. Older reports count from the mature protein and
    omit the 19-residue prepro sequence, so Cys529Tyr and Cys548Tyr, and
    Ser151Phefs and Cys97Tyrfs, are the same substitutions under different
    conventions. The variant names used here follow the full-precursor
    numbering, and each row's evidence quotes the source in the source's own
    numbering.

diagnosis:
- name: Isolated prolonged aPTT with a normal prothrombin time
  description: >-
    The presentation is a laboratory result, almost always found incidentally or
    on preoperative screening in a patient with no bleeding history. A mixing
    study comes first and separates a factor deficiency, which corrects, from an
    inhibitor such as a lupus anticoagulant, which does not. Normal factor VIII,
    IX, XI and XII activities and a negative lupus anticoagulant screen leave
    the contact factors prekallikrein and high-molecular-weight kininogen.
  evidence:
  - reference: PMID:39720820
    reference_title: Rare Prekallikrein Deficiency Identified During Workup of Isolated Prolonged Activated Partial Thromboplastin Time.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Results of the initial coagulation tests demonstrated no deficiency of factors VIII, IX, or XI and no evidence for lupus anticoagulant or antiphospholipid antibodies. However, a mixing study test was suggestive of factor deficiency."
    explanation: The exclusion sequence that leads to contact-factor testing, worked through in one patient.
  - reference: PMID:32617222
    reference_title: Diagnostic Pearls and Clinical Implications of Prekallikrein Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The elevated PTTs corrected from 146 to 30 seconds and from 69 to 30 seconds after a 1:1 mix with normal plasma, indicating a factor deficiency as the likely cause of the prolonged PTT."
    explanation: The mixing-study step and its interpretation.
- name: Shortening of the aPTT on prolonged preincubation
  description: >-
    Prekallikrein-deficient plasma is the only contact-factor-deficient plasma
    whose markedly prolonged aPTT shortens substantially when preincubation with
    the activator is extended, because factor XII autoactivation is given time
    to proceed. It is the cheapest pointer to the diagnosis and is widely used
    as a clue, but it is a kinetic behaviour rather than a specific assay and
    does not replace measuring prekallikrein.
  evidence:
  - reference: PMID:32617222
    reference_title: Diagnostic Pearls and Clinical Implications of Prekallikrein Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "His PTT characteristically became shorter with prolonged incubation, providing a clue at testing for PK levels, which were found to be severely low."
    explanation: The test used as a diagnostic pointer in practice.
  - reference: PMID:12091043
    reference_title: "Prekallikrein deficiency: the characteristic normalization of the severely prolonged aPTT following increased preincubation time is due to autoactivation of factor XII."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Normalization of a severely increased aPTT (>120 s) after prolonged preincubation with aPTT reagent occurred in plasma deficient in PK but not in plasma deficient in factor XII (FXII), high-molecular-weight kininogen (HK), factor XI (FXI), factor IX, factor VIII, Passovoy trait plasma or plasma containing lupus anticoagulant."
    explanation: >-
      The comparison that makes the behaviour discriminating, since no other
      deficiency in the differential does it.
- name: Plasma prekallikrein activity and antigen assay
  description: >-
    The confirmatory test. Activity is measured by a coagulant or amidolytic
    assay and is severely low; antigen by immunoassay or immunoblot separates
    the cross-reactive-material-negative from the positive form. A mixing study
    against prekallikrein-deficient plasma, which fails to correct, confirms
    that prekallikrein is the missing factor.
  evidence:
  - reference: PMID:42454615
    reference_title: "Normal thromboelastography with a markedly prolonged activated partial thromboplastin time in severe prekallikrein deficiency: Implications for perioperative hemostatic assessment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The aPTT corrected on mixing with normal pooled plasma but not with PK-deficient plasma."
    explanation: >-
      The specific mixing step that identifies the deficient factor, rather than
      merely showing a factor deficiency.
  - reference: PMID:12091043
    reference_title: "Prekallikrein deficiency: the characteristic normalization of the severely prolonged aPTT following increased preincubation time is due to autoactivation of factor XII."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PK clotting activity 5%, PK amidolytic activity 5%, PK antigen 2% of normal plasma"
    explanation: The three confirmatory measurements reported together in one proband.
- name: Exclusion of high-molecular-weight kininogen deficiency
  description: >-
    Severe kininogen deficiency lowers measured prekallikrein as well as factor
    XI, so it can be read as prekallikrein deficiency unless kininogen is
    measured, and one individual in the assembled prekallikrein cohort turned
    out to have kininogen deficiency. A mildly low factor XII, by contrast, does
    not redirect the workup, because about a quarter of prekallikrein-deficient
    individuals have factor XII activity below the reference range.
  evidence:
  - reference: PMID:36700498
    reference_title: "Severe high-molecular-weight kininogen deficiency: clinical characteristics, deficiency-causing KNG1 variants, and estimated prevalence."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Individuals with HK deficiency appeared asymptomatic and had decreased levels of prekallikrein and factor XI, which could lead to misdiagnosis."
    explanation: Names the misdiagnosis risk, from the cohort study of the mimicking disease.
  - reference: PMID:32202057
    reference_title: "Severe plasma prekallikrein deficiency: Clinical characteristics, novel KLKB1 mutations, and estimated prevalence."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One individual reported with PK deficiency had, in fact, congenital kininogen deficiency associated with decreased PK activity."
    explanation: The error occurring in the published literature, found on re-appraisal.
  - reference: PMID:32202057
    reference_title: "Severe plasma prekallikrein deficiency: Clinical characteristics, novel KLKB1 mutations, and estimated prevalence."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One quarter of individuals had factor XII clotting activity below the reference range."
    explanation: >-
      Why a mildly low factor XII does not redirect the workup away from
      prekallikrein.
- name: KLKB1 sequencing
  description: >-
    Sequencing the 15 exons of KLKB1 establishes the genotype and is what
    distinguishes homozygosity from compound heterozygosity. It remains
    under-used: most reported patients have never been genotyped, which is why
    the variant spectrum is still being assembled from scattered families.
  evidence:
  - reference: PMID:31984307
    reference_title: Lisinopril-Induced Angioedema in a Patient with Plasma Prekallikrein Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Deoxyribonucleic acid (DNA) was extracted from peripheral blood leukocytes and all 15 exons of prekallikrein gene"
    explanation: The scope of the sequencing approach used in practice.
  - reference: PMID:33653162
    reference_title: "Homozygous Prekallikrein Deficiency in the USA: Several Patients but Still Few Mutation Studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There is also a discrepancy between the number of case reports and the paucity of genetic studies."
    explanation: >-
      Supports the statement that genotyping is under-used relative to the
      number of reported patients.

treatments:
- name: Observation Without Hemostatic Prophylaxis
  description: >-
    No replacement or prophylaxis is needed, including before surgery. The
    management decision is to withhold treatment: reported patients have
    undergone hallux amputation, kidney biopsy, deep brain stimulator
    implantation and endovascular aortic repair without hemorrhagic
    complications, several of them after fresh frozen plasma given for the
    laboratory value rather than for any hemostatic need, and reviews of the
    accumulated cases conclude that routine
    blood-product prophylaxis is not indicated. The point of recognising the
    deficiency is to allow a definitive assessment of bleeding risk and so avoid
    deferring the procedure.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: observation without hemostatic prophylaxis
  target_mechanisms:
  - target: Hemostasis Preserved Despite the Contact Defect
  evidence:
  - reference: PMID:40125216
    reference_title: A Case of Severe Prekallikrein Deficiency Manifesting as Isolated Activated Partial Thromboplastin Time (aPTT) Prolongation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Our review suggests that routine prophylactic administration of blood products for pre-operative management of this condition is not indicated but may be considered if the patient is at high risk of hemorrhage or clinical deterioration."
    explanation: >-
      The recommendation this record implements, with the exception the authors
      leave open.
  - reference: PMID:32617222
    reference_title: Diagnostic Pearls and Clinical Implications of Prekallikrein Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our case further highlights the clinical pearls for diagnosis and further endorses that these patients can safely undergo surgical procedures without the need for plasma transfusions or factor concentrate usage."
    explanation: A surgical case supporting withholding both plasma and factor concentrate.
  - reference: PMID:39720820
    reference_title: Rare Prekallikrein Deficiency Identified During Workup of Isolated Prolonged Activated Partial Thromboplastin Time.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Identification of a contact factor deficiency is clinically useful information, as it allows for a definitive assessment of bleeding risk."
    explanation: States what the diagnosis is for, given that it changes no treatment.
  notes: >-
    The treatment term is deliberately left unbound. TreatmentTerm is rooted at
    NCIT:C25218 Clinical Intervention or Procedure, and this record's content is
    an action withheld rather than given. Against ols:ncit, `l~watchful`
    returns only questionnaire items, and `l~observation` returns
    NCIT:C25598 Observation Activity and NCIT:C16084 Observational Study, which
    are study-conduct rather than intervention concepts. NCIT:C15747 Supportive
    Care was rejected because it asserts care delivered. Both searches were
    re-run immediately before this note was written.
- name: Preoperative Fresh Frozen Plasma for Activated Clotting Time Monitoring
  description: >-
    The one stated indication for replacement is not hemostasis but repair of a
    monitoring assay. The activated clotting time used to steer intraoperative
    heparin and protamine is contact activated and so is already prolonged at
    baseline in these patients, which makes it unusable. Replenishing
    prekallikrein with fresh frozen plasma before the procedure restored a
    usable activated clotting time during endovascular aortic repair. This is a
    single reported case and the indication is narrow: elsewhere fresh frozen
    plasma has been given for the laboratory value alone, which is the practice
    the preceding record argues against.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: fresh frozen plasma transfusion
    term:
      id: NCIT:C116475
      label: Fresh Frozen Plasma Transfusion
  target_mechanisms:
  - target: Rate-Limited Factor XII Autoactivation as the Sole Contact Trigger
  evidence:
  - reference: PMID:41123211
    reference_title: "Coagulation management in endovascular aortic repair in a patient with congenital prekallikrein deficiency: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Intraoperative anticoagulation with heparin and protamine was successfully managed using the activated clotting time measurements after preoperative administration of two units of fresh frozen plasma for prekallikrein replenishment."
    explanation: The indication and the stated purpose, which is anticoagulation monitoring rather than hemostasis.
  - reference: PMID:41123211
    reference_title: "Coagulation management in endovascular aortic repair in a patient with congenital prekallikrein deficiency: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Prekallikrein deficiency is a rare autosomal recessive coagulation disorder that prolongs the activated clotting time."
    explanation: >-
      Why the monitoring assay fails in the first place, which is what the
      replacement addresses.
  - reference: PMID:33940978
    reference_title: "A Rare Cause of Isolated Prolonged Activated Partial Thromboplastin Time: An Overview of Prekallikrein Deficiency and the Contact System."
    supports: NO_EVIDENCE
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient had an uneventful biopsy course after receiving fresh frozen plasma (FFP)."
    explanation: >-
      Cited to mark the contrast rather than to support the indication. Plasma
      was given before a kidney biopsy with no monitoring purpose, and the
      uneventful course says nothing about whether it was needed.
- name: Genetic Counseling
  description: >-
    Recurrence risk for the offspring of two carriers is 25 per cent, and the
    counselling message is dominated by the benign prognosis: the finding to
    explain is a laboratory result that needs no treatment and shortens no
    lives. Cascade testing of relatives with an unexplained prolonged aPTT
    spares them a repeated workup, and carrier awareness is worth raising in
    consanguineous families and in families of African ancestry, where a common
    frameshift allele raises the chance that both parents carry one.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:15461630
    reference_title: Severe prekallikrein deficiency associated with homozygosity for an Arg94Stop nonsense mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The five heterozygous offspring of the proband each showed a normal aPTT but reduced PK activity and antigen."
    explanation: >-
      What cascade testing finds in first-degree relatives, and why a normal
      aPTT does not exclude carriage.
  - reference: PMID:33073460
    reference_title: "c.451dupT in KLKB1 is common in Nigerians, confirming a higher prevalence of severe prekallikrein deficiency in Africans compared to Europeans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In order to avoid delay of necessary surgical procedures in patients of African origin, diagnostic algorithms for isolated, unexplained, activated partial thromboplastin time prolongation in these subjects should include PK deficiency screening."
    explanation: The ancestry-specific recommendation that makes carrier awareness actionable.

clinical_burden:
  burden_level: LOW
  rationale: >-
    The deficiency itself imposes essentially no burden: it is asymptomatic,
    needs no treatment, does not shorten life and does not restrict surgery.
    What burden exists is iatrogenic and diagnostic. An unexplained prolonged
    aPTT triggers a hematology referral and a sequence of exclusion tests,
    invites plasma transfusion that the patient's hemostasis does not need, and
    can delay an operation. Recognising the deficiency is what averts the
    burden. The reported excess of hypertension and cardiovascular events, if it
    is real, would be the only substantive burden, and it is unresolved.
  evidence:
  - reference: PMID:33940978
    reference_title: "A Rare Cause of Isolated Prolonged Activated Partial Thromboplastin Time: An Overview of Prekallikrein Deficiency and the Contact System."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient had an uneventful biopsy course after receiving fresh frozen plasma (FFP)."
    explanation: >-
      The iatrogenic half of the burden: a transfusion given for a laboratory
      value, before a procedure that was then uneventful.
  - reference: PMID:40125216
    reference_title: A Case of Severe Prekallikrein Deficiency Manifesting as Isolated Activated Partial Thromboplastin Time (aPTT) Prolongation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thus, presurgical optimization of patients with severe prekallikrein deficiency should be standardized to limit delay of care."
    explanation: Names delay of care as the harm to be avoided.
  - reference: PMID:42454615
    reference_title: "Normal thromboelastography with a markedly prolonged activated partial thromboplastin time in severe prekallikrein deficiency: Implications for perioperative hemostatic assessment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient underwent surgery without hemostatic complications or transfusion."
    explanation: >-
      Supports the low burden level, since the procedure proceeded with no
      hemostatic support at all.

animal_models:
- name: Plasma prekallikrein-deficient mouse
  species: Mouse
  genotype: Klkb1-/-
  publication: PMID:22398951
  description: >-
    The engineered knockout is the only substantial model of this disease and it
    reproduces the human biochemistry closely, including the prolonged aPTT and
    its partial correction on prolonged incubation. It diverges from the human
    disease where it is most interesting, in being strongly protected from
    thrombosis.
  genes:
  - preferred_term: KLKB1
    term:
      id: hgnc:6371
      label: KLKB1
  modeled_mechanisms:
  - target: Rate-Limited Factor XII Autoactivation as the Sole Contact Trigger
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: MOLECULAR
    description: >-
      Knockout plasma shows the defining kinetic signature of the human defect,
      a long aPTT and defective contact-activation-induced thrombin generation
      that partially corrects when incubation is prolonged.
    limitations: >-
      Mouse and human contact-factor biology are not identical, and the
      correction is reported as partial rather than quantified against human
      plasma.
    evidence:
    - reference: PMID:25339356
      reference_title: "Reduced thrombosis in Klkb1-/- mice is mediated by increased Mas receptor, prostacyclin, Sirt1, and KLF4 and decreased tissue factor."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Klkb1(-/-) plasmas have long-activated partial thromboplastin times and defective contact activation-induced thrombin generation that partially corrects upon prolonged incubation."
      explanation: >-
        The same time-dependent correction that is the diagnostic hallmark in
        patients, measured in the knockout.
  - target: Hemostasis Preserved Despite the Contact Defect
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      The knockout does not bleed abnormally in provoked challenges, matching
      the human phenotype, but the match is not exact: tail bleeding time was
      modestly increased, while renal bleeding times were unaffected.
    limitations: >-
      Murine tail and renal bleeding assays are not human surgery, and the
      modest tail-bleeding increase has no human counterpart, so the agreement
      is qualitative.
    evidence:
    - reference: PMID:22398951
      reference_title: "Effects of plasma kallikrein deficiency on haemostasis and thrombosis in mice: murine ortholog of the Fletcher trait."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Average renal bleeding times were similar in all genotypes."
      explanation: Normal hemostasis in one of the two challenge assays.
    - reference: PMID:22398951
      reference_title: "Effects of plasma kallikrein deficiency on haemostasis and thrombosis in mice: murine ortholog of the Fletcher trait."
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: "Average tail bleeding time increased modestly in knockout mice compared to wild-type."
      explanation: >-
        The reason this link is partial rather than full, since one assay shows
        a small hemostatic effect that patients do not show.
  - target: Reduced Kallikrein-Driven Thromboinflammation in Model Systems
    relationship: RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    description: >-
      Arterial occlusion is prevented or delayed across ferric chloride and rose
      bengal models, and the protection extends to thromboinflammatory and
      atherosclerotic models. This is the model's distinctive finding and the
      node is scoped to model systems because of it.
    limitations: >-
      The human disease shows no such protection: nine of 75 reported patients
      had thrombotic events, and reported patients carry an excess rather than a
      deficit of cardiovascular disease. The fidelity tier is low for that
      reason, not because the murine result is weak.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: INVALIDATING
      description: >-
        The protective phenotype does not transfer. Murine thrombosis models use
        a defined chemical or photochemical arterial injury in young inbred
        animals, whereas human thrombotic events in this disease occurred mostly
        in patients with acquired risk factors such as hypertension and
        diabetes. The claim that losing prekallikrein protects against
        thrombosis should not be carried from this model to patients.
      evidence:
      - reference: PMID:20424433
        reference_title: "Thrombotic events in patients with congenital prekallikrein deficiency: a critical evaluation of all reported cases."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "The article clearly indicates that prekallikrein deficiency does not protect from thrombosis in spite of the severe in vitro coagulation defect."
        explanation: The human result that the murine protection does not predict.
    evidence:
    - reference: PMID:26950760
      reference_title: A comparison of the effects of factor XII deficiency and prekallikrein deficiency on thrombus formation.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "PK-deficient mice were resistant at 3.5% FeCl3 and partially resistant at 5% FeCl3."
      explanation: >-
        The protection, quantified against stimulus strength and against factor
        XII-deficient animals in the same laboratory.
  evidence:
  - reference: PMID:22398951
    reference_title: "Effects of plasma kallikrein deficiency on haemostasis and thrombosis in mice: murine ortholog of the Fletcher trait."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Deficiency in humans is characterised by prolonged activated partial thromboplastin time (aPTT); however, the balance between thrombosis and haemostasis is not fully understood."
    explanation: >-
      The study frames itself against the human trait it models, and names the
      open question the model exists to address. The quoted sentence states the
      human clinical picture in the paper's own framing rather than reporting a
      murine result.

discussions:
- discussion_id: pk_deficiency_thrombosis_protection
  prompt: >-
    Prekallikrein-null mice are strongly protected from arterial thrombosis and
    from several thromboinflammatory injuries, yet patients with severe
    prekallikrein deficiency are not protected from thrombosis and may carry an
    excess of cardiovascular events. Is the murine protection a real human
    effect masked by small numbers, reporting bias and acquired risk factors, or
    does contact-system biology differ enough between the species that the
    protection does not transfer?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Reduced Kallikrein-Driven Thromboinflammation in Model Systems
  rationale: >-
    The mismatch is not a detail. The murine result is the main reason plasma
    kallikrein is pursued as an antithrombotic target, and the human experiment
    that would test it already exists in the form of untreated biallelic
    patients. The human evidence against protection is weak in design, being an
    analysis of reported cases with no comparison group, in which six of the
    nine thrombotic patients had acquired risk factors. No matched cohort has
    ever compared thrombotic incidence in deficient individuals with controls.
    Until one does, the murine protection cannot be read as a human effect and
    the published human series cannot settle its absence either.
  evidence:
  - reference: PMID:20424433
    reference_title: "Thrombotic events in patients with congenital prekallikrein deficiency: a critical evaluation of all reported cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among these patients were 9 with thrombosis, 6 arterial (myocardial infarction and ischemic stroke) and 3 venous (deep vein thrombosis with or without pulmonary embolism)."
    explanation: The human events that the murine protection fails to predict.
  - reference: PMID:20424433
    reference_title: "Thrombotic events in patients with congenital prekallikrein deficiency: a critical evaluation of all reported cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In 6 cases acquired thrombosis risk factors were present; in 2 cases no associated risk factors were present and in 1 case no information was supplied in this regard."
    explanation: >-
      The confounding that keeps the human side from being decisive, stated by
      the same analysis.
  - reference: PMID:22398951
    reference_title: "Effects of plasma kallikrein deficiency on haemostasis and thrombosis in mice: murine ortholog of the Fletcher trait."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "mice were completely protected from occlusion ... in 3.5% FeCl3 -induced arterial thrombosis versus heterozygotes"
    explanation: >-
      The strength of the murine protection, which is what makes the mismatch
      worth resolving. The ellipsis bridges the parenthetical flow measurement.
  - reference: PMID:42755375
    reference_title: "Prekallikrein: the catalytic crossroads of inflammation and thrombosis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Animal models reveal context-dependent roles of prekallikrein in arterial and venous thrombosis, while human data confirm that prekallikrein deficiency is not associated with bleeding."
    explanation: >-
      A current review states the animal results as context-dependent, which is
      the form the translational question takes.
- discussion_id: pk_deficiency_cardiovascular_association
  prompt: >-
    Reported patients with prekallikrein deficiency carry an excess of
    hypertension and cardiovascular events, up to 21 of 64 cases over 25 years
    of age. Is this caused by loss of kallikrein-dependent bradykinin and its
    vascular effects, or is it ascertainment, since the deficiency is found
    incidentally during investigations that older and comorbid patients undergo
    more often?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - phenotypes#Hypertension
  - mechanistic_hypotheses#pk_bradykinin_vascular_tone
  rationale: >-
    This is the only claimed clinical consequence of the deficiency and it
    decides whether the diagnosis changes anything beyond reassurance. Every
    report of it is an analysis of published cases without a comparison group,
    and the detection route is itself a selection filter: a prolonged aPTT is
    most often found during preoperative or inpatient testing, which selects for
    older patients with vascular disease. The animal evidence points the other
    way, since prekallikrein-null mice are normotensive and are protected from
    atherosclerosis through stabilisation of the low-density lipoprotein
    receptor. A registry with matched controls is the design that would settle
    it, and an international prekallikrein and kininogen deficiency registry is
    being established.
  evidence:
  - reference: PMID:29762144
    reference_title: "Cardiovascular diseases in congenital prekallikrein deficiency: comparison with other chance-associated morbidities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Congenital prekallikrein deficiency is frequently associated with cardiovascular conditions, namely hypertension, coronary disease, ischemic stroke, venous thrombosis."
    explanation: The observation that opens the question.
  - reference: PMID:25886833
    reference_title: "Prevalence of hypertension and its complications in congenital prekallikrein deficiency: analysis of all reported cases and clinical significance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These results indicate the need to investigate further the relation between prekallikrein deficiency and hypertension."
    explanation: The authors treat their own finding as a question rather than a result.
  - reference: PMID:35189703
    reference_title: Ablation of Plasma Prekallikrein Decreases Low-Density Lipoprotein Cholesterol by Stabilizing Low-Density Lipoprotein Receptor and Protects Against Atherosclerosis.
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: "Ablation of PK stabilizes LDLR, decreases LDL cholesterol, and prevents atherosclerotic plaque development."
    explanation: >-
      Animal evidence pointing the opposite way, since losing prekallikrein is
      cardioprotective in rodents, which a causal reading of the human
      association has to explain away.
  - reference: PMID:36700498
    reference_title: "Severe high-molecular-weight kininogen deficiency: clinical characteristics, deficiency-causing KNG1 variants, and estimated prevalence."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "an international prekallikrein and HK deficiency registry is being established to fill this knowledge gap"
    explanation: The instrument that could answer this question, already under construction.

notes: >-
  No GeneReviews chapter covers inherited prekallikrein deficiency or KLKB1.
  Searching PubMed for `"prekallikrein deficiency"[TI] AND genereviews[book] NOT
  retired[TI]` and `KLKB1[TIAB] AND genereviews[book] NOT retired[TI]` returned
  zero records on 2026-10-31, and `just check-genereviews` reports no chapter
  against the committed Bookshelf index.

  Thrombosis is deliberately not recorded as a phenotype. The evidence is a
  review of published cases in which nine of 75 patients had a thrombotic
  event, most with acquired risk factors, and the analysis's own conclusion is
  that the deficiency does not protect from thrombosis rather than that it
  causes it. That claim, and its tension with the strong protection seen in
  prekallikrein-null mice, is recorded as a discussion.

  Not cited, and why. Several relevant records cache with no quotable text on
  the fetches made here, so no evidence item cites them; they are leads for a
  curator with full-text access. PMID:35377535 and PMID:35377536 are a pair on
  laboratory testing, the second of which argues from its title that the
  diagnosis should not rest on aPTT shortening after prolonged preincubation
  alone, which is the caveat on the second diagnosis record. PMID:12871337 is
  the first report linking KLKB1 to the disease and the source of the single
  epistaxis case ClinGen notes. PMID:34847617, PMID:20301226 and PMID:4439375
  add further families and a heterozygote detection test, PMID:20135073 and
  PMID:16884995 cover management during cardiac surgery, PMID:42311095
  localises severe isolated aPTT prolongation to prekallikrein using a
  preserved dilute Russell viper venom time, and PMID:27585864 is a short
  review.

  Hereditary angioedema therapeutics that inhibit plasma kallikrein or lower
  prekallikrein are the pharmacological inverse of this disease, and their
  safety record is informative about it, but they treat a different disease and
  are curated in Hereditary_Angioedema rather than here.

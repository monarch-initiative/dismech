  variants:
  - name: c.451dupT (p.Ser151PhefsTer34)
    description: >-
      Frameshift allele that is common in West African populations and absent
      from European collectives, and the cause in every genotyped
      African-ancestry patient reported so far. It is the allele behind the
      higher estimated prevalence in people of African ancestry.
    clinical_significance: PATHOGENIC
    variant_type: duplication

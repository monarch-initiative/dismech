inheritance:
- name: Autosomal recessive
  description: >-
    Severe deficiency requires two defective KLKB1 alleles, as homozygotes or
    compound heterozygotes. Heterozygous relatives have roughly half-normal
    prekallikrein activity and antigen with a normal aPTT, so carriers are not
    detected by coagulation screening and have no reported phenotype.
    Consanguinity accounts for several reported families.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:21415712
    reference_title: Severe prekallikrein deficiency due to a homozygous Trp499Stop nonsense mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Prekallikrein deficiency is a rare autosomal recessive disease not considered to be associated with a tendency for bleeding, despite marked prolongation of activated partial thromboplastin time."
    explanation: States the mode of inheritance, and the absence of bleeding that goes with it.
  - reference: PMID:15461630
    reference_title: Severe prekallikrein deficiency associated with homozygosity for an Arg94Stop nonsense mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The five heterozygous offspring of the proband each showed a normal aPTT but reduced PK activity and antigen."
    explanation: >-
      The recessive dose-response in one kindred: carriers have a measurable
      biochemical reduction but a normal clotting time.
  - reference: CGGV:assertion_ada3e3e0-165c-4bfb-af20-d811b7b8d9b8-2022-12-05T170000.000Z
    reference_title: "KLKB1 / inherited prekallikrein deficiency (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The mechanism for disease is homozygous loss of function."
    explanation: ClinGen's own statement of the disease mechanism for this gene-disease pair.


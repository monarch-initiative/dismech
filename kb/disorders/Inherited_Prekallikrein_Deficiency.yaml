    the common frameshift allele c.451dupT. Model-based on the same allele
    frequencies rather than measured in a screened cohort.
  evidence:
  - reference: PMID:32202057
    reference_title: "Severe plasma prekallikrein deficiency: Clinical characteristics, novel KLKB1 mutations, and estimated prevalence."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

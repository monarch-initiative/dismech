inheritance:
- name: Autosomal recessive
  description: >-
    Classical WS is caused by homozygous or compound heterozygous loss-of-function
    variants in WRN. Virtually all WRN variants found in clinically ascertained
    patients are functional null alleles.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:26993153
    reference_title: "Werner syndrome: Clinical features, pathogenesis and potential therapeutic interventions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is caused by null mutations of the WRN gene, which encodes a member of the RECQ family of DNA helicases."
    explanation: >-
      Establishes WS as caused by null WRN alleles; the recessive mechanism
      requires both copies to be inactivated.
  - reference: PMID:903377
    reference_title: "A retarded rate of DNA replication and normal level of DNA repair in Werner's syndrome fibroblasts in culture."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "patients with Werner's syndrome (WS) of an autosomal recessive premature aging disease"
    explanation: Independent statement that WS is autosomal recessive.
  - reference: PMID:20301687
    reference_title: Werner Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Werner syndrome is inherited in an autosomal recessive manner. If both parents are known to be heterozygous for a WRN pathogenic variant, each sib of an affected individual has at conception a 25% chance of being affected, a 50% chance of being an asymptomatic carrier, and a 25% chance of being unaffected and not a carrier."
    explanation: >-
      States the inheritance mode together with the quantitative sib recurrence
      risks, which is what the mode means operationally for a family.
prevalence:
- population: Japan
  measure_type: CARRIER_FREQUENCY
  notes: >-
    A founder WRN frameshift allele accounts for a large share of Japanese cases;
    the 1996 positional cloning report found one mutation homozygous in 60% of
    Japanese WS patients examined, and the review literature estimates a Japanese
    heterozygote frequency of about 1 in 166.
  evidence:
  - reference: PMID:8602509
    reference_title: "Positional cloning of the Werner's syndrome gene."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "was found in the homozygous state in 60 percent of Japanese WS patients examined"
    explanation: >-
      Documents a founder effect concentrating WS in the Japanese population;
      supports the population skew but not a numeric carrier rate directly.
pathophysiology:
- name: WRN Helicase-Exonuclease Loss of Function
  biological_scale: MOLECULAR
  conforms_to: "genomic_instability_aging#Accumulating DNA Damage"
  description: >
    Biallelic null variants in WRN abolish a 1,432-amino-acid nuclear protein
    that combines an ATP-dependent 3'->5' DNA helicase with an N-terminal 3'->5'
    exonuclease domain. The combination of the two catalytic activities in one
    polypeptide is unique among the five human RecQ helicases. Most disease
    alleles are stop codons, small indels or splice variants that truncate the
    protein and remove its C-terminal nuclear localization signal, so the residual
    product is excluded from the nucleus or degraded; the effect is loss of WRN
    function rather than a variant protein with altered activity.
  genes:
  - preferred_term: WRN
    term:
      id: hgnc:12791
      label: WRN
  molecular_functions:
  - preferred_term: WRN 3'->5' DNA helicase activity
    term:
      id: GO:0003678
      label: DNA helicase activity
    modifier: LOSS_OF_FUNCTION
  - preferred_term: WRN 3'->5' exonuclease activity
    term:
      id: GO:0008408
      label: 3'-5' exonuclease activity
    modifier: LOSS_OF_FUNCTION
  downstream:
  - target: Impaired Replication Fork Recovery and DNA Repair
    description: >
      Loss of the helicase-exonuclease compromises the DNA transactions WRN
      normally supports, chiefly replication, repair and recombination.
  - target: Telomere Maintenance Failure
    description: >
      WRN is the RecQ helicase that resolves G-quadruplex and four-way-junction
      structures at telomeric repeats, so its loss acts directly on telomere
      replication.
  evidence:
  - reference: PMID:8602509
    reference_title: "Positional cloning of the Werner's syndrome gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The predicted protein is 1432 amino acids in length and shows significant similarity to DNA helicases."
    explanation: >-
      The original positional cloning study identifies the WS gene product as a
      putative DNA helicase of 1,432 residues.
  - reference: PMID:8602509
    reference_title: "Positional cloning of the Werner's syndrome gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One of the these mutations, which results in a frameshift and a predicted truncated protein"
    explanation: >-
      Documents truncating WRN alleles as the disease mechanism, consistent with
      loss of function.
  - reference: PMID:26993153
    reference_title: "Werner syndrome: Clinical features, pathogenesis and potential therapeutic interventions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A unique feature of the WRN helicase is the presence of an exonuclease domain in its N-terminal region."
    explanation: >-
      Establishes the dual helicase-exonuclease architecture that distinguishes
      WRN from the other human RecQ helicases.
- name: Impaired Replication Fork Recovery and DNA Repair
  biological_scale: CELLULAR
  conforms_to: "genomic_instability_aging#Declining Genome Maintenance and Erroneous Repair"
  description: >
    Without WRN, cells lose a factor that acts on complex DNA intermediates —
    G-quadruplexes, Holliday junctions and bubble structures — during replication
    and repair. WS fibroblasts show a specifically slowed DNA chain elongation
    rate while their capacity to repair X-ray-induced single-strand breaks and UV
    damage remains normal, so the primary lesion is in replication handling rather
    than in excision repair per se. WRN also contributes to double-strand break
    repair through both non-homologous end joining and end resection during
    homologous recombination.
  biological_processes:
  - preferred_term: DNA replication
    term:
      id: GO:0006260
      label: DNA replication
    modifier: DECREASED
  - preferred_term: double-strand break repair
    term:
      id: GO:0006302
      label: double-strand break repair
    modifier: DECREASED
  cell_types:
  - preferred_term: skin fibroblast
    term:
      id: CL:0002620
      label: skin fibroblast
  downstream:
  - target: Genomic Instability
    description: >
      Chronic low-grade destabilization of replication forks drives accumulation
      of chromosomal aberrations.
  - target: Accelerated Replicative Senescence
    description: >
      Slowed replication and restricted replicative potential exhaust the
      proliferative capacity of WS cells.
  evidence:
  - reference: PMID:903377
    reference_title: "A retarded rate of DNA replication and normal level of DNA repair in Werner's syndrome fibroblasts in culture."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "only the elongation rate of DNA chains, estimated by the molecular weight increase, was significantly slower during early passages in WS cells than in normal Hayflick Phase II fibroblasts"
    explanation: >-
      Direct measurement showing that DNA chain elongation, not repair capacity,
      is the defective step in WS fibroblasts.
  - reference: PMID:903377
    reference_title: "A retarded rate of DNA replication and normal level of DNA repair in Werner's syndrome fibroblasts in culture."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "Five WS strains exhibited normal levels of sensitivity toward X-ray and UV killings and repair of X-ray induced single strand breaks of DNA (rejoining) and UV damage to DNA (unscheduled DNA synthesis)."
    explanation: >-
      Negative result delimiting the defect: excision and single-strand break
      repair are intact, so this node should not be read as a global repair
      failure.
  - reference: PMID:26993153
    reference_title: "Werner syndrome: Clinical features, pathogenesis and potential therapeutic interventions."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Biochemical and cell biological studies during the past decade have demonstrated involvements of the WRN protein in multiple DNA transactions, including DNA repair, recombination, replication and transcription."
    explanation: >-
      Summarizes the multiple DNA transactions that lose WRN support, motivating
      this node as the shared consequence of the molecular lesion.
- name: Telomere Maintenance Failure
  biological_scale: MOLECULAR
  conforms_to: "telomere_attrition#Progressive Telomere Attrition"
  description: >
    Telomeric TTAGGG repeats form G-quadruplex structures that are preferred WRN
    substrates, and telomere replication requires resolution of four-way junctions
    at D- and T-loops. In the absence of WRN these structures persist, the G-rich
    strand is replicated late or incompletely, and telomere repeats are lost from
    individual sister chromatids. This node is what converts a cell-autonomous
    replication defect into a clock: the mouse genetics show that WRN loss alone
    is nearly silent while telomeres remain long, and that the WS phenotype
    appears only once telomere reserves are exhausted.
  biological_processes:
  - preferred_term: telomere maintenance
    term:
      id: GO:0000723
      label: telomere maintenance
    modifier: DECREASED
  downstream:
  - target: Accelerated Replicative Senescence
    description: >
      Critically short, unprotected telomeres trigger a persistent DNA damage
      response and senescence.
  - target: Genomic Instability
    description: >
      Uncapped telomeres promote chromosomal end fusions and telomere sister
      chromatid exchange.
  evidence:
  - reference: PMID:15235603
    reference_title: "Essential role of limiting telomeres in the pathogenesis of Werner syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "we show that the varied and complex cellular phenotypes of Werner syndrome are precipitated by exhaustion of telomere reserves in mice"
    explanation: >-
      Mouse genetics establish telomere exhaustion as the event that precipitates
      the WS cellular phenotype.
  - reference: PMID:15235603
    reference_title: "Essential role of limiting telomeres in the pathogenesis of Werner syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The capacity of enforced telomerase expression to rescue premature senescence of cultured cells from individuals with Werner syndrome"
    explanation: >-
      Telomerase rescue of WS patient cells is the reciprocal experiment placing
      telomere attrition upstream of the senescence phenotype.
  - reference: PMID:26993153
    reference_title: "Werner syndrome: Clinical features, pathogenesis and potential therapeutic interventions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A role of the WRN protein in telomere maintenance could explain many of the WS phenotypes."
    explanation: >-
      Review-level statement of the telomere hypothesis as the unifying account
      of the WS phenotype.
- name: Genomic Instability
  biological_scale: CELLULAR
  conforms_to: "genomic_instability_aging#Accumulation of Somatic Mutations and Genomic Damage"
  description: >
    WS cells display "variegated translocation mosaicism" — multiple, variable,
    predominantly stable chromosomal rearrangements differing between clones —
    together with elevated telomere sister chromatid exchange and increased common
    fragile site expression. This is the mutator phenotype that underlies the WS
    cancer predisposition, and it is the shared feature that groups WS with the
    other RecQ disorders (Bloom syndrome, Rothmund-Thomson syndrome) as
    chromosomal instability syndromes.
  biological_processes:
  - preferred_term: DNA repair
    term:
      id: GO:0006281
      label: DNA repair
    modifier: ABNORMAL
  downstream:
  - target: Cancer Predisposition with Mesenchymal Weighting
    description: >
      Accumulated chromosomal aberrations drive clonal evolution toward the
      characteristic WS neoplasm spectrum.
  evidence:
  - reference: PMID:23573208
    reference_title: "Spectrum and risk of neoplasia in Werner syndrome: a systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Werner syndrome (WS) is an autosomal recessive genetic instability"
    explanation: >-
      Systematic review characterizes WS as a genetic instability syndrome, the
      framing this node encodes.
  - reference: PMID:15235603
    reference_title: "Essential role of limiting telomeres in the pathogenesis of Werner syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "as well as increased chromosomal instability and cancer, particularly nonepithelial malignancies typical of Werner syndrome"
    explanation: >-
      The telomere-depleted mouse model reproduces both the chromosomal
      instability and the nonepithelial (mesenchymal) tumor bias of human WS.
- name: Accelerated Replicative Senescence
  biological_scale: CELLULAR
  conforms_to: "cellular_senescence#Senescence-Associated Cell Cycle Arrest"
  description: >
    WS fibroblasts have a markedly restricted replicative lifespan and reduced
    plating efficiency relative to normal fibroblasts cultured in parallel, and
    accumulate DNA damage foci. Premature exhaustion of the proliferative reserve
    of mesenchymal and other renewable cell populations is the cellular event most
    directly connected to the progeroid tissue phenotypes. Crucially, this arm is
    telomere-dependent rather than a direct consequence of WRN loss: enforced
    telomerase expression rescues it.
  biological_processes:
  - preferred_term: replicative senescence
    term:
      id: GO:0090399
      label: replicative senescence
    modifier: INCREASED
  cell_types:
  - preferred_term: skin fibroblast
    term:
      id: CL:0002620
      label: skin fibroblast
  downstream:
  - target: Segmental Progeroid Tissue Failure
    description: >
      Loss of proliferative reserve in renewable tissues manifests as the
      accelerated-aging phenotypes of WS.
  evidence:
  - reference: PMID:903377
    reference_title: "A retarded rate of DNA replication and normal level of DNA repair in Werner's syndrome fibroblasts in culture."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "plating efficiencies as well as the replicative potentials of five WS strains were more limited than those of normal cells under the identical culture conditions"
    explanation: >-
      Directly measures the restricted replicative potential of WS fibroblasts
      against normal controls in the same culture conditions.
  - reference: PMID:15235603
    reference_title: "Essential role of limiting telomeres in the pathogenesis of Werner syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "This mouse model also showed accelerated replicative senescence and accumulation of DNA-damage foci in cultured cells"
    explanation: >-
      Confirms accelerated replicative senescence and DNA damage focus
      accumulation in the telomere-limited Wrn-null model.
- name: Segmental Progeroid Tissue Failure
  biological_scale: ORGANISM
  conforms_to: "genomic_instability_aging#DNA-Damage-Driven Cellular Dysfunction and Aging"
  description: >
    The organismal phenotype is segmental rather than global: some age-related
    changes are strikingly accelerated (cataract, hair graying and loss, skin
    atrophy, osteoporosis, atherosclerosis, type 2 diabetes) while others
    characteristic of normal aging are absent — Alzheimer-type dementia and
    increased amyloid deposition are not features, and the osteoporosis is worse
    in distal limb bones than in the vertebral column, the reverse of ordinary
    aging. The segmental pattern is a substantive constraint on the "accelerated
    aging" framing and should not be smoothed over: WS is not normal aging run
    fast.
  downstream:
  - target: Cancer Predisposition with Mesenchymal Weighting
    description: >
      The progeroid tissue environment coexists with, rather than causes, the
      neoplasia risk; both derive from the shared upstream instability.
  evidence:
  - reference: PMID:26993153
    reference_title: "Werner syndrome: Clinical features, pathogenesis and potential therapeutic interventions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Werner syndrome (WS) is a prototypical segmental progeroid syndrome characterized by multiple features consistent with accelerated aging."
    explanation: >-
      Establishes the segmental progeroid framing that this node encodes.
  - reference: PMID:15235603
    reference_title: "Essential role of limiting telomeres in the pathogenesis of Werner syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "telomere dysfunction elicits a classical Werner-like premature aging syndrome typified by premature death, hair graying, alopecia, osteoporosis, type II diabetes and cataracts"
    explanation: >-
      Enumerates the specific organismal features recapitulated when telomere
      reserves are exhausted in a Wrn-null background.
- name: Cancer Predisposition with Mesenchymal Weighting
  biological_scale: ORGANISM
  description: >
    WS confers a strong, type-specific predisposition to a narrow set of
    neoplasms rather than a general increase in cancer. Six tumor types —
    thyroid neoplasms, malignant melanoma, meningioma, soft tissue sarcoma,
    leukemia and pre-leukemic marrow conditions, and primary bone neoplasms —
    account for about two-thirds of all reported neoplasms in WS patients, and
    the standardized incidence ratios in Japan-resident patients are elevated for
    all of these except leukemia. The mesenchymal and neural-crest weighting is
    the mechanistically informative part: it is the opposite of the
    epithelial-dominated spectrum of ordinary aging, and is thought to reflect
    both differential dependence on WRN across lineages and the propensity of
    sarcomas to maintain telomeres by the recombination-based ALT pathway that
    WRN normally suppresses.
  downstream: []
  evidence:
  - reference: PMID:23573208
    reference_title: "Spectrum and risk of neoplasia in Werner syndrome: a systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most frequent neoplasms in WS patients, representing 2/3 of all reports, were thyroid neoplasms, malignant melanoma, meningioma, soft tissue sarcomas, leukemia and pre-leukemic conditions of the bone marrow, and primary bone neoplasms."
    explanation: >-
      Defines the WS neoplasm spectrum from a study population of 189 patients
      with 248 neoplasms.
  - reference: PMID:23573208
    reference_title: "Spectrum and risk of neoplasia in Werner syndrome: a systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cancer risk defined by SIRs was significantly elevated in Japan-resident WS patients for the six most frequent neoplasms except leukemia"
    explanation: >-
      Quantifies the risk elevation and records the leukemia exception, which
      this node preserves rather than generalizing away.
phenotypes:
- category: Ophthalmologic
  name: Bilateral Cataracts
  description: >
    Bilateral posterior subcapsular cataracts requiring surgery develop in
    virtually all WS patients by the late 20s or early 30s. The posterior
    subcapsular location distinguishes them from the nuclear cataracts typical of
    normal aging — one of the discordances between WS and ordinary senescence.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Bilateral posterior subcapsular cataract
    term:
      id: HP:0000518
      label: Cataract
  evidence:
  - reference: PMID:7712642
    reference_title: "Werner's syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Rapidly progressing bilateral cataracts typically occur when patients are in their 20s and 30s."
    explanation: >-
      Establishes bilateral cataracts with third-decade onset as a cardinal WS
      feature.
  - reference: PMID:26993153
    reference_title: "Werner syndrome: Clinical features, pathogenesis and potential therapeutic interventions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cardinal signs include bilateral cataracts (present in 99% of WS cases), premature graying and/or thinning of scalp hair (100%), characteristic dermatologic changes (96%) and short stature (95%)"
    explanation: >-
      Dedicated frequency evidence for the VERY_FREQUENT band on this phenotype:
      all four cardinal signs are reported at 95-100% in the WS registry cohort.

- name: Senescence-Associated Adipogenic Failure
  biological_scale: CELLULAR
  description: >-
    Adipose stromal vascular fraction from one person with WS showed premature
    senescence, increased SASP genes, suppressed adipogenesis, and impaired insulin
    signaling relative to one healthy donor. Four-patient imaging and clamp data
    associated subcutaneous fat loss with insulin resistance. The cellular
    comparison is informative but very small.
  downstream:
  - target: Loss of Subcutaneous Adipose Tissue in Limbs
    description: >-
      The patient-cell and imaging study directly connects failed adipogenesis
      with loss of the subcutaneous fat compartment.

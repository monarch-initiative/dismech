  - preferred_term: vascular endothelial cell
  - preferred_term: vascular smooth muscle cell
  cell_source: Patient-derived and healthy-control iPSCs, plus CRISPR-corrected WS iPSCs
  culture_system: Two-dimensional macrophage-endothelial and macrophage-smooth-muscle co-culture
  conditions:
  - WRN-deficient Werner syndrome
  - healthy control
  - gene-corrected isogenic Werner syndrome control
  - oxidized LDL stimulation
  publication: PMID:38858384
  modeled_mechanisms:
  - target: Retrotransposon-Derived dsRNA Accumulation in WS Macrophages
    description: >-
      RNA-seq, ATAC-seq, chromatin profiling, and gene correction assay the
      retrotransposon/RNA-sensing arm in WS macrophages.
    evidence:

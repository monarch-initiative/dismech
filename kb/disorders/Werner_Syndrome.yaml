  - reference: PMID:26993153
    reference_title: "Werner syndrome: Clinical features, pathogenesis and potential therapeutic interventions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cardinal signs include bilateral cataracts (present in 99% of WS cases), premature graying and/or thinning of scalp hair (100%), characteristic dermatologic changes (96%) and short stature (95%)"
    explanation: >-

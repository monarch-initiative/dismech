    reference_title: "Werner syndrome: Clinical features, pathogenesis and potential therapeutic interventions."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Werner syndrome (WS) is a prototypical segmental progeroid syndrome characterized by multiple features consistent with accelerated aging."
    explanation: >-

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Early findings (usually observed in the 20s) include premature graying and/or thinning of scalp hair, hoarseness, and scleroderma-like skin changes"
    explanation: >-
      Lists hoarseness among the early WS findings and dates its onset to the
      third decade.
- category: Integument
  name: Intractable Lower Extremity Ulcers
  description: >
    Indolent, deep, treatment-resistant ulcerations around the Achilles tendons
    and less frequently at the elbows are considered nearly pathognomonic of WS.
    They are associated with extensive subcutaneous calcification and often
    culminate in amputation of the foot or lower limb.
  phenotype_term:

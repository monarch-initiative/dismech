- name: Retrotransposon-Derived dsRNA Accumulation in WS Macrophages
  biological_scale: CELLULAR
  description: >-
    In WS iPSC-derived macrophages, reduced H3K9me3 is associated with
    retrotransposable-element derepression and cytoplasmic double-stranded RNA.
    This is a model-specific vascular-inflammatory mechanism and has not been
    demonstrated as a systemic causal intermediate in patients.
  downstream:
  - target: DHX58-Dependent Type I Interferon Inflammation
    description: >-

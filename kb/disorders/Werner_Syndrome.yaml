- category: Integument
  name: Alopecia
  description: >
    Progressive loss of scalp hair, up to baldness, accompanies the graying and
    contributes to the aged appearance.
  phenotype_term:
    preferred_term: Alopecia
    term:
      id: HP:0001596
      label: Alopecia

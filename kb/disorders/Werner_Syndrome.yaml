- category: Integument
  name: Scleroderma-like Skin Changes
  description: >
    Tight, atrophic, scleroderma-like skin with loss of subcutaneous fat,
    particularly over the limbs and face, producing the characteristic "pinched"
    facial appearance. This is frequently what brings the patient to a
    dermatologist and is a common source of diagnostic delay, since scleroderma
    itself is the first consideration.
  frequency: VERY_FREQUENT
  phenotype_term:

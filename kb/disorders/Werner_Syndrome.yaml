      evidence_source: IN_VITRO
      snippet: "RNA-sequencing (seq) and assay for transposase-accessible chromatin using sequencing (ATAC-seq) reveal accelerated type I IFN signaling and reduced chromatin accessibility in WS-iMφs."
      explanation: >-
        Multi-omic profiling directly supports the modeled macrophage state.
  - target: DHX58-Dependent Type I Interferon Inflammation
    description: >-
      Interferon silencing and vascular co-culture assay the causal inflammatory
      step and its endothelial/smooth-muscle consequences.
    evidence:

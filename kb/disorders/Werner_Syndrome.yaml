      reference_title: Retrotransposons in Werner syndrome-derived macrophages trigger type I interferon-dependent inflammation in an atherosclerosis model.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Silencing type I IFN signaling rescues proliferation and suppresses senescence and inflammation, suggesting atherosclerosis treatment in WS."
      explanation: >-

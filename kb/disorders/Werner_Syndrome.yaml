    reference_title: Senescence-associated inflammation and inhibition of adipogenesis in subcutaneous fat in Werner syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Adipose-derived stem cells from the stromal vascular fraction derived from WS subcutaneous adipose tissues (WSVF) showed early replicative senescence and a significant increase in the expression of senescence-associated secretory phenotype (SASP) markers."

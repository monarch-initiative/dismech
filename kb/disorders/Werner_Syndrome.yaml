animal_models:
- name: Telomere-limited Wrn-null mouse (mTerc-/- Wrn-/-)
  species: Mouse
  genotype: Wrn-/- Terc-/- (late generation)
  publication: PMID:15235603
  description: >
    Wrn-null mice on a telomerase-proficient background are essentially
    unaffected, which for years made WS look untranslatable to the mouse. Crossing
    Wrn deficiency onto a Terc-null background and breeding to late generations
    exhausts the mouse's long telomere reserve and unmasks a Werner-like syndrome.
    The model demonstrates that telomere reserve is rate-limiting in this
    engineered mouse background; it does not by itself establish telomere
    attrition as the primary human organismal trigger.
  modeled_mechanisms:
  - target: Telomere Maintenance Failure
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >
      Late-generation double-null mice demonstrate that telomere exhaustion can
      precipitate a Werner-like phenotype from Wrn loss in this engineered model.
    limitations: >-
      The requirement for an engineered telomerase-null background is itself a
      species difference: laboratory mice have telomeres far longer than humans,
      so the model reconstructs a human baseline rather than reproducing one.
      Conclusions about the ordering of events transfer better than conclusions
      about rates.
    evidence:
    - reference: PMID:15235603
      reference_title: "Essential role of limiting telomeres in the pathogenesis of Werner syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "the lack of a disease phenotype in Wrn-deficient mice with long telomeres implicate telomere attrition in the pathogenesis of Werner syndrome"
      explanation: >-
        States the negative result in long-telomere Wrn-null mice that motivates
        the telomere-limited cross.
  - target: Segmental Progeroid Tissue Failure
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >
      The double-null mice develop premature death, hair graying, alopecia,
      osteoporosis, type II diabetes and cataracts.
    limitations: >-
      Recapitulation is of the progeroid features as a set; the model has not been
      shown to reproduce the specifically WS-discordant distribution
      (distal-predominant osteoporosis, posterior subcapsular rather than
      nuclear cataract) that distinguishes WS from ordinary aging in humans.
    readouts:
    - name: Werner-like premature aging phenotype
      target: Segmental Progeroid Tissue Failure
      direction: INCREASED
      interpretation: >-
        Appearance of the progeroid feature set in late-generation double-null
        mice but not in Wrn-null mice with long telomeres.
      evidence:
      - reference: PMID:15235603
        reference_title: "Essential role of limiting telomeres in the pathogenesis of Werner syndrome."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "telomere dysfunction elicits a classical Werner-like premature aging syndrome typified by premature death, hair graying, alopecia, osteoporosis, type II diabetes and cataracts"
        explanation: Reports the specific progeroid features scored in the model.
    evidence:
    - reference: PMID:15235603
      reference_title: "Essential role of limiting telomeres in the pathogenesis of Werner syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In late-generation mice null with respect to both Wrn and Terc (encoding the telomerase RNA component)"
      explanation: >-
        Defines the genotype and generation requirement for the model to be
        informative.
- name: Wrn-null mouse on a telomerase-proficient background
  species: Mouse
  genotype: Wrn-/-
  publication: PMID:15235603
  description: >
    The simple Wrn knockout, which does not develop an overt progeroid phenotype.
    Recorded here as an explicit negative result rather than omitted, because the
    absence of a phenotype is itself the informative finding.
  modeled_mechanisms:
  - target: Segmental Progeroid Tissue Failure
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >
      Wrn deficiency alone does not produce a Werner-like syndrome in mice with
      long telomeres.
    limitations: >-
      The failure is attributable to the mouse's long telomere reserve rather than
      to WRN having a different function in mice, so this model should not be
      cited as evidence against a WRN-centred mechanism in humans — only against a
      telomere-independent one.
    evidence:
    - reference: PMID:15235603
      reference_title: "Essential role of limiting telomeres in the pathogenesis of Werner syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "the lack of a disease phenotype in Wrn-deficient mice with long telomeres"
      explanation: >-
        Directly reports the absence of a disease phenotype in the single-null
        model.
discussions:
- discussion_id: mismatch_wrn_mouse_telomere_reserve
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does the requirement for a telomerase-null background in the mouse mean that
    telomere attrition is the true rate-limiting step in human WS, or only that
    mice need their telomere advantage removed before any WRN-dependent
    phenotype can be seen?
  attaches_to:
  - pathophysiology#Telomere Maintenance Failure
  - pathophysiology#Segmental Progeroid Tissue Failure
  rationale: >
    Wrn-null mice with long telomeres are phenotypically normal, and a Werner-like
    syndrome appears only in late-generation mTerc-/- Wrn-/- animals. Two readings
    are compatible with this. Under the first, telomere attrition is genuinely the
    rate-limiting step and the mouse cross simply restores a human-like telomere
    baseline; the hTERT rescue of WS patient fibroblasts supports this. Under the
    second, the mouse has redundant RecQ or telomere-protection capacity that
    humans lack, and the telomerase-null background unmasks a phenotype whose
    human rate-limiting step is elsewhere — for instance in replication fork
    recovery at non-telomeric loci, which the mouse experiments did not assess.
    The two readings diverge on whether telomere-directed intervention would be
    disease-modifying in patients, so the distinction is not academic. Note also
    that the Wrn helicase-domain-deletion mouse has a mild phenotype and a
    10-15% shorter median lifespan where the full null does not, raising the
    separate possibility of a dominant-negative contribution from
    helicase-dead protein that a pure loss-of-function model cannot capture.
  proposed_experiments:
  - experiment_id: exp_ws_htert_nontelomeric_damage_burden
    name: Non-telomeric damage burden in hTERT-rescued WS fibroblasts
    description: >
      hTERT immortalization abolishes the proliferative defect of WS fibroblasts,
      but whether it also normalizes damage accumulation at non-telomeric DNA has
      not been assessed. Quantifying genome-wide damage foci, common fragile site
      expression and replication fork progression in matched WS and WS-hTERT
      fibroblasts would separate the two readings: full normalization supports
      telomeres as rate-limiting, while a persisting non-telomeric defect implies
      the mouse cross unmasks rather than reproduces the human mechanism.
- discussion_id: gap_ws_mesenchymal_tumor_spectrum
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why is the WS neoplasm spectrum mesenchymally weighted rather than resembling
    the epithelial-dominated cancer spectrum of ordinary aging?
  attaches_to:
  - pathophysiology#Cancer Predisposition with Mesenchymal Weighting
  rationale: >
    If WS were simply accelerated aging, its tumor spectrum should be a
    time-shifted version of the general-population spectrum. It is not: sarcomas,
    melanoma, meningioma and thyroid neoplasms dominate, with standardized
    incidence ratios up to 53.5-fold. Two non-exclusive explanations are current —
    differential WRN dependence across lineages and cell-turnover rates, and the
    preferential use by sarcomas of the recombination-based ALT telomere
    maintenance pathway that WRN normally suppresses. Neither has been tested in a
    way that would apportion the effect, and the discrepancy is a standing
    argument against reading WS as a general model of aging.
- discussion_id: gap_nr_empower_replication
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Do the vascular-stiffness and skin-ulcer signals from EMPOWER replicate in a
    larger parallel-group trial with washout-independent clinical endpoints?
  attaches_to:
  - treatments#Nicotinamide Riboside (EMPOWER Early-Phase Trial)
  - clinical_trials#jRCTs031190141
  rationale: >-
    EMPOWER provides randomized, double-blind crossover evidence, but only nine
    participants were randomized and six completed. There was no washout, all
    three participants contributing ulcer measurements received NR first, the
    right ankle-brachial index worsened statistically, and prespecified metabolic,
    sarcopenia, blood-pressure, and kidney-function markers did not improve. A
    larger trial should prioritize durable ulcer healing, validated vascular and
    patient-reported endpoints, sufficient washout, and an analysis robust to
    dropout before NR is regarded as disease-modifying care.
  proposed_experiments:
  - experiment_id: exp_ws_nr_parallel_replication
    name: Multicenter parallel-group NR replication trial
    description: >-
      Randomize a multicenter molecularly confirmed WS cohort to NR or placebo
      with blinded ulcer adjudication, prespecified vascular endpoints, adequate
      follow-up, and pharmacodynamic NAD+ measurements.
- discussion_id: gap_wrn108_translational_model
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Can genotype-restricted WRN-108 produce durable chronic-ulcer healing without
    unacceptable long-term on-target or off-target toxicity?
  attaches_to:
  - treatments#WRN-108 Genotype-Restricted Exon-Skipping ASO
  - experimental_models#c.3139-1G>C Werner Fibroblast WRN-108 Rescue Model
  rationale: >-
    WRN-108 restores an in-frame WRN transcript, partial protein expression, and
    nuclear localization in c.3139-1G>C patient fibroblasts. The animal work
    establishes dermal exposure and, in one primate, local exon skipping, but no
    model combines the human splice allele with a WS chronic-ulcer phenotype and
    no wound-healing efficacy endpoint was tested. The candidate is restricted to
    a defined splice-genotype subgroup; chronic dosing, wild-type transcript
    effects, and systemic safety remain unresolved.
  proposed_experiments:
  - experiment_id: exp_wrn108_humanized_ulcer_model
    name: Humanized c.3139-1G>C chronic-ulcer efficacy and safety study
    description: >-
      Test repeated dermal dosing in a model carrying the human target sequence
      and a reproducible WS-like wound phenotype, with healing, biodistribution,
      wild-type splice, immunogenicity, and long-term toxicology readouts.
- discussion_id: gap_rte_ifn_patient_vessel_validation
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does macrophage RTE-dsRNA–DHX58–type-I-interferon signaling drive vascular
    disease in patient vessels and in vivo, beyond the iPSC co-culture system?
  attaches_to:
  - pathophysiology#Retrotransposon-Derived dsRNA Accumulation in WS Macrophages
  - pathophysiology#DHX58-Dependent Type I Interferon Inflammation
  - experimental_models#Werner Syndrome iPSC-Derived Macrophage-Vascular Co-Culture
  rationale: >-
    Patient, control, and gene-corrected iPSC-derived cells plus pathway silencing
    support a causal chain within the co-culture. Whether the same macrophage
    state exists in human arterial lesions, precedes clinical atherosclerosis, or
    can be inhibited without impairing host defense has not been established.
  proposed_experiments:
  - experiment_id: exp_ws_vessel_rte_ifn_validation
    name: Spatial validation of RTE–IFN signaling in WS vessels
    description: >-
      Combine spatial transcriptomics and dsRNA/IFN-pathway imaging in WS vascular
      tissue with lineage-resolved perturbation in an in vivo or vascular-organoid
      model.
- discussion_id: gap_ws_renal_trajectory_measurement
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    How much of the longitudinal creatinine-based eGFR decline in WS represents
    renal injury rather than bias from low muscle mass and body-size indexing?
  attaches_to:
  - phenotypes#Decreased Muscle Mass and Sarcopenic Physique
  - treatments#Cancer Surveillance and Complication-Directed Management
  rationale: >-
    The registry observed declining creatinine-based eGFR, but WS combines short
    stature, limb lipoatrophy, and sarcopenia, making creatinine production and
    body-surface-area normalization unusually problematic. Cystatin-C and
    unindexed estimates can disagree with standard eGFR; resolving the true renal
    trajectory matters for surveillance and drug dosing.
  proposed_experiments:
  - experiment_id: exp_ws_measured_gfr_longitudinal
    name: Longitudinal measured-GFR and body-composition cohort
    description: >-
      Compare measured GFR, creatinine, cystatin C, unindexed estimates, albuminuria,
      imaging, and quantitative muscle mass longitudinally in molecularly confirmed
      WS.
notes: >
  Scope and framing caveats a curator should preserve:

  Segmental, not global. WS is routinely described as "accelerated aging", and
  the entry uses that framing because the literature does, but the phenotype is
  explicitly segmental. Alzheimer-type dementia and increased amyloid deposition
  are not features of WS; osteoporosis is distal-predominant rather than
  vertebral; cataracts are posterior subcapsular rather than nuclear; and the
  cancer spectrum is mesenchymal rather than epithelial. Intellectual disability,
  dysmorphology and skeletal anomalies are not WS features and, when present, are
  attributed to co-existing disorders. Any downstream use of this entry as an
  aging model should carry these discordances with it.

  Atypical Werner syndrome is a distinct entity with its own MONDO class,
  MONDO:0019321, defined by the ABSENCE of a WRN lesion in a clinically
  WS-like patient. It is genetically heterogeneous — LMNA is the best-known but
  not the only arm — so it cannot be a has_subtypes entry here: a residual
  category defined by not having this disease's causal lesion shares only a
  clinical gestalt with it, not a proximal mechanism. It is recorded as a
  differential rather than folded in; LMNA-related cases overlap the existing
  laminopathy neighbourhood (Hutchinson-Gilford_Progeria_Syndrome). Confirmation
  of a classical WS diagnosis requires WRN gene testing.

  Module wiring: this entry conforms to the AGING-facing genomic_instability_aging
  module, not the cancer-facing genome_instability_mutation module. That module's
  own notes name Werner among its natural conformers and say explicitly not to
  duplicate the cancer arm there. Xeroderma_Pigmentosum is the closest structural
  precedent — likewise a DNA-repair-deficiency disorder with cancer predisposition
  that wires its core chain to the aging arm. Similarly, the telomere node attaches
  to telomere_attrition (maintenance FAILURE) and deliberately not to the
  hallmark-of-cancer module enabling_replicative_immortality, which models
  telomere-maintenance REACTIVATION — the opposite direction; wiring both would
  assert two contradictory things about the same biology.

  Module expansion is evidence-scoped. The mitochondrial/mitophagy and
  adipose-stem-cell arms are now represented by evidenced nodes, as are the
  macrophage retrotransposon–interferon and SHOX-G-quadruplex mechanisms. Broader
  claims about a global epigenetic clock or organism-wide stem-cell exhaustion
  remain outside the curated graph. The macrophage heterochromatin signal is
  encoded only as the experimentally tested RTE-dsRNA arm, not generalized to all
  tissues.

  The genotype-restricted WRN-108 chain conforms to the antisense-oligonucleotide
  splice-redirection module because its trigger, splice-effector state, and
  restored transcript/protein state are all explicitly curated. That module edge
  does not imply clinical efficacy; the evidence remains cellular, dermal-PK, and
  single-animal target engagement.

  Causal phenotype connectivity is deliberately partial. Registry frequency
  establishes that scleroderma-like skin change, soft-tissue calcification,
  truncal adiposity, characteristic facies and voice, ulcers, sarcopenia,
  dyslipidemia, steatosis, hypertension, and hypogonadism occur in WS; it does not
  establish their proximate routes from WRN loss. Those manifestations remain
  unwired rather than being forced through the broad segmental-tissue-failure
  node. Cancer phenotypes are wired only from genomic-instability-driven cancer
  predisposition, never from tissue failure.

  RecQ siblings. WS completes the RecQ-helicase triad already partly in the KB
  alongside Bloom_Syndrome (BLM) and Rothmund-Thomson_Syndrome (RECQL4).

  The WRN mouse discordance is recorded as a HUMAN_MODEL_MISMATCH above rather
  than being resolved in the pathograph.

  Reverse-direction relevance to oncology. WRN helicase activity — the function
  lost in WS — is a synthetic lethal dependency in microsatellite-unstable
  cancers, where WRN depletion induces double-strand breaks, apoptosis and cell
  cycle arrest while sparing microsatellite-stable models. Notably the dependency
  requires the helicase but not the exonuclease activity, mirroring the human
  genetics in which helicase-dead missense alleles produce a full WS phenotype.
  This is not a treatment for WS and is deliberately not curated in treatments:
  it is sporadic-cancer pharmacology that happens to target the WS gene, and
  conflating the two would imply WRN inhibition is therapeutic in a disease
  caused by WRN loss. See PMID:30971823.

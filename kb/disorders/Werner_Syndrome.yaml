  - reference: PMID:15235603
    reference_title: "Essential role of limiting telomeres in the pathogenesis of Werner syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "telomere dysfunction elicits a classical Werner-like premature aging syndrome typified by premature death, hair graying, alopecia, osteoporosis, type II diabetes and cataracts"
    explanation: >-
      Enumerates the specific organismal features recapitulated when telomere
      reserves are exhausted in a Wrn-null background.
- name: Cancer Predisposition with Mesenchymal Weighting
  biological_scale: ORGANISM
  description: >
    WS confers a strong, type-specific predisposition to a narrow set of
    neoplasms rather than a general increase in cancer. Six tumor types —
    thyroid neoplasms, malignant melanoma, meningioma, soft tissue sarcoma,
    leukemia and pre-leukemic marrow conditions, and primary bone neoplasms —
    account for about two-thirds of all reported neoplasms in WS patients, and
    the standardized incidence ratios in Japan-resident patients are elevated for
    all of these except leukemia. The mesenchymal and neural-crest weighting is
    the mechanistically informative part: it is the opposite of the
    epithelial-dominated spectrum of ordinary aging. The lineage bias remains
    mechanistically unresolved and should not be attributed to a specific
    telomere-maintenance pathway without direct evidence.
  downstream:
  - target: Neoplasm
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Thyroid Carcinoma
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Malignant Melanoma
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Soft Tissue Sarcoma
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Meningioma
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Osteosarcoma
    description: >-
      Osteosarcoma is retained as a narrower, registry-documented member of the
      broader primary-bone-neoplasm spectrum.
    evidence:
    - reference: PMID:33373317
      reference_title: "Time gap between the onset and diagnosis in Werner syndrome: a nationwide survey and the 2020 registry in Japan."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "comprised lung cancer, lung adenocarcinoma, undifferentiated pleomorphic sarcoma, fibrosarcoma, osteosarcoma, colorectal cancer, follicular thyroid cancer, and melanoma."
      explanation: >-
        The modern registry explicitly names osteosarcoma, avoiding an inference
        from the systematic review's broader primary-bone-neoplasm category.
  evidence:
  - reference: PMID:23573208
    reference_title: "Spectrum and risk of neoplasia in Werner syndrome: a systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most frequent neoplasms in WS patients, representing 2/3 of all reports, were thyroid neoplasms, malignant melanoma, meningioma, soft tissue sarcomas, leukemia and pre-leukemic conditions of the bone marrow, and primary bone neoplasms."
    explanation: >-
      Defines the WS neoplasm spectrum from a study population of 189 patients
      with 248 neoplasms.
  - reference: PMID:23573208
    reference_title: "Spectrum and risk of neoplasia in Werner syndrome: a systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cancer risk defined by SIRs was significantly elevated in Japan-resident WS patients for the six most frequent neoplasms except leukemia"
    explanation: >-

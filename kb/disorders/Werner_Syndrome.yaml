- name: DHX58-Dependent Type I Interferon Inflammation
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    RNA sensing in WS iPSC-derived macrophages drives type I interferon signaling,
    senescence, and inflammatory effects on co-cultured endothelial and vascular
    smooth-muscle cells. Interferon silencing reverses cellular readouts, but the
    experiment is a non-animal model rather than a clinical intervention.
  downstream:
  - target: Premature Atherosclerosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      This provisional, model-extrapolated edge places the macrophage inflammatory
      state upstream of endothelial dysfunction and smooth-muscle switching in a
      two-dimensional co-culture; it does not establish lesion formation in
      patients.
    evidence:

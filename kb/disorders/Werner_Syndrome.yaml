- category: Otolaryngologic
  name: Hoarseness
  description: >
    A high-pitched, weak or hoarse voice is one of the early WS findings,
    appearing in the 20s alongside the premature graying and the
    scleroderma-like skin changes. It is easy to overlook against the more
    striking dermatologic and ocular features, but it belongs to the same early
    window and is documented in over 10% of patients.
  phenotype_term:
    preferred_term: Hoarse voice

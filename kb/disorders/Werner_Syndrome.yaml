    explanation: >-
      GeneReviews lists bosentan as the targeted therapy for WS lower-extremity
      ulcers and states its vasodilatory mechanism.
- name: Genetic Counseling
  description: >
    WS is autosomal recessive, so counseling of an affected proband's family turns
    on sib recurrence risk and on the testing options that molecular confirmation
    unlocks. Because sibs of a proband are themselves at 25% risk and WS is
    diagnosed late, GeneReviews additionally recommends evaluating apparently
    asymptomatic older and younger sibs, so that surveillance and preventive
    measures start before manifestations accumulate.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:20301687
    reference_title: Werner Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "each sib of an affected individual has at conception a 25% chance of being affected, a 50% chance of being an asymptomatic carrier, and a 25% chance of being unaffected and not a carrier"
    explanation: >-
      Gives the autosomal recessive recurrence risks that are the substance of
      counseling for this disorder.
  - reference: PMID:20301687
    reference_title: Werner Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Evaluate apparently asymptomatic older and younger sibs of an affected individual in order to identify as early as possible those who would benefit from prompt initiation of treatment and preventive measures."
    explanation: >-
      Supports the at-risk-relative evaluation recommendation, which is
      counseling-initiated rather than proband-directed care.
- name: Risk-Factor Avoidance
  description: >
    Avoidance recommendations in WS are not generic lifestyle advice: they are
    targeted at the specific acquired diseases that kill WS patients or cause the
    signature morbidity. Smoking and obesity are avoided for atherosclerosis
    (myocardial infarction being one of the two leading causes of death); smoking
    and alcohol for osteoporosis and cataracts, both of which arrive decades
    early; and falls, extremity trauma and excessive sun exposure because
    extremity trauma is what seeds the intractable ulcers.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: behavioral counseling
    term:
      id: NCIT:C181743
      label: Behavioral Counseling
  evidence:
  - reference: PMID:20301687
    reference_title: Werner Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Avoid smoking and obesity, which increase the risk for atherosclerosis. Avoid smoking and alcohol, which increase the risk of osteoporosis and cataracts. Avoid falls, trauma to the extremities, and excessive sun exposure."
    explanation: >-
      States the agents and circumstances to avoid, each tied to the WS
      complication it accelerates.
- name: Cataract Surgery
  description: >
    Extraction of the bilateral posterior subcapsular cataracts, typically
    required around age 31. It is the single most consistently needed
    intervention in WS.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  evidence:
  - reference: PMID:26993153
    reference_title: "Werner syndrome: Clinical features, pathogenesis and potential therapeutic interventions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bilateral cataracts requiring surgery are seen in virtually all cases by the late 20s or early 30s"
    explanation: >-
      Establishes cataract surgery as a near-universal requirement in WS.
- name: Cancer Surveillance and Complication-Directed Management
  description: >
    There is no curative or disease-modifying therapy. Management consists of
    treating manifestations, preventing secondary complications, and screening for
    the acquired diseases common in WS — in practice, surveillance weighted toward
    the six neoplasms that dominate the WS spectrum. Treatment otherwise follows
    general-population practice, with the important exception of cytotoxic
    chemotherapy: WS cells are hypersensitive to several classes of DNA-damaging
    agent, so regimens may need modification.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:7712642
    reference_title: "Werner's syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients should have a thorough clinical and laboratory work-up, keeping in mind their elevated risk for neoplasms."
    explanation: >-
      Supports neoplasm-directed surveillance as the core of WS clinical
      management.
  - reference: PMID:20301687
    reference_title: Werner Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Annual surveillance includes ophthalmologic examination for cataracts; dual-energy x-ray absorptiometry to assess bone density; assessment for signs/symptoms of hypogonadism; fasting glucose level, hemoglobin A1c, or oral glucose tolerance test"
    explanation: >-
      Specifies the annual surveillance schedule, which is broader than the
      neoplasm-directed work-up and is keyed to the WS complication set.
  - reference: PMID:20301687
    reference_title: Werner Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "skin examination for ulcers and lentiginous melanoma; ten-year atherosclerotic cardiovascular disease risk estimation, lipid profile, blood pressure, lifestyle counseling, and assessment for cardiovascular risk factors"
    explanation: >-
      Completes the annual schedule with the dermatologic and cardiovascular

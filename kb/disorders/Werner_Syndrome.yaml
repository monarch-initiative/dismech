genetic:
- name: WRN
  gene_term:
    preferred_term: WRN
    term:
      id: hgnc:12791
      label: WRN
  association: Causative
  inheritance:
  - name: Autosomal recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
  notes: >
    WRN (chromosome 8p12, 34 coding exons over 140 kb) encodes the 1,432-amino
    acid, 160 kDa WRN protein. It is the only gene in which mutations cause
    classical WS, and WS is the only disorder caused by WRN null mutations.
    Nearly 100 pathogenic variants have been reported; most are nonsense, small
    indel or splicing
    variants that truncate the protein and remove the C-terminal nuclear
    localization signal, and two exonuclease-domain missense variants
    (p.Lys125Asn, p.Lys135Glu) destabilize the protein and are functionally null.
    Two helicase-domain missense alleles (p.Gly574Arg, p.Arg637Trp) abolish or are
    predicted to abolish helicase activity and produce a phenotype
    indistinguishable from null, which is the human genetic evidence that helicase
    activity is the critical WRN function.
  evidence:
  - reference: PMID:8602509
    reference_title: "Positional cloning of the Werner's syndrome gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The gene responsible for WS (known as WRN) was identified by positional cloning."
    explanation: Establishes WRN as the causal gene for Werner syndrome.
  - reference: PMID:8602509
    reference_title: "Positional cloning of the Werner's syndrome gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Four mutations in WS patients were identified. Two of the mutations are splice-junction mutations"
    explanation: >-
      Documents the truncating/splicing character of the founding WRN disease
      alleles.
  - reference: PMID:26993153
    reference_title: "Werner syndrome: Clinical features, pathogenesis and potential therapeutic interventions."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "It is caused by null mutations of the WRN gene, which encodes a member of the RECQ family of DNA helicases."
    explanation: >-
      Confirms that WS-associated WRN alleles act as functional nulls.
  - reference: PMID:35534204
    reference_title: Targeted long-read sequencing identifies missing pathogenic variants in unsolved Werner syndrome cases.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To date, nearly 100 different pathogenic variants have been reported in individuals with WS worldwide."
    explanation: >-
      Updates the variant-count statement and preserves the distinction between
      molecularly diverse alleles and their predominantly functional-null effect.
diagnosis:
- name: Clinical Diagnostic Criteria (Four Cardinal Signs)
  description: >
    International Registry criteria classify a presentation as definite when all
    four cardinal signs — bilateral ocular cataracts, premature graying and/or
    thinning of scalp hair, characteristic dermatologic pathology, and short
    stature — occur with at least two additional signs. These historical clinical
    criteria are useful for recognition but do not replace molecular confirmation,
    especially before cataracts appear.
  diagnosis_term:
    preferred_term: clinical evaluation
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  results: >-
    Definite clinical criteria: all four cardinal signs plus at least two
    additional signs.
  evidence:
  - reference: PMID:20301687
    reference_title: Werner Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The diagnosis of Werner syndrome can be established in a proband with clinical diagnostic criteria (presence of all four cardinal signs: bilateral ocular cataracts, premature graying and/or thinning of scalp hair, characteristic dermatologic pathology, and short stature; and two additional characteristic signs)"
    explanation: >-
      States the clinical criteria verbatim, including the requirement for two
      additional signs beyond the four cardinal ones.
- name: WRN Molecular Genetic Testing
  description: >
    Identification of biallelic WRN pathogenic variants establishes the diagnosis
    independently of the clinical criteria. This matters more than a confirmatory
    test usually does in WS, because the clinical criteria are conjunctive and
    late-completing: a proband who has not yet developed cataracts cannot meet
    them, while the genotype is available from birth. It is also what makes the
    atypical, non-WRN progeroid presentations separable from WS proper. Sequence
    analysis should be followed by deletion/duplication or genome-scale analysis
    when needed. Biallelic variants of uncertain significance, or one
    pathogenic/likely pathogenic variant plus a VUS, do not establish the
    diagnosis.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  markers: Biallelic WRN pathogenic variants
  results: >-
    Biallelic WRN pathogenic variants establish the diagnosis; identification in
    the proband also enables carrier testing of relatives and prenatal or
    preimplantation genetic testing. If a compelling phenotype yields only one
    pathogenic coding allele, targeted long-read or genome sequencing can detect
    deep-intronic and structural second alleles missed by routine analysis.
  evidence:
  - reference: PMID:20301687
    reference_title: Werner Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "or biallelic WRN pathogenic variants identified by molecular genetic testing"
    explanation: >-
      States molecular confirmation as an alternative, independently sufficient
      route to the diagnosis.
  - reference: PMID:20301687
    reference_title: Werner Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Once the WRN pathogenic variants have been identified in an affected family member, carrier testing for at-risk relatives and prenatal/preimplantation genetic testing are possible."
    explanation: >-
      Supports the downstream family-testing options that follow from molecular
      confirmation in the proband.
  - reference: PMID:35534204
    reference_title: Targeted long-read sequencing identifies missing pathogenic variants in unsolved Werner syndrome cases.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The International Registry of Werner Syndrome has identified biallelic pathogenic variants in 179/188 cases of classical WS. In the remaining nine cases, only one heterozygous pathogenic variant has been identified."
    explanation: >-
      Defines the high-yield unresolved scenario: a classic phenotype with one
      detected pathogenic WRN allele.
  - reference: PMID:35534204
    reference_title: Targeted long-read sequencing identifies missing pathogenic variants in unsolved Werner syndrome cases.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a second pathogenic variant in eight of nine unsolved WS cases. In five cases, T-LRS identified intronic splice variants that were confirmed by either RT-PCR or exon trapping to affect splicing; in one case, T-LRS identified a 339 kbp deletion, and in two cases, pathogenic missense variants."
    explanation: >-
      Directly supports long-read escalation and shows why both noncoding splice
      variation and structural variation must be considered.
differential_diagnoses:
- name: Atypical Werner Syndrome
  description: >-
    Atypical Werner syndrome is a WRN-negative, genetically heterogeneous
    progeroid presentation rather than a subtype of classic Werner syndrome.
    Dominant LMNA and POLD1 variants are established causes within this residual
    clinical category.
  distinguishing_features:
  - Absence of biallelic pathogenic WRN variants argues against classic Werner syndrome.
  - LMNA- and POLD1-associated atypical presentations are generally dominant, unlike autosomal recessive WRN disease.
  - POLD1-related MDPL may include mandibular hypoplasia, deafness, progeroid features, and lipodystrophy.
  disease_term:
    preferred_term: atypical Werner syndrome
    term:
      id: MONDO:0019321
      label: atypical Werner syndrome
  evidence:
  - reference: PMID:26993153
    reference_title: "Werner syndrome: Clinical features, pathogenesis and potential therapeutic interventions."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "These patients were suspected to have WS on clinical grounds, but were found on subsequent analysis to lack WRN mutations."
    explanation: >-
      Directly supports separating the WRN-negative clinical mimic from classic
      biallelic-WRN Werner syndrome.
  - reference: PMID:26993153
    reference_title: "Werner syndrome: Clinical features, pathogenesis and potential therapeutic interventions."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The POLD1 mutations found in AWS are dominant heterozygous mutations, p.Ser605del and p.Arg507Cys, which perturb polymerase activity"
    explanation: >-
      Supplies a genetically distinct dominant cause within the atypical Werner
      category.
- name: Hutchinson-Gilford Progeria Syndrome
  description: >-
    HGPS overlaps through alopecia, sclerodermatous skin, lipoatrophy, and severe
    atherosclerosis, but begins in childhood and is usually caused by a de novo
    LMNA cryptic-splice variant producing progerin. Classic WS is adolescent/adult
    onset, autosomal recessive, and WRN-related, with bilateral cataracts and its
    distinctive tumor spectrum.
  distinguishing_features:
  - Childhood onset and failure to thrive favor HGPS over adult-onset Werner syndrome.
  - A de novo LMNA exon 11 cryptic-splice variant and progerin distinguish HGPS from biallelic WRN loss.
  - Bilateral posterior subcapsular cataracts and cancer predisposition favor Werner syndrome.
  disease_term:
    preferred_term: Hutchinson-Gilford progeria syndrome
    term:
      id: MONDO:0008310
      label: Hutchinson-Gilford progeria syndrome
  evidence:
  - reference: PMID:12714972
    reference_title: Recurrent de novo point mutations in lamin A cause Hutchinson-Gilford progeria syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "18 out of 20 classical cases of HGPS harboured an identical de novo (that is, newly arisen and not inherited) single-base substitution, G608G(GGC > GGT), within exon 11."
    explanation: >-
      The primary human genetic series supplies the de novo LMNA mechanism that
      separates HGPS from inherited WRN disease.
- name: Bloom Syndrome
  description: >-
    Bloom syndrome is another autosomal recessive RecQ-helicase
    cancer-predisposition disorder, but severe pre- and postnatal growth deficiency,
    photosensitivity, immune abnormalities, recurrent infections, and biallelic
    BLM variants distinguish it from adolescent-onset WS.
  distinguishing_features:
  - Severe prenatal growth deficiency and photosensitive facial erythema favor Bloom syndrome.
  - Immune deficiency and recurrent infections are characteristic of Bloom syndrome, not classic Werner syndrome.
  - Biallelic BLM variants and markedly increased sister-chromatid exchange distinguish Bloom syndrome molecularly.
  disease_term:
    preferred_term: Bloom syndrome
    term:
      id: MONDO:0008876
      label: Bloom syndrome
  evidence:
  - reference: PMID:20301572
    reference_title: Bloom Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Bloom syndrome (BSyn) is characterized by severe pre- and postnatal growth deficiency, immune abnormalities, sensitivity to sunlight, insulin resistance, and a high risk for many cancers that occur at an early age."
    explanation: >-
      GeneReviews directly states the early growth, immune, photosensitivity,
      metabolic, and cancer pattern used to distinguish Bloom syndrome.
- name: Rothmund-Thomson Syndrome
  description: >-
    Rothmund-Thomson syndrome overlaps through sparse hair, small stature,
    cataracts, and cancer predisposition. Its infantile poikiloderma, congenital
    skeletal abnormalities, and biallelic RECQL4 or ANAPC1 variants distinguish
    it from adult-onset WRN disease.
  distinguishing_features:
  - A facial rash beginning at three to six months and evolving to poikiloderma strongly favors Rothmund-Thomson syndrome.
  - Radial-ray or other congenital skeletal abnormalities favor Rothmund-Thomson syndrome.
  - Biallelic RECQL4 or ANAPC1 variants distinguish RTS from biallelic WRN-related Werner syndrome.
  disease_term:
    preferred_term: Rothmund-Thomson syndrome
    term:

treatments:
- name: Nicotinamide Riboside (EMPOWER Early-Phase Trial)
  description: >-
    Oral nicotinamide riboside (NR) 1000 mg daily was evaluated in a phase I/II
    double-blind randomized crossover study (26 weeks per arm). Eleven patients
    enrolled, nine were randomized, and six completed. No serious adverse events
    were reported during NR treatment; CAVI and ulcer-area signals favored NR.
    Interpretation is limited by the single-center sample, dropouts, no washout,
    and ulcer analysis in only three patients (all received NR first). Right ABI
    worsened statistically, and blood pressure, sarcopenia, lipid, glucose, and
    kidney-function markers did not differ significantly. NR is therefore an
    investigational option with early human evidence, not established
    disease-modifying care.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_phenotypes:
  - preferred_term: Skin ulcer
    term:
      id: HP:0200042
      label: Skin ulcer
  - preferred_term: Atherosclerosis
    term:
      id: HP:0002621
      label: Atherosclerosis
  target_mechanisms:
  - target: NAD+ Depletion
    treatment_effect: RESTORES
    description: NR supplementation increased plasma NAD+ in the human crossover trial.
    evidence:
    - reference: PMID:40459998
      reference_title: "Nicotinamide Riboside Supplementation Benefits in Patients With Werner Syndrome: A Double-Blind Randomized Crossover Placebo-Controlled Trial."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "As expected, NAD+ levels increased significantly following NR treatment"
      explanation: >-
        The pharmacodynamic measurement directly supports restoration of the
        depleted NAD+ pool, without proving correction of WRN itself.
  evidence:
  - reference: PMID:40459998
    reference_title: "Nicotinamide Riboside Supplementation Benefits in Patients With Werner Syndrome: A Double-Blind Randomized Crossover Placebo-Controlled Trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No serious adverse events were observed during NR treatment. Importantly, CAVI improved, the skin ulcer area decreased, and heel pad thinning showed a declining trend."
    explanation: >-
      The randomized crossover report supplies the main safety and secondary
      endpoint signals.
  - reference: PMID:40459998
    reference_title: "Nicotinamide Riboside Supplementation Benefits in Patients With Werner Syndrome: A Double-Blind Randomized Crossover Placebo-Controlled Trial."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "No significant differences were observed between the NR and placebo phases in regard to changes from baseline regarding blood pressure; sarcopenia indicators, lipid metabolism parameters, glucose metabolism markers, and kidney function markers."
    explanation: >-
      Negative secondary endpoints prevent a broad efficacy or renal-protection
      claim.
  - reference: PMID:40459998
    reference_title: "Nicotinamide Riboside Supplementation Benefits in Patients With Werner Syndrome: A Double-Blind Randomized Crossover Placebo-Controlled Trial."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "This study had some limitations. First, the number of patients was small because this was a single‐center study, which coincided with the COVID‐19 pandemic."
    explanation: >-
      The authors' limitation statement supports cautious interpretation.
- name: WRN-108 Genotype-Restricted Exon-Skipping ASO
  action_category: THERAPEUTIC
  therapeutic_modality: ANTISENSE_OLIGONUCLEOTIDE
  aso_details:
    aso_mechanism: SPLICE_MODULATION_EXON_SKIPPING
    target_gene:
      preferred_term: WRN
      term:
        id: hgnc:12791
        label: WRN
    target_transcript: WRN pre-mRNA carrying biallelic c.3139-1G>C
    target_exon: exon 27
    aso_chemistry: TWO_PRIME_O_METHOXYETHYL
    conjugation: UNCONJUGATED
  description: >-
    WRN-108 is a fully phosphorothioate, uniformly 2'-MOE splice-switching ASO
    designed for the c.3139-1G>C subgroup. In patient fibroblasts it induces exon
    27 skipping after pathogenic exon 26 skipping, restores an in-frame transcript,
    and re-establishes partial WRN protein expression and nuclear localization.
    Rat wounds established dermal pharmacokinetics; one cynomolgus monkey showed
    skin target engagement, and short mouse/minipig studies addressed tolerability.
    No model combined the human splice genotype with a WS chronic-ulcer phenotype,
    no wound-healing efficacy endpoint was tested, and long-term safety is unknown.
    Wild-type exon 27 skipping could reduce WRN expression. This is a
    genotype-restricted preclinical candidate, not clinical care.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_phenotypes:
  - preferred_term: Skin ulcer
    term:
      id: HP:0200042
      label: Skin ulcer
  target_mechanisms:
  - target: c.3139-1G>C-Dependent WRN Pre-mRNA Missplicing
    treatment_effect: BYPASSES
    description: >-
      WRN-108 causes additional exon 27 skipping to restore the open reading
      frame disrupted by c.3139-1G>C-dependent exon 26 skipping.
    evidence:
    - reference: PMID:42095135
      reference_title: Development of an exon 27-skipping antisense oligonucleotide as a targeted therapy for refractory skin ulcers in Werner syndrome.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "subsequent DNA sequencing confirmed exon 25–28 junction formation"
      explanation: >-
        The induced junction directly demonstrates bypass of the pathogenic
        frameshift-producing splice state.
  evidence:
  - reference: PMID:42095135
    reference_title: Development of an exon 27-skipping antisense oligonucleotide as a targeted therapy for refractory skin ulcers in Werner syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In WS patient-derived fibroblasts, WRN-108 efficiently induced exon 27 skipping, restored WRN protein expression, and re-established its nuclear localization."
    explanation: >-
      Direct patient-cell evidence establishes the intended molecular effect.
  - reference: PMID:42095135
    reference_title: Development of an exon 27-skipping antisense oligonucleotide as a targeted therapy for refractory skin ulcers in Werner syndrome.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "Although this evaluation was limited to a single animal, the detection of exon-skipped transcripts supports pharmacodynamic activity within treated tissue."
    explanation: >-
      The single primate establishes local target engagement only, not efficacy
      or general safety.
- name: Bosentan for Lower-Extremity Ulcers
  description: >
    Bosentan is a dual endothelin-receptor antagonist used for refractory
    lower-extremity ulcers in WS. GeneReviews recommends it on the basis of very
    limited disease-specific evidence, including case-level experience, rather
    than a controlled WS trial. It treats a manifestation, not the WRN defect,
    and should not be presented as established ulcer-healing efficacy.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: bosentan

      cytoplasmic RNA-sensing pathway.
  evidence:
  - reference: PMID:38858384
    reference_title: Retrotransposons in Werner syndrome-derived macrophages trigger type I interferon-dependent inflammation in an atherosclerosis model.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "H3K9me3 inversely correlates with RTEs, activating the DHX58-dependent RNA sensing pathway."
    explanation: >-

pathophysiology:
- name: WRN Helicase-Exonuclease Loss of Function
  biological_scale: MOLECULAR
  description: >
    Biallelic null variants in WRN abolish a 1,432-amino-acid nuclear protein
    that combines an ATP-dependent 3'->5' DNA helicase with an N-terminal 3'->5'
    exonuclease domain. The combination of the two catalytic activities in one
    polypeptide is unique among the five human RecQ helicases. Most disease
    alleles are stop codons, small indels or splice variants that truncate the
    protein and remove its C-terminal nuclear localization signal, so the residual
    product is excluded from the nucleus or degraded; the effect is loss of WRN
    function rather than a variant protein with altered activity.
  genes:
  - preferred_term: WRN
    term:
      id: hgnc:12791
      label: WRN
  molecular_functions:
  - preferred_term: WRN 3'->5' DNA helicase activity
    term:
      id: GO:0003678
      label: DNA helicase activity
    modifier: LOSS_OF_FUNCTION
  - preferred_term: WRN 3'->5' exonuclease activity
    term:
      id: GO:0008408
      label: 3'-5' exonuclease activity
    modifier: LOSS_OF_FUNCTION
  downstream:
  - target: Impaired WRN-Dependent Replication Progression
    description: >
      Loss of nuclear WRN slows DNA-chain elongation and compromises handling of
      structured replication intermediates.
  - target: Telomere Maintenance Failure
    description: >
      WRN is the RecQ helicase that resolves G-quadruplex and four-way-junction
      structures at telomeric repeats, so its loss acts directly on telomere
      replication.
  - target: NAD+ Depletion
    description: >
      Patient samples and experimental models link WRN loss to reduced NMNAT1
      expression and depletion of the NAD+ pool.
  - target: SHOX Promoter G-Quadruplex Persistence
    description: >
      Loss of WRN helicase activity prevents efficient unwinding of a
      G-quadruplex in the SHOX promoter in stem-cell and zebrafish models.
  - target: Retrotransposon-Derived dsRNA Accumulation in WS Macrophages
    description: >
      In a patient-derived iPSC model, WRN deficiency is associated with
      retrotransposon derepression and cytoplasmic double-stranded RNA.
  evidence:
  - reference: PMID:8602509
    reference_title: "Positional cloning of the Werner's syndrome gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The predicted protein is 1432 amino acids in length and shows significant similarity to DNA helicases."
    explanation: >-
      The original positional cloning study identifies the WS gene product as a
      putative DNA helicase of 1,432 residues.
  - reference: PMID:8602509
    reference_title: "Positional cloning of the Werner's syndrome gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One of the these mutations, which results in a frameshift and a predicted truncated protein"
    explanation: >-
      Documents truncating WRN alleles as the disease mechanism, consistent with
      loss of function.
  - reference: PMID:26993153
    reference_title: "Werner syndrome: Clinical features, pathogenesis and potential therapeutic interventions."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "A unique feature of the WRN helicase is the presence of an exonuclease domain in its N-terminal region."
    explanation: >-
      Establishes the dual helicase-exonuclease architecture that distinguishes
      WRN from the other human RecQ helicases.
- name: c.3139-1G>C-Dependent WRN Pre-mRNA Missplicing
  role: therapeutic_vulnerability
  biological_scale: MOLECULAR
  conforms_to: "antisense_oligonucleotide_therapy#Pathogenic Pre-mRNA Missplicing"
  description: >-
    In the genotype-specific subgroup homozygous for WRN c.3139-1G>C, disruption
    of the intron-25 splice acceptor causes exon 26 skipping, a frameshift, and a
    premature stop in exon 27. This therapeutic vulnerability is not asserted
    for other WRN genotypes or for Werner syndrome generally.
  genes:
  - preferred_term: WRN
    term:
      id: hgnc:12791
      label: WRN
  biological_processes:
  - preferred_term: RNA splicing
    term:
      id: GO:0008380
      label: RNA splicing
    modifier: ABNORMAL
  downstream:
  - target: WRN Helicase-Exonuclease Loss of Function
    description: >-
      Exon 26 skipping shifts the reading frame and introduces a premature stop,
      preventing production of functional nuclear WRN.
    causal_link_type: DIRECT
  - target: WRN-108-Directed Exon 27 Skipping
    description: >-
      Only when sequence-matched WRN-108 is administered, steric occupancy of
      exon 27 redirects splicing to an exon 25-exon 28 product.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:42095135
      reference_title: Development of an exon 27-skipping antisense oligonucleotide as a targeted therapy for refractory skin ulcers in Werner syndrome.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "In WS patient-derived fibroblasts, WRN-108 efficiently induced exon 27 skipping, restored WRN protein expression, and re-established its nuclear localization."
      explanation: >-
        Patient fibroblasts directly demonstrate the intervention-conditioned
        transition from pathogenic missplicing to exon 27 skipping.
  evidence:
  - reference: PMID:42095135
    reference_title: Development of an exon 27-skipping antisense oligonucleotide as a targeted therapy for refractory skin ulcers in Werner syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "c.3139-1G>C, which leads to exon 26 skipping"
    explanation: >-
      The patient genotype and its abnormal exon-26-skipping event define the
      restricted untreated RNA vulnerability.
- name: WRN-108-Directed Exon 27 Skipping
  role: effector
  biological_scale: MOLECULAR
  conforms_to: "antisense_oligonucleotide_therapy#ASO-Directed Splice Redirection"
  description: >-
    In c.3139-1G>C-homozygous patient fibroblasts exposed to WRN-108, induced
    skipping of exon 27 joins exon 25 to exon 28 and restores the open reading
    frame. This is an investigational, treatment-conditioned state.
  genes:
  - preferred_term: WRN
    term:
      id: hgnc:12791
      label: WRN
  biological_processes:
  - preferred_term: RNA splicing
    term:
      id: GO:0008380
      label: RNA splicing
  downstream:
  - target: Restored Partial WRN Expression and Nuclear Localization
    description: >-
      The in-frame exon 25-exon 28 transcript supports expression of a shortened
      WRN protein retaining the nuclear localization signal.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:42095135
      reference_title: Development of an exon 27-skipping antisense oligonucleotide as a targeted therapy for refractory skin ulcers in Werner syndrome.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "WRN-108 efficiently induces exon 27 skipping and restores the reading frame disrupted by the pathogenic mutation, resulting in robust re-expression of WRN protein with nuclear localization under transfection-free conditions."
      explanation: >-
        Paired RNA, protein, and localization measurements connect splice
        redirection to the productive molecular output.
  evidence:
  - reference: PMID:42095135
    reference_title: Development of an exon 27-skipping antisense oligonucleotide as a targeted therapy for refractory skin ulcers in Werner syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "subsequent DNA sequencing confirmed exon 25–28 junction formation"
    explanation: >-
      Sequencing directly verifies the WRN-108-induced splice junction.
- name: Restored Partial WRN Expression and Nuclear Localization
  role: consequence
  biological_scale: MOLECULAR
  conforms_to: "antisense_oligonucleotide_therapy#Restored Productive Transcript and Protein Expression"
  description: >-
    WRN-108-treated c.3139-1G>C patient fibroblasts re-express a shortened WRN
    protein that localizes to nuclei and partially restores genome-maintenance
    readouts. This preclinical molecular rescue does not establish wound healing
    or clinical benefit.
  genes:
  - preferred_term: WRN
    term:
      id: hgnc:12791
      label: WRN
  evidence:
  - reference: PMID:42095135
    reference_title: Development of an exon 27-skipping antisense oligonucleotide as a targeted therapy for refractory skin ulcers in Werner syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Treatment improved cell proliferation and reduced senescence-associated markers, G-quadruplex accumulation, and γH2AX signaling, consistent with partial restoration of WRN-dependent genome maintenance functions."
    explanation: >-
      Patient-fibroblast functional readouts support partial rather than complete
      restoration of WRN-dependent cellular functions.
- name: Impaired WRN-Dependent Replication Progression
  biological_scale: CELLULAR
  conforms_to: "genomic_instability_aging#Declining Genome Maintenance and Erroneous Repair"
  description: >
    WS fibroblasts show specifically slowed DNA-chain elongation while repair of
    X-ray-induced single-strand breaks and UV damage remains normal. This node
    therefore represents impaired replication progression and structured-DNA
    handling, not a global DNA-repair deficiency. More detailed fork intermediates
    have been proposed in newer cell studies, but are not asserted here without a
    directly cached primary source.
  biological_processes:
  - preferred_term: DNA replication
    term:
      id: GO:0006260
      label: DNA replication
    modifier: DECREASED
  cell_types:
  - preferred_term: skin fibroblast
    term:
      id: CL:0002620
      label: skin fibroblast
  downstream:
  - target: Genomic Instability
    description: >
      Persistently impaired replication progression contributes to accumulated
      chromosomal damage and rearrangement.
  - target: Accelerated Replicative Senescence
    description: >
      Slowed replication and restricted replicative potential exhaust the
      proliferative capacity of WS cells.
  evidence:
  - reference: PMID:903377
    reference_title: "A retarded rate of DNA replication and normal level of DNA repair in Werner's syndrome fibroblasts in culture."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "only the elongation rate of DNA chains, estimated by the molecular weight increase, was significantly slower during early passages in WS cells than in normal Hayflick Phase II fibroblasts"
    explanation: >-
      Direct measurement showing that DNA chain elongation, not repair capacity,
      is the defective step in WS fibroblasts.
  - reference: PMID:903377
    reference_title: "A retarded rate of DNA replication and normal level of DNA repair in Werner's syndrome fibroblasts in culture."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "Five WS strains exhibited normal levels of sensitivity toward X-ray and UV killings and repair of X-ray induced single strand breaks of DNA (rejoining) and UV damage to DNA (unscheduled DNA synthesis)."
    explanation: >-
      Negative result delimiting the defect: excision and single-strand break
      repair are intact, so this node should not be read as a global repair
      failure.
  - reference: PMID:26993153
    reference_title: "Werner syndrome: Clinical features, pathogenesis and potential therapeutic interventions."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Biochemical and cell biological studies during the past decade have demonstrated involvements of the WRN protein in multiple DNA transactions, including DNA repair, recombination, replication and transcription."
    explanation: >-
      Summarizes the DNA transactions supported by WRN, while the direct
      fibroblast experiment narrows this node to the demonstrated replication
      defect.
- name: Telomere Maintenance Failure
  biological_scale: MOLECULAR
  conforms_to: "telomere_attrition#Progressive Telomere Attrition"
  description: >
    Telomeric TTAGGG repeats form G-quadruplex structures that are preferred WRN
    substrates, and telomere replication requires resolution of four-way junctions
    at D- and T-loops. In the absence of WRN these structures can persist and
    telomere replication is impaired. Telomerase rescue in patient fibroblasts
    and the phenotype of late-generation Wrn-/- Terc-/- mice support telomere
    reserve as a rate-limiting model. They do not establish telomere attrition as
    the unique proximate trigger of the human multisystem phenotype.
  biological_processes:
  - preferred_term: telomere maintenance
    term:
      id: GO:0000723
      label: telomere maintenance
    modifier: DECREASED
  downstream:
  - target: Accelerated Replicative Senescence
    description: >
      Critically short, unprotected telomeres trigger a persistent DNA damage
      response and senescence.
  - target: Genomic Instability
    description: >
      Uncapped telomeres promote chromosomal end fusions and telomere sister
      chromatid exchange.
  evidence:
  - reference: PMID:15235603
    reference_title: "Essential role of limiting telomeres in the pathogenesis of Werner syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "we show that the varied and complex cellular phenotypes of Werner syndrome are precipitated by exhaustion of telomere reserves in mice"
    explanation: >-
      Mouse genetics show that telomere exhaustion can precipitate a Werner-like
      phenotype in a sensitized double-null model; species and engineered-background
      limitations prevent direct assignment of human causal primacy.
  - reference: PMID:15235603
    reference_title: "Essential role of limiting telomeres in the pathogenesis of Werner syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The capacity of enforced telomerase expression to rescue premature senescence of cultured cells from individuals with Werner syndrome"
    explanation: >-
      Telomerase rescue places telomere reserve upstream of premature senescence
      in cultured WS fibroblasts, not necessarily upstream of every human feature.
  - reference: PMID:26993153
    reference_title: "Werner syndrome: Clinical features, pathogenesis and potential therapeutic interventions."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "A role of the WRN protein in telomere maintenance could explain many of the WS phenotypes."
    explanation: >-
      The review explicitly frames telomere maintenance as an explanatory
      hypothesis ("could explain"), supporting calibrated rather than definitive
      language.
- name: Genomic Instability
  biological_scale: CELLULAR
  conforms_to: "genomic_instability_aging#Accumulation of Somatic Mutations and Genomic Damage"
  description: >
    WS cells display "variegated translocation mosaicism" — multiple, variable,
    predominantly stable chromosomal rearrangements differing between clones —
    together with elevated telomere sister chromatid exchange and increased common
    fragile site expression. This is the mutator phenotype that underlies the WS
    cancer predisposition, and it is the shared feature that groups WS with the
    other RecQ disorders (Bloom syndrome, Rothmund-Thomson syndrome) as
    chromosomal instability syndromes.
  biological_processes:
  - preferred_term: DNA repair
    term:
      id: GO:0006281
      label: DNA repair
    modifier: ABNORMAL
  downstream:
  - target: Cancer Predisposition with Mesenchymal Weighting
    description: >
      Accumulated chromosomal aberrations drive clonal evolution toward the
      characteristic WS neoplasm spectrum.
  evidence:
  - reference: PMID:23573208
    reference_title: "Spectrum and risk of neoplasia in Werner syndrome: a systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Werner syndrome (WS) is an autosomal recessive genetic instability"
    explanation: >-
      Systematic review characterizes WS as a genetic instability syndrome, the
      framing this node encodes.
  - reference: PMID:15235603
    reference_title: "Essential role of limiting telomeres in the pathogenesis of Werner syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "as well as increased chromosomal instability and cancer, particularly nonepithelial malignancies typical of Werner syndrome"
    explanation: >-
      The telomere-depleted mouse model reproduces both the chromosomal
      instability and the nonepithelial (mesenchymal) tumor bias of human WS.
- name: Accelerated Replicative Senescence
  biological_scale: CELLULAR
  conforms_to: "cellular_senescence#Senescence-Associated Cell Cycle Arrest"
  description: >
    WS fibroblasts have a markedly restricted replicative lifespan and reduced
    plating efficiency relative to normal fibroblasts cultured in parallel, and
    accumulate DNA damage foci. Premature exhaustion of the proliferative reserve
    of mesenchymal and other renewable cell populations is the cellular event most
    directly connected to the progeroid tissue phenotypes. Enforced telomerase
    expression rescues premature senescence in cultured WS fibroblasts, while
    adipose and iPSC-derived models also implicate non-telomeric inflammatory
    programs; the relative contribution in patients is unresolved.
  biological_processes:
  - preferred_term: replicative senescence
    term:
      id: GO:0090399
      label: replicative senescence
    modifier: INCREASED
  cell_types:
  - preferred_term: skin fibroblast
    term:
      id: CL:0002620
      label: skin fibroblast
  downstream:
  - target: Segmental Progeroid Tissue Failure
    description: >
      Loss of proliferative reserve in renewable tissues manifests as the
      accelerated-aging phenotypes of WS.
  - target: Senescence-Associated Adipogenic Failure
    description: >-
      In a primary adipose stromal-cell comparison, early senescence and a SASP
      accompany impaired adipogenesis and insulin signaling.
  evidence:
  - reference: PMID:903377
    reference_title: "A retarded rate of DNA replication and normal level of DNA repair in Werner's syndrome fibroblasts in culture."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "plating efficiencies as well as the replicative potentials of five WS strains were more limited than those of normal cells under the identical culture conditions"
    explanation: >-
      Directly measures the restricted replicative potential of WS fibroblasts
      against normal controls in the same culture conditions.
  - reference: PMID:15235603
    reference_title: "Essential role of limiting telomeres in the pathogenesis of Werner syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "This mouse model also showed accelerated replicative senescence and accumulation of DNA-damage foci in cultured cells"
    explanation: >-
      Confirms accelerated replicative senescence and DNA damage focus
      accumulation in the telomere-limited Wrn-null model.
- name: NAD+ Depletion
  biological_scale: MOLECULAR
  description: >-
    WS patient samples and invertebrate models show depletion of NAD+. WRN was
    reported to regulate transcription of NMNAT1, linking the nuclear WRN lesion
    to reduced NAD+ biosynthetic capacity. The degree and tissue distribution of
    this deficit in patients remain incompletely mapped.
  downstream:
  - target: Impaired Mitophagy and Mitochondrial Quality Control
    description: >-
      Reduced NAD+ availability is associated with impaired mitophagy; NAD+
      repletion improves mitochondrial quality through DCT-1- and ULK-1-dependent
      mitophagy in experimental models.
  evidence:
  - reference: PMID:31754102
    reference_title: NAD(+) augmentation restores mitophagy and limits accelerated aging in Werner syndrome.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we report impaired mitophagy and depletion of NAD+, a fundamental ubiquitous molecule, in WS patient samples and WS invertebrate models."
    explanation: >-
      The human-sample clause supports NAD+ depletion in patient material; it is
      kept separate from the invertebrate-model arm of the same sentence.
  - reference: PMID:31754102
    reference_title: NAD(+) augmentation restores mitophagy and limits accelerated aging in Werner syndrome.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "Here we report impaired mitophagy and depletion of NAD+, a fundamental ubiquitous molecule, in WS patient samples and WS invertebrate models."
    explanation: >-
      The invertebrate-model clause supports the experimental organism arm and is
      not relabeled as human or in-vitro evidence.
- name: Impaired Mitophagy and Mitochondrial Quality Control
  biological_scale: CELLULAR
  conforms_to: "mitochondrial_dysfunction#Impaired Mitophagy and Quality Control"
  description: >-
    Experimental WS systems show impaired clearance of dysfunctional
    mitochondria. NAD+ repletion improves mitochondrial quality through the
    mitophagy regulators DCT-1 and ULK-1 and extends lifespan in invertebrate WS
    models, but those organismal rescues are not human treatment evidence.
  biological_processes:
  - preferred_term: mitophagy
    term:
      id: GO:0000422
      label: autophagy of mitochondrion
    modifier: DECREASED
  evidence:
  - reference: PMID:31754102
    reference_title: NAD(+) augmentation restores mitophagy and limits accelerated aging in Werner syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "NAD+ repletion restores NAD+ metabolic profiles and improves mitochondrial quality through DCT-1 and ULK-1-dependent mitophagy."
    explanation: >-
      Genetic dependence on mitophagy regulators supports the quality-control
      mechanism in experimental WS systems.
- name: SHOX Promoter G-Quadruplex Persistence
  biological_scale: MOLECULAR
  description: >-
    WRN helicase binds and unwinds a G-quadruplex in the SHOX promoter. WRN loss
    therefore leaves this regulatory structure unresolved in stem-cell and
    zebrafish systems, reducing SHOX transcription. This developmental model
    addresses the short-stature arm and is not a general explanation for adult
    progeroid manifestations.
  downstream:
  - target: Reduced SHOX Transcription and Chondrogenesis
    description: >-
      Persistent promoter G-quadruplex structure reduces SHOX transcription and
      impairs chondrocyte differentiation.
  evidence:
  - reference: PMID:36114168
    reference_title: WRN promotes bone development and growth by unwinding SHOX-G-quadruplexes via its helicase activity in Werner Syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We identify short-stature homeobox (SHOX) as a crucial and direct target of WRN and find that the WRN helicase core regulates the transcriptional expression of SHOX via unwinding G-quadruplexes."
    explanation: >-
      Stem-cell and molecular assays identify the WRN-SHOX promoter interaction
      and the G-quadruplex-unwinding step.
- name: Reduced SHOX Transcription and Chondrogenesis
  biological_scale: CELLULAR
  description: >-
    WRN-null hESC/hMSC differentiation and zebrafish models have reduced SHOX,
    impaired chondrogenesis, and short body length. SHOX overexpression rescues
    the developmental defect in both systems, placing SHOX downstream of WRN for
    this phenotype.

name: Werner Syndrome
creation_date: "2026-08-20T00:00:00Z"
category: Mendelian
description: >-
  Werner syndrome (WS, "progeria of the adult") is a rare autosomal recessive
  segmental progeroid syndrome caused by biallelic null mutations in WRN, which
  encodes a RecQ-family DNA helicase that uniquely also carries a 3'->5'
  exonuclease domain in its N-terminal region. Development is normal until
  adolescence; the first sign is absence of the pubertal growth spurt, and from
  the third decade patients acquire an aged appearance with skin atrophy, loss of
  subcutaneous fat, scleroderma-like skin changes, premature graying and thinning
  of hair, and near-universal bilateral posterior subcapsular cataracts. A
  cluster of common age-related disorders follows in middle age: type 2 diabetes
  mellitus, hypogonadism, osteoporosis, premature atherosclerosis, and
  malignancy. WRN participates in DNA repair, recombination, replication and
  telomere maintenance; its loss produces genomic instability and a severely
  restricted replicative capacity in cultured cells, and telomere attrition
  appears to be the proximate trigger that converts WRN loss into the organismal
  phenotype. The cancer spectrum is distinctive and does not mirror ordinary
  aging: thyroid neoplasms, malignant melanoma, meningioma, soft tissue sarcomas,
  primary bone neoplasms and leukemia/myelodysplasia predominate, and the
  mesenchymal weighting is markedly higher than in age-matched controls. Cancer
  and myocardial infarction are the usual causes of death, at a median age of 54.
  There is no cure; management is directed at complications and cancer
  surveillance. Notably, the same WRN helicase activity that is lost in WS is a
  synthetic lethal dependency in microsatellite-unstable cancers, making WRN a
  drug target in sporadic oncology.

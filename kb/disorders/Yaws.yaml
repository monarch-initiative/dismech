- name: Tertiary Destructive Disease
  biological_scale: TISSUE
  description: >-
    Untreated yaws can rarely progress to a tertiary stage with severe,
    disfiguring tissue damage, including chronic destructive lesions of bone
    and cartilage; this stage is now uncommon where treatment is available.
  downstream:
  - target: Severe disfigurement

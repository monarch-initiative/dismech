- name: Cutaneous Treponemal Inoculation
  biological_scale: TISSUE
  description: >-
    Direct skin contact with an infectious lesion introduces Treponema pallidum
    subsp. pertenue into skin, where primary yaws presents as a highly contagious
    papilloma or ulcer.

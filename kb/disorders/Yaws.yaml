      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        It causes lesions of the skin, mucous membranes and bones which, without
        treatment, can become chronic and destructive.
      explanation: Directly supports chronic destructive bone lesions in untreated yaws.
  - target: Late cartilage destruction
    description: Late yaws can destructively involve cartilage as part of its disfiguring tissue disease.

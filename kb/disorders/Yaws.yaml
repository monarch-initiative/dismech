- name: Tertiary Destructive Disease
  biological_scale: TISSUE
  description: >-
    Untreated yaws can rarely progress to a tertiary stage with severe,
    disfiguring tissue damage, including chronic destructive lesions of bone.
    Cartilage may also be involved in later stages, but the cited evidence does
    not characterize that involvement as destructive. This stage is now uncommon
    where treatment is available.
  downstream:
  - target: Severe disfigurement
    description: Tertiary disease can cause severe disfigurement.
    evidence:
    - reference: PMID:40036381

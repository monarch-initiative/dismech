    explanation: Directly describes the affected remote-community context and limited access to hygiene and sanitation.
- name: Natural TPE infection in nonhuman primates (potential reservoir)
  notes: >-
    Naturally infected nonhuman primates harbor TPE strains genomically
    indistinguishable from human strains, supporting potential reservoir status.
    Current spillover evidence is missing, so this record does not assert ongoing
    zoonotic transmission.
  evidence:
  - reference: PMID:37703251
    reference_title: "The genomes of the yaws bacterium, Treponema pallidum subsp. pertenue, of nonhuman primate and human origin are not genomically distinct."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Our data show that NHPs are infected with strains that are not only similar
      to the strains infecting humans but are genomically indistinguishable from them.
    explanation: >-
      Natural infection directly supports TPE infection of nonhuman primates
      and their potential reservoir role; it does not establish human spillover.
  - reference: PMID:37703251
    reference_title: "The genomes of the yaws bacterium, Treponema pallidum subsp. pertenue, of nonhuman primate and human origin are not genomically distinct."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Although interspecies transmission in NHPs is a rare event and evidence for
      current spillover events is missing, the existence of the yaws bacterium in
      NHPs is demonstrated.
    explanation: Preserves the key caveat that a reservoir does not establish current spillover to humans.
treatments:
- name: Azithromycin therapy
  description: >-
    Preferred regimen for individual or mass treatment: one oral dose of
    30 mg/kg, capped at 2 g.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: azithromycin
      term:
        id: CHEBI:2955
        label: azithromycin
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Treponemal Ribosomal Translation (Azithromycin Target)
    treatment_effect: INHIBITS
    description: >-
      Azithromycin binds the bacterial 50S ribosomal component and inhibits protein synthesis.
    evidence:
    - reference: PMID:1319048
      reference_title: "Azithromycin--spectrum of activity, pharmacokinetics, and clinical applications."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Structurally related to the macrolide antibiotic erythromycin, its mechanism
        of activity (similar to erythromycin) is interference with bacterial protein
        synthesis by binding to the 50S component of the 70S ribosomal subunit.
      explanation: Directly supports the modeled treatment-to-target mechanism.
  evidence:
  - reference: PMID:28072863
    reference_title: "A Single Dose Oral Azithromycin versus Intramuscular Benzathine Penicillin for the Treatment of Yaws-A Randomized Non Inferiority Trial in Ghana."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Participants who met the inclusion criteria were randomized to receive
      treatment with either a single dose oral azithromycin administered at a
      dose of 30mg/kg (maximum of 2g) or a single dose of benzathine penicillin
      administered as an intramuscular injection of 1.2 million units for
      subjects 10-15years, and 0.6 million units for those below 10 years of age.
    explanation: Directly supports the exact single-dose azithromycin regimen and maximum dose.
  - reference: PMID:40036381
    reference_title: "Yaws - A Review of Clinical Features, Diagnosis and Treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Though yaws can be treated with benzathine penicillin, oral azithromycin has become the preferred treatment due to its ease of administration."
    explanation: The abstract notes oral azithromycin as the preferred treatment.
  - reference: PMID:24396138
    reference_title: The endemic treponematoses.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      This challenging but potentially feasible endeavor is favored by the adoption
      of oral azithromycin for mass treatment
    explanation: Directly supports oral azithromycin as the mass-treatment agent in yaws eradication.
- name: Benzathine penicillin therapy
  description: >-
    Alternative or azithromycin-failure rescue treatment. In the cited Ghana
    trial, the single intramuscular BPG dose was 0.6 million units for participants

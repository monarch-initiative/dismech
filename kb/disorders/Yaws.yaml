      A high proportion of cases (46%) were in the secondary stage; 92% of
      them had osteoarticular involvement, and only 24% had a Venereal Disease
      Research Laboratory titer greater than 1:32.
    explanation: Directly places osteoarticular involvement in secondary yaws.
  - reference: PMID:28193743
    reference_title: "Yaws Osteoperiostitis Treated with Single-Dose Azithromycin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Bone lesions in the form of osteoperiostitis are common and occur in
      numerous bones simultaneously in early stages.
    explanation: Directly supports early multifocal periostitis.
- name: Latent or asymptomatic yaws
  description: >-
    Seroreactive infection without active skin lesions or other symptoms can
    persist for years and later reactivate. Latent infections form a clinically
    silent reservoir that can be missed by lesion-based case finding.
  evidence:
  - reference: PMID:23016260
    reference_title: "Yaws, a non-venereal treponemal infection. Still endemic in some parts of the world."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The infection remains asymptomatic for several years."
    explanation: This review directly supports a prolonged asymptomatic stage.
  - reference: PMID:29428183
    reference_title: "Re-emergence of yaws after single mass azithromycin treatment followed by targeted treatment: a longitudinal study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A sustained decrease in the prevalence of high-titre latent yaws from
      13·7% to <1·5% in asymptomatic children aged 1-5 years old and of genetic
      diversity of yaws strains from 0·139 to less than 0·046 between months 24
      and 42 indicated a reduction in transmission of infection.
    explanation: >-
      Longitudinal human surveillance directly measured high-titre latent yaws
      among asymptomatic children in this age-defined study cohort; the rate is
      not presented as global prevalence.
  - reference: PMID:34986286
    reference_title: "Trial of Three Rounds of Mass Azithromycin Administration for Yaws Eradication."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The prevalence of latent yaws at 18 months was 6.54% (95% CI, 5.00 to
      8.08) among 994 children in the control group and 3.28% (95% CI, 2.14 to
      4.42) among 945 children in the experimental group (relative risk adjusted
      for clustering and age, 2.03; 95% CI, 1.12 to 3.70).
    explanation: >-
      Directly measures latent infection in asymptomatic children enrolled in
      the trial; these selected-cohort rates are not generalized globally.
- name: Tertiary yaws
  description: >-
    Rare late stage in treated settings, with severe disfigurement and chronic
    destructive lesions of bone and cartilage in untreated disease.
  evidence:
  - reference: PMID:40036381
    reference_title: "Yaws - A Review of Clinical Features, Diagnosis and Treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Tertiary cases occur in 10% of untreated individuals and can cause severe
      disfigurement, but with the wider availability of treatment this is rare today.
    explanation: Directly defines tertiary-stage frequency in untreated individuals and current rarity.
  - reference: PMID:38166151
    reference_title: "Low genetic diversity of Treponema pallidum ssp. pertenue (TPE) isolated from patients' ulcers in Namatanai District of Papua New Guinea: Local human population is infected by three TPE genotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinical manifestations in the primary stage include chronic skin ulcers
      and other skin lesions, potentially affecting bones and cartilage in the
      later stages
    explanation: Directly supports late destructive bone and cartilage disease when untreated.
diagnosis:
- name: Clinical examination with serological confirmation
  description: >-
    Clinical suspicion requires combined serology, but serology does not identify
    T. pallidum subsp. pertenue. Treponemal reactivity cannot distinguish yaws
    from syphilis or another treponematosis and generally cannot distinguish past
    or treated infection from current infection. RPR is a nonspecific
    nontreponemal activity/treatment-response marker, not a test of TPE identity.
  results: >-
    Interpret a treponemal result as evidence of treponemal exposure and an RPR
    titre as evidence bearing on activity; use lesion molecular testing when
    organism and subspecies identity matter.
  evidence:
  - reference: PMID:39693168
    reference_title: Comparison of the standard Q syphilis antibody rapid diagnostic test to gold standards for yaws detection in children.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of yaws is based on clinical findings with serological confirmation."
    explanation: Directly supports the combined clinical and serologic diagnostic approach.
  - reference: PMID:23016260
    reference_title: "Yaws, a non-venereal treponemal infection. Still endemic in some parts of the world."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Serological tests cannot distinguish between yaws and syphilis or other
      non-venereal treponematoses.
    explanation: Directly supports the organism-identity limitation of serology.
  - reference: PMID:38319847
    reference_title: "CDC Laboratory Recommendations for Syphilis Testing, United States, 2024."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      T reponemal antibodies generally persist after treatment and cannot be used
      to distinguish between a current infection or a previously treated infection.
    explanation: >-
      Supports the past-versus-current limitation of treponemal antibody tests.
  - reference: PMID:38319847
    reference_title: "CDC Laboratory Recommendations for Syphilis Testing, United States, 2024."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      None of the nontreponemal (lipoidal antigen) or treponemal tests can
      distinguish infections caused by other T. pallidum subspecies.
    explanation: >-
      Supports that neither RPR nor treponemal serology establishes TPE identity.
- name: Standard Q Syphilis Antibody rapid diagnostic test
  description: Point-of-care screening test evaluated against TPHA and RPR in children with yaws.
  results: High sensitivity and specificity; RPR remains necessary for confirmation when findings are unusual.
  evidence:
  - reference: PMID:39693168
    reference_title: Comparison of the standard Q syphilis antibody rapid diagnostic test to gold standards for yaws detection in children.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The sensitivity and specificity of RDT compared to TPHA were 93.3% and
      99.4%, respectively. The sensitivity and specificity of RDT compared to RPR
      were 100% and 98.4%, respectively.
    explanation: Directly reports the screening test's accuracy against both comparators.
  - reference: PMID:39693168
    reference_title: Comparison of the standard Q syphilis antibody rapid diagnostic test to gold standards for yaws detection in children.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, unusual clinical findings, like scars in RDT reactive patients,
      indicated that RPR is still required to confirm the diagnosis of yaws.
    explanation: Directly supports retaining RPR confirmation for unusual presentations.
- name: Lesion PCR and multiplex differential diagnosis of yaws-like ulcers
  description: >-
    PCR on material from an active skin lesion directly detects T. pallidum DNA;
    subspecies-specific targets or sequencing are needed to establish TPE.
    Multiplex testing should also assess Haemophilus ducreyi and HSV-1/HSV-2 in
    clinically similar ulcers.
  results: >-
    TPE-positive lesion PCR supports active yaws; detection of H. ducreyi or HSV
    identifies a non-yaws ulcer cause, while serology alone may reflect latent or
    past treponemal infection.
  evidence:
  - reference: PMID:29428183
    reference_title: "Re-emergence of yaws after single mass azithromycin treatment followed by targeted treatment: a longitudinal study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Active yaws confirmed by PCR specific for Treponema pallidum was the primary outcome indicator."
    explanation: Directly supports lesion molecular confirmation of active yaws.
  - reference: PMID:38776332
    reference_title: "Prevalence of yaws and syphilis in the Ashanti region of Ghana and occurrence of H. ducreyi, herpes simplex virus 1 and herpes simplex virus 2 in skin lesions associated with treponematoses."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Multiplex PCR results showed that 9.1%, 1.8% and 0.9% of yaws-like lesions
      were positive for Haemophilus ducreyi, herpes simplex virus-1 (HSV-1) and
      T. pallidum respectively.
    explanation: Directly demonstrates pathogen heterogeneity among clinically yaws-like lesions.
- name: Four-week post-treatment response and resistance assessment
  description: >-
    Re-examine treated lesions at four weeks. Persistent lesions require renewed
    etiologic evaluation, lesion PCR confirmation, and testing of 23S rRNA for
    macrolide-resistance mutations; presumed azithromycin failure is managed with
    intramuscular benzathine penicillin G rescue.
  results: >-
    Complete healing supports treatment response. A persistent PCR-confirmed TPE
    lesion with A2058G or A2059G supports macrolide-resistant treatment failure.
  evidence:
  - reference: PMID:41911295
    reference_title: "Assessment of the role of Haemophilus ducreyi coinfection on outcomes of Yaws treatment in the southwestern part of Ghana."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatment was with a single dose of oral azithromycin and outcomes were
      evaluated 4 weeks post-treatment, assessing clinical resolution and time
      to healing, with results stratified by the identified aetiological agents.
    explanation: Directly supports the four-week clinical response assessment.
  - reference: PMID:29428183
    reference_title: "Re-emergence of yaws after single mass azithromycin treatment followed by targeted treatment: a longitudinal study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At months 36 and 42, five cases of active yaws, all from the same village,
      showed clinical failure following azithromycin treatment, with PCR-detected
      mutations in the 23S ribosomal RNA genes conferring resistance to azithromycin.
    explanation: Directly supports PCR-based investigation of azithromycin treatment failure.
  - reference: PMID:29428183
    reference_title: "Re-emergence of yaws after single mass azithromycin treatment followed by targeted treatment: a longitudinal study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of 208 PCR-confirmed active yaws cases in the post-MDA period, the 23S rRNA
      gene could be amplified by PCR in 186 (89·4%), of which 181 (97·3%) had
      wild-type strains, but two cases at 36 months and three cases at 42 months
      revealed A2059G mutations associated with macrolide-resistance.
    explanation: Directly supports A2059G testing in the localized treatment-failure cluster.
differential_diagnoses:
- name: Syphilis
  description: >-
    Venereal syphilis and yaws both produce reactive treponemal serology and can
    have overlapping cutaneous manifestations.
  distinguishing_features:
  - Sexual and congenital transmission context favors syphilis; childhood skin-to-skin transmission in an endemic rural tropical community favors yaws.
  - Serology alone cannot assign the infecting T. pallidum subspecies; lesion molecular testing is needed when identity is consequential.
  evidence:
  - reference: PMID:25193248
    reference_title: "Yaws."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Infection with yaws or syphilis results in reactive treponemal serology
      and there is no widely available test to distinguish between these infections.
    explanation: Directly supports syphilis as a serologically overlapping differential.
- name: Haemophilus ducreyi-associated cutaneous ulcer
  description: H. ducreyi can cause a clinically yaws-like skin ulcer.
  distinguishing_features:
  - Multiplex lesion PCR detects H. ducreyi rather than T. pallidum DNA.
  evidence:
  - reference: PMID:38776332
    reference_title: "Prevalence of yaws and syphilis in the Ashanti region of Ghana and occurrence of H. ducreyi, herpes simplex virus 1 and herpes simplex virus 2 in skin lesions associated with treponematoses."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Multiplex PCR results showed that 9.1%, 1.8% and 0.9% of yaws-like lesions
      were positive for Haemophilus ducreyi, herpes simplex virus-1 (HSV-1) and
      T. pallidum respectively.
    explanation: Directly identifies H. ducreyi in clinically yaws-like lesions.
- name: Herpes simplex virus-associated ulcer
  description: HSV-1 or HSV-2 can produce an ulcer in the treponematosis differential.
  distinguishing_features:
  - Multiplex lesion PCR detects HSV-1 or HSV-2 rather than T. pallidum DNA.
  evidence:
  - reference: PMID:38776332
    reference_title: "Prevalence of yaws and syphilis in the Ashanti region of Ghana and occurrence of H. ducreyi, herpes simplex virus 1 and herpes simplex virus 2 in skin lesions associated with treponematoses."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Multiplex PCR results showed that 9.1%, 1.8% and 0.9% of yaws-like lesions
      were positive for Haemophilus ducreyi, herpes simplex virus-1 (HSV-1) and
      T. pallidum respectively.
    explanation: Directly identifies HSV-1 in clinically yaws-like lesions.
environmental:
- name: Natural TPE infection in nonhuman primates (potential reservoir)
  notes: >-
    Naturally infected nonhuman primates harbor TPE strains genomically
    indistinguishable from human strains, supporting potential reservoir status.
    Current spillover evidence is missing, so this record does not assert ongoing
    zoonotic transmission.
  evidence:
  - reference: PMID:37703251
    reference_title: "The genomes of the yaws bacterium, Treponema pallidum subsp. pertenue, of nonhuman primate and human origin are not genomically distinct."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Our data show that NHPs are infected with strains that are not only similar
      to the strains infecting humans but are genomically indistinguishable from them.
    explanation: >-
      Natural infection directly supports TPE infection of nonhuman primates
      and their potential reservoir role; it does not establish human spillover.
  - reference: PMID:37703251
    reference_title: "The genomes of the yaws bacterium, Treponema pallidum subsp. pertenue, of nonhuman primate and human origin are not genomically distinct."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Although interspecies transmission in NHPs is a rare event and evidence for
      current spillover events is missing, the existence of the yaws bacterium in
      NHPs is demonstrated.
    explanation: Preserves the key caveat that a reservoir does not establish current spillover to humans.
treatments:
- name: Azithromycin therapy
  description: >-
    Preferred regimen for individual or mass treatment: one oral dose of
    30 mg/kg, capped at 2 g.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:

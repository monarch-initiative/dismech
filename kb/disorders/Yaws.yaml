name: Yaws
creation_date: '2026-01-26T15:56:41Z'
category: Infectious Disease
description: >-
  Yaws is a chronic and disfiguring bacterial infection caused by Treponema
  pallidum subsp. pertenue.
disease_term:
  term:
    id: MONDO:0006019
    label: yaws
  preferred_term: Yaws
parents:
- Bacterial Infection
- Neglected tropical disease
infectious_agent:
- name: Treponema pallidum subsp. pertenue
  infectious_agent_term:
    preferred_term: Treponema pallidum subsp. pertenue
    term:
      id: NCBITaxon:168
      label: Treponema pallidum subsp. pertenue
  description: Spirochete that causes yaws.
  evidence:
  - reference: PMID:40036381
    reference_title: "Yaws - A Review of Clinical Features, Diagnosis and Treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Yaws, a neglected tropical disease caused by Treponema pallidum subsp. pertenue, primarily affects children in impoverished rural areas."
    explanation: The abstract identifies T. pallidum subsp. pertenue as the cause of yaws.
transmission:
- name: Direct skin contact
  description: Transmitted through direct skin contact with infected individuals.
  evidence:
  - reference: PMID:40036381
    reference_title: "Yaws - A Review of Clinical Features, Diagnosis and Treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "It is spread through direct skin contact."
    explanation: The abstract states yaws is spread through direct skin contact.
epidemiology:
- name: Endemic childhood disease of rural humid tropical communities
  description: >-
    Yaws is concentrated among children and adolescents living in poor, rural,
    low-income communities in humid tropical areas of Africa, Southeast Asia,
    and the Pacific Islands.
  factors:
  - childhood and adolescence
  - rural residence
  - poverty and low income
  - humid tropical climate
  evidence:
  - reference: PMID:39851478
    reference_title: "Yaws in Africa: Past, Present and Future."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Yaws is an infectious, neglected tropical disease that affects the skin
      of many children and adolescents who live in poor, rural, low-income
      communities in humid, tropical areas of Africa, Southeast Asia, and the
      Pacific Islands.
    explanation: >-
      This review directly supports the age, socioeconomic, rural, climatic,
      and geographic epidemiology summarized here.
prevalence:
- population: Countries where yaws remains endemic
  measure_type: UNKNOWN
  prevalence_class: UNKNOWN
  notes: >-
    Yaws is reported as endemic in at least 15 countries, but inadequate
    surveillance prevents a defensible global prevalence estimate. The
    0.50%-43.0% range reported by the same review comes from selected studies
    in 11 African countries and is not represented as worldwide prevalence.
  evidence:
  - reference: PMID:39851478
    reference_title: "Yaws in Africa: Past, Present and Future."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Yaws is currently endemic in at least 15 countries, but adequate
      surveillance data are lacking.
    explanation: >-
      Supports endemic-country distribution and the decision not to derive a
      global numerical prevalence from selected study cohorts.
pathophysiology:
- name: Cutaneous Treponemal Inoculation
  biological_scale: TISSUE
  description: >-
    Direct skin contact with an infectious lesion introduces Treponema pallidum
    subsp. pertenue into skin, where primary yaws presents as a highly contagious
    papilloma or ulcer.
  biological_processes:
  - preferred_term: symbiont entry into host
    term:
      id: GO:0044409
      label: symbiont entry into host
  locations:
  - preferred_term: skin
    term:
      id: UBERON:0002097
      label: skin of body
  downstream:
  - target: Disseminated Secondary Yaws
    description: Untreated primary disease may progress to disseminated secondary yaws.
    evidence:
    - reference: PMID:40036381
      reference_title: "Yaws - A Review of Clinical Features, Diagnosis and Treatment."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        If untreated, this lesion heals spontaneously but may progress to secondary
        yaws, characterised by disseminated skin lesions, scaly papules and painful
        hyperkeratotic plaques on the palms and soles.
      explanation: Directly supports progression from an untreated primary lesion to secondary yaws.
  - target: Skin ulcer
    description: Primary cutaneous infection produces a usually painless papilloma or ulcer.
    evidence:
    - reference: PMID:40036381
      reference_title: "Yaws - A Review of Clinical Features, Diagnosis and Treatment."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        In the primary stage, patients develop a, usually painless, papilloma or
        ulcer, often on the lower extremities, which is highly contagious.
      explanation: Directly links the primary-stage mechanism to its cutaneous phenotype.
  - target: Primary yaws papilloma
    description: Primary cutaneous infection produces a contagious papillomatous lesion.

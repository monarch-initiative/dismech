- name: Morges eradication strategy
  description: >-
    Begin with total community treatment (TCT) using single-dose azithromycin in
    the entire endemic community, then use repeat TCT or active case-finding and
    total targeted treatment of active cases and their household, school, and
    play contacts. Continue active post-campaign surveillance; contact-only
    targeting can miss geographically dispersed latent infections.
  evidence:
  - reference: PMID:29140407
    reference_title: "Targeted Treatment of Yaws With Household Contact Tracing: How Much Do We Miss?"
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      The World Health Organization strategy mandates an initial round of total
      community treatment (TCT) with single-dose azithromycin followed either by
      further TCT or active case-finding and treatment of cases and their contacts
      (the Morges strategy).
    explanation: Directly defines the TCT and case/contact components of the Morges strategy.
  - reference: PMID:29140407
    reference_title: "Targeted Treatment of Yaws With Household Contact Tracing: How Much Do We Miss?"
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      This analysis indicated that targeted treatment of cases and their
      household contacts would miss a large fraction of asymptomatic infections
      (65%-100%).
    explanation: Supports the limitation of contact-only targeting for latent infection.
  - reference: DOI:10.1101/2024.11.07.24316738
    reference_title: "The Morges Strategy for Yaws Eradication: the First Largescale Total Community Treatment with Azithromycin Against Yaws in the Congo-Basin, using a Novel Model"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      TCT was followed by post-campaign active surveillance, treatment of yaws
      cases and their contacts.
    explanation: Directly supports post-campaign surveillance and case/contact treatment in implementation.

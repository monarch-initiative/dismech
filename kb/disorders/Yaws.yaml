  - target: Bone pain
    description: Secondary-stage osteoarticular involvement can cause pain localized to bone.
    evidence:
    - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC3122353/
      reference_title: Challenges in Recognition and Diagnosis of Yaws in Children in Papua New Guinea - PMC
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Marked pain in the long bones of extremities with or without visible

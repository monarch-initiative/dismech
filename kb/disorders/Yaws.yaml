      term:
        id: CHEBI:2955
        label: azithromycin
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Treponemal Ribosomal Translation (Azithromycin Target)
    treatment_effect: INHIBITS
    description: >-
      Azithromycin binds the bacterial 50S ribosomal component and inhibits protein synthesis.
    evidence:
    - reference: PMID:1319048
      reference_title: "Azithromycin--spectrum of activity, pharmacokinetics, and clinical applications."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Structurally related to the macrolide antibiotic erythromycin, its mechanism
        of activity (similar to erythromycin) is interference with bacterial protein
        synthesis by binding to the 50S component of the 70S ribosomal subunit.
      explanation: Directly supports the modeled treatment-to-target mechanism.
  evidence:
  - reference: PMID:28072863
    reference_title: "A Single Dose Oral Azithromycin versus Intramuscular Benzathine Penicillin for the Treatment of Yaws-A Randomized Non Inferiority Trial in Ghana."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Participants who met the inclusion criteria were randomized to receive
      treatment with either a single dose oral azithromycin administered at a
      dose of 30mg/kg (maximum of 2g) or a single dose of benzathine penicillin
      administered as an intramuscular injection of 1.2 million units for
      subjects 10-15years, and 0.6 million units for those below 10 years of age.
    explanation: Directly supports the exact single-dose azithromycin regimen and maximum dose.
  - reference: PMID:40036381
    reference_title: "Yaws - A Review of Clinical Features, Diagnosis and Treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Though yaws can be treated with benzathine penicillin, oral azithromycin has become the preferred treatment due to its ease of administration."
    explanation: The abstract notes oral azithromycin as the preferred treatment.
  - reference: PMID:24396138
    reference_title: The endemic treponematoses.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      This challenging but potentially feasible endeavor is favored by the adoption

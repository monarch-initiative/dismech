      evidence_source: OTHER
      snippet: >-
        It causes lesions of the skin, mucous membranes and bones which, without
        treatment, can become chronic and destructive.
      explanation: Directly supports chronic destructive bone lesions in untreated yaws.
  - target: Later-stage cartilage involvement
    description: Cartilage may be involved in later-stage yaws; destructive change is not asserted.
    evidence:
    - reference: PMID:38166151
      reference_title: "Low genetic diversity of Treponema pallidum ssp. pertenue (TPE) isolated from patients' ulcers in Namatanai District of Papua New Guinea: Local human population is infected by three TPE genotypes."

- name: Disseminated Secondary Yaws
  biological_scale: TISSUE
  description: >-
    Untreated primary infection can disseminate through the skin, producing
    widespread lesions and palmoplantar hyperkeratosis; osteoarticular
    involvement can produce bone pain, periostitis, and dactylitis.
  locations:
  - preferred_term: skin
    term:
      id: UBERON:0002097
      label: skin of body
  downstream:
  - target: Tertiary Destructive Disease
    description: A minority of untreated infections progress to disfiguring tertiary disease.
    evidence:
    - reference: PMID:40036381
      reference_title: "Yaws - A Review of Clinical Features, Diagnosis and Treatment."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Tertiary cases occur in 10% of untreated individuals and can cause severe
        disfigurement, but with the wider availability of treatment this is rare today.
      explanation: Directly quantifies tertiary progression among untreated individuals.
  - target: Disseminated skin eruption
    description: Secondary dissemination produces widespread skin lesions and scaly papules.
    evidence:
    - reference: PMID:40036381

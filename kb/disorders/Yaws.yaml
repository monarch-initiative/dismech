      disfigurement, but with the wider availability of treatment this is rare today.
    explanation: Directly supports both the untreated-case proportion and severe disfigurement claim.
- name: Treponemal Ribosomal Translation (Azithromycin Target)
  biological_scale: MOLECULAR
  description: >-
    Treponema pallidum subsp. pertenue depends on bacterial ribosomal translation.
    Azithromycin inhibits bacterial protein synthesis by binding the 50S component
    of the 70S ribosome, creating a therapeutically exploitable vulnerability.
  role: therapeutic_vulnerability
  conforms_to: "bacterial_protein_synthesis_inhibition#Bacterial mRNA Translation by the Ribosome"
  biological_processes:
  - preferred_term: Translation
    term:
      id: GO:0006412
      label: translation
  evidence:
  - reference: PMID:1319048
    reference_title: "Azithromycin--spectrum of activity, pharmacokinetics, and clinical applications."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Structurally related to the macrolide antibiotic erythromycin, its mechanism
      of activity (similar to erythromycin) is interference with bacterial protein
      synthesis by binding to the 50S component of the 70S ribosomal subunit.
    explanation: >-
      Directly supports azithromycin's inhibition of bacterial protein synthesis
      through the 50S ribosomal component.
- name: 23S rRNA A2058G/A2059G-Mediated Azithromycin Resistance
  biological_scale: MOLECULAR
  description: >-
    A2058G and A2059G substitutions in TPE 23S rRNA are associated with
    azithromycin resistance. A2058G was reported in three isolates from one PNG
    study, while a separate longitudinal cohort identified A2059G in five
    treatment-failure cases linked within one village. These localized findings
    establish resistance emergence, not its population prevalence.
  downstream:
  - target: Azithromycin Clinical Failure and Re-emergent Transmission
    description: Resistant TPE can persist after azithromycin and contribute to local re-emergence and spread.
    evidence:
    - reference: PMID:29428183
      reference_title: "Re-emergence of yaws after single mass azithromycin treatment followed by targeted treatment: a longitudinal study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        At months 36 and 42, five cases of active yaws, all from the same village,
        showed clinical failure following azithromycin treatment, with PCR-detected
        mutations in the 23S ribosomal RNA genes conferring resistance to azithromycin.
      explanation: Directly links 23S rRNA resistance mutations to clinical failure in a localized cluster.
  evidence:
  - reference: PMID:38166151
    reference_title: "Low genetic diversity of Treponema pallidum ssp. pertenue (TPE) isolated from patients' ulcers in Namatanai District of Papua New Guinea: Local human population is infected by three TPE genotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Moreover, the A2058G mutation in the 23S rRNA genes of three JE11 isolates
      was found, resulting in azithromycin resistance.
    explanation: >-
      Directly identifies A2058G in three human ulcer isolates; this evidence is
      retained as a localized observation and not generalized to prevalence.
  - reference: PMID:29428183
    reference_title: "Re-emergence of yaws after single mass azithromycin treatment followed by targeted treatment: a longitudinal study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of 208 PCR-confirmed active yaws cases in the post-MDA period, the 23S rRNA
      gene could be amplified by PCR in 186 (89·4%), of which 181 (97·3%) had
      wild-type strains, but two cases at 36 months and three cases at 42 months
      revealed A2059G mutations associated with macrolide-resistance.
    explanation: Directly identifies A2059G in the five localized post-MDA resistant cases.
- name: Azithromycin Clinical Failure and Re-emergent Transmission
  biological_scale: ORGANISM
  description: >-
    A single mass-azithromycin round followed by targeted treatment produced a
    large initial decline but did not eliminate yaws in the studied high-endemic
    community; active disease re-emerged after 24 months, and resistant clinical
    failures reinforced the need for repeated treatment and resistance surveillance.
  downstream:
  - target: Disseminated Secondary Yaws
    description: Persistent or reactivated infection can again manifest as active secondary yaws.
    evidence:
    - reference: PMID:29428183
      reference_title: "Re-emergence of yaws after single mass azithromycin treatment followed by targeted treatment: a longitudinal study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Mass azithromycin treatment (coverage rate of 84%) followed by targeted
        treatment programmes reduced the prevalence of active yaws from 1·8% to
        a minimum of 0·1% at 18 months (difference from baseline -1·7%, 95% CI,
        -1·9 to -1·4; p<0·0001), but the infection began to re-emerge after 24
        months with a significant increase to 0·4% at 42 months (difference from
        18 months 0·3%, 95% CI 0·1 to 0·4; p<0·0001).
      explanation: Directly supports active-yaws re-emergence after the initial intervention effect.
  evidence:
  - reference: PMID:34986286
    reference_title: "Trial of Three Rounds of Mass Azithromycin Administration for Yaws Eradication."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The reduction in the community prevalence of yaws was greater with three
      rounds of mass administration of azithromycin at 6-month intervals than
      with one round of mass administration of azithromycin followed by two
      rounds of targeted treatment.
    explanation: Directly supports repeated MDA over a single MDA followed by targeted treatment in this trial.
- name: Benzathine Benzylpenicillin Treatment Vulnerability
  biological_scale: CELLULAR
  description: >-
    Benzathine benzylpenicillin is clinically effective against yaws. General
    beta-lactam pharmacology supports inhibition of peptidoglycan
    transpeptidation, but the cited evidence does not establish a
    TPE-specific penicillin-binding-protein mechanism.
  role: therapeutic_vulnerability
  evidence:
  - reference: PMID:22203377
    reference_title: From the regulation of peptidoglycan synthesis to bacterial growth and morphology.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      although glycan chain polymerization occurs in the absence of
      transpeptidation (for example, in the presence of penicillin), efficient
      transpeptidation requires ongoing GTase reactions
    explanation: >-
      Supports the generic penicillin-transpeptidation mechanism, but not a
      TPE-specific molecular target; the yaws-specific claim is limited to
      clinical treatment susceptibility below.
  - reference: PMID:40036381
    reference_title: "Yaws - A Review of Clinical Features, Diagnosis and Treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Though yaws can be treated with benzathine penicillin, oral azithromycin has
      become the preferred treatment due to its ease of administration.
    explanation: Directly supports benzathine penicillin as the yaws treatment exploiting this vulnerability.

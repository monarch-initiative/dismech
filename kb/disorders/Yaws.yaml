      label: skin of body
  downstream:
  - target: Disseminated Secondary Yaws
    description: Untreated primary disease may progress to disseminated secondary yaws.
    evidence:
    - reference: PMID:40036381
      reference_title: "Yaws - A Review of Clinical Features, Diagnosis and Treatment."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        If untreated, this lesion heals spontaneously but may progress to secondary
        yaws, characterised by disseminated skin lesions, scaly papules and painful
        hyperkeratotic plaques on the palms and soles.
      explanation: Directly supports progression from an untreated primary lesion to secondary yaws.

- name: Endothelial Injury and Prothrombotic Coagulopathy
  description: >-
    Beyond direct respiratory epithelial injury, severe COVID-19 is
    characterized by endothelial activation and a prothrombotic coagulopathy.
    SARS-CoV-2-driven immuno-inflammatory and endothelial derangements promote
    micro- and macro-vascular thrombosis — reflected clinically in elevated
    D-dimer — and contribute to the multi-organ dysfunction that defines the
    lethal disease phenotype. This node instantiates the emerging
    endotheliopathy-centred pathophysiology model at the tissue scale, parallel
    to the cellular macrodomain immune-evasion arm.

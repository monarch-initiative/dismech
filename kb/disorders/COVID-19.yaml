- discussion_id: gap_covid_pancreatic_beta_cell_tropism
  prompt: >-
    Does SARS-CoV-2 directly infect and damage pancreatic beta cells during
    acute COVID-19, or is acute hyperglycemia driven predominantly by systemic
    inflammation, HPA-axis stress, and metabolic dysregulation in peripheral
    insulin-sensitive tissues?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#SARS-CoV-2 Spike-Mediated Entry via ACE2 and TMPRSS2
  rationale: >-
    Post-acute SARS-CoV-2 infection has been associated with new-onset diabetes,
    raising the mechanistic question of direct viral pancreatic tropism vs.
    systemic inflammation as the driver. A comprehensive post-pandemic review
    (Said et al. 2026, Diabetologia) identifies conflicting evidence on whether
    SARS-CoV-2 directly infects pancreatic beta cells during acute infection,
    or whether acute hyperglycemia and persistent metabolic dysfunction post-COVID
    result from HPA-axis stress, pro-inflammatory cytokines (TNF, IL-6, IL-1beta),
    and reduced peripheral insulin sensitivity. This distinction is mechanistically
    consequential: direct beta-cell tropism could produce permanent damage and
    predict Type 1-like post-COVID diabetes, whereas inflammation-mediated
    dysfunction would predict reversible Type 2 hyperglycemia. Resolution of this
    branch informs the mechanistic link to post-COVID diabetes development modeled
    in Long_COVID entry.
  evidence:
  - reference: PMID:42362970
    reference_title: "SARS-CoV-2 and diabetes: a post-pandemic reappraisal."
    supports: NO_EVIDENCE
    evidence_source: OTHER
    snippet: >-
      We summarise proposed pathophysiological mechanisms, including the effects
      of SARS-CoV-2 infection in the pancreas and on peripheral insulin-sensitive
      tissues. We review key meta-analyses assessing the association between
      COVID-19 and incident type 1 and type 2 diabetes and highlight strengths
      and weaknesses of the epidemiologic studies
    explanation: >-
      Said et al. identify this mechanistic gap as a critical uncertainty,
      noting conflicting evidence on direct pancreatic tropism vs. systemic
      inflammation as drivers of acute hyperglycemia and post-COVID diabetes.

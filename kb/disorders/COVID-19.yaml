- name: SARS-CoV-2 Mpro-Dependent Processing of pp1a/pp1ab
  biological_scale: MOLECULAR
  conforms_to: "viral_protease_inhibition#Virus-Encoded Protease-Dependent Polyprotein Processing"
  role: therapeutic_vulnerability
  description: >-
    SARS-CoV-2 main protease (Mpro, also called 3CLpro or nsp5) is the viral
    cysteine protease that cleaves at least 11 sites in the replicase
    polyproteins pp1a and pp1ab. This releases nonstructural proteins needed for
    the replication-transcription machinery. Mpro is distinct from the viral
    papain-like protease PLpro, which performs other cleavage events.

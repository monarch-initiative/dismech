discussions:
- discussion_id: gap_covid_acute_vs_persistent_diabetes
  prompt: >-
    What distinguishes acute hyperglycemia during COVID-19 hospitalization
    (stress-hyperglycemia) from persistent de novo diabetes development
    post-COVID? Do the pathways driving acute metabolic decompensation during
    infection differ mechanistically from those driving long-term beta-cell
    loss or insulin resistance post-infection?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#SARS-CoV-2 Spike-Mediated Entry via ACE2 and TMPRSS2
  rationale: >-
    COVID-19 hospitalized patients frequently develop hyperglycemia (~50%),
    but the majority resolve it post-discharge. However, population cohort
    studies (OpenSAFELY, N3C) and registry data report incident diabetes cases
    years post-infection. The mechanism(s) linking acute infection-driven
    hyperglycemia to persistent diabetes risk is not clear: stress-hyperglycemia
    may unmask pre-existing insulin resistance that progresses to type 2
    diabetes, acute direct infection of beta cells may cause lasting damage,
    or unresolved post-viral inflammation may sustain pathways months/years
    later. A prospective multi-timepoint mechanistic study is needed.
  evidence:
  - reference: PMID:42362970
    reference_title: "SARS-CoV-2 and diabetes: a post-pandemic reappraisal."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      stress- and treatment-induced hyperglycaemia is common in critical
      illness, occurring in approximately 50% of affected individuals. While
      often transient, these effects may unmask persistent metabolic
      dysfunction in individuals at risk of type 2 diabetes [36, 37].
    explanation: >-
      Identifies the unresolved distinction: acute hyperglycemia may be
      reversible stress-response versus a marker of persistent damage.

- discussion_id: gap_covid_type1_vs_type2_divergence
  prompt: >-
    SARS-CoV-2 infection has been associated with both incident type 1 and
    type 2 diabetes, yet the mechanistic pathways and patient risk factors
    that predispose to one versus the other remain unclear. Do viral and/or
    host immune and metabolic pathways distinguish type 1 (autoimmune
    beta-cell destruction) from type 2 (insulin resistance + relative
    beta-cell inadequacy) post-COVID trajectories?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#SARS-CoV-2 Spike-Mediated Entry via ACE2 and TMPRSS2
  rationale: >-
    Meta-analyses and prospective cohorts report increased incidence of both
    type 1 diabetes (especially in children with new-onset DKA above baseline)
    and type 2 diabetes (particularly in hospitalized and older adults). The
    role of SARS-CoV-2 as a direct trigger of autoimmunity, a driver of
    insulin resistance through persistent inflammation, or an unmasker of
    pre-existing glucose intolerance is not yet resolved. Mechanistic and
    genetic factors that predict which type develops are largely unknown.
  evidence:
  - reference: PMID:42362970
    reference_title: "SARS-CoV-2 and diabetes: a post-pandemic reappraisal."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Soon, additional studies began to identify similar increases in new-onset
      type 2 diabetes [17].
    explanation: >-
      Documents both type 1 and type 2 incidence increases post-COVID, raising
      the question of shared versus divergent mechanisms.

- discussion_id: gap_covid_macrodomain_allosteric_pivot
  prompt: >-
    Can the SARS-CoV-2 Nsp3 Mac1 macrodomain be controlled as a thermodynamic
    pivot point — by allosteric stabilization of distinct conformational
    states or by PROTAC-based physical degradation — to restore host
    PARP9/DTX3L-dependent antiviral ADP-ribosylation and arrest viral
    replication, and is this strategy broadly active across coronaviruses?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Nsp3 Macrodomain De-ADP-Ribosylation Countermeasure
  - pathophysiology#Host PARP9/DTX3L Antiviral ADP-Ribosylation
  rationale: >-
    The Nsp3 Mac1 macrodomain is a conserved, structurally tractable viral
    enzyme that selectively hydrolyzes the end product of the host IFN-PARP
    antiviral program. Active-site inhibitors target the ADP-ribose pocket
    directly, but the broader interactome framing suggests an alternative:
    stabilize defined conformational states of Mac1 with allosteric binders to
    test how each conformation reshapes the host PARP-mediated antiviral
    response, or eliminate the protein outright with a viral-protein-directed
    PROTAC warhead. Because Mac1 folds are conserved across SARS-CoV-2,
    SARS-CoV, and MERS-CoV, conformational stabilizers or degraders may have
    broad anti-coronavirus activity — the kind of pivot-point control that
    distinguishes a thermodynamic interactome framing from single-enzyme
    inhibition.
  proposed_experiments:
  - experiment_id: exp_covid_mac1_allosteric_pivot
    name: Allosteric Mac1 conformational stabilization versus PROTAC degradation in SARS-CoV-2-infected airway organoids
    description: >-
      Infect human airway organoids and ACE2/TMPRSS2-positive lung epithelial
      lines with authentic SARS-CoV-2 and treat with (a) active-site Mac1
      inhibitors, (b) allosteric Mac1 binders tuned to stabilize discrete
      conformational states, and (c) a viral-Mac1-directed PROTAC warhead.
      Read out viral genome replication, infectious virus production, host
      PARP9/DTX3L-mediated ADP-ribosylation marks on host substrates, interferon-

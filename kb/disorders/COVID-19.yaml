- accession: ega:EGAS00001004481
  title: Single-cell analysis of airway samples identifies immune cell activation correlating with COVID-19 disease severity
  description: To investigate the immune response and mechanisms associated with severe COVID-19, we performed single-cell RNA-seq on nasopharyngeal and bronchial samples from 19 clinically well-characterized patients with moderate or critical disease and from 5 healthy controls. We identified airway epithelial cell types and states vulnerable to SARS-CoV-2 infection. In COVID-19 patients, epithelial cells showed an average threefold increase in expression of the SARS-CoV-2 entry receptor ACE2, which correlated with interferon signals by immune cells.

  biological_scale: MOLECULAR
  conforms_to: "viral_protease_inhibition#Synthesis of the Viral Polyprotein Precursor"
  role: trigger
  description: >-
    Following entry and release of the positive-sense RNA genome, host
    translational machinery produces the overlapping SARS-CoV-2 replicase
    polyproteins pp1a and pp1ab. These precursors contain the nonstructural
    proteins that must be released by PLpro and Mpro cleavage before the viral
    replication machinery is functional.

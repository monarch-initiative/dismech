          about 20 to 40% of all epilepsies.
        explanation: >-
          Gives the share of epilepsy attributable to the IGE group as a whole.
          Marked PARTIAL because it bounds rather than measures JAE specifically,
          which is why no rate_per_100000 is asserted.
progression:
  - phase: Persistence into adulthood with attempted medication withdrawal
    age_range: Adolescence to adulthood
    notes: >-
      In contrast to childhood absence epilepsy, JAE usually persists. In a
      10-year follow-up cohort, about two thirds of patients reached at least two
      years of seizure freedom on medication, and roughly half attempted
      medication withdrawal, but only a small number ultimately discontinued
      treatment entirely. EEG abnormalities improved over follow-up in most
      patients.
    evidence:
      - reference: PMID:40945312
        reference_title: >-
          Long-term seizure outcomes and the likelihood of antiseizure medication
          withdrawal in patients with juvenile absence epilepsy: A 10-year
          follow-up study.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Among these patients, 38 (65.5 %) achieved seizure freedom for at least
          2 years.
        explanation: >-
          Quantifies the seizure-freedom rate in a JAE-specific long-term cohort.
      - reference: PMID:40945312
        reference_title: >-
          Long-term seizure outcomes and the likelihood of antiseizure medication
          withdrawal in patients with juvenile absence epilepsy: A 10-year
          follow-up study.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          After a median EEG follow-up period of 6 years, abnormal EEG improved in
          34 of the 58 patients
        explanation: >-
          Documents EEG improvement over long-term follow-up, supporting the
          electrographic component of the progression claim.
treatments:
  - name: Valproate

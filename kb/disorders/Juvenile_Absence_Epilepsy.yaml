        reference_title: >-
          Reconsidering the role of selective sodium channel blockers in genetic
          generalized epilepsy.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Selective sodium channel blockers (SSCBs) have a limited use in genetic
          generalized epilepsy (GGE), due to their well-known risk of seizure
          worsening.
        explanation: >-
          States the seizure-worsening risk that motivates treating these agents

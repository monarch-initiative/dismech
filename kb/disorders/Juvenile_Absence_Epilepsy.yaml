references:
  - reference: PMID:35503716
    title: >-
      ILAE definition of the Idiopathic Generalized Epilepsy Syndromes: Position
      statement by the ILAE Task Force on Nosology and Definitions.
  - reference: PMID:32437558
    title: >-
      Clinical and experimental insight into pathophysiology, comorbidity and
      therapy of absence seizures.
notes: >-
  Scope note. This entry models JAE as a distinct ILAE syndrome rather than as a
  late-onset variant of childhood absence epilepsy. The shared thalamocortical
  machinery is deliberately curated here rather than delegated to the sibling
  Childhood_Absence_Epilepsy entry, because the two syndromes differ in the
  features that matter clinically, namely absence frequency, the burden of
  generalized tonic-clonic seizures, and the likelihood of remission. Whether
  that clinical difference reflects a genuine mechanistic boundary is captured as
  an explicit open question in the discussions block rather than asserted.

  Module conformance note. Five nodes declare conformance to
  epilepsy_excitation_inhibition_imbalance. One edge deliberately departs from
  the generic module: the module runs ion-channel dysfunction into
  excitation-inhibition imbalance, whereas in the thalamocortical absence
  mechanism the arrow also runs the other way, because GABA-B-mediated
  hyperpolarization from the reticular nucleus is what de-inactivates the T-type
  calcium channels and licenses the next burst. The JAE graph therefore carries
  a reticular-to-calcium edge the module does not, which is a genuine feature of
  absence physiology rather than a conformance defect.
inheritance:
  - name: Polygenic susceptibility
    description: >-
      JAE is highly heritable but not Mendelian. Liability is distributed across
      many common variants of small effect together with rarer variants in
      thalamocortical ion channel and GABA-A receptor subunit genes. There is no
      single-gene inheritance pattern to counsel on in the typical case, which is
      why the genetic entries here are typed as susceptibility or modifier rather
      than causative.
    inheritance_term:
      preferred_term: Polygenic inheritance
      term:
        id: HP:0010982
        label: Polygenic inheritance
    evidence:
      - reference: PMID:27367160
        reference_title: >-
          Molecular Pathogenic Basis for GABRG2 Mutations Associated With a
          Spectrum of Epilepsy Syndromes, From Generalized Absence Epilepsy to
          Dravet Syndrome.
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Mutations in GABRG2 have been associated with simple febrile seizures
          and with genetic epilepsy syndromes, including childhood absence
          epilepsy, generalized epilepsy with febrile seizures plus, and Dravet
          syndrome or severe myoclonic epilepsy in infancy.
        explanation: >-
          Illustrates that the same gene contributes across several generalized
          epilepsy syndromes rather than segregating with one, which is the
          hallmark of a polygenic liability architecture. Marked PARTIAL because
          the paper characterizes a gene, not the inheritance mode of JAE.
      - reference: PMID:32227660
        reference_title: CACNA1H variants are not a cause of monogenic epilepsy.
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          we conclude that there is limited evidence that CACNA1H is a monogenic
          cause of epilepsy in humans
        explanation: >-
          Evidence against a monogenic model for the leading candidate gene. Marked
          PARTIAL because refuting one gene's monogenic status supports, but does
          not by itself establish, a polygenic architecture for the syndrome.
pathophysiology:
  - name: Polygenic Susceptibility to Generalized Absence Epilepsy
    biological_scale: MOLECULAR
    description: >-
      JAE is highly heritable but, in the great majority of patients, is not
      monogenic. Susceptibility is conferred by common variants of individually
      small effect together with rarer variants in genes encoding thalamic and
      cortical voltage-gated calcium channels and GABA-A receptor subunits. No
      single gene is necessary or sufficient, and the individual gene
      associations that were asserted most confidently in the early literature
      have not all survived replication.
    biological_processes:
      - preferred_term: regulation of postsynaptic membrane potential
        term:
          id: GO:0060078
          label: regulation of postsynaptic membrane potential
        modifier: ABNORMAL
    downstream:
      - target: Altered Thalamic Low-Threshold Calcium Bursting
      - target: Aberrant GABAergic Inhibition in the Thalamic Reticular Nucleus
    evidence:
      - reference: PMID:27367160
        reference_title: >-
          Molecular Pathogenic Basis for GABRG2 Mutations Associated With a
          Spectrum of Epilepsy Syndromes, From Generalized Absence Epilepsy to
          Dravet Syndrome.
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Mutations in GABRG2 have been associated with simple febrile seizures
          and with genetic epilepsy syndromes, including childhood absence
          epilepsy, generalized epilepsy with febrile seizures plus, and Dravet
          syndrome or severe myoclonic epilepsy in infancy.
        explanation: >-
          Establishes GABA-A receptor subunit genes as a susceptibility class for
          generalized absence epilepsy. Marked PARTIAL because the cited spectrum
          is anchored on childhood absence epilepsy rather than JAE specifically.
  - name: Altered Thalamic Low-Threshold Calcium Bursting
    conforms_to: "epilepsy_excitation_inhibition_imbalance#Ion Channel and Synaptic Dysfunction"
    biological_scale: CELLULAR
    description: >-
      Thalamic relay and reticular neurons carry a low-voltage-activated T-type
      calcium current that, when a neuron is hyperpolarized and then released,
      produces a low-threshold calcium spike crowned by a high-frequency burst of
      action potentials. This burst mode is the cellular substrate of the spike
      component of the spike-wave discharge, and it is the target of the
      first-line absence drug ethosuximide.
    cell_types:
      - preferred_term: thalamic relay neuron
        term:
          id: CL:4023068
          label: thalamic excitatory neuron
    biological_processes:
      - preferred_term: T-type calcium current in thalamic neurons
        term:
          id: GO:0090676
          label: calcium ion transmembrane transport via low voltage-gated calcium channel
        modifier: INCREASED
    downstream:
      - target: Hypersynchronous Thalamocortical Oscillation
    evidence:
      - reference: PMID:11896171
        reference_title: >-
          Activity of thalamic reticular neurons during spontaneous genetically
          determined spike and wave discharges.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          The prolonged (up to 15 action potentials), high-frequency bursts
          present during SWDs were tightly synchronized between adjacent neurons,
          correlated with the EEG spike component, and generated by a
          low-threshold Ca(2+) potential
        explanation: >-
          Intracellular recordings during spontaneous spike-wave discharges in the
          GAERS rat tie the EEG spike component directly to low-threshold
          calcium-generated bursts, the cellular event this node asserts.
      - reference: PMID:22344687
        reference_title: >-
          T-type calcium channel blockers that attenuate thalamic burst firing and
          suppress absence seizures.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          we identified the T-type Ca(2+) channel blockers Z941 and Z944 as
          candidate agents and showed in thalamic slices that they attenuated
          burst firing of thalamic reticular nucleus neurons in GAERS
        explanation: >-
          Pharmacological confirmation running the other direction: selectively
          blocking the T-type current attenuates the burst firing and suppresses
          absence seizures, supporting a causal rather than merely correlative
          role.
  - name: Aberrant GABAergic Inhibition in the Thalamic Reticular Nucleus
    conforms_to: "epilepsy_excitation_inhibition_imbalance#Excitation-Inhibition Imbalance"
    biological_scale: CELLULAR
    description: >-
      The thalamic reticular nucleus is a GABAergic shell that inhibits thalamic
      relay neurons. The rhythmic hyperpolarization it imposes is what
      de-inactivates T-type calcium channels in relay cells and licenses the next
      burst, making reticular GABAergic output the pacemaker candidate for the
      spike-wave rhythm. Recordings in genetic models show reticular neurons fire
      synchronized bursts locked to the EEG spike while retaining intranuclear
      lateral inhibition.
    cell_types:
      - preferred_term: GABAergic neuron of the thalamic reticular nucleus
        term:
          id: CL:0000617
          label: GABAergic neuron
    biological_processes:
      - preferred_term: gamma-aminobutyric acid signaling pathway
        term:
          id: GO:0007214
          label: gamma-aminobutyric acid signaling pathway
        modifier: ABNORMAL
    downstream:
      - target: Altered Thalamic Low-Threshold Calcium Bursting
      - target: Hypersynchronous Thalamocortical Oscillation
    evidence:
      - reference: PMID:11896171
        reference_title: >-
          Activity of thalamic reticular neurons during spontaneous genetically
          determined spike and wave discharges.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          This novel finding demonstrates that spontaneous genetically determined
          SWDs occur in the presence of intra-NRT lateral inhibition.
        explanation: >-
          Directly characterizes reticular thalamic GABAergic behaviour during
          genetically determined spike-wave discharges, the claim of this node.
  - name: Corticothalamic Drive from Deep-Layer Cortical Neurons
    biological_scale: CELLULAR
    description: >-
      Layer VI pyramidal neurons supply the sole descending cortical input to
      thalamic relay and reticular cells. Selectively removing P/Q-type calcium
      channels from these neurons alone is sufficient to produce a spontaneous,
      ethosuximide-responsive spike-wave absence phenotype, showing that the
      cortical arm of the loop is not merely a passive recipient of a thalamic
      rhythm.
    cell_types:
      - preferred_term: layer VI corticothalamic projection neuron
        term:
          id: CL:4023013
          label: corticothalamic-projecting glutamatergic cortical neuron
    downstream:
      - target: Hypersynchronous Thalamocortical Oscillation
    evidence:
      - reference: PMID:26758833
        reference_title: >-
          Isolated P/Q Calcium Channel Deletion in Layer VI Corticothalamic
          Neurons Generates Absence Epilepsy.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Targeted Cacna1a ablation in layer VI cells resulted in mice that
          display a robust spontaneous spike-wave absence seizure phenotype
          accompanied by behavioral arrest and inhibited by ethosuximide.
        explanation: >-
          Establishes that a lesion confined to the corticothalamic arm is
          sufficient to generate the absence phenotype, supporting a cortical
          contribution to ictogenesis independent of a primary thalamic defect.
  - name: Hypersynchronous Thalamocortical Oscillation
    conforms_to: "epilepsy_excitation_inhibition_imbalance#Neuronal Hyperexcitability and Hypersynchrony"
    biological_scale: TISSUE
    description: >-
      Recurrent excitation and inhibition around the cortex-thalamus-reticular
      loop entrains large neuronal populations into a pathological synchronized
      rhythm. Network analyses in drug-naive JAE patients show the reorganization
      is not confined to the seizure itself: interictal network efficiency is
      already abnormal between seizures.
    downstream:
      - target: Generalized Spike-Wave Discharges
    evidence:
      - reference: PMID:22344687
        reference_title: >-
          T-type calcium channel blockers that attenuate thalamic burst firing and
          suppress absence seizures.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          They arise from abnormal, hypersynchronous neuronal firing in brain
          thalamocortical circuits.
        explanation: >-
          States the thalamocortical hypersynchrony mechanism that this node
          represents.
      - reference: PMID:38550342
        reference_title: >-
          Exploring brain network oscillations during seizures in drug-naïve
          patients with juvenile absence epilepsy.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Compared with the resting state of the HC group, the global efficiency,
          local efficiency, and clustering coefficients of the JAE group decreased
          in the inter-ictal state.
        explanation: >-
          Graph-theoretic EEG analysis in untreated JAE patients specifically,
          showing that network topology is abnormal even between seizures, which
          supports a persistent network state rather than a purely paroxysmal one.
      - reference: PMID:37925871
        reference_title: >-
          Dynamic alterations of striatal-related functional networks in juvenile
          absence epilepsy.
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          We found altered dFC variability of striatal-cortical/subcortical
          networks in patients with JAE.
        explanation: >-
          Extends the abnormal-network claim beyond the classic thalamocortical
          loop to striatal circuits in JAE patients. Marked PARTIAL because
          resting-state connectivity change is correlational and does not by
          itself establish that the striatum participates in generating the
          discharge.
  - name: Generalized Spike-Wave Discharges
    conforms_to: "epilepsy_excitation_inhibition_imbalance#Seizure Generation and Epileptogenesis"
    biological_scale: ORGANISM
    description: >-
      Bilaterally synchronous generalized spike-wave activity is the
      electrographic signature of the syndrome. The ILAE places the acceptable
      frequency band for generalized spike-wave in the idiopathic generalized
      epilepsies at 2.5 to 5.5 Hz; JAE discharges are typically at the faster end
      of the classic 3 Hz absence rhythm.
    downstream:
      - target: Absence Seizures
        causal_link_type: DIRECT
        description: >-
          The absence seizure is the behavioural expression of the generalized
          spike-wave discharge; the two are time-locked rather than merely
          associated.
        evidence:
          - reference: PMID:22344687
            reference_title: >-
              T-type calcium channel blockers that attenuate thalamic burst firing
              and suppress absence seizures.
            supports: SUPPORT
            evidence_source: OTHER
            snippet: >-
              Absence seizures are a common seizure type in children with genetic
              generalized epilepsy and are characterized by a temporary loss of
              awareness, arrest of physical activity, and accompanying
              spike-and-wave discharges on an electroencephalogram.
            explanation: >-
              States the coupling of the clinical absence to the accompanying
              spike-wave discharge, which is the content of this edge.
      - target: Generalized Tonic-Clonic Seizures
        causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
        description: >-
          Generalized tonic-clonic seizures arise from the same generalized
          epileptic network, but the transition from spike-wave activity to a
          tonic-clonic seizure is not mechanistically resolved, so the edge is
          recorded as indirect with unknown intermediates.
    evidence:
      - reference: PMID:35503716
        reference_title: >-
          ILAE definition of the Idiopathic Generalized Epilepsy Syndromes:
          Position statement by the ILAE Task Force on Nosology and Definitions.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          with 2.5-5.5 Hz generalized spike-wave
        explanation: >-
          Gives the ILAE-sanctioned generalized spike-wave frequency band for the
          idiopathic generalized epilepsies, of which JAE is one.
  - name: Absence Seizures
    conforms_to: "epilepsy_excitation_inhibition_imbalance#Recurrent Unprovoked Seizures"
    biological_scale: ORGANISM
    description: >-
      Behavioral arrest with impairment of awareness, time-locked to the
      generalized spike-wave discharge. In JAE these are less frequent than the
      pyknoleptic, many-times-daily absences of childhood absence epilepsy.
    evidence:
      - reference: PMID:22344687
        reference_title: >-
          T-type calcium channel blockers that attenuate thalamic burst firing and
          suppress absence seizures.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          characterized by a temporary loss of awareness, arrest of physical
          activity, and accompanying spike-and-wave discharges on an
          electroencephalogram
        explanation: >-
          Defines the clinical content of the absence seizure that this terminal
          node represents.
  - name: Generalized Tonic-Clonic Seizures
    biological_scale: ORGANISM
    description: >-
      Most patients with JAE also have generalized tonic-clonic seizures, which
      distinguishes the syndrome clinically from childhood absence epilepsy and
      is a principal driver of the need for long-term treatment.
    evidence:
      - reference: PMID:32644481
        reference_title: Juvenile Absence Epilepsy.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          is characterized by absence seizures and generalized tonic-clonic
          seizures
        explanation: >-
          Establishes generalized tonic-clonic seizures as a defining component of
          the JAE syndrome, which is what this terminal node asserts.
phenotypes:
  - name: Typical Absence Seizures
    category: Neurologic
    description: >-
      Abrupt-onset, abrupt-offset impairment of awareness, the defining seizure
      type of JAE. Absences are less frequent and often somewhat longer, with
      less complete loss of awareness, than the pyknoleptic absences of childhood
      absence epilepsy.
    phenotype_term:
      preferred_term: Typical absence seizure
      term:
        id: HP:0011147
        label: Typical absence seizure
      onset:
        onset_category: JUVENILE
    frequency: VERY_FREQUENT
    evidence:
      - reference: PMID:32644481
        reference_title: Juvenile Absence Epilepsy.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Juvenile absence epilepsy is an idiopathic generalized epilepsy syndrome
          that is recognized by the ILAE (International League Against Epilepsy)
          that typically starts in adolescence around puberty and is characterized
          by absence seizures and generalized tonic-clonic seizures.
        explanation: >-
          Names absence seizures as a defining feature of the syndrome. Frequency
          is set VERY_FREQUENT because absence seizures are definitional for JAE,
          so essentially all diagnosed patients have them.
      - reference: PMID:38550342
        reference_title: >-
          Exploring brain network oscillations during seizures in drug-naïve
          patients with juvenile absence epilepsy.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Thirty-six juvenile absence epilepsy (JAE) patients with a current high
          frequency of seizures (more than five seizures during a 2 h EEG
          examination) were included.
        explanation: >-
          Primary-cohort documentation of recorded absence seizures in
          syndrome-diagnosed JAE patients, so the phenotype does not rest on a
          tertiary clinical reference alone.
  - name: Generalized Tonic-Clonic Seizures
    category: Neurologic
    description: >-
      Bilateral tonic-clonic seizures of generalized onset occur in the great
      majority of patients with JAE and are the main reason long-term antiseizure
      medication is required. Cumulative tonic-clonic seizure burden predicts a
      worse chance of seizure freedom.
    phenotype_term:
      preferred_term: Bilateral tonic-clonic seizure with generalized onset
      term:
        id: HP:0025190
        label: Bilateral tonic-clonic seizure with generalized onset
    evidence:
      - reference: PMID:32644481
        reference_title: Juvenile Absence Epilepsy.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          typically starts in adolescence around puberty and is characterized by
          absence seizures and generalized tonic-clonic seizures
        explanation: >-
          Names generalized tonic-clonic seizures as a characteristic feature of
          the syndrome alongside absences.
      - reference: PMID:40945312
        reference_title: >-
          Long-term seizure outcomes and the likelihood of antiseizure medication
          withdrawal in patients with juvenile absence epilepsy: A 10-year
          follow-up study.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          the total number of generalized tonic-clonic seizures experienced,
          presence of absence seizures on follow-up EEG and the persistence of
          hyperventilation positivity on EEG were associated with an unfavorable
          outcome regarding seizure freedom
        explanation: >-
          A 10-year JAE follow-up cohort showing tonic-clonic seizure burden is
          prognostically important, supporting the clinical weight given to this
          phenotype.
  - name: Myoclonic Jerks
    category: Neurologic
    description: >-
      A minority of patients with JAE have myoclonic jerks in addition to
      absences and tonic-clonic seizures. Prominent myoclonus should prompt
      reconsideration of juvenile myoclonic epilepsy.
    phenotype_term:
      preferred_term: Myoclonic seizure
      term:
        id: HP:0032794
        label: Myoclonic seizure
    frequency: OCCASIONAL
    evidence:
      - reference: PMID:32644481
        reference_title: Juvenile Absence Epilepsy.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          In some patients, there may be additional myoclonic jerks as well.
        explanation: >-
          States that myoclonic jerks occur in a subset of JAE patients. The
          qualitative phrase "in some patients" maps to OCCASIONAL under the
          project frequency mapping guidance.
  - name: Absence Status Epilepticus
    category: Neurologic
    description: >-
      Prolonged confusional states with subcontinuous generalized spike-wave
      activity on EEG. This is a clinically important complication of JAE because
      it presents as altered mental status rather than as recognizable seizures
      and is readily misattributed to a psychiatric or toxic-metabolic cause,
      delaying EEG and treatment.
    phenotype_term:
      preferred_term: Typical absence status epilepticus
      term:
        id: HP:0032863
        label: Typical absence status epilepticus
    evidence:
      - reference: PMID:30530409
        reference_title: >-
          Juvenile absence epilepsy relapsing as recurrent absence status,
          mimicking transient global amnesia, in an elderly patient.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          AS is common in juvenile absence epilepsy
        explanation: >-
          States directly that absence status epilepticus is common in JAE. No
          frequency band is asserted here because this is a single case report
          making a qualitative claim rather than a cohort measurement.
      - reference: PMID:30530409
        reference_title: >-
          Juvenile absence epilepsy relapsing as recurrent absence status,
          mimicking transient global amnesia, in an elderly patient.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          An EEG disclosed, on both occasions, subcontinuous generalized
          spike-and-wave discharges, consistent with absence status epilepticus
        explanation: >-
          Documents the electrographic substrate of absence status, tying the
          phenotype to the same generalized spike-wave mechanism modelled in the
          pathophysiology section.
  - name: Impaired School Performance
    category: Neurologic
    description: >-
      Population-registry data show a measurable educational cost of JAE that is
      not shared equally by the other idiopathic generalized epilepsies. In a
      Danish national cohort, JAE carried roughly double the hazard of requiring
      special-needs education relative to age-matched population controls, an
      effect not seen in juvenile myoclonic epilepsy.
    phenotype_term:
      preferred_term: Specific learning disability
      term:
        id: HP:0001328
        label: Specific learning disability
    evidence:
      - reference: PMID:35595971
        reference_title: >-
          School performance and psychiatric comorbidity in juvenile absence
          epilepsy and juvenile myoclonic epilepsy: a Danish population-based
          cohort study.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          JAE had two times increased hazard for special needs education compared
          with age-matched population controls
        explanation: >-
          Quantifies the educational impact in a JAE-specific national registry
          cohort with population controls, and the same sentence records that the
          effect was absent in juvenile myoclonic epilepsy, which supports treating
          this as syndrome-specific rather than a generic epilepsy effect.
  - name: Generalized Spike-Wave on EEG
    category: Neurologic
    description: >-
      Interictal and ictal EEG shows bilaterally synchronous generalized
      spike-wave complexes on a normal background, typically activated by
      hyperventilation.
    phenotype_term:
      preferred_term: EEG with spike-wave complexes
      term:
        id: HP:0010850
        label: EEG with spike-wave complexes
    evidence:
      - reference: PMID:32644481
        reference_title: Juvenile Absence Epilepsy.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          with an electroencephalographic pattern of generalized epileptiform
          spike and wave or polyspike and wave discharge, at times with a shifting
          predominance on a normal background
        explanation: >-
          Describes the generalized spike-wave EEG pattern on a normal background
          that characterizes the idiopathic generalized epilepsies including JAE.
  - name: Attention and Cognitive Impairment
    category: Neurologic
    description: >-
      Absence epilepsies carry a substantial neuropsychiatric comorbidity burden.
      Attentional deficits can predate the epilepsy diagnosis, may persist despite
      pharmacological seizure control, and are worsened by valproate monotherapy.
      In JAE specifically, imaging shows structural and functional correlates of a
      cognitive phenotype.
    phenotype_term:
      preferred_term: Attention deficit hyperactivity disorder
      term:
        id: HP:0007018
        label: Attention deficit hyperactivity disorder
    evidence:
      - reference: PMID:32437558
        reference_title: >-
          Clinical and experimental insight into pathophysiology, comorbidity and
          therapy of absence seizures.
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          attention deficits can be detected before the epilepsy diagnosis, may
          persist even when seizures are pharmacologically controlled and are
          aggravated by valproic acid monotherapy
        explanation: >-
          Documents the attentional comorbidity of absence epilepsy and its
          aggravation by valproate. Marked PARTIAL because the review addresses
          absence seizures broadly rather than JAE alone.
      - reference: PMID:41531116
        reference_title: >-
          Syndrome-specific and familial imaging traits in juvenile absence
          epilepsy.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Gray matter volume was reduced in sensorimotor regions and in the left
          inferior and middle frontal gyri in patients.
        explanation: >-
          Provides JAE-specific structural imaging correlates of the cognitive
          profile, anchoring the comorbidity claim in this syndrome rather than in
          absence epilepsy generally.
genetic:
  - name: GABRG2
    gene_term:
      preferred_term: GABRG2
      term:
        id: hgnc:4087
        label: GABRG2
    relationship_type: SUSCEPTIBILITY
    variant_origin: GERMLINE
    notes: >-
      GABRG2 encodes the GABA-A receptor gamma-2 subunit, required for receptor
      trafficking and synaptic clustering. Variants are associated with a spectrum
      of generalized epilepsies that includes generalized absence epilepsy. Listed
      here as a susceptibility contributor to the inhibitory arm of the
      thalamocortical loop, not as a monogenic cause of JAE.
    evidence:
      - reference: PMID:27367160

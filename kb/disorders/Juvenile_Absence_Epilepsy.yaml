name: Juvenile Absence Epilepsy
creation_date: "2026-08-04T00:00:00Z"
category: Complex
description: >-
  Juvenile absence epilepsy (JAE) is one of the four idiopathic generalized
  epilepsy syndromes recognized by the ILAE, with onset around puberty. Absence
  seizures are the defining seizure type but occur far less frequently than in
  childhood absence epilepsy, and the great majority of patients also develop
  generalized tonic-clonic seizures; a minority have myoclonic jerks. The EEG
  signature is bilaterally synchronous generalized spike-wave activity. The
  mechanism is a heritable derangement of the thalamocortical loop that permits
  pathological hypersynchronous oscillation; where in that loop the seizure is
  actually initiated is an active controversy. Unlike childhood absence epilepsy,
  JAE seldom remits spontaneously and most patients need long-term antiseizure
  medication.
parents:
  - Epilepsy
  - Neurological Disease
synonyms:
  - JAE
  - epilepsy juvenile absence
disease_term:
  preferred_term: juvenile absence epilepsy
  term:
    id: MONDO:0800453
    label: juvenile absence epilepsy
mappings:
  mondo_mappings:
    - term:
        id: MONDO:0800453
        label: juvenile absence epilepsy
      mapping_predicate: skos:exactMatch
      mapping_source: MONDO
      mapping_justification: >-
        MONDO:0800453 is the juvenile absence epilepsy concept, a child of the

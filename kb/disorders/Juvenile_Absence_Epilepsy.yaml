      Broad-spectrum antiseizure medication effective against both the absence
      and the generalized tonic-clonic seizures of JAE, and an independent
      predictor of seizure freedom in long-term follow-up. Its use is constrained
      by teratogenicity and by aggravation of attentional deficits, which is why
      it is generally avoided as first-line therapy in girls and women of
      childbearing potential.

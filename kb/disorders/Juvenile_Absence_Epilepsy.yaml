differential_diagnoses:
  - name: Childhood Absence Epilepsy
    disease_term:
      preferred_term: childhood absence epilepsy
      term:
        id: MONDO:0010826
        label: childhood absence epilepsy
    description: >-
      The nearest neighbour of JAE and the hardest to separate, because the two
      share the thalamocortical mechanism, the EEG signature, and much of their
      candidate genetics. The age-of-onset boundary between them is a
      curation-relevant open question, recorded in the discussions block.
    distinguishing_features:
      - Earlier onset, typically in mid-childhood rather than around puberty.
      - Pyknoleptic absences occurring many times daily rather than sporadically.
      - Much lower burden of generalized tonic-clonic seizures.
      - High rate of spontaneous remission, whereas JAE usually persists.
    evidence:
      - reference: PMID:35503716
        reference_title: >-
          ILAE definition of the Idiopathic Generalized Epilepsy Syndromes:
          Position statement by the ILAE Task Force on Nosology and Definitions.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          The goal of this paper is to delineate the four syndromes comprising the
          IGEs, namely childhood absence epilepsy, juvenile absence epilepsy,
          juvenile myoclonic epilepsy, and epilepsy with generalized tonic-clonic
          seizures alone.
        explanation: >-
          Establishes that the ILAE treats childhood absence epilepsy and juvenile
          absence epilepsy as separate syndromes requiring differentiation, which
          is what makes this a differential rather than a synonym.
  - name: Juvenile Myoclonic Epilepsy
    disease_term:
      preferred_term: juvenile myoclonic epilepsy
      term:
        id: MONDO:0009696
        label: juvenile myoclonic epilepsy
    description: >-
      Overlaps with JAE in age of onset and in the occurrence of absences,
      myoclonus, and generalized tonic-clonic seizures, but is defined by
      prominent myoclonic jerks, characteristically on awakening. The two
      syndromes also diverge on measured outcomes rather than only on semiology.
    distinguishing_features:
      - Prominent myoclonic jerks, typically on awakening, are definitional.
      - Absence seizures are not required for the diagnosis.
      - Functional and structural imaging reorganization patterns differ from JAE.
      - The doubled hazard for special-needs education seen in JAE is not seen here.
    evidence:
      - reference: PMID:35595971
        reference_title: >-
          School performance and psychiatric comorbidity in juvenile absence
          epilepsy and juvenile myoclonic epilepsy: a Danish population-based
          cohort study.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          JAE had two times increased hazard for special needs education compared
          with age-matched population controls (hazard ratio 2.2, 95% CI =
          1.1‒4.6, p = 0.03); this was not seen in JME.
        explanation: >-
          Provides a measured outcome difference between the two syndromes rather
          than a purely semiological distinction, supporting their separation.
  - name: Epilepsy with Generalized Tonic-Clonic Seizures Alone
    description: >-
      The fourth ILAE idiopathic generalized epilepsy syndrome. Shares the
      generalized spike-wave EEG and the adolescent onset but lacks absence
      seizures as a defining feature. No MONDO binding is asserted here because
      no MONDO term for this ILAE 2022 syndrome was resolvable at curation time.
    distinguishing_features:
      - Absence seizures are absent, whereas they are definitional for JAE.
      - Generalized tonic-clonic seizures are the sole seizure type.
    evidence:
      - reference: PMID:35503716
        reference_title: >-
          ILAE definition of the Idiopathic Generalized Epilepsy Syndromes:
          Position statement by the ILAE Task Force on Nosology and Definitions.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          juvenile myoclonic epilepsy, and epilepsy with generalized tonic-clonic
          seizures alone
        explanation: >-
          Names this syndrome as one of the four ILAE idiopathic generalized
          epilepsies that must be distinguished from JAE.
  - name: GLUT1 Deficiency
    disease_term:
      preferred_term: encephalopathy due to GLUT1 deficiency
      term:
        id: MONDO:0011724
        label: encephalopathy due to GLUT1 deficiency
    description: >-
      SLC2A1 loss of function impairs glucose transport across the blood-brain
      barrier, and the resulting cerebral energy deficit can present as absence
      epilepsy that phenocopies an idiopathic generalized syndrome. It is
      modelled here as a differential rather than as a cause of JAE because the
      mechanism is metabolic rather than a thalamocortical channel or receptor
      defect, and because the published yield comes from early-onset absence
      cohorts, before age four, rather than from JAE-diagnosed patients. The
      familial form nevertheless has widely variable onset, so it stays on the
      differential list for atypical or refractory presentations. This is the one
      differential that changes management, since the ketogenic diet supplies
      ketone bodies as an alternative fuel that bypasses the missing transporter.
      The diet is deliberately not listed under this entry's treatments, because
      it treats this differential rather than JAE itself and no JAE-specific
      evidence for it was found in this curation pass.
    distinguishing_features:
      - Reduced CSF-to-plasma glucose ratio on paired fasting samples.
      - Pathogenic SLC2A1 variant, often autosomal dominant and familial.
      - Paroxysmal exertional dyskinesia in some affected family members.
      - Onset typically before four years of age in the screened cohorts.
      - Responsive to the ketogenic diet, unlike polygenic JAE.
    evidence:
      - reference: PMID:23106342
        reference_title: >-
          Early onset absence epilepsy: 1 in 10 cases is caused by GLUT1
          deficiency.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Over both studies, 11 (12%) of 89 probands with EOAE have GLUT1
          deficiency.
        explanation: >-
          Quantifies the yield of SLC2A1 testing in early-onset absence epilepsy,
          establishing GLUT1 deficiency as a non-trivial share of absence
          presentations and therefore a differential worth screening for.
      - reference: PMID:20574033
        reference_title: >-
          Absence epilepsies with widely variable onset are a key feature of
          familial GLUT1 deficiency.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Familial glucose transporter type 1 (GLUT1) deficiency due to autosomal
          dominant inheritance of SLC2A1 mutations is associated with paroxysmal
          exertional dyskinesia; epilepsy and intellectual disability occur in
          some family members.
        explanation: >-
          Establishes the autosomal dominant familial form and its extra-epileptic
          features, which are the clinical handles that separate it from polygenic
          JAE.
discussions:
  - discussion_id: jae_thalamic_versus_cortical_ictogenesis
    kind: CONTROVERSY
    status: UNDER_DISCUSSION
    prompt: >-
      Is the generalized spike-wave discharge of juvenile absence epilepsy
      initiated by a thalamic pacemaker, or does it originate in cortex and merely
      recruit the thalamus, and does the answer change what should be considered
      the primary drug target?
    attaches_to:
      - pathophysiology#Aberrant GABAergic Inhibition in the Thalamic Reticular Nucleus
      - pathophysiology#Corticothalamic Drive from Deep-Layer Cortical Neurons
      - pathophysiology#Hypersynchronous Thalamocortical Oscillation
    rationale: >-
      The classical account, and the one that motivates ethosuximide, places the
      pacemaker in thalamus: reticular GABAergic neurons rhythmically
      hyperpolarize relay cells, de-inactivating T-type calcium channels and
      producing the burst that becomes the EEG spike. Intracellular recordings in
      the GAERS rat support that reticular neurons burst in tight synchrony with
      the EEG spike. But a competing body of work locates initiation in cortex.
      Focal tetrodotoxin inactivation of facial somatosensory cortex in GAERS
      abolishes paroxysmal activity both locally and in the thalamic neurons
      connected to it, whereas inactivating a remote motor cortical region or the
      related thalamic nuclei does not; and deleting P/Q calcium channels from
      layer VI corticothalamic neurons alone is sufficient to produce spontaneous
      spike-wave absence seizures. A 2020 synthesis states outright that cortical
      rather than exclusively thalamic mechanisms drive ictogenesis and set the
      spike-wave frequency. This entry therefore models both arms as contributing
      nodes rather than asserting a single origin. The stake is practical: if
      ictogenesis is cortical, thalamic T-type blockade is treating a downstream
      amplifier rather than the initiator, which would help explain why
      ethosuximide controls absences but not the tonic-clonic seizures that
      dominate JAE morbidity. It is also worth noting that the decisive
      experiments are rodent genetic models of childhood-type absence, so their
      transfer to the peri-pubertal human syndrome is itself unestablished.
    proposed_experiments:
      - experiment_id: exp_jae_meg_eeg_onset_localization
        name: High-density MEG-EEG source localization of spike-wave onset in JAE
        description: >-
          Simultaneous high-density EEG and magnetoencephalography in drug-naive
          JAE patients, with source reconstruction of the first tens of
          milliseconds of each generalized spike-wave discharge, testing whether a
          reproducible cortical onset zone precedes thalamic recruitment as it
          does in rodent models.
        decision_criterion: >-
          A consistent cortical lead over thalamic activity at discharge onset
          would support cortical ictogenesis in the human syndrome; simultaneous
          or thalamus-leading onset would support the thalamic pacemaker account.
      - experiment_id: exp_jae_targeted_ttype_blocker_trial
        name: Selective T-type calcium channel blocker trial in JAE
        description: >-
          Clinical trial of a selective T-type calcium channel antagonist in JAE,
          reporting absence and generalized tonic-clonic outcomes separately
          rather than pooled.
        decision_criterion: >-
          Suppression of absences without effect on tonic-clonic seizures would
          indicate the thalamic burst mechanism is specific to the absence
          phenotype and not the whole syndrome; suppression of both would argue
          the thalamic node is upstream of the shared generalized mechanism.
    evidence:
      - reference: PMID:32437558
        reference_title: >-
          Clinical and experimental insight into pathophysiology, comorbidity and
          therapy of absence seizures.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          in contrast to the predominant opinion, cortical mechanisms, rather than
          an exclusively thalamic rhythmogenesis, are key in driving seizure
          ictogenesis and determining spike-wave frequency
        explanation: >-
          States the cortical position of the controversy explicitly, and
          acknowledges that it contradicts the prevailing view.
      - reference: PMID:19276326
        reference_title: >-
          Inactivation of the somatosensory cortex prevents paroxysmal
          oscillations in cortical and related thalamic neurons in a genetic model
          of absence epilepsy.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          This study demonstrates that SWDs in GAERS have a focal origin within
          the facial somatosensory cortex, which is sufficient and necessary to
          generate ictal activities.
        explanation: >-
          The experimental basis for the cortical focus position, using targeted
          inactivation to establish necessity and sufficiency in a genetic rat
          model.
      - reference: PMID:11896171
        reference_title: >-
          Activity of thalamic reticular neurons during spontaneous genetically
          determined spike and wave discharges.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          A SWD started with a large hyperpolarization, which was independent of
          the preceding firing
        explanation: >-
          Evidence for the thalamic side of the controversy: reticular thalamic
          neurons show a stereotyped hyperpolarization at discharge onset that is
          not explained by their own prior firing.
      - reference: PMID:11850474
        reference_title: >-
          Cortical focus drives widespread corticothalamic networks during
          spontaneous absence seizures in rats.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          These findings argue against the existence of one common subcortical
          pacemaker for the generation of generalized spike-wave discharges
          characteristic for absence seizures in the rat.
        explanation: >-
          The independent rat model (WAG/Rij) that first argued against a single
          subcortical pacemaker, using time-delay analysis rather than
          inactivation, so the cortical position rests on two different
          experimental designs in two different genetic models.
  - discussion_id: jae_cortical_focus_human_translation
    kind: HUMAN_MODEL_MISMATCH
    status: OPEN
    prompt: >-
      The cortical initiation focus for spike-wave discharges is established in
      rodent genetic models and localizes to somatosensory cortex, a region with
      no obvious counterpart role in human juvenile absence epilepsy. Does a
      discrete, anatomically stereotyped cortical focus exist in human JAE at all?
    attaches_to:
      - pathophysiology#Corticothalamic Drive from Deep-Layer Cortical Neurons
      - pathophysiology#Hypersynchronous Thalamocortical Oscillation
    rationale: >-
      This is a translational-validity problem rather than an absence of evidence,
      which is why it is recorded as a human-model mismatch and not as a plain
      knowledge gap. Both pillars of the cortical focus argument are rodent: the
      WAG/Rij time-delay analysis localizing a focus to the peri-oral
      somatosensory cortex, and the GAERS tetrodotoxin inactivation showing that
      focus is necessary and sufficient. The WAG/Rij authors themselves hedged the
      extrapolation, writing only that analogous mechanisms may underlie human
      absence epilepsy. The mismatch has three parts. First, the rodent focus sits
      in the peri-oral somatosensory cortex, whereas human absence-epilepsy
      imaging implicates frontal and default-mode network structures rather than a
      single stereotyped sensory locus; JAE-specific structural imaging finds
      reduced grey matter in sensorimotor and frontal regions without identifying
      a discrete ictal generator. Second, the rodent models are models of
      childhood-onset absence, not of a peri-pubertal syndrome; nothing in them
      speaks to the JAE-specific features of later onset and high tonic-clonic
      burden. Third, if the human equivalent is a distributed network state rather
      than a focus, then focal interventions suggested by the rodent work,
      including targeted neuromodulation, do not have an obvious human target.
    proposed_experiments:
      - experiment_id: exp_human_jae_focus_search_intracranial
        name: Search for a reproducible cortical onset zone in human generalized spike-wave
        description: >-
          Analysis of intracranial or high-density scalp recordings from patients
          with idiopathic generalized epilepsy who have undergone invasive
          monitoring or dense EEG, applying the same nonlinear time-delay
          association methods used in the WAG/Rij rat to test whether a consistent
          cortical site leads the rest of the network at discharge onset.
        decision_criterion: >-
          A reproducible leading cortical site across patients would establish that
          the rodent focus concept transfers; heterogeneous or absent leading sites
          would indicate the human syndrome is a distributed network disorder and
          that the focus model should not be carried over.
      - experiment_id: exp_jae_specific_rodent_model_peripubertal
        name: Peri-pubertal-onset absence model with tonic-clonic seizures
        description: >-
          Development or characterization of a rodent or other animal model in
          which absence seizures emerge around puberty and are accompanied by
          generalized tonic-clonic seizures, matching the JAE phenotype rather
          than the childhood absence phenotype the existing models reproduce.
        decision_criterion: >-
          A model that reproduces peri-pubertal onset and tonic-clonic burden would
          allow the cortical-focus question to be asked for JAE specifically rather
          than inferred from childhood absence models.
    evidence:
      - reference: PMID:11850474
        reference_title: >-
          Cortical focus drives widespread corticothalamic networks during
          spontaneous absence seizures in rats.
        supports: PARTIAL
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Analogous mechanisms may underlie the pathophysiology of human absence
          epilepsy.
        explanation: >-
          The authors' own explicitly hedged extrapolation to humans. Recorded as
          PARTIAL because it states a possibility rather than demonstrating the
          human case, which is precisely the mismatch this discussion records.
      - reference: PMID:11850474
        reference_title: >-
          Cortical focus drives widespread corticothalamic networks during
          spontaneous absence seizures in rats.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Nonlinear association analysis revealed a consistent cortical "focus"
          within the peri-oral region of the somatosensory cortex.
        explanation: >-
          Identifies the specific rodent anatomical locus whose human counterpart
          is in question.
      - reference: PMID:41531116
        reference_title: >-
          Syndrome-specific and familial imaging traits in juvenile absence
          epilepsy.
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Gray matter volume was reduced in sensorimotor regions and in the left
          inferior and middle frontal gyri in patients.
        explanation: >-
          The best available human JAE structural imaging shows distributed
          sensorimotor and frontal change rather than a discrete generator,
          illustrating the gap between the rodent focus and human data. PARTIAL
          because structural volumetry cannot localize seizure onset.
  - discussion_id: cacna1h_disputed_gene_disease_validity
    kind: CONTROVERSY
    status: OPEN
    prompt: >-
      Given that ClinGen has reclassified CACNA1H as a disputed epilepsy gene,
      should CACNA1H be retained in the JAE model at all, and if so on what
      footing?
    attaches_to:
      - pathophysiology#Polygenic Susceptibility to Generalized Absence Epilepsy
      - pathophysiology#Altered Thalamic Low-Threshold Calcium Bursting
    rationale: >-
      CACNA1H encodes Cav3.2, the very T-type channel that carries the thalamic
      low-threshold current this entry models, so the gene is mechanistically
      attractive. It was reported in a childhood absence epilepsy cohort in 2003
      and subsequently entered commercial epilepsy gene panels. A 2020
      reassessment found that no published or ClinVar CACNA1H variant would meet
      ACMG criteria for pathogenic or likely pathogenic, that large exome studies
      show no enrichment of rare or de novo CACNA1H variants in epilepsy cohorts
      relative to controls, and that Cacna1h knockout mice do not seize. ClinGen
      classified the gene-disease relationship as disputed. The residual
      possibility is that CACNA1H acts as a modifier rather than a monogenic
      cause, which is exactly what the GAERS rat suggests, where a Cacna1h variant
      accounts for roughly a third of the variance in seizure frequency.

      That choice has been made here rather than inherited from legacy panels.
      The gene is retained with relationship_type MODIFIER, not SUSCEPTIBILITY.
      The refutation of monogenic causation is carried directly as REFUTE
      evidence, and the surviving modifier role alongside it as PARTIAL, sourced
      to the GAERS observation above. Removal was rejected because Cav3.2 is the
      T-type channel this entry's whole thalamic-bursting mechanism runs on, so
      deleting it would leave that mechanism attributed to no gene at all; a
      demoted typing that carries both the refutation and what survived it is the
      more honest record.

      The discussion stays OPEN because the science is unsettled, not because the
      curation decision is. ClinGen's disputed classification stands, the modifier
      role rests on rodent data, and the experiments below are what would resolve
      it.
    proposed_experiments:
      - experiment_id: exp_cacna1h_common_variant_burden_jae
        name: CACNA1H variant burden in syndrome-resolved IGE cohorts
        description: >-
          Burden and common-variant association testing of CACNA1H in large
          idiopathic generalized epilepsy cohorts that are resolved to ILAE 2022
          syndrome level, so that JAE is analysed separately from childhood
          absence epilepsy rather than pooled.
        decision_criterion: >-
          A significant burden or association confined to a syndrome stratum would
          justify retaining CACNA1H as a susceptibility contributor; a null result
          across strata would justify removing it from the model.
      - experiment_id: exp_cacna1h_modifier_effect_human
        name: Test of CACNA1H as a seizure-severity modifier in humans
        description: >-
          Test whether CACNA1H genotype modifies seizure frequency, drug response,
          or age of onset among patients who already carry an established epilepsy
          risk background, mirroring the modifier effect observed in the GAERS
          rat.
        decision_criterion: >-
          A reproducible genotype-severity relationship would support recuration
          of CACNA1H as a modifier rather than a susceptibility or causal gene.
    evidence:
      - reference: PMID:32227660
        reference_title: CACNA1H variants are not a cause of monogenic epilepsy.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          the current status of CACNA1H as a monogenic cause of epilepsy is
          controversial, highlighted by ClinGen's recent reclassification of
          CACNA1H as disputed
        explanation: >-
          Documents that the controversy is formally recognized by ClinGen, which
          is what makes this a curation decision rather than a settled fact.
      - reference: PMID:32227660
        reference_title: CACNA1H variants are not a cause of monogenic epilepsy.
        supports: PARTIAL
        evidence_source: MODEL_ORGANISM
        snippet: >-
          in support of Cav3.2 contributing to seizure susceptibility as a
          modifier
        explanation: >-
          Preserves the surviving modifier hypothesis from the same analysis that
          refutes the monogenic claim, which is the alternative framing this
          discussion asks curators to weigh.
  - discussion_id: jae_cae_syndrome_boundary
    kind: KNOWLEDGE_GAP
    status: OPEN
    prompt: >-
      Does the age-of-onset boundary that separates juvenile absence epilepsy from
      childhood absence epilepsy mark a real mechanistic discontinuity, or is it a
      convenient cut through a single continuous absence-epilepsy spectrum?
    attaches_to:
      - pathophysiology#Polygenic Susceptibility to Generalized Absence Epilepsy
    rationale: >-
      The two syndromes are separated primarily by age of onset around puberty,
      and they share the thalamocortical mechanism, the EEG signature, and much of
      their candidate genetics. Yet they differ substantially in the things
      patients care about: absence frequency, generalized tonic-clonic burden, and
      the probability of remission. Nothing currently in the model explains why
      the same circuit lesion should produce a self-limiting pyknoleptic illness
      when it declares at age six and a persistent tonic-clonic-dominant illness
      when it declares at age twelve. Candidate explanations are different
      underlying genetic architecture, a pubertal endocrine or maturational
      modifier acting on an identical substrate, or an artefact of where the ILAE
      drew the line. JAE-specific imaging offers a partial handle: patients differ
      from controls in sensorimotor and frontal grey matter, and one trait, dorsal
      midcingulate volume, is shared with unaffected siblings, which suggests a
      heritable trait marker separable from the disease state. This gap matters
      for curation because it determines whether dismech should carry two
      mechanistically distinct entries or one entry with an onset-stratified
      model.
    proposed_experiments:
      - experiment_id: exp_cae_jae_shared_polygenic_architecture
        name: Genetic-correlation analysis between CAE and JAE
        description: >-
          Estimate the genetic correlation between syndrome-resolved childhood
          absence epilepsy and juvenile absence epilepsy cohorts, and test whether
          age of onset behaves as a continuous polygenic trait or as a mixture of
          two distinct liability distributions.
        decision_criterion: >-
          A genetic correlation near unity with continuous onset liability would
          favour a single spectrum; distinguishable architectures would support
          two mechanistically separate entries.
      - experiment_id: exp_pubertal_modifier_absence_onset
        name: Pubertal endocrine modifier study in absence epilepsy
        description: >-
          Prospective study of children with absence epilepsy through puberty,
          relating pubertal staging and sex-steroid trajectories to change in
          absence frequency, emergence of generalized tonic-clonic seizures, and
          remission.
        decision_criterion: >-
          If pubertal transition predicts the shift toward the JAE phenotype in
          children who began with a CAE phenotype, a maturational modifier acting
          on a shared substrate is supported over distinct diseases.
    evidence:
      - reference: PMID:35503716
        reference_title: >-
          ILAE definition of the Idiopathic Generalized Epilepsy Syndromes:
          Position statement by the ILAE Task Force on Nosology and Definitions.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          We provide updated diagnostic criteria for these IGE syndromes
          determined by the expert consensus opinion of the ILAE's Task Force on
          Nosology and Definitions
        explanation: >-
          Establishes that the syndrome boundaries in question are set by expert
          consensus criteria, which is precisely why their mechanistic status is
          an open question rather than a measured finding.
      - reference: PMID:41531116
        reference_title: >-
          Syndrome-specific and familial imaging traits in juvenile absence
          epilepsy.
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          increased gray matter volume in the dorsal midcingulate cortex was
          present in both patients and their siblings relative to controls
        explanation: >-
          Identifies a familial imaging trait present in unaffected siblings,
          offering a candidate endophenotype that could be tested for
          syndrome-specificity. PARTIAL because the study was not designed to
          compare JAE against childhood absence epilepsy directly.

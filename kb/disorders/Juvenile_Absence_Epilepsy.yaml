diagnosis:
  - name: Hyperventilation-activated EEG
    description: >-
      Routine EEG with a standardized period of hyperventilation is the
      highest-yield single test. Hyperventilation reliably provokes generalized
      spike-wave activity and often a clinical absence in untreated patients,
      which converts an intermittent history into a recorded event. Persistence
      of hyperventilation positivity on follow-up EEG carries prognostic weight,
      being associated with a lower chance of seizure freedom.
    diagnosis_term:
      preferred_term: Electroencephalography
      term:
        id: NCIT:C38054
        label: Electroencephalography
    results: >-
      Bilaterally synchronous generalized spike-wave discharges on a normal
      background, frequently with a clinical absence during hyperventilation.
    evidence:
      - reference: PMID:40945312
        reference_title: >-
          Long-term seizure outcomes and the likelihood of antiseizure medication
          withdrawal in patients with juvenile absence epilepsy: A 10-year
          follow-up study.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          the persistence of hyperventilation positivity on EEG were associated
          with an unfavorable outcome regarding seizure freedom
        explanation: >-
          Establishes hyperventilation EEG activation as a used and
          prognostically informative element of JAE assessment.
  - name: Paired CSF and plasma glucose for GLUT1 deficiency
    description: >-
      Because GLUT1 deficiency can present as absence epilepsy and is treatable
      with the ketogenic diet, a low CSF-to-plasma glucose ratio on paired
      fasting samples, followed by SLC2A1 testing, is the mechanism-directed
      screening step. The yield is highest in early-onset absence epilepsy but
      the familial form has widely variable onset, so it remains worth
      considering in atypical or treatment-refractory presentations.
    diagnosis_term:
      preferred_term: paired fasting CSF and plasma glucose measurement
    results: >-
      A reduced CSF-to-plasma glucose ratio supports GLUT1 deficiency and prompts
      SLC2A1 sequencing and deletion analysis.
    evidence:

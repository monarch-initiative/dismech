  - population: Idiopathic generalized epilepsy clinic populations
    measure_type: UNKNOWN
    prevalence_class: RARE
    notes: >-
      JAE is one of the four ILAE idiopathic generalized epilepsy syndromes; the
      IGEs together account for roughly 20 to 40 percent of all epilepsies, with
      JAE the least common of the absence syndromes. Syndrome-specific
      population-based incidence estimates are not well established, so no
      normalized rate is asserted here.
    evidence:

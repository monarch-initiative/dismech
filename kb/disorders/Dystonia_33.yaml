pathophysiology:
- name: EIF2AK2 (PKR) Dysfunction
  biological_scale: MOLECULAR
  description: >-
    EIF2AK2 encodes the double-stranded-RNA-activated protein kinase PKR, a
    member of the eIF2-alpha kinase family that phosphorylates eIF2-alpha
    (EIF2S1) to restrain translation under stress. A recurrent heterozygous
    missense variant disrupts this kinase; how the altered activity produces
    dystonia is not established.
  genes:
  - preferred_term: EIF2AK2
    term:
      id: hgnc:9437
      label: EIF2AK2
  molecular_functions:
  - preferred_term: eIF2-alpha kinase activity
    term:
      id: GO:0004694
      label: eukaryotic translation initiation factor 2alpha kinase activity
  evidence:
  - reference: PMID:32197074
    reference_title: "De novo EIF2AK1 and EIF2AK2 Variants Are Associated with Developmental Delay, Leukoencephalopathy, and Neurologic Decompensation."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "EIF2AK1 and EIF2AK2 encode members of the eukaryotic translation initiation factor 2 alpha kinase (EIF2AK) family that inhibits protein synthesis in response to physiologic stress conditions."
    explanation: Establishes EIF2AK2 as an eIF2-alpha kinase (PKR); a gene-level fact that holds for the dystonia allele.
  - reference: PMID:32197074
    reference_title: "De novo EIF2AK1 and EIF2AK2 Variants Are Associated with Developmental Delay, Leukoencephalopathy, and Neurologic Decompensation."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "EIF2AKs phosphorylate eukaryotic translation initiation factor 2 subunit 1 (EIF2S1, also known as EIF2α), which then inhibits EIF2B activity."
    explanation: States the eIF2-alpha phosphorylation step that PKR catalyzes.
  downstream:
  - target: Dystonia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: EIF2AK2 variants cause isolated dystonia; the path from kinase dysfunction to dystonia is not established.
phenotypes:
- category: Clinical
  name: Dystonia
  description: >-
    Isolated (often generalized) dystonia, typically with childhood- to
    adolescence-onset, from a recurrent EIF2AK2 missense variant.
  phenotype_term:
    preferred_term: Dystonia
    term:
      id: HP:0001332
      label: Dystonia
  evidence:
  - reference: PMID:40841848
    reference_title: "Generalized dystonia unraveled: Molecular mechanisms, diagnostic strategies, and treatment paradigms."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Advances in genetics have identified key causative mutations-most notably in KMT2B, VPS16, EIF2AK2, PRKRA, and AOPEP- that contribute to disease onset and progression, with varying degrees of clinical penetrance."
    explanation: A dystonia-genetics review lists EIF2AK2 among the key causative generalized-dystonia genes.
genetic:
- name: EIF2AK2
  gene_term:
    preferred_term: EIF2AK2
    term:
      id: hgnc:9437
      label: EIF2AK2
  association: Causative
  relationship_type: CAUSATIVE
  features: >-
    EIF2AK2 (chromosome 2p22.2; PKR, the double-stranded-RNA-activated eIF2-alpha
    kinase) causes autosomal-dominant isolated dystonia 33 (DYT33, OMIM 619687),
    reported with a recurrent heterozygous missense variant. The same gene, via
    de novo missense variants, separately causes the allelic neurodevelopmental
    leukoencephalopathy syndrome LEUDEN (OMIM 618877), which is a distinct
    entity. See notes on evidence availability.
  evidence:
  - reference: PMID:40841848
    reference_title: "Generalized dystonia unraveled: Molecular mechanisms, diagnostic strategies, and treatment paradigms."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Advances in genetics have identified key causative mutations-most notably in KMT2B, VPS16, EIF2AK2, PRKRA, and AOPEP- that contribute to disease onset and progression, with varying degrees of clinical penetrance."
    explanation: Establishes EIF2AK2 as a causative dystonia gene.
  - reference: PMID:32197074
    reference_title: "De novo EIF2AK1 and EIF2AK2 Variants Are Associated with Developmental Delay, Leukoencephalopathy, and Neurologic Decompensation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We use mammalian cell lines and proband-derived fibroblasts to further confirm the pathogenicity of variants in these genes and found reduced kinase activity."
    explanation: >-
      Shows EIF2AK2 disease variants reduce PKR kinase activity. Note this was
      measured on the de novo LEUDEN alleles, not the DYT33 dystonia allele.
notes: >-
  Dystonia 33 (DYT33, OMIM 619687) is autosomal-dominant isolated dystonia from
  a recurrent heterozygous EIF2AK2 missense variant; it is distinct from, though
  allelic with, the de novo EIF2AK2 neurodevelopmental leukoencephalopathy
  syndrome LEUDEN (OMIM 618877). The MONDO term MONDO:0030513 is held by no other
  dismech entry.

  Evidence availability is the limiting factor here. The primary DYT33 reports
  (Musacchio et al. 2021 PMID:33866603; Magrinelli et al. 2022 PMID:35146068; the
  MDSGene dystonia-gene review PMID:36670070) are short communications whose
  abstracts are not retrievable from PubMed and whose full text is not in PMC, so
  no exact quote can be taken from them. The dystonia phenotype and causative-gene
  status are therefore cited from a generalized-dystonia review (PMID:40841848)
  that names EIF2AK2 among the key causative genes, and the EIF2AK2/PKR gene
  mechanism from the founding EIF2AK2 report (PMID:32197074) as background
  gene-level facts. The reduced-kinase-activity functional finding was obtained on
  the de novo LEUDEN alleles, not the DYT33 allele, and is labelled accordingly.
  No GeneReviews chapter covers EIF2AK2-related dystonia.

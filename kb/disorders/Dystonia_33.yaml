pathophysiology:
- name: EIF2AK2 (PKR) Dysfunction
  biological_scale: MOLECULAR
  description: >-
    EIF2AK2 encodes the double-stranded-RNA-activated protein kinase PKR, an
    eIF2-alpha kinase of the integrated stress response. Dystonia-associated
    missense variants lie in functional domains of PKR and produce abnormally
    prolonged, enhanced activation of the kinase rather than loss of activity.
  genes:
  - preferred_term: EIF2AK2
    term:
      id: hgnc:9437
      label: EIF2AK2
  molecular_functions:
  - preferred_term: eIF2-alpha kinase activity (PKR)
    modifier: INCREASED
    term:
      id: GO:0004694
      label: eukaryotic translation initiation factor 2alpha kinase activity
  evidence:
  - reference: PMID:33236446
    reference_title: "EIF2AK2 Missense Variants Associated with Early Onset Generalized Dystonia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "We identified EIF2AK2 variants implicated in early onset generalized dystonia, which can be dominantly or recessively inherited, or occur de novo."
    explanation: Establishes EIF2AK2 as the causative gene for this dystonia.
  - reference: PMID:33236446
    reference_title: "EIF2AK2 Missense Variants Associated with Early Onset Generalized Dystonia."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "EIF2AK2 encodes a kinase (protein kinase R [PKR]) that phosphorylates eukaryotic translation initiation factor 2 alpha (eIF2α), which orchestrates the cellular stress response."
    explanation: States the eIF2-alpha kinase (PKR) activity bound on this node.
  downstream:
  - target: eIF2-alpha Phosphorylation and Integrated Stress Response Hyperactivation
    causal_link_type: DIRECT
    description: Dystonia-associated PKR variants drive enhanced, prolonged phosphorylation of eIF2-alpha.
- name: eIF2-alpha Phosphorylation and Integrated Stress Response Hyperactivation
  biological_scale: MOLECULAR
  description: >-
    Patient-derived fibroblasts carrying EIF2AK2 dystonia variants show
    abnormally enhanced and prolonged PKR-mediated phosphorylation of eIF2-alpha
    (Ser51) and sustained activation of the integrated stress response. A
    dysregulated eIF2-alpha pathway is a convergence point shared with other
    monogenic dystonias (DYT-PRKRA, DYT-TOR1A, DYT-THAP1).
  biological_processes:
  - preferred_term: integrated stress response signaling (eIF2-alpha phosphorylation)
    modifier: INCREASED
    term:
      id: GO:0140467
      label: integrated stress response signaling
  evidence:
  - reference: PMID:33236446
    reference_title: "EIF2AK2 Missense Variants Associated with Early Onset Generalized Dystonia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "Our expression studies showed abnormally enhanced activation of the cellular stress response, monitored by PKR-mediated phosphorylation of eIF2α, in fibroblasts from patients with EIF2AK2 variants."
    explanation: Patient fibroblasts show hyperactivated eIF2-alpha phosphorylation / ISR, the direction of the molecular defect.
  downstream:
  - target: Generalized dystonia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      A dysfunctional eIF2-alpha pathway is implicated in dystonia pathogenesis;
      the steps from ISR dysregulation to dystonia are not established.

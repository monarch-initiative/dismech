name: EIF2AK2-Related Dystonia
creation_date: "2026-11-06T16:40:00Z"
category: Mendelian
description: >-
  EIF2AK2-related dystonia (dystonia 33, DYT33) is an early-onset movement
  disorder characterized by focal or limb dystonia presenting in infancy or
  childhood with subsequent progression to generalized dystonia, frequently
  involving severe axial dystonia (retrocollis), and accompanied in a subset of
  patients by dysarthria, dysphagia, spasticity, intellectual disability, and
  stepwise neurological deterioration triggered by febrile illness or surgical
  stress. The disorder is caused by heterozygous (autosomal dominant or de novo,
  most commonly p.Gly130Arg) or homozygous (autosomal recessive, p.Asn32Thr)
  missense variants in EIF2AK2, which encodes protein kinase R (PKR), resulting
  in abnormally prolonged phosphorylation of eIF2-alpha (Ser51) and sustained
  hyperactivation of the integrated stress response.
synonyms:
- DYT33
- dystonia 33
- EIF2AK2-related dystonia
- EIF2AK2-related early onset generalized dystonia

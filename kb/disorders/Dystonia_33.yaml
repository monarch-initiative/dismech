notes: >-
  Dystonia 33 (DYT33, OMIM 619687; MONDO:0030513) is early-onset generalized
  dystonia caused by missense variants in EIF2AK2 (PKR). The variants can be
  autosomal-dominant (recurrent p.Gly130Arg, also de novo), autosomal-recessive
  (homozygous p.Asn32Thr), or de novo, with incomplete penetrance and variable
  expressivity; dystonia is usually isolated but a subset also has intellectual
  disability and spasticity. The molecular defect is abnormally enhanced,
  prolonged PKR-mediated phosphorylation of eIF2-alpha and sustained integrated
  stress response activation in patient fibroblasts, placing EIF2AK2 dystonia on
  a dysregulated eIF2-alpha pathway shared with DYT-PRKRA (PRKRA is a functional
  regulator of PKR), DYT-TOR1A and DYT-THAP1.

  DYT33 is distinct from, though allelic with, the de novo EIF2AK2
  neurodevelopmental leukoencephalopathy syndrome LEUDEN (OMIM 618877).
  MONDO:0030513 is held by no other dismech entry. No GeneReviews chapter covers
  EIF2AK2-related dystonia.

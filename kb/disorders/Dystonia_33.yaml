genetic:
- name: EIF2AK2
  gene_term:
    preferred_term: EIF2AK2
    term:
      id: hgnc:9437
      label: EIF2AK2
  association: Causative
  relationship_type: CAUSATIVE
  features: >-
    EIF2AK2 (chromosome 2p22.2; PKR, the double-stranded-RNA-activated eIF2-alpha
    kinase) causes early-onset generalized dystonia 33 (DYT33, OMIM 619687).
    Reported variants can be inherited as an autosomal-dominant or
    autosomal-recessive trait or occur de novo, with incomplete penetrance and
    variable expressivity. The same gene, via de novo missense variants,
    separately causes the allelic neurodevelopmental leukoencephalopathy syndrome
    LEUDEN (OMIM 618877), a distinct entity.
  variants:
  - name: p.Gly130Arg
    description: >-
      c.388G>A; recurrent heterozygous variant segregating in a Taiwanese family
      and found in unrelated patients, including one de novo case. ACMG
      pathogenic.
    evidence:
    - reference: PMID:33236446
      reference_title: "EIF2AK2 Missense Variants Associated with Early Onset Generalized Dystonia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: "We identified a heterozygous variant, c.388G>A, p.Gly130Arg, in the eukaryotic translation initiation factor 2 alpha kinase 2 (EIF2AK2) gene, segregating with early onset isolated generalized dystonia in 5 patients of a Taiwanese family."
      explanation: Identifies the recurrent heterozygous dystonia variant.
  - name: p.Asn32Thr
    description: c.95A>C; homozygous recessive variant in a patient of consanguineous parents. ACMG likely pathogenic.
    evidence:
    - reference: PMID:33236446
      reference_title: "EIF2AK2 Missense Variants Associated with Early Onset Generalized Dystonia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: "one last patient, born from consanguineous parents, carrying a third, homozygous variant c.95A>C, p.Asn32Thr"
      explanation: Identifies the homozygous recessive dystonia variant.
  - name: p.Gly138Ala
    description: c.413G>C; heterozygous variant of inconclusive ACMG evidence, pending further cases or functional studies.
    evidence:
    - reference: PMID:33236446
      reference_title: "EIF2AK2 Missense Variants Associated with Early Onset Generalized Dystonia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: "another patient carrying a different heterozygous variant, c.413G>C, p.Gly138Ala"
      explanation: Identifies a third dystonia-associated EIF2AK2 variant.
  evidence:
  - reference: PMID:33236446
    reference_title: "EIF2AK2 Missense Variants Associated with Early Onset Generalized Dystonia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "We identified EIF2AK2 variants implicated in early onset generalized dystonia, which can be dominantly or recessively inherited, or occur de novo."
    explanation: Establishes EIF2AK2 as causative and the modes of inheritance.

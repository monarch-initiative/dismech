name: SLC44A1-Related Childhood-Onset Neurodegeneration
creation_date: "2026-09-02T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: SLC44A1-related childhood-onset neurodegeneration with ataxia, tremor,
    optic atrophy and cognitive decline
  term:
    id: MONDO:0030028
    label: neurodegeneration, childhood-onset, with ataxia, tremor, optic atrophy,
      and cognitive decline
description: >-
  An autosomal recessive childhood-onset neurodegenerative disease caused by biallelic
  loss-of-function variants in SLC44A1, the gene encoding choline transporter-like
  protein 1 (CTL1). The entity was defined in 2020 from four individuals in three
  unrelated families, all homozygous for frameshift alleles, and the published clinical
  experience remains close to that founding series. Affected individuals develop
  progressive ataxia, tremor, cognitive decline, dysarthria, dysphagia, optic atrophy
  and urinary and bowel incontinence; brain MRI shows cerebellar atrophy and
  leukoencephalopathy, and in a subset a low-signal globus pallidus with hyperintense
  streaking and a low-signal substantia nigra.

  CTL1 is a plasma-membrane and mitochondrial carrier that supplies the cell with the
  head-group substrates of the Kennedy pathway, the de novo route to the two dominant
  membrane phospholipids. Choline enters through CTL1, is phosphorylated, and is
  coupled to diacylglycerol through the CDP-choline branch to give phosphatidylcholine;
  the same protein was later shown to be a physiological ethanolamine transporter
  feeding the parallel CDP-ethanolamine branch to phosphatidylethanolamine. Losing CTL1
  therefore constricts phospholipid supply at its entry step rather than at any single
  enzymatic reaction, which is the reason a transporter defect presents as a
  myelin-and-membrane disease.

  The mechanism deserves a precise statement, because the intuitive version of it is
  not what was measured. Patient fibroblasts do show diminished choline transport, but
  membrane phosphatidylcholine content was explicitly unchanged, and phosphatidylcholine
  was preserved in patient cerebrospinal fluid as well. The Kennedy pathway in
  CTL1-deficient cells is reduced but not absent, because the paralogue CTL2 can channel
  both choline and ethanolamine at lower capacity; what the cells lose is reserve and
  homeostatic latitude, expressed as disturbed handling of the other phospholipids and
  as a striking organelle phenotype (depleted free ribosomes, elongated endoplasmic
  reticulum, excess mitochondria and small vesicles) that chronic choline treatment
  reverses. The phosphatidylcholine-starvation account is supported in the
  oligodendrocyte lineage in vivo, where SLC44A1 loss disrupts phosphatidylcholine-pathway
  gene expression, inhibits phospholipid biosynthesis and alters myelin sheath lipid
  composition, but it is not what the accessible human tissue shows. This entry curates
  both readings, and the tension between them is recorded as an explicit knowledge gap
  rather than resolved by assertion.

  Therapeutically the disease is untreated, but it is one of the few neurodegenerative
  entities with a rational and cheap candidate substrate. Choline restored membrane
  lipids and organelle structure in patient fibroblasts, and citicoline restored
  developmental myelination in SLC44A1-deficient zebrafish and rodents. Neither result
  is a clinical trial, and both are curated here as preclinical.
synonyms:
- CONATOC
- CTL1 deficiency
- choline transporter-like protein 1 deficiency
- neurodegeneration, childhood-onset, with ataxia, tremor, optic atrophy, and cognitive
  decline
parents:
- Inherited Neurodegenerative Disorder
- Hereditary Leukoencephalopathy
notes: >-
  Named entity confusion warning. This disease is frequently discussed in the same
  breath as "CONDCA" (childhood-onset neurodegeneration with cerebellar atrophy,
  MONDO:0032650, AGTPBP1), which is a different gene, a different mechanism, and a
  separate entity that dismech curates elsewhere. The acronym attached to the SLC44A1
  entity in MONDO's synonym set is CONATOC, not CONDCA. Nothing in this entry is
  derived from the AGTPBP1 literature.

  SLC44A1 also appears in dismech in a wholly unrelated somatic context: the
  SLC44A1::PRKCA fusion that defines papillary glioneuronal tumor, mentioned in
  kb/disorders/Mixed_Neuronal-Glial_Tumor.yaml. That is a somatic rearrangement in a
  neoplasm, not a germline binding, and it is not prior coverage of this disease.

  Provenance. No deep-research provider report backs this entry. The Edison/falcon
  provider returned HTTP 402 (account out of credits) and the documented claude_code
  fallback failed with "Claude Code exited with code 1" after reporting "agentapi not
  found in PATH". The entry was curated from directly retrieved primary literature,
  with every reference fetched through `just fetch-reference`.
classifications:
  harrisons_chapter:
  - classification_value: NEUROLOGIC
    notes: >-
      Every defining feature is neurological or neuro-ophthalmological: cerebellar
      ataxia and tremor, cognitive decline, dysarthria and dysphagia, optic atrophy,
      and an MRI picture of cerebellar atrophy with leukoencephalopathy. The optic
      atrophy is degeneration of retinal ganglion cell axons, that is, central nervous
      system tissue, so a separate ophthalmological assignment is deliberately not
      made. The underlying lesion is a membrane-lipid biosynthetic defect and the
      founding report calls the entity neurometabolic, but the expressed disease is
      confined to the nervous system.
inheritance:
- name: Autosomal recessive inheritance
  description: >-
    All four individuals in the founding series were homozygous for SLC44A1 frameshift
    alleles (Asp517Metfs*19, Ser126Metfs*8, Lys90Metfs*18) arising in three unrelated
    families, and the report states the inheritance explicitly. Heterozygous parents
    are unaffected. No dominant, digenic or oligogenic mechanism has been proposed
    for this locus.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:31855247
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we describe a novel childhood-onset neurometabolic disease caused by
      choline transporter deficiency with autosomal recessive inheritance"
    explanation: The founding clinical report states autosomal recessive inheritance
      for the entity.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    The founding series of four individuals from three families is essentially the
    whole published clinical experience of this entity; no prevalence or incidence
    estimate of any kind has been published, and MONDO:0030028 carries no Orphanet
    epidemiology record to band against. NOT_YET_DOCUMENTED is used in preference to
    a qualitative ULTRA_RARE band because there is no source to band, and
    rate_per_100000 is left empty for the same reason. No founder effect and no
    ancestry enrichment is asserted.
  evidence:
  - reference: PMID:31855247
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we report on four individuals from three families with neurodegenerative
      disease and homozygous frameshift mutations"
    explanation: Establishes the size of the reported case series, which is the only
      occurrence information available.
pathophysiology:
- name: Biallelic SLC44A1 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Homozygous frameshift alleles in SLC44A1 truncate choline transporter-like protein
    1. Three distinct frameshifts were reported across the three founding families,
    two of which (Asp517Metfs*19 and Ser126Metfs*8) gave fibroblast phenotypes that
    were structurally and functionally indistinguishable, arguing that the entity is
    driven by loss of the protein rather than by a residue-specific effect.
  downstream:
  - target: Choline Transporter-Like Protein 1 Deficiency
    causal_link_type: DIRECT
    description: Frameshift truncation removes functional CTL1 from the membrane.
  evidence:
  - reference: PMID:31855247
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "homozygous frameshift mutations (Asp517Metfs*19, Ser126Metfs*8, and Lys90Metfs*18)
      in the SLC44A1 gene encoding choline transporter-like protein 1"
    explanation: Identifies the causal biallelic frameshift genotype and the encoded
      protein.
  - reference: PMID:31855247
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The Asp517Metfs*19 and Ser126Metfs*8 fibroblasts were structurally and
      functionally indistinguishable."
    explanation: Two independent frameshift alleles converge on the same cellular
      phenotype, supporting a shared loss-of-function mechanism.
- name: Choline Transporter-Like Protein 1 Deficiency
  biological_scale: MOLECULAR
  description: >-
    Loss of CTL1, the carrier that moves choline (and, as later shown, ethanolamine)
    across the plasma membrane and into mitochondria. CTL1 is enriched in
    oligodendrocytes, which is the expression pattern that makes a general
    membrane-lipid transporter behave as a white-matter disease gene.
  molecular_functions:
  - preferred_term: choline transmembrane transporter activity
    modifier: DECREASED
    term:
      id: GO:0015220
      label: choline transmembrane transporter activity
  cell_types:
  - preferred_term: oligodendrocyte
    term:
      id: CL:0000128
      label: oligodendrocyte
  downstream:
  - target: Reduced Cellular Choline and Ethanolamine Uptake
    causal_link_type: DIRECT
    description: Absent carrier protein removes the principal uptake route for both
      Kennedy pathway head-group substrates.
  evidence:
  - reference: PMID:41317319
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "we show that SLC44A1 is enriched in oligodendrocytes and is required
      for myelin development in the CNS of zebrafish and rodents"
    explanation: Establishes the oligodendrocyte-enriched expression that localizes
      the transporter defect to the myelinating lineage.
- name: Reduced Cellular Choline and Ethanolamine Uptake
  biological_scale: CELLULAR
  description: >-
    Patient fibroblasts show diminished choline transport. The same lesion also
    reduces ethanolamine transport, since CTL1 was subsequently identified as a
    physiological ethanolamine carrier; the deficit is therefore in both head-group
    substrates, not choline alone.
  biological_processes:
  - preferred_term: choline transport
    modifier: DECREASED
    term:
      id: GO:0015871
      label: choline transport
  downstream:
  - target: Constrained Kennedy Pathway Phospholipid Synthesis
    causal_link_type: DIRECT
    description: Substrate entry is the first committed step of de novo phospholipid
      synthesis, so reduced uptake constrains flux through both Kennedy branches.
  evidence:
  - reference: PMID:31855247
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Functional analysis revealed diminished choline transport yet the membrane
      phosphatidylcholine content remained unchanged."
    explanation: Directly measures the reduced choline transport in patient fibroblasts;
      the same sentence records that the downstream phosphatidylcholine pool was not
      depleted, which is why the next node is framed as constrained flux rather than
      product depletion.
  - reference: PMID:33789160
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The lack of CTL1 in M2 cells reduced the ethanolamine transport, the
      flux through the CDP-ethanolamine Kennedy pathway, and PE synthesis."
    explanation: Extends the transport deficit beyond choline to ethanolamine, showing
      both Kennedy branches lose substrate supply.
- name: Constrained Kennedy Pathway Phospholipid Synthesis
  biological_scale: MOLECULAR
  description: >-
    Reduced but not absent flux through the CDP-choline and CDP-ethanolamine branches
    of the Kennedy pathway. The residual flux is attributable to the paralogue CTL2,
    which channels both substrates at lower capacity; this is the reason bulk
    phosphatidylcholine is preserved in accessible patient tissue while the cell is
    nonetheless operating without reserve.
  biological_processes:
  - preferred_term: phosphatidylcholine biosynthetic process
    modifier: DECREASED
    term:
      id: GO:0006656
      label: phosphatidylcholine biosynthetic process
  - preferred_term: phosphatidylethanolamine biosynthetic process
    modifier: DECREASED
    term:
      id: GO:0006646
      label: phosphatidylethanolamine biosynthetic process
  downstream:
  - target: Membrane Phospholipid Homeostasis Disturbance
    causal_link_type: DIRECT
    description: Reduced de novo supply is compensated by remodelling the rest of the
      phospholipid complement.
  - target: Oligodendrocyte Maturation Failure and Myelin Lipid Imbalance
    causal_link_type: DIRECT
    description: >-
      In the oligodendrocyte lineage the same constraint inhibits phospholipid
      biosynthesis and alters myelin sheath lipid composition.
  evidence:
  - reference: PMID:33789160
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "PC and PE are synthesized de novo by CDP-Cho and CDP-Etn branches of
      the Kennedy pathway in which the extracellular substrates choline (Cho) and ethanolamine
      (Etn) are actively transported into the cell, phosphorylated, and coupled with
      diacylglycerols (DAGs) to form the final phospholipid product."
    explanation: States the pathway architecture that makes transporter loss a
      biosynthetic constraint.
  - reference: PMID:33789160
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "CTL1-deficient cells had reduced but not absent CDP-Cho Kennedy pathway"
    explanation: Supports "constrained" rather than "abolished" flux, and is the
      quantitative basis for the residual-capacity framing of this node.
  - reference: PMID:41317319
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "SLC44A1 deficiency disrupts the expression of genes involved in the phosphatidylcholine
      production pathway and subsequently inhibits phospholipid biosynthesis and disturbs
      the lipid composition of myelin sheaths"
    explanation: In vivo evidence that the phosphatidylcholine branch is the one that
      matters for myelin, supporting the edge to the oligodendrocyte node.
- name: Membrane Phospholipid Homeostasis Disturbance
  biological_scale: CELLULAR
  description: >-
    Rather than depleting phosphatidylcholine, CTL1-deficient cells preserve it at the
    cost of the rest of the membrane lipid complement, and the visible consequence is
    an organelle phenotype: depleted free ribosomes, elongated endoplasmic reticulum,
    and a striking excess of mitochondria and small vesicles. Chronic choline treatment
    reverses it, which is the evidence that the derangement is a substrate-supply
    problem and not a structural one.
  downstream:
  - target: Vulnerability to Iron-Mediated Cellular Injury
    causal_link_type: DIRECT
    description: Membrane lipid derangement leaves mutant cells less able to withstand
      acute iron overload.
  evidence:
  - reference: PMID:31855247
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "As part of the mechanism to preserve choline and phosphatidylcholine,
      choline transporter deficiency was implicated in impaired membrane homeostasis
      of other phospholipids."
    explanation: States the compensation-at-a-cost mechanism this node represents.
  - reference: PMID:31855247
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The most prominent ultrastructural changes of the mutant fibroblasts
      were reduced presence of free ribosomes, the appearance of elongated endoplasmic
      reticulum and strikingly increased number of mitochondria and small vesicles."
    explanation: The measured organelle phenotype that makes this node observable.
- name: Vulnerability to Iron-Mediated Cellular Injury
  biological_scale: CELLULAR
  description: >-
    Mutant cells are less able to tolerate acute iron overload, and choline treatment
    protects them. This is the only cellular correlate offered for the basal ganglia
    and substantia nigra signal changes seen on MRI in a subset of patients; the link
    between the two is inferred and is recorded as a knowledge gap rather than as an
    established chain.
  downstream:
  - target: Abnormal Basal Ganglia MRI Signal Intensity
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Proposed, not demonstrated, correlate of the low-signal globus pallidus and
      substantia nigra reported in two of the four individuals.
  evidence:
  - reference: PMID:31855247
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Choline treatments could restore the membrane lipids, repair cellular
      organelles and protect mutant cells from acute iron overload."
    explanation: Demonstrates the iron-handling vulnerability of mutant cells and its
      reversal by choline.
- name: Oligodendrocyte Maturation Failure and Myelin Lipid Imbalance
  biological_scale: CELLULAR
  description: >-
    In vivo, SLC44A1 loss arrests oligodendroglial maturation and myelinogenesis and
    changes the lipid composition of the sheaths that do form. Time-lapse imaging in
    Slc44a1b-deficient zebrafish shows the maturation failure directly. This is the
    node at which a general membrane-lipid defect becomes a white-matter disease.
  cell_types:
  - preferred_term: oligodendrocyte
    term:
      id: CL:0000128
      label: oligodendrocyte
  biological_processes:
  - preferred_term: myelination
    modifier: DECREASED
    term:
      id: GO:0042552
      label: myelination
  downstream:
  - target: Leukoencephalopathy
    causal_link_type: DIRECT
    description: Deficient and lipid-abnormal myelin is the substrate of the imaging
      white-matter abnormality.
  - target: Progressive Cerebellar and Optic Pathway Degeneration
    causal_link_type: DIRECT
    description: Failing myelin maintenance is the proposed driver of the selective
      degeneration of cerebellar and optic pathways.
  evidence:
  - reference: PMID:41317319
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In vivo time-lapse imaging of Slc44a1b-deficient zebrafish reveals impaired
      oligodendroglial maturation and myelinogenesis."
    explanation: Direct in vivo observation of the maturation and myelination failure
      this node asserts.
  - reference: PMID:41317319
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Our findings demonstrate that SLC44A1 is essential for CNS myelination,
      and citicoline supplementation represents a potential therapy for developmental
      hypomyelination."
    explanation: States the necessity of SLC44A1 for CNS myelination.
- name: Progressive Cerebellar and Optic Pathway Degeneration
  biological_scale: TISSUE
  description: >-
    Selective, progressive loss of cerebellar tissue and of optic nerve axons, which
    is the anatomical level at which the clinical quartet of ataxia, tremor, optic
    atrophy and cognitive decline is generated. Cerebellar atrophy is documented on
    MRI in the founding series; the cell-type attributions below are anatomical
    localizations of the clinical and imaging findings rather than a reported
    histopathological cell count.
  cell_types:
  - preferred_term: Purkinje cell
    term:
      id: CL:0000121
      label: Purkinje cell
  - preferred_term: retinal ganglion cell
    term:
      id: CL:0000740
      label: retinal ganglion cell
  downstream:
  - target: Cerebellar Atrophy
    causal_link_type: DIRECT
  - target: Progressive Ataxia
    causal_link_type: DIRECT
  - target: Tremor
    causal_link_type: DIRECT
  - target: Dysarthria
    causal_link_type: DIRECT
  - target: Optic Atrophy
    causal_link_type: DIRECT
  - target: Cognitive Decline
    causal_link_type: DIRECT
  - target: Dysphagia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Urinary Incontinence
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Bowel Incontinence
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:31855247
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Brain MRI demonstrated cerebellar atrophy and leukoencephalopathy."
    explanation: Documents the cerebellar tissue loss and white-matter change that
      this node represents.
  - reference: PMID:31855247
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical features included progressive ataxia, tremor, cognitive decline,
      dysphagia, optic atrophy, dysarthria, as well as urinary and bowel incontinence."
    explanation: Enumerates the clinical consequences attributed to this degeneration
      node.
genetic:
- name: SLC44A1
  association: >-
    Homozygous frameshift loss-of-function alleles. Three were reported in the founding
    series across three unrelated families: Asp517Metfs*19, Ser126Metfs*8 and
    Lys90Metfs*18. No missense, hypomorphic or dominant allele class has been
    established for this phenotype.
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: SLC44A1
    term:
      id: hgnc:18798
      label: SLC44A1
  inheritance:
  - name: Autosomal recessive inheritance
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
  notes: >-
    hgnc:18798 is SLC44A1, solute carrier family 44 member 1, encoding choline
    transporter-like protein 1 (CTL1). The gene is separately and unrelatedly known
    to medicine as the 5' partner of the somatic SLC44A1::PRKCA fusion that defines
    papillary glioneuronal tumor; that is a rearrangement in tumour tissue and has no
    bearing on this germline recessive disease.
  evidence:
  - reference: PMID:31855247
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cerebral choline metabolism is crucial for normal brain function, and
      its homoeostasis depends on carrier-mediated transport."
    explanation: States the physiological premise that makes carrier-mediated choline
      transport, and hence this gene, essential to brain function.

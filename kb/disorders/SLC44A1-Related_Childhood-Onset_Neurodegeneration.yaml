    individuals. Bound to the generic basal ganglia signal term rather than to the
    NBIA-specific eye-of-the-tiger term, which the source does not claim. Whether this
    reflects mineral accumulation was not established.
  phenotype_term:
    preferred_term: Globus pallidus and substantia nigra low signal intensity on MRI
    term:
      id: HP:0012751
      label: Abnormal basal ganglia MRI signal intensity
  frequency: OCCASIONAL
  evidence:
  - reference: PMID:31855247
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "low signal intensity in globus pallidus with hyperintensive streaking
      and low signal intensity in substantia nigra were seen in two individuals"
    explanation: Records the basal ganglia and substantia nigra signal abnormality
      and its frequency within the series.
treatments:
- name: Oral Choline Supplementation
  description: >-
    Substrate repletion aimed at the transport bottleneck. Chronic choline treatment
    of patient fibroblasts reversed the organelle phenotype, restored membrane lipids
    and protected the cells against acute iron overload. This is a cellular result in
    patient-derived fibroblasts, not a clinical outcome: no trial of choline
    supplementation in this disease has been reported, and the entry does not assert
    clinical benefit.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: choline substrate supplementation
    term:
      id: NCIT:C15433
      label: Nutritional Support
    therapeutic_agent:
    - preferred_term: choline
      term:
        id: CHEBI:15354
        label: choline
  target_mechanisms:
  - target: Membrane Phospholipid Homeostasis Disturbance
    description: Restores membrane lipid composition and organelle ultrastructure in
      CTL1-deficient cells.
    evidence:
    - reference: PMID:31855247
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "When chronically treated with choline, those characteristics disappeared
        and mutant ultrastructure resembled healthy control cells."
      explanation: Demonstrates reversal of the cellular phenotype this mechanism node
        represents.
  evidence:
  - reference: PMID:31855247
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Choline treatments could restore the membrane lipids, repair cellular
      organelles and protect mutant cells from acute iron overload."
    explanation: The preclinical basis for proposing choline repletion; the evidence
      is in vitro and does not establish clinical efficacy.
- name: Citicoline Supplementation
  description: >-
    Citicoline (CDP-choline) is the Kennedy pathway intermediate immediately downstream
    of choline phosphorylation, and supplementing it restored developmental myelination
    in SLC44A1-deficient zebrafish and rodents. Proposed on that basis as a candidate
    therapy for the human disease; no clinical trial in SLC44A1-related
    neurodegeneration has been reported.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: citicoline substrate supplementation
    term:
      id: NCIT:C15433
      label: Nutritional Support
    therapeutic_agent:
    - preferred_term: citicoline
      term:
        id: CHEBI:16436
        label: CDP-choline
  target_mechanisms:
  - target: Oligodendrocyte Maturation Failure and Myelin Lipid Imbalance
    description: Restores developmental myelination in SLC44A1-deficient animals.
    evidence:
    - reference: PMID:41317319
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "supplementation with citicoline, a natural choline metabolite, restores
        developmental myelination in SLC44A1-deficient animals"
      explanation: Demonstrates rescue of the myelination node in two model organisms.
  notes: >-
    The preferred_term deliberately names citicoline while the bound NCIT term is the
    broader Nutritional Support action, because NCIT's clinical-intervention subtree
    has no citicoline-specific action term; the agent identity is carried by the
    CHEBI-bound therapeutic_agent instead. CHEBI:16436 is CDP-choline, of which
    citicoline is the pharmaceutical name.
- name: Supportive and Rehabilitative Care
  description: >-
    Physical and occupational therapy for progressive ataxia, speech therapy and
    swallowing assessment for dysarthria and dysphagia, low-vision support for optic
    atrophy, and continence management. This is the actual standard of care; the
    disease is described in the literature as lacking effective treatment.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: multidisciplinary supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:41317319
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "childhood-onset neurodegeneration with cerebellar atrophy and leukoencephalopathy
      that lacks effective treatment"
    explanation: States that no disease-modifying treatment exists, which is what makes
      supportive care the standard of care.
- name: Genetic Counseling
  description: >-
    Autosomal recessive counseling for parents of an affected child, who face a 25%
    recurrence risk per pregnancy, with carrier testing for at-risk relatives.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:31855247
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we describe a novel childhood-onset neurometabolic disease caused by
      choline transporter deficiency with autosomal recessive inheritance"
    explanation: The autosomal recessive inheritance established here is what determines
      the recurrence risk that counseling communicates.
experimental_models:
- name: Patient-derived SLC44A1 frameshift fibroblasts
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: >-
    Skin fibroblasts from individuals homozygous for Asp517Metfs*19 and Ser126Metfs*8,
    used to measure choline transport, membrane phospholipid content and organelle
    ultrastructure, and to test choline rescue.
  modeled_mechanisms:
  - target: Reduced Cellular Choline and Ethanolamine Uptake
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces the transport defect directly in patient cells carrying the causal
      genotype.
    limitations: >-
      Fibroblasts are not the affected cell type. The disease is expressed in
      oligodendrocytes and neurons, and the fibroblast phenotype notably does not
      include the phosphatidylcholine depletion that the oligodendrocyte data imply,
      so the model measures the transport lesion faithfully while representing its
      downstream consequences poorly.
    readouts:
    - name: Choline transport rate in patient fibroblasts
      target: Reduced Cellular Choline and Ethanolamine Uptake
      direction: DECREASED
      interpretation: Confirms loss of carrier-mediated choline uptake in cells with
        the causal genotype.
      evidence:
      - reference: PMID:31855247
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Functional analysis revealed diminished choline transport yet the
          membrane phosphatidylcholine content remained unchanged."
        explanation: Reports the measured reduction in choline transport in these
          cells.
    evidence:
    - reference: PMID:31855247
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The Asp517Metfs*19 and Ser126Metfs*8 fibroblasts were structurally
        and functionally indistinguishable."
      explanation: Supports treating these patient lines as an informative and
        reproducible model of the transport lesion.
  - target: Membrane Phospholipid Homeostasis Disturbance
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces the compensatory membrane-lipid derangement and its organelle
      correlate, both reversible by choline.
    limitations: >-
      The compensation may be fibroblast-specific: a dividing skin fibroblast with an
      intact CTL2 paralogue has metabolic options that a terminally differentiated,
      membrane-hungry oligodendrocyte may not.
    readouts:
    - name: Fibroblast organelle ultrastructure on electron microscopy
      target: Membrane Phospholipid Homeostasis Disturbance
      direction: ALTERED
      interpretation: Depleted free ribosomes, elongated endoplasmic reticulum and
        excess mitochondria and small vesicles, normalizing with chronic choline.
      evidence:
      - reference: PMID:31855247
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "The most prominent ultrastructural changes of the mutant fibroblasts
          were reduced presence of free ribosomes, the appearance of elongated endoplasmic
          reticulum and strikingly increased number of mitochondria and small vesicles."
        explanation: The measured ultrastructural readout for this mechanism node.
animal_models:
- name: Slc44a1b-deficient zebrafish
  species: Zebrafish
  genotype: Slc44a1b deficient
  publication: PMID:41317319
  description: >-
    Zebrafish model used for in vivo time-lapse imaging of oligodendroglial maturation
    and myelinogenesis, and for the citicoline rescue experiment.
  modeled_mechanisms:
  - target: Oligodendrocyte Maturation Failure and Myelin Lipid Imbalance
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces the failure of oligodendroglial maturation and myelination that is
      proposed to underlie the human leukoencephalopathy, and does so with live imaging
      not obtainable in humans.
    limitations: >-
      The model reports a developmental myelination failure, whereas the human disease
      is described as a childhood-onset progressive neurodegeneration; whether the
      human lesion is failed myelin development, failed myelin maintenance, or both is
      not settled by this model. Zebrafish carry an slc44a1 paralogue pair, so gene
      dosage does not map one-to-one onto the human locus.
    readouts:
    - name: Oligodendroglial maturation and myelin sheath formation on time-lapse imaging
      target: Oligodendrocyte Maturation Failure and Myelin Lipid Imbalance
      direction: DECREASED
      interpretation: Impaired maturation and myelinogenesis in the deficient animals.
      evidence:
      - reference: PMID:41317319
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "In vivo time-lapse imaging of Slc44a1b-deficient zebrafish reveals
          impaired oligodendroglial maturation and myelinogenesis."
        explanation: The measured in vivo readout for this mechanism node.
    evidence:
    - reference: PMID:41317319
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "we show that SLC44A1 is enriched in oligodendrocytes and is required
        for myelin development in the CNS of zebrafish and rodents"
      explanation: Supports treating the zebrafish as informative for the human
        myelination mechanism, alongside rodent data.
  - target: Constrained Kennedy Pathway Phospholipid Synthesis
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Shows the phosphatidylcholine-production pathway disruption and consequent
      inhibition of phospholipid biosynthesis in vivo.
    limitations: >-
      The reported measurement is of pathway gene expression and myelin lipid
      composition rather than of flux, so it establishes that the pathway is
      dysregulated without quantifying the reduction in synthetic rate.
    readouts:
    - name: Myelin sheath lipid composition
      target: Constrained Kennedy Pathway Phospholipid Synthesis
      direction: ALTERED
      interpretation: Disturbed lipid composition of myelin sheaths in deficient
        animals.
      evidence:
      - reference: PMID:41317319
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "SLC44A1 deficiency disrupts the expression of genes involved in the
          phosphatidylcholine production pathway and subsequently inhibits phospholipid
          biosynthesis and disturbs the lipid composition of myelin sheaths"
        explanation: The measured lipid-composition readout for this mechanism node.
differential_diagnoses:
- name: Childhood-onset neurodegeneration with cerebellar atrophy (CONDCA, AGTPBP1)
  description: >-
    The most important differential, and the most important name confusion. CONDCA is
    an AGTPBP1-related recessive disease (MONDO:0032650) that also presents in
    childhood with cerebellar atrophy and progressive neurological decline, and the
    two acronyms CONATOC and CONDCA are routinely conflated. The genes, the protein
    families and the mechanisms are unrelated: AGTPBP1 encodes a cytosolic
    carboxypeptidase acting on tubulin polyglutamylation, while SLC44A1 encodes a
    membrane-lipid substrate transporter. Distinguish on genotype, not on phenotype.
- name: Hereditary leukoencephalopathies and hypomyelinating leukodystrophies
  description: >-
    The leukoencephalopathy plus cerebellar atrophy on MRI places this entity in the
    hereditary white-matter differential, alongside the hypomyelinating leukodystrophies
    and Pelizaeus-Merzbacher disease. The combination of optic atrophy and prominent
    basal ganglia and substantia nigra signal change in a subset is the feature that
    should prompt SLC44A1 testing rather than a purely myelin-gene panel.
- name: Neurodegeneration with brain iron accumulation
  description: >-
    Low globus pallidus signal with hyperintense streaking, present in two of the four
    reported individuals, is visually reminiscent of NBIA. The source report does not
    claim an eye-of-the-tiger sign and iron accumulation was not demonstrated in
    patient brain, but the demonstrated vulnerability of CTL1-deficient cells to acute
    iron overload makes the resemblance worth noting rather than dismissing.
discussions:
- discussion_id: pc_preserved_despite_transport_loss
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is the human disease actually caused by phosphatidylcholine deficiency, given that
    phosphatidylcholine was preserved in the accessible tissue of affected individuals?
  rationale: >-
    The intuitive account of this disease, and the one stated in most secondary
    summaries, is that losing the choline transporter starves membrane synthesis of its
    phosphatidylcholine precursor. That account is directly complicated by the founding
    study's own measurement: choline transport was diminished while membrane
    phosphatidylcholine content was unchanged, and the same group later reported that
    phosphatidylcholine was preserved in the cerebrospinal fluid as well as the skin
    fibroblasts of affected individuals. The proposed reconciliation is that the
    paralogue CTL2 sustains a reduced but not absent Kennedy pathway, so the cell
    protects its phosphatidylcholine pool by deranging the rest of its phospholipid
    complement. Whether the oligodendrocyte, which must build far more membrane per cell
    than a fibroblast and may have a different CTL2 reserve, is able to make the same
    trade is the open question, and the in vivo animal data suggesting it cannot are
    from developing rather than degenerating tissue. Resolving this changes what a
    biomarker would be and whether substrate repletion should be expected to work.
  attaches_to:
  - pathophysiology#Constrained Kennedy Pathway Phospholipid Synthesis
  - pathophysiology#Membrane Phospholipid Homeostasis Disturbance
  evidence:
  - reference: PMID:33789160
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Paradoxically, although Cho transport and CDP-Cho Kennedy pathway were
      diminished, PC remained preserved in the cerebrospinal fluid and skin fibroblasts
      of the affected individuals"
    explanation: States the paradox in the source's own words, and extends the
      preserved-phosphatidylcholine finding from fibroblasts to cerebrospinal fluid.
  - reference: PMID:31855247
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "diminished choline transport yet the membrane phosphatidylcholine content
      remained unchanged"
    explanation: >-
      Refutes the simple phosphatidylcholine-depletion model in patient fibroblasts:
      the transport defect is present but the expected product depletion is not.
- discussion_id: developmental_vs_maintenance_myelin_failure
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Does the animal myelination-failure phenotype model the human disease, given that
    the models show a developmental hypomyelination while the human entity is a
    childhood-onset progressive degeneration?
  rationale: >-
    The zebrafish and rodent data are the strongest mechanistic support in the entry:
    SLC44A1 is oligodendrocyte-enriched, its loss impairs oligodendroglial maturation
    and myelinogenesis, and citicoline rescues myelination. But the readout in those
    models is developmental myelination, and the citicoline result is framed by its
    authors as a potential therapy for developmental hypomyelination. The human
    phenotype is not congenital hypomyelination; it is childhood-onset progressive
    ataxia, tremor, cognitive decline and optic atrophy on a background of
    leukoencephalopathy and cerebellar atrophy, which reads as failing maintenance of
    established myelin plus neuronal loss. If the human lesion is maintenance rather
    than development, a rescue that works in a developing animal may have no window in
    a child who has already myelinated, and the timing of any substrate trial depends
    on which it is.
  attaches_to:
  - pathophysiology#Oligodendrocyte Maturation Failure and Myelin Lipid Imbalance
  - animal_models#Zebrafish
  evidence:
  - reference: PMID:41317319
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "supplementation with citicoline, a natural choline metabolite, restores
      developmental myelination in SLC44A1-deficient animals"
    explanation: >-
      The rescue is reported for developmental myelination, which is the specific
      framing that leaves its relevance to an established, degenerating human
      phenotype open.
  - reference: PMID:31855247
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical features included progressive ataxia, tremor, cognitive decline,
      dysphagia, optic atrophy, dysarthria, as well as urinary and bowel incontinence."
    explanation: >-
      The human phenotype is progressive and childhood-onset rather than congenital,
      which is the side of the mismatch this item documents.

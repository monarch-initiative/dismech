      snippet: "The prolongation of QT interval and cardiac action potential duration are mainly due to reduced physiological function of the rapidly activating voltage-dependent potassium channels encoded by human ether-a-go-go-related gene (hERG)."
      explanation: Links reduced hERG function (including by trafficking loss) to action-potential and QT prolongation.
- name: Prolonged Ventricular Repolarization
  description: >-
    Reduced IKr diminishes the net repolarizing current during phases 2-3 of the
    cardiac action potential, prolonging action potential duration and the QT
    interval on the surface ECG. Normal repolarization is buffered by redundant
    potassium currents ("repolarization reserve"); when a latent genetic lesion,
    electrolyte disturbance, or female sex has already reduced that reserve, the
    same drug produces disproportionate QT prolongation.
  biological_scale: CELLULAR
  conforms_to: "xenobiotic_cardiac_channel_perturbation#Altered Cardiac Action Potential"
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746

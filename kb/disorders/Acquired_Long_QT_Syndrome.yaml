    term:
      id: GO:0071805
      label: potassium ion transmembrane transport
    modifier: DECREASED
  evidence:
  - reference: PMID:16253929
    reference_title: "Drug-induced torsades de pointes: the evolving role of pharmacogenetics."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: "These drugs inhibit the KCNH2-encoded HERG potassium channel, which is one of the critical repolarizing forces involved in the exquisite orchestration of the heart's action potential."
    explanation: Identifies hERG/IKr pore blockade (in-vitro channel pharmacology restated by this pharmacogenetics review) as the shared molecular lesion of drug-induced acquired LQTS.
  downstream:
  - target: Prolonged Ventricular Repolarization
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:16253929
      reference_title: "Drug-induced torsades de pointes: the evolving role of pharmacogenetics."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Consequently, myocyte repolarization is potentially delayed as evidenced by prolongation of the QT interval, thus providing the substrate for drug-induced TdP."
      explanation: States that hERG blockade delays repolarization, the next step in the chain.
- name: hERG Trafficking Disruption
  description: >-
    A parallel molecular route to reduced IKr: rather than blocking the pore,
    some drugs (pentamidine, arsenic trioxide, probucol) disrupt trafficking of
    the hERG channel to the plasma membrane or accelerate its degradation,
    lowering surface channel density. The functional consequence -- reduced IKr
    and delayed repolarization -- converges with pore blockade. (This route
    reduces channel density rather than altering gating, so it is not asserted
    to conform to the module's gating-change trigger node; it converges on the
    same altered action potential downstream.)

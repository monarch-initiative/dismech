  target_mechanisms:
  - target: Torsades de Pointes Arrhythmia
    treatment_effect: INHIBITS
    description: Accelerating the ventricular rate with isoproterenol shortens action-potential duration and suppresses pause-dependent torsades de pointes.
    evidence:
    - reference: PMID:26183037

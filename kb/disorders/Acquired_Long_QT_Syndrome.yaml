  - reference: PMID:26183037
    reference_title: "Pharmacological treatment of acquired QT prolongation and torsades de pointes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Some episodes of TdP could be avoided by careful prescribing of QT prolonging drugs, including an individualized assessment of risks and benefits before use, performing baseline and periodic electrocardiograms and measurement of electrolytes, especially during acute illnesses, using the lowest effective dose for the shortest possible time and avoiding potential drug interactions."
    explanation: Establishes baseline/serial ECG monitoring, electrolyte surveillance, dose minimization, and avoidance of drug interactions to prevent drug-induced torsades de pointes.
  - reference: PMID:41397500
    reference_title: "Exploring the link between antipsychotic and antidepressant use and severe QT prolongation: Impacts on ventricular arrhythmias and sudden cardiac death."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These findings underscore the importance of comprehensive risk assessment, correction of electrolyte abnormalities, and regular electrocardiographic monitoring in psychotropic drug users."
    explanation: Multicenter clinical cohort supporting risk assessment, electrolyte correction, and regular ECG monitoring in patients prescribed QT-prolonging psychotropics.
diagnosis:
- name: 12-lead ECG QTc measurement
  description: >-
    Diagnosis rests on the rate-corrected QT interval (QTc) on a 12-lead ECG.
    Significant prolongation is defined as QTc >500 ms or a rise of >=60 ms from
    baseline. Serum potassium, magnesium and calcium are checked and corrected.
  diagnosis_term:
    preferred_term: 12-lead electrocardiography
    term:
      id: NCIT:C38053
      label: Electrocardiography
  notes: >-
    The Tisdale QTc-risk score (0-23) stratifies inpatient TdP and mortality risk
    for patients on QT-prolonging drugs; higher scores track steeply higher
    mortality (PMID:36527915).
  evidence:
  - reference: PMID:42735272
    reference_title: "How Often Do QT-prolonging Drugs Really Prolong QT? A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "significant QTc prolongation, defined as QTc >500 ms or an increase in QTc (ΔQTc) ≥60 ms"
    explanation: Defines the diagnostic QTc thresholds used for drug-induced QT prolongation.
  - reference: PMID:36527915
    reference_title: "Relationship between a risk score for QT interval prolongation and mortality across rural and urban inpatient facilities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the odds ratio for mortality was 4.80 (95%CI:4.42-5.21) for patients with QTc-RS = 7-10 and 11.51 (95%CI:10.23-12.94) for those with QTc-RS ≥ 11."
    explanation: Validates the Tisdale QTc risk score against inpatient mortality.
- name: Targeted LQTS gene panel
  description: >-
    A targeted LQTS gene panel (KCNQ1, KCNH2, SCN5A, KCNE1, KCNE2) is warranted
    when baseline QTc remains prolonged off triggers, there is a family history,
    or TdP occurred with minimal provocation; about 28% carry a latent variant.
  diagnosis_term:
    preferred_term: targeted LQTS genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:26715165
    reference_title: "The genetics underlying acquired long QT syndrome: impact for genetic screening."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In 53 (28%) aLQTS subjects, 47 disease-causing mutations were identified."
    explanation: Supports the ~28% yield of latent congenital LQTS variants on gene-panel screening.
prevalence:
- population: Inpatients with prolonged QTc (urban US cohort, 2002-2013)
  measure_type: PERIOD_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 3000.0
  notes: >-
    89 of 2735 inpatients with prolonged QTc developed TdP (3%). This is a
    conditional proportion within a prolonged-QTc cohort, not a population
    prevalence; acquired LQTS has no single population prevalence because it is
    exposure-dependent.
  evidence:
  - reference: PMID:26589717
    reference_title: "Drug-induced torsades de pointes in an underserved urban population. Methadone: is there therapeutic equipoise?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of these, 89 (3%) experienced TdP."
    explanation: Reports the proportion of prolonged-QTc inpatients who developed TdP.
- population: Methadone-exposed adults (systematic review, 42 studies)
  measure_type: PERIOD_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_high: 3600.0
  rate_per_100000: 3600.0
  notes: >-
    Drug-specific upper-bound figures from a systematic review: methadone QTc
    >500 ms incidence 0-16.2% and TdP prevalence up to 3.6%. These are
    drug- and setting-dependent, not a disease-level prevalence.
  evidence:
  - reference: PMID:42735272
    reference_title: "How Often Do QT-prolonging Drugs Really Prolong QT? A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "reported QTc >500 ms incidence ranging from 0% to 16.2%, and TdP prevalence up to 3.6%"
    explanation: Gives drug-specific methadone QTc-prolongation and TdP frequency.
progression:
- phase: Acute drug-triggered episode
  notes: >-
    Onset over hours to days after drug initiation or dose increase; the
    arrhythmia is episodic and typically self-limiting, and the QTc normalizes
    after the stressor is removed (treatment-induced remission). Reversibility on
    stressor removal is the defining feature distinguishing acquired from
    congenital LQTS; the condition is not chronic.
  evidence:
  - reference: PMID:26183037
    reference_title: "Pharmacological treatment of acquired QT prolongation and torsades de pointes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "It typically occurs in self-limiting bursts, causing dizziness and syncope"
    explanation: Supports the episodic, self-limiting course of the arrhythmia.

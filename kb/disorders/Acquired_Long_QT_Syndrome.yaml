    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "lesions in these repolarizing mechanisms can remain subclinical but nevertheless increase risk on drug exposure"
    explanation: States the reduced-repolarization-reserve concept underlying disproportionate QT prolongation.
  - reference: PMID:27595633
    reference_title: "Sex hormonal regulation of cardiac ion channels in drug-induced QT syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Female sex is an independent risk factor for development of torsade de pointes (TdP) arrhythmias not only in congenital long QT syndromes but also in acquired long QT syndromes."
    explanation: Female sex lowers repolarization reserve and is an independent risk factor for torsades in acquired LQTS. Controlled crossover studies found no sex difference in concentration-adjusted QTc prolongation (PMID:26324176), so the excess female risk reflects lower baseline reserve rather than greater per-exposure lengthening.

        id: CHEBI:18420
        label: magnesium(2+)
  target_mechanisms:
  - target: Prolonged Ventricular Repolarization
    treatment_effect: INHIBITS
    description: Maintaining potassium in the high-normal range and correcting magnesium deficiency augments IKr/repolarization reserve and attenuates delayed ventricular repolarization.
    evidence:
    - reference: PMID:26183037

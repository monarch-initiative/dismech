- name: Isoproterenol for pause-dependent torsades
  description: >-
    For recurrent or bradycardia/pause-dependent torsades, isoproterenol
    (isoprenaline) increases the underlying heart rate and suppresses the
    arrhythmia.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy

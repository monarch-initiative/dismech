- name: Preventive QTc and electrolyte surveillance
  description: >-
    Pre-prescription risk stratification, baseline and serial ECG QTc
    monitoring, electrolyte monitoring and repletion during intercurrent
    illness, use of the lowest effective dose for the shortest duration, and
    avoidance of drug-drug interactions or concomitant QT-prolonging agents in
    vulnerable patients.
  therapeutic_modality: OTHER
  notes: >-
    Clinical risk assessment, ECG/electrolyte surveillance, and prescribing
    stewardship do not administer a pharmacological agent, device, surgical
    procedure, or behavioral therapy, so therapeutic_modality is recorded as
    OTHER.
  treatment_term:
    preferred_term: preventive QTc and electrolyte monitoring
    term:
      id: NCIT:C15843
      label: Preventive Intervention
  target_mechanisms:
  - target: Prolonged Ventricular Repolarization
    treatment_effect: MODULATES
    description: >-
      Pre-prescription risk assessment, electrolyte monitoring, dose
      minimization, and avoidance of interacting QT-prolonging drugs limit
      excessive ventricular repolarization delay in susceptible hosts.
    evidence:
    - reference: PMID:26183037
      reference_title: "Pharmacological treatment of acquired QT prolongation and torsades de pointes."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Some episodes of TdP could be avoided by careful prescribing of QT prolonging drugs, including an individualized assessment of risks and benefits before use, performing baseline and periodic electrocardiograms and measurement of electrolytes, especially during acute illnesses, using the lowest effective dose for the shortest possible time and avoiding potential drug interactions."
      explanation: Connects preventive prescribing stewardship and ECG/electrolyte surveillance to avoiding drug-induced repolarization delay and torsades de pointes.

    explanation: Names the SCN5A S1102Y polymorphism as an ethnic-specific susceptibility allele; the review states such polymorphisms enhance susceptibility to drug-induced (acquired) LQTS.
- name: KCNE1
  notes: >-
    The common KCNE1 D85N (rs1805128) polymorphism, which modulates the IKs

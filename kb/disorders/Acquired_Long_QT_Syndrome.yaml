name: Acquired Long QT Syndrome
creation_date: "2026-11-04T00:00:00Z"
description: >-
  Acquired (secondary) long QT syndrome is a reversible disorder of ventricular
  repolarization in which an external stressor -- most often a QT-prolonging
  drug, but also electrolyte disturbance (hypokalemia, hypomagnesemia,
  hypocalcemia), bradycardia, or metabolic derangement -- pathologically
  prolongs the QT interval and predisposes to torsades de pointes and sudden
  cardiac death. The QT prolongation reverts toward normal once the stressor is
  removed, distinguishing it from inherited long QT syndrome. The dominant
  molecular mechanism is reduction of the rapid delayed-rectifier potassium
  current IKr, carried by the hERG (KCNH2) channel, by direct pore blockade or
  by disruption of channel trafficking to the membrane. Susceptibility is
  modulated by "reduced repolarization reserve," including latent (subclinical)
  congenital long QT variants and common modifier alleles unmasked by the
  stressor, making aLQTS a prototypical gene-environment interaction.
category: Complex
disease_term:
  preferred_term: acquired long QT syndrome
  term:
    id: MONDO:1060292
    label: acquired long QT syndrome
synonyms:
- aLQTS
- drug-induced long QT syndrome
- secondary long QT syndrome
- acquired QT prolongation
parents:
- Cardiac Arrhythmia
notes: >-
  Curated as a distinct entry from inherited/familial long QT syndrome
  (MONDO:0019171, Familial_Long_QT_Syndrome), which explicitly separates the
  acquired form. The defining feature here is reversibility on removal of the
  external stressor and the absence of a causative germline variant, although a
  latent congenital variant or common modifier allele may lower the threshold
  ("reduced repolarization reserve"). No GeneReviews chapter exists for the
  acquired syndrome (just check-genereviews reports NO_CHAPTER); GeneReviews
  covers the congenital LQTS genes from which susceptibility is drawn.
pathophysiology:
- name: IKr Potassium Channel Blockade
  description: >-
    A QT-prolonging drug binds the hERG (KCNH2-encoded Kv11.1) channel and
    blocks the rapid delayed-rectifier potassium current IKr. hERG has an
    unusually large, promiscuous inner cavity, which is why chemically diverse
    drugs share this liability. Electrolyte disturbances such as hypokalemia
    further reduce IKr. This is the dominant molecular lesion of acquired LQTS.
  biological_scale: MOLECULAR
  conforms_to: "xenobiotic_cardiac_channel_perturbation#Xenobiotic Cardiac Ion-Channel Perturbation"
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  molecular_functions:
  - preferred_term: delayed rectifier potassium channel activity
    term:
      id: GO:0005251
      label: delayed rectifier potassium channel activity
    modifier: DECREASED
  evidence:
  - reference: PMID:16253929
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These drugs inhibit the KCNH2-encoded HERG potassium channel, which is one of the critical repolarizing forces involved in the exquisite orchestration of the heart's action potential."
    explanation: Identifies hERG/IKr blockade as the shared molecular lesion of drug-induced acquired LQTS.
  downstream:
  - target: Prolonged Ventricular Repolarization
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:16253929
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Consequently, myocyte repolarization is potentially delayed as evidenced by prolongation of the QT interval, thus providing the substrate for drug-induced TdP."
      explanation: States that hERG blockade delays repolarization, the next step in the chain.
- name: hERG Trafficking Disruption
  description: >-
    A parallel molecular route to reduced IKr: rather than blocking the pore,
    some drugs (pentamidine, arsenic trioxide, probucol) disrupt trafficking of
    the hERG channel to the plasma membrane or accelerate its degradation,
    lowering surface channel density. The functional consequence -- reduced IKr
    and delayed repolarization -- converges with pore blockade. (This route
    reduces channel density rather than altering gating, so it is not asserted
    to conform to the module's gating-change trigger node; it converges on the
    same altered action potential downstream.)
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  evidence:
  - reference: PMID:24998878
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: "The mechanisms involve the disruption of hERG trafficking to the surface membrane or the acceleration of hERG protein degradation."
    explanation: Describes the trafficking-disruption route to reduced hERG surface expression.
  downstream:
  - target: Prolonged Ventricular Repolarization
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:24998878
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: REVIEW_SYNTHESIS
      snippet: "The prolongation of QT interval and cardiac action potential duration are mainly due to reduced physiological function of the rapidly activating voltage-dependent potassium channels encoded by human ether-a-go-go-related gene (hERG)."
      explanation: Links reduced hERG function (including by trafficking loss) to action-potential and QT prolongation.
- name: Prolonged Ventricular Repolarization
  description: >-
    Reduced IKr diminishes the net repolarizing current during phases 2-3 of the
    cardiac action potential, prolonging action potential duration and the QT
    interval on the surface ECG. Normal repolarization is buffered by redundant
    potassium currents ("repolarization reserve"); when a latent genetic lesion,
    electrolyte disturbance, or female sex has already reduced that reserve, the
    same drug produces disproportionate QT prolongation.
  biological_scale: CELLULAR
  conforms_to: "xenobiotic_cardiac_channel_perturbation#Altered Cardiac Action Potential"
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: ventricular cardiac muscle cell action potential repolarization
    term:
      id: GO:0098915
      label: membrane repolarization during ventricular cardiac muscle cell action potential
    modifier: DECREASED
  evidence:
  - reference: PMID:16336514
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "lesions in these repolarizing mechanisms can remain subclinical but nevertheless increase risk on drug exposure"
    explanation: States the reduced-repolarization-reserve concept underlying disproportionate QT prolongation.
  downstream:
  - target: Prolonged QT interval
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:16253929
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "myocyte repolarization is potentially delayed as evidenced by prolongation of the QT interval"
      explanation: The delayed repolarization is measured on the ECG as a prolonged QT interval.
  - target: Early Afterdepolarizations
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:38504714
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "Prolongation of ventricular action potential duration (APD) prolongs the time window during which L-type calcium channel remains open and facilitates the generation of EADs."
      explanation: Directly asserts that prolonged APD causes early afterdepolarizations, the next step.
- name: Early Afterdepolarizations
  description: >-
    Prolonged action potential duration permits reactivation of L-type calcium
    current (and enhanced late sodium current) during phase 2/3, generating
    early afterdepolarizations (EADs) that trigger premature ventricular beats,
    especially in the setting of bradycardia and increased transmural dispersion
    of repolarization.
  biological_scale: CELLULAR
  conforms_to: "xenobiotic_cardiac_channel_perturbation#Arrhythmogenic Triggered Activity"
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: membrane depolarization during action potential
    term:
      id: GO:0086010
      label: membrane depolarization during action potential
    modifier: ABNORMAL
  downstream:
  - target: Torsades de Pointes Arrhythmia
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:38504714
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "TdP is initiated by triggered activity due to early afterdepolarization (EAD) and maintained by reentry within a substrate of inhomogeneous repolarization."
      explanation: Asserts that EAD-triggered activity initiates torsades de pointes.
- name: Torsades de Pointes Arrhythmia
  description: >-
    EAD-triggered beats initiate a polymorphic ventricular tachycardia with a
    characteristic twisting QRS axis (torsades de pointes), maintained by reentry
    across a substrate of dispersed repolarization. It may terminate
    spontaneously (causing syncope) or degenerate into ventricular fibrillation
    and sudden cardiac death. This tissue-level arrhythmia is the mechanistic
    node; the clinical finding is the Torsade de pointes phenotype.
  biological_scale: TISSUE
  conforms_to: "xenobiotic_cardiac_channel_perturbation#Xenobiotic-Induced Cardiac Arrhythmia"
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  downstream:
  - target: Torsades de Pointes
  - target: Syncope
  - target: Sudden Cardiac Death
  evidence:
  - reference: PMID:26183037
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It typically occurs in self-limiting bursts, causing dizziness and syncope, but may occasionally progress to ventricular fibrillation and sudden death."
    explanation: Describes the clinical course of torsades from syncope to sudden death.
phenotypes:
- category: Clinical
  name: Prolonged QT interval
  description: Pathologic prolongation of the rate-corrected QT interval on ECG, the defining feature.
  phenotype_term:
    preferred_term: Prolonged QT interval
    term:
      id: HP:0001657
      label: Prolonged QT interval
  evidence:
  - reference: PMID:26183037
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Torsades de pointes (TdP) is a characteristic polymorphic ventricular arrhythmia associated with delayed ventricular repolarization as evidenced on the surface electrocardiogram by QT interval prolongation."
    explanation: Establishes QT prolongation as the ECG hallmark preceding the arrhythmia.
- category: Clinical
  name: Torsades de Pointes
  description: Polymorphic ventricular tachycardia with a twisting QRS axis, the dangerous arrhythmia of aLQTS.
  phenotype_term:
    preferred_term: Torsade de pointes
    term:
      id: HP:0001664
      label: Torsade de pointes
  evidence:
  - reference: PMID:26715165
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Acquired long QT syndrome (aLQTS) exhibits QT prolongation and Torsades de Pointes ventricular tachycardia triggered by drugs, hypokalaemia, or bradycardia."
    explanation: Names torsades de pointes as the characteristic arrhythmia of acquired LQTS.
- category: Clinical
  name: Syncope
  description: Transient loss of consciousness from self-terminating torsades.
  phenotype_term:
    preferred_term: Syncope
    term:
      id: HP:0001279
      label: Syncope
  evidence:
  - reference: PMID:26183037
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It typically occurs in self-limiting bursts, causing dizziness and syncope, but may occasionally progress to ventricular fibrillation and sudden death."
    explanation: Attributes syncope to self-limiting torsades bursts.
- category: Clinical
  name: Sudden Cardiac Death
  description: Death from degeneration of torsades into ventricular fibrillation.
  phenotype_term:
    preferred_term: Sudden cardiac death
    term:
      id: HP:0001645
      label: Sudden cardiac death
  evidence:
  - reference: PMID:41397500
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SQTP was associated with an approximate 3-fold higher VA risk in both groups and a 2-fold SCD risk in antipsychotic users."
    explanation: Quantifies the increased ventricular-arrhythmia and sudden-cardiac-death risk with severe QT prolongation.
environmental:
- name: QT-prolonging drug exposure
  description: >-
    Exposure to a drug that reduces IKr/hERG -- including class IA and class III
    antiarrhythmics (sotalol, dofetilide, quinidine), macrolide and
    fluoroquinolone antibiotics, azole antifungals, antipsychotics, some
    antidepressants, methadone, and some antiemetics -- is the predominant cause
    of acquired QT prolongation. Hypokalemia, hypomagnesemia, and bradycardia
    amplify the effect.
  exposure_term:
    preferred_term: exposure to QT-prolonging drug
    term:
      id: ECTO:0000509
      label: exposure to drug
  evidence:
  - reference: PMID:26183037
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Acquired long QT syndromes are mainly caused by cardiac disease, electrolyte abnormalities or exposure to drugs that block rectifying potassium channels, especially IKr."
    explanation: Names IKr-blocking drug exposure (and electrolyte abnormality) as the main cause of acquired LQTS.
  influences_mechanisms:
  - target: IKr Potassium Channel Blockade
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Systemic exposure to an IKr-blocking drug is the route by which channel
      blockade -- and hence QT prolongation -- is established.
    evidence:
    - reference: PMID:26183037
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "exposure to drugs that block rectifying potassium channels, especially IKr"
      explanation: Ties the drug exposure to IKr blockade specifically.
genetic:
- name: KCNH2
  notes: >-
    Latent (subclinical) variants in KCNH2 are the most frequent genetic
    substrate unmasked in acquired LQTS, reducing repolarization reserve so that
    an IKr-blocking stressor produces marked QT prolongation. KCNH2 also encodes
    the direct drug target (hERG). These are susceptibility modifiers, not
    obligate causes.
  relationship_type: SUSCEPTIBILITY
  gene_term:
    preferred_term: KCNH2
    term:
      id: hgnc:6251
      label: KCNH2
  evidence:
  - reference: PMID:26715165
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A third of aLQTS patients carry cLQTS mutations, those on KCNH2 being more common."
    explanation: Establishes KCNH2 as the most frequent latent susceptibility gene in acquired LQTS.
- name: KCNQ1
  notes: >-
    Latent congenital LQTS variants in KCNQ1 (IKs) are part of the genetic
    reservoir screened in acquired LQTS cohorts; less frequent than KCNH2 among
    "true aLQTS" subjects.
  relationship_type: SUSCEPTIBILITY
  gene_term:
    preferred_term: KCNQ1
    term:
      id: hgnc:6294
      label: KCNQ1
  evidence:
  - reference: PMID:26715165
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "in 'true aLQTS', KCNQ1 mutations were much less frequent than KCNH2 (20% [95% CI 7-41%] vs. 64% [95% CI 43-82%], P < 0.01)."
    explanation: Directly supports that KCNQ1 variants are less frequent than KCNH2 among true acquired-LQTS subjects.
- name: SCN5A
  notes: >-
    SCN5A is one of the five major congenital LQTS genes screened as the latent
    genetic reservoir in acquired LQTS cohorts (SCN5A variants act through late
    sodium current). It is less frequently implicated than the potassium-channel
    genes; these are susceptibility modifiers, not obligate causes.
  relationship_type: SUSCEPTIBILITY
  gene_term:
    preferred_term: SCN5A
    term:
      id: hgnc:10593
      label: SCN5A
  evidence:
  - reference: PMID:26715165
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We screened for the five major LQTS genes among 188 aLQTS probands"
    explanation: SCN5A is one of the five major LQTS genes screened as the latent genetic reservoir in this acquired LQTS cohort.
- name: KCNE1
  notes: >-
    The common KCNE1 D85N (rs1805128) polymorphism, which modulates the IKs
    potassium current, is the most robustly replicated common modifier allele
    for drug-induced LQTS.
  relationship_type: MODIFIER
  gene_term:
    preferred_term: KCNE1
    term:
      id: hgnc:6240
      label: KCNE1
  evidence:
  - reference: PMID:22100668
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The SNP KCNE1 D85N (rs1805128), known to modulate an important potassium current in the heart, predicted diLQTS with an odds ratio of 9.0 (95% confidence interval, 3.5-22.9)."
    explanation: Quantifies the KCNE1 D85N common-variant risk for drug-induced LQTS.
experimental_models:
- name: Human iPSC-derived engineered heart tissue (hERG block + hypokalemia/hypomagnesemia)
  description: >-
    Human iPSC-derived engineered heart tissues (EHTs) with high-resolution
    optical mapping, exposed to the proarrhythmic perturbation used to model
    acquired LQTS: selective hERG blockade (E-4031) combined with hypokalemia
    and hypomagnesemia. The model reproduces APD prolongation and tissue-scale
    reentry, a non-animal (NAM) system for acquired-LQTS arrhythmia mechanisms.
  experimental_model_type: IPSC_DERIVED_MODEL
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  publication: PMID:41727060
  evidence:
  - reference: PMID:41727060
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The presented platform thus provides a scalable, non-animal system for mechanistic arrhythmia research."
    explanation: Establishes the engineered heart tissue as a valid non-animal system for studying acquired-LQTS arrhythmia mechanisms.
  modeled_mechanisms:
  - target: Prolonged Ventricular Repolarization
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Selective hERG blockade prolongs action potential duration in the engineered tissue.
    evidence:
    - reference: PMID:41727060
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Selective hERG blockade with E-4031 prolongs APD, confirming pharmacological sensitivity."
      explanation: Demonstrates that the model reproduces IKr-blockade-driven repolarization prolongation.
  - target: Torsades de Pointes Arrhythmia
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    description: >-
      hERG block with hypokalemia/hypomagnesemia produces tissue-scale reentry
      and tachyarrhythmia, but the small tissue resembles ventricular
      tachycardia rather than true torsades de pointes.
    limitations: >-
      Spatial limitations of the engineered tissue mean rotors are short-lived
      and the arrhythmia resembles VT rather than torsades de pointes or
      sustained fibrillation.
    evidence:
    - reference: PMID:41727060
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "human iPSC-derived EHTs can recapitulate the tissue-scale VT mechanisms associated with acquired long QT syndrome"
      explanation: Shows the model reproduces the tissue-scale reentrant mechanism, with the VT-vs-TdP caveat.
treatments:
- name: Withdrawal of the offending agent
  description: >-
    Identify and discontinue the causative QT-prolonging drug and correct the
    precipitating cause. QT prolongation is reversible once the stressor is
    removed.
  treatment_term:
    preferred_term: Therapeutic Procedure
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  evidence:
  - reference: PMID:26183037
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Management of TdP or marked QT prolongation includes removal or correction of precipitants, including discontinuation of culprit drugs and institution of cardiac monitoring."
    explanation: States that discontinuing culprit drugs is the basis of management.
- name: Intravenous magnesium sulfate
  description: >-
    First-line acute treatment for torsades de pointes regardless of serum
    magnesium level; suppresses EAD-triggered beats.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: magnesium sulfate
      term:
        id: CHEBI:32599
        label: magnesium sulfate
  evidence:
  - reference: PMID:26183037
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Immediate treatment of TdP is by intravenous administration of magnesium sulphate, terminating prolonged episodes using electrical cardioversion."
    explanation: Establishes IV magnesium sulfate as first-line acute therapy for torsades.
- name: Correction of electrolyte abnormalities
  description: >-
    Repletion of potassium (kept in the high-normal range) and magnesium raises
    repolarization reserve and shortens the QT interval.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:26183037
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Electrolyte abnormalities and hypoxia should be corrected, with potassium concentrations maintained in the high normal range."
    explanation: States the electrolyte-correction target in management.
- name: Rate support for pause-dependent torsades
  description: >-
    For recurrent or bradycardia/pause-dependent torsades, increasing the heart
    rate with isoproterenol or transvenous pacing suppresses the arrhythmia.
  treatment_term:
    preferred_term: rate acceleration (isoproterenol or cardiac pacing)
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  evidence:
  - reference: PMID:26183037
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In refractory cases of recurrent TdP, the arrhythmia can be suppressed by increasing the underlying heart rate using isoproterenol (isoprenaline) or transvenous pacing."
    explanation: Supports rate acceleration (isoproterenol/pacing) for refractory pause-dependent torsades.

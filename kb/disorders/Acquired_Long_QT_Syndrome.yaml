environmental:
- name: QT-prolonging drug exposure
  description: >-
    Exposure to a drug that reduces IKr/hERG -- including class IA and class III
    antiarrhythmics (sotalol, dofetilide, quinidine), macrolide and
    fluoroquinolone antibiotics, azole antifungals, antipsychotics, some
    antidepressants, methadone, and some antiemetics -- is the predominant cause
    of acquired QT prolongation. Hypokalemia, hypomagnesemia, and bradycardia
    amplify the effect.
  exposure_term:
    preferred_term: exposure to QT-prolonging drug
    term:
      id: ECTO:0000509
      label: exposure to drug
  notes: >-
    ECTO has no class for a QT-prolonging drug or its drug classes: searched
    l~antiarrhythmic (0 ECTO hits), l~antipsychotic (0 ECTO hits; only CHEBI
    chemical classes), l~macrolide (0 ECTO hits; only CHEBI), and l~QT prolong
    (0 hits). The broad ECTO:0000509 exposure to drug is bound with the specific
    concept carried in preferred_term.
  evidence:
  - reference: PMID:26183037
    reference_title: "Pharmacological treatment of acquired QT prolongation and torsades de pointes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Acquired long QT syndromes are mainly caused by cardiac disease, electrolyte abnormalities or exposure to drugs that block rectifying potassium channels, especially IKr."
    explanation: Names IKr-blocking drug exposure (and electrolyte abnormality) as the main cause of acquired LQTS.
  influences_mechanisms:
  - target: IKr Potassium Channel Blockade
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Systemic exposure to an IKr-blocking drug is the route by which channel
      blockade -- and hence QT prolongation -- is established.
    evidence:
    - reference: PMID:26183037
      reference_title: "Pharmacological treatment of acquired QT prolongation and torsades de pointes."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "exposure to drugs that block rectifying potassium channels, especially IKr"
      explanation: Ties the drug exposure to IKr blockade specifically.
genetic:
- name: KCNH2
  notes: >-
    Latent (subclinical) variants in KCNH2 are the most frequent genetic
    substrate unmasked in acquired LQTS, reducing repolarization reserve so that
    an IKr-blocking stressor produces marked QT prolongation. KCNH2 also encodes
    the direct drug target (hERG). These are susceptibility modifiers, not
    obligate causes.
  relationship_type: SUSCEPTIBILITY
  gene_term:
    preferred_term: KCNH2
    term:
      id: hgnc:6251
      label: KCNH2
  evidence:
  - reference: PMID:26715165
    reference_title: "The genetics underlying acquired long QT syndrome: impact for genetic screening."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A third of aLQTS patients carry cLQTS mutations, those on KCNH2 being more common."
    explanation: Establishes KCNH2 as the most frequent latent susceptibility gene in acquired LQTS.
- name: KCNQ1
  notes: >-
    Latent congenital LQTS variants in KCNQ1 (IKs) are part of the genetic
    reservoir screened in acquired LQTS cohorts; less frequent than KCNH2 among
    "true aLQTS" subjects.
  relationship_type: SUSCEPTIBILITY
  gene_term:
    preferred_term: KCNQ1
    term:
      id: hgnc:6294
      label: KCNQ1
  evidence:
  - reference: PMID:26715165
    reference_title: "The genetics underlying acquired long QT syndrome: impact for genetic screening."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "in 'true aLQTS', KCNQ1 mutations were much less frequent than KCNH2 (20% [95% CI 7-41%] vs. 64% [95% CI 43-82%], P < 0.01)."
    explanation: Directly supports that KCNQ1 variants are less frequent than KCNH2 among true acquired-LQTS subjects.
- name: SCN5A
  notes: >-
    SCN5A (late sodium current, gain of function) contributes to drug-induced
    LQTS susceptibility. The S1102Y polymorphism, enriched in African Americans,
    is an ethnic-specific allele that enhances susceptibility to drug-induced
    arrhythmia. These are susceptibility modifiers, not obligate causes.
  relationship_type: SUSCEPTIBILITY
  gene_term:

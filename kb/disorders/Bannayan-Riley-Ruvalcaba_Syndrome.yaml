- category: Growth
  name: Macrocephaly
  description: >-
    Macrocephaly is a cardinal BRRS feature and often prompts recognition in childhood. It was reported
    in 77% of 83 published pediatric cases in a systematic review. A separate pediatric PHTS cohort reported
    a mean head circumference of +5.7 standard deviations; its composite presenting-symptom statistic
    does not measure macrocephaly frequency alone.
  phenotype_term:
    preferred_term: Macrocephaly

- name: Lifelong Multiorgan Cancer Predisposition
  biological_scale: ORGANISM
  description: >-
    Because every cell carries one inactivated PTEN allele, somatic loss of the second
    allele in a susceptible tissue removes tumor-suppressor function entirely and permits
    malignant transformation. The resulting lifetime risks span breast, thyroid,
    endometrial, renal, colorectal, and cutaneous melanocytic malignancy. This node
    carries the central nosological insight of the entry: although malignancy was not
    formally documented in the original BRRS descriptions, PTEN-positive BRRS and Cowden
    syndrome are allelic presentations of one disorder and therefore warrant identical
    cancer surveillance. Cancer risk in BRRS is largely realized in adulthood, so the
    childhood diagnosis obligates lifelong follow-up rather than pediatric oncologic
    treatment.
  cell_types:
  - preferred_term: thyroid follicular cell
    term:
      id: CL:0002258
      label: thyroid follicular cell
  - preferred_term: epithelial cell
    term:
      id: CL:0000066
      label: epithelial cell
  biological_processes:
  - preferred_term: negative regulation of apoptosis
    term:
      id: GO:0043066
      label: negative regulation of apoptotic process
    modifier: INCREASED
  evidence:
  - reference: PMID:10400993
    reference_title: PTEN mutation spectrum and genotype-phenotype correlations in Bannayan-Riley-Ruvalcaba syndrome suggest a single entity with Cowden syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thus, PTEN mutation-positive CS and BRR may be different presentations of a single syndrome and, hence, both should receive equal attention with respect to cancer surveillance."
    explanation: >-
      The key conclusion establishing that PTEN-positive BRRS carries the Cowden-equivalent
      cancer burden and must be surveilled accordingly.
  - reference: PMID:10400993
    reference_title: PTEN mutation spectrum and genotype-phenotype correlations in Bannayan-Riley-Ruvalcaba syndrome suggest a single entity with Cowden syndrome.
    supports: NO_EVIDENCE
    evidence_source: HUMAN_CLINICAL
    snippet: "CS is characterized by multiple hamartomas and an increased risk of benign and malignant disease of the breast, thyroid and central nervous system, whilst the presence of cancer has not been formally documented in BRR."
    explanation: >-
      Recorded as NO_EVIDENCE because it asserts an absence of evidence rather than
      supporting or refuting the node: malignancy had not been formally established in
      BRRS-ascertained cohorts. It is retained to make
      explicit that the cancer risk attributed to BRRS is inferred from allelism with Cowden
      syndrome rather than from direct BRRS-cohort incidence data.
  - reference: PMID:22252256
    reference_title: Lifetime cancer risks in individuals with germline PTEN mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Lifetime risks for a variety of cancers, now extending to colorectal cancer, kidney cancer, and melanoma, are increased in patients with PTEN mutations."
    explanation: >-
      The prospective PHTS cohort establishing that germline PTEN carriers, the molecular
      class to which PTEN-positive BRRS belongs, carry elevated multiorgan cancer risk.
  - reference: PMID:33140411
    reference_title: A review on age-related cancer risks in PTEN hamartoma tumor syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with PTEN hamartoma tumor syndrome (PHTS, comprising Cowden, Bannayan-Riley-Ruvalcaba, and Proteus-like syndromes) are at increased risk of developing cancer due to pathogenic PTEN germline variants."
    explanation: >-
      Explicitly includes BRRS within the PHTS group carrying germline-PTEN-driven cancer
      risk.
  - reference: PMID:39256443
    reference_title: A systematic review of Bannayan - Riley - Ruvalcaba syndrome.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with BRRS are considered to share the same lifetime risk of cancer as individuals with Cowden syndrome, however, it has not been confirmed by formal studies"
    explanation: >-
      The most precise available statement of this node's epistemic status, from a
      BRRS-specific systematic review: the Cowden-equivalent cancer risk is the accepted
      clinical assumption but remains formally unconfirmed in BRRS-ascertained cohorts.
      Recorded as PARTIAL for exactly that reason.
  downstream:
  - target: Breast carcinoma
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Thyroid carcinoma
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Endometrial carcinoma
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Renal cell carcinoma
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Colon cancer
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Melanoma
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Hashimoto thyroiditis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Benign thyroid pathology including Hashimoto thyroiditis is over-represented in

inheritance:
- name: Autosomal dominant inheritance
  description: >-
    PTEN-positive BRRS follows autosomal dominant inheritance. Each child of an individual with a germline
    pathogenic PTEN variant has a 50% chance of inheriting it, with variable expression. De novo variants
    occur, so an unremarkable family history does not exclude PHTS. A PHTS study confirmed de novo variants
    in 20 of 187 families (10.7%); the 47.6% estimate was restricted to 20 of 42 probands with informative
    familial testing, not a BRRS-specific population rate.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:20301661
    reference_title: PTEN Hamartoma Tumor Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PHTS is inherited in an autosomal dominant manner."
    explanation: GeneReviews states the autosomal dominant inheritance of PHTS, which subsumes BRRS.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:20301661
    reference_title: PTEN Hamartoma Tumor Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Each child of an affected individual has a 50% chance of inheriting the pathogenic variant and developing PHTS."
    explanation: GeneReviews gives the 50% transmission risk implied by autosomal dominant inheritance.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:22595938
    reference_title: Estimate of de novo mutation frequency in probands with PTEN hamartoma tumor syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Twenty mutations were confirmed as de novo through familial testing (grade 5) by the Eng research laboratory or testing in a CLIA-certified facility, leading to a conservatively calculated de novo mutation frequency of 10.7% (20/187) within all eligible families.
    explanation: >-
      The full PHTS cohort denominator was 187 unrelated families; this is not a BRRS-only estimate.
  - reference: PMID:22595938
    reference_title: Estimate of de novo mutation frequency in probands with PTEN hamartoma tumor syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: If analysis is restricted to only those probands with known familial testing results (grade 1 and 5 probands, n=42), a maximum de novo mutation frequency of 47.6% (20/42) is obtained.
    explanation: >-
      The upper estimate depends on restricting the denominator to probands with informative family testing.
has_subtypes:
- name: 10q23 deletion
  display_name: 10q23 contiguous-gene deletion (PTEN + BMPR1A)
  description: >-
    Deletions encompassing both PTEN and BMPR1A can combine BRRS-like macrocephaly and developmental findings
    with juvenile polyposis. Infantile gastrointestinal disease can be severe, but reported deletion carriers
    have variable onset and severity; deletion size alone does not predict gastrointestinal severity.
    Copy-number analysis defines the deletion and its gene content. The chromosome 10q23 deletion ontology
    term covers a broader interval-associated syndrome; the pattern described here specifically includes
    both genes.
  evidence:
  - reference: PMID:18510548
    reference_title: Variable phenotypes associated with 10q23 microdeletions involving the PTEN and BMPR1A genes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Recently, 10q23 microdeletions involving the PTEN and BMPR1A genes were found in four patients with infantile juvenile polyposis. It was hypothesized that a combined and synergistic effect of the deletion of both genes would explain the condition."
    explanation: >-
      Establishes the contiguous-deletion entity and the original two-gene synergy hypothesis.
  - reference: PMID:18510548
    reference_title: Variable phenotypes associated with 10q23 microdeletions involving the PTEN and BMPR1A genes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients had macrocephaly, dysmorphic features, retardation and congenital abnormalities."
    explanation: >-
      Documents the BRRS-like core (macrocephaly, developmental delay) in deletion carriers. This evidence
      is limited because this is a four-patient series.
  - reference: PMID:18510548
    reference_title: Variable phenotypes associated with 10q23 microdeletions involving the PTEN and BMPR1A genes.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "No clear correlation was found between ages at onset or severity of gastrointestinal symptoms and the sizes of the deletions."
    explanation: >-
      Recorded as REFUTE against the simple dose/size-severity model: deletion size does not predict severity,
      which is why this subtype is described as variable rather than uniformly severe.
  subtype_term:
    preferred_term: 10q23 contiguous deletion involving PTEN and BMPR1A
    term:
      id: MONDO:0012830
      label: chromosome 10q23 deletion syndrome
mechanistic_hypotheses:
- hypothesis_group_id: canonical_pi3k_akt_mtor
  hypothesis_label: Canonical PI3K-AKT-mTOR dose-sensitive overgrowth
  status: CANONICAL
  description: >-
    PTEN lipid-phosphatase loss increases PIP3-dependent AKT signaling and downstream mTOR activity, contributing
    to abnormal growth. This is a central mechanism in PTEN-positive BRRS, but does not establish a single
    causal route for every clinical feature or explain all PTEN-negative presentations.
  evidence:
  - reference: PMID:9593664
    reference_title: "The tumor suppressor, PTEN/MMAC1, dephosphorylates the lipid second messenger, phosphatidylinositol 3,4,5-trisphosphate."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: Purified recombinant PTEN catalyzed dephosphorylation of PtdIns(3,4,5)P3, specifically at position 3 on the inositol ring.
    explanation: >-
      Biochemical assays establish the direct PIP3 3-phosphatase activity of PTEN.
  - reference: PMID:35594551
    reference_title: A randomized controlled trial of everolimus for neurocognitive symptoms in PTEN hamartoma tumor syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: In PHTS, loss of PTEN function leads to disinhibition of the PI3K (phosphatidylinositol-4,5-bisphosphate 3-kinase)-AKT–mTOR pathway
    explanation: >-
      The trial introduction summarizes established PHTS signaling biology; the clinical trial did not
      itself measure this molecular chain.
- hypothesis_group_id: pten_localization_neurodevelopment
  hypothesis_label: Altered PTEN localization and abundance in neurodevelopment
  status: EMERGING
  description: >-
    The cytoplasmic-predominant Ptenm3m4 mouse supports a contribution of PTEN localization and dosage
    to neuronal growth, glial proliferation, and microglial function. Both nuclear and cytoplasmic Pten
    are reduced, so it does not isolate localization from protein abundance. Its behavioral and cellular
    findings do not establish an autism-versus-cancer division in patients or a basis for changing cancer
    surveillance.
  evidence:
  - reference: PMID:24470394
    reference_title: Germline disruption of Pten localization causes enhanced sex-dependent social motivation and increased glial production.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: The homozygous Pten(m3m4) mice have decreased total Pten levels including a specific drop in nuclear Pten and exhibit region-specific increases in brain weight.
    explanation: >-
      The model combines reduced Pten abundance with altered localization and shows regional brain enlargement.
  - reference: PMID:32055008
    reference_title: Cytoplasmic-predominant Pten increases microglial activation and synaptic pruning in a murine model with autism-like phenotype.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: It is important to note that although we observe decreased nuclear Pten in the brain of the Ptenm3m4 mouse, we also observe decreased cytoplasmic Pten
    explanation: >-
      The authors explicitly acknowledge the abundance/localization confound in interpreting the model.
- hypothesis_group_id: pi3k_independent_overgrowth
  hypothesis_label: PI3K-independent overgrowth via focal adhesion signaling
  status: EMERGING
  description: >-
    An edited TTN p.Cys5096Arg HEK293T model showed impaired contact inhibition and altered focal adhesion
    kinase readouts. AKT and ERK phosphorylation decreased, despite lower PTEN protein, so the observations
    do not support canonical AKT hyperactivation in these cells. The proposed TTN-dependent growth mechanism
    remains a candidate based on one functionally tested variant; neither human disease causality nor
    response to mTOR inhibitors was established.
  evidence:
  - reference: PMID:29263846
    reference_title: Germline TTN variants are enriched in PTEN-wildtype Bannayan-Riley-Ruvalcaba syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: suggested lack of contact inhibition in mutant cells
    explanation: >-
      Edited HEK293T cells continued proliferating after confluence; one TTN variant was tested.
  - reference: PMID:29263846
    reference_title: Germline TTN variants are enriched in PTEN-wildtype Bannayan-Riley-Ruvalcaba syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: we note paradoxical downstream readouts of decreased phosphorylation of AKT and ERK1/2
    explanation: >-
      The measured signaling direction differs from canonical PTEN-loss hyperactivation.
pathophysiology:
- name: Germline PTEN Loss of Function
  biological_scale: MOLECULAR
  description: >-
    A heterozygous germline pathogenic PTEN variant is the initiating lesion in PTEN-positive BRRS. Reduced PTEN lipid-phosphatase function impairs PIP3 dephosphorylation. The classic BRRS cohort identified variants in 26 of 43 cases; this mechanism is not demonstrated in every PTEN-negative clinical presentation. Conformance identifies the constitutional tumor-suppressor lesion; it does not establish a requirement for a somatic second hit in every PTEN-associated lesion.

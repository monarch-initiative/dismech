clinical_trials:
- name: NCT02991807
  phase: PHASE_II
  status: COMPLETED
  description: >-
    Randomized parallel-group everolimus versus placebo study in 46 individuals with PTEN-confirmed PHTS.
    Six months of treatment did not improve the primary neurocognitive composite endpoint. Secondary signals
    were exploratory and not adjusted for multiple comparisons; gastrointestinal adverse events were more
    common with everolimus.
  evidence:
  - reference: clinicaltrials:NCT02991807
    reference_title: A Randomized Double-Blind Controlled Trial of Everolimus in Individuals With PTEN Mutations (RAD001XUS257T)
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Investigators are conducting research to evaluate the potential safety and efficacy of RAD001 (everolimus) in this patient population, and the potential neurocognitive benefits from treatment with RAD001 or placebo for a six month period.
    explanation: >-
      The cached registry summary states the intervention and objective; the completed status comes from
      the live registry.
  - reference: PMID:35594551
    reference_title: A randomized controlled trial of everolimus for neurocognitive symptoms in PTEN hamartoma tumor syndrome.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Changes in the primary endpoint between groups from baseline to Month 6 were not apparent"
    explanation: >-
      Recorded as REFUTE for the claim of neurocognitive efficacy. The randomized trial's primary endpoint
      was null, which is why this treatment is curated as investigational rather than established.
  - reference: PMID:35594551
    reference_title: A randomized controlled trial of everolimus for neurocognitive symptoms in PTEN hamartoma tumor syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Gastrointestinal adverse events were more common in the everolimus group"
    explanation: >-
      Documents the principal treatment-emergent toxicity signal in the trial.
  notes: >-
    The registry lists phases I/II and actual enrollment of 46; the publication describes phase II. The
    trial used parallel allocation. NCT02461446 is a separate observational natural-history study, not
    this drug trial.
- name: NCT04094675
  phase: PHASE_II
  status: COMPLETED
  description: >-
    Single-group open-label sirolimus study for colon polyposis in adults with a pathogenic PTEN variant.
    Five participants enrolled and two completed one year. Polyp numbers decreased in the completers without
    a change in polyposis stage. Two participants withdrew because of likely drug-related toxicity, and
    clinical benefit beyond polyp counts remains unproven.
  evidence:
  - reference: clinicaltrials:NCT04094675
    reference_title: Sirolimus for Cowden Syndrome With Colon Polyposis
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: This study is investigating sirolimus and its effect on the number of colon polyps in patients with Cowden syndrome and polyposis over a 1 year period.
    explanation: >-
      The registry summary identifies the indication and planned duration.

name: Bannayan-Riley-Ruvalcaba Syndrome
creation_date: "2026-08-03T00:00:00Z"
description: >-
  Bannayan-Riley-Ruvalcaba syndrome (BRRS) is the congenital, pediatric-onset
  presentation within the PTEN hamartoma tumor syndrome (PHTS) spectrum, caused by
  heterozygous germline loss-of-function variants in the tumor suppressor PTEN.
  Loss of PTEN lipid-phosphatase activity removes the brake on
  phosphatidylinositol-3,4,5-trisphosphate signaling, driving constitutive
  PI3K/AKT/mTOR activation and disorganized overgrowth of native tissue.
  The clinical hallmarks are macrocephaly, hamartomatous intestinal polyposis,
  multiple lipomas, and pigmented macules of the glans penis, usually accompanied by
  developmental delay, hypotonia, and autism spectrum features. Because BRRS and
  Cowden syndrome are allelic and can co-occur within a single family carrying one
  PTEN variant, PTEN-positive BRRS is now managed with the same lifelong cancer
  surveillance as Cowden syndrome rather than as a benign childhood overgrowth
  syndrome.
category: Mendelian

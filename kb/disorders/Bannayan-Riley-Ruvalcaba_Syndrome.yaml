    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Surveillance for breast cancer with MRI should probably start at age 25.
    explanation: >-
      Recommendation 3 gives the MRI starting age.
  - reference: url:https://www.nature.com/articles/s41431-026-02181-z
    reference_title: "ERN GENTURIS cancer surveillance guideline for individuals with PTEN hamartoma tumour syndrome (PHTS) | European Journal of Human Genetics"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: In addition, mammography every 1–2 years can be considered, preferably from the age of 40 years
    explanation: >-
      The full guideline text describes mammography in addition to annual MRI and allows alignment with
      national surveillance guidance.
  - reference: url:https://www.nature.com/articles/s41431-026-02181-z/tables/3
    reference_title: "Table 3 Guideline recommendations. | European Journal of Human Genetics"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Surveillance for thyroid cancer should probably start between 10 and 18 years of age.
    explanation: >-
      Recommendation 8 gives an age range, rather than a universal starting age.
  - reference: url:https://www.nature.com/articles/s41431-026-02181-z/tables/3
    reference_title: "Table 3 Guideline recommendations. | European Journal of Human Genetics"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Individuals should be offered surveillance for thyroid cancer annually initially. Individuals with two ultrasound examinations with no suspicious findings should probably be re-scanned at an increased interval of two to three years as clinically indicated.
    explanation: >-
      Recommendation 9 distinguishes initial annual imaging from longer intervals after normal scans.
  - reference: url:https://www.nature.com/articles/s41431-026-02181-z/tables/3
    reference_title: "Table 3 Guideline recommendations. | European Journal of Human Genetics"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: If surveillance for endometrial cancer is offered, it should probably start at 35-40 years.
    explanation: >-
      The European guideline differs from the 2025 international consensus on endometrial surveillance.
  - reference: url:https://www.nature.com/articles/s41431-026-02181-z/tables/3
    reference_title: "Table 3 Guideline recommendations. | European Journal of Human Genetics"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: If surveillance for endometrial cancer is offered, it should probably be via transvaginal ultrasonography done at least annually. Endometrial biopsy can be considered.
    explanation: >-
      Recommendation 12 identifies the proposed modality and interval.
  - reference: url:https://www.nature.com/articles/s41431-026-02181-z/tables/3
    reference_title: "Table 3 Guideline recommendations. | European Journal of Human Genetics"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Individuals should be offered a baseline imaging exam at age 35–40 years for renal cell carcinoma (RCC).
    explanation: >-
      Recommendation 14 specifies baseline renal imaging.
  - reference: url:https://www.nature.com/articles/s41431-026-02181-z/tables/3
    reference_title: "Table 3 Guideline recommendations. | European Journal of Human Genetics"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Where renal baseline imaging is normal, further regular surveillance is not recommended, just follow-up based on signs and symptoms.
    explanation: >-
      The renal footnote differs materially from the 2025 consensus suggestion of repeated imaging.
  - reference: url:https://www.nature.com/articles/s41431-026-02181-z/tables/3
    reference_title: "Table 3 Guideline recommendations. | European Journal of Human Genetics"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Baseline colonoscopy should be undertaken at 35–40 years to assess polyp load, preferably in an expert centre. Interval of monitoring is guided by the number, size and pathology of resected polyps.
    explanation: >-
      Recommendation 15 bases subsequent colonoscopy on the findings.
  - reference: url:https://www.nature.com/articles/s41431-026-02181-z/tables/3
    reference_title: "Table 3 Guideline recommendations. | European Journal of Human Genetics"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: In individuals with only hamartomas or no polyps at baseline colonoscopy, colorectal cancer surveillance may follow general population guidelines. However, a repeat colonoscopy after 5 to 10 years can be considered.
    explanation: >-
      Recommendation 16 distinguishes hamartomas from higher-risk polyp findings.
  - reference: url:https://www.nature.com/articles/s41431-026-02181-z/tables/3
    reference_title: "Table 3 Guideline recommendations. | European Journal of Human Genetics"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS

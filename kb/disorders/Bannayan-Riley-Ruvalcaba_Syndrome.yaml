  species: Mus musculus
  genotype: Ptenm3m4/m3m4; heterozygous and wild-type littermate comparisons
  background: CD-1 background after backcrossing
  description: >-
    A germline knock-in model with cytoplasmic-predominant Pten and reduced total protein. Homozygotes
    show region-specific brain enlargement, neuronal soma hypertrophy, increased NG2-cell proliferation
    and glial accumulation, astrogliosis, and microglial activation. Behavioral findings include sex-dependent
    increased social motivation and poor balance with preserved recognition memory. This model does not
    isolate nuclear localization from protein abundance and is not a human BRRS genotype.
  publication: PMID:24470394

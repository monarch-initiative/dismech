    snippet: "BRRS is a congenital disorder characterized by macrocephaly, intestinal hamartomatous polyposis, lipomas, and pigmented macules of the glans penis."
    explanation: >-
      GeneReviews names macrocephaly as a defining feature of BRRS.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:28526761
    reference_title: A retrospective chart review of the features of PTEN hamartoma tumour syndrome in children.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Macrocephaly (average head circumference of + 5.7  SD) with developmental delay, ID and/or ASD were the most common presenting signs/symptoms (66 %)."
    explanation: >-
      Supports the disease-phenotype association and quantifies the severity of macrocephaly in pediatric
      PHTS (mean head circumference +5.7 SD). Note this 66% figure is a composite presenting-symptom statistic
      (macrocephaly together with developmental delay, ID and/or ASD), not a macrocephaly frequency, so
      it is not used to set the frequency band.
  - reference: PMID:39256443
    reference_title: A systematic review of Bannayan - Riley - Ruvalcaba syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A total of 83 pediatric patients with BRRS were identified. The most common clinical findings were macrocephaly (77%) and developmental disorders (63%)."
    explanation: >-
      The patient-level 77% estimate supports FREQUENT. The same review also reports macrocephaly in 32
      of 33 publications, but publication counts cannot be used as patient frequencies. Incomplete case
      reporting and publication selection limit generalization of the patient-level estimate.

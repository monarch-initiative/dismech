- category: Neurobehavioral
  name: Autism
  description: >-
    Autism diagnoses and autism spectrum characteristics are reported in BRRS and the wider PTEN spectrum.
    A meta-analysis estimated ASD characteristics in 25% across heterogeneous PTEN-related cohorts, some
    including clinically diagnosed Cowden/BRRS without an identified PTEN variant. This is not a BRRS-specific
    prevalence of formally diagnosed autism. Ascertainment, possible cohort overlap, assessment differences,

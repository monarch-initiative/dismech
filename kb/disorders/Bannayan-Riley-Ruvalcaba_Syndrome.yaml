- name: PTEN Hamartoma of Soft Tissue Formation
  biological_scale: TISSUE
  description: >-
    PHOST is a distinctive, unencapsulated mesenchymal lesion found in PHTS, including BRRS presentations.
    Mature adipose and fibrous or myxoid tissue are intermixed with abnormal veins, thick-walled arteries,
    small vessels, and occasional arteriovenous communications. It commonly infiltrates muscle, fascia,
    and subcutis and may cause pain and swelling. It is one of several PHTS-associated vascular/connective
    tissue lesions, not a synonym for all vascular malformations.

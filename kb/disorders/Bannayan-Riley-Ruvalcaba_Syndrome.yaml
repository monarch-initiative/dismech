- name: Lifelong Multiorgan Cancer Predisposition
  biological_scale: ORGANISM
  description: >-
    A germline pathogenic PTEN variant confers multiorgan cancer predisposition. PTEN-positive BRRS is
    managed within the PHTS spectrum, but precise BRRS-ascertained cancer incidence has not been established.
    Tumor development can involve additional somatic events; universal loss of the second PTEN allele
    is not assumed. PHTS risk estimates do not establish risks for PTEN-negative clinical BRRS.
  evidence:
  - reference: PMID:10400993
    reference_title: PTEN mutation spectrum and genotype-phenotype correlations in Bannayan-Riley-Ruvalcaba syndrome suggest a single entity with Cowden syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thus, PTEN mutation-positive CS and BRR may be different presentations of a single syndrome and, hence, both should receive equal attention with respect to cancer surveillance."
    explanation: >-
      The study supports shared surveillance for molecularly confirmed PTEN-positive BRRS and Cowden syndrome,
      not a measured equality of their cancer incidence.

  - reference: PMID:24470394
    reference_title: Germline disruption of Pten localization causes enhanced sex-dependent social motivation and increased glial production.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: The homozygous Pten(m3m4) mice have decreased total Pten levels including a specific drop in nuclear Pten and exhibit region-specific increases in brain weight.
    explanation: >-
      The model combines reduced Pten abundance with altered localization and shows regional brain enlargement.
  - reference: PMID:24470394
    reference_title: Germline disruption of Pten localization causes enhanced sex-dependent social motivation and increased glial production.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: The cytoplasm-predominant protein caused cellular hypertrophy limited to the soma and led to increased NG2 cell proliferation and accumulation of glia.
    explanation: >-
      Homozygous Ptenm3m4 mice showed neuronal soma hypertrophy and increased glial production. These
      findings do not demonstrate generalized neuronal progenitor proliferation in human BRRS.
  - reference: PMID:24470394
    reference_title: Germline disruption of Pten localization causes enhanced sex-dependent social motivation and increased glial production.

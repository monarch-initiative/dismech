  cell_source: Human 293 cells and purified recombinant PTEN
  description: >-
    Recombinant protein assays establish PIP3 dephosphorylation at position 3. Transfection of catalytically
    inactive PTEN C124S increases cellular PIP3, while PTEN overexpression reduces insulin-induced PIP3
    without changing PI3K activation. These experiments establish biochemical function rather than clinical
    pathogenicity of a BRRS allele.

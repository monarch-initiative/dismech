    explanation: >-
      Recommendation 17 gives baseline skin assessment without assuming annual lifelong dermatologic screening.
- name: Gastrointestinal Polyp Management
  description: >-
    Symptomatic gastrointestinal polyps require evaluation and endoscopic management according to size,
    histology, and complications. Childhood bleeding, anemia, obstruction, or intussusception may warrant
    assessment before routine adult cancer-screening ages. Severe or recurrent disease can require surgery.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: endoscopic polypectomy
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  evidence:
  - reference: PMID:39256443
    reference_title: A systematic review of Bannayan - Riley - Ruvalcaba syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Polypectomies of hamartomatous polyps were also frequent, with two cases of proctocolectomy and subtotal colectomy due to severe symptom burden and recurrence
    explanation: >-
      The BRRS review records endoscopic polyp removal and surgery for severe recurrent disease.
  - reference: PMID:39256443
    reference_title: A systematic review of Bannayan - Riley - Ruvalcaba syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: BRRS patients with polyps may present with abdominal pain, hematochezia, anemia, invagination, constipation, or diarrhea
    explanation: >-
      These complications motivate symptom-directed care independently of routine screening ages.
- name: Symptomatic Management of Hamartomatous Lesions
  description: >-
    Lipomas, vascular lesions, and other benign manifestations are treated the same way
    as their sporadic counterparts, with excision reserved for lesions causing pain,
    functional impairment, deformity, or diagnostic uncertainty rather than performed
    prophylactically.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical excision
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  evidence:
  - reference: PMID:20301661
    reference_title: PTEN Hamartoma Tumor Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Treatment for the benign and malignant manifestations of PHTS is the same as for their sporadic counterparts."
    explanation: >-
      GeneReviews establishes the principle of treating manifestations as for sporadic disease.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:20301661
    reference_title: PTEN Hamartoma Tumor Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "cutaneous lesions should be excised only if malignancy is suspected or symptoms (e.g., pain, deformity, increased scarring) are significant."
    explanation: >-
      GeneReviews supports restricting excision to symptomatic or suspicious lesions.
    quote_role: REVIEW_SYNTHESIS
- name: Developmental and Behavioral Support
  description: >-
    Because developmental delay, intellectual disability, and autism spectrum
    characteristics are core to the BRRS presentation, early developmental assessment and
    intervention (speech, motor, and educational support) is a management priority
    independent of the cancer-surveillance agenda.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: rehabilitation
    term:
      id: NCIT:C15315
      label: Rehabilitation
  evidence:
  - reference: PMID:28526761
    reference_title: A retrospective chart review of the features of PTEN hamartoma tumour syndrome in children.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Early paediatric diagnosis is important for institution of medical and developmental surveillance as well as for testing other at- risk family members."
    explanation: >-
      Supports developmental surveillance and support as an explicit goal of early pediatric diagnosis.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1488/
    reference_title: "PTEN Hamartoma Tumor Syndrome - GeneReviews® - NCBI Bookshelf"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Referral to an early intervention program is recommended for access to occupational, physical, speech, and feeding therapy as well as infant mental health services, special educators, and sensory impairment specialists.
    explanation: >-
      The updated GeneReviews chapter specifies multidisciplinary early intervention for developmental
      difficulties.
- name: mTOR Inhibitor Therapy
  description: >-
    Everolimus targets the mTOR overactivity that follows PTEN loss, giving a direct mechanistic rationale.
    A 6-month phase II randomized placebo-controlled trial in 46 individuals with PHTS (eligible ages
    5 to 45 years) found the drug tolerable but did not meet its primary neurocognitive endpoint, with
    gastrointestinal adverse events more common on treatment. mTOR inhibition therefore remains investigational
    for the neurodevelopmental features of BRRS and is not routine care.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: mTOR inhibitor pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: everolimus
      term:
        id: CHEBI:68478
        label: everolimus
  target_mechanisms:
  - target: mTOR Overactivity
    treatment_effect: INHIBITS
    description: >-
      Pharmacologic inhibition of mTOR is the molecular target; clinical benefit for each indication requires
      separate evidence.
  evidence:
  - reference: PMID:35594551
    reference_title: A randomized controlled trial of everolimus for neurocognitive symptoms in PTEN hamartoma tumor syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PTEN hamartoma tumor syndrome (PHTS) is a complex neurodevelopmental disorder characterized by mechanistic target of rapamycin (mTOR) overactivity."
    explanation: >-
      Establishes the mechanistic rationale for mTOR inhibition in PHTS.
  - reference: PMID:35594551

name: Bannayan-Riley-Ruvalcaba Syndrome
creation_date: "2026-08-03T00:00:00Z"
description: >-
  Bannayan-Riley-Ruvalcaba syndrome (BRRS) is a congenital overgrowth phenotype characterized by macrocephaly,
  hamartomatous intestinal polyposis, lipomas, vascular lesions, and pigmented genital macules, with variable
  developmental delay, hypotonia, and autism spectrum characteristics. Individuals with a heterozygous
  germline pathogenic PTEN variant have PTEN hamartoma tumor syndrome (PHTS); clinically diagnosed BRRS
  also includes individuals without an identified PTEN variant. Loss of PTEN lipid-phosphatase activity
  impairs PIP3 dephosphorylation and promotes growth signaling through AKT and mTOR. PTEN-positive BRRS
  and Cowden syndrome can occur within one family and share PHTS cancer surveillance. Cancer risks in
  PTEN-negative clinical BRRS remain uncertain.
category: Mendelian

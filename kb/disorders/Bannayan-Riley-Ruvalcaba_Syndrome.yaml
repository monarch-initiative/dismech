histopathology:
- name: PTEN hamartoma of soft tissue
  context: Resected PHOST lesions in the PHTS spectrum
  description: >-
    Unencapsulated lesions contain mature adipose and dense or myxoid fibrous tissue mixed with abnormal
    venous channels, tortuous thick-walled arteries, and small vessels. Some contain arteriovenous connections,
    lymphoid follicles, metaplastic bone, or hypertrophic nerves. Histologic recognition warrants evaluation
    for PHTS, but does not independently establish a germline PTEN variant.
  evidence:
  - reference: PMID:22446940
    reference_title: "PTEN hamartoma of soft tissue: a distinctive lesion in PTEN syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: a variable admixture of mature adipocytic and dense and/or myxoid fibrous tissues
    explanation: >-
      The selected pathology series defines the nonvascular stromal components.
  - reference: PMID:22446940
    reference_title: "PTEN hamartoma of soft tissue: a distinctive lesion in PTEN syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: tortuous, thick-walled arteries with concentric muscular hyperplasia and relatively small lumens
    explanation: >-
      This describes characteristic vascular architecture in PHOST.
  - reference: PMID:22446940
    reference_title: "PTEN hamartoma of soft tissue: a distinctive lesion in PTEN syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Histopathologic recognition of PHOST should prompt a detailed clinical evaluation, including family history, as well as possible genetic testing for a PTEN mutation.
    explanation: >-
      The authors frame PHOST as a diagnostic clue requiring clinical and molecular evaluation.
animal_models:

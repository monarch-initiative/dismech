prevalence:
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: UNKNOWN
  notes: >-
    No reliable population-level prevalence estimate exists for BRRS specifically.
    Published PHTS epidemiology is dominated by adult, cancer-ascertained Cowden
    syndrome cohorts, and the childhood-onset BRRS presentation is systematically
    under-represented, so no numeric rate is asserted here.
  evidence:
  - reference: PMID:33140411
    reference_title: A review on age-related cancer risks in PTEN hamartoma tumor syndrome.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Although these estimates provide guidance for clinical care, discrepancies between studies, sample sizes, retrospective designs, strongly ascertained cases, and lack of pediatric research emphasizes that data should be interpreted with great caution."
    explanation: >-
      Supports the stated epidemiological uncertainty: this systematic review of PHTS
      cohorts explicitly flags ascertainment bias and absent pediatric data, which is why
      no numeric BRRS prevalence is recorded.
inheritance:
- name: Autosomal dominant inheritance
  description: >-
    BRRS is inherited in an autosomal dominant manner as part of PHTS. Each child of an
    affected individual has a 50% chance of inheriting the pathogenic PTEN variant.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:20301661
    reference_title: PTEN Hamartoma Tumor Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PHTS is inherited in an autosomal dominant manner."
    explanation: GeneReviews states the autosomal dominant inheritance of PHTS, which subsumes BRRS.
  - reference: PMID:20301661
    reference_title: PTEN Hamartoma Tumor Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Each child of an affected individual has a 50% chance of inheriting the pathogenic variant and developing PHTS."
    explanation: GeneReviews gives the 50% transmission risk implied by autosomal dominant inheritance.
  - reference: PMID:39256443
    reference_title: A systematic review of Bannayan - Riley - Ruvalcaba syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PTEN pathogenic variants in BRRS cases usually demonstrate autosomal dominant inheritance; nevertheless, it is estimated that up to 48% of pathogenic variants can be de novo"
    explanation: >-
      Confirms autosomal dominant inheritance in BRRS specifically and adds the clinically
      important point that up to 48% of variants arise de novo, so an unremarkable family
      history does not argue against the diagnosis.
has_subtypes:
- name: 10q23 deletion
  display_name: 10q23 contiguous-gene deletion (PTEN + BMPR1A)
  description: >-
    A contiguous-gene deletion at 10q23 removing both PTEN and BMPR1A, combining BRRS
    features with juvenile polyposis. It was originally described in infantile juvenile
    polyposis with a severe course, and was hypothesized to reflect a synergistic effect of
    losing both tumor suppressors. Subsequent series found the phenotype is variable rather
    than uniformly severe, and severity does not track deletion size. Recognizing this
    subtype matters practically: it is missed by sequencing alone and requires
    deletion/duplication testing or chromosomal microarray, and it explains the otherwise
    puzzling overlap with juvenile polyposis in the differential.
  evidence:
  - reference: PMID:18510548
    reference_title: Variable phenotypes associated with 10q23 microdeletions involving the PTEN and BMPR1A genes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Recently, 10q23 microdeletions involving the PTEN and BMPR1A genes were found in four patients with infantile juvenile polyposis. It was hypothesized that a combined and synergistic effect of the deletion of both genes would explain the condition."
    explanation: Establishes the contiguous-deletion entity and the original two-gene synergy hypothesis.
  - reference: PMID:18510548
    reference_title: Variable phenotypes associated with 10q23 microdeletions involving the PTEN and BMPR1A genes.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients had macrocephaly, dysmorphic features, retardation and congenital abnormalities."
    explanation: >-
      Documents the BRRS-like core (macrocephaly, developmental delay) in deletion carriers.
      PARTIAL because this is a four-patient series.
  - reference: PMID:18510548
    reference_title: Variable phenotypes associated with 10q23 microdeletions involving the PTEN and BMPR1A genes.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "No clear correlation was found between ages at onset or severity of gastrointestinal symptoms and the sizes of the deletions."
    explanation: >-
      Recorded as REFUTE against the simple dose/size-severity model: deletion size does not
      predict severity, which is why this subtype is described as variable rather than
      uniformly severe.
mechanistic_hypotheses:
- hypothesis_group_id: canonical_pi3k_akt_mtor
  hypothesis_label: Canonical PI3K-AKT-mTOR dose-sensitive overgrowth
  status: CANONICAL
  description: >-
    The default model: PTEN haploinsufficiency raises PIP3, activating PI3K/AKT/mTORC1 and
    driving growth, survival, and proliferation across lineages. Every BRRS manifestation
    in this entry is modeled as downstream of this chain unless otherwise grouped.
  evidence:
  - reference: PMID:35594551
    reference_title: A randomized controlled trial of everolimus for neurocognitive symptoms in PTEN hamartoma tumor syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PTEN hamartoma tumor syndrome (PHTS) is a complex neurodevelopmental disorder characterized by mechanistic target of rapamycin (mTOR) overactivity."
    explanation: States mTOR overactivity as the accepted molecular characterization of PHTS.
- hypothesis_group_id: pten_nuclear_localization_split
  hypothesis_label: Subcellular localization determines the autism-versus-cancer divergence
  status: EMERGING
  description: >-
    Proposes that WHERE PTEN is, not only how much of it there is, decides which arm of the
    phenotype a carrier expresses. PTEN shuttles to the nucleus, and variants that deplete
    nuclear PTEN while sparing total protein are proposed to segregate with the
    ASD/macrocephaly presentation rather than the cancer presentation. If correct, this
    would explain why some PTEN carriers present as neurodevelopmental BRRS and others as
    adult-onset Cowden cancer risk despite comparable PTEN dosage, and it predicts that
    localization, not dosage, should stratify surveillance. Evidence is currently confined
    to the cytoplasmic-predominant Pten mouse; no human genotype-localization-phenotype
    series exists, which is why this is EMERGING rather than ALTERNATIVE.
  evidence:
  - reference: PMID:32055008
    reference_title: Cytoplasmic-predominant Pten increases microglial activation and synaptic pruning in a murine model with autism-like phenotype.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "To explore the importance of nuclear PTEN in the development of ASD and macrocephaly, we previously generated a mouse model with predominantly cytoplasmic localization of Pten"
    explanation: >-
      States the localization hypothesis and the model built to test it. PARTIAL and
      MODEL_ORGANISM because the human translational claim is untested.
  - reference: PMID:24470394
    reference_title: Germline disruption of Pten localization causes enhanced sex-dependent social motivation and increased glial production.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "PTEN Hamartoma Tumor Syndrome (PHTS) is an autosomal-dominant genetic condition underlying a subset of autism spectrum disorder (ASD) with macrocephaly."
    explanation: >-
      Companion model study establishing that disrupting Pten localization alone produces
      behavioral and glial phenotypes. PARTIAL/MODEL_ORGANISM for the same reason.
- hypothesis_group_id: pi3k_independent_overgrowth
  hypothesis_label: PI3K-independent overgrowth via focal adhesion signaling
  status: EMERGING
  description: >-
    Proposes a route to the same overgrowth output that does not pass through PIP3/AKT. In
    PTEN-wildtype classic BRRS, germline TTN variants are enriched, and an edited I-band
    variant produced loss of contact inhibition associated with focal adhesion kinase
    changes rather than increased AKT signaling. If real, this would mean mutation-negative
    BRRS is not simply undetected PTEN disease and may not respond to mTOR-directed
    therapy the way PTEN-positive disease is presumed to.
  evidence:
  - reference: PMID:29263846
    reference_title: Germline TTN variants are enriched in PTEN-wildtype Bannayan-Riley-Ruvalcaba syndrome.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "suggested lack of contact inhibition in mutant cells"
    explanation: >-
      The functional observation underpinning this hypothesis. PARTIAL/IN_VITRO: an edited
      cell line, not a demonstration in human tissue.
pathophysiology:
- name: Germline PTEN Loss of Function
  biological_scale: MOLECULAR
  description: >-
    A heterozygous germline loss-of-function variant in PTEN at chromosome 10q23 is the
    initiating lesion. PTEN encodes a dual-specificity phosphatase whose principal
    physiological substrate is the membrane phospholipid
    phosphatidylinositol-3,4,5-trisphosphate. Germline PTEN variants are identified in
    roughly 60% of clinically diagnosed BRRS cases, so a negative test does not exclude
    the clinical diagnosis.
  genes:
  - preferred_term: PTEN
    term:
      id: hgnc:9588
      label: PTEN
  molecular_functions:
  - preferred_term: PIP3 3-phosphatase activity
    term:
      id: GO:0016314
      label: phosphatidylinositol-3,4,5-trisphosphate 3-phosphatase activity
    modifier: DECREASED
  evidence:
  - reference: PMID:10400993
    reference_title: PTEN mutation spectrum and genotype-phenotype correlations in Bannayan-Riley-Ruvalcaba syndrome suggest a single entity with Cowden syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PTEN maps to 10q23 and encodes a dual specificity phosphatase, a substrate of which is phosphatidylinositol 3,4,5-triphosphate, a phospholipid in the phosphatidylinositol 3-kinase pathway."
    explanation: >-
      Establishes the gene location and the molecular identity of PTEN as the phosphatase
      acting on PIP3, the substrate whose dephosphorylation is lost in BRRS.
  - reference: PMID:10400993
    reference_title: PTEN mutation spectrum and genotype-phenotype correlations in Bannayan-Riley-Ruvalcaba syndrome suggest a single entity with Cowden syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations were identified in 26 of 43 (60%) BRR cases."
    explanation: >-
      Quantifies the germline PTEN detection rate in a dedicated BRRS cohort, supporting
      both the causal gene assignment and the incomplete molecular yield.
  - reference: PMID:9352843
    reference_title: Localization of the Bannayan-Riley-Ruvalcaba syndrome gene to chromosome 10q23.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The three hamartomatous polyposis syndromes, Bannayan-Riley-Ruvalcaba syndrome, juvenile polyposis coli, and Cowden disease, may share the same genetic defect because of their common map localization to chromosome 10q23."
    explanation: >-
      The original positional mapping study that localized the BRRS locus to 10q23, the
      interval subsequently shown to contain PTEN.
  downstream:
  - target: PIP3 Accumulation and PI3K-AKT-mTOR Hyperactivation
    causal_link_type: DIRECT
    description: >-
      Loss of PTEN lipid-phosphatase activity leaves PIP3 undephosphorylated, directly
      releasing downstream PI3K/AKT/mTOR signaling from negative regulation.
    evidence:
    - reference: PMID:10400993
      reference_title: PTEN mutation spectrum and genotype-phenotype correlations in Bannayan-Riley-Ruvalcaba syndrome suggest a single entity with Cowden syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "PTEN maps to 10q23 and encodes a dual specificity phosphatase, a substrate of which is phosphatidylinositol 3,4,5-triphosphate, a phospholipid in the phosphatidylinositol 3-kinase pathway."
      explanation: >-
        Supports the edge specifically: PTEN's substrate is PIP3 within the PI3K pathway, so
        losing PTEN function is what releases that pathway.
- name: PIP3 Accumulation and PI3K-AKT-mTOR Hyperactivation
  biological_scale: MOLECULAR
  description: >-
    With PTEN-mediated dephosphorylation lost, PIP3 accumulates at the plasma membrane
    and recruits AKT, producing constitutive PI3K/AKT/mTOR signaling. The resulting
    mTOR overactivity increases cell growth, protein synthesis, and survival signaling
    across many lineages and is the shared molecular engine of every downstream BRRS
    manifestation. This node is also the pharmacological rationale for mTOR-inhibitor
    trials in PHTS.
  biological_processes:
  - preferred_term: PI3K/AKT signaling
    term:
      id: GO:0043491
      label: phosphatidylinositol 3-kinase/protein kinase B signal transduction
    modifier: INCREASED
  - preferred_term: mTOR signaling
    term:
      id: GO:0031929
      label: TOR signaling
    modifier: INCREASED
  evidence:
  - reference: PMID:35594551
    reference_title: A randomized controlled trial of everolimus for neurocognitive symptoms in PTEN hamartoma tumor syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PTEN hamartoma tumor syndrome (PHTS) is a complex neurodevelopmental disorder characterized by mechanistic target of rapamycin (mTOR) overactivity."
    explanation: >-
      States mTOR overactivity as the defining molecular consequence of germline PTEN loss
      in PHTS, the mechanism this node models.
  downstream:
  - target: Hamartomatous Tissue Overgrowth
    causal_link_type: DIRECT
    description: >-
      Constitutive growth and survival signaling drives disorganized proliferation of
      native tissue elements, producing hamartomas. This edge carries two competing
      explanations: the canonical PIP3/AKT/mTOR route, and an emerging PI3K-independent
      route via focal adhesion signaling proposed for PTEN-wildtype BRRS.
    hypothesis_groups:
    - canonical_pi3k_akt_mtor
    - pi3k_independent_overgrowth
    evidence:
    - reference: PMID:39256443
      reference_title: A systematic review of Bannayan - Riley - Ruvalcaba syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Bannayan-Riley-Ruvalcaba syndrome (BRRS) is a rare overgrowth condition caused by a pathogenic variant in the phosphatase and tensin homolog (PTEN) gene and belongs to a group of disorders called PTEN hamartoma tumor syndrome (PHTS)."
      explanation: >-
        Supports the edge by identifying BRRS as an overgrowth/hamartoma condition whose
        cause is the PTEN lesion feeding this signaling node.
  - target: Neural Progenitor Overgrowth and Brain Enlargement
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      mTORC1-driven increases in cell size and progenitor output enlarge the brain.
    hypothesis_groups:
    - canonical_pi3k_akt_mtor
  - target: Synaptic and Circuit Development Dysregulation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      The same signaling excess perturbs synaptic and circuit development, a functional
      output separable from brain size.
    hypothesis_groups:
    - canonical_pi3k_akt_mtor
    - pten_nuclear_localization_split
    evidence:
    - reference: PMID:35594551
      reference_title: A randomized controlled trial of everolimus for neurocognitive symptoms in PTEN hamartoma tumor syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "PTEN hamartoma tumor syndrome (PHTS) is a complex neurodevelopmental disorder characterized by mechanistic target of rapamycin (mTOR) overactivity."
      explanation: >-
        Supports the edge by tying the neurodevelopmental phenotype of PHTS directly to mTOR
        overactivity, the upstream node here.
  - target: Lifelong Multiorgan Cancer Predisposition
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Sustained proliferative and antiapoptotic signaling in a germline-haploinsufficient
      background permits second-hit-dependent malignant transformation over decades.
    hypothesis_groups:
    - canonical_pi3k_akt_mtor
    - pten_nuclear_localization_split
    evidence:
    - reference: PMID:33140411
      reference_title: A review on age-related cancer risks in PTEN hamartoma tumor syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Patients with PTEN hamartoma tumor syndrome (PHTS, comprising Cowden, Bannayan-Riley-Ruvalcaba, and Proteus-like syndromes) are at increased risk of developing cancer due to pathogenic PTEN germline variants."
      explanation: >-
        Supports the edge from germline-PTEN-driven signaling loss to multiorgan cancer risk,
        with BRRS named within the affected group.
  - target: Penile freckling
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Genital lentiginosis is a highly specific BRRS sign attributed to PTEN-driven
      melanocytic dysregulation, but the intermediate steps linking PI3K/AKT/mTOR
      activation to focal glans pigmentation are not established.
    evidence:
    - reference: PMID:10400993
      reference_title: PTEN mutation spectrum and genotype-phenotype correlations in Bannayan-Riley-Ruvalcaba syndrome suggest a single entity with Cowden syndrome.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Pigmented macules of the glans penis, delayed motor development and neonatal or infant onset are noted only in BRR."
      explanation: >-
        Establishes that the sign occurs in BRRS specifically. Recorded as PARTIAL because it
        supports the association only, not the mechanistic route from PTEN loss to focal
        pigmentation, which is why the edge is INDIRECT_UNKNOWN_INTERMEDIATES.
- name: Hamartomatous Tissue Overgrowth
  biological_scale: TISSUE
  description: >-
    Unrestrained growth signaling produces hamartomas: benign, disorganized overgrowths
    composed of cell types native to the tissue of origin. In BRRS this is expressed
    predominantly as hamartomatous polyps distributed throughout the gastrointestinal
    tract, subcutaneous and visceral lipomas, and vascular lesions, and it is the
    substrate for the syndrome's structural burden in childhood.
  cell_types:
  - preferred_term: adipocyte
    term:
      id: CL:0000136
      label: adipocyte
  - preferred_term: intestinal epithelial cell
    term:
      id: CL:0002563
      label: intestinal epithelial cell
  - preferred_term: endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  biological_processes:
  - preferred_term: cell proliferation
    term:
      id: GO:0008283
      label: cell population proliferation
    modifier: INCREASED
  evidence:
  - reference: PMID:9352843
    reference_title: Localization of the Bannayan-Riley-Ruvalcaba syndrome gene to chromosome 10q23.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bannayan-Riley-Ruvalcaba syndrome is a congenital syndrome with characteristic features of macrocephaly, cognitive and motor dysfunction, subcutaneous and visceral lipomas and hemangiomas, and intestinal juvenile polyposis."
    explanation: >-
      Enumerates the hamartomatous tissue lesions (lipomas, hemangiomas, intestinal
      polyposis) that constitute this overgrowth node in BRRS.
  - reference: PMID:20301661
    reference_title: PTEN Hamartoma Tumor Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "BRRS is a congenital disorder characterized by macrocephaly, intestinal hamartomatous polyposis, lipomas, and pigmented macules of the glans penis."
    explanation: >-
      The GeneReviews definition of BRRS, confirming hamartomatous polyposis and lipomas as
      defining tissue-level manifestations.
  downstream:
  - target: Hamartomatous polyposis
    causal_link_type: DIRECT
  - target: Lipoma
    causal_link_type: DIRECT
  - target: Hemangioma
    causal_link_type: DIRECT
  - target: PTEN Hamartoma of Soft Tissue Formation
    causal_link_type: DIRECT
    description: >-
      The overgrowth program produces the distinctive intramuscular mesenchymal lesion of
      PHTS, combining ectopic fat with malformed fast-flow vessels.
- name: PTEN Hamartoma of Soft Tissue Formation
  biological_scale: TISSUE
  description: >-
    The distal, lesion-level node of the overgrowth arm. PTEN hamartoma of soft tissue
    (PHOST) is a distinctive, predominantly intramuscular lesion of PHTS: a disorganized
    overgrowth of mesenchymal elements combining ectopic adipose tissue, fibrous tissue,
    and malformed fast-flow vascular channels. It is radiologically mistaken for a simple
    arteriovenous malformation but is histologically distinct, and it is the lesion that
    drives pain, swelling, and functional loss in BRRS. It is the specific target of
    sirolimus therapy in this entry.
  cell_types:
  - preferred_term: adipocyte
    term:
      id: CL:0000136
      label: adipocyte
  - preferred_term: endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  evidence:
  - reference: PMID:22446940
    reference_title: "PTEN hamartoma of soft tissue: a distinctive lesion in PTEN syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We designate this disorganized overgrowth of essentially mesenchymal elements as PTEN hamartoma of soft tissue."
    explanation: >-
      The defining pathological description of PHOST, establishing this node as a
      distinct lesion entity rather than a generic vascular malformation.
  - reference: PMID:22446940
    reference_title: "PTEN hamartoma of soft tissue: a distinctive lesion in PTEN syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Lesions manifested by 15 years of age, normally with pain and swelling, and were most often located in the lower extremity."
    explanation: >-
      Establishes the pediatric onset and the clinical burden (pain, swelling) that makes
      this node the target of lesion-directed therapy in BRRS.
  - reference: PMID:17526801
    reference_title: "The spectrum of vascular anomalies in patients with PTEN mutations: implications for diagnosis and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Vascular anomalies were found in 14/26 (54%) of patients: 8/14 (57%) had multiple lesions and 11/13 (85%) who had cross-sectional imaging had intramuscular vascular lesions."
    explanation: >-
      Quantifies frequency and the characteristic intramuscular location in a PTEN-mutation
      cohort.
  - reference: PMID:17526801
    reference_title: "The spectrum of vascular anomalies in patients with PTEN mutations: implications for diagnosis and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Vascular anomalies in patients with a PTEN mutation are typically multifocal intramuscular combinations of fast-flow channels and ectopic fat."
    explanation: >-
      The combined vascular-plus-adipose composition that distinguishes PHOST from an
      ordinary arteriovenous malformation, and the basis for the cell types on this node.
  downstream:
  - target: Arteriovenous malformation
    causal_link_type: DIRECT
    description: >-
      PHOST is the lesion most often reported clinically as an arteriovenous malformation
      in BRRS, which is the phenotype term this entry binds.
- name: Neural Progenitor Overgrowth and Brain Enlargement
  biological_scale: TISSUE
  description: >-
    The structural arm of PTEN loss in the nervous system. PTEN is a strong negative
    regulator of growth in neural lineages, so mTORC1-driven increases in cell size and
    progenitor output enlarge the brain. Clinically this is marked macrocephaly, typically
    evident from infancy and non-progressive after early childhood, and it is
    megalencephaly rather than hydrocephalus.
  cell_types:
  - preferred_term: neural progenitor cell
    term:
      id: CL:0011020
      label: neural progenitor cell
  biological_processes:
  - preferred_term: neurogenesis
    term:
      id: GO:0022008
      label: neurogenesis
    modifier: INCREASED
  evidence:
  - reference: PMID:32055008
    reference_title: Cytoplasmic-predominant Pten increases microglial activation and synaptic pruning in a murine model with autism-like phenotype.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "predominant Pten localization results in a phenotype of extreme macrocephaly and autistic-like traits"
    explanation: >-
      Mouse model showing that perturbing Pten produces brain overgrowth. Typed
      MODEL_ORGANISM; the human macrocephaly phenotype itself is separately supported by
      human clinical evidence on the Macrocephaly phenotype entry.
  - reference: PMID:31609537
    reference_title: "PTEN Hamartoma tumor syndrome in childhood: A review of the clinical literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PTEN hamartoma tumor syndrome (PHTS) is a highly variable autosomal dominant condition associated with intellectual disability, overgrowth, and tumor predisposition phenotypes, which often overlap."
    explanation: Human review linking PHTS to an overgrowth phenotype, the output of this node.
  downstream:
  - target: Macrocephaly
    causal_link_type: DIRECT
    hypothesis_groups:
    - pten_nuclear_localization_split
- name: Synaptic and Circuit Development Dysregulation
  biological_scale: CELLULAR
  description: >-
    The functional arm of PTEN loss in the nervous system, distinct from and not reducible
    to brain size. Disrupted synaptic and circuit development manifests as hypotonia,
    delayed motor milestones, global developmental delay, intellectual disability, and
    autism spectrum characteristics. Neonatal or infantile onset and delayed motor
    development are among the features that historically distinguished BRRS from
    adult-presenting Cowden syndrome. Candidate cellular intermediates include microglial
    activation with excessive synaptic pruning, demonstrated in the cytoplasmic-predominant
    Pten mouse but not yet confirmed in human tissue.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: neuron differentiation
    term:
      id: GO:0030182
      label: neuron differentiation
    modifier: ABNORMAL

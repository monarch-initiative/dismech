genetic:
- name: PTEN
  notes: >-
    Heterozygous germline loss-of-function variants in PTEN (10q23) cause BRRS. The
    mutation spectrum includes nonsense, frameshift, missense, and splice variants as
    well as large deletions, and is indistinguishable from that seen in Cowden syndrome.
    Detection rate is ascertainment-dependent and must be read with that caveat: the
    classic clinically ascertained BRRS series found variants in 60% of cases, whereas a
    2024 systematic review of published pediatric cases found 75/83 (90%) — the latter
    reflects modern practice in which patients are increasingly defined by having the
    variant. The lower classic figure is the relevant one when asking whether a clinically
    diagnosed child without a detectable variant still has BRRS, and on that reading a
    negative PTEN result does not exclude the clinical diagnosis.
  gene_term:
    preferred_term: PTEN
    term:
      id: hgnc:9588
      label: PTEN
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:34754688
    reference_title: "Diffuse Gastrointestinal Polyposis in Bannayan-Riley-Ruvalcaba Syndrome: A Rare Phenotype Among Phosphatase and Tensin Homolog Hamartoma Tumor Syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bannayan-Riley-Ruvalcaba syndrome (BRRS) is a rare genetic disorder caused by germline mutations in the phosphatase and tensin homolog (PTEN) gene."
    explanation: Directly assigns germline PTEN variants as the cause of BRRS.
  - reference: PMID:10400993
    reference_title: PTEN mutation spectrum and genotype-phenotype correlations in Bannayan-Riley-Ruvalcaba syndrome suggest a single entity with Cowden syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations were identified in 26 of 43 (60%) BRR cases."
    explanation: >-
      Establishes the approximately 60% germline PTEN detection rate in a dedicated BRRS
      cohort.
  - reference: PMID:10400993
    reference_title: PTEN mutation spectrum and genotype-phenotype correlations in Bannayan-Riley-Ruvalcaba syndrome suggest a single entity with Cowden syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among CS, BRR and BRR/CS overlap families that are PTEN mutation positive, the mutation spectra appear similar."
    explanation: >-
      Supports the claim that the BRRS mutation spectrum is not distinguishable from that of
      Cowden syndrome.
  - reference: PMID:10353779
    reference_title: Phenotypic findings of Cowden syndrome and Bannayan-Zonana syndrome in a family associated with a single germline mutation in PTEN.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We have identified a germline mutation, R335X, in PTEN in a family consisting of two female members with the phenotypic findings of CS and two male members with the phenotypic findings of BZS."
    explanation: >-
      A single PTEN nonsense variant segregating with both Cowden and BRRS phenotypes in one
      family, the key intrafamilial evidence for allelism.
- name: TTN
  notes: >-
    TTN (titin) is a candidate predisposing locus in PTEN-wildtype BRRS, and is the most
    substantive lead for the roughly 40% of clinically diagnosed BRRS cases without a PTEN
    variant. Rare germline TTN missense variants were found in about a third of
    exome-sequenced PTEN-wildtype classic BRRS patients, and one I-band variant produced
    loss of
    contact inhibition in edited cells, suggesting a PI3K-independent route to the same
    overgrowth output. This is explicitly a candidate association, not an established
    disease gene, and is curated as SUSCEPTIBILITY rather than CAUSATIVE. The overlap of
    BRRS features with known titinopathy phenotypes (joint hyperextensibility, muscle
    hypotonia, delayed psychomotor development) is a supporting but non-decisive
    observation.
  gene_term:
    preferred_term: TTN
    term:
      id: hgnc:12403
      label: TTN
  relationship_type: SUSCEPTIBILITY
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:29263846
    reference_title: Germline TTN variants are enriched in PTEN-wildtype Bannayan-Riley-Ruvalcaba syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We exome-sequenced 35 unrelated PTEN-wildtype patients with classic presentation of BRRS and identified TTN germline missense variants in 12/35 (34%) patients."
    explanation: >-
      The primary human genetic observation: rare TTN missense variants in about a third of
      PTEN-wildtype classic BRRS patients.
  - reference: PMID:29263846
    reference_title: Germline TTN variants are enriched in PTEN-wildtype Bannayan-Riley-Ruvalcaba syndrome.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "suggested lack of contact inhibition in mutant cells"
    explanation: >-
      Cell-based functional support for one TTN variant. Recorded as PARTIAL with
      evidence_source IN_VITRO because it is an edited-cell phenotype, not a demonstration
      of the human disease mechanism.
  - reference: PMID:29263846
    reference_title: Germline TTN variants are enriched in PTEN-wildtype Bannayan-Riley-Ruvalcaba syndrome.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "our observations suggest TTN as a candidate predisposing gene in classic PTEN-wildtype BRRS patients, perhaps suggesting this syndrome join the growing list of Titinopathies"
    explanation: >-
      The authors' own framing as a candidate gene, which is why this is curated as
      SUSCEPTIBILITY rather than CAUSATIVE.
diagnosis:
- name: PTEN Molecular Genetic Testing
  description: >-
    Definitive diagnosis rests on identifying a heterozygous germline PTEN pathogenic
    variant. Because a substantial minority of clinically diagnosed BRRS cases have no
    detectable PTEN variant, a negative result does not overturn a clinical diagnosis, and
    such individuals are still generally managed with surveillance.

    Testing is tiered, and sequencing alone is not sufficient. Coding-region sequencing is
    the first step, but contiguous-gene and whole/multi-exon deletions at 10q23 are invisible
    to it and require deletion/duplication analysis (MLPA) or chromosomal microarray — the
    10q23 PTEN-plus-BMPR1A deletion subtype curated in this entry is found only that way.
    Assay design must also contend with the processed pseudogene PTENP1 on chromosome 9,
    which cross-amplifies with PTEN.
  evidence:
  - reference: PMID:18510548
    reference_title: Variable phenotypes associated with 10q23 microdeletions involving the PTEN and BMPR1A genes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The sizes of the deletions were analyzed using single nucleotide polymorphism array analysis."
    explanation: >-
      Supports the need for array-based rather than sequencing-only testing to detect the
      10q23 contiguous deletions described in this section.
  - reference: PMID:21177507
    reference_title: Germline epigenetic regulation of KILLIN in Cowden and Cowden-like syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Other mechanisms of loss of function such as hypermethylation, which should result in underexpression of PTEN or of KILLIN, a novel tumor suppressor transcribed in the opposite direction, may account for the remainder of Cowden syndrome and Cowden-like syndro"
    explanation: >-
      Supports germline promoter hypermethylation as a testable non-sequence mechanism in
      mutation-negative cases, which is why the workup does not stop at sequencing.
  - reference: PMID:20301661
    reference_title: PTEN Hamartoma Tumor Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of PHTS is established in a proband by identification of a heterozygous germline PTEN pathogenic variant on molecular genetic testing."
    explanation: GeneReviews states the molecular basis of establishing the PHTS diagnosis.
- name: Clinical Recognition in Childhood
  description: >-
    BRRS is recognized clinically in a child with macrocephaly plus some combination of
    hamartomatous gastrointestinal polyposis, multiple lipomas, and pigmented macules of
    the glans penis, often alongside developmental delay or autism spectrum features.
    Because dermatologic, gastrointestinal, and thyroid findings are age-dependent, their
    absence at first assessment does not exclude the diagnosis.
  evidence:
  - reference: PMID:37900693
    reference_title: Clinical Guidelines for Diagnosis and Management of Cowden Syndrome/PTEN Hamartoma Tumor Syndrome in Children and Adults-Secondary Publication.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This syndrome is occasionally diagnosed in childhood due to the occurrence of multiple gastrointestinal polyps, autism spectrum disorders, and intellectual disability."
    explanation: >-
      Guideline statement describing the childhood route to diagnosis that characterizes the
      BRRS presentation.
  - reference: PMID:28526761
    reference_title: A retrospective chart review of the features of PTEN hamartoma tumour syndrome in children.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Dermatological, GI and thyroid abnormalities are age dependent and may not be present at the time of diagnosis, requiring regular monitoring and medical surveillance."
    explanation: >-
      Supports the caution that age-dependent features may be absent at initial pediatric
      assessment.
treatments:
- name: Lifelong Cancer Surveillance
  description: >-
    The central management intervention. Because PTEN-positive BRRS carries the same
    cancer burden as Cowden syndrome, surveillance is identical and lifelong: annual
    thyroid ultrasound and skin examination from the time of diagnosis in childhood;
    in adults, annual thyroid ultrasound and dermatologic evaluation; from age 30 in
    women, breast screening with consideration of endometrial assessment from age 35;
    colonoscopy from age 35 with intervals set by polyp burden; and biennial renal
    imaging from age 40. Family history of early-onset cancer should pull screening
    earlier by 5 to 10 years.
  treatment_term:
    preferred_term: cancer surveillance
    term:
      id: NCIT:C15406
      label: Cancer Screening
  evidence:
  - reference: PMID:10400993
    reference_title: PTEN mutation spectrum and genotype-phenotype correlations in Bannayan-Riley-Ruvalcaba syndrome suggest a single entity with Cowden syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thus, PTEN mutation-positive CS and BRR may be different presentations of a single syndrome and, hence, both should receive equal attention with respect to cancer surveillance."
    explanation: >-
      The primary justification for applying full Cowden-equivalent surveillance to
      PTEN-positive BRRS.
  - reference: PMID:20301661
    reference_title: PTEN Hamartoma Tumor Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Yearly thyroid ultrasound from the time of diagnosis (earliest reported at age 7 years) and skin check with physical examination."
    explanation: GeneReviews pediatric surveillance recommendation, directly applicable to childhood-diagnosed BRRS.
  - reference: PMID:20301661
    reference_title: PTEN Hamartoma Tumor Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Men and women. Colonoscopy beginning at age 35 years with frequency dependent on degree of polyposis identified or family history of early-onset colon cancer (before age 40); biennial (every 2 years) renal imaging (CT or MRI preferred) beginning at age 40 years."
    explanation: GeneReviews colorectal and renal surveillance schedule.
  - reference: PMID:20301661
    reference_title: PTEN Hamartoma Tumor Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Those with a family history of a particular cancer type at an early age. Consider initiating screening 5 to 10 years prior to the youngest age of diagnosis in the family."
    explanation: GeneReviews guidance for family-history-driven earlier surveillance.
  - reference: PMID:32533092
    reference_title: Cancer Surveillance Guideline for individuals with PTEN hamartoma tumour syndrome.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Recommendations were put forward for surveillance for breast, thyroid and renal cancers. Limited recommendations were developed for other sites including endometrial, colon and skin."
    explanation: >-
      Recorded as PARTIAL because this European guideline supports strong recommendations
      only for breast, thyroid, and renal surveillance, and explicitly describes the
      endometrial, colon, and skin recommendations as limited.
  - reference: PMID:39256443
    reference_title: A systematic review of Bannayan - Riley - Ruvalcaba syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As targeted treatment is still lacking, symptom relief and long-term surveillance remain the main management strategies."
    explanation: >-
      BRRS-specific systematic review confirming that surveillance plus symptom-directed
      care, rather than any disease-modifying therapy, is the management mainstay.
- name: Gastrointestinal Polyp Management
  description: >-
    Symptomatic or large hamartomatous polyps are managed endoscopically with
    polypectomy, with colonoscopic surveillance intervals determined by polyp burden.
    Benign gastrointestinal lesions are common enough in PTEN carriers that structured
    colorectal screening is recommended rather than symptom-driven assessment alone.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: endoscopic polypectomy
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  evidence:
  - reference: PMID:22672595
    reference_title: Is colorectal surveillance indicated in patients with PTEN mutations?
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Colorectal screening of patients with germline PTEN mutations is recommended, starting at age 40 years."
    explanation: >-
      Supports structured colorectal screening in PTEN carriers. Note this cohort proposes
      age 40, whereas GeneReviews recommends starting at 35.
- name: Symptomatic Management of Hamartomatous Lesions
  description: >-
    Lipomas, vascular lesions, and other benign manifestations are treated the same way
    as their sporadic counterparts, with excision reserved for lesions causing pain,
    functional impairment, deformity, or diagnostic uncertainty rather than performed
    prophylactically.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical excision
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  evidence:
  - reference: PMID:20301661
    reference_title: PTEN Hamartoma Tumor Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Treatment for the benign and malignant manifestations of PHTS is the same as for their sporadic counterparts."
    explanation: GeneReviews establishes the principle of treating manifestations as for sporadic disease.
  - reference: PMID:20301661
    reference_title: PTEN Hamartoma Tumor Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "cutaneous lesions should be excised only if malignancy is suspected or symptoms (e.g., pain, deformity, increased scarring) are significant."
    explanation: GeneReviews supports restricting excision to symptomatic or suspicious lesions.
- name: Developmental and Behavioral Support
  description: >-
    Because developmental delay, intellectual disability, and autism spectrum
    characteristics are core to the BRRS presentation, early developmental assessment and
    intervention (speech, motor, and educational support) is a management priority
    independent of the cancer-surveillance agenda.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: rehabilitation
    term:
      id: NCIT:C15315
      label: Rehabilitation
  evidence:
  - reference: PMID:28526761
    reference_title: A retrospective chart review of the features of PTEN hamartoma tumour syndrome in children.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Early paediatric diagnosis is important for institution of medical and developmental surveillance as well as for testing other at- risk family members."
    explanation: >-
      Supports developmental surveillance and support as an explicit goal of early pediatric
      diagnosis.
- name: mTOR Inhibitor Therapy
  description: >-
    Everolimus targets the mTOR overactivity that follows PTEN loss, giving a direct
    mechanistic rationale. A 6-month phase II randomized placebo-controlled trial in 46
    individuals with PHTS aged 5 to 45 found the drug tolerable but did not meet its
    primary neurocognitive endpoint, with gastrointestinal adverse events more common on
    treatment. mTOR inhibition therefore remains investigational for the
    neurodevelopmental features of BRRS and is not routine care.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: mTOR inhibitor pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: everolimus
      term:
        id: CHEBI:68478
        label: everolimus
  target_mechanisms:
  - target: PIP3 Accumulation and PI3K-AKT-mTOR Hyperactivation
    treatment_effect: INHIBITS
    description: >-
      Everolimus inhibits mTORC1 downstream of the PIP3/AKT node, partially offsetting the
      signaling excess caused by PTEN loss.
  evidence:
  - reference: PMID:35594551
    reference_title: A randomized controlled trial of everolimus for neurocognitive symptoms in PTEN hamartoma tumor syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PTEN hamartoma tumor syndrome (PHTS) is a complex neurodevelopmental disorder characterized by mechanistic target of rapamycin (mTOR) overactivity."
    explanation: Establishes the mechanistic rationale for mTOR inhibition in PHTS.
  - reference: PMID:35594551
    reference_title: A randomized controlled trial of everolimus for neurocognitive symptoms in PTEN hamartoma tumor syndrome.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Changes in the primary endpoint between groups from baseline to Month 6 were not apparent"
    explanation: >-
      Recorded as REFUTE for the claim of neurocognitive efficacy. The randomized trial's
      primary endpoint was null, which is why this treatment is curated as investigational
      rather than established.
  - reference: PMID:35594551
    reference_title: A randomized controlled trial of everolimus for neurocognitive symptoms in PTEN hamartoma tumor syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Gastrointestinal adverse events were more common in the everolimus group"
    explanation: Documents the principal treatment-emergent toxicity signal in the trial.
- name: Sirolimus for Vascular Anomalies
  description: >-
    Sirolimus (rapamycin) is the lesion-directed mTOR-inhibitor use in BRRS, distinct from
    the neurocognitive indication that the everolimus trial tested and missed. It is used
    off-label for symptomatic vascular anomalies when other treatments have failed, and the
    BRRS-specific published experience is a single pediatric case in the 2024 systematic
    review. Evidence is therefore anecdotal, and this is curated as an off-label option
    under investigation rather than standard care.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: mTOR inhibitor pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: sirolimus
      term:
        id: CHEBI:9168
        label: sirolimus
  target_mechanisms:
  - target: PTEN Hamartoma of Soft Tissue Formation
    treatment_effect: INHIBITS
    description: >-
      Sirolimus acts on the lesion itself: mTORC1 inhibition shrinks the intramuscular
      fat-and-vessel overgrowth, which is why the reported benefit is lesion size and
      symptom relief rather than a systemic disease-modifying effect.
  - target: PIP3 Accumulation and PI3K-AKT-mTOR Hyperactivation
    treatment_effect: INHIBITS
    description: >-
      The upstream pharmacological rationale: sirolimus inhibits mTORC1 downstream of the
      PIP3/AKT node.
  evidence:
  - reference: PMID:39256443
    reference_title: A systematic review of Bannayan - Riley - Ruvalcaba syndrome.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "mTOR inhibitors have been investigated in patients with vascular anomalies when previous treatments were ineffective"
    explanation: >-
      Establishes the lesion-directed indication. PARTIAL because it describes an
      investigational, salvage-setting use rather than established efficacy.
  - reference: PMID:39256443
    reference_title: A systematic review of Bannayan - Riley - Ruvalcaba syndrome.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "only one study reported the use of rapamycin"
    explanation: >-
      Quantifies how thin the BRRS-specific evidence is: a single report among 33 reviewed
      articles, which is why this is curated as anecdotal rather than standard care.
  - reference: PMID:39256443
    reference_title: A systematic review of Bannayan - Riley - Ruvalcaba syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There is no established standard treatment for PHTS patients"
    explanation: >-
      Confirms the absence of an established standard therapy in PHTS, the framing under
      which any mTOR-inhibitor use in BRRS should be read.
- name: Genetic Counseling and Cascade Testing
  description: >-
    Genetic counseling covers the autosomal dominant 50% transmission risk, the
    variable expressivity that lets one PTEN variant produce BRRS in one relative and
    Cowden syndrome in another, and the value of predictive testing in at-risk relatives
    so that carriers can enter surveillance.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:20301661
    reference_title: PTEN Hamartoma Tumor Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "When a PTEN pathogenic variant has been identified in a proband, molecular genetic testing of asymptomatic at-risk relatives can identify those who have the family-specific pathogenic variant and warrant ongoing surveillance."
    explanation: GeneReviews supports cascade testing of at-risk relatives to direct surveillance.
  - reference: PMID:10353779
    reference_title: Phenotypic findings of Cowden syndrome and Bannayan-Zonana syndrome in a family associated with a single germline mutation in PTEN.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To our knowledge, this is the first report that shows the presence of separate subjects with CS and with BZS in a single family associated with a single germline PTEN mutation."
    explanation: >-
      Supports counseling about intrafamilial variable expressivity: the same variant can
      produce either BRRS or Cowden syndrome in different relatives.
differential_diagnoses:
- name: Cowden Syndrome
  description: >-
    The adult-presenting allelic PHTS phenotype. Distinguished by trichilemmomas and
    mucocutaneous papillomatous papules with presentation in the late 20s, rather than
    the congenital macrocephaly, polyposis, lipoma, and genital lentiginosis pattern of
    BRRS. The distinction is clinical and developmental, not molecular: both arise from
    germline PTEN variants and both require the same cancer surveillance.
  evidence:
  - reference: PMID:10400993
    reference_title: PTEN mutation spectrum and genotype-phenotype correlations in Bannayan-Riley-Ruvalcaba syndrome suggest a single entity with Cowden syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pigmented macules of the glans penis, delayed motor development and neonatal or infant onset are noted only in BRR."
    explanation: Gives the specific features that separate BRRS from Cowden syndrome clinically.
- name: Juvenile Polyposis Syndrome
  description: >-
    Shares hamartomatous gastrointestinal polyposis with BRRS and was historically
    considered a possible variant of it, but is caused by SMAD4 or BMPR1A variants and
    lacks macrocephaly, lipomas, and genital lentiginosis.
  evidence:
  - reference: PMID:9352843
    reference_title: Localization of the Bannayan-Riley-Ruvalcaba syndrome gene to chromosome 10q23.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It has been suggested that Bannayan-Riley-Ruvalcaba syndrome may be a variant of juvenile polyposis coli because of the shared features of intestinal juvenile polyps."
    explanation: >-
      Documents the historical diagnostic confusion between BRRS and juvenile polyposis based
      on shared polyp histology.
discussions:
- discussion_id: gap_brrs_pediatric_ascertained_cancer_risk
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What is the actual, prospectively measured cancer risk in individuals ascertained as
    BRRS in childhood, as opposed to risk inferred from adult, cancer-ascertained Cowden
    syndrome cohorts?
  attaches_to:
  - pathophysiology#Lifelong Multiorgan Cancer Predisposition
  rationale: >-
    The cancer surveillance imposed on children diagnosed with BRRS rests on allelism with
    Cowden syndrome rather than on direct BRRS-cohort incidence data. The original BRRS
    delineation explicitly noted that malignancy had not been formally documented in BRRS,
    and contemporary reviews flag that existing PHTS risk estimates come from strongly
    ascertained, mostly adult cohorts with an acknowledged absence of pediatric research.
    If BRRS-ascertained carriers have materially different risk, current pediatric
    surveillance may be either over- or under-calibrated.
  proposed_experiments:
  - experiment_id: brrs-prospective-pediatric-cohort
    name: Prospective pediatric BRRS cancer-incidence cohort
    description: >-
      A prospective, multicenter cohort of individuals ascertained in childhood by BRRS
      clinical criteria and followed into adulthood, reporting age- and site-specific
      cancer incidence separately for PTEN-positive and PTEN-negative participants.
  evidence:
  - reference: PMID:33140411
    reference_title: A review on age-related cancer risks in PTEN hamartoma tumor syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although these estimates provide guidance for clinical care, discrepancies between studies, sample sizes, retrospective designs, strongly ascertained cases, and lack of pediatric research emphasizes that data should be interpreted with great caution."
    explanation: Explicitly identifies the absence of pediatric data and ascertainment bias as the gap.
  - reference: PMID:31609537
    reference_title: "PTEN Hamartoma tumor syndrome in childhood: A review of the clinical literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We acknowledge the limited understanding of the natural history of childhood-onset PHTS as a cancer predisposition syndrome and present a summary of important management considerations."
    explanation: >-
      A pediatric-focused review stating directly that the natural history of childhood-onset
      PHTS as a cancer predisposition syndrome is poorly understood.
- discussion_id: gap_brrs_mutation_negative_cases
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What explains the roughly 40% of clinically diagnosed BRRS cases with no detectable
    germline PTEN variant, and do those individuals carry the same cancer risk?
  attaches_to:
  - pathophysiology#Germline PTEN Loss of Function
  rationale: >-
    Only about 60% of classically ascertained BRRS cases have an identifiable germline PTEN
    variant, a lower yield than in Cowden syndrome. Several established explanations account
    for part of the residue and should be excluded before invoking locus heterogeneity:
    large deletions missed by sequencing (recoverable by MLPA or microarray, as in the 10q23
    contiguous-deletion subtype), promoter and deep-intronic variants, somatic mosaicism
    detectable only in lesional tissue, and germline KLLN promoter hypermethylation, which
    silences KILLIN from the promoter PTEN and KLLN share while leaving PTEN transcription
    intact. What remains after all of those is unresolved. Germline TTN missense variants are the leading candidate explanation for
    part of this residue, but remain a candidate association rather than an established
    disease-gene relationship. This directly affects management, because the argument for
    Cowden-equivalent surveillance is anchored on PTEN positivity and does not automatically
    extend to mutation-negative individuals.
  proposed_experiments:
  - experiment_id: brrs-mutation-negative-genomics
    name: Genomic reanalysis of PTEN-mutation-negative BRRS
    description: >-
      Genome sequencing with deep-intronic, promoter, structural-variant, and
      somatic-mosaicism analysis on a cohort of PTEN-mutation-negative clinical BRRS cases,
      paired with long-term cancer outcome follow-up.
  evidence:
  - reference: PMID:10400993
    reference_title: PTEN mutation spectrum and genotype-phenotype correlations in Bannayan-Riley-Ruvalcaba syndrome suggest a single entity with Cowden syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations were identified in 26 of 43 (60%) BRR cases."
    explanation: Quantifies the incomplete molecular yield that defines this gap.
  - reference: PMID:10400993
    reference_title: PTEN mutation spectrum and genotype-phenotype correlations in Bannayan-Riley-Ruvalcaba syndrome suggest a single entity with Cowden syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Comparisons between BRR and a previously studied group of 37 CS families suggested an increased likelihood of identifying a germline PTEN mutation in families with either CS alone or both CS and BRR when compared with BRR alone"
    explanation: >-
      Documents that BRRS-alone families have a lower PTEN detection rate, sharpening the
      question of what underlies mutation-negative BRRS.
  - reference: PMID:21177507
    reference_title: Germline epigenetic regulation of KILLIN in Cowden and Cowden-like syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We sought to address the hypothesis that germline methylation of the 10q23.31 bidirectional promoter CpG island"
    explanation: >-
      Supports germline KLLN promoter hypermethylation at the shared bidirectional promoter
      as one established explanation for PTEN-mutation-negative disease.
  - reference: PMID:29263846
    reference_title: Germline TTN variants are enriched in PTEN-wildtype Bannayan-Riley-Ruvalcaba syndrome.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The remaining cases are of unknown genetic etiology."
    explanation: >-
      States the gap directly, and this paper's TTN finding is the leading partial answer to
      it, which is why the evidence is PARTIAL rather than a resolution.
references:
- reference: PMID:20301661
  title: PTEN Hamartoma Tumor Syndrome.
  tags:
  - GeneReviews
notes: >-
  Nosological note. BRRS is retained as a distinct dismech entry rather than folded into
  PTEN_Hamartoma_Tumor_Syndrome or Cowden_Syndrome because its congenital onset,
  neurodevelopmental burden, and diagnostically specific genital lentiginosis define a
  clinically actionable pediatric presentation, even though it is molecularly allelic with
  Cowden syndrome. The entry deliberately foregrounds that allelism, since the single most
  consequential management fact in BRRS is that a childhood diagnosis obligates lifelong
  Cowden-equivalent cancer surveillance. This parallels the existing standalone
  Cowden_Syndrome entry, which is also a PHTS subtype. See issue #869 for the broader
  Cowden/PHTS lumping discussion.

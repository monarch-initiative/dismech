  variant_origin: GERMLINE
  evidence:
  - reference: PMID:29263846
    reference_title: Germline TTN variants are enriched in PTEN-wildtype Bannayan-Riley-Ruvalcaba syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We exome-sequenced 35 unrelated PTEN-wildtype patients with classic presentation of BRRS and identified TTN germline missense variants in 12/35 (34%) patients."
    explanation: >-
      The primary human genetic observation: rare TTN missense variants in about a third of PTEN-wildtype
      classic BRRS patients.
  - reference: PMID:29263846
    reference_title: Germline TTN variants are enriched in PTEN-wildtype Bannayan-Riley-Ruvalcaba syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "suggested lack of contact inhibition in mutant cells"
    explanation: >-
      Cell-based functional support for one TTN variant. Limited to the cell assay, with evidence_source
      IN_VITRO because it is an edited-cell phenotype, not a demonstration of the human disease mechanism.
  - reference: PMID:29263846
    reference_title: Germline TTN variants are enriched in PTEN-wildtype Bannayan-Riley-Ruvalcaba syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "our observations suggest TTN as a candidate predisposing gene in classic PTEN-wildtype BRRS patients, perhaps suggesting this syndrome join the growing list of Titinopathies"
    explanation: >-
      The authors' own framing as a candidate gene, which is why this is curated as SUSCEPTIBILITY rather
      than CAUSATIVE.
diagnosis:
- name: PTEN Molecular Genetic Testing
  description: >-
    A heterozygous germline pathogenic PTEN variant establishes molecular PHTS in an individual with a
    BRRS phenotype. A negative result does not exclude a clinical BRRS presentation, but does not establish
    the same cancer risk. GeneReviews describes PTEN sequence analysis followed by deletion/duplication
    analysis, and promoter-region analysis when these are unrevealing. Copy-number testing can identify
    whole-gene or multiexon deletions; chromosomal microarray can define larger contiguous deletions including
    PTEN and BMPR1A. Test sensitivity depends on the assay used. KLLN promoter methylation findings in
    Cowden/Cowden-like cohorts do not establish a BRRS-specific etiology or routine BRRS diagnostic assay.
    Primer design must distinguish PTEN from its homologous pseudogene PTENP1.
  evidence:
  - reference: PMID:18510548
    reference_title: Variable phenotypes associated with 10q23 microdeletions involving the PTEN and BMPR1A genes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The sizes of the deletions were analyzed using single nucleotide polymorphism array analysis."
    explanation: >-
      Supports the need for array-based rather than sequencing-only testing to detect the 10q23 contiguous
      deletions described in this section.
  - reference: PMID:20301661
    reference_title: PTEN Hamartoma Tumor Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of PHTS is established in a proband by identification of a heterozygous germline PTEN pathogenic variant on molecular genetic testing."
    explanation: >-
      GeneReviews states the molecular basis of establishing the PHTS diagnosis.
    quote_role: REVIEW_SYNTHESIS
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1488/pdf/Bookshelf_NBK1488.pdf
    reference_title: "https://www.ncbi.nlm.nih.gov/sites/books/NBK1488/pdf/Bookshelf_NBK1488.pdf"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: If a pathogenic variant is not identified with deletion/duplication analysis, perform sequence analysis of the PTEN promoter region for variants that decrease PTEN gene expression.
    explanation: >-
      The July 2026 PTEN Hamartoma Tumor Syndrome GeneReviews chapter by Tramontana and Yehia retains
      the sequence, copy-number, then promoter testing approach.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1488/pdf/Bookshelf_NBK1488.pdf
    reference_title: "https://www.ncbi.nlm.nih.gov/sites/books/NBK1488/pdf/Bookshelf_NBK1488.pdf"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Special consideration should be taken when designing PTEN-specific primers to ensure specificity and to avoid cross-amplification of this pseudogene
    explanation: >-
      GeneReviews, PTEN Hamartoma Tumor Syndrome (July 2026 revision): The molecular-genetics technical note identifies PTENP1 as a source of assay cross-amplification.
- name: Clinical Recognition in Childhood
  description: >-
    BRRS is recognized clinically in a child with macrocephaly plus some combination of
    hamartomatous gastrointestinal polyposis, multiple lipomas, and pigmented macules of
    the glans penis, often alongside developmental delay or autism spectrum features.
    Because dermatologic, gastrointestinal, and thyroid findings are age-dependent, their
    absence at first assessment does not exclude the diagnosis.
  evidence:
  - reference: PMID:37900693
    reference_title: Clinical Guidelines for Diagnosis and Management of Cowden Syndrome/PTEN Hamartoma Tumor Syndrome in Children and Adults-Secondary Publication.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This syndrome is occasionally diagnosed in childhood due to the occurrence of multiple gastrointestinal polyps, autism spectrum disorders, and intellectual disability."
    explanation: >-
      Guideline statement describing the childhood route to diagnosis that characterizes the BRRS presentation.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:28526761
    reference_title: A retrospective chart review of the features of PTEN hamartoma tumour syndrome in children.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Dermatological, GI and thyroid abnormalities are age dependent and may not be present at the time of diagnosis, requiring regular monitoring and medical surveillance."
    explanation: >-
      Supports the caution that age-dependent features may be absent at initial pediatric assessment.
- name: Imaging of Suspected PHOST
  description: >-
    MRI can show an infiltrative lesion spanning muscle, fascia, and subcutaneous tissue, with adipose
    components, enlarged serpiginous vessels, and small arteriovenous fistulae with dilated draining veins.
    Imaging guides assessment of a symptomatic lesion; histology distinguishes PHOST from other vascular
    and connective-tissue abnormalities.
  evidence:
  - reference: PMID:22446940
    reference_title: "PTEN hamartoma of soft tissue: a distinctive lesion in PTEN syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Magnetic resonance imaging generally showed an infiltrative soft tissue lesion involving the muscle, fascia, and subcutis with frequently enlarged, serpiginous vessels, small arteriovenous fistulae with disproportionately dilated draining veins, and a prominent adipocytic component.
    explanation: >-
      Imaging findings come from the PHOST pathology series, not a screening study of all BRRS patients.
treatments:
- name: Lifelong Cancer Surveillance
  description: >-
    Individuals with a germline pathogenic PTEN variant and a BRRS phenotype require long-term PHTS cancer-risk
    management. Recent guidelines differ in starting ages, intervals, and the evidence for renal and endometrial
    surveillance. The 2025 international consensus and 2026 ERN GENTURIS recommendations are therefore
    described separately below. Personal and family history, prior lesions, local guidance, and shared
    decision-making inform the plan. Molecularly negative clinical BRRS requires individualized assessment;
    the same cancer risk is not established. Genotype-based surveillance stratification is not supported
    by current evidence.
  treatment_term:
    preferred_term: cancer surveillance
    term:
      id: NCIT:C15406
      label: Cancer Screening
  evidence:
  - reference: PMID:10400993
    reference_title: PTEN mutation spectrum and genotype-phenotype correlations in Bannayan-Riley-Ruvalcaba syndrome suggest a single entity with Cowden syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thus, PTEN mutation-positive CS and BRR may be different presentations of a single syndrome and, hence, both should receive equal attention with respect to cancer surveillance."
    explanation: >-
      The primary justification for applying full Cowden-equivalent surveillance to PTEN-positive BRRS.
  - reference: PMID:39256443
    reference_title: A systematic review of Bannayan - Riley - Ruvalcaba syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As targeted treatment is still lacking, symptom relief and long-term surveillance remain the main management strategies."
    explanation: >-
      BRRS-specific systematic review confirming that surveillance plus symptom-directed care, rather
      than any disease-modifying therapy, is the management mainstay.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:39937242
    reference_title: "Cancer and Overgrowth Manifestations of PTEN Hamartoma Tumor Syndrome: Management Recommendations from the International PHTS Consensus Guidelines Working Group."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: at this time, it is not felt that genotype-specific recommendations could be made for individuals with PHTS
    explanation: >-
      The consensus explicitly rejects genotype-specific surveillance recommendations at present.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1488/pdf/Bookshelf_NBK1488.pdf
    reference_title: "https://www.ncbi.nlm.nih.gov/sites/books/NBK1488/pdf/Bookshelf_NBK1488.pdf"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Regardless of clinical phenotype, individuals with a germline PTEN pathogenic variant are thought to have the same cancer risks.
    explanation: >-
      The updated GeneReviews chapter bases shared PHTS risk management on a germline pathogenic PTEN
      variant.
- name: 'PHTS Surveillance: 2025 International Consensus'
  description: >-
    The 2025 international consensus recommends annual breast MRI from age 25 and annual mammography from
    age 40. Thyroid ultrasound begins at age 12, then every 3-5 years when normal or every 2-3 years for
    clinically nonactionable nodules. Baseline colonoscopy is recommended at 35-40 years, with 1-3-year
    follow-up for a high adenoma burden, large polyps, or high-grade dysplasia. Routine endometrial surveillance,
    if offered, should be within a clinical trial; abnormal uterine bleeding requires evaluation. Renal
    ultrasound every two years from 35-40 may be considered as expert opinion. These recommendations concern
    PTEN-confirmed PHTS, not BRRS-specific trial evidence.
  treatment_term:
    preferred_term: cancer surveillance
    term:
      id: NCIT:C15406
      label: Cancer Screening
  evidence:
  - reference: PMID:39937242
    reference_title: "Cancer and Overgrowth Manifestations of PTEN Hamartoma Tumor Syndrome: Management Recommendations from the International PHTS Consensus Guidelines Working Group."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Women with PHTS should undergo annual breast MRI (with contrast) from age 25 years and additional surveillance with breast mammography (with digital breast tomosynthesis) starting at age 40 years until 75 to 80 years of age.
    explanation: >-
      The consensus breast imaging recommendation is stated with its age thresholds.
  - reference: PMID:39937242
    reference_title: "Cancer and Overgrowth Manifestations of PTEN Hamartoma Tumor Syndrome: Management Recommendations from the International PHTS Consensus Guidelines Working Group."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: From age 12 years, individuals with PHTS should undergo baseline thyroid ultrasound.
    explanation: >-
      The 2025 consensus begins thyroid ultrasound at 12 years.
  - reference: PMID:39937242
    reference_title: "Cancer and Overgrowth Manifestations of PTEN Hamartoma Tumor Syndrome: Management Recommendations from the International PHTS Consensus Guidelines Working Group."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: We recommend surveillance with thyroid ultrasound every 3 to 5 years for individuals with PHTS and without nodules seen on initial thyroid ultrasound and every 2 to 3 years for individuals with clinically nonactionable nodules seen on initial thyroid ultrasound.
    explanation: >-
      Intervals depend on the initial ultrasound findings.
  - reference: PMID:39937242
    reference_title: "Cancer and Overgrowth Manifestations of PTEN Hamartoma Tumor Syndrome: Management Recommendations from the International PHTS Consensus Guidelines Working Group."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: We recommend that all individuals with PHTS undergo a baseline colonoscopy at 35–40 years.
    explanation: >-
      This is routine baseline surveillance, distinct from earlier symptom-directed evaluation.
  - reference: PMID:39937242
    reference_title: "Cancer and Overgrowth Manifestations of PTEN Hamartoma Tumor Syndrome: Management Recommendations from the International PHTS Consensus Guidelines Working Group."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Individuals with PHTS and a high colon polyp burden (five or more tubular adenomas), or polyps greater than or equal to 1 cm in diameter or with high-grade dysplasia, should undergo colonoscopy at a 1- to 3-year interval, as directed by their gastroenterologist.
    explanation: >-
      The shorter interval is conditional on polyp burden, size, or dysplasia.
  - reference: PMID:39937242
    reference_title: "Cancer and Overgrowth Manifestations of PTEN Hamartoma Tumor Syndrome: Management Recommendations from the International PHTS Consensus Guidelines Working Group."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: If the decision to offer surveillance for endometrial cancer is made, this should be part of a clinical trial.
    explanation: >-
      The 2025 recommendation reflects limited evidence for routine endometrial surveillance.
  - reference: PMID:39937242
    reference_title: "Cancer and Overgrowth Manifestations of PTEN Hamartoma Tumor Syndrome: Management Recommendations from the International PHTS Consensus Guidelines Working Group."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Starting at the age of 35–40 years, a surveillance ultrasound every 2 years for renal cell carcinoma may be considered in individuals with PHTS.
    explanation: >-
      This is explicitly an expert-opinion recommendation with limited evidence.
- name: 'PHTS Surveillance: 2026 ERN GENTURIS Guideline'
  description: >-
    The 2026 ERN GENTURIS guideline recommends breast MRI surveillance from age 25, with mammography every
    1-2 years considered from age 40 or according to national guidance. Thyroid ultrasound starts between
    10 and 18 years, annually initially, then every 2-3 years after two examinations without suspicious
    findings. Endometrial surveillance is probably appropriate from 35-40 years using at least annual
    transvaginal ultrasonography, with biopsy considered. Renal baseline imaging is offered at 35-40;
    when normal, further regular renal screening is not recommended. Baseline colonoscopy at 35-40 determines
    follow-up by polyp number, size, and pathology; only hamartomas or no polyps may permit general-population
    screening or repeat colonoscopy after 5-10 years. A baseline skin examination is suggested at 30,
    with further assessment according to findings or symptoms.
  treatment_term:
    preferred_term: cancer surveillance
    term:
      id: NCIT:C15406
      label: Cancer Screening
  evidence:

  - reference: PMID:10400993
    reference_title: PTEN mutation spectrum and genotype-phenotype correlations in Bannayan-Riley-Ruvalcaba syndrome suggest a single entity with Cowden syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pigmented macules of the glans penis, delayed motor development and neonatal or infant onset are noted only in BRR."
    explanation: >-
      Identifies delayed motor development and congenital/infantile onset as BRRS-restricted
      features, supporting this functional arm and its early timing.
  - reference: PMID:34983360
    reference_title: "Behavioural and psychological features of PTEN mutations: a systematic review of the literature and meta-analysis of the prevalence of autism spectrum disorder characteristics."

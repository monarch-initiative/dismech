genetic:
- name: PTEN
  notes: >-
    Heterozygous germline pathogenic PTEN variants establish PHTS and cause PTEN-positive BRRS. Sequence
    variants and deletions occur, and the spectrum overlaps Cowden syndrome. The classic clinically ascertained
    BRRS study identified variants in 26 of 43 cases (60%). Detection rates depend on ascertainment and
    assay coverage; a negative test does not exclude the clinical BRRS phenotype. The spectrum includes
    nonsense, missense, splice, small insertion/deletion, and larger copy-number variants. In selected
    BRRS/overlap cases without a previously identified intragenic variant, deletion analysis found additional
    diagnoses.
  gene_term:
    preferred_term: PTEN
    term:
      id: hgnc:9588
      label: PTEN
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:34754688
    reference_title: "Diffuse Gastrointestinal Polyposis in Bannayan-Riley-Ruvalcaba Syndrome: A Rare Phenotype Among Phosphatase and Tensin Homolog Hamartoma Tumor Syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bannayan-Riley-Ruvalcaba syndrome (BRRS) is a rare genetic disorder caused by germline mutations in the phosphatase and tensin homolog (PTEN) gene."
    explanation: >-
      Directly assigns germline PTEN variants as the cause of BRRS.
  - reference: PMID:10400993
    reference_title: PTEN mutation spectrum and genotype-phenotype correlations in Bannayan-Riley-Ruvalcaba syndrome suggest a single entity with Cowden syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations were identified in 26 of 43 (60%) BRR cases."
    explanation: >-
      Establishes the approximately 60% germline PTEN detection rate in a dedicated BRRS cohort.
  - reference: PMID:10400993
    reference_title: PTEN mutation spectrum and genotype-phenotype correlations in Bannayan-Riley-Ruvalcaba syndrome suggest a single entity with Cowden syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among CS, BRR and BRR/CS overlap families that are PTEN mutation positive, the mutation spectra appear similar."
    explanation: >-
      Supports the claim that the BRRS mutation spectrum is not distinguishable from that of Cowden syndrome.
  - reference: PMID:10353779
    reference_title: Phenotypic findings of Cowden syndrome and Bannayan-Zonana syndrome in a family associated with a single germline mutation in PTEN.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We have identified a germline mutation, R335X, in PTEN in a family consisting of two female members with the phenotypic findings of CS and two male members with the phenotypic findings of BZS."
    explanation: >-
      A single PTEN nonsense variant segregating with both Cowden and BRRS phenotypes in one family, the
      key intrafamilial evidence for allelism.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1488/pdf/Bookshelf_NBK1488.pdf
    reference_title: "https://www.ncbi.nlm.nih.gov/sites/books/NBK1488/pdf/Bookshelf_NBK1488.pdf"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Germline pathogenic variants have been found throughout PTEN and include missense, nonsense, and splice site variants, small deletions, insertions, and large deletions.
    explanation: >-
      The GeneReviews molecular-genetics section describes the spectrum, including sequence and structural
      variants.
  - reference: PMID:12844284
    reference_title: Germline PTEN promoter mutations and deletions in Cowden/Bannayan-Riley-Ruvalcaba syndrome result in aberrant PTEN protein and dysregulation of the phosphoinositol-3-kinase/Akt pathway.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Thus 3 (11%) of 27 patients with BRRS or BRRS/CS-overlap had PTEN deletions.
    explanation: >-
      This additional yield is in a selected subgroup without previously PCR-detected intragenic variants,
      not 11% of all BRRS. The promoter-variant cases in this study had Cowden syndrome.
- name: TTN
  notes: >-
    TTN is a candidate predisposing locus in PTEN-wildtype BRRS. The discovery study identified germline
    missense variants in 12 of 35 unrelated classic BRRS probands. Functional study of one edited variant
    suggested impaired contact inhibition, but does not establish pathogenicity of all variants or a validated
    disease-gene relationship. This susceptibility annotation denotes a research candidate and is not
    a basis for predictive clinical testing or treatment selection.
  gene_term:
    preferred_term: TTN
    term:
      id: hgnc:12403
      label: TTN

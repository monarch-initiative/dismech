      BRRS case reports (97%), within the 80-100% range.
  - reference: PMID:39256443
    reference_title: A systematic review of Bannayan - Riley - Ruvalcaba syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A total of 83 pediatric patients with BRRS were identified. The most common clinical findings were macrocephaly (77%) and developmental disorders (63%)."

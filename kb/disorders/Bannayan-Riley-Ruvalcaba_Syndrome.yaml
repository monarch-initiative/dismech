- name: Individualized Risk-Reducing Surgery
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: risk-reducing surgical procedures
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  description: >-
    For PTEN-confirmed PHTS, risk-reducing mastectomy may be discussed as an alternative to breast surveillance
    with an experienced high-risk breast team, generally after age 25. Counseling considers individual
    risk, surgical complications, reconstruction, and preferences. Routine hysterectomy is not recommended
    by the 2025 international consensus; decisions are individualized, including uterine pathology and
    reproductive plans. These are adult risk-management options, not routine interventions for children
    with BRRS.
  evidence:
  - reference: PMID:39937242
    reference_title: "Cancer and Overgrowth Manifestations of PTEN Hamartoma Tumor Syndrome: Management Recommendations from the International PHTS Consensus Guidelines Working Group."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Given the high lifetime risk of female breast cancer and second primary breast cancer in individuals with PHTS and pathogenic or likely pathogenic variants in PTEN, we recommend discussing the options of surveillance versus RRM with an experienced high-risk breast clinic team.
    explanation: >-
      The guideline recommends a discussion of alternatives rather than universal preventive surgery.
  - reference: PMID:39937242
    reference_title: "Cancer and Overgrowth Manifestations of PTEN Hamartoma Tumor Syndrome: Management Recommendations from the International PHTS Consensus Guidelines Working Group."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Generally, RRM should only be considered in individuals older than 25 years of age, unless otherwise clinically indicated
    explanation: >-

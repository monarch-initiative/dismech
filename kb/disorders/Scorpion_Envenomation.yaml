      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "The seriousness of scorpion envenomation results essentially from left cardiac function with pulmonary oedema and/or a state of shock."
      explanation: States the step from myocardial injury to the clinical failure syndrome.

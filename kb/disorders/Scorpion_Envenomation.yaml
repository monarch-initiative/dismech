    term:
      id: CL:0002548
      label: fibroblast of cardiac tissue
  downstream:
  - target: Excessive Vagal Acetylcholine Release at the Heart
    causal_link_type: DIRECT
    hypothesis_groups:
    - il1r_pge2_cholinergic_axis
    evidence:
    - reference: PMID:33116136

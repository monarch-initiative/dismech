  evidence:
  - reference: ICTRP:CTRI/2013/09/004002
    reference_title: "A Randomized open label clinical trial to find out efficacy of scorpion anti- Venom plus prazosin combination in children of scorpion sting envenomation"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "| Register | CTRI |"
    explanation: >-
      The WHO ICTRP registration record establishing this trial's identity on
      a non-ClinicalTrials.gov primary registry.
  - reference: ICTRP:CTRI/2013/09/004002
    reference_title: "A Randomized open label clinical trial to find out efficacy of scorpion anti- Venom plus prazosin combination in children of scorpion sting envenomation"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "| Prospective Registration | No |"
    explanation: >-
      The retrospective registration, quoted rather than asserted because it

diagnosis:
- name: Transthoracic echocardiography
  description: >-
    The reference standard the whole biochemical section is measured against,
    and the test that decides management: it separates the child with an
    autonomic syndrome who will recover from the one with left ventricular
    failure who needs an intensive care bed. Reversibility is the point -
    ventricular function recovers in almost all survivors, so a depressed
    ejection fraction here is a reason to escalate support rather than a
    prognosis.
  diagnosis_term:
    preferred_term: echocardiography
    term:
      id: NCIT:C16525
      label: Echocardiography Test
  markers: Ejection fraction, shortening fraction, left ventricular dysfunction
  results: >-
    Left ventricular dysfunction in roughly a quarter of patients presenting
    with signs of severity.
  evidence:
  - reference: PMID:39842516
    reference_title: New biomarkers in scorpion stings.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "The resources currently available for diagnosing cardiac dysfunction caused by scorpion stings, the most common cause of death, are echocardiograms and laboratory tests, such as troponin, creatine phosphokinase-MB (CKMB), and Brain natriuretic peptide (BNP)."
    explanation: >-
      States the diagnostic standard of care for this disease, and names the
      same laboratory markers the `biochemical:` section curates. BACKGROUND
      because it frames the study rather than reporting its result.
  - reference: PMID:39842516
    reference_title: New biomarkers in scorpion stings.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Left ventricular dysfunction was identified in 13 patients (26.5%), with 7 cases classified as severe."
    explanation: >-
      The yield of the test in a series selected for signs of severity on
      admission, which is the population it is used in.
  notes: >-
    Curated as a diagnosis rather than as a biomarker because it is the
    endpoint every marker in the `biochemical:` section is evaluated against -
    sST2 and FABP3 report AUCs against cardiac ultrasound, and proBNP is
    correlated against ejection and shortening fraction. Reading the two
    sections together, the markers are candidates for triaging who gets an
    echocardiogram sooner, not replacements for it.
- name: Serial ECG and cardiac monitoring
  description: >-
    Continuous monitoring with periodic ECG over the first 24 hours, which is
    the window in which the cardiac complications appear and in which almost
    all deaths occur.
  diagnosis_term:
    preferred_term: electrocardiography
    term:
      id: NCIT:C38053
      label: Electrocardiography
  markers: Rhythm, rate, repolarization change
  evidence:
  - reference: PMID:33094659
    reference_title: "Scorpion sting: N-terminal fragment of proB-type natriuretic peptide as an early predictor of pediatric cardiotoxicity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "subjected to 24 h cardiac monitoring with periodic ECG every 6 h"
    explanation: >-
      The monitoring protocol applied to all 483 symptomatic children in this
      prospective series, which is what makes it the observed practice rather
      than a recommendation.
  notes: >-
    Recorded because the entry carries both `Tachycardia` and `Bradycardia`
    phenotypes, and which of the two a patient shows is the bedside signal
    that most directly bears on which autonomic arm is dominant - the question
    the entry's two `mechanistic_hypotheses` disagree about. No cited source
    here claims ECG resolves that question.
animal_models:
- name: Lethally envenomed C57BL/6 mouse (Tityus serrulatus venom, 180 ug/kg i.p.)
  species: Mouse
  genotype: C57BL/6 wild type, with Il1r1-/-, Nlrp3-/-, Asc-/- and Casp1/11-/- knockouts used as mechanistic controls
  publication: PMID:33116136
  description: >-
    The model the whole emerging hypothesis rests on. Mice given a lethal
    intraperitoneal dose of Tityus serrulatus venom develop sweating, ocular
    and nasal secretion, lethargy and convulsion within an hour, with
    measurable rises in plasma adrenaline and acetylcholine, falling arterial
    pressure and heart rate, and death in half to all animals. Its value is
    that it is interventional where the human literature is observational:
    genetic knockouts and drugs can be applied to individual steps.
  evidence:
  - reference: PMID:33116136
    reference_title: Interleukin-1 receptor-induced PGE(2) production controls acetylcholine-mediated cardiac dysfunction and mortality during scorpion envenomation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Lethally envenomed C57Bl/6 (WT) mice (TsV, 180"
    explanation: >-
      The strain, the venom and the dose that define this model. Quoted short
      because the source renders the units with thin spaces and a minus-sign
      superscript immediately after; the full dose is stated in the model
      description and in `genotype` above.
  - reference: PMID:33116136
    reference_title: Interleukin-1 receptor-induced PGE(2) production controls acetylcholine-mediated cardiac dysfunction and mortality during scorpion envenomation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These data confirm that lethally envenomed mice present clinical autonomic manifestations similar to those observed in humans"
    explanation: >-
      The authors' own fidelity claim for the model, and the basis for
      treating it as informative about the human syndrome at all.
  modeled_mechanisms:
  - target: Autonomic Neurotransmitter Storm
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Both arms of the storm are reproduced and measured directly in plasma -
      adrenaline and acetylcholine together - alongside the autonomic clinical
      signs that define the syndrome in people.
    limitations: >-
      The route and dose are not those of a sting: an intraperitoneal bolus at
      a defined lethal dose is not a subcutaneous injection of unknown
      quantity, and nothing in the model reproduces the dependence on body
      mass that makes this a disease of children.
    readouts:
    - name: Plasma adrenaline and acetylcholine
      target: Autonomic Neurotransmitter Storm
      direction: INCREASED
      interpretation: >-
        Simultaneous elevation of both transmitters is the defining
        measurement of this node, and the reason the entry does not treat the
        storm as adrenergic alone.
      evidence:
      - reference: PMID:33116136
        reference_title: Interleukin-1 receptor-induced PGE(2) production controls acetylcholine-mediated cardiac dysfunction and mortality during scorpion envenomation.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "We detected a dramatic increase in the concentration of adrenaline and ACh compared to PBS-inoculated mice"
        explanation: The measurement itself, against a vehicle control.
    evidence:
    - reference: PMID:33116136
      reference_title: Interleukin-1 receptor-induced PGE(2) production controls acetylcholine-mediated cardiac dysfunction and mortality during scorpion envenomation.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "exhibited sweating, ocular secretion, nasal secretion, lethargy, and convulsion"
      explanation: >-
        The autonomic clinical picture reproduced in the model, which is what
        makes it informative for this node.
  - target: Venom-Triggered Cardiac IL-1R Signaling and PGE2 Production
    relationship: RECAPITULATES
    fidelity: UNKNOWN
    model_scale: CELLULAR
    description: >-
      This node exists only because of this model. Every step of it - the
      inflammasome-dependent IL-1 beta, the sustained PGE2, and the IL-1R
      requirement - was established here and has never been shown in a person.
    limitations: >-
      Fidelity is UNKNOWN rather than low or moderate because there is no
      human counterpart to compare against: the one human study of this axis
      reports an association between circulating IL-1 beta and cardiac
      abnormality and does not test the pathway.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        Tityus serrulatus is the Brazilian species this work uses, while most
        of the world's scorpion mortality is caused by Androctonus, Leiurus,
        Mesobuthus and Centruroides on other continents, whose venoms differ
        in toxin composition. Whether their venoms are sensed the same way by
        cardiac innate immunity is untested.
    - divergence_type: BOUNDARY_OMISSION
      materiality: QUALIFYING
      description: >-
        The sting is outside the model. Venom is delivered as an
        intraperitoneal bolus, so absorption from a subcutaneous depot, the
        dose actually injected by a scorpion, and the delay before care - all
        of which govern human outcome - are not represented.
    evidence:
    - reference: PMID:33116136
      reference_title: Interleukin-1 receptor-induced PGE(2) production controls acetylcholine-mediated cardiac dysfunction and mortality during scorpion envenomation.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Here, we show that scorpion envenomation induces autonomic hyperactivation and heart inflammation in mice."
      explanation: >-
        The claim this link carries, stated by the authors with its species
        restriction in the same sentence.
  - target: Cardiac Dysfunction and Pulmonary Edema
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Envenomed mice develop falling arterial pressure and heart rate within
      an hour and die, which is the cardiovascular collapse this node
      describes.
    limitations: >-
      The model's cardiac endpoint is haemodynamic collapse and death within
      about an hour. The human node includes pulmonary oedema and a
      myocarditis that is reversible over days in survivors, neither of which
      this model reports - so it captures the fatal arm and not the recovery
      arm that most patients follow.
    readouts:
    - name: Mean arterial pressure and heart rate
      target: Cardiac Dysfunction and Pulmonary Edema
      direction: DECREASED
      interpretation: >-
        Falling pressure and falling rate together is the haemodynamic
        signature the cholinergic account predicts.
      evidence:
      - reference: PMID:33116136
        reference_title: Interleukin-1 receptor-induced PGE(2) production controls acetylcholine-mediated cardiac dysfunction and mortality during scorpion envenomation.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "we observed cardiac disorders with diminished mean arterial pressure and heart rates"
        explanation: The measured cardiovascular outcome in envenomed mice.
discussions:
- discussion_id: which_autonomic_arm_kills
  kind: KNOWLEDGE_GAP
  prompt: >-
    Which arm of the autonomic storm actually produces the fatal cardiac
    dysfunction in human scorpion envenomation - the adrenergic one, or the
    IL-1R/PGE2-driven cholinergic one?
  attaches_to:
  - pathophysiology#Catecholamine-Mediated Myocardial Injury
  - pathophysiology#Excessive Vagal Acetylcholine Release at the Heart
  - mechanistic_hypotheses#adrenergic_catecholamine_storm
  - mechanistic_hypotheses#il1r_pge2_cholinergic_axis
  rationale: >-
    Both arms are real and both are measurable in the same envenomed animal -
    adrenaline and acetylcholine rise together. The question is which one the
    heart failure follows from, and the two answers point at opposite drugs.
    The canonical account is adrenergic, and prazosin's clinical benefit is
    usually read as supporting it. The mouse account is cholinergic, and it is
    supported by something stronger than a correlation: IL-1R knockout,
    dexamethasone, atropine and vagotomy each abolish mortality, which is four
    interventions at three different points of one pathway.

    What makes this more than an academic dispute is that the two accounts
    prescribe differently. Under the canonical model an alpha-1 blocker treats
    the lethal mechanism; under the emerging one it treats a real but
    non-lethal arm while the fatal pathway runs untouched - including, the
    authors note, untouched by antivenom. A trial of early dexamethasone or of
    atropine in human envenomation would separate them; none has been done.

    Note also that the evidence is asymmetric in kind, not just in strength.
    The adrenergic account rests on human clinical observation and on a
    therapeutic response; the cholinergic one rests on mechanistic intervention
    in mice. Neither body of evidence is of the type that would refute the
    other.
  evidence:
  - reference: PMID:15687982
    reference_title: "[Cardiovascular dysfunction following severe scorpion envenomation. Mechanisms and physiopathology]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Adrenergic myocarditis, toxic myocarditis and myocardial ischemia are the 3 mechanisms that explain the cardiac dysfunction."
    explanation: The canonical side of the disagreement, in a human clinical review.
  - reference: PMID:33116136
    reference_title: Interleukin-1 receptor-induced PGE(2) production controls acetylcholine-mediated cardiac dysfunction and mortality during scorpion envenomation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "IL-1R deficiency, the treatment with a high dose of dexamethasone or blockage of parasympathetic signaling using atropine or vagotomy, abolished heart failure and mortality of envenomed mice."
    explanation: >-
      The other side, and the reason it cannot be dismissed as correlation -
      four interventions on one pathway, each abolishing the outcome.
- discussion_id: il1r_axis_is_mouse_only
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Does the IL-1R/PGE2/acetylcholine axis shown in envenomed mice operate in
    human scorpion envenomation?
  attaches_to:
  - pathophysiology#Venom-Triggered Cardiac IL-1R Signaling and PGE2 Production
  - pathophysiology#Excessive Vagal Acetylcholine Release at the Heart
  - treatments#Early dexamethasone
  rationale: >-
    Every step of this pathway - the inflammasome-dependent IL-1 beta, the
    sustained PGE2, the EP2/EP4-mediated acetylcholine release, and the rescue
    by dexamethasone, atropine or vagotomy - was established in mice given
    Tityus serrulatus venom intraperitoneally at a defined lethal dose. That is
    a well-controlled demonstration and it is not a human result.

    Three specific reasons to hold the translation open. The route and dose are
    not those of a sting: an intraperitoneal bolus at 180 micrograms per
    kilogram is not a subcutaneous envenomation of uncertain quantity. The
    species is one whose venom has been studied in Brazil, while most of the
    world's scorpion mortality is caused by other genera on other continents.
    And the human evidence that does exist for an inflammatory contribution is
    correlational - circulating IL-1 beta separates patients with and without
    cardiac abnormality - which is consistent with the pathway being causal,
    with it being a marker of severity, and with both. Note that the same
    study found the pancreatic association statistically insignificant, so the
    human data support the cardiac half of the mouse account and not the
    pancreatic half, even though the paper's title names both.

    This is filed as a model mismatch rather than a knowledge gap because the
    evidence is not absent: it exists, it is good, and what is open is whether
    it transfers. Resolving it needs a human study, and the obvious one - early
    dexamethasone against standard care - is also the one the mouse work
    proposes.
  evidence:
  - reference: PMID:33116136
    reference_title: Interleukin-1 receptor-induced PGE(2) production controls acetylcholine-mediated cardiac dysfunction and mortality during scorpion envenomation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "PGE2 signaling via EP2/4 receptors mediates excessive ACh release, which in turn causes the heart failure of envenomed mice"
    explanation: >-
      The pathway whose translation is in question, stated with its species
      restriction in the same clause.
  - reference: PMID:41327440
    reference_title: "The correlation between Interleukin 1 β (IL-1β) as an inflammatory marker and Malondialdehyde (MDA) as a lipid peroxidation marker and the development of cardiac and pancreatic complications in humans suspected to scorpion poisoning."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: "Recent experimental studies on animals were held to prove the correlation between interleukin 1 β (IL-1β), lipid peroxidation and nitric oxide (NO) production in the development of cardiac and pancreatic abnormalities after scorpion venom exposure."
    explanation: >-
      The one human study on this axis opens by stating that the causal work
      was done in animals, which is the mismatch this discussion is about.
      Graded MODEL_ORGANISM because `evidence_source` classifies the evidence
      the quoted text describes, and this sentence describes animal studies -
      the same rule the entry applies in the other direction elsewhere.
  - reference: PMID:41327440
    reference_title: "The correlation between Interleukin 1 β (IL-1β) as an inflammatory marker and Malondialdehyde (MDA) as a lipid peroxidation marker and the development of cardiac and pancreatic complications in humans suspected to scorpion poisoning."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Regarding cardiac abnormality, there were significant statistical differences with both levels of IL-1β and MDA."
    explanation: >-
      The study's own human result, and the whole of it: IL-1 beta separates
      patients with and without cardiac abnormality. INDIRECT because an
      association between a cytokine level and a complication does not
      establish the causal pathway the mouse work describes.

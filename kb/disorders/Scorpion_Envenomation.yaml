- name: Catecholamine-Mediated Myocardial Injury
  biological_scale: TISSUE
  description: >-
    Sustained adrenergic stimulation injures the myocardium by three routes that
    the literature has not fully separated: a direct adrenergic myocarditis, a
    toxic myocarditis attributed to venom itself, and myocardial ischaemia driven
    by raised oxygen demand together with cytokine and neuropeptide Y effects on
    the coronary vessels.
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  locations:
  - preferred_term: heart
    term:
      id: UBERON:0000948
      label: heart
  downstream:

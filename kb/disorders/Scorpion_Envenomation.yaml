name: Scorpion Envenomation
creation_date: '2026-09-18T12:05:00Z'
category: Injury
description: >-
  Systemic poisoning following the sting of a scorpion, overwhelmingly of the
  family Buthidae. The venom's small peptide neurotoxins act on voltage-gated
  sodium channels of excitable membranes, and what follows is driven less by
  direct tissue injury than by the host's own response: a neurotransmitter
  storm releasing catecholamines and acetylcholine together, ending in cardiac
  dysfunction and pulmonary oedema. Stings are counted in the millions annually
  and the deaths are concentrated in children. One genus is different in kind -
  Hemiscorpius lepturus has a cytotoxic rather than a neurotoxic venom and
  causes dermonecrosis, haemolysis and thrombotic microangiopathy instead, so
  the entry models the two as separate subtypes rather than as one disease with
  a wide spectrum.
notes: >-
  No GeneReviews chapter exists for this disease, and none is expected: it is an
  acquired envenomation with no Mendelian basis, so `just check-genereviews`
  returns NO_CHAPTER for both Bookshelf collections. There is likewise no
  `genetic:` section. The research report searched for host susceptibility loci
  and found none established; the age dependence that dominates outcome is body
  mass and cardiovascular reserve rather than genotype, which is recorded in the
  `environmental` risk prose instead of being curated as disease genes.

  Three scope exclusions, recorded so they read as decisions rather than
  oversights. **Only alpha-toxins are modelled.** Scorpion venom also carries
  beta-NaTx, which shifts the sodium-channel activation threshold rather than
  blocking inactivation, and potassium-channel toxins; neither is in the
  pathograph, because the entry's chain rests on the structurally resolved
  site-3 mechanism and adding the others would mean asserting a chain the
  cited sources do not resolve. **The takotsubo analogy is not curated.**
  `PMID:26135709` proposes scorpion cardiomyopathy as a model for takotsubo
  syndrome, which is a genuinely interesting parallel to the catecholamine
  node - but it is a Letter with no abstract in PubMed, so there is nothing
  quotable and nothing can be built on it. Its cache file stays committed
  because the deep-research report cites it; it is the entry that does not,
  and this sentence is the reason. **The cytotoxic branch stops at the renal
  outcome.** Hepatotoxicity and the late necrotic ulcer's secondary infection
  are both reported for Hemiscorpius lepturus and are not modelled here.
disease_term:
  term:
    id: MONDO:0018755
    label: scorpion envenomation
  preferred_term: Scorpion envenomation
parents:
- Envenomation
clinical_burden:
  burden_level: VARIABLE
  rationale: >-
    The overwhelming majority of stings cause severe local pain and nothing
    else, while a small minority progress within hours to myocarditis,
    pulmonary oedema and death. Over 1.2 million stings a year produce more than
    3250 deaths, a case fatality of 0.27% - but that figure averages across a
    population in which children carry almost all the mortality. No single tier
    represents both ends, which is what `VARIABLE` is for.
  evidence:
  - reference: PMID:18579104
    reference_title: "Epidemiology of scorpionism: a global appraisal."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The annual number of scorpion stings exceeds 1.2 million leading to more than 3250 deaths (0.27%)."
    explanation: The denominator and the numerator behind the low average case fatality.
  - reference: PMID:18579104
    reference_title: "Epidemiology of scorpionism: a global appraisal."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Although adults are more often concerned, children experience more severe envenomations and among them, mortality is higher."
    explanation: >-
      The spread the average hides, and the reason a single burden tier would
      misdescribe this disease.
has_subtypes:
- name: Neurotoxic
  display_name: Neurotoxic envenomation (Buthidae)
  description: >-
    The form responsible for essentially all scorpion mortality worldwide.
    Buthid venom is neurotropic and not cytotoxic: it produces no local tissue
    reaction to speak of, and the illness is entirely a consequence of
    sodium-channel-driven autonomic discharge. All of the pathophysiology in
    this entry from the sodium-channel node onward describes this subtype.
  evidence:
  - reference: PMID:9679690
    reference_title: "Cutaneous manifestations of the Hemiscorpius lepturus sting: a clinical study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Different species of the Buthidae family, which were responsible for the remaining 90% of scorpion stings, have a neurotropic and noncytotoxic venom and, as a result, induce no cutaneous reaction."
    explanation: >-
      States the defining property of this subtype and, by contrast, of the
      other one - in a series large enough to give the proportions.
- name: Cytotoxic
  display_name: Cytotoxic envenomation (Hemiscorpius lepturus)
  description: >-
    A mechanistically separate disease that happens to be caused by a scorpion.
    Hemiscorpius lepturus venom is cytolytic rather than neurotoxic, and the
    sting is characteristically not painful at the time. What follows is
    delayed dermonecrosis, intravascular haemolysis, acquired ADAMTS13
    deficiency with autoantibody, and thrombotic microangiopathy with acute
    kidney injury. None of the autonomic storm chain applies.
  evidence:
  - reference: PMID:9679690
    reference_title: "Cutaneous manifestations of the Hemiscorpius lepturus sting: a clinical study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "HL venom is cytotoxic, and HL is the only scorpion whose venom induces a toxic reaction."
    explanation: Establishes the separate venom class this subtype turns on.
mechanistic_hypotheses:
- hypothesis_group_id: adrenergic_catecholamine_storm
  hypothesis_label: Catecholamine storm drives the fatal cardiac dysfunction
  status: CANONICAL
  description: >-
    The long-standing account. Sodium-channel toxins drive sympathetic
    terminals and the adrenal medulla to release catecholamines in bulk;
    the resulting adrenergic myocarditis, raised afterload and myocardial
    ischaemia produce left ventricular failure and pulmonary oedema. This is
    the model that motivates prazosin, and the model under which the
    alpha-1 blocker's clinical benefit is read as mechanistic confirmation.
  evidence:
  - reference: PMID:15687982
    reference_title: "[Cardiovascular dysfunction following severe scorpion envenomation. Mechanisms and physiopathology]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Adrenergic myocarditis, toxic myocarditis and myocardial ischemia are the 3 mechanisms that explain the cardiac dysfunction."
    explanation: >-
      The canonical account stated as three adrenergic and ischaemic routes,
      with no cholinergic arm among them.
  - reference: PMID:37018229
    reference_title: "Scorpion envenomation-associated myocarditis: A systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The management typically included inotropes (especially dobutamine), prazosin, diuretics, nitroglycerine and digoxin, when indicated."
    explanation: >-
      The practice this hypothesis generates - alpha-1 blockade and inotropic
      support - pooled across 703 human cases.
- hypothesis_group_id: il1r_pge2_cholinergic_axis
  hypothesis_label: An IL-1R/PGE2/acetylcholine neuro-immune axis drives it instead
  status: EMERGING
  description: >-
    A mouse account that puts the fatal arm on the other side of the autonomic
    nervous system. Venom recognition drives cardiac IL-1 receptor signalling
    and prostaglandin E2 production; PGE2 acting at EP2/EP4 receptors then
    drives excessive vagal acetylcholine release, and it is that cholinergic
    signal, not the adrenergic one, which produces the heart failure. Four
    independent interventions - IL-1R knockout, high-dose dexamethasone,
    atropine, and vagotomy - each abolish mortality in envenomed mice, and the
    authors note the pathway is untouched by antivenom. Recorded as EMERGING
    rather than ALTERNATIVE because nothing in it has been tested in humans.
  evidence:
  - reference: PMID:33116136
    reference_title: Interleukin-1 receptor-induced PGE(2) production controls acetylcholine-mediated cardiac dysfunction and mortality during scorpion envenomation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "cardiac dysfunction and fatal outcomes caused by lethal scorpion envenomation in mice are mediated by a neuro-immune interaction linking IL-1 receptor signaling, prostaglandin E2, and acetylcholine release"
    explanation: >-
      The hypothesis in the authors' own words, with the species it was
      demonstrated in stated in the same sentence.
  - reference: PMID:33116136
    reference_title: Interleukin-1 receptor-induced PGE(2) production controls acetylcholine-mediated cardiac dysfunction and mortality during scorpion envenomation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "we introduce a novel pathway that is targeted by dexamethasone, but not by anti-scorpion venom serum"
    explanation: >-
      What makes the two hypotheses prescribe differently rather than being
      two descriptions of one thing.
pathophysiology:
- name: Scorpion Venom Neurotoxin Binding to Voltage-Gated Sodium Channels
  biological_scale: MOLECULAR
  description: >-
    Buthid venom carries small peptide neurotoxins that bind the voltage-sensing
    domains of voltage-gated sodium channels. The alpha-toxins are the
    structurally resolved case: AaH2 from Androctonus australis wedges into
    voltage-sensing domain IV and traps it in a deactivated state, so the S4
    helix cannot make the translation that normally unlatches the fast
    inactivation gate. The modifier on the channel activity is
    `GAIN_OF_FUNCTION` rather than `INCREASED` deliberately: the claim is not
    that sodium current is quantitatively larger but that the channel has been
    taken outside its own regulatory constraint, since the gate that terminates
    its opening no longer operates. There is no host variant anywhere in this,
    so there is nothing for `functional_impact_category` to describe - the
    gain of function is imposed on a normal channel by a bound peptide.
  molecular_functions:
  - preferred_term: voltage-gated sodium channel activity, with fast inactivation disabled
    term:
      id: GO:0005248
      label: voltage-gated sodium channel activity
    modifier: GAIN_OF_FUNCTION
  downstream:
  - target: Failure of Sodium Channel Fast Inactivation and Repetitive Firing
    causal_link_type: DIRECT
    description: >-
      Trapping VSD4 in its deactivated state is the same event as preventing
      fast inactivation - the structure shows the mechanical linkage directly.
    evidence:
    - reference: PMID:30733386
      reference_title: Structural basis of α-scorpion toxin action on Na(v) channels.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "In the absence of AaH2, the S4 helix of VSD4 undergoes a ~13-angstrom translation to unlatch the intracellular fast-inactivation gating machinery."
      explanation: >-
        Names the movement the toxin prevents, which is what connects toxin
        binding to the loss of inactivation in the next node.
  - target: Local paresthesia at bite site
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The immediate local pain is attributed to the venom arriving in the
      tissue, and it is the earliest sign of envenomation. Marked
      INDIRECT_UNKNOWN_INTERMEDIATES rather than DIRECT on purpose: the source
      links the pain to venom penetration without naming the receptor or the
      afferent population it acts on, so the steps between this node and the
      symptom are not established here. The obvious candidate - the same
      sodium-channel action on peripheral nociceptors - is not what the cited
      sentence says.
    evidence:
    - reference: PMID:22826633
      reference_title: Emerging options for the management of scorpion stings.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "The first symptom of scorpion envenoming is localized pain, which reflects the penetration of the venom and is a valuable warning signal, especially in children."
      explanation: >-
        Attributes the local pain to the venom reaching the tissue and places
        it first in the sequence, which is the edge asserted here.
  evidence:
  - reference: PMID:30733386
    reference_title: Structural basis of α-scorpion toxin action on Na(v) channels.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "AaH2 wedges into voltage-sensing domain IV (VSD4) to impede fast activation by trapping a deactivated state"
    explanation: >-
      The binding event this node records, at 3.5-angstrom resolution in a
      toxin-channel complex.
- name: Failure of Sodium Channel Fast Inactivation and Repetitive Firing
  biological_scale: CELLULAR
  description: >-
    Channels that cannot inactivate leave the membrane depolarized and firing
    repetitively. Because sodium-channel fast inactivation is what terminates
    every action potential, disabling it converts a single stimulus into a
    train - the cellular event underlying the whole syndrome.
  biological_processes:
  - preferred_term: membrane depolarization during action potential
    term:
      id: GO:0086010
      label: membrane depolarization during action potential
    modifier: INCREASED
  cell_types:
  - preferred_term: sympathetic postganglionic neuron
    term:
      id: CL:0011103
      label: sympathetic neuron
  downstream:
  - target: Autonomic Neurotransmitter Storm
    causal_link_type: DIRECT
    description: >-
      Repetitive firing at autonomic terminals is what empties them.
    evidence:
    - reference: PMID:33116136
      reference_title: Interleukin-1 receptor-induced PGE(2) production controls acetylcholine-mediated cardiac dysfunction and mortality during scorpion envenomation.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: "toxins present in TsV activate ion channels that induce a neuroexcitatory syndrome known as a neurotransmitter storm"
      explanation: >-
        States the channel-to-storm step. Graded HUMAN_CLINICAL with
        quote_role BACKGROUND because the sentence is this mouse paper's
        introduction restating the established human syndrome, not its own
        result.
  evidence:
  - reference: PMID:30733386
    reference_title: Structural basis of α-scorpion toxin action on Na(v) channels.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Fast inactivation of voltage-gated sodium (Nav) channels is essential for electrical signaling"
    explanation: >-
      Why disabling inactivation is not a subtle perturbation: it removes the
      mechanism that ends each action potential.
- name: Autonomic Neurotransmitter Storm
  biological_scale: ORGANISM
  description: >-
    Both divisions of the autonomic nervous system discharge at once. Sympathetic
    terminals and the adrenal medulla release catecholamines while parasympathetic
    terminals release acetylcholine, so the clinical picture is not a coherent
    adrenergic or cholinergic syndrome but both superimposed - tachycardia with
    hypersalivation, hypertension with vomiting, sweating with bradycardia.
  biological_processes:
  - preferred_term: catecholamine secretion
    term:
      id: GO:0050432
      label: catecholamine secretion
    modifier: INCREASED
  - preferred_term: acetylcholine secretion
    term:
      id: GO:0061526
      label: acetylcholine secretion
    modifier: INCREASED
  cell_types:
  - preferred_term: adrenal medulla chromaffin cell
    term:
      id: CL:0000336
      label: adrenal medulla chromaffin cell
  downstream:
  - target: Catecholamine-Mediated Myocardial Injury
    causal_link_type: DIRECT
    hypothesis_groups:
    - adrenergic_catecholamine_storm
    description: >-
      The adrenergic arm, and the one the canonical account holds responsible.
  - target: Fasciculations
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:32899951
      reference_title: "Autopsy Findings in Case of Fatal Scorpion Sting: A Systematic Review of the Literature."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Edema, erythema, paresthesia, muscle fasciculations and numbness may occur at the site of the sting"
      explanation: >-
        Places muscle fasciculation among the direct neuroexcitatory effects.
        Note this sentence describes the sting site, where the entry's
        fasciculation phenotype is not site-restricted - it is cited for the
        mechanism, with the systemic distribution carried by the phenotype's
        own PMID:34055554 evidence.
  - target: Tremor

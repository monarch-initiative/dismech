    reference_title: Interleukin-1 receptor-induced PGE(2) production controls acetylcholine-mediated cardiac dysfunction and mortality during scorpion envenomation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "TsV increased NLRP3, Asc, and Casp1/11−dependent IL-1β release"
    explanation: >-
      The inflammasome dependency that grounds this node's conformance to the
      NLRP3 module. The three gene names qualify "dependent IL-1 beta release":
      the claim is that release required NLRP3, ASC and caspase-1, which is
      assembly-and-activation evidence rather than transcript upregulation. The
      character between "11" and "dependent" is U+2212 MINUS SIGN as the source
      renders it, not a hyphen.
- name: Excessive Vagal Acetylcholine Release at the Heart
  biological_scale: ORGANISM
  description: >-
    The cholinergic arm of the emerging account. Parasympathetic output to the
    heart is driven beyond the range the organ tolerates, producing the
    bradycardia and arrhythmia of the syndrome and, in mice, the fatal cardiac
    dysfunction itself.
  biological_processes:
  - preferred_term: acetylcholine secretion
    term:
      id: GO:0061526
      label: acetylcholine secretion
    modifier: INCREASED
  evidence:
  - reference: PMID:33116136
    reference_title: Interleukin-1 receptor-induced PGE(2) production controls acetylcholine-mediated cardiac dysfunction and mortality during scorpion envenomation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "PGE2 signaling via EP2/4 receptors mediates excessive ACh release, which in turn causes the heart failure of envenomed mice"
    explanation: >-
      Establishes this node directly - that acetylcholine release is driven to
      excess and that it is what produces the heart failure. The haemodynamic
      measurement is cited on the animal model instead, where it sits before
      the mechanism is established and so cannot carry it.
  downstream:
  - target: Cardiac Dysfunction and Pulmonary Edema
    causal_link_type: DIRECT
    hypothesis_groups:
    - il1r_pge2_cholinergic_axis
    description: >-
      The claim that distinguishes this hypothesis from the canonical one: the
      heart failure is cholinergic in origin.
    evidence:
    - reference: PMID:33116136
      reference_title: Interleukin-1 receptor-induced PGE(2) production controls acetylcholine-mediated cardiac dysfunction and mortality during scorpion envenomation.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "IL-1R deficiency, the treatment with a high dose of dexamethasone or blockage of parasympathetic signaling using atropine or vagotomy, abolished heart failure and mortality of envenomed mice."
      explanation: >-
        Four independent interventions at three different points of this arm
        each abolish the outcome, which is what makes the edge causal rather
        than correlative in the model.
- name: Cardiac Dysfunction and Pulmonary Edema
  biological_scale: ORGANISM
  description: >-
    The convergence point of both hypothesis arms and the proximate cause of
    almost every scorpion-sting death. Left ventricular failure with pulmonary
    oedema develops within hours, is far commoner in children, and is reversible
    in survivors - left ventricular function recovers in almost all who live.

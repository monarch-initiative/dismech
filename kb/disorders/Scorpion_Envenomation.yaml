  - target: Acute pancreatitis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Drawn as an indirect edge with unknown intermediates on purpose. The
      human study establishes pancreatic injury after envenomation and

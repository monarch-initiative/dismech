- name: Cytolytic Venom Membrane Damage
  biological_scale: MOLECULAR
  description: >-
    The Hemiscorpius lepturus branch, and the point at which this subtype leaves
    the rest of the entry. The venom is cytolytic rather than neurotoxic, lysing
    cell membranes at the sting site and in the circulation. The sting itself is
    characteristically not painful, which is why presentation is late.
  notes: >-
    Named for the effect rather than the enzyme. The literature attributes the
    cytolysis to a lysophospholipase D and related lytic enzymes, but no source
    cited in this entry says so and the node carries no `molecular_functions`
    binding to hold the claim, so naming it for a phospholipase would have
    asserted an enzymology the entry does not evidence.
  downstream:
  - target: Intravascular Hemolysis with Acquired ADAMTS13 Deficiency
    causal_link_type: DIRECT
  - target: Skin ulcer
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:9679690
    reference_title: "Cutaneous manifestations of the Hemiscorpius lepturus sting: a clinical study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "HL venom is cytotoxic, and HL is the only scorpion whose venom induces a toxic reaction."
    explanation: The venom property this branch turns on.
- name: Intravascular Hemolysis with Acquired ADAMTS13 Deficiency
  biological_scale: ORGANISM
  description: >-
    Haemolysis is followed by a fall in ADAMTS13 together with an anti-ADAMTS13
    IgG in almost every severe case - an acquired, antibody-mediated deficiency
    of the von Willebrand factor-cleaving protease rather than consumption
    alone. The deficiency tracks the renal outcome exactly: every child with
    acute kidney injury had it, and no child with normal ADAMTS13 developed
    renal failure.
  downstream:
  - target: Thrombotic Microangiopathy and Acute Kidney Injury
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:23893367
      reference_title: High frequency of acquired ADAMTS13 deficiency after hemolysis in Hemiscorpius Lepturus (scorpion) stung children.

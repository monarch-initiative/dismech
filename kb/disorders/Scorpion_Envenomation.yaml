    reference_title: "Scorpion sting: N-terminal fragment of proB-type natriuretic peptide as an early predictor of pediatric cardiotoxicity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "The sensitivity of NT-proBNP for the diagnosis of myocardial injury at hospital admission was significantly higher than that of CPK-MB."
    explanation: >-
      The head-to-head comparison against the other marker curated here, in the
      same patients and at the same time point.
  readouts:
  - target: Cardiac Dysfunction and Pulmonary Edema
    relationship: PREDICTS
    direction: POSITIVE
    endpoint_context: PROGNOSTIC
    interpretation: >-
      An admission NT-proBNP identifies the children who will develop
      cardiotoxicity, hours before echocardiography or the clinical picture
      does.
    evidence:
    - reference: PMID:33094659
      reference_title: "Scorpion sting: N-terminal fragment of proB-type natriuretic peptide as an early predictor of pediatric cardiotoxicity."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: "NT-proBNP may be a valuable and sensitive laboratory biomarker to predict cardiotoxicity of scorpion sting in the early hours."
      explanation: >-
        The authors' own statement of the prognostic claim this readout makes.
    - reference: PMID:33994108
      reference_title: The Role of ProBNP on Prognosis in Scorpion Stings.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: "ProBNP 1 was significantly higher in the severe group at admission (P=0.016)."
      explanation: >-
        A second, independent paediatric series reaching the same conclusion
        from the admission value, against a severity grading rather than
        against a cardiac endpoint.
  - target: Cardiac Dysfunction and Pulmonary Edema
    relationship: CORRELATES_WITH
    direction: NEGATIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      The level tracks inversely with measured ventricular performance, which
      is what makes it a readout of this node rather than a general severity
      marker.
    evidence:
    - reference: PMID:33994108
      reference_title: The Role of ProBNP on Prognosis in Scorpion Stings.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: "There was a negative correlation between proBNP and echocardiographic findings involving ejection fraction and shortening fraction (r=-0.703, P=0.002)."
      explanation: >-
        Ties the marker directly to ejection and shortening fraction, which is
        the node this readout points at. Direction is NEGATIVE because the
        quantity correlated is preserved function, not injury.
- name: Creatine kinase MB (CK-MB)
  presence: INCREASED
  subtype: Neurotoxic
  biomarker_term:
    preferred_term: creatine kinase MB
    term:
      id: NCIT:C122778
      label: Creatine Kinase MB
  notes: >-
    Curated alongside NT-proBNP rather than instead of it, because the two are
    not measuring the same thing: CK-MB reports myocyte injury and NT-proBNP
    reports wall stress. In this disease the injury marker is the later and
    less sensitive of the two.
  evidence:
  - reference: PMID:33094659
    reference_title: "Scorpion sting: N-terminal fragment of proB-type natriuretic peptide as an early predictor of pediatric cardiotoxicity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Assessment of CPK-MB levels showed a significant increase in all moderate to severe cases 6 h post-envenomation."
    explanation: >-
      The elevation, and its timing - six hours, where NT-proBNP was already
      raised on admission in the same cohort.
  readouts:
  - target: Catecholamine-Mediated Myocardial Injury
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      CK-MB release reports myocardial cell injury, which is the lesion this
      node asserts, rather than the ventricular failure it produces.
    evidence:
    - reference: PMID:33094659
      reference_title: "Scorpion sting: N-terminal fragment of proB-type natriuretic peptide as an early predictor of pediatric cardiotoxicity."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: "Assessment of CPK-MB levels showed a significant increase in all moderate to severe cases 6 h post-envenomation."
      explanation: >-
        The measurement is of a cardiac-specific enzyme in circulation, so it
        reports myocyte membrane injury at this node.
- name: Cardiac troponin
  presence: INCREASED
  subtype: Neurotoxic
  biomarker_term:
    preferred_term: cardiac troponin I
    term:
      id: NCIT:C17343
      label: Troponin I
  notes: >-
    The one marker here where the evidence is split, and the split appears to
    be an assay effect rather than a disagreement about the biology: a
    conventional troponin I did not separate severity groups, while an
    ultrasensitive assay against an echocardiographic endpoint performed better
    than either new marker tested beside it. Both results are recorded.
  evidence:
  - reference: PMID:39842516
    reference_title: New biomarkers in scorpion stings.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Ultrasensitive troponin presented an AUC of 0.89, with a sensitivity of 84.6%."
    explanation: >-
      The ultrasensitive assay against echocardiographically confirmed left
      ventricular dysfunction, and the best discrimination reported in that
      study.
  - reference: PMID:33994108
    reference_title: The Role of ProBNP on Prognosis in Scorpion Stings.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "There was no difference between the troponin I values (P=0.051)."
    explanation: >-
      A null result for conventional troponin I, in the same patients and at
      the same time point where proBNP did separate the groups. REFUTE against
      the claim that troponin is informative here, recorded rather than
      dropped - the two studies used different assays and different endpoints,
      which is the most likely reason they disagree.
  readouts:
  - target: Cardiac Dysfunction and Pulmonary Edema
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      With a high-sensitivity assay, circulating troponin detects the
      ventricular dysfunction this node describes. Read together with the
      null conventional-assay result recorded above.
    evidence:
    - reference: PMID:39842516
      reference_title: New biomarkers in scorpion stings.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: "Ultrasensitive troponin presented an AUC of 0.89, with a sensitivity of 84.6%."
      explanation: >-
        Discrimination against cardiac dysfunction identified by cardiac
        ultrasound, which is this node.
- name: Soluble ST2 (sST2)
  presence: INCREASED
  subtype: Neurotoxic
  biomarker_term:
    preferred_term: soluble ST2 (sST2)
    term:
      id: NCIT:C106011
      label: Interleukin-1 Receptor-Like 1
  notes: >-
    Bound to the parent protein because NCIT has no term for the soluble
    isoform. OLS `q=Soluble ST2, ontology=ncit` returns nothing at all;
    `q=ST2, ontology=ncit` returns `NCIT:C105385` ST2 Gene, `NCIT:C106009`
    IL1RL1 wt Allele, `NCIT:C192871` IL1RL1 Positive, `NCIT:C187445` ST2
    Diffuse Large B-Cell Lymphoma and `NCIT:C171824` Astegolimab, none of
    which is the circulating decoy receptor; `q=Interleukin 1 Receptor Like 1,
    ontology=ncit` returns the protein `NCIT:C106011` and the measurement
    `NCIT:C142281`. The isoform identity is carried in `preferred_term`.
    Worth noting that ST2 is an IL-1 family receptor, so a marker of the
    inflammatory arm is doing diagnostic work here whichever hypothesis turns
    out to be right - but the study measures it as a cardiac-dysfunction
    marker and makes no claim about the IL-1R pathway.
  evidence:
  - reference: PMID:39842516
    reference_title: New biomarkers in scorpion stings.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "The biomarkers of sST2 and FABP-3 showed an association with left ventricular dysfunction, presenting AUCs of 0.77 and 0.81, respectively."
    explanation: >-
      The result establishing sST2 as a candidate marker in this disease, with
      its discrimination quantified.
  readouts:
  - target: Cardiac Dysfunction and Pulmonary Edema
    relationship: CORRELATES_WITH
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      A candidate marker, not an established one: one cross-sectional
      single-centre study of 49 patients, without serial measurement.
    evidence:
    - reference: PMID:39842516
      reference_title: New biomarkers in scorpion stings.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: "The cut-off values determined for both biomarkers showed a sensitivity of 92.3%."
      explanation: >-
        The sensitivity at the study's own cut-off, which is what a diagnostic
        readout claim rests on.
- name: Heart-type fatty acid binding protein (FABP3)
  presence: INCREASED
  subtype: Neurotoxic
  biomarker_term:
    preferred_term: heart-type fatty acid binding protein
    term:
      id: NCIT:C20974
      label: Fatty Acid-Binding Protein, Heart
  notes: >-
    Curated with sST2 because they come from the same study and carry the same
    caveats. FABP3 is a small cytosolic protein released early from injured
    myocytes, so on mechanism it belongs beside CK-MB rather than beside
    NT-proBNP - but the study that measures it here evaluates it against
    echocardiographic dysfunction, so that is the node this readout points at.
  evidence:
  - reference: PMID:39842516
    reference_title: New biomarkers in scorpion stings.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "The biomarkers of sST2 and FABP-3 showed an association with left ventricular dysfunction, presenting AUCs of 0.77 and 0.81, respectively."
    explanation: >-
      The result establishing FABP3 as a candidate marker here, and the better
      discriminating of the two new markers tested.
  readouts:
  - target: Cardiac Dysfunction and Pulmonary Edema
    relationship: CORRELATES_WITH
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      Same standing and the same limits as sST2 - 49 patients, one centre, no
      serial sampling - and evaluated against the same echocardiographic
      endpoint.
    evidence:
    - reference: PMID:39842516
      reference_title: New biomarkers in scorpion stings.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: "The study showed an association between sST2 and FABP-3, as well as the presence of acute cardiac dysfunction, identified by cardiac ultrasound."
      explanation: >-
        The association stated against the endpoint that defines this node -
        acute cardiac dysfunction on ultrasound - rather than against a
        clinical severity grade.
environmental:
- name: Scorpion sting delivering neurotoxic venom
  description: >-
    The exposure is an injection, not an ingestion or an inhalation, which is
    why dose scales with body mass and why children are the ones who die. Stings
    are domestic and rural in the great majority, concentrated in seven regions
    covering some 2.3 billion people.
  exposure_term:
    preferred_term: envenomation by buthid scorpion neurotoxins
    term:
      id: ECTO:0000730
      label: exposure to neurotoxin
  exposure_classifications:
    hazard_agent_type:
    - classification_value: BIOLOGICAL
    exposure_duration:
    - classification_value: ACUTE
  influences_mechanisms:
  - target: Scorpion Venom Neurotoxin Binding to Voltage-Gated Sodium Channels
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      The sting is what delivers the toxins to the channels; there is no other
      route into this disease.
    evidence:
    - reference: PMID:34055554
      reference_title: Neurological and Systemic Manifestations of Severe Scorpion Envenomation.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "The toxin released by the sting stimulates the autonomic nervous system (ANS), sympathetic and parasympathetic, which activates the coagulation cascade."
      explanation: States the sting-to-mechanism step this edge asserts.
  - target: Venom-Triggered Cardiac IL-1R Signaling and PGE2 Production
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      The inflammatory arm is drawn from the exposure rather than from the
      autonomic storm, because in the source it does not run through it: venom
      reaching the heart is recognised directly by resident cardiac cells, not
      by way of neurotransmitter release. An earlier draft hung this edge off
      the storm node while its own description said the two run in parallel,
      which made the graph say something the curation denied.
    evidence:
    - reference: PMID:33116136
      reference_title: Interleukin-1 receptor-induced PGE(2) production controls acetylcholine-mediated cardiac dysfunction and mortality during scorpion envenomation.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Cardiac fibroblasts respond to TsV and produce PGE2 and IL-1β in vitro."
      explanation: >-
        The venom is sensed by cardiac cells directly, which is what makes this
        an edge from the exposure rather than from the neurotransmitter storm.
  notes: >-
    Bound to `ECTO:0000730` exposure to neurotoxin, anchored on `CHEBI:50910`
    neurotoxin, which is exact for the agent class: the buthid venom's active
    principles are sodium-channel neurotoxins. ECTO has no scorpion, venom or
    sting class. The searches, against the pinned local build the validator
    reads:

    `runoak -i sqlite:obo:ecto search 'l~scorpion'` returns nothing.
    `runoak -i sqlite:obo:ecto search 'l~venom'` returns nothing.
    `runoak -i sqlite:obo:ecto search 'l~arthropod'` returns nothing.
    `runoak -i sqlite:obo:ecto search 'l~bite'` returns nothing.
    `runoak -i sqlite:obo:ecto search 'l~sting'` returns only `ENVO:01000690`
    mass wasting and `XCO:0000002` resting, both substring false positives.
    `runoak -i sqlite:obo:ecto search 't~exposure to neurotoxin'` returns
    `ECTO:0000730`, and `info ECTO:0000730 -O obo` shows it is
    `is_a ECTO:0000485` exposure to chemical with biological effect and
    involves `CHEBI:50910` neurotoxin. Neither it nor its parent is flagged
    Not4Curation.
  evidence:
  - reference: PMID:18579104
    reference_title: "Epidemiology of scorpionism: a global appraisal."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "These involve 2.3 billion at risk population."
    explanation: The size of the exposed population across the seven identified risk regions.
- name: Scorpion sting delivering cytotoxic venom
  description: >-
    The same act with a different venom. Hemiscorpius lepturus accounts for
    about a tenth of stings in Khuzestan and for essentially all of the
    cutaneous and haemolytic disease there.
  exposure_term:
    preferred_term: envenomation by Hemiscorpius lepturus cytolytic venom
    term:
      id: ECTO:0000537
      label: exposure to toxin
  exposure_classifications:
    hazard_agent_type:
    - classification_value: BIOLOGICAL
    exposure_duration:
    - classification_value: ACUTE
  influences_mechanisms:
  - target: Cytolytic Venom Membrane Damage
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: The cytolytic venom is delivered by the same sting route.
  notes: >-
    Bound one level broader than the neurotoxic exposure, to `ECTO:0000537`
    exposure to toxin, because the agent here is a cytolytic enzyme rather than
    a neurotoxin and `ECTO:0000730` would be wrong. `runoak -i sqlite:obo:ecto
    search 't~exposure to toxin'` returns `ECTO:0000537`; the same searches
    recorded on the neurotoxic exposure above show ECTO has no cytotoxin,
    phospholipase or venom class to be more specific with.
  evidence:
  - reference: PMID:9679690
    reference_title: "Cutaneous manifestations of the Hemiscorpius lepturus sting: a clinical study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hemiscorpion (Hemiscorpius) lepturus (HL), which is responsible for more than 10% of the scorpion stings in this area"
    explanation: >-
      States this exposure's share of stings in the studied region directly,
      rather than leaving it to be derived as the complement of the buthid 90%.
treatments:
- name: Species-specific antivenom
  description: >-
    Equine F(ab')2 or Fab antivenom against the local species, the only
    treatment that removes venom rather than opposing its effects. In the
    pivotal paediatric trial it cleared the clinical syndrome within four hours
    in every recipient and made circulating venom undetectable, against one of
    seven on placebo.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: antivenom administration
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  notes: >-
    Bound to the generic `NCIT:C15986` because NCIT has no antivenom class
    other than a product-specific one. OLS `q=antivenom, ontology=ncit` and
    `q=antivenin, ontology=ncit` each return only `NCIT:C87794` Coral Snake
    (Micrurus fulvius) Immune Globulin Antivenin (Equine), which names a
    different product; `q=immune globulin therapy, ontology=ncit` returns
    `NCIT:C121331` Intravenous Immunoglobulin Therapy, which is pooled human
    immunoglobulin for immunomodulation and not an antivenom. The sibling
    `Snakebite_Envenoming` entry binds the same generic term for the same
    reason.
  target_mechanisms:
  - target: Scorpion Venom Neurotoxin Binding to Voltage-Gated Sodium Channels
    treatment_effect: INHIBITS
    description: >-
      Antivenom binds circulating venom, so it acts upstream of the channel -
      which is also why it cannot reverse what the channel has already set in
      motion.
    evidence:
    - reference: PMID:19439743
      reference_title: Antivenom for critically ill children with neurotoxicity from scorpion stings.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Plasma venom concentrations were undetectable in all eight antivenom recipients but in only one placebo recipient 1 hour after treatment (P=0.001)."
      explanation: >-
        Measures the effect on circulating venom directly, which is the
        mechanism this edge asserts rather than the clinical endpoint.
  evidence:
  - reference: PMID:19439743
    reference_title: Antivenom for critically ill children with neurotoxicity from scorpion stings.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical syndrome resolved more rapidly among recipients of the antivenom than among recipients of placebo, with a resolution of symptoms in all eight antivenom recipients versus one of seven placebo recipients within 4 hours after treatment (P=0.001)."
    explanation: The randomised, placebo-controlled result behind this treatment.
  - reference: PMID:24550184
    reference_title: "Efficacy of scorpion antivenom plus prazosin versus prazosin alone for Mesobuthus tamulus scorpion sting envenomation in children: a randomised controlled trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The proportion of children deteriorating to clinical grade 3 or 4 was 8% in group A as against 44% in group B (p<0.01)."
    explanation: >-
      A second randomised trial, in children and against a different species,
      measuring the outcome that matters most here - progression to the severe
      grades rather than symptom resolution.
  - reference: PMID:28390429
    reference_title: "Management of scorpion envenoming: a systematic review and meta-analysis of controlled clinical trials."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Antivenom against Centruroides sp. are effective in reversing the clinical syndrome faster than no antivenom treatment in children (RR, 0.02; 95% CI, 0.01 to 0.06; 322 participants; three trials)."
    explanation: >-
      The pooled estimate across three trials and 322 children, which is the
      strongest form the antivenom claim takes. Note the scope: this is
      Centruroides, and the same meta-analysis reaches a separate conclusion
      for Mesobuthus tamulus, where antivenom is an add-on to prazosin rather
      than a standalone.
  - reference: PMID:28390429
    reference_title: "Management of scorpion envenoming: a systematic review and meta-analysis of controlled clinical trials."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "The polyvalent antivenom against Centruroides sp. in USA/Mexico and the monovalent antivenom against M. tamulus in India are effective for rapid resolution of symptoms."
    explanation: >-
      The species- and product-specific conclusion, quoted because it is what
      makes this treatment "species-specific antivenom" rather than
      "antivenom" - the evidence does not generalise across scorpion genera.
- name: Prazosin
  description: >-
    An alpha-1 adrenergic antagonist, oral, and cheap. It opposes the adrenergic
    arm of the storm directly and is the established treatment for Mesobuthus
    tamulus stings in India, where it is often given without antivenom at all.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: prazosin
      term:
        id: CHEBI:8364
        label: prazosin
  target_mechanisms:
  - target: Catecholamine-Mediated Myocardial Injury
    treatment_effect: INHIBITS
    description: >-
      Blocking alpha-1 receptors opposes the vasoconstriction and afterload rise
      through which the catecholamine surge injures the myocardium. Note this
      edge is drawn under the canonical hypothesis; under the emerging one
      prazosin would be treating an arm that is not the lethal one.
    evidence:
    - reference: PMID:21209062
      reference_title: "Efficacy and safety of scorpion antivenom plus prazosin compared with prazosin alone for venomous scorpion (Mesobuthus tamulus) sting: randomised open label clinical trial."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "Recovery from scorpion sting is hastened by simultaneous administration of scorpion antivenom plus prazosin compared with prazosin alone."
      explanation: >-
        Prazosin resolving the autonomic syndrome in both arms of a randomised
        trial. INDIRECT: a therapeutic response cited as validation of the
        mechanism it targets, and this design compares adding antivenom rather
        than prazosin against nothing.
  evidence:
  - reference: PMID:21209062
    reference_title: "Efficacy and safety of scorpion antivenom plus prazosin compared with prazosin alone for venomous scorpion (Mesobuthus tamulus) sting: randomised open label clinical trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Recovery from scorpion sting is hastened by simultaneous administration of scorpion antivenom plus prazosin compared with prazosin alone."
    explanation: >-
      The randomised comparison that positions prazosin: effective enough to
      be the control arm, and improved on by adding antivenom.
  - reference: PMID:21209062
    reference_title: "Efficacy and safety of scorpion antivenom plus prazosin compared with prazosin alone for venomous scorpion (Mesobuthus tamulus) sting: randomised open label clinical trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mean (SD) recovery times in hours for the prazosin plus scorpion antivenom group compared with the prazosin alone groups were: sweating 3 (1.1) v 6.6 (2.6); salivation 1.9 (0.9) v 3 (1.9); priapism 4.7 (1.5) v 9.4 (1.5)."
    explanation: >-
      Resolution times for three autonomic signs in both arms. Read carefully:
      the trial has no placebo, so these numbers measure what adding antivenom
      does on top of prazosin, and the prazosin-alone arm is the slower one.
      Cited here because it shows prazosin alone resolving the storm's signs
      within hours, not because it isolates prazosin's effect - which this
      design cannot do.
- name: Dobutamine
  description: >-
    A beta-1 agonist inotrope for the myocardial depression and cardiogenic
    shock of severe envenomation - supporting the failing ventricle rather than
    acting on the venom or the storm.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: dobutamine
      term:
        id: CHEBI:4670
        label: dobutamine
  target_mechanisms:
  - target: Cardiac Dysfunction and Pulmonary Edema
    treatment_effect: MODULATES
    description: >-
      Dobutamine acts on neither the venom nor the storm. It supports the
      failing ventricle at the node where both hypothesis arms converge,
      which is why it is drawn here and nowhere upstream. MODULATES rather
      than INHIBITS: beta-1 agonism raises cardiac output against a
      depressed myocardium, it does not remove the cause of the depression.
    evidence:
    - reference: PMID:32428515
      reference_title: Dobutamine in the treatment of severe scorpion envenoming.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: "Our study confirms that cardiac dysfunction following scorpion envenomation in Tunisia improved well and safely under dobutamine infusion."
      explanation: >-
        Measures the effect on this node directly - cardiac index rose from
        2.7 to 3.6 L/min/m2 at the lowest dose - in 21 Swan-Ganz-monitored
        patients, which is the claim this edge makes.
  evidence:
  - reference: PMID:32428515
    reference_title: Dobutamine in the treatment of severe scorpion envenoming.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "We included 21 patients with pulmonary edema or hemodynamic shock following scorpion envenoming."
    explanation: >-
      The dedicated dobutamine study, and its population: every patient had
      the pulmonary oedema or shock this treatment is for. An uncontrolled
      dose-ranging series, not a trial.
  - reference: PMID:32428515
    reference_title: Dobutamine in the treatment of severe scorpion envenoming.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "The optimal dose of dobutamine to start with was between 5 and 10 μg/kg/min."
    explanation: >-
      The dosing conclusion, which is the practical output of the study.
      Quoted with the source's own non-breaking space before the unit, since
      the reference validator matches bytes.
  - reference: PMID:37018229
    reference_title: "Scorpion envenomation-associated myocarditis: A systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The management typically included inotropes (especially dobutamine), prazosin, diuretics, nitroglycerine and digoxin, when indicated."
    explanation: Places dobutamine as the usual inotrope in the reviewed cases.
- name: Mechanical ventilation and intensive supportive care
  description: >-
    Required in about a third of the myocarditis cases, and the reason outcome
    depends so heavily on how far the patient is from an intensive care bed.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: Mechanical Ventilation
    term:
      id: NCIT:C70909
      label: Mechanical Ventilation
  target_mechanisms:
  - target: Cardiac Dysfunction and Pulmonary Edema
    treatment_effect: MODULATES
    description: >-
      Ventilation takes over gas exchange against the alveolar flooding this
      node produces. It acts on the consequence, not on the failing ventricle,
      and nothing it does shortens the myocardial recovery - which is why the
      edge is MODULATES and why outcome tracks distance from an intensive care
      bed rather than anything pharmacological.
    evidence:
    - reference: PMID:37018229
      reference_title: "Scorpion envenomation-associated myocarditis: A systematic review."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "Mechanical ventilation was required in 36.7% of the patients."
      explanation: >-
        INDIRECT, and the limit is worth stating: this establishes that the
        myocarditis at this node is what drives the need for ventilation in
        over a third of cases. No cited source here measures what ventilation
        does to the node once started.
  evidence:
  - reference: PMID:37018229
    reference_title: "Scorpion envenomation-associated myocarditis: A systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mechanical ventilation was required in 36.7% of the patients."
    explanation: The proportion needing ventilation, in the pooled myocarditis series.
- name: Early dexamethasone
  description: >-
    Not established practice. In envenomed mice, high-dose dexamethasone
    abolished heart failure and mortality, and the authors propose giving it
    very early - before antiserum - on the grounds that it reaches a pathway
    antivenom does not. Recorded because it is a mechanism-directed proposal
    with a specific rationale, not because there is human evidence for it.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: dexamethasone
      term:
        id: CHEBI:41879
        label: dexamethasone
  target_mechanisms:
  - target: Venom-Triggered Cardiac IL-1R Signaling and PGE2 Production
    treatment_effect: INHIBITS
    description: >-
      Suppressing the inflammatory arm at its origin, which is where the
      emerging hypothesis locates the lethal pathway.
    evidence:
    - reference: PMID:33116136
      reference_title: Interleukin-1 receptor-induced PGE(2) production controls acetylcholine-mediated cardiac dysfunction and mortality during scorpion envenomation.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "IL-1R deficiency, the treatment with a high dose of dexamethasone or blockage of parasympathetic signaling using atropine or vagotomy, abolished heart failure and mortality of envenomed mice."
      explanation: >-
        Dexamethasone is one of four interventions abolishing the outcome,
        which is what makes this a mechanism-directed edge rather than an
        empirical one.
  evidence:
  - reference: PMID:33116136
    reference_title: Interleukin-1 receptor-induced PGE(2) production controls acetylcholine-mediated cardiac dysfunction and mortality during scorpion envenomation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "we propose the use of dexamethasone administration very early after envenomation, even before antiserum"
    explanation: >-
      The proposal itself, quoted so the entry records it as the authors'
      recommendation from a mouse model rather than as practice.
  - reference: PMID:33116136
    reference_title: Interleukin-1 receptor-induced PGE(2) production controls acetylcholine-mediated cardiac dysfunction and mortality during scorpion envenomation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "we introduce a novel pathway that is targeted by dexamethasone, but not by anti-scorpion venom serum"
    explanation: >-
      The argument for adding it rather than relying on antivenom: the two act
      on different things.
  - reference: PMID:39628768
    reference_title: "Immunosuppressive therapies in scorpion envenomation: new perspectives for treatment."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "In recent decades, new research has revealed that the immune system plays an important role in triggering immunopathological reactions during scorpion envenoming, which places it as a therapeutic target; however, few clinical studies have been conducted."
    explanation: >-
      Confirms both halves of this treatment's status: the immune system is
      taken seriously as a target, and the clinical evidence for acting on it
      does not yet exist. Graded OTHER because the quoted sentence is a
      review's assessment of a field rather than a described study.
- name: Atropine
  description: >-
    The drug the two hypotheses disagree about most sharply. In envenomed mice
    it is one of four interventions that abolish cardiac failure and death, and
    the emerging hypothesis predicts it should work. In human practice it is
    advised against for routine use - it blocks sweating, which children need
    for temperature regulation, and it potentiates the adrenergic arm the
    canonical hypothesis holds responsible. Both positions are curated here
    because the disagreement is the point: the same drug is protective or
    harmful depending on which arm is lethal.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: atropine
      term:
        id: CHEBI:16684
        label: atropine
  target_mechanisms:
  - target: Excessive Vagal Acetylcholine Release at the Heart
    treatment_effect: INHIBITS
    description: >-
      Muscarinic blockade at the heart, which is the effector step of the
      emerging hypothesis. This edge is drawn under that hypothesis; under the
      canonical one atropine is acting on an arm that is not the lethal one,
      and unopposing the one that is.
    evidence:
    - reference: PMID:33116136
      reference_title: Interleukin-1 receptor-induced PGE(2) production controls acetylcholine-mediated cardiac dysfunction and mortality during scorpion envenomation.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "Interestingly, in contrast to treatment with propranolol, the administration of atropine, a nonselective muscarinic antagonist, rescued the mice from mortality"
      explanation: >-
        The comparison that makes this edge mechanistic rather than empirical:
        blocking the parasympathetic arm rescued the mice where blocking the
        sympathetic arm did not.
  evidence:
  - reference: PMID:22826633
    reference_title: Emerging options for the management of scorpion stings.
    supports: REFUTE
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "In general, antiparasympathetic drugs, such as atropine, are not recommended routinely in the treatment of scorpion envenoming."
    explanation: >-
      The standing human recommendation, and it is against routine use.
      REFUTE against treating atropine as an established therapy here.
      Graded OTHER because the quoted sentence is a review's recommendation
      rather than a described study.
  - reference: PMID:22826633
    reference_title: Emerging options for the management of scorpion stings.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "However, these drugs can be useful in cases of severe bradycardia or complete atrioventricular block, which are sometimes observed."
    explanation: >-
      The narrow indication the same review does accept, quoted so the entry
      records what atropine is actually used for rather than only what it is
      advised against.
  notes: >-
    The reason given against routine use is itself mechanistic and worth
    reading next to the pathograph: blocking the parasympathetic arm leaves
    the sympathetic one unopposed, which is the arm the canonical hypothesis
    says does the damage. So the human caution and the mouse result are not
    simply in conflict - they are what the two hypotheses each predict.
- name: Plasma exchange and renal replacement therapy
  description: >-
    Supportive treatment of the cytotoxic branch once thrombotic
    microangiopathy and renal failure are established. Curated because that
    branch otherwise reaches its terminal nodes with nothing acting on it,
    and because the mechanism the entry curates - an acquired ADAMTS13
    deficiency with an autoantibody against the enzyme - is the same one
    plasma exchange addresses in the primary thrombotic microangiopathies,
    by removing the antibody and replacing the enzyme.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: therapeutic plasma exchange
    term:
      id: NCIT:C15304
      label: Plasmapheresis
  notes: >-
    Bound to `NCIT:C15304` Plasmapheresis as the nearest clinical-action term;
    OLS `q=Therapeutic Plasma Exchange, ontology=ncit` returns `NCIT:C133348`
    Therapeutic Exchange Plasma, which names the blood product rather than the
    procedure, and `NCIT:C15304`. The existing `Atypical_Hemolytic_Uremic_Syndrome`
    and `Heparin-Induced_Thrombocytopenia` entries bind the same term for the
    same reason. `DEVICE` follows this entry's mechanical-ventilation record:
    an extracorporeal circuit is the closest platform the modality enum
    offers for an apheresis procedure.
  target_mechanisms:
  - target: Thrombotic Microangiopathy and Acute Kidney Injury
    treatment_effect: MODULATES
    description: >-
      Acting at the terminal node of the cytotoxic branch rather than upstream
      of it: by the time plasma exchange is started the venom has already
      lysed the erythrocytes. Read the evidence carefully - the cited case
      establishes that the combination was given and the child recovered, not
      that plasma exchange is what produced the recovery. No controlled
      evidence exists for it in this disease.
    evidence:
    - reference: PMID:40034936
      reference_title: Hemolytic Uremic Syndrome Secondary to Scorpion Envenomation in a 7-Year-Old Boy from Southwestern Iran.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: "The patient received supportive treatment, hemodialysis, and plasma exchange, and was discharged after 30 days of hospitalization."
      explanation: >-
        A single case report of use with survival. INDIRECT: an uncontrolled
        therapeutic response cited in support of the mechanism it is thought
        to act on, with three interventions given together and no way to
        separate them.
- name: Anti-heminecrolysin nanobody
  description: >-
    A candidate, not a treatment. Heminecrolysin is the haemolytic and
    dermonecrotic fraction of Hemiscorpius lepturus venom - the molecule
    behind the cytotoxic branch - and a camelid single-domain antibody
    against it neutralised both activities in mice. Recorded because it is
    the only agent in the entry aimed at the cytolytic lesion itself rather
    than at its consequences, and because the equine antivenom it would
    replace causes anaphylaxis.
  therapeutic_modality: NANOBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  notes: >-
    No `therapeutic_agent` binding: F7Nb is a research construct with no
    ontology identity, and NCIT has no generic single-domain-antibody class
    to fall back on - OLS `q=Single Domain Antibody, ontology=ncit` returns
    only named products (`NCIT:C211548` Lutetium Lu 177 Anti-PD-L1 Nanobody
    RAD204, `NCIT:C120068` Anti-CEACAM6 AFAIKL2 Antibody Fragment/Jack Bean
    Urease Immunoconjugate L-DOS47) and unrelated constructs. `NCIT:C20401`
    Monoclonal Antibody was considered and rejected: a nanobody is a
    single-domain fragment, not a monoclonal antibody, and the distinction is
    exactly what this treatment turns on.
  target_mechanisms:
  - target: Cytolytic Venom Membrane Damage
    treatment_effect: INHIBITS
    description: >-
      Neutralising the venom fraction that does the lysing, upstream of the
      haemolysis - which is the one point on this branch where a treatment
      could act before the damage rather than after it.
    evidence:
    - reference: PMID:24891523
      reference_title: A camelid antibody candidate for development of a therapeutic agent against Hemiscorpius lepturus envenomation.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "The in vivo neutralization tests demonstrated that F7Nb had good antihemolytic and antidermonecrotic effects against HNc in all tested mice."
      explanation: >-
        Both activities of the toxin neutralised in vivo, which is the claim
        this edge makes. Mouse only.
  evidence:
  - reference: PMID:24891523
    reference_title: A camelid antibody candidate for development of a therapeutic agent against Hemiscorpius lepturus envenomation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "Hence, this Nb is a potential leading novel candidate for treating H. lepturus scorpionism in the near future."
    explanation: >-
      The authors' own statement of where this stands - a candidate for
      development, quoted so the entry does not read it as available therapy.
  - reference: PMID:24891523
    reference_title: A camelid antibody candidate for development of a therapeutic agent against Hemiscorpius lepturus envenomation.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "However, this immunotherapy creates serious side effects, including anaphylactic shock sometimes even leading to death."
    explanation: >-
      The problem with the existing equine antivenom that motivates a
      replacement. BACKGROUND: the paper's framing of the clinical situation,
      not its own result. Graded OTHER because the quoted sentence names an
      adverse-effect profile without describing the study behind it.
prevalence:
- population: Worldwide
  measure_type: ANNUAL_INCIDENCE
  rate_denominator: POPULATION_PER_YEAR
  notes: >-
    More than 1.2 million stings a year across the seven identified risk
    regions. Recorded as a count rather than a rate: the source gives a global
    sting total against a 2.3 billion at-risk denominator that is itself an
    estimate, so no per-100,000 figure can be derived from it honestly.
  prevalence_class: NOT_YET_DOCUMENTED
  evidence:
  - reference: PMID:18579104
    reference_title: "Epidemiology of scorpionism: a global appraisal."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The annual number of scorpion stings exceeds 1.2 million leading to more than 3250 deaths (0.27%)."
    explanation: The global sting count and case fatality this record reports.
- population: Brazil
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: BAND_1_5_PER_10000
  rate_per_100000: 70.0
  rate_denominator: PERSON_YEARS
  notes: >-
    A national rate, in contrast to the worldwide record above which is a count
    with no usable denominator. Recorded because Brazil is where the incidence
    is best measured and because the figure is rising there.
  evidence:
  - reference: PMID:37902581
    reference_title: "Moderate or severe scorpion sting: identification of risk factors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "reaching approximately 70 cases per 100,000 inhabitants-years in 2018"
    explanation: The rate and its denominator, stated per inhabitant-year.
clinical_trials:
- name: NCT00685230
  phase: NOT_APPLICABLE
  status: COMPLETED
  description: >-
    The randomised, double-blind, placebo-controlled paediatric trial of
    Centruroides-specific F(ab')2 antivenom that established the treatment and
    led to US approval. Fifteen children in intensive care; resolution of the
    clinical syndrome within four hours was the primary endpoint.
  target_phenotypes:
  - preferred_term: Local paresthesia at sting site
    term:
      id: HP:0020014
      label: Local paresthesia at bite site
  notes: >-
    `phase: NOT_APPLICABLE` because the registration records no FDA phase for
    it; the cached ClinicalTrials.gov record carries the design and population
    but no phase designation.
  evidence:
  - reference: clinicaltrials:NCT00685230
    reference_title: "Prospective, Randomized, Double-Blind, Controlled Study of Alacramyn® vs. Placebo in Pediatric Patients With Systemic Signs of Scorpion Sting Envenomation"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients stung by Centruroides scorpions develop a clinical syndrome which may require sedation with benzodiazepines and observation for 6 to 28 hours of intensive care monitoring."
    explanation: >-
      The registration's own statement of the syndrome and the standard of
      care this trial was testing antivenom against, which is what identifies
      it as the trial reported in PMID:19439743.
- name: CTRI/2013/09/004002
  phase: NOT_APPLICABLE
  status: COMPLETED
  description: >-
    The Indian paediatric randomised trial of scorpion antivenom plus prazosin
    against prazosin alone, reported in PMID:24550184. Registered on CTRI
    rather than ClinicalTrials.gov, which is why it is keyed on its WHO ICTRP

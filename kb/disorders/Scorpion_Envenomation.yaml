  - reference: PMID:33116136
    reference_title: Interleukin-1 receptor-induced PGE(2) production controls acetylcholine-mediated cardiac dysfunction and mortality during scorpion envenomation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Major clinical manifestations that precede death after scorpion envenomation include heart failure and pulmonary edema."
    explanation: >-
      Identifies this node as the terminal one. BACKGROUND because it is the
      mouse paper's framing of the human disease rather than its own finding.
  - reference: PMID:34055554
    reference_title: Neurological and Systemic Manifestations of Severe Scorpion Envenomation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Scorpion envenomation is especially fatal in the first hours, usually due to respiratory and/or cardiovascular collapse."
    explanation: The timing and the mode of death this node produces.
  - reference: PMID:37018229
    reference_title: "Scorpion envenomation-associated myocarditis: A systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Almost all survived cases showed rapid recovery and improvement in the left ventricular function."
    explanation: >-
      The reversibility that makes supportive care worth escalating: the
      myocardial failure is not structural damage.
- name: Cytolytic Venom Membrane Damage
  biological_scale: MOLECULAR
  description: >-
    The Hemiscorpius lepturus branch, and the point at which this subtype leaves
    the rest of the entry. The venom is cytolytic rather than neurotoxic, lysing
    cell membranes at the sting site and in the circulation. The sting itself is
    characteristically not painful, which is why presentation is late.
  notes: >-
    Named for the effect rather than the enzyme. The literature attributes the
    cytolysis to a lysophospholipase D and related lytic enzymes, but no source
    cited in this entry says so and the node carries no `molecular_functions`
    binding to hold the claim, so naming it for a phospholipase would have
    asserted an enzymology the entry does not evidence.
  downstream:
  - target: Intravascular Hemolysis with Acquired ADAMTS13 Deficiency
    causal_link_type: DIRECT
  - target: Skin ulcer
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:9679690
    reference_title: "Cutaneous manifestations of the Hemiscorpius lepturus sting: a clinical study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "HL venom is cytotoxic, and HL is the only scorpion whose venom induces a toxic reaction."
    explanation: The venom property this branch turns on.
- name: Intravascular Hemolysis with Acquired ADAMTS13 Deficiency
  biological_scale: ORGANISM
  description: >-
    Haemolysis is followed by a fall in ADAMTS13 together with an anti-ADAMTS13
    IgG in almost every severe case - an acquired, antibody-mediated deficiency
    of the von Willebrand factor-cleaving protease rather than consumption
    alone. The deficiency tracks the renal outcome exactly: every child with
    acute kidney injury had it, and no child with normal ADAMTS13 developed
    renal failure.
  downstream:
  - target: Thrombotic Microangiopathy and Acute Kidney Injury
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:23893367
      reference_title: High frequency of acquired ADAMTS13 deficiency after hemolysis in Hemiscorpius Lepturus (scorpion) stung children.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "ADAMTS13 decreased in all of the patients with acute kidney injury and none of those with normal levels of ADAMTS13 developed renal failure"
      explanation: >-
        A complete separation between the two groups, which is about as strong
        as an observational series can make a causal edge.
  evidence:
  - reference: PMID:23893367
    reference_title: High frequency of acquired ADAMTS13 deficiency after hemolysis in Hemiscorpius Lepturus (scorpion) stung children.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ADAMTS13 was decreased in 91.7 % of patients and the anti-ADAMTS13 antibody (Ab) was increased in 98.3 %."
    explanation: >-
      The node's actual claim, quantified: the protease falls and the
      autoantibody rises in almost every severe case, which is what makes this
      an acquired antibody-mediated deficiency rather than consumption alone.
  - reference: PMID:23893367
    reference_title: High frequency of acquired ADAMTS13 deficiency after hemolysis in Hemiscorpius Lepturus (scorpion) stung children.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sixty scorpion stung children who were referred with severe hemolysis and hemoglobinuria were studied."
    explanation: The cohort and the presenting haemolysis this node records.
- name: Thrombotic Microangiopathy and Acute Kidney Injury
  biological_scale: ORGANISM
  description: >-
    The terminal node of the cytotoxic branch: disseminated intravascular
    coagulation and haemolytic uraemic syndrome, with acute kidney injury in
    about a quarter of severe cases.
  locations:
  - preferred_term: kidney
    term:
      id: UBERON:0002113
      label: kidney
  downstream:
  - target: Acute kidney injury
    causal_link_type: DIRECT
  - target: Hemolytic-uremic syndrome
    causal_link_type: DIRECT
  - target: Thrombocytopenia
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:23893367

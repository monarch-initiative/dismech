    evidence_source: HUMAN_CLINICAL
    snippet: "Acute kidney injury was found in 23.3 % and had significant association with severe anemia, thrombocytopenia, pyuria, hematuria and considerable proteinuria"
    explanation: The haematological and renal findings that define this node.

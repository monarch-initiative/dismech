- name: Venom-Triggered Cardiac IL-1R Signaling and PGE2 Production
  biological_scale: CELLULAR
  conforms_to: nlrp3_inflammasome_activation#NLRP3 Inflammasome Assembly and Caspase-1 Activation
  description: >-
    Venom reaching the heart is sensed as a danger signal. Cardiac fibroblasts
    and resident macrophages produce IL-1 beta through an NLRP3-, ASC- and
    caspase-1-dependent route and prostaglandin E2 alongside it, and IL-1
    receptor signalling is required to sustain the PGE2 output. This node is the
    entry point of the emerging hypothesis arm and is demonstrated only in mice.
  biological_processes:
  - preferred_term: prostaglandin E2 biosynthesis in the envenomed heart
    term:
      id: GO:0001516
      label: prostaglandin biosynthetic process
    modifier: INCREASED
  cell_types:

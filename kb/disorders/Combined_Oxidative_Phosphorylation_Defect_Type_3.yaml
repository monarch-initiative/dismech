      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    TSFM is a nuclear, autosomal gene and every reported patient carries
    biallelic variants, either homozygous (the p.Arg333Trp families) or
    compound heterozygous. In the Finnish families a nonsense allele is common
    in the population, but no homozygote for it has been seen, which the
    authors read as early developmental lethality of complete loss.
  evidence:

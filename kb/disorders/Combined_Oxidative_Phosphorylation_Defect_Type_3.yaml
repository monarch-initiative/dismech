    snippet: "Here, we report an unusual presentation of mitochondrial cardiomyopathy, with dilated phenotype and pathologic evidence of biventricular fibro-adipose replacement, in a 33-year old woman who underwent cardiac transplant."
    explanation: Heart transplantation in an adult TSFM patient.
- name: Cannabinoid Therapy for Hyperkinetic Movement Disorder
  description: >-
    Cannabinoids were reported to improve chorea in one published TSFM patient.
    The primary report has no abstract in the reference cache, so the claim is

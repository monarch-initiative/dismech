diagnosis:
- name: Respiratory chain enzymology showing a combined defect with spared complex II
  description: >-
    Reduced activity or assembly of complexes I and IV, with or without III
    and V, in muscle, heart or fibroblasts, with complex II preserved, points
    at mitochondrial translation rather than a single complex. The informative
    tissue varies: fibroblasts showed reduced complex assembly in the founding
    patients, the adult heart showed a combined complex I and IV defect while
    her fibroblasts compensated with normal oxygen consumption, and one
    toddler's muscle showed only a complex IV defect. A normal fibroblast
    study does not exclude the disease.
  evidence:
  - reference: PMID:30911037
    reference_title: "Novel compound mutations in the mitochondrial translation elongation factor (TSFM) gene cause severe cardiomyopathy with myocardial fibro-adipose replacement."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In patient fibroblasts, the decrease of EF-Ts was paralleled by up-regulation of EF-Tu and induction of genes involved in mitochondrial biogenesis, along with increased expression of respiratory chain subunits and normal oxygen consumption rate."
    explanation: Patient fibroblasts can compensate and show normal respiration, so the affected tissue may be needed.
  - reference: PMID:30911037
    reference_title: "Novel compound mutations in the mitochondrial translation elongation factor (TSFM) gene cause severe cardiomyopathy with myocardial fibro-adipose replacement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This feature was paralleled by reduction of the steady-state levels of selected C-I and C-IV subunits, while C-II, C-III and C-V subunits were spared"
    explanation: The combined defect with complex II spared, in the affected heart.
- name: Sequencing of TSFM and the mitochondrial translation apparatus
  description: >-
    Diagnosis rests on biallelic TSFM variants, found by exome sequencing or a
    mitochondrial gene panel. Because the presentation may be an isolated
    cardiomyopathy, a hepatopathy, an ataxia or a movement disorder, TSFM is
    easily left out of a phenotype-restricted panel. In Finland the
    p.Gln286Ter allele is common enough to be worth specific attention.
  diagnosis_term:
    preferred_term: Whole Exome Sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:31451716
    reference_title: "Identification of extremely rare mitochondrial disorders by whole exome sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In patient 2, p.Gln111ThrfsTer5 and RNA mis-splicing were identified in TSFM."
    explanation: A TSFM diagnosis made by exome sequencing in a patient with left ventricular hypertrophy and ataxia.
  - reference: PMID:35071363
    reference_title: "Case Report: Whole Exome Sequencing Identifies Compound Heterozygous Variants in TSFM Gene Causing Juvenile Hypertrophic Cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole exome sequencing identified compound heterozygous variants, p.Arg333Trp and p.Val119Leu, in TSFM, a nuclear gene that encodes a mitochondrial translation elongation factor, resulting in impaired oxidative phosphorylation and juvenile hypertrophic cardiomyopathy."
    explanation: Exome sequencing made the diagnosis in a child presenting with isolated cardiomyopathy.

treatments:
- name: Heart Failure Pharmacotherapy
  description: >-
    Standard heart failure management. A toddler presenting with an ejection
    fraction of 10 to 15 percent improved to 30 percent on inotropes and
    diuretics, was discharged on lisinopril, furosemide, chlorothiazide,
    spironolactone and aspirin, and at 15 years remained in NYHA class II to
    III without needing transplantation. This is supportive care, not a
    disease-modifying therapy.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: lisinopril
      term:
        id: CHEBI:43755
        label: lisinopril
    - preferred_term: furosemide
      term:
        id: CHEBI:47426
        label: furosemide
    - preferred_term: spironolactone

experimental_models:
- name: TSFM patient skin fibroblasts
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: >-
    Cultured skin fibroblasts from patients homozygous for p.Arg333Trp and from
    other genotypes, used to measure EF-Ts and EF-Tu levels, mitochondrial
    translation and complex assembly, and for complementation and
    small-molecule screens.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  publication: PMID:17033963
  modeled_mechanisms:
  - target: Combined Respiratory Chain Complex Deficiency
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Patient fibroblasts show the joint loss of EF-Ts and EF-Tu and reduced
      assembly of complexes I, IV and V, and retroviral EF-Ts or EF-Tu
      corrects it.
    limitations: >-
      Fibroblasts are not an affected tissue, and in at least one patient they
      compensated by up-regulating EF-Tu and mitochondrial biogenesis and had
      normal oxygen consumption while her heart was severely deficient. The
      size of the defect in fibroblasts is therefore not a guide to severity
      in heart, brain or liver.
    readouts:
    - name: Assembled respiratory chain complexes I, IV and V
      target: Combined Respiratory Chain Complex Deficiency
      direction: DECREASED
      interpretation: The cellular consequence of the translation defect, measured directly.
      evidence:
      - reference: PMID:17033963
        reference_title: "Distinct clinical phenotypes associated with a mutation in the mitochondrial translation elongation factor EFTs."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "The steady-state levels of EFTs and EFTu in patient fibroblasts were reduced by 75% and 60%, respectively, and the amounts of assembled complexes I, IV, and V were reduced by 35%-91% compared with the amounts in controls."
        explanation: Reports the assembly measurement behind this readout.
    evidence:
    - reference: PMID:17033963
      reference_title: "Distinct clinical phenotypes associated with a mutation in the mitochondrial translation elongation factor EFTs."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "These phenotypes and the translation defect were rescued by retroviral expression of either EFTs or EFTu."
      explanation: The defect in this model is specific to EF-Ts loss, as rescue shows.
  - target: Cellular Energy Failure
    relationship: RESCUES
    fidelity: LOW
    model_scale: CELLULAR
    description: >-
      In a seven-compound screen, ascorbate and N-acetylcysteine improved
      growth, ATP content and membrane potential and lowered reactive oxygen
      species in EF-Ts patient fibroblasts.
    limitations: >-
      One patient's fibroblasts in culture, with no clinical correlate; the
      authors found each patient line responded differently and no compound
      helped all of them. Recorded as a preclinical lead only, not as a
      treatment.
    evidence:
    - reference: PMID:24012549
      reference_title: "The effect of small molecules on nuclear-encoded translation diseases."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Two antioxidants, ascorbate and N-acetylcysteine (NAC), significantly improved cell growth, ATP content and mitochondrial membrane potential and decreased levels of intracellular reactive oxygen species (ROS) in EFTs fibroblasts."
      explanation: Reports the rescue in EF-Ts fibroblasts.
  evidence:
  - reference: PMID:17033963
    reference_title: "Distinct clinical phenotypes associated with a mutation in the mitochondrial translation elongation factor EFTs."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These phenotypes and the translation defect were rescued by retroviral expression of either EFTs or EFTu."
    explanation: Establishes patient fibroblasts as a system that carries and reverses the defect.

differential_diagnoses:
- name: TUFM-related combined oxidative phosphorylation deficiency
  disease_term:
    preferred_term: Combined oxidative phosphorylation defect type 4
    term:
      id: MONDO:0012534
      label: combined oxidative phosphorylation defect type 4
  description: >-
    TUFM encodes EF-Tu, the partner that EF-Ts recharges, so the two diseases
    break the same elongation step and produce the same combined deficiency
    with lactic acidosis. TUFM disease is classically a neonatal encephalopathy
    with polymicrogyria and leukodystrophy, while TSFM disease is more often
    cardiac, but both have cardiac and neurological presentations and the
    distinction is molecular.
  distinguishing_features:
  - Not reliably separable clinically or by respiratory chain enzymology; sequencing decides.
  evidence:
  - reference: PMID:20435138
    reference_title: "Analysis of the functional consequences of lethal mutations in mitochondrial translational elongation factors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "A mutation of Arg336 to Gln in EF-Tu(mt) causes infantile encephalopathy caused by defects in mitochondrial translation."
    explanation: The EF-Tu disease is a mitochondrial translation defect presenting as infantile encephalopathy.
- name: GFM1-related combined oxidative phosphorylation deficiency
  disease_term:
    preferred_term: Hepatoencephalopathy due to combined oxidative phosphorylation defect type 1
    term:
      id: MONDO:0012191
      label: hepatoencephalopathy due to combined oxidative phosphorylation defect type 1
  description: >-
    GFM1 encodes elongation factor G1, the translocase of mitochondrial
    elongation. GFM1 disease is typically a fatal neonatal hepatopathy with
    encephalopathy and normal cardiac function, which overlaps the infantile
    liver-failure presentation of TSFM disease.
  distinguishing_features:
  - Cardiac function is reported normal in GFM1 patients, while cardiomyopathy is the commonest TSFM feature.
  - The distinction is molecular.
  evidence:
  - reference: PMID:16632485
    reference_title: "The molecular basis for tissue specificity of the oxidative phosphorylation deficiencies in patients with mutations in the mitochondrial translation factor EFG1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our results demonstrate marked differences among tissues in the organization of the mitochondrial translation system and its response to dysfunction, and explain the severe hepatopathy, but normal cardiac function in EFG1 patients."
    explanation: Severe hepatopathy with normal cardiac function in GFM1 patients.

prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Seventeen patients in eleven reports by 2021. At least two further patients
    (one with chorea, one Korean patient identified by exome sequencing) were
    published around then, so the count is approximate.
  evidence:
  - reference: PMID:35071363
    reference_title: "Case Report: Whole Exome Sequencing Identifies Compound Heterozygous Variants in TSFM Gene Causing Juvenile Hypertrophic Cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS

    explanation: >-
      States the autosomal recessive mode for COXPD3 in a report whose proband
      carries the two variants in trans, one from each parent.
genetic:
- name: TSFM
  gene_term:
    preferred_term: TSFM
    term:
      id: hgnc:12367
      label: TSFM
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  association: >-
    TSFM encodes mitochondrial translation elongation factor Ts, the guanine
    nucleotide exchange factor that recycles EF-Tu (TUFM) from its GDP-bound to
    its GTP-bound form during the elongation step of mitochondrial
    translation. Reported alleles include the recurrent missense p.Arg333Trp,
    further missense alleles, nonsense, frameshift and splice alleles; null
    alleles have only been seen in trans with a missense or splice allele.
  notes: >-
    Variant numbering differs between papers. The recurrent allele is c.997C>T
    p.Arg333Trp on NM_001172696, reported as R312W by Vedrenne et al. and as
    R325W in the biochemical study of Akama et al.; the three papers describe
    the same arginine-to-tryptophan change at the EF-Tu-binding subdomain.
    Likewise the Finnish nonsense allele is c.856C>T p.Gln286Ter in Ahola et al.,
    and a nonsense allele reported as c.919C>T p.Gln307Ter on NM_001172696.1 is
    described by van Riesen et al. as previously published in three patients;
    that the two are the same allele is plausible but not stated by either
    source, so they are listed separately.

    ClinGen classifies TSFM as Definitive for the umbrella term mitochondrial
    disease (MONDO:0044970) and Moderate for Leigh syndrome (MONDO:0009723).
    Neither is this entry's disease_term, so no gene_disease_validity
    assertion is recorded here.
  variants:
  - name: "TSFM c.997C>T (p.Arg333Trp)"
    description: >-
      The recurrent allele, reported homozygous in unrelated families with a
      fatal neonatal encephalomyopathy, a fatal infantile hypertrophic
      cardiomyopathy and infantile liver failure, and in trans with
      p.Val119Leu in a child with stabilised hypertrophic cardiomyopathy. It
      sits in the subdomain of EF-Ts that contacts EF-Tu and halves EF-Ts
      stimulation of elongation in vitro by weakening EF-Tu binding.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:17033963
      reference_title: "Distinct clinical phenotypes associated with a mutation in the mitochondrial translation elongation factor EFTs."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Sequencing of candidate genes revealed the same homozygous mutation (C997T) in both patients in TSFM, a gene coding for the mitochondrial translation elongation factor EFTs."
      explanation: Founding report of the allele, homozygous in two unrelated patients.
    - reference: PMID:21741925
      reference_title: "Mutation in the mitochondrial translation elongation factor EFTs results in severe infantile liver failure."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We sequenced the TSFM gene, encoding the mitochondrial translation factor EFTs and identified a homozygous mutation changing a highly conserved arginine into a tryptophan (R312W)."
      explanation: The same arginine-to-tryptophan allele, in alternative numbering, in a third family with liver failure.
    - reference: PMID:35071363
      reference_title: "Case Report: Whole Exome Sequencing Identifies Compound Heterozygous Variants in TSFM Gene Causing Juvenile Hypertrophic Cardiomyopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "The p.(Arg333Trp) variant identified in our proband, has been previously detected in seven patients, transmitted in an autosomal recessive manner, manifesting with heterogeneous phenotypes and are all associated with death during infancy."
      explanation: Literature summary of the homozygous carriers and their uniformly infantile deaths.
  - name: "TSFM c.355G>C (p.Val119Leu)"
    description: >-
      Missense allele found in trans with p.Arg333Trp in a girl with
      hypertrophic cardiomyopathy from age 3 who survived into adolescence.
      Classified likely pathogenic by the reporting authors on segregation and
      conservation; no functional study.
    clinical_significance: LIKELY_PATHOGENIC
    evidence:
    - reference: PMID:35071363
      reference_title: "Case Report: Whole Exome Sequencing Identifies Compound Heterozygous Variants in TSFM Gene Causing Juvenile Hypertrophic Cardiomyopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The paternally inherited c.355G>C is predicted to be a p.(Val119Leu) change."
      explanation: Names the allele and its paternal origin; the maternal allele was p.Arg333Trp, so the two are in trans.
  - name: "TSFM c.856C>T (p.Gln286Ter)"
    description: >-
      Nonsense allele with a heterozygous carrier frequency of about 1 in 80 in
      Finland, found in trans with p.Cys315Tyr in two siblings and with a
      splice-site change in a third patient. No homozygote has been found.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:25037205
      reference_title: "Mitochondrial EFTs defects in juvenile-onset Leigh disease, ataxia, neuropathy, and optic atrophy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The same p.Q286X variant was found as compound heterozygous with a splice site change in a patient from a second family, with juvenile-onset optic atrophy, peripheral neuropathy, and ataxia."
      explanation: Recurrence of the nonsense allele in a second family, in trans with a splice allele.
  - name: "TSFM c.944G>A (p.Cys315Tyr)"
    description: >-
      Missense allele in trans with p.Gln286Ter in two Finnish siblings whose
      infantile cardiomyopathy progressed to juvenile-onset Leigh syndrome,
      neuropathy and optic atrophy. Modelled and shown in patient cells to
      destabilise the protein.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:25037205
      reference_title: "Mitochondrial EFTs defects in juvenile-onset Leigh disease, ataxia, neuropathy, and optic atrophy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Our molecular modeling predicted the coding-region mutations to cause protein instability, which was experimentally confirmed in cultured patient cells, with mitochondrial translation defect and lacking EFTs."
      explanation: Functional evidence that the coding alleles destabilise EF-Ts in patient cells.
  - name: "TSFM c.547G>A (p.Gly183Ser)"
    description: >-
      Homozygous missense allele in a boy with infantile-onset
      encephalocardiomyopathy and sensorineural hearing loss.
    clinical_significance: LIKELY_PATHOGENIC
    evidence:
    - reference: PMID:31267352
      reference_title: "Novel homozygous TSFM pathogenic variant associated with encephalocardiomyopathy with sensorineural hearing loss and peculiar neuroradiologic findings."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "we identified the novel TSFM homozygous variant c.547G>A (p.Gly183Ser) in a 5-year-old boy with infantile early onset encephalocardiomyopathy, sensorineural hearing loss, and peculiar partially reversible neuroimaging features"
      explanation: Reports the allele and the phenotype it was found with.
  - name: "TSFM c.408_409delGT (p.Leu137GlyfsTer24) with c.505C>T"
    description: >-
      Frameshift allele in trans with a missense allele in a woman with
      dilated cardiomyopathy and biventricular fibro-adipose replacement who
      underwent heart transplantation at 33.
    evidence:
    - reference: PMID:30911037
      reference_title: "Novel compound mutations in the mitochondrial translation elongation factor (TSFM) gene cause severe cardiomyopathy with myocardial fibro-adipose replacement."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Whole exome sequencing revealed two novel compound heterozygous variants in the TSFM gene, coding for the mitochondrial translation elongation factor EF-Ts."
      explanation: Reports the compound heterozygous genotype in the adult cardiomyopathy patient.
  evidence:
  - reference: PMID:17033963
    reference_title: "Distinct clinical phenotypes associated with a mutation in the mitochondrial translation elongation factor EFTs."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These phenotypes and the translation defect were rescued by retroviral expression of either EFTs or EFTu."
    explanation: >-
      Complementation of the patient cellular defect by wild-type EF-Ts
      establishes TSFM as the causal gene rather than an incidental variant.
  - reference: PMID:27677415
    reference_title: "Molecular-genetic characterization and rescue of a TSFM mutation causing childhood-onset ataxia and nonobstructive cardiomyopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we rescued the normal molecular phenotype by expression of the wild-type TSFM cDNA in patient's fibroblasts"
    explanation: An independent family in which wild-type TSFM rescue confirms causality.
pathophysiology:
- name: Biallelic TSFM Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic TSFM variants reduce the amount or activity of EF-Ts. The
    recurrent p.Arg333Trp substitution lies in the subdomain that contacts
    EF-Tu and weakens EF-Tu binding, so nucleotide exchange on EF-Tu is
    impaired; other coding alleles destabilise EF-Ts so that it is absent from
    patient cells. Either way the cell has less capacity to recharge EF-Tu with
    GTP between rounds of aminoacyl-tRNA delivery.
  genetic_context:
    genes:
    - preferred_term: TSFM
      term:
        id: hgnc:12367
        label: TSFM
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Homozygous or compound heterozygous germline variants: the recurrent
      missense p.Arg333Trp, further missense alleles, and nonsense, frameshift
      or splice alleles in trans with a missense or splice allele.
  locations:
  - preferred_term: mitochondrial matrix
    term:
      id: GO:0005759
      label: mitochondrial matrix
  molecular_functions:
  - preferred_term: guanyl-nucleotide exchange factor activity
    term:
      id: GO:0005085
      label: guanyl-nucleotide exchange factor activity
    modifier: DECREASED
  - preferred_term: translation elongation factor activity
    term:
      id: GO:0003746
      label: translation elongation factor activity
    modifier: DECREASED
  evidence:
  - reference: PMID:17033963
    reference_title: "Distinct clinical phenotypes associated with a mutation in the mitochondrial translation elongation factor EFTs."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "EFTs functions as a guanine nucleotide exchange factor for EFTu, another translation elongation factor that brings aminoacylated transfer RNAs to the ribosomal A site as a ternary complex with guanosine triphosphate."
    explanation: States the normal function of the gene product that the variants impair.
  - reference: PMID:20435138
    reference_title: "Analysis of the functional consequences of lethal mutations in mitochondrial translational elongation factors."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This loss of activity is caused by a significant reduction in the ability of EF-Ts(mt) R325W to bind EF-Tu(mt), leading to a defect in nucleotide exchange."
    explanation: >-
      Direct biochemical demonstration that the recurrent patient allele
      impairs EF-Tu binding and nucleotide exchange.
  - reference: PMID:25037205
    reference_title: "Mitochondrial EFTs defects in juvenile-onset Leigh disease, ataxia, neuropathy, and optic atrophy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our molecular modeling predicted the coding-region mutations to cause protein instability, which was experimentally confirmed in cultured patient cells, with mitochondrial translation defect and lacking EFTs."
    explanation: Shows that other coding alleles act by destabilising EF-Ts so that the protein is lacking.
  downstream:
  - target: Destabilised EF-Ts and EF-Tu Elongation Factor Pool
    causal_link_type: DIRECT
    description: >-
      EF-Ts and EF-Tu form a complex and stabilise one another, so loss or
      weakening of EF-Ts lowers both factors.

- name: Destabilised EF-Ts and EF-Tu Elongation Factor Pool
  biological_scale: MOLECULAR
  description: >-
    The steady-state levels of both EF-Ts and its partner EF-Tu fall in patient
    cells and in affected myocardium. Loss of EF-Tu as well as EF-Ts is why
    retroviral expression of either factor can rescue patient fibroblasts, and
    it means the defect is not only slower nucleotide exchange but a smaller
    pool of the factor that delivers aminoacyl-tRNA to the ribosome. In one
    patient the fibroblasts compensated by raising EF-Tu while the heart did
    not, which is offered as an explanation for tissue selectivity.
  locations:
  - preferred_term: mitochondrial matrix
    term:
      id: GO:0005759
      label: mitochondrial matrix
  evidence:
  - reference: PMID:17033963
    reference_title: "Distinct clinical phenotypes associated with a mutation in the mitochondrial translation elongation factor EFTs."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The steady-state levels of EFTs and EFTu in patient fibroblasts were reduced by 75% and 60%, respectively, and the amounts of assembled complexes I, IV, and V were reduced by 35%-91% compared with the amounts in controls."
    explanation: Quantifies the joint fall in EF-Ts and EF-Tu in patient fibroblasts.
  - reference: PMID:30911037
    reference_title: "Novel compound mutations in the mitochondrial translation elongation factor (TSFM) gene cause severe cardiomyopathy with myocardial fibro-adipose replacement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bioinformatics analysis predicted a destabilization of the EF-Ts variants complex with EF-Tu, in agreement with the dramatic steady-state level reduction of both proteins in the clinically affected myocardium, which demonstrated a combined respiratory chain enzyme deficiency."
    explanation: The same joint loss of both factors measured in explanted patient myocardium.
  downstream:
  - target: Impaired Elongation of Mitochondrial Translation
    causal_link_type: DIRECT
    description: >-
      Less GTP-bound EF-Tu limits aminoacyl-tRNA delivery to the mitochondrial
      ribosome, which is the elongation step.
    evidence:
    - reference: PMID:20435138
      reference_title: "Analysis of the functional consequences of lethal mutations in mitochondrial translational elongation factors."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "A mutation of EF-Ts(mt) (R325W) leads to a two-fold reduction in its ability to stimulate the activity of EF-Tu(mt) in poly(U)-directed polypeptide chain elongation."
      explanation: Links the defective EF-Ts to reduced EF-Tu-dependent chain elongation in a reconstituted system.

- name: Impaired Elongation of Mitochondrial Translation
  biological_scale: MOLECULAR
  conforms_to: "primary_oxphos_deficiency#Mitochondrial Translation Defect"
  description: >-
    EF-Ts is a shared component of the mitochondrial translation apparatus
    rather than a subunit-specific factor, so its loss throttles synthesis of
    all thirteen mtDNA-encoded polypeptides together. The translation defect
    is measured directly in patient fibroblasts and corrected by
    re-expression of EF-Ts.
  locations:
  - preferred_term: mitochondrial matrix
    term:
      id: GO:0005759
      label: mitochondrial matrix
  biological_processes:

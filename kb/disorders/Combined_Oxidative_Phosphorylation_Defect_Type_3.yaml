- name: Neuronal Energy Failure and Neurodegeneration
  biological_scale: TISSUE
  description: >-
    Neurological involvement spans a fatal neonatal encephalomyopathy, an
    infantile encephalocardiomyopathy with partially reversible lesions, a
    juvenile-onset Leigh syndrome with optic atrophy and peripheral
    neuropathy, childhood ataxia, and an early-onset hyperkinetic movement
    disorder with chorea, dystonia and myoclonus that can occur without basal
    ganglia lesions. Optic atrophy and sensorineural hearing loss recur across
    these presentations. The node bundles central and peripheral neural
    tissues because no source resolves the steps that make one neural
    structure fail before another.

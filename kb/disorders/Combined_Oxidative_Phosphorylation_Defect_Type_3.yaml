- name: Cellular Energy Failure
  biological_scale: CELLULAR
  conforms_to: "primary_oxphos_deficiency#Cellular Energy Failure in High-Demand Tissues"
  description: >-
    With the mtDNA-dependent complexes under-assembled, cells cannot meet ATP
    demand by oxidative phosphorylation and shift to glycolysis. The organs
    that fail are those with the highest and least flexible oxidative demand:
    heart, brain and, in the neonatal period, liver. Why one patient's disease
    is cardiac and another's is neurological or hepatic is not explained; the
    founding authors invoked genetic modifiers because the same homozygous
    allele produced different organ involvement.
  biological_processes:
  - preferred_term: aerobic respiration
    term:
      id: GO:0009060
      label: aerobic respiration
    modifier: DECREASED
  evidence:
  - reference: PMID:17033963
    reference_title: "Distinct clinical phenotypes associated with a mutation in the mitochondrial translation elongation factor EFTs."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The fact that the same mutation is associated with distinct clinical phenotypes suggests the presence of genetic modifiers of the mitochondrial translation apparatus."
    explanation: >-
      The energy deficit is shared, but which tissue fails differs between
      patients with the same genotype.
  - reference: PMID:24012549
    reference_title: "The effect of small molecules on nuclear-encoded translation diseases."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "Two antioxidants, ascorbate and N-acetylcysteine (NAC), significantly improved cell growth, ATP content and mitochondrial membrane potential and decreased levels of intracellular reactive oxygen species (ROS) in EFTs fibroblasts."
    explanation: >-
      Reports ATP content and membrane potential as measurable, improvable
      readouts in EF-Ts patient fibroblasts, implying a baseline energetic
      deficit in those cells.
  downstream:
  - target: Lactate Accumulation
    causal_link_type: DIRECT
    description: >-
      Glycolytic compensation converts accumulating pyruvate to lactate.
  - target: Mitochondrial Cardiomyopathy
    causal_link_type: DIRECT
    description: >-
      Cardiomyocytes depend on oxidative phosphorylation, and cardiomyopathy is
      the most frequently reported manifestation.
  - target: Neuronal Energy Failure and Neurodegeneration
    causal_link_type: DIRECT
    description: >-
      The developing and mature nervous system has high oxidative demand;
      neurological involvement ranges from neonatal encephalomyopathy to
      juvenile Leigh syndrome and movement disorder.
  - target: Hepatocellular Energy Failure
    causal_link_type: DIRECT
    description: >-
      Neonatal liver failure is reported in a homozygous p.Arg333Trp
      (R312W) family.

- name: Lactate Accumulation
  biological_scale: ORGANISM
  conforms_to: "primary_oxphos_deficiency#NADH Redox Imbalance and Lactic Acidosis"
  description: >-
    Lactate from glycolytic compensation accumulates in blood. Elevated lactate
    at presentation is reported in more than three quarters of patients and is
    present across cardiac, neurological and hepatic presentations, sometimes
    with raised pyruvate.
  evidence:
  - reference: PMID:35071363
    reference_title: "Case Report: Whole Exome Sequencing Identifies Compound Heterozygous Variants in TSFM Gene Causing Juvenile Hypertrophic Cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Lastly, based on the currently reported cases, more than 75% of patients with pathogenic TSFM variants have lactic acidosis on presentation."
    explanation: Pooled frequency of lactic acidosis across the reported TSFM patients.
  downstream:
  - target: Lactic acidosis
    causal_link_type: DIRECT

- name: Mitochondrial Cardiomyopathy
  biological_scale: TISSUE
  conforms_to: "primary_oxphos_deficiency#Mitochondrial Cardiomyopathy"
  description: >-
    The most frequently reported manifestation, and it takes several forms:
    concentric hypertrophic cardiomyopathy (the commonest), fatal in infancy in
    a p.Arg333Trp homozygote but stabilising into adolescence in a compound
    heterozygote; non-obstructive hypertrophic cardiomyopathy with
    childhood-onset ataxia; and in an adult, dilated cardiomyopathy with
    biventricular fibro-adipose replacement that required transplantation.
